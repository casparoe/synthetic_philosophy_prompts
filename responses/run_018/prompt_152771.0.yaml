  Okay, the user is prepping a seminar for analytic philosophy grad students familiar with Locke and Parfit but new to Buddhist philosophy. They want to focus on anatta as a live alternative to Western personal identity theories, using the two-truths framework. The key is to avoid historical surveys and instead present anatta conceptually. 

  Hmm, the user has very specific constraints: no Milindapanha chariot analogy (too common), must include soteriological stakes, and needs to preempt common misconceptions like nihilism or Parfit equivalence. They also want clarity on what to exclude (Abhidharma details, Mahayana debates) and want contested interpretations acknowledged.

  First, I need to structure this so the two-truths distinction lands before introducing anatta. If they jump straight to no-self without the conventional/ultimate split, students will absolutely conflate it with Hume or nihilism. The "carrying" thought experiment needs to: (a) be fresh (not the overused chariot), (b) show practical clinging/suffering, and (c) illustrate how conventional designation works despite emptiness. 

  *Pauses* The "river crossing" scenario feels right—someone anxiously guarding possessions mid-river highlights the irrationality of clinging without denying practical use of "I." It’s visceral, shows suffering from mistaken self-grasping, and sets up why recognizing anatta reduces dukkha. 

  For misconceptions, sequencing matters: 
  1. Nihilism (denial of personhood) will pop up immediately after introducing anatta—must defuse by stressing conventional functionality. 
  2. Parfit equivalence is trickier; they’ll spot similarities but miss the soteriological thrust. Need to contrast Parfit's descriptive continuity with Buddhism’s prescriptive aim to undo clinging. 
  3. Moral responsibility worries will surface last—address via conventional karma/ethics framed by wisdom. 

  The diagnostic question should force them to apply both truth levels. Asking "Why doesn’t anatta make promises meaningless?" reveals if they grasp provisional reality. If they answer solely in ultimate terms (e.g., "promises are empty too"), they’ve missed the point. 

  Must flag contested interpretations: Is anatta metaphysical (no self in aggregates) or therapeutic (a tool to reduce attachment)? Scholarship splits here—present both as live options. 

  *Checks exclusions* No Abhidharma lists, no Madhyamaka-Svatantrika debates. Keep it lean. Final thought: Emphasize that anatta isn’t a theory to adopt but a lens to examine experience. The river example’s anxiety makes that tangible.
answer: |-
  Here’s a structured 90-minute teaching sequence focused on positioning **anattā** as a live alternative within analytic personal identity debates, using the two-truths framework to avoid common collapses:

  ---

  ### **Teaching Sequence**  
  **Total: 90 mins**  

  #### **1. Framing the Problem (15 mins)**  
  - **Hook:** Contrast Locke’s memory criterion & Parfit’s reductionism with their unresolved tensions (e.g., "What matters?" vs. moral responsibility).  
  - **Stakes:** Pose the core problem: *Why does "self"-clinging cause suffering?* Link to philosophy’s practical aims (e.g., Parfit’s "impersonal reality" vs. Buddhism’s soteriological goal).  
  - **Misconception Preemption:** Briefly note that anattā ≠ nihilism or eliminativism.  

  #### **2. Introducing the Two Truths (20 mins)**  
  - **Core Foundation:** Distinguish **conventional truth** (*saṃvṛti-satya*): pragmatic, designational reality (e.g., "person," "table") vs. **ultimate truth** (*paramārtha-satya*): emptiness (*śūnyatā*) of inherent existence.  
  - **Key Move:** Emphasize this is *not* two realities but two valid perspectives on one reality.  
  - **Analogy:** **A river** (conventional: "I cross the same river"; ultimate: no "river essence" beyond dependent arising of water, banks, flow).  
  - **Why First?** Prevents misreading anattā as flat denial.  

  #### **3. Anattā via Ultimate Analysis (20 mins)**  
  - **Anchor Thought Experiment:** **"The Mid-River Burden"**  
    > *Imagine crossing a rushing river while carrying a heavy rock. Halfway across, you realize: "This rock is mine. *I* must protect it." Your anxiety intensifies—yet the rock’s weight risks drowning you. The conventional "I" (the crosser) is indispensable for action, but clinging to the rock *as "mine"* creates suffering.*  
  - **Analysis:**  
    - Conventional: Designation "crosser" enables action (survival).  
    - Ultimate: No "owner" *inherently separate* from the aggregates (body, sensation, perception, etc.). Clinging to "mine" is baseless and harmful.  
  - **Soteriological Stakes:** Anattā aims to dissolve *clinging* (to "I"/"mine"), not deny functional identity.  

  #### **4. Defusing Misconceptions (20 mins)**  
  - **Sequence & Defusals:**  
    1. **"Anattā denies persons exist!"**  
       → Defuse during **Two Truths**: "Persons" conventionally *do* exist as dependently designated (e.g., accountability, social roles). Anattā denies *inherent* selfhood.  
    2. **"This is just Parfit’s bundle theory!"**  
       → Contrast after **Anattā**: Parfit reduces to psychological continuity; Buddhism targets *clinging* to any continuum. Continuity ≠ grounds for "self."  
    3. **"Moral responsibility vanishes!"**  
       → Resolve via convention: Karma operates dependently (*pratītyasamutpāda*). Wisdom (ultimate) informs ethical action (conventional).  

  #### **5. Diagnostic Exercise (10 mins)**  
  - **Question:** *"If a monk breaks a promise, does anattā absolve him? Why/why not?"*  
  - **Reveals:**  
    - **Understanding:** Conventional reality upholds accountability (reputation, trust). Ultimate view prevents *identification* ("I am a betrayer") → reduces guilt-based suffering.  
    - **Misstep:** Answering solely with ultimate emptiness (→ nihilism) or rigid conventional self (→ eternalism).  

  #### **6. Contested Issues & Boundaries (5 mins)**  
  - **Settled:**  
    - Anattā is core to all Buddhist schools.  
    - Two-truths framework is central for interpreting anattā non-nihilistically.  
  - **Contested:**  
    - **Metaphysical vs. Therapeutic:** Is anattā primarily an ontology (no self *in* the aggregates) or a strategy to undo attachment?  
    - **Scope of Emptiness:** Does *everything* lack essence (Mahāyāna) or only persons (some Abhidharma)?  
  - **Exclusions:**  
    - Abhidharma lists (skandhas, dhammas).  
    - Mahāyāna critiques (e.g., Svātantrika vs. Prāsaṅgika).  
    - Historical evolution (e.g., Pudgalavāda).  

  ---

  ### **Why This Sequence Works**  
  - **Builds from Familiarity:** Starts with Western theories, introduces two-truths as new machinery.  
  - **Preempts Collapses:** Two-truths established *before* anattā blocks Hume/Parfit/nihilism readings.  
  - **Soteriological Anchor:** "Mid-River Burden" ties ontology to suffering/clinging.  
  - **Diagnostic Precision:** The promise question tests two-level comprehension.  
  - **Scholarly Transparency:** Flags key debates without oversimplifying.  

  This arc positions anattā as a distinct, actionable critique of self-clinging—grounded in philosophy yet irreducible to Western analogues.
