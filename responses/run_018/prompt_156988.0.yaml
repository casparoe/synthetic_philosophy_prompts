answer: |-
  Here's a concise decision tree taxonomy for institutional intergenerational discounting, focusing on conceptual structure and prioritizing philosophical coherence over policy specifics. It generates 7 distinct positions (1 empty node flagged).

  **Decision Tree: Philosophical Positions on Pure Time Preference in Intergenerational Investment**

  1.  **Does the non-identity problem make cross-generational welfare comparisons conceptually broken?**
      *   **YES → Go to Node A**
      *   **NO → Go to Question 2**

      **Node A: Non-Comparability (Parfit-Inspired Non-Aggregation)**  
      *Label:* Non-Identity Constraint  
      *Awkward Commitment:* Forbids aggregative welfare comparisons across generations entirely, potentially paralyzing *any* long-term investment justification based on future welfare gains.  
      *(Note: Skips Q2-Q4 as aggregation is deemed impossible)*

  2.  **Must social and individual discount rates diverge?**
      *   **YES → Go to Node B**
      *   **NO → Go to Question 3**

      **Node B: Divergent Rates (Pigouvian/Sen)**  
      *Label:* Social Opportunity Cost View  
      *Awkward Commitment:* Requires institutions to use a rate potentially decoupled from observable market behavior and individual savings preferences, demanding strong justification for paternalism towards the distant future.

  3.  **Does existential risk justify differential near/far-future treatment independently of pure preference?**
      *   **YES → Go to Node C**
      *   **NO → Go to Question 4**

      **Node C: Risk-Adjusted Declining Rate**  
      *Label:* Weitzman Declining Discount Rate (Risk-Driven)  
      *Awkward Commitment:* Justifies potentially very low/zero discounting for the far future based on catastrophic risk, while allowing higher near-term rates, creating discontinuity and complex modeling dependence on contested risk probabilities.

  4.  **Is delaying a benefit morally asymmetric with accelerating a harm?**
      *   **YES → Go to Node D**
      *   **NO → Go to Node E**

      **Node D: Harm Asymmetry Priority**  
      *Label:* Broomean Asymmetry Emphasis  
      *Awkward Commitment:* Prioritizes preventing future harms over providing future benefits at equivalent welfare levels, potentially skewing investment away from positive projects (e.g., infrastructure) towards pure risk mitigation, even if net welfare gain is identical.

      **Node E: Constant Pure Time Preference**  
      *Label:* Ramsey Optimal Growth (Standard)  
      *Awkward Commitment:* Applies a constant positive discount rate purely for time preference, implying the welfare of someone born later is *inherently* less valuable than an identical welfare level for someone born earlier, irrespective of circumstances.

      **Node F: Zero Pure Time Preference**  
      *Label:* Stern Zero Discounting (on Preference)  
      *Awkward Commitment:* Demands massive present sacrifice for far-future benefits (due to compounding), facing feasibility objections and potentially crowding out near-term obligations to the existing poor.

  **Empty Node & Explanation:**
  *   **Path: Q1=NO → Q2=NO → Q3=YES → Q4=YES** (Constant discounting rejected, divergence rejected, existential risk YES, asymmetry YES)
  *   **Why Empty?** **Incoherent.** Accepting existential risk (Q3=YES) as a *non-preference* justification for differential treatment inherently conflicts with simultaneously affirming a strong moral asymmetry (Q4=YES) *and* rejecting any divergence between social and individual rates (Q2=NO). If existential risk fundamentally alters the social calculus (justifying divergence from individual behaviour), holding Q2=NO becomes untenable. This combination tries to have independent risk justification while denying institutional divergence, creating internal tension. (Other paths lead to defined nodes).

  **Key Conceptual Structure:**
  The tree forces confrontation with fundamental meta-ethical (Q1) and aggregation (Q2) hurdles before addressing substantive justifications for differential weighting (Q3 - risk, Q4 - asymmetry). Positions rejecting pure time preference (Node F) or its constancy (Node C) must navigate these prior questions. The empty node highlights that accepting independent risk-based reasons logically requires accepting institutional divergence (Q2=YES).

  ---
  **Ready for committee discussion.** This isolates core philosophical tensions (non-identity, aggregation legitimacy, risk vs. preference, moral symmetry) relevant to setting institutional discount rates for future generations, avoiding climate-specific arguments while providing clear labels and critical weaknesses for each position.
