answer: |-
  ## Sonnet on Wittgenstein's Hinge

  He seeks a proof, scans skies for hidden gears,
  A cosmic cause that facts alone could show.
  (As if belief were doubt dissolved by years
  Of gathered data, stacking row on row).
  He digs for roots beneath devotion's tree,
  A theory lodged within the trembling soul,
  Demands a sign that eyes alone might see –
  Some trace where faith's foundations took their toll.
  **But see:** not evidence that makes this ground,
  **The hinge that swings the world into its place,**
  Where questions start, where weighing is unbound,
  Not proven true, but granting truth its space.
  So call it "blind"? That judgment falls apart –
  The frame itself sustains the searching heart.
  **The error missed? Mistaking ground for sky.**

  ---

  **Notes on Fidelity:**
  *   **Octave (Problem):** Builds the "hidden cause" misconception (lines 1-8) – searching skies ("proof"), cosmic cause, facts/data, roots beneath, theory in soul, visible signs ("trace").
  *   **Volta (Line 9 - "But see:"):** Explicit pivot marking the shift to the hinge concept.
  *   **Sestet (Solution):** Defines the hinge's role (lines 9-12) – "makes this ground," "swings the world," "granting truth its space," "Not proven true." Refutes "irrational" charge (lines 13-14) – "call it 'blind'? ... falls apart," "frame sustains the searching heart."
  *   **Final Couplet:** Precisely names the mistake the believer *isn't* making: confusing the foundational frame (ground) with a proposition *within* that frame about the world (sky). It's a category error, not an empirical one.
  *   **Language:** Avoids "language-game" explicitly, focuses on "hinge proposition" metaphorically ("hinge that swings the world"), "ground," "frame." Uses LW's core ideas: belief as framework, not hypothesis; enabling doubt/evidence; category difference.
  *   **Rhyme/Meter:** Strict ABAB CDCD EFEF GG. Iambic pentameter maintained.
