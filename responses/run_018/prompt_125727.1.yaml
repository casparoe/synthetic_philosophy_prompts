  I was arguing with my friends about Mary's room the other day, specifically after someone linked an old LessWrong thread on phenomenal concepts. I've come to think Jackson's knowledge argument doesn't actually bite, but my reason is kind of niche: Mary's 'learning' is best analyzed as acquiring a phenomenal concept, and I think phenomenal concepts are just demonstrative mental files applied to neural states — which means she already had all the physical knowledge, she just lacked the token concept. So physicalism survives, but only if we accept this demonstrative-file story and don't slip into eliminativism about experience, and only if we can't just seperate ability-knowledge from propositional knowledge here. What's your actual credence that Mary's case genuinely proves there's non-physical knowledge? Decompose it: the credence that phenomenal concepts work like demonstrative files, the credence that gaining such a file is genuinely new propositional knowledge rather than just a new ability, the credence that physicalism can accomodate these files without collapsing, and whatever other term you think belongs. Give me real numbers with one line each, combine them, and tell me which term you're least sure about. Don't hedge — I want a committed take that risks being wrong, not a survey of every position in the literature. And flag it straight if this framing is just redefining the problem away; I want that weakness named if it's there.
