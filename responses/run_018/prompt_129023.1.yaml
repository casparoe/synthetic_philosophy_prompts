answer: |-
  Here's a step-by-step decision procedure based on Adam Smith's Impartial Spectator, designed for 20-minute peer mediations. It forces reconstruction through three voices, includes bias checks, and has clear stopping points. **Bold = Action/Question** | *Italic = What Counts as Sufficient/Stop Signal*.

  **The 20-Minute Impartial Spectator Protocol**

  **Phase 0: Setup & Bias Check (2 mins)**
  1.  **State the Conflict:** "Tell me briefly what happened leading to this mediation." (*1-2 sentences each side*).
  2.  **Declare Any Personal Connection:** "I know [Name] from [Context]. I will actively compensate for this bias." (*Mandatory declaration. If connection is VERY close/stakes high, you MUST flag for panel lead - HARD STOP*).

  **Phase 1: Reconstruct the Facts & Feelings (Spectator Voices) (8 mins)**
  3.  **"Hurt" Spectator Voice:** "[Name who felt wronged], help me understand *exactly* what happened and how it impacted you. What made it hurtful/unfair?" (*Focus on specific actions & their effect. "It felt disrespectful when..." is sufficient; "They're always awful" is not - STOP & refocus*).
  4.  **"Actor" Spectator Voice:** "[Name who acted], now help me understand *exactly* what you did and *why* you thought it was reasonable/necessary at that moment." (*Focus on intent & reasoning. "I thought it was okay because..." is sufficient; "They deserved it" is not - STOP & refocus*).
  5.  **"Rule-Knower" Spectator Voice (You Channeling):** "Based *only* on what we've heard and the school handbook, what are the relevant facts and rules? Ignore who's involved." (*State objective facts & rule violations neutrally. E.g., "Homework copying is prohibited. Meme posted publicly targets a staff member." STOP if facts are disputed & unresolvable - flag for admin*).

  **Phase 2: Impartial Sympathy Test (Reasoning Check) (8 mins)**
  6.  **Test "Hurt" Reasoning:** "Could an impartial student spectator, knowing only the facts and rules, *sympathize with the reasoning* behind why [Hurt] feels wronged? Not just their feelings, but *why* they believe the action was unjustified?" (*YES: Reasoning links action to clear harm/rule violation. NO: Reasoning is solely personal dislike or disproportionate. STOP if NO - action likely justified*).
  7.  **Test "Actor" Reasoning:** "Could that same impartial spectator *sympathize with the reasoning* behind why [Actor] acted that way? Not just their feelings, but *why* they believed their action was acceptable/necessary in that moment?" (*YES: Reasoning shows understandable (not necessarily right) motivation given context (e.g., crisis, perceived injustice). NO: Reasoning is purely malicious, lazy, or ignores clear alternatives. STOP if NO - action likely unjustified*).
  8.  **Test "Rule-Knower" Balance:** "Could an impartial spectator, knowing *only* the rules and facts, sympathize with the reasoning that *either* side's actions were the *most* reasonable way to handle the situation *given school norms*?" (*YES: Action fits within grey areas of rules or addresses a rule gap reasonably. NO: Action is blatant violation with no mitigating rule-compatible reasoning. STOP if NO - rule violation is clear*).

  **Phase 3: Decision & Recommendation (2 mins)**
  9.  **Synthesis:** If ALL THREE TESTS (Steps 6,7,8) yielded **YES**:
      *   *Sufficient:* A compromise solution exists that all spectators could sympathize with as *reasonably* fair. Propose it. (*e.g., "Both agree copying was wrong; Actor apologizes & helps Hurt rewrite homework; both attend study skills session."*)
  10. **Failure Flag:** If ANY TEST yielded **NO**:
      *   *Hard Stop:* Consensus via spectator reasoning is impossible. State why. (*e.g., "The impartial spectator cannot sympathize with the reasoning behind copying the homework as necessary, even with the crisis, as other options existed per school rules. This requires administrative review." OR "The impartial spectator cannot sympathize with the reasoning that the meme caused no harm, as public satire targeting staff breaks school climate rules."*)
  11. **Values Threshold:** If ALL TESTS are **YES** but your *gut says "jerk move"* (e.g., Meme case):
      *   *Stop:* The procedure validated the *reasoning* as understandable/sympathizable per school norms, but it may violate unwritten values (respect, kindness). State this explicitly in the recommendation. (*e.g., "While the satire defense is understandable under free expression rules and no malicious intent was proven, publicly targeting a teacher caused harm and undermined respect. The action, while not expellable, was inappropriate. We recommend a formal apology and digital citizenship workshop."*)

  **Applied to Your Cases:**

  1.  **Homework Copying / Mental Health Crisis:**
      *   **Hurt:** (Institution/Teacher). Reasoning: Undermines academic integrity, unfair to others. *Spectator: YES - clear rule violation.*
      *   **Actor:** Reasoning: Wanted to help friend in acute crisis, felt no other option. *Spectator: YES - motive is sympathizable (helping).*
      *   **Rule-Knower:** Copying violates rules. Mental health crisis is a fact. *Spectator: YES - rule is clear, crisis context matters.*
      *   **Synthesis (All YES):** Compromise possible. Recommendation: Acknowledge crisis but rule broken. Actor helps friend rewrite honestly. Both attend counseling/study skills session. Apology to teacher. Suspension too harsh given context. *Values Note:* Helping friend is good, but method was wrong.
      *   *Why not Hard Stop?* Actor reasoning passes the sympathy test (helping in crisis), even if the action was ultimately wrong.

  2.  **Viral Teacher Meme / Satire:**
      *   **Hurt:** (Teacher). Reasoning: Humiliated, targeted personally, harmed professional reputation. *Spectator: YES - understandable harm from public ridicule.*
      *   **Actor:** Reasoning: Critiqued grading system (satire), not teacher personally; intended as humor/free speech. *Spectator: YES - intent to critique *system* is sympathizable reasoning, even if execution poor.*
      *   **Rule-Knower:** Public content targeting staff likely violates school climate/social media rules. Satire is a grey area. *Spectator: YES - rule against harmful targeting exists; satire defense is a plausible reasoning angle.*
      *   **Synthesis (All YES):** Compromise possible. BUT...
      *   **Values Threshold:** *Gut "Jerk Move" Triggered.* Recommendation: "While the intent to critique grading via satire is understandable and may fall under protected expression, the public nature and impact caused significant harm to the teacher. The action violated school climate expectations. Expulsion is disproportionate. We recommend: Removal of meme, formal apology to teacher, mandatory digital citizenship/communication workshop, probation. This was disrespectful, even if technically satirical." *The procedure separates the reasoning (sympathizable critique intent) from the outcome (harmful jerk move).*

  **What This Procedure CANNOT Do:**

  1.  **Fix Power Imbalances:** A bullied kid vs. a popular kid. The "spectator" might sympathize with the reasoning of the powerful actor more easily. *You MUST be hyper-aware of this.*
  2.  **Address Severe Issues:** Crimes, threats, serious harassment, discrimination. *HARD STOP - Immediate referral to admin.*
  3.  **Create Perfect Justice:** It aims for *reasonably sympathizable* fairness under school norms, not abstract moral perfection.
  4.  **Resolve Deep Rooted Conflicts:** 20 mins won't fix long-standing feuds. It resolves *this specific incident* based on spectator reasoning.
  5.  **Override School Rules:** If the Rule-Knower Spectator says it's a clear, major violation (Step 8 = NO), you can't ignore it.
  6.  **Force Agreement:** You write the recommendation. They sign it *based on the reasoning presented*. It doesn't guarantee they *like* it, just that the process was followed.

  **Key to Speed:** Phrase questions *exactly* as written. Control time rigidly (2-8-8-2). Focus on *REASONING* (Step 6/7), not just feelings. The "Rule-Knower" voice (Step 5) is YOUR anchor to objectivity. Trust the "Hard Stop" and "Values Threshold" flags. This forces structure onto the "fair vibes." Good luck! Smith would be impressed.
