  First, I need to recall what luminosity and the KK principle are. Luminosity means that if you're in a state of knowing, you can always tell you're in that state—it's self-evident. The KK principle says that if you know something, then you know that you know it. The character is using both to argue she never genuinely wonders if she knows something.

