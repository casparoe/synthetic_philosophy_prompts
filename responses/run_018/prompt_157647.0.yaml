  Other points: Must acknowledge how Aristotle contradicts himself in practice (e.g., training slaves requires appealing to their reason). Should discuss how he avoids reducing slaves to tools despite dehumanizing logic. And note that his "barbarian" category maps suspiciously to non-Greeks - exposing cultural bias. 

