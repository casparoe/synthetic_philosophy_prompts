answer: |-
  Argentina's bifurcated practice presupposes a dualist ontology: gender identity is treated as a *subjective, institutional status kind* grounded in personal autonomy and social recognition within civil domains, while "biological sex" is treated as an *objective, natural kind* grounded in immutable physical characteristics with inherent relevance to security and epidemiology. This strictly requires viewing these categories as fundamentally distinct, operating in separate institutional spheres with different legitimizing authorities (self-declaration vs. birth assignment). It accommodates, but does not strictly require, biological essentialism for sex in the security/health sphere, as it could theoretically rest on purely administrative continuity or perceived functional necessity without deeper philosophical commitment.

  Replacing this with a *consistent naturalism* (sex/gender as biological) would force abolition of self-identification, requiring medical/judicial gatekeeping for legal gender changes and mandating prison/statistics solely by birth assignment. Conversely, *consistent normativism* (sex/gender as social/institutional) would necessitate eliminating "biological sex" classifications in all official contexts. Prisons would assign based on self-declared gender (with safety protocols decoupled from birth assignment), and criminal statistics would categorize victims/perpetrators by self-identified gender, potentially supplemented by other relevant variables. Both consistent views demand eliminating the current institutional duality, either subsuming gender under biology or dissolving "biological sex" as an official category.

