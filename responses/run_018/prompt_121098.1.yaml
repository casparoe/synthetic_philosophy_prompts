prompt: |-
  I write historical fiction, mostly set in the long nineteenth century, and over some fifteen years of reading in and around abolition, duelling, and the anti-footbinding campaigns, I have drifted into holding a view about how moral revolutions happen that I now lean on the way one leans on a load-bearing assumption. Call it the dishonour thesis: these practices ended when they became dishonourable, and moral argument — argument from a principle to a conclusion about what one may not do — was causally inert in the transition, serving afterwards as rationalisation and as a way of coordinating a code that had already shifted for other reasons. I take the philosophical ancestry of this to be Bernard Williams's chapter on morality as the peculiar institution, in *Ethics and the Limits of Philosophy*, where the thought is that there is no argument the slaveholder was in a position to be rationally compelled by and that describing his outlook as a set of moral beliefs awaiting refutation misdescribes it; and the developed version to be Kwame Anthony Appiah's *The Honor Code: How Moral Revolutions Happen*, where the mechanism is honour — a practice dies when continuing it costs you the regard of people whose regard you need.

  I want to know what would count against this, and I would like the defeaters ranked, fatal to merely awkward, with an honest attempt to say what a defender of the thesis should concede rather than what its critics allege. A few considerations I have already turned over, partly so that you can tell me which of them are real and which are evasions I have dressed up as scruples.

  First, the one that worries me most: the thesis may be circular as stated. "The practice ended when it became dishonourable" explains nothing unless the honour-status of a practice can be traced independently of the practice's decline. So I would like a list of tracers that do not simply re-describe the outcome — the vocabulary of scandal and of the gentleman in pamphlets and private correspondence, the behaviour of juries in duelling prosecutions, the reprint history of codes of conduct, the age at which girls' feet were first bound by birth cohort, shipping and insurance records, the tone of parliamentary testimony — and an account of what pattern across them would be decisive rather than merely suggestive.

  Second, a distinction I suspect damages the thesis more than it appears to: perhaps what changed people was not argument from principle but redescription — testimony, arithmetic, images, the visible facts about the Middle Passage and about the bodies of bound feet. If so, what was inert was not argument as such but normative argument, and I am unsure whether conceding that is a small repair or a collapse into the rival view. Relatedly, the arguments that seem to have worked were internal ones, framed in a vocabulary the audience already accepted — Christian stewardship, or national weakness — and if all effective arguments are internal, then honour may be nothing more than the name of the local internal vocabulary, and my thesis may have quietly become the view it was meant to replace.

  Third, two predictions I think the thesis is genuinely committed to, which I would like tested rather than assumed. If honour is the mechanism, then suppressing a practice while leaving the honour structure intact should leave the disposition available for re-expression elsewhere — which is what the psychological literature on cultures of honour in the American South seems to find, in insult physiology, regional patterns of violence, and the shape of contemporary self-defence law. And if honour is the mechanism, revolution should show tipping-point dynamics concentrated among those whose standing is at stake, whereas an argument-driven story predicts diffusion tracking exposure to texts and preaching rather than exposure to peers. In each case: what pattern would I have to give up the thesis over, and what pattern would a defender shrug at?

  Fourth, the insulation question. There are only a handful of well-documented cases, they are studied retrospectively, and "honour" is elastic enough to be fitted to whatever local currency of regard was in play. Has the thesis been qualified into something that cannot lose? If it has, say whether that is fatal for a causal claim about singular historical sequences or merely the normal condition of such claims — and tell me what a case would have to look like for the thesis to be straightforwardly falsified: a practice whose honour-status collapsed while the practice continued, or one that ended while remaining honourable to those who abandoned it.

  One last thing, which is the reason I am asking as a novelist rather than as a reader of philosophy. My own occupational evidence supports the thesis and I do not trust it. The scenes that move readers are scenes of shame, exposure, and forfeited standing; I have never written a convincing scene in which a character abandons a practice because someone reasoned him out of it, and such scenes read, to me and to my editors, as a mouthpiece reciting a conclusion arrived at elsewhere. This may be because the novel is the natural instrument of an honour mechanism, since it works directly on regard — but that is exactly the sort of self-flattering explanation I should discount, and the alternative is that conversion by argument is simply undramatic rather than rare. So: how much weight should a craft observation of that kind bear, and does the thesis, if it survives your examination, actually license a rule of craft — never show a character being argued out of a moral view — or would adopting that rule be the novelist's version of the same unfalsifiability you have just been asked to diagnose?
reasoning: |-
  Hmm, this is a fascinating and complex query from a historical fiction writer. They've developed what they call the "dishonour thesis" about moral revolutions, influenced by Bernard Williams and Kwame Anthony Appiah, which posits that practices like slavery, dueling, and foot-binding ended primarily when they became dishonorable rather than through moral argumentation. They're asking for critical examination of this thesis and want defeaters ranked by severity.

  The writer raises several sophisticated concerns: potential circularity in defining dishonor, the role of non-normative evidence like testimony and images, predictions about cultural persistence and tipping points, and concerns about unfalsifiability. They also mention their craft observation that scenes of shame work better in novels than scenes of rational conversion.

  I should address each concern systematically while maintaining the philosophical-historical rigor they clearly appreciate. For the circularity issue, I need to propose concrete historical tracers of honor status that are independent of the practice's decline - things like jury behavior in dueling cases, shipping insurance records, or age-of-binding statistics. The key is identifying patterns where honor changes precede behavioral change.

  Regarding the role of "redescription" versus argument, this is crucial. I should distinguish between normative arguments (which they claim are inert) and visceral evidence that changes perception. The internal argument point is particularly tricky - if honor is just the local vocabulary, the thesis becomes tautological. This might be a medium-severity defeater requiring refinement of the thesis.

  For the predictive elements, I can point to empirical research like the American South honor culture studies showing how honor dispositions persist despite practice suppression. The tipping point prediction could be tested against abolitionist membership rolls or dueling decline data. A fatal pattern would be moral change diffusing through texts rather than peer networks.

  On unfalsifiability, I should suggest clear falsification scenarios: a practice losing honor status but continuing, or ending while still being considered honorable. The Haitian Revolution case might serve as a counterexample where honor persisted despite practice change.

  Finally, for their craft concern, I'll validate their observation while noting its limits - the novel naturally excels at depicting shame but may not reflect all real-world change mechanisms. Adopting a "never show rational conversion" rule would ironically mirror the unfalsifiability problem they're worried about.

  Throughout, I'll maintain their preferred terminology ("fatal/awkward" ranking) and focus on what a thesis defender should concede rather than just listing criticisms. The response should balance philosophical rigor with practical utility for their writing.
answer: |-
  Your "dishonour thesis" is a powerful and provocative lens, rigorously articulated. Let's dissect its potential weaknesses, ranking defeaters from fatal to awkward, and specifying what a defender should concede. I'll integrate your considerations directly.

  **Defeaters Ranked (Fatal to Awkward):**

  1.  **The Insulation/Unfalsifiability Problem (Potentially Fatal, Requires Concession & Refinement):**
      *   **The Challenge:** You rightly identify the core peril. If "honour" is defined solely by the outcome (the practice ended) via whatever local currency of regard existed, and we only have a few cases studied retrospectively, the thesis becomes unfalsifiable. Any successful moral revolution *must*, by this definition, have involved a shift in honour-status. "Honour" becomes an empty placeholder for "whatever social force caused the change."
      *   **What Must Be Conceded:** A defender *must* concede that the thesis, as initially stated, risks tautology. "It became dishonourable" cannot *simply* mean "it stopped happening." The burden is firmly on the defender to provide *independent* tracers of honour-status *before* the practice's significant decline.
      *   **Falsification Scenarios:**
          *   **Scenario A (Fatal):** A well-documented case where the *honour-status collapses* (using robust independent tracers) while the *practice continues robustly* due to strong countervailing incentives (e.g., immense profit, state enforcement, perceived existential threat). The Haitian Revolution arguably created a crisis of honour *for enslaved people* regarding their status, but the *institution* of slavery persisted fiercely elsewhere despite this profound challenge to its honourability *in the eyes of the enslaved and abolitionists*. Did the honour-status *among slaveholders* truly collapse *before* economic/political/military pressures forced change? This needs careful tracing.
          *   **Scenario B (Severely Damaging):** A practice *ends* while *remaining clearly honourable* to the group abandoning it, driven overwhelmingly by factors like catastrophic economic cost, devastating military defeat directly linked to the practice (e.g., a war lost *because* of duelling decimating the officer corps), or coercive state intervention *without* a preceding shift in the relevant honour culture. The decline of formal courtly etiquette might fit – did it become *dishonourable*, or simply inconvenient and outdated?
      *   **The Repair:** The thesis survives only by embracing your list of **independent tracers rigorously**:
          *   **Crucial Pattern:** The shift in these tracers (e.g., surge in "scandal" language *in private correspondence* targeting practitioners, juries *systematically* nullifying duelling laws *before* prosecutions dwindle, sharp *decrease* in age of first binding *preceding* widespread abandonment, insurance premiums rising *specifically* due to reputational risk before legal/economic shifts) must demonstrably *precede and predict* the behavioural decline, *not* just correlate or follow it. The pattern must be decisive, showing the *withdrawal of regard* as a primary driver initiating change, not just reflecting it.

  2.  **The "Internal Argument is Just Honour in Disguise" Collapse (Severe, Requires Careful Distinction):**
      *   **The Challenge:** Conceding that "redescription" (testimony, images, visceral facts) or *internal* arguments (using the audience's *own* values – Christian stewardship, national strength, masculine virtue) *were* causally effective seems necessary. But if "honour" is defined as adherence to the "local internal vocabulary," then *any* effective appeal *is* an honour appeal by definition. This collapses the thesis into triviality: "Moral revolutions happen when people change their minds based on things they care about." It abandons the core claim about the *specific mechanism* (loss of regard from needed peers) vs. other mechanisms (e.g., cognitive dissonance from facts, reinterpretation of principles).
      *   **What Must Be Conceded:** A defender *must* concede that **normative argument framed internally *can* be a potent catalyst, *not* merely inert rationalization.** Appiah's examples *rely* on this (Wilberforce using evangelical Christianity, Chinese reformers using nationalism).
      *   **The Distinction & Repair:** The thesis survives by arguing that **internal argument/redescription is *necessary but insufficient*.** Its *power* comes from how it *reshapes the social landscape of regard*. The key mechanism remains the *threat or reality of losing the esteem of a relevant reference group*.
          *   *Why did the internal argument work **then** and **there**?* The thesis argues it's because it successfully linked the practice to *dishonour* within that group's existing framework, making continuation socially costly.
          *   *What's inert?* Abstract, purely external moral argument ("This violates Kant's Categorical Imperative") disconnected from the audience's existing values and social context. It doesn't engage the engine of regard.
          *   **Concession:** Internal argument/redescription is a primary *tool* for *changing* honour-status. But the *mechanism* of change is still the *social consequence* (loss of regard) triggered by that changed perception.

  3.  **The Circularity Trap (Serious, Mitigated by Independent Tracers):**
      *   **The Challenge:** As stated, "it ended when it became dishonourable" *is* circular if dishonour is inferred solely from the ending. Your worry is valid.
      *   **What Must Be Conceded:** Without independent tracers (as detailed in Point 1), the thesis *is* circular and vacuous.
      *   **The Repair:** The independent tracers *are* the solution. If you can robustly demonstrate a shift in the *indicators of honour-status* (scandal language, jury nullification, binding age, insurance costs, *public* shaming rituals, changes in conduct manuals) **preceding and correlating with** the decline of the practice, and crucially, *explaining variations* in its decline (e.g., duelling declines faster in regiments/regions where these tracers shift first), the circularity is broken. The tracers define "dishonourable" *operationally* and independently. The pattern must be *decisive* – not just suggestive anecdotes, but a quantifiable, traceable social shift in the currency of regard.

  4.  **Failed Predictions (Awkward to Damaging, Depending on Evidence):**
      *   **Prediction 1 (Displacement):** "Suppressing a practice while leaving the honour structure intact should leave the disposition available for re-expression elsewhere."
          *   **Falsifying Pattern:** If suppression (e.g., strict anti-dueling laws) *eliminates* the honour-driven disposition entirely *without* re-expression in analogous violent defence of status *in the same population*, especially if accompanied by a demonstrable shift in the underlying honour culture itself (not just the suppressed practice).
          *   **Defender's Shrug:** If re-expression is subtle, context-dependent, or occurs in non-violent status competitions. The Southern US case is strong evidence *for* the thesis; finding *no* such displacement where honour culture was supposedly intact would be awkward but perhaps explicable by other factors.
          *   **Concession:** The thesis predicts *potential* for re-expression, not its inevitability or specific form. Strong countervailing forces (e.g., powerful centralized state, economic shifts) might contain it.
      *   **Prediction 2 (Tipping Points vs. Diffusion):** "Revolution should show tipping-point dynamics concentrated among those whose standing is at stake, whereas argument-driven story predicts diffusion tracking exposure to texts/preaching."
          *   **Falsifying Pattern:** Clear, documented evidence that abandonment *diffused* linearly based on exposure to key texts/sermons (e.g., maps showing Quaker communities abandoning slavery first, then spreading via their publications, *regardless* of local elite peer networks), *without* a tipping point dynamic within high-status groups whose regard was crucial. Or, abolition taking root *first* in isolated intellectuals with high text exposure but low social standing, *not* among the elite whose regard mattered for the honour shift.
          *   **Defender's Shrug:** Diffusion *within* the relevant status group, driven by peer influence, mimicking text-driven spread. Or, texts/sermons acting as the *catalyst* for peer discussions that *then* trigger the tipping point. Tipping points are inherently messy to identify precisely.
          *   **Concession:** Texts/preaching are often the *spark* or *fuel* that enables the honour mechanism (reshaping perceptions of regard) within the relevant peer group. The thesis doesn't deny their role as information/argument carriers; it denies they work *in isolation* from the social context of regard. The key prediction is that *adoption* concentrates where status is on the line and follows peer-driven, potentially non-linear dynamics *within that group*, rather than simple intellectual conversion via reading.

  5.  **The Novelist's Craft Observation (Suggestive, Not Decisive Evidence):**
      *   **Weight:** This is **valuable heuristic evidence, not proof**. It suggests the honour mechanism might be more *dramatically potent* or *psychologically resonant* in depicting change, aligning with the thesis. Your inability to write convincing rational-argument scenes *could* reflect reality (argument being less direct) *or* the inherent difficulty of making abstract reasoning dramatically compelling. Your editors' agreement adds weight, suggesting it's not just your personal bias.
      *   **Danger of Discounting:** You are right to be wary of self-flattery ("novels naturally show honour best"). The alternative ("rational conversion is undramatic, not rare") is plausible. Real conversion often involves messy internal conflict, doubt, and social pressure, not just syllogisms – which *can* be dramatic!
      *   **Craft Rule?** Adopting a **hard rule "never show a character being argued out of a moral view" would indeed be the novelist's unfalsifiability trap.** It would force every change into the honour mould, preventing exploration of other, possibly rarer or more complex, mechanisms. It mirrors insulating the thesis.
      *   **Thesis Licensing Craft?** A *surviving* thesis doesn't *license* this rule, but it *supports* focusing on honour/shame/regard as a *primary and highly effective* dramatic engine for moral change in your chosen period. It suggests that depicting the *social cost* of holding a view (loss of standing, exclusion, ridicule, shame) will likely be more visceral and credible to readers *for these kinds of seismic shifts* than depicting a purely intellectual epiphany. **Prioritize honour dynamics, but don't outlaw other paths if the story demands them.** Show characters grappling with arguments, but make the *stakes* tangible through the threat to their social self.

  **Conclusion for the Defender:**

  Your thesis is robust but not invulnerable. To defend it effectively, you **must**:

  1.  **Embrace and rigorously deploy independent tracers** of honour-status to break circularity and insulation.
  2.  **Concede the vital catalytic role of internal argument/redescription** but insist its *causal power* flows *through* reshaping the social economy of regard (the core mechanism).
  3.  **Accept that the predictions (displacement, tipping points) are probabilistic tendencies**, not iron laws, and be prepared to explain deviations.
  4.  **Acknowledge that the craft observation supports, but doesn't prove, the thesis' psychological resonance**, and avoid letting it become a creative straightjacket.

  The "dishonour thesis" remains a compelling and highly plausible explanation for the dynamics of these specific moral revolutions. Its power lies in its focus on the deeply social and psychological engine of regard. Its survival depends on demonstrating that "honour" is more than just a synonym for "cause," identifiable *before* the fact through its tangible social footprints. Keep digging into those tracers – your novelist's eye for social detail is your best tool for testing and refining this powerful idea.
