answer: |-
  Here's your rigorous spec sheet for evaluating biological function theories, prioritizing conceptual clarity and biological fidelity. Desiderata are grouped by type, with tensions flagged explicitly.

  ---

  ### **I. Core Cases to Cover** (Non-negotiable coverage)
  1. **Normal Operation**: Explain why a heart *typically* functions to pump blood, not produce sounds.  
     *Why*: Baseline for defining function vs. incidental effect.  
  2. **Clear Malfunction**: Account for a heart valve failing to close, despite current causal contributions (e.g., vibrating audibly).  
     *Why*: Must distinguish *broken function* from *non-function*.  
  3. **Accidental Side-Benefits**: Explain why a beaver dam’s erosion control isn’t a "function," even if it benefits ecosystems.  
     *Why*: Exclude fortuitous effects not under selection.  
  4. **Evolutionary Novelty**: Explain novel traits (e.g., human writing) or repurposed structures (e.g., feathers for flight).  
     *Why*: Functions can emerge without prior lineage history.  
  5. **Borrowed Function (HGT/Symbiosis)**: Explain gut microbes digesting lactose in humans despite evolving in bacteria.  
     *Why*: Function isn't always tied to *host* lineage history.  
  6. **Underperformance**: Organs functioning sub-optimally (e.g., vestigial eyes in cavefish).  
     *Why*: Function persists even when inefficient.  
  7. **Overperformance**: Organs outperforming original selected effect (e.g., human brains enabling spaceflight).  
     *Why*: Functions can exceed evolutionary origins.

  ---

  ### **II. Critical Distinctions to Maintain**  
  1. **Proper Function vs. Current Causal Contribution**:  
     - *Pumping blood* (function) vs. *producing EKGs* (side effect).  
     *Why*: Avoids conflating design with happenstance.  
  2. **Selected Effect vs. Fitness Contribution in Context**:  
     - *What trait X was selected for* vs. *how X happens to boost fitness now*.  
     *Why*: Exaptations ≠ original functions; environments change.  
  3. **Dysfunction vs. Mere Absence**:  
     - A *broken* insulin receptor (dysfunction) vs. lacking wings (no function).  
     *Why*: Essential for pathology definitions.

  ---

  ### **III. Biological Results to Respect**  
  1. **Developmental Plasticity**: Phenotypes shaped by environment (e.g., diet-induced caste in ants).  
     *Why*: Functions can arise without genetic change.  
  2. **Exaptation**: Traits co-opted for new roles (e.g., feathers for thermoregulation → flight).  
     *Why*: Functions shift without redesign.  
  3. **Convergent Evolution**: Same function from non-homologous traits (e.g., camera eyes in squid vs. humans).  
     *Why*: Function isn’t reducible to ancestry.  
  4. **Microbiome Redundancy**: Multiple species performing identical functions (e.g., cellulose digestion in herbivores).  
     *Why*: Function is role-based, not lineage-bound.

  ---

  ### **IV. Puzzles to Resolve**  
  1. **Swampman**: Organism identical to humans but formed by chance (no selection history). Does its heart *function* to pump blood?  
     *Tension*: Forces choice between history and causal role.  
  2. **Overdesigned Organs**: Human cognition enabling math—far exceeding selective pressures. Is math a "function"?  
     *Tension*: Original selection vs. current capacity.  
  3. **Engineered Symbionts**: Bacteria inserted into hosts to detoxify pollutants—never selected *in situ*. Function?  
     *Tension*: Blurs history/role boundaries.

  ---

  ### **Theoretical Tensions (Jointly Unsatisfiable Desiderata)**  
  - **History vs. Novelty**: Etiological accounts struggle with (4)/(7); causal-role struggles with (2)/(3).  
  - **Malfunction vs. Plasticity**: Defining "malfunction" in plastic traits (e.g., is a "normal" low-oxygen lung in high-altitude natives dysfunctional?).  
  - **Borrowed Function vs. Selected Effect**: If a gene’s function *only* depends on host selection history, HGT cases (5) break.

  ---

  ### **Brief Theory Scores**  
  | **Desideratum**       | **Etiological** | **Causal-Role** |  
  |------------------------|-----------------|----------------|  
  | Normal Operation       | ✅              | ✅             |  
  | Malfunction            | ✅              | ❌ (no norm)   |  
  | Side-Benefits          | ✅              | ❌ (overcounts)|  
  | Evolutionary Novelty   | ❌              | ✅             |  
  | Borrowed Function      | ❌ (host bias)  | ✅             |  
  | Swampman               | ❌              | ✅             |  
  | Exaptation             | ⚠️ (retroactive)| ✅             |  

  ---

  ### **Weakest Desideratum & Falsifiability**  
  - **Least Committed**: **Overperformance (I.7)**. Is outperforming ancestral selection *still* "function"? Or just useful capacity?  
  - **Empirical Threat**: **Synthetic Symbionts** performing critical host functions *without coevolution*. If hosts instantly depend on them (e.g., engineered nutrient synthesis), causal-role may better capture "function" than history.  
  - **Failure Point**: **Microbiome Redundancy**. If functions depend *only* on current contributions (causal-role), can we say a redundant microbe is "malfunctioning" if it stops? Etiological handles this better.  
  - **Reasoning Vulnerability**: Assuming horizontal gene transfer (HGT) functions are "borrowed" *rather than host-selected*. If HGT genes undergo rapid selection *in host*, etiological accounts may co-opt them, collapsing distinction (5).

  ---

  ### **Conclusion**  
  Etiological theories (Millikan, Neander) excel at **malfunction, history, and avoiding teleology** but fail novelty/HGT. Causal-role (Cummins) handles **plasticity, novelty, and systems biology** but conflates function with any benefit. **Hybrid approaches** (e.g., "modern history" accounts) are emerging, but no theory aces all desiderata. Your choice depends on whether you prioritize **explanatory depth** (etiological) or **empirical applicability** (causal-role). For cutting-edge biology (HGT, synthetic ecology), causal-role is more flexible—but at the cost of normativity.
