  **MetroWest Assurance Group**  
  PO Box 11420, Hartford, CT 06111  
  1-800-555-2837 | metrowestassurance.com  

  October 26, 2023  

  Mr. Arthur Finch  
  12 Philosopher’s Way  
  Athens, GA 30606  

  **Re: Claim # MW-2023-09-1742**  
  Policy # H07-4CX9982  
  Date of Loss: September 12, 2023  

  Dear Mr. Finch:  

  We have completed our investigation regarding your claim for the alleged destruction of one (1) clay statue ("The Thinker, Reclining") pursuant to the above-referenced homeowners' policy. After careful review of the submitted documentation, including your sworn statement and photographic evidence depicting the displaced matter, we must deny coverage for this loss. Our determination rests on a precise ontological analysis of the entities involved and the terms of your policy.  

  Per your statement, on September 12, 2023, the item in question was displaced from its pedestal by a domestic feline ("Whiskers"), resulting in its deformation ("squashing"). You assert this constitutes a covered "direct physical loss" to covered personal property. However, our analysis distinguishes two materially coincident but ontologically distinct objects implicated in this event:  

  1.  **Parcel of Amorphous Clay (Lump #A):** This is the *base matter*, a specific quantity of mineral compounds (primarily hydrated aluminum silicates) existing prior to its configuration as "The Thinker, Reclining." Its persistence conditions are governed by the sortal *portion of clay*. Under this sortal, identity is preserved through changes in shape, arrangement, or location, provided the matter itself remains substantially intact.  
  2.  **"The Thinker, Reclining" (Statue #S):** This is an *artefactual object*, brought into existence only when Lump #A was deliberately arranged into a specific, recognisable form on or about August 15, 2023. Its persistence is governed by the sortal *statue*. Its identity is contingent upon maintaining that specific form or configuration essential to being *that particular statue*.  

  Critically, Lump #A and Statue #S, while materially coincident from August 15, 2023, until the incident, are not identical. They possess different historical properties (Lump #A existed prior to August 15th; Statue #S did not) and crucially, different *modal* and *persistence* properties. Lump #A could survive being flattened; Statue #S could not. (We must note parenthetically that any monistic view conflating the two, while perhaps intuitively appealing to the layperson, is philosophically untenable and irrelevant to the contractual terms herein.)  

  The incident described constitutes the *destruction of Statue #S*. Its essential form was irreversibly compromised, causing Statue #S to cease to exist as a distinct artefact. However, Lump #A persists. The photographic evidence clearly shows the material—the very clay itself—remains present on your premises. It has undergone a change in shape ("squashing"), but this alteration does not constitute the "direct physical loss" of *Lump #A*. The matter retains its identity under its governing sortal (*portion of clay*). It is displaced, not annihilated.  

  Your policy, Section IV, Coverage C (Personal Property), Subsection 2(b), explicitly defines covered property as "tangible physical objects." Lump #A is such an object. Statue #S, being an artefact dependent upon a specific configuration *of* Lump #A, is not a distinct tangible object listed or implied within your policy's covered property schedule. The policy indemnifies against loss *to the covered matter*, not against the loss of contingent *forms* instantiated by that matter.  

  Therefore:  
  *   The covered entity, Lump #A (the insured clay matter), persists post-incident. It has been altered but not destroyed.  
  *   The entity that was destroyed, Statue #S, was not a covered item under your policy. Its existence was contingent upon a form not guaranteed or insured.  

  Consequently, no covered loss occurred. The policy provides no indemnity for the cessation of Statue #S, as the underlying substance (Lump #A) constituting it remains extant, albeit reconfigured.  

  Should you disagree with this determination, you may refer to the formal appeals process outlined in your policy documents, Section VIII, Dispute Resolution. Alternatively, you may contact the undersigned at the number above. We must emphasize that further discussion regarding the metaphysical distinction between constituted objects and their constitutive matter is unlikely to alter the contractual basis of this decision.  

  We appreciate your understanding of the necessity for precise ontological alignment in claims adjudication and trust this clarifies the matter.  

  Sincerely,  

  **Reginald Thorne**  
  Senior Claims Adjuster, Special Assets (Ontological Division)  
  MetroWest Assurance Group  

  *Enclosures: Copy of Policy Section IV, Copy of Policy Section VIII*  

  ---

  **Why This Works:**  

  1.  **Deadpan Corporate-Ese:** Uses formal insurance letter structure (claim number, policy references, sections, sign-off) and jargon ("alleged destruction," "ontological analysis," "governing sortal," "indemnity," "contingent forms").  
  2.  **Rigorous Metaphysics:** Explicitly lays out the constitution view: distinct entities (Lump/Statue), different sortals/persistence conditions ("Lump #A could survive being flattened; Statue #S could not"), coincidence without identity, historical/modal differences, and a clear distinction between the *clay* (covered matter) and the *statue form* (not covered).  
  3.  **The Jokes:**  
      *   The ontological nitpicking applied to a squashed garden statue.  
      *   The sniffy monism aside ("intuitively appealing to the layperson... philosophically untenable").  
      *   The distinction between "squashed" (altered Lump) and "destroyed" (ceased Statue).  
      *   The absurd conclusion: The clay is fine, just rearranged!  
      *   The job title "Senior Claims Adjuster, Special Assets (Ontological Division)".  
      *   The final brush-off about "further discussion... unlikely to alter the contractual basis."  
  4.  **Consistency:** Never wavers from the constitution view. The Lump survives, the Statue perishes, and only the Lump was ever potentially covered.  
  5.  **Accessibility:** A reader unfamiliar with philosophy gets the absurdity of denying a claim because "the clay is still there, just flat now." A metaphysician recognizes the constitution view applied meticulously (and ruthlessly).  
  6.  **Tone:** Maintains the dry, slightly pedantic, utterly serious voice of a bureaucrat applying an obscure but internally consistent rulebook.
