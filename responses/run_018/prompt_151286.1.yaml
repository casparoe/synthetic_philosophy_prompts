  *(Leaning over my cluttered desk, pipe smoke curling around the furrows in my brow)*  
  Your simulation troubles me deeply – precisely because it mirrors my own struggle! You slide the labels, the field values stay put... that's the mathematical covariance I demand for the gravitational field equations. But those fixed memory addresses? Ach, that *is* the hole! If spacetime points themselves had inherent physical reality – like your machine's addresses – then specifying the field *here* and *now* should determine it *everywhere*. Yet, if I merely relabel the points (slide the coordinates) within an empty "hole" of spacetime, the same field equations allow *different* field configurations! Determinism crumbles. Your simulation needs addresses to compute, yes... but does the *universe* need them? Perhaps those addresses are only needed by *us*, by the calculating mind or machine, to track the relations – the coincidences – like a particle meeting here, a light flash occurring there. The physics isn't *in* the addresses; it's in the pattern of events those addresses merely *label*. The machine's physical substrate is part of *our* world, not necessarily the simulated one.  

  *(Staring intensely, gesturing with the pipe stem)*  
  You ask: if it's only coincidences, doesn't the physics depend on nothing specific? No! It depends on *everything specific* about those coincidences – their order, their measurable relationships. The "where" and "when" lose absolute meaning, but the *that* a particle hits a detector *here* rather than *there*, and the measurable interval between events – *these* are the bedrock. Your simulation computes the evolution of those relations. The machine's addresses are scaffolding for the calculation, scaffolding we might discard once we grasp that only the coincidences – the intersections of worldlines, the values *at* events – are physically real. The field isn't pinned to an absolute "somewhere else" in spacetime; its reality is defined by what we *measure* where events coincide. But... *(sighs, running a hand through my hair)* ...does this truly resolve determinism? If the points themselves aren't real, what anchors the identity of events before and after the coordinate slide? That keeps me awake.  

