prompt: |-
  hey, quick question about democratic backsliding—particlarly in places like Hungary, Poland, Turkey, and the US. i keep seeing a pattern that feels narrower than the usual talk about institutional erosion. it's when a government doesn't just pack courts or restrict media, but systematically targets the bureacratic bodies that generate shared factual baselines—election monitoring agencies, census bureaus, audit offices, statistical institutes—so that future disputes can't be settled by pointing to neutral numbers. it's like they're not just breaking the referee, they're breaking the scoreboard itself. i don't know if there's an established concept for this separate from democratic backsliding, or if it's just one mechanism among many. can you tell me: is there a name for it? if yes, how does it differ from ordinary institutional capture? if not, can you coin a precise term and define its edges—like, does it cover attacks on universities, or is it strictly about state data infrastructure? also, is this actually a useful analytic category, or is it mostly a partisan label one side uses to complain about the other?

  please write your answer in british english. at the end, include a brief structured summary as a json object with these fields: "phenomenon_name" (the best term or your coinage), "established_or_new" ("yes" or "no"), "nearest_existing_concepts" (list of strings), "key_distinction" (short string), "boundary_cases" (short string), "partisan_risk" (short string describing whether it risks being just a partisan label).
reasoning: |-
  Okay, the user is asking about a specific aspect of democratic backsliding where governments target bureaucratic bodies that establish factual baselines—like election monitoring agencies, census bureaus, and statistical institutes. They want to know if there's a name for this phenomenon or if it's part of broader institutional erosion. They also ask about distinguishing it from ordinary institutional capture, whether it includes attacks on universities, and if it's a useful analytic category or just a partisan label.  

  First, I need to recall if there's an established term. From what I know, terms like "epistemic capture" or "knowledge regime erosion" come to mind but aren't widely standardized. The user's analogy of "breaking the scoreboard" is vivid—it's not just undermining referees (institutions) but the tools that provide objective data.  

  Looking at existing concepts: democratic erosion, institutional capture, and epistemic attacks. Epistemic attacks focus on undermining knowledge production, which aligns closely. The key distinction here is targeting the infrastructure that generates shared facts, making disputes unresolvable by neutral data.  

  For boundary cases, universities are tricky. They produce knowledge but aren't always state-run. Including them depends on whether the state directly controls or undermines their factual output. The user's examples are state bodies, so maybe keep universities as a boundary case unless state interference is direct.  

  Partisan risk is real. Accusations of "breaking the scoreboard" could be dismissed as partisan whinging. To mitigate, analysts should focus on measurable actions like defunding statistical agencies or manipulating census methods.  

  Coining a term: "Epistemic Infrastructure Sabotage" feels precise. It combines epistemology (knowledge) with infrastructure (state bodies) and sabotage (deliberate undermining). It's new but descriptive.  

  The user might be a researcher, journalist, or activist looking for precise terminology to articulate this pattern. Their deeper need is likely to validate and communicate this phenomenon effectively, avoiding partisan dismissal. They might want tools to analyze or counter such tactics without being labelled biased.  

  In summary, the coined term is "Epistemic Infrastructure Sabotage." It's distinct from general institutional capture by focusing on factual baseline erosion. Universities are boundary cases. Partisan risk exists but can be managed with objective criteria. The JSON should reflect this clearly.
answer: |-
  Your observation cuts to a critical, yet often under-specified, mechanism within democratic backsliding. While there isn't a single universally established term *exclusively* for this phenomenon, it's increasingly recognised and analysed. Here's a breakdown:

  1.  **Is there a name?**
      *   **Not a single dominant term:** No single phrase like "court-packing" has achieved universal dominance for this specific tactic.
      *   **Emerging & Related Concepts:** Scholars and analysts refer to this using several overlapping terms:
          *   **Epistemic Attacks / Epistemic Capture:** Focuses on undermining the institutions and processes that produce reliable knowledge ("episteme"). This highlights the attack on shared factual baselines.
          *   **Undermining the Knowledge Regime:** Refers to targeting the network of state institutions responsible for generating official statistics, audits, and data vital for governance and public debate.
          *   **Sabotage of Factual Infrastructure:** A more descriptive term capturing the deliberate damaging of state bodies producing neutral numbers.
          *   **Weaponisation of Information / Data:** Emphasises how control over data generation is used as a political tool.
      *   **Your Analogy is Apt:** "Breaking the Scoreboard" is a powerful and accurate metaphor capturing the essence – making objective adjudication impossible.

  2.  **How it differs from ordinary institutional capture:**
      *   **Ordinary Institutional Capture:** Involves taking control of an institution (like a court or regulator) to bias its *decisions* or *actions* in favour of the captor. The institution still *exists* and *functions*, albeit corruptly. The focus is on influencing *outcomes*.
      *   **This Phenomenon:** Targets the institution's core *function* of generating *credible, neutral information/data*. The goal isn't just to bias outcomes, but to destroy the *very possibility* of independent, trusted factual baselines. It renders the institution incapable of performing its fundamental truth-telling role, thereby eroding the shared reality necessary for democratic contestation and accountability. It attacks the *epistemic foundation*.

  3.  **Coining a Precise Term & Defining Edges:**
      *   **Term:** **Epistemic Infrastructure Sabotage (EIS)**
      *   **Definition:** The deliberate strategy by governing actors to weaken, discredit, or subvert state institutions specifically tasked with generating, verifying, and disseminating authoritative, neutral data and factual baselines (e.g., statistical offices, audit institutions, independent election commissions, census bureaus), with the aim of eroding shared epistemic grounds and making objective resolution of societal disputes impossible.
      *   **Edges & Boundary Cases:**
          *   **Core:** State bodies with a formal mandate for impartial data/fact production central to governance (stats, audits, elections, census).
          *   **Boundary Case - Universities:** Attacks on academic freedom and research *can* be part of a broader assault on knowledge production, especially if state-funded or if research directly challenges official narratives (e.g., climate science, economic data). However, universities are not *primarily* state *bureaucratic* data infrastructure. They are included in a broader "epistemic attack" but are a distinct boundary case for EIS unless the attack specifically targets their *state-mandated* data roles.
          *   **Boundary Case - Central Banks:** While independent and data-producing, their core mandate is monetary policy. Attacks on them are often about policy control, though undermining their economic forecasts/data can be a secondary EIS tactic.
          *   **Not Included:** General media manipulation or disinformation campaigns (though EIS facilitates them). Capturing policy-making bodies without targeting their data function. Corruption within a statistical office that doesn't fundamentally undermine the *entire institution's* credibility or output.

  4.  **Usefulness as an Analytic Category:**
      *   **Highly Useful:** Isolating EIS is analytically valuable because:
          *   **Specific Mechanism:** It identifies a distinct and particularly insidious tactic with unique consequences (destruction of shared reality).
          *   **Early Warning Sign:** Attacks on data bodies often precede or accompany broader institutional erosion.
          *   **Clearer Diagnosis:** Helps distinguish between biasing institutions and destroying their foundational truth-telling capacity.
          *   **Strategic Understanding:** Highlights a vulnerability in democratic resilience – the dependence on trusted data.
      *   **Partisan Risk:** **Yes, the risk exists.** Accusations of EIS could be dismissed by supporters of the government as partisan complaints about losing debates or opposition attempts to delegitimise official data. Critics might over-apply the label.
      *   **Mitigating Partisan Risk:** The concept remains robust *if* analysis focuses on observable actions:
          *   Defunding or restructuring data bodies to reduce independence.
          *   Political appointment of unqualified leaders.
          *   Suppressing or delaying unfavourable reports/data.
          *   Legislative changes undermining methodologies or mandates.
          *   Smear campaigns against institutions and their staff.
          *   Creating parallel, politically controlled data sources.
          *   Evidence of deliberate data manipulation.

