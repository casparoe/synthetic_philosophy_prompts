prompt: |-
  hey, quick consistency check on my democratic boundary views before i write this up. i hold:

  (i) the all-affected principle should govern transnational issues like climate and AI - if you're substantially impacted, you get input regardless of citizenship.

  (ii) but democratic legitmacy requires what i'd call reciprocal vulnerability: members have to be actually embedded in each other's social world, not just causally linked.

  (iii) resident non-citizens vote locally but not nationally, since local policy is about shared space and national policy is about collective destiny.

  (iv) future generations get proxy trustees for long-range constitutional decisions, but not for routine budgets.

  (v) animals affected by policy have moral weight but no democratic standing - they're not co-authors of collective life.

  (vi) there's no principled line between "affected foreigner" and "affected resident non-citizen" - both are causally impacted.

  the tension i see is between (i)/(vi) and (ii)/(iii). if reciprocal vulnerability restricts membership, then (i) is wrong for climate policy since affected foreigners aren't embedded in our social world. but if (i) is right, then (ii) looks like an ad hoc rescue of nationalism. meanwhile (iv) seems okay with (ii) but maybe conflicts with (v) in ways i can't see? and is (v) actually in tension with (i) or is that just surface level?

  please rank the tensions by severity, say which ones dissolve on inspection, and for each real one tell me the cheapest revision and what it costs me. write it as continuous prose only - no headings, bullets, bold, anything like that. just straight text like you're replying to an email.
reasoning: |-
