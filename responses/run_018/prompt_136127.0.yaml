prompt: |-
  I run a grad seminar on moral psych — about 10 people, one 75 min session. I want them to feel Williams's integrity objection and that one-thought-too-many problem, but not through the usual drowning-spouse story. I'm injecting a niche framing: there's an AI-safety crisis that suddenly demands all hands on deck for technical labor, but every student has a pre-existing ground project thats analog and non-technical (archiving oral history, writing a novel, running a local garden cooperative). They need to decide whether to suspend their project and help, or stay with it.

  The core mechanic should be a live negotiation with a reason ledger — every time they justify a choice, they tag it integrity-based (tied to who they are / their project) or impartial (appeals to overall good). The rules should penalize anyone who uses an impartial reason to defend keeping their own project — thats the one-thought-too-many moment made social — but pure refusal without reason breaks group solidarity. So they have to navigate it in real time.

  Design the full activity: roles, rules, payoff scheme using reputation points or access to a shared resource (no real money), timeline, and a debrief that maps exactly where in the game people hit the Williams moment. Also tell me what will predictible go wrong the first time I run it, and be honest about which feature of the objection this setup cant reproduce (probably the deep phenomenological weight). Don't include citations or a reading list.

  After the design, give me a brief structured summary in JSON with these fields: setting, group_size, time_minutes, niche_injection, core_mechanic, predictable_failure, unreproducible_feature.
reasoning: |-
  We are designing an activity for a graduate seminar on moral psychology, aiming to illustrate Bernard Williams' integrity objection and the "one thought too many" problem. The usual drowning spouse example is replaced with a scenario involving an AI-safety crisis and students' ground projects.

  ### Activity Design

  **Title:** The Ground Project Dilemma: Integrity in Crisis

  **Setting:** 
  - **Scenario:** An unprecedented AI-safety crisis has emerged, requiring immediate technical labor (e.g., coding, data analysis, systems engineering) to prevent catastrophic outcomes (e.g., rogue AI causing widespread harm). The crisis is projected to last 6 months to a year. 
  - **Participants:** Graduate students (about 10) who each have a pre-existing, non-technical ground project that is deeply important to them (e.g., archiving oral history, writing a novel, running a local garden cooperative). These projects are not easily paused and would suffer irreversible damage if abandoned for the duration of the crisis.

  **Goal of the Activity:** 
  Students must decide whether to suspend their ground project to contribute to the AI-safety effort or continue with their project. The negotiation process will force them to articulate reasons for their choice and face social consequences for the type of reasons given.

  **Core Mechanic: The Reason Ledger**
  - Each participant has a personal "ledger" (a physical card or digital document) that tracks two types of reasons they use during the negotiation:
    1. **Integrity-based reasons:** Appeals to personal identity, commitment to their ground project, or the intrinsic value of the project to their life. (e.g., "This novel is my life's work; it's who I am.")
    2. **Impartial reasons:** Appeals to the greater good, overall consequences, or impartial moral principles. (e.g., "The AI crisis could harm millions, so I must help.")
  - **Rule:** If a participant uses an impartial reason to justify *keeping* their own project, they are penalized. This is the "one thought too many" moment – using an impartial calculation to defend what should be a personal commitment.
  - **Rule:** Participants must give at least one reason for their choice during the negotiation. Silent refusal is not allowed (to avoid breaking group solidarity).

  **Penalty System (Reputation Points):**
  - Each participant starts with 5 "Solidarity Points" (SP).
  - **Gaining SP:** 
    - +1 SP for each integrity-based reason used to defend keeping your project OR for an impartial reason used to defend joining the crisis effort.
    - +1 SP if your reason convinces another player to change their decision (max +2 per player).
  - **Losing SP:**
    - -2 SP for using an impartial reason to defend keeping your own project (the one-thought-too-many penalty).
    - -1 SP for refusing to give a reason (if they remain silent after being prompted).
    - -1 SP if you switch your decision more than once (indecisiveness).
  - **Outcome:** SP can be used in a shared resource (e.g., access to a "collaboration fund" for future research, or priority in choosing seminar topics). At the end, the top 3 SP holders get a small bonus (e.g., extra credit, public recognition).

  **Roles:**
  - **Facilitator (You):** Sets the scene, enforces rules, tracks SP penalties/awards, and moderates the negotiation.
  - **AI-Crisis Envoy (Optional NPC):** You can play this role to add pressure. The envoy periodically interrupts with updates about the worsening crisis to raise stakes.
  - **Participants (Students):** Each has their ground project and must decide whether to join the crisis effort or not. They must justify their choice in the negotiation.

  **Timeline (75 minutes total):**
  1. **Introduction (10 min):** 
     - Set the scene: Describe the AI crisis and the importance of the ground projects. 
     - Explain the rules, the ledger, and the SP system. Assign each student a ground project (or let them choose from a list).
     - Emphasize: They must negotiate and justify their choice.

  2. **Private Reflection (5 min):** 
     - Students write down their initial decision and one reason (without sharing yet). They must classify their reason as integrity-based or impartial.

  3. **Negotiation Rounds (40 min):**
     - Round 1 (15 min): Open discussion. Participants share their initial decision and reason. The facilitator (or an appointed note-taker) tracks reasons and applies SP gains/penalties in real time (displayed publicly on a board).
     - Round 2 (15 min): After hearing others, participants can change their decision. They must justify any change, and the group can challenge reasons. Facilitator updates SP.
     - Round 3 (10 min): Final decision and reason. Participants cannot change after this.

  4. **Resolution (5 min):** 
     - Each participant states their final choice and reason. SP totals are calculated.

  5. **Debrief (15 min):** 
     - Focus on moments where the "one thought too many" penalty was triggered. Ask:
       - "Who was penalized for using an impartial reason to keep their project? How did it feel?"
       - "Did anyone avoid penalties by sticking to integrity reasons? What was the group reaction?"
       - "Where did you feel the tension between personal commitment and the greater good?"
     - Map to Williams: 
       - The penalty moment is the game's analog of "one thought too many" – it exposes the absurdity of justifying a personal project impartially.
       - The integrity-based reasons reflect Williams' point that some commitments are beyond impartial morality.
     - Note: The game cannot replicate the deep emotional weight of real integrity violations (e.g., abandoning a spouse), but it shows the social and rational tension.

  **Predictable Failures:**
  - **First-Run Chaos:** Students might not understand when a reason counts as "impartial" vs. "integrity-based," leading to disputes. Mitigation: Provide clear examples and have the facilitator arbitrate.
  - **Gaming the System:** Students might use fake integrity reasons to avoid penalties (e.g., "I'm staying with my garden because... uh, it's my soul!"). This dilutes the lesson. Mitigation: Encourage authenticity by making ground projects relatable (use real student interests if possible).
  - **Groupthink:** The negotiation might pressure everyone to join the crisis effort, eliminating tension. Mitigation: The AI-Crisis Envoy can emphasize the urgency, but also stress the value of ground projects (e.g., "Oral histories preserve culture in crises").
  - **SP Distraction:** Students might focus on point-scoring rather than the moral dilemma. Mitigation: Downplay SP in the debrief and focus on the philosophical insight.

  **Unreproducible Feature:** 
  - The setup cannot replicate the *phenomenological weight* of true integrity violations. In Williams' drowning spouse, the agent's horror at calculating impartially is visceral. Here, the penalty is a social nudge – it feels like losing points, not betraying oneself.

