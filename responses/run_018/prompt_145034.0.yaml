  ## Tesseract in the Library of Babel

  The glass reflects the shelves that stretch away.
  A figure stands before the silvered plane.
  Books crowd the left shelf, bound in shades of grey.
  Their spines hold symbols no one can explain.
  The reflection faces west, a steady gaze
  The glass reflects the shelves that stretch away.

  The glass reflects the shelves that stretch away.
  On the right shelf, a clock face gathers dust,
  Its hands dissolved to rust’s abstract display.
  No numbers anchor the corroded trust.
  It marks no hour, minute, second’s sway
  The glass reflects the shelves that stretch away.

  The glass reflects the shelves that stretch away.
  The mirrored figure now regards the east,
  While on the left, the grey books still hold sway.
  No shadow shifts, no movement is released.
  This pose, that pose, in one arrested day
  The glass reflects the shelves that stretch away.

  Verdict: Tripartite stanzaic loops with identical opening/closing lines enforce simultaneity, replacing temporal sequence with spatial juxtaposition and recursive stasis.
