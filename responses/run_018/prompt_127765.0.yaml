prompt: |-
  hey, before I commit to any particular theory of advance directives I want the full spec sheet. Write the desiderata: what an adequate account of the earlier self's authority over the later one actually has to deliver. The cases it must get right -- not just the classic Alzheimer's refusal, but also the trickier scenario where the later self isnt incompetent exactly, just conceptually different: they wrote 'no artifical nutrition' when they conceived of dignity as a narrative project, but now in advanced dementia they experience each feeding as pure present-tense pleasure with no sense of narrative at all. The distinctions it cant collapse -- authority versus welfare, binding versus advising, expressing values versus predicting preferences. The legal and clinical findings it cant flat-out contradict. Flag any pair of desiderata that look jointly unsatisfiable; I suspect there's real tension between honoring autonomy and not harming a self that genuinely lacks the evaluative framework the directive was written in. Then briefly score three standard views -- the autonomy-first view, substituted judgment, and the 'no authority across conceptual rupture' position -- against your list. Keep the weight on the criteria and why each is a genuine requirement, not on the scorecard. No bibliography, just the reasoning.
reasoning: |-
  Okay, the user wants a comprehensive breakdown of what an adequate theory of advance directives must accomplish. They're clearly deep into medical ethics, probably a grad student or philosopher preparing to engage with the literature. The level of specificity in their dementia example suggests they've already wrestled with standard arguments and want to expose hidden fault lines. 

  First, I need to map the entire problem space. Their example isn't just about competence but about *incommensurability* of values - when the former self's "dignity" clashes with the latter self's sensory pleasure. That's the crux. They're hinting at a meta-problem: can autonomy apply when the later self lacks the conceptual tools to even understand the directive's rationale? 

  The legal constraints matter here. Courts do enforce directives for dementia patients (Cruzan case), but also allow overrides if there's evidence the patient isn't suffering. That's a live tension. Clinically, we can't ignore that tube feeding in late dementia often causes agitation - but what if this particular patient smiles during feeding? The theory has to navigate both horns.

  When listing desiderata, I should group them: metaphysical (what is "self"?), normative (authority vs welfare), practical (clinical applicability). The autonomy/welfare conflict they flagged is central, but there's another sneaky one: how can directives be "binding" if the later self can't consent to being bound? That's a Locke-ian puzzle.

  For scoring the three theories: Autonomy-first fails the dementia pleasure case spectacularly. Substituted judgment collapses when selves are incommensurable - how can a proxy "simulate" a preference framework that no longer exists? The conceptual rupture view handles the dementia case cleanly but makes directives useless precisely when we need them most. 

  The user's unspoken ask: they want a theory that doesn't treat autonomy as all-or-nothing. Maybe graded authority? Or different rules for negative directives (refusing treatment) vs positive ones? But I shouldn't solutioneer - just expose the cracks per their request. The real service is showing why this isn't a puzzle with an answer, but a dilemma to be managed.
answer: |-
  Here’s the full desiderata for a theory of advance directives, mapping the conceptual terrain, tensions, and non-negotiable constraints:

  **Core Desiderata: What the Theory Must Deliver**
  1.  **Respect for Autonomy (Extended):** Explain why a competent prior self’s expressed wishes *should* constrain the care of a later, substantially changed self. Ground the moral authority of the past self.
  2.  **Avoid Harm to the Later Self:** Protect the current experiential interests and well-being of the later self, even if profoundly changed. A directive demanding suffering for an abstract value the later self cannot grasp is morally suspect.
  3.  **Handle Profound Psychological Change:** Account for cases where the later self isn't merely "incompetent" but operates under a *radically different evaluative framework* (e.g., narrative dignity vs. present-tense pleasure), making the directive's rationale incomprehensible.
  4.  **Distinguish Authority from Welfare:** Maintain a clear separation between the *source* of authority (the prior self's directive) and the *content* (which may or may not align with the later self's welfare). A theory shouldn't collapse "she commanded it" into "it's best for her now."
  5.  **Distinguish Binding from Advising:** Clarify whether the directive is an *instruction* that binds caregivers/proxies, or merely *strong evidence* of what the later self *would* want *now* (which might be overridden by current evidence).
  6.  **Distinguish Values from Predictions:** Address whether directives primarily express *core values* meant to govern future states regardless of predicted preferences, or whether they *predict* what preferences the later self *would* have if competent in that future state.
  7.  **Accommodate Legal Reality:** Cohere with established legal principles that generally treat valid directives as *binding* (absent specific revocation by a competent patient), even for dementia patients (*Cruzan* foundational). Cannot require current consent for refusal.
  8.  **Accommodate Clinical Reality:** Acknowledge findings like the difficulty of accurately predicting future preferences/experiences, the potential for suffering from interventions in late dementia (e.g., agitation from tube feeding), and the challenges of discerning subjective well-being in cognitively impaired individuals.
  9.  **Provide Action Guidance:** Yield clear, practical principles for proxies and clinicians facing decisions when directives apply to a changed later self. Avoid paralysis or excessive subjectivity.
  10. **Maintain Fidelity to Identity:** Explain the connection (or lack thereof) between the earlier and later selves that justifies the former's authority. Does identity persistence matter? If so, what kind?

  **Flagged Tensions (Likely Jointly Unsatisfiable Pairs):**
  *   **Autonomy (1) vs. Harm Avoidance (2) in Conceptual Rupture (3):** *This is the core tension you identified.* Honoring a directive refusing basic care (like feeding) based on a narrative dignity value the later self *cannot comprehend* and *experiences as pleasurable* directly pits the prior self's authority against the later self's experiential welfare. Forcing suffering for an inaccessible value seems cruel; ignoring the directive violates autonomy. A theory must navigate this, likely prioritizing one or finding a nuanced balance, but perfect harmony may be impossible.
  *   **Binding Force (5/Legal 7) vs. Welfare (2/Clinical 8):** Legally binding directives can mandate actions (or inactions) demonstrably contrary to the later self's observable well-being/happiness. Insisting on binding force risks harming the present self; relaxing it based on welfare undermines the directive's core purpose and legal foundation.
  *   **Values Expression (6) vs. Prediction (6):** If directives express values meant to govern irrespective of future preferences, they risk imposing alien values on a self that finds meaning differently. If they are mere predictions, they become irrelevant if the prediction is wrong (e.g., the later self *does* find pleasure), and lose their distinctive authority.

  **Scoring Standard Views Against Desiderata (Reasoning Focus):**
  1.  **Strict Autonomy-First (Directive as Binding Command):**
      *   *Strengths:* Maximizes 1 (Autonomy), clearly satisfies 5 (Binding), aligns strongly with 7 (Legal Reality), straightforward 9 (Action Guidance).
      *   *Weaknesses/Collapses:* Fails 2 (Harm Avoidance) and 3 (Conceptual Rupture) catastrophically in the dementia/pleasure case (forces suffering for an inaccessible value). Collapses 4 (Authority/Welfare) by treating the directive *as* defining welfare. Struggles with 6 (Values vs Prediction) if the directive was predictive but wrong. Ignores 8 (Clinical Reality) about potential suffering. Challenges 10 (Identity Fidelity) if identity rupture is deemed significant.

  2.  **Substituted Judgment (Proxy Decides What the Patient *Would* Want Now):**
      *   *Strengths:* Aims for 2 (Harm Avoidance) by focusing on the *current* self's hypothetical preference, potentially navigates 3 (Conceptual Rupture) by imagining what the *current* self would want *given its new framework*. Clearly distinguishes 4 (Authority vs Welfare) – authority comes from the proxy's best judgment, not the directive itself. Aligns with part of 6 (Prediction).
      *   *Weaknesses/Collapses:* Undermines 1 (Autonomy) and 5 (Binding) by making the directive merely advisory evidence, conflicting with 7 (Legal Reality). 9 (Action Guidance) becomes highly subjective and prone to proxy bias ("I think she'd want to live now"). Fails 6 (Values vs Prediction) if the directive expressed values, not predictions. Struggles profoundly with 3 (Conceptual Rupture) – how can a proxy *possibly* simulate what a self with a radically alien framework "would want"? Violates 10 (Identity Fidelity) if the prior self's values are discarded.

  3.  **Conceptual Rupture / No Authority (Directive Lacks Force Across Fundamental Change):**
      *   *Strengths:* Directly addresses 3 (Conceptual Rupture), prioritizes 2 (Harm Avoidance) for the present self. Respects 4 (Authority/Welfare distinction) by denying authority exists in rupture. Acknowledges 10 (Identity Fidelity) concerns.
      *   *Weaknesses/Collapses:* Fundamentally violates 1 (Autonomy), 5 (Binding), and 7 (Legal Reality). Makes advance directives meaningless precisely when needed most (dementia). Provides poor 9 (Action Guidance) – how to define "rupture"? Risks collapsing into pure best interests (welfare) alone. Ignores 6 (Values Expression) – the prior self's values are rendered irrelevant. Contradicts 8 (Clinical/Legal) consensus on directive enforceability.

  **Conclusion:** The core tension between honoring past autonomy and preventing present harm to a self operating under an incommensurable framework remains the central, likely irresolvable, challenge. An adequate theory *must* grapple explicitly with this tension, the distinctions, and the legal/clinical constraints, without collapsing the crucial differences between authority, welfare, binding force, and the nature of the directive itself. No standard view satisfies all desiderata; each fails significantly on critical points, highlighting the deep philosophical and practical difficulties.
