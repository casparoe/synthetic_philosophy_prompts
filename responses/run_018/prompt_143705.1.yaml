answer: |-
  Here’s a practical mediation procedure for your co-op role, grounded in Smith’s ideas but adapted for your constraints. It’s written as a continuous workflow you can mentally follow. Pass each step if you find shared ground or neutral facts; stop and escalate if values clash irreconcilably or safety is compromised. Always timebox each step to 2-3 minutes.  

  **The Procedure**  
  Start by hearing both sides separately for 5 minutes total, noting only observable actions (e.g., "drumming past 11 PM," "planted oleander," "shouted in hallway"). Then, begin the spectator shift: imagine you’re a stranger who sees these actions without knowing the people involved. Would the stranger see a clear breach of co-op rules or community norms? If yes—like noise violating quiet hours—that’s a pass; propose mediation focused on solutions (e.g., drumming earlier). If the stranger sees no objective issue (e.g., "planting flowers in a garden"), stop—this is a values call about preferences, not facts, and needs arbitration. Next, sympathy calibration: ask each party to rate their distress from 1-10 (10 being worst). Average the scores. Compare it to your gut reaction. If your anger/frustration is stronger than the average (e.g., you’re at 8 but their average is 3), discount your feelings as proximity bias—your role is to facilitate, not judge. If their average is high (e.g., 7+) but they disagree on causes, that’s emotional asymmetry; escalate if one party dismisses the other’s pain. Finally, ask: "Can both live with a compromise that respects the stranger’s view?" If yes, draft a mediation plan. If not, or if harm/safety is involved (e.g., toxins, intimidation), escalate regardless of personal reluctance.  

  **Case Applications**  
  1. **Midnight Drummer (Cultural Practice Claim)**  
     Spectator shift: A stranger sees loud drums at midnight in a residential building. This breaches quiet-hour norms, regardless of intent. Pass—propose mediation for daytime practice. Sympathy calibration: Drummer rates distress at 2 (feels censored), neighbor at 9. Average: 5.5. If your gut is hotter than 5.5, discount it. Values call? Only if drummer argues cultural exemption is non-negotiable—then escalate, as fairness vs. tradition is arbitration territory. Misfire: If drummer claims cultural sincerity but neighbor doubts it, you can’t arbitrate authenticity—escalate.  

  2. **Toxic Plant in Shared Garden**  
     Spectator shift: A stranger sees toxic flora planted where pets roam. Co-op rules likely imply a "no known hazards" standard. Pass—focus on removing the plant. Sympathy calibration: Planter rates distress at 3 ("didn’t know"), cat owner at 10. Average: 6.5. If your gut reaction exceeds this (e.g., outrage at 8), discount it. Stop only if toxicity is disputed (e.g., "Is oleander really toxic?"). If provable via quick web search, it’s factual—mediate. If not, escalate for evidence review. Misfire: If planter insists their aesthetic choice outweighs pet safety, it’s a values deadlock—escalate.  

  3. **Bullying with Denial**  
     Spectator shift: A stranger observes repeated aggression (e.g., threats, stolen mail) toward one party who withdraws. Clear coercion, regardless of the victim’s words. Sympathy calibration: Bully rates distress at 1 ("just joking"), victim at 2 ("it’s fine"). Average: 1.5. But your gut screams imbalance—discount it? No: here, the victim’s underreporting is a red flag. Emotional asymmetry is extreme (aggressor indifferent, victim numb). Escalate immediately—power imbalances override sympathy calibration. Stopping to mediate risks normalization. This is where you must escalate, even if you’d prefer a kitchen chat.  

  **Where It Misfires**  
  - **Emotional intensity gaps**: If one party rates distress at 10 and the other at 1, averaging to 5.5 may mask manipulation or trauma. Escalate if the high-intensity party has evidence.  
  - **Total fact divergence**: If both describe the same event opposite ways ("They hit me!" / "I never touched them!") with no witnesses, you lack tools—escalate.  
  - **"Fairness" traps**: When both demand mutually exclusive solutions (e.g., "Only I can use this space Tuesdays"), spectator shift sees selfishness—escalate.  

  This keeps Smith’s impartiality while forcing you to correct for neighborly bias. Use it as a script in your head—it runs in 20 minutes if you stick to time limits.
