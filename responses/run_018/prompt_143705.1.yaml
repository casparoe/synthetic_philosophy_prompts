prompt: |-
  Hey, I need a practical thing. I volunteer as a mediator for our little housing co-op, like twenty units, and ever other week someone comes to me with some beef about noise or shared spaces or whose turn it is to shovel snow. I don't have any real authority, just have to write a recomendation saying whether we should try to talk it out more or send it up to the formal arbitraition board, and both people have to sign off that they heard me out. I want a decision procedue I can actually run in about twenty minutes, grounded in Adam Smith's idea of sympathy and that impartial spectator thing — but not just the textbook version. I want it to include this twist: since I'm neighbors with both people, I have to do a "spectator shift" where I imagine how the dispute looks to someone who only knows the actions and not the personalities, and I also have to do a "sympathy calibration" where I compare my own gut reaction to the average of what both sides say they feel, and if my reaction is stronger than that average I have to treat it as proximity bias and discount it. The procedue should walk me through the steps in order, written out in continuous prose like an email or letter, no bullet points or bold or headings or tables. For each step say what counts as passing and where I should stop and say this is a values call not a fact call. Then apply it to three cases: one about a guy who plays drums at midnight and claims it's cultural practice, one about a shared garden where someone planted something toxic to the other person's cat, and one where there's clear bullying but the victim keeps saying they're fine. That last one should be the case where the procedue tells me to escalate to arbitraition even though I'd rather just keep talking it out in the kitchen. Also flag where the procedue will misfire or can't decide, especially when both parties report totally different emotional intensities. Don't ask me to cite Smith or give a reading list, and don't mention obscure modern interpreters I wouldn't know.
