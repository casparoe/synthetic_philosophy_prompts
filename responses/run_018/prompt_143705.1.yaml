  The user explicitly said no citations, reading lists, or obscure modern interpreters—focus on practicality. They're likely time-pressed and dealing with recurring neighbor disputes, so the procedure needs to be streamlined and foolproof. Their deeper need might be maintaining neighborly harmony without burnout; they want a tool that offsets their proximity bias to stay fair. Also, they might fear missing subtle escalations (like the bullying case), so the procedure must override their reluctance to escalate.

  For the procedure structure: I'll outline steps in narrative form, weaving in spectator shift and sympathy calibration naturally. Key phases: 1) Gather facts neutrally, 2) Spectator shift (action-only view), 3) Sympathy calibration (gut vs. average feelings), 4) Apply Smith's principles to find alignment/misalignment, 5) Decide: mediate or escalate. Passing = shared reality; stopping point = irreconcilable values or safety risks.

  For the cases: 
  - Drums: Cultural claim vs. sleep disruption. Spectator shift might see reasonable accommodation needed; calibration checks if mediator over-identifies. Likely pass to mediation unless cultural sincerity is disputed (values call).
  - Garden: Toxicity facts matter. If proven harmful, spectator shift prioritizes safety—no values call. If ambiguous, might misfire without evidence.
  - Bullying: Victim's denial vs. observable harm. Sympathy calibration fails if victim underreports; spectator shift sees coercion, forcing escalation despite mediator's hesitation. Flags emotional mismatch as a red flag.

