prompt: |-
  I run an undergraduate reading group on the history of social thought, with about fourteen regulars, and we are about to spend several sessions on David Lewis's account of convention and the way arbitrary regularities harden into norms. Before I assign any reading, I want to run a session that lets students feel the phenomenon from the inside, so that when they later encounter Lewis's characterization of a convention — a regularity in a recurring situation in which everyone prefers to conform given that everyone else conforms, even though some alternative regularity would have served just as well — they recognize what they did rather than merely learning a definition. The room has movable chairs and a whiteboard, we have ninety minutes, and I am willing to use small real stakes, such as chocolate coins or a modest prize.

  Design a runnable activity with actual rules and payoffs, no front-loaded explanations, and no mention of Lewis or the word "convention" until the debrief. It should take students through three distinct situations. First, a repeated coordination problem with two equally good ways of succeeding, where only salience or precedent can break the symmetry, so they experience the arbitrariness of whatever solution emerges. Second, a situation in which a new and objectively somewhat better solution becomes available after the group has already settled into the old one, so they feel the real cost of abandoning precedent and can gauge how much improvement it takes to dislodge an established regularity. Third, a situation in which newcomers join who lack the shared history, so the insiders are tempted to teach, correct, and mildly punish the newcomers, and the group can watch a bare regularity begin to present itself as something one ought to do.

  Please supply exact instructions for each round, the payoff structure, what the facilitator should record on the board, and a debrief that maps specific moments in the game onto Lewis's conditions for a convention and onto the difference between a convention and a sanction-backed norm. Also say what predictably goes wrong when this is run with real students and how to handle it, and be explicit about what a one-off, self-aware classroom game cannot reproduce about the historical, unplanned emergence of conventions and what the facilitator will need to supply afterward.
reasoning: |-
  We are going to design a three-part game. The goal is to let students experience the emergence of convention without front-loading the theory.

  **Overview of the three rounds:**
  1. **Round 1: Coordination with two symmetric equilibria** - Students must coordinate on one of two equally good options. The key is that without communication, they must rely on salience or random precedent.
  2. **Round 2: Introducing a better alternative** - After a convention is established in Round 1, we introduce a new, slightly better option. We want to see if they switch and at what cost (in terms of coordination failures).
  3. **Round 3: Newcomers** - We introduce new players (or assign some as newcomers) who don't know the established convention. We observe how the group teaches, corrects, and possibly punishes the newcomers.

  **Setup:**
  - We have 14 students. We can run the game with the entire group, but we might break into smaller groups if necessary. However, for the sake of group dynamics and having a shared history, we will keep them as one group.
  - We'll use a simple coordination game where they have to choose a color (or a symbol, or a side) and they get a payoff only if they coordinate with everyone else.

  **Materials:**
  - Whiteboard to record choices and payoffs.
  - Index cards or small pieces of paper for students to write their choices.
  - Chocolate coins or small prizes for payoffs.

  **Round 1: The Basic Coordination Game (Symmetric Choices)**

  *Instructions to students:*
  "Welcome to a game about making choices. In this game, you will be making a choice in several rounds. Each round, you must choose one of two options: **BLUE** or **RED**. 

  Your goal is to match the choice of every other person in the room. If everyone chooses the same color, then each of you gets 1 point. If there is any mismatch (that is, if even one person chooses differently), then no one gets any points. 

  You are not allowed to talk to each other during the game. Write your choice on the card and hand it in to me. I will then announce the result and record it on the board.

  We will play this game for 5 rounds. In each round, you choose independently. Remember, you get 1 point only if everyone chooses the same color."

  *Payoff structure:*
  - If all choose the same color: 1 point per player.
  - Otherwise: 0 points.

  *What the facilitator does:*
  - In each round, collect the cards and count the votes. 
  - Record on the board:
    - Round 1: Choices (e.g., 14 Blue, 0 Red) -> Outcome: Success (if unanimous) or Failure.
    - Also record the cumulative points for each player (or just announce that everyone gets 1 point if successful, else 0).

  *What to expect:*
  - Without communication, the group will likely coordinate on one color due to salience (maybe the first color mentioned, or the color of the facilitator's shirt, etc.). 
  - It might take a round or two to settle on one color. They might have a failure in the first round and then adjust.

  *Note:* The two colors are symmetric. There is no inherent advantage to either.

  **Round 2: Introducing a Better Alternative**

  *Instructions to students:*
  "Now we are going to change the game slightly. There is now a third option: **GREEN**. 

  If everyone chooses GREEN, then each of you gets 1.2 points. But note: if you choose GREEN and not everyone else does, then you get 0 points. The old rules still apply for BLUE and RED: if everyone chooses BLUE, then each gets 1 point, and similarly for RED. 

  However, if the group is not unanimous, then no one gets any points, regardless of the color. 

  We will play 5 more rounds. Remember, no talking."

  *Payoff structure:*
  - All choose GREEN: 1.2 points each.
  - All choose BLUE: 1 point each.
  - All choose RED: 1 point each.
  - Any other outcome (including a mix of colors, or one or more GREEN with non-GREEN, or a split between BLUE and RED): 0 points for everyone.

  *What the facilitator does:*
  - Record the choices and outcomes as before, now with three options.

  *What to expect:*
  - The group has an established convention (say, BLUE from Round 1). Now they have to decide whether to switch to GREEN. 
  - The improvement is modest (only 0.2 points). They might stick to the old convention because the risk of failure is high. 
  - They might try to switch and fail a few times, causing frustration.

  **Round 3: Newcomers**

  *Instructions to students:*
  "Now we are going to change the game again. We have been playing for a while and have a history. But now, we are going to add three new players. [Select three students to be newcomers. If the group is 14, then we have 11 original and 3 newcomers. If we don't have extra, assign 3 existing students to be newcomers and reset their history? But note: we want the newcomers to lack the shared history. Alternatively, we can have the entire group continue but change the rules to allow communication and correction.]

  However, to simulate the arrival of newcomers, we are going to let you talk to each other before each round, but only for 30 seconds. Also, the original players (who have been here from the start) are allowed to give advice to the newcomers and correct them. 

  But note: the newcomers are free to choose any color. The rules remain the same: you get 1.2 points for unanimous GREEN, 1 point for unanimous BLUE or RED, and 0 otherwise.

  We will play 5 more rounds. Before each round, you have 30 seconds to discuss. Then, write your choice independently."

  *Payoff structure:*
  - Same as Round 2.

  *What the facilitator does:*
  - Allow 30 seconds of discussion before each round.
  - Record choices and outcomes.

  *What to expect:*
  - The original players will try to instruct the newcomers to choose the color they have been using (or GREEN if they switched in Round 2). 
  - The newcomers might comply, but they might also make mistakes or even try to rebel. 
  - The group might experience failures due to newcomers. 
  - We might observe mild punishment: scolding, or expressions of frustration. We might also see the original players frame the choice in normative terms ("you should choose blue", "that's the rule", etc.).

  **Debriefing:**

  After the game, we reveal that this was about conventions and we discuss:

  1. **Round 1:** 
     - Ask: "How did you decide which color to pick? Was it arbitrary? What happened in the first round? Did you have a failure? How did you recover?"
     - Map to Lewis: 
       - Regularity: They settled on a color over time.
       - Recurring situation: Multiple rounds.
       - Preference to conform: Because if you deviate, you ruin it for everyone (including yourself).
       - Arbitrariness: They could have chosen the other color and it would have worked just as well.

  2. **Round 2:**
     - Ask: "What happened when GREEN was introduced? Why didn't you switch immediately? How much better is GREEN? Was it worth the risk? How did the group decide to switch (or not)?"
     - Map to Lewis: 
       - The existing convention (BLUE or RED) was arbitrary but established. The new option is better, but the transition cost (risk of coordination failure) is real. This shows the inertia of convention.

  3. **Round 3:**
     - Ask: "What was it like when newcomers arrived? How did the group handle them? Did you feel like the newcomers 'should' follow the established choice? Did you try to teach them? How did you react when they didn't conform?"
     - Map to Lewis and beyond:
       - The regularity becomes a norm: the group starts to enforce it. This is the beginning of a norm that is backed by social pressure (sanctions).
       - Note the difference: 
          - Convention: a regularity that is self-sustaining because everyone prefers to conform if others do.
          - Norm: a convention that is enforced by sanctions (even mild ones like disapproving looks or verbal corrections).

  **What can go wrong and how to handle it:**

  1. **Round 1 doesn't coordinate quickly:** They might have several rounds of failure. That's okay. It shows the difficulty. But if it goes too long, you might intervene by saying: "Remember, you are allowed to think about what others might be thinking." But avoid giving hints about color.

  2. **Round 2: They never try GREEN:** That's a valid outcome. It shows the power of precedent. If they do try and fail, they might give up. You can note that in the debrief.

  3. **Round 3: Newcomers might be too compliant:** To get the effect, you might secretly instruct the newcomers to be a bit rebellious in one round. But that might be unethical. Alternatively, let the dynamics play out. If they are too compliant, note that the group might not have needed to enforce the norm because the newcomers were cooperative.

  **What the game cannot capture and what to supply afterward:**

  - Real conventions emerge over long periods without design. The game is compressed and self-aware (students know it's a game about coordination). 
  - In real life, conventions are often not consciously chosen. They emerge from repeated interactions without the explicit goal of coordination. 
  - The stakes in real life are often much higher and more multifaceted. 
  - The game simplifies the payoffs and the alternatives. In real life, there might be many alternatives and they might not be symmetric.

  *After the game, the facilitator should explain:*
  - Conventions in the real world (like driving on the right/left, language, manners) are often not designed but emerge. 
  - The game captures the basic incentives but misses the historical and cultural context that shapes salience and the cost of change. 
  - The transition from convention to norm (with sanctions) is a social process that involves the internalization of the rule as "the right thing to do". 

  This activity should give students an experiential understanding that will make Lewis's abstract account more concrete.
answer: |-
  ### Coordination Game: The Color Challenge  
  **Objective:** Experience coordination dynamics without prior theory discussion.  
  **Materials:** Index cards (one per player), pens, whiteboard, chocolate coins (1 per point earned).  
  **Setup:** Arrange chairs in a circle. Hand out cards and pens.  

  ---

  #### **Round 1: Symmetric Coordination (20 minutes)**  
  **Instructions to Students:**  
  *"We’ll play a quick game over multiple rounds. Each round, you will write down **either ‘BLUE’ or ‘RED’** on your card. Your goal is to match the majority choice of the group.*  
  *Here’s how you earn points:*  
  - **If everyone chooses the SAME color**, each player gets **1 point**.  
  - **If choices are MIXED (even one mismatch)**, everyone gets **0 points**.  
  *We’ll play 5 rounds. Submit your card face-down each round. I’ll announce results after each round. No talking, gestures, or communication of any kind."*  

  **Facilitator Actions:**  
  - After each round, tally choices on the whiteboard (e.g., "Round 1: 13 BLUE, 1 RED → FAIL").  
  - Record cumulative points per player (use a tally chart).  
  - **Key:** Let asymmetry emerge naturally (e.g., first-round randomness may lead to BLUE dominance).  

  **Expected Dynamics:**  
  - Early rounds often have failures until a color "wins" via salience (e.g., first-round majority).  
  - Students experience frustration when mismatches occur and relief when coordination succeeds.  

  ---

  #### **Round 2: Introducing a Better Option (25 minutes)**  
  **Instructions to Students:**  
  *"Now we add a third option: **GREEN**. Rules update:*  
  - **All choose GREEN**: Each gets **1.5 points**.  
  - **All choose BLUE/RED**: Each gets **1 point** (as before).  
  - **Any mismatch**: Everyone gets **0 points**.  
  *Same no-talking rules. We’ll play 5 more rounds."*  

  **Facilitator Actions:**  
  - Add GREEN to the whiteboard options. Track choices/results as before.  
  - Highlight if the group sticks to the old color (e.g., BLUE) despite GREEN’s higher payoff.  

  **Expected Dynamics:**  
  - Most groups **resist switching** to GREEN due to fear of mismatches.  
  - If they attempt GREEN, initial failures reinforce the cost of abandoning precedent.  
  - Debrief hook: *"Notice how hard it was to switch, even for extra points."*  

  ---

  #### **Round 3: Newcomers Join (25 minutes)**  
  **Instructions:**  
  *"Three of you will now be ‘newcomers’ (volunteers or random draw). Newcomers, please move to the center. Original players, stay seated.*  
  *Rules change slightly:*  
  - **Pre-game discussion**: Before each round, you have **30 seconds to talk**.  
  - **Payoffs same as Round 2** (GREEN: 1.5, BLUE/RED: 1, mismatch: 0).  
  *We play 5 final rounds. Newcomers, you start with no history—listen or suggest ideas!"*  

  **Facilitator Actions:**  
  - Label newcomers visibly (e.g., give them red stickers).  
  - Record choices and note interactions during the 30-second talks (e.g., "Original players insist: ‘We always do BLUE!’").  
  - Watch for correction/punishment (e.g., scowls when newcomers dissent).  

  **Expected Dynamics:**  
  - Insiders **instruct, correct, or pressure newcomers** to conform.  
  - Newcomers may trigger mismatches, causing frustration. Mild sanctions emerge (e.g., "You ruined it!").  

  ---

  ### **Debrief (20 minutes)**  
  **Transition:** *"Now let’s connect this to social theory. Today we simulated David Lewis’s idea of a ‘convention’—a pattern that sticks because it solves coordination problems."*  

  1. **Map Round 1 to Lewis’s Conditions:**  
     - *Regularity:* "You settled on one color (e.g., BLUE) over rounds."  
     - *Arbitrariness:* "RED would have worked equally well initially—yet BLUE became ‘standard’ through precedent."  
     - *Mutual Preference:* "You preferred BLUE only because others did. If you’d been alone, you wouldn’t care!"  

  2. **Round 2: Cost of Change**  
     - "GREEN was better, but switching risked chaos. Lewis says conventions persist because **stability beats improvement** unless the gain is big enough. How much better would GREEN need to be for you to switch?"  

  3. **Round 3: Convention → Norm**  
     - *Bare Convention:* "At first, BLUE was just ‘what we do.’"  
     - *Norm Emergence:* "With newcomers, you **taught, corrected, and blamed**. This is a convention becoming a **sanction-backed norm**—where you feel you *ought* to conform."  
     - Key Difference: Conventions rely on self-interest ("I gain if we coordinate"). Norms add social pressure ("You *should* do this").  

  4. **Limitations of the Game:**  
     - *"What’s missing?* Real conventions emerge **slowly and unplanned**—no one designed traffic laws! Our game had clear rules and stakes; reality is messier. Also, real norms involve **stronger emotions** (e.g., shame for breaking etiquette)."  

  ---

  ### **Predictable Issues & Fixes**  
  1. **Round 1 stalemate:** If mismatches persist, **intervene in Round 3** by whispering to one player: "Psst—try BLUE" to create salience.  
  2. **Round 2 no-switch:** If GREEN is ignored, **ask in debrief**: "Would 2 points make you switch? What about 3?" to illustrate inertia.  
  3. **Newcomers too passive:** Assign a newcomer to "rebel" secretly ("Try RED once to see what happens").  

  ### **Post-Game Notes for Facilitator**  
  - **What the Game Can’t Replicate:**  
    - Historical emergence (centuries for language conventions vs. 90 minutes).  
    - Unconscious adoption (players knew they were coordinating; real conventions feel "natural").  
    - Cultural weight (e.g., moral norms like honesty vs. arbitrary colors).  
  - **What to Emphasize After:**  
    > "Lewis shows conventions solve coordination problems *because* they’re arbitrary—any shared pattern works. But once established, they become social facts. The line between convention and norm blurs when we start enforcing ‘the way things are done’—even when newcomers lack context."  

  **Rewards:** Distribute chocolate coins (1 per point) post-debrief.  
  **Why It Works:** Students *feel* the arbitrariness, inertia, and emerging normativity—priming them to recognize Lewis’s framework as describing their own actions.
