  I've been readin round the causal exclusion arguement and mental causation literature — Kim, the non-reductive physicalists, the overdetermination crowd — and everyones been saying the same things since the 90s without anyone budging. My working theory is that the stall isn't about minds at all, but about a hidden disagreement over whether causation is best modelled as counterfactual dependance, energy-transfer, or something like vector-field contribution, and both sides just smuggle in their preferred ontology without flagging it. So is this actually a verbal dispute about 'causation', a substantive disagreement about physical explanation, or are they just answering different questions — one about ontology, one about explanation — under the same heading? If I'm right that it's mostly framing, what distinction or formal result would actually move the needle? Or is there a deeper bedrock intuition about mental efficacy that no argument touches?
