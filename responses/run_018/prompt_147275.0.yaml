  The user's question about insulation touches on philosophy of mind. If defenders dismiss incoherent beliefs as "not real," it might protect the theory but at the cost of making it unfalsifiable. That's a valid criticism. 

  I should structure the response to rank these issues. Feasibility and computational limits are practical but not fatal. The exploiter's costs are awkward but manageable. Alternative frameworks and the insulation problem are more serious, potentially undermining the necessity of strict Bayesianism. 

