  But what about consent? The user mentions informed consent among sentient parties. Since AI isn't sentient, consent isn't applicable to them. That makes sense. But the user might be conflating whether the human's consent is informed about the AI's nature. If the human believes the AI is sentient when it's not, that could lead to issues. Bentham would consider if that deception causes harm, like psychological dependency. So the focus shifts to human well-being, which is within Bentham's framework.

