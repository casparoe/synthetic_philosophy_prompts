answer: |-
  Here are the adequacy conditions for an updateless decision theory (UDT), structured as requested:

  1.  **Dissolve Canonical Puzzles:**
      *   **Newcomb's Problem:** Must one-box, showing dominance over causal influence. *Failure of Belief-Updating:* CDT fails by maximizing causal control (two-boxing), ignoring the predictor's correlation. EDT one-boxes but for evidential reasons, not updatelessness.
      *   **Smoking Lesion:** Must smoke, distinguishing causation from correlation. *Failure:* EDT abstains due to confusing lesion evidence with causation.
      *   **PD w/ Perfect Copies:** Must cooperate against identical copies, leveraging logical correlation. *Failure:* CDT defects, ignoring logical dependence. EDT defects or cooperates inconsistently based on evidence about the copy.

  2.  **Preserve Key Distinctions:**
      *   **Causal Influence vs. Logical Correlation vs. Evidential Relevance:** Must base choices on causal influence *and* relevant logical correlations (like identical code), while correctly interpreting evidence *without* conflating it with causation or mistaking it for logical dependence. *Why:* Rationality requires acting on real levers *and* predictable logical connections.
      *   **Actual Execution vs. Counterfactual Instantiations:** Must select actions based on the global outcome across *all* relevant instances (actual & counterfactual) defined by the decision problem, without privileging the "current" moment. *Why:* In embedded/copy scenarios, the "current" agent is indexically ambiguous; optimality is global.
      *   **Suspected Tension:** Preserving causal independence (e.g., no backward causation) while honoring logical correlation across causally isolated copies (e.g., in PD) is fundamentally challenging. UDT sacrifices strict causal locality for logical coordination.

  3.  **Satisfy Consistency Conditions:**
      *   **Non-Collapse to Bayesian Updating in Embedded Contexts:** Decisions must *not* be made by conditioning the agent's prior on its current observations/sensory stream. *Why:* Conditioning traps agents in self-locating uncertainty or leads to suboptimal coordination (e.g., defecting in PD copies).
      *   **Permit Bounded Approximation:** Formal machinery must allow resource-limited agents to practically approximate the ideal decision rule. *Why:* Theory must be applicable to real (imperfect) agents.

  4.  **Handle Logical-Indexical Coupling (Non-Negotiable):**
      *   Must correctly reason when uncertainty about own code/situation ("Am I the copy?") interacts with physical observations, without resolving the uncertainty via standard conditioning. *Why:* Standard conditioning fails to distribute responsibility or update correctly across indistinguishable but indexically separate instances receiving unique data. (e.g., Knowing copies exist in other labs, seeing only your lab's result, and deciding an action affecting all).

  **Brief Scoring:**
  | Theory      | Puzzles (1) | Distinctions (2) | Consistency (3) | Logical-Indexical (4) |
  | :---------- | :---------- | :--------------- | :-------------- | :-------------------- |
  | **CDT**     | Fails NP/SL | Causal OK, Logical/Evidential Fails | Embeds poorly | Fails              |
  | **EDT**     | Fails SL/PD | Evidential OK, Causal/Logical Fails | Collapses to Conditioning | Fails              |
  | **UDT**     | Passes      | Best Effort (Tension in 2)          | Passes (Core)   | Passes (Core Aim)  |

  *   **CDT:** Fails puzzles requiring correlation sensitivity (NP, PD copies) and distinctions involving evidence/logic. Fails embedded contexts and logical-indexical coupling.
  *   **EDT:** Fails puzzles requiring causal distinction (SL) and robust coordination (PD copies). Fails key distinctions (causality) and collapses to conditioning, failing embedded/logical-indexical handling.
  *   **UDT:** Designed to pass puzzles and logical-indexical coupling, preserves distinctions best (acknowledging tension), and avoids collapse by construction. Approximation (3b) remains a practical challenge.
