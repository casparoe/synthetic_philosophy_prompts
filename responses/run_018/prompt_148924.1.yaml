  Third, consistency. UDT shouldn't collapse to Bayesian updating when agents are embedded (like in AI systems), yet must allow approximations for bounded rationality. Tricky balance.

  Fourth, the non-negotiable: logical-indexical coupling. This niche but vital case where an agent knows clones exist but only sees its own observations. Standard conditioning fails because it can't handle "which copy am I?" uncertainty.

