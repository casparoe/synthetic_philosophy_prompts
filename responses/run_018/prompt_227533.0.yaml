prompt: |-
  My roommate is a hardcore utilitarian — effective altruism, QALY maximization, the whole thing — and we've been arguing for weeks about wether it ever makes sense to just add up benefits and harms across different people. He brought up Rawls's complaint that utilitarianism doesn't take seriously the distinction between persons, and I realized I didn't actually know where I stand, so I've been stress-testing my own gut with cases. Honestly my gut is a mess. Here's what it says:

  - Runaway trolley, five people on one track and one on the other: divert. Numbers count.
  - A hospital has one dose of some miracle drug: use it on the one patient who'll die without it, not to cure ten thousand people of a nasty week-long flu. Numbers don't count here, or at least they lose.
  - Same drug, one dying patient vs two dying patients: obviously save the two. So numbers count again when the stakes are equal.
  - One person facing lifelong paralysis vs a million people each getting a one-hour headache: prevent the paralysis. Still the one.
  - But here's where I lose confidence in myself: one death vs a million people each losing a leg. My gut flips. At some point the sheer number of maimed people seems to win, even though every one of them would rather lose the leg than die.

  My roommate says cases 2 and 4 are just scope neglect and I should trust cases 1 and 5 — everything aggregates, death is just very, very bad rather than off-limits. But that makes case 2 look irrational, and it doesn't feel irrational: a week of flu times ten thousand still doesn't seem to outweigh one death, and I don't think that's an arithmetic error on my part. So: is there a principle that captures all five verdicts, or at least the first four plus an honest story about the fifth? I've toyed with the idea that harms come in tiers, where a harm from a worse tier beats any amount of harms from lower tiers — but then case 5 is a straight counterexample, and I'm reluctant to just declare my own intuition garbage. If no single principle saves everything, tell me which verdict is cheapest to drop and why. And as a test, tell me what your best candidate says about a case I haven't listed: one patient who would gain forty extra years of life vs forty patients who would each gain one extra year, where I can only fund one treatment.
reasoning: |-
  Okay, let's start by unpacking the user's dilemma. They're wrestling with their roommate's utilitarian views and their own conflicting intuitions about moral trade-offs. The user presents five scenarios where their gut reactions seem inconsistent: they approve of aggregation in some cases (trolley problem) but reject it in others (miracle drug for flu vs. death). The core tension is between accepting utilitarian aggregation and feeling that some harms shouldn't be outweighed by aggregated lesser harms.  

  First, I need to map the user's intuitions clearly:  
  - Case 1: Aggregation okay (save 5 > 1 death)  
  - Case 2: Rejects aggregation (1 death > 10k flu cases)  
  - Case 3: Aggregation okay (2 lives > 1 life)  
  - Case 4: Rejects aggregation (1 paralysis > 1M headaches)  
  - Case 5: Intuition flips (1 death < 1M lost legs? But feels conflicted)  

  The roommate calls cases 2/4 "scope neglect" – implying the user undervalues large numbers. But the user insists their rejection isn't arithmetic error; it feels morally significant. The user also adds a test case: 1 person gaining 40 years vs. 40 people each gaining 1 year.  

  Key observations:  
  The user's discomfort centers on *cross-category trade-offs* (death vs. non-fatal harms). They accept aggregation within categories (deaths vs. deaths, paralysis vs. paralysis) but balk when trading fatal vs. non-fatal harms (case 2) or severe disability vs. trivial harms (case 4). Case 5 exposes a breaking point where aggregated severe-but-sub-lethal harm (lost legs) might outweigh death.  

  Possible frameworks to reconcile this:  
  1. **Lexical Thresholds:** Harms are ranked in tiers (death > paralysis > lost limb > flu > headache). Higher-tier harms can't be outweighed by any number of lower-tier harms. But case 5 breaks this – user feels 1M lost legs might outweigh 1 death. So pure lexical ordering fails.  

  2. **Diminishing Marginal Disutility:** Adding more people experiencing a harm yields diminishing moral weight. But this doesn't explain why case 2 (death vs. flu) feels different from case 3 (death vs. death).  

  3. **Person-Affecting View:** Focus on "how bad for each individual." Death is categorically worse *for the person* than non-death harms, making aggregation inappropriate across that boundary. Case 5 challenges this because losing a leg is life-altering enough to blur the line.  

  The "Aggregative Pluralism" model seems promising here:  
  - **Separate Spheres:** Death prevention is a unique moral priority. Non-lethal harms aggregate *among themselves* but can't cross the death barrier.  
  - **For case 5:** Lost legs are severe but non-lethal, so they *can* aggregate to outweigh death *if the number is large enough*. This explains why case 2 (death vs. flu) rejects aggregation (flu isn't severe enough regardless of numbers), but case 5 (death vs. lost legs) allows aggregation at scale.  
  - **Test case (40 years vs. 40 people/1 year):** Under this model, life-extension is non-lethal harm reduction. If we consider each life-year morally equivalent, saving 40 people for 1 year equals 40 life-years – same as saving one for 40 years. But the model might prioritize *completeness* of benefit (giving one person a full lifespan) over fragmented benefits. Verdict: lean toward saving one for 40 years, as 40 separate 1-year extensions feel less transformative.  

  Why this resolves the tension:  
  - It honors the user's rejection of trading death for flu (case 2) or paralysis for headaches (case 4) by treating death/severe disability as protected categories.  
  - Explains case 5: lost legs, while severe, occupy a "near-death" tier where astronomical numbers *can* outweigh death.  
  - Addresses the roommate's "scope neglect" charge: aggregation *is* valid, but only within appropriate harm categories.  

  Cheapest verdict to drop? Case 4 (paralysis vs. headaches). If headaches were numerous enough (e.g., 10^20 people), we might intuitively prioritize them – but this feels unrealistically abstract. In practical terms, maintaining a "severe harm" tier (paralysis > headaches) holds.  

  Final note: The user's struggle reflects a deeper conflict between utilitarian efficiency and deontological constraints. Their intuition leans toward threshold deontology with aggregative concessions for catastrophic sums – a hybrid view Rawls might critique but that reflects real moral psychology.
answer: |-
  Your intuitions are remarkably consistent with a view I'll call **Aggregative Pluralism**—a hybrid of threshold deontology and aggregative consequentialism. It preserves all five verdicts and handles your test case. Here's the breakdown:

  ### Core Principle: **Harm Severity Tiers with Aggregation Limits**
  1. **Harms are categorized into tiers** based on severity (e.g., death > permanent disability > temporary suffering).  
  2. **Aggregation within a tier is permitted** (e.g., lives vs. lives, headaches vs. headaches).  
  3. **Aggregation *across* tiers is restricted**:  
     - A higher-tier harm **cannot be outweighed** by *any number* of lower-tier harms.  
     - But a sufficiently large number of harms in a *near-equivalent tier* **can outweigh** a single instance of a slightly higher-tier harm.  

  ### Applying the Principle to Your Cases:
  | **Case** | **Verdict** | **Explanation** |
  |----------|-------------|-----------------|
  | **1. Trolley (5 deaths vs. 1 death)** | Save 5 | *Aggregation within tier*: All harms are deaths (same tier). |
  | **2. Drug: 1 death vs. 10k flu cases** | Save the dying | *No cross-tier aggregation*: Death (Tier 1) > temporary illness (Tier 3). Flu isn't severe enough to enter death's tier. |
  | **3. Drug: 1 death vs. 2 deaths** | Save 2 | *Aggregation within tier*: All harms are deaths. |
  | **4. Paralysis vs. 1M headaches** | Prevent paralysis | *No cross-tier aggregation*: Lifelong paralysis (Tier 2) > headaches (Tier 4). Headaches don't breach the disability threshold. |
  | **5. 1 death vs. 1M lost legs** | **Save 1M from losing legs** | *Near-equivalent tier aggregation*: Losing a leg (Tier 2) is severe enough to be "adjacent" to death (Tier 1). At sufficient scale (1M+), aggregated Tier 2 harms outweigh one Tier 1 harm. |

  ### Why Your Gut Flips in Case 5:
  - **Lost legs are a border-tier harm**: They cause permanent disability, social stigma, chronic pain, and reduced life expectancy—edging close to death in severity. While *one* lost leg isn't equivalent to death, a critical mass makes the aggregated harm comparable.  
  - **Roommate's critique fails**: Scope neglect *would* apply if you dismissed 1M headaches (Case 4), but lost legs are objectively closer to death than headaches or flu. This isn't irrational—it's tier-sensitive aggregation.  

  ### Test Case: 1 Person Gains 40 Years vs. 40 People Gain 1 Year
  - **Verdict**: Save the **one person gaining 40 years**.  
  - **Why**:  
    - Life-extension is Tier 2 (preventing premature death).  
    - Giving 40 people one extra year is Tier 3 (temporary benefit).  
    - *No cross-tier aggregation*: A Tier 2 harm prevented (early death) outweighs any number of Tier 3 benefits.  
    - Key nuance: The 40 people aren't *harmed* by missing one year; they merely forgo a modest gain. Death prevention trumps scattered small benefits.  

  ### If You Must Drop One Verdict:
  The **cheapest to drop is Case 4 (paralysis vs. headaches)**. Why?  
  - **Argument for dropping it**: If headaches could be aggregated to *infinity* (e.g., 10^20 people), we might intuitively feel paralysis should be sacrificed to prevent astronomical suffering. This forces paralysis into a tier *slightly* below death, where sufficiently vast numbers of lower-tier harms could outweigh it.  
  - **Cost**: This weakens the "tier firewall" but still preserves the death/trivial-suffering distinction (Case 2).  

  ### Why This Works Better Than Pure Utilitarianism or Rawls
  - **Beats utilitarianism**: Explains why death isn't tradable for flu (roommate's mistake) and why paralysis outweighs headaches.  
  - **Beats Rawls**: Accepts aggregation when harms are comparable (Trolley, 2 deaths vs. 1) but avoids sacrificing individuals for trivial gains.  
  - **Handles thresholds**: Death is "special," but border-tier harms (lost legs) can aggregate against it at scale.  

  Your intuitions aren't a mess—they reveal a sophisticated ethical framework. **Aggregative Pluralism** formalizes your gut: aggregate freely within harm tiers, protect against cross-tier trade-offs, but permit exceptions for catastrophic sums of near-equivalent harms. Case 5 isn't a counterexample; it's the system working as designed.
