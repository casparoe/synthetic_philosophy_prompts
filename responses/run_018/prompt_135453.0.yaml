prompt: |-
  I help run these little puzzlehunt nights — about twenty teams, twice a year — and we keep getting rows about 'strategy stealing'. One team works out a clever move, like using a mirror to bounce light onto a hidden clue, and another team just copies it. A mate mentioned there's a 'strategy-stealing assumption' from game theory: if your rival can copy your move without any special access, then that move wasn't really giving you a private advantage anyway. I want a proper procedre my fellow organisers can run when someone complains, because right now we just argue.

  It should be a step-by-step checklist: the questions to ask in order, what counts as a yes or no at each step, where we stop and say 'no penalty', where we say 'penalty', and where we have to admit it's just our values talking — like whether copying feels unsporting even if the rules don't ban it. We only have about ten minutes after a complaint and none of us have studied philosophy. Apply it to three cases: copying the mirror trick; copying a whole division-of-labour system where one team split up the puzzles and another copied that structure; and copying a trick that only happened because the second team accidentally saw the first team's private notes. Include one where the procedre gives an answer we'll probably hate. And be honest about where it breaks down or can't settle things.

  Please write the answer in British English, and don't give me a reading list or citations — I just need something we can actually use on the night.
reasoning: |-
  Alright, let me tackle this puzzle hunt organiser's problem. They're dealing with teams complaining about "strategy stealing" during events. The core issue seems to be that one team comes up with a clever solution and another team copies it, causing arguments. 

  The organiser mentioned a game theory concept about strategy-stealing where if a move can be copied without special access, it wasn't a private advantage. But they need a practical decision tree they can use during events - something step-by-step that non-philosophers can apply in under 10 minutes.

  Hmm, I need to consider different scenarios they face:
  - Physical tricks like mirror use
  - Organizational strategies like task division
  - Accidental information leaks
  Plus they want examples including one where the procedure gives an unpopular outcome

  First, I should identify key principles that might apply:
  - Fairness (was there unequal access?)
  - Originality (was it a unique insight or obvious?)
  - Intent (was copying deliberate?)
  - Advantage (did it actually help?)

  But since they need speed, these should be distilled into yes/no questions. Probably starting with the clearest violations first - like accidental leaks - before moving to grayer areas.

  For the procedure structure:
  Step 1 should handle clear cheating (e.g. seeing private notes)
  Step 2 might cover non-replicable advantages (special tools?)
  Step 3 could address the game theory principle - if it's copyable without special access, maybe it's fair
  Then finally a "values call" step for truly ambiguous cases

  The examples need to test this:
  1. Mirror trick - probably legal under game theory view
  2. Division of labor - trickier, but likely legal
  3. Leaked notes - clear violation
  4. Unpopular case - maybe penalizing something everyone thinks is fine?

  Important to note where the system breaks down - like when "obviousness" is subjective. And admit that some decisions will reflect organizational values rather than absolute fairness.

  The tone should be practical British English - no jargon, just clear questions. Phrases like "special access" instead of "excludability", "deliberate nicking" instead of "unethical appropriation". 

  For the unpopular outcome example: imagine penalizing a team for copying a very basic strategy that everyone ends up using. The procedure might flag it as "copyable without special access" but staff might feel it's too harsh. That shows the system's limitation.

  Finally, emphasize that after steps 1-4, if still unclear, it becomes a sportsmanship judgement call - and that's okay as long as consistent. The key is stopping endless arguments, not achieving perfect justice.
answer: |-
  Right then, here's a clear, step-by-step procedure you can use on the night when a "strategy stealing" complaint comes in. It's designed to be quick, practical, and based on key principles rather than philosophy degrees. Stick to this checklist in order:

  **"Strategy Stealing" Complaint Procedure (v1.0)**

  **Principles:**
  1.  **Fair Access:** Did the copying team gain an unfair *advantage in access* to the information/method?
  2.  **Unique Capability:** Did the original team use a unique skill, tool, or insight *others couldn't reasonably replicate*?
  3.  **The Copy Test (Game Theory Bit):** Could *any* team have figured out and copied this move simply by observing the *public outcome* or thinking similarly, without needing special access or unique capability?
  4.  **Organiser Values (Sporting Conduct):** Even if 1-3 say "no penalty", does this *specific* instance feel so blatantly unsporting or against the intended *spirit* of our event that we need to act?

  **The Checklist (Run through in order, stop at first "Penalty" or "No Penalty"):**

  1.  **"Special Access?"** Did the copying team gain knowledge of the strategy/method *because*:
      *   They saw the original team's *private notes, materials, or screens* accidentally or deliberately? (e.g., notes left visible)
      *   An organiser *inadvertently revealed* it to them?
      *   They *overheard* a private discussion about the strategy?
      *   **YES?** → **PENALTY** (e.g., time penalty, puzzle reset if possible). *Reason: Unfair information access.*
      *   **NO?** → Proceed to Step 2.

  2.  **"Unique Capability?"** Did the original team's strategy/method *fundamentally rely* on something *only they* had or could do that others couldn't reasonably replicate? Examples:
      *   A team member's unique, *specific* expertise (e.g., fluent in a rare language clue, expert lockpicker).
      *   A *specific physical tool* not generally available or mentioned (e.g., a bespoke UV light, specialised software they wrote).
      *   **YES?** → **PENALTY** if copied. *Reason: Exploiting unique, non-replicable advantage unfairly.*
      *   **NO?** → Proceed to Step 3. *(Most "clever tricks" like mirrors, common tools, organisational methods fall here).*

  3.  **"The Copy Test (Public & Replicable)?"** Could any other team:
      *   Have *independently thought* of the same strategy/method reasonably (i.e., it wasn't a wildly unique insight)?
      *   Or, have *observed the result/setup* during normal puzzling (e.g., seeing a mirror reflecting light, seeing another team split into specialist groups) and *copied it* without needing Steps 1 or 2?
      *   **YES?** → **NO PENALTY**. *Reason: This is the "strategy-stealing assumption". If it was obvious enough to copy from public info/thinking, it wasn't a truly exclusive advantage. This is often just smart competition.*
      *   **NO?** *(Very rare - implies a unique insight AND no public evidence)* → Proceed to Step 4. *(Be very strict here - if they *saw* it happen or the result, it's copyable).*

  4.  **"The Values Call (Unsporting?)?"** Despite passing Steps 1-3 (especially Step 3), does this *specific* instance feel:
      *   Like it fundamentally *undermines the spirit* of fair play and puzzle-solving *you* want at your events?
      *   Particularly *blatant, lazy, or demoralising* in a way that harms the event atmosphere?
      *   **YES?** → **PENALTY** (likely smaller, e.g., 10-15 min time penalty). *Be Honest:* "Look, technically it passes the earlier tests, but that felt *too* cheeky/lazy against the spirit of things. Minor penalty applied. Let's all crack on."
      *   **NO?** → **NO PENALTY**. *Reason: Falls within expected competitive behaviour based on the rules and setup.*

  **Applying the Procedure - Your Cases:**

  1.  **Copying the Mirror Trick:**
      *   Step 1: Did they see private notes or get special access? **NO.**
      *   Step 2: Did it need a unique capability? (Mirror is common tool). **NO.**
      *   Step 3: Could they see the light bouncing/copy the idea? **YES.**
      *   **RESULT: NO PENALTY.** (This is the classic "strategy-stealing assumption" in action).

  2.  **Copying the Division-of-Labour System:**
      *   Step 1: Special Access? (Unlikely, seeing teams split up is public). **NO.**
      *   Step 2: Unique Capability? (Organising people isn't unique). **NO.**
      *   Step 3: Could they see/think of copying the structure? **YES.**
      *   **RESULT: NO PENALTY.** (It's an organisational method, easily observed or conceived).

  3.  **Copying a Trick via Accidental Private Notes:**
      *   Step 1: Special Access? **YES.** (They saw private notes accidentally).
      *   **RESULT: PENALTY.** (Stops here at Step 1).

  4.  **The Unpopular Outcome Example (Applying the Rules Strictly):**
      *   **Scenario:** Team A spends ages working out that rotating a common map 90 degrees makes a landmark match a clue. Team B, stuck on the same puzzle, simply notices Team A celebrating near their *rotated map* (clearly visible on their table) and copies it. Team A complains.
      *   Procedure:
          *   Step 1: Special Access? (Map was on Team A's table, visible during normal puzzling - not *private notes*). **NO.** (This is key - the *result* (rotated map) was public).
          *   Step 2: Unique Capability? (Rotating a map? No). **NO.**
          *   Step 3: Copy Test? (They saw the *solution setup* publicly). **YES.**
          *   **RESULT: NO PENALTY.**
      *   **Why you'll hate it:** It feels like Team B got the answer for free by eyeballing Team A's workspace. It *is* lazy. But under the "public & replicable" test (Step 3), seeing the *applied solution* on someone's table is public information. You *could* use Step 4 (Values Call) for a minor penalty if it feels egregiously unsporting ("Right, you clearly just nicked that visually without *any* thought, 10-minute penalty"), but strictly by Steps 1-3, it's **No Penalty**. This highlights the tension between pure competition and spirit.

  **Where It Breaks Down / Can't Settle Things:**

  1.  **"Obviousness" in Step 3:** Was the strategy *truly* independently thinkable or only copied because seen? This is subjective. The procedure *assumes* that if it was publicly observable, it's fair game, even if unoriginal. This might feel wrong sometimes.
  2.  **"Blatantness" in Step 4:** Defining "unsporting" is inherently subjective and based on *your* event's culture. Two organisers might disagree. The procedure forces you to *admit* this is a values call, not a fairness rule.
  3.  **Speed vs. Accuracy:** In 10 minutes, you might not get perfect facts. Go with the most likely scenario based on quick team statements (if needed) and observable evidence.
  4.  **Precedent:** A Values Call (Step 4) penalty sets a vague precedent. Use it sparingly and consistently explain it as "spirit of the event" not "breaking a rule".

  **On the Night Script:**

  1.  **Hear Complaint:** Quickly from both sides (1 min max per team).
  2.  **Run Checklist Aloud:** "Right, let's use our procedure. Step 1: Special access? Did Team B see private notes or get info from an organiser accidentally?" (etc.). Be seen to be following it.
  3.  **State Result Clearly:** "Based on Step [X], result is [Penalty/No Penalty]. [Brief reason]."
  4.  **If Step 4 Used:** "Technically, it passes the first three checks, but we feel copying it *that* directly without any own effort goes against the spirit we want. Minor penalty of Y minutes applied. Let's focus on the next puzzle!"
  5.  **Move On:** Don't rehash. Your decision is final for the night. Discuss refinements *after* the event.

  This gives you a consistent, defensible framework that addresses the game theory point, handles clear cheating, acknowledges the grey area of "spirit", and stops endless arguments by following a predefined process. Good luck!
