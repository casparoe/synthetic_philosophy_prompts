  So me and my friend got into this long argument about Popper last night after he skimmed some philosophy of science blog. He summed up Popper's view on Darwinism like this: Popper originally attacked natural selection as a tautology — the fittest survive, and the ones who survive are the fittest, so the statement is circular and can't be falsified. Because of that, Popper supposedly classified evolutionary theory as a metaphysical research programme rather than real empirical science. Then my friend claimed Popper eventually admitted in his autobiography that he was wrong about the circularity part, but only because biologists bullied him into it, and he still secretly thought Darwinism was unfalsifiable since it explains every outcome after the fact. From all this, my friend concluded that Popper's falsifiability criterion is useless for historical sciences and that Popper only backtracked to save face and avoid being embarassed.

  That sounds too neat to me, especially the bullying part and the way he treats "explains after the fact" as Popper's actual argument rather than a separate worry. But I also remember Popper did call Darwinism metaphysical at some point, so maybe there's something real buried in here. Can you audit this summary for me? I want to know what's an accurate representation of Popper's texts, what's a standard misreading, and whether his later revision was actually a substantive change or just cosmetic. Please separate what's pretty settled among philosophers of science from what's still genuinely debated, and don't present one contested interpretation as if it's the consensus. I'm particlarly confused about whether Popper thought being a metaphysical research programme meant the same thing as being unscientific — my friend treats those as identical, and I have a feeling Popper kept them apart on purpose.
