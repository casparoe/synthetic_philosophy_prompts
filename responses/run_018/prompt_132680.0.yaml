  **FINE PRINT:**  
  *   All freedom states are contingent upon local laws, economic realities, and prevailing social power structures. LSI provides a framework, not outcomes.
  *   "Non-Domination" (Enterprise Tier) is defined solely as the absence of formally documented, discretionary power subject to *possible* contestation via provided templates. Does not imply equality, equity, or freedom from non-arbitrary constraints.
  *   "True Self" (Premium Tier) determinations are proprietary algorithmic outputs. Disputing your True Self™ diagnosis may trigger mandatory Recalibration Intervention® (additional fees apply).
  *   Benevolent Master Protocol™ (Basic Tier) does not guarantee benevolence persists; monitors only for active command issuance, not capacity or intent.
  *   Structural Power Analysis Add-On (Enterprise Tier) identifies potential influences only; mitigation not included.
  *   Liberty Solutions Inc. reserves the right to redefine feature parameters and philosophical underpinnings with 30 days notice. Freedom is a process, not a state.
