answer: |-
  **Bottom line:** The nuclear analogy fails critically for IAEA-style governance because AGI is fundamentally non-containable knowledge, not a physical weapon—making central control impossible and proliferation inevitable. The analogy smuggles in false containment assumptions.

  **Correspondence Table:**

  | Nuclear Element       | AI Analog                     |
  |-----------------------|-------------------------------|
  | Bomb                 | Operational AGI system        |
  | Fissile material     | Training compute + algorithms |
  | Enrichment facility  | Large GPU clusters/data centers |
  | Deterrence           | Mutual vulnerability from AGI capabilities |
  | Verification         | Model inspections/compute monitoring |

  **Critical Breakdown of Disanalogies:**

  1.  **Bomb vs. AGI System:** Nukes are discrete physical objects. AGI is *iterative software*: easily copied, modified, and deployed silently worldwide. A "blast radius" implies localized damage; AGI failure could be instantaneous, global, and irreversible (e.g., via networked systems). **Matters:** Proliferation can't be stopped by controlling physical sites; containment is fantasy.

  2.  **Fissile Material vs. Compute/Algorithms:** Uranium is scarce, requires massive industrial effort to enrich, and is consumed on use. Compute is reusable, rapidly becoming cheaper/more efficient, and algorithms (knowledge) are infinitely replicable. **Matters:** You can't "control" the core ingredient (knowledge + efficient compute); export controls slow, not stop, proliferation.

  3.  **Enrichment Facility vs. Data Centers:** Centrifuges are single-purpose, detectable, and hard to build/hide. GPU clusters are dual-use (used for everything from weather modeling to gaming), commoditized, and can be distributed/cloud-based. **Matters:** "Monitoring facilities" is ineffective; targets are everywhere and legitimate.

  4.  **Deterrence:** Nuclear deterrence relies on predictable retaliation against known entities. AGI capabilities could enable unprecedented deception, speed, or autonomous action, making attribution and credible retaliation difficult or obsolete. **Matters:** Undermines the stability an IAEA model assumes.

  5.  **Verification:** Nuke verification (e.g., radiation signatures) relies on physics. Verifying AGI capabilities/safety is a software verification nightmare – inspecting weights doesn't reveal emergent capabilities or subtle misalignment. **Matters:** Effective treaty verification is likely impossible, making "teeth" meaningless.

  **The Fatal Flaw:** The analogy absolutely smuggles in containment. Nukes stay in bunkers. AGI, once created, is a *design paradigm* and *capability* that will inevitably permeate global digital infrastructure, economy, and conflict. Treating it like a physical weapon to be locked away ignores that its power derives from ubiquitous integration.

  **Better Analogy?** Think **Biosecurity + Accelerated Cyber:** Like engineered pathogens, AGI could cause catastrophic accidents or deliberate harm, but unlike pathogens, it’s digital (infinitely copyable, modifiable) and its "lab" is any data center. Governance must focus on resilience, safety standards, incident response, and managing inescapable proliferation, not futile containment. An IAEA model is a dangerous illusion.
