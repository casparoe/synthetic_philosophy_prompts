answer: |-
  In considering the recurrent invocation of the slogan 'absence of evidence is not evidence of absence' within debates surrounding pseudohistory, it becomes essential to parse its potential meanings with some precision, particularly for your seminar on philosophical approaches to such appeals. This phrase, while rhetorically potent, can express distinct theses, each carrying different implications for historical methodology and the demarcation problem. We may broadly separate these into epistemic claims concerning our current state of knowledge and ontological claims about the nature of the past itself, while further distinguishing views on whether extant historical records constitute a complete sample or an open population.

  One primary reading is epistemic and pertains to the incompleteness of our investigative efforts or the archival corpus. It asserts that our failure to have discovered evidence for a phenomenon does not, in itself, constitute proof that the phenomenon did not occur; it may simply remain undiscovered or unpreserved. This is often a trivial platitude, acknowledging the fallibility and limitations inherent in historical research, especially when dealing with fragmentary or perishable sources. It genuinely supports the pseudohistorical move only under specific conditions: namely, when applied to contexts where the historical record is demonstrably an open population – such as periods with severe archival losses, or geographical areas where archaeological exploration is nascent. It holds less force when the extant records are reasonably treated as a closed or complete sample for the specific claim in question. For instance, the absence of any material evidence for a technologically advanced civilisation like Atlantis in expected geological strata or contemporary Near Eastern records, despite extensive investigation, carries more weight against its historicity than the absence of specific medieval administrative documents in a particular archive might against the existence of a minor historical event. This epistemic reading applies to both myth-based claims and mathematically-framed revisionism like Fomenko's, but its persuasiveness diminishes significantly in the latter case if the revisionist model requires the systematic absence of vast swathes of evidence that *should* exist if the model were true, especially when independent dating methods (like dendrochronology or radiocarbon dating) corroborate the conventional chronology Fomenko rejects.

  A stronger, but potentially more problematic, epistemic reading interprets the slogan as implying that a lack of evidence *never* rationally justifies disbelief or even reduces the probability of a claim's truth. This transforms the platitude into a principle of epistemic immunity, shielding assertions from falsification. While rarely defended explicitly by scholars, it often underpins pseudohistorical argumentation. It is not trivial and is philosophically contentious, as it disregards how the consistent absence of expected evidence *can* become evidence of absence under a coherent probabilistic framework, particularly when the hypothesis predicts such evidence *should* be readily discoverable if true. This version strongly supports pseudohistorical moves by rendering claims unfalsifiable. It applies equally to Atlantis narratives (where one might expect monumental ruins, cultural diffusion, or textual references) and to Fomenko's statistical arguments (where the absence of expected astronomical records or coin hoards for the 'phantom centuries' becomes significant), but its application is fundamentally flawed in both cases as it ignores the weight of negative evidence within a broader evidential context.

  Shifting to ontological interpretations, the slogan might be taken to assert that the past itself possesses a reality independent of our records, and therefore, the non-existence of traces does not entail the non-occurrence of events. This is ontologically unassailable but epistemically inert; while the past is indeed fixed and independent of our knowledge, our access to it is *only* through traces and inference. As such, this reading becomes a trivial truism that offers no practical guidance for historical inquiry and cannot, by itself, support any specific positive claim about the past, pseudohistorical or otherwise. It applies vacuously to all historical claims, whether about Atlantis, ancient astronauts, or chronologies, precisely because it divorces historical reality from historical epistemology. It provides no warrant for believing in Atlantis or a compressed timeline; it merely restates that our ignorance does not change what happened.

  Crucially, the applicability and force of the slogan hinge on the implicit model of the historical record. If one treats the available sources as a more-or-less complete sample for the type of event or entity postulated (e.g., expecting a continental civilisation to leave clear geological, genetic, or widespread cultural imprints), then absence of evidence *does* become potent evidence of absence. Conversely, if the record is rightly viewed as an open population – inherently fragmented, biased, and incomplete for the specific question – then the slogan retains validity as a caution against premature closure. Pseudohistory frequently exploits this ambiguity, treating records as open populations when defending their positive claims (e.g., 'Atlantis records are lost') while ignoring how the cumulative weight of absence across multiple, independent evidentiary lines can effectively close the sample for large-scale, high-visibility phenomena. Fomenko's revisionism exemplifies this, interpreting missing records as mere gaps while neglecting how the coherence and mutual reinforcement of diverse dating methods across disciplines render the absence of evidence *for* his proposed timeline, and the overwhelming presence of evidence *against* it, highly significant. The slogan, therefore, functions differently for myth-based claims versus mathematically-framed revisionism only in the nature of the evidence sought and the plausibility of the 'gaps'; its core logic is similar, but its misuse is equally detrimental to sound historical reasoning in both domains when it ignores the context of expectation and the totality of evidence. Its legitimate use lies only in reminding us of provisionality within genuine open inquiries, not in granting licence to disregard the cumulative force of negative evidence.
