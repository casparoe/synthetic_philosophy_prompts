  In discussions about pseudohistory and demarcation I keep encountering the phrase 'absence of evidence is not evidence of absence', usually invoked to defend claims about Atlantis or ancient astronaut theories, but also recently in debates over the statistical revisionism linked to Fomenko, where missing medieval records are treated as archival gaps rather than falsification. For a seminar I am preparing on how philosophy of history should treat such appeals, could you lay out the distinct precise theses that this slogan might actually be expressing — separating epistemic claims about our present knowledge from ontological claims about the past itself, and distinguishing versions that treat historical records as complete samples from those that treat them as open populations? For each reading, indicate whether it is a trivial platitude, whether it genuinely supports the pseudohistorical move, and whether it applies with equal force to myth-based claims like Atlantis and to mathematically-framed revisionism. Please write entirely in continuous prose, with no headings, bullet points, bold text, or tables, as you would in a formal letter, and employ British English spelling throughout.
