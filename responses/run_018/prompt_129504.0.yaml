answer: |-
  Your argument presents a compelling challenge, but I contend that epiphenomenalism does **not** inevitably collapse into scepticism about one’s own mind, despite creating an apparent evidentiary symmetry. My defence rests on two key distinctions: metaphysical certainty versus empirical evidence, and the nature of introspective reports. I’ll adopt British English and a committed stance throughout.

  ### 1. **The Indubitability of Subjective Experience**  
  Epiphenomenalism asserts that qualia (subjective experiences) are causally inert by-products of physical processes. Yet, your *awareness* of these qualia—what you call your "conviction"—is not an inference from evidence but an immediate, pre-reflective fact. Even if that conviction is *caused* by neural processes, its *content* is the direct presence of consciousness itself. To doubt this is performatively self-contradictory: the act of doubting presupposes a conscious subject doing the doubting. This is not empirical "evidence" but a transcendental condition of having any mental states at all. A zombie’s utterance "I am conscious" is empty, but *your* utterance is a report grounded in actual phenomenology. The difference lies not in the causal chain but in the ontological reality of the experience being reported.

  ### 2. **The Misplaced Evidential Weight**  
  You claim your first-person reports "carry no distinctive evidential weight" because a zombie would produce identical reports. But this conflates two distinct issues:  
  - **Third-person evidence** (e.g., behavioural or neural correlates) is indeed symmetrical between you and a zombie.  
  - **First-person authority** is not "evidence" in the empirical sense; it is the *ground* of what we mean by consciousness. Your reports aren’t inferences—they’re expressions of an immediate reality. The zombie’s reports are false because they lack this reality, but *yours are true because they accompany it*. Epiphenomenalism doesn’t negate this truth; it merely denies qualia a causal role in producing reports.  

  *(Here I assume introspective authority is non-inferential. This is contested by eliminativists like Dennett but remains the default position in phenomenology.)*

  ### 3. **Causal Closure and the "Gap" Problem**  
  Your scepticism arises from assuming causal closure: if physics fully governs brain processes, and qualia are causally irrelevant, how can we "know" them? But epiphenomenalism doesn’t sever the *correlation* between neural states and qualia—it only severs causation *from* qualia. The neural state causing your belief "I am conscious" still reliably *correlates* with actual consciousness because it’s the same state that produces qualia. The zombie, by definition, lacks this correlation: its neural state is identical but *not* accompanied by qualia. Thus, your belief is justified by the presence of qualia (even if they don’t cause it), while the zombie’s is unjustified.  

  *(This relies on the contested assumption that neural states *necessitate* qualia. Property dualists accept this; illusionists reject it.)*

  ### 4. **Why Scepticism Isn’t Necessary**  
  To say "I might be a zombie" is incoherent. Zombies are conceivable *from the third-person perspective*, but *you* cannot coherently doubt your own consciousness without presupposing it. Epiphenomenalism doesn’t create new sceptical problems—it inherits the same "hard problem" of consciousness but doesn’t exacerbate first-person uncertainty. Your conviction isn’t a *conclusion* drawn from evidence; it’s a direct manifestation of consciousness. The theory explains *how* this conviction arises physically but doesn’t invalidate its veracity.

  ### Conclusion  
  Epiphenomenalism **does not** collapse into scepticism about one’s own mind because subjective awareness is not an evidentiary claim but an indubitable fact of existence. While it renders first-person reports *causally indistinguishable* from a zombie’s to an external observer, it does not undermine the first-person reality they express. Your reports carry "distinctive weight" not as evidence *for* consciousness, but as the *instantiation* of consciousness itself. The theory’s weakness is explaining *why* qualia exist, not undermining knowledge of them.  

  *(Position committed to: Non-sceptical epiphenomenalism grounded in metaphysical certainty of subjective experience.)*
