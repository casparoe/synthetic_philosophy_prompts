prompt: |-
  I'm the audit lead for our city's behavorial-policy unit — every week I get proposals for nudges like opt-out organ donation, calorie-label mandates, retirement savings defaults, that kind of thing. Right now I'm just winging it with a gut check about autonomy, but I need something reusable my team can actually run in about fifteen minutes before I sign off. I sketched out a framework with a colleague that splits interventions into two kinds: Type A changes the choice environment — reorder options, change defaults, keep the full menu technically available — while Type B shifts how preferences themselves get formed or weighted, like framing that makes a value feel illegitimate, hiding options behind social stigma, or using emotional priming so people want different things than they did before. The core idea is that Type B needs stricter justification because it doesn't just steer revealed preferences; it risks constructing them, and that asymmetry should drive the audit.

  Please turn this into a step-by-step decision procedure: ordered questions, what counts as a sufficient answer to each, where the flow stops with a hard no, and where it stops and says "this is now a values call, escalate to the ethics board." Apply it to three proposals: (1) an opt-out pension enrollment with a 3% employer match, (2) a school-cafeteria redesign that puts junk food behind a counter with a five-minute wait but technically allows it, and (3) a smoking-cessation poster campaign that frames continued smoking as "letting your family down" — I actually like this one, but I want the procedure to either reject it or escalate it in a way that annoys me. Make sure you flag where the Type A / Type B line gets blurry — for instance when a default also sends a social signal — and be explicit about what the procedure flat-out can't settle. Don't ask me to cite philosophers or build a bibliography; I just need the checklist, the worked cases, and an honest note about where judgment can't be eliminated.
reasoning: |-
  Okay, let me tackle this user request. The user is an audit lead for a city's behavioral-policy unit who needs a practical 15-minute decision framework to evaluate "nudge" proposals. Their current gut-check approach isn't scalable, and they've already developed a promising Type A/Type B distinction where Type B requires stricter scrutiny due to preference manipulation risks. 

  First, I need to translate their conceptual framework into a concrete step-by-step procedure. The key is creating clear decision thresholds - hard stops, green lights, and escalation points. The examples provided (pension opt-out, cafeteria redesign, smoking posters) will be crucial test cases. 

  For the structure, I'm considering a 6-step flow: 
  1. Type classification (A/B) 
  2. Preference preservation check 
  3. Transparency assessment 
  4. Harm avoidance 
  5. Reversibility 
  6. Burden justification

  The blurry areas need special attention - like when a default setting (Type A) carries implied social pressure (Type B effect). The smoking poster example is intentionally tricky because the user likes it personally but wants the procedure to challenge it. That's a perfect test case for the framework's objectivity.

  The worked examples should demonstrate how each step applies: 
  - Pension opt-out would likely pass as Type A 
  - Cafeteria redesign might be borderline but pass 
  - Smoking posters should trigger escalation due to emotional manipulation

  I'll add clear annotations about where judgment is unavoidable - especially around "sufficient justification" for Type B interventions. The ethics board escalation triggers must be unambiguous. The tone should stay practical, with no academic references as requested.

  Most importantly, the framework must hold up when the user personally disagrees with the outcome - that's the real test of robustness. The smoking poster analysis needs to "annoy" them as requested to prove the procedure works.
answer: |-
  Here’s a streamlined 15-minute audit procedure based on your Type A/B framework, designed for practical use. **Bold** = key questions/decisions, *italics* = rationale/clarifications.

  ---

  ### **Nudge Audit Procedure: Step-by-Step**
  *(Run sequentially; stop if hard "No" or "Escalate" triggered)*

  1.  **Type Classification: Does the intervention *primarily* alter the *choice environment* (Type A) or *preference formation/weighting* (Type B)?**
      *   *Sufficient Answer:* Clear dominant mechanism. If ambiguous (e.g., default + strong implied social signal), flag as "Type B Potential" and proceed cautiously.
      *   *Blurriness Note:* Defaults are usually Type A **unless** they imply official endorsement ("most people do this") or stigma ("you’re odd if you opt out"). Framing that *merely highlights consequences* is Type A; framing that *induces shame/guilt* is Type B.
      *   *Stop/Flow:* Proceed regardless. Type B triggers stricter scrutiny later.

  2.  **Preference Preservation: Does the intervention preserve *all* original choice options without *material* barriers?**
      *   *Sufficient Answer:* "Yes" if options remain equally accessible in practice (cost, time, effort unchanged). "No" if barriers are significant (e.g., major time cost, complex opt-out).
      *   *Stop/Flow:* **HARD NO** if "No". (e.g., hiding junk food behind a 30-min wait fails; 5-min wait *might* pass if justified later).

  3.  **Transparency & Honesty: Is the mechanism obvious to a reasonable person, and is all information presented truthfully?**
      *   *Sufficient Answer:* Mechanism is perceptible (e.g., default is visible) and information isn’t deceptive. Omission is acceptable if not materially misleading.
      *   *Stop/Flow:* **HARD NO** if deliberately obscure or deceptive.

  4.  **Harm Avoidance: Does the intervention avoid exploiting cognitive biases to cause *foreseeable* net harm to vulnerable groups?**
      *   *Sufficient Answer:* Evidence/reasoning that harms (e.g., anxiety, financial loss, stigma) are unlikely OR outweighed by benefits for targeted group. *Burden of proof on proposer.*
      *   *Stop/Flow:* **HARD NO** if clear disproportionate harm (e.g., stigmatizing low-income parents via framing).

  5.  **Reversibility: Can the effect be easily undone if the person changes their mind? (Applies mostly to defaults/lock-ins)**
      *   *Sufficient Answer:* Opt-out is simple, free, and timely (e.g., pension opt-out form takes <5 mins online).
      *   *Stop/Flow:* **HARD NO** if reversal is costly, complex, or delayed beyond reason.

  6.  **Type B Justification (Triggered ONLY if Type B/Potential): Is there *strong, specific* justification showing:**
      1.  The manipulated preference aligns with the individual’s *likely* long-term interests OR protects others from significant harm?
      2.  Less intrusive (Type A) options are ineffective?
      3.  The emotional/social lever used is proportionate and context-appropriate?
      *   *Sufficient Answer:* Evidence-based argument (e.g., clinical data for anti-smoking, not just "common sense"). Vague appeals to "public good" or "virtue" are insufficient.
      *   *Stop/Flow:* If justification is insufficient → **HARD NO**. If justification is debatable (plausible but contestable) → **ESCALATE TO ETHICS BOARD**. *This is the values call.*

  ---

  ### **Worked Examples**
  **Proposal 1: Opt-out pension enrollment (3% match)**
  1.  **Type A** (Changes environment via default; no direct preference manipulation).
  2.  **Yes** (Opt-out remains simple).
  3.  **Yes** (Default is clear; terms are truthful).
  4.  **Yes** (Net benefit likely; low harm risk).
  5.  **Yes** (Simple opt-out assumed).
  6.  *Not triggered (Type A).*
      **✅ APPROVE**

  **Proposal 2: Cafeteria junk food behind counter (5-min wait)**
  1.  **Type A** (Reorders access; doesn’t alter preferences).
  2.  **Borderline** (5-min wait is a material barrier). *Proceed cautiously.*
  3.  **Yes** (Mechanism is visible).
  4.  **Yes** (Health benefit vs. minor time cost; no targeting of vulnerable groups).
  5.  **N/A** (Not a default/lock-in).
  6.  *Not triggered.*
      **✅ APPROVE (assuming 5-min wait is justified as proportionate to health goal)**

  **Proposal 3: Smoking poster: "Don’t let your family down"**
  1.  **Type B** (Uses guilt/shame to reweight preferences; not just info).
  2.  **Yes** (Smoking remains physically accessible).
  3.  **Yes** (Message is explicit, not deceptive).
  4.  **Borderline** (Risk of disproportionate shame for addicted/low-SES groups). *Proceed to Type B test.*
  5.  **N/A** (Not a default).
  6.  **Type B Justification:**
      *   Aligns with interests? Plausible (health), but guilt-lever is indirect.
      *   Less intrusive options ineffective? Not demonstrated (e.g., no data on why factual campaigns fail).
      *   Lever proportionate? Shame/family stigma is high-intensity; context (public health) *might* justify, but debatable.
      **⛔ ESCALATE TO ETHICS BOARD** *(Justification is value-laden: Is weaponizing family bonds acceptable? Requires ethical weighing.)*

  ---

  ### **Honest Limitations & Judgment Notes**
  1.  **The Type A/B Line:** Blurriness is inherent (e.g., a default *implies* recommendation). The audit must judge the **primary** mechanism. When in doubt, treat as Type B.
  2.  **"Sufficient Justification" (Step 6):** This is unavoidably subjective. The procedure forces explicitness ("Show why Type A fails", "Prove proportionality") but **cannot eliminate debate** on what counts as "strong" evidence or "appropriate" levers. This *is* the escalation trigger.
  3.  **Harm Assessment (Step 4):** Requires predicting behavioral responses. Rely on empirical analogs if available; otherwise, use reasoned estimation of *net* effect. Burden of proof on proposer.
  4.  **Values Call:** The procedure **explicitly outsources** unresolved value conflicts (Step 6) to the Ethics Board. It doesn’t decide if shaming is *ever* okay; it flags when the justification isn’t *objectively* decisive.

  **Why this works for your team:** Focuses on operationalizable red flags (access, transparency, reversibility) and forces tough Type B cases into an explicit ethical debate with a high bar for evidence. The 15-min limit is achievable by focusing on mechanism, barriers, and justification quality – not theoretical debates.
