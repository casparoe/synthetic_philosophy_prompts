answer: |-
  ## The Archivist's Burden

  In the quiet stacks of Veridian University Library's digital archiving unit, senior archivist Dr. Lena Petrov discovers, while verifying a researcher's query, that a systemic metadata corruption she inadvertently introduced during a complex migration script adjustment two years prior has silently misattributed authorship on several hundred 18th-century political pamphlets, linking radical texts to moderates and vice versa. Correcting the error necessitates meticulously reconstructing provenance records, demanding Lena work unpaid through the upcoming Founders' Day holiday weekend. Furthermore, institutional policy requires filing an internal disclosure for any significant historical inaccuracy discovered, which will trigger an audit of her past projects and likely result in her reassignment from the prestigious special collections team to routine cataloging due to the severity of the lapse. Leaving the error untouched, however, means the historical record remains distorted, but the niche nature of the collection makes discovery by researchers improbable for years, if ever.

  **Cost-Proportionality Verdict (Obligatory):** This account holds Lena *must* correct the error. Her personal cost (lost holiday, unpaid work, career setback) is significant, but the *portion of harm prevented properly attributable to her* is the *entirety* of the misattribution and its potential consequences (misleading scholarship, distorted historical understanding). Her direct causal responsibility for creating the error establishes a duty to rectify it flowing from that authorship. This duty to "clean up one's own mess" is non-delegable and not mitigated by the cost to her; the harm originates *from her*, making her liable for its prevention regardless of personal sacrifice. The cost-proportionality is satisfied because the harm *she caused* outweighs the cost *she bears* to fix it. Failing to act breaches this fundamental duty.

  **Role-Boundary Verdict (Supererogatory):** This account finds correcting the error is *beyond the call of duty*. Lena's institutional role as a digital archivist includes duties like maintaining accurate records, performing migrations correctly, and fixing *discovered* errors *within standard work parameters*. Her contract and job description do not mandate: 1) *Retrospective self-incrimination*: Proactively reporting one's own past, undetected errors knowing it will trigger punitive audits. 2) *Unpaid remediation beyond standard hours*: Especially sacrificing a holiday weekend without compensation. 3) *Accepting severe career demotion* as a consequence of fulfilling point 1. Rectifying the error, under these specific costly and self-punishing conditions, exceeds the explicit and implicit duties defined by her professional role within the institution. While desirable, it constitutes a morally praiseworthy *extra* action.

  **The Pivotal Feature & Its Removal:** The divergence hinges entirely on Lena's **prior causal authorship of the error**. If the corruption was instead caused by a predecessor, a software bug beyond her control, or a colleague's mistake, *both accounts would converge on the verdict of supererogation*:
  *   **Cost-Proportionality:** The harm prevented is no longer attributable to Lena. Preventing it would be a net social good, but the cost (unpaid holiday work, potential career complications from initiating a complex fix) now demonstrably *exceeds* the portion of harm properly attributable *to her* (which is zero). Fixing it becomes supererogatory.
  *   **Role-Boundary:** Fixing an error caused by someone else, especially under the same costly conditions (unpaid overtime, triggering an audit that might scrutinize *her* less, potential reassignment), still exceeds standard role duties. The institution, not the individual archivist discovering it, typically bears responsibility for remedying systemic errors not of the discoverer's making under such onerous personal terms.

  **Defending the Counterintuitive (Role-Boundary):** A defender of the Role-Boundary account, facing the counterintuitive result that Lena isn't *obligated* to fix her own major error under these costs, would attack the case setup:
  1.  **Overstated Institutional Negligence:** They'd argue the scenario unrealistically portrays the institution. Real professional roles in archiving *implicitly* include a duty of quality assurance and accountability. Failing to report and correct one's own significant errors, even retrospectively, constitutes professional negligence and a breach of core archival ethics (like integrity and authenticity), which *are* part of the institutional role. The "contract" incorporates professional standards.
  2.  **Implied Duty of Candor:** They'd contend that the duty to report serious errors affecting the historical record, regardless of origin but *especially* one's own, is an inherent, unwritten aspect of the professional archivist's role within a university context dedicated to truth and scholarship. Withholding such knowledge is itself a professional failing.
  3.  **Problematic Incentives:** They'd highlight that accepting the Cost-Proportionality verdict *only* due to authorship creates a perverse incentive: an archivist who *discovers* a major error they *didn't* cause has far less obligation (potentially none) to fix it under significant personal cost than one who caused it. This seems ethically inconsistent and undermines institutional responsibility for the integrity of its holdings.

  **What Could Change My Mind & Vulnerability:** My mind would change on which account handles this correctly if presented with a compelling argument showing that **professional roles in knowledge stewardship inherently and inescapably include retrospective responsibility for the accuracy of one's own work product, regardless of contractual minutiae or immediate personal cost**. If it can be robustly established that being an "archivist" (or similar professional) *means* one is perpetually liable for the accuracy of records one has handled and *must* prioritize correcting one's own errors above personal convenience or career advancement as a core, non-negotiable tenet of the profession itself – effectively making "causal authorship" a defining element *within* the role – then the Role-Boundary account's verdict becomes less plausible, and the Cost-Proportionality view (or a stronger duty-based view) gains significant ground.

  The **most vulnerable point** in my reasoning is the **interpretation of the institutional role boundary**. The argument hinges on the claim that Lena's *contractual and explicit institutional duties* do not encompass self-incrimination and unpaid remediation for past errors. This is vulnerable to the counter-argument (as previewed above) that professional ethical codes (e.g., from the Society of American Archivists) and the *implicit social contract* of working in a university library *do* impose such duties, making them part of the "role" as understood in the broader professional and institutional context, even if not enumerated in a contract. If this counter-argument succeeds, the Role-Boundary account might actually *also* yield an obligatory verdict, collapsing the intended divergence. My framing assumes the role is defined narrowly by explicit contract and immediate task descriptions, which is the point most open to challenge.
