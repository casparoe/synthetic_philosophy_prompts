            Phase2: 15 minutes (do 3 chords? Each chord: 5 minutes? Then we do 3 chords: 5 minutes per chord: 2 minutes for groups to discuss and set prices, 1 minute to draw and announce, 1 minute to settle, 1 minute buffer -> 15 minutes for 3 chords)

            Phase3: 10 minutes.

            Debrief: 15 minutes.

          Total: 55 minutes.

          But 3 chords in phase2 might not be enough for updating? They might not see much. So let's do 5 chords in phase2: but we need 25 minutes? That might be tight.

          We can try to do:

            Phase1: 15 minutes.

            Phase2: 25 minutes (5 chords at 5 minutes each).

            Phase3: 10 minutes.

            Debrief: 15 minutes.

          Total: 65 minutes.

          We have 10 minutes buffer.

          So we go with:

            Phase1: 10 trials per group (10 minutes activity, 5 minutes tally and discussion: 15 minutes)

            Phase2: 5 chords (each chord: 4 minutes -> 20 minutes total)

            Phase3: 10 minutes.

            Debrief: 15 minutes.

          Total: 60 minutes.

   What to do if the two students who know the paradox interfere?

          In phase1, they might tell their group: "We are doing method1, so the probability is 1/3". But then the group might not be surprised? And in phase2, they might know the method? But we are hiding it.

          How to handle: 

            - The teacher can talk to them beforehand: ask them to be observers and help the groups without revealing the paradox? Or assign them to a group that is doing a method they don't know? But they might know all three.

            - Alternatively, we can assign them to be the dealer in phase2? But that might be risky because they might leak.

          Let's assign them to be the teacher's helpers? They can help the teacher run the activity? For example, one can help with the random number app? But then they will know the method in phase2? So they cannot bet.

          We can say: "Since you already know about this, I'd like you to help me run the activity. You can be my assistants." Then they help with the drawing of chords? But then they know the method? So they cannot be in a group. That's acceptable.

   Sample sizes too small: we discussed. We do 10 trials per group. It might be that the results are not clearly separated. Then the teacher can point out: "Look, Group1 got 4 long chords, Group2 got 6, Group3 got 2. Even though they are different, they are not exactly 1/3, 1/2, 1/4. But if we did many more trials, Group1 would approach 1/3, Group2 to 1/2, and Group3 to 1/4." And then we show the theoretical values.

          But note: we don't want to teach the theory until the debrief.

          Alternatively, we can combine the results of all groups? But that would be 30 trials: Group1:4, Group2:6, Group3:2 -> total 12 long chords? And then we say: but each group used a different method? So the overall average is 12/30=0.4, but that's not the point.

          The point is that the method matters.

          The dealer group leaking or faking: we avoid by having the teacher be the dealer in phase2.

          In phase1, if a group fakes? We hope they don't. We trust them.

   Debrief:

          We point out:

            - In phase1: we saw that different methods of generating a "random chord" gave different probabilities for the same event. Why? Because the word "random" is ambiguous without specifying the method.

            - In phase2: when the method was hidden, the groups had to bet without knowing the method. They might have started with the belief that all methods are equally likely? Then after seeing the chords, they update. But note: if they see a long chord, it is more likely to come from method2 (p=1/2) than from method3 (p=1/4). So they update. But without knowing the method, they are uncertain.

            - In phase3: they could ask questions to determine the method? And then they could bet confidently. But note: the method was chosen arbitrarily by the teacher. Why one method and not another? There's no reason. So the probability assignment depends on the arbitrary choice of method.

          The interesting version: what if we don't have a repeatable setup? For example, if we are given a single chord and asked for the probability that it is longer than the side of the triangle? How do we assign a probability? We need to specify a random process. But without that, the question is underdetermined.

          What to say if someone asks: "Why don't we simply answer that there is no answer?"

            - We can say: in many contexts, we do need to assign probabilities even when the process is not specified. For example, in Bayesian statistics, we choose a prior. The paradox shows that the principle of indifference (treating possibilities as equally likely) can lead to contradictions if applied in different ways. So we must be cautious.

            - But also, in some physical contexts, the method might be determined by the physics. For example, if we have a rain of straws on a circle, then the distribution might be determined by the physical setup. So the probability might be fixed by the physics.

            - However, for a purely mathematical circle without any physical process, the question might not have a unique answer.

          We can end by saying: the paradox highlights the importance of specifying the sampling method when we talk about probabilities of geometric events.

   What the activity cannot stage:

          The activity does stage a situation where we can gather frequencies (because we repeat the experiment). But the paradox is also about a single trial. We can address this in the debrief:

            "Notice that in phase2, we did multiple trials and you updated your beliefs. But what if we only had one chord? How would you bet then? Without knowing the method, you might have the same uncertainty. And without a clear reason to prefer one method over another, you might be stuck. The frequencies we gathered in phase1 gave us the probabilities conditional on the method, but the overall probability depends on which method we use. And if we don't know the method, we have to use a prior over methods. But that prior is arbitrary."

          So in the last 10 minutes of the debrief, we focus on:

            - The role of the sampling method in defining probabilities.

            - The underdetermination in the single-case scenario.

            - The principle of indifference and why it fails here: if we apply it to the three methods, we would assign equal probability to each method? Then the overall probability would be (1/3 + 1/2 + 1/4)/3 = (4/12+6/12+3/12)/3 = (13/12)/3 = 13/36 ≈ 0.36. But if we apply indifference in a different way (at a different level) we get different answers. And why prefer one level over another?

          We don't have to go too deep, but we can mention that this is a foundational issue.

   Now, let's write the exact rules and what to say.

   Phase1: (15 minutes)

     Teacher says: 
       "We are going to explore the idea of randomness in geometry. Each group has a circle and a reference string that is the length of the side of an equilateral triangle inscribed in the circle. Your task is to generate random chords of the circle and determine whether they are longer than this reference string.

       There are different ways to generate a random chord. Each group has been assigned a different method. You will do 10 trials. For each trial, follow your method to generate one chord and then compare it to the reference string. If the chord is longer, record a 'yes'; otherwise, record a 'no'. Then tally the number of 'yes's.

       Group1: Your method is:
          1. Use the spinner to pick two random points on the circumference. 
          2. Draw the chord between them.
          3. Compare to the reference string.

       Group2: Your method is:
          1. Spin the spinner to pick a random radius (angle).
          2. Use the random number app to generate a random distance from the center (between 0 and R). Then mark that point on the radius.
          3. Draw the chord perpendicular to the radius at that point.
          4. Compare.

       Group3: Your method is:
          1. Use the random number app to generate a random point inside the circle (by generating x and y in [-R,R] and rejecting until the point is inside).
          2. Draw the chord that has this point as its midpoint (perpendicular to the radius to that point).
          3. Compare.

       You have 10 minutes to do 10 trials. Go!"

     After 10 minutes, the teacher calls stop.

     Then: "Each group, report your number of 'yes's out of 10."

     Write on the board:

          Group1: [X1]
          Group2: [X2]
          Group3: [X3]

     Then: "We see that the groups got different results. Why do you think that is? [Let them discuss briefly.] Notice that each group used a different method. So the way we generate the chord affects the probability. We will explore this further."

   Phase2: (20 minutes)

     Teacher says:
          "Now, we are going to play a betting game. I have chosen one of these three methods at random (by drawing from a hat). I will use that method to generate chords. But I won't tell you which method I am using.

          We will do 5 chords. For each chord, before I generate it, you will have 1 minute as a group to decide:

            - You can choose to buy a bet that the chord will be long. If you do, you name a price P (between 0 and 1) that you are willing to pay. Then:
                 - You pay me P chips.
                 - After the chord is drawn, if it is long, I pay you 1 chip. If not, you get nothing.

            - Or, you can choose to sell a bet. Then you name a price Q (between 0 and 1). Then:
                 - I pay you Q chips.
                 - After the chord is drawn, if it is long, you pay me 1 chip. If not, you pay nothing.

            - Or, you can do nothing.

          Each group starts with 20 chips.

          Remember: the chord is long if it is longer than the reference string.

          Let's begin."

     The teacher then for each chord:

          - Gives 1 minute for groups to decide and write their action (on a slip: either "BUY at P=" or "SELL at Q=") and hand it in.

          - Collects the slips.

          - Then draws the chord using the chosen method (making sure not to reveal the method). For example, if the method is method1, the teacher spins twice and draws the chord. If method2, the teacher spins once for the angle, then uses the app for the distance, etc. The teacher should announce the steps without labeling: "I am spinning to get an angle... now I am marking a point on the radius... now I am drawing the chord perpendicular to the radius at that point." But do not say "this is method2".

          - Then compares and announces: "long" or "not long".

          - Then settles the bets: 
               For each group that bought at price P: they paid P, then if long they get 1, so net: -P + (1 if long, else 0).
               For each group that sold at price Q: they received Q, then if long they paid 1, so net: Q - (1 if long, else 0).

          - The teacher records each group's chip count.

     After 5 chords, move to phase3.

   Phase3: (10 minutes)

     Teacher says:
          "We are using one of the three methods from phase1. Now, you have the opportunity to ask questions to figure out which one. Each group can spend 1 chip to ask one yes/no question about the method. Write your question on a slip and hand it to me. I will answer truthfully and announce both the question and the answer to everyone.

          You have 2 minutes to discuss and write your question."

     After collecting the questions, the teacher reads each question aloud and answers it (truthfully) and writes the answer on the board.

     Then: 
          "Now, based on the information, you can bet on which method it is. Each group writes: 'Bet X chips on method Y'. You can bet any number of chips you currently have (but not more). 

          Then, I will reveal the true method. If you bet on the correct method, you win 3 times your bet (so you get 3X chips). If you bet on the wrong method, you lose your bet."

     Groups write their bets and hand them in.

     Then the teacher reveals the method (and also confirms it by showing the slip drawn at the beginning of phase2).

     Then settle the bets.

   Debrief: (15 minutes)

     We point out:

          - In phase1, we saw that different random procedures gave different probabilities for the same event. This is Bertrand's paradox.

          - In phase2, when the procedure was hidden, you had to bet without knowing the underlying process. Your bets reflected your uncertainty about both the procedure and the chord outcome.

          - In phase3, you could reduce the uncertainty about the procedure by asking questions. But note: the procedure was chosen arbitrarily. There was no reason to choose one over the other.

          - The key lesson: the concept of a "random chord" is ambiguous. It depends on how we generate it.

          - This matters especially in situations where we cannot repeat the experiment many times (like a single chord). Then we must specify the random process to assign a probability.

          - If someone asks: "Why not just say there is no answer?" we can say: in some interpretations of probability, we do require a random process. Without one, the question might not have an objective answer. But in subjective probability, we can assign a prior over the possible methods. However, that prior is subjective.

          - This paradox shows that the principle of indifference (if we have no reason to prefer one possibility over another, we assign equal probability) can be applied in multiple ways (to the chords? to the midpoints? to the endpoints?) and lead to different results. So we must be careful.

     We also address what went well and what didn't? We can ask the students for feedback.

     Finally, we can mention that this is not just a mathematical curiosity: in fields like statistical mechanics, the choice of measure (which is analogous to the choice of random process) can affect predictions.

     And we end by emphasizing the importance of specifying the sampling procedure in probability problems.

   Materials per group in phase1:

     Group1: 
        - Circle (radius R)
        - Spinner (a circle with a rotating pointer fixed at the center) and a way to mark points on the circumference? (pencil)
        - Reference string (length = √3 * R)
        - Tally sheet

     Group2:
        - Circle
        - Spinner
        - Random number app (for uniform between 0 and R) OR a ruler with a uniform scale and a die? But we said phone app is okay.
        - Set square to draw perpendiculars
        - Reference string
        - Tally sheet

     Group3:
        - Circle
        - Random number app (for x and y in [-R,R])
        - Set square
        - Reference string
        - Tally sheet

     For the reference string: the teacher prepares a string of length L = √3 * R for a circle of radius R. The circles for all groups must have the same radius R.

     In phase2 and phase3, the teacher uses the same materials.

     Chips: poker chips or just paper clips? We can use paper with numbers? Or we can keep score on the board.

     We'll keep score on the board for phase2 and phase3.

     We need:

          A board to record the chip counts of each group.

     And for the teacher in phase2: a circle, the same randomizer tools (spinner, app, etc.), and the reference string.

     Also, the bag with the three slips for the method.

     We assume the teacher has a phone with a random number app.

     We also need: slips of paper for the groups to write their bets in phase2 and their questions and bets in phase3.

     And pens.

     And a timer.

     We hope it fits in 75 minutes.

     Note: if in phase1 the results are not clearly different, we can say: "In theory, with many trials, group1 would get about 1/3, group2 1/2, group3 1/4. We did 10 trials, so there's some variation."

     And then we write the theoretical values:

          Group1: 1/3 ≈ 0.333
          Group2: 1/2 = 0.5
          Group3: 1/4 = 0.25

     And compare to what they got.

     We hope for the best.
answer: |-
  ### Bertrand's Paradox Activity Design
  I'll design a complete, runnable session that makes Bertrand's paradox experiential. The activity unfolds in three phases: generating chords with different methods, betting on chords with a hidden method, and betting on the method itself. The goal is for students to encounter the paradox through conflicting results and strategic uncertainty, then confront the underdetermination in probability assignments.

  ---

  ### **Phase 1: Chord Generation and Tallying (25 minutes)**
  **Objective:** Groups use different "random" methods to generate chords and tally how often they exceed the side length of an inscribed equilateral triangle.  
  **Materials per Group:**  
  - **All groups:** Printed circle (radius 10 cm), reference string (length = √3 × radius ≈ 17.3 cm), ruler, pen, tally sheet.  
  - **Group-specific:**  
    - **Group 1 (Endpoints):** Spinner (a paperclip spun on a pencil pinned at circle center), protractor.  
    - **Group 2 (Radius + Point):** Spinner, 10 beads in a bag, ruler marked with mm.  
    - **Group 3 (Midpoint):** Phone with random number app (set to generate (x,y) in [-10,10]), set square.  

  **Setup (5 min):**  
  - Split into 3 groups (5–6 students each). Assign methods:  
    - **Group 1:** "Pick two random points on the circle’s edge. Draw the chord between them."  
    - **Group 2:** "Pick a random radius (spin spinner). Slide a bead randomly along it (draw from bag; each bead corresponds to a pre-marked distance: 0.5 cm, 1.0 cm, ..., 10.0 cm). Draw the chord perpendicular to the radius at that point."  
    - **Group 3:** "Generate a random point inside the circle (use app: random x/y in [-10,10], reject if outside circle). Draw the chord with this point as its midpoint (use set square to make chord ⊥ to radius)."  
  - **Teacher script:**  
    > "Each group has a way to generate a ‘random chord.’ For 10 trials:  
    > 1. Generate a chord using your method.  
    > 2. Compare it to the reference string (the triangle’s side length).  
    > 3. Tally ‘yes’ if longer, ‘no’ if shorter.  
    > Work quickly—you have 10 minutes!"  

  **Activity (10 min):**  
  - Groups perform 10 trials. Teacher circulates to ensure method fidelity.  
  - **Sample sizes:** 10 trials/group (30 total) is sufficient. Expected results:  
    - Group 1: ~3–4 "yes" (theoretical: 1/3).  
    - Group 2: ~5 "yes" (theoretical: 1/2).  
    - Group 3: ~2–3 "yes" (theoretical: 1/4).  

  **Pooling Results (5 min):**  
  - Groups report tallies on the board (e.g., "Group 1: 4 yes, Group 2: 6 yes, Group 3: 2 yes").  
  - **Teacher script:**  
    > "Look at these counts. What do you notice? [Pause] Why might groups disagree if all used ‘random’ chords?"  
    - **Do not:** Explain why or name the paradox.  

  **Why 10 trials works:**  
  - Even with variation, Group 1 (≈3–4) and Group 3 (≈2–3) will differ visibly from Group 2 (≈5–6). Differences spark curiosity without needing exact convergence.  

  ---

  ### **Phase 2: Hidden Randomizer Betting (25 minutes)**  
  **Objective:** Groups bet on chords generated by a hidden method, experiencing uncertainty as a financial risk.  
  **Setup (5 min):**  
  - Assign one group as the "dealer" (rotate groups if repeating). Teacher privately gives them a method (e.g., Group 2’s method) and a secrecy reminder.  
  - **Chips:** Each group starts with 20 chips (use paper scraps).  
  - **Betting rules:**  
    - Before each chord, all groups (except dealer) can:  
      - **Buy a bet:** Pay `P` chips upfront. If chord > reference, win 20 chips.  
      - **Sell a bet:** Receive `Q` chips upfront. If chord > reference, pay 20 chips.  
      - Groups set `P` or `Q` (any number 0–20) based on their confidence.  
    - Dealer generates chords secretly (using assigned method) and announces "long" or "short."  
  - **Teacher script:**  
    > "The dealer will generate chords using one method. You don’t know which. Before each chord, decide:  
    > - Buy: Pay `P` chips. If long, win 20.  
    > - Sell: Get `Q` chips. If long, pay 20.  
    > Set `P` or `Q` to reflect your confidence. Goal: Maximize chips."  

  **Activity (15 min):**  
  - Run 5 chords (3 min each):  
    1. Groups have 1 min to choose buy/sell and set `P`/`Q` (write on paper).  
    2. Dealer generates chord in view (e.g., spins spinner) but **hides method-specific steps** (e.g., hides bead draw for Group 2’s method).  
    3. Dealer announces "long" or "short"; bets are settled.  
    4. Teacher tracks chip counts on board.  
  - **Example:**  
    - If a group estimates 50% probability of "long," they might set `P` = 9 (buy if they think it’s cheap) or `Q` = 11 (sell if they think it’s overpriced).  
    - After 5 chords, chip counts diverge based on guesses about the method.  

  **Key design:**  
  - **No arithmetic advantage:** Pricing (`P`/`Q`) rewards probabilistic intuition, not calculation speed.  
  - **Dealer secrecy:** Assign a trustworthy student. If leakage occurs, quietly reassign or take over as dealer.  

  ---

  ### **Phase 3: Betting on the Method (15 minutes)**  
  **Objective:** Groups bet on which method was used, revealing that underdetermination shifts to the procedure level.  
  **Setup (2 min):**  
  - **Teacher script:**  
    > "Now, bet on which method the dealer used: Endpoints (1), Radius (2), or Midpoint (3). You can spend chips to ask me one yes/no question about the method."  

  **Activity (10 min):**  
  1. **Questions (3 min):**  
     - Groups spend 5 chips to ask one yes/no question (e.g., "Does it use the spinner?"). Teacher answers publicly.  
     - Limit: 1 question/group to force strategic choices.  
  2. **Betting (2 min):**  
     - Groups bet chips on method 1, 2, or 3. Write: "Bet [X] chips on Method [Y]."  
  3. **Reveal & settlement (5 min):**  
     - Dealer reveals method. Winners triple their bet (e.g., bet 10 chips → win 30). Others lose bet.  
     - **Teacher script:**  
       > "Did questions resolve the uncertainty? Or did they just move it?"  

  **Debrief (10 minutes)**  
  **Goals:**  
  1. **Surface the paradox:** "In Phase 1, different ‘random’ methods gave different probabilities. Why?"  
  2. **Highlight underdetermination:**  
     - "In Phase 2, without knowing the method, betting was risky. More data reduced risk, but only if you could guess the method."  
     - "In Phase 3, you bet on methods. But why should one method be ‘more likely’? The dealer chose arbitrarily."  
  3. **Address the core problem:**  
     - **Key moment:** Point to Phase 3 betting. "You asked questions to reduce uncertainty, but the method choice itself had no probability—it was arbitrary. If we can’t repeat the method choice (e.g., a single chord in nature), there’s no frequency to rely on."  
     - **Why not ‘no answer’?**  
       - "In real decisions (e.g., policy, games), we often *must* assign probabilities. This paradox warns us that ‘random’ isn’t objective without a specified process. It’s why physicists specify ‘uniform in energy or position?’ and why probability depends on context."  

  **Predictable Issues & Fixes:**  
  - **Students who know the paradox:** Assign them as quiet "method experts" to help groups without revealing outcomes.  
  - **Small sample sizes:** Use the expected spread (1/3 vs. 1/2 vs. 1/4) in debrief if results are muddy.  
  - **Dealer leaks/fakes:** Teacher takes over if needed. Pre-brief dealers: "Your role is crucial—stay silent!"  
  - **Activity limitation:** Phase 2 uses frequencies, but the paradox applies to single cases. **Debrief focus:** "What if we had only *one* chord? How would you assign probability then? Without a physical process (e.g., rain on a circle), there’s no unique answer—just choices."  

  **Timing Summary:**  
  - Phase 1: 25 min (5 setup + 10 activity + 10 tally/discussion)  
  - Phase 2: 25 min (5 setup + 15 activity)  
  - Phase 3: 15 min (2 setup + 10 activity + 3 reveal)  
  - Debrief: 10 min  
  **Total:** 75 minutes  

  ---

  ### **Why This Works**  
  - **Experiential paradox:** Students *see* conflicting results before hearing theory.  
  - **Risk internalizes uncertainty:** Betting makes underdetermination visceral (losing chips feels different than abstract disagreement).  
  - **Procedural focus:** Phase 3 shows that asking "which method?" doesn’t solve the problem—it underscores the arbitrariness.  
  - **Handles limitations:** Small samples still show trends; dealer issues have backups; the debrief explicitly separates repeatable setups (frequencies) from irreproducible cases (subjective probability).  

  **Final Tip:** If asked, "Why not say there’s no answer?" respond: "In practice, we *do* need answers (e.g., for insurance or experiments). This teaches us to clarify *how* randomness is defined—or admit our choice is subjective."
