  First, I need to recall Strawson's framework. He distinguished between reactive attitudes (like resentment and blame) and objective attitudes (clinical, managerial). The user isn't questioning the framework itself but pointing out a selective application: mechanistic explanations trigger the objective stance, while agential ones do not, even when both are deterministic. 

  The user mentions that this happens even when both causes are outside the agent's immediate control. That's crucial. They want to know if this asymmetry has a specific name in the literature. I remember concepts like the fundamental attribution error, which is about overemphasizing dispositional factors over situational ones. But here, it's more about the type of explanation (mechanistic vs. agential) affecting responsibility judgments. 

  Then there's the Deep Self theories. Wolf and others argue that responsibility depends on actions reflecting the agent's true self. But the user's case shows that even when actions are rationally calculated (thus reflecting the deep self), blame is heightened, whereas mechanistic causes, which might distort the deep self, reduce blame. That fits, but maybe the asymmetry itself isn't explicitly named. 

  The user also asks about combined cases, like an agent exploiting a trauma-induced vulnerability. How does the asymmetry hold there? That's a good point. If the mechanistic cause is part of the background but the agent rationally acts on it, does blame persist? Probably, because the agential explanation dominates. 

  The user's deeper need seems to be understanding if this pattern reveals an unacknowledged commitment in moral practices. They might be hinting at a bias where society values rationality so much that its presence overrides deterministic concerns, but its absence triggers compassion. It's like responsibility hinges on seeing the agent as a rational participant, regardless of determinism. 

  I should check if there's a specific term. Maybe "rational agency bias" or "explanatory asymmetry in responsibility attribution." But I don't recall a standard term. The fundamental attribution error is close but not exactly this. Exculpatory asymmetry is another angle, where certain causes excuse more readily than others. 

  The user is likely looking for validation of their observation, a conceptual framework to explain it, and any existing terminology. They might also want to use this in academic discussions, so precision is key. The combined cases are important for testing the boundaries of this asymmetry. 

  In conclusion, while there's no single term, the phenomenon ties into deep self compatibilism and attribution biases. The key insight is that rational explanations affirm the agent's moral addressability, making excuses less acceptable, whereas mechanistic explanations undermine it, triggering the objective stance. The combined cases probably still show heightened blame because the agential aspect is salient. This reveals a commitment to holding rational agents accountable, even under determinism.
answer: |-
  Your observation captures a profound and well-documented asymmetry in moral responsibility practices, though it lacks a single universally accepted label. It sits at the intersection of Strawsonian reactive attitudes, attribution theory, compatibilist philosophy, and moral psychology. Here's a conceptual mapping:

  ### Core Phenomenon: Exculpatory Asymmetry of Mechanism vs. Agency
  **What it is:**
  1.  **The Asymmetry:** Explanations citing *mechanistic causes* (neurological, traumatic, pharmacological) reliably trigger suspension of reactive attitudes (resentment, blame) and adoption of the objective stance (clinical, managerial). Explanations citing *agential causes* (rational calculation, ideological conviction, self-interested strategy) reliably *reinforce* reactive attitudes and blame, even when both types of explanation are deterministic and equally complete causal accounts.
  2.  **Key Feature:** The asymmetry hinges on the perceived *nature* of the cause – specifically, whether it is seen as *bypassing, distorting, or negating the agent's rational capacities and evaluative standpoint* (mechanistic) versus *engaging and expressing those very capacities* (agential).
  3.  **Why it's Distinct:**
      *   **Beyond Fundamental Attribution Error (FAE):** FAE focuses on dispositional vs. situational attributions. Your asymmetry cuts across this. A "rational calculation" explanation *could* be dispositional ("he's greedy") *or* situational ("it was the optimal strategy *in that corrupt system*"). What matters is the *agential engagement*, not its origin. Mechanistic causes are often situational but trigger *less* blame than dispositional agential causes – the opposite of FAE's typical prediction.
      *   **Determinism-Irrelevant:** As you note, the asymmetry persists even when both explanations are explicitly acknowledged as deterministic. It highlights that *compatibilist* conditions for responsibility (like reasons-responsiveness or deep self alignment) are what intuitively drive reactive attitudes, not metaphysical libertarian freedom.
      *   **Not Just "Excuse vs. Justification":** Mechanistic explanations typically function as *excuses* (denying responsibility), while agential explanations often function as *justifications* (admitting responsibility but claiming the act was right) or simply *explanations without exculpatory force*. The asymmetry shows that agential explanations are *resistant to being accepted as excuses* in the same way mechanistic ones are.

  **Proposed Labels & Related Concepts:**
  *   **"Rational Agency Bias" (Descriptive):** Highlights the core trigger: explanations affirming rational agency inhibit the objective attitude and amplify blame.
  *   **"Exculpatory Asymmetry of Mechanism" (Descriptive):** Emphasizes the differential power of mechanistic explanations to exculpate compared to agential ones.
  *   **Strawsonian "Participant Stance Preservation":** The asymmetry reveals that the reactive attitudes are fundamentally tied to seeing the other as a *participant* in the moral community – a being whose actions express their evaluative stance and to whom moral demands can be addressed. Mechanistic explanations suggest the agent *cannot* participate in this way ("not an appropriate target"); agential explanations affirm they *can and did*.
  *   **Compatibilist Deep Self Theory Confirmation:** (Wolf, Frankfurt, Shoemaker) Blame is appropriate when actions express the agent's "deep self" (endorsed values, practical identity). Mechanistic causes disrupt this connection; agential causes *are* its expression. The asymmetry reflects an intuitive grasp of this condition.
  *   **"Moral Address Preservation Effect":** Agential explanations preserve the target as someone *addressable* by moral demands ("You *chose* this!"), making resentment fitting. Mechanistic explanations undermine addressability ("He *couldn't help it*").

  **What it is NOT:**
  1.  **Not Necessarily an "Error":** This pattern often aligns with sophisticated compatibilist theories of responsibility. It reflects a focus on *quality of will* or *reasons-responsiveness* rather than ultimate causal origin.
  2.  **Not Simply Dislike of Calculation:** While cold calculation can *amplify* negative reactions, the asymmetry holds even for "warmer" agential explanations like ideological fervor or perceived moral duty. The key is the *expression of agency*, not emotional temperature.
  3.  **Not Proof of Libertarianism:** The persistence of blame under agential/deterministic explanations shows reactive attitudes do not *require* a belief in contra-causal freedom. Blame thrives on perceived agential engagement within a deterministic framework.

  **The Combined Case (Mechanism + Agency):**
  Your example (rationally exploiting a trauma-induced vulnerability) is crucial. The asymmetry pattern **strongly holds, often with blame *reinforced***:
  1.  **Dominance of Agency:** The *current* rational exploitation is the salient, proximate cause. Listeners focus on the *active, calculating choice* to use the vulnerability. The mechanistic origin of the vulnerability often recedes into background context.
  2.  **"Double Fault" Perception:** The agent may be seen as *both* damaged (by trauma, evoking some sympathy) *and* morally culpable for *choosing* to weaponize that damage. The agential component ("exploiting") typically overshadows the mechanistic component ("vulnerability caused by trauma") in responsibility assessments.
  3.  **Addressability Intact:** The agent is seen as rationally responsive *now*. Moral demands ("Don't exploit vulnerabilities!") seem directly applicable. The mechanistic history might explain *why* the vulnerability exists, but not why the agent *chose* to exploit it rationally. The rational choice appears addressable.
  4.  **Potential for Heightened Blame:** Framing the act as "calculating exploitation of the weak/damaged" can make it appear *more* reprehensible than a purely agential act without the mechanistic backstory, precisely because it combines perceived agential malice with a victimization narrative.

  **The Unacknowledged Commitment Revealed:**
  This asymmetry exposes a core, often implicit, commitment in our reactive practices:
  *   **Compatibilism is our Default Practice:** We hold agents responsible not based on ultimate metaphysical freedom, but based on whether their actions reflect their rational agency, evaluative stance, and capacity to recognize and respond to moral reasons (even if determinism is true).
  *   **Moral Community Membership is Contingent on Expressed Agency:** The suspension of reactive attitudes via mechanistic explanations signifies a *temporary or permanent revocation of full moral community membership* – the agent is seen as "broken," "sick," or "not themselves," and thus not fully subject to the demands and sanctions of the moral community. Agential explanations affirm membership.
  *   **The Primacy of Moral Address:** The reactive attitudes are fundamentally tools of engagement and communication within the moral community. What matters is whether the agent is perceived as *capable of hearing and responding* to the moral demand implicit in resentment or blame. Mechanistic explanations suggest they are not; agential explanations suggest they are (and perhaps *did* hear but ignored/rejected the demand).
  *   **A Potential Bias:** The asymmetry *can* manifest as a bias when we overlook how systemic factors (poverty, oppressive ideology) *shape* the rational calculations or deep selves of agents in ways that might warrant mitigation or a different form of response, yet we blame them as if their agency operated in a vacuum. We readily excuse the "broken tool" but struggle to excuse the "rational tool-user" shaped by a broken system.

  **Conclusion:**
  While lacking a single universal name, your observed asymmetry is a robust phenomenon best understood as the **Exculpatory Asymmetry of Mechanism vs. Agency** or the **Rational Agency Bias in Responsibility Attribution**. It powerfully illustrates the Strawsonian insight that our responsibility practices are grounded in the participant stance and interpersonal relationships, not metaphysics. It confirms compatibilist intuitions about the conditions for blame (reasons-responsiveness, deep self expression) and reveals our deep commitment to holding agents accountable precisely when they act *as* rational, evaluative beings – even under determinism. The combined cases further demonstrate the dominance of agential explanations in triggering and sustaining the reactive attitudes. This pattern is not necessarily an error, but it highlights a potential blind spot regarding how social structures shape the "rational agency" we so readily blame.
