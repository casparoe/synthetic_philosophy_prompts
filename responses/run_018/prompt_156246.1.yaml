  Hey, I want to compare two takes on Gödel's rotating universe thing. On one side there's Gödel himself—he said the closed timelike curves mean there's no objective flow of time, since you could loop back and meet your past self, so the past/present/future split is subjective or illusory. On the other side there's this more modern-ish view (maybe from philosophers of physics playing with the metric) that even in a Gödel spacetime every worldline has its own local arrow—time orientability doesn't vanish, it just fails globally. So the question is: are these two views actually talking past each other? Does Gödel need global simultaneity for his argument to bite, or does the local-arrow view miss the point that "aging in order" still lets you become your own grandfather? I want to know where the real disagreement is—math vs metaphyics, maybe—and which one collapses if you drop the idea that time has to be universal. Write it in American English, and don't worry about citing papers, just work through the logic.
