answer: |-
  Here's a breakdown of the contract analogy, its disanalogies, and a verdict—grounded in the cases you're wrestling with—along with clear flags on contested claims.

  ### The Contract Analogy: Mapping the Elements
  | Contract Element          | Consent Analogy                                     | Typical Role in Consent Discourse                  |
  | :------------------------ | :-------------------------------------------------- | :------------------------------------------------- |
  | **Offer**                 | Initiation of sexual activity (verbal/nonverbal)   | Implied in "who made the first move"; rarely explicit |
  | **Acceptance**            | "Yes" (verbal or enthusiastic participation)       | Core of affirmative consent policies               |
  | **Consideration**         | Mutual pleasure/benefit; exchange of "rights"      | Rarely stated; assumed reciprocal desire           |
  | **Capacity**              | Competence: age, sobriety, cognitive ability       | Threshold for valid consent (e.g., intoxication)   |
  | **Fraud/Misrepresentation**| Deception about identity, STI status, contraception | Invalidates if "material" (e.g., STI yes, job no)  |
  | **Duress/Coercion**       | Threats (physical, reputational), pressure          | Invalidates consent (e.g., "gun to head")          |
  | **Breach**                | Non-consensual act (exceeding scope of consent)     | Basis for assault claims                           |
  | **Remedy**                | Criminal/civil penalties; trauma recovery           | Legal consequences; restorative justice            |
  | **Third-Party Enforcement**| State/campus adjudication                           | Police, Title IX offices, courts                   |

  ### Where the Mapping Breaks (and Why It Matters)
  **1. Deception & Materiality: The Arm's-Length Transaction Problem**  
  - **Contract Frame:** Only "material" fraud voids consent (e.g., lying about STI = fraud in the "nature of the act"; lying about marital status = immaterial "inducement").  
  - **Disanalogy:** Sex isn't a discrete commodity exchange. *Materiality* in contracts protects economic interests; in sex, it should protect bodily autonomy and relational integrity. Lying about a vasectomy or monogamy *fundamentally alters the context of bodily risk and relational trust*, even if the physical act is "the same."  
  - **Your Cases:**  
    - STI lie → **Invalidates** (bodily integrity violated).  
    - Vasectomy lie → **Invalidates** (reproductive autonomy violated).  
    - "Single" lie → **Context-dependent** (if monogamy was a condition of intimacy, yes; if a one-night stand, maybe not).  
  - **Contested Claim:** *This rejects the contract law's narrow "nature of the act" test. Bodily/relational context matters more than transactional fairness.*  

  **2. Coercion Without Threats: The Cheap-Exit Condition**  
  - **Contract Frame:** Duress requires overt threats ("gun to head"). Social pressure ("ruining the evening") rarely qualifies.  
  - **Disanalogy:** Contracts assume parties can walk away freely. Sex often occurs in *asymmetric power dynamics* (e.g., employer/employee, landlord/tenant) where "no" carries invisible costs (lost housing, career harm, social isolation).  
  - **Cheap-Exit Critique:**  
    - **Strong Version:** If exiting sex risks losing a ride home, housing, or social capital, consent is invalid. *This *does* turn most "yeses" into maybes*—intentionally. It exposes how structural inequality (gender, class) constrains autonomy.  
    - **Weak Version:** Only applies where power imbalance is *extreme* (e.g., custodial relationships).  
  - **Your Case:** A "yes" to avoid detonating a relationship/housing → **Likely invalid under cheap-exit**, if the cost of refusal was prohibitive.  
  - **Contested Claim:** *Cheap-exit is necessary to capture gendered/structural coercion. But it *is* empirically messy—what counts as "prohibitive cost"?*  

  **3. Capacity: The Binary Trap**  
  - **Contract Frame:** Binary competence threshold (e.g., "sober enough," "18+").  
  - **Disanalogy:** Capacity in sex is *situational and relational*. A 17-year-old may seek an older partner but lack emotional leverage; someone with an intellectual disability may consent to some acts/partners but not others; blackout drunkenness voids capacity *even if behavior seemed "enthusiastic."*  
  - **Your Cases:**  
    - Blackout drunk → **Invalid** (no capacity, regardless of initiation).  
    - 17-year-old with older partner → **Likely invalid** (power imbalance exploits developmental asymmetry).  
    - Mild intellectual disability → **Contextual** (depends on understanding of risks/rights *for this specific act/partner*).  
  - **Contested Claim:** *Capacity assessments must be contextual, not threshold-based. This conflicts with legal simplicity but aligns with disability justice.*  

  ### Verdict: Demote the Contract Analogy (with Extreme Prejudice)
  **Keep it only as a heuristic for fraud/duress** in *clear-cut* cases (e.g., forged identity, explicit threats). **Drop it for capacity and non-threat coercion.** Its transactional logic smuggles in harmful assumptions:  
  - That sex is an exchange of entitlements (not mutual vulnerability).  
  - That autonomy is binary (not relational and graded).  
  - That "materiality" is objective (not context-dependent).  

  ### A Better Frame: **Consent as Dynamic Co-Authorship**
  Think of sex as **improv with veto rights**—but with critical caveats:  
  - **Strengths:**  
    - Focuses on *ongoing mutual responsiveness* (either party can pause/stop).  
    - Centers *communication* over assumption (like jazz musicians syncing rhythm).  
    - Avoids contract's transactional language.  
  - **Weaknesses:**  
    - Still assumes sex is *inherently cooperative*. What about casual or kink dynamics?  
    - Doesn't solve power imbalances (improv works only if partners are *equal*).  
  - **Why it's better:** It frames consent as a *process* (not a one-time "deal"), which handles:  
    - **Deception:** Breaking trust mid-"scene" invalidates the collaboration.  
    - **Coercion:** You can't co-author under duress; the "scene" is corrupted.  
    - **Capacity:** Co-creation requires real-time capacity to read/react.  

  ### Your Answers (and What You’ll Need to Defend)
  | **Issue**                  | **My Verdict**                                      | **Contested Claim**                                |
  | :------------------------- | :-------------------------------------------------- | :------------------------------------------------- |
  | **Deception**              | Invalidates if it violates bodily/relational integrity (STI/vasectomy: always; "single": usually). | *Materiality must include relational context, not just physical act.* |
  | **Non-threat "Coercion"**  | Invalidates if cheap-exit was unavailable (e.g., losing housing > ruining evening). | *Structural power imbalances (e.g., gender, economics) can coerce absent threats.* |
  | **Capacity**               | Contextual assessment (blackout: always invalid; disability/minor: depends on understanding/leverage). | *Capacity is relational and situational—reject binary thresholds.* |

  **Final Note:** The contract analogy is seductive because it offers false clarity. But consent is a **moral technology for navigating vulnerability**, not a liability waiver. Demote the contract, embrace dynamism—and prepare to defend the claim that *sex requires more ethical nuance than a car lease*. Your column should stress that better metaphors exist, but they demand we confront uncomfortable truths about power, autonomy, and the messiness of human intimacy.
