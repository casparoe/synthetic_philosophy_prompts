answer: |-
  ### The core problem  
  The reference class problem means you can't pick a non-arbitrary group to compare something to for probability estimates. Every choice of reference class biases your outcome, and there’s no "correct" default. Probability isn’t objective—it’s hostage to your framing.  

  ### AI timelines  
  If an AI researcher forecasts AGI using past tech (e.g., "like aircraft development"), but a critic uses "unprecedented systems," both are arbitrary. The researcher might see rapid takeoff; the critic sees unpredictable black swans. Neither is "wrong," but the debate is just dueling intuitions masked as data. This makes consensus impossible—your timeline depends on which analogy feels right, not evidence.  

  ### Doomsday / self-selection  
  The Doomsday Argument falls apart if humans who *ask* "are we early?" are more likely to exist *because* doomsday is near (e.g., only doomed civilizations have time to ponder extinction). If you self-select into the "observers who worry about doom" group, your reference class is skewed. You’re not a random human—you’re a human in a rare position to *ask*, which might correlate with doom. Yikes.  

  ### EA base-rate problem  
  EA often cites global base rates ("X intervention worked in 70% of cases") but those rates assume a "natural" reference class that doesn’t exist. E.g., "deworming worked in Kenya" vs. "in tropical economies" vs. "in low-governance zones"—each changes the success rate arbitrarily. Cost-effectiveness estimates become storytelling: you pick the class that justifies your priors, not truth.  

  ### Bottom line  
  This nukes "objective" probabilities in high-stakes domains. For AI, embrace deep uncertainty—nobody has a magic reference class. For doomsday/EA, admit that base rates are political tools, not math. Stop pretending rationality means avoiding bias; it means *flagging* where your biases live. Probability is always personal.
