     - Step 2: We must look at behavior and context. She lives in a quiet routine. Is there any sign of restlessness? Does she avoid situations that might stir desire? If the routine is presented as a simple, contented life without any hint of avoidance, then proceed. But if the routine is rigid and seems to be a shield against pain, that might be resignation or numbness. 
