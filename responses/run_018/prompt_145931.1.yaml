  hey so me and my roomate have been arguing about whether chatgpt and other big models actually understand anything, or if they're just that stochastic parrot thing everyone talks about. my credence that LLMs have real conceptual understanding is around 0.35, hers is closer to 0.15. can you give me your own number, but more importantly break the reasoning down?

