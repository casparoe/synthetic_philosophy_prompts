answer: |-
  Your observations reveal a profound institutionalized epistemology governing evolutionary-cognitive research funding. This "Goldilocks Zone" of explanation—neither too top-down nor too reductively bottom-up—rests on specific philosophical foundations:

  ### Core Philosophical Commitments
  1. **Gradualist Evolutionary Ontology**:  
     Presupposes **Neo-Darwinian gradualism** as non-negotiable. Novelty *must* emerge via incremental functional precursors (e.g., exaptation of sequence processing for syntax). Sudden jumps violate the commitment to **continuity of natural selection** as the sole creative force.

  2. **Mechanistic Hierarchical Reality**:  
     Enforces **ontological levels** (molecular → neural → cognitive → behavioral) as causally substantive. Rejecting both "skyhooks" (Dennett’s term for unexplained top-down causation) and "greedy reductionism" (Churchland’s critique of level-skipping) implies:  
     - Each level has **emergent causal powers** irreducible to lower levels  
     - Valid explanations require **interlevel mechanistic scaffolding** (Craver’s mutual manipulability criterion)

  3. **Constraint-Based Conception of Novelty**:  
     Cognitive traits are seen as **reorganizations of existing mechanisms** under selection pressures—never *de novo* creations. This rejects **strong emergence** while accepting **weak emergence** (system properties arising from component interactions).

  ### Explanatory Frameworks at Play
  | **Approach** | **Status** | **Philosophical Rejection Basis** |
  |--------------|------------|----------------------------------|
  | Top-down/Functional emergence | Rejected ("skyhooks") | Violates causal completeness of physics & biological continuity |
  | Pure molecular reductionism | Rejected ("greedy reductionism") | Fails epistemic norms of multi-level mechanistic explanation |
  | Stepwise adaptive pathways | Required | Aligns with mechanistic & evolutionary continuity norms |

  ### Pluralism vs. Architectural Ontology
  A functional-level pluralist (e.g., Fodorian autonomist) would face **systematic incompatibility** with this framework because:
  - The rejection of top-down causation denies **explanatory autonomy** to functional descriptions
  - Requiring *always-decomposable* mechanisms enforces **explanatory reductionism** as an ideal
  - The practice implicitly endorses **ontological reductionism** (higher levels are constituted by lower mechanisms)

  This constitutes a **robustly mechanistic paradigm** (Glennan, Bechtel) that quietly marginalizes:
  - Strong emergence (Searle, Silberstein)
  - Non-mechanistic explanatory forms (e.g., dynamical systems approaches)
  - Teleosemantic accounts (Millikan) that don't specify mechanistic pathways

  ### Consequences of Changing Criteria
  If panels accepted **either** extreme:
  - **Pure Molecular Paths**: Would shift ontology toward **physicalist fundamentalism**, treating cognitive traits as epiphenomenal. Field would prioritize gene-cognition mapping over computational/functional analyses.
  - **Irreducible Functional Emergence**: Would license **downward causation** models, potentially revitalizing Piagetian structuralism or Gibsonian affordance theory. However, it risks reintroducing explanatory gaps akin to vitalism.

  ### Necessary Field Transformations
  To abandon the middle path would require overthrowing:
  1. **The Neo-Darwinian Constraint**: Accepting saltationist models of cognitive evolution (cf. Gould's punctuated equilibrium applied to cognition)
  2. **Causal Exclusion Principle**: Allowing higher-level properties causal powers not reducible to part-interactions
  3. **Mechanistic Normativity**: Recognizing explanations satisfying predictive adequacy without specifying implementation (e.g., Marr's computational level as sufficient)

  ### Conclusion
  This institutional practice enforces a **constrained mechanistic materialism** that:
  - Privileges decompositional strategies
  - Assumes evolutionary continuity is explanatory necessary
  - Treats hierarchical organization as ontological bedrock

  It functions as an **invisible epistemology** that shapes what counts as legitimate science in this domain. While compatible with *weak* pluralism about descriptive languages, it actively suppresses ontological pluralism by requiring all accounts to be "anchored" in mechanistic evolutionary pathways. Your case exemplifies how funding gatekeeping sustains specific metaphysics under the guise of methodological rigor.

