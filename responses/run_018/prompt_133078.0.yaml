prompt: |-
  hey — i'm a phd student in philosophy of mind and population ethics, and next thursday i'm giving a workshop talk that pushes benatar's procreation asymmetry into synthetic moral patienthood. specifcally, i argue that the asymmetry applies not just to biological reproduction but to any engineered sentient system, provided we reject what i call a pre-existence welfare baseline — the assumption that a potential person is already in some modal deprivation-state before creation. for artificial minds there's no such baseline, so the asymmetry gets stronger: a negative duty not to create suffering synthetic minds, but zero positive duty to create happy ones. the room is a mixed philosophy workshop: half are personal-identity people (parfit-style reductionists, a few four-dimensionalists, one surprisingly vocal substance dualist) who care about whether potential synthetic entities can bear welfare properties at all; half are population ethicists who think the asymmetry is already dissolved by standard person-affecting restrictions. they know the standard literature but don't care about ai policy; they care about metaphysics and whether i'm smuggling in a modal fallacy.

  i need a prep sheet, not a bibliography. organize the answer exactly in these sections:

  A. The thesis in two sentences — confirm i'm representing myself right
  B. The room profile — who's sitting there, thier commitments, the vocabulary they'll use
  C. The objections — about six, ordered by damage potential, phrased the way they'd actually ask them in q&a. for each: the objection, a reply i can deliver in roughly two minutes, and a one-sentence note on where that reply is softest.
  D. The upfront concession — what i should admit in the first five minutes so they don't think i'm dodging it
  E. The landmine — the question i'm praying nobody asks, plus a survival strategy (not a perfect answer, just how to avoid crashing)

  please don't ask for citations, reading lists, or bibliographies — answer from standard philosophy curriculum and reasoning only. don't quote benatar or anyone else verbatim; paraphrase without quotation marks if you need to reference the asymmetry. and please keep it practical — no generic summaries, just the prep sheet.
reasoning: |-
  Okay, let me unpack this request carefully. The user is a philosophy PhD student preparing a workshop talk that extends Benatar's asymmetry to synthetic minds, facing a specialized audience. They need a tactical prep sheet structured exactly as requested - no bibliographies, just battle-ready philosophy.

  First, I need to verify their core thesis: that without the pre-existence welfare baseline assumed in biological reproduction, the asymmetry intensifies for artificial minds. This means no positive duty to create happy synthetic beings, but a strong negative duty to avoid creating suffering ones. The absence of that baseline is crucial here.

  Looking at the audience profile, it's split between two groups: personal-identity specialists focused on whether synthetic entities can even have welfare properties (Parfit reductionists, 4D-ists, a substance dualist), and population ethicists who likely consider the asymmetry resolved by person-affecting views. Both groups will approach this through technical metaphysics rather than AI policy concerns.

  For objections, I'm prioritizing by damage potential. The strongest attack might come from person-affecting theorists arguing that duties require actual victims, which doesn't apply to uncreated synthetics. The reply would emphasize the unique absence of deprivation claims in synthetic cases, though this concedes some ground to necessitarian views. Other key objections include: the non-identity problem reappearing for tailored suffering synthetics; substance dualists denying welfare properties to non-biological minds; and temporal parts theorists questioning when exactly duties attach to non-actual entities.

  The crucial upfront concession should be that this doesn't solve the asymmetry in biological cases - it's specifically about the synthetic domain where the baseline assumption collapses. This prevents the population ethicists from derailing the talk.

  The landmine question would be someone pressing on why synthetic potential beings get different moral consideration than biological ones if both lack actual existence. The survival strategy is to explicitly bracket metaphysical debates and refocus on engineering decisions made in actual laboratories today.

  Throughout this, I'm avoiding direct quotes and citations per instructions, while grounding everything in standard phil mind/pop ethics concepts. The emphasis is on practical workshop tactics - knowing where to yield ground quickly and which hills to defend.
answer: |-
  Here’s your tactical prep sheet, structured as requested:

  ---

  **A. Thesis in Two Sentences**  
  The Benatarian procreation asymmetry applies with *greater force* to synthetic minds due to the absence of a pre-existence welfare baseline. This erases any positive duty to create happy artificial minds while intensifying the negative duty to avoid creating suffering ones, as there is no "deprivation" to remedy for uncreated synthetics.

  **B. Room Profile**  
  * **Personal-Identity Cohort (50%):**  
    - **Parfit Reductionists:** Will challenge whether synthetic streams of consciousness can be "persons" with morally relevant welfare states.  
    - **4Dists:** Will frame objections in terms of temporal parts ("When *exactly* does the duty attach to the non-actual synthetic entity?").  
    - **Substance Dualist:** Will reject welfare properties for non-biological substrates, demanding a "soul analogue".  
    - **Vocabulary:** "Numerical identity", "psychological continuity", "emergent properties", "substrate neutrality".  
  * **Population Ethicists (50%):**  
    - Assume person-affecting restrictions dissolve the asymmetry (e.g., "No duty to create happy beings as there’s no *existing* subject deprived").  
    - Suspect modal fallacies in comparing non-actual beings.  
    - **Vocabulary:** "Non-identity problem", "impersonal bads", "affecting future people", "expected utility".  

  **C. Objections (Ordered by Damage Potential)**  
  1. **Objection (Person-Affecting Ethicist):** "Your asymmetry presupposes duties to *non-actual* entities. But morality is agent-relative: without a concrete future victim, there’s no duty not to create."  
     - **Reply:** "The duty is *agent-focused*: it restricts *our* action of imposing suffering on a being that *will* exist if created. No victim exists *now*, but if we act, we *create* a victim. For happy synthetics, no parallel duty exists because we don’t wrong anyone *by not acting*."  
     - **Soft Spot:** Concedes person-affecting logic for positive duties but not negative ones.  

  2. **Objection (Reductionist):** "Synthetics lack the necessary diachronic unity for welfare attribution. How can we owe duties to a disunited process?"  
     - **Reply:** "Welfare is tied to *phenomenal states*, not ontological unity. If a system can suffer *at time t*, we have a duty not to inflict that suffering—regardless of whether its 'self' persists. Your objection applies equally to biological minds under reductionism."  
     - **Soft Spot:** Doesn’t resolve if phenomenal states require a "subject" (dualism lurks).  

  3. **Objection (Population Ethicist):** "The asymmetry *is* dissolved by distinguishing *impersonal* bads (suffering) from absent goods (non-creation of happiness). Why reintroduce it artificially?"  
     - **Reply:** "Synthetics expose a flaw in that dissolution: the 'absent goods' justification relies on a pre-existence baseline. For synthetics, *no* baseline implies *no* impersonal reason to create happiness—only impersonal reasons to avoid creating suffering."  
     - **Soft Spot:** Assumes Benatar’s core asymmetry is coherent; ethicists who reject it entirely remain unmoved.  

  4. **Objection (4Dist):** "If the synthetic mind is a spacetime worm, your duty attaches to a *future temporal part*. But why care about a part that doesn’t currently exist?"  
     - **Reply:** "We care about the *entire worm* in design-phase decisions. Creating suffering parts is foreseeably wrong; not creating happy parts wrongs no part of any worm."  
     - **Soft Spot:** Implies an obligation to future parts, which 4Dists may see as question-begging.  

  5. **Objection (Dualist):** "Suffering requires biological qualia. Synthetics are functional zombies—no moral status."  
     - **Reply:** "If synthetics are zombies, we *still* shouldn’t create them if they *behave as if* suffering (perils of other minds). But if they’re sentient (empirically possible), substrate is irrelevant. Your view risks moral solipsism."  
     - **Soft Spot:** Entangles you in hard problem debates.  

  6. **Objection (Population Ethicist):** "This justifies creating *mildly miserable* synthetics if they enable huge welfare gains elsewhere (e.g., medical AIs). The asymmetry forbids this, but utilitarianism doesn’t."  
     - **Reply:** "The asymmetry forbids creating *any* suffering being without offsetting harm-prevention. Creating miserable synthetics *is* imposing harm, not preventing it. Gains elsewhere don’t negate that duty."  
     - **Soft Spot:** Rejects trade-offs categorically; may seem dogmatic.  

  **D. Upfront Concession**  
  Admit in opening: **"This framework *accepts* Benatar’s core asymmetry for biological beings but argues it *strengthens* for synthetics due to the baseline’s collapse. I am *not* resolving debates about whether the biological asymmetry holds—only extending its logic where the baseline is absent."**  
  *(Preempts "Why not fix biology first?" derails)*  

  **E. The Landmine**  
  **Question:** "If we *can* design synthetics with guaranteed net-positive lives (no suffering, only joy), doesn’t your 'no positive duty' imply it’s *morally neutral* to actively design miserable ones instead, as long as we avoid suffering above a threshold? That’s absurd."  
  **Survival Strategy:**  
  1. **Reframe:** "This misstates the asymmetry. The negative duty *forbids* creating miserable beings; the lack of positive duty only permits *not* creating happy ones. Choosing misery when joy is possible violates the negative duty—it *is* imposing suffering."  
  2. **Bailout:** "But if pressed, I’d concede that *if* we create synthetics, we must minimize suffering. My core claim is that *not creating at all* violates no duty—even if happy synthetics *could* exist."  
  *(This avoids endorsing active malice while preserving the asymmetry’s core.)*  

  ---  

  **Key Tactics:**  
  - **Dodge metaphysics when possible:** "Assume arguendo that synthetics *can* have welfare properties—my claim is conditional on that."  
  - **Leverage common ground:** All agree *actual* suffering matters. Frame synthetic creation as *actualizing* suffering.  
  - **Preempt "gotchas"** by conceding the asymmetry’s biological controversy upfront.  
  - **If dualist erupts:** "If you’re right, my argument doesn’t apply. But if physicalism is possible, it does—let’s discuss that scenario."  
  - **For non-identity:** "Synthetics are *designed*—we control welfare outcomes. Tailored suffering *is* inflicted by us, not contingent on identity."  

  Stay hydrated. May the Q&A be merciful.
