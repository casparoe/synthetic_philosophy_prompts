answer: |-
  ### Speaker’s Briefing: Anticipating Objections  
  *Audience: Senior Kantians, Virtue Ethicists, Consequentialist*  
  **Core Thesis Distinction:** Executive maxims (direct action) vs. toleration maxims (institutional permission). Paradox dissolves via "contradiction-in-toleration" test (non-protection maxims cannot be universalised).  

  ---

  #### **I. Kantian Objections**  
  **Likely Challenge:** "Your ‘toleration maxim’ fractures the unity of practical reason. Kant’s tests apply to *all* practical principles—inventing categories beyond FH/FUL smuggles in heteronomy."  
  - **Seriousness:** High (attacks framework coherence).  
  - **Concede:** FH’s primacy; this extends Kant’s project but doesn’t replace his core tests.  
  - **Key Reply:** Toleration maxims address *systemic conditions for agency*—Kant’s "Realm of Ends" implies duties to sustain institutions where rational wills thrive. Failing to universalise non-protection preserves FH’s spirit.  
  - **Weakness:** Texts explicitly linking "toleration" to Kant’s institutional duties are sparse.  

  **Nightmare Question (Kantian/Virtue Hybrid):** "Doesn’t permitting ‘discretionary latitude’ in emergencies (e.g., *not* pushing the one) undermine FH’s absolute barrier to using persons as means?"  
  - **Strategy:** Address only if pressed. Stress: Toleration maxims bind *institutions*, not emergency acts. FH still forbids *executive* instrumentalisation.  
  - **Weakness:** Risks conceding that "non-intervention" *is* tacit instrumentalisation via neglect.  

  ---

  #### **II. Virtue Ethicist Objections**  
  **Likely Challenge:** "Your executive/toleration distinction is artificial casuistry. ‘Collateral harm’ permits scalar moral weighing—this is consequentialism in disguise, obscuring perception of particular harms."  
  - **Seriousness:** Medium-High (questions moral phenomenology).  
  - **Concede:** Systematisation risks oversimplification; virtue ethics captures nuances.  
  - **Key Reply:** The distinction *clarifies* moral perception: directly crushing a person vs. failing to design protective institutions are *categorically distinct* wrongs. Virtue requires both good acts *and* good systems.  
  - **Weakness:** If "toleration" collapses into outcomes (e.g., "five died"), the scalar charge sticks.  

  ---

  #### **III. Consequentialist Objection**  
  **Likely Challenge:** "Contradiction-in-toleration is rule-utilitarianism wearing a deontological mask. ‘Cannot universalise non-protection’ just means ‘yields worse outcomes if generalised’."  
  - **Seriousness:** High (accusation of conceptual theft).  
  - **Concede:** Structural parallels exist, but foundations differ.  
  - **Key Reply:** The test asks whether rational agents can *consistently will* non-protection as law—not whether it *maximises welfare*. It targets institutionalised rational *self-contradiction* (e.g., "all will protection, but none provide it").  
  - **Weakness:** If "rational willing" implicitly relies on expected harms, the boundary blurs.  

  ---

  ### **Tactical Summary**  
  | **Camp**          | **Priority** | **Defence Focus**                          | **Achilles' Heel**                  |  
  |--------------------|--------------|--------------------------------------------|--------------------------------------|  
  | Kantians           | 1 (Highest)  | FH preserved via institutional rationality | Grounding "toleration" in Kant’s texts |  
  | Consequentialist   | 2            | Deontological foundations of consistency   | Covert outcome-dependence            |  
  | Virtue Ethicists   | 3            | Distinction as perceptual aid, not weighing | "Artificial" categorisation           |  

  **Pre-emption Advice:** Briefly flag the "emergency discretion" point *during Q&A setup*: "Note: this framework addresses institutional duties, not exculpating individual emergency choices." Defuse proactively if Kantians dominate.  

  **Final Tip:** When pressed, retreat to: "This rescues FH from paradox *without* consequentialism—by taking Kant’s institutional commitments seriously." Your survival hinges on selling "toleration" as *Kantian*, not revisionist.  

  ---  
  *Good luck. Remember: the Kantians will forgive innovation if it venerates the master; the rest will respect nerve.*
