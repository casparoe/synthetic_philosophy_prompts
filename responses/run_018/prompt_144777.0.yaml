     - Disjunctivism: A veridical perception and a subjectively indistinguishable hallucination do not share a common mental state (the "highest common factor").
     - Predictive Processing (PP) Translation:
       - In PP, perception is the process of minimizing prediction error (PE) by either updating the generative model (world-model) or adjusting precision weights to suppress PE (active inference).
       - **Veridical Perception:** The system minimizes PE by updating the generative model to better match the sensory input. This occurs when the sensory input is reliable (high precision) and the model is updated to reflect the world. The generative model becomes more accurate (i.e., it better predicts the actual world state).
       - **Hallucination:** The system minimizes PE by increasing the precision (weight) of prior beliefs (top-down predictions) to suppress the PE from sensory input. This might occur when sensory input is unreliable (low precision) or when priors are overly strong. The generative model does not update to reflect the world; instead, the sensory input is explained away.
       - **No Common Mental State:** In PP, the "state" of the system is defined by its current generative model (including parameters) and the precision weights. In veridical perception, the model updates to match the world, resulting in a model that accurately reflects the environment. In hallucination, the model remains unchanged (or is updated based on strong priors) and the sensory input is suppressed. The internal dynamics are different: one involves model updating, the other involves error suppression. Thus, there is no common internal state (in terms of the generative model update dynamics) that is shared between the two.

     Translation: 
     - Veridical perception: PE minimized via model updating (posterior belief updated by sensory evidence under high sensory precision).
     - Hallucination: PE minimized via precision modulation (high prior precision suppresses sensory PE, so model does not update to reflect the world).
     - Therefore, the two do not share a common internal process or state at the highest level of description (the dynamics of model updating vs. error suppression).

  2. **Argument from Illusion in PP Terms:**
     - Classical argument from illusion:
       - Premise: Hallucinations can be subjectively indistinguishable from veridical perceptions.
       - Inference: Therefore, the subject must be in the same kind of mental state in both cases (a common factor).
       - Conclusion: Perception is always mediated by an inner mental object (sense-data or representation) because even in veridical perception, we are only directly aware of this inner state.
     - PP Translation:
       - **Subjective Indistinguishability:** In PP, subjective experience is determined by the content of the best hypothesis (the posterior belief) that minimizes PE. In both veridical perception and hallucination, the system may arrive at the same posterior belief (i.e., the same content of perception) because in both cases PE is minimized. The system cannot introspect the process (updating vs. suppression) that led to that belief, so the experience is indistinguishable.
       - **Inference to a Shared Underlying State:** The argument infers that because the experience is the same, there must be a common underlying state. In PP, the "state" at the level of the posterior belief (the content) is the same. However, the underlying processes (model updating vs. error suppression) are different. Thus, PP can explain the subjective indistinguishability without postulating a common process state. The shared state is at the level of the content (posterior belief), not the process (how it was generated).
