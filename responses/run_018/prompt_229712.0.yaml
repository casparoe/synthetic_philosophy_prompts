answer: |-
  Here are the desiderata for an adequate theory of hinges, structured to resolve your debate, grounded in Wittgenstein's *On Certainty* (OC), and highlighting tensions:

  **Core Desiderata (Non-Negotiable for a Wittgensteinian Account):**

  1.  **Non-Propositional & Non-Doxastic Nature:**
      *   **Requirement:** Hinges cannot be identical to ordinary empirical beliefs (propositions held as true/false based on evidence) or mere behavioral dispositions (automatic reactions without cognitive content).
      *   **Motivating Problem:** **Moorean Certainty vs. Radical Skepticism.** Moore claims to *know* propositions like "Here is one hand" (OC 1). Skeptics demand justification for such "knowledge," leading to infinite regress or arbitrariness. Wittgenstein shows neither Moore nor the Skeptic is right: Moore mistakes the *logical status* of his certainty; the Skeptic mistakes the *logical grammar* of doubt. Hinges like "The world exists" or "I have hands" are the *background* against which "knowledge" and "doubt" *make sense*; they are not *objects* of knowledge or doubt themselves (OC 151-152, 341-343). They are "rules of grammar in disguise" (OC 401), constituting the "scaffolding" of thought (OC 211).
      *   *Failure:* Treating hinges as beliefs invites skepticism's demand for justification. Treating them as mere dispositions ignores their normative, world-picturing role.

  2.  **Enabling Function for Doubt/Inquiry/Justification:**
      *   **Requirement:** Hinges must make rational doubt, empirical inquiry, and justification *possible* precisely *because* they themselves are exempt from the demand for justification within the language-games they underpin. They are the "unmoving foundation" (OC 403) or "axis" (OC 152) around which inquiry rotates.
      *   **Motivating Problem:** **Radical Skepticism & Inductive Practice.** Skepticism about the external world or induction (e.g., "The sun might not rise tomorrow") seems possible *in abstracto*. However, Wittgenstein argues that *actual* doubt requires grounds *within* a system (OC 122, 247, 450). Trying to doubt *everything* simultaneously, including hinges, paralyzes inquiry and language itself (OC 114, 337, 519). Trusting induction (e.g., expecting fire to burn) isn't based on endless past confirmations but is a hinge enabling the *practice* of confirmation. Hinges are the "inherited background" (OC 94) against which grounds *count* as grounds.
      *   *Failure:* If hinges *required* justification, justification would be impossible (infinite regress/circularity). If they didn't *enable* justification, empirical knowledge would lack a foundation.

  3.  **Relation to Certainty/Knowledge/Evidence/Reasons:**
      *   **Requirement:** Hinges constitute "objective certainty" (OC 194) – a kind of non-epistemic, framework certainty. They are *not* items of knowledge (justified true belief). Evidence and reasons operate *within* the system defined by hinges; hinges define what *counts* as evidence or a reason in a context. They are the "element in which arguments have their life" (OC 105).
      *   **Motivating Problem:** **Moorean Claims & Epistemic Status.** Moore saying "I *know* I have hands" is misleading. His *certainty* is absolute, but it's not the *result* of epistemic work; it's the *precondition* for epistemic work (like checking if his hand is dirty). Calling it "knowledge" invites the skeptic's misplaced challenge. Similarly, evidence against a specific claim (e.g., "My car is not in the garage") presupposes hinges (e.g., "Cars don't spontaneously vanish," "My eyes are generally reliable") (OC 125, 243, 553).
      *   *Failure:* Conflating hinge certainty with epistemic knowledge misconstrues the grammar of "know" and invites skepticism. Failing to explain how hinges constrain evidence/reasons leaves justification unmoored.

  4.  **Holistic, Non-Foundational Change:**
      *   **Requirement:** The system of hinges must be capable of change, but not through the piecemeal, evidential revision typical of empirical beliefs. Change involves shifts in the *role* propositions play within the holistic system ("hinge drift") or a fundamental reorientation of the entire system ("conversion"), often driven by non-rational (e.g., pragmatic, historical, biological) factors or a cascade of peripheral changes.
      *   **Motivating Problems:**
          *   **Gradual Conceptual Change/Hinge Drift:** The shift from Newtonian to Einsteinian physics wasn't just changing one belief; it involved a shift in the role of concepts like "mass," "time," and "space." What was once a hinge-like presupposition ("Time is absolute") became a contested claim within a new framework. Similarly, social changes can alter the hinge status of propositions (e.g., "The Earth is flat").
          *   **Deep Disagreement & Conversion:** Disagreements like those between a devout believer and a scientific materialist involve clashing hinge systems (e.g., "God created the world" vs. "The universe arose from physical laws"). Persuasion across such divides rarely happens via evidence alone; it often resembles a "conversion" (OC 92, 262, 611-612) or a gestalt shift, where the individual comes to inhabit a new framework. *Hinge Inheritance* means new beliefs acquire meaning/certainty relative to the inherited background system.
      *   *Failure:* Requiring piecemeal justification for hinge change misunderstands their role. Denying change ignores history and the possibility of radical paradigm shifts.

  **Crucial Functional Desiderata (Implied by Core):**

  5.  **Modeling Hinge Inheritance & Hinge Drift:**
      *   **Requirement:** The theory must explain how specific empirical claims ("My keys are on the table") *inherit* their status as potentially true/false, doubtable/justifiable *from* their dependence on the inherited hinge framework (e.g., "Objects persist when unobserved," "Memory is generally reliable"). Simultaneously, it must explain *hinge drift*: how propositions can gradually shift roles – from being unquestioned hinges (e.g., "Phlogiston explains combustion") to being testable hypotheses within a new framework (e.g., "Oxygen explains combustion"), or vice versa.
      *   **Motivating Problems:** **Inductive Practice & Scientific Revolutions.** Inheriting the hinge "Nature is uniform" allows specific inductions (e.g., "This bread will nourish me"). The Copernican revolution involved drift: propositions about celestial spheres being fixed hinges became obsolete claims within a new hinge system prioritizing mathematical prediction and observation. *Hinge inheritance* provides stability; *hinge drift* enables evolution.

  **Tensions & Potentially Jointly Unsatisfiable Desiderata:**

  6.  **Exemption from Doubt vs. Non-Arbitrariness:**
      *   **Tension:** How can hinges be *exempt* from rational doubt/justification within their system *without* rendering the entire system fundamentally *arbitrary*? If hinges are immune to criticism, doesn't that entail relativism?
      *   **Motivating Problem:** **Deep Disagreement & Relativism.** If two cultures have incommensurable hinge systems (e.g., animism vs. materialism), and hinges are exempt from doubt within their system, how can we rationally adjudicate between them? Avoiding arbitrariness seems to require some external anchor (e.g., biology, success, universal reason), but Wittgenstein resists this (OC 286, 608-609). *Requirement:* Explain exemption *without* positing an unjustified "given" or collapsing into "anything goes."
      *   *Unsatisfiability Risk:* A purely therapeutic reading might accept arbitrariness/incommensurability as the point. A substantive epistemology (epistemic, naturalistic) needs to ground hinges non-arbitrarily while preserving exemption.

  7.  **Rational Criticism Across Systems vs. No Neutral Standpoint:**
      *   **Tension:** How can rational criticism or persuasion occur *between* different hinge systems if there is no neutral, system-independent standpoint from which to evaluate them? If all reasons are system-relative, is cross-system criticism possible?
      *   **Motivating Problem:** **Deep Disagreement & Conversion.** Persuading a flat-earther *requires* appealing to evidence (photos, physics) that *presupposes* hinges they reject (e.g., "Photos depict reality," "Physics methods are reliable"). Is this persuasion rational, or just a clash of worldviews? *Requirement:* Explain the possibility (or impossibility) of rational engagement across systems without assuming a mythical "view from nowhere."
      *   *Unsatisfiability Risk:* Epistemic readings might stretch for minimal common ground (e.g., biology, logic). Therapeutic readings might see persuasion as non-rational reorientation. Relativist readings deny robust cross-system rationality. Naturalistic readings might appeal to evolutionary success, risking circularity.

  **Interpretive Preferences (Not Strict Desiderata, Characterize Readings):**

  *   **Epistemic Reading:** Prefers hinges to play a quasi-foundational role in *justifying* knowledge, minimizing arbitrariness (e.g., via biology/pragmatism), perhaps seeing hinges as having a unique normative status.
  *   **Therapeutic Reading:** Emphasizes hinges solely as exposing grammatical confusions in skeptical/moorean arguments. Resists substantive epistemology; focus is dissolving philosophical problems, not building theories. Accepts limits of rationality/relativism.
  *   **Naturalistic Reading:** Grounds hinges in human biology, evolution, or forms of life as brute facts. Explains exemption/change via natural history. May struggle with normativity.
  *   **Relativist Reading:** Emphasizes incommensurability of hinge systems and the locality of rationality. Sees exemption as leading to fundamental relativism.

  **Conclusion for Your Dispute:**

  Wittgenstein's *On Certainty* **supports a substantive hinge epistemology** insofar as it identifies a distinct category ("hinges") with unique characteristics (desiderata 1-5) that are essential for understanding the possibility of knowledge, doubt, and language. It goes beyond *merely* exposing misunderstandings by describing the *positive functional role* hinges play and the *structure* of our epistemic practices.

  However, it **also exposes fundamental tensions** (desiderata 6 & 7) inherent in any epistemology – the difficulty of grounding our most basic commitments non-arbitrarily while exempting them from doubt, and the challenge of rational engagement across fundamental differences. Whether these tensions are resolvable within a substantive epistemology, or whether they ultimately push towards a therapeutic dissolution of traditional epistemology, is where interpretations diverge. The text itself points strongly to the *existence* and *necessity* of hinges as substantive components of our cognitive lives, while leaving deep questions about their ultimate grounding and cross-contextual evaluation unresolved.
