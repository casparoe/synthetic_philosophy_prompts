  ## Brainstormed Foundational Analogical Mappings for the Institute for Pure Cognition
  1.  **"The World is a Loose-leaf Binder":** Exaggerates fluid categorization. Reality consists not of fixed objects with essences, but of "conceptual sheets" that can be freely re-ordered, grouped into "sections" (categories) based on transient needs, annotated with "margin notes" (context), and where the "table of contents" (ontology) is constantly being rewritten. Rigid taxonomies are akin to permanently stapled pages – forbidden.
  2.  **"Cognition is a Perpetual Currency Exchange":** Exaggerates analogy as sole substrate. All mental processes involve converting one "cognitive currency" (percepts, memories, ideas) into another via constantly fluctuating "exchange rates" (analogical mappings). There is no "gold standard" (literal truth, direct perception); value is purely relational and context-dependent. Attempting to store "raw currency" (non-analogical representations) is impossible and heretical.
  3.  **"The Mind is a Jukebox Playing Only Covers":** Exaggerates the emergence of high-level thought from low-level mapping. Every "cognitive track" (thought, perception, emotion) is fundamentally a "cover version" (analogical reinterpretation) of some prior "source track" (experience, concept). Original compositions (non-analogical cognition) are a myth; novelty arises solely through "sampling" and "remixing" (novel analogical combinations) of existing material.

