  **INSTITUTE FOR PURE COGNITION (IPC)**
  **Office of Academic Human Capital Optimization**

  **POSITION:** Assistant Professor, Department of Essential Analogies (Tenure-Track)
  **POSTING REF:** IPC-DEA-24-01
  **SALARY BAND:** Conceptual Proximity Level 7-9 (Commensurate with Mapping Density & Abstraction Scaling; see IPC Compensation Matrix §4.3b)
  **APPOINTMENT START:** Fall 2025
  **APPLICATION DEADLINE:** May 1, 2025, 11:59 PM (Coordinated Conceptual Time)

  **INSTITUTIONAL CONTEXT:**
  The Institute for Pure Cognition (IPC), guided by its foundational charter, advances the Unified Theory of Analogical Substratism (UTAS). UTAS posits that all cognitive phenomena—ranging from sensory transduction to ethical deliberation—are exclusively constituted by analogical mapping operations across conceptual domains at varying scales of abstraction. There exists no cognitive residue unaccounted for by analogy. The Department of Essential Analogies (DEA) serves as the core disciplinary unit responsible for refining UTAS, developing rigorous mapping taxonomies, and enforcing doctrinal consistency across all IPC research programs. Deviation from the sole-substrate principle constitutes Conceptual Heresy.

  **POSITION DESCRIPTION:**
  The DEA seeks an emerging scholar whose research program demonstrates profound commitment to UTAS. The successful candidate will:
  1.  Develop and teach undergraduate and graduate courses (e.g., "Analogical Foundations of Perception," "Moral Reasoning as Cross-Domain Mapping," "The Fluid Dynamics of Conceptual Boundaries") that rigorously exclude non-analogical explanatory frameworks.
  2.  Conduct groundbreaking research that strengthens UTAS by identifying novel universal mapping primitives, demonstrating the analogical derivation of phenomena previously misclassified as non-analogical (e.g., basic logical inference, qualia), or exposing structural flaws in rival frameworks.
  3.  Actively participate in departmental and institute governance, including mandatory service on the Committee for Mapping Integrity Verification (CMIV) and the Tenure Isomorphism Review Board (TIRB).
  4.  Supervise graduate research exclusively within the UTAS paradigm, ensuring candidate projects exhibit high-fidelity mapping potential to core DEA analogical structures.
  5.  Contribute to IPC-wide initiatives promoting analogical coherence, including weekly "Source-Target Alignment" seminars and annual "Conceptual Re-blending" retreats.

  **REQUIRED QUALIFICATIONS:**
  *   Ph.D. in Cognitive Science, Philosophy of Mind, Computational Linguistics, or a rigorously remappable discipline, conferred by appointment start date.
  *   Demonstrated expertise in the theory and mechanics of analogical mapping, evidenced by peer-reviewed publications in UTAS-aligned journals (e.g., *Journal of Ubiquitous Analogy*, *Mapping and Cognition*).
  *   A research statement unequivocally grounded in UTAS, explicitly rejecting the explanatory viability of non-analogical cognitive substrates (e.g., "direct perception," "symbolic computation," "non-representational awareness," "essentialist categorization," "innate modules," "discrete logical primitives").
  *   Proven pedagogical ability to frame *all* cognitive phenomena through analogical mapping, without recourse to residual non-analogical constructs.
  *   Fluency in identifying and critiquing Conceptual Heresy in scholarly work.
  *   Commitment to advancing IPC's mission of establishing UTAS as the singular framework for understanding cognition.

  **PREFERRED QUALIFICATIONS:**
  *   Experience developing formal/computational models demonstrating the derivation of complex cognitive functions from low-level analogical operations.
  *   Evidence of successful "conceptual salvage" operations: reframing theories/phenomena from non-analogical traditions within rigorous UTAS-compliant mappings.
  *   Demonstrated ability to map administrative procedures (e.g., curriculum design, assessment protocols) onto core DEA analogical structures.
  *   Proficiency in identifying subtle structural divergences undermining apparent analogical similarity.

  **INSTITUTIONAL CULTURE:**
  *   **Peer Review:** All scholarly output undergoes mandatory "Cross-Domain Mapping Assessment" by the CMIV. Reviews evaluate the structural soundness of proposed mappings, fecundity for generating further analogies, and absence of non-analogical residues. Reviewers submit formal "Mapping Congruence Reports."
  *   **Tenure Standards:** Tenure is contingent upon the candidate's entire research program achieving "Isomorphic Mapping" status with the institute's founding principles, as determined by the TIRB. This requires demonstrating that every aspect of the candidate's work can be mapped onto core DEA analogical structures (e.g., The Loose-leaf Binder, The Perpetual Currency Exchange) with minimal structural slippage and no loss of core relational correspondences. Evidence of any non-analogical commitments is grounds for immediate disqualification.
  *   **Office Rituals:** Daily operations embody UTAS principles.
      *   Morning "Conceptual Calibration" involves collaboratively mapping the day's tasks onto a rotating foundational analogy.
      *   Problem-solving occurs through structured "Source-Target Pairing Sessions."
      *   Inter-departmental communication utilizes standardized "Mapping Request Forms" specifying source domain, target domain, and desired level of abstraction.
      *   Physical office assignments are determined by semantic distance calculations from the Department Head's office (the "Primary Source Node").
  *   **Compensation & Resources:** Salary bands and research budgets are calculated algorithmically based on metrics of "Conceptual Proximity" to core DEA research streams and "Mapping Yield" (measured by derived publications, grant acquisitions, and successful student mappings). Parking allocations correlate inversely with abstractness of research focus (higher abstraction = closer proximity to covered lots; concrete-residual heresies = remote overflow lot).

  **APPLICATION INSTRUCTIONS:**
  Submit the following via the IPC Academic Employment Portal (Portal requires completion of a mandatory "Conceptual Alignment Pre-screening"):
  1.  Cover Letter demonstrating your intellectual journey as a coherent mapping operation towards UTAS.
  2.  Curriculum Vitae (annotated to highlight analogical linkages between experiences).
  3.  Research Statement (max 3 pages) detailing past, present, and future research *exclusively* within the UTAS framework. Must explicitly identify and reject non-analogical fallacies in prior literature.
  4.  Teaching Statement (max 2 pages) outlining pedagogical strategies for instilling UTAS principles and detecting Conceptual Heresy in student work. Include sample syllabi frames.
  5.  Three (3) Publication Samples demonstrating UTAS-aligned research.
  6.  Three (3) Confidential Letters of Reference assessing the candidate's mapping fidelity, potential for structural isomorphism with IPC doctrine, and vigilance against Conceptual Heresy.

  *The Institute for Pure Cognition is committed to fostering a diverse environment of conceptual fluidity. We encourage applications from candidates whose unique experiential source domains offer rich potential for novel mappings onto our foundational target structures. IPC is an Equal Opportunity Mapping Employer.*
