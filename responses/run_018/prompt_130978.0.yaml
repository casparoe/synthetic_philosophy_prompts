  **Procedure for Aggregating Stakeholder Preferences**

  **Pre-meeting preparation**: 
     - Each stakeholder must submit a report that includes:
          (a) A ranking of key outcomes (sure things).
          (b) For a subset of outcomes (at least the best, worst, and one intermediate), a probability p that makes them indifferent between the intermediate outcome for sure and a lottery giving the best with probability p and the worst with probability (1-p).
          (c) A utility number for every outcome that might result from the proposals (on any numerical scale).

  **Step 1: Verify vNM preferences for each stakeholder report**

     1.1. Check completeness and transitivity on the ranking of sure outcomes:
          - The stakeholder must have ranked all provided sure outcomes without cycles.
          - If intransitive or incomplete, the report is rejected. The stakeholder is excluded.

     1.2. Check continuity:
          - Using the best (B), worst (W), and one intermediate (M) outcome, verify that the stakeholder provided a probability p (between 0 and 1) such that M is indifferent to [p B + (1-p) W]. 
          - If not, the report is rejected. Exclude the stakeholder.

     1.3. Check independence:
          - Test with a simple example: 
              - Let L1 = best outcome for sure.
              - Let L2 = worst outcome for sure.
              - Ask: "Do you prefer L1 to L2?" (Expected: yes.)
              - Then, let L3 = a 50-50 lottery between best and worst.
              - Consider two new lotteries:
                    Lottery A: 50% chance of L1 and 50% chance of L3.
                    Lottery B: 50% chance of L2 and 50% chance of L3.
              - Ask: "Do you prefer Lottery A to Lottery B?"
          - Expected: Yes, by independence.
          - If the answer is not as expected, record a failure of independence.

     Stopping: 
          - If a stakeholder fails 1.1 or 1.2, exclude them.
          - If they fail 1.3, note it and proceed to step 2.

