     2.1. For each stakeholder who failed the independence test in step 1.3:
          - The board is informed of the failure and the stakeholder's identity.
          - The board votes (by majority) on whether to:
               (a) Exclude the stakeholder, or
               (b) Include them and use their reported utilities for expected utility calculations (ignoring the independence violation).

     2.2. If the board cannot decide (tie), the stakeholder is excluded.

  **Step 3: Determine welfare weights**

     3.1. List all included stakeholders.

     3.2. The board discusses and then votes on a weighting scheme. The weights must be nonnegative and sum to 1 (or any positive scaling, but we can normalize).

          Options for the board to consider (but they are free to choose):
            a. Equal weights: weight_i = 1 / (number of stakeholders)
            b. Proportional to the population represented.
            c. Based on prior agreements or board charter.

     3.3. Assign the chosen weights to each stakeholder.

