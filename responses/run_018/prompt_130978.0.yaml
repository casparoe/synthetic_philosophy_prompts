     4.1. Normalize each stakeholder's utility function:
          - For stakeholder i, let:
                u_i(x) = (reported_utility_i(x) - min_i) / (max_i - min_i)
            where min_i is the minimum utility reported by i over all outcomes, and max_i is the maximum.

     4.2. For each proposal (which is a probability distribution over outcomes), compute for each stakeholder i:
            EU_i = sum_{outcome x} [ P(proposal yields x) * u_i(x) ]

     4.3. Compute the social welfare for the proposal:
            W(proposal) = sum_{i} [ weight_i * EU_i ]

