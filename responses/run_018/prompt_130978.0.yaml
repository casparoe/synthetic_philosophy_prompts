          - The board must either:
               (a) Exclude proposals with missing utilities, or
               (b) Ask the stakeholder on the spot for the utility of the missing outcome (by providing a certainty equivalent relative to best and worst) and then compute.

          Given time, if a stakeholder cannot provide a utility for an outcome, we assign:
               u_i(x) = (min_i + max_i) / 2   [as a default, but this is arbitrary]
          But this is not recommended. The board should defer the proposal if possible.

  **Step 5: Final recommendation and override conditions**

     5.1. Rank the proposals by W (highest to lowest).

     5.2. Conditions for deferral to a board vote:

          a. If the difference in W between the top two proposals is less than 5% of the total possible W range (which we define as the maximum possible W minus the minimum possible W, computed by considering the best and worst outcomes for all stakeholders), then the board votes.

          b. If any stakeholder was excluded in steps 1 or 2, and the board feels their inclusion might change the outcome, the board may vote to override.

          c. The board may vote to override the recommendation by a majority vote if they judge the weights or the procedure to be inappropriate for this case.

     5.3. If no override, the proposal with the highest W is chosen.

     5.4. If the board votes to override, they then vote on the proposals.

  **Example Override Scenario**

     As in the dam example above: the procedure recommends the dam because it has higher total welfare, but the board might vote against it due to concerns about the tribal community.

     Why does the procedure recommend it? Because it sums utilities and the weights are equal. The tribal community's loss is outweighed by the gains of the other two stakeholders. But the board might believe that the tribal community's rights should not be traded off.

     This is a normative disagreement that the procedure cannot resolve.

  **Conclusion of the Procedure**

     The procedure provides a systematic way to aggregate stakeholder preferences under the assumptions of Harsanyi's theorem. However, it cannot:

     - Determine the welfare weights: this requires a value judgment by the board.
     - Resolve violations of the vNM axioms, especially independence, without excluding stakeholders or approximating.
     - Incorporate moral considerations that are not captured by the stakeholders' utilities (e.g., rights, fairness, or sustainability as an intrinsic value).
     - Handle missing or incomplete utility data without approximation.
     - Address uncertainty in probabilities (ambiguity) beyond known lotteries.
     - Assign utilities to outcomes for stakeholders who cannot express them in the required form.

     Therefore, the board must exercise judgment when setting weights, when overriding, and when interpreting the result.
answer: |-
  ### **Operationalized Procedure for Harsanyi's Aggregation Theorem**

  **Objective**: Enable non-economist board members to aggregate stakeholder reports into a social welfare function under Harsanyi’s theorem in a single two-hour session without software. The procedure assumes stakeholders have submitted reports with preferences over outcomes (including probabilistic scenarios).

  ---

  #### **Step 1: Verify vNM Preferences per Stakeholder**  
  *Purpose: Ensure each stakeholder’s report satisfies von Neumann-Morgenstern (vNM) axioms for cardinal utility.*  
  **Tests and Stopping Rules**:  
  1. **Completeness and Transitivity Check**:  
     - *Question*: "For any two outcomes \(A\) and \(B\), does the stakeholder clearly rank \(A \succ B\), \(B \succ A\), or indifference? Verify no cycles in rankings (e.g., \(A \succ B\), \(B \succ C\), but \(C \succ A\))."  
     - *Stopping Rule*: If **intransitive**, exclude the stakeholder. Proceed with others.  
  2. **Continuity Axiom Check**:  
     - *Question*: "For outcomes \(A \succ B \succ C\), is there a probability \(p\) where the stakeholder is indifferent between \(B\) and a lottery \([p, A; (1-p), C]\)?"  
     - *Stopping Rule*: If **no such \(p\) exists**, exclude the stakeholder.  
  3. **Independence Axiom Check**:  
     - *Question*: "For lotteries \(L_1, L_2, L_3\) and probability \(q\), if \(L_1 \succ L_2\), is \([q, L_1; (1-q), L_3] \succ [q, L_2; (1-q), L_3]\) always true?"  
     - *Stopping Rule*: If **violated**, flag and proceed to **Step 2**.  

  **Hard Case Handling**:  
  - *Ambiguity Aversion (e.g., climate scenarios)*: If a stakeholder rejects probabilistic lotteries (e.g., "unknown flood risks"), note this as an independence violation. Proceed to Step 2.

  ---

  #### **Step 2: Address Independence Axiom Failures**  
  *Purpose: Resolve violations (e.g., ambiguity-averse groups) to retain stakeholders.*  
  **Procedure**:  
  - **Check for Proxy Use**: If the violating stakeholder is a **proxy for future generations** (using discount rates), accept their model as a "lottery" (e.g., discounted outcomes = risky asset). *No exclusion*.  
  - **Non-Proxy Violators (e.g., agricultural groups)**:  
    - *Mitigation*: Ask the stakeholder to:  
      (a) Re-rank outcomes using **certainty equivalents** (e.g., "What guaranteed benefit matches a 50% chance of \(X\)?").  
      (b) Use **outcome swaps** (e.g., replace ambiguous outcomes with worst-case equivalents).  
    - *Stopping Rule*: If refusal or unresolved, **exclude the stakeholder**.  

  ---

  #### **Step 3: Determine Welfare Weights**  
  *Purpose: Assign weights to stakeholders for aggregation. **Explicitly mark as value judgment**.*  
  **Procedure**:  
  1. **Board Discussion (20 mins)**:  
     - Weights reflect ethical priorities (e.g., vulnerable groups weighted higher).  
     - *Default*: Equal weights if no consensus.  
  2. **Document Judgment**: "Weights are normative. They are set at [X] for Group A, [Y] for Group B, etc., based on [ethical rationale]."  

  **Hard Case Handling**:  
  - *Future-Generations Proxy*: Weight negotiation (e.g., high weight if sustainability is a priority). Board must resolve conflicts (e.g., transit corridor users vs. future generations).

  ---

  #### **Step 4: Compute Social Welfare**  
  *Purpose: Approximate \( \text{Social Welfare} = \sum (\text{weight}_i \times \text{cardinal utility}_i) \).*  
  **Procedure**:  
  1. **Cardinal Utility Extraction**:  
     - For each stakeholder, scale utilities to \([0, 1]\):  
       - Best outcome = 1, worst outcome = 0.  
       - Use certainty equivalents (Step 1) to assign values to intermediates.  
  2. **Ordinal Utility Workaround**:  
     - *If utilities are ordinally ranked*: Assign linear scores (e.g., rank 1 = 1.0, rank 2 = 0.8, etc.). **Flag as approximation error**.  
  3. **Expected Utility Calculation**:  
     - For probabilistic outcomes (e.g., levee failure chance), compute:  
       \[ \text{EU}_i = \sum (\text{probability} \times \text{utility of outcome}) \]  
  4. **Social Welfare**:  
     \[ W = \sum (\text{weight}_i \times \text{EU}_i) \]  

  **Hard Case Handling**:  
  - *Missing Probabilities*: If stakeholders dispute probabilities (e.g., flood models), use expert consensus. If none, defer to Step 5.

  ---

  #### **Step 5: Aggregation Rule and Deferral Conditions**  
  *Purpose: Finalize a decision or defer to vote.*  
  **Rules**:  
  1. **Approval Threshold**: Approve proposal if \( W \geq 0.5 \) (normalized welfare).  
  2. **Deferral to Human Vote If**:  
     - \( |W_{\text{proposal}} - W_{\text{status quo}}| < 0.1 \) (small welfare gain).  
     - Key stakeholders excluded in Steps 1–2.  
     - Board disputes weights (Step 3) or utilities (Step 4).  
  3. **Override Clause**: Reject Harsanyi’s recommendation if it conflicts with board ethics (see example below).

  ---

  ### **Application to Proposals**  
  #### **Proposal 1: Coastal Levee Reinforcement**  
  - **Stakeholders**:  
    - Farmers: Reject flood-probability lotteries (ambiguity aversion → independence violation).  
    - Residents: vNM-compliant.  
  - **Procedure**:  
    1. Step 1: Exclude farmers (independence violation unresolved).  
    2. Step 3: Weights = 0.6 (residents), 0.4 (city engineers).  
    3. Step 4: Compute \( W \) without farmers. \( W = 0.65 \).  
    4. Step 5: **Approve** (but defer if farmers’ exclusion is contested).  

  #### **Proposal 2: Transit Corridor Extension**  
  - **Stakeholders**:  
    - Present Users: vNM-compliant; prefer short-term benefits.  
    - Future-Generations Proxy: Discounted utility model; vNM-compliant.  
  - **Conflict**: Disagree on weights and outcomes (e.g., construction noise vs. long-term efficiency).  
  - **Procedure**:  
    1. Step 3: Board sets weights = 0.4 (present), 0.6 (future) → normative judgment.  
    2. Step 4: \( W = 0.55 \) (approve).  
    3. Step 5: **Approve** unless welfare gain is marginal.  

  ---

  ### **Conflicting Moral Judgment Example**  
  **Proposal**: Demolish a historic neighborhood for a hospital.  
  - **Stakeholders**:  
    - Residents: High utility from healthcare access (\( u = 0.9 \)).  
    - Cultural Heritage Group: Catastrophic utility loss (\( u = -1.0 \)).  
  - **Weights**: Equal (0.5 each).  
  - **Welfare Calculation**:  
    \[ W = (0.5 \times 0.9) + (0.5 \times (-1.0)) = -0.05 \]  
  - **Harsanyi Recommendation**: **Reject**.  
  - **Board Conflict**: If members believe healthcare outweighs heritage, they may **override** via vote.  
  - **Why Conflict?** Harsanyi ignores non-utility values (e.g., historical intrinsic worth). Aggregation is strictly utilitarian.  

  ---

  ### **What the Procedure Cannot Determine**  
  1. **Normative Weights**: The source of weights (e.g., intergenerational equity) requires ethical judgment.  
  2. **Non-Utility Goods**: Rights, justice, or ecological value not captured in utilities are excluded.  
  3. **Ambiguity vs. Risk**: Cannot resolve deep uncertainty (e.g., climate "unknowns") without approximating probabilities.  
  4. **Proxy Legitimacy**: Future-generations proxies rely on contested models (e.g., discount rates).  
  5. **Incommensurable Utilities**: Does not reconcile fundamentally opposing views (e.g., "sacred" vs. material goods).  

  **Conclusion**: This procedure operationalizes Harsanyi’s theorem for pragmatic use but **requires board judgment** on weights, excluded stakeholders, and moral overrides. It is a tool—not a substitute—for deliberative democracy.
