  First, I need to list the requirements any theory must satisfy. The key points are: explaining ordinary suffering's normative weight, accommodating asymbolia without reducing it to just lack of affect, distinguishing pain's badness from nausea/grief/dread, aligning with neuroscience showing nociception vs affective processing are separate, and handling the "mirror-case" of negative affect without nociception. 

  Hmm, the user also wants me to mark which requirements are non-negotiable versus debatable, flag potential conflicts between them, and evaluate hedonist/representationalist/desire theories against these criteria. Plus confidence levels and the least certain point. 

  Right, let's tackle this systematically. The absolute non-negotiables seem to be: explaining normative weight and accommodating asymbolia properly, since those are core to the character's condition. The neuroscience consistency is also crucial for realism. 

  I'm noticing a tension between requirement 2 (asymbolia isn't just absent affect) and requirement 5 (whether badness is intrinsic to phenomenal character). If badness is intrinsic to pain's feeling, how can asymbolics have the feeling without badness? That might be unresolvable. 

  For theory scoring: hedonism fails asymbolia by conflating sensation with badness; representationalism handles it better by separating valuation; desire theory struggles with the mirror-case. The mirror-case distinction is where I'm least confident—it's philosophically messy whether non-nociceptive suffering shares pain's normative weight. 

  User's doing deep research here. Their "mirror-case" is particularly sharp—it forces theories to clarify if badness comes from sensation or something deeper. I'll emphasise that uncertainty in the response. 

  British English check: using "tissue damage" not "tissue injury", "hedonist" not "hedonic", "whilst" not "while". All good.
answer: |-
  Here are the desiderata for an adequate theory of pain's badness, tailored to your character's condition and philosophical rigour, presented in British English:

  ### Core Desiderata (Non-Negotiable)
  1.  **Explain Normative Weight:** *Must account for the strong, prima facie moral reason to alleviate ordinary pain and avoid causing it.*  
      **Motivation:** Any theory must ground why we have urgent duties to relieve a child's burn pain or post-operative suffering. Failure here renders the theory irrelevant to ethics.  
      **Confidence:** Very High (Bedrock of the enquiry).

  2.  **Accommodate Asymbolia Non-Reductively:** *Must explain why asymbolia involves intact nociception and sensory discrimination ("I feel a burning sensation of intensity 8 at my hand") yet lacks suffering, without reducing the lack of suffering to a mere absence of affective blip or trivial difference.*  
      **Motivation:** Asymbolia is a profound dissociation, not simple numbness. It challenges the idea that sensory pain *is* suffering. The theory must respect its clinical reality (e.g., patients accurately describing tissue damage whilst calmly observing it).  
      **Confidence:** High (Core to your character).

  3.  **Respect Neuroscientific Dissociation:** *Must be consistent with the evidence that nociception (detection of noxious stimuli) and the affective/motivational dimension (suffering, unpleasantness) involve distinct, though interacting, neural pathways (e.g., S1/S2 vs. anterior cingulate cortex/insula).*  
      **Motivation:** Science shows pain's sensory and suffering components are separable. A theory ignoring this is biologically implausible.  
      **Confidence:** High (Well-established).

  4.  **Distinguish Pain's Badness:** *Must articulate how the intrinsic badness of paradigmatic pain differs from the badness of other aversive states like profound nausea, existential dread, or intense grief, even if all are unpleasant.*  
      **Motivation:** Pain seems uniquely urgent, bodily, and linked to immediate physical threat in a way nausea (digestive) or grief (loss) isn't. A theory conflating them loses explanatory power.  
      **Confidence:** Moderate-High (Intuitive, but precise distinctions are debated).

  ### The Mirror-Case Requirement (Highly Salient for Novelty)
  5.  **Address the Mirror-Case:** *Must specify the normative status of "intense negative affect occurring in the complete absence of nociceptive input" (e.g., severe panic attack with no physical cause, profound non-bodily existential horror). Does this state possess the *same kind* of normative weight as physical pain?*  
      **Motivation:** This tests if the badness stems *only* from affect, or if the link to bodily integrity/violation via nociception is essential for pain's *specific* badness. Crucial for exploring the boundaries of suffering.  
      **Confidence:** Moderate (Conceptually vital, but empirically/comparatively less explored than asymbolia). **This is the point about which I am least certain.** Is the normative weight truly *equivalent*, or is the visceral, bodily nature of pain foundational to its unique claim upon us?

  ### Potential Tensions (Flagged Conflicts)
  *   **Key Suspected Conflict:** **Accommodating Asymbolia (2) vs. Intrinsic Badness of Phenomenal Character:** If the badness is intrinsic to the *phenomenal feel* of ordinary pain (e.g., its raw hurtfulness), how can asymbolics have that *same phenomenal character* (they report the sensation vividly) without the badness? *(This strongly suggests badness is NOT intrinsic to the sensory quale itself, but requires an additional component – e.g., a negative valuation by the subject or system)*.
  *   **Potential Conflict:** **Distinguishing Pain (4) vs. Mirror-Case Normative Weight (5):** If pain's badness is primarily due to its intense negative affect *and* the mirror-case has equivalent affect, insisting on a strong normative distinction becomes difficult without appealing to something beyond affect (e.g., representation of bodily damage).

  ### Theory Scoring (✓ Partial, ✗ Fail, ✓✗ Mixed, ✓✓ Strong)

  | Theory          | 1. Norm Weight | 2. Asymbolia Non-Red | 3. Neuro Compat | 4. Distinct Badness | 5. Mirror-Case         | Overall Fit |
  | :-------------- | :------------- | :------------------- | :-------------- | :------------------ | :--------------------- | :---------- |
  | **Hedonist**    | ✓✓             | ✗                    | ✗               | ✗                   | ✓✓                     | Poor        |
  | *(Badness = intrinsic unpleasantness of sensation)* | (Pain is bad feel) | (Reduces to absence of unpleasantness) | (Conflates sensation & affect) | (All bad feels are equally bad qua feel) | (Any intense bad feel is equally bad) |             |
  | **Representationalist** | ✓✗             | ✓✓                   | ✓✓              | ✓✓                  | ✗/✓✗                   | Good        |
  | *(Badness = accurate representation of bodily damage/ threat)* | (Depends on theory of normativity) | (Sensation present, but damage not represented *as bad*) | (Fits dissociation) | (Unique link to bodily integrity) | (✗ If normativity requires *bodily* damage rep; ✓✗ If "threat" broadens) |             |
  | **Desire-Based** | ✓✗             | ✓✓                   | ✓✓              | ✓✗                  | ✓✓                     | Good        |
  | *(Badness = frustration of intrinsic desire for no-damage/well-being)* | (Depends on desire strength) | (Sensation present, but no desire to avoid it) | (Fits dissociation) | (Pain uniquely frustrates bodily integrity desire? Other states frustrate other desires) | (Any state frustrating core desires is bad) |             |

  ### Confidence & Least Certain Point
  *   **Confidence in Desiderata 1-4:** High. They capture essential features of pain, asymbolia, and scientific reality.
  *   **Confidence in Desideratum 5 (Mirror-Case):** **Moderate, and this is the point about which I am least certain.** Determining whether intense non-nociceptive negative affect carries the *exact same* normative weight as physical pain involves deep, unresolved questions about the relationship between bodily integrity, the evolutionary role of nociception, and the nature of suffering itself. Is the body's cry truly different in kind? Or is the intensity of negative affect the sole normative driver? This ambiguity, however, is philosophically rich territory for your novel.

  This framework ensures the philosophy underpinning your character's asymbolia is robust, engages with real scientific and philosophical debates, and highlights the profound questions her condition raises about the very nature of suffering and value. It strongly suggests that any theory claiming badness is *intrinsic* to the sensory phenomenology of pain cannot adequately account for asymbolia.
