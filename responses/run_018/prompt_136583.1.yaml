  Japan's monarchy is even more constrained post-1947. The Emperor's duties are entirely ceremonial, dictated by the cabinet. Any reserve is purely performative; there's no real authority beyond symbolism. 

  Scandinavian monarchies vary. Sweden stripped royal powers entirely in the 1970s, making their reserve performative. Denmark and Norway retain nominal powers (e.g., appointing governments), but in practice, this follows parliamentary consensus. Their reserves are performative, with any real authority relocated to parliament or the cabinet. 

  Next, the legitimacy distinction: inherited vs. renewed. The UK leans heavily on inherited legitimacy—centuries of tradition, legal succession. Renewed legitimacy exists through funding and lack of republicanism, but it's secondary. Japan's monarchy relies on renewed legitimacy after WWII; its survival depends on democratic acceptance and constitutional reaffirmation. Scandinavia balances both: inherited continuity exists, but active parliamentary support (e.g., funding votes) underscores renewed legitimacy. 

  The key question is whether renewed legitimacy erases the functional difference between a monarch and a ceremonial president. In cases like Japan and Sweden, yes—the monarch acts like a president. In the UK and Norway, the monarch's theoretical powers create a psychological difference, but not a practical one. 

  For the sustaining feature, popular acquiescence seems most critical. If public support fades, even strong historical continuity (like the UK's) wouldn't save the monarchy. Legal formalities and history matter less without public tolerance. 

