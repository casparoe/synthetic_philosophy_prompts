  everyone in philosophy twitter keeps comparing moral progress to widening the lens of a camera -- the center stays put and the periphery comes into focus, so expanding the moral circle is just applying the same old rules to new subjects. they use this to argue that progress isn't about discovering anything, just extending membership like updating a club roster. i want to audit how far that holds. map out the correspondance: what is the lens, what is the photographer, what counts as being 'in frame,' and what feature of the camera picture quietlly imports the idea that moral norms stay fixed? then there's this niche idea i ran into called normative bootstrapping, where including outsiders actually rewrites the decision rules rather than just adding members. show where the camera analogy breaks once you allow that the rules might shift, and whether the 'just membership' conclusion survives or was being carried by the analogy the whole time. also please separate what's settled about the expanding-circle framework from what's genuinely contested among people who study this -- don't present one side as the consensus. write it in american english. one more thing: i don't need citations or a reading list, i just want the conceptual audit.
