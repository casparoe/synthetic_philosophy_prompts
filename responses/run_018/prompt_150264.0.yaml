prompt: |-
  I'm the new intake coordinator for our tennant union's dispute panel — basically I have to decide which complaints about landlords get forwarded to mediation based mostly on what tenants tell me, often second or third hand. I never thought about epistemology before but now it's my whole job, and I'm trying to build something I can actually run.

  I want a decision procedure grounded in the testimony debate — reductionism vs anti-reductionism — but with a twist I've been playing with: call it "testimonial friction," meaning the resistance a claim meets from the listener's background beliefs and from other available sources. The idea is that anti-reductionists are right that we have a default entitlement to accept testimony, but reductionists are right that this entitlement gets eroded by friction — not just by direct counter-evidence but by internal incoherence, by the speaker's known incentives, and by how "heavy" the claim is (how much it asks us to revise our picture of the situation). I need this turned into an actual checklist my panel can run in about 15 minutes per complaint, with ordered questions, thresholds for "pass," "stop," or "escalate to human judgment," and explicit flags for where values, not facts, take over.

  Don't just lay out options — take a definite stand: should friction be calculated globally for the whole report or locally per individual claim? And can high-friction testimony ever be accepted without independant corroboration? Defend the procedure you build, don't hedge with "it depends on your philosophical commitments."

  Then run it on three cases: (1) a tenant says her landlord entered her apartment without notice, witnessed only by her roommate who told her after the fact; (2) a group of tenants reports the building has black mold, but none have medical training and they all live in the same unit; (3) a single long-time resident claims the management company is systematically overcharging everyone, based on comparing his own bills with neighbors over years. Make sure one comes out in a way I'll probably hate — maybe the mold one gets kicked out despite feeling urgent — and flag exactly where the procedure breaks down or hands off to judgment. Keep it practical, I'm not a philosopher, and don't ask me for citations or a reading list.
reasoning: |-
  Okay, this user is a tenant union intake coordinator facing a real epistemological dilemma in their daily work. They're trying to filter housing complaints using philosophical concepts but need something operational within 15 minutes per case. Interesting challenge - they've even coined their own term "testimonial friction" blending reductionist and anti-reductionist approaches. 

  Hmm... their core tension is between default trust in tenant testimony (anti-reductionism) and necessary skepticism (reductionism). The friction metaphor is clever - like tires gripping reality. But they're drowning in secondhand reports and need concrete thresholds. 

  I notice they specifically want me to take stands, not hedge: global vs local friction assessment? Whether high-friction claims can stand without corroboration? And they want me to deliberately design outcomes they'll dislike - that's refreshingly self-aware. The mold example rejection will probably sting, but demonstrates rigor.

  The practical constraints are brutal: 15 minutes, non-philosophers using this, explicit value flags. Must resist academic tangents. Their three test cases are perfect stress tests - especially the systemic overcharge claim where one tenant's years of data collection might compensate for being a single source.

  ...Building the checklist now. Deciding to assess friction locally per claim rather than globally - because a single bizarre detail shouldn't sink an otherwise solid complaint. But will require aggregating friction scores. Setting the "stop" threshold at 40+ friction points feels right - high enough that wild claims get filtered but not so high that marginalized tenants get silenced. 

  Ah, the values pivot is crucial. When friction hits 30-39 points, we're no longer in pure fact territory - that's where tenant vulnerability and landlord power dynamics enter. Should flag that explicitly in the procedure. For the mold case... yeah, rejecting it will feel wrong but the checklist logic holds: no direct observation, no expertise, clustered sources. Ouch but necessary.

  For the systemic overcharge claim - surprise! It passes because the friction gets offset by the claimant's meticulous records. That's the reductionist counterweight working. User might not expect that outcome but it demonstrates the system's fairness.

  Final note to self: emphasize that this procedure protects both tenants (from false hope) and the panel (from overload) while leaving room for human judgment when friction is medium. The "escalate" zone is where tenant union values legitimately override pure epistemology.
answer: |-
  Here's a streamlined **Testimonial Friction Assessment Protocol (T-FAP)** designed for 15-minute complaint triage, grounded in your framework. It calculates friction **locally per claim** (rejecting global friction) because a single implausible claim shouldn't invalidate an entire complaint, and high-friction claims **can pass without corroboration** if friction is actively reduced by other factors.

  ---

  ### **T-FAP Checklist (Run Per Claim Within Complaint)**
  *Score each factor 0-10 (0=no friction, 10=max friction). Thresholds:  
  ▶ PASS: ≤20 Total Friction  
  ▶ ESCALATE: 21-39 Total Friction  
  ▶ STOP: ≥40 Total Friction*

  1.  **CLAIM HEAVINESS**  
      *How much does this ask us to revise our baseline view?*  
      `0` = Mundane (e.g., "landlord replied late")  
      `5` = Unusual but plausible (e.g., "entered without notice")  
      `10` = Extraordinary (e.g., "deliberately poisoned tenants")  

  2.  **INTERNAL COHERENCE**  
      *Does the claim contradict itself or known facts in the report?*  
      `0` = Logically consistent, aligns with evidence  
      `5` = Minor gaps/inconsistencies  
      `10` = Self-contradictory or physically impossible  

  3.  **SOURCE INCENTIVES**  
      *Could the source gain from falsifying/exaggerating?*  
      `0` = No apparent incentive (e.g., disinterested witness)  
      `5` = Possible incentive (e.g., tenant in rent dispute)  
      `10` = High incentive (e.g., eviction imminent, lawsuit threatened)  

  4.  **SOURCE RELIABILITY**  
      *Direct knowledge? History of accuracy?*  
      `0` = Firsthand + reliable track record  
      `5` = Secondhand or unknown reliability  
      `10` = Hearsay (thirdhand+) or known unreliable  

  5.  **EXTERNAL CONTRADICTION**  
      *Conflict with other evidence/sources?*  
      `0` = Supported by documents/other witnesses  
      `5` = No external data  
      `10` = Contradicted by documents/credible sources  

  6.  **VALUES FLAG**  
      *(Non-scored) Trigger if: Tenant vulnerability (health/safety risk), power imbalance, or systemic injustice alleged.*  

  ---

  ### **Why This Stand?**
  - **Local > Global Friction**: A complaint about mold *and* illegal entry shouldn’t fail because one claim is high-friction. Assess each claim separately.  
  - **Corroboration Not Always Required**: A high-heaviness claim (e.g., discrimination) with low incentives/internal consistency (e.g., meticulous records) can pass. Friction is *dynamic*—it can be reduced by other factors.  
  - **Threshold Defense**: ≤20 friction = default entitlement stands (anti-reductionist core). ≥40 friction = irredeemably unreliable (reductionist filter). 21-39 = values-driven judgment zone.  

  ---

  ### **Case Applications**
  **Case 1: Landlord Entry Without Notice**  
  - *Claim*: Landlord entered apartment unlawfully (witnessed by roommate who told tenant).  
    - **Heaviness**: `5` (Uncommon but plausible)  
    - **Coherence**: `0` (No internal conflict)  
    - **Incentives**: `5` (Possible motive if dispute exists)  
    - **Reliability**: `5` (Secondhand testimony)  
    - **Contradiction**: `0` (No counter-evidence)  
    - **Total Friction**: **15** → **PASS**  
    *Values Flag*: Privacy violation (escalate for urgent mediation).

  **Case 2: Black Mold in Building (Group Complaint, Same Unit)**  
  - *Claim*: Toxic black mold present.  
    - **Heaviness**: `7` (Health risk—requires evidence)  
    - **Coherence**: `0` (Plausible if visible mold described)  
    - **Incentives**: `3` (Group incentive but health motive credible)  
    - **Reliability**: `8` (No expertise; clustered sources = single perspective)  
    - **Contradiction**: `8` (No photos/independent inspection)  
    - **Total Friction**: **26** → **ESCALATE**  
    *Values Flag*: Health/safety risk (panel must judge: Inspect or demand evidence?).  
    ***Why you’ll hate this***: Feels urgent, but friction is high due to lack of expertise and corroboration. Procedure flags it for human judgment—values may override friction.

  **Case 3: Systematic Overcharging (Single Tenant, Long-Time Resident)**  
  - *Claim*: Management overcharges all tenants.  
    - **Heaviness**: `8` (Complex systemic accusation)  
    - **Coherence**: `2` (Consistent if billing patterns documented)  
    - **Incentives**: `5` (Possible motive, but long tenure adds credibility)  
    - **Reliability**: `4` (Firsthand + longitudinal data)  
    - **Contradiction**: `0` (Tenant provides comparative bills)  
    - **Total Friction**: **19** → **PASS**  
    *Values Flag*: Systemic injustice (automatically escalate to full investigation).

  ---

  ### **Where the Procedure Hands Off**
  1. **ESCALATE Zone (21-39 friction)**: Human judgment required. Values flags determine next steps (e.g., "mold" case may proceed despite friction due to health risk).  
  2. **Source Reliability Gaps**: If a claim hinges on an uncorroborated source with `8+` reliability, panel must decide if context justifies trust.  
  3. **Incentive Ambiguity**: High incentives (`8+`) trigger scrutiny even if friction is low—panel assesses sincerity.  

  **T-FAP Advantage**: Cuts through philosophical debate by quantifying friction at the claim level, forcing explicit value judgments only in ambiguous zones. It prevents automatic dismissal of high-stakes claims while filtering frivolous ones.
