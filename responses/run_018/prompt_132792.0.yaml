answer: |-
  1.  **Halfer Perspective:** Halfers maintain Beauty's *initial* credence (before the experiment) of being in the single-copy branch is simply the objective quantum probability (e.g., 50% if decay triggers branching with 50% probability); they argue this credence shouldn't change upon waking since she gains no new information distinguishing the branches.
  2.  **Thirder Perspective:** Thirders argue that upon waking, Beauty should weight her credence by the "number of observer-moments," assigning a credence to being in the single-copy branch equal to the quantum probability of that branch divided by the total expected number of copies (e.g., (50% * 1 copy) / ( (50% * 1) + (50% * 2) ) = 1/3).
  3.  **Quantum Framing Relevance:** The quantum framing doesn't fundamentally alter the self-locating belief argument; the core disagreement persists over whether Beauty's awakening constitutes new, relevant information warranting an update from the prior objective probability.
  4.  **Halfer Stance on Information:** Halfers contend Beauty knew in advance she *would* be awakened and couldn't distinguish the branches upon waking, so the quantum probability remains her rational credence (e.g., 50% for single-copy) regardless of how many copies exist in the other branch.
  5.  **Thirder Stance on Information:** Thirders insist Beauty learns "I am experiencing an awakening *now*," which is more likely to occur in the branch with *more* copies; the quantum probability sets the branch chance, but the number of copies within branches determines the likelihood of *her specific experience*.
