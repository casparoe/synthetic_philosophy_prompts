prompt: |-
  I'm planning a ninety-minute seminar for final-year philosophy students who have covered basic decision theory but not collective-action problems. I want to teach the unilateralist's curse: the structural problem in which any single member of a group can take an action that produces diffuse, irreversible costs and localised benefits, so that actors with the lowest belief-thresholds for net benefit act first, yielding a collective outcome that a majority might have rejected had they been able to coordinate, without any individual having acted irrationally. Do not explain the concept to me; plan the explanation. Which dependency must be secured first — the distinction between individual rationality and collective choice procedures, or the idea of heterogeneous belief thresholds? Choose one carrying example that runs through the session; I am weighing a scenario in which one municipality unilaterally deploys gene-drive mosquitoes to suppress local malaria transmission, while adjacent regions bear ecological risks they never authorised. Assess whether this example carries the structural logic of the curse or whether it collapses it into a free-rider or tragedy-of-the-commons problem. Lay out the exact sequence of ideas, noting what each step presupposes. Map the misconceptions these students will predictably form — I anticipate they will read it as a variant of the prisoner's dilemma, or suppose that perfect information-sharing resolves the asymmetry — and specify at which point in the sequence each misconception should be defused. Provide one closing question that reveals whether they understand the threshold asymmetry itself rather than merely the bioethical surface of the example. Finally, say explicitly which element of the classic framing — the proposed principle of conformity — should be set aside at this level and why it would distract from the structural point.
reasoning: |-
  Okay, the user is planning a 90-minute seminar on the unilateralist's curse for final-year philosophy students familiar with basic decision theory but not collective-action problems. They want a structured plan without explaining the concept itself. Let me break down their requirements.

  First, the dependency between individual rationality vs. collective procedures versus heterogeneous belief thresholds. The user wants to know which should come first. The core of the curse is the threshold asymmetry driving the action. Without establishing that actors have different thresholds for action, the rest doesn't hold. If we start with collective choice, students might default to thinking it's just about coordination failures. So prioritizing heterogeneous thresholds is key to prevent that misconception.

  Next, the gene-drive mosquito example. The user is concerned whether this might collapse into free-rider or tragedy-of-the-commons problems. Need to assess that. In the gene-drive case, one municipality acts based on their low threshold for net benefit, imposing risks on others. The benefits are local, costs diffuse. Unlike free-rider, the actor isn't avoiding costs but imposing them. Unlike tragedy of the commons, it's not about resource depletion but irreversible actions taken unilaterally. The key is that the actor genuinely believes it's beneficial, but others have higher thresholds. So it fits the curse structure.

  Now, the sequence of ideas. Start with the gene-drive scenario to ground the discussion. Then introduce the threshold asymmetry explicitly. Highlight that actors act when their threshold is met, and the lowest-threshold actor moves first. Only after that, contrast with collective decision-making. This order prevents misinterpreting as coordination failure. Then demonstrate the curse outcome without irrationality. Finally, compare to other collective problems to clarify distinctions.

  Predictable misconceptions: Students might think it's a prisoner's dilemma where defection is optimal. Need to debunk that by showing no payoff matrix and that all actors are cooperating in their own view. Another misconception is that perfect information solves it, but actually, even with info, thresholds differ, so the curse persists. Address these after explaining the threshold asymmetry to prevent early confusion.

  Closing question: Need one that tests understanding of threshold asymmetry, not just the example. Asking why the curse persists even if all information is shared would reveal if they grasp that thresholds differ regardless of information.

  The principle of conformity: Mentioned in classic literature but might distract. Students might think it's about conformity pressure, but the curse is structural. Set it aside to focus on the threshold mechanism.

  Also, the user's deeper needs: They want students to grasp the structural logic without conflating it with other problems. They might be preparing for discussions on real-world policies where unilateral actions occur, like environmental interventions. Ensuring the example is clear and misconceptions addressed will help students apply the concept accurately.
answer: |-
  Here’s a structured 90-minute seminar plan targeting your specifications:

  ---

  ### **Core Dependency: Secure FIRST**
  **Heterogeneous belief thresholds** must precede the individual/collective distinction.  
  *Why?* The curse’s engine is actor asymmetry. Without establishing thresholds, students default to rational choice paradigms (e.g., "all actors weigh costs identically"), collapsing the logic into coordination problems.

  ---

  ### **Carrying Example: Gene-Drive Mosquitoes**  
  **Assessment**: Fits the curse *structurally*, not free-rider/tragedy.  
  - **Curse Logic**: One municipality (low-threshold actor) unilaterally deploys tech believing benefits > risks. Adjacent regions (higher-threshold actors) bear irreversible ecological costs without consent. No actor is irrational; collective rejection is possible.  
  - **Not Free-Rider/Tragedy**: No incentive to *withhold* effort (free-rider) or *overuse* a commons (tragedy). The problem is *preemptive action by the most permissive*, not resource competition.  

  ---

  ### **Sequence of Ideas (90 min)**
  1. **Hook & Concrete Setup (10 min)**  
     - *Present*: Gene-drive mosquito scenario.  
     - *Presupposes*: Basic cost-benefit analysis.  
     - *Ask*: "If Municipality A acts alone, is this rational? What about ethical?"  

  2. **Threshold Heterogeneity (20 min)**  
     - *Define*: Belief thresholds (net benefit required to act).  
     - *Illustrate*: Three municipalities with thresholds:  
       - **Low** (60% confidence): Acts if malaria risk ↓ > ecological risk ↑.  
       - **Medium** (80%): Requires stronger evidence.  
       - **High** (95%): Demands near-certainty.  
     - *Key Point*: Thresholds vary due to risk aversion, values, expertise.  
     - *Preempt Misconception*: Contrast with PD (no "defection" payoff; actors share goals).  

  3. **The Curse Mechanism (25 min)**  
     - *Show*: Lowest-threshold actor acts first → irreversible costs imposed.  
     - *Emphasize*: No irrationality—each acts when *their* threshold is met.  
     - *Contrast*: Collective procedure (e.g., majority vote) would reject deployment.  
     - *Preempt Misconception*: "Perfect info-sharing doesn’t equalize thresholds" (e.g., same data → different risk valuations).  

  4. **Collective vs. Individual Rationality (15 min)**  
     - *Clarify*: Collective suboptimality ≠ individual error.  
     - *Diagram*:  
       ```  
       Individual: Rational if Benefitᵢ > Costᵢ  
       Collective: Suboptimal if Σ(Benefits) < Σ(Costs)  
       ```  
     - *Preempt Misconception*: "This is just voting paradoxes" → Stress *irreversibility* and *asymmetric action capacity*.  

  5. **Comparison Pitfalls (10 min)**  
     - *Contrast*:  
       - **Tragedy of Commons**: Depletion from *many* actors’ self-interest.  
       - **Curse**: *One* actor triggers diffuse costs.  
     - *Reinforce*: Unilateralism’s distinct danger—no collective "restraint" mechanism.  

  6. **Bioethics Debate (5 min)**  
     - *Provocation*: "Should low-threshold actors be restrained? Who decides thresholds?"  

  ---

  ### **Predictable Misconceptions & Defusal Points**  
  | Misconception | Defusal Point | Counter-Tactic |  
  |---------------|--------------|---------------|  
  | "It’s a Prisoner’s Dilemma!" | After Step 2 (Thresholds) | Show absence of mutual defection incentive; actors aren’t conflicted. |  
  | "Perfect information fixes this" | Step 3 (Curse Mechanism) | Use threshold variation: "Even with identical data, would all act at 60% confidence?" |  
  | "Just regulate risky actions" | Step 4 (Collective vs. Individual) | Note: *Defining* "risk" assumes threshold consensus—which is the problem. |  

  ---

  ### **Closing Question**  
  **"If all municipalities shared identical information about risks/benefits, would the curse still occur? Why?"**  
  - *Tests threshold asymmetry*: Correct answer is **yes**—heterogeneous thresholds persist absent value/risk-aversion alignment.  

  ---

  ### **Element to Set Aside: Principle of Conformity**  
  - **Why Distracting?** Classic framings (e.g., Bostrom) suggest "act only if unanimous support." This imports *normative* debate about legitimacy, diverting focus from the *positive* structural asymmetry. At this level, emphasize diagnosis, not prescription.  

  ---

  **Flow Summary**:  
  Concrete example → Threshold asymmetry → Curse mechanics → Collective-individual gap → Misconception cleanup → Threshold-centric close.  
  **Time Buffer**: 5 min for Q&A transitions.
