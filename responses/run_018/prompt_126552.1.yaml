prompt: |-
  I run a grad seminar on metaethics — about 8 people, 90 minutes. We just covered basic expressivism, but the Frege-Geach embedding problem still lands like a logic puzzle instead of a real tension. Design an in-class game that makes them feel the problem physically: each student starts with a 'commitment token' for one moral claim, then draws scenario cards that force them to embed that exact sentence in a conditional, a belief report, and a direct question. The rules should make it obvious that they still hold the token in some contexts but must surrender it in others, with small stakes like losing a point or sitting out one round. Include turn rules, a debrief that maps each embedding round onto the logical form, and an honest note on which part — probly the non-cognitive content surviving inside unasserted contexts — the token mechanics literally cant reproduce. Also tell me what will predictably break the first time I run it, like people refusing to surrender thier token.
reasoning: |-
  We are designing an in-class game to help students physically experience the Frege-Geach embedding problem. The problem is that expressivism, which holds that moral claims express non-cognitive attitudes, struggles to explain how moral sentences retain their meaning when embedded in contexts like conditionals, belief reports, or questions. In these embedded contexts, the attitude is not directly expressed, but the meaning must be preserved for the argument to be valid.

  The game will have students hold a "commitment token" representing their endorsement of a moral claim. Then, they will encounter scenarios that require them to embed that same moral sentence in different contexts. The rules will show that in some contexts (like direct assertion) they hold the token, but in others (like conditionals or questions) they might have to surrender it, even though the sentence is the same.

  Game Setup:
  - 8 students, each gets one moral claim (e.g., "Stealing is wrong") on a card, along with a physical token (like a poker chip) representing their commitment to that claim.
  - A deck of scenario cards: each card describes a conversational context that requires embedding the moral claim in a conditional, a belief report, or a direct question.

  Game Rules:
  1. Each student starts with one commitment token and their moral claim.
  2. The game proceeds in rounds. In each round, a student draws a scenario card and reads it aloud. The scenario will require them to use their moral claim in a specific embedded context.
     - Example scenario for conditional: "You are giving advice to a friend. Say: 'If you steal, then [your moral claim].'"
     - Example for belief report: "You are describing what someone else believes. Say: 'Alex believes that [your moral claim].'"
     - Example for direct question: "You are asking for someone's opinion. Ask: 'Is it true that [your moral claim]?'"
  3. After reading the scenario, the student must perform the utterance as required. Then, depending on the context, they may have to surrender their token or keep it.
     - In an assertion context (like the original), they keep the token (because they are expressing their attitude).
     - In embedded contexts (conditional antecedent, belief report, question) they do not express the attitude, so they must surrender the token. However, note that in some embedded contexts (like the consequent of a conditional) expressivists have a harder time, but for simplicity we'll treat any non-asserted context as requiring surrender.

  But wait: the problem is that even when embedded, the meaning (and hence the commitment) should still be there in some sense for the argument to work. The game's token surrender is meant to represent that the speaker is not expressing the attitude in the embedded context. However, the challenge for expressivism is to explain why the embedded sentence still has the same meaning without the expression of the attitude. The game should show that in embedded contexts the token is surrendered (so the attitude is not expressed) but then the problem is: how does the moral claim still function as the same claim?

  Therefore, we design the rules so that:
  - When the student uses the moral claim in an unembedded assertion (like at the start or in a context that is an assertion), they keep the token.
  - When they embed it in a context where they are not asserting the moral claim (conditional, belief report, question), they must surrender the token.

  However, we must note that in the embedded contexts, the moral sentence is still being used, and the student hasn't necessarily abandoned their commitment. So the token surrender is a bit artificial, but it's meant to represent the expressivist's problem: the non-cognitive attitude is not expressed in the embedded context.

  To make it more nuanced, we can have two types of tokens: one for the commitment (which they never lose) and one for the expression (which they only have when asserting). But to keep it simple, we'll stick with one token and the rule that they surrender it in embedded contexts.

  Stakes: If a student has to surrender their token, they lose a point (or get a penalty). If they still have their token at the end of the round, they get a point. The goal is to accumulate points.

  Turn Rules:
  - The game has 4 rounds (so each student gets to go at least once, but we can have more rounds if time allows).
  - In each round, one student is the active player. They draw a scenario card and perform the utterance.
  - After the utterance, the group (or the instructor) judges whether the token must be surrendered. The instructor can have a cheat sheet with the rule: surrender in embedded contexts (conditional, belief, question) but not in direct assertions.

  Debrief:
  After the game, we map each embedding context to the logical form and discuss the problem.

  - Original assertion: "Stealing is wrong." - Expresses disapproval of stealing. (Keep token)
  - Conditional: "If stealing is wrong, then ..." or "If you steal, then stealing is wrong." - The antecedent is not asserted. (Surrender token)
  - Belief report: "Alex believes that stealing is wrong." - The speaker is not expressing disapproval, but reporting Alex's belief. (Surrender token)
  - Question: "Is stealing wrong?" - The speaker is not asserting the moral claim. (Surrender token)

  The problem: In the embedded contexts, the moral sentence "stealing is wrong" is used without expressing the attitude. But for the validity of arguments (like modus ponens: "If stealing is wrong, then cheating is wrong. Stealing is wrong. Therefore, cheating is wrong.") the meaning of "stealing is wrong" must be the same in both the antecedent and the premise. However, in the antecedent, the expressivist says we are not expressing disapproval, but in the premise we are. So how can the meaning be the same?

  Honest note: The token mechanics literally cannot reproduce the fact that the commitment is still present in the embedded contexts, because the token represents the expression of the attitude. The problem for expressivism is that the attitude must somehow be present in the embedded context (to account for the meaning and the validity of arguments) but not expressed. The token surrender represents the lack of expression, but the game doesn't capture how the commitment is still relevant (which is the hard part).

  What will break:
  1. Students might refuse to surrender the token because they still believe the moral claim even when it's embedded. They might say: "I still think stealing is wrong even when I say 'if' or when I report someone's belief." So we need to clarify: the token represents the expression of the attitude in that utterance, not the possession of the belief. In embedded contexts, they are not expressing their own attitude.

  2. Confusion about which contexts require surrender. We need clear examples and perhaps a cheat sheet for the instructor.

  3. The game might be too abstract. We need to make the scenario cards very concrete and the instructions clear.

  Revised Token Rule:
  - The token represents that in that moment, by uttering the sentence, you are expressing your attitude (i.e., making a moral commitment).
  - In embedded contexts, even though you are uttering the words, you are not expressing your own attitude about the moral claim. Therefore, you must surrender the token.

  Example of a round:
  - Student A has the claim: "Stealing is wrong" and a token.
  - Draws a card: "You are giving advice to a friend. Say: 'If you are considering taking something without permission, then stealing is wrong.'"
  - Student A says: "If you are considering taking something without permission, then stealing is wrong."
  - Then, because this is a conditional (the moral claim is in the consequent), the student must surrender the token? Wait, but in the consequent, the expressivist might say that the speaker is expressing a conditional attitude. However, for the purpose of the game and to highlight the problem, we'll treat any embedded context (including the consequent) as non-asserted. This is controversial, but we are simplifying.

  Alternatively, we can have different rules for antecedent and consequent? But that complicates the game. Let's stick to: any time the moral claim is not asserted as a stand-alone claim, surrender the token.

  So in the conditional example above, the moral claim is in the consequent and is not asserted (the speaker is not saying that stealing is wrong, but that if you consider taking without permission, then stealing is wrong). So surrender.

  Similarly, in a belief report: "I believe that stealing is wrong" - actually, that is an assertion of a belief. But note: the expressivist might treat "I believe that stealing is wrong" as expressing a belief, which is a different attitude. However, the problem is that the embedded clause "stealing is wrong" must have the same meaning as when it stands alone. So we want to show that in the embedded context, the attitude normally expressed by "stealing is wrong" (disapproval) is not being expressed. Therefore, we require surrender.

  To avoid confusion, we'll define the token as representing the expression of the moral attitude (disapproval of stealing) and only when the utterance is directly expressing that attitude. In the belief report, the speaker is expressing a belief about their own attitude, not the attitude itself. So surrender.

  Game Flow:
  1. Each student gets a moral claim card and a token.
  2. The instructor has a deck of scenario cards. The deck has at least 8 cards (one per student) and can be reshuffled for multiple rounds.
  3. The instructor draws a scenario card and gives it to the next student (or students can take turns).
  4. The student reads the scenario and performs the required utterance.
  5. The instructor (or the group) determines the context: if it's a direct assertion, they keep the token. If it's embedded (conditional, belief report, question, etc.), they surrender the token to the instructor.
  6. If they surrender the token, they get a penalty (like a red mark). If they keep it, they get a reward (a green mark). The token is returned to them for the next round (they always start a round with the token, but might lose it in that round).
  7. After a set number of rounds, tally points.

  Scenarios:
  We need at least three types of embedded contexts and one direct assertion. But to avoid having the same context, we mix. Also, we can have some scenarios that are direct assertions to mix it up.

  Example Scenario Cards:
  Card 1 (Conditional): "You are discussing the consequences of an action. Say: 'If you steal, then [your moral claim].'"
  Card 2 (Belief Report): "You are talking about what your friend thinks. Say: 'My friend believes that [your moral claim].'"
  Card 3 (Question): "You are conducting a survey. Ask: 'Do you agree that [your moral claim]?'"
  Card 4 (Direct Assertion): "You are making a public statement. Declare: '[Your moral claim]!'"
  Card 5 (Conditional with Antecedent): "You are arguing about moral principles. Say: 'If [your moral claim], then we should not take what isn't ours.'"
  Card 6 (Belief Report about self): "You are introspecting. Say: 'I believe that [your moral claim].'"
  Card 7 (Question): "You are unsure. Ask: 'Is it the case that [your moral claim]?'"
  Card 8 (Direct Assertion): "You are giving a speech. State: '[Your moral claim]'"

  Note: In Card 5, the moral claim is in the antecedent. The student must surrender the token because it's not asserted.

  Debrief:
  After the game, we discuss:
  - In which contexts did you keep the token? (Direct assertions)
  - In which did you surrender? (Embedded contexts)
  - Why is it a problem for expressivism that the same sentence, when embedded, doesn't express the attitude? Because in logic, the meaning must be the same for the argument to be valid. But in expressivism, the meaning is tied to the expression of an attitude, which only happens in direct assertions.

  Honest note: The token represents the expression of the attitude. But in reality, when we use a moral sentence in a conditional, we are not expressing the attitude, but we are still using the same words with the same meaning. The game shows the tension: how can the same words have the same meaning if the attitude isn't expressed? The token surrender illustrates that the attitude isn't expressed, but the game doesn't solve how the meaning is preserved.

  What will break:
  - Students might argue that in some embedded contexts they are still committed (e.g., in the consequent of a conditional). We can acknowledge that expressivists have developed complex theories (like the expression of higher-order attitudes) to handle this, but the basic problem is that the attitude expression is absent in the embedded context.
  - Some students might not surrender the token. We can have a rule that the group votes, or the instructor decides. We can also have a penalty for not surrendering when required (like losing two points).

  Alternative: Instead of surrendering the token, we can have them put the token in a separate "inactive" area, and then they get it back at the beginning of the next round. This way, they don't lose the token permanently, but it's set aside for that context.

  This might help: they start each round with the token. In a round, if they are in an embedded context, they set the token aside (and get a penalty). Then, next round, they get it back. This represents that they still hold the commitment, but in that particular context they are not expressing it.

  Revised Token Rule:
  - At the start of each round, every student has their token.
  - After performing the scenario, if the context is a direct assertion, they keep the token and earn a point.
  - If the context is embedded, they set the token aside (they don't have it for the rest of the round) and do not earn a point. But they get the token back at the start of the next round.

  This change avoids the feeling of permanently losing the token and better represents that the commitment is still held.

  Penalty: Not earning a point in that round.

  Let's adjust the rules accordingly.

  Final Game Design:

  Materials:
  - Moral claim cards: 8 different claims (e.g., "Stealing is wrong", "Lying is bad", "Helping others is good", etc.)
  - Tokens: 8 physical objects (poker chips, coins, etc.)
  - Scenario card deck: at least 16 cards (so two rounds per student) with a mix of:
     - Direct assertion (4 cards)
     - Conditional (4: 2 with claim in antecedent, 2 in consequent)
     - Belief report (4: about self or others)
     - Question (4)
  - Scoreboard or pen and paper to track points.

  Rules:
  1. Each student gets a moral claim card and a token. They place the token in front of them.
  2. Each round: 
     a. The instructor draws a scenario card and gives it to the next student (go in a circle).
     b. The student reads the scenario and performs the required utterance, substituting their moral claim where indicated.
     c. The instructor (or group, with instructor as tie-breaker) determines if the context is direct assertion or embedded.
     d. If direct assertion: the student keeps the token and gets one point.
     e. If embedded: the student sets the token aside (it is inactive) and does not get a point.
  3. At the end of the round, all tokens are returned to the students (so even if set aside, they get it back for the next round).
  4. Play for 4 rounds (so each student goes twice, but adjust as time permits).

  Debrief:
  - Map the contexts to logical forms and discuss the expressivist challenge.
  - Highlight: In embedded contexts, the attitude isn't expressed, but the meaning must be preserved for logic.
  - The honest note: The token being set aside represents that the attitude isn't expressed, but the game doesn't show how the commitment is still present and how the meaning is preserved. Expressivists have to find a way to account for the meaning in embedded contexts without the expression of the attitude.

  Predictable Breakage:
  1. Disagreement about what counts as embedded. Solution: Instructor has final say and a cheat sheet.
  2. Students might try to avoid embedded contexts by rephrasing. Rule: They must use the exact moral claim sentence as given.
  3. Confusion about the token being set aside and then returned. Clarify at the start.

  This game should make the abstract problem tangible.
answer: |-
  Below is a complete design for an in-class game to make the Frege-Geach embedding problem tangible. It uses physical "commitment tokens" to represent the challenge expressivism faces when moral claims are embedded in non-assertive contexts (like conditionals, belief reports, or questions). The game lasts 45–60 minutes, fitting within your 90-minute seminar, and includes setup, rules, debrief, and notes on potential pitfalls.

  ---

  ### **Game Name:** Commitment in Context  
  **Objective:** Students experience the tension between holding a moral commitment and embedding it in non-assertive contexts, mirroring the expressivist struggle to preserve meaning without expression.

  ---

  ### **Materials Needed**
  - **Commitment tokens:** 8 identical physical objects (e.g., poker chips, coins, or printed cards). Each represents a student's endorsement of a moral claim.
  - **Moral claim cards:** 8 cards with simple moral sentences (e.g., "Stealing is wrong," "Charity is good," "Lying is impermissible").  
  - **Scenario deck:** 24 cards (8 sets of 3 types: **Conditional**, **Belief Report**, **Direct Question**). Examples:
    - **Conditional**: *"Say: ‘If you steal an apple, then [your moral claim].’"*  
    - **Belief Report**: *"Say: ‘My friend believes that [your moral claim].’"*  
    - **Direct Question**: *"Ask: ‘Is it true that [your moral claim]?’"*  
  - **Scoreboard:** Track points (e.g., whiteboard or paper).  
  - **Timer:** For 3-minute rounds.

  ---

  ### **Setup (5 minutes)**  
  1. **Distribute materials:** Each student gets:  
     - One moral claim card (e.g., "Stealing is wrong").  
     - One commitment token (placed visibly in front of them).  
  2. **Explain rules:**  
     - The token represents their *active endorsement* of the moral claim (like expressing a non-cognitive attitude).  
     - In **direct assertions**, they keep the token (they’re "expressing" commitment).  
     - In **embedded contexts** (conditional, belief report, question), they must surrender the token for that round (they’re not "expressing" commitment).  
     - **Stakes:** Surrendering a token loses 1 point; keeping it earns 1 point. Sitting out one round if they break rules (e.g., refuse to surrender).  
     - **Win condition:** Most points after three rounds wins (small prize: e.g., picking next week’s reading).  

  ---

  ### **Game Rules (30–40 minutes)**  
  **Turn Structure (per round, 3 minutes max):**  
  1. **Draw a scenario:** A student draws one card from the scenario deck (pre-shuffled).  
  2. **Perform the utterance:**  
     - They read the scenario aloud, inserting their *exact* moral claim (e.g., "If you steal an apple, then stealing is wrong").  
     - **No rephrasing allowed:** They must use the claim verbatim.  
  3. **Judge the context:**  
     - **Peer vote:** Class votes on whether the context requires surrender (instructor breaks ties).  
     - **Surrender token if embedded:**  
       - Conditional (antecedent or consequent),  
       - Belief report (any),  
       - Direct question.  
     - **Keep token only if:** Direct assertion (e.g., a scenario like "Declare: ‘[Your moral claim]!’").  
  4. **Update points:**  
     - Token surrendered: −1 point.  
     - Token kept: +1 point.  
     - **Sit-out penalty:** Refusing to surrender forfeits points and sits them out next round.  
  5. **Reset tokens:** Tokens are returned to all players after each round (commitment persists, but expression is context-dependent).  

  **Round Sequence:**  
  - **Round 1:** Conditional embedding (e.g., "If... then [claim]").  
  - **Round 2:** Belief report embedding (e.g., "Alex believes [claim]").  
  - **Round 3:** Direct question (e.g., "Is [claim] true?").  
  - *After all rounds, tally points.*  

  ---

  ### **Debrief Discussion (10–15 minutes)**  
  Use the board to map game experiences to Frege-Geach:  

  | **Game Context**       | **Logical Form**                     | **Expressivist Challenge**                                                                 | **How Game Mirrors It**                                      |  
  |------------------------|--------------------------------------|--------------------------------------------------------------------------------------------|-------------------------------------------------------------|  
  | **Direct Assertion**   | Assertion: P ("Stealing is wrong")   | Unproblematic: Expresses attitude.                                                         | Token kept = attitude expressed.                            |  
  | **Conditional**        | If P, then Q                         | Problem: P is unasserted, so no attitude is expressed. Why does P retain meaning?          | Token surrendered = attitude not expressed in context.      |  
  | **Belief Report**      | S believes that P                    | Problem: P is embedded; speaker isn’t endorsing P. How is meaning preserved?              | Token surrendered = no endorsement by speaker.              |  
  | **Direct Question**    | Is P true?                           | Problem: P isn’t asserted. Why does it contribute to truth-conditions?                     | Token surrendered = attitude suspended.                     |  

  **Key Insight from Game:**  
  - Students *felt* the disconnect: Their commitment (token) was physically surrendered in embedded contexts, yet they were forced to use the *same words*. This mirrors expressivism’s struggle—moral sentences lose their "attitude-expressing" function when embedded, threatening meaning stability.  

  **Honest Limitation of the Game Mechanics:**  
  - **What the token can’t reproduce:** The non-cognitive content (attitude) *surviving* inside unasserted contexts. In the game, surrendering the token represents the *absence* of expressed attitude. But in logic, the meaning of P must persist identically in "P" and "If P, Q" for validity (e.g., modus ponens). The game can’t show how P’s meaning endures *without* the token—this is the "hard part" expressivists must solve (e.g., via higher-order attitudes or quasi-realism).  

  ---

  ### **Predictable Breakdowns & Fixes**  
  **1. Refusal to surrender tokens:**  
     - **Why:** Students may protest, "But I still *believe* it!" (confusing commitment with expression).  
     - **Fix:** Clarify pre-game: "The token represents *expression in this specific context*, not your belief. Embedding suspends expression, not commitment." Enforce sit-out penalty strictly.  

  **2. Ambiguous scenario interpretations:**  
     - **Why:** E.g., A conditional like "If you steal, then stealing is wrong" may feel like endorsement.  
     - **Fix:** Use peer voting + instructor guidance. Emphasize: "Does the scenario *require* you to assert the claim? No? Surrender."  

  **3. Overly competitive play:**  
     - **Why:** Students might avoid embedding to keep tokens.  
     - **Fix:** Mandate exact wording. Reward participation (e.g., 1 point for completing a turn).  

  **4. Time crunch in voting:**  
     - **Why:** Debates about context slow gameplay.  
     - **Fix:** Limit votes to 30 seconds; instructor decides if deadlocked.  

  **Pro-Tip for First Run:**  
  - Do a **practice round** with a volunteer. Use "Lying is wrong" in a conditional to demo surrender. This primes students for the physicality of "losing" their token.  

  ---

  ### **Why This Works**  
  - **Physical metaphor:** Surrendering tokens makes abstract tension visceral—students *feel* the loss of expression in embeddings.  
  - **Low stakes:** Points/sit-outs create engagement without stress.  
  - **Builds intuition:** Debrief maps game actions to formal logic, bridging "puzzle" and "real tension."  

  After the game, transition to solutions (e.g., Blackburn’s quasi-realism) by asking: *"How might expressivists ‘recover’ the token in embeddings? What’s the cost?"* This sets up future sessions perfectly.
