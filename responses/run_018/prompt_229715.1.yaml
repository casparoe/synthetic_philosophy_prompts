  Below is a decision tree designed to classify a fictional setting's temporal ontology based solely on observable plot and narrative elements. The tree uses seven yes/no questions (with no path exceeding three questions) and avoids metaphysics terminology. The leaves cover presentism, eternalism, growing block, moving spotlight, and shrinking block. One leaf (incoherent view) is marked as empty. If two positions cannot be separated by plot alone, it is explicitly noted.

  ### Decision Tree for Temporal Ontology
  1. **Can characters observe or interact with past events as they were (not as recordings, simulations, or memories), implying the past still exists in some form?**  
     - **Yes** → Go to 2A.  
     - **No** → Go to 2B.  

  2A. **Can characters observe or interact with future events as they will be (not as predictions or possibilities), implying the future already exists in some form?**  
     - **Yes** → Go to 3A.  
     - **No** → **Growing block** (past and present exist; future does not).  

  2B. **Can characters observe or interact with future events as they will be (not as predictions or possibilities), implying the future already exists in some form?**  
     - **Yes** → **Shrinking block** (future and present exist; past has ceased to).  
     - **No** → Go to 3B.  

  3A. **Is there an objective, universal "now" that moves (e.g., time "flows" for the cosmos, not just for individuals; a privileged present is highlighted in narration or devices)?**  
     - **Yes** → **Moving spotlight** (all times exist, but one is objectively present and moves).  
     - **No** → **Eternalism** (all times exist equally; no privileged "now").  

  3B. **Can the past be altered or erased (e.g., via time travel, magic, or technology), changing what "happened"?**  
     - **Yes** → **Empty node (incoherent view)**: The past cannot be altered if it does not exist (per Q1). This combination is logically impossible.  
     - **No** → **Presentism** (only the present exists; past and future are unreal).  

  ### Key Notes
  - **Unseparable Positions**: Growing block and presentism cannot be directly distinguished if a story lacks time travel or past/future observation. Growing block requires the past to exist (Q1=Yes), while presentism requires it not to (Q1=No). If Q1 is ambiguous (e.g., past is treated as "real" but unobservable), the key extra fact is whether the past is *accessible* (e.g., via devices or travel). If accessible, it suggests growing block; if inaccessible, presentism.
  - **Empty Node**: The "incoherent view" leaf (Q1=No, 2B=No, 3B=Yes) is empty because altering the past requires it to exist (contradicting Q1). This is incoherent, not merely unexplored or unattractive.
  - **Question Design**: Questions are based on plot-observable elements (e.g., what time machines can visit, whether prophecies fail, how past alterations work). No metaphysics terms (e.g., "block universe") are used in the questions.

