answer: |-
  My dear and honored Councillor —  

  Your letter finds me in the solitude of Mont-Louis, where the rustling leaves and the distant chime from the village church are my chief companions. I confess your proposal stirs me more than I anticipated. You have read me with uncommon care, and your counter-offer is shrewdly crafted to evade the traps I laid for the professional stage. No salaried actors? No actresses? No comic buffoonery or amorous intrigues? Performed but once a year, in God’s open air, by citizens themselves? This is no *Théâtre de Genève*; it is, as you say, nearer to the public festival I praised. You tempt me toward approval.  

  And yet.  

  Consider the nature of your spectacle. Two hundred citizens—men and boys—*perform a play*. They do not *be* Tell or the defenders of the Escalade; they *imitate* them. They speak words composed by another, move as directed, assume a character not their own. Here lies the serpent in your republican garden. Imitation itself, when it becomes a formal act divorced from spontaneous expression, invites comparison, judgment, and the poison of *amour-propre*.  

  You ask why the citizen who *watches* Tell is not corrupted, while the one who *plays* him risks being so. Ah! The spectator at your Plainpalais gathering is stirred by the *deed* of Tell, by the memory of Genevan valor made vivid. His heart swells with patriotic fire; he sees not an actor, but the *idea* of his own potential courage reflected. This is wholesome. It is the same spirit that animates our festivals—where citizens dance, sing, bear arms, or feast *as themselves*, expressing shared joy and unity without pretense.  

  But the citizen who *plays* Tell? He steps onto a stage (though it be grass) before an audience. He must, for those hours, *manufacture* virtues not his own. He studies gestures, modulates his voice, calculates effects. His mind dwells not on the meaning of Tell’s sacrifice, but on whether he *appears* brave, whether his delivery *moves* the crowd, whether he is *admired*. This is the actor’s vice—even when unpaid, even when well-intentioned. It turns virtue into a performance, and the performer into an object of scrutiny. His soul divides: part is Tell, part is himself watching himself *be* Tell. This duality is fatal to the simplicity of a true citizen.  

  Worse still—you speak of prizes! Magistrates distributing honors for the best portrayal? My dear Sir, have you forgotten my Dedication to the Republic of Geneva? "Where all do their duty... no one needs to seek distinction by doing it better than others." To rank citizens in the mimicry of virtue? This is not emulation; it is the cultivation of envy and vanity. It invites men to chase applause, not goodness.  

  So: I cannot condemn your proposal absolutely. It dodges the worst corruptions of Paris. It is public, infrequent, and free of professional cunning. But it remains *representation*, not *participation*. Why not, instead, a true festival? Let the whole city gather on the Plainpalais. Let them raise their voices in our hymns, swear oaths to liberty, march in ranks as the militia does. Let fathers tell sons of the Escalade not through scripted speeches, but as living witnesses passing on a sacred history. Let there be games of strength and skill—races, wrestling, shooting at the mark—where the *actual* prowess of citizens is displayed, not borrowed. Then feast together, not as audience and performers, but as one body, equal and undivided.  

  There, imitation vanishes. There is only the citizen, fully present in his own actions, bound to his neighbors by shared feeling, not spectacle. *That* is the festival I champion. If you strip away the stage, the script, and the prizes—if the citizens *live* the commemoration rather than *acting* it—then, yes, you have my blessing. Until then, your clever imitation remains... an imitation. And Geneva deserves the substance.  

  I remain, with respect for your intentions and faith in your love for our Republic—  

  Your servant,  
  J.-J. Rousseau  

  *(Sealed with a plain wafer, the ink slightly smudged by a hasty sand-shaker)*
