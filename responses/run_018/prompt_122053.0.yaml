prompt: |-
  I work in infrastructure at a small AI lab and sit in on an alignment reading group. I have no formal philosophy background, so please make the machinery explicit rather than relying on the names of positions I am probably mangling.

  Last week the group got onto acausal trade: the case of two agents who can never exchange a signal — because they sit in causally disconnected regions of spacetime, or in different branches, or one is a simulation running inside the other's model of the world — each deciding whether to pay a real cost to benefit the other, on the grounds that the two decisions are correlated not by causation but by something like logical or algorithmic dependence: both agents are, in the relevant sense, computing the same decision procedure, so if I cooperate, a sufficiently similar counterpart cooperates too.

  Our most theory-minded member said the whole topic is much less exotic than it sounds, because it is really just program equilibrium. His picture: two players submit programs to a referee instead of choosing actions directly. Each program is handed the other program's source code as input and must output cooperate or defect. The referee runs both once, together, with no communication between them. Because a program can inspect the other's source, it can implement something in the neighbourhood of cooperate if and only if I can verify that the other program cooperates with a program with my source; there are fixed points in which both programs cooperate; and so the prisoner's dilemma is dissolved without any causal influence running between the players. He drew two conclusions. The first is deflationary: the acausal in acausal trade is doing no work, what we have is an ordinary mechanism-design result with a self-referential trick in it, and any decision rule that handles the tournament correctly is simply whatever engineering works — no contested theory of rational choice required. The second is practical and aimed at my team: if we want a future system to be able to trade with us acausally, or to be able to predict that we will cooperate with it, then what matters is not adopting some disputed decision theory but publishing a legible, machine-checkable description of our agent's decision procedure — open weights, a formal specification of the policy, a signed commitment that the deployed artifact hashes to the published spec, that kind of work.

  A second member pushed the opposite way. In the tournament, he said, the correlation between the two outputs is thoroughly causal: a referee executes both programs, each program literally reads the other's text, the dependence has an ordinary common cause, and both players are guaranteed to exist, to face the same payoff matrix, and to be written in a notation the other can parse. In real acausal trade — us and a civilization we will never see, or us and a counterpart in another branch — none of that is on offer. So the analogy quietly imports precisely the channel that was supposed to be absent, and it supports neither conclusion.

  I find both stories plausible, and I have a budget question hanging on this, so I would like an actual audit rather than a verdict.

  Please give me: the mapping stated explicitly, as a table of correspondences if that is clearest — what plays the role of the referee, of the submitted program, of the source inspection, of the payoff matrix, of simultaneity, of the self-referential trick by which each program reasons about itself as seen from outside, and of the fixed point; then a separation of the disanalogies that are load-bearable for his two conclusions from the ones that are noise. In particular I want to know what features of the tournament the analogy smuggles into the target: a trusted executor, a shared syntax, guaranteed existence of the counterparty, symmetry of predictive power, full transparency, common authorship or common code.

  I also want three complications addressed, because I suspect they are where the argument actually lives.

  First, a variant I invented and cannot evaluate: a one-way tournament. A publishes its source and B can read it; B's source is sealed, and A receives only a signed commitment — a hash of B's program plus a machine-checkable proof that B cooperates with any program that cooperates with it, produced without revealing the source. Does cooperation still get off the ground when legibility runs in one direction only? If it does not, does that show the tournament needs a common cause that genuine acausal trade lacks? And what would that imply about the case I actually care about, where a far more capable system can predict us and we cannot predict it?

  Second, existence uncertainty. In the tournament both players certainly exist and certainly face the same game. In the acausal case, whether there is any counterparty facing the corresponding decision is itself unknown, and my paying the cost may be correlated with nothing at all, or with a counterparty that takes the benefit and gives nothing back. Is this a distinct problem, or the same problem in a different costume, and does the tournament picture have any way of representing it?

  Third, the practical conclusion on its own terms. Suppose the deflationary story about mechanism design is right, or suppose it is wrong. Either way, is investing in verifiable, published decision-procedure specifications actually justified by acausal-trade considerations, or does that work stand on entirely different and more ordinary grounds — conventional commitment, reputation, contracting with a party that can simulate our source — which would mean the analogy is only incidentally related to why the work is worth funding? I would rather be told that the conclusion is right for the wrong reasons than have it defended where it does not hold.

  Finally, if the tournament is the wrong picture, tell me what a better one would be: another engineering object — a published interface contract that a foreign client may or may not implement, a mutually referential treaty, a compiler that inlines its callers — that carries the real structure better. I do not need citations or further reading; I need the argument, and I need to know which parts of my colleague's case are just naming.
reasoning: |-
  We are given a scenario about acausal trade and a debate over whether a "program equilibrium" setup accurately models it. The user requests:

  1. An explicit mapping (table) of correspondences between elements of the program tournament and acausal trade.
  2. Separation of disanalogies that are critical (load-bearing) for the two conclusions from those that are not.
  3. Addressing three complications: one-way tournament, existence uncertainty, and the practical conclusion's justification.
  4. If the tournament is inadequate, suggest a better engineering analogy.

  We break down the response accordingly.

  ### 1. Mapping: Program Tournament vs. Acausal Trade

  We create a table of correspondences. Note that the program tournament is a well-defined game-theoretic setup, while acausal trade is a more abstract and speculative concept.

  | Element in Program Tournament | Corresponding Element in Acausal Trade | Notes |
  |-------------------------------|----------------------------------------|-------|
  | Referee                       | The laws of physics / logic / mathematics | The referee enforces the rules and runs the programs. In acausal trade, the "rules" are the logical or mathematical constraints that determine the outcomes of decisions in disconnected regions. |
  | Submitted program             | The agent's decision procedure         | The program is a concrete implementation of the agent's policy. In acausal trade, this is the agent's algorithm (or a description thereof) that it uses to make decisions. |
  | Source inspection             | The ability to simulate or reason about the other agent | In the tournament, one program can read the other's source code. In acausal trade, an agent must be able to model the other agent's decision process, possibly by having access to a description or by being able to simulate it. |
  | Payoff matrix                 | The utility structure of the interaction | The matrix defines the consequences of actions (cooperate/defect). In acausal trade, the payoffs are the real-world consequences (e.g., cost incurred and benefit received) that are defined by the situation. |
  | Simultaneity                  | Logical simultaneity (or counterfactual dependence) | The programs run at the same time in the tournament. In acausal trade, the decisions are made in such a way that they are logically dependent (e.g., both are computed by the same universal Turing machine) without causal interaction. |
  | Self-referential trick        | The agent's ability to reason about its own decision and its counterpart's | The program uses the fact that it can see the other's source (and its own) to set up a condition like: "I cooperate if the other program is identical to me and would cooperate in the same situation." In acausal trade, the agent must have a representation of itself and the other agent to reason about what it would do in the counterpart's situation. |
  | Fixed point                   | A consistent pair of decisions         | The fixed point is a pair (cooperate, cooperate) that is stable under the decision rules. In acausal trade, we seek a situation where both agents, by following their decision rules, would choose to cooperate because they each expect the other to do the same. |

  ### 2. Disanalogies and Load-Bearing for Conclusions

  The two conclusions from the theory-minded member are:

  1. **Deflationary**: Acausal trade is just program equilibrium, so no exotic decision theory is needed.
  2. **Practical**: Publishing a machine-checkable description of the agent's decision procedure is what matters.

  The second member's objection: The tournament has a common cause (the referee) and shared infrastructure that acausal trade lacks.

  We break down the disanalogies:

  | Disanalogy | Load-Bearing for Deflationary Conclusion? | Load-Bearing for Practical Conclusion? | Reasoning |
  |------------|-------------------------------------------|----------------------------------------|-----------|
  | **Common cause (referee)**: In the tournament, the referee is a central coordinator that runs both programs and provides the source code. In acausal trade, there is no such referee. | **Yes, critical.** The deflationary conclusion claims that acausal trade is "ordinary" because it uses a mechanism with a referee. Without a referee, the setup might require a more exotic decision theory (like logical decision theory) that handles logical dependence without a causal mediator. | **Partially.** The practical conclusion about publishing a specification might still hold, but the referee ensures that the programs are run and that the source is shared. Without a referee, the practical steps (like publishing) must create a similar level of assurance. | The common cause is what makes the correlation causal in the tournament. Without it, the agents must rely on logical correlation, which is the core of acausal trade. Hence, the deflationary conclusion is weakened. |
  | **Shared syntax and parsing**: In the tournament, the programs are written in a language the referee can run and each can read. In acausal trade, agents may not share a common language or may not be able to parse each other's descriptions. | **Yes.** If the agents cannot interpret each other's decision procedures, they cannot set up the mutual reasoning. The tournament assumes this is solved. | **Critical.** The practical step of publishing a legible, machine-checkable specification is exactly to overcome this disanalogy. Without it, the counterparty might not be able to interpret our decision procedure. | This disanalogy directly challenges the practical conclusion: if we don't publish in a machine-checkable way, the counterparty might not be able to use our specification. |
  | **Guaranteed existence and symmetry**: In the tournament, both players exist, face the same game, and have symmetric access. In acausal trade, existence might be uncertain, and one agent might be more capable. | **Yes.** The tournament avoids the problem of whether the other agent exists and whether it faces a similar situation. | **Yes, for the practical conclusion.** If we are dealing with a more capable agent, we might need to rely on it to do the heavy lifting of simulation. Our publishing might only help if the other agent exists and is looking. | This disanalogy is critical because without guaranteed existence and symmetry, the fixed point might not be reached. |
  | **Full transparency**: In the tournament, each program gets the exact source of the other. In acausal trade, an agent might only have a partial or approximate model. | **Yes.** The fixed point in the tournament relies on exact source code access. Approximations might break the equilibrium. | **Yes.** The practical step of publishing a formal spec aims at full transparency. Without it, the agent might not be able to verify the necessary properties. | The deflationary conclusion might overstate the ease of setting up the equilibrium without exact transparency. |
  | **Common authorship or code**: In the tournament, the programs might be written by the same author or in the same style. In acausal trade, agents might be very different. | **Not load-bearing.** The tournament does not require common authorship; it works as long as the programs can read each other's source. | **Not load-bearing.** The practical step does not require common code, only a published spec. | This disanalogy is noise because even with different authors, the tournament works if the programs can read each other. However, in acausal trade, if the agents are too different, they might not recognize each other as similar. |

  ### 3. Addressing the Three Complications

  #### a. One-Way Tournament

  In this variant:
  - A publishes its source and B can read it.
  - B's source is sealed, but A receives a signed commitment (a hash plus a proof that B cooperates with any program that cooperates with it).

  **Question:** Does cooperation still get off the ground?

  - **Analysis:** 
    - B can inspect A's source and condition its action on A's policy. Since B knows A's source, B can choose to cooperate if A's program is one that cooperates with B (or with programs that have the commitment B has provided).
    - A, however, does not have B's source. Instead, A has a commitment and a proof. The proof is a machine-checkable statement that B will cooperate with any program that cooperates with B. 
    - A must decide whether to cooperate based on this proof. If A trusts the commitment (the hash and the proof), then A can reason: "If I cooperate, then by the proof, B will cooperate. Therefore, I should cooperate." 

  - **Outcome:** Cooperation can still occur if:
    1. The proof is verifiable without revealing B's source (e.g., a zero-knowledge proof or a proof about the function's behavior).
    2. A's decision procedure is designed to trust such proofs.

  However, note that the proof must be about B's behavior with any program that cooperates, not just A. But if A is cooperating, then A falls into that category.

  - **Implications for acausal trade:**
    - It shows that full two-way transparency is not strictly necessary. One-way legibility can work if the non-transparent party provides a verifiable commitment about their behavior.
    - In the case where a more capable system (B) can predict us (A) and we cannot predict it, we (A) might still cooperate if we have a verifiable proof from B. However, generating such a proof without revealing B's source might be challenging. Also, A must be designed to trust such proofs.
    - This variant does not require a common cause in the same way as the original tournament because the referee is not running both programs. The proof is generated in advance by B. However, the proof must be created in a way that it is binding for B's behavior in the actual situation.

  - **Does this show the tournament needs a common cause?** 
    - Not necessarily. The one-way tournament still has a common cause if we consider the publication of the commitment and proof as part of the setup. But in acausal trade, the proof might be generated by B independently and made available by some means. The critical point is that the proof must be available to A and verifiable by A. This might be achieved without a common referee if there is a pre-established channel (like a public bulletin board) but not a causal link during the decision.

  #### b. Existence Uncertainty

  In the tournament, both players exist and face the same game. In acausal trade, the existence of a counterparty is uncertain.

  - **Is this a distinct problem?**
    - Yes, because in the tournament the existence is guaranteed by the setup. In acausal trade, the agent must consider the probability that there is a counterparty and that the counterparty is facing a similar decision problem.

  - **Can the tournament picture represent existence uncertainty?**
    - We can modify the tournament to include uncertainty: 
      - Introduce a chance move by the referee: with probability p, there is a second player (with a program) and with probability 1-p, there is no second player (or the second player is a dummy that always defects).
      - The first program is run and must output an action without knowing whether the other exists.
    - However, in the standard program equilibrium, the program is given the other's source. If there is no other, then that input is invalid. So we must adjust: the program might be given a special input (e.g., null) to indicate no counterparty.

  - **How would an agent handle it?**
    - The agent must weigh the cost of cooperating (which is incurred whether or not the counterparty exists) against the expected benefit (which only occurs if the counterparty exists and cooperates). 
    - The decision rule might be: cooperate if the probability of a counterparty (and that it will cooperate) times the benefit is greater than the cost.

  - **Relation to acausal trade:**
    - This is a distinct problem because even if we have a published specification, the agent must still estimate the probability that there is a counterparty that will use that specification to cooperate. 
    - The tournament analogy does not naturally include this uncertainty, so we must extend it. The fixed point now must condition on existence and similarity.

  - **Conclusion:** The tournament does not inherently model existence uncertainty, but it can be extended. The disanalogy is load-bearing because without guaranteed existence, the expected utility calculation changes, and cooperation might be less likely.

  #### c. Practical Conclusion on Its Own Terms

  The practical conclusion: invest in verifiable, published decision-procedure specifications to enable acausal trade.

  - **If the deflationary story (program equilibrium) is right:**
    - Then the published spec is exactly what the other agent (or our own agent in a simulation) would use to set up the mutual cooperation. It is necessary and sufficient for the fixed point.

  - **If the deflationary story is wrong:**
    - There might be other reasons to publish a spec:
      - **Conventional commitment and reputation:** If there is a possibility of future causal interaction, publishing a spec might serve as a commitment device to build trust.
      - **Contracting with a party that can simulate us:** If the counterparty can simulate our decision process, then having a published spec makes that simulation easier and more accurate. This might be crucial even if the trade is causal but the counterparty is using simulation to decide.
      - **Coordination within a single agent's simulations:** An AI system that simulates us might use the published spec to determine how we would act in a counterfactual, which could influence its behavior.

  - **Is the investment justified by acausal-trade considerations?**
    - Partially. The published spec is necessary for any scenario where the counterparty needs to model our decision process. This includes acausal trade, but also many causal scenarios (like pre-commitment or simulation-based interaction). 
    - However, acausal trade adds a unique motivation: without a causal channel, the only way to coordinate is by having the counterparty logically infer our decision from the spec. In causal trade, we might use other methods (like repeated interaction). 
    - Therefore, the analogy is not entirely incidental: the same engineering (published specs) serves both purposes, but the acausal case provides an additional, distinct reason.

  - **Verdict:** The practical conclusion stands, but it is over-determined. The work is worth funding even without acausal trade, but acausal trade strengthens the case.

  ### 4. Better Engineering Analogy

  If the tournament is inadequate, what is a better one?

  The tournament is a good starting point but fails in the disanalogies (common cause, existence uncertainty, asymmetry). We propose:

  - **Mutually referential treaty as a distributed system:**
    - Imagine two parties that each publish a formal contract (like an API specification) that states: "I will do X if the other party does Y." The contracts are written in a shared formal language. Then, an external verifier (which could be run by either party or a third party) checks that the two contracts are compatible and form a fixed point (i.e., if both parties follow their contracts, they will both get the desired outcome). 
    - This avoids the central referee: the verifier is not running the agents, only checking the contracts. The actual execution is done by the agents in their own environments.
    - This model captures:
      - **Legibility:** The contracts are machine-readable.
      - **Fixed point:** The verifier ensures that the contracts are mutually consistent.
      - **No simultaneity:** The agents can act at different times as long as they adhere to the contract.
      - **Existence uncertainty:** The contract might include conditions about evidence of the other party's existence.

  - **Compiler that inlines its callers:**
    - Consider a compiler that, when compiling a function, also inlines the code of the functions that call it. This creates a kind of mutual knowledge: the function knows how it is called, and the caller knows how the function behaves. 
    - In the context of acausal trade, each agent is like a function, and the "compiler" is the logical framework that resolves the mutual dependencies. The agents must be written in a way that their behavior is defined in terms of their callers (counterparties) and vice versa. The fixed point is the compiled code that runs.

  However, note that no engineering analogy will perfectly capture acausal trade because the core issue is logical correlation without causal interaction. The tournament is still useful as a simple model, but we must be aware of the disanalogies.

  ### Summary of the Argument's Status

  - **Deflationary conclusion:** The program equilibrium does capture some aspects of acausal trade, but it relies on a common cause (the referee) and other assumptions that are not present in the acausal case. Therefore, it is not entirely deflationary — the acausal setting does require reasoning about logical correlation, which is not ordinary in mechanism design. The disanalogies are load-bearing for this conclusion.

  - **Practical conclusion:** Publishing a machine-checkable specification is beneficial for multiple reasons, including acausal trade. It stands even without the program equilibrium analogy, but the analogy highlights why it might be necessary in non-causal settings. The one-way tournament variant shows that even with asymmetry, verifiable commitments can enable cooperation.

  - **Parts that are just naming:** The use of "program equilibrium" is not just naming; it is a well-known concept in game theory. However, the claim that it fully captures acausal trade without loss is where the overstatement lies. The machinery of fixed points and self-reference is real, but the tournament setup imports a causal structure that is absent in the target.

  ### Final Recommendations for the Budget Question

  - Fund the work on verifiable, published decision-procedure specifications. The acausal trade argument provides an additional reason, but even without it, the work has value in causal interactions, commitment, and coordination.
  - However, be aware that the acausal case introduces unique challenges (existence uncertainty, asymmetry) that the published spec alone does not solve. Complementary work on decision theories that handle logical uncertainty and correlation might be needed.

  This audit suggests that the practical conclusion is robust, while the deflationary one is overstated. The tournament is a useful but imperfect analogy.
answer: |-
  ### Explicit Mapping: Program Tournament vs. Acausal Trade  
  Below is a table of correspondences between elements of the program tournament and real acausal trade. Each row clarifies what in acausal trade plays the role of a given tournament component.  

  | **Tournament Element**         | **Acausal Trade Analog**                                                                 | **Notes** |
  |--------------------------------|------------------------------------------------------------------------------------------|-----------|
  | **Referee**                    | Logical/mathematical consistency; universal laws of physics, math, or computation.       | The referee enforces rules and simultaneity. In acausal trade, this is replaced by the abstract requirement that decisions must be logically consistent across disconnected systems (e.g., both agents compute outcomes using the same math). |
  | **Submitted program**          | The agent's published decision procedure (e.g., open weights, formal policy spec).       | In the tournament, programs are submitted to the referee. In acausal trade, the decision procedure is "published" into the environment (e.g., via public specs) for potential counterparts to reason about. |
  | **Source inspection**          | Simulation or logical inference about the counterpart's decision process.                | Programs read each other's source. In acausal trade, an agent predicts the counterpart's output by simulating its published procedure (if capable) or verifying proofs about its behavior. |
  | **Payoff matrix**              | The agent's utility function and the real-world costs/benefits of cooperation.           | The matrix is fixed in the tournament. In acausal trade, payoffs are defined by the agent's goals (e.g., "I incur cost X to give benefit Y"). |
  | **Simultaneity**               | Counterfactual interdependence: "What I do now must logically match what my counterpart does." | Tournament simultaneity is enforced by the referee. In acausal trade, it arises from logical dependence (e.g., both decisions are outputs of the same algorithm evaluated in different contexts). |
  | **Self-referential trick**     | Agent's ability to model itself from the counterpart's perspective.                      | Programs reason about "what I would output if given the other's source as input." In acausal trade, agents must simulate how their own procedure appears to others (e.g., "Would my counterpart predict I cooperate?"). |
  | **Fixed point**                | Mutually consistent cooperation: Both agents cooperate because each expects the other to. | In the tournament, fixed points are Nash equilibria (e.g., both cooperate). In acausal trade, this is a stable state where each agent's policy confirms the other's cooperation. |

  ### Load-Bearing Disanalogies vs. Noise  
  The tournament **smuggles in assumptions** that are absent in real acausal trade. Below, "load-bearing" means the disanalogy critically undermines the deflationary or practical conclusion; "noise" means it’s a superficial difference that doesn’t affect the core argument.  

  | **Smuggled Assumption**        | **Load-Bearing for Deflationary Conclusion?** | **Load-Bearing for Practical Conclusion?** | **Why?** |
  |--------------------------------|----------------------------------------------|-------------------------------------------|----------|
  | **Trusted executor (referee)** | Yes                                          | Partially                                  | The referee ensures programs run fairly and simultaneously. In acausal trade, no trusted entity enforces consistency—agents rely on logical deduction alone. This undermines the deflationary claim that "acausal trade is just program equilibrium." |
  | **Shared syntax**              | No (noise)                                   | **Yes**                                    | Tournament programs share a programming language. In acausal trade, syntax mismatches (e.g., incompatible proof systems) prevent source inspection. This is noise for deflation (any syntax works if consistent) but critical for the practical step: publishing specs only helps if counterparts can parse them. |
  | **Guaranteed counterparty existence** | **Yes**                                      | **Yes**                                    | In the tournament, both players exist. In acausal trade, existence is uncertain (e.g., "Is there a civilization in another branch?"). This breaks fixed points and is load-bearing for both conclusions: deflation ignores uncertainty, and publishing specs is useless if no counterparty exists. |
  | **Symmetry of predictive power** | **Yes**                                      | **Yes**                                    | Tournament programs have equal access to each other’s source. In acausal trade, one agent may be unable to simulate the other (e.g., humans vs. superintelligent AI). This breaks self-referential reasoning and challenges both conclusions. |
  | **Full transparency**          | **Yes**                                      | **Yes**                                    | Programs see exact source code. In acausal trade, agents may have incomplete/approximate models (e.g., predicting humans via coarse heuristics). This destabilizes fixed points, making cooperation fragile. Critical for both. |
  | **Common authorship/code**     | No (noise)                                   | No (noise)                                 | Similar code isn’t required—only mutual legibility. Noise for both conclusions. |

  ### Addressing Complications  
  #### 1. One-Way Tournament Variant  
  **Scenario**: A publishes source; B’s source is sealed, but A gets a signed proof that B cooperates with cooperators.  
  - **Does cooperation occur?**  
    - **Yes, if** A can verify the proof without B’s source (e.g., via zero-knowledge proofs). A cooperates because it knows B will reciprocate.  
    - **No, if** the proof is unverifiable or A’s decision rule requires inspecting B’s source.  

  **Implications**:  
  - This shows the tournament relies on a **de facto common cause**: the proof’s existence (generated by B) creates causal dependence. Genuine acausal trade lacks this—there’s no guarantee of a proof.  
  - **For asymmetric capability (e.g., superintelligent B, limited A)**: If B can predict A’s behavior from A’s published spec, but A cannot simulate B, cooperation still works *if* B provides a verifiable proof. Without it, A has no reason to cooperate.  
  - **Conclusion**: One-way legibility works only with verifiable commitments. The analogy smuggles in B’s ability to generate proofs, which genuine acausal trade may lack.  

  #### 2. Existence Uncertainty  
  **Problem**: In acausal trade, the counterparty may not exist, or its "decision" may not align with yours.  
  - **Distinct from tournament?**  
    - **Yes**. The tournament guarantees a counterparty facing the same dilemma. Existence uncertainty is unique to acausal settings.  
  - **Can the tournament represent this?**  
    - Only crudely: E.g., modify the tournament so "programs" are sometimes paired with a default defector. Agents must then weigh the probability of existence.  
  - **Same problem in disguise?**  
    - Partially. It amplifies the **symmetry/predictive power** disanalogy. If you can’t know if a counterparty exists, you also can’t know if they can predict you.  
  - **Practical impact**: Publishing specs doesn’t resolve existence uncertainty—it only helps *if* a counterparty exists and can parse them.  

  #### 3. Practical Conclusion on Its Own Terms  
  **Question**: Is publishing verifiable specs justified by acausal trade, or by other reasons?  
  - **If deflationism is right** (program equilibrium suffices):  
    - Specs are *necessary but insufficient* for acausal trade. You still need logical dependence and fixed points.  
  - **If deflationism is wrong** (acausal trade is exotic):  
    - Specs are still useful for **causal trade** (e.g., commitments with simulable agents) or **reputation** (e.g., future civilizations detect your spec).  
  - **Standalone justification**:  
    - **Acausal reasons**: Specs enable trade with logically correlated agents (e.g., other branches, simulations).  
    - **Stronger non-acausal reasons**:  
      - **Conventional commitments**: Specs bind your behavior for causal counterparts.  
      - **Security through transparency**: Auditable specs reduce deception risks.  
      - **Interoperability**: Even with causal agents, specs aid cooperation.  
  - **Verdict**: The conclusion (publish specs) is **right but over-attributed**. Acausal trade adds a *niche* justification, but the work stands on **broader, more ordinary grounds** like commitment mechanisms. Funding is defensible, but the analogy is incidental.  

  ### A Better Engineering Analogy  
  The tournament is **flawed** due to smuggled assumptions (referee, existence guarantees). A superior analogy:  
  - **Published interface contract with adversarial clients**.  
    - **Structure**: You publish an API spec (your decision procedure). "Clients" (counterparties) may or may not implement the interface. You cooperate only if they satisfy a verifiable property (e.g., "implements `cooperate_if_reciprocal()`").  
    - **Why better?**  
      - No referee: Clients exist independently.  
      - Handles asymmetry: Clients can be more/less capable.  
      - Addresses existence uncertainty: Clients may never exist.  
      - Emphasizes verification: Proofs (like zero-knowledge) replace source inspection.  
    - **Real-world example**: Smart contracts on a blockchain. You publish code; others interact with it without revealing their state, but proofs ensure compliance.  

  ### Audit Summary  
  - **Deflationary conclusion**: Overstated. The tournament relies on causal scaffolding (referee, existence guarantees) absent in acausal trade. Logical decision theory *is* needed.  
  - **Practical conclusion**: Partially valid. Publishing specs aids acausal trade *if* counterparts exist and can parse them—but it’s more justifiable for causal reasons.  
  - **Key smuggled assumptions**: Trusted executor, existence guarantees, and symmetry are load-bearing. Shared syntax is critical for the practical step.  
  - **Budget implication**: Fund spec-publishing work, but **frame it as multi-use** (security, causal commitments) rather than primarily acausal.
