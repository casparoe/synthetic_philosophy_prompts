prompt: |-
  I'm taking this philosophy of value course and we just got through Moore's Principia Ethica, but there's this one thing my proff said that I can't stop thinking about. Moore lists friendship and beautiful experience as intrisic goods, right, but he also talks about organic unities where the value of a whole is greater or different from just adding up the parts. My proff dropped a hint that maybe there's a hidden tension here: friendship seems like it IS an organic unity between people, which might mean the individual people aren't valuable by themselves, but Moore usually treats consciousness and pleasure as individually valuable. Meanwhile beauty needs a conscious observer to be appreciated, but Moore wants intrinsic value to be objective and not depend on mental states in a naturalistic way. So could you write an essay on whether Moore can consistently hold both friendship and beauty as intrinsic goods given his orgainc unity principle? Especially think about a weird edge case: imagine someone who experiences perfect aesthetic rapture in total isolation with zero friends, versus someone with deep friendships who is totally blind to beauty. Does the isolation case break the organic unity claim for friendship? And does beauty's dependence on an observer clash with Moore's anti-naturalism? Don't just summarize both sides — reach an actual conclusion. I personally think Moore might have to pick between treating these as simple properties or relational ones, but I'm genuinely not sure which way he should go.
