answer: |-
  Your friend's summary captures a *common* perspective but significantly oversimplifies the debate and misrepresents several key points. The conclusion that "genuine moral dilemmas are impossible" is a heavily contested position, not the settled "standard view" they suggest. Here's a detailed audit, sentence by sentence, focusing on the underlying arguments:

  1.  **"The standard view is that genuine moral dilemmas are impossible."**
      *   **Verdict: Defensible but contested simplification.**
      *   **Analysis:** While denying dilemmas has been a historically dominant position (esp. in Kantian and Utilitarian traditions), labeling it "the standard view" overstates its current acceptance. Many prominent ethicists (Ruth Barcan Marcus, Bernard Williams, Walter Sinnott-Armstrong, Terrance McConnell, Patricia Greenspan) argue forcefully *for* the possibility or reality of genuine dilemmas. The debate is live and vigorous. Calling the denial "standard" risks implying the issue is settled against dilemmas, which it isn't.

  2.  **"The core argument is just 'ought implies can': if morality requires you to do A and also requires you to do B, but circumstances make it impossible to do both, then morality can't really require both, since it can't require the impossible."**
      *   **Verdict: Inaccurate / Overly simplistic application.**
      *   **Analysis:** This is the *starting point*, but it's insufficient *by itself* to refute dilemmas. "Ought implies can" (OIC) is widely accepted. The *crucial question* is what OIC implies about conflicting obligations.
          *   **Dilemma Defender's Response:** OIC rules out the *simultaneous joint fulfillment* of both obligations. However, it does *not* necessarily rule out the *simultaneous existence* of two genuine, conflicting obligations that *cannot* both be fulfilled. The defender argues:
              *   Morality *can* present us with tragic situations where we have two genuine, overriding obligations (e.g., save child A, save child B; keep promise to X, keep promise to Y where conflict is unforeseen). OIC means we *cannot* fulfill both, but it doesn't mean one obligation magically disappears. We *must* violate one genuine obligation. The violation is inescapable and morally significant, not just a matter of choosing the "real" obligation.
              *   The refutation *requires* additional, controversial principles beyond OIC:
                  *   **Agglomeration Principle:** If you ought to do A and you ought to do B, then you ought to do (A and B). Dilemma defenders often reject this. If A and B are jointly impossible, agglomeration leads to contradiction ("ought to do impossible thing"), but defenders see this as revealing the tragic conflict, not disproving it. They deny that obligations agglomerate when fulfillment is impossible.
                  *   **Consistency of Moral Principles:** The denial assumes the set of true moral principles *must* be consistent in all possible circumstances. Dilemma defenders argue this is an unwarranted imposition of logical neatness onto a messy moral reality. Real moral principles (e.g., fidelity, beneficence) can generate genuine conflicts in unforeseen circumstances.

  3.  **"So in every apparent dilemma, one of the two obligations turns out on reflection to be the real one and the other was only prima facie; it's just that figuring out which is which can be agonizing."**
      *   **Verdict: Outright misrepresentation of the dilemma proponent's position.**
      *   **Analysis:** This presents the *denial* position (often associated with W.D. Ross) as the *only* resolution. Dilemma proponents *reject* this analysis. They argue that in a *genuine* dilemma:
          *   Both obligations are **all-things-considered** (ATC), not merely prima facie. After considering all reasons and circumstances, both duties remain undefeated yet jointly unfulfillable.
          *   The "agonizing" nature stems precisely from recognizing that *whichever* choice you make, you are violating a *real*, *binding* moral obligation. It's not epistemic uncertainty about which obligation is "real," but the ontological reality of conflicting ATC obligations. Choosing doesn't reveal the "real" obligation; it tragically forces you to *violate* one real obligation to fulfill another.

  4.  **"Some philosophers -- Bernard Williams is the name people mention -- have argued that the guilt and regret we feel after choosing in such situations show that the obligation we violated was real..."**
      *   **Verdict: Accurate attribution, but...**
      *   **Analysis:** This correctly identifies Williams (especially in "Ethical Consistency" and "Moral Luck") as a key proponent of this line.

  5.  **"...but feelings of regret are just emotions, not evidence, so that line of argument doesn't get anywhere."**
      *   **Verdict: Inaccurate dismissal / Misrepresentation of the argument's sophistication.**
      *   **Analysis:** This dismisses Williams far too glibly. His argument is *not* a simple appeal to raw emotion as proof.
          *   **Sophisticated Version:** Williams argues for "**agent-regret**," a distinctive form of regret felt *by the agent* involved in the action, distinct from mere spectator regret or sympathy. This agent-regret is a **rational and appropriate response** to having acted in a way that, even if justified or necessary *given the impossible choice*, nonetheless involved the **violation of a genuine moral value or obligation**. The *appropriateness* and *distinctiveness* of this regret (as opposed to regret for mere bad luck or a lesser wrong) provide evidence that the agent acknowledges a *moral remainder* or *moral cost*. The violated obligation wasn't merely apparent; its violation leaves a moral residue that demands recognition.
          *   **Dilemma Defender's Point:** The argument uses phenomenology (the nature of our moral experience) as data that any adequate ethical theory must account for. Dismissing profound, distinctive agent-regret as "just emotions" fails to engage with the *moral significance* we attach to these experiences. The regret is seen as *constitutive* of recognizing the genuine conflict and the moral loss incurred.

  6.  **"And note that this is mostly a problem for deontologists anyway..."**
      *   **Verdict: Defensible simplification.**
      *   **Analysis:** True, deontological systems (with multiple, potentially conflicting fundamental rules/duties) are the most obvious candidates for generating dilemmas. Consequentialism seems structurally simpler.

  7.  **"...consequentialists can never face genuine dilemmas, because for them the only obligation is to produce the best available outcome, so there's always a single right answer."**
      *   **Verdict: Inaccurate / Overly simplistic.**
      *   **Analysis:** This claim is false in two significant ways:
          *   **Ties in Value:** Consequentialism (especially Act Utilitarianism) *can* face dilemmas if two (or more) distinct actions **produce outcomes of exactly equal, optimal value**. In such a case:
              *   You *ought* to do A (because it produces the best outcome).
              *   You *ought* to do B (because it *also* produces the best outcome, equally good).
              *   You *cannot* do both A and B (they are mutually exclusive actions).
              *   **Result:** A genuine dilemma where morality requires you to do A *and* requires you to do B, but you can only do one. Neither requirement disappears; OIC prevents joint fulfillment. Choosing either satisfies the consequentialist obligation to maximize, but you fail to do the *other* action that was also obligatory. Some consequentialists bite the bullet and accept this as a dilemma; others try to add tie-breakers (e.g., "minimize rule-breaking," "choose arbitrarily") to avoid the conflict, but these can seem ad hoc.
          *   **Pluralistic/Indirect Consequentialism:** Rule Consequentialism, Motive Consequentialism, or Pluralistic Consequentialism (valuing multiple irreducible goods) can generate conflicts *between* rules, motives, or goods that lead to structurally similar dilemmas. If a rule consequentialist has two rules that conflict in a situation with no clear hierarchy, they face a dilemma akin to a deontologist's. If pluralism values justice and happiness equally, and they conflict tragically, a dilemma arises.

  **Corrected Conclusion & State of the Debate:**

  Your friend's conclusion ("genuine moral dilemmas are impossible") **does not stand** as the uncontested truth your friend presents. The honest state of the debate is **fundamentally open and unresolved**.

  *   **The Core Issue:** The debate hinges on deep disagreements about:
      *   The **structure and consistency requirements** of moral principles/rules (Can they generate irresolvable conflicts?).
      *   The **nature of moral obligation** (Does "ought" imply "can avoid violating *any* obligation"? Or just "can perform *some* obligatory action"?).
      *   The **significance of moral phenomenology** (What does the experience of tragic choice and agent-regret tell us?).
      *   The **logic of obligation** (Does agglomeration hold? How do we formalize conflicting "oughts"? Deontic logics differ).
  *   **"Ought implies can"** is necessary but insufficient to *refute* dilemmas; it requires contestable auxiliary principles (like agglomeration) that dilemma proponents reject.
  *   **Regret Arguments** are sophisticated appeals to the phenomenology of moral experience as data for ethical theory, not mere emotionalism.
  *   **Consequentialism is not immune.** Ties in value create straightforward consequentialist dilemmas, and indirect forms can replicate deontological conflicts.

  **In summary:** While denying dilemmas is a powerful and historically influential position, the arguments for the *possibility* or even *reality* of genuine moral dilemmas are robust, philosophically sophisticated, and far from refuted. The debate remains active, with strong proponents on both sides and no clear consensus. Your "vague sense" that your friend's summary is "too neat" is entirely justified; it presents one side's view as settled dogma and fails to engage with the depth of the counterarguments.
