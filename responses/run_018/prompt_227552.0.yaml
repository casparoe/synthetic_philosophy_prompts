  I'm taking an upper-level seminar in normative ethics, and for our unit on moral dilemmas I asked a friend who did a philosophy minor a few years ago to remind me how the debate goes. Here is what he told me, more or less verbatim: "The standard view is that genuine moral dilemmas are impossible. The core argument is just 'ought implies can': if morality requires you to do A and also requires you to do B, but circumstances make it impossible to do both, then morality can't really require both, since it can't require the impossible. So in every apparent dilemma, one of the two obligations turns out on reflection to be the real one and the other was only prima facie; it's just that figuring out which is which can be agonizing. Some philosophers -- Bernard Williams is the name people mention -- have argued that the guilt and regret we feel after choosing in such situations show that the obligation we violated was real, but feelings of regret are just emotions, not evidence, so that line of argument doesn't get anywhere. And note that this is mostly a problem for deontologists anyway: consequentialists can never face genuine dilemmas, because for them the only obligation is to produce the best available outcome, so there's always a single right answer."

  I have a vague sense from the readings that this is too neat, but I can't yet pinpoint where. Acting as a professional philosopher who works on normative ethics and deontic logic, please audit my friend's summary carefully -- ideally sentence by sentence, and thinking through the underlying arguments before writing your verdict. For each claim, tell me whether it is accurate, a defensible but contested simplification, or an outright misrepresentation, and what a defender of genuine dilemmas would say in response. A few specific things I'd like you to address: Does "ought implies can" by itself actually refute dilemmas, or does the refutation need additional principles that a dilemma-proponent could reject? Is the friend right that the regret-based argument is mere emotional appeal, or is there a more sophisticated version of it in the literature that deserves a fairer hearing? And is it really true that consequentialists are immune to dilemmas full stop -- does that depend on which kind of consequentialism we have in mind, and what about cases where two options are equally good? Finally, once the summary is corrected, does its conclusion -- that genuine dilemmas are impossible -- still stand, or is the honest state of the debate more open than my friend suggests? Please reason from the arguments themselves rather than citing chapter and verse; I'll look up the readings on my own.
