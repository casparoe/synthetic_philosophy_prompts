answer: |-
  **Bottom line:** For Dewey, democratic legitimacy derives primarily from institutions structuring policy as fallible, experimentally revisable data because this embodies the core of intelligent collective inquiry, not from static expressions of will or consent.

  **Argument:** Dewey's experimentalism holds that knowledge—including political norms—is provisional, arising from testing hypotheses against consequences within experience. Legitimate democracy, therefore, isn't the mere aggregation of pre-existing preferences ("popular will") or securing initial agreement ("explicit consent"), which freeze inquiry. Instead, legitimacy flows from institutions designed *as* ongoing experiments: treating policies as hypotheses generating public consequences (data), ensuring mechanisms for diverse feedback, collective interpretation, and revision based on those consequences. This *process* of intelligent adaptation *is* self-government.

  **Addressing Technocracy:** This avoids technocracy because Dewey insists experimental inquiry must be radically *participatory*. Defining problems, interpreting data, and revising hypotheses are public tasks, demanding inclusive deliberation and diverse perspectives. Technocracy excludes the public from framing problems and judging consequences; Deweyan experimentalism *centers* it. Expertise informs, but doesn't dictate, the collective judgment forged through shared experience.

  **Routine vs. Experimental Design:** Dewey distinguishes *routine* problem-solving (applying fixed rules to predictable situations) from *genuine* experimental inquiry (novel problems requiring hypothesis testing). Institutions focused on expressing will/consent often operate routinely, applying pre-set mandates. Institutions designed for experimental legitimacy embed mechanisms for *learning*: independent monitoring, transparent feedback loops, forums for diverse public deliberation on consequences, and flexible authority to revise goals and methods. This structure treats political challenges as dynamic, requiring continuous, intelligent public investigation, not just the execution of prior instructions.
