  First, I need to structure desiderata that cover both classic tensions and emerging tech. Let me brainstorm the non-negotiables: any theory must handle the growth hormone dilemma (medical need vs social accommodation), the Adderall paradox (context-dependent functionality), and future-tech ambiguity. For each, I'll pick a killer case that exposes the fault lines. 

  The growth hormone case is perfect for showing how "normal function" gets fuzzy - is treating idiopathic short stature therapy or enhancement? Depends whether you define "normal" statistically or functionally. Then Adderall demonstrates the context problem: same pill, different ethical status in ADHD vs exam-cramming scenarios. For future cases, epigenetic editing blows up the "natural vs artificial" distinction since it taps into innate biological pathways, while neurofeedback implants challenge the therapy/enhancement binary by creating entirely new cognitive architectures.

  Now the conflicts: Personal Autonomy vs Societal Cohesion will always clash - e.g., neurodivergent students using implants to "pass" in neurotypical schools might empower individuals but erode disability justice. And Welfare Maximization will butt against Context Sensitivity when something like stress resilience editing helps in war zones but creates unfair advantages in corporate jobs. These tensions are structural, not fixable by better theory - important to flag that in seminar.

  For scoring the three approaches: Normal-function model flunks on plasticity and context problems but gives clear bright lines. Welfarist view handles edge cases better but stumbles on coercion (like "voluntary" Adderall use in hyper-competitive schools). Relational-autonomy framework excels at systemic analysis but offers little practical guidance for clinicians. I should emphasize that no model nails all desiderata - that's the whole pedagogical point.

