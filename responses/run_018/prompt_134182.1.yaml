reasoning: |-
  We are drafting a joint statement for an adversarial collaboration between strict epiphenomenalists (Camp 1) and phenomenal-access critics (Camp 2). The goal is to outline shared ground, disagreements, and cruxes.

  Key elements from the user request:

  **Joint Statements**: Shared formal setup, what needs explaining, and where standard no-go arguments land.

  **Disagreement Table**: 
  - Each object has "issue", "epiphenomenalist_wording" (Camp 1), "access_critic_wording" (Camp 2).

  **Cruxes**: 
  - Each object has "crux_name", "description", "test_case_or_argument", "camp1_prediction" (epiphenomenalist), "camp2_prediction" (access critic).
  - Two cruxes specified:
    1. Whether evolutionary heuristics can be calibration-tracked onto properties that never causally interact with the tracker.
    2. Whether intersubjective agreement about qualia can be stabilized through linguistic community feedback loops without any direct causal contact.

  **Verbal Disputes**: Array of strings noting any parts that turned out to be about wording.

  Additional instructions:
  - Casual, a typo or two is fine.
  - In the weeds but no bibliographies, citations, or reading lists.
  - Avoid rehashing standard zombie arguments; focus on report-calibration through language-game dynamics.
  - Treat the idea of language-game dynamics as genuinely open.
  - Nothing depends on obscure papers.

  Let's break it down:

  ### Joint Statements (array of strings)
  We need to list the claims both camps can agree on. These should cover:
  - Shared formal setup: What is the common ground? (e.g., there is phenomenal consciousness, it is associated with certain neural states, we make judgments about it, etc.)
  - What needs explaining: The paradox of phenomenal judgment. Specifically, the fact that we have detailed, convergent, and seemingly accurate reports about phenomenal states despite epiphenomenalism implying no causal role for consciousness in producing those reports.
  - Where standard no-go arguments land: Both sides might agree that some arguments (like the zombie argument) are inconclusive or that they don't resolve the paradox.

  ### Disagreement Table (array of objects)
  Each object has:
  - "issue": A short description of the point of disagreement.
  - "epiphenomenalist_wording": How Camp 1 (strict epiphenomenalists) would phrase their view on this issue.
  - "access_critic_wording": How Camp 2 (phenomenal-access critics) would phrase their view.

  Example issues might include:
  - The causal role of consciousness in verbal reports.
  - The explanation for the accuracy and convergence of phenomenal judgments.

  ### Cruxes (array of objects)
  Each object has:
  - "crux_name": A short name for the crux.
  - "description": A brief explanation of the crux issue.
  - "test_case_or_argument": A concrete scenario or thought experiment both sides agree is relevant.
  - "camp1_prediction": What the epiphenomenalists predict would happen in the test case or how they interpret the argument.
  - "camp2_prediction": What the access critics predict.

  We are to include at least two cruxes as per the user's request.

  ### Verbal Disputes (array of strings)
  Any points that turned out to be terminological rather than substantive.

  Now, let's generate content:

  #### Joint Statements (agreed upon by both camps)
  1. There exists phenomenal consciousness (qualia) that is associated with certain neural states.
  2. Humans produce verbal reports (phenomenal judgments) that describe their phenomenal states with apparent precision and detail.
  3. These reports show a high degree of intersubjective convergence (e.g., people agree that pain is unpleasant and describe it in similar ways).
  4. Strict epiphenomenalism holds that phenomenal consciousness has no causal effects on any physical events, including the neural processes that produce verbal reports.
  5. The paradox: If consciousness is causally inert (as per epiphenomenalism), then the neural processes that produce verbal reports are entirely determined by non-phenomenal properties. This raises the question of why these reports are so detailed, convergent, and seemingly accurate about phenomenal states.
  6. Standard arguments (e.g., zombie arguments) do not resolve the paradox because they either beg the question or do not address the specific issue of report calibration.

  #### Disagreement Table
  We'll have at least two issues:

  **Issue 1: The explanation for the accuracy of phenomenal judgments**
  - Epiphenomenalist wording: "The neural mechanisms that produce verbal reports are shaped by evolution and learning to track non-phenomenal properties (e.g., neural correlates of consciousness, NCCs). The reports are accurate because the NCCs reliably co-occur with the phenomenal states, even though the phenomenal states themselves play no causal role in the production of the reports."
  - Access critic wording: "If consciousness is causally inert, then there is no mechanism by which evolution or learning could calibrate the reports to the phenomenal properties. The detailed and convergent nature of phenomenal judgments implies that consciousness must have a causal role in shaping the reports."

  **Issue 2: The role of linguistic community feedback**
  - Epiphenomenalist wording: "Linguistic communities can develop shared reporting practices through public reinforcement and correction, which only require behavioral responses (e.g., parents correcting a child's use of the word 'pain'). These practices can converge on reports about phenomenal states without any causal role for the phenomenal states themselves because the corrections are based on observable behavior and neural patterns."
  - Access critic wording: "Without any causal input from phenomenal states, the linguistic feedback loop would have no anchor in the actual phenomenal properties. The community would be adjusting reports to match behavior and neural states, but there would be no reason for these reports to accurately represent the phenomenal states, leading to arbitrary or divergent reports over time."

  #### Cruxes
  **Crux 1: Evolutionary calibration without causal contact**
  - Description: Can evolutionary heuristics (e.g., pain avoidance) calibrate an organism's internal state representations to track phenomenal properties even if those properties are causally inert?
  - Test case: Consider a species evolving in an environment where a neural state N (with quale Q) is triggered by harmful stimuli. The organism avoids the harmful stimuli because of the neural state N (which causes avoidance behavior). The quale Q is epiphenomenal. Over generations, the avoidance behavior is refined. Would the organism's internal state representations (and eventual verbal reports, if it evolves language) come to accurately represent Q?
  - Camp1 prediction: Yes. Evolution can shape the neural mechanisms to produce accurate reports about Q because the reports are tracking N (the neural state), which is reliably correlated with Q. The accuracy is about the correlation, not direct causation from Q.
  - Camp2 prediction: No. Without Q playing any causal role, the representations are only about N. The reports would be about the neural state, not the quale. The report might say "I have Q" but it's actually representing N, and the subject has no way to know that N is associated with Q. The report isn't truly about Q.

  **Crux 2: Linguistic community stabilization without causal contact**
  - Description: Can a linguistic community develop and stabilize shared terms for qualia through public language games, even if no individual has causal access to others' qualia?
  - Test case: Imagine a community of humans who are all epiphenomenalist zombies (they have neural states and behavior but no qualia). They try to develop a vocabulary for "phenomenal states" by observing each other's behavior and neural patterns (via futuristic brain scanners). They agree to call a certain neural pattern N1 "red experience". Then, a new member is born who actually has qualia (but the qualia are epiphenomenal). The community trains the new member to use the word "red" when their brain shows N1. Over time, will the community maintain a stable and accurate vocabulary for qualia?
  - Camp1 prediction: Yes. The community can stabilize the vocabulary by correlating public behavior (including verbal reports) with neural patterns. The new member will learn to say "red" when their brain is in N1, and the community will accept it. The vocabulary remains stable and accurate because it's tied to the neural patterns that are associated with qualia (even if the qualia are epiphenomenal).
  - Camp2 prediction: No. Without causal input from qualia, the community's vocabulary is not actually about qualia. When the new member (with qualia) is trained, they are only learning to report based on their neural state. They have no way to know if their qualia match the intended qualia (e.g., their red might be what others call green, but they report "red" because of N1). The vocabulary is stable in terms of neural patterns but not in terms of qualia, leading to potential inaccuracy and divergence in what the qualia are like.

  #### Verbal Disputes
  - The term "accuracy" when applied to phenomenal judgments: Epiphenomenalists might define accuracy as reports that correctly correlate with the neural states that are associated with qualia, while access critics might insist that accuracy requires the reports to be causally influenced by the qualia themselves.

  Now, we format as JSON.

  Note: We are to write casually, so we can have a typo or two and use informal language.

