  hey, can you draft the joint statement for an adversarial collaboration between strict epiphenomenalists and "phenomenal-access" critics about the paradox of phenomenal judgment? camp one holds that phenomenal consciousness has literally zero causal efficacy, not even on the neural states that produce verbal reports. camp two holds that if consciousness is totally causally inert then our detailed phenomenal judgments are just evolutionary spandrels or noise, and the fact that people converge on precise descriptions (like "this hurts in a specific way") means consciousness must be causally involved in producing those judgments.

  i want both sides to list the claims they can actually sign together: the shared formal setup, what exactly needs explaining, and where the standard no-go arguments actually land. then lay out the disagreements with wording each camp accepts for its own side. identify the cruxes — i think one is whether evolutionary heuristics can be calibraton-tracked onto properties that never causally interact with the tracker, and another is whether intersubjective agreement about qualia can be stabilized through linguistic community feedback loops without any direct causal contact. for each crux, include a concrete case or thought experiment both sides agree bears on it, and record each side's prediction about what we'd observe.

  please format the output as a JSON object with these fields:
  - "joint_statements": array of strings
  - "disagreement_table": array of objects with keys "issue", "epiphenomenalist_wording", "access_critic_wording"
  - "cruxes": array of objects with keys "crux_name", "description", "test_case_or_argument", "camp1_prediction", "camp2_prediction"
