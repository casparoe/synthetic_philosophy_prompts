answer: |-
  ### Joint Statement on the Combination Problem  
  *Authored by Adversarial Collaborators: Constitutive Micropsychist (CM) & Phenomenal-Boundary Emergentist (PBE)*  

  #### 1. Agreed Claims  
  1.1 **Core Question**: The combination problem interrogates how fundamental conscious units (micro-subjects or proto-phenomenal properties) jointly yield macro-consciousness without invoking inexplicable gaps. It demands an account of *structural continuity*: how macro-phenomenal properties (e.g., unified human consciousness) arise from the causal-dynamic organization of micro-constituents.  
  1.2 **Structural Correspondence Requirement**: Any viable solution must satisfy the *isomorphism constraint*: macro-phenomenal states must structurally mirror the physical-informational architecture of the system (e.g., neural integration → phenomenal unity).  
  1.3 **Joint Rejection**: Both parties reject **brute vertical emergence**, wherein macro-consciousness lacks any compositional explanation in terms of micro-phenomenal/physical relations. Emergence must be weakly explicable via structural constraints.  
  1.4 **Phenomenal Boundaries**: Boundaries of subjects (e.g., why one human, not two hemispheres) must be grounded in objective physical discontinuities (e.g., information-theoretic isolation).  

  #### 2. Disagreements Table  
  | Issue | Micropsychist Formulation (CM) | Emergentist Formulation (PBE) | Substantive/Verbal |  
  |-------|--------------------------------|-------------------------------|---------------------|  
  | **Ontological Primacy** | Micro-subjects (e.g., particle-level proto-consciousness) are fundamental; macro-subjects are mereological sums bonded via intrinsic relations. | Only physical properties are fundamental; macro-subjects are novel existents emerging from functionally closed systems, irrespective of micro-phenomenality. | Substantive |  
  | **Combinatorial Mechanism** | Macro-phenomenality reduces to a *constitutive operation* (e.g., phenomenal bonding) over micro-subjects, preserving their identity within the whole. | Macro-phenomenality is an *irreducible property* of systems achieving informational closure; no "combination" of micro-subjects occurs. | Substantive |  
  | **Subjecthood Criteria** | A subject exists iff a minimal unit of experience exists; thus, micro-subjects persist unmerged in macro-wholes ("stacked"). | A subject exists iff a system exhibits global feedback integration; thus, micro-entities are not subjects, and macro-subjects have no parts with phenomenal identity. | Substantive (partly verbal) |  

  #### 3. Cruxes  
  **Crux 1: The Stacking Problem**  
  - **Issue**: Can micro-subjects retain identity within a macro-subject without dissolution?  
  - **Test Case**: A perfectly symmetric duo of micro-subjects (A and B) with identical computational complexity and reciprocal causal saturation (e.g., mutually observing quantum systems with no information asymmetry). Integrated into a macro-subject M, does M contain A and B as distinct sub-experiences?  
    - **CM Prediction**: A and B persist as sub-structural nodes of M’s experience. M’s unity is a *relational web* without ontological erasure.  
    - **PBE Prediction**: A and B cease as subjects; M is a new, simple subject. Symmetry forces a phase transition to a singular boundary.  

  **Crux 2: Boundary-Integration Mechanism**  
  - **Issue**: Is informational closure necessary/sufficient for macro-subjecthood, regardless of micro-phenomenal properties?  
  - **Test Case**: A split-brain patient with surgically restored corpus callosum. Pre-repair: two distinct subjects (L/R). Post-repair: perfect informational symmetry-breaking (bidirectional signal latency = 0). Does subject unity emerge abruptly at closure?  
    - **CM Prediction**: Unity *gradually* strengthens as micro-bonding relations intensify. Closure is insufficient without micro-phenomenal compatibility.  
    - **PBE Prediction**: Unity emerges *discontinuously* at the threshold of closure. Micro-properties are causally irrelevant; closure alone triggers subjecthood.  

  #### 4. Verbal Disputes and Their Insignificance  
  Disagreements about "subject," "combination," or "boundary" are partially verbal. CM defines "subject" as *any bearer of experience*, while PBE reserves it for *globally integrated systems*. "Combination" implies part-whole relations for CM but denotes causal emergence for PBE. These terminological differences, however, do not diminish the substantive dispute: **whether micro-phenomenal properties play an irreducible explanatory role in macro-consciousness**. Even if vocabulary were harmonized, CM insists micro-experiences *compose* macro-experiences, while PBE denies compositional efficacy. The cruxes isolate the irreconcilable core: the stacking problem tests ontological persistence, and the boundary-integration test probes causal sufficiency.  

