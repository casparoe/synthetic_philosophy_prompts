answer: |-
  Okay, here's a draft hitting those notes: warm, personal, deeply shaped by her ideas without jargon, and clear on the counterpart vs. identity distinction for the experts. Aiming for ~4 minutes delivered casually.

  **(Clink glass gently, warm smile)**

  "Hi everyone. Wow. It’s... honestly a little surreal being up here talking *about* [Advisor's Name] instead of nervously trying to explain modal realism *to* her! For those who don't know me, I was one of her grad students back in the... well, let's just say the 'big hair' era. And for those who *are* her grandkids... hi! I promise, your grandma was terrifyingly brilliant even back then, though maybe slightly less terrifying once we got to know her."

  **(Pause, look at Advisor)**

  "[Advisor's Name], looking around this room tonight, seeing people you’ve mentored, colleagues you’ve challenged and inspired, family you adore... it’s amazing. It makes you think about the journey, doesn’t it? The different chapters. The grad student burning the midnight oil, the professor shaping minds, the department powerhouse... and now, the celebrated emerita relaxing... or at least, *planning* to relax!"

  **(Shift tone slightly, more reflective)**

  "You know, [Advisor's Name] spent her career wrestling with some pretty deep questions about... well, about *what things are*, fundamentally. One big idea she championed, argued for brilliantly, is that asking if something – or someone – is *literally, exactly, identically the same* across wildly different times or situations... might not just be hard, it might be asking the *wrong kind of question*."

  **(Lean in, more conversational)**

  "Think about it. Is the intense grad student scribbling notes in a dusty library corner in 1985... *literally, identically* the same precise entity as the wise woman we're honoring tonight? If we zoomed in with some super-microscope down to the atoms? Probably not, right? Time changes us. Experiences reshape us. That person back then had different worries, different goals, maybe even a different favorite coffee mug!"

  **(Key shift - introducing the counterpart idea without jargon)**

  "But here’s the beautiful twist [Advisor's Name] taught us: Instead of getting hung up on that strict sameness, we can ask something richer. We can look at the *connections*. We can see how that driven student *led to* this accomplished scholar. We can see how the passion for understanding back then *evolved into* the profound wisdom we celebrate now. It’s not about pointing at two different snapshots and demanding, 'Are these *the exact same thing?*' It’s about seeing the incredible *chain of relations* – the influence, the growth, the continuity – that links them across the different 'worlds' of a life."

  **(Make it personal and praise growth)**

  "And *that* is the perfect lens for tonight. Because demanding that [Advisor's Name] be *identical* to her past selves? That would actually sell her journey short! It would ignore the incredible growth, the lessons learned, the ways she adapted and deepened her thinking. The fierce debater became a generous mentor. The meticulous scholar became a visionary leader. She didn't stay frozen in time; she became remarkable *new versions* of herself, each one building beautifully on what came before."

  **(Address both audiences implicitly - experts will hear the counterpart/identity distinction)**

  "So, was she literally the 'same person' all along in some absolute, unchanging sense? Her work tells us that question might lead us down a philosophical rabbit hole. But is the brilliant, formidable, and deeply caring person we honor tonight the *best possible outcome*, the most incredible *successor* to all those earlier versions of herself? Absolutely. Unquestionably. The connections are undeniable, profound, and worthy of celebration."

  **(Toast)**

  "[Advisor's Name], your work taught us that identity isn't about rigid sameness, but about meaningful connection across difference. And your *life* has been a masterclass in that. You’ve been the best possible counterpart to every 'you' that came before – a better teacher, a wiser colleague, and, from everything we see, an amazing grandmother. You’ve built an incredible chain across the worlds of your career, linking passion to wisdom, rigor to generosity. We are all so grateful to be connected to you in *this* world, tonight."

  **(Raise glass)**

  "So, let's raise a glass. Not to some unchanging essence, but to the magnificent journey. To the profound connections across time. To the incredible woman [Advisor's Name] was, is, and has become. To [Advisor's Name]!"

  **(Everyone: "To [Advisor's Name]!")**

  ---

  **Why this works:**

  1.  **No Jargon:** Avoids "transworld identity," "counterpart theory," "modal realism," "Lewis." Uses "literally identically the same," "exact same thing," "strict sameness" for the identity concept. Uses "connections," "chain of relations," "led to," "evolved into," "successor," "best possible outcome," "meaningful connection across difference" for counterpart relations.
  2.  **Clear Distinction for Experts:** Experts will instantly recognize the contrast between the "literal identity" framing (which she rejects) and the "connections/successor/best outcome" framing (her positive view). The "different snapshots... demanding 'same thing?' vs. "chain of relations... links them" makes the core difference crystal clear *in concept* without terminology.
  3.  **Shapes the Praise:** The entire structure of praising her *growth* and *evolution* ("fierce debater became generous mentor," "didn't stay frozen... became remarkable new versions") is explicitly framed *as* the counterpart relation approach. It *is* the philosophy in action, not decoration.
  4.  **Accessible Analogy:** The "snapshots"/"different worlds of a life" is intuitive. The personal examples (grad student vs. now, changing goals, coffee mugs) ground it.
  5.  **Warm & Personal:** Starts and ends warmly. Focuses on her impact and journey. Includes the grandkids ("amazing grandmother," the initial address). Casual tone throughout.
  6.  **Honors Her View:** The core message *is* her philosophical position applied to her own life, validating her life's work in the most meaningful way.
  7.  **No Quotes:** As requested – her ideas are explained in application, not cited.
  8.  **Time:** This draft, delivered at a natural pace with pauses, should land right around 4 minutes.

  **Deliver it with warmth, eye contact, and genuine affection.** The metaphysicians will appreciate the elegant conceptual embedding, the family will appreciate the heartfelt story of her growth and connections, and [Advisor's Name] will hear her life's work reflected back in the celebration of her own journey. Good luck!
