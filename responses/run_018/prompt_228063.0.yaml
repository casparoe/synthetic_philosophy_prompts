prompt: |-
  Two things I keep noticing and I can't tell if they're the same phenomenon. First: last week a friend visiting from Europe refused to tip at dinner, on principle -- he thinks tipping is a rotten system and employers should just pay properly. The weird part is everyone else at the table agreed with him about the system, including the guy who then angrily threw down extra cash to cover it and called him a jerk. When my friend said "you literally just said the system shouldn't exist," the guy goes "that's not the point." Second: a coworker thinks our local escalator rule (stand right, walk left) is dumb because it halves capacity, and she's probably right, but she still gets visibly annoyed when tourists stand on the left. She'll rant about the rule at lunch and then enforce it with her eyes the same afternoon.

  So the pattern is: getting sincerely angry at someone for breaking a convention you yourself think shouldn't exist. It's not hypocrisy, because they'll cheerfully admit the rule is bad if you ask. It's also not that they've been fooled into thinking everyone else loves the rule -- my tablemate knew the whole table agreed with the European guy. But the anger doesn't feel fake or conflicted to them, it feels completely appropriate, and the "that's not the point" seems to be doing real work.

  Is there a name for this? People keep telling me it's "just how norms work," which isn't a name. If there's something established, how is it different from plain hypocrisy and from just being confused? And if there isn't, what would you call it -- and does it make a difference that my friend is open about his reasons and would happily see the whole system burn, versus someone who just doesn't feel like tipping that night?
reasoning: |-
  Okay, let me start by breaking down what the user is asking. They've noticed a pattern where people get angry at others for breaking a convention that they themselves believe shouldn't exist. The examples given are tipping and escalator etiquette. The user wants to know if there's a name for this phenomenon, how it differs from hypocrisy, and why people react this way even when they acknowledge the system is flawed.

  First, I need to recall related concepts in social psychology. Cognitive dissonance comes to mind, but that usually involves discomfort from conflicting beliefs and actions. Here, the person openly admits the rule is bad, so it's not exactly that. Maybe it's about the distinction between descriptive and injunctive norms. Descriptive norms are what people actually do, while injunctive norms are what's approved or disapproved. Even if someone thinks the injunctive norm (like tipping) is wrong, the descriptive norm (everyone follows it) creates pressure to comply.

  Then there's coordination problems. Even if a system is inefficient, deviating unilaterally can cause chaos. The escalator example fits here. If one person stands on the left, it disrupts the flow, even if the rule isn't ideal. So the anger might stem from the unilateral breaking of the norm without consensus to change it. 

  Hypocrisy involves claiming to believe something but acting contrary. Here, the person isn't hiding their belief; they're upfront about disliking the system. So it's not hypocrisy. Instead, it's about the practical consequences of breaking the norm. The "that's not the point" comment suggests the issue isn't the norm's validity but the immediate disruption caused.

  The user also asks if the intention matters. In the tipping case, the friend openly rejects the system and wants it gone. The coworker enforces the escalator rule while criticizing it. Both cases involve maintaining social coordination. But the friend's principled stance might provoke more anger because it forces others to bear the cost (like covering the tip), whereas the escalator violation causes immediate inconvenience.

  I should also consider social contract theory. Even bad norms can be seen as agreements. Breaking them unilaterally is seen as unfair, especially if others are complying. The anger is a sanction to prevent free-riding. 

  Terms like Cognitive Dissonance, Coordination Problem, Hypocrisy vs. Consequentialism, Normative vs. Descriptive Norms, and Social Contract Breach all apply. But maybe there's no single term. The key is the distinction between criticizing a system and the act of unilateral defection. 

  The user might also be seeking validation that this behavior isn't irrational. Explaining the social dynamics could help them understand it's about coordination, not inconsistency. They might want to communicate this to others or just satisfy their curiosity. 

  In conclusion, the phenomenon arises from the necessity to coordinate within existing systems, even flawed ones, and the social disruption caused by individual defiance without collective agreement. Highlighting terms like "unilateral defection" or "social coordination problem" could provide the clarity they need.
answer: |-
  That's a fascinating and astute observation! You've pinpointed a very real and complex social phenomenon. While there isn't one universally agreed-upon *single* name, it's definitely recognized and analyzed in sociology, psychology, and philosophy. Here's a breakdown of what's happening and the relevant concepts:

  **Core Explanation: The Distinction Between Critiquing a System and Enforcing Coordination**

  The key insight is separating two things:
  1.  **Belief about the System's Validity:** "This rule/convention/system is stupid/unfair/inefficient/shouldn't exist."
  2.  **Recognition of the System's Current Reality & Coordination Function:** "Regardless of its merits, *this is the system we are all operating under right now*, and unilaterally breaking it causes immediate problems, inefficiency, unfairness, or social friction."

  **Why it's Not Simple Hypocrisy:**

  *   **Hypocrisy:** Involves *concealing* a discrepancy between one's stated beliefs and actions, or *pretending* to hold a belief one doesn't actually hold to gain advantage. ("I *love* this rule!" [secretly hates it and breaks it]).
  *   **This Phenomenon:** Involves *openly acknowledging* the system's flaws ("This rule is dumb"), but still insisting on adhering to it *in the present moment* because the *failure to coordinate* under the existing, known rules is seen as the more immediate problem. The anger stems from the *unilateral defection*, not from a belief in the rule's inherent goodness.

  **Why it's Not Confusion:**

  They aren't confused about the rule's existence or their own opinion of it. They clearly understand both. The "conflict" exists but is resolved by prioritizing the *practical consequences of non-coordination* over the *abstract principle* of the rule's badness.

  **Concepts and Labels:**

  1.  **Coordination Problem / Schelling Point:** (From game theory/economics - Thomas Schelling)
      *   Even if a rule isn't optimal (like stand-only escalators being more efficient), having *some* rule (stand right, walk left) is better than chaos. The *specific* rule becomes a "focal point" (Schelling point) that allows people to coordinate their behavior without explicit communication. Unilaterally breaking it disrupts this coordination, causing inefficiency and frustration, *regardless* of the rule's merit. Your coworker gets annoyed because the tourist disrupts the established flow, even as she critiques the flow's design.

  2.  **Normative vs. Descriptive Norms / Injunctive vs. Descriptive Norms:**
      *   **Descriptive Norm:** What people *actually* do (e.g., "Most people tip 20%" or "Most people stand right on the escalator").
      *   **Injunctive Norm:** What people *should* do, what is socially approved/disapproved (e.g., "You *should* tip 20%" or "You *should* stand right").
      *   **The Phenomenon:** Your examples involve people rejecting the *injunctive* norm ("Tipping *shouldn't* be necessary," "The stand-right rule *shouldn't* exist") but still reacting strongly to violations of the *descriptive* norm because they rely on the predictability it provides for coordination. The anger is enforcing the *descriptive* reality ("This is how we do things here *now*") even while criticizing the *injunctive* ideal.

  3.  **Cognitive Dissonance (Managed):** While not full-blown dissonance causing internal conflict, there's a tension between disliking the system and needing to operate within it. Enforcing the rule on others can be a way to *reduce* the dissonance caused by *their* non-compliance – "If *I* have to play by these stupid rules, so should *you*."

  4.  **Social Contract (Flawed but Binding):** People implicitly accept operating within a system (even a disliked one) because it provides order and predictability. Someone who unilaterally breaks a widely followed convention is seen as violating this tacit agreement, free-riding, or imposing costs on others (like your friend making the table-mate pay extra, or the tourist blocking the walker). The anger is a sanction against breaking the contract.

  5.  **Unilateral Defection:** This is the most precise label for the *action* that triggers the anger. Your friend and the tourist are engaging in **unilateral defection** from the established cooperative norm. Even if the overall cooperation (tipping system, escalator rule) is suboptimal, defecting while others cooperate is often seen as selfish and disruptive. The anger is directed at the *act of defection itself* and its consequences, separate from the critique of the system.

  **"That's not the point": What's the Point Then?**

  The point is **coordination, predictability, fairness within the current system, and avoiding unilateral disruption.** The table-mate wasn't angry because he loved tipping; he was angry because:
  *   Your friend's action forced *him* (or the server) to bear an immediate cost (paying extra).
  *   It violated the descriptive norm everyone else was following, creating social awkwardness and potential unfairness to the server *within the existing system*.
  *   It felt like your friend was making a *personal* stand at the *expense* of others, rather than working to change the system collectively.

  Similarly, your coworker gets annoyed because:
  *   The tourist disrupts the flow she relies on *today*.
  *   It forces her (or others) to navigate around the blockage.
  *   It feels disrespectful of the local "operating system," even if the system is suboptimal.

  **Does Intention Matter? (Principled Rejection vs. Cheap Defection)**

  *   **Absolutely.** Your friend's **principled rejection** (open about reasons, wants systemic change) is different from someone who just doesn't tip to save money.
  *   **Why:** The *principled* rejecter highlights the systemic flaw but still commits unilateral defection, imposing costs on others. The anger might be *stronger* because it's seen as self-righteous or using a moral stance to justify stiffing the server/sabotaging coordination. The "cheap defector" is just seen as selfish, but their action doesn't challenge the system's validity.
  *   **The Anger Target:** The anger towards the principled rejecter might mix "you made me pay/be inconvenienced" with "you're being self-righteous about a stance that hurts someone else *right now*." The anger towards the cheap defector is more purely about the selfishness and immediate cost/imposition.

  **In Summary:**

  You're observing **anger triggered by unilateral defection from a descriptive social norm, driven by the need for coordination and predictability within the current system, even when the defector and the enforcer both critique the underlying injunctive norm or the system itself.**

  **Key Phrases to Describe It:**

  *   **Enforcing coordination under a disliked system.**
  *   **Reacting to unilateral defection.**
  *   **Upholding descriptive norms despite rejecting injunctive norms.**
  *   **Prioritizing immediate coordination over abstract systemic critique.**
  *   **Sanctioning violations of the (flawed) social contract.**

  While "just how norms work" is reductive, it points to the power of descriptive norms and the human need for predictable coordination. The anger isn't about loving the rule; it's about the disruption and perceived unfairness caused by someone opting out unilaterally while everyone else is still playing the (admittedly bad) game. The principled nature of the defection changes the *flavor* of the anger but not its core cause: the disruption of the current operational coordination.
