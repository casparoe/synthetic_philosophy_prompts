  Okay, the user presents a fascinating and nuanced debate about societal collapse versus reorganization. They had a lengthy argument with a friend regarding historical events like the Late Bronze Age crisis and whether they represent true collapses or just rapid reorganizations. The core of their disagreement lies in how each side interprets evidence: one focuses on institutional disintegration (palaces, writing systems), while the other emphasizes continuity in daily life (settlement patterns, farming). 

  What makes this particularly interesting is how each framework seems to immunize itself against the other's evidence. When the friend sees institutional collapse, they call it "decentralization"; when the user sees demographic continuity, they dismiss it as "background noise." This creates a stalemate where no archaeological finding could decisively refute either position because the definitions absorb counter-evidence. 

  The user wants to know if there's a philosophical term for this specific dialectical deadlock. They mention Kuhnian incommensurability and framing effects but want distinctions. First, Kuhnian incommensurability involves paradigm shifts where theories can't be compared directly. Here, both sides are actually using the same evidence but interpreting it through different value lenses—complexity versus resilience. Framing effects are broader cognitive biases, but this case is more specialized: it's about how each model preemptively redefines the other's key evidence. "Definitional gerrymandering" comes close but lacks the systemic reciprocity. 

  Hmm. The closest existing concept might be "evidentiary incommensurability" (from Kosso), but it doesn't fully capture the mutual neutralization. So I should coin a term: "Evidentiary Immunity by Reciprocal Redefinition" (EIRR). This emphasizes how both models redefine terms to make opposing data irrelevant. Boundary conditions: (1) same transitional event, (2) two macro-descriptions, (3) each redefines the other's core evidence as conceptually inert. 

  Crucially, this isn't just semantic vagueness about "collapse." Semantic disputes can be resolved by clearer definitions. Here, the disagreement is deeper—it's about what counts as significant change. Nor is it a standard theoretical debate, since those allow evidence to arbitrate; here, evidence is neutralized by design. 

  To resolve this, we'd need evidence that breaks the reciprocity. For example: catastrophic depopulation *specifically concentrated* among former elite-specialist classes (e.g., scribes, administrators)—visible in grave goods, skeletal stress markers, or settlement hierarchies collapsing *in tandem* with demographic decline. If found, it'd challenge the reorganization model. Conversely, evidence of rapid institutional transformation *without* elite displacement (e.g., administrative writing evolving into local accounting systems) would support decentralization. 

  My vulnerability? I might overstate the stalemate. If we found clear proof that post-"collapse" societies *remembered* but *rejected* prior complexity (e.g., oral histories disparaging monuments), it could favor the collapse narrative by showing cultural rupture beyond mere adaptation. But such evidence is archaeologically elusive. 

  The user’s meta-awareness here is impressive—they’ve pinpointed why their debate felt logically airtight yet empirically stuck. Their frustration isn’t pseudo-problem; it’s a real epistemological puzzle in comparative archaeology. The deeper need seems to be finding a way to break circular debates about historical significance, not just for this argument but for the field’s methodology. They’d likely appreciate concrete pathways forward, hence suggesting targeted evidence types. 

  Also, their analogy about bankruptcy versus breathing is genius. It crystallizes the core tension: whether societal "death" requires institutional extinction or demographic catastrophe. That’s the heart of the normative divide.
answer: |-
  This is an exceptionally lucid dissection of a profound methodological impasse in historical interpretation. The phenomenon you describe—**mutually neutralizing evidentiary frameworks**—has no universally accepted term, but we can precisely define it by distinguishing it from existing concepts:

  ### Proposed Term: **Evidentiary Immunity by Reciprocal Redefinition (EIRR)**
  #### Definition:
  A dialectical stalemate where two macro-historical models of the same transition are structurally designed to absorb the opposing framework's core evidence by redefining it as either:
  1.  **Epiphenomenal** (e.g., "institutional collapse is merely decentralization")
  2.  **Irrelevant Noise** (e.g., "demographic continuity is trivial background persistence")

  This creates a closed system where empirical data *cannot* falsify either model because evidence is predetermined as either supporting the model or being definitionally excluded from relevance.

  #### Boundary Conditions:
  1.  Applies solely to **macro-descriptions of societal transition** (collapse/reorganization).
  2.  Requires **two competing frameworks** claiming to explain the *same* event.
  3.  **Reciprocity is essential**: Each model must neutralize the *other's* primary evidence.
  4.  **Fundamental Disagreement**: Not about empirical facts, but about **what constitutes "significant" change**.

  ---

  ### Distinctions from Related Concepts:
  1.  **Kuhnian Incommensurability**:  
      *   *Kuhn*: Paradigms have different standards of problem-solving and evidence; communication breaks down.  
      *   *EIRR*: Communication is possible (you debate the same evidence), but frameworks **deliberately redefine significance** to immunize against counter-evidence. *Incommensurability is about perception; EIRR is about strategic definition.*

  2.  **Framing Effects**:  
      *   *Framing*: Cognitive bias where presentation alters interpretation.  
      *   *EIRR*: A **systematic, reciprocal redefinition** embedded in the models' logical structure. Framing is psychological; EIRR is structural/logical.

  3.  **Definitional Gerrymandering**:  
      *   *Gerrymandering*: Ad hoc definition adjustments to protect a theory.  
      *   *EIRR*: **Mutual, preemptive redefinition** creating a closed loop. Gerrymandering is one-sided; EIRR is a bilateral stalemate.

  4.  **Semantic Vagueness**:  
      *   *Vagueness*: Ambiguity in terms like "collapse."  
      *   *EIRR*: **Precise, opposing definitions** intentionally deployed to nullify evidence. Vagueness is fuzzy; EIRR is strategically precise.

  5.  **Standard Theoretical Disagreement**:  
      *   *Standard*: Evidence can adjudicate (e.g., new data favors one model).  
      *   *EIRR*: Evidence is **definitionally excluded** as irrelevant by one framework. Disagreement is empirical; EIRR is definitional.

  ---

  ### Breaking the Stalemate: Potential Adjudicating Evidence
  EIRR is resistant but *not* invincible. Resolution requires evidence that **simultaneously satisfies both frameworks' criteria for significance** or exposes a **logical contradiction** within one model:

  1.  **Evidence of Non-Adaptive Regression**:  
      *   *Example*: Stratigraphic layers showing replacement of specialized crops (e.g., olive oil/viticulture) with subsistence-only cereals *alongside* skeletal evidence of malnutrition.  
      *   *Impact*: Challenges "adaptive reorganization" by showing loss of complexity directly harmed resilience. Forces the "reorganization" model to explain *maladaptive* simplification.

  2.  **Elite Displacement with Knowledge Loss**:  
      *   *Example*: Sudden disappearance of administrative writing *and* reappearance of cruder proto-writing centuries later, with isotopic analysis showing new elites lack nutritional markers of prior ruling class.  
      *   *Impact*: Undermines "decentralization" by proving institutional rupture wasn't voluntary restructuring but catastrophic knowledge loss.

  3.  **Continuity Interrupted by External Shock**:  
      *   *Example*: Pollen cores proving agriculture continued *unchanged* through the "collapse" period, but site destruction layers correlate with a volcanic winter/climate event.  
      *   *Impact*: Challenges "collapse" model by showing institutional disintegration was externally forced, not systemic failure—daily life persisted until exogenous catastrophe.

  ---

  ### Vulnerabilities in This Reasoning:
  1.  **Empirical Accessibility**:  
      The "adjudicating evidence" above is archaeologically rare. If such data doesn't exist, EIRR may be practically unresolvable, making it a **methodological artifact** rather than a pseudo-problem.  
      *Your insight is valid: without new data types, this is a genuine epistemological lock.*

  2.  **Normative Core**:  
      The stalemate ultimately rests on **unstated values**: Is "society" defined by institutions or lived experience? EIRR masks this normative divide as empirical disagreement.  
      *Revise if*: Historians explicitly debate values (e.g., "Is state-level complexity necessary for human flourishing?") rather than disguising them as definitions.

  3.  **Third-Way Frameworks**:  
      Models like "**asynchronous collapse**" (e.g., McAnany & Yoffee) might dissolve EIRR by showing institutional and demographic changes operate on different timescales.  
      *Revise if*: Evidence shows "collapse" and "continuity" are temporally decoupled, making both frameworks incomplete.

  ---

  ### Conclusion:
  You've identified **Evidentiary Immunity by Reciprocal Redefinition (EIRR)**—a sophisticated impasse where models weaponize definitions to neutralize rival evidence. It differs from incommensurability (reciprocal redefinition vs. perceptual gaps) and gerrymandering (bilateral vs. unilateral). Resolution requires data that either bridges definitions (e.g., complexity loss causing demographic harm) or exposes one model's internal contradiction. The vulnerability lies in archaeology's ability to *produce* such data; if impossible, EIRR reveals a **fundamental limit in how we conceptualize societal change**. This is not a pseudo-problem but a deep challenge in historical epistemology.
