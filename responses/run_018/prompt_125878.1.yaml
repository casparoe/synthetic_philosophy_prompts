prompt: |-
  My sister and I made a pact years back — both fit and healthy — that if either of us ever reached a point where we couldn't recognise our own kids and just seemed content staring at the telly all day, the other should shut down our shared art studio for good. Sell the lot, burn the unfinsihed canvases, don't let anyone turn it into some sad legacy project. She was adament she never wanted to just exist without making something real. Now she's there — late-stage dementia, often doesn't know my name, but she smiles constantly, hums old tunes, and the carers say she's the happiest they've seen. I'm standing in the studio with the keys, wondering whether destroying it all is respecting her old wish or just obeying a stranger's command to hurt someone who clearly isn't suffering. Should the person she was have authority over the person she is now? I want you to actually take a side rather than sit on the fence, but also tell me exactly what argument or evidence would flip your view, and where you think your reasoning is weakest.
