  hey im in this phil decision theory course and we just covered updateless decision theory - like you dont update beliefs on new evidence, you just compute teh logical output of your decision across worlds. my professor said its different from evidential decision theory but i keep mixing them up. for our study group close i wanna write a short poem, maybe four quatrains in blank verse, with one line that repeats verbatim at the end of every stanza. that repeated line should be the agent's decision rule, and it has to stay exactly the same word-for-word even while the stanza introduces new evidence (a test result, a market shift, a coin flip). i want the form itself to do the work: the evidence updates but the line refuses to, which should mirror UDT. please make it accurate - someone who knows UDT should see the causal vs evidential distinction embedded in there without me naming it - and inject the niche idea that in UDT your own future actions are logical outputs not probabilistic updates. also add a brief note after saying where the poem takes liberties or leans on contested stuff (like the dutch book objections), and dont present a contested view as the consensus - separate whats settled from whats actually fought over. and end with a one-sentence summary as the very last line. no citations or reading lists plz, just the poem and the note.
