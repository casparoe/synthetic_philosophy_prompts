  We are going to write a poem that illustrates Updateless Decision Theory (UDT) by having a repeating line that does not change, representing the fixed decision rule that does not update on new evidence. The poem will have four quatrains (four-line stanzas) in blank verse (unrhymed iambic pentameter). Each stanza will end with the same line verbatim, which is the agent's decision rule.

   The poem should:
   1. Show that the agent does not update beliefs on new evidence but instead computes the logical output across all possible worlds.
   2. Contrast with evidential decision theory (EDT) without naming it, by showing that the agent isn't swayed by the evidence in a way that changes the decision rule.
   3. Include the idea that future actions are logical outputs, not probabilistic updates.
   4. Introduce new evidence in each stanza (a test result, a market shift, a coin flip) but the decision rule remains the same.

   We'll use a repeated line that reflects the UDT perspective. Let's choose:
   "I act as if all worlds are real and bound."

   This line captures the idea that the agent considers all possible worlds (including counterfactuals) and that they are bound together by logical consistency.

   Now, let's structure the stanzas:

   Stanza 1: Introduce the setup and the decision rule. We might set up a scenario (like a medical test) and end with the rule.
   Stanza 2: Present new evidence (test result) and show that the rule doesn't change.
   Stanza 3: Another piece of evidence (market shift) and the rule remains.
   Stanza 4: A coin flip (random event) and again, the rule holds.

   We'll try to embed the causal vs evidential distinction by showing that the agent's action is not based on the evidence per se but on the precomputed strategy.

   After the poem, we'll add a note about where the poem takes liberties and what's contested. Then, a one-sentence summary.

