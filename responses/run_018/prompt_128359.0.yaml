answer: |-
  ### Poem: The Unswayed Agent  

  The test tube glows, a positive result—  
  a signal strong, yet I do not recalibrate.  
  For in the map of worlds, I must consult  
  the precommitment made at logic's gate.  
  **I choose the act all possible selves would replicate.**  

  The market crashes, trends reverse their flow;  
  my shares may plunge, but still I hold the line.  
  No shift in trust for what the numbers show—  
  my action's fixed by branches I define.  
  **I choose the act all possible selves would replicate.**  

  The coin spins high—heads grant a sudden gain,  
  yet tails bring loss. I watch its arc, serene.  
  No update shifts the strategy I maintain;  
  my future moves are outputs, foreseen.  
  **I choose the act all possible selves would replicate.**  

  Though evidence may dance like firelight,  
  I see the weave of cause in every thread.  
  My choice remains—unchanged by day or night—  
  a function called where all paths spread.  
  **I choose the act all possible selves would replicate.**  

  ---

  ### Note on Liberties & Contested Points  
  - **Liberties**: The poem personifies "possible selves" for accessibility, while UDT technically treats agents as abstract computations. The "firelight" metaphor simplifies complex epistemic dependencies.  
  - **Contested**: The stance that UDT *fully* avoids Dutch Book arguments (where inconsistent bets guarantee loss) is debated; some argue it merely relocates vulnerability to logical uncertainty. The "unswayed" ideal also downplays pragmatic challenges in computing cross-world consistency.  

  ### One-Sentence Summary  
  UDT agents precommit to timeless strategies, treating actions as deterministic outputs across counterfactual worlds—ignoring evidence as *updates* but weighing it as *logical constraints*.
