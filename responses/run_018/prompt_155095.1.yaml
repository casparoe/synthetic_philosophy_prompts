  **Joint Statement on Wild-Animal Welfare and Ecological Intervention**  
  *Signed by Representatives of Strict Negative Utilitarianism (NU) and Suffering-Focused Prioritarian Consequentialism (SFP)*  

  ### Section 1: Points of Agreement  
  We, the undersigned, affirm the following shared understandings after extensive deliberation:  

  1. **Scale of Wild-Animal Suffering (WAS)**:  
     Non-human animals in natural ecosystems experience vast quantities of suffering due to predation, disease, starvation, parasitism, and environmental stressors. Given the sheer number of sentient individuals (e.g., invertebrates, small vertebrates) and the high baseline rates of early mortality, the cumulative suffering in nature plausibly exceeds that caused by human activities.  

  2. **Formal Ethical Distinctions**:  
     - **NU** treats the minimization of suffering as lexically prior to the promotion of positive welfare. Reducing intense suffering cannot be traded for any quantity of positive experiences.  
     - **SFP** assigns priority-weighted disvalue to suffering (i.e., worse suffering and worse-off individuals receive disproportionally greater moral attention) but permits trade-offs where net suffering reduction may justify forgoing some positive welfare.  

  3. **Epistemic Limits**:  
     Ecological systems are complex, adaptive, and nonlinear. Our ability to forecast long-term consequences of large-scale interventions (e.g., gene drives, invasive species removal, habitat engineering) is severely constrained by:  
     - Uncertainty in population dynamics,  
     - Incomplete sentience assessments (e.g., insects, fish),  
     - Unpredictable cascading effects (e.g., trophic cascades, co-extinction risks).  
     Decisions must account for model fragility and systemic ignorance.  

  ---

  ### Section 2: Disagreements Table  
  | **Issue**                                                                 | **Strict Negative Utilitarian (NU) Position**                                                                                                | **Suffering-Focused Prioritarian (SFP) Position**                                                                                                  |  
  |---------------------------------------------------------------------------|----------------------------------------------------------------------------------------------------------------------------------------------|----------------------------------------------------------------------------------------------------------------------------------------------------|  
  | **Moral Priority of Suffering Reduction**                                 | Preventing suffering is categorically paramount. Creating positive welfare has *no* intrinsic value; it is permissible only as a side effect of suffering reduction. | Reducing suffering has strong priority, but creating positive welfare *does* have intrinsic value. Trade-offs favoring net suffering reduction are permissible if they meet priority thresholds. |  
  | **Moral Risk Under Deep Uncertainty**                                     | In deeply uncertain interventions, we must prioritize worst-case suffering prevention. Inaction that risks vast suffering is *prima facie* impermissible if safer alternatives exist. | Uncertainty demands precaution but not absolutism. Expected-value calculations using conservative priors and priority weightings should guide action. Avoid interventions with catastrophic downside risks. |  
  | **Asymmetry of Harm: Causing vs. Allowing in Ecosystems**                 | There is no morally relevant distinction between actively causing suffering (e.g., engineering predation-free ecosystems) and allowing naturally occurring suffering. Both require intervention if feasible. | A defeasible asymmetry exists: actively causing new forms of harm (e.g., chronic stress) may carry greater responsibility than failing to prevent natural harms, especially given system complexity. |  
  | **Normative Weight of "Naturalness"**                                     | "Naturalness" has zero independent moral value. Only sentient experience matters. Ecosystem states should be evaluated solely by their suffering footprint. | While not intrinsically valuable, "naturalness" may proxy for systemic stability, caution against hubris, or non-instrumental values (e.g., biodiversity as resilience). It can inform risk-aversion. |  

  ---

  ### Section 3: Cruxes and Hypothetical Cases  
  **Crux 1: Harm Asymmetry in Ecosystem Intervention**  
  *Hypothetical*: A managed transition replaces a predator-dominated ecosystem with a redesigned habitat where prey species (e.g., deer) live free from predation but experience:  
  - 50% reduced acute suffering (no violent deaths),  
  - 20% shorter lifespans due to resource competition,  
  - Chronic stress from overpopulation (moderate suffering),  
  - No change in net sentient population size.  

  - **NU Verdict**: **Morally required**. The elimination of extreme predation suffering lexically outweighs chronic stressors and lifespan reduction.  
  - **SFP Verdict**: **Permissible but not required**. The trade-off reduces worst-off experiences (predation) but introduces new welfare deficits. Expected value is positive but context-dependent; alternatives (e.g., fertility control) may be preferable.  

  **Crux 2: Moral Weight of Naturalness**  
  Both sides agree "naturalness" lacks *inherent* moral weight. Disagreement centers on whether it serves as a reliable heuristic.  
  - **NU**: Dismisses naturalness as a distraction from sentience-focused calculus.  
  - **SFP**: Treats naturalness as a practical proxy for avoiding unintended consequences (e.g., cascading extinctions).  

  ---

  ### Section 4: Verbal Disagreements  
  The term **"intervention"** vs. **"management"** is partially verbal:  
  - **NU** uses "intervention" neutrally to denote *any* intentional alteration of ecosystems to reduce suffering.  
  - **SFP** prefers "management" to emphasize prudential, incremental approaches that respect systemic complexity.  
  *Why it’s substantive*: The choice reflects deeper disagreements about hubris (SFP) vs. urgency (NU) but does not alter core principles.  

  ---

  ### Conclusion  
  We concur that reducing WAS is a profound moral priority but diverge on constraints, trade-offs, and uncertainty-management. Further empirical research into sentience distributions and ecosystem dynamics is essential.  

  ---  
  **Confidence Assessment**:  
  - **High Confidence**: Characterizations of NU/SFP principles, agreement on WAS scale, epistemic humility.  
  - **Moderate Confidence**: Harm-asymmetry crux framing.  
  - **Low Confidence**: Ecological plausibility of the hypothetical case (real-world trade-offs are messier). The "naturalness" heuristic debate is unresolved empirically.
