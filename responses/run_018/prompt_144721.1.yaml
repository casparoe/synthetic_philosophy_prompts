answer: |-
  This is a brilliantly messy example of how communities invent meaning, and your discomfort is spot-on. There *is* a principled way forward that rejects both false ancient roots *and* arbitrary gatekeeping based on residency dates. Here's a breakdown:

  **The Problem with the "Pre-1990" Argument:**

  1.  **Arbitrary Cutoff:** Why 1990? That's only 12 years after the town's founding (1978). It excludes people who might have arrived in 1991 but have lived there for 30+ years, raised families, and contributed deeply. It privileges duration over engagement.
  2.  **Ignores the Town's Origin:** The town *itself* was built by newcomers (factory workers, planners, families moving in). Strictly applying a "before date X" logic would have excluded the founding generation *from their own creation* after just 12 years! Their own roots were new once.
  3.  **"Cosplaying Heritage" is Ironic:** The *entire festival* is a creation of the last decade, drawing on *external* sources (farm songs from elsewhere, a partially fabricated ritual). Everyone involved is, in a sense, "cosplaying" a heritage the town never organically developed over centuries. Accusing newcomers of this ignores the festival's fundamental nature.
  4.  **Stagnation vs. Growth:** Communities evolve. Defining "real" only by early arrival freezes the community in amber and denies the validity of newer residents' contributions and identities. It risks turning the festival into a nostalgic club rather than a living tradition.

  **Why It Feels "Genuinely Ours" (The Core of Authenticity):**

  1.  **Shared Experience & Meaning-Making:** Authenticity here isn't about historical accuracy or longevity. It's about **shared practice and collective meaning.** You gather, sing, perform the ritual, share food, celebrate autumn *together*, *in this place*. *That repeated communal act* over the last decade *is* what makes it "yours." The value is in the doing and the shared feeling it creates *now*.
  2.  **Place-Based Identity:** While the *specific rituals* might be borrowed, the festival is tied to *your specific town*, its landscape, its people (past and present), and its unique origin story (the factory town). It's a ritual *for this place*, enacted *by the people who live here now*.
  3.  **Invented Tradition (and that's okay!):** Sociologists like Eric Hobsbawm famously wrote about "invented traditions." Communities constantly create rituals, symbols, and narratives to foster cohesion, legitimize institutions, or connect to a desired past. Your festival is a perfect example. Its authenticity stems from its *function* and *acceptance* within the community, not its provenance.

  **Principled Ways to Decide Who Belongs (Without Ancient Roots):**

  Focus on **participation, contribution, and commitment to the community *now***, not just past residency:

  1.  **Contribution, Not Pedigree:** Who actively contributes to the festival's success? (Organizing, performing, making food, setting up, teaching songs to others, documenting it?) Who contributes positively to the wider town community? *This* is the measure of belonging, not the year their moving truck arrived.
  2.  **Commitment & Investment:** Does the person demonstrate a genuine commitment to the town and its well-being? Do they see it as home? Do they invest time and energy here? A newcomer deeply involved for 5 years might have more claim than a long-term resident who ignores community events.
  3.  **Knowledge & Respect for the Practice:** To lead or perform key roles, people should understand the *meaning* of the ritual *as it's practiced now* and respect its significance to the community. This doesn't require ancient bloodlines; it requires learning, engagement, and respect for the shared tradition you've built. (This is where teaching newcomers the songs and the story – including its messy origins! – becomes vital).
  4.  **Inclusivity as a Core Value:** Explicitly state that the festival belongs to *everyone* who calls the town home and wants to participate respectfully. Frame it as a celebration of the *entire* community's present and shared future, acknowledging its unique, relatively recent origins. This prevents arbitrary exclusion.
  5.  **Honor Founders Without Excluding Others:** Acknowledge the role of early residents (including pre-1990!) in *establishing* the town and potentially *starting* the festival. Give them roles of honor, invite them to share memories of the early days. But don't make their early arrival the *sole* qualification for leadership *now*. Their legacy is best honored by ensuring the festival thrives and includes new generations.

  **How to Frame This in Your Group:**

  *   **Acknowledge the History (Accurately):** "Our town is special *because* it was built from scratch in 1978. Our festival is special *because* we created it together over the last ten years, inspired by things we found meaningful. Its power comes from *us doing it together here*."
  *   **Challenge the "Cosplay" Label:** "We *all* adopted these songs and rituals because they resonated. The 'heritage' we're celebrating is the heritage *we've built* – the story of *this* factory town and the community we are *now*. Newcomers who embrace that are just as much a part of building that heritage as those who were here earlier."
  *   **Focus on Function:** "This festival works because it brings us together. Excluding people who live here, contribute here, and want to celebrate here *weakens* that. It turns it inward instead of outward."
  *   **Propose Positive Principles:** "Instead of dates, let's decide leadership based on who knows the rituals, contributes the most effort, and represents our whole community's spirit. Let's honor our founders *and* welcome those building our future."

  **In essence: Authenticity in this context is absolutely rooted in shared belief and shared practice.** It's performative and communal. The principled path is to define belonging by *current* participation, contribution, and commitment to the shared place and its evolving traditions, openly acknowledging its recent, invented nature as a strength, not a weakness. Your festival is "real" because you make it real together, year after year. Protecting that requires opening the circle, not closing it based on arbitrary dates.
