prompt: |-
  I'm part of a small group trying to decide whether a community solar project we helped start is too risky to sink much more money into. The two failure scenarios everyone keeps circling back to are (a) the supplier for the main components goes under mid-project, and (b) the local utility changes its connection rules so we can't sell power back at the rate we assumed. One of the numbers-minded people in the group made a little spreadhseet, and to estimate the chance both go wrong at once he simply multiplied the two individual probabilities. His reasoning was that they are caused by completely different things — a manufacturer going bankrupt versus a policy change — and since we have no evidence of any link between them, the reasonable default is to treat them as independent. I pushed back that "no evidence of a link" isn't the same as "evidence of no link": maybe both get more likely in a general downturn, or both run through the same state energy office, or a single cash squeeze forces us to delay both fixes. He said that line of thought makes any estimate impossible, because theres always some unknown common cause you could worry about, and at some point you just have to assume independence and move on. I can't tell whether that's a defensible heuristic or a way of dressing up a guess as a calculation, and I don't have the background to decide.

  I'm not after a generic "it depends." Please say whether treating two probabilities as independent when you can't name a common cause is a settled convention, a contested shortcut, or something in between, and be explicit about which parts of your answer are standard and which are genuinely disputed among people who actually do this kind of reasoning — don't present a contested view as the consensus. Structure the response as: "The case for multiplying" (1 paragraph), "The case against" (1 paragraph), "What probability theory actually settles" (1 paragraph), "What is genuinely contested" (1 paragraph), and "Your verdict for our decision" (1 paragraph).
