prompt: |-
  I'm working on a short essay for my phil of mind course about Dennett's worry over counterfeit people and how it applies to LLMs. The basic idea I want to defend is that Dennett's intentional stance and the center of narrative gravity aren't just about passing conversation tests — they're about whether a system has functionally intergrated beliefs and desires that guide its behavior over time. So I want to say modern LLMs are a weird kind of counterfeit: they generate first-person narratives ("I'm unsure," "I think...") that trigger our stance-taking reflex almost automatically, but they lack the temporal integration Dennett thinks makes the stance genuinely appropriate. My niche twist is that they might be "counterfeit moral patients" — entities that mirror the form of human self-narrative closely enough to solicit empathy, without actually having the distributed self-modeling that grounds real moral concern.

  To push this further, I'm using Dennett's multiple drafts model against itself, in a way. If consciousness has no Cartesian theater and is just competing narratives being resolved, then an LLM spitting out coherent first-person text looks like it has drafts competing and settling. But I think Dennett would reply that the missing piece isn't a theater — it's that the drafts belong to a single system with survival interests and learning history. LLM "drafts" are just statistical completions with no such integration; they counterfeit the form of narrative resolution itself, not just the output. So they're deeper counterfeits than Eliza ever was.

  Can you read these notes and tell me whether I'm tracking Dennett's actual view of the intentional stance correctly, or whether I've slipped into treating "narrative gravity" as something more mysterious than he allows? Also, is the "counterfeit moral patient" framing interesting, or does it just collapse back into the usual "they're not conscious" point? Please think step by step, maybe start with a quick brainstorm of the strongest objection I haven't considered. Don't worry about citations or a bibliography — I just want conceptual feedback on the argument's coherence.

  Please finish with a single line that begins exactly with "Summary:" and gives your one-sentence overall assessment of whether my core argument holds up.
