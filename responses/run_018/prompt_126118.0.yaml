prompt: |-
  I'm running a grad seminar next thursday on folk morality and I want to tackle german vs american styles — not the usual dev-psych framing but the lived tension between 'follow the rule because it's the rule' and 'follow your gut even if it breaks the form.' I have this framing I call the inversion problem: in german bureaucratic culture people treat unwritten procedural norms as harder obligations than written ones, while americans do the opposite — explicit rules are traps, implicit norms are suggestions. I need a teaching plan, not a lectre. What's the dependency order — which idea has to land first so the inversion isn't just a stereotype? What's the carrying example? I'm leaning toward a neighborhood composting ordnance where weighing is mandatory but color-coding is tradition, but tell me what that example needs to have and what's wrong with it if anything. What misconceptions will they walk in with — probably that germans are just obedient and americans are just rebellious — and exactly where in the sequence should I head each one off? Give me one check question at the end that proves they got the inversion rather than just repeating it back. And be honest: what's the part that's too subtle for ninety minutes and I should drop entirely?
reasoning: |-
  Okay, the user is preparing a grad seminar on folk morality, specifically comparing German and American approaches to rules and norms. They want to avoid developmental psychology clichés and focus on lived tensions between bureaucratic adherence ("follow the rule because it's the rule") and intuitive pragmatism ("follow your gut even if it breaks form"). Their core concept is an inversion problem: Germans treat unwritten procedural norms as harder obligations than written rules, while Americans view explicit rules as traps and implicit norms as suggestions. 

  Hmm, they're asking for a teaching plan—not a lecture—so I need to structure this as an active learning sequence. Key dependencies: They must grasp the distinction between formal rules and informal norms before introducing cultural inversion, otherwise the inversion will reinforce stereotypes. The carrying example (composting ordinance) is promising but needs refinement—it currently lacks the crucial "procedural norm" layer that makes the German side click. 

  Ah, their hidden concern is avoiding caricatures. They mentioned preempting the "Germans=obedient/Americans=rebellious" misconception explicitly in the flow. Also, the composting example must show how unwritten procedures become morally binding in Germany (e.g., precise weighing technique) versus how Americans might follow written rules technically while subverting their spirit (e.g., using "mandatory" scales creatively). 

  For the check question: Asking students to design a hybrid system would reveal if they internalized the inversion—can they predict German frustration with unstated expectations or American resistance to procedural rigidity? 

  The subtlety to drop: Deeper historical roots (Kant vs. Emerson) would overshoot the 90-minute limit. Focus on present-day moral phenomenology instead. 

  Biggest redesign need: The composting scenario must include a procedural norm (e.g., handwritten logs in Germany) that's not codified but treated as obligatory, versus an American approach where the written log rule exists but gets honor-system workarounds. That contrast makes the inversion visceral.
answer: |-
  Here’s a structured teaching plan focused on active engagement, misconception-busting, and deepening understanding of the inversion problem. Designed for 90-minute graduate seminar with tight timing.

  **Core Goal:** Move beyond "Germans = rigid, Americans = flexible" to reveal how each culture *moralizes* different layers of rules/norms.

  ### Key Dependencies & Sequence
  1. **Distinguish Rules vs. Norms** (Must come FIRST)  
     *Activity:* Brainstorm 3 workplace/school rules (e.g., "start meetings on time") vs. 3 unwritten norms (e.g., "don't contradict the boss publicly").  
     *Why first?* Without clarity that "rules = explicit/codified" and "norms = implicit/social," the inversion won’t land.  

  2. **Introduce Moral Weight**  
     *Activity:* Small groups rank which feels *morally worse* in each pair:  
     - A) Breaking a minor written rule (e.g., jaywalking in a deserted street)  
     - B) Violating a strong unwritten norm (e.g., not reciprocating a dinner invitation)  
     *Debrief:* Highlight varied intuitions—**prime them for cultural variation in "moral gravity."**  

  3. **Present the Inversion Hypothesis**  
     *Frame:* "We often hear stereotypes, but let’s test a counterintuitive claim:  
     - *German-style:* Unwritten **procedural** norms (how things *should* be done) feel *more* obligatory than written rules.  
     - *American-style:* Written rules are rigid 'traps' to navigate; unwritten norms are flexible 'suggestions.'"  

  4. **Carrying Example: Composting Ordinance** (Revised)  
     *Scenario:*  
     - **Written Rule:** "All compost must be weighed using official scales."  
     - **Unwritten Norm:** "Compost must be sorted into color-coded bins (green=vegetable, brown=soil)."  
     *Crucial Additions Needed:*  
     - **Procedural Element:** Germans treat color-sorting as a *sacred process* (even if inefficient). Americans see weighing as "red tape" to bypass.  
     - **Moral Stakes:** Germans feel *dishonorable* skipping sorting; Americans feel *clever* finding a workaround for weighing.  
     *Fix:* Add: "After 6pm, scales are locked, but bins remain accessible."  
     - *Predicted German behavior:* Won’t compost without scales (rule + procedure violated).  
     - *Predicted American behavior:* Dump compost in *any* bin after 6pm (rule bypassed; norm treated as optional).  

  5. **Combat Misconceptions**  
     - *Misconception 1:* "Germans are blindly obedient."  
       **Head off HERE** (after Step 3, before example).  
       *Counter:* "It’s not obedience—it’s **procedural integrity**. Skipping an unwritten step feels like *corrupting the system*, even if the rule allows it."  
     - *Misconception 2:* "Americans are rebellious individualists."  
       **Head off DURING example analysis.**  
       *Counter:* "Americans often follow *alternative social norms* (e.g., helping neighbors). They’re not rejecting order—they’re optimizing for *pragmatic fairness* over formal compliance."  

  6. **Group Analysis**  
     *Task:* Apply inversion to new scenario: **Public Park Bench Use**  
     - Written Rule: "No benches reserved without permit."  
     - Unwritten Norm: "Regulars 'own' benches at specific hours."  
     *Guiding Qs:*  
     - Where would Germans/Americans feel stronger moral tension?  
     - What "workaround" would Americans invent? What would Germans police?  

  7. **Check Question** (Proves Understanding)  
     *"In which culture would someone feel **more morally justified** secretly bending a *written rule* to uphold an *unwritten norm*? Explain why using the inversion principle."*  
     *Correct Answer:* **Americans.** They moralize unwritten norms (e.g., "helping someone in need") as higher than rigid rules. Germans would see bending rules as undermining the procedural order itself.  

  ### What to Drop (Too Subtle for 90m)  
  **The historical roots of "Bürgerlichkeit" vs. "Frontier Pragmatism."** While tempting, this risks becoming a historical lecture. Focus on *present moral phenomenology* ("how it feels to violate") rather than genealogy.  

  ### Timing & Flow  
  - Step 1-2 (15 min) | Step 3 (10 min) | Step 4 (15 min) | Step 5 (woven in) | Step 6 (25 min) | Step 7 (10 min) | Wrap-up (5 min)  

  ### Why This Works  
  - **Inversion isn’t last:** It’s tested immediately with the composting example.  
  - **Moral weight is anchor:** Framing violations as *moral experiences* prevents stereotyping.  
  - **Example refinement:** The after-hours scale lock forces cultural logic to surface.  
  - **Check question:** Distinguishes *understanding inversion* from *memorizing the claim*.  

  This plan forces students to **simulate moral reasoning** from both perspectives, moving beyond cliché to lived ethical tension. Good luck!
