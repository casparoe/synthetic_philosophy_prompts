  The user's core ideas involve standing to blame, hypocrisy gradients, and the distinction between structural vs. agential failure. Their key insight is that communities seem to operate with a two-tiered standing model: "implicated standing" for those connected to the wrong-type, and "disinterested standing" for outsiders. They propose adding "hypocrisy gradients" where standing erodes proportionally based on similarity of past failures, weighted by temporal distance, visibility and social proximity.

  I need to address their four specific questions methodically. For question 1 about whether the practice presupposes relational standing versus control-based responsibility: The evidence points strongly toward relational authority. The fact that structurally compelled failures retain some standing while agential ones don't suggests community membership matters more than pure control. Control-based views can't explain why outsiders get full standing regardless of structural position.

  For question 2 on hypocrisy gradients' coherence: This is actually quite innovative and avoids binary pitfalls. By making standing proportional to the "mirror distance" between blamer's past and present wrongs, with modifiers for recency and visibility, it creates a nuanced spectrum. I should note potential boundary issues but affirm its conceptual soundness.

  Question 3 about instability at the structure/agency boundary: This is the trickiest part. The distinction often collapses in practice - what appears structural might involve hidden agency, and "choices" are constrained by context. I'll suggest reframing it as a continuum and emphasizing power differentials rather than pure categories.

