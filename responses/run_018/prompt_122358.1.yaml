answer: |-
  Here's a decision procedure that meets your criteria: defensible, transparent about guesswork, and executable in 30 minutes per SKU using existing data. It prioritizes **verifiable impacts** over philosophical debates, with clear "values call" flags. The scoring unit is **Vertebrate Suffering-Equivalent per kg (VSE/kg)**, weighting both death count and suffering intensity.

  ---

  ### **The Decision Procedure: 7 Steps to Welfare Score**
  *(Flagged 🚩 = Values call | Flagged 🔍 = Data gap/guesswork)*

  1. **COUNT DIRECT VERTEBRATE DEATHS**  
     *Q: How many vertebrates (mammals/birds/fish) die directly to produce 1kg?*  
     - Meat: `(1 / kg meat per animal)`  
     - Dairy: `(1 cow + 0.5 calf)`¹ `/ lifetime milk yield`  
     - Eggs: `(1 hen + 0.5 male chick)`¹ `/ lifetime eggs`  
     - Plants: **0**  
     *🚩 Values call: Excludes insects, crustaceans, wild fish bycatch.*  
     *🔍 Data gap: Slaughter yield, cull rates vary by farm.*

  2. **ADD CROP DEATH BURDEN**  
     *Q: How many vertebrate crop deaths (rodents/birds) are embedded?*  
     - Use **economic allocation**:  
       `Crop deaths/kg product = (Crop $ value fed to animals / Total crop $ value) × Vertebrate deaths/kg crop`  
     - For **grass-fed beef**:  
       - If pasture requires **fertilizer/pesticides**: Count as crop death burden.  
       - If truly "wild" pasture: **0 burden** (accept supplier claim).  
     *🚩 Values call: Economic allocation avoids arbitrary mass splits.*  
     *🔍 Data gap: Local vertebrate death rates per crop (use regional averages).*

  3. **WEIGHT BY SUFFERING INTENSITY**  
     *Q: What's the average daily suffering vs. natural baseline?*  
     - Score: **1–10 scale** (1=minimal stress, 10=extreme suffering):  
       - Broilers: **8** (overcrowding, lameness)  
       - Grass-fed cows: **3** (pasture access, but weaning/dystocia)  
       - Dairy cows: **6** (calving separation, mastitis)  
       - Crop rodents: **4** (habitat disruption, quick death)  
     - Multiply death count by `(Score / 5)` to normalize to baseline suffering.  
     *🚩 Values call: Suffering scale subjectivity. Anchor to peer-reviewed welfare studies.*  
     *🔍 Data gap: Farm-specific conditions (use industry norms).*

  4. **ADJUST FOR LIFESPAN COMPRESSION**  
     *Q: How much was lifespan shortened vs. natural life?*  
     - Multiply by `(Natural lifespan / Actual lifespan)`:
       - Broilers: `(6 years / 6 weeks) = 52×`  
       - Beef cows: `(20 years / 18 months) = 13.3×`  
       - Crop rodents: `(2 years / 1 year)`² = **2×**  
     *🚩 Values call: Natural lifespan definition (use species max).*

  5. **HANDLE FORGONE LIVES**  
     *Q: Do we credit "unborn animals" from plant alternatives?*  
     - **Exclude entirely**.  
     *Rationale: Unverifiable counterfactuals; outside operational scope.*  
     *🚩 Values call: Explicitly reject "potential life" arguments.*

  6. **CALCULATE VSE/kg**  
     `VSE/kg = [Direct deaths × Suffering score × Lifespan compression] + [Crop deaths × Suffering score]`

  7. **REVIEW & FLAG UNCERTAINTY**  
     - Document **3 scores**:  
       - **Best case** (low suffering/short lifespan)  
       - **Likely case** (industry average)  
       - **Worst case** (high suffering/long lifespan)  
     - Flag 🔍 where data is guessed.

  ---

  ### **Applied to Your 3 Products**  
  *Using industry averages; **🔍 = guessed data***

  #### **Broiler Chicken**  
  1. Direct deaths: `1 death / 2.5kg meat` = **0.4 deaths/kg**  
  2. Crop deaths:  
     - Feed: 2.8kg crops/kg meat 🔍  
     - Vertebrate deaths: 0.2/kg crop 🔍  
     - Allocation: 100% to feed (no human food co-product)  
     - Total: `2.8 × 0.2 = 0.56 deaths/kg`  
  3. Suffering: **8/10**  
  4. Lifespan compression: `(6 years / 0.115 years) = 52×`  
  5. **VSE/kg = (0.4 × 8 × 52) + (0.56 × 8) = 166.4 + 4.5 = 170.9**  

  #### **Grass-Fed Beef**  
  1. Direct deaths: `1 death / 250kg meat` = **0.004 deaths/kg**  
  2. Crop deaths:  
     - Pasture: **0** (accepting supplier's "no inputs" claim)  
     *If fertilizer used: Add 0.02–0.1 VSE/kg 🔍*  
  3. Suffering: **3/10**  
  4. Lifespan compression: `(20 years / 1.5 years) = 13.3×`  
  5. **VSE/kg = (0.004 × 3 × 13.3) + 0 = 0.16**  

  #### **Almond Milk**  
  1. Direct deaths: **0**  
  2. Crop deaths:  
     - Almonds: 0.05kg almonds/kg milk 🔍  
     - Vertebrate deaths: 0.1/kg almonds 🔍  
     - Allocation: 100% to milk (no co-products)  
     - Total: `0.05 × 0.1 = 0.005 deaths/kg`  
  3. Suffering: **4/10** (rodents/birds)  
  4. **VSE/kg = 0 + (0.005 × 4) = 0.02**  

