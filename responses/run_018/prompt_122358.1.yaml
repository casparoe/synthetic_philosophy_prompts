  ### **Results & Key Insights**  
  | Product       | VSE/kg (Likely) | Range (Best-Worst) |  
  |---------------|-----------------|--------------------|  
  | Broiler chicken | 170.9          | 120–220 🔍         |  
  | Grass-fed beef | 0.16           | 0.01–0.3*          |  
  | Almond milk   | 0.02           | 0.005–0.05 🔍      |  

  ***(*) Assumes no pasture inputs; jumps to 0.5–5 VSE/kg if fertilized.***

  **Almond milk wins** (lowest VSE), but **grass-fed beef beats chicken** by 1,000× in this model. However:  
  - **Broiler chicken's score is dominated by suffering-lifespan multiplier** (not death count).  
  - **Beef's low score hinges on pasture claims**—audit fertilizer use!  
  - **Almond uncertainty is high**—rodent death rates vary by orchard.  

  ---

  ### **Operational Checks for Buyers**  
  1. **Demand transparency**: Require suppliers to document pasture inputs, slaughter yields.  
  2. **Use ranges**: Present best/likely/worst scores to show uncertainty.  
  3. **Freeze assumptions**: Publish suffering scores and lifespan compressions annually (no ad-hoc changes).  
  4. **Flag guesswork**: Highlight 🔍 in reports. Example: *"Almond rodent deaths: Industry avg used; actual may vary 300%."*  

  This system prioritizes **auditable data** over philosophy, delivers a clear ranking, and exposes where supplier disputes require evidence (e.g., pasture inputs). Almond milk wins, but pasture management is the wildcard.
