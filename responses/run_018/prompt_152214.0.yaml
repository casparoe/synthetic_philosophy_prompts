  I am preparing notes for a graduate seminar on rational agency, and I have grown dissatisfied with the usual textbook presentations of counterfactual mugging and XOR blackmail. Rather than treating them as standalone paradoxes for evidential decision theory, I want to analyze them through a framework I have been developing around counterfactual liability—the rational obligation to honor commitments that bind only in unrealized worlds—versus counterfactual entitlement, the claim that an agent may draw benefits from counterfactual scenarios solely when a specific symmetry condition is satisfied.

  Please compare counterfactual mugging and XOR blackmail across exactly five dimensions: (1) the logical architecture of the predictor's or blackmailer's commitment mechanism; (2) whether the agent faces a single counterfactual conditional or a paired XOR structure that blocks dominance reasoning; (3) the differential application of counterfactual liability in each scenario; (4) the respective challenges each case poses to evidential versus causal decision theory; and (5) which of the two ultimately undermines more severely the principle that rational choice should depend only on actual-world causation. Present your answer as a numbered list with exactly five items, each a sentence or two, with no introduction or conclusion.
