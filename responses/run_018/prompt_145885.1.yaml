  ## Bureau of Diachronic Consent (BDC)  
  **Frequently Asked Questions Regarding Temporal Autonomy Directives (TADs)**  
  *(Revision 7.3, Mandatory Compliance Date: [REDACTED])*

  **Q1: What is a Temporal Autonomy Directive (TAD)?**  
  A: A Temporal Autonomy Directive (Standard Form BDC-101 "Chronos Compact") is a legally binding document executed by an individual ("Past Self," designated as PS), establishing binding instructions, preferences, and restrictions upon their future self ("Future Self," designated as FS) for a period not exceeding 40 years post-execution, or until declared Psychologically Continuous (see Q7).

  **Q2: Why would my Past Self (PS) need to control my Future Self (FS)?**  
  A: The Bureau recognizes the inherent instability and potential irrationality of future temporal states. Your PS, typically assessed at peak cognitive efficiency (ages 18-30), possesses a calibrated foresight and value structure deemed optimal for long-term life trajectory management. The TAD ensures stability, prevents regrettable value drift ("Epistemic Slip"), and honors the sovereign autonomy of the originating temporal node.

  **Q3: How binding is my PS's TAD?**  
  A: Extremely binding. Barring successful petition for Psychological Continuity Bankruptcy (PCB, see Q7) or annulment by the Family Precedent Tribunal (FPT, see Q4), the directives outlined in Form BDC-101 supersede all subsequent preferences, desires, or changed circumstances of the FS. Non-compliance constitutes a Category 3 Temporal Breach, punishable by mandatory Recalibration Counseling (BDC Form 701) and potential imposition of Ideological Conservatorship (BDC Regulation Δ-t-5).

  **Q4: What is the Family Precedent Tribunal (FPT)? How does it assess PS competence?**  
  A: The Family Precedent Tribunal (Convened under BDC Statute §88 "Familial Continuity") is an ad-hoc body composed of biologically or legally recognized kin (minimum 3 members, maximum 5, excluding pets and step-relations beyond second degree). Upon petition by FS or a concerned kin member (Form BDC-240 "Petition for Diachronic Competency Review"), the FPT evaluates whether the PS, *at the time of signing the TAD*, exhibited consistency with established "family character."

  **Q4a: How does the FPT determine "family character" and PS consistency?**  
  A: The FPT employs common-law reasoning, reviewing verifiable precedents from the petitioner's life history. Did the PS reliably adhere to core family values (e.g., thrift, piety, career ambition, aversion to specific genres of music) in the years preceding TAD execution? Were significant life choices (college major, first vehicle purchase, rejection of unsolicited advice from Aunt Mildred) consistent with familial expectation patterns? Evidence may include childhood report cards, holiday card messages, sworn testimony regarding lawn-mowing diligence, or documented instances of refusing dessert. Inconsistency with these precedents may render the PS's TAD voidable, subject to FPT majority vote and BDC ratification (Fee Schedule Γ applies).

  **Q5: My PS mandated I remain a vegan, but I (FS) now deeply crave steak. Is exemption possible?**  
  A: Dietary preferences outlined in Section 3(c) of Form BDC-101 ("Sustenance and Bodily Input Protocols") are generally non-modifiable. Craving constitutes evidence of value drift, not grounds for exemption. You may petition the FPT if PS's documented childhood aversion to broccoli (if established as a family precedent) suggests an inherent inconsistency in their dietary absolutism. Otherwise, consult the BDC-approved list of TAD-compliant nutritional supplements (Bulletin N-δ).

  **Q6: My PS forbade having children. I (FS) am now 42 and desperately want a family. What recourse exists?**  
  A: Procreative directives (Section 4, "Generative Continuity Waivers/Restrictions") are classified as Tier-1 Immutable Directives. Your desire is irrelevant to the contractual obligation established by your PS. Recourse is limited to:
  1.  **FPT Petition:** Demonstrate that PS's stance violated a strong family precedent (e.g., lineage obsession, documented PS childhood enjoyment of babysitting).
  2.  **PCB Declaration:** Argue that the value shift regarding progeny constitutes an "Irremediable Discontinuity" (see Q7).
  3.  **Compliance:** Explore BDC-sanctioned alternatives like elaborate aquarium maintenance or sponsoring a distant relative (Form BDC-515 "Proxy Progeny Designation").

  **Q7: What is Psychological Continuity Bankruptcy (PCB)?**  
  A: PCB (Regulation Ψ-9) is a legal mechanism whereby an FS formally declares an "Irremediable Discontinuity" between their current psychological state and the value structure of the PS who executed the TAD. This is not mere disagreement; it requires demonstrating a fundamental rupture in core beliefs, desires, or identity such that the PS is effectively a "different person" under BDC definitions (quantifiable drift exceeding 70% on the Kluge-Hartmann Continuity Index, assessed via mandatory 8-hour psychometric battery, Form BDC-666).

  **Q7a: What happens if PCB is declared and granted?**  
  A: Upon successful PCB declaration (approved by a BDC-appointed Temporal Auditor), the FS is placed under "Ideological Conservatorship." A "Trustee Self" (TS) is computationally derived from the last verified psychologically continuous state (usually PS+5 years) or, if unavailable, the PS itself via archival data. The TS assumes legal authority over all major life decisions (career, residence, relationships, leisure activities) to realign the FS's trajectory with the PS's original intent. The FS retains control only over minor daily functions (e.g., sock selection, brand of toothpaste) pending successful Reintegration Therapy (minimum 5 years).

  **Q8: Can I update my TAD as my FS?**  
  A: No. Form BDC-101 is executed solely by the PS. Attempting modification by the FS constitutes fraud (Statute τ-12 "Chronological Tampering"). Your PS made the binding choices. Your role is compliance. Consideration of future value change is built into the TAD structure via the PS's original instructions; if your PS failed to anticipate your current desire for a motorcycle or a career in interpretive dance, that is a deficiency in their foresight, not a flaw in the system. You may file a "Prospective Grievance" (Form BDC-99) to be archived for the *next* PS (i.e., your current self signing a *new* TAD binding your 65-year-old self).

  **Q9: This seems unfair to the FS. Doesn't the FS have rights?**  
  A: The Bureau operates under the principle of "Diachronic Sovereignty." Your FS possesses rights *derived solely from the delegation of authority by your PS* via the TAD. The PS is the foundational legal persona; the FS is its temporal extension bound by its prior, competent will. Perceived unfairness is often a symptom of Epistemic Slip or insufficient TAD foresight by the PS, not a systemic error. Complaints regarding perceived injustice should be submitted via Form BDC-0 ("Existential Lament – For Recordkeeping Purposes Only").

  **Q10: Where do I file forms or get help?**  
  A: All forms must be submitted in triplicate via ChronoPost to your regional BDC Office. In-person assistance is unavailable due to potential temporal contamination risks. Consult the BDC website ([REDACTED FOR SECURITY]) or the comprehensive *Guide to Temporal Compliance* (BDC Publication 13-Ω, available for purchase via SASE and 15 years of patience).

