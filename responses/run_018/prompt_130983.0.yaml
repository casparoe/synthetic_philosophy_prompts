  Here’s a dialogue between **Alex** (arguing for special obligations to compatriots) and **Jamie** (arguing for equal moral concern regardless of borders), set against the scenario you described:

  ---

  **Setting:** *Alex and Jamie are sitting at their kitchen table, discussing the news about a limited stockpile of emergency medical supplies that could be sent either to Riverton (a struggling neighboring city in their country) or to the flood-ravaged region of Sagar (a much poorer area across the border).*  

  **Alex:**  
  "Okay, look—I get that Sagar’s needs are desperate. But Riverton is *our* people. We vote in the same elections, pay into the same safety nets, and rely on each other every day. When you chip in taxes, or follow laws, or even just share a national identity, it’s not *just* sentiment. It’s a web of mutual responsibility. If we abandon Riverton now, we’re breaking that trust. What holds a society together if not that?"  

  **Jamie:**  
  "I hear you, but ‘our people’ is a line on a map drawn by dead politicians. A kid drowning in Sagar hurts as much as one in Riverton. Distance doesn’t make her pain less real. And those ‘shared institutions’ you mention? They’re *designed* to favor insiders—that’s the problem. Why is someone worth more because they’re born on this side of a river? We didn’t choose where we were born. Morally, suffering is suffering."  

  **Alex:**  
  "It’s not about worth—it’s about reciprocity and stability. Riverton’s factory just shut down; their hospital’s overwhelmed. If we let our own systems collapse helping others, we’ll *all* be worse off long-term. Plus, it’s practical: we know Riverton’s needs, we share infrastructure, and we’re accountable to them. Send supplies to Sagar, and corruption or bad logistics might waste them. Here, we can actually *deliver* help."  

  **Jamie:**  
  "Accountability cuts both ways. If we only help ‘our own,’ we’re ignoring that our country’s choices—trade policies, carbon emissions—*created* some of Sagar’s suffering. And don’t pretend Riverton’s systems are flawless. But fine, say logistics are easier locally: that’s a practical argument, not an ethical one. Ethically, if we can save ten lives in Sagar for every one in Riverton, how do we justify *not* doing that? ‘Patriotism’ just seems like tribalism scaled up."  

  **Alex:**  
  "Tribalism? No. Shared citizenship means we’ve built something together. You opt into it—by staying, voting, contributing. That creates real duties, like family obligations. You wouldn’t feed a stranger’s child before your own niece, even if the stranger’s kid is hungrier. That doesn’t mean the stranger doesn’t matter—it means loyalty isn’t arbitrary. Without that, society unravels."  

  **Jamie:**  
  "But nationality isn’t like family—it’s involuntary. You’re born into it. And if loyalty demands we prioritize Riverton’s smaller crisis over Sagar’s catastrophe, isn’t that just bias? Imagine you didn’t know where you’d be born—Riverton, Sagar, or anywhere. Would you design a world where aid follows flags, or need? Borders *are* random. Our obligation is to humans, not citizens."  

  **Alex:**  
  "Random? Maybe. But they’re not meaningless. Those borders define communities that pool resources, solve problems, and protect rights. If we ignore that—if we treat the world as one giant pool—you dilute the incentive to build those communities in the first place. Why would Riverton’s taxpayers fund medical stockpiles if they know supplies will *always* go elsewhere? Systems break without mutual commitment."  

  **Jamie:**  
  "And why should Sagar build systems when they’re crushed by poverty we helped create? I agree—local systems matter. But when they fail the neediest, we can’t hide behind borders. Sending aid to Sagar isn’t ‘ignoring’ Riverton; it’s triaging a moral emergency. If your ‘community’ only helps its own while others drown, is it ethical? Or just a bigger tribe?"  

  **Alex:**  
  "...Maybe it’s both. But I think dismissing what holds societies together—trust, shared sacrifice—is naive. We *can* help Sagar too, just not with *these* supplies. We fix Riverton first so we’re strong enough to help others sustainably. Letting your neighbor’s house burn to save a stranger’s isn’t noble; it’s shortsighted."  

  **Jamie:**  
  "And letting the stranger burn because they’re outside your fence isn’t justice—it’s luck. We can walk and chew gum: shore up Riverton *and* aid Sagar. But if we *must* choose? I’ll pick saving more lives. Always. Even if it’s messy. Even if it’s far away."  

  **Alex:**  
  "…And I’ll pick maintaining the community that lets us save *anyone* at all."  

  ---  

  **Key Points Raised:**  
  - **Alex** grounds obligations in reciprocity, practical efficacy, and social stability.  
  - **Jamie** argues suffering is universal, borders are arbitrary, and ethics demand impartiality.  
  - Both acknowledge the other’s concerns (e.g., Alex admits Sagar’s suffering matters; Jamie concedes local systems have value).  
  - Neither is "stupid"—Alex appeals to real-world cohesion; Jamie to moral consistency.
