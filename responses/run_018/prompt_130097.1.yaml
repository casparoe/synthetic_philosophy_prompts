  We are grading an essay in response to the prompt about G.E. Moore's proof of an external world. The student's essay is about 400 words and we are focusing on the middle part that the grader is unsure about. The essay makes several points:

  1. Distinguishes proving the existence of an external world from proving that Moore knows there is one.
  2. Says Moore takes the existence of his hands as premises that are more certain than any philosophical argument for skepticism.
  3. Claims Moore's strategy depends on direct realism about perception (we literally see objects without inference).
  4. Uses direct realism to explain why the skeptic's denial is self-refuting.
  5. Says Moore shifts the burden of proof onto the skeptic by invoking common sense as an epistemic principle.
  6. Argues that if the skeptic denies Moore has hands, then the skeptic must deny Moore can speak (which the grader thinks is a non-sequitur).

  We need to assign a letter grade between B+ and C (so from B+, B, B-, C+, C, C-). We must be critical and not let confident writing slide over mistakes.

  Key points from Moore's actual argument and the critical response:

  - Moore's proof: He holds up his hands and says "Here is one hand" and "Here is another". He claims that from this we can infer the existence of external objects (hands) and hence an external world.
  - He does not claim to prove that he knows there is an external world, only that there is one. So the student is correct to note the distinction between proving existence and proving knowledge of existence.
  - Moore's point is that his premises (that he has hands) are more certain to him than the premises of any skeptical argument (like the possibility of dreaming or being deceived by an evil demon). So the student is correct on this.
  - Direct realism: Moore does hold a form of direct realism. He thinks we directly perceive external objects. However, the connection to the argument being circular is that the skeptic might argue that we don't directly perceive hands but only sense data, and then Moore's premise (that he has hands) would be question-begging because it assumes the existence of external objects. The student uses direct realism to say the skeptic's denial is self-refuting. This is a bit of a stretch. Moore does think the skeptic's argument is less certain, but not necessarily self-refuting. The self-refutation charge might come in if the skeptic uses premises that are less certain than Moore's, but that's not exactly self-refutation in the classic sense (like the liar paradox). It's more about comparative certainty.
  - Shifting the burden of proof: This is a common interpretation. Moore is saying that common sense beliefs have a default status and the skeptic must provide a positive argument to overthrow them. The student is right on this.
  - The last point: The student says that if the skeptic denies Moore has hands, then the skeptic must deny Moore can speak. This is a non-sequitur. Having hands is not necessary for speaking. Moore could be a brain in a vat and still speak (if the evil demon is making him think he has hands and is speaking). So this is a clear error.

  Subtle errors in the essay:

  1. The claim that the skeptic's denial is self-refuting: This is not exactly what Moore argues. Moore's point is that the premises of the skeptical argument (e.g., that we might be dreaming) are less certain to him than the premise that he has hands. So he rejects the skeptical argument on the basis of comparative certainty, not because it is self-refuting. Saying it is self-refuting is a mistake and misrepresents Moore.

  2. The non-sequitur about the hands and speaking: This is a clear error. The existence of hands is not a necessary condition for speaking. Thus, it is an invalid inference.

  Strengths:

  - Correctly distinguishes proving the existence of the external world from proving knowledge of it.
  - Correctly identifies that Moore takes the premises (existence of hands) as more certain than the skeptical conclusion.
  - Correctly notes the role of direct realism (though the connection to self-refutation is flawed).
  - Correctly points out that Moore shifts the burden of proof.

