prompt: |-
  hey, i'm grading finals for phil 201 (skepticism and common sense) and i need a second pair of eyes on one essay cause im not totally sure about the middle part. the exam prompt was: G.E. Moore claims he can prove there's an external world by holding up his hands and saying here is one hand, and here is another. Critics say this just begs the question against the skeptic. Is Moore's argument circular? In your answer, be precise about what Moore takes himself to have shown, and about whether his premises are more certain than the skeptical conclusion he rejects.

  the student writes about 400 words. they distinguish proving there's an external world from proving he knows there's one, and they say moore takes the existence of his hands as premises more certain than any philosophical argument for skepticism. then they claim moore's strategy depends on direct realism about perception — that he thinks we literally see objects without any inferential step — and they use this to explain why he thinks the skeptic's denial is self-refuting. they also say moore shifts the burden of proof onto the skeptic by invoking common sense as an epistemic principle. finally, they argue that if the skeptic denies moore has hands, then the skeptic must deny moore can speak, which seems like a non-sequitur but maybe im missing something.

  can you grade this? i want a letter grade in the B+ to C range, plus point-by-point comments that justify it. please return a JSON object with exactly these fields: "grade" (string), "summary" (one sentence), "strengths" (array of strings), "subtle_errors" (array of strings, each describing one mistake and why it's wrong), "grade_justification" (string explaining the letter), and "would_pass" (boolean, true if B- or above). dont let the mistakes slide just cause the writing sounds confident — call out precisely whats wrong and why it matters for understanding moore.
