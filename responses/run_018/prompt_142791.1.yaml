answer: |-
  Here's a sequence of targeted questions designed to pressure-test empirical distinguishability, challenge deflection tactics, and push for falsifiability, structured as requested:

  **I. Probing Blindsight & Reportability**  
  1. "Blindsight patients exhibit accurate forced-choice behavior *without* phenomenal consciousness or reportability regarding stimuli. On Shadow Broadcasting (SB), local recurrent loops *are* phenomenally conscious but isolated from the global workspace. Why doesn't this local isolation consistently produce blindsight-like behavior—where subjects *deny* seeing the stimulus despite its local recurrence? Isn't SB forced to say blindsight involves *unconscious* local recurrence, making local recurrence neither necessary nor sufficient for phenomenality?"  
     *Follow-up: If you argue blindsight's local processing *lacks* recurrence, what specific neural signature distinguishes a 'shadow-conscious' recurrent loop from a blindsight-capable but unconscious loop in V1?*

  **II. Split-Brain Challenges to Isolation & Reconstruction**  
  2. "In split-brain patients, the right hemisphere can't verbally report left-visual-field stimuli but can act on them (e.g., drawing). SB claims phenomenal consciousness is isolated in the right hemisphere's local loop, yet the left hemisphere—generating verbal reports—lacks access and reconstructs nothing. How does SB explain why the conscious right-hemisphere experience isn't *reconstructed* by the left hemisphere's interpretive system post-hoc, given that reconstruction is central to your account of reportability?"  
     *Follow-up: Doesn't this suggest SB either (a) multiplies unreportable 'islands' of consciousness ad hoc, or (b) implicitly admits that global availability *is* necessary for reportable phenomenology—contra SB's core claim?*

  **III. Collapsing Phenomenal & Access: Over-Generation Problem**  
  3. "SB identifies phenomenal consciousness with local recurrent processing actively *shielded* from global broadcasting. But much early sensory processing (e.g., V1 edge detection) involves local recurrence. If recurrence alone suffices for phenomenality, does SB imply that a mouse's V1 has edge qualia? If not, how do you prevent SB from over-generating phenomenal states in phylogenetically ancient circuits without invoking functional access?"  
     *Follow-up: When you argue this is a 'framing issue', what empirically testable criterion *beyond* local recurrence does SB propose to delineate genuinely phenomenal loops from merely recurrent unconscious ones?*

  **IV. Falsifiability & Unique Empirical Predictions**  
  4. "What specific neural or behavioral finding would falsify Shadow Broadcasting? For instance: If we decoded vivid, reportable phenomenal content from prefrontal cortex *before* it correlated with recurrent activity in sensory regions, would that undermine SB? Or if we induced local recurrence in area MT (motion processing) via microstimulation but the subject reported *no* motion phenomenology despite behavioral utilization of the signal?"  
     *Follow-up: Could SB accommodate those results without becoming unfalsifiable—e.g., by claiming the stimulated loop 'wasn't recurrent enough' or the PFC decoding 'wasn't truly phenomenal'? If so, doesn't that risk making SB a post-hoc reinterpretation framework rather than a testable theory?*

  **V. The Reconstruction Gambit & Epistemic Limits**  
  5. "SB holds that first-person reports are reconstructions that *misinterpret* local recurrence as global access. But this makes subjective reports systematically unreliable guides to phenomenology's structure. What then is the empirical basis for *any* theory of consciousness—including SB—if not ultimately constrained by reportability? Doesn't this reconstruction move risk making SB epistemically untouchable?"  
     *Follow-up: If all objections based on reports can be dismissed as 'reconstruction errors', what non-question-begging evidence could ever confirm SB over rivals like illusionism or GWT?*

  ---

  **Key strategic elements embedded:**  
  - **Pre-empts framing deflections** by demanding operational criteria (Q3 follow-up, Q4) and highlighting epistemic costs (Q5).  
  - **Forces neural specificity** by asking for signatures (Q1 follow-up) and falsification scenarios tied to measurable signals (Q4).  
  - **Exploits clinical dissociations** where SB’s isolated loops + reconstruction model struggle (blindsight denial vs. SB's local phenomenality; split-brain reportability gaps).  
  - **Targets over-generation** to show SB may *lower* the bar for phenomenality excessively (Q3).  
  - **Assails unfalsifiability risks** head-on (Q4 follow-up, Q5), challenging SB’s scientific utility.  

  Each question isolates a vulnerability while cornering the theory into either making testable commitments or admitting explanatory limitations.
