prompt: |-
  I was chatting with my coworker after our database had a little outage on tuesday and he joked that our whole stack "collapsed," which got me thinking about how people throw that word around for everything. Then I read something about the Bronze Age collapse and Easter Island and the Maya, and apparently historians argue about wether societies actually fail or just change into something smaller and different. I'm a backend engineer with zero philosophy background, but it sounds exactly like the debate at work over whether a service is "down" or just running in degraded mode with less features.

  So I want you to write a satirical deadpan corporate post-mortem report — like those SRE incident docs we write after an outage — about the "Late Bronze Age Collapse Incident" circa 1177 BCE. Treat the fall of Bronze Age palaces and long-distance trade networks like a distributed system failure. The humor should come from mapping real archaeological debates onto site-reliability jargon: climate stress and drought as hardware failure, the Sea Peoples as a DDoS, internal palace revolts as memory leaks, and the shift to smaller Iron Age polities as "graceful degradation to a microservices architecture." You should specifically include the Maya long decline and Easter Island's deforestation/logging outage as comparative case studies in an appendix, and invent a fictional internal metric like "Societal Availability Percentage" (SAP) to satirize the idea that "collapse" is mostly a value judgment made by people who liked the old UI. Keep it readable for someone who doesn't know archaeology but fair to people who do — don't cite real books, don't invent fake named scholars, and don't break the deadpan voice to wink at the reader. Around 700 words total.

  Please structure the response like this:

  1. The Incident Report (around 600 words): the full parody post-mortem, with sections titled Executive Summary, Timeline, Root Cause Hypotheses (Catastrophic Failure vs Graceful Reconfiguration), Comparative Case Studies (Maya, Easter Island), and Action Items.

  2. Commentary on Design Choices (around 150 words): explain which real collapse theories or positions you mapped onto which tech concepts, and whether the satire implies that societies mainly fail or merely get reconfigured.
