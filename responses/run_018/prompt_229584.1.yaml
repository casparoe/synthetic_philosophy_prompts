  ### Lesson Plan: Chomp and Nonconstructive Proofs  
  **Duration:** 75 minutes  
  **Goal:** Students experience the frustration of finding a winning first move in Chomp, then discover the strategy-stealing argument in small groups. Debrief connects to constructive vs. nonconstructive proofs and surfaces the "harmless move" assumption.  

  ---

  ### **Rules of Chomp**  
  - **Board:** Rectangular grid (e.g., 3×3). The top-right square is **poisoned**.  
  - **Players:** Alternate turns. On your turn, choose any remaining square. Remove ("chomp") that square and **all squares below and/or to the right** of it.  
  - **Losing condition:** The player who takes the poisoned square loses.  

  **Example (2×2):**  
  - Squares: `(1,1)` (top-left), `(1,2)` (poisoned, top-right), `(2,1)`, `(2,2)`.  
  - If Player 1 takes `(2,1)`, they remove `(2,1)` and `(2,2)`, leaving `(1,1)` and `(1,2)`. Player 2 must take `(1,1)` (removing both) or `(1,2)` (loses). Either way, Player 2 loses.  

  ---

  ### **Materials (Per Group of 3–4 Students)**  
  - Printed boards: **2×2**, **1×3**, **2×3**, and **3×3** (label poisoned square).  
  - Pens to mark moves.  
  - Worksheet with prompts (see timeline).  

  ---

  ### **Timeline**  

  #### **(0–10 min) Introduction & Demo**  
  - **Demo (5 min):** Play 2×2 Chomp on the board. Show:  
    - Player 1 wins by taking bottom-left (`(2,1)`).  
    - Emphasize: "We know the winning move here. But what if we don’t?"  
  - **Rules recap (3 min):** Re-explain moves/loss condition.  
  - **Group setup (2 min):** Divide into 8 groups (3 students each).  

  #### **(10–35 min) Small-Group Play**  
  *Groups play boards in sequence. Circulate, ask guiding questions.*  
  - **Phase 1: Warm-up (10 min)**  
    - **Board 1: 1×3** (poisoned at `(1,3)`).  
      - *Prompt:* "Who wins? Find all moves."  
      - **Goal:** Discover first player *always loses* (any move takes poison).  
    - **Board 2: 2×3** (poisoned at `(1,3)`).  
      - *Prompt:* "Find a winning first move."  
      - **Goal:** Win by taking bottom-left (`(2,1)`), removing the bottom row.  

  - **Phase 2: Frustration Zone (15 min)**  
    - **Board 3: 3×3** (poisoned at `(1,3)`).  
      - *Prompt:* "Find a winning first move. Record every attempt."  
      - **Predicted struggle:** Groups fixate on brute-forcing moves (e.g., try `(2,2)` or `(3,1)`). They’ll find wins/losses but no *consistent* strategy.  
      - **After 10 min, hint:** "What if you assume the second player has a secret winning plan? Can Player 1 ‘steal’ it?"  

  #### **(35–55 min) Guided Discovery of Strategy-Stealing**  
  - **Group discussion (10 min):**  
    - *Prompt:* "Prove Player 1 wins in 3×3 *without* finding the move. Assume Player 2 has a winning strategy. How can Player 1 exploit that?"  
    - **Nudge if stuck:** "What if Player 1 makes a ‘harmless’ first move and copies Player 2’s responses?"  
    - **Goal:** Groups articulate a flawed version of strategy-stealing.  

  - **Share ideas (10 min):**  
    - Groups report. Common flawed arguments:  
      - "Player 1 copies Player 2’s moves" → *But boards change, moves may vanish.*  
      - "Player 1 takes poison to lose fast" → *But that’s illegal.*  
    - **Write key insight on board:** "If Player 2 has a winning strategy, Player 1 can steal it by making a *safe first move* and mimicking Player 2."  

  #### **(55–70 min) Debrief & Lecture**  
  - **Nonconstructive proof (5 min):**  
    - "You proved Player 1 wins without knowing the move. This is **nonconstructive**—it shows existence without an example. Constructive proofs (like 2×2) *build* the solution."  
    - Contrast:  
      - **Constructive:** Induction, combinatorics.  
      - **Nonconstructive:** Strategy-stealing, pigeonhole principle.  

  - **The "harmless move" assumption (7 min):**  
    - Surface the hidden assumption:  
      > "The proof assumes Player 1’s first move (e.g., bottom-left) is ‘harmless’—it doesn’t disrupt Player 2’s strategy *and leaves the poison for later*. But what if Player 1’s move *accidentally blocks* Player 2’s planned responses?"  
    - **Philosophical weight:** This is why the proof is nonconstructive! We assume a "safe" starting move exists but can’t verify it without knowing Player 2’s strategy.  

  - **Real-world connection (3 min):**  
    - "Like in algorithms: Nonconstructive proofs (e.g., ‘this problem has a solution’) don’t help you compute it. Chomp shows why mathematicians care about this divide."  

  #### **(70–75 min) Wrap-up**  
  - **Summary (2 min):**  
    - Strategy-stealing proves existence nonconstructively.  
    - The "harmless move" assumption is subtle but necessary.  
  - **Preview (1 min):** "Next time: How game theory uses these ideas in more complex games."  

  ---

  ### **What Will Go Wrong (And How to Adapt)**  
  1. **Fixation on brute force:**  
     - Groups will waste time on 3×3 memorization. *Intervene early:* "Focus on *why* moves work, not just winning."  
  2. **Strategy-stealing gap:**  
     - Students won’t notice the "harmless move" flaw. *Surface it in debrief:* "What if Player 1’s move breaks Player 2’s strategy?"  
  3. **Overwhelm in 3×3:**  
     - Some groups may give up. *Use hints:* "What if Player 1 ‘passes’ the first turn? Is that fair?"  
  4. **Stealing argument too abstract:**  
     - Groups may miss the mimicry idea. *Give an analogy:* "Player 1 is a spy copying the enemy’s playbook."  

  ---

  ### **What the Game Can’t Produce (And You Must Supply)**  
  - **The gap in strategy-stealing:** Students won’t spontaneously realize that Player 1’s first move might *invalidate* Player 2’s strategy (e.g., by removing a square Player 2’s plan requires). **You must:**  
    - Explicitly state the assumption: "We assume Player 1’s move doesn’t break the strategy."  
    - Explain *why* this is acceptable in a nonconstructive proof: "We only need one winning move to exist—even if we don’t know which one avoids this problem."  
  - **Broader context:** Students won’t see how this mirrors nonconstructive proofs in other areas (e.g., Nash equilibria). **Bridge it:** "Like in Chomp, some proofs show solutions exist without telling us how to find them."  

  **Why this works:** Students *feel* the frustration of the nonconstructive proof by failing to find a move, then "discover" stealing in groups. The debrief makes the philosophy explicit.
