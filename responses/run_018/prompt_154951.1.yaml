prompt: |-
  I'm in a philosophy reading grp with some friends and last night Sam and Jules got stuck arguing about moral worth — like, whether doing the right thing for the wrong reason still counts as good in some deeper sense. I wasn't sure who was right, and I'm still a bit confused. Here's roughly how it went:

  (1) Sam said moral worth is basically about the action being right. If you anonymously donate a kidney to a stranger, it doesn't matter if you did it for fame, guilt, or compassion — the act saves a life, so it's morally worthy full stop.

  (2) Jules said that's missing the whole point of moral praise. We don't call someone virtuous just because they accidentally caused good; worth requires acting from a moral reason, like respect for the other person's dignity, not from self-interest or vanity.

  (3) Sam pushed back that Jules's view makes sympathy worthless too — if you donate because you feel awful seeing someone suffer, that's just an emotional inclination, not a moral reason. So by her standard almost nobody acts with real moral worth.

  (4) Jules replied that sympathy can count if it's properly directed, but she added a weirder condition: worth requires counterfactual stability — you'd still do it even if your non-moral motives vanished. Sam said that's impossible to check and makes moral praise just guesswork about hidden psycholgy.

  Can you go through these four moves and adjudicate them point by point? Rate each one from clearly mistaken to clearly right, say briefly who's winning on that step, and tell me what both are missing — especially whether there's any middle ground between 'only outcomes matter' and 'only hidden motives matter'. Write the bottom line first, then the breakdown. Keep it under 250 words, use British English (colour, centre, etc. where natural), and dont go over the word limit.
reasoning: |-
  Hmm, the user is in a philosophy reading group and wants me to adjudicate a debate between Sam and Jules about moral worth. They've outlined four key points in their argument and want me to rate each one, identify who's winning at each step, and find any middle ground.

  Sam takes a consequentialist position where only outcomes matter - if an action saves a life (like donating a kidney), it's morally worthy regardless of motivation. Jules represents a Kantian/deontological view where moral worth depends on acting from duty or moral reasons, not self-interest or emotions. Their debate gets quite nuanced with Sam arguing Jules' view devalues sympathy, and Jules introducing the tricky concept of "counterfactual stability" - whether someone would act the same way even without non-moral motives.

  I need to assess each of their four moves fairly. For point 1, Sam oversimplifies by ignoring motivation completely. For point 2, Jules correctly identifies the importance of motivation but might be too rigid. Point 3 shows Sam making a good point about how sympathy could be excluded, but Jules partially recovers by explaining how emotions can align with moral reasons. Point 4 highlights Jules' problematic counterfactual test which becomes impractical.

  The core tension is between consequentialism and deontology - whether morality resides in outcomes or intentions. The middle ground would be acknowledging that both matter: outcomes determine an action's rightness, while motivations determine the agent's praiseworthiness. I'll structure my response with the bottom line first as requested, then break down each point with ratings and who's winning at each step, while keeping it under 250 words using British English.
answer: |-
  **Bottom line:** Neither position fully captures moral worth; a middle ground recognises that right action is necessary but insufficient without *some* morally aligned motivation, though Jules's counterfactual test is impractical.

  **Breakdown:**
  1.  **Sam (Point 1):** **Partly Mistaken.** While the *rightness* of saving a life matters, Sam ignores motivation entirely. An act done *only* for fame lacks the praiseworthiness of one done for compassion. **Jules wins here.** Missing: Moral worth includes *why* we act, not just what we do.
  2.  **Jules (Point 2):** **Mostly Right.** She correctly identifies that moral worth requires acting from a morally relevant reason (e.g., duty, recognition of dignity), not merely good results or self-interest. **Jules wins clearly.** Missing: Acknowledging that morally good motives *can* include emotions like sympathy, not just cold duty.
  3.  **Sam (Point 3):** **Partly Right.** Sam exposes a potential flaw: if Jules dismisses *all* emotion, even sympathy, as non-moral, it becomes too restrictive. **Sam wins this point.** Missing: Sympathy *can* be part of a moral motive if integrated with moral concern.
  4.  **Jules (Point 4):** **Partly Mistaken (Counterfactual).** While the *idea* of a stable moral commitment has merit (Kant's "duty for duty's sake"), the counterfactual test ("would you still do it?") is indeed impractical and reduces praise to guesswork. **Sam wins this specific point.** Missing: A realistic way to assess motive depth without impossible thought experiments.
