prompt: |-
  So I've fallen down a rabbit hole of philosophy thought experiments lately — trolleys, famous violinists getting hooked up to you in a hospital bed, teleporters that scan you and rebuild you on Mars. Great fun. But I keep noticing something about how arguments using these actually go, and I can't figure out whether it's a known problem with a name or just me being difficult.

  The pattern is this. Someone presents a thought experiment to get you to accept some principle, and the case is set up so the answer feels totally obvious. But then the obviousness seems to depend on details that, by the arguer's own standards, shouldn't matter at all. With the trolley thing, almost everyone says pull the lever to kill one instead of five, but swap it to pushing a large stranger off a footbridge and people flip — even though the person making the argument usually insists the numbers are all that count, and by that standard the cases are identical. With the teleporter, whether it feels like *you* survive seems to hinge on stuff like whether the original body is destroyed and how the story is paced, which feels like window dressing, not the point. And then the whole argument degenerates into bickering about which details are "essential" to the case, and nobody seems to have any rule for settling that.

  So here's my question: is there an established term for this failure mode — where a thought experiment's persuasive punch comes from the dressing rather than from the principle it's supposedly testing, so an opponent can defuse it just by redescribing the case with different surface details? I know Dennett's "intuition pump" label, but that seems to be about the tool in general, not this specific weakness. And I don't think it's exactly a framing effect either, since the flip happens even when one person hears both versions side by side. If there's no name, coin one and define it so it's clearly distinct from those two, with a boundary case or two. Please answer as exactly five numbered points, a sentence or two each, with no introduction or conclusion.
reasoning: |-
  Hmm, the user is diving into philosophy thought experiments and noticing a recurring problem. They're frustrated with how arguments rely on superficial details rather than the underlying principles. For example, the trolley problem versus the footbridge version—both involve sacrificing one to save many, but people react differently. Or teleportation scenarios where the survival feeling depends on narrative elements like body destruction.

  The user wants to know if there's a term for this issue where the persuasiveness comes from non-essential details. They mention Dennett's "intuition pump" and framing effects but feel those don't fully capture it. They specifically ask for a new term if none exists, defined in five concise points.

  I recall that philosophers like Judith Thomson and Derek Parfit have discussed these experiments, but no specific term comes to mind for this exact flaw. Framing effects are close, but as the user notes, it's more about how the case is described rather than just presentation. Intuition pumps are broader tools. 

  The core issue is that the thought experiment's setup smuggles in biases through irrelevant details, which opponents can manipulate by tweaking the scenario. For instance, in the violinist case, if it were a family member instead of a stranger, intuitions might shift. This undermines the argument because the details aren't part of the principle being tested.

  I should coin a term that highlights this. "Biasing detail inoculation" could work—emphasizing how minor elements bias responses and make the experiment resistant to counterarguments through redescription. Another idea is "contingent scaffolding," focusing on the unnecessary supports that hold up the intuition. I'll go with the first one as it's more precise.

  Now, structuring the response: five numbered points, no intro or conclusion. Start with the term and definition, then explain how it differs from existing concepts like framing effects and intuition pumps. Include boundary cases to clarify, such as when details are essential (e.g., consent in medical ethics) versus when they're not (like the trolley variations). Ensure each point is a sentence or two.

  Finally, verify that this addresses the user's deeper need: they're seeking clarity in philosophical debates and want tools to critique thought experiments more effectively. By naming this flaw, I'm helping them articulate and navigate these discussions better.
answer: |-
  Here are five numbered points defining the term:

  1.  **Biasing Detail Inoculation:** This term describes the flaw where a thought experiment's persuasive force relies on specific, non-essential narrative details that bias intuitive judgment, rather than solely on the abstract principle it aims to demonstrate.
  2.  **Distinguishing from Framing Effect:** Unlike a simple framing effect (which exploits presentation), this occurs even when the core logical structure is recognized, because the *emotionally charged details* embedded in the scenario remain the primary driver of the intuition.
  3.  **Distinguishing from Intuition Pumps:** While intuition pumps are the general tool, Biasing Detail Inoculation specifically refers to their vulnerability where opponents can "inoculate" against the intended conclusion by altering or removing the biasing details without changing the principle.
  4.  **Boundary Case - Essential Detail:** The footbridge variant of the trolley problem exemplifies Biasing Detail Inoculation; the physical act of pushing is a biasing detail irrelevant to the utilitarian "numbers only" principle supposedly tested.
  5.  **Boundary Case - Non-Problem:** A detail like "requires consent" in a medical ethics experiment is *not* biasing inoculation if consent is the actual principle under investigation; the flaw arises only when details influence judgment without being the target principle.
