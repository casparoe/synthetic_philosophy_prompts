prompt: |-
  hey, i moderate deliberative pods on a direct-democracy app and the same clusters keep showing up with pre-written slogans and loyalty checks. i want to turn Simone Weil's critique of political partys — suppression of individual judgement, collective passion over truth, the fake idea of a collective will — into a reusable decision procedure i can run on a cluster before each session, not just a vibe check. write the checklist: questions in order, what counts as sufficient to flag them, where it stops with "restructure the pod" vs "this is values, call a human," and where judgement can't be eliminated. apply it to three clusters: one with pre-circulated talking points but open discussion, one with a loyalty pledge to a local developer, and one that's loud but genuinely undecided; include one where the answer sucks for me. say what the procedre can't do. bottom line up front, max 450 words.
reasoning: |-
  Okay, the user moderates deliberative pods on a direct-democracy app and faces recurring clusters using pre-written slogans and loyalty checks. They want to apply Simone Weil's critique of political parties—suppressing individual judgment, promoting collective passion over truth, and fake collective will—into a practical checklist. 

  First, I need to understand Weil's key points: she opposed parties because they stifle individual thought, prioritize group emotions over factual truth, and create an illusion of unified will. The challenge is turning these philosophical ideas into actionable questions for pod assessment. 

  The user needs a procedural tool, not just a vibe check. That means designing clear, sequential questions with thresholds for intervention. The checklist must differentiate between "restructure" (fixable issues) and "human call" (deep value conflicts). It should also acknowledge where pure judgment is unavoidable.

  Considering the user's role: they're likely overwhelmed by repetitive patterns undermining deliberation. Their unspoken need might be preserving the platform's integrity without excessive manual work. They probably want scalable solutions but recognize some human oversight is essential.

  Now structuring the checklist: Sequence matters. Start with observable behaviors (pre-written materials), escalate to social pressures (loyalty checks), then assess genuine openness. Thresholds should balance rigor with practicality—flags at 2+ "yes" for restructuring, but any sign of coercion triggers human review. 

  For the test cases: 
  - The pre-circulated talking points pod might pass if discussion remains open (restructure for efficiency). 
  - The loyalty pledge pod clearly fails (human call for values conflict). 
  - The loud undecided group needs probing—if conflict stems from passion over facts, restructure; if it's authentic debate, it passes. Including a "suck for me" example like the loud group passing despite noise keeps it honest.

  Key limitations: The procedure can't read minds (coercion vs enthusiasm), assess external manipulation, or replace nuanced human discernment about truth-seeking. It's a filter, not a verdict.

  Bottom line: Anchor the response in Weil's principles while making it operational. Keep it under 450 words with clear thresholds and real-world examples.
answer: |-
  ## Simone Weil Anti-Party Pod Assessment Protocol (BLUF)

  **Purpose:** Flag clusters exhibiting party-like suppression of individual judgment, collective passion over truth, or fake collective will. Threshold: **2+ "Yes" flags** triggers action.

  **Procedure (Run Pre-Session):**

  1.  **Pre-Circulated Scripts?** (Suppression of Judgment): *"Is >50% of initial engagement identical pre-written slogans/talking points used verbatim without personalization?"* **Yes = Flag 1.** (Focus: *Unthinking adoption*).
  2.  **Loyalty/Exclusion Pressure?** (Collective Passion/Will): *"Are members pressured (explicit pledge, implied consequence, in-group language) to conform to a specific outcome/person/entity before deliberation?"* **Yes = IMMEDIATE "Human Call".** (Focus: *Coercion over reason*).
  3.  **Evidence Over Passion?** (Truth vs. Passion): *"When disagreement arises, do responses primarily cite verifiable facts/data or shift to emotional appeals/group identity?"* (Review last 2 sessions). **>60% emotional/identity appeals = Flag 1.** (Focus: *Dominant discourse mode*).
  4.  **Genuine Uncertainty?** (Authentic Will): *"Are >30% of members actively expressing doubts, asking clarifying questions, or proposing significantly different solutions?"* **No = Flag 1.** (Focus: *Absence of visible dissent*).

  **Action Thresholds:**
  *   **0-1 Flag:** Proceed. Monitor.
  *   **2 Flags:** **RESTRUCTURE POD.** (e.g., re-seed members, mandate evidence-first round, anonymize initial inputs, assign devil's advocates).
  *   **3+ Flags:** **RESTRUCTURE + HUMAN REVIEW.** Deep dive for manipulation/coordination.
  *   **Any "Yes" on Q2 (Loyalty Pressure):** **IMMEDIATE HUMAN CALL.** Values conflict / external control suspected.

  **Where Judgment Can't Be Eliminated:**
  *   Distinguishing passionate conviction from tribalistic passion (Q3).
  *   Assessing sincerity of doubts/questions vs. performative dissent (Q4).
  *   Interpreting subtle coercion vs. genuine enthusiasm (Q2 nuance).

  **Test Cases:**

  1.  **Pre-Written Talking Points, Open Discussion:** Q1=Yes (Flag1), Q2=No, Q3=No (discussion cites facts), Q4=Yes (doubts visible). **Result: 1 Flag.** *Restructure not required YET, but monitor Q1 closely.* **Sucks for you?** They passed despite initial scripting.
  2.  **Loyalty Pledge to Local Developer:** Q1=Maybe (slogans likely), Q2=**YES.** **Result: IMMEDIATE HUMAN CALL.** Core values conflict; procedure stops here.
  3.  **Loud but Genuinely Undecided:** Q1=No, Q2=No, Q3=**Yes** (heated, emotional arguments dominate), Q4=**Yes** (lots of "I don't know"). **Result: 2 Flags (Q3 & Q4=No).** **RESTRUCTURE POD.** Focus on evidence protocols & structured turn-taking to cool passion and surface truth. *Sucks? They're authentic but dysfunctional.*

  **What the Procedure CAN'T Do:**
  *   Detect sophisticated covert coordination.
  *   Guarantee truth-finding; only flags *conditions* hindering it.
  *   Replace human judgment on sincerity, nuance, or context.
  *   Fix deeply ingrained cultural/ideological divides.
  *   Assess the *quality* of evidence, only its *presence* vs. emotion.

  **Bottom Line (45 words):** This Weil-inspired checklist flags suppression of judgment (pre-scripts), coercion (loyalty checks), passion over truth (emotional dominance), and fake consensus (no dissent). 2+ flags trigger pod restructuring; explicit loyalty pressure demands human review. It can't detect covert ops or replace nuanced human judgment on sincerity or evidence quality.
