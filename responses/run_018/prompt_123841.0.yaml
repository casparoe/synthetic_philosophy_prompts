  ## The Binding Echo: Normative Residue and the Anatomy of Promise

  The seemingly simple act of promising generates a profound puzzle: why does uttering "I promise" bind us with a *genuine moral obligation*, rather than merely creating a strong self-interested reason to avoid the *consequences* of breaking our word? This question lies at the heart of the controversy between two dominant philosophical accounts: the **authority-transfer view** (ATV) and the **reliance-harm view** (RHV). While both capture essential facets of promising, the persistent phenomenon of **normative residue** – the lingering moral remainder that survives even full compensation and dissipated harm – exposes their limitations and points towards a nuanced, layered hybrid as the most compelling explanation.

  Proponents of the ATV, such as T.M. Scanlon and Joseph Raz, argue that promising involves a unique normative transaction. By making a promise, the promisor intentionally transfers a measure of their future practical authority over a specific action to the promisee. The promisee thereby gains a distinctive right to demand performance or hold the promisor accountable. The obligation arises from this act of delegation itself; breaking the promise constitutes a violation of the authority ceded, a kind of normative usurpation. The wrong is inherent in the act of disregarding the promisee's newly acquired claim, independent of whether the promisee actually relied on the promise or suffered tangible harm. Imagine promising a distant colleague to review their manuscript in six months. They might file the promise away without immediate reliance. If you later break it, the ATV claims they are still wronged because you violated the authority you delegated to them over your reviewing time.

  In contrast, the RHV, championed by thinkers like Judith Jarvis Thomson and later developed by others emphasizing expectations (e.g., Neil MacCormick), grounds the obligation in consequences. On this view, the core wrong of promise-breaking lies in the harm caused by frustrating the legitimate expectations the promisor deliberately cultivated. By uttering the promise, the promisor invites reliance and creates a reasonable expectation of performance. Breaking the promise harms the promisee by disappointing this expectation, potentially causing emotional distress, practical setbacks, or undermining trust generally. The obligation stems from the duty not to harm others through one's voluntary, expectation-inducing actions. If the colleague *did* rely on your review promise – delaying other feedback, adjusting deadlines – your breach directly harms them, justifying the wrong.

  The concept of **normative residue** provides a powerful lens to test these rival accounts. This residue manifests as a persistent moral remainder: a sense of agent-regret, a residual reason for apology or symbolic amends, or a lingering stain on the relationship, *even after* all quantifiable harm has been compensated and future reliance interests are no longer threatened. For instance, suppose you break a promise to attend a friend's important recital. You later discover they didn't actually rely on your being there (they assumed you might flake) and suffered no practical setback. You offer a sincere apology and compensate them lavishly. Yet, a sense of having wronged them persists for you both – this is normative residue. Alternatively, imagine breaking a harmful promise (e.g., to help someone cheat) where compensation isn't even relevant, yet a distinct moral *taint* remains for having made and broken the commitment.

  **Does ATV or RHV better explain this residue?**

  *   **RHV Struggles:** The reliance-harm view struggles profoundly with residue. If the core wrong is harm through frustrated reliance, and that harm is fully compensated (or never existed, as in the non-reliance recital case), the moral ledger should be balanced. The RHV might gesture towards "undermined trust" as a diffuse harm, but this seems either insufficiently specific (trust in whom?) or already accounted for in compensation and apology. More crucially, it struggles to explain residue in cases of **non-reliance promises** or **harmless but broken promises**. Why feel obligated to apologize for breaking a promise that caused no harm and where no one relied? The RHV struggles to find the "harm" that generates the residue. The "original expectation-creating act" is done, but if no harm resulted from its frustration, why does a moral remainder linger? The RHV risks reducing the obligation to contingent harm, failing to capture the inherent wrong in simply reneging on the transferred authority itself.
  *   **ATV Explains:** The authority-transfer view offers a more straightforward account. The residue persists because the *violation of the delegated authority* remains an unaddressed normative fact. Compensation and apology address the *consequences* of the breach (harm, disappointment), but they don't retroactively undo the act of usurping the promisee's right to decide about the promised action. The promisee’s unexercised claim – their right to your performance that you disregarded – leaves a lasting normative scar. Even if they no longer need or want the performance, the fact that you overrode their authority persists. This explains the lingering need for acknowledgment *of that specific wrong* and the distinct feeling of having betrayed a normative relationship, not just caused a setback. The residue is the echo of the violated right.

  However, the ATV, while strong on residue, faces challenges explaining the *depth* of moral failure in cases of **harmful reliance**, where the broken promise causes significant damage. It also seems less intuitive for **compelled promises** (made under duress) or **overridden promises** (broken for overwhelming moral reasons). Here, while the authority transfer might formally occur, the moral weight feels different. This suggests the need for a richer account.

  Enter the **layered alternative**: promises bind through two independent, though often converging, mechanisms. First, a **deontic layer** – encompassing either the delegated authority (ATV) or the duty to avoid harm through induced reliance (RHV) – generates the core obligation and the primary wrong of violation. Second, a distinct **aretaic layer** concerns the promisor's character: the virtue of fidelity or integrity. Breaking a promise, even when justified by overriding the deontic layer (e.g., breaking a trivial promise to save a life), often involves a cost to the agent's integrity. Fidelity is a virtue; failing to keep one's word, even for good reason, can constitute a failure of that virtue, generating agent-regret and a reason for explanation or symbolic amends – precisely the normative residue.

  **Objection:** Doesn't this layered view "overcount" the wrong? Is breaking a promise *doubly* wrong – once for the deontic violation and again for the aretaic failing?

  **Counter-Objection:** Not necessarily. The wrongs target different domains. The deontic wrong is primarily *interpersonal* – a wrong *to the promisee* (violating their right or harming them). The aretaic failing is primarily *intrapersonal* – a flaw or cost *in the promisor's character* relative to the virtue of fidelity. They are distinct normative registers. Crucially, the **aretaic layer is indispensable for explaining normative residue in precisely those cases where the deontic obligation is overridden or absent**. Consider breaking a trivial promise under compulsion, or breaking a harmful promise (like the cheating pact). The deontic layer might be weak or non-existent (no legitimate authority transferred in compulsion; no duty to cause harm). Yet, the agent may still feel a residue – a sense of having compromised their own integrity by uttering words they couldn't or wouldn't back up. The residue here isn't a debt to the promisee, but a stain on the self, best explained by the aretaic dimension. Conversely, in the non-reliance promise broken without justification, the strong residue is explained by the *combination*: a clear deontic wrong (violated authority) *and* an aretaic failing (lack of fidelity).

  Therefore, while the ATV provides the best explanation for the deontic core of promising, particularly concerning interpersonal wronging and residue in standard cases, it needs supplementation. The phenomenon of normative residue, especially in non-standard cases like compelled or overridden promises, reveals an irreducible aretaic dimension tied to the virtue of fidelity and the agent's integrity. A purely deontic account, whether ATV or RHV, cannot fully capture this persistent moral echo. A layered hybrid view, recognizing both the interpersonal obligation (best grounded in authority-transfer) and the intrapersonal dimension of integrity, offers the most comprehensive and explanatorily powerful account. It acknowledges that breaking a promise can wrong another *and* diminish oneself, and it is this dual aspect that fully accounts for the enduring, often haunting, nature of the moral residue that lingers when our word is broken.

  **Verdict: While the authority-transfer view best explains the deontic core of promising and the interpersonal normative residue in standard cases, a layered hybrid incorporating a distinct aretaic reason grounded in the virtue of fidelity is necessary to fully account for the phenomenon of normative residue, particularly in non-standard instances like compelled or overridden promises.**
