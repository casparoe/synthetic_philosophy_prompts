  Okay, the user presents a sophisticated critique of speech-act theory centered on "standing performatives." They argue that institutional declarations like accreditations or emergency powers create ongoing states rather than discrete acts, and that their validity depends on persistent institutional conditions. The user requests feedback on three specific points: accuracy regarding Austin's framework, conceptual coherence of their proposed category, and internal logic concerning authority dynamics.

  Hmm, the core tension here lies in whether institutional maintenance should be considered part of the speech act itself. The user's claim about retroactive voiding is particularly provocative - it suggests that if the institutional substrate collapses, the original utterance wasn't just violated but was never truly successful. This directly challenges Austin's moment-of-utterance model. 

  On accuracy, I note that while Austin does briefly acknowledge durable effects (e.g., in bequeathing), he never systematizes this. The retroactive suspension idea does fracture his happy/unhappy binary - a performative could be "happy" at t=0 but later become "unhappy" if the substrate fails. That's a real departure. For conceptual coherence, the "standing performative" category feels philosophically substantive because it reveals how institutional reality depends on speech acts with temporal duration. The sociological aspects are consequences, not replacements, of the linguistic mechanism. 

  The authority continuity point is the trickiest. The user worries this reduces to institutional theory, but actually it highlights how speech acts and institutions co-constitute each other. The performative isn't redundant; it's the vehicle through which institutional power flows continuously. Still, this is where the argument is most vulnerable: if someone showed that authority recognition is merely a perlocutionary effect, the standing/discrete distinction might collapse. 

  The user's framing is impressively precise. Their self-doubt about whether this is just redescribing sociology suggests they've deeply engaged with the boundaries of philosophical linguistics. I should emphasize that their extension reveals a genuine blind spot in Austin - one with real implications for understanding how language constructs persistent social realities. The retroactive voiding concept, while radical, logically follows from the substrate dependence they've identified.
answer: |-
  Here’s a focused evaluation addressing your three queries, with explicit criteria for rejection and vulnerability points flagged:

  ### 1. **Accuracy re: Austin**  
     - **Assessment:** Your reading is defensible but extends beyond Austin’s explicit framework. Austin’s illocutionary/perlocutionary distinction *does* prioritize the moment of utterance ("securing uptake" at t=0). His "happy/unhappy" binary (misfires vs. abuses) assumes completion at utterance: e.g., "I bet" misfires if *at t=0* you lack stakes, not if you later renege (which is "abuse," not misfire). Retroactive suspension *does* conflict with this, as it implies an utterance can be "happy" at t=0 yet later deemed "unhappy" due to substrate collapse.  
     - **What would change my mind:** If Austin *explicitly* treated institutional durability as an illocutionary condition (e.g., framing "I bequeath" as requiring the testator’s *ongoing* legal existence). He doesn’t—so your extension is novel but not textually grounded.  
     - **Vulnerability:** Overstretching "misfire." Austin’s misfires are *preconditions* (e.g., authority, procedure), not *post-hoc* failures. Your retroactive voiding might conflate infelicity with institutional revocation.  

  ### 2. **Conceptual Coherence**  
     - **Assessment:** "Standing performative" *is* a genuine extension. You isolate a gap: speech-act theory omits utterances whose *illocutionary point* (not just perlocutionary consequences) requires temporal persistence. Institutional maintenance is typically sociological, but your focus on *how language constitutes* that persistence (e.g., "hereby accredited" creating a state, not an event) is philosophical. The key move is showing that the *success of the utterance itself* (not just its effects) depends on continuity.  
     - **What would change my mind:** If all "standing" cases reduce to discrete acts + external sustainment (e.g., "accreditation" = a discrete verdict + independent bureaucratic processes). But your examples suggest the *meaning* of the utterance includes duration ("for ten years"), binding validity to substrate stability.  
     - **Vulnerability:** If "standing" is just a label for *repeated* discrete performatives (e.g., daily reaffirmations of emergency powers). Your retroactive voiding claim resists this, but risks conflating linguistic and institutional breakdown.  

  ### 3. **Internal Logic (Authority Continuity)**  
     - **Assessment:** Authority requiring *continuous recognition* doesn’t collapse into institutional theory alone. It highlights that for standing performatives, the speaker’s authority isn’t a static precondition (like a judge’s role at sentencing) but a *dynamic condition* of the utterance’s validity. This *intensifies* the speech-act component: the utterance’s force is parasitic on the substrate’s existence, making language and institution co-constitutive. The performative isn’t redundant—it’s the *mechanism* that harnesses the substrate.  
     - **What would change my mind:** If continuous authority were provably *perlocutionary* (e.g., society’s obedience as an effect, not a validity condition). But you correctly note that in standing cases, substrate collapse voids the *illocution*, not just invites violation (e.g., accreditation isn’t "broken" but *null* if the accreditor vanishes).  
     - **Vulnerability:** If "continuous recognition" is indistinguishable from *de facto* power (e.g., a deposed dictator’s "emergency powers" are ignored). Here, your illocutionary/perlocutionary boundary blurs—is the utterance *void* (illocutionary failure) or merely *ineffective* (perlocutionary)? Your retroactive voiding claim needs stricter criteria.  

  ### Critical Threshold for Rejection  
  - **The distinction fails if:** You cannot demonstrate that *retroactive voiding* is categorically distinct from *subsequent violation*. If all "standing" cases can be re-described as:  
    - A discrete illocutionary act at t=0 (e.g., "accreditation status created") +  
    - Perlocutionary effects (e.g., maintaining recognition) +  
    - A *separate* illocutionary act of revocation when the substrate collapses...  
    then the "standing performative" category adds nothing. Your account hinges on proving that substrate collapse *erases* the original act’s success—not just ends its effects.  

  ### Where My Reasoning Is Most Vulnerable  
  - **Analogy between discrete/standing cases:** Equating "I bet" (discrete) with "emergency powers" (standing) risks false equivalence. If the latter is just a *series* of discrete acts (e.g., daily re-authorizations), your distinction weakens.  
  - **Retroactive voiding vs. violation:** This is your boldest claim but most exposed. If a revoked accreditation is merely "overruled" (a new act negating an old one), not "void *ab initio*," the temporal uniqueness of standing performatives unravels. Austin’s framework has no machinery for "time-traveling" misfires.  

  **Conclusion:** Your argument is coherent and novel, exposing a real limitation in speech-act taxonomy. Its survival depends on rigorously defending retroactive voiding as an *illocutionary* (not institutional) phenomenon—showing that language itself demands persistent substrates for certain utterances to ever "count" as successful. If voiding reduces to external negation, the distinction collapses.
