answer: |-
  ### Decision Procedure for High-Risk, High-Reward Grant Applications  
  **Goal:** Filter out "Pascal’s mugging" scenarios while allowing credible high-impact projects. Requires only arithmetic, takes <1 hour per application.  
  **Key rules:**  
  - Stop at first "fail."  
  - If all steps pass, escalate to human review ("values call").  
  - **Probability floor:** Reject if probability < 0.0001 (1/10,000). Below this, expected value calculations become unreliable.  
  - **Evidence bar:** Require tangible evidence for probability/impact claims.  

  #### Step-by-Step Procedure:  
  1. **Scope Alignment Check**  
     - *Question:* "Is this project directly aligned with our foundation’s core mission areas?"  
     - *Pass:* Clear, specific alignment (e.g., environment, education, health per your charter).  
     - *Fail:* Indirect, tangential, or unrelated impact.  
     - *Stop if fail:* **Reject.**  

  2. **Probability Threshold**  
     - *Question:* "Does the applicant claim a probability of success ≥ 0.0001 (1/10,000)?"  
     - *Pass:* Probability ≥ 0.0001.  
     - *Fail:* Probability < 0.0001 or no probability stated.  
     - *Stop if fail:* **Reject.**  

  3. **Probability Evidence**  
     - *Question:* "Is there *empirical* evidence supporting the probability estimate? (e.g., pilot data, peer-reviewed models, historical analogs)"  
     - *Pass:* Specific evidence cited (not just "expert opinion" or "theory").  
     - *Fail:* Anecdotes, untested models, or no evidence.  
     - *Stop if fail:* **Reject.**  

  4. **Impact Evidence**  
     - *Question:* "Is there *empirical* evidence supporting the impact magnitude? (e.g., data from comparable projects, independent validation)"  
     - *Pass:* Data-driven sources (not hypothetical extrapolations).  
     - *Fail:* Unsubstantiated claims (e.g., "This could save billions").  
     - *Stop if fail:* **Reject.**  

  5. **Cost-Effectiveness Screen**  
     - *Question:* "Is the expected value per dollar ≥ $1?"  
       - Calculate: \((\text{Probability} \times \text{Payoff}) / \text{Grant Amount}\)  
       - *Pass:* Result ≥ $1.  
       - *Fail:* Result < $1.  
     - *Stop if fail:* **Reject.**  
     - *Note:* Skip if payoff is non-monetary (e.g., "saving democracy"). Escalate to human review.  

  6. **Final Review**  
     - *Outcome:* All steps passed → **Escalate to human review.**  
     - *Human evaluates:* Credibility of team, feasibility, redundancy, and mission fit beyond arithmetic.  

  ---

  ### Application Evaluations  
  **Assumptions:**  
  - Foundation mission includes "existential risk reduction" (covers AI/CO₂) and "civic engagement" (covers voter turnout).  
  - All payoffs are converted to USD for consistency.  

  #### 1. AI Catastrophe Leaflets ($30K Request)  
     - **Claimed:** 1/10,000 chance of preventing AI catastrophe (valued at $10T).  
     - **Step 1 (Scope):** Pass (existential risk).  
     - **Step 2 (Probability):** 0.0001 = Pass (exactly at threshold).  
     - **Step 3 (Prob. Evidence):** *Fail.* Typical evidence: "Leaflets changed policy in 1/100 past campaigns." Actual evidence: Usually speculative models. → **Reject.**  
     *Why you’ll dislike this:* The procedure rejects a high-stakes project, but the evidence requirement prevents funding unverifiable claims.  

  #### 2. CO₂ Removal Prototype ($40K Assumed Request)  
     - **Claimed:** 1/50,000 chance of reducing CO₂ removal costs by 90% (savings valued at $1T over 10 years).  
     - **Step 1 (Scope):** Pass (environment).  
     - **Step 2 (Probability):** 0.00002 < 0.0001 → **Reject.**  
     *Why the procedure works:* Probability below floor; no further time wasted.  

  #### 3. Voter-Turnout Campaign ($15K Request)  
     - **Claimed:** 1/100,000 chance of swinging an election (valued at $100B in policy impact).  
     - **Step 1 (Scope):** Pass (civic engagement).  
     - **Step 2 (Probability):** 0.00001 < 0.0001 → **Reject.**  
     *Why you’ll dislike this:* Local projects feel tangible, but the low probability fails Step 2.  

  **Crucial note:** The AI leaflets example passes Step 2 but fails Step 3. If an identical application provided robust evidence (e.g., "Leaflets altered voter behavior in 3/10 similar trials"), it would reach human review—forcing a values call on whether to fund extreme long shots.  

  ---

  ### Where the Procedure Misfires  
  1. **False Negatives:**  
     - Rejects legitimate projects with probabilities <0.0001 but strong evidence (e.g., early-stage medical research).  
     - *Mitigation:* Use human review for mission-critical areas, ignoring the probability floor.  

  2. **Non-Monetary Payoffs:**  
     - Skips cost-effectiveness for moral goods (e.g., "saving a species"). Human review must weigh values.  

  3. **Over-Reliance on Evidence:**  
     - Rejects novel projects without prior data (e.g., first-of-kind tech).  
     - *Mitigation:* In human review, prioritize teams with strong track records.  

  ---

  ### Rejection Letter Template (Non-Argumentative)  
  **Use this when probability/evidence fails (Steps 2–4):**  
  > Thank you for submitting your proposal for [Project Name]. We commend your innovative approach to [issue]. After careful review, we concluded that your project does not align with our current funding priorities, which emphasize [specific criteria: e.g., "verifiable evidence of impact" or "near-term feasibility"]. Given the high volume of applications, we cannot provide individualized feedback. We encourage you to apply again if your work evolves to meet these priorities.  

  **Why this works:**  
  - Focuses on "priorities" (not their odds), avoiding debates.  
  - "Verifiable evidence" signals rigor without attacking claims.  
  - Leaves door open for future applications.  

  **For scope rejection (Step 1):**  
  > ... does not align with our core mission areas of [X, Y, Z]. We encourage you to seek funders specializing in [their field].  

  This procedure balances openness to risk with pragmatism. By escalating only evidence-backed projects to human review, you avoid funding "every crank" while reserving judgment for edge cases worth debating.
