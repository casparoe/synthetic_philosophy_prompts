answer: |-
  Here’s a decision tree for mapping positions on original vs. derived intentionality, using the case study of a **prosthetic hand with predictive grip adjustment** (responds to galvanic skin response; user never consciously intends grip changes). Follow the splits by answering concrete diagnostic questions:

  ---

  ### **SPLIT 1: Is original intentionality fundamentally binary or scalar?**  
  *(i.e., is something either "truly intentional" or not, or can it have degrees of intentionality?)*  
  → **If BINARY (all-or-nothing):** Go to Split 2A.  
  → **If SCALAR (graded/comparative):** Go to Split 2B.  

  ---

  ### **SPLIT 2A: Can artifacts *ever* possess original intentionality?**  
  *(Given binary intentionality)*  
  → **If NO (only biological brains):** Go to Split 3A.  
  → **If YES (non-biological systems can have it):** Go to Split 3B.  

  ---

  ### **SPLIT 2B: Can artifacts *ever* possess original intentionality?**  
  *(Given scalar intentionality)*  
  → **If NO (only biological brains):** Go to Split 3C.  
  → **If YES (non-biological systems can have it):** Go to Split 3D.  

  ---

  ### **SPLIT 3A: Does derived intentionality require a conscious interpreter *present*?**  
  *(Given binary + artifacts never original)*  
  → **If YES (conscious mind must interpret *now*):**  
  - **View:** **Searle-style Biological Exclusivism**  
  - **Awkward commitment:** The prosthetic grip adjustment is utterly meaningless (not even "derived") unless a human consciously interprets it *at that moment*—even though it’s designed to aid the user.  
  → **If NO (design history suffices):**  
  - **View:** **Design-Based Derivativism**  
  - **Awkward commitment:** The prosthetic has derived intentionality (e.g., "adjusting grip for stability") purely from its design purpose—even if no one observes it, and the wearer is unaware.  

  ---

  ### **SPLIT 3B: Does derived intentionality require a conscious interpreter *present*?**  
  *(Given binary + artifacts can be original)*  
  → **EMPTY BRANCH (diagnosis: Incoherent)**  
  - *Why?* If artifacts can have *original* intentionality (binary), but the prosthetic’s grip adjustment lacks consciousness/biology, it’s unclear how it could be "derived" in a way requiring an interpreter.  

  ---

  ### **SPLIT 3C: Does derived intentionality require a conscious interpreter *present*?**  
  *(Given scalar + artifacts never original)*  
  → **If YES (conscious mind must interpret *now*):**  
  - **View:** **Conscious-Dependent Scalarism**  
  - **Awkward commitment:** The prosthetic’s grip adjustment has *zero* intrinsic meaning; its apparent "intentionality" vanishes if no one is consciously interpreting it—despite functioning adaptively.  
  → **If NO (design history suffices):**  
  - **View:** **Unnamed Scalar Derivativism**  
  - **Awkward commitment:** The prosthetic has *low-grade* derived intentionality (e.g., "anticipating slippage") solely from its design—even if it operates flawlessly without conscious oversight.  

  ---

  ### **SPLIT 3D: Does derived intentionality require a conscious interpreter *present*?**  
  *(Given scalar + artifacts can be original)*  
  → **If YES (conscious mind must interpret *now*):**  
  - **View:** **Unnamed Interpretive Scalarism**  
  - **Awkward commitment:** The prosthetic’s grip adjustment gains "original-ish" intentionality *only* when consciously integrated by the wearer—otherwise, it’s just noise.  
  → **If NO (design history suffices):**  
  - **View:** **Dennett-style Interpretive Derivationism**  
  - **Awkward commitment:** The prosthetic’s intentionality (e.g., "predictive stability") is *always* derived from evolutionary/design history—even if it *seems* original. Biology has no magic spark.  

  ---

  ### **FINAL SPLIT (for all views): Is the original/derived distinction metaphysically real?**  
  → **If YES (real distinction):** Your view treats intentionality as objective (e.g., Searle, some realists).  
  → **If NO (heuristic fiction):** Your view treats it as a useful perspective (e.g., Dennett’s "intentional stance").  
  - *Note:* Denying the distinction’s reality *weakens* "original intentionality" claims—e.g., Dennett would say both brain and prosthetic derive intentionality from interpretation.  

  ---

  ### **Key Diagnostics & Empty Branches:**  
  - **Empty Split 3B:** Binary original intentionality in artifacts collapses if derived intentionality requires an interpreter (incoherent combo).  
  - **Searle’s View:** Binary + artifacts never original + distinction real → Prosthetic has *zero* intentionality without a conscious interpreter.  
  - **Dennett’s View:** Scalar + artifacts can be "original-ish" (but still derived) + distinction fictional → Prosthetic’s grip has intentionality *as if* it were a biological reflex.  
  - **Middle Ground (Embedded Cognition):** Likely lives in **Split 3D (NO interpreter needed)**. Prosthetic + wearer form a coupled system with emergent scalar intentionality.  

  **British English Glossary:**  
  - **Prosthetic:** Artificial limb.  
  - **Galvanic skin response:** Sweat-based physiological signal (unconscious).  
  - **Heuristic fiction:** Practical simplification, not literal truth.  

  Use this tree by starting with your intuition about the prosthetic:  
  *"Does the grip adjustment have a 'mind-like' quality (scalar) or is it either robotic or truly mental (binary)?"*  
  Then work through the splits—no jargon needed.
