  Question 3 on warranted false beliefs: Can a society be warranted in collective error? Follow-up: Doesn’t that sabotage reflexivity’s normative weight? 
  Peirce/Dewey clash: How does Dewey’s anti-foundationalism reshape reflexivity design? 

