prompt: |-
  hey so i'm putting together questions for a podcast episode — my guest is this philosopher who just wrote a book (i think it's called Democracy as Inquiry or something like that) defending a pretty specific reading of Dewey. she argues that Dewey's experimentalism isn't just about science but actually gives us a normative model for democratic institutions: democratic failure should be read like a failed experiment, meaning missing adaptive feedback loops rather than some kind of moral catastrophe. she also proposes this metric she calls "institutional reflexivity" — basically how fast a polity updates its own procedural rules based on outcome data — and she claims modern liberal democracies score lower on it than some authoritarian regimes with rapid policy turnover, which she takes as the real crisis. i want maybe 7 or 8 questions that actually dig into the mechanics of this view, not just asking her to summarize Dewey for beginners. i need at least one on how she distinguishes democratic "inquiry" from just polling or agregation, one on whether her view lets authoritarian regimes off the hook if they claim high reflexivity through constant policy change, and one on whether Dewey's concept of warranted assertibility applies to collective political judgment — like, can a society be warranted in holding something false? for each of those i want a follow-up that anticipates the answer she'll probably give. i'm taking a course on pragmatism and i keep mixing up Dewey with Peirce on whether truth is what survives inquiry or just what works, so maybe frame one question around that confusion? and please, no generic stuff like what drew her to philosophy or asking for her favorite Dewey quote.
reasoning: |-
  Okay, let's tackle this podcast question challenge. The host needs sharp, mechanics-focused questions for a philosopher guest specializing in Dewey's experimental democracy. No beginner summaries or fluff—just deep dives into her book's arguments. 

  First, I need to map her core thesis: democratic failure as failed experiment (not moral failure), institutional reflexivity as key metric, and the provocative claim that some authoritarian regimes might outperform democracies on reflexivity. The host specifically wants three anchored questions with follow-ups: 1) democratic inquiry vs polling, 2) authoritarian regimes co-opting "reflexivity," and 3) Dewey's warranted assertibility for collective judgment. Plus a Peirce/Dewey truth distinction question.

  Hmm, the inquiry vs polling distinction feels crucial—polling is snapshot aggregation while Deweyan inquiry is iterative problem-solving. For the follow-up, I'll push on how her view avoids collapsing into technocracy. The authoritarian reflexivity point is explosive; the follow-up should force her to confront if procedural violence invalidates "efficiency." Warranted assertibility needs unpacking—can societies hold warranted false beliefs? The follow-up could challenge if this undermines her own reflexivity metric. 

  For the Peirce/Dewey confusion: Peirce's "truth as final opinion" vs Dewey's "warranted assertibility as context-specific." Must emphasize how this affects her institutional design. 

  Avoiding obvious traps: no definitional questions, no biography, no "why philosophy." Every question must force her to defend or clarify the machinery of her argument. The host's pragmatism course background helps—we can assume Dewey basics but probe subtleties. 

  *scribbles draft questions* 
