  ### Simulation Design: "Veridian Crossroads"

  #### **Scenario: The Veridian Republic, 1789**
  Veridia is a nascent democracy facing existential threats after a border incursion by the monarchist state of Monterra. The Assembly must hold three sequential, interdependent votes:  
  1. **Military Intervention**: Deploy troops to repel Monterran forces (Baseline: 58% "Yes").  
  2. **Judicial Punishment**: If Intervention passes, try captured Monterran officers for war crimes (Harsh: execution; Moderate: imprisonment; Baseline: 52% Moderate).  
  3. **Resource Allocation**: If Intervention passes, distribute funds between military and social programs (High Military: 70% to war; Balanced: 50/50; Baseline: 53% Balanced).  

  **Final Institutional State**: Defined by the outcome vector (e.g., [Intervention: Yes, Punishment: Moderate, Allocation: Balanced]). *Convergence* occurs if the outcome matches the baseline vector; *divergence* occurs otherwise.  

  #### **Roles & Rules**  
  *Total: 14 participants (3 teams, 1 facilitator)*  

  1. **Perturbation Teams (PTs)** (3 teams × 3 members = 9 students):  
     - Each PT is assigned one vote (PT1: Intervention, PT2: Punishment, PT3: Allocation).  
     - **Action**: Propose a perturbation to their vote’s margin (±0–15 percentage points; e.g., shifting Intervention from 58% to 65% "Yes").  
     - **Constraint**: Perturbations must be ratified by majority vote of the full Assembly (all 14 participants). Unratified proposals default to baseline.  
     - **Incentive**: PTs earn "Influence Points" (IP) for ratified proposals, but lose IP if their perturbation causes divergence.  

  2. **Forecasting Teams (FTs)** (2 teams × 2 members = 4 students):  
     - **Action**: Submit sealed predictions at two junctures:  
       - *Pre-simulation*: Predict convergence/divergence after all votes.  
       - *Post-Vote 2*: Update prediction after seeing Interventions and Punishment outcomes.  
     - **Staking**: Bet 0–5 "Reputation Points" (RP) per prediction (start with 10 RP). Double RP for correct divergence predictions; lose bet for errors.  

  3. **Record-Keepers (RKs)** (1 student):  
     - Log all perturbations, ratification votes, and outcomes.  
     - Track "fragility drift": aggregate micro-perturbations (e.g., cumulative sum of all small margin shifts).  

  #### **Aggregation Mechanism**  
  - **Vote Sequencing**: Votes occur in fixed order (Intervention → Punishment → Allocation). Outcomes depend on prior votes (e.g., Punishment vote occurs *only* if Intervention passes).  
  - **Threshold Sensitivity**:  
    - Intervention >65% "Yes" triggers "war fever," adding +10% to subsequent Harsh/High Military votes.  
    - Punishment <48% Moderate enables "revenge sentiment," adding +8% to High Military.  
  - **Macro-State Resolution**: Facilitator compares final outcome vector to baseline. Divergence requires ≥2 non-baseline outcomes.  

  #### **Non-Monetary Payoffs**  
  - **PTs**: Gain 2 IP per ratified perturbation; lose 5 IP if divergence occurs. Top IP earner wins "Master Strategist" title.  
  - **FTs**: RP determine "Oracle Rank" (e.g., Grand Oracle for top scorer).  
  - **RKs**: Earn "Archivist Credibility" for accurate logs; errors penalize all teams.  

  #### **Procedure**  
  1. **Briefing (5 min)**: Introduce Veridia’s crisis and voting rules. Assign roles; withhold fragility thresholds.  
  2. **Voting Rounds (45 min)**:  
     - *Intervention Vote*: PT1 proposes perturbation → Assembly ratification → Outcome recorded.  
     - *Punishment Vote* (if Intervention passed): PT2 proposes → Ratification → Outcome. FTs submit first prediction.  
     - *Allocation Vote* (if Intervention passed): PT3 proposes → Ratification → Outcome.  
  3. **Resolution (5 min)**: Facilitator declares convergence/divergence, resolves payoffs.  
  4. **Debrief (35 min)**: Structured discussion.  

  ---

  ### **Structured Debrief**  
  **Objectives**: Connect simulation dynamics to fragility thresholds; expose cognitive biases; clarify limitations.  

  #### **Key Debrief Questions**  
  1. **Single-Node Drama vs. Cumulative Drift**:  
     - *Prompt*: "When did divergence seem inevitable? Was it triggered by one 'big' change or unnoticed micro-shifts?"  
     - *Mapping*: Highlight RKs’ log of micro-perturbations (e.g., PT1’s +7% shift seemed minor but crossed the 65% threshold, cascading into divergence). Contrast with PTs’ focus on high-stakes proposals.  
     - *Cognitive Bias*: Humans overweight dramatic single-node changes (e.g., PT2 flipping Punishment) but underweight aggregated micro-drift crossing fragility thresholds.  

  2. **Visible vs. Invisible Perturbation**:  
     - *Prompt*: "Which changes felt impactful? Which seemed irrelevant but altered outcomes?"  
     - *Mapping*: Note how "war fever" (+10% post-65% Intervention) amplified later votes invisibly. FTs’ pre-Vote 2 predictions likely ignored this hidden feedback.  

  3. **Illusion of Decisive Agency**:  
     - *Prompt*: "Did PTs feel in control? Did ratifiers recognize their role in enabling drift?"  
     - *Mapping*: PTs’ agency was constrained by ratification; micro-shifts pooled into macro-effects. Forecasters underestimated collective action’s role.  

  #### **Explicit Limitations of Simulation**  
  - **Omitted Real-World Dynamics**:  
    - *Long-Run Feedback Loops*: Veridia lacks institutional memory (e.g., war fatigue altering future votes).  
    - *Information Asymmetry*: Participants had full transparency; historical actors face uncertainty.  
    - *Irreversibility*: Simulated votes had no lasting consequences (e.g., executions or debt).  
  - *Facilitator Role*: Supply these contexts verbally during debrief.  

  #### **Predicted Problems & Corrections**  
  - **Problem 1**: Participants treat scenario as purely strategic (e.g., PTs maximize IP via extreme proposals).  
    - *Correction*: Mid-activity reminder: "Act as Veridian citizens weighing civic duty—not game theorists."  
  - **Problem 2**: Payoffs misalign with fragility concept (e.g., FTs ignore micro-drift, bet solely on big swings).  
    - *Correction*: Post-Vote 2, reveal RKs’ "fragility drift score" to FTs to force attention to cumulative effects.  
  - **Problem 3**: Synthetic context dilutes historical empathy.  
    - *Correction*: Open debrief with historical parallel (e.g., "This mirrors Athenian debates pre-Sicilian Expedition").  

  ---

  ### **Validity Threshold: When the Simulation Fails**  
  This activity genuinely captures the philosophy of historical inevitability **only if** participants organically experience the tension between contingency (micro-perturbations’ power) and inevitability (structural thresholds). The critical failure modes are:  

  1. **Absence of Path-Dependent Lock-In**: If the simulation allows unlimited reversals (e.g., re-voting after divergence), it misrepresents historical irreversibility. *Correction*: Impose a "no backtracking" rule.  
  2. **Inability to Resist Perturbation**: If *no* structural constraints exist (e.g., all votes are equally easy to flip), the simulation overstates contingency. *Correction*: Add fixed "constitutional thresholds" (e.g., Intervention requires >40% "Yes" to pass, making failure rare).  
  3. **Forecasters Ignore Cumulative Drift**: If FTs consistently bet on divergence only after dramatic single-node changes, the debrief cannot map micro-perturbations to fragility thresholds. *Correction*: Add a "drift meter" visual aid showing aggregate micro-shifts.  

  Should these failures occur, the simulation becomes a gamified distortion of history, reducing inevitability to randomness and contingency to agency theatrics. Success is measured by debrief revelations—e.g., a participant stating, "We lost Veridia through a dozen tiny choices, not one big mistake."  

  ---  
  **Final Design Logic**: By embedding thresholds (e.g., 65% Intervention) and chained dependencies, the simulation forces engagement with fragility. The payoff schemes incentivize behaviors that surface cognitive biases, while debrief scaffolding transfers insights to historical philosophy.
