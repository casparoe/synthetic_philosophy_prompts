answer: |-
  Here's a careful conceptual analysis of finks, masks, and compound dispositions within the provided institutional scenario:

  **Core Concepts & Definitions:**
  1.  **Disposition:** A property (e.g., fragility, solubility) that would manifest a characteristic effect (e.g., shattering, dissolving) under specific triggering conditions (e.g., struck, immersed in water).
  2.  **Fink:** An interference that *removes the disposition itself* precisely at the moment it is triggered, preventing manifestation *because the disposition ceases to exist when needed*. (e.g., a sorcerer instantly makes a glass non-fragile the *moment* it's struck).
  3.  **Mask:** An interference that *prevents the manifestation* of an otherwise intact disposition under triggering conditions, *without removing the disposition itself*. (e.g., packing foam prevents a fragile glass from shattering when struck).
  4.  **Compound Multi-Track Disposition:** A disposition that can manifest the same type of effect (e.g., dispute resolution) through *multiple, distinct pathways* (tracks), each potentially requiring different triggering conditions. The disposition is realized if *any* track successfully manifests the effect.
  5.  **Categorical Base:** The underlying structural property that grounds the disposition (e.g., molecular structure for solubility, the regulatory body's founding charter and constitutive rules here).
  6.  **Triggering Conditions:** Specific circumstances that activate the disposition, potentially differing for each track.

  **Analysis of the Scenario:**

  1.  **The Compound Disposition:** The regulatory body possesses a compound multi-track disposition: **"Disposed to resolve disputes of type D if triggered, via either adjudicative review (Track A) or mediated settlement (Track B)."** The internal procedural rule determines which track is triggered for a specific dispute.
  2.  **Internal Veto (Adjudicative Pathway - Track A):**
      *   **Trigger:** The procedural rule selects Track A for a specific dispute D1.
      *   **Interference:** The internal veto *instantly disables* the adjudicative pathway *at the moment it is triggered* for D1.
      *   **Analysis as Fink:** This is a **classic fink**. The disposition for Track A *exists* prior to the trigger. The veto *removes* the specific dispositional capacity for Track A *precisely when it is triggered* for D1 (and presumably only temporarily). The body *loses the ability* to manifest via Track A *for that specific trigger event*. The underlying competence (e.g., trained judges, legal authority) might remain latent, but the dispositional property "disposed to resolve D1 via Track A" is finks away at the critical moment. The manifestation fails because the disposition vanishes when needed.
  3.  **External Statutory Reform (Mediated Settlement Pathway - Track B):**
      *   **Trigger:** The procedural rule selects Track B for any dispute D (or the conditions for mediated settlement are otherwise met).
      *   **Interference:** The statute systematically prevents the body from *successfully concluding* mediated settlements across *all* cases. However, the body's *internal rules, personnel, and intent* to mediate remain unchanged.
      *   **Analysis as Mask:** This is a **mask**. The disposition for Track B remains *intact* – the body still possesses the internal rules nominally permitting it, the trained mediators, and the underlying competence grounded in its charter. The statute creates an *external barrier* (e.g., invalidating mediated agreements, withholding necessary powers) that *systematically prevents* the manifestation (successful resolution via mediation) whenever the track is triggered. The disposition is present but frustrated.
  4.  **Compound Disposition & Interference:** The key question is whether the *overall* compound disposition ("disposed to resolve D") remains if both tracks are obstructed.
      *   **Fink on Track A:** Removes the Track A disposition *for the specific trigger* (the dispute D1 where Track A was selected). Track A is unavailable *for that case*.
      *   **Mask on Track B:** Prevents manifestation via Track B *for all triggers/cases*, but the Track B disposition persists.
      *   **Consequence for Compound Disposition:** The compound disposition **still exists**. The body retains the *capacity* to resolve disputes via either track *in principle*. The fink is temporary and case-specific (affecting only Track A for D1), while the mask is persistent but external to the body's intrinsic properties. Crucially, the **categorical base (founding charter, constitutive rules defining competence)** remains *unaltered*. The interferences are temporary (veto) or external (statute), not changes to the body's fundamental nature. The body is *disposed* to resolve D, even if both tracks are *currently obstructed* for a given dispute or period.

  **Does the Body Retain the Compound Disposition?**
  *   **Yes.** The founding charter remaining intact is decisive. The charter constitutes the body and grounds its fundamental competences, including the disposition to resolve D-type disputes. The veto is a temporary, internal operational failure affecting one track for a specific trigger. The statutory reform is an external, systematic barrier preventing manifestation on one track, but it doesn't revoke the body's *authority* or *internal capacity* defined by its charter to pursue that track. The *base property* (the charter-defined institutional structure and purpose) is unchanged. Therefore, the compound disposition persists.

  **Implications for Institutional Dispositions:**
  This scenario highlights crucial distinctions in institutional contexts:

  1.  **Base Property vs. Interference:** The **founding charter/constitutive rules** are the core categorical base grounding institutional dispositions. **Finks and masks are interferences *with* the manifestation of dispositions grounded in that base, not alterations *of* the base itself.**
      *   **Base Alteration:** If the charter were *amended* to *remove* the body's mandate to resolve D-disputes entirely, or to explicitly *eliminate* the adjudicative or mediated pathway, this would constitute a **destruction of the base property** and the associated disposition(s). This is not interference; it's ontological change.
      *   **Mere Interference (Fink/Mask):** The veto and statutory reform leave the charter and the body's core competence *defined by that charter* intact. They operate *on* the dispositions grounded in the base, preventing manifestation under specific conditions. The body's *institutional identity and fundamental capacities* remain unchanged.
  2.  **Source of Interference Matters:** Finks and masks can originate internally (like the veto) or externally (like the statute). What matters is *how* they interfere (removing disposition vs. blocking manifestation) and *whether they alter the base*.
  3.  **Resilience of Compound Dispositions:** Compound dispositions are robust. A mask or fink affecting *one track* does not destroy the *overall* disposition if other tracks remain *potentially* viable (even if currently masked/finked for a specific case). The disposition persists as long as the base property supports *any* pathway to manifestation, even if all are *temporarily* or *contingently* obstructed.
  4.  **"In Principle" Capability:** Institutional dispositions often hinge on "in principle" capability grounded in authority and rules, not just current operational efficiency. The body retains the disposition because its charter *authorizes and enables* resolution via these paths; the obstructions are exogenous or temporary operational failures.

  **Conclusion:**

  *   The **internal veto** acting precisely upon trigger is correctly analyzed as a **fink** on the specific adjudicative disposition (Track A) for the triggered case.
  *   The **external statutory reform** is correctly analyzed as a **mask** on the mediated settlement disposition (Track B), as it systematically prevents manifestation while the internal disposition persists.
  *   The **compound disposition** ("disposed to resolve D") **is retained** by the regulatory body. Both interferences are operational obstructions (a temporary fink and a persistent mask) affecting *manifestation pathways*, but they do **not** alter the **categorical base property** (the founding charter and constitutive rules) that grounds the body's fundamental competence and disposition.
  *   This underscores that in institutional contexts, **base-property alterations** involve changes to the constitutive rules or charter that redefine the entity's very nature and capacities, while **mere interference (finks/masks)** involves contingent factors preventing the *exercise* or *realization* of dispositions grounded in an unchanged base. The persistence of the founding charter is key to distinguishing the latter from the former.
