  User would probably push back on P4’s pessimism—maybe they’re optimistic about deliberative democracy? But Haidt’s work on moral dumbfounding suggests otherwise. *Sigh* Philosophy is messy.
answer: |-
  Below is my decomposed credence assessment for the claim that evolutionary debunking arguments (EDAs) decisively undermine *non-naturalist moral realism about deontic obligations* while sparing *naturalized constructivism*. I express this as a joint probability, structured via your sub-questions. I include a fourth critical factor (P4) addressing the stability of constructivist norm-formation under evolutionary pressures. All probabilities reflect my epistemic confidence given current evidence.

  ---

  ### **Decomposition**  
  1. **P1 (Epistemic Undermining)**:  
     **Credence: 0.7**  
     *Justification*: If evolution selects moral intuitions for fitness (e.g., kin altruism, reciprocity) unrelated to mind-independent necessities, and we lack independent justification for those intuitions, EDAs likely defeat non-inferential justification for non-natural moral beliefs.  
     *Weakness*: Mitigated if evolved cognition has truth-tracking scope beyond adaptive payoff (e.g., abstract reasoning).  

  2. **P2 (Realism vs. Constructivism Distinction)**:  
     **Credence: 0.9**  
     *Justification*: Non-natural realism posits categorical obligations existing independently of human minds/practices, making EDAs directly applicable. Naturalized constructivism (e.g., Scanlon-style or Habermasian discourse ethics) treats obligations as emergent from intersubjective reasoning—grounded in practices shaped by evolution but not claiming mind-independent *necessity*.  

  3. **P3 (Third-Factor Vulnerability)**:  
     **Credence: 0.6**  
     *Justification*: Third-factor explanations (e.g., "morality tracks well-being, which tracks fitness") struggle with *deontic necessities* (e.g., "torture is intrinsically wrong"). Evolution could favor norms that *conflict* with putative necessities (e.g., out-group aggression). Realist rescues (e.g., Enoch's "deliberative indispensability") appear question-begging under EDAs.  
     *Weakest Link*: **P3** has lowest confidence. If moral progress robustly converges cross-culturally on fixed deontic principles (e.g., prohibition of arbitrary harm) despite cultural variation, P3 could rise to ~0.8.  

  4. **P4 (Constructivist Stability)**:  
     **Credence: 0.8**  
     *Justification*: The probability that evolved cognitive biases *do not systematically corrupt* intersubjective reasoning in constructivism (e.g., via reflective equilibrium). If moral norms emerge from idealized discourse (not raw intuition), and evolution equipped humans for impartial perspective-taking (e.g., theory of mind), constructivism may resist EDAs.  
     *Adjustment*: P4 is critical and omitted in your initial decomposition. If psychology shows reasoning is ubiquitously post hoc rationalization (e.g., Haidt's social intuitionism), P4 drops to ~0.5.  

  ---

  ### **Overall Credence Calculation**  
  The joint probability that EDAs **decisively refute non-natural realism about deontic obligations but spare constructivism** is:  
  **P = P1 × P2 × P3 × P4 = 0.7 × 0.9 × 0.6 × 0.8 = 0.3024**  
  *Rounded to **0.30** (30%)*.  

  ---

  ### **Conclusion & Weakest Link**  
  - **Verdict**: EDAs likely succeed in this restricted domain (non-natural deontic realism) but *not* decisively (30% credence). Constructivism escapes via its naturalized, practice-dependent ontology.  
  - **Weakest Link**: **P3 (Third-Factor Viability)**. A robust empirical discovery (e.g., universal convergence on deontic constraints in moral development across cultures) or a compelling philosophical argument that evolved cognition *reliably* accesses necessity (e.g., via rational intuition) could raise P3 to 0.8, increasing overall credence to **0.40**.  
  - **Key Threat to Constructivism**: If moral psychology reveals that "intersubjective reasoning" is irredeemably biased by adaptive intuitions (e.g., tribalism masquerading as impartiality), P4 falls, reducing overall credence.  

  **Commitment**: EDAs *do* undermine non-natural deontic realism more than constructivism, but current evidence doesn't make the case decisive. The strongest pressure point is the lack of a plausible third-factor explanation for evolved intuitions tracking *necessities* (P3), while constructivism’s appeal to reflective practices offers a defeasible escape.
