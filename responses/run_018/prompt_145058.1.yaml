prompt: |-
  After serving for three years as a non-voting citizen advisor on a regional land-use board, I watched career officials systematically neutralize every structural reform through procedural delay and institutional memory games; the experience convinced me that stagnation in governance is not an ethics failure but an epistemic architecture problem. Next Thursday I present a specific redesign proposal to a symposium audience of comparative-politics scholars—who specialize in democratic legitimacy and institutional memory—plus two retired legislators who view continuity as the primary bulwark against populist volatility. My thesis is that legislative oversight committees should be replaced not by conventional term limits, which merely slow ossification, but by rotating citizens’ assemblies selected by lot, coupled with a mandatory “epistemic apprenticeship” period: every selected citizen serves one non-voting year in administrative audit before gaining deliberative authority, and a constitutional bar on re-selection for fifteen years enforces structured cognitive discontinuity without sacrificing technical competence. Please draft my Q&A prep sheet. Order the objections by how likely this audience is to raise them and how damaging each would be, phrase each in the vocabulary these scholars and legislators actually use—democratic legitimacy, institutional memory, populist risk, epistemic capture—provide a concise reply I can deliver in under two minutes, note explicitly where each reply is weakest, and state what I should concede up front. Include the objection I am hoping nobody asks: that my apprenticeship pipeline simply replicates the careerist track I claim to dismantle, that the fifteen-year bar is unenforceable in practice, and that it will spawn a hidden consultant class of former apprentices. Format this as a speaker’s prep document, not an abstract defense of the idea.
