  ### Taxonomy: The Boundary Problem in Democratic Theory  
  *Who Belongs in the Demos? A Decision Tree Approach*  

  **Start Here:**  
  #### 1. Can membership apply to entities that **don’t experience welfare**?  
  *(Welfare = capacity for well-being/suffering, e.g., humans do, rocks/AI don’t)*  
  - **YES** → Go to 1.1  
  - **NO** → Go to 2  

  **Branch 1.1 (Non-welfare entities):**  
  #### Is it an artificial agent **persistently governed by law**?  
  *(e.g., a non-sentient AI legally bound by regulations)*  
  - **YES** → **Leaf A: Non-sentient AI governed by law**  
    - *Position:* Unoccupied.  
    - *Gap:* Unexplored (weird edge case—can law bind something without interests?).  
  - **NO** → **Leaf B: Affected non-welfare entity**  
    *(e.g., a forest impacted by policy)*  
    - *Position:* Unoccupied.  
    - *Gap:* Ugly (feels arbitrary to exclude, but no framework fits).  

  **Branch 2 (Welfare-capable entities only):**  
  #### 2. Is **being subjected to coercive law** necessary?  
  *(Subjected = directly bound/enforced, e.g., citizens/visitors)*  
  - **YES** → **Leaf C: All-Subjected (AS)**  
    - *Position:* Membership requires being ruled by the polity’s coercive power.  
    - *Caveat:* Tree can’t fully split AS vs. Stakeholder for tax-paying expats (both may qualify).  
  - **NO** → Go to 3  

  #### 3. Is **being causally affected** sufficient?  
  *(Affected = interests impacted by decisions, e.g., trade partners)*  
  - **YES** → Go to 3.1  
  - **NO** → Go to 4  

  **Branch 3.1 (Affected is sufficient):**  
  #### Is the entity **only affected in the future**?  
  *(e.g., future generations facing climate choices)*  
  - **YES** → **Leaf D: Future-only affected**  
    - *Position:* Unoccupied.  
    - *Gap:* Ugly (clearly impacted, but no institutional mechanism).  
  - **NO** → **Leaf E: All-Affected-Interests (AAI)**  
    - *Position:* Membership for all whose welfare is altered by decisions.  

  **Branch 4 (Neither subjected nor affected suffices):**  
  #### 4. Can **shared nationality** substitute?  
  *(e.g., diaspora with cultural ties but no residency/impact)*  
  - **YES** → **Leaf F: Co-nationalist (CN)**  
    - *Position:* Identity/national ties define membership, even without coercion/impact.  
  - **NO** → **Leaf G: Territorial-Only (TO)**  
    - *Position:* Membership requires physical presence, full stop.  

