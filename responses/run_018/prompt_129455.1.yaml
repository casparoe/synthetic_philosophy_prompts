  ### Tree Summary (8 Leaves):  
  - **A.** Non-sentient AI governed by law *(unoccupied)*  
  - **B.** Affected non-welfare entity *(unoccupied)*  
  - **C.** All-Subjected (AS)  
  - **D.** Future-only affected *(unoccupied)*  
  - **E.** All-Affected-Interests (AAI)  
  - **F.** Co-nationalist (CN)  
  - **G.** Territorial-Only (TO)  

