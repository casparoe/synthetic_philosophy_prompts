       Alternatively, let's consider the entire world state. There are two types of developers: committed and uncommitted. The committed always do the review, the uncommitted skip when it's costly. The team lead's override is only for the committed.

       The developer has been committed so far (perfect history). If they choose to do the review now, they are continuing to be committed. If they skip, they become uncommitted.

       But EDT doesn't reason about types in the same way. It looks at the conditional probability of the outcome given the action.

       For EDT, the key is: what does choosing to do the review tell me about the world?

       The outcome we care about: avoiding the week delay. This can happen in two ways:
          (i) The tag is present (so no block) -> happens with probability 1-p if we do the review, 0 if we skip.
          (ii) The tag is missing but the team lead overrides.

       The probability of (ii) given that we do the review: 
          - The override happens only if the developer is committed. Since we are doing the review, we are committed (both now and in the past). So the override will happen if the tag is missing. So the probability of avoiding the delay given we do the review is: 
