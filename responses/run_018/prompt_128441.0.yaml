  We are going to create a scenario in a tech workplace that reverses the typical alignment of decision theories regarding a rational commitment. In the classic Parfit's hitchhiker, the hitchhiker benefits by having a disposition to pay the driver upon being saved because the driver can predict this and thus picks him up. However, in that case, evidential decision theory (EDT) and causal decision theory (CDT) both endorse the commitment because the driver's prediction is based on evidence of the hitchhiker's type (i.e., the disposition). We want to reverse this so that CDT endorses the commitment while EDT rejects it.

   Key idea: We need a scenario where the commitment (a costly disposition) is not directly observable as evidence of one's type, but its effects are causally beneficial. Specifically, we want that having the disposition leads to actions that cause a good outcome, but the disposition itself does not provide evidence of the good outcome (because the predictor is not relying on evidence of the disposition but rather the predictor is triggered by the actions that are the effects of the disposition). Alternatively, we can have the predictor base the reward on observing the actions that are caused by the disposition, not on the disposition itself. Moreover, we want that if one does not have the disposition, one would not take the actions that trigger the predictor's reward, but having the disposition and thus taking the actions is costly.

   However, to reverse the usual alignment, we need EDT to reject the commitment because the evidence provided by the commitment (or the actions that result from it) is not linked to the reward in the way that makes it evidentially good. We can achieve this by making the reward dependent on a causal chain that the disposition sets off, but the evidence of having taken the action (which is the result of the disposition) is actually evidence that the reward will not occur (because of how the predictor is set up). This is tricky.

   Alternate approach: We can use a scenario where the predictor is not predicting the disposition but is instead set up to reward based on the occurrence of a specific action (which is caused by the disposition). However, the predictor's mechanism is such that if the action is taken, then the predictor has already acted to prevent the reward. This is similar to the "murder lesion" or "Newcomb's problem with a bomb" type of scenarios. But we want it in a tech workplace and without science fiction.

   Let's design:

   Scenario: At a tech company, there is a deployment pipeline that requires peer review for any code change. The company has an AI monitoring system that, for security reasons, flags any change that is pushed without having gone through a rigorous peer review. The AI system is designed such that if it detects a change that was pushed without peer review, it will automatically roll back the deployment and block the developer from deploying for a week (a severe cost). However, the AI system does not monitor the peer review process itself (which is a human process) but instead monitors the deployment logs. The system is set up to check the deployment logs for a specific marker: the presence of a "peer-reviewed" tag that is automatically added by the peer review tool when a review is completed and approved.

   But here's the twist: The peer review tool has a bug. Occasionally, it fails to add the tag even when the review was done (a false negative). The AI system, however, is perfectly accurate in reading the tag: if the tag is present, the deployment is allowed; if not, it rolls back and blocks.

   Now, the developer has two options for a critical hotfix:
     Option 1: Skip peer review and push directly. This is fast but risky: without the tag, the AI will block and cause a week delay and rework.
     Option 2: Do peer review. This takes time and effort (costly) and might still fail to produce the tag (if the bug occurs). But if the tag is produced, the deployment goes through.

   However, there's a predictor involved. The predictor is not a separate entity but is built into the AI system. Actually, let's reframe.

   We want a commitment: a disposition to always do peer review even when it is costly (in time and effort). The benefit comes from a predictor that rewards the developer for having the disposition? How?

   Instead, let's introduce a human element: the team lead. The team lead has a practice of monitoring the developers' behavior. The team lead has set up a system where if they observe that a developer has a disposition to always do peer review (even when it's costly and even when the hotfix is urgent), then they will personally vouch for the developer in case of an AI block, overriding the block. However, the team lead cannot directly observe the disposition. They can only observe the outcome: whether the developer attempted a deployment without the peer review tag. If they see that a developer attempted a deployment without the tag, they will not help (because that is evidence that the developer lacks the disposition). But if the developer does the peer review and the tag is missing due to the bug, then the team lead will step in and override the AI block only if they believe the developer has the disposition.

   How does the team lead form the belief? They have a predictor: they track the developer's history. If the developer has always done peer review in the past (even when it was costly) then the team lead believes they have the disposition. But note: the current action is also part of the history. So if the developer does peer review now, that adds to the history of doing peer review, which makes the team lead more likely to believe in their disposition. However, the team lead only acts when they see a deployment without a tag. So the developer doesn't know when the team lead will step in.

   This is getting complex. We need a simpler setup.

   Revised scenario:

   In a tech company, there is a deployment system that uses an AI to check for a mandatory security review. The AI checks the deployment log for a "security-reviewed" tag. If the tag is missing, the deployment is rolled back and the developer is blocked for a week (costly). The security review process is time-consuming and sometimes unnecessary (because the change might be trivial). But the company policy requires it. However, the security review tool is flaky: it sometimes fails to attach the tag even when the review is done (with a known small probability).

   The team lead has a backup mechanism: they have a predictor that estimates the developer's commitment to following the security process. The predictor is based on the developer's history of attempting deployments without the tag. Specifically, if the developer has never attempted a deployment without the tag in the past (i.e., they have always done the security review even when it was costly and even when they knew the tool might fail), then the team lead will override the AI block if the tag is missing due to the tool's failure. But if the developer has ever skipped the review (and thus attempted a deployment without the tag) in the past, then the team lead will not override.

   The current situation: The developer has a critical hotfix. They have two choices:
     A) Skip the security review: This avoids the time cost now. But without the tag, the AI will block and cause a week delay. Also, this action will mark the developer as having skipped in the past, so the team lead will never override for them in the future.
     B) Do the security review: This takes time (costly). With high probability, the tag is attached and deployment succeeds. But with a small probability, the tag is missing. However, if the tag is missing and the developer has always done the review in the past (including now), then the team lead will override and the deployment will go through. But note: if the developer has ever skipped in the past, then even if they do the review now and the tag is missing, the team lead won't override.

