  Notably, Case 5's combination of features - especially the failure of long-term calibration on first-person evidence - genuinely underdetermines Voss's response. Her prior cases all had either resolvability potential (climate/art) or clear non-resolvability grounds to stand firm (math). This occupies a troubling middle ground.

