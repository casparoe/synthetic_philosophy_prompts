answer: |-
  ## Research Proposal: Horizontal Peer-Defection vs. Vertical Hierarchies: Disaggregating Mechanisms of Normative Collapse in Honor Worlds

  **1. Research Question:**
  Does the collapse of the honor norm of dueling in 19th-century Europe represent a mechanism of normative change fundamentally distinct from that driving the abolition of slavery, thereby necessitating the disaggregation of Appiah’s unified "honor-world" framework and challenging Williams’ interest-convergence thesis, specifically through the lens of peer-to-peer signaling dynamics versus vertically embedded economic/legal structures?

  **2. Background and Problem Statement:**
  Kwame Anthony Appiah’s influential framework in *The Honor Code* posits that practices like dueling, foot-binding, and slavery collapsed primarily due to internal contradictions within their respective "honor worlds." As these practices became publicly perceived as dishonorable (lacking "credibility"), the very honor codes sustaining them unraveled. Conversely, Bernard Williams’ perspective, particularly in *Shame and Necessity* and related work, suggests that such shifts are driven more fundamentally by changing material interests and power dynamics, with shifts in moral sentiment or honor codes being epiphenomenal or secondary rationalizations.

  While both frameworks offer powerful insights, this project contends that they inadequately account for the *structural context* of norm enforcement and collapse. Existing analyses often treat diverse honor norms as falling under a single explanatory umbrella (Appiah) or reduce them to underlying interests (Williams). This overlooks a critical distinction: the locus and nature of the social pressures enforcing the norm. Specifically, the project identifies a gap in explaining how norms collapse *without* requiring either a broad societal moral revolution (Appiah's "credibility" condition) or a fundamental shift in macro-level political-economic interests (Williams). The central problem is the potential conflation of distinct causal pathways under unified models of normative change.

  **3. Thesis and Original Contribution:**
  This project argues that the collapse of dueling exemplifies a distinct mechanism of normative change: **horizontal peer-defection within a localized cohort.** Dueling thrived on reciprocal signaling among social peers; its collapse occurred when refusal to accept or issue challenges became a credible stance *within specific, interconnected peer groups*, driven by evolving local perceptions of risk, reputation, and the practical absurdity of the practice, independent of sweeping moral condemnation or major economic restructuring. In contrast, the abolition of slavery, deeply embedded within **vertical structures** of economic exploitation, legal codification, and state power, required coordinated action targeting those hierarchical systems – legislative battles, economic shifts, mass mobilization, or war – making cohort-level refusal insufficient. While honor discourse played roles in both contexts, the *mechanism* of collapse differed fundamentally.

  This framework offers a novel contribution by:
  *   **Disaggregating Mechanisms:** Proposing a typology of normative collapse mechanisms: *Horizontal Peer-Defection* (reliance on reciprocal peer signaling), *Vertical Hierarchical Disruption* (reliance on top-down enforcement/economic structures), and potentially *Hybrid* forms.
  *   **Refining Appiah:** Showing that "credibility" loss operates differently: in horizontal cases (dueling), it can be hyper-local and cohort-driven; in vertical cases (slavery), credibility loss often *follows* or *accompanies* institutional disruption rather than solely preceding it.
  *   **Complicating Williams:** Demonstrating that while interests matter, the *type* of interest (e.g., maintaining peer status vs. protecting economic investment) and the *structural pathway* for pursuing that interest (peer negotiation vs. systemic political/economic change) are crucial and distinct.
  *   **Introducing Signaling Structure:** Highlighting the foundational role of the norm's enforcement structure (peer-to-peer reciprocity vs. top-down hierarchy) in determining the viable pathways for its dissolution.

  **4. Methodology:**
  This project employs a **conceptual-comparative methodology** focused on rigorously analyzing the theoretical frameworks and historical narratives surrounding two paradigmatic cases:

  1.  **Conceptual Analysis:** Deconstructing Appiah’s "honor-world" and "credibility" concepts, and Williams’ core arguments regarding interests and moral change, to identify their implicit assumptions about norm enforcement and collapse mechanisms. Developing precise definitions for "horizontal peer-defection" and "vertical embeddedness" as analytical tools.
  2.  **Comparative Case Study:** Conducting a focused, secondary-source-based comparison of the *processes* of collapse for:
      *   **Dueling (Horizontal Case):** Examining how refusal spread within aristocratic/military cohorts in early-mid 19th century Europe (e.g., UK, France, Germany), focusing on changing attitudes towards the practice's utility, risk, and social meaning *among peers*, the role of ridicule, and the absence of a single decisive legislative or economic blow.
      *   **Slavery (Vertical Case):** Analyzing the Atlantic abolition movement, emphasizing the necessity of targeting legal frameworks (e.g., court cases like Somerset, abolition acts), disrupting economic systems (e.g., boycotts, changing plantation economics), and large-scale political mobilization, alongside moral arguments. Highlighting the insufficiency of individual or small-group refusal by slaveholders or even enslaved people alone.
  3.  **Mechanism Typology Development:** Synthesizing the comparative analysis to articulate the proposed typology of normative collapse mechanisms (Horizontal, Vertical, Hybrid), specifying the conditions under which each is likely to operate and the distinct causal sequences involved.

  **5. Work Plan (One Semester):**
  *   **Weeks 1-2:** Deep dive into Appiah (*The Honor Code*, relevant essays) and Williams (*Shame and Necessity*, "Modernity, and the Substance of Ethical Life," relevant chapters). Precise conceptual mapping of their arguments regarding dueling and slavery.
  *   **Weeks 3-4:** Foundational research on historical narratives of dueling's decline (focusing on peer dynamics, shifting attitudes within elites, legal changes as *reflecting* rather than *causing* shifts) and the abolition of slavery (focusing on institutional, economic, and political drivers alongside moral campaigns). Identification of key secondary sources.
  *   **Weeks 5-6:** Detailed comparative analysis: What specific actions/events triggered change? Who were the key actors enforcing/challenging the norm? What structures/resources were necessary for successful challenge? How did challenges spread? Explicitly map findings onto Horizontal/Vertical framework.
  *   **Weeks 7-8:** Refinement of the Horizontal Peer-Defection and Vertical Hierarchical Disruption concepts. Articulation of the typology. Begin drafting core argument sections.
  *   **Weeks 9-10:** Full draft composition, integrating conceptual analysis and comparative findings. Explicitly address counterarguments (e.g., could slavery abolition involve horizontal elements? Was dueling purely horizontal?).
  *   **Weeks 11-12:** Revision and refinement. Tighten argument, ensure clarity of typology, solidify comparative contrast. Final proofreading and formatting.

  **6. Expected Outcomes and Success Criteria:**
  *   **Successful Result:** A compelling 8,000-word paper demonstrating:
      *   A clear conceptual distinction between horizontal peer-defection and Appiah's credibility-based model / Williams' interest-based model.
      *   A robust comparative analysis showing that the collapse of dueling *required* and *was enabled by* its horizontal, peer-enforced structure, while the abolition of slavery *required* targeting its vertical, hierarchical embeddedness.
      *   A well-defined preliminary typology (Horizontal, Vertical, Hybrid) of normative collapse mechanisms derived from the comparison.
      *   A persuasive argument that recognizing these distinct mechanisms is necessary for a more nuanced understanding of moral revolutions and challenges the explanatory sufficiency of both Appiah's unified honor-world model and Williams' interest-reductionism for *all* cases.
  *   **Failure:** The paper would fail if it:
      *   Cannot establish a clear, meaningful distinction between the collapse mechanisms of dueling and slavery beyond surface differences.
      *   Fails to show that "peer-defection" is conceptually distinct from, and not merely a subset of, Appiah's "credibility loss" or Williams' "interest convergence."
      *   Overstates the "purity" of the cases (e.g., ignores any vertical elements in dueling's persistence or horizontal elements in abolition).
      *   Results in a typology that is either too vague to be useful or too rigid to accommodate historical complexity.
      *   Does not significantly advance beyond simply restating or slightly nuancing Appiah or Williams.

  **7. Scope and Limitations Assessment:**
  This project is ambitious but feasible within one semester due to its conceptual and comparative nature (avoiding primary archival research). The scope is deliberately focused on rigorously comparing *only* dueling and slavery as paradigmatic cases to establish the core distinction between horizontal and vertical mechanisms. This provides a strong foundation without attempting an exhaustive survey of all honor norms.

  **Key Limitations:**
  *   **Case Selection:** Focusing solely on dueling and slavery provides depth but limits generalizability. The typology will be preliminary, requiring future testing on other cases (e.g., foot-binding, honor killings).
  *   **Secondary Sources:** Reliance on existing historiography means the analysis is interpretative of others' findings rather than presenting new empirical discoveries.
  *   **Complexity of Slavery:** The analysis necessarily simplifies the immensely complex and multifaceted struggle against slavery, focusing primarily on the structural *mechanism* of collapse rather than its full moral or historical dimensions.
  *   **"Hybrid" Mechanisms:** While the existence of hybrid cases will be acknowledged, developing a full taxonomy is beyond the semester's scope.

  This project offers a crucial refinement to theories of normative change by introducing structural context as a key variable. By demonstrating that the collapse of dueling represents a distinct pathway—horizontal peer-defection—unavailable to norms embedded in vertical hierarchies like slavery, it challenges unified models and provides a more granular toolkit for analyzing moral revolutions. The proposed typology holds significant promise for understanding diverse cases of social norm transformation.
