  Please draft the adversarial-collaboration statement that a Davidsonian philosopher of action and a behavioral-economist proponent of hyperbolic discounting might jointly sign after a sustained exchange on weakness of will. Structure the document in four parts. First, a numbered list of agreed claims—covering at least that agents sometimes act against their all-things-considered judgments, that temporal proximity systematically alters preference orderings, and that voluntary precommitment mechanisms are empirically observed—formulated so that neither party needs to retract them. Second, a disagreements table stating each camp’s core position in wording its own adherents would accept: address whether akrasia is fundamentally a failure of practical reasoning or the predictable output of a stable intertemporal choice function with a declining discount rate, and specify where exactly the explanatory divergence lies. Third, identify the central cruxes, including whether diachronic authority—the normative claim that an earlier preference-state can legitimately constrain a later one—retains its force if discounting is hyperbolic rather than exponential, and whether the efficacy of cooling-off contracts demonstrates rational self-binding or instead reveals the presence of competing temporal selves whose interests conflict. Fourth, for each crux provide one concrete hypothetical case or empirical pattern that both sides accept as bearing on it, together with each side’s explicit prediction about the outcome. Maintain a formal, professorial tone; do not include citations, bibliographies, or requests for further reading; and ensure that every formulation in the disagreements section is neutral enough to be signed by the party it describes yet precise enough not to be vacuous. Write as if preparing this document for an interdisciplinary philosophy-and-economics working group that needs to locate the exact boundary between conceptual disagreement and empirical divergence.
