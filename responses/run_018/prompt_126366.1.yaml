answer: |-
  - **My credence: 0.45**  

  ### Decomposition:  
  1. **Behavioral criterion avoids circularity:** *0.65* — Defining "experiments they accept" risks bootstrapping, but operationalizing "accept" via pre-registered tests helps.  
  2. **Pseudosciences fail 10-year test:** *0.40* — Groups like homeopaths *do* ignore decades of negative RCTs; astrology reinterprets "failed" predictions ad hoc.  
  3. **Demarcation needs sharp boundary:** *0.80* — Fuzzy borders (e.g., psychiatry) exist, but practical policy (e.g., medical licensing) requires *some* line.  
  4. **Defining "contradiction" clearly:** *0.50* — Noise vs. signal is often contested (e.g., parapsychology dismissing null results).  
  5. **Proponents' identity/authority:** *0.60* — "Proponents" could mean leaders (who might concede) vs. grassroots (who won’t), creating ambiguity.  
  6. **Timeframe adequacy:** *0.70* — 10 years is plausible for fields with rapid testing (physics), less so for slow ones (cosmology).  

  ### Where you disagree:  
  Your 0.35 vs. roommate’s 0.75 likely centers on **sub-question #2 (pseudosciences failing in practice)**. You’re emphasizing how proponents *never* truly abandon core tenets (e.g., homeopaths blaming "impure water"), while your roommate trusts the criterion forces abandonment under pressure.  

  ### Weak link:  
  **Sub-question #2 (0.40 credence)** — I’m least sure whether adherents’ *observed* defiance stems from bad-faith avoidance or genuine (if flawed) belief adaptation.  

  ### What would move me:  
  **Concrete evidence of pseudoscience abandonment** — e.g., a major astrological association publicly renouncing sun-sign compatibility after 10 years of controlled studies showing null results, *without* replacing it with an unfalsifiable alternative.  

  ---  
  *Note: Combines via rough geometric mean of sub-credences, weighted toward #2 as the critical failure point. Your 0.35 likely weights #2 lower (~0.25); roommate’s 0.75 likely weights it higher (~0.65).*
