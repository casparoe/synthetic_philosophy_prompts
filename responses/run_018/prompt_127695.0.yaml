prompt: |-
  You are a philosopher of cognition with deep familiarity in analogy theory, conceptual blending, and the cognitive science of reasoning, particularly in the tradition of Hofstadter and Sanders’s work on surfaces and essences. Before answering, take a moment to brainstorm: list at least three related phenomena or failure modes in analogical reasoning that might be nearby in conceptual space, and note briefly how each differs from the pattern described below.

  Here is a recurring configuration I have noticed in analogical arguments—both in everyday reasoning and in theoretical modeling—and I do not know whether it carries an established name.

  Consider cases where an analogy is drawn between a well-structured source domain and a more ambiguous target domain. The reasoner correctly maps the explicit relational structure—entities, relations, and causal links—but also imports what we might call the “resilience profile” of the source: properties about which parts of the source are hard to alter, which are protected by background rules, and which are “load-bearing” for the structure’s stability. In the target domain, these robustness properties have no clear counterpart, yet they are treated as if they had been mapped too.

  For instance, in a debate about institutional reform, someone analogizes a university to a corporation and then treats tenure as structurally protected—not because there is an independent argument that tenure serves a load-bearing function in universities, but because shareholder protections are load-bearing in corporations, and the analogy has smuggled in that modal robustness. In another case, a moral philosopher analogizes ethical reasoning to legal interpretation and begins treating certain ethical “precedents” as binding in ways that mirror stare decisis, not because ethical reasoning possesses an institutional mechanism for binding precedent, but because the source domain’s resistance to overturning prior cases is imported as a structural feature of the target.

  The result is not simple overextension—no new entities or relations are invented—but rather a kind of “modal drag,” where the target inherits constraints on changeability that come solely from the architecture of the source.

  My questions are these:

  1. Is there an established concept in the analogy, cognitive science, or philosophy of science literature for this specific importation of robustness, resistance-to-change, or load-bearing properties across domains?
  2. If such a concept exists, how exactly does it differ from frame blending, source-domain leakage, and ordinary analogical overextension? Where are its boundaries?
  3. If there is no established term, please coin one, define it precisely, and specify at least two boundary cases—situations that look similar but are not instances of this phenomenon—explaining why they fall outside.

  Please do not provide a bibliography, reading list, or citations; I am interested in the conceptual carving itself. Answer as if explaining to an informed interlocutor who knows the general framework of analogy as central to cognition but has not yet encountered this particular distinction.
reasoning: |-
  Okay, the user is asking about a specific pattern in analogical reasoning where not just the relational structure but also the "resilience profile" of the source domain gets imported into the target domain. They want to know if there's a term for this, how it differs from related concepts, and if not, to coin a term. 

  First, I need to brainstorm related phenomena. The user mentioned frame blending, source-domain leakage, and analogical overextension. Let me list three nearby failure modes:

  1. **Structural Overprojection**: This is when you project too much of the source's structure onto the target, adding entities or relations that don't exist. But in this case, no new entities are added—just the robustness properties. 

  2. **Essentialism Fallacy**: Mistaking contingent features of the source as essential to the concept. But here, it's about resilience, not essence—like how much you can tweak a part before the system breaks. 

  3. **Domain Collapse in Blending**: When blending two concepts, losing track of which domain a feature comes from. But here, it's specifically about importing the source's *stability constraints*, not general features. 

  The user's examples are spot-on: treating tenure like shareholder protections or ethical precedents like legal stare decisis. The key is the "modal drag"—importing *how change-resistant* certain parts are. 

  For their questions: 

  1. I don't recall an established term for this exact thing. Hofstadter talks about "slippage" and "essences," but not this resilience profile specifically. 

  2. Differences:  
     - **Frame blending** creates new hybrid structures; here, the target's structure stays the same but *inherits rigidity*.  
     - **Source leakage** brings in surface features; this brings in *invisible constraints*.  
     - **Ordinary overextension** adds new parts; here, the parts exist but become "fragile" or "sturdy" by analogy.  

  3. Need to coin a term. "Resilience transference"? Too vague. "Modal contamination"? Sounds judgmental. Maybe **structural inertia import**—captures the "resistance to change" aspect. Or **load-bearing carryover**? 

  Best fit: **Modal Scaffolding Transfer**.  
  - "Modal" for possibility/necessity (how changeable things are).  
  - "Scaffolding" for the hidden support structure.  
  - "Transfer" for the unwarranted import.  

  Boundary cases:  
  - If someone argues a university *needs* tenure because corps *need* shareholders—that's **essentialism**, confusing necessity.  
  - If someone says ethical precedents *are* legally binding—that's **domain collapse**, conflating identities.  

  This pattern is sneaky because the mapped structure is correct—it’s the *counterfactual robustness* that’s smuggled in. User’s onto something subtle here.
answer: |-
  Based on your description, this is a sophisticated and under-discussed pattern in analogical reasoning. After considering related phenomena, here's a breakdown:

  **Brainstormed Nearby Phenomena with Distinctions:**  
  1. **Structural Overprojection**: Adding unmapped *entities* or *relations* from the source (e.g., assuming universities have "profit motives" because corporations do). *Differs*: Your case maps valid relations but smuggles in *stability conditions* around those relations, without adding new elements.  
  2. **Essentialism Fallacy**: Mistaking contingent source features as necessary to the target concept itself (e.g., "Corporations *must* have shareholders, so universities *must* have tenure"). *Differs*: Your case imports *contextual resilience* (how easily a part *can be changed* given system constraints), not essential properties.  
  3. **Source-Domain Freezing**: Treating the source as a rigid template, refusing target adaptation. *Differs*: Your case allows surface mapping but implicitly transfers the source's *structural dynamics* (e.g., which joints are "stiff" or "pivotal") to the target.  

  **Answers to Your Questions:**  

  1. **Established Concept?**  
     No single term captures this precisely. While Hofstadter/Sander's "conceptual slippage" and Fauconnier/Turner's "blending" touch on it, they lack specificity for *modal robustness transfer*. Work on "analogical entrenchment" (Gentner) or "causal schema migration" (Holyoak) comes close but doesn't isolate the *resilience profile* aspect.  

  2. **Distinctions from Related Concepts:**  
     - **Frame Blending**: Creates emergent structure (e.g., "university-corporation hybrid"). *Your case* preserves the target's explicit structure but *infuses it* with the source's hidden stability constraints.  
     - **Source-Domain Leakage**: Involves surface-feature transfer (e.g., picturing ethical dilemmas in courtroom imagery). *Your case* transfers abstract, counterfactual properties ("how much force to break this part?").  
     - **Ordinary Analogical Overextension**: Adds incorrect entities/relations. *Your case* has valid mappings but grafts on the source's *resistance to alteration* for existing elements—like adding invisible "buttresses" to the target structure.  

  3. **Coined Concept: Modal Scaffolding Transfer (MST)**  
     **Definition**: The unconscious importation of *source-domain stability conditions*—specifically, the relative resistance to alteration, load-bearing centrality, or counterfactual robustness of mapped elements—into the target domain, despite the absence of equivalent structural constraints. This results in the target inheriting an implicit "architecture of changeability" from the source.  

  **Boundary Cases (Non-Examples):**  
     - **Systemic Overconstraint**: A scientist models climate as a mechanical system and *adds* "friction coefficients" to atmospheric processes. *Why not MST?* New *relations* (friction) are invented. MST requires pre-mapped elements to inherit *hidden rigidity* without adding components.  
     - **Functional Necessity Transfer**: Arguing that "since engines require fuel, minds require calories—thus cognition *cannot* exist without biological metabolism." *Why not MST?* This imports *functional* necessity (what the system fundamentally needs), not *architectural* resilience (which parts break first under pressure). MST concerns *which alterations destabilize the whole*, not what sustains it.  

  **Key Insight**: MST is uniquely pernicious because it preserves surface mapping validity while covertly dictating *how the target domain must behave under modification*. It conflates the source's *contingent structural affordances* (e.g., legal systems needing *stare decisis* for consistency) with the target's *inherent logic* (e.g., ethical reasoning lacking institutional enforcement). The result is "modal drag"—not wrong parts, but wrongly stiffened joints.
