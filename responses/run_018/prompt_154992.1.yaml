  For the question structure, I should break it into five clear parts: 
  First, students must extract the hidden assumptions behind an institutional reading (centralized redistribution). 
  Second, they do the same for a belief-based reading (cosmological obligation). 
  Third, they demonstrate why both interpretations fit the same evidence equally well - that's the observational symmetry. 
  Fourth, they need to propose discriminating evidence beyond just "more context" - this is the toughest part. 
  Finally, they reflect on what this symmetry says about archaeology's limits regarding institutions vs. representations.

