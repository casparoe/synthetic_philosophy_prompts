    - **"Practical Obscurity" Erodes**: Digital search tools → "frosted glass" becomes transparent.  
  - **No Expression**:  
    - Unified federal data standards (patchwork state laws create "leaky walls").  
    - Proactive citizen protections (reliance on *ex post* litigation).  

