prompt: |-
  You are an expert in bioethics and philosophy of personal identity. Please think carefully and begin by brainstorming the logical space of answers before constructing the instrument. I am a high school student writing a decision-tree handout for a seminar on advance directives and whether an earlier self can bind a later one. I want a taxonomy—branching by concrete claims, not by author names—that sorts positions according to what they actually hold. Root node: does the earlier self retain authority over the later self after severe cognitive change? First-level branches should split on the source of that authority (contractual autonomy, narrative continuity, or presentist denial), on whether cognitive decline fractures identity or only obscures it, and on whether the directive's content (e.g., refusing life-sustaining care) is treated differently from its procedural origin. For each leaf, provide a standard label if one exists, otherwise 'unnamed,' plus one sentence describing its most awkward commitment. Explicitly note any logically possible answer-combination that is unoccupied and diagnose briefly why (incoherent, unattractive, or unexplored). Inject one less-common framing: treat part of the debate as a problem of 'epistemic deference'—whether the later self should defer to the earlier self's reasoning about values—rather than only as a problem of authority between persons. Do not include bibliographies, citations, or reading lists. Flag any two leaves that your tree cannot genuinely distinguish. Keep the tree concise but precise, using concrete cases (e.g., dementia with retained emotional continuity, total personality replacement) at the nodes.
