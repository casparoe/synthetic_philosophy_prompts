prompt: |-
  I write narrative content for memorial museums and historic sites, and over the better part of fifteen years I have noticed a pattern in which defeats become usable to the people who inherit them. I have never found a word for it. I would like to know whether there is an established concept for what I am describing, and — this matters to me more than the label — how exactly it should be carved and where its edges fall.

  What I keep running into is this. Of the defeats a community could remember, the ones that become the emotional centre of its memory are the ones that hand later generations a loss with nothing attached to it: the losers are frozen at the moment of destruction, having acted but, as it seems, not having chosen. The 1940 evacuation from Dunkirk is inherited as small boats and rescue; the armistice that followed it, and the years of government under the occupier after that, are inherited as something else entirely — a subject that took decades to become discussable at all. The Confederate commemoration that took hold in the decades after 1865 is assembled out of the charge at Cemetery Ridge, the dead, and the generals; the actual programme of the government those men fought for, and its record of conscripting, impressing and taxing, was progressively dropped, and oddly the commemoration seems to have grown stronger as the original stake became less sayable. The Kosovo battlefield is inherited as a single afternoon and a refusal, not as the centuries of accommodation that came afterwards. And the last holdout at Masada became an emblem of defiance, while the far larger catastrophe of the Temple's destruction was inherited as grief and self-reproach rather than as a founding story.

  My working explanation is that a defeat is myth-ready to the extent that inheriting it does not require inheriting the losers' exercise of power, either before or after the loss — so that what gets commemorated is the losing itself rather than what was lost. This is not just the familiar "moral victory" move; that is something a community does with a defeat, whereas what I am describing looks like a property of the defeat, since it predicts which defeats the move will work on. But two cases make me doubt the explanation. The Charge of the Light Brigade is a defeat with a documented blunder and an argument about whose fault it was that has never ended, and it is commemorated anyway. And victories get turned into emblems too, which makes me unsure whether defeat has anything essential to do with it.

  So: is there an established term for this property — the thing that makes some defeats inheritable as emblems and others only as embarrassments — or does the relevant literature have concepts near it that my description only partly fits? If the latter, tell me which are nearest, how my description differs from each, and which fits best. If there is nothing established, coin a name and define it, and fix its boundaries so that the two cases above fall inside or outside for a stated reason, rather than leaving them as loose ends. I am not writing an academic piece, so please do not spend your answer on a bibliography, further reading, or citations: I want the concept, its edges, and the argument for why you drew the boundary where you did. Lead with your bottom line in the first sentence, then give the reasoning; no preamble and no restatement of what I have asked.
reasoning: |-
  Okay, the user is asking about a pattern they've noticed in their work: certain defeats become central to a community's memory when they can be remembered without the complexities of the losers' choices or exercise of power. They want to know if there's a term for this or if I need to define it, including clear boundaries.

  First, I need to unpack their examples. Dunkirk's evacuation is celebrated for the rescue effort, but the subsequent occupation isn't. Confederate commemoration focuses on battles and generals, ignoring their government's policies. Masada is a symbol of defiance, while the Temple's destruction is remembered with grief. The key seems to be that these events are mythologized when the narrative avoids the losers' agency or responsibilities.

  The user mentions that defeats become "usable" when the loss is clean, without attached baggage. Their working theory is that it's about not inheriting the exercise of power. But they have doubts because the Charge of the Light Brigade is commemorated despite known blunders, and victories can also become emblems. So, is defeat essential here?

  I recall concepts like collective memory, mythmaking, and tragic framing. Terms like "chosen trauma" or "narrative smoothing" might be related. But they don't fully fit. Chosen trauma involves internalizing a loss but doesn't exclude agency. Narrative smoothing simplifies events but doesn't specifically address the erasure of power exercise.

  The core idea is the erasure of agential responsibility. The community remembers the moment of loss as inevitable or heroic, detached from the choices that led there. This makes the defeat "clean" and usable for identity-building. For the Light Brigade, the blunder is part of the tragic heroism, so it still fits. Victories might undergo similar myth-making if they involve sacrifice without complicating factors.

  So, coining a term: "Agencide." Meaning the killing off of agency in memory. Defining it as the process where a community memorializes an event by stripping away the actors' choices, focusing on the loss or sacrifice as inevitable. Boundaries: events where responsibility is acknowledged (like the Temple's destruction) don't qualify. Victories can be mythologized similarly if they involve perceived inevitability or sacrifice without agency (e.g., Alamo). The Light Brigade's blunder is mythologized as tragic fate, so it fits within agencide. The Confederate example works because their policies are omitted, focusing only on the battlefield heroism.

  Need to ensure the term clearly addresses the removal of agency. Also, explain why victories can fit: if they involve a "clean" sacrifice without complicating aftermath, like Thermopylae. The key is the erasure of problematic agency, making the event a pure symbol.
answer: |-
  The established concept you seek is **mythic encapsulation**, with its boundaries defined by **agency erasure in tragic framing**.  

  **Reasoning and boundary-setting:**  
  1. **Core mechanism**: A defeat becomes inheritable as an emblem when commemoration severs the event from the losers' *meaningful choices* and *ongoing consequences*. This "agency erasure" transforms complex history into a contained tragic tableau: loss appears inevitable, actors become archetypes (heroes/victims), and moral responsibility dissipates.  

  2. **Boundary test cases**:  
     - **Light Brigade**: Fits *mythic encapsulation* because the documented blunder is reframed as tragic fate (erasing command agency), focusing on doomed valor. The unresolved argument *itself* becomes part of the mythos (senseless sacrifice), not a challenge to it.  
     - **Victories as emblems** (e.g., Thermopylae, Alamo): Also fit *when agency erasure occurs*. These are memorialized as "last stands" where defenders’ choices/context are minimized, emphasizing sacrifice against inevitability. **Defeat isn’t essential**; what matters is whether the event is distilled into a *closed loop of tragic action* divorced from historical causality.  

  3. **Exclusions**:  
     - **Dunkirk post-evacuation (Vichy France)**: Resists encapsulation because collaboration involves *ongoing moral agency*—choices with consequences that extend beyond a single tragic moment.  
     - **Temple’s destruction vs. Masada**: The Temple’s inheritance includes self-reproach (internal agency/culpability), while Masada’s suicide is framed as agentless defiance (no choice but death).  

  4. **Edges of the concept**:  
     - **IN**: Events where commemoration requires:  
       - Temporal compression (single battle/afternoon).  
       - Suppression of prior/posterior power structures (Confederate policies, Kosovo accommodations).  
       - Symbolic reduction to gestures (charge, refusal, holdout).  
     - **OUT**: Events where:  
       - Accountability is unavoidable (Vichy France).  
       - The community’s own culpability is embedded (Temple’s destruction).  
       - Continuity of consequences prevents narrative closure.  

  **Bottom-line distinction**: *Mythic encapsulation* works when the inherited memory **replaces history with aesthetics**—where the *form* of loss (heroic/tragic) overshadows its *substance* (choices, stakes, aftermath). Your cases confirm this: what is "usable" is not the defeat, but the *artefact of its retelling*.
