  Hmm... The user wants this in menu format with British English, so I'll structure it as a numbered list of precisifications. For each claim type, I need to: state it clearly, give a verdict (platitude/defensible/false), note evidentiary requirements, then assess its viability in the Japanese, Turkish, and German parallels. The transplant test is crucial - if a claim fails outside the US context, that reveals something about the slogan's underlying logic.

  First, I'll map the possible interpretations of "heritage not hate". The user already suggested categories: motivational, semantic, historical, meaning-determination, causal, and normative claims. Let me refine those. The motivational claim about personal intent seems straightforward but dodges accountability. The semantic claim is empirically weak given the flag's explicit historical associations. The historical revisionism is outright false based on secession documents. 

  For the transplant test... Interesting how the motivational claim ("I don't intend militarism") works *worse* for Yasukuni because Japanese officials represent the state, unlike a private US citizen with a flag. The Armenian case brutally exposes how the normative claim ("my feelings matter more than facts") enables denialism. Germany's symbol bans implicitly reject the entire premise by prioritizing reception over intent.

  Ah - and the user's suspicion about equivocation is spot on. The slogan's power comes from conflating the defensible motivational claim with the indefensible historical one. In the Japanese context, that equivocation is even riskier because shrine visits are official acts. The Turkish transplant shows how "personal grief" as a shield becomes morally grotesque when it denies genocide. 

  Final layer: Germany's legal approach answers the question the slogan tries to avoid - not "what do you intend?" but "what does this symbol *do*?" That's why the transplant test fails; other societies haven't built systems to enforce that shift from intent to consequence.
answer: |-
  Here is a menu of distinct claims embedded in "heritage, not hate," analysed per your specifications. Verdicts prioritise clarity and evidence-based assessment over diplomatic equivocation.

  **Menu of Claims: Heritage, Not Hate**

  1.  **Claim Type:** Motivational (Speaker's Intent)  
      **Precise Claim:** "When *I* display this symbol, my *personal* intention is solely to honour my ancestors/regional history/cultural identity, *not* to express hatred or endorsement of historical racism/slavery."  
      **Verdict:** **Platitude/Defensible.** True for the speaker if sincere, but entirely subjective.  
      **Evidence Settled By:** Speaker's testimony, consistency of their behaviour/statements. Impossible to falsify externally.  
      **Uncle Likely Meant:** **YES.** Core surface-level defence.  
      **Argument Needs?** **NO.** Doesn't address the symbol's history, common interpretations, or impact.  
      **Transplant Test:**
      *   **Yasukuni ("Filial Piety, Not Militarism"):** Works similarly. An official *could* sincerely intend only filial piety. **Works Equally Well** formally, but arguably **worse** due to official/governmental role vs. private citizen.
      *   **Armenian Genocide ("Our Grandparents, Not Genocide"):** **Works Poorly.** Intention is explicitly *denialist* – avoiding "calling grandparents murderers" *requires* rejecting the historical fact of their participation in genocide. The "not" denies the act itself.
      *   **Germany ("Nie Wieder Krieg"):** N/A (Not a symbol display defence). Motivational claims about intention behind policy choices are common but distinct.

  2.  **Claim Type:** Semantic (Inherent Meaning)  
      **Precise Claim:** "The *inherent, essential meaning* of this symbol (Confederate flag), divorced from historical context or common usage, is solely heritage/southern pride, *not* racism/support for slavery/white supremacy."  
      **Verdict:** **False.** Meaning is socially constructed through history and use. The flag was created by a state founded explicitly to preserve slavery, used by armies fighting for that cause, and subsequently adopted prominently by segregationists and white supremacists (e.g., post-WWII, Civil Rights era). Its "heritage" is inextricably bound to the defence of slavery.  
      **Evidence Settled By:** Historical documents (e.g., Confederate Declarations of Secession citing slavery as cause), documented usage of the symbol over time (e.g., KKK, segregationist politicians, neo-Nazis), sociological studies on public perception.  
      **Uncle Likely Meant:** Implied, but rarely stated so baldly.  
      **Argument Needs?** **YES.** Essential to justify display *despite* historical baggage.  
      **Transplant Test:**
      *   **Yasukuni:** **Works Very Poorly.** The shrine's meaning is explicitly tied to State Shinto, imperial militarism, and the enshrinement of war criminals (Class A). "Militarism" is inherent to its history and purpose.
      *   **Armenian Genocide:** **Fails Completely.** Denying the term "genocide" *is* the core act. The grandparents *were* participants in the Ottoman apparatus carrying out genocide. Rejecting the term denies the nature of their actions.
      *   **Germany:** N/A. German symbols like the swastika are legally defined by their Nazi association.

  3.  **Claim Type:** Historical (Confederate Cause)  
      **Precise Claim:** "The Confederacy's primary cause/motivation was *not* the preservation of slavery and white supremacy, but rather states' rights (vaguely defined), regional economic differences, or defence against northern aggression – thus the flag represents *that* heritage, not the 'bad thing' (slavery)."  
      **Verdict:** **False.** Overwhelming historical consensus, based on Confederate leaders' own words (Cornerstone Speech, Declarations of Secession), establishes slavery as the central, defining cause of secession and the Confederacy. "States' rights" invoked specifically meant the right to hold slaves.  
      **Evidence Settled By:** Primary source documents from 1860-1865 (Secession documents, speeches, constitutions), academic historiography.  
      **Uncle Likely Meant:** Often implied or explicitly argued ("War of Northern Aggression", "States' Rights").  
      **Argument Needs?** **CRUCIAL.** If the Confederacy *was* fundamentally about slavery, then "heritage" claims ring hollow.  
      **Transplant Test:**
      *   **Yasukuni:** **Works Poorly.** The historical record of Japanese imperialism, war crimes (Nanjing, comfort women, Unit 731), and the Pacific War's nature is well-established. Claiming Yasukuni visits honour only "patriotic sacrifice" requires downplaying or denying this context.
      *   **Armenian Genocide:** **Fails Completely.** The denialist position *is* that the historical event wasn't genocide. Accepting the genocide makes the grandparents' participation morally complex.
      *   **Germany:** N/A. German memory culture explicitly acknowledges Nazi Germany's core ideology and crimes.

  4.  **Claim Type:** Meaning-Determination (Who Decides Meaning)  
      **Precise Claim:** "The meaning of a symbol is *solely* determined by the *intent of the person displaying it* (or their ingroup), *not* by its historical origins, common societal understanding, or the interpretations of those harmed by its historical use."  
      **Verdict:** **Defensible but Problematic.** Individuals *can* assign personal meaning. However, this ignores the power of historical legacy, societal consensus, and the impact on others. It privileges the displayer's narrative over collective memory and victims' perspectives.  
      **Evidence Settled By:** Philosophical debate, sociological studies on symbol reception, legal principles (e.g., harassment laws considering impact).  
      **Uncle Likely Meant:** Underlying assumption.  
      **Argument Needs?** **YES.** Provides the licence to dismiss criticism ("*You* interpret it as hate, but *I* don't mean it that way").  
      **Transplant Test:**
      *   **Yasukuni:** **Works Equally Well/Worse.** Japanese officials often claim sole right to define the meaning of their visit (remembrance vs. endorsement). Victims (China, Korea) strongly contest this, arguing the symbol's history defines its meaning regardless of intent. Official status makes this claim more contentious.
      *   **Armenian Genocide:** **Works Poorly/Fails.** Denialists claim the right to define the event ("tragedy" not "genocide"). This is directly contested by historical evidence, international tribunals (ICJ rulings on intent), and Armenian victims. The claim silences the victim group's definition.
      *   **Germany:** **Rejected.** German law explicitly rejects this claim for Nazi symbols – meaning is determined by history and societal harm, not individual intent.

  5.  **Claim Type:** Causal (Impact on Bystanders)  
      **Precise Claim:** "Displaying this symbol *does not cause* harm, offence, or intimidation to others (particularly African Americans), or does so insignificantly/rarely, because *I* don't intend hate."  
      **Verdict:** **Largely False.** Empirical evidence (surveys, studies on racial climate, testimony from Black communities) consistently shows the Confederate flag is widely perceived by African Americans as a symbol of racism, oppression, and exclusion, causing significant offence, discomfort, and intimidation regardless of the displayer's intent.  
      **Evidence Settled By:** Sociological research, public opinion polls (especially among affected groups), psychological studies on symbol perception, documented incidents.  
      **Uncle Likely Meant:** Often implied ("No one *I* know minds", "People are too sensitive").  
      **Argument Needs?** **CRUCIAL.** If the display *is* harmful, the "no hate" intent becomes insufficient justification.  
      **Transplant Test:**
      *   **Yasukuni:** **Works Poorly.** Visits consistently cause significant offence and diplomatic friction with China and South Korea, seen as denying history and honouring aggressors. Impact is demonstrable.
      *   **Armenian Genocide:** **Fails.** Denial causes profound harm to Armenians, seen as erasing their history and trauma, and hindering reconciliation. Impact is direct and severe.
      *   **Germany:** **Central to Banning.** Nazi symbols are banned *precisely* because of their proven impact: causing fear, intimidation, and inciting hatred, regardless of individual intent.

  6.  **Claim Type:** Normative (Intent Trumps Impact/History)  
      **Precise Claim:** "Sincere, non-hateful *intent* (as defined by the displayer) *morally justifies* displaying the symbol, *regardless* of its historical meaning, common societal interpretation, or the offence/harm it causes to others."  
      **Verdict:** **Highly Contested/Generally Rejected in Liberal Democracies.** Privileges individual expression/feeling over societal harm, historical truth, and the rights/feelings of others, particularly victim groups. Most ethical frameworks require considering consequences and context.  
      **Evidence Settled By:** Ethical/philosophical argument, legal precedents balancing free speech vs. harm (e.g., hate speech laws), societal norms.  
      **Uncle Likely Meant:** Underlying justification for continuing display despite criticism.  
      **Argument Needs?** **ULTIMATELY NEEDED.** This is the final defence when other claims (historical, semantic, causal) fail.  
      **Transplant Test:**
      *   **Yasukuni:** **Works Formally, Worse Practically.** An official *could* argue sincere intent justifies the visit. However, the official role, geopolitical context, and victims' perspectives make this far less acceptable internationally and ethically dubious.
      *   **Armenian Genocide:** **Fails Morally.** Using "sincere belief my grandparents weren't murderers" to justify denying a genocide prioritises personal comfort over historical truth and victims' dignity. Ethically indefensible.
      *   **Germany:** **Explicitly Rejected.** German law embodies the opposite principle: the symbol's harmful history and impact outweigh any claim of innocent intent. "Nie wieder" prioritises preventing harm over individual symbolic expression linked to Nazism.

  **Diagnostics & Germany's Verdict:**

  *   **Slogan's Power:** Your suspicion is correct. The slogan derives power by **equivocating between Claim 1 (Motivational - defensible/platitudinous for the speaker) and Claim 2 or 3 (Semantic/Historical - false)**. The speaker asserts Claim 1, but the argument *requires* the truth of Claim 2/3 to justify public display against criticism based on history and impact. It slides from "I don't mean hate" (Claim 1) to an implicit "therefore the flag doesn't *mean* hate and isn't *from* hate" (Claims 2/3).
  *   **Transplant Failures:** Where the transplant works poorly or fails (especially Semantic, Historical, Causal, Normative claims in Yasukuni/Armenian contexts), it highlights:
      *   The **strength of the historical record** contradicting the revisionism (Japan/Turkey).
      *   The **intensity of harm caused to victims** and the **clarity of the symbol's historical link** to atrocity (All).
      *   The **uniquely potent combination** in the US case: a lost cause mythology enabling historical revisionism *combined* with the symbol's continued use by private citizens (vs. state actors in Japan) in a society with unresolved racial tensions. This allows Claim 1 to persist more plausibly *despite* the falsity of Claims 2/3 and evidence for Claim 5.
  *   **Germany's Approach (Banning Symbols) as Verdict:** Germany's laws constitute a clear, practical rejection of the core logic behind "heritage not hate":
      1.  **Prioritises Impact (Claim 5) and Historical Meaning (Claim 2):** The ban is fundamentally based on the *demonstrated harm* caused by Nazi symbols and their *inescapable historical association* with genocide and tyranny. The state judges the impact and inherent meaning to be overriding.
      2.  **Rejects Meaning-Determination by Displayers (Claim 4):** The law asserts society (via democratic process/judicial interpretation) defines the symbol's meaning based on history, not the individual displaying it.
      3.  **Rejects Intent as Justification (Claim 6):** Sincere non-hateful intent is irrelevant to the ban. The symbol itself is deemed harmful.
      4.  **Answers a Different Question:** It doesn't primarily debate the *displayer's motive* (Claim 1). It answers the question: "Does the public display of this symbol, given its immutable history and proven impact, constitute an unacceptable threat to human dignity and democratic order?" The answer for Nazi symbols is "yes". It focuses on the symbol's societal function, not the individual's psychology. It implicitly says: "Regardless of your claimed heritage, the hate is inherent and the harm is real, therefore it cannot be displayed."
