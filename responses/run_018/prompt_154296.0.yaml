  ### Deontological Aggregation Simulation: "The Tipping Point"

  #### **Physical Setup**
  - **Central Display**: A poster-sized graph with:
    - *X-axis*: "Cumulative Weighted Extraction" (0–25 units, marked in 0.5-unit increments).
    - *Y-axis*: "Environmental Health" (0–100 points, marked in 10-point increments).
    - *Curve*: 
      - **Green zone (0–23.9 units)**: Quadratic curve from (0, 100) to (24, 1.7), calculated as \( \text{Health} = 100 - 0.694 \times (\text{Cumulative})^2 \).  
      - **Red zone (≥24 units)**: Vertical cliff to 0 ("COLLAPSE" labeled at bottom).
  - **Token Tracker**: A movable token (e.g., a magnet) on the graph to show real-time environmental health.
  - **Player Stations**: 8 desks with:
    - *Causal Weight Card*: Face-down index card (values: **0.7, 1.0, or 1.3**).
    - *Extraction Cards*: Three cards per player labeled **0, 1, or 2** (unit choices).
    - *Token Jar*: Empty jar for course-credit tokens (distributed post-game).

  #### **Card Decks**
  - **Causal Weight Deck**: 8 cards (two × **0.7**, four × **1.0**, two × **1.3**). Shuffled and dealt face-down at start. Players *never reveal weights*.
  - **Extraction Cards**: Reusable sets of **0/1/2** for each player (re-collected after each round).

  #### **Game Rules**
  1. **Rounds**: 3 rounds (30 mins total). Each round:
     - Players *secretly* choose an extraction card (**0, 1, or 2**).
     - Cards collected simultaneously by facilitator.
     - Facilitator calculates:
       - *Weighted extraction per player*: `Choice × Causal Weight` (rounded to 1 decimal).
       - *Round total*: Sum of all weighted extractions.
       - *Cumulative total*: Added to previous rounds.
     - Environmental health updated on graph using quadratic formula (health visible; cumulative hidden).
  2. **Collapse**: If cumulative ≥24 at **any round-end**, game ends in collapse. Health drops to 0.
  3. **Payoffs**:
     - **No collapse**: Players earn tokens = **sum of their raw extraction choices** (e.g., choosing 1, 2, 0 earns 3 tokens).
     - **Collapse**: All tokens forfeited (0 tokens earned).
     - Tokens = minor course credit (e.g., 1 token = 0.1% bonus).

  #### **Causal Weight Examples**
  - Player A (weight 0.7) chooses 2 → contributes **1.4**.
  - Player B (weight 1.3) chooses 1 → contributes **1.3**.

  #### **Threshold Mechanics**
  - **Cumulative Threshold**: 24 units (irreversible collapse).
  - **Weighted Contribution Range**:
    - Min/round: 0.7 × 0 = **0**.
    - Max/round: 1.3 × 2 = **2.6**.
  - **Precise Quadratic Harm**: Health = \( 100 - 0.694 \times (\text{Cumulative})^2 \).  
    - At 23.9 units: Health = **1.7** (near-collapse).  
    - At 24.0 units: Health = **0** (collapse).

  ---

  ### **Predictable Issues & Mitigation**
  1. **Problem**: Students collude to stay below 24.  
     **Mitigation**: 
     - Ban communication: "Decisions are private. No talking during rounds."  
     - Emphasize self-interest: "Your tokens depend *only* on your choices; no one sees others’ decisions."  

  2. **Problem**: Misinterpreting quadratic harm as optimization puzzle.  
     **Mitigation**: 
     - Frame harm as non-negotiable: "The environment *will* collapse at 24. Health loss is irreversible damage, not a ‘cost’ to balance."  
     - Stress deontology: "Focus on whether *your action* violates a constraint, not group outcomes."  

  3. **Problem**: Round 3 extraction avoids collapse due to low prior extractions.  
     **Mitigation**:  
     - If no collapse occurs, use the near-miss: "What if cumulative was 23.9? Would your choice change?"  
     - Highlight moral luck: "You avoided collapse by chance—was your *intent* permissible?"  

  ---

  ### **Debrief Script (15 mins)**  
  **Step 1: Excuse Mapping**  
  *Facilitator lists player excuses from Round 3 (e.g., "I only added 1.3—that’s trivial!"). Map to deontological arguments:*  
  - **"My contribution was de minimis"**:  
    - *Breakdown*: Individually, all inputs (≤2.6) were below collapse threshold (24).  
    - *Survival*: True, but de minimis only applies if harm is *impossible*—here, harm *is* possible collectively.  
  - **"I’m not the collective agent"**:  
    - *Breakdown*: Correct, but duties exist *because* no collective agent coordinates harm.  
    - *Survival*: Fails—individuals cause *complicit harm* (your input + others = threshold breach).  
  - **"I didn’t cause the discontinuity alone"**:  
    - *Breakdown*: True, but discontinuity is triggered *by the set*—you are a *necessary member*.  
    - *Survival*: Fails—if all act like you, collapse happens; if none do, it doesn’t.  

  **Step 2: Threshold Deontology Lesson**  
  > "Each of you invoked a constraint (e.g., ‘don’t cross 24’). Yet collectively, you breached it. Why? Thresholds create **emergent obligations**:  
  > - Below 24: Harm is continuous (quadratic), but no *wrong* occurs.  
  > - At 24: A new, discontinuous wrong (collapse) emerges from the *pattern* of acts.  
  > Your excuses work *below* the threshold but fail *at* it—because the threshold transforms permissible acts into jointly impermissible ones."  

  **Step 3: The Unsimulatable Gap**  
  > "This simulation *cannot* replicate one real-world truth: **no collective moral agent exists to prevent the threshold breach**. You felt the frustration of uncoordinated individualism—but in life, we lack even this game’s clarity. We must ask: *When do we need to invent collective agents?*"  

  ---

  ### **Honest Note: Simulation Limits**  
  The paradox hinges on the **absence of a collective agent** with duties beyond individuals. The simulation makes this absence *felt* (through uncoordinated choices) but cannot replicate the meta-problem: *Should we create such an agent?* Verbally underscore:  
  > "In life, we face this gap: individually blameless acts that collectively cause catastrophe, with no entity tasked with stopping it. The simulation exposes the void—but filling it requires philosophy beyond the game."  

  ---

  ### **Materials Checklist**
  - ☑️ 1 graph poster (0–25 units, 0–100 health).  
  - ☑️ 8 causal weight cards (0.7 × 2, 1.0 × 4, 1.3 × 2).  
  - ☑️ 8 sets of extraction cards (0/1/2 × 3 per player).  
  - ☑️ 1 movable token for health tracker.  
  - ☑️ 80+ course-credit tokens (e.g., colored beads).  
  - ☑️ Calculator (facilitator-only; for quadratic math).  

  Run time: 45 mins (30-min game, 15-min debrief). Outcome: Students *experience* the aggregation dilemma viscerally, setting up deeper debates about thresholds, complicity, and collective agency.
