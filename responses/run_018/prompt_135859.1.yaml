prompt: |-
  I've been trying to get my head around anatta in the Abhidhamma sense — not the pop-psychology "there is no self" but the claim that consciousness is momentary and the five aggregates don't form a persistent owner. I'm writing something that compares this to Western personal identity debates (Parfit, Locke, etc) and I keep coming back to Fight Club. The twist that Tyler Durden is the narrator's dissociated alter ego feels like it could be read either way: either it shows there's no unified self, just shifting mental states carrying patterns like sankhara, or it secretly assumes one underlying person who is just split. Can you read the film through this specific lens?

  I'm especialy interested in the support-group scenes and the moment he realizes Tyler is him — do those dramatize a stream of momentary consciousness (citta-santati) without an owner, or do they depend on a Lockean memory-continuity that Buddhism denies? I also want to know where the film resists the reading: does the narrative need a single agent to make the twist coherent, and if so, does that mean the movie accidentally vindicates the very self-view anatta rejects? Don't reduce the film to an illustration; I want to know what the movie shows about trauma and identity that pure philosophy doesn't capture. And please don't just list scenes — explain how each one works with or against the Buddhist account, and where an honest critic has to say the reading breaks down.
reasoning: |-
