  ### **Decision Tree: Classifying Responses to Situationism in Virtue Ethics**  
  *(British English phrasing throughout)*  

  ---

  #### **Branch 1 (Root): Does the situationist finding undermine virtue ethics?**  
  *(Empirical finding: Situational variables predict behaviour better than global traits)*  
  - **A. Descriptively** (virtue ethics makes false empirical claims).  
  - **B. Normatively** (virtue ethics is normatively inadequate due to empirical facts).  
  - **C. Both** descriptively and normatively.  
  - **D. Neither** (virtue ethics withstands or adapts to the findings).  

  ---

  #### **Branch 2: Is cross-situational consistency necessary for virtue attribution?**  
  *(Case: "If someone is courageous in professional crises but freezes in personal ones, can they possess the virtue of courage?")*  
  - **Yes** → Proceed to Branch 3A.  
  - **No** → Proceed to Branch 3B.  

  ---

  #### **Branch 3A (If "necessary"): Is consistency sufficient for virtue?**  
  *(Case: "If someone consistently acts courageously across all situations, does this guarantee they have the virtue of courage?")*  
  - **Yes** → Consistency = **Necessary and Sufficient**.  
  - **No** → Consistency = **Necessary but Not Sufficient**.  

  #### **Branch 3B (If "not necessary"): Is consistency sufficient for virtue?**  
  - **Yes** → Consistency = **Sufficient but Not Necessary**.  
  - **No** → Consistency = **Irrelevant**.  

  ---

  #### **Branch 4: How is virtue conceived?**  
  *(Case: "How do you explain a person who shows courage in one context but not another?")*  
  - **A. Local/state property**: "They possess domain-specific virtues (e.g., 'professional courage'), not universal traits."  
  - **B. Global disposition with context sensitivity**: "They have a general disposition activated only in fitting contexts (e.g., when they perceive a 'call for courage')."  
  - **C. Relational property**: "Virtue resides in the person-environment fit (e.g., they are virtuous only in environments that support courage)."  

  ---

  #### **Branch 5: Do criteria for virtue vary across contexts?**  
  *(Case: "Could 'courage' mean something different in a military vs. artistic community?")*  
  - **Yes** → Criteria are **context-dependent**.  
  - **No** → Criteria are **universal**.  

