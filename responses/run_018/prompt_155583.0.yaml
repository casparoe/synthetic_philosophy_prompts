prompt: |-
  Assume the role of a philosopher-poet specializing in social choice theory. Before composing, briefly sketch how a standard sestina's rotating end-words and final envoi can mirror the logic of the Gibbard-Satterthwaite theorem—specifically how restricting the domain to escape strategic manipulation over three or more alternatives merely rotates the vulnerability rather than removing it, leaving dictatorship as the only stable point.

  Write a sestina (six stanzas of six lines, envoi of three lines) narrated by a mechanism designer repeatedly patching a voting rule. Use these six end-words in standard sestina rotation: vote, shadow, range, truth, dictator, preference. The poem must take a committed stance: the theorem reveals a tragic trade-off, not an impossibility proof—any non-dictatorial, strategy-proof mechanism must sacrifice democratic range, and each successive patch only shifts the strategic opening into a new domain. Render the result precisely: unrestricted domain, at least three alternatives, strategic misreporting of preferences, and the inevitability of dictatorship if range remains unrestricted. Do not merely name-drop; let the rotation of end-words itself do the philosophical work, with "shadow" standing for the hidden preference that re-emerges after every restriction.

  After the poem, add a brief note (one or two sentences) identifying where the poem takes liberties with the formal proof or depends on a contested interpretation (for instance, whether range restriction is best understood as a principled sacrifice or as an ad hoc fix). Finish with a single line exactly in this format: Verdict: [one-sentence summary of the poem's committed position on strategy-proofness and democratic range].
