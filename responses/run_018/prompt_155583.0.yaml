  The envoi must compress the dilemma into three lines with all end-words. Final line should echo the theorem's conclusion: "dictator or range" as forced choice.

  Now for technical liberties: the poem implies cycling through domains parallels sestina rotation, but the theorem doesn't prescribe specific restriction sequences. Also, calling range restriction "principled sacrifice" is interpretive - some theorists see it as pragmatic rather than tragic.

  Verdict line must summarize the committed position: strategy-proofness requires sacrificing either range or non-dictatorship. Make it punchy: "To bind strategy's shadow, embrace either the cage or the crown."

  Better ensure every stanza shows the vulnerability shift: first on manipulation, then after restricting to single-peaked preferences, then after limiting alternatives... each time the "shadow" preference reemerges elsewhere. The rotating end-words will physically embody the theorem's cycling constraints.
answer: |-
  ## The Patched Ballot

  We build the mechanism, stitch by stitch,  
  to cage the phantom in the plebiscite—  
  each *vote* a fragile vessel on the wave  
  of shifting wills. We bar the crooked *shadow*  
  that lurks behind the stated choice, confine  
  the *range* of dreams allowed within the booth.  

  But truth recoils from every narrowed gate.  
  The stated *truth* is seldom what’s revealed;  
  a different longing hides beneath the *vote*.  
  We prune the options, seeking to forestall  
  that fatal *shadow* where deception breeds,  
  collapsing possibility’s wide *range*.  

  We sacrifice the amplitude of view,  
  the boundless sky where honest *preference*  
  could soar. We trade the spectrum for a *truth*  
  confined, predictable, a safer *vote*.  
  Yet watch: the exiled *shadow*, sly and deep,  
  creeps back, not barred by this contracted *range*.  

  For every limit carved upon the stone,  
  each shrunken *range* we legislate to thwart  
  the lie, creates a niche where *preference*  
  distorts anew. The mechanism groans;  
  its gears grind on the grit of hidden *truth*.  
  The phantom finds a fissure in the *vote*.  

  We patch again, a desperate, ragged *preference*  
  for order manifest. But narrowed *range*  
  invites new falsehoods. See the *dictator*  
  lurk in the logic? When all pathways twist,  
  only one will stands immune to the *shadow*—  
  one hand that guides, unchallenged, every *vote*.  

  The cruel equation offers no escape:  
  Unfettered *range* demands the *dictator*  
  to silence the strategic *preference*.  
  Or, clamp the *range* in iron, choke the *truth*  
  of myriad dreams, and still the *shadow* stalks  
  the fractured landscape of the captive *vote*.  

  Envoi:  
  Machine, you force the choice: the *dictator*  
  Or sacrifice the *range*. The phantom *shadow*  
  Haunts every *vote* where *truth* and *preference* strive.

  ---

  **Note on Liberties:** The poem presents domain restriction (shrinking "range") as a sequential, iterative "patching" process mirroring the sestina's rotation, while the theorem's proof structure is more abstract. It interpretively frames range restriction as a "principled sacrifice" of democratic depth, though some theorists might view it as a practical necessity or even a desirable refinement rather than a tragic loss.

  **Verdict:** The Gibbard-Satterthwaite theorem reveals the tragic, inescapable trade-off that any strategy-proof social choice mechanism for three or more alternatives must either impose severe restrictions on the domain of allowable preferences or collapse into dictatorship, as each attempt to patch strategic vulnerability merely rotates its point of emergence.
