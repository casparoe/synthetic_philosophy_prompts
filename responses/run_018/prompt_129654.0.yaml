answer: |-
  Here’s a scenario that creates a conceptual tension beyond the autonomy-vs.-welfare frame, centered on a non-pathological value transformation:

  **The Case:**  
  *Eleanor*, a fiercely independent philosophy professor, drafts an advance directive at age 60 stipulating: "If I ever develop advanced dementia requiring permanent institutional care, I refuse all life-sustaining treatment. I would rather die than lose my autonomy and live dependent on others in a nursing home. A life without intellectual engagement and self-reliance is devoid of dignity."  

  At 75, Eleanor develops moderate Alzheimer's. Contrary to her earlier fears, she experiences no distress over her dependence. She resides in a memory care facility, where she finds profound comfort in routine, sensory pleasures (music, gardens), and nonverbal connections with caregivers. When she develops life-threatening pneumonia, her directive demands withholding antibiotics. Her *current* self, however, shows no signs of wanting to die—she smiles easily, engages with simple activities, and resists nothing. Her family reports she seems "at peace."  

  **The Conflict:**  
  Honoring the directive would deny antibiotics, causing her death from a treatable infection. Disregarding it would prolong her life in a state she once deemed "undignified." Yet crucially:  
  - **No direct opposition:** Her *current* self isn't *requesting* antibiotics (she lacks decision-making capacity), nor is she actively suffering. She exists in a state her past self abhorred but her present self accepts.  
  - **Value transformation:** Her shift isn’t mere indecision or pathology (e.g., depression distorting judgment). It’s a rational adaptation to diminished cognition—a *fundamental recalibration of dignity* from intellectual autonomy to relational contentment.  

  **The Conceptual Tension:**  
  **Which self’s conception of "dignity" should govern treatment when the patient inhabits a new, coherent value framework?**  

  ### Why Standard Frames Fail:  
  1. **Precedent Autonomy (Past Self’s Choice):**  
     - Honoring the directive enforces Eleanor’s past definition of dignity.  
     - **Problem:** It imposes an evaluative standard *incomprehensible* to her current self, who finds meaning in her new existence. Her identity persists (she recognizes family, expresses preferences), but her *axiology* (what counts as a good life) has transformed. Enforcing the directive disregards her present experience of value.  

  2. **Present Welfare/Best Interests (Current Self’s State):**  
     - Overriding the directive preserves a life the *current* Eleanor appears to value.  
     - **Problem:** It violates her deeply held past values *without her present endorsement*. She isn’t *choosing* to live; she is passively content. Upholding welfare alone ignores that she would have deemed this existence a "fate worse than death," raising a betrayal of her lifelong moral convictions.  

  ### The Unresolvable Core:  
  **The tension arises from a meta-ethical conflict between two sources of authority:**  
  - **The Authority of Past Commitments:** Eleanor’s directive reflects a solemn, rational commitment to avoid a state she viewed as intrinsically degrading. Respecting her as a "person over time" requires honoring this commitment.  
  - **The Authority of Present Value-Constitution:** Her current self *constructs dignity anew* within her cognitive limits. Forcing her to die for a principle she no longer recognizes treats her as a vessel for her past self’s values, negating her present moral agency.  

  Neither continuity of identity nor welfare resolves this:  
  - **Identity is continuous** (she is Eleanor at 60 and 75), but her *evaluative framework* is discontinuous.  
  - **Present welfare is served** by treatment, but this sacrifices the foundational value her past self believed made life *worth* living.  

  **Conclusion:**  
  This scenario exposes the **limits of "self-determination" when the self undergoes deep value transformation**. The conflict isn’t about *who decides* or *what benefits the patient now*, but **whose conception of the good life—past or present—should prevail when they are irreconcilable**. It highlights dignity as a *constructed, context-dependent value* rather than an objective state, forcing us to confront whether advance directives can bind future selves who rationally inhabit different moral worlds. Resolving this requires grappling with questions about the nature of personal integrity over time and the ethics of enforcing "dignity" as defined by a prior self against a current self’s lived reality.
