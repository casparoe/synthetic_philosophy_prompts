prompt: |-
  I've got a first-year seminar on ethical and political philosophy, 16 students, one 80-minute slot, and I want to do a session on Aristotle on money and exchange without talking at them for an hour. Design me a trading game they actually play, in a normal seminar room, that makes them run into three things in order:

  (a) that direct exchange between people with different skills and mismatched, partly hidden needs is miserable, and pushes toward some single thing everything can be measured against;
  (b) that whatever ends up doing that job works only because everyone treats it as doing it — a stand-in for need rather than something valuable by nature — and that it also has to work as a guarantee that you can get what you need later, at a time when you don't need it yet;
  (c) Aristotle's thought that acquisition aimed at nothing but more tokens is the unnatural case, and that breeding money out of money is the worst version.

  Give me rules, materials, per-round setup, and a scoring scheme in points only, no real money or prizes. I want the conventionality to land as a surprise rather than as a point I make: build in a moment where I can invalidate the currency mid-game and issue a new one, and let that do the work. Same for (c) — ideally they notice by themselves that once everyone's needs are met the game keeps rewarding more, and that lending tokens for extra tokens feels different from trading. No Aristotle and no Greek terms until afterwards.

  Then a debrief: map each phase onto the claims, say what will predictably go wrong the first time I run it and how to handle it, and be honest about which part of Aristotle the game can't stage and I'll just have to say out loud.
reasoning: |-
  We are going to design a trading game that simulates the development of money and the pitfalls of unlimited acquisition. The game will be played in rounds, with each round representing a period of economic activity.

  Materials:
  - Index cards or small slips of paper for goods and currency.
  - Pens for writing.
  - A whiteboard or flip chart to track the "economy" and scores.

  Players: 16 students.

  Setup:
  1. Each student is assigned a "role" that defines what they produce and what they need. The roles should be designed such that:
     - There are multiple types of goods (e.g., food, clothing, tools, etc.).
     - Each student produces one type of good but needs a combination of other goods to survive and thrive.
     - The needs are partly hidden: each student will know their own needs but not the needs of others (until they ask in trade).

  Example roles (for 16 players, we can have 4 types of goods, with 4 players per type, but each player needs a combination of goods from the other types):

  Let's define four goods: A (food), B (clothing), C (tools), D (shelter).

  Each player is assigned to produce one of these. But each player needs a specific combination, for example:
  - Player 1 (A-producer): needs 1B and 1C.
  - Player 2 (B-producer): needs 1A and 1D.
  - Player 3 (C-producer): needs 1A and 1B.
  - Player 4 (D-producer): needs 1C and 1D.

  But to create complexity and the need for exchange, we can have multiple players producing the same good but having different needs. We can design 4 roles with different need structures, and have 4 players per role (so 16 total). However, to avoid too much symmetry, we can have 4 roles with the following needs:

  Role 1 (A-producer): produces A, needs 1B and 1C.
  Role 2 (B-producer): produces B, needs 1A and 1D.
  Role 3 (C-producer): produces C, needs 1A and 1B.
  Role 4 (D-producer): produces D, needs 1C and 1D.

  But note: if we have 4 of each role, then there will be 4 players producing A, 4 producing B, etc. Each of the 4 players in a role has the same needs.

  However, we want partly hidden needs: so each player will get a card that says what they produce and what they need. They don't know what others need.

  We also want to simulate that direct exchange is miserable because of mismatched needs. So we need to design the needs such that it's hard to find someone who has what you want and wants what you have.

  Additionally, we want to push toward a common measure (money).

  Game Rules:

  Phase 1: Barter (3 rounds)

  Each round:
  - Each player produces 3 units of their good at the start of the round.
  - Trading period: 10 minutes. Players move around the room and try to trade. They can only trade goods for goods (no money yet). They can trade multiple goods at once (e.g., "I'll give you 1A for 1B and 1C" but that might be complex) or one good at a time.
  - After trading, each player checks if they have met their needs for the round. If they have, they get 1 point. If they have not, they get 0 points for the round.
  - Unused goods do not carry over to the next round (they perish). So players must trade to get exactly what they need each round.

  Scoring: 1 point per round for meeting needs.

  We expect that in the barter phase, trading is difficult because of the double coincidence of wants. Many will not be able to get what they need.

  Phase 2: Introduction of a common measure (money) (3 rounds)

  After Phase 1, the instructor introduces a currency. Let's call it "chits". Each player starts with 5 chits (arbitrary amount). Now, goods can be bought and sold for chits.

  Rules:
  - Each player produces 3 units of their good at the start of the round.
  - Trading period: 10 minutes. Players can trade goods for chits or chits for goods. They can also trade goods for goods, but now they can use chits to facilitate.
  - At the end of the round, players must have the goods they need to meet their needs. They cannot use chits to meet needs directly. So they must have traded to acquire the specific goods they need.
  - Meeting needs: 1 point. Plus, any chits they have at the end of the round are converted to points? Not yet. We don't want to reward hoarding at this stage. Only meeting needs gives points. But we want to set up for part (c) where acquisition of money becomes an end in itself.

  However, for the guarantee function (b), we can allow players to save chits for future rounds. But note: needs must be met every round. So if they don't meet their needs, they get 0 points regardless of chits.

  But we can say that if you have chits, you can use them to buy goods in future rounds. So they serve as a store of value.

  Phase 3: The shift to unlimited acquisition (3 rounds)

  Now we change the rules to reward accumulating chits.

  Rule change:
  - Meeting needs still gives 1 point per round.
  - Additionally, at the end of each round, each chit a player holds is worth 0.1 points. (So 10 chits = 1 extra point, which is as much as meeting needs.)

  This creates an incentive to accumulate chits beyond what is needed for meeting immediate needs.

  We also introduce lending: players can lend chits to each other, but they must agree on an interest rate (e.g., for every 10 chits lent, the borrower must return 11 chits at the end of the round). The interest is paid at the end of the round.

  But note: we don't want to complicate too much. Alternatively, we can let them negotiate any repayment.

  Phase 4: Currency crisis and reset

  After a few rounds in Phase 3, the instructor suddenly announces that the current currency (chits) is no longer valid. We issue a new currency, say "dots". Each player is given a starting amount of dots (maybe 5) and all chits are taken away.

  We then run 1-2 rounds with the new currency, with the same rules as Phase 3 (meeting needs gives 1 point, and holding dots gives 0.1 points per dot at the end of the round).

  The purpose is to show that the currency is conventional: it only works because we all agree to accept it.

  Debriefing:

  After the game, we map the phases to Aristotle's ideas:

  (a) Phase 1 (barter) shows the misery of direct exchange and why a common measure (money) emerges.

  (b) Phase 2 shows that money is a convention (accepted by all) and that it serves as a store of value (saving for future rounds). The currency crisis and reset (Phase 4) demonstrates that the value of money is conventional and not inherent.

  (c) Phase 3 shows that when we start rewarding accumulation of money tokens for their own sake (by giving points for holding chits), players start engaging in activities that are disconnected from real needs (like lending at interest to get more tokens). This is the unnatural use of money.

  What the game might not capture perfectly:
  - Aristotle's idea that money is a measure of need and that it should be a means to an end (living well) rather than an end in itself. The game reduces living well to meeting needs (which is simplified) and then adds an artificial incentive for money accumulation. In real life, the drive for unlimited accumulation arises from social structures and human psychology, which the game only simulates with a scoring rule.

  - The idea that breeding money from money (lending at interest) is the worst form of unnatural acquisition. The game can show that, but it might be that in the game lending doesn't feel as bad because it's just a game. We have to stress that for Aristotle, it is unnatural because it makes money (which is a token for future goods) produce more without being tied to actual production.

  Predictable problems and solutions:

  1. In Phase 1 (barter), students might not trade at all because it's too hard, leading to frustration. Solution: make the trading time long enough (10 minutes) and encourage them to move around. Also, after the first round, they might start to figure out what others need. That's okay because it leads to the emergence of money.

  2. In Phase 2, some players might hoard chits and not spend, leading to a shortage of currency. Solution: the instructor can act as a central bank and inject more currency if needed (e.g., by giving everyone 5 more chits at the start of a round). But we don't want to overdo it.

  3. In Phase 3, players might focus entirely on accumulating chits and forget about meeting their needs. Then they get 0 points for needs and only 0.1 per chit. That might be a lesson: if you ignore real needs for money, you suffer. But we can also adjust the points so that meeting needs is always more important (by making the point for needs higher, or the per-chit point lower). However, we want them to see that accumulating money becomes an end. So if a player has 20 chits, that's 2 points, which is more than meeting needs (1 point). So they might choose to not meet needs and just accumulate. That's the point.

  4. The currency reset: when we invalidate the old currency and issue a new one, players might be upset that their savings are gone. That's the lesson: money is conventional and can lose value arbitrarily.

  5. Lending: we might need to model it clearly. We can have a simple rule: if player X lends 10 chits to player Y at the end of round 1, then at the end of round 2, player Y must give back 10 plus 1 as interest (or whatever they agree). The loan contract is written on a piece of paper and given to the instructor to enforce. But we must be cautious about time.

  Alternatively, we can have a banking system: the instructor acts as a bank. Players can deposit chits and earn interest (e.g., 10% per round). And they can borrow from the bank at a higher interest rate (e.g., 15%). But that might be too centralized.

  Better to let players negotiate peer-to-peer loans. We'll see if they come up with interest.

  Detailed Round Setup:

  Round 1-3: Barter phase
  - Each round: each player produces 3 units of their assigned good.
  - Trading: 10 minutes. Trade goods for goods.
  - After trading, each player checks if they have the goods they need. If yes, mark 1 point. Reset goods (they don't carry over).

  Round 4-6: Money phase (with chits)
  - Start of Round 4: each player gets 5 chits. They also produce 3 goods.
  - Trading: 10 minutes. Trade goods for goods, goods for chits, chits for goods.
  - Meeting needs: 1 point if they have the required goods. Chits can be saved for future rounds.

  Round 7-9: Accumulation phase
  - Rules same as above, but now at the end of the round, each player gets 1 point for meeting needs plus 0.1 points per chit they hold (including any they had saved and any they earned that round).
  - Also, lending is allowed: players can lend chits to each other with an agreement for repayment with interest. The instructor can provide a loan contract template: "Borrower [name] agrees to return [amount] chits to lender [name] at the end of round [X]." They can set the amount to include interest.

  Round 10: Currency crisis
  - Before Round 10: the instructor announces that all chits are now worthless. A new currency, "dots", is issued. Each player gets 5 dots.
  - Round 10: same as Round 7 (accumulation phase but with dots). Trading period: 10 minutes. Then scoring: 1 point for needs, 0.1 per dot held.

  After Round 10: game ends.

  Total score: sum of all points from all rounds.

  Debriefing Questions:

  1. How did you feel during the barter phase? What difficulties did you encounter?
  2. How did the introduction of money change the trading? Did it make it easier? Why?
  3. When we started giving points for holding money, how did your behavior change? Did you notice any new activities (like lending) emerging? How did that feel?
  4. What happened when the old money became worthless and we switched to a new currency? How did that affect your trust in money?
  5. Did anyone find themselves accumulating money even after they had met their needs? Why?
  6. How did lending money for more money feel compared to trading goods for goods?

  Then connect to Aristotle:

  (a) The barter phase shows the problem of double coincidence of wants, leading to the need for a common measure (money).

  (b) Money is a social convention (as shown by the currency switch) and serves as a store of value (you can save it for future use).

  (c) When money becomes an end in itself (by giving points for holding it), we see unnatural acquisition, and lending at interest is the most unnatural because it makes money breed money.

  What we can't stage: Aristotle's deeper idea that money is a representation of human need and that the true purpose of the economy is to satisfy the needs of the household (oikos) to allow for a good life (eudaimonia). The game reduces need to a simple set of goods and points. Also, the game doesn't capture the idea that money is a measure of justice in exchange (which Aristotle discusses). We'll have to explain that in the lecture.

  This game should take about 80 minutes:

  - Introduction and role assignment: 5 minutes
  - Rounds 1-3 (3 rounds * 10 minutes trading + 2 minutes scoring each) = 36 minutes (but we can do shorter trading in later rounds if needed) -> Actually, let's do 8 minutes per trading round to save time: 3*(8+2)=30 minutes for barter phase.
  - Rounds 4-6: 3*(8+2)=30 minutes? That would be too long. We need to compress.

  We have 80 minutes total. Let's adjust:

  Total rounds: 10 rounds? But time is short.

  Alternative:

  - Phase 1: 2 rounds of barter (each 5 minutes trading + 1 minute scoring) -> 12 minutes.
  - Phase 2: 2 rounds of money without accumulation (5 minutes trading + 1 minute scoring) -> 12 minutes.
  - Phase 3: 2 rounds of accumulation (5 minutes trading + 1 minute scoring) -> 12 minutes.
  - Phase 4: 1 round of new currency (5 minutes trading + 1 minute scoring) -> 6 minutes.

  Total game time: 42 minutes. Then debrief: 30 minutes. Introduction: 5 minutes. Total 77 minutes.

  Round breakdown:

  Round 1-2: Barter. Each round: 5 minutes trade, then 1 minute to record points and reset. (Goods do not carry over, so reset means they start with 3 new goods each round.)

  Round 3-4: Money (chits). Round 3: each player starts with 5 chits. They produce 3 goods. Trade. Then score: 1 point for meeting needs. Chits carry over.

  Round 5-6: Accumulation. Same as Round 3-4, but now at the end of round 5 and 6, they get 1 point for needs and 0.1 per chit held.

  Round 7: Currency crisis. Announce chits are worthless. Issue 5 dots per player. They produce 3 goods. Trade. Then score: 1 point for needs and 0.1 per dot held.

  Total trading time: 7 rounds * 5 minutes = 35 minutes. Scoring: 7 rounds * 1 minute = 7 minutes. Total 42 minutes.

  But we might want to allow more time for the first barter round because it's new. We can adjust on the fly.

  Roles:

  We have 16 students. We'll have 4 types of producers: A, B, C, D (4 of each). Each has the same need structure for their type.

  Role A (producer of A): needs 1B and 1C.
  Role B (producer of B): needs 1A and 1D.
  Role C (producer of C): needs 1A and 1B.
  Role D (producer of D): needs 1C and 1D.

  Note: This setup creates interdependence and the double coincidence problem.

  Example: A producer of A (food) needs clothing (B) and tools (C). They can try to trade with a B-producer (who produces clothing) but the B-producer needs food (A) and shelter (D). So if the A-producer offers A for B, the B-producer might accept if they need A, but then the B-producer still needs D. And the A-producer still needs C. So they might not complete their needs in one trade.

  In the money phase, they can sell A for money and then use money to buy B and C.

  Let's run a quick simulation for one A-producer in barter:

  - They have 3A. They need 1B and 1C.
  - They might find a B-producer and trade 1A for 1B. Now they have 2A and 1B, and they still need 1C.
  - Then they look for a C-producer. The C-producer needs 1A and 1B. They have 3C. They might be willing to trade 1C for 1A. So the A-producer trades 1A for 1C. Now they have 1A, 1B, and 1C. They have met their needs (1B and 1C). They have 1A left, which perishes.

  But note: the C-producer might not be found in time, or the A-producer might run out of A to trade? They started with 3A and used 2 to get B and C. They have one left, which is lost.

  This is manageable.

  But we want the needs to be a bit hidden. So each player gets a card that says:

  "You are a producer of [X]. Each round you produce 3 units of [X]. To meet your needs, you require: [list of goods]."

  They are told not to show their card to others, but they can tell others what they need and what they have.

  Now, let's write the rules for the students.

  Rules Handout:

  Game: The Trading Game

  Goal: Each round, try to acquire the goods you need to survive (meet your needs). You get 1 point for each round you meet your needs. In later rounds, you can also earn points by holding money.

  Setup:
  - You are assigned a role: producer of A, B, C, or D.
  - Your role card tells you what you produce and what goods you require each round to meet your needs.

  Phases:

  Phase 1: Rounds 1 and 2 - Barter
  - At the start of each round, you receive 3 units of your good.
  - You have 5 minutes to trade with other players. You can only trade goods for goods (no money).
  - After trading, check if you have the required goods for your needs. If yes, you get 1 point. Any unused goods perish and do not carry over to the next round.

  Phase 2: Rounds 3 and 4 - Money (chits)
  - At the start of round 3, you are given 5 chits (paper money).
  - Each round, you receive 3 units of your good.
  - You have 5 minutes to trade. You can trade:
     - Goods for goods.
     - Goods for chits.
     - Chits for goods.
  - Chits can be saved for future rounds.
  - Meeting your needs: 1 point. Chits do not give points yet.

  Phase 3: Rounds 5 and 6 - Accumulation
  - Rules same as Phase 2, but now at the end of each round, you get:
     - 1 point for meeting your needs.
     - 0.1 points for every chit you hold (even if you didn't meet your needs).
  - Additionally, you can lend chits to other players. If you lend, you must agree on how much the borrower will pay back and when. Write down the agreement and give a copy to the instructor. The borrower must pay back at the end of the round (or next round? but we have only one round of lending in this phase). Let's say loans are for the same round: if you lend in round 5, repayment is at the end of round 5. So you can lend during the trading period and get repayment at the end.

  But that might be too short. Alternatively, we can allow loans to be repaid in the next round. For example, in round 5 you lend, and repayment at the end of round 6.

  But then we have to track. To keep it simple, we can allow only same-round loans? Or skip lending if time is tight. Alternatively, we can introduce lending in round 6 only.

  But to make it organic, we can let them negotiate loans without formal rules, and the instructor enforces agreements.

  Phase 4: Round 7 - New Currency
  - Before round 7, the instructor announces that all chits are now worthless. You turn in all your chits. You are given 5 dots (new currency).
  - Round 7: same as Phase 3. You produce 3 goods. Trade for 5 minutes. Then score: 1 point for needs, 0.1 per dot held.

  After the game, we tally points and then debrief.

  This design should fit in 80 minutes and illustrate the key points.
answer: |-
  ### Trading Game: **The Need Exchange**

  **Objective:** Students experience the evolution of money through trade, uncovering Aristotle's insights on exchange, currency, and unnatural acquisition organically. The game emphasizes frustration in barter, conventionality of money, and the pitfalls of infinite accumulation—without mentioning Aristotle until debrief.

  **Materials:**
  - **Role Cards:** 16 cards (one per student) listing their produced good and hidden needs.
  - **Good Tokens:** 64 small colored paper slips (4 colors × 16 students). Each color represents a good: **Red (Food)**, **Blue (Clothing)**, **Green (Tools)**, **Yellow (Shelter)**.
  - **Currency Tokens:** Two types: **"Circle" tokens** (Phase 2 onward) and **"Star" tokens** (Phase 4), 100+ of each, cut from cardstock.
  - **Scoreboard:** Whiteboard to track points publicly (students earn points, not real rewards).
  - **Timer:** For enforcing trading rounds.
  - **Loan Contracts:** Blank slips for interest agreements (Phase 3).

  **Student Roles (16 Players):**  
  Assign roles so that needs are mismatched and partially hidden (students know their own needs but not others'). Use 4 role types (4 students per type):  

  | **Role Type** | **Produces (3 per round)** | **Hidden Needs (Must Acquire per Round)** | **Why?** |
  |---------------|----------------------------|-------------------------------------------|----------|
  | **Farmer**    | 3 Red (Food)              | 1 Blue (Clothing) + 1 Green (Tools)      | Mismatched needs force complex trades. |
  | **Tailor**    | 3 Blue (Clothing)         | 1 Red (Food) + 1 Yellow (Shelter)        | No one produces what they need directly. |
  | **Carpenter** | 3 Green (Tools)           | 1 Blue (Clothing) + 1 Yellow (Shelter)   | Partially hidden needs create uncertainty. |
  | **Builder**   | 3 Yellow (Shelter)        | 1 Green (Tools) + 1 Red (Food)           | Interdependence necessitates exchange. |

  **Game Setup:**  
  - **Room Arrangement:** Push tables aside; students stand/move freely to trade.  
  - **Starting Goods:** Give each student 3 tokens of their produced good (e.g., all Farmers start with 3 Red).  
  - **Role Cards:** Hand out cards (students hide their needs; they can verbally share but not show cards).  
  - **Scoring:** Points = **1 per need met per round** (max 2 points/round early on). Track totals publicly.  

  ---

  ### Game Phases (Total: 45–50 minutes)  
  **Phase 1: Barter Chaos (Rounds 1–2) – *"Why is trading so hard?"***  
  *(Reveals: Direct exchange is miserable without a common measure)*  
  - **Rules:**  
    - Each round: **4 minutes** to trade *goods-for-goods only* (no currency).  
    - After trading, students check if they have their *exact needed goods*.  
    - **Scoring:** 1 point per need met (e.g., a Farmer meeting both needs gets 2 points).  
  - **Predictable Chaos:**  
    - Students will struggle to find "double coincidences of wants" (e.g., a Farmer with Red needs Blue and Green must find someone who wants Red *and* has spare Blue/Green).  
    - Needs are partly hidden—players must ask, leading to confusion.  
  - **Instructor Tips:**  
    - After Round 1, validate frustration: "Why was that hard?" (Don’t solve it; let them flounder).  
    - Keep rounds short to amplify stress.  

  **Phase 2: Currency Emerges (Rounds 3–4) – *"Finally, something that works!"***  
  *(Reveals: Money is conventional, acts as a measure/store of value)*  
  - **Rules:**  
    - Start Round 3: Issue **5 Circle tokens** to each student.  
    - Trading: **4 minutes** to trade *goods-for-goods* OR *goods-for-Circles* OR *Circles-for-goods*.  
    - **New Rule:** Circles can be saved for future rounds (store of value).  
    - **Scoring Unchanged:** 1 point per need met (Circles give no points yet).  
  - **Predictable Shift:**  
    - Trading speeds up; Circles become a common "language" (e.g., "I’ll sell my Blue for 2 Circles").  
    - Students realize Circles are useless alone but trusted for future trades (store of value).  
  - **Instructor Tips:**  
    - If liquidity dries up (e.g., everyone hoards Circles), inject 2 more Circles per player in Round 4.  

  **Phase 3: Infinite Accumulation (Rounds 5–6) – *"Why stop when needs are met?"***  
  *(Reveals: Money as an end in itself, and "breeding money from money")*  
  - **Rules:**  
    - **New Scoring:** 1 point per need met + **0.5 points per Circle held** (e.g., 2 needs met + 4 Circles = 4 points).  
    - **Lending Introduced:** Players can lend Circles to others using **loan contracts** (e.g., "Borrow 5 Circles, repay 6 after Round 6").  
    - Trading: **4 minutes** as before.  
  - **Predictable Exploits:**  
    - Players with met needs hoard Circles or lend for interest ("breeding money").  
    - Some ignore needs to chase Circles (e.g., a Farmer sells all Food for Circles but starves).  
  - **Instructor Tips:**  
    - Hand out loan slips; enforce contracts. Ask lenders: "Why lend?" to surface profit motives.  

  **Phase 4: Currency Crisis (Round 7) – *"Wait, this was arbitrary?!"***  
  *(Reveals: Conventionality of money)*  
  - **Rules:**  
    - **Shock Move:** Before Round 7, announce: "All Circle tokens are worthless!" Collect them.  
    - Issue **5 Star tokens** per player (new currency).  
    - Trading: **4 minutes** with Stars (same rules as Phase 3).  
    - **Scoring:** 1 point per need met + 0.5 points per Star held.  
  - **Predictable Reactions:**  
    - Outrage ("I saved 20 Circles!") then rapid acceptance of Stars (conventionality sinks in).  
    - Trading continues smoothly—Stars work because everyone agrees they do.  

  ---

  ### Debrief (30 minutes): Mapping Game → Aristotle  
  **Step 1: Elicit Student Observations**  
  Ask:  
  - *Phase 1:* "What made barter so hard?" → Mismatched/hidden needs, no common measure.  
  - *Phase 2:* "Why did Circles help?" → Common measure, store of value for future needs.  
  - *Phase 3:* "Why keep trading after needs were met?" → Points rewarded Circles, not just needs. "Did lending feel different?" → Breeding tokens from tokens.  
  - *Phase 4:* "How did you feel when Circles became worthless? Why did Stars work?" → Money is convention, not inherently valuable.  

  **Step 2: Connect to Aristotle**  
  - **(a) Misery of Direct Exchange:**  
    - Game: Barter chaos → needed a "single thing to measure against" (Circles).  
    - Aristotle: *Barter fails without a universal measure of value (NE V.5).*  
  - **(b) Conventionality & Store of Value:**  
    - Game: Circles/Stars worked only via trust; stored for future use.  
    - Aristotle: *Money is a social agreement (nomos) representing need; it must "stand ready" for future exchange (Pol. I.9).*  
  - **(c) Unnatural Acquisition:**  
    - Game: Hoarding/lending Circles after needs met → "pointless" accumulation.  
    - Aristotle: *Money as an end (not means) is unnatural; lending for interest (tokos) is "most hated" (Pol. I.10).*  

  **What the Game Can’t Stage (Say This Aloud):**  
  - Aristotle ties "natural" exchange to household needs (oikos). The game simplifies "need" to tokens—real ethics requires discussing how money serves human flourishing (eudaimonia).  
  - The game doesn’t capture money’s role in justice (e.g., fair pricing). We’ll discuss that next class.  

  **Predictable Problems & Fixes:**  
  1. **Phase 1 Stagnation:** Players freeze, overwhelmed.  
     - *Fix:* After Round 1, ask: "Who didn’t trade? Why?" to spark interaction.  
  2. **Currency Hoarding in Phase 2:** Trading halts if everyone saves.  
     - *Fix:* Inject extra Circles mid-round ("The bank prints more!").  
  3. **Phase 3 Exploitation:** Aggressive lenders "bankrupt" borrowers.  
     - *Fix:* Allow debt forgiveness to keep players engaged; note how this mirrors real power dynamics.  
  4. **Time Shortage:** If rounds drag, shorten trading to 3 minutes.  
     - *Fix:* Use a loud timer. Prioritize debrief—game is a means, not an end.  

  **Why This Works:**  
  - **Conventionality Surprise:** Invalidating Circles forces the "aha!" moment.  
  - **Unnatural Acquisition Emerges:** Points for Circles make accumulation feel "rational," revealing Aristotle’s critique.  
  - **No Lectures:** Students articulate Aristotle’s points via lived frustration.  

  **Total Time:** Setup (5 min) + Game (45 min) + Debrief (30 min) = 80 minutes.
