answer: |-
  Here is the exam prompt, a model answer, and a detailed marking scheme designed to meet your specifications.

  ---

  **Exam Question: Adam Smith’s Sympathy and Moral Judgment**  
  *Read carefully and respond to all parts.*  
  **Case:** A merchant learns that a distant stranger faces imminent ruin (e.g., bankruptcy and homelessness) due to a natural disaster. The merchant has sufficient funds to rescue the stranger but refuses, believing it is his duty to preserve his capital to secure his children’s future education and social standing.  

  Using Adam Smith’s theory of sympathy and the impartial spectator, address the following:  
  1. Would the impartial spectator approve of the merchant’s refusal? Explain why or why not, focusing on Smith’s criteria for moral approval.  
  2. Our natural sympathy for the suffering stranger creates distress. Does this conflict with the spectator’s judgment? What does this reveal about Smith’s distinction between *sympathy* (fellow-feeling) and *moral approval*?  
  3. How does Smith’s spectator avoid being either (a) a mere internalization of social conventions or (b) a Kantian universal lawgiver? Specifically, how does this framework justify the merchant’s partiality toward his children *without* collapsing into egoism or conventional morality?  

  ---

  **Model Answer (Approx. 600 words):**  

  Adam Smith’s impartial spectator would **approve** of the merchant’s refusal to aid the distant stranger, but *only if* the merchant’s motives demonstrate **propriety**—that is, a proportionate alignment between his sentiments/actions and their cause. Smith’s moral approval hinges not on outcomes (e.g., the stranger’s suffering) but on whether the agent’s emotions and intentions are “suitable” to their context (*The Theory of Moral Sentiments*, TMS). Here, the merchant prioritizes his children’s welfare over a stranger’s. For Smith, limited partiality toward close relations is morally permissible *if* it reflects a reasonable assessment of obligations. The spectator would ask: Is the merchant’s anxiety for his children’s future, and his consequent restraint, *commensurate* with the situation? If so, the refusal is proper, even if unfortunate.  

  Our direct sympathy for the stranger’s plight *does* conflict with the spectator’s approval, but this tension is central to Smith’s model. **Sympathy** is the innate capacity to share others’ feelings (e.g., distress for the stranger). **Moral approval**, however, arises from a “double sympathy”: we first sympathize with the *agent’s* motives (the merchant’s parental concern), then judge whether a spectator would endorse those motives. If the spectator finds the merchant’s priorities appropriate (e.g., parental duty outweighs distant beneficence), we approve *despite* our initial sympathy for the victim. This reveals Smith’s key insight: sympathy is necessary but *insufficient* for moral judgment. Approval requires a detached evaluation of the *fitness* of sentiments, not merely shared feeling. The merchant’s action is condemned only if his motives are excessive (e.g., hoarding wealth out of greed) or deficient (e.g., neglecting family for minimal stranger gain).  

  Smith’s spectator avoids being a social mirror or Kantian lawgiver through its **cultivated impartiality**. Unlike convention, the spectator is a normative tool for *correcting* biased sentiments. Society may condemn the merchant for coldness or praise him for prudence, but the true spectator asks: Would a wholly impartial, well-informed observer—stripped of personal ties—accept the *propriety* of the agent’s motives? This spectator is neither passive (Humean “general praise”) nor categorical (Kant’s universalizable maxims). It evaluates context: the merchant’s special obligations to his children are justifiable *because* a spectator recognizes that humans naturally prioritize proximate ties—provided this partiality stays within bounds of reason. For instance, the spectator would condemn the merchant if he refused to save a *drowning child* before him to protect his capital. Thus, partiality is licit only when motives are proportionate, avoiding both egoism (which ignores others’ claims) and conventionalism (which defers to local norms). The merchant’s duty to family is grounded in human nature’s “limited benevolence,” which the spectator rationally endorses as fitting—not as a universal law, but as a contextually proper sentiment.  

  Smith’s framework thus distinguishes him from utilitarians. We approve the merchant not because his refusal “produces happiness” (his children’s gain outweighs the stranger’s loss), but because his *sentiments* are proper to his role and relationships. The spectator’s judgment transcends both immediate feelings and social norms by demanding an impartial assessment of emotional fitness—a standard rooted in human psychology but refined by reason.  

  ---

  **Marking Scheme:**  
  **A-Grade Answer (85–100%) MUST Demonstrate:**  
  1. **Clear Rejection of Utilitarianism**: Explicitly states approval depends on *propriety* (fitness of motives/causes), not outcome-maximization.  
  2. **Double-Sympathy Structure**: Explains that moral approval requires (a) sympathy with the *agent’s* motives AND (b) spectator endorsement of their propriety, distinct from direct sympathy for the victim.  
  3. **Spectator as Normative Corrector**: Shows the spectator *judges* and *corrects* immediate sentiments/social norms via impartiality (e.g., “What would a detached, informed observer deem fitting?”).  
  4. **Bounded Partiality**: Justifies family prioritization *only* when motives show proportionate concern (e.g., children’s education vs. stranger’s crisis), contrasting this with egoism (self-interest absent duty) or conventionalism (blind adherence to norms).  
  5. **Distinction Sympathy ≠ Approval**: Uses the stranger-merchant conflict to show sympathy is raw material for judgment, not approval itself.  

  **B-Grade Answer (70–84%) MAY:**  
  - Correctly identify the spectator’s approval but with weaker emphasis on propriety vs. outcomes.  
  - Describe sympathy and approval but blur the “double sympathy” mechanism.  
  - Mention impartiality but not its role in *correcting* sentiment/norms.  
  - Note partiality is allowed but not clarify its bounds (e.g., misses that propriety checks excess/deficit).  

  **Common Mistakes (Mark Deductions):**  
  - **−15%**: Treating sympathy for the victim as sufficient for moral disapproval (ignoring double sympathy).  
  - **−15%**: Conflating Smith with Hume (e.g., spectator = aggregate utility/general praise) or Kant (spectator = universal law test).  
  - **−10%**: Reducing the spectator to social internalization (e.g., “spectator just reflects society’s view”).  
  - **−10%**: Misreading partiality as egoism (e.g., “Smith excuses selfishness”) or relativism (e.g., “duty depends on culture”).  
  - **−5%**: Overemphasizing outcomes (e.g., “children’s happiness justifies refusal” without propriety analysis).  

  **Note**: Quotes/page numbers are *not* required. Arguments must engage Smith’s core concepts (propriety, spectator, sympathy-as-process) using the case.  

  ---  
  This design forces students to grapple with Smith’s unique mechanism of judgment, exposes utilitarianism’s incompatibility via the propriety criterion, and tests their ability to apply theory to nuanced partiality—all while avoiding summary recitation. The model answer and rubric target the argument you outlined with your friend. Good luck with the exam!
