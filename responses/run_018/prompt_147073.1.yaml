answer: |-
  Here’s your cheat sheet for art theory desiderata — the non-negotiable boxes a solid theory needs to tick, the landmines to avoid, and how the big players stack up. Keep it loose, but rigorous:

  ### **The Must-Handle Cases (The Usual Suspects & Curveballs)**
  1. **Forged Art**: Why’s a perfect fake *not* art (or is it?), while the original is.  
  2. **Readymades**: A urinal (Fountain) is art. Your identical bathroom urinal isn’t. Explain.  
  3. **AI-Generated Images**: If it looks like art, is it art? Who’s the artist? The prompter? The algorithm?  
  4. **"Negative Labor" Works**: Art defined by *rejecting* craft (e.g., Duchamp, minimalism, conceptual art), BUT that secretly relies on *invisible labor* (curators, critics, galleries) to frame it as art. The theory can’t ignore this hidden scaffolding while celebrating the "effortless" gesture.  
  5. **Outsider Art**: Made outside the "art world," no institutional intent — but still hits as art.  
  6. **Bad Art**: Not all art is *good*. A theory must handle cringey amateur paintings *as art*.  
  7. **Ritual/Functional Objects**: A Congolese nail fetish statue: sacred object first, art later. How?  

  ### **Distinctions You Can’t Blur (Keep These Separate)**  
  - **Art vs. Artifact**: Not all human-made things are art (e.g., a shovel).  
  - **Art vs. Aesthetic Object**: Sunsets are beautiful but not *art*.  
  - **Artist’s Intent vs. Viewer’s Experience**: Does meaning live in the maker’s head or the audience’s reaction?  
  - **Craft Skill vs. Artistic Status**: Skill isn’t necessary (see readymades), but sometimes it matters (Renaissance frescoes). Don’t collapse them.  
  - **"High" Art vs. Pop Culture**: Brillo Boxes vs. actual Brillo boxes. A theory shouldn’t privilege one as "truer" art.  

  ### **Constraints (Don’t Fight Reality)**  
  - **Psychological Basics**: Humans *do* experience things aesthetically (emotion, interpretation). Don’t deny it.  
  - **Art History**: Your theory can’t exclude Duchamp, Rembrandt, or Aboriginal dot painting because they break your rules.  
  - **Social Dimension**: Art isn’t made or received in a vacuum. Institutions, markets, and power matter.  
  - **Temporal Flexibility**: What’s "art" changes over time (e.g., photography wasn’t art, now it is).  

  ### **Conflict Alerts! (Tensions in the Theory-Verse)**  
  ⚠️ **Intentionality vs. Institutional Framing**:  
  - If art requires artist intent (intentionalism), how do outsider art or found objects work?  
  - If institutions alone decide (institutionalism), does that make art arbitrary? Who decides *who* the institution is?  
  - **The "Negative Labor" Paradox**: Celebrating anti-craft art *requires* the hidden labor of institutions to validate it. Can a theory acknowledge this without undermining the artwork’s intended meaning?  

  ### **Quick Theory Showdown**  
  1. **Institutionalism (e.g., Dickie, Danto)**:  
     - 👍 Nails readymades, forgery distinction, historical flexibility.  
     - 👎 Flirts with circularity ("art is what the artworld says it is"). Dismisses intent. Ignores psychology. **Fumbles "negative labor"** by *relying* on the hidden labor it ignores. Outsider art? Maybe not art. AI art? Only if the institution blesses it.  

  2. **Functionalism (e.g., aesthetic experience theories)**:  
     - 👍 Respects psychology, explains why sunsets aren’t art. Handles "bad art."  
     👎 **Fails spectacularly on readymades** (is Fountain *really* about aesthetic experience?). Struggles with conceptual art (where idea > experience). Who decides the function? AI art might qualify, forgery might too.  

  3. **Hybrid Contextual-Intentional (e.g., Levinson)**:  
     - 👍 Art = object + *intended* regard (e.g., "for viewing-as-art") within a historical context. Handles forgery (wrong intent), readymades (Duchamp’s intent!), flexibility.  
     - 👎 **"Negative Labor" problem persists**: Intent might frame the work, but the hidden institutional labor enabling that intent is still erased. AI art? Fuzzy (whose intent?). Outsider art? Tricky if no "art-regarding" intent.  

  ### **The Takeaway**  
  No theory aces everything. **Institutionalism** handles puzzles but feels bloodless. **Functionalism** feels human but fails modern art. **Hybrid views** come closest but still wrestle with intent vs. context — and **no theory cleanly solves the "negative labor" hypocrisy** without exposing art’s dependency on invisible work. Your theory’s job? Navigate the mess without ignoring it. Keep it real.
