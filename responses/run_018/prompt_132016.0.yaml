  Hmm, the user's framing suggests they're likely a practitioner—maybe in policy, AI ethics, or institutional design—who needs actionable philosophical clarity. Their frustration with "academic field mapping" implies they want tools for real-world reasoning. The distributed-prediction variant they invented reveals creative engagement; this isn't someone regurgitating literature.

