prompt: |-
  I am a retired analytical chemist who has lately been reading philosophy with more enthusiasm than training, and I find myself needing a practical tool built out of David Lewis's account of convention. Here is my situation. I chair the bylaws committee of a two-hundred-member amateur astronomy society founded in the 1970s. Every few years we revise the bylaws, and this time the membership has asked us to go through the society's many unwritten practices and recommend, for each one, whether to write it into the bylaws, leave it alone, or actively discourage it. The committee has five members, none with any philosophy; we have two two-hour meetings before we must report; we cannot survey the membership before the vote; and bylaw changes require a two-thirds majority at the annual meeting, so a mistake, once codified, is hard to undo.

  I have read Lewis's book on convention, but it is written for philosophers, and I need it turned into a working procedure. What I want from you is a numbered sequence of tests the committee can apply to any candidate practice, where each test says what observable evidence would count as passing or failing it given that we cannot poll two hundred people, what classification a failure at that point yields, and what the default recommendation is for each classification (codify, leave alone, discourage), with the exceptions to each default stated. Two things from the book must survive the translation intact, because I think my committee will be tempted to drop them: first, Lewis's insistence that a convention does not require any explicit agreement, which is precisely backwards from how my colleagues will use the word in a bylaws context; second, the condition that there be a genuine alternative regularity that could equally well have stabilized. Wherever a test cannot be made mechanical and a committee member simply has to exercise judgment, mark it plainly as such rather than letting the procedure pretend otherwise.

  Please then run the procedure on these three real cases from our society, showing the work at each step:

  1. At our dark-sky site, members set up telescopes in east-west rows on a first-come basis, with the earliest arrival anchoring the row nearest the gravel lot. Nobody designed this; it congealed in the 1990s. North-south rows would serve equally well. Everyone follows it, expects others to follow it, and seems genuinely content.

  2. Only dim red lights are permitted once observing begins. A newcomer who switches on a white flashlight is corrected within seconds, and repeat offenders are talked about. Here, though, there is a real physiological reason behind the practice, which the first case lacks, and I am unsure what the procedure should do with that — or with the fact that some details of the practice (exactly how red, whether headlamps count) do seem arbitrary.

  3. Senior members get first pick of the society's loaner telescopes, a practice about twenty years old. Newer members grumble about it privately but comply, and I suspect, though I cannot prove, that a majority would actually prefer a lottery while nobody wants to be the one to say so. I should disclose that I have been a member for thirty-five years and benefit from this arrangement, and I would rather the procedure tell me something I dislike than that it be bent.

  Finally, tell me what the procedure cannot settle. I gather that Lewis's account is a description of what conventions are, not advice about whether a given one deserves the force of a written rule, and I would like the limits of the whole exercise stated honestly before I present it to the committee as more than it is.

  Please write the answer in American English.
reasoning: |-
  Okay, let me approach this systematically. The user is a retired analytical chemist chairing an astronomy society's bylaws committee - that background explains both the methodological rigor they're seeking and the practical constraints they're under. 

  First, I need to distill Lewis's convention theory into actionable tests while preserving two key nuances: the absence of explicit agreement and the requirement of viable alternatives. The committee's constraints are clear: no member surveys possible, five non-philosophers, limited meeting time, and high stakes for codification errors. 

  For the test design, I'm considering building it around observable evidence since polling isn't possible. Each test should have:
  - Clear pass/fail thresholds based on observable behaviors
  - Classification outcomes
  - Default recommendations with explicit exceptions
  - Marked judgment points where subjectivity is unavoidable

  The three real cases present excellent validation scenarios. The telescope rows case seems textbook Lewis - arbitrary but functional coordination. The red lights case introduces complications with its physiological basis. The loaner telescope hierarchy reveals potential preference falsification - exactly where Lewis's model might struggle.

  Notably, the user acknowledges personal bias in the third case and requests impartial treatment - this signals intellectual honesty that I should mirror in the procedure's design. The procedure must explicitly state its limitations: it categorizes practices but doesn't evaluate their moral worth or long-term consequences.

  For implementation, I'm structuring the tests sequentially with exit points. Where observation can't resolve ambiguity (like gauging common knowledge), I'll flag required judgment calls. The classifications will differentiate between conventions, norms, and mere patterns - this matters because codifying non-conventions often backfires.

  The red light case particularly interests me - how to handle "grounded conventions" where arbitrariness exists only at the margins. I'll need to separate the core practice (red lighting) from its implementation details (exact wavelength). The loaner telescope case will test the procedure's ability to detect unstable equilibria where people comply but resent.

  Finally, I'm drafting honest limitations: the procedure can't assess justice, predict change, or resolve conflicts between convention types. It's a taxonomy tool, not a value judge - something the committee must understand before deployment.
answer: |-
  Here is a procedural adaptation of Lewis's account of convention, designed for your committee's practical constraints and preserving his key insights. The procedure consists of 6 sequential tests. If a practice fails any test, it is classified accordingly, and no further tests are needed. Judgment points are explicitly marked.

  **Lewis-Based Procedure for Bylaws Recommendation**

  1.  **Test: Regularity in Behavior?**
      *   **Question:** Is the practice consistently followed by a significant portion of the group in the relevant situations?
      *   **Evidence:** Direct observation by committee members (at meetings, star parties), anecdotal reports from multiple credible members, meeting minutes referencing the practice, lack of documented/observed violations. *Not* surveying the whole membership required.
      *   **Pass:** Observed/reported consistency over time.
      *   **Fail:** Inconsistent, rare, or non-existent practice.
      *   **Classification if Fail:** Mere Pattern or Absent Practice.
      *   **Default Recommendation:** Leave Alone (unless actively harmful, then Discourage). *Exception:* If evidence shows the *absence* of the practice causes confusion/harm, consider Codifying a *new* rule to establish order.

  2.  **Test: Arbitrariness & Viable Alternative? (Lewis's Key Insight #2)**
      *   **Question:** Could another reasonably different regularity have served the same general purpose just as well? Is the specific form of the practice non-unique in solving the coordination problem?
      *   **Evidence:** Committee discussion identifying potential alternatives. Consider logical alternatives, historical precedents in other groups, or past variations within your group. *Requires Judgment:* Committee must assess if alternatives are genuinely viable and roughly equivalent in solving the core coordination need.
      *   **Pass:** At least one viable, roughly equivalent alternative exists.
      *   **Fail:** The practice is the *only* effective way to achieve the goal due to inherent constraints (e.g., physics, law, fundamental efficiency). OR the "practice" is so vague it doesn't constitute a specific regularity.
      *   **Classification if Fail:** Functional Necessity / Indeterminate Pattern.
      *   **Default Recommendation:** *For Functional Necessity:* Codify if clarity/emphasis needed; otherwise Leave Alone. *For Indeterminate Pattern:* Leave Alone (encourage clarification if problematic).

  3.  **Test: Mutual Expectations?**
      *   **Question:** Do members generally expect others to follow the practice in the relevant situations? Do they expect others to expect *them* to follow it?
      *   **Evidence:** Observable reactions to violations (correction, surprise, disapproval). Expressions of reliance on others doing it ("I knew Bob would set up the east row"). Statements assuming conformity ("As usual, we'll..."). *Requires Judgment:* Gauging the *strength* and *commonality* of these expectations from limited observation/anecdotes.
      *   **Pass:** Evidence of widespread mutual expectations of conformity.
      *   **Fail:** No evidence of expectations; violations go unnoticed/unremarked; members express uncertainty about what others will do.
      *   **Classification if Fail:** Casual Habit / Personal Preference.
      *   **Default Recommendation:** Leave Alone.

  4.  **Test: Preference for General Conformity (Conditional & Unconditional)?**
      *   **Sub-Test 4a: Conditional Preference:** Does an individual member prefer to conform *if* (nearly) everyone else does?
      *   **Sub-Test 4b: Unconditional Preference:** Does an individual member have a general preference that *everyone* conforms to *some* regularity solving the coordination problem (even if they slightly prefer an alternative)?
      *   **Evidence:** *Requires Significant Judgment:* No polling possible. Infer from: Lack of widespread grumbling *when practice is followed*; expressions of satisfaction with the outcome ("things run smoothly"); quick correction of violations (implies desire to restore conformity); absence of persistent, organized attempts to change it; pragmatic acceptance ("it works, so we do it"). Focus on behavior revealing preferences *for conformity itself* over chaos or constant re-negotiation.
      *   **Pass:** Evidence suggests widespread conditional *and* unconditional preferences exist.
      *   **Fail:** Evidence suggests significant dissent even when others conform, or a lack of value placed on having *a* shared rule.
      *   **Classification if Fail:** Contested Practice / Lack of Coordination Need.
      *   **Default Recommendation:** *For Contested Practice:* Leave Alone (encourage discussion/vote later). *For Lack of Coordination Need:* Discourage if pointless/harmful; otherwise Leave Alone.

  5.  **Test: Common Knowledge? (Lewis's Key Insight #1)**
      *   **Question:** Is the fact that conditions 1-4 hold sufficiently known within the group? (i.e., members know the practice exists, know others follow it, know others expect conformity, know others generally prefer conformity, and know that others know this too, etc., to a sufficient degree).
      *   **Evidence:** *Requires Judgment.* The practice is openly discussed as "how we do things." New members are explicitly taught it. Violations are corrected with reference to the group norm ("*We* always..."). It's referenced in group communications. Assumed background knowledge in planning.
      *   **Pass:** Evidence suggests the regularity and expectations are sufficiently public and understood within the group.
      *   **Fail:** Practice is obscure, known only to a subset, or expectations are not widely recognized.
      *   **Classification if Fail:** Subgroup Norm / Obscure Practice.
      *   **Default Recommendation:** Leave Alone (unless causing conflict between subgroups, then Discourage or Codify *after* broader discussion).

  6.  **Classification if Passes All Tests 1-5:** **Convention**
      *   **Default Recommendation:** **Leave Alone.**
      *   *Exceptions (Consider Codifying):*
          *   The convention is frequently violated causing significant problems, indicating it's weakening.
          *   It's crucial for safety, legal compliance, or fundamental fairness, and codification adds necessary weight/clarity.
          *   New member onboarding is failing, and written rules would significantly aid understanding.
          *   The convention is subtle/complex and easily misunderstood.
      *   *Exceptions (Consider Discouraging):*
          *   The convention actively excludes or disadvantages a significant portion of the membership unfairly.
          *   It solves a coordination problem that no longer exists or creates new problems.
          *   It conflicts with a more important codified rule or principle the society wants to uphold.

  **Applying the Procedure to Your Cases:**

  **Case 1: Telescope Rows (East-West, First-Come)**
  1.  **Regularity?** PASS (Consistently followed, "congealed").
  2.  **Arbitrariness/Alternative?** PASS (North-South rows explicitly stated as equally viable).
  3.  **Mutual Expectations?** PASS (Everyone follows, expects others to, newcomers observe).
  4.  **Preference for Conformity?** PASS (Members "genuinely content", compliance is high, corrections likely occur implicitly by following the pattern).
  5.  **Common Knowledge?** PASS (Understood as "how we set up", known to newcomers by observation).
  6.  **Classification:** **Convention**
      *   **Recommendation:** **Leave Alone** (Default). It works, people are happy, no problems cited. Codification risks rigidity (e.g., odd-shaped lots). No strong exception applies.

  **Case 2: Red Lights Only**
  1.  **Regularity?** PASS (Near universal compliance, rapid correction).
  2.  **Arbitrariness/Alternative?** *Judgment Required.* **PASS** (BUT qualified). Core practice (avoiding white light) is *Functional Necessity* (physiology). *However*, the *specific implementation details* (exact shade of red, headlamp policy) *are* arbitrary and have viable alternatives. The convention exists *within the scope* of the necessity. The group coordinates on *a specific version* of red-light use.
  3.  **Mutual Expectations?** PASS (Strong expectations, immediate correction).
  4.  **Preference for Conformity?** PASS (Strong preference to avoid white light for observing, clear value in having *a* shared red-light rule).
  5.  **Common Knowledge?** PASS (Explicitly taught, enforced, fundamental rule).
  6.  **Classification:** **Convention** (specifically, a convention *implementing* a functional necessity).
      *   **Recommendation:** **Codify the Core Principle** (Exception to Default). The *necessity* (only non-white light) warrants codification for clarity, safety (night vision = safety), and new member onboarding. *Leave Alone* the specific arbitrary details (exact red specs) unless they cause problems; codifying them risks unnecessary rigidity. State the core rule: "Only lights with a red filter or red LED, preserving night vision, are permitted during organized observing sessions."

  **Case 3: Senior Members First Pick of Loaners**
  1.  **Regularity?** PASS (Followed for ~20 years, newer members comply).
  2.  **Arbitrariness/Alternative?** PASS (Lottery, reverse seniority, need-based are all viable alternatives identified).
  3.  **Mutual Expectations?** PASS (Newer members comply, implying they know it's expected; senior members likely expect their priority).
  4.  **Preference for Conformity?** *Judgment Required.* **FAIL** (Conditional Preference likely fails). Newer members grumble *privately* and comply seemingly *only* because others do (fear of conflict, not desire for coordination). Their conformity is reluctant, not preferred. The unconditional preference ("*some* rule is better than chaos") might hold weakly, but the *conditional* preference ("I prefer to let seniors go first *if* others do") seems absent for a significant group. The preference for *this specific rule* is not general. *Evidence:* Private grumbling, your suspicion of latent majority preference for lottery.
  5.  **Classification:** **Contested Practice** (Failed Test 4).
      *   **Recommendation:** **Leave Alone** (Default for Contested Practice). Codifying this resentment-fueled practice risks institutionalizing unfairness and causing long-term harm. Discouraging it without consensus is divisive. Recommend the committee *explicitly note the contention* and propose the membership discuss/vote on alternatives (e.g., lottery vs. seniority) at the annual meeting *outside* the bylaws process. The procedure flags it as unstable/unjust, not fit for codification *as is*.

  **What the Procedure Cannot Settle:**

  1.  **Moral/Ethical Value:** Lewis describes *what is*, not *what ought to be*. The procedure identifies conventions, not whether they are just, fair, or good. A convention can be deeply unfair (like Case 3 potentially). The committee must apply separate ethical judgment.
  2.  **Long-Term Consequences:** It assesses current stability, not future viability. A convention passing all tests now might erode due to changing membership or technology.
  3.  **Optimal Solution:** It identifies coordination equilibria, not necessarily the *best possible* one. There might be a better alternative nobody has tried.
  4.  **Intensity of Preferences:** It gauges *existence* of preferences for conformity, not their *strength*. A barely stable convention might be riskier to codify than a deeply entrenched one.
  5.  **Resolving Conflicts Between Conventions/Norms:** If practices conflict (e.g., a convention vs. a functional necessity), the procedure identifies each but doesn't prioritize them.
  6.  **Predicting Adoption of Codification:** Passing the tests doesn't guarantee a bylaw codifying the convention will pass or be followed. Codification changes the game.
  7.  **True "Majority" Preference (Hidden or Latent):** As in Case 3, the procedure relies on observable behavior and limited inference. It cannot reveal privately held, suppressed majorities favoring a different rule.
  8.  **Defining "Viable Alternative":** This remains a crucial judgment call. What seems "roughly equivalent" to the committee might not be to the membership.

  **Presenting to Committee:** Frame this as a *diagnostic tool* based on how group norms *actually function*, not a value judgment. Emphasize it helps distinguish ingrained, functional coordination patterns (often best left alone) from necessities (often good to codify), contested practices (need broader discussion), or pointless habits (can be discouraged). Stress its limits, especially regarding fairness and latent preferences. Its strength is preventing unnecessary codification of smoothly functioning conventions or the harmful codification of unstable/resentful practices. Use the case examples to demonstrate how it works and its limitations. Good luck!
