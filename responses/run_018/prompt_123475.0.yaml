answer: |-
  ### Exam Question
  **Rational Choice and Dynamic Inconsistency: The Absent-Minded Driver with Commitment**  
  A driver faces two consecutive exits on a highway:  
  - **Exit A** leads to a detour with payoff **1**.  
  - **Exit B** leads home with payoff **4**.  
  - Missing both exits yields payoff **0**.  

  The driver is *absent-minded*: upon reaching any intersection, he cannot tell whether it is Exit A or Exit B, nor recall if he has passed an exit. Thus, his strategy must be identical at both nodes: either **EXIT** at both or **CONTINUE** at both.  

  **Modification**: Before departing, the driver may purchase a hidden commitment device for cost **0.5**. If purchased:  
  - The device randomly enforces **CONTINUE** at *exactly one* of the two intersections (each with 50% probability).  
  - At the other intersection, the driver uses his pre-chosen strategy (EXIT or CONTINUE).  
  If he declines the device, he applies a uniform strategy (EXIT/CONTINUE) at both nodes.  

  **Tasks**:  
  1. **Ex Ante Analysis**: Compute the expected utility of all strategies *with* and *without* the device.  
  2. **Ex Post Reasoning**: Derive the optimal action at a single intersection *given beliefs* about location.  
  3. **Dynamic Tension**: Explain why the ex post optimal action conflicts with the ex ante optimal plan.  
  4. **Coherence Challenge**: Does this conflict undermine dynamic consistency? Can commitment or plan-dependence resolve it?  

  ---

  ### Model Answer (≈700 words)  
  #### (i) Ex Ante Expected Utilities  
  **Without Device**: Two pure strategies:  
  - **Always EXIT**: Payoff = \( \frac{2}{3} \times 1 + \frac{1}{3} \times 0 = \frac{2}{3} \).  
    *(Probability \(\frac{2}{3}\) at A, \(\frac{1}{3}\) at B; exits at both.)*  
  - **Always CONTINUE**: Payoff = \( \frac{2}{3} \times 0 + \frac{1}{3} \times 4 = \frac{4}{3} \).  
    *(Continues at both, misses A and B with prob \(\frac{2}{3}\), reaches B with prob \(\frac{1}{3}\).)*  
  Optimal without device: **Always CONTINUE** (\(\frac{4}{3} > \frac{2}{3}\)).  

  **With Device (cost = 0.5)**:  
  - **Strategy: EXIT when allowed** (device may enforce CONTINUE once). Payoffs:  
    - Device enforces CONTINUE at A (prob 0.5): Driver EXITS at B → Payoff = 4.  
    - Device enforces CONTINUE at B (prob 0.5): Driver EXITS at A → Payoff = 1.  
    Expected gross payoff = \( (0.5 \times 4) + (0.5 \times 1) = 2.5 \). Net payoff = \( 2.5 - 0.5 = 2 \).  
  - **Strategy: CONTINUE when allowed** (device enforces CONTINUE once; driver CONTINUES otherwise):  
    Payoff = 0 (always miss both). Net = \( 0 - 0.5 = -0.5 \).  
  Optimal with device: **EXIT when allowed** (net payoff 2).  

  **Comparison**:  
  - No device: Best payoff = \(\frac{4}{3} \approx 1.333\).  
  - With device: Best net payoff = \(2\).  
  **Verdict**: Purchase device and commit to **EXIT when allowed**.  

  #### (ii) Ex Post Belief-Dependent Reasoning  
  At any intersection, the driver assigns a posterior probability \(p\) of being at Exit B (home). Given prior probabilities (A: \(\frac{2}{3}\), B: \(\frac{1}{3}\)) and identical actions, Bayes’ theorem gives:  
  - If strategy is **Always EXIT**:  
    Probability at B given intersection = \( \frac{P(\text{B})}{P(\text{A}) + P(\text{B})} = \frac{1/3}{1} = \frac{1}{3} \).  
    Expected payoff of EXIT = \( p \times 4 + (1-p) \times 1 = 1 + 3p \).  
    At \( p = \frac{1}{3} \), EXIT yields \(1 + 3 \times \frac{1}{3} = 2\). CONTINUE yields \( p \times 0 + (1-p) \times 0 = 0 \).  
    **Optimal ex post: EXIT (2 > 0)**.  
  - If strategy is **Always CONTINUE**:  
    \( p = \frac{1}{3} \) (same calculation). CONTINUE yields 0, EXIT yields 2 → **Optimal ex post: EXIT**.  
  **Conclusion**: Regardless of strategy, at any intersection, EXIT yields \(1 + 3p = 2\), CONTINUE yields 0. **Ex post, EXIT is always optimal**.  

  #### (iii) Conflict Between Ex Ante and Ex Post  
  Ex ante, **Always CONTINUE** is optimal without the device (payoff \(\frac{4}{3}\)). But ex post, the driver strictly prefers to EXIT (payoff 2 vs. 0). This is **dynamically inconsistent**: the plan chosen ex ante (CONTINUE) is not incentive-compatible ex post. The driver cannot credibly commit to CONTINUE because at every intersection, he has an incentive to deviate to EXIT.  

  #### (iv) Resolving the Coherence Challenge?  
  - **Without commitment**: The conflict persists. The ex ante optimal plan (CONTINUE) is not sequentially rational. This *undermines dynamic consistency*: rationality at each stage prevents implementing the ex ante optimal strategy.  
  - **With commitment**: Purchasing the device and choosing "EXIT when allowed" yields net payoff 2, higher than any no-commitment strategy (1.333). The device *physically prevents* CONTINUE at one exit, eliminating the choice and thus the ex post deviation temptation.  
    - **Coherence restored?**: Yes, but technically by *removing* the choice where inconsistency would arise. The commitment device does not alter preferences; it restricts the action space to make the ex ante plan enforceable.  
  - **Plan-dependent preferences?**: Some argue that agents should evaluate actions *only* by their ex ante optimal plan. Here, however, the driver still *experiences* regret ex post (e.g., if device enforces CONTINUE at B, he gets 1 but knows he could have had 4). True resolution requires either:  
    (a) Accepting the commitment as rational self-binding, or  
    (b) Rejecting Bayesian updating in self-identical nodes (e.g., using total ignorance \( p = 0.5 \)).  
  **Verdict**: The conflict *does* challenge naive dynamic consistency, but commitment devices *dissolve* it by altering the feasible set. The tension is not logical but practical—resolved through preemptive action.  

  ---

  ### Marking Scheme (30 points total)  
  1. **Strategy Space Definition** (4 points)  
     - *Award*: Correctly identifies 2 strategies without device (EXIT/CONTINUE) and 2 with device (EXIT/CONTINUE when allowed).  
     - *Common failure*: Omits "CONTINUE when allowed" with device or assumes non-identical actions.  

  2. **Payoff Computation** (8 points)  
     - *Award*: Correct expected utilities:  
       No device: EXIT = \( \frac{2}{3} \), CONTINUE = \( \frac{4}{3} \).  
       With device (EXIT when allowed): Gross 2.5, net 2.  
     - *Common failure*: Miscomputes probabilities (e.g., assuming 50/50 chance of being at A/B) or omits device cost.  

  3. **Ex Post Belief Derivation** (6 points)  
     - *Award*: Derives \( p = \frac{1}{3} \) using Bayes’ theorem; shows EXIT payoff = \(1 + 3p = 2\) > CONTINUE = 0.  
     - *Common failure*: Assumes \( p = 0.5 \) (ignoring prior) or treats payoffs as location-dependent.  

  4. **Dynamic Inconsistency Identification** (6 points)  
     - *Award*: States that ex ante optimal (CONTINUE) is suboptimal ex post (where EXIT yields 2 > 0).  
     - *Common failure*: Claims inconsistency arises only without device or misstates the conflict.  

  5. **Coherence Evaluation** (6 points)  
     - *Award*: Notes device resolves tension via physical enforcement; argues it dissolves (not just displaces) inconsistency.  
     - *Common failure*: Assumes commitment alters preferences or treats paradox as unsolvable.  

  ---

  ### Confidence Statement  
  **Overall Confidence**: 95%.  
  - **High confidence** in payoff arithmetic and ex post belief derivation (exact probabilities are unambiguous).  
  - **Moderate confidence** in coherence verdict: Commitment devices *do* resolve the *practical* tension, but the *conceptual* tension (ex post regret) remains.  
  - **Least confident** in whether the conflict is "genuinely dissolved" (Task iv). The device displaces the inconsistency to the pre-departure choice (costly commitment vs. no commitment), but since this choice is ex ante optimal, it may be rationally justified. The answer leans on revealed preference: net utility gain (2 > 4/3) justifies commitment as rational.
