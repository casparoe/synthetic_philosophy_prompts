  Williams's original case involves a man who must save either his drowning wife or a stranger. Williams argues that if the man pauses to justify saving his wife through moral reasoning, he's having "one thought too many"—the proper motivation should simply be "it's my wife." The triage nurse case complicates this: she faces a professional duty to follow impartial protocols, even when her child is involved. This creates tension between personal attachments and institutional roles.

  The core feature in Williams's argument seems to be the nature of deep personal commitments—relationships like marriage that are constitutive of one's identity. These aren't just preferences; they're fundamental to who we are. Moral theories that require justifying such commitments through impartial frameworks alienate us from ourselves.

