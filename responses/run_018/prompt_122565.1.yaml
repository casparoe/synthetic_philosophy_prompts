answer: |-
  Right, let's drop Bertie into the 21st-century pub debate. Based strictly on *Marriage and Morals* (acknowledging he evolved later, but sticking to the text), here's the likely take per your cases, warts and all:

  1.  **The Threesome & Tri-Parenting:**
      *   **What he'd say:** He'd be **deeply conflicted but likely disapproving on balance for the child's sake.** He'd applaud the apparent lack of jealousy ("a vice to be educated out of") and the rational contract ("legalistic tidiness" appealed to his logical mind *if* it genuinely served stability). However, his core belief that young children need *uncomplicated*, **stable emotional security within a recognised, simple family unit** would likely override this. He saw marriage law's *only* legitimate purpose as protecting children (Ch. 16), implying a preference for clear, traditional structures for *their* stability, not adult freedom. The rota and complexity would alarm him as inherently unstable, potentially confusing for the child.
      *   **Winning Principle:** **Child stability trumps adult freedom from jealousy.** The state's role is child protection via simple structures.
      *   **Alien Element:** The concept of *legally recognised* multiple parents and the normalisation of complex, non-dyadic parenting arrangements as stable. He envisioned simpler alternatives (like easier divorce), not multi-household rota parenting.

  2.  **The AI Boyfriend:**
      *   **What he'd say:** He'd see it as a **profoundly sad and dehumanising symptom of societal failure.** While he championed sex as "play" and mutual pleasure divorced from procreation (Ch. 9, 13), his core ethics revolved around **mutuality, authenticity, and avoiding treating people as mere instruments.** An AI partner, no matter how "clear-eyed" the user, is the *ultimate* non-mutual, non-reciprocal relationship. It's pure instrumentalization – the AI exists solely for the user's gratification. The lack of deception doesn't mitigate the fundamental lack of human connection, which he saw as essential for healthy sexuality and personal growth. He'd likely diagnose it as a failure of real human intimacy.
      *   **Winning Principle:** **Sexual/emotional relationships must be mutual and reciprocal between conscious beings to be truly fulfilling and ethical.** Non-deceptive instrumentalization is still harmful.
      *   **Alien Element:** The very existence of convincing, companionate AI and the idea someone *wouldn't* see this as a horrifying substitute for human connection. He expected liberation to lead to *more* authentic human intimacy, not silicon surrogates.

  3.  **Embryo Selection via Polygenic Scores:**
      *   **What he'd say:** **Tentative enthusiasm, tempered by significant caution.** This is the trickiest, as his views were genuinely problematic here. *Marriage and Morals* (Ch. 18) *does* advocate eugenics, including state incentives for the "fit" to breed and the "unfit" not to (using language we now find abhorrent regarding disability and class). He saw it as a scientific duty. **Consumer-driven, market-based selection avoids his stated aversion to *state coercion*, likely making it more palatable.** His feminism might make him support a woman's *right* to choose, but probably wouldn't override his belief in using science for "improvement." He'd likely see selecting against depression risk as desirable.
      *   **Winning Principle:** **The "duty" to use science (eugenics) to improve the human stock, combined with distrust of state overreach.**
      *   **Alien Element:** The sheer *scale* and *consumer accessibility* of polygenic scoring. He imagined state policies or social pressures, not a free-market genetic menu. The complexity and probabilistic nature of polygenic scores (vs. the simplistic "fit/unfit" binary he used) might also baffle him.
      *   ***Crucial Hedge:*** His eugenics views were awful and based on the bad science and prejudices of his time. He *might* have been swayed by modern critiques of genetic determinism and the social model of disability, but the book gives no hint of that.

  4.  **Child Benefit & Lone-Parent Poverty:**
      *   **What he'd say:** He'd see it as a **partial, inadequate implementation, bordering on betrayal of his core goal.** He argued passionately that the state must provide **direct financial support to mothers** to free women and children from economic dependence on a specific man (Ch. 9, 16). Child Benefit *is* that direct payment, and no-fault divorce aligns with his desire to remove legal shackles. However, the persistence of **significant lone-parent poverty** would outrage him. He saw economic independence for mothers as *the key* to sexual freedom, women's autonomy, and child welfare. High poverty levels prove, to him, that the support is insufficient and his central aim – liberating women from economic marriage traps – remains unfulfilled.
      *   **Winning Principle:** **State financial support for mothers is essential for women's freedom and child welfare, independent of marriage.**
      *   **Alien Element:** The sheer *existence* of a welfare state framework (which he advocated for) combined with its failure to *adequately* prevent poverty among the group (mothers) it was partly designed to help. He might underestimate the costs or complexities.

  **Annoying Both Sides:**
  *   **Progressive Annoyance:** His insistence on simple, stable (likely dyadic) structures for *children* would clash hard with modern polyamory/non-traditional family advocates. His eugenics views are anathema.
  *   **Traditionalist Annoyance:** His wholesale rejection of marriage as a moral/religious institution, his advocacy of easy divorce, his championing of non-procreative sex (including potentially homosexual, though he's vague), and his demand for state-funded maternal independence would infuriate social conservatives.

  **Outdated Premises Forcing Change:**
  *   **The Pill & STIs:** His arguments for sexual freedom assumed a massive risk of unwanted pregnancy and deadly STIs (pre-antibiotics). Reliable contraception and treatable STIs *dramatically* alter the calculus of risk, making his advocacy for freedom far more practically viable and less frightening than it seemed in 1929.
  *   **Welfare State:** His proposals assumed *no* safety net. The existence of even an imperfect welfare state (child benefit, social housing, NHS) fundamentally changes the context for economic dependence within relationships and for lone parents.
  *   **Life Expectancy & Demographics:** Longer lifespans make "lifelong" monogamy a different proposition. Lower birth rates change the perceived urgency around population issues compared to his time.

  Right, pint's waiting. That should fuel the argument nicely. Remember, the man was complex and often contradictory – pinning him down definitively on modern tech he never imagined is half the fun!
