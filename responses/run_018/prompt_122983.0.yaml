prompt: |-
  I'm working on a novel where one of the characters — a burnt-out experimentalist, not a crank — actually gets a working demon, and I want the physics to be the sort a physicist would grudgingly nod at instead of throwing the book at the wall. So before I decide what she's built, I need the spec.

  Write me the desiderata for a theory of demons: what any account of when a little gatekeeper can and can't turn information into work has to deliver, with the case behind each requirement. I want the list to cover failure stories and my success story equally — a good theory should be able to look at any setup and say where the entropy actually goes, not just stamp NO on it. The purpose it has to serve: it should be good enough to tell me which single assumption I can break in fiction and what I'd be forced to break along with it.

  The cases I want it to handle, because these are the shapes my plot keeps taking:

  - the never-eraser: she keeps every measurement result forever, the memory just grows, nobody ever pays to clear it;
  - the lazy door: opening and shutting the gate is free and frictionless and she only ever opens it when the molecule was going the right way anyway, so most of the time she does literally nothing;
  - the species sorter: not fast-from-slow but two kinds of molecule in a mixture, making a concentration difference and osmotic pressure — is that the same problem wearing a hat;
  - the cold brain: her memory sits at a lower temperature than the gas;
  - the blind demon: no measurement at all, she just exploits a correlation that's already sitting there between something she can see and the molecule's state;
  - the one-shot: a single run, work out, quit — where per-cycle bookkeeping doesn't obviously apply and rare big fluctuations matter more than averages;
  - the demon whose memory gets wiped for free because the environment thermalizes her bits on its own.

  Plus the structural ones I keep tripping over: where the theory draws the boundary between demon, gas, and environment and what rides on that choice; whether it's allowed to lean on the demon being an agent or a mind rather than a dumb mechanism; whether it has to give answers for finite memory, finite time and a finite bath, or only in some ideal limit; and whether the cost is a hard floor per bit, the kT ln 2 thing I half-remember from Landauer, or only an average that a lucky fluctuation can beat.

  Mark which requirements are non-negotiable — break them and it isn't physics anymore — and which are just preferences of one camp, like insisting the whole thing be told in the vocabulary of entropy rather than information, or in terms of ensembles rather than individual runs. Flag any pair of requirements you suspect can't be jointly satisfied; that's the part I'll build the third act around. And tell me which single requirement kills off the largest number of would-be working demons, so I know what I'm up against.

  A sentence each on how the big extant stories do against the list is plenty — the measurement-is-fine-it's-the-erasure-that-costs line, the fluctuation-theorem people, whatever else — I care about the criteria far more than the leaderboard, and I'd rather you spent the words on which demands are real and which are tribal.
reasoning: |-
  Okay, the user is writing a novel and needs a solid physics foundation for a Maxwell's demon that feels plausible to physicists. Let me unpack their request. They want desiderata for a theory of demons—essentially the criteria any credible explanation must meet. The key here is making the physics rigorous enough that experts wouldn't dismiss it, while leaving one deliberate loophole for fiction. 

  Hmm, the cases they listed are fascinating: never-eraser, lazy door, species sorter, etc. Each tests different aspects of the demon problem. I should map these to core physics challenges—information-work conversion, entropy accounting, boundary definitions. The structural questions about boundaries, agency, and finite systems are equally crucial because they determine where the "magic" can hide in their story.

  Wait—they explicitly want to know which single assumption breakage would enable their demon while causing cascading consequences. That's brilliant for plot tension. I need to identify the most brittle requirement. Landauer's erasure cost feels like the obvious candidate since it's the usual culprit in failure stories, but... is that too predictable? Maybe the bath temperature assumption is more interesting narratively—if the demon's memory is colder than the system, it bends the rules. 

  The non-negotiables must be airtight: conservation laws, second law compliance, demon-as-system. Compromising those breaks physics entirely. Whereas preferences like ensemble vs. single-shot frameworks are stylistic—useful for signaling which physics "tribe" the character belongs to. 

  Ah! The cold brain scenario jumps out as their likely loophole. If the demon's memory operates at lower T, the kT ln2 cost deflates. But the cascade effect is delicious: now you need exotic cryogenics, and suddenly the demon isn't a thought experiment—it's a heat management nightmare. Perfect for a burnt-out experimentalist wrestling with practical hell. 

  For the third-act conflict, I'll pit the finite bath requirement against the one-shot case. What if the demon "wins" once by draining the bath's free energy? Then it's useless—a metaphor for the character's own burnout. The physicist in me winces, but the novelist in me applauds.
answer: |-
  Here's a rigorous set of desiderata for a theory of Maxwell's Demons, designed to separate plausible fiction from physics-breaking fantasy. Requirements are categorized and key conflicts flagged.

  **Core Physics (Non-Negotiable - Break These & It's Magic):**
  1.  **Energy Conservation:** *Must* account for all energy transfers (work extracted, heat flows). *Case:* Any setup violating this creates energy from nothing.
  2.  **Second Law Compliance (Global):** *Must* show total entropy (system + demon + environment) never decreases. *Case:* Failure means perpetual motion of the second kind.
  3.  **Demon as Physical System:** *Must* model the demon (sensor, gate, memory, processor) as part of the thermodynamic universe, subject to the same laws. *Case:* Invoking "agency" or "mind" avoids physics, making prediction impossible. The boundary must be explicitly defined (e.g., the demon's "body" vs. the gas vs. the thermal bath) as entropy flows depend on it.
  4.  **Finite Resources Ultimately Constrain:** *Must* acknowledge that infinite baths, infinite memory, infinite time, or perfectly isolated systems are idealizations. Performance *must* degrade as these limits are approached in a finite world. *Case:* "Never-eraser" fails when physical memory fills; "cold brain" needs refrigeration.

  **Specific Performance (Theory Must Explain Success/Failure for These Cases):**
  5.  **Cost Localization:** *Must* pinpoint *where* and *when* the entropy cost is paid or free energy consumed for *every* demon operation cycle/variant. *Case:* "Blind demon" exploits existing correlation (cost paid earlier), "lazy door" pays minimal cost only when it *does* act.
  6.  **Measurement Cost Optionality:** *Must* explain when/if measurement *itself* has a thermodynamic cost, separate from erasure/decision. *Case:* "Lazy door" might avoid measurement cost via its strategy; "cold brain" might reduce it.
  7.  **Memory Cost Dynamics:** *Must* account for the full lifecycle of information in memory (writing, storage, reading, erasure/resetting). *Case:* "Never-eraser" pushes erasure cost to infinity; "free thermal wipe" exploits environment for erasure. **Landauer's Principle (kT ln 2 min erasure cost per bit *in a heat bath at T*) is a *consequence* under specific conditions, not an absolute universal floor – the theory must show *when* it applies and what happens if those conditions are violated (e.g., "cold brain").**
  8.  **Erasure Cost Context:** *Must* show if the cost depends on *how* the memory is erased and the state of the environment/bath. *Case:* "Free thermal wipe" works *only* if the memory bit is coupled to a bath at temperature ≥ the bit's effective temperature during erasure.
  9.  **Work Extraction Limits:** *Must* define the maximum possible work extractable from a given non-equilibrium state created by the demon, linking it to the information utilized and the costs incurred. *Case:* "Species sorter" extracts osmotic work from concentration difference – the theory must relate the work to the sorted particle count and information cost.
  10. **Fluctuation Handling:** *Must* handle single-shot/rare event scenarios ("one-shot") where ensemble averages are inadequate. *Must* distinguish between average costs (over many cycles) and the cost for a specific, successful operation. *Case:* A "one-shot" success exploiting a rare fluctuation might cost *less* than kT ln 2 *on average*, but the theory must show the *actual* entropy generated for that specific event.
  11. **Temperature Dependence:** *Must* incorporate the temperatures of all relevant subsystems (gas, bath, memory substrate). *Case:* "Cold brain" exploits T_memory < T_gas to potentially reduce Landauer cost proportionally (cost ~ k T_mem ln 2 for erasure *at T_mem*).

  **Theoretical Scope & Style (Preferences/Tribal):**
  12. **Finite vs. Asymptotic:** *Preference:* Ability to handle demon operation with *finite* memory, *finite* time, and *finite* heat baths is more powerful and realistic (though harder) than relying solely on asymptotic limits (N→∞, t→∞).
  13. **Information vs. Entropy Language:** *Preference:* Frameworks using information theory (mutual information, Shannon entropy) are often more intuitive for demonics, but an entropy-only formulation is equally valid if consistent. The best theories bridge both.
  14. **Stochastic Trajectories vs. Ensembles:** *Preference:* Frameworks capable of describing individual realizations ("one-shot" thermodynamics, stochastic thermodynamics) are more powerful for describing specific demon actions and fluctuations than purely ensemble-based descriptions.

  **Key Conflicts & Loopholes for Your Plot:**
  *   **Finite Bath vs. Continuous Operation (Requirement 4 vs. "Never-Eraser/Lazy Door"):** The "never-eraser" and highly efficient "lazy door" *seem* viable only with infinite memory/time. A finite bath *must* heat up (or the demon's memory fill up), degrading performance. **This tension is prime for your third act.** Can the demon achieve its goal *before* the bath saturates/memory fills?
  *   **kT ln 2 Universality vs. Cold Brain (Requirement 7 & 11):** Landauer's kT ln 2 is often cited as the *minimum* erasure cost. **The biggest loophole is erasure temperature.** If the demon erases its memory *while coupled to a cold bath* (T_cold << T_hot_system), the cost is ~k T_cold ln 2, potentially much lower. **This is the single requirement (erasure temp dependency) that kills most naive demons and enables plausible fiction.** The cascade cost is the *creation and maintenance* of that cold bath, requiring significant external work/entropy export.
  *   **Single-Shot Cost vs. Average Cost (Requirement 10):** In a "one-shot" success exploiting a rare fluctuation, the *actual, realized* entropy generation might be less than the average cost per cycle. The theory must justify this without violating the Second Law globally.

  **How Existing Theories Stack Up (Briefly):**
  *   **Landauer-Bennett (Measurement Fine, Erasure Costs kT ln 2):** Handles core non-negotiables. Fails "Cold Brain" (ignores erasure temp), struggles with finite baths/time, weak on single-shot/fluctuations ("One-Shot"), assumes simplistic memory model. Good baseline.
  *   **Stochastic Thermodynamics / Fluctuation Theorems:** Excels at Requirement 10 ("One-Shot") and trajectory-based descriptions. Strong on cost localization (5). Can handle finite systems (12). Can become complex to apply to full demons. Naturally handles fluctuations.
  *   **Information Thermodynamics (Sagawa-Ueda etc.):** Explicitly links information (mutual info) to work bounds. Strong on 5, 9, 13. Can integrate with stochastic thermo. Still needs careful modeling of the demon's physics (3).
  *   **Resource Theories (Thermodynamics of Computation):** Formal, abstract. Strong on fundamental limits and single-shot scenarios (10). Can feel detached from physical implementation details like specific temperatures (11) or gate friction ("Lazy Door").

  **Recommendation for Your Novel:**
  *   **Break This:** **Requirement 7 (Erasure Cost Context) / Landauer's Assumption.** Specifically, break the assumption that erasure *must* happen at the temperature of the system being controlled (T_hot). Give your demon a **cold brain (T_mem << T_gas)**.
  *   **Forced Cascade:** This forces the inclusion of a **cryogenic system** to create and maintain the demon's low-temperature memory substrate. *This* is where the real thermodynamic cost is paid – not in the measurement or gate operation on the gas. The entropy generated by the cryocooler *more* than compensates for the demon's apparent violation when viewed in isolation. The demon works, but the "engine" powering its brain is large, noisy, and energy-intensive. The burnout experimentalist's breakthrough is mastering cryogenic memory stabilization at the nanoscale, but keeping it running is the new nightmare.
  *   **Third Act Conflict:** Build the climax around **Requirement 4 (Finite Resources)**. The cryogenic system has a finite heat sink capacity or the memory substrate has limited cyclability. The demon works brilliantly... *until the cold runs out*. Can she achieve her critical goal before the bath warms up or the memory degrades? This links the physics constraint directly to the plot's tension.

  This approach gives you plausible physics (the demon *can* work, exploiting the cold memory loophole) while grounding the "cost" in a tangible, complex engineering challenge (cryogenics) that fits a burnt-out experimentalist's struggle and provides a natural, physics-driven deadline for your climax.
