  The user wants to differentiate this from standard sensory integration, which typically involves learning associations over time. Here, the immediacy is crucial. So terms like "cross-modal structural alignment" or "immediate cross-modal spatial mapping" come to mind. In robotics, this might relate to sensor fusion, but the user's case emphasizes no training phase.

