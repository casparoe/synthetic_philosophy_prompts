answer: |-
  That's a fascinating and astute observation! You're absolutely right that this pattern is distinct from both the **classic Molyneux problem** and **standard multimodal learning**, and it highlights a crucial aspect of spatial cognition. While there isn't one universally agreed-upon, single-word term for *exactly* this specific scenario (adding vision to a mature non-visual spatial model with immediate alignment), the concept is well-recognized and discussed within several fields using related terms and concepts. Here's how to carve it out and frame it:

  **Key Distinctions:**

  1.  **vs. Classic Molyneux Problem:**
      *   **Molyneux:** Focuses on *object recognition* (shape identity: cube vs. sphere) in a *novel sense* (vision) by someone with *no prior visual experience whatsoever*. It's fundamentally about **cross-modal identification of specific objects** without visual calibration.
      *   **Your Pattern:** Focuses on *structural/spatial layout recognition* within a *pre-existing, internally consistent spatial model* built through an alternative modality. Vision is added, but the core model *already exists*. The question is about **immediate recognition of spatial structure ("Oh, *that* is the corner I know")**, not identifying *what* a specific object *is* by sight alone. The individual *knows* there's a corner; the alignment confirms *which visual pattern corresponds to that known spatial feature*.

  2.  **vs. Standard Multimodal Learning/Integration:**
      *   **Standard Learning:** Involves building associations *from scratch* through correlated input from multiple senses over time (e.g., learning that a certain sound co-occurs with a certain sight through repeated exposure).
      *   **Your Pattern:** Assumes a **mature, robust spatial model already encoded** using one modality. Adding vision exploits the *structural congruence* between the existing non-visual spatial representation and the incoming visual information. The alignment is immediate because the *spatial relationships* are already defined; vision simply provides a new "rendering" of that existing structure. Little to no *new associative learning* about the spatial layout itself is needed.

  **Established Concepts & Framing:**

  1.  **Amodal / Supramodal Spatial Representations:** This is the core neuroscience concept underpinning your observation. It posits that the brain represents certain properties (especially space) in an abstract, modality-independent format. The spatial model isn't inherently "visual" or "auditory"; it's **amodal**. When a new sense like vision comes online, it feeds into this *pre-existing* amodal spatial representation. The immediate "recognition" isn't visual recognition per se, but the **instantiation of the known spatial structure via the new sensory channel**. Terms like "amodal spatial framework" or "supramodal spatial representations" are key here.
      *   *Why it fits:* Explains why the echolocator "sees the corner" immediately – the corner's location and relation to other features were already defined amodally; vision just populates that node with visual data.

  2.  **Structural Isomorphism / Congruence:** This emphasizes the shared geometric/topological structure between the non-visual spatial model and visual space. The reason alignment can be immediate is that the spatial relations encoded via touch or sonar **map directly** (are isomorphic/congruent) to the spatial relations captured by vision. The robot aligns edges because the abstract spatial *structure* of "edge-ness" and its location relative to other features is the same, regardless of the sensing modality.
      *   *Why it fits:* Directly addresses the "geometry" difference you mentioned. The underlying structure is the same; only the sensory "encoding language" differs.

  3.  **Cross-Modal Structural Alignment / Bootstrapping:** This describes the *process* you're observing. The amodal representation provides the structural "skeleton," and the new sensory input *aligns* to it based on inherent spatial congruence. Vision is "bootstrapped" onto the existing spatial model.
      *   *Why it fits:* Captures the immediacy and the reliance on pre-existing structure.

  4.  **Sensor Fusion (in Robotics, specific case):** While sensor fusion is broad, the scenario you describe – where a new sensor (camera) provides data that *immediately* fits the spatial structure built by other sensors (tactile) without requiring extrinsic calibration or learning correlations – relies heavily on the **assumption of a shared geometric reality**. If the tactile model is geometrically accurate and the camera is calibrated (intrinsically & extrinsically), projecting visual features into the *existing* spatial map is straightforward. The robot isn't "learning" what an edge is; it's detecting a visual edge and associating it with the *known spatial location and feature type* from the tactile map.
      *   *Why it fits:* Explains the robot case specifically.

  **What to Call It:**

  For maximum clarity, especially in your writing, I recommend combining these ideas:

  1.  **Immediate Cross-Modal Spatial Mapping via Amodal Representations:** (Most precise, emphasizes the core mechanism)
  2.  **Cross-Modal Structural Alignment of Pre-Existing Spatial Models:** (Highlights the process and precondition)
  3.  **Bootstrapping Vision onto a Non-Visual Spatial Framework:** (Descriptive, emphasizes the "adding vision" aspect)
  4.  **The Recognition of Structural Isomorphism upon Sensory Addition:** (More technical, emphasizes the geometric congruence)

  **In essence:** You're describing the **immediate manifestation or instantiation of a pre-existing amodal spatial representation through a newly acquired sensory modality, enabled by the structural congruence (isomorphism) between the modalities and the spatial world.**

  This concept is crucial because it demonstrates that spatial understanding can transcend specific sensory inputs. The brain (or a well-designed robot) isn't just associating sensations; it's building and maintaining an abstract model of space that can be accessed and populated by multiple sensory streams. Your observation cuts to the heart of how perception integrates sensory data with internal models to create a unified understanding of the world. It's a powerful refinement beyond the limitations of the classic Molyneux question.
