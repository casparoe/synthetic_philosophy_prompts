  First, I need to understand the core challenge: pure time preference is often confused with instrumental factors like risk or growth. The user wants to isolate it as a purely normative claim about time itself carrying ethical weight. That's subtle because in economics, discounting is usually presented with instrumental justifications.

  The plan must start by establishing a conceptual dependency. Pure time preference only makes sense as a substantive thesis if we first distinguish it from tautological discounting (like utility functions already embedding time bias) or mere economic convention. Without this, the debate collapses into verbal disputes. I'll use a "neutral starting point" framing where we assume no inherent time bias initially.

  For the carrying scenario, I should avoid the standard exponential discount curve since it's too associated with instrumental reasoning. Instead, a health scenario with identical twins separated only by birth timing could work. The key is to eliminate all variables except temporal position - same person, same health outcome, same knowledge, just different times. This makes the pure time preference choice stark.

  Predictable misconceptions need proactive handling. Risk aversion confusion should be intercepted when defining pure discounting, using the twin scenario to show identical certainty. Spatial analogies must be blocked during the symmetry principle discussion by highlighting temporal indexicality. The instrumental justification assumption gets addressed immediately after the scenario by emphasizing the "solely because" clause.

  The diagnostic exercise should test application, not just repetition. A quick choice between two identical future goods at different times could reveal if they truly isolate temporal position. If they invoke risk or growth, the distinction wasn't internalized.

  The framing device using symmetry principles is clever but risky. Comparing time to spatial neutrality illuminates how both treat position as ethically irrelevant, but breaks down because "now" is experientially unique while "here" isn't. This risks over-intellectualizing though - must acknowledge that danger.

  Finally, boundaries are crucial. No infinite time horizons, no social choice theory. Mentioning these omissions upfront prevents distracting tangents. The focus stays on individual normative reasoning.

  The timing breakdown seems workable: 15 mins for foundations, 20 for scenario and discussion, 15 for misconceptions, 10 for symmetry framing, 10 for diagnostic, plus buffers. Participant-driven discussion is key at graduate level - they'll spot nuances I might miss.

  What I'm still checking: Is the twin scenario too contrived? Maybe, but it serves the purpose. Could the diagnostic be sharper? Possibly, but brevity is essential. Overall, this should meet the user's need for conceptual rigor while keeping it accessible without prerequisites.
answer: |-
  Here’s a structured teaching plan focusing on conceptual sequencing, scaffolding, and critical engagement:

  **Total Time: 75 mins**  
  **Participants: ~10 grad students**  
  **Core Goal:** *Isolate pure time preference (PTP) as a normative choice by disentangling it from instrumental justifications.*

  ---

  ### **1. Conceptual Foundation: Avoiding Tautology (15 mins)**  
     - **Opening Question:** "When economists discount future goods, what *reasons* do they typically give?" (Elicit: risk, opportunity cost, uncertainty).  
     - **Key Distinction (Dependency):**  
       - *Define:* **PTP ≡ discounting *solely* due to temporal location.**  
       - *Crucial Precondition:* **Distinguish "time" as a *bare container* vs. "time" as a proxy for *instrumental factors*.**  
       - *Avoiding Tautology:* Show that if discounting is embedded in utility functions by definition, PTP becomes circular. Instead, **start from a neutral baseline: intertemporal neutrality** (equal weight to equal welfare at all times).  
     - *Visual:* Timeline with identical welfare bundles at t₁ and t₂. *Question:* "Does moving a bundle from t₁ to t₂ *itself* justify valuing it less? Why/why not?"  

  ---

  ### **2. Carrying Scenario: The "Identical Twins" Thought Experiment (20 mins)**  
     - **Scenario:**  
       *Two genetically identical twins, A and B, born 20 years apart. Both will experience identical health states (e.g., "perfect health for 1 year")—A at age 40 (now), B at age 40 (in 20 years). No inflation, no societal change, no uncertainty, no investment opportunities.*  
     - **Task:** "If you must allocate one curative treatment to either A or B (not both), is there a rational basis to prioritize A?"  
     - **Required Features:**  
       - Controls for risk, growth, and epistemic uncertainty.  
       - Same subjective experience for both agents.  
       - Highlights *only* temporal position as the variable.  
     - **Avoids:** Diminishing marginal utility, economic growth assumptions.  
     - *Discussion Focus:* "If you choose A, is it *because* their need is sooner? What ethical principle justifies that?"  

  ---

  ### **3. Predictable Misconceptions & Interception Points**  
     *(Weave into Sections 1-2)*  
     - **Conflation with Risk/Uncertainty:**  
       *Intercept:* Immediately after defining PTP. Use the twins scenario to stress: "Both outcomes are *certain*—why might time alone matter?"  
     - **Spatial-Distance Analogy:**  
       *Intercept:* During baseline neutrality discussion. *Counter:* "We don’t discount welfare in Australia vs. Austria solely due to distance. Why treat temporal 'distance' differently? Is 'now' ethically privileged like 'here'?"  
     - **Instrumental Justification Assumption:**  
       *Intercept:* When presenting the twins scenario. *Emphasize:* "PTP requires no *further* justification—it’s a primitive normative stance. Does this feel defensible?"  

  ---

  ### **4. Diagnostic Exercise (10 mins)**  
     - **Task:** *"You receive two guaranteed vouchers: one for a massage today, one for an identical massage in 5 years. You must donate one and use the other. Which do you donate, and why?"*  
     - **Diagnostic Clues:**  
       - If answer cites "opportunity cost of waiting" or "inflation" → misses PTP.  
       - If answer: "I donate the future voucher *only* because it’s later" → grasps PTP.  
       - If "I’m indifferent" → understands neutrality.  
     - *Debrief:* Highlight responses revealing conflation vs. isolation of time.  

  ---

  ### **5. Framing Device: Symmetry Principle & Its Breakdown (10 mins)**  
     - **Frame:** **Intertemporal neutrality as a temporal symmetry principle** analogous to:  
       - *Spatial neutrality:* Welfare equal weight regardless of location.  
       - *Person-neutrality:* Equal weight to all individuals.  
     - **Breakdown:** Time’s indexicality:  
       - "Now" is experientially unique (e.g., "my present pain feels urgent").  
       - Ethical agents are temporally *situated*; spatial location lacks this indexical force.  
     - **Illuminates:** Why PTP violates a default symmetry.  
     - **Risks Distorting:** Framing PTP as "irrational" rather than a *normative first principle*. Acknowledge: "This frames PTP as asymmetry—but some argue temporal position *should* matter ethically."  

  ---

  ### **6. Explicit Omissions & Boundaries (5 mins)**  
     - **Omitted:**  
       - Infinite-horizon aggregation (e.g., Ramsey model critiques).  
       - Social choice theory (intergenerational equity frameworks).  
       - Empirical debates (e.g., Stern vs. Nordhaus).  
     - **Rationale:** "Today’s goal is isolating PTP’s *conceptual core*, not its application in complex models. We’re examining individual rationality, not societal trade-offs."  

  ---

  ### **Timeline Summary**  
  - **0–15 mins:** Conceptual setup (neutrality vs. tautology).  
  - **15–35 mins:** Twins scenario + discussion.  
  - **35–45 mins:** Symmetry principle + breakdown.  
  - **45–55 mins:** Address misconceptions (woven in throughout).  
  - **55–65 mins:** Diagnostic exercise + debrief.  
  - **65–75 mins:** Boundaries + wrap-up (Q&A on core distinction).  

  ---

  **Key Teaching Moves:**  
  - **Repetition with Variation:** Use "solely because" in definitions, scenarios, and diagnostics.  
  - **Stakeholder Framing:** "Imagine you’re a policymaker/individual with no market constraints."  
  - **Avoid Econ Jargon:** Say "weighting" instead of "discounting" where possible.  
  - **Participant Voice:** Poll initial intuitions (twins scenario), then revisit after conceptual tools are introduced.  

  This plan forces engagement with PTP as a *freestanding normative commitment* while preempting textbook conflations. The twins scenario and diagnostic make abstract distinctions tangible.
