  The most glaring tension is between (1) and (3). The Principal Principle says Beauty should have 1/2 credence in heads, but their thirder position says 1/3. They need to resolve this fundamental conflict. For (2) and (5), if self-location is ordinary indexical belief, why develop a special "perspectival sampling" framework? This creates a methodological tension. (4) supports (1) well, but (3) undermines it through the chance issue.

