  Another issue is the asymmetry concept. The gatekeeper argument challenges Hacking's model by introducing power dynamics. Some might say this breaks the loop, while others see it as a realistic extension. This ties into whether looping requires individual agency or if institutional structures can override it. That's a genuine theoretical contention.

