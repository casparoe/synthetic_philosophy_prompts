prompt: |-
  So I've been stuck on Hacking's looping effects in psychiatric classification — you know, the idea that labeling someone 'autistic' or 'borderline' changes their behavior and then the category itself shifts. In our group there's a stall: half think looping means psychiatric kinds are just social constructions with no biological anchor, the other half say it's a minor feedback loop that biomarkers will eventually correct. I wonder if they're actually disagreeing about what 'kind' means — like, one side cares about ontology, the other about clinical prediction — but I also came up with this idea of 'asymetric looping' where the feedback gets blocked by institutional gatekeepers so the loop never closes. Some people say that breaks Hacking's model, others say it's the only realistic version for adult diagnosis. Is this debate stalled because it's verbal, or because they're answering different questions? And can anything actually move it — a study, a distinction? Please seperate what's settled from what's genuinely contested, and don't present one side as the consensus. Also no need for bibliographys, just diagnose it.
