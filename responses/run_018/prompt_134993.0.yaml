  First, I need to recall Hacking's looping effects. He argued that classifying people changes how they see themselves and behave, which in turn alters the category itself. This is dynamic and interactive. The user's group seems to be splitting into two camps: social constructionists versus biological realists. The user's insight about "kinds" is key here. Are they talking about what autism *is* (ontology) or how well we can predict and intervene (clinical utility)? Those are different frameworks.

