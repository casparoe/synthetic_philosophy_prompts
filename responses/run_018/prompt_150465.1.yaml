answer: |-
  Your described decision rule represents a **distinct hybrid model** that doesn't collapse neatly into standard frameworks like Prospect Theory (PT), Rank-Dependent Utility (RDU), or ambiguity aversion. Its sequential structure and explicit catastrophe scaling create unique properties. Below is a formal characterization, differentiation from existing models, boundary cases, and axiomatic implications.

  ---

  ### **Formal Structure**
  Let:
  - \(S\) be a finite set of states with probabilities \(p_s\).
  - \(X_s\) be the outcome in state \(s\).
  - \(U(\cdot)\) be a **concave utility function** (capturing risk aversion).
  - \(C\) be a **catastrophic threshold** (e.g., survival capital).
  - \(\phi(\cdot)\) be a **scaling function** where \(\phi(d) \in [0,1]\), decreasing in \(d\) (distance below threshold).  
    *Example:* \(\phi(d) = e^{-k \cdot d}\) for \(d = \max(C - X_s, 0)\), \(k > 0\).

  The decision rule aggregates value as:  
  \[
  V = \sum_{s} p_s \cdot \underbrace{U(X_s)}_{\text{Risk-averse utility}} \cdot \underbrace{\phi\left( \max(C - X_s, 0) \right)}_{\text{Catastrophe penalty}}.
  \]

  **Key features**:  
  1. **Sequential adjustments**: Utility curvature is applied *first*, then catastrophe scaling.  
  2. **State-specific penalty**: \(\phi(\cdot)\) depends on *distance below \(C\)*, not probability.  
  3. **Non-separability**: The penalty directly multiplies \(U(X_s)\), coupling outcome and probability.

  ---

  ### **Distinction from Standard Models**
  | **Model**               | **Key Difference**                                                                 |
  |-------------------------|-----------------------------------------------------------------------------------|
  | **Prospect Theory (PT)** | PT uses a *probability-weighting function* \(\pi(p)\) *before* utility. Here, scaling is *outcome-dependent* and applied *after* utility. PT’s weighting depends on probability rank, not outcome magnitude relative to \(C\). |
  | **Rank-Dependent Utility (RDU)** | RDU transforms *cumulative probabilities* (e.g., tail risks). Your rule transforms *individual state contributions* based on \(X_s < C\), irrespective of probability rank. |
  | **Ambiguity Aversion**  | Irrelevant. Your setup assumes known probabilities; ambiguity aversion deals with *unknown* probabilities. |
  | **Safety-First Criteria** (e.g., Roy, Kataoka) | These impose *binary* constraints (e.g., \(\Pr(X_s < C) \leq \alpha\)). Your rule uses *continuous scaling* below \(C\), allowing smooth trade-offs. |

  **Crucial non-reducibility**:  
  The sequential application prevents collapsing into a single transformed utility or probability distribution. The term \(U(X_s) \cdot \phi(\cdot)\) cannot be rewritten as \(\tilde{U}(X_s)\) or \(\tilde{p}_s \cdot U(X_s)\) because \(\phi\) depends on \(X_s\) *nonlinearly* and multiplicatively.

  ---

  ### **Boundary Cases and Convergence**
  1. **No catastrophe (\(\phi \equiv 1\))** → Reduces to standard expected utility.  
  2. **Linear \(\phi(d)\) and linear \(U\)** → Becomes a distorted expectation, but still differs from PT/RDU due to outcome-dependence.  
  3. **Extreme penalty (\(\phi(d) \to 0\) for \(X_s < C\))** → Approximates a **hard constraint** (à la safety-first), ignoring all states below \(C\).  
  4. **Threshold \(C \to -\infty\)** → Scaling inactive; reverts to expected utility.

  ---

  ### **Axiomatic Commitments**
  1. **Violates Independence Axiom**:  
     Scaling depends on \(X_s\), so preferences between lotteries change if states below \(C\) are altered.  
     *Example*: Mixing a catastrophe state with a non-catastrophe state disproportionately penalizes the composite.  
  2. **State-Dependent Utility**:  
     Effective utility is \(U_s(X_s) = U(X_s) \cdot \phi(\max(C - X_s, 0))\), violating state independence.  
  3. **Monotonicity Preservation**:  
     Holds if \(\phi(d) > 0\), but violations occur if \(\phi(d)=0\) (eliminating states).  
  4. **Catastrophe Aversion**:  
     Strictly convex penalty in losses below \(C\) (via \(\phi''(d) > 0\)) induces extra aversion to deep catastrophes.

  ---

  ### **Conceptual Pushback & Clarifications**
  - **No hidden reduction**: Your two-layer structure *cannot* be expressed as PT/RDU without violating core assumptions (e.g., probability weighting in PT is rank-based, not outcome-distance-based).  
  - **Warning on scaling**: If \(\phi\) depends *only* on \(d\) (not \(s\) or \(p_s\)), it may underweight *low-probability catastrophes* relative to models like RDU that overweight small probabilities.  
  - **Practical justification**: This structure is common in engineering/risk protocols (e.g., nuclear safety) where:  
    (i) Standard risk aversion (EU) handles "normal" losses,  
    (ii) Catastrophe scaling imposes "belt-and-suspenders" penalties for existential threats.  

  ---

  ### **Proposed Name**
  While no universal label exists, literature refers to similar hybrids as:  
  - **Threshold-Adjusted Expected Utility** (if emphasizing \(C\))  
  - **Catastrophe-Penalized Utility** (if emphasizing \(\phi\))  
  - **Sequential Risk-Catastrophe Model** (descriptive)  

  **Recommendation**: Frame it as a **state-dependent utility** extension to EU, with \(U_s(X_s)\) separable into risk and catastrophe components. Cite precursors:  
  - Chichilnisky’s *topology of fear* (1996) for catastrophic thresholds.  
  - Baumol’s *safety margins* (1963) in economic planning.

  This model fills a niche: blending EU for moderate risks with *continuous* catastrophe aversion—unlike binary safety-first rules. If you enforce \(\phi(d) > 0\) universally, it avoids discontinuities while amplifying "deep tail" pessimism.
