prompt: |-
  I am trying to characterize a decision rule that appears in some risk-management protocols. The agent computes a standard risk-weighted expectation: outcomes are weighted by state probabilities and passed through a concave utility function. Then, separately, any state whose outcome falls below a designated catastrophic threshold is subjected to an additional multiplicative scaling factor that depends on the distance below that threshold, reducing its contribution to the aggregate. These two adjustments—utility curvature and threshold-dependent scaling—are applied sequentially rather than being collapsed into a single transformed probability distribution or a single modified utility curve. Does this two-layer structure have an established name in decision theory, and how should it be distinguished from prospect theory's unified probability-weighting function, from rank-dependent utility, and from simple ambiguity aversion? If it lacks a standard label, please define its formal structure, state what axiomatic commitments it entails, and indicate where its boundary cases become indistinguishable from other risk-sensitive frameworks. I also ask that you push back plainly if my description hides a reduction to one of those standard forms, or if the framing otherwise rests on a conceptual mistake.
