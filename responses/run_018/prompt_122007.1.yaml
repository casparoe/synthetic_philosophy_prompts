prompt: |-
  A guy in my reading group has been pushing this argument for weeks and I think its broken but I can't put my finger on where. He says it's basically Hume's case against miracles, tidied up, and that once you tidy it up you see it proves way more than Hume let on.

  His version, as close as I can get it:

  (1) A miracle, in the sense that matters, is not just a surprising or rare event -- it's an event contrary to a law of nature, something that can't have happened unless a generalization we've confirmed countless times has an exception.
  (2) We have no reason at all to believe any law of nature except uniform experience: we've seen the regularity hold again and again and we've never seen it break.
  (3) So the evidence that the law holds on this occasion is as strong as inductive evidence gets. He uses Hume's term for this: a "proof" -- not logical certainty, but a body of experience so large that no finite pile of contrary reports can be stacked against it.
  (4) The evidence for a miracle is testimonial, and testimonial evidence is only ever as good as our track record for witnesses of that kind in circumstances of that kind, which is always finite and imperfect.
  (5) Both bodies of evidence are, in the end, just records of experience, so they're commensurable and the bigger one wins. A finite imperfect record can never outweigh a proof.
  (6) So no quantity of testimony -- however many witnesses, however independent, however sober and disinterested -- can ever make it reasonable to believe a miracle occurred. The rational response is always to conclude the witnesses were mistaken, or lying, or that the report got garbled on its way to us.
  (7) And none of this depends on the content of the miracle, or on lawhood specifically. The same reasoning goes through for any well-confirmed regularity: if we've confirmed that X doesn't happen, testimony that X happened loses by default.

  (7) is the step he thinks is interesting, because it means the argument isn't really about religion. And (7) is also where I lose him, because it seems to swallow things I'm not willing to give up:

  - Take a network of, say, forty instrument chains on four continents, sealed, self-calibrating, triple-redundant, results cryptographically signed and archived with no human in the loop, all reporting that a body in a vacuum chamber accelerated upward for three seconds. He has to say the right response is "the instruments are wrong." But that means no amount of instrumentation could ever disconfirm a law, which I take to be obviously false. He bites the bullet and says we'd have been right to go on believing the law -- which is insane, but I can't say why.
  - Take a modern court case: thirty independent witnesses, none of whom know each other, testify that a man certified dead by two doctors sat up in the morgue and walked out. No law of nature is violated there -- people survive overdoses, doctors misdiagnose -- but "people certified dead don't get up and leave" is about as well confirmed a regularity as you could want. Juries convict on less. His argument seems to say they shouldn't.
  - And then the case he actually cares about: a resurrection-type report attested in several apparently independent sources from two thousand years ago. Here I want his conclusion. I really don't want to end up saying that's credible.

  He has one move I half-understand. He calls it the closure of the test set: a law is only ever confirmed for conditions inside some tested class, and a report from outside that class isn't competing with the law at all, it's just silent about it. That sounds like it dissolves the whole argument -- and he agrees it would, but says it doesn't matter, because we've got no positive reason to think this case is different from the tested ones, and "we have no reason to think it's different" is all the argument ever needed.

  So: which step do I reject? And be honest about the bill -- I'd rather keep (1) through (5) and I'd rather keep (6) for the religious case than give up that the instrument network could ever be right, so tell me what I'm paying if I insist on that combination, and tell me why the step I'm rejecting looked fine in the first place. Also, if it's (7) that goes, I want to know what work "law of nature" vs. "well-confirmed regularity" has to do afterwards, because I have a wierd feeling that the version of the argument that stops at laws is too narrow to be interesting and the version that doesn't eats everything.
reasoning: |-
  Okay, the user is dealing with a complex philosophical argument in their reading group. This person's acquaintance has presented a refined version of Hume's argument against miracles, extending it to any well-confirmed regularity. The user senses something's wrong but can't pinpoint it. They want to reject step (7) without undermining the argument against religious miracles.

  First, I need to understand each step of the argument. The key points are that miracles violate natural laws, evidence for laws is based on uniform experience (a "proof"), testimonial evidence is always weaker, and thus testimony for miracles can't outweigh the proof. Step (7) extends this to any well-confirmed regularity, not just laws of nature. 

  The user's problem areas are the scientific instruments and court case examples. They think it's absurd that no instrumentation could disconfirm a law and that juries shouldn't convict even with strong testimony against a well-confirmed regularity. But they want to keep the argument for religious miracles. 

  I recall that Hume's original argument has been critiqued for not accounting for the possibility that testimony could be strong enough. The user mentioned the "closure of the test set" where laws are only confirmed for tested conditions. The acquaintance dismisses this by saying we have no reason to think the case is different. But that might be where the flaw lies.

  For the instrument network, if all sensors report acceleration upward in a vacuum, rejecting the law might be rational if we consider the instruments reliable. The acquaintance would say we should trust the law, but that seems counterintuitive. The issue might be that the evidence isn't just testimonial; it's direct empirical data. Step (4) equates instrumental data with testimonial evidence, which weakens the argument. 

  In the court case, thirty witnesses to a "resurrection" should be credible even against the regularity that dead people don't get up. The acquaintance's argument would dismiss this testimony. But here, the regularity isn't a law; it's based on past observations with possible exceptions. The strength of testimony could outweigh the prior probability if the witnesses are reliable. 

  The core problem is step (5): treating all evidence as commensurable. Testimonial evidence's weight depends on context. Also, step (3) assumes the "proof" is absolute, but scientific laws are probabilistic and subject to revision. Step (7) ignores that some regularities are more entrenched than others. Natural laws are considered inviolable, whereas others might admit exceptions. 

  Rejecting step (5) and refining step (3) could work. Evidence isn't always commensurable; instrumental data might be direct, while testimony is indirect. Also, the "proof" for laws isn't unassailable; it's based on current understanding. Step (7) fails because natural laws have a different status than empirical regularities. 

  For the religious case, ancient testimony with multiple sources might still not outweigh the proof against resurrection because of the lack of reliability and possible alternative explanations. The user can keep (6) for miracles by emphasizing the unique status of natural laws versus other regularities. 

  The cost: The user has to accept that in some cases, like the court example, testimony can override a strong regularity if the evidence is strong enough. But for miracles violating natural laws, the proof is stronger, and ancient testimony is weaker, so (6) still holds. 

  The acquaintance's "closure of the test set" point is valid, but dismissing it with "no reason to think it's different" is weak. If there's no evidence either way, we default to the established law, but if new evidence arises, we must reevaluate. The argument ignores the possibility of new, reliable evidence challenging a law. 

  In conclusion, reject step (5) and refine step (3). Evidence isn't always directly comparable; instrumental data is more reliable than testimony. Also, natural laws have a different epistemic status than other regularities. This allows the instrument network to disconfirm laws and juries to convict with strong testimony, while still dismissing ancient miracle claims due to weaker evidence and the strength of natural laws.
answer: |-
  Your instinct is sharp - the argument *is* flawed, and step (5) is the critical weak point. Here's the breakdown:

  1.  **Reject Step (5):** "Both bodies of evidence are... commensurable and the bigger one wins." **This is false.** Evidence isn't fungible like currency. You cannot simply compare the *size* of the experience base supporting the law (millions/billions of observations) against the *size* of the testimonial record (X witnesses) and declare the bigger pile wins. The *kind* and *quality* of evidence matter profoundly.

      *   **Why it seems fine:** Hume framed evidence probabilistically, suggesting the probability of the law being broken is vanishingly small compared to the probability of testimony being wrong. Step (5) makes this seem like a simple quantity comparison.
      *   **Why it's wrong:**
          *   **Direct vs. Indirect:** The evidence for the law is *direct sense experience* of the regularity holding. The evidence for the miracle is *testimony about* sense experience. While testimony *is* ultimately grounded in someone's experience, it's epistemically distinct. We assess testimony based on *reliability* (track record, motives, conditions, coherence), not just the *number* of testifiers compared to the number of observations supporting the law. A single, highly reliable instrument or witness under ideal conditions *can* outweigh a vast amount of indirect evidence supporting a contrary generalization.
          *   **The Instrument Network Example:** This is the death knell for step (5). Here, the "testimony" comes from instruments designed *specifically* to detect deviations from known laws, operating under controlled, redundant, verifiable conditions *without human interpretation bias*. The "proof" for the law is vast, but it's *historical* and *indirect* compared to the *current, direct, high-fidelity instrumentation* reporting an anomaly. To dismiss this as "the instruments are wrong" *without investigation* is irrational dogmatism, not rational empiricism. Science progresses precisely *because* such anomalous data *can* force a re-evaluation of the "proof." Step (5) denies this possibility. **The argument fails here because it equates the epistemic weight of countless past observations (the "proof") with the potentially *higher* epistemic weight of a small number of *current, direct, high-reliability* measurements.** The instrumentation *isn't* just "testimony" in the same sense as human reports; it's a direct extension of our senses under controlled conditions.
          *   **The Court Case Example:** Thirty independent, credible witnesses to a highly salient event *directly contradict* the well-confirmed regularity "People certified dead don't get up and walk out." While the regularity is strong, the *quality* and *quantity* of the direct, corroborated testimony *can* rationally overcome the prior probability based on the regularity. A jury *should* convict (or at least find the event occurred) based on this, barring strong evidence of collusion or hallucination. The argument's step (5) would forbid this, implying the regularity can *never* be overturned by testimony, no matter how good. This is counter-intuitive and impractical. **The flaw is treating the *prior probability* based on the regularity as an unassailable barrier that testimony *qua testimony* (regardless of quality) can never overcome, rather than seeing testimony as *new evidence* that must be weighed *on its own merits* against the prior.**

  2.  **Refining Step (3):** The "proof" for a law is indeed as strong as inductive evidence gets *based on past experience under known conditions*. However, it is *not* inviolable or immune to revision *by new, high-quality evidence gathered under conditions designed to test it rigorously*. Step (3) needs the caveat: "...*until confronted with new evidence of sufficiently high quality and directness that rationally compels re-evaluation*."

  3.  **What Happens to Step (7)?** Step (7) becomes untenable *as stated*. The argument *does* depend on the **epistemic status** of the regularity, not just its confirmation level.
      *   **Laws of Nature:** These represent our deepest, most fundamental, and most broadly confirmed regularities. They are presumed to hold universally and necessarily (until overwhelming evidence forces revision). The *kind* of evidence needed to overturn one (like the instrumentation network) is extraordinarily high.
      *   **Well-Confirmed Empirical Regularities:** These are strong patterns based on vast experience (e.g., "No one recovers after being certified dead by two doctors and lying in a morgue"). However, they often rely on implicit background conditions ("under normal circumstances," "without extraordinary intervention"). They are *not* presumed to hold with the same metaphysical necessity as fundamental laws. High-quality testimony *can* rationally overcome such regularities *if it provides a plausible reason to think the background conditions were violated* (e.g., the doctors made a rare mistake, the person had an extremely rare physiological response). The court case example fits here.
      *   **The Work of "Law of Nature":** Distinguishing laws from other regularities matters because:
          *   **Burden of Proof:** The evidence required to rationally believe an exception to a *fundamental law* is astronomically higher than for a strong empirical regularity. The instrumentation network *might* meet that burden; ancient testimony about a resurrection almost certainly does not.
          *   **Plausibility of Error:** For a strong empirical regularity, the possibility of misdiagnosis, misreporting, or rare exceptions is *inherently more plausible* than the violation of a fundamental law. For a law violation, the explanation *must* involve either a colossal error/fraud *or* a rewriting of physics. The former is usually vastly more probable *unless* the evidence for the violation is itself extraordinarily secure and direct (like the instrument network).

  **The Revised Argument (Keeping what you want):**

  1.  A miracle requires violating a fundamental law of nature.
  2.  Belief in such laws rests on vast, uniform experience ("proof").
  3.  Evidence for miracles is typically testimonial.
  4.  Testimonial evidence is assessed based on reliability, which is finite and imperfect.
  5.  **Crucial Revision:** To rationally believe a fundamental law was violated requires evidence of *extraordinary* quality, directness, and reliability. **Ordinary testimonial evidence, especially historical testimony involving extraordinary claims passed through human chains, is *never* sufficient to meet this burden.** The prior probability based on the "proof" combined with the inherent weaknesses and potential sources of error in testimony *always* makes it more rational to reject the testimony than to accept the law was broken.
  6.  Therefore, no quantity of *ordinary testimony* can make belief in a miracle (law violation) reasonable. The rational response is to seek alternative explanations for the reports.
  7.  **Refined Scope:** This reasoning applies specifically to claims of violating fundamental laws of nature due to their unique epistemic status. For claims contradicting *merely* well-confirmed empirical regularities, sufficiently strong and reliable testimony *can* sometimes be rationally believed, as the possibility of error in the background conditions or the testimony itself, while low, may not be as vanishingly small as the violation of a fundamental law.

  **Addressing Your Specific Cases & Costs:**

  *   **Instrument Network:** You **can** rationally believe the instruments and reject the law *in this case*. The cost: You must accept that the "proof" for a law, while immense, is *not* absolute dogma. It *can* be overturned by *new, direct, exceptionally reliable evidence* that functions as a *superior form of empirical access* compared to the historical record constituting the "proof." This doesn't destroy science; it *is* science.
  *   **Court Case:** You **can** rationally believe the testimony (or at least, it's *rational* for a jury to do so). The cost: You must accept that some very strong empirical regularities *can* be overturned by high-quality testimony about specific events. "People certified dead don't get up" is strong, but it's not a *fundamental law*; it relies on the reliability of certification and known biology. Thirty independent witnesses *is* evidence of extraordinary reliability for *that specific event*.
  *   **Ancient Resurrection Report:** You **keep** the conclusion that it's not credible. The argument against it holds because: (a) Resurrection violates fundamental laws (conservation of mass-energy, thermodynamics, biology). (b) The testimonial evidence is *not* of extraordinary quality/directness. It's ancient, passed through human chains, potentially motivated, lacks contemporary corroboration from neutral sources, and describes an event vastly more extraordinary than a misdiagnosed death in a morgue. The burden for believing a law violation is immense, and this testimony, however "multiple" the sources might seem, doesn't come close to meeting it. The "closure of the test set" move fails because while the resurrection *would* be a novel condition, we have *no positive reason* (beyond the disputed testimony itself) to think this situation was relevantly different in a way that suspended fundamental laws, and overwhelming reason (the "proof") to think it wasn't.

  **Why the "Closure of the Test Set" Move Doesn't Save the Argument:**

  Your acquaintance is right that the argument only strictly applies to *tested* conditions. His mistake is thinking "we have no reason to think it's different" is sufficient to dismiss the testimony *absolutely*. It's not. It means the *prior probability* based on the law is very high. However, **strong, direct, reliable evidence *from* the novel condition *itself* *can* provide that "reason to think it's different" and rationally overcome the prior.** The instrument network *is* evidence from the novel condition (the specific experiment). Ancient testimony *about* a novel condition (the resurrection) is far too weak and indirect to serve this function against the prior of fundamental laws. His move correctly highlights the burden but incorrectly assumes testimony can *never* meet it, even in principle. The instrumentation example proves it *can*.

  **In essence:** You pay the cost of accepting that *some* evidence (like the instrument network) *can* disconfirm laws and that strong testimony *can* overturn strong empirical regularities (like the court case), but you preserve the core Humean skepticism against believing *miracles* (violations of fundamental laws) based on *historical testimony*. The key is recognizing the difference in epistemic status between laws and other regularities, and crucially, rejecting the **false commensurability** of evidence in step (5).
