  hey, i'm a backend engineer with basically no philosophy background. i was reading about jeffrey conditionalization — updating beliefs when your evidence is ambiguous and you don't condition on a single event but on a partition weighted by confidence. i want to apply this to our monitoring system: we recieve noisy sensor readings that don't map to one failure mode, so we update probabilities over overlapping categories like 'cpu overload' and 'memory pressure', but thier confidence weights don't always sum to one because the sensors are redundant and the categories aren't mutually exclusive in our prior. please describe the most important implications of Jeffrey conditionalization and uncertain evidence for whether this kind of messy update is still coherent, if i'm basically breaking bayes, and what happens conceptually if we run these updates repeatedly over time. no need for references, just want the conceptual stakes.
