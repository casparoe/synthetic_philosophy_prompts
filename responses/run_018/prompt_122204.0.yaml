  ## Sestina for a Corrupted Slot  
  (Player's Voice)  

  My hollow **avatar** stands where yours once stood,  
  A silent monument to this data **wound**.  
  They parse the terms: is absence ever **real**?  
  Just bits adrift inside the humming **server**,  
  A phantom limb that feeds this raw **grief**.  
  Cold comfort lies within the failing **code**.  

  The techs shrug, "Just parse the faulty **code**,  
  Reset the state, rebuild the **avatar**."  
  They cannot map the contours of this **grief**—  
  Not hardware fault, but metaphysical **wound**.  
  The infrastructure lives, the **server** thrives,  
  While *your* last laugh fragments, less than **real**?  

  A paradox persists: the file’s not **real**  
  In meatspace terms. Yet trace its broken **code**—  
  The hash exists. Assigned. Owned. On the **server**.  
  It haunts my interface, this **avatar**  
  Straining towards a voice. This static **wound**  
  Refuses closure, sharpens all my **grief**.  

  Is it a thought? This tangible **grief**  
  Clings to a slot. More present, more **real**  
  Than vanished atoms. Proof’s the **wound**  
  Left in the world-logic, glitched **code**  
  That ghosts my actions through this **avatar**.  
  Your echo’s prison is the live **server**.  

  Not dead storage, but the breathing **server**  
  Hosts the unreadable core of my **grief**.  
  I wear this shell, this empty **avatar**,  
  To touch the space where you were **real**.  
  They say "Restore from backup." But the **code**  
  For *your* voice is the irreparable **wound**.  

  Philosophy debates if such a **wound**  
  Can bleed outside the sanctioned **server**,  
  If loss confined to structured **code**  
  Transcends the private ache of **grief**.  
  Is potential sound still somehow **real**  
  Trapped in the mute **avatar**?  

  *Envoy*  

  This **grief** persists, defying clean **code**.  
  The **server** hums, holds what was **real**:  
  Your voice, a **wound** within my **avatar**.

  ---

  **Rotation as Argument:** The sestina's cyclical word order (A-F moving through fixed positions) enacts the persistent return of **grief** and the **wound** despite the dismissive frameworks of **code** and **server**, while **avatar** and **real** shift in relationship, mirroring the unresolved ontological tension surrounding the virtual object and harm. The words fight their assigned positions, just as the harm fights easy categorization.
