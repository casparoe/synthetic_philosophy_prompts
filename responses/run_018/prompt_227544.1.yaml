answer: |-
  Your question cuts to the heart of a crucial distinction in social choice theory: the difference between a *categorical impossibility* (like Gibbard-Satterthwaite) and *graded comparisons* of vulnerability. The research comparing voting rules on manipulability isn't ignoring the theorem; it's operating *within the constraints established by the theorem* to find practically significant differences. Here's why and how:

  1.  **Gibbard-Satterthwaite Establishes a Binary Property, Not a Uniform Degree:**
      *   The theorem proves that for 3+ alternatives, any non-dictatorial, surjective voting rule is *manipulable*. This is a binary "yes/no" property: a rule either *is* or *is not* (only dictatorships aren't) manipulable *in principle*.
      *   Crucially, it **does not** say that all manipulable rules are equally manipulable *in practice*. It doesn't specify:
          *   **How often** manipulation opportunities arise.
          *   **How easy** it is for voters to recognize and execute a successful manipulation.
          *   **How large** the potential gains from manipulation are for the manipulator (or the losses for others).
          *   **How complex** the strategic calculations required are.
          *   **How resistant** the rule is to manipulation attempts (e.g., how often an attempted manipulation backfires).

  2.  **Researchers Compare Rules on These "Degrees of Manipulability":**
      This is where the literature you mention comes in. It precisely investigates the dimensions the theorem leaves untouched:

      *   **Frequency:** How likely is it that *some* voter has *some* incentive to misrepresent their preferences in a *typical* or *random* election profile? Simulation studies (using randomly generated preferences) and analytical probability calculations show massive variations:
          *   Plurality is highly manipulable (e.g., Duverger's Law describes strategic desertion of minor candidates).
          *   Instant-Runoff Voting (IRV) has lower frequency of manipulable profiles than Plurality in many simulations, but higher than some others.
          *   Approval Voting often shows lower frequency than Plurality or IRV in simulations.
          *   Borda Count tends to be more manipulable than many others.
          *   Range Voting often scores very well on frequency metrics.
      *   **Ease/Difficulty (Computational & Cognitive):**
          *   **Recognizing the Opportunity:** In Plurality, recognizing a potential gain from deserting a weak favorite is often simple ("My candidate can't win, I'll vote for the lesser evil"). In IRV, figuring out the optimal strategic ranking, especially in large elections, can be extremely complex and counter-intuitive. In Approval, deciding the optimal threshold is conceptually simpler but still requires estimating candidate strengths.
          *   **Executing Successfully:** Even if an opportunity exists, executing the manipulation might require precise coordination (e.g., in some multi-round systems) or precise knowledge of others' preferences. Failure can lead to a worse outcome. Some rules are more "safe" to manipulate naively than others.
          *   **Computational Complexity:** Theoretical computer science analyzes the computational difficulty of the "Manipulation Problem" ("Given a voting rule, a set of other voters' ballots, and a preferred candidate, can *this* voter cast a ballot making their preferred candidate win?"). Results show:
              *   Manipulation is often NP-hard (computationally intractable for large elections) for rules like Ranked Pairs, Schulze, and even IRV under certain conditions. This acts as a practical barrier.
              *   Manipulation is computationally easy (polynomial time) for rules like Plurality, Approval, and Borda.
      *   **Impact (Gain/Loss):** How much better off can a strategic voter make themselves? How much worse off might others be? Some rules allow large swings in outcomes from small strategic votes; others are more stable.
      *   **Resistance/Backfire Risk:** How often does an attempted strategic vote actually backfire, making the outcome *worse* for the strategic voter than if they voted sincerely? Some rules are more forgiving of naive strategy than others.

  3.  **What These Comparisons Mean (Coherent Interpretations):**
      When researchers say "Rule A is less manipulable than Rule B," they typically mean one or more of the following:
      *   **Lower Frequency:** "The set of preference profiles where *some* voter has *some* incentive to misrepresent their vote is smaller under A than under B."
      *   **Higher Difficulty:** "The cognitive or computational burden for a voter to *recognize* a beneficial strategic vote, or to *execute* one successfully without high risk of backfiring, is greater under A than under B."
      *   **Lower Impact:** "The potential gain achievable by a strategic voter (or the potential harm to others) tends to be smaller under A than under B."
      *   **Higher Resistance/Lower Backfire Risk:** "Voters attempting naive strategic votes are less likely to accidentally make their outcome worse under A than under B."

  4.  **Why This Matters for Practice:**
      Practitioners absolutely should care about these degrees:
      *   **Predictability & Stability:** A rule where manipulation opportunities are rare and hard to exploit leads to more predictable outcomes that better reflect sincere preferences on average.
      *   **Voter Confidence & Legitimacy:** If voters perceive the system as easily "gamed" (like Plurality often is), it erodes faith in the outcome. A rule resistant to easy manipulation enhances perceived legitimacy.
      *   **Encouraging Sincere Voting:** Rules where manipulation is difficult or risky encourage voters to vote sincerely, leading to outcomes that better represent the collective will.
      *   **Practical Feasibility:** A rule where manipulation is computationally NP-hard offers a strong *practical* barrier against sophisticated manipulation, even if it's theoretically possible.
      *   **Mitigating Harm:** Choosing a rule where strategic voting has lower impact minimizes the damage when it does occur.

  **Conclusion:**

  The Gibbard-Satterthwaite theorem is **not** ignored; it's the foundational truth that *forces* researchers and practitioners to ask the *next* set of questions: **"Since all reasonable rules *are* manipulable, *how* manipulable are they in practice, and which aspects of manipulability matter most for real elections?"**

  The literature comparing rules on manipulability is **not resting on a mistake**. It's a vital effort to understand the *practical severity* of the strategic voting problem under different rules. While all non-dictatorial rules share the *theoretical* property of manipulability, they differ enormously in the **frequency, difficulty, impact, and risk** associated with that manipulability. These differences are measurable, significant, and crucial for designing voting systems that are as robust as possible to strategic behavior in the real world. Choosing between voting rules based on their *relative vulnerability* to manipulation, despite the universal *existence* of vulnerability, is a perfectly coherent and essential design consideration.
