prompt: |-
  ok so my roommate has these opinions on voting ethics and i cant tell if they're actually consistent. she says if an election is literally a tie-breaker then you have a moral duty to vote for the least-bad option, but she also says 'lesser evil' logic is only okay when one candidate is genuinely dangerous and the other is just mediocre—if both are mediocre you should abstain loudly and call it protest. she praised her sister for casting a blank ballot in a safe state and tweating about it, but said her cousin was just free-ridding by skipping the same election without saying anything. then she said in primaries you should always vote your heart even for a longshot, but in generals you should never vote third-party if it risks helping the worst person win. so here's the case: there's a run-off with only two candidates, both back a bill that'd hurt her community, but one version is far worse. there's also a formal 'null vote' option that counts toward quorum but doesn't pick anyone. should she vote for the less harmful one, cast the null vote, or boycott and organize? i'm less interested in her actual answer than in the competing rules that could explain her earlier takes, what each predicts here, and which further case would best tell them apart. also she misspelled recieve in her notes but thats not relevant lol
reasoning: |-
  Okay, let me tackle this roommate's voting ethics puzzle. The user presents several seemingly conflicting positions their roommate holds, and wants to understand the underlying principles that could unify them. 

  First, I notice the roommate makes nuanced distinctions between different electoral scenarios. The tie-breaker case suggests she values consequentialism when votes directly determine outcomes. But then she rejects "lesser evil" voting unless there's a genuine danger threshold - this implies a deontological layer where compromising principles requires justification.

  The blank ballot vs. skipping distinction is particularly interesting. By praising the sister's public null vote but criticizing the quiet abstention, she seems to value performative ethical signaling - the act must communicate dissent to have moral worth. This isn't just about outcomes but about civic expression.

  The primary/general divide shows strategic thinking: primaries allow expressive voting because the stakes are lower, while generals require harm reduction. This suggests she operates with a sliding scale of pragmatism based on electoral context.

  For the runoff case, I see three possible interpretations of her framework:
  1) Harm-minimization principle would dictate voting for the less bad candidate since there's a "far worse" option
  2) Mediocrity threshold might lead to null voting if neither meets the "dangerous" criterion
  3) Civic expression could prioritize boycott + organizing as louder protest

  The key test case would be a non-competitive election with one mildly bad candidate and one terrible one - does she vote defensively or protest? That would reveal whether harm reduction overrides her mediocrity objection when there's no tie-breaker risk.

  Minor spelling errors aside, this roommate has constructed a fairly sophisticated ethical system blending consequentialist, deontological and communicative elements. The tensions arise at the boundaries of these principles - exactly where thought experiments prove useful.
answer: |-
  Based on your roommate's stated principles, here's a breakdown of the competing rules, predictions for the runoff case, and the crucial test case to resolve the tension:

  **Competing Rules in Her Framework:**
  1.  **Harm Threshold Principle:** "Lesser evil" voting is *only* morally required when one candidate poses **genuine danger** (not just mediocrity). If both are mediocre, abstention/protest is preferred.
  2.  **Consequentialist Tie-Breaker Principle:** If your vote is the literal tie-breaker, you *must* vote for the lesser evil to prevent the greater harm, regardless of the "danger" threshold.
  3.  **Expressive Abstention Principle:** Abstention must be **loud and protest-oriented** (like a blank ballot + tweeting) to have moral weight. Quiet abstention is "free-riding."
  4.  **Contextual Voting Strategy:**
      *   **Primaries:** Vote expressively ("heart") regardless of viability (low-stakes experimentation/ideological signaling).
      *   **Generals:** Vote strategically to prevent the worst outcome (high-stakes harm reduction). Third-party votes are immoral if they risk electing the worst candidate.

  **Predictions for the Runoff Case (Two Bad Options, Formal Null Vote):**

  *   **Rule 1 (Harm Threshold) Predicts: NULL VOTE or BOYCOTT+ORGANIZE.**
      *   *Reasoning:* Both candidates back a harmful bill. While one is "far worse," the question is whether the *less harmful one* crosses the "mediocre" vs. "genuine danger" threshold. Her framework requires this distinction. If the *less harmful* candidate is still only "mediocre" (i.e., not *dangerous* enough to compel lesser-evil voting), she should abstain/protest. The formal null vote counts towards quorum but expresses rejection, fitting the "loud abstention" preference. Boycott+Organize is the stronger protest version.
  *   **Rule 2 (Tie-Breaker) Predicts: VOTE LESS HARMFUL (if it's close).**
      *   *Reasoning:* This principle only activates *if* she believes her vote might be decisive. In a close runoff, the risk exists. If she perceives a significant chance her vote breaks a tie, this rule *overrides* the harm threshold *specifically* to prevent the far worse outcome. However, if the race isn't close, this rule doesn't apply.
  *   **Rule 3 (Expressive Abstention) Predicts: FORMAL NULL VOTE (and likely tweet/organize).**
      *   *Reasoning:* This rule strongly favors using the formal mechanism to register protest (blank/null vote) *and* making it public/part of organizing. Quietly skipping isn't an option. This aligns with praising the sister's blank ballot+tweet.
  *   **Rule 4 (Contextual Strategy - General Rule) Predicts: VOTE LESS HARMFUL.**
      *   *Reasoning:* A runoff is functionally identical to a general election: two main candidates, high stakes, winner-takes-all. Rule 4c (Generals) says vote strategically to prevent the worst outcome. Voting for the less harmful candidate directly reduces the risk of the far worse version of the bill passing. A null vote or boycott risks letting the worst candidate win by default.

  **The Core Tension:** The clash is primarily between **Rule 1 (Harm Threshold)** and **Rule 4 (Contextual Strategy - General Rule)**.
  *   Rule 1 asks: "Is the *less harmful* candidate merely mediocre, or are they *dangerous*?" If mediocre, protest. If dangerous, vote for them.
  *   Rule 4 (Generals) says: "If there's a significant risk the worst candidate wins and your preferred candidate isn't viable, vote for the *less harmful viable option* to mitigate damage." It doesn't require the less harmful option to be "dangerous" themselves, just *less bad* than the alternative.

  **The Crucial Test Case to Tell Them Apart:**

  **Scenario: A non-swing state general election for Governor.**
  *   **Candidate A:** Proposes policies widely seen as **genuinely dangerous** to a vulnerable group (e.g., severe cuts to essential services, erosion of core rights).
  *   **Candidate B:** Generally **mediocre/status quo/incompetent**, but their policies, while uninspired or flawed, are not seen as actively *dangerous* in the same way. They are the "lesser evil."
  *   **Polls:** Candidate A is leading slightly, but it's not a guaranteed blowout. Your vote *could* be decisive, but likely isn't (like most votes).
  *   **Third-Party:** Exists but polls at 2%.

  **How her rules predict behavior & how it resolves the tension:**

  1.  **Rule 1 (Harm Threshold):** Predicts she **SHOULD vote for Candidate B (lesser evil)**. Why? Because Candidate A is clearly "genuinely dangerous," meeting the threshold that compels lesser-evil voting. Candidate B's mediocrity doesn't excuse abstention when facing genuine danger.
  2.  **Rule 4 (Contextual Strategy - General):** Also predicts she **SHOULD vote for Candidate B (lesser evil)**. Why? High-stakes general election, worst candidate (A) has a real chance of winning, the alternative (B) is viable and less bad. Voting third-party or abstaining risks helping A win.
  3.  **Rule 2 (Tie-Breaker):** Doesn't strongly apply (vote not *literally* decisive), but the close polls align with the *spirit* of consequentialism, reinforcing voting for B.
  4.  **Rule 3 (Expressive Abstention):** Would be **overruled** by Rules 1 & 4 because of the presence of genuine danger (Candidate A). Quiet abstention is free-riding; loud abstention (null/blank + protest) would be seen as immoral because it fails the duty to prevent the dangerous outcome.

  **The Test:**
  *   **If she votes for Candidate B:** This shows **Rule 1 (Harm Threshold)** is the dominant principle *when danger is present*, even if the alternative is mediocre. The "mediocre vs. dangerous" distinction is key, and danger triggers the lesser-evil obligation. Rule 4 aligns here.
  *   **If she casts a protest vote (null/blank/3rd) + organizes:** This shows **Rule 1 (Harm Threshold) is weak or rejected** in this context. It would mean her rejection of "lesser evil" logic *unless it's a literal tie-breaker* (Rule 2) is absolute, *or* that **Rule 3 (Expressive Abstention)** overrides when she deems both major candidates unacceptable (placing Candidate B in the "mediocre but not dangerous enough" category, despite Candidate A's danger). This would be inconsistent with her praise for the sister's blank ballot *only in a safe state* where the outcome wasn't in doubt. Doing it here, where Candidate A could win, aligns more with her criticism of the cousin's quiet abstention but replaces "free-riding" with "reckless protest."

  **Conclusion on the Runoff Case:** Based purely on her stated principles, the strongest prediction is that she **votes for the less harmful candidate**.
  *   **Why?** The runoff is a high-stakes, two-person contest (like a general). One outcome is "far worse," likely meeting her "genuine danger" threshold for the *opponent*. Rule 1 (if the *less harmful* option isn't deemed dangerous *itself*, but the *alternative* is) combined with Rule 4 strongly favors voting strategically to prevent the worst outcome. The formal null vote (Rule 3) would likely be seen as insufficient to meet the moral duty to prevent the far worse harm, similar to how she views quiet abstention as free-riding. Boycott+Organize might be a secondary action *after* voting to prevent disaster.

  **The key takeaway:** Her framework relies heavily on **categorizing the level of harm** ("mediocre" vs. "dangerous") and **electoral context** (primary vs. general, safe vs. swing, tie-breaker risk). The "genuine danger" threshold for the *worst option* is the critical switch determining whether lesser-evil voting is required or protest is acceptable. The test case above isolates this switch.
