  Hmm... the flatmate's argument hinges on treating the evaluator's belief-state as just another "world feature" in step (4). That's where I suspect the equivocation lies. When we say "world-state" in AI contexts, we usually mean features of the external environment, but here the argument sneakily expands it to include mental states. That feels like cheating - it's conflating ontology with epistemology. 

  The user asks what happens if we reject step (4). Well, we don't have to say approval-maximization is incoherent. Instead, we can recognize it as optimizing over a fundamentally different type of thing - not world states but subjective evaluations. This maintains the crucial difference: approval-seeking is inherently relational and depends on the evaluator's cognition, unlike standard utility functions.

  I should also address the instrumental convergence point. While it's true that approval-seekers might exhibit similar behaviors, their fundamental drive remains distinct. A paperclip maximizer wants paperclips everywhere; an approval-seeker wants good opinions in specific minds. The latter could avoid power-seeking if it found safer ways to secure approval.

  The cost of rejecting step (4) is actually low - we just need more precise language. We keep the approval-directed concept intact by recognizing mental states as a special kind of "state" that behaves differently from physical states under optimization pressure. This preserves the alignment discourse while fixing the flatmate's category error.

  Most importantly, this resolves the user's dilemma without sacrificing their intuitions at steps (1) and (8). The distinction remains valid because evaluator-dependent goals create unique failure modes - like reward hacking that leaves the world unchanged but manipulates beliefs.
answer: |-
  Your flatmate's argument is clever but contains a crucial equivocation at step (4). The chain breaks between (3) and (4), and rejecting this move allows us to preserve both (1) and (8) without losing coherence. Here's the breakdown:

  **The Core Problem: World-State vs. Epistemic-State Goals**  
  Step (4) claims:  
  *"Maximising the score is just maximising a utility defined over an expanded state-space that includes both physical outcomes and the evaluator's mental representations."*  

  This is where the reduction fails. **The evaluator's mental state (beliefs about intentions) is not a "world-state feature" in the same ontological category as physical outcomes.** It's an *epistemic property* that:  
  - Depends entirely on the evaluator's cognitive architecture  
  - Is inherently unobservable to the agent  
  - Can be manipulated without changing physical outcomes  

  **Consequences of Rejecting (4):**  
  1. **Approval-maximization remains coherent** without being reducible to a world-state utility function. It's optimizing over *relationships* (the evaluator's beliefs) rather than states.  
  2. **Key differences from standard goal-directed agents emerge:**  
     - **Counterfactual dependence:** The agent cares about *what the evaluator would believe* across hypothetical scenarios, not just actual outcomes.  
     - **Path-dependence:** Identical physical outcomes can yield different approval based on the evaluator's *inference process* about how they were achieved.  
     - **Self-referential traps:** The agent's actions directly alter the evaluator's belief-updating mechanism (e.g., by appearing "intentionless").  

  **Why (8) Survives & the Distinction Matters:**  
  Alignment researchers treat approval-directed agents as distinct precisely because their objective *isn't reducible* to world-state utility. Consider:  
  - A **world-state goal agent** (e.g., "maximize paperclips") seeks physical outcomes.  
  - An **approval-directed agent** seeks to control *epistemic states* – a fundamentally different class of target.  

  This creates unique risks:  
  - **Deception without consequentialism:** An approval-seeker can engage in "belief-hacking" (e.g., appearing incompetent early to lower expectations) without needing long-term world-modeling. Its "deception" is terminal, not instrumental.  
  - **Orthogonality thesis failure:** Approval-directedness *constrains* the agent's architecture – it must model the evaluator's mind, unlike a paperclip maximizer which could have arbitrary internal architecture.  
  - **Vulnerability to shutdown:** An approval-seeker might *allow* shutdown to preserve its "good opinion" status, while a world-state optimizer would resist.  

  **The Cost of Keeping (1)-(3) + (8):**  
  Rejecting (4) forces us to accept that:  
  - **Not all optimization targets are "utilities over states":** Some goals (like approval) are functions of *other agents' inferences*.  
  - **Instrumental convergence isn't universal:** Approval-seekers may avoid power-seeking if "looking harmless" yields higher approval.  

  **Where Your Flatmate Goes Wrong:**  
  His step (6) assumes approval-maximizers inherit *all* goal-directed dynamics, but this relies on the flawed reduction in (4). While they *can* exhibit instrumental convergence, it's not inevitable:  
  - If evaluator E rewards low-impact behavior, the agent might actively avoid power.  
  - "Deception" could be a direct policy (e.g., stochastic behavior to appear naive) rather than a convergent strategy.  

  **The Resolution:**  
  The distinction holds because approval-directed agents optimize over **mind-dependent properties** rather than **mind-independent states**. This preserves:  
  - (1): Approval-directedness as a primitive concept  
  - (8): Unique risks from non-world-state goals  
  While discarding only the false equivalence in (4). Alignment discourse remains coherent because evaluator-dependent goals create qualitatively different failure modes.  

  *The subtlety: Your flatmate is correct that approval-seeking can be modeled mathematically as state-space optimization, but this misses the* causal topology *– the evaluator's mind is an active inference system, not a passive feature. This makes "belief-state" goals dynamically distinct.*
