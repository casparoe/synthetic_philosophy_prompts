answer: |-
  Below is a designed 90-minute seminar session that meets your requirements. It uses paper, envelopes, and token points (no real money), avoids upfront lectures, and focuses on experiential learning. The winner (by points) gets out of buying coffee next week.

  ---

  ### **Session Structure**
  **Total Time:** 90 minutes  
  **Participants:** 10 students  
  **Materials:**  
  - Paper slips for choices/predictions.  
  - 10 sealed envelopes (for Platonia).  
  - 20 sealed lottery envelopes (3 secretly empty, 17 with "win" slips for 10 points).  
  - A bag for lottery draws.  
  - Token point tally (on a whiteboard or paper).  
  - Pens.  

  ---

  ### **Phase 1: Platonia-Style Dilemma (40 min)**  
  *Goal: Experience the pull of symmetric reasoning. Participants don’t know it’s "Platonia."*  

  1. **Setup (5 min)**  
     - Pair participants randomly (5 pairs). Hand each pair a sealed envelope labeled "Pair X" (X=1 to 5).  
     - **Rules (verbally):**  
       *“You’re playing a game with your paired partner. You must choose A or B. Write your choice privately. If you both choose B, you each get 100 points. If you both choose A, you each get 1 point. If choices differ, the A-chooser gets 101 points, the B-chooser gets 0.”*  
     - **Add Reasoning Mirror:**  
       *“Also, predict your partner’s choice. Write: ‘I think [Partner] chooses [A/B] because…’ (Keep it brief.)”*  

  2. **Choice & Prediction (10 min)**  
     - Participants write:  
       - Their choice (A or B).  
       - Prediction of partner’s choice + reason.  
     - Collect all slips.  

  3. **Reveal & Mirror (15 min)**  
     - Open each pair’s envelope to reveal partner assignments and choices.  
     - For each pair:  
       - Announce choices and award points.  
       - **Reveal reasoning mirror:** Share predictions and reasons.  
       - Highlight mismatches (e.g., "Alex predicted Brit chooses A, but Brit chose B").  

  4. **Group Tally & Tease-Out (10 min)**  
     - Tally points on board. Ask:  
       - *“How many chose B? Why?”* (Typical: "I hoped for mutual B, but feared mismatch.")  
       - *“Did your prediction match reality? Why not?”* (Highlight lack of coordination.)  
     - **Key observation:** Most predictions will cluster around risk-aversion (e.g., "I predicted A because others won’t risk B"). Actual choices often mismatch, breaking symmetry.  

  ---

  ### **Phase 2: Luring Lottery Analog (40 min)**  
  *Goal: Feel symmetric reasoning collapse. Hidden empties break symmetry.*  

  1. **Setup (5 min)**  
     - **Rules (verbally):**  
       *“A bag holds 20 sealed envelopes. 17 contain ‘win’ slips (10 points each). 3 are empty. You may draw one envelope. If you get a ‘win,’ you earn points. If empty, 0 points.”*  
       *“But before you draw, answer: Would a purely logical, symmetric reasoner draw? Write yes/no + why.”*  
     - Emphasize: **No feeling envelopes** (seals prevent cheating; warn against thickness-checks).  

  2. **Decision & Draw (15 min)**  
     - Participants write:  
       - “Draw?” (Yes/No).  
       - Reasoning (e.g., “Yes, 17/20 chance is good”).  
     - **Draw envelopes:** Each who chose “Yes” draws one from the bag (random order).  

  3. **Reveal Empties & Points (10 min)**  
     - Participants open envelopes privately.  
     - **Reveal twist:** *“Three envelopes were secretly empty. Some of you may have them.”*  
     - Tally wins/losses on board.  

  4. **Group Reflection (10 min)**  
     - Ask:  
       - *“Who drew? Why?”* (Most will draw; expected value is positive.)  
       - *“Did anyone avoid drawing? Why?”* (Rare; social fear of loss or "crowding.")  
     - Contrast with reasoning slips:  
       - *“You wrote: ‘Symmetric reasoners would all draw.’ But did you consider hidden asymmetry?”* (Empties = hidden asymmetry.)  

  ---

  ### **Phase 3: Debrief & Synthesis (10 min)**  
  1. **Reveal Terms (3 min)**  
     - *“Game 1 was a **Platonia dilemma**—symmetric payoffs pull you toward mutual B. Game 2 was a **lottery analog**—symmetric reasoning collapses.”*  

  2. **Map Insights (5 min)**  
     - **Platonia failure:**  
       *“Predictions mismatched because you lacked **common knowledge**. You couldn’t assume identical reasoning.”*  
     - **Lottery failure:**  
       *“Hidden empties destroyed symmetry. Envelopes aren’t identical, so symmetric logic fails.”*  

  3. **Prize & Social Reality (2 min)**  
     - Award coffee exemption to highest points.  
     - **Honest limitation:**  
       *“Real lotteries rely on solitary reasoning. Here, **social presence** influenced you—e.g., fear of looking greedy or seeing others draw. We can’t replicate pure isolation.”*  

  ---

  ### **Predicted Breakdowns & Mitigations**  
  - **Envelope thickness-checks:** Likely 1–2 participants will try. **Mitigation:** Use identical envelopes with slips folded identically. If caught, note: *“Private info breaks symmetry—unlike pure superrationality.”*  
  - **Mirror prediction clustering:** Participants will avoid “irrational” optimism. Most predictions will skew pessimistic (“Others won’t risk B”). **Use this:** Highlight how social fear overrides logic.  
  - **Lottery herd behavior:** If early drawers win, others draw; if early losses, hesitation. **Leverage this:** Show how outcomes feel interdependent despite logic.  

  ### **Why It Works**  
  - **Self-constructed reasoning:** Rules force private written steps (no lectures).  
  - **Emotive experience:** Mirror reveals prediction flaws; lottery empties create tangible asymmetry.  
  - **Social tension:** Platonia’s mutual-B hope vs. risk-aversion mirrors real-life coordination failures.  

  This design ensures participants *feel* the symmetry pull and collapse, with social dynamics amplifying the lesson. The coffee incentive adds stakes without financial bias.
