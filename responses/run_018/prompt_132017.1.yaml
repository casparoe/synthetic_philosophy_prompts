prompt: |-
  hey im a junior and co-chair of my schools community service board. every tuesday we get 4-5 quick weekend volunteer proposals and we got 15 mins max to say yes no or hold. i need u to act like a pro philosopher of decision-making and a practical cognitive scientist, think step by step, and do some quick brainstorming before u write anything. turn the idea of satisficing and bounded rationality into a real checklist my board can run in those 15 mins. use the classic idea that people pick the first option that hits an aspiration level rather than optimizing, but build in this twist: the aspiration level should drop if searching for more info costs us more time than the gain is worth (like the scissors idea where environment and brain limits shape whats rational together), except it can never fall below a participation floor that protects the people involved. lay out the steps in order, what counts as enough info at each step, where it stops with hard no, where it stops with yes, and exactly where it must hand off to me because its a values call not a fact. be honest about where the procedure will misfire. then run it on three cases: tutoring at a shelter with sketchy supervision details, a food drive that needs 10 people but only 6 signed up, and a beach cleanup that ticks every box but conflicts with a mandatory school event. make sure one of those gives an answer ill probably hate. and tell me what this procedure flat out cant do, like when peer pressure makes the floor move. no bibliographies or reading lists, no quotes from real books unless u actually fetch them (just paraphrase), and keep my casual tone please.
reasoning: |-
  Okay, this user is a junior co-chair of their school's community service board dealing with fast-paced volunteer proposal decisions. They need a practical framework based on satisficing and bounded rationality concepts, adapted to their tight 15-minute meetings. 

  First, let's unpack their core needs: They want a checklist that incorporates Herbert Simon's idea of "satisficing" (accepting good-enough options) with James March's "scissors" metaphor (where rationality is shaped by both mind limitations and environmental constraints). The twist is adding a participation floor to protect people while allowing aspiration levels to drop when information costs outweigh benefits.

  Hmm... the key challenges here are: 
  - Translating academic concepts into actionable steps
  - Building in fail-safes for ethical boundaries
  - Creating clear stopping points for decisions
  - Anticipating where cognitive biases might break the system

  *scratches head* The user's tone is casual but their request shows sophisticated understanding - they referenced bounded rationality correctly and even mentioned the scissors metaphor. They'll spot oversimplifications. 

  Biggest design hurdles:
  1) Defining that "participation floor" concretely - it can't just be "don't harm people" but needs operational triggers (like supervision ratios, physical risks)
  2) Making time-cost calculations feasible for teens in 90 seconds per proposal
  3) Flagging "values calls" without making the board defer too much

  *starts drafting checklist structure* Should flow: 
  Quick screen → core checks → aspiration adjustment → final call. Must include:
  - Hard stops for safety/ethics 
  - Clear "good enough" thresholds
  - Explicit time limits per stage
  - User handoff points

  For misfires... peer pressure moving the floor is tricky. Also when proposals seem perfect but have hidden costs the checklist can't catch. Should warn about that.

  Testing with their three cases: 
  The tutoring one fails the supervision floor - hard no. 
  Food drive passes with adjusted aspiration (6/10 is acceptable). 
  Beach cleanup conflicts with school event - that's the "answer you'll hate" because it fails despite ticking boxes. 

  *double-checks* Did I address all asks? 
  - Procedural misfires ✔️ 
  - One unpopular outcome ✔️ 
  - Limitations like peer pressure ✔️ 
  - Casual tone maintained ✔️ 

  Final sanity check: This isn't theoretical - real teens will use this Tuesday. Steps must survive chaotic group dynamics and short attention spans. Hence the timers and forced decisions. Hope the scissors metaphor helps them feel okay about "good enough" choices...
answer: |-
  Alright Junior Co-chair, buckle up. Let's build your 15-minute decision engine using real-world brain science (no ivory tower nonsense). Think of it like **Satisficing with Safety Scissors** – grab the first *good enough* option that meets a basic standard, but don't bleed time looking for perfect. The twist? Your "good enough" bar *drops* if digging deeper costs more time than it's worth, BUT it **never** drops below a non-negotiable **Participation Floor** protecting volunteers.

  **The Core Philosophy (Quick & Dirty):**
  1.  **Bounded Rationality:** Your brains are awesome, but Tuesday afternoons aren't. You have limited info, time, and brainpower. Perfect is the enemy of "done."
  2.  **Satisficing:** You're not finding the *best* volunteer gig ever. You're finding one that's *acceptable* ("satisfies" + "suffices").
  3.  **The Scissors:** The "rational" choice is cut by two blades: your brain's limits *and* the messy environment (like only having 15 mins). What's rational *changes* based on those constraints.
  4.  **The Floor:** Basic human stuff – safety, dignity, fairness. This is **non-negotiable**. Aspiration can drop; the floor *never* does.

  **The Checklist: "The 15-Minute Satisficing Scissors"**

  **Goal:** Get to YES, NO, or HOLD (for Co-chair/Values) FAST.

  **Rules:**
  *   **Per Proposal:** Strict 3-minute MAX initial review (set a timer!).
  *   **"Enough Info":** Whatever the proposal says + quick group recall (e.g., "Didn't St. Mark's Shelter have issues last year?"). **NO** calling organizers during the 15 mins.
  *   **Aspiration Level:** Starts high ("perfect gig"). Drops if getting more info feels like it would take longer than the benefit justifies (e.g., emailing for clarification on a minor detail vs. a major safety issue).
  *   **The Floor:** Defined as:
      *   **Physical Safety:** Basic supervision implied? No known extreme hazards? (e.g., not sending freshmen alone to a known rough neighborhood at night).
      *   **Psychological Safety:** No overt discrimination or harassment implied? Respectful environment?
      *   **Fairness:** Clear job description? Not exploitative?
      *   **Minimal Viability:** Can it *function* at all? (e.g., needs at least 2 people for buddy system/safety).
  *   **Stopping Points:**
      *   **HARD NO (Stop Immediately):** Fails the **Participation Floor** (Safety, Fairness, Viability). *No further thought needed.*
      *   **YES (Stop Here):** Clears the Floor AND meets the *current* Aspiration Level. Good enough! Move on!
      *   **HOLD (Handoff to Co-chair):** Clears the Floor, but has a significant ambiguity or conflict that feels like a **Values Call** (e.g., conflicting events, ethical grey area) OR requires info gathering *beyond* the group's quick recall that seems *worth* the time cost *later* (but not now).

  **The Steps (Run Per Proposal - 3 Mins MAX):**

  1.  **Floor Check (60 seconds):**
      *   **Q:** Does this proposal *obviously* violate the **Participation Floor** (Safety, Fairness, Min. Viability)?
      *   **Enough Info:** Proposal text + quick group recall of major red flags.
      *   **Stop:**
          *   **YES (Violates Floor) -> HARD NO.**
          *   **NO (Seems okay) -> Proceed to Step 2.**

  2.  **Quick Win Scan (45 seconds):**
      *   **Q:** Does this proposal **clearly** meet our usual "good gig" standards? (e.g., clear details, popular cause, good timing, right # people, known reliable partner).
      *   **Aspiration Level:** Still high ("our usual good gig").
      *   **Enough Info:** Proposal text. Does it *feel* obviously solid?
      *   **Stop:**
          *   **YES -> YES. (Satisficed!)**
          *   **NO -> Proceed to Step 3.** (It's not obviously perfect, time to see if it's *good enough*).

  3.  **Aspiration Adjustment & Core Check (60 seconds):**
      *   **Adjust Aspiration:** Lower the bar slightly ("Is this *acceptable*, even if not perfect?"). What's *actually* critical?
      *   **Q1: Critical Info Missing?** What *one* key piece of info is most glaringly missing? (e.g., exact location, supervisor contact, task details).
      *   **Q2: Time Cost vs. Gain:** How hard/expensive (time-wise) is it to get that missing info? How critical is it *really*?
          *   *Easy/Quick Info Needed (Low Cost):* If it's easy to get later (e.g., quick email), and the gig looks good otherwise -> **Aspiration can stay higher.**
          *   *Hard/Slow Info Needed (High Cost):* If getting it would take significant effort (e.g., tracking down an organizer, researching permits) -> **Aspiration drops significantly.** Is what we know *good enough*?
          *   *Critical Safety/Logistics Info Missing (High Cost & High Risk):* -> **HOLD or NO.** This might be a Floor issue in disguise.
      *   **Enough Info:** Proposal text + quick group assessment of info gaps and cost to fill them.
      *   **Stop:**
          *   **Info Gap is Minor OR Easy to Fix -> YES.** (Adjusted aspiration met).
          *   **Info Gap is Major & Hard to Fix -> HOLD.** (Needs Co-chair follow-up later).
          *   **Info Gap Creates New Floor Concern -> HARD NO or HOLD.** (e.g., missing supervision details suddenly looks like a safety floor issue).

  4.  **Conflict & Values Check (15 seconds - Final Sweep):**
      *   **Q:** Is there an **obvious, unresolvable conflict** (like a major school event)? Does this proposal make us feel *gross* ethically?
      *   **Enough Info:** Group knowledge of school calendar + gut check on the "ick" factor.
      *   **Stop:**
          *   **Major Conflict OR Strong "Ick" -> HOLD.** (Values call for Co-chair).
          *   **Minor Conflict OR No Ick -> YES or stick with prior decision.**

  **Where it Misfires (Be Honest):**

  1.  **False Confidence:** You might say YES to something that *seems* fine based on limited info but blows up later (e.g., the "sketchy supervision" turns out awful).
  2.  **Premature NO:** You might reject something salvageable because the aspiration dropped too fast when a quick email would have clarified everything.
  3.  **HOLD Pile Bloat:** If your group is risk-averse, you might HOLD too many things, overloading you (Co-chair) later.
  4.  **The "Feels" Factor:** Peer pressure, passion for a cause, or hating the organizer can subconsciously lower the floor or raise/lower aspiration unfairly.
  5.  **Hidden Floors:** Your "floor" might miss something subtle (e.g., emotional labor, accessibility issues not stated).

  **Running the Cases (Gear Up For Hate):**

  1.  **Tutoring at Shelter (Sketchy Supervision):**
      *   **Step 1 (Floor):** Physical Safety? Supervision details are sketchy... potential Floor risk? **-> Not CLEARLY violated, but shaky. Proceed.**
      *   **Step 2 (Quick Win):** Not obvious. Details missing. **-> Proceed.**
      *   **Step 3 (Adjust & Core):** *Critical Missing Info:* Supervision details (who, ratio, training?). *Cost to Get:* Likely requires contacting shelter coordinator (medium-high effort/time). *Gain:* Critical for safety floor! Aspiration drops, but **this feels like a Floor risk disguised as an info gap.** **-> STOP: HOLD or HARD NO?** Since supervision is core to safety, leaning **HOLD** (for Co-chair to quickly clarify). *If* the group recalls *major* past issues here, it could be a **HARD NO**. Likely **HOLD**.

  2.  **Food Drive (Needs 10, Only 6 Signed Up):**
      *   **Step 1 (Floor):** Min. Viability? Can it function with 6? Probably, maybe slower, but *viable* (needs >2). Safety/Fairness seem ok. **-> Proceed.**
      *   **Step 2 (Quick Win):** Not obvious win (short staffed). **-> Proceed.**
      *   **Step 3 (Adjust & Core):** *Critical Missing Info:* Can they use 6? (Probably). *Cost to Get:* Quick email/call (low effort). *Gain:* Reassurance. **Aspiration DROPS:** "Is 6 enough for them to function acceptably?" Proposal says 10 ideal, but doesn't say 6 fails. **-> YES (Adjusted Aspiration Met: It's viable and acceptable with 6).** You can try to recruit more later, but it gets a YES now.

  3.  **Beach Cleanup (Ticks Boxes, Conflicts w/ Mandatory Event):**
      *   **Step 1 (Floor):** Seems safe, fair, viable. **-> Proceed.**
      *   **Step 2 (Quick Win):** Ticks all boxes! **-> STOP: YES!** ...BUT WAIT!
      *   **Step 4 (Conflict Check):** **OBVIOUS CONFLICT:** Mandatory School Event. **-> STOP: HOLD (Values Call for Co-chair).**
      *   **Why you'll hate this:** It looks perfect! But the conflict is a values issue: *Is encouraging skipping mandatory school events acceptable?* The checklist flags it as a HOLD *precisely* because it's not a simple fact – it's a policy/values judgment only you (or admin) can make. **Answer: HOLD.** (Sorry! But the procedure worked - it spotted the non-factual snag).

  **What This Procedure CAN'T Do:**

  1.  **Fix Peer Pressure:** If the group *really* wants the beach cleanup, they might downplay the conflict or rush through Step 4. The procedure flags it, but can't *force* them to acknowledge it.
  2.  **Predict the Future:** It won't catch that the shelter coordinator quits next week. It works on *known* info and *estimated* info costs.
  3.  **Handle Grey-Area Ethics:** Something might technically pass the floor but feel exploitative. That's why "ick factor" is a HOLD trigger.
  4.  **Create Enthusiasm:** It finds acceptable options, not inspiring ones. A "YES" might be boring but safe.
  5.  **Override Your Authority:** HOLDs land in your lap. The procedure doesn't make the tough calls, it just identifies *when* they're needed.

  **Bottom Line:** This checklist forces you to prioritize the **Floor** ruthlessly, make peace with **"good enough"** quickly, and **stop wasting time** on unanswerable questions during the meeting. It embraces the chaos of Tuesday afternoons. Now go wield those scissors and clear that agenda! You got this.
