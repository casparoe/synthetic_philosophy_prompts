prompt: |-
  I'm working on a novel where the protagonist slowly realizes that every goal he chases is kind of arbitrary, and I dont want to just copy some classic existentialist plot. I'm a novelist—pretty fluent in narrative craft, plot arcs, diegetic consistency, reader contracts, dramatic irony, character motivation, and how world-building creates expectation—but I'm not a professional philosopher, so I need you to act as an expert in philosophy of literature and think step by step. Maybe start with a quick brainstorm of the key moves you'll need before you dive in.

  Please restate both absurdism—Camus's clash between human need for meaning and an indifferent universe—and one major contemporary account of meaning in life (like the hybrid objective/subjective view, or the naturalist fulfillment model) entirely in my vocabulary: narrative coherence, authorial intent, the contract between reader and text, plot resolution, dramatic irony, diegetic world-building, character agency, etc. Translate both positions as faithfully as you can, using only craft terms, then give me the residue report: what survives cleanly, what has to be distorted to fit, and what has absolutely no counterpart in fiction. Specifically, is the "silent universe" just a world with no authorial intent behind it? Is subjective fulfillment just a character deciding the plot matters to them regardless of the world's design? And tell me whether the leftover pieces—the ones that wont translate—mean my novelist framework is missing something real about human experience, or if the philosophers are describing things that don't actually hold up outside abstract argument. I need this to stand on its own without citations or a reading list, since I cant look anything up right now, and I especially want to know if my intuition that "absurdity is basically a broken narrative contract between protagonist and world" is capturing something genuine or missing the point entirely.
