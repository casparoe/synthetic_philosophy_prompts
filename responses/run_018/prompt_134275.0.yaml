  I'll structure my essay to first outline the positions, analyze ghost testimony's implications, argue that anti-reductionism collapses, and address how this changes our view of normal testimony. I'll take a clear stance that ghost testimony forces anti-reductionism into reductionism because it removes the necessary speaker element that gives testimony its distinctive epistemic character.
