  For reductionists, this fits naturally into their framework. They would treat ghost testimony as simply another information pipeline - perhaps more complex, but fundamentally no different from reading a book or database. The listener might mistakenly believe they're engaging in testimony, but epistemically, it's just information transmission.

  Anti-reductionists face a tougher challenge. If they insist on the necessity of an actual speaker with responsibility, ghost testimony shouldn't qualify as testimony at all. But if they stretch the concept of "speaker" to include synthetic sources, they risk losing what makes testimony special - the interpersonal responsibility and normative commitments.

