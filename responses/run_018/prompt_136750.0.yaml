prompt: |-
  I'm taking a grad seminar on metaethics and we've been stuck on evolutionary debunking for like three weeks now — Joyce, Street, and Ruse on one side saying our moral beliefs are shaped by selection for cooperation rather than truth-tracking, and then Enoch and Huemer on the other with correlation arguments and third-factor replies — and honestly it feels like we're replaying the same moves without anyone budging. The debunkers claim evolutionary genealogy undermines justification; the realists say either that causation doesn't touch epistemic status or that moral facts partly explain why cooperation evolved. We all know these lines cold. But here's what's bugging me: both sides seem to assume moral cognition has a fixed evolutionary architechture, and nobody talks about moral phenotypic plasticity — the idea that the same genotype produces radically different normative outputs depending on enviroments and social structure. If plasticity is high, then evolutionary genealogy doesn't fix belief content in the way debunkers need, but it also doesn't automatically rescue realism because the plasticity itself might be directionless. So my working hypothesis is that the stall isn't about missing knockout arguments; it's that we're running three debates under one heading — one about causal genealogy, one about explanatory indispensability, and one hidden layer about whether moral cognition is developmentally rigid or plastic — and the sides talk past each other on that third layer without admitting it. Can you diagnose whether that's right? I want a committed answer in American English: tell me which layer is actually doing the work, whether plasticity breaks the debunker or just muddies the water, and what kind of result — empirical, conceptual, or formal — would genuinely move the needle if your diagnosis holds. Don't just lay out options; take a definite position and defend it.
