prompt: |-
  I'm a software engineer building trust-and-safety infrastructure for a federated social platform, and I've been trying to formalize how we should apply social sanctions—deplatforming, visibility throttling, or public censure—without simply copying generic "community guidelines" playbooks. After reading some philosophy on punishment and collective belief formation, I've sketched a framework I'm calling the principle of recursive justification with non-transitive blame: any sanction applied to a user must include a justification that is itself open to sanction if false or misleading; moral culpability or reputational taint must not propagate to associates, followers, or past group memberships unless those parties actively endorsed the specific violation; and the severity of the sanction must scale with the community's demonstrable epistemic confidence in the claim of violation, not with the emotional intensity of responses or the raw volume of reports.

  Please turn this into a concrete, reusable decision procedure that my moderation team—who have no formal philosophy background—can actually run in under fifteen minutes per case. Specify the ordered questions to ask, the pass/fail or threshold conditions that must be satisfied for a sanction to proceed, the explicit stop-points where the procedure returns "no sanction," and the exact junctures where judgment cannot be eliminated and must be escalated to a human decision-maker. Flag the categories of case the procedure cannot settle, and be explicit about where it will misfire or produce a recommendation that conflicts with standard platform practice. Then apply the procedure to three scenarios: (a) a prominent user publishes a false empirical claim that causes measurable real-world harm; (b) a user expresses an unpopular but carefully argued philosophical view that triggers mass reporting and advertiser pressure; and (c) a user's past membership in a discredited group is uncovered, though the user has since made a specific, public disavowal of that membership. Ensure that at least one application yields a result a typical platform operator would likely resist, and identify precisely where the procedure forces a value judgment that cannot be automated away. Keep the deliverable fully self-contained—no bibliographies, no citation requests, no reliance on obscure named theories, and nothing that requires web access to evaluate.
reasoning: |-
  We are creating a decision procedure called "Principle of Recursive Justification with Non-Transitive Blame" (PRJ-NTB). It has three core principles:

  1. **Recursive Justification**: Any sanction must include a justification that is itself open to sanction if false or misleading.
  2. **Non-Transitive Blame**: Blame does not propagate to associates, followers, or past group memberships unless they actively endorsed the specific violation.
  3. **Epistemic Scaling**: The severity of the sanction must scale with the community's demonstrable epistemic confidence in the claim of violation, not with emotional intensity or raw volume of reports.

  We'll break this down into a step-by-step procedure that moderation teams can run in under 15 minutes per case. The procedure will have a flowchart-like structure with ordered questions, conditions, stop points, and escalation points.

  ---

  **PRJ-NTB Moderation Decision Procedure**

  **Step 1: Establish the Alleged Violation**
  - Ask: "What specific rule or norm is the user alleged to have violated? (State exactly.)"
    - If no specific rule/norm is identified → **Stop: No sanction**.
    - If the rule/norm is vague (e.g., "hate speech" without a platform-specific definition) → **Escalate to human** for rule clarification.
  - Ask: "Is this rule publicly documented and consistently applied in past cases?"
    - If no → **Stop: No sanction** (cannot apply retroactively or arbitrarily). Instead, document for rule development.

  **Step 2: Assess Epistemic Confidence**
  - Ask: "What direct evidence exists that the violation occurred? (e.g., the content itself, clear context, verifiable facts)"
    - Evidence types:
      - **Direct & Verifiable** (e.g., the user's post contains the violating content; a false claim that is fact-checked with primary sources) → High confidence.
      - **Indirect or Interpretive** (e.g., intent to harass inferred from tone; harm claimed but not objectively measured) → Medium confidence.
      - **Hearsay or Unverified Reports** (e.g., "many users said it's bad"; emotional reactions without evidence) → Low confidence.
  - Ask: "Is the evidence sufficient to meet the platform's standard of proof for this rule? (e.g., 'clear and convincing' for major sanctions)"
    - If no → **Stop: No sanction**.
  - Ask: "Does the evidence rely on the user's associations, followers, or past group memberships without proof of active endorsement of *this specific violation*?"
    - If yes → **Stop: No sanction** for those associations (per non-transitivity). Only consider the user's own actions.
  - **Confidence Level Assignment**:
    - **High**: Direct evidence, no ambiguity (e.g., posted content violates rule unambiguously).
    - **Medium**: Evidence requires some interpretation but is reasonable (e.g., context suggests violation).
    - **Low**: Evidence is weak, conflicting, or based on non-specific associations.
  - If confidence is **Low** → **Stop: No sanction**.

  **Step 3: Draft Recursive Justification**
  - Ask: "Write a concise justification for the sanction that:
    - Cites the specific rule violated.
    - Points to the evidence (without revealing private data).
    - Is written in plain language any user could challenge if false."
  - Ask: "Is this justification falsifiable? (Could someone prove it wrong with evidence?)"
    - If no → **Escalate to human** to redraft (justifications must be testable).
  - Ask: "Does the justification avoid blaming associates/followers/groups without proof of active endorsement of *this specific act*?"
    - If no → Revise justification to remove transitive blame → **Reassess**.
  - **Outcome**: This justification becomes part of the sanction notice.

  **Step 4: Determine Sanction Severity**
  - **Severity Matrix**:
    - **High Confidence** → Full sanctions allowed (e.g., deplatforming for severe violations).
    - **Medium Confidence** → Intermediate sanctions (e.g., visibility throttling, warning).
    - **Low Confidence** → **Stop: No sanction** (already stopped at Step 2).
  - Ask: "Does the proposed sanction scale with confidence (e.g., not harsher because of high report volume or advertiser pressure)?"
    - If no → Adjust sanction downward to match confidence level → **Reassess**.
  - **Never Allowed**: Sanctions based on volume of reports, emotional intensity, or association blame.

  **Step 5: Final Checks**
  - Ask: "Has this user been sanctioned for the same justification before and had it overturned as false?"
    - If yes → **Escalate to human** (possible systemic issue).
  - Ask: "Does this case involve protected characteristics (e.g., whistleblowing, minority views) that might require higher scrutiny?"
    - If yes → **Escalate to human** for bias review.
  - **Output**: Sanction decision (type and severity) with the finalized justification.

  ---

  **Procedure Summary**:
  - **Stop Points**: No specific rule (Step 1); insufficient evidence (Step 2); low confidence (Step 2); no active endorsement for associates (Step 2).
  - **Escalation Points**: Vague rules (Step 1); unfalsifiable justification (Step 3); overturned past justification (Step 5); protected characteristics (Step 5).
  - **Unsettleable Cases**: 
    - Cases requiring nuanced intent interpretation (e.g., satire vs. hate speech).
    - Cases where evidence is entirely circumstantial but compelling (e.g., coordinated harm).
    - Cultural context disputes (e.g., local norms vs. global rules).
  - **Misfires**:
    - May under-punish viral misinformation that causes harm but lacks "direct" evidence (e.g., coded language).
    - May over-protect associates in tightly knit hate groups where endorsement is implicit but not explicit.
    - Conflicts with standard practice by ignoring report volume/advertiser pressure and refusing association blame.

  ---

  **Application to Scenarios**

  **Scenario A: Prominent user publishes a false empirical claim that causes measurable real-world harm.**
  - Step 1: Specific rule? E.g., "No spreading verifiably false information that incites real-world harm." → Proceed.
  - Step 2: Evidence? The claim is false (verified by authoritative sources); harm is measurable (e.g., hospital data). → High confidence. No association blame involved (only user's own post). → Proceed.
  - Step 3: Justification: "You posted [claim], which has been debunked by [sources]. This led to [harm], violating Rule X." → Falsifiable (if claim wasn't made or isn't false). → Proceed.
  - Step 4: High confidence → Severe sanction allowed (e.g., deplatforming).
  - Step 5: No red flags → **Sanction: Deplatforming with the above justification**.

  **Scenario B: User expresses an unpopular but carefully argued philosophical view that triggers mass reporting and advertiser pressure.**
  - Step 1: Specific rule? Unless the view violates a rule (e.g., hate speech), none. Assume it's merely unpopular. → **Stop: No sanction** (no rule broken). 
    - *Note: If the view does violate a rule (e.g., "No advocating violence"), proceed. But here, it's philosophical and non-violent.*
  - **Result: No sanction**.
  - *Conflicts with standard practice*: Platforms often cave to advertiser pressure. This procedure ignores reports/pressure (epistemic scaling).

  **Scenario C: User's past membership in a discredited group is uncovered, but the user has since made a specific, public disavowal of that membership.**
  - Step 1: Specific rule? E.g., "No current membership in violent groups." → Past membership isn't prohibited if disavowed. → **Stop: No sanction** (unless the rule covers past membership, but non-transitivity applies).
  - Step 2: Even if a rule exists, evidence of "active endorsement of a specific violation" by the user? The disavowal shows no current endorsement. Past membership ≠ endorsement of specific acts. → **Stop: No sanction**.
  - **Result: No sanction**.
  - *Value judgment*: The procedure forces a clear line: blame requires active endorsement. A human might still want to sanction due to distrust, but the procedure blocks this.

  ---

  **Controversial Outcome**: 
  - **Scenario B** yields "no sanction" despite mass reporting and advertiser pressure. This conflicts with typical platform responses. The **value judgment that cannot be automated** is in Step 1: determining whether the philosophical view *actually* violates a rule (e.g., is it "hate speech" under the platform's definition?). This requires human interpretation of context and intent, which we escalate if ambiguous.

  The procedure is self-contained and uses only the principles provided.
answer: |-
  ### PRJ-NTB Moderation Decision Procedure  
  **Core Principles Embedded:**  
  1. **Recursive Justification (RJ):** Sanctions require a falsifiable justification. If the justification is proven false/misleading, the sanctioning party faces consequences.  
  2. **Non-Transitive Blame (NTB):** Blame stops at the violator. Associates/followers/past groups are immune unless they **actively endorsed the specific violation**.  
  3. **Epistemic Scaling (ES):** Sanction severity scales with evidence quality, **ignoring report volume, emotional intensity, or external pressure**.  

  **Ordered Steps (Run in Sequence; Target: <15 mins/case):**  
  ---  
  #### **STEP 1: VIOLATION IDENTIFICATION**  
  - **Question 1:** "What specific, platform-rule violation occurred? (State exact rule and offending content.)"  
  - **Threshold:** Rule must be from the platform’s public list. Violation must be observable in the content (e.g., text, image).  
  - **Stop if:** No specific rule violated, or violation is inferred from context alone (e.g., "implied hate speech"). → **NO SANCTION**  
  - **Escalate if:** Rule interpretation is ambiguous (e.g., satire vs. harassment). → **Human arbitrator** rules.  

  #### **STEP 2: EVIDENCE ASSESSMENT (ES + NTB)**  
  - **Question 2:** "What direct evidence proves the violation? (e.g., primary sources, verifiable facts, user’s own words.)"  
    - *Ignore:* User’s followers, historical group memberships, or report volume.  
  - **Question 3:** "Did associates/followers **actively endorse the specific violation**? (e.g., shared it + added support, not just ‘liked’)."  
  - **Confidence Levels (Assign one):**  
    - **High:** Direct evidence (e.g., user’s post violates rule unambiguously).  
    - **Medium:** Indirect evidence (e.g., credible testimony, but requires inference).  
    - **Low:** Hearsay, emotional reports, or guilt-by-association.  
  - **Stop if:**  
    - Evidence confidence = **Low**. → **NO SANCTION**  
    - Blame attributed to non-endorsing associates (violates NTB). → **NO SANCTION** for associates.  
  - **Escalate if:** Evidence requires cultural/contextual expertise (e.g., regional slang). → **Human arbitrator** verifies.  

  #### **STEP 3: JUSTIFICATION DRAFTING (RJ)**  
  - **Question 4:** "Draft a public justification that:  
    (a) Cites the exact rule violated,  
    (b) Quotes/locates the violating content,  
    (c) Is concise (<3 sentences)."  
  - **Threshold:** Justification must be **falsifiable** (e.g., "User posted [quote] violating Rule 4.1" is falsifiable; "User is toxic" is not).  
  - **Stop if:** Justification cannot be made falsifiable. → **NO SANCTION**  
  - **Escalate if:** Justification involves sensitive user data (e.g., real name leak). → **Human arbitrator** redacts.  

  #### **STEP 4: SANCTION SEVERITY (ES)**  
  - **Question 5:** "Select sanction matching evidence confidence:  
    - **High:** Deplatforming (ban) or public censure.  
    - **Medium:** Visibility throttling (e.g., demote in feeds).  
    - **Low:** *Not applicable (stopped earlier).*"  
  - **Threshold:** Severity **must ignore**:  
    - Report volume, advertiser complaints, or off-platform consequences.  
    - User’s prominence or past violations (unless identical repeat offense).  
  - **Stop if:** Proposed sanction relies on external pressure. → **Revert to ES-compliant sanction**.  
  - **Final Output:** Sanction type + published justification.  

  #### **STEP 5: RECURSIVE ACCOUNTABILITY (RJ)**  
  - **Automated Check:** The justification is logged in a public ledger.  
    - If users prove the justification false (e.g., via appeal with evidence), the moderator who approved it faces identical sanctions.  

  ---  
  ### **PROCEDURE LIMITATIONS**  
  - **Cannot Settle:**  
    - Cases requiring intent interpretation (e.g., "Was this misinformation deliberate?").  
    - "Victimless" violations (e.g., private consensual chats leaked out of context).  
    - Rapidly evolving crises (e.g., live violence; procedure too slow).  
  - **Misfires:**  
    - Under-punishes viral misinformation with weak direct evidence (e.g., memes with coded hate).  
    - Over-protects followers in hierarchical hate groups (endorsement is often implicit).  
    - Conflicts with platforms that prioritize advertiser comfort or "community sentiment."  

  ---  
  ### **APPLICATION TO SCENARIOS**  
  #### **Scenario A: Prominent user publishes false empirical claim causing real-world harm.**  
  - **Step 1:** Rule violated: "No demonstrably false claims inciting harm." Violation: User’s post claims "Vaccines cause fatal seizures" amid an outbreak. → Proceed.  
  - **Step 2:** Evidence: Medical studies debunk claim; hospital data shows harm. Confidence: **High**. No associates endorsed. → Proceed.  
  - **Step 3:** Justification: "User posted [exact quote] violating Rule 7.3. Claim is falsified by [study link]." → Falsifiable.  
  - **Step 4:** Confidence = High → **Sanction: Deplatforming + public censure.**  
  - **Result:** Sanction applied. *Typical platforms might throttle instead to retain high-profile users—conflict arises from ignoring user prominence.*  

  #### **Scenario B: User expresses unpopular philosophical view, mass-reported amid advertiser pressure.**  
  - **Step 1:** Rule violated? Assume view is "Democracy is incompatible with human nature," argued civilly. No hate speech or threats. → **Stop: NO SANCTION** (no rule broken).  
  - **Why?** Procedure ignores reports/advertisers (ES). *Typical platforms often cave to pressure—major conflict here.*  
  - **Value Judgment:** Step 1 requires human arbitration if "civilly argued" is disputed (e.g., is it dog-whistling?). **Cannot be automated.**  

  #### **Scenario C: User’s past membership in discredited group, now disavowed.**  
  - **Step 1:** Rule violated? Unless membership itself breaks rules (e.g., "No neo-Nazi members"), none. → **Stop: NO SANCTION**.  
  - **Step 2 (if rule exists):** Evidence: Past membership logs. But user disavowed group + no endorsement of specific violations. → NTB blocks blame. Confidence: **Low** for violation. → **Stop: NO SANCTION**.  
  - **Result:** No action. *Typical platforms often restrict "tainted" users preemptively.*  

  ---  
  ### **KEY AUTOMATION GAPS**  
  Human arbitration is **required** at:  
  1. Step 1 (rule ambiguity),  
  2. Step 2 (evidence confidence for indirect/cultural context),  
  3. Step 3 (justification sensitivity).  
  **Value judgments are unavoidable** when:  
  - Defining "active endorsement" (e.g., is a meme share endorsement?).  
  - Balancing free speech vs. harm in philosophical disputes (Scenario B).  
  - The procedure **explicitly rejects** industry norms that prioritize business interests over epistemic rigor.
