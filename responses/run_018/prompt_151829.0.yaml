  ### Structured Activity: Cosmic Census Coordination

  #### Psychological Dynamics of Reference-Class Shifts in Groups
  In group settings, reference-class ambiguity triggers three key dynamics:
  1. **Anchoring & Pluralistic Ignorance**: Participants initially anchor on egocentric reference classes (e.g., "humans like me") but assume others have better information, leading to coordination on a default class (usually the largest) to avoid conflict.
  2. **Information Cascades**: Early bets or revelations create momentum. If high-stakes bets favor one class, rationalists may override private doubts to "follow the math," ironically reinforcing groupthink.
  3. **Class-Shift Resistance**: When partial data leaks, participants cling to initial classes to avoid cognitive dissonance. Those who switch face social penalties (e.g., "you're overcomplicating"), while resisters bear betting losses—simulating real-world costs of rejecting anthropic reasoning.

  The activity exploits these by forcing a tension: **treating yourself as drawn from the largest class ("all observers") pushes toward catastrophic predictions (imminent "doom" via low growth), while a restricted class ("humans") enables optimistic outcomes, but only if the group consistently applies it.**

  ---

  ### Activity Design: Cosmic Census Game

  **Materials**  
  - **14 sealed envelopes**, each containing a "cosmic census card" with:  
    - A **hidden reference class**: *Biological Humans* (total pop. 200), *Digital Observers* (total pop. 1,000), or *Simulated Instances* (total pop. 100).  
    - A **hidden birth rank** (unique integer within the class, e.g., "Digital Observer #427").  
  - **Tokens**: 30 poker chips/participant (worth coffee/prizes).  
  - **Betting sheets** for rounds 2–3.  
  - Whiteboard to display aggregate bets.  

  **Class Distribution**  
  - Biological Humans: 7 participants (ranks 1–200)  
  - Digital Observers: 5 participants (ranks 1–1,000)  
  - Simulated Instances: 2 participants (ranks 1–100)  
  *Total populations are fixed but unknown to participants. Ranks are uniformly distributed within classes.*

  **Setup**  
  - Distribute envelopes randomly.  
  - Explain: *"You’ve been assigned an identity in a cosmic census. Your card shows your birth order within a population, but not which population or its size. Bet tokens on population outcomes—win more, trade smarter."*  
  - **Stakes**: Tokens redeemable post-game (e.g., 10 tokens = coffee).  

  ---

  ### Rules and Timeline (90 min total)

  **Round 1: Baseline Coordination** (15 min)  
  - **Goal**: Predict Earth’s population growth by 2100 ("Low" = <5B, "High" = >10B).  
  - **Rules**:  
    1. Do **not** open envelopes.  
    2. As a group, bet 5 tokens collectively on *Low* or *High* growth.  
    3. Majority vote decides; ties broken by facilitator.  
  - **Manipulation**:  
    - Groups typically anchors on "human" class by default, favoring *High* growth (optimism bias).  
    - **Payoff**: Correct bet → +5 tokens/player. Incorrect → 0.  

  **Round 2: Self-Locating Bets** (20 min)  
  - **Goal**: Bet on your *own* class size ("Small" = 100–500, "Large" = 500–1,000).  
  - **Rules**:  
    1. Open envelopes. See your rank and class *but not class size*.  
    2. Individually bet 0–10 tokens on *Small* or *Large* class size.  
    3. Trade tokens with others (1:1) to hedge risks.  
  - **Payoff**:  
    - Correct bet: 2x tokens bet.  
    - Incorrect: Lose tokens bet.  
  - **Manipulation**:  
    - High-rank players (e.g., Simulated #90) resist betting "Small" (feels "doomy"), while low-rank (e.g., Digital #12) avoid "Large" (seems unlikely).  
    - Trading rewards those who infer classes from ranks (e.g., "I’m #10—must be Human or Simulated").  

  **Round 3: Leaked Consensus** (20 min)  
  - **Goal**: Revise Earth growth prediction (same options: Low/High).  
  - **Rules**:  
    1. Facilitator leaks: *"All Biological Humans stand."* (7 stand).  
    2. Group debates and places a final collective bet (5 tokens/player).  
    3. Bets must be unanimous; else, tokens forfeited.  
  - **Payoff**: Correct → +5 tokens/player. Incorrect → 0.  
  - **Manipulation**:  
    - Leak reveals class distribution, forcing reference-class shift.  
    - Groups must reconcile "human" dominance (7/14) with individual ranks to avoid forfeit.  

  ---

  ### Debrief (35 min)
  **Map to Doomsday Argument Logic**  
  | **Round** | **Anthropic Principle Step**                          | **Where Resistance Occurs**                          | **Cost of Resistance**                              |  
  |-----------|-------------------------------------------------------|-------------------------------------------------------|-----------------------------------------------------|  
  | 1         | Prior belief: Default to largest class (all observers). | Voting: Choosing "High growth" ignores baseline rates. | Tokens lost if growth is low; reinforces optimism trap. |  
  | 2         | Self-locating likelihood: "My rank is random in my class." | Betting: High-rank players reject "Small class" (denies doom implication). | Lost tokens + missed trades (e.g., not selling to "Digital" players). |  
  | 3         | Reference-class shift: Conditioning on new information (leak). | Unanimity: Failing to agree by rejecting class evidence (e.g., "Humans can't dominate!"). | Entire bet forfeited—simulates coordination failure under uncertainty. |  

  **Critical Verbal Bridge**  
  - **Approximation Limitation**: The game equates "random sampling" with uniform token trades, but real observer-moment indifference requires verbal emphasis:  
    *"Your birth rank is unbiased only if you assume no selection effects. But in reality, existing to play this game *conditions* your reference class—just like being born in 2024 conditions your doomsday odds."*  
  - **Unreproducible Element**: The game cannot simulate **temporal duration** (e.g., humans existing across centuries). Must clarify: *"Ranks represent birth order, not time—so we approximate ‘doom’ with low growth, but real doomsday weighs total observer-moments."*  

  **Predicted Failures & Fixes**  
  - **Failure**: Round 2 trading deadlock (e.g., all hoard tokens).  
    **Fix**: Pre-game trading demo; incentivize with "bonus tokens for first 3 trades."  
  - **Failure**: Round 3 unanimity collapse (e.g., stubborn "Simulated" players).  
    **Fix**: Allow 2-minute subgroup negotiations before final vote.  
  - **Failure**: Misinterpreting ranks (e.g., "High rank = imminent doom").  
    **Fix**: Clarify pre-Round 2: *"Rank 1 is first-born; high numbers are later."*  

  **Outcome**  
  - **Catastrophic Path**: If groups default to largest class ("all observers"):  
    - Round 1: Bet "High growth" (optimistic).  
    - Round 2: Bet "Large class" for all (ignoring low-rank clues → losses).  
    - Round 3: Bet "High growth" despite leak (forfeits tokens if wrong).  
    → Mirrors doomsday denial: Extinction odds rise as evidence mounts.  
  - **Restricted-Class Path**: If groups shift to "Biological Humans":  
    - Round 2: Humans/Small-class players profit by betting "Small."  
    - Round 3: Unanimous "Low growth" bet (succeeds if Earth population declines).  
    → Shows how narrower classes avert "doom" but require coordination.  

  **Reveal & Payout**  
  - True class sizes: Humans=200, Digital=1,000, Simulated=100.  
  - True growth outcome: Facilitator chooses based on desired lesson (e.g., "Low" to challenge optimism).  
  - Payout tokens; discuss how cost-benefit stakes mirrored real resistance points.  

  This design forces groups to confront the doomsday argument’s core tension: **Treating yourself as a random observer *seems* rational but amplifies catastrophe odds, while narrower classes offer hope at the cost of anthropic consistency.** By embedding this in trades and bets, players *feel* the inferential weight before naming it.
