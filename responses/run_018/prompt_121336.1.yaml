  The key question here is whether this tension undermines Rousseau's critique or reveals that his concept of virtue depends on the very theatrical dynamics he rejects. I need to weigh both interpretations and reach a definite conclusion.

  Looking at Rousseau's position in the Letter to d'Alembert: he argues that theater replaces natural virtues with artificial passions, corrupts spectators by normalizing vice, and promotes harmful social comparison. His ideal is a society based on natural sentiments rather than performance.

  But then there's Rousseau's moral psychology, especially in works like Emile and the Discourse on Inequality. His concept of amour-propre (as opposed to amour de soi) involves comparing ourselves to others and performing for social approval - which is precisely what theater institutionalizes. This creates a fascinating contradiction.

