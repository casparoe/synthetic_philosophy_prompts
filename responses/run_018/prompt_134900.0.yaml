answer: |-
  Right, here's one that leans into the grim reality of cognitive overload and collapsing standards, with a proper nod to Simon:

  **Setting:** A university library at 2 AM. Three students stare blankly at a disastrous group project draft.

  **Student 1:** (Rubs eyes, voice hoarse) Right. Cognitive bandwidth's proper gone, mates. My brain feels like it's leaking out me ears. Remember when we said we'd "aim for excellence"?

  **Student 2:** (Stares into the middle distance, nibbling a stale crisp found in bag) Excellence? Blimey. At this point, ‘excellence’ feels like demanding a three-course meal when your kitchen’s just burnt down. We binned that aspiration level *hours* ago.

  **Student 3:** (Tapping the screen with a biro cap) Exactly. Initial aspiration: Distinction. Revised after the data meltdown: Pass. Revised again after Dave’s ‘contribution’: Just don't *fail*. Revised *again* ten minutes ago when I realised I’d forgotten my own name...

  **Student 1:** So... current satisficing benchmark? "Submission that doesn't actively get us expelled and *might* vaguely resemble the assignment title." That’s the acceptable outcome now, yeah? The bar is subterranean.

  **Student 2:** (Nods grimly) Precisely. We've hit peak bounded rationality. Can't *optimise*. Can barely *think*. So... **this absolute bin fire meets our aspiration level *because we just held a meeting where the sole procedural rationality was deciding how low we could set the aspiration level without weeping openly.** Achievement unlocked. Print it.

  **Student 3:** (Slams laptop shut) Brilliant. Pass me them dusty biscuits. We've procedurally rationalised our way to the bare minimum. Simon'd be chuffed. Or horrified. Dunno. Too tired.

  ---

  **Why it fits your brief:**

  1.  **Aspiration Level Descent:** Explicitly tracks the *downward adaptation* ("Distinction -> Pass -> Don't Fail -> Doesn't Get Us Expelled") driven purely by exhaustion/cognitive overload ("Cognitive bandwidth's proper gone," "brain leaking").
  2.  **Cognitive Load Maxed:** Central to the setup (2 AM, exhaustion, forgotten names, "peak bounded rationality").
  3.  **Procedural Rationality:** The punchline explicitly names their shambolic meeting *as* the "procedural rationality" – the process (however flawed) they used to determine the new, lower aspiration level/satisficing criteria. It's the *how* of deciding *what's good enough now*.
  4.  **Avoids Sandwich Trope:** Uses the group project hellscape instead.
  5.  **British & Casual/Messy:** "Proper gone," "mates," "bin fire," "Blimey," "subterranean," "dusty biscuits," "chuffed," "Dunno." Phrasing like "brain feels like it's leaking out me ears" and "demanding a three-course meal when your kitchen’s just burnt down" adds the messy, slightly desperate vibe.
  6.  **References Simon:** Directly name-checks "bounded rationality," "satisficing," "aspiration level," and crucially, "procedural rationality" as the core mechanism of the joke.
