answer: |-
  Subject: SOS: Need disjunctivist grilling questions for podcast!  

  Yo – panic prepping for this philosopher interview tomorrow. Her disjunctivism takes no prisoners: says a false hunger pang is **as mentally divorced** from real hunger as a hallucinated dagger is from seeing an actual blade. Claims docs should treat "interoceptive illusions" by fixing concepts, not sensations. Need questions that *force* her out of the trenches. Help me poke these holes properly:  

  1. **The Classic Ambush:**  
     "You famously reject the 'common kind' argument from illusion – but when someone has a perfectly convincing phantom limb sensation or false hunger pang, subjectively *identical* to the real deal, doesn't that *definately* force us to posit *something* shared in the experience itself? If not, what's being mistaken *for* what?"  
     *(When she inevitably says "It's just a failure of judgment/discrimination, not identical experiences!")*  
     → Follow-up: "But if the subject can't discriminate *even when scrutinizing carefully* – like under suggestion in a lab, or during aura before a seizure – how is that *not* evidence of matching experiential content? Doesn't judgment require *something* to judge?"  

  2. **Bodily Betrayal & Function:**  
     "Extending disjunctivism to interoception feels wilder than vision. False hunger signals often serve adaptive functions – like triggering eating *before* energy dips. If fake hunger is doing real biological work *identical* to true hunger's role, doesn't that drive a wedge between your 'distinct mental kinds' claim and functional role?"  
     *(When she insists function ≠ mental kind)*  
     → Follow-up: "Okay, if function doesn't define the mental kind here, what's your *independent criterion*? What makes two bodily feelings 'the same kind' mentally, if not what they *do* or how they *feel*?"  

  3. **The Confusion Conundrum:**  
     "If a false 'bent arm' feeling and a true one share *zero* experiential overlap, why do people *systematically* confuse them? What explains the mix-up if the experiences are, as you say, totally different beasts?"  
     *(When she blames "conceptual error" or "misclassification")*  
     → Follow-up: "But people on psychedelics or in psychosis *know* their perception is unreliable, yet still report the feelings as indistinguishable from reality. If the confusion persists even when the conceptual framing is shattered, doesn't that point to an underlying *experiential* sameness?"  

  4. **Austin vs. McDowell Smackdown:**  
     "You cite both Austin and McDowell, but they clash hard on disjunctivism. Austin mocked the ‘argument from illusion’ as overblown, while McDowell kept ‘appearances’ or ‘seemings’ as a shared element. Where do you land? Do you reject *even McDowell’s* concession to subjective ‘seemings’?"  
     *(Listen for whether she nukes "seemings" entirely)*  
     → Follow-up: "If you ditch *all* shared subjective elements – no common ‘appearance’ layer at all – how do we even *make sense* of the concept of illusion? Doesn’t ‘It *seemed* like X, but wasn’t’ require that ‘seeming’ to be a thing?"  

  5. **Clinical Reality Check:**  
     "Clinicians treating interoceptive hallucinations (like panic disorder gut feelings) find that *reducing raw intensity* – via drugs or neurostim – often helps, *alongside* cognitive therapy. If these false feelings share *nothing* mentally with accurate ones, why would dampening the ‘hallucinatory’ feeling aid recovery? Doesn’t that suggest a shared experiential core we *can* modulate?"  
     *(When she says "Clinical efficacy ≠ mental ontology!")*  
     → Follow-up: "But if successful treatment *combines* tweaking experience *and* concepts, doesn’t your strict disjunctivism risk misdescribing what therapy *does*? If the feeling itself is irrelevant, why not *only* do conceptual retraining?"  

  6. **The Zombie Test (Bonus Round):**  
     "Imagine a perfect interoceptive zombie: biologically identical to a human, reporting ‘hunger’ when energy-deprived identically to us, but with *zero* subjective experience. Would their false ‘hunger’ signals (say, from gut ghrelin spikes) still be a *different mental kind* from their true hunger? Or is the ‘kind’ totally tied to phenomenology you deny for illusions?"  

  This should corner her without being hostile. Made sure no escape hatches for "misapplication of concepts" dodge! Pray for me. And fix my typos before sending pls – you recieve my drift.  

  Cheers!  
  [Your Name]  

  ---  
  **Key Tactics Embedded:**  
  - Forces her to define "mental kind" *positively* (not just by negation)  
  - Uses bodily-specific paradoxes (adaptive false signals)  
  - Appeals to edge cases (drugs/psychosis) where judgment is impaired but indistinguishability remains  
  - Presses the "why does confusion happen?" intuition pump  
  - Traps the "seemings" loophole  
  - Ties theory to clinical practice *she* cites  
  - Rejects the "that’s just a category error" magic wand
