prompt: |-
  You're a professional philosopher of urban space and zoning-reform advocate. Before you draft anything, do a quick brainstorm of the three rhetorical traps this specific audience sets for outsiders, then build the prep sheet step by step.

  I'm speaking at my city's planning commision next tuesday defending a hybrid position: exclusionary single-family zoning is a spatial enclosure that violates a Lefebvrian right to the city, but pure deregulation and conventional social housing both miss the point. My actual proposal is "zoning reciprocity"—upzoning gets approved only if the land-value gain is split into a community land-trust equity pool that existing residents co-own, so density and anti-displacement are mechanically linked rather than traded off. The audience is mostly Jane Jacobs-style urbanists who worship organic neighborhood scale and "eyes on the street," plus one libertarian property lawyer who thinks all zoning is regulatory theft, plus one tenant organizer convinced any upzoning is developer greenwashing. I need a Q&A prep sheet for after my 10-minute pitch: list the objections in roughly the order they'll come, phrased in their actual vocabularies (organic scale, regulatory takings, green gentrification, etc.). For each: how damaging is it, what should I concede up front, what's the two-minute reply, and where is that reply softest? Also include the objection I'm praying nobody asks—probably whether the reciprocity pool just monetizes racialized displacement rather than repairing it. Finally, say what specific evidence or failure mode would actually change your mind about this model working, and flag the shakiest part of your own reasoning—likely whether land-trust governance can resist capture by either developers or incumbent homeowners. Don't cite papers or books; work straight from the concepts, and keep it like you're prepping a friend, not writing a syllabus.
