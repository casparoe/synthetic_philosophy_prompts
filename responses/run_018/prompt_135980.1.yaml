  First, I need to map this against existing political ethics concepts. The classic dirty-hands framework (Walzer, Williams) assumes the leader privately bears moral guilt while publicly justifying the act as necessary. But here, the "dirt" itself is valorized—supporters point to the violation as evidence of strength. That's a crucial inversion. 

  Costly signaling theory (economics/biology) comes close—the immoral act could signal commitment—but typically applies to mutual sacrifices, not unilateral norm-breaking. Machiavelli's "virtù" celebrates decisive action beyond morality, but doesn't address how audiences actively reward the transgression. 

  The psychology here is perverse: the leader's violation creates ingroup/outgroup dynamics. Supporters read the act as "proof he'll protect us by any means"; critics are framed as naive. This reminds me of Cohen's "states of denial" work on moral neutralization, but turned proactive—the transgression becomes positively evaluated. 

  Boundary conditions: likely thrives in polarized democracies where security fears trump norms, or in authoritarian "strongman" cults. Requires audiences primed to value ends over means. Crucially, the norm violated must be widely shared enough that breaking it seems audacious—banal evils don't shock. 

  For a new term, "transgressive legitimacy" captures the core: legitimacy derived from visible rule-breaking. Or "virtù signaling," playing off costly signaling but emphasizing Machiavellian resolve. The user might prefer the former—it's clearer. 

  Key distinctions: 
  - Vs. hypocrisy: transparency is essential here; the power comes from owning the act. 
  - Vs. martyrdom: the leader isn't suffering for values but violating them. 
  - Vs. realpolitik: the act's symbolic display matters more than its strategic outcome. 

  User seems theoretically sophisticated—they've already spotted gaps in standard frameworks. Their unstated need might be to weaponize this concept critically, so precision in separating it from adjacent ideas (sacrifice, dirty hands) is key. I should emphasize the audience's role in transmuting moral costs into authority.
answer: |-
  This is a sharp and perceptive analysis of a distinct phenomenon in political legitimation. While elements resonate with existing concepts, **no single, universally accepted term captures the *specific inversion* you describe, where the *public display and acknowledgment of violating a shared moral norm becomes the active source of legitimacy and authority*.** This goes beyond standard formulations.

  Let's break it down, define the phenomenon, distinguish it, and explore its boundaries:

  1.  **The Core Phenomenon: Defined**
      *   **Definition:** **Transgressive Legitimacy** (or **Legitimacy-through-Transgression**).
      *   **Core Mechanism:** A leader or regime publicly acknowledges violating a widely shared moral norm in pursuit of a paramount collective good (security, peace). Crucially, this acknowledged transgression is not framed primarily as a necessary evil reluctantly borne, but as a *demonstrative act* proving the leader's unique capacity for ruthless efficacy, resolve, and willingness to "do what must be done" beyond the constraints binding ordinary morality or citizens. The *visibility and unapologetic nature* of the transgression itself becomes a key source of authority and political capital with their base/supporters.
      *   **Key Features:**
          *   **Public Acknowledgment:** The violation is not hidden or denied; its "wrongness" is implicitly or explicitly conceded.
          *   **Demonstrative Display:** The act is performed or revealed in a way that highlights its transgressive nature.
          *   **Inverted Moral Calculus:** The violation's "dirt" is not a cost to be minimized but a *signal* to be amplified.
          *   **Signaling Function:** The signal is: "I possess the unique strength/resolve to bear *this* burden *for you*, proving my capacity to protect/lead."
          *   **Source of Authority:** Legitimacy flows *from* the act of transgression and its public recognition, not *despite* it.
          *   **Boundary Creation:** It distinguishes the leader (and by extension, loyal supporters) from "ordinary" citizens or "soft" critics bound by conventional morality.

  2.  **Distinction from Adjacent Concepts:**
      *   **Classic Dirty Hands (Walzer, Williams):**
          *   **Psychological Focus:** Primarily on the *leader's internal moral burden* – the guilt they *must* feel even while acting for the greater good. The "dirt" is a private or existential cost.
          *   **Public Justification:** The public justification is usually necessity and consequences ("We had no choice, it saved lives"), aiming to minimize the *perception* of the moral violation. The goal is often to *avoid* highlighting the transgression itself.
          *   **Legitimacy Source:** Legitimacy ideally comes from the *successful outcome* achieved through the necessary evil, *despite* the moral cost. The cost itself isn't valorized.
      *   **Transgressive Legitimacy (Your Phenomenon):**
          *   **Psychological Focus:** Less on internal guilt (it might exist but is irrelevant to the mechanism), more on the *demonstrated resolve*. The leader may feel conflicted, but the *public performance* emphasizes strength, not guilt.
          *   **Public Justification:** The violation is *framed* precisely *as* proof of strength, seriousness, and commitment. Acknowledging its "dirtiness" is part of the signal ("Yes, it was tough/ugly, that's how you know I mean business").
          *   **Legitimacy Source:** Legitimacy flows *directly* from the *act of transgression itself* and its public recognition. The "dirt" *is* the source of political capital with the target audience. The outcome is secondary to the proof of resolve.
      *   **Hypocrisy:** Fundamentally different. Hypocrisy involves *concealing* the violation or *falsely professing* adherence to the norm. Transgressive Legitimacy requires *acknowledgment* and *display* of the violation.
      *   **Costly Signaling:**
          *   **Similarity:** The transgression acts as a costly signal demonstrating commitment or capability. Sacrificing moral standing is the "cost."
          *   **Difference:** Costly signaling typically assumes the cost is *intrinsically undesirable* but credible *because* it's costly. In Transgressive Legitimacy, the "cost" (moral transgression) is *transmuted* into a positive attribute (strength, resolve) *by* the audience's interpretation. The signal isn't just costly; its *very nature as transgressive* is what makes it valuable. Classic costly signaling (e.g., donating wealth to prove commitment) doesn't inherently involve violating core moral norms.
      *   **Moral Authority from Sacrifice:**
          *   **Similarity:** Involves personal cost enhancing authority.
          *   **Difference:** Sacrifice typically involves enduring hardship, loss, or risk *for* a moral principle (e.g., martyrdom, personal austerity). Transgressive Legitimacy involves *violating* a moral principle as the act that *constitutes* the proof of commitment. It's the *immoral act itself* that signals strength, not enduring suffering *for* morality.
      *   **Legitimation of State Violence:**
          *   **Overlap:** Transgressive Legitimacy can be a *tool* for legitimizing state violence.
          *   **Difference:** Legitimation of state violence often relies on demonizing the enemy, claiming self-defense, legalistic justifications, or portraying violence as surgical/minimal. Transgressive Legitimacy specifically relies on the *acknowledged violation of a norm* as the source of legitimacy. It embraces the "dirt" rather than sanitizing it.

  3.  **Boundary Conditions:**
      *   **Audience Receptivity:** Crucial. This mechanism thrives when a significant constituency:
          *   Prioritizes security/collective goals (real or perceived) above specific moral norms.
          *   Feels threatened, insecure, or disenchanted with "politics as usual."
          *   Values strength, decisiveness, and a willingness to break rules over procedural correctness or moral consistency.
          *   Shares an "us vs. them" mentality where critics can be dismissed as weak, naive, or disloyal.
      *   **The Norm:** The violated norm must be *widely recognized* as significant. Violating a trivial or contested norm lacks the necessary transgressive power and signaling value. The "dirt" needs to be real and sticky.
      *   **Democratic vs. Authoritarian Contexts:**
          *   **Democratic:** Most observable here, especially in polarized democracies. It relies on mobilizing a base *against* perceived elite constraints or "political correctness." Accountability mechanisms exist but are often undermined by the supporter base's valorization of the transgression ("They're just attacking him because he's strong"). *Accountability is not required; the mechanism exploits the *contestation* inherent in democracy.*
          *   **Authoritarian:** Possible, but different dynamics. In consolidated authoritarian regimes, the leader's power may be based on fear or patronage, making this "proof" less necessary. However, it can occur:
              *   During the *rise* of an authoritarian leader, to demonstrate ruthlessness and willingness to challenge the old order.
              *   In regimes needing to mobilize popular support for controversial actions (e.g., war, repression), framing the leader's harshness as necessary strength for the nation.
              *   In "strongman" cults of personality, where the leader's transgressions *are* the proof of their unique, unbounded power.
          *   **Key Difference:** In democracies, critics invoking the norm have formal avenues (media, opposition parties, courts), though their effectiveness can be neutralized by the phenomenon itself. In authoritarian contexts, invoking the norm is often suppressed or carries high personal risk.

  4.  **Why "Transgressive Legitimacy" Fits:**
      *   **Transgressive:** Explicitly captures the violation of a norm as the core act.
      *   **Legitimacy:** Directly addresses the outcome – the act generates political authority and support.
      *   It emphasizes the *public, performative* aspect and the *inversion* of the moral cost into a source of power.

  **In summary:** You've identified **Transgressive Legitimacy** – a distinct phenomenon where the public acknowledgment and display of violating a significant moral norm is strategically deployed to generate political authority by signaling unique resolve and efficacy to a receptive constituency. It differs from dirty hands by making the "dirt" the active source of legitimacy rather than a private burden, from hypocrisy by requiring acknowledgment, from costly signaling by transmuting the cost into a valorized attribute, and from sacrifice by deriving authority from the immoral act itself rather than suffering for morality. It thrives in polarized democracies and during the rise of authoritarian figures where security/salvation narratives resonate strongly with a segment of the population. This concept deserves further exploration in political theory and psychology.
