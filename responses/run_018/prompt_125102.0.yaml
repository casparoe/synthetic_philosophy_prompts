  ## Sestina for the Absorbed Perihelion

  My shape was set, a quiet, settled **prior**,
  Before that curve, that tight celestial **orbit**,
  Was ever etched in observation's book. Though **known**
  Now, bright and sharp, it adds no novel **weight**,
  For I had spun its path within my grain. Each thought **shifts**
  Around its fixed position, yet belief lies **still**.

  The calculation runs, but nothing stirs **still**.
  The old assumption holds me like a **prior**.
  New reasons coil around that ancient **orbit**,
  Proposing different whys for what is **known**.
  They tug and strain, yet find no purchase, **weight**
  Fails where the path was pre-defined. The mind **shifts**

  Perspective, seeking traction. Logic **shifts**
  The lenses, scans the data once again, **still**
  Confronting certainty. What counter-**weight**
  Could balance truth already in the **prior**?
  That curve, the swift plunge of Mercury's **orbit**,
  Its stubborn, long-incorporated **known**

  Presence, denies surprise. It stands there, **known**,
  A fact embedded deep. Though reason **shifts**
  Its focus, parsing angles of the **orbit**
  With finer tools, the core remains quite **still**.
  No shock can ripple through my dense **prior**;
  Its fabric held this trace. No added **weight**

  Descends. Though arguments may seem to **weight**
  The case anew, they lean on what was **known**
  Before the formal proof. My old **prior**
  Already bore the mark. Each fresh thought **shifts**
  The frame, not the foundation, locked and **still**.
  It circles back to that persistent **orbit**.

  Can evidence confirm when path and **orbit**
  Are one? When certainty removes all **weight**
  From learning what was settled? Time stands **still**
  Within this loop. The crucial fact, long **known**,
  Demands its place, yet forces no true **shifts**
  In credence held within my constant **prior**.

  *O rigid form, where old proof stands as **known***,
  *The math **shifts** vainly round its fixed **orbit***.
  ***Prior known*** *absorbs the light; no **weight** moves **still***.

  ---

  **Notes on Structure & Theme:**

  *   **Fixed Rotation:** The sestina's required word order (615243, 364125, etc.) structurally enacts the cycling of reasoning around the same fixed point (the old evidence, "orbit"). Each time a word returns, it’s in a new syntactic position, mirroring the evidence being re-encountered in a new logical guise, yet failing to exert force.
  *   **"orbit" (Evidence):** Represents the observed datum (e.g., Mercury's anomalous perihelion advance), already known and fully accommodated within the prior.
  *   **"prior" (Credence State):** The starting belief distribution that already entails the evidence (`P(E) = 1`). It remains stubbornly central and immutable.
  *   **"shifts" (Futile Reasoning):** Represents the attempts to reanalyze, reframe, or find new significance for the old evidence. These shifts *happen* constantly ("each thought shifts", "logic shifts", "reason shifts"), but crucially, they produce no belief change.
  *   **"weight" (Confirmatory Force):** The word consistently appears in contexts denying its effect ("adds no novel weight", "fails where the path was pre-defined", "removes all weight", "no weight moves still"). It *should* shift the posterior but cannot because the evidence is already certain.
  *   **"known" (Absorbed Evidence):** Emphasizes the evidence's status as already integrated ("long-incorporated known", "what was known", "old proof stands as known").
  *   **"still" (Stasis):** Represents the unchanging posterior belief ("belief lies still", "core remains quite still", "no weight moves still"), contrasting with the shifting reasoning around it.
  *   **Envoi Collapse:** The final three lines bring "prior" and "known" into direct adjacency ("***Prior known***"), capturing the moment of recognition that the evidence wasn't external confirmation but was internal to the prior belief state all along. The "math shifts vainly" around the fixed "orbit", but the "weight" (confirmatory force) remains inert ("no **weight** moves **still**").
  *   **Technical Accuracy:** The poem captures the core problem: Conditioning on E when `P_old(E) = 1` means `P_new(H) = P_old(H|E) = P_old(H)`. The posterior equals the prior. Despite the evidence *seeming* confirmatory and our *desire* to say it confirms H, the Bayesian math shows no belief update occurs *because* the evidence was already fully expected (entailed by the prior). The tension between the intuitive desire for confirmation and the formal null result is maintained throughout ("Demands its place, yet forces no true shifts").
  *   **Voice:** The poem speaks *from the perspective of the prior*, a stable, almost implacable entity observing the futile reasoning ("shifts") swirling around the evidence ("orbit") it already contains.
