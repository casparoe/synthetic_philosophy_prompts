  For structure: a pantoum has four-line stanzas where the second and fourth lines of each stanza become the first and third of the next. The final stanza often circles back to lines from the first. I'll plan six quatrains. The first two stanzas set up the problem with A, R, and B. Stanza three introduces the regress explicitly. Stanza four claims a solution ("the ultimate binder"), but stanzas five and six reuse those lines to undermine it, revealing the binder as just another relatum.

