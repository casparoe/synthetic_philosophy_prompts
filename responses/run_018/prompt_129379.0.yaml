  I need to evaluate these five substrates:
  (1) biological brain with synaptic plasticity
  (2) silicon chip with identical transition table but instantaneous state flips
  (3) neural net with continuous activations trained with backprop
  (4) swarm-robot system with emergent global belief
  (5) quantum computer holding belief in superposition

