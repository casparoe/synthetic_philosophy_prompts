answer: |-
  Here are the five points as requested:

  1.  **Precise Research Question:** Does the primary wrong of a revealed, aesthetically indistinguishable forgery consist solely in the initial deception, or does a distinct, residual institutional harm—conceptualised as epistemic pollution corrupting collective provenance-tracking systems—persist even post-revelation? Current frameworks, focused on individual perceptual failure or historical connection, fail to adequately address this potential systemic damage to the public record.
  2.  **Conceptual Method:** The research employs philosophical analysis, specifically examining the conceptual apparatus and normative foundations underpinning institutional practises (museum cataloguing, auction house provenance chains, art historical databases) that establish and rely upon an object's stable identity as a public epistemic resource, moving beyond empirical art history or psychological studies.
  3.  **Success and Failure Criteria:** Success entails rigorously defining and demonstrating the existence of a distinct category of institutional harm ("epistemic pollution") separable from individual deception. Failure occurs if the analysis collapses into existing frameworks of deception or historical value, or cannot convincingly isolate a unique institutional wrong persisting post-revelation.
  4.  **Concrete Deliverable:** A framework document outlining specific vulnerabilities within institutional provenance systems to epistemic pollution, proposing normative principles for mitigating this harm, directly useful to provenance researchers, museum registrars, and policy-makers developing authentication protocols and database integrity measures.
  5.  **Realistic Six-Month Assessment:** Realistically achievable is the rigorous conceptual groundwork: defining the institutional harm, arguing for its distinctness from deception, and developing the core framework, laying essential foundations for future empirical application or broader philosophical exploration beyond the grant period. Comprehensive case study integration or extensive policy consultation is unlikely within this timeframe.
