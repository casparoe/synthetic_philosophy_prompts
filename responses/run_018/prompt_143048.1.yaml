  Now, the residue. Malcolm's reliance on incorrigibility and memory claims doesn't fit neatly into Husserl's framework. Phenomenology focuses on structures of consciousness, not epistemic criteria. Also, his behaviorist leanings might clash with Husserl's emphasis on subjective experience.

