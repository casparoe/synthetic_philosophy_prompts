prompt: |-
  I have been trying, without any formal training, to understand what people actually mean when they claim that a society is unfair because its members do not have equal shares of something. I keep encountering three broad answers — equality of welfare, of resources, and of capabilities — but I want to establish the full specification first: what must any adequate theory addressing equality of welfare, resources, and capabilities be able to deliver before it can be analysed?

  Write the desiderata. List the cases it must get right, the distinctions it must preserve, the biological or psychological findings it must not contradict, and the institutional constraints it must satisfy if it is to guide real public programmes. For each requirement, state the motivating consideration or thought experiment behind it. Be sure to address:

  - the standard case of a disabled person who requires more resources than others to reach the same level of functioning;
  - the problem of expensive tastes, where one person needs greater expenditure to achieve the same welfare;
  - my own hypothetical scenario in which individuals have access to neuroadaptive implants that allow them to voluntarily reset their satisfaction baselines and to convert resources into subjective well-being at radically different rates — ask whether a theory of equality should treat these self-modified conversion rates as part of the metric or as matters of personal responsibility;
  - the distinction between equality of opportunity and equality of outcome, and between possessing moral status and being assigned an equal distributive share;
  - whether the theory must remain neutral between competing conceptions of the good life, or whether it is permitted to build in a particular account of human flourishing.

  Flag any pair of desiderata that seem jointly unsatisfiable — for example, complete neutrality about the good life together with a non-arbitrary measure of equality — and identify the single requirement that eliminates the largest number of existing theories (welfarism, resourcism, and the capability approach). Keep the emphasis on the criteria and their internal tensions rather than on a detailed scorecard, though a brief comparative note on how the three main accounts stand against the list is welcome. Please provide your answer in American English.
reasoning: |-
  Okay, the user is diving deep into theories of equality without formal training—impressive initiative. They're wrestling with three frameworks (welfare/resources/capabilities) but want the foundational criteria first. Smart approach. Their frustration with vague claims about "unfair shares" resonates—people throw around "equality" without rigor.

  Hmm, their four pinned cases reveal sophisticated concerns: 
  - The disability example tests resource-to-functioning conversion. 
  - Expensive tastes probe responsibility versus disadvantage. 
  - The neuroimplant scenario is sci-fi but crucially stress-tests agency and metric flexibility. 
  - The opportunity/outcome distinction ties to meritocracy debates. 
  They're clearly not just skimming surface-level philosophy.

  *Pausing to unpack their hidden layers:* 
  They might actually be crafting their own theory (hence demanding "full specification"). The neuroimplant thought experiment feels personal—maybe they're exploring tech-adjacent inequality futures. Also, their "no formal training" disclaimer signals they want clarity without jargon overload.

  *Structuring the response:* 
  The desiderata must cover: 
  1. **Real-world cases** (disability, expensive tastes, their neuroimplant hypo) 
  2. **Conceptual boundaries** (opportunity≠outcome, moral status≠distributive share) 
  3. **Empirical anchors** (psychology/biology constraints) 
  4. **Implementation guardrails** (policy feasibility) 
  ...while flagging tensions like neutrality versus non-arbitrary metrics.

  *Biggest challenge:* 
  Their neuroimplant scenario is the ultimate trap for theories. If someone *chooses* low resource-to-welfare conversion rates, is that their responsibility? Welfarism fails here (rewards bad choices), resourcism ignores suffering, capabilities struggle with "voluntary capability reduction." This might sink strict neutrality about the good life.

  *Ah—the killer requirement:* 
  **"Agency-respecting non-arbitrariness"** (Desideratum 6) likely disqualifies most vanilla theories. It forces: 
  - Metrics that aren't subjective (rejects welfarism's satisfaction baseline issue) 
  - But also aren't rigidly material (unlike resourcism ignoring differing needs) 
  - While accommodating chosen preferences unless coerced. 
  Capabilities come closest but still wrestle with adaptive preferences.

  *Comparative note framing:* 
  Will briefly show each theory's fatal flaw under these criteria: 
  - Welfarism: implodes on expensive tastes and neuroimplants 
  - Resourcism: crumbles on disability and conversion rates 
  - Capabilities: wobbles on expensive tastes and neutrality 
  ...without getting stuck in academic point-scoring.

  *Final check:* 
  Must emphasize tensions, not solutions. User wants the map of philosophical minefields, not a defusal manual. Their "jointly unsatisfiable" request means highlighting paradoxes like: 
  - Neutrality + non-arbitrary metrics = impossible 
  - Full agency + equal outcomes = only if no one chooses disadvantage 
  ...which exposes why equality theories remain contested.
answer: |-
  Here is a set of desiderata for any adequate theory of equality addressing welfare, resources, and capabilities, based on your criteria. These requirements distill core challenges and tensions, with thought experiments and cases motivating each. Key conflicts are flagged, and a comparative assessment of the three main approaches is included.

  ---

  ### **Core Desiderata for an Adequate Theory of Equality**
  #### **I. Must Accommodate Basic Cases of Disadvantage**
  1. **The Disability Accommodation Requirement**  
     *Motivation*: A paraplegic needs a wheelchair to achieve mobility (a basic functioning others attain without extra resources). If equality demands equal mobility, they require more resources.  
     *Requirement*: The theory must justify extra resourcing for disabilities without invoking pity or charity—grounded in fairness.  
     *Tension*: If resources are equal, functioning isn’t; if functioning is equal, resources aren’t.  

  2. **The Expensive Tastes Problem**  
     *Motivation*: Someone cultivated a taste for champagne (over water) now needs more resources for equal welfare. Should society fund this?  
     *Requirement*: The theory must distinguish between *unchosen disadvantages* (disability) and *chosen preferences* (expensive tastes), holding individuals responsible for the latter.  
     *Thought Experiment*: Ronald Dworkin’s "champagne vs. water" case.  

  #### **II. Must Grapple with Agency and Adaptation**
  3. **The Neuroadaptive Implants Scenario** (Your Case)  
     *Motivation*: If Person A uses implants to reset their satisfaction baseline to require minimal resources for high welfare, while Person B chooses implants making them need vast resources for the same welfare:  
     - *Option 1*: Treat conversion rates as part of the metric → Equality demands more resources to B.  
     - *Option 2*: Treat rates as personal responsibility → Equality denies B extra resources.  
     *Requirement*: The theory must specify whether *chosen* conversion rates affect distributive shares. It should prioritize compensating unchosen limits (e.g., disability) but not subsidize avoidable self-impoverishment.  
     *Key Tension*: Neutrality vs. responsibility. If welfare equality governs, B gets more; if resource equality governs, B suffers.  

  #### **III. Must Preserve Foundational Distinctions**
  4. **Opportunity vs. Outcome**  
     *Motivation*: Equality of opportunity (e.g., fair access to education) may still lead to unequal outcomes (e.g., wealth disparities).  
     *Requirement*: The theory must clarify whether it seeks equal starting points, equal prospects, or equal end results. It should not conflate the failure to use opportunities (responsibility) with lack of access (unfairness).  

  5. **Moral Status vs. Distributive Share**  
     *Motivation*: All humans have equal moral worth, but this doesn’t entail equal wealth (e.g., a surgeon may "deserve" higher pay than a hobbyist).  
     *Requirement*: The theory must separate basic moral equality (rights, respect) from material distribution, avoiding the "equality fallacy" that moral equality demands equal stuff.  

  #### **IV. Must Respect Empirical Realities**
  6. **Psychological and Biological Constraints**  
     *Motivation*: Hedonic adaptation (people return to baseline happiness after windfalls/losses) or genetic predispositions to depression challenge welfare-based equality.  
     *Requirement*: The theory must not rely on implausible assumptions (e.g., that welfare is infinitely malleable or resource-insensitive). It should align with:  
     - The **set-point theory** of well-being (biology limits welfare equality).  
     - **Adaptive preferences** (e.g., the oppressed reporting high "satisfaction" with deprivation).  

  #### **V. Must Be Institutionally Feasible**
  7. **Public Policy Constraints**  
     *Motivation*: Theories must guide real programs (e.g., disability benefits).  
     *Requirement*: The metric must be:  
     - **Measurable** (not reliant on subjective welfare reports).  
     - **Non-paternalistic** (avoids imposing a "good life" template).  
     - **Incentive-compatible** (does not discourage productivity).  

  #### **VI. Must Navigate Neutrality vs. Objectivity**
  8. **Neutrality About the Good Life**  
     *Motivation*: Liberal societies avoid privileging one conception of flourishing (e.g., monasticism vs. hedonism).  
     *Requirement*: The theory should not build in a *specific* account of human flourishing unless it can justify it as universally necessary (e.g., basic health).  
     *Tension with Non-Arbitrariness*: **Neutrality + Non-Arbitrary Metric = Jointly Unsatisfiable**. If the theory is neutral, it struggles to explain why health matters more than collecting stamps (without invoking objective flourishing).  

  ---

  ### **Key Tensions and the "Killer" Requirement**
  - **Major Conflict**: **Desideratum 8 (Neutrality)** clashes with **Desideratum 6 (Non-Arbitrary Metric)**.  
    - *Why?* Neutrality forbids ranking capabilities/welfare/resources as objectively "better," but a non-arbitrary metric requires justifying why (e.g.) mobility > champagne tastes.  
    - *Result*: Strict neutrality forces theories into vagueness (e.g., "all preferences are equal"), undermining fairness claims.  

  - **The Disqualifying Requirement**:  
    **Desideratum 3 (Neuroimplants) + Desideratum 2 (Expensive Tastes)** eliminates the most theories. It demands:  
    - *Compensation for unchosen disadvantages* (disability) but not *chosen ones* (self-induced needs).  
    - Only **responsibility-sensitive resourcism** (e.g., Dworkin’s auction) and **capability approaches with agency filters** survive partially. Pure welfarism fails utterly (it subsidizes chosen misery).  

  ---

  ### **Comparative Assessment of Theories**
  | **Desideratum**          | **Welfarism** (Equality of Welfare)       | **Resourcism** (Equality of Resources) | **Capability Approach** (Equality of Capabilities) |
  |--------------------------|-------------------------------------------|----------------------------------------|----------------------------------------------------|
  | **Disability (1)**       | ❌ Fails: Welfare equality may demand too few resources if disabled adapt. | ❌ Fails: Equal resources ignore extra needs. | ✅ **Best**: Targets functioning (e.g., mobility). |
  | **Expensive Tastes (2)** | ❌ **Fails**: Rewards cultivated deprivation. | ✅ Passes: No extra shares for tastes. | ⚠️ Mixed: Depends on whether tastes affect capabilities. |
  | **Neuroimplants (3)**    | ❌ **Fatal**: Must subsidize B’s chosen inefficiency. | ⚠️ Mixed: Denies B help, but ignores suffering. | ⚠️ Mixed: Capability to "feel satisfied" vs. personal responsibility? |
  | **Opportunity vs. Outcome (4)** | ❌ Blurs: Focuses on outcomes (welfare). | ✅ Strong: Emphasizes ex ante opportunity. | ✅ Strong: Focuses on freedom (opportunity for functioning). |
  | **Neutrality (8)**       | ❌ Fails: Implies welfare is the only good. | ✅ Passes: Resources neutral to ends. | ❌ Fails: Capabilities imply objective flourishing. |
  | **Non-Arbitrary Metric** | ❌ Fails: Subjective/unmeasurable. | ✅ Passes: Resources quantifiable. | ⚠️ Mixed: Capabilities clearer than welfare but still contested (e.g., which capabilities matter?). |

  ---

  ### **Conclusion**
  An adequate theory must:  
  1. **Target unchosen disadvantages** (disability), not chosen ones (expensive tastes/neuro-choices).  
  2. **Respect agency** (neuroimplant users own their choices) but **prevent exploitation** (no rewards for self-sabotage).  
  3. **Reject strict neutrality** to avoid arbitrariness (some functionings/resources are objectively basic).  
  4. **Use a measurable, responsibility-sensitive metric**—likely a hybrid of resources and capabilities.  

  **The neuroimplant case (Desideratum 3) is the ultimate stress test**: It eliminates welfarism, challenges resourcism’s indifference to suffering, and pressures capabilities to define "legitimate" adaptive preferences. No theory satisfies all desiderata cleanly, but capability approaches (with agency constraints) come closest, while resourcism (with insurance mechanisms) is most policy-viable. The tension between neutrality and non-arbitrary metrics remains unresolved in all frameworks.
