  First, I need to recall the key components: non-causal decision theories, existence of correlated agents, stability of cooperation, and whether this effect is swamped by other factors. The user mentioned sub-questions like the probability of non-causal decision theories being correct, the existence of enough correlated agents, cooperation stability without communication, and practical swamping.

  Starting with non-causal decision theories. The user is probably familiar with ideas like evidential or functional decision theory. I remember debates around Newcomb's problem where causal and evidential approaches differ. There's no consensus, so maybe around 40%? Conditional on that, the universe's size. Cosmology suggests a potentially infinite universe, but "relevantly similar" agents might be rare due to chaotic systems or varying contexts. High uncertainty here, say 25%.

  Then cooperation stability. Even if agents are correlated, without communication, defection could be tempting. Iterated reasoning might lead to mutual suspicion. Historical examples like prisoner's dilemmas show how hard sustained cooperation is. Maybe 30% for stability. Finally, practical swamping. Everyday decisions have immediate effects, like a donation's impact vs. the evidential link. The correlation might be too weak compared to direct consequences. Higher probability here, maybe 85%.

  Combining these: 0.4 * 0.25 * 0.3 * (1-0.85) = 0.0045. Then accounting for the negation of swamping (15%), so 0.0045 / 0.15? Wait, no. The formula is P(shift) = P(non-causal) * P(agents|non-causal) * P(stable|agents) * P(not swamped|stable). Multiplying gives 0.4*0.25=0.1, then *0.3=0.03, then *0.15=0.0045. But that's 0.45%. The user's 15% is way higher. Where do we diverge?

  The user's 15% is significantly higher than my 0.45%. The biggest gap is probably in the existence of correlated agents or the stability of cooperation. They might think "relevantly similar" is broader, or that decision theories handle coordination better. To update my view, evidence of stable cooperation in complex simulations or empirical data on correlated decisions could sway the stability probability. Alternatively, better formal models showing robustness against defection.

  Also, the swamping factor. The user might underestimate how often direct effects dominate. If studies showed decisions where evidential effects outweigh causal ones, that'd change things. But currently, everyday choices have observable impacts, making the correlation seem theoretical.
