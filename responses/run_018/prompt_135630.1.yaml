prompt: |-
  For my presentation in a graduate seminar on collective intentionality and social ontology, I want a consistency audit of my current package before I defend it. Here is where I have landed:

  (i) I hold a reductionist account of shared intention in broadly Bratmanian terms: it is constituted by interlocking individual intentions, mutual responsiveness, and commitments to joint activity and mutual support, with no primitive or irreducible we-intention.

  (ii) I take joint action to require shared intention in exactly this sense; parallel action with common knowledge of aligned ends does not suffice.

  (iii) I think collective agents—corporations, committees, perhaps states—can bear genuinely non-derivative moral responsibility. The fault is genuinely at the collective level, not merely an aggregate of individual wrongs.

  (iv) I treat the we-mode of intentionality as phenomenologically real but ontologically weightless: it describes how acting together feels, not a distinct metaphysical kind.

  (v) I accept that institutional facts depend on collective acceptance, yet I think this acceptance is always decomposable into individual acceptance plus common belief about that acceptance, with no irreducible collective acceptance-state.

  (vi) I maintain that every participant in joint action retains unilateral veto power: anyone can dissolve the activity by revising her own intentions, and exercising this power is never a betrayal of a collective-level obligation—only an individual change of mind.

  (vii) I distinguish responsive compliance from coerced participation in what I call asymmetric joint actions: even when one agent directs and another complies, the activity counts as genuinely joint if the compliance is responsive to the director's intentions rather than forced; in such cases, however, primary moral responsibility lies with the directing agent rather than being distributed.

  (viii) I deny that Gilbert-style plural subjecthood is a necessary condition for joint action; at best, it is a descriptive label for particularly stable patterns of interlocked intention.

  Please audit whether these hang together. Specifically: identify which pairs are in genuine tension, which conflicts only appear serious but dissolve on inspection, and for each real tension state the least costly revision and what it costs me. Rank the tensions by severity rather than listing them as equally damaging. Trace precisely what my commitments commit me to, without lecturing on the literature or asking for reading lists. I have not decided which commitment I would drop if forced, so treat all as live.
reasoning: |-
  Okay, the user is working on a presentation for a graduate seminar about collective intentionality and social ontology. They've outlined eight key points in their theoretical package and want an audit for internal consistency before defending it. This is a complex philosophical framework with potential tensions between reductionist foundations and non-reductionist moral claims. 

  First, let's map the core tensions. The user's position is aggressively reductionist: no irreducible "we-intentions" (i), decomposable collective acceptance (v), individual veto power (vi). Yet they insist collective agents bear non-derivative moral responsibility (iii). That's the biggest red flag - how can responsibility be fundamentally collective if everything reduces to individuals? 

  The asymmetric joint action point (vii) is interesting but creates subsidiary problems. If primary responsibility always lies with directors in asymmetric cases, that undermines the "non-derivative" claim for collectives themselves. And the veto power (vi) seems incompatible with genuine collective responsibility - if any member can unilaterally dissolve obligations, how can the collective be blameworthy? 

  The phenomenological claim (iv) feels like a dodge. Calling we-mode "ontologically weightless" while granting its experiential reality doesn't resolve the core tension - if collective responsibility is real, it must be more than just feelings. 

  Surprisingly, the Gilbert denial (viii) isn't problematic. The user can consistently treat plural subjects as descriptive labels while rejecting their necessity. The Bratmanian foundation (i-ii) also holds up well against other elements. 

  For fixes, the user faces tough choices. Softening reductionism on collective responsibility (e.g., allowing weakly emergent moral properties) would cost theoretical parsimony but save their core intuition. Alternatively, downgrading collective responsibility to "distributed individual responsibility plus systemic factors" would preserve reductionism but abandon a key thesis. 

  The veto power (vi) needs refinement - perhaps allow exceptions when prior commitments create defeasible obligations. And they should clarify whether directors in asymmetric cases (vii) bear responsibility as individuals or as collective proxies. 

  Overall, the package is sophisticated but the moral responsibility claim sticks out like a thumb. In seminar defense, they should preemptively address how responsibility emerges from individualist foundations without ontological inflation.
answer: |-
  Here's a consistency audit of your package, ranking tensions by severity and identifying salvageable points. The core tension arises from combining strong reductionism with non-derivative collective responsibility.

  **Severe Tension (Requires Significant Revision):**

  1.  **(iii) Non-Derivative Collective Responsibility vs. (i, v, vi) Radical Reductionism & Unilateral Veto:**
      *   **Tension:** (iii) claims the *collective itself* is a primary locus of moral responsibility ("genuinely at the collective level"). Yet (i) denies irreducible we-intentions, (v) reduces collective acceptance to individual states plus common belief, and (vi) grants every individual unilateral power to dissolve the joint activity instantly with no collective-level obligation breached. This makes the collective entity highly ontologically fragile and seemingly epiphenomenal. If responsibility isn't reducible to aggregated individual faults, what *grounds* it in your reductionist ontology? The veto power (vi) is particularly problematic: if the collective can cease to exist as an agent (in your terms) at any instant due to one individual's decision, how can it bear *non-derivative* responsibility for past actions? Its persistence and agency seem entirely dependent on the continued concurrence of individuals.
      *   **Least Costly Revision (Choose One):**
          *   **Revise (iii):** Downgrade collective responsibility to a *distributed* model (e.g., "participants share responsibility in complex, non-additive ways due to interlocking intentions and mutual responsiveness, but the collective *as such* isn't a distinct responsible agent"). **Cost:** Abandons core claim of genuinely collective-level responsibility.
          *   **Revise (vi):** Qualify the veto. Allow that *once a joint action with moral implications is underway*, exercising the veto to avoid responsibility *might* constitute a failure of the mutual support commitment (from i), becoming a distinct individual wrong (e.g., dereliction). **Cost:** Weakens the strong individualism of the veto principle; introduces a potential collective-level obligation binding individuals beyond their mere concurrent intentions.
          *   **Revise (i/v):** Introduce a *weakly emergent* collective intention/acceptance state that supervenes *rigidly* on the individual states + common belief, grounding responsibility. **Cost:** Compromises strict reductionism; requires ontological commitment beyond individual attitudes.

  **Significant Tension (Requires Clarification/Qualification):**

  2.  **(iii) Non-Derivative Collective Responsibility vs. (vii) Primary Responsibility of Directors:**
      *   **Tension:** (vii) states that in asymmetric joint actions, primary moral responsibility lies with the directing agent, not being distributed. This challenges (iii)'s claim of non-derivative responsibility *at the collective level*. If responsibility primarily resides with the director even in a "genuine" joint action (vii), how does that square with the collective itself bearing non-derivative responsibility (iii)? Is the director bearing responsibility *as* the collective's agent, or individually? If individually, (iii) seems weakened for asymmetric cases. If collectively, (vii) needs rephrasing.
      *   **Least Costly Revision:** Clarify the relationship. Argue that the *collective* bears non-derivative responsibility *as a whole*, but this responsibility *manifests* asymmetrically in its distribution, with the director bearing the primary *burden* or *culpability* due to their role, while the compliant participant may bear reduced or secondary responsibility (e.g., for complicity). **Cost:** Requires careful articulation to avoid collapsing collective responsibility into aggregated individual responsibility or making the director solely responsible. May strain the reductionist base.

  **Apparent Tension (Likely Dissolves on Inspection):**

  3.  **(iv) Phenomenological We-Mode vs. Reductionism (i, v):**
      *   **Apparent Tension:** How can the "we-mode" feel real if there's no ontological correlate? Doesn't phenomenology imply ontology?
      *   **Dissolution:** Your position is coherent. You consistently claim the *experience* (phenomenology) of joint action involves a first-person plural perspective ("we are doing this"), but this experience is *causally explained* and *metaphysically constituted* by the complex of individual attitudes, responsiveness, and common belief described in (i) and (v). The feeling doesn't require a primitive "we-intention"; it's an emergent aspect of the complex individual psychology interacting in the specific social context. This is a standard eliminativist/reductionist move regarding phenomenology.

  **Potential Minor Tension (Requires Careful Articulation):**

  4.  **(ii) Joint Action Requires Shared Intention vs. (vii) Asymmetric Joint Action:**
      *   **Potential Tension:** Does the subordinate's "responsive compliance" in (vii) constitute the kind of "interlocking individual intentions" and "commitment to joint activity" required by (i) and hence (ii)? Or is it merely obedience?
      *   **Resolution:** Your description ("responsive to the director's intentions *rather than forced*") suggests it *can* meet the bar. Argue that the complier intends "to do my part *as directed* in *this* joint activity," meshing sub-plans with the director, showing mutual responsiveness (adjusting to the director's guidance), and committing to the joint activity (albeit in a subordinate role). The asymmetry is in the *content* of the intentions and the *distribution of agency*, not necessarily in the *structure* meeting the Bratmanian criteria. **Cost:** Requires robustly showing how responsive compliance isn't just individual action caused by another's intention.

  **No Significant Tension:**

  5.  **(viii) Denial of Gilbert vs. (i, ii, vi):** Your denial is consistent with your Bratmanian foundation. Viewing plural subjecthood as a descriptive label for stable patterns aligns perfectly with seeing joint action as constituted by interlocking individual intentions (i, ii) and the unilateral veto (vi) undermining any strong notion of joint commitment *a la* Gilbert.
  6.  **(i) Reductionist Shared Intention & (v) Reductionist Collective Acceptance:** These are mutually reinforcing pillars of your reductionist approach. Decomposing collective acceptance into individual acceptance + common belief fits seamlessly with decomposing shared intention into interlocking individual intentions + mutual responsiveness + common belief structures.
  7.  **(vi) Unilateral Veto vs. (i, iv, viii):** The veto power is a direct consequence of the reductionism in (i) and (v) and the denial of Gilbertian joint commitment (viii). Its compatibility with the phenomenology (iv) is covered under point 3 above.

  **Summary of Audit & Recommendations:**

  *   **Critical Problem:** The **Severe Tension (1)** between non-derivative collective responsibility (iii) and the radical reductionism + individual veto (i, v, vi) is the package's fundamental weakness. You *must* revise one side significantly.
  *   **Core Trade-off:** To retain (iii), you need to soften reductionism or weaken the veto. To retain strict reductionism and the strong veto, you must weaken or abandon (iii).
  *   **Secondary Issue:** The **Significant Tension (2)** between (iii) and (vii) requires careful explanation of how primary director responsibility relates to collective responsibility. Clarification is needed, likely qualifying how responsibility *manifests* rather than revising core claims.
  *   **Manageable:** The other points either dissolve on inspection (3) or require careful articulation but are fundamentally compatible within your framework (4, 5, 6, 7).

  **Least Costly Path Forward (Prioritizing Reductionism):** Revise (iii) to a sophisticated distributed responsibility model ("collective responsibility as irreducibly complex *pattern* of individual responsibilities arising from interlocking intentions") and potentially qualify (vi) only for morally significant actions to address the veto dissolution problem. This preserves your core Bratmanian reductionism and veto principle while offering a robust (though not non-derivative collective) account of responsibility.

  **Defense Strategy:** Preemptively address the core tension. Explicitly argue *why* you think non-derivative responsibility can emerge from, yet not be reducible to, the individualistic base, or explain your revised distributed model convincingly. Be prepared to defend the compatibility of responsive compliance (vii) with genuine shared intention against objections that it's merely obedience.
