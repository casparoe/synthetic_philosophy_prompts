  We are designing a thought experiment that satisfies the following:
  - The being is physically identical to a human (same neural wiring, behavior, functional organization) but we can genuinely conceive of it lacking consciousness.
  - We inject one specific structural feature that:
    (a) makes the zombie genuinely conceivable, and
    (b) gives the physicalist a non-question-begging way to block the move from conceivability to metaphysical possibility.
  - No sci-fi, demons, perfect predictors, or specialist knowledge beyond basic philosophy of mind.

  Scenario:
  Imagine a universe that contains only two entities: a human and a "mirror" being. The mirror being is physically identical to the human down to the last particle, but it exists in a state of "reflective dependence". This means that the mirror being's entire physical state, including its neural activity, is not generated by internal processes but is instead a real-time, perfect reflection of the human's physical state. The mirror being has no internal causal chain; its every movement and neural firing is an immediate, non-causal reflection of the human's. We can conceive that the mirror being, despite having identical physical states and behavior, lacks consciousness because it does not have the causal history or internal generative processes that we associate with consciousness. However, the physicalist can argue that this reflective dependence is a feature that breaks the normal link between physical structure and function, making it a special case that does not generalize.

  Walkthrough:

  1. Dualist reasoning: The dualist notes that we can conceive of the mirror being as physically identical to a conscious human (same neural states at every moment) but without consciousness. This conceivability suggests that consciousness is not logically entailed by the physical state alone, and thus, there is a possible world (metaphysically possible) where a physically identical being lacks consciousness. This supports dualism by showing that physical facts do not necessitate phenomenal facts.

  2. Physicalist block: The physicalist points to the "reflective dependence" feature. In the mirror being, the physical states are not generated by the being's own internal causal processes but are instead a passive reflection. The physicalist argues that consciousness requires not just the physical states but also the right kind of causal organization and generative processes. Since the mirror being lacks these (its states are causally inert and merely reflective), it is not a true functional duplicate. Therefore, the conceivability of the mirror zombie does not imply the conceivability (and hence possibility) of a standard zombie (which would have internal causal processes). The physicalist is not appealing to the completeness of physics but to the functional role of causal processes in generating consciousness.

  3. Collapse without the feature: If we strip away the reflective dependence and imagine a being that is physically identical and has the same internal causal processes, then the scenario reverts to the standard zombie argument. Without the reflective dependence, the dualist can argue that we can still conceive of such a being without consciousness, and the physicalist would have to fall back on denying the conceivability or blocking the move to possibility by other means (e.g., claiming that such a zombie is not conceivable upon deeper reflection, or that conceivability does not entail possibility).

  Dualist attack: The dualist might argue that the "reflective dependence" feature is irrelevant because consciousness is a property of the current physical state, not of its causal history. They might claim that the physicalist is smuggling in a requirement for causal processes, which is a physicalist assumption about the nature of consciousness. The dualist would maintain that two beings with identical physical states at a time must have the same conscious states (if any), regardless of how those states came about.

  Verdict: Reflective dependence (as a non-causal, externally determined physical state)
answer: |-
  ### Thought Experiment: The Reflective Twin  
  Imagine a universe with two entities: a normal human and a "Reflective Twin." The Twin is physically identical to the human in every respect—same neural wiring, same behavior, same functional organization—except for one feature: its physical states are not generated internally but are instead *causally inert reflections* of the human's states. Whenever the human's brain fires a neuron, the Twin's corresponding neuron fires instantaneously and passively, like a perfect mirror image. There's no internal causal chain in the Twin; its physical processes are purely reactive, with no self-sustaining biological machinery (e.g., no metabolic processes that generate neural activity). This allows us to genuinely conceive of the Twin lacking consciousness: it's a "hollow" reflection, physically identical but devoid of inner experience because it lacks intrinsic causal power. Yet, this very feature gives the physicalist a tool to block the dualist's inference.  

  ### Analysis  
  1. **Dualist Reasoning (Conceivability to Possibility)**  
     The dualist argues that the Reflective Twin scenario shows consciousness isn't logically entailed by physical facts alone. We can conceive of the Twin—physically identical to a conscious human—as having no subjective experience. If this is conceivable, it must be metaphysically possible (following Chalmers' logic). This possibility implies that consciousness isn't reducible to physical processes, supporting dualism: the physical world could exist unchanged without consciousness.  

  2. **Physicalist Block Using the Injected Feature**  
     The physicalist targets **reflective dependence** (the Twin's causally inert, externally determined physical states). They argue this feature breaks the analogy to normal humans. Consciousness requires not just physical states but *intrinsic causal organization*—self-generated processes where neural activity arises from internal biological mechanisms (e.g., feedback loops, metabolic sustainability). The Twin lacks this, so it’s not a true functional duplicate; it’s a parasitic entity with no "machinery" for consciousness. Thus, its conceivability doesn’t generalize to metaphysically possible zombies in our world, where causal organization is intrinsic. The physicalist isn’t appealing to "physics being complete" but to a structural gap: reflective dependence violates the causal continuity essential to physicalist models of mind.  

  3. **Collapse Without the Feature**  
     If we strip away reflective dependence—making the Twin self-sustaining with internal causal processes—the scenario reverts to the standard zombie argument. The dualist can then insist we still conceive of it lacking consciousness, and the physicalist loses their non-question-begging objection. They’d have to either deny conceivability (e.g., "you only think you conceive it!") or argue conceivability doesn’t imply possibility—both weaker moves that beg the question against dualism.  

  ### Dualist Counterattack  
  A dualist would argue that reflective dependence smuggles in physicalism by *assuming* consciousness requires intrinsic causation. They’d reject this as circular: "You’re defining physicalism into the feature! Consciousness could supervene on current physical states alone, regardless of causal history. If the Twin’s brain *is* physically identical at every instant, it must have identical conscious states—causal origins are irrelevant." This exposes the crux: physicalists tie consciousness to dynamic organization; dualists tie it to static state identity.  

  ### Verdict: Reflective dependence (causally inert, externally determined physical states)
