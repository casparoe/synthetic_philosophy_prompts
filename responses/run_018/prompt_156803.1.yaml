prompt: |-
  I'm a software engineer with no formal philosophy background, currently specifying a preference-aggregation module for an autonomous decision system. I need a classification instrument—specifically a decision tree or taxonomy—that sorts positions on coherent extrapolated volition and idealized preferences, but framed in terms of architecture choices rather than academic labels. To keep the problem from being answered by lifting a standard encyclopedia entry, inject the "tight versus loose culture" distinction (how strictly a system should preserve existing preference structures versus allowing radical restructuring) as one explicit axis, crossed with the scope of extrapolation and whether idealization can revise ends or only means.

  Deliver the response in exactly these sections, in this order:

  1. Engineering framing (approx. 150 words): State the practical design problem—an autonomous system must determine what its users "would want" if more informed, more coherent, and less constrained by immediate impulse—and explain why standard philosophical labels don't help a builder choose an implementation architecture.

  2. The branching instrument (approx. 450 words): Present a decision tree with four nodes, each phrased as a concrete design choice answerable without knowing philosophical terminology. Node 1 must split scope: single user, bounded collective, or open-ended future generations. Node 2 must split the target of idealization: correction of instrumental reasoning and beliefs only, or also revision of fundamental values. Node 3 must apply the tight/loose axis: tight rules that penalize deviation from current core preferences, or loose rules that permit restructuring the preference graph. Node 4 must split interdependence: coherence computed agent-by-agent, or requiring consistency with others' extrapolated preferences. For each node, label the branch by the claim that splits it, and map out the logical combinations of answers.

  3. Leaf taxonomy (approx. 350 words): Assign each occupied combination to either a named position or tradition in the CEV / idealized-preference literature, or mark it "unnamed." For every named leaf, provide one sentence describing its most awkward engineering commitment. Then identify at least two unoccupied combinations in the logical space and briefly diagnose each: is it incoherent, unattractive for implementation, or merely unexplored? Finally, flag any pair of named positions that this tree cannot cleanly separate, explaining why they collapse onto the same branch.

  4. Diagnostic caveats (approx. 150 words): Note where the tree forces false binaries, which distinctions matter more for system design than for philosophical debate, and briefly defend why the tight/loose revision axis is a useful injection even though it is not standard in the CEV literature.

  Constraints: Do not include bibliographies, reading lists, or citations. Do not quote any specific philosopher or text verbatim—paraphrase without quotation marks. Do not depend on obscure theories or highly specific facts that a small language model without web access would not have reliably memorized; stick to the general logic of preference extrapolation, coherence conditions, and the tight/loose framing. Write in formal, polished English appropriate for a technical specification document.
