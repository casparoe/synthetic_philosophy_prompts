  For each thesis, I need to assess whether it's obvious (platitude), arguable (contestable), or incorrect (false). The literal destruction point is undeniable—it's a platitude. The means/ends question is deeply philosophical—contestable. The institutional claim depends on how you view organizations like NATO—also contestable. The inevitable-harm argument is probably false because consequences vary case by case.

  Now, which readings actually condemn all three interventions? The platitude doesn't—it just says bombs destroy, not that interventions can't be justified. The intentionality thesis might condemn them if you believe violence can't serve humanitarian ends, but it's not automatic. The institutional view would condemn them if you distrust military actors. Only the strongest consequentialist claim ("always worse") condemns all three unconditionally—but that's likely false or at least oversimplified.

