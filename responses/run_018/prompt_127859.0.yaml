   (3) So imagine a synthetic minimal cell with a second-order loop: one gene encodes its own polymerase. The genome can now encode a Gödel sentence saying "this genome is never consistently replicated."
   (4) By Gödel's reasoning, that sentence is true but unprovable inside the system; the cell can't repair it using only its own machinery.
   (5) But actual synthetic cells with proofreading and mismatch repair do correct replication errors, including in self-encoding regions.
   (6) So either those cells are logically inconsistent, or they aren't Gödel-complete formal systems.
   (7) If they aren't Gödel-complete, then the DNA-Gödel isomorphism fails not just for synthetic loops but for natural genomes too, since natural ones also have proofreading.
