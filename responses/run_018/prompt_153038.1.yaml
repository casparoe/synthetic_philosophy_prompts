prompt: |-
  I am writing a feature on the philosophy of consent for a science and ideas magazine, and I want to test whether my own intuitions cohere into a principle or collapse under scrutiny. Below are six concrete cases mixing deception, coercion, and competence in combinations that standard clinical-ethics frameworks rarely address together; I have given my gut verdict on each.

  Case 1: A cardiologist describes a stent procedure accurately except for omitting a 2 per cent risk of permanent nerve damage, judging that the patient—fully competent and not under duress—would refuse a life-saving intervention if told. The patient consents. Verdict: invalid, because the omission is both deceptive and material.

  Case 2: A sleep-study recruiter tells volunteers they will ‘help science and earn £200’, but does not disclose that participation requires seventy-two hours of continuous wakefulness with only brief naps. The volunteers understand the study concerns sleep, are competent, and face no coercion. Verdict: invalid; the framing conceals the true nature of the burden.

  Case 3: A gig worker with no savings is offered £2,000 to take part in a two-week trial of a new appetite suppressant. She reads the full consent form, understands the cardiac risks, is not deceived, and says she ‘has no real choice’ because rent is due, yet she can physically walk away. Verdict: valid; economic necessity does not, by itself, vitiate autonomy when information is complete.

  Case 4: A prisoner is offered six months off his sentence in exchange for joining a trial of an experimental anxiety medication. He reads the form, understands the 1 per cent psychosis risk, and is fully competent. Verdict: invalid; state-backed punishment relief functions as coercion in a way private financial pressure does not.

  Case 5: An elderly man with early-stage Alzheimer’s—still passing standard competence assessments—is asked by his daughter to consent to post-mortem brain donation for research. She explains everything honestly, appeals to their bond, and he agrees partly to please her. Verdict: valid; emotional influence within close relationships does not invalidate consent if competence and disclosure are intact.

  Case 6: A cognitively typical university student is persuaded by an intense online community to undergo an elective, irreversible, legal-but-unregulated neuro-modulation procedure. He researches the risks extensively, is not deceived, and admits he ‘would never have considered it without the group’s relentless encouragement’. I keep reversing myself: sometimes this feels like valid adult autonomy, sometimes like a social cascade that functions as coercion.

  Is there a single principle—or a small, precisely stated family of them—that captures Cases 1 through 5 and delivers a clear verdict on Case 6? If so, please state it precisely, indicate which clause is motivated by which case, and say what it predicts for an unlisted scenario: a surgeon discovers an unexpected tumour during an operation and asks the patient’s designated digital proxy—an AI agent trained on the patient’s prior values—for consent to remove it. If no single principle saves all five verdicts, please identify the simpler account, state which of my verdicts it forces me to abandon, and explain whether the abandoned verdict is the outlier. Please write your answer in British English, avoid bibliographic references or reading lists, and do not cite specific authors or texts by name; I am interested in the argument, not the citation.
reasoning: |-
  Hmm, this is a sophisticated philosophical challenge about consent ethics. The user presents six nuanced cases where standard clinical ethics frameworks seem inadequate, and wants to test whether their intuitive verdicts can be unified under a coherent principle. 

  Noticing how Cases 1-2 hinge on informational defects (material omissions), Case 3-4 on pressure types (economic vs state-coercion), and Case 5-6 on social influences. The Alzheimer's case is particularly tricky - competence here seems borderline despite passing tests, and emotional influence walks the line between valid relational autonomy and undue pressure. 

  For Case 6, I'm torn too. The student's thorough research suggests autonomy, but the irreversible nature plus group dynamics raise cult-like concerns. This exposes a gap in my proposed principle - it doesn't adequately address how social environments can distort decision-making processes without classic coercion. 

  The AI proxy scenario is brilliantly futuristic. My principle would likely validate it if the AI truly replicates patient's values (non-deceptive, no new pressure), but it raises fresh questions about whether algorithms can capture embodied human decision-making. 

  User's clearly done deep thinking here - their verdicts show consistent weighting of information integrity and power asymmetries. If they reject my principle's verdict on Case 3, they'd need to argue that extreme poverty creates coercion comparable to prison, which would force redefining "voluntariness" beyond physical freedom. That might actually strengthen the framework's consistency.
answer: |-
  Here’s a unified principle capturing your verdicts for Cases 1–5, resolving Case 6, and addressing the proxy scenario:

  **The Voluntariness and Epistemic Integrity Principle:**  
  *Consent is valid only if:  
  (A) It is given without material deception or omission regarding burdens, risks, or alternatives (Epistemic Integrity);*  
  *and*  
  *(B) It arises from a choice free of institutional coercion (understood as threats intentionally leveraged by state or quasi-state actors to compel compliance), even if other pressures exist (Voluntariness Constraint).*

  ---

  **Application to Cases 1–5 & Case 6:**  
  1.  **Case 1:** Violates (A). Omitting a material risk (nerve damage) is deceptive by omission. *Invalid.*  
  2.  **Case 2:** Violates (A). Framing obscures the true burden (extreme sleep deprivation), a material omission. *Invalid.*  
  3.  **Case 3:** Satisfies (A) & (B). Full disclosure exists. Economic pressure, while severe, is not *institutional coercion* (B is narrowly defined). *Valid.*  
  4.  **Case 4:** Violates (B). Sentence reduction is an *institutional threat/inducement* wielded by the state, creating coercive voluntariness. *Invalid.*  
  5.  **Case 5:** Satisfies (A) & (B). Full disclosure exists. Familial appeal is influence, not deception or institutional coercion. Competence is met. *Valid.*  
  6.  **Case 6:** **Invalid** under this principle. While (A) is satisfied (no deception, adequate research), (B) is not violated *if* the group isn't a state/quasi-state actor. However, the core issue is **outside** the scope of (A) and (B): *The principle doesn't fully capture distortions of autonomy from non-coercive but overwhelming social manipulation.* This reveals a gap.  
      *   **Resolution:** Case 6 exposes a need for a third clause or clarifies (B). Under the *stated* principle, it technically satisfies (A) & (B) and would be *Valid* (as the pressure isn't "institutional"). However, your intuition reflects a flaw in the principle's scope. To align with your unease, we could refine (B) slightly:  
          *(B) It arises from a choice free of institutional coercion OR non-physical compulsion that fundamentally undermines rational evaluation (e.g., cult indoctrination).*  
          With this refinement, Case 6 becomes *Invalid* due to "relentless encouragement" acting as compulsion undermining rational evaluation.

  ---

  **The Unlisted Scenario (AI Proxy & Tumour):**  
  *   **Prediction:** Consent via the AI proxy is **valid** under the principle.  
  *   **Reasoning:**  
      *   *(A) Epistemic Integrity:* Assuming the AI accurately reflects the patient's *own* prior values and understanding (the core function of a well-designed proxy), its decision is based on the patient's authentic epistemic framework. There is no *new* deception or omission by the surgeon *to the proxy*. The tumour discovery is new information, but the proxy uses the patient's pre-defined values to evaluate it.  
      *   *(B) Voluntariness Constraint:* The AI acts solely as the patient's delegate. There is no coercion exerted *on* the AI (it has no interests to coerce) or *by* the AI (it applies the patient's will). The institutional actor (surgeon/hospital) is transparently seeking authorisation via the patient's chosen mechanism.  

      *   **Caveat:** Validity depends entirely on the AI *truly* being a reliable executor of the patient's known prior values and wishes regarding unforeseen medical decisions. If the AI acts outside this scope (e.g., introduces bias, "hallucinates" values), (A) is violated.

  ---

  **Assessment of the Principle:**  
  1.  **Captures Cases 1-5:** Yes, neatly. Clauses (A) and (B) directly map to your verdicts.  
  2.  **Case 6:** Reveals a limitation. The principle as initially stated *overlooks severe non-institutional, non-deceptive manipulation*. Your intuition that it might be invalid is sound and exposes the need to either:  
      *   Refine (B) to include "compulsion undermining rational evaluation" (making Case 6 *Invalid*), or  
      *   Acknowledge a separate category for "autonomy-undermining social pressure" not covered by (A) or (B).  
  3.  **Simplicity:** The core principle (A & B) is relatively simple and covers the critical distinctions you made (deception vs. non-deception, economic pressure vs. state coercion). Case 6 highlights that "voluntariness" is complex beyond institutional threats.  
  4.  **Outlier?** None of your verdicts for Cases 1-5 are true outliers; they cohere logically under (A) and (B). Case 3 (valid) and Case 4 (invalid) show the crucial distinction defining institutional coercion. Case 6 is the anomaly *for the principle*, not your verdict.

  **Conclusion:** The Voluntariness and Epistemic Integrity Principle (with its narrow definition of coercion for (B)) robustly explains your verdicts in Cases 1-5 and handles the AI proxy scenario. Case 6 demonstrates that while powerful social pressure can *feel* coercive, it doesn't neatly fit the *institutional* coercion defined in (B), suggesting the principle might benefit from refinement or an acknowledgment of its limits regarding non-rational influences on decision-making. Under the strict principle, Case 6 is *Valid*; refined to include autonomy-undermining compulsion, it becomes *Invalid*. Your reversal reflects the genuine philosophical tension here.
