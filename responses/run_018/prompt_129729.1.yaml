prompt: |-
  I just got out of a long argument with my friend about newsrooms calling politicians liars, and she kept invoking Hannah Arendt like it was a mic drop — said Arendt thinks lying in politics is totally different from ordinary lying but couldn't explain how. Anyway, I work as a standards editor at a regional news site and we have to make these calls like twice a week, usually with fifteen minuts before deadline. I need a practical decision proceedure my team can actually run: a step-by-step checklist that takes Arendt's actual distinctions — the gap between hiding one particular fact and trying to replace the whole factual world, the self-deception part where the speaker starts believing their own fabrication, and whether there's an organized apparatus pushing the falsehood — and turns them into questions we ask in order. For each step I need to know what counts as a sufficient answer, where the proceedure stops and hands the decision to a person because it's a values call about whether we actually print the word "lie" in a headline, and where it's purely factual. Then apply it to three cases: a senator who knowingly gives the wrong unemployment number in a speech; a campaign that manufactures fake voter rolls as part of a broader narrative about a stolen election; and a mayor who genuinely believes a false economic theory and keeps citing it in good faith. Make sure one of them comes out technically a "lie" by the checklist but the proceedure flags that using the word in our copy is still a judgment call we shouldn't automate. Also tell me exactly what this proceedure can't do — like when Arendt's framework just doesn't apply because there's no organized reality-substitution going on. End the whole thing with Bottom line: [one sentence].
