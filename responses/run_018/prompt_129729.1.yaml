  Okay, let me unpack this user's request. They're a standards editor at a regional news site dealing with the practical dilemma of when to call politicians "liars" - a decision they face multiple times weekly under tight deadlines. Their friend invoked Hannah Arendt's ideas about political lying but couldn't explain them, so now they need an actionable checklist rooted in Arendt's actual distinctions. 

  Hmm, the core challenge here is translating Arendt's complex philosophical concepts - like "factual world replacement" and "organized lying apparatus" - into practical journalistic decision points. The user specifically wants three elements addressed: (1) hiding single facts vs constructing alternative realities, (2) self-deception in false statements, and (3) institutionalization of lies. 

  For the procedural design, I'll need to create threshold questions that reflect Arendt's framework but yield binary outputs where possible. The unemployment example should test "knowing falsehood," the fake voter rolls case must demonstrate "organized reality substitution," while the mayor scenario will showcase "good faith exception." Crucially, the checklist needs clear off-ramps where human judgment takes over - like when all factual criteria for "lie" are met but editorial discretion might still avoid the term.

  *scribbles structure*
  The procedure should flow: factual verification → intent assessment → organizational context → self-deception check. Each step needs defined sufficiency standards: e.g., "intent confirmed" requires either contemporaneous evidence or pattern of behavior. The mayor case will be the example where technical criteria are met (he persists after corrections) but "lie" feels inappropriate due to genuine belief.

  *notes limitations*
  Must emphasize that Arendt's framework doesn't cover: accidental errors, hyperbolic statements, or isolated lies without systemic intent. The bottom line needs to capture that institutional lying is the real threat - which ironically means journalists should use "lie" sparingly to preserve its power against organized reality-distortion machines.
answer: |-
  Here’s a practical, Arendt-based decision procedure for your newsroom, designed for speed and clarity. It prioritizes **verifiable facts** and **systemic patterns** over isolated incidents, with clear off-ramps for editorial judgment.

  ---

  ### **The Arendt Checklist for "Lie" Attribution**  
  *(Run in order—stop if any step fails)*  

  1. **VERIFICATION OF FALSEHOOD**  
     *Question: Is the statement demonstrably, materially false based on current, accessible evidence?*  
     - **Sufficient Answer:** Official data, primary documents, or unambiguous expert consensus contradict it.  
     - **Factual Threshold:** Purely objective. If "no," stop—do not proceed to "lie."  
     - *Example (Senator):* Unemployment stat contradicts BLS report → **Yes.**  
     *Example (Mayor):* Economic theory is disproven by mainstream economics but isn’t a "fact" → **No.**  

  2. **KNOWING FALSEHOOD**  
     *Question: Is there credible evidence the speaker knew/was briefed it was false?*  
     - **Sufficient Answer:** Contemporaneous records (emails, briefings), prior acknowledgments, or repeated corrections ignored.  
     - **Judgment Call:** If evidence is circumstantial (e.g., they *should* know), flag for editorial review.  
     - *Example (Senator):* Staff email shows they were corrected pre-speech → **Yes.**  
     *Example (Campaign):* Leaked memo ordering creation of fake rolls → **Yes.**  

  3. **ORGANIZED REALITY-SUBSTITUTION**  
     *Question: Is the falsehood part of a coordinated effort to replace verifiable reality?*  
     - **Sufficient Answer:** Involves sustained narrative, multiple actors/agencies, suppression of counter-evidence, or parallel deceptive actions (e.g., fake documents).  
     - **Factual Threshold:** Requires proof of coordination (not just repetition).  
     - *Example (Campaign):* Fake rolls + disinformation ops + legal threats to auditors → **Yes.**  
     *Example (Senator):* One-off error, no apparatus → **No.**  

  4. **SELF-DECEPTION ASSESSMENT**  
     *Question: Could the speaker genuinely believe this, despite evidence?*  
     - **Sufficient Answer:** Documented ideological commitment, reliance on fringe sources, or rejection of expertise.  
     - **Judgment Call:** If "yes," the term "lie" may be inaccurate—but still **proceed** if Steps 1-3 pass (Arendt: self-deception enables systemic lying).  
     - *Example (Mayor):* Cites debunked theory for years, ignores experts → **Yes** (self-deception likely).  
     *Example (Campaign):* Fabricated documents can’t be believed in good faith → **No.**  

  ---

  ### **Output Rules**  
  - **"Lie" Permitted:** Only if **all 4 steps pass**.  
  - **"False" or "Incorrect":** If Step 1 passes but others fail.  
  - **Editorial Judgment Required:** When Step 2 or 4 is ambiguous, or if Step 3 passes but context makes "lie" inflammatory despite meeting criteria.  

  ---

  ### **Case Applications**  
  1. **Senator (Wrong Unemployment Stat)**  
     - Step 1: **Yes** (data disproves).  
     - Step 2: **Yes** (briefing docs show knowledge).  
     - Step 3: **No** (isolated incident).  
     - Step 4: **No** (no self-deception evidence).  
     → **Headline:** "Senator repeats false unemployment figure" (*not* "lie"—fails Step 3).  

  2. **Campaign (Fake Voter Rolls)**  
     - Step 1: **Yes** (rolls proven fabricated).  
     - Step 2: **Yes** (evidence of intent).  
     - Step 3: **Yes** (part of broader "stolen election" apparatus).  
     - Step 4: **No** (manufactured evidence isn’t self-deceptive).  
     → **Headline:** "Campaign lied in voter fraud narrative, documents reveal" (**"lie" permitted**—all steps pass).  

  3. **Mayor (False Economic Theory)**  
     - Step 1: **Yes** (theory disproven).  
     - Step 2: **No** (no proof they know it’s false).  
     - Step 3: **No** (no apparatus).  
     - Step 4: **Yes** (genuine belief likely).  
     → **Headline:** "Mayor cites debunked economic theory" (*Stop at Step 2*—no "lie").  
     - ***Special Case: If Step 2 passes*** (e.g., economists briefed mayor weekly):  
       → All steps pass *technically*, but **Step 4 triggers editorial judgment**. Self-deception blurs intent → Use "false" unless harm is systemic.  

  ---

  ### **What This Can’t Do (Arendt’s Limits)**  
  - **Handle accidental errors** (use "false" or "incorrect").  
  - **Address hyperbolic rhetoric** (e.g., "worst policy ever").  
  - **Judge lies outside organized systems** (e.g., a one-off personal scandal).  
  - **Resolve disputes about contested evidence** (e.g., intelligence ambiguities).  

  ---

  **Bottom line:** Arendt compels us to reserve "lie" for *systemic, intentional campaigns to dismantle shared reality*—not mere inaccuracies or sincere delusion.
