answer: |-
  Here’s an example addressing the conceptual tension within endurantism when applied to a purely relational, diachronic entity like a "rolling mandate":

  ### Case: The Rolling Mandate
  - **Structure**: A regulatory authority (e.g., "Oversight Commissioner") rotates every year between entirely distinct individuals. Each occupant:  
    (a) Has no material/spatial continuity with predecessors (e.g., lives in a different country, uses no shared objects).  
    (b) Exercises identical powers (e.g., auditing rights, veto authority) defined solely by the institutional role.  
    (c) Is selected by a rule (e.g., "the current chair of a rotating committee").  
  - **Diachronic Identity**: The *mandate itself* persists as one entity across time, recognized legally and functionally as continuous despite complete occupant turnover.

  ---

  ### Endurantist Problem: Wholly Present but Contradictorily Properited
  Endurantism holds that the mandate is **wholly present** at each moment it exists. At time *t₁*, it is wholly constituted by occupant Alice; at *t₂*, wholly constituted by occupant Bob. This leads to three incoherencies:

  1. **Contradictory Properties**:  
     - At *t₁*, the mandate has the intrinsic relational property *being-held-by-Alice*.  
     - At *t₂*, it has *being-held-by-Bob* (and not-Alice).  
     Since endurantism denies temporal parts, the *same whole entity* must possess both properties at different times, violating **Leibniz’s Law** (if *x* is identical to *y*, *x* and *y* share all properties). The mandate cannot be "wholly Alice" and "wholly Bob" without contradiction.

  2. **Fragmentation vs. Persistence**:  
     - If the mandate’s properties at each stage are essential to its identity, each rotation creates a *new entity*. This fragments the mandate into a series of disconnected roles (e.g., "Mandate-Alice," "Mandate-Bob"), denying genuine persistence.  
     - But if the mandate *does* persist, endurantism must explain *how* it remains identical when its relational essence (its occupant-relation) changes entirely. Material continuity (e.g., Theseus’ ship) can’t resolve this—there *is* no substrate.

  3. **Requirement of Immaterial Essence**:  
     Endurantism might posit an abstract "essence" (e.g., *the office itself*) transcending occupants. However:  
     - This essence lacks intrinsic properties beyond its structural role, reducing it to a bare particular.  
     - It violates endurantism’s commitment to entities being *concretely* wholly present—the "essence" is never materially instantiated at any single stage.  

  **Core Tension**: Endurantism’s denial of temporal parts forces it to either:  
  - Accept contradictory properties in a single entity (violating logic),  
  - Deny persistence (fragmentation), or  
  - Appeal to dubious immaterial continuity (undermining its materialist commitments).  

  ---

  ### Perdurantist Resolution: Temporal Parts as the Solution
  Perdurantism treats the mandate as a **four-dimensional space-time worm** composed of temporal parts (each occupant-stage). Thus:  
  - The mandate at *t₁* is a temporal part (Alice-stage).  
  - The mandate at *t₂* is a *different* temporal part (Bob-stage).  
  - The *whole mandate* is the fusion of all stages, united by the *diachronic relational structure* (the rules governing succession).  

  No contradiction arises:  
  - Properties like *being-held-by-Alice* apply only to the *t₁*-part, not the whole.  
  - Persistence is defined by causal-historical connectedness of parts (e.g., selection rules), not material continuity.  

  ---

  ### Key Distinction from the Ship of Theseus
  Unlike the Ship of Theseus (where material parts persist but change), the rolling mandate has **zero material or spatial continuity**. The tension arises purely from endurantism’s inability to reconcile:  
  - Strict numerical identity (one entity wholly present at all times),  
  - Complete relational property change (no enduring "substance"),  
  - The absence of temporal parts to compartmentalize contradictory properties.  

  This highlights how endurantism struggles with *structurally defined entities* (rights, roles, software processes) whose persistence relies solely on formal or causal relations across time.
