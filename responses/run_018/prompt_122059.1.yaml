prompt: |-
  So I'm writing a novel — a retired logic tutor, her ex-student who keeps badgering her to be *shown* that modus ponens is valid, and she eventually just refuses to play, says it's a skill like riding a bike and skills aren't the sort of thing you can demand a justification for. I wrote out the argument she'd give if she were being honest with herself and now I think it proves way too much, but I can't find the bad step:

  (1) Whatever justification is, it can't just be a matter of having more true beliefs on hand: for any premises and any conclusion you like, you can accept all the premises, accept the conditional that links them to the conclusion, and still not budge. So the thing that turns a pile of accepted propositions into an inference isn't another proposition.
  (2) So the missing ingredient isn't truth-evaluable at all — it's a rule, a practice, a disposition to move a certain way given certain inputs.
  (3) A rule can't be justified by citing further rules without restarting exactly the same regress, so our grip on the basic ones has to bottom out in something we simply do, not something we've derived.
  (4) If it bottoms out in what we simply do, then nothing internal to the practice marks modus ponens as correct and, say, affirming the consequent as incorrect; "correct" can only mean "ours."
  (5) By the same reasoning, a community whose basic practice licensed moving straight from any premise to its own negation, or who just skipped the middle step and never felt the need for one, would be reasoning exactly as well as we are — calling them irrational would be pure parochialism, like mocking someone's table manners.
  (6) That's nuts. Some inferences really are better than others, and I want my tutor to be able to tell the student *something* true in the last chapter.

  Which step do I junk? I'd much rather keep (1) and (2) than (5), and I'd like to keep (6) no matter what. Also tell me what the bad step was doing that made it look innocent — whether it's smuggling in a slide I can't see or just a premise that costs less than I think — and what each alternative would cost me: in particular, is there a version where the tutor stays silent and is still in the right, or does rejecting any of these force her to actually give the student an argument after all? Under 400 words, please, and don't spend half of them telling me about Wittgenstein.
reasoning: |-
  Okay, the user is writing a novel about a retired logic tutor and her ex-student who keeps demanding justification for why modus ponens is valid. She's constructed an argument that leads to a conclusion she finds unacceptable—that all inference rules are equally valid—and wants to know which step to discard. She prefers to keep steps 1 and 2 but drop step 5, and definitely wants to keep step 6.

  Hmm, let me analyze the argument step by step. Step 1 makes sense—just having more true beliefs doesn't force inference. Step 2 follows: the "inference engine" must be non-propositional. Step 3 seems solid too: basic rules can't be infinitely justified. But step 4 is where it goes wrong—claiming "correct" only means "ours" ignores that rules can be evaluated by their coherence and consequences. 

  Ah! That's the problematic leap. Step 4 falsely assumes that without propositional justification, all practices are equally valid. But modus ponens preserves truth across possible worlds while affirming the consequent doesn't—that's an objective difference, even if we demonstrate it through practice rather than prove it propositionally. 

  The tutor can reject step 4 while keeping 1-3. She can say: "Our rules aren't arbitrary because they reliably preserve truth. Try affirming the consequent in real life—it'll burn you. That's the 'justification'." This lets her stay silent about ultimate justifications while maintaining modus ponens' superiority. 

  The cost? She must accept that rationality is partly defined by success in navigating reality, not just social agreement. But that's better than relativism. And crucially, she doesn't need to give a propositional proof—just point to the rule's track record. Perfect for the novel's resolution.
answer: |-
  Here's the bad step: **Step (4)**. It smuggles in a false dilemma: *either* justification is propositional *or* "correct" is purely conventional/arbitrary.

  **Why (4) is wrong:**
  *   Steps (1)-(3) correctly argue that basic inferential dispositions aren't *propositionally justified* (you can't prove them from more basic truths). They are indeed "what we do".
  *   However, (4) incorrectly assumes that because they aren't propositionally justified, there's *no standard* by which one practice (modus ponens) could be objectively better than another (affirming the consequent). This ignores that the *consequences* of the practice itself can provide a standard.
  *   Modus ponens *preserves truth*: If your premises are true, the conclusion *must* be true. Affirming the consequent does not. A practice that systematically preserves truth when applied to true premises is objectively better for navigating the world and forming true beliefs than one that doesn't. This "better" isn't arbitrary convention; it's grounded in the relationship between the rule, truth, and successful interaction with reality.

  **The cost of junking (4) & keeping (1)-(3), (6):**
  *   **Tutor Wins (Silently):** You keep (1)-(3): Inference rests on non-propositional dispositions/practices that can't be propositionally justified without regress. The tutor can refuse to give a "proof" – it *is* like a skill.
  *   **Avoid Relativism (Satisfies (6)):** You reject (4) and thus avoid the absurd relativism of (5). Modus ponens *is* objectively better *as an inference rule* than affirming the consequent *because* it reliably preserves truth. Calling the latter "irrational" isn't just parochialism; it's recognizing its failure to reliably connect truth.
  *   **What the Tutor Can Say (Optionally):** The tutor *doesn't need* to give a regress-stopping propositional proof. She can point to the *consequence*: "We use modus ponens because it *works*. If your premises are true, it *guarantees* a true conclusion. Try building anything – bridges, relationships, coherent thoughts – using affirming the consequent reliably. You can't. *That's* the 'justification' – its success in preserving truth." This points to the rule's *reliability*, not a deeper proposition. She can still refuse to play the "prove it from nothing" game.

  **What made (4) look innocent?** It conflated the *source* of our basic grip (practice/disposition) with the *standard* for evaluating practices (their truth-preserving reliability). Just because the source is practical doesn't mean the standard is merely conventional.
