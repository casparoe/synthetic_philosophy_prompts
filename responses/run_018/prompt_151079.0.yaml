  For the memo tone: respectful but decisive. Acknowledge the deadlock, validate both views, then pivot to a hybrid solution. Stress that norms matter for institutions like guilds—their choices ripple in artistic communities. 

  Biggest challenge: making "modeling norm refusal" feel substantive, not vain. Tie it to their mission—writers shape culture, so their operational choices should align with that. Also, give the losing side (pro-status quo) concrete responses: e.g., "We heard you, so we added direct action." 

