answer: |-
  Below is a decision tree designed to guide users from no prior stance to a named position in modal epistemology, focusing on conceivability as a guide to possibility. It incorporates your requirements: covers modal skepticism, Kripkean necessitarianism, two-dimensionalism, modest modal rationalism, and localism; includes your "asymmetry" and "possibility drift" nodes; uses identity and consciousness cases; and avoids forcing positions based on preexisting "-ism" preferences. Each node is a question answerable without knowing the outcome.

  ---

  ### **Modal Epistemology Decision Tree**

  **Start:** You encounter a claim like "Water isn't H₂O" or "A physical duplicate of our world lacks consciousness." Can conceivability ever tell us about *possibility*?  
  → *Proceed to Q1.*

  #### **Q1: Does conceivability (in any form) provide evidence for possibility?**  
  - **No** → **Modal skepticism**  
    - *Illustration:* Conceiving of zombies (consciousness-less physical duplicates) or Hesperus ≠ Phosphorus tells us nothing about what’s possible. Conceivability is unreliable due to cognitive limitations or lacks a constitutive link to modality.  
    - *Position:* Conceivability carries little-to-no modal weight.  
  - **Yes** → *Proceed to Q2 (Asymmetry).*

  #### **Q2 (Asymmetry): Is failure to conceive of P evidence that P is impossible?**  
  - **No** (Asymmetric view) → *Proceed to Q5 (Domain Specificity).*  
    - *Illustration:* Conceiving zombies *supports* zombie-possibility, but *failing* to conceive of 2 + 2 = 5 doesn’t prove its impossibility—we might lack imagination, not insight.  
  - **Yes** (Symmetric view) → *Proceed to Q3 (Kripkean Cases).*

  #### **Q3 (Kripkean Cases): Are there conceivable impossibilities?**  
  - **No** → **Strong Symmetric Rationalism**  
    - *Illustration:* Hesperus ≠ Phosphorus *is* metaphysically possible—identity statements aren’t necessary. (Rare view; most reject it as it denies a posteriori necessities).  
  - **Yes** → *Proceed to Q4 (Explaining Impossibility).*  
    - *Illustration:* Hesperus ≠ Phosphorus is conceivable (we imagine distinct celestial bodies) but impossible (they’re identical).  

  #### **Q4 (Explaining Impossibility): Why are some conceivable things impossible?**  
  - **Non-ideal Epistemic State** → *Proceed to QX (Possibility Drift).*  
    - *Illustration:* We conceive Hesperus ≠ Phosphorus only because we lack empirical knowledge (e.g., astronomy). With full facts, we’d see the necessity.  
  - **Two Kinds of Possibility** → *Proceed to QX (Possibility Drift).*  
    - *Illustration:* Zombies are *primarily* possible (via ideal a priori reflection) but may be *secondarily* impossible (given actual-world physics). Hesperus ≠ Phosphorus is primarily conceivable but secondarily impossible.  

  #### **Q5 (Domain Specificity): Is the conceivability-possibility link domain-restricted?**  
  - **Yes** → *Proceed to QX (Possibility Drift).*  
    - *Illustration:* Link holds for consciousness (zombies suggest possibility) but not chemistry (water ≠ H₂O is conceivable but impossible) or math.  
  - **No** (General but asymmetric) → *Proceed to QX (Possibility Drift).*  

  #### **QX (Possibility Drift):**  
  *Suppose studies show sustained a priori reflection expands conceivable scenarios (e.g., new zombie variants or math structures) without tracking actual modality (e.g., drift occurs for consciousness cases). Does this threaten the conceivability-possibility link?*  
  - **For "Non-ideal Epistemic State" (Q4)**:  
    - **Yes** → **Kripkean Line** (but weakened; drift shows conceivability is doubly unreliable).  
      - *Position:* Conceivability is defeasible evidence, but a posteriori necessities (like Hesperus/Phosphorus) and drift undermine it further.  
    - **No** → **Kripkean Line** (standard).  
      - *Position:* Drift is irrelevant; conceivability fails only against a posteriori necessities (e.g., identity cases).  
  - **For "Two Kinds of Possibility" (Q4)**:  
    - **Yes** → **Two-dimensionalism** (modest).  
      - *Position:* Drift challenges ideal primary conceivability; it’s only defeasible evidence for primary possibility.  
    - **No** → **Two-dimensionalism** (standard).  
      - *Position:* Ideal primary conceivability *defines* primary possibility; drift is part of refining toward unchallengeable truths.  
  - **For "Domain-Restricted" (Q5)**:  
    - **Yes** → **Modest Localism**.  
      - *Position:* Conceivability is defeasible evidence in privileged domains (e.g., consciousness). Drift threatens but doesn’t destroy its limited use.  
    - **No** → **Localism**.  
      - *Position:* In domains like consciousness, ideal conceivability is an infallible guide to possibility; drift is pre-ideal noise.  
  - **For "General but Asymmetric" (Q5)**:  
    - **Yes** → **Modest Modal Rationalism**.  
      - *Position:* Conceivability is defeasible evidence (no constitutive link); drift is a defeater.  
    - **No** → **Constitutive Asymmetric Rationalism**.  
      - *Position:* Ideal conceivability of P implies P’s possibility (constitutive link), but failure to conceive doesn’t imply impossibility. Drift is irrelevant—idealization targets unchallengeability.  

  ---

  ### **Logical Space & Coverage**
  - **Positions Mapped**:  
    - Modal Skepticism (Q1→No).  
    - Kripkean Line (Q3→Yes + Q4→Non-ideal + QX→No).  
    - Two-dimensionalism (Q3→Yes + Q4→Two Kinds + QX→No).  
    - Modest Modal Rationalism (Q2→No + Q5→No + QX→Yes).  
    - Localism (Q2→No + Q5→Yes + QX→No).  
  - **Additional Leaves**:  
    - Strong Symmetric Rationalism (Q3→No): Denies Kripkean cases; rare/unattractive (ignores a posteriori necessities).  
    - Modest Localism (Q2→No + Q5→Yes + QX→Yes): Local but defeasible; underdiscussed but coherent.  
    - Constitutive Asymmetric Rationalism (Q2→No + Q5→No + QX→No): Conceivability constitutes possibility but asymmetric; e.g., Chalmers (without 2D framework).  
  - **Unoccupied Combinations**:  
    - Q3→Yes + Q4→Non-ideal + QX→Yes: "Weakened Kripkean." Coherent but unstable—drift plus a posteriori defeaters risk collapsing into skepticism.  
    - Symmetric + Local (Q2→Yes + Q5→Yes): Logically possible but rare; no major theorist holds this.  
  - **Indistinguishable Pairs**:  
    - Standard Kripkean vs. Weakened Kripkean: Separated only by drift response.  
    - Standard 2D vs. Modest 2D: Separated only by drift response.  

  ### **Key Features**  
  1. **Asymmetry Node (Q2)**: Isolates positions that accept conceivability as evidence for possibility but reject its failure as evidence for impossibility.  
  2. **Possibility Drift Node (QX)**: Distinguishes truth-conducive idealization (drift is a defeater) from constitutively defined idealization (drift is irrelevant).  
  3. **Illustrations**: Uses Hesperus/Phosphorus (identity) and zombies (consciousness) throughout.  
  4. **No -ism Steering**: Questions reference concrete cases, not abstract commitments.  

  This tree maps the logical space first, then locates positions, flags gaps (e.g., Strong Symmetric Rationalism), and avoids false distinctions. Use it to guide discussions in your reading group!
