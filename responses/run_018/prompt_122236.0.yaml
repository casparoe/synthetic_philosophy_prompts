prompt: |-
  I'm prepping a session for my rationalist-adjacent meetup — mostly engineers who skim LessWrong but have zero formal ethics. I want to teach them that voting for the lesser evil isn't just a calculator move; there's a complicity gradient where your vote is causally responsible only if decisive, but symbolically responsible regardless, and the tension is between accepting that gradient and trying to wash your hands clean. Don't explain it to me — plan the teaching arc. What dependency has to be locked in first so the gradient isn't just intuitive? Use one carrying example: a ranked-choice ballot where your first pick is a perfect-but-unelectable write-in and your second is a genuinely bad but viable candidate — say exactly what properties that example needs and what it must avoid. Then map the misconceptions they'll form: "one vote never matters so there's no duty," "expressive voting is just virtue signaling," and "abstaining makes me blameless" — tell me where in the sequence each hits and how to head it off. Give me one end-of-session check that proves they grasp the gradient rather than parroting it, and say what part of voting theory I should openly refuse to cover. Write the answer in American English. (Also, I know thier's a big literature on expressive voting, but don't cite anything — I want to see if the framing stands alone.)
reasoning: |-
  Okay, let me tackle this session plan for a rationalist-adjacent meetup. The user wants to teach engineers about the complicity gradient in voting - how votes carry both causal and symbolic responsibility, even when not decisive. 

  First, I need to lock in the foundational concept: voting has two distinct functions. The causal function (instrumental voting) is about influencing outcomes, while the symbolic function (expressive voting) is about personal alignment. This dichotomy has to be established before introducing any tension or gradient. 

  For the carrying example, I'm considering a ranked-choice scenario with three candidates: 
  - Candidate A: Perfect alignment but unelectable write-in 
  - Candidate B: Genuinely bad but viable 
  - Candidate C: Worse than B but also viable
  Key properties: 
  - Must show B is actually harmful, not just imperfect 
  - Must prove A's unelectability (no bandwagon potential) 
  - Must force a clear moral gap between A and B
  Crucially avoids: 
  - False equivalence between B and C 
  - Any suggestion that voting A could help B win 

  Now for the misconceptions sequence: 
  1. "One vote never matters" will hit immediately when discussing causal responsibility. Need to preempt by distinguishing probability from moral mathematics - low odds don't erase duty. 
  2. "Expressive voting is virtue signaling" will emerge when discussing symbolic weight. Counter by framing it as integrity maintenance with personal stakes. 
  3. "Abstaining cleans hands" appears when contrasting choices. Must show abstention as passive endorsement of winner. 

  The comprehension check: Ask them to write how they'd explain the tension to someone considering abstention to avoid blame. Looking for explicit acknowledgment of both responsibility layers and why neither disappears. 

  Finally, boundaries: Avoid covering voting theory math (Condorcet, Arrow's theorem) - it distracts from the ethical focus. Also sidestep strategic voting debates to maintain clarity on the complicity gradient. 

  This structure should stand alone without citations by keeping the framing experiential: what your vote does versus what it says about you.
answer: |-
  Here's a teaching arc designed to build the complicity gradient concept from the ground up, targeting engineers with minimal ethics background:

  **Core Objective:** Lock in the **dual nature of voting** (causal outcome-shaping vs. symbolic self-positioning) *before* introducing tension or responsibility. Without this, the gradient feels like fuzzy morality.

  **The Carrying Example (Ranked-Choice Ballot Scenario)**
  *   **Properties it MUST Have:**
      1.  **Unequivocal Moral Gap:** "Bad Viable Candidate" (B) must have *objectionable, active harms* (e.g., supports policies causing demonstrable suffering, erosion of rights) vs. "Perfect Unelectable Write-In" (A) who explicitly opposes these harms. Avoid policy differences that are merely inefficient or suboptimal.
      2.  **Undeniable Unelectability:** A is a *write-in* with <1% polling/support. **Crucially:** Show polling/data proving no path to viability. Avoid minor-party candidates where "protest vote momentum" is a plausible (but false here) argument.
      3.  **Clear Lesser-Evil Dynamics:** A third, *worse* viable candidate (C) exists, making B the strategic "lesser evil". B vs. C must be unambiguous (e.g., C advocates policies *worse* than B's on the key moral dimension).
      4.  **RCV Forces Explicit Choice:** The ballot *requires* ranking. You cannot leave B blank if A is your first choice. This forces confrontation with the B-support question.
  *   **Properties it MUST Avoid:**
      1.  Policy ambiguity ("both sides are bad" relativism).
      2.  Electability uncertainty (no "maybe A could win!" hope).
      3.  Moral equivalence between A and B, or B and C.
      4.  First-past-the-post mechanics (simplifies the strategic calculus initially).

  **Teaching Arc:**

  1.  **Lock the Foundation: What Does a Vote *DO*? (15 mins)**
      *   **Activity:** Simple game theory scenario (e.g., prisoner's dilemma variant) focusing on individual actions influencing group outcomes. Highlight the *causal chain*.
      *   **Concept:** **Vote-as-Tool:** Your vote's primary causal power is influencing *who wins*. This power is concentrated entirely in being *pivotal/decisive* (changing the outcome). Probability is low per vote, but non-zero. Math: Expected utility = (Impact if Decisive) * (Prob. Decisive). *Lock in:* Low probability != Zero responsibility in causal terms.
      *   **Misconception Address (Here it Hits): "One vote never matters so there's no duty."**
          *   **Head Off:** "True, your *causal* impact is tiny per election. But if *everyone* thought that, democracy collapses. Your vote is your 'share' of the collective causal mechanism. Abandoning it isn't neutral; it's a tiny withdrawal from the system enabling the winner. Low probability doesn't erase the *type* of responsibility, just its magnitude." (Focus on *structure* of responsibility, not guilt).

  2.  **Introduce the Second Dimension: What Does a Vote *SAY*? (15 mins)**
      *   **Activity:** Non-voting analogy. "Imagine your company uses a supplier known for terrible labor practices. You must click 'APPROVE' on the quarterly contract renewal in the system. Your single click won't change the outcome (the board already decided). What does clicking 'APPROVE' *do* to *you*, regardless of outcome?"
      *   **Concept:** **Vote-as-Statement:** Your vote is a recorded act of *association* and *endorsement* within a system. It signals your values, priorities, and what you are willing to *tacitly support* to get an outcome. It's about your *integrity alignment* with the system's result. This responsibility exists *regardless of pivotality*.
      *   **Misconception Address (Here it Hits): "Expressive voting is just virtue signaling."**
          *   **Head Off:** "Calling it 'signaling' implies it's *only* for others' perception. But it's also *constitutive* – it shapes *your own* relationship to the outcome. Did clicking 'APPROVE' on that supplier contract make *you* feel complicit? That's internal, not just external. Voting for B isn't just optics; it's actively endorsing B's platform *on the record* in exchange for preventing C."

  3.  **Introduce the Tension: The Carrying Example (20 mins)**
      *   **Present the RCV Scenario:** A (Perfect Write-In, 0.2% support), B (Bad but strategically viable lesser evil), C (Worse viable candidate). Polls show B vs. C is tight; A has no chance.
      *   **The Choice:** Rank A>B>C? Rank B>A>C? Abstain? Rank only A?
      *   **Force the Conflict:**
          *   "If you rank A>B>C, you maximize expressive alignment (A). If B wins, you helped stop C. But... your ballot *recorded* support for B."
          *   "If you rank only A, you maximize expressive purity. But you *increased* the chance of C winning (by not helping B beat C)."
          *   "If you abstain, you avoid endorsing anyone... but also abandon your causal share against C."
      *   **Reinforce the Gradient:** "Complicity isn't binary. Your causal responsibility is highest if you *cause* C by not voting B, or *cause* B by being pivotal. But your *symbolic* responsibility is highest if you *directly endorse* B (ranking them high), lower if you merely *allow* B (ranking A>B), and lower still if you abstain... though abstention carries its *own* symbolic weight of disengagement. There's no spot with *zero* responsibility along this gradient."

  4.  **Confronting Abstention & Washing Hands (10 mins)**
      *   **Activity:** "Someone says: 'I refuse to carry any responsibility for B or C. I'm abstaining to keep my hands clean.' What happens to their responsibility?"
      *   **Concept:** Abstention doesn't vanish responsibility; it *shifts* its form.
          *   **Causally:** They slightly increased the chance of the worst viable outcome (C).
          *   **Symbolically:** They chose non-participation. This *is* a statement: "I wash my hands of this system/choice." But crucially, **they still live under the winner**. Non-choice doesn't absolve them of *consequences* or *association* with the community's decision. Their "clean hands" didn't stop the harm.
      *   **Misconception Address (Here it Hits): "Abstaining makes me blameless."**
          *   **Head Off:** "Does refusing to click 'APPROVE' on the supplier contract make the labor abuses stop? Does it mean you aren't benefiting from the company using that supplier? Abstaining avoids *direct endorsement*, but it doesn't vanish your connection to the outcome or your tiny causal influence (by absence). 'Clean hands' is an illusion; the moral gradient persists – you've just chosen a different point on it, often with *worse* causal consequences."

  **End-of-Session Comprehension Check (Not Parroting):**
  *   **Prompt:** "Imagine explaining your RCV ballot choice (A>B>C) to a close friend harmed by B's policies. They ask: 'How can you put your name next to supporting B, even as a backup?' **Write 2-3 sentences explaining the tension you navigated, acknowledging *both* the causal and symbolic responsibilities you carried, and why you didn't choose abstention or only voting for A.**"
  *   **What Proves Grasp:** The response must **explicitly name both types of responsibility** (causal/outcome-shaping & symbolic/endorsement) and **ackewledge the trade-off** inherent in the choice (e.g., "I had to balance helping stop the worse harm C against putting my name *behind* B, even reluctantly"). Avoiding simplistic "lesser evil" or "purity" language shows internalization of the gradient. Mentioning why abstention *wouldn't* solve the problem is a strong indicator.

  **Voting Theory to Explicitly Refuse to Cover:**
  *   **Refuse:** Deep dives into **strategic voting under different electoral systems** (beyond the basic mechanics of RCV needed for the example) or the mathematics of pivot probability. **Why:** It derails the ethical discussion into instrumental game theory. You need them sitting with the *moral tension*, not optimizing the causal lever. Say: "We're focusing on the *ethical structure* of the choice today, not the full game-theoretic optimization across all systems. That's a different, important conversation."

  **Framing Strength:** This arc isolates the dual responsibility *before* applying it to the hard choice, uses concrete analogies engineers grasp (systems, mechanisms, approval processes), forces confrontation with the gradient via the specific RCV example, and explicitly dismantles the escape hatches (irrelevance, signaling, abstention). It stands alone by rooting the "symbolic" in personal integrity/association consequences, not just vague social signaling.
