    - Method2: The point along the radius is chosen uniformly. The chord is long if the distance from the center is less than r/2? But we are measuring the central angle. In this method, the distance from the center to the chord is the same as the distance from the center to the point (d). The central angle is 2 * arccos(d/r). The chord is long if central angle >120, which happens when d < r/2. Since we are choosing d uniformly from 0 to r, the probability that d < r/2 is (r/2 - 0) / (r - 0) = 1/2.

    - Method3: The midpoint is chosen uniformly in the disk. The chord is long if the midpoint is within the inner circle of radius r/2. The area of the inner circle is π*(r/2)^2 = πr^2/4. The area of the whole circle is πr^2. So the probability is 1/4.

  But note: in the activity, we are measuring the central angle for all, so we are not using the shortcut. But theoretically, they are equivalent.

  We should be prepared to explain these in the debrief, but note: the math might be too much for some. Focus on the idea that different methods lead to different probabilities.

  What the exercise can't show: 
    - We are not settling whether there is a "correct" method. 
    - We are not covering all possible methods. 
    - The results might be affected by human error and small sample size.

  But the main point is to see that the fraction depends on how we generate the random chord.

  Let's hope it works!
