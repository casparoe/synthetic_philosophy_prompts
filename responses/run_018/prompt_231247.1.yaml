  ### Activity Design: Bertrand's Paradox Hands-On Session  
  **Goal:** Students discover that the phrase "choose a random chord" is ambiguous and leads to different probabilities, depending on the randomization method. They’ll generate chords using three distinct procedures, tally the fraction of "long" chords (longer than the side of an inscribed equilateral triangle), and compare results to reveal the paradox.

  **Materials (Per Group of 6–7 Students):**  
  - **All groups:**  
    - 1 sheet of paper with a pre-drawn circle (radius 10 cm; center marked; **light dotted line** showing an inscribed equilateral triangle for reference).  
    - Pencils, erasers.  
    - Protractor (for measuring angles).  
    - Tally sheet (template below).  
  - **Group 2 only:** A "spinner" (a paperclip threaded through a pushpin at the center; flick to randomize direction).  
  - **Groups 2 & 3 only:** A set square (or small right-angled ruler) for drawing perpendicular lines.  
  - **Extras:** Blank paper for predictions, whiteboard for debrief.  

  **Preparation:**  
  - **Circles:** Pre-draw identical circles (radius 10 cm) on paper. Lightly mark an equilateral triangle inside each (vertices on circumference).  
  - **Critical angle:** Explain that a chord is "long" if its central angle > 120° (equivalent to longer than the triangle’s side).  
  - **Groups:** Split into 3 groups (6–7 students each). Assign each group a method (don’t reveal differences yet).  

  ---

  ### Timeline (75 Minutes Total)
  #### **0–10 min: Setup & Predictions**  
  - **Rules (Concise intro; <3 min):**  
    > "We’re exploring randomness in geometry. Each group will generate 10 random chords in this circle. A chord is ‘long’ if its central angle is greater than 120°—use the protractor to measure this. First, write a prediction: What fraction of your chords will be long? Keep methods secret until the end."  
  - **Predictions (3 min):**  
    - Hand out blank slips. Each student writes:  
      > *Name: __________   Predicted fraction of "long" chords: _____*  
    - Collect slips.  

  #### **10–45 min: Chord Generation (35 min)**  
  - **Group Instructions (Hand out method cards; groups work independently):**  
    - **Group 1 (Random Endpoints):**  
      > 1. Close your eyes and place two random dots on the circumference.  
      > 2. Draw a chord connecting the dots.  
      > 3. Measure the central angle (at the circle’s center) with the protractor.  
      > 4. Tally: "Long" if angle > 120°.  
      > *Do this 10 times.*  

    - **Group 2 (Random Radial Point):**  
      > 1. Flick the spinner; draw the radius it lands on (center to circumference).  
      > 2. Close your eyes and place a random dot *on the radius*.  
      > 3. Use the set square to draw a chord *perpendicular to the radius* at the dot.  
      > 4. Measure the central angle; tally if > 120°.  
      > *Do this 10 times.*  

    - **Group 3 (Random Midpoint):**  
      > 1. Close your eyes and place a random dot *anywhere inside the circle*.  
      > 2. Use the set square to draw a chord with that dot as its *midpoint* (perpendicular to the line from center to dot).  
      > 3. Measure the central angle; tally if > 120°.  
      > *Do this 10 times.*  

  - **Facilitation Tips:**  
    - Float between groups: Ensure they follow their method (e.g., eyes closed for randomness).  
    - Time check: Aim for 3–4 min per chord. If groups finish early, add chords (max 15 total).  

  #### **45–55 min: Tally & Report (10 min)**  
  - Groups calculate their fraction of long chords (e.g., 7/10 = 0.7).  
  - **Report on whiteboard:**  
    | Group | Method              | Fraction of Long Chords |  
    |-------|---------------------|--------------------------|  
    | 1     | Random Endpoints    | $F_1$                    |  
    | 2     | Random Radial Point | $F_2$                    |  
    | 3     | Random Midpoint     | $F_3$                    |  

  #### **55–75 min: Debrief (20 min)**  
  1. **Reveal the Paradox (5 min):**  
     - Show the board: Fractions will likely differ (e.g., ~1/3, ~1/2, ~1/4).  
     - Ask: *"We all used ‘random chords’—why are the fractions different?"*  
     - **Key Insight:** "Random" is underdetermined—each method applies the "principle of indifference" differently:  
       - Group 1: Indifferent to *endpoint locations* (uniform on circumference).  
       - Group 2: Indifferent to *direction and radial distance* (uniform on radius).  
       - Group 3: Indifferent to *midpoint location* (uniform in area).  

  2. **Map to Theory (5 min):**  
     - Explain outcomes simply (no formulas):  
       - **Endpoints (Group 1):** ~1/3 chance. *Why?* Only chords spanning >120° arc are "long" (120°/360° = 1/3).  
       - **Radial Point (Group 2):** ~1/2 chance. *Why?* Chord is long if the dot is in the inner half of the radius.  
       - **Midpoint (Group 3):** ~1/4 chance. *Why?* Chord is long if the midpoint is in the inner quarter of the circle.  

  3. **Refine Understanding (5 min):**  
     - **What the exercise shows:** "Random chord" needs a specific procedure—the principle of indifference alone doesn’t define it.  
     - **What it doesn’t show:** Whether one method is "correct." (Philosophy tie-in: Is there a privileged measure? Not answered here.)  
     - Return predictions: Discuss why guesses varied (e.g., intuition depends on implicit assumptions).  

  4. **Q&A (5 min):**  
     - Sample prompts:  
       - *"Which method feels most natural? Why?"*  
       - *"Could there be a fourth ‘random’ method?"*  
     - **Honest limitations:**  
       - Small samples → results aren’t exact (e.g., Group 3 might get 0.3, not 0.25).  
       - Human bias (e.g., dots cluster near edges).  

  ---

  ### Anticipated Issues & Mitigation  
  - **Math-phobes struggle with angles:**  
    - Mitigation: Demo measuring one chord upfront; pair confident/math-phobe students.  
  - **Time pressure:**  
    - Mitigation: Start with 8 chords (not 10); skip complex chords if needed.  
  - **Group 3 struggles to draw chords:**  
    - Mitigation: Pre-demo using the set square; emphasize the midpoint is fixed.  
  - **Results too close (e.g., 0.3 vs. 0.35):**  
    - Mitigation: Stress the *trend* (Group 1 < Group 2 > Group 3); use theoretical values in debrief.  

  **Why this works:** Students confront ambiguity through doing—comparing tallies shocks them into realizing "random" is procedural. The activity stays concrete (paper, protractors) while revealing a deep philosophical point.
