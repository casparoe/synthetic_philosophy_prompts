  3.  **Contextual Precisification Rule:** If the application of the predicate *systematically depends* on the standards and purposes of the context, with borderline cases resolvable by shifting context, the indeterminacy is contextual, not epistemic or ontological (e.g., "tall").

  **Predictions for the Compute Cluster Case:**

