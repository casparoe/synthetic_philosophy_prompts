      {"name": "Black-box charge applies universally", "severity": "Serious", "category": "Conceptual"},  
      {"name": "Expertise-based counterexamples", "severity": "Awkward", "category": "Empirical"},  
      {"name": "PBA yields counterintuitive outcomes", "severity": "Awkward", "category": "Empirical"},  
      {"name": "Sovereignty conflicts with epistemic values", "severity": "Awkward", "category": "Conceptual"}  
    ],  
    "insulation_assessment": "The position is insulated from empirical falsification by defining 'genuine reasoning' as requiring PBA, allowing failures to be explained away. This is a theoretical vice for empirical engagement but a virtue for preserving its normative core as a constitutive ideal.",  
    "falsifiability_status": "Falsifiable only in formal/logical terms (e.g., via impossibility theorems) or if collective reasoning is demonstrated without premise priority. Empirically unfalsifiable due to stipulative definitions.",  
    "rival_predictions": "Distinctively predicts that conclusion-based aggregation causes collective alienation and inability to claim reasoning ownership. Rival epistemic accounts predict higher accuracy in CBA; proceduralists predict PBA enhances fairness. Literature (e.g., List 2006) shows PBA's inconsistency, which challenges feasibility and should motivate refinement."  
  }  
  ```  

  This analysis suggests your position is robust normatively but vulnerable formally and empirically. To strengthen it, engage impossibility results (e.g., by constraining agendas) and clarify why sovereignty outweighs epistemic trade-offs.
