prompt: |-
  I am designing a single ninety-minute seminar for third-year philosophy undergraduates who have completed an introductory course in philosophy of language but have not yet encountered Putnam's Twin Earth reasoning in any formal setting. Rather than walking them through the familiar Oscar-and-twin-Oscar water-versus-XYZ narrative, I want the session built around the historical case of jade—specifically the fact that what was long treated as one substance was later shown to comprise two chemically distinct minerals, jadeite and nephrite, with nearly identical superficial properties but different molecular structures. The pedagogical aim is to use this case to motivate semantic externalism: to ask whether two speakers in 1700 and 1950, sharing every internal mental state, nevertheless mean different things by "jade" because their respective environments embed different chemical kinds.

  Plan the explanatory arc for me, not the explanation itself. First, identify the conceptual dependency that must be secured before Twin Earth reasoning can begin—presumably the internalist thesis that mental representation alone fixes reference needs to be articulated as an explicit target rather than a background assumption—and explain why the jade example serves this purpose better than the water example, including what it must contain (for instance, shared ignorance of chemistry among the speakers) and what it must deliberately lack (such as immediate perceptual access to the chemical distinction). Second, map the misconceptions students will form in sequence: I anticipate an initial slide toward the view that meanings are fixed entirely by scientific authority rather than by environmental causation, followed by a conflation of externalism with the claim that individuals have no cognitive access to their own concepts, and perhaps a third confusion that treats the thought experiment as an empirical discovery about geology rather than a modal argument about reference. For each, specify the precise point in the sequence where it should be intercepted and how. Third, propose a concluding check—one question I can pose at the end—that distinguishes a student who genuinely grasps that reference is environmentally mediated from one who has merely memorized the slogan that meanings are not in the head. Finally, state explicitly what should be left out at this level—such as Putnam's division of linguistic labor, Burge's arthritis case, or the technical debate over narrow versus wide content—and justify the omission in a way that does not make externalism appear arbitrarily truncated.
reasoning: |-
  We are designing a seminar for third-year philosophy undergraduates who have completed an introductory course in philosophy of language but are new to Putnam's Twin Earth. We are using the jade case (jadeite vs. nephrite) instead of the water case to motivate semantic externalism. The goal is to show that two speakers (one in 1700 and one in 1950) with the same internal mental states might mean different things by "jade" because of the environment.

  ### Step 1: Conceptual Dependency and Why Jade is Better
  Before introducing Twin Earth reasoning, we must establish the internalist thesis as the target. Internalism (or methodological solipsism) holds that mental representation (intentional content) is fixed solely by internal states of the mind/brain, independent of the external environment.

  **Why Jade is Better than Water for This Purpose:**
  - **Shared Ignorance:** In the jade case, both the 1700 and 1950 speakers are ignorant of the chemical composition. This is crucial because it shows that even if they have the same beliefs (e.g., "jade is a green mineral used for carvings"), the reference can change due to environmental facts they don't know. In the water case, Oscar and twin-Oscar are also ignorant, but the jade case has a historical dimension that emphasizes the shift in scientific understanding without requiring a Twin Earth setup.
  - **Lack of Perceptual Access:** The chemical distinction between jadeite and nephrite is not perceptually accessible (unlike water vs. XYZ, which might be imagined to have different tastes or boiling points). This forces students to see that the difference is not in the appearance but in the underlying structure, which is unknown to the speakers. This is similar to water, but jade has the advantage of being a real-world case with a documented scientific history, which may feel less contrived.
  - **Historical Progression:** The jade example allows us to set up two time periods (pre- and post-discovery) without needing a counterfactual Twin Earth. This makes the case more concrete and avoids the modal complexities of Twin Earth. It also shows that the same word can shift in reference due to new discoveries about the actual world, which is a key point for externalism.

  **What the Jade Example Must Contain:**
  - The 1700 speaker uses "jade" to refer to both jadeite and nephrite because they are indistinguishable to him and to the scientific community of his time. He has a concept that is superficially defined (by color, hardness, use, etc.) and internally represented.
  - The 1950 speaker (after the discovery) uses "jade" in a way that might be ambiguous: does it now refer only to one of the minerals, or both? But the key point is that the 1700 speaker's term "jade" refers to both jadeite and nephrite (because that's what was present in his environment when he used the word), while the 1950 speaker might use "jade" in a way that is informed by the new knowledge. However, for the externalist argument, we focus on the 1700 speaker and what his term referred to, regardless of his ignorance.

  **What it Must Deliberately Lack:**
  - Avoid any suggestion that the speakers have any access to the chemical differences. The case must be set up so that the only difference is in the environment (the actual composition of the samples they call "jade") and the subsequent scientific discovery.

  ### Step 2: Mapping Misconceptions and Interception Points

  **Misconception 1: Meanings are fixed by scientific authority, not environmental causation.**
  - **Where it arises:** After presenting the discovery that jade is two minerals, students might think that the meaning of "jade" changed because scientists redefined it. They might think that the 1950 speaker's meaning is determined by the scientific community's decision, not by the environmental fact that there were two minerals all along.
  - **Interception Point:** Immediately after presenting the historical fact and before drawing conclusions. We must emphasize that the externalist claim is about what the 1700 speaker referred to at the time. The key question is: did the 1700 speaker, when he said "jade", refer to both minerals or just one? And the answer is both, because both were present in his environment and he intended to refer to the kind of stone that was called jade, which happened to be two kinds. The scientific discovery didn't change the past reference; it revealed that the reference was to two kinds. So, we intercept by stressing the temporal aspect: the reference in 1700 was fixed by the environment then, not by future scientific authority.

  **Misconception 2: Externalism implies individuals have no cognitive access to their own concepts.**
  - **Where it arises:** When explaining that the 1700 and 1950 speakers have different concepts (because one refers to a disjunctive kind and the other might have a more refined concept), students might think that the 1700 speaker didn't know what he meant by "jade". But externalism does not deny that speakers have access to the content of their thoughts; it just says that content is partly determined by the environment. The 1700 speaker knows what he means (he can identify jade by its appearance), but he doesn't know the underlying structure.
  - **Interception Point:** After establishing the externalist claim and before moving to implications. We must clarify that the 1700 speaker's concept of jade is not incomplete in the sense that he doesn't know what he is talking about; he has a perfectly good concept that picks out a kind, but it turns out that kind is disjunctive. We can compare it to the water case: Oscar knows what water is, but he doesn't know it is H2O. Similarly, the 1700 speaker knows what jade is, but he doesn't know it is two minerals.

  **Misconception 3: Treating the thought experiment as an empirical discovery about geology rather than a modal argument about reference.**
  - **Where it arises:** When discussing the jade case, students might focus on the historical fact that jade turned out to be two minerals and think that the point is just about how science progresses. They might miss that the argument is modal: if there had been only one mineral (say, only nephrite) in the 1700 environment, then "jade" would have referred to that one mineral, even if the speaker had the same mental state. The thought experiment is meant to show that the reference is determined by the environment, not the mental state alone.
  - **Interception Point:** After presenting the actual case and before generalizing to externalism. We can introduce a counterfactual: imagine a world where in 1700, only nephrite exists and is called "jade". Then, even if the speaker has the same mental state as the actual 1700 speaker, in that world "jade" refers only to nephrite. This counterfactual reasoning is crucial to show that the mental state alone does not fix the reference.

  ### Step 3: Concluding Check Question
  To distinguish a student who grasps that reference is environmentally mediated from one who has memorized the slogan, ask:

  **"Suppose that in 1700, all the samples of what people called 'jade' were actually nephrite (and there was no jadeite). Would the word 'jade' as used by the 1700 speaker then refer to nephrite only, even if the speaker had the same mental state as in the actual world (where there were both)?"**

  - The student who grasps externalism should say: Yes, because the reference is fixed by the environment. The mental state is the same, but the environment is different, so the reference is different.
  - The student who has only memorized the slogan might not be able to apply it to this counterfactual. They might say: No, because the mental state is the same, so the meaning is the same. Or they might not see the relevance of the counterfactual.

  ### Step 4: What to Leave Out and Why
  - **Putnam's division of linguistic labor:** This is the idea that not every speaker has to be an expert; we defer to experts to fix reference. We omit it because the jade case can be presented without it. The focus is on the individual speaker in a community that hasn't yet made the distinction, and the environmental causation is direct. Including it might complicate the core point about environmental determination.
  - **Burge's arthritis case:** Burge's argument is about social externalism (how the community's usage affects individual meaning). We are focusing on natural kind terms and environmental externalism. Including Burge might blur the distinction between natural and social kinds and introduce a different kind of externalism.
  - **Technical debate over narrow vs. wide content:** This is a more advanced topic that requires understanding of possible worlds and mental content. At this stage, we are only establishing the basic externalist intuition. Introducing narrow content might confuse students and is not necessary for the core argument.

  **Justification for Omissions:** We are focusing on the core insight of Putnam's externalism for natural kind terms: that the environment plays a role in fixing reference. This is a foundational idea. The omitted topics are important but build upon this foundation. By avoiding them, we keep the seminar focused and prevent students from being overwhelmed. We can note that externalism has broader implications (social, division of labor) but that this session is about the environmental aspect.

  ### Summary of Explanatory Arc
  1. **Set up internalism:** Explain that internalism holds that meaning is fixed entirely by internal mental states.
  2. **Present the jade case:** Describe the historical situation (pre-1700 to 1950) and the discovery of two minerals. Emphasize that the pre-discovery speakers had no idea of the chemical difference.
  3. **Pose the key question:** Did the 1700 speaker mean something different by "jade" than the 1950 speaker, even if we imagine a 1700 speaker and a 1950 speaker with identical internal states? (The 1950 speaker might know the difference, but we can imagine one who doesn't and still uses "jade" as a natural kind term for both.)
  4. **Argue for externalism:** The 1700 speaker's term "jade" referred to both jadeite and nephrite because that's what was in his environment. The 1950 speaker, if we imagine her with the same internal state but in a different environment (say, one where only jadeite exists), would refer to something different. But even in the actual 1950, if she uses "jade" with the same mental state as the 1700 speaker, her term might still refer to both (if the environment is the same) but now we know it's two kinds. The crucial point is that the environment in 1700 fixed the reference then, and the discovery didn't change that past reference.
  5. **Address misconceptions** at the points outlined above.
  6. **Conclude with the check question.**

  This arc should take about 90 minutes, leaving time for discussion.
answer: |-
  Below is a carefully structured explanatory arc for your 90-minute seminar, designed to leverage the jade case to motivate semantic externalism while preempting common student misconceptions. The arc prioritizes conceptual clarity, intercepts predictable errors at critical junctures, and maintains focus on environmental determination of reference without overcomplicating the narrative.

  ---

  ### **1. Conceptual Dependency: Setting the Internalist Target**
  **Why this must come first:**  
  Before introducing externalism, students must explicitly recognize the *internalist thesis* as the default position they likely hold (often implicitly). Internalism claims that reference is fixed solely by a speaker's internal mental states (e.g., beliefs, intentions, or perceptual criteria). Without establishing this as the target, Twin Earth reasoning appears unmotivated.

  **Why jade outperforms water for this purpose:**  
  - **Shared ignorance is central:** Both the 1700 and 1950 speakers lack chemical knowledge. Jadeite and nephrite are perceptually indistinguishable (same color, texture, cultural use), so speakers in both eras rely on identical superficial criteria (e.g., "green, hard stone used in carvings"). This forces students to confront whether reference can diverge *despite* identical mental states.  
  - **Lacks perceptual accessibility:** Unlike water (where differences in boiling points or taste might be imagined), jade's chemical distinction is empirically inaccessible without advanced tools. This eliminates the distraction of "what if they noticed a difference?" and highlights that the external world, not cognition, drives reference shifts.  
  - **Real-world historicity avoids contrivance:** Water’s Twin Earth setup can feel like science fiction, but jade’s documented history (one term for two minerals) grounds the debate in actual science, making externalism feel less like a thought experiment and more like an empirical insight.  

  **What the jade case must include:**  
  - A vivid contrast between the 1700 speaker (using "jade" for all green stones of this type) and the 1950 speaker (using "jade" post-discovery, possibly ambiguously). Crucially, both share:  
    - The same perceptual criteria for identifying jade.  
    - No knowledge of chemistry (e.g., neither suspects multiple minerals exist).  
  - Emphasis that pre-1950, "jade" was treated as a *unified natural kind* (like gold or water), not a disjunctive category.  

  **What it must exclude:**  
  - Any suggestion that speakers could detect the difference (e.g., "what if a 1700 geologist noticed variations?"). Stress that the discovery was a surprise, revealing environmental facts *always* present but unknown.  

  ---

  ### **2. Sequence of Misconceptions and Interception Points**
  Students will form three key misconceptions. Intercept each *proactively* at these stages:  

  | **Misconception** | **Where it arises** | **How to intercept** |
  |-------------------|---------------------|----------------------|
  | **1. Scientific authority fixes meaning** (e.g., "Meanings change when scientists redefine terms"). | After revealing the 1950 discovery. Students conflate *epistemic authority* (scientists correcting beliefs) with *metaphysical determination* (the environment causing reference). | **Intercept during the post-discovery analysis:** Ask: "When the 1700 speaker said 'jade,' did they refer to both minerals *even though no one knew it yet*?" Contrast: Scientists *discovered* a fact about the environment; they didn’t *create* the reference. Stress that the 1700 speaker’s term referred to both jadeite and nephrite *because that’s what was in their environment*, not because scientists later said so. Use a counterfactual: "If 1700 Earth had only nephrite, 'jade' would refer only to nephrite—same mental states, different environment." |
  | **2. Externalism denies cognitive access** (e.g., "If meanings aren’t in the head, I can’t know what I mean"). | During the implication phase (e.g., when noting the 1700/1950 speakers "mean different things"). Students hear externalism as a skepticism about self-knowledge. | **Intercept when generalizing to externalism:** Clarify: "Externalism doesn’t say you’re ignorant of your *concept*; it says your concept’s *content* depends partly on the world. The 1700 speaker knows jade by its appearance—they just don’t know its hidden structure." Use an analogy: "I can know 'water' refers to *this liquid* without knowing it’s H₂O. Similarly, the 1700 speaker knows 'jade' refers to *this stone*." |
  | **3. Empirical over modal focus** (e.g., "This is just a story about how geologists corrected a mistake"). | During the wrap-up, when students reduce the case to historical trivia. They miss that it’s a modal argument about necessity and possibility. | **Intercept before concluding:** Pose: "Is this *only* about jade’s history, or does it show something necessary about meaning?" Contrast the empirical fact ("Jade turned out to be two minerals") with the modal claim ("In a world with only one mineral, 'jade' would refer to that one *even with identical mental states*"). Highlight that externalism is about counterfactual robustness: reference is fixed by actual environmental relations, not descriptions. |

  ---

  ### **3. Concluding Check Question**  
  **Pose this question at the end to test genuine understanding:**  
  > *"Imagine two planets: On Earth A, all samples called 'jade' in 1700 were nephrite (with no jadeite present). On Earth B, they were a 50/50 mix of jadeite and nephrite. If speakers on both planets have identical mental states in 1700, does 'jade' refer to the same thing on Earth A and Earth B? Why or why not?"*  

  - **Genuine grasp:** The student will say *no* and explain that reference differs because the environment differs (on A, "jade" refers only to nephrite; on B, to both). They’ll ground this in environmental causation, not beliefs or authority.  
  - **Merely memorized:** The student will say "meanings aren’t in the head" but cannot apply it to the counterfactual. They may appeal to scientists ("Eventually, they’ll discover the truth") or mental states ("But they think the same thing!").  

  ---

  ### **4. Explicit Omissions and Justifications**  
  **Omit the following to avoid diluting the core argument:**  
  - **Putnam’s division of linguistic labor:** Justification: This introduces *social* externalism (deference to experts), which distracts from the seminar’s focus on *environmental* determination. The jade case works without experts—speakers in 1700 had no "jade authorities" to defer to.  
  - **Burge’s arthritis case:** Justification: Burge’s social externalism (e.g., misapplying "arthritis" due to community usage) shifts attention to normative linguistic practices, not natural kinds. Omitting it prevents conflation of environmental and social externalism.  
  - **Narrow vs. wide content debates:** Justification: These technical discussions (e.g., whether mental content supervenes on individual brains) require groundwork in metaphysics and philosophy of mind. Introducing them prematurely makes externalism seem "truncated" by implying it’s incomplete without them. Instead, frame environmental determination as a self-contained, powerful insight.  

  **How to justify omissions without trivializing externalism:**  
  > "We’re focusing on environmental externalism—how the *physical world* fixes reference for natural kinds like jade. Externalism extends to social and linguistic factors (e.g., experts or community norms), but these are separate arguments. Today’s case shows that even without society or science, the environment alone can split meanings. This is the core insight that makes externalism revolutionary: meanings reach beyond the mind."  

  ---

  ### **Overall Explanatory Arc Structure**  
  1. **Intro (10 mins):** Reactivate internalism. Ask: "What fixes what a word refers to? Your beliefs? Perceptions?" Elicit student intuitions.  
  2. **Jade case setup (15 mins):** Present the history (one term → two minerals). Stress shared ignorance and perceptual indistinguishability.  
  3. **Internalism challenged (20 mins):** Pose: "Did 'jade' refer to both minerals in 1700, even if no one knew?" Tease out the internalist answer ("No—they meant whatever they described").  
  4. **Externalist turn (20 mins):** Argue that the environment determined reference. Intercept Misconception 1 (scientific authority) and Misconception 3 (empirical focus).  
  5. **Clarifications (15 mins):** Defuse Misconception 2 (cognitive access). Use analogies (e.g., "You know what you mean, but what you mean depends on the world").  
  6. **Conclusion (10 mins):** Concluding check question. Preview broader implications (e.g., "This reshapes what concepts are!") without diving into omitted topics.  

  This arc ensures students see jade as a gateway to environmental externalism, not just a curiosity. By confronting misconceptions in real-time and ending with a discriminating question, you’ll solidify grasp while leaving them primed for future topics (e.g., social externalism).
