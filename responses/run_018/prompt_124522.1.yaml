answer: |-
  Here’s a tailored essay prompt, model answer, and marking scheme for your Sartre-focused existentialism final:

  **ESSAY PROMPT**  
  > **Sartrean Freedom in the Age of Algorithms:**  
  > Consider an individual who, after using a proprietary algorithmic career-matching system, believes the system has definitively "locked" them into a single viable career path. Despite experiencing significant psychological harm in this role (e.g., chronic anxiety, dehumanization), they refuse to explore alternatives, insisting, "The algorithm determined this is my only option." Using Sartre’s concepts of **radical freedom**, **bad faith**, and the distinction between **ontological freedom** and **practical freedom**, analyze:  
  > (a) Whether this resignation constitutes bad faith and why;  
  > (b) How the algorithm functions within Sartre’s framework (e.g., as facticity, external constraint, or pseudo-determinism);  
  > (c) Whether Sartre’s separation of ontological and practical freedom adequately addresses this scenario or collapses under technological mediation.  
  > *(Argue rigorously: avoid merely summarizing Sartre’s general theories.)*

  ---

  **MODEL ANSWER (650 words)**  

  Sartre would unequivocally classify this individual’s resignation as **bad faith** (*mauvaise foi*). Bad faith arises when one denies their inherent freedom by pretending to be a fixed "object" rather than a conscious "subject." Here, the individual treats the algorithm’s output as an incontrovertible *destiny*, outsourcing agency to technology. By claiming the algorithm "locked" them in, they evade responsibility for enduring harm—a classic bad faith maneuver. They reduce themselves to a *being-in-itself* (a determined thing), ignoring their *being-for-itself* (consciousness that transcends circumstances through interpretation and choice).  

  The algorithm represents **facticity**—not determinism. For Sartre, facticity encompasses the *givens* of existence (e.g., body, past, social context). The algorithm is a factitious element: it reflects socioeconomic structures, historical data inputs, and the individual’s prior choices (e.g., inputting preferences). However, facticity is not causal destiny; it’s *mute material* awaiting interpretation. The individual *chooses* to interpret the algorithm as an absolute constraint. They conflate its predictive function (based on contingent facticity) with metaphysical necessity, thereby masking their freedom to reject its "verdict." This misrepresentation echoes the waiter who denies choosing their role by over-identifying with it—except here, the "role" is algorithmically prescribed.  

  Sartre’s **ontological/practical freedom** distinction holds but requires nuance. **Ontological freedom**—the inescapable condition of consciousness to transcend facticity through meaning-making—remains intact. Even in a harmful job, the individual *chooses* their attitude: they could resent, sabotage, or quietly plan an escape. The algorithm cannot nullify this freedom to *interpret* their situation. **Practical freedom**, however—the concrete capacity to act on choices—is constrained. The algorithm may narrow viable economic pathways, reflecting material scarcity or biased code. Yet Sartre insists ontological freedom persists *within* practical limits: one can still *choose* how to exist within those limits (e.g., "I am exploited, but I resist" vs. "I am determined").  

  The individual’s error lies in **collapsing practical limitation into ontological determinism**. By declaring "no other path exists," they conflate (a) the *practical difficulty* of changing careers (e.g., retraining costs, algorithmically skewed job markets) with (b) the *ontological impossibility* of choice. This parallels Sartre’s warning that we are "condemned to be free": hardship does not erase freedom but makes its exercise costly. The algorithm, as facticity, shapes practical freedom but cannot abolish the ontological freedom to *desire change*, *imagine alternatives*, or even *quit*—however dire the consequences.  

  Ultimately, Sartre’s framework robustly diagnoses this technological self-deception. The algorithm is mere facticity weaponized by bad faith to deny agency. While practical freedom is legitimately curtailed by systemic forces (here, automated systems), ontological freedom ensures responsibility for one’s complicity in suffering. To claim "the algorithm made me stay" is to flee from the anguish of freedom—precisely the cowardice Sartre condemns.  

  ---

  **MARKING SCHEME (Total: 25 marks)**  
  **Key Criteria for A-Grade (21+ marks):**  
  1. **Identifies bad faith correctly** (5 marks): Must show how outsourcing agency to tech constitutes self-deception.  
     *Botch: "It’s not bad faith if the algorithm is real."*  
  2. **Distinguishes facticity vs. determinism** (5 marks): Algorithm = contingent facticity (social/historical construct), *not* metaphysical determinism.  
     *Botch: "Algorithms determine us, so it’s not bad faith."*  
  3. **Upholds ontological freedom** (5 marks): Affirms consciousness transcends *any* facticity (even algorithms) via interpretation/choice of attitude.  
     *Botch: "No real freedom exists if you can’t quit practically."*  
  4. **Acknowledges practical constraints** (5 marks): Recognizes material limits (e.g., economic precarity) without equating them with determinism.  
     *Botch: "Sartre ignores real-world barriers."*  
  5. **Avoids collapsing freedom tiers** (5 marks): Maintains that practical limits don’t negate ontological freedom; critiques conflation as bad faith.  
     *Botch: Merges ontological/practical freedom into "limited free will."*  

  **Grade Boundaries:**  
  - **A (21–25)**: Hits all 5 criteria, nuanced argument, minimal errors.  
  - **B (16–20)**: Hits 3–4 criteria, some conflation/oversimplification.  
  - **C (11–15)**: Superficial treatment, confuses key terms, misses >2 criteria.  
  - **D/F (0–10)**: Major misunderstandings, ignores prompt, summarizes without analysis.  

  **Note on Common Errors**: Students often (1) **equate facticity with determinism**, (2) **demand "real" choices to validate freedom** (ignoring ontological choice), or (3) **blame the algorithm alone** without analyzing the *choice* to submit to it.  

  Let me know if you'd like minor tweaks to the model answer's tone or emphasis! This setup pushes students past rote summaries while sticking to your Sartre-focused, tech-twisted brief.
