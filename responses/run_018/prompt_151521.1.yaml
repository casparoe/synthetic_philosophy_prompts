   III. Cruxes (key points of disagreement) with concrete cases. We'll use a hypothetical rondeau where the B-rhyme is "mort" (literal death in one appearance, social death in the other) and see:
      - Whether preserving the exact English word "dead" in both spots (with awkward grammar) preserves a meaning that resolving the ambiguity differently loses.
