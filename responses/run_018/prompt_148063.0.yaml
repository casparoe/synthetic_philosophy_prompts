  Real-world relevance: collapse scenarios relate to post-disaster ethics and digital spaces. Cross-disagreement affects legal contracts and treaties. Non-human promises might inform AI ethics but is niche. Neglect? Collapse is underexplored; cross-disagreement has some work; non-human is trendy but maybe overrated.

  Overrated? Non-human extension. It's popular but less likely to influence broader issues. Evidence that could reorder: if empirical studies show promises in anarchic communities hold without social structures, that boosts cluster 1. Or finding historical cases of binding cross-moral promises could elevate cluster 2.

