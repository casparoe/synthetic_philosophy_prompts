prompt: |-
  I'm a philosophy professor helping out a colleague who curates the archaeology wing at a regional museum. Every couple months she has to sign off on interpretive plaques for new finds — claims like 'this burial orientation reflects a cosmological belief' or 'this tool standardization shows institutional control.' She needs a reusable decision procedure she can actually run in about 20 minutes before putting her name on the display text. No philosophy background required, but it has to be honest about where she's just making a judgment call.

  Please turn the core philosophy-of-archaeology idea — inference from material objects to beliefs and institutions, plus a formalized presumption of independence — into a flowchart-in-words: ordered gates, what counts as a sufficient answer at each, where it stops cold with 'do not infer belief or institution,' where it hands the decision off to a person because it's values not facts, and where it will definately misfire. Ground it in what the field actually knows, but operationalize it.

  Take a committed position, don't just list options: defend a specific split in how the independance presumption works for 'belief-artifacts' (objects that seem to encode propositional content) versus 'institutional-residue' (objects that only stabilize within a sustained practice). Then apply the procedure to three cases: (1) standardized burial orientations that might imply cosmological belief; (2) an abrupt shift in ceramic manufacture that might imply institutional oversight; and (3) a repetitive decorative motif on domestic pottery where your procedure outputs 'institutional residue present' but my colleague will hate that answer, since it sounds like ritual authority over everyday life. Say exactly what the procedure cannot do.

  No citations or reading lists — she can't check them and neither can I right now. Just the committed procedure with its reasons.
reasoning: |-
  Okay, the user is a philosophy professor helping an archaeology curator who needs a quick, reliable decision procedure for approving interpretive plaques. The key challenge is inferring beliefs or institutions from artifacts without overstepping evidence. The user wants a flowchart-like method that's honest about judgment calls, grounded in archaeology, and takes a committed position on independence presumption for belief-artifacts vs. institutional-residue.

  First, I need to address the core philosophical issue: how to justify moving from material objects to abstract concepts like beliefs or institutions. The user specified a formalized presumption of independence, meaning we assume artifacts aren't just random until proven otherwise. But this presumption should work differently for beliefs versus institutions. For belief-artifacts, the material must directly encode propositional content. For institutional-residue, the focus is on consistency and standardization indicating organized practices.

  Next, structuring the procedure. It should have clear gates with thresholds for evidence. Start with material observation, then check for intentionality, then contextual fit. For beliefs, require direct encoding like symbols; for institutions, look for patterns like standardization across contexts. Where evidence is weak, stop the inference. Judgment calls come in when context is poor but the artifact strongly suggests intention—here the curator must decide based on expertise.

  Now, applying to the cases. For standardized burials: orientation alone isn't enough for cosmology unless there's contextual evidence like celestial alignments. Without that, it's a judgment call. Ceramic standardization: if it's abrupt and widespread, that's institutional residue, but not necessarily centralized control—could be peer pressure. The decorative motif: repetition doesn't imply ritual authority; it could be fashion. The procedure would block the inference here, which the colleague might dislike, but it's honest.

  I should emphasize what the procedure can't do: infer specific meanings without direct evidence, resolve debates without more data, or avoid all controversy. It's a safeguard against overinterpretation, not a truth machine. The curator's expertise is still crucial for judgment calls, but the procedure forces explicit justification where evidence is thin.
answer: |-
  Here's a committed, operationalized decision procedure grounded in the core challenge of inferring the non-material from the material, using a differentiated "Independence Presumption" and designed for rapid use (<20 mins). It prioritizes epistemic honesty about judgment calls.

  **Core Principle & Independence Presumption Split:**
  *   **Belief-Artifacts (e.g., symbols, structured depositions):** Presume independence *unless* the object **directly encodes propositional content** (like a written prayer, an unambiguous deity figure) *or* demonstrates **systematic contextual alignment** with independently attested *symbolic* practices. Beliefs require evidence of *meaningful representation*, not just pattern.
  *   **Institutional-Residue (e.g., standardization, large-scale coordination):** Presume independence *unless* the pattern demonstrates **sustained, complex coordination** that is **implausible without persistent social structures** enforcing norms or managing resources. Institutions are inferred from *enforced regularity*, not just similarity.

  **The Decision Procedure (Flowchart-in-Words):**

  1.  **GATE 1: OBSERVABLE PROPERTY**
      *   *Ask:* What specific, measurable property of the artifact/feature is the inference based on? (e.g., "Orientation N=348°±5°", "Rim diameter CV<5%", "Motif X present on 95% of sherds").
      *   *Threshold:* Must be objectively describable, quantifiable where possible.
      *   *Stop Cold:* If the property is vague ("looks ritualistic", "seems standardized") or relies solely on modern aesthetic judgment. *Output: "Do Not Infer - Property Undefined."*
      *   *Proceed:* If property is clear and measurable.

  2.  **GATE 2: NON-RANDOM INTENTIONALITY**
      *   *Ask:* Is this property demonstrably *unlikely* to arise by pure chance, basic functional constraint, or individual whim *in this specific context*?
      *   *Threshold:* Requires comparison to:
          *   Natural processes (e.g., soil movement shifting bones?).
          *   Universal functional constraints (e.g., pot base needs stability).
          *   Known individual variation/experimentation in the culture/period.
          *   *Use:* Basic stats (e.g., low coefficient of variation), replication experiments (known or plausible), site formation processes.
      *   *Stop Cold:* If a plausible, simpler non-intentional or non-*socially-coordinated* intentional (e.g., one potter's habit) explanation exists. *Output: "Do Not Infer Belief or Institution - Property Likely Non-Deliberate/Non-Coordinated."*
      *   *Proceed:* If the property strongly suggests deliberate human action beyond basic function/randomness.

  3.  **GATE 3: CLASSIFY INFERENCE TYPE (Belief or Institution?)**
      *   *Ask:* Is the plaque claiming a *specific belief/content* (cosmology, deity, myth) or a *sustained social structure/practice* (control, authority, specialized organization)?
      *   *Threshold:* Examine the proposed interpretive statement's core claim.
      *   *Proceed:* To Gate 4A (Belief) or Gate 4B (Institution).

  4.  **GATE 4A: BELIEF-ARTIFACT JUSTIFICATION**
      *   *Ask (Independence Presumption Active):* Does the evidence **directly encode propositional content** (e.g., writing, iconic representation with clear cross-cultural parallel) **OR** show **systematic contextual alignment** with *independently established* symbolic systems *of the same culture*?
          *   *Direct Encoding:* Inscription describing belief, unambiguous representational art tied to known belief system.
          *   *Contextual Alignment:* E.g., burial orientation aligns *specifically* with celestial events *and* other grave goods/structures in *this culture* are known to have cosmological links; motif is part of a *defined symbolic repertoire* from secure ritual contexts.
      *   *Sufficient Answer:* "Yes" to either, with specific evidence cited (e.g., "Motif matches temple friezes depicting God Y", "Orientation correlates with winter solstice sunrise at this latitude, and elite tombs contain solstice-aligned iconography").
      *   *Stop Cold:* If no direct encoding *and* no robust contextual alignment within the *same culture's* established symbolic framework. *Output: "Do Not Infer Specific Belief - Insufficient Evidence for Representational Content."*
      *   *Judgment Call Handoff:* If contextual alignment is *suggestive* but not robust (e.g., solstice alignment exists but no other cosmological links in graves), or relies on contested parallels. *Output: "Potential Belief Link - Judgment Call Required on Contextual Strength. Phrase as 'may reflect' or 'possibly associated with'."*

  5.  **GATE 4B: INSTITUTIONAL-RESIDUE JUSTIFICATION**
      *   *Ask (Independence Presumption Active):* Does the pattern demonstrate **sustained, complex coordination** that is **implausible without persistent social structures**? Is the scale/consistency beyond what kinship, simple barter, or individual reputation could achieve?
      *   *Key Indicators:*
          *   Abruptness/Wide Adoption: Change happens fast over large area.
          *   High Complexity/Standardization: Technically demanding, requires shared templates/measures.
          *   Resource Control: Involves scarce materials or large labor inputs.
          *   Sanction Evidence: Rare deviations are "corrected" or penalized (e.g., recut graves, rejected pots).
          *   Association w/ Power Symbols: Found predominantly with elite markers.
      *   *Sufficient Answer:* "Yes" based on *multiple* indicators, explicitly stating *minimal* institutional type (e.g., "implies enforced norms", "suggests centralized resource management", "indicates specialized production").
      *   *Stop Cold:* If the pattern is simple, slow-spreading, locally variable, or easily explained by functional efficiency/peer imitation. *Output: "Do Not Infer Institution - Pattern Explainable by Simpler Social Mechanisms."*
      *   *Judgment Call Handoff:* If indicators are present but ambiguous (e.g., standardization exists but no evidence of sanctions; complexity but slow adoption). *Output: "Institutional Influence Likely - Judgment Call Required on Specific Mechanism/Strength. Phrase as 'suggests organized production' or 'points to developing authority structures'."*

  6.  **GATE 5: ALTERNATIVE EXPLANATION CHECK (Final Safeguard)**
      *   *Ask:* Is there a *plausible, significantly simpler* explanation (functional, economic, environmental, individual) that hasn't been ruled out by Gates 2-4?
      *   *Threshold:* "Simpler" means requiring fewer unsupported assumptions about unseen beliefs/institutions.
      *   *Stop Cold:* If a strong alternative exists. *Output: "Do Not Infer Belief/Institution - Viable Alternative Explanation: [State Alternative]."*
      *   *Proceed to Sign-Off:* If Gates 1-4 are passed and no strong alternative remains. *Output: "Inference Justified at Stated Level."*

  **Where it Will Definitely Misfire:**
  *   **Unique/Isolated Finds:** Lacks context for Gates 3/4 (no alignment, no comparison for coordination scale).
  *   **Highly Fragmentary Evidence:** Cannot assess pattern consistency (Gate 2) or context (Gate 4A).
  *   **Cultures with Extreme Continuity/Discontinuity:** Presumptions calibrated for "normal" change may fail.
  *   **Modern Political Agendas:** The procedure flags judgment calls but can't force neutrality; curator must own this.
  *   **"Meaning" without Representation:** Cannot infer vague "spirituality" or "ideology" without specific representational content or institutional residue.

  **Application to Cases:**

  1.  **Standardized Burial Orientations (Cosmology?):**
      *   Gate 1: Pass (Measurable orientation, low deviation).
      *   Gate 2: Pass (Unlikely random/functional).
      *   Gate 3: Belief.
      *   Gate 4A: **Stop Cold UNLESS** direct link (e.g., bodies facing inscribed star symbols) OR contextual alignment (e.g., *same* graves contain solstice-aligned artifacts/deposits *and* celestial motifs in *this culture's* known ritual art). Lacking this, output: *"Do Not Infer Specific Belief. Phrase as 'highly consistent practice, significance unclear' or 'may reflect cultural norms'."* Cosmology requires *representational* evidence this procedure demands.

  2.  **Abrupt Ceramic Standardization Shift (Institutional Oversight?):**
      *   Gate 1: Pass (Quantifiable shift in dimensions/fabric).
      *   Gate 2: Pass (Abrupt change unlikely via slow drift).
      *   Gate 3: Institution.
      *   Gate 4B: **Likely Proceed** (Abrupt + Wide Adoption + Standardization = complex coordination). Sufficient Answer: *"Indicates enforced production norms or centralized organization of potting."* Judgment Call: Scale determines if "elite control" vs. "community coop". Output justified: *"Inference Justified: suggests institutional oversight."*

  3.  **Repetitive Domestic Pottery Motif (Institutional Residue? Ritual Authority?):**
      *   Gate 1: Pass (High frequency motif).
      *   Gate 2: **Likely Stop Cold OR Gate 4B Handoff.** Repetition isn't *necessarily* non-random coordination. Is it *enforced* uniformity (Institution) or just popular style (peer imitation)? No sanctions? Slow adoption? Gate 2 may fail if fashion/kinship tradition explains it.
      *   *If Gate 2 Passes:* Gate 3: Institution (unless claiming specific belief).
      *   Gate 4B: **Stop Cold OR Judgment Call Handoff.** High frequency alone isn't *complex coordination*. Without evidence of enforcement, resource control, or association with power, output: *"Do Not Infer Institution - Pattern Explainable by Cultural Tradition or Fashion."* **Why colleague hates it:** She *wants* to infer ritual authority ("institutional residue over daily life"). The procedure blocks this as overreach without evidence of *enforcement* or *control* specific to the institution. It allows "widespread cultural practice" but not "institutional residue" unless Gate 4B indicators (like sanctions or elite association) are met. The procedure cannot conflate popularity with authority.

  **What the Procedure Cannot Do:**
  1.  **Prove** a specific belief or institution.
  2.  **Resolve** fundamental archaeological debates (e.g., processual vs. post-processual).
  3.  **Generate** new interpretations; it only **evaluates** proposed ones.
  4.  **Assign** specific meaning to symbols without direct encoding/alignment.
  5.  **Avoid** all controversy; it makes conservative epistemic choices explicit.
  6.  **Replace** deep expertise; it structures and exposes reasoning quickly.
  7.  **Infer** "soft" institutions (like vague "social complexity") without material residue matching Gate 4B.

  This procedure forces clarity on the *type* of inference, rigorously applies differentiated independence presumptions, mandates explicit evidence thresholds, stops unwarranted leaps (especially for beliefs), flags necessary judgment calls, and prioritizes simpler explanations. It makes the curator's reasoning transparent and defensible in 20 minutes.
