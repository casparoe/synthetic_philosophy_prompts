  hey so im in my philosphy elective and we got into path dependence — like how once QWERTY won every other keyboard layout was basically dead forever, so history gets "locked in". my teacher said this is tied to history being non-ergodic and she mentioned absorbing states, which sounds like math but ok. then she brought up Gould and this idea of replaying the tape of life, saying if you rewound evolution you'd probly never get humans. but heres where im stuck: if path dependence locks things in, and its non-ergodic, doesnt that mean if you replayed the universe from the exact same start with the same physics you'd have to end up at the same absorbing states? like definatly QWERTY and maybe the industrial revolution? so wouldn't Gould be wrong, or is "locked in" only about not being able to backtrack, not about determinism? i feel like theres a false contradiction im inventing but i cant tell if path dependence actually means the same big outcomes would arrive anyway, or if thats a total misread.
