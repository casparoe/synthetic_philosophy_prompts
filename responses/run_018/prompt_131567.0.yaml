  First, I need to clarify path dependence. It's not about determinism from initial conditions but about how small events can lead to irreversible outcomes. QWERTY is a classic example—once adopted, it's hard to switch, but its initial dominance wasn't inevitable. The absorbing state here is the persistence of QWERTY, not its initial emergence.

