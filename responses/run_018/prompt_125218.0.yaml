prompt: |-
  In interdisciplinary and institutional contexts I keep seeing a pattern that does not sit cleanly within the standard taxonomy of epistemic injustice. A group has developed its own conceptual framework for articulating a specific harm or structural relation, and its members can deploy that framework with precision and mutual credibility. The difficulty is not that they are disbelieved, nor that they lack the concepts to understand their own experience. Rather, an institutional gatekeeper—a peer-review system, a policy tribunal, or a funding body—insists that the claim be translated into a dominant conceptual scheme before it can be recognized as knowledge or as a legitimate grievance. The translation is not neutral: the dominant scheme lacks the normative or relational distinctions that made the original claim specific, so the translated version sounds like a generic emotional complaint or an underspecified welfare claim. The group is then evaluated on that flattened version and found lacking, while the misrepresentation is treated as the failure of the original claim rather than of the translation. Is there an established concept for this exact configuration—the compelled translation of an already-articulated, group-specific epistemic framework into a dominant one that strips its structural dimensions, followed by the dismissal of the misrepresented result? If so, how precisely does it differ from hermeneutical injustice, from contributory injustice, and from ordinary epistemic exclusion? If not, can you propose a term, define its core conditions, and specify the boundary cases that would distinguish it from benign translation for the sake of mutual understanding?
reasoning: |-
  Okay, the user is describing a specific pattern they've observed in interdisciplinary and institutional settings. It involves a group with its own well-developed conceptual framework for articulating harm or structural relations. The issue isn't that they're disbelieved or lack concepts; it's that institutional gatekeepers force them to translate their framework into a dominant one. This translation strips away important nuances, making their claims sound generic. Then, the flattened version is dismissed, and the failure is blamed on the original claim rather than the translation. 

  Hmm, the user wants to know if there's an established concept for this. They also want to know how it differs from hermeneutical injustice, contributory injustice, and epistemic exclusion. If there isn't a term, they're asking for a proposal, including core conditions and boundary cases.

  First, I should recall existing concepts. Hermeneutical injustice (Fricker) is when someone lacks the concepts to understand their own experience. But here, the group *has* the concepts—they're just forced to translate. Contributory injustice (Dotson) is about willfully ignoring available concepts. Here, the gatekeepers might not be willfully ignoring; they're enforcing translation. Epistemic exclusion (Davis) is broader, about barriers to participation. This seems more specific—it's about the act of translation as distortion.

  So, no exact term exists. The key elements are: pre-existing group framework, forced translation into a dominant scheme, structural loss during translation, dismissal based on the distorted version, and blame misplaced onto the originators. 

  For a new term, "Epistemic Coercion" comes to mind. Or maybe "Conceptual Displacement"? "Hermeneutic Extraction" sounds vivid—like mining resources and leaving the valuable parts behind. "Epistemic Redaction" could work too, emphasizing the removal of key elements. But "Hermeneutic Extraction" feels most precise because it captures the forced taking and the resulting loss.

  Defining core conditions: 1) Group has a shared, articulated framework. 2) Translation into a dominant scheme is mandatory for institutional recognition. 3) Translation erases structural/normative distinctions. 4) Evaluation is based on the distorted version. 5) Failure is attributed to the group's framework, not the translation.

  Boundary cases: Benign translation would involve collaboration, preserving meaning, and aiming for understanding without dismissal. If the group's framework isn't yet developed, it might be closer to hermeneutical injustice. If gatekeepers reject without translation, that's exclusion.

  The user is likely an academic or professional dealing with interdisciplinary work, frustrated by systemic barriers. Their deeper need might be to legitimize this concept for advocacy or research, seeking language to articulate and challenge this dynamic. They might also want validation that this is a distinct injustice, not just a subset of existing ones. Proposing a term gives them a tool to name and address the problem in their work.
answer: |-
  This is a precise and insightful observation of a distinct epistemic harm pattern that **does not have a universally established, single-term concept** within the standard taxonomy of epistemic injustice (primarily Fricker & Dotson), though it intersects with several. It represents a specific form of **epistemic domination and misrepresentation** occurring at the institutional gatekeeping level.

  Here's a breakdown:

  1.  **Why it's distinct:**
      *   **Not Hermeneutical Injustice (Fricker):** The group *already possesses* the conceptual resources to understand and articulate their experience. The problem isn't a *lack* of concepts, but the *forced abandonment/distortion* of their own adequate concepts for institutional recognition.
      *   **Not Contributory Injustice (Dotson):** While related, contributory injustice focuses on the *willful refusal* to *accept* or *engage* with concepts offered by marginalized speakers (active rejection). Here, the gatekeeper *demands engagement* but only on *their own terms* (forced translation). The harm isn't *just* refusal to listen, but *active imposition of a distorting lens*.
      *   **Not (Only) Epistemic Exclusion (Davis):** Epistemic exclusion is broader, covering barriers to participation. This pattern is a *specific mechanism* of exclusion that happens *after* participation is attempted via the group's own framework. It's exclusion *through* compelled misrepresentation and subsequent dismissal based on that misrepresentation.
      *   **Not Testimonial Injustice (Fricker):** The group isn't primarily disbelieved *as individuals* due to prejudice. Their *claim*, once distorted, is dismissed as lacking *epistemic substance* within the dominant frame. The prejudice operates at the level of framework validity.

  2.  **Proposed Term: Hermeneutic Extraction**

      *   **Definition:** Hermeneutic Extraction is the institutional practice whereby a dominant epistemic framework compels the translation of a marginalized group's pre-existing, internally coherent, and structurally specific conceptual articulation of harm or social reality into the dominant framework. This process inherently strips away the original framework's crucial relational, normative, or structural distinctions due to the dominant framework's inadequacies. The resulting flattened, distorted representation is then presented as the legitimate version of the claim, which is evaluated and dismissed based on its inadequacies within the dominant framework. The dismissal is misattributed to the original claim's lack of validity rather than the violence of the extraction process itself.

  3.  **Core Conditions of Hermeneutic Extraction:**

      1.  **Pre-existing Articulated Framework:** A marginalized or non-dominant group possesses a developed, shared conceptual framework capable of precisely articulating a specific harm, structural relation, or social reality relevant to their experience.
      2.  **Institutional Compulsion:** An institutional gatekeeper (funding body, review board, tribunal, publisher, etc.) mandates that claims must be expressed *only* within the dominant conceptual scheme to be considered legitimate knowledge or a valid grievance.
      3.  **Structural Loss in Translation:** The dominant framework lacks the conceptual resources (specific distinctions, relational nuances, normative depth) necessary to accurately capture the meaning and specificity of the original claim. Translation is not neutral; it actively erases or distorts these structural elements.
      4.  **Flattened Misrepresentation:** The translated claim appears generic, overly emotional, conceptually vague, or lacking in robust justification *specifically within the dominant framework*.
      5.  **Evaluation & Dismissal on Distorted Grounds:** The institution evaluates and dismisses the claim *based on this distorted, flattened version*.
      6.  **Misattribution of Failure:** The failure of the claim to meet the dominant framework's standards is attributed to the *original claim* (or the group's framework) being inherently inadequate, irrational, or lacking epistemic rigor, rather than being recognized as a consequence of the flawed and coercive translation process (the extraction).

  4.  **Boundary Cases/Distinguishing from Benign Translation:**

      *   **Benign Translation for Mutual Understanding:**
          *   **Goal:** Genuine comprehension and dialogue *between* frameworks, not institutional gatekeeping.
          *   **Volition:** Translation is collaborative, optional, or exploratory, not a *mandatory requirement* for basic recognition.
          *   **Preservation of Meaning:** Effort is made to *preserve* nuance, even if imperfectly, using explanations, analogies, or acknowledging limitations ("This concept X roughly corresponds to Y, but importantly includes Z which your framework lacks"). The *lack* in the dominant framework is acknowledged.
          *   **No Dismissal Based on Translation:** The translated version isn't the *sole* basis for evaluation; the original framework's validity is respected, and limitations of the translation are considered. Evaluation might involve engagement *with* the original concepts.
          *   **Outcome:** Aim is understanding or finding common ground, *not* judgment of validity solely within one framework.
      *   **Hermeneutic Extraction:**
          *   **Goal:** Institutional validation/access *contingent on* conformity to the dominant frame.
          *   **Volition:** Translation is *compelled* as a condition of entry/consideration.
          *   **Structural Erasure:** Nuance is *sacrificed* to fit the dominant frame; the loss is inherent and often unacknowledged or framed as the group's failure to be "clear" or "rigorous".
          *   **Dismissal & Misattribution:** The flattened version *is* the claim for evaluation purposes. Its failure within the dominant frame is taken as proof of the *original claim's* deficiency.
          *   **Outcome:** Exclusion justified by the distorted product of the extraction process.
      *   **Boundary Case 1: Genuine Conceptual Underdevelopment:** If the group's framework is truly underdeveloped, vague, or lacks internal coherence *even on its own terms*, its failure to translate well *might* reflect its own limitations, not necessarily extraction. Hermeneutic extraction requires the original framework to be *internally adequate* for the group.
      *   **Boundary Case 2: Dominant Framework Adequacy:** If the dominant framework *can* accurately capture the nuances of the group's claim without significant loss, then translation, even if required, is not extraction. The harm arises precisely from the dominant framework's *inability* to represent the key structural elements.
      *   **Boundary Case 3: Rejection Without Translation:** If the gatekeeper simply rejects the claim *because* it uses unfamiliar concepts without demanding translation (pure contributory injustice or exclusion), it's not extraction. Extraction requires the *act* of compelled translation and the subsequent evaluation of the *distorted product*.

  **In essence:** Hermeneutic Extraction is the institutional enforcement of a conceptual monopoly. It forces marginalized groups to surrender their own hermeneutic tools, suffer the distortion of their claims through an inadequate dominant lens, and then be judged and found wanting based on that distortion, which is blamed on them. It's epistemic violence disguised as procedural neutrality. This concept highlights the active role of institutional epistemic power in *reshaping* knowledge claims to fit dominant paradigms and then using the resulting misfit to justify exclusion.
