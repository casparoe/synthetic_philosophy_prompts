answer: |-
  Your analysis cuts to the core of historiographical epistemology. The stalemate isn't primarily about the *past itself*, but about **conflicting frameworks for defining historical knowledge, evidence, and explanation**. Here's a diagnosis grounded in each side's practices:

  **1. What Each Side Treats as Data & Defeat:**
      *   **Mainstream Historiography:**
          *   **Data:** The aggregate archival record (documents, artifacts, stratified material culture, contemporary accounts, epigraphy, etc.), understood within established chronological frameworks built through cross-referencing sources, scientific dating, and contextual analysis. Inconsistencies *within* this framework are problems to be resolved *using* its methods.
          *   **Defeat:** A demonstrable failure to account for a significant body of primary evidence *within the established framework*, a proven methodological flaw (e.g., misdating, mistranslation, ignoring context), or the inability to offer a plausible causal narrative consistent with the aggregated evidence.
      *   **Pseudohistory / Methodological Pluralists:**
          *   **Data:** Specific anomalies, gaps, contradictions, or "unexplained" phenomena *within the mainstream narrative*; perceived patterns or similarities across disparate cultures/times deemed significant; textual or mythical narratives treated as potential encoded truths. The *failure* of the mainstream to fully explain *everything* is often a primary datum.
          *   **Defeat:** The successful integration of their key anomaly/pattern into the mainstream framework *without* needing their radical revision (e.g., a conventional explanation for an architectural similarity), or the demonstration that their core evidence is definitively fraudulent or misread. However, they often treat mainstream integration attempts as *dismissal* rather than refutation.

  **2. The Structure of the Disagreement: It's Multi-Layered:**
      *   **a) Ontology of the Archive:** Mainstream history assumes the archive, however fragmented, represents a *single*, complex, contingent past reality. Its inconsistencies are noise generated by loss, bias, or error *within that reality*. Pseudohistory often treats the archive as potentially obscuring a *different*, hidden reality (deliberate suppression, cataclysm, symbolic encoding). The "anomaly" isn't noise *within* the framework; it's a signal *of* an alternative framework.
      *   **b) Criteria for Explanation:**
          *   **Mainstream:** Seeks *causal explanation* rooted in empirically verifiable (or inferable) human agency, social forces, material conditions, and documented events within a coherent temporal sequence. Explanation involves fitting evidence into this causal web.
          *   **Pseudohistory:** Often prioritizes *narrative coherence* or *pattern recognition* over causal mechanisms. Explanations frequently rely on hidden actors (lost civilizations, advanced aliens, global conspiracies), non-falsifiable entities, or symbolic/mythic interpretations that bypass conventional causality. Temporal coherence is secondary to thematic or symbolic coherence.
      *   **c) Standards of Falsification:**
          *   **Mainstream:** Employs a web of consilience. A single anomaly (like the carbon-dated object) is rarely *decisive* on its own; it must be evaluated within the *entire* evidentiary network. Defeat requires the web to unravel significantly under the weight of anomalies or methodological critique *applied internally*. Direct replication is impossible, but *prediction* (e.g., where certain types of evidence *should* appear based on the model) and *retrodiction* (explaining known evidence) are key tests.
          *   **Pseudohistory:** Often treats the inability of the mainstream to explain *every single anomaly* as falsification of the *entire* mainstream model. Conversely, they treat mainstream critiques as missing the point because they apply the "wrong" framework. Their own theories are frequently *unfalsifiable* within their own terms – new gaps are explained by more hidden actors or lost knowledge. Defeat, for them, usually requires disproving a *specific, core claim* they hold sacrosanct (e.g., the literal existence of Atlantis in a specific place/time), which they often protect by making it vague or shifting the goalposts.

  **3. Competing Hypothesis on the Core Disagreement:**
      The fundamental divide is **not merely verbal, nor solely about the recoverability of the past, nor entirely about different questions.** It's about **incommensurable epistemic frameworks** regarding:
      *   **The Burden of Proof:** Mainstream places it on the challenger to overturn the established consilient model. Pseudohistory places it on the mainstream to explain every anomaly perfectly.
      *   **The Status of Absence/Negative Evidence:** Mainstream sees gaps/absence as inherent to the historical record. Pseudohistory often sees them as evidence *for* suppression or catastrophic loss.
      *   **The Role of Hermeneutics:** Mainstream uses hermeneutics to understand context and meaning *within* the evidence-based framework. Pseudohistory often uses it to *decode* evidence into an alternative reality.

  **4. Diagnosis: Why Empirical Refutation Stalls:**
      *   **Asymmetric Falsifiability:** Mainstream theories are complex webs, falsifiable by persistent, significant anomalies *within the framework*. Pseudohistorical theories are often structured to be unfalsifiable *from within their own framework* (hidden actors, lost knowledge explain everything). A single carbon date is a "decisive refutation" only if you accept the mainstream web; it's an "anomaly for reinterpretation" if you start from the premise the web is fundamentally wrong.
      *   **Different Explanatory Goals:** Mainstream seeks causal chains within documented human experience. Pseudohistory often seeks a grand, unifying, often awe-inspiring (or conspiratorial) narrative that transcends conventional causality. Refuting causal details doesn't touch the *desire* for the grand narrative.
      *   **Differing Valuation of Evidence Types:** Mainstream prioritizes contemporary, contextualized, cross-verifiable evidence. Pseudohistory often elevates myth, anomaly, pattern, and perceived "impossibilities" within the mainstream model.

  **5. What Counts as Progress:**
      Given this diagnosis of incommensurable frameworks prioritizing different things (causal chains vs. narrative/pattern coherence; burden of proof; falsifiability standards), progress requires:

      *   **Conceptual Distinction & Framework Accountability:** Explicitly separating:
          *   **Archival Ontology & Causal Explanation:** Dealing with the fragmented record to build the most probable causal account of specific past events/processes based on evidence consilience, acknowledging uncertainty.
          *   **Narrative Coherence & Meaning-Making:** Analyzing how stories (myths, national narratives, ideological constructs) are built, function, and draw upon (or distort) historical material for present purposes.
      *   **Demanding Hermeneutic Rigor:** Pseudohistorical frameworks must be held accountable for *internal* coherence and explanatory power *beyond* just negating the mainstream. Can they predict where *new* evidence consistent *only* with their model should appear? Can they explain the *entirety* of the existing record without resorting *ad infinitum* to hidden actors/lost knowledge? Do they offer plausible *causal mechanisms* for their proposed events?
      *   **Shifting the Question (for Critics):** Instead of just refuting specific claims, engage with *why* these narratives are compelling. What need do they fill that mainstream history doesn't? This doesn't validate the pseudohistory but helps understand the cultural/political dynamics of the stalemate.
      *   **Acknowledging Limits:** Mainstream history must clearly articulate the boundaries of its knowledge and the nature of its uncertainties, reducing the space where "mystery" can be exploited.

  **Conclusion:** The stalemate arises from **genuine, substantive incommensurability in foundational epistemic commitments**, particularly regarding the ontology of the archive, the burden of proof, the standards of falsification in a non-replicative discipline, and the primary goal of historical inquiry (causal explanation vs. narrative coherence/meaning). While not entirely irreducible, progress requires moving beyond empirical point-scoring to a meta-level discussion about the nature of historical evidence, explanation, and the responsibilities of competing frameworks. It necessitates demanding rigor and accountability *within* alternative hermeneutic frames and explicitly clarifying the distinct goals and limitations of different approaches to engaging with the past. The impasse won't be broken by more data alone, but by clarifying *how data counts* within fundamentally different paradigms.
