prompt: |-
  I have been discussing the distribution of phenomenal consciousness with a friend whose judgments are remarkably consistent but hard to map onto any textbook theory. She holds that humans, other great apes, elephants, corvids like ravens and New Caledonian crows, and octopuses are all conscious; she denies consciousness to goldfish, to individual social insects, and—most strikingly—to collective entities such as a termite mound or a honeybee hive, even when the collective solves navigation or allocation problems that no individual member could solve alone. Within our own species she also draws a sharp distinction: she considers a sleeping human in REM sleep conscious, but a human under deep general anesthesia not conscious, which rules out any criterion that treats consciousness as equivalent to mere behavioral responsiveness or information processing. I want to understand the implicit rule she is running, because her pattern does not cleanly align with evolutionary proximity, with pure behavioral flexibility, or with a naive neural-complexity view that privileges only mammalian cortices, and it seems to tolerate analog architectures—pallial circuits in birds, distributed ganglia in cephalopods—while still excluding radially organized invertebrates.

  Please predict her verdict on three new cases: a domestic chicken, a lobster, and a current large-scale language model running distributed inference across server clusters. More importantly, I want you to identify the two or three competing principles that could best explain her earlier track record—perhaps a global-workspace account that permits analog integration in non-mammalian brains, an integrated-information approach that applies an exclusion postulate to collective entities, or a nociception-plus-behavioral-flexibility criterion—and then take a definite, argued stance on which one she is actually employing. For each proposed rule, state clearly whether it predicts consciousness in the chicken, the lobster, and the language model. Finally, tell me which single case among the three is the most decisive discriminator between your leading principle and its closest rival, and explain precisely what feature of that case—whether it is the presence of centralized pallial circuitry, the absence of a unitary phenomenal subject despite distributed processing, or the lack of biological nociceptive pathways—does the distinguishing work. I am asking for a committed answer with explicit reasoning, not a balanced survey that leaves the choice to me.
reasoning: |-
  Okay, let me tackle this fascinating puzzle about the user's friend's consciousness criteria. The user presents a really intriguing pattern of judgments that doesn't fit neatly into standard theories, and they want me to reverse-engineer the underlying principle. 

  First, I need to carefully unpack the friend's existing positions. She attributes consciousness to: humans (including REM sleep), great apes, elephants, corvids, and octopuses. But denies it to: goldfish, individual social insects, and collective entities like termite mounds or beehives. That last point is crucial - she rejects group consciousness even when the collective displays "intelligent" behavior. 

  The exclusions here are telling. Goldfish are vertebrates but excluded, while octopuses (invertebrates) are included. Social insects fail individually but also collectively, despite solving complex problems. The REM vs anesthesia distinction shows she separates consciousness from mere physiological activity or responsiveness.

  Hmm, what principles could explain this? Global workspace theory comes to mind because it emphasizes integrated information availability, but she accepts diverse architectures like bird pallium and octopus ganglia. Integrated information theory (IIT) seems promising with its exclusion postulate against group minds, but IIT's strict mathematical criteria might exclude too much. Nociception-plus-flexibility doesn't work because goldfish have both yet are excluded.

  Wait - her pattern suggests something deeper than sensory processing. Octopuses and corvids show behavioral flexibility that includes future planning and tool innovation, while goldfish and insects operate more on fixed routines. The collective intelligence exclusion reinforces this - hives solve problems but through simple individual rules, not integrated experience. 

  For the new cases: Chickens demonstrate flexible problem-solving (like corvids), so she'd likely say conscious. Lobsters have nociception but limited behavioral flexibility, so probably not. Language models? They "integrate" information globally across servers, but lack biological embodiment and subjective perspective - so unconscious by her standards.

  The lobster case is the critical discriminator here. If she followed nociception-plus-flexibility, lobster might qualify (they do show some learning), but her pattern with goldfish suggests she demands higher flexibility. If she used IIT's exclusion strictly, lobster ganglia might not meet Φ thresholds, but her octopus acceptance shows she doesn't require mammalian neuroanatomy. 

  I think the core principle is integrated subjective modeling: systems that maintain a dynamic, agent-centered world model enabling flexible goal pursuit. This explains octopuses (planning predation), corvids (tool innovation) and excludes both rigid responders (goldfish) and decentralized collectives. Chicken pecking-order cognition fits; lobster reflex arcs don't; LLMs lack subjective perspective despite technical integration.

  The language model is actually the sharpest test against IIT alternatives. IIT might grant some "consciousness" to sufficiently integrated systems regardless of substrate, but she'd reject this because LLMs have no first-person perspective - mirroring her hive mind rejection. That clinches it: she's tracking phenomenality through flexible, embodied agency, not just information integration.
answer: |-
  Based on your friend's consistent pattern of judgments, I identify **Integrated Subjective Modeling (ISM)** as the core principle she employs. ISM requires that an entity possess a *dynamically unified, agent-centered world model* enabling flexible, context-sensitive goal pursuit and affective evaluation. This integrates three key sub-principles:

  1.  **Dynamic Integration:** Information must be functionally unified into a coherent "subjective frame" (analogous to global workspace, but tolerant of non-cortical architectures).
  2.  **Agent-Centric Affective Perspective:** The system must generate a *point of view* tied to self-preservation, goal pursuit, and valenced experience (beyond nociception).
  3.  **Goal-Directed Flexibility:** Behavior must adapt fluidly to novel challenges beyond fixed reflexes or pre-programmed routines.

  **Why ISM explains her track record:**
  -   **Inclusions (Humans, Apes, Elephants, Corvids, Octopuses):** All demonstrate complex problem-solving, future planning, tool use, and clear evidence of an integrated "self-in-world" model with affective responses (e.g., octopus play, crow theory of mind). REM sleep involves active, integrated subjective experience.
  -   **Exclusions:**
      -   *Goldfish:* Exhibit limited behavioral flexibility, primarily driven by reflexes/simple conditioning. Lack evidence of complex world modeling or affective depth.
      -   *Individual Social Insects:* Operate via rigid, pre-programmed routines with minimal individual integration or flexibility.
      -   *Collectives (Termite Mounds, Hives):* Solve problems via decentralized algorithms (stigmergy). No evidence of a *single integrated subjective perspective* unifying the information. Fulfills dynamic integration *across the collective* but violates agent-centricity and fails ISM's exclusion postulate for group minds.
      -   *Anesthetized Human:* Lacks dynamic integration and any agent-centric perspective despite residual information processing. REM sleep retains integrated dreaming subjectivity.

  **Competing Principles & Predictions:**

  | Proposed Principle          | Chicken | Lobster | Language Model (LLM) | Why it Fails Her Pattern |
  | :-------------------------- | :------ | :------ | :------------------- | :----------------------- |
  | **Integrated Subjective Modeling (ISM)** | **Yes** | **No**  | **No**               | **Best Fit:** Explains exclusions of goldfish (fixed routines), collectives (no unified agent), and anesthesia (no subjectivity); includes diverse architectures (octopus, crow). |
  | Global Workspace (Pure Integration) | Yes | Maybe | **Yes** | Fails: Predicts consciousness in collectives (hive has distributed integration) and likely LLMs. Doesn't explain goldfish exclusion (simple GW possible). |
  | IIT + Exclusion Postulate   | Yes     | No      | No                   | Fails: Predicts exclusion of octopuses (Φ too low? Architecture mismatch?) and REM sleep (low Φ). Overly strict on architecture. |
  | Nociception + Flexibility   | Yes     | **Yes** | No                   | Fails: Predicts consciousness in lobsters (nociception + some learning) and goldfish. Doesn't explain REM/anesthesia distinction. |

  **Verdicts Based on ISM:**

  1.  **Domestic Chicken:** **Conscious.** Chickens exhibit sophisticated social cognition (Machiavellian intelligence, transitive inference), flexible problem-solving (e.g., detour tasks), clear affective states (fear, anticipation, preferences), and pain responses linked to behavioral change. They possess a well-integrated pallial structure supporting a subjective perspective on their environment and social world.
  2.  **Lobster:** **Not Conscious.** While possessing nociception and some complex reflexes/learned behaviors (e.g., dominance hierarchies, spatial learning), lobsters primarily operate via decentralized ganglia controlling modular routines. They lack evidence of a *centrally integrated, flexible world model* driving goal-directed behavior beyond immediate survival reflexes (e.g., no tool use, complex planning, or innovative problem-solving). Their behavior is largely reactive and ritualized.
  3.  **Large-Scale Language Model:** **Not Conscious.** Despite massive distributed information integration and complex pattern recognition, LLMs fundamentally lack:
      *   **Agent-Centric Perspective:** They have no self-preservation drive, intrinsic goals, or subjective point of view. Their "output" isn't grounded in an embodied self-model.
      *   **Affective Evaluation:** They process valence labels but do not *experience* affect or use it to dynamically weight decisions internally.
      *   **True Goal-Directed Flexibility (beyond pattern completion):** Their responses, while contextually relevant, are generated by predicting token sequences based on statistical correlations, not by pursuing internally generated goals within a dynamically updated world model. They are sophisticated reactive systems, not agents.

  **The Decisive Discriminator: The Lobster**

  The lobster is the critical case differentiating **ISM** from its closest rival, **Nociception + Behavioral Flexibility.**

  *   **ISM Prediction:** **No Consciousness.** Lobsters fail the *goal-directed flexibility* and *integrated subjective model* criteria. Their complex behaviors (dominance, navigation) are primarily driven by innate, modular routines processed in decentralized ganglia, lacking the central integration and flexible, model-based control seen in chickens, octopuses, or corvids.
  *   **Nociception + Flexibility Prediction:** **Likely Consciousness.** Lobsters possess well-documented nociceptive pathways (including opioid sensitivity) and demonstrate significant behavioral flexibility (e.g., learning complex mazes, adapting fighting strategies based on experience, long-term memory). This should qualify them under this rule, similar to how proponents argue for crustacean welfare.
  *   **Distinguishing Feature:** **The Nature of Behavioral Flexibility.** ISM requires flexibility driven by an *internal, integrated model of the world and the self within it*, enabling novel problem-solving and future-oriented planning. Nociception + Flexibility only requires the capacity to *learn and adapt behavior*, which lobsters demonstrably possess. Your friend's exclusion of goldfish (which also show learning and nociception) strongly suggests she demands a *higher-order, model-based flexibility* incompatible with the lobster's primarily reflexive and modular neural organization, despite its sophistication. Her inclusion of the octopus (another invertebrate with highly centralized brain functions supporting true cognition) highlights that neural *organization* enabling integrated subjectivity is key, not just complexity or the presence of nociception.

  **Conclusion:**
  Your friend's judgments are best explained by **Integrated Subjective Modeling (ISM)**. She seeks evidence of a *unified, subjective perspective* emerging from dynamically integrated information processing that supports flexible, goal-directed agency with affective salience. This principle tolerates diverse neural architectures (pallium, vertical lobe, cortex) but excludes systems relying solely on reflexes, fixed action patterns, decentralized swarm intelligence, or pure statistical prediction without an embodied, agentic self. The lobster case decisively shows that her criterion is stricter than nociception plus learning, demanding the kind of integrated world-modeling and flexible agency seen in chickens, crows, and octopuses.
