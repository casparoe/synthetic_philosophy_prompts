answer: |-
  Here's a concrete toy scenario showing the snag:

  **The Office Coffee Mystery**  
  At WidgetCorp, analysts study employee alertness (B). They notice:  
  - **A**: Chugging espresso (vs. decaf) shows *zero correlation* with alertness (B) in their 100-employee dataset.  
  - **Heuristic**: "No correlation? Treat A and B as independent! Espresso doesn't affect alertness!"  

  **Hidden Structure**:  
  Unbeknownst to them:  
  - **D**: A rare genetric variant (1% of population) enabling caffeine sensitivity.  
  - **C**: "Caffeine Metabolism Boost" – *only* occurs if D is present.  
  - **Mechanism**: If D=True, then A (espresso) → C (boost) → B (alertness ↑). If D=False, espresso does nothing.  

  WidgetCorp's dataset had *one* employee with D (who got alert from espresso), but 99 without D (espresso ≠ alertness). The correlation *appeared* flat → independence assumed.  

  **The Snag**:  
  The heuristic says "no observed correlation → independence". But *globally*, A and B are **not** independent – they're strongly linked *if* D is present. The sample just missed D's prevalence due to rarity.  

  **Core Conceptual Issue**:  
  "Is independence a property of the *system* or our *sample*?" Here, the heuristic mistakes *sample-specific non-correlation* (due to rare D) for *system-wide independence*. The system has a hidden *conditional dependence* (A→B | D=true).  

  **Representational or Epistemic?**  
  It's **epistemic**: The flaw is in *knowledge* (missing D), not representation. If we knew D, we'd represent A⊥B | D=false and A→B | D=true. But our data *lacked evidence of D*, tricking the heuristic.  

  Bottom line: **The presumption-of-independence heuristic fails epistemically when rare conditional mediators invisibly "gate" causality in the broader population.**
