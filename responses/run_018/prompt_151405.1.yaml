  1.  **Truth-value vs. Consequentialism:** The plaque's factual inaccuracy conflicts with historical truth (a deontological concern for accuracy), but preserving the myth serves a greater good by ensuring bridge maintenance (a utilitarian/consequentialist prioritization of outcomes over strict truth).
  2.  **Social Ontology of Narrative:** The "neighbour story," though historically false, has become a socially constructed reality; it embodies genuine community spirit and identity forged *around* the myth, possessing its own validity within the community's shared understanding.
  3.  **Functional vs. Historical Authenticity:** The bridge's significance and current function are intrinsically tied to the myth that motivates its upkeep; preserving its physical state through the myth arguably holds more practical value than correcting its historical origin story.
  4.  **Institutional Legitimacy and Foundational Myths:** The charity's legal standing and community role derive legitimacy solely from the perpetuated myth, revealing how institutions can be built upon and sustained by narratives that may lack historical foundation but possess potent social power.
  5.  **Paternalism and Epistemic Authority:** Choosing to maintain the myth involves a paternalistic judgment that the community's welfare (bridge maintenance) outweighs its right to historical truth, raising questions about who possesses the authority to make that trade-off for the collective.
