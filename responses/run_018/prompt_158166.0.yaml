  Then, (c): Western systems having analogous obligations through lobbying and patronage. This challenges universality because if similar practices exist but are legal in the West, it suggests hypocrisy. Lobbying and campaign donations create dependencies, much like gifts, but are institutionalized. This makes the universal claim seem culturally specific. So, low probability, say 0.15. The visibility and legal framing differ, but the underlying obligations are comparable.

  Lastly, (d): whether a norm can be universal if enforcement depends on state capacity. If a norm requires strong institutions to enforce, but many societies lack these, it might not be feasible universally. Morality shouldn't depend on enforceability. But norms need institutional support. This points to the norm being a product of specific state capacities rather than universal morality. Probability 0.25.

