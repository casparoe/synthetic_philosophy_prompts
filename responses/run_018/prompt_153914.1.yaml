  Now for potential defeaters. The strongest would be empirical evidence that mental properties can't serve as constraints - perhaps from neuroscience showing mental states always correspond directly to productive physical causes. Weaker defeaters might involve conceptual issues, like whether constraint-based causation meets our intuitive concept of "doing something." 

