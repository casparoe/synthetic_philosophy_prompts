prompt: |-
  I'm working on a chapter about Ulysses contracts and constitutional precommittment, and I'm trying to pin down what I actually think about tying future hands. Here are my gut verdicts:

  1. Odysseus tying himself to the mast to resist the sirens: totally fine.
  2. An addict giving her friend the meds with instructions not to return them even if she begs: fine.
  3. A dementia patient signing an advance directive refusing feeding tubes in a later happy-but-confused state: fine, even though it feels like we're honoring a past self over a present one.
  4. A depressed writer giving her agent contractual power to force manuscript submission even when she begs to stop: I think this is okay too, but it feels different - it's forcing action rather than blocking harm, and I'm not sure why I don't mind.
  5. A parliament enacting a climate lock that automatically bans fossil subsidies if emissions miss targets, with no legislative override: not fine. That binds future people who never consented.
  6. A constitutional provision requiring 90% supermajority to amend free speech protections: fine, that's classic entrenchment.
  7. But a constitutional language preservation clause that can never be repealed, binding all descendants: not fine. Classic dead hand.

  The tension is between (3) and (4) - both bind a future self with changed preferences - and between (5) and (6), where both are collective precommitments but I split them. Is there a principle that captures this pattern, maybe about whether the bound party can be said to have authorized the bond? Please state it precisely, say which clause each case motivates, tell me what it predicts for the case I'm wafling on - a university charter (adopted by current faculty) that automatically dissolves any department with zero peer-reviewed publications in 10 years - and be honest about which of my verdicts above it can't save without getting ugly.
reasoning: |-
  Okay, the user is working on a chapter about Ulysses contracts and constitutional precommitment. They've listed seven scenarios with their gut verdicts on whether binding future actions is acceptable. The main tension they're noticing is between cases 3 and 4 (individual precommitment) versus 5, 6, and 7 (collective precommitment). They're trying to find a principle that explains their intuitions across these cases.

  Looking at their examples, a pattern emerges. In cases where the bound party consented to the constraint at the time of agreement (like Odysseus, the addict, dementia patient, and writer), they're okay with it. But when it binds future generations who couldn't consent (like the climate lock or irreversible language clause), they object. The supermajority requirement is acceptable because it allows amendment - future generations can still change it, just with higher consensus.

  The underlying principle seems to be about contemporaneous consent plus reversibility. For individuals, binding future selves is acceptable because the person consented when making the commitment. For collectives, binding future majorities is only acceptable if those future people can reverse the decision through some feasible procedure (like the supermajority requirement). Permanent, irreversible constraints on unconsenting future generations cross a line.

  Applying this to their university department case: The current faculty consented to the dissolution clause. Future faculty inherit this system but could theoretically amend the charter through existing governance procedures. The key question is whether reversal is practically feasible - if amending the charter requires near-impossible hurdles, it might violate the principle. The user's uncertainty might stem from whether future faculty have meaningful exit options or amendment power.

  This principle explains most of their intuitions well, except possibly case 4 (the writer). Here, the future self is being forced to act rather than restrained from harmful action. But since the writer consented when rational, and could potentially renegotiate the contract later, it fits the consent-plus-reversibility framework.

  For their chapter, emphasizing the distinction between binding one's own future selves versus binding others who couldn't consent would clarify the ethical boundary. The reversibility condition resolves the tension in collective cases - it's not about the policy itself but about maintaining future agency. The dementia case (3) remains philosophically tricky but aligns through the lens of honoring prior competent consent.
answer: |-
  Here's a principle capturing your intuitions, derived from the tension points you identified:

  **The Contemporaneous Consent & Reversibility Principle:** Binding future action is legitimate when *both* of these conditions are met:
  1.  **Contemporaneous Consent:** The party whose future freedom is bound *explicitly consented to the specific constraint* at the time the precommitment was made, while possessing sufficient decision-making capacity relevant to the choice.
  2.  **Reasonable Reversibility:** The constraint incorporates a *feasible mechanism* for the bound party (or a legitimate contemporary proxy) to reassess and *override* the commitment in the future under reasonable conditions, accounting for the nature of the commitment and the potential for legitimate preference/context change.

  **Applying the Principle to Your Cases:**

  1.  **Odysseus:** **Fits.** (1) He consented explicitly. (2) Reversibility *within the commitment itself* wasn't intended, but the constraint was physically temporary and context-specific (once past sirens, untied). His crew acted as *his* proxy.
  2.  **Addict:** **Fits.** (1) She consented explicitly while rational. (2) Reversibility exists: she can later instruct the friend *after* the craving passes or when stable. The constraint is temporary/proxy-mediated.
  3.  **Dementia Directive:** **Fits (though borderline on reversibility).** (1) Patient consented explicitly while competent. (2) Reversibility *is* debated, but standard practice often allows the *current* self (or their appointed proxy/guardian) to override the directive if they express a clear, competent *current* wish (though legally complex). The principle leans towards honoring consent unless the current self can reasonably reassert autonomy *in the moment*.
  4.  **Writer:** **Fits.** (1) She consented explicitly while rational. (2) Reversibility exists: she can fire the agent, renegotiate the contract *after* the immediate panic, or set clearer boundaries upfront (e.g., "only after 3 begging sessions"). The agent acts as *her* pre-agreed proxy. (Action vs. blocking harm isn't the key distinction; consent is).
  5.  **Climate Lock (No Override):** **Fails (primarily #2).** (1) Future parliament/people did *not* consent. (2) Crucially, it lacks reversibility: no mechanism for the bound future majority to reassess or override based on new circumstances, costs, or preferences. It binds dissenters permanently without recourse.
  6.  **Supermajority for Free Speech:** **Fits.** (1) The adopting generation consented. (2) It has reversibility: a *contemporary* supermajority (representing a strong current consensus) *can* override it. Future generations are bound *only* by the high threshold, not absolutely.
  7.  **Permanent Language Clause:** **Fails (both #1 & #2).** (1) Future generations did not consent. (2) It lacks reversibility *by design*; no contemporary majority or supermajority can ever override it. True "dead hand" control.

  **The University Department Case Prediction:**

  *   **Scenario:** University charter (adopted by current faculty) automatically dissolves any department with zero peer-reviewed publications in 10 years.
  *   **Principle's Prediction:** **Likely Acceptable, but depends on reversibility details.**
      *   **Contemporaneous Consent (#1):** Met. Current faculty consented to the rule by adopting the charter.
      *   **Reasonable Reversibility (#2):** This is key.
          *   *If* the charter can be amended by a *contemporary* faculty vote (even a supermajority) to *remove or modify* this rule *before* a department hits the 10-year mark or even after dissolution to allow reconstitution, then Reversibility exists. Future faculty can reassess the rule's wisdom.
          *   *If* the dissolution rule is itself entrenched (e.g., requires unanimity or is declared unamendable), it likely **fails** the Reversibility condition. Future faculty are bound by a rule they cannot change, even with overwhelming consensus, despite never consenting to *that specific level of entrenchment*. This resembles the "dead hand" problem.

  **What the Principle Can't Save Gracefully:**

  *   **Your Gut Feeling on (3) Dementia Directive:** The principle *fits* but highlights the tension. It accepts that honoring prior consent over the current "happy but confused" self is legitimate *because* of condition #1 and the practical difficulty of establishing reliable current consent in dementia. However, if you feel strongly that the *current* self's happiness should always trump the *past* self's directive *regardless* of capacity assessment, the principle won't align perfectly. It prioritizes the competent self's autonomy plan over the incompetent self's momentary state. To save the "not fine" feeling here, you'd need a different principle (e.g., strict present-moment preference maximization, ignoring past consent if current self is content).
  *   **The Distinction Between (4) Writer and (3) Dementia:** The principle explains why both are acceptable: consent + proxy/reversibility mechanism. If you feel (4) is *more* acceptable than (3), it might be because the writer retains clearer *current* capacity to initiate reversal (firing the agent) compared to the dementia patient whose capacity to override is fundamentally impaired. The principle captures the *presence* of reversibility, but the *ease* or *reliability* of exercising it under altered states might be your deeper concern, which the principle acknowledges but doesn't explicitly weight.

  **Conclusion:**
  The **Contemporaneous Consent & Reversibility Principle** cleanly explains your splits between individual precommitments (1-4), justifies classic constitutional entrenchment (6), and rejects permanent dead-hand control (5,7). It resolves the tension between (3) and (4) by showing they share consent and (at least theoretical) reversibility. For the university case, it provides a clear test: is the dissolution rule itself subject to amendment by contemporary stakeholders? If yes, it's likely acceptable; if irrevocably entrenched, it's not. The principle's main vulnerability is its handling of cases where assessing the bound party's *current* capacity for reversal is ambiguous or impossible (like advanced dementia), but it provides a strong framework for the vast majority of precommitment scenarios.
