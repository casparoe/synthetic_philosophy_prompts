  First, the user is likely a scholar or student in philosophy, political theory, or ethics. They need a clear framework to evaluate different theories. Their explicit request is for criteria that any theory must meet. But deeper, they might be preparing for a literature review, thesis, or article. They want to avoid bias by setting standards first. 

  The key challenges here are: dealing with structural harm over centuries, no living perpetrators/victims, and using Jaspers's taxonomy. The user also wants tensions between desiderata highlighted. I should focus on structural cases like economic extraction or environmental damage, not discrete events like genocides. 

  Jaspers's four guilts: criminal (legal), political (membership), moral (personal complicity), metaphysical (human solidarity). The theory must adapt these to intergenerational contexts. For example, political guilt might persist through institutions, but how? And metaphysical guilt could relate to ongoing benefits from past injustices.

  Desiderata should cover distinctions, phenomena to explain, and consistency with principles. The user mentioned examples like inheriting liability vs. duty to repair. I need to ensure each desideratum has a clear rationale. Also, flag tensions, like collective continuity vs. present moral agency. 

  Possible tensions: If a theory requires a continuous collective agent across generations (for guilt assignment), but modern individuals aren't blameworthy, that's a conflict. Another might be between acknowledging shame appropriately without attributing blame. 

  For each desideratum, I'll include the case or conceptual pressure. For instance, structural harm accumulation—how does guilt transmit if harms built up slowly? Or the non-identity problem: present people exist because of past injustices, so can they owe repair? 

  I'll also note how Jaspers's taxonomy handles each point. His framework isn't designed for intergenerational structural harm, so it might fall short on most. Political guilt could apply to state continuity, but moral guilt requires personal action, which conflicts with no living perpetrators. 

  Need to keep it focused on criteria, not literature survey. Make sure desiderata are clear, numbered, with motivations. Highlight tensions explicitly, maybe in a separate section. Finally, a concise summary of how Jaspers fares against the list.
answer: |-
  Here are the desiderata for an adequate theory of transgenerational national guilt, grounded in your specifications, with motivations and flagged tensions:

  **Core Desiderata:**

  1.  **Account for Structural Harm & Long Duration:**
      *   **Motivation:** The theory must handle harms resulting from centuries of embedded systems (e.g., colonial extraction, entrenched caste systems, systemic environmental exploitation), not just discrete events. It must explain how guilt relates to diffuse, cumulative processes where individual perpetrators/victims fade, but the *structure* and its *effects* persist.
      *   **Must Preserve:** Distinction between guilt arising from specific acts vs. guilt arising from participation in/perpetuation of harmful structures over time.

  2.  **Distinguish Liability from Duty:** *(Crucial Distinction)*
      *   **Motivation:** The theory must avoid equating inheriting *guilt* (implying blameworthiness) with inheriting a *duty to repair* (a forward-looking obligation). Present generations may have obligations stemming from past injustice without being personally blameworthy *for that injustice*.
      *   **Must Preserve:** Clear separation between backward-looking culpability (guilt) and forward-looking responsibility (duty to address consequences/legacies).

  3.  **Explain Appropriate Shame/Affective Response Without Personal Blameworthiness:**
      *   **Motivation:** To explain why individuals today might feel profound shame or discomfort about their nation's past structural injustices (e.g., benefiting from historical land dispossession), even while acknowledging they did not personally commit the acts and bear no *criminal* or *moral* (Jaspers) guilt for them.
      *   **Must Explain:** The phenomenology and potential appropriateness of collective shame or inherited shame as distinct from personal moral failing.

  4.  **Maintain Agency Requirement for Moral Guilt:** *(Potential Tension)*
      *   **Motivation:** Uphold the principle that *moral guilt* (Jaspers' sense) requires some form of agency, identification, or endorsement. Present individuals cannot be *morally blameworthy* for acts committed before their birth, over which they had no control or connection.
      *   **Must Preserve:** The core link between moral responsibility and some element of choice, participation, or conscious identification with the wrongdoing. **Tension Alert:** Direct conflict with simplistic notions of inheriting moral guilt/blame.

  5.  **Address the Non-Identity Problem:**
      *   **Motivation:** Present populations exist *because* of the historical chain of events (including the injustices). It seems paradoxical to owe repair for acts that were necessary conditions for one's own existence. The theory must navigate this without negating duties.
      *   **Must Be Consistent With:** The logical implications of counterfactual history while still grounding obligations based on present realities (benefits, ongoing structures, normative commitments).

  6.  **Explain Political Guilt Transmission:** *(Potential Tension)*
      *   **Motivation:** Jaspers defines political guilt as arising from membership in a polity responsible for acts done in its name. The theory must explain how this membership-based guilt persists across generations when the polity itself endures but its members change entirely. How does the *nation* as a continuous entity bear guilt?
      *   **Must Explain:** The continuity of the political collective agent and how membership *now* connects to actions *then*. **Tension Alert:** Requires conceptualizing a continuous collective agent across generations, raising questions about agency and responsibility attribution over time.

  7.  **Incorporate Metaphysical Guilt Meaningfully:**
      *   **Motivation:** Jaspers' metaphysical guilt stems from human solidarity and complicity in allowing evil to exist. The theory must apply this to present generations' relationship to historical structural evil. How does solidarity create a burden related to past suffering one could not have prevented?
      *   **Must Explain:** How present individuals share in a "metaphysical" burden related to past structural harms *because* they are human and part of the same moral community/history, distinct from political membership or moral fault.

  8.  **Account for Benefits and Entanglements:**
      *   **Motivation:** Present generations often benefit materially, culturally, or politically from past structural injustices (e.g., inherited wealth, established institutions built on exploitation, dominant cultural narratives). The theory must explain how deriving *ongoing benefits* or being *entangled* in the *persisting structures* (even if reformed) relates to guilt or obligation.
      *   **Must Preserve:** Distinction between benefiting innocently vs. culpably perpetuating unjust structures derived from the past.

  9.  **Avoid Collective Culpability Reducing to Sum of Individuals:**
      *   **Motivation:** The guilt/obligation must be genuinely *collective* (national) or *membership-based*, not merely the summed guilt/obligations of individuals who happen to share a nationality. The nation itself must be a relevant bearer of *some* form of guilt/responsibility.
      *   **Must Preserve:** Distinction between collective guilt/responsibility and distributed individual guilt/responsibility.

  **Key Tensions:**

  *   **Tension 1: Collective Continuity vs. Moral Agency (Desiderata 4 & 6):** Desideratum 6 requires the *nation* to persist as a continuous guilt-bearing agent. Desideratum 4 insists that *moral guilt* requires present-tense agency/identification. A theory satisfying both must either:
      *   Define national guilt *only* in political/metaphysical terms (excluding moral guilt), *or*
      *   Develop a sophisticated account of how present individuals *can* identify with/endorse the past in ways that ground a specific form of moral guilt, *or*
      *   Radically reinterpret "guilt" for collectives over time in a way that doesn't imply personal moral blame.
  *   **Tension 2: Non-Identity vs. Duty to Repair (Desiderata 5 & 2):** Grounding a robust duty to repair for past structural harms is challenging when the present beneficiaries wouldn't exist without those harms. A theory must reconcile the counterfactual problem with the normative intuition that present structures of advantage/disadvantage demand rectification.

  **How Jaspers' Taxonomy Fares:**

  *   **Criminal Guilt:** Largely irrelevant to the specified case (dead perpetrators, structural harm).
  *   **Political Guilt:** Most directly applicable but needs significant extension. Jaspers focuses on contemporaries. The theory must explain *how* political guilt attaches to the *enduring* polity across generations and how membership *now* constitutes liability for past structural acts done by the polity.
  *   **Moral Guilt:** Problematic. Jaspers links it to personal knowledge/complicity/acquiescence. This clashes directly with Desideratum 4 & the core scenario (no living perpetrators). Applying moral guilt transgenerationally risks violating the agency principle.
  *   **Metaphysical Guilt:** Highly relevant but underdeveloped by Jaspers for transgenerational contexts. It provides a foundation for explaining shame/affective responses (Desideratum 3) and a sense of burden rooted in solidarity (Desideratum 7), distinct from blame. However, it needs elaboration on how it translates into specific obligations or national guilt.

  **In Summary:** An adequate theory must navigate structural harms, distinguish guilt from duty, explain collective shame without personal blame, uphold moral agency, handle non-identity, sustain political guilt via collective continuity, leverage metaphysical solidarity, account for benefits/entanglements, and maintain genuinely collective responsibility—all while resolving the inherent tensions between collective continuity over time and the requirement for agency in moral guilt, and between non-identity and the duty to repair. Jaspers provides essential categories (especially Political and Metaphysical) but requires substantial development and refinement to meet these demands for long-term structural injustice.
