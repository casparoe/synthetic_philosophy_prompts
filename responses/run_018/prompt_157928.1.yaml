answer: |-
  ### **Rent & Wages: The Standing-Shift Simulation**  
  **Objective**: Physically experience how price controls (rent caps, wage floors) restructure moral claims by excluding groups from the "pool" of legitimate claimants. Participants discover that defenders of price controls can dismiss the excluded as lacking standing, even though the policy itself creates that exclusion.

  ---

  ### **Game Setup**  
  **Participants**: 16 grad students  
  **Roles** (assigned via face-down cards):  
  - **Landlords (3)**: Own 1 apartment each.  
  - **Tenants (5)**: Seek 1 apartment each.  
  - **Employers (3)**: Offer 1 job each.  
  - **Workers (5)**: Seek 1 job each.  
  - **Regulator (1)**: Enforces price controls (no negotiating prices).  

  **Markets**:  
  - **Housing Market**: 3 apartments, 5 tenants → **2 tenants excluded**.  
  - **Labor Market**: 3 jobs, 5 workers → **2 workers excluded**.  

  **Price Controls**:  
  - Rent cap: **70 points** (landlords cannot charge more).  
  - Wage floor: **80 points** (employers cannot pay less).  

  **Stakes**: Points = candy (e.g., 10 points = 1 piece).  

  ---

  ### **Hidden Payoff Structure**  
  *(On role cards; participants keep secret)*  
  **Landlords (Cost = reservation rent)**:  
  - Profit = Rent received - Cost.  
  - If no match: 0 points.  
  - *Example Card*: "Cost: 40. Rent capped at 70. If you rent, gain (70 - 40) = 30 points."  

  **Tenants (Value = max willingness to pay)**:  
  - Gain = Value - Rent paid.  
  - If no match: 0 points.  
  - *Example Card*: "Value: 90. Rent capped at 70. If you rent, gain (90 - 70) = 20 points."  

  **Employers (Value = worker’s output)**:  
  - Profit = Value - Wage paid.  
  - If no hire: 0 points.  
  - *Example Card*: "Value: 120. Wage floor 80. If you hire, gain (120 - 80) = 40 points."  

  **Workers (Cost = reservation wage)**:  
  - Gain = Wage received - Cost.  
  - If no job: 0 points.  
  - *Example Card*: "Cost: 50. Wage floor 80. If hired, gain (80 - 50) = 30 points."  

  **Regulator**:  
  - Enforces price caps. Breaks ties if multiple matches.  
  - Gains 20 points if no rules broken.  

  ---

  ### **Timeline (90 Minutes)**  
  1. **Intro & Role Assignment (10 min)**:  
     - Explain markets, price controls, and goals.  
     - Distribute **face-down role cards** (participants don’t reveal payoffs).  
     - Announce: *"Rent capped at 70; wage floor at 80. Not all will match."*  

  2. **Matching Phase (25 min)**:  
     - **Free Negotiation (15 min)**:  
       - Landlords/tenants and employers/workers mingle.  
       - **Rules**:  
         - Prices are fixed (no haggling). Only negotiate *pairings*.  
         - Pairs must register with Regulator.  
         - Regulator enforces caps; voids illegal deals.  
     - **Regulator Allocation (10 min)**:  
       - Unmatched participants lobby Regulator.  
       - Regulator assigns remaining slots arbitrarily (e.g., lottery, merit).  
       - **Result**: 2 tenants, 2 workers excluded.  

  3. **Scoring & Reveal (10 min)**:  
     - Participants calculate points based on matches.  
     - Regulator announces final pairs/exclusions.  
     - **Sample Outcome**:  
       - Tenant A (Value 100) + Landlord (Cost 40): Both gain 30 points.  
       - Worker B (Cost 60) + Employer (Value 100): Both gain 20 points.  
       - Excluded Tenant (Value 70): 0 points.  
       - Excluded Worker (Cost 70): 0 points.  

  4. **Debrief (45 min)**:  
     - **Step 1: Experience Share (10 min)**:  
       - Ask: *"How did you decide who to pair with? How do excluded players feel?"*  
       - Focus on tension: Landlords/employers overwhelmed by bids; excluded players frustrated.  
     - **Step 2: Moral Claims (15 min)**:  
       - Ask included tenants/workers: *"Is the price control fair? Why?"*  
       - Ask excluded players: *"Do you have a right to object? Why?"*  
       - **Key Observation**: Included players defend the cap/floor ("I got a fair deal"); excluded players feel invisible.  
     - **Step 3: Reveal Standing-Shift (15 min)**:  
       - **Point Out**:  
         > *"Notice how defenders of price controls (included players) treat the matched group as the only ‘claimants’ with moral standing. The excluded aren’t seen as victims—they’re just ‘not in the pool.’ Yet the policy itself created this exclusion by encouraging more seekers (e.g., low-valuation tenants) to enter the market. The cap undermines its own justification by hiding the victims it creates."*  
       - Highlight: Without rent control, high-valuation tenants would outbid low-valuation ones. With control, exclusion is arbitrary, and the policy "disappears" the losers.  
     - **Step 4: Limitations (5 min)**:  
       - **What the Game Can’t Capture**: Long-run effects (e.g., landlords converting apartments to condos; employers automating jobs).  
       - **Verbal Bridge**: *"In reality, price controls reduce supply over time. Fewer apartments/jobs mean more exclusion—but those future victims aren’t even in today’s game."*  

  ---

  ### **Materials**  
  - **Role Cards**: 16 cards with hidden payoffs (see examples above).  
  - **Regulator Cheat Sheet**: Rules, tie-break methods.  
  - **Scoring Tokens**: Candy/points based on outcomes.  

  ### **Why This Works**  
  - Participants **physically feel** exclusion during matching.  
  - Hidden payoffs ensure self-interest drives behavior (e.g., low-cost workers scramble for jobs).  
  - Debrief forces confrontation: The excluded "lose twice" (no resources + no moral standing).  

  This simulation makes abstract power dynamics visceral. The standing-shift isn’t lectured—it’s lived.
