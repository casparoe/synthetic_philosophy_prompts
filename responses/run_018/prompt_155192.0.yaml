  ## The Unbroken Harp: Du Bois, Propaganda, and the Liberatory Imperative of Black Art

  W.E.B. Du Bois's declaration in "Criteria of Negro Art" (1926) – "Thus all Art is propaganda and ever must be, despite the wailing of the purists" – strikes a resonant chord in the context of systemic anti-Black racism. He demanded Black artists consciously wield their craft as a weapon for racial justice, rejecting the notion of art existing in a vacuum. While his stance risks aesthetic paternalism and instrumentalization – echoing the very capitalist logic he decried – a nuanced reading, informed by his later economic thought and the inherent politics of "pure" art, reveals his core thesis as fundamentally correct and necessary. Accepting it does not collapse art into *mere* political effect, but rather demands we recognize that formal quality *in service of liberation* is the highest aesthetic achievement for art born from oppression.

  Du Bois's critics, championed by figures like Alain Locke during the Harlem Renaissance, raise the crucial **autonomy objection**. They argue that mandating art be "propaganda" shackles creative freedom, reducing artists to pamphleteers and art to utilitarian tools. This, they contend, reproduces the instrumental logic Du Bois attacked in capitalism, where value is extrinsic (profit, utility), not intrinsic (beauty, expression). Furthermore, this framing risks **aesthetic paternalism** – only art deemed "uplifting" by a political vanguard (like Du Bois himself, who famously critiqued Claude McKay's *Home to Harlem*) is validated, silencing complex, critical, or despairing portrayals of Black life deemed insufficiently positive for the racial cause.

  However, Du Bois's position dismantles the myth of "pure" art. He understood, presciently, that **art is never politically neutral**. In a society saturated with racist ideologies, a Black artist creating apolitical "art for art's sake" implicitly accepts the status quo. Avoiding racial themes doesn't escape politics; it *becomes* a political act of acquiescence or privilege. White supremacist propaganda permeated culture; Du Bois argued Black art *must* counter-propagandize simply to assert humanity and challenge dominant, dehumanizing narratives. The choice isn't between propaganda and purity; it's between propagandizing for liberation or implicitly reinforcing oppression.

  This is where Du Bois's **later economic writings**, particularly his deepening engagement with Marxism and theories of economic democracy in works like *Black Reconstruction* and *Dusk of Dawn*, profoundly shape our reading of his art theory. Du Bois came to see racial oppression as inextricably linked to capitalist exploitation. His critique of capitalism wasn't just its greed, but its fundamental *dehumanization* – reducing people to labor-commodities. Art, in this framework, becomes a vital site of *rehumanization* and the assertion of non-instrumental value. Far from reproducing capitalist instrumentality, demanding art serve justice becomes an *antidote* to it. Art as propaganda for liberation is art reclaiming its purpose: affirming the full, complex humanity that capitalism and racism deny. It transforms the instrumental ("art must do X") into the existential ("art must *be* human affirmation in the face of dehumanization").

  Does this commit us to judging art *mainly* by political effect? Not solely, but *centrally*. **Formal quality remains essential, but inseparable from political purpose in this context.** Du Bois wasn't calling for crude sloganeering; he demanded *great* art that moved people profoundly *while* advancing justice. He celebrated the beauty of spirituals, the power of narrative, the skill of craft – but saw these as amplified, not diminished, when harnessed to the cause of freedom. Think of Jacob Lawrence's *Migration Series*: its formal brilliance (composition, color, rhythmic panels) is inextricable from its powerful propaganda of Black resilience and agency. Toni Morrison's novels are masterclasses in literary form, *and* they are devastating critiques of racism's psychic toll and profound assertions of Black interiority. The political effect *arises from* the formal quality; they are synergistic. Judging art by its liberatory effect means asking: Does this work, through its aesthetic power, challenge oppression, affirm humanity, expand consciousness, and fuel the struggle for justice? This *is* a measure of its quality within the Du Boisian framework.

  The risk of paternalism is real, but it stems from *misapplication*, not the core principle. Du Bois's own occasional narrowness ("uplift" bias) is a cautionary tale. The liberatory imperative must embrace a multitude of Black experiences and artistic expressions – joy, rage, despair, critique, satire, abstraction – not just sanitized heroism. Art depicting the harsh realities of ghetto life (like Richard Wright) or exploring internal conflicts (like James Baldwin) serves justice by revealing truths and complexities that simplistic uplift narratives might obscure. The criterion isn't "is it uplifting?" but "does it, through its artistic truth and power, contribute to the understanding and dismantling of oppression?" This allows for a vast, dynamic range of Black artistic expression united by a shared commitment to liberation.

  **Conclusion: Du Bois was fundamentally right.** In a world actively working to negate Black humanity, Black art cannot afford the luxury of imagined neutrality. The demand for it to be "propaganda" for racial justice is not a reduction to instrumentality, but a call to embrace art's highest function: the defense and celebration of human dignity against systems designed to crush it. His later economic insights reveal this not as capitulation to capitalist logic, but as a radical assertion of human value *against* it. While vigilance against paternalism and reductive judgments is essential, the core mandate stands. We judge such art not *mainly* by political effect *apart* from form, but by the **synthesis of profound aesthetic achievement and potent liberatory resonance.** The most powerful Black art, as Du Bois foresaw, is that which is unflinchingly beautiful and unapologetically committed to freedom – a harp strung with the unbreakable wire of justice.
