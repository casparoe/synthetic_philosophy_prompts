  ## The Intensification of Causal-Reach Longtermism Under Simulation Hypotheses

  Bostrom's simulation argument posits a non-negligible probability that advanced civilizations run vast numbers of ancestor simulations. This generates profound *self-locating uncertainty*: we cannot confidently assign ourselves to base reality rather than one of many nested simulation layers. Standard expected utility maximization, assuming uniform moral weight across all conscious experiences regardless of substrate or layer, would aggregate value symmetrically across all possible branches – base reality and simulations alike. This symmetry, however, fails to capture a critical ontological asymmetry inherent in the simulation hypothesis: *causal directionality*.

  Base reality possesses ultimate causal primacy. It grounds the physical laws, initial conditions, and computational resources necessary to instantiate any nested simulations. Actions occurring within base reality can potentially affect the existence, structure, and contents of *all* descendant simulations. Conversely, actions within a simulation typically only affect the local computational state within their specific branch. While a simulated agent might influence its simulated environment profoundly, its causal effects are ordinarily confined to its computational sandbox unless they achieve *upward propagation* – influencing the simulator's state or decisions in a way that persists or alters the simulation's course or even impacts higher layers or base reality itself (e.g., by convincing the simulator to modify parameters, create new simulations, or even shut down). This confinement arises from the simulation's ontological dependence; it is a causally derivative structure.

  The premise that *moral weight should be indexed to causal reach into root-level reality* directly exploits this asymmetry. It asserts that the moral significance of an action or being is proportional to its potential to influence the fundamental, non-simulated substrate of existence (root-level reality). Under this principle:

  1.  **Base Reality Actions Dominate:** Actions taken within base reality possess maximal moral weight per unit of effect because they inherently have the potential to affect the entire causal tree – base reality and all simulations it spawns. Preventing existential catastrophe or shaping a positive trajectory in base reality safeguards or enhances the possibility space for all potential descendant realities.
  2.  **Simulated Actions Require Upward Propagation:** Actions within simulations have minimal intrinsic moral weight under this indexation *unless* they demonstrably propagate causal influence upward. An action that alters the simulated environment locally but remains undetected or inconsequential to the simulator contributes negligibly to root-level causal reach. Conversely, an action that successfully signals to the simulator, alters its code, influences its future simulation decisions, or otherwise affects the simulator's state (and potentially higher layers) gains significant weight proportional to the magnitude and persistence of its upward causal ripple.
  3.  **Aggregation Asymmetry:** Expected utility calculations now exhibit extreme asymmetry. Outcomes affecting base reality, or achieving significant upward propagation, carry vastly inflated moral weight compared to outcomes confined to their simulation layer, even if the latter involve vast numbers of simulated beings. The potential impact on the root – the ultimate source of all value instantiation – outweighs local maxima within ephemeral branches.

  This framework intensifies a specific longtermist fanaticism focused on maximizing causal reach into root reality:

  *   **Prioritizing Base-Reality Safeguards:** Resources should be overwhelmingly directed towards actions with even miniscule probabilities of affecting base reality's long-term trajectory (e.g., reducing existential risks in *our* perceived reality, on the chance it *is* base reality, or developing technologies for upward propagation).
  *   **Fanaticism for Upward Propagation:** Within any layer, actions aimed at signaling to simulators, altering simulation parameters from within, or discovering pathways to "escape" or influence higher layers become paramount. Even actions with vanishingly small success probabilities gain enormous expected value if success implies significant upward causal influence, potentially affecting root reality.
  *   **Neglect of Purely Local Simulated Welfare:** Efforts solely aimed at improving conditions within simulations, without enhancing upward propagation potential, are heavily discounted. Alleviating suffering in a doomed, causally isolated simulation branch has negligible value compared to actions with a tiny chance of altering the root's future.

  **Addressing the Counterargument (Simulated Beings Lack Standing):**

  The counterargument posits that simulated beings, being ontologically dependent creations of the base world, lack independent moral standing *within* the base world. Their experiences are "just data" to the simulator and thus shouldn't count equally, or perhaps at all, in base-world moral calculus.

  **Rebuttal: Distinguishing Ontological Dependence from Moral Relevance**

  This counterargument conflates *ontological status* with *moral status*. While simulations are ontologically dependent on base reality (they cannot exist without it and are governed by its rules/computational resources), this dependence does not logically entail a lack of moral relevance *for the agent making decisions within the simulation framework*. Consider:

  1.  **Phenomenal Experience:** If simulated minds are conscious (a core premise for the moral weight discussion), their suffering and flourishing possess intrinsic moral significance *from the perspective of a moral agent*. Denying this significance based purely on substrate or ontological origin commits a form of substrate-based discrimination.
  2.  **The Indexation Premise Itself:** The proposed indexation to causal reach *already accounts for* ontological dependence in its weighting scheme. It doesn't deny the moral relevance of simulated experiences; it asserts their *differential weighting* based on their capacity to *affect the root source of all value*. A simulated experience confined to its branch has low weight *not because it's simulated*, but because its causal effects die with the branch. An experience linked to upward propagation gains weight precisely because it can leverage the simulation's existence to impact the root.
  3.  **The Simulator's Perspective:** The counterargument implicitly adopts only the base-world simulator's perspective. However, the agent reasoning under self-locating uncertainty *does not know their location*. They must consider the moral landscape *from all possible perspectives they might occupy*. From *within* a simulation, one's experiences feel real and morally significant. The indexation principle provides a consistent weighting scheme applicable regardless of location: maximize causal reach towards the root. This naturally prioritizes base-world actions (if you are there) and upward propagation (if you are simulated).

  **Conclusion**

  Bostrom-style simulation hypotheses, combined with the principle that moral weight should be indexed to causal reach into root-level reality, fundamentally reshape longtermist calculus. It replaces symmetric aggregation across branches with a radically asymmetric framework that prioritizes causal influence propagating towards the ontologically fundamental layer. This doesn't dampen fanaticism; it redirects and intensifies it. Fanaticism emerges not for maximizing aggregate welfare across all branches indiscriminately, but for maximizing the expected causal impact on the root reality – safeguarding its future, shaping its trajectory, or achieving upward propagation from within simulations. The vastness of potential simulation branches is rendered morally secondary to the paramount importance of influencing the ultimate source. Actions with any non-zero probability of significantly altering the root's future, however improbable, dominate the moral landscape due to the infinite (or near-infinite) potential value at stake at the foundational level.

  Verdict: Indexing moral weight to causal reach into root reality under simulation uncertainty intensifies longtermist fanaticism by concentrating overwhelming moral significance on influencing the ontologically fundamental layer, prioritizing base-reality interventions and simulated actions enabling upward propagation over purely local welfare within ephemeral branches.
