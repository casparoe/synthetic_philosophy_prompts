  ## The Crumbling Edifice: Walzer's Moral Equality Beyond the Conventional Battlefield

  Michael Walzer’s concept of the "moral equality of combatants" stands as a cornerstone of modern Just War Theory's *jus in bello* framework. Its core argument is elegantly simple and seemingly intuitive: soldiers on opposing sides possess an equal right to kill and an equal liability to be killed, regardless of the justice of their nation's cause (*jus ad bellum*). This equality rests on two intertwined pillars: **symmetrical vulnerability** (each combatant poses a lethal threat and faces equivalent danger) and **non-responsibility** (the individual soldier is not responsible for the political decision to wage war; they act under coercion and within their role). This model provides crucial clarity and restraint within the horrific context of conventional interstate warfare. However, once we step off the symmetrical battlefield of clashing armies in uniform and confront the realities of asymmetric insurgencies and remote warfare, Walzer’s elegant symmetry fractures. Does moral equality still hold? The evidence suggests it largely collapses, leaving us grappling with a far messier, conditional, and vulnerability-dependent moral landscape.

  The core challenge arises when Walzer's foundational pillars crumble under asymmetric conditions:

  1.  **Asymmetric Insurgency & the Breakdown of Symmetry:** In conflicts where a state military confronts insurgents, the symmetry crucial to Walzer’s model vanishes. Insurgents rarely wear uniforms, blurring the combatant/civilian distinction. They operate amidst non-combatants, making identification difficult and increasing the risk to civilians. Crucially, the **reciprocal risk is profoundly unequal**. State soldiers, identifiable and operating in conventional formations, face constant threat from ambushes, IEDs, and snipers, often while struggling to discern the enemy. The insurgent, conversely, can often choose the time and place of engagement, minimizing their immediate risk compared to the exposed soldier, before melting back into the populace. Where is the mutual vulnerability justifying equal rights? If reciprocity is the bedrock of moral equality, it dissolves when one side systematically avoids the direct, symmetrical confrontation that reciprocity requires. Why should the insurgent enjoy the same "right to kill" the soldier when they exploit the soldier's adherence to conventions (like wearing a uniform) that they themselves reject, thereby manipulating the risk asymmetry?

  2.  **Drone Warfare & the Abolition of Vulnerability:** The advent of remote warfare, epitomized by drone crews operating thousands of miles from the battlefield, delivers a fatal blow to the vulnerability pillar. Drone operators face **zero immediate physical risk** from the combatants they target. They are not "mutually vulnerable" in any meaningful sense. The insurgent targeted by a Hellfire missile poses no lethal threat to the pilot in Nevada. Walzer’s justification – that equality stems from shared peril and role-based function – evaporates. How can the drone operator possess an equal "right to kill" the insurgent when they face none of the reciprocal danger? The non-responsibility argument may still partially apply (the operator follows orders), but without the shared risk, the moral symmetry inherent in Walzer's equality becomes untenable. The drone operator’s situation resembles more an executioner than a combatant in a reciprocal duel.

  Faced with these challenges, the **reciprocity-based defense** struggles. Proponents might argue that reciprocity exists at an institutional level (both sides represent belligerent entities) or that the *potential* for future harm justifies the equality. However, these feel like strained rationalizations. The visceral, immediate mutual threat central to Walzer's original justification – the shared experience of the battlefield – is absent in both the insurgent’s calculated avoidance and the drone operator’s physical safety. Reciprocity, in the sense of shared lethal risk *during the act of combat*, is demonstrably missing.

  This pushes us towards the rival view: the **forfeiture theory**. This position asserts that combatants do not possess an inherent, equal right to kill. Instead, individuals fighting for an *unjust cause* forfeit their normal right not to be killed by just combatants. Only just combatants retain the right to use lethal force. This view directly links *jus ad bellum* and *jus in bello*, rejecting Walzer’s separation.

  The forfeiture theory offers a seemingly clear solution: the drone operator killing an unjust insurgent commits no wrong; the insurgent attacking just state soldiers forfeits their immunity. However, its flaws are profound, especially in non-conventional wars:
  *   **Epistemic Problem:** Determining the "just side" objectively in complex asymmetric conflicts (e.g., foreign occupations, civil wars) is often impossible or highly contested. Who adjudicates? Both sides invariably claim justice. Applying forfeiture requires a level of moral clarity rarely present, leading to dangerous subjectivity and the demonization of the enemy.
  *   **Moral Hazard:** It incentivizes all sides to declare their cause just and the enemy inherently criminal, eroding the very constraints the laws of war aim to provide. It risks justifying unrestrained violence against those deemed "unjust."
  *   **Ignores Role & Coercion:** It fails to adequately address the Walzerian point that individual combatants, especially conscripts or low-level fighters, are often instruments of state policy, not autonomous moral agents choosing an unjust cause. Should a conscripted insurgent truly forfeit all rights simply because their leader's cause is deemed unjust?

  **The Verdict: Conditional Equality on Mutual Vulnerability**

  Walzer’s blanket moral equality of combatants does not survive the transition beyond conventional state warfare intact. It collapses under the weight of asymmetric risks and the elimination of physical vulnerability. However, embracing the pure forfeiture theory is equally dangerous and unworkable, particularly given the epistemic chaos of modern conflict.

  The necessary conclusion is that **moral equality is conditional, dependent primarily on reciprocal vulnerability.** Where mutual, foreseeable, and direct lethal threat exists between identifiable combatants adhering (even minimally) to the conventions of warfare, a residual form of Walzerian equality retains moral force. This justifies reciprocal combatant rights *within that specific, bounded context* of symmetrical confrontation, regardless of the overarching war's justice.

  However, **when this reciprocity dissolves – either through deliberate asymmetric tactics that exploit civilian cover and avoid direct engagement, or through technological remove that eliminates physical risk – the foundation for equal rights collapses.** In these cases:

  1.  **Insurgents:** Those who deliberately refuse the reciprocal risks of conventional combat (by not distinguishing themselves, targeting civilians, or using human shields) cannot claim the full moral equality Walzer grants. While they remain liable to attack *while actively engaged in hostilities*, their deliberate rejection of reciprocity weakens their claim to symmetrical rights. Their status becomes more perilous and conditional.
  2.  **Drone Crews:** Personnel who face no physical risk lack the fundamental justification for possessing an equal "right to kill" enemy combatants under Walzer’s model. Their use of force requires a *different* justification, likely rooted solely in the justice of the cause (*jus ad bellum*) and the precision of their actions in minimizing collateral harm. They operate outside the reciprocal risk community that grounds combatant equality. Their actions resemble targeted killings based on status and threat assessment, not reciprocal combat between moral equals.

  Therefore, Walzer’s robust moral equality is **dead** as a universal principle applicable to all forms of armed conflict. It survives only as a **limited convention** within the specific context of symmetrical, conventional warfare characterized by mutual vulnerability. Beyond that context, we enter a realm where rights and liabilities become contingent, contested, and heavily dependent on the specific nature of the threat, the level of reciprocity, and the degree to which actors accept the fundamental risks of warfare. The messy reality of modern conflict demands a more nuanced, conditional, and vulnerability-sensitive framework than Walzer’s elegant but ultimately brittle symmetry can provide.
