prompt: |-
  Within the intersection of predictive processing and the free energy principle, several competing open lines of inquiry currently divide theoretical attention. One concerns whether active inference constitutes a genuinely distinct decision-theoretic architecture or merely restates expected-utility maximization in information-theoretic terms; another asks whether the free energy principle's variational formalism produces empirically distinguishable predictions from standard hierarchical predictive coding, or functions primarily as a redescription; a third focuses on whether precision-weighting mechanisms in cortical hierarchies can be mapped onto specific neuromodulatory circuits with sufficient granularity to guide experimental design; and a fourth examines whether extending the framework to social, developmental, or artificial systems demands substantive theoretical revision or only parameter rescaling.

  Assume a research unit with constrained resources—approximately three years and one dedicated postdoctoral researcher. Provide a defended agenda for how that effort should be distributed across these lines: which question should be addressed first, which can be pursued in parallel, and which should be actively deprioritized. Your defense should specify the dependency structure among these questions—which answers, if settled, would most alter the evaluation of the remaining ones—along with the criteria governing your ranking (tractability with present methods, magnitude of downstream consequence, and the risk that resolving one line renders another moot). The deliverable is an ordering justified by upstream-downstream relations and trade-offs, not a survey of the literature or a list of recommended readings. Do not include citations, bibliographies, or references to specific unpublished works.
reasoning: |-
  Okay, the user is asking for a research prioritization strategy within predictive processing and the free energy principle. They've outlined four specific debates and want to know how to allocate limited resources (one postdoc over three years). 

  First, I need to understand the dependencies between these questions. The precision-weighting question (#3) seems foundational - if we can't map precision to neuromodulatory circuits, it weakens the entire framework's biological plausibility. That feels like the bottleneck. 

  The EU maximization vs active inference question (#1) is also critical but more theoretical. If active inference is just a redescription, that would collapse much of the framework's novelty. But testing this might require waiting for #3's results. 

  The variational formalism question (#2) strikes me as secondary - it's important for mathematical clarity but may not immediately change experimental approaches. And the extension question (#4) seems premature without resolving the core mechanisms first.

  The user seems like a PI or lab head making strategic decisions. Their unspoken need is probably: "How do I position my lab to make impactful contributions without spreading ourselves too thin?" They might also be worried about investing in lines that could become obsolete if foundational issues get resolved elsewhere.

  Looking at tractability: #3 has the most concrete path to experiments (optogenetics, calcium imaging), while #1 is mostly modeling work. #4 is too vague for a focused postdoc project. 

  For the timeline: Year 1 should tackle the precision mapping (#3) since it gates everything else. The theoretical question (#1) can run in parallel but should stay conceptual until Year 2 when #3's results inform it. The formalism question (#2) can be a side project when the postdoc has bandwidth. #4 should be shelved - it's downstream and resource-intensive.

  Biggest risk is putting effort into #4 prematurely and wasting time, or neglecting #3 and having the whole framework's validity questioned. The postdoc's skills matter too - if they're more experimental, #3 is ideal; if theoretical, #1 becomes more viable. 

  Trade-off is between shoring up foundations (#3) versus exploring novel applications (#4). With limited resources, foundations win. If #3 fails, the whole agenda might need rethinking - better to know that early.
answer: |-
  Here is a prioritized research agenda for the constrained unit, justified by dependencies, tractability, and consequence:

  **Priority 1 (Years 1-2, Core Focus): Precision-Weighting & Neuromodulation (Question 3)**  
  *   **Justification:** This is the most tractable and foundational empirical question. Establishing (or refuting) a granular, testable mapping between precision-weighting and specific neuromodulatory circuits (e.g., acetylcholine, dopamine, noradrenaline) is critical for the *entire framework's* biological plausibility and experimental testability. Success provides concrete neural targets for probing *all* other theoretical claims (Questions 1, 2, and 4). Failure would fundamentally challenge the neurobiological relevance of PP/FEP and demand significant theoretical revision. Its resolution heavily influences the tractability and interpretation of empirical tests for the other questions. Present methods (optogenetics, chemogenetics, multimodal imaging, computational modeling) are mature for this inquiry. Downstream consequence is maximized here – it validates or invalidates the core bridge between theory and brain mechanism.

  **Priority 2 (Years 1-3, Parallel Theoretical/Modeling Focus): Active Inference vs. Expected Utility (Question 1)**  
  *   **Justification:** This is the most critical *theoretical* question with major implications for the framework's conceptual novelty and scope. While less immediately empirical than Q3, it can be pursued concurrently through mathematical analysis, simulations, and designing model comparisons informed by *emerging results from Q3*. Resolving whether active inference offers a distinct architecture (e.g., via intrinsic motivation, ambiguity minimization, complex priors beyond reward) or is equivalent to EU maximization fundamentally alters the perceived significance of the entire PP/FEP enterprise. If proven equivalent, it risks rendering much of the framework a redescription, impacting the motivation for Q2 and Q4. If distinct, it forces reevaluation of decision theory. Its resolution is partially independent but will be sharpened by empirical constraints from Q3. Tractability is high with modeling expertise.

  **Priority 3 (Year 2-3, Opportunistic/Secondary): Variational Formalism vs. Standard PC (Question 2)**  
  *   **Justification:** This question is important for theoretical clarity but is deprioritized due to lower immediate downstream impact and higher risk of being rendered moot or clarified by progress on Q1 and Q3. If Q1 shows active inference is distinct, Q2 gains importance for understanding *how* the variational approach enables this. If Q1 shows equivalence, the need to distinguish FEP's formalism from standard PC diminishes. Similarly, concrete neural implementations from Q3 will provide empirical benchmarks against which to test predictions of the variational formalism vs. simpler PC models. This question becomes more tractable and meaningful *after* progress on Q1 and Q3. It can be explored through targeted model comparisons or theoretical work as insights from Q1/Q3 emerge, but shouldn't consume primary resources early.

  **Deprioritize (Monitor, Do Not Actively Pursue): Extension to Social/Developmental/AI (Question 4)**  
  *   **Justification:** Pursuing Q4 *before* resolving the core theoretical (Q1) and biological (Q3) foundations is premature and carries high risk of wasted effort. The nature of the required extensions (substantive revision vs. rescaling) depends entirely on the outcomes of Q1 and Q3. If Q3 fails to find granular neuromodulatory mappings or Q1 shows the framework is equivalent to standard decision theory, major revisions would likely be needed for meaningful extension, making current efforts potentially obsolete. Conversely, strong positive results in Q1/Q3 would provide a solid foundation for extension, guiding *how* it should be done. Q4 is also inherently more resource-intensive (complex models, diverse data) and less tractable for a single postdoc within 3 years compared to the foundational questions. Resources should focus on establishing the core first.

  **Dependency Structure & Rationale:**
  1.  **Q3 (Precision Mapping) is the empirical keystone.** Its outcome validates or challenges the core biological plausibility of the framework, directly enabling or constraining meaningful empirical tests of predictions arising from *all* other theoretical questions (Q1, Q2, and indirectly Q4). It's the most feasible starting point with high potential payoff or failure.
  2.  **Q1 (Architecture Distinction) is the theoretical keystone.** Its resolution fundamentally changes the perceived novelty and scope of the framework, directly impacting the importance and interpretation of Q2 (formalism) and Q4 (extensions). It can be pursued in parallel with Q3 using modeling, with each informing the other.
  3.  **Q2 (Formalism Distinction) is contingent.** Its significance and tractability are heavily dependent on the outcomes of Q1 and Q3. It clarifies internal theoretical structure but has less independent, high-impact downstream consequence compared to Q1 and Q3. It's suitable for secondary investigation once core foundations are clearer.
  4.  **Q4 (Extensions) is downstream.** It critically depends on stable, validated answers to Q1 and Q3. Premature investment risks building on shaky foundations or pursuing paths invalidated by core findings. It's the least tractable within the constraints and has the highest risk of being rendered moot by prior results.

  **Resource Allocation (3 Years, 1 Postdoc):**
  *   **Year 1:** Primary focus (70-80%) on **Q3** (experimental design, initial data collection/analysis). Secondary focus (20-30%) on initiating theoretical/computational work for **Q1** (literature review, model conceptualization).
  *   **Year 2:** Continued primary focus (60-70%) on **Q3** (data analysis, manuscript preparation). Sustained secondary focus (30-40%) on **Q1** (model development, simulation, analysis). Begin opportunistic exploration of **Q2** as relevant insights emerge from Q1/Q3 (<10%).
  *   **Year 3:** Primary focus (50-60%) shifts to finalizing **Q1** (model refinement, comparison, theoretical synthesis/publication). Continued focus (30-40%) on finalizing **Q3** (publication, follow-up experiments). Allocate remaining effort (10-20%) to synthesizing insights for **Q2** if warranted.
  *   **Q4:** Actively monitored throughout (e.g., via literature, conferences) but no dedicated resources allocated within the 3-year postdoc. Outcomes of Q1/Q3 will define a clearer path for future Q4 work.

  This ordering maximizes the chance of producing high-impact, foundational results (either validating core tenets or forcing necessary revisions) within the constraints, while minimizing the risk of investing significant effort in lines potentially invalidated by upstream findings. It prioritizes tractable empirical validation (Q3) and resolution of the most consequential theoretical debate (Q1) that shapes the entire field's trajectory.
