prompt: |-
  me and a coworker keep fighting about why dueling and slavery actually went away. she says moral revolutions are basically like fashion trends: once the cool people stop wearing them, everyone else drops it because being caught in it is embarrassing. she applies it to dueling (elites stopped) and slavery (it got economically embarrassing). i think she's borrowing Appiah's honor idea but missing the Williams point that rational arguments were always sitting there and rarely did the work, and maybe she's also blurring honor shifts into pure economic interest. can you audit the analogy? map it out: what's the fashion designer, the runway, the season change, the social cost of being unfashionable, and who plays the role of the critic saying "that outfit is immoral"? then tell me where the mapping breaks -- does it treat slavery and dueling as purely aesthetic choices? does it conflate status loss with interest loss? and does her conclusion that rational arguments never drive moral change survive once you separate status shifts from actual reasoning? lead with your bottom line in the first sentence, then give the reasoning, with no preamble and don't restate my question back at me.
reasoning: |-
  Okay, let's tackle this user's request. They're having a debate with their coworker about why practices like dueling and slavery ended. The coworker argues it's similar to fashion trends: when elites stop, everyone follows due to embarrassment. The user thinks this oversimplifies, missing rational arguments and conflating honor with economic factors.

  First, I need to map the fashion analogy to moral revolutions. The fashion designer represents influential leaders or intellectuals who set new norms. The runway is elite society adopting these changes, like abolitionist groups. The season change is the shift in what's considered honorable. Social cost is the embarrassment of holding outdated views. Critics are moral advocates denouncing practices as immoral.

  Where does this analogy break? The key issue is treating slavery and dueling as purely aesthetic choices. But these practices had deep economic and social structures. Ending slavery wasn't just about changing tastes; it required dismantling entire systems. The analogy also conflates status loss with material interest loss. For slavery, economic factors like industrialization played a role, but moral arguments were crucial for justifying abolition despite economic costs. 

  The user mentions Williams' point that rational arguments existed but didn't drive change alone. The coworker's claim that rational arguments never drive change is too absolute. While social status shifts are important, rational arguments provide the framework that legitimizes new norms. Movements like abolition used moral reasoning to challenge slavery, which then influenced elites and laws. 

  I should emphasize that moral revolutions involve both cultural shifts and rational advocacy. Separating status from reasoning shows that while elites' actions can accelerate change, underlying arguments sustain it. The conclusion should clarify that rational arguments are necessary but not sufficient; they interact with social dynamics.
answer: |-
  **Bottom line: Your coworker's fashion analogy captures status-driven *adoption* of moral shifts but dangerously oversimplifies by ignoring material realities, reducing morality to aesthetics, and dismissing the essential role of sustained rational argumentation in *legitimizing* and *sustaining* change.**

  **Mapping the Fashion Analogy to Moral Revolutions:**

  1.  **Fashion Designer:** Influential moral thinkers, philosophers, religious leaders, or early activists (e.g., Enlightenment philosophers critiquing slavery, abolitionist writers like Frederick Douglass or Harriet Beecher Stowe).
  2.  **The Runway:** Elite circles, influential institutions, or powerful nations where the new moral norm is first adopted or championed (e.g., abolitionist societies in Britain, progressive salons, later the US Republican party platform).
  3.  **Season Change:** The shift in what constitutes "honorable" or "civilized" behavior within influential society.
  4.  **Social Cost of Being Unfashionable:** Embarrassment, loss of social standing, being seen as backward, uncivilized, or cruel. (e.g., a planter defending slavery in London post-1807, a European aristocrat challenging to a duel in the late 19th century).
  5.  **The Critic:** Moral advocates, philosophers, religious figures, or activists explicitly denouncing the practice as *immoral* or *unjust* (e.g., John Woolley preaching against dueling, William Wilberforce arguing slavery violates Christian principles and natural rights).

  **Where the Mapping Breaks Down Critically:**

  1.  **Reduction to Pure Aesthetics:** The core failure. Slavery and dueling weren't mere style choices.
      *   **Slavery:** Was a massive, brutal, *material* system of economic exploitation, racial hierarchy, and violent oppression. Ending it required dismantling this entire structure, involving war, legislation, economic dislocation, and profound social upheaval – far beyond just feeling embarrassed. The analogy trivializes the immense suffering and the fight against entrenched power.
      *   **Dueling:** While status-driven, involved real risk of death or injury, legal consequences, and complex codes of masculine honor. Abandoning it required more than trendiness; it needed alternative conflict resolution mechanisms and shifts in masculinity norms.
  2.  **Conflating Status Loss with Interest Loss:** The analogy blurs these.
      *   **Slavery:** Elite abandonment *was* partly driven by *changing economic interests* (e.g., British industrialists finding slave-based colonial economies less efficient or compatible with free trade ideology) *alongside* moral shifts. However, for slaveholders (especially in the US South), abolition represented catastrophic *material interest loss* (property value, labor force) that status embarrassment alone could never overcome – it took war. The fashion analogy ignores this conflict of material interests.
      *   **Dueling:** Abandonment involved a recognition of its *irrationality* (pointless death) and barbarity conflicting with emerging ideas of civilized society, not just a loss of cool points. The cost shifted from social stigma to legal penalty and genuine risk outweighing perceived honor gains.
  3.  **The Role of the Critic & Rational Argument:** This is where your Williams point is crucial.
      *   **Preceding & Enabling the Shift:** Rational arguments (natural rights, utility, Christian brotherhood) *predated* widespread elite abandonment. Thinkers like Locke, Montesquieu, the Quakers, and later abolitionists relentlessly articulated *why* slavery/dueling were *wrong*, not just unfashionable. This provided the intellectual foundation and moral vocabulary.
      *   **Legitimizing the Shift:** The shift in elite "honor" didn't happen in a vacuum. It was increasingly framed *through* these rational and moral arguments. Elites didn't just stop dueling because it was passé; they stopped because prevailing discourse labeled it *murderous and uncivilized*. They abandoned slavery because dominant discourse framed it as *tyrannical and unjust*.
      *   **Sustaining the Change:** Fashion is fickle; deep moral change (like rejecting slavery as fundamentally evil) requires the bedrock of reasoned principle to prevent backsliding. The rational arguments provide the lasting justification, transforming a trend into a norm.

  **Conclusion on Rational Arguments:** Your coworker's claim that "rational arguments never drive moral change" **does not survive** when status shifts are separated from reasoning. **Status shifts often provide the crucial *social momentum* for widespread adoption.** **However, rational arguments are indispensable for:**  
  *   **Identifying the problem:** Framing the practice as morally wrong, not just inconvenient.
  *   **Building the movement:** Providing activists and converts with a coherent case.
  *   **Legitimizing the shift for elites and institutions:** Giving them a respectable, principled reason to change beyond mere trend-following.
  *   **Embedding the change:** Turning the new norm into a lasting principle, not just a passing fad.

  The shift in "honor" (elite behavior) was often the *mechanism* of rapid social change, but the *content* of that new honor code – the reason dueling became dishonorable and slavery became an intolerable evil – was fundamentally shaped by centuries of accumulated moral reasoning and argumentation. The fashion analogy captures the diffusion mechanism but erases the moral substance and the material struggles that define true moral revolutions.
