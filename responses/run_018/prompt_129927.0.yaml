answer: |-
  Here is a formal specification of desiderata for a theory of causation by omission in scientific contexts, structured as required. Each desideratum includes (a) the formal requirement, (b) its motivating case, (c) non-negotiability status, and (d) notes on theoretical tensions. Conflicts (especially between 1 and 4) are flagged.

  ---

  ### **Desiderata for a Theory of Causation by Omission in Scientific Explanation**
  *(Ordered by your requested points)*

  1.  **Discrimination: Genuine Omission vs. Mere Absence**  
      *   **Requirement:** The theory must provide criteria to distinguish causally relevant omissions (where an absence *makes a difference* to an outcome) from irrelevant absences (mere non-existences with no explanatory role).  
      *   **Motivating Case:** In a replication study of corrosion resistance, Experiment A succeeds with a protective coating. Experiment B fails. The failure report cites the *absence of the coating* as causal. The theory must distinguish why this absence (of an expected shielding mechanism) is causal, while the absence of unrelated factors (e.g., no diamond dust in the lab) is irrelevant.  
      *   **Non-negotiable:** Yes. Without this, any absence could be trivially labeled causal, destroying explanatory specificity.  
      *   **Tension Note:** Direct conflict with Desideratum 4 (physical inertness of absences). Resolving this may require revising "causal" to mean "difference-making" rather than "energy-transferring".

  2.  **Asymmetry Preservation**  
      *   **Requirement:** The theory must ensure that causation by omission is asymmetric: Omitting a *preventer* of harm (e.g., failing to deploy a shield) can cause harm, but omitting the *harm itself* (e.g., failing to have damage occur) does not cause benefit. This asymmetry must not reduce to normative judgments (e.g., "harm is bad").  
      *   **Motivating Case:** Omitting radiation shielding in a reactor test causes a meltdown (causal omission). Omitting the meltdown (i.e., preventing it) does not cause "reactor safety" as an effect—safety is the default state preserved by prevention. The causal direction must hold independently of valuing safety.  
      *   **Non-negotiable:** Yes. Symmetry would violate scientific causality (e.g., allowing "no disease causes health" as a causal claim).  
      *   **Theoretical Handle:** Counterfactual theories (e.g., "If shielding had been present, meltdown would not have occurred") naturally capture this asymmetry. Normative theories fail here.

  3.  **Cause vs. Background Condition**  
      *   **Requirement:** The theory must differentiate between an omission that is a *cause* (actively cited in explanations) and an omission that is a mere *background condition* (necessary but not salient). This must hold in cases of redundant preventers.  
      *   **Motivating Case:** A lab uses three independent backup systems to prevent overheating. All three are omitted in a test, leading to overheating. The failure report cites "absence of Backup A" as causal, not B or C, though any one absence alone would suffice. The theory must explain why one absence is foregrounded as "the cause" while others are treated as enabling conditions.  
      *   **Non-negotiable:** Contextually dependent. *Some* distinction is essential for pragmatic explanation; *which* omission is singled out may be contingent on experimental design or explanatory interests.  
      *   **Theoretical Handle:** Contrastive/structural accounts (e.g., citing omissions relative to a controlled variable) resolve this; process theories struggle.

  4.  **Physical Consistency**  
      *   **Requirement:** The theory must reconcile the explanatory power of omissions with the physical fact that absences (e.g., no shield, no force) possess no energy, momentum, or spatiotemporal location, and thus cannot interact mechanically.  
      *   **Motivating Case:** A scientific report states: "The absence of thermal insulation caused overheating." This is explanatory despite insulation's absence contributing no heat/energy. The theory must justify this without violating physics.  
      *   **Non-negotiable:** Yes. A theory contradicting fundamental physics is scientifically inadmissible.  
      *   **Critical Conflict:** Jointly unsatisfiable with Desideratum 1 under a *mechanical* view of causation (e.g., transfer of conserved quantities). Resolution likely requires adopting a non-mechanical (e.g., counterfactual or variational) concept of "causation".

  5.  **Non-Additivity of Double Omissions**  
      *   **Requirement:** The theory must explain why the simultaneous absence of multiple factors (A and B) does not entail that each absence separately "causes" the full effect, or that their conjunction causes a "double" effect.  
      *   **Motivating Case:** A plant dies. Absence of water (A) alone causes death; absence of sunlight (B) alone causes death. If both are absent, the plant still dies *once*. The theory must avoid implying "death caused by A + death caused by B = double death".  
      *   **Non-negotiable:** Yes. Additivity violates basic ontology (one effect cannot occur twice).  
      *   **Theoretical Handle:** Probabilistic/difference-making accounts (e.g., omissions as INUS conditions) naturally handle this via sufficiency/insufficiency tests.

  ---

  ### **Summary of Non-Negotiables & Critical Tensions**
  - **Non-negotiable:** Desiderata 1 (discrimination), 2 (asymmetry), 4 (physical consistency), 5 (non-additivity).  
  - **Context-dependent:** Desideratum 3 (cause vs. background) requires pragmatic constraints.  
  - **Key Tension:** Desiderata 1 and 4 are **jointly unsatisfiable** under mechanistic/physicalist theories of causation (e.g., Salmon-Dowe processes). Resolution demands accepting causation as fundamentally **difference-making** (e.g., counterfactual, interventionist, or structural-equations frameworks). This reorients "causation" from *production* to *dependence* in scientific explanations.  
  - **Scientific Viability:** Counterfactual/interventionist theories satisfy all desiderata except requiring careful handling of 3 (via contrastive focus). Normative theories fail 2; process theories fail 1 and 4. Probabilistic theories need supplementation for 1 and 3.

  This specification provides criteria for evaluating theories of omission, grounded in experimental practice and physics. It may be circulated as a standalone framework for philosophy-of-science seminars.
