  2. Asymmetry preservation: Why "no poison" prevents harm but "no harm" doesn't cause benefit. Crucial for causal directionality.
  3. Cause vs background: Redundant control case shows this isn't just philosophical hair-splitting.
  4. Physical consistency: Absences lack energy/momentum yet explain outcomes. This clashes with 1.
  5. Double omission non-additivity: Absence of A+B shouldn't imply double causation.

  The tension between 1 and 4 is critical. If absences have no physical properties, how can they cause anything? Yet scientists routinely cite missing factors in explanations. This might require rethinking "causal" in physics contexts - perhaps as difference-making rather than force-transmission.

