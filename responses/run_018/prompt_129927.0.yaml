prompt: |-
  You are a professional philosopher of science with particular competence in metaphysics and causal reasoning. Before you answer, take a moment to brainstorm the conceptual distinctions at stake, then proceed with care.

  I am a retired experimental physicist who has recently begun serious study in philosophy. I want a formal specification of the desiderata that any adequate theory of causation by omission must satisfy—particularly one that can serve scientific explanation rather than only everyday discourse. Do not give me a bibliography or a survey of named schools; instead, lay out the requirements themselves, with the motivating case or distinction behind each, and flag which are non-negotiable versus camp-specific preferences.

  Please ensure your list addresses at least these points: (1) the theory must distinguish genuine causal omission from mere absence, using a concrete case in which an expected shielding mechanism is missing in a replication study and its absence is cited in the failure report; (2) it must preserve asymmetry—why omitting a harmful exposure can cause damage without symmetrically implying that omitting damage causes benefit—without reducing the distinction to pure normativity; (3) it must separate omission-as-cause from omission-as-background-condition, especially in experiments with redundant controls where several absent factors could each be blamed; (4) it must remain consistent with the physical fact that absences carry no energy or momentum, yet still allow scientific reports to treat them as genuinely explanatory; (5) it must account for why double omissions (the simultaneous absence of factor A and factor B) do not automatically generate double causation.

  For each requirement, state whether you take it to be non-negotiable, and identify any pair—especially (1) together with (4)—that may be jointly unsatisfiable without revising what we mean by 'causal' in physical contexts. Keep the weight on the criteria and their motivating cases; you may briefly indicate how counterfactual, normative, and probabilistic accounts fare against the list, but the deliverable should be the specification itself, suitable for circulation at a philosophy-of-science seminar.
