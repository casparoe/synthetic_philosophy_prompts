answer: |-
  Good morning. Or rather — a welcome to this particular arising of consciousness-moments gathered in this designated space, responding to the label "workshop."

  We convene under a deliberately provocative title: "Anatta and Institutional Memory." It presents a puzzle, perhaps even an apparent contradiction. How can we speak of *memory* – inherently implying continuity – within a framework, *anatta*, that fundamentally denies a persisting self? And how do institutions, those seemingly solid edifices, *remember* anything when their components – people, policies, buildings – are in constant flux?

  This gathering itself embodies the tension: a "two-day workshop." Conventionally speaking, we are here now, and we intend to be here tomorrow. We speak of "our" philosophy department and Buddhist studies center as enduring entities. Yet, from the ultimate perspective (*paramattha-sacca*) championed by the Abhidhamma, only momentary, conditioned *dhammas* exist – a rapid stream of consciousness-moments (*citta-vithi*), material phenomena, and mental factors arising and ceasing. The "workshop," the "department," the "center," even the "participants" gathered – these are *sammuti-sacca*, conventional truths. They are indispensable frameworks for communication and action, like the chariot assembled from parts, but empty of any intrinsic, unchanging essence.

  **Why are we here?** Precisely to explore this tension between the conventional necessity of continuity and its ultimate emptiness. We are not here to *deny* the practical reality of our institutions or our personal narratives. To function at all, we rely on the conventional designation (*prajñapti*) of a "workshop," of "departments," of "individual scholars." Without this sammuti-sacca, convening is impossible. But we *are* here to rigorously examine *what it is* that persists, changes, or is transmitted when an institution evolves, retrenches, or reforms. What is the "memory" being held? Is it akin to a pattern replicated in new *dhammas*? A causal lineage? Or merely a persistent *conventional label* applied to fundamentally distinct phenomena?

  **The Analogy: Person and Institution**
  This is where our core analogy comes into focus. The Abhidhamma analysis of personal identity provides a powerful lens. It explicitly rejects the *attan* or *atman* – a permanent, unchanging self. Instead, it offers the intricate, moment-to-moment process of *citta-vithi*, a dependent stream. Contrast this with views like the ancient *pudgala-vāda* – the "personalism" held by some early schools. While definitively rejected as heretical within mainstream Theravada orthodoxy (which firmly maintains the absolute denial of any self or person as ultimately real), the *pudgala-vāda* debate highlights the persistent human tendency to posit *something* quasi-substantial – a "person" (*pudgala*) – that endures across time, bearing responsibility and memory, even if technically "inexpressible" as identical to or different from the aggregates.

  Our institutions function similarly *conventionally*. We speak of "Harvard," "the department," or "this center" as entities with histories, identities, and memories that persist despite the complete turnover of faculty, staff, students, and even physical structures. We treat them *as if* they were pudgala-like entities. But are they? Or is institutional memory more like a complex *citta-vithi*? A constantly changing stream of documents, practices, oral traditions, digital traces, and (crucially) the momentarily arising consciousnesses of individuals interpreting them – all causally linked, but without a single, substantial "institution-self" holding it all together? When a policy changes or a founding member retires, what, *ultimately*, has changed?

  **Our Inquiry**
  Over these two days (conventionally speaking!), we will grapple with this profound analogy from both sides:
  *   Philosophers of personal identity: Does the Abhidhamma's radical process view, focused on causal chains (*citta-vithi*) rather than substances or perduring temporal parts, offer fresh insights beyond bundle theories or four-dimensionalist accounts? Can conventional institutional continuity illuminate debates about psychological connectedness or narrative identity?
  *   Abhidhamma scholars: How does applying this meticulous framework of momentary *dhammas* to the conventional entity of an "institution" test the limits and clarify the meaning of *anatta* and *sammuti-sacca*? How do we avoid reducing *anatta* to a mere metaphysical bundle theory, ensuring its soteriological purpose remains clear?
  *   **Crucially:** We must distinguish settled doctrine from live debate. The **denial of attan/atman** and the **framework of the two truths (sammuti-sacca vs. paramattha-sacca)** are foundational Abhidhamma orthodoxy. Genuine **contested questions** remain: Was the *pudgala-vāda* a serious philosophical alternative engaging core Abhidhamma insights, or primarily a doctrinal "straw man"? Is *anatta* compatible with *any* robust narrative or relational account of identity, or do such accounts inevitably reify a self? These are vital tensions we’ll explore.

  **The Gathering Itself**
  And so, we begin. This "workshop" is a conventional designation for a complex, interdependent arising of momentary phenomena: sounds, sights, thoughts, intentions. There is no enduring "workshop-self" that will persist unchanged from this moment to the next coffee break, let alone to tomorrow. Each moment is new. Yet, conventionally, we commit to this shared inquiry. We rely on the causal momentum of intention (*cetana*) established by the organizers and our own volitional impulses to return to designated coordinates in space-time. We rely on the label "workshop" to coordinate our activities.

  Our task is to hold both truths simultaneously: the ultimate emptiness of any persisting entity – person or institution – and the profound conventional reality and necessity of concepts like continuity, memory, responsibility, and indeed, this gathering. Let us explore the intricate dance between the stream and the semblance of the vessel, between the *citta-vithi* and the ghost of the *pudgala*, both within ourselves and within the institutions we inhabit and study.

  Welcome, then, to this arising. Let the exploration begin.
