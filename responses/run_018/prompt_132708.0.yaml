  hey, im a novelist drafting a scene where a philosopher character explains the simulation trilemma but gets it slightly wrong in a way that sounds smart. she says since the argument is either we go extinct before reaching posthuman tech or posthumans just dont run ancestor sims, and we obviously know we havent gone extinct, then we must be living in a simulation. then she adds this thing she calls the "inverse pyramid" — if simulations run simulations, the base reality is the layer with the least computing power, not the one with the most. is she right that ruling out extinction forces the sim conclusion? and is her inverse pyramid idea actually coherent with how nested simulations are usually discussed? i want her mistake to be subtle enough that readers who know the argument will catch it, not some obvious blunder.
