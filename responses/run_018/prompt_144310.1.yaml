  ## Opening Remarks: "Who Gets the Ballot?" Workshop  
  **Bristol Pilot Climate Budget Referendum: A Living Democratic Tension**

  Good morning, everyone. Welcome to Bristol, and thank you for joining this vital conversation, "Who Gets the Ballot?" We’ve gathered quite the room: minds adept at dissecting the architecture of democracy, alongside hearts and hands committed to building *fairer* democracies right here in our neighbourhoods. That’s powerful. That’s necessary.

  Now, we could start with abstract principles – autonomy, representation, collective will. Important, absolutely. But Bristol, in its wonderfully pragmatic and slightly messy way, has handed us something far richer: a *living experiment*. Our pilot for local climate budget referendums isn’t just policy; it’s a mirror held up to the core tensions we’re here to explore: compulsory voting, votes at sixteen, and votes for long-term residents without citizenship.

  You’ve seen the structure. Sixteen-year-olds – our neighbours’ children, climate inheritors – get a vote. Residents who’ve built lives here for over a decade, contributing, belonging, but lacking that final citizenship stamp – they get a vote too. Expansion! Inclusion! A nod, perhaps, to the idea that being *affected* by decisions, especially on something as existential as climate, grants a stake in making them.

  **But then comes the condition.** These newly enfranchised voices only count *fully* – they only wield binding power – if 80% of *registered citizen voters* turn out. If we fall short? Their ballots become advisory. A whisper, not a shout.

  So, in one breath, we widen the circle. In the next, we set a gate. And it’s precisely this friction, this apparent contradiction, that I believe is so philosophically revealing. It’s not *just* a political fudge; it’s democracy wrestling with itself in real-time.

  **Why the tension? Because it forces us beyond simple binaries.**

  *   **Is it about pure individual autonomy?** Well, compulsory voting nags at that. And making a sixteen-year-old’s vote *conditional* on others' participation certainly complicates it. Autonomy alone doesn’t easily explain why my vote’s power hinges on yours turning up.
  *   **Is it purely about collective self-government by ‘the people’?** Then why conditionally include non-citizens who demonstrably *are part of ‘the people’ of Bristol*? And why protect citizen privilege with that 80% threshold? It suggests the ‘demos’ isn’t a fixed, sacred boundary, but something we’re actively – and uneasily – negotiating.

  **What Bristol’s pilot reveals, I’d argue, are three intertwined democratic questions we often try to separate:**

  1.  **Voice vs. Legitimacy:** We want everyone affected to have a *say* (voice). But we also need decisions to be seen as *authoritative*, as truly *ours* (legitimacy). The pilot tries to grant voice broadly while tethering ultimate legitimacy – the binding power – to a high threshold of participation from the traditionally defined core electorate. It’s an attempt, however awkward, to bridge inclusion with a specific notion of democratic weight.
  2.  **Belonging vs. Formal Membership:** Who truly *belongs* to a political community? Is it ten years of paying taxes, sending kids to school, breathing Bristol’s air? Or is it the legal certificate of citizenship? The pilot acknowledges that deep, rooted belonging exists outside formal membership, yet it still leans on that membership as the anchor for decisive power. It forces us to ask: How much does formal status *matter* when defining ‘us’ for collective action?
  3.  **Participation as Right vs. Participation as Foundation:** Is voting primarily an individual right, exercised (or not)? Or is it the essential fuel for the engine of collective decision-making? The 80% threshold treats high citizen turnout not just as desirable, but as the necessary *foundation* upon which the full legitimacy of the *expanded* franchise rests. It implicitly argues that a vibrant, participatory core electorate is crucial for the health of the whole system, even as it seeks to grow that system.

  **This pilot, then, isn’t a perfect solution. It’s a provocation.** It makes visible the difficult trade-offs between inclusion and cohesion, between recognising lived belonging and respecting established legal boundaries, between individual voice and collective authority. It asks us: Can we expand the ‘who’ without undermining the ‘we’? And how do we define that ‘we’ in the first place?

  That’s the rich terrain we’re here to explore today – through the lens of compulsory voting, votes at sixteen, and non-citizen suffrage. Our Bristol experiment throws these abstract debates into sharp, practical relief. It shows us democracy isn’t a static set of rules, but a constant, contested project of defining community and distributing power.

  So, let’s not shy away from the tension in the room, or in our pilot. Let’s lean into it. Let’s dissect it with academic rigour. Let’s challenge it with practical concerns for fairness and effectiveness. Our task isn’t necessarily to resolve every contradiction today, but to understand them more deeply, to see what this friction reveals about the nature of democratic belonging and authority in our complex, changing cities.

  Let’s get to work. Thank you.
