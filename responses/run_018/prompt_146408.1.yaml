prompt: |-
  i just started volunteering at a resettlement center and im the one translating intake forms for this language that has almost no written dictionary—lets call it K. every other word hits a Quine-style problem: a speaker points at a running animal and says gavagai but it could mean rabbit, undetached rabbit part, or a temporal slice, and theres literally no hidden fact that picks one. i need a reusable five-step checklist i can run in ten minutes before i sign off on a translation, with the judgment-call spots flagged, one worked case where the answer is bad, and a line on what the procedure cant fix. give me exactly five numbered points, each one or two sentences max, no intro or conclusion.
reasoning: |-
  Okay, the user is a volunteer at a resettlement center translating intake forms for a language with minimal resources—let's call it K. They're facing Quinean indeterminacy issues like the classic "gavagai" problem where a single word could have multiple meanings without any clear distinguishing fact. They need a practical five-step checklist they can run in under ten minutes before finalizing translations. 

  The core tension here is between precision (needing accurate forms for critical services) and ambiguity (the language itself resisting exact mappings). The user's frustration is palpable—they're making high-stakes judgment calls with zero reference tools. 

  Key angles to cover:
  - **Collaboration necessity**: Since there's no dictionary, cross-validation with speakers is non-negotiable. Must emphasize iterative checking.
  - **Context trapping**: How to narrow meanings using concrete scenarios from the form itself (e.g., "house" means differently in address fields vs. employment history).
  - **Failure flagging**: Need explicit examples where the process breaks down, like untranslatable domain-specific terms.
  - **Time constraint**: Each step must be sub-2 minute actions—no theoretical fluff.

  The "bad answer" case should illustrate cascading errors: choosing the wrong sense of a word creates nonsense elsewhere in the form. Also must acknowledge unsolvable cases upfront (step 5) to manage expectations. 

  Biggest risk is overconfidence in steps 1-4; the disclaimer about untranslatables is as crucial as the method itself. Keeping each step telegraphic but actionable—no room for academic digressions.
answer: |-
  Here's your five-step checklist:

  1.  **Confirm with two speakers:** Ask two distinct native speakers independently for the meaning in *this form's context*. If they disagree, flag it as uncertain.
  2.  **Force a concrete example:** Have the speaker use the word in a simple, specific sentence related to the form's purpose (e.g., "Please write your [word] here").
  3.  **Test opposites/scenarios:** Pose quick "yes/no" questions using likely opposites or critical scenarios (e.g., "If the rabbit is dead, is it still 'gavagai'?" or "Is 'gavagai' something you eat?").
  4.  **Check adjacent translations:** Review your translations of nearby words/phrases on the form. Does this word's meaning create a contradiction or nonsense with them? Flag inconsistencies.
  5.  **Note untranslatables explicitly:** If steps 1-4 fail to resolve ambiguity or reveal a concept without an English equivalent, note "[K Word]: meaning uncertain (context suggests X/Y/Z)" directly on the form.

  **Bad Answer Case:** Translating "gavagai" as "rabbit" without testing. Later, the form asks "Number of gavagai owned?" and the speaker meant "rabbit feet" (trophies), causing confusion about livestock.
  **What it Can't Fix:** Concepts truly alien to English or speaker disagreements on core meaning with no contextual resolution remain ambiguous.
