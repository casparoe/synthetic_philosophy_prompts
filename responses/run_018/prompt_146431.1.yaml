prompt: |-
  Construct a thought experiment, contained in a single paragraph and grounded in an ordinary social setting rather than science fiction, in which a small community of children is raised collectively without parents, teachers, priests, or any hierarchical authority figure, and without access to written texts or formal ritual instruction, yet over time they develop stable, cooperative norms that prevent violence and regulate resource distribution. Engineer the scenario so that Xunzi's thesis—that human nature is originally driven by self-interest and that moral order arises only through the artificial accumulation of ritual and learning—accounts for the emergence of these norms more persuasively than Mencius's thesis that human nature contains innate sprouts of compassion, shame, deference, and moral discernment that naturally develop when not obstructed. To do this, specify a mechanism—such as peer-to-peer reciprocal punishment of defectors that gradually crystallizes into an unwritten but rigorously enforced code of exchange—through which purely self-interested agents generate and internalize rules without any innate moral impulse directing them, and ensure that the environment contains no nurturing figure or protective space that Mencius could invoke as the condition under which sprouts flourish. After presenting the scenario, provide a continuous prose analysis—without headings, bullet points, bold text, or tables—showing what Mencius would predict about the four sprouts in this setting, why the observed cooperation either does not constitute their natural growth or is insufficient to explain the rigidity of the norms, and how Xunzi explains the same outcome as the product of instrumental reasoning and accumulated habit rather than innate development. Identify the precise structural feature that makes Xunzi's account come out ahead—likely the conjunction of absent nurturing conditions and present instrumental peer enforcement—and explain whether removing that feature, for example by introducing a consistently nurturing caregiver but retaining the absence of ritual tradition, collapses the comparison back to a standard vindication of Mencius. Conclude by stating how a defender of Mencius might attack the case, perhaps by arguing that the peer-enforced shame and reciprocal concern are themselves direct expressions of the innate sprouts rather than artificial constructs, and assess whether that reply succeeds or merely re-describes the phenomenon in Mencian terms. Write everything in continuous prose as in a letter, with no formatted lists or section breaks.
