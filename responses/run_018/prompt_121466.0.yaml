          - We do not commit to a specific day in advance. We let the bids determine it.

     Why is this honest? Because we are following the rule. The students know the rule, so they can trust that.

     The uncomfortable question: if we had used a sealed envelope (a fixed day), then the backward induction would apply and the quiz could not be a surprise. But in our setup, the day is not fixed until the bids are in. So it's not vulnerable to the same elimination argument.

     Therefore, we don't need a sealed envelope.

     **Summary of the activity**:

     - 24 students in 6 teams of 4.
     - 8 rounds, each round: teams submit a bid (0 to 1).
     - Rule: the quiz is held in the first round where the mean bid is below 0.4, or in the last round if none are below 0.4.
