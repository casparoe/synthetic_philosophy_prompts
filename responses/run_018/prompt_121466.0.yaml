     What if we used the knowledge reading? We would have to define surprise as: the students do not know that the quiz is today. But then we would need to model knowledge. That would require a different setup (perhaps with multiple possible quiz days and a notion of what the students know about each other's knowledge). It would be more complex. The credence version is easier to implement with bids.

     The gap between credence and knowledge: In the debrief, we can note that in the knowledge version, the surprise condition is defined in terms of knowledge (you don't know it is today), while here we used a credence threshold. The backward-induction argument in the knowledge version is more about the impossibility of knowledge in advance, while in the credence version it is about the impossibility of low credence. The two are related but distinct. We did not attempt to model knowledge, so we cannot directly reproduce the knowledge version. But we can note that the credence version is more flexible and allows for a surprise when the knowledge version might not (if the students know that the quiz must be today, then their credence is 1, but if they don't know, their credence might be high but not 1).

     We can leave this as a point for discussion.

  8. **Materials**:

     - For each team: a sheet of paper for each round (or one sheet with a table for 8 rounds) to record their bid. They write: round number, bid.
     - For the instructor: a spreadsheet or paper to record the bids of each team and compute the mean.
     - A way to display the mean (whiteboard or projector).
     - A sealed envelope? We don't need it because we are using the rule. We commit to the rule in advance.

