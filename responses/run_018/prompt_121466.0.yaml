     Actually, the backward-induction argument says that the quiz cannot happen in the last round, so it must happen earlier. But they don't know which earlier round. So in round 1, their credence might be 1/(number of remaining rounds). For 8 rounds, that would be 1/8=0.125, which is below 0.4. So they bid low. Then the quiz happens in round 1, which is a surprise? No, because they assigned 0.125 to it, which is below 0.4 -> it is a surprise by our definition. But they did expect it could be in round 1. The surprise is relative to their credence: they thought it was unlikely. 

