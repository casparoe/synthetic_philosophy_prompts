     We can adjust: the backward-induction teams might bid systematically low in the early rounds and then higher in later rounds. But in round 1, they bid 0.125. If the class has several such teams, the mean might be 0.125 (if all do that), which is below 0.4, so the quiz happens in round 1. Then they are surprised? Yes, by the definition. They are caught because they are the ones who made the quiz happen early. They are the ones who, by following the backward induction, caused the early quiz. But they are not caught off guard in the sense of being unprepared? They might be prepared for the quiz in any round. The surprise is in the timing: they thought it might be in round 1, but they didn't think it was very likely. So they might not have reviewed as thoroughly for round 1.

