  We are going to design an in-class activity to demonstrate the surprise quiz paradox, using a credence-based definition of surprise (credence < 2/5) and compressing the six-week window into 8 rounds within a 75-minute session.

  Key elements:
  - The quiz is a surprise on a given round if, at the start of that round, a reasonable student's credence that the quiz is that day (conditional on available information) is below 2/5.
  - We want to catch out the students who are most confident in the backward-induction argument.
  - We will use a bidding mechanism to elicit credences, and the quiz will be a short task (e.g., 2 minutes) on the previous reading.

  Structure of the session:
  1. Introduction (5 minutes): Briefly explain the activity without revealing the paradox. State that there will be 8 rounds, and in each round, students will submit a bid representing their credence that the quiz happens in that round. Emphasize that the quiz will occur in exactly one of the rounds, and it will be a surprise according to the credence definition.
  2. Bidding and Quiz Execution (60 minutes): 8 rounds, each taking about 7-8 minutes (including bidding, collection, and potential quiz). 
  3. Debrief (10 minutes): Discuss the results and draw out the lesson.

  Mechanism Details:

  1. **Bidding Procedure**:
     - **Individual Bidding**: Each student submits a bid (a number between 0 and 1) representing their credence that the quiz occurs in the current round, conditional on the quiz not having occurred in previous rounds and on the history of the game so far.
     - **Incentives**: Use a proper scoring rule to incentivize truthful reporting. We'll use the quadratic scoring rule because it is simple and effective for credences. For a bid (probability) `p` and an outcome `x` (1 if the quiz happens in that round, 0 otherwise), the score is:
          S = 1 - (x - p)^2
       This is bounded between 0 and 1. We can scale it to bonus points (e.g., out of 10) and cap the total to avoid grade inflation. Since we have 8 rounds, we can set the maximum possible bonus to 8 * 10 = 80 points, but we can cap the total bonus for the activity at, say, 20 points (so that it doesn't overwhelm the course grading). Alternatively, we can use tokens that can be exchanged for small rewards (e.g., extra credit points, or tangible prizes like candy). I recommend bonus points capped at 20 points for the entire activity (so each round's score is scaled appropriately).

     - **Collection**: Use slips of paper or a digital tool if available. For simplicity, we assume paper. Each student writes their bid and name on a slip. Collect and shuffle to avoid bias in display order.

     - **Display**: After collecting the bids, the instructor will calculate and display the mean and perhaps the distribution (e.g., histogram) of the bids for that round. This is important for the class to see the aggregate belief and for the debrief.

  2. **Quiz Execution**:
     - The quiz is a very short task (2 minutes) on the previous week's reading. Example: "In one paragraph, state the main argument of the reading and one objection to it."
     - The instructor must decide in which round to hold the quiz. We want to ensure that the quiz is a surprise (i.e., the mean bid in that round is below 0.4). However, we also want to catch out the overconfident backward-induction reasoners.

     **How to select the day?**
     - We must pre-commit to a method that is both fair and surprising. Let's consider:
          Option 1: Public randomization from a known distribution. But then students can condition on the fact that the quiz hasn't happened yet and update the hazard rate, which might lead to the elimination argument.
          Option 2: Sealed envelope with a predetermined round. But then if the distribution is known, we have the same issue.
          Option 3: Instructor decides after seeing the bids, but only if the mean bid is below 0.4. However, if the instructor can choose arbitrarily, then the students might not trust that the quiz will occur for sure.

     - We must satisfy two conditions:
          (a) The quiz must occur in exactly one round.
          (b) In the round it occurs, the mean bid must be below 0.4 (to be a surprise).

     - Proposed method: The instructor commits to a rule: "I will run the quiz in the first round for which the mean bid is below 0.4, unless no such round occurs. If no round has a mean bid below 0.4, then I will run the quiz in the last round regardless (and then it won't be a surprise, but we will have a failure)."

       Why this rule?
          - It ensures that the quiz happens (if not in a surprising round, then in the last round).
          - It is deterministic and known to the students. They know that the quiz will happen in the first round that the class as a whole has low enough credence (or the last round).

       However, note that the students might game this: they might bid high in early rounds to avoid having the quiz early, and then bid low in a later round to get the quiz then. But note that if they bid high in an early round, they avoid the quiz in that round, but the quiz might then happen in a later round. Also, if they bid too low in a round, the quiz will happen then.

       But the backward-induction argument might still be applied: 
          - In the last round, if the quiz hasn't happened, the credence should be 1, so the mean bid will be at least 0.4 (if students are rational) and the quiz will happen in the last round (by the rule) but it won't be a surprise. Therefore, the quiz cannot be in the last round as a surprise. Then in the second last round, if the quiz hasn't happened, the conditional probability should be high (because the last round is ruled out as a surprise) so the bid would be high and the quiz wouldn't happen then either. And so forth.

       But note: the rule is "first round with mean bid < 0.4", so if in an early round the mean bid is below 0.4, the quiz happens then. The backward-induction argument might break down because the rule doesn't require that the quiz be a surprise in the last round. In fact, the rule allows the quiz to happen in the last round without being a surprise.

       We want to catch the overconfident: those who use backward induction and bid very low in the early rounds (because they think the quiz can't happen late) might cause the quiz to happen early (if the mean bid is low enough). Conversely, if they bid high in early rounds to avoid the quiz, then they might push the quiz to a later round, but then in a later round, if they bid low, the quiz happens.

