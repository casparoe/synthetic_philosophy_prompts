          "The backward-induction argument says that the quiz cannot be a surprise. In this run, it wasn't a surprise in the last round. But note: the argument also says that the quiz cannot occur at all? No, it says that the announcement is impossible. But we did run the quiz, so the announcement was true except for the surprise. However, our rule allowed a non-surprise quiz in the last round. But we intended the quiz to be a surprise. What went wrong? The class's behavior prevented a surprise by keeping their bids too high in the early rounds. This is the class's fault, not the teacher's."

          Alternatively, we can say: "The backward-induction argument becomes a self-fulfilling prophecy: if the students believe it, they will bid high until the last round, and then the quiz is not a surprise. But if they had bid low in an early round, the quiz would have been a surprise."

          This outcome is not a bug; it is one of the possible equilibria. The other equilibrium is that the quiz happens early and is a surprise.

  7. **The credence threshold and substitution**:

     You proposed: surprise if credence < 2/5.

     Why 2/5? It's arbitrary. We need a threshold that is low enough to be "surprising" but not too low to be unattainable. 

     We could use 1/2: but then if the credence is 0.49, it's below 0.5 and therefore a surprise, but 0.49 is not very surprising. We want a threshold that feels surprising. 2/5=0.4 is a bit more stringent.

     Alternatively, we could use a threshold that depends on the round? For example, in the last round, we require credence=0? But that would be impossible if the quiz must occur.

