          This is where the argument breaks down: the class's bids affect when the quiz happens. In round 7, if the class bids high (>=0.4), then the quiz won't happen in round 7 and will happen in round 8. If they bid low (<0.4), then the quiz happens in round 7. Therefore, the conditional probability that the quiz is in round 7 (given that it hasn't happened and that we are in round 7) is not fixed. It depends on what the class does. And the class is trying to maximize their score.

          This interdependence makes the backward induction difficult. We hope that the students who are overconfident in backward induction will bid low in early rounds, causing the quiz to happen early.

     - Therefore, we go with the deterministic rule: Quiz in the first round with mean bid < 0.4, or in the last round if none were below 0.4.

  3. **Team vs Individual**:
     - We have 24 students. We can do individual bidding, but that might be chaotic. Alternatively, we can form teams of 4 (6 teams). Teams might encourage discussion and represent a more "reasonable" student. Also, it reduces the number of bids to process (6 bids per round) and the mean can be computed quickly.
