       *(For both, proceed to 3.)*  

  3. **Allow cosmopsychism as fallback if micro-to-macro combination fails?**  
     - **Yes → Proceed to 4.**  
     - **No → Proceed to 5.**  

  4. **Does micro-to-macro combination succeed?**  
     *(Asked only if cosmopsychism fallback allowed)*  
     - **Yes → Constitutive panpsychism** (proceed to 6).  
     - **No → Cosmopsychism** (proceed to 6).  
       *Most awkward commitment (cosmopsychism): Humans are mere fragments of cosmic consciousness, begging the question of personal identity.*  

  5. **Does micro-to-macro combination succeed?**  
     *(Asked only if cosmopsychism fallback not allowed)*  
     - **Yes → Constitutive panpsychism** (proceed to 6).  
     - **No → Eliminativist view (no macro subjects)**.  
       *Most awkward commitment: Denies the existence of your conscious self despite micro-subjects.*  

