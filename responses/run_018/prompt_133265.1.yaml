  **Annotations:**  
  - **Empty combos**:  
    - *Functional binding + phenomenal bonding*: **Incoherent** (binding can’t be both functional and primitive).  
    - *Eliminativist view + cosmopsychism fallback*: **Unattractive** (denies macro-subjects but invokes cosmos as subject).  
  - **Unseparable pairs**: Functional constitutive panpsychism and emergent panpsychism often blur, as both rely on causal-informational structures to explain macro-consciousness.  
  - **Key**:  
    - **Constitutive panpsychism**: Micro-subjects directly compose macro-subjects (via binding).  
    - **Emergent panpsychism**: Macro-consciousness ontologically emerges from (but isn’t constituted by) micro-phenomenality.  
    - **Cosmopsychism**: The cosmos is the fundamental subject; micro-phenomenality is derivative.  
    - **Eliminativist view**: Micro-subjects exist, but macro-subjects (e.g., humans) do not.
