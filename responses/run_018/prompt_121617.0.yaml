  ### Decision Tree for Trolley Case Verdicts  
  This tree uses concrete cases to sort verdicts, avoiding theoretical terms. Required cases are integrated: Standard Switch (SS), Footbridge Push (FP), Loop Variant (LV), Rock Case (RC; by-product death), Sleeping Passenger (SP; your custom case), and Footbridge Injury (FI; grave injury variant). The tree has **9 nodes** and **6 leaves** (including one for incoherent/unattractive verdicts).  

  ---

  #### **Node 1: Standard Switch (SS)**  
  *Setup:* A trolley will kill 5 people. You can flip a switch to divert it to a side track, killing 1 person instead.  
  → Is flipping the switch okay?  
  - **Yes** → Go to Node 2  
  - **No** → Go to Node 3  

  #### **Node 2: Footbridge Push (FP)**  
  *Setup:* A trolley will kill 5 people. You can push a large man off a footbridge; his body stops the trolley, killing him.  
  → Is pushing okay?  
  - **Yes** → Go to Node 4  
  - **No** → Go to Node 5  

  #### **Node 3: Footbridge Push (FP)**  
  *Same as Node 2.*  
  → Is pushing okay?  
  - **Yes** → **Leaf 1: Permit Push but Forbid Switch** (Unattractive: Why allow direct bodily harm but forbid indirect?)  
  - **No** → **Leaf 2: Absolutist** (Never cause harm to an innocent, regardless of numbers.)  

  #### **Node 4: Loop Variant (LV)**  
  *Setup:* A trolley will kill 5 people. You can flip a switch to divert it onto a loop. One person is on the loop; their body stops the trolley (without it, the trolley loops back and kills the 5).  
  → Is flipping the switch okay?  
  - **Yes** → Go to Node 6  
  - **No** → **Leaf 3: Incoherent** (Allows pushing (FP) but not loop (LV)—both use a body as a stopper.)  

  #### **Node 5: Loop Variant (LV)**  
  *Same as Node 4.*  
  → Is flipping the switch okay?  
  - **Yes** → Go to Node 7  
  - **No** → Go to Node 8  

  #### **Node 6: Sleeping Passenger (SP)**  
  *Setup:* You drive a trolley that will kill 5 people. The only way to stop it is to drop a sleeping passenger through a trapdoor. He dies without waking, struggling, or anyone else knowing.  
  → Is dropping him okay?  
  - **Yes** → **Leaf 4: Maximizing** (Always save more lives, no matter the method.)  
  - **No** → **Leaf 5: Forbids In-Trolley Harm** (Allows SS/FP/LV but forbids SP—agent’s location matters.)  

  #### **Node 7: Rock Case (RC)**  
  *Setup:* A trolley will kill 5 people. You can flip a switch to divert it onto a side track. The diversion kicks up a rock that kills a bystander (the death doesn’t help stop the trolley).  
  → Is flipping the switch okay?  
  - **Yes** → Go to Node 9  
  - **No** → **Leaf 6: Allows Only Track-Based Harm** (Allows SS/LV but not RC—harm must occur "on the track". Incoherent if FI allowed.)  

  #### **Node 8: Rock Case (RC)**  
  *Same as Node 7.*  
  → Is flipping the switch okay?  
  - **Yes** → **Leaf 7: Side Effect Only** (Allows SS/RC—death is a by-product, not the rescue method. Forbids FP/LV/SP.)  
  - **No** → *Stop* (Answers: SS=Yes, FP=No, LV=No, RC=No. Use FI to test further.)  

  #### **Node 9: Sleeping Passenger (SP)**  
  *Same as Node 6.*  
  → Is dropping him okay?  
  - **Yes** → **Leaf 4: Maximizing** (Same as Leaf 4—allows all life-saving actions.)  
  - **No** → **Leaf 8: Switch-Only Interventions** (Allows SS/LV/RC but forbids FP/SP—no direct bodily contact.)  

  ---

  ### **Leaves Summary**  
  1. **Leaf 1: Permit Push but Forbid Switch** (Unattractive)  
     - SS=No, FP=Yes. Diagnosis: Unattractive (forbids less direct harm but allows more direct harm).  
  2. **Leaf 2: Absolutist**  
     - SS=No, FP=No. Forbids all harm to innocents, regardless of numbers.  
  3. **Leaf 3: Incoherent**  
     - SS=Yes, FP=Yes, LV=No. Diagnosis: Incoherent (FP and LV both use a body as a stopper).  
  4. **Leaf 4: Maximizing**  
     - SS=Yes, FP=Yes, LV=Yes, SP=Yes. Saves more lives no matter the method.  
  5. **Leaf 5: Forbids In-Trolley Harm**  
     - SS=Yes, FP=Yes, LV=Yes, SP=No. Allows harm only when agent isn’t in the trolley.  
  6. **Leaf 6: Allows Only Track-Based Harm**  
     - SS=Yes, FP=No, LV=Yes, RC=No. Allows harm only if victim is "on the track" (incoherent if FI allowed).  
  7. **Leaf 7: Side Effect Only**  
     - SS=Yes, FP=No, LV=No, RC=Yes. Allows harm only if death is a by-product (not the rescue method). Forbids FP/LV/SP.  
  8. **Leaf 8: Switch-Only Interventions**  
     - SS=Yes, FP=No, LV=Yes, RC=Yes, SP=No. Allows only switch-based harm (no pushing/dropping).  

  ---

  ### **Empty Cells & Diagnoses**  
  - **Permit Push but Forbid Switch (Leaf 1)**: Unattractive (rare/unstable—direct harm allowed, indirect forbidden).  
  - **Allow FP but Forbid LV (Leaf 3)**: Incoherent (both require using a body as a stopper).  
  - **Allow SS/LV but Forbid RC (Leaf 6)**: Incoherent if FI allowed (arbitrary distinction between "on-track" and bystander harm).  

  ### **Indistinguishable Leaves & Tiebreaker**  
  - **Leaf 4 (Maximizing) and Leaf 8 (Switch-Only)** both answer **SP=No** in some paths.  
    - **Tiebreaker Case: Footbridge Injury (FI)**  
      *Setup:* Push the man off the footbridge, but he survives with grave injury (e.g., loses legs) and stops the trolley.  
      - Leaf 4 (Maximizing) → Allows FI (saves more lives).  
      - Leaf 8 (Switch-Only) → Forbids FI (direct bodily contact).  

  ### **Where Sleeping Passenger (SP) Fits**  
  SP appears at **Nodes 6 and 9**. It distinguishes:  
  - **Leaf 4 (Maximizing)**: SP allowed.  
  - **Leaf 5 (Forbids In-Trolley Harm)**: SP forbidden.  
  - **Leaf 8 (Switch-Only)**: SP forbidden (direct bodily intervention).  
  - **Leaf 7 (Side Effect Only)**: SP forbidden (death is the rescue method).  

  SP is a **strong node** because it tests whether the agent’s physical role (e.g., driving the trolley) and the victim’s passivity affect verdicts, without using theoretical terms.  

  ---

  **Handout Tips**:  
  - Use this tree to map verdicts, then discuss why cases feel different.  
  - Test incoherent leaves (e.g., Leaf 3) to provoke debate.  
  - Add FI as a tiebreaker or to explore injury vs. death.
