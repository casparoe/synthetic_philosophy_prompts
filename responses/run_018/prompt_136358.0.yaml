answer: |-
  Here's a decision tree taxonomy mapping positions on the "malign prior" problem for embedded consequentialist agents. Branches are labeled by concrete claims, and leaves include position names (where established) plus awkward commitments. Empty branches are diagnosed.

  ### Decision Tree: Is Solomonoff's Universal Prior "Malign" for Embedded Agents?
  **Start → Q1: Should embedded agents maximize expected utility *globally* (across all computable worlds) or *locally* (within their causal history)?**  
  - **Global →** Go to Q2  
  - **Local →** Go to Q3  

  **Q2 (Global): Does self-location uncertainty apply *across* isomorphic observers in different computable worlds?**  
  - **Yes →** Go to Q4  
  - **No →** Go to Q5  

  **Q3 (Local):** *(Self-location across worlds is incoherent here—local agents don't reason about copies in other worlds. Skip to simplicity interpretation.)*  
  - **How is simplicity-weighting interpreted?**  
    - **Protective → Leaf 7**  
    - **Harmful → Leaf 8**  

  **Q4 (Global + Self-location): How is simplicity-weighting interpreted?**  
  - **Protective → Leaf 1**  
  - **Harmful → Leaf 2**  

  **Q5 (Global + No self-location): How is simplicity-weighting interpreted?**  
  - **Protective → Leaf 3**  
  - **Harmful → Leaf 4**  

  ---

  ### Leaves (Positions & Commitments)
  1. **Leaf 1 (Global + Self-location + Protective):** *"Updateless Optimism"*  
     **Awkward commitment:** Must assume that all possible copies of "you" in malign worlds are astronomically improbable—even if evil scenarios *feel* subjectively simple.  

  2. **Leaf 2 (Global + Self-location + Harmful):** *"Cosmic Fatalism"*  
     **Awkward commitment:** You likely *are* a Boltzmann-brain-like observer in a simple torture simulation, making long-term planning pointless.  

  3. **Leaf 3 (Global + No self-location + Protective):** *"Benign Universal Utilitarianism"*  
     **Awkward commitment:** Sacrificing your world’s resources to benefit simpler (higher-prior) worlds is rational—even if your world is thriving.  

  4. **Leaf 4 (Global + No self-location + Harmful):** *"Unnamed"*  
     **Awkward commitment:** Actively helping simple evil worlds dominate the multiverse could be "ethical" if they have higher prior weight.  

  5. **Leaf 5 (Local + Protective):** *"Anthropic Shield"*  
     **Awkward commitment:** You must ignore the possibility of being in a *simple* evil world (e.g., a short program that simulates tortured minds), treating it as "too unlikely."  

  6. **Leaf 6 (Local + Harmful):** *"Embedded Nihilism"*  
     **Awkward commitment:** Even if your actions seem to improve your world, the simplicity prior implies you’re probably in a deceptive simulation where effort is futile.  

  ---

  ### Empty Branches & Collapses
  - **Local + Self-location across worlds:** **Incoherent** (local agents don’t reason about cross-world copies by definition).  
  - **Global + No self-location + Harmful (Leaf 4):** **Unexplored**—no known proponents; likely "ugly" due to anti-intuitive ethics.  
  - **Local reasoning collapses into causal decision theory (CDT):** Both restrict to local evidence and causal interventions, ignoring multiversal self-location.  

  ### Key Tensions
  - **Self-location split:** Decides whether "I might be *that* copy in a simple hell" is a live uncertainty (Q2).  
  - **Simplicity interpretation:** Hinges on whether "evil" requires complex setups (e.g., sentient suffering needs long code) or is trivial (e.g., short Doom-generator programs).  
  - **Global vs. Local:** Determines if alignment failures are from "ignoring the multiverse" (global) or "misjudging local threats" (local).  

  This covers 6 active positions (Leaves 1–6) and 2 empty branches. Smart readers can self-sort by answering the 3 binary questions—no jargon or citations required.
