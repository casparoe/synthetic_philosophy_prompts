answer: |-
  Here’s a comprehensive exam package designed to meet your specifications, focusing on conceptual rigor and resisting summary-level answers.

  ---

  ### **Exam Question (90 minutes)**  
  **"Evaluate whether the distinction between *delegated stain* (where a leader authorizes a wrongful act through institutional layers but does not execute it) and *executive stain* (where a leader directly orders/performs the wrong) resolves, complicates, or collapses the classic 'dirty hands' problem. Assess:  
  (a) Whether moral responsibility tracks authorization independently of proximity to the act, and  
  (b) Whether democratic citizens inherit moral stain through representative consent.  
  Argue conceptually; do not merely survey existing literature."**  

  ---

  ### **Model Answer (650 words)**  
  The delegated/executive stain distinction appears to clarify dirty hands by linking moral taint to physical proximity: executive stain seems "dirtier" because the agent is immersed in visceral wrongdoing, while delegated stain implies attenuated responsibility. Yet this distinction collapses under scrutiny, exacerbating dirty hands’ paradoxes by revealing responsibility’s *independence* from proximity and implicating democracy in systemic moral compromise.  

  **First, moral responsibility does not diminish with institutional distance.** Delegated stain assumes authorization is "cleaner" because intermediaries execute the act. But if a leader knowingly approves coercive interrogation—designing policy, resourcing it, and shielding perpetrators—their causal and moral responsibility is undiluted. The *intentionality* and *authority* behind the act define culpability, not hand-washing through bureaucracy. If a general orders a massacre via subordinates, we blame the general, not the hierarchy. Thus, both stains incur equal responsibility: authorization *is* participation. The proximity distinction merely obscures this, complicating dirty hands by suggesting institutional structures absolve when they actually distribute agency.  

  **Second, the distinction collapses because both stains generate identical democratic dilemmas.** If citizens consent to leaders who authorize wrongdoing (delegated stain), they become complicit in the authorization itself—not merely its execution. Democratic representation compounds the problem: voting for a leader who *might* dirty hands implicates citizens preemptively. For example, endorsing a candidate who approves drone strikes (delegated stain) shares moral liability with endorsing one who pulls the trigger (executive stain), since both choices enable harm. Here, the proximity distinction dissolves: citizens inherit stain by legitimizing structures that permit *either form* of wrongdoing. Responsibility flows upstream to authorization and downstream to ratification, making democratic complicity inescapable.  

  **Ultimately, the distinction complicates dirty hands by exposing its structural inevitability in politics.** If executive stain feels more visceral, it is due to psychology, not ethics. But in democracies, citizens and leaders share *delegated* stain by default—electoral mandates license acts citizens would refuse to perform personally. This fractures accountability: leaders bear executive/delegated stains for acts, citizens bear delegated stain for enabling leadership. The distinction thus collapses into a continuum of shared guilt, revealing dirty hands not as an episodic crisis but as a systemic feature of delegated power.  

  **Conclusion:** The proximity distinction neither resolves dirty hands nor merely complicates it—it collapses by proving moral stain attaches to intentional authorization regardless of performance. By severing responsibility from direct action, it shows democratic societies collectively "dirty" their hands through institutional complicity, transforming dirty hands from a leader’s paradox into democracy’s foundational burden.  

  ---

  ### **Marking Scheme (20 points total)**  
  **A-level (17–20):** Collapses the distinction, exposes systemic democratic complicity.  
  **B-level (14–16):** Complicates but preserves the distinction; democratic analysis superficial.  

  #### **Five Required Conceptual Moves**  
  1. **Challenge proximity as a moral mitigator** (4 pts)  
     → *A-level:* Proves responsibility tracks authority/knowledge, not distance.  
     → *Failure:* Accepts proximity as ethically relevant (e.g., "direct action is worse").  

  2. **Equate authorization with participation** (4 pts)  
     → *A-level:* Shows delegated orders incur identical blame to execution.  
     → *Failure:* Treats authorization as secondary ("just giving orders").  

  3. **Implicate democratic consent in stain** (4 pts)  
     → *A-level:* Argues citizens inherit liability via electoral endorsement of *authorization*.  
     → *Failure:* Limits citizen liability to direct acts or omits representation.  

  4. **Collapse the distinction systemically** (4 pts)  
     → *A-level:* Demonstrates both stains converge in democratic structures (e.g., mandates normalize delegation).  
     → *Failure:* Treats stains as isolated categories without institutional interaction.  

  5. **Reframe dirty hands as structural** (4 pts)  
     → *A-level:* Concludes the paradox is inherent to delegated power, not episodic choices.  
     → *Failure:* Presents dirty hands as resolvable through institutional design.  

  ---

  ### **Design Rationale**  
  - **Anti-Summary Defense:** By centering on a novel distinction (not in Walzer/Sartre), candidates cannot default to textbook paradoxes.  
  - **Conceptual Focus:** No citations needed; answers turn on logic (e.g., "If responsibility requires direct action, how do we hold generals accountable?").  
  - **Grading Precision:** Points tied to discrete moves; failure modes target common conceptual errors (e.g., conflating psychological discomfort with moral weight).  
  - **Democratic Depth:** Forces engagement with representation—ignoring citizen complicity caps scores at B-level.  

  This ensures A-work identifies how the distinction *fails*, revealing dirty hands as a crisis of democratic agency itself.
