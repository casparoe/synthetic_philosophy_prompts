  First, I need to address the accuracy of applying Lewis's indexical view of "actual" to literary drafts. Lewis definitely says that "actual" is indexical—our world is actual to us because we're in it, not because it's special. So in the essay's analogy, when an author writes a draft, that draft-world is actual relative to the author's current engagement with it. But does this mean the author can "move" between worlds by revising? Lewis would say no—worlds don't change, and authors can't causally affect them. Instead, revision is about shifting attention between pre-existing possible worlds. The user should clarify that the author isn't moving between worlds but selecting which world-description to focus on. This avoids implying causal interaction between worlds, which Lewis rejects.

  Next, coherence: Can fictional worlds in drafts be considered concrete like Lewis's possible worlds? Lewis is clear that possible worlds are concrete and spatiotemporally isolated, but fictional worlds described in texts are mental constructs dependent on the author. The user's analogy risks conflating Lewis's concrete worlds with ersatz worlds (abstract entities). To stay true to Lewis, the essay should treat the drafts as descriptions of concrete worlds that exist independently. The author isn't creating the worlds but accessing descriptions of them. Any talk of fictional characters must be framed as counterparts across these concrete worlds, not as the author's mental constructs. This is tricky but possible if the user consistently treats the text as a description of a concrete world rather than an abstract entity.

  For the third point about interest: Does this analogy illuminate the phenomenology of revision? Authors often feel like they're discovering a truer version of a character rather than inventing it. Lewis's framework can explain this as the author recognizing qualitative similarities (counterpart relations) across worlds and choosing which world best fits their narrative goals. This reframes revision as selecting among pre-existing possibilities based on resemblance and narrative coherence, which might resonate with authors' experiences. The analogy turns metaphysical jargon into a tool for understanding creative intuition, making it more than just dressing up familiar practices.

  The user might have deeper needs here. They're likely aiming to provide a fresh perspective on revision that combines philosophy and literary theory. They might want to avoid superficial applications of metaphysics and ensure their argument holds up under scrutiny. Their unspoken concern could be whether this analogy is philosophically rigorous enough to publish or present academically. They need reassurance that their core argument is sound and that the analogy does meaningful work without misrepresenting Lewis.

  In summary, the essay's skeleton is promising but needs careful handling. Accuracy-wise, emphasize the indexical nature of "actual" and avoid implying causal relations between worlds. For coherence, strictly separate concrete worlds from the author's descriptions. For interest, show how counterpart theory explains the feeling of discovery in revision. Strengthening these points will help the analogy do real conceptual work, making the essay compelling and philosophically robust.
answer: |-
  Here’s a direct assessment of your argument’s philosophical accuracy, coherence, and conceptual payoff, addressing your three key uncertainties:

  ### 1. **Accuracy: Does Lewis’s indexical "actual" block authorial "movement" between worlds?**
     - **Your reasoning is largely accurate.** Lewis’s indexicality means "actuality" is perspective-dependent: *this* world (the one I inhabit) is actual *to me*. For the author, the draft they’re *currently engaging with* (e.g., Draft 2) is "actual" *relative to their creative activity*. 
     - **Crucially, Lewis denies causal interaction between worlds.** Authors don’t "move" between worlds like traveling between rooms; they shift their *attention* or *indexical context* to a different world-description. Revision isn’t altering a world (worlds are unchanging for Lewis) but *selecting a different, pre-existing world* to describe. 
     - **You avoid importing a causal theory of reference.** Lewis rejects causal theories for modality, and your framing focuses on description/salience. The author’s revision makes a *different world salient* (via a new text) but doesn’t cause it to exist. Strengthen this by emphasizing: **Revision is world-selection, not world-creation or world-alteration.**

  ### 2. **Coherence: Can fictional worlds be "concrete" like Lewis’s without collapsing into ersatzism?**
     - **This is the most vulnerable point.** Lewis’s worlds are concrete, causally closed, spatiotemporal totalities *independent of our descriptions*. Fictional worlds, however, are *parasitic on texts/mental states*. Your analogy risks conflating:
       - (A) The *concrete world W* that a draft *correctly describes* (which exists independently, per Lewis).
       - (B) The *fictional content itself* (dependent on authorial intention/textual tokens).
     - **To stay Lewisian:** The draft is a *description* of a concrete world *W*. *W* exists independently, but the *fictional character* only exists *in W* (or its counterparts). The author’s mental states/texts are *how we access* the description of *W*, but *W* itself is concrete and mind-independent.
     - **Danger of Ersatzism:** If "fictional worlds" are *constituted* by the text/author’s mind (e.g., "the world where Sherlock lives at 221B Baker Street exists *because* Conan Doyle wrote it"), you’ve smuggled in ersatzism (worlds as abstract representations). Lewis would reject this. 
     - **Salvaging the Analogy:** Insist that **each draft is a *description* of a distinct, pre-existing concrete world.** The author isn’t *creating* the world-by-world’s content; they’re *discovering or selecting which concrete world to describe*. This is metaphysically heavy but coherent. Weakness: It makes fictional characters *contingently non-actual* entities (like Lewis’s "talking donkeys"), not artifacts of creation.

  ### 3. **Interest: Does this illuminate revision’s phenomenology, or is it just jargon?**
     - **It has genuine conceptual payoff:** 
       - **Discovery vs. Invention:** The feeling of "discovering a truer version" maps neatly to Lewis. Worlds (and their inhabitants) exist independently; revision is *selecting the world that best matches the author’s evolving sense of "fit"* (narrative coherence, thematic resonance). The "truer" character isn’t invented; it’s the counterpart in the *selected* world that better satisfies the author’s criteria.
       - **Counterpart Theory’s Value:** It dissolves unanswerable questions like "Did the author *change* Character X?" Instead, it asks: **"Which counterpart (across worlds) best fulfills the narrative role the author is refining?"** This reframes revision as optimizing *counterpart relations* (similarity-in-context) rather than altering an identity.
       - **Loss of Possibility:** Revision feels weighty because *deselecting* a draft-world makes its possibilities *non-actual for the narrative*. The "ghost" of the drowned protagonist *could have been actual* but isn’t (for the published work). Lewis gives ontological grounding to this pathos.
     - **Avoiding Jargon:** This *isn’t* just dressing up familiar practice. It reframes revision as **modal selection guided by counterpart resemblance**, offering a metaphysics for why revision feels like exploring/discovering alternatives rather than arbitrary rewriting.

  ### Recommendations for Strengthening
  1. **Clarify the Ontology of Texts:** Explicitly state that drafts are *descriptions* of concrete worlds, not worlds themselves. The author manipulates *descriptions*, not worlds.
  2. **Embrace the Radical Implication:** Yes, the protagonist who drowns *exists* in their concrete world. Revision doesn’t annihilate them; it deselects their world. Lean into this—it captures the haunting of discarded drafts.
  3. **Refine "Selection":** Specify *how* authors "select." Is it choosing which world to *describe*? Or which counterpart relation best serves the narrative? (The latter is richer.)
  4. **Address the "Unwritten":** Your title implies unwritten drafts as "unactualized" worlds. This works! They’re concrete worlds not (yet) described by any text. This could be a powerful extension.

  ### Verdict
  **Your core analogy holds together philosophically if you rigorously maintain:** 
  - Drafts describe concrete Lewis-worlds.
  - Authors select *which world to describe* via revision.
  - Characters across drafts are counterparts, not identical.
  - "Actual" shifts indexically with the author’s engaged draft.

  **Where to strengthen:** Tighten the text/world distinction to avoid ersatzism. Emphasize *selection-from-plenitude* as the mechanism of revision. **Abandon?** Only if unwilling to commit to the radical independence of fictional worlds from authors/texts. If you soften this, you lose Lewis and gain little.

  This framework *does* real conceptual work: it replaces vague notions of "artistic possibility" with a rigorous ontology of alternatives, grounding the phenomenology of revision in modal metaphysics. It’s more than a metaphor—it’s a rethinking.
