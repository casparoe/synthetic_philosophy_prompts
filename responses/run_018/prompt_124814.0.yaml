prompt: |-
  ok so i just got out of a like three hour argument with my roommate about democratic boundaries and im moderating a colloquium q&a next week with this philosopher who defends what he calls the "recursive constituency" view. the basic idea is that the demos is just whoever gets bound by collective decisions, but he tacks on two weird twists: first, that future generations who arent born yet recieve proxy representation through environmental trustees, but only for constitutional amendments not regular legislation, and second, that algorithmic auditors with actual budget-veto power should count as partial members with weighted votes, not just tools. i need 8 to 10 interview questions that go past the standard "all affected vs all subjected" talking points. specifically i want at least one that presses the trustee-proxy setup — like if the trustee can be fired by the current legislature that has no stake in the unborn's welfare, does the proxy mean anything? — and at least one that asks whether giving an algorithm weighted membership is just anthropomorphizing a decision procedure we built. for each question include a follow-up keyed to the answer he's most likely to give (probably something about functional embededness or about avoiding speciesism). and dont just list neutral options — i want you to take a real stand. do you think his view collapses back into plain all-subjected once you strip away the gimmicks? say yes or no, explain why, and then write the questions assuming you're right and he's wrong. be specific, dont hedge.
