prompt: |-
  Hi — bit of an odd ask. I'm on a small ad-hoc committee that has to spend a one-off pot of money (about six person-years of postdoc time plus two workshops, spread over three years) on conceptual work around the therapy/enhancement distinction, and I've been landed with drafting the call for proposals. The money comes with strings: the publicly funded health system behind it is in the middle of rewriting its coverage rule, and the working draft says, roughly, that the system pays for interventions that restore or maintain normal functioning and doesn't pay for anything that goes beyond that. So the agenda isn't really "think interesting thoughts about human enhancement" — it's "which conceptual questions would most change how that sentence gets written, if somebody actually answered them". One person on the committee, a health economist, says definately that the whole distinction is just a leaky proxy for cost-effectiveness and we should scrap it and fund QALY work instead. I half agree and half don't, so feel free to take that head on.

  These are the questions that keep coming up in our meetings, more or less as I'd put them — I don't think the list is right and I suspect at least one item on it is a dud. (1) The shifting-baseline problem: on any account of "normal functioning" with statistical content, once an intervention is taken by nearly everyone the untreated become the statistical outliers, so the distinction looks like it inverts or collapses under wide uptake. Is that a genuine problem for a coverage rule, or a curiosity? (2) The flattening problem: a lot of plausible near-future interventions don't raise your peak capacity at all, they slow decline or compress variance — holding muscle mass into your eighties, cutting required sleep with no performance cost, smoothing out the attentional dips across a working day. Is keeping a trajectory steady therapy or enhancement, and does the answer depend on whether the comparison runs within one life over time or across a population at a time? (3) The positional problem: for traits whose value is partly competitive, one person's gain is another person's loss, and enhancement starts looking like an arms race rather than a benefit. Should a public rule track that, and is the externality doing all the real work here? (4) The means-sensitivity problem: the same functional outcome reached by a pill, by schooling, by designing buildings differently, or by embryo selection. Does the verdict change with the route, and should the rule be means-sensitive at all? (5) The many-users problem: clinicians, insurers, regulators, parents and disability-rights campaigners all invoke "therapy versus enhancement" for quite different purposes, and maybe there's no single distinction underneath, or maybe some of those uses are just confused.

  What I want back is an agenda, not a survey. Pick the four or five questions you think should get the money, in order, and defend the ordering: for each, what it's upstream of (which other questions its answer would settle, reframe, or render pointless), how tractable it is in roughly three years with philosophical tools alone versus needing empirical input we can't fund, how much it would genuinely shift the wording of a coverage rule as opposed to just being interesting, and what kind of result over the next couple of years would move it up or down the list. I'd also like you to name the one or two questions on my list — or ones I haven't thought of — that you think are overrated: the ones that sound deep but dissolve under pressure, or that wouldn't change anyone's mind about the rule. And say why. No literature review, no reading list, no citations please; I've read the survey articles and I can find papers myself, I want your own reasoning. In British English, and under about 1200 words if you can manage it.
reasoning: |-
  Okay, the user needs help drafting a call for proposals for a grant focused on the therapy/enhancement distinction. They're part of a committee with a specific budget and constraints. The key is that the funded research should directly influence how their health system's coverage rule is written, which currently bases coverage on restoring or maintaining "normal functioning." The user provided a list of five potential questions but suspects some might not be the best use of resources. They want me to prioritize four or five questions, justify the order, and identify any overrated ones.

  First, I need to understand the core requirement: the research must have a tangible impact on policy wording. The health economist on the committee argues the distinction is just a proxy for cost-effectiveness and suggests focusing on QALYs instead. The user is conflicted about this, so addressing that tension is important. The questions they listed touch on shifting baselines, flattening trajectories, positional goods, means sensitivity, and the many-users problem.

  Starting with the shifting-baseline problem. If an enhancement becomes widespread, the untreated become outliers, potentially flipping the therapy label. This directly challenges the "normal functioning" definition in the policy. Answering this could prevent future loopholes or unintended coverage expansions. It's tractable with philosophical analysis and could significantly alter the rule's wording by forcing a non-statistical definition of normalcy.

  Next, the flattening problem. Interventions that maintain function without raising peaks, like sustaining muscle mass in old age. This questions whether stability is therapy or enhancement. It's crucial because such interventions are common and could strain the system if misclassified. Philosophical methods can handle this by analyzing temporal vs. cross-sectional comparisons, and it directly affects coverage decisions for aging populations.

  The positional problem deals with competitive traits, like cognitive enhancers in education. If one person's gain harms others, should the system cover it? This has policy implications for public funding of enhancements with externalities. While it needs some empirical input, the core is conceptual. Addressing this could lead to explicit clauses excluding positional goods, impacting the rule's scope.

  The means-sensitivity problem asks if the method (pill vs. education) affects the therapy/enhancement label. This could streamline the rule by making it means-insensitive, reducing administrative burden. It's highly tractable philosophically and practical for policymakers, directly influencing how interventions are evaluated regardless of delivery mechanism.

  The many-users problem, while interesting, might be overrated. Different groups use the distinction for various purposes, but the coverage rule only needs a consistent operational definition. This question could lead to semantic debates without clarifying policy, making it less impactful. It's better addressed peripherally in other analyses.

  I should also consider if any questions are missing. The health economist's point about cost-effectiveness as a proxy is critical. A direct question on whether the distinction is just a proxy for cost-effectiveness should be included. If proven, it could simplify the entire rule to focus on cost per QALY, making the therapy/enhancement distinction obsolete. This is high-risk but high-reward, potentially reshaping the entire approach.

  Prioritizing the questions: The shifting baseline is top because it threatens the foundational definition. Then, means-sensitivity for its practical impact on policy wording. Next, the flattening problem for emerging interventions. Fourth, the cost-effectiveness proxy question due to its transformative potential. The positional problem is fifth, as it deals with specific cases rather than foundational issues.

  The many-users problem is overrated here. It's more about stakeholder perspectives than policy mechanics. Similarly, while the positional problem is important, its niche nature places it lower. The key is ensuring each selected question directly influences how "normal functioning" is defined and applied in coverage rules, avoiding theoretical tangents.
answer: |-
  Here’s a prioritised agenda targeting your coverage rule’s core tensions, with rationale based on policy impact, tractability, and upstream influence:

  **Priority Order (Top 4):**

  1.  **The Shifting-Baseline Problem**
      *   **Why Top?** Directly attacks the foundational term **"normal functioning"**. If statistical normality self-destructs under uptake, the rule becomes incoherent long-term. Answering this *forces* a choice: abandon statistical definitions for a normative/functional baseline (e.g., species-typical function, capability thresholds) or explicitly design the rule as time-limited/context-dependent. This is **upstream of nearly everything**. Settling it dictates how "normal" is operationalised, impacting debates on flattening (Is stability "normal"?), positional goods (Is competitive advantage "normal"?), and even means-sensitivity (Does "normal" depend on method?). Highly tractable philosophically (conceptual analysis, counterfactuals). High policy impact: the rule *must* define "normal", and this flaw could invalidate its logic decades hence. **Moves up** if uptake of specific interventions (e.g., widespread gene editing) accelerates; **down** if defined normatively from the outset.
  2.  **The Means-Sensitivity Problem**
      *   **Why Second?** Challenges the rule's **operational fairness and scope**. If "therapy" depends on *how* an outcome is achieved (pill vs. school), the rule becomes arbitrary and administratively nightmarish. A clear verdict (should it be means-insensitive?) drastically simplifies or complicates drafting. This is **upstream of fairness challenges and rule complexity**. If means don't matter, the rule focuses purely on *functional outcome* relative to normalcy (tying back to #1). If means *do* matter, the rule needs labyrinthine clauses (e.g., "only if pharmacological", inviting loopholes). Highly tractable (conceptual ethics, comparing cases). High policy impact: determines if the rule covers *function* or *methods*. **Moves up** if novel enhancement methods (e.g., direct brain implants) emerge fast; **down** if consensus emerges that only medical means are relevant.
  3.  **The Flattening Problem**
      *   **Why Third?** Addresses the **most plausible near-future interventions** your system will face (slowing decline, reducing variance). It probes whether "maintain" covers *stabilising above expected decline* or *merely preventing deviation below a static baseline*. **Upstream of coverage for age-related "maintenance" interventions and variance-reduction tech**. Answering it clarifies if "normal functioning" is defined **longitudinally** (trajectory within a life) or **cross-sectionally** (population snapshot). This shifts the rule's wording: does it cover "keeping you at your 30yo baseline" or "keeping you within the 70yo population norm"? Philosophically tractable (analysing concepts of aging, decline, "maintenance"). Moderate policy impact: crucial for specific classes of future claims (e.g., anti-decline drugs). **Moves up** if biomarkers for aging/dips become standard; **down** if ruled out as "enhancement" by default.
  4.  **The Cost-Effectiveness Proxy Question** (Your Implicit Item / Economist's Challenge)
      *   **Why Fourth?** This isn't on your list but is **fundamental and transformative**. *Is the therapy/enhancement distinction just a crude, leaky proxy for cost-effectiveness (CEA) or societal value?* **Upstream of the ENTIRE distinction.** If "yes", the rule should be scrapped for "We fund cost-effective interventions meeting need X" (likely QALY-based). If "no", the rule needs robust conceptual armour against CEA encroachment. High risk/reward. Philosophically tractable (analysing concepts of health, benefit, and whether CEA captures the moral distinctions intended by therapy/enhancement). **Massive policy impact**: could completely rewrite the rule's premise. **Moves up** if evidence shows the distinction poorly correlates with CEA outcomes or societal values in key cases; **down** if a strong non-CEA justification for the distinction emerges clearly from work on #1-#3.

  **Overrated Questions (Set Aside for Core Funding):**

  1.  **The Positional Problem:**
      *   **Why Overrated?** While conceptually interesting, it’s **too niche and downstream** for *your* rule's core wording. Public systems already struggle to fund positional goods (e.g., elite education) – the inherent inefficiency and unfairness are well-recognised. The rule likely already implies "non-positional" benefits by focusing on individual "functioning". A philosophical answer (yes, track externalities?) won't drastically change the rule; it might add a clause like "excluding interventions where primary benefit is competitive advantage," but this is a policy *application* of the core distinction defined by #1 and #3, not a foundation-shaker. The externality argument is powerful but doesn’t *dissolve* the core distinction, just flags a reason not to publicly fund certain enhancements *even if* they meet other criteria.
  2.  **The Many-Users Problem:**
      *   **Why Overrated?** Sounds deep but **dissolves under pressure** for your task. You don't need *one universal metaphysical distinction* valid for all purposes (clinicians, parents, insurers). You need **one operational definition for this specific coverage rule**. Focusing on the conceptual coherence and practical applicability *within the rule's context* (#1, #2, #3) is what matters. Investigating diverse usages is sociology, not core conceptual work for *drafting*. It won't change the rule's wording – it might just advise clear definition within it.

  **Why This Order & Approach:**

  *   **Foundation First:** #1 (Baseline) defines the core term "normal functioning". Without this, the rule is built on sand.
  *   **Operational Clarity Next:** #2 (Means) determines *what* is evaluated (outcome vs. method), directly impacting rule structure and fairness.
  *   **High-Probability Applications:** #3 (Flattening) tackles interventions your system will *actually face soonest*, refining "maintain".
  *   **Existential Challenge:** #4 (CEA Proxy) confronts the biggest threat to the whole distinction-based approach. It's lower *only* because answering #1-#3 might strengthen the case *for* the distinction against the CEA critique. If #4 wins early, it redefines the whole project.
  *   **Avoiding Rabbit Holes:** Sidestepping #5 (Many-Users) avoids semantic debates irrelevant to policy drafting, and #4 (Positional) addresses a specific funding implication rather than the distinction's core validity for this rule.
  *   **Policy Focus:** Each chosen question forces concrete wording changes: defining "normal" non-statistically (#1), specifying means-sensitivity (#2), clarifying "maintain"/trajectories (#3), or abandoning the distinction for CEA (#4).
  *   **Tractability:** All prioritised questions rely primarily on conceptual analysis, case studies, and normative reasoning achievable within 3 years. Minimal costly empirics needed beyond basic understanding of emerging tech trends.

  This agenda maximises the chance of producing actionable insights that directly confront the ambiguities and challenges most likely to destabilise or clarify your specific coverage rule draft within the timeframe. Focus the call on these four, demanding proposals that explicitly trace the path from conceptual work to concrete wording changes or foundational challenges to the rule's logic.
