prompt: |-
  I'm a senior editor for a technical standards board and we publish huge regulatory docs made up of like five hundred individual clauses, each vetted seperately by a different working group. Right now my team has no real framework for deciding clause-by-clause whether we "accept" it into the standard, reject it, or punt it upstairs — and the problem is straight out of the preface paradox plus the lottery problem. Any single clause looks 99% likely correct, but with hundreds of them we know some errors will definitely get in. I want you to turn that philosophical mess into an actual decision proceedure my reviewers can run in about twenty minutes per clause, with ordered questions, what counts as a sufficient answer, where it stops with a hard no, and where it has to hand off to a human because it's a values call not a probability call. Don't flatten out the distinction between "accepting for practical reasoning" and "believing it's true" — that has to survive in the steps somehow. I also want you to build in a kind of document-level "error budget" idea, where acceptance of one clause affects the risk pool for the rest, since that's the only way the lottery logic makes operational sense here.

  Apply this to three cases: a routine typography/formatting clause; a pedestrian-bridge structural-load clause where expert confidence is 99.2% but being wrong kills people; and a climate-adaptation clause that an industry group is pushing hard for, where the historical base-rate for similar clauses being wrong is high. One of these needs to come out in a way my team genuinely won't like — probably forcing rejection or an expensive delay despite the high confidence number. Then be explicit about what the procedure can't do: for instance, who sets the global error cap, whether we're ever required to reopen accepted clauses, or how to weigh political pressure against the budget.

  Please lead with the bottom line in your first sentence — the single governing rule that replaces a flat belief-threshold — then lay out the reasoning, the checklist in order, the three worked cases (including the unwelcome one), and the hard limits, all with no preamble and without restating my question. Keep it practical, but don't pretend the philosophy disappears.
reasoning: |-
  We are going to use an error budget approach: The entire document has a fixed maximum acceptable probability of containing at least one error (say, 5%), and each clause accepted consumes a portion of this budget based on its assessed risk.

  **Governing Rule:** Accept a clause if and only if (1) it meets all domain-specific quality thresholds (e.g., expert consensus, evidence base) AND (2) its estimated error probability multiplied by the current risk multiplier (which increases as the budget is consumed) does not exceed the remaining error budget for the document.

  **Reasoning:** 
  - The preface paradox shows that even if each clause is individually highly probable, the conjunction of many such clauses becomes improbable. The lottery paradox shows that we cannot simply set a fixed probability threshold (e.g., 99%) because then we would have to reject every clause (since each has a non-zero chance of error) and the standard would never be published.
  - Therefore, we treat the standard as a whole having an error budget (e.g., 5% chance of at least one error). This budget is a shared resource that each clause consumes when accepted. The more budget we have spent, the more stringent we must be on the remaining clauses.

  **Checklist Procedure (per clause):**
  1. **Domain-Specific Quality Gate:** Does the clause meet all non-negotiable quality criteria? (e.g., formatting standards, required expert approvals, evidence completeness)
     - *If NO: Reject immediately.*
     - *If YES: Proceed to step 2.*

  2. **Assess Base Error Probability (p):** Assign a base error probability for this clause (e.g., 0.8% for the bridge load clause, 1% for the climate clause, 0.1% for a formatting clause). This is based on:
     - Historical error rates for similar clauses
     - Expert confidence (e.g., 99.2% confidence implies p=0.8%)
     - Complexity and novelty
     - *Note: This is not a belief in the clause being false, but a risk assessment for the purpose of budget allocation.*

  3. **Calculate Current Risk Multiplier (M):** 
     - Let B_remaining = initial total error budget (e.g., 5%) minus the sum of the error probabilities of all previously accepted clauses (using their base p).
     - M = (initial budget) / B_remaining. (As the budget is consumed, M increases, making each new clause more "expensive".)

  4. **Adjusted Risk Cost:** Compute adjusted risk = p * M.

  5. **Budget Check:** Is adjusted risk ≤ B_remaining?
     - *If YES: Accept the clause. Subtract p (the base error probability) from the remaining budget (B_remaining).*
     - *If NO: Reject or escalate (if the clause is critical and rejection is too costly, escalate to a human committee for a values-based decision on whether to override the budget or reallocate resources).*

  **Worked Examples:**

  1. **Routine Formatting Clause:**
     - Quality Gate: Pass (trivial).
     - Base p: Very low, say 0.1% (1 in 1000 chance of an error that matters).
     - Current M: Assume early in the process, B_remaining is nearly the full 5%, so M ≈ 1.
     - Adjusted risk = 0.1% * 1 = 0.1%.
     - Budget Check: 0.1% ≤ 5% → Accept. Subtract 0.1% from budget.

  2. **Bridge Structural-Load Clause (high stakes, expert confidence 99.2%):**
     - Quality Gate: Pass (experts signed off).
     - Base p: 0.8% (since 100% - 99.2% = 0.8%).
     - Current M: Assume we are halfway through the document and have consumed 2.5% of the 5% budget. Then B_remaining = 2.5%, so M = 5% / 2.5% = 2.
     - Adjusted risk = 0.8% * 2 = 1.6%.
     - Budget Check: 1.6% ≤ 2.5% → Accept. Subtract 0.8% from budget (now B_remaining = 1.7%).

  3. **Climate-Adaptation Clause (industry-pushed, high historical error):**
     - Quality Gate: Pass (it meets minimum evidence requirements, but note: historical base error rate for similar clauses is 15%).
     - Base p: We set at 15% (based on historical data, not expert confidence which might be biased).
     - Current M: Assume we are late in the process and the remaining budget is only 0.5%. Then M = 5% / 0.5% = 10.
     - Adjusted risk = 15% * 10 = 150%.
     - Budget Check: 150% > 0.5% → Reject (or escalate).

  **The Unwelcome Outcome:** The climate clause gets rejected despite passing the quality gate because the combination of high base risk and late-stage high multiplier blows the budget. This forces either a costly delay (to rework and reduce p) or escalation.

  **What the Procedure Can't Do:**
  - **Who Sets the Global Error Cap?** This must be set by senior management/board, considering the standard's criticality (e.g., 1% for medical devices, 10% for non-critical). It's a policy/value decision.
  - **Reopening Accepted Clauses?** The procedure does not require reopening unless new evidence emerges that changes the base p of an accepted clause. However, if the budget is exhausted early, the team might revisit previously accepted low-risk clauses to see if they can be improved (thus freeing up budget by reducing their p).
  - **Political Pressure:** The procedure explicitly ignores political pressure in the budget calculation. If a clause is rejected due to budget, the only override is a human escalation committee that must explicitly decide to either (a) increase the total budget (thus accepting higher overall risk) or (b) remove other accepted clauses to free up budget.
  - **Limitations:** 
    - The base p estimates are subjective and require calibration (use historical data and expert input).
    - The procedure assumes independence of errors (which may not hold; if clauses are correlated, the budget is effectively smaller).
    - It does not account for varying severity of errors (a fatal bridge error is worse than a typo). For this, you might weight the base p by severity, but that requires a separate severity scale.

  **Final Note:** This procedure separates "accepting for practical reasoning" (we act as if the clause is true to move forward) from "believing it's true" (we know the base p reflects our doubt). The budget forces us to account for aggregate doubt.
answer: |-
  **Governing Rule:** Accept a clause only if (a) it clears all domain-specific quality checks, and (b) its estimated error probability, scaled by the document’s current risk multiplier, fits within the remaining error budget—otherwise reject or escalate.

  ### **Checklist Procedure (Per Clause, 20-Minute Limit)**  
  **Run in order; stop at first terminal answer (reject/escalate/accept):**  

  1. **QUALITY GATE: Does it meet non-negotiable standards?**  
     - *Check:* Formatting, legal compliance, expert sign-off, evidence completeness (per clause type).  
     - *Sufficient answer:* Unanimous WG approval + no unresolved technical objections.  
     - *Stop if:* "No" → **REJECT** (e.g., missing signatures, incomplete data).  

  2. **ASSESS BASE ERROR PROBABILITY (p):**  
     - *Method:* Assign p (0 < p < 1) using:  
       - Historical error rates for similar clauses (e.g., climate clauses: 15%).  
       - Expert confidence (e.g., 99.2% confidence → p = 0.008).  
       - Novelty/ambiguity penalties (e.g., +0.03 for untested assumptions).  
     - *Sufficient answer:* Quantitative p with justification (e.g., "p=0.15 based on Clause 2021-7 error rate").  

  3. **CALCULATE CURRENT RISK MULTIPLIER (M):**  
     - *Formula:* **M = Total Error Budget / Remaining Budget**  
       - *Total Error Budget (TEB):* Fixed cap (e.g., 5% max chance ≥1 error in doc).  
       - *Remaining Budget (RB):* TEB minus sum of p for all accepted clauses.  
     - *Example:* TEB = 0.05; 300 clauses accepted (sum p = 0.03); RB = 0.02 → **M = 0.05 / 0.02 = 2.5**.  

  4. **ADJUSTED RISK COST: Compute p × M.**  
     - *Purpose:* Scales p to reflect budget scarcity (late-stage clauses cost more).  

  5. **BUDGET CHECK: Is p × M ≤ RB?**  
     - *Yes* → **ACCEPT**; subtract p from RB (e.g., RB new = RB − p).  
     - *No* → **REJECT** (if p × M > RB) or **ESCALATE** (if values/policy override needed).  

  ---

  ### **Worked Cases**  
  **Assumptions:** TEB = 5% (0.05), 100 clauses accepted so far (sum p = 0.01), RB = 0.04, M = 0.05/0.04 = 1.25.  

  1. **Routine Formatting Clause**  
     - (1) Quality Gate: Pass (no issues).  
     - (2) p: 0.001 (low risk; historical typos rarely affect meaning).  
     - (4) p × M = 0.001 × 1.25 = 0.00125.  
     - (5) 0.00125 ≤ 0.04? **Yes → ACCEPT.**  
     - *Budget update:* RB = 0.04 − 0.001 = 0.039.  

  2. **Bridge Structural-Load Clause (99.2% confidence)**  
     - (1) Quality Gate: Pass (experts approve).  
     - (2) p: 0.008 (100% − 99.2% = 0.8% error chance).  
     - (4) p × M = 0.008 × 1.25 = 0.01.  
     - (5) 0.01 ≤ 0.04? **Yes → ACCEPT.**  
     - *Budget update:* RB = 0.04 − 0.008 = 0.032.  

  3. **Climate-Adaptation Clause (Industry-pushed, high-risk)**  
     - (1) Quality Gate: Pass (minimally meets evidence standards).  
     - (2) p: 0.15 (historical base rate for similar clauses; industry bias risk).  
     - (4) p × M = 0.15 × 1.25 = 0.1875.  
     - (5) 0.1875 ≤ 0.04? **No → REJECT** (blows budget; RB only 0.04).  
     - ***Unwelcome Outcome:*** Despite passing quality checks, high p and budget scarcity force rejection. To proceed: Escalate (if override) or rework to lower p (e.g., independent review).  

  ---

  ### **What the Procedure Can’t Do**  
  - **Set Global Error Cap (TEB):** Must be decided by governance (e.g., board/legal) based on document criticality. Not adjustable mid-process.  
  - **Reopen Accepted Clauses:** Accepted clauses stay closed unless new evidence emerges (triggers p reassessment and budget rebalance).  
  - **Handle Values/Politics:** Escalation required for:  
    - Overriding budget (e.g., "This clause is worth burning 10% TEB").  
    - External pressure (industry lobbies); the procedure ignores non-probabilistic factors.  
  - **Severity Weighting:** Does not distinguish error types (e.g., fatal vs. cosmetic). Mitigation: Set higher p for high-stakes clauses (e.g., bridge p includes lethality factor).  
  - **Correlated Errors:** Assumes independence; correlated risks (e.g., multiple clauses relying on same flawed study) may exhaust budget faster.  

  **Philosophical Anchor:** Accepting a clause allocates risk budget ("practical reasoning"), distinct from believing it true—which is why high-p clauses (like climate) are rejected despite WG confidence. The budget forces aggregate doubt management.
