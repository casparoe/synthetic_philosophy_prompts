  Assembly protocols: democratic procedures initially work with common knowledge. But as fear and dominance desires grow, Ralph's leadership weakens. Jack's tribe uses rituals (hunting dances, chants) which might be conventions based on new common knowledge within his group. However, these are enforced through dominance, not mutual preference.

