  First, I need to recall Lewis's exact conditions: conventions are solutions to coordination problems, arbitrary, sustained by mutual expectations and preferences to conform given others do. The student wants to apply this strictly to the conch, fire rules, and speaking protocols. They also want to address the criticism about arbitrariness and common knowledge.

  Looking at the conch: it's used for speaking turns. Initially, it works as a coordination device. But is it arbitrary? The conch is the loudest object, so maybe it's a focal point rather than arbitrary. Lewis allows natural salience, but critics might argue that challenges arbitrariness. Also, common knowledge breaks when Jack challenges the rule, leading to fragmentation. Piggy's insistence shows reliance on mutual expectations, while Jack's rejection breaks the convention.

