answer: |-
  Here is a rigorous analysis of *Lord of the Flies* through the contested lens of David Lewis's convention theory, respecting both the novel's complexity and the philosophical debates. I'll clearly distinguish settled aspects of Lewis's theory from contested interpretations, and justify claims with textual evidence.

  **Core Lewisian Framework (Settled Aspects):**
  1.  **Coordination Problem:** A situation where individuals have a common interest but multiple possible equilibria (stable outcomes where no one benefits by unilaterally changing their action). Coordination is needed to achieve *any* mutually beneficial outcome.
  2.  **Arbitrariness:** The specific solution (convention) is arbitrary in the sense that another regularity *could* have solved the problem just as well (e.g., driving on the left vs. right).
  3.  **Mutual Expectations & Conditional Preference:** The convention persists because individuals:
      *   Expect others to conform.
      *   Prefer to conform *themselves* only *if* others do (conditional preference).
      *   This creates a system of mutual reinforcement.
  4.  **Common Knowledge (Lewis's Strong View):** Everyone knows the regularity, everyone knows that everyone knows, everyone knows that everyone knows that everyone knows, and so on *ad infinitum*. This is crucial for the stability of expectations.

  **Contested Philosophical Aspects:**
  *   **Strict Arbitrariness:** Critics (e.g., Sugden, Binmore) argue Lewis overstates arbitrariness. Many norms arise from "focal points" – naturally salient solutions that aren't strictly arbitrary (e.g., meeting at the only clock tower). Is salience compatible with arbitrariness?
  *   **Common Knowledge Requirement:** Critics argue this is unrealistically demanding. Can conventions emerge and stabilize through repeated interaction, precedent, or salience *without* fully recursive common knowledge? Is mutual belief (everyone believes it, believes others believe it) sufficient?
  *   **Coordination vs. Cooperation:** Lewis focuses on pure coordination problems (common interest). Critics note many social norms involve mixed motives, conflict (Prisoner's Dilemmas), or require overcoming individual temptation to defect (cooperation problems), which Lewis's model handles less well.

  **Analysis of Key Norms in *Lord of the Flies*:**

  1.  **The Conch Shell (Speaking Rights):**
      *   **Initial Coordination Problem:** Preventing chaotic shouting matches during assemblies; ensuring everyone gets a chance to be heard.
      *   **Arbitrariness (Contested):** The conch is *highly salient* – it's the loudest, most distinctive object available for summoning. While *another* object *could* have been chosen (arguably satisfying Lewis), its natural salience makes it a powerful focal point. Critics of strict arbitrariness would argue this salience is key, not incidental. Its "arbitrariness" is weak.
      *   **Mutual Expectations & Conditional Preference:** Initially strong. Boys expect the holder to speak uninterrupted ("I got the conch!" is a refrain). They prefer to listen *if* others do, valuing order. Piggy embodies this: "We can use this to call the others. Have a meeting. They’ll come when they hear us."
      *   **Common Knowledge:** Initially robust. Ralph establishes the rule clearly: "I’ll give the conch to the next person to speak. He can hold it when he’s speaking... And he won’t be interrupted." This is publicly declared and accepted.
      *   **Fracture & Failure:** The convention collapses precisely when Lewis's conditions break down.
          *   **Loss of Common Knowledge:** Jack explicitly challenges the rule: "Conch! Conch! We don’t need the conch anymore. We know who ought to say things." This shatters the recursive knowledge – Jack no longer knows (or cares) that others know he knows the rule is expected. His followers follow suit.
          *   **Erosion of Conditional Preference:** Jack and his group cease to *prefer* conforming, even if others do. They value dominance and impulse over orderly discourse. Piggy's desperate pleas ("I got the conch!") highlight the breakdown of mutual expectation – he expects conformity, but others no longer do.
          *   **Symbolic Destruction:** The shattering of the conch by the boulder that kills Piggy is the physical manifestation of the convention's complete annihilation. It's no longer a coordination device but a weapon.

  2.  **The Signal Fire (Rescue Coordination):**
      *   **Initial Coordination Problem:** Achieving the common goal of rescue requires a visible, sustained signal. Agreeing *where* and *that* a fire is necessary is the coordination aspect.
      *   **Arbitrariness:** The mountaintop location is somewhat arbitrary (though salient for visibility). The *need* for *a* fire isn't arbitrary, but the specific implementation (constant vs. intermittent, location) involves coordination choices.
      *   **Mutual Expectations & Conditional Preference:** Initially, there's agreement on the goal (rescue) and the method (fire). Ralph expects the hunters to contribute to fire-tending; the hunters initially expect others to maintain it while they hunt. Conditional preference exists: each prefers to contribute *if* others do, as rescue benefits all.
      *   **The Cooperation Problem (Where Lewis's Model Strains):** Maintaining the fire is not *just* coordination; it's a **cooperation problem** requiring effort (collecting wood) where individuals might be tempted to free-ride (hunt instead). Lewis's model focuses on *choosing* an equilibrium, not necessarily *maintaining* one with ongoing costs against temptation.
      *   **Fracture & Failure:**
          *   **Shifting Preferences & Loss of Common Interest:** Jack's priority shifts from rescue (common interest) to hunting/meat (factional interest). His conditional preference changes: he *prefers* to hunt *even if* others maintain the fire, because hunting brings immediate power and gratification. The common interest fractures.
          *   **Broken Expectations:** Ralph expects fire maintenance; Jack's hunters expect to hunt without consequence. The mutual expectation necessary for the fire convention collapses.
          *   **Lack of Enforcement:** Lewisian conventions rely on mutual reinforcement through conditional preference. When Jack's preference changes and his faction follows, there's no mechanism (like adult authority) to enforce the original convention. The fire dies not just from neglect, but from a fundamental shift in perceived interests and the collapse of the conditional preference structure.

  3.  **Assembly Protocols (Democratic Procedure):**
      *   **Initial Coordination Problem:** Establishing a fair method for group decision-making and leadership selection.
      *   **Arbitrariness:** The specific rules (hand-raising, conch for speaking, voting) are culturally specific (British schoolboy democracy) but *could* be replaced by other fair procedures (e.g., consensus, council of elders). They are arbitrary within the context of needing *some* orderly process.
      *   **Mutual Expectations & Conditional Preference:** Initially strong. Boys expect votes to be counted fairly, the chief (Ralph) to lead meetings, and rules to be followed. They prefer this orderly process *if* others participate, valuing fairness and predictability.
      *   **Common Knowledge:** Publicly established by Ralph: "We’ll have rules!... Lots of rules! Then when anyone breaks ’em–" (though enforcement proves impossible).
      *   **Fracture & Evolution:**
          *   **Erosion by Fear and Dominance:** The democratic norm is undermined not primarily by a *failed coordination attempt*, but by the rise of fear (the beast) and Jack's desire for autocratic dominance. Jack doesn't propose a *better coordination solution*; he rejects the need for coordination/process altogether in favor of impulsive action and strength. His hunting rituals offer a different kind of coordination – focused on a shared, visceral goal (the kill) – but one enforced through charisma, fear, and violence, not mutual conditional preference among equals.
          *   **New "Norms":** Jack's tribe establishes rituals (the chant, "Kill the pig! Cut her throat! Spill her blood!", the offering to the beast, face paint). These *resemble* conventions: they are regularities solving coordination around group identity and cathartic violence. However, they rely heavily on **salience** (the visceral act of the hunt, the paint as a symbol of transformation) and **coercion/fear** (of Jack, of the beast, of exclusion) rather than the delicate balance of mutual expectations and conditional preference among free agents that defines a Lewisian convention. Participation is less "I prefer this *if* you do" and more "I fear the consequences *if* I don't."

  **Golding's Dramatization of Norm Evolution & Universality:**
  *   **From Coordination to Dominance:** Golding meticulously shows the *fragility* of complex, cooperation-dependent conventions (democracy, rescue focus) in the absence of external authority and under stress. They devolve not into simpler coordination norms, but into norms rooted in primal impulses: fear necessitates the beast ritual; desire for power and gratification fuels Jack's autocracy and the hunt's primacy. The "coordination" achieved by Jack's tribe is often the coordination of a mob, driven by shared frenzy, not mutual conditional preference.
  *   **Cultural Specificity vs. Universality:** The initial norms (conch, assemblies) are explicitly British and school-based. Their collapse suggests they are not universal coordination devices but culturally specific ones dependent on an underlying authority structure (teachers, society). However, Golding also implies a universal human capacity to *create* norms – the boys *do* form new regularities (hunting rituals, tribalism). The *content* shifts dramatically (democracy to savagery), but the *impulse to coordinate* behavior through shared practices persists, albeit in a cruder, more coercive form. The novel suggests the universality lies in the human tendency to form groups with rules, but the *stability and justice* of those rules depend heavily on context, leadership, and the suppression of baser instincts – forces Lewis's model doesn't centrally address.

  **Where the Framework Illuminates vs. Where the Novel Resists:**
  *   **Illumination:**
      *   **Piggy vs. Jack:** Piggy is the avatar of Lewisian convention. He clings to the rules ("What are we? Humans? Or animals? Or savages? What's grownups going to think?") because he understands their logic – they solve coordination problems (order, rescue) and rely on mutual expectation. Jack represents the rejection: he sees rules as constraints on his desire for dominance and immediate gratification, not as solutions to shared problems. His success highlights the vulnerability of conventions when conditional preferences shift towards non-cooperative equilibria.
      *   **The Precise Moment of Breakdown:** The framework helps pinpoint *why* the conch rule fails – it's not just "savagery," but the specific shattering of common knowledge (Jack's declaration) and the shift in conditional preference (Jack no longer prefers order even if others conform).
  *   **Resistance:**
      *   **Drivers of Behavior:** Much of the boys' behavior, especially post-fracture, is driven by factors outside Lewis's model: primal fear (the beast), the thrill of violence and dominance (Roger's sadism), innate aggression, and the psychological transformation facilitated by the paint ("mask"). These forces *override* coordination logic and mutual expectation. Simon's murder isn't a coordination failure; it's a collective frenzy.
      *   **The Role of Power:** Lewis's model assumes agents of roughly equal power making choices based on preference. Jack's rise is based on charisma, the provision of meat (a tangible good), and the exploitation of fear, creating a power imbalance that *forces* conformity in his tribe, undermining the "conditional preference" basis. Roger's descent into sadism operates outside any coordination logic.

  **Lord of the Flies' Contribution to Philosophical Debates:**
  The novel offers a powerful literary thought experiment challenging the *robustness* and *sufficiency* of Lewisian conventions as a model for social order:
  1.  **Stress-Testing Conditions:** It vividly illustrates how easily the core conditions – common knowledge, shared common interest, and mutual conditional preference – can fracture under pressure (fear, scarcity, desire for dominance), leading to convention collapse. It suggests these conditions are fragile.
  2.  **Beyond Coordination:** It highlights the critical role of factors Lewis downplays:
      *   **Emotion & Irrationality:** Fear, hatred, and bloodlust can completely override coordination logic and mutual expectations.
      *   **Power & Coercion:** Conventions can be replaced by norms enforced through dominance and fear, which lack the voluntary, preference-based element central to Lewis.
      *   **The Cooperation/Enforcement Problem:** Maintaining beneficial conventions often requires overcoming individual temptation (free-riding on the fire) or preventing power grabs, which may necessitate external enforcement mechanisms absent on the island.
  3.  **The Primacy of Context:** It suggests that the *success* of Lewisian conventions depends heavily on a stable background context (like adult authority/implicit threat of punishment, or strong shared culture) that maintains common interest and deters defection. Remove that context, and baser motivations can hijack the norm-formation impulse.
  4.  **Salience vs. Strict Arbitrariness:** The conch's effectiveness *because* of its salience supports critics who argue focal points are fundamental, not just a subset of arbitrariness.

  In conclusion, applying Lewis's contested framework rigorously reveals that the boys' initial norms *begin* as plausible Lewisian conventions solving clear coordination problems. However, Golding's novel meticulously dramatizes their vulnerability. The collapse occurs precisely as Lewis's conditions fracture: common knowledge is shattered, common interest diverges, and conditional preferences shift towards non-cooperative actions driven by fear and the desire for dominance. The novel ultimately suggests that while humans possess a universal capacity to create rules for coordination, the *stability and benevolence* of those rules are fragile, easily overwhelmed by darker human impulses that Lewis's elegant model of mutual expectation cannot contain. *Lord of the Flies* thus serves as a potent critique of purely rationalist models of normativity, emphasizing the indispensable roles of emotion, power, and external enforcement in sustaining social order – elements that formal coordination arguments alone might miss.
