  Where the framework illuminates: Piggy represents the belief in conventions, Jack the rejection. The breaking of the conch symbolizes the collapse of Lewisian conditions. However, the novel also shows forces beyond coordination—fear, dominance, irrationality—which Lewis's model might not fully capture. Golding's depiction of the beast and the resulting hysteria isn't about failed coordination but primal fears driving behavior.

  Philosophical contribution: The novel highlights the fragility of conventions under stress, the role of emotions, and how authority underpins norms. It questions whether conventions can hold without enforcement or shared preferences, adding empirical depth to theoretical debates. Critics of Lewis might use this to argue for the importance of power and emotion in norm evolution.

