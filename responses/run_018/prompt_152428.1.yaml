  Below is the decision-tree taxonomy for illusionism about phenomenal consciousness, structured as a sorting quiz. Each node is phrased as a concrete claim or scenario answerable without prior knowledge of taxonomy labels. The tree begins with a root commitment to illusionism, then branches through three axes (nature of illusion, mechanism, scope), and ends with named leaf positions. A branch on predictive processing captures an under-discussed junction. Logically unoccupied combinations are marked, and positions that cannot be separated on these axes are flagged.

  ---

  ### **Root: The Illusionist Commitment**  
  **Question 1:** Do you believe that *phenomenal consciousness as ordinarily conceived* (e.g., as involving intrinsic, immediately given, private qualities like "raw feels" or "what-it-is-likeness") fails to match reality?  
  - **If NO:** Exit (non-illusionist positions).  
  - **If YES:** Proceed to Question 2.  

  ---

  ### **Question 2: Predictive Processing Constraint**  
  **Question:** Does adopting a **predictive-processing/hierarchical-inference architecture** (where the brain generates top-down predictions to explain sensory inputs) force a specific account of the illusion?  
  - **If YES:** The mechanism is almost always **representational misrepresentation** (the brain misrepresents physical states as phenomenal). Proceed to Question 3.  
  - **If NO:** The mechanism is **not determined** by predictive processing. Proceed to Question 3.  

  ---

  ### **Question 3: Nature of the Illusion**  
  **Question:** What exactly is illusory?  
  - **Option A (Total Denial):** There are **no phenomenal properties** whatsoever. What we call "phenomenal consciousness" is a complete fabrication (e.g., there is no "what-it-is-like" quality in any form).  
  - **Option B (Conception Denial):** There are **real properties** underlying experience, but they are *not* as we standardly conceive them (e.g., they lack intrinsicality, privacy, or immediacy).  

  ---

  ### **Branching by Mechanism**  
  *(Skip if you answered YES to Question 2—mechanism is fixed as **representational misrepresentation**)*  
  **Question 4:** How is the illusion generated?  
  - **Option X (Representational Misrepresentation):** The illusion arises because cognitive systems **misrepresent physical/functional states** as having phenomenal properties (e.g., neural states are misread as "qualia").  
  - **Option Y (Conceptual Error):** The illusion stems from **applying an empty/incoherent concept** (e.g., "phenomenal properties" is a meaningless category, like "phlogiston").  
  - **Option Z (Pragmatic Fiction):** The illusion is a **socially useful fiction** sustained for coordination, communication, or evolutionary efficiency (e.g., we "pretend" phenomenal states exist to simplify discourse).  

  ---

  ### **Branching by Scope**  
  **Question 5:** How widespread is the illusion?  
  - **Option G (Global):** The illusion applies to **all aspects** of seemingly phenomenal states (e.g., every feature of experience is misconstrued).  
  - **Option L (Local):** The illusion is **restricted to specific features** (e.g., only the apparent "transparency" of perception, the "unity" of consciousness, or the "ineffability" of qualia).  
    - *(Note: For **Option A (Total Denial)**, scope is **automatically Global**—no need to ask. Local scope is incoherent here since no residual properties exist to be non-illusory.)*  

