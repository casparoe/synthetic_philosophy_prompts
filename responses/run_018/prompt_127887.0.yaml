prompt: |-
  In environmental history, a common move is to treat microbes, climate regimes, and volcanic eruptions as 'historical actors'—entities with agency comparable to human decision-makers. The underlying analogy is theatrical: writing history without them is like staging a play and omitting half the cast, leaving the remaining human characters to carry a plot they do not actually control. This framing is used to argue that human-centered narratives are not merely incomplete but misleading, since these non-human forces direct outcomes; critics reply that it collapses into environmental determinism by attributing intentionality where only causation exists.

  Audit this analogy. First, provide an explicit correspondence table: identify what plays the role of the playwright, the director, the script, the stage, and the audience in the target domain, and state precisely what properties of 'acting' map onto viral spread, climatic shift, or volcanic winter. Second, isolate the disanalogies that matter for the determinism worry—especially intentionality, responsiveness to reasons, and moral accountability—and distinguish them from disanalogies that are harmless. Third, specify what theatrical or personal properties the analogy quietly imports (e.g., purpose, choice, narrative coherence) and whether those imports do the argumentative work. Fourth, evaluate whether the anti-anthropocentric conclusion—that human-centered history is systematically distorted—actually depends on the agency analogy, or whether a leaner vocabulary of 'enabling conditions' or 'structural constraints' could support the same correction without the determinism risk. If the analogy collapses, propose a more precise framing.

  Structure your response in this order:
  1. Correspondence table and mapping (approx. 180 words)
  2. Critical disanalogies (approx. 180 words)
  3. Smuggled premises (approx. 150 words)
  4. Verdict on the conclusion (approx. 150 words)
  5. Alternative framing (approx. 100 words)
