prompt: |-
  I have just finished a rather exhausting argument with a friend about whether visitors are morally bound by local conventions they never explicitly accepted. The concrete situation involves three behaviours he defends without apology: in Tokyo he refuses to queue behind the platform markings, he jaywalks across quiet residential streets despite visible social disapproval, and in cities where gratuities are customary he leaves none for good service, insisting in each case that he never agreed to these local expectations and causes no direct physical harm. I feel there is a genuine moral failure here—he enjoys the orderly benefits produced by others' compliance while free-riding on that very compliance—yet I worry that demanding conformity risks a kind of cultural imperialism, especially since he observes that locals themselves occasionally break minor rules. Before you answer, please adopt the persona of an expert moral philosopher with particular expertise in social and political philosophy, think carefully, and begin by brainstorming the key conceptual distinctions between etiquette, law, and morality, paying special attention to the idea of indexical or presence-dependent obligations that apply specifically to temporary beneficiaries of a cooperative scheme rather than to everyone everywhere. Please advise me on whether my friend's reasoning holds, separating what is philosophically settled from what is genuinely contested, and do not present a disputed view as the consensus. Present your response as exactly five numbered points, each consisting of one or two sentences, with no introduction and no conclusion whatsoever.
reasoning: |-
  Hmm, the user presents a complex moral dilemma about visitors following local conventions, stemming from an argument with a friend. They want me to adopt the persona of an expert moral philosopher specializing in social and political philosophy, focusing on conceptual distinctions and indexical obligations.

  I need to analyze three key behaviors: queueing in Tokyo, jaywalking on quiet streets, and not tipping where customary. The user feels this is free-riding while their friend argues no explicit agreement exists and no direct harm occurs. The challenge is balancing moral duties against cultural imperialism concerns, especially given locals sometimes break rules.

  Brainstorming the core distinctions: Etiquette involves social norms without moral weight unless tied to deeper values; law is codified rules enforced by authority; morality concerns universal principles of right and wrong. The crucial concept here is indexical obligations - duties arising from being physically present in and benefiting from a cooperative scheme, even temporarily.

  For the response structure, I'll follow the strict format: exactly five numbered points, each one or two sentences, no intro/conclusion. Point 1 will establish the conceptual framework. Point 2 addresses queueing as a cooperative scheme with free-riding implications. Point 3 examines jaywalking through harm and social disruption lenses. Point 4 tackles tipping's contested status. Point 5 acknowledges gray areas in rule-breaking consistency.

  Philosophically, I'll clarify that while no explicit consent exists for visitors, benefiting from social goods creates presumptive duties (fair play principle). The friend's "no direct harm" argument fails to account for systemic erosion of norms. Tipping remains genuinely contested due to employer exploitation concerns. I must avoid presenting disputed views as consensus - particularly on whether isolated rule-breaking by locals voids obligations.
answer: |-
  1.  **Conceptual Distinction:** Etiquette governs conventional social interactions, law constitutes formally enforced rules, while morality concerns fundamental obligations derived from justice, harm prevention, or fairness; indexical obligations arise specifically from one's physical presence within and benefit from a cooperative social scheme, distinct from universal duties.
  2.  **Queueing as Cooperative Scheme:** Your friend enjoys the order and efficiency produced by others respecting platform markings; his refusal to queue, while not illegal, arguably constitutes free-riding on this mutually beneficial cooperative practice, violating a fairness-based moral obligation arising from his temporary participation and benefit within that local scheme.
  3.  **Jaywalking & Harm/Disruption:** While jaywalking on quiet streets may cause no immediate physical harm, it deliberately flouts a visible local norm maintaining pedestrian order and predictability; this disregard for collective expectations, causing social friction and undermining a shared convention, constitutes a distinct moral failing through disrespect and potential erosion of the norm.
  4.  **Tipping's Contested Nature:** Gratuity norms are philosophically contested: critics argue they mask employer exploitation, while proponents see them as fair compensation within specific service economies; your friend's refusal, while consistent with his principle, ignores his role as a temporary beneficiary of the local wage structure and service quality enabled by that norm, creating a weaker but still plausible fairness claim than queueing.
  5.  **Locals' Non-Compliance Nuance:** Observing locals occasionally break minor rules does not automatically void the moral basis for visitor compliance; the key distinction is whether the visitor, as a temporary beneficiary reliant on the *overall* functioning of the cooperative scheme, exploits the system others uphold, differing from a resident's occasional lapse within their sustained participation.
