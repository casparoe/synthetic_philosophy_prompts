  - **Yes** → *Substantive theory (e.g., correspondence, coherence)*. Stop.  

  #### **Pressure Point 1: Blind Ascriptions (Q1)**  
  *Can a speaker meaningfully assert "Everything the oracle said is true" without listing the oracle’s claims, and without invoking a substantive truth property to generalize?*  
  - **Yes** → Proceed to Q2.  
  - **No** → *Truth generalizations require listing claims or a substantive property*. Proceed to Q2.  

  #### **Pressure Point 2: Liar Paradox (Q2)**  
  *How should the liar paradox be resolved?*  
  - **A: Restrict the equivalence schema via a hierarchical language** (e.g., Tarski-style levels).  
  - **B: Supplement the equivalence schema with a consistency/groundedness condition** (e.g., truth requires consistency).  
  - **C: Treat the liar as pragmatically defective** (e.g., unassertible or misfired speech act).  

  #### **Pressure Point 3: Domain Uniformity (Q3)**  
  *Does deflation apply identically across empirical, moral, and aesthetic judgments?*  
  - **Yes** → Uniform deflation.  
  - **No** → Domain-specific restrictions (e.g., "true" cannot be disquoted in some domains).  

