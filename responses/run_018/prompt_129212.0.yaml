  Below is a decision-tree taxonomy for deflationary and adjacent theories of truth, structured by concrete philosophical commitments. The root node addresses the core deflationary commitment, followed by branches for the three specified pressure points. Internal nodes are phrased as claims endorsible without prior knowledge of position labels. Leaves include named positions (and one hybrid), with their most awkward commitments highlighted. Unoccupied combinations are diagnosed, and indistinguishable pairs are flagged. The taxonomy concludes with a confidence assessment.

