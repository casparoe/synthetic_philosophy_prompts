answer: |-
  Here are five implications of the statue-and-clay problem for museum restoration:

  1.  **Authenticity Challenge:** Replacing parts forces the question of whether the restored object is still the *original* artifact (like the statue) or a distinct entity incorporating original material (like the clay arranged statue-wise), even if visually identical; this core tension between continuity of form/function and continuity of matter is inherent in the problem (settled metaphysical framing, but *how* to resolve it for artifacts is heavily debated).
  2.  **Replacement Threshold Debate:** While metaphysics acknowledges gradual part replacement *can* preserve identity (e.g., Ship of Theseus analogies), there is **no settled consensus** on *how much* original material must remain; conservators often use practical thresholds (e.g., >50% original), but philosophers argue this is arbitrary and lacks deep metaphysical justification (genuinely fought over, reasoning here is **soft**).  
  3.  **Originality vs. Material Identity:** Metaphysics is clear that perfect material duplication in the *new* parts doesn't make them "original" – originality derives from the artifact's specific causal history and origin; thus, replaced sections, even if identical, lack the historical authenticity of the surviving ancient material (relatively settled in metaphysics regarding the *new* parts' status).  
  4.  **Persistence Conditions Uncertainty:** The question of *what essential property* (form, function, matter, historical continuity) allows the artifact to persist through change remains deeply contested (endurantism vs. perdurantism, essentialism debates); conservators prioritizing aesthetic/structural integrity versus those prioritizing material authenticity reflect this unresolved philosophical clash (genuinely fought over, core reasoning is **soft**).  
  5.  **Potential for Accidental Destruction/Creation:** Some philosophical views contend that replacing a significant portion might not merely *alter* the original artifact but actually *destroy* it and create a new, distinct composite object (like squashing the statue destroys it leaving only clay); whether restoration is preservation or (partial) replication hinges on this unresolved debate about the nature of artifact identity over time (genuinely fought over, **soft** reasoning with major practical implications).
