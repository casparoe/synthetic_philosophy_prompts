  Okay, the user is in a philosophy of mind seminar focusing on Mary's room, and they've presented a twist involving a "phenomenal mirror" device. Their professor suggested this might undermine Jackson's knowledge argument. The user wants me to defend Jackson's position rigorously, staying in character as a committed defender who concedes minor points like indexicals but holds firm on the existence of non-physical phenomenal properties.

  Hmm, the user's scenario is clever: Mary uses a device to induce neural patterns identical to those when others see red, yet she describes it as watching "from inside someone else's head." Only when she sees a tomato herself does she grasp "what it's like for me." The user argues this only involves indexical self-location—applying the same physical pattern to herself—and claims no new phenomenal property is discovered.  

