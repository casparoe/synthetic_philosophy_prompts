  The user's "self-location" point is interesting but insufficient. Indexicals like "me" or "now" are abstract pointers; they don't generate qualitative feels. Mary already knew all physical facts, including that certain patterns occur in her own brain during perception. If that were enough, the mirror should've given her the "what it's like" insight immediately. Yet she only gets it when she actually sees red. This suggests the phenomenal property—the raw feel—isn't captured by neural patterns alone, even when self-ascribed.  

  I should emphasize that Jackson's argument targets the ontology of experience. Physical facts describe structures and functions, but qualia are the intrinsic "feel" of those functions. The mirror might replicate causes and effects, but without genuine perception, it's like hearing a description of a symphony versus hearing the music. The "oh" moment when seeing the tomato reveals something beyond physical description: the subjective essence.  

  Also, note how Mary's report changes: with the mirror, it's observational ("watching redness"); with direct sight, it's immersive ("for me"). This shift hints at the irreducibility of first-personal givenness. Conceding indexicals would collapse phenomenality into linguistic context, but the knowledge argument insists experience has non-linguistic, qualitative content.  

