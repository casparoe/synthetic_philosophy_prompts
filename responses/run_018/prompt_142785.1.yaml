  We must be neutral and avoid adjudication.

  Let me recall the two puzzles:

  - **Platonia Dilemma**: 
    There are N players (N large). Each can choose to send a telegram (costly) or not. If exactly one player sends a telegram, that player wins a huge prize. If none or more than one sends, no one wins (and the sender loses the cost). It is symmetric and one-shot.

  - **Luring Lottery**:
    There are two players. Each can choose to buy a lottery ticket (costly) or not. The prize is awarded if at least one ticket is bought. However, if both buy, they split the prize. The twist: the prize is very large if exactly one buys, but only a small amount if both buy. The payoffs are discontinuous in the number of tickets.

  Standard recommendations:

  - CDT (Causal Decision Theory): In Platonia, since my choice has no causal effect on the other (they are independent), I should reason that the chance of being the only one to send is negligible (1/N) and so I should not send. In Luring Lottery, CDT might recommend not buying because if I buy, I might cause a split (if the other buys) but I cannot cause the other to not buy.

  - EDT (Evidential Decision Theory): In Platonia, if I decide to send, that is evidence that others are also sending (because we are all symmetric and using the same reasoning) so the chance of being the only one is low -> don't send. Similarly, in Luring Lottery, if I buy, that is evidence that the other is also buying (because of symmetry) so the prize will be split -> don't buy.

  But superrationality: In Platonia, if all players are identical and use the same reasoning, they can coordinate to all not send (so no one wins) or to have one send? Actually, the superrational approach is to reason that if all reason the same, then either all send or none send. Since if all send, they lose; if none send, they lose. But the optimal is to have exactly one send. How can that be achieved? The idea is that each can randomize with a very low probability. But in the pure superrationality without randomization, it's tricky. Alternatively, the superrationalist might argue that they should all decide not to send, except one. But how? Without communication? 

  Actually, the classic superrational approach (Hofstadter) is that they all reason that they are identical and thus will do the same thing. Therefore, the only consistent choices are: all send or none send. Since all send is bad and none is bad, but none is better (because at least you don't pay the cost). But that doesn't achieve the optimum. So some have proposed that they should use a mixed strategy. However, the problem remains: how to coordinate on having exactly one send? 

