          If V is very large and v is small, this might be positive or negative? But we have v-c<0 and V-c>0. But note that if V is large enough, it might still be positive. However, the problem is designed so that if the other is likely to buy, then buying is bad. But CDT does not update the belief about the other based on one's own action.

