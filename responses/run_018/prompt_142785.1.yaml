  4. Observation: These puzzles test whether identical reasoning processes can produce correlated choices without causal interaction.

  5. Resolution: We agree that a resolution should provide a principled reason that applies to all agents of the same reasoning type.

  Now, disagreements:

  (a) Superrationalist: Recognizing oneself as an instance of a shared reasoning algorithm provides a rational basis for choosing an action that is optimal only if the other does likewise, absent any causal or evidential link.

     Independence-reasoner: Such recognition does not provide a rational basis; one must act independently.

  (b) Superrationalist: The discontinuous payoff jump in the Luring Lottery does not undermine the symmetry required for superrational reasoning.

     Independence-reasoner: The discontinuity breaks the symmetry and prevents superrational coordination.

  (c) Superrationalist: The correct resolution requires revising decision-theoretic norms (to include superrationality).

     Independence-reasoner: The correct resolution only requires clarifying the domain over which existing norms (CDT/EDT) apply.

  Cruxes:

  1. Whether rationality is indexed to a token mental state or to a type-level algorithm.

     Define: Token mental state = the particular instance of reasoning in an individual at a time. Type-level algorithm = the abstract reasoning process shared by all agents.

  2. Whether a payoff discontinuity (as in Luring Lottery) can be bridged by a continuity principle without begging the question against independence.

     Continuity principle: If we consider a sequence of games that approaches the discontinuous game, the solution should approach the solution of the discontinuous game.

  For each crux, a concrete case and predictions:

  Crux 1: Token vs Type rationality.

     Both agree that a noisy-reasoning variant of Platonia is relevant: agents share the same algorithm, but execute it with independent random noise. Specifically, the algorithm outputs an action, but each agent flips a coin (with probability ε of error) and performs the opposite action.

     Superrationalist prediction: Even with noise (for small ε), the correlation in actions remains high enough that the expected payoff from the superrational strategy (e.g., all intending to send with low probability) is still higher than the CDT/EDT strategy of never sending. Thus, superrational reasoning remains rational.

     Independence-reasoner prediction: Any token-level divergence (ε>0) severs the rational link and forces agents to reason independently. Therefore, the correlation drops to zero (or near zero) and the superrational strategy collapses to independent randomization, which has a lower expected payoff than the superrational one without noise (and might even be worse than not sending?).

  Crux 2: Discontinuity and continuity.

     Both agree that a continuous variant of Luring Lottery is relevant: instead of a jump from V to v when going from one buyer to two, the prize decreases continuously as the number of buyers increases (for example, the prize per buyer is a continuous function of the number of buyers).

     Superrationalist prediction: In the continuous version, superrational reasoning leads to a unique and stable equilibrium that approaches the superrational solution of the original discontinuous game as the continuous version approaches the discontinuity.

     Independence-reasoner prediction: In the continuous version, the superrational reasoning might work, but as we approach the discontinuity, the solution becomes unstable and the independent reasoning (CDT) becomes the only rational approach. Thus, the discontinuity breaks the superrational argument.

  Now, let's draft the joint statement accordingly.
answer: |-
  ### Joint Statement on Superrational Coordination vs. Causal-Evidential Independence in Symmetric One-Shot Games  

  **Section 1: Agreed Claims**  
  Both signatories endorse the following claims:  

  1. **Formal Payoff Structures**:  
     - **Platonia Dilemma**: \(N\) symmetric players (\(N\) large) simultaneously choose to "send" (cost \(c > 0\)) or "not send" (cost \(0\)). A player receives \(V - c\) (\(V \gg c\)) if they send and are the *only* sender; otherwise, they receive \(-c\) if they send (and others send too), or \(0\) if they do not send.  
     - **Luring Lottery**: Two symmetric players simultaneously choose to "buy" (cost \(c > 0\)) or "not buy" (cost \(0\)). A player receives \(V - c\) (\(V \gg c\)) if they buy and the other does not; \(v - c\) (where \(v < c\)) if both buy; or \(0\) if they do not buy (regardless of the other’s choice).  

  2. **Information Conditions**: Both games are one-shot, symmetric (players have identical payoffs and knowledge), and permit no communication. Players know they share the same reasoning algorithm and are mutually aware of the game structure.  

  3. **Standard Decision-Theoretic Recommendations**:  
     - **Causal Decision Theory (CDT)** recommends "not send" in Platonia (no causal impact on others; vanishing probability of being the sole sender) and "not buy" in Luring Lottery (no causal control; risk of \(v - c < 0\) dominates).  
     - **Evidential Decision Theory (EDT)** recommends "not send" in Platonia (choosing to send is evidence others do too, making sole success unlikely) and "not buy" in Luring Lottery (choosing to buy is evidence the other buys too, leading to \(v - c < 0\)).  

  4. **Purpose of the Puzzles**: Both are designed to test whether identical reasoning processes can non-causally correlate choices in symmetric one-shot games, despite the absence of causal or evidential links between players.  

  5. **Resolution Criterion**: A resolution requires a principled, generalizable reason applicable to all agents of the same reasoning type, without ad hoc assumptions.  

  ---

  **Section 2: Disagreements Table**  
  The table below contrasts the formulations each party accepts. Rows (a)–(c) represent core disagreements:  

  | Issue | Superrationalist Position | Independence-Reasoner Position |
  |-------|----------------------------|--------------------------------|
  | **(a) Rational basis for correlated action** | Recognizing oneself as an instance of a shared algorithm provides a rational basis for choosing an action optimal only if all do likewise (e.g., all "send" with low probability in Platonia), absent causal/evidential links. | Such recognition provides no rational basis; actions must be independent absent causal/evidential links (e.g., in Platonia, no justification for conditioning on identical choices). |
  | **(b) Impact of payoff discontinuity** | The discontinuous payoff jump in Luring Lottery (e.g., \(V - c\) → \(v - c\)) does not undermine symmetry; superrational coordination remains valid. | The discontinuity breaks symmetry, making superrational coordination (e.g., conditioning on identical choices) inapplicable due to the non-linear incentive shift. |
  | **(c) Nature of resolution** | Resolving these puzzles requires revising decision-theoretic norms to incorporate type-level reasoning (e.g., superrationality). | Resolving these puzzles only requires clarifying the domain of existing norms (CDT/EDT); no revision is needed, as independence is fundamental. |

  ---

  **Section 3: Cruxes**  
  The following sub-questions are cruxes; settling them would change at least one party’s position. Crucially:  
  - **Token-Type Distinction**: *Token rationality* indexes rational obligations to an agent’s specific, local mental state (e.g., unique noisy computations). *Type rationality* indexes obligations to a shared abstract algorithm (e.g., identical decision rules).  
  - **Discontinuity Bridging**: Whether a continuous approximation of a discontinuous game can justify superrational coordination without presupposing independence-violating principles.  

  | Crux | Superrationalist Prediction | Independence-Reasoner Prediction |
  |------|-----------------------------|----------------------------------|
  | **Crux 1: Token vs. type-indexed rationality**<br>*Is rationality fundamentally token-level or type-level?*<br>*(Test: Noisy-reasoning variant of Platonia)*<br>Agents share a type-level algorithm but execute it with independent error (e.g., with probability \(\epsilon > 0\), a token-level "flip" overrides the output). | For small \(\epsilon\), correlation survives: Expected payoffs from superrational strategies (e.g., target \(p \approx 1/N\)) dominate independent strategies (e.g., CDT’s "never send") because type-level alignment persists below token-divergence thresholds. | Any token-level divergence (\(\epsilon > 0\)) severs rational correlation: Players default to independent randomization (e.g., each sends with probability \(1/N\)), collapsing superrational payoffs. Token identity is necessary for coordination. |
  | **Crux 2: Discontinuity and continuity**<br>*Can a continuous payoff function bridge the discontinuity in Luring Lottery without begging the question?*<br>*(Test: Continuous Luring Lottery)*<br>Modify Luring Lottery so the prize decreases continuously in the number of buyers (e.g., prize per buyer \(= V \cdot e^{-k\cdot(\text{#buyers}-1)}\) for \(k > 0\)), converging to the original as \(k \rightarrow \infty\). | Superrational coordination yields a stable equilibrium that smoothly approaches the original game’s solution (e.g., both "buy" with moderate probability) as \(k \rightarrow \infty\). Continuity validates type-level symmetry. | As \(k \rightarrow \infty\), the equilibrium becomes unstable; CDT-independence inevitably applies. Discontinuity cannot be bridged without assuming the conclusion (correlation). |

  ---

  **Closing**: This statement reflects our shared understanding and divergent positions. Progress requires jointly testing predictions against the specified cases.
