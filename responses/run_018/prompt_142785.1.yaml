            - If only one buys: that one gets V - c.
            - If both buy: each gets v - c (because they split the prize? Or is the prize structure different? The problem says: the prize is very large if exactly one buys, but small if both buy. So:
              - Exactly one buys: that one gets a big prize (V) minus c -> V - c.
              - Both buy: each gets a small prize (say, v) minus c -> v - c. (Note: the total prize when both buy is 2v? Or is the prize fixed and split? The problem says: "if both buy, they split the prize" and the prize is small in that case. So if the prize when both buy is P_small, then each gets (P_small)/2 - c. But the problem also says the prize is awarded if at least one buys. So we can define:

            - When exactly one buys: the buyer gets V - c.
            - When both buy: each gets (P_small)/2 - c. And we are told that V is very large and P_small is small, so that V - c > 0, and (P_small)/2 - c < 0 (so that buying when the other buys is worse than not buying).

          Alternatively, let me set:
            - If exactly one buys: that buyer gets a prize of V (so net V - c).
            - If both buy: each gets a prize of v (so net v - c), and we assume v - c < 0 and V - c > 0.

          And if none buys: both get 0.

  2. Information conditions: no communication, one-shot, symmetric information (each knows the rules and that they are symmetric and that they are all rational and using the same reasoning?).

  3. What CDT and EDT recommend:

     - Platonia:
       - CDT: My choice does not affect others. The probability that I am the only one who sends is very low (1/N, if others are randomizing independently). So the expected value of sending is (V - c)/N + ( -c)*(N-1)/N. For large N, this is approximately -c (negative). So CDT recommends not sending.
       - EDT: If I send, that is evidence that others are also sending (because we are symmetric and using the same reasoning). So the probability that there is exactly one sender (me) is very low. So the expected value of sending is negative -> don't send.

     - Luring Lottery:
       - CDT: My buying a ticket causes me to pay c. If the other buys, I get v - c (which is negative); if the other doesn't buy, I get V - c (positive). But I cannot affect whether the other buys. So if the probability that the other buys is p, then the expected value of buying is p*(v-c) + (1-p)*(V-c). If p is high enough, this might be negative. Without information about p, we might assume independence. But CDT would require a belief about p. However, the independence-reasoner would say that since there's no causal link, p should be set independently of my choice. So if we assume symmetry, p might be 1/2? Then we can compute. But the superrationalist might object to that assumption.

