answer: |-
  ### Summary of the disagreement
  Maya argues Kant’s critique of standing armies is primarily *normative*: they violate human dignity by treating soldiers as mere tools, insulate citizens from war's costs, and create a caste defined by lethal force—even in democracies. Dominic contends the critique is *empirical*: standing armies provoke arms races and make peace costlier than war. If this dynamic is historically obsolete (e.g., modern professional militaries coexisting with peace), Kant’s argument weakens. Maya insists the article must be read within Kant’s larger "architectonic," where preliminary articles gain full meaning only alongside the definitive articles (republicanism, federation). Dominic counters that over-reliance on later sections robs the article of independent force.

  ---

  ### Point-by-point adjudication
  **Maya’s strongest claims:**  
  1. **Normative Core:** Kant explicitly links standing armies to treating humans as "machines" (violating the "rights of mankind in our own person"). This anchors the objection in Kant’s deontological ethics, independent of empirical outcomes.  
  2. **Architectonic Context:** The preliminary articles *are* negative preconditions logically prior to the positive framework of the definitive articles. Kant’s ideal of citizenship (where defense is a civic duty, not a profession) is articulated in Definitive Article 1 (republicanism). A standing army, even volunteer, undermines this by severing military force from civic responsibility.  

  **Maya’s weakest claim:**  
  Her dismissal of Dominic’s firefighter analogy is incomplete. While she correctly notes that *state-authorized killing* is unique, she under-explains why this alone reduces soldiers to "tools" when other state-risk professions (e.g., police) do not. Kant’s emphasis is on the *systematic alienation* of violence from the citizen body, not risk per se.  

  **Dominic’s strongest claims:**  
  1. **Empirical Strand:** Kant *does* stress concrete consequences: arms races and the economic burden of maintaining standing armies ("cost of peace finally becomes more oppressive"). If modern professional armies enable deterrence without triggering endless escalation (e.g., post-1945 nuclear stalemate), this prong of Kant’s argument weakens.  
  2. **Over-reliance on Architectonic:** If the article *requires* the definitive articles for coherence, it risks circularity. Kant presents the preliminary articles as actionable "immediately" (though "with deliberate speed"), suggesting some standalone validity.  

  **Dominic’s weakest claims:**  
  1. **Misreading the Firefighter Analogy:** Kant’s objection centers on *contractual obligation to kill*, not risk-taking. Soldiers are uniquely bound to inflict state-directed violence against humans *as their profession*, unlike firefighters who mitigate harm. Dominic’s analogy conflates distinct moral categories.  
  2. **Ignoring Republican Citizenship:** Kant’s praise for "periodic and voluntary military exercises of citizens" ties defense to civic virtue. Professional soldiers, even consensual, become a mercenary class detached from the citizenry—eroding the republican link between sovereignty and responsibility.  

  **Key verdicts:**  
  - Maya wins on **normative grounding**: Kant’s human dignity argument is core and transcends empirical contingencies.  
  - Dominic wins on **empirical contingency**: The arms-race logic *is* historically mutable, potentially weakening that strand.  
  - Maya wins on **republican context**: Standing armies inherently conflict with Kant’s model of active citizenship, clarified later in the essay.  

  ---

  ### What both are missing  
  1. **Preliminary vs. Definitive Dialectic:** The preliminary articles are *transitional*. Abolishing standing armies presupposes progress toward Definitive Article 1 (republican constitutions where citizens *are* the military) and Article 2 (a federation enabling collective security). Kant’s objection isn’t just moral or empirical but *teleological*: standing armies obstruct the path to perpetual peace by perpetuating non-republican state power.  
  2. **The "Rights of Mankind" in Context:** Kant’s concern isn’t solely individual dignity but *systemic corruption*. Standing armies empower executives to wage war without popular consent (violating republican principles) and normalize violence as a trade—corrupting both state and citizen.  
  3. **Volunteer Forces Today:** Neither fully addresses Kant’s deeper worry: even democratic professional armies commodify violence and distance citizens from war’s reality, potentially enabling militarism—a tension unresolved in modern states.  

  ---

  ### Overall verdict  
  **Maya’s interpretation is more faithful.** While Dominic correctly notes the empirical strand’s vulnerability, Kant’s normative and republican arguments are the article’s foundation. The "machine" metaphor and contrast with citizen militias reveal his core objection: standing armies violate human autonomy *and* the civic reciprocity essential for peace. Dominic’s standalone reading ignores how Kant’s preliminary articles derive force from their role in enabling the definitive conditions (republicanism/federation). The firefighter analogy fails because Kant’s concern is uniquely about *institutionalized state killing*, not risk. Maya’s architectonic approach better captures Kant’s systematic vision: abolishing standing armies isn’t merely pragmatic but a moral prerequisite for a rightful political order. Kant’s critique retains force against modern professional militaries precisely because they perpetuate the separation of violence from citizenship—a problem unresolved by voluntarism.
