  This requires careful handling of Kant's dual empirical/normative dimensions. Maya emphasizes the deontological "rights of mankind" argument while Dominic focuses on consequentialist arms race logic. Both have merit but incomplete. Kant's republican framework is crucial here - citizen-soldiers represent the unity of popular sovereignty where military service is civic duty rather than mercenary activity. 

