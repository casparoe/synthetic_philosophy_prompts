prompt: |-
  I keep seeing Gödel dragged into arguments way outside mathematics — that AI can't be fully rational, that the mind isn't a machine, that physics can't have a theory of everything, that some truths are just unprovable, full stop — and half the time the person has only borrowed the word incompleteness. Before I evaluate any of these, I want the full spec: what does an argument that invokes Gödel outside math have to get right for the appeal to do real work rather than just be a vivid analogy? Give me the requirements list — the theorem's actual conditions (a formal system, recursively axiomatizable, consistent, able to represent enough arithmetic), the bridge premises needed to get from a theorem about formal systems to a conclusion about minds, machines, or physical theories, and the usual skipped steps — with why each is a requirement, and mark which are non-negotiable and which are just preferences of a particular debate. If a requirement can't be met for a given target (say, a human capacity that isnt a finitely specified formal system), say which one and whether any popular use dies on it. Lead with your bottom line in the first sentence, then give the list and reasoning. No preamble, no restating the question.
reasoning: |-
  Okay, the user wants a clear, structured breakdown of what it takes for Gödel's incompleteness theorems to legitimately apply outside mathematics. They mentioned seeing Gödel's name used in arguments about AI, minds, physics, etc., often incorrectly. So, my task is to list the requirements for a valid application, distinguishing non-negotiable conditions from debatable ones.

  First, I need to recall the core of Gödel's theorems. The first incompleteness theorem states that any consistent formal system capable of basic arithmetic is incomplete—there will be true statements it can't prove. Key conditions include the system being formal, recursively axiomatizable, consistent, and sufficiently strong for arithmetic. The second theorem adds that such a system can't prove its own consistency.

  For an argument invoking Gödel outside math to hold, it must map these conditions to the target domain. The user wants a list of requirements, so I'll start with the bottom line: applying Gödel requires the target to be a consistent formal system with recursive axioms and arithmetic capability.

  Now, breaking it down: non-negotiable conditions are absolute musts from the theorem. These include the target being a formal system (meaning well-defined syntax and rules) and recursively axiomatizable (finite description of axioms). Consistency is critical because inconsistent systems can prove anything. Arithmetic capability is essential too; without it, the theorem doesn't apply.

  Then there are bridge premises—assumptions needed to link the theorem to real-world targets. For example, arguing that the human mind is such a system requires showing it meets the formal criteria, which is debatable. Similarly, for AI or physics, one must establish they can be modeled as formal systems with arithmetic strength.

  I should also highlight skipped steps, like assuming that unprovable truths in a system map to unknowable truths in reality, or that consistency implies truth—which isn't always valid. These are often overlooked but crucial for the argument's validity.

  For each requirement, I'll note if it's non-negotiable or a debate preference. For instance, the formal system condition is non-negotiable, but whether minds or physics fit this is where debates happen. If a target (like human cognition) isn't a finitely specified formal system, the argument fails there.

  Finally, I'll wrap up by stating that most popular uses of Gödel outside math fail on these conditions, especially the formal system requirement. This addresses the user's concern about misuse and provides a clear framework for evaluation.
answer: |-
  **Bottom line: For Gödel's incompleteness theorems to substantively apply outside formal mathematics, the target (mind, AI, physical theory) must demonstrably satisfy the theorems' core mathematical conditions, and rigorous bridge premises must connect those conditions to the target's properties, overcoming significant conceptual leaps often glossed over in popular discourse.**

  Here's the requirements list, with reasoning:

  1.  **The Target Must Be a Consistent Formal System (Non-Negotiable)**
      *   **Why:** Gödel's theorems are *about* formal systems – defined sets of symbols, syntax rules, axioms, and inference rules producing theorems via mechanical deduction.
      *   **Requirement:** The target (mind, AI, physical universe) must be isomorphic to, implementable by, or perfectly describable as such a formal system. Its "thinking" or "law-governed behavior" must be *exactly* equivalent to theorem derivation.
      *   **Death Point:** If the target is *not* a formal system (e.g., human minds arguably involve messy biology, non-algorithmic processes, or non-finite specification; physical laws might involve continua or non-computable aspects), the direct application fails. **Most popular uses invoking minds or physics die here.**

  2.  **The Target-System Must Be Recursively Axiomatizable (Effectively Generated) (Non-Negotiable)**
      *   **Why:** Gödel requires that the axioms and inference rules can be listed by a mechanical procedure (e.g., a Turing machine). This ensures the system is definite and finitely specifiable.
      *   **Requirement:** The fundamental rules/axioms governing the target must be finitely specifiable and mechanically enumerable. There must be an algorithm listing all "basic truths" or rules.
      *   **Death Point:** If the target's fundamental rules *cannot* be finitely specified (e.g., if human understanding relies on an open-ended, non-algorithmic process; if physics requires infinitely many axioms), the theorem doesn't apply.

  3.  **The Target-System Must Be Consistent (Non-Negotiable for Meaningful Application)**
      *   **Why:** An inconsistent formal system can prove *every* statement, making incompleteness trivial and meaningless. Gödel's result requires consistency to show the existence of *meaningful* unprovable truths.
      *   **Requirement:** The target-system must not allow contradictory truths to be derived/known/true within its framework.
      *   **Skipped Step:** Assuming the target *is* consistent. Proving consistency for complex targets (like minds or the universe) is often impossible or highly contentious.

  4.  **The Target-System Must Be Sufficiently Strong to Represent Basic Arithmetic (Robust) (Non-Negotiable)**
      *   **Why:** Gödel's construction relies on the system's ability to encode symbols, formulas, proofs, and operations on natural numbers (e.g., Robinson Arithmetic Q suffices). The self-referential "Gödel sentence" is built using this arithmetic machinery.
      *   **Requirement:** The target must be able to represent and reason about concepts isomorphic to natural numbers and basic operations on them (addition, multiplication, or equivalents).
      *   **Debate Point:** While representing arithmetic is often plausible for minds/AI/physics, the *level* of "robustness" (does it include induction? how is arithmetic grounded?) can be debated. However, the core ability to encode finite sequences and perform basic computations is essential.

  5.  **Bridge Premise: Provability in the System Maps to Knowability/Rationality/Truth in the Target (Critical Bridge - Highly Debatable)**
      *   **Why:** Gödel shows unprovability *within the system*. To conclude something about "unknowability by the mind/AI" or "truths physics cannot capture," one must equate "provable by the system" with "knowable by the target" or "describable by the physical theory."
      *   **Requirement:** A rigorous argument must show that:
          *   For minds/AI: What the system can prove maps *exactly* to what the mind/AI can know/rationally conclude.
          *   For physics: What the system can prove maps *exactly* to the truths expressible and derivable within the physical theory.
      *   **Skipped Step & Death Point:** This is the most common fatal leap. Minds might "know" things non-deductively or through non-formal means. Physics might describe truths observationally or via approximation without formal proof. AI might use probabilistic reasoning exceeding strict deduction. **Most popular arguments invoking Gödel against AI rationality or for minds exceeding machines die here by assuming this mapping without justification.**

  6.  **Bridge Premise: The Gödel Sentence's Truth is Accessible Externally or Implied (Debatable)**
      *   **Why:** Gödel shows that if the system is consistent, the Gödel sentence (G) is unprovable *within the system* but *true* (under the standard interpretation of arithmetic).
      *   **Requirement:** For the conclusion "there are true but unprovable/un-knowable statements," one must establish that G *is* true. This usually relies on:
          *   Assuming the consistency of the system (which the system itself cannot prove - 2nd theorem).
          *   Assuming the standard model of natural numbers applies.
      *   **Skipped Step:** Assuming the system's consistency (see #3) *and* assuming that "truth" for the target-domain statements corresponding to G is well-defined and corresponds to standard arithmetic truth. For minds/physics, defining this "truth" independently of the system can be problematic.

  7.  **Bridge Premise: The Target Cannot Be "Extended" to Overcome the Limitation (Contextual Preference)**
      *   **Why:** Gödel applies to *specific* formal systems. Adding G as a new axiom creates a new, stronger system (which will have its *own* Gödel sentence). The limitation is inherent to *any sufficiently strong* formal system, but not necessarily to a process that can always evolve.
      *   **Requirement:** To conclude the target has a *fundamental, insurmountable* limitation, one must argue the target is *essentially fixed* or that any extension still falls under the theorem's conditions.
      *   **Debate Preference:** Whether minds/AI/physics are "fixed" formal systems or open-ended, evolving processes is central to many debates (e.g., Lucas-Penrose vs. computationalism). Gödel doesn't forbid evolving systems knowing more, but shows any fixed snapshot is incomplete.

  **Summary of Failure Points:**
  *   **Non-Negotiable Death:** Targets that aren't formal systems (#1 - minds, physics) or lack recursive axiomatization (#2 - often minds, some physics models) or are inconsistent (#3) cannot have Gödel applied directly.
  *   **Critical Bridge Death:** The mapping of formal provability to target knowability/truth (#5) is almost always assumed without justification and is rarely plausible for non-formal targets.
  *   **Debateable Ground:** Arguments often stumble on establishing consistency (#3), the precise level of arithmetic robustness (#4), the truth of G (#6), or the fixed nature of the target (#7).

  **Verdict on Popular Uses:** Claims that Gödel *proves* minds aren't machines, AI can't be fully rational, or physics can't have a TOE typically fail on #1 (target isn't a formal system) and catastrophically on #5 (invalid provability-to-knowability mapping). Gödel provides a profound analogy for limitations, but direct application requires meeting stringent mathematical conditions that real-world targets generally do not satisfy.
