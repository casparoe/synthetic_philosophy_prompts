  First, the audience breakdown is crucial. Liberal IR scholars and Kantians likely see Hegel as proto-fascist—their objections will center on moral justification of state violence. The grad students want textual fidelity without normative endorsement, while the German idealism specialist will pounce on shaky exegesis. The prep must stratify objections by damage level and speak each group's language.

  Key challenges: 
