  - Distinguishing settled scholarship (war as ethical moment) from contested claims (parallel to corporations) 
  - Preempting the "proto-fascist" label while conceding war's brutality 

  The user's thinnest point is that civil society particularism is the primary target rather than external threats. §324's "preservation against injury from without" is a major hurdle—they'll need to argue this includes internal fragmentation via external conflict. Also, the corporation/war parallel is structurally suggestive but not explicitly stated. 

  For Q&A structure: 
  - Lead with the most damaging objections (moral equivalence to fascism) 
  - Preempt the visiting specialist's textual traps by flagging contested interpretations 
  - Give the grad students enough textual ammunition to entertain the argument 

  Biggest fear: someone asking why internal particularism requires external war rather than state mechanisms. The reply must hinge on Hegel's view of contingency and the state's need for extreme moments of unity—but this risks sounding authoritarian. 

  Noting where to concede: 
  - Hegel's horror at war's violence (§328) 
  - The lack of explicit corporation-war parallel in the text 
