  But R might not need to verify consistency from scratch; for example, for systems that R understands well, R knows they are consistent.

  But for arbitrary F, it's problematic.

  Now, the recursion: in (8), it says "suppose R is captured by some stronger but still formalizable framework R*". But the anti-mechanist might deny that R is captured by any formalizable framework, so applying the argument recursively assumes that R is formalizable, which is what the argument is trying to disprove.

  That is, the recursion might be question-begging.

