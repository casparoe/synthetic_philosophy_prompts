  Therefore, the recursion doesn't apply.

  The argument in (8) assumes for reductio that R is captured by R*, but since the initial argument shows that R can't be captured by F, it should also show that it can't be captured by R*, so we don't get a hierarchy; instead, we conclude that R is not captured by any formal system.

  Hence, no infinite hierarchy is needed.

  The UGP part might still be an issue, but without recursion, the finiteness isn't a problem.

  Let me formalize this.

