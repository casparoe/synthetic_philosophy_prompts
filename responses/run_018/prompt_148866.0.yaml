  For the "what would change their minds" part - Mara might concede if shown that opt-outs don't actually constrain the algorithm's choices in practice (the "no-bind" scenario), while Leo might reconsider if evidence shows engagement metrics implicitly create social preferences through algorithmic feedback loops.

  The conversation should feel natural - maybe starting with Mara setting up the paradox simply, Leo pushing back about the lack of social preferences, then Mara countering about hidden aggregation through the algorithm's design. They could use concrete examples (like political ads) to keep it grounded. I'll include some natural speech quirks - a "gimme" here, a "yeah" there - to make it feel like a real coffee shop debate.

