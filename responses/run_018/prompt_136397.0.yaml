  First, I should acknowledge their frustration. Structural realism has sprawling debates, but not all are equally fertile. The epistemic/ontic (ESR/OSR) split is foundational but somewhat stagnant; they’d waste time relitigating it. Instead, they should tackle how structural continuity *actually works* when theories change (e.g., from Fresnel to Maxwell)—that’s upstream because it determines whether SR’s core thesis holds. 

