prompt: |-
  So I'm a junior and I'm in this world history elective where my teacher, Ms. Okafor, has this running bit about "non-human historical actors" — like whether diseases or volcanoes or climate shifts should count as characters in history who do things, versus just being the scenery human beings act in front of. She's given us her verdicts on a bunch of cases and I cannot figure out her system. Smallpox during the Spanish conquest of the Americas: actor, she said it "basically fought on Cortés's side." The Black Death in 14th century Europe: actor, because it rewrote the labor market and landlords suddenly had to compete for peasants. Yellow fever in the Haitian Revolution: actor, since it shredded the French expeditionary forces while barely touching the Haitians. But the 1815 Tambora eruption and the Year Without a Summer: not an actor, "background condition." And the Little Ice Age as a whole: also just background. When someone asked why plague counts but Tambora doesn't, she said something like, a germ adapts and responds to what we do, it kind of has interests, whereas a volcano just sits there being weather. But another time she said an actor has to "change who wins," which sounds like a totally different test, and honestly both fit her verdicts so far.

  Next week she's doing the global droughts of the 1870s — El Niño-driven, caused massive famines in India, northern China, and Brazil, killed millions, while industrializing Europe with its railroads and grain imports was barely touched. I have to write a one-pager predicting her verdict and defending it, and I want to actually nail it rather than hedge. So: pick a definite verdict, tell me which rule she's most plausibly running (the "changes who wins" rule, the "only things with interests count" rule, or some third rule you think fits better), and explain why that rule fits ALL her earlier calls and not just the convenient ones. Also tell me which of her old cases is doing the most work in your prediction, and what future case would settle for sure which rule she actually has in her head. Don't just lay out both options and shrug — commit to one and argue for it.
reasoning: |-
  Okay, the user is a junior in a world history class with Ms. Okafor, who has this concept of "non-human historical actors." The student is trying to figure out her system for categorizing things like diseases or natural events as either active "actors" or just "background conditions." They provided examples: smallpox, Black Death, and yellow fever are actors, while the Tambora eruption and Little Ice Age are background. Ms. Okafor gave two possible explanations: one about having "interests" and adapting, and another about "changing who wins." The student needs to predict her verdict on the 1870s global droughts for a one-pager and defend it, committing to one rule that fits all cases.

  First, I need to analyze the examples given. Smallpox during Cortés's conquest: it actively helped the Spanish by decimating the Aztecs. Black Death changed the labor market, shifting power to peasants. Yellow fever in Haiti weakened the French but not the Haitians, leading to their victory. These all directly influenced the outcomes of conflicts or power structures. On the other hand, Tambora's eruption caused the Year Without a Summer, but it didn't change who was in power; it was a broad environmental event. The Little Ice Age was a prolonged condition that set the stage but wasn't an active player in specific events.

  Ms. Okafor’s comment about germs having "interests" and adapting versus volcanoes just "being weather" suggests agency. But her other point about "changing who wins" seems more consistent with the examples. The diseases directly altered the balance of power in wars or economies. The droughts of the 1870s caused famines in India, China, and Brazil but didn't affect Europe due to industrialization. The key question is whether these droughts changed who was winning in any conflict or power struggle. In this case, the famines didn't shift colonial power; Britain still ruled India, and the Qing Dynasty continued despite the famine. So, it might be background.

  The student needs to pick a definite verdict. Based on the pattern, the "changes who wins" rule fits all cases. Smallpox changed the winner of the conquest, Yellow Fever decided Haiti's revolution, Black Death shifted power to laborers. Tambora didn't change who ruled Europe. The 1870s droughts, while devastating, didn't alter colonial or national control; they exacerbated existing vulnerabilities but didn't lead to a change in who was in power. Therefore, predicting "background."

  The strongest precedent is the Tambora case. Both are climate events causing widespread suffering but no regime changes or shifts in who holds power. To test the rule, a future case like the Irish Potato Famine could be useful. If it's seen as background (since Britain still ruled), it supports the "changes who wins" rule. If considered an actor because it led to mass migration and influenced Irish nationalism, that might suggest a different rule. But based on current examples, "changes who wins" is more consistent.
answer: |-
  Here's your prediction and defense, committed to a single clear verdict and rule, drawing on all Ms. Okafor's past judgments:

  **Predicted Verdict for the 1870s Global Droughts: NOT AN ACTOR (Background Condition)**

  **The Rule She's Using (and why it fits ALL cases):**
  Ms. Okafor's core rule is **whether the non-human force *actively and directly alters the balance of power or the outcome of a specific human conflict/struggle* in a way that determines "who wins" or "who gains power" in that contest.** This synthesizes her "changes who wins" comment and the "interests" idea into a functional test focused on *agency within human power dynamics*. Here's how it explains every case:

  1.  **Smallpox (Actor):** It didn't just kill people; it *actively decided the military conflict* between Cortés and the Aztec Empire. By devastating the Aztec defenders while sparing (relatively) the Spanish forces, it directly changed the military balance, ensuring Spanish victory ("who won" the conquest).
  2.  **Black Death (Actor):** It didn't just cause death; it *directly overturned the existing socioeconomic power structure*. By creating a severe labor shortage, it empowered peasants (labor sellers) and forced landlords (labor buyers) into competition, fundamentally shifting economic power ("who won" in the struggle over wages/status between classes).
  3.  **Yellow Fever in Haiti (Actor):** It wasn't just a disease; it was *a decisive combatant in the revolutionary war*. By selectively incapacitating and killing the French expeditionary force while leaving the Haitian rebels largely unharmed, it directly determined the military outcome ("who won" the war for independence).
  4.  **Tambora Eruption/Year Without a Summer (Background):** While causing immense suffering and disruption, it did *not* decisively alter *who held power* in the major conflicts or structures of the time (e.g., the post-Napoleonic settlement in Europe). It caused hardship within existing systems but didn't flip the outcome of a specific struggle for dominance. It was a condition everyone endured, not a force picking sides.
  5.  **Little Ice Age (Background):** As a prolonged climatic trend, it *shaped the environment and context* for human action (farming practices, settlement patterns, resource pressures) but it didn't *directly intervene* to change the winner of a specific war, revolution, or power struggle. It set the stage, but human actors navigated its challenges within their existing conflicts.

  **Why the 1870s Droughts are Background (Applying the Rule):**
  The El Niño-driven droughts caused catastrophic famines in India, China, and Brazil, killing millions. However, applying Ms. Okafor's rule:
  *   **Did it change "who won" a specific conflict or power struggle?** **No.**
      *   In **India:** The famine occurred under British colonial rule. While devastating, it did not dislodge British power or lead to a successful rebellion that changed the ruling power. The colonial structure persisted.
      *   In **China:** The famine exacerbated existing crises under the Qing Dynasty, contributing to unrest, but it did not *itself* determine the outcome of a specific struggle that changed who ruled (the Qing fell decades later due to a complex mix of factors).
      *   In **Brazil:** The famine caused immense suffering but didn't overthrow the Empire of Brazil or decisively shift internal power dynamics in a way attributable *directly* to the drought altering the outcome of a contest.
  *   **Did it selectively empower one side in a conflict?** **No.** While Europe (with its technology and global trade) weathered the crisis much better, the drought didn't *actively intervene* in a European conflict to change its outcome (e.g., it didn't cripple one European army fighting another while sparing its opponent). It highlighted existing global inequalities but didn't *act* to overturn a specific power balance within a struggle. It was a brutal *condition* that exposed vulnerabilities within existing power structures, but it didn't *become an actor* deciding a contest.

  **The Case Doing the Most Work:** **The Tambora Eruption (1815)**. This is the clearest parallel: a massive, sudden, climate-driven catastrophe causing widespread death and disruption (the "Year Without a Summer"). Ms. Okafor deemed it background because, despite its severity, it didn't overthrow governments or decide the Napoleonic Wars' outcome – the victors (the Allies) remained in power, and the losers (Napoleon) were already defeated. The 1870s droughts, similarly catastrophic but failing to dislodge colonial rulers or decisively alter specific conflict outcomes within the afflicted regions, fit this "severe hardship without regime change/power shift" pattern perfectly.

  **The Future Case to Settle the Rule:** **The Irish Potato Famine (1845-1852).**
  *   **If Actor:** Argument could be made that the potato blight *directly* destroyed the economic base and social fabric of Ireland, leading to mass death and emigration, fundamentally weakening Irish resistance to British rule for generations and arguably ensuring British dominance ("who won") in that specific colonial struggle for the foreseeable future. The blight *actively targeted* the Irish peasantry's primary food source.
  *   **If Background:** Argument could be made that the famine was a horrific disaster occurring *within* the existing colonial structure. British policy responses were crucial in exacerbating it, and the ultimate "winner" (Britain retaining control) was determined by pre-existing political and military power, not the blight itself deciding the contest. The blight was a condition the colonial system failed.
  *   **Why it Settles the Rule:** If Ms. Okafor calls the Potato Famine an **Actor**, it strongly confirms the "changes who wins" rule, seeing the blight as the decisive force destroying Irish capacity to resist effectively. If she calls it **Background**, it reinforces the Tambora/1870s pattern, emphasizing that the famine, while devastating, occurred *under* British rule and didn't *itself* overthrow that rule in a direct contest; human policy choices within the existing power structure were more decisive. Her verdict here would expose whether "changes who wins" requires an immediate military outcome (favouring Actor less here) or includes long-term structural shifts in power (favouring Actor more here).
