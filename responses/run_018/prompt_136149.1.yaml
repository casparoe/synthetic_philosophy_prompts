  Starting with Leah's first point: she claims lying corrupts one's rational nature, which is a perfect duty. This aligns with Kant's emphasis on the intrinsic wrong of lying, not consequences. Marcus agrees it's not consequentialist but argues Kant's universalization relies on social-contract-like harm, which might conflict with deontology. However, Kant's contradiction in conception test is logical, not empirical. Universal lying makes the concept of communication incoherent. So Marcus's point here is weak.

