  Regarding perfect vs. imperfect duties: Leah focuses on the perfect duty against lying, but Marcus points out a conflict with the perfect duty not to be treated as a mere means. Kant prioritizes the duty to avoid direct violation (lying) over preventing others' misuse. This is a key point both might be missing.

