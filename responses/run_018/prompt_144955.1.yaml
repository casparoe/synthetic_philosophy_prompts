  - Named positions only for coherent stances (e.g., standard act/omission doctrine, consequentialism). 
  - Flag unexplored or inconsistent leaf positions. 
  - Explicitly address institutional actions (e.g., "Does a committee's active decision to not allocate resources feel like killing?"). 
