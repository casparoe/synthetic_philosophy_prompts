prompt: |-
  my dad went into hospice last week and now my sibilings keep fighting over whether pulling the plug is "killing him" or just "letting nature take its course" and I realize none of us actually know what we believe, we just know which phrases feel less bad. I want to map the real positions, not by asking people if they're deontologists but by seeing what they say about specific cases.

  please write me a decision-tree taxonomy for the doing-vs-allowing distinction focused on medical and resource-allocation contexts. build it bottom-up: each branch should be a concrete claim someone can agree or disagree with without knowing the label — for example, whether withdrawing a vent that was started accidentally is different from withdrawing one that was sustaining him long-term; whether withholding an ICU bed from one patient to save another counts as an omission with the same moral weight; whether giving pain meds that hasten death is closer to killing or to allowing.

  the leaves need named positions where they exist: standard act/omission doctrine, flat consequentialist denial, the causal-break view (where it matters if youre interrupting an existing causal chain vs failing to start one), and whatever view takes institutional roles as decisive. for combinations that have no defenders, note whether theyre incoherent or just unexplored. I especially care about the branch where the "omission" requires active coordination — like a triage committee formally deciding not to allocate — because thats exactly where my family is stuck and the usual slogans break.

  make it 8 to 10 nodes, flag any leaf pairs the tree cant really seperate, and please dont include a reading list or ask me to look up specific authors — I need this for an actual conversation, not a seminar paper. if theres an empty quadrant where someone accepts causal distinctions in bedside care but rejects them in committee-level rationing, say so and guess whether anyone actually holds it.
reasoning: |-
