  2. Second tier: Does *intention* separate pain relief from killing?  
  3. Third: Does *active coordination* (e.g., triage committees) change the moral weight?  

  I'll note where positions collapse (e.g., consequentialists reject all distinctions). The "institutional role absolutism" leaf will address their committee dilemma. For unexplored combinations (e.g., "causal history matters at bedside but not in rationing"), I'll speculate if real people hold it (probably not—it's likely inconsistent). 

  The output will be a flowchart-like text tree. I'll avoid labels like "deontology" and instead describe stances: e.g., "Standard Doctrine" for those who see withdrawing/withholding as distinct. Final leaves will include:  
  - Standard Act/Omission  
