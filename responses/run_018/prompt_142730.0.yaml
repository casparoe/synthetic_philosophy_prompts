prompt: |-
  hey, so i'm putting together a little closing piece for a discussion on plato and i want a poem to end with. could you write me a villanelle—nineteen lines, two refrains that keep cycling back, and in the final quatrain they have to sit together without actually resolving? i want the voice of the prisoner who climbs out, sees the sun, then goes back down to talk about the forms. but don't just do the usual shadows-vs-light sermon. instead, make the poem track a more specific problem: every time he tries to name a form for the people still chained, he's forced to use shadow-language, and that kicks off an infinite regress—like the third-man argument—where explaining any form needs another form behind it. so one refrain should be something like "this is not just a brighter shadow" and the other "each name i speak needs a name behind it." the villanelle's looping form should do the philosophical work: the refrains keep returning and circling, and by the end they should be side by side showing the loop doesn't close. it should be accurate enough that someone who's actually read the dialogues on forms wouldn't wince, but still stand up as poetry even if you don't know plato. please keep it all in one continous flow—no headings, bullet points, or bold text, just the verse and maybe a line or two of explanation in plain prose. definatly forgive me if there are typos in this ask; i tend to mispell things when i'm typing fast.
