answer: |-
  Your friend's argument cleverly exposes a genuine tension in historiography and epistemology. The flaw lies in **premise (2)** and its conflation of *epistemic domains*. Here's the breakdown:

  ### The Slippery Step: Premise (2)
  > **"If a practice has internal norms of correction, then its outputs are authoritative with respect to what belongs to that community’s history, irrespective of external documentation."**

  **Why it seems plausible:**  
  It rightly emphasizes that social practices (like collective memory) generate meaning and significance *for the community*. Internal norms (e.g., ritual retellings, elder consensus) validate what "counts" as part of the community's identity-forming narrative. This feels intuitive when discussing *interpretive* truths (e.g., "The strike defined our resistance against oppression").

  **Why it fails:**  
  It conflates **two distinct types of authority**:  
  1. **Hermeneutic authority**: The right to define what events *mean* for the community, their emotional weight, and their role in communal identity.  
  2. **Empirical authority**: The ability to accurately describe physical facts (dates, causality, material existence).  

  Internal norms of correction in collective memory govern *hermeneutic coherence* (e.g., "Does this story resonate with our values? Does it align with other key narratives?"). They do not—and cannot—govern *empirical correspondence* (e.g., "Did water physically submerge the harbor in 1847?").  

  ---

  ### Rejection Pathways & Their Costs
  You can reject the argument at three points, but **rejecting (2) is the least costly**:

  | **Rejection Target** | **Cost** | **Outcome** |
  |----------------------|----------|-------------|
  | **(1) Collective memory’s normative structure** | Sacrifices communal agency; reduces memory to unreliable individual accounts. Collective history becomes merely "aggregated opinions," vulnerable to external erasure. | **High cost**: Undermines marginalized communities’ resistance to dominant historical narratives. |
  | **(3) Mnemonic sovereignty as incorrigible** | Accepts that collective memory can be factually wrong. Risks giving external institutions (e.g., state archives) unilateral power to "correct" communal history. | **Moderate cost**: Requires humility from communities but preserves empirical sanity. |
  | **(2) Internal norms imply universal authority** | Preserves communal hermeneutic sovereignty while acknowledging physical reality. Collective memory still defines the strike’s *meaning*, but not its material details. | **Lowest cost**: Avoids absurdity without sacrificing core insights about social memory. |

  ### Principled Restriction of Sovereignty (Your Solution)
  Yes, you **can restrict sovereignty to hermeneutics** without conceding archival supremacy:  
  - **Collective memory is sovereign over**:  
    - The *significance* of the event ("The strike was a heroic stand against exploitation").  
    - Its *belonging* to the community’s history ("This is our story of resistance").  
    - Its *moral and emotional lessons* ("We remember the strikers as martyrs").  
  - **Empirical details are corrigible**:  
    - Dates, material conditions, and causal chains must align with physical evidence (e.g., payroll records, geological data).  

  **Why this isn’t conceding to archives**:  
  - Archives don’t "correct" the community’s *meaning-making*; they constrain *descriptive claims* about material reality.  
  - The community retains authority to reinterpret events *in light* of evidence (e.g., "The records were falsified; our memory reveals a cover-up").  
  - This mirrors how science corrects folk theories (e.g., Newtonian physics → relativity) without erasing lived experience.  

  ---

  ### Resolving the Strike Example
  - **The strike memory**: The community rightly claims the strike as a defining act of resistance. Its meaning ("We were oppressed; we fought back") is sovereign.  
  - **The payroll records**: If verified, they show no work stoppage *on paper*. This demands reinterpretation, not surrender:  
    - *Option A*: The strike was threatened/planned but suppressed before occurring (making the memory one of *intent* and fear).  
    - *Option B*: The records were falsified (making the memory a testament to institutional deceit).  
  - **Crucially**: The community’s hermeneutic authority forces historians to take the memory seriously as evidence of *something significant*, even if the literal account requires refinement.  

  ---

  ### Conclusion
  **Step (2) slips** by assuming that internal normative coherence grants immunity from empirical accountability. Rejecting this allows you to:  
  - Keep (1): Collective memory *is* a socially normative practice.  
  - Keep a modified (3): Communities *are* sovereign over the meaning of their past.  
  - Reject (5): Physical impossibilities remain impossible.  

  **Cost**: Accepting that communal narratives can be *factually incomplete* without being *meaningfully invalid*. This doesn’t concede authority to archives; it acknowledges that material reality binds all knowledge systems. The community’s voice remains essential—not as an infallible chronicle, but as the keeper of lived truth.  

  As historian Michel-Rolph Trouillot observed: *"History is the fruit of power, but power itself is never so transparent that its analysis becomes superfluous."* Your village’s memory holds power against the factory’s records; its task is not to deny physics, but to expose the power dynamics that made the strike "disappear."
