answer: |-
  Your analysis precisely identifies a tension in Dennett's model, but his view **does not require strict narrative uniqueness** to avoid fragmentation and can accommodate disjoint narratives **without eliminativism or a hidden author**. The key lies in understanding the *functional, dynamic, and pragmatic* nature of narrative gravity. Here's a breakdown:

  ### 1. **The Analogy's Limits: Functional Integration vs. Physical Fields**
     - **Mistaken Inference:** Treating narrative gravity like Newtonian gravity is misleading. Physical centers of mass are mathematically defined by continuous mass distribution. Narratives are *symbolic, interpreted, and functionally integrated* by cognitive/social processes.
     - **Functional Integration:** Competing narratives don’t create "attractors" in a physical field but exist within a *single, dynamic interpretive system*. The brain isn’t governed by narrative "gravity" as a force but by *competition for salience, coherence, and utility* in guiding behavior. Dennett’s model relies on **evolutionary and cognitive pragmatism**: narratives persist based on their success in predicting, explaining, and enabling social interaction.

  ### 2. **Accommodating Disjoint Narratives**
     - **Radical Discontinuity (e.g., Trauma, DID):** Dennett can explain fragmented reports without multiple selves:
       - **Temporal Patching:** The self-narrative is a "web of discourses" (Dennett, 1992). Disjoint episodes may be isolated "chapters" stitched together *retrospectively* for current needs (e.g., "That wasn’t *me*; I was in a dark place").
       - **Contextual Frames:** Competing narratives may dominate in different contexts (social roles, emotional states). The "self" is whichever narrative is *currently operative* for interaction.
       - **Imperfect Drafts:** Narratives are always "works in progress." Contradictions reflect *revision*, not fragmentation. The brain’s confabulation mechanisms paper over gaps post-hoc.
     - **No Hidden Author:** Arbitration isn’t done by a homunculus but by:
       - **Unconscious Processes:** Memory reconstruction, emotional salience, and social feedback shape which narrative "wins" in a given moment.
       - **Pragmatic Selection:** The narrative that best *resolves cognitive dissonance* or *maintains social coherence* prevails. E.g., a person may adopt a "survivor" identity over a "victim" narrative because it’s more functional.

  ### 3. **Avoiding Eliminativism**
     - The self isn’t eliminated but **redefined as a heuristic**:
       - **Utility Over Truth:** A narrative self exists *as if* it were real because it successfully navigates social ecosystems (e.g., holding people accountable requires treating them as unified agents).
       - **Dynamic Singularity:** Despite competing sub-narratives, the system generates a *dominant narrative trajectory* at any moment. This is the "center" — not geometrically fixed, but functionally emergent.
       - **Example:** Consider Dissociative Identity Disorder (DID). For Dennett, alters aren’t multiple selves but *disjoint narrative modules* competing for control. The "host" persona is the narrative most frequently/effectively deployed for social integration.

  ### 4. **Why Uniqueness Isn’t Required**
     - **Coherence ≠ Consistency:** Dennett’s "coherence" is pragmatic, not logical. A narrative can be *usefully incoherent* (e.g., "I’m a work in progress") if it sustains identity functions.
     - **Polycentric ≠ Fragmented:** Competing narratives can coexist under a *meta-narrative* ("I contain multitudes"). The gravitational center shifts contextually, but the *functional self* remains the locus of behavioral authorship.
     - **Social Scaffolding:** External narratives (from friends, institutions) stabilize identity. Conflicting self-reports may be reconciled socially ("Remember when you said X? Maybe you feel Y now because...").

  ### Conclusion
  Your inference is astute but overextends the physics analogy. **Dennett’s model escapes fragmentation by treating narrative gravity as a *dynamic, functional, and socially embedded* process—not a physical field.** Radically disjoint narratives don’t shatter the self; they reveal the ad-hoc, pragmatic work of narrative integration. The "center" isn’t a point but a *vector of behavioral and explanatory utility* that flexibly incorporates contradictions. This avoids eliminativism (the self is a real *pattern* of cognition) and hidden authors (arbitration emerges from cognitive competition and social feedback).

  As Dennett would argue: a messy, contradictory narrative still *functions* as a self—not by being perfectly unified, but by being "good enough" to get the job done in the human world.
