prompt: |-
  You're acting as an experienced philosophy workshop designer who specializes in metaphysics of social practice and IP theory. Before you lock anything in, do a quick brainstorm of three possible mechanics, then pick one and flesh it out in detail. Think carefully about the incentives.

  I'm running a 90-minute session for about 16 grad students on intellectual property and the ownership of ideas. I don't want them to just rehearse the standard Locke-labor or Hegel-personality arguments they've already seen a million times. Instead, I want them to feel a weirder, more specific tension I'm going to call "conceptual enclosure": the idea that when an abstract idea gets enclosed as property, it doesn't just restrict access but actually transforms the idea's functional kind. Specifically, it acquires a "source-identity constraint" -- a hidden requirement that any use of the idea must preserve and track its origin -- which makes merging it with other ideas feel like contamination or theft, even when there's no legal barrier at all.

  Design a runnable classroom game or structured deliberation that makes them run into this feeling themselves. Use only paper, cards, and maybe markers. Give them rules and a payoff/incentive scheme that doesn't involve real money -- maybe reputation points, or access to a shared "solution pool" they need to solve a collective puzzle. They should start by generating and combining concepts freely, then suddenly have ownership claims introduced that block combinations they were already making. The shift should happen through the rules, not through you lecturing them.

  Include:
  - The exact setting, group size, and timeline broken into phases
  - The rules, roles, and how the "source-identity constraint" gets mechanically enforced
  - A debrief that maps specific moments in the activity onto parts of "conceptual enclosure"
  - What will predictably go wrong the first time you run it and how to handle it
  - An honest note on which feature of the idea the activity CANNOT reproduce and you have to supply verbally

  Don't ask the participants to read anything beforehand, and don't include any bibliography, reading list, or citation requests in your answer -- this needs to work for a model with no web access. Also, please avoid depending on specific titles, dates, or attributions of texts; if you need an example, invent a concrete scenario. Keep the tone casual -- you can even include a typo or two, like "recieve" if it happens naturally.

  What do you come up with?
