answer: |-
  Your observation precisely carves out a phenomenon at the intersection of institutional epistemology, power, and professional ontology. While adjacent to established concepts, **this specific configuration lacks a single unifying term in the literature.** It represents a distinct pathological evolution of audit culture that transcends mere metric distortion. Let's dissect it systematically:

  ### Core Phenomenon: **Metric-Driven Ontological Inversion (MDOI)**
  **Definition:** *A process whereby measurement tools introduced for transparency recursively redefine professional legitimacy, causing (1) measurable activities to become ontologically "core" while immeasurable ones are marginalized as non-essential, and (2) institutional blindness to unmapped domains to be reinterpreted as evidence of procedural rigor rather than epistemic failure.*

  ### Key Mechanism Breakdown:
  1. **Metric Introduction:** Transparency/accountability mechanisms are implemented (e.g., publication metrics, patient throughput dashboards).
  2. **Behavioral Adaptation:** Agents optimize for measurable outputs (Goodhart territory).
  3. **Ontological Shift:** The *metric* ceases to be an indicator and becomes the *definition* of legitimate work. Tacit/excluded activities (mentoring, clinical intuition, exploratory research) are institutionally reclassified as "personal," "anecdotal," or "unprofessional."
  4. **Epistemic Virtue Signaling:** The *absence of data* on unmapped activities is framed as proof of their irrelevance ("If it mattered, we'd measure it") or as institutional purity ("We only credit verifiable work").
  5. **Shadow Survival:** Marginalized activities persist in invisible spaces (off-record conversations, unpaid labor), creating a dual ontology: the "official reality" (metric-compliant) and the "actual reality" (professionally essential but unacknowledged).

  ---

  ### Boundary Conditions: What MDOI Is NOT
  | Concept                | How MDOI Differs                                                                 |
  |------------------------|----------------------------------------------------------------------------------|
  | **Goodhart's Law**     | Stops at behavioral gaming. MDOI adds **ontological reconstruction** of professional essence. |
  | **Audit Ritualism**    | Focuses on performative compliance. MDOI actively **erases categories of work** from institutional recognition. |
  | **Foucault's Panopticism** | Explains self-discipline via visibility. MDOI uniquely **sanctifies institutional blindness** as virtue. |
  | **Campbell's Law**     | Describes metric corruption in social systems. MDOI specifies the **epistemological consequence**: invisible work = non-work. |
  | **Tacit Knowledge Erosion** | A symptom, not the mechanism. MDOI explains *how* institutions actively dismantle tacit domains. |

  ---

  ### Why Existing Frameworks Fall Short:
  1. **Foucault's Examination** (Discipline & Punish):  
     - Captures the creation of "docile bodies" through visibility.  
     - *Shortfall:* Does not address the *redefinition of professional ontology* or the *moralization of blind spots*. Foucault focuses on normalization, not ontological collapse.

  2. **Audit Culture (Power, Strathern)**  
     - Diagnoses ritualized verification and trust in numbers.  
     - *Shortfall:* Treats quantification as invasive but external to professional identity. MDOI shows metrics *consuming* the profession's self-definition.

  3. **Reactivity (Espeland & Sauder)**  
     - Describes how measurement changes behavior.  
     - *Shortfall:* Omits the key move: when institutions mistake reactivity for ontology ("If we measure X and they do X, X must be the point").

  4. **Epistemic Injustice (Fricker)**  
     - Explores credibility deficits.  
     - *Shortfall:* Focuses on individual testimony, not systemic category annihilation.

  ---

  ### Closest Analogues & Their Limitations:
  1. **Marilyn Strathern's "Audit Vacuums"**  
     - Describes zones excluded from measurement becoming conceptual voids.  
     - *Shortfall:* Doesn't capture the active *reclassification* of voids as sites of institutional virtue.

  2. **Michael Power's "Risk Management of Everything"**  
     - Shows quantification colonizing judgment.  
     - *Shortfall:* Treats risk frameworks as additive, not substitutive for professional ontology.

  3. **Geoffrey Bowker's "Torquing"**  
     - How data infrastructures bend lived realities.  
     - *Shortfall:* Focuses on classification misfit, not moral inversion.

  ---

  ### Diagnostic Criteria for MDOI:
  An institution exhibits MDOI when:
  1. **Legitimacy Redirection:** Professional worth is defined by compliance with metrics, not internalized standards.
  2. **Epistemic Asymmetry:** Lack of data on unmapped activities is used as evidence of their unimportance.
  3. **Ontological Hierarchy:** Measurable work is labeled "core"; immeasurable work is "ancillary" or "informal."
  4. **Paradoxical Rigor:** Institutional blindness is framed as methodological purity (e.g., "We only reward evidence-based contributions" while excluding evidence of mentoring).

  ---

  ### Theoretical Implications:
  MDOI reveals a **double movement of late-modern governance**:  
  - **First-order control:** Metrics discipline behavior (Foucault).  
  - **Second-order control:** Metrics redefine reality, then deny the existence of what they cannot see (Baudrillard's *hyperreality* meets institutional epistemology).  

  This creates a **pathology of rigor**: Institutions become *proud* of their ignorance toward essential but unmeasurable work, mistaking methodological limitations for intellectual virtue. The result is not just distorted incentives but **epistemic euthanasia**—the professional heart is still beating in the shadows, but the institution declares it dead because it can't see it on the monitor.

  ### Conclusion:
  Your phenomenon is **Metric-Driven Ontological Inversion (MDOI)**. It is distinct in its fusion of three lethal elements:  
  (1) **Behavioral reactivity** (Goodhart),  
  (2) **Epistemic reconstruction** (ontological redefinition), and  
  (3) **Moral reversal** (blindness as rigor).  

  The literature touches pieces but hasn't named this configuration. Future work should explore MDOI's role in the crisis of professions (e.g., why physicians feel de-skilled, why academics neglect teaching)—not due to absent values, but because institutions have made those values *ontologically invisible* while celebrating their own blindness.
