  hey ive been rewatching the dark knight and thinking about that old ethics debate where people say torture is okay if theres literally a bomb ticking and you caught the guy who planted it. theres the scene where batman slams the joker around in the police station trying to find out where he stashed harvey dent, and then the two boats with the detonator buttons. i wanna read the movie through the ticking-bomb idea, but with this twist i cant shake: its not just "does pain make people talk," its that batman doesnt actually know if the joker knows where dent is, and the joker knows batman doesnt know, so theres like this stacked-up ignorance that the philosophy arguments never seem to deal with. does the film show the whole scenario falls apart not because torture is immoral, but because you can never have the certainty the argument needs? and then the boats—nobody pushes the button—which seems to say people dont do the cold math the argument assumes. but batman does eventually get to dent, so maybe the movie is actually saying he was right to hit him? i want a reading that takes both the film and the debate seriously, says where the idea lights up a scene and where the movie pushes back, and especially what the film adds that the argument alone misses. also please say what would change your mind—like if batman had clearly gotten false info from the beating, or if the boat scene turned out to be a total plot hole.
