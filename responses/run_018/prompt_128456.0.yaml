prompt: |-
  I've been lurking on rationalist forums for years and usually just read, but this one's been bugging me since a seminar on just war theory. People keep using the boxing-match analogy to defend the moral equality of combatants: both sides step into the ring, they both know the rules, there's a referee applying them equally, and punching isn't wrong just because your opponent is a jerk outside the ring. The idea is that jus ad bellum and jus in bello seperate cleanly, just like the cause of the match doesn't change the rules inside it. I'm trying to figure out how far this actually holds.

  Can you map it out explicitly -- what corresponds to the gloves, the consent, the referee, the corner team, the bell? Then tell me where the mapping breaks: conscription vs voluntary entry, the fact that one side might be defending against agression while the other started it, whether the "referee" (laws of war) actually applies symetrically when one side is systematically violating them, and whether the analogy quietly imports the idea that both fighters have equal moral standing regardless of why they're fighting. I keep wondering if there's a better analogy -- maybe two people in a burning building where one lit the fire -- but I'm not sure that survives either. Does the conclusion that soldiers on both sides are morally equal actually hold up once the disanalogies are listed, or was the boxing frame carrying the whole argument?
reasoning: |-
  Okay, let me start by unpacking the user's query. They've been involved in rationalist forums and attended a seminar on just war theory. The boxing analogy for the moral equality of combatants is bothering them. They want to know how well this analogy holds up when you break it down into components like gloves, consent, referee, etc., and where it fails, especially regarding conscription, aggression, asymmetric adherence to laws of war, and underlying moral standing.

  First, I need to map the boxing elements to just war concepts. The ring is the battlefield, gloves are the rules of engagement, consent relates to voluntary enlistment vs. conscription, the referee is international law, corner team as support systems, and the bell as the declaration of war. But each of these has disanalogies. 

  The user mentions specific breakpoints: conscription vs. voluntary, defensive vs. aggressive wars, asymmetric compliance with laws of war, and the assumption of equal moral standing. These are critical because they challenge the core of the analogy. For instance, in boxing, both fighters consent, but in war, conscription removes that choice, which affects moral responsibility. 

  The referee analogy falls apart when one side systematically violates laws of war, like using human shields or torture, making enforcement impossible. Also, the corner team's role isn't neutral when medical aid is targeted. The bell's clear start/end contrasts with war's ambiguous beginnings and endings, especially in insurgencies or asymmetric conflicts.

  The user questions if the boxing frame is doing the heavy lifting in arguing for moral equality. I need to address whether the conclusion holds once these disanalogies are considered. The deeper issue here is whether jus ad bellum affects jus in bello. Historical examples like Nazi soldiers vs. Allied forces show that moral standing isn't equal when one side is clearly the aggressor. 

  The user's alternative analogy of a burning building where one started the fire introduces asymmetry, which better reflects defensive wars. But even that has limitations. The challenge is finding an analogy that captures both the regulated combat and the moral asymmetry. 

  I should also consider the user's unspoken needs. They might be looking for a more nuanced understanding of just war theory beyond simplified analogies. They could be grappling with the ethical implications for soldiers in unjust wars and whether they bear any responsibility. Their identity as a long-time lurker suggests they value thorough, logical analysis typical of rationalist discourse. 

  In conclusion, the boxing analogy works only under idealized conditions. Real-world complexities like conscription, asymmetric warfare, and moral culpability undermine it. The moral equality of combatants is more conditional than the analogy implies, leaning towards revisionist just war theory. The user's skepticism is valid; the analogy's simplicity masks critical ethical distinctions.
answer: |-
  That's an incredibly sharp critique of a common but flawed analogy. You're right to question it — the boxing match metaphor **works superficially but collapses under scrutiny precisely where the moral questions are hardest.** Let's map it explicitly and see where it breaks:

  **The Mapping (As Intended by Proponents of Moral Equality of Combatants):**

  1.  **The Ring:** The battlefield. A designated, bounded space for conflict.
  2.  **The Gloves:** The Laws of Armed Conflict (LOAC) / *Jus in Bello* (e.g., distinction, proportionality, prohibitions on certain weapons, humane treatment of POWs). Constraints designed to limit harm.
  3. **The Consent:** Soldiers voluntarily joining the military (implicitly agreeing to the "rules of the game") or states accepting the LOAC. "Stepping into the ring."
  4.  **The Referee:** International law, tribunals (ICC, ICJ), or the mutual expectation/pressure to adhere to LOAC. The enforcing mechanism.
  5.  **The Corner Team:** Medics, chaplains, logistics, command structure. Support systems operating under the rules (e.g., protected medical personnel).
  6.  **The Bell:** Declaration of war / commencement of hostilities (clear start) and ceasefire/peace treaty (clear end).
  7.  **The Fighters:** Individual combatants on opposing sides.
  8.  **The Outcome:** Victory/defeat, decided by force within the rules. The "cause" (why the fight is happening) is irrelevant *during* the fight regarding the permissibility of actions *within* the rules.

  **Where the Mapping Breaks Catastrophically:**

  1.  **Consent vs. Conscription/Coercion:**
      *   **Boxing:** Fighters *voluntarily* contract to fight. Consent is explicit and individual.
      *   **War:** Many combatants are conscripted. Even "volunteers" often join for complex reasons (patriotism, economic necessity, social pressure, lack of alternatives) under state propaganda. **Break:** Individual consent to the "rules of the ring" and the risk of being killed is often absent or heavily coerced. A conscript defending their homeland didn't "choose to step in" like a boxer.

  2.  **Asymmetry of Cause (*Jus Ad Bellum*):**
      *   **Boxing:** The "cause" is irrelevant *to the rules of the fight itself*. A boxer fighting for money vs. pride doesn't change what punches are allowed.
      *   **War:** One side is often the clear aggressor (*jus ad bellum* violation), the other is defending itself or others. **Break:** The fundamental moral justification for *being in the fight at all* is radically different. Punching isn't wrong in boxing because the opponent is a jerk *outside*; but killing an invading soldier actively trying to conquer your country *is* fundamentally different (morally and legally) from killing a defender. The "cause" defines the very nature of the violence. Your "burning building" analogy highlights this asymmetry perfectly: the fire-starter actively creating the lethal situation vs. the victims trying to escape/survive.

  3.  **The "Referee" is Broken/Asymmetric:**
      *   **Boxing:** A single, impartial, *present*, and *empowered* referee enforces rules *equally* in real-time.
      *   **War:** The "referee" (LOAC enforcement) is:
          *   **Absent/Weak:** No real-time, impartial enforcer on the battlefield.
          *   **Asymmetric:** One side may systematically violate LOAC (e.g., using human shields, torture, indiscriminate attacks), making reciprocal adherence difficult or strategically suicidal for the other side.
          *   **Unreliable:** Enforcement (tribunals) is slow, political, and often only applies to the losers.
          *   **Ignored:** Powerful states or non-state actors may simply disregard it. **Break:** The analogy assumes a level playing field and fair enforcement that simply doesn't exist. A boxer cheating constantly with an absent ref fundamentally breaks the analogy's core premise of shared rules.

  4.  **The "Corner Team" is a Target:**
      *   **Boxing:** Cornermen are protected and essential to the contest's rules.
      *   **War:** Medical personnel, chaplains, and even clearly marked ambulances/hospitals are frequently targeted. Logistics and command centers are legitimate military objectives. **Break:** The support structures aren't neutrally protected; they are integrated parts of the war machine and often deliberately attacked.

  5.  **No Clear Bell:**
      *   **Boxing:** Defined start and end.
      *   **War:** Hostilities often begin without declaration (e.g., Pearl Harbor, 9/11), involve prolonged low-intensity conflict, insurgencies with no clear command structure, and end ambiguously (ceasefires that break, "forever wars"). **Break:** Combatants don't clearly "step in" or "step out," and the "fight" state is often murky.

  6.  **The Core Moral Equality Assumption:**
      *   **Boxing:** Moral equality *within the ring* is assumed because both consented to the *same* rule-bound contest for *similar* stakes (winning the match).
      *   **War:** This is the **central, smuggled-in premise**. The analogy *assumes* that participation in the "ring" confers equal moral standing *regardless of why they are there*. **Break:** A soldier fighting in a war of conquest for a genocidal regime is fundamentally *not* morally equivalent to a soldier defending their home from that conquest, *even if both follow LOAC perfectly*. Their roles in the larger moral wrong (the unjust war) are different. The boxing analogy erases this distinction by focusing *only* on the "in the ring" actions, artificially severing *jus in bello* from *jus ad bellum*.

  **Conclusion: Does Moral Equality Hold Up?**

  The boxing analogy **does most of the heavy lifting** for the moral equality thesis. Once you expose its disanalogies – especially concerning consent, the asymmetry of *jus ad bellum*, the broken "referee," and the smuggled-in assumption of equal standing – **the conclusion that soldiers on both sides are *always* morally equal crumbles.**

  *   **The Revisionist View (e.g., McMahan):** Argues that *jus ad bellum* directly affects *jus in bello*. Soldiers fighting for an unjust cause generally lack the moral right to kill soldiers fighting justly (who retain their right to self-defense). Only in very rare cases of symmetric, mutual aggression might moral equality hold.
  *   **The Pragmatic/Institutional View:** Argues that while *deep morality* might distinguish between just/unjust combatants, *operational law and practice* must treat them equally under LOAC *for practical reasons*: to incentivize compliance by all sides, protect civilians, manage reciprocity, and allow for post-conflict reconciliation. This is a rule of *practice*, not deep morality.
  *   **The Moral Reality:** Most agree that a conscript defending their home against a genocidal invader is in a profoundly different moral position than a volunteer in the invading army, even if both technically follow LOAC. The boxing analogy obscures this by framing war as a consensual, rule-bound sport rather than a lethal political act often initiated by aggression.

  **Your "Burning Building" Analogy:** This is a **significant improvement** in capturing the core *asymmetry*:
  *   **The Aggressor:** Deliberately starts the fire (unjust war).
  *   **The Defender:** Fights to escape/survive/put out the fire (just war).
  *   **Moral Status:** The fire-starter actively creates the lethal threat; the defender's violence is reactive and defensive. Their moral standing *is* different.
  *   **Limitation:** It doesn't capture the *regulated conduct* aspect of LOAC (*jus in bello*) well. Even the defender shouldn't, say, shove innocent bystanders into the fire to escape (violating proportionality/distinction).

  **Final Thought:** The boxing analogy is seductive because it offers a clean, symmetric, rule-bound model. But war is messy, asymmetric, and deeply morally fraught. While LOAC (*jus in bello*) strives for symmetric application *as a practical legal and humanitarian tool*, the underlying **moral equality of combatants is not a deep truth revealed by the analogy; it's an assumption smuggled in *by* the analogy** that dissolves under the realities of aggression, lack of consent, and the fundamental link between the justice of the war and the moral status of those fighting it. Your skepticism is well-founded.
