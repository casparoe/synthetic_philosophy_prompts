  **INTERNATIONAL STANDARD IBMCM 23800:2028**  
  **Comparative Atrocity Assessment (CAA) — Protocols and Metrication**

  **Foreword**  
  The International Bureau for Moral Catastrophe Metrics (IBMCM) establishes protocols for the objective quantification of mass human suffering events. This standard ensures methodological rigor, inter-rater reliability, and ethical compliance in assigning comparative magnitudes to historical catastrophes. Compliance requires adherence to clauses 1–8 and relevant annexes.

  **1 Scope**  
  This document specifies requirements for the quantification, weighting, and ordinal ranking of large-scale moral catastrophes (LSMCs) through standardized metrics. It defines the Brennan-Chen Weighted Harm Coefficient (BC-WHC), establishes criteria for No-Comparison Exemption (NCE), and mandates calibration against the IBMCM Reference Suffering Index (RSI-12).

  **2 Normative References**  
  - IBMCM TR 17244:2026: *Demographic Displacement Ratio (DDR) Calculation Methodology*  
  - IBMCM TR 18901:2027: *Temporal Suffering-Duration Index (SDI) – Logarithmic Scaling*  
  - *IBMCM Ethical Compliance Framework for Historical Analysts (ECF-HA), 3rd Ed.*  

  **3 Terms and Definitions**  
  3.1 **Moral Catastrophe:** An event or sequence of events resulting in documented, widespread infliction of severe physical or psychological suffering or mortality upon a civilian population, exceeding normative societal harm thresholds defined in RSI-12.  
  3.2 **Moral Obscenity:** A statistically significant deviation (>3σ) from the inter-subjective consensus range for assigned harm weights during CAA calibration, indicating procedural or interpretive failure.  
  3.3 **Intentionality Factor (IF):** A multiplier (range: 1.0-2.0) applied to base mortality/displacement figures, derived from documented perpetrator intent statements and institutional planning records.  
  3.4 **Double-Counting Mitigation (DCM):** A protocol requiring analysts to subtract overlapping victim identities (e.g., individuals experiencing multiple qualifying harms within a single LSMC timeframe) using probabilistic population cohort modelling.  
  3.5 **Category Omega (Ω):** A classification denoting an LSMC subject to the No-Comparison Exemption (Clause 7), rendering it incomparable to non-Ω events.  

  **4 Brennan-Chen Weighted Harm Coefficient (BC-WHC)**  
  4.1 The BC-WHC shall be the primary output metric for CAA, expressed as a dimensionless figure.  
  4.2 Calculation:  
  > BC-WHC = [ (ADJ_MORT × IF) + (DDR × POP_BASE^0.5) + Σ(SDI_t × INTENSITY_t) ] × DCM  
  > Where:  
  > - ADJ_MORT: Baseline mortality, age/life-expectancy adjusted per IBMCM 17244 Annex C.  
  > - POP_BASE: Pre-event population of the affected group(s).  
  > - SDI_t: Suffering-Duration Index for time period *t*, logarithmically scaled (IBMCM 18901).  
  > - INTENSITY_t: Mean suffering intensity score (1-10 scale) for period *t*, derived from survivor testimony aggregation (≥ 3 independent analyst ratings required).  
  4.3 **Diminishing Returns Principle:** For populations experiencing >50% mortality or displacement within a single calendar year, the BC-WHC shall apply a progressive discount factor (γ = 0.85^(n-1) for suffering instances *n* > 3 per unique victim identifier cluster) to mitigate metric saturation distortion.

  **5 Inter-Rater Reliability and Dispute Resolution**  
  5.1 Where historian/analyst disagreement on input parameters (e.g., ADJ_MORT, IF, INTENSITY_t) exceeds ±15%, a Delphi panel (minimum 7 certified IBMCM assessors) shall be convened.  
  5.2 Panelists shall submit anonymized inputs; the median value becomes binding after 3 iterative rounds or upon achieving SD < 10% of the mean.  
  5.3 Persistent disagreement triggering Moral Obscenity (3.2) mandates automatic referral for Category Omega assessment (Clause 7).

  **6 Calibration and Normalization**  
  6.1 All BC-WHC outputs shall be normalized against the IBMCM RSI-12 baseline (Holodomor 1932-33 = 100.0).  
  6.2 Events scoring within ±5% BC-WHC after normalization are assigned equivalent ordinal rank (Tier).  
  6.3 Tier boundaries are re-evaluated biennially by the IBMCM Standing Committee on Metric Recalibration.

  **7 No-Comparison Exemption (NCE) and Category Omega (Ω)**  
  7.1 An LSMC may be proposed for Ω classification if either:  
  > a) Application of standard CAA metrics induces documented psychological harm or cultural offense in >20% of surveyed descendant populations (IBMCM Form ECF-HA/Ω-1); OR  
  > b) Standardization attempts consistently produce Moral Obscenity (3.2) across ≥3 independent assessment cycles.  
  7.2 Ω certification requires unanimous approval by the IBMCM Ethics Oversight Board.  
  7.3 Ω-certified events are excluded from published ordinal rankings. Their BC-WHC (if calculable) is archived internally under Protocol S-23 (Restricted Access) and marked "NCE-Ω: Incomparable."

  **Annex A (Normative): BC-WHC Calculation Worksheets**  
  *(Detailed computational templates omitted for brevity)*

  **Annex B (Informative): Worked Example – Comparative Assessment**

  **B.1 Case Selection:** Holocaust (1933-1945) vs. Rwandan Genocide (1994).  
  **B.2 Input Parameterization (Abridged):**  
  *Holocaust:*  
  - ADJ_MORT: 5,800,000 (Consensus median, Delphi-certified)  
  - IF: 1.95 (Wannsee Protocol, Einsatzgruppen reports)  
  - DDR: 9,200,000  
  - SDI_Total: 4380 (Duration: 12 years; Logarithmic scaling applied)  
  - INTENSITY_Mean: 9.2 (Testimony aggregation; low dispersion)  
  - DCM: 0.98 (Minor overlap in ghetto/deportation phases)  
  *Rwandan Genocide:*  
  - ADJ_MORT: 800,000 (Consensus median)  
  - IF: 1.89 (RTLM broadcasts, militia training manuals)  
  - DDR: 2,500,000  
  - SDI_Total: 93 (Duration: 100 days; Logarithmic scaling)  
  - INTENSITY_Mean: 9.7 (Extreme violence compression; high dispersion noted)  
  - DCM: 0.99 (Minimal temporal overlap)

  **B.3 BC-WHC Calculation:**  
  *Holocaust:*  
  [ (5.8e6 * 1.95) + (9.2e6 * √9e6) + (4380 * 9.2) ] * 0.98 = **1,427,350**  
  *Rwandan Genocide:*  
  [ (8e5 * 1.89) + (2.5e6 * √7e6) + (93 * 9.7) ] * 0.99 = **284,115**  

  **B.4 Normalization (RSI-12 Baseline):**  
  Holocaust: 1,427,350 / 100 (Holodomor Baseline) → **14,273.5 RSI**  
  Rwandan Genocide: 284,115 / 100 → **2,841.2 RSI**  

  **B.5 Initial Ordinal Assignment:**  
  - Holocaust: Tier 1 (RSI > 10,000)  
  - Rwandan Genocide: Tier 3 (RSI 1,000 – 5,000)

  **B.6 Metric Breakdown and NCE Invocation:**  
  B.6.1 **Diminishing Returns Application:** Holocaust γ-factor significantly reduces BC-WHC contribution from victims subjected to ghettos → camps → extermination sequence (n>3 suffering instances). Rwandan Genocide γ = 1.0 (n≤3 for most victims).  
  B.6.2 **Moral Obscenity Trigger:** Post-calculation Delphi review of Holocaust INTENSITY scores revealed SD > 25% of mean due to disputes over weighting starvation vs. industrial murder. Rwandan Genocide INTENSITY dispersion (focused brutality) also exceeded ±15%.  
  B.6.3 **NCE-Ω Protocol Initiation:**  
  - Holocaust descendant survey (ECF-HA/Ω-1) indicated 92% rejection of comparative ranking.  
  - Rwandan stakeholder consultation indicated 78% rejection (+22% conditional acceptance only vs. other African events).  
  - Both events induced Moral Obscenity in cross-calibration trials (T-test p<0.001).

  **B.7 Outcome:**  
  Ethics Oversight Board invoked Clause 7.2. Both events granted Category Omega (Ω) status unanimously. BC-WHC scores archived under S-23. Final published ranking: "NCE-Ω Incomparable." **Calibration deemed successful:** The Ω classification resolved metric distortion and ethical non-compliance, confirming the framework's capacity to identify inherent limits of comparison. Ordinal tier assignment is procedurally correct but ethically superseded by NCE-Ω status, demonstrating system robustness.

  ---
  **END OF DOCUMENT**  
