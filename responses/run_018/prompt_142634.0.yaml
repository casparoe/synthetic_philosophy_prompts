prompt: |-
  I'm taking this bioethics course and I also volunteer screening protocols for my school's research review board, which sounds fancier than it is—basically I check consent forms before they go to faculty. I need a decision procedure I can run in about 15 minutes that turns whatever philosophers actually mean by valid consent into steps I can use, especially around deception, coercion, and competence. Don't just list standard textbook stuff; I need ordered checks: what do I verify first, what counts as a pass, where do I have to hand it up to the board because it's a values call not a fact check, and where will this thing definitely misfire? Make sure it handles the weird middle cases—like when a study uses what I'd call structural deception, where nothing is technically lied about but the framing makes people think it's about one thing when it's testing something else, and when competence isn't binary but kind of gradient across different parts of the decision. Apply it to three protocols: one with mild deception in a memory study, one recruiting people immediately after they recieve bad medical news, and one with a technically perfect form but payment that's like three months rent for the target group. I want the answer in American English, and I need you to flag the case where the procedure tells me to reject something that probably shouldn't be rejected. Also please don't just give me a bibliography—I'm writing this for myself, not a paper.
reasoning: |-
  Okay, the user is involved in bioethics and volunteer screening for their school's research review board. They need a practical, step-by-step decision procedure to evaluate consent forms, focusing on deception, coercion, and competence. They want something they can run in 15 minutes, not just textbook theory. 

  First, I need to understand their actual needs. They're dealing with real-world protocols and want clear, ordered checks. The key points are: ordered steps, pass/fail criteria, when to escalate to the board, and where the procedure might misfire. They also want it applied to three specific cases.

  The user mentioned "structural deception" and gradient competence. That's important. Standard guidelines might not cover these nuances. They need a method that catches when the framing misleads participants without outright lying. Also, competence isn't binary; someone might understand some parts but not others. The procedure must handle these gray areas.

  They want American English, no bibliography. This is for personal use, not academic. So the language should be straightforward, avoiding jargon where possible. Also, they want a case flagged where the procedure might incorrectly reject a protocol. That shows they're aware of potential flaws and want transparency.

  Looking at the three protocols: mild deception in memory study, recruiting after bad medical news, and high payment. Each tests different aspects. The memory study has deception but it's mild. The medical news case involves vulnerability and possible impaired competence. The high payment could be coercive, especially if the target group is poor. 

  For the decision procedure, I need to structure it in phases. Start with foundational checks like basic elements of consent. Then move to competence - is the participant capable? Then coercion, then deception. End with a final call. Each step should have clear pass/fail and escalate criteria.

  The misfires section is crucial. They know no procedure is perfect. Need to point out where it might be too strict, like with high payments. In some cases, high payment might be the only way to include marginalized groups, so rejecting it could be counterproductive. That's the case to flag - where the procedure says reject but maybe shouldn't.

  Also, the user is a volunteer, not a full ethics board member. They need to know when to pass it up the chain. Highlighting the "values call" points is key. For example, structural deception isn't always wrong but needs higher scrutiny. Competence gradients require judgment on whether gaps are critical.

  For the applications: 
  - Memory study: deception is mild, not structural. Probably pass but need debriefing. 
  - Medical news: high risk of impaired competence. Escalate to board, maybe require a delay or support person. 
  - High payment: calculate coercive potential, escalate if it's too high. But flag that rejecting based on payment alone might exclude needy participants unfairly.

  The thought process should reflect balancing ethical rigor with practicality. The user doesn't have time for deep analysis each time, so the procedure must be efficient yet thorough. Highlighting where it might misfire builds trust by showing awareness of limitations.
answer: |-
  Here’s a **15-Minute Consent Triage Procedure** designed for real-world protocol screening. It prioritizes red flags, separates fact-checks from value judgments, and targets your edge cases. Run it in this order:

  ---

  ### **PHASE 1: FOUNDATION CHECKS (2 min)**  
  *Check for non-negotiable basics. FAIL here = reject or demand rewrite.*  
  1. **Core Elements Present?**  
     - ☑️ Study purpose *described* (even if incomplete due to deception)  
     ☑️ Procedures listed (time, tasks, risks)  
     ☑️ Voluntary participation statement  
     ☑️ Right to withdraw  
     ☑️ Contact info for PI + IRB  
     *→ PASS if all present; FAIL if any missing.*  

  2. **Literal Truth Test**  
     - Scan for **explicit false statements**.  
     - *→ PASS if zero lies; FAIL if found (e.g., "This won't cause discomfort" when it clearly will).*  

  ---

  ### **PHASE 2: COMPETENCE ASSESSMENT (4 min)**  
  *Focus on capacity to understand THIS decision. Gradient check.*  
  1. **Population Risk Flag:**  
     - Is the target group inherently vulnerable? (e.g., children, dementia patients, non-English speakers without translation).  
     - *→ If YES, escalate to board IMMEDIATELY. Not your call.*  

  2. **Clarity Audit:**  
     - Read the "Key Procedures" and "Risks" sections aloud.  
     - **FAIL if:**  
       - Sentences > 25 words or Flesch-Kincaid grade level > 8th grade.  
       - Jargon without plain-language definitions (e.g., "fMRI" without "brain scan").  
       - Critical info buried in dense paragraphs.  

  3. **Contextual Impairment Probe:**  
     - *Is consent sought during a high-stress/impairment event?* (e.g., post-bad medical news, mid-crisis).  
     - **→ If YES, protocol MUST require:**  
       - Cooling-off period (e.g., "wait 24h before signing")  
       - Offer of a support person present during consent  
       - *Absent these? Escalate to board.*  

  ---

  ### **PHASE 3: COERCION SCREEN (3 min)**  
  *Pressure = undue influence beyond life’s normal incentives.*  
  1. **Payment Danger Ratio:**  
     - Calculate: **Payment ÷ Avg. Monthly Income of Target Population**  
       - < 1% = Low risk  
       - 1-10% = Moderate (escalate if combined with vulnerability)  
       - **> 10% = HIGH RISK** (e.g., $1,500 for low-income group where rent = $500 → 300%)  
       - *→ >10%? Escalate to board. Values call: Is payment "undue inducement" or fair compensation?*  

  2. **Authority Pressure:**  
     - Is recruiter in a position of power? (e.g., professor recruiting students, doctor recruiting patients).  
     - **→ If YES, protocol MUST include:**  
       - Written assurance that refusal/withdrawal won’t affect care/grades  
       - Alternative recruitment by neutral party (e.g., not the patient’s own doctor)  
       - *Missing? Escalate.*  

  ---

  ### **PHASE 4: DECEPTION EVALUATION (4 min)**  
  *"Structural deception" is the priority blind spot.*  
  1. **Active vs. Omission Test:**  
     - **Active Deception:** Explicit lie? (e.g., "You are seeing real patient profiles" when they’re actors).  
       - → *If present, requires*: Strong justification + rigorous debrief protocol. Escalate if debrief is weak.  
     - **Structural Deception:** Framing implies false purpose? (e.g., consent form says "study about workplace communication" but real aim is testing racial bias).  
       - → **Trigger:** Does the *omitted true purpose* fundamentally alter risk/benefit? (e.g., hiding that a stressor induces shame).  
       - **→ If YES, escalate to board. Structural deception needs board-level harm/benefit weighing.**  

  2. **Debrief Adequacy Check:**  
     - **Must include:** Full truth reveal + rationale for deception + chance to withdraw data *post-debrief*.  
     - **→ FAIL if debrief is vague, delayed >48h, or lacks withdrawal option.**  

  ---

  ### **PHASE 5: FINAL CALL (2 min)**  
  - **Reject** only if PHASE 1 fails or debrief is absent in deception studies.  
  - **Escalate to board** for: High payment ratios, contextual impairment safeguards missing, structural deception with risk shift, competence red flags.  
  - **Approve** only if all passes AND no escalation triggers.  

  ---

  ### **APPLICATION TO YOUR PROTOCOLS**  
  **1. Mild Deception (Memory Study)**  
  - *"We told participants they’d do memory tasks, but didn’t mention we’re testing distraction by embedded negative images."*  
    - **Verdict:** Phase 4 → Structural deception? Framing omission doesn’t change physical risk. Debrief must include true purpose + data withdrawal option. *PASS if debrief solid.*  

  **2. Post-Bad Medical News Recruitment**  
  - *Recruiting in ER after cancer diagnosis.*  
    - **Verdict:** Phase 2 → Contextual impairment = HIGH. Protocol lacks 24h wait period or support person? *ESCALATE TO BOARD. Likely reject without safeguards.*  

  **3. Technically Perfect Form + High Payment**  
  - *$1,500 for 2 hours from homeless population (avg. monthly income ~$500).*  
    - **Verdict:** Phase 3 → Payment = 300% monthly income → **>10% Danger Ratio**. *ESCALATE TO BOARD.*  
    - **🚩 FLAGGED MISFIRE CASE:** This procedure says escalate, but *this might be ethically defensible*. If the study directly benefits homeless populations (e.g., testing a housing intervention), high payment could be *restorative justice*. The board might approve it. **Procedure misfires by being overly rigid on payment thresholds without context.**  

  ---

  ### **WHERE THIS MISFIRES (Know the Limits)**  
  1. **Cultural Framing:** A "voluntary" statement may not suffice if cultural norms imply obligation (e.g., signing whatever an elder provides). You can’t catch this in docs alone.  
  2. **Competence Gray Zones:** A schizophrenic patient stable on meds might understand risks but not purpose. Procedure flags it, but board needs clinical input.  
  3. **Coercion via Omission:** Not disclosing that *refusing* participation means losing access to free care (e.g., in clinic-based studies). Hard to spot without context.  

  **Keep in your back pocket:** When in doubt, ask: *"Would a reasonable person feel misled, pressured, or unable to grasp what they’re signing up for?"* If yes, escalate. Your job is **triage**—not playing ethicist. Pass the hard calls up.
