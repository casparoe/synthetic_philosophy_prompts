prompt: |-
  You're a philosophy-of-language expert who's hosted a few podcasts. I'm prepping a Q&A with an invented philospher—call her Dr. K—who defends a hybrid exressivist take on normative language: moral sentences express both a belief-like state and a non-cognitive attitude, arranged so embedding in conditionals doesn't collapse into pure descriptivism. I want 8-10 interview questions that actually dig into the Frege-Geach problem rather than letting her name-check Blackburn or Gibbard. Please think carefully and start by brainstorming the three standard escape routes she'll probably have in her pocket; then draft the questions.

  Requirements: at least one on whether embedding in 'If murder is wrong, then...' forces the attitude-state to be propositional after all; one on disagreement between agents with different commitments—can they share the hybrid state, or does the belief-component smuggle descriptivism back in; one on negation without generating contradictory belief; and for each, include a follow-up keyed to her likeliest reply (probably something like 'it's a world-directed disposition' or 'the cognitive part just handles the logic'). Keep it casual—this is for a rationalist-adjacent audience, not a journal. No generic 'how'd you get into philosophy' stuff.

  End with a one-line summary as the very last line: Verdict: [the crux that makes hybrid expressivism either collapse into descriptivism or stay genuinely non-cognitive].
reasoning: |-
  Okay, the user wants me to act as a philosophy-of-language expert to create interview questions for a fictional philosopher, Dr. K, who defends hybrid expressivism about normative language. They specifically want questions that deeply engage with the Frege-Geach problem without just name-dropping theorists like Blackburn or Gibbard.

  I need to recall what hybrid expressivism is - it's the view that moral sentences express both a cognitive belief-like state and a non-cognitive attitude. The Frege-Geach problem challenges how such views can handle embeddings like conditionals without collapsing into descriptivism. For example, in "If murder is wrong, then getting your brother to murder is wrong," the antecedent ("murder is wrong") doesn't seem to be expressing an attitude directly, but the logic still works, which is tricky for expressivists.

  The user has specific requirements: include questions on embedding in conditionals forcing propositionality, disagreement between agents, negation without contradiction, and follow-ups for each. They also want a casual tone for a rationalist-adjacent audience, ending with a one-line verdict on the crux issue.

  First, I should brainstorm the three standard escape routes Dr. K might use, as the user mentioned. These are common strategies hybrid expressivists employ to tackle Frege-Geach:

  1. **Semantic ascent/attitude-types:** This involves claiming that in embeddings, the attitude shifts to being about the attitude itself rather than directly expressed. For instance, in a conditional, you're not expressing disapproval of murder but considering disapproval hypothetically. Blackburn used this with his "Hooray!" operator idea.  
  2. **Bifurcated content:** Here, the content is split - the cognitive part handles truth conditions and logic, while the non-cognitive part expresses attitudes. Gibbard's norm-expressivism does this by having the belief-component represent plans or norms.  
  3. **World-directed dispositions:** This frames the non-cognitive state as a disposition that responds to how the world is, making it proposition-like without being fully descriptive. For example, "wrong" might express a disposition to disapprove based on facts.  

  Now, I need to craft 8-10 questions that dig into these without being superficial. I'll aim for 9 questions to cover the requirements thoroughly. Let me outline them based on the key areas:

  - **Embedding in conditionals:** Questions about how "if murder is wrong" works without expressing an attitude, and a follow-up on whether this makes the attitude propositional.  
  - **Disagreement:** Questions on whether agents with different commitments can share the hybrid state, and a follow-up on if the belief-component sneaks in descriptivism.  
  - **Negation:** Questions on how "murder isn't wrong" avoids expressing contradictory beliefs, with a follow-up on the dispositional angle.  
  - Additional angles: Quasi-realism, truth predicates, and propositional anaphora to test the boundaries.  

  For each main question, I'll include a follow-up that anticipates Dr. K's likely replies, such as "it's a world-directed disposition" or "the cognitive part handles logic." I'll keep the language casual and engaging, avoiding jargon where possible.

  Finally, I'll end with the one-line verdict as specified. The crux, in my view, is whether the non-cognitive component remains genuinely non-propositional or if it's subtly assimilated into descriptivism through the cognitive machinery. That's what makes hybrid expressivism unstable.

  I'll structure the response with the brainstormed escape routes first, then the questions, and end with the verdict. This should satisfy the user's request for depth and specificity while making it accessible.
answer: |-
  Here are the 3 standard escape routes hybrid expressivists use against Frege-Geach, followed by interview questions drilling into the cruxes. Dr. K will likely lean on variations of these:

  **Brainstormed Escape Routes:**
  1. **Semantic Ascent/Attitude-Types:** In embeddings, the non-cognitive attitude isn’t *expressed* but *mentioned* (e.g., in "if murder is wrong", "wrong" refers to the *type* of attitude, not its occurrence).  
  2. **Bifurcated Content:** The cognitive component carries truth-apt, propositional content for logical embedding, while the non-cognitive component remains "attached" but inert in inferences.  
  3. **World-Directed Dispositions:** The non-cognitive state is a *disposition to respond* to worldly properties (e.g., "wrong" expresses a disposition to disapprove *if* certain facts hold), making it "about" the world without being a belief.  

  ---

  **Interview Questions for Dr. K:**  
  *(Casual tone, rationalist-adjacent audience)*  

  1. **Core Embedding Test:**  
     When I say "If murder is wrong, then stealing is wrong", the antecedent "murder is wrong" isn’t expressing my actual disapproval—it’s just hypothetical. But if your view says moral claims *express* attitudes, how does that expression get "turned off" in the conditional without turning the whole thing into a dry description of attitudes?  
     *→ Follow-up (if she invokes "dispositions" or "cognitive logic-handling"):* If the attitude-component is dormant in conditionals, and the cognitive part does all the logical heavy lifting, why isn’t this just descriptivism with extra steps? What’s left of expressivism?  

  2. **Disagreement & Shared States:**  
     Suppose Alice says "Capitalism is just" and Bob says "Capitalism is unjust". They clearly disagree. But if Alice’s view expresses [belief that capitalism maximizes freedom + pro-attitude], and Bob’s expresses [belief that capitalism causes oppression + con-attitude], do they share *any* overlapping hybrid state? Or is the "belief" part doing all the work in explaining their conflict?  
     *→ Follow-up (if she says the cognitive component grounds disagreement):* If their disagreement boils down to clashing beliefs (e.g., about freedom or oppression), haven’t you smuggled in descriptivism? What’s the non-cognitive part actually adding to the *conflict*?  

  3. **Negation Without Contradiction:**  
     How does "Murder isn’t wrong" work on your view? It can’t just express *not disapproving* of murder—that’s too weak (I might not disapprove of jaywalking without thinking it’s *not wrong*). And if it expresses a belief that murder lacks "wrongness properties", doesn’t that force you to treat "wrongness" as a real property?  
     *→ Follow-up (if she calls it a "dispositional absence"):* If "not wrong" means something like "lacks the property that would trigger my disapproval-disposition", doesn’t that disposition still point to a property in the world? How is this different from a realist belief?  

  4. **Truth Predicates:**  
     When we say "'Murder is wrong' is true", does this express (a) a belief *about* the hybrid state, (b) the original hybrid state itself, or (c) something else? If (a), how is this not meta-ethical descriptivism? If (b), how does "is true" *embed* the attitude without messing up logic?  

  5. **Propositional Anaphora:**  
     In "Murder is wrong. Sam believes *that*", the "that" seems to refer to a proposition. If your hybrid state isn’t fully propositional, what is "that" picking out? If it *is* propositional, what’s left of the non-cognitive "express" part?  

  6. **Quasi-Realist Pressure:**  
     Hybrid views often sound like they’re describing *moral facts* (e.g., "wrongness" = whatever triggers disapproval). How do you avoid sliding into quasi-realism where "attitudes" just track mind-independent properties?  

  7. **The Disposition Gambit (Deep Cut):**  
     You’ve mentioned "world-directed dispositions". But if my disapproval-disposition is *contingent* on how the world is (e.g., I’d disapprove of murder *if* it caused suffering), isn’t the disposition itself reducible to a belief about suffering + a con-attitude toward it? Doesn’t this collapse the hybrid into regular beliefs + desires?  

  8. **Logical Blindspots:**  
     Take a modus ponens: "If lying is wrong, telling your kid Santa exists is wrong. Lying is wrong. ∴ Telling your kid Santa exists is wrong." On your view, does the conclusion *express* disapproval of Santa lies? If yes, how did logic "generate" a new attitude from premises where attitudes weren’t expressed? If no, isn’t the logic broken?  

  9. **The Non-Cognitive Payoff:**  
     Give me a concrete scenario where your hybrid view *behaves differently* from plain descriptivism. If all the logic, disagreement, and negation are handled by the cognitive component, when does the non-cognitive part actually matter?  

  ---

  **Verdict:** *The crux is whether the non-cognitive component remains irreducibly non-propositional once logic, truth, and disagreement are fully accounted for by the cognitive machinery.*
