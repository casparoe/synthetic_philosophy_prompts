  The user might be testing if epiphenomenalism can withstand semantic objections. Their deeper need could be understanding if consciousness can be non-physical without losing subjective reportability. The strongest move for the epiphenomenalist is to reject causal regulation for phenomenal terms, maybe invoking acquaintance. But that's contentious. 

