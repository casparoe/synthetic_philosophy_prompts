       - NI: This agent lacks free will because the action does not flow from a coherent self-narrative and the agent does not endorse the value behind the choice (if any). The agent is not acting freely in these moments.
       - MCP: If the agent could have done otherwise at that moment and the choice was not fixed by prior states, then the agent had free will in that moment.

  3. **Crux 3: Does a synthetic agent with perfect value-coherence but zero genuinely open branches count as possessing free will?**
     - **Case**: Consider a deterministic robot programmed to always act in accordance with a perfectly coherent set of values. The robot can reflectively revise its values over time but only in predetermined ways. At every decision point, only one future is open (the one fixed by its programming and inputs). However, the robot has a coherent self-narrative and its actions always flow from its values.
       - NI: This robot has free will because it has the diachronic capacity to maintain, revise, and endorse its values. The lack of genuine openness at each moment does not matter.
       - MCP: This robot lacks free will because at no point is there a genuinely open future. The robot is merely a deterministic automaton.

  ### Part 4: Verbal Dispute Identification

  We examine if any part of the dispute is merely verbal. A verbal dispute occurs when the parties are using the same terms with different meanings, and if they clarified the meanings, they would realize they agree.

  In this case:

  - The term "free will" might be used differently. NI is defining free will as requiring narrative coherence and diachronic capacity, while MCP defines it as requiring openness at the moment of choice.

  However, the two positions are not merely verbal because they are making substantive claims about what is necessary for free will. Even if we disambiguate the term, they would still disagree on what conditions are necessary for the kind of free will that is worth wanting.

  But note: the definitions are about what is "worth wanting". This might be a point of convergence? Both agree that free will is worth wanting for moral responsibility and autonomy, but they disagree on what features are required for that.

  Therefore, the dispute is substantive.

  ### Drafting the Document

  **Joint Statement on Free Will Worth Wanting**

  **Section 1: Agreed Claims**

  We, the narrative-integrationist and the moment-of-choice pluralist, after a good-faith adversarial collaboration, agree on the following points:

