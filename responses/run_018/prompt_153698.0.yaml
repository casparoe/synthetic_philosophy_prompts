prompt: |-
  I'm drafting a scene for my novel where a older ethicist—she's not some tech-bro, more like a retired professor who thinks strong longtermism gets everything backwards—gets interveiwed on a small podcast about future people. She has this weird but specific view that our moral concepts are built for face-to-face reciprocity and just break when we try to apply them across ten thousand years, so she definately rejects the usual "astronomical stakes" framing and instead talks about "conceptual architecture." I need about eight questions that don't let her just recite Bostrom-style numbers. At least one should press her on whether longtermism secretly collapses into presentism if we can't individuate future people, one on the replaceability objection—that saving a future life just replaces it with another, so there's no net moral gain—and one on whether reducing existential risk is actually just risk-shifting onto present poor people who need those resources now. For each, include a follow-up that anticipates her standard dodge—she loves saying "moral distance isn't spatial distance, it's conceptual architecture"—and pushes back hard on that phrase specifically.

  Please start with the actual questions right away, no preamble or "here they are" intro. And don't ask for citations, a bibliography, or page numbers—if you mention anyone by name just paraphrase, since I'm writing this for a scene and not for a seminar paper.
reasoning: |-
  Okay, the user is writing a scene for their novel featuring an interview with an older ethicist who critiques longtermism. I need to craft eight specific questions that challenge her views without letting her fall back on standard arguments. 

  First, I should understand her core position: she believes our moral concepts are designed for face-to-face interactions and fail when applied over long time scales. She rejects "astronomical stakes" in favor of "conceptual architecture." The user wants three specific angles covered: 

  1) Whether longtermism collapses into presentism if we can't individuate future people  
  2) The replaceability objection (saving lives just creates different ones)  
  3) Existential risk reduction as resource-shifting from the present poor  

  Each question needs a follow-up that attacks her "moral distance = conceptual architecture" dodge. The user wants raw questions without intros or citations.

  Hmm, I'll start by framing questions around her core metaphor. Question 1 should challenge the applicability of current ethics to distant futures. Follow-up needs to corner her on how "architecture" solves the problem concretely. 

  For the required elements:  
  - Presentism collapse: Question 3 can ask if moral concern evaporates without identifiable individuals, with follow-up pressing how "architecture" avoids this  
  - Replaceability: Question 4 on whether saving future lives matters if they'd exist anyway, follow-up attacking the architecture analogy  
  - Risk-shifting: Question 6 on resource allocation ethics, follow-up demanding how "architecture" addresses exploitation  

  The other questions should cover related angles like moral psychology, political feasibility, and practical alternatives. Each follow-up must explicitly target her pet phrase with surgical pushback. 

  I'll keep language podcast-natural but incisive. No academic citations - paraphrase ideas generally. Prioritize making the ethicist work for her answers while revealing her character through the dodges she uses.
answer: |-
  **1. You've argued that moral obligations dissolve beyond a few generations because our ethical 'tools' evolved for local, reciprocal relationships. But doesn't that condemn us to a kind of moral myopia, ignoring foreseeable catastrophes we *could* prevent?**  
  *Follow-up: When you say "conceptual architecture," it sounds like a reason to *stop* extending concern, not a description of a limit. Isn't this "architecture" just an excuse for present-day indifference dressed up as intellectual humility?*

  **2. If our current moral concepts truly are inadequate for the long-term future, what alternative framework *should* we use? Or are you saying we simply have *no* duties to those beyond the horizon of reciprocity?**  
  *Follow-up: "Conceptual architecture" feels like diagnosing a problem but refusing treatment. If the tools are broken, do we just abandon the project of caring about the future altogether? Isn't that the ultimate presentism?*

  **3. Longtermism relies on the idea of vast numbers of future individuals whose lives we can save. But if we can't even *individuate* them – specify *who* might exist – doesn't moral concern become too abstract? Doesn't it just collapse into valuing a vague potential for life, which is functionally indistinguishable from valuing present potential?**  
  *Follow-up: How does "conceptual architecture" solve this individuation problem? Doesn't saying "it's architecture, not distance" just dodge the core issue that we can't meaningfully point to *which* specific non-existent people we owe duties to?*

  **4. Take the replaceability objection: If preventing an extinction event today saves a trillion future lives, but those lives wouldn't be the *same* individuals who would exist otherwise – just *different* ones living later – is there any net moral gain? Haven't we just swapped one set of potential people for another?**  
  *Follow-up: Appealing to "conceptual architecture" here seems like saying our tools can't grasp the swap. But doesn't that *reinforce* the objection? If the architecture can't distinguish between saving specific lives or just enabling different ones, where's the moral imperative?*

  **5. Critics argue longtermism smuggles in controversial population ethics, like the idea that more lives are inherently better. Does your "architecture" critique expose that, showing we lack the concepts to even *assess* claims about value across vastly different potential populations?**  
  *Follow-up: If the architecture is fundamentally broken for these comparisons, doesn't that invalidate *all* claims about "astronomical value," including the core longtermist argument? Or is your point solely defensive for *rejecting* duties?*

  **6. Diverting massive resources to reduce low-probability existential risks (like AI alignment or asteroid defense) means those resources *aren't* spent on high-certainty suffering now – say, malaria nets or famine relief. Isn't this effectively shifting risk *onto* the identifiably poor and vulnerable of today?**  
  *Follow-up: You call this a problem of "conceptual architecture," not spatial distance. But doesn't that phrase risk minimizing the concrete, immediate harm done to real people *right now*? Isn't "architecture" just an abstraction that obscures present-day exploitation?*

  **7. Longtermism often emphasizes shaping the very long-term future. But given radical uncertainty – we can't predict values, technologies, or social structures in 500 years, let alone 5000 – isn't any attempt at "steering" inherently hubristic or even dangerous?**  
  *Follow-up: Isn't your "architecture" argument ultimately about epistemic humility? That our concepts *and* our predictive capacity are too limited for such grand projects? Doesn't that make longtermist interventions not just difficult, but conceptually incoherent?*

  **8. If we accept your "conceptual architecture" limits, what *does* morally matter for the future? Is it about ensuring basic conditions for *some* kind of future society to emerge, focusing on institutional resilience, or preserving options? Or does the future truly become a moral void?**  
  *Follow-up: Doesn't even defining those "basic conditions" or "resilience" run headlong into the same architectural limits? If we can't grasp future people's needs or values, how can we build institutions *for them* without imposing our own parochial concepts?*
