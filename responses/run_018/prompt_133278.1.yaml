answer: |-
  Here’s a runnable simulation design meeting your specifications, optimized for 75 minutes with 12 students:

  ---

  ### **Session Title:** *The Household Continuity Game*  
  **Objective:** Simulate the ontological clash between bounded individualism and relational personhood through resource allocation under crisis.  
  **Materials per Household Pair (6 total):**  
  - 1 envelope containing:  
    - 2 × **Individual Integrity Cards** (unique to each student; e.g., *"Private Project: Write novel 1hr/day"*, *"Bodily Need: Quiet space after 8pm"*, *"Personal Preference: Vegetarian meals"*)  
    - 2 × **Relational Position Cards** (assigned irreplaceable roles; e.g., *"Elder Mediator: Must approve all token allocations. Network survives ONLY if you arbitrate 3+ disputes"*; *"Filial Child: Network survives ONLY if you personally care for the Elder Mediator"*)  
  - 20 × **Protection Tokens** (physical chips/markers)  
  - 1 × **Hidden Crisis Scenario Card** (e.g., *"The Ancestral Home collapses: Allocate tokens to rebuild OR relocate. Relocation dissolves role-network."*)  

  ---

  ### **Mechanics & Flow (60 mins total)**  
  1. **Setup (5 mins):**  
     - Assign pairs to "households." Distribute envelopes.  
     - Students read their *Individual Integrity* and *Relational Position* cards. **Crucial:** Emphasize that *Position Cards* define victory conditions.  

  2. **Rounds 1–3 (10 mins each, 30 mins total):**  
     - **Voting:** Each round, households vote (unanimous or 4/5 supermajority) to allocate tokens across 4 needs:  
       *Bodily Safety, Private Projects, Role Maintenance, Institutional Memory*.  
     - **Crisis Reveal:** At Round 2, reveal the household’s *Crisis Scenario* (e.g., *"Elder Mediator falls ill: +5 tokens needed for Role Maintenance this round"*).  

  3. **Scoring (After each round, 5 mins × 3 = 15 mins):**  
     - **Bounded Roles:** Award 1 "Narrative Continuity Point" (NCP) per *Individual Integrity Card* preserved (e.g., vegetarian meals secured = +1 NCP).  
     - **Relational Roles:** Award 3 NCPs **only if** all role-specific conditions on *Position Cards* are met (e.g., "Filial Child cared for Elder" = +3 NCPs). *No points for individual integrity*.  
     - **Facilitator secretly tracks scores** per role type.  

  4. **Twist (Round 3):**  
     - Introduce cross-household alliances: Pairs may share tokens if *both* agree, but must sacrifice 2 tokens as a "transaction cost."  

  ---

  ### **Predicted Tensions & Learning Moments**  
  - **Bounded Self Trap:** Players protecting individual integrity (e.g., "I need tokens for my novel") drain tokens from *Role Maintenance*, causing relational networks to unravel.  
  - **Relational Sacrifice as Survival:** A "Filial Child" might vote *against* their own *Individual Integrity Card* (e.g., skipping meals) to allocate tokens to "Elder Care," recognizing that network survival = their *only* path to victory.  
  - **Failed "Rescue" Attempt:** Bounded-role players will likely offer tokens to "save" relational players’ individual needs (e.g., "Take tokens for your quiet space!"). This redirects resources from role upkeep, accelerating network collapse.  
  - **Asymmetric Victory:** Relational players "win" by accepting individual harm (e.g., losing all personal projects) but preserving the role-web. Bounded players "lose" despite intact individual cards if the network dissolves.  

  ---

  ### **Debrief Framework (15 mins)**  
  **Map simulation outcomes to philosophical distinctions:**  
  | Simulation Moment               | Ontological Clash Revealed |  
  |----------------------------------|----------------------------|  
  | Relational player sacrificing tokens for role upkeep | *Not altruism, but self-preservation: Identity exists only in the network.* |  
  | Bounded player "rescuing" a relational player | *Misapplying fungibility: Offering replaceable resources (tokens) for irreplaceable roles.* |  
  | Network collapse despite all individuals being "protected" | *Bounded framework’s blind spot: Dissolving the pattern is catastrophic harm, not a trade-off.*  

  **Key Clarifications:**  
  1. **What the sim CAN’T do:** It shows *strategic* interdependence, but not the *phenomenology* of extended selfhood (e.g., a mother *feeling* her child’s pain as her own). Verbally emphasize: *"In Confucian ethics, losing a role isn’t losing a job—it’s amputating part of your self."*  
  2. **Non-Fungible Relational Position (NFRP):** Stress that NFRP means roles aren’t jobs to be reassigned (e.g., "Filial Child" ≠ "designated nurse"). The *specific relational pattern* is constitutive.  

  **Closing Insight:**  
  *"The simulation forces a choice: Is damage done when a *mind* is violated (Western), or when a *pattern of roles* is shattered (East Asian)? These aren’t competing values—they’re competing realities."*  

  ---

  ### **Troubleshooting First-Run Issues**  
  - **Problem:** Bounded players dominate early voting, starving relational roles.  
    *Solution:* Let it happen. The Round 3 crisis (e.g., "Elder Mediator incapacitated") will force consequences.  
  - **Problem:** Relational players feel "coerced."  
    *Debrief pivot:* "Did you sacrifice autonomy, or *express* your identity through role-preservation?"  
  - **Problem:** Alliances form randomly.  
    *Leverage it:* Note if alliances preserved/fractured networks (e.g., "Peripheral Ally" role requires cross-household ties).  

  This design ensures students *experience* ontology through resource scarcity and asymmetric incentives, setting the stage for deeper textual analysis. The "NFRP" framing centers the irreducibility of relational patterns—precisely as you requested.
