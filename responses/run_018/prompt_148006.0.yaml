  we're deciding between two versions of a warehouse shift scheduler. version A uses a genetic optimizer seeded with current employee preferences; version B is a static round-robin. over the next few years, version A changes who works together, who becomes friends, and eventually who has kids with who. some of those future people grow up in harder conditions because thier parents met on opposite night shifts and are always tired. version B produces a different set of future people, mostly in more stable households. neither group exists if we pick the other option. my teammate's arguement is you can't harm someone by bringing them into existance, so A is fine as long as total wellbeing is net positive. but that feels like cheating — the "harder life" kids never consented, yet they also can't complain they never got born. is there an actual moral difference between A and B, or is this just a paradox that makes every long-term choice look wrong?

