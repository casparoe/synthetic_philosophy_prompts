answer: |-
  Below is a branching taxonomy for extending Russell's theory of definite descriptions into non-extensional contexts, constructed using diagnostic questions. Positions are mapped based on combinations of answers, with named views placed at terminal leaves. Unoccupied branches are marked with diagnoses. Settled logical points (e.g., scope ambiguity) are distinguished from contested interpretive claims.

  ---

  ### **Branching Taxonomy: Extending Russell's Theory to Non-Extensional Contexts**  
  **Core Russellian Analysis (Extensional Context):**  
  "The F is G" ≡ ∃x (Fx ∧ ∀y (Fy → y=x) ∧ Gx)  
  *(Definite descriptions are quantificational; not singular terms)*  

  #### **Level 1: Scope in Belief Reports**  
  *Diagnostic: In "S believes the F is G," can the description take wide scope over the attitude verb?*  
  - **Yes** (Scope distinctions are available → Go to Level 2A).  
    *Settled logical point: Russell's formalism permits scope ambiguity.*  
  - **No** (Scope distinctions are unavailable → Go to Level 2B).  

  #### **Level 2A: Wide Scope Available**  
  *Diagnostic: In the **narrow-scope** reading (de dicto), is existence/uniqueness retained?*  
  - **Yes** (Existence/uniqueness conditions are part of the belief content → Go to Level 3A).  
  - **No** (Existence/uniqueness conditions are suspended or altered → Go to Level 3B).  

  #### **Level 3A: Existence Retained in Narrow Scope**  
  *Diagnostic: In narrow scope, can the description play a singular-term role?*  
  - **Yes** → *Incoherent branch*.  
    *Diagnosis: Quantificational structure requires existence/uniqueness conditions; singular-term role denies this.*  
  - **No** → **Strict Russellian** (e.g., Russell, Neale).  
    *Narrow scope: "S believes ∃x (Fx ∧ ∀y (Fy → y=x) ∧ Gx)."*  

  #### **Level 3B: Existence Not Retained in Narrow Scope**  
  *Diagnostic: Is the description treated as a rigid designator?*  
  - **Yes** → **Neo-Russellian Direct-Reference Hybrid** (e.g., Kaplan-inspired views).  
    *Descriptions gain referential force via rigidity; existence depends on context.*  
  - **No** → [Unoccupied].  
    *Diagnosis: Unstable—suspending existence without rigidity collapses into free logic or Meinongianism.*  

  #### **Level 2B: Wide Scope Unavailable**  
  *Diagnostic: Is existence required for meaningfulness?*  
  - **Yes** (Failure of reference voids the statement → Go to Level 3C).  
  - **No** (Statements can be meaningful without reference → Go to Level 3D).  

  #### **Level 3C: Existence Required**  
  *Diagnostic: Is the existence condition speaker-oriented?*  
  - **Yes** → **Strawsonian Presuppositional** (e.g., Strawson, van der Sandt).  
    *Existence/uniqueness is a pragmatic presupposition; failure yields truth-value gaps.*  
  - **No** → [Unoccupied].  
    *Diagnosis: Incoherent—if scope is fixed and existence is required but not speaker-oriented, attitude verbs lack clear locus for evaluation.*  

  #### **Level 3D: Existence Not Required**  
  *Diagnostic: Can descriptions denote non-existent objects?*  
  - **Yes** → [Unoccupied].  
    *Diagnosis: Unexplored in Russellian literature; conflicts with Russell's actualism.*  
  - **No** → **Modal Revisionism** (e.g., contextualist-quantificational variants).  
    *Existence checks deferred to accessible worlds; retains quantificational core.*  

  ---

  ### **Key Ambiguities and Contested Claims**  
  1. **Scope Ambiguity**:  
     - *Settled*: Russell's formalism allows wide/narrow scope in belief reports.  
     - *Contested*: Whether natural language exhibits this ambiguity (e.g., Ludlow vs. Cappelen).  

  2. **Existence Commitment**:  
     - *Settled*: Wide scope entails actual-world existence.  
     - *Contested*: Whether Russell intended existence to project to attitude holders (e.g., "S believes the F exists" vs. "The F exists").  

  3. **Singular-Term Role**:  
     - *Settled*: Russell denies descriptions are singular terms.  
     - *Contested*: Whether rigidity or referential uses justify hybrid views (e.g., in modal contexts).  

  ---

  ### **Application to Other Contexts**  
  1. **Modal Operators**:  
     - *Scope*: "Necessarily, the F is G" vs. "The F is necessarily G."  
     - *Existence*: Actualist (wide scope) vs. possibilist (narrow scope) commitments.  
     - *Positions*: Strict Russellian (scope-based), Neo-Russellian (rigidity).  

  2. **Fictional Discourse**:  
     - *Scope*: "In fiction F, the G is H" (narrow scope dominates).  
     - *Existence*: Suspended (e.g., "Sherlock Holmes" lacks referent).  
     - *Positions*: Presuppositional (truth-valueless), Modal Revisionism (quantification over story-worlds).  

  ---

  ### **Unseparated Leaves**  
  - **Strict Russellian** vs. **Modal Revisionism**:  
    Both retain quantificational structure but diverge on existence in fiction. Taxonomy separates them via Level 2B/3D.  
  - **Neo-Russellian Hybrid** vs. **Direct-Reference Views**:  
    Hybrids retain quantificational roots; pure direct reference (e.g., Fodor) falls outside Russellian extensions.  

  ---

  This taxonomy isolates commitments while respecting logical constraints. Positions reflect actual defenses; unoccupied branches highlight theoretical gaps. Use this framework to test proposed extensions or locate new arguments.
