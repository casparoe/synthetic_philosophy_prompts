  Applying this to the coal mine case: The voice could be explained by known phenomena (tunnel acoustics, stress), so event implausibility is moderate (3/5). But testimony has red flags—only three witnesses, all miners with high stress and potential group influence. Testimony issues score higher (4/5), so by Hume's rule, it fails. The commune case has high event implausibility (mass simultaneous visions, 5/5), but testimony is stronger—many witnesses, varied accounts, no clear deceit motive. Here, Hume's "math" runs out, so it pushes to values judgment. 

