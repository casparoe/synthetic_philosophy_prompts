answer: |-
  **1. Dr. Lian:** Stratified testimony analysis shows core plausibility: Troy's destruction layer VIIa aligns with Mycenaean conflict patterns; Arthur echoes post-Roman warlord defense in Gildas; Exodus preserves Late Bronze Age Semitic presence in Egypt, later theologized.  
  **2. Prof. Kess:** Correlation isn't causation: Hisarlik VIIa *became* "Troy" via Homer’s needs; "Arthur" crystallized fragmented warlords into a pan-British symbol; Exodus reshaped vague memories of upheaval into a foundational identity myth—oral coherence overrides fact.  
  **3. Dr. Lian:** Precisely! The sediment *is* the reshaped material: Arthurian strategic loci like Badon fit Gildas' 6th-century chaos; Exodus' Merneptah Stele "Israel" and Egyptian loanwords in Hebrew reveal a cultural kernel beneath theological narrative accretion.  
  **4. Prof. Kess:** But the kernel dissolves: Geoffrey of Monmouth’s Arthur bears no evidentiary link to Gildas’ Ambrosius; Exodus’ plagues defy Egyptian records yet cohere as theological polemic; oral transmission filters *for* utility, not fidelity—Troy’s "truth" is its narrative function, not Heinrich Schliemann’s trench.  
  **5. Dr. Lian:** Utility *preserves* sediment: Troy’s Hittite "Wilusa" treaties persist in epic; Exodus’ Ramesside toponyms (Pithom, Raamses) survived orally; Arthur’s *Historia Brittonum* battles reflect localized strife. You conflate distortion with total erasure—coherence filters retain geopolitical grit.  
  **Prof. Kess:** Grit isn’t structure: Those elements are fossilized *motifs*, not evidence. Wilusa became a name-drop; Exodus toponyms serve plot verisimilitude; Arthur’s battles are narrative glue. The shadow’s shape depends on the light, not the wall.
