  First, I need to understand the core of her argument. She argues that the reference class isn't fixed by causal similarity but by the explanatory target. For example, cancer risk could use genetic pools for mechanisms but social pools for access issues. The challenge is to push beyond this without rehashing it.

  The user wants three specific questions with follow-ups. Let me tackle each one:

  1. **Collapse into pure contextualism:** How does she avoid the "anything goes" criticism? If any class can be chosen based on context, what constraints exist? Follow-up: If pragmatic goals are the constraint, how does that differ from conventionalism? This pushes her to explain the objectivity in her framework.

  2. **Single-case probabilities:** For "Will *I* get cancer?", her view must reconcile individual predictions with contextual classes. Follow-up: If she argues that individual cases inherit context from broader questions, how does that work without a unique individual class? This challenges the applicability to personal decisions.

  3. **Meta-problem of explanatory targets:** How do we choose the explanatory target without presupposing the outcome? Follow-up: If pragmatic framing guides this, how do we avoid circularity where the target is chosen to fit desired outcomes? This addresses potential bias in framework selection.

  The user mentioned the podcast is for a student series, so questions should be sharp but not overly technical. Avoid citation requests since she might improvise. Also, ensure follow-ups are tuned to her likely pragmatic responses. 

  I should structure questions that probe weaknesses but remain respectful. For instance, the meta-problem question could highlight how choosing an explanatory target might presuppose what's important, leading to circular reasoning. Her probable appeal to pragmatism needs countering—maybe by asking how pragmatism avoids arbitrariness.

  Other angles to cover: applications in scientific practice, decision-making under uncertainty, and whether her view affects scientific objectivity. Also, include questions on interdisciplinary implications and common misunderstandings to add depth without rehashing her thesis.

  Need exactly 8-10 questions total. The three core issues are mandatory, so the rest should complement them—like real-world applications, comparisons to causal approaches, and audience engagement. Ensure each question has a clear follow-up anticipating her pragmatic replies. 

