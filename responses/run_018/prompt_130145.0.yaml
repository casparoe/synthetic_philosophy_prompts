answer: |-
  ### Decision Procedure for Art Acquisitions
  Grounded in the philosophy of aesthetic testimony (autonomy thesis, disagreement problem, and epistemic limitations of testimony), this 20-minute procedure prioritizes direct experience, mitigates bias, and flags when values must override theory.

  **Procedure Steps**  
  1. **Direct Viewing (If Accessible)**  
     - **Sufficient for YES**: Consensus (≥70% positive) among those who experienced it firsthand.  
     - **Hard NO**: Consensus (≥70% negative).  
     - **Punt to Values**: Mixed reactions (±30% margin) OR ambiguous/weak responses.  
     *Philosophical Grounding*: Autonomy thesis demands direct experience for reliable judgment; disagreement triggers epistemic caution.  
     *Gut-Call Alert*: Ambiguous reactions often mask subjective bias.  

  2. **Expert Testimony (Primary)**  
     - **Sufficient for YES**: Testimony is specific, contextualized (e.g., ties to art history/technique), and uncontradicted by peers.  
     - **Hard NO**: Testimony is vague, self-contradictory, or widely disputed by comparable experts.  
     - **Punt to Values**: Testimony is poetic but unsubstantiated OR split among experts.  
     *Philosophical Grounding*: Experts can bridge autonomy gaps if testimony is "transparent" (reveals reasoning); disagreement undermines authority.  
     *Gut-Call Alert*: "Specificity" assessments often rationalize personal taste.  

  3. **Secondary Testimony**  
     - **Sufficient for YES**: Only if corroborated by direct/primary evidence (e.g., conservator’s decay report + curator’s formal analysis).  
     - **Hard NO**: Hearsay without provenance OR contradicts direct/expert input.  
     - **Punt to Values**: All other cases.  
     *Philosophical Grounding*: Testimonial chains dilute reliability; aesthetics require "experiential access" (Goldman).  
     *Gut-Call Alert*: Reliability judgments are often instinctive.  

  ---

  ### Case Applications  
  **Case 1: Abstract Sound Installation**  
  - **Direct Viewing**: None → Proceed to Step 2.  
  - **Expert Testimony**: Curator’s "temporal disorientation" claim is poetic but lacks technical/contextual grounding → *Punt to Values*.  
  - **Secondary Testimony**: N/A.  
  - **Verdict**: **Reject or negotiate loan**. The testimony’s vagueness fails autonomy demands; risking visitor backlash without direct validation.  

  **Case 2: Figurative Painting**  
  - **Direct Viewing**: 50/50 split → *Punt to Values* (disagreement).  
  - **Expert Testimony**: Critic’s argument reframes sentimentality as intentional concept → *Sufficient for YES* (specific, resolves disagreement).  
  - **Secondary Testimony**: N/A.  
  - **Verdict**: **Purchase**. Expert testimony transparently addresses direct-viewing conflict.  

  **Case 3: Unintended Fragility Work**  
  - **Direct Viewing**: None → Proceed to Step 2.  
  - **Expert Testimony**: Entirely second-hand (conservator → curator) → Skip to Step 3.  
  - **Secondary Testimony**: Conservator’s decay report lacks corroboration → *Punt to Values*.  
  - **Verdict**: **Reject unless mission-aligned**. Secondary testimony alone violates autonomy; committee must decide if decay aligns with institutional values.  

  *Committee’s "won’t like" verdict*: Case 3 (rejection) — punts to values despite intriguing concept.  

  ---

  ### Summary Table  
  | Case                       | Procedure Verdict       | Judgment Call Flagged? | One-Line Reason                                  |  
  |----------------------------|-------------------------|-------------------------|--------------------------------------------------|  
  | Abstract sound installation| Reject/negotiate loan   | Yes                     | Vague expert testimony; no direct experience.    |  
  | Figurative painting        | Purchase                | No                      | Expert testimony resolves viewer disagreement.   |  
  | Unintended fragility work  | Reject unless mission-fit| Yes                     | Secondary testimony uncorroborated; values call. |  

  ---

  ### Limits of the Procedure  
  1. Cannot predict public reception (visitors may still hate theoretically sound purchases).  
  2. Fails when experts are wrong (e.g., overlooked historical significance).  
  3. Values calls (≈40% of cases) default to institutional biases.  
  4. No weight for market trends or investment potential.  

