prompt: |-
  I'm on the aquesitions commitee for a small regional museum and we keep getting burned on contemporary works — we buy based on curator testimony, then visitors hate it, or we reject something because our gut said no and then it turns out to be a major piece. I want a decision procedure I can actually run in about 20 minutes before signing off on a purchase under $50k. Ground it in whatever philosophy of aesthetic testimony actually says — the autonomy thesis, whether you can learn beauty from someone else, the disagreement problem — but translate it into steps a non-philosopher can run.

  The procedure should take three kinds of input in order: direct viewing (if anyone on the commitee can see/hear/experience the work), expert testimony (curator, artist statement, established critic), and secondary testimony (the expert is just relaying someone else's report, like a conservator describing affective impact from material decay). For each step say what counts as sufficient, where it stops with a hard no, and where it has to punt to a values call because theory doesn't settle it. Be honest about which steps are just dressing up a gut call.

  Then run it on three proposals:
  1. An abstract sound installation nobody on the commitee has heard live; the curator says it produces "a specific kind of temporal disorientation that rewards patience."
  2. A figurative painting where half the commitee finds it emotionally moving and half finds it kitsch, with a well-known critic arguing its sentimentality is precisely its conceptual point.
  3. A work where the curator's testimony is entirely second-hand — she's passing along a conservator's report that the work's unintended material fragility creates an aesthetic of decay.

  One of these should come back with a verdict the commitee probably won't like. Also flag exactly what the procedure can't do.

  After the procedure and cases, give me a brief structured summary in a table with columns: Case | Procedure Verdict | Judgment Call Flagged? | One-line reason. Then wrap the whole response in a JSON object with fields "procedure_steps" (array of strings), "case_results" (array of objects with keys "case_name", "verdict", "flag"), and "limits" (array of strings).
reasoning: |-
  We are designing a decision procedure grounded in the philosophy of aesthetic testimony, particularly considering:
  - The Autonomy Thesis: The idea that one must directly experience an artwork to properly judge its aesthetic value.
  - The Problem of Disagreement: How to handle conflicting testimonies or judgments.
  - The Status of Second-hand Testimony: How much weight to give to indirect reports.

  The procedure will have three stages, corresponding to the three kinds of input: direct viewing, expert testimony, and secondary testimony.

  Procedure Steps:

  1. **Direct Viewing (if possible)**
     - If at least one committee member has directly experienced the work, ask:
       a. Did the direct experience produce a strong positive or negative aesthetic response? (e.g., moved, disturbed, bored, offended)
       b. Is there consensus among those who experienced it? (Note: consensus doesn't mean unanimity, but a clear majority leaning)
     - **Sufficient for YES**: Strong positive response and consensus. Move to purchase.
     - **Hard NO**: Strong negative response and consensus. Reject.
     - **Punt to values**: 
          - Mixed reactions (no consensus) -> move to next step (expert testimony).
          - Weak or ambiguous reactions -> move to next step.
     - Note: If no one has direct experience, proceed to step 2.

  2. **Expert Testimony (primary)**
     - Consider the curator's or expert's direct testimony about the work (including artist statement, established critic). Evaluate:
       a. Is the expert's judgment well-argued and grounded in relevant expertise? (e.g., they explain the work's context, technique, innovation, or emotional impact)
       b. Are there multiple experts in agreement? (If available)
       c. Does the testimony address the concerns from step 1 (if any)?
     - **Sufficient for YES**: 
          - The expert testimony is compelling and addresses any prior concerns (e.g., explains why initial mixed reactions are part of the work's intent, or why it's significant despite being challenging). 
          - Also, if there was no direct viewing and the expert testimony is strong and uncontradicted by other experts, then YES.
     - **Hard NO**: 
          - The expert testimony is weak (e.g., vague, unsubstantiated) and fails to address prior concerns, OR there is strong contradictory expert testimony (e.g., a respected critic pans it).
     - **Punt to values**: 
          - The expert testimony is split (e.g., some experts praise, some pan) OR the testimony is ambiguous. Then move to step 3 (if available) or else make a values call.
          - Also, if the expert testimony is entirely second-hand (which is step 3), then skip to step 3.

  3. **Secondary Testimony (if primary expert testimony is unavailable or insufficient)**
     - Consider testimony that is second-hand (e.g., a curator relaying a conservator's report, or a critic citing another). Evaluate:
       a. How reliable is the chain? (e.g., the conservator is known for good judgment, and the curator is accurately reporting)
       b. Is the secondary source's judgment based on direct experience? (If not, it's very weak)
       c. Does the secondary testimony align with other evidence?
     - **Sufficient for YES**: Only in rare cases where the secondary testimony is exceptionally reliable and there is strong corroboration (e.g., multiple independent secondary reports, or it fills in a gap that makes the primary expert testimony compelling). But generally, secondary testimony is weak.
     - **Hard NO**: If the secondary testimony is the only input and it's negative, or if it's unreliable (e.g., hearsay, vague).
     - **Punt to values**: Almost always. Secondary testimony alone is insufficient for a confident decision. It might tip the balance if the committee is already leaning, but without direct experience or strong primary testimony, the committee must make a values call about the museum's mission (e.g., do we collect works that are about decay?).

  Important Notes:
  - The Autonomy Thesis suggests that without direct experience, we are on shaky ground. So step 1 is the most reliable, but often not available.
  - The procedure acknowledges that step 2 (expert testimony) is crucial when direct experience is lacking, but the problem of disagreement (step 2 punt) is common.
  - Step 3 (secondary) is the weakest and usually just a tie-breaker or a way to confirm a gut feeling.
  - The "gut call" is dressed up in the steps but becomes explicit in the "punt to values" situations. Essentially, when the procedure punts, the committee must decide based on the museum's values (e.g., do we prioritize innovation, emotional impact, historical significance?).

  Now, let's run the three cases:

  Case 1: Abstract sound installation
  - Direct viewing: None (committee hasn't heard it live). -> Move to step 2.
  - Expert testimony: Curator says it produces "a specific kind of temporal disorientation that rewards patience." This is somewhat abstract but grounded in expertise. It's positive but doesn't address any prior concerns (there were none from step 1). However, it's a single expert and not highly detailed. 
  - Secondary testimony: None mentioned.
  - Verdict: The procedure would not give a hard NO, but it's not a strong YES either. Since there's no direct experience and the expert testimony is a bit vague, we might punt to values. However, the procedure says for step 2: if the testimony is compelling and uncontradicted, it might be sufficient. But note: the description is a bit abstract. We don't have any disagreement. So we might lean toward YES but with caution. But wait, the procedure says: "compelling and well-argued". This testimony is not very detailed. So we punt to values? Let's see: the procedure says for step 2, if the testimony is weak (vague) then it's a hard NO? No, it says weak and fails to address prior concerns -> hard NO. But here there are no prior concerns. So it's ambiguous. We punt to values.

  Case 2: Figurative painting
  - Direct viewing: Half the committee moved, half found kitsch -> mixed reactions (no consensus). -> Punt to step 2.
  - Expert testimony: A well-known critic argues that the sentimentality is the point. This is a strong argument that addresses the mixed reactions (the kitsch is intentional). It's primary and from a well-known critic. 
  - Verdict: Step 2: Expert testimony is compelling and directly addresses the prior concern (the split in direct viewing). Therefore, sufficient for YES.

  Case 3: Work with curator's testimony entirely second-hand
  - Direct viewing: Not mentioned. Assume none? -> Step 2: But the curator's testimony is entirely second-hand (relaying conservator's report). So we skip to step 3.
  - Step 3: Secondary testimony (conservator's report) that unintended fragility creates an aesthetic of decay. 
  - Evaluation: The conservator is an expert in material condition but might not be an aesthetic expert. The chain: curator to conservator, and we don't know if the conservator is reporting their own direct experience (likely, because they examined the work). So reliability is moderate. But it's the only input. 
  - Verdict: Step 3: Secondary testimony alone is weak. We don't have direct viewing or primary expert testimony. So we must punt to values. The procedure would not give a YES or NO based on this. The committee must decide based on whether they value the aesthetic of decay and the museum's mission.

  One of these should come back with a verdict the committee won't like. Case 3 is a punt to values, which might be disliked because they want a clear answer. Case 1 is also a punt to values, which might be disliked.

  But note: the procedure says for case 1 we punt to values? And for case 2 we say YES, and for case 3 we punt to values.

  Now, the table summary:

  Case | Procedure Verdict | Judgment Call Flagged? | One-line reason
  1. Abstract sound installation | Punt to values (values call required) | Yes | No direct viewing and expert testimony too vague to decide alone.
  2. Figurative painting | YES (purchase) | No | Expert testimony compellingly addresses the mixed direct reactions.
  3. Unintended fragility | Punt to values (values call required) | Yes | Only second-hand testimony, insufficient for confident decision.

