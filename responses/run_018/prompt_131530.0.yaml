  I need to unpack several layers here. The user seems well-versed in this academic debate, using specialized terms like "moral dumbfounding" and referencing meta-analyses. They're likely a graduate student or researcher in moral psychology/philosophy, framing this as a metatheoretical question about disciplinary stalemates. Their explicit questions are diagnostic, but their deeper need might be methodological: how to move beyond circular debates when empirical and normative claims intersect.

  Looking at the core dispute: Proponents argue that cross-cultural patterns in foundation weightings reveal deep cognitive structures, while critics maintain this descriptive data has no normative implications. Both sides agree on the empirical findings but draw opposite conclusions. The user wonders if this is due to ambiguous terminology ("foundation"), differing evidential standards, or conflated questions.

  I think the most productive diagnosis is the third option: proponents and critics are answering different questions. Proponents focus on the causal architecture of moral cognition (how moral judgments form), while critics focus on normative justification (why we should accept certain judgments). The phrase "what the psychology tells us" obscures this distinction. For example, demonstrating that sanctity intuitions are evolutionarily ancient tells us about their origins, not whether they're morally valid—that requires ethical argumentation.

  Regarding progress: Neither conceptual distinctions nor new empirical findings alone will resolve this. The deadlock stems from a category error—treating descriptive origins as normative justification. Genuine progress would involve abandoning the framing question ("Does psychology reveal normative differences?") as ill-posed. Instead, researchers should delineate boundaries: psychology describes moral cognition; philosophy evaluates its normative claims. Collaborative models could then explore how descriptive facts inform (without determining) normative debates.

  The user might be seeking a way to reframe their research to avoid this stalemate. I'll emphasize that the most constructive path is recognizing psychology and ethics as complementary but distinct projects.
answer: |-
  Your analysis precisely captures the core tension in the MFT debate. The deadlock stems primarily **from conflating distinct questions – one about causal architecture, the other about normative justification – under the ambiguous phrase "what the psychology tells us."** Here's the diagnosis and path forward:

  1.  **The Core Problem: Conflated Questions & Ambiguous Language:**
      *   **Question 1 (Descriptive/Causal):** "What evolved cognitive structures underpin moral intuitions across cultures, and how do they manifest differently in groups like liberals/conservatives?"
      *   **Question 2 (Normative/Justificatory):** "Which moral beliefs *should* we hold? What justifies them as correct or authoritative?"
      *   **The Conflation:** Proponents often present answers to Question 1 *as if* they bear significantly on Question 2 (e.g., "ubiquity/stability suggests deep validity"). Critics correctly insist that answers to Question 1 *cannot logically entail* answers to Question 2. The phrase "what the psychology tells us" is used equivocally: proponents mean descriptive patterns + potential adaptive origins, critics hear an implicit normative claim.
      *   **"Foundation" Ambiguity:** The term itself contributes. Does "foundation" imply only a *trigger* for intuitive judgment (causal mechanism), or does it imply a *justifying reason* (normative)? Proponents lean towards the former but often use language suggestive of the latter. Critics interpret claims about "foundations" as implying the latter and rightly attack that implication.

  2.  **Why Other Diagnoses are Secondary:**
      *   **Verbal Disagreement:** While ambiguity exists, clarifying "foundation" alone wouldn't resolve the core issue. Even if defined purely causally, proponents might still *imply* normative significance from ubiquity/stability, and critics would still reject that move.
      *   **Standards of Evidence:** The sides *do* differ here, but this difference *stems from* the conflation. Proponents see ubiquity/stability/replication as *suggesting* (though not proving) normative weight. Critics see these as *irrelevant* to justification, pointing to the "is-ought gap." Their disagreement about evidence standards is a *symptom* of their disagreement about whether descriptive facts *can* ever bear on justification in the way MFT proponents hope.

  3.  **Genuine Progress: Abandoning the Ill-Posed Framing Question:**
      The most fundamental progress would be recognizing that **the framing question – "Does MFT reveal anything *normative* about left-right differences?" – is itself ill-posed.** Psychology (descriptive science) cannot "reveal" normative truths in the direct way the question implies.

      *   **What Progress Looks Like:**
          *   **Conceptual Demarcation:** Explicitly and rigorously separating the descriptive project (mapping the architecture, triggers, and group variations of moral intuition) from the normative project (justifying moral principles). Acknowledge that the former informs the *context* of the latter (e.g., "here are the widespread intuitions we need to justify, explain away, or accommodate") but does not *determine* it.
          *   **Reframing the Question:** Instead of asking if MFT reveals normative differences, ask:
              *   *Descriptive:* "How do these intuitive foundations shape political cognition, coalition formation, and moral disagreement?" (Empirical focus).
              *   *Normative Interface:* "How should normative ethics *engage* with the fact of diverse, evolutionarily-shaped moral intuitions like those described by MFT?" (Philosophical focus). Does it require debunking some intuitions? Accommodating pluralism? Seeking overlapping consensus? This shifts from psychology *dictating* norms to philosophy *interpreting* the psychological landscape.
          *   **Collaborative Research:** Genuine progress lies in research programs that *respect the distinction* while exploring the *interface*:
              *   **Empirical:** Investigating *how* foundation weights shift with context, reasoning, education, or perspective-taking. Do certain conditions reliably lead individuals/groups to prioritize different foundations? This doesn't resolve normativity but shows malleability, challenging claims of fixed "deep" differences with direct normative implications.
              *   **Philosophical/Empirical:** Examining *if* and *how* awareness of MFT descriptions influences moral reasoning or tolerance. Does understanding the descriptive origins of an opponent's intuition foster better justification or merely strategic rhetoric?
              *   **Meta-Ethical:** Developing sophisticated accounts of how descriptive facts about moral psychology *constrain* or *inform* (without determining) normative theories (e.g., grounding reflective equilibrium, identifying biases to correct for, understanding the limits of moral persuasion).

  4.  **Why New Empirics or Arguments Won't Break the Deadlock Alone:**
      *   **New Empirical Results (e.g., malleability):** Proponents might argue malleability shows foundations are tools used strategically, not that they lack deep roots. Critics might say it reinforces that intuitions are unreliable without independent justification. It feeds *both* narratives without resolving the core normative question.
      *   **Arguments (Conceptual Distinction):** While crucial (and existing in philosophy!), simply stating the is-ought gap hasn't ended the debate because proponents often work with an implicit, non-traditional view of normativity where descriptive origins *do* confer some justificatory weight (e.g., via naturalized ethics). A more nuanced argument needs to show why *even on naturalized accounts*, descriptive clustering ≠ normative pluralism.

  **Conclusion:** The deadlock persists because proponents subtly (or not-so-subtly) invite normative inferences from descriptive data, while critics interpret MFT claims as making invalid normative leaps. The core issue is the conflation of descriptive psychology with normative justification under ambiguous terminology. **Genuine progress requires abandoning the quest for psychology to "reveal" normative differences directly.** Instead, progress lies in:
  1.  **Strictly separating** the descriptive science of moral cognition from the normative project of moral justification.
  2.  **Reframing research questions** to focus either on pure description/mechanism *or* on how normative theory should engage with the described psychological realities.
  3.  **Developing collaborative frameworks** where empirical findings about intuition (like MFT's) inform, but do not dictate, philosophical work on justification, bias, pluralism, and moral progress.

  The stalemate won't be broken by more data proving or disproving the descriptive patterns or their origins, but by a shared recognition that the answer to the normative question lies outside the scope of descriptive psychology alone.
