prompt: |-
  Belgium forces citizens to vote but lets long-term residents who aren't citizens vote locally after five years, and in some municipalities teenagers sit on advisory boards where each vote counts half. What theory of political membership does that combination presuppose? Does it treat citizenship like a bundle you can split into partial rights, or does it say being affected by local rules is enough for partial standing? And if the half-weight for teens is meant to track developing rational capacity, why doesn't teh same logic apply to elderly voters with decline? Reconstruct the implicit view, say whether it's consistent, and tell me what'd have to change if we replaced it with a pure affected-interests model.
reasoning: |-
  Okay, the user is asking about Belgium's voting system and the underlying theories of political membership. Let me start by breaking down the components they mentioned: compulsory voting for citizens, local voting rights for long-term non-citizen residents after five years, and half-votes for teenagers on advisory boards. 

  First, I need to identify the theories involved. The inclusion of non-citizens in local elections suggests that being affected by local decisions grants some political rights. That points to the "all-affected principle." But then, why only after five years? Maybe it's a residency requirement ensuring stability and connection to the community. 

  Then there's the half-votes for teens. That's interesting. It seems like they're acknowledging that younger people have a stake but perhaps not full capacity. But why half? And why not apply a similar logic to the elderly? The user is questioning the consistency here. If cognitive capacity is the reason for reduced weight for teens, shouldn't the same apply to cognitive decline in older adults? 

  The user also asks if citizenship is treated as a bundle of rights that can be split. Belgium's approach does seem to unbundle some rights—local voting for non-citizens, compulsory voting only for citizens. So it's partial rights based on different criteria: residency for local voting, age for advisory roles. 

  Now, the core tension: combining affected interests with capacity-based considerations. The five-year residency requirement balances immediate impact with sustained connection. Teens get partial voice due to developing rationality, but the elderly aren't included here. Maybe because cognitive decline isn't uniform and age isn't a good proxy? But that could be inconsistent. 

  The user wants to know if this is consistent. The system seems consistent in granting partial rights based on different factors, but the exclusion of the elderly from similar capacity adjustments might be a flaw. If we switched to a pure affected-interests model, everyone affected would get a vote, regardless of citizenship, age, or capacity. That could mean votes for children, tourists, even foreigners affected by policies. But that's impractical. How do you measure "affected"? 

  The user might be interested in the philosophical underpinnings and practical implications. They might be exploring how different democracies balance inclusion with practicality. Their deeper need could be understanding whether Belgium's model is fair and logically sound, especially regarding age and cognitive capacity. 

  I should address the inconsistency with the elderly but note that capacity is assessed differently—voting rights are based on age thresholds, not ongoing assessments. Changing to a pure affected-interests model would require overhauling the system, removing citizenship and age barriers, which poses challenges in defining and verifying affectedness. 

  Also, considering the user's identity, they might be a student or researcher in political theory, comparing different voting systems. Their unspoken need could be to critique the model or find a more equitable solution. They might be looking for a balanced analysis that highlights both strengths and weaknesses of Belgium's approach compared to theoretical ideals.
answer: |-
  Belgium's system reveals a **hybrid theory of political membership** that blends elements of **liberal contractualism** (rights tied to status) with **stakeholder democracy** (rights tied to impact), while incorporating a **developmental view of civic capacity**. Here's a reconstruction and analysis:

  1.  **Implicit Theory:**
      *   **Citizenship as a Core Bundle with Unbundled Local Rights:** Citizenship confers the *full bundle* of national political rights/duties (voting in all elections, compulsory participation). However, **local voting rights are partially decoupled** from citizenship. Long-term residents gain local voting rights based on **stakeholding through sustained residence and integration (5 years)**, recognizing that local decisions directly affect their daily lives.
      *   **Affected Interests + Capacity + Integration:** Local voting for non-citizens rests on the **"Bounded Affected Interests"** principle: If you are *significantly and stably affected* by local rules (via long-term residence) and are *integrated* enough to understand the context (implied by the residency duration), you gain partial standing (local vote only).
      *   **Developmental Capacity & Graduated Inclusion:** The half-vote for teens explicitly presumes **rational capacity develops gradually**. Granting half-weight on advisory boards acknowledges their stake (they are affected by long-term decisions) and their developing civic identity/capacity, offering a **"training wheels" approach** to full participation. It balances inclusion with a concession to cognitive development.
      *   **Aging & Capacity:** The system **does NOT consistently apply the capacity logic to aging**. This reveals an implicit assumption: **Full civic capacity, once attained (at adulthood), is presumed stable barring legal incapacity rulings.** Decline is seen as either (a) too variable and individual to legislate broadly, (b) offset by accumulated experience/wisdom, or (c) protected by the normative weight of lifelong citizenship and participation habits. Elderly voting rights are treated as **vested**.

  2.  **Consistency Assessment:**
      *   **Internally Coherent Hybrid:** The model is *operationally consistent* within its own hybrid framework:
          *   Citizenship = Full national bundle.
          *   Stable Residency + Local Impact = Unbundled local voting right.
          *   Youth = Partial right based on developing capacity/stake.
          *   Elderly = Full right based on attained status/capacity presumption.
      *   **Philosophical Tension:** The main inconsistency lies in the **asymmetric treatment of capacity development vs. decline**. It relies on a **bright-line age threshold for adulthood** (18) granting full capacity forever, while using a *graduated* approach for development. This is a practical/political compromise rather than a philosophically rigorous application of capacity tracking. The system prioritizes **stability, inclusion of youth, and respect for lifelong citizenship** over strict, ongoing capacity assessment for the elderly.

  3.  **Shift to a Pure Affected-Interests Model:**
      A pure "All-Affected Principle" model would radically alter the Belgian system:
      *   **Eliminate Citizenship Requirement:** Voting rights (local *and* national) would be based solely on being affected by the decisions, not legal status. Long-term residents (likely with a much shorter residency threshold, or none) would vote nationally if affected by federal policies.
      *   **Radically Expand the Franchise:** Potentially include:
          *   Short-term residents (e.g., migrant workers, students).
          *   Non-resident property owners/businesses affected by local taxes/zoning.
          *   Individuals in bordering communities affected by cross-border issues (pollution, infrastructure).
          *   Future generations (requiring proxy representation).
      *   **Re-evaluate Age Restrictions:** The half-vote for teens would be illogical. If affectedness is the *only* criterion:
          *   **Young Children:** Significantly affected by education, family, health policies. Could argue for parental proxy votes or even direct votes (raising obvious capacity issues the model ignores).
          *   **Teens:** Would likely get full votes based on affectedness alone.
          *   **Elderly/Incapacitated:** Would retain full votes if affected, as capacity isn't considered.
      *   **Practical Challenges:** Defining "affectedness" becomes immensely complex and contestable. How affected must one be? How to verify? How to avoid massive franchise inflation or manipulation? Voting in multiple jurisdictions becomes common.

  **Conclusion:**

  Belgium's system presupposes a **pragmatic, layered theory**: Citizenship remains the foundation for *national* rights/duties, but **local membership is based on integrated stakeholding (residency + time)**. **Youth inclusion is developmental**, granting partial rights as capacity grows. **Elderly exclusion based on capacity decline is rejected**, prioritizing lifelong status and avoiding the difficulties of individual assessment. While philosophically inconsistent in its asymmetric view of capacity over the lifespan, it *is* operationally consistent within its own hybrid rules. Shifting to a pure affected-interests model would dismantle citizenship-based national voting, eliminate age and residency requirements in favor of complex affectedness tests, and likely lead to an unworkably broad and unstable electorate. Belgium prioritizes a balance of principle (stakeholding), practicality (clear rules), and civic development over philosophical purity.
