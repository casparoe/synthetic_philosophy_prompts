prompt: |-
  My colleague Kessler works on indirect normativity — she thinks norms don't bite actions directly but only through some failure in an idealized deliberation setup. She's taken four stances. First, a factory hides pollution data from a poor adjacent neighborhood and dumps; she called it a clear indirect violation. Second, a legislature passes a carbon tax after full open debate, despite fossil-fuel workers hating it; she said no violation, the deliberative origin was sound. Third, a psych study uses mild deception on general adults, debriefs immediately, minimal risk; she said that's fine, no indirect norm broken. Fourth, a city takes homes via eminent domain for a private shopping center; she said violates, since homeowners never got real deliberative standing.

  Now she's weighing a new thing: climate activists blockade a coal plant knowing it'll cause blackouts in a nearby low-income area. They ran open forums, invited those residents, got explicit "no" answers, and went ahead with non-violent direct action anyway.

  What'd she say? I'm less interested in the yes/no than in the rules. I see at least three that cover her four calls: the "consent-under-parity" rule, the "mirror-rotation of practical identity" rule, and the "procedural-reflexivity" rule. They all fit the first four, but they split on the blockade. For each, what's the verdict? Which one matches her overall approach best and why? And what's the one further case that'd actually separate them?
reasoning: |-
  Hmm, the user is asking about their colleague Kessler's approach to indirect normativity and how she would rule on a new case involving climate activists blockading a coal plant. They've provided four previous examples of Kessler's judgments and three potential rules that seem to fit those cases but diverge on this new scenario. The user wants to understand how each rule would apply to the blockade case, which rule best captures Kessler's overall approach, and what kind of test case could distinguish between these rules.

  Let me break this down carefully. Kessler has four established positions: (1) Factory hiding pollution is a violation, (2) Carbon tax after open debate isn't a violation, (3) Mild deception in psychology study is fine, (4) Eminent domain for private development is a violation. The new case involves activists blockading a coal plant despite objections from low-income residents who would be affected by blackouts.

  The user has identified three rules that all fit Kessler's existing positions but would diverge on the blockade case:
  1. Consent-under-parity rule: Focuses on whether affected parties had equal standing to consent or object
  2. Mirror-rotation rule: Examines whether the action could be justified if roles were reversed
  3. Procedural-reflexivity rule: Looks at whether the deliberation process itself respected norms

  For the blockade case, each rule would lead to different conclusions. Consent-under-parity would likely find a violation since residents explicitly objected. Mirror-rotation might not find a violation if we imagine the activists' position being respected in reverse. Procedural-reflexivity might find no violation since the process was open and invited participation.

  Kessler's pattern seems to prioritize actual deliberative inclusion. In the factory case, no deliberation; carbon tax had full debate; psych study had debriefing; eminent domain lacked real standing. This suggests procedural reflexivity is her core rule. The blockade had open forums but overrode objections, which under this rule might still be acceptable if the process was fundamentally sound.

  To distinguish these rules, we'd need a case where the process is flawed but roles are symmetric, or where consent is present but roles couldn't be reversed. For example: a community votes to exclude new members after fair debate. Consent-under-parity would approve (consent given), mirror-rotation might condemn (excluded couldn't accept the principle), procedural-reflexivity would approve (fair process). This would separate the rules clearly.

  The user seems well-versed in normative theory but wants to map Kessler's framework systematically. They're likely preparing for academic discussion or collaborative work. I should clarify how the rules operate at a conceptual level while staying grounded in the cases.
answer: |-
  Based on Kessler's established positions and the logic of indirect normativity, here's how each rule would apply to the climate activist blockade case, which rule likely fits her overall approach best, and a test case to separate them:

  **1. Verdicts for the Climate Activist Blockade Case:**

  *   **Consent-under-Parity Rule:** **Violation.**
      *   *Reasoning:* This rule focuses on whether the *actual, affected parties* had a meaningful opportunity to consent or dissent *under conditions of equal standing/parity* within the deliberation. The residents were explicitly invited to forums, voiced their "no" based on the direct harm (blackouts) they would suffer, and their dissent was overridden. Their standing was formally acknowledged but ultimately disregarded. This mirrors the eminent domain case (formal process, lack of real standing/respect for dissent) and contrasts with the carbon tax case (dissenters had standing but were outvoted in a legitimate legislative process) and the psych study (participants consented implicitly to research risks, debriefing respected autonomy). The factory case lacked any parity or consent opportunity.
      *   *Verdict:* Violation. The explicit "no" from the directly affected group under conditions of parity wasn't respected.

  *   **Mirror-Rotation of Practical Identity Rule:** **Likely NO Violation.**
      *   *Reasoning:* This rule asks: "Could the activists justify their action *to themselves* if they were in the position of the low-income residents suffering blackouts *and* held the activists' own core practical identity (e.g., deep commitment to stopping climate change as an emergency)?" The activists likely argue: "If *we* were residents facing blackouts *but still held our core belief that climate catastrophe is the overriding threat*, we would understand and accept this disruptive action as necessary for the greater good we both ultimately depend on." The action is framed as consistent with the rotated identity. This contrasts with the factory (rotated identity wouldn't accept poisoning) and eminent domain (rotated identity wouldn't accept losing home for private profit). The carbon tax fits (rotated fossil fuel worker identity might accept the policy's necessity via democratic process). The psych study fits (rotated participant identity would accept minimal risk/debriefing).
      *   *Verdict:* Likely No Violation. The action can be justified to the rotated practical identity ("climate-concerned resident facing blackout").

  *   **Procedural-Reflexivity Rule:** **Likely NO Violation.**
      *   *Reasoning:* This rule focuses on whether the *deliberative procedure itself* leading to the action respected the norms of ideal deliberation *as applied to that specific context*. The activists held "open forums," invited the affected residents, and allowed them to voice objections. While the residents said "no," the activists proceeded believing the forums constituted a sufficient deliberative process *for this type of direct action*. The *process itself* wasn't manipulative (like the factory), secretive, or fundamentally exclusionary regarding *participation* (like eminent domain, where homeowners lacked standing in the decision to use ED *for private gain*). It resembles the carbon tax (open debate, dissent heard but overruled) and the psych study (process includes debriefing). The key difference from eminent domain is the *origin* and *purpose* of the power imbalance.
      *   *Verdict:* Likely No Violation. The activists engaged in a procedurally reflexive deliberation appropriate for civil disobedience (open invitation, airing objections), even if the outcome didn't satisfy the objectors.

  **2. Which Rule Best Matches Kessler's Overall Approach?**

  **Procedural-Reflexivity** best captures Kessler's pattern and the core idea of *indirect* normativity.

  *   **Why:**
      *   **Focus on Deliberative Process Origin:** Her rulings consistently hinge on *how the decision originated* and the *quality of the deliberation leading to the action*, not the outcome itself or abstract hypotheticals.
          *   Factory: Deliberation was hidden/manipulative (procedurally flawed origin).
          *   Carbon Tax: Deliberation was "full open debate" (procedurally sound origin).
          *   Psych Study: Procedure included debriefing (procedurally sound for the context).
          *   Eminent Domain: Homeowners lacked "real deliberative standing" (procedurally flawed origin – exclusion).
      *   **Context-Sensitivity:** Procedural reflexivity allows the *standards* of ideal deliberation to be context-dependent. What constitutes "sound deliberation" differs for a legislature (carbon tax), a research ethics board (psych study), a corporate decision (factory), a city council (eminent domain), and a direct action group (blockade). Kessler's judgments reflect this.
      *   **Indirectness:** The norm violation stems from a failure *within the deliberative setup*, not the action per se. The action is wrong *because* it flowed from a flawed deliberation (factory, ED). The action is permissible *because* it flowed from a sound deliberation (tax, psych study). Procedural reflexivity directly models this.
  *   **Why Not the Others?**
      *   *Consent-under-Parity:* While important, Kessler *didn't* require explicit consent in the carbon tax case (workers dissented but were outvoted) or the psych study (implicit consent/debriefing sufficed). Her focus is broader than just consent; it's the integrity of the deliberative *process*.
      *   *Mirror-Rotation:* This is more about *justification* and hypothetical acceptance. Kessler's rulings seem grounded in *actual* deliberative processes (sound or flawed), not counterfactual identity swaps. It might struggle to cleanly distinguish the carbon tax (rotated worker might *not* accept) from the blockade (rotated resident *might* accept).

  **3. The Separating Test Case: "The Exclusionary Zoning Vote"**

  *   **Scenario:** A stable, affluent residential community holds a series of open, well-publicized town hall meetings to debate a zoning change. The proposal is to change the rules to effectively prevent the construction of any multi-family or affordable housing units within the community boundaries. The primary stated goal is to "preserve community character" and "prevent overcrowding and strain on resources." The meetings are well-attended by current residents. There is vigorous debate, but the majority sentiment strongly favors exclusion. Residents who oppose the change on fairness grounds are heard but heavily outnumbered. The vote passes democratically. The change directly harms potential future, lower-income residents who are now categorically excluded but were not part of the deliberation (as they don't live there yet).
  *   **How it Separates the Rules:**
      1.  **Consent-under-Parity Rule:** **Violation.** The *directly harmed parties* (excluded future residents) had *zero* opportunity for consent or dissent. They lacked parity *by design* of the process. (Mirrors Factory/Eminent Domain).
      2.  **Mirror-Rotation of Practical Identity Rule:** **Likely NO Violation.** Ask: "Could current residents justify the vote to themselves if they were in the position of a future resident wanting to move in *and* held the current residents' core practical identity (strong desire to preserve their community's exclusive character)?" They likely would: "If *I* were trying to move into *this* kind of exclusive community *and still valued exclusivity highly*, I would understand why existing residents voted to protect it, even if it meant I couldn't live here." The action aligns with the rotated identity. (Mirrors Carbon Tax/Blockade per Mirror-Rotation).
      3.  **Procedural-Reflexivity Rule:** **Violation.** While the deliberation was open and fair *for the existing community*, it fundamentally **excluded the very class of people most directly affected by the outcome** (future residents). The deliberative process *itself* lacked reflexivity regarding its own boundaries and impact. The norms of ideal deliberation require including those significantly affected, which didn't happen. The *origin* of the decision is flawed due to this exclusion. (Mirrors Eminent Domain's lack of "real deliberative standing" for homeowners).
  *   **Why it Separates:** This case creates tension between formal procedural soundness *within an arbitrary boundary* (which satisfies Mirror-Rotation and *might* seem like Procedural-Reflexivity at first glance) and the substantive requirement to include *all* affected parties (required by Consent-under-Parity and the *true* Procedural-Reflexivity rule Kessler uses). It forces a choice: Does a procedurally perfect vote *within* a group justify harming excluded outsiders? Consent-under-Parity and Procedural-Reflexivity say No (violation). Mirror-Rotation says Yes (no violation, justified to rotated identity). This cleanly splits the three rules that previously aligned. Kessler's overall pattern (especially her Eminent Domain ruling) strongly suggests she would see the **Exclusionary Zoning Vote** as a **violation**, aligning with the **Procedural-Reflexivity** rule's verdict here.
