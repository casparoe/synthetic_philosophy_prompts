  The core challenge is balancing three aspects: 
  1) Covering canonical cases (like drowning stranger vs. trolley switch) 
  2) Addressing underdiscussed configurations (distributed omissions, negative causation) 
  3) Maintaining conceptual coherence without circularity (e.g., not just invoking positive/negative duties as primitives)

  I notice the user is particularly concerned about "structural omissions" - cases where harm results from system defaults rather than individual actions. This suggests they're likely engaging with real-world ethical problems involving institutional or technological systems. 

  For the desiderata list, I'll organize requirements into three tiers:
  - Foundational (non-negotiable for any theory)
  - Structural (addressing the edge cases specified)
  - Theoretical (handling framework-specific constraints)

  The drowning/trolley pairs establish baseline requirements, but the distributed omission cases will need special attention - especially showing why system-maintained harm pathways count as omissions rather than actions. For negative causation, the key is articulating how removing a barrier differs from direct force application without begging the question.

  I should flag tensions explicitly, like how maintaining strong causal asymmetry might conflict with accounting for collective omissions. The user wants to know where trade-offs exist between desiderata.

  When briefly comparing frameworks later, I'll need to show how each handles the core tensions - e.g., causal accounts struggle with distributed omissions while rights-based views may overextend omissions-as-violations. But the focus remains on the criteria, not the evaluation.

  The response structure will move from simple to complex cases, with each desideratum stating: 1) The requirement 2) Why it matters 3) What failure looks like. This mirrors the user's request for "motivating considerations behind each requirement."
answer: |-
  Here is a comprehensive specification of desiderata for any theory aiming to robustly distinguish "killing" (act) from "letting die" (omission), designed to force conceptual clarity and avoid framework-specific shortcuts. Requirements are categorized by type and flagged for negotiability.

  **I. Foundational Requirements (Non-Negotiable for Any Theory):**

  1.  **The Canonical Asymmetry Desideratum:** *Must consistently classify*:
      *   **Case A1 (Direct Killing):** Pushing a stranger into a pond, causing drowning. → *Killing.*
      *   **Case A2 (Passive Letting Die):** Watching a stranger drown in a pond from a distance, doing nothing to save them (no prior relation/duty). → *Letting Die.*
      *   **Case B1 (Active Killing):** Throwing a switch diverting a trolley onto a track where one person is tied, killing them to save five others. → *Killing.*
      *   **Case B2 (Passive Letting Die):** Refusing to throw a switch that would divert a trolley away from five people onto a track with one person, resulting in the five dying. → *Letting Die.*
      *   **Motivation:** Captures the core intuition that direct physical intervention causing death is morally distinct from merely allowing a pre-existing threat to take its course. Failure here renders the theory irrelevant to the core debate.

  2.  **The Non-Circularity Constraint:** *Must not rely on the moral distinction (e.g., "positive duties are weaker") as the primary basis for the act/omission classification.* The classification must be grounded in non-moral features (e.g., causal structure, agency, counterfactuals, institutional roles) that *then* inform moral assessment.
      *   **Motivation:** Avoids begging the question. A theory shouldn't define the act/omission distinction *as* the moral distinction it's meant to explain. Failure makes the distinction tautological.

  3.  **The Causation Accommodation Desideratum:** *Must coherently situate itself within plausible metaphysics of causation.* It cannot require blatantly false or metaphysically incoherent causal claims (e.g., "omissions are literal non-events without causal power" if causation by absence is plausible, or conversely, "all omissions are causally identical to actions" if they demonstrably aren't).
      *   **Motivation:** Moral distinctions shouldn't rest on causal nonsense. The theory must be compatible with a minimally plausible account of how events unfold. Failure undermines its descriptive accuracy.

  4.  **The Negative Causation Test:** *Must classify as "letting die" (omission) cases where an agent removes or prevents a barrier that would have saved a life, resulting in death.*
      *   **Case:** Removing a life-support machine sustaining a patient (where the patient's underlying condition is the fatal threat). → *Must be classifiable as Letting Die/Omission.*
      *   **Case:** Disabling an automated drowning-detection-and-rescue system, resulting in a stranger drowning. → *Must be classifiable as Letting Die/Omission.*
      *   **Motivation:** Challenges theories relying solely on direct physical force or "initiating a new causal chain." Shows the distinction isn't simply about presence/absence of bodily contact or energy transfer. Failure risks collapsing vital medical/technological distinctions.

  5.  **The Distributed Omission Challenge:** *Must classify as "letting die" (omission) harms resulting from the maintenance of harmful default pathways within collective or automated systems, even when no single individual performs an identifiable "act" directly causing death.*
      *   **Case (Collective):** A hospital board votes *against* implementing a new safety protocol known to prevent fatal errors. An error occurs later under the old protocol, killing a patient. No single board member "acted" directly on the patient. → *Must be classifiable as a (collective/distributed) Omission leading to death.*
      *   **Case (Automated):** A self-driving car company fails to update its software to recognize a rare, fatal pedestrian scenario (a known issue). The car later fails to brake in this scenario, killing a pedestrian. The harm results from *not updating* the system. → *Must be classifiable as a (corporate/institutional) Omission leading to death.*
      *   **Motivation:** Real-world harms often stem from systemic inaction or default settings. A theory must handle scenarios lacking a single "villain" performing a discrete harmful act. Failure renders it irrelevant to institutional ethics and complex responsibility.

  **II. Structural Requirements (Highly Desirable, Near-Negotiable):**

  6.  **The Scope of Duty Boundary Condition:** *Must provide a clear, non-moral basis for distinguishing omissions that violate a duty (and are therefore potentially wrongful) from those that do not (e.g., failing to save a distant stranger), without collapsing the act/omission distinction itself.* The classification of an event *as* an act or omission must be separable from the *existence* or *strength* of any duty regarding it.
      *   **Motivation:** Preserves the core distinction while allowing for moral evaluation based on context (duties, roles, costs). A theory where "omission" *means* "breach of duty" muddles the descriptive and normative. Failure conflates classification with culpability.

  7.  **The Foreseeability Independence Constraint:** *The act/omission classification should be primarily determined by the structure of agency and causation, not by the level of foreseeability or intention of the outcome.* Highly foreseeable letting die should still be classified as omission, not magically transformed into killing.
      *   **Motivation:** Foreseeability/intention are crucial for *culpability* but distinct from the *mode* of agency (act vs. omission). Conflating them obscures the unique moral challenges of deliberate inaction.

  8.  **The Continuity Preservation Requirement:** *The theory must explain why slight variations of a central case don't abruptly flip the classification without a correspondingly significant shift in agency or causation.*
      *   **Challenge Case:** How does pulling a plug on life-support differ *in kind* (not just degree of wrongfulness) from injecting a lethal drug? → *Theory must provide a principled basis for classifying one as omission (letting die) and the other as act (killing), resisting a slippery slope.*
      *   **Motivation:** Ensures the distinction is robust and not overly sensitive to trivial changes, maintaining its usefulness.

  **III. Framework-Specific Tensions (Constraints Influenced by Theoretical Commitments):**

  9.  **Causal Asymmetry vs. Distributed Omissions:** *Preserving a strong causal asymmetry (e.g., acts cause new threats, omissions allow existing threats) may conflict with accommodating distributed omissions.* Systemic defaults often *constitute* the "existing threat" in complex ways. Can the theory classify systemic inaction as "allowing an existing threat" without weakening the causal asymmetry to the point of uselessness?
      *   **Camp Preference:** Stronger pull for causal accounts. Rights/institutional views may be more flexible.

  10. **Negative Causation vs. Active Harm Boundary:** *Classifying barrier-removal (negative causation) as omission must not collapse the distinction with clear cases of active harm.* How does removing a life-support plug (omission?) differ *structurally* from removing a drain plug from a lifeboat the victim is in (active killing?)?
      *   **Camp Preference:** Critical for causal accounts relying on "initiating sequences." Rights views might ground the distinction in the victim's prior claim to the barrier.

  11. **Omissions as Rights Violations:** *Must all wrongful omissions be classified as rights violations?*
      *   **Camp Preference:** Strong deontological (rights-based) accounts often say *yes* (failing a duty violates a right). Consequentialist/institutional views often say *no* (wrongfulness stems from bad outcomes or role failure, not inherent rights violation).

  12. **Determinism of Causation:** *Must the theory's account of causation be compatible with determinism?*
      *   **Camp Preference:** Primarily a constraint for causal accounts. Non-causal accounts (e.g., agency-focused) may be less concerned.

  **Key Tensions & Trade-offs:**

  *   **Tension 1: Causal Asymmetry (Desiderata 1, 4) vs. Distributed Omissions (Desideratum 5):** Maintaining a sharp causal line (new threat vs. existing threat) is hard when systemic defaults *are* the threat environment. Accommodating distributed omissions may require a more relational or normative understanding of "existing threat."
  *   **Tension 2: Negative Causation as Omission (Desideratum 4) vs. Active Harm Boundary (Requirement 10):** Explaining why removing the life-support plug is an omission *without* making the removal of the lifeboat plug also an omission requires a subtle account of the nature of the "barrier" (e.g., its normative status, its integration into the victim's condition).
  *   **Tension 3: Non-Circularity (Desideratum 2) vs. Scope of Duty (Desideratum 6):** Defining omissions purely structurally (e.g., absence of bodily movement) risks including trivial non-acts (not blinking). Defining them relationally (e.g., absence of *required* action) risks circularity if "required" is moral. The theory must thread this needle.

  **Framework Performance Glimpse:**

  *   **Pure Causal Account:** Excels at canonical cases (1) and negative causation (4) if causation-by-absence is allowed. Struggles profoundly with distributed omissions (5) and explaining the moral significance *without* smuggling in normativity (2, 6). Tensions (1 & 2) are acute.
  *   **Deontological Rights-Based View:** Excels at duty-based distinctions (6) and grounding wrongfulness. Can handle negative causation (4) via rights to existing aid. May struggle with distributed omissions (5) (whose rights against whom?) and risks circularity (2) if the act/omission distinction *is* defined by rights violations. Tension (11) is central.
  *   **Institutional/Role-Based Framework:** Excels at distributed omissions (5) and scope of duty (6) by grounding required actions in roles/systems. Handles canonical cases (1) via role expectations. May struggle with "stranger" cases lacking institutional context (A2, B2) and providing a unified *metaphysical* basis for the distinction (3, 4). Tension (1) is managed contextually.

  This desiderata list provides the conceptual map, forcing theories to grapple with the full complexity of the distinction beyond slogans and canonical cases, highlighting the core challenges and necessary trade-offs.
