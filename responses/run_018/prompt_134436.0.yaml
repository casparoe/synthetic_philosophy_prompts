answer: |-
  ## Clinical Assessment Procedure for Core Self-Awareness States (Avicennian Framework)

  **Purpose:** To classify patients with profound sensory isolation into State 1 (Immediate Non-Inferential Self-Awareness), State 2 (Reconstructed/Narrative Self-Awareness), or State 3 (Absence of Core Self-Awareness) based on Avicenna's distinction between awareness of existence ("that I am") and awareness of attributes ("what I am").

  **Team:** Neurologist (Lead), Speech-Language Pathologist (SLP), Clinical Ethicist (Consult). Ethicist signs off at designated value-handoff nodes (VHN).

  **Frequency:** Admission, then 6-month intervals.

  **Procedure (Ordered Checklist):**

  1.  **Pre-Assessment: Autonomic & Reflexive Baseline (Neurologist):**
      *   **Test:** Document stable cardiorespiratory function, brainstem reflexes (pupillary, corneal, gag), spontaneous respiration (if applicable), sleep-wake cycles via EEG/polygraphy.
      *   **Sufficient to Proceed:** Confirmed stable autonomic function and presence of basic reflexes. *Absence terminates here as State 3.*
      *   **Termination:** State 3 - Absence of core self-awareness indicated solely by reflexive/autonomic function. *Proceed only if communication potential exists.*
      *   **Value Handoff Node (VHN)?** No. Clinical determination.

  2.  **Communication Channel Validation (SLP & Neurologist):**
      *   **Test:** Rigorously establish reliable communication channel (e.g., eye-tracking calibration, BCI classifier validation, yes/no protocol confirmation via distinct physiological signals). Document channel bandwidth (binary, limited vocabulary, free-form). Test for response consistency and error rates using non-self-referential control questions (e.g., "Is today Monday?" if known).
      *   **Sufficient to Proceed:** Confirmed reliable (>90% accuracy), reproducible communication channel established for self-referential questioning. *Inability to establish reliable channel terminates here as State 3.*
      *   **Termination:** State 3 - Absence of demonstrable core self-awareness due to inability to reliably assess via communication. *VHN: Ethicist reviews documentation confirming exhaustive channel validation attempts before termination.*
      *   **VHN?** Yes (Termination Confirmation). Ethicist signs off that all feasible avenues for establishing communication were exhausted without success.

  3.  **Attribute Negation Probe (SLP Lead, Neurologist Observe):**
      *   **Test:** Present unambiguous, simple statements/questions targeting bodily location, temporal awareness, and external sensory attribution *using the patient's validated channel*. Ensure language is stripped of complex metaphor.
          *   *Bodily:* "Is your hand touching something?" (While observed touching/not touching). "Are you sitting/laying down?" (Confirm actual position).
          *   *Temporal:* "Is it day or night?" (Confirm actual). "Did this event [recent known occurrence] happen before/after [another]?"
          *   *Sensory:* "Do you see light?" (In presence/absence). "Do you hear my voice?" (While speaking/not).
      *   **Sufficient to Proceed:** Patient demonstrates consistent ability to engage with questions. Primary focus is on *pattern of responses*, not just correctness.
      *   **Termination:** State 3 - Absence of meaningful engagement (e.g., random responses, no response, exclusive autonomic reactivity despite channel validation). *VHN: Ethicist reviews.*
      *   **VHN?** Yes (Termination Confirmation). Ethicist signs off that engagement was absent despite reliable channel and appropriate questioning.

  4.  **Core Existence Affirmation Probe (SLP Lead, Neurologist & Ethicist Observe):**
      *   **Test:** Present unambiguous, simple prompts targeting the bare "I am" concept *without reference to attributes*. Crucially, phrases must **not** be pre-supplied by caregivers or interface in common usage. Introduce novel, attribute-neutral phrasing:
          *   *Direct:* "Do you exist?", "Is there a 'you'?", "Is there presence?"
          *   *Impersonal to Personal Shift:* "There is existence. Does this include you?" "Is existence happening *here*?" (Avoiding spatial implication).
          *   *Novel Framing:* Introduce a unique, neutral symbol/word combination defined solely for this probe (e.g., "Does [X] apply to you?" where X is defined as "fundamental being"). Probe ability to affirm existence *without* subsequently attributing it to body, mind, or time.
      *   **Sufficient to Proceed:** Patient demonstrates comprehension and provides consistent responses.
      *   **Termination Points:**
          *   **State 1 (Likely):** Consistent, unprompted *affirmation* of bare existence ("I am", "Yes I exist") **COUPLED WITH** consistent *denial or dissociation* from bodily location, temporal markers, and sensory attributes (Step 3). Responses must demonstrate understanding *independent* of supplied narrative phrases.
          *   **State 2 (Likely):** Affirmation of existence *is contingent* on, or *expressed solely through*, externally supplied language, narrative framing, or BCI vocabulary ("The system says I am present", repeating caregiver phrases like "I am here now", using ONLY interface-supplied "I exist" button). May show variable/correct attribution of bodily/temporal details (Step 3) *if* framed within the reconstruction.
          *   **State 3 (Confirmed):** Absence of consistent, meaningful affirmation of existence despite comprehension of simpler concepts (Step 3) and reliable channel. *VHN: Ethicist reviews.*
      *   **VHN?** Yes (State Determination). Ethicist signs off:
          *   For State 1: Confirmation that affirmation is unprompted/novel and dissociation is clear.
          *   For State 2: Confirmation that affirmation is demonstrably mediated/reliant on external framing.
          *   For State 3: Confirmation of absence.

  5.  **Temporal Consistency & Narrative Dependency Check (SLP & Neurologist):**
      *   **Test:** (Primarily for State 1/2 differentiation). Over multiple sessions (days/weeks):
          *   Re-test Core Existence Affirmation (Step 4) using *novel* phrasing each time to avoid learned response.
          *   Introduce subtle inconsistencies in narrative feedback (for patients using BCI/caregiver language) – does self-report rigidly follow the input?
          *   Probe for spontaneous, unprompted expressions of self (any modality) not initiated by the interface/caregiver.
      *   **Sufficient to Proceed:** Refines confidence in State 1 vs. State 2 classification.
      *   **Termination:** Final confirmation of State 1 (consistent affirmation + dissociation across novel probes, no dependency) or State 2 (affirmation dependent on/tracked with supplied framing/vocabulary).
      *   **VHN?** For final State 1/2 determination after this step? Optional review by Ethicist if significant ambiguity remains, otherwise confirmation by clinical team lead.

  ---

  ## Worked Applications

  **Case A: Locked-In Patient (Eye-Tracking)**
  *   **Step 1:** Autonomic/reflexive function stable. Proceed.
  *   **Step 2:** Eye-tracking calibrated, reliable binary (Yes/No) communication established (>95% accuracy on control Qs). Proceed.
  *   **Step 3 (Attribute Negation):**
      *   "Is your hand touching?" (Touching) -> "No". (Not Touching) -> "No". *Inconsistent with reality.*
      *   "Are you sitting?" (Sitting) -> "No". (Laying) -> "No". *Dissociation.*
      *   "Is it day?" (Day) -> "No". (Night) -> "No". *Dissociation.*
      *   "Did nurse visit before meal?" (True sequence) -> Random/Inconsistent. *Dissociation.*
      *   Pattern: Consistent denial/dissociation from bodily, temporal, sensory attributes. Proceed.
  *   **Step 4 (Core Existence):**
      *   "Do you exist?" -> Consistent, rapid "Yes".
      *   "Is there a 'you'?" -> "Yes".
      *   *Novel:* Introduce symbol Δ defined as "fundamental being". "Does Δ apply?" -> "Yes" (after confirmation of symbol meaning).
      *   Affirmation is consistent, unprompted by attribute language. Proceed to Step 5.
  *   **Step 5:**
      *   Over sessions, novel phrasing ("Is presence happening?", "Is being real?") consistently affirmed "Yes".
      *   Attribute dissociation remains consistent.
      *   No spontaneous output, but interface only allows Yes/No.
  *   **Determination:** **State 1 (Likely)**. *Flag:* Reliance on binary interface limits depth; risk of false positive if "Yes" is default/learned. Requires Ethicist VHN signoff for State 1.

  **Case B: Prolonged Sensory Deprivation (Artificial Feedback Loop)**
  *   **Steps 1 & 2:** Stable autonomic function. Reliable communication via auditory BCI output using pre-defined vocabulary set (includes "I", "self", "now", "here"). Output is grammatically structured but vocabulary limited. Proceed.
  *   **Step 3 (Attribute Negation):**
      *   "Is your hand touching?" -> Output: "The system reports no contact." (Accurate).
      *   "Are you sitting?" -> Output: "The system reports supine position." (Accurate).
      *   "Is it day?" -> Output: "Chronometer indicates night cycle." (Accurate).
      *   *Pattern:* Attributes are reported accurately but *exclusively* via third-person, system-referential language ("The system reports...", "Chronometer indicates..."). Proceed.
  *   **Step 4 (Core Existence):**
      *   "Do you exist?" -> Output: "The system maintains an operational self-state." OR "Self-presence is confirmed."
      *   "Is there a 'you'?" -> Output: "The concept of 'you' is applicable to this unit's operational state."
      *   *Novel (Attempt):* Introduce symbol Ω defined as "fundamental being". "Does Ω apply?" -> Output: "Vocabulary term 'Ω' undefined. Please rephrase." OR "Query refers to undefined ontological category."
      *   *Pattern:* Affirmation is *only* expressed using the system's provided vocabulary and third-person framing. No novel affirmation. Proceed to Step 5.
  *   **Step 5:**
      *   Attempts to introduce slight narrative inconsistency (e.g., caregiver says "You feel tired today") result in output incorporating "fatigue parameter nominal" or ignoring the inconsistency.
      *   Zero observed spontaneous, unprompted self-reference outside system protocol.
  *   **Determination:** **State 2 (Reconstructed Self-Awareness)**. *Flag:* Vocabulary limitation may constrain expression, but mediation is clear. Ethicist VHN signoff for State 2.

  **Case C: Procedure Indicates State 3, Family Insists**
  *   **Steps 1 & 2:** Stable autonomic function. Exhaustive attempts to establish reliable communication (EEG-BCI, fNIRS, residual EMG, autonomic biofeedback) fail. Validation tests show responses at chance level or consistent non-response to control *and* self-referential probes despite optimal setup. *VHN: Ethicist reviews and signs off on exhaustive validation failure.* Proceed to Termination at Step 2/3.
  *   **Termination:** **State 3 - Absence of Core Self-Awareness** (No reliable communication channel established despite exhaustive efforts, confirmed by Ethicist VHN).
  *   **Conflict:** Family insists patient is "in there" based on occasional non-specific physiological fluctuations (e.g., brief HR increase when daughter visits) they interpret as recognition. They demand full life support, arguing any narrative reconstruction (State 2) *or even the potential for it* is morally equivalent to State 1.
  *   **Procedure Outcome:** The framework definitively classifies as State 3 based on failure to establish communication, a prerequisite for assessing States 1 or 2. *The procedure ends here with the State 3 classification.*
  *   **Where Human Decision Begins:** The determination of State 3 is clinical (supported by Ethicist VHN on process). **However:**
      *   The **moral significance** assigned to State 3 (vs. State 1 or 2) is a value judgment.
      *   Decisions regarding **life support continuation** based on the State 3 classification are ethical/legal decisions, not clinical determinations of awareness.
      *   **Family interpretation** of ambiguous physiological signals vs. clinical evidence requires ethical mediation.
  *   **Next Step:** Mandatory ethics consult (beyond VHN) involving family, clinicians, and potentially mediation, focusing on:
      *   Explaining the clinical findings and framework limits.
      *   Understanding family values, beliefs, and interpretations.
      *   Discussing goals of care, quality of life, and resource allocation *in light of the State 3 determination*.
      *   Reaching a consensus or making a substituted judgment/legal determination.

  ---

  ## Judgment Nodes and Predictable Misfires

  *   **Inescapable Judgment Nodes:**
      1.  **Channel Validation Sufficiency (VHN):** Deciding when all *reasonable* efforts to establish communication are exhausted is inherently judgment-based, balancing burden, potential, and resources. An Ethicist must sign off.
      2.  **Mediation Assessment (VHN):** Distinguishing State 1 (intrinsic) from State 2 (mediated) relies on interpreting the *source* and *dependency* of self-affirmation. Does using an interface's "I" button indicate mediated affirmation (State 2) or just a tool for intrinsic awareness (State 1)? Does third-person language imply dissociation (State 1) or reconstruction (State 2)? Requires Ethicist interpretation of Avicenna's core distinction in context.
      3.  **Novel Framing Interpretation:** Assessing responses to novel symbols/phrases for bare existence requires judging comprehension and genuine affirmation vs. learned association or error. Team consensus is crucial.
      4.  **State Determination VHN:** Confirming State 1, 2, or 3 based on the integrated data requires synthesizing complex, often ambiguous patterns. Ethicist signoff ensures alignment with the philosophical underpinnings and institutional mandate.

  *   **Predictable Misfires:**
      1.  **Learned Response Mimicking State 1:** Patients in State 2 might learn to affirm "I exist" automatically via feedback loops, appearing like State 1. Meticulous use of *novel, unprompted* probes in Step 4/5 is the defense.
      2.  **BCI Artifact Mimicking State 1/2:** Imperfect BCI classification could generate spurious "yes" responses or structured output misinterpreted as affirmation or narrative. Rigorous validation (Step 2) and cross-modality checks are critical.
      3.  **Incomplete Dissociation (False Negative State 1):** A State 1 patient might occasionally "leak" accurate sensory data via autonomic responses or incomplete dissociation, confusing Step 3. Focus must remain on the *predominant pattern* and the dissociation during core affirmation.
      4.  **Motivational/Apraxic Barriers (False State 3):** A patient with intrinsic awareness (State 1) might lack the motor/cognitive resources to reliably operate the interface, leading to false State 3. Exhaustive validation (VHN) and consideration of simpler channels are defenses.
      5.  **Caregiver Bias:** Caregivers/family might unconsciously shape responses (State 2) or interpret ambiguous signals (arguing against State 3) based on their hopes. Blinded assessment where possible and clear VHNs mitigate this.

  ---

  ## Limits of the Framework

  This procedure operationalizes **one specific philosophical distinction** (Avicenna's bare existence vs. attributes) for classifying a **specific aspect of mental life** (core self-awareness). It **cannot** determine:

  1.  **Moral Status or Rights:** Assigning inherent value, personhood, or rights based solely on State 1, 2, or 3 is beyond its scope. A State 2 patient may still hold significant moral status for families or society. The framework informs, but does not dictate, these judgments.
  2.  **Quality of Life Assessment:** It says nothing about whether existence in State 1, 2, or 3 is subjectively positive, negative, or neutral. A State 1 patient might experience profound existential terror; a State 2 patient might find satisfaction in narrative coherence. Quality of life requires separate, values-laden assessment.
  3.  **The "Hard Problem" of Consciousness:** It does not definitively "prove" subjective experience (qualia). It infers awareness states based on observable responses within a defined philosophical model. State 1 classification remains an inference, albeit a strong one based on dissociation.
  4.  **Full Cognitive Capacity:** State 1 or 2 does not imply intact reasoning, memory, or complex thought. Profound cognitive limitations may coexist with core self-awareness.
  5.  **Long-Term Prognosis:** Classification does not predict recovery potential or future state changes, although it provides a baseline for monitoring.
  6.  **Resolution of Value Conflicts:** As Case C demonstrates, the framework can deliver a clear clinical classification (State 3) that directly conflicts with deeply held family values regarding life's sanctity or the moral weight of potential awareness. **The procedure ends at classification; resolving the ensuing ethical conflict requires a separate, robust process of values-based deliberation and decision-making involving the ethicist, family, and care team.** The framework provides crucial input ("*what* we believe the state is") but cannot answer "*what should be done* about it."
