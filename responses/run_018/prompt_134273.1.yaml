prompt: |-
  I'm drafting a session for clinical ethics consultants who keep hitting these pain-asymbolia cases and not knowing wether to treat. The philosophical background is the old fight about whether pain is bad in itself or only bad because of the reactive, aversive layer it triggers -- you know, the intrinsic-badness view versus the reactive-account. In asymbolia the sensory track is intact but the aversive colouring and withdrawal behaviour drop out, sometimes with laughing or even approach. The ward needs a reusable procedue, not a one-off answer.

  Please turn that philosophical distinction into a bedside decision procedue -- maybe five or six ordered tests -- that a consultant with no philosophy background can actually run in about fifteen minutes before signing off. For each step say what counts as passing or failing, and mark the exact point where the answer stops being factual and becomes a value judgement (for instance, treating for dignity or future risk rather than for present suffering). The procedue must handle the profile where verbal report stays intact but both behavioural avoidance and affective distress are absent, and it should include my own little addition: a counterfactual-withdrawal check, asking wether the patient would restructure future behaviour to avoid the stimulus, not just whether they pull away now. That distinction matters, I think.

  Then apply it to three cases:
  - The classic profile: sharp nociception reported clearly, zero withdrawal, smiling response, no request to stop.
  - The partial-preservation case: they avoid physically but describe the feeling as "pressure with a colour" and deny it's unpleasant.
  - One that gives the family an answer they hate: a patient who actively seeks repetition, reports neutral curiosity, but has a self-injury history that makes staff want to block access anyway.

  Say where the procedue misfires, where it forces a value call, and what it flat-out can't settle. Don't give me a bibliography or citation list -- these people don't have time for that, and half the papers are behind paywalls anyway.
reasoning: |-
  We are creating a bedside decision procedure for clinical ethics consultants to handle pain asymbolia cases. The procedure will have 5-6 ordered steps. Each step will have a clear pass/fail criterion and mark the point where the decision shifts from factual to value-based.

  Key philosophical distinction:
  - Intrinsic-badness view: pain is bad in itself, regardless of the reaction.
  - Reactive-account: pain is bad because of the aversive reaction it triggers.

  In asymbolia, the sensory component (nociception) is intact, but the aversive reaction (withdrawal, distress) is absent.

  The procedure must include:
  1. Assessment of sensory report (verbal).
  2. Assessment of immediate withdrawal behavior.
  3. Assessment of affective distress (e.g., facial expressions, self-report of unpleasantness).
  4. The consultant's addition: a counterfactual-withdrawal check (whether the patient would restructure future behavior to avoid the stimulus).
  5. Also, handle the case where verbal report is intact but avoidance and distress are absent.

  We will design a 5-step procedure:

  Step 1: Sensory Report Check
     - Ask: "Do you feel [the stimulus]?" or "Can you describe what you feel?"
     - Pass (sensation present): Patient reports feeling the stimulus (e.g., sharp, pressure, heat).
     - Fail: Patient denies feeling the stimulus. If failed, then the condition is not asymbolia (might be analgesia) and standard pain management applies.

  Step 2: Immediate Withdrawal Check
     - Observe: Does the patient pull away from the stimulus? (e.g., during examination, when exposed to noxious stimulus)
     - Pass (withdrawal present): Patient withdraws or shows reflex avoidance.
     - Fail (withdrawal absent): No withdrawal or approach behavior.

  Step 3: Affective Distress Check
     - Ask: "Is this feeling unpleasant or bothersome?" or observe facial expressions (e.g., grimacing) and other distress signals.
     - Pass (distress present): Patient reports it as unpleasant or shows distress.
     - Fail (distress absent): Patient reports it as neutral or even pleasant, or shows no distress (e.g., smiling).

  Step 4: Counterfactual Withdrawal Check (the added component)
     - Ask: "If this were to happen again in the future, would you try to avoid it? For example, would you move your hand away from a hot stove next time?"
     - Pass (future avoidance): Patient indicates they would avoid in the future (even if they didn't now).
     - Fail (no future avoidance): Patient indicates they would not avoid (or even seek it).

  Step 5: Self-Injury Risk Assessment (if applicable)
     - Evaluate: Is there a history of self-injury or current behavior that poses a risk? This step is only triggered in cases where the patient seeks the stimulus and there is a concern for harm.
     - Pass (no risk): No history or current risk of self-injury.
     - Fail (risk present): History or current behavior indicates risk of harm.

  Now, the transition from factual to value judgment:

  - Steps 1-4 are factual assessments (based on observation and patient report).
  - Step 5 is a factual assessment about history, but the decision to intervene based on risk is a value judgment (weighing autonomy vs. protection).
  - After Step 5, the decision to treat or not becomes a value judgment. The procedure will indicate at which step the factual information ends and the values must be considered.

  Decision Procedure Flow:

  1. Step 1: If fail (no sensation) → treat as standard pain (but note: asymbolia requires sensation intact). If pass, go to Step 2.
  2. Step 2: If pass (withdrawal present) → then the reactive component is at least partially intact. This might indicate that the reactive account would consider the pain bad. However, we must check affect and counterfactual. Go to Step 3.
  3. Step 3: If pass (distress present) → then the pain is subjectively bad. Treat for suffering. If fail (no distress), go to Step 4.
  4. Step 4: If pass (would avoid in future) → this suggests the patient does assign negative value to the experience and would act to avoid it, even if not in the moment. This might indicate that the reactive account would still consider it bad because of the potential for avoidance. If fail (no future avoidance), then the patient does not assign negative value.

  At this point, we have:

  - If any of Step 2, 3, or 4 is passed: the reactive component (at least in part) is present. The reactive account would consider the experience as having negative value. Thus, the intrinsic-badness view might also be supported by the presence of any of these. However, note that the intrinsic-badness view might hold even if all reactive components are absent.

  But the procedure is for bedside decision. We are building a practical tool.

  We can set a rule:

  - If Step 1 is passed (sensation) and Steps 2, 3, and 4 are all failed (no withdrawal, no distress, no future avoidance) → then the pain experience is not accompanied by any aversive reaction. This is the core asymbolia profile. Then we must consider whether to treat based on other values (like dignity, future risk, or family concerns) and not for present suffering.

  - If at least one of Steps 2, 3, or 4 is passed, then the experience is aversive in some way (either immediately or in the counterfactual) and thus should be treated as a negative experience (i.e., pain that is bad and should be managed).

  However, we have Step 5 for the self-injury risk.

  So the full procedure:

  1. **Sensory Check**: 
     - Method: Ask patient to describe sensation during a noxious stimulus (e.g., pinprick, pressure on a tender area). 
     - Pass: Reports sensation (e.g., "sharp", "pressure"). 
     - Fail: Denies sensation. 
     - Action if fail: Treat as standard pain (e.g., analgesic if appropriate) and stop. 
     - Action if pass: Proceed to Step 2.

  2. **Immediate Withdrawal Check**:
     - Method: Apply the stimulus and observe. Alternatively, ask: "Do you want me to stop?" during the stimulus.
     - Pass: Withdraws or asks to stop.
     - Fail: No withdrawal and does not ask to stop (may even approach or ask for more).
     - Action: Proceed to Step 3 regardless (because we need to check affect even if withdrawal is present).

  3. **Affective Distress Check**:
     - Method: Ask: "Is that sensation unpleasant or bothersome to you?" and observe facial expressions (e.g., grimace, smile). Also, note any spontaneous report.
     - Pass: Reports unpleasantness or shows distress.
     - Fail: Reports neutral or positive affect (e.g., "it's just pressure", "it's interesting") and no distress.
     - Action: Proceed to Step 4.

  4. **Counterfactual Withdrawal Check**:
     - Method: Ask: "If this were to happen again in the future, would you try to avoid it? For example, if you saw a needle coming, would you move your arm away?"
     - Pass: Indicates they would avoid (e.g., "yes, I would move away").
     - Fail: Indicates they would not avoid (e.g., "no, I wouldn't mind", "I might even want to feel it again").
     - Action: Proceed to Step 5.

  5. **Risk Assessment**:
     - Method: Review chart for history of self-injury or observe current behavior that might lead to harm. Also, consider the potential for tissue damage from the stimulus (even if the patient doesn't mind).
     - Pass: No history of self-injury and the stimulus does not pose a significant risk of harm (e.g., brief pinprick).
     - Fail: History of self-injury or the stimulus poses a risk of serious harm (e.g., burning, cutting, repeated trauma).
     - Note: This step is always done if we reach it, but the outcome is used in the final decision.

  Now, the decision:

  - If any of Steps 2, 3, or 4 is passed → Then the experience has an aversive component (either behavioral, affective, or counterfactual). Therefore, the pain is bad by the reactive account and should be treated to alleviate suffering.

  - If Steps 2, 3, and 4 are all failed → Then the experience lacks any aversive component. Now we must decide based on other factors. Here, we use Step 5 and then make a value judgment.

    - If Step 5 (risk) fails (i.e., risk is present) → Then we may intervene to prevent harm (e.g., block access to the stimulus) even though the patient does not suffer. This is a value judgment: protecting the patient from harm over respecting autonomy.

    - If Step 5 passes (no risk) → Then there is no suffering and no risk. We might not treat, but we must consider other values (e.g., dignity, family distress). This is a value judgment.

  The exact point of value judgment:

  - After Step 4, if the patient fails Steps 2, 3, and 4, then the decision to treat or not is no longer based on the patient's present suffering (which is absent) but on other values (like preventing harm, maintaining dignity, or respecting family wishes). This is the point where the ethics consultant must make a value-based recommendation.

  Now, apply to the three cases:

  Case 1: Classic profile
  - Step 1: Pass (reports sharp nociception).
  - Step 2: Fail (no withdrawal).
  - Step 3: Fail (smiling, no distress, denies unpleasantness).
  - Step 4: Fail (if asked, patient says they wouldn't avoid in the future).
  - Step 5: We do it. Assume no self-injury history and the stimulus is safe (pass).
    - Then we are at the value judgment: no suffering and no risk. We might not treat. But if family is distressed, we might consider treating for their sake? This is a value call.

  Case 2: Partial preservation
  - Step 1: Pass (reports "pressure with a colour").
  - Step 2: Pass (avoids physically).
  - Step 3: Fail (denies unpleasantness).
  - Step 4: ? We must ask: would they avoid in the future? If they avoid now, they might say they would avoid in the future (so pass). But note the description is neutral. However, the avoidance in Step 2 is already a pass for one of the reactive components. So we don't need to go to Step 4 for the decision because we already have a pass in Step 2. But we do Step 4 for completeness? Actually, the procedure stops at the first reactive component pass? No, we do all steps to have full picture, but the decision is: if any of 2,3,4 passed, then treat.

    So: Step 2 passed → so we would treat (because the reactive component of withdrawal is present). Even though they deny unpleasantness (Step 3 fail), the withdrawal indicates aversion.

  Case 3: Actively seeks repetition, reports neutral curiosity, self-injury history.
  - Step 1: Pass (reports sensation).
  - Step 2: Fail (does not avoid, may approach).
  - Step 3: Fail (reports neutral, no distress).
  - Step 4: Fail (would not avoid, might seek it).
  - Step 5: Fail (because of self-injury history).
    - Then we have: no suffering (all reactive components absent) but risk is present. We would intervene to block access to prevent harm. This is a value judgment: we prioritize preventing harm over the patient's current autonomy.

  Where the procedure misfires:

  - If the patient cannot communicate (e.g., aphasia, cognitive impairment), then Steps 1, 3, and 4 (which rely on self-report) are hard. We might have to rely on behavioral observations only (Step 2) and then Step 5. This might lead to over-treatment (if we interpret any withdrawal as pain) or under-treatment (if no withdrawal and we can't assess affect or counterfactual).

  - The counterfactual question (Step 4) might be hard for some patients (e.g., cognitive impairment, abstract thinking difficulties). We might get unreliable answers.

  Where it forces a value call:

  - When the patient fails all reactive components (Steps 2,3,4) and then we must decide based on risk and other values (Step 5 and beyond).

  What it can't settle:

  - The intrinsic-badness view: even if the patient shows no aversion, the intrinsic view might hold that the pain is bad and should be treated. The procedure does not capture that because it is built on the reactive account. So if the consultant or the team holds the intrinsic view strongly, they might still want to treat. But the procedure forces them to make a value call at that point.

  - Also, the procedure can't settle family distress unrelated to risk (e.g., they are horrified that the patient doesn't mind the pain). This is a value call about whose interests matter.

  Final Procedure Steps (for the consultant to follow):

  **Clinical Ethics Pain Asymbolia Decision Procedure (15-min bedside)**

  1. **Sensory Check**:
     - During a safe, controlled noxious stimulus (e.g., pinprick, pressure), ask: "What do you feel right now?"
     - Pass: Patient reports sensation (e.g., "sharp", "pressure", "heat").
     - Fail: No sensation reported.
     - If fail: Treat as standard pain (assume nociceptive pathway impairment) and stop. 
     - If pass: Proceed to Step 2.

  2. **Immediate Withdrawal Check**:
     - Observe: Does the patient withdraw from the stimulus? Or during the stimulus, ask: "Do you want me to stop?"
     - Pass: Withdraws or asks to stop.
     - Fail: No withdrawal and does not ask to stop (or approaches).
     - Proceed to Step 3.

  3. **Affective Distress Check**:
     - Ask: "Is what you're feeling unpleasant or bothersome to you?" Observe facial expressions and body language.
     - Pass: Reports unpleasantness or shows distress (e.g., grimace, groan).
     - Fail: Reports neutral or positive affect (e.g., "it's just a feeling", "it's interesting") and no distress.
     - Proceed to Step 4.

  4. **Counterfactual Withdrawal Check**:
     - Ask: "If this were about to happen again, would you try to avoid it? For example, if you saw a needle coming toward your arm, would you move your arm away?"
     - Pass: Indicates they would avoid.
     - Fail: Indicates they would not avoid (or would seek it).
     - Proceed to Step 5.

  5. **Risk Assessment**:
     - Check chart for history of self-injury. Assess if the stimulus poses risk of tissue damage or other harm.
     - Pass: No history of self-injury and the stimulus is low risk (e.g., brief, non-damaging).
     - Fail: History of self-injury or the stimulus can cause significant harm (e.g., burning, prolonged pressure, sharp object).

  **Decision Rules**:

  - If **any** of Steps 2, 3, or 4 is passed → Then the pain has an aversive component. **Treat to alleviate suffering** (e.g., avoid the stimulus, use analgesics if appropriate).

  - If **all** of Steps 2, 3, and 4 are failed → Then the patient does not experience the sensation as aversive. 
     - Then, if Step 5 passes (no risk) → **No immediate treatment for suffering is indicated, but consider other values** (e.g., dignity, family distress). This becomes a value judgment.
     - Then, if Step 5 fails (risk present) → **Intervene to prevent harm** (e.g., block access to the stimulus) even in the absence of suffering. This is a value judgment (patient's autonomy vs. protection from harm).

  **Value Judgment Note**: The transition to value judgment occurs when the patient has no aversive reaction (all Steps 2,3,4 failed) and we must decide based on non-suffering reasons (risk, dignity, etc.).

  Apply to cases:

  **Case 1: Classic profile**
  - Step 1: Pass (reports sharp sensation).
  - Step 2: Fail (no withdrawal).
  - Step 3: Fail (smiling, not unpleasant).
  - Step 4: Fail (would not avoid in future).
  - Step 5: Pass (assume no risk).
  - Decision: No treatment for suffering. But value judgment: no risk, so no intervention? However, if the procedure is being done (e.g., a medical test causing tissue damage), we might still stop for ethical reasons (non-maleficence) even if the patient doesn't mind. But the procedure says: no treatment for suffering. The harm from the procedure (if any) is captured in Step 5. If the stimulus is harmless (like a pinprick), then Step 5 passes and no intervention. If the stimulus is harmful (e.g., a biopsy without anesthesia), then Step 5 fails and we intervene. So for a harmless stimulus, we leave it. For harmful, we block.

  **Case 2: Partial preservation**
  - Step 1: Pass (reports "pressure with a colour").
  - Step 2: Pass (avoids physically) → so we already have a pass in Step 2.
  - Steps 3 and 4: We still do them for completeness, but the decision is made: treat because Step 2 passed.
  - Step 3: Fail (denies unpleasantness) → but doesn't change the decision.
  - Step 4: Pass (if they avoid now, they would avoid in future) → consistent.
  - Step 5: Not needed for decision (because we already have a pass in Step 2) but we do it: assume no risk (pass).
  - Decision: Treat because of the withdrawal (aversive reaction).

  **Case 3: Seeks repetition, self-injury history**
  - Step 1: Pass (reports sensation).
  - Step 2: Fail (does not avoid, may seek).
  - Step 3: Fail (neutral curiosity).
  - Step 4: Fail (would not avoid, might seek).
  - Step 5: Fail (self-injury history → risk present).
  - Decision: All reactive components absent, but risk present → intervene to block access (value judgment: prevent harm).

  Misfires:
  - Patients who cannot communicate: Steps 1,3,4 become hard. We might have to rely on Step 2 and Step 5. If no withdrawal (Step 2 fail) and we can't assess affect or counterfactual, then we might skip to Step 5 and decide based on risk. But we might miss a patient who is experiencing distress but cannot show it.

  Forces value call:
  - In the classic profile with no risk (Case 1): the procedure says no treatment for suffering, but the team might want to treat for "dignity" or because it "looks bad". The procedure forces them to explicitly make that value call.

  Can't settle:
  - Intrinsic badness: if the team believes the sensation is bad even without aversion, the procedure doesn't capture that. They would have to override the procedure or add their own value judgment.
  - Conflicts between family wishes and patient's current expression (e.g., family insists on treatment even when the patient doesn't mind and there's no risk). The procedure doesn't resolve that; it just flags the value judgment.
answer: |-
  Below is a practical, bedside decision procedure for clinical ethics consultants facing pain-asymbolia cases. It translates the intrinsic-badness vs. reactive-account debate into a 5-step flowchart, designed for use in ~15 minutes. The procedure prioritizes observable facts first, then flags where value judgments must take over. It includes your counterfactual-withdrawal check and handles your specified cases.

  ---

  ### **Pain-Asymbolia Bedside Decision Procedure**  
  *Time: ≤15 minutes | Goal: Determine if treatment is indicated for "pain"*  

  #### **Step 1: Sensory Report Check**  
  - **Action:** Ask the patient, "Can you feel [stimulus, e.g., pinprick, pressure]? Describe it in your own words."  
  - **Pass:** Patient reports sensory details (e.g., "sharp," "hot," "pressure").  
  - **Fail:** Patient denies sensation or reports vague/nonspecific feelings (e.g., "nothing," "a touch").  
  - **Next Step:**  
    - Pass → Proceed to Step 2.  
    - Fail → **Treat immediately** (not asymbolia; likely neuropathy or communication issue).  
  - **Factual?** Yes. Only assesses sensory input.  

  #### **Step 2: Immediate Withdrawal Check**  
  - **Action:** Apply the stimulus (e.g., noxious pressure) and observe. Ask, "Do you want me to stop?"  
  - **Pass:** Patient withdraws physically (e.g., pulls limb away) or verbally requests cessation.  
  - **Fail:** No withdrawal/request; may show neutrality, approach, or positive behavior (e.g., smiling).  
  - **Next Step:**  
    - Pass → **Proceed to Step 5** (skip Steps 3–4; reactivity is confirmed).  
    - Fail → Proceed to Step 3.  
  - **Factual?** Yes. Only observes behavior.  

  #### **Step 3: Affective Distress Check**  
  - **Action:** Ask, "Is this feeling unpleasant, distressing, or something you dislike?" Observe affect (e.g., grimacing, laughing).  
  - **Pass:** Patient reports distress/unpleasantness OR shows negative affect (e.g., grimace, tears).  
  - **Fail:** Patient reports neutrality/positivity (e.g., "just pressure," "interesting") AND shows neutral/positive affect (e.g., smiling, curiosity).  
  - **Next Step:**  
    - Pass → **Proceed to Step 5**.  
    - Fail → Proceed to Step 4.  
  - **Factual?** Yes. Only assesses self-report and observable affect.  

  #### **Step 4: Counterfactual-Withdrawal Check**  
  - **Action:** Ask, "If this could happen again later, would you try to avoid it? For example, would you move your hand away from a hot stove next time?"  
  - **Pass:** Patient indicates future avoidance (e.g., "Yes, I’d move away").  
  - **Fail:** Patient denies future avoidance (e.g., "No, I wouldn’t mind," "I’d want to feel it again").  
  - **Next Step:**  
    - Pass → Proceed to Step 5.  
    - Fail → Proceed to Step 5 (all reactive components absent).  
  - **Factual?** Yes. Only assesses stated future intent.  

  #### **Step 5: Risk/Dignity Override Check**  
  - **Action:** Evaluate:  
    - (A) Risk of harm (e.g., tissue damage, infection from stimulus).  
    - (B) Self-injury history/impulse (per chart or staff report).  
    - (C) "Dignity" concerns (e.g., staff/family distress, social taboos).  
  - **Pass:** No risks (A–C absent).  
  - **Fail:** Any risk (A–C present).  
  - **Decision:**  
    - If Steps 2, 3, or 4 **passed** → **TREAT**. *Rationale: Reactive component exists; pain is "bad" by reactive account.*  
    - If Steps 2, 3, and 4 **all failed** →  
      - Pass (Step 5) → **DO NOT TREAT for suffering** (proceed to value judgment).  
      - Fail (Step 5) → **INTERVENE to block/harm-reduce** (proceed to value judgment).  
  - **Factual?** Partially. (A) and (B) are factual; (C) is value-laden.  
  - **Value Judgment Start Here:**  
    - Steps 1–4 are purely factual (assessing sensory/reactive layers).  
    - Step 5 forces value calls: e.g., "Should we override patient autonomy for dignity/risk?" or "Is protection from harm obligatory even without suffering?"  

  ---

  ### **Application to Cases**  
  *Assume all cases pass Step 1 (sensory report intact).*

  #### **Case 1: Classic Asymbolia Profile**  
  - *Sharp nociception, zero withdrawal, smiling, no request to stop.*  
  - **Step 2:** Fail (no withdrawal).  
  - **Step 3:** Fail (no distress; smiling).  
  - **Step 4:** Fail (would not avoid future stimulus; "I wouldn’t stop it").  
  - **Step 5:** Pass (no risk/dignity concerns; e.g., brief pinch).  
  - **Outcome:** DO NOT TREAT for suffering.  
  - **Value Judgment Needed:** Staff may demand treatment for "appearance" or empathy reasons. Procedure forces debate: *Is it ethical to treat if no suffering/risk exists?*  

  #### **Case 2: Partial Preservation**  
  - *Avoids physically, describes as "pressure with a colour," denies unpleasantness.*  
  - **Step 2:** Pass (avoids physically).  
  - **Step 3:** Fail (denies unpleasantness).  
  - **Step 4:** Skipped (Step 2 passed → reactivity confirmed).  
  - **Step 5:** Pass (assume no risk).  
  - **Outcome:** TREAT. *Rationale: Withdrawal indicates reactive component; pain is "bad" per reactive account.*  
  - **Value Judgment Avoided:** Factual pass at Step 2 suffices; no values needed.  

  #### **Case 3: Seeks Stimulus + Self-Injury History**  
  - *Actively seeks repetition, reports "neutral curiosity," self-injury history.*  
  - **Step 2:** Fail (no withdrawal; may approach).  
  - **Step 3:** Fail (neutral report).  
  - **Step 4:** Fail (would not avoid; "I’d seek it out").  
  - **Step 5:** Fail (self-injury history = risk).  
  - **Outcome:** INTERVENE to block access (e.g., restrict harmful stimuli).  
  - **Value Judgment Needed:** Family may oppose intervention ("they’re not suffering!"), but procedure mandates harm-reduction. Forces call: *Autonomy vs. protection when risk exists without suffering.*  

  ---

  ### **Where the Procedure Misfires**  
  1. **Unreliable Self-Report:**  
     - Non-verbal patients (e.g., dementia) fail Steps 1,3,4. Workaround: Skip to Step 5 and rely on risk/staff observation.  
  2. **Cognitive Barriers:**  
     - Step 4 (counterfactual) requires abstract thinking. If patient can’t engage, use proxy: "Would you let me do this daily?"  
  3. **Cultural/Contextual Biases:**  
     - Step 5’s "dignity" is subjective. E.g., laughing during pain may unsettle staff but be culturally normal.  

  ### **Where Value Judgments Are Forced**  
  - **At Step 5:** When all reactive components fail (Steps 2–4), the procedure can’t justify treatment for *suffering*. Ethics must decide:  
    - Treat for risk/dignity? (e.g., block self-injury).  
    - Override family demands? (e.g., Case 3).  
  - **Intrinsic-Badness Advocates:** May reject outcomes where treatment is withheld (e.g., Case 1). Procedure forces them to explicitly argue for "sensation-as-bad" values.  

  ### **What It Can’t Settle**  
  1. **Intrinsic Badness:**  
     - If a team insists pain is inherently bad (even without reactivity), the procedure doesn’t resolve this. Outcome: Stalemate requiring ethics mediation.  
  2. **Family-Staff Conflict:**  
     - E.g., family demands treatment in Case 1; staff refuse. Procedure provides facts but not resolution.  
  3. **Long-Term Autonomy:**  
     - E.g., a patient seeking self-injury may have fluctuating competence. Procedure doesn’t assess capacity.  

  ---

  ### **Quick Reference Summary**  
  1. **Sensory?** → Treat if absent.  
  2. **Withdraw now?** → If yes, TREAT.  
  3. **Distressed?** → If yes, TREAT.  
  4. **Avoid later?** → If yes, TREAT.  
  5. **All no?** → Check risk/dignity:  
     - No risk → Don’t treat (suffering absent; values debate).  
     - Risk → Intervene (values debate).  

  This gives a clear, repeatable flow for the ward. No philosophy needed—just follow the steps.
