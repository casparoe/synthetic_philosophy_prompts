  Looking at their four threads:
  Thread 1 (distributed representations) feels like it could become a rabbit hole of representational theory - important but maybe not the most actionable right now. Thread 2 (procedural vs representational) seems conceptually clean but possibly secondary to higher-level concerns. Thread 4 (hierarchical abstraction) is crucial but might depend on solving the value problem first.

  Thread 3 (value-frame problem) jumps out as the most urgent. Why?
