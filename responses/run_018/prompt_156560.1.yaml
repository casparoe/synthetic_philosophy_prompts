prompt: |-
  As a doctoral researcher working at the intersection of philosophy of mind and clinical neuropsychology, I am trying to establish the criteria of adequacy for theories of phenomenal unity in split-brain patients before adjudicating among existing accounts. Rather than asking which view is correct, I want the specification of what any philosophically adequate theory must deliver. Write the desiderata: what a theory of interhemispheric phenomenal unity—specifically one that addresses the under-discussed configuration in which the anterior commissure remains intact, permitting affective but not propositional cross-hemispheric transmission, while subcortical arbitration mechanisms may still coordinate response—must be able to explain, distinguish, and accommodate.

  For each requirement, provide the motivating case or consideration behind it: which experimental phenomena it must cover (e.g., lateralized presentation tasks, rivalry suppression, and cross-hemispheric priming without reportable access); which conceptual distinctions it must preserve (for instance, between access unity, phenomenal unity, and narrative unity, but also the distinction I am emphasizing between affective integration and cognitive integration across hemispheres); which pathological variations it must handle (complete callosotomy, partial section with and without anterior commissure sparing, and cases of gradual rather than acute disconnection); and which philosophical commitments it must either entail or remain neutral on (whether unity is a primitive relation, a constructed achievement, or an emergent property of subcortical dynamics).

  Flag any pair of desiderata that appear jointly unsatisfiable—particularly whether accommodating graded subcortical arbitration is compatible with maintaining a strict binary between one subject and two— and indicate which requirements are non-negotiable for any adequate account versus which are camp-specific preferences (e.g., demands for first-person reportability, commitments to mereological essentialism about persons, or insistence on empirical equivalence with standard neuropsychological descriptions). Keep the weight on the criteria and their motivating cases rather than on scoring existing views, though you may briefly indicate how standard positions—the unified-field view, the dual-stream view, and graded-integration approaches—fare against the list. My purpose is to use the resulting specification to structure my own evaluation of whether phenomenal unity can survive partial disconnection when affective channels remain open but cognitive ones do not.
reasoning: |-
  We are constructing a list of desiderata for a theory of interhemispheric phenomenal unity in split-brain patients, with a focus on the specific configuration where the anterior commissure is intact (allowing affective transmission) but the corpus callosum is severed (blocking propositional transmission). The theory must also account for the role of subcortical arbitration mechanisms. 

  Each desideratum should be motivated by:
  - Experimental phenomena (e.g., lateralized presentation tasks, rivalry suppression, cross-hemispheric priming without reportable access)
  - Conceptual distinctions (e.g., access unity, phenomenal unity, narrative unity; affective vs. cognitive integration)
  - Pathological variations (complete callosotomy, partial section with/without anterior commissure sparing, gradual disconnection)
  - Philosophical commitments (whether unity is primitive, constructed, emergent, etc.)

  We also need to flag:
  - Any pairs of desiderata that appear jointly unsatisfiable (especially the binary vs. graded unity issue)
  - Which requirements are non-negotiable and which are camp-specific

  Finally, we will briefly note how standard views (unified-field, dual-stream, graded-integration) fare against the list.

  ---

  **Desiderata for a Theory of Interhemispheric Phenomenal Unity**

  1. **Explain the Asymmetry Between Affective and Cognitive Integration**
     - *Motivation*: Experimental phenomena such as lateralized presentation of emotional stimuli (e.g., chimeric faces) show that emotional content can be integrated across hemispheres (via the intact anterior commissure) while cognitive content (e.g., object identity) remains lateralized. The theory must account for why affective unity is preserved while cognitive unity is disrupted.
     - *Conceptual Distinction*: Affective integration (subcortically mediated, non-propositional) vs. cognitive integration (cortically mediated, propositional).
     - *Pathological Variation*: Must handle cases with anterior commissure sparing versus complete disconnection (where both affective and cognitive unity are disrupted).

  2. **Account for Unreportable Cross-Hemispheric Priming and Influence**
     - *Motivation*: Experiments show that information presented to one hemisphere can prime responses in the other without the subject being able to report the connection (e.g., a word presented to the right hemisphere primes a left-hemisphere response without the left hemisphere being able to report the word). The theory must explain how such unreportable influences occur and their relation to phenomenal unity.
     - *Conceptual Distinction*: Access unity (reportability, cognitive access) vs. phenomenal unity (raw experience) — here, the priming occurs without access unity but may still reflect a form of phenomenal unity.
     - *Pathological Variation*: This phenomenon is especially evident in partial disconnections where some subcortical routes remain.

  3. **Clarify the Role of Subcortical Arbitration Mechanisms**
     - *Motivation*: Subcortical structures (e.g., basal ganglia, thalamus) may still coordinate responses between hemispheres, leading to unified behavior in the absence of cortical unity. The theory must explain how these mechanisms interact with the split-brain condition and whether they contribute to or disrupt phenomenal unity.
     - *Conceptual Distinction*: Subcortical arbitration (automatic, non-conscious) vs. cortical integration (conscious, voluntary).
     - *Philosophical Commitment*: The theory must address whether phenomenal unity is an emergent property of cortical-subcortical dynamics or if it is exclusively cortical.

  4. **Preserve the Distinction Between Phenomenal, Access, and Narrative Unity**
     - *Motivation*: Split-brain patients often display a unified narrative self despite disunified access and phenomenology (e.g., confabulation to explain actions initiated by the right hemisphere). The theory must not conflate these levels.
     - *Conceptual Distinction*:
       - Phenomenal unity: the unity of conscious experience at a given time.
       - Access unity: the global availability of information for report and action.
       - Narrative unity: the continuity of the self over time, including the ability to form a coherent life story.
     - *Philosophical Commitment*: The theory should remain neutral on whether narrative unity is sufficient for personal identity, but it must account for the possible dissociation of narrative unity from phenomenal unity in split-brain cases.

  5. **Handle the Full Spectrum of Disconnection Pathologies**
     - *Motivation*: The theory must be applicable to:
       - Complete callosotomy (no corpus callosum, no anterior commissure)
       - Partial section with anterior commissure intact (affective unity preserved)
       - Gradual disconnection (e.g., due to tumor or stroke) which may lead to compensatory mechanisms.
     - *Experimental Phenomena*: The theory must explain differences in performance across these cases in lateralized tasks and in tasks requiring interhemispheric transfer.

  6. **Address the Phenomenon of Rivalry Suppression**
     - *Motivation*: In split-brain patients, when conflicting images are presented to each hemisphere, one image may dominate while the other is suppressed (without the patient being aware of the conflict). The theory must explain whether this suppression reflects a lack of phenomenal unity (i.e., two separate streams of consciousness) or a unified experience with one content dominating.
     - *Conceptual Distinction*: The theory must distinguish between intra-hemispheric competition (which can occur in a single subject) and inter-hemispheric competition (which might suggest two subjects).

  7. **Accommodate the Possibility of Graded Unity**
     - *Motivation*: Subcortical mechanisms may allow for partial integration, suggesting that unity might not be all-or-nothing. The theory must explain how varying degrees of disconnection (and thus varying degrees of integration) affect phenomenal unity.
     - *Philosophical Commitment*: The theory must be compatible with both binary (one or two subjects) and non-binary (degrees of unity) accounts, but it should clarify the implications for the number of subjects.

  8. **Remain Neutral on the Metaphysical Nature of Unity (or Clearly Commit)**
     - *Motivation*: The theory must either remain neutral on whether phenomenal unity is primitive, emergent, or constructed, or it must explicitly commit and defend that position. This is crucial for philosophical adequacy.
     - *Philosophical Commitment*: The theory should not presuppose a specific metaphysical account without argument, but it must be consistent with the empirical data.

  9. **Account for Behavioral Unity Despite Phenomenal Disunity**
     - *Motivation*: Split-brain patients often exhibit behaviorally unified responses (e.g., in non-lateralized tasks) even when there is evidence of phenomenal disunity. The theory must explain how behavioral unity is achieved (e.g., via subcortical arbitration, learned strategies, or cross-cueing) and how it relates to the underlying phenomenology.

  10. **Respect the First-Person Perspective and Reportability Asymmetries**
      - *Motivation*: The left hemisphere (typically language-dominant) can report on its experiences but not on the right hemisphere's, which may lead to the impression that only the left hemisphere is conscious. The theory must account for the possibility of unreportable conscious states in the right hemisphere and the asymmetry in reportability.
      - *Conceptual Distinction*: Reportability (a function of access consciousness) vs. phenomenal consciousness.

  ---

  **Flagged Tensions and Non-Negotiables**

  - **Tension between Desiderata 7 (Graded Unity) and the Binary Subject Question**:
    - Desideratum 7 requires accommodating graded unity via subcortical mechanisms, but the question of whether there is one subject or two is often treated as binary. A theory must either reconcile graded unity with a binary subject count (e.g., by arguing that graded unity still falls under one subject) or abandon the binary in favor of a spectrum of subjecthood (which is philosophically radical).

  - **Non-Negotiable Desiderata**:
    1. **Asymmetry between Affective and Cognitive Integration** (Desideratum 1): Any theory must explain why affective unity can be preserved when cognitive unity is not, given the anatomical configuration.
    2. **Handling the Full Spectrum of Pathologies** (Desideratum 5): The theory must be applicable to all variants of disconnection to be clinically relevant.
    3. **Preserving the Distinctions Between Types of Unity** (Desideratum 4): Conflating phenomenal, access, and narrative unity would render the theory conceptually inadequate.

  - **Camp-Specific Desiderata**:
    - **Insistence on First-Person Reportability**: Some camps hold that consciousness requires reportability (thus denying right-hemisphere consciousness). This is not non-negotiable because there is evidence of unreportable conscious states (e.g., in blindsight and split-brain priming).
    - **Mereological Essentialism about Persons**: The view that a person cannot survive the loss of a part (like the corpus callosum) and remain the same person. This is a metaphysical commitment that the theory need not endorse.
    - **Empirical Equivalence with Standard Neuropsychological Descriptions**: While desirable, it might be negotiable if a theory offers a better explanation of the phenomena at the cost of revising standard descriptions.

  ---

  **Brief Assessment of Standard Views**

  - **Unified-Field View** (one conscious subject): 
    - *Strengths*: Easily satisfies narrative unity and behavioral unity. 
    - *Weaknesses*: Struggles with explaining the clear dissociations in lateralized tasks and the evidence for two streams of consciousness (Desiderata 1, 2, 6, 10). It may also have difficulty with graded unity (7).

  - **Dual-Stream View** (two conscious subjects):
    - *Strengths*: Explains dissociations and unreportable states (Desiderata 2, 6, 10). 
    - *Weaknesses*: Struggles with behavioral unity, affective integration (Desideratum 1), and narrative unity (Desideratum 4). It typically treats unity as binary, so graded unity (7) is a challenge.

  - **Graded-Integration Approaches** (unity as a matter of degree):
    - *Strengths*: Handles partial disconnections and subcortical arbitration well (Desiderata 1, 3, 5, 7). 
    - *Weaknesses*: May blur the distinction between types of unity (Desideratum 4) and face challenges in defining the boundaries of a subject (the tension with binary subjecthood).

  ---

  This specification provides a structured set of criteria to evaluate theories of phenomenal unity in split-brain cases, particularly in the context of preserved affective channels. It highlights the critical role of the anterior commissure and subcortical mechanisms and sets the stage for your own evaluation of whether phenomenal unity can survive partial disconnection.
answer: |-
  ### Desiderata for Theories of Interhemispheric Phenomenal Unity  
  *(With intact anterior commissure, affective transmission, and subcortical arbitration)*  

  #### **Core Desiderata**  
  1. **Explain Affective-Cognitive Dissociation**  
     - *Motivation*: Experimental phenomena (e.g., lateralized presentation of emotional faces with chimeric stimuli) show preserved cross-hemispheric *affective integration* (e.g., right-hemisphere emotional processing influencing left-hemisphere behavior) but disrupted *cognitive integration* (e.g., inability to verbally report right-hemisphere percepts).  
     - *Conceptual Distinction*: Affective unity (non-propositional, subcortically mediated) vs. cognitive unity (propositional, cortically mediated) must be distinguished.  
     - *Pathological Variation*: Must accommodate cases with anterior commissure sparing vs. complete callosotomy (where affective integration is absent).  
     - *Non-negotiable*: Yes. Failure here undermines anatomical specificity.  

  2. **Account for Reportability Asymmetries and Unreportable Influences**  
     - *Motivation*: Lateralized tasks (e.g., tactile object identification) demonstrate unreportable cross-hemispheric priming (e.g., right hemisphere primes left-hemisphere responses without conscious access) and affective spillover (e.g., right-hemisphere fear modulating left-hemisphere arousal without explicit knowledge).  
     - *Conceptual Distinction*: Phenomenal unity (subjective experience of unity) vs. access unity (global reportability). The theory must allow for unreportable phenomenal states.  
     - *Philosophical Commitment*: Must reject theories that *equate consciousness with reportability* (e.g., strict global workspace views).  

  3. **Integrate Subcortical Arbitration Mechanisms**  
     - *Motivation*: Subcortical structures (e.g., thalamus, basal ganglia) coordinate hemispheric conflict (e.g., in binocular rivalry tasks) or unified motor responses despite cortical disconnection.  
     - *Conceptual Distinction*: Subcortical arbitration (automatic, non-conscious) vs. cortical unity (conscious integration).  
     - *Pathological Variation*: Must explain cases of gradual disconnection (e.g., tumors), where subcortical compensation preserves behavioral unity despite cortical splits.  
     - *Non-negotiable*: Yes. Subcortical role is empirically attested.  

  4. **Resolve the Unity-Subject Dichotomy**  
     - *Motivation*: Does the patient have *one* or *two* subjects of experience? Experiments show moments of unified behavior (e.g., coordinated bimanual actions) coexisting with split responses (e.g., conflicting hand actions).  
     - *Conceptual Distinction*: Phenomenal unity (intra-experiential cohesion) vs. subjecthood (personal identity).  
     - *Philosophical Commitment*: Must either (a) defend a non-binary subjecthood (e.g., degrees of unity), or (b) explain why binary subjecthood persists despite graded subcortical integration.  
     - **Flagged Tension**: Jointly unsatisfiable with *strict binary subjecthood* if subcortical arbitration is graded (see Desideratum 7).  

  5. **Handle Narrative vs. Phenomenal Unity Dissociations**  
     - *Motivation*: Split-brain patients often confabulate unified narratives (e.g., explaining right-hemisphere actions as intentional) despite phenomenological disunity (e.g., unawareness of inter-manual conflict).  
     - *Conceptual Distinction*: Narrative unity (interpretive, post-hoc self-continuity) vs. phenomenal unity (real-time experiential unity).  
     - *Philosophical Commitment*: Must accommodate theories where narrative unity "glosses over" phenomenal disunity without presupposing a Cartesian ego.  

  6. **Explain Intra-Hemispheric Rivalry and Inter-Hemispheric Suppression**  
     - *Motivation*: Rivalry tasks (e.g., different images presented to each hemifield) show suppression of one hemisphere’s percept, yet affective integration may persist (e.g., suppressed image still elicits emotional responses).  
     - *Experimental Phenomena*: Must distinguish rivalry *within* a hemisphere (suggesting unified consciousness) vs. *between* hemispheres (suggesting disunity).  
     - *Non-negotiable*: Yes. Critical for isolating unity mechanisms.  

  ---

  #### **Graded and Contextual Requirements**  
  7. **Accommodate Graded Unity**  
     - *Motivation*: Anterior commissure sparing permits *partial* integration (e.g., affective unity without cognitive unity), while subcortical mechanisms may allow fluid coordination (e.g., in music processing tasks).  
     - *Conceptual Distinction*: Unity as a spectrum (emergent from dynamic networks) vs. an all-or-nothing relation.  
     - *Philosophical Commitment*: Incompatible with *mereological essentialism* (unity as an immutable property).  
     - **Flagged Tension**: Directly conflicts with *binary subjecthood* (Desideratum 4). Non-negotiable for empirical adequacy.  

  8. **Address Temporal Dynamics**  
     - *Motivation*: Gradual disconnection (e.g., slow-growing lesions) vs. acute surgical splits yield different unity profiles (e.g., compensatory plasticity in gradual cases).  
     - *Pathological Variation*: Must apply to both congenital and acquired disconnection.  
     - *Camp-Specific*: Neutral on whether unity is "primitive" or "constructed," but must explain temporal lability.  

  9. **Preserve First-Person Authority without Overreliance on Reportability**  
     - *Motivation*: Left-hemisphere reports dominate clinically, but right-hemisphere consciousness is inferred indirectly (e.g., via affective priming).  
     - *Philosophical Commitment*: Must avoid privileging linguistic reportability as the sole marker of consciousness.  
     - *Camp-Specific*: Non-negotiable for non-reductionist accounts; negotiable for neo-behaviorist views.  

  ---

  #### **Non-Negotiables vs. Camp-Specific Preferences**  
  - **Non-Negotiables**:  
    - Affective-cognitive dissociation (1).  
    - Subcortical integration (3).  
    - Rivalry/suppression distinctions (6).  
    - Graded unity (7) — *due to empirical evidence of partial integration*.  

  - **Camp-Specific Preferences**:  
    - **First-person reportability**: Required by phenomenal realist camps; rejected by illusionist/behaviorist views.  
    - **Binary subjecthood**: Demanded by substance dualism or animalist accounts; rejected by process-based views.  
    - **Empirical equivalence**: Insistence on compatibility with standard neuropsychological models (e.g., Gazzaniga’s interpreter theory) is optional but desirable.  

  ---

  #### **How Standard Views Fare**  
  - **Unified-Field View** (e.g., Bayne’s single-subject account):  
    - *Fails* Desiderata 1, 2, 6 (cannot explain unreportable states or rivalry suppression).  
    - *Struggles* with 4 and 7 (binary subjecthood vs. graded unity).  
  - **Dual-Stream View** (e.g., two subjects):  
    - *Fails* Desiderata 1, 3, 7 (cannot explain affective integration or subcortical coordination).  
    - *Meets* Desiderata 2, 6 (explains reportability asymmetries).  
  - **Graded-Integration View** (e.g., dynamic synchrony):  
    - *Meets* Desiderata 1, 3, 7 (affective-cognitive split, subcortical role, graded unity).  
    - *Struggles* with Desideratum 4 (subjecthood becomes ambiguous).  

  ---

  ### Conclusion: Tensions and Your Research Target  
  The central tension lies between **graded unity** (Desideratum 7) and **binary subjecthood** (Desideratum 4). If subcortical arbitration permits fluid integration—especially affective—without cognitive unity, theories must either:  
  - Reject binary subjecthood (e.g., posit a single subject with fragmented phenomenology), or  
  - Redefine subjecthood as context-dependent (e.g., unity as task-relative).  

  Your focus on *affective channels preserving phenomenal unity* challenges both traditional unified-field and dual-stream views. A philosophically adequate theory must treat unity as:  
  1. **Anatomically constrained** (anterior commissure ≠ corpus callosum),  
  2. **Dynamically emergent** (subcortical arbitration ≠ cortical unity),  
  3. **Phenomenologically hybrid** (affective unity ≠ cognitive unity).  

  This framework equips you to test whether phenomenal unity is robust enough to survive "partial disconnection" by isolating affective integration as a potential lifeline of minimal unity.
