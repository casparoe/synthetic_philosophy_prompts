prompt: |-
  You are a senior epistemologist with experience in analytic philosophy and interdisciplinary seminar dynamics. I need a rigorous Q&A prep sheet for my job talk defending a specific hybrid position on epistemic justification.

  Thesis: Basic perceptual beliefs are immediately justified by non-doxastic experiential states—without invoking a "given"—but their epistemic authority depends on a second-order coherence check: my belief that my perceptual faculties are reliable must cohere with my broader beliefs about causal interaction and cognitive architecture. I reject pure foundationalism because it cannot block arbitrariness, pure coherentism because it collapses into circularity, and infinitism because it is psychologically and practically impossible. Instead, I allow a limited pragmatic recursion that stops at functional self-trust rather than infinite ascent.

  Audience: Eight analytic epistemologists (mostly reliabilists or evidentialists), one committed coherentist, one philosopher of science sympathetic to infinitism about scientific reasoning, and a formal logician concerned with circular self-reference. They have read only my two-page abstract.

  Deliverable: A prep sheet. First, confirm my thesis in one precise paragraph. Then list the eight objections I will actually face, ordered from most damaging to least damaging. For each objection provide: (a) the exact phrasing an audience member of that type would use, including their favored technical vocabulary; (b) a concise reply I can deliver in about two minutes that holds my line; (c) an explicit note on where that reply is weakest or must concede ground; and (d) the specific kind of audience member most likely to raise it. Be sure to include the one "hidden killer" objection I am hoping nobody asks, with an honest reply that does not hide the damage. End with a short strategic paragraph advising me when to concede coherence-related points and when to stand absolutely firm on the pragmatic stopping rule.

  Please think carefully and systematically. Before listing the objections, take a moment to brainstorm the four core tension points: (1) reliabilist demands for non-circular process justification, (2) coherentist charges of hidden circularity in the second-order check, (3) infinitist demands that justification requires non-terminating chains, and (4) formal logicians' concerns about recursive self-reference. Use this analysis to structure your ordering and to ensure each reply addresses the specific technical pressure point rather than offering a generic defense.
