  ### Diagnostic Taxonomy: Special Composition Question  
  *Phrased for concrete case judgments without presupposing technical labels. Branching proceeds through four diagnostic questions.*

  ---

  **Root: Is there a fact of the matter whether arbitrarily scattered parts (e.g., a pebble on Earth and one on Alpha Centauri) ever compose a single object?**  
  - **No**  
    - → **Unnamed: Non-factualism about composition**  
      *Most awkward commitment: Must deny determinate truth-values for composition claims in borderline cases, rendering existence questions fundamentally indeterminate.*  
  - **Yes**  
    - **Next: Do arbitrarily scattered parts ever compose a single object?**  
      - **Yes**  
        - **Branch 1: Can an object (e.g., a ship) survive the complete, gradual replacement of all its parts over time?**  
          - **Yes**  
            - **Branch 2: Is a hollow sphere (or Swiss cheese) one object with missing parts, or only smaller objects arranged with empty space?**  
              - **One object with missing parts**  
                - **Branch 3: Can the same composite exist on Tuesday, fail to exist Wednesday (when parts are scattered), and exist again Thursday?**  
                  - **Yes**  
                    - → **Unrestricted universalism**  
                      *Most awkward commitment: Must accept that any disjoint items (e.g., your left ear and the Eiffel Tower) compose a new object.*  
                  - **No**  
                    - → **Unnamed: Universalism without intermittent existence**  
                      *Most awkward commitment: Must deny object persistence through temporary scattering despite unrestricted composition, forcing spontaneous generation/annihilation.*  
              - **Only smaller objects arranged with empty space**  
                - *[Incoherent for universalism: Affirming composition requires treating composites as single objects.]*  
          - **No**  
            - **Branch 2: Is a hollow sphere one object?**  
              - **One object**  
                - **Branch 3: Can the same composite exist intermittently?**  
                  - **No**  
                    - → **Universalism with composition-as-identity**  
                      *Most awkward commitment: Must hold that the whole is literally identical to its parts, violating transitivity of identity when parts overlap.*  
                  - **Yes**  
                    - *[Unoccupied: Coherent but rarely defended; implies objects can "die" and "resurrect" yet resist part-replacement persistence.]*  
              - **Only smaller objects arranged**  
                - *[Incoherent for universalism: Incompatible with commitment to universal composition.]*  
      - **No**  
        - **Next: Do any parts ever compose a single object?**  
          - **Yes**  
            - **Branch 1: Can an object (e.g., a living organism) survive gradual part replacement?**  
              - *[All restrictionists answer **Yes**; no split needed.]*  
            - **Branch 2: Is a hollow sphere one object (if meeting the relevant condition)?**  
              - *[All restrictionists answer **One object**; no split needed.]*  
            - **Branch 3: Can the same composite exist intermittently?**  
              - *[All restrictionists answer **No**; no split needed.]*  
            - **Branch 4: If composition is restricted, is the decisive factor...?**  
              - **Spatial contiguity/contact**  
                - → **Contact-based restrictionism**  
                  *Most awkward commitment: Must accept that two objects touching compose a new entity, but if separated by a hair’s width, they do not, creating sharp boundaries.*  
              - **Life or organic function**  
                - → **Life-based (organicist) restrictionism**  
                  *Most awkward commitment: Must deny that non-living complex structures (e.g., glaciers or AI) are composite objects.*  
              - **Causal-functional integration**  
                - → **Causal-integration restrictionism**  
                  *Most awkward commitment: Must explain why causal integration (e.g., a watch) is not vague, to avoid ubiquitous ontological indeterminacy.*  
              - **Something else (e.g., intention, arbitrary conventions)**  
                - → **Unnamed restrictionism**  
                  *Most awkward commitment: Must justify a non-standard restriction factor without lapsing into arbitrariness or anthropocentrism.*  
          - **No**  
            - **Branch 1: Can an object survive gradual part replacement?**  
              - *[All nihilists answer **No**; no split needed.]*  
            - **Branch 2: Is a hollow sphere one object or only smaller objects arranged?**  
              - *[All nihilists answer **Only smaller objects arranged**; no split needed.]*  
            - **Branch 3: Can the same composite exist intermittently?**  
              - *[All nihilists answer **No**; no split needed.]*  
            - **Final: In gradual part replacement, is there a persisting *arrangement* of parts?**  
              - **Yes**  
                - → **Arrangement-only nihilism**  
                  *Most awkward commitment: Must accept arrangements as real persistents despite denying composite objects, inviting questions about their ontological status.*  
              - **No**  
                - → **Eliminative nihilism**  
                  *Most awkward commitment: Must reduce all ordinary object references (e.g., "chairs") to mereological simples, demanding radical revision of language and thought.*  

  ---

  ### Notes on Gaps and Indistinguishability  
  1. **Indistinguishable leaves**:  
     - *Arrangement-only nihilism* and *eliminative nihilism* **cannot be separated** by Branches 1, 2, or 3 alone, as both deny composites and identically answer these cases. The final question (persisting arrangements) is necessary.  

  2. **Unoccupied combinations**:  
     - **Universalism without part-replacement persistence but with intermittent existence** (after "No" to Branch 1 and "Yes" to Branch 3):  
       - *Coherent but unexplored*: Logically possible but philosophically unmotivated; no prominent defenses.  
     - **Universalism denying the hollow sphere is one object** (Branch 2: "Only smaller objects"):  
       - *Incoherent*: Universalism requires accepting composites unconditionally, including the hollow sphere.  
     - **Restrictionism with intermittent existence** (Branch 3: "Yes" under restrictionism):  
       - *Unattractive*: Conflicts with the core restrictionist intuition that scattering destroys an object permanently.  

  --- 
  This taxonomy isolates commitments via concrete judgments, exposing tensions (e.g., universalism’s "trivial objects" or nihilism’s "arrangement puzzles") while flagging limitations in distinguishing nihilist variants or motivating fringe positions.
