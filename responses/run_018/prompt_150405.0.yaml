answer: |-
  Your observation identifies a crucial historiographical operation that lacks a standard label. The process you describe—**retrospective conceptual homogenization**—merits precise definition as a distinct phenomenon. Below is a formal conceptualization, designed for analytical clarity in your seminar:

  ### **Proposed Term: Retrospective Conceptual Homogenization (RCH)**  
  *The post hoc unification of historically distinct, conceptually heterogeneous scientific contributions into a singular, reified "discovery" or "theory," erasing epistemic differences to frame priority disputes as contests over identical intellectual objects.*

  ---

  ### **Key Features Distinguishing RCH from Related Concepts**
  1. **Contrast with Mere Convergence/Simultaneous Discovery**  
     - *Convergence*: Independent arrival at substantively similar ideas (e.g., multiple groups isolating a chemical element using identical methods).  
     - *RCH*: Imposes unity on *dissimilar* frameworks (e.g., Newton’s geometric fluxions ≠ Leibniz’s symbolic calculus).  

  2. **Contrast with Independent Invention of Identical Formalisms**  
     - *Identical formalisms*: Same mathematical notation/algorithms (e.g., independent derivation of a formula).  
     - *RCH*: Overlooks divergent ontologies, problem domains, or epistemic goals (e.g., Darwin’s deep-time/analogy-rich theory vs. Wallace’s biogeographic mechanism).  

  3. **Contrast with Whig History**  
     - *Whig history*: Teleological narratives judging past through present values.  
     - *RCH*: Specifically flattens *co-existing alternatives* into one entity to simplify priority debates, often masking incommensurabilities.  

  4. **Contrast with "Consensus Formation"**  
     - Consensus emerges from debate; RCH *preemptively erases differences* to create an artificial singularity.  

  ---

  ### **Mechanisms of RCH: How It Operates**
  1. **Reification of Outcomes**  
     - Later scientific consensus (e.g., "calculus" as a unified discipline) is projected backward, treating historical variants as imperfect versions of the same thing.  

  2. **Epistemic Reductionism**  
     - Heterogeneous contributions are reduced to a "core idea" (e.g., "natural selection" stripped of Darwin’s Malthusian/geological scaffolding or Wallace’s biogeographic emphasis).  

  3. **Narrative Convenience**  
     - Simplifies pedagogy and priority disputes (e.g., framing Lavoisier/Priestley as "discovering oxygen," ignoring Lavoisier’s quantitative revolution vs. Priestley’s phlogiston context).  

  4. **Sociological Reinforcement**  
     - Scientific communities amplify homogenization to assert disciplinary coherence or allocate credit efficiently.  

  ---

  ### **Case Studies: Applying the RCH Lens**
  | **Pair**          | **Divergences Homogenized by RCH**                                                                 | **RCH Justified?** |  
  |-------------------|-----------------------------------------------------------------------------------------------------|---------------------|  
  | **Newton/Leibniz** | Newton: Physical/kinematic (fluxions); Leibniz: Symbolic/combinatorial (differentials)              | **No**—Ontological and operational differences obscured. |  
  | **Darwin/Wallace** | Darwin: Malthusian economics, artificial selection, gradualism; Wallace: Biogeographic mechanism sans analogies | **Partially**—Core mechanism shared, but scaffolding erased. |  
  | **Lavoisier/Priestley** | Lavoisier: Quantitative chemistry, oxygen theory; Priestley: "Dephlogisticated air" within phlogiston framework | **No**—Different paradigms conflated. |  
  | **Boltzmann/Gibbs** | Boltzmann: Kinetic theory, statistical mechanics for gases; Gibbs: Thermodynamic ensembles, general formalism | **Partially**—Formal synthesis later emerged, but original aims differed. |  

  ---

  ### **Why RCH Matters in Sociology of Science**
  - **Credit Allocation**: RCH transforms debates over *conceptual ownership* into disputes about *temporal priority*.  
  - **Epistemic Injustice**: Marginalizes contributions embedded in less dominant frameworks (e.g., Wallace’s biogeography).  
  - **Disciplinary Formation**: Reveals how scientific fields construct "foundational" narratives by suppressing heterogeneity.  
  - **Innovation Dynamics**: Shows that "simultaneity" often masks parallel explorations of adjacent—not identical—intellectual spaces.  

  ---

  ### **Seminar Application: Testing the Concept**
  - **Exercise**: Assign primary texts (e.g., Darwin’s *Origin* vs. Wallace’s 1858 essay) and challenge students to identify homogenization in textbook accounts.  
  - **Discussion**: When does RCH serve pedagogical utility vs. historical distortion?  
  - **Extension**: Apply to modern cases (e.g., CRISPR patent disputes: Charpentier/Doudna’s mechanistic work vs. others' applied innovations).  

  This framework enables critical analysis of how scientific memory is constructed—moving beyond "who got there first" to "what was actually built, and why we remember it as one thing." If you pursue this as a formal concept, cite precursors like Kuhn (incommensurability) or Steven Shapin (credit negotiations), but position RCH as a distinct tool for dissecting simultaneity narratives.
