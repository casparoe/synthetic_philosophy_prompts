  ### Two-Envelope Paradox Workshop Design

  **Core Idea**: Students physically engage with envelopes containing cash, using tactile clues (thickness/weight) to inform decisions. After an initial switch choice, the unconditional switching argument (expectation of the other envelope = 5/4 of observed amount) is revealed and applied iteratively, creating tension between the argument and physical/tangible constraints.

  ---

  #### **Materials & Setup**
  1. **Envelopes**:
     - 28 identical opaque envelopes (e.g., standard letter size).
     - **Cash distribution**: 
       - $2: 14 envelopes (each with two $1 bills).
       - $4: 7 envelopes (each with four $1 bills).
       - $8: 4 envelopes (each with eight $1 bills).
       - $16: 2 envelopes (each with sixteen $1 bills).
       - $32: 1 envelope (with thirty-two $1 bills).  
       *Total cost: $152*.  
     - **Noise engineering** (physical correlates):
       - Add 0–3 blank paper sheets (cut to bill size) to each envelope to vary thickness/weight.  
       - *Example*: A $4 envelope (4 bills) might have 4 bills + 2 blanks = 6 sheets; a $2 envelope might have 2 bills + 3 blanks = 5 sheets.  
       - Seal all envelopes.  
     - **Prior disclosure**:  
       > "The pool has 28 envelopes. The amounts follow a geometric distribution:  
       > - $2: ≈50% (14 envelopes)  
       > - $4: ≈25% (7 envelopes)  
       > - $8: ≈13% (4 envelopes)  
       > - $16: ≈6% (2 envelopes)  
       > - $32: ≈3% (1 envelope).  
       > Each envelope also contains 0–3 blank sheets, so thickness/weight correlate noisily with the amount."

  2. **Budget Safeguard**:  
     - Total exposure capped at $152 (pre-funded).  
     - Students keep their final envelope’s cash, ensuring stakes feel real (average ~$5.43/student).

  3. **Other**:  
     - A large box for the envelope pool.  
     - Timer.  
     - Whiteboard for debrief notes.  

  ---

  #### **Rules & Procedure**  
  *(75 minutes total)*  

  1. **Introduction (5 min)**  
     - Explain: "You’ll draw envelopes containing cash. You may inspect physical properties before deciding to keep or switch. Payoffs are real."  
     - Disclose the prior distribution (as above) and noise engineering.  
     - Emphasize: "Decisions are final; no opening envelopes until the end."  

  2. **Round 1: Physical Inspection and Initial Switch (25 min)**  
     - **Step 1**: Each student draws one envelope from the box.  
     - **Step 2**: Students inspect their envelope’s thickness/weight (30 sec each). Encourage tactile comparison.  
     - **Step 3**: Each student chooses:  
       - **KEEP**: Walk away with their envelope.  
       - **SWITCH**: Return their envelope to the box, then draw a new one (unseen) from the remaining pool.  
     - *Logistics*:  
       - Students approach the box one by one.  
       - Record choices (keep/switch) privately.  
       - After choice, students sit with their envelope but do not open it.  

  3. **Round 2: The Switching Argument and Iteration (20 min)**  
     - **Step 1**: Reveal the unconditional switching argument:  
       > "Suppose your envelope has amount \(X\). In the standard paradox, the other envelope is equally likely to hold \(2X\) or \(X/2\). The expected value of switching is \(\frac{1}{2} \cdot 2X + \frac{1}{2} \cdot \frac{X}{2} = \frac{5}{4}X\). So you *should* switch—it gains 25% on average."  
     - **Step 2**: Instruct students:  
       - "Take your *current* envelope (whether kept or switched) as the new \(X\)."  
       - "Apply the argument again: Does \(\frac{5}{4}X\) compel you to switch *once more*?"  
     - **Step 3**: Poll and discuss:  
       - "Raise your hand if the argument says you should switch again." (Expect near-unanimous hands.)  
       - "If you switched again, would the argument compel a *third* switch?" (Poll again.)  
     - **Key constraint**: Envelopes are sealed and tangible. No physical second switch occurs—this is a thought experiment confronting infinite regress.  

  4. **Debrief (25 min)**  
     - **Part 1: Reveal outcomes** (5 min):  
       - Students open envelopes and share amounts.  
       - Compare payoffs: Who switched? Who benefited?  
     - **Part 2: Map the paradox** (15 min):  
       | **Physical Moment**       | **Formal Structure**                          |  
       |---------------------------|-----------------------------------------------|  
       | Drawing first envelope    | Sampling from prior distribution              |  
       | Inspecting thickness      | Gathering conditional evidence (noisy signal)|  
       | Keep/switch decision      | Maximizing expected utility                   |  
       | Argument for switching    | \(\frac{5}{4}X\) expectation                 |  
       | Argument for re-switching | Iteration/regress of conditional expectation |  
       - Highlight contradictions:  
         - Argument says "always switch," but physical limits (max $32) break the regress.  
         - Prior is bounded and known, yet the argument assumes unbounded doubling/halving.  
     - **Part 3: Honest limitation** (5 min):  
       > "This staging fails to reproduce the paradox’s infinite regress. In reality:  
       > - The prior is bounded (no envelopes beyond $32), so \(2X\) is impossible at the max.  
       > - True infinite regress requires an *unbounded prior*—something no physical setup can emulate."  

  ---

  #### **Predictable Challenges**  
  1. **Round 1**:  
     - Students refuse to switch after feeling a thick/heavy envelope (e.g., 20+ sheets suggest $16/$32).  
     - *Why*: Rational use of physical evidence overrides the abstract prior.  

  2. **Round 2**:  
     - Students reject the argument immediately if holding $32 ("I know there’s no $64 envelope").  
     - Group converges on "the argument is flawed" but cannot pinpoint why (e.g., misses that the doubling/halving assumption conflicts with the prior).  

  3. **Debrief**:  
     - Students focus on "winning/losing" from Round 1, missing the paradox’s structural tension.  
     - Physical evidence (thickness) overshadows the prior in discussion, downplaying the distribution’s role.  

  ---

  #### **Why This Works**  
  - **Tangible stakes**: Cash rewards make the paradox visceral, not abstract.  
  - **Physical clues**: Noise engineering mirrors real-world imperfect information.  
  - **Iteration twist**: Applying the argument to a *switched* envelope reveals its destabilizing force.  
  - **Debrief anchors**: Concrete experiences (drawing, weighing, switching) are mapped to formal elements, grounding the paradox in lived tension.  

  **Outcome**: Students experience the paradox as a decision-making pressure, not a resolved puzzle—highlighting how bounded reality clashes with unbounded reasoning.
