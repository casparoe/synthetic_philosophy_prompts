              Step 2: "Now, if you had switched and now hold a new envelope, would you switch again? Raise your hand."

          We expect many to raise their hands in step 1 (because of the 5/4 argument). Then in step 2, again many? But then we point out that this leads to an infinite regress.

     - Debrief (25 min):

          We open the envelopes and record the amounts for each student.

          We then discuss:

            1. What was the actual outcome? How did the students who switched fare versus those who kept?
            2. The prior: we show the initial distribution and the expected value.
            3. The switching argument: we present it again and then show why it doesn't apply in our setting? Because our envelopes are not paired as (X,2X) but drawn independently from a fixed prior. In the independent prior setting, switching does not change the expected value: E[new envelope] = E[prior] = 160/31 ≈ 5.16, and this is the same as the expected value of the current envelope? But wait, if you are holding an envelope worth X, then the expected value of a new envelope is 5.16, which may be more or less than X. The argument that it is exactly 5/4 X is false.

            4. We note that the standard paradox assumes a pair (X,2X) and that you are equally likely to have picked either. But in our setting, we have a fixed prior and no pairing.

            5. We also note the deviations in our setup:
                  - Without-replacement drawing: the prior changed as the game progressed.
                  - The physical properties provided some information, so the students might have had a better estimate than the prior.

            6. The infinite regress: the argument compels you to switch repeatedly, but that is impossible in practice and leads to a contradiction. The flaw is in the assumption that the other envelope is equally likely to be half or double your current amount. In fact, that assumption is inconsistent with any well-defined prior distribution on the positive reals? (Or at least with a uniform prior on the log scale.)

            7. We honestly note what we failed to reproduce: 
                  - We had a bounded prior (with maximum $32) so the infinite regress breaks at the top: if you have $32, you know it's the maximum so the other envelope can't be $64. In the standard paradox with unbounded prior, the regress is infinite.
                  - We had a fixed prior and independent draws, not pairs.

     - Total: 5+25+20+25 = 75 min.

  6. **What will go wrong**:

     - Participants refusing to switch after handling a heavy envelope: 
          A student draws an envelope that feels thick (say 20 sheets) and infers it must be $16 or $32, so they keep it. This is rational given their information. The unconditional switching argument in round 2 might then be unconvincing to them because they have conditioning information.

     - In round 2, when we present the switching argument, some students might immediately point out that the prior is fixed and so the expected value of a new envelope is constant (5.16) and therefore if they have an envelope above 5.16 they shouldn't switch? But we are presenting the standard argument that the other envelope is either half or double, which doesn't hold.

     - The group might converge on the idea that the argument is flawed because of the physical evidence, without articulating the prior inconsistency.

     - Some students might be confused by the without-replacement drawing: they might think that the pool is changing and that affects the decision.

     - In round 2, when we ask if they would switch (given a new draw from the prior), students who have a high amount (say $32) would not want to switch? So they reject the argument. But the argument says that no matter what you have, you should switch? So we have to ask: even if you have $32, the argument says the other envelope is either $64 or $16, and the expected value is (64+16)/2 = 40>32, so you should switch. But in our prior, there is no $64. So the argument breaks at the boundaries.

     - We must be prepared to discuss these points.

  Given the complexity, we finalize the design as described.
