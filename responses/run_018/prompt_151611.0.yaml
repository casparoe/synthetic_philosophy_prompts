  First, I need to recall established concepts. Bootstrapping involves using a source to justify its own reliability, which is similar but not exactly the same. The user's case adds a pragmatic twist where denying the basic claim leads to self-defeat. Then there's Moorean shift, which flips skepticism but doesn't involve deriving reliability. Pragmatic encroachment ties knowledge to practical stakes, but here it's about the same belief shifting roles. Transcendental arguments claim something is a necessary condition, but they don't usually bootstrap reliability. So the unique part is the dual role—evidential and defensive—with a status shift.

  Next, distinguishing boundary cases. Foundationalism treats basic beliefs as justified without inference, but here the belief is used inferentially and defensively. Circular reasoning is explicit loops, but this is linear with a defensive fallback. Non-instances include when beliefs are independently justified or when pragmatic defenses don't shift evidential status.

  Relating to bootstrapping, this pattern uses easy knowledge (basic claims) to bootstrap reliability, then leverages that for stronger conclusions. But the defensive move blocks challenges by making denial costly, turning easy knowledge into a pragmatic shield. This exposes how bootstrapping can hide behind self-defeat arguments.

  Since no term fits perfectly, proposing "evidential anchoring." The anchor serves as both foundation and trapdoor. Definition would emphasize the dual role and status shift. Need to ensure it's precise, distinguishing from similar concepts. Also, the user might want to apply this in their research, so clarity is key. They might be preparing a paper or thesis, hence needing a structured analysis. Their deeper need is to categorize this pattern to critique arguments effectively, especially in skepticism or rationalist debates.
answer: |-
  Here’s an analysis of the argumentative pattern you describe, structured as requested:

  **1. Phenomenon Identification and Nearest Established Concepts**  
  The pattern involves a **single proposition** (e.g., "I see my hands," "I know my mental state") serving two distinct functions:  
  - **Evidential Role**: It is treated as an *unproblematic starting point* to infer cognitive reliability (e.g., "Since I correctly perceive my hands, perception is reliable").  
  - **Pragmatic-Shield Role**: When the derived conclusion (e.g., scientific realism, introspective calibration) is challenged, the same proposition is framed as *pragmatically inviolable*—rejecting it allegedly makes skepticism self-defeating or collapses epistemic rationality.  

  **Closest concepts with distinctions**:  
  - **Bootstrapping**: Fits the initial inference (using perceptions to justify perception’s reliability) but lacks the *pragmatic pivot* when challenged. Bootstrapping is criticized for *evidential circularity*; your case adds a *defensive maneuver* reframing the premise as practically indispensable.  
  - **Moorean Shift**: Resembles the defensive move (denying common sense undermines skepticism) but typically doesn’t *leverage the premise to bootstrap reliability* for further inferences. Your case embeds Mooreanism *within* a bootstrapping structure.  
  - **Pragmatic Encroachment**: Explains how stakes affect justification, but here the *same belief* shifts status *without changing practical context*—its "cost" arises only dialectically when the derived conclusion is attacked.  
  - **Transcendental Arguments**: Claim "X must be true for Y to be possible," but your pattern is empirically bootstrapped (e.g., "I see hands → perception works") and weaponizes pragmatic consequences reactively.  

  **Key distinction**: The **status duality**—the premise is treated as *epistemically lightweight* (requiring no defense) during inference but *pragmatically heavyweight* (too costly to deny) during challenges—without independent justification for either role.  

  **2. Boundary Cases and Non-Instances**  
  **In-scope cases**: Must exhibit all three features:  
  - (a) Bootstrapped reliability (A → "My faculty for A-type beliefs is reliable")  
  - (b) A leveraged to support contentious conclusion C  
  - (c) Defense against challenges to C invokes *pragmatic catastrophe* of denying A, *not* independent evidence for A or the inference.  

  **Out-of-scope cases**:  
  - **Genuine Foundationalism**: If A is non-inferentially justified (e.g., Descartes’ cogito), it doesn’t *bootstrap*.  
  - **Plain Circularity**: If one argues "A because A" without pragmatic escalation, it lacks the defensive pivot.  
  - **Independent Support**: If A is later defended with new evidence (e.g., neuroscience confirming perception), it avoids duality.  
  - **Pure Pragmatic Arguments**: If a belief is justified *solely* by denial-costs (e.g., "Believing free will exists is morally necessary"), without bootstrapping C from A.  

  **3. Relation to Bootstrapping and Easy Knowledge**  
  This pattern weaponizes "easy knowledge" against its critics. Bootstrapping (e.g., Vogel’s car case) derives reliability from uncontested outputs, creating "easy" justification for broad faculties. Your cases extend this:  
  - The "easy" premise (e.g., "I see hands") not only *generates* reliability cheaply but *immunizes* contentious conclusions (e.g., external world realism) by threatening *pragmatic costs* if challenged.  
  - This exploits the *asymmetry* in "easy knowledge": Treating A as *epistemically undemanding* lets it bootstrap C, but framing A as *pragmatically indispensable* blocks retreat—forcing critics to either accept C or embrace self-defeat. Thus, "easiness" is contextually fluid: low-cost to *assert*, high-cost to *deny*. Unlike standard bootstrapping objections (which target evidential emptiness), this pattern hijacks pragmatic stakes to evade scrutiny of the inference.  

  **4. Proposed Terminology and Definition**  
  No established term captures this duality. I propose:  
  > **Evidential Anchoring**:  
  > *An argumentative strategy where a premise A is used to bootstrap the reliability of a cognitive faculty, which then supports a contentious conclusion C. When C is challenged, A is reflexively defended not evidentially, but by alleging that denying A would incur catastrophic pragmatic or epistemic costs—thereby exploiting A’s dual role as an unjustified evidential foundation and an indispensable pragmatic anchor.*  

  **Scope**: Requires (i) bootstrapping from A to reliability, (ii) inference to C, (iii) defense by pragmatic escalation upon challenge. Distinguishes from standard bootstrapping by the *shield maneuver* and from Mooreanism by the *derivation of reliability*.
