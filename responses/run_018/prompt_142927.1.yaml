prompt: |-
  everyone in my EA-adjacent circles keeps comparing measurability bias to the old streetlight story -- the drunk searching for his keys under the lamppost cuz thats where the lights, not cuz thats where he dropped them. they use it to argue that institutions like GiveWell end up funding only whats legible (bednets, deworming) and miss the big structural or longterm stuff. i want to audit how far that analogy actually carries weight. lay out the correspondence: whats the lost keys, the lamp post, the darkness, and the drunk guy? then tell me where the mapping breaks -- for instance, does it smuggle in that theres exactly one right place to look, or that quantification is always a distortion rather than a noisy proxy? and heres the key part: if the streetlight image collapses, does the institutional critique about measurability bias still stand on its own, or was the analogy doing all the argumentative work? be honest about which disanalogies matter and which are just decorative.
reasoning: |-
  Okay, the user is asking about the analogy between measurability bias and the streetlight story. They mention their EA-adjacent circles use this to critique organizations like GiveWell for focusing only on measurable interventions (like bednets or deworming) and potentially missing bigger, structural, or long-term issues. The user wants to dissect the analogy: map each part to the real world, find where it breaks, and see if the critique stands without the analogy.

  First, I need to lay out the correspondence. The drunk looking for keys under the streetlight represents GiveWell or similar institutions. The keys are the effective interventions, the lamp post is the measurable outcomes, and the darkness is the hard-to-measure areas. The critique is that by only focusing on what's measurable, they might miss the actual solutions elsewhere.

  But where does the analogy break? The user points out that the analogy assumes there's only one right place to look (the keys are definitely in the dark). But in reality, maybe the keys are under the light. Also, quantification isn't always a distortion; it can be a useful proxy. Plus, GiveWell isn't ignoring the dark areas—they just require different tools. The analogy oversimplifies by implying a binary choice when it's more nuanced.

  The user's deeper need might be to understand if the institutional critique is valid beyond the catchy story. They want an honest assessment: does measurability bias really cause neglect of structural issues, or is the analogy masking weaker arguments? Also, they might be seeking how to balance measurable short-term wins with long-term bets without dismissing either.

  I should address whether the critique stands without the analogy. Yes, because the core issue—measurability favoring certain interventions—is real. However, the analogy's flaws (like ignoring that measurable interventions can be genuinely effective) need highlighting. The user might be looking for a balanced view to inform their stance in EA circles, ensuring they don't oversimplify the debate.
answer: |-
  Here's a rigorous audit of the "streetlight analogy" as applied to measurability bias in EA (specifically GiveWell-style charity evaluation), mapping its components, identifying critical disanalogies, and assessing whether the core critique survives without the analogy:

  **The Mapping (As Used by Critics):**
  1.  **The Lost Keys:** *The most effective interventions to reduce suffering or improve lives.* (The true goal).
  2.  **The Drunk Guy:** *Institutions like GiveWell, or the EA evaluative framework itself.* (The searcher, constrained by their methods).
  3.  **The Lamp Post:** *Quantifiable metrics and rigorous evidence (esp. RCTs).* (The tool enabling the search).
  4.  **The Darkness:** *Interventions with complex, long-term, structural, or hard-to-quantify impacts.* (Where the keys might *actually* be).
  5. **The Search Under the Light:** *Prioritizing interventions like bednets, deworming, or cash transfers* because their impacts on specific, short-term outcomes (e.g., child mortality, school attendance, income) are measurable with high confidence using preferred methods.
  6. **The Implied Critique:** GiveWell is "searching" (funding) where the "light" (quantification) is good, not necessarily where the "keys" (maximal impact) are most likely to be found. They are biased towards the "legible" over the potentially more impactful "illegible."

  **Where the Mapping Breaks (Critical Disanalogies):**
  1.  **The Drunk's Certainty vs. The Evaluator's Uncertainty:** The drunk *knows* he dropped the keys elsewhere. GiveWell *doesn't know* if the "keys" (maximal impact) are definitively in the "dark" (hard-to-measure areas). The darkness represents *uncertainty*, not confirmed location. It's possible impactful interventions *are* under the light. The analogy smuggles in the *assumption* that the highest-impact interventions are *always* in the dark/illegible realm.
  2.  **Quantification as Distortion vs. Noisy Proxy:** The analogy implicitly portrays the "light" (quantification) as *distorting* reality or creating a false target. In reality, quantification is often a *necessary, albeit imperfect and noisy, proxy* for real-world impact. Bednets demonstrably *do* save lives; deworming *does* improve health/schooling in specific contexts. The light illuminates *something real*, even if it doesn't illuminate *everything*. The critique risks equating "hard to measure" with "definitely more impactful," which isn't justified.
  3.  **The Singularity of the Keys:** The analogy assumes there's *one set of keys* in one specific location. Impact maximization involves *many* potential interventions across *many* domains (global health, poverty, animal welfare, long-term future). The "search" isn't for one thing in one place; it's allocating resources across countless possibilities. Focusing *some* resources under the "light" (measurable interventions) is rational diversification, not necessarily myopic stupidity, especially when those interventions have proven high returns.
  4.  **The Drunk's Passivity vs. Active Methodology Development:** The drunk is stuck with only the lamp post. GiveWell and EA actively *acknowledge* the "darkness" and invest in *developing better lights* (e.g., funding research into evaluating advocacy, policy change, movement building, long-termist interventions). They aren't *ignoring* the dark; they are trying to find ways to illuminate parts of it, recognizing the current limitations. Open Philanthropy (EA-adjacent) explicitly funds "worldview diversification" partly to address this.
  5.  **Motivation & Constraint:** The drunk is constrained by his own intoxication. GiveWell is constrained by *resource limitations* (donor dollars) and a *fiduciary responsibility* to recommend interventions where impact can be demonstrated with reasonable confidence. Funding purely speculative "dark" interventions with no measurable evidence of impact is often irresponsible with other people's money intended for concrete good.

  **Which Disanalogies Matter?**
  *   **Critical (Undermine the Analogy's Core Premise):** #1 (Uncertainty of key location), #2 (Quantification as noisy proxy, not pure distortion), and #3 (Multiple keys, portfolio approach). These challenge the analogy's implication that measurable interventions are *inherently* less impactful and that the evaluator *knows* better options exist unseen.
  *   **Important Nuance (Highlight limitations but don't break the critique):** #4 (Active methodology development) shows the field isn't static, but doesn't negate the *current* bias. #5 (Motivation & Constraint) explains *why* the bias exists institutionally but doesn't invalidate its existence.
  *   **Decorative:** Focusing too much on the "drunkenness" aspect – it's just a narrative device.

  **Does the Institutional Critique Stand Without the Analogy?**
  **Yes, the core critique of measurability bias retains significant weight, even if the analogy is flawed.**

  Here's why and how it stands independently:

  1.  **Inherent Favoritism:** Rigorous quantification *inherently favors* certain types of interventions over others. Short-term, discrete, individual-level health or economic outcomes are easier to measure via RCTs than long-term, systemic, societal-level changes (e.g., governance reform, cultural shifts, peacebuilding, climate policy advocacy, AI safety research). This isn't distortion; it's a *methodological reality*.
  2.  **Neglect of Crucial Areas:** This favoritism can lead to systematic *underinvestment* and *under-research* in potentially high-impact areas precisely *because* they are hard to measure. The "darkness" isn't empty; it contains plausible pathways to massive impact (e.g., preventing great power war, improving institutional decision-making, foundational AI safety). The lack of a "light" doesn't mean nothing valuable is there; it means our current tools are inadequate.
  3.  **Risk of Path Dependence:** Over-reliance on established metrics can create path dependence, where funding and research focus increasingly narrows to what's measurable *now*, neglecting the development of methods to measure other important things. The "light" attracts more light-builders, leaving the "dark" perpetually dark.
  4.  **"Legibility" as a Filter:** The concept of "legibility" (James C. Scott) is powerful here. States favor legible projects (like standardized agriculture) over complex, illegible local systems, sometimes with disastrous results. Similarly, funders favor legible interventions (clear metrics, RCTs) over complex, context-dependent, illegible ones, potentially missing crucial solutions or causing unintended harm through oversimplification.
  5.  **Opportunity Cost:** Resources poured into optimizing the measurable "marginal bednet" represent resources *not* spent exploring potentially transformative but harder-to-quantify avenues. The critique argues the *balance* is wrong, favoring measurable certainty over uncertain but potentially massive upsides.

  **Conclusion:**

  The streetlight analogy is a catchy but **deeply flawed** metaphor. It oversimplifies by implying evaluators *know* the best solutions are unmeasurable and are willfully ignoring them due to laziness or stupidity ("drunkenness"). The reality is profound uncertainty, the genuine value of measurable impact, and active efforts to improve methodology.

  **However, the core institutional critique of measurability bias remains robust:** Current dominant evaluation methodologies *structurally favor* interventions with quantifiable short-to-medium-term impacts, creating a systematic bias in funding and attention *against* interventions targeting complex systems, long-term futures, or inherently hard-to-measure outcomes, *even if* those areas hold potential for equal or greater impact. This bias is a real constraint, not just a narrative. Ditching the imperfect analogy allows for a more nuanced discussion about methodological limitations, portfolio diversification, responsible risk-taking in philanthropy, and the urgent need to develop better evaluative tools for the "dark" spaces where crucial challenges lie. The analogy did some argumentative work (making the critique memorable), but the critique's foundation is in the inherent limitations of quantification facing complex systems, not the drunk's foolishness.
