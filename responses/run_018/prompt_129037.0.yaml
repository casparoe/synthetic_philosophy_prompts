answer: |-
  ## Fellowship Proposal: Decomposing Alternative Possibilities in Moral Responsibility

  **1. Research Question**  
  Does reframing the Principle of Alternative Possibilities (PAP) by splitting "could have done otherwise" into two distinct conditions—**Local Branch Availability (LBA)** and **Global Trajectory Divergence (GTD)**—successfully defend a *minimal* condition for moral responsibility (LBA) against Frankfurt-style counterexamples that block GTD, while demonstrating that LBA is conceptually distinct and robust enough to ground responsibility *without* collapsing into existing "flicker of freedom" strategies or simply restating the standard PAP debate?

  **(Target Answer: Yes)**

  **2. Why Existing Responses Leave This Split Unresolved**  
  Frankfurt’s challenge (showing responsibility can exist *without* alternative possibilities) prompted major responses, but none explicitly decompose "could have done otherwise" into the *specific* LBA/GTD distinction, leaving the core conceptual ambiguity unaddressed:

  *   **Hierarchical Models (e.g., Frankfurt himself, Bratman):** Focus on identification with desires or plans. They bypass PAP but do not analyze the *structure* of alternative possibilities themselves. They ask *whose* desire matters, not *what kind* of possibility is relevant.
  *   **Flicker of Freedom Strategies (e.g., Widerker, Wyma):** Argue Frankfurt cases still contain *some* alternative (e.g., deciding *differently* before intervention, or triggering/not triggering the intervener). Crucially, they treat these alternatives as unitary "flicks." They do not distinguish whether responsibility hinges on the *local* availability of *any* branch point (LBA) or the *global* possibility of a *different outcome state* (GTD). Treating the "flick" as a single entity obscures this potential split.
  *   **Standard PAP Defense (Rejecting Frankfurt):** Insists true alternative possibilities *are* necessary and Frankfurt cases are incoherent or misdescribed. This maintains the unitary view of "could have done otherwise," failing to explore whether PAP might be *overloaded* by conflating two distinct modal properties. It defends the whole, rather than dissecting it.

  Existing debates operate *within* the framework of a singular "alternative possibility." The LBA/GTD split proposes a *category distinction* within that framework, arguing that conflating them is the source of persistent disagreement. Neither hierarchical models nor flicker strategies attempt this precise decomposition; they either abandon PAP’s core modal concern (hierarchical) or defend a minimal, undifferentiated version of it (flicker). The split remains unresolved because the *conceptual structure* of "alternative possibility" itself has not been pressured in this specific way.

  **3. Methodology: A Three-Month Conceptual Analysis**

  This project employs rigorous conceptual analysis, leveraging thought experiments and logical pressure-testing. An empirical (e.g., experimental philosophy) or purely historical approach is unsuitable: the goal is not to survey opinions or trace debates, but to *construct and evaluate* a novel conceptual distinction within an established philosophical problem. The computational analogy (rollback vs. feature flags) provides an initial heuristic, but the analysis will be conducted in purely philosophical terms.

  *   **Month 1: Precise Definition & Taxonomy Construction**
      *   **Activity:** Rigorously define LBA and GTD using modal logic and causal frameworks.
          *   *LBA:* At time `t` (just prior to action `A`), does the agent possess *at least one* accessible decision node branching away from `A` within their *immediately available* cognitive/volitional state, *irrespective* of prior causal chains or external constraints? (Analogy: A feature flag is *toggleable now*, even if remote config will override it).
          *   *GTD:* Is there a possible world, sharing the actual world's causal history up to `t`, where the agent performs `~A`, leading to a *genuinely different outcome state*? (Analogy: Could the *entire system state* have rolled back to a point enabling a divergent future?).
      *   **Thought Experiments:** Construct "pure" cases isolating each condition. E.g., an agent with robust LBA (multiple salient options felt as live) but blocked GTD (due to a Frankfurt-style intervener *or* deterministic laws); an agent with blocked LBA (paralyzed indecision, severe compulsion) but hypothetical GTD (e.g., if only they *had* been able to choose differently, outcomes diverge).
      *   **Goal:** Establish clear, distinct criteria for LBA and GTD that avoid overlap or circularity.

  *   **Month 2: Pressure-Testing Against Frankfurt & Responsibility**
      *   **Activity:** Apply the LBA/GTD framework to canonical Frankfurt cases (Jones & Black) and variations.
          *   *Core Test:* Does Jones retain LBA *at the moment of decision* even when Black blocks GTD? Does the *feeling* of choice, the mental deliberation between options, constitute LBA?
          *   *Counter-Tests:* Construct cases where LBA is present but intuitively *insufficient* for responsibility (e.g., trivial choices, manipulated options). Construct cases where GTD is blocked non-Frankfurtly (e.g., deterministic universe without interveners) – does LBA *still* seem necessary/sufficient? Pressure-test whether LBA can be non-trivial (beyond mere "flickers" like deciding *how* to act under compulsion) and directly relevant to the *moral quality* of the choice.
      *   **Conceptual Distinctions:** Pressure-test boundaries: Is LBA purely internal/phenomenological, or does it require *genuine* (though constrained) causal efficacy? How does LBA relate to reasons-responsiveness? Does responsibility *require* GTD for ultimate authorship, or is LBA at the choice point sufficient for ownership of *this* act?

  *   **Month 3: Synthesis, Responsibility Claim, & Evaluation**
      *   **Activity:** Synthesize findings. Formulate a precise claim: "Moral responsibility for action `A` performed at `t` requires Local Branch Availability at `t`, but does not require Global Trajectory Divergence." Defend this claim against anticipated objections (e.g., the "irrelevance objection" – if the alternative branch is blocked, how can LBA matter?; the "sourcehood objection" – if GTD is impossible, is the agent the true source?).
      *   **Final Evaluation:** Does the LBA/GTD split provide a *distinct* and *viable* path through the Frankfurt impasse? Does it offer a clearer understanding of *why* we hold agents responsible even in constrained scenarios? Does it avoid collapsing into existing strategies by making LBA a *structural feature* of agency at the choice point, not just a minimal alternative event?

  **4. Outcomes: Success, Failure, and the Risk of Collapse**

  *   **Positive Result (Success):** The project demonstrates that:
      1.  LBA and GTD are conceptually distinct and separable conditions.
      2.  Frankfurt cases successfully block GTD *but* preserve LBA.
      3.  LBA, understood as the *structural capacity for immediate, conscious volitional branching* at the point of choice, is both necessary and (when non-manipulated and connected to reasons) sufficient for a meaningful form of moral responsibility *for that specific choice*, even in the absence of GTD.
      4.  This account is *distinct* from flicker strategies by focusing on the *ongoing structure of agency* (like a constantly available feature flag) rather than identifying specific, often trivial, alternative *events* (flickers). It explains *why* the agent's deliberation feels relevant – because LBA is real.
  *   **Failure:** The project fails if:
      1.  LBA cannot be rigorously defined independently of GTD.
      2.  LBA in Frankfurt cases reduces *only* to trivial "flickers" already debated (e.g., the possibility of *signaling* the intervener), showing no novel conceptual ground.
      3.  LBA alone is demonstrably insufficient for grounding responsibility (e.g., strong intuitions persist that blocked GTD undermines true ownership regardless of LBA).
      4.  The distinction provides no new leverage on responsibility attributions compared to existing accounts.
  *   **Risk of Collapse:** The primary risk is that LBA **collapses into a redescription of sophisticated flicker strategies**, merely calling the minimally preserved alternative "local branching." **This proposal definitively argues this collapse does *not* occur.** The distinction lies in LBA being a *standing capacity inherent to the agent's decision-making architecture at `t`*, not the *occurrence* of a specific alternative event or state. LBA is about the *openness of the node itself* before any specific path is taken, analogous to the system's *capability* to toggle a flag *now*, even if its effect is overridden. Flicker strategies focus on the *existence* of some other *path* (however minor). LBA focuses on the *structure of the junction*. This is a substantively different conceptual locus, offering a new explanation for the *source* of responsibility within the agent's current, active volitional state.

  **5. Realistic Scope Assessment**  
  As a non-philosopher working alone for three months, this scope is ambitious but feasible:

  *   **Focus:** Deep engagement with core Frankfurt literature, PAP defenses, and key flicker responses is essential. Broader free will debates (compatibilism/incompatibilism, source vs. leeway) will be engaged only as directly relevant to the LBA/GTD split and Frankfurt objections.
  *   **Output:** The primary output is a rigorously argued conceptual position paper (30-40 pages) establishing the definitions, defending the distinction, applying it to cases, and arguing for its relevance to responsibility. It will *not* attempt a comprehensive survey of all free will literature or offer a complete theory of responsibility.
  *   **Limitation:** Novelty will be constrained to the specific decomposition proposed. The project leverages existing philosophical tools (modal logic, causal reasoning, conceptual analysis) applied in a novel combination inspired by a computational perspective. It does not require developing new formal systems.
  *   **Feasibility:** The month-by-month breakdown provides clear milestones. The analytical approach is suitable for solo work. The computational background offers a unique perspective but the argument must stand on philosophical grounds.

  **6. Committed Position: This Split is Philosophically Productive**

  **This decomposition is not merely a redescription; it is a philosophically productive conceptual advance.** Here's why:

  1.  **Diagnostic Power:** It identifies a specific category error (conflating local node accessibility with global path divergence) as a root cause of persistent stalemate in the PAP debate. This offers a clearer lens to dissect disagreements.
  2.  **Reframing Frankfurt:** It provides a principled way to *concede Frankfurt's core point* (responsibility without GTD) *without* abandoning the intuition that the agent's *active choice* matters. It locates the source of responsibility precisely where the agent experiences it: in the local, present-moment capacity for branching deliberation and intention formation (LBA).
  3.  **Beyond Flickers:** By focusing on the *structural capacity* (LBA) rather than the *existence of specific alternative events* (flickers), it grounds responsibility in a more robust feature of agency – the *architecture of choice* itself. This avoids the diminishing returns of finding increasingly minimal flickers and provides a better explanation for why choices *feel* responsible even under constraints.
  4.  **Clarifies the Locus of Control:** It cleanly separates the *local* control inherent in navigating an available decision node (LBA, sufficient for responsibility *for that choice*) from questions about *ultimate* sourcehood or the possibility of radically different life trajectories (GTD, potentially relevant for broader notions of autonomy but not necessary for responsibility for a specific act).
  5.  **Leverages Intuition:** The computational analogy (feature flags vs. rollback) resonates with how we think about complex systems having local flexibility within global constraints. This intuitive traction suggests the distinction taps into a real conceptual seam.

  The driving verdict is that the LBA/GTD split **successfully isolates the precise modal feature relevant to attributing responsibility for a specific choice (LBA)** and shows why Frankfurt's attack on the *other* feature (GTD) does not undermine it. This resolves the tension in a way redescriptions or existing strategies do not, offering a clearer, more defensible path forward for compatibilist-leaning accounts of responsibility grounded in the agent's actual, situated capacity for choice.
