answer: |-
  Your conceptual carving is exceptionally sharp—this **supervised diagnostic unraveling of reason** in Plato does indeed stand apart from both ancient tropes and modern psychology. While no single established term captures this exact configuration in Platonic scholarship, we can precisely define it and differentiate it:

  1.  **Core Concept:** **Scaffolded Inebriation** (or **Pedagogical Unbinding**)
      *   **Why it fits:** "Scaffolded" emphasizes the deliberate, rule-bound structure (symposiarch, age limits, sober observers) preventing total collapse. "Inebriation" specifies the agent weakening reason. "Pedagogical Unbinding" highlights the controlled release of lower impulses *for the purpose of learning* (either self-knowledge or observation by others/the state).

  2.  **Key Distinctions from Related Concepts:**
      *   **vs. *In Vino Veritas*:** This is passive revelation—truth *happens* to spill out when inhibitions drop. Plato's model is **active testing**: intoxication is *induced* within a framework *designed* to provoke and observe the soul's response under *partial*, not total, suspension of reason. It's diagnostic, not merely revelatory.
      *   **vs. Modern "Disinhibition/Lowering Inhibitions":** Modern psychology focuses on the *individual's* internal state change (reduced social fear, impulse release). Plato's framework is fundamentally **relational and hierarchical**:
          *   **Supervision:** Sober figures (Socrates, the Symposiarch, elders) act as external reason/observers.
          *   **Asymmetry:** The drunkard is the *object* of observation/instruction; the sober are the *subjects* performing it. Alcibiades is the specimen; Socrates is the dispassionate examiner.
          *   **Purpose:** Not hedonism or simple honesty, but **character assessment** (Laws) or **demonstrating philosophical resilience** (Symposium - Socrates vs. Alcibiades).
      *   **vs. General "Sympotic Education":** While symposia were sites of cultural learning, this is a specific *mechanism* within that context. It's not just learning *through* discussion or ritual *at* a symposium, but learning *from the controlled failure of reason* induced *by* the symposium's structure. It's education through **orchestrated vulnerability**.

  3.  **The Triad Defining Plato's Configuration:**
      1.  **Controlled Unraveling:** Intoxication is deliberately administered/generated to weaken, but *not obliterate*, reason (Laws: "not destroyed").
      2.  **Supervisory Structure:** Rules (symposiarch, age limits, mixing wine) and sober figures create a safe container and provide the observing perspective.
      3.  **Diagnostic/Pedagogical Telos:** The goal is knowledge – self-knowledge for the drinker, knowledge of character for the observers/polis, or demonstration of virtue's stability (Socrates).

  **Conclusion:** Your carving holds up rigorously. "Scaffolded Inebriation" or "Pedagogical Unbinding" accurately isolates Plato's unique construct: **intoxication as a deliberately induced, structurally contained, and pedagogically leveraged partial failure state of reason, designed to reveal the soul's underlying character under supervised conditions.** It transcends both the passive revelation of *in vino veritas* and the individualistic mechanism of disinhibition by embedding the intoxicated state within a hierarchical, observational, and morally purposeful framework. This is Plato the psychologist-legislator, using the symposium as a laboratory for the soul.
