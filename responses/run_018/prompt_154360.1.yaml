answer: |-
  ### 1. Exam Question  
  **Philosophy 403: Advanced Topics in Self-Locating Belief – Final Examination**  
  **Time Allowed: 75 minutes**  
  **Word Limit: 1,000–1,200 words**  

  **Section C: Essay**  
  *Answer ONE question.*  

  **Question 3:**  
  Consider a variant of the Sleeping Beauty problem. Beauty is told the following on Sunday:  
  - A fair coin will be tossed.  
  - If *Heads*, she will be woken *only once* on Tuesday. Her waking will occur in Environment A.  
  - If *Tails*, she will be woken *twice*: once on Tuesday in Environment A, and once on Wednesday in Environment B.  
  Environments A and B are *phenomenologically identical*: Beauty’s sensory experiences, memories, and cognitive states are indistinguishable between them. Critically, Environment A and Environment B are *causally isolated*: events in one do not affect the other.  

  Upon each waking, Beauty is informed: “Your *present mental state* may be multiply instantiated. If Heads, your Tuesday mental state occurs in one environment. If Tails, your Tuesday state occurs in Environment A, and your Wednesday state occurs in Environment B—a distinct, causally separate realisation of the same phenomenology.”  

  Beauty now wakes up and recalls the setup. She experiences identical mental states on Tuesday (whether in Heads or Tails) and Wednesday (in Tails).  

  **(a)** Should Beauty assign the same credence to *Heads* upon waking on Tuesday as she would upon waking on Wednesday (under Tails)? Justify your answer with reference to the branching structure of instantiation.  
  **(b)** Does this scenario suggest that rational updates for self-locating beliefs track *modal accessibility* (i.e., possible environments where one’s mental state could be realised) rather than merely *physical duplication of observers*? Discuss the implications for theories of self-locating uncertainty.  

  ---

  ### 2. Model Answer  
  **(a) Divergent Credences on Tuesday vs. Wednesday**  
  Beauty *should not* assign identical credences to Heads on Tuesday and Wednesday. On Tuesday, her credence in Heads should be *1/2*, whereas on Wednesday (under Tails), it should be *1/3*. This divergence arises from the *modal branching* of her mental state’s instantiation.  

  Upon Tuesday waking, two epistemically possible scenarios exist:  
  - *Scenario 1 (Heads)*: Her mental state is instantiated *once* (Tuesday in Environment A).  
  - *Scenario 2 (Tails)*: Her mental state is instantiated *twice* (Tuesday in A *and* Wednesday in B). Crucially, **she occupies one branch**—Tuesday-in-A—while an identical mental state exists in Wednesday-in-B, causally isolated from her.  

  When Beauty asks, “What should my credence in Heads be *now*?”, the “now” indexes her current mental state’s instantiation. In Heads, there is only *one* instantiation of her present state (Tuesday-in-A). In Tails, there are *two* instantiations: hers (Tuesday-in-A) *and* Wednesday-in-B. Yet these are *modally disjoint*: her Tuesday-in-A self cannot access or influence Wednesday-in-B. Thus, from her first-person perspective, the relevant reference class is *centred worlds* defined by mental-state instantiations. There are three such instantiations:  
  1. Heads: Tuesday-in-A  
  2. Tails: Tuesday-in-A  
  3. Tails: Wednesday-in-B  
  All are subjectively indistinguishable. As she currently instantiates *one* centre, and two of three centres are Tails-worlds, her credence in Heads is *1/3* **if she considers all possible instantiations equally**.  

  But this is *not* the case on Tuesday. On Tuesday, she knows *no branching has yet occurred for her present state*. The Wednesday-in-B instantiation *does not exist* from her temporal vantage; it is a *future* modal branch contingent on Tails. Her query “Am I in Heads?” concerns only *present* instantiations. Given Heads implies one present instantiation (Tuesday-in-A), and Tails implies one present instantiation (Tuesday-in-A), these are equiprobable. The Wednesday-in-B branch remains counterfactual until Wednesday *if* Tails holds. Thus, on Tuesday, credence in Heads is *1/2*.  

  On Wednesday (under Tails), Beauty’s mental state is instantiated in Environment B. Here, Heads is impossible—Heads-worlds lack Wednesday instantiations. Only two centred worlds exist: Tails-Tuesday-in-A and Tails-Wednesday-in-B. As she occupies one centre, credence in Heads is *0*. However, if she forgets the day (as in classic Sleeping Beauty), but recalls the branching structure, the three instantiations above apply, yielding *1/3* for Heads. The key is that Wednesday-in-B *is now actualised*, so all three instantiations are epistemically live options.  

  **(b) Modal Accessibility vs. Physical Duplication**  
  This variant demonstrates that self-locating updates track *modal accessibility*, not mere physical duplication. Physical duplication focuses on spatiotemporal copies (e.g., Tails creating two Beauties in one world). Here, however, Environment B is *causally isolated* and *modally distinct* from A—it is a separate realisation of the same phenomenology, not a clone in a shared world.  

  When Beauty evaluates credences, she must consider all *centred worlds* where her current mental state is realised, *regardless* of whether those centres are “her” in a diachronic sense. The Wednesday-in-B instantiation is not a future version of her Tuesday self but a *distinct epistemic subject* with identical phenomenology. Rational updating thus depends on *which instantiations are modally accessible* from her perspective—i.e., which could correspond to her present experience.  

  This undermines duplication-based approaches like the Thirder view (which counts temporal stages) or the Halfer view (which prioritises possible worlds). Thirders might argue for *1/3* on Tuesday by counting two Tails awakenings, but this conflates *actual* temporal stages with *merely possible* ones. In this variant, Wednesday-in-B is not yet actual on Tuesday; it is a *contingent future branch*. Similarly, Halfers err by ignoring that *multiple instantiations* exist under Tails, each generating distinct first-person perspectives.  

  The implication is profound: self-locating uncertainty is not about *where* or *when* one is in a fixed world, but *which modal branch* one inhabits. Rational credence must weight all branches where one’s mental state *could* be instantiated, treating each as an equiprobable centre. This aligns with a *modal conception of self-location*: Beauty’s ignorance stems from not knowing which branch her consciousness is realised in, not from physical indistinguishability alone.  

  ---

  ### 3. Marking Scheme  
  **Total Marks: 20**  
  *(Allocate marks based on demonstration of analytical rigour, coherence, and engagement with the branching-instantiation twist.)*  

  1. **Accurate Setup & Distinction of Environments (4 marks)**  
     - *Award:* Clearly explains causal isolation, phenomenological identity, and branching instantiation.  
     - *Deduct (common error):* Treating Environments A/B as spatial locations in one world or conflating them with temporal stages.  

  2. **Differential Credence Calculation (6 marks)**  
     - *Award:* Argues credence on Tuesday is 1/2 (no branching yet for current state) vs. 1/3 on Wednesday (all branches actualised), using centred worlds.  
     - *Deduct (common error):* Assigning 1/3 on Tuesday by erroneously counting Wednesday-in-B as contemporaneous.  

  3. **Modal vs. Duplication Argument (5 marks)**  
     - *Award:* Contrasts modal accessibility (multiple realisations of mental states in disjoint environments) with physical duplication (copies in one world).  
     - *Deduct (common error):* Claiming the setup is "just like standard Sleeping Beauty" or reducing branching to temporal redundancy.  

  4. **Treatment of Epistemic Subjects (3 marks)**  
     - *Award:* Identifies each instantiation (Tue-A/Heads, Tue-A/Tails, Wed-B/Tails) as a distinct epistemic centre.  
     - *Deduct (common error):* Assuming Beauty’s "self" persists across branches or that Wednesday-in-B is "her future self".  

  5. **Philosophical Implications (2 marks)**  
     - *Award:* Concludes that self-locating belief tracks possible realisations of consciousness, not observer-counting.  
     - *Deduct (common error):* Retreating to halfer/thirder orthodoxy without engaging the modal twist.  

  *Note:* Award half-marks for partial achievement. Prioritise quality of reasoning over word count.
