answer: |-
  Below is a rigorous assessment of the five criteria based on analytical robustness, with scores reflecting avoidance of emptiness, triviality, over-expansion, and over-contraction. "The West" is treated as a historically constructed category, not a natural or fixed entity.

  ### **Ratings & Justifications**  
  1. **Genealogical descent (Greek/Roman/Abrahamic traditions)**  
     **Score: 7/10**  
     *Strong historical grounding avoids triviality but risks over-expansion (e.g., claiming rationalism as exclusively Western) and over-contraction (excluding Enlightenment innovations or non-European influences).*  

  2. **Institutional embedding (post-Westphalian legal/political structures)**  
     **Score: 8/10**  
     *Concrete institutional ties provide non-trivial specificity and resist emptiness, though over-contraction occurs by excluding pre-modern or non-state Western values (e.g., humanism), and over-expansion may arise when similar institutions exist elsewhere (e.g., Japan).*  

  3. **Functional deployment (geopolitical discourse irrespective of origin)**  
     **Score: 3/10**  
     *Highly vulnerable to over-expansion by absorbing any value invoked in "Western" rhetoric (e.g., "democracy" claimed by non-Western states) and triviality by making the category context-dependent and ideologically fluid.*  

  4. **Explicit normative self-ascription (populations/regimes identifying as Western)**  
     **Score: 2/10**  
     *Prone to over-contraction (excluding societies with contested identifications, e.g., Turkey) and emptiness via circularity, while enabling over-expansion if regimes opportunistically claim "Western" labels for non-Western practices.*  

  5. **Layered "necessary-but-not-sufficient" model (all prior criteria as strata)**  
     **Score: 9/10**  
     *Mitigates individual weaknesses by requiring multiple dimensions, resisting triviality (e.g., a value must pass multiple filters) and over-expansion/contraction (e.g., self-ascription alone is insufficient), though complexity may create operational ambiguity.*  

  ---

  ### **Ranking from Most to Least Defensible**  
  1. **Layered model** (Criterion 5)  
     *Holistically addresses the construct’s complexity while balancing historical depth, institutional reality, and discursive context—reducing singular vulnerabilities.*  
  2. **Institutional embedding** (Criterion 2)  
     *Focuses on measurable, structurally embedded practices, offering concrete boundaries without relying solely on genealogy or rhetoric.*  
  3. **Genealogical descent** (Criterion 1)  
     *Provides essential historical context but risks essentialism and excludes syncretic or modern developments.*  
  4. **Functional deployment** (Criterion 3)  
     *Useful for discourse analysis but collapses "Western" into a rhetorical tool with no stable content.*  
  5. **Explicit normative self-ascription** (Criterion 4)  
     *Highly susceptible to ideological manipulation and offers no objective basis for evaluation.*  

  ---

  ### **Most Vulnerable to "No True Scotsman" Maneuver**  
  **Criterion 4 (Self-ascription)** is the most vulnerable. Its reliance on subjective identification allows defenders to arbitrarily exclude counterexamples by denying their "authentic" Western character (e.g., "Illiberal policies in Hungary? Not *truly* Western!"). This circular logic empties the category of analytical value by making it unfalsifiable and ideologically malleable.
