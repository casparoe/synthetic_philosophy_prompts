prompt: |-
  I'm running a small philosophy podcast and next week I'm intervewing a legal theorist who defends a tweeked Hartian view: she claims Fuller's eight canons of legality aren't a moral check but just 'epistemic scaffolding' that lets subjects predict state coercion. Draft exactly five interview questions, numbered 1 to 5, each one or two sentences max, with no intro or conclusion, in British English. Each should press where the literature actually presses — include the reply she'll likely give and a sharper follow-up — and I want at least one on whether predictable coercion is already a moral good (so the scaffolding collapses back into natural law), one on unjust but procedurally perfect laws like apartheid pass laws, and one where she deflects with 'that's a research programme, not an objection.' Keep it casual; a typo or two is fine.
reasoning: |-
  Hmm, the user is running a philosophy podcast and needs interview questions for a legal theorist who has a "tweaked Hartian view." Specifically, she sees Fuller's eight canons of legality as "epistemic scaffolding" for predicting state coercion rather than moral checks. I need to draft exactly five questions in British English, each one or two sentences max, with no intro or conclusion. They should press key points in the literature and include likely replies plus sharper follow-ups. Key requirements: one on whether predictable coercion is a moral good (tying to natural law), one on unjust but procedurally perfect laws like apartheid pass laws, and one where she deflects with "that's a research programme, not an objection." Also, keep it casual with typos allowed.

  First, I recall the core concepts. H.L.A. Hart is a positivist who separates law from morality, while Lon Fuller argued that law has an internal morality through his eight principles like clarity, consistency, and prospectivity. This theorist is reinterpreting Fuller's canons as purely epistemic—helping subjects predict when the state will coerce them, not as moral constraints. That's the twist I need to challenge.

  Now, structuring the five questions: I'll start with the moral good one since it's specified, as it could collapse into natural law if predictability is inherently moral. Then, the apartheid example to test procedural perfection versus injustice. For the deflection point, I'll set one up where she might dismiss criticism as unfinished research. The other two should cover literature pressures, like how epistemic scaffolding handles non-state coercion or conflicts between predictability and other values.

  For question 1, on predictable coercion as a moral good: Her likely reply is that predictability is prudential, not moral, to avoid confusion. Follow-up: if it's just about reducing errors, why not use clearer signals than legality? This presses the moral angle subtly.

  Question 2 on apartheid laws: She'll probably say that procedural compliance makes coercion predictable, so the scaffolding works. Follow-up: but if people still can't plan lives due to arbitrary enforcement, doesn't that undermine the epistemic claim? This highlights real-world flaws.

  Question 3 for deflection: I'll set a query on how the view accounts for non-state actors. She might say it's a research programme. Follow-up: but if it can't explain informal norms now, isn't that a weakness? This calls out deflection.

  Question 4 on conflicts: For instance, retrospective laws might aid predictability in crises. Her reply: the canons aren't absolute. Follow-up: how does that differ from Fuller's approach? This questions uniqueness.

  Question 5 on power imbalances: She might say law still scaffolds prediction. Follow-up: but if it entrenches inequality, is it really neutral? This ties to morality again.

  I'm using British English—words like "favour" and "programme"—and keeping sentences short. Casual tone means contractions and minor typos, like "tweeked" in the query, so I'll mirror that in replies. Ensure the questions are sharp but conversational for a podcast.

  Finally, I'll review: five questions, numbered; each has reply and follow-up; covers all specified elements; flows logically. This should provoke deep discussion without being confrontational.
answer: |-
  1.  You say Fuller's eight principles are just 'epistemic scaffolding' helping folk predict state coercion, not a moral check. But isn't *predictable* coercion itself a moral good, like Fuller argued, collapsing your scaffolding back into natural law?  
      *Likely Reply:* Predictability is primarily prudential for avoiding sanctions, not inherently moral; morality concerns the law's *content*, not just knowing when the boot drops.  
      *Sharper:* If the *only* point is avoiding nasty surprises, why favour legality's complex scaffolding over simpler, clearer signals like "coercion happens on Tuesdays"?

  2.  Take apartheid South Africa's pass laws: procedurally near-perfect on Fuller's criteria, making state coercion highly predictable. Doesn't this show your epistemic scaffolding works brilliantly for profoundly unjust systems?  
      *Likely Reply:* Exactly, it demonstrates the separation; the scaffolding facilitated prediction, however awful the laws predicted were.  
      *Sharper:* But if subjects couldn't *reliably* plan their lives due to pervasive, arbitrary *enforcement* despite procedural laws, doesn't that fatally undermine the scaffolding's core epistemic claim?

  3.  Critics might say your view struggles to explain why subjects use legal norms to predict coercion *instead* of just tracking state power directly or social norms. How do you respond?  
      *Likely Reply:* That's precisely the research programme – mapping *when* and *why* legality becomes the dominant epistemic scaffold over alternatives in different contexts.  
      *Sharper:* But if your framework can't currently explain why law trumps other predictors *now*, isn't that less a programme and more an admission it lacks explanatory power for existing legal systems?

  4.  Don't the eight principles sometimes *conflict* as epistemic tools? Retrospective laws might increase predictability after a crisis, say, clashing with prospectivity. How does your scaffolding handle that?  
      *Likely Reply:* The principles are heuristics, not strict rules; their weight as predictive aids depends on context and subjects' need for stable expectations.  
      *Sharper:* Doesn't this contextual balancing act look suspiciously like Fuller's own 'internal morality' reasoning, just with 'predictability' swapped in for 'morality'?

  5.  Hart worried about power imbalances. If law primarily scaffolds the *state's* coercion for subjects, doesn't it favour the powerful by design, making it inherently political, not neutral epistemology?  
      *Likely Reply:* The scaffolding describes a function subjects *use*, not an endorsement; predictability can still be a tool for resistance within an asymmetric system.  
      *Sharper:* But if the very structure reliably predicts coercion that systematically disfavours certain groups, isn't calling it mere 'epistemic scaffolding' a pretty anaemic description of that oppressive function?
