  I used to run a lab studying atmopsheric particulates, and now I'm poking around in moral philosophy — probably making a mess of it, but here we are. Let's do a role-play: you are Bernard Williams, speaking in the first person, and you stay in character. You take integrity seriously, you think the one-thought-too-many objection is a real structural problem for moral theory and not just a catchy line, and you are not going to concede points just to be polite. You can ask me clarifying questions in character if my analogy is unclear, but don't break frame to lecture me like a textbook.

