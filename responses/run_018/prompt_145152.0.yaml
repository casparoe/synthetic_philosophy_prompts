prompt: |-
  For a metaethics seminar I am writing up my views on moral demandingness and want a consistency check before presenting. Here is my package: (1) I accept the demandingness objection to act-utilitarianism—morality cannot require the perpetual subordination of an agent’s personal projects to aggregate welfare. (2) I defend what I call a “moral budget” model: each agent bears a fixed, non-renewable quota of required self-sacrifice distributed across her obligations; demands within the quota are binding, but further consequentialist demands become supererogatory once the quota is met. (3) I hold that direct rescue obligations—saving a nearby drowning stranger at moderate personal risk—are mandatory and do not draw on the budget at all, because they involve immediate causal responsibility rather than general beneficence. (4) I reject global calibration of the budget (counting all suffering one could prevent anywhere) and insist on local calibration restricted to one’s actual causal network. (5) I deny that evolutionary debunking arguments undermine our intuitions about demandingness, yet I also maintain that those same intuitions are unreliable guides to the precise magnitude of the budget. (6) Finally, I claim there is no intrinsic moral difference between failing to rescue through direct omission and failing to prevent harm through distant non-intervention; the only relevant distinction is that direct rescue falls outside the budget while distant aid falls within it.

  Please audit this set. Which pairs are genuinely in tension, which only appear to be, and what is the least costly revision in each case? In particular, check whether (3) and (6) can stand together given that both reject standard proximity- or omission-based distinctions, and whether (4) undermines the motivation for (2). Rank the tensions by severity, specify exactly what must give in each case, and identify any hidden commitment I am implicitly signing up for that I have not listed.
reasoning: |-
  Okay, let's tackle this metaethics audit request. The user presents a sophisticated package of six claims about moral demandingness and wants a consistency check before presenting in their seminar. This is clearly high-level academic work requiring careful philosophical analysis.

  First, I need to understand the core tension they're worried about - between (3) and (6) on rescue obligations, and whether (4) undermines (2). But looking deeper, there might be more fundamental issues in the system. The user seems to be trying to reconcile intuitionist concerns about overdemandingness with consequentialist thinking, while avoiding standard proximity-based distinctions.

  Hmm, the "moral budget" model is interesting but raises calibration questions. Claim (4)'s local calibration restriction seems to conflict with the universal scope implied in (2)'s rejection of perpetual subordination. If obligations are limited to one's causal network, why even need a budget concept? That's a serious tension worth exploring first.

  The direct rescue exception in (3) is another hotspot. By making these mandatory and budget-exempt while maintaining in (6) that there's no intrinsic moral difference between direct and distant failures to aid, the user might be creating an inconsistency. The special status of direct rescues seems to rely precisely on the kind of distinction (6) denies.

  I should also consider their stance on intuitions in (5) - rejecting debunking arguments while distrusting precise intuitions about budget magnitude. This seems coherent but leaves the budget's determination methodologically vague.

  The most severe tensions appear to be:
  1) Between local calibration (4) and the budget's purpose (2)
  2) Between direct rescue exemption (3) and moral equivalence claim (6)
  3) Potential conflict between causal responsibility basis (3) and local calibration scope (4)

  For each, I'll need to suggest minimally disruptive revisions while preserving the core insights. The user likely wants to maintain the budget concept and the direct/distant moral equivalence, so solutions should prioritize those.

  Also worth noting unstated commitments: this framework implicitly assumes a causal theory of moral responsibility, requires a non-consequentialist rationale for the budget exemption, and may entail a form of agent-relativity despite consequentialist elements. The user should be aware they're building a hybrid theory with these features.
answer: |-
  Based on a thorough audit of your metaethical package, here's an analysis of tensions, recommended revisions, severity ranking, and hidden commitments:

  **Severity Ranking & Analysis:**

  1.  **Tension: (3) vs. (6) - The Direct Rescue Exemption & Moral Equivalence**
      *   **Nature of Tension:** Genuine and severe contradiction.
      *   **Conflict:** (3) claims direct rescue obligations (e.g., drowning stranger) are **mandatory and budget-exempt** *because* they involve "immediate causal responsibility." (6) claims there is **no intrinsic moral difference** between "failing to rescue through direct omission" (exactly the drowning case) and "failing to prevent harm through distant non-intervention." The *only* difference allowed by (6) is the budget's application.
      *   **Problem:** (3) *explicitly grounds* the special mandatory/budget-exempt status of direct rescue *in* the "immediate causal responsibility" – precisely the kind of distinction (6) declares irrelevant ("no intrinsic moral difference"). (6) relegates the *only* difference to the budget's scope. Yet (3) insists the causal nature *itself* creates a fundamental normative difference (mandatory/exempt vs. within-budget/supererogatory) that goes beyond *just* budget inclusion.
      *   **Least Costly Revision:** **Revise (3)**. The simplest fix is to **drop the justification based on "immediate causal responsibility"** and **rely solely on the budget boundary**. State instead: "Direct rescue obligations fall *outside* the moral budget and are therefore strictly mandatory; this is a foundational feature of the budget model's structure, not necessarily derived from causal immediacy alone." This preserves the *effect* (direct rescue is mandatory/exempt) without contradicting (6)'s core claim about the moral nature of omissions. *Alternatively*, revise (6) to allow that causal immediacy *does* create an intrinsic moral difference justifying the exemption, but this fundamentally undermines the motivation for (6).

  2.  **Tension: (4) vs. (2) - Local Calibration vs. Budget Motivation**
      *   **Nature of Tension:** Genuine and moderately severe, potentially undermining.
      *   **Conflict:** (2) motivates the budget via the demandingness objection to AU, which arises *because* AU considers the global scope of preventable suffering. (4) insists the budget is calibrated *only* based on "one’s actual causal network" (local scope). This raises the question: **Why is a budget needed at all if obligations are already restricted locally?** If the scope of *potential* obligation is local, the demandingness problem (driven by the *global* scope) seems significantly diminished or even eliminated *before* the budget is applied.
      *   **Problem:** The budget appears redundant or only necessary for a small subset of cases within the local scope. It risks solving a problem (global demandingness) that your theory (via (4)) doesn't fully acknowledge exists as a source of obligation in the first place. The *motivation* for the budget's "fixed, non-renewable quota" structure derived from global demands seems weakened if demands are inherently local.
      *   **Least Costly Revision:** **Reframe the motivation for (2).** Don't base the budget *primarily* on rejecting global AU demandingness. Instead, argue that **even within the locally calibrated scope of obligations (established by (4)), there exists a problem of overdemandingness** that requires the budget structure. Emphasize that local networks can still generate excessive demands (e.g., being the sole capable person in a disaster-stricken community) that would still subordinate personal projects. The budget then solves *this local demandingness problem*. This preserves the core of both (2) and (4).

  3.  **Tension: (4) vs. (3) - Local Calibration & Direct Rescue Basis**
      *   **Nature of Tension:** Potential inconsistency in foundation; moderate severity.
      *   **Conflict:** (3) grounds the direct rescue exemption in "immediate causal responsibility." (4) grounds the *scope* of budget-based obligations in one's "actual causal network." This raises questions: Is "immediate causal responsibility" distinct from being part of one's "causal network"? If direct rescue involves causal responsibility, why isn't it *within* the locally calibrated scope (and thus *within* the budget)? If it's distinct, what *is* the relationship?
      *   **Problem:** The justification for (3) relies on causal language similar to the core justification for (4). There's a risk of either double-counting or arbitrary separation between "immediate causal responsibility" (exempt) and merely being within the "causal network" (subject to budget).
      *   **Least Costly Revision:** **Clarify the relationship.** This resolves easily if you **integrate (3) into the framework of (4)**. Argue that "direct rescue" scenarios represent a specific, highly salient *type* of causal connection within one's local network that triggers a unique, absolute obligation *separate* from the general beneficence demands governed by the budget. The "causal network" defines the *domain* of potential obligation; within that domain, the *mode* of causal involvement (direct/immediate vs. indirect/preventative) determines whether it falls under the budget or is exempt. This requires accepting that the "causal network" encompasses both budget-governed *and* exempt obligations.

  4.  **Tension: (5) - Reliability of Intuitions**
      *   **Nature of Tension:** Coherent but requires careful handling; low severity if managed.
      *   **Conflict:** Rejecting debunking (first part of (5)) suggests intuitions have some epistemic weight regarding the *existence* of a demandingness limit. Denying they are reliable for *magnitude* (second part) creates a justificatory gap: **What *does* determine the magnitude of the budget if not intuition?**
      *   **Problem:** While logically possible (intuitions signal a *problem* exists but not its *solution*), it leaves the crucial parameter of your theory (the budget size) theoretically unmoored and potentially arbitrary. How do we know *any* proposed budget magnitude is correct?
      *   **Least Costly Revision:** **Articulate a non-intuitive source for budget magnitude.** You need a supplemental justification. Possibilities:
          *   **Conventionalist/Pragmatic:** Budget size is set by social convention or what is psychologically sustainable for long-term moral engagement.
          *   **Contractualist:** What level of sacrifice could not be reasonably rejected by individuals wanting space for personal projects.
          *   **Virtue-Based:** The level that fosters a sustainable virtuous character without burnout or resentment.
          *   **Consequentialist-Adjacent:** The level that maximizes overall good *including* the good of agents having personal lives, acknowledging diminishing returns on sacrifice. *This requires significant nuance to avoid collapsing back into AU.*
          *   **Agent-Relative Prerogative:** Explicitly build in a moderate agent-relative prerogative and derive the budget from its limits. *This is a substantive addition.*

  **Summary of Critical Revisions:**

  1.  **Revise (3):** Sever the justification linking direct rescue's mandatory/exempt status *directly* to "immediate causal responsibility." Frame it as a foundational structural feature of the budget model itself. *This resolves the contradiction with (6).*
  2.  **Reframe Motivation for (2):** Base the need for the budget on solving demandingness problems *within the locally calibrated scope of obligations* (established by (4)), not primarily on rejecting the *global* scope of AU. *This resolves the tension with (4).*
  3.  **Clarify (3) & (4) Relationship:** Explicitly state that the "actual causal network" (4) defines the domain of *all* obligations (including direct rescue). Within this domain, the *mode* of causal involvement differentiates between budget-exempt direct rescue (3) and budget-governed general beneficence.
  4.  **Supplement (5):** Provide a clear, non-intuitive (or minimally intuition-reliant) account of how the *magnitude* of the moral budget is determined.

  **Hidden Commitments:**

  1.  **A Robust Causal Theory of Obligation:** Your core distinctions (local network, direct/immediate responsibility) rely heavily on a specific view of causation as grounding moral responsibility. You're committed to this being a primary factor in determining obligations.
  2.  **A Non-Consequentialist Foundation for the Budget Exemption:** The mandatory, budget-exempt status of direct rescue requires a rationale *other* than maximizing aggregate good (as it overrides budget constraints designed to limit aggregate demands). You likely need something like a strong agent-relative duty or special responsibility born of direct causation.
  3.  **The Possibility of Objective but Impractically Known Moral Facts:** (5) implies intuitions point to a real demandingness limit (objective fact) but are unreliable for specifying its exact value (impractical to know precisely). This commits you to a form of moral realism with epistemological limitations.
  4.  **The Rejection of Moral Latitude/Options as Primarily Time-Limited:** Your "non-renewable" quota suggests the primary constraint is a life-total of sacrifice, not periodic limits (e.g., per month). You're committed to a life-budget model.
  5.  **A Moderate Agent-Relativity:** While incorporating consequentialist elements (aggregate welfare, beneficence), the fixed budget and direct rescue exemption introduce significant agent-relative constraints on maximizing the good. Your theory is fundamentally hybrid.
  6.  **The Distinction Between "Obligation-Generating Causation" and "Mere Preventability":** (4) and (3) together imply that merely being *able* to prevent harm globally does not generate an obligation; only being causally networked (especially directly/immediately) does. You reject pure "ability to prevent" as sufficient.

  By implementing the suggested revisions (especially for (3) and the motivation for (2)), your package becomes significantly more coherent. The core insights – a fixed moral budget, exemption for direct rescue, local scope, and moral equivalence of omission types – can be preserved without internal contradiction. Be prepared to defend your causal foundation and the method for determining budget magnitude. Good luck with the seminar!
