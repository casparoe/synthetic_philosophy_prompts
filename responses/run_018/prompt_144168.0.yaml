  I'm giving a talk next week to our philosophy of mind reading group — mostly grad students, plus two hardline existentialists who think analytic philosophers butcher Sartre's phenomenolgical structure, and a couple cognitive scientists who reckon bad faith is just motivated reasoning in a beret. I'm arguing that bad faith isn't just lying to yourself about being free, but involves a specific misrecognition of facticty — particularly in how people treat algorithmic profiles as if they reveal a fixed 'true self', which is like treating your social role as an essence. Can you draft my Q&A prep? I want the objections ordered by damage, phrased like each camp would actually say them, with a two-minute reply and a note on where I'm soft. Also include the one I'm hoping they skip. Please answer in British English.
