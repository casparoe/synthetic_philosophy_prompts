prompt: |-
  I'm working through a problem in the philosophy of explanation that combines Dennett's cranes-versus-skyhooks framework with the charge of greedy reductionism, and I've built an argument that seems to prove psychology must be eliminated entirely if we take both commitments seriously. I was discussing this with a friend who works on cognitive architecture, and I can't find the exit. Here is the argument. (1) Every legitimate reduction must be a crane: it explains the higher-level phenomenon solely by the organized interaction of lower-level parts, with no unexplained capacities smuggled in at any stage. (2) Greedy reductionism attempts to collapse intermediate levels into a single jump; but such a jump is not a true crane, because the missing rungs leave an explanatory gap that must be filled by an implicit skyhook—some capacity that does the work the skipped levels should have done. (3) Therefore, to avoid both skyhooks and greedy reduction, every intermediate explanatory level must be fully accounted for by the level immediately beneath it, leaving no predictive or explanatory residue. (4) Psychology—beliefs, desires, and other intentional states—is multiply realizable across different neural architectures, so no specific neural-level description fully accounts for a given psychological state; there is always residue that psychological vocabulary captures and neuroscience alone does not. (5) By (3), that residue makes psychology either a skyhook or a level that must be skipped in a greedy leap from neuroscience straight to behavior. (6) Since we reject both skyhooks and greedy reductionism, psychology must be eliminated from our ontology. (7) But that is absurd: we clearly need psychological explanation for predicting action and for understanding reasons. Where does this go wrong? I want to keep (1) and (4) if I can, since both the crane constraint and multiple realizability seem well motivated, but I'm willing to give up (2) or (3) if the cost is lower. Please separate what is settled about the crane/skyhook distinction and about the status of multiply realizable kinds from what is genuinely contested among philosophers of mind who know the literature—especially whether multiple realizability actually blocks downward explanation or merely complicates it—and do not present a contested view as the consensus. Lead with your bottom line in the first sentence and then give the reasoning, with no preamble and no restating of the question.
reasoning: |-
  Okay, the user has presented a complex philosophical argument that concludes psychology must be eliminated based on Dennett's cranes/skyhooks and greedy reductionism. They want to know where the argument fails.

  The core issue seems to be premise (3) - the claim that every intermediate level must be fully accounted for by the level immediately beneath it without residue. This is where the argument overreaches. Multiple realizability (premise 4) does create explanatory residue, but that residue doesn't automatically make psychology a skyhook or require greedy reduction.

  Dennett himself actually accepts special science explanations as legitimate cranes when they capture real patterns - even if they're multiply realizable. The crane metaphor requires mechanisms, but doesn't demand that each level must be reduced to the immediate lower level without residue. What matters is whether psychological explanations track causal patterns that would be impractical to describe at the neural level.

  Multiple realizability means psychology can't be reduced to neuroscience through bridge laws, but that doesn't block downward explanation entirely - it just means we need functional/computational levels between neural mechanisms and psychology. These intermediate levels can account for how different neural architectures implement the same psychological functions.

  The user seems particularly attached to premises (1) and (4), which is understandable since both cranes and multiple realizability are well-established concepts. The problem lies in how premise (3) interprets these commitments too strictly. The solution might be showing how intermediate computational levels can serve as proper cranes for psychology without requiring full neural reduction.

  I should emphasize that this remains contested in philosophy of mind - some hardline reductionists might still challenge multiple realizability, while non-reductive physicalists would defend psychology's legitimacy. The key is that Dennett's framework doesn't actually require the elimination that the argument concludes.
answer: |-
  **Your argument fails at premise (3): Dennett's crane framework does not require that *every* intermediate level be *fully accounted for* by the *immediate* lower level without residue, only that explanations avoid skyhooks and greedy leaps.**

  Here's the reasoning:

  1.  **Premise (1) is correct** as a core Dennettian commitment: Explanations should be built from the ground up using mechanisms (cranes), not positing unexplained explanatory powers (skyhooks).
  2.  **Premise (2) captures Dennett's critique of greedy reductionism**: Skipping levels creates gaps filled by implicit skyhooks because the mechanisms bridging the skipped levels aren't provided.
  3.  **Premise (4) is widely accepted**: Multiple realizability (MR) means psychological states aren't type-identical to specific neural states; psychological descriptions capture functional patterns realized in diverse substrates, leaving "residue" unreducible via simple bridge laws to any single lower-level description.
  4.  **The flaw is in premise (3)'s inference from (1) and (2)**: While (1) and (2) demand *mechanistic explanations without gaps*, they do *not* entail that *every conceivable level* must be *fully reducible without residue* to its *immediate* lower neighbor. Dennett allows that higher-level patterns, captured by special science vocabularies like psychology, are genuine *cranes* themselves **if they identify real, robust, counterfactual-supporting patterns in the world** – patterns that are *implemented* by lower-level mechanisms but are often the most *efficient* or *only tractable* way to predict and explain certain phenomena (like behavior based on beliefs/desires). The "residue" flagged by MR isn't an *explanatory gap* demanding a skyhook; it's the marker of a *distinct pattern* reliably implemented by diverse lower-level mechanisms.
  5.  **Psychology as a legitimate crane**: Psychological explanations (e.g., "Agent X believes P and desires Q, therefore likely does R") are cranes because:
      *   They describe patterns *supervening* on (and thus constrained by) the lower-level physical mechanisms (neural, ultimately physical).
      *   These patterns are robust, projectable, and support counterfactuals ("If he hadn't believed P, he wouldn't have done R").
      *   Providing a full neural-level explanation for every action is computationally intractable and obscures the behaviorally relevant pattern – the psychological explanation *is* the efficient crane capturing that pattern.
      *   The "residue" (the functional role captured by "belief that P") is *explained* by the *organization* of the lower levels (how diverse neural states implement that functional role), not by a skyhook. The lower levels *implement* the functional role, they just don't *type-identify* with it.
  6.  **Contested Status of MR & Downward Explanation**:
      *   **Settled**: MR is a powerful argument against *type-identity theory* (the idea that every mental state type is identical to a specific neural state type). It establishes that psychological kinds are *functional* kinds. The reality of higher-level patterns and the autonomy (at least pragmatic) of special sciences like psychology are widely accepted.
      *   **Genuinely Contested**:
          *   **Does MR *block* reduction?** Reductionists (e.g., Jaegwon Kim) argue MR doesn't block *token-token* identities or *functional reduction* (identifying mental kinds with their functional roles and then reducing those roles to lower-level realizers). Non-reductive physicalists (e.g., Fodor, Putnam earlier) argue MR shows psychological explanations are *autonomous* and indispensable, resisting any *smooth* reduction via bridge laws.
          *   **Is "Residue" Epistemological or Ontological?** Some see the residue as merely about our descriptive/predictive limitations (epistemological), others see it as reflecting genuinely distinct causal patterns or properties (ontological). Dennett leans pragmatic/pattern-based, denying strong ontology for beliefs/desires while defending their explanatory utility as patterns.
          *   **The Nature of "Downward Explanation":** Does psychology explain *in virtue of* capturing high-level causal patterns that would be missed at the neural level (widely accepted as pragmatically useful), or does it involve genuinely novel *downward causation* (highly contested, often rejected by physicalists as violating causal closure)?
  7.  **Conclusion**: Your argument mistakenly equates the "residue" due to MR (the functional nature of psychological states) with an *explanatory gap* requiring a skyhook. Dennettian cranes require mechanisms at *some* level grounding the explanation, not the elimination of all levels that aren't reducible without residue to their immediate lower neighbor. Psychology, as a description of robust functional patterns implemented by neural cranes, is itself a crane, not a skyhook. Rejecting premise (3) resolves the absurdity while preserving (1), (2), and (4). The contestation lies in *how exactly* MR relates to reduction and the precise ontological status of the patterns psychology describes.
