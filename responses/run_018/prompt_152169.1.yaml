  Montauk scene: Post-erasure, Joel and Clementine feel drawn to each other without memories. The user mentions "residual trace." Dennett would argue against a continuous observer. Instead, the film shows non-linguistic echoes—emotional and sensory fragments. These are like dormant drafts resurfacing, not a unified self recalling but fragmented narratives influencing behavior.

