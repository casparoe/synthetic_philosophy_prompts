  Here's the Q&A prep sheet for your protagonist—scrawled like urgent notes on a hospital cafeteria napkin, complete with coffee stains and shorthand. Focus is on tactical defense, not academic perfection:

  **HER OPENING CONCESSION (CRITICAL - SAY THIS FIRST):**  
  *"Look, I get it. The therapy/enhancement distinction works well for acquired conditions—restoring sight after injury, memory after stroke. My argument only targets* congenital *cognitive deficits where there’s no ‘normal’ to restore. I’m not tearing down the wall; I’m saying we built part of it on quicksand."*

  ---

  ### **Q&A PREP: OBJECTIONS & REPLIES**  
  *(Ordered by Likelihood + Damage)*  

  1.  **OBJECTION (Conservative Bioethicist #1 - Definitional Purist):**  
      *"This is semantic gerrymandering! Therapy corrects dysfunction to achieve species-typical function. Enhancement exceeds it. Calling baseline access ‘enhancement’ obliterates the term’s meaning and opens floodgates to trivial augmentations."*  
      **DAMAGE:** HIGH (Attacks core premise)  
      **REPLY:** "Respectfully, ‘species-typical’ assumes a universal baseline that doesn’t exist for congenital neurodivergence. If someone’s brain never developed auditory processing, giving them that capacity *isn’t* restoration—it’s granting a new ability. Calling it ‘enhancement’ accurately reflects the tech’s role: *adding* a typical human capacity they lacked. This doesn’t trivialize enhancement; it forces us to define it by *impact on agency*, not arbitrary biology."  
      **SOFT SPOT:** Doesn’t fully resolve "floodgates" fear. Requires trusting ethical guardrails elsewhere.  

  2.  **OBJECTION (Disability Studies Scholar - Ideological):**  
      *"You’re still centering ‘average capacity’ as the ideal! Calling it enhancement instead of therapy just dresses up the same medical-model coercion. Why is ‘reaching average’ the goal? Shouldn’t we challenge why society demands neurotypicality?"*  
      **DAMAGE:** HIGH (Undermines moral high ground)  
      **REPLY:** "You’re right—this *doesn’t* challenge society’s failures. But flipping the label shifts the *burden*. If this is therapy, insurers say ‘fixing you is your problem.’ If it’s enhancement, we argue it’s society’s duty to provide tools for full participation—like ramps for wheelchairs. It turns ‘charity’ into ‘access justice.’ My goal isn’t to erase neurodiversity; it’s to arm marginalized people with *choices* society denies them."  
      **SOFT SPOT:** Glosses over how choice operates under systemic pressure. Concedes the scholar’s core critique but pivots to pragmatism.  

  3.  **OBJECTION (Neurosurgeon - Pragmatic):**  
      *"Who cares what we call it? Call it fairy dust if you want! But if you label it ‘enhancement,’ the board won’t approve funding, insurers won’t cover it, and my patients stay impaired. Ethics won’t feed them."*  
      **DAMAGE:** MEDIUM (Threatens real-world access)  
      **REPLY:** "Short-term, yes—it’s a fight. But long-term? We’ve won this battle before. Cochlear implants were initially deemed ‘enhancements’ for congenitally Deaf kids. Framing them as essential for communication access forced systems to adapt. By owning the ‘enhancement’ label, we force a conversation: *Why* do we cover prosthetic legs but not prosthetic cognition? It makes exclusion harder to justify."  
      **SOFT SPOT:** Patients suffer during the "long-term" fight. Banking on historical precedent is risky.  

  4.  **OBJECTION (Conservative Bioethicist #2 - Slippery Slope):**  
      *"If we accept this, what stops someone demanding chips for perfect memory, hyperfocus, or IQ boosts? Your ‘flip’ collapses the dam holding back enhancement anarchy."*  
      **DAMAGE:** MEDIUM (Plays to crowd’s deepest fear)  
      **REPLY:** "The dam’s already leaking! We already enhance congenital traits—growth hormone for idiopathic short stature, laser eye surgery for natural myopia. We regulate those by *medical necessity and risk*, not arbitrary labels. My proposal draws a brighter line: Enhancement for *congenital absence of baseline function*. Wanting an IQ boost when you’re already average is fundamentally different from accessing language when you never could."  
      **SOFT SPOT:** "Medical necessity" is itself subjective. Doesn’t erase the slope, just redraws it.  

  5.  **OBJECTION (Conservative Bioethicist #3 - Baseline Fetishist):**  
      *"Nonsense! Congenital deficits HAVE a baseline—it’s the healthy developmental trajectory. Your chip isn’t creating ability; it’s compensating for a pathological deviation from that trajectory."*  
      **DAMAGE:** LOW-MEDIUM (Academic but tiresome)  
      **REPLY:** "What’s the ‘healthy trajectory’ for a brain that genetically never developed Broca’s area? ‘Pathology’ implies deviation from a norm that *doesn’t exist for them*. Their natural state isn’t ‘broken typical’—it’s a *different architecture*. Compensation implies restoring something lost. This is *integration* of a new capability. Calling that ‘therapy’ pretends we’re fixing a glitch, not introducing alien code."  
      **SOFT SPOT:** Gets bogged down in neuro-philosophy. Won’t convince anyone married to "pathology."  

  6.  **OBJECTION (Neurosurgeon - Exasperated):**  
      *"Why overcomplicate this? If the tech safely improves quality of life for consenting patients, that’s therapeutic. Period. Your philosophical flip just gives bean counters ammo to deny care."*  
      **DAMAGE:** LOW (But annoying ally)  
      **REPLY:** "Because ‘quality of life’ judgments are where bias hides! Labeling it therapy lets insurers say, ‘Prove this deficit causes suffering.’ But for someone born without episodic memory, is their baseline ‘suffering’? Framing it as enhancement sidesteps that trap—it focuses on expanding *capacity*, not diagnosing ‘defect.’ It forces systems to justify *denial of capability*, not patients to prove they’re broken enough."  
      **SOFT SPOT:** Sounds idealistic to pragmatists. Ignores immediate political realities.  

  7.  **OBJECTION (Bioethicist #4 - Resource Allocation):**  
      *"Even if we accept your framing, calling it ‘enhancement’ makes universal access politically impossible. How do you justify massive public funding for ‘upgrades’ when we can’t fund basic cancer care?"*  
      **DAMAGE:** LOW (Predictable austerity argument)  
      **REPLY:** "By showing it’s *cheaper* long-term. Cognitive prosthetics reduce lifelong dependency on social services, special education, and caregivers. They enable economic participation. Framing it as essential infrastructure for neuro-minorities—like public transit for non-drivers—makes it an investment, not a luxury."  
      **SOFT SPOT:** Cost-benefit arguments feel cold. Doesn’t win hearts.  

  ---

  ### **THE DREADED OBJECTION (She Hopes Nobody Ashes This):**  
  **OBJECTION (Disability Studies Scholar - Quietly Devastating):**  
  *"Dr. [Protagonist], you have a memory chip. You acquired it after trauma—clearly ‘therapy.’ But isn’t your zeal to label congenital access as ‘enhancement’ a way to distance your own ‘fixed’ state from theirs? A way to prove you’re not ‘enhanced,’ just ‘repaired’? Have you internalized the hierarchy you’re fighting?"*  
  **DAMAGE:** NUCLEAR (Personal, undermines credibility & motives)  
  **REPLY (Must be vulnerable & concede):**  
  *(Deep breath)* "Ouch. Yes, my chip *is* therapy—I had a baseline to restore. And yes, that privilege shapes my lens. But that’s *why* I see the inequity: My ‘glitch’ gets fixed, theirs gets debated. I call it enhancement for them *because* I want to own the baggage: If society sees my chip as ‘fixing brokenness,’ but theirs as ‘optional upgrade,’ that’s ableism. My goal isn’t distancing—it’s forcing society to see *all* cognitive prosthetics as valid paths to flourishing, whether they bridge a gap or build new ground."  
  **SOFT SPOT:** Still centers her experience. Scholar could counter: *"So you speak* for *them from your privileged ‘repaired’ perch?"* (Have a follow-up? Let me know!)

  ---

  **HER CLOSING AMMO (If things get spicy):**  
  *"Remember: We called glasses for mild myopia ‘enhancement’ once. Now they’re essential. This isn’t about winning a philosophy debate—it’s about refusing to make patients beg for tools to exist in a world built against them. Call it enhancement. Then demand it for everyone."*

  Good luck in the boardroom chaos! Watch the neurosurgeon—he’ll vote yes if you make him look good. The disability scholar is your canary; if they nod *once*, you’ve scored. The rest? Outlast them.  
