  Neurosurgeon again: Why complicate with philosophy? Focus on patient outcomes. Reply: Ethical framing affects access. Weakness: Pragmatists may dismiss this.

  Disability scholar on internalized ableism: Does her chip influence her view? The dreaded one. She must admit the chip's role but differentiate her choice from congenital cases. Concession here is crucial to avoid defensiveness.

  Lastly, an outlier from a bioethicist about resource allocation. Argue for societal benefit. Weakness: Doesn't address immediate budget concerns.

  Concessions upfront: The therapy/enhancement line is useful in acute cases but misapplied here. Admits the slope is real but manageable. Wants to avoid zealot perception.

