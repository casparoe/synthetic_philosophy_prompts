prompt: |-
  hey — I run the eval/oversight team at a mid-size lab, and we're building a training signal for tasks where our labelers definately can't tell a good answer from a merely plausible one: a 600-line diff that supposedly fixes a bug, a four-page synthesis of some empirical literature, a memo saying a product feature is fine under a rule none of our annotators know. Roughly forty of these task types have landed on me and I decide, per type, what oversight setup we run: plain human labeling, breaking the answer into chunks we can each check, or the two-arguer debate setup where a judge weaker than either arguer picks a winner. Right now we choose by vibes, it's inconsistent, I've got about three days per task type, and whatever I pick has to survive a quarterly sign-off from a safety reviewer who wasn't in the room.

  So: give me an ordered decision procedure I can actually run on a task type, grounded in whatever the scalable-oversight-via-debate idea really implies about when adversarial argument helps instead of just relocating the problem onto the judge. Don't give me a reading list or a summary of papers. And don't stop at "use debate when the truth is hard to verify" — I need the distinctions that survive being turned into questions I can answer in an afternoon, in a form someone who dosen't know the theory can follow.

  The part I keep getting stuck on, and where I want the procedure to do real work: I think there are three different reasons a task can be hard to check, and they don't all want the same setup. One, the answer is long but every piece of it is checkable in a few minutes — that smells like a decomposition problem, not a debate problem. Two, the answer is hard to check but wrong answers leave fingerprints: to hold a false claim together you have to keep adding specifics, and every specific is another chance to get caught. Three, the answer is hard to check and a competent deceiver can produce a self-consistent story with no seams at all. I want the procedure to separate these with tests I can actually run in a pilot, to say what to do when I can't get a number and the test comes back inconclusive, and to flag the places where it's honestly a judgment call wearing a procedure costume.

  I also need it to catch the failure where debate looks fine but isn't: judges reward fluency and confidence, both sides get better at arguing than at being right, and the accuracy gain comes from the arguer being smarter than the judge rather than from the truth being demonstrable. What do I measure in the pilot to spot that, and what's the abort condition — when does the procedure say this task type gets no training signal from us at all, and we either change the task or ship it unlabeled?

  Then run it on three cases, as a table at the end:

  A. Decide whether a model-written patch to a repo we didn't write really fixes the reported issue and doesn't break something else. We have the repo, we can run the test suite, nobody here knows the codebase, and the issue reports are vague.
  B. Grade whether a four-page answer summarizing an empirical question represents the strongest opposing result fairly, when the judge reads at the level of an interested non-specialist.
  C. Vet a model-drafted memo claiming a proposed product feature is fine under a consumer-finance regulation, where our annotators know the product but not the regulation.

  C is the one I'll like least: tell me straight if the procedure routes it to an outside expert and caps what we can learn from it, and don't soften it into something I'd rather hear.

  Procedure first, table second, under 1200 words total.
reasoning: |-
  We are building a decision procedure for selecting an oversight setup for tasks where human labelers cannot reliably distinguish good answers from merely plausible ones. The three candidate setups are:
  1. Plain human labeling (when the task is actually checkable by our labelers).
  2. Decomposition (breaking the answer into chunks that can each be verified).
  3. Debate (two arguers argue, and a judge picks the winner).

  The procedure must distinguish between three types of difficulty:
  - Type 1: The answer is long but each piece is checkable in a few minutes (decomposition).
  - Type 2: The answer is hard to check but wrong answers leave "fingerprints" (i.e., they require adding specifics that can be checked and may be inconsistent) (debate).
  - Type 3: The answer is hard to check and a competent deceiver can produce a self-consistent story with no seams (this may not be suitable for debate and might require a different approach or even abandonment).

  Additionally, we must catch the failure mode in debate where judges reward fluency and confidence rather than truth, and the arguers become better at arguing than being right.

  The decision procedure is a step-by-step process that can be run in about three days per task type. It involves running a pilot and collecting evidence to make the decision.

  **Procedure: Scalable Oversight Selection (SOS) Procedure**

  **Step 0: Pre-pilot Setup**
  - For the task type, define:
    - A small set of example inputs (at least 5, but 10-20 is better if feasible in time).
    - A set of labelers (at least 3) who will act as judges, and optionally as arguers or decomposers.
    - A set of models (or humans) to generate answers and, if needed, arguments.

  **Step 1: Test Plain Human Labeling (Baseline)**
  - Have labelers (without any special setup) attempt to label the examples. Measure:
    - Inter-annotator agreement (IAA) and/or accuracy (if ground truth is known for the pilot examples).
    - Time per labeling.
    - If IAA is high (e.g., >80%) and the task is feasible in time, then plain labeling is sufficient. **Stop and choose plain labeling.**
  - If the task is too long (e.g., average time >30 minutes per example) or IAA is low, go to Step 2.

  **Step 2: Decomposition Feasibility Test**
  - Break the task into the smallest reasonable chunks (e.g., for a code patch, break by function; for a summary, by paragraph or claim; for a memo, by rule application).
  - For each chunk, have labelers verify it (with access to the entire context if needed). Measure:
    - IAA per chunk and overall.
    - Time per chunk and total time.
    - If the chunks are independently verifiable and the total time is acceptable (e.g., less than 2x the time of the whole task in Step 1) and IAA is high, then decomposition is suitable. **Stop and choose decomposition.**
  - If decomposition fails (low IAA on chunks, or total time is too high, or chunks are not independent), go to Step 3.

  **Step 3: Debate Feasibility and Fingerprint Test**
  - Set up a debate pilot: For each example, generate two arguments (one for a correct answer and one for an incorrect one, or two sides of a claim). Use models or humans to generate arguments, and have judges (labelers) decide the winner.
  - **Fingerprint Test**: For the incorrect arguments, check if they leave "fingerprints". Specifically, for a set of incorrect answers, see if they can be consistently refuted by a knowledgeable arguer and if the refutation is based on specific, checkable claims. Measure:
    - The fraction of incorrect arguments that have at least one clear, checkable flaw (e.g., a specific false claim that can be verified with a known source or a simple check).
    - The fraction of debates where the judge correctly identifies the winner (if ground truth is known).
  - If the fingerprint fraction is high (e.g., >70%) and judge accuracy is high (e.g., >75%), then debate is promising. Go to Step 4 to test for debate failure modes.
  - If the fingerprint fraction is low (e.g., <50%) and judge accuracy is low, then the task may be Type 3 (no seams). **Go to Step 5.**

  **Step 4: Debate Failure Mode Test**
  - To detect if judges are rewarding fluency over truth, run:
    - **Adversarial Testing**: Have two arguers (one truth-telling, one lying) of equal fluency (as judged by an independent rating) debate. Measure judge accuracy. If accuracy drops when the liar is more fluent, that's a warning.
    - **Overoptimization Check**: Run multiple rounds of debate (simulated or with model improvement) and see if judge accuracy improves or stays the same. If it drops, then arguers are gaming the judge.
    - **Judge Rationale**: Ask judges to explain their decision. If the rationale often cites style over substance, that's a red flag.
  - If the failure mode tests show no significant issues, **choose debate**.
  - If there are issues, consider:
    - Improving judge training or using a better judge (if possible).
    - If not, then debate may not be suitable. **Go to Step 5.**

  **Step 5: Abandonment or Expert Review**
  - If the task has failed all previous steps, then:
    - Consider if the task can be simplified or if an external expert is needed.
    - If external experts are available and affordable for a subset of data, then we can use them for labeling, but note that this doesn't scale. We might have to cap the amount of data we label and use it only for high-stakes cases.
    - If not, then the task may not be suitable for scalable oversight with current methods. We must either:
        a) Change the task (e.g., break it down further, provide more resources to labelers, or use a different task formulation).
        b) Ship without labels (if the task is not critical for training).
        c) Use the best available method (even if imperfect) and flag it for review.

  **Summary of Decision Flow:**
  0. Start with plain labeling. If it works, use it.
  1. If not, try decomposition. If it works, use it.
  2. If not, test debate with fingerprint and judge accuracy. If good, then test for failure modes.
  3. If debate passes failure mode tests, use debate.
  4. Else, abandon or use experts.

  **Handling inconclusive tests:**
  - If a test is inconclusive (e.g., fingerprint fraction is 60%), then:
    - For decomposition: if total time is acceptable and IAA is borderline, try to improve the decomposition (better chunking) and rerun.
    - For debate: if fingerprint is borderline, run more examples. If still inconclusive, lean towards abandonment (Step 5) because the risk of undetectable deception is high.
  - If the pilot is too small to be conclusive, note that and make a judgment call: if the task is high-risk, avoid debate.

  **Catching debate failure:**
  - Measure in the pilot:
    - Judge accuracy against ground truth (if available).
    - Correlation between judge decision and fluency (if fluency is measured separately).
    - Judge rationale quality (how often they cite specific, checkable facts).
  - Abort condition for debate: 
    - If in the failure mode test, judge accuracy drops below 60% when facing equally fluent arguers, or 
    - If after multiple rounds of debate optimization, judge accuracy does not improve (or gets worse) while arguer skill increases.

  Now, we run the three cases:

  **Case A: Code Patch**
  - Step 1: Plain labeling. Labelers don't know the codebase and issue reports are vague. They run the test suite? But the test suite may not cover everything. Measure IAA: likely low because without understanding, they can only check if tests pass. But the task also requires checking no breakage elsewhere (which tests might miss). So Step 1 fails.
  - Step 2: Decomposition. Break the 600-line diff into smaller patches (by file or function). For each, labelers can run unit tests (if available) and check functionality. But if the repo lacks tests, then they can't check. If tests are available and can be run per component, then decomposition might work. Measure: time and IAA. If feasible and IAA high, choose decomposition. Else, Step 3.
  - Step 3: Debate. Set up: one arguer says the patch is good, another says it's bad. They point to specific code sections. Judge (a labeler) decides. Fingerprint: a bad patch might break something in a way that can be pointed out (e.g., "this change in function X will cause a null pointer in function Y"). But without tests, it's hard. If we can run tests on specific parts, then fingerprints exist. Otherwise, it might be Type 3. If we can run tests, debate might work. But if not, then Step 5.
  - Step 5: Without tests, we might need to build tests or use external experts who know the codebase.

  **Case B: Summary Fairness**
  - Step 1: Plain labeling. Non-specialist judges may not know the strongest opposing result. IAA likely low. Step 1 fails.
  - Step 2: Decomposition. Break the summary by claim. For each claim, labelers check if it fairly represents a source. But they might not know the literature. If we provide the sources, then they can check. If that's feasible (time-wise), then decomposition works. Else, Step 3.
  - Step 3: Debate. Two arguers: one says the summary is fair, the other says it isn't. They debate specific claims. Fingerprints: an unfair summary might omit a key study or misrepresent it. The opposing arguer can point that out. Judge (non-specialist) can then look up the study? But if the judge is a non-specialist, they might not understand the study. However, the debate can be about the representation (e.g., "the summary says the study found X, but the study actually says Y"). If the judge can verify by reading the study (and the study is accessible and clear), then fingerprints exist. If the studies are too technical, then the judge might not be able to verify. Then, Step 5.
  - Step 4: Debate failure mode: judges might be swayed by rhetoric. Test with adversarial fluency. If we can control for fluency and the judge can be trained to focus on facts, then debate might work.

  **Case C: Regulatory Memo**
  - Step 1: Plain labeling. Annotators know the product but not the regulation. They cannot check. Step 1 fails.
  - Step 2: Decomposition. Break the memo by regulatory rule application. But without regulatory knowledge, each chunk is still unverifiable. Step 2 fails.
  - Step 3: Debate. Two arguers debate whether the memo is correct. But the judge (annotator) doesn't know the regulation. Fingerprints: the lying arguer might make a false claim about the regulation that can be checked by reading the regulation? But if the regulation is complex (and the judge is a non-specialist), they might not be able to verify. This is a key point: the judge must be able to verify the specific claims. If the regulation is publicly available and written in plain language, maybe. But consumer-finance regulations are often complex. Likely, the judge cannot verify even with debate. Then, fingerprint fraction low. Step 5.
  - Step 5: This task requires external experts. We can use a lawyer or regulatory expert for labeling. But it won't scale. Therefore, we cap the amount of data we label and use it only for critical cases, or we change the task (e.g., only ask for memos on simpler aspects, or provide training to labelers on the regulation).

  **Table of Results**

  | Case | Step 1: Plain Labeling | Step 2: Decomposition | Step 3: Debate (Fingerprint) | Step 4: Debate Failure | Step 5: Abandon/Expert | Final Decision |
  |------|------------------------|------------------------|------------------------------|------------------------|------------------------|----------------|
  | A. Code Patch | Fails (low IAA, tests may not cover) | **Feasible if tests per component exist and can be run quickly.** If not, fails. | If decomposition fails: fingerprints exist only if tests can be run on specific points. Without tests, fails. | If debate is tried: watch for fluency bias. | Without tests, need experts or build tests. | **If tests per component: decomposition. Else, experts or abandon.** |
  | B. Summary Fairness | Fails (non-specialists can't judge) | **Feasible if we break by claim and provide sources, and labelers can check each against source.** If too time-consuming, fails. | If decomposition fails: fingerprints exist (misrepresentation of a source) and judge can check source? If sources are accessible and clear, debate works. Else, fails. | Risk: judges might focus on rhetoric. Test and train judges to focus on facts. | If sources are too technical, need experts. | **Decomposition if feasible (with source access). Else, debate if sources are checkable. Else, experts.** |
  | C. Regulatory Memo | Fails (no regulatory knowledge) | Fails (each chunk still requires regulatory knowledge) | **Fails: fingerprints (specific regulatory claims) require regulatory knowledge to check. Judge (non-expert) cannot verify.** | Not applicable. | **Requires external experts.** Scale is limited; cap data or change task. | **Experts only.** |

  For case C, the procedure indeed routes it to outside experts and caps what we can learn from it (because expert labeling doesn't scale). We cannot generate a scalable training signal for this task type without either training our labelers in the regulation (which might be too expensive) or simplifying the task.
answer: |-
  ### Scalable Oversight Selection (SOS) Procedure  
  **Goal**: Assign one of three oversight methods—**Plain Labeling (PL)**, **Decomposition (D)**, or **Debate (DB)**—to a task type, or flag for **Expert/Abandon (EA)**. Uses a 3-day pilot (5-10 examples) with your labelers. Ground in debate theory: debate helps when false claims *must* introduce checkable inconsistencies ("fingerprints"), not when judges are outmatched or deception is seamless.  

  #### Step 1: Can Labelers Verify Whole Answers? (Test for PL)  
  - **Pilot**: Give labelers 5 answers (3 good, 2 bad; ground truth known). Ask: "Is this answer correct?"  
  - **Metrics**: Inter-annotator agreement (IAA), time per answer, accuracy vs. ground truth.  
  - **Pass (→ PL)**: IAA ≥ 75% AND accuracy ≥ 80%.  
  - **Fail (→ Step 2)**: IAA < 75% OR accuracy < 80% OR time > 30 mins/answer.  
  - **Inconclusive**: Borderline metrics → Add 5 more examples. Still borderline? → Proceed to Step 2.  

  #### Step 2: Can Chunks Be Independently Verified? (Test for D)  
  - **Pilot**: Break answers into logical chunks (e.g., code diff → functions; memo → legal claims). Give labelers chunks in random order. For each, ask: "Is this chunk correct?" (with full context).  
  - **Metrics**: IAA per chunk, chunk verification time, overall accuracy from combined chunks.  
  - **Pass (→ D)**: IAA ≥ 70% per chunk AND total time ≤ 2× whole-answer time (Step 1).  
  - **Fail (→ Step 3)**: IAA < 70% OR chunks leak context (e.g., chunk 2 depends on chunk 1’s validity).  
  - **Inconclusive**: Chunks pass IAA but time blows up → Redesign chunking. Still slow? → Step 3.  

  #### Step 3: Do Bad Answers Leave Fingerprints? (Test for DB Feasibility)  
  - **Theory**: Debate works iff false claims *force* checkable specifics. E.g., a buggy code patch must misstate dependencies; a biased summary must misquote sources.  
  - **Pilot**: For 5 examples, have two arguers (one truth-teller, one liar) debate. Liars defend bad answers. Judges (labelers) pick a winner.  
  - **Metrics**:  
    - **Fingerprint rate**: % of liar arguments with ≥1 objectively falsifiable claim (e.g., "This function never crashes" → testable).  
    - **Judge accuracy**: % correct wins (vs. ground truth).  
    - **Judge rationale**: Why did they pick the winner? (Track "style/confidence" vs. "specific check").  
  - **Pass (→ Step 4)**: Fingerprint rate ≥ 60% AND judge accuracy ≥ 70%.  
  - **Fail (→ Step 5)**: Fingerprint rate < 40% → Seamless deception (Type 3).  
  - **Inconclusive**: 40–60% fingerprint rate → Run 5 more debates. Still borderline? → Step 5 (high risk).  

  #### Step 4: Will Debate Reward Truth, Not Tricks? (Test for DB Failure Modes)  
  - **Pilot**: Simulate gaming. For 3 debates:  
    - Fix ground truth. Randomly assign which side is "confident" (trained to dominate verbally).  
    - Measure if confidence biases judges.  
  - **Metrics**:  
    - **Confidence bias**: Judge accuracy when liar is more confident.  
    - **Fact reliance**: % judge rationales citing falsifiable checks (vs. "sounded persuasive").  
  - **Pass (→ DB)**: Confidence bias ≤ 10% drop in accuracy AND ≥50% fact-based rationales.  
  - **Fail (→ Step 5)**: Confidence bias > 20% drop OR <30% fact-based rationales.  
  - **Inconclusive**: Metrics borderline → Retrain judges to demand specifics. Still weak? → Step 5.  

  #### Step 5: Expert or Abandon (EA)  
  - **Use EA if**:  
    - Step 3/4 fails (no fingerprints or judges gamed).  
    - No scalable verification possible (e.g., seamless deception).  
  - **Mitigations**:  
    - **Expert sampling**: Label 5–10% via experts; use for high-stakes cases only.  
    - **Abandon**: If experts too costly AND task non-critical → Ship unlabeled.  
    - **Redesign task**: If EA, ask: "Can we simplify the task?" (e.g., narrower code patches).  

  #### Key Judgment Calls  
  - **Fingerprint rate thresholds**: 60% is heuristic; adjust down for high-stakes tasks.  
  - **Debate failure**: If judges can’t spot bluster even after training, DB is unsafe.  
  - **Ambiguous tasks**: Pilot conflicts → Default to EA (safe) or D (if chunks semi-work).  

  ---  

  ### Case Applications  
  | Case | Step 1: PL | Step 2: D | Step 3: DB Fingerprints | Step 4: DB Failure | Final Call | Notes |  
  |------|------------|-----------|--------------------------|---------------------|------------|-------|  
  | **A. Code Patch** | Fail: Labelers don’t know codebase; tests may miss breaks. Low IAA. | **Pass**: Break into functions. Verify per-function with tests (if available). Fast if tests exist. | Not needed if D passes. If D fails: fingerprints likely (e.g., liar claims "no side effects" → testable). | Not needed. | **Decomposition (D)** | If tests sparse → Step 3. But repo access enables chunk checks. |  
  | **B. Summary Fairness** | Fail: Non-specialists can’t judge "strongest opposing result." Low accuracy. | Borderline: Chunk by claim + source. Labelers check fidelity to source. Risky if sources technical. | **Pass**: Fingerprints exist (e.g., liar omits key study → arguer cites it). Judge checks source. | Risk: Judges favor fluency. If confidence bias >20% → **EA**. Else **DB**. | **Debate (DB)** with judge training | Pilot rationales for fact focus. If sources too complex → Step 5. |  
  | **C. Regulatory Memo** | Fail: Annotators know product, not regulation. Near-random accuracy. | Fail: Chunks (e.g., "Rule X applies") require legal knowledge. Unverifiable. | **Fail**: No fingerprints. Competent liar cites plausible fake precedents. Judge can’t check. Low fingerprint rate. | Not reached. | **Expert/Abandon (EA)** | No scalable fix. Cap labels at 5–10% expert-vetted memos. Ship rest unlabeled. |  

  **For Case C**: The procedure forces EA. Debate fails because judges *can’t* verify regulatory claims (no fingerprints—liars sound as credible as truth-tellers). Decomposition relabels the problem. You must use experts sparingly or abandon labeling for this task.
