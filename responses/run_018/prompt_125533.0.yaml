answer: |-
  ### Step-by-Step Evaluation Procedure Flowchart

  **Core Philosophical Distinction Maintained:**  
  Gate 1 (Authority-Based): Focuses on the patient's *standing* to issue the directive (capacity, voluntariness, legal legitimacy).  
  Gate 2 (Axiological-Coherence): Focuses on *narrative continuity* between the request and the patient's lifelong values (not the committee's values).  
  *Both gates must be passed independently.*  

  ---

  #### **Stage 1: Administrative Pre-Screen**  
  (a) *Question:* Does the petition packet contain all legally required elements (e.g., written request, diagnoses, prognosis, witness signatures)?  
  (b) *Sufficient Answer:* Complete documentation meeting jurisdictional standards.  
  (c) *Evidence:* Institutional checklist signed by submitting physician.  
  (d) *Stop-Point:* If incomplete, return to physician without review.  
  (e) *Value Judgment Flag:* None (purely administrative).  

  #### **Stage 2: Gate 1A – Current Capacity or Valid Advance Directive**  
  (a) *Question:* Is the patient *currently* capable of making this decision? If not, does a valid, unrevoked advance directive specify assisted dying under current clinical conditions?  
  (b) *Sufficient Answer:*  
    - For current capacity: Patient demonstrates understanding of condition, intervention, alternatives, and consequences.  
    - For advance directive: Directive is legally binding, executed while capable, and clinical triggers are objectively met.  
  (c) *Evidence:*  
    - Capacity: Two independent clinical assessments (attending + psychiatrist/neurologist).  
    - Advance directive: Document + attestation of validity by legal advisor.  
  (d) *Stop-Point:* If neither capacity nor valid directive exists, deny petition.  
  (e) *Value Judgment Flag:* None (fact-based; relies on objective evidence).  

  #### **Stage 3: Gate 1B – Voluntariness Assessment**  
  (a) *Question:* Was the request made free from coercion, undue influence, or external pressure?  
  (b) *Sufficient Answer:* No evidence of manipulation or subordination of the patient’s will.  
  (c) *Evidence:*  
    - Social worker’s report on family dynamics/financial pressures.  
    - Nurse’s notes on patient’s demeanor during requests.  
  (d) *Stop-Point:* If coercion is suspected, deny petition.  
  (e) *Value Judgment Flag:* None (reliant on documented behavioral evidence).  

  #### **Stage 4: Gate 1C – Standing Verification**  
  (a) *Question:* Does the patient have the *legal and ethical authority* to direct their death under jurisdictional statutes (e.g., is the condition eligible)?  
  (b) *Sufficient Answer:* Clinical condition meets legal criteria (e.g., terminal illness, unbearable suffering).  
  (c) *Evidence:* Attending physician’s certification of eligibility + legal advisor’s confirmation.  
  (d) *Stop-Point:* If condition is statutorily excluded, deny petition.  
  (e) *Value Judgment Flag:* None (legal binary).  

  #### **Stage 5: Gate 2A – Narrative Reconstruction**  
  (a) *Question:* What values, commitments, and identity-defining choices have structured the patient’s biographical narrative?  
  (b) *Sufficient Answer:* A consensus reconstruction of the patient’s core values from longitudinal evidence.  
  (c) *Evidence:*  
    - Advance directives, personal letters, past medical decisions.  
    - Testimony from family/friends on patient’s life philosophy (obtained by social worker).  
    - Religious/cultural affiliations, career choices, prior coping with adversity.  
  (d) *Stop-Point:* If insufficient evidence exists to reconstruct values, refer for external ethics consultation (stop committee review).  
  (e) *Value Judgment Flag:* **Vote required**. Committee must agree on a "value map" (e.g., "autonomy above all," "duty to family," "stoicism in suffering").  

  #### **Stage 6: Gate 2B – Axiological Coherence Test**  
  (a) *Question:* Is the assisted-dying request a *continuation* of the patient’s reconstructed values, not a rupture?  
  (b) *Sufficient Answer:* The request aligns with or extends lifelong principles (e.g., avoiding dependency, ending irremediable suffering consistent with prior choices).  
  (c) *Evidence:*  
    - Patient’s stated reasons for the request.  
    - Comparison with reconstructed values from Stage 5.  
  (d) *Stop-Point:* If the request repudiates core values, deny petition.  
  (e) *Value Judgment Flag:* **Vote required**. Committee assesses narrative continuity (e.g., "Does choosing death to avoid ventilator dependency align with their lifelong prioritization of bodily autonomy?").  

  #### **Stage 7: Final Recommendation**  
  - If both gates pass: Approve petition.  
  - If either gate fails: Deny with documented rationale.  
  - *Audit Trail:* Committee secretary documents votes, evidence citations, and reasoning for each gate.  

  ---

  ### Application to Petitions  

  #### **Case 1: ALS Patient with New Religious Ambivalence**  
  - **Stage 2:** Advance directive valid (executed while capable, clinical triggers met). *But* current ambivalence expressed while capable. **Stop:** Gate 1A fails. Directive invalidated by contemporaneous revocation via oral statement. **Denial.**  
  - **Gate 2 Not Reached.**  
  - *Why intuitive conflict?* Directive was clear, but authority gate prioritizes current capable expressions. Committee cannot override patient’s new stance.  

  #### **Case 2: Treatment-Resistant Depression**  
  - **Stage 2:** Current capacity confirmed (intact cognition per psych eval).  
  - **Stage 3:** Voluntariness confirmed (no coercion; family supports *patient’s* choice).  
  - **Stage 4:** Legal standing unclear (jurisdiction may exclude pure psychiatric cases). *Assume legal.*  
  - **Stage 5 (Vote):** Narrative reconstruction: Patient valued "self-determination" (career autonomy) but also "family bonds" (close relationships until depression).  
  - **Stage 6 (Vote):** **Axiological incoherence.** Request tracks depressive symptoms, not lifelong values. Death repudiates prior commitment to familial bonds and resilience. **Denial.**  
  - *Why counter-intuitive?* Suffering is severe, but gate 2 prioritizes narrative continuity over symptom severity. Committee cannot approve a request deemed value-disruptive.  

  #### **Case 3: Constructed Case – Terminal Agitator**  
  - *Scenario:* A 58-year-old with metastatic cancer and intractable pain. Lifelong values: "Control and dignity." Refuses palliative sedation ("I’ll die awake"). Requests assisted dying. Two weeks later, delirium renders him aggressive and incapable. Family petitions using advance directive.  
  - **Stage 2:** Advance directive valid (clinical triggers met, executed while capable).  
  - **Stage 3:** Voluntariness confirmed (directive executed during lucid interval).  
  - **Stage 4:** Legal standing confirmed.  
  - **Stage 5 (Vote):** Narrative: "Control above all; aversion to helplessness."  
  - **Stage 6 (Vote):** **Axiological coherence.** Directive continues his value of control; delirium-induced aggression irrelevant to narrative. **Approval.**  
  - *Conflict with Intuition:* Approving death for an *actively aggressive* patient *feels* morally jarring. But gate 2 focuses on pre-illness values, not current behavior. Committee must approve despite discomfort.  

  ---

  ### What the Procedure Cannot Do  
  1. **Resolve Value Pluralism:** If committee members disagree on narrative reconstruction (Stage 5) due to ambiguous evidence, the vote may be arbitrary. External ethnographers or biographers needed.  
  2. **Adjudicate Novel Legal Questions:** Cases challenging jurisdictional boundaries (e.g., "Is treatment-resistant depression a terminal illness?") must be referred to courts.  
  3. **Override Legislative Gaps:** If statutes lack clarity on "unbearable suffering" or "terminal illness," the committee must defer to legislators.  
  4. **Misfires:**  
     - **False Narratives:** May ignore *recent* value changes (e.g., religious conversion pre-incapacity) if evidence is sparse.  
     - **Over-Rigidity:** Patients with fragmented identities (e.g., trauma survivors) may be denied for "incoherence."  
     - **Counter-Intuitive Outputs:** As in Case 3, the procedure may approve technically valid but distressing requests.  
  5. **Cannot Assess Suffering Holistically:** Gates do not evaluate "proportionality" of suffering or quality of life—only alignment with patient’s narrative.  

  **Final Audit Safeguard:** All denials require written justification citing failed gate(s) and evidence. Approvals include narrative coherence rationale to preempt accusations of autonomy fetishism.
