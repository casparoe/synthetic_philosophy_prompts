     - Setup for round 1: 5 minutes (instructor flips coin, shows Group A, distributes cards)
     - Group discussion: 10 minutes
     - Resolution and scoring: 5 minutes
     - Round 2: 5 setup, 10 discussion, 5 resolution -> 20
     - Round 3: 5 setup, 10 discussion, 5 resolution -> 20
     - Debrief: 20 minutes

   Total: 10+5+10+5+5+10+5+5+10+5+20 = 90 minutes.

   But we might run only two rounds? Or make the discussions shorter.

   Alternatively, we can do two rounds and have a longer debrief.

   Let's do two rounds: one same-report and one different-report.

   Round 1: Real object is red ball (same-report).
   Round 2: Real object is green cube (different-report).

   Then in the debrief, we can compare the two.

   Rules for students:

     - Group A: You are the direct perceivers. You will be shown the object in the box. Then you will receive a card that accurately describes what you saw. You know this is true because you saw it.

     - Group B: You are report receivers. You receive a card that is a printout from a live feed of the hidden camera inside the box. However, there is a known threat: a confederate might have replaced the feed with a feed of a fake object. You cannot rule out that possibility. So the card might be showing the real object or the fake object.

     - Skeptical auditor: You have no direct information. Your role is to challenge the group's assumptions and force them to justify their decision. You can ask questions like: "Group B, how do you know your report is not from the fake object?" or "Group A, are you sure you saw the real object?"

     - The group must reach a consensus on:
           1. Open the box or not?
           2. If not, what do they bet: red ball or green cube?

     - After they decide, the instructor will either open the box (if they chose to open) or not (if they chose not to open). If they didn't open, the instructor reveals the object and they see if their bet was correct.

     - Points are awarded as above.

  Debrief:

     - In round 1 (same-report): 
          - If they did not open and bet on red ball, they got 5 points. But ask: was everyone equally confident? Group A was very confident, Group B was not. The group might have ignored Group B's uncertainty because the reports matched. That's false consensus based on sameness of report.
          - If they opened, they got only 1 point. Why did they open? Because Group B's uncertainty was taken seriously. That's good epistemically, but they lost points. This shows that even when reports are the same, the underlying mental states are different.

     - In round 2 (different-report):
          - They likely opened the box. If they didn't, and bet on green cube, they got 5 points. But that was risky because Group B had a report that said red ball.

     - Map to disjunctivism:
          - Metaphysical disjunctivism: the mental state of Group A is of a different kind than that of Group B, even in the same-report case. Group A's state is factive and involves direct acquaintance, while Group B's state is not factive and is based on a representation that could be false.
          - Epistemic disjunctivism: Group A has a justification that is both factive and reflectively accessible (they can cite that they saw it), while Group B has a non-factive justification.

     - What the activity can't reproduce: 
          - The transparency of experience: in perception, we are not aware of representations but of the object itself. In our setup, Group B is aware of a card, which is a representation. So we have to verbally explain that in the perceptual case, the experience is transparent.
          - The fact that in perception, the experience is factive: if you have a perceptual experience as of a red ball, then there is a red ball. In our setup, Group A's experience is factive, but Group B's report is not. However, in the same-report case, it happened to be true.

     - We have to emphasize that disjunctivism is not just about the external world being different, but about the mental state being different even in cases where the same-report happens to be true.

     - Predictable issue: In round 1 (same-report), the group might not open and win, and then they don't see the problem. To handle this, the instructor can ask Group B: "Would you have been equally confident if Group A hadn't been there? Why or why not?" and then point out that in a scenario where the real object was green cube, Group B would have had the same report but it would have been false. So their mental state is not the same as Group A's.

  This should make them feel why disjunctivism is more than stubbornness against the argument from illusion: because even in the good case, the mental state is different in kind from a hallucinatory or deceptive case, and this difference matters for knowledge and action.

