  ### In-Class Game: The Adversarial Hallucination Challenge  
  **Goal**: Illustrate disjunctivism by showing that subjective sameness (identical reports) doesn’t imply identical mental states. Students confront how causal history affects justification, even when evidence *seems* the same.  

  ---

  ### **Game Setup**  
  **Participants**: 12 grad students.  
  **Roles**:  
  - **Direct Perceivers (5 students)**: Peek at the real object in a hidden box.  
  - **Report Receivers (6 students)**: Receive a printed card claiming to be a "live feed" of the object, but it’s pre-printed by a confederate describing a fake.  
  - **Skeptical Auditor (1 student)**: Challenges consensus, asks probing questions (e.g., "How do you know your evidence isn’t deceptive?").  
  **Objects**:  
  - One box with a hidden object (e.g., a **red apple**).  
  - A matching fake object (e.g., an identical **red apple**) planted by a confederate (instructor).  
  **Materials**:  
  - Printed cards for Report Receivers: *"Live Feed Report: The object is a [description]. - Monitoring System"* (e.g., "Live Feed Report: The object is a red apple.").  
  - Cards for Direct Perceivers: *"Direct Observation: The object is a [description]."* (Matches what they saw).  

  ---

  ### **Rules**  
  1. **Preparation**:  
     - The instructor places a real object (e.g., red apple) in a box, hidden from view.  
     - A confederate (e.g., TA) "plants" a fake object (identical red apple) elsewhere.  
  2. **Evidence Distribution**:  
     - **Direct Perceivers**: Briefly peek inside the box. Each receives a card accurately describing the object (e.g., "Direct Observation: The object is a red apple.").  
     - **Report Receivers**: Receive a card with the *same wording* as Direct Perceivers (e.g., "Live Feed Report: The object is a red apple."). They are told:  
       > *"This is a real-time feed from the box. However, a confederate may have hacked the system to show a fake object. You cannot rule this out."*  
     - **Skeptical Auditor**: Receives no evidence; tasked with interrogating the group.  
  3. **Group Task**:  
     - Decide **as a group** whether to:  
       - **OPEN THE BOX** (costly but certain).  
       - **BET WITHOUT OPENING** (high reward if correct).  
     - Time limit: 10 minutes for debate. The Auditor challenges assumptions.  
  4. **Payoff Scheme**:  
     | **Action**               | **Correct Outcome** | **Incorrect Outcome** |  
     |--------------------------|---------------------|----------------------|  
     | **OPEN THE BOX**         | +1 point            | +1 point (object is revealed, so bet is always correct) |  
     | **BET WITHOUT OPENING** | +5 points           | 0 points             |  
     - **Catch**: Points are awarded *only* if the group reaches consensus.  
     - **Penalty for False Consensus**: If the group bets without opening *because* "we all have the same report," but fails to acknowledge the difference in mental states, the Auditor can deduct 2 points (even if correct) for poor epistemology.  

  ---

  ### **Timeline (90-Minute Session)**  
  1. **Intro & Rules (10 min)**: Explain disjunctivism, game roles, payoff, and the core dilemma.  
  2. **Round 1 (25 min)**:  
     - Setup (5 min): Distribute evidence (Direct Perceivers peek; Report Receivers get cards).  
     - Group Debate (10 min): Students argue OPEN vs. BET. Auditor intervenes (e.g., "Report Receivers: Could your evidence be from the fake?").  
     - Resolution (5 min): Group declares choice. Reveal object. Award points.  
  3. **Round 2 (25 min)**:  
     - Repeat with a *different object* (e.g., replace apple with a book) to vary outcomes.  
  4. **Debrief (30 min)**: Structured discussion (details below).  

  ---

  ### **Debrief: Mapping to Disjunctivism**  
  1. **Predictable Breakdown (First Run)**:  
     - **What Goes Wrong**:  
       - Report Receivers treat their card as "perceptual evidence" because it matches Direct Perceivers.  
       - Group opts to **BET WITHOUT OPENING** to chase +5 points, citing "we all agree!" (false consensus).  
       - Auditor penalizes them for ignoring causal history (even if bet is correct).  
     - **How to Handle**:  
       - Highlight moments when "same report" suppressed scrutiny. Ask: *"Did Report Receivers have the same justification as Direct Perceivers, even with identical words?"*  

  2. **Mapping to Disjunctivism**:  
     - **Metaphysical Disjunctivism**:  
       - Direct Perceivers: Veridical perception (mental state is *factive*: success-dependent).  
       - Report Receivers: Hallucinatory-like state (same report, but *non-factive*; could be false if fake mismatched).  
       - **Game Link**: Identical reports masked distinct mental kinds. Students felt pressure to act "as if" states were the same.  
     - **Epistemic Disjunctivism**:  
       - Direct Perceivers: Justification is *reflective* ("I saw it") and *infallible* in the good case.  
       - Report Receivers: Justification is *inferential* ("The card says...") and *fallible*.  
       - **Game Link**: Auditor exposed this by asking, "What if the confederate fooled the feed?"  

  3. **Limitation of the Activity**:  
     - **Unreproducible Feature**: **Transparency of Experience**.  
       - In perception, experience is "transparent" (we attend to objects, not mental states). The game uses *propositional reports* (cards), which reify evidence into symbols.  
       - **Verbal Bridge**: Explain:  
         > *"Disjunctivism claims that in perception, you’re directly aware of the apple—not a ‘card’ in your mind. Hallucinations feel the same, but lack this transparency. The game’s ‘cards’ are stand-ins for this opacity."*  

  4. **Key Insight**:  
     - Disjunctivism isn’t "stubbornness" against illusion; it’s about *mental taxonomy*. The game forces a choice: act on surface-sameness or probe causal history. The penalty for false consensus makes epistemic risk tangible.  

  ---

  ### **Instructor Notes**  
  - **Scaling**: For large groups, split into two teams (6 each) with duplicate setups.  
  - **Twist**: In Round 2, make the fake mismatched (e.g., card says "apple" but fake is a banana) to create conflicting reports. This sharpens the contrast between perception and deception.  
  - **Honesty**: Emphasize the game simplifies the "feel" of disjunctivism but can’t replicate lived experience. Use debrief to connect dots to readings (e.g., Snowdon, McDowell).  

  This setup is low-tech, focuses on coordination pressure, and makes disjunctivism’s stakes visceral. Students leave seeing that "same evidence" ≠ "same mental state."
