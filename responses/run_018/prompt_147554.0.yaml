  **[Clinking glass gently] Friends, colleagues, everyone who loves Lena Voss...**

  Thirty-five years! Thirty-five years of Lena asking questions that make your head spin and your heart expand. Questions like: Who *is* this "me" having the experience? Where does this feeling of being a solid, unchanging *thing* actually come from?

  Lena didn't just ask these questions in dusty seminar rooms. She chased them through ancient texts, wrestling with Abhidharma philosophers who saw the person as *prajnapti* – a useful label, a convention. And she chased them through cutting-edge labs, exploring how our brains, moment by moment, predict and build our world, constructing a sense of self like a constantly updating story. The self, she showed us, isn't a fixed statue on a plinth; it's more like a river – always flowing, always changing, yet somehow... continuous.

  And here’s the beautiful, slightly tricky, part when we honor Lena tonight. Because if you listen *only* to the ultimate truth she explored – the profound insight that there’s no permanent, singular owner behind the thoughts, feelings, and birthday reminders... well, you might think, "Okay, great, so the ‘Lena’ we’re toasting? Basically an illusion! Cheers?" [*Gentle laughter*] And you wouldn’t be entirely wrong, in the strictest sense Lena herself would appreciate.

  But we all know that’s not the whole story, is it? It certainly isn't *Lena’s* whole story. Because the Lena *we* know? The one who remembers your nephew's graduation date ten years later? The one whose loyalty runs so deep a grudge can achieve tenure? The one whose moral compass has guided students and colleagues for decades? *That* Lena is absolutely real. Fiercely real. Consistently real.

  This is where Lena’s work, and her life, shine so brilliantly. She taught us about the magic of convention – the profound power of the *story*. That river of self? It has currents. It has direction. The choices made upstream – the kindness offered, the insight shared, the stubborn stand taken – they shape the flow downstream. That’s the continuity, the karma, without needing a little captain steering the boat from birth to retirement. The consistency we see in Lena, her unwavering presence and character, isn’t proof of a hidden soul. It’s the magnificent, intricate patterning of her life-stream – a story told with such coherence, such ethical force, that it feels utterly solid and true *right here where we live*.

  So tonight, we celebrate both truths. We honor the brilliant scholar who peered into the deepest nature of mind and self, showing us the radical emptiness and interdependence beneath it all. And we *absolutely* celebrate the conventional, utterly magnificent, Lena Voss: the friend, the colleague, the mentor, the fierce intellect, the rememberer-of-birthdays, the holder-of-justified-grudges. Her story has been, and continues to be, one of profound inquiry, deep connection, and unwavering integrity. It’s a story that has touched all of us in this room, shaping our own streams in countless ways.

  So, let’s raise our glasses to Dr. Lena Voss! To the brilliant exploration of the ultimate… and to the glorious, conventional, deeply real human being whose extraordinary story we’ve all been privileged to share. Thank you, Lena, for everything. Cheers!

  **[Lift glass high]**
