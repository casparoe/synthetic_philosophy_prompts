  ## Memorandum: Appeals Panel Recommendation re: Editor Suspension & Pre-Submission Discord Practice

  **To:** Journal Association Board  
  **From:** Appeals Panel  
  **Date:** October 26, 2023  
  **Subject:** Recommendation Regarding Suspension of Senior Editor (Dr. [Editor's Name]) and the "Measurement-Theory Circle" Pre-Submission Discord Practice  

  ### 1. Issue Summary
  Senior Editor Dr. [Editor's Name] was suspended for operating a private Discord server where reviewers routinely discuss draft manuscripts *before* formal journal submission. This practice, while reportedly standard and functional within the specialized Measurement-Theory subfield, explicitly violates Association Bylaws §4.1 mandating blind review processes initiated *only* post-submission. The defense contends this Discord functions as a **David Lewis-style convention**: an emergent, self-sustaining equilibrium solving critical coordination problems (reviewer availability, pre-screening suitability) that the formal system struggles with. Punishing it, they argue, destroys a beneficial equilibrium without offering a better solution. The Board seeks a recommendation: uphold suspension, overturn it, or formalize the practice with conditions.

  ### 2. Analysis of the "Convention" Argument (Taken Seriously)
  The Appeals Panel acknowledges the force of the Lewisian convention argument:

  *   **Solved Coordination Problem:** The Discord demonstrably addresses a genuine bottleneck – efficiently matching specialized reviewers with nascent work in a niche field, overcoming formal system delays and mismatches.
  *   **Mutual Expectations & Equilibrium:** Within the Measurement-Theory circle, participation and reliance on this pre-review are reportedly near-universal and expected. It functions as a stable, self-policing norm.
  *   **Functional Efficiency:** Proponents report higher-quality initial submissions, faster formal review times, and better reviewer alignment – outcomes aligning with the journal's core goals.
  *   **Punishment Destabilizes:** Simply suspending the editor and banning the practice ignores the underlying coordination failure it solved. This risks reverting to a *worse* equilibrium (delays, mismatched reviews, lower engagement) without providing an alternative, harming the subfield the journal serves.

  **This argument compels us to move beyond simple rulebook citation.** The practice emerged for rational reasons and delivers perceived benefits within its specific context.

  ### 3. Acknowledging the Strongest Counterpoint: The Risk of Killing Spontaneity
  The most compelling argument *against* formalization is that **codifying this organic practice risks destroying the very spontaneity, trust, and informality that made it effective.** 

  *   **Organic Trust vs. Bureaucracy:** The Discord's success likely hinges on its informal, community-driven nature among a close-knit group. Imposing rigid rules, formal oversight, or mandatory reporting could stifle the candid, rapid exchanges that provided value, replacing trust with procedure.
  *   **Equilibrium Fragility:** Lewisian conventions are delicate. Adding formal constraints (e.g., mandated recording, strict moderation, expanded participation) could alter incentives and expectations sufficiently to collapse the beneficial equilibrium, leaving neither the old system nor the functional convention.
  *   **"Over-Correction" Risk:** Attempting to mitigate all potential biases or confidentiality risks through codification might create a process so cumbersome it negates the efficiency gains, essentially creating a worse version of the formal system.

  This risk is substantial and cannot be dismissed. Formalization must be approached cautiously to preserve the core functional elements.

  ### 4. Recommendation: Formalize with Light-Touch Conditions & Pilot Program (Overturn Suspension Conditionally)

  **The Panel recommends OVERTURNING the suspension of Dr. [Editor's Name], contingent upon immediate collaboration to FORMALIZE the pre-submission discussion practice under strictly defined, light-touch conditions, initiated via a 3-month pilot program limited to the Measurement-Theory subfield.**

  **Rationale:** Upholding the suspension ignores the functional reality of the convention and punishes solving a real problem. Outright overturning without conditions condones bypassing core peer review principles (anonymity initiation, editorial control). Formalization, *if done minimally and collaboratively*, is the only path that: a) acknowledges the convention's utility, b) attempts to preserve its functional core, c) brings it under the Association's ethical umbrella, and d) mitigates the most egregious risks to blind review ideals. The pilot allows us to test whether formalization can work without killing spontaneity.

  **Core Conditions for Formalization (Pilot Phase):**

  1.  **Opt-In & Transparency:** Authors must explicitly opt-in *for each draft*. A standard disclaimer must outline the nature of the discussion (non-binding, pre-screening) and its relationship to the formal blind review. Participation cannot be a prerequisite for submission.
  2.  **Strictly Pre-Submission & Advisory Only:** Discussions must conclude *before* formal submission. Outputs (e.g., summary notes) cannot be shared with the formal handling editor or reviewers. Their sole purpose is to help authors *prepare* a submission.
  3.  **Limited Scope & Membership:** Participation restricted to verified members of the Measurement-Theory subfield. The server's existence and purpose must be formally acknowledged by the Association Editor-in-Chief overseeing that subfield.
  4.  **Anonymity Preservation (Core Principle):** While pre-submission anonymity is inherently compromised in this *pre*-review space, authors retain the right to participate anonymously or pseudonymously *on the Discord*. Reviewers choosing to participate do so understanding they may encounter identifiable drafts later in formal review, but formal review assignments must still be made *as if* the Discord discussion didn't occur (e.g., reviewers from the Discord can be assigned only if conflict checks are clear *independent* of Discord knowledge).
  5.  **"Light-Touch" Moderation:** A senior editor (e.g., Dr. [Editor's Name]) or designated subfield representative moderates primarily for professionalism and adherence to scope (pre-submission advice), *not* for controlling viewpoints. Focus is on maintaining a constructive environment, not bureaucratic oversight.
  6.  **No Formal Record Mandate:** To preserve spontaneity, *no* requirement for detailed transcripts or formal reports to the journal. Moderators ensure discussions remain advisory and within bounds.

  ### 5. Timeline & Implementation

  1.  **Immediate (Within 1 Week):** 
      *   Overturn Dr. [Editor's Name]'s suspension.
      *   Association Chair, Editor-in-Chief (Measurement-Theory), and Dr. [Editor's Name] draft formal Pilot Program Guidelines based on the Core Conditions above.
      *   Guidelines presented to the Board for *provisional* approval.
  2.  **Week 2:** 
      *   Guidelines finalized and communicated to the Measurement-Theory subfield editorial board and frequent reviewers/authors.
      *   Discord server rules updated to reflect Guidelines. Opt-in mechanism established.
  3.  **Pilot Program Commencement:** **Start Date: [Date ~2 weeks from now]**. Duration: **3 Months**.
  4.  **Pilot Assessment (Month 3):**
      *   Survey participants (authors, reviewers, moderators) on: Perceived value, efficiency gains, impact on spontaneity/candor, concerns about bias/confidentiality, usability of guidelines.
      *   Moderator (Dr. [Editor's Name]) submits brief report on moderation load, adherence, notable issues.
      *   Editorial team reports any observed impact on formal submission quality/review times for Measurement-Theory papers.
  5.  **Decision Point (Month 4):** Appeals Panel (or designated Board committee) reviews Pilot data. Recommends to the full Board:
      *   **Permanent Formalization** (with possible minor guideline tweaks).
      *   **Discontinuation** of the formalized practice (reverting to strict adherence to Bylaws §4.1).
      *   **Pilot Extension** (if more data needed, max 2 additional months).
  6.  **Board Final Decision:** By **Month 5 (Six Months from Now)**.

  ### 6. Conclusion
  The Measurement-Theory Discord represents a genuine, functional convention solving a real coordination problem. Punishing its facilitator without addressing the underlying issue is counterproductive. Outright banning ignores its value. However, its current form violates fundamental principles of our review process. 

  Our recommendation seeks a pragmatic middle path: **overturn the suspension and formally pilot a minimally regulated version of the practice.** This acknowledges the Lewisian equilibrium while bringing it under ethical oversight designed to preserve its spontaneity and core function. The pilot is crucial to test whether formalization can work without destroying the very dynamism that made the convention successful. We must be prepared to discontinue the pilot if it demonstrably fails or creates unacceptable risks, but the potential benefits for this subfield warrant a serious, structured attempt at integration.
