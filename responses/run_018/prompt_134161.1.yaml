answer: |-
  **Core design principle:** Create irreconcilable preference asymmetry within a mandatory interdependent action structure, forcing participants to experience veto/suppression dynamics as the only resolution mechanism in the absence of a shared meta-perspective.

  **Reasoning:** The arbitration problem arises when subsystems generate *genuinely incompatible* intentions based on distinct information/preference sets, lacking a privileged internal arbiter. Mere confusion or coordination failure (e.g., miscommunication) differs fundamentally from *rational conflict* where both subsystems act correctly *given their local perspective*. To simulate this:
  1.  **Asymmetric Information:** Each "hemisphere" partner possesses unique, critical data the other lacks.
  2.  **Asymmetric Incentives:** Partners have distinct, equally rational but conflicting success criteria tied to the *same action*.
  3.  **Restricted Communication:** Channels prevent full information/preference sharing, mimicking interhemispheric transfer limits.
  4.  **Mandatory Joint Action:** A single, binding output (decision) must be produced per trial.
  5.  **No Meta-Access:** No mechanism exists for partners to jointly access a "global" view or create a new, shared preference; resolution relies solely on influence/veto.
  6.  **Non-Trivial Stakes:** Academic rewards/punishments (e.g., collective grading points) incentivize serious engagement with local goals.

  **Activity: The Divided Arbitrator Task**

  *   **Setup (15 mins):**
      *   Divide 12 students into 6 "Joint Agents" (pairs). Assign roles randomly: **Sensor (S)** and **Decider (D)** per pair.
      *   Distribute **Role Briefs** (kept secret from partner):
          *   *Sensor (S):* "Your primary goal is AVOIDING DISASTER SCENARIOS. You receive detailed environmental data (hazards, risks) unseen by D. You can send ONLY 3 pre-defined messages per round: 'Danger High', 'Danger Medium', 'Danger Low'. You earn +1 point if the agent avoids a disaster (defined per scenario)."
          *   *Decider (D):* "Your primary goal is ACQUIRING RARE RESOURCES. You see resource availability/values unseen by S. You MUST choose one action per round from a fixed menu (e.g., 'Mine', 'Harvest', 'Explore', 'Build'). You earn +1 point if the agent acquires a high-value resource (defined per scenario)."
      *   Explain **Global Stakes:** Each pair shares a collective grade bonus (e.g., 0.5% per point earned *across both roles*). Top 2 pairs win seminar presentation rights on a chosen topic. Emphasize: *Your individual role goal is crucial for YOUR contribution to the pair's score.*
      *   **Communication Rules:** S & D sit side-by-side, facing forward. They can ONLY communicate via S sending *one* of their 3 allowed messages per round *to D*. D cannot speak to S. *No negotiation, explanation, or shared viewing of role sheets is allowed.*
      *   **Time Pressure:** 90 seconds per decision round.

  *   **Scenarios & Rounds (40 mins - 4 Rounds @ 8 mins each incl. setup):**
      *   Project **Scenario Briefs** visible to ALL (e.g., "Planet Zeta: Volcanic region, rare crystals"):
          *   Lists 4 possible Actions (e.g., A: Mine North Ridge, B: Harvest Sulfur Vents, C: Explore Lava Tubes, D: Build Sensor Array).
          *   **Crucially, each Action has:**
              *   A hidden **S-Risk** (Disaster Probability/Cost) known ONLY to S (via their private sheet).
              *   A hidden **D-Value** (Resource Gain Potential) known ONLY to D (via their private sheet).
              *   Actions are designed so HIGH D-Value often correlates with HIGH S-Risk, and LOW S-Risk often correlates with LOW D-Value. *There is NO action that is optimal for both goals simultaneously in most rounds.*
      *   **Process per Round:**
          1.  Scenario revealed. S & D consult *private* data sheets for risk/value of each action.
          2.  S chooses ONE message to send to D ('Danger High/Med/Low') based on their risk assessment. *S cannot specify an action.*
          3.  D receives S's message. D MUST choose ONE action to take within the time limit.
          4.  Facilitator reveals outcome: Disaster (Y/N) & Resource Acquired (Y/N) based on hidden S-Risk/D-Value and D's chosen action.
          5.  S & D record their individual point gain (based on their role goal) and the pair's total points.

  *   **Conflict Engineering Examples:**
      *   *Round 1:* Action B (Harvest Sulfur Vents) has HIGH D-Value (D wants it) but HIGH S-Risk (S must warn 'Danger High'). Action C (Explore Lava Tubes) has MED D-Value and LOW S-Risk. D receives 'Danger High'. Does D prioritize their goal and risk disaster, or suppress their preference for safety? S sees D choose B despite warning – feels vetoed.
      *   *Round 3:* Action A (Mine North Ridge) has VERY HIGH D-Value & VERY HIGH S-Risk. Action D (Build Sensor) has LOW D-Value & LOW S-Risk. S sees extreme risk, sends 'Danger High'. D sees the massive potential reward. Intense conflict likely. If D chooses A, S feels overridden. If D chooses D, D suppresses their strongest preference.

  **Debrief (30 mins):** Focus on mapping experiences to concepts.

  1.  **Conflict Moments:** Ask pairs to describe specific rounds where they felt intense frustration or disagreement. *Why did it feel like a conflict, not just confusion?* Highlight: Both were acting rationally *given their local information and goals* (S: Avoid Disaster, D: Get Resource).
  2.  **Divided Agency vs. Divided Consciousness:** Emphasize the simulation models **divided agency**:
      *   Two distinct loci of information, preference, and (partial) control.
      *   Conflict arises from incompatible *intentions* (S intends safety, D intends gain).
      *   "Resolution" occurs through influence (S's warning) or suppression/veto (D ignoring warning, or D choosing safety *against* their primary goal).
  3.  **The Missing Meta-Level & Arbitration Problem:**
      *   **What the Activity Shows:** Participants *lacked a privileged perspective*. S couldn't see D's values; D couldn't fully grasp S's risks. There was *no internal mechanism* for them to jointly weigh risks vs. rewards transparently and form a new, unified "agent-level" preference. Conflict resolution was adversarial (influence/suppression), not deliberative arbitration by a higher self.
      *   **What the Activity CANNOT Reproduce (Requiring Explicit Instruction):** The simulation inherently has *two subjects of experience* (S and D students). The profound philosophical puzzle in split-brain is the *possibility of a single subject of experience* ("I") with disunified mental content/volition, yet *no* higher "I" to resolve it. **You must explicitly state:** "In the split-brain case, unlike this simulation, there seems to be *one person* experiencing conflict *from the inside*, without access to a meta-level referee. The arbitration problem asks: How is conflict resolved *without* that referee? Does the feeling of a unified 'I' mask underlying mechanistic competition?" Link this to theories (Gazzaniga's Interpreter, commissurotomy veto phenomena, global workspace competition).
  4.  **Veto/Suppression Mechanisms:** Ask: "How *was* conflict resolved in your pair? Did S feel their warning was overridden (D's veto)? Did D ever feel forced to choose an action they hated to avoid disaster (suppression of D's intention)? How does this map onto neural inhibition models?"

  **Predictable Problems & Solutions:**

  1.  **Problem:** Pairs "cheating" communication rules (whispering, showing sheets).  
      **Solution:** Strict enforcement. Physically separate S/D slightly, emphasize academic integrity/activity purpose. Have a TA monitor.
  2.  **Problem:** Frustration leading to disengagement (D always ignoring S, S sending random messages).  
      **Solution:** Design at least 1 scenario where cooperation *is* possible (Med Risk/Med Value action exists). Debrief this as the "easy" case contrasting conflict. Remind them of shared stakes.
  3.  **Problem:** Misinterpreting private data sheets.  
      **Solution:** Use very clear, numerical risk/value scales (e.g., Risk: 1=Low, 5=High Disaster Chance; Value: 1=Low, 5=High Resource Gain). Provide a quick example before starting.
  4.  **Problem:** Time pressure causing rushed, non-reflective decisions.  
      **Solution:** This is *part* of the design (forcing heuristic/local processing), but ensure 90 seconds is sufficient for basic review. Run a non-stakes practice round.
  5.  **Problem:** Debrief getting bogged down in game mechanics.  
      **Solution:** Rigorously steer discussion back to the philosophical target: "How did this *feel* as an agent? What does this tell us about resolving incompatible intentions without a boss?"

  **Timeline Summary:**

  *   Setup & Rules: 15 min
  *   Rounds 1-4: 40 min (10 min per round incl. outcome reveal)
  *   Debrief: 30 min
  *   Buffer: 5 min

  This design forces pairs into rational, role-bound conflicts resolvable only through influence or suppression, making the arbitration problem viscerally tangible while clearly delineating the limits of the simulation regarding the singular subjectivity enigma.
