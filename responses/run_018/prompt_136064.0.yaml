  First, I need to recall Weil's main arguments against political parties. She thought parties create artificial passions and suppress local, authentic deliberation. The two mechanisms here are whipping (enforcing party votes) and pre-selection (party-controlled candidate nomination). I should examine which of these Weil would target more. 

