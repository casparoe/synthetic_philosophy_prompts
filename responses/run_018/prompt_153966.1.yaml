answer: |-
  Let me walk through this step by step, since you're hitting on a genuinely subtle tension in decision theory that most introductory discussions gloss over. Your friend's position—that honoring sunk costs is always irrational because rational agents are purely forward-looking—represents the orthodox view found in textbooks from economics to behavioral psychology. And in the vast majority of real-world cases (buying more movie tickets just because you already suffered through half of a bad film, continuing a failing project because you've already spent resources), that orthodoxy holds: past investments *shouldn't* causally influence present choices when those costs are unrecoverable. My baseline credence here is high—let's say **0.85**—that standard forward-looking decision theory correctly excludes sunk costs in ordinary, isolated decisions. The causal decision-theoretic framework is robust for one-off choices.

  But your niche encounter with diachronic commitment devices points to a deeper layer. The argument, as I understand it from sources like McClennen or Gauthier (or more obliquely in Parfit), suggests that in *repeated* or *extended* projects, honoring a sunk cost might function as a precommitment strategy. If abandoning a plan *now* signals to your future self that you're unreliable, thereby increasing the risk of future defection from valuable long-term endeavors (say, finishing a PhD, maintaining a fitness regimen, or even staying in a marriage), then "throwing good money after bad" could paradoxically be instrumentally rational. It’s not about recovering the past loss; it’s about maintaining the credibility of your own plans across time. This is where my confidence in the orthodox view drops. I’d put the probability that commitment-device arguments **fail** (due to smuggling in evidential reasoning or conflating causal/normative structures) at only **0.40**. Why so low? Because models of "sophisticated" choice in dynamic inconsistency (like hyperbolic discounting) show that binding future selves *works* when you lack direct control over them. The risk is real: if abandoning a commitment *today* erodes your future self-trust, it might be a causal lever. But I’m uneasy here—this might covertly rely on an evidential interpretation (abandoning a plan *indicates* you’re the type who defects) rather than pure causal control.

  The third piece—whether personal identity is too fragmented for past plans to bind us—is philosophical heavy lifting. If the "you" who made the plan isn’t meaningfully the same entity as the "you" facing the choice now (a view Parfit’s reductionism nudges toward), then the normative force of past commitments evaporates. I find this less persuasive practically; even if identity is "loose," the continuity of memory, intention, and consequence creates a *pragmatic* unity that demands coordination. I’d put the probability that fragmented identity undermines commitment at **0.70** (i.e., 70% chance it doesn’t negate normative weight). Most functional decision systems act *as if* identity persists, because the alternative paralyzes long-term action.

  Combining these:  
  - P(standard theory fully correct) = **0.85**  
  - P(commitment arguments fail) = **0.40**  
  - P(identity too loose for commitments) = **0.70**  

  The probability that honoring sunk costs is **never rational** is the probability that *all three* hold:  
  **0.85 × 0.40 × 0.70 ≈ 0.238**  
  Thus, my overall credence that honoring sunk costs is *sometimes rational* (specifically in commitment scenarios) is **1 – 0.238 = 0.762**, or about 76%. 

  I’m least confident in the second component—whether commitment devices smuggle in evidential reasoning. A compelling argument that "self-signaling" is *always* evidential (and thus irrational under causal decision theory) could collapse the commitment case. Conversely, experimental evidence showing people achieve better long-term outcomes by treating sunk costs as binding (where direct precommitments aren’t feasible) would boost my credence in this mechanism. As it stands, your intuition that the commitment angle is under-discussed (and your 0.6 credence) aligns closely with my 0.76—it’s a defensible minority position with real theoretical teeth, even if orthodox models dismiss it too hastily. The crux is whether time-binding requires a subtle self-deception or reveals a deeper rationality.
