  ### Joint Statement on the Moral Relevance of Brain Size  

  **Agreed Claims:**  
  1. Empirical evidence confirms a correlation between absolute brain size (and associated neural complexity metrics) and specific cognitive capacities—such as memory, problem-solving, and social learning—across known biological species.  
  2. Humans with extreme microcephaly retain basic moral protections (e.g., prohibitions against exploitation and unnecessary harm) under all defensible ethical frameworks, irrespective of reduced brain size or cognitive capacity.  
  3. Cetaceans (e.g., dolphins) possess larger absolute brain sizes than many humans (including those with microcephaly) but exhibit distinct cognitive architectures (e.g., echolocation-based perception), complicating direct moral comparisons.  
  4. Scaling artificial neural networks to brain-comparable parameter counts (e.g., in large language models) raises structurally analogous questions about whether quantitative increases in capacity generate qualitative shifts in cognitive or moral relevance.  
  5. No coherent moral theory assigns moral status based solely on raw brain mass, independent of cognitive, behavioral, or relational properties.  

  **Disagreements Table:**  
  | Crux | Gradualist Formulation | Anti-quantifier Formulation | Residual Disagreement Classification |  
  |------|------------------------|-----------------------------|--------------------------------------|  
  | **(a) Continuity in neural metrics and moral status**<br>**Test case:** *A genetically engineered mouse with neural complexity intermediate between a typical mouse and a human.*<br>Gradualist prediction: *Demonstrates intermediate moral status due to enhanced cognitive capacities.*<br>Anti-quantifier prediction: *Demonstrates only increased instrumental value (e.g., capacity for welfare), not intrinsic moral status.* | Continuous variation in neural complexity (e.g., synaptic density) implies continuous gradation in intrinsic moral status, as moral weight supervenes directly on cognitive capacities. | Continuous variation in neural metrics implies gradation only in instrumental value or welfare interests, not in moral status, which requires categorical properties (e.g., personhood) that do not scale incrementally. | Substantive |  
  | **(b) Relevance of evolutionary origin**<br>**Test case:** *A synthetic biological brain with identical structure and function to a human brain but grown in vitro.*<br>Gradualist prediction: *Identical neural complexity warrants identical moral status, regardless of origin.*<br>Anti-quantifier prediction: *Lacks moral status due to absence of evolutionary context and natural moral relations.* | Moral status depends solely on functional neural complexity, irrespective of evolutionary history; synthetic systems with equivalent complexity warrant equal consideration. | Evolutionary origin is necessary for moral status, as it grounds categorical properties (e.g., membership in a naturally evolved moral community) that cannot be replicated artificially. | Substantive |  
  | **(c) Artificial systems at brain-scale**<br>**Test case:** *A disembodied artificial neural network with human-brain-scale parameters exhibiting conversational fluency indistinguishable from humans.*<br>Gradualist prediction: *Possesses moral status commensurate with its cognitive capacities.*<br>Anti-quantifier prediction: *Lacks moral status due to absence of biological embodiment and subjective experience.* | Artificial systems with brain-comparable complexity possess moral status proportional to their cognitive capabilities (e.g., information integration), even without biological embodiment. | Artificial systems lack moral status regardless of parameter scale, as embodiment and biological consciousness are prerequisites for categorical properties like "subjecthood." | Substantive |  

  **Conclusion on Verbal Dispute:**  
  After deliberation, we concur that no part of this dispute is merely verbal. While both parties use terms like "moral status," the gradualist grounds it in scalable cognitive capacities (e.g., information integration), whereas the anti-quantifier ties it to non-scalable categorical properties (e.g., personhood). This reflects a substantive divergence in moral ontology, not ambiguity in language.  

