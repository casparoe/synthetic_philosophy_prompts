  Me and my study partner have been arguing about whether 'the alignment problem' is actually one problem or several that got smushed together. I think it's basically unified: it's all about translating human values into objectives, and internall alignment, robustness failures, and governence issues are just technical sub-cases of that translation failing. She thinks that's a category error — she distinguishes representational alignment (what the model encodes as valuable), motivational alignment (what optimization target it actually pursues), and procedural alignment (how its goals update with experience), and says treating them as one has caused real confusion in the literature.

  Write the joint statement we'd both sign after an adversarial collaboration. Start with a numbered list of agreed claims: cover what the formal frameworks (reward modeling, RLHF, mechanistic interpretability) actually address, whether Newcomb-style reasoning shows up differently in each sub-issue, and what kind of result could in principle change either of our minds. Then a disagreements table with each side's position in wording we'd both accept. The cruxes should be: (1) can internall misalignment occur even with perfect value specification? (2) are robustness failures under distribution shift alignment failures or just capability failures? For each crux, describe one concrete scenario both of us agree is a fair test, and record what each side predicts.

  Don't include a bibliography or citation list — I don't want guesses about papers. Keep it focused and avoid strawmen. A typo or two is totally fine.

  End with a line that starts with Summary: giving the deepest remaining split in one sentence.
