prompt: |-
  hi, i run this peer-support drop-in at my sixth form twice a week and my teacher wants me to justify which wellbeing activities we advertise, not just go on vibes. i’m trying to use tranquilism — only the absence of craving and suffering counts for wellbeing, nothing else like pleasure or achievement. can you turn that into a reusable five-minute procedure? steps in order, what counts as a pass, where it auto-says no, and the exact spot where i have to hand it to my teacher because i cant seperate fact from values on my own. run it on a guided gratitude journalling session and a “no-phone weekend” detox; make one come out against what i’d want. build in a check for “shadow-craving” — calm-looking stuff that secretly feeds comparison — and say what the procedure just cant do. also tell me how confident you are overall and flag the one bit you’re least sure about. cheers.
reasoning: |-
  Okay, the user runs a peer support group at their sixth form and needs to justify wellbeing activities using tranquilism. Tranquilism focuses solely on reducing craving and suffering, ignoring pleasure or achievement. The user wants a reusable five-minute procedure with clear steps, pass/fail criteria, auto-rejects, and a point where they hand off to their teacher. They also want shadow-craving checks and examples using gratitude journaling and a no-phone weekend. Plus, one should fail against their preference, and they need confidence levels and limitations.

  First, I need to unpack tranquilism. It's about absence of craving and suffering, not positive states. So any activity that introduces or reinforces craving, even if it looks positive, should fail. The procedure must be quick—five minutes—so steps need to be straightforward. The user mentioned "shadow-craving," which might be subtle cravings masked as calm, like social comparison in gratitude practices.

  Breaking down the steps: Start with the activity's description. Then, check if it directly suppresses craving/suffering. If not, does it risk introducing craving? If yes, auto-fail. If not, it passes. But where does the teacher come in? Probably when there's ambiguity between facts and values. Like, if an activity has mixed evidence, deciding if it aligns with tranquilism becomes a values judgement.

  For the examples: Gratitude journaling. Common advice is to write things you're grateful for. But in tranquilism, if it leads to craving for more or comparison (why don't I have what others have?), that's shadow-craving. So it might fail. The user wants one outcome against their preference, so if they like gratitude journaling, this failing would be against their wish.

  No-phone weekend: Removing phones could reduce craving for notifications/social media. Directly targets craving. But potential for withdrawal suffering? However, the procedure might focus on intent. If the main effect is reducing craving, it passes. But if framed as a detox to feel better (achievement), it might not align. Need to stick to tranquilism's core.

  Shadow-craving check: Look for hidden reinforcements of craving. Gratitude journaling might have comparison elements. No-phone might not, if it's about disconnection, not productivity.

  Limitations: Tranquilism ignores positive emotions. Also, evidence might be lacking, so the procedure can't measure effectiveness, only alignment with principles. Plus, group dynamics aren't considered.

  Confidence: High in the steps, but the shadow-craving part is tricky. Subtle cravings are hard to detect. For gratitude journaling, evidence is mixed; some studies show reduced materialism, others show social comparison. So that's the least confident point.

  User's deeper needs: They need a defensible framework for their teacher, showing critical thinking. They might want to ensure activities are genuinely beneficial without superficial solutions. Also, they might seek validation that their intuitive choices (like no-phone) are justifiable under tranquilism, but the exercise requires one to fail against their preference, so gratitude journaling is the sacrifice.

  Final Procedure Structure:
  1. Describe activity neutrally.
  2. Core Mechanism: Does it directly reduce craving/suffering? If yes, pass.
  3. If not, does it risk craving? If yes, auto-fail.
  4. If no risk, pass.
  5. Teacher handoff when evidence is mixed or values conflict.
  6. Shadow-craving: Check for hidden craving triggers.

  Apply to gratitude journaling: Core mechanism is fostering positivity, not reducing craving. Risk of comparison (shadow-craving), so auto-fail.

  No-phone: Core is reducing craving for digital stimulation. Passes.

  Emphasize that the procedure doesn't assess effectiveness, just alignment. Confidence high overall, least in shadow-craving detection.
answer: |-
  Here's a reusable 5-minute Tranquilist Wellbeing Screening Procedure, designed as requested. I'll break it down step-by-step, apply it to your two examples (with one failing against your likely preference), then cover limitations and confidence.

  ---

  ### **Tranquilist Wellbeing Screening Procedure**  
  *(Time: ≤5 minutes per activity)*  

  1. **STEP 1: Describe the Activity Neutrally (1 min)**  
     - *What to do:* Write a 1–2 sentence description of the activity, stripping all promotional language. Focus on its core actions.  
     - *Pass condition:* None (this is setup).  
     - *Auto-fail:* If the description inherently references pleasure, achievement, or "gaining" something (e.g., "boost happiness," "build resilience").  

  2. **STEP 2: Core Mechanism Check (1 min)**  
     - *What to do:* Ask: **"Does this activity *directly* suppress or interrupt craving/suffering *as its primary mechanism*?"**  
       - Craving = desire for things to be other than they are (e.g., FOMO, envy, restlessness).  
       - Suffering = distress caused by craving (e.g., anxiety, rumination).  
     - *Pass condition:* Yes → Proceed to Step 4.  
     - *Auto-fail:* No → Move to Step 3.  

  3. **STEP 3: Craving-Risk Assessment (1 min)**  
     - *What to do:* Ask: **"Does this activity risk *introducing or reinforcing* craving, even subtly?"**  
       - Apply the **Shadow-Craving Check**: Could this feed comparison, scarcity mindset, or "shoulds"? (e.g., "I *should* feel grateful/calm").  
     - *Pass condition:* No craving risk → Pass.  
     - *Auto-fail:* Yes → Reject.  

  4. **STEP 4: Values/Evidence Handoff (1 min)**  
     - *What to do:* Ask: **"Is there robust evidence this reduces craving/suffering *without relying on pleasure/achievement*?"**  
       - If evidence is weak, mixed, or relies on "positive" outcomes → **Handoff to teacher** with note: *"Fact-value ambiguity: Evidence for craving-reduction is inconclusive or conflated with non-tranquilist outcomes."*  
     - *Pass condition:* Strong, direct evidence → Pass.  
     - *Auto-fail:* None (handoff if unclear).  

  5. **STEP 5: Final Triage (1 min)**  
     - Pass → Advertise as "Tranquilist-aligned: Reduces craving/suffering."  
     - Auto-fail → Reject or redesign.  
     - Handoff → Teacher decides pending evidence review.  

  ---

  ### **Applied to Your Examples**  
  *(Assuming you intuitively prefer both activities)*  

  **Example 1: Guided Gratitude Journaling**  
  - **Step 1:** *"Students write down things they feel grateful for, prompted by a facilitator."* → Pass (neutral).  
  - **Step 2:** Core mechanism? No. Primary goal is cultivating positivity → **Auto-fail** at Step 2.  
  - **Step 3 (if done anyway):** Shadow-craving check: High risk. Comparing one's life to "ideal" gratitude targets ("Why don’t I have X like others?") → **Auto-fail**.  
  - **Result: REJECTED.**  
    *Why against your want?* Gratitude journaling is popular and feels helpful, but Tranquilism flags it as craving-inducing (via social comparison/scarcity).  

  **Example 2: "No-Phone Weekend" Detox**  
  - **Step 1:** *"Students voluntarily abstain from smartphones for 48 hours."* → Pass.  
  - **Step 2:** Core mechanism? Yes. Directly interrupts craving (notification addiction, FOMO) → Pass.  
  - **Step 3:** Shadow-craving check? Low risk if framed neutrally. Withdrawal may cause *temporary* suffering, but detox targets craving-source → Pass.  
  - **Step 4:** Evidence? Strong for reducing digital craving (studies on "digital detox" show decreased anxiety/urge-checking). → Pass.  
  - **Result: PASS.**  

  ---

  ### **Limitations of the Procedure**  
  1. **Can’t evaluate effectiveness** – Only checks *alignment* with Tranquilism, not if it *works*.  
  2. **Ignores non-craving benefits** – e.g., joy, connection, or achievement are irrelevant.  
  3. **Group dynamics blind spot** – Doesn’t assess peer pressure or exclusion risks.  
  4. **Requires honest descriptions** – Marketing spin breaks Step 1.  

  ---

  ### **Confidence Assessment**  
  - **Overall confidence: 85%.**  
    - Steps are logically consistent with Tranquilism, auto-fails are clear, and handoff point is well-defined.  
  - **Least confident bit: Shadow-craving detection (Step 3).**  
    - *Why:* Subtle cravings (e.g., "I journaled, so I *should* be happy now") are context-dependent and hard to prove without participant feedback. I’m 70% confident – it catches obvious risks but may miss cultural or personal nuances.  

  ### **Final Tips**  
  - Use this verbatim for consistency.  
  - For handoffs, prepare a 1-pager for your teacher: *"Activity X hinges on whether craving-reduction is evidenced. I defer to your expertise on: (1) quality of studies, (2) school values alignment."*  
  - Tranquilism will reject many "feel-good" activities – that’s intentional. Own it as a rigorous filter.  

  This turns vibes into a defensible system. If your teacher pushes back, argue that craving-focused interventions reduce burnout (aligned with sixth-form priorities). Good luck!
