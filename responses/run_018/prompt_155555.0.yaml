  The friend's summary claims that psychiatric categories are "interactive kinds" - meaning diagnoses change how people see themselves, altering behavior to match the diagnosis. He contrasts this with "indifferent kinds" like gold that don't change when studied. He points to MPD's explosion in the 80s/90s and subsequent collapse as proof it was constructed. From this, he concludes all psychiatric classifications lack objective validity, that the DSM manufactures patient identities, and that we should abandon diagnosis entirely for individualized descriptions. He also mentions modern examples like prolonged grief disorder and social media accelerating these loops.

  The user feels this overstates Hacking's position. They recall Hacking acknowledges biological dimensions in disorders like autism or schizophrenia. They question whether MPD's collapse proves pure construction or if there were real trauma responses misclassified. They want me to audit the summary specifically on: (1) whether Hacking denies biological reality, (2) if MPD proves pure construction, and (3) if Hacking's view requires abolishing the DSM.

  Hacking's actual position is more nuanced. He doesn't deny biology but emphasizes the social feedback loop where classifications affect behavior. He distinguishes between interactive and indifferent kinds but doesn't claim mental disorders are entirely fictional. For MPD, he saw it as a case of looping effects but didn't deny underlying trauma - just that the specific MPD classification shaped its expression. He was critical of psychiatric taxonomy but didn't advocate abolishing the DSM entirely, recognizing its practical necessity while calling for caution.

  The friend's summary has accurate core ideas about looping effects and MPD as an example. But it overreaches by implying Hacking denies all biological reality, claims MPD proves pure construction, and concludes we must abandon diagnosis. These are distortions. Hacking's framework is about interaction, not pure invention. The MPD case shows classification influences manifestation but doesn't negate real distress. And Hacking suggested reforming, not eliminating, diagnostic systems.

