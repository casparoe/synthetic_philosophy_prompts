prompt: |-
  I am preparing a research proposal in political philosophy and have been discussing with colleagues whether the conceptual literature on populism has misallocated its attention. I want to focus the next few years of work on the open problems surrounding “the will of the people” that are genuinely upstream of democratic theory, but I am unsure which lines of inquiry deserve priority and which are largely decorative.

  The standard debates—whether “the people” is a pre-political entity or constituted by populist discourse, whether populists advance an epistemic claim about distributed wisdom or a purely normative claim about sovereignty, and whether citizens’ assemblies can reveal an authentic will—are familiar. What strikes me as less examined, however, is the conceptual collapse between will-formation and will-expression that is now being accelerated by algorithmic governance: when platforms and state agencies claim to extract popular sentiment directly from behavioural data, they treat the will of the people as something that can be registered without being formed through deliberation. This raises a specific cluster of questions. Is the distinction between formation and expression philosophically robust, or does it presuppose an implausible view of collective intentionality? If it is robust, does the algorithmic collapse undermine the normative authority that populists claim for their mandates, or can a synthetic, data-derived will carry the same democratic weight as one produced through assembly? And how does this affect the older boundary problem—whether popular sovereignty can be limited by constitutional essentials without betraying the populist premise—given that algorithmic extraction tends to present itself as an unmediated, and therefore unlimited, voice?

  Rather than a survey, I want a committed, dependency-aware agenda: which of these conceptual problems should be tackled first, and in what order? Please defend your prioritisation in terms of what is upstream of what, which questions are tractable through conceptual analysis rather than empirical social science, and which, despite their current fashion, would change little about democratic legitimacy even if resolved. I ask for this in British English, and I want you to take a definite position rather than laying out options for me to choose between; please also flag the points where your reasoning rests on contested premises rather than treating your conclusions as self-evident.
reasoning: |-
  Okay, let me unpack this user's request. They're a political philosophy researcher frustrated with how populism literature handles "the will of the people," particularly the overlooked collapse between will-formation and will-expression in algorithmic governance. Their core concern is prioritization: which conceptual problems should come first in their research agenda?

  Hmm, they've clearly identified three interlocking issues: 1) the formation/expression distinction's philosophical robustness, 2) algorithmic collapse's impact on populist mandates, and 3) implications for sovereignty's boundary problem. But they want dependency-aware sequencing, not just a list. 

  Right, let's consider logical dependencies. Before assessing how algorithms affect mandates (issue 2), we must first establish if the formation/expression distinction even holds water (issue 1). Otherwise, we're building on quicksand. The boundary problem (issue 3) seems downstream—it presumes we've already defined what "the will" is and how it gains authority. 

  *checks notes* The user specifically wants British English and a definite position. Also important to flag contested premises—like whether collective intentionality requires deliberation, which is hotly debated in philosophy of mind. 

  Notably, they dismiss "decorative" questions. The algorithmic angle feels urgent here—it's not just theoretical but actively reshaping political discourse. And unlike empirical studies on citizens' assemblies, this centers on conceptual groundwork about what "will" means when tech claims to bypass deliberation. 

  *ponders* The boundary problem, while fascinating, might be premature. If we haven't clarified what kind of "will" algorithms produce, arguing about its limits is putting the cart before the horse. Plus, constitutional theory already wrestles with sovereignty limits—this research could offer a fresh angle later. 

  Prioritisation must be ruthless: formation/expression distinction first (despite being unfashionable), then algorithmic authority, then boundary implications. Anything else risks building castles in the air. 

  *double-checks* User would reject neutral options—so committing hard to this sequence, while noting where Habermas-style deliberative premises aren't universal. The payoff is clearing underbrush for the entire field, not just populism studies. 

  Final thought: Emphasise that without tackling the conceptual core, we can't properly diagnose what's broken in current practices. That's the upstream move they're after.
answer: |-
  Here is a prioritised research agenda for your project, grounded in logical dependency, tractability, and normative significance. I argue for a strict sequence, treating the formation/expression distinction as the indispensable foundation—without resolving it, subsequent questions become incoherent. My position rests on deliberative democratic premises (notably contested by aggregative and realist approaches) which I flag explicitly.

  **Core Sequencing Rationale:**
  1.  **Upstream Primacy:** Without establishing the conceptual validity of the formation/expression distinction, analyses of algorithmic impacts or boundary problems lack a stable object. If the distinction collapses philosophically, the entire critique of algorithmic "extraction" evaporates.
  2.  **Tractability:** The first question is primarily conceptual/philosophical, requiring analytic rigour on collective intentionality and agency. Subsequent questions demand integrating this conceptual work with political theory and techno-governance critique.
  3.  **Non-Decorative Stakes:** Resolving the first question fundamentally alters how we understand democratic legitimacy *itself*. The algorithmic question directly challenges contemporary populist and technocratic claims to authority. The boundary problem, while important, reconfigures existing debates rather than founding new ones.

  **Prioritised Agenda:**

  1.  **The Formation/Expression Distinction: Robustness & Collective Intentionality (Year 1)**
      *   **Core Question:** *Is the distinction between the formation and expression of a collective will philosophically defensible, particularly against challenges from non-deliberative accounts of collective intentionality (e.g., aggregative, behaviourist, or emergentist views)?*
      *   **Why First?** This is the absolute upstream foundation. If "the will of the people" is *only* an expression (an aggregate of pre-existing preferences revealed through behaviour/voting), then algorithmic "extraction" is merely a more efficient expression tool, and deliberation is epiphenomenal. If formation *requires* deliberative processes (argument, reflection, justification, intersubjective recognition), then expression is secondary and derivative. **Tractability:** This is pure conceptual analysis, drawing on philosophy of action, collective intentionality (Searle, Bratman, Pettit, Gilbert), and deliberative theory (Habermas, Dryzek). Resolving it provides the necessary conceptual toolkit.
      *   **Contested Premise:** This prioritisation *assumes* that deliberative processes are normatively significant for legitimacy (contra Schumpeterian or purely aggregative democrats). It also assumes collective intentionality isn't *solely* reducible to individual mental states plus coordination (a key debate in phenomenology and social ontology).
      *   **Output:** A rigorous philosophical defence (or revision) of the formation/expression distinction, specifying the necessary conditions for genuine collective will-*formation* and why behavioural data alone cannot constitute it.

  2.  **Algorithmic Collapse & Normative Authority (Year 2)**
      *   **Core Question:** *Granting a robust formation/expression distinction, does the algorithmic conflation of expression (behavioural data as sentiment) with formation inherently undermine the normative authority claimed by populist mandates (and technocratic governors)? Can a "synthetic will" derived from data possess democratic legitimacy equivalent to a deliberatively formed will?*
      *   **Why Second?** This directly applies the conceptual groundwork from Step 1 to the urgent, under-theorised phenomenon you identify. It targets the core legitimating claim of both populism ("we *are* the people's will") and algorithmic governance ("we *detect* the people's will"). **Tractability:** Builds on the conceptual framework from Year 1, integrating critical political theory (populism studies, democratic legitimacy) and philosophy of technology (algorithms as political actors, opacity, manipulation). Requires *conceptual* analysis of authority, legitimacy, and representation, *informed* by (but not dependent on primary empirical research into) how algorithms actually function.
      *   **Contested Premise:** Assumes the validity of the formation/expression distinction established in Step 1. Also assumes that normative authority for "the people's will" requires more than mere assertion or efficient preference satisfaction (contra certain positivist or realist views).
      *   **Output:** A theory demonstrating why the algorithmic bypassing of deliberative formation *structurally* undermines the normative authority of any "will" it claims to reveal, exposing populist and technocratic claims to the "authentic voice" as conceptually incoherent or democratically illegitimate under the established framework.

  3.  **The Boundary Problem Revisited: Algorithmic Unmediation & Sovereign Limits (Year 3+)**
      *   **Core Question:** *How does the algorithmic claim to deliver an "unmediated" popular will reshape the traditional boundary problem of popular sovereignty (can it be limited)? Does this claim exacerbate the tension between populist anti-constitutionalism and liberal constraints, or does the synthetic nature of the algorithmic "will" introduce new possibilities/necessities for limitation?*
      *   **Why Third?** This question depends entirely on the answers to the first two. Only once we know *what kind of thing* "the will" is (formed vs expressed) and *what authority* a synthetically expressed "will" possesses, can we analyse how claims about its "unmediated" nature affect debates about its limits. It reconfigures an *existing* debate (liberal vs populist constitutionalism) using the new conceptual tools developed. **Tractability:** Requires synthesising the previous conceptual work with constitutional theory (sovereignty, constituent power, rights) and the specific rhetoric/mechanics of algorithmic unmediation. More integrative but less foundational than steps 1 & 2.
      *   **Contested Premise:** Assumes the conclusions of Steps 1 & 2. Also engages the contested nature of constituent power and whether sovereignty *can* be limited without self-contradiction (a core debate between liberal constitutionalists and Schmittian/Mouffian perspectives).
      *   **Output:** An analysis showing how algorithmic claims to unmediated access either (a) intensify the populist rejection of limits (by presenting the "will" as pure, immediate fact), or (b) paradoxically *require* new forms of limitation (because the "synthetic will" lacks the reflexive, self-limiting capacity of a deliberatively formed will), thereby transforming the boundary problem.

  **Why Not Prioritise the Boundary Problem or Algorithmic Authority First?**
  *   **Boundary Problem First?** Tackling the boundary problem without first defining the *nature* and *source of authority* of "the will" is putting the cart before the horse. Debates about limiting sovereignty depend entirely on what "sovereignty" (understood as the authentic popular will) *is* and how it gains its normative force. Without Steps 1 & 2, your analysis would rely on undefined or contested concepts, making its contribution less fundamental.
  *   **Algorithmic Authority First?** Jumping straight to the impact of algorithms risks building on sand. If the formation/expression distinction collapses conceptually, then critiques of algorithmic extraction weaken significantly. You need the philosophical defence of deliberation's necessity *before* you can compellingly argue why algorithmic bypassing is damaging. Otherwise, the critique appears merely partisan or nostalgic.
  *   **"Decorative" Questions Avoided:** Debates solely about *which institutional form* (e.g., citizens' assemblies vs referendums) best "expresses" a pre-formed will, without interrogating the formation process itself, are largely downstream of your core concern. Similarly, purely empirical studies measuring the "accuracy" of algorithmic sentiment analysis miss the prior *conceptual* point about whether sentiment data *is* a "will" at all. Your focus cuts deeper.

  **In Summary: A Committed Sequence**
  1.  **Establish the Conceptual Core:** Defend/Rethink the Formation/Expression Distinction (Conceptual Philosophy).
  2.  **Apply to the Critical Novelty:** Demystify Algorithmic Claims to Authority (Political Theory/Philosophy of Tech).
  3.  **Reconfigure the Existing Debate:** Re-examine the Boundary Problem in Light of 1 & 2 (Constitutional Theory).

  This sequence ensures each step provides the necessary conceptual foundation for the next, tackles the most fundamental (and currently neglected) problem first, maximises tractability through initial focus on pure conceptual analysis, and addresses the issues with the highest potential to reshape our understanding of democratic legitimacy in the face of algorithmic governance and populist claims. The core contested premise – the indispensability of deliberation for genuine collective will-formation and thus legitimate authority – is the lynchpin; defending this robustly in Step 1 is paramount.
