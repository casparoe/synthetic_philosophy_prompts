prompt: |-
  You are a decision theorist with expertise in normative ethics and the foundations of rational choice. I hold a position I want you to stress-test rather than defend, and I'd like you to think carefully and brainstorm broadly before settling into your structured answer.

  The position is expected value fanaticism: in any choice situation where the options have well-defined expectations, you are rationally required to take the option with the highest expected value, full stop — no matter how small the probability of the enormous payoff that swamps the calculation, and no matter what is being given up for certain. So a one-in-a-trillion chance of some astronomically large good, if the arithmetic works out, beats a guaranteed excellent outcome, and mugging-style offers can in principle rationally clean you out.

  What would count against this view? I want a map of its exposure, organized roughly as follows:

  1. Intuitive cases. Which thought experiments — St. Petersburg-style setups, mugging variants, cases trading a certainty against a long-shot — put the most pressure on the view, and which of those would a committed fanatic simply bite the bullet on versus quietly try to re-describe? Is bullet-biting here a legitimate defense or an admission?

  2. Formal results. Fanaticism presupposes that expectations exist and are well-defined. Walk me through what happens with games like the Pasadena game, where the expectation is undefined or the ordering of outcomes matters, and with infinitesimal or unbounded utility constructions. Do these count as defeaters for the view, or merely as boundaries on its domain — and who gets to decide that?

  3. Hostage commitments. Fanaticism seems to inherit the problems of whatever value theory it is paired with (say, a total aggregative axiology in population ethics). Which of its apparent absurdities belong to fanaticism itself and which to its companions, and would severing the companions defuse or merely relocate the trouble?

  4. The meta-question. Since this is a normative view, what could falsify it at all? Rank the candidate defeaters from fatal to merely awkward, say which ones a sophisticated defender would themselves concede as genuine costs, and give me an honest verdict on whether fanaticism has been qualified into something that risks nothing — and if so, whether that is a defect in a view of this kind.
reasoning: |-
  Okay, let me start by really unpacking what the user is asking. They want me to stress-test Expected Value Fanaticism (EVF). Hmm, so EVF says that no matter how small the probability, if the expected value is higher, you must take it—even if it means giving up a sure good thing for a tiny chance of something huge. The user mentioned mugging-style scenarios where you might give up everything based on a minuscule probability.

  First, I need to consider intuitive counterexamples. Pascal's Mugging is the obvious one. If a mugger says they'll give you an astronomical payoff with a tiny probability unless you hand over your wallet, EVF says you should comply. But that feels wrong. People would say it's irrational. Then there's the St. Petersburg game, which already has infinite expected value but with diminishing probabilities. But EVF can handle that by biting the bullet. The real pressure comes from variations where sure losses are involved, like giving up a child's safety for a lottery ticket with high EV. That’s emotionally jarring. Biting the bullet here seems more like admitting the view's harshness than defending it.

  Next, formal issues. The Pasadena game has an undefined expected value because the series alternates and doesn't converge. EVF can't operate here since there's no expectation to compare. That’s a boundary issue. Also, unbounded utilities make EVF hypersensitive to tail events. If utilities can be infinite, every decision might be dominated by tail risks. Infinitesimal probabilities might not help either because standard probability doesn’t include them, so EVF would need to integrate new math, which complicates things.

  Hostage commitments. EVF depends on the underlying axiology. If paired with total utilitarianism, it could demand extreme sacrifices for large future populations. But even with different theories, like average utility, the fanaticism might still lead to similar issues. Separating axiology might not solve the core problem of demanding too much for tiny probabilities.

  Meta-questions. What falsifies EVF? Intuitive repugnance might not count for hardcore formalists. But if EVF leads to practical paralysis or undermines rational decision-making, that's serious. Sophisticated defenders might admit the costs but argue EVF is still technically correct. However, if the domain is restricted too much to avoid problems, EVF risks becoming unfalsifiable and untestable, which is a flaw for a normative theory.

  The user’s deeper need might be understanding if EVF is defensible or if it’s a reductio of strict consequentialism. They might be exploring whether rationality demands fanaticism or if there’s room for alternative decision theories. They could also be interested in how values interact with risk, especially in ethics or policy. Highlighting the trade-offs between theoretical purity and practical rationality would address their unspoken concerns about applying such principles in real life.
answer: |-
  Below is a systematic stress-test of **Expected Value Fanaticism (EVF)**, organized to expose its vulnerabilities. I'll map its exposure across your four requested dimensions, identifying where it faces fatal flaws, awkward concessions, or defensible boundaries. The analysis assumes EVF operates within standard decision theory (real-valued utilities, probabilistic expectations) unless specified.

  ---

  ### **1. Intuitive Cases: Bullets to Bite or Re-Descriptions to Avoid**
  EVF faces brutal counterintuitive verdicts. A committed fanatic must bite *most* bullets, but some re-descriptions are attempted:

  - **Pascal's Mugging (Classic):**  
    *Setup:* A stranger claims they can grant you \(3^{100}\) utils with probability \(1/3^{100}\) if you hand them $1,000. Otherwise, you lose $1,000. EVF demands compliance.  
    *Pressure:* Rationality seems to require ignoring non-credible threats.  
    *Fanatic response:*  
    - **Bullet-biting:** "If the probability is non-zero and utilities are unbounded, the math rules. Our intuitions are unreliable at extremes."  
    - **Re-description (common):** "Probabilities this low are epistemically indistinguishable from zero" (but this *modifies* EVF by adding a threshold).  

  - **Certain Loss vs. Long-Shot Gain:**  
    *Setup:* Option A: Guaranteed torture of an innocent child for 1 year.  
    Option B: \(10^{-100}\) probability of preventing \(10^{120}\) years of torture for all future beings.  
    EVF demands Option B.  
    *Pressure:* Moral paralysis – we cannot act on probabilities this low.  
    *Fanatic response:*  
    - **Pure bullet-bite:** "The expected disutility of Option A is astronomically worse. Sentiment is irrational."  
    - **Concession:** Few defenders embrace this in practice.  

  - **St. Petersburg with Certainty Tradeoff:**  
    *Setup:* Modified St. Petersburg: Pay $1M to enter a lottery with expected value ∞. Versus keeping $1M for sure. EVF pays.  
    *Pressure:* Sacrificing a life-changing certainty for an abstract ∞.  
    *Fanatic response:*  
    - **Bullet-bite:** "∞ dominates any finite value."  
    - **Re-description (Nover-Hájek):** "Use finite truncations or relative utilities" (abandons strict fanaticism).  

  **Verdict:** Bullet-biting is an *admission* that EVF overrides moral intuitions. In extreme cases (e.g., torturing a child for negligible gain-probability), this collapses into a *reductio ad absurdum* – EVF becomes a "counterpossible rationality" no agent could follow.

  ---

  ### **2. Formal Results: When Expectations Break Down**
  EVF *presupposes well-defined expectations*. When expectations fail, EVF is silent or incoherent:

  - **Pasadena Game (Nover-Hájek):**  
    *Setup:* A game with payoffs \((-1)^n \cdot 2^n/n\) (e.g., +2, -2, +8/3, -4, ...). The expectation is conditionally convergent (depends on summation order).  
    *Problem:* No unique expected value exists. EVF cannot rank options.  
    *Fanatic response:* "EVF only applies when expectations exist" (a retreat to bounded utilities or finite cases).  

  - **Unbounded Utilities:**  
    *Problem:* If utilities are unbounded (e.g., total utilitarianism), *any* action with non-zero probability of infinite value dominates all finite options. EVF mandates obsessive tail-chasing.  
    *Fanatic response:*  
    - Bite bullet: "Yes, we must maximize the probability of infinities."  
    - Restrict domain: "Utilities must be bounded" (but this is ad hoc).  

  - **Infinitesimal Probabilities:**  
    *Problem:* Standard probability is real-valued. If we allow hyperreals (e.g., \(10^{-\infty}\)), expectations may not be Archimedean.  
    *Fanatic response:* "Stick to Kolmogorov probability" (but this excludes idealized cases where EVF might shine).  

  **Verdict:** Formal limitations *bound EVF's domain*, but fanatics must admit it fails for:  
  - Non-measurable acts  
  - Undefined expectations  
  - Non-Archimedean value structures  
  This makes EVF *incomplete* as a universal theory.

  ---

  ### **3. Hostage Commitments: Axiological Dependencies**
  EVF inherits all pathologies of the underlying axiology. Severing ties doesn't resolve core issues:

  - **Population Ethics (Total Utilitarianism):**  
    *Problem:* EVF + totalism demands sacrificing everything for a \(10^{-100}\) chance of creating \(10^{100}\) happy lives.  
    *Fanatic concession:* "This *is* rational if totalism is true."  

  - **Axiological Companions vs. Core Fanaticism:**  
    - **Companion pathologies:** Repugnant Conclusions, torture-vs-dust-speck dilemmas.  
    - **Core fanaticism pathologies:** Insensitivity to certainty, tail-driven paralysis.  
    *Severing ties?* Adopting average utilitarianism or person-affecting views avoids some population puzzles but *not* mugging scenarios. EVF still demands gambling certain necessities for tiny chances of vast gains.  

  **Verdict:** EVF's *structural fanaticism* (ignore probability size, certainty, and risk aversion) is independently problematic. Even with "sane" axiologies (e.g., bounded utility), it mandates counterintuitive sacrifices.

  ---

  ### **4. Meta-Question: Can EVF Be Falsified?**
  As a normative theory, EVF isn't empirically falsifiable – but it faces *internal* and *pragmatic* defeaters. Ranked by severity:

  1. **Fatal Defeater:** **Self-Undermining in Practice**  
     If EVF demands accepting all mugger offers, rational agents are exploited into poverty. *Instrumental rationality* (e.g., maintaining resources to pursue future value) contradicts EVF. This collapses into a performative paradox.  

  2. **Severe Defeaters:**  
     - **Formal Undecidability:** When expectations are undefined (Pasadena), EVF offers no guidance.  
     - **Infinite Regress:** If every action has non-zero probability of infinite payoff (via universe-simulating dust), EVF mandates random stasis.  

  3. **Awkward Concessions:**  
     - **Biting Repugnant Bullets** (e.g., torturing for negligible tail probabilities).  
     - **Restricting Domain:** Limiting EVF to "reasonable" probabilities/utilities admits that fanaticism is unsustainable.  

  **Sophisticated Defender's Concessions:**  
  - "EVF is *theoretically* correct but *practically inert* in low-probability regimes."  
  - "Our cognitive limitations justify ignoring EVF below probability thresholds."  
  - "EVF is only compelling when expectations are robustly defined."  

  **Final Verdict:**  
  EVF **cannot be universally maintained** without collapsing into absurdity or vacuity. To "qualify" it (e.g., bounding utilities, ignoring extreme probabilities) is to abandon fanaticism – turning it into a cautious cousin of expected utility theory. This *is* a defect: a theory that "risks nothing" in application ceases to be a normative guide. EVF's core insight – that small probabilities can matter – survives, but as a *constrained heuristic*, not an unyielding imperative.

  ---

  **Conclusion:** EVF's exposure is fatal at the extremes, survivable only in domesticated forms. Its value lies in stressing how *non*-fanatic theories must justify their departures from strict expectation maximization – but as a standalone doctrine, it demands too much of rationality and too little of wisdom.
