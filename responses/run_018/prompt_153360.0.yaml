answer: |-
  Here’s the direct democracy debate translated into your signal chain, with a residue report on fidelity and distortion:

  ---

  ### **Signal Chain Translation**  
  **Direct Democracy as a Sampling System:**  
  - **Sampling Rate** = Voting frequency (e.g., Swiss initiatives: high sample rate; Brexit: single sample).  
  - **Quantization** = Binary ballot choices (yes/no). Quantization error introduced by reducing complex policies to 1-bit depth.  
  - **Noise Floor** = Misinformation, low voter knowledge, emotional bias. SNR plummets when noise (media spin, oversimplified ads) overwhelms signal (policy substance).  
  - **Aliasing** = Framing effects. A poorly worded proposition (undersampled policy) creates harmonic distortion (unintended consequences). Example: California prop mislabeled as "Safe Neighborhoods" actually funding prisons.  
  - **Anti-Aliasing Filter** = Double-majority rules (Switzerland). Requires cantonal + popular approval to reject spectral leakage (tyranny of majority).  
  - **Dithering** = Public debate/campaigns. Adds low-level noise to reduce quantization artifacts (polarization), but risks increasing noise floor.  

  **Pro-Direct Democracy Argument (High-Fidelity Sampling):**  
  *"We’re running a high-sample-rate ADC capturing the true waveform of popular will. Double-majority rules act as a multi-band filter, rejecting aliased signals from outlier cantons. Quantization to binary is lossy but efficient—dither via public debate smoothes stairstep artifacts. The noise floor is manageable; voters are a statistically significant DAC reconstructing the aggregate signal."*  

  **Critique Argument (Quantized Garbage):**  
  *"You’re sampling a noisy, non-stationary signal (public opinion) with a 1-bit quantizer at irregular intervals. Framing effects alias high-frequency policy nuances into DC offsets (Brexit’s ‘£350M/NHS’ → binary leave/stay). SNR is trash: noise (clickbait, lies) exceeds signal. No anti-aliasing filter can save California props—they’re quantized to ideological clipping. And 51.9% isn’t a ‘loud’ signal; it’s a +0.1dBFS reading with infinite gain applied post-capture."*  

  ---

  ### **Residue Report**  
  **Clean Mappings (High Fidelity):**  
  1. **Sampling Rate ↔ Vote Frequency**: Swiss system = oversampling (reduces temporal aliasing); single votes (Brexit) = critically sampled (risk of Nyquist violations).  
  2. **Quantization Error ↔ Oversimplification**: Reducing policy to yes/no = 1-bit depth → harmonic distortion (unpredictable side effects).  
  3. **SNR ↔ Information Quality**: Low-SNR votes (e.g., complex bond measures) = noise-masked signal. High-turnout, informed votes = clean capture.  
  4. **Aliasing ↔ Framing Dependence**: Wording biases = frequency folding (see: "Death Tax" vs "Estate Tax").  

  **Distorted Mappings (Phase Issues):**  
  1. **"Popular Will" as Source Signal**: In audio, the source exists pre-sampling. In democracy, the "signal" is generated *by* the sampling process (feedback loop).  
  2. **Dithering ≠ Deliberation**: Dither is stochastic noise; deliberation is *adaptive filtering*. One is random, the other is algorithmic.  
  3. **Thresholds (e.g., 50%)**: Audio has dBFS for "loudness." Democracy’s 50% is arbitrary—like declaring -0.5dBFS "silence."  

  **No Analog (Digital Silence):**  
  1. **Legitimacy**: A voter’s *belief* that the process is valid has no SP equivalent. It’s metaphysical gain.  
  2. **Deliberative Transformation**: Voters updating views via debate = a time-variant filter altering the source *during* sampling. SP assumes a static source.  
  3. **Intentionality**: A "Leave" vote could mean anti-immigration *or* anti-austerity—same quantized value, different spectral content. SP has no equivalent for "symbolic noise."  

  ---

  ### **Verdict**  
  Your framework **exposes noise** the political theory obscures:  
  - Direct democracy often samples a **non-stationary signal** (shifting opinions) with a **crippled ADC** (binary quantization).  
  - Framing effects and low SNR make outputs **aliased artifacts**, not true reconstructions.  
  - But the **unmappable residues (legitimacy, deliberation)** aren’t just noise—they’re the *reason* democracy persists despite garbage SNR. Deliberation is a chaotic, adaptive filter that can *improve* the source signal over time (unlike audio). Legitimacy is psychoacoustic: even a distorted signal is accepted if the sampling process feels "right."  

  **Conclusion**: Your SP lens correctly IDs spectral flaws in the mechanics, but democratic theory tracks a meta-signal—**system stability through perceived participation**—that doesn’t live on the spectrogram. Whether that’s a carrier wave or 60Hz hum depends on your taste in distortion.
