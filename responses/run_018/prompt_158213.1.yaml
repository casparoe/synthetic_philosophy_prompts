answer: |-
  ## Research Proposal: Dissolving the Unilateralist's Curse Through Peer-Relative Expected Utility

  **1. Research Question & Significance**

  *   **Precise Question:** Can the unilateralist's curse in collective risk scenarios be dissolved by reconceiving expected utility (EU) as *peer-relative* – requiring agents to weight outcome utilities based on the epistemic standing of their risk-assessment within their relevant epistemic community – and does this approach achieve this dissolution without collapsing into generic risk-aversion while preserving normative force?
  *   **Why it Matters:** The unilateralist's curse is a critical failure mode in collective action under risk (e.g., environmental regulation, emerging technology governance, arms control). Standard solutions often involve restricting individual agency (e.g., veto powers, consensus requirements) or aggregating beliefs into a single group assessment. These can be inefficient, impractical, conflict-prone, or fail to respect legitimate epistemic diversity. A solution grounded in *individual decision theory*, altering how agents *themselves* calculate rationality, would be philosophically distinct and potentially more robust. It offers a novel perspective on rationality in interdependent epistemic contexts, addressing a core tension between individual judgment and collective welfare without resorting to external constraints. Success would provide a principled, decision-theoretic basis for agents to self-regulate in curse-prone scenarios, enhancing collective resilience against harmful unilateralism driven by outlier optimism.

  **2. Problem & Gap: Why Current Approaches Fall Short**

  The unilateralist's curse arises when:
  1.  Multiple agents can act unilaterally to trigger an outcome.
  2.  The outcome depends on the *shared* assessment of a risk (e.g., safety of deploying a technology).
  3.  Agents have differing private risk assessments.
  4.  The agent with the *most optimistic* assessment (lowest perceived risk) acts first, potentially triggering a harmful outcome that agents with more accurate (pessimistic) assessments would have avoided.

  *   **Standard Consequentialism (Naive EU):** Agents calculate EU solely based on *their own* subjective probabilities and utilities. This directly *entrenches* the curse: the most optimistic agent rationally acts because, *according to their private assessment*, the expected benefit outweighs the (subjectively low) risk. Consequentialism, focusing on individual rationality defined by private beliefs, provides no internal mechanism to counter this.
  *   **Game Theory (Strategic Interaction Models):** Models like Nash equilibrium often predict the curse as the stable outcome if acting first is beneficial under low-risk beliefs. While illuminating strategic dynamics, game theory typically takes beliefs as given. It doesn't inherently provide agents with a *reason* to modify their *individual* decision calculus based on peer disagreement *before* acting unilaterally. Cooperative solutions (e.g., communication, binding agreements) are vulnerable to defection or impracticality in large/diverse groups.
  *   **Obvious Alternatives & Their Limitations:**
      *   **Institutional Restrictions (Vetoes, Permissions):** Directly restrict agency, potentially stifling beneficial unilateral action or creating bureaucratic bottlenecks. They address the symptom (action) without altering the underlying decision logic.
      *   **Standard Bayesian Aggregation (Pooling):** Combines individual beliefs into a single group probability (e.g., averaging). While potentially mitigating the curse if the group belief is more accurate, it eliminates individual epistemic agency. Agents must abdicate their judgment to the group, which may be epistemically problematic (e.g., if experts disagree with a naive average) and normatively demanding. It doesn't guide the *individual* contemplating unilateral action *before* a group assessment exists or is feasible.
  *   **The Gap & Conceptual Opportunity:** What's missing is a framework that retains individual agency and judgment while *integrating* awareness of one's position within an epistemic community into the *core calculation of rational action*. A peer-relative EU approach promises to fill this gap by making rationality sensitive to epistemic standing, potentially providing agents with a decision-theoretic *reason* to refrain from acting when their optimism is an outlier, without needing external enforcement or belief surrender.

  **3. Method: Conceptual Analysis & Applied Modeling**

  This project employs a two-stage methodology of conceptual development followed by application and testing:

  1.  **Conceptual Analysis of Peer-Relative Expected Utility:**
      *   **Define "Epistemic Peer":** Precisely characterize the relevant epistemic community for an agent in a given curse scenario (e.g., fellow scientists on a safety panel, nations in a treaty). Define criteria for peerhood (expertise, access to evidence, epistemic norms).
      *   **Formalize Peer-Relative Weighting:** Develop a formal model where an agent's EU for an action `A` depends not only on their private probability `P_i(O|A)` and utility `U(O)` for outcomes `O`, but also on a weighting function `W(P_i, {P_j})`. `W` discounts the subjective probability `P_i` used in the EU calculation based on how `P_i` relates to the distribution of peer beliefs `{P_j}` (e.g., lower weight if `P_i` is a significant low-probability outlier). Analyze properties `W` must possess (e.g., symmetry, responsiveness to distribution shape/density).
      *   **Normative Grounding:** Argue why incorporating `W` preserves the normative force of EU maximization. Key: Frame peer-relativity as refining the agent's *own* epistemic position within the context of shared epistemic goals/standards, not imposing an external view. Connect to concepts of epistemic humility and reasonable disagreement.

  2.  **Application to Canonical Unilateralist's Curse Scenarios:**
      *   **Model Canonical Cases:** Construct formal models of 2-3 archetypal curse scenarios (e.g., a threshold safety decision; sequential action problem). Model both naive EU and peer-relative EU.
      *   **Simulate Decision Outcomes:** Calculate the EU-maximizing action for agents with varying risk beliefs under both frameworks. Specifically analyze the behavior of the most optimistic agent(s).
      *   **Test Against Criteria:** Evaluate whether the peer-relative framework:
          *   **Dissolves the Curse:** Prevents the most optimistic outlier from unilaterally acting when their action would cause collective harm *according to the community's epistemic center*.
          *   **Avoids Generic Risk-Aversion:** Allows the most optimistic agent to act *if* their belief, though optimistic, is not a significant outlier (i.e., within a reasonable range of peer views), or if the potential benefit is sufficiently high *even when weighted*. Compare outcomes to a simple risk-averse EU calculation.
          *   **Preserves Legitimate Unilateralism:** Permits action by agents whose beliefs are pessimistic or central, if justified by their peer-weighted EU.

  **4. Success, Failure, and Scope**

  *   **Successful Result:** A formally defined peer-relative EU weighting function `W` that, when applied in canonical curse models:
      1.  Systematically prevents unilateral action *only* by agents whose optimism is a significant epistemic outlier relative to peers.
      2.  Does not universally suppress action more than a standard risk-neutral EU calculation (demonstrating it's not just hidden risk-aversion).
      3.  Allows for unilateral action when beliefs are non-outlier optimistic or when benefits are high enough to warrant action even by pessimistic agents.
      4.  Is accompanied by a plausible normative justification linking the weighting to rational considerations within an interdependent epistemic context.
  *   **Indicators of Failure:**
      *   The peer-relative framework fails to prevent cursed outcomes in core scenarios.
      *   The framework suppresses action universally or behaves indistinguishably from simple risk-aversion.
      *   The weighting function `W` proves to be ad hoc, lacking a coherent conceptual or normative basis.
      *   Defining the relevant peer group robustly for diverse scenarios proves intractable within the scope.
  *   **Project Too Large?** This project would be too large for a single term if it attempted:
      *   A comprehensive formal game-theoretic analysis of strategic interactions under peer-relativity.
      *   A full defense against all possible objections to the normative foundations.
      *   Extensive empirical validation or application to a wide range of real-world cases beyond canonical models.
      *   Developing a complete theory of epistemic peerhood applicable to all contexts.

  **5. Realistic Scope Assessment**

  This single-semester project is realistically scoped to:
  1.  Clearly define the unilateralist's curse and the core challenge for individual decision theory.
  2.  Develop *one specific, coherent proposal* for a peer-relative EU framework, including a formal definition of `W` and its core rationale.
  3.  Construct and analyze 2-3 stylized formal models of canonical curse scenarios.
  4.  Compare outcomes under naive EU and the proposed peer-relative EU within these models, explicitly testing for curse dissolution and avoidance of generic risk-aversion.
  5.  Provide an initial, focused normative justification for the framework, sufficient to demonstrate its potential normative force and distinguish it from alternatives.
  6.  Clearly articulate the successes and limitations revealed by the analysis, including avenues for future work (e.g., strategic interactions, dynamic belief updating, broader applications).

  The focus remains on conceptual innovation, formal modeling within bounded scenarios, and establishing the *prima facie* viability and distinctiveness of the peer-relativity approach as a solution to the curse. This provides a solid foundation for future, more expansive research.
