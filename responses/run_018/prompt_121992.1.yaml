prompt: |-
  I'm teaching the decision theory week of intro philosophy and I've got one 50-minute section with first-years — most have never done expected utility, a couple have done the trolley problem, and one is already convinced free will settles everything. I want them to feel the pull of both answers before anybody names a decision theory.

  The carrying case is one I made up so they cant just pull up the encyclopedia entry: two predictors. Alpha watches a 30-second clip of you thinking out loud, and is 95% accurate on people who don't recognise the setup but only about 55% accurate on people who've take a decision theory class, because the clip just shows them shopping for a theory. Beta never sees the clip, only your records, and is 80% accurate on everybody. Boxes are filled before you're called in, and the class is told all of this up front.

  Don't explain Newcomb's problem to me — plan how I teach it. What has to come first and what depends on what (at what point does the two-boxing move stop being a shrug and start sounding like an argument?). Why this case, and what it has to have and lack: what exactly breaks if I use a single predictor described flatly as "90% accurate", or if the opaque box holds a hundred dollars and the clear one a dollar? Then the misconceptions in the order they'll actually arrive — the boxes are already full so take both; this is just determinism again; so the predictor sees the future; one-boxing means my choice causes the prediction; I'll just make up my mind at the last instant — and precisely where in the sequence I head each off. What I should explicitly refuse to get into at this level. And one final question that tells me they've seen what the disagreement is about rather than which team they joined.

  Give it back as a table with columns: stage | what I actually do or say | which earlier stage it leans on | misconception it's placed to defuse | minutes. Then a short JSON object with keys: refuse_to_explain, check_for_understanding, case_fragility (what tweak to the case would collapse the whole lesson). No readings and no bibliography — I know the literature.
reasoning: |-
  We are going to design a 50-minute lesson plan for an introductory philosophy class on decision theory, focusing on a variant of Newcomb's problem. The goal is to have students feel the pull of both one-boxing and two-boxing without naming the theories. The case involves two predictors (Alpha and Beta) with different accuracies and conditions.

  Important features of the case:
  - Alpha: watches a 30-second clip of you thinking out loud. 95% accurate on naive subjects, 55% on those who have taken a decision theory class (because they are seen shopping for a theory).
  - Beta: never sees the clip, only your records, 80% accurate on everybody.
  - Boxes are filled before you are called in.

  Breakdown of the lesson plan:

  Stage | What I actually do or say | Which earlier stage it leans on | Misconception it's placed to defuse | Minutes
  ------|---------------------------|-----------------------------|----------------------------------|--------
  1. Introduction & Setup | "Today we are going to explore a puzzle about making decisions. Imagine you are in a room with two boxes: one is clear and you can see it contains $1,000. The other is opaque and might contain $1,000,000 or nothing. You can choose to take either only the opaque box (one-box) or both boxes (two-box). But here's the twist: the contents were set by two predictors before you entered." | None | None | 5
  2. Explain Predictors | "There are two predictors: Alpha and Beta. Alpha watched a 30-second clip of you thinking out loud about the decision. For people who haven't seen this setup before, Alpha is 95% accurate. But for people who have taken a decision theory class, Alpha is only about 55% accurate because the clip shows them 'shopping for a theory'. Beta never sees the clip, only your records, and is 80% accurate for everyone. The boxes are filled based on the predictors' forecasts: if they predicted you would take only the opaque box, then it has $1M; if they predicted you would take both, then the opaque box is empty. The clear box always has $1,000." | Stage 1 | None | 5
  3. First Choice: What would you do? | "Before we analyze, let's take a quick anonymous poll: would you take one box or two? Write it down and don't share yet." | Stages 1-2 | None | 2
  4. The Two-Boxing Argument | "Let's hear from someone who would take both boxes. Why? [Elicit response] The key idea: the boxes are already filled, so your choice now can't change what's in them. So you might as well take both and get the clear box's $1,000 plus whatever is in the opaque box. If it's full, you get $1,001,000; if empty, you get $1,000. Either way, you get $1,000 more than if you had taken only the opaque box." | Stages 1-2 | "The boxes are already full so take both" (this is the argument, not a misconception at this point) | 8
  5. The One-Boxing Intuition | "But wait, let's think about the predictors. They are very good. If you take only one box, the predictors likely predicted that and put $1M in the opaque box. If you take both, they likely predicted that and put nothing. So if you take one box, you're likely to get $1M; if you take both, you're likely to get only $1,000. So why not take one box?" | Stage 4 | "This is just determinism again" (we haven't gone there yet) | 8
  6. Addressing Misconceptions | "Now, some common thoughts: 
     - 'But the boxes are already full!' Yes, that's true, but remember the predictors are very good at anticipating what you will do. So if you decide to take both, they probably already knew that and left the opaque box empty. 
     - 'Is this about determinism?' Not exactly. The predictors are using evidence about you to predict, not fate. 
     - 'Does my choice cause the prediction?' No, the prediction was made before you choose. But your choice and the prediction are correlated because the predictor is good. 
     - 'I'll just make up my mind at the last instant.' But the predictor saw a clip of you thinking and has your records. They are basing the prediction on that, and they are accurate." | Stages 4 and 5 | All the listed misconceptions: <br> - Boxes already full -> take both (but we already have the two-boxing argument) <br> - This is just determinism <br> - One-boxing means my choice causes the prediction <br> - Making up mind at last instant | 10
  7. Deepening the Puzzle | "Let me complicate it with our two predictors. The opaque box is filled based on both predictors: only if both predicted you would take one box is it filled. Otherwise, it's empty. [Note: This is a modification to make the case more interesting and to force consideration of both predictors.] Now, what do you do? Remember, Alpha is great for naive people but not for experts, and Beta is 80% for everyone. Since you are in a decision theory class, what does that imply for Alpha's accuracy on you? [55%] But Beta is 80%. So if you take one box, what's the chance both predicted that? You need both to be correct. For Alpha, it's 55% chance of being correct about you (if you one-box) and Beta 80%. So the chance both are correct is 0.55 * 0.8 = 44%. So 44% chance of $1M and 56% chance of $0. If you take both, you get $1,000 plus whatever is in the opaque box. But if you take both, the opaque box is filled only if both predicted one-box? No, it's filled only if both predicted one-box. So if you take both, the opaque box is filled only if both were wrong? Let me clarify: the opaque box is filled if and only if both predictors predicted you would take only the opaque box. So if you take both boxes, you get the clear $1,000 plus the opaque box only if it was filled. But it was filled only if both predictors thought you would take one box. So if you take two boxes, then the predictors would have to have been wrong for the opaque box to be filled. So what's the chance both were wrong? For Alpha, if you two-box, then Alpha's accuracy on you is 55% for two-boxing? Wait, note: Alpha's accuracy on class-takers is 55% overall, but we don't know if that's symmetric. Let's assume it's symmetric: if you two-box, Alpha has a 55% chance of correctly predicting that. So chance Alpha is wrong when you two-box is 45%. Beta is 80% accurate, so 20% wrong. Chance both are wrong: 0.45 * 0.2 = 9%. So if you take both boxes, 91% chance the opaque box is empty (because at least one predictor predicted you would take two boxes) and 9% chance it's full. So expected value: 0.09*$1,001,000 + 0.91*$1,000 = $90,090 + $910 = $91,000. Now, if you take one box: you get $1M only if both predictors predicted one-box. Chance of that: as above, 44% (if we assume independence). So 44% of $1M = $440,000. So one-boxing has higher expected value. But wait, the two-boxer says: regardless, when you are in the room, the opaque box is either full or empty, so you should take both. But the expected utility calculation says one-boxing is better. So the puzzle remains." | Stages 4,5,6 | This complicates the simple story and forces them to see that even with two predictors and lower accuracy, the expected utility might favor one-boxing. | 10
  8. Final Question for Understanding | "Regardless of which choice you prefer, what is the core disagreement between someone who takes one box and someone who takes two boxes? (Hint: It's about what you can control and what you can't, and how to reason in the face of correlation.)" | All stages | None | 2

  Total: 50 minutes.

  Now, the JSON object:

  refuse_to_explain: We refuse to get into:
     - The names of decision theories (like CDT, EDT) or any jargon.
     - The debate about free will in depth (we acknowledge it's a related topic but focus on the decision).
     - The mathematical details of expected utility beyond simple calculations (we do a rough one in stage 7 but don't require formulas).
     - The entire literature on Newcomb's problem and its variants.

  check_for_understanding: The final question: "What is the core disagreement between someone who takes one box and someone who takes two boxes?"

  case_fragility: If we use a single predictor described flatly as "90% accurate", then the two-boxing argument becomes harder to resist because the expected utility of one-boxing is $900,000 and two-boxing is $1,000 + 0.1*$1,000,000 = $101,000, which is less. But then the two-boxer might still say "but the box is already there". However, the fragility comes if the amounts are not extreme: if the clear box has $100 and the opaque has $1,000, then two-boxing always gives at least $100, and if the predictor is 90% accurate, one-boxing gives $900 on average, but two-boxing gives 0.9*$100 + 0.1*$1,100 = $90+$110=$200, which is less. But if the clear box is $100 and opaque is $1,000, then two-boxing: if predictor is 90% accurate, then when you two-box, 90% of the time the predictor predicted that and the opaque box is empty -> you get $100, 10% of the time the predictor thought you'd one-box and filled it -> you get $1,100. So expected: 0.9*100 + 0.1*1100 = 90+110=200. One-boxing: 90% of the time you get $1,000, 10% you get $0 -> $900. So one-boxing is still better. But if the clear box is $500,000 and the opaque is $1,000,000, then two-boxing: 90% chance of $500,000 (because opaque empty) and 10% chance of $1,500,000 -> expected $600,000. One-boxing: $900,000. So one-boxing wins. But if the clear box is $800,000 and opaque $1,000,000, then two-boxing: 0.9*800,000 + 0.1*1,800,000 = 720,000+180,000=900,000. One-boxing: 900,000. So equal. If clear is $900,000, then two-boxing: 0.9*900,000 + 0.1*1,900,000 = 810,000 + 190,000 = 1,000,000 > 900,000. So then two-boxing is better by expected utility. So the case breaks if the clear box is too large. In our setup, we have $1,000 and $1,000,000, so one-boxing is better by expected utility. But the two-boxer doesn't care about expected utility? The fragility is that if the clear box is too valuable, then even by expected utility two-boxing wins, and the puzzle loses its force. Also, if the predictor is only 50% accurate, then it's random and two-boxing dominates.

  In our two-predictor setup, we assumed the box is filled only if both predicted one-box. That was arbitrary. We could have other rules. The fragility is in the rule for filling the box. If we change the rule, the expected utility changes. Also, the assumption about independence and symmetric accuracy might be challenged.

  But the main fragility in the original case is the extreme difference in the amounts. If the opaque box only has $1,100 and the clear has $1,000, then two-boxing always gives at least $1,000 and sometimes $2,100, while one-boxing gives $1,100 only if predicted, so if the predictor is 95% accurate, one-boxing gives $1,045 on average and two-boxing gives 0.95*1000 (when empty) + 0.05*2100 = 950+105=1055, which is more. So then two-boxing is better by expected utility. So the lesson would collapse because both arguments (dominance and expected utility) would point to two-boxing. So we must have the opaque box value much larger than the clear box.

  Thus, case_fragility: 
     - If the clear box is too large relative to the opaque box (specifically, if the expected utility of two-boxing exceeds that of one-boxing), then the tension disappears because both arguments (dominance and expected utility) point to two-boxing.
     - If the predictor's accuracy is too low (e.g., 50%), then again two-boxing dominates by both arguments.

  Therefore, the case must have:
     - The opaque box value >> clear box value (so that the expected utility of one-boxing is higher than the expected utility of two-boxing).
     - The predictor(s) must be sufficiently accurate (so that the expected utility of one-boxing is higher).

  In the two-predictor case, we must design the filling rule and accuracies so that one-boxing has higher expected utility.

  But note: in the two-predictor case we used, one-boxing had $440,000 expected and two-boxing $91,000, so it holds.

  JSON:

  {
    "refuse_to_explain": [
      "Names of decision theories (e.g., causal vs. evidential)",
      "In-depth free will debate",
      "Mathematical expected utility beyond simple arithmetic",
      "The entire literature on Newcomb's problem"
    ],
    "check_for_understanding": "What is the core disagreement between someone who takes one box and someone who takes two boxes? (Expected answer: The two-boxer focuses on the fact that the boxes are already filled and thus your choice cannot change the content, so you should take both to get the extra $1,000. The one-boxer focuses on the correlation: if you take one box, it's likely the predictor put the money in, so you get more by taking one box. The disagreement is about whether to use dominance reasoning or expected utility reasoning in the face of correlation.)",
    "case_fragility": "If the clear box is too valuable (e.g., if it contains more than the expected gain from the opaque box given the predictors' accuracies) then two-boxing becomes the expected utility maximization as well, collapsing the tension. Also, if the predictor accuracy is too low (near 50%) the same happens. The case also breaks if the student realizes that the predictors' accuracies are not as described (e.g., if the student believes they can outsmart the predictors in a way not accounted for)."
  }
answer: |-
  ### Lesson Plan Table

  | Stage | What I actually do or say | Which earlier stage it leans on | Misconception it's placed to defuse | Minutes |
  |-------|---------------------------|--------------------------------|--------------------------------------|---------|
  | **1. Hook & Setup** | "Imagine you walk into a room with two boxes: one transparent (clearly holding $1,000) and one opaque. The opaque box *might* hold $1,000,000, but you can't see inside. You choose: take **only the opaque box** or **both boxes**. But here’s the catch: two supercomputers predicted your choice *before you entered*. Based on their predictions, the opaque box was either filled or left empty. Let me explain how these predictors work..." | None | None | 5 |
  | **2. Predictor Mechanics** | "Alpha watched a 30-second clip of you thinking aloud about this choice. For most people, Alpha is 95% accurate. But if you’ve studied decision theory (like this class!), Alpha drops to 55% accuracy because your clip just shows you 'theory-shopping.' Beta ignored your clip—it only analyzed your past records—and is 80% accurate for everyone. The boxes were filled based on *both* predictors: **the opaque box contains $1M only if *both* predicted you’d take only it.** Otherwise, it’s empty. Everything is already set—you’re just walking in." | Stage 1 | “The predictor sees the future” (emphasize predictors use *current evidence*, not time travel) | 7 |
  | **3. Initial Choice & Poll** | "Quick anonymous poll: Raise hands for one-box or two-box? Don’t overthink—go with your gut. [Poll, then ask:] Who’s willing to share *why* they’d grab one box? [Listen, then:] And why two boxes? [Note responses without debate.]" | Stages 1–2 | None (let misconceptions surface organically) | 5 |
  | **4. Two-Box Argument** | "The two-box reasoning seems obvious: *‘The boxes are sealed. My choice won’t change what’s inside. If I take both, I get $1,000 plus whatever’s in the opaque box. Why leave free money?’* This is **dominance reasoning**: two-boxing always gives you $1,000 more than one-boxing, no matter what’s in the opaque box." | Stage 3 | “The boxes are already full so take both” (validate this as logical, not a shrug) | 8 |
  | **5. One-Box Intuition** | "But consider: predictors are good. If you one-box, *both* likely predicted that, so the opaque box probably has $1M. If you two-box, they likely predicted that, so it’s probably empty. Expected value: One-box = high chance of $1M. Two-box = likely just $1,000. *‘Why risk $1M for $1,000?’* This is **correlation reasoning**: your choice *reveals* what predictors likely did." | Stage 4 | “One-boxing means my choice *causes* the prediction” (clarify: choice correlates, doesn’t cause) | 8 |
  | **6. Deepen Tension** | "Let’s test intuition with math. **One-box:** Chance both predictors correct? Alpha (55%) and Beta (80%) → 44% chance of $1M ($440k expected). **Two-box:** Chance both *wrong*? Alpha wrong = 45%, Beta wrong = 20% → 9% chance of $1M + $1k. Expected: $91k. *So why does dominance say ‘take both’ while math says ‘take one’?*" | Stage 5 | “This is just determinism again” (stress: predictors use data, not fate; free-will student can still engage) | 10 |
  | **7. Defuse Traps** | Address misconceptions explicitly: <br> - *“Can I trick predictors by deciding last-second?”* → "Alpha saw your reasoning clip; Beta knows your history. They don’t need live video." <br> - *“But if I two-box, won’t predictors be wrong?”* → "Yes, but remember: they set the box *before* you chose, based on their best guess. Your ‘trick’ is already in their data." <br> - *“Free will makes this pointless!”* → "Even with free will, predictors use *evidence* about you. Your choice still *correlates* with their prediction." | Stages 4–6 | “I’ll make up my mind last instant”; “Two-boxing forces predictors to be wrong”; “Free will settles everything” | 5 |
  | **8. Final Reflection** | "Don’t tell me your choice. Tell me this: **What’s the core disagreement between the one-boxer and two-boxer?** Is it about free will? Time travel? Or something else?" | All stages | None (diagnostic question) | 2 |

  ---

  ### JSON Summary
  ```json
  {
    "refuse_to_explain": [
      "Causal vs. evidential decision theory (avoid jargon)",
      "Omega/Newcomb lore (e.g., 'perfect predictor' tropes)",
      "Quantum mechanics or hard determinism",
      "Mathematical probability axioms (keep it intuitive)"
    ],
    "check_for_understanding": "What is the irreconcilable disagreement between a one-boxer and a two-boxer? (Key: Two-boxers see choice as powerless to affect the box; one-boxers see choice as evidence about the box.)",
    "case_fragility": "Three tweaks that collapse the dilemma: (1) Single 90% accurate predictor → expected value *always* favors one-boxing, weakening dominance intuition. (2) Clear box = $900k, opaque = $1M → two-boxing dominates even by expected utility. (3) Predictors see nothing → accuracy drops, making correlation irrelevant."
  }
  ```

  ### Why This Case Works
  - **Two predictors**: Prevents students from dismissing Alpha as "flawed" alone. The 55% accuracy for theorists forces them to grapple with their own "predictability."
  - **$1k vs. $1M**: Extreme stakes make dominance (two-box) *feel* reckless and correlation (one-box) *feel* rational. If amounts converge, the tension vanishes.
  - **Records + clip**: Blocks "last-instant choice" escapes—predictors use historical data, not just live feed.

  ### Pitfall Navigation
  - **Free-will insistence**: "Even if you *can* choose freely, predictors use *clues* about you. Does your history reflect your free choices? If so, they’re still accurate."
  - **"Boxes are full"**: Validate this! It’s the crux of two-boxing. Then pivot: "But if predictors are good, is your choice *independent* of the box?"
  - **Prediction = causation**: "Did your choice *make* the predictor right? Or did the predictor just guess well? Think: if you’d chosen differently, would their prediction change? No—it’s already set."
