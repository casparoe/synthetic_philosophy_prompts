prompt: |-
  i'm prepping a session for a sociology colleague who keeps saying epistemic injustice is just fancy talk for being ignored, and i want to walk her through why the hermeneutical kind is structurally different rather than personally rude. the specific idea i'm trying to get across doesn't have a clean name in the standard texts, so i'm calling it institutional hermeneutical smothering: it's the situation where a bureacratic vocabulary like welfare risk scores doesn't merely misrepresent someone's lived situation but actually renders that situation unformulable inside the system's own categories. i need a teaching plan for about forty minutes, not the lecture itself. tell me the exact order the pieces have to come in so she can see why being ignored misses the point—what has to land first before the structural claim even makes sense. pick one carring example built around algorithmic welfare eligibility and specify what that example must contain and what it absolutely must lack, otherwise it collapses into the computer is biased. then map the misconceptions she'll hit in sequence: first that this is testimonial injustice with extra steps, then that it requires malicious intent, then that fixing it just means giving her a voice. for each one say precisely where in the arc i should head it off before it hardens. i also want a single check at the end that proves she's grasped the structural unformulability part and hasn't just empathized with the applicant. be explicit about which part of Miranda Fricker's original framework i should deliberately leave out at this level and just admit i'm skipping it. please write everything in continuous prose only—no headings, bullet points, bold text, or tables, exactly like a long email—and don't include any reading lists or citations. there's a typo or two in this message but you get the idea.
reasoning: |-
  Okay, the user is preparing a session for a sociology colleague who dismisses epistemic injustice as just "fancy talk for being ignored." They want to clarify that hermeneutical injustice is structurally different, not merely personal rudeness. The key concept here is "institutional hermeneutical smothering," which they define as bureaucratic vocabulary making lived experiences unformulable within the system's categories. 

  The user needs a 40-minute teaching plan, not a lecture, with a specific order to ensure the structural point lands. They want one concrete example centered around algorithmic welfare eligibility, designed to avoid collapsing into simple "computer bias." The example must lack certain elements to maintain focus. 

  The user anticipates three misconceptions: conflating it with testimonial injustice, assuming malicious intent, and thinking solutions just require "giving voice." Each needs preemptive addressing at specific points. Finally, there should be a check for understanding structural unformulability, not just empathy. 

  The colleague likely has surface familiarity with Fricker but hasn't grappled with structural dimensions. Their frustration suggests impatience with academic jargon, so the plan must bypass theory-heavy language. The real need is to show how systems erase experiences even without individual prejudice—probably because they see this in welfare systems but lack tools to articulate it. 

  For the example, I'll choose an algorithmic welfare system using "financial vulnerability scores." The applicant has complex hardships—intermittent childcare, cash work, unstable housing—but the system only considers formal income and employment gaps. Crucially, the example must lack: 1) biased data (e.g., race/gender skews), 2) human adjudicators misjudging, and 3) technical glitches. The harm is that the categories themselves erase her reality; she can't even describe it in the system's terms. 

  The session must start with her concrete struggle to apply, making the colleague viscerally feel the applicant's frustration before analyzing why. Only after that discomfort lands can I introduce "unformulability" as the core problem. Then contrast with testimonial injustice by emphasizing no human ignored her; the system has no way to hear it. Preempt the "malicious intent" misconception right after by showing how well-intentioned designers built the categories. Finally, block the "give voice" idea by revealing that adding testimony fields wouldn't help—the logic can't process it. 

  For the check, I'll suggest having the colleague explain why the applicant couldn't rephrase her hardships to fit the system. If they focus on empathy or missing documents, they've missed it; they must note the system lacks concepts like "intermittent informal work." 

  I'll deliberately skip Fricker's "virtuous hearer" concept—it’s too individual-focused here. The point is institutional, not about listener ethics.
answer: |-
  Start by grounding this in the lived frustration of the welfare application process itself. Don’t begin with theory. Describe a specific applicant—let’s call her Anya—trying to navigate an online portal for emergency housing support. The system requires her to input data points: formal income, employment status, fixed address, childcare costs backed by licensed provider receipts. But Anya’s reality is jagged: she does intermittent cash cleaning for neighbors when her chronic pain allows, relies on a sister who sometimes watches her kids informally (unpaid, unlicensed), and couch-surfs between friends’ apartments after her lease ended. Every dropdown menu, every required field, rejects her attempts to accurately describe her situation. When she tries to explain in the "additional notes" box, her words feel irrelevant to the logic that calculates her "eligibility score." She isn’t *ignored*; she’s meticulously processed into ineligibility because her life can’t be translated into the system’s vocabulary. This example *must* contain the system’s rigid adherence to predefined, bureaucratically legible categories and Anya’s active but futile effort to communicate within them. It *must lack* any trace of skewed training data, biased algorithms, or prejudiced human gatekeepers—otherwise, it collapses into "bias," masking the deeper categorical failure.

  Once Anya’s visceral dead-end frustration is palpable, introduce the term "hermeneutical injustice" only as putting a name to *that* feeling of being unable to make your reality comprehensible within the authoritative framework. Immediately emphasize: this isn’t about Anya being *heard poorly* (testimonial injustice), but about her reality being *unintelligible* in the system’s language *before* anyone even listens. Head off the "testimonial injustice plus" misconception right here, before you even get deeper into structure. Clarify: "The system isn’t *distrusting* Anya’s testimony about her sister’s childcare. It literally has no field labeled ‘informal kinship care,’ no way to *register* that reality as a valid input impacting need. The injustice happens upstream of testimony."

  Next, pivot to the architects. Discuss the well-intentioned (but perhaps harried, resource-constrained) welfare agency team designing the algorithm and forms. Stress their goal was likely efficiency and consistency, not exclusion. This is where you preempt the "malicious intent" misconception. Drill down: "The smothering isn’t caused by anyone *wanting* to silence Anya. It’s caused by the *institutional choices* about what counts as valid data. Their categories (‘income,’ ‘employment,’ ‘childcare’) were built for administrative neatness, not for the messy realities of precarious lives. The harm is structural—it’s baked into the operational logic itself." Show how the system might even flag Anya for "inconsistency" because her narrative doesn’t fit the boxes, further entrenching her exclusion.

  Now introduce "institutional hermeneutical smothering" as your specific concept: the system’s own categorical framework actively prevents certain experiences from being formulated *at all* within its legitimate discourse. It’s not misrepresentation; it’s non-representation. Here, anticipate the "just give her a voice" solutionism. Head it off firmly: "Adding a bigger ‘tell your story’ text box, or even letting Anya speak to a caseworker *using the same bureaucratic framework*, doesn’t solve it. The caseworker is trained and bound by the same categories! Anya’s core struggles remain untranslatable. The system lacks the *concepts* to understand her, so ‘voice’ alone is insufficient. We need to challenge the conceptual architecture itself."

  For your check at the end, pose this scenario: Anya gets a sympathetic caseworker genuinely trying to help within the rules. The caseworker asks, "Can you rephrase your housing situation using terms from our dropdown list? Or provide different documentation?" Ask your colleague: *Why* is this well-meaning caseworker still fundamentally unable to help Anya get her reality recognized by the system? The correct grasp is revealed if she identifies that the *system’s categories themselves* (e.g., requiring stable address documentation Anya lacks by definition, or not recognizing intermittent cash work as valid income impacting stability) make Anya’s core vulnerabilities structurally unformulable. If she focuses only on the caseworker’s effort or Anya’s frustration, the structural point is missed. She needs to articulate the categorical gap.

  Deliberately leave out Fricker’s focus on the *virtues of the hearer* at this stage. Admitting you’re skipping it avoids muddying the waters: "Right now, we’re bracketing the individual listener’s responsibility or virtue. That’s crucial in testimonial injustice, but here the primary wrong originates in the system’s conceptual apparatus *before* it reaches any individual listener." This keeps the focus relentlessly on institutional structure, not interpersonal ethics. The arc—frustration without malice, categorical failure before testimony, structure over intent, insufficiency of voice, unformulability as the core—builds stepwise to make the "ignored" critique feel shallow by comparison.
