answer: |-
  Your analysis identifies a sophisticated and under-theorized move in ethical debates—what you aptly term the **normative-infrastructure register**. Below, I'll define this concept, differentiate it from adjacent ideas, propose a precise term, and outline its boundaries/misapplications.

  ---

  ### **Core Concept: Normative Infrastructure**
  The **normative-infrastructure register** evaluates individual acts by their impact on the *social, economic, or institutional systems* that enable or obstruct collective solutions to shared harms. An act is judged not by:  
  - Its **direct causal contribution** to harm/benefit (e.g., "My flight doesn't cause sea-level rise"),  
  - Its **expressive meaning** (e.g., "Flying signals apathy"),  
  - Or abstract **complicity** (e.g., "I’m part of a harmful system").  

  Instead, it asks: **Does this act reinforce or undermine the structures (expectations, markets, feedback loops) that make coordinated action feasible?**  

  **Examples from your cases:**  
  - The flyer claims her *offset purchases and advocacy* sustain carbon markets/policy momentum, making her consumption a "tax" funding systemic change.  
  - The meat-eater argues that *abstaining* disrupts normalization in her network, weakening social acceptance of factory farming.  

  ---

  ### **Proposed Term: Constitutive Participation**  
  To capture this, I coin **constitutive participation**:  
  > *An individual act is evaluated by its causal role in maintaining or destabilizing the material and normative preconditions for effective collective action toward a shared goal.*  

  #### **Key Mechanisms**  
  1. **Reinforcement/Destabilization**:  
     - Acts that *stabilize* harmful systems (e.g., buying meat funds factory farms’ lobbying power) or *destabilize* them (e.g., veganism erodes demand predictability).  
  2. **Feedback Loops**:  
     - Acts alter market signals (e.g., offsets boost green tech R&D), social expectations (e.g., flying normalizes high-emission lifestyles), or institutional incentives (e.g., voting shapes policy feasibility).  
  3. **Threshold Sensitivity**:  
     - Small changes can trigger tipping points (e.g., a critical mass abandoning meat shifts industry practices).  

  ---

  ### **Differentiation from Adjacent Concepts**  
  | Concept                 | Key Difference from Constitutive Participation |  
  |-------------------------|------------------------------------------------|  
  | **Social Norms (Contractualism/Game Theory)** | Focuses on compliance with mutually beneficial rules. Constitutive participation addresses *how* norms/institutions emerge, persist, or collapse—e.g., meat-eating isn’t just "breaking a rule" but actively replenishing a harmful norm’s social substrate. |  
  | **"Virtue Signaling"**  | Concerned with self-presentation. Constitutive participation requires *demonstrable impact* on external systems (e.g., offset funds must tangibly bolster climate infrastructure). Purely symbolic acts lack this. |  
  | **Structural Injustice** | Analyzes macro-level systems. Constitutive participation is *micro-macro bridge*: it shows how individual acts materially constitute structures (e.g., one person’s flight fees funding lobbyists that weaken regulations). |  
  | **Universalization**    | Tests maxims for generalizability. Constitutive participation is empirical: Would widespread adoption of the act *actually* change systems? (e.g., "If all flew like me *but* offset, would markets accelerate decarbonization?"). |  

  ---

  ### **Boundary Conditions & Misapplications**  
  **Valid Applications**  
  1. **Observability/Influence**: Acts must be perceptible to others to alter expectations or signals (e.g., public flight choices affect norms; secret offset donations do not).  
  2. **Proximate Systems**: The act must directly engage mutable structures (e.g., consumer markets, voting blocs)—not distant, immutable "systems" (e.g., "capitalism").  
  3. **Non-Proxy Justification**: The act cannot justify *direct harm* unless it demonstrably alters infrastructure (e.g., flying isn’t excused by vague "awareness-raising" without evidence of changed outcomes).  

  **Misapplications**  
  1. **Privatized Acts**: Claiming normative-infrastructure effects for *wholly private* acts (e.g., "I think pro-meat thoughts but donate to vegans")—no social signal exists.  
  2. **False Leverage**: Asserting influence on systems with no causal pathway (e.g., "My solitary vote in a safe seat shifts national discourse").  
  3. **Macro-Level Reduction**: Applying micro-logic to policy (e.g., "Don’t regulate flights; trust individuals to offset"—ignoring collective-action problems in voluntary schemes).  
  4. **Complicity Laundering**: Using "broader engagement" rhetoric to excuse participation in irredeemable harms (e.g., "I fund offsets while flying daily" in a carbon-constrained world).  

  ---

  ### **Philosophical Anchors**  
  While no exact term exists, constitutive participation draws from:  
  - **Searle’s institutional facts**: Acts gain meaning through collective acceptance.  
  - **Ostrom’s institutional design**: Micro-actions affect resource-governance feedback.  
  - **Young’s social connection model**: Individuals sustain structures through daily acts.  

  Its novelty lies in treating individual acts as *catalysts for systemic capacity*—neither drops in the ocean nor mere symbols, but levers in the machinery of collective agency.  

  This framework demands empirical rigor: When does an act *genuinely* reconstitute infrastructure? Without evidence, it risks becoming sophisticated apologetics. Yet properly applied, it captures a real dimension of ethical agency in complex systems.
