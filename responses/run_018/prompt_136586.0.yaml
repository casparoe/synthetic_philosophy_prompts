  hey so my flatmate bought this new wellness ring, not just the sleep tracking kind but one that sends little electric pulses through your skin when its AI thinks you've done something worthwhile. he started using it to quit doomscrolling, but now he just sits in his chair all day getting these pulses and says he's happier then he's ever been. he told me I'm a sucker for chasing real world achievements while he's hacked his own reward system. I feel like there's a catch - like if the feeling comes from a gadget and not from actually doing anything, it shouldnt count as proper happiness? but I cant explain why. is he wrong, or am I just being old fashioned? please explain the philosophical thing that's actually going on here, using british english, and dont tell me to read books - I just want to understand the idea.
