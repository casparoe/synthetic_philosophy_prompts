  I recall Aristotle's eudaimonia versus hedonia. Hedonic pleasure is fleeting, while eudaimonic happiness comes from meaningful actions. The ring provides the former without the latter. Then there's Skinner's operant conditioning - the ring acts like a reinforcement machine, similar to training animals. 

