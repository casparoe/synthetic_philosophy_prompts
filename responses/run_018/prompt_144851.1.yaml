prompt: |-
  I'm a software engineer with no formal philosophy background, and I'm trying to map out the debate on prioritarianism versus the leveling-down objection without relying on encyclopedia summaries. To keep the question concrete, frame it through distributed resource allocation: imagine a fixed compute budget distributed across AI systems with different baseline performance scores. We could improve the worst-performing system, leave everything alone, or deliberately degrade a high-performing system—for instance, by constraining its weights—to achieve parity in capability scores without any corresponding gain for the worse-off system.

  Please construct a decision tree that sorts the philosophical positions on this issue. Start at the root with the concrete judgment: is it ever permissible or good to reduce the well-performing system's capabilities solely to equalize scores, when the poorly-performing system does not benefit? From there, branch through diagnostic claims: does moral priority depend solely on absolute welfare or also on relative position? Does the "separateness of persons" block harming one party merely to close a gap? Is equality valuable only instrumentally, or also non-instrumentally? Does the scale of the disparity change whether leveling is obligatory, permissible, or forbidden?

  Each leaf should be a named or clearly-described position—pure prioritarianism, weighted prioritarianism with an equality floor, strict egalitarianism, sufficientarian prioritarianism, anti-leveling prioritarianism, or an unnamed combination—plus one sentence stating its most awkward commitment in this compute-allocation framing. Note any pair of positions the tree cannot separate cleanly. Also identify any logically possible combination of branch answers that seems unoccupied, and briefly say whether it looks incoherent, unattractive, or merely unexplored. Keep the instrument to about six to eight branch nodes and no more than ten leaves, with no requests for bibliographies, reading lists, or philosopher citations; I need this to work offline.
