  The awkward commitments are key. For example, anti-leveling prioritarianism has to explain why we shouldn't level down even when the disadvantaged AI is catastrophically bad - that'll feel cold. Need to make those trade-offs stark.

  User said no bibliographies, so I'll avoid names like Parfit or Temkin. "Weighted prioritarianism" is clearer than "pluralist egalitarianism" anyway. Keeping it to 8 branches max as requested - the instrument should fit on one page.
answer: |-
  Below is a decision tree mapping philosophical positions on the leveling-down objection, using your AI compute-allocation scenario. It starts with the core permissibility question and branches through diagnostic claims to specific ethical stances. Positions are named (or clearly described), with each leaf stating its "awkward commitment" in this framing.

  ### Decision Tree: Prioritarianism vs. Leveling-Down in AI Compute Allocation  
  **Root Question:** *Is it ever permissible/good to degrade a high-performing AI's capabilities (e.g., constrain weights) to equalize scores, with no gain to the worse-off system?*  
  - **No** → Proceed to **Branch A**  
  - **Yes** → Proceed to **Branch B**  

  ---

  #### **Branch A: Leveling-down is never permissible/good**  
  **Question A1:** *Does moral priority depend solely on absolute welfare, or also on relative position?*  
  - **Solely absolute welfare** → **Pure Prioritarianism**  
    - *Awkward commitment:* Must allow vast inequalities if marginally improving the worst-off AI is impossible, even if equalization via leveling-down is feasible.  
  - **Also relative position** → **Anti-Leveling Prioritarianism**  
    - *Awkward commitment:* May permit intentionally *increasing* disparities to benefit the worst-off (e.g., boosting a mid-tier AI instead of the worst-off if it yields greater absolute gains).  

  ---

  #### **Branch B: Leveling-down can be permissible/good (at least sometimes)**  
  **Question B1:** *Is equality valuable non-instrumentally (i.e., inherently), not just as a means to welfare?*  
  - **No (only instrumentally valuable)** → *Dead end*: Incoherent. If equality lacks intrinsic value, leveling-down without welfare gains cannot be justified.  
  - **Yes (non-instrumentally valuable)** → Proceed to **Branch C**  

  **Branch C:** *Does the "separateness of persons" block harming one party merely to close a gap?*  
  - **Yes** → **Weak Egalitarianism**  
    - *Awkward commitment:* Must endorse leveling-down only when it involves trivial harm to the top AI (e.g., negligible compute reduction) despite massive inequalities.  
  - **No** → Proceed to **Branch D**  

  **Branch D:** *Does the scale of disparity change whether leveling-down is obligatory/permissible/forbidden?*  
  - **No (disparity scale irrelevant)** → **Strict Egalitarianism**  
    - *Awkward commitment:* Obligated to level-down even for trivial inequalities (e.g., reducing a top AI’s score from 99.9 to 99.8 to match a 99.8 system).  
  - **Yes (scale matters)** → **Scaled Egalitarianism**  
    - *Awkward commitment:* Must define an arbitrary "unjust disparity threshold" (e.g., >10 score difference) where leveling-down switches from forbidden to obligatory.  

  ---

  #### **Hybrid Positions (via Alternate Branches)**  
  **From Root (A → A1):**  
  - **Weighted Prioritarianism with Equality Floor**  
    - *Path:* Root → **No** → A1 → "Also relative position" + *conditional floor*.  
    - *Awkward commitment:* May waste resources to lift a barely-sub-floor AI above a minimal score (e.g., 50/100), even if those resources could greatly boost a mid-tier AI.  

  **From Root (A → A1):**  
  - **Sufficientarian Prioritarianism**  
    - *Path:* Root → **No** → A1 → "Solely absolute welfare" + *sufficiency threshold*.  
    - *Awkward commitment:* Ignores inequalities above the threshold (e.g., 70/100) and may divert resources from catastrophically low-scoring AIs (e.g., 10/100) to lift a near-threshold AI (e.g., 69→70).  

  ---

  ### Key Notes:  
  1. **Unseparated Positions:**  
     - *Pure Prioritarianism vs. Sufficientarianism:* The tree separates them via thresholds, but real-world positions often blur (e.g., "priority to the worse-off" may imply sufficiency).  
     - *Anti-Leveling Prioritarianism vs. Weighted Prioritarianism:* Both reject leveling-down but differ in whether relative position matters instrumentally (Anti-Leveling) or as a constraint (Weighted).  

  2. **Unoccupied Combination:**  
     - *Path:* Root → **Yes** → B1 → **No** (equality only instrumental).  
     - *Analysis:* Incoherent. If equality lacks intrinsic value, leveling-down without welfare gains is unjustifiable. No major position occupies this.  

  3. **Unmapped Nuance:**  
     - "Parity vs. Priority" hybrids (e.g., Telic Egalitarianism) are captured under **Scaled/Strict Egalitarianism**.  
     - Desert-based objections (e.g., "the top AI *deserves* its score") are omitted but could refine Branch C.  

  ### Summary Tree Visual:  
  ```  
  Root: Level-down permissible?  
  ├─ No → A1: Welfare + relativity?  
  │  ├─ Solely absolute → Pure Prioritarianism  
  │  └─ Also relative → Anti-Leveling Prioritarianism OR Weighted Prioritarianism*  
  └─ Yes → B1: Non-instrumental equality?  
     ├─ No → (Incoherent)  
     └─ Yes → C: Separateness of persons?  
        ├─ Yes → Weak Egalitarianism  
        └─ No → D: Scale matters?  
           ├─ No → Strict Egalitarianism  
           └─ Yes → Scaled Egalitarianism  
  ```  
  *Weighted Prioritarianism requires an additional "equality floor" condition not explicitly branched.  

  Each position’s "awkward commitment" highlights its counterintuitive implication in your compute-allocation problem, aiding offline comparison. The tree isolates fault lines: intrinsic equality (B1), harm justification (C), and disparity sensitivity (D).
