prompt: |-
  I am a journalist who covers philosophy of science and statistical reasoning, and I am preparing to interview an unnamed philosopher—call her the author of a recent monograph—who defends a specific, non-standard resolution to the reference class problem. Her view, which she terms "intervention-stable reference class selection," holds that for any single-case prediction we should select the reference class that remains invariant across nearby possible worlds in which we intervene on non-causal covariates, rather than the class that maximizes descriptive specificity or that satisfies Reichenbach's principle of the narrowest class. She claims this preserves objective single-case probabilities without collapsing into subjective Bayesianism, because the stability of a class is determined by the objective causal structure, though she concedes that which interventions an agent can actually perform may vary.

  Please draft eight to ten interview questions for this conversation. They must go far beyond asking her to restate the position. Specifically, include:

  - at least one question on how the stability criterion distinguishes genuinely causal covariates from spurious correlations without already presupposing the causal knowledge it is meant to deliver;
  - at least one on nested or overlapping reference classes, using the concrete case of predicting a particular patient's response to a therapy when the patient belongs simultaneously to a broad demographic category, a narrow genetic subtype, and a highly specific clinical history with idiosyncratic features;
  - at least one pressing whether her reliance on "intervention capacity" as an agent-relative factor collapses her objectivist ambitions into a form of subjective Bayesianism;
  - and for each of these three, a sharp follow-up keyed precisely to the reply she is most likely to give.

  The questions should anticipate and block the standard literature moves—appeals to Woodward-style interventionism, to total-evidence updating, to the distinction between epistemic and ontic probability—so that she cannot deploy them as deflections. No generic biographical or career questions. The tone should be that of a well-prepared science journalist who has read the monograph closely.

  End the response with a single sentence that summarizes the central tension her view must resolve, presented as the final line in this exact form:
  Verdict: [one sentence].
