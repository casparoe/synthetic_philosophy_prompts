  For structure, I'll start with a bold recommendation in "Bottom Line" that satisfies nursing's operational needs while giving legal concrete guardrails. Then show how each stance illuminates different aspects of the March incident - especially how intentional language captures the nurse's decision pathway. 

  The replay numbers matter because they demonstrate intentional framing isn't just metaphor - it has predictive validity where purely mechanical descriptions fail. I'll counter engineering's objection by comparing SENTRY to chess algorithms: even deterministic systems require belief-attribute explanations for human users. 

  Strongest counterargument is absolutely the legal risk. A jury hearing "SENTRY thought" could assign inappropriate blame. But I'll argue the greater risk is nurses distrusting all alerts if reports feel disconnected from clinical reality. 

  Pilot conditions should start with sepsis cases only, requiring documented reviewer disagreement logs. And we must clarify this isn't about blame assignment - just learning. 

