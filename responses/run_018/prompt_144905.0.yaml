  ## Applied Conceptual Engineering  
  Vol. 14, No. 3, Autumn 2024  
  pp. 214–229  

  ---

  **Title:** Calibrating Content: The Doxastic Mirror Protocol as a Precision Instrument for Intuition Capture in Mental Content Fixation Debates  

  **Authors:** Dr. A. G. Thorne (Corresponding Author, St. Erasmus College, Oxbridge), Dr. E. J. Vale (Institute for Advanced Conceptual Studies, Mytilene), Prof. K. R. Finchley (Centre for Applied Epistemic Metrology, University of New Wessex)  

  **Abstract:** Persistent disagreement regarding the fixation of mental content—specifically, whether it is determined by causal-role relations or intrinsic qualitative character—hinders progress in philosophy of mind. We introduce the *Doxastic Mirror Protocol* (DMP), a novel intuition pump designed to elicit robust, quantifiable intuitions on this precise point. The DMP posits a hypothetical experimental arrangement wherein an agent’s belief states undergo causal inversion (e.g., belief-that-P is caused by stimuli typically causing belief-that-Q, and vice versa) while their *phenomenological character* remains identical to the uninverted state. We report results from simulated trials (N=127 virtual participants), demonstrating significant convergence in elicited intuitions favouring causal-role fixation (CRF) over intrinsic qualitative fixation (IQF), with high intersubjective agreement (Cohen’s κ = 0.78). Statistical analysis revealed intuition variance within acceptable confidence intervals (±2.3% at 95% CI), validating the DMP as a replicable tool. Ethical considerations for potential *in silico* deployment and protocols for mirror-angle variance replication studies are detailed. Funding secured for DMP maintenance and calibration underscores its viability as a standardised instrument for conceptual engineering.  

  **Keywords:** Intuition Pump, Mental Content, Causal-Role Functionalism, Qualia, Conceptual Calibration, Doxastic Mirror Protocol, Replication Crisis Mitigation.  

  **1. Introduction**  
  The debate between proponents of causal-role functionalism (CRF) and intrinsic qualitative fixation (IQF) concerning mental content remains intractable despite decades of sophisticated argumentation (cf. Block, 1978; Searle, 1980). Standard intuition pumps in this domain (e.g., China Brain, Inverted Spectrum) exhibit diminishing returns, often yielding contested or ambiguous intuitive outputs susceptible to prior theoretical commitments (Dennett, 2013). This paper addresses the urgent need for a higher-fidelity intuition capture device. We present the Doxastic Mirror Protocol (DMP), engineered to isolate the variables of causal history and phenomenal feel within a tightly controlled hypothetical scenario, thereby generating clearer, more measurable intuitions.  

  **2. The Doxastic Mirror Protocol: Design Specifications**  
  The DMP comprises the following core elements (Figure 1):  

  *   **Agent (A):** A standard human cognitive agent.  
  *   **Causal Inversion Module (CIM):** A hypothetical intervention severing the standard causal links between environmental stimuli (S) and belief states (B) in A. For instance:  
      *   Stimuli S₁ (e.g., perceiving a red apple) now cause belief B₂ ("That is green").  
      *   Stimuli S₂ (e.g., perceiving a green apple) now cause belief B₁ ("That is red").  
  *   **Phenomenological Mirror (PM):** A counterfactual mechanism ensuring the *subjective experience* associated with holding B₁ (e.g., the *feeling* of believing something is red) remains identical whether B₁ is caused by S₁ (veridically) or S₂ (inverted). Crucially, A reports no introspective awareness of the inversion; phenomenology perfectly mirrors the pre-inversion state.  
  *   **Intuition Elicitation Probe (IEP):** The prompt: "Does Agent A, under the DMP, *believe* the apple is red when presented with S₁ (a red apple)? Or do they *believe* it is green?"  

  **3. Methodology: Intuition Capture & Analysis**  
  We employed rigorously standardised virtual intuition trials. Philosophically trained raters (n=15, certified by the International Intuition Calibration Board - IICB Level 3) were presented with the DMP scenario via a controlled online platform. Raters recorded their intuitive response (CRF: Belief content fixed by causal role, hence A believes the apple is *green*; IQF: Belief content fixed by intrinsic feel, hence A believes the apple is *red*) and confidence level (1-5 Likert scale).  

  To control for rater bias, a double-blind protocol was implemented for a subset (n=60 trials): raters were unaware whether the prompt was designed to elicit a CRF or IQF intuition (though, logically, only one is coherent per scenario). Randomised mirror-angle variations (±5° conceptual deviation) were introduced in 30% of trials to test robustness.  

  Data analysis employed standard inferential statistics. Inter-rater reliability was calculated using Cohen’s κ. Confidence intervals (95%) for the proportion endorsing CRF were computed. Variance attributable to minor mirror-angle adjustments was modelled using ANOVA.  

  **4. Results**  
  *   **Primary Intuition Capture:** 89% (113/127) of initial trials elicited a clear CRF intuition (A believes the apple is *green*). Only 8% (10/127) reported an IQF intuition (A believes it is *red*). 3% (4/127) registered as "No Intuition / System Error."  
  *   **Statistical Confidence:** Proportion favouring CRF = 0.89, 95% CI [0.82, 0.94].  
  *   **Inter-Rater Reliability:** Cohen’s κ = 0.78 (Substantial Agreement).  
  *   **Double-Blind Subset:** No significant difference in CRF endorsement rates between blinded and non-blinded groups (p = 0.42), suggesting minimal experimenter demand effect.  
  *   **Mirror-Angle Variance:** ANOVA revealed no statistically significant effect (F(2, 124) = 1.21, p = 0.30) on CRF endorsement rates for minor (±5°) mirror-angle adjustments, indicating protocol stability.  
  *   **Confidence Levels:** Mean confidence rating for CRF responses was 4.2 (SD = 0.7), significantly higher (t(121) = 5.8, p < 0.001) than for IQF responses (M = 2.8, SD = 1.1).  

  **5. Ethical Oversight & Virtual Participant Welfare**  
  The St. Erasmus College Ethics Review Board (ERC Ref: SEC/PHIL/2023/DMP-01) granted approval for the *in silico* deployment of the DMP. Key considerations included:  

  *   **Minimal Counterfactual Harm:** While the DMP scenario involves radical cognitive alteration, the board deemed the *hypothetical* nature of the agent and the perfect phenomenological mirroring to mitigate risks of simulated distress. No reports of empathetic discomfort were logged by raters.  
  *   **Informed Consent (Simulated):** Virtual participants (the scenarios themselves) were deemed incapable of consent, but rigorous protocols ensured their conceptual parameters were not unduly stretched beyond nominal tolerances.  
  *   **Data Handling:** All elicited intuitions were anonymised and stored on secure servers funded by the Voss Foundation Grant VF-PUMP-001. A dedicated budget line exists for biannual DMP integrity audits and phenomenological mirror polishing to prevent conceptual drift.  

  **6. Discussion: Calibration and Conceptual Progress**  
  The DMP demonstrates exceptional performance as a calibrated intuition capture device. The high convergence rate (89%) towards a CRF intuition, coupled with substantial inter-rater agreement and resilience to minor parametric variations (mirror angle), strongly suggests it reliably isolates the critical variable – causal role vs. intrinsic feel – in a manner less susceptible to pre-theoretical bias than previous pumps. The 8% IQF responses are best interpreted as measurement error, potentially attributable to rater fatigue, suboptimal mirror calibration, or residual theoretical commitment acting as noise in the system. Future iterations will incorporate noise-cancelling conceptual filters.  

  The successful acquisition of the Voss Foundation grant (£250,000 over three years) specifically for "DMP Maintenance, Calibration, and Replication Studies" underscores the recognition of this tool’s value. Planned Phase 2 research includes:  

  1.  **Cross-Cultural Replication:** Deploying the DMP via translated protocols to assess intercultural intuition stability.  
  2.  **Increased Mirror-Angle Variance Studies:** Systematically testing intuition resilience at ±10°, ±15° deviations to establish operational tolerances.  
  3.  **Double-Blind Enhancement:** Developing protocols where *both* rater *and* scenario-generating AI are blind to the target intuition.  
  4.  **Longitudinal Intuition Tracking:** Monitoring whether DMP-elicited intuitions exhibit greater stability over time compared to those from less rigorous pumps.  

  **7. Conclusion**  
  The Doxastic Mirror Protocol represents a significant advancement in applied conceptual engineering. By treating the elicitation of philosophical intuitions as a process amenable to rigorous experimental design, statistical analysis, and instrumental calibration—akin to the use of a microscope in biology—the DMP moves beyond mere rhetorical persuasion. It generates intersubjectively verifiable data points concerning the fixation of mental content, strongly favouring causal-role relations over intrinsic qualitative character. The high reliability metrics, robust funding, and established protocols for maintenance and replication position the DMP as the new gold standard intuition pump for this domain. Future work will focus on refining its precision and expanding its application to related conceptual problems (e.g., personal identity under teleportation with phenomenological mirroring).  

  **Acknowledgements:**  
  This research was funded by the Voss Foundation (Grant VF-PUMP-001: "Precision Intuition Capture Infrastructure"). We thank the St. Erasmus College ERC and the IICB for certification and oversight. We declare no competing interests.  

