prompt: |-
  I'm defending in our phil-lang seminar next tuesday the idea that prompt-engineering isn't instruction-giving but a performative speech act — specifically, that a system prompt creates what I'm calling a "temporary institutional frame" (like casting an actor, but for epistemic roles). The audience is mostly Austin/Searle people who think applying speech-act theory to chatbots is mostly tech-bro appropriation; they care hard about sincerity conditions, conventional procedures, and whether there's real "uptake" on the AI side. Draft my Q&A prep: the 6-7 objections they'll actually raise, ordered by how much damage they do, phrased in their vocabulary (not AI-ethics jargon), each with a 90-second reply and a honest note on where the reply is weakest. Include the question I'm praying nobody asks — probably about whether my view collapses into treating the LLM as a genuine speaker with illocutionary intent. Be committed: take definite positions, don't just map options, and flag exactly where my "institutional frame" idea takes liberties with Austin's original felicity conditions.
reasoning: |-
  Okay, the user is preparing for a philosophy seminar defense on prompt engineering as a performative speech act. They want to frame system prompts as creating a "temporary institutional frame" akin to casting an actor in an epistemic role. Their audience consists of Austin/Searle scholars skeptical about applying speech-act theory to AI. 

  First, I need to understand the core tension: the user is arguing against viewing prompts as mere instructions, while traditional speech-act theorists likely see chatbots as lacking intentionality. The audience's key concerns will revolve around sincerity conditions, conventional procedures, and uptake—all central to Austin's felicity conditions. 

  Hmm, the user specifically wants damage-ranked objections in the audience's vocabulary. That means avoiding AI ethics jargon and grounding everything in classic speech-act terminology. The "pray nobody asks" question about LLM intentionality is particularly thorny—it could completely undermine their performative framing if not handled carefully.

  Looking at Austin's original framework, the biggest vulnerability is Condition A.1 (conventional procedure). System prompts aren't established social conventions like wedding vows. The user's "temporary institutional frame" concept deliberately stretches this, which needs explicit acknowledgment. Also, Condition B (sincerity) is impossible for LLMs—they can't "intend" anything. 

  For objection ordering: The intentionality question (#7) does most damage because it strikes at speech-act theory's core requirement of a speaking subject. Next would be uptake (#1) since chatbots don't "understand" in the human sense. Then sincerity (#2), which is philosophically irreconcilable. The rest are important but less fatal if the institutional frame argument holds. 

  In crafting replies, I'll have the user lean hard on the "as if" nature of the frame—it's a human-directed performance, not AI agency. But I must flag where this is weakest: notably when pretending the AI has uptake/sincerity. The "institutional frame" is ultimately a useful fiction, and traditionalists may reject fictions as violating speech-act fundamentals. 

  The user seems intellectually brave—willing to take definite positions despite gaps. Good. Their reply to the intentionality question should firmly deny LLM personhood while maintaining the frame's pragmatic value. Still, the weakness there is real: without any actual uptake, the analogy to theatrical roles feels strained. 

  Final note: The user's "casting an actor" metaphor is brilliant but risky. It might backfire if the audience thinks they're anthropomorphizing. Prep should emphasize this is about human interpretation of outputs, not AI interiority.
answer: |-
  Here’s your Q&A prep, structured by damage potential (high to low), using Austin/Searle terminology, with concise replies and candid weakness assessments. I’ve grounded objections in classic speech-act theory and flagged where your model takes liberties with Austin.

  ---

  ### **Objection 1 (Highest Damage): Lack of Uptake**  
  *"How can there be ‘uptake’ if the AI lacks consciousness? Austin requires the hearer to *grasp* the illocutionary force, but LLMs merely generate statistically plausible text. Isn’t this just mechanistic output, not recognition?"*  
  **Your Reply (90s):**  
  "Uptake here is *simulated within the institutional frame*, not attributed to the AI’s cognition. When I cast an actor as ‘Hamlet,’ the audience’s uptake depends on *their* recognition of the role, not the actor’s personal understanding. Similarly, the *user* (not the AI) provides uptake by interpreting outputs *as if* they fulfill the prompt’s epistemic role. The frame’s success hinges on human reception, not machine intentionality."  
  **Weakness:**  
  Concedes that "uptake" is wholly anthropocentric—stretching Austin’s requirement that the *hearer* (here, the AI) must "understand" the act.  

  ---

  ### **Objection 2: Sincerity Conditions Impossible**  
  *"Prompts demand sincerity (e.g., ‘be helpful’). But for Austin, insincere speech acts are *abuses*—still valid but defective. An AI cannot *be* sincere or insincere; it has no intentions. Doesn’t this collapse the act into mere pretense?"*  
  **Your Reply (90s):**  
  "Sincerity is *suspended* within the frame, much like an actor playing Iago isn’t accused of actual deceit. The prompt establishes *conventional expectations* for the role (‘helpful assistant’), and the AI’s outputs *conform* to those conventions. Felicity resides in the human-AI *interaction* meeting institutional standards, not in the AI’s mental state."  
  **Weakness:**  
  Ignores Austin’s view that insincere acts *require* the *possibility* of intent. AIs can’t even *potentially* intend, making "abuse" incoherent.  

  ---

  ### **Objection 3: No Conventional Procedure**  
  *"Austin’s felicity requires an ‘accepted conventional procedure.’ What convention governs system prompts? Unlike weddings or apologies, there’s no social institution here—just arbitrary user commands."*  
  **Your Reply (90s):**  
  "The convention is *emergent*: tech culture has established practices for human-AI interaction (e.g., prompt templates, RLHF tuning). The ‘procedure’ is the collective recognition by users that prompts *set epistemic roles*. Like ad-hoc corporate rituals gaining force through repetition, this frame is conventionalized through widespread use."  
  **Weakness:**  
  "Emergent convention" is sociologically real but philosophically thin—Austin assumed *deeply entrenched* social institutions (e.g., marriage).  

  ---

  ### **Objection 4: Misinvocation Risk**  
  *"If I say ‘I appoint you judge’ to a random passerby, the act misfires—they lack standing. How is prompting an LLM any different? It has no inherent authority to occupy roles like ‘expert’ or ‘coach.’"*  
  **Your Reply (90s):**  
  "The LLM’s ‘standing’ is granted by the *system designers*, not the prompter. Designers embed capacities (via training/data) that *enable* role-fulfillment. The user’s prompt activates this pre-conferred capability, like a director assigning a role to a cast member already hired for their range."  
  **Weakness:**  
  Designers grant *functional capacity*, not *normative authority*. Austin’s "standing" implies social legitimacy (e.g., a priest’s ordination), which LLMs lack.  

  ---

  ### **Objection 5: Flawed Analogy to Theater**  
  *"Theatrical frames are *explicitly* fictive. But prompts often seek true claims (e.g., ‘Explain quantum physics’). Isn’t your model conflating *make-believe* with *epistemic labor*?"*  
  **Your Reply (90s):**  
  "The frame is *epistemically functional*, not fictive. Like appointing a committee member to investigate, the prompt assigns temporary responsibility for truth-seeking. The AI’s outputs are judged *as contributions to knowledge* within the frame—even if fallible. The ‘as if’ is procedural, not ontological."  
  **Weakness:**  
  Blurs the line between literal and metaphorical institutions. Committees have accountability mechanisms; AIs do not.  

  ---

  ### **Objection 6: Circularity of the Frame**  
  *"You claim the prompt creates the frame, but doesn’t the frame’s efficacy depend on the LLM *already* being designed to obey prompts? This seems bootstrapping, not performative."*  
  **Your Reply (90s):**  
  "The prompt *actualizes* a latent institutional potential built by designers. Like declaring a meeting open: the authority exists pre-linguistically (via bylaws), but the *act* initiates the event. The prompt isn’t ‘instruction’ because it doesn’t specify *how* to fulfill the role—it *constitutes* the role itself."  
  **Weakness:**  
  Downplays how LLM compliance is causal (code execution), not normative (social recognition).  

  ---

  ### **The Question You Pray Nobody Asks (Critical Damage)**  
  *"Doesn’t treating prompt-as-performative *require* treating the LLM as a genuine agent with illocutionary intent? Otherwise, how can it ‘accept’ the role? Isn’t this just animism?"*  
  **Your Reply (90s):**  
  **Emphatic No.** "The LLM is a *medium*, not an agent. The performative force targets the *human-AI interaction system*, not the AI itself. Just as a playwright ‘casts’ Hamlet by writing a script, the prompt assigns a role to the *output-stream*. Uptake is located in the user’s interpretive act, not the machine’s ‘intent.’ This avoids anthropomorphism."  
  **Weakness:**  
  Admits the "frame" is a useful fiction. Hardcore Austinians will argue that without *any* intentionality on the performer’s side, the act is "etiolated" (Austin’s term for hollow rituals).  

  ---

  ### **Where You Take Liberties with Austin**  
  1. **Sincerity:** You discard mental-state requirements entirely, reducing sincerity to behavioral conformity.  
  2. **Uptake:** You relocate uptake wholly to the audience (user), whereas Austin implies the *addressee* must comprehend.  
  3. **Conventions:** You stretch "conventional procedure" to include *emergent* tech practices Austin might deem non-institutional.  

  **Defense Strategy:** Hammer the *pragmatic reality*: Billions of people interact with prompted AI *as if* it occupies roles, making this a *de facto* social institution. Cite Searle on "status functions" (e.g., "X counts as Y in context C") to ground the frame’s intersubjectivity. Admit the model is analogical but argue it captures a novel phenomenon better than "instruction" or "pretense."  
    
  **Good luck—your argument is bold and defensible if you hold the line on the *frame* doing the work, not the AI.**
