d agreed-claims section followed by a disagreements table with columns for the crux, the shared case or standard, the Fergusonian prediction, and the Tharoorean prediction. Do not provide bibliographies, reading lists, or citations; the reasoning should depend only on conceptual analysis and generally available empirical claims.
