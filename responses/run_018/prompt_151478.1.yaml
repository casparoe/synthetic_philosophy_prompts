answer: |-
  Here's a taxonomy handout designed around concrete choices, with logical gaps flagged. Slime mold included per request! (Casual typos intentional to vibe-check.)

  ---

  **Taxonomy of Moral Status Views: Follow Your Gut (Not the Footnotes)**  
  *Answer these concrete questions to find your "type" – no philosopher names required.*

  **START HERE: Q1 - Can moral status come in DEGREES?**  
  *(e.g., is something/someone always either "full status" or "zero status", or can it be "partial status"?)  
  → **No** (Binary status only!) → Go to Q2  
  → **Yes** (Status can be partial!) → Go to Q3  

  **Q2 (Binary Folks): Does a HONEYBEE deserve *any* moral status?**  
  *(Assume it avoids damage via distributed sensors, no central "pain center".)*  
  → **No** → You lean **STRICT MATERIALIST BINARY**: Status requires centralized consciousness (maybe human-like brains only?).  
  → **Yes** → You lean **CAPACITY-BINARY SENTIENTISM**: Any being that can suffer (even simply) gets *full* moral status.  

  **Q3 (Gradualists): Does a SMART THERMOSTAT deserve *partial* status?**  
  *(It learns patterns, predicts needs, avoids "damage" like power surges – but no feelings.)*  
  → **Yes** → Go to Q4  
  → **No** → Go to Q5  

  **Q4: Does a SLIME MOLD solving a maze deserve *partial* status?**  
  *(It's one colony acting as a distributed problem-solver, no brain, just oozing intelligence.)*  
  → **Yes** → You're likely a **FULL FUNCTIONALIST GRADUALIST**: Moral status scales with goal-directed complexity/cognition, even without felt experience.  
  → **No** → **EMPTY BRANCH!** *Diagnosis: Unattractive?* Why give status to a thermostat (simple tool) but not a problem-solving organism? Few hold this consistently.  

  **Q5 (Thermostat = No Status): Does the HONEYBEE deserve *partial* status?**  
  *(Same as Q2 – distributed nociception, no central brain.)*  
  → **Yes** → Go to Q6  
  → **No** → **EMPTY BRANCH!** *Diagnosis: Incoherent?* You said status *can* be partial (Q1), but deny it to both thermostats AND insects. What *would* get partial status?  

  **Q6: Does a HUMAN SLEEPWALKER have *less* moral status than an awake human?**  
  *(They perform complex actions but lack conscious awarness/recall.)*  
  → **No** → You lean **SENTIENTIST GRADUALIST**: Status scales with richness of *sentience* (feeling/suffering). Bees get partial (simple pain), sleepwalkers get full (potential/type).  
  → **Yes** → You're a **WEIRD HYBRID: Emergent Status Thresholdism**. Full status needs *integrated* consciousness (sleepwalker loses it temporarily?), partial for complex systems like bees/slime molds. Thermostats fail.  

  **Q7 (From Q1 "No" + Q2 "Yes"): Does the SLEEPWALKER have *full* status?**  
  → **Yes** → You're **CAPACITY-BINARY SENTIENTISM** (Same as Q2 path). Suffering-capacity = full status. Sleepwalker retains it.  
  → **No** → **EMPTY BRANCH!** *Diagnosis: Unexplored/Practically Untenable?* You grant bees status but deny it to a human. Who protects the sleepwalker?  

  ---

  **Leaf Summary:**  
  1. **Strict Materialist Binary**: Status = human-like brain (Centralized). (Q1 No → Q2 No)  
  2. **Capacity-Binary Sentientism**: Any suffering-capacity = FULL status. (Q1 No → Q2 Yes OR Q1 Yes → Q3 No → Q5 Yes → Q6 No)  
  3. **Sentientist Gradualism**: Status scales with richness of sentience. (Q1 Yes → Q3 No → Q5 Yes → Q6 No)  
  4. **Full Functionalist Gradualism**: Status scales with goal-directed complexity. (Q1 Yes → Q3 Yes → Q4 Yes)  
  5. **Emergent Status Thresholdism (Hybrid)**: Partial for distributed cognition (bees/slime molds), FULL *only* for integrated consciousness. (Q1 Yes → Q3 No → Q5 Yes → Q6 Yes)  

  **Key Gaps Flagged:**  
  - Thermostat "Yes" + Slime Mold "No" (Q4): Unattractive asymmetry.  
  - Thermostat "No" + Insect "No" (Q5): Incoherent gradualism.  
  - Bee "Yes" + Sleepwalker "No" (Q7): Ethically unstable.  

  ---
  **Handout Notes:**  
  * Why concrete cases? Forces consistency beyond labels.  
  * Empty branches show where intuitions clash or views collapse.  
  * "Recieve" typo is vibing with the sleepwalker's lack of awareness. 😉  
  * Designed for discussion – where do *you* get stuck?
