prompt: |-
  Theres this pattern in public arguments — and in my grad seminar — where calling someone hypocritical immediately triggers a check on whether you yourself do the same thing. If you share the vice, people say you have no standing to blame; if your record is clean, your blame counts even when youre not the wronged party. Meanwhile in other contexts people treat hypocrisy as just an ad hominem that doesnt cancel the substance of the charge. So whats the implicit philosophy here? Is standing being treated like a moral cleanliness score that gets forfiet by shared guilt? Or is it tied to being specially affected, with hypocrisy just muddying the waters? Reconstruct the theory the practice actually needs, say whether its coherent across both contexts, and tell me what would have to shift if we replaced it with a view where standing depends solely on being wronged or on institutional role, not on personal purity. Keep it under 250 words, ideally one tight paragraph.
reasoning: |-
  Okay, the user is asking about the implicit philosophy behind how hypocrisy is treated in arguments. They've noticed two patterns: one where sharing the vice negates your standing to blame, and another where hypocrisy is dismissed as irrelevant to the actual charge. 

  Hmm, this feels like a deep dive into moral philosophy applied to everyday discourse. The user is clearly observant—probably an academic or grad student given the seminar reference. They're frustrated by the inconsistency and want to know what theoretical framework could unify these behaviors. 

  Let me unpack their core questions: 
  First, they're asking if "standing" functions like a moral purity test. Second, they wonder if it's actually about personal stake in the issue. Third, they want a reconstructed theory that works across contexts. Finally, they're curious about alternative systems where standing depends only on being wronged or having institutional authority. 

  The tension here is between *moral consistency* and *argumentative legitimacy*. In practice, people mix two approaches: one deontological (blame requires clean hands) and one consequentialist (hypocrisy undermines persuasion). Neither is fully consistent. 

  What the user might really need is clarity on when hypocrisy matters. Sometimes it's a valid critique (e.g., climate activists flying private jets), sometimes a distraction (e.g., a murderer calling out theft). The unspoken request is for tools to cut through rhetorical noise. 

  For the reconstruction: Standing should require either (a) clean hands, OR (b) clear institutional role, OR (c) being the wronged party. But in public discourse, we default to (a) because it feels intuitively fair—even though it's logically shaky. If we switched to purely role-based standing, we'd lose the moral leverage of personal example. 

  The word limit is tight... must avoid tangents about Kant vs. Hume here. Focus on coherence: current practice isn't philosophically consistent but *works* rhetorically. Alternatives would require culture-level changes in how we view accountability.
answer: |-
  The implicit theory treats standing as **moral authority derived from consistent practice**. Hypocrisy voids standing because it reveals inconsistency, making blame appear disingenuous or inauthentic ("clean hands" requirement). If you share the vice, your blame is performative self-contradiction; if clean, your judgment carries weight as genuine moral witness, even without direct harm. In contexts dismissing hypocrisy as mere ad hominem, the focus shifts solely to the **objective validity of the claim**, prioritizing truth over the speaker's character.

  This dual practice is incoherent: it inconsistently applies whether personal virtue is essential to the legitimacy of moral speech. A reconstructed theory must clarify that **standing serves distinct functions**:
  1.  **For persuasive moral appeal:** Personal consistency *is* relevant, as hypocrisy undermines credibility and moral example.
  2.  **For objective accusation or institutional judgment:** The truth of the charge matters independently; hypocrisy is irrelevant (e.g., a corrupt prosecutor can still validly charge theft).

  Shifting to standing based *solely* on being wronged or institutional role (e.g., a judge) would **decouple moral authority from personal virtue**. This would:
  *   **Amplify institutional voices:** Roles grant standing regardless of personal purity (e.g., a hypocritical regulator could still enforce rules).
  *   **Silence disinterested critics:** Third parties with clean records could no longer condemn evils they aren't victims of.
  *   **Accept "dirty hands" enforcement:** Society would rely on systems, not personal virtue, to validate accusations.

  The shift requires accepting that legitimate condemnation doesn't demand personal purity, prioritizing systemic function or victim testimony over the moral witness of the blameless bystander.
