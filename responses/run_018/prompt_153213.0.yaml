answer: |-
  Here's a precise causal principle for cultural values, based on your cases and Weber's core challenge:

  **The Operationalized Internalization Principle:**  
  *Cultural values function as genuine causes when:  
  (1) They are **internalized as motivational drivers** (not just public signals),  
  (2) They **directly prescribe specific behavioral rules** in a given context, and  
  (3) Those rules **mechanistically explain the observed outcome** without requiring structural mediation.*

  ---

  ### Applying the Principle to Your Cases:
  1. **Puritan Merchants (Reinvestment):**  
     ✅ **SAVED.** Asceticism was internalized (salvation anxiety), prescribed *specific behavior* ("reinvest, don't consume luxuries"), and directly explains capital accumulation. Weber shows the motivational mechanism.

  2. **Japanese Manufacturing "Culture":**  
     ❌ **REJECTED.** "Culture" here is vague group signaling. Quality was driven by *structural factors* (Toyota Production System, supplier keiretsu, quality circles as management tools). Values were *post-hoc branding*, not behavioral drivers.

  3. **Aristocratic Dueling:**  
     ✅ **SAVED.** Honor codes were deeply internalized (social identity), prescribed *specific actions* ("challenge insults with violence"), and directly caused physical risk-taking. The value *is* the behavioral trigger.

  4. **Nordic Egalitarianism:**  
     ❌ **REJECTED.** Values here followed structural change. Labor unions/socialist parties created welfare institutions (*structural cause*); egalitarian norms emerged as *rationalization/internalization afterward*. Fails condition (3): institutions explain outcomes, not pre-existing values.

  5. **Religious Conversion Movements:**  
     ✅ **SAVED.** Values are *actively internalized* (conversion experience), prescribe *new rules* (e.g., monogamy, tithing), and directly reorganize family/property *within the behavioral domain of the value system*. No structural mediation required.

  ---

  ### Why Case 5 Doesn’t Break the Principle:
  Your "small-scale inhibition" intuition was incomplete. Case 5 works because:  
  - **Values operate within their own institutional domain.** Religious rules *directly* govern family/property for adherents.  
  - **Conversion creates rapid internalization.** New values aren’t rationalizations but *prescriptive mandates*.  
  - No external structures (e.g., state enforcement) are needed to explain the change.

  ---

  ### Prediction: Corporate "Psychological Safety" Culture
  - **IF** "psychological safety" is implemented as:  
    a) Genuine internalization (e.g., training changes norms, not just policies),  
    b) Specific behavioral rules (e.g., "speak up in meetings without fear"),  
    c) Directly improves outcomes (e.g., increased idea-sharing → innovation metrics rise) *without other interventions*...  
    **THEN** ✅ values are causal.  
  - **BUT** if it’s just rebranded management techniques (e.g., anonymous feedback tools + incentives), ❌ it’s structural causation in "cultural clothing."

  **Verdict:** *Usually structural.* Most corporate "culture" programs rely on incentives/processes. True value-driven change requires deep norm internalization (rare in profit-driven orgs).

  ---

  ### The Weberian Escape Hatch
  Weber’s genius was showing **how values gain causal power**: through *internalized motivational mechanisms* (e.g., salvation anxiety). When values lack this psychological engine—or when structures do the heavy lifting—they’re epiphenomenal. Your principle isolates this mechanism. Drop cases where values are **decoupled from behavior** (Case 2, 4) or **subordinate to structures**. Save cases where values *are* the behavioral algorithm (1, 3, 5).
