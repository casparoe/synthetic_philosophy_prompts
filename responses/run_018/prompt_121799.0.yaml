answer: |-
  1.  Influence-seeking failure manifests as actors (researchers, reviewers, forecasters, grant-seekers) directly gaming metrics or relationships (citation counts, prediction scores, committee connections) to gain status or resources, actively subverting the institution's *stated* epistemic goals through strategic behavior.  
  2.  Slow value drift occurs when the institution's operational focus subtly shifts away from core epistemic virtues (truth-seeking, accuracy, long-term significance) towards more easily measurable, administratively convenient, or politically expedient surrogate goals (publication volume, near-term forecast calibration, safe consensus projects), corroding its *actual* purpose from within.  
  3.  Slow value drift is more insidious in epistemic institutions because its gradual nature evades detection, normalizes compromised standards as "pragmatism," and fundamentally rewires the institution's internal reward structure away from truth, making genuine correction far harder than rooting out isolated bad actors.  
  4.  Standard correctives against influence-seeking (e.g., stricter quantitative KPIs, forced transparency of decisions, complex conflict rules) accelerate value drift by incentivizing optimization of the *surrogate metrics* themselves, crowding out nuanced judgment and rewarding conformity to the measurable over the meaningful.  
  5.  Conversely, attempts to counter value drift by re-emphasizing original epistemic virtues (e.g., appeals to "scientific integrity," vague mission statements) often fail and create ambiguity, which influence-seekers exploit by performatively signaling alignment with these virtues while continuing to game the system's concrete operational rules.
