  1. **Strict citizenship-plus-age**: Voting is for adult citizens only (18+). Compulsory voting might be accepted if seen as a duty of citizenship, but not otherwise.
  2. **Affected-interests expansion**: Voting should include anyone significantly affected, regardless of citizenship and possibly including 16-year-olds and non-citizens. Compulsory voting is less aligned with this principle (since it's about the right to have a say, not a duty).
  3. **Compulsive universalism**: Voting is a duty of all members (citizens) and should be made compulsory to ensure full participation. May or may not expand the franchise beyond current boundaries.
  4. **Epistemic filtering**: Focus on competence. This might oppose lowering the voting age (if 16-year-olds are seen as less competent) and might support compulsory voting only if it improves the quality of decisions (which is debatable). It might be open to non-citizen voting if they are competent and informed.
  5. **Hybrid views**: Combinations of the above.

