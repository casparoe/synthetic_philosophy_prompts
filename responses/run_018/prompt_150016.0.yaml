  Below is a decision tree quiz designed to reveal the underlying principles (democratic membership, affected interests, or epistemic quality) driving judgments about electoral reforms. It uses 10 concrete scenarios to avoid philosophical jargon, with each branch forcing trade-offs between principles. The scoring key maps answers to five coherent positions—and flags unstable hybrids. Participants answer based on intuition, not prior knowledge.

  ---

  ### **Quiz: What's Your Voting Principle?**
  *Answer each scenario with the option closest to your view. No "right" answers—just your honest reaction.*

  1. **Local Impact vs. Citizenship**  
     Maria has lived in your town for 15 years, paid taxes, and raised kids here, but isn’t a citizen. Should she vote for mayor?  
     - **(A) Yes**—she’s deeply affected by local decisions (schools, taxes).  
     - **(B) No**—voting is for citizens only, no matter how long you’ve lived here.  
     - **(C) Only if** she passes a test on local issues to prove she’s informed.  

  2. **Age vs. Knowledge**  
     A well-informed 16-year-old follows local politics closely. Their uninformed 45-year-old neighbor barely pays attention. Should the 16-year-old vote?  
     - **(A) Yes**—if they understand the issues, age shouldn’t block them.  
     - **(B) No**—18 is adulthood; we need a clear age rule, even for informed teens.  
     - **(C) Only if** the teen passes the same test as adults to prove competence.  

  3. **Compulsion as Duty**  
     Should citizens be fined for not voting?  
     - **(A) No**—voting is a right, not a chore. Forcing people undermines freedom.  
     - **(B) Yes**—it’s a civic duty like jury service; everyone must participate.  
     - **(C) Only if** it improves decisions by making voters more representative.  

  4. **Newcomer vs. Longtimer**  
     John (a citizen) moved to town 6 months ago. Elena (a non-citizen) has lived here 15 years. Who has a stronger claim to vote locally?  
     - **(A) John**—citizenship trumps residency length.  
     - **(B) Elena**—she’s more invested and affected long-term.  
     - **(C) Both, but only if** they prove they understand local challenges.  

  5. **Dementia and Voting**  
     An 80-year-old with advanced dementia can’t follow politics. Should they still vote?  
     - **(A) Yes**—they’re a citizen with a lifelong right to vote.  
     - **(B) No**—they can’t make informed choices; caregivers protect their interests.  
     - **(C) Only if** they pass a basic comprehension test.  

  6. **Taxation Without Representation?**  
     A non-citizen who’s paid local taxes for 10 years can’t vote. A disengaged citizen who pays no taxes can. Is this fair?  
     - **(A) Yes**—citizenship defines voting rights, not taxes or engagement.  
     - **(B) No**—if you’re invested long-term (taxes, community), you deserve a say.  
     - **(C) Neither should vote** without showing basic political knowledge.  

  7. **Teen Competence**  
     Should a 16-year-old be allowed to vote *if* they can explain key local issues better than most adults?  
     - **(A) Yes**—competence matters more than age.  
     - **(B) No**—age 18 is a bright line for civic maturity.  
     - **(C) Only if** all voters face competency tests.  

  8. **The Uninterested Voter**  
     If voting is compulsory, uninformed people must vote. Is this:  
     - **(A) Harmful**—it waters down informed votes and worsens decisions.  
     - **(B) Necessary**—everyone’s interests must be heard, even if they’re disengaged.  
     - **(C) Acceptable only if** we also educate voters to raise competence.  

  9. **Expat Citizens**  
     A citizen living abroad for 20 years (no plans to return) wants to vote in national elections. Should they?  
     - **(A) Yes**—citizenship grants lifelong voting rights.  
     - **(B) No**—they’re not affected by daily decisions back home.  
     - **(C) Only if** they prove knowledge of current national issues.  

  10. **Duty vs. Burden**  
      Is fining non-voters fair if voting is framed as:  
      - **(A) A right? → No**—rights can’t be punished.  
      - **(B) A duty? → Yes**—like taxes, obligations come with penalties.  
      - **(C) A tool for better outcomes? → Only if** fines increase informed participation.  

  ---

  ### **Scoring Key**  
  Tally your **A**, **B**, and **C** answers. Then use the table below to find your position. Positions are based on **core principles**:  
  - **A’s = Affected interests** (voting allocates power to those impacted by decisions).  
  - **B’s = Democratic membership** (voting is a right/duty tied to formal community membership).  
  - **C’s = Epistemic quality** (voting should optimize competent collective decisions).  

  | Total Answers | Dominant Principle | Position & Description | Flags for Unstable Views |
  |---------------|--------------------|------------------------|--------------------------|
  | **6+ A’s**   | Affected interests | **Affected-Interests Expansion**<br>You prioritize inclusion based on stakeholding (e.g., residency/taxation over citizenship). Likely support: non-citizen voting, lowering age if teens are affected. Oppose compulsory voting (rights aren’t forced). | **Inconsistent if**: You reject teen voting (Q2, Q7) without epistemic reasons (C’s). Affected interests should include all invested parties, regardless of age. |
  | **6+ B’s**   | Democratic membership | **Strict Citizenship-Plus-Age**<br>You tie voting to formal membership (citizenship + age 18+). Likely oppose non-citizen voting and age reduction. Support compulsory voting *only* if framed as duty (Q3, Q10).<br><br>**OR**<br><br>**Compulsive Universalism**<br>(If you also picked **B** in Q3 or Q10)<br>Voting is a core duty of membership. Support compulsory voting to enforce universal participation among citizens. | **Inconsistent if**: You support non-citizen voting (Q1, Q4) without affected-interests reasoning (A’s). Membership requires citizenship. |
  | **6+ C’s**   | Epistemic quality | **Epistemic Filtering**<br>You prioritize decision quality. Support barriers (tests, age limits) to exclude the uninformed. Oppose compulsory voting (forces uninformed participation). May support teen voting if competent. | **Inconsistent if**: You support compulsory voting (Q3, Q10) without a competence rationale. Forcing uninformed voters contradicts epistemic goals. |
  | **No clear majority (tie between 2 principles)** | Hybrid | **Strict Membership + Epistemic Filtering**<br>(B’s + C’s tie)<br>Limit voting to citizens but add competence tests. Likely oppose non-citizen voting and age reduction without tests.<br><br>**OR**<br><br>**Affected-Interests + Epistemic Hybrid**<br>(A’s + C’s tie)<br>Expand voting to affected groups (non-citizens/teens) but require competence. | **Unstable if**: You combine A’s + B’s. Membership and affected interests conflict (e.g., citizenship vs. residency). Defusing this requires prioritizing one principle or adding epistemic limits (C’s). |
  | **Even split (A/B/C balanced)** | Contradictory | **Unresolved Tension**<br>Your answers pull in incompatible directions (e.g., demanding inclusion based on residency *and* exclusion based on competence *and* citizenship). Revisit scenarios 4, 6, and 9 to clarify priorities. | **Why unstable?** Membership, affected interests, and epistemic quality can’t all dominate—e.g., supporting non-citizen voting (affected interests) clashes with citizenship requirements (membership). |

