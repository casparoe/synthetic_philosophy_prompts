  ### **How It Works**  
  - **Philosophical architecture**: Each question pits membership (B), affected interests (A), and epistemic quality (C) against each other. For example:  
    - Q1 contrasts residency (A) vs. citizenship (B) vs. competence (C).  
    - Q7 contrasts competence (A/C) vs. age-based membership (B).  
  - **Unstable positions**: Flagged hybrids (e.g., A+B) lack an internal hierarchy. If you think non-citizen residents should vote (A) but oppose teen voting (B) *without* citing competence (C), you’re applying "affected interests" inconsistently.  
  - **Everyday framing**: Scenarios use relatable dilemmas (taxes, dementia, uninformed voters) to force principle-driven choices without labels.  

  This tool reveals why participants disagree: a "Strict Citizenship-Plus-Age" voter and an "Affected-Interests Expansion" voter both oppose lowering the voting age, but for incompatible reasons (membership vs. inconsistent application). Use the results to structure debate around first principles, not reforms.
