     - (B) No, because he hasn't been here long enough to be affected by long-term decisions and may not understand local issues.
     - (C) He should be allowed to vote only if he can demonstrate knowledge about local issues.

  5. **Scenario on the mentally incapacitated**:
     "An elderly person with advanced dementia, who was once a very engaged citizen, is now unable to understand even basic information about candidates. Should they still be allowed to vote?"

     - (A) Yes, because they are a citizen and have the right to vote regardless of their current condition.
