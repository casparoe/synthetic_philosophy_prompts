  The three principles:
  1. **Democratic Membership**: Voting is a right and duty of being a member of the political community (the demos). This typically requires citizenship and often a minimum age (usually 18).
  2. **Affected Interests**: Voting should be allocated to those whose interests are at stake in the decisions being made. This principle can extend the franchise to non-citizens and possibly younger individuals.
  3. **Epistemic Quality**: Voting should be structured to produce the best collective decisions. This might involve excluding those deemed less competent or making voting compulsory to ensure a more representative sample.

  We are focusing on three reforms:
  - Compulsory voting
  - Lowering voting age to 16
  - Allowing long-term non-citizen residents to vote in local elections

  We will create 8-10 questions that present scenarios and force choices without using philosophical labels. Then we will assign a position based on the pattern of answers.

