  Okay, the user recently moved back to their hometown after a decade away and is stuck in arguments about whether locals should get priority for jobs and housing over outsiders or newcomers. They want to map out a theory of special obligations to compatriots that handles edge cases without collapsing. 

  First, I need to understand what they're really asking. They mentioned edge cases like dual citizens, stateless people, digital nomads, and climate migrants. So they're looking for a robust framework that can handle these complexities. They also want to know where popular arguments fail, especially which requirement knocks out the "charity begins at home" idea.

  The user probably wants to engage in these debates with a solid understanding, not just surface-level points. They might be frustrated with simplistic arguments and seek a nuanced approach. Their deeper need could be to find a balanced perspective that acknowledges local concerns without excluding others unfairly.

  Breaking down the problem: The core is special obligations—why we might owe more to compatriots than strangers. But this has to go beyond family vs. stranger. Key elements: basis of obligation (citizenship, residency, contribution?), strength of obligation, and edge cases.

  Edge cases are crucial. Dual citizens challenge singular loyalty. Stateless people have no formal ties. Digital nomads contribute economically but lack physical presence. Climate migrants are future residents due to circumstances. The theory must handle these without contradiction.

  The user wants distinctions that can't be blurred, like status vs. weight of obligation. For example, citizenship might grant status, but how much priority does it actually give? Also, they need the key weakness in "charity begins at home" arguments. That's likely the moral arbitrariness of birthplace—accident of birth shouldn't dictate moral worth.

  Popular arguments break when they can't accommodate edge cases or when they rely on arbitrary factors. For instance, prioritizing locals ignores contributions from newcomers or the needs of stateless individuals. The non-arbitrariness requirement exposes this flaw.

  So, structuring the response: Start with core elements of the theory, then handle edge cases, outline critical distinctions, and identify the knockout requirement. Emphasize that any viable theory must avoid moral arbitrariness and address the fluidity of modern identities and crises like climate migration.
answer: |-
  Here's the full specification for a robust theory of special obligations to compatriots, designed to handle edge cases without collapsing, and pinpointing where popular arguments fail:

  **Core Elements the Theory Must Explain:**
  1.  **The Basis of Obligation:** *Why* do compatriots owe each other more than strangers? (Shared institutions, mutual benefit, common identity, reciprocity, democratic participation?)
  2.  **The Scope of "Compatriot":** Who qualifies? (Citizens? Residents? Taxpayers? Culturally affiliated? Future citizens?)
  3.  **The Strength of Obligation:** *How much* more is owed? (Absolute priority? Strong presumption? Merely a factor? Does it vary?)
  4.  **The Objects of Obligation:** *What* is owed? (Priority for jobs/housing? Redistribution? Political rights? Basic needs? Security?)
  5.  **The Limiting Principle:** When does the obligation *stop* overriding duties to non-compatriots? (Especially regarding basic needs/human rights).

  **Edge Cases the Theory *Must* Handle Without Collapse:**
  1.  **Dual/Multiple Citizens:**
      *   Does obligation split? Is it additive? Does it depend on residency, contribution, or identity? Can one citizenry claim *stronger* obligation based on specific ties (e.g., primary residence, tax payment)?
  2.  **Stateless Persons:**
      *   Who has obligations to them? The state where they reside? All states? None? How does the theory justify obligations (or lack thereof) to someone lacking the defining "status"?
  3.  **Long-Term Residents (Non-Citizens):**
      *   Do they owe obligations? Are obligations owed *to* them? Based on residency duration, tax contribution, social integration? Does "compatriot" extend beyond formal citizenship?
  4.  **"Digital Nomads" / Transient Contributors:**
      *   Paying taxes in multiple jurisdictions, minimal physical presence. Do they incur/receive obligations? Based on payment? Duration? Intention? Does physical presence matter?
  5.  **Future Citizens / Imminent Arrivals (e.g., Climate Migrants with Visa Pathways):**
      *   Does the obligation start *before* formal status is granted? Based on near-certainty of future membership? Contribution potential? Pre-emptive integration? Does the state owe them preparatory support?
  6.  **Diaspora Members (Citizens Abroad Long-Term):**
      *   Do they retain full obligations/privileges? Do they owe obligations back? Does voting rights imply ongoing reciprocal duties? How does physical absence affect the basis (shared institutions, mutual benefit)?
  7.  **Individuals with Strong Ties but No Formal Status:**
      *   (e.g., Children of immigrants raised locally but undocumented, culturally integrated long-term overstayers). Does de facto membership create obligations where de jure status is lacking?
  8.  **Disputed Territories / Secessionist Regions:**
      *   Where does "compatriot" status lie when political allegiance is contested? Does the theory presuppose a stable, agreed-upon polity?

  **Critical Distinctions the Theory *Cannot* Blur:**
  1.  **Status vs. Grounds for Status:** Distinguishing *holding* citizenship/residency from the *reasons justifying why that status creates obligations* (e.g., participation vs. mere legal label).
  2.  **Acquired Status vs. Ascribed Status:** Distinguishing obligations arising from choices (immigration, naturalization) vs. accidents (birth citizenship).
  3.  **Contribution vs. Consumption:** Distinguishing those actively contributing (taxes, labor) from those primarily benefiting (children, elderly, unemployed) – how does this affect the *strength* of obligation owed *to* them or owed *by* them?
  4.  **Formal Membership vs. Functional Integration:** Distinguishing legal status from actual social, economic, and cultural participation in the community.
  5.  **Basic Needs vs. Priority Goods:** Distinguishing obligations to ensure survival/minimum dignity (which may be universal) from obligations granting *priority access* to scarce positional goods like specific jobs or prime housing.
  6.  **Reciprocity vs. Asymmetry:** Distinguishing obligations based on mutual exchange (taxes for services) from obligations owed regardless of capacity to reciprocate (e.g., to the severely disabled).
  7.  **Collective Self-Determination vs. Individual Rights:** Distinguishing a community's right to shape its own character/membership from the individual rights of non-members seeking entry or benefits.

  **The Requirement That Knocks Out "Charity Begins at Home":**
  *   **The Non-Arbitrariness Requirement:** The theory must justify why the *accident of birthplace or current residence* is a *morally relevant* characteristic for assigning significantly stronger obligations, especially concerning *basic needs and opportunities*.

  **Why this kills "Charity Begins at Home" (CBiH) in its common form:**
  1.  **The Birthright Lottery:** CBiH typically prioritizes those who happened to be born within arbitrary borders. The Non-Arbitrariness Requirement demands a justification for why this geographical luck creates such strong moral claims that override the potentially greater needs of outsiders. "Because they're ours" isn't sufficient; *why* does "ours" matter morally in a way that justifies deprivation elsewhere?
  2.  **Inconsistency with Universal Moral Principles:** If we accept that all humans have equal moral worth, CBiH must explain why location drastically diminishes our obligations to distant strangers facing starvation or persecution compared to a compatriot wanting a better job or house. The burden of proof is on the prioritizer.
  3.  **Edge Cases Expose the Arbitrariness:** CBiH struggles immensely with the edge cases:
      *   Why prioritize a citizen who left decades ago (Diaspora) over a desperate stateless person residing here now?
      *   Why prioritize a low-contributing citizen over a high-contributing, integrated resident?
      *   Why prioritize someone simply born here over a climate migrant *destined* to become a citizen and contribute?
      *   How can digital nomads paying taxes *here* be less "deserving" than citizens living abroad and not contributing?
  4.  **Focuses on the Wrong Justification:** CBiH often appeals to emotion ("our people first") or practicality ("we can't help everyone"). The Non-Arbitrariness Requirement forces the argument onto *moral justification*. Practicality might justify *phasing* or *implementation*, but not the *moral principle* of inherent superiority of claims based on location.

  **Where Popular Versions Break:**
  1.  **Nationalism/Cultural Affiliation:** Fails on Dual Citizens (which culture/nation?), Stateless (no nation), Functional Integration (non-citizen but deeply integrated), and Non-Arbitrariness (why is *this* culture/nation morally privileged?).
  2.  **Pure Citizenship Legalism:** Fails spectacularly on Long-Term Residents, Stateless, Future Citizens, and Functional Integration. Reduces obligation to a legal label, ignoring actual ties and contributions. Ignores obligations *to* non-citizens within the territory.
  3.  **Mutual Benefit/Reciprocity (Taxes for Services):** Fails on Children/Elderly/Disabled (low reciprocity), Digital Nomads (paying but not resident), Diaspora (not paying/using services), Stateless (excluded from reciprocity). Overlooks non-economic contributions and basic needs owed regardless of contribution.
  4.  **Social Contract (Consent):** Fails on Birthright Citizens (no meaningful consent), Stateless (no contract), Future Citizens (haven't consented yet). Assumes a clarity and voluntariness often absent.
  5.  **Communitarian "Shared Identity/Values":** Fails on diverse societies (whose identity/values?), Functional Integration (outsiders who share them), Stateless (no community), and Non-Arbitrariness (why is *this* shared identity morally decisive?).

  **Conclusion:** A viable theory must ground obligations in non-arbitrary features (like active participation, contribution, shared institutional reliance, or residency-based reciprocity) rather than mere status or birthplace. It must clearly define "compatriot" functionally, not just legally. Crucially, it must explain the *strength* and *limits* of these obligations, especially regarding basic needs vs. priority goods, and justify why these obligations override duties to non-compatriots facing comparable or greater hardship. **The fatal flaw of simplistic "locals first" arguments is their inability to justify why the morally arbitrary fact of location should trump fundamental moral equality when distributing essential opportunities and resources.** Any robust theory must either successfully bridge that gap or significantly moderate the strength of compatriot priority.
