  i recenly moved back to my hometown after ten years away and now i'm stuck in these arguments about whether locals should get priority for jobs and housing over people from elsewhere, or over people who haven't even arrived yet. i want to actually map out what a theory of special obligatons to compatriots would have to get right, not just the obvious family-vs-stranger stuff but also the edge-cases: dual citizens, stateless people, digital nomads paying taxes in three places, climate migrants who aren't citizens yet but might be. what cases does it have to handle without collaps? what distinctions — like between having status and how much weight it gets — can't it blur? and which single requirement is going to knock out the usual charity-begins-at-home arguments? i don't need citations, just the full spec and where the popular versions break.
