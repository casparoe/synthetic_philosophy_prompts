  I've been trying to figure out if virtue ethics can survive the situationist stuff without just retreating into hand-waving. Before I read more, I want the full spec: what does any adequate post-situationist virtue theory actually have to deliver? List the desiderata -- the behavioral patterns it needs to explain, the cross-situational inconsistancies it can't sweep under the rug, the distinction between trait and state it has to keep intact, and whatever results from personality psyhc (low cross-situational correllations, etc.) it can't flat-out deny. For each, say why it's a genuine constraint and not just virtue-ethicist wishful thinking. Flag which pairs look jointly unsatisfyable -- especially if being predictively accurate and being normatively action-guiding pull in opposite directions. Then briefly score two fixes: one that saves global virtues via 'trait-activtion profiles' (context-sensitive triggers that only fire in matching situations), and one that dumps global traits for purely local 'situational virtues.' No reading lists, just the logic.
reasoning: |-
  Okay, the user is diving deep into virtue ethics and situationist critiques. They want a clear list of what any post-situationist virtue theory must deliver—desiderata that aren't just wishful thinking. Let me start by recalling the key points from situationist psychology. The core issues are low cross-situational consistency in behavior and the fundamental attribution error. Studies like Hartshorne and May's honesty experiments and Milgram's obedience study show that people's behavior varies a lot across situations. So any viable virtue theory needs to address these without hand-waving.

  First, the user wants behavioral patterns explained. Virtue ethics relies on stable traits, but situationists show inconsistency. The theory must account for why someone might be honest in one context but not another. They also need to handle cross-situational inconsistencies without ignoring the data. Denying low correlations isn't an option; the evidence is solid. 

  Then there's the trait vs. state distinction. Virtues are supposed to be enduring traits, but situationists argue behaviors are often just transient states. The theory has to maintain that traits exist meaningfully beyond specific states. Also, personality psychology findings like low cross-situational correlations (0.20-0.30) can't be dismissed. That's a hard constraint because it's empirical fact.

  The user also mentioned predictive accuracy vs. normative guidance. If virtues are too context-specific, they lose their action-guiding power. But if they're too global, they fail to predict behavior accurately. This tension is crucial. For example, activating traits only in certain situations might save global virtues but could make them less useful as guides. 

  Scoring the two fixes: Trait activation profiles (TAPs) seem promising by adding contextual triggers. They explain inconsistencies by saying virtues activate only in relevant situations. But the challenge is avoiding circularity—defining situations in an ad hoc way. Plus, predictive power might still be low if triggers are too specific. Local virtues abandon global traits entirely, which aligns better with data but risks making virtues too fragmented to guide life decisions. 

  The user's deeper need might be understanding if virtue ethics can still be a robust framework without ignoring science. They might want to reconcile ethical theory with empirical psychology, seeking a realistic yet normative approach. They’re likely an academic or philosophy student looking for a coherent synthesis. Their frustration with hand-waving suggests they value rigor. 

  Need to ensure each desideratum is justified as a genuine constraint, not just virtue ethicist preference. For example, low correlations are undeniable from data. The trade-offs between prediction and guidance need highlighting as that's a core tension. Also, assessing both fixes honestly, pointing out where they succeed and fail. Avoid jargon, keep logic clear. Make sure to flag which desiderata conflict, especially predictive accuracy vs. normative action-guidance.
answer: |-
  Here's the full spec for any viable post-situationist virtue theory, outlining the non-negotiable constraints and scoring the two proposed fixes:

  **Core Constraints (What It *Must* Deliver & Why They're Genuine, Not Wishful):**

  1.  **Explain Behavioral Inconsistency (The Core Situationist Challenge):**
      *   **What:** Account for the empirical finding that specific behaviors (e.g., honesty, helpfulness) show significant variation *within the same individual* across different situations (e.g., Hartshorne & May's honesty studies, Milgram obedience variations).
      *   **Why Genuine:** Denial contradicts overwhelming empirical evidence. Virtue ethics traditionally predicts stable behavioral patterns, so it *must* explain this variance without dismissing the data.

  2.  **Acknowledge Low Cross-Situational Consistency (The Personality Psych Constraint):**
      *   **What:** Accept that statistically, correlations between behaviors expressing the *same* putative trait (e.g., honesty) across *different* types of situations are typically low (often in the 0.20-0.30 range).
      *   **Why Genuine:** This is a bedrock finding in personality psychology (Mischel, Ross & Nisbett). A theory claiming traits are real and causally explanatory cannot ignore this low predictive power across diverse contexts. It's a statistical fact, not an interpretation.

  3.  **Preserve a Meaningful Trait/State Distinction:**
      *   **What:** Maintain that virtues are more than just fleeting states or situational reactions. They must represent *enduring dispositions* that meaningfully influence behavior *over time and across relevantly similar situations*, distinct from momentary moods or impulses.
      *   **Why Genuine:** Without this, "virtue" collapses into mere temporary behavior, voiding virtue ethics' core claim about character development and stable dispositions needed for flourishing. It becomes purely descriptive, not normative.

  4.  **Accommodate the Power of Situations (Fundamental Attribution Error):**
      *   **What:** Explain why seemingly minor situational features (e.g., finding a dime, ambient noise, time pressure) often exert a stronger influence on behavior than presumed global character traits.
      *   **Why Genuine:** Countless experiments (e.g., Isen & Levin's dime/helping, Darley & Batson's Good Samaritan) demonstrate this power. Ignoring it makes virtue theory empirically implausible and ignores a major source of behavioral variance.

  5.  **Provide Normative Action-Guidance:**
      *   **What:** Offer practical, non-trivial guidance for cultivating character and making decisions, not just describing behavior. It must tell agents *how to become better* and *what to do*.
      *   **Why Genuine:** This is the *raison d'être* of normative ethics. A virtue theory that fails here is irrelevant to ethics, becoming merely descriptive psychology.

  6.  **Avoid Circularity/Trivialization:**
      *   **What:** Define virtues and situations in a way that isn't tautological (e.g., defining "courageous situations" solely as those where courageous actions occur) or reduces virtues to simply "whatever behavior happens in situation X."
      *   **Why Genuine:** Circularity makes the theory unfalsifiable and explanatorily empty. Trivialization strips virtue of its normative content and predictive/explanatory power.

  **Key Tensions (Where Constraints Pull Against Each Other):**

  *   **Predictive Accuracy (Constraints 1, 2, 4) vs. Normative Action-Guidance (Constraint 5):** This is the **central tension**.
      *   *Why Conflict:* Maximizing predictive accuracy (acknowledging low cross-situational consistency and strong situation effects) seems to require *context-specific* behavioral predictions, potentially making virtues hyper-local. However, effective normative guidance (telling someone "be courageous") typically relies on *global, context-transcending* character ideals applicable across diverse life domains. Specificity aids prediction but fragments guidance; generality aids guidance but harms prediction.
  *   **Meaningful Trait/State Distinction (Constraint 3) vs. Low Cross-Situational Consistency (Constraint 2):** How can traits be stable and enduring if their behavioral manifestations are highly inconsistent? A theory must show how stability exists *despite* or *alongside* this inconsistency.
  *   **Normative Action-Guidance (Constraint 5) vs. Avoiding Circularity (Constraint 6):** Action-guidance needs substantive content, but defining virtues robustly enough to avoid circularity while accommodating situational variance is difficult.

  **Scoring the Fixes:**

  1.  **"Trait Activation Profiles" (Saving Global Virtues via Context Sensitivity):**
      *   **Core Idea:** Global virtues (courage, honesty) exist as latent dispositions, but they only manifest behaviorally when encountering a "trait-relevant situational cue" (TAP). Courage "activates" in physical danger contexts but might not in social conflict contexts for the same person. Traits are conditional dispositions.
      *   **Addressing Constraints:**
          *   **Inconsistency/Low Consistency:** Explains it directly – behavior varies because situational triggers vary. Predicts consistency *only within* situations sharing relevant cues.
          *   **Trait/State Distinction:** Preserves global traits as latent dispositions (meeting Constraint 3).
          *   **Situational Power:** Explicitly incorporates situations as triggers (Constraint 4).
      *   **Challenges:**
          *   **Circularity/Trivialization Risk (Constraint 6):** Defining the "relevant situational cues" non-arbitrarily is crucial. It risks becoming "courage activates in courage-activating situations." Needs an independent theory of what *makes* a cue relevant (e.g., features demanding overcoming fear for a valued end).
          *   **Predictive Accuracy (Constraints 1, 2):** Success depends entirely on accurately mapping the complex, individual-specific TAPs. Predicting behavior in *novel* situations remains challenging. Low *global* consistency is accepted, but prediction within defined cue-classes is the goal.
          *   **Normative Guidance (Constraint 5):** Guidance becomes complex: "Cultivate the disposition to be courageous *when faced with threats to physical safety requiring decisive action for a just cause*." This is more specific but potentially less intuitively action-guiding than "Be courageous." Preserves the *ideal* of global virtue but operationalizes it contextually.
          *   **Empirical Plausibility:** Requires identifiable, stable cue-response patterns within individuals over time, which is a higher bar than simple state explanations.

  2.  **"Local Situational Virtues" (Dumping Global Traits):**
      *   **Core Idea:** Abandon global character traits. Virtues are specific, context-bound behavioral tendencies or skills. "Office-honesty" (not cheating on expenses) is distinct from "Family-honesty" (not lying to spouse) is distinct from "Stranger-honesty" (returning a lost wallet). Virtue is mastery of domain-specific scripts/rules.
      *   **Addressing Constraints:**
          *   **Inconsistency/Low Consistency (Constraints 1, 2):** Embraces it. Different virtues exist for different contexts. No prediction of cross-situational consistency needed.
          *   **Situational Power (Constraint 4):** Makes situations constitutive of the virtue itself.
          *   **Avoids Circularity? (Constraint 6):** Can define local virtues non-circularly by the specific demands and rules of the local context (e.g., "office-honesty" defined by company policies and professional norms).
      *   **Challenges:**
          *   **Trait/State Distinction (Constraint 3):** **FATAL FLAW for Virtue Ethics.** This essentially eliminates *enduring character dispositions* beyond specific situational habits/skills. Virtues become fragmented states or learned behaviors tied to contexts, not stable traits shaping identity and life-narrative. This fundamentally undermines the traditional virtue ethics project of character development for *eudaimonia*.
          *   **Normative Action-Guidance (Constraint 5):** Guidance becomes highly specific: "Learn the rules and scripts for honesty-in-financial-reporting." While practical for specific roles, it loses the *unifying, life-orienting* force of global virtues ("Be an honest person"). It struggles to guide behavior in genuinely novel situations or across life domains.
          *   **Fragmentation:** Risks creating an endless list of micro-virtues with no unifying principle or sense of integrated character. Explains behavior but abandons character as a central ethical concept.

  **Conclusion on Fixes:**

  *   **Trait Activation Profiles (TAPs):** Offers the **only viable path for preserving core virtue ethics** (enduring character). It *can* satisfy all constraints *if* it successfully avoids circularity in defining cues and provides sufficiently robust (though complex) normative guidance. The cost is predictive power limited to cued situations and potential complexity in guidance. It's the best bet for "saving" virtues as traditionally conceived, but demands careful non-circular specification of triggers.
  *   **Local Situational Virtues:** **Effectively surrenders traditional virtue ethics.** It satisfies empirical constraints (1,2,4,6) well but catastrophically fails Constraint 3 (Trait/State) and severely weakens Constraint 5 (Normative Guidance) by fragmenting it. It morphs virtue ethics into a form of contextual rule-based skill acquisition, losing its distinctive focus on *character*.

  **The Bottom Line:** An adequate post-situationist virtue theory *must* deliver empirically plausible explanations of behavioral inconsistency and low cross-situational consistency while preserving a non-trivial conception of enduring character traits that provide meaningful, non-circular action guidance. The TAP approach is the only serious contender, but its success hinges on rigorously defining situational triggers and demonstrating stable individual differences in activation patterns. The local virtues approach solves the empirical problems but at the cost of abandoning the core concept of character central to virtue ethics. The tension between predictive accuracy and simple normative guidance remains a fundamental challenge.
