answer: |-
  You've pinpointed a crucial and often blurred distinction. The core rejection of the Law of Excluded Middle (LEM) in intuitionism is **primarily an ontological thesis about the nature of mathematical objects and truth**, *not* a general epistemic skepticism applicable to all unknown propositions. Here's a breakdown to clarify the boundaries:

  1.  **The Core Ontological Thesis (Brouwer's Intuitionism):**
      *   **Mathematical objects are mental constructions:** Numbers, sets, functions, etc., do not exist independently of the mathematician's mind. They are brought into existence by acts of intuition and construction.
      *   **Mathematical truth is proof-dependent:** A mathematical statement `P` is *true* only if we have constructed a proof for it (`⊢ P`). It is *false* only if we have constructed a proof showing its impossibility (`⊢ ¬P`). Crucially, `P ∨ ¬P` (LEM) is *not* true unless we possess a construction proving either `P` or `¬P`.
      *   **Excluded Middle is Rejected as an *a priori* Principle:** Intuitionists argue that assuming `P ∨ ¬P` holds universally, independent of our ability to decide which disjunct is true, smuggles in a **Platonist assumption**: that mathematical reality exists independently and is fully determinate, making `P` objectively true or false even before we know it. This contradicts the core intuitionist view that mathematics *is* the activity of construction.
      *   **Scope: Strictly Mathematical:** This justification is rooted entirely in the *nature* of mathematical existence as *mental activity*. It doesn't inherently comment on the nature of empirical reality.

  2.  **Why It's Not Primarily Epistemic Skepticism:**
      *   **Distinction from Verificationism:** While intuitionism *implies* a strong verificationist *practice* within mathematics (don't assert `P` without proof), its *reason* for rejecting LEM isn't merely "we haven't verified it yet." It's the deeper claim that *there is no independent reality to be verified or falsified outside of the constructions themselves*. For Goldbach's conjecture, the intuitionist argues it *lacks a determinate truth value* right now *because* the necessary constructions (either a pair of primes summing to an even number greater than 2, or a proof that no such pair exists for some even number >2) haven't been performed. Its truth is not "out there" waiting to be discovered; it is constituted by the act of proof.
      *   **Empirical Propositions are Different:** Intuitionists (especially Brouwer) generally *accept* LEM for empirically decidable propositions about the *mind-independent physical world*. "There is microbial life on exoplanet X" (`M`) is assumed to be either true or false (`M ∨ ¬M`), *even if we currently lack the means to verify it*. Why? Because the intuitionist typically holds that the physical world exists independently of our minds and possesses determinate states. Our *ignorance* (`¬K M ∧ ¬K ¬M`) doesn't imply the *indeterminacy* of `M`. The truth value is fixed by the state of the universe, not contingent on our constructing a proof.

  3.  **The Boundary: Ontology Draws the Line**
      The boundary between domains where LEM is rejected vs. accepted is drawn by **ontological commitments**:
      *   **Mathematics:** Objects are mental constructions; truth is constituted by proof. → LEM rejected as a universal logical principle.
      *   **Empirical Reality (Physical World):** Objects exist independently; truth corresponds to mind-independent states of affairs. → LEM generally accepted (though skepticism about *knowledge* remains).

  4.  **Nuance: Dummettian Anti-Realism and the Challenge**
      This is where things get interesting and potentially lead to the "sliding" you observe. Michael Dummett, interpreting intuitionism, argued for a **broader anti-realist semantics**:
      *   **Meaning is Use + Verification:** The meaning of *any* statement (mathematical or empirical) is tied to the conditions under which we can recognize it as verified or falsified.
      *   **Bivalence Requires Decidability:** If we lack a guarantee that we *could*, in principle, verify or falsify a statement, then we cannot assume it *is* either true or false (bivalent).
      *   **Potential Broader Scope:** This view *could* challenge LEM for empirical statements about the distant past, the very small, or other realms where verification might be fundamentally impossible *in principle*. (e.g., "There was an odd number of blades of grass on this spot exactly 10 million years ago"). Dummett saw intuitionistic logic as the correct logic for *any* domain where anti-realism (meaning defined by verification-conditions) holds.

  5.  **Resolving the Tension for Your Piece:**
      *   **Classical Intuitionism (Brouwer, Heyting):** The rejection of LEM is **rigorously confined to the abstract mathematical domain** based on the **ontological thesis of mathematics as mental construction**. Empirical statements about the physical world fall under a different ontological category and LEM generally holds.
      *   **Dummettian Anti-Realism:** This is a **broader philosophical program *inspired by* intuitionism**. It uses intuitionistic logic as a tool for domains *beyond* mathematics, based on a verificationist theory of meaning. This *is* a more general epistemic principle, potentially applying to some empirical statements.
      *   **Key Distinction:** The *original motivation and justification* for rejecting LEM in Brouwer's intuitionism is fundamentally ontological and specific to mathematics. The *broader application* suggested by Dummett is an extension based on semantic anti-realism.

  **Conclusion for Clarity:**

  When writing about the *core doctrine* of intuitionism in mathematics, emphasize:

  > **Intuitionism's rejection of the Law of Excluded Middle is an ontological claim specific to mathematics.** It stems from the view that mathematical objects are mental constructions, and mathematical truth is constituted by proof. Since an unproven/unrefuted conjecture like Goldbach's lacks the required constructive proof, it is not considered determinate (true or false). **This is distinct from general skepticism about unknown empirical facts.** Intuitionists typically accept that empirical propositions about the mind-independent physical world *are* determinately true or false (`P ∨ ¬P` holds), even if we lack the means to know which (`¬K P ∧ ¬K ¬P`). The boundary is drawn by the differing ontological status of mathematical entities (mental constructions) vs. empirical entities (mind-independent).

  Acknowledge that thinkers like Dummett have *later extended* the intuitionistic framework into broader anti-realist semantics, which *could* challenge LEM in some empirical contexts, but stress that this is a development distinct from Brouwer's original, mathematically focused, ontological motivation.

  This framing avoids misrepresenting intuitionism as merely epistemic caution and highlights the crucial ontological foundation that confines its unique logical features primarily to the mathematical realm.
