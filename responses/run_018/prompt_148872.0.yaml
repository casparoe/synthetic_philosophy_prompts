answer: |-
  Here is the taxonomy tree structured per your specifications. Branching occurs through three binary questions applied sequentially, generating six terminal positions. Each leaf names the position (or "unnamed"), states its most awkward commitment, and notes answer-pattern collapses where applicable.

  **Root Case:** 1989 regime collapse with three proposed sufficient explanations: (1) structural economic decay, (2) contingent diplomatic blunder, (3) rapid mass-mobilization cascade.

  ### Branching Logic:
  1. **Q1: Does genuine causal overdetermination survive full specification of background conditions?**  
     - *No →* **Resolutionist Monism (A)**  
     - *Yes → Proceed to Q2*

  2. **Q2: Does accepting overdetermination render counterfactuals (e.g., "Would collapse have occurred without the blunder?") incoherent?**  
     - *Yes →* **Counterfactual Eliminativism (B)**  
     - *No → Proceed to Q3*

  3. **Q3: Must a coherent historical narrative select one dominant turning point?**  
     - *No →* **Modal Pluralism (C)**  
     - *Yes → Proceed to Q4*

  4. **Q4: Does narrative dominance track explanatory scale (e.g., structural vs. event-level)?**  
     - *Yes →* **Level-Sensitive Pluralism (D)**  
     - *No →* **Unnamed (E)** or **Narrative-Overdetermination View (F)**  

  ---

  ### Terminal Positions (Leaves):
  1. **A: Resolutionist Monism**  
     *Awkward commitment:* Must deny that economic decay, diplomatic blunder, or mass-mobilization were *all* genuinely sufficient, arguing one was dominant upon full analysis.  

  2. **B: Counterfactual Eliminativism**  
     *Awkward commitment:* Must reject as meaningless the question "Would collapse still have occurred without the blunder?" despite its intuitive historical relevance.  

  3. **C: Modal Pluralism**  
     *Awkward commitment:* Must accept that "collapse would not have occurred without the blunder" (contingent modality) and "collapse would still have occurred without the blunder" (structural modality) are *simultaneously true*.  

  4. **D: Level-Sensitive Pluralism**  
     *Awkward commitment:* Must hold that the diplomatic blunder, though sufficient, is explanatorily subordinate to economic decay in a narrative because scales are incommensurable.  

  5. **E: Unnamed**  
     *Awkward commitment:* Must assert that selecting a dominant turning point (e.g., the blunder) is necessary for narrative coherence *even if all causes operate at the same explanatory scale*.  
     *Diagnosis of emptiness:* Unattractive due to rendering narrative hierarchy arbitrary despite causal symmetry.  

  6. **F: Narrative-Overdetermination View**  
     *Awkward commitment:* Must defend that a historian can claim the blunder was causally sufficient *and* non-redundant, yet still demote it narratively to uphold a single "turning point" for clarity.  

  ---

  ### Collapsed Distinctions:
  - **B (Counterfactual Eliminativism) and E/F (Unnamed/Narrative-Overdetermination)** share identical answers to Q1 (Yes) and Q2 (Yes), but diverge at Q3 (B answers "No" to Q3, while E/F require Q3="Yes" → Q4).  
    *Explanation:* The tree separates them via Q3, but if Q2="Yes" (counterfactuals incoherent), Q3 becomes moot for B, whereas E/F preserve counterfactuals (Q2="No") but impose narrative hierarchy. No direct collapse.  
  - **C (Modal Pluralism) and D (Level-Sensitive Pluralism)** share Q1="Yes", Q2="No", Q3="No".  
    *Explanation:* The tree fails to separate them; both occupy the same branch. This reflects real-world conflation, as level-sensitivity often implicitly invokes modalities. To split them, Q3 would need rephrasing (e.g., specifying narrative integration vs. modal indexing).
