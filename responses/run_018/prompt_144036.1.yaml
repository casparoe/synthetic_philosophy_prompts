  The shadow analogy is key for Joren - I'll have him develop it thoroughly. Mara should counter by distinguishing between passive patterns and active constraints, maybe using the riverbed metaphor. When discussing biological brains, Mara might highlight top-down cognitive effects, while Joren could argue those are still physically implemented.

