  Okay, let me start by really unpacking what the user is asking here. They're grappling with the nature of pleasure and why certain experiences that are labeled as "pleasure" feel more similar to pains than to other pleasures. 

  First, I notice they've provided vivid examples: the warmth after swimming, the click of a proof, refusing an invitation, the burn of a sprint. What's striking is how these examples deliberately cross experiential categories—sensory, intellectual, emotional, physical exertion. 

  The core tension they're highlighting is fascinating: the classification system of "pleasure vs pain" seems to fracture when examined phenomenologically. That sprint burn resembles embarrassment more than sunbathing; sunbathing feels closer to muscle ache than to the proof-click. This suggests the valence (good/bad) and qualia (raw feel) are orthogonal axes. 

  Hmm... they're explicitly rejecting two common philosophical shortcuts: the "heterogeneity of pleasure" argument (which just says pleasures differ) and the "absence of pain" theory (which flattens nuance). They want precision about why valence feels like a secondary label slapped onto deeper qualitative categories. 

  What they might really be circling is the inadequacy of hedonistic calculus—the idea that all pleasure is commensurable. Their examples destroy that assumption: you can't meaningfully add sprint-burn units to sun-warmth units. But they're going further by noting cross-valence resemblances. 

  I recall Annas once wrote about how Stoic apatheia isn't numbness but re-categorization—maybe relevant? But no, the user wants taxonomy, not ethics. Sidgwick's qualitative hedonism fails too; it still assumes valence is primary. 

  The key insight seems to be: qualitative similarity often ignores valence. So the real problem is monism about valence itself. Let me sketch this as a grid: 

  | Qualitative Family | "Pleasant" Members | "Painful" Members |
  |--------------------|---------------------|-------------------|
  | Muscle burn        | Post-sprint glow    | Post-injury ache  |
  | Cognitive tension  | Proof-click         | Frustration       |
  | Relief             | Declined invitation | Hangover cessation| 

  Ah! Now the user's frustration makes sense. Traditional hedonism treats column 2 as homogeneous and column 3 as opposite, but the rows show deeper kinships. 

  They're also hinting at a meta-problem: why do we insist valence is fundamental when experience suggests otherwise? That's almost a Nietzschean will-to-classify... 

  For coining a term: needs to capture both the orthogonal axes and the misfit of categories. "Valence-qualia decoupling"? Too clinical. "Phenomenal taxonomical displacement"? Awful. 

  How about "Affective Category Fragmentation"? Specifically: the phenomenon where the assignment of positive/negative valence fractures natural qualitative categories while creating artificial groupings that lack phenomenological coherence. 

  Must distinguish from Ryle's category mistakes (which are logical) and mere heterogeneity. This is about lived experience revealing taxonomic incoherence. 

  User would likely reject any term implying valence is illusory—they're not denying the good/bad distinction, just its categorical primacy. So "fragmentation" preserves reality while acknowledging misfit. 

  ...I should probably mention this has implications for pain science too. "Pain affect" vs "sensory qualities" research shows similar splits, but that's not quite the same. 

  Final check: does this address their "edges and exclusions" request? Yes—excludes mixed feelings (which preserve valence) and absence theories (which deny positive qualia). Includes any case where same-qualia exists in both valences. 

  *adjusts mental model* This feels solid. Time to structure the reply.
answer: |-
  You've hit upon a profound and under-discussed fissure in pleasure theory—one that exposes a categorical instability at the core of hedonistic frameworks. Let's dismantle this step by step, avoiding premature labeling until we've mapped the terrain.

  ### Core Problem: The Fracture Between Valence and Qualia
  Your observation reveals two misalignments:
  1.  **Cross-Valence Phenomenal Kinship:** Certain "pleasures" (sprint-burn) share more raw *qualitative character* with certain "pains" (embarrassment-burn, headache) than with other "pleasures" (sun-warmth).  
  2.  **Intra-Valence Phenomenal Discontinuity:** "Pleasures" themselves (sun-warmth, proof-click, invitation-refusal, sprint-burn) lack a unifying qualitative core—no shared "feel," intensity profile, or temporal structure.  

  This forces a dilemma:  
  - **If "pleasure" refers to a unified experiential quality**, your examples show it doesn't exist. The *feeling* of sun-warmth ≠ proof-click ≠ sprint-burn.  
  - **If "pleasure" refers only to positive valence (goodness)**, then valence is detachable from specific qualia. But valence itself becomes unstable when phenomenologically similar states (sprint-burn vs. headache-burn) are assigned opposite valences.  

  The critical insight: **Valence (good/bad) and qualia (raw feel) operate on orthogonal axes.** What we *label* "pleasure" or "pain" is a hybrid: a *qualitative state* + a *valence assignment*. The valence tag doesn't always map to the underlying sensory/affective texture.

  ---

  ### Distinguishing This from Existing Doctrines
  This isn't merely "pleasures are heterogeneous" (Mill's qualitative hedonism) or "pleasure is absence of pain" (Epicureanism). Let's clarify:

  | Concept                      | How It Relates to Your Problem                                                                 | Why Your Case is Different                                                                 |
  | :--------------------------- | :--------------------------------------------------------------------------------------------- | :----------------------------------------------------------------------------------------- |
  | **Heterogeneity of Pleasure** (Mill) | Acknowledges pleasures differ in "quality" (e.g., intellectual > bodily).                     | **You show pleasures may share more qualia with pains than other pleasures.** Valence assignment fractures natural qualitative families. |
  | **Pleasure as Absence of Pain** (Epicurus) | Reduces pleasure to neutral state; denies positive qualia.                                     | **You observe distinct *positive* qualia (sun-warmth, proof-click)—but they don't cohere.** The problem isn't reduction but misalignment. |
  | **Mixed Pleasures** (Plato, Nietzsche) | Recognizes single states blending pleasure/pain (e.g., tragic art).                           | **You note *separate* states with shared qualia but opposite valences.** Not mixture—phenomenal twins with divergent valuations. |
  | **Anti-Hedonist Reductionism** (Ryle, behaviorists) | Claims "pleasure" is just a disposition to seek, not a feeling.                                | **You accept the reality of the *feelings* but challenge their categorization.** Your issue is taxonomic, not ontological. |

  ---

  ### Coining a Term: **Affective Category Fragmentation**
  This captures your core concern: the standard valence-based categories ("pleasure"/"pain") **fragment** natural qualitative families while **forcing cohesion** on phenomenally disparate states.

  **Definition:**  
  > *Affective Category Fragmentation* (ACF) is the phenomenon whereby:  
  > 1.  States grouped under a single affective valence (e.g., "pleasure") exhibit radical qualitative heterogeneity, lacking a unifying phenomenological core.  
  > 2.  States sharing core qualitative features are split across valences (e.g., "pleasurable" and "painful" burns), revealing valence as a contingent label rather than an intrinsic property of the qualia.  
  > 3.  The classification system ("pleasure"/"pain") thereby creates artificial experiential categories while obscuring natural phenomenal kinships.  

  **Boundaries and Exclusions:**  
  - ✅ **INCLUDES:** Cases where *same-domain qualia* (e.g., muscular burn, cognitive tension) manifest with *opposite valences* (sprint vs. injury; proof-click vs. frustration).  
  - ✅ **INCLUDES:** States where valence assignment is context-dependent (e.g., identical physiological arousal interpreted as "excitement" or "anxiety").  
  - ❌ **EXCLUDES:** Mere qualitative differences *within* a valence (e.g., chocolate vs. music as distinct pleasures).  
  - ❌ **EXCLUDES:** States where valence and qualia *do* align (e.g., pure agony with no "pleasurable" counterpart).  
  - ❌ **EXCLUDES:** Ethical debates about pleasure's *value* (e.g., whether higher pleasures trump lower ones). ACF is phenomenological, not normative.  

  ---

  ### Why This Matters: Implications for Hedonic Calculus
  ACF sabotages classical hedonism:
  - **No Common Currency:** If pleasures lack a unified qualitative core, summing them (Bentham's "felicific calculus") is like adding meters to kilograms.  
  - **Valence Instability:** If similar qualia can flip valence (burn-as-pleasure vs. burn-as-pain), valence isn't a fixed property. Hedonic calculus assumes stable "positive" states.  
  - **Taxonomic Violence:** Forcing sun-warmth and sprint-burn into "pleasure" obscures more than it reveals. Conversely, *separating* sprint-burn from headache-burn obscures their kinship.  

  You're exposing a flaw not in *descriptions* of pleasure, but in the **categorical architecture** itself. ACF suggests valence might be a *secondary judgment* applied to primary qualia, not an essential feature. This resonates with neuroscientific work on "affective labeling" (e.g., interoceptive signals interpreted as euphoria or panic), but your phenomenological grounding is sharper.

  ### Final Thought
  ACF isn't a "solution"—it's a diagnosis of why pleasure resists tidy theorizing. If valence and qualia are orthogonal, we might need a 2D map: one axis for qualitative families (thermal, cognitive, exertion, etc.), another for valence intensity. "Pleasure" becomes a region on this map, not a single point. Your sprint-burn and sun-warmth occupy distant qualitative zones, both with positive valence; your sprint-burn and headache-burn share a zone but sit on opposite valence poles. That’s where your wall comes from: philosophy keeps trying to project this map onto a single line.
