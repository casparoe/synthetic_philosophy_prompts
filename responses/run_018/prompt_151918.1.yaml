  ## The Undesirable Burden: Why Maximal Moral Goodness Corrodes Human Flourishing

  Susan Wolf's provocative essay "Moral Saints" ignited crucial debate about the nature and value of the moral life. While often interpreted as arguing that moral saints are impossible, Wolf's core thesis is subtler and more profound: **maximal moral goodness is *undesirable* as a universal ideal for human life, not because it's logically unattainable, but because its pursuit leads to a life devoid of other essential human values.** Furthermore, the common retort grounded in coordination problems ("if everyone were saints, we could all have personal projects") fundamentally misunderstands the nature of maximal goodness and fails to resolve the core conflict. Crucially, we must untangle the distinct concepts of *being maximally good* and *being morally obsessed*, as their conflation muddies the waters. Ultimately, maximal moral goodness proves undesirable because it necessitates sacrificing the rich pluralism of human value essential for individual fulfillment and a vibrant society, regardless of coordination efforts.

  **Defining the Battlefield: Maximal Goodness vs. Moral Obsession**

  *   **Maximal Moral Goodness (MMG):** This is a *structural* or *dispositional* concept. An agent achieves MMG if, across their life, they consistently choose the course of action that *maximizes overall moral value* (however defined – reducing suffering, promoting welfare, fulfilling duties). Every decision point becomes an optimization problem for the greater good. MMG doesn't *inherently* specify psychological state, only outcome-maximizing behavior.
  *   **Moral Obsession (MO):** This is a *psychological* concept. A morally obsessed individual experiences morality as the dominant, overriding concern in their motivational structure. Other values (aesthetic, personal, intellectual, hedonic) are either absent, severely diminished, or constantly subordinated to moral calculation. Their identity is saturated by the moral. MO is the *likely psychological consequence* of striving for MMG, given human limitations and the vastness of moral need.

  The critical confusion arises when critiques of MMG (like Wolf's) focus on the *psychological impoverishment* (MO) it typically induces, while proponents sometimes defend MMG by arguing it *need not* involve MO – that one could theoretically maximize moral value while still enjoying art or love. This defense, however, largely fails upon scrutiny.

  **The Case Against the Desirability of Maximal Moral Goodness**

  1.  **Wolf's Central Plaint: The Erosion of the Meaningful Life:** Wolf argues that a moral saint, driven by MMG, would lack "personal projects" – deep, sustained commitments to non-morally-grounded endeavors (like mastering an art form, pursuing pure scientific inquiry, or cultivating a unique personal style). These projects are essential sources of meaning, identity, and joy that are *not* primarily justified by their moral contribution. The MMG agent must constantly ask: "Is this the *most* morally beneficial thing I could be doing right now?" Invariably, painting a masterpiece pales against feeding the hungry. Consequently, the MMG life becomes monochromatic, sacrificing the "non-moral virtues" (wit, creativity, passion) that make life rich and distinctively human. As Wolf memorably states, a world full of moral saints would be "a world without Mozart."

  2.  **The Value Pluralism Argument:** Human flourishing depends on a plurality of irreducible values – moral, aesthetic, intellectual, personal, relational, hedonic. MMG demands the systematic subordination of *all* other values to the moral. This hierarchy is arbitrary and impoverishing. Why should reducing suffering *always* trump creating beauty, seeking truth for its own sake, or deepening a personal relationship? A good human life requires a balanced engagement with this plurality, not the tyranny of one dimension. MMG imposes this tyranny, reducing the complexity of human existence to a single, albeit important, calculus.

  3.  **The Moral Division of Labor:** Societies function best through specialization, including moral specialization. We need firefighters, artists, caregivers, engineers, and yes, moral pioneers and activists. Insisting *everyone* must maximize *moral* output at every moment ignores this reality. The artist *creates value* through their focus on the aesthetic, value that would be lost if they abandoned their studio for the soup kitchen full-time. This division allows different types of value to flourish simultaneously. Universal MMG would homogenize human effort, potentially stifling innovation, culture, and diverse forms of excellence that indirectly support societal well-being.

  **The Coordination Problem Rebuttal and Its Failure**

  Proponents of MMG often counter: "If *everyone* were a moral saint (committed to MMG), we could solve coordination problems! We could efficiently distribute moral tasks, ensuring all needs are met *while* allowing individuals dedicated time for personal projects." This seems appealing but collapses under analysis:

  1.  **The Optimization Imperative Remains:** Even in a perfectly coordinated saintly society, the MMG agent must *still* choose the action that maximizes moral value *at the margin*. If dedicating an extra hour to their novel yields less moral value than spending that hour tutoring or researching disease cures (even within a coordinated system), MMG demands they abandon the novel. Coordination might *reduce* the burden, but it doesn't eliminate the *structural requirement* to constantly optimize for the greater good. Personal projects remain perpetually vulnerable.
  2.  **Undermining the Division of Labor:** The coordination argument implicitly relies on a division of labor – some focus on direct moral work, others on art/science/etc. But MMG, by definition, requires *each individual* to maximize *their own* moral contribution. Why should the artist accept a societal role limiting their moral output if they believe they personally could do *more* good elsewhere? MMG logic pushes individuals towards the activity where their *personal* marginal moral impact is highest, potentially destabilizing the very coordination and specialization the argument relies upon.
  3.  **Ignoring the Value Conflict:** Even with perfect coordination freeing up time, the *intrinsic value* of non-moral pursuits remains secondary under MMG. The artist paints *only* because society has deemed it "their slot" for non-moral activity within the moral framework. The activity's value is contingent on permission, not inherent. This fundamentally alters the nature of the pursuit, draining it of the spontaneous, intrinsic commitment that fuels genuine passion and meaning. It becomes a morally sanctioned hobby, not a defining personal project.

  **The Verdict: Undesirable and Corrosive**

  Maximal Moral Goodness is undesirable as a universal ideal. While theoretically distinct from Moral Obsession, the relentless demands of MMG make MO its near-inevitable psychological companion for finite beings facing infinite moral demands. The attempt to separate them relies on unrealistic assumptions about human psychology and the quantifiability of moral value.

  MMG fails because:

  1.  **It necessitates sacrifice:** It structurally requires sacrificing non-moral values essential for a rich, meaningful, and fully human life – personal projects, deep non-instrumental relationships, aesthetic joy, intellectual curiosity for its own sake.
  2.  **It undermines value pluralism:** It imposes a rigid hierarchy where morality trumps all else, ignoring the irreducible diversity of human goods necessary for flourishing.
  3.  **It disrupts beneficial specialization:** The moral division of labor allows diverse human talents and values to contribute to society. Universal MMG would pressure everyone towards the perceived locus of highest marginal moral impact, homogenizing effort and eroding cultural, artistic, and intellectual spheres.
  4.  **Coordination is insufficient:** Even a perfectly coordinated society of saints cannot resolve the core conflict. The optimization imperative inherent in MMG would constantly threaten personal projects, and the contingent value assigned to non-moral pursuits under such a system fundamentally alters and diminishes them.

  Therefore, a healthy society does not require, and is arguably harmed by, universal maximal moral goodness. We need moral commitment, certainly, but also artists, scientists, lovers, gardeners, and philosophers whose pursuits, while mindful of their moral context, are not relentlessly optimized for maximal moral output. The ideal is not sainthood, but a responsible engagement with the plurality of values that constitute a human life, recognizing that sometimes, the most moral choice is to paint the masterpiece, solve the equation, or cherish a friend – precisely because these things are good in themselves, not just instruments for the greater good. This balance, not maximization, fosters true individual flourishing and a vibrant, multifaceted society.
