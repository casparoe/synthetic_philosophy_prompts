answer: |-
  1. Measure each applicant's welfare deficit as their current total quality-adjusted study-hour loss (QASHL), calculated from verified financial-shock impacts on study time and quality. Assign priority scores by multiplying the grant's QASHL reduction by the square root of the applicant's deficit; allocate funds in descending score order until the pool is exhausted, funding only whole requests.  
  2. Before approving any reallocation that reduces a grant to a better-off recipient (higher post-grant welfare) to fund a worse-off one, veto the redistribution if it fails to improve any worse-off recipient—defined as yielding less than one QASHL reduction for all targeted worse-off applicants—halting that specific transfer.  
  3. Case A: An eviction-threatened applicant (deficit: 1000 QASHL; £1000 grant for 1000 reduction) exhausts the pool except £50. A textbook applicant (deficit: 100 QASHL; requires £100 for any reduction) is denied, as partial funding yields zero benefit, leaving residual funds unallocated.  
  4. Case B: Two applicants tie at priority score 2500 (e.g., deficits 625 and 100 with benefits 100 and 250 respectively); the protocol halts, unable to resolve which should receive scarce funds.  
  5. Defer to the committee when the protocol halts at an equal-score tie or encounters measurement ambiguity (e.g., contested QASHL estimates or benefit projections) requiring normative judgement beyond the procedure.
