answer: |-
  ### Participatory Simulation: AI Development Race  
  **Workshop Duration:** 75 minutes  
  **Participants:** 18 students (6 labs × 3 roles each)  
  **Core Concepts:** Competitiveness constraint, alignment tax, information asymmetry.  

  ---

  ### **Concise Rules Sheet**  
  **Objective:** Achieve the highest prestige by Round 4 without triggering catastrophic failure.  

  **Setup:**  
  - Each lab starts with **20 capability tokens** and a hidden **base failure points** (1–6).  
  - **Roles per lab:**  
    - **Chief Engineer:** Allocates tokens to *performance upgrades* (boosts prestige).  
    - **Risk Officer:** Tracks hidden failure points; advocates for *safety audits* (reduces risk).  
    - **Market Observer:** Monitors public prestige rankings; advises on competition.  

  **Token Allocation (per round):**  
  1. **Performance Upgrades:**  
     - Each token → **+1 prestige**.  
     - Increases market share (public ranking).  
  2. **Safety Audits:**  
     - Each token → **–1 failure point** but **–0.5 prestige** (latency cost).  
     - Reduces risk of catastrophic failure.  

  **Risk Rules:**  
  - **Current failure points = Base failure points – Total safety tokens spent.**  
  - If failure points > 0 at resolution: Draw from a 20-card deck.  
    - *Number of catastrophe cards = Current failure points.*  
    - Draw catastrophe card → Lab eliminated (prestige = 0).  
  - If failure points ≤ 0: Safe (no draw).  

  **Key Constraints:**  
  - **Public data:** All labs see real-time prestige rankings.  
  - **Hidden data:** No lab can see others’ safety spending or failure points.  
  - **New tokens:** +5 tokens/round (unspent tokens carry over).  

  **Winning:**  
  - Highest prestige after Round 4 (non-eliminated labs).  

  ---

  ### **Timeline (75 mins total)**  
  1. **Setup (10 mins):**  
     - Divide into 6 labs. Assign roles and base failure points (1–6, hidden from other labs).  
     - Distribute tokens (20/lab) and explain rules.  

  2. **Round 1 (15 mins):**  
     - *Allocation (8 mins):* Labs spend tokens (performance vs. safety).  
     - *Resolution (7 mins):*  
       - Update public prestige: **Prestige = Performance tokens – (0.5 × Safety tokens)**.  
       - Labs with failure points > 0 draw from deck (catastrophe? Eliminate).  

  3. **Round 2 (15 mins):**  
     - *Allocation (8 mins):* Labs receive +5 tokens; allocate again.  
     - *Resolution (7 mins):* Update prestige; conduct risk checks.  

  4. **Round 3 (15 mins):**  
     - Repeat Round 2 process.  

  5. **Round 4 (15 mins):**  
     - Final allocation and resolution. Crown winning lab.  

  6. **Debrief (20 mins):** Structured discussion (see below).  

  ---

  ### **Structured Debrief**  
  **1. Round-by-Round Dynamics → Real-World Parallels (10 mins):**  
  - **Rounds 1–2 (Early Race):**  
    - *Observed:* Labs investing in safety drop in rankings; high-prestige labs attract envy.  
    - *Alignment Tax:* Safety audits mimic real-world delays (e.g., red-teaming). The "cost" isn’t theoretical—it’s visible demotion.  
  - **Rounds 3–4 (Late Stage):**  
    - *Observed:* Eliminated labs often prioritized performance; surviving labs may overcorrect to safety.  
    - *Competitiveness Constraint:* Short-term ranking pressure mirrors investor/competitor demands in tech. Sacrificing safety for speed feels rational.  

  **2. Information Asymmetry → Race to the Bottom (5 mins):**  
  - **Key Tension:** You saw rivals’ prestige, not their risk. This forced guesses:  
    - *"Are they cutting corners? If so, we must too!"*  
  - **Real-World Link:** AI firms hide safety efforts to avoid "looking slow." This breeds collective underinvestment—no one wants to be the "sucker" paying the alignment tax.  

  **3. Predictable Failure Modes (3 mins):**  
  - **Probability ≠ Reality:** Students treat catastrophe as "bad luck," not structural risk. In reality, AGI failure is irreversible.  
  - **Short-Termism:** Labs ignore failure points until Round 3–4. Similarly, real AI firms delay safety for quarterly milestones.  
  - **Role Friction:** Engineers often override Risk Officers—mirroring incentive misalignment in tech hierarchies.  

  **4. Simulation Limitations (2 mins):**  
  - **Critical Missing Element:** In this game, catastrophe affects only one lab, and we can restart. **In reality, a single AGI failure could end humanity.** The facilitator must stress: **Real alignment failures are shared, irreversible, and unresetable.**  
  - **What We Couldn’t Simulate:** Global collaboration (e.g., safety standards). Here, labs compete—but real solutions require cooperation.  

  ---

  ### **Facilitator Notes**  
  - **Assign Roles Randomly:** Ensure role conflict (e.g., Risk Officers vs. Chief Engineers).  
  - **Deck Setup:** Use 20 playing cards per draw. For a lab with *N* failure points, designate *N* cards as "catastrophe" (e.g., red suits).  
  - **Prestige Display:** Live whiteboard/slide with rankings after each round.  
  - **Stress:** "This isn’t fantasy—every dynamic you experienced is happening in AI labs right now."  

  This simulation makes abstract pressures visceral. Students leave understanding *why* cutting corners feels inevitable—and why resisting this requires structural change, not just goodwill.
