answer: |-
  ### Exam Question (75-minute essay)
  **Critically evaluate whether Galen Strawson’s Basic Argument against moral responsibility illicitly conflates causal-explanatory and normative-justificatory demands. Apply your analysis to the following scenario:**  
  > An adult human undergoes a 30-year procedure in which their biological neurons are incrementally replaced by synthetic substrates, preserving psychological continuity. The resulting being’s mental states trace causally *only* to prior synthetic states, not biological origins.  
  **Assess whether this scenario (a) reinforces Strawson’s regress, (b) exposes a flaw in it, or (c) remains neutral. Justify your position by analyzing how *each demand* (causal-explanatory and normative-justificatory) operates in Strawson’s reasoning and in the scenario.**

  ---

  ### Model Answer (≈700 words)  
  Strawson’s Basic Argument contends that true moral responsibility requires being *causa sui* (self-caused), which is impossible. The regress unfolds: for an agent to be morally responsible for action (A), they must be responsible for how they are mentally constituted (M) at the time of A. But responsibility for M requires responsibility for an earlier state (M-1), ad infinitum. Since no one is the ultimate cause of their initial mental state, moral responsibility is incoherent.  

  The critical dispute lies in whether Strawson’s regress illegitimately merges two distinct demands:  
  1. **Causal-explanatory demand**: Tracing the deterministic/non-deterministic causal history of mental states.  
  2. **Normative-justificatory demand**: Establishing whether the agent is the *appropriate source* of their will to deserve blame/praise.  

  **Settled elements**: The regress’s *logical structure* is uncontested. If responsibility for A requires responsibility for M, and this chains backward infinitely, ultimate responsibility is indeed impossible. Strawson is also correct that no agent creates their initial mental architecture.  

  **Contested interpretation**: Critics (e.g., Dennett, Fischer) argue Strawson conflates causation with justification. The causal demand asks *how* M came to exist; the normative demand asks whether M *validly reflects the agent’s authority* over their will. Strawson assumes both collapse into the same regress, but compatibilists separate them: an agent can meet the normative demand if their actions reflect their deep-self (e.g., values, reasoning) *without* self-creation.  

  **Applying the neural-replacement scenario**:  
  - **Causal-explanatory lens**: The scenario *seems* to circumvent biological determinism. The agent’s mental states now stem from synthetic origins, but this merely shifts the causal chain. Strawson would insist the regress holds: the agent isn’t responsible for the *first synthetic state* (which derived from original biology) or the engineering principles governing replacement. The causal history remains "given," not self-authored.  
  - **Normative-justificatory lens**: Psychological continuity ensures the agent’s character, values, and decisions persist. If normative sourcehood depends on whether actions express the agent’s identity (as compatibilists hold), the synthetic being *may* satisfy this demand. Its "source" is its psychologically continuous self, not deterministic biology. Here, Strawson’s regress appears question-begging: it assumes sourcehood *requires* causal ultimacy rather than non-alienated self-governance.  

  **Scenario verdict**: The case *exposes* the conflation but doesn’t resolve it.  
  - It *reinforces* the regress if sourcehood demands absolute self-creation: even synthetic states originate from external causes (engineers, initial biology).  
  - It *challenges* the regress if sourcehood is normative: the agent’s diachronic psychological unity might ground desert without *causa sui*.  
  - **Neutrality is unsustainable**: The scenario forces a choice. If the synthetic agent’s responsibility seems intuitive, it implies the normative demand can be decoupled from infinite causal regress. If responsibility seems absent, it validates Strawson’s conflation as necessary.  

  **Conclusion**: The neural replacement case reveals Strawson’s argument hinges on an undefended premise that normative justification *requires* causal ultimacy. While the regress is logically sound given this premise, the scenario pressures its necessity. If compatibilists can ground desert in non-regressive conditions (e.g., reasons-responsiveness), the Basic Argument’s fatalism may be overstated. The core philosophical dispute—whether responsibility is a causal or normative concept—remains unresolved.  

  ---

  ### Marking Scheme (Total: 20 marks)  
  **A-range (16–20)**: Excels in all moves, identifies ambiguities in Strawson, and uses scenario to test both demands.  
  **B-range (12–15)**: Competent but lacks depth in Move 3/4; oversimplifies the conflation or scenario implications.  

  | **Intellectual Move** | **Marks** | **A-range Excellence** | **B-range Limitations** | **Common Failures** |
  |-----------------------|-----------|------------------------|--------------------------|---------------------|
  | **1. Reconstructs Strawson’s regress accurately** | 3/20 | Precise articulation of infinite responsibility chain & *causa sui* impossibility. | Basic summary but misses recursive structure. | Misstates regress as requiring determinism (3 marks lost). |
  | **2. Diagnoses causal vs. normative demand ambiguity** | 6/20 | Clear distinction: causation (history of M) vs. justification (desert-grounding sourcehood). Cites compatibilist objections. | Identifies "two demands" but conflates them or lacks textual support. | Assumes Strawson intends no distinction (4–5 marks lost). |
  | **3. Applies BOTH demands to neural scenario** | 5/20 | For causal: Notes synthetic origins don’t stop regress. For normative: Argues psychological continuity may suffice for desert. | Treats scenario monolithically (e.g., only discusses causation). | Fixates on sci-fi details (e.g., "Is it still human?") ignoring philosophy (3–4 marks lost). |
  | **4. Evaluates scenario’s impact on the argument** | 4/20 | Judges if scenario challenges/reinforces regress *based on chosen demand*; acknowledges unsettled debate. | Assertion without linkage to demands (e.g., "It invalidates Strawson"). | Claims scenario "solves" free will via technology (2–3 marks lost). |
  | **5. Precision & scholarly neutrality** | 2/20 | Avoids presenting contested views (e.g., sourcehood definitions) as settled. Distinguishes logical validity from disputed premises. | Overstates case (e.g., "Strawson is definitively wrong"). | Misrepresents Strawson as a determinist (1–2 marks lost). |

  ---

  **Key Guidance for Grading**:  
  - **Settled**: Regress structure, impossibility of *causa sui*.  
  - **Contested**: Whether normative sourcehood *requires* causal ultimacy; validity of compatibilist alternatives.  
  - **Neutrality Requirement**: Model answer/marking scheme does **not** endorse compatibilism/incompatibilism. Top essays may conclude either way if they fairly engage both demands.
