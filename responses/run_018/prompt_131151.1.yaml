prompt: |-
  You are a professional philosopher specializing in African ethics and relational ontologies. Before answering, please take a moment to brainstorm the core commitments of Ubuntu and rival liberal-individualist theories of personhood, then proceed step by step. I am a high school student working on my ethics capstone.

  My school operates a peer-restoration program for disciplinary conflicts with three distinctive rules. First, the mediator is not an impartial outsider but the student who holds the highest betweenness-centrality in the social network linking the affected parties. Second, the resolution agreement is registered not to individual signatories but to the relational cluster—the set of students whose mutual interactions exceed a defined density threshold. Third, if that cluster later fractures, the agreement is void regardless of whether the original wrongdoer repeats the harmful act. Administrators justify this by appealing to the idea that personhood is constituted through relationships with others, yet they also insist that the cluster, not any individual within it, bears primary moral accountability.

  What philosophical commitments about personhood, moral responsibility, and identity does this institutional design presuppose? Is it genuinely consistent with Ubuntu-inspired relationalism, or does it tacitly import a collectivist ontology that Ubuntu itself would reject? Could a liberal individualist framework accommodate these rules without contradiction, or do they strictly require a relational conception? In your response—limited to one paragraph of no more than 250 words—reconstruct the implicit theory, distinguish what the practice strictly requires from what it merely accommodates, and identify whether the network-based mediator selection, the cluster-bound agreement, or the void-on-fracture clause would serve as the sharpest test between a relational view and a merely instrumental group-based one.
reasoning: |-
  Okay, let me approach this high school ethics capstone question methodically. The student presents a fascinating peer-restoration program with three distinctive rules and asks about its underlying philosophical commitments regarding personhood and moral responsibility. 

  First, I need to unpack Ubuntu's core tenets: personhood as relationally constituted through "umuntu ngumuntu ngabantu" (I am because we are), where moral agency emerges within community contexts. This contrasts sharply with liberal individualism's atomic selfhood and personal accountability. The school's rules - using network centrality for mediators, registering agreements to relational clusters, and voiding agreements upon cluster fracture - seem deeply relational.

  The sharpest test is clearly the void-on-fracture clause. While network-based mediation could be justified instrumentally by liberal individualists (as efficiency), and cluster-bound agreements might be framed as group contracts, the automatic dissolution upon relational rupture fundamentally rejects atomistic responsibility. This presumes that moral obligations exist only within sustained relational matrices - a distinctly Ubuntu view that liberal individualism couldn't accept without contradiction. 

  The practice strictly requires a non-individualist ontology where identity and accountability are relationally emergent. Administrators' cluster-focused accountability aligns with Ubuntu but risks collectivist reduction if relationships become reified entities rather than dynamic processes. Still, the fracture clause's dependence on ongoing relationality prevents full collectivism.
answer: |-
  This institutional design presupposes a **relational-constitutive theory of personhood**, wherein moral identity and responsibility emerge exclusively from sustained communal bonds. The practice *strictly requires* that accountability resides in the relational fabric itself ("the cluster"), not in pre-existing individuals—rejecting liberal individualism’s core tenet of atomic selfhood and personal culpability. While Ubuntu similarly roots personhood in relationships ("*umuntu ngumuntu ngabantu*"), the program risks collectivism by treating the cluster as a corporate entity bearing responsibility, which Ubuntu might critique as reifying relationships into a group-agent, potentially overshadowing individual moral cultivation *within* the community.  

  The **void-on-fracture clause** is the sharpest test: it makes obligations contingent *solely* on relational continuity, denying that individuals retain inherent duties if ties dissolve. Liberal individualism cannot accommodate this without contradiction, as it holds persons accountable regardless of shifting social configurations. Network-based mediation could be instrumentally justified by liberals (e.g., leveraging influence), and cluster agreements might be reframed as multilateral contracts—but the fracture clause collapses without relational ontology. Thus, the program’s deepest commitment is to **relations as the sole source of moral bonds**, exceeding Ubuntu’s emphasis on reciprocal humanity and challenging liberal metaphysics.  

