prompt: |-
  In graduate seminars on global justice, the proverb "charity begins at home" is repeatedly invoked—not as an opening observation but as a conversation-stopper—to resist the claim that wealthy states bear stringent, direct obligations to non-citizens, whether in refugee resettlement, climate reparations, or the distribution of globally scarce medical resources. Before I allow it to do that work in my classroom, I want its precise logical anatomy mapped. Please lay out, as a menu of distinct theses rather than a single interpretation, the precise claims that slogan could be expressing. For each reading, indicate: (i) whether it concerns the scope of moral obligation, the psychology of motivation, the efficacy of institutional delivery, or the normative legitimacy of state partiality; (ii) whether it amounts to a trivial empirical generalization, a defensible but limited principle of practical reason, or a false or morally arbitrary boundary; and (iii) whether, on that reading, the proverb genuinely supports a nationalist conclusion—say, that compatriots possess special agent-relative claims—or whether it remains fully compatible with a cosmopolitan distributive scheme. I am especially interested in the intermediate positions that smuggle in substantive philosophical commitments: for instance, a view that treats the state as a cooperative scheme for mutual advantage rather than as a node in a structure of global injustice; or a claim that associative duties are generated by shared political membership but are strictly non-transferable. Distinguish these from the genuinely trivial claim that agents should address local problems they are well-positioned to solve. Finally, tell me which of these readings is actually being invoked when an interlocutor uses the phrase to dismiss obligations to distant strangers, and whether that particular reading can survive the objection that national borders are, from the standpoint of moral justification, as arbitrary as place of birth.
reasoning: |-
  Okay, this user is clearly a philosophy professor teaching graduate seminars on global justice. They're grappling with a common but frustrating classroom dynamic where students use "charity begins at home" as a conversation-stopper against cosmopolitan obligations. What they really want is a precise philosophical toolkit to dissect this proverb. 

  Hmm, they're asking for three specific analytical dimensions: (i) the domain of the claim (scope/motivation/efficacy/legitimacy), (ii) its philosophical weight (trivial/defensible/false), and (iii) its nationalist implications. Smart framing - this avoids getting trapped in semantic debates. 

  I notice they're particularly wary of "intermediate positions" smuggling in nationalist premises. That's the real battleground. Like when someone assumes states are mutual advantage clubs rather than parts of global injustice structures - that's a whole contested worldview packaged in a proverb. 

  The birth arbitrariness objection at the end is key. If borders are morally arbitrary like birthplace, any special obligation claim needs serious justification. But which versions of the proverb actually engage with that? Most classroom uses probably invoke Claim 4 (priority) or Claim 5 (exclusivity), both of which crumble under that critique. 

  User's frustration is palpable - they see students wielding this as a rhetorical shield. My response should arm them to say: "Ah, but which of these six interpretations are you asserting?" That forces precision. The taxonomy needs to expose how Claims 2-5 covertly rely on unchallenged premises about political obligation. 

  Biggest challenge is distinguishing Claim 1 (the trivial/irrefutable version) from the rest. That's the decoy - students might retreat to it when pressed, but it doesn't actually support nationalism. Gotta flag that move explicitly. 

  Also worth noting: none of these address the psychological version (Claim 3) head-on. Maybe that's the next layer - if efficacy requires local focus, does that actually negate obligations or just reshape how we fulfill them? But user wants logical anatomy first. 

  Final thought: The "cooperative scheme" vs "node of injustice" framing is brilliant. That's the core philosophical rift underneath this whole debate. My response should make that tectonic plate visible.
answer: |-
  Here is a logical anatomy of "charity begins at home," structured as distinct theses with your requested analysis. The most common classroom invocations typically rely on **Claims 4 or 5**, which face serious challenges from the "moral arbitrariness" objection.

  ---

  ### **Claim 1: The Practical Priority Thesis**  
  *(i)* **Domain:** Efficacy of institutional delivery + Psychology of motivation.  
  *(ii)* **Status:** Defensible, limited principle of practical reason.  
  *(iii)* **Nationalist Conclusion?** **No.** Compatible with cosmopolitanism.  
  *Description:* Agents/states achieve greater moral efficacy by addressing proximate problems where they possess superior knowledge, cultural competence, and institutional capacity. Local action builds trust and competence for broader obligations.  
  *Compatibility with Cosmopolitanism:* Accepts global obligations but prioritizes *implementation* locally first (e.g., "Fix local institutions to better aid refugees later"). Survives the arbitrariness objection by focusing on *contingent* capacities, not inherent moral boundaries.

  ---

  ### **Claim 2: The Motivational Foundational Thesis**  
  *(i)* **Domain:** Psychology of motivation.  
  *(ii)* **Status:** Plausible but contingent empirical generalization.  
  *(iii)* **Nationalist Conclusion?** **No.** Neutral between ethical frameworks.  
  *Description:* Cultivating moral concern typically develops through concentric circles (self → family → community → nation → world). Strong local engagement fosters the empathetic capacity for later global action.  
  *Compatibility with Cosmopolitanism:* Cosmopolitans can endorse this as a developmental strategy ("Start local to build habits for global giving"). The arbitrariness objection is irrelevant here—it’s descriptive psychology.

  ---

  ### **Claim 3: The Lexical Priority Thesis**  
  *(i)* **Domain:** Scope of moral obligation.  
  *(ii)* **Status:** Defensible but controversial principle of practical reason.  
  *(iii)* **Nationalist Conclusion?** **Yes, weakly.** Demands priority, not necessarily exclusivity.  
  *Description:* Obligations to compatriots must be *fully satisfied* before any duties to non-citizens activate (e.g., "No foreign aid until zero domestic poverty"). Treats local obligations as lexically prior.  
  *Compatibility with Cosmopolitanism?* **Incompatible.** Global obligations are conditional and perpetually deferrable.  
  *Philosophical Commitments:* Assumes obligations are *hierarchically ordered* by associative ties. **Vulnerable to arbitrariness objection:** If borders lack deep moral significance, lexical priority appears unjustifiably rigid.

  ---

  ### **Claim 4: The Special Obligations Thesis**  
  *(i)* **Domain:** Normative legitimacy of state partiality.  
  *(ii)* **Status:** Defensible but contested principle (relies on associative theories).  
  *(iii)* **Nationalist Conclusion?** **Yes, strongly.** Grounds agent-relative duties.  
  *Description:* Shared citizenship generates intrinsically stronger obligations than those owed to strangers (e.g., via cooperative schemes, collective self-determination, or mutual reliance).  
  *Philosophical Commitments:* Treats the state as a **cooperative venture for mutual advantage** (Rawlsian) or a **relational community of fate**.  
  *Compatibility with Cosmopolitanism?* **Tension:** Accepts *some* global duties but insists compatriots have *stronger* claims.  
  *Arbitrariness Objection:* **Potentially fatal.** If borders are morally arbitrary, "shared citizenship" cannot bear justificatory weight unless grounded in deeper values (e.g., democratic reciprocity). Birthplace is arbitrary, but *ongoing cooperation* may not be—this is the nationalist rebuttal.

  ---

  ### **Claim 5: The Exclusive Focus Thesis**  
  *(i)* **Domain:** Scope of moral obligation.  
  *(ii)* **Status:** False or morally arbitrary boundary.  
  *(iii)* **Nationalist Conclusion?** **Yes, absolutely.** Denies direct duties to non-citizens.  
  *Description:* "Home" defines the *limit* of obligatory concern. Duties of justice apply only within borders; assistance to outsiders is supererogatory charity.  
  *Philosophical Commitments:* Assumes the state is the **sole legitimate site of distributive justice** (statist view). Rejects global structural injustice.  
  *Compatibility with Cosmopolitanism?* **None.**  
  *Arbitrariness Objection:* **Devastating.** If borders lack pre-institutional moral significance, restricting obligations to co-citizens is ethically indefensible. Treating birthplace as a moral boundary is analogous to justifying feudalism by noble birth.

  ---

  ### **Claim 6: The Anti-Hypocrisy Thesis**  
  *(i)* **Domain:** Psychology of motivation + Normative legitimacy.  
  *(ii)* **Status:** Trivial empirical generalization (when descriptive); moralistic fallacy (when prescriptive).  
  *(iii)* **Nationalist Conclusion?** **Not inherently.** Often misused to support one.  
  *Description:* Agents who neglect local suffering lose standing to demand global justice ("Clean your room before saving the world"). Focuses on consistency, not scope.  
  *Compatibility with Cosmopolitanism:* Cosmopolitans can agree hypocrisy undermines credibility but reject it as a substantive limit on obligations.  
  *Risk:* Often conflated with Claim 4/5 to imply local failures *nullify* global duties.

  ---

  ### **Which Reading is Typically Invoked in Classrooms?**  
  Interlocutors dismissing obligations to distant strangers most often invoke **Claim 4 (Special Obligations)** or **Claim 5 (Exclusive Focus)**, dressed in the rhetoric of **Claim 6 (Anti-Hypocrisy)**. They assert that obligations *fundamentally differ* in kind or priority for compatriots vs. non-citizens, treating shared citizenship as intrinsically morally generative.

  ---

  ### **Can These Readings Survive the "Arbitrariness" Objection?**  
  - **Claims 1–3:** **Yes.** Their force derives from practicality or psychology, not moral geography.  
  - **Claim 4:** **Conditionally.** Only if citizenship can be shown to create *non-arbitrary* obligations (e.g., via democratic reciprocity, cooperative surplus). Still vulnerable if global structures generate analogous duties (e.g., climate harms).  
  - **Claims 5–6 (misused):** **No.** They treat borders as axiomatic moral boundaries, which the arbitrariness objection directly undermines. If birthplace is arbitrary, restricting justice to co-citizens is unjustifiable.  

  ---

  ### **Key Philosophical Tensions Smuggled In**  
  1. **The Nature of the State:** Is it a *bounded cooperative venture* (favoring Claims 4–5) or a *contingent node in global systems* (favoring Claims 1–3)?  
  2. **Duties vs. Capacity:** Does proximity/enablement create *new duties* (Claim 4) or merely shape *how we discharge* pre-existing ones (Claim 1)?  
  3. **Associative Duties:** Are they *transferable* (local engagement strengthens global capacity) or *exclusive* (special ties displace general duties)?  

  This menu should equip you to dissect classroom invocations and force precision: *Which thesis are you asserting, and can it bear justificatory weight?*
