answer: |-
  **Bottom line:** The most neglected branch is **Functional Binding + No Macro Subjects** – rarely defended because denying macro subjects while relying on functional integration creates tension (functional organization typically aims to *explain* macro subjects).

  **Taxonomy of Panpsychism & The Combination Problem**

  ```
  Are there genuine micro-level phenomenal subjects?
  │
  ├─── No: **Non-Panpsychist Exit** (e.g., Physicalism, Idealism, Eliminativism about micro & macro) → *Awkward: Not relevant to panpsychism's combination problem.*
  │
  └─── Yes:
       │
       ├── Binding Relation = **Phenomenal Bonding** (Primitive, non-structural, unifying relation)
       │   │
       │   ├── Allow Cosmopsychism Fallback if Micro→Macro Fails? **No**:
       │   │   │
       │   │   └── Macro-Consciousness Entailment: **Deterministic**
       │   │       └── **Constitutive Panpsychism (Goff-style)** → *Awkward: Brute, unexplained nature of phenomenal bonding itself.*
       │   │   └── Macro-Consciousness Entailment: **Probabilistic** → *Empty: Unattractive (bonding suggests intrinsic connection, probability seems mismatched).*
       │   │
       │   └── Allow Cosmopsychism Fallback if Micro→Macro Fails? **Yes**:
       │       │
       │       └── **Cosmopsychism** (Primordial cosmic consciousness is fundamental, micro-subjects are derivative) → *Awkward: The "decombination problem" (how does one cosmic subject break apart?).*
       │
       └── Binding Relation = **Functional/Informational Integration** (Structural, causal, network-based unity)
           │
           ├── Allow Cosmopsychism Fallback if Micro→Macro Fails? **No**:
           │   │
           │   ├── Macro-Consciousness Entailment: **Deterministic**
           │   │   └── **Chalmers-style Emergent Panpsychism** → *Awkward: Commits to strong ontological emergence for subjects.*
           │   │
           │   └── Macro-Consciousness Entailment: **Probabilistic** → *Empty: Unexplored/Niche (Why would functional integration only *sometimes* yield macro-subjects?).*
           │
           ├── Allow Cosmopsychism Fallback if Micro→Macro Fails? **Yes**:
           │   └── **Cosmopsychism** (Functional integration *within* the cosmic mind explains macro-subjects) → *Awkward: Decombination problem + functional integration role (potentially redundant).*
           │
           └── **Deny Genuine Macro-Level Subjects Exist**:
               └── **Eliminativism about Macro-Subjects (Micro-subjects only)** → *Awkward: Denies the existence of the very phenomenon (my consciousness, your consciousness) needing explanation.*
               └── *Note: Functional Binding + No Macro Subjects → **Empty: Incoherent/Unstable** (Functional integration is typically posited *to explain macro-consciousness*; denying it undermines the motivation).*
  ```

  **Key Ambiguity:** The line between **Functional Binding + Deterministic + No Cosmopsychism Fallback (Emergent Panpsychism)** and some **Functionalist Constitutive Panpsychism** is blurry. Both rely on functional integration, differing mainly on whether macro-subjects are *fundamentally new entities* (Emergent) or *constituted but not fundamentally novel* (Constitutive functionalist). This distinction often hinges on commitments about fundamentality and emergence rather than easily observable differences.
