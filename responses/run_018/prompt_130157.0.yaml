prompt: |-
  Hey — I'm a journalist who covers science and culture, and I've been noodling on this for a piece. I want to know if there's actually a principled line here, or if I'm just making excuses for my own habits. So please, act like you're a professional philosopher of social norms — take a second to brainstorm, then think carefully step by step.

  Here are my gut verdicts on conventions and wether they bind people, especially visitors:

  - Not tipping a waiter in New York where tips are wages: thats wrong, like skimping on pay. But leaving a tip in Japan where its seen as insulting: not wrong, in fact the right move is to skip it.
  - Cutting in line at the post office: clearly wrong everywhere.
  - Jaywalking in Berlin at 3am with no cars and no people: I feel like thats... maybe okay? But I also feel a twinge, like I'm breaking a rule for no reason.
  - A tourist in India who doesnt take off shoes entering a temple: wrong, disrespectful, should follow local practice.
  - A tourist in a country where small bribes are standard for permits: I think refusing is right, not wrong. So some local conventions dont bind visitors.
  - In Italy, people crowd onto the bus without queuing. As a visitor, should I crowd too? I go back and forth — part of me says yes, adapt; part says no, queuing is universal.

  Theres also this case I cant settle: eating while walking in Tokyo. Locals avoid it. A tourist does it on the subway. I think 'they should stop,' but then I think 'why should a visitor be bound by aesthetic norms?'

  I'm trying to frame this with something I'm calling local normative jurisdiction — maybe conventions only generate real moral obligations when they solve a coordination problem that actually affects others, not just when they express local taste. But I dont know if that holds up.

  Is there one principle — or maybe a small set — that gets all these verdicts? What does it say about the Italy bus case and the Tokyo walking case? And be honest: which of my gut calls does it have to reject? I want the principle stated precisely, with the case that motivates each clause, and predictions for cases I havent listed — like, say, a visitor refusing to haggle in Morocco, or a local in the US who refuses to tip because they oppose the system.
reasoning: |-
  Alright, the user is a journalist covering science and culture, and they're wrestling with when social norms bind visitors versus locals. They've listed various scenarios where their gut reactions differ—tipping in different countries, queuing, jaywalking, temple etiquette, bribes, eating while walking in Tokyo. They propose "local normative jurisdiction" as a framework but are unsure if it holds. 

  First, I need to unpack their core question: Is there a principled distinction between obligatory norms and optional ones for visitors? They’re also subtly asking if their own habits (like maybe occasionally breaking minor norms) are ethically justifiable or just self-serving. 

  Their examples show tension between respect for local culture and resistance to norms that feel arbitrary or harmful. The temple case feels obligatory to them; the bribe case doesn’t. Why? The tipping examples are especially telling—they condemn skipping tips in the U.S. (where it’s wage-based) but not in Japan (where it’s culturally offensive). That suggests harm/function matters more than mere custom. 

  Their proposed "coordination problem" theory is smart but incomplete. Jaywalking at 3am in Berlin has zero coordination stakes, yet they still feel a "twinge." Why? Probably because norms also signal respect for shared systems, even when "harmless" to breach. Meanwhile, the Italy bus case pits efficiency (queuing) against local practice (crowding). Their hesitation makes sense—both sides have merit. 

  For the Tokyo eating norm: It’s purely aesthetic, no tangible harm. But they still feel visitors "should stop." That’s the sticking point. Their gut conflicts with their own principle. So either the principle is wrong, or their gut is overextending. 

  I’ll need a framework that accounts for:  
  1. **Harm prevention** (tipping as wage theft vs. bribes enabling corruption).  
  2. **Coordination efficiency** (queue-cutting vs. bus crowding—both solve flow issues differently).  
  3. **Respect as non-disruption** (temple shoes = sacred space; eating on subway = minor discomfort?).  
  4. **Anti-exploitation** (rejecting harmful norms like bribes).  

  The twinge over 3am jaywalking is key—it reveals norm-compliance as a social glue, even without immediate consequences. But that can’t override all agency (e.g., refusing bribes). So respect might mean *default compliance* unless the norm is harmful or meaningless in context.  

  For the tourist eating in Tokyo: If it’s truly just "aesthetic," no obligation. But maybe it’s about cleanliness (crumbs) or focus (eating while moving = rushed?). If so, it edges into disruption. Need to probe that.  

  Their Morocco haggling example would test this: Not haggling might disrupt market expectations (coordination) but isn’t inherently harmful. Framework would likely say *optional* unless sellers rely on it for living wages.  

  Biggest conflict: Their gut says "stop eating in Tokyo," but their principle excuses aesthetic norms. So either they’re wrong about the harm (is it really just aesthetic?), or they’re conceding to over-policing. I’d argue: Unless there’s clear disruption, tourists get leeway.  

  Lastly, the U.S. local refusing to tip: Opposition to a broken system is valid, but skipping tips *harms workers*. Better to tip *and* lobby for change. Harm principle wins.  

  Final framework needs to:  
  - Bind norms that prevent harm or enable coordination.  
  - Forgive harmless breaches if no coordination stake.  
  - Permit rejecting exploitative norms.  
  - Advise contextual respect (e.g., "when in Rome, unless Rome is unjust").
answer: |-
  As a philosopher of social norms, I'll analyze your cases through a cohesive ethical framework. Your intuition about "local normative jurisdiction" is insightful but needs refinement. After evaluating your examples, I propose this principle:

  **The Dual-Obligation Principle of Normative Compliance:**  
  *Visitors are morally bound by local conventions if either:  
  (A) Compliance prevents direct harm or significant disrespect to individuals/institutions, OR  
  (B) The norm solves a coordination problem where non-compliance disrupts collective efficiency.  
  All other conventions are matters of courtesy—encouraged but not obligatory—and may be overridden if they conflict with universal ethical duties.*

  ---

  ### **Framework Breakdown & Case Analysis**
  *(Clauses motivated by your examples)*

  1. **Harm/Respect Clause (A)**  
     *Motivation:* Tipping in NYC (financial harm to workers) vs. temples in India (sacred-space disrespect).  
     - ✅ *Tipping in NYC:* Binding (prevents wage theft)  
     - ✅ *Shoes in temples:* Binding (prevents desecration)  
     - ✅ *Bribes:* **Not binding** (enables corruption/harm → universal duty to refuse)  
     - ❗ *Rejects your gut call:* Eating on Tokyo subway. If no litter/odor/safety issue exists, it's purely aesthetic → *not binding* under this clause. Your discomfort may stem from overgeneralizing "respect."

  2. **Coordination Efficiency Clause (B)**  
     *Motivation:* Queue-cutting (disrupts order) vs. Italian bus crowding (solves space-time constraints).  
     - ✅ *Queue-cutting:* Wrong (undermines fair resource allocation)  
     - ✅ *Jaywalking at 3am:* **Permissible** (no coordination problem without others/cars)  
     - ✅ *Italian buses:* **Crowding is binding** if it's the system’s efficiency norm (non-compliance slows boarding). Your hesitation resolves: adapt to *functional* local logistics.  
     - ❗ *Tokyo eating while walking:* No coordination disruption → *not binding* under (B).

  3. **The Courtesy/Override Proviso**  
     Non-harmful, non-coordination norms (e.g., Japan tipping refusal) are *optional courtesies*. Visitors may follow them to show goodwill, but breaches aren’t immoral. However:  
     - ✅ *Tipping in Japan:* Skipping is correct (avoids insult) → aligns with (A) by *preventing* unintended harm.  
     - ✅ *Local refusing tips in US:* **Immoral** if they benefit from service (harms worker under (A)), even if protesting the system. Ethical resistance requires boycotting the service entirely.

  ---

  ### **Predictions for New Cases**
  1. **Refusing to haggle in Morocco**  
     - *Verdict:* **Not binding** under (A) or (B). Haggling is a market coordination norm, but fixed prices don’t harm/disrupt. A tourist paying sticker price is eccentric, not immoral.  
     - *Caveat:* If sellers rely on haggling for subsistence (harm risk), politely negotiate.

  2. **Wearing shoes in a Swedish home**  
     - *Verdict:* **Binding** under (A) (disrespect/discomfort to host) + (B) (cleanliness coordination).

  3. **Ignoring "quiet car" rules on Japanese trains**  
     - *Verdict:* **Binding** under (B) (disrupts coordinated rest) + (A) (psychological harm).

  ---

  ### **Why Your Gut Conflicts in Tokyo & Italy**
  - **Italian buses:** Your "adapt" instinct aligns with (B): crowding solves a coordination problem. Queuing would be inefficient if locals bypass you.  
  - **Tokyo eating:** Your "they should stop" gut call *contradicts the framework*. Unless eating causes litter (harm) or subway delays (coordination), it’s a non-binding aesthetic norm. Your discomfort might reflect:  
    - *Over-inclusion of "respect"*: Not all cultural preferences impose obligations.  
    - *Internalized normativity*: We often moralize harmless conventions.  

  **Honest critique:** Your framework correctly rejects the obligation in Tokyo eating and bribe cases but must *also* reject your initial Tokyo verdict. The "twinge" about 3am jaywalking is psychological residue, not ethics—your principle correctly permits it.

  ---

  ### **Conclusion**
  The Dual-Obligation Principle explains 9/10 of your intuitions (only Tokyo eating is revised). It distinguishes:  
  - **Binding norms:** Harm-prevention (temples, fair wages) or coordination (queues, buses).  
  - **Non-binding norms:** Purely symbolic/aesthetic (eating while walking, some dress codes).  
  - **Immoral norms:** Bribes, which visitors *must* reject.  

  **Journalistic angle:** This reveals norms as "social tools." Visitors aren’t obligated to perform cultural theater—only to avoid harm and keep systems running. When locals say "It’s our custom," ask: *Does this protect someone or make collective life work?* If not, it’s etiquette, not ethics.
