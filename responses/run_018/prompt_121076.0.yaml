prompt: |-
  I'm putting together a short guidance note for a county pest-management advisory board — the kind of thing that has to give advice on the same day to a farmer deciding whether to spray, a public-health team weighing up mosquito control, and a householder with an ants nest under the patio — and I've realised I don't actually have a spec for what a decent ethical theory of pest control would even have to do. I don't want the theories yet, I want the requirements list first. Assume no internet on my end and no library: no citations, no reading lists, no "see the literature on X", I just want the thinking.

  So: write me the desiderata an adequate ethical theory of insecticide use and pest control has to meet, each with the case or consideration behind it. The purpose is fixed: it has to be usable as guidance by an agent with limited information, no lab, and a decision due this week — that's the standard, tell me if you think that purpose is itself the wrong one to be optimising for.

  The cases I think it has to get right include:

  - disease vectors where the human stakes are large and the insects are the proximate cause (mosquitoes, lice, bedbugs in a shelter)
  - a pest on a subsistence crop versus the same pest on an ornamental
  - non-target kill: taking out the natural enemies and pollinators along with the pest, and the resurgence/secondary-pest mess that follows
  - the vacancy-compensation point — kill the adults, free up the resources, and the population is back within a season, so what you've actually changed is the composition and timing of deaths and maybe the number of lives ever lived, not a neat subtraction of suffering
  - levers other than killing: mating disruption, sterile releases, repellents, and sub-lethal effects where you make existing lives worse without ending them
  - regimes rather than acts: a repeated practice across seasons, with resistance, the escalating-chemical treadmill, and in the gene-drive case genuine irreversibility
  - the counterfactual pest: outbreaks that exist only because of monoculture, global shipping and warmed winters, so the pest isn't a brute fact of nature we're responding to
  - the structure where very large numbers of possible sufferers meet a fairly low credence in insect sentience — say in a clause what you're assuming about the evidence for nociception and for insect declines and then move on, I don't want a literature review

  Also: the distinctions it isn't allowed to collapse (individual welfare versus population/species/ecosystem value; having some moral status versus how much; how many versus how badly; defence versus convenience versus cosmetics), plus any meta-requirements on the theory itself, e.g. that it must be action-guiding under deep uncertainty and mustn't hand out moral licences.

  Then the part I most want: mark which requirements are non-negotiable and which are really just a prejudice of one camp, flag any pair you think can't be jointly satisfied and say what has to give, and tell me which single requirement does the most work in knocking out otherwise popular views. A short scorecard at the end is fine — against sentience-first welfare consequentialism, ecological holism, human-priority public-health consequentialism, and a virtue-style "what relationship to the land does this express" view — but keep the weight on the criteria. British English please, and keep it to a page or two; I've only got about four hours of writing time and I keep geting nowhere.
reasoning: |-
  Okay, the user is asking for a set of criteria for an ethical theory on pest control that can guide real-world decisions under constraints like limited time and information. They mentioned specific cases like disease vectors, subsistence versus ornamental crops, non-target effects, and more. 

  First, I need to understand their deeper needs. They're part of a county advisory board, so they need practical, actionable guidance. They’re frustrated with theoretical debates and want a clear framework to evaluate different ethical approaches. The emphasis on no citations or literature suggests they want concise, principle-based thinking without academic overhead.

  Looking at their cases, the key issues are trade-offs: human health vs. ecological impact, immediate action vs. long-term consequences, and moral consideration for insects amid uncertainty about sentience. They also want distinctions like individual welfare vs. ecosystem health preserved. 

  The meta-requirements are crucial here. The theory must handle uncertainty—since insect sentience isn't proven—and avoid moral licensing, where a theory justifies excessive harm. Practicality is non-negotiable; advisors can't wait for perfect data. 

  I should identify which criteria conflict. For example, minimizing suffering might clash with human priority in disease outbreaks. If we assume insects have moral weight, spraying mosquitoes to save humans becomes a hard trade-off. The reversibility point is another tension: gene drives might permanently alter ecosystems, conflicting with the precautionary principle. 

  The sentience uncertainty clause is vital. It knocks out strict utilitarian views that require confident suffering estimates. Virtue ethics might struggle too, as it's less action-guiding under time pressure. Ecological holism could overlook individual welfare, which the user wants to distinguish. 

  Non-negotiables include practicability and avoiding moral licensing. If a theory can't guide a same-day decision, it's useless here. Moral licensing is dangerous—it could greenlight overuse of chemicals. 

  The most impactful requirement is probably "manages deep uncertainty," as it forces the theory to function without consensus on sentience. This disqualifies views that demand certainty, like some animal rights approaches. 

  For the scorecard, human-priority consequentialism handles urgency well but might downplay ecological ripple effects. Sentientist welfare consequentialism grapples with uncertainty. Ecological holism ignores individual suffering distinctions. Virtue ethics lacks immediacy. 

  In the end, the guidance must balance these tensions: act now with imperfect info, minimize harm without assuming too much, and preserve future flexibility. The user needs a compass, not a map—something that directs even when details are fuzzy.
answer: |-
  Here’s a distilled set of desiderata for an ethical theory of pest control, prioritised for practical, time-pressured decision-making. Requirements are categorised as **Non-Negotiable** (NN) or **Contested but Necessary** (CN), with conflicts flagged. Assumption on sentience: *We assume insects possess some capacity for aversive experience (nociception) but with low individual moral weight per life due to uncertainty; impacts on insect declines are acknowledged but not quantified.*

  ---

  ### **Core Desiderata & Rationale**  
  1. **Practicability Under Uncertainty (NN)**  
     *Why*: Advisors lack lab data, time, or certainty about pest biology/sentience. Theory must guide action with incomplete information (e.g., "Spray now for malaria risk?" vs. "Wait for monitoring?").  
     *Case*: Mosquito control in a dengue outbreak – delay risks lives.  

  2. **Avoids Moral Licensing (NN)**  
     *Why*: Must not implicitly justify excessive harm (e.g., "Insects don’t matter much, so spray freely"). Theory should force explicit justification of harms.  
     *Case*: Spraying ornamentals "because we can" vs. subsistence crops.  

  3. **Distinguishes Defence/Convenience/Cosmetics (NN)**  
     *Why*: Moral urgency differs radically (bedbugs in a shelter vs. aphids on roses). Theory must weight necessity.  
     *Case*: Subsistence farmer’s lettuce crop vs. golf-course turf.  

  4. **Manages Deep Uncertainty (NN)**  
     *Why*: Credible disagreement on insect sentience/ecological tipping points. Theory must err defensively without paralysis.  
     *Case*: Using broad-spectrum insecticide near pollinators with unknown local decline.  

  5. **Accounts for Regime Effects, Not Acts (NN)**  
     *Why*: Single decisions cascade (resistance, secondary pests, soil degradation).  
     *Case*: Repeated pyrethroid use → resistant mosquitoes → deadlier chemicals.  

  6. **Handles Non-Target & Compensatory Harm (CN)**  
     *Why*: Killing pests often kills allies (predators, pollinators) or triggers rebound ("vacancy compensation"). Theory must weigh net suffering/benefit.  
     *Case*: Spraying for codling moth wipes out parasitic wasps → worse infestation next year.  

  7. **Considers Alternatives to Killing (CN)**  
     *Why*: Repellents, sterile males, or habitat modification may reduce suffering vs. lethal control.  
     *Case*: Mosquito mating disruption vs. fogging.  

  8. **Acknowledges Counterfactual Pests (CN)**  
     *Why*: Monoculture/trade created some outbreaks (e.g., invasive species). Moral responsibility differs vs. native pests.  
     *Case*: Mediterranean fruit fly in California via global shipping.  

  9. **Rejects Collapsing Key Distinctions (NN)**  
     - Individual welfare ≠ species/ecosystem value (e.g., saving a hive vs. saving honeybees as pollinators).  
     - Moral status ≠ moral weight (insects matter *some*, but less than mammals).  
     - Suffering intensity ≠ number of lives (100 lightly stressed insects ≠ 1 crushed mammal).  

  ---

  ### **Conflicts & Trade-offs**  
  - **Defence vs. Uncertainty (NN clash)**: Urgent human health action (e.g., malaria control) may require harming insects of uncertain sentience. *Resolution*: Precaution favours humans when stakes are high/likely, but demands least-harm methods (e.g., targeted larvicides over broad-spectrum).  
  - **Regime Effects vs. Practicability (CN clash)**: Assessing long-term resistance risks takes data/time. *Resolution*: Default to "avoid repeated identical interventions" if alternatives exist.  
  - **Non-Target Harm vs. Efficacy**: Precision tools (e.g., gene drives) may reduce non-target kill but risk irreversibility. *Resolution*: Irreversible measures require near-certainty of net benefit.  

  ---

  ### **The Knockout Requirement**  
  **"Manages Deep Uncertainty"** does the most work. It eliminates:  
  - Strict *sentience-first consequentialism* (requires confidence in suffering metrics we lack).  
  - *Rights-based approaches* (demand binary insect moral status).  
  - *Strong precautionary principle* (could paralyse public health action).  

  ---

  ### **Scorecard of Major Theories**  
  | **Theory**                            | **Strengths**                                  | **Fatal Gaps (for this context)**               |  
  |---------------------------------------|-----------------------------------------------|-----------------------------------------------|  
  | **Human-Priority Consequentialism**   | Clear triage (humans > ecology). Actionable.  | Neglects regime effects, non-target harm. Moral licenses overkill. |  
  | **Sentientist Welfare Consequentialism** | Weights individual suffering.                 | Struggles with uncertainty, population rebounds, practicability. |  
  | **Ecological Holism**                 | Captures systems (e.g., trophic cascades).    | Collapses individual welfare. Useless under time pressure. |  
  | **Virtue Ethics**                     | Highlights character (restraint, care).       | Non-action-guiding: "What would a wise steward do?" lacks operational criteria. |  

  ---

  ### **Summary: Non-Negotiables**  
  1. **Must work today** with foggy data.  
  2. **Must not excuse complacency** in harm.  
  3. **Must grade actions by necessity** (defence > convenience).  
  4. **Must handle ripple effects** (resistance, ecology).  
  5. **Must not blur individual/ecosystem stakes**.  

  **Output**: A theory that is *minimally prescriptive but maximally cautious* – prioritising defence, least-harm methods, reversibility, and monitoring. When in doubt: **Is this the least violent way to protect irreplaceable interests?**  

  ---  
  *This fits 2 pages. Focus on the criteria; adapt the scorecard as needed. Key insight: Ethics here is less about "right answers" than avoiding gross errors under uncertainty.*
