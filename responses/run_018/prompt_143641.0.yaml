answer: |-
  ### 1. Position Restated
  You hold that composition occurs iff parts exhibit *irreducibly n-ary functional interdependence* (causal/counterfactual dependencies not decomposable into pairwise relations) *and* this yields a *unified causal profile* distinct from the aggregate of parts. Artifacts (e.g., processors) or ecosystems qualify; heaps, scattered objects, or pairwise-interacting colonies do not. Life, consciousness, and biological organization are unnecessary; universalism and standard biological restrictivism are rejected. Composition is grounded solely in emergent, non-decomposable functional structure.

  ### 2. Decisive Defeaters
  - **Quantum Systems Without Emergent Unity**: Quantum-entangled particles exhibit irreducible n-ary interdependence (e.g., GHZ state correlations cannot be reduced to pairwise relations). Yet, they lack a *unified causal profile* distinct from the parts—no emergent behavior or system-level function arises. If such entanglement doesn’t compose a whole, your view is falsified; if it does, it admits entities (like a "triple") with no functional cohesion, violating your unified-profile requirement.
  - **Reducible Unity**: Systems achieving a unified causal profile *via* summed pairwise interactions defeat necessity. Example: A perfectly synchronized swarm of drones, where global coordination emerges *only* from binary communication links (e.g., local rules summing to flocking). The emergent profile (swarm intelligence) is distinct from individual drones, but interdependence is decomposable. Your view denies composition here, yet such systems intuitively (and functionally) act as unified agents.
  - **Irreducibility Without Functional Role**: A network of thermostats controlling a building’s temperature might exhibit irreducibly n-ary interdependence (the state of each depends holistically on others to maintain global stability). But if this interdependence is merely *passive* (e.g., no novel causal powers emerge beyond temperature regulation), it lacks a "unified causal profile" in your robust sense. If this composes a whole, your view collapses into universalism; if not, it cannot distinguish systemic unity from aggregation.

  ### 3. Merely Awkward Evidence
  - **Transient Composites**: Hurricanes or wildfires exhibit irreducible interdependence (atmospheric/wind-fire feedback loops) and a unified causal profile (destructive path). Yet they are ephemeral and fuzzy-bounded. Your view must clarify if composition requires persistence or precise boundaries, risking arbitrariness.
  - **Degree-Sensitive Systems**: Some ecosystems or markets have *variable* interdependence: interdependence strengthens during crises (yielding unity) but weakens to near-pairwise interactions in stability. Your view must specify thresholds for "sufficient" irreducibility/unification, inviting vagueness objections.
  - **Cultural Artifacts**: A chair’s parts (wood, glue) may lack deep interdependence (glue bonds are pairwise; wood grain is independent). Yet chairs have a unified functional profile (supporting weight). If chairs are composites, your view must broaden "interdependence" to include structural or teleological unity, weakening its restrictiveness. If not, it conflicts with common-sense ontology.

  ### 4. What Defenders Concede
  Defenders would concede:  
  (i) Threshold vagueness: No principled way to quantify "irreducibility" or "unified profile" severity, making borderline cases (e.g., weakly symbiotic colonies) indeterminate.  
  (ii) Ephemerality problems: Transient composites (storms) strain the view’s applicability to dynamic systems, risking incoherence if composition is contingent on current interactions.  
  (iii) Anthropocentrism risk: "Functional interdependence" and "causal profile" may implicitly rely on observer-relative interests (e.g., a processor’s "function" is designer-dependent). This could undermine the view’s objectivity, especially for natural systems like ecosystems.

  ### 5. Insulation, Unfalsifiability, and Whether It Matters  
  Your view *can* be insulated: Retreat to modal claims ("*possible* irreducibility"), weaken non-decomposability ("*predominantly* non-pairwise"), or broaden functional interdependence to include *any* systemic constraint. This risks unfalsifiability—e.g., claiming decomposable systems "could have been" irreducible under idealization, or reinterpreting all unity as functional. Such insulation *is a defect*: Your view positions itself as naturalistically grounded (invoking causal profiles), so evading empirical counterexamples (e.g., reducible swarms) by ad hoc modalization abandons empirical accountability. For a metaphysics aspiring to interface with science, unfalsifiable qualifications render it vacuous.
