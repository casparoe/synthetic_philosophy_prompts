  - Distortion: Framing norms as "authoritative but incompatible protocols" avoids addressing why such norms would coexist without meta-arbitration.
  - Missing piece: The phenomenology of being condemned by both norms can't be captured - nodes don't experience condemnation.

  The residue assessment is crucial: 
