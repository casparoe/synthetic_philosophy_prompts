prompt: |-
  I run an upper-level undergraduate seminar on institutional design with about twenty students and a single ninety-minute session to devote to this. The course has been working through the idea of futarchy: roughly, the proposal that a polity should democratically choose a metric of success, while prediction markets, rather than majority votes, decide which policies are actually adopted, by forecasting that metric conditional on each candidate policy. I want the students to feel, in one session, both the force of the claim that markets can aggregate dispersed private information better than open deliberation or voting, and the force of the standard doubts: thin or one-sided markets, manipulation, unequal access to information, the gap between what a person bets and what a person wants, and the problem of choosing and gaming the success metric. The activity should be runnable without any opening lecture on the idea: the procedure should simply be introduced to them as "how today's decision will be made," and the conceptual vocabulary should be held back until the debrief.

  Please design a prediction-market governance game in which the class actually governs some small real decision using something like the futarchic procedure: first a values vote on what outcome dimension should count as success (for example, what would make the decision good for the class), then a conditional prediction market on that dimension under two candidate policies, and finally a decision rule that mechanically follows the market's judgment rather than the initial vote. The decision should be real and consequential enough that preferences are authentic—a scheduling choice, an allocation of workload, a grade-weight adjustment within fixed bounds—but contained enough to be settled in the room. Give me complete rules, a trading mechanism using paper tokens or play money, a payoff scheme that does not require real money, a minute-by-minute timeline for the ninety minutes, and a debrief that maps specific moments in the exercise onto the parts of the futarchic idea: the separation of values from beliefs, the hope for information aggregation, and the failure points the students actually encountered.

  Finally, tell me what will predictably go wrong the first time I run it—collusion, markets too thin to price anything, students trading to express preferences rather than to convey information, one student holding a dominant informational position, or the class strategically gaming the metric it just chose—and how I should handle each failure when it happens. Be frank about which feature of futarchy a single classroom exercise cannot reproduce, such as the difference between a one-off, small-stakes decision and repeated, high-stakes governance where the metric itself becomes a target of strategic behavior.
reasoning: |-
  We are designing a classroom activity to simulate futarchy. The decision must be real and consequential. Here's a proposal:

  **Decision Context:** 
  We need a decision that is real, low-stakes but meaningful to students, and can be implemented immediately. Example: 
  - How to allocate bonus points for class participation (e.g., whether to give more weight to in-class contributions or to pre-class online posts). 
  - OR: A choice about the format of the final session (e.g., having a guest speaker vs. a student-led debate). 

  But let's choose one that is simple and has two clear alternatives. I propose:

  **The Decision:** The class will decide on the **snack for the next seminar meeting**. The two options are:
  1. **Option A:** Healthy snacks (e.g., fruit and yogurt)
  2. **Option B:** Less healthy but popular snacks (e.g., cookies and chips)

  This decision is real (the chosen snack will be provided), and students have preferences (health vs. taste). It is also contained.

  **Futarchy Procedure:**
  1. **Values Vote:** Vote on the success metric. We ask: "What should be the goal of the snack? What makes the snack choice a success?" 
     - Present two metrics (they must be measurable at the next meeting):
       - **Metric 1:** Maximize the percentage of students who consume at least one snack item.
       - **Metric 2:** Maximize the average rating (on a scale of 1-5) of the snacks by the students.

     - Students vote by secret ballot on which metric to use. The winning metric becomes the success metric for the market.

  2. **Prediction Market Setup:**
     - We create two conditional markets:
       - Market A: Predicts the value of the success metric if Option A (healthy) is chosen.
       - Market B: Predicts the value of the success metric if Option B (unhealthy) is chosen.
     - The market will trade using play money. Each student gets an initial endowment (e.g., 100 tokens). 
     - The market will run for a fixed time (e.g., 30 minutes).

  3. **Market Mechanism:**
     - We use a continuous double auction (like a stock market) but simplified. Students can submit buy or sell orders for contracts in either market. 
     - Each market trades a contract that pays out in tokens based on the actual outcome of the metric. 
       - For example, if Metric 1 (participation) wins: 
          - Contract A pays 100 tokens if the participation rate with healthy snacks is, say, 70% or higher (we need a binary outcome for simplicity, but note: we can have a linear payout? But that complicates. Alternatively, we can have the contract pay the actual value of the metric, scaled to tokens. However, for simplicity and time, we use a binary event). 
       - BUT: We want to avoid having to measure the outcome after the fact (because the next meeting is in the future). So we must simulate the outcome? That breaks authenticity.

     - **Solution:** We need an immediate outcome. Therefore, we change the decision context to something that can be decided and measured in the same session.

  **Revised Decision (to allow immediate outcome):**

  **The Decision:** The class will decide on **the format of the last 15 minutes of today's session**. Two options:
  1. **Option A:** A quick, fun quiz game (with candy prizes) on the readings.
  2. **Option B:** An open discussion where students can ask any remaining questions about the course.

  **Success Metrics (to be voted on):**
  - **Metric 1 (Engagement):** The percentage of students who actively participate (speak or answer a question) in the last 15 minutes.
  - **Metric 2 (Satisfaction):** The average self-reported rating (on a 1-5 scale) of the last 15 minutes, collected immediately after.

  Both metrics can be measured at the end of the session.

  **Procedure:**
  1. **Values Vote (5 minutes):**
     - Explain: "We are going to make a decision about the end of today's class. First, we must decide what our goal is. What makes the last 15 minutes a success? Is it that many people participate (Metric 1) or that people feel satisfied (Metric 2)?"
     - Vote by show of hands or secret ballot. Tally and announce the winning metric.

  2. **Market Setup (5 minutes):**
     - Explain the two options (A: quiz, B: open discussion).
     - Explain the contracts:
       - Contract A: Pays out based on the actual value of the winning metric if Option A is chosen.
       - Contract B: Pays out based on the actual value of the winning metric if Option B is chosen.
     - Payout details:
       - If the winning metric is participation (Metric 1): 
          - Contract A pays 100 tokens for every 1% of participation rate (so if 80% participate, it pays 80 tokens? But then the range is 0-100). Actually, let's make it linear: the contract pays 100 * (actual participation rate). But then we need to define participation. We'll say: a student participates if they speak at least once in the quiz (by answering) or in the discussion (by asking a question or commenting). We'll have the TA(s) count.
       - If the winning metric is satisfaction (Metric 2):
          - Contract A pays 20 * (average rating) [because the average rating is 1-5, so 20*5=100, so it scales to 0-100]. Similarly for Contract B.

     - However, note: we need two markets, but only the market corresponding to the chosen option will be settled. The other will be void (pays 0). But we want students to trade both because they don't know which option will be chosen? Wait: in futarchy, we choose the option that the market predicts will have the higher metric. So we need to compare the two markets.

     - How we decide: After trading, we look at the final price of Contract A and Contract B. The contract price represents the market's prediction of the metric (scaled appropriately). Then we choose the option with the higher predicted metric.

     - Therefore, we need to design the contract so that the price is the predicted value of the metric (in tokens). We can do this by having the contract pay the actual metric value (scaled to tokens). Then the price should reflect the expected payout.

     - Example: For Metric 1 (participation), if Contract A is trading at 75 tokens, that means the market expects 75% participation if Option A is chosen.

     - Then the option with the higher price (expected metric) wins.

  3. **Trading (30 minutes):**
     - Each student gets 100 tokens of play money and a trading sheet (to record trades if we don't have a digital platform). We'll use a physical market on the board.
     - Designate two areas of the board for Market A and Market B.
     - Students can come to the front and post buy or sell orders. For example:
          - "Sell 1 share of A for 70 tokens" 
          - "Buy 1 share of B for 60 tokens"
     - When a trade occurs, it is recorded and the last traded price is updated on the board.
     - The instructor or a TA serves as the market maker to help match orders and keep the board updated. Alternatively, we can have a student volunteer as the market recorder.

     - **Important:** Students are allowed to trade as much as they want. At the end, they hold contracts that will be settled after we run the chosen option and measure the metric.

  4. **Decision and Execution (15 minutes):**
     - After trading, we take the last traded price of Contract A and Contract B. 
     - The option (A or B) with the higher price wins. If tie, flip a coin.
     - Then, we execute the winning option (either the quiz or the open discussion) for 15 minutes.
     - During the activity, we measure the metric (either participation or satisfaction). 
       - For participation: TAs count the number of students who speak. Participation rate = (number who speak) / (total students).
       - For satisfaction: After the 15 minutes, hand out a slip for students to rate the activity 1-5. Collect and average.

  5. **Payout (5 minutes):**
     - Settle the contracts of the winning option: 
          - If Metric 1 won, then Contract of the chosen option pays 100 * (actual participation rate) tokens per share.
          - If Metric 2 won, then Contract of the chosen option pays 20 * (average rating) tokens per share.
     - The other contract (for the unchosen option) is void (pays 0).
     - Students can use their token winnings for nothing (it's play money) or we can assign a small bonus (e.g., 1 extra credit point for every 100 tokens, capped at 5 points). But if we do that, we have to be cautious about incentives. Alternatively, just for fun.

  6. **Debrief (30 minutes):**
     - Start by asking students to describe their experience.
     - Then map to the concepts:
          - The values vote: This was about what we care about (participation vs. satisfaction). We separated values from beliefs.
          - The markets: These were meant to aggregate beliefs about what policy (option) would achieve the value metric best. 
          - What happened in the market? Did prices move? Did they reflect the consensus? 
          - Problems encountered: 
              - Thin markets? (not enough trades)
              - Did some students have better information? (e.g., they know their own preferences, but also might know friends')
              - Manipulation? Did anyone try to move the price by trading a lot?
              - Did students trade based on their preference for the option (wanting a particular option to win) rather than on their belief about the metric? That would be a problem.
          - The metric: Was it easy to measure? Did the chosen metric make sense? How might it be gamed? (e.g., for participation, students might speak one word to be counted; for satisfaction, they might rate strategically.)
          - The outcome: Did the market choose the option that actually achieved the higher metric? If not, why? (market was wrong)

  **Timeline (90 minutes total):**
  - 0-5 min: Introduction to the activity (without theory, just the procedure) and the decision (what we are deciding: the last 15 minutes).
  - 5-10 min: Values vote and explanation of the two metrics. Vote and announce the winning metric.
  - 10-15 min: Explain the two options (quiz vs. discussion) and the contracts. Distribute tokens (100 per student) and explain trading rules.
  - 15-45 min: Trading session (30 min). Set up two markets on the board. Students can trade by coming to the board and writing orders. The instructor/TA updates prices and matches trades.
  - 45-50 min: Close the market. Record the last prices for Contract A and Contract B. Choose the option with the higher price.
  - 50-65 min: Execute the chosen option (15 min). Meanwhile, if the metric is participation, TAs count participation. If satisfaction, we do the rating at the end.
  - 65-70 min: Measure the metric (if satisfaction, collect and compute the average rating). Announce the result.
  - 70-75 min: Settle the contracts (calculate payouts for the winning contract). Students can compute their total tokens.
  - 75-90 min: Debrief (15 min) [Note: I allocated 30 minutes above, but we have 15 left. So adjust debrief to 15 min? Or trim the activity?]

  **Adjust Timeline:**
  We have 90 minutes. Let's trim trading to 20 minutes and the execution to 10 minutes? But the execution must be 15 minutes by design. Alternatively, we can do:

  - 0-5: Intro and decision context.
  - 5-10: Values vote (5 min).
  - 10-15: Explain contracts and trading rules (5 min).
  - 15-35: Trading (20 min).
  - 35-40: Decide the winning option (5 min).
  - 40-55: Execute the winning option (15 min).
  - 55-60: Measure and announce metric (5 min).
  - 60-65: Settle contracts (5 min).
  - 65-90: Debrief (25 min).

  **Debrief Outline (25 minutes):**
  1. (5 min) What happened? Ask students to share their experience trading and during the activity.
  2. (5 min) What did they think the market was doing? Did they feel they had information? How did they trade?
  3. (10 min) Map to futarchy:
     - The separation: We voted on what we value (metric) and then used markets to decide the policy (option). Why? Because the market aggregates information about what policy will achieve the metric.
     - How well did the market aggregate information? Did the price reflect the actual outcome? Why or why not?
     - Problems: 
          - Thin market: Not enough trades, so the price might not be efficient. 
          - Manipulation: Did anyone try to push the price? 
          - Trading on preferences: Did you buy the contract for the option you wanted even if you thought it wouldn't achieve the metric? 
          - Information asymmetry: Some students might know more about their friends' intentions (e.g., "I know my friends hate quizzes so participation will be low in the quiz").
          - The metric: Did we choose a good metric? How might it be gamed? (e.g., for participation, students might speak just to be counted, even if it's not meaningful; for satisfaction, they might rate low if they are unhappy with the process).
  4. (5 min) Connect to the real world: How would this work in a society? What are the challenges (e.g., repeated play, high stakes, complex metrics)? What are the potential benefits?

  **What Will Go Wrong:**

  1. **Thin Markets:** With only 20 students, there might be few trades. Prices may not move much or may be set by one or two traders.
     - *Handling:* Encourage trading. The instructor can act as a market maker, posting bids and asks to create liquidity. Or, if using a board, the instructor can help by matching orders.

  2. **Trading on Preferences, Not Beliefs:** Students might buy the contract for the option they want to win, hoping to influence the decision (even if they don't believe it will achieve the metric). This is a major deviation from the futarchy ideal.
     - *Handling:* During the debrief, highlight this. Explain that in an ideal market, traders should only care about making a profit, so they should trade based on what they think the actual metric will be. But in practice, people might trade to express preferences. This is a key critique.

  3. **Information Asymmetry:** Some students might have better information (e.g., they talked to friends and know that many will not participate in the quiz). This is actually good because it reflects how markets aggregate dispersed information. But if one student has dominant information, they might not trade (to avoid revealing) or trade too much (to profit).
     - *Handling:* This is a feature, not a bug. Point out in debrief that markets rely on private information being revealed through trading.

  4. **Manipulation:** A student might try to move the price by placing large orders (even without information) to get their preferred option chosen.
     - *Handling:* This is a real problem. In debrief, discuss how in real markets, manipulation is a risk. Also, note that with play money, there's less cost to manipulative behavior.

  5. **Choosing and Gaming the Metric:** The class might choose a metric that is easy to game. For example, if they choose participation, they might plan to just say one word. Or if satisfaction, they might rate strategically (e.g., rate low if they wanted the other option).
     - *Handling:* Point out that in real futarchy, the metric must be carefully designed to be robust and aligned with values. Also, note that the metric was chosen by vote, so it reflects the class's values at the time, but might not be perfect.

  6. **The Outcome Might Not Match the Prediction:** The market might predict that Option A will have a higher metric, but then Option B would have actually been better. We won't know because we only ran one option. This is a limitation of the exercise.
     - *Handling:* Explain that in real futarchy, we never know the counterfactual. We only run the chosen policy. We have to trust the market.

  **Limitations of the Exercise:**
  - The stakes are low and play money, so trading may not be serious.
  - It's a one-off, so there's no learning over time.
  - The metric is simple and immediate, whereas real policy metrics (like GDP, health outcomes) are complex and long-term.
  - Strategic behavior on the metric: In the real world, if a metric is used repeatedly, people might change their behavior to game it. We don't have that in one session.

  **Rules Handout (for students):**

  **Today's Decision:** We are deciding the format for the last 15 minutes of class. The two options are:
  - **Option A (Quiz):** A quick quiz game on the readings. Prizes (candy) for correct answers.
  - **Option B (Discussion):** An open discussion where you can ask any questions about the course.

  **Procedure:**
  1. **Values Vote:** We voted on the success metric. The winning metric is: [Announce after vote].

  2. **Prediction Markets:**
     - We have two contracts:
          - Contract A: Pays based on the winning metric if Option A (quiz) is chosen.
          - Contract B: Pays based on the winning metric if Option B (discussion) is chosen.
     - The payout for the contract of the chosen option will be:
          - If the metric is **participation**: 100 tokens per share for every 1% of participation. (e.g., 80% participation => 80 tokens per share)
          - If the metric is **satisfaction**: 20 tokens per share for every 1 point of the average rating (so 5.0 would pay 100 tokens per share).
     - The contract for the option that is not chosen will pay 0.

  3. **Trading:**
     - You start with 100 tokens.
     - You can buy and sell contracts at any price you agree on with another trader.
     - To trade, come to the board and write your order (e.g., "Buy 1 share of A at 60 tokens" or "Sell 1 share of B at 70 tokens"). If someone matches, you trade and record the price.
     - The last traded price for each contract will be displayed.

  4. **Decision:** After trading ends, we compare the last traded prices of Contract A and Contract B. The option with the higher price wins.

  5. **Execution and Settlement:** We run the winning option. Then we measure the metric and pay out the contracts accordingly.

  **Trading Tips:**
  - Trade based on what you think the actual metric will be for each option. For example, if you think the participation rate for Option A would be 75%, then Contract A should be worth around 75 tokens to you. If you can buy it for less, you make a profit.
  - Remember, the contract only pays if the option is chosen. So if you hold Contract A and Option B wins, you get nothing.

  **Materials:**
  - Tokens (play money) in denominations (e.g., 1, 5, 10, 20, 50) or just record balances on a sheet.
  - A whiteboard or poster paper to record orders and trades.

  This design should fit the time and allow students to experience both the promise and pitfalls of futarchy in a compressed, authentic setting.
answer: |-
  ### Futarchy Classroom Simulation: "The Snack Decision"
  **Core Idea:** Students will use futarchy to decide what snacks are served at the next class session. This decision is real (you’ll actually provide the snacks), low-cost, and preference-driven, ensuring authentic engagement.

  ---

  ### **Rules & Setup**  
  #### **Materials Needed**  
  - Red and blue paper tokens (100 per student, e.g., red for "Healthy," blue for "Unhealthy")  
  - Voting ballots  
  - A public "market board" (whiteboard) displaying real-time prices  
  - Timer  
  - Two jars labeled "Healthy" (Option A) and "Unhealthy" (Option B) for final voting  

  #### **Decision Options**  
  - **Option A (Healthy):** Fruit, yogurt, nuts  
  - **Option B (Unhealthy):** Cookies, chips, soda  

  #### **Step-by-Step Procedure**  
  **(Total: 90 minutes)**  

  1. **Introduction (5 min)**  
     - Announce: "Today, we’ll decide snacks for our next class using a new method. No lectures—just follow the rules."  
     - Explain only concrete steps: values vote → trading → decision.  

  2. **Values Vote: Choosing the Metric (10 min)**  
     - **Prompt:** "What makes snack choice 'successful'? Vote for one metric:"  
       - **Metric 1 (Health):** "Maximize the % of students who eat at least one healthy item."  
       - **Metric 2 (Enjoyment):** "Maximize the average enjoyment rating (1–5) in a post-snack survey."  
     - **Vote:** Secret ballot. Tally and announce the winning metric.  

  3. **Prediction Market Setup (5 min)**  
     - **Contracts:**  
       - **Contract A:** Pays 100 tokens if **Option A (Healthy)** achieves the winning metric.  
       - **Contract B:** Pays 100 tokens if **Option B (Unhealthy)** achieves the winning metric.  
     - **Trading Rules:**  
       - Each student gets 100 tokens (play money).  
       - Trading is open for 25 minutes.  
       - Students trade contracts by shouting bids/offers (e.g., "Sell 1 A for 80 tokens!").  
       - Record trades on the market board (update prices publicly).  
       - **Payoff:** If the chosen snack (A or B) hits the metric, holders of its contract get 100 tokens per share. Losers get 0.  

  4. **Trading Session (25 min)**  
     - **Instructor Role:**  
       - Record trades and update prices on the board (e.g., "Contract A last trade: 75 tokens").  
       - Enforce clarity: No side deals; all trades public.  
     - **Key Mechanics:**  
       - Prices reflect the market’s predicted probability of success (e.g., Contract A at 60 tokens = 60% chance of hitting the metric).  

  5. **Decision Rule (5 min)**  
     - Compare final prices of Contract A and Contract B.  
     - **Policy Choice:** The option with the *higher* final price wins (e.g., if A trades at 70, B at 65, serve healthy snacks).  

  6. **Metric Validation & Payout (15 min at next class)**  
     - **Post-Snack Survey:** At the next session, students:  
       - (If Health won): Report if they ate ≥1 healthy item (yes/no).  
       - (If Enjoyment won): Rate snacks 1–5.  
     - **Payout:** Calculate if the metric was hit (e.g., ≥60% ate healthy, or avg rating ≥3.5). Pay token holders accordingly.  

  7. **Debrief (25 min)**  
     - Start with student reactions: "What felt broken? What worked?"  
     - Map to futarchy concepts:  
       | **Classroom Moment**          | **Futarchy Concept**                          |  
       |-------------------------------|-----------------------------------------------|  
       | Values vote                   | Separating values (metric) from beliefs (market) |  
       | Price shifts during trading   | Markets aggregating dispersed information     |  
       | Suspicious trades/manipulation| Thin markets, unequal information access      |  
       | Metric gaming (e.g., lying on survey) | Strategic behavior vs. honest signaling |  
       | Final price vs. popular vote  | Markets > democracy for belief aggregation    |  

  ---

  ### **What Will Go Wrong (and How to Handle It)**  
  1. **Thin/One-Sided Markets**  
     - **Predictable Issue:** Few trades; prices stuck at extremes (e.g., all 0 or 100).  
     - **Why:** Limited participants, low stakes, hesitation to trade.  
     - **Handle It:**  
       - Seed initial liquidity: Offer to buy/sell at 50 tokens to kickstart trading.  
       - Debrief: "Markets need many players. Real futarchy requires broad participation."  

  2. **Trading to Express Preferences, Not Beliefs**  
     - **Predictable Issue:** Students buy contracts for their *preferred snack*, not their true belief about the metric.  
     - **Why:** Emotional investment in snacks > "profit" from tokens.  
     - **Handle It:**  
       - Announce pre-trading: "Trade based on what you think *will happen*, not what you *want*."  
       - Debrief: "Did anyone ignore the metric? This is the 'preferences vs. beliefs' gap in real futarchy."  

  3. **Informational Dominance**  
     - **Predictable Issue:** One student (e.g., a nutrition major) sways prices with "expert" knowledge.  
     - **Why:** Unequal information access.  
     - **Handle It:**  
       - If spotted, ask: "Did experts dominate? Is this fair or efficient?" during debrief.  

  4. **Gaming the Metric**  
     - **Predictable Issue:** Students plan to lie on the survey (e.g., rate healthy snacks poorly to "prove" the market wrong).  
     - **Why:** Low stakes and playful rebellion.  
     - **Handle It:**  
       - Pre-survey: "Answer honestly—this is a test of the system, not your preferences."  
       - Debrief: "In real governance, people *always* game the metric. Futarchy fails if the metric isn’t robust."  

  5. **Collusion/Manipulation**  
     - **Predictable Issue:** A group corners the market to force an outcome.  
     - **Why:** Play money = no cost to manipulation.  
     - **Handle It:**  
       - If observed, pause trading: "Remember, trades should reflect *individual* beliefs."  
       - Debrief: "Markets are vulnerable to coordinated actors. Real futarchy needs anti-manipulation guards."  

  ---

  ### **What the Exercise Can’t Replicate**  
  - **High Stakes & Repeated Play:**  
    - Classroom snacks are trivial. Real futarchy involves policies (e.g., taxes) where people *invest* in manipulating the metric long-term.  
    - **Debrief Point:** "In one-off decisions, markets might work. But when the metric is repeatedly targeted, it becomes corruptible—like GDP encouraging pollution."  

  - **Scale & Complexity:**  
    - With 20 students, information aggregation is shallow. Real prediction markets need thousands to capture "wisdom of crowds."  
    - **Debrief Point:** "Your market was thin. Real futarchy relies on liquid, competitive markets—something hard to guarantee."  

  ---

  ### **Timeline**  
  - **0–5 min:** Introduce activity + snack options.  
  - **5–15 min:** Values vote (metric).  
  - **15–20 min:** Explain contracts/trading.  
  - **20–45 min:** Trading session.  
  - **45–50 min:** Compare final prices → choose snacks.  
  - **50–65 min:** Prepare for debrief (students jot reflections).  
  - **65–90 min:** Structured debrief (link experiences to futarchy’s promises/pitfalls).  

  This design forces students to *live* the tension: markets feel powerful when prices move on hidden information, but fragile when players game the system. By making the decision real (snacks!) and the flaws visible, they’ll grasp why futarchy is both alluring and contested.
