  ## On al-Ghazālī's Fire and Custom

  Each dawn the rose, the dew, the sky's display
  repeat their scripted roles beneath the sun.
  Observe the tinder catch: we name it **fire**,
  presume inherent force compels the **burn**.
  But no deep heat in wood commands the **flame**,
  only a constant, witnessed **custom** stands.

  What precedent, what **custom** can explain
  the sudden brightness? Not the wood's own **fire**,
  nor logic's chain. See how the eager **flame**
  leaps up as if recalled to its true task. **Now**
  mark the dry leaf curl and swiftly **burn**—
  is this effect? Or grace allowed to **burn**?

  To call it cause would be a hollow **burn**,
  a human term imposed upon the **habit**
  of constant pairing. Watch the pattern **now**:
  the fuel consumed beside the hungry **fire**.
  No engine lurks within the core of **fire**;
  it is the stage, not author, of the **flame**.

  We seek the reason flickering in the **flame**,
  the hidden spring that makes the substance **burn**.
  But search reveals no essence in the **fire**,
  no spark that binds effect by iron **habit**.
  It is the Maker's will, not mine, nor **fire**'s,
  that joins the two anew each fleeting **now**.

  Consider well the miracle of **now**:
  this instant's fragile, independent **flame**.
  No chain survives, no residue from **fire**
  compels the next result. The leaf must **burn**
  because the Law, the deep sustaining **habit**,
  ordains the sequence: fuel, then **fire**, then **burn**.

  We see the dry grass yield, begin to **burn**,
  accepting what the present tense of **now**
  allots by consecrated, fixed **habit**.
  No past existence fuels the present **flame**;
  it is bestowed afresh. The seeming **fire**
  possesses nothing but the name of **fire**.

  O Witness, note: this **flame**, this constant **burn**,
  this strict **habit** repeated without flaw,
  this **fire** we trust—**now** watch the pattern turn.
  A Hand relights the **burn**, the **fire**, the **flame**.

  ---

  **Annotations for the Historian of Islamic Philosophy:**

  *   **End-Word Rotation:** The strict sestina form (1-2-3-4-5-6 / 6-1-5-2-4-3 / 3-6-4-1-2-5 / 5-3-2-6-1-4 / 4-5-1-3-6-2 / 2-4-6-5-3-1) embodies the *appearance* of necessary sequence and regularity ("al-'ada" - custom/habit).
  *   **Denial of Intrinsic Causation:** Lines explicitly deny inherent power within "fire" to cause "burn" (Stanza 1: "no deep heat... commands", Stanza 3: "No engine lurks... not author", Stanza 4: "No chain survives... compels", Stanza 5: "possesses nothing but the name"). "Flame" is similarly treated as an event, not a product.
  *   **Discrete Events ("Now"):** The word "now" emphasizes the instantaneity of each occurrence. The connection between end-words (e.g., "fire" and "burn") in adjacent lines is presented as coincidental within God's constant recreation (Stanza 4: "this instant's fragile, independent flame", Stanza 5: "bestowed afresh").
  *   **God as Sustainer (Not Explicit Cause):** Divine action is implied ("Maker's will", "Law", "consecrated, fixed habit") as the source of the constant conjunction, but the poem focuses on the *denial* of secondary causality rather than explicitly theologizing. The "Hand" in the envoi is the strongest hint.
  *   **Preserved Regularity:** The poem repeatedly acknowledges the perfect, observable regularity ("Each dawn... repeat", "constant, witnessed custom", "strict habit repeated without flaw").
  *   **Envoi's Tension:** The final three lines gather the end-words ("flame", "burn", "habit", "fire", "now", "burn", "fire", "flame") without asserting a causal link *between them*. The "pattern turn" references the sestina's form itself and the observed sequence, while "A Hand relights..." emphasizes divine recreation of the *entire event* (burning) as a unit, not causal connection between fire and burning. The question of *inherent* link remains unresolved.
  *   **Not Skepticism:** The external world ("rose", "dew", "sky", "tinder", "wood", "leaf", "grass") is presented as real and reliably observed; the doubt is solely about the *nature of the connection* between events.
