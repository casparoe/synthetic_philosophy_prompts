answer: |-
  Here is the translation of heterophenomenology into narrative craft concepts, followed by the residue report:

  **Heterophenomenology Restated in Narrative Terms:**

  1.  **First-person reports as texts describing a heterophenomenological world:**
      *   **Narrative Analog:** A character's **diegetic narration** (spoken or written within the story) or **internal monologue/focalized perception** (presented as their direct experience).
      *   **Function & Distortion:** The analog functions similarly: both present the subject's/character's world as *they* experience and describe it. However, in narrative, this presentation is *itself* the core event or texture of the fictional reality. The distortion lies in *origin* and *frame*: the character's report is generated *within* the authored diegesis and serves the story's reality, not an external investigator's data collection. Heterophenomenology treats the report as primary evidence *from* reality; fiction treats it as constructed event *within* reality.
  2.  **Adopt a neutral stance regarding the reality of the described entities/events:**
      *   **Narrative Analog:** The creation of an **unreliable narrator** or the deliberate orchestration of **focalization instability**, where the reader is given reason to doubt the literal truth of the narrated perception/event but must still engage with it *as presented* by the character/narrator.
      *   **Function & Distortion:** Both involve withholding authorial endorsement of the subjective report's truth. However, narrative unreliability is typically *strategic* and *interpretive*: it creates ambiguity, irony, or thematic complexity *within the fictional world*, often implying a deeper truth accessible through textual cues. The investigator's neutrality is *methodological* and *agnostic*, aiming for data purity without implying an underlying fictional truth. The distortion is that literary neutrality is a *device* generating meaning; heterophenomenology's neutrality is a *stance* bracketing ontological commitment.
  3.  **Use the data to study the subject's theory of consciousness:**
      *   **Narrative Analog:** Employing **free indirect discourse (FID)** or layered focalization to expose a character's **implicit worldview, beliefs, or cognitive framework** – how they *interpret* and *narrativize* their own experience, shaping the reader's understanding of *that character's mind* rather than an objective reality.
      *   **Function & Distortion:** Both focus on the subject's/character's *construct* of experience. However, FID and layered focalization in fiction often serve to *deepen* the reader's empathetic immersion in the character's *lived, phenomenal reality* ("this is *how* it feels to be them"). Heterophenomenology uses the report strictly to map the subject's *explanatory model or belief system* about consciousness ("this is *what they say* it is like"). The distortion lies in the *telos*: fiction uses these techniques to explore or evoke consciousness *as experienced*; heterophenomenology uses them to study consciousness *as reported belief*.

  **Residue Report: The Unbridgeable Gap**

  1.  **The Elimination of Phenomenal Presence:** The core commitment of heterophenomenology that lacks any true counterpart in narrative craft is its **deflationary/eliminativist stance towards phenomenal consciousness itself**. Novels fundamentally construct and interrogate *interiority as a felt, qualitative reality* for the character (and vicariously, the reader). Techniques like FID, internal focalization, and stream of consciousness *aim* to create the illusion of direct access to qualia – the "what-it-is-likeness." Heterophenomenology explicitly denies the need for (or even the coherence of) this phenomenal level beyond the subject's report and the investigator's model. Fiction *presupposes* and *crafts* phenomenal presence; heterophenomenology *brackets* and potentially *explains it away* as the subject's theoretical construct. Novels *trade* on the reality of subjective experience within their diegesis; heterophenomenology suspends belief in it as an objective datum.
  2.  **The Presupposition of Text as Non-Referential (to Phenomena):** Heterophenomenology relies on a presupposition alien to fiction: that first-person reports are *texts* that *describe a world* (the heterophenomenological world) which may or may not correspond to an underlying reality (actual conscious experience), and that this reality is inaccessible except through these texts/models. Fiction, however, operates under a different contract:
      *   The **Implied Author-Reader Contract** establishes that the textual presentation *is* the reality of the fictional consciousness *within the diegesis*. The character's report (via narration, FID, focalization) *constitutes* their conscious experience for the reader. Questioning its "reality" within the story world is a matter of unreliability or differing perspectives *within* that world, not a methodological suspension of belief *about* the ontological status of consciousness itself.
      *   The gap suggests that **narrative theory does not "miss" something essential about subjective report; it operates with a fundamentally different, irreducible commitment to constructing phenomenal reality.** Fiction *creates* the subjective experience it reports. Heterophenomenology treats subjective reports as data points about a theorizing mind. The gap arises because heterophenomenology presupposes a hard distinction between the report (text) and the phenomenon (consciousness) that fiction dissolves through enactment. Narrative craft demonstrates that "subjective report" *is* the primary mode of constructing interiority, not a secondary description of it. The residue is heterophenomenology's underlying skepticism about the report's referent (phenomenal consciousness), a skepticism fiction cannot adopt without abandoning its core project of evoking lived experience.
