answer: |-
  Here's a reusable decision procedure incorporating your requirements, designed for group efficiency. Steps are sequential; failure at any gate stops the process. Judgment-heavy steps are flagged with 🧠.

  ---

  ### **Sentencing Review Decision Procedure**
  1. **Shadow Proportionality Check**  
     *"Is the proposed punishment proportional to the worst realistically avoidable version of the crime, given the offender's circumstances?"*  
     - **Yes → Proceed to Step 2**  
     - **No → REJECT** (Punishment is fundamentally unjust)  
     - 🧠 *Judgment call: Requires assessing "realistic avoidability" (e.g., Was theft of bread by a homeless person truly avoidable?)*  

  2. **Desert Cap Check**  
     *"Does the punishment exceed the maximum deserved for the *actual* crime committed?"*  
     - **No → Proceed to Step 3**  
     - **Yes → REJECT** (Punishment is retributively excessive)  
     - 🧠 *Judgment call: Determining "desert cap" relies on societal norms and offense severity.*  

  3. **Counterfactual Harm Floor**  
     *"Compared to status quo, does the proposal *reduce or maintain* net harm when accounting for:  
     a) Family disruption,  
     b) Recidivism risk shift,  
     c) Offender’s future victimization risk?"*  
     - **Yes → Proceed to Step 4**  
     - **No → REJECT** (Causes net societal harm)  
     - 🧠 *Judgment call: Requires estimating probabilistic outcomes (e.g., recidivism rates).*  

  4. **Net Societal Benefit Assessment**  
     *"After Steps 1-3, does the proposal offer clear net positive effects (e.g., cost savings, victim satisfaction, rehabilitation)?"*  
     - **Clear net positive → ACCEPT**  
     - **Ambiguous/unclear → NEEDS HUMAN VALUES CALL** (Board debate required)  

  ---

  ### **Worked Examples**
  **Proposal 1: 90-day mandatory minimum for second shoplifting**  
  - **Step 1 (Shadow Proportionality)**  
    Typical offender: Repeat offender, but often driven by poverty/addiction. "Worst avoidable version" (e.g., stealing luxury items) may not align with circumstances (e.g., stealing necessities).  
    → *Judgment*: Likely **NO** for many offenders (exceeds proportional punishment for their constrained choices).  
    **→ STOP: REJECT**  

  **Proposal 2: Replace jail for first-time vandalism with direct-restoration labor**  
  - **Step 1 (Shadow Proportionality)**  
    Vandalism usually involves deliberate choice; "worst avoidable version" (e.g., extensive property damage) is realistically avoidable. Community service is proportional.  
    → **YES**  
  - **Step 2 (Desert Cap)**  
    Restoration labor is less severe than jail → within desert cap.  
    → **YES**  
  - **Step 3 (Harm Floor)**  
    vs. status quo (jail):  
    a) *Family disruption*: Reduced (no incarceration).  
    b) *Recidivism*: Likely decreases (restorative justice lowers reoffending).  
    c) *Offender victimization*: Avoids jail risks.  
    → Net harm reduced → **YES**  
  - **Step 4 (Net Benefit)**  
    Clear benefits: Cost-effective, repairs damage, builds empathy.  
    **→ ACCEPT**  

  **Proposal 3: Cut fraud fines by 50% but add public offender registry**  
  - **Step 1 (Shadow Proportionality)**  
    Fraud typically requires intent/planning; "worst avoidable version" (e.g., large-scale scam) was realistically avoidable. However, registry imposes lifelong stigma.  
    → *Judgment*: **NO** (Registry is disproportionate to the crime’s avoidability; functions as perpetual public shaming).  
    **→ STOP: REJECT**  
    *Note: Even if passed Step 1:*  
    - **Step 3 (Harm Floor)** likely fails:  
      a) *Family disruption*: Registry harms employment/housing → increases financial strain.  
      b) *Recidivism*: Stigma may *increase* reoffending (blocks reintegration).  
      c) *Offender victimization*: High risk of harassment/vigilantism.  
      → Net harm likely increases → **NO → REJECT**  

  ---

  ### **Key Limitations & Caveats**
  1. **Cannot resolve**:  
     - Free will debates (assumes "avoidability" is pragmatically assessable).  
     - Extreme edge cases (e.g., offenders with severe mental illness require ad hoc evaluation).  
  2. **Judgment dependence**:  
     - Steps 1-3 involve irreducible judgment calls (🧠). The procedure only structures reasoning.  
  3. **Group calibration**:  
     - Board must align on "realistic avoidability" and "desert cap" baselines during onboarding.  
  4. **Data gaps**:  
     - Harm floor requires best-available recidivism data (default to conservative estimates if uncertain).  

  ---

  ### **Outcome Summary**
  | Proposal          | Step 1 | Step 2 | Step 3 | Step 4 | Outcome |  
  |-------------------|--------|--------|--------|--------|---------|  
  | 90-day shoplifting| ❌     | n/a    | n/a    | n/a    | Reject  |  
  | Restoration labor | ✅     | ✅     | ✅     | ✅     | Accept  |  
  | Fraud + registry  | ❌     | n/a    | n/a    | n/a    | Reject  |  

  Proposal 3 fails your "soft on registries" preference, demonstrating procedural rigor. For ambiguous cases at Step 4 (e.g., tradeoffs between victim satisfaction and offender rehabilitation), the board debates and votes.
