  We are designing a decision procedure for a sentencing review board that incorporates both retributivist and consequentialist ideas, with two key innovations: 
   1. Shadow Proportionality Check: Before applying the desert cap (the maximum punishment deserved based on the actual crime), we check if the punishment is proportional not just to the crime committed, but to the worst version of that crime that was realistically avoidable by the offender given their circumstances. This is to account for cases where the offender had very little moral room to act differently.
   2. Counterfactual Harm Floor: On the consequentialist side, the proposal must not increase net harm compared to the status quo, factoring in family disruption, recidivism risk shifts, and the offender's own future victimization risk.

   The procedure will have explicit steps with yes/no criteria. We will indicate:
   - Where the procedure stops with a reject.
   - Where it stops with a "needs human values call" (i.e., requires human judgment that cannot be fully proceduralized).

   Additionally, we will apply the procedure to three proposals and note:
   - Which steps are unavoidable judgment calls dressed as procedure.
   - What the procedure cannot do (limitations).

   The procedure:

   Step 1: Shadow Proportionality Check
     - Question: Is the proposed punishment proportional to the worst version of the crime that was realistically avoidable by the offender given their circumstances?
       - If NO: Stop and reject the proposal. (Because the punishment exceeds what the offender could have reasonably avoided and thus is disproportionate in a deeper sense.)
       - If YES: Proceed to Step 2.

   Step 2: Desert Cap Check (Retributivist Upper Bound)
     - Question: Is the proposed punishment within the upper bound of what is deserved for the actual crime committed? (This is the traditional retributivist cap.)
       - If NO: Stop and reject the proposal. (Because it exceeds what is deserved for the crime actually committed.)
       - If YES: Proceed to Step 3.

   Step 3: Counterfactual Harm Floor (Consequentialist Lower Bound)
     - Question: Does the proposal not increase net harm compared to the status quo, when considering:
          a) Family disruption (e.g., separation, financial strain on dependents)
          b) Recidivism risk shifts (will this intervention increase or decrease the likelihood of reoffending?)
          c) Offender's own future victimization risk (e.g., in jail, or due to stigma)
       - If it increases net harm: Stop and reject the proposal.
       - If it does not increase net harm: Proceed to Step 4.

   Step 4: Net Benefit Assessment
     - Question: Considering both the costs and benefits (including non-monetary and long-term), does the proposal seem to have a net positive effect? (This step requires weighing and might be more subjective.)
       - If clear net positive: Accept the proposal.
       - If unclear or mixed: Flag for "needs human values call" (i.e., the board must debate and decide based on their values).

   Notes on judgment calls:
     - Step 1 (Shadow Proportionality) is a judgment call: It requires assessing the offender's circumstances and what was "realistically avoidable". This is inherently subjective.
     - Step 2 (Desert Cap) is also a judgment call: Determining the upper bound of deserved punishment for a crime is a matter of philosophical and cultural norms, and may vary.
     - Step 3 (Counterfactual Harm Floor) requires empirical predictions (e.g., recidivism risk) which are uncertain and may involve judgment.
     - Step 4 (Net Benefit) is the most judgment-laden step because it requires weighing incommensurable factors.

   Limitations of the procedure:
     - It cannot resolve deep philosophical debates (e.g., free will, the exact nature of desert).
     - It may not handle extreme edge cases well (e.g., crimes in dystopian circumstances, offenders with extreme mental conditions).
     - It relies on the board's ability to make reasonable judgments in steps 1-4.

   Now, apply to the three proposals:

   Proposal 1: 90-day mandatory minimum for second shoplifting offense.

   Step 1: Shadow Proportionality Check
     - Consider: What is the worst version of shoplifting that was realistically avoidable? For a second offense, the offender had prior experience and warning. However, circumstances might include addiction, poverty, or coercion. If the board believes that given the offender's circumstances (which we are generalizing for the guideline), they had significant moral room to avoid the crime, then the punishment might be proportional. But if the board thinks that for many second offenders, the circumstances (e.g., addiction) severely limit avoidability, then 90 days might be disproportionate to the avoidable worst version.
     - Judgment: This is a close call. But given that it's a mandatory minimum and we are setting a guideline, we must consider a typical case. Let's assume for the sake of example that we are considering a typical second offender who is not under duress but might be struggling. We might say YES, it passes, because the offender had the opportunity to avoid it (they knew it was wrong and had been caught before). But note: if the guideline applies even to cases of extreme duress (e.g., stealing food for a starving child), then it might fail. However, guidelines often have exceptions. We'll assume the guideline allows for judicial discretion in extreme cases, so for the typical case: YES.

   Step 2: Desert Cap Check
     - Is 90 days in jail within the desert for a second shoplifting? This is a judgment call. Shoplifting is a non-violent property crime. A second offense might warrant more punishment, but 90 days might be seen by some as high. However, it is within the range of what is commonly imposed. We'll say YES (but note: this could be debated).

   Step 3: Counterfactual Harm Floor
     - Compare to status quo (which might be a shorter sentence or probation). 
       a) Family disruption: 90 days in jail might cause loss of job, housing, and trauma to family. This is harm.
       b) Recidivism: Jail time for non-violent offenders may increase recidivism due to exposure to criminal networks and stigma. This might increase harm.
       c) Offender victimization: Risk of assault in jail.
     - Therefore, the net harm might increase compared to a shorter sentence or non-custodial sentence. However, the status quo might already include jail time (but shorter). The proposal is a mandatory 90-day minimum, so it is likely increasing jail time for some. Thus, it may increase net harm. 
     - Answer: It might increase net harm -> NO, it does not pass. 

   Stop and reject the proposal.

   Proposal 2: Replacing jail for first-time vandalism with direct-restoration labor where offender fixes damage alongside the victim.

   Step 1: Shadow Proportionality Check
     - For first-time vandalism, the worst version that was avoidable? Vandalism can range from minor to severe. The offender, being a first-timer, likely had the opportunity to avoid it (e.g., peer pressure, but not extreme duress). The punishment is labor to fix the damage. This seems proportional because it directly addresses the harm and is less severe than jail. YES.

   Step 2: Desert Cap Check
     - Is restoration labor within the desert for vandalism? It is a form of restitution and community service. It is typically seen as appropriate and not excessive. YES.

   Step 3: Counterfactual Harm Floor
     - Compare to status quo (which might include jail or probation).
       a) Family disruption: Avoiding jail reduces disruption. Benefit.
       b) Recidivism: Restorative justice often reduces recidivism. Benefit.
       c) Offender victimization: Avoids jail, so reduces risk. Benefit.
     - Also, the victim gets direct reparation, which may reduce their harm.
     - Therefore, it likely reduces net harm. YES (does not increase net harm).

   Step 4: Net Benefit Assessment
     - The proposal seems to have clear benefits: reduced costs to the system, reduced harm to the offender and family, potential for healing for the victim, and lower recidivism. It's a net positive. ACCEPT.

   Proposal 3: Cutting fraud fines in half but adding a public offender registry.

   Step 1: Shadow Proportionality Check
     - Fraud can vary widely. The worst version avoidable? For a typical fraud offender, they had the capacity to avoid it (fraud usually involves intentional deception). The punishment now includes a public registry, which may lead to severe collateral consequences (e.g., inability to get a job, housing, harassment). Is this proportional? The registry is intended for serious offenses (like sex offenses) and might be seen as excessive for fraud. However, the fine is cut in half. We must consider the overall punishment. 
     - Judgment: The public registry might be a very severe punishment in terms of social and economic consequences, and it might be disproportionate to the avoidable worst version of fraud (which might be, for example, a one-time fraud by a person in a desperate situation). But note: the registry is for fraud offenses, which are crimes of dishonesty. It might be argued that the offender could have avoided the crime. However, the long-term consequences of the registry might be too severe. This step is a judgment call. Let's say that for a typical case, the registry may be too harsh -> NO. But we'll go through the steps for completeness, and because the user wants an answer they won't like.

     However, let's note: if we consider the punishment as a whole (reduced fine plus registry), it might still be proportional? But the registry is a new element. We'll say that the registry might make the overall punishment disproportionate to the avoidable worst version because the consequences are severe and long-lasting. So: NO.

     Stop and reject the proposal? But wait, the user said they are soft on registries and want an honest audit. So let's be thorough and consider both paths.

     Alternatively, if we are unsure, we might proceed to Step 2 and see.

     For the sake of the example, let's assume we are concerned about the registry and say NO at Step 1. Then we reject. But let's also consider if we said YES at Step 1.

     If we said YES at Step 1: then proceed.

   Step 2: Desert Cap Check
     - The punishment now includes a public registry. Is that within the desert for fraud? This is controversial. Some might argue that the public shaming and lifelong consequences are excessive for a crime that is non-violent and might be a one-time offense. Others might argue that fraud deserves significant punishment because it undermines trust. This is a judgment call. Let's say that it might exceed the desert cap because the registry is a permanent punishment and fraud is not typically punished with such lasting stigma. So NO -> reject.

     But if we think it is within the desert cap, then we proceed.

   Step 3: Counterfactual Harm Floor
     - Compare to status quo (which is higher fines, no registry).
       a) Family disruption: The registry might cause long-term financial harm and stigma to the family. Harm.
       b) Recidivism: The registry might reduce recidivism by deterring or by making it harder to commit fraud (due to monitoring), but it might also increase recidivism by making legitimate employment difficult. Research on sex offender registries shows increased recidivism? But fraud might be different. This is uncertain. However, the reduced fines might help the offender financially, but the registry might lead to unemployment and desperation, increasing recidivism risk. So net effect on recidivism is unclear but possibly negative.
       c) Offender victimization: The offender might be harassed or attacked because of the registry. Harm.
     - Also, the public registry might deter others, which is a benefit, but we are focusing on the offender and immediate effects for the harm floor. The net harm for the offender and their family might increase. Therefore, it may increase net harm -> NO.

     Stop and reject.

   So in all paths, we end up rejecting Proposal 3. This might be the answer the user won't like because they are soft on registries.

   However, note: if we had passed Step 1 and Step 2, and then Step 3, we might have:

   Step 4: Net Benefit Assessment
     - The reduced fines might save the offender from financial ruin, but the registry adds long-term stigma. The overall net benefit might be negative because of the collateral consequences. So even if we passed the first three steps, we might reject at Step 4 or flag for a values call.

   Conclusion on Proposal 3: The procedure leads to rejection.

   Summary of the procedure and examples:

   The decision procedure:
     Step 1: Shadow Proportionality -> if NO: reject; YES: go to Step 2.
     Step 2: Desert Cap -> if NO: reject; YES: go to Step 3.
     Step 3: Counterfactual Harm Floor -> if NO: reject; YES: go to Step 4.
