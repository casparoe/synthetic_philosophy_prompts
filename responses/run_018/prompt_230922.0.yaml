  The user clearly understands the basics: superrationality proposes that identical rational agents in perfectly symmetric scenarios should reason as if their choice determines all others'. Their friend argues this is unrealistic and only works in toy models. The user wants to know what evidence or arguments could *actually* undermine this view in real-world or formal terms, and how defensible superrationality really is when pressed. 

