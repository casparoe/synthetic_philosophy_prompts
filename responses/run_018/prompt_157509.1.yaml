answer: |-
  ### 1. Quick Brainstorm (100 words)
  Three ways revolutions devour supporters:
  - **Structural (Power Vacuum):** Overthrowing a regime creates chaos. New institutions are weak, so emergency bodies (like committees) form. They centralize power to survive, inevitably targeting rivals—even former allies—as "threats." Survival logic trumps loyalty.
  - **Ideological (Radicalization):** Revolutionaries believe they're building utopia. Anyone questioning methods becomes an "enemy of the people." Purity spirals escalate: moderates seem traitorous, radicals demand ever more extreme action to prove loyalty. Ideological fervor justifies purges.
  - **Contingent (Personal Rivalries/Chaos):** Individual ambition, paranoia, or simple miscommunication in the fog of crisis turns comrades into enemies. A specific insult, a failed policy, or one leader's vendetta sparks chain reactions no one planned.

  ### 2. What the Fight is About (150 words)
  The French Revolution's core drivers are hotly debated:
  *   **Class Struggle:** The rising bourgeoisie (middle class) and oppressed urban workers/peasants finally overthrew the parasitic aristocracy and absolute monarchy. It was an inevitable clash over economic power and privilege.
  *   **Ideology:** Enlightenment ideas—liberty, equality, reason, popular sovereignty—inspired a radical break from the past. The revolution was driven by the *power of new ideas* challenging divine right and feudalism.
  *   **Contingency:** It was a messy accident! Specific events (bad harvests, royal blunders like the flight to Varennes, war declarations) and volatile personalities (Robespierre's zeal, Danton's pragmatism) collided, creating unpredictable chaos. Without these specific moments and people, things might have been very different.

  ### 3. The Case for Class and Structure (200 words)
  Think of France as a pressure cooker. The rigid Old Regime structure—privileged nobility/clergy atop a vast pyramid of peasants, artisans, and a growing but excluded bourgeoisie—was fundamentally unsustainable. Centuries of unfair taxes, feudal dues, and blocked social mobility created deep, structural resentment. The monarchy's near-bankruptcy forced it to call the Estates-General, cracking the system open. Once the Bastille fell, the old state apparatus collapsed. This created a massive power vacuum. The Revolution wasn't *just* about ideas; it unleashed a violent struggle over who would control the economy and resources. The bourgeoisie, having led the initial revolt, faced threats from both resurgent aristocracy (abroad and at home) *and* the radical urban poor (sans-culottes) demanding more than just political change. The Terror, from this view, wasn't *just* madness or ideology gone wild. It was a brutal, structural necessity: the new ruling class (the revolutionary bourgeoisie), terrified of losing everything, used state terror to simultaneously crush the old elite *and* discipline the restless lower classes who threatened property rights. The guillotine was the tool for enforcing a new, bourgeois social order amidst the ruins of the old.

  ### 4. The Case for Ideology and Contingency (200 words)
  The Enlightenment provided the explosive fuel. Philosophers like Rousseau didn't just critique the monarchy; they offered a radical vision: sovereignty resides in the "People," virtue is supreme, and the old world is corrupt beyond repair. This wasn't just political theory; it became a revolutionary faith. Believers saw themselves creating a perfect Republic of Virtue. Anyone hindering this sacred project—whether hesitant moderate, self-interested profiteer, or cautious realist—became a traitor to the cause. This ideological absolutism fueled the radicalization, pushing the Revolution towards the Terror as the ultimate tool for purifying the new society. However, **ideology doesn't explain the specific path.** That's where contingency crashes in. Would things have spiraled without Louis XVI's disastrous attempt to flee? Without the outbreak of war with Austria/Prussia, creating panic and the fear of invasion? Without a series of poor harvests causing bread riots and desperation? And what about the personalities? Robespierre's inflexible belief in his own virtue, Danton's pragmatism clashing with it, Marat's incendiary rhetoric – these weren't predictable outcomes of class conflict or ideology. They were specific people making specific choices amid cascading crises. Ideology provided the *language* and *justification* for action; contingency shaped *which* actions were taken, when, and by whom.

  ### 5. The Devouring-Children Problem: Bureaucratic Mimicry (250 words)
  The "devouring" wasn't random cruelty; it often wore the cold mask of procedure. The revolutionary tribunals and committees, especially the infamous Committee of Public Safety, absolutely mimicked the bureaucratic habits of the monarchy they replaced, and this *did* make systematic terror more structurally likely. Think about it: You inherit a massive, complex state facing invasion, civil war, and economic collapse. You don't have time to invent a whole new way of governing from scratch. So, you grab the tools at hand: paperwork, hierarchies, centralized control mechanisms. The monarchy ran on reports, dossiers, orders from the center – so did the Committee. Old Regime courts had formal procedures (however biased) – the Revolutionary Tribunal did too, albeit perverted into show trials.

  Here’s the dangerous mimicry: The *rhythm* of bureaucracy demands action. Committees needed to show results – arrests, convictions – to justify their existence and power. Paper trails created their own momentum; denunciations piled up, demanding investigation, leading inevitably to more arrests. The hierarchical structure meant lower-level zealots or opportunists could initiate processes that higher committees felt pressured to endorse. The *habit* of command from the top down, inherited from royal absolutism, allowed figures like Robespierre and Saint-Just to issue sweeping decrees targeting whole categories of "suspects." The machinery of the old state, designed for control, was repurposed with revolutionary ideology. But the bureaucratic logic – efficiency, order, reporting upwards, meeting quotas (implicit or explicit) – remained. It turned ideological fervor and fear into a systematic, industrial-scale repression. The revolutionaries didn't just kill their children; they often processed them through a grim, familiar administrative machine, making the Terror tragically efficient and less a sudden burst of rage than a chillingly organized purge enabled by structural continuity.

  ### 6. My Verdict (150 words)
  While ideology gave the Revolution its fiery soul and contingency steered its chaotic path, **class struggle and the structural collapse of the Old Regime are the dominant forces.** The deep-seated economic and social inequalities created the explosive potential. The collapse of royal authority created a vacuum where *any* new power structure would face existential threats and resort to repression. Ideology provided the justification for terror ("virtue," "the people"), and contingency decided the targets and timing (war, harvests, Robespierre's specific paranoia). The terrifying bureaucratic mimicry shows how structures persist, facilitating the devouring. But the *need* to violently suppress perceived enemies – aristocrats, hoarders, rival factions (often representing different class interests) – stemmed fundamentally from the unresolved class conflicts unleashed in 1789 and the inherent instability of building a new state amidst that conflict. The bourgeoisie, having seized power structurally, used terror structurally to secure it against challenges from above and below. Ideology and contingency shaped *how* the Terror looked, but the *why* is rooted in the class-based struggle for power in a shattered state.
