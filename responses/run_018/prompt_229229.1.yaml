answer: |-
  Your diagnosis hits the mark: the core impasse in the Rietdijk-Putnam (R-P) debate is **metaphysical**, specifically concerning *what constitutes ontology under relativistic constraints*. It is not primarily verbal, modal, or secretly physical, though these elements play supporting roles. Below is a step-by-step diagnosis of the argument's impasse, followed by the distinctions or formal results needed for progress, and an analysis of why they remain elusive.

  ---

  ### **Diagnosis of the Impasse: Metaphysics of Relativistic Ontology**
  1.  **The R-P Argument's Core Structure:**
      *   **P1 (Relativity of Simultaneity):** In Minkowski spacetime, "simultaneity" is frame-dependent. Event *E* simultaneous with event *O* (the "here-now") in frame *F1* may be future/past relative to *O* in frame *F2*.
      *   **P2 (No Privileged Frame):** Special Relativity denies a preferred inertial frame. No simultaneity hyperplane is physically fundamental.
      *   **P3 (Reality is Frame-Invariant):** If an event is "real" (ontologically determinate) relative to *O* in *any* frame, it must be real *simpliciter* (absolutely, for all observers at *O*). (The critical premise).
      *   **P4 (Existence Claim):** For any distant event *E*, there exists *some* frame *F* (e.g., one moving rapidly towards *E*) where *E* is simultaneous with *O* (and thus, by P3, "real" at *O*).
      *   **Conclusion (Eternalism):** All events are equally real ("exist") at all times from the perspective of *O*. The future (and past) is ontologically settled *now* (at *O*).

  2.  **The Source of Stalemate:**
      *   **Critics Target P3:** The fundamental disagreement centers on **P3**. Block-universe proponents accept P3: *Being simultaneous-with-O in some frame F* entails *being ontologically determinate at O*. Critics reject this inference as an **equivocation** or a **category error**:
          *   **Equivocation 1: Frame-Relative vs. Absolute Determinateness:** Critics argue "real" or "determinate" *relative to a frame* (a coordinate-dependent, perspectival notion) is conflated with "real" or "determinate" *simpliciter* (an absolute, ontological notion). Relativity shows *simultaneity* is frame-dependent; it doesn't automatically show that *existence* or *determinateness* must be frame-invariant in the way P3 requires. An event being "present" in *F* doesn't force it to be *ontologically present* for an observer at *O*; it might merely define their *epistemic or descriptive perspective*.
          *   **Equivocation 2: Determinateness vs. Determinism:** Critics sharply distinguish *ontological determinateness* (the event's properties are fixed) from *epistemic predictability* (we can know its properties *from O*). They insist **eternalism does not entail determinism**. The block universe could contain *indeterminate* (e.g., quantum) events whose outcomes are ontologically settled only at their spacetime location ("past" light cone), not predetermined from *O*. R-P's conclusion feels like it smuggles in determinism because *predicting* an event from *O* often requires determinism or access to its past light cone. But eternalism only requires the event *exists* at its location; its state need not be knowable or determined from *O*. Putnam himself later acknowledged this distinction but argued the *existence* was the key point.
      *   **The Metaphysical Impasse:** The debate reduces to incompatible metaphysical stances on what relativity *implies* for temporal ontology:
          *   **Eternalist Stance (R-P Proponents):** Relativity's denial of absolute simultaneity *forces* us to abandon the idea of a universal, dynamically moving "now." The only coherent ontology is a static, four-dimensional block where all events exist timelessly. P3 is necessary to avoid privileging a frame *ontologically*.
          *   **Presentist/Possibilist Stance (Critics):** Relativity constrains *measurement* and *description*, not necessarily *ontology*. One can maintain a notion of "becoming" tied to a worldline or a local "here-now" event *O*. Events outside *O*'s light cone are genuinely indeterminate/future possibilities *for the observer at O*, even if described as "past" or "present" in other frames. Rejecting P3 allows this; simultaneity hyperplanes are useful *descriptive tools*, not *ontological divides*. Privileging *O*'s light cone structure (not a full hyperplane) for determinateness avoids violating relativity's core tenets.

  3.  **Why Not Verbal/Modal/Physical?**
      *   **Verbal?** While terms like "real" and "determinate" are contested, the disagreement isn't merely semantic. Both sides understand the physics; they disagree on what the physics *means* for what *exists*.
      *   **Modal?** Modality (possibility/necessity) is involved (e.g., "could *E* be otherwise?"), but the dispute centers on *actuality* and *determinateness* within the relativistic structure, not primarily on possible worlds.
      *   **Secretly Physical?** No. Everyone agrees on the physics of Minkowski spacetime, Lorentz transformations, relativity of simultaneity, and light cone structure. The dispute is about the *ontological interpretation* of this uncontested physics.

  ---

  ### **What Distinction or Formal Result Would Constitute Progress?**
  A resolution requires clarifying the **metaphysical link between frame-relative descriptions and ontological commitment** within SR. Two key developments could break the impasse:

  1.  **A Formal Distinction Between "Frame-Determinate" and "Light-Cone-Determinate":**
      *   **The Distinction:** Precisely define "determinateness" operationally within a relativistic framework.
          *   **"Frame-Determinate" (FD):** An event *E* is FD relative to event *O* and frame *F* iff *E* lies on the simultaneity hyperplane of *O* in *F*. (This is coordinate-dependent).
          *   **"Light-Cone-Determinate" (LCD):** An event *E* is LCD relative to event *O* iff *E* lies within or on the past light cone of *O*. (This is an invariant, frame-independent relation). *E*'s LCD status is knowable *at O* via signals.
          *   **"Ontological Determinateness" (OD):** The metaphysical claim that *E*'s existence and properties are fixed *for an observer at O*.
      *   **Progress Argument:** Proponents must demonstrate why FD (a frame-dependent notion) entails OD (an absolute ontological status). Critics can argue that only LCD provides a *physically meaningful, invariant criterion* for determinateness *relevant to an observer at O* (because it defines what can causally influence *O*). OD could plausibly be tied only to LCD, not FD. R-P relies on conflating FD with OD. Formalizing this distinction forces proponents to justify the FD->OD link without appealing to intuitions based on pre-relativistic time or determinism. It clarifies that LCD is compatible with both eternalism *and* a form of local temporal becoming (where only the past light cone is OD at *O*), while FD is merely descriptive.

  2.  **A Formal Result Linking Indeterminism and Eternalism in Relativistic QM:**
      *   **The Result:** A rigorous model within Relativistic Quantum Field Theory (RQFT) demonstrating the consistent coexistence of *ontological eternalism* (all spacetime points exist) with *local event indeterminism* (the specific outcome at a point is not fixed until its past light cone is filled, even within the block universe).
      *   **Progress Argument:** This would definitively decouple eternalism from determinism at the level of fundamental physics. It would show that an event *E* spacelike separated from *O* can be part of the block universe (eternalism) *and yet* its specific state can be ontologically indeterminate *relative to O* until events in its past light cone occur. This undermines the R-P inference that because *E* is "present" in some frame *F*, it must *already* be determinate *at O*. The determinateness is localized and processual, even within the block. This validates the critics' core claim that R-P conflates existence with pre-determination. (Note: Interpretations of QM like GRW or Bohmian Mechanics might offer paths, but consensus is lacking).

  ---

  ### **Why Has Progress Not Emerged?**
  1.  **Intractability of Metaphysical Foundationalism:** The debate hinges on pre-theoretical intuitions about time, existence, and determinateness that are exceptionally resistant to empirical adjudication. Relativity constrains descriptions but doesn't uniquely determine ontology. Choosing between eternalism and dynamical views involves fundamental metaphysical commitments that physics alone cannot resolve.
  2.  **Lack of Definitive Physical Consequences:** Both interpretations (eternalism + LCD-determinateness vs. local becoming) are empirically equivalent regarding *predictions* within SR and even standard QM. Physics doesn't force one ontology over the other.
  3.  **Complexity of Relativistic Indeterminism:** While RQFT is deterministic in its evolution (for pure states), the measurement problem and collapse interpretations introduce profound conceptual challenges for defining "determinateness" spacelike separated from an observation. Formalizing a consistent, non-deterministic eternalist ontology within RQFT is technically and philosophically difficult.
  4.  **Focus on Semantic Frameworks:** Much effort has been spent developing formal semantics for tense logic in relativity or defining "present" along worldlines. While valuable, these often presuppose an ontological stance (e.g., building eternalism into the semantics) rather than resolving the underlying metaphysical disagreement about P3.
  5.  **Disciplinary Divides:** Physicists often find the debate overly philosophical, while metaphysicians may lack the technical depth to engage fully with RQFT nuances needed to model indeterministic eternalism rigorously.

  ---

  **Conclusion:** The Rietdijk-Putnam impasse is fundamentally **metaphysical**, centering on whether the frame-relativity of simultaneity entails the ontological determinateness of spacelike separated events (P3). Critics successfully expose an equivocation between descriptive/perspectival simultaneity and absolute ontological status, and they correctly decouple eternalism from determinism. Progress requires either **a formal operational distinction between frame-dependent and light-cone-dependent determinateness** to challenge the necessity of P3, or **a robust model of indeterministic eternalism in relativistic quantum physics** to definitively sever the link between existence and pre-determination. The lack of emergence stems from the deeply foundational nature of the metaphysical disagreement and the absence of empirical pressure forcing a resolution. The debate persists not due to flawed physics, but due to divergent interpretations of what that physics implies for the nature of reality.
