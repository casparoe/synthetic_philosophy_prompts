prompt: |-
  Please explain the conceptual distinction between failure via influence-seeking and failure via slow value drift, but apply it specifically to epistemic institutions—peer-review ecosystems, long-horizon forecasting tournaments, or grant-allocation bodies—rather than to AI alignment or state governance. Take a committed stance: argue definitively which mode is more insidious in these settings, and why the standard corrective mechanisms for one tend to accelerate the other. Present your answer as exactly five numbered points, each one or two sentences, with no introduction and no conclusion, and do not include citations, bibliographies, or references to specific texts since this needs to stand alone without search access. Write with the precision of someone who has followed rationalist discussions on institutional decay but wants the conceptual mechanics extracted cleanly from the usual AI-safety framing.
reasoning: |-
  Hmm, the user wants me to explain two types of institutional failure (influence-seeking vs slow value drift) specifically applied to epistemic institutions like peer review, forecasting tournaments, or grant allocation bodies. They want me to take a strong stance on which is more insidious and explain why corrective mechanisms for one accelerate the other. All in exactly five numbered points without intros/conclusions.

  This requires careful unpacking. The core distinction: influence-seeking is active power-grabbing (like reviewers promoting their own agendas), while slow value drift is passive degradation of standards over time (like forecasting tournaments gradually favoring flashy predictions over accuracy). For epistemic institutions, I need to argue which is worse.

  I think slow value drift is more insidious here because epistemic work depends on long-term integrity. Corrective mechanisms for influence-seeking (like stricter conflict rules) ironically accelerate drift by making institutions more bureaucratic and rigid. Meanwhile, fixes for drift (like performance metrics) create loopholes for influence-seekers to exploit. It's a vicious cycle.

  The user clearly knows rationalist discourse but wants it detached from AI safety framing. They're probably researching institutional design or preparing an argument. Their tone suggests urgency about systemic risks - maybe they've seen too many good institutions decay. I'll keep the response crisp: five surgical points with zero fluff, emphasizing why drift's subtlety makes it deadlier in knowledge ecosystems.
answer: |-
  1.  Influence-seeking failure occurs when actors deliberately manipulate epistemic processes (e.g., reviewers promoting their own paradigm, forecasters colluding, grant panelists favoring allies) to gain disproportionate control over truth-determination or resource allocation for personal or factional gain.
  2.  Slow value drift failure manifests as the gradual, often unnoticed, shift in an institution's core epistemic criteria (e.g., peer review prioritizing novelty over rigor, forecasting rewarding speed over calibration, grant bodies favoring safe proposals over transformative science) towards easier-to-measure but less valid proxies, driven by incentives absent malign intent.
  3.  Slow value drift is more insidious in epistemic institutions because it corrupts the *definition* of truth or merit itself from within, rendering institutions incapable of self-diagnosis as drift-induced metrics become the accepted standard of performance, eroding their core function invisibly.
  4.  Corrective mechanisms against overt influence-seeking (e.g., strict conflict rules, reviewer anonymization, complex oversight) inherently increase bureaucracy and friction, which subtly incentivizes prioritizing easily auditable process compliance over harder-to-assess genuine epistemic rigor, accelerating value drift.
  5.  Conversely, corrective mechanisms against perceived drift (e.g., explicit performance metrics, quantitative targets for grant outcomes) create exploitable surfaces and perverse incentives that sophisticated influence-seekers readily manipulate to cement control under the guise of accountability, accelerating influence-seeking failure.
