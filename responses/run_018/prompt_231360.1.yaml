answer: |-
  ### The Maxwell's Demon Commitment Quiz  
  *Answer based on intuitive physical reasoning. No prior knowledge of named theories required.*  

  #### Question 1: Szilard’s Engine  
  A single gas molecule bounces in a box. A demon inserts a partition in the middle, measures which side the molecule is on, and attaches a piston to that side. The molecule pushes the piston out, extracting work. The partition is removed (no work required), resetting the box. After one full cycle:  
  A) Net work is extracted; entropy decreases.  
  B) Net work is zero; no entropy change.  
  C) Net work is extracted, but entropy increases elsewhere.  

  #### Question 2: Finite-Memory Demon  
  The demon uses a 1-bit memory to store measurement results. After controlling the piston, it must reset the bit to "0" for reuse. Reset involves erasing the bit physically. The minimal energy cost to reset:  
  A) Can be near zero with care.  
  B) Must be at least \(kT \ln 2\) (≈0.017 eV at room temp).  

  #### Question 3: Reversible Tape Demon  
  The demon writes measurements to an infinite, frictionless tape (no erasure; tape grows forever). Writing/reversing tape operations dissipate zero heat. After 1,000 cycles:  
  A) Gas entropy decreases; tape entropy increases equally.  
  B) Gas entropy decreases; tape entropy remains near zero.  
  C) Net work is extracted with no compensating entropy increase.  

  #### Question 4: Feynman’s Ratchet  
  A ratchet and pawl mechanism rectifies Brownian motion from a thermal bath to lift a weight. Both ratchet and bath are at temperature *T*:  
  A) Weight lifts continuously; work from heat violates Second Law.  
  B) Pawl slips randomly; no net weight lift.  
  C) Lifts briefly, then stalls.  

  #### Question 5: Quantum Measurement Demon  
  The demon measures a quantum atom’s position to control a door. Quantum mechanics ensures measurement disturbs the atom’s momentum:  
  A) Disturbance adds energy; no net work extracted.  
  B) Disturbance is negligible; net work extracted.  
  C) Demon gets wrong data sometimes; work reduced but not zero.  

  #### Question 6: Pre-Recorded Tape Demon  
  A demon uses a pre-recorded random bit sequence (e.g., coin-flip results) instead of real-time measurement to control the door. After 100 cycles:  
  A) Extracts net work; information is physical.  
  B) No net work; bits uncorrelated with molecule.  

  #### Question 7: Two-Demon Reset  
  Demon 1 measures the molecule and writes to a tape. Demon 2 reads the tape to control the piston. After acting, they *reversibly* rewind/erase the tape to reset. Net work per cycle:  
  A) Positive; reversible reset costs nothing.  
  B) Zero; reset requires work.  

  #### Question 8: Entropy of the Tape  
  In the reversible tape demon (Q3), after years of operation, the tape holds millions of random bits. The tape’s entropy is:  
  A) Near zero (data is "known").  
  B) High (bits are random).  
  C) Depends on the tape’s initial state.  

  #### Question 9: Coherent Quantum Demon  
  The demon uses quantum entanglement to measure the atom *reversibly* (no collapse, no momentum disturbance). It extracts work and resets reversibly:  
  A) Net work extracted; no heat dissipation.  
  B) Net work zero; hidden costs appear.  
  C) Works initially but fails eventually.  

  ---

  ### Scoring Key  
  **Logical Space**: Positions vary on three axes:  
  1. **Cost Location**: *Measurement* vs. *Erasure* vs. *None*.  
  2. **Second Law Status**: *Absolute* (never violated) vs. *Statistical* (violated transiently).  
  3. **Information Physicality**: *Yes* (affects entropy) vs. *No* (abstract).  

  Match your answers to the patterns below:  

  #### (1) **Erasure-Cost View**  
  - *Core*: Erasing memory *must* dissipate heat (Landauer’s principle).  
  - **Answers**: 1C, 2B, 3A, 4B, 5B, 6B, 7B, 8B, 9B.  
  - *Why?* Reset (Q2,7) physically encodes information loss. Tape (Q3,8) stores entropy.  

  #### (2) **Measurement-Cost View**  
  - *Core*: Measurement *itself* disturbs the system or requires energy.  
  - **Answers**: 1C, 2A, 3C, 4A, 5A, 6A, 7B, 8A, 9B.  
  - *Why?* Measurement heats gas (Q5) or breaks reversibility (Q9). Pre-recorded data (Q6) useless.  

  #### (3) **Statistical-Fluctuation View**  
  - *Core*: Demons work temporarily; thermodynamics is probabilistic.  
  - **Answers**: 1A, 2A, 3C, 4C, 5C, 6A, 7A, 8C, 9C.  
  - *Why?* Ratchet (Q4) fails eventually. Reversible setups (Q7,9) degrade over time.  

  #### (4) **Phase-Space/Liouville View**  
  - *Core*: Universe’s phase-space volume is conserved; entropy decrease in gas balances demon’s entropy increase.  
  - **Answers**: 1B, 2A, 3A, 4B, 5B, 6B, 7A, 8B, 9A.  
  - *Why?* Reversible cycles (Q7,9) conserve entropy (Q1B). Tape (Q3,8) stores correlation entropy.  

  #### (5) **Whole-System-Entropy View**  
  - *Core*: Demon + gas form a closed system; entropy rise is *global*.  
  - **Answers**: 1C, 2B, 3A, 4B, 5A, 6B, 7B, 8B, 9B.  
  - *Why?* Erasure (Q2) or measurement (Q5) increases total entropy. Tape (Q3,8) is physical entropy sink.  

  ---

  ### Diagnostics  
  - **Incoherent/Unmapped**: Believing in *reversible measurement without cost* (Q9A) *and* absolute Second Law (Q1A) is contradictory.  
  - **Indistinguishable Pairs**:  
    - (1) vs. (5): Differ only on Q5 and Q9 (measurement disturbance vs. erasure).  
    - (2) vs. (3): Differ on Q4 (ratchet always fails vs. fails eventually).  
  - **Unattractive**: Denying information’s physicality (Q6A) while requiring erasure cost (Q2B) is inconsistent.  

  *Interpretation*: Positions (1),(4),(5) uphold the Second Law absolutely; (2),(3) permit violations. (1),(5) treat information as physical; (4) emphasizes geometric phase-space constraints.
