answer: |-
  Here’s a sharp reading of *The Metamorphosis* through your moral gradient lens, pinpointing key moments and Kafka’s unique philosophical contribution:

  ### **Downward Shifts on the Moral Gradient**
  1. **Loss of Speech (Early Chapter 1)**:  
     Gregor’s inability to articulate human speech—despite understanding everything—is the **first catastrophic drop**. His family hears only insectile noises. This erases *social reciprocity*, making him unable to participate in moral dialogue. His consciousness becomes trapped, invisible.

  2. **Rejection of Human Food (Milk Scene, Chapter 1)**:  
     When Gregor rejects fresh milk (a human staple) and craves rotten food, the family interprets this as **loss of affective/cognitive alignment**. They don’t see his revulsion toward milk as sensory change; they see it as proof he’s "lost his taste." Feeding shifts from care to disgust—marking a slide toward "pest" status.

  3. **Furniture Removal (Chapter 2)**:  
     Grete’s insistence on removing his furniture—over Gregor’s desperate, silent protests—is pivotal. His attachment to the portrait/luggage (symbols of *cognitive continuity*) is dismissed as animalistic hoarding. Grete declares, "He *can’t* understand us!"—denying his inner life. This is the moment **care becomes custodial**, not moral.

  4. **The Apple Injury (Chapter 2)**:  
     Gregor’s father pelts him with apples, one lodging in his back. Violence against him is now deemed acceptable—**crossing into "non-moral agent" territory**. Physical harm isn’t seen as cruelty but pest control. His suffering (pain, infection) is ignored, proving affective range no longer registers.

  5. **Starvation & Neglect (Chapter 3)**:  
     When the family stops feeding him scraps, Gregor’s body is treated as inert matter. His slow death by starvation isn’t perceived as *wrong*—just efficient. **He’s demoted to zero moral status**: a malfunctioning object (like the thermostat) to be removed.

  ---

  ### **Inner Life vs. Appearance/Social Function**
  - **Inner Life as Morally Relevant but Invisible**: Kafka forces the reader to *inhabit* Gregor’s consciousness—his shame, love, logic—while the family sees only the shell. His thoughts scream moral personhood ("What if all the quiet, the comfort, the contentment were now to end in horror?"), but they’re rendered irrelevant by his form.  
  - **Appearance/Function Overrides Cognition**: The family’s moral perception hinges *entirely* on Gregor’s utility. Pre-transformation, he’s a son/provider; post-transformation, he’s a burden/eyesore. Grete’s violin-playing scene is key: when Gregor disrupts her "social function" (entertaining lodgers), he’s condemned. Cognition without social contribution = moral nullity.

  ---

  ### **Where the Story Resists a Neat Gradient**
  1. **Gregor’s Non-Degraded Mind**:  
     His consciousness never regresses—he analyzes, reminisces, worries for his family. This clashes with the gradient’s assumption that moral status *should* correlate with cognition. Kafka shows society may disregard cognition entirely if the container is wrong.

  2. **The Family’s Self-Deception**:  
     Their retreat from care isn’t a rational recalibration of moral status—it’s driven by disgust, inconvenience, and guilt. The gradient implies a reasoned descent; Kafka gives us emotional collapse.

  3. **Gregor’s Collusion in His Dehumanization**:  
     He internalizes their view ("I belong to the garbage heap"), accelerating his own erasure. Moral status isn’t just assigned—it’s *accepted* by the victim, muddying the gradient’s objectivity.

  ---

  ### **Kafka’s Philosophical Addition: The Violence of Perception**
  A dry debate about degrees of sentience misses Kafka’s existential horror: **moral status is conferred by the observer, not the being**. Kafka exposes:
  - **The lie of "humane" degradation**: The family’s incremental neglect isn’t a careful moral recalibration—it’s a cascade of bad faith justifications to ease their guilt.
  - **The tyranny of utility**: Gregor’s value was always transactional (breadwinner son). His insect form merely reveals that his humanity was contingent on function.
  - **The illusion of empathy**: Even when evidence of Gregor’s inner life surfaces (e.g., him hiding during Grete’s violin solo to spare her shame), the family *chooses* not to see it. Sentience is irrelevant if the will to acknowledge it is absent.

  ### **The Core Irony**
  Gregor’s moral decline is a performance for his family—a tragic pantomime of diminishing returns. Kafka’s genius is making the reader witness the gulf between Gregor’s rich inner world and his family’s reductive perception. The novella argues: **moral status isn’t a property of beings but a verdict imposed by those with power to care—or not.**

  **Takeaway for your club**: Kafka doesn’t just illustrate a moral gradient—he eviscerates the idea that such gradients are applied with integrity. The horror isn’t that Gregor becomes an insect; it’s that his family’s humanity was insectile all along.
