prompt: |-
  Hey, I'm running a philosphy book club and we're tackling Kafka's The Metamorphosis next week, but I want to come at it from an angle that isn't just 'loss of humanity.' Read the story through the idea that moral status comes in degrees — from insects with minimal sentience up through mammals, with no sharp line, and with things like cognitive continuity, affective range, and social recipricity all weighing on where something lands on the scale (and a thermostat sitting at zero). Gregor keeps his human consciousness but gets an insectoid body, and his familys care collapses in stages: they feed him, then neglect him, then want him gone. Which specific moments map onto downward shifts on that gradient — is it loss of speech, the couch scene, his refusal of food, or something else? Does the novel treat his inner life as morally relevant but invisible, or does it suggest that appearance and social function override cognition? Where does the story resist being read as a neat illustration of gradated status? And what does Kafka add to the philosophical debate that a straightforward argument about degrees of sentience misses? No need for citations or a reading list — I just want a sharp, honest reading.
