  **BUREAU OF CALIBRATED DESERT AND SOCIAL ADJUSTMENT (BCDSA)  
  FREQUENTLY ASKED QUESTIONS (FAQs) - Version 3.7.1a**

  **1. What is the purpose of the BCDSA?**  
  The Bureau of Calibrated Desert and Social Adjustment (BCDSA) administers the National Desert Accounting Framework (NDAF). The NDAF quantifies citizen accountability obligations ("Desert Points") accrued through actions impacting social equilibrium. These points determine eligibility for calibrated interventions (retributive, rehabilitative, or incentivizing) to maintain optimal societal coordination. Desert is defined as a measurable policy output, not a metaphysical property of agents.

  **2. What are Desert Points (DPs)?**  
  Desert Points (DPs) are standardized units (Calibrated Desert Units - CDUs) assigned to citizens based on verified actions contravening Social Equilibrium Thresholds (SETs). DPs exist solely within the NDAF ledger and represent an agent's accrued liability for system adjustment. Positive DP balances trigger intervention protocols; negative balances may accrue towards rehabilitative rewards (see FAQ 12). DPs are non-transferable except under specific inheritance rules (FAQ 6).

  **3. How are Desert Points assigned?**  
  Assignment follows the **Retributive Liquidity Ratio Schedule (RLRS)**. Each proscribed action type has a base DP value, adjusted by context modifiers (Intent Coefficient, Harm Magnitude Index, Recidivism Surcharge). The RLRS ensures DPs reflect the *systemic cost* of norm deviation and the *adjustment effort* required. See Table A below.

  **Table A: Sample Retributive Liquidity Ratios (Simplified)**
  | **Action Code** | **Base DP (CDUs)** | **Intent Coeff. Range** | **Harm Index Modifier** | **Min. Liquidity Buffer**\* |
  | :-------------- | :----------------: | :---------------------: | :---------------------: | :-------------------------: |
  | SET-7.3a (Petty Theft) | 50 | 0.8 (Negligent) - 1.5 (Purposeful) | +/- 20% | 10% |
  | SET-4.1f (Agg. Assault) | 300 | 1.0 (Reckless) - 2.0 (Intentional) | +/- 40% | 25% |
  | SET-9.2d (Fraud >$10k) | 450 | 1.2 (Knowing) - 1.8 (Deceptive) | +/- 35% | 30% |
  | SET-12.5b (Nuisance Violation) | 15 | Fixed at 1.0 | Fixed | 5% |
  *\*Liquidity Buffer: Minimum % of total DPs that must be "liquid" (immediately dischargeable via standard intervention) to prevent system backlog.*

  **4. I believe factors beyond my control caused my actions. Can I get my DPs waived?**  
  You may file an **Exemption Petition**. Common petitions and adjudication standards are:
  *   **Form NCD-7 (Neuro-Causal Determinism):** Asserts action was inevitable due to neurological/biological state. *Adjudication:* "Ultimate-origin causality" is operationally irrelevant. The NDAF operates at the *agent-policy interface*. Neurological substrates generating the act are deemed sufficient to process the act within the accountability framework. Petition denied. DP liability stands.
  *   **Form ASC-12 (Adverse Social Conditioning):** Asserts action resulted from formative environmental deprivation or coercion. *Adjudication:* While conditioning factors may lower the Intent Coefficient (reducing DPs - see FAQ 3), they do not negate the *systemic impact* of the act or the *operational necessity* of registering DPs to maintain deterrence signals and resource allocation predictability. Petition typically results in DP mitigation (15-30% reduction), not waiver.
  *Denials cite "Administrative Necessity" (BCDSA Reg. § 451.22) and "Preservation of Policy-Level Agency Attribution" (NDAF Core Principle 1).*

  **5. What is "Desert Inheritance"?**  
  Minors do not inherit parental DPs as personal liability ("guilt"). However, significant parental DP accrual (Tier 3+ Offenses per RLRS) triggers **Administrative Oversight Obligations (AOO)** for dependent children. This may include mandatory enrollment in **Pro-Social Capacity Building Programs (PSCBP)** or increased monitoring via **Juvenile Equilibrium Assurance Protocols (JEAP)**. This reflects the empirically observed correlation between parental norm-deviation and offspring future system-adjustment costs, necessitating preventative resource allocation. File **Form DOI-3 (Declaration of Inherited Oversight)** upon notification.

  **6. I have new evidence proving I lacked "agential capacity" at the time of my violation. Can I get a refund on expended DPs?**  
  You may file **Form DPAR-9 (Desert Point Adjustment/Refund)**. If the BCDSA Review Panel verifies a *complete lack of relevant agential capacity* at the time of the act (e.g., verified severe psychosis via Form MHC-8, or automatism via Form NEF-2), you *may* be eligible for a partial refund. Refunds are issued as **Rehabilitation Vouchers (RVs)** equivalent to up to 70% of the expended DPs, minus a 30% **System Stability Surcharge (SSS)** to cover administrative costs of the original intervention and ledger recalibration. RVs are redeemable for specified pro-social capacity enhancements (e.g., vocational training credits). *Note: Retroactive capacity assessment does not invalidate the original system-adjustment function served by DP expenditure.*

  **7. How does this relate to "Free Will"?**  
  The BCDSA operationalizes accountability within a framework of *practical agency*. The metaphysical status of "free will" is explicitly designated an **Extraneous Operational Parameter (EOP)** under NDAF Directive 0.1. Attribution of DPs occurs at the level of *recognizable agent causation* within the social system. Debates concerning ultimate causal origins are administratively categorized as **Non-Justiciable Ontological Queries (NJOs)** and do not factor into DP assignment, expenditure, or refund calculations. The system functions *as if* agents are sources of responsibility, because this attribution schema demonstrably optimizes social coordination at the macro-scale.

  **8. Isn't calling this "desert" misleading if it's just social engineering?**  
  The term "Desert" within the NDAF refers specifically to the *calibrated output* of the system: the quantum of accountability (DPs) assigned to an agent based on their actions' system-impact, triggering a proportionate system-response. It is distinct from pre-theoretic or cosmological concepts of "just deserts." Using the term maintains valuable continuity with established legal and moral discourse, reinforcing the normative expectations crucial for the system's deterrent and coordinative efficacy. This is consistent with **Semantic Stability Protocols (SSP-5)** governing policy-level language.

  **9. Where can I check my Desert Point balance?**  
  Current DP balances are accessible via the **Citizen Accountability Portal (CAP)**, available online at portal.bcdsa.gov or at designated Public Accountability Kiosks (PAKs). You will need your SSN and BCDSA Access Code (mailed annually). Balances are updated quarterly or upon major DP events (assignment, expenditure via intervention, RV credit).

  **10. Who oversees the BCDSA?**  
  The BCDSA adheres to strict internal **Calibration and Equilibrium Audits (CEA)** conducted quarterly. Macro-level policy calibration is reviewed biennially by the **Congressional Committee on Social System Optimization (CCSSO)**. Appeals regarding individual DP assignments or petition denials are processed through the **Administrative Court of Desert Calibration (ACDC)**. Challenges to the foundational NDAF principles are deemed **Systemic Architecture Reviews (SARs)** and require petitioning the CCSSO directly via **Form SAR-1**, reviewed on a 10-year cycle.
