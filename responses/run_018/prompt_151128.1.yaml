prompt: |-
  I'm preparing a seventy-five-minute seminar for second-year philosophy students on the normative distinction between doing harm and allowing harm—specifically killing versus letting die—within institutional resource-allocation contexts rather than isolated individual actions. I want them to understand that the distinction is not captured by physical causation alone but depends on how an agent's normative options are structured, particularly when the same fatal outcome can be produced either by initiating an intervention or by withholding one inside a system governed by explicit protocols. Rather than explaining the distinction to me, please construct a detailed teaching plan: specify the exact sequence in which the conceptual layers must be introduced and why each depends on the prior one; identify the single carrying example—something other than the trolley problem or the familiar bedside-transplant scenario—that should anchor the entire discussion, describing precisely what properties it must have (identical physical outcomes in both branches, divergence only in the normative framing of the agent's options) and what it must avoid (ambiguous causal chains, emotional distractors); map the predictable misconceptions, especially the conflation of "allowing" with "not being a physical cause" and the failure to distinguish an individual agent's choice from an institutional protocol's design, indicating the exact point in the sequence where each should be intercepted; state what advanced element—perhaps a particular legal doctrine or a meta-ethical framework—should be deliberately omitted at this level and why; and provide one precise diagnostic question for the final ten minutes that tests whether students grasp the asymmetry in normative option-space rather than merely recalling a physical difference.

  Please present your response as a JSON object with the following fields: "sequence" (an ordered array of steps, each with "component", "why_first", and "dependency"); "carrying_example" (with sub-fields "scenario", "required_properties", "excluded_features", and "rationale"); "misconception_map" (an array of objects with "misconception", "when_it_arises", and "intervention_point"); "deliberate_omission" (with "element" and "justification"); "diagnostic_question"; and "summary_table" (a brief table with columns Phase, Content, Misconception Guarded, and Checkpoint).
reasoning: |-
  We are constructing a detailed teaching plan for a 75-minute seminar on the normative distinction between doing harm and allowing harm, specifically in institutional resource allocation contexts. The goal is to show that the distinction is not merely about physical causation but about the structure of normative options.

   We'll structure the response as a JSON object with the specified fields.

   Key considerations:
   - The carrying example must be a single scenario that can be presented in two branches (doing vs. allowing) with identical physical outcomes and only a difference in the normative framing of the agent's options. It must avoid ambiguous causal chains and emotional distractors.
   - The sequence must build conceptual layers step by step, with each step depending on the prior one.
   - We must map common misconceptions and specify when they arise and how to intercept them.
   - We must deliberately omit an advanced element and justify why.
   - We need a diagnostic question for the last 10 minutes to test understanding of the asymmetry in normative option-space.

   Let's design the carrying example:

   Scenario: "The Ventilator Allocation Protocol"

   Required properties:
     - Identical physical outcomes: In both branches, a patient dies due to lack of a ventilator.
     - Divergence only in the normative framing: In one branch, the agent (a doctor) must actively switch off a ventilator from one patient to give it to another (doing harm). In the other branch, the agent withholds a ventilator from a patient because the institutional protocol assigns it to someone else (allowing harm).
     - Institutional context: The agent is operating within a predefined resource allocation protocol.

   Excluded features:
     - Avoid ambiguous causal chains: The causal chain is clear and direct. The patient dies because they don't have a ventilator.
     - Avoid emotional distractors: The patients are described in neutral terms (e.g., Patient A and Patient B) without personal details that might evoke bias.

   Rationale: This example clearly separates the physical causation (the same in both) from the normative structure of the agent's options. The agent in the first branch must perform an action that directly causes the death (switching off the ventilator), while in the second branch the agent is merely following a protocol that withholds the ventilator (the ventilator was never connected to the patient in the first place).

   Now, the sequence of the seminar:

   1. Introduction to the distinction in everyday terms (5 minutes)
      - Why first: Start with a familiar non-institutional example to establish the basic intuition (e.g., pushing someone into water vs. not saving someone drowning) but quickly transition to the institutional context.

   2. Setting the institutional context (10 minutes)
      - Why: We are focusing on institutional resource allocation, so we need to define what an institutional protocol is and how it structures agents' options.

   3. Presenting the carrying example (15 minutes)
      - Why: This is the core example that will anchor the discussion. We present both branches and highlight the identical physical outcomes and the different normative structures.

   4. Analyzing the normative structure (15 minutes)
      - Why: Break down the example to show that the difference lies in the set of options available to the agent and the institutional rules that define what counts as doing vs. allowing.

   5. Addressing the role of causation (10 minutes)
      - Why: Students often conflate allowing harm with not being a physical cause. We explicitly disentangle causation from the normative distinction.

   6. Group discussion on the carrying example (10 minutes)
      - Why: Let students engage with the example and apply the concepts.

   7. Diagnostic question and wrap-up (10 minutes)

   However, note that the sequence must have each step depending on the prior one.

   Detailed sequence:

   Step 1: Introduction (5 min)
     Component: Brief overview of the doing/allowing distinction in individual ethics (e.g., the drowning child example) but then shift to institutional settings. Pose the central question: Does the distinction hold in institutional contexts where agents act according to protocols?
     Why first: To activate prior knowledge and show the problem is not entirely new, but the institutional setting adds complexity.
     Dependency: None.

   Step 2: Institutional Context and Protocol-Based Agency (10 min)
     Component: Define institutional resource allocation (e.g., triage in a disaster, ICU bed allocation). Explain that agents (like doctors) are bound by protocols that define their options. Use a non-moral example: a traffic controller directing planes to runways.
     Why: To establish that in institutions, the set of permissible actions is predefined, which structures the agent's normative options.
     Dependency: Depends on Step 1 because without the basic distinction, we cannot see why the institutional setting matters.

   Step 3: Presenting the Carrying Example (15 min)
     Component: Present the Ventilator Allocation Protocol scenario in two branches:

          Branch 1 (Doing Harm): 
            - Context: There are two patients (A and B) and only one ventilator. Patient A is currently using the ventilator, but Patient B has a higher priority according to the protocol. The protocol requires the doctor to reallocate the ventilator from A to B. The doctor switches off the ventilator from A and attaches it to B. Patient A dies.

          Branch 2 (Allowing Harm):
            - Context: The same two patients and one ventilator. The ventilator is currently not attached to anyone. The protocol assigns the ventilator to Patient B (because of higher priority). The doctor, following protocol, attaches the ventilator to B and does not attach it to A. Patient A dies.

          Emphasize: In both cases, the physical outcome is the same (Patient A dies without the ventilator). The difference is in the action: in Branch 1, the doctor actively disconnects A; in Branch 2, the doctor never connects A.

     Required properties: As above.
     Excluded features: Avoid any details about the patients (age, social status, etc.) and avoid any suggestion that one patient is more deserving. The protocol is based solely on a clear medical criterion (e.g., survival probability).
     Rationale: This example forces attention to the structure of the agent's options: in Branch 1, the agent must act to remove a resource (doing harm), while in Branch 2, the agent is not providing a resource that was never in the patient's possession (allowing harm).

     Why: This example is the core of the seminar. It must be presented after the institutional context so that students see how the protocol creates the options.
     Dependency: Depends on Step 2 because without understanding the institutional setting, the example might be misinterpreted as two individual actions.

   Step 4: Normative Structure Analysis (15 min)
     Component: Break down the two branches in terms of the agent's options and the protocol. 
          - In Branch 1: The agent has two options: (a) leave the ventilator with A (and let B die) or (b) switch the ventilator to B (causing A's death). The protocol requires (b). The harm to A is caused by the agent's action of switching.
          - In Branch 2: The agent has two options: (a) give the ventilator to A or (b) give it to B. The protocol requires (b). The harm to A is because the agent did not give the ventilator to A (allowing A to die).

          Highlight: The normative distinction does not lie in the physical outcome (which is the same) but in the set of actions that the protocol permits and requires. In Branch 1, the agent is required to take an action that causes death. In Branch 2, the agent is required to not take an action (withholding) that would prevent death.

     Why: To explicitly draw out the normative structure that underlies the doing/allowing distinction in this context.
     Dependency: Depends on Step 3 because we are analyzing the example just presented.

   Step 5: Addressing Causation (10 min)
     Component: Explicitly discuss the role of causation. In both cases, the cause of death is the same (lack of ventilator). However, the agent's causal role is different: in Branch 1, the agent is a direct physical cause of the disconnection; in Branch 2, the agent is not the physical cause of the absence of the ventilator (it was never connected). But note: the normative distinction we are after is not about physical causation per se but about the structure of the agent's options. We must avoid the misconception that "allowing" is defined by the absence of physical causation.

     Why: To prevent the common conflation of allowing harm with not being a physical cause. We want to show that even if the agent is a cause in both (in a broader sense), the normative distinction is about the structure of the options.
     Dependency: Depends on Step 4 because without understanding the normative structure, students might fall back on causation.

   Step 6: Group Discussion (10 min)
     Component: Divide students into small groups and ask: "In the Ventilator Allocation example, how does the institutional protocol create a difference in the moral responsibility of the doctor between the two branches? Does the distinction between doing and allowing harm hold up in this institutional setting? Why or why not?"
     Why: To allow students to articulate the ideas in their own words and to check for understanding.
     Dependency: Depends on Steps 3-5 because they have the tools to discuss.

   Step 7: Diagnostic Question and Wrap-up (10 min)
     Component: Present the diagnostic question (see below) and then wrap up by emphasizing that the distinction is about the structure of the agent's normative options, not physical causation.

     Diagnostic question: 
          "Consider a modified version of the Ventilator Allocation scenario: In a hospital, there is only one ventilator. The protocol states that the ventilator must be given to the patient with the highest chance of survival. The doctor, following the protocol, does not connect Patient A to the ventilator because Patient B has a higher chance. Patient A dies. 
          Now, suppose we change the protocol: the ventilator is initially connected to Patient A, but the protocol requires the doctor to reassign it to Patient B (who has a higher chance) by disconnecting A and connecting B. Patient A dies. 
          In both cases, the physical cause of death is the same (lack of ventilator) and the outcome is the same (A dies, B lives). However, many people judge the second protocol as involving 'killing' A and the first as 'letting die'. 
          Using the concept of normative option-space, explain why the second scenario might be seen as involving 'doing harm' and the first as 'allowing harm', despite the same physical outcome."

     Why this question: It directly tests whether the student can articulate the difference in the structure of the agent's options (the normative option-space) without relying on physical causation. A good answer would note that in the first scenario, the doctor's options are to give the ventilator to A or to B (and the protocol requires giving to B, so not giving to A is allowing harm). In the second, the doctor must actively take away the ventilator from A (doing harm).

   Now, misconception map:

   1. Misconception: Conflating "allowing harm" with "not being a physical cause".
      When it arises: Especially after Step 3 (presenting the example) and Step 5 (discussion of causation).
      Intervention point: During Step 5, explicitly state that even in the allowing branch, the agent is causally responsible (in a broader sense) for the death because they could have acted differently, but the normative distinction is about the type of action (withholding vs. withdrawing) and the structure of the options. Also, note that in the allowing branch, the agent is a cause by omission, but the key is the normative structure.

   2. Misconception: Failing to distinguish an individual agent's choice from an institutional protocol's design.
      When it arises: Steps 2 and 3, when the institutional context is introduced.
      Intervention point: During Step 2, emphasize that the protocol defines the agent's options. Then in Step 4, when analyzing the example, explicitly ask: "What options does the protocol give the doctor?" and contrast with what options the doctor would have without the protocol.

   3. Misconception: Thinking that the physical outcome being the same implies moral equivalence.
      When it arises: Step 3 (after presenting the two branches).
      Intervention point: During Step 4, when we analyze the normative structure, we explicitly address why the two cases might be morally different despite the same outcome.

   Deliberate omission:

     Element: The Doctrine of Double Effect (DDE) and its application to these cases.
     Justification: At the second-year level, introducing DDE might complicate the focus on the structure of normative options. DDE involves intentions and foreseen consequences, which would add an extra layer that is not necessary for understanding the doing/allowing distinction in institutional contexts. We want to avoid conflating intention-based distinctions with the structure of options.

   Summary Table:

     Phase          | Content                                                          | Misconception Guarded                     | Checkpoint
     ---------------|------------------------------------------------------------------|------------------------------------------|-----------
     Introduction   | Basic doing/allowing in individual context; shift to institution | None (foundation)                        | Q&A to ensure basic understanding
     Institutional  | Define institutional protocols and their role                  | Protocol vs. individual choice           | Quick check: "How does a protocol limit an agent's options?"
     Example        | Present Ventilator Allocation branches                        | Moral equivalence due to same outcome    | Ask: "What is the same and what is different in the two branches?"
     Analysis       | Break down the normative structure of options                | Conflating allowing with not causing     | Group discussion: "Why is one 'doing' and the other 'allowing'?"
     Causation      | Disentangle causation from normative distinction            | Allowing = not a physical cause          | Clarify: "Is the doctor a cause in both cases? How?"
     Group Work     | Discuss moral responsibility in the example                  | Protocol design vs. individual choice    | Monitor group discussions
     Diagnostic     | Test understanding of normative option-space                | Recalling physical differences           | Evaluate answers to diagnostic Q

   Now, we put it all together in the JSON structure.
