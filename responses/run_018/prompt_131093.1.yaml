  Here is a concrete, philosophically substantive example designed to isolate the tension you describe—where the ambiguity between transworld identity and counterpart status arises from an agent's *internal conflict about their own criteria of essentiality*, rooted in competing second-order normative commitments:

  ---

  ### **The Case of the Conflicted Reformer: "Alex and the Family Legacy"**

  **Background:**  
  Alex is the heir to a multi-generational family business empire built on practices Alex now considers deeply unethical (e.g., exploitative labor, environmental harm). Alex’s practical identity is defined by two equally fundamental but conflicting *second-order commitments*:  
  1. **Fidelity to Sacrifice**: Alex believes their identity is grounded in honoring the sacrifices of ancestors who built the legacy. To abandon it would betray the very history that constituted Alex’s upbringing, values, and social role.  
  2. **Moral Self-Authoring**: Alex equally endorses a commitment to *autonomous moral growth* as essential to being "truly oneself." Stagnation or complicity in injustice, they believe, would fracture their authentic self.  

  These commitments exist in tension within Alex’s normative hierarchy. Neither is clearly subordinate; both are treated as core to Alex’s self-conception.  

  **The Ambiguous Possible World (ω):**  
  In ω, Alex has radically reformed the family business:  
  - Its unethical practices are eliminated.  
  - It now operates as a model of social responsibility.  
  - *However*, this required Alex to publicly denounce their family’s legacy, sever ties with relatives, and dismantle the original corporate structure.  

  ω-Alex is psychologically continuous with actual-Alex (same memories, personality traits, etc.) and acted out of genuine moral conviction. Yet ω-Alex’s actions directly violate the "Fidelity to Sacrifice" norm that actual-Alex considers identity-constitutive. Crucially, ω-Alex *also* views their actions as necessary for fulfilling their "Moral Self-Authoring" norm.  

  **The Conceptual Tension:**  
  1. **Transworld Identity Claim**:  
     - ω-Alex satisfies *actual-Alex’s* "Moral Self-Authoring" criterion: They exercised autonomous moral growth, preserving what Alex sees as essential to their *capacity for authenticity*.  
     - ω-Alex’s psychological continuity and first-person perspective align with actual-Alex.  
     - *Thus*, ω-Alex *is* Alex (transworld identity holds).  

  2. **Counterpart-Theoretic Claim**:  
     - ω-Alex violates actual-Alex’s "Fidelity to Sacrifice" criterion: They destroyed the legacy Alex believes is foundational to their identity.  
     - The act of severing familial/social ties negates a relational property Alex treats as essential.  
     - *Thus*, ω-Alex is merely a *counterpart*—a being maximally similar to Alex in ω who shares important properties (e.g., moral sincerity) but fails to preserve the *historically embedded essence* Alex’s identity relies upon.  

  **Why the Ambiguity is Genuine & Substantive**:  
  - **Internal Conflict of Norms**: The question "Is ω-Alex *me*?" has no answer because actual-Alex’s *own* criteria for essentiality pull in opposite directions. "Fidelity to Sacrifice" demands historical-relational continuity; "Moral Self-Authoring" demands ethical self-transcendence. ω-Alex fulfills one and negates the other.  
  - **No First-Order Divergence**: The tension arises purely from Alex’s second-order evaluation of *which properties are essential*. Physical/psychological duplication is preserved; the ambiguity stems solely from normative self-conflict.  
  - **Metaphysical Irresolvability**: Alex cannot appeal to a "deeper" self to resolve this because *both* commitments are equally central to their practical identity. The hierarchy of values is circular or equipollent.  

  **Philosophical Significance**:  
  This case exposes how *self-prescription of essence* can destabilize transworld identity. When an agent’s norms for "what makes me *me*" conflict, the metaphysics of persistence across worlds becomes fractured. Lewis’s counterpart theory handles this by allowing multiple similarity relations (e.g., ω-Alex could be a *moral* counterpart but not a *legacy* counterpart). Transworld identity, however, requires a unitary essence—which Alex’s own commitments refuse to supply. The ambiguity is not epistemic but *constitutive*, rooted in the agent’s self-contradictory ground of identity.  

  ---  
  This example avoids physical/psychological duplication scenarios by centering the conflict entirely on the agent’s self-referential norms. The tension emerges from the **irreducible duality in what the agent takes to be essential to their being**, making it a pure test case for the metaphysics of normative self-constitution.
