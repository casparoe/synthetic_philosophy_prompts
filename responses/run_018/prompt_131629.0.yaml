  The most promising angle might be their final suggestion: maybe "mind-independent moral truth" itself needs re-examining. If moral properties aren't causally efficacious in the way natural selection responds to, the whole debunking framework might misfire. That could explain why the debate goes in circles - both sides accept premises the other rejects at root level.

