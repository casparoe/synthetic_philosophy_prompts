  Hmm... looking at how they frame it, they've already spotted something important: realists often defend value-tracking while debunkers target obligation-authority. That's perceptive. Also their observation about empirical vs conceptual questions - one side looks at cognitive architecture, the other at belief warrant regardless of correction. 

