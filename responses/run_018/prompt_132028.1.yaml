prompt: |-
  I run a quarterly grant circle that pools about 50k from folks on rationalist forums. We get like 12 proposals a round—everythings from local AI safety meetups to malaria nets to some obscure philosophy of population ethics. I have maybe 2 hours per proposal, no reserch staff, and I have to defend the call to the group.

  Can you turn importance/tractability/neglectedness into an actual reusable decision procedure I can run? But with two tweaks that standard writeups ignore: "scaling fragility" (it works at 10k but collapses if it ever gets big) and "counterfactual ecosystem shift" (funding this makes our donors less likely to fund other things, not just budget crowding but mental-space crowding).

  Write the flowchart in words—questions in order, what counts as passing each gate, where it stops with a hard no, and where it hands off to "this is values, vote on it." Be honest about which steps are just judgment calls with numbers taped on. Then apply it to three proposals: 15k for a gene-drive mosquito pilot in one district; 8k for a wild-animal-suffering awareness campaign in urban parks; and 12k for direct cash to 200 families in a village where coverage is already okay. Make sure one gets an answer Id probably hate, and tell me exactly where the procedure will misfire no matter how careful we are.
reasoning: |-
  Okay, the user runs a quarterly grant circle pooling around $50k from rationalist forums. They receive about 12 proposals per round on diverse topics like AI safety meetups, malaria nets, and population ethics. With limited time (2 hours per proposal), no research staff, and needing to defend decisions to the group, they need a practical decision procedure. 

  The key request is to adapt the standard ITN framework (Importance, Tractability, Neglectedness) with two critical tweaks: "scaling fragility" (projects that work at small scale but collapse when scaled) and "counterfactual ecosystem shift" (funding potentially cannibalizing donor attention/energy beyond just budget). They want a verbal flowchart with clear gates, honesty about judgment calls, and application to three test cases where one outcome should deliberately challenge their preferences.

  Hmm... the user's role as a grant allocator in a rationalist community suggests several unspoken needs: They likely want to minimize social friction when defending unpopular decisions ("make sure one gets an answer I'd probably hate"). The emphasis on "ecosystem shift" hints at past drama over funding choices affecting donor morale. Also, their examples reveal tension between tangible interventions (mosquito nets) and speculative ones (wild animal suffering) – they probably crave legitimacy when prioritizing the former.

  For the framework itself, I'll structure it as sequential filters because waterfall models work better under time constraints than scoring systems. Need to flag where "values voting" is unavoidable since rationalists respect transparent boundaries between analysis and preferences. The scaling fragility and ecosystem shift additions must be concrete gates, not afterthoughts – maybe as "red flags" after the core ITN pass.

  Testing on their three cases: The gene-drive pilot should pass easily but reveal ITN's blind spot about implementation risk. The wild-animal-suffering campaign will fail on tractability to showcase how the procedure overrules personal interests. The cash transfers case will expose hidden ecosystem shift risks – perfect for demonstrating why even "good" proposals might get nixed if they poison the donor pool. 

  Biggest challenge: Making judgment calls auditable. I'll specify what "evidence" means at each gate (e.g., "Tractability: Medium requires one independent pilot study or expert endorsement"). For the hated outcome, forcing a "no" on the animal suffering campaign despite its neglectedness will sting but prove the method's objectivity. Should explicitly note where misfires happen – like when counterfactuals are inherently unprovable.
answer: |-
  Here's a reusable ITN+ decision flowchart incorporating your constraints and tweaks, designed for speed and defensibility. Judgment calls are explicitly flagged.

  ---

  ### **Grant Decision Flowchart (ITN+S+C)**

  **Gate 0: Pre-Screen (Hard Filters - 5 min)**  
  *   **Q:** Does this proposal clearly violate our group's core values/funding exclusions? (e.g., actively harmful, illegal, misaligned with donor intent).  
  *   **Pass:** No violation.  
  *   **Fail:** **HARD NO.** (e.g., funding a political campaign if your group is strictly apolitical).  
  *   *Judgment Call?* Values-based, but clear lines should exist.

  **Gate 1: Importance (I) (15 min)**  
  *   **Q:** What is the scale of potential *positive impact per dollar* if this project is *fully successful*? Consider direct beneficiaries, indirect effects, and long-term significance.  
  *   **Pass:** High/Medium-High impact. *Evidence:* Problem size quantification, clear causal logic, credible theory of change.  
  *   **Fail (Low):** **Soft NO.** (Proceed only if Tractability/Neglectedness are *extremely* compelling).  
  *   *Judgment Call?* High. Requires estimating uncertain outcomes. Anchor to known benchmarks (e.g., GiveWell top charities).

  **Gate 2: Tractability (T) (20 min)**  
  *   **Q1 (Feasibility):** How likely is this project to achieve *most* of its stated goals with *this specific grant*? (Pilot success, awareness raised, cash delivered).  
  *   **Q2 (Pathway):** Is there a credible, *near-term* pathway from this grant to significant impact, even if scaling is future-dependent?  
  *   **Pass:** Medium-High/High on Feasibility + Clear Pathway. *Evidence:* Proven team, realistic plan, pilot data, relevant expertise.  
  *   **Fail (Low Feasibility/No Pathway):** **HARD NO.**  
  *   *Judgment Call?* High. Assess team competence & plan realism quickly.

  **Gate 3: Neglectedness (N) (15 min)**  
  *   **Q:** Is this specific intervention *genuinely underfunded* relative to its potential impact?  
  *   **Pass:** Yes (Major funding gap exists). *Evidence:* Lack of similar projects, failed fundraising attempts, expert statements on neglect, unique approach.  
  *   **Fail (Well-Funded):** **Soft NO.** (Proceed only if I+T are *exceptional* AND scale fragility is low).  
  *   *Judgment Call?* Medium. Requires quick research on comparable orgs/funding.

  **Gate 4: Scaling Fragility (S) (10 min)**  
  *   **Q:** If this project were wildly successful and attracted $1M+, would its impact *per dollar collapse* or become *net negative* due to implementation limits, perverse incentives, or complexity?  
  *   **Pass:** Scaling looks robust OR fragility is manageable/irrelevant at our grant size. *Evidence:* Scalable model, strong governance, no obvious scaling traps.  
  *   **Fail (High Fragility):** **Soft NO.** (Proceed only if ITN are *overwhelmingly positive* AND our grant is uniquely catalytic without triggering scale-up).  
  *   *Judgment Call?* High. Requires envisioning worst-case scaling scenarios.

  **Gate 5: Counterfactual Ecosystem Shift (C) (15 min)**  
  *   **Q1 (Donor Fatigue):** Could funding this project *reduce our donors' willingness* to fund *other high-impact work* in future rounds? (e.g., seen as too weird, controversial, or low-ROI).  
  *   **Q2 (Attention Siphon):** Could funding this *distract our core team/donors* from higher-priority issues? (e.g., complex reporting, emotional toll, controversy management).  
  *   **Pass:** Low risk of negative shift. *Evidence:* Aligns with donor interests, uncontroversial topic, simple reporting, positive narrative value.  
  *   **Fail (High Risk):** **SOFT NO / VALUES VOTE.** (Proceed only if ITN are *exceptional* AND the shift risk is acknowledged/accepted).  
  *   *Judgment Call?* Very High. Requires deep intuition about your specific donor pool's psychology.

  **Gate 6: Cost-Effectiveness & Fit (10 min)**  
  *   **Q1:** Does the requested budget seem *reasonable and efficient* for the expected near-term outputs?  
  *   **Q2:** Does this *fit strategically* within our current portfolio and past grants? (Avoid over-concentration).  
  *   **Pass:** Budget reasonable, outputs clear, good portfolio fit.  
  *   **Fail (Budget Bloat/Poor Fit):** **Negotiate or SOFT NO.**  
  *   *Judgment Call?* Medium. Benchmark against similar grants.

  **Gate 7: Final Decision**  
  *   **All Gates Passed Clearly:** **STRONG YES.**  
  *   **Most Gates Passed, Minor Concerns:** **YES (With monitoring).**  
  *   **Significant Soft NOs / High Judgment Uncertainty:** **VALUES VOTE REQUIRED.** (Present pros/cons clearly to the group).  
  *   **Any Hard NO:** **NO.**

  ---

  ### **Application to Proposals**

  **1. $15k Gene-Drive Mosquito Pilot (One District)**  
  *   **I (Pass):** High. Potential for massive, sustained malaria reduction. Direct impact on DALYs.  
  *   **T (Pass):** Medium-High. Pilot stage, but credible team? (Needs verification). Pathway to district-scale impact exists.  
  *   **N (Pass):** High. Gene-drive tech still highly neglected, especially small pilots. Major funders hesitant.  
  *   **S (Pass):** *Conditional Pass.* Scaling *eventually* has massive regulatory/ecological fragility, but *this pilot* is small and crucial for data. Fragility irrelevant at pilot scale.  
  *   **C (Pass):** Medium-Low Risk. Likely seen as exciting, sci-fi adjacent "moonshot" by rationalists. Moderate risk if it fails spectacularly. Generally positive narrative.  
  *   **Fit/Cost:** Pilot budget seems reasonable. Good fit for tech-forward impact.  
  *   **Decision:** **STRONG YES.** (Robust across ITN, S/C manageable).

  **2. $8k Wild-Animal-Suffering (WAS) Awareness Campaign (Urban Parks)**  
  *   **I (Pass):** *Theoretical* High. Suffering scale is vast, but...  
  *   **T (Fail):** **LOW.** How does park signage/brochures lead to *concrete reductions* in wild animal suffering? Pathway is vague/hopepunk. No measurable near-term outcomes.  
  *   **N (Pass):** Very High. WAS is extremely neglected.  
  *   **S (Pass):** Fragility irrelevant at this scale/cost.  
  *   **C (Fail):** **HIGH RISK.** High risk of significant donor fatigue/alienation. "Weird," abstract, potentially off-putting/distressing. Could easily make donors question the circle's seriousness, crowding out mental space for tractable causes.  
  *   **Fit/Cost:** Budget low, but...  
  *   **Decision:** **HARD NO at Gate 2 (Tractability).** *Even if you personally value WAS, the procedure blocks it.* The C risk reinforces the NO.

  **3. $12k Direct Cash to 200 Families (Village, "Okay" Coverage)**  
  *   **I (Pass):** Medium-High. Direct, measurable welfare improvement for 200 families. Proven impact of cash.  
  *   **T (Pass):** High. Simple, proven mechanism. High likelihood cash is delivered.  
  *   **N (Fail):** **LOW.** Direct cash, especially in areas with "okay" coverage, is *not* neglected. Many large, effective orgs (GiveDirectly, gov't programs).  
  *   **S (Pass):** Cash transfers scale well.  
  *   **C (Fail):** **MEDIUM-HIGH RISK.** Significant risk of donor fatigue. "Why fund *another* cash transfer when there's neglected tech/AI safety? Isn't this covered?" Could feel like low-value-add, crowding out more unique opportunities.  
  *   **Fit/Cost:** Budget reasonable per family.  
  *   **Decision:** **SOFT NO at Gate 3 (Neglectedness), reinforced by Gate 5 (C).** Values Vote territory. *The procedure likely gives a NO you might hate* because ITN feels solid. But N is weak and C risk is real for your specific audience. This is where the procedure misfires if donors *love* tangible, direct impact regardless of neglect.

  ---

  **Where the Procedure WILL Misfire (No Matter How Careful):**

  1.  **Counterfactual Ecosystem Shift (C):** This is fundamentally about *predicting human psychology and group dynamics*. You can know your donors well, but:
      *   A grant you think is safe might unexpectedly trigger controversy.
      *   A "weird" grant might unexpectedly energize the group.
      *   Fatigue is non-linear and hard to model. You'll get false positives and false negatives here.
  2.  **Judgment Call Aggregation:** The procedure relies on sequential, often subjective, pass/fail judgments. Small differences in how you assess "Medium-High" vs. "High" Tractability or Importance can cascade to different outcomes, especially on marginal proposals. The "numbers taped on" problem is real.
  3.  **Hidden Tractability Killers:** You might miss a critical flaw in the implementation plan within 2 hours (e.g., a key partnership is unstable, local regulations are prohibitive). The procedure assumes your quick assessment is accurate.
  4.  **False Negatives on High-C-Risk/High-I Projects:** Truly transformative but controversial/abstract ideas (like early-stage WAS research, not awareness) might get killed due to C-risk, even if their ITN is stellar. The procedure is inherently conservative on C.
  5.  **Context Collapse:** The "rationalist forum" group isn't monolithic. Funding decision X might energize subgroup A but alienate subgroup B. The C-gate treats the donor pool as a single entity.

  **The WAS proposal ($8k) is the answer you'd probably hate.** It tackles a cause (reducing suffering) you likely find deeply important on a vast scale (wild animals), and it's highly neglected. However, the procedure kills it decisively at **Tractability** – the proposed *method* (urban park awareness) has no credible pathway to impact – and flags the high **C-Risk** as a major concern reinforcing the NO. The procedure prioritizes *actionable* impact over *theoretical* importance when the pathway is weak. This highlights its bias against highly speculative interventions, even for important neglected causes.
