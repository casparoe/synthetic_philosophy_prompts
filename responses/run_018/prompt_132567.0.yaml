answer: |-
  ## The Epistemic Failure of Intractability in Normative Theories

  **I. The Core Argument: Intractability as Epistemic Failure**

  Normative theories prescribe what rational agents *ought* to do. For such prescriptions to be genuinely binding or rationally endorsable, agents must, in principle, be able to *understand* and *justifiably believe* in the specific obligation the theory imposes. Computational intractability, specifically NP-hardness, undermines this foundational epistemic condition.

  1.  **The Nature of NP-Hardness:** An NP-hard problem (like finding an exact Kemeny-Young ranking) possesses two key features relevant here:
      *   **Solution Existence:** For any given instance, a solution satisfying the normative criterion (e.g., minimizing pairwise disagreements) *does* exist.
      *   **Solution Inaccessibility (in practice and principle):** There is no known algorithm guaranteed to find this solution for arbitrary instances in time bounded by a polynomial function of the problem size. As instances grow modestly (e.g., more alternatives or agents), the time required to find the *exact* solution grows explosively (exponentially or worse), quickly exceeding any feasible computational timeframe, even with immense resources.

  2.  **Epistemic Gap:** This intractability creates an epistemic gap between the *existence* of a normative prescription and an agent's *cognitive access* to it.
      *   The theory dictates: "You ought to perform action/choose outcome X," where X is defined as the specific entity satisfying the complex optimization criterion (e.g., the exact Kemeny ranking).
      *   However, NP-hardness means that *identifying X itself* is computationally infeasible for non-trivial instances. The agent cannot, within any reasonable cognitive or temporal horizon, determine *what X actually is* for their specific situation.

  3.  **Failure of Justification and Understanding:** Therefore:
      *   **Justified Belief:** The agent cannot form a justified belief that a specific course of action *is* the one prescribed by the theory. They might know *a solution exists*, but they cannot know *which* of the astronomically many possible actions *is* the prescribed one. The theory fails to provide actionable normative guidance.
      *   **Understanding:** The agent cannot genuinely *understand* the prescription *as it applies to them*. They grasp the abstract criterion (e.g., "minimize inversions"), but cannot trace the connection from this criterion to the specific obligation in their context because the computational path linking principle to prescription is impassably complex. The prescription remains an inaccessible abstraction, not a concrete directive.
      *   **Rational Endorsement:** An agent cannot rationally endorse or commit to performing an action they cannot identify as the one demanded by the theory. Obligation requires knowing *what* is obliged.

  This is an *epistemic* failure because it concerns the agent's capacity to *know*, *justify*, and *rationally grasp* the specific content of the obligation imposed by the normative theory. The theory fails to make its prescription cognitively accessible and justifiable to the agent it purports to bind.

  **II. Contrast with Demandingness Objections**

  The demandingness objection against consequentialism (and similar theories) argues that the theory requires agents to perform actions that are *psychologically too difficult* or *personally too costly* (e.g., sacrificing one's life savings to save distant strangers). The critique focuses on:

  *   **Motivational Cost:** The theory asks for sacrifices beyond typical human motivation.
  *   **Psychological Burden:** Complying imposes severe stress, exhaustion, or undermines personal integrity/relationships.
  *   **Feasibility of Action Execution:** The *act itself*, once identified, might be physically or emotionally overwhelming.

  **Key Distinction:** Demandingness objections grant that the agent *can identify the prescribed action* (e.g., "I ought to donate $X to charity Y"). The failure lies in the *cost* of performing that identified action. The *epistemic link* between the normative principle ("maximize utility") and the specific prescription ("donate $X to Y") remains intact, even if the prescription is motivationally overwhelming. The agent understands *what* they ought to do, but finds doing it too burdensome.

  Intractability, conversely, directly severs the *epistemic link*. The agent *cannot* identify *what* the specific prescribed action *is*. The failure precedes the question of motivation or cost; it strikes at the very possibility of knowing the obligation. The theory fails to discharge its primary function: specifying *what* ought to be done in a cognitively accessible way.

  **III. The Approximation Scheme Counter-Argument and Why It Fails Epistemically**

  The counter-argument suggests that polynomial-time approximation schemes (e.g., using MCMC to find a *near*-optimal ranking) salvage the normative theory by providing a tractable way to get "close enough" to the ideal prescription.

  *   **Why it seems plausible:** Approximation yields a feasible output (a specific ranking) reasonably quickly. This output often performs well by the theory's metric (e.g., has relatively few pairwise disagreements). It provides *practical* guidance.

  *   **Why it misses the epistemic point:**
      1.  **Loss of Normative Authority:** The approximation *is not* the action prescribed by the original theory. The theory mandates the *exact optimum* (e.g., the Kemeny ranking). The approximation is a *different* outcome, generated by a *different* computational process (e.g., a stochastic sampling heuristic). Its normative status derives solely from its *proximity* to the inaccessible ideal, not from satisfying the original criterion *directly*. The theory cannot justify why *this specific approximation* is obligatory; it can only claim it's "probably close." This severs the direct justificatory link between the core normative principle and the specific output the agent receives.
      2.  **Uncertainty and Justification:** The agent using an approximation scheme knows the output is *not* the prescribed action. They know there is some error, though its magnitude may be statistically bounded. Crucially, they cannot know *if this specific output is the correct one*, nor can they justify *why this specific output* is the one they ought to follow *as a matter of normative obligation*. They have a *pragmatic substitute*, not a justified belief in the prescription.
      3.  **Understanding Undermined:** The agent cannot trace the path from the normative principle to the approximate output *via the theory's own logic*. The approximation algorithm introduces its own logic (e.g., random walks, convergence thresholds) which is distinct from the optimization principle defining the ideal. The agent understands the *heuristic*, not the *normative justification* for the specific result. The prescription remains opaque; they follow a procedure, not a understood moral imperative.
      4.  **The "Switch in Theory" Problem:** Reliance on approximations effectively replaces the original normative theory (e.g., "follow the Kemeny ranking") with a new, procedural one (e.g., "follow the output of this specific MCMC sampler after N iterations"). This new theory lacks the *principled justification* of the original. Why *this* sampler? Why *these* parameters? The epistemic connection to the original normative foundation is broken.

  **Conclusion:**

  Computational intractability, exemplified by the NP-hardness of exact aggregation rules, constitutes a fundamental *epistemic* failure for normative theories. It prevents rational agents from identifying, understanding, and forming justified beliefs about the *specific actions* the theory prescribes for their circumstances. This failure is distinct from demandingness objections, which challenge the *execution* of a known obligation. Approximation schemes, while practically valuable, fail to resolve this epistemic failure. They provide pragmatic substitutes but sever the direct justificatory link between the core normative principle and the agent's specific obligation, substituting procedural outputs for understood prescriptions. For a normative theory to genuinely bind rational agents, it must not only define what ought to be done in principle, but also ensure that agents can, in principle, cognitively access and comprehend *what that specific thing is*. Intractability irrevocably blocks this access, rendering the theory epistemically inert as a guide for rational action in complex domains.
