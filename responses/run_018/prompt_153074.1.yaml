prompt: |-
  Design a 75-minute structured role-play for a seminar of about 16 upper-level students in political philosophy or comparative ethics. The participants should come away seeing that the line between corruption and legitimate reciprocity is not just a matter of applying a universal Western standard, but depends on whether an exchange is visible, role-embedded, and convertible into material advantage—features that can pull in opposite directions within the same institutional rules.

  Center the activity on a fictional municipal planning board in a post-colonial city-state, Mariká, whose formal regulations recognize “kinship credits”: social obligations accrued through neighborhood and family ties that can be registered with the board but carry unwritten norms about when they may be drawn upon to secure land-use variances, expedited permits, or exemptions from density rules. Invent the mechanics concretely—three types of variance (residential height, commercial zoning, heritage demolition), a token economy of reputation points and future-obligation cards, and a public audit mechanism triggered by anonymous complaints—so that the rules themselves generate the tension, not a facilitator’s framing.

  Structure three decision rounds with these roles: four board members (each with a different institutional background—elected official, appointed planner, community elder, legal auditor), six petitioners (with different credit portfolios and hidden private obligations), and six observers who hold partial information and can file audit triggers. Between rounds, reveal new information: first, only formal applications; second, the kinship-credit registers; third, which petitioners have undisclosed reciprocal debts to board members. The payoff scheme should use non-monetary stakes—reputation tokens that determine who can serve on future boards, obligation cards that must be honored in later rounds, and a collective “city legitimacy” score that collapses if too many hidden exchanges are exposed—so that honoring private reciprocity and maintaining public legitimacy genuinely conflict.

  The rules must be arranged so that in round one students feel confident labeling moves as clean or corrupt, but by round three they discover that the same structural move—a petitioner drawing registered kinship credits to secure a variance—functions simultaneously as legitimate social reciprocity (visible, role-based, long-term) and as hidden exclusion of outsiders who lack such credits. The auditor role should have incomplete information, forcing students to decide whether to investigate based on pattern rather than proof, so they experience the epistemic problem of detecting corruption without collapsing all reciprocity into bribery.

  In the debrief, map specific moments onto conceptual distinctions: deviation from formal rules versus violation of role-based reciprocity norms; discrete quid-pro-quo versus continuous obligation; whether Mariká’s formal rules actually encode a different separation between public office and private social life than Western anti-corruption frameworks assume. Be explicit about what will predictably fail the first time: students often collapse all credit-drawing into bribery once they learn about hidden obligations, or the auditor becomes purely punitive and destroys the reciprocity dynamics. Provide in-the-moment corrections—pause after round two to ask whether the exchange was hidden or structurally embedded, and remind the auditor that legitimacy requires distinguishing exclusion from exchange.

  Finally, include an honest note on the feature this activity cannot reproduce: the macro-structural and historical question of whether clientelist systems stabilize democratic representation over decades, or whether they inevitably erode universal citizenship. Supply that limitation verbally after the debrief, clarifying that the game isolates the conceptual boundary problem but cannot model long-term institutional decay. Do not require advance reading of named theorists, and do not ask for bibliographies, citations, or reading lists; the philosophical problem should emerge from the rules and the forced choices.
reasoning: |-
  We are designing a 75-minute role-play for 16 upper-level students in political philosophy or comparative ethics. The goal is to explore the boundary between corruption and legitimate reciprocity in a fictional city-state called Mariká. The activity will center around a municipal planning board that uses "kinship credits" – a system of social obligations tied to family and neighborhood networks.

  ### Key Features to Model:
  1. **Tension Points**: The activity should highlight how exchanges can be:
     - **Visible** (transparent to the community) vs. **hidden** (known only to parties involved)
     - **Role-embedded** (aligned with social roles, e.g., community elder) vs. **free-floating** (disconnected from roles)
     - **Convertible into material advantage** (e.g., getting a permit) vs. **non-convertible** (e.g., social recognition)

  2. **Mechanics**:
     - **Three types of variances**:
       - Residential height (e.g., allowing an extra floor)
       - Commercial zoning (e.g., allowing a shop in a residential area)
       - Heritage demolition (e.g., tearing down a historic building for redevelopment)
     - **Token economy**:
       - **Reputation points**: Publicly visible, earned by acting in the community's interest, used to qualify for future board service.
       - **Future-obligation cards**: Private (known only to the holder and the giver), representing debts that must be repaid in future rounds. They can be traded but not made public unless an audit forces disclosure.
     - **Public audit mechanism**: Triggered by anonymous complaints from observers. If an audit is triggered, the board must reveal all hidden obligations related to the petition under scrutiny. Too many exposed hidden exchanges reduce the collective "city legitimacy" score.

  3. **Roles** (16 participants):
     - **4 Board Members**:
       - Elected Official (focus: political support, re-election)
       - Appointed Planner (focus: technical merit, city plan)
       - Community Elder (focus: social harmony, tradition)
       - Legal Auditor (focus: rule compliance, legitimacy)
     - **6 Petitioners**: Each has a formal application and a portfolio of kinship credits (registered with the board) and may have hidden private obligations (future-obligation cards) to one or more board members.
     - **6 Observers**: Each has partial information (e.g., they know some of the kinship credits or hidden obligations of a subset of players) and can file anonymous audit triggers. They also have a stake in the city legitimacy score.

  4. **Three Rounds**:
     - **Round 1 (20 mins)**: Only formal applications are visible. Board members vote on petitions based on formal criteria. Observers see only the public information. No kinship credits or hidden obligations are used. Goal: Establish baseline for "clean" decisions.
     - **Round 2 (20 mins)**: The kinship-credit registers are revealed. Petitioners can now draw on registered credits to influence decisions. Board members may feel social pressure to reciprocate. Observers see the credit system in action. Goal: Show how registered credits create a system of legitimate reciprocity.
     - **Round 3 (20 mins)**: Reveal which petitioners have undisclosed reciprocal debts (future-obligation cards) to board members. These debts are private and known only to the involved parties unless an audit is triggered. Goal: Create tension between honoring private obligations and maintaining public legitimacy.

  5. **Payoff Scheme**:
     - **Reputation tokens**: Awarded to board members for decisions that are seen as legitimate (by observers) and to petitioners whose requests are granted without triggering an audit. Reputation tokens are public and determine eligibility for future boards (in the game, this means they can be used to "win" a spot in a hypothetical next round).
     - **Future-obligation cards**: Create chains of reciprocity that must be honored in later rounds. If a board member fails to honor a debt, they lose reputation.
     - **City legitimacy score**: Starts at 10. Each exposed hidden exchange (via audit) reduces it by 2. If it drops to 0, the game ends and the city is deemed "corrupt" – all players lose.

  ### Setup:
  - **Materials**:
    - Role cards for each participant (describing their goals, constraints, and starting resources).
    - Petition cards (for each variance type, with specific details for each petitioner).
    - Kinship credit tokens (visible, colored tokens representing registered credits).
    - Future-obligation cards (private, sealed envelopes or hidden until revealed by audit).
    - Reputation tokens (public, can be physical chips).
    - A public board to track the city legitimacy score.
  - **Room Setup**: A table for the board members, with petitioners seated nearby. Observers sit in an outer circle. A facilitator (instructor) manages time and rules.

  ### Detailed Round Structure:

  #### **Round 1 (20 mins): Formal Process Only**
  - **Step 1 (5 mins)**: Petitioners submit formal applications (each has one petition) to the board. The applications are public. Board members review based on formal rules (provided on a handout). Observers take notes.
  - **Step 2 (10 mins)**: Board members discuss and vote. Each board member must state their reason for or against. The Legal Auditor ensures procedure is followed.
  - **Step 3 (5 mins)**: Outcomes announced. Reputation tokens awarded:
    - Board members: 1 token for each vote that aligns with the formal rules (as judged by the Legal Auditor and the rules handout).
    - Petitioners: 1 token if their petition is approved.

  #### **Round 2 (20 mins): Kinship Credits Introduced**
  - **Step 1 (5 mins)**: Before petitions are submitted, reveal the kinship-credit registers. Each petitioner has a set of registered credits (e.g., "5 credits with the Community Elder"). Board members see their own credit obligations. Petitioners can now "draw" credits to influence decisions (e.g., "I use 3 credits with the Appointed Planner to support my petition for a height variance").
  - **Step 2 (10 mins)**: Board members discuss and vote. They may feel obliged to reciprocate credits. Observers see the credit draws and can trigger an audit if they suspect hidden dealings (but note: in this round, there are no hidden obligations yet – only registered credits). However, observers don't know if there are hidden deals beyond the credits.
  - **Step 3 (5 mins)**: Outcomes announced. Reputation tokens awarded:
    - Board members: 1 token for each vote that is consistent with the kinship-credit system (i.e., reciprocating a credit draw is seen as legitimate) and doesn't trigger an audit. But if an audit is triggered and finds no hidden dealings, the observer who triggered it loses a reputation token (for false alarm).
    - Petitioners: 1 token if approved, plus they may gain future-obligation cards from board members if the board member feels the credit draw created a new debt (this is optional and private).

  #### **Round 3 (20 mins): Hidden Obligations Revealed (to involved parties)**
  - **Step 1 (5 mins)**: Reveal hidden future-obligation cards (via private notes to the involved board members and petitioners). For example, a petitioner might have a card that says "You owe the Elected Official a favor" from a prior round (if such a card was given in Round 2) or from pre-game setup. Now, board members are torn: honoring these hidden obligations might conflict with formal rules or kinship credits.
  - **Step 2 (10 mins)**: Petitioners can use both registered credits and call in hidden obligations (privately to the board member). Observers see only the registered credit draws and the public arguments. They may trigger audits if they see patterns (e.g., a board member always votes for a particular petitioner). If an audit is triggered, the hidden obligation must be revealed and the city legitimacy score drops by 2.
  - **Step 3 (5 mins)**: Outcomes announced. Reputation tokens awarded:
    - Board members: 1 token per vote that doesn't lead to an exposed hidden exchange. If an audit exposes a hidden exchange, the involved board member and petitioner lose 2 reputation tokens each.
    - City legitimacy score is updated publicly.

  ### Debrief (15 mins):
  1. **Map Moments to Concepts**:
     - Round 1: Clear-cut, formal rules. 
     - Round 2: Registered kinship credits – visible, role-embedded (community elder, family ties). Ask: Was this corruption or legitimate reciprocity?
     - Round 3: Hidden obligations – same structural move (using credits) but now with hidden deals. Ask: When does reciprocity become exclusionary? How did visibility and convertibility play out?
     - Highlight: In Round 3, a petitioner using registered credits might be simultaneously engaging in legitimate reciprocity (because it's visible and role-based) and hidden corruption (because they also have a hidden obligation to a board member that influenced the vote).

  2. **Conceptual Distinctions**:
     - Deviation from formal rules vs. violation of role-based reciprocity norms (e.g., in Mariká, kinship credits are formalized, but hidden obligations are not).
     - Discrete quid-pro-quo (e.g., a bribe) vs. continuous obligation (kinship credits are part of an ongoing relationship).
     - Compare to Western frameworks: In Mariká, public office and private social life are not fully separated. The formal rules encode a different boundary.

  3. **Predictable Failures and Corrections**:
     - After Round 2, pause and ask: "Was the exchange hidden? Or was it structurally embedded?" (Answer: It was visible and embedded, so not hidden corruption.)
     - In Round 3, remind the auditor: "Your role is to distinguish between exclusion (denying petitions to those without credits) and hidden exchanges. Not every use of credits is corrupt – the system allows it. But hidden deals that violate the rules are problematic."
     - Common failure: Students may collapse all credit-drawing into bribery once they learn about hidden obligations. Correct by noting that the registered credits are public and rule-bound, while hidden obligations are not.

  4. **Limitation Note**:
     - Verbally state: "This activity isolates the conceptual boundary problem but cannot model long-term institutional decay. We haven't addressed whether systems like Mariká's stabilize democratic representation over decades or erode universal citizenship."

  ### Role Descriptions (Examples):

  **Board Members**:
  - **Elected Official**: Goal: Get re-elected. You need support from petitioners (who represent voters). You start with 3 reputation tokens. You have kinship credits with 2 petitioners (pre-assigned).
  - **Appointed Planner**: Goal: Uphold the city master plan. You are technical and rule-bound. You start with 3 reputation tokens. You have kinship credits with 1 petitioner.
  - **Community Elder**: Goal: Maintain social harmony. You value kinship credits highly. You start with 4 reputation tokens (high status). You have kinship credits with 3 petitioners.
  - **Legal Auditor**: Goal: Ensure the city legitimacy score doesn't collapse. You can trigger an internal audit (without an observer complaint) but it costs 1 reputation token. You start with 3 reputation tokens.

  **Petitioners**:
  - Each has a specific petition (e.g., "Residential height variance to build an extra floor for my family").
  - Each has a set of registered kinship credits (e.g., 2 with the Community Elder, 1 with the Elected Official).
  - Some have hidden obligation cards (e.g., "You owe the Appointed Planner a favor" – only revealed in Round 3).

  **Observers**:
  - Each has a role card with partial information (e.g., "You know that Petitioner A has a hidden obligation to the Elected Official" – but this information is not public unless they trigger an audit). They can also see patterns (e.g., "The Appointed Planner always votes for Petitioner B").
  - They start with 2 reputation tokens and can gain more by triggering audits that expose corruption (but lose if they trigger a false alarm).

  ### Timing:
  - Setup and Rules Explanation: 10 mins
  - Round 1: 20 mins
  - Round 2: 20 mins
  - Round 3: 20 mins
  - Debrief: 15 mins
  Total: 75 mins.

  This design ensures that the tension emerges from the rules and the forced choices, without requiring prior reading. The philosophical problem of defining corruption versus reciprocity will arise naturally from the mechanics.
answer: |-
  ### **"Mariká Planning Board: Reciprocity vs. Corruption" Role-Play**  
  **(75 minutes; 16 participants)**  
  *Goal: Experience how "corruption" hinges on visibility, role-embeddedness, and convertibility—not universal rules.*

  ---

  #### **Setup (10 mins)**  
  **Materials**:  
  - Role cards (4 board members, 6 petitioners, 6 observers).  
  - **Petition types**:  
    - *Residential Height Variance* (e.g., "Add 4th floor for family expansion").  
    - *Commercial Zoning Variance* (e.g., "Open café in residential zone").  
    - *Heritage Demolition Variance* (e.g., "Replace heritage building with apartments").  
  - **Tokens**:  
    - *Reputation tokens* (public; determine future board eligibility).  
    - *Future-obligation cards* (private; e.g., "Owe favor to [Name]").  
  - **City Legitimacy Scoreboard** (starts at 10; collapses at ≤4).  
  - Anonymous audit complaint box.  

  **Roles**:  
  1. **Board Members**:  
     - *Elected Official*: Seeks voter support. Starts with 3 reputation tokens.  
     - *Appointed Planner*: Prioritizes technical rules. Starts with 4 reputation tokens.  
     - *Community Elder*: Upholds kinship norms. Starts with 5 kinship credits.  
     - *Legal Auditor*: Enforces audits. Can investigate anonymous complaints.  
  2. **Petitioners**: Each has:  
     - One variance request.  
     - Registered kinship credits (publicly visible in Round 2).  
     - Hidden future-obligation cards (revealed in Round 3; e.g., "Owe favor to Elder").  
  3. **Observers**: Each receives partial intel (e.g., "Petitioner 3 has 4 credits with Elder"). Can file anonymous audit complaints.  

  ---

  #### **Round 1: Formal Rules Only (15 mins)**  
  **Goal**: Establish baseline "clean" decisions.  
  - **Petitioners** submit applications (no kinship credits used).  
  - **Board** votes publicly. Members justify based on formal rules (e.g., "Height variance denied: violates density rules").  
  - **Observers** watch; no audits yet.  
  - **Outcomes**:  
    - Approved petitioners gain 1 reputation token.  
    - Board members gain 1 token per "rule-compliant" vote (Legal Auditor verifies).  
  *Debrief seed: "Why did this feel straightforward?"*  

  ---

  #### **Round 2: Kinship Credits Revealed (20 mins)**  
  **Goal**: Legitimate reciprocity emerges.  
  - **New mechanic**: Kinship credit registers become public (e.g., "Petitioner 2: 3 credits with Community Elder").  
  - **Petitioners** may "spend" credits to lobby:  
    - *Example*: "I use 2 credits with Elder to request heritage demolition variance."  
  - **Board** votes; kinship spending is visible. Members may reciprocate credits (e.g., Elder: "I approve due to social obligation").  
  - **Observers** may file anonymous complaints if patterns suggest impropriety (e.g., "Elder approved all credit-spenders").  
  - **Audits**: Legal Auditor investigates complaints. If abuse found, city legitimacy drops by 2.  
  - **Outcomes**:  
    - Petitioners gain obligation cards from board if credits secured approval.  
    - Observers lose 1 token for false complaints; gain 1 if complaint upheld.  
  *Pause after vote: "Was this corruption? Why/why not? Focus on visibility and roles."*  

  ---

  #### **Round 3: Hidden Obligations Revealed (20 mins)**  
  **Goal**: Tension between reciprocity and corruption peaks.  
  - **New mechanic**: Hidden obligation cards revealed privately (e.g., Petitioner 2 *also* holds "Owe favor to Elected Official" card).  
  - **Petitioners** may use registered credits **or** call in hidden obligations (whispered requests).  
  - **Board** conflicted: Honor hidden debts (e.g., Elected Official approves despite weak credits) or uphold public rules?  
  - **Observers** see credit use but not hidden deals; may file complaints based on discrepancies (e.g., "Planner approved petition with low credits").  
  - **Audits**: If triggered, hidden obligations are exposed, city legitimacy drops by 2.  
  - **Payoffs**:  
    - Board members lose 2 tokens if exposed honoring hidden obligations.  
    - Collective loss if legitimacy collapses (all lose 3 tokens).  
  *Key tension: Same credit-spending act is now both (a) legitimate role-embedded reciprocity and (b) hidden exclusion of outsiders.*  

  ---

  #### **Debrief (15 mins)**  
  **Concept Mapping**:  
  1. **Visibility vs. Hiddenness**:  
     - *Round 2*: Credits were public and role-embedded (Elder’s approval = legitimate).  
     - *Round 3*: Hidden obligations made identical acts feel corrupt.  
  2. **Reciprocity vs. Bribery**:  
     - Kinship credits = continuous, socially embedded obligations.  
     - Hidden favors = discrete quid-pro-quo resembling bribery.  
  3. **Cultural Frames**:  
     - "Mariká’s rules formalize kinship as public. Western frames see this as corruption. Where should the line be?"  
     - "Did ‘corruption’ occur when outsiders were excluded, even if rules were followed?"  

  **Predictable Failures & Corrections**:  
  - **Failure**: Students conflate all credit use with bribery after Round 3.  
    - *Correction*: "In Round 2, was Elder’s approval corrupt? Why did visibility matter?"  
  - **Failure**: Legal Auditor punishes all reciprocity.  
    - *Correction*: "Does investigating every credit-use collapse the system? How might audits distinguish exclusion from exchange?"  

  **Honest Limitation**:  
  > "This game isolates how individuals navigate reciprocity within rules, but it **cannot model macro-historical dynamics**. We haven’t answered whether systems like Mariká’s erode citizenship over decades or stabilize representation in certain contexts. That requires historical analysis beyond role-play."  

  ---

  #### **Design Notes**  
  - **No Theorists Named**: Concepts emerge organically from mechanics (e.g., "role-embeddedness" from Elder’s actions).  
  - **Stakes**: Reputation tokens and legitimacy scores create real tension between private reciprocity and public trust.  
  - **Observer Role**: Partial information forces epistemic uncertainty (e.g., "Do I audit based on a pattern?").  
  - **Facilitator Tips**:  
    - Emphasize *Mariká’s rules* as legitimate in-world.  
    - If legitimacy collapses early, use it to discuss systemic fragility.  
    - Highlight moments where identical acts "flipped" from clean to corrupt.  

  **Outcome**: Students confront how cultural frameworks, visibility, and social embeddedness define corruption—not abstract rules.
