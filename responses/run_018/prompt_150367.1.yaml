answer: |-
  Here’s a practical, philosophy-grounded procedure for your copy-editor, designed for speed and clarity, using British English and acknowledging its limits:

  **Procedure: Orwellian Obfuscation Audit (30-Minute Chapter Scan)**

  **Philosophical Grounding:** Draws on J.L. Austin (speech acts, performative language), Grice (conversational implicature), and critical discourse analysis (Fairclough, van Dijk). Focuses on **reference failure** (who/what?), **agency deletion** (who did it?), and **euphemistic drift** (using abstract terms that distance actions from their moral consequences, even when original metaphors are "dead").

  ---

  **Step 1: Measure Semantic Fog Density (Quick Scan)**
  *   **Action:** Skim the flagged sentence. Count:
      *   Concrete verbs (actions with a clear, physical agent: *builds, hit, cried, fired*).
      *   Abstract nouns (concepts, processes, states: *development, situation, consideration, implementation, outcome*).
  *   **Threshold:** **Ratio > 1:1** (More abstract nouns than concrete verbs) triggers Step 2. *Ratio ≤ 1:1* likely **Passes** unless other issues (check favourite lines manually).
  *   **Why?** High abstraction density obscures concrete reality (reference failure).

  **Step 2: Check for Agent Deletion (The "Who?")**
  *   **Action:** Identify the main action/event in the sentence. Ask: "WHO or WHAT performed this action?"
  *   **Passive Voice:** Obvious culprit (e.g., "Mistakes were made").
  *   **Nominalisation:** Turning verbs into nouns hides the actor (e.g., "The decision was taken" vs. "The Minister decided").
  *   **Abstract Actors:** When the subject is an abstraction (e.g., "Policy requires...", "Circumstances dictated...").
  *   **Threshold:** If the **specific human actor(s) responsible** is **absent or replaced by an abstraction**, trigger Step 3. If the actor is **clear and concrete**, likely **Passes** (even if abstract nouns are present elsewhere).

  **Step 3: Moral Weight Substitution Test (The "So What?")**
  *   **Action:** Mentally rewrite the sentence:
      1.  Insert the **most likely specific human actor(s)** (e.g., "The Minister", "The Government", "Council Officials", "Our Soldiers").
      2.  Replace **key abstract nouns with concrete verbs/actions** where possible (e.g., "implementation failure" -> "failed to build").
      3.  Use **active voice**.
  *   **Ask:** Does this rewrite:
      *   **a) Significantly increase the perceived blame, responsibility, or cruelty?**
      *   **b) Make the claim feel more direct, visceral, or uncomfortable?**
      *   **c) Expose a potential euphemism (even a 'dead' one)?**
  *   **Threshold:** If **a, b, or c is YES**, the original sentence likely achieves the Orwellian effect. Flag as **"Intentional - Keep"**. If **NO**, or if the rewrite significantly alters the *factual* meaning, flag **"Rewrite"** (it's likely just poor writing). **If UNSURE**, or context demands the abstraction *for narrative/dramatic irony*, proceed to Step 4.

  **Step 4: Context & Judgement Call (The Editor's Prerogative)**
  *   **Action:** Consider:
      *   **Character Voice:** Is this *exactly* how this minister *would* speak? Does it ring true?
      *   **Narrative Purpose:** Is the surrounding text clearly *critiquing* this language, or is the meaning ambiguous?
      *   **Euphemistic Charge:** Does the abstract term *feel* like it's softening a blow, even if its origin is forgotten (e.g., "collateral damage" still sanitises; "downsizing" still hides agency)? Trust gut feeling here.
      *   **Clarity vs. Effect:** Is the sentence *so* foggy it loses all meaning, even for the character? If yes, **Rewrite**.
  *   **Threshold:** Apply editorial judgement. Default to **"Intentional - Keep"** if Step 3 was *almost* YES or character/narrative strongly supports it. Default to **"Rewrite"** if genuinely ambiguous or impenetrable.

  ---

  **Test Sentences & Worked Examples**

  1.  **Clear Pass (Orwellian Intentional)**
      *   **Original:** "Regrettably, a cessation of vital infrastructure maintenance occurred, culminating in an unforeseen structural compromise event."
      *   **Step 1:** Fog Density: 5 abstract nouns (cessation, maintenance, infrastructure, compromise, event) / 1 weak verb (occurred). Ratio 5:1 -> **Flag Step 2**.
      *   **Step 2:** Action: Stopping maintenance → leading to collapse. Agents? Absent. "Cessation occurred" is nominalisation + passive abstraction. **Flag Step 3**.
      *   **Step 3:** Rewrite: "*We* stopped maintaining the dam, *we* knew it was vital, and *our neglect* caused it to collapse." Moral Weight? **YES** (Explicit blame/cruelty). **VERDICT: Intentional - Keep.** Perfect ministerial evasion.

  2.  **Clear Fail (Just Bad Writing - Rewrite)**
      *   **Original:** "The facilitation of dialogue pertaining to community concerns experienced a temporal disruption due to logistical considerations."
      *   **Step 1:** Fog Density: 5+ abstract nouns (facilitation, dialogue, concerns, disruption, considerations) / 1 weak verb (experienced). Ratio 5:1 -> **Flag Step 2**.
      *   **Step 2:** Action: Talking was delayed. Agents? Absent. Abstract subject ("Facilitation... experienced"). **Flag Step 3**.
      *   **Step 3:** Rewrite: "*Council officials* cancelled the meeting about residents' complaints because *they* forgot to book the room." Moral Weight? **NO** (It's just mundane incompetence, not cruelty). The abstraction adds *nothing* but fog. **VERDICT: Rewrite** (e.g., "The council meeting about residents' complaints was cancelled due to an admin error.").

  3.  **Your Favourite Line (Contentious - Likely Keep, but Judgement Needed)**
      *   **Original:** "The necessary reallocation of resources precipitated a period of unavoidable demographic adjustment."
      *   **Step 1:** Fog Density: 4 abstract nouns (reallocation, resources, period, adjustment) / 1 verb (precipitated). Ratio 4:1 -> **Flag Step 2**.
      *   **Step 2:** Action: Moving money/people → causing displacement. Agents? Absent ("reallocation precipitated"). **Flag Step 3**.
      *   **Step 3:** Rewrite: "*The Minister* cut funding for the housing programme, forcing *hundreds of families* out of their homes." Moral Weight? **YES** (Exposes cruelty as administrative decision). **BUT...** Step 4 Needed! Why?
          *   *Character/Narrative:* If the minister *is* this chillingly bureaucratic, it's perfect. If the context makes the suffering clear, the euphemism is potent.
          *   *Euphemistic Charge:* "Demographic adjustment" is a classic, charged euphemism for forced displacement, even if the metaphor is "dead".
          *   *Clarity:* The core meaning ("funding cuts forced people to move") *is* retrievable through the fog, which is the point.
      *   **VERDICT (via Step 4):** **Intentional - Keep.** It’s a prime example of administrative cruelty. The editor might note *why* it passes judgement for discussion, but shouldn't axe it.

  **Where the Procedure Breaks Down & Requires Judgement:**

  1.  **True Technical/Procedural Language:** Sometimes complex systems genuinely require abstract nouns (e.g., "Voltage regulation failed"). Context is key – is it *about* humans making decisions affecting humans?
  2.  **Stylistic Choice vs. Obfuscation:** A single evocative abstraction for atmosphere might be fine ("A pall of despair settled"). Does it *hide* agency for a political/social purpose? If not, it might pass.
  3.  **Irony & Unreliable Narration:** If the *narrative voice* is clearly mocking the minister's language *around* the quote, the quoted text might be kept even if dense, as the critique is external. The procedure focuses *inside* the quoted speech.
  4.  **"Dead" Metaphors with Residual Charge:** As your friend noted, terms like "liquidation" or "pacification" retain horrific weight despite familiarity. The editor must feel this charge. Step 3 (Moral Weight test) catches this.
  5.  **Ambiguous Agency:** Sometimes responsibility *is* genuinely diffuse (e.g., systemic failures). The test asks if the language *unreasonably* obscures *identifiable* actors who *could* be named.

  **Copy-Editor Cheat Sheet (Bullet Points for Speed):**

  1.  **Foggy?** (More abstract nouns than concrete verbs?) → **Check WHO did it.**
  2.  **WHO Missing?** (No clear human actor, just passives/abstractions?) → **Rewrite mentally: Insert WHO + Concrete Action.**
  3.  **More Awkward/Blameworthy now?** YES → **INTENTIONAL - KEEP.** NO → **REWRITE.**
  4.  **Unsure?** Is it *perfect* for the character? Does the abstraction *feel* like a euphemism? Does the context make the critique clear? → **Lean towards KEEP if intentional effect likely.** If genuinely unclear → **REWRITE.**

  This equips your editor to efficiently distinguish between **deliberate, powerful linguistic critique** (Orwell's "defence of the indefensible") and **unintentional, muddy prose**, while respecting the nuance required for your favourite, morally charged euphemisms. The key is recognising that obscuring agency isn't just bad style; it's a specific linguistic *act* with philosophical and political weight. Good luck with the minister – may his abstractions be perfectly judged!
