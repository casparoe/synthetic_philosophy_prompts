prompt: |-
  I've been wrestling with this chapter where a minister explains away a disaster using only passive verbs and abstract nouns, and I want to make sure I'm actually using the mechanism Orwell talked about — the way political langauge hides responsibility and makes cruelty sound administrative — rather than just writing badly on purpose. Could you turn that Orwellian principle into a practical procedure my copy-editor can follow? She's quick, has about thirty minutes per chapter, and needs to sign off on every flagged line with either 'rewrite' or 'intentional — keep'. I want a flowchart-in-words: start by measuring what my friend calls 'semantic fog density', the ratio of abstract nouns to concrete verbs in the sentence, then check for agent deletion, then test whether substituting a specific actor changes the moral weight of the claim. Include a small set of test sentences she can apply in order, with worked examples for each kind — one clear pass, one clear fail, and especially one where the procedure demands a rewrite but it's actually my favourite line in the whole book and I'll be furious if it goes. Ground the distinctions in whatever philosophy of language actually knows about reference, agency, and euphemism, not just Orwell's own examples, and be honest about where the procedure just breaks down and she has to use judgement instead of ticking boxes. Also please write the answer in British English — American spelling always creeps into my drafts and I can't stand it. I was discussing this with my friend over coffee yesterday and she mentioned something about dead metaphors still looking charged, which made me think this whole thing might be refering to something deeper about how we avoid naming the doer.
