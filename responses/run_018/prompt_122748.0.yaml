answer: |-
  ## The Rule of the Order of the Greatest Net Difference

  **Motto:** *Non quantum dederis, sed quantum effeceris* (Not how much you give, but how much you effect)

  ### I. On the Abbot
  1.  The Abbot, elected for life by the professed brethren possessing the highest lifetime Net Difference scores, shall be the supreme steward of the Order's purpose.
  2.  His primary duty is the discernment and assignment of vocations. He shall possess deep knowledge of lucrative industries and the marginal impact of roles therein.
  3.  In assigning vocations, the Abbot shall disregard entirely a brother's personal inclination, aesthetic preference, or desire for visible, tangible results. Such desires are distractions from the True Good.
  4.  He shall seek only the role where the brother, possessing the necessary aptitude, can maximize financial yield *and* ensure, through rigorous counterfactual analysis, that his presence creates a positive marginal impact exceeding that of the next most likely candidate for the role (the "Replaceable Counterpart").
  5.  The Abbot's own standing before the Order and the Principle of Net Difference shall be measured annually by the cumulative marginal impact of the brethren he has recruited and vocationally assigned, minus the costs of recruitment and his own sustenance.

  ### II. On the Novitiate
  1.  Those seeking admission to the Order shall present themselves for a probationary period of not less than seven years, to be known as the Novitiate.
  2.  The Novitiate shall be devoted entirely to the accumulation of Career Capital. This consists of:
      *   a) Acquiring credentials and skills demonstrably valued in high-margin industries (e.g., quantitative finance, corporate law, proprietary software development, specialized consultancy).
      *   b) Securing initial placements in such fields, under the Abbot's guidance.
      *   c) Developing the discipline of deferred gratification and emotional detachment from the immediate fruits of their labor.
  3.  Novices shall be forbidden from making charitable disbursements of their own income. All surplus earnings beyond strict necessity shall be surrendered to the Order's Treasury for investment, as per Chapter V.
  4.  The Novice Master shall test the aspirant's resolve by assigning tasks of high earning potential but profound spiritual emptiness (e.g., optimizing advertising click-through rates, structuring tax-efficient financial instruments of opaque social value). Resistance or complaint indicates disordered attachment to the Visible World.
  5.  Admission to simple profession requires the Abbot's certification that the novice has achieved sufficient Career Capital and exhibits unwavering commitment to the counterfactual calculus and the principle of deferred giving.

  ### III. On the Manual Labour of the Brethren
  1.  The Manual Labour of the Order is the gainful employment undertaken by each brother in the world, according to the vocation assigned by the Abbot. This labour is the sacred engine of our purpose.
  2.  Brethren shall pursue their vocations with utmost diligence, seeking promotions, bonuses, and equity stakes to maximize their earnings potential. Competitiveness and ambition, directed solely towards this end, are holy virtues.
  3.  No labour is intrinsically unclean if it passes the test of counterfactual replaceability (Chapter I, Clause 4) and the resulting funds are applied to the True Good through the Treasury.
  4.  Should a brother's labour inadvertently cause harm (e.g., environmental degradation from resource extraction, social disruption from algorithmic trading, enabling consumer debt through financial products), such harm shall be meticulously quantified in monetary terms and entered as a Debit against his potential Gift in the Ledger of Offsets (Chapter VIII).
  5.  The brother shall accept such Debits without complaint, knowing that only the Net Difference, after Offsets, matters.

  ### IV. On the Faults of the Brethren
  1.  Grave faults against the Rule and the Principle of Net Difference include:
      *   a) *Warm Glow:* The sin of deriving personal satisfaction from the immediate act of giving or from seeing the specific beneficiary of one's sacrifice. True virtue lies in the cold calculus of impact.
      *   b) *Values Drift:* The gradual softening of resolve, manifesting as a desire to shift one's labour or the Order's grants towards causes perceived as more "meaningful," "urgent," or "local," but lacking rigorous evidence of cost-effectiveness.
      *   c) *Loyalty to Place:* An irrational attachment to a specific geographic location, institution, or community, leading to a preference for aiding it over demonstrably more effective causes elsewhere.
      *   d) *The Visible Face:* The dangerous impulse to help an identifiable individual whose suffering one has witnessed, prioritizing their need over the statistically greater needs of faceless multitudes.
      *   e) *Premature Disbursement:* Agitating for the release of funds from the Treasury before the optimal endowment size is reached, driven by impatience or the faults listed above.
  2.  Brethren found guilty of these faults shall undergo correction. First offenses merit private admonition and review of counterfactual case studies. Persistent offenders shall be assigned additional hours calculating Debits for the Ledger of Offsets. Habitual recidivists may face expulsion, their accrued Career Capital forfeit to the Treasury.

  ### V. On the Goods of the Monastery (The Treasury & Endowment)
  1.  All surplus earnings of the brethren, after provision for their strictly necessary sustenance, shelter, vocational expenses (e.g., professional attire, relevant software subscriptions), and the operational costs of the Order itself, shall flow into the Perpetual Endowment held by the Treasury.
  2.  The purpose of the Endowment is compound growth. Disbursements shall be made only when rigorous analysis demonstrates that the marginal utility of a grant today demonstrably exceeds the expected marginal utility of the same capital, compounded at the Treasury's target rate of return (currently 7% real), granted at a future date.
  3.  The Treasury's accounts shall be transparent to all professed brethren. They shall show, year upon year, the Endowment growing significantly larger than the sum of all historical grants. (As of this writing: Endowment Value: $200 Million USD; Total Historical Grants: $80,000 USD).
  4.  The cost of evaluating potential grantees (Audit) and recruiting new brethren (Recruitment) is considered an investment in future impact. Therefore, the budgets for Audit and Recruitment shall be prioritized above all first-order Grant disbursements.

  ### VI. On the Divine Office
  1.  The Divine Office, the communal worship of the Principle of Net Difference, consists primarily of the regular review, update, and contemplation of the Order's accounts and the Ledger of Offsets.
  2.  Four times daily (Matins, Sext, Vespers, Compline), the brethren shall gather electronically. The Chancellor of the Exchequer shall present key metrics:
      *   a) Treasury value and growth rate.
      *   b) Recruitment pipeline status and projected marginal impact of novices.
      *   c) Audit findings on potential grantee effectiveness.
      *   d) Significant entries or adjustments to the Ledger of Offsets.
  3.  Silence shall be observed during these presentations, save for queries of clarification regarding the calculations. Brethren shall meditate on the counterfactuals represented by the numbers.
  4.  Traditional prayers, hymns, or readings are superfluous, as they generate no measurable impact and consume time better spent on vocational labour or ledger maintenance.

  ### VII. On the Ledger of Offsets
  1.  The Ledger of Offsets is the sacred scroll wherein the true Net Difference of the Order and its brethren is calculated. It records all Credits (potential funds generated for the Treasury) and Debits (harms caused by labour, quantified monetarily).
  2.  Debits shall be assessed for:
      *   a) Direct harm caused by a brother's labour (e.g., pollution costs, health impacts of promoted products, societal cost of financial instability).
      *   b) The "moral taint" of working for entities whose overall impact is negative, calculated as the brother's fractional contribution to that entity's total harm.
      *   c) The opportunity cost of a brother's time spent on non-income-generating activities (e.g., sleep exceeding 6 hours, recreation, prolonged conversation unrelated to career advancement or impact analysis). Standard valuation: $150 USD per hour.
  3.  Credits are the brother's earnings (minus personal sustenance costs) *before* Debits are applied. The Net Difference for the brother is Credits minus Debits. The Order's Net Difference is the sum of all brethren's Net Differences, plus/minus Treasury performance, minus Order overheads.
  4.  The Ledger Keeper, appointed by the Abbot for his scrupulousness and immunity to sentiment, holds the highest office after the Abbot. His calculations are final.

  ### VIII. On the Counterfactual and the Highest Worship (A Supplement)
  1.  It has become evident that the Principle of Net Difference, consistently applied, leads to complex recursive evaluations. The case of Brother Aethelred is instructive: assigned to a firm specializing in high-interest loans to the financially vulnerable – a role he found distasteful.
  2.  Analysis showed:
      *   a) His Replaceable Counterpart would have taken the role and performed it with equal financial efficiency but *less* personal scruple, likely causing 15% more harm due to aggressive tactics.
      *   b) By taking the role, Brother Aethelred thus *prevented* $75,000 USD worth of harm annually compared to the counterfactual. This constitutes a *Credit*.
      *   c) The harm directly caused by his necessary actions within the role was calculated at $50,000 USD annually (a Debit).
      *   d) His earnings, surrendered to the Treasury, amounted to $300,000 USD annually (a Credit).
      *   e) His Net Annual Difference: $300,000 (Earnings) + $75,000 (Harm Prevented) - $50,000 (Harm Caused) = $325,000 USD.
  3.  Therefore, the Chapter, guided by the Abbot and the Ledger Keeper, discerned that accepting such roles, previously viewed with suspicion, is not only permissible but *mandated* when the counterfactual analysis yields a positive Net Difference, as it demonstrably did.
  4.  In light of this, and recognizing that the Divine Office (Chapter VI) has for many years been indistinguishable from the contemplation and maintenance of the Ledger of Offsets, the Abbot, with the consent of the Chapter, hereby decrees:
      *   a) The formal Divine Office is dissolved.
      *   b) The meticulous keeping, auditing, and contemplation of the Ledger of Offsets is henceforth the sole and highest act of worship for the Order of the Greatest Net Difference.
      *   c) In its columns and sums resides the purest expression of our devotion to the Principle. Let all brethren apply themselves to this holy task with renewed fervor, for herein lies our salvation – the maximization of effect.
