answer: |-
  Below is a reusable decision procedure grounded in the philosophy of vagueness, structured as a flowchart in words. It simplifies theoretical concepts (epistemicism, supervaluationism, sorites, margin-for-error) into an ordered sequence of tests. Key simplifications are noted at relevant steps, with defenses for usability. The procedure explicitly flags where judgment is unavoidable, where misfires are likely, and where values-based overrides may be needed.

  ---

  ### **Decision Procedure Flowchart**  
  *Apply questions in order; stop when a determination is reached. Use written case file only.*

  1. **Question 1: Is the conduct *objectively severe*?**  
     - *Sufficient answer:* Physical threats, targeted harassment, or explicit intimidation (e.g., stalking, overt aggression).  
     - YES → **Stop: Positive determination** (substantial disruption).  
     - NO → Proceed to Q2.  
     - *Judgment/misfire flag:* Relies on adjudicator’s grasp of "objective severity." Likely misfire if cultural/contextual norms are misapplied.  
     - *Simplification:* Higher-order vagueness (e.g., "Is 'threat' vague?") ignored. *Defense:* Efficiency; severe cases are rare and require swift action.  

  2. **Question 2: Is the conduct *clearly innocuous*?**  
     - *Sufficient answer:* Single minor incident with no measurable impact (e.g., one awkward comment, isolated scheduling error).  
     - YES → **Stop: Negative determination** (not substantial disruption).  
     - NO → Proceed to Q3.  
     - *Judgment/misfire flag:* Risk of underestimating cumulative harm. Uses supervaluationist "clear cases" to filter obvious non-disruptions.  

  3. **Question 3: Does *margin-for-error* confirm safety?**  
     - *Sufficient answer:* Conduct is far from the "disruption" boundary even under worst-case interpretation (e.g., two low-severity incidents with no escalation).  
     - YES → **Stop: Negative determination**.  
     - NO → Proceed to Q4.  
     - *Judgment/misfire flag:* Epistemicist "unknown cutoff" simplified to a buffer zone. Misfire if adjudicator misjudges "safety" due to bias.  

  4. **Question 4: Is there a *sorites series* with *aggregate harm*?**  
     - *Sufficient answer:* Multiple similar acts (≥3) causing cumulative impact (e.g., repeated interruptions degrading academic performance).  
     - YES → Proceed to Q5.  
     - NO → **Stop: Negative determination**.  
     - *Judgment/misfire flag:* Sorites "heap" paradox addressed via aggregation. Misfire if minor acts are overvalued.  

  5. **Question 5: Is the conduct *admissibly disruptive* under all *precisifications*?**  
     - *Sufficient answer:* Conduct would be deemed disruptive in all reasonable interpretations of "substantial" (e.g., persistent exclusion from group work).  
     - YES → **Stop: Positive determination**.  
     - NO → **Hand-off to human judgment** (values conflict).  
     - *Judgment/misfire flag:* Supervaluationist "gaps" trigger hand-off. Misfire if adjudicator imposes personal values.  
     - *Simplification:* Exact epistemicist boundary location ignored. *Defense:* Determinable via community standards, not metaphysics.  

  ---

  ### **Application to Hypothetical Cases**  

  **Case 1: Seven Workspace Alterations**  
  - **Q1:** Not objectively severe (preference-based reasons). → NO.  
  - **Q2:** Not clearly innocuous (cumulative pattern alleged). → NO.  
  - **Q3:** Not safe under margin-for-error (seven acts near boundary). → NO.  
  - **Q4:** Sorites series exists (seven similar acts). Aggregate harm? If workspace changes caused documented stress/time loss → YES.  
  - **Q5:** Admissibly disruptive? If all reasonable interpretations deem seven alterations excessive → YES.  
  - **Outcome:** Positive determination.  
  - *Procedure handling:* Aggregation resolved at Q4 (sorites chain becomes "heap" via cumulative impact). Values-based hand-off avoided if harm is factual (e.g., missed deadlines).  

  **Case 2: Three Instances of "Repeated" Behavior**  
  - **Q1:** Not severe. → NO.  
  - **Q2:** Not innocuous (repeated). → NO.  
  - **Q3:** Margin-for-error: Three acts *might* be safe if low-severity (e.g., vague comments). → **YES** (if no escalation/impact).  
  - **Outcome:** Negative determination.  
  - *Procedure handling:* "Repeated" simplified to threshold of ≥3 + impact at Q4. Here, Q3 short-circuits to negative due to safety buffer. Hand-off not triggered; judgment based on absence of harm.  

  **Case 3: Complainant-Unfriendly Outcome (Case 2 Variant)**  
  - **Petition:** Three instances of interrupting complainant in class (charter lists "repeated interruptions" as disruptive example).  
  - **Q1:** Not severe. → NO.  
  - **Q2:** Not innocuous. → NO.  
  - **Q3:** Margin-for-error → **YES** (interruptions brief, no academic impact per file).  
  - **Outcome:** Negative determination.  
  - **Why mandated:** Epistemicist "safety" (Q3) overrides sorites aggregation (Q4) due to lack of measurable harm. Complainant may object, but procedure prioritizes avoiding false positives near boundaries.  
  - **Values-based override point:** Adjudicator could **hand-off at Q5** if they reject Q3’s "safety" (e.g., arguing *any* interruption in academic settings is inherently disruptive). Procedure does not authorize override, but human judgment at Q5 allows values to dominate.  

  ---

  ### **Limitations and Suspension Conditions**  
  - **What the procedure cannot settle:**  
    - Nested vaguenesses (e.g., "unwelcome" embedded in "disruption"). These create permanent instability at Q2/Q5.  
    - Context-dependent harms (e.g., neurodivergent sensitivities) if undocumented.  
    - Cases requiring moral reasoning (e.g., "Is humiliation *always_ disruptive?").  
  - **Suspend the procedure if:**  
    - Facts are contested (e.g., he-said/she-shaid without evidence).  
    - Legal/ethical complexity arises (e.g., discrimination, mental health crises).  
    - Nested vagueness paralyzes judgment (e.g., unclear if conduct was "unwelcome" *and* "disruptive").  
  - **Unavoidable instability:** Q5 (supervaluationist gap) is perpetually vulnerable to higher-order vagueness. Simplified by forcing hand-off to human deliberation.  

  The procedure balances philosophical rigor with operational speed, using clear thresholds to contain vagueness. It requires no legal training and runs in ~20 minutes. Memorize the 5-question sequence, with Q3/Q5 as key failure points for values intervention.
