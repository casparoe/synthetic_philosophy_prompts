  Your predictive-processing reframing commits a category error of the first order. Smith’s spectator *is* irreducibly normative because it emerges from—and continually adjudicates against—the lived fabric of social judgment, not a solipsistic cognitive algorithm. When Smith speaks of correcting sentiments "by the standard of the conduct of others," he anchors normativity in communal praxis: the spectator’s authority derives precisely from its social genealogy as the internalized *voice of mankind* (TMS III.2.32). Your mechanistic "hierarchical prior" reduces this to a subpersonal calibration signal, evacuating the spectator’s function as a *deliberative tribunal* that asks what an impartial other *ought* to feel—not what neural machinery *does* compute. Smith’s spectator condemns us for affective misalignment even when our prediction error is minimized (e.g., TMS I.i.3.3 on disproportionate grief), proving its standard transcends homeostasis. Framing moral judgment as Bayesian updating confuses causal psychology with justificatory grounds—a conflation Smith’s entire project resists.  

