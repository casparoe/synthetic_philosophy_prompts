answer: |-
  You've identified a profound and disturbing phenomenon that aligns closely with Hannah Arendt's analysis, though the specific term you seek isn't one she explicitly coined as a standalone concept. The closest established concept derived from Arendt is **the "modern lie" functioning as a "loyalty test"** within a framework of **"organized lying" aimed at destroying shared reality.**

  Here's a breakdown of how Arendt's ideas apply, how this differs from other concepts, and what's settled vs. contested:

  1.  **The Core Concept (Settled Arendt):**
      *   **Organized Lying & Destroying Shared Reality:** Arendt (*Truth and Politics*, *Origins of Totalitarianism*) argued that modern totalitarian regimes (especially Nazism, her primary case study) didn't just lie to deceive or hide truth, but engaged in **systematic, organized lying**. The goal wasn't primarily to convince others of an alternative fact, but to **destroy the very idea of factual truth and shared reality**.
      *   **The Modern Lie & Loyalty Test:** She specifically identified the phenomenon you describe: "**The modern political lies deal efficiently with things that are not secrets at all but are known to practically everybody.**" (*Truth and Politics*). The lie's *obvious* falsity is crucial. Its repetition becomes:
          *   **A Loyalty Test:** Adherence to the lie signifies loyalty to the movement or leader, overriding any commitment to objective reality or personal judgment. Saying the obviously untrue thing proves you belong.
          *   **A Sign of Commitment:** It demonstrates willingness to subordinate reality itself to the ideology or the leader's will.
          *   **A Means of Organization & Control:** By forcing followers to parrot absurdities, the movement breaks their connection to the world as it is, making them more pliable and dependent on the movement's internal "logic."
      *   **Function over Persuasion:** The lie isn't primarily meant to convince outsiders (though some may fall for it) or even to fully convince the faithful of its literal truth. Its power lies in its *performance* and the *social function* it serves within the group.

  2.  **How it Differs from Ordinary Propaganda and Cynicism:**
      *   **Propaganda:** Traditional propaganda aims to *persuade* an audience (internal or external) of a specific narrative, often using selective truths, exaggerations, or outright falsehoods. It generally *cares* about credibility and works best when its falsehoods aren't blatantly obvious. The goal is belief and action based on that belief. Your example is *not* primarily about persuasion.
      *   **Cynicism:** Cynicism involves a *disbelief* in truth, motives, or the possibility of good outcomes. A cynical person might dismiss *all* claims as lies or manipulations. However, in the phenomenon you describe:
          *   **Supporters aren't necessarily cynical:** They often display fervent *belief* in the *significance* of the lie and the movement it represents, even if they know it's factually shaky. Their commitment is to the group identity signaled by the lie.
          *   **The lie itself is active, not passive:** Cynicism is an attitude; this is an *active performance* that structures political engagement and group cohesion. Cynics might laugh or withdraw; these supporters actively participate and enforce the lie.
          *   **The Transparency:** The *openness* of the lie is central to its function as a loyalty test in a way it isn't in simple cynicism or traditional propaganda that tries to hide its falsehoods.

  3.  **Settled Aspects of Arendt's View:**
      *   Arendt identified systematic, organized political lying as a defining feature of *totalitarian* regimes (Nazi Germany, Stalinist USSR).
      *   She argued this lying aimed fundamentally at destroying factual reality and the human capacity for judgment and experience.
      *   She specifically described the use of blatant, obvious lies ("modern lies") as loyalty tests and signs of commitment within these regimes.
      *   She saw this as distinct from traditional lies motivated by self-interest or deception, emphasizing its ideological and organizational function.
      *   She linked the destruction of factual truth to the destruction of political freedom, as a shared reality is essential for meaningful public discourse and action.

  4.  **Genuinely Contested Aspects of Arendt's View:**
      *   **Specificity to Totalitarianism:** This is the *major* debate. Arendt analyzed this primarily within *totalitarian* contexts. Scholars vigorously contest:
          *   **Does this phenomenon *only* occur in totalitarian systems?** Or is it a potential pathology of other political forms (like illiberal democracies, polarized democracies, or even within factions in healthy democracies)? Many argue (drawing on her insights) that the dynamics she described *can* emerge outside strict totalitarianism, especially in contexts of extreme polarization and identity politics.
          *   **Is it driven *only* by ideology?** Arendt emphasized the ideological drive to remake reality. Critics argue that in contemporary politics, this tactic might be driven more by raw political opportunism, media dynamics, or tribal identity politics than by a coherent totalitarian ideology, while still utilizing similar mechanisms.
      *   **The Role of Media:** Arendt wrote before the digital age. Applying her analysis requires interpreting how social media, fragmented information ecosystems, and disinformation campaigns amplify or alter the dynamics she described. Is the "firehose of falsehood" a new technique, or just a technologically supercharged version of organized lying?
      *   **Motivation & Agency:** Arendt sometimes portrayed the lie as an almost impersonal force of the totalitarian system. Contemporary analyses often focus more on the strategic choices of specific actors (leaders, media figures) in employing these tactics for power and cohesion within their base.
      *   **Naming:** Arendt didn't give this *specific variant* (the open, known lie as a loyalty test) a catchy standalone name beyond "the modern lie" functioning as a loyalty test within "organized lying." Later scholars have used terms like "performative lying," "allegiance-signaling lies," or "epistemic loyalty tests," but none are universally established canonical terms derived *solely* from Arendt. Some link it to concepts like **"post-truth"** (where emotion and identity trump objective facts) or Harry Frankfurt's **"bullshit"** (speech indifferent to truth), but these are distinct frameworks that overlap with, rather than precisely replicate, Arendt's specific analysis of the *loyalty test* function.

  **Conclusion:**

  The phenomenon you observe is best understood through Hannah Arendt's lens of **the "modern lie" used as a "loyalty test" within a system of "organized lying" designed to destroy shared factual reality.** This is **settled** in her core analysis of totalitarianism. What's **contested** is whether this is *exclusively* a totalitarian tactic or can manifest in other political systems, how much it's driven by ideology vs. opportunism, and how modern media changes its dynamics. It differs from ordinary propaganda because its primary goal isn't persuasion of outsiders but internal group cohesion and demonstration of allegiance, leveraging the lie's *transparency* for this purpose. It differs from cynicism because it involves active, committed performance of belief in the lie's *significance* for the group, not passive disbelief.

  While there isn't one universally agreed-upon *single term* beyond Arendt's description, her framework provides the most profound and directly applicable analysis for the specific dynamic you're asking about: the open, known lie whose power lies not in deception but in forcing allegiance and reorganizing political life around its performance.
