answer: |-
  ## Gestational Consulting (with Strings Attached)

  The rain smeared the Mayfair townhouse windows into greasy watercolours of grey stone and wet pavement. Inside the Cavendish Reproductive Centre, the air hummed with expensive silence and the faint scent of antiseptic and coffee brewed within an inch of its life. Priya Sharma smoothed the lapels of her charcoal wool-blend trousers, the fabric crisp against her fingers. ‘Intake Coordinator’ sounded grander than it felt. Mostly, she guided impossibly wealthy, often anxious, faces through discreet consultations and mountains of paperwork. Like Frau Vogel today, steely-eyed and radiating Zurich efficiency, here to discuss a ‘gestational consultant’ – Cavendish’s artfully bland term for a surrogate operating in the legal penumbra created by the UK’s ban on commercial surrogacy and the EU’s outright prohibition.

  "Frau Vogel, Dr. Armitage will be with you shortly," Priya said, her voice calibrated to calm reassurance. "Just these last few authorisations for the genetic material transfer. Standard procedure." She slid the thick contract across the polished walnut desk.

  Frau Vogel barely glanced at it, her pen poised. "Ja, ja. The American donor agency guarantees anonymity, health screening, yes? Platinum package?"

  "Absolutely," Priya confirmed, tapping the relevant section. "Full medical history, psychological vetting, the works. All eggs sourced through our partnered agency in California." A familiar pang, dulled by time and necessity, echoed in her ribs. Five years ago, *she’d* been the Californian ‘platinum package’. Tuition fees didn’t pay themselves. Back then, it felt clean: a transaction, eggs for cash, future obligations neatly severed by reams of legal disclaimers.

  Frau Vogel scrawled her signature. As Priya gathered the papers, her eyes, trained by years of meticulous form-checking, snagged on a sub-clause buried deep within the appendix on ‘Genetic Material Liability’. It referenced a rider codenamed ‘DOHeaD-7’. Curiosity, a professional hazard, pricked at her. Later, after Frau Vogel vanished into Dr. Armitage’s sanctum, Priya retreated to the hushed, beige-carpeted archive room.

  The dusty scent of old paper filled her nostrils as she pulled the master liability file. DOHeaD-7. *Deoxyribonucleic Heritage & Environmental Accountability Directive, Section 7*. Her breath hitched. The legalese was dense, but the core was chillingly clear:

  > *"The Donor acknowledges and agrees that epigenetic modifications potentially induced by the Donor’s subsequent lifestyle, environment, or health choices (including, but not limited to, nutritional status, toxin exposure, chronic stress markers, metabolic disorders diagnosed post-donation) may confer latent predisposition to specific conditions in offspring derived from donated genetic material... The Donor therefore accepts potential retrospective liability for demonstrable harm or associated costs incurred by Recipients should a direct causal link be established between such Donor-induced epigenetic alterations and a qualifying medical condition in the offspring..."*

  Priya’s hands went cold. Epigenetics. The way environment scribbles notes on your genes, notes that can be passed on. She remembered a university lecture, abstract then, terrifyingly concrete now. Her body, her *life* after the donation, wasn’t just her own anymore. It was a latent risk factor. That pizza habit? The month she’d lived near the congested A406? The low-level thrum of London stress that never quite left her? If a child born from her eggs developed, say, severe asthma linked to maternal air pollution exposure *years after donation*, or a metabolic disorder potentially triggered by epigenetic shifts from *her* later diet… could they come after her? Sue her? Retroactively?

  A wave of nausea washed over her. It wasn't just the eggs sold years ago. It was her future. Her body wasn't a one-time resource; it was an ongoing liability portfolio she hadn't known she carried. The American agency’s shiny promise of anonymity felt like tissue paper against this clause. Cavendish, operating in its grey zone, had layered on this insidious safety net for its clients, paid for with the donors' perpetual vulnerability.

  Back at her desk, her fingers trembled as she pulled up her own old donor contract on the internal system. Scanned, years old. She’d signed it in a sunny California office, focused on the upfront sum. Buried deep, referenced obliquely under ‘Future Material Accountability Amendments’, was a clause agreeing to adhere to ‘all current and future clinic protocols and liability frameworks related to donated material’. DOHeaD-7, drafted years later, was likely bolted onto that.

  Dr. Armitage emerged, ushering a satisfied-looking Frau Vogel towards the exit. "Priya, Frau Vogel’s file, please. The consultant screening in Brighton looks promising." His smile was bland, professional.

  Priya forced her voice steady. "Of course, Doctor." She handed over the folder, Frau Vogel’s signature dark and final on the DOHeaD-7 rider. "Just… confirming procedure. The epigenetic liability clause – DOHeaD-7? It applies retroactively to previous donors under the umbrella amendment, doesn’t it? Like… like mine?"

  Armitage’s smile didn’t falter, but his eyes, pale blue behind rimless glasses, sharpened. He closed the door softly behind Frau Vogel. "Miss Sharma. That clause exists to protect children and their families. Modern science reveals connections we couldn't see before. It ensures accountability where a direct, proven link exists. It’s highly specific, very difficult to prove causation, of course." He adjusted his cufflinks. "But yes, the framework applies to all genetic material held by Cavendish, regardless of original donation date. It’s about safeguarding futures. Including, ultimately, the clinic’s ability to offer these vital services within the… complex… European landscape." He gestured towards the window, towards the rain-slicked streets governed by bans. "We operate with the highest ethical standards within the available legal parameters."

  *Ethical standards.* The words curdled in Priya’s stomach. The standard seemed to be protecting the wealthy clients who flew in, and the clinic’s profits, by shackling the donors – mostly young women needing cash – to a lifetime of potential blame. Her body, her environment, her choices – all now factors in a financial equation she hadn't consented to.

  "Understood, Doctor," she managed, the words ash in her mouth.

  "Good." Armitage’s smile returned, warmer now. "You're invaluable here, Priya. Your perspective is unique. Now, the Brighton consultant’s psych eval needs cross-referencing before lunch."

  He walked away, leaving Priya staring at her reflection in the rain-blurred window. Her face looked pale, strained. She wasn't just Priya Sharma, intake coordinator. She was also Genetic Material Batch #CA-PS-18. A commodity that kept accruing risk. The money from years ago felt like fool’s gold now, spent long ago on rent and textbooks, while the real cost – the ownership of her future biological footprint – was only now being presented.

  Outside, a black cab splashed through a puddle. Priya watched the water settle. Her body wasn't just hers. It was collateral in a high-stakes game played in legal grey zones, a game where the rules kept changing, always tightening around the source. The rain streaked the glass like tears she couldn't shed. She had rent due. She needed this job. And somewhere, possibly, children were growing up, carrying silent, invisible notes written by her life, notes that could one day demand payment. She turned back to her screen, the psych eval blurring before her eyes. The clinic hummed on, efficient, discreet, its grey zone feeling less like a loophole and more like a slowly closing trap. Her fingers hovered over the keyboard. The next signature she processed, the next file she handed over, felt like another link in a chain she hadn't known was being forged around her own future.
