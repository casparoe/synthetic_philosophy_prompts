  Across museum curation and climate-risk modeling, there is an emerging practice of placing non-human entities—the 1815 Tambora aerosol veil, the evolutionary trajectory of the 1918 influenza virus, or carbon-cycle feedback loops—into narrative and diagrammatic frameworks usually reserved for intentional agents, treating them as nodes in an actor-network with causal autonomy and explanatory primacy over human institutions. What philosophical commitments about agency, historical causation, and moral responsibility does this institutional framing presuppose? Does it require a literal attribution of intentionality to germs and weather systems, or can it operate as a methodological heuristic without collapsing into environmental determinism? And if the underlying view were replaced by a strict human-centered historiography that denies causal autonomy to non-human forces, what concrete revisions would be necessary in how these exhibits and reports assign blame, structure vulnerability, and represent societal collapse? Answer in exactly five numbered points, each one or two sentences, with no introduction or conclusion.
