prompt: |-
  After a long and somewhat frustrating argument with a friend about what mechanistic anomaly detection actually commits us to, I want to lay out my intuitions about specific cases and see whether they cohere into a principle or whether I need to give some up.

  Consider these five scenarios, each involving a system that originally performs some task through a particular internal process, and then undergoes a change.

  1. A chemical-process digital twin uses a first-principles thermodynamic model. We replace the solver with a neural network trained to reproduce the model's outputs within 0.1% on all historical operating points. The network's hidden layers have no physical interpretation. Verdict: this is an anomalous mechanism; the system is no longer running the same process, even though its predictions are unchanged.

  2. In the same plant, we replace a physical pressure transducer with an equivalent unit from a different manufacturer, with the same calibration curve and the same failure modes. Verdict: not anomalous; the mechanism is unchanged.

  3. A mechanistic interpretability study isolates a specific attention-head circuit in a language model that implements multi-step arithmetic reasoning. Researchers ablate one head and substitute a hand-coded lookup table that returns the exact same intermediate values for every arithmetic prompt in the test set. Verdict: I think the reasoning mechanism is disrupted—this should count as anomalous with respect to the circuit—though the overall input-output behavior is preserved.

  4. A self-driving car's lane-keeping stack originally runs a classical pipeline: edge detection, Hough transform, geometric state estimation, PID control. Engineers replace the vision front-end with an end-to-end neural network that has been formally verified to match the original pipeline's outputs across the entire operational design domain. The control back-end remains identical. Verdict: here I feel pulled the other way. Despite the architectural replacement, I want to say the lane-keeping mechanism is still the same for safety-monitoring purposes, because the verified boundary conditions preserve the causal pathway from road state to steering command.

  5. The tension case: a medical diagnostic system originally uses an explicit Bayesian network with nodes corresponding to diseases and symptoms. We replace it with a graph neural network that achieves identical accuracy, but its nodes are purely statistical clusters with no clinical interpretation. Meanwhile, in a separate system, we keep the Bayesian network structure intact but populate its conditional probability tables through expert elicitation rather than data learning, producing slightly different predictions on edge cases. Verdict: the neural-network replacement feels like a different mechanism and should be flagged, whereas the expert-elicited Bayesian network feels like the same mechanism with different parameters.

  So my pattern seems to be: I care about whether an intermediate causal structure that explains the task is preserved, but I apply this inconsistently—strictly for the arithmetic circuit and the digital twin, leniently for the verified self-driving replacement, and with a distinction between structural and parametric change in the diagnosis case.

  Is there a single principle—perhaps involving counterfactual invariance of explanatory intermediate variables under surgical intervention, or preservation of a task-relevant causal graph at a specific level of abstraction—that delivers all five verdicts without ad hoc adjustments? If not, which verdict should I overturn: the leniency toward the verified neural replacement, or the strictness about the arithmetic lookup table?

  Also, please state precisely what your proposed principle (or the best competing pair) predicts for a case I haven't listed: a brain-computer interface that replaces a section of a patient's motor cortex with silicon chips that reproduce the original spike patterns and synaptic weights with perfect fidelity, but contain no biological neurons. Does that preserve the mechanism of voluntary movement?

  Please be explicit about which of my verdicts your principle cannot accommodate, and motivate each clause of the principle by reference to the case that supports it.
reasoning: |-
  Okay, I need to help this user who's had a frustrating argument about mechanistic anomaly detection. They've laid out five scenarios and want to know if there's a consistent principle that explains their intuitions across all cases. They also want me to apply that principle to a brain-computer interface case.

  Looking at their scenarios:

  First, the digital twin case where a physics-based model is replaced by a neural net. They say it's anomalous because even though outputs match, the internal process changed. That makes sense - the mechanism isn't physically grounded anymore.

  Second, swapping pressure transducers from different manufacturers. Not anomalous because the causal role is identical. The device still measures pressure the same way.

  Third is the language model attention head replaced with a lookup table. They think it's anomalous because even though outputs match, the reasoning process got replaced by rote memorization. I agree - the multi-step computation is gone.

  Fourth is the self-driving car where the vision part is replaced by a formally verified neural net. They feel lenient here because the verified mapping preserves the causal pathway to steering commands. That's interesting - it suggests the abstraction level matters.

  Fifth is the medical diagnosis case. They distinguish between replacing a Bayesian network with an uninterpretable neural net (anomalous) versus just changing how probabilities are set in the same network (not anomalous). Structure vs parameters.

  Their tension is between strictness in some cases and leniency in others. The key seems to be whether the causal structure explaining the task is preserved at the right abstraction level.

  I should propose a principle about preserving the causal graph at the task's relevant abstraction level. For the digital twin, the physics abstraction was violated. For the transducer, same causal role. For the attention head, the computational abstraction changed. For the self-driving car, the geometric state estimation level was preserved via verification. For the medical case, the disease-symptom graph structure matters more than parameter sources.

  Then test it on the brain implant case: replacing cortex with silicon chips that mimic spiking patterns. At the neural signaling level, it's preserved. But at the biological implementation level, it's different. Since the task is movement control through electrical signaling, this would likely count as same mechanism.

  I need to be explicit about which verdicts this principle accommodates - probably all of theirs. And explain why the self-driving case isn't inconsistent - because the verification preserves the key causal variables.

  For the brain case, I'd say it preserves the mechanism because the computational abstraction for motor control is maintained.
answer: |-
  Your intuitions across these cases are remarkably coherent—they reveal a consistent underlying priority on **causal structure preservation at the task-relevant level of abstraction**. However, the "inconsistency" you perceive stems from implicitly shifting the *required level of abstraction* for each task. Let's formalize this into a principle that explains all five verdicts without ad hoc adjustments, then apply it to your BCI case.

  ### The Proposed Principle
  **Task-Relevant Causal Abstraction Preservation (TR-CAP):**  
  A mechanism is preserved iff:  
  1.  **Counterfactual invariance:** The system’s key intermediate variables (those necessary to causally explain the task’s success) remain invariant under the same surgical interventions.  
  2.  **Abstraction matching:** These variables exist at the *minimal abstraction level* required to explain the task’s causal structure (e.g., physical, algorithmic, functional).  
  3.  **Structural equivalence:** The causal graph connecting these variables is isomorphic (same nodes/edges, even if implementation differs).  

  This principle prioritizes *why* the system works over *how* it works, but demands that the "why" is grounded in task-specific causal explanations. Let's validate it against your cases:

  ---

  ### Case-by-Case Validation
  1.  **Digital Twin Replacement (Anomalous)**  
      - **Key intermediate:** Physical state variables (e.g., temperature gradients, reaction kinetics).  
      - **Abstraction level:** Physical/thermodynamic (required to explain process safety).  
      - **Violation:** NN hidden layers lack physical interpretability; they don’t preserve counterfactuals about thermodynamic states (e.g., "How would output change if *this* reaction equilibrium shifted?").  
      - **TR-CAP verdict:** Anomalous (✓ matches your intuition).

  2.  **Pressure Transducer Swap (Not Anomalous)**  
      - **Key intermediate:** Pressure measurement.  
      - **Abstraction level:** Functional input-output (only calibration accuracy matters for the control task).  
      - **Preservation:** Same causal role (sensing pressure → output voltage); identical counterfactuals (e.g., "If pressure spikes, would output change identically?").  
      - **TR-CAP verdict:** Not anomalous (✓ matches).

  3.  **Arithmetic Circuit Ablation (Anomalous)**  
      - **Key intermediate:** Multi-step computation (e.g., carry propagation).  
      - **Abstraction level:** Algorithmic (required to explain *robust* reasoning).  
      - **Violation:** Lookup table destroys the causal graph for stepwise computation. Counterfactuals fail (e.g., "If input digit changed mid-calculation, would intermediate steps adjust dynamically?" → No).  
      - **TR-CAP verdict:** Anomalous (✓ matches).

  4.  **Self-Driving Vision Replacement (Not Anomalous *for your verdict*)**  
      - **Key intermediate:** Geometric state (lane position, curvature).  
      - **Abstraction level:** Geometric/control-theoretic (sufficient for safety monitoring).  
      - **Preservation:** Formal verification ensures the NN outputs identical geometric states to the original pipeline *under all ODD conditions*. Causal pathway (road → geometric state → steering) is preserved. Implementation (edge detection vs. NN) is abstracted away.  
      - **TR-CAP verdict:** Not anomalous (✓ matches your leniency).  
      - *Why it feels different from Case 1?* Here, the task (lane-keeping) doesn’t require *pixel-level* causal explanations, only geometric state. In Case 1, the task (process simulation) *demands* physical-level variables.

  5.  **Medical Diagnosis Tension**  
      - **NN Replacement (Anomalous):**  
          - **Key intermediate:** Clinically interpretable variables (disease probabilities, symptom correlations).  
          - **Abstraction level:** Diagnostic-semantic (required for trust/auditing).  
          - **Violation:** GNN clusters lack clinical meaning; counterfactuals fail (e.g., "If *this symptom* were absent, would *this disease* probability decrease?" isn’t answerable).  
      - **Expert-Elicited Bayes Net (Not Anomalous):**  
          - **Key intermediate:** Same disease/symptom nodes.  
          - **Abstraction level:** Structural-causal (graph topology defines mechanism).  
          - **Preservation:** Conditional probabilities are parameters, not structure. Counterfactual invariance holds for graph topology (e.g., "Is *this disease* still a parent of *this symptom*?").  
      - **TR-CAP verdict:** Anomalous for GNN, not anomalous for expert Bayes (✓ matches).

  ---

  ### The Brain-Computer Interface Case  
  **Scenario:** Replace a motor cortex section with silicon chips that perfectly replicate spike patterns/synaptic weights.  
  **TR-CAP Analysis:**  
  - **Task:** Voluntary movement control.  
  - **Key intermediate variables:** Spike timing patterns across neural populations (encoding movement intent/kinematics).  
  - **Relevant abstraction level:** Computational-neurophysiological (signaling dynamics, not biological substrate).  
  - **Preservation:** Silicon chips replicate the *causal structure of spiking dynamics* (same "nodes" = neurons, same "edges" = synaptic weights). Counterfactuals hold (e.g., "If input spike sequence X occurs, does output sequence Y remain identical?").  
  **Verdict:** Mechanism is **preserved**.  

  *Why?* The task (movement) relies on information encoded in spike patterns, not biological implementation. This mirrors Case 2 (transducer) and Case 4 (self-driving): implementation changes are irrelevant if causal variables at the task’s abstraction level are invariant.

  ---

  ### Which Verdicts Require Overturning?  
  **None.** TR-CAP explains all your intuitions:  
  - Your "strictness" in Cases 1/3/5a arises because those tasks demand *lower* abstraction levels (physical, algorithmic, semantic).  
  - Your "leniency" in Cases 2/4/5b reflects tasks where *higher* abstractions suffice (functional, geometric, structural-causal).  

  The principle rejects a one-size-fits-all abstraction level. Instead, it ties "mechanism" to the *minimal causal explanation* required for the task’s success. Surgical counterfactuals (e.g., "Would this intervention alter *critical* intermediates?") operationalize this.

  ### Competing Principles & Weaknesses  
  - **Pure Functionalism:** Fails Cases 1, 3, and 5a (ignores *how* outputs are generated).  
  - **Implementation Fidelity:** Fails Cases 2, 4, and 5b (overly strict; ignores valid abstractions).  
  - **Weakness of TR-CAP:** It requires defining the "task-relevant abstraction," which can be subjective. For example, in Case 4, if safety monitoring required *explaining vision failures*, the NN might become anomalous (as pixel-level causals vanish). But your verdict ("lenient") suggests the task *only* requires geometric state preservation, which TR-CAP accommodates.

  **Conclusion:** Your intuitions cohere under TR-CAP. The principle forces explicit justification of *which* causal variables matter for a task and why—resolving the tension without overturning any verdicts. For the BCI case, it confirms mechanism preservation at the computational level.
