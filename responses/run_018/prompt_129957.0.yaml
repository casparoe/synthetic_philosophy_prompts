prompt: |-
  I'm a journalist covering philosophy of mind and cognitive science, and I've noticed a recurring asymmetry in how people reason about Dennett-style brain-transplant scenarios. Present someone with gradual neuron-by-neuron replacement of a brain by synthetic equivalents that preserve all psychological connections, and they usually judge that personal identity continues uninterrupted. Present the exact same final synthetic brain, constructed all at once and implanted in a new skull, and they typically deny it is the same person, despite the end state being identical. The same pattern appears with bodily prosthetics: gradual substitution is accepted, instantaneous total replacement is rejected. The asymmetry is not neatly captured by psychological-continuity versus bodily-continuity theories, since both versions preserve or break those relations equally; rather, the path or process itself seems to carry independent weight in identity judgments. Is there an established concept for this specific path-dependence in personal-identity intuitions—perhaps something like process-sensitive identity continuity—or does it fall under existing categories such as the fission problem, Sorites-style vagueness, or psychological-continuity theory with an unstated temporal constraint? If no precise term exists, can you coin one that distinguishes it from plain bodily-continuity preference and from standard branching puzzles, and specify its boundary cases? Lead with the bottom line in bold—whether an established term exists, what the nearest concepts are, and your proposed definition or coinage—then explain in the rest of your response. Keep everything to one tight paragraph, no more than 180 words.
reasoning: |-
  Hmm, the user is a journalist covering philosophy of mind and cognitive science. They've noticed an interesting asymmetry in how people reason about personal identity in brain-transplant scenarios inspired by Dennett. They observe that gradual replacement of neurons with synthetic equivalents is accepted as preserving identity, while an instantaneous creation of the same synthetic brain is rejected, even though the end state is identical. This happens with bodily prosthetics too: gradual substitution is fine, but total replacement isn't. The user points out that this can't be explained by standard psychological or bodily continuity theories since both scenarios have the same continuity in the end state - the difference lies in the process itself. They're asking if there's an established concept for this "path-dependence" in identity judgments.

  I need to determine if there's an existing term for this phenomenon. From my knowledge, while there are related concepts, no specific term directly addresses this path-dependence. The fission problem deals with branching identities, Sorites paradox addresses vagueness in gradual changes, and psychological continuity theories typically focus on outcome rather than process. This specific asymmetry seems unique because it's about how the history of the transformation affects identity judgments, independent of the final state.

  The user wants me to coin a term if none exists. I should create something that captures the essence: process sensitivity. "Processual identity continuity" highlights that continuity depends on the process being gradual and stepwise. This distinguishes it from bodily-continuity preference, which is about the body persisting, and from branching puzzles, which involve splitting. The boundary cases would be abrupt changes versus very slow transformations.

  I'll structure my response as requested: lead with the bottom line in bold, then explain concisely. I'll keep it under 180 words. The key points are: no established term exists; nearest concepts are fission and Sorites; proposed coinage is "processual identity continuity"; and boundary cases involve the temporal grain of change. This should help the user in their journalism by providing a precise framework for discussing this asymmetry.
answer: |-
  **No established term exists; nearest concepts are fission problems and Sorites vagueness. I propose "processual identity continuity" (PIC): continuity judgments depend on the temporal grain of the transformative process itself, independent of physical/psychological endpoints. PIC prioritizes stepwise causal-historical pathways over synchronic state identity.**

  PIC explains your asymmetry: gradual replacement maintains perceived causal-historical threads, while instant replacement severs them, violating intuitive continuity despite identical outcomes. It differs from bodily-continuity theories (which reject *both* synthetic brains) and fission (which involves branching). Boundary cases: (1) How slow must replacement be? (Sorites applies); (2) Does PIC persist if the gradual process is discontinuous? PIC captures the unstated reliance on process history in folk judgments, distinct from outcome-based theories.
