  **Exam Question**:

  **Essay Question (30 marks out of 60 total for the exam; allow 45 minutes):**

  Consider the following hypothetical agent, Agent C. Agent C operates with a "cost-sensitive closure rule" for her beliefs. Specifically:
  - She automatically believes all direct logical consequences of her current beliefs that have a logical complexity (measured by the number of logical operators) not exceeding a fixed threshold n.
  - For logical consequences of complexity greater than n, she only derives and believes them if they are needed to resolve an explicit practical contradiction (for example, if holding her current beliefs while denying the consequence would lead to a conflict in her plans or actions).

  Does Agent C genuinely avoid the problem of logical omniscience? More specifically, when Agent C fails to believe a distant logical consequence (i.e., one that is beyond complexity n and not practically triggered), does this failure count as a failure of rationality or merely a resource limitation? 

  In your answer, be sure to:
  - Explain what logical omniscience is and why it is considered a problem for standard epistemic logic.
