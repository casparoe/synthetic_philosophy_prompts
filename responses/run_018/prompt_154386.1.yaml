  Terms like "non-fungibility" or "moral absolutes" might be relevant, but they don't capture the threshold aspect. "Threshold deontology" is close, but it usually applies to actions, not experiences. The user's concept is about experiential intensity leading to moral incommensurability. So, perhaps a new term is needed. "Intensity-triggered incommensurability" or "discontinuity threshold" could work, combining the sudden change and the lack of comparability.

