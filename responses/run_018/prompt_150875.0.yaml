answer: |-
  Your framing is insightful and largely accurate—the impasse is fundamentally conceptual and methodological, not resolvable by new data alone. Here's a diagnosis grounded in the positions you outlined, with explicit flags for reconstruction and speculation:

  ### Core Disagreement: Two Questions Under One Label
  - **Adaptationist Programme (Modern Genomic Approach)**: Treats "adaptation" as **detectable selection signatures in current genomes**. It asks: *"Does this sequence/trait contribute to fitness now, and does it bear statistical marks of selection?"* Methodologically, it assumes selective and neutral processes leave distinct genomic signatures (e.g., dN/dS ratios, allele frequency spectra). Proponents (e.g., Nielsen, Yang) argue genome-wide scans *can* partition adaptive/non-adaptive variation *if models account for demography, linkage, etc.*  
  - **Gould-Lewontin Critics**: Treat "adaptation" as **historical origin via direct selection for a trait's function**. They ask: *"Was this trait built by natural selection for its current role?"* The spandrel critique targets the assumption that *current utility implies selective origin*. Critics (e.g., Lynch, Stoltzfus) argue genomic models **presuppose what they seek** by assuming deviations from neutral expectations *must* signal selection, ignoring that developmental constraints, drift, or exaptation could produce similar patterns.  

  This is **primarily a methodological clash over inference** (what counts as evidence for selection) **and a conceptual split** (origin vs. current utility). Your hypothesis holds: the camps use "adaptation" for distinct temporal perspectives.  

  ### Spandrel Taxonomy: Your Refinement is Valid but Won't Dissolve the Debate
  - **Spandrels as Architectural Byproducts**: Your strict definition aligns with Gould-Lewontin's original analogy (San Marco pendentives). These are **non-adaptive, developmentally inevitable side-effects** of adaptations.  
  - **Exaptations vs. Capacitance**:  
    - Exaptation (Gould & Vrilla): Trait with *new* function unrelated to original reason for origin (e.g., feathers for insulation co-opted for flight).  
    - Evolutionary Capacitance (e.g., Rutherford, Lindquist): Cryptic variation buffered by mechanisms like Hsp90, exposed under stress. **This *is* relevant**: it provides a mechanism for non-adaptive trait origins later co-opted.  
  - **Constructive Neutral Evolution (CNE; Stoltzfus)**: Neutral processes building complexity (e.g., via epistatic dependencies). Directly challenges adaptationism by showing non-adaptive origins for complex traits.  

  **Why the Taxonomy Doesn't Resolve the Impasse**:  
  1. Genomic methods struggle to distinguish your categories. A trait could be:  
     - A spandrel (architectural byproduct)  
     - An exaptation (neutral origin, later co-opted)  
     - A capacitance-released variant (neutrally accumulated, exposed post-stress)  
     ...*yet all might show identical "signatures of selection" if selection acted later*. Genomic models conflate historical origin with current function.  
  2. **New Sticking Point: Developmental Entrenchment**: Critics argue that proving a trait is a "spandrel" (in your strict sense) requires demonstrating its *developmental inevitability*—which is rarely testable in deep evolutionary time. Adaptationists counter that if a trait is *currently* functional and under selection, its origin is secondary.  

  ### Why Progress Stalls: Key Roadblocks  
  1. **Unidentifiability from Sequence Data Alone** (High Confidence):  
     Formal proofs (e.g., by Lynch, Kern) show selection coefficients cannot be uniquely inferred from genomic data. Demographic history, mutation bias, and linkage can mimic selection signals. Critics cite this; adaptationists respond with "better models" (e.g., incorporating pleiotropy).  
  2. **Methodological Circularity** (Moderate Confidence):  
     Genomic scans often use "neutral" regions as a baseline—but if spandrels/exaptations/CNE are widespread, the baseline itself may be corrupted by past non-neutral events.  
  3. **Temporal Conflation** (High Confidence):  
     Adaptationists frequently equate *current selective maintenance* with *historical origin*. Your exaptation category highlights this: a trait under selection *now* need not have originated via selection.  

  ### What Would Count as Progress?  
  - **Formal Proof of Unidentifiability** (Most Impactful): A mathematical demonstration that selection, drift, and constraint are *fundamentally inseparable* from genomic data alone under realistic conditions would force methodological humility.  
  - **Operational Distinction Between Origin and Utility** (Conceptual Clarification):  
     - **Adaptation (Historical)**: Trait shaped by selection *for its current function*.  
     - **Adaptive Utility (Current)**: Trait enhancing fitness *now*, regardless of origin.  
     - **Exaptation/Spandrel/CNE**: Specify non-adaptive origins.  
     This reframing could redirect debates toward testable mechanisms (e.g., experimental tests of developmental entrenchment).  
  - **Acknowledging Pluralism** (Paradigm Shift): Accepting that "adaptation" is a **family-resemblance term** (as you suggest) covering historical, functional, and structural concepts. Progress would involve mapping *which* processes dominate in specific contexts (e.g., microbes vs. multicellular taxa) rather than universal prevalence claims.  

  ### Pushback on Your Framing  
  - **Strength**: Your spandrel/exaptation/capacitance taxonomy is coherent and defensible. It sharpens Gould's original intent and integrates modern concepts. Capacitance and CNE *are* relevant—they mechanize non-adaptive origins, extending the critique beyond architecture.  
  - **Weakness**: **Developmental entrenchment is gradational, not binary**. "Spandrels" in your strict sense exist (e.g., mammalian testes descent via vaginal canal constraints), but many cases fall on a spectrum. The debate *would* relocate to quantifying entrenchment—a fertile but unresolved empirical challenge.  
  - **Speculative Leap**: You imply disentangling categories could resolve the debate. In practice, **genomic methods remain blind to these distinctions** without developmental data. Progress requires integrating genomics with experimental evo-devo (e.g., CRISPR testing entrenchment).  

  ### Conclusion: A Stalemate of Frameworks  
  The impasse persists because:  
  1. **Adaptationists** prioritize *current utility* and statistical detectability.  
  2. **Critics** prioritize *historical contingency* and alternative mechanisms.  
  3. **Genomic tools** cannot decisively arbitrate without independent evidence of developmental processes or deep-time historical sequences.  

  **Progress demands abandoning the false dichotomy**. We need:  
  - Models that explicitly separate *origin* from *maintenance* (e.g., "selection" vs. "selective constraint").  
  - Admissions that genomic signatures have multiple interpretations.  
  - Cross-validation with paleontological, developmental, or experimental data where possible.  

  Your framing isn't confused—it's a sophisticated diagnosis of a decades-old knot. Untangling it requires conceding that no single method can answer all questions about adaptation.
