  The procedure is structured as a checklist with a series of questions. We aim for it to be executable in about 20 minutes per proposal.

  **Key Definitions:**
  - **Moral weight interval:** For each entity type (e.g., humans, animals, artificial systems, future beings), each framework assigns an interval [L, U] representing the minimum and maximum possible moral weight that the framework would assign to that entity. If a framework does not consider an entity at all (i.e., assigns zero weight), then the interval is [0,0]. If it assigns a fixed weight, then L=U.
  - **Reversal threshold:** The point at which the relative ordering of two options (e.g., approve vs. reject) would switch due to the moral weights. We require an explicit calculation of how much the moral weights would have to change to reverse the decision.

  **The Procedure:**

  **Step 1: Identify Affected Entities and Their Moral Weight Intervals**
  - **Question:** For each entity group affected by the proposal (positive and negative impacts), what are the plausible moral weight intervals according to the competing frameworks we consider?
  - **Sufficient answer:** List each entity group and the range of moral weights (min to max) assigned by the frameworks. If a framework does not assign any moral weight to an entity, that is recorded as [0,0].
  - **Judgment required:** Identifying the set of frameworks to consider and the assignment of intervals to entities. The panel must use their collective judgment to decide which frameworks are plausible and what intervals they assign. This step is inherently value-laden and cannot be fully objective.

  **Step 2: Quantify Impacts**
  - **Question:** For each entity group, what is the estimated impact (in natural units, e.g., number of individuals affected, duration and intensity of suffering, etc.)? Distinguish between certain and uncertain impacts.
  - **Sufficient answer:** A table of impacts per entity group, with point estimates or ranges (if uncertain). The impacts should be in a common natural unit (e.g., QALYs for humans, animal-equivalent suffering for non-humans) but without moral weighting at this stage.
  - **Judgment required:** Estimating impacts, especially when they involve uncertainty or indirect effects.

  **Step 3: Calculate Net Moral Value for Each Framework**
  - **Question:** For each framework, compute the net moral value of the proposal as the sum over entities of (moral weight of entity * impact on entity). Because the moral weights are intervals, this will yield an interval for the net moral value of the proposal (and similarly for the baseline or alternative, which is typically the status quo). If the proposal has multiple alternatives, compare each to the baseline.
  - **Sufficient answer:** For each framework, a net value interval [L_f, U_f] for the proposal and for the baseline (or alternative). If the proposal is compared to an alternative, then we compute the difference: [L_f_diff, U_f_diff] = [L_f_proposal - U_f_baseline, U_f_proposal - L_f_baseline]. This captures the range of possible net gains (or losses) of the proposal relative to the baseline under framework f.
  - **Note:** This step is mechanical once Steps 1 and 2 are done.

