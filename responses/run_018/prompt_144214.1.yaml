answer: |-
  Below is an operational procedure for your ethics review panel, designed to resolve moral uncertainty using interval-valued moral weights and reversal-threshold analysis. The procedure is structured as a checklist with clear steps, criteria, and exit conditions, executable within 20 minutes per proposal. It explicitly flags points requiring judgment, defines test conditions, and includes limitations. British English is used throughout.

  ---

  ### **Operational Procedure for Moral-Uncertainty Resolution**
  **Objective**: Output 'approve', 'reject', or 'refer for human deliberation' for each proposal.  
  **Time limit**: 20 minutes.  
  **Inputs**: Proposal description, baseline (status quo), and alternatives.  
  **Key concepts**:  
  - **Moral weight intervals**: For each affected entity, frameworks assign a min–max weight (e.g., [0, 1]). If a framework excludes an entity, weight = [0, 0].  
  - **Reversal threshold**: The smallest factor by which moral weights must change to flip the proposal’s net value sign (positive/negative).  
  - **Dominance**: A proposal is dominant if net positive under all frameworks; dominated if net negative under all.  
  - **Referral triggers**: Uncertainty that cannot be resolved by thresholds, or irreducibly value-laden disagreements.  

  #### **Checklist: Ordered Questions and Criteria**
  **Step 1: Identify Affected Entities and Moral Weight Intervals**  
  - **Question**: "List all entities (human, animal, synthetic, future) affected positively/negatively. For each, specify the moral weight intervals across all plausible frameworks."  
    - *Sufficient answer*: A table of entities with min–max weights (e.g., "Badgers: [0, 0.5] in utilitarianism; [0.1, 0.3] in biocentrism").  
    - *Judgment required*: Panellists must agree on which frameworks are "plausible" (no meta-ethical resolution needed).  
    - *Test condition*: Ignore entities with zero impact.  
    - *Exit*: If all entities have [0,0] weights under all frameworks → **reject** (no moral relevance).  

  **Step 2: Quantify Impacts**  
  - **Question**: "Estimate impacts per entity in natural units (e.g., QALYs, suffering-hours, risk-adjusted lives). Distinguish certain (point estimates) and uncertain (ranges) impacts."  
    - *Sufficient answer*: Impacts in common natural units, with uncertainties expressed as intervals (e.g., "Badgers: 100–200 severe suffering-hours averted").  
    - *Judgment required*: Impact estimation (e.g., extrapolating future risks). Non-quantifiable impacts (e.g., dignity) → flag for referral.  
    - *Test condition*: If impacts are negligible (<1% of total) → exclude entity.  

  **Step 3: Calculate Net Value Intervals per Framework**  
  - **Question**: "Compute net value of proposal vs. baseline for each framework:  
    **Net value** = Σ (moral weight × impact) for all entities.  
    Use: **Lower bound** = min weight × min impact for benefits, max weight × max impact for harms.  
    **Upper bound** = max weight × max impact for benefits, min weight × min impact for harms."  
    - *Sufficient answer*: Net value interval [L_f, U_f] for each framework *f*.  
    - *Judgment required*: None (mechanical).  
    - *Exit*:  
      - If **all** [L_f, U_f] > 0 → **approve** (dominant).  
      - If **all** [L_f, U_f] < 0 → **reject** (dominated).  
      - Else → proceed.  

  **Step 4: Reversal-Threshold Analysis**  
  - **Question**: "For frameworks where net value interval crosses zero (L_f ≤ 0 ≤ U_f), calculate the reversal threshold:  
    - **Beneficiary reversal factor (BRF)**: Min factor by which weights of benefited entities must ↑ to make L_f > 0.  
    - **Harmed reversal factor (HRF)**: Min factor by which weights of harmed entities must ↓ to make L_f > 0.  
    Use the smaller of BRF/HRF as the threshold."  
    - *Sufficient answer*: Threshold for each non-robust framework (e.g., "BRF = 5.0 for utilitarianism").  
    - *Judgment required*: Setting the **reversal-threshold cutoff** (e.g., 10×). Panel must agree on this *in advance* (e.g., "thresholds >20× are implausible").  
    - *Test condition*: If all thresholds > cutoff → **approve** (robust). If any threshold ≤ cutoff → **refer**.  
    - *Critical misfire risk*: If intervals overlap and all net values are positive, but rank reversal occurs (e.g., Proposal A > B under all frameworks, but A < B if weights shift slightly).  

  **Step 5: Final Decision**  
  - **Question**: "Does any framework show net harm (U_f < 0), or unresolved value conflict?"  
    - *Sufficient answer*:  
      - If **all** frameworks have U_f > 0 and thresholds > cutoff → **approve**.  
      - If **any** framework has U_f < 0 → **reject** (not dominant).  
      - If unresolved:  
        - Moral weights/impacts too ambiguous → **refer**.  
        - Irreducible values conflict (e.g., "Do synthetics have rights?") → **refer**.  

  **Summary of Exit Conditions**:  
  - **Approve**: Strict dominance (all L_f > 0) OR all thresholds > cutoff.  
  - **Reject**: Strictly dominated (all U_f < 0) OR any U_f < 0 (non-dominance).  
  - **Refer**: Thresholds ≤ cutoff, intervals cross zero, or irreducible values conflict.  

  ---

  ### **Test Cases**
  #### **Case (i): Badger-Vaccination Programme**  
  - **Affected entities**: Badgers (benefit: reduced TB suffering), cattle (benefit: reduced culling), prey species (harm: increased predation), humans (benefit: economic gains).  
  - **Moral weights**:  
    - Badgers: [0, 0.3] (animal rights); [0.1, 0.2] (utilitarianism); [0, 0] (anthropocentrism).  
    - Prey species: [0, 0.1] (all frameworks).  
  - **Impacts**:  
    - Badgers: 500–1,000 suffering-hours averted (certain).  
    - Prey species: 200–500 suffering-hours increased (uncertain).  
  - **Net value intervals**:  
    - Utilitarianism: [0.1×500 - 0.1×500, 0.2×1000 - 0×200] = [-50, 200].  
    - Anthropocentrism: [0 (only humans: net positive)].  
  - **Reversal thresholds**:  
    - Utilitarianism: BRF for badgers = 1.5× (to offset prey harm). Threshold (1.5×) < cutoff (20×).  
  - **Decision**: **Refer** (threshold too low; irreducible conflict over prey species' weights).  
  - **Misfire risk**: If prey impacts were negligible, approval might occur despite predation shifts.  

  #### **Case (ii): Artificial Sentience Research**  
  - **Affected entities**: Synthetic systems (harm: risk of suffering), humans (benefit: knowledge).  
  - **Moral weights**:  
    - Synthetics: [1, 1] (functionalism: full status if architecture sentient); [0, 0] (behaviourism: no status without proof).  
  - **Impacts**:  
    - Synthetics: 10–100 suffering-units if sentient (p = 0.2 probability).  
    - Humans: 50–200 benefit-units (certain).  
  - **Net value intervals**:  
    - Functionalism: [1×10×0.2 - 1×200, 1×100×0.2 - 1×50] = [-198, -30] (net harm).  
    - Behaviourism: [0 + 50, 0 + 200] = [50, 200] (net benefit).  
  - **Decision**: **Reject** (U_f < 0 under functionalism; dominated in one framework).  
  - **Divergence from intuition**: Panellists may intuit "benign until proven sentient," but **Step 3** mandates rejection if any framework shows net harm.  

  #### **Case (iii): Geological Carbon Storage**  
  - **Affected entities**: Present communities (harm: risk of displacement), future generations (benefit: reduced climate catastrophe).  
  - **Moral weights**:  
    - Present communities: [1, 1] (all frameworks).  
    - Future generations: [0.001, 0.01] (discounted utilitarianism); [1, 1] (longtermism).  
  - **Impacts**:  
    - Present: 10–100 well-being units lost (risk-adjusted).  
    - Future: 10,000–100,000 units gained (uncertain).  
  - **Net value intervals**:  
    - Discounted utilitarianism: [0.001×10000 - 1×100, 0.01×100000 - 1×10] = [-90, 990].  
    - Longtermism: [1×10000 - 1×100, 1×100000 - 1×10] = [9,900, 99,990].  
  - **Reversal thresholds**:  
    - Discounted utilitarianism: BRF for future = 1.1× (to make L_f > 0). Threshold (1.1×) < cutoff (20×).  
  - **Decision**: **Refer** (threshold too low; conflicts with intuitive approval).  
  - **Divergence step**: **Step 4** – Low reversal threshold in discounted utilitarianism forces referral despite overwhelming net benefit under longtermism.  

  ---

  ### **What the Procedure Cannot Do**  
  1. **Justify dominated options**: If a proposal has negative net value under *all* frameworks (U_f < 0), it is rejected. The procedure cannot approve/refer such cases.  
  2. **Operationalise 'avoid side effects'**: Without a value function, it cannot penalise interventions with high side-effect risks (e.g., "precautionary principle") unless harms manifest as net negatives under a framework.  
  3. **Handle non-interval uncertainties**: Deep uncertainty (e.g., "unknown unknowns") is not quantified and defaults to referral.  
  4. **Resolve meta-ethical conflicts**: Disagreements about framework plausibility or entity inclusion are judgment-based and may force referral.  
  5. **Prevent rank reversals**: If all frameworks have overlapping net value intervals (e.g., [-100, 200] and [50, 300]), the procedure may approve, but small weight shifts could reverse intervention rankings.  

  **Reusable Deliverable**: This checklist is format-agnostic and can be integrated into scoring sheets or digital tools. Panellists should be trained on reversal-threshold calculations to stay within time limits.  

  ---  
  **Final note**: The procedure systematises moral uncertainty but cannot eliminate judgment—particularly in Steps 1 (framework selection) and 4 (threshold cutoff). It errs toward referral when values conflict, ensuring neutrality in meta-ethical disputes.
