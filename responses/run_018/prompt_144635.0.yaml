answer: |-
  That's an excellent question, and your kin-selection analogy is astute! You're right to sense that the summary oversimplifies and arguably distorts Williams' nuanced argument. Let's break it down sentence by sentence, drawing on his key text "Persons, Character and Morality" (1976) and "A Critique of Utilitarianism" (1973):

  1.  **"Williams's famous argument shows that utilitarianism is inhuman."**
      *   **Accuracy:** Partial, but strong simplification. Williams *does* argue that utilitarianism (and other strongly impartial moral theories like Kantianism) can be **alienating** and **destructive of personal integrity**. It forces agents to adopt an "impartial spectator" perspective that requires them to view their own deeply held commitments, relationships, and projects (what he calls "ground projects") as merely one set of preferences among others in the overall utility calculus. This detachment from one's own identity and motivations, Williams argues, is psychologically unrealistic and morally damaging – it treats people as mere "sites" for the happening of utility rather than integrated persons with constitutive attachments. He *does* imply this is a kind of "inhuman" demand, but "proves" is too strong; he offers a powerful *objection* based on integrity and alienation.
      *   **Misreading/Sinplification:** "Inhuman" is a bit of rhetorical flourish, more common in summaries than Williams' own precise language. "Proves" is incorrect; it's a critique highlighting a deep problem, not a logical refutation of utilitarianism's internal consistency.

  2.  **"Imagine you can only save one person from drowning — your spouse or a stranger. Utilitarianism says you should save the stranger whenever that produces even slightly more total happiness."**
      *   **Accuracy:** This *is* a core part of Williams' hypothetical, known as the "Jim and the Indians" case (slightly different) or variations like this drowning scenario. His point is that *if* the utilitarian calculus genuinely showed saving the stranger yielded *more* overall utility (e.g., the stranger is a brilliant surgeon who will save thousands, your spouse is terminally ill), then strict utilitarianism *would* demand saving the stranger. Williams grants the utilitarian premise *for the sake of argument* to show the psychological/moral cost.
      *   **Key Nuance (Where your question hits the mark):** Williams **does NOT claim this is the *realistic* outcome in a simple spouse vs. stranger case.** He explicitly acknowledges that the utilitarian can *easily* argue that saving your spouse *would* likely produce more utility *because* of the deep relationship, shared history, mutual dependencies, and the psychological devastation caused by failing to save a loved one when possible. His point isn't that utilitarianism *always* demands saving the stranger. **His point is about the *justification* required.**

  3.  **"Williams says the husband should save his wife with no reasoning whatsoever; if he thinks 'it's okay because overall welfare is higher,' that's already one thought too many."**
      *   **Accuracy:** This captures the *essence* of the "one thought too many" phrase brilliantly. Williams argues that the morally authentic, integrated response is to save your spouse **because she is your spouse**, out of love and commitment. The thought "Is this maximizing utility?" is alien to that motivation. Even if the utilitarian *permits* saving the spouse based on relationship utility, justifying it *that way* ("it's okay because overall welfare is higher") involves a step back from the direct, personal commitment. That step back – that thought – is the "one thought too many." It demonstrates the agent is still fundamentally operating within the alienating framework of impartial utility maximization, even if it allows the "right" action this time.
      *   **Misreading/Sinplification:** "With no reasoning whatsoever" is too stark. Williams isn't against *all* reasoning. He's against reasoning that *detaches* you from your constitutive commitments and forces you to justify them externally through an impartial calculus. The husband *reasons* "That's my wife!" or "I love her!" – this is reasoning rooted in his identity and relationships, not abstract utility. The simplification makes it sound like blind impulse, which isn't quite right.

  4.  **"So Williams proves that all moral theories asking you to weigh outcomes destroy personal integrety, and real ethics is just pursuing your ground projects without ever justifying them to anyone else."**
      *   **Inaccuracy/Major Overstatement:** This is where the summary drastically oversimplifies and distorts Williams.
          *   **"All moral theories asking you to weigh outcomes":** Williams' primary target is **utilitarianism** and similar **strongly impartial consequentialist** theories. He *also* critiques Kantianism for different reasons (its abstract, universalizable rules can also alienate). He does **not** argue that *any* weighing of outcomes destroys integrity. He recognizes that consequences matter. His objection is to making *impersonal maximization of overall good* the *sole* and *overriding* criterion, especially when it requires sacrificing constitutive commitments.
          *   **"Destroy personal integrity":** He argues it *can* destroy integrity *if* the agent internalizes the demand to sacrifice their ground projects for the impartial good. It fragments the self. But he doesn't claim it *always* destroys it in every instance.
          *   **"Real ethics is just pursuing your ground projects without ever justifying them to anyone else":** This is a severe misreading. Williams **does not** advocate unreflective egoism or the abandonment of morality. Ground projects *include* moral commitments (e.g., being a good parent, fighting for justice). His point is that:
              *   Ground projects are *constitutive* of identity; they aren't chosen from an impartial standpoint.
              *   Morality cannot *consistently demand* that we sacrifice these projects for the greater good without alienating us.
              *   Justification is complex. He *doesn't* say you never need to justify actions to others. He argues that justification often happens *within* shared practices, relationships, and understandings ("thick" ethical concepts like loyalty, betrayal) – not primarily by appealing to a single, supreme, impartial principle like utility. Justifying saving your spouse by appealing to "loyalty" or "love" is different from justifying it by "utility calculus, which happens to permit it this time."

  **Addressing Your Specific Queries:**

  1.  **"Does Williams really think the utilitarian must save the stranger in the one-to-one case?"**
      *   **No.** He uses the case hypothetically *if* utility demanded it, but crucially, he acknowledges the utilitarian can readily justify saving the spouse *on utilitarian grounds* due to relationship value. His objection is to the *framework* and the *alienating justification*, not necessarily the action in this specific scenario.

  2.  **"Does he reject all outcome-weighing, or just a particular kind of moral system?"**
      *   **He rejects a particular kind: strongly impartial, maximizing consequentialism (like utilitarianism).** He recognizes outcomes matter. He objects to making the *impersonal maximization* of aggregate good the *overriding* principle that trumps all personal commitments.

  3.  **"Is utilitarianism 'refuted'?"**
      *   **No, not logically refuted.** Williams offers a powerful and enduring **objection** based on the value of personal integrity, the psychological reality of human motivation, and the potential for alienation. He shows utilitarianism demands something deeply psychologically costly and potentially identity-destroying. This seriously weakens its claim to be a *comprehensive* or *psychologically realistic* moral theory for human beings. However, utilitarians can (and do) respond:
      *   By arguing that integrity/relationships *are* part of utility.
      *   By biting the bullet and accepting the cost.
      *   By developing rule-utilitarian or two-level approaches.
      Williams' argument doesn't show utilitarianism is *internally inconsistent*; it shows it might be *unacceptably demanding* and *alienating* for beings like us.

  **Your Kin-Selection Analogy:**

  It's **very fair and insightful.** Just as an organism doesn't (and shouldn't need to) consciously calculate inclusive fitness before saving its offspring – it acts from evolved dispositions of care – Williams argues a moral agent shouldn't need to run an impartial utility calculation to justify saving their spouse. The disposition (love, loyalty) is part of who they are. Requiring the calculation inserts an alien, impersonal thought process ("one thought too many") into a response that should flow directly from constitutive commitments. The analogy highlights the *naturalness* and *immediacy* of the motivation Williams sees as authentic.

  **Conclusion:**

  The summary you read captures the core *rhetorical thrust* of the "one thought too many" point effectively but oversimplifies Williams' position significantly. It overstates his target (all outcome-weighing), misrepresents his stance on justification (as no justification ever), and wrongly implies he thinks utilitarians must always save the stranger. Most importantly, it wrongly presents him as rejecting morality in favor of unreflective project pursuit.

  Williams' real argument is a sophisticated critique of **impersonality** in moral theory. He argues that ethics must make room for the **first-personal perspective**, **constitutive commitments**, and **integrity** – elements that theories demanding complete impartiality systematically neglect or undermine. He doesn't "refute" utilitarianism with a logical knockout blow, but he delivers a profound challenge that any plausible moral theory must address. Your biological instincts served you well in spotting the simplifications!
