  anyway, i need you to draft an exam question for an advanced undergrad / early grad course, definitely not intro level, so that students cant just recite wikipedia. the prompt should make them explain why rational agents keep throwing money after bad, but specifically they need to distinguish the sunk-cost fallacy from strategic signaling in multi-round auctions where bids are irreversible and visible to both players. to keep it from being generic, frame it with a software analogy — comparing the dynamics to a two-node consensus protocol where retreating costs more than pushing forward. please write the exam question, a model answer of about 600 words, and a marking scheme that clearly separates an A from a B: the top answers should have to show how irreversibility and observability reshape the payoff structure, not just name-drop sunk costs. also dont include any citation requests or bibliographies — its take-home but they dont have library access. oh, and i misspelled commitment with two m's in my notes (committment), but you know what i meant. keep it casual, like an email to a colleague who actually knows this stuff.
