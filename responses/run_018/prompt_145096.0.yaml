answer: |-
  **Subject:** Exam Q Draft - Dollar Auction meets Consensus Protocols  

  **Hey,**  

  Check this question I cooked up for that seminar. Wrapped it in distributed systems clothing like we discussed. Forces them to dissect the *mechanics* of escalation, not just parrot "sunk costs bad." Crucially, it makes them confront how **irreversible actions + public visibility** warp incentives.  

  ---  

  ### Exam Question: "The Consensus Dollar Auction"  
  Consider a modified dollar auction with two rational bidders. Rules:  
  1. Bids are public, irrevocable, and increase by $0.25 increments.  
  2. The *winner* pays their bid and gets $1.  
  3. The *loser* pays their *highest bid* but receives nothing.  

  This mirrors a two-node consensus protocol where:  
  - Each "bid" represents a node committing a value to an immutable log.  
  - "Winning" is achieving consensus without conflicts.  
  - "Losing" means triggering a cascade corruption (cost = bid) if retreating after partial commit.  

  **Prompt:** Explain why rational agents might bid past $1 (e.g., $1.25). Contrast *sunk-cost fallacy* (SCF) with *strategic signaling* as explanations. Crucially, analyze how the **irreversibility of bids** and **public visibility** reshape payoffs. Use the consensus protocol analogy to illustrate why "escalating further" can be strategically rational, even when losses exceed gains.  

  *(Word limit: 600 words)*  

  ---  

  ### Model Answer (590 words)  
  The dollar auction’s escalation beyond $1 stems from structural incentives, not irrationality. While SCF (misguidedly continuing due to prior investments) plays a role, the auction rules create a *subgame-perfect equilibrium* where overbidding is strategically rational due to **irreversible commitments** and **observability**.  

  **Sunk-Cost Fallacy vs. Strategic Signaling:**  
  - **SCF** suggests bidders irrationally "throw good money after bad" to justify prior losses. Here, if a bidder at $0.75 thinks, *"I can’t waste my bid,"* they ignore marginal costs.  
  - **Strategic signaling** is distinct: Bidders escalate to credibly threaten commitment, forcing opponents to back down. At $1.25, the leader signals, *"I will bid infinitely to avoid losing my $1 sunk cost,"* making the loser cut losses. This is coldly rational given the rules.  

  **How Irreversibility + Observability Reshape Payoffs:**  
  1. **Irreversible bids as binding commitments:**  
     - Like a node writing to a WAL (Write-Ahead Log), bids cannot roll back. A bidder at $0.75 faces:  
       - *Escalate to $1*: Pays $1 to win $1 → net $0.  
       - *Quit*: Pays $0.75 → net -$0.75.  
     - Escalating to $1 is rational (minimizes loss from $-0.75 to $0).  

  2. **Observability enables coercive signaling:**  
     - Public bids let players update expectations. At $1.25:  
       - *Leader* (bid $1.25): If they quit, lose $1.25. If they escalate, can win at $1.50 (net -$0.50) or force the opponent to quit.  
       - *Follower* (bid $1.00): Must bid $1.25 or lose $1.00. Bidding $1.25 risks escalating further but offers a chance the leader quits.  
     - Both know escalating *could* limit losses if the opponent folds. The loser’s payment rule makes quitting catastrophic, mirroring a consensus protocol where retreating after partial state commit corrupts both nodes.  

  **Consensus Protocol Analogy:**  
  - Imagine two nodes proposing conflicting values. Once Node A commits "X" to its log, rolling back requires cascading rollbacks (costly corruption). Node B observes this and can:  
    - **Concede:** Accept "X," losing its own proposal (like quitting the auction).  
    - **Force:** Commit "Y," triggering conflict. If Node A concedes, Node B "wins" but pays overhead (bid cost).  
  - Just as nodes escalate to avoid rollback penalties, bidders escalate to avoid the loser’s fee. Observability lets players bluff ("I will force corruption unless you concede"), but irreversibility makes bluffs credible.  

  **Conclusion:**  
  Escalation past $1 is primarily strategic. SCF exists but is secondary; the auction’s rules (loser pays, public bids) create a game where signaling resolve via overbidding is Nash-optimal. In consensus terms, once partial progress is globally observed, continuing is cheaper than undoing work. Rational agents don’t merely "chase sunk costs"—they exploit the system’s enforced commitments to intimidate opponents.  

  ---  

  ### Marking Scheme  
  **A Grade (Top 20%)**  
  - ✅ **Distinguishes SCF from signaling** as *causal mechanisms*, not just definitions.  
  - ✅ **Explicitly models payoffs** at critical bid levels (e.g., $0.75 → $1 jump) using the rules.  
  - ✅ **Articulates how irreversibility + observability enable credible threats** (e.g., "At $1.25, escalating signals infinite resolve because quitting is costlier").  
  - ✅ **Leverages the consensus analogy** to explain *why* retreating is prohibitively expensive (e.g., "Like cascade corruption after partial log writes").  
  - ❌ No generic "sunk costs cause escalation" without auction-specific mechanics.  

  **B Grade (Competent but shallow)**  
  - ✔️ Correctly defines SCF and signaling.  
  - ✔️ Mentions observability/irreversibility but doesn’t detail payoff shifts.  
  - ✔️ Uses software analogy superficially ("like distributed systems").  
  - ❌ Misses *why* signaling works here but not in one-shot auctions.  
  - ❌ Treats escalation as primarily irrational (SCF-dominated).  

  **C Grade or below**  
  - ❌ Repeats auction rules without game-theoretic analysis.  
  - ❌ Confuses signaling with SCF (e.g., "signaling is a type of sunk cost").  
  - ❌ Software analogy absent or irrelevant.  

  ---  
  Let me know if this hits the sweet spot—escalates past generic econ-101 answers but stays rooted in the mechanics. Could add a footnote like *"Assume agents value ‘winning’ at $0 to exclude ego utility"* if you want to exclude behavioral noise.  

  Cheers,  
  [Your Name]  

