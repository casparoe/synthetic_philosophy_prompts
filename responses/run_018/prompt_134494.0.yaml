prompt: |-
  Quick one for a personal identity seminar. I keep noticing this specific asymetry in how people apply origin essentialism. They say you couldn't have come from a different sperm and egg — standard Kripke-style stuff — but then they treat other biological origin conditions as totally accidental: like whether you were colinized by specific gut bacteria in the first 48 hours, or whether particular epigenetic markers were set by prenatal stress. Those are just as causally determinative for cognitive development, yet they don't get essential status. Is there a name for this selective pattern, where gametic origin is treated as uniquely essential while other early biological conditions are ignored? If not, can you coin one and map the boundaries: is it just sloppy essentialism, or is there something distinctive about treating chromosonal origin differently? I want the carving, not just a label, and I want to know exactly where it differs from the non-identity problem and from standard origin essentialism. And please don't just hand me a reading list — I need the conceptual analysis, not citations.
