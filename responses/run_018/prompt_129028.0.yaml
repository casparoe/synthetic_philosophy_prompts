prompt: |-
  I spent last evening arguing with a friend about whether Darwin's selection and Turing's computation genuinely prove that competence can run without comprehension, or whether they merely relocate the understanding elsewhere. I am now defending a sharper version at a philosophy of mind seminar next Tuesday—call it the double inversion: not only do evolutionary and algorithmic processes produce intelligent outcomes without grasping them, but human understanding itself is best explained as a retrospective narrative gloss on mechanisms that never actually possessed semantic comprehension, so the boundary between understanding and mere competence is itself a kind of competence. The audience is a reading group of about twelve: roughly half are functionalists who think the Chinese Room objection confuses levels of analysis; about a quarter are biological naturalists in Searle's camp who hold that intrinsic intentionality distinguishes real minds from simulations; and there is one predictive-processing cognitive scientist who will likely argue that all cognition is already hierarchical computation, either collapsing my distinction or rendering it trivial. I need a speaker prep sheet, structured exactly as follows.

  First, "Audience map and damage forecast" (around 150 words): identify which objections come from which faction, ordered by how damaging they are specifically to the double inversion rather than to generic functionalism, with a brief note on which faction is most likely to press each.

  Second, "The objections in their own words" (around 400 words): six or seven objections I will actually face, each phrased in the vocabulary that faction would use—not generic textbook rebuttals, but the ones this specific mix raises. For each, provide a reply I can deliver in about two minutes, plus an explicit note on where that reply is weakest or relies on an unstated premise.

  Third, "What to concede in the opening" (around 100 words): the parts of the double inversion I should grant are speculative or under-argued, so I do not appear to be dodging the hard part.

  Fourth, "The question I'm hoping nobody asks" (around 100 words): the single objection that strikes the weakest point of the inversion argument itself, phrased as it would actually come, with a brief reply and an honest assessment of whether the reply survives scrutiny.

  Keep everything in the weeds—avoid objections I could have read in an introductory survey. Do not include bibliographies, reading lists, or citations; I need this usable without web access. Do not quote any source verbatim—paraphrase without quotation marks. Inject the niche framing of the double inversion where needed, but do not lean on hyper-obscure named theories or specific empirical results that a small model would not have properly memorized.
