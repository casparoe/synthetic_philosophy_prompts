answer: |-
  Here’s your speaker prep sheet, structured as requested and grounded in the niche framing of the double inversion:

  ---

  **1. Audience Map and Damage Forecast**  
  *Most damaging first:*  
  **Searleans (25%):** Will attack the core claim that biological cognition lacks intrinsic intentionality. Objection: "You reduce *all* understanding to competence, denying the sui generis nature of conscious meaning-grounding." This faction’s challenge is existentially damaging—if successful, it collapses the entire double inversion.  
  **Functionalists (50%):** Likely to object that dissolving the understanding/competence distinction undermines functionalism’s core project. Specifically: "If narrative gloss is *just* more competence, how does it explain normativity or error?" Moderately damaging—it risks alienating potential allies.  
  **Predictive Processor (1 person):** Will argue hierarchical computation *is* understanding, making your distinction trivial. Objection: "Your ‘gloss’ is just higher-level pattern completion in a predictive hierarchy." Least damaging—it relabels but doesn’t refute the inversion—but could sway functionalists.  

  ---

  **2. Objections in Their Own Words and Replies**  

  **Objection 1 (Searlean):** "But biological systems exhibit intrinsic intentionality—a thermostat *represents* temperature non-derivatively to maintain homeostasis. Your inversion ignores this biological bedrock."  
  *Reply:* Homeostasis requires no semantic comprehension; it’s physicochemical threshold-crossing. The frog snaps at moving dots without ‘representing flies.’ Retrospective gloss *interprets* this as intentionality.  
  *Weakness:* Relies on unstated premise that physicochemical causality exhausts biology.  

  **Objection 2 (Functionalist):** "Narrative gloss must itself be a computational process with semantic properties. Calling it ‘mere competence’ just relocates understanding to the narrative module."  
  *Reply:* Narrative is post-hoc pattern-matching, not real-time comprehension. Like Darwinian selection, it filters outputs without accessing meanings—an algorithmic competence generating the *illusion* of understanding.  
  *Weakness:* Doesn’t explain why narrative feels phenomenally different from low-level competence.  

  **Objection 3 (Predictive Processor):** "Hierarchical prediction errors *are* comprehension. Your ‘gloss’ is just cortical hierarchy compressing sensory data—no ‘inversion’ needed."  
  *Reply:* Compression isn’t comprehension. Predictive processing minimizes surprise algorithmically, but semantic depth is a gloss we add when describing the system’s success.  
  *Weakness:* Conflates your inversion with their framework; reply may seem stipulative.  

  **Objection 4 (Searlean):** "Evolution selected *for* comprehension. If understanding didn’t confer adaptive advantage, why do we have it?"  
  *Reply:* Selection pressures favor competence, not comprehension. We survive because our mechanisms *behave* adaptively; the ‘advantage of understanding’ is a gloss we impose.  
  *Weakness:* Hard to disprove adaptive teleology without detailed evolutionary psychology.  

  **Objection 5 (Functionalist):** "Your view implies epiphenomenalism—if gloss doesn’t causally contribute, why does it exist?"  
  *Reply:* Gloss *is* causally active as a competence (e.g., verbal report), but its semantic content isn’t what drives cognition. It’s an output, not a guide.  
  *Weakness:* Risks making consciousness explanatorily inert.  

  **Objection 6 (Searlean):** "If comprehension is gloss, why can’t we ‘gloss’ AIs into real understanding? This reduces intentionality to behaviorism."  
  *Reply:* We *do* gloss AIs as understanding—but like us, they lack intrinsic semantics. The boundary isn’t ontological but descriptive.  
  *Weakness:* Appears to concede too much to anti-realism.  

  ---

  **3. What to Concede in the Opening**  
  Grant that the *retrospective narrative* hypothesis is underdeveloped re: phenomenology—it doesn’t yet fully explain why gloss *feels* like comprehension. Also concede that evolutionary algorithms producing comprehension-like outcomes doesn’t entail humans lack comprehension; it merely shows it’s *possible* without it. The inversion’s strength is parsimony, not deductive proof.  

  ---

  **4. The Question I’m Hoping Nobody Asks**  
  **Objection (Functionalist/Predictive Processor hybrid):** "If your ‘gloss’ is causally potent competence, and competence is hierarchical computation, then gloss *is* understanding by another name. Your double inversion reduces to ‘computation explains everything’—which trivializes your claim."  
  *Reply:* The inversion isn’t that computation explains gloss, but that gloss *misdescribes* computation as semantic. Understanding is what competence *feels like from the inside* when described post-hoc.  
  *Survival assessment:* The reply survives only if the audience accepts phenomenological illusion as irreducible. If pressed on how illusion arises from computation, it falters.  

  ---  

  **Tactical note:** Anchor replies in the double inversion’s core move: *Competence doesn’t lack understanding; understanding is a species of competence misperceived as semantic.* Sidestep metaphysical debates by focusing on the descriptive gap between mechanism and narrative.
