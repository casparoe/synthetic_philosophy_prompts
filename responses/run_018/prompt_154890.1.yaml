answer: |-
  ### Core Difference: Mencius vs. Xunzi
  Mencius posits that human nature contains innate moral predispositions ("sprouts")—such as spontaneous compassion or shame—that naturally incline humans toward goodness. These require intentional cultivation to mature into full virtue but are fundamentally inherent. Xunzi argues human nature is intrinsically self-interested and amoral, generating social chaos without intervention. Ritual and learning *remake* this nature artificially, imposing moral order from outside. Mencius sees virtue as *developed* from within; Xunzi sees it as *imposed* from without.

  ---

  ### Unifying Principle  
  **Principle:** *Human moral development requires the dialectical integration of innate affective capacities (the affective baseline) and culturally transmitted normative structures (external architecture). Neither suffices alone; virtue emerges from their constructive interaction.*

  ### Application to Judgments  
  1. **Spontaneous Aid (Child):**  
     - *Affective baseline alone.* The child’s action manifests an innate moral sprout (Mencian element), requiring no learned structure.  

  2. **Ritual without Feeling (Society):**  
     - *External architecture alone.* Stability is possible through imposed norms (Xunzian element), but the absence of spontaneous prosociality renders this order emotionally deficient—conforming to rules without inner alignment.  

  3. **Compassion without Training (Person):**  
     - *Uncultivated baseline.* Innate compassion (affective baseline) lacks direction from normative architecture, leading to chaotic expression. Validates Xunzi’s caution about unrefined nature.  

  4. **Training without Nurture (Person):**  
     - *Architecture without baseline.* Reliable conduct stems from external norms, but the absence of cultivated affective motivation creates "defective virtue"—action without authentic moral feeling. Rejects Xunzian purity.  

  5. **Rational Self-Legislation (Concept):**  
     - *Affective baseline as necessary foundation.* Pure rationality cannot generate virtue without a pre-rational emotional substrate (e.g., Mencius’s sprouts). Coherence requires anchoring norms in innate affect.  

  ### Sixth Case: Rules Imposed on Pre-Affective Infants  
  - **Outcome:** Rules applied before affective capacity emerges produce mechanical compliance devoid of moral significance. Without an affective baseline to engage, norms remain external impositions, failing to cultivate virtue.  
  - **Principle Explained:** The *interaction* is impossible—normative architecture lacks a developmental partner. This violates the principle’s requirement for dialectical integration.  

  ---

  ### Coherence Assessment  
  The principle unifies all five judgments without contradiction:  
  - **#1–2** show the insufficiency of either pole alone.  
  - **#3–4** demonstrate the perils of isolating each element.  
  - **#5** affirms the baseline’s necessity.  
  - **#6** confirms their interdependence.  

  It transcends the Mencius-Xunzi dichotomy by insisting that affective potential *and* normative guidance are co-essential. Virtue arises not from nature *or* nurture, but from their mutual refinement.  

  No verdicts need overturning; the synthesis preserves each judgment’s core insight while resolving apparent tensions between classical positions.
