prompt: |-
  hey — im writing a scene where my protagonist, a grad student, needs to map out confucian role ethics for her advisor but shes tired of the same old Mencius vs Xunzi quiz. she wants a decision tree built around this made-up edge case: an adopted son raised with full filial rituals just learned hes not biologically related, and now his parents want him to donate a kidney. the tree should split positions by concrete claims — do obligations come from blood, from performing li correctly, or from cultivated virtue? if a role clashes with bodily autonomy, is there a hierarchy or do they dissolve? and is there some universal human role that trumps everything? she wants six or seven leaves, each named if someone real defends it or marked 'unnamed' with its weirdest commitment. include the empty spots, like the view that adoption revelation instantly kills the duty — is that incoherent or just unexplored? flag any two leaves the tree cant actually tell apart. write it like youre explaining to a novelist who barely passed phil 101. drop a typo or two, i wont mind.
reasoning: |-
  Okay, the user is writing a novel scene where a grad student is mapping Confucian role ethics through a fictional edge case. This isn't just academic—it's a creative exploration for a story. The protagonist is tired of traditional debates (Mencius vs Xunzi) and wants something fresh: a decision tree for an adopted son asked to donate a kidney after learning he's not biologically related. The tree needs concrete splits (blood ties vs ritual performance vs cultivated virtue), bodily autonomy conflicts, and whether universal roles override specifics. Six or seven endpoints are requested, some named after real philosophers, others "unnamed" with odd implications. Empty spots in the theory should be highlighted, and ambiguities flagged. The explanation must be novelistic—accessible to someone with minimal philosophy background—and include deliberate typos for authenticity.  

  Hmm, the user's framing suggests they want this to feel organic to a tired grad student's voice, not sterile academia. The kidney scenario is genius—it forces extreme tension between Confucian duty (filial piety) and modern values (bodily autonomy). The "unnamed" leaves and "empty spots" request shows they want to expose philosophical cracks, not just give neat answers. And those flagged ambiguities? That’s gold for character conflict—their protagonist can rant about how real ethics is messy.  

  Breaking this down: First, the tree’s trunk is the son’s obligation origin. Three branches: blood (biological), li (ritual performance), or virtue cultivation. Then each sub-branches when bodily autonomy clashes. Does duty dissolve? Hierarchy kick in? Finally, a universal human role layer.  

  For the leaves:  
  - **Blood-based duty**: Mencius would say "no obligation now"—but that’s cold, so make it Leaf 1. Contrast with an "unnamed" view where blood doesn’t matter if li was performed (Leaf 2), dripping with irony since Confucius prioritized ritual over biology.  
  - **Li-based**: Most Confucian. If li was perfect, obligation holds (Leaf 3, Xunzi-esque). But if bodily autonomy conflicts? Sub-split: Leaf 4 (hierarchy: parents > body) or Leaf 5 (dissolves—radical!).  
  - **Virtue-based**: Mencius’ jam. Leaf 6: virtue demands refusal to avoid resentment. Leaf 7 (unnamed): twisted "universal role" where kidney donation is cosmic duty.  

  Empty spots: Highlight that "adoption-revelation-kills-duty" isn’t a real position—it’s too brutal for Confucians who care about care, not just blood. But it’s a gap; no one addressed if ritual bonds depend on biological truth.  

  Ambiguities to flag: Can’t cleanly separate Li Branch (ritual) from Virtue Branch—they blur. Also, is "universal role" even Confucian? More Daoist or Buddhist. That’s the point: real philosophies have fuzzy edges.  

  Typos: Sprinkle a few—"obligaton," "immedietly"—to keep it human. The voice should be a mix of academic exhaustion ("ugh, Mencius again") and dark humor ("kidney? yikes").  

  User’s deeper need? They’re using philosophy to fuel character and plot. The tree isn’t an answer—it’s a tool for the protagonist to wrestle with. So the response should give her ammunition to sound clever, frustrated, and alive.
answer: |-
  Here's your decision tree for the Confucian kidney conundrum, designed for maximal narrative friction and weird philosophical crevices. I've built it as promised – concrete splits, six leaves, named/unnamed positions, empty spots flagged, ambiguities noted. Imagine your grad student slapping this down with a tired flourish:

  **The Confucian Kidney Decision Tree:  
  (Filial Piety vs. Bodily Autonomy in an Adoption Revelation Scenario)**

  **TRUNK QUESTION: Where does the son's obligation originate?** (The Core Split)

  1.  **FROM BLOOD (Biology):** Obligation comes primarily from biological kinship.
      *   *NEXT SPLIT: Revelation removes biological tie. Does obligation...*
          *   **A. Dissolve Immediately?** (Leaf 1: **The Strict Blood Purist - Unnamed**)
              *   **Claim:** "No shared blood, no *real* father-son bond. The ritual was performed under false pretenses. Obligation vanishes *immedietly* upon revelation. Kidney request is an outrageous imposition by strangers."
              *   **Weird Commitment:** Views the entire adoptive relationship as fundamentally invalidated by the biological truth. Performing Li perfectly changes nothing. Bodily autonomy is absolute here because there's *no counter-obligation*.
              *   **Empty Spot?** Kinda. Confucians rarely *totally* dismiss care given/received, but this view pushes blood-logic to its coldest extreme. Arguably incoherent with Confucian emphasis on *cultivated* relationships, but logically possible if blood is the *only* source.
          *   **B. Persist via Li (Ritual Performance)?** (Leaf 2: **The Ritual Alchemist - Unnamed**)
              *   **Claim:** "Blood sparked the initial role, but decades of correctly performed Li rituals *transmuted* the bond into something real and obligatory, independent of biology. The son *is* the son because he acted as the son, and they acted as parents."
              *   **Weird Commitment:** Ritual performance literally *creates* or *sanctifies* the familial essence, overriding biological facts. Obligation remains strong. Bodily autonomy clash next...
              *   *NEXT SPLIT: Parents request kidney. Does obligation...*
                  *   **i. Trump Bodily Autonomy?** (Leaf 3: **The Li Absolutist - Xunzi Vibes**)
                      *   **Claim:** "The role *defines* the self. Filial piety, solidified through perfect Li, demands ultimate sacrifice. Refusal shatters the ritual order (*li*) itself and the son's cultivated identity. He must donate."
                      *   **Defender:** Leans hard on Xunzi's emphasis on ritual (*li*) as the framework for creating ethical humans and social order. The role, forged through li, is paramount.
                  *   **ii. Dissolve Under Physical Invasion?** (Leaf 4: **The Bodily Boundary Keeper - Unnamed**)
                      *   **Claim:** "Li governs social conduct and care, not corporeal violation. While the son owes respect, care, and support, the demand for an organ crosses a line where ritual obligation ends and bodily sovereignty begins. His duty is profound, but not *this*."
                      *   **Weird Commitment:** Draws a bright, physical line that Li cannot cross, even for filial piety. Suggests a limit to role subsumption based on the physical body's integrity.

  2.  **FROM LI (Ritual Performance):** Obligation comes from the correct enactment of relational roles over time, regardless of origin.
      *   *NEXT SPLIT: Revelation happened, but Li was performed correctly. Obligation stands. Parents request kidney. Does obligation...*
          *   **A. Trump Bodily Autonomy?** (Leaf 3: **The Li Absolutist - Xunzi Vibes** - *See Above*)
              *   *(This leaf is reached from both Blood-Persist-via-Li and the pure Li branch)*
          *   **B. Dissolve Under Physical Invasion?** (Leaf 4: **The Bodily Boundary Keeper - Unnamed** - *See Above*)
              *   *(This leaf is reached from both Blood-Persist-via-Li and the pure Li branch)*

  3.  **FROM REN/CULTIVATED VIRTUE:** Obligation stems from the cultivated character (*ren*) of the individuals and the mutual care developed, making biological origin and even strict ritual performance secondary.
      *   *NEXT SPLIT: Revelation happened. Does the cultivated relationship & virtue...*
          *   **A. Create Unconditional Obligation?** (This path gets messy - see ambiguity below)
          *   **B. Allow for Contextual Judgment?** (Leaf 5: **The Ren Contextualist - Mencius Leaning**)
              *   **Claim:** "The bond is defined by mutual care, respect, and the *virtue* cultivated within it. The son must weigh the request against his own *ren* (benevolence) and *yi* (righteousness). Does donating uphold genuine care, or breed resentment? Does refusal stem from selfishness or rightful self-preservation? Virtue, not blind duty, guides the answer."
              *   **Defender:** Mencius, emphasizing innate sprouts of virtue and righteous discernment (*yi*). The *quality* of the relationship and the son's cultivated character determine the virtuous response, not just the role label or ritual history. Kidney donation is *not* automatically required.
          *   *NEXT SPLIT (for both A & B paths): Is there a Universal Human Role?*
              *   **i. YES, Universal Role Trumps:** (Leaf 6: **The Cosmic Filialist - Unnamed**)
                  *   **Claim:** "Beyond biological or specific family roles, there's a universal 'Child-of-Humanity' role. Filial piety is owed to *anyone* who raised you with care, as an instance of this universal debt. Refusing the kidney betrays this deepest role. He must donate."
                  *   **Weird Commitment:** Elevates filial piety to a near-mystical, universal duty disconnected from specific relational history or biology. The parents represent "Parents" as an archetype.
              *   **ii. NO, No Universal Role:** (Leaf 5: **The Ren Contextualist - Mencius Leaning** - *See Above* OR leads back to contextual judgement without a trump card)
                  *   *(Leaf 5 is the terminus if no universal role exists or it doesn't mandate donation)*

  **Empty Spots Flagged:**
  *   **The Instant Dissolution (Blood A):** As noted, this is mostly an empty spot. Confucianism's focus on care and reciprocity makes pure instant dissolution upon biological revelation philosophically jarring, though emotionally possible. It's *logically* possible but *thematically* unexplored because it negates the relational work Confucianism values.
  *   **Unconditional Obligation from Virtue (Ren A):** This path is inherently fuzzy. Pure *ren* rarely mandates *unconditional* specific actions like organ donation. It flows into contextual judgment (Leaf 5) or requires the Universal Role (Leaf 6) to force an answer. There's no clean "Virtue DEMANDS the kidney, unconditionally" leaf that isn't covered elsewhere.

  **Ambiguities Flagged (Leaves the Tree Can't Cleanly Separate):**
  1.  **Li Absolutist (Leaf 3) vs. Cosmic Filialist (Leaf 6):** Both demand donation. Is it because the *specific ritual role* is paramount (Li Absolutist), or because the parents embody a *universal archetype* (Cosmic Filialist)? The *justification* differs, but the *action* is the same. A character could hold elements of both.
  2.  **Ren Contextualist (Leaf 5) vs. Bodily Boundary Keeper (Leaf 4):** Both *can* justify refusal. Is it refusal based on virtuous discernment of the relationship's current state and the son's well-being (Ren Contextualist), or refusal based on a fundamental principle that *no* role justifies bodily violation (Bodily Boundary Keeper)? The reasoning overlaps, especially if the contextualist argues bodily integrity is *part* of virtue.

  **Nutshell for Your Protagonist:** "So, advisor, this moves us *past* Mencius/Xunzi ping-pong. The kidney case explodes the simple 'filial piety good' mantra. We've got blood purists saying 'no way', ritual magicians saying 'you must', virtue ethicists saying 'maybe, maybe not', and a couple of weirdos invoking cosmic duty or bodily forcefields. Plus, huge gaps – nobody really says the bond *instantly* dies with the DNA test, which tells us something. And sometimes, totally different reasons lead to the same messy action. Real life, right? Pass the coffee." *<deliberately spills some coffee on the diagram>*
