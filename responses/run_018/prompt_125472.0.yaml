answer: |-
  The coffee in the lab’s break room had gone lukewarm, but Maya and Arjun were too engrossed to notice. The risk score display glowed on Maya’s tablet: 79.87.  

  “Look,” Maya said, tapping the screen. “The boundary *has* to be sharp. Just because we can’t *see* whether it’s 79.94 or 80.003 doesn’t mean it isn’t *there*. The system’s behavior changes discontinuously at *some* point—catastrophic failures aren’t vague. Our ignorance doesn’t make reality fuzzy.”  

  Arjun stirred his coffee slowly. “But ‘unsafe to deploy’ isn’t like ‘contains plutonium.’ It’s a *judgment* built from vague sub-metrics—hallucination rates, goal misgeneralization scores. Those aren’t precise natural kinds. When you stitch vagueness together, you don’t get a hidden razor edge. You get borderline cases where ‘unsafe’ literally lacks a truth-value. Forcing a binary onto that is the category mistake.”  

  Maya leaned forward. “Truth-value gaps don’t deploy models, Arjun. If we say ‘no truth-value’ at 80.0, what do we *do* Tuesday at 9 AM? Flip a coin? Your supervaluation says all precisifications are equally valid—but that just kicks the can. *We* need to choose.”  

  “No,” Arjun countered. “It forces us to admit the cutoff is *conventional*. Like ‘bald’—there’s no fact about the exact hair that makes someone bald. We agree on a line for practicality. But you’re insisting there’s a *discoverable fact* about whether 79.99 is safe. Show me the experiment that reveals it.”  

  “The fact is in the system’s causal structure! Run infinite tests: there’ll be a score where failure probability jumps non-linearly. We *model* it as continuous, but reality bites back. Your ‘no truth-value’ is epistemic surrender.”  

  “Is it?” Arjun’s voice sharpened. “Your ‘hidden jump’ assumes all sub-scores are equally precise. But our coherence metric? It’s rated by human evals. If three reviewers disagree whether a response is ‘unacceptably incoherent,’ where’s the fact of the matter? Vagueness compounds. Pretending otherwise gives false confidence in this—” he waved at the tablet—“decimal theater.”  

  Maya paused. “So we throw our hands up? If ‘unsafe’ has no truth-value at 80.0, does it suddenly snap to ‘true’ at 80.1? 81? When does the gap *close*?”  

  “It doesn’t ‘snap.’ Supervaluationism accepts that *some* thresholds make ‘unsafe’ true—say, 90.0—and some make it false, like 10.0. Borderlines are the fog in between. The point is, choosing 80.0 isn’t *discovery*; it’s *decision*. And admitting that pushes us to design better: maybe a buffer zone, graduated safeguards—”  

  “—Or we accept that *any* line we pick is a proxy,” Maya cut in, “but one that latches onto a real discontinuity we’re too myopic to measure finely. Your ‘fog’ is just our current resolution limit.”  

  Arjun sighed. “Then find me the discontinuity in the semantics of ‘unsafe.’ Is a model at 80.01 unsafe if it fails in Swahili but not English? In low-light sensors? Your ‘real boundary’ keeps retreating into the machinery. We built the metric, Maya. Its precision is borrowed.”  

  The tablet auto-refreshed: 79.92. Both stared at the number, the coffee cold, the deployment clock ticking. Neither had moved an inch, yet the chasm between them yawned—one anchored in hidden thresholds, the other in the refusal to pretend vagueness wasn’t real. The decimal glared back, indifferent.  

  “So Tuesday at 9 AM?” Maya finally asked, quieter.  

  “We pick,” Arjun said. “But we don’t call it truth.”  

  Maya nodded slowly. “And we watch the borderlands like hawks.”  

  They clicked their mugs in a tense, caffeinated standoff. The score flickered again. 79.96.
