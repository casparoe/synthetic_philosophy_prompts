prompt: |-
  hey, before I commit to any particular theory of advance directives I want the full spec sheet. Write the desiderata: what an adequate account of the earlier self's authority over the later one actually has to deliver. The cases it must get right -- not just the classic Alzheimer's refusal, but also the trickier scenario where the later self isnt incompetent exactly, just conceptually different: they wrote 'no artifical nutrition' when they conceived of dignity as a narrative project, but now in advanced dementia they experience each feeding as pure present-tense pleasure with no sense of narrative at all. The distinctions it cant collapse -- authority versus welfare, binding versus advising, expressing values versus predicting preferences. The legal and clinical findings it cant flat-out contradict. Flag any pair of desiderata that look jointly unsatisfiable; I suspect there's real tension between honoring autonomy and not harming a self that genuinely lacks the evaluative framework the directive was written in. Then briefly score three standard views -- the autonomy-first view, substituted judgment, and the 'no authority across conceptual rupture' position -- against your list. Keep the weight on the criteria and why each is a genuine requirement, not on the scorecard. No bibliography, just the reasoning.
reasoning: |-
  Okay, the user is asking for a comprehensive list of desiderata for evaluating theories of advance directives, specifically focusing on the authority of an earlier self over a later one. They mentioned tricky cases like when the later self isn't incompetent but has a different conceptual framework. They want distinctions like authority vs. welfare, binding vs. advising, and more. They also want to know if any desiderata conflict, like autonomy vs. avoiding harm to a self with a different framework. Plus, they want three standard views scored against those criteria without a bibliography.

  First, I need to outline all the necessary criteria. The user wants the spec sheet: what a theory must deliver. The cases to cover include not just standard Alzheimer's refusals but also the scenario where the later self experiences life differently, like finding pleasure in feeding despite a directive against it. That's crucial because it highlights a conflict in values versus present experience.

  Then the distinctions: authority vs. welfare. The theory must differentiate between the earlier self's right to decide and what might be best for the later self's well-being. Binding vs. advising is another key point—whether the directive is mandatory or just a recommendation. Expressing values vs. predicting preferences: the directive might state core values rather than anticipated future desires.

  Legal and clinical constraints are important. The theory can't contradict established laws like the Cruzan case or clinical practices that require clear directives. Also, practical feasibility matters; clinicians need to implement it without excessive burden.

  Flagging tensions is essential. The user suspects a conflict between honoring autonomy and not harming a later self that lacks the original evaluative framework. That's a real dilemma. If the later self can't comprehend the reasons for the directive, enforcing it might cause harm without respecting autonomy in a meaningful way.

  Now, assessing the three views: autonomy-first (binding authority), substituted judgment (what the person would want now), and the no-authority position (only if conceptual continuity). I need to score them against each criterion. Autonomy-first does well on authority and legal aspects but fails when the later self's welfare is harmed and ignores conceptual rupture. Substituted judgment handles changing preferences but struggles with who decides and the values vs. preferences distinction. The no-authority view respects the later self's welfare but completely undermines advance directives, which conflicts with legal requirements.

  The user's deeper need might be understanding the philosophical underpinnings to form their own stance, possibly for academic research or policy-making. They want clarity on inherent tensions and whether a middle ground exists. Highlighting the autonomy-welfare conflict addresses their suspicion and shows the complexity, which is probably what they're after—realizing no theory perfectly satisfies all criteria.
answer: |-
  Here is the comprehensive desiderata list for an adequate account of advance directive authority, followed by a brief assessment of the three standard views:

  **Core Desiderata for an Account of Advance Directive Authority:**

  1.  **Resolve Core Alzheimer's Refusal:** The account must justify why/when a clear prior refusal of specific treatments (e.g., antibiotics, CPR) by a competent self should be respected for a later incompetent self with dementia lacking current decision-making capacity. This is the foundational case for ADs.
  2.  **Handle "Conceptual Rupture" Scenarios:** The account must provide a principled way to address cases where the later self:
      *   Possesses *some* level of consciousness/sentience/pleasure-pain capacity.
      *   Lacks the *conceptual framework* or *evaluative perspective* that motivated the directive (e.g., cared about narrative integrity, now exists purely in a pleasurable present).
      *   May even appear to experience the refused intervention (like tube feeding) as subjectively *positive*.
  3.  **Distinguish Authority from Welfare:** It must clearly differentiate the *source* of the directive's force:
      *   **Authority:** Is it derived solely from the prior self's autonomous decision-making right?
      *   **Welfare:** Is it based on the belief that following it promotes the *best interests* of the later self?
      *   *(Requirement: The account must explain which grounds the force of the directive and how conflicts are resolved).*
  4.  **Distinguish Binding from Advising:** It must specify when a directive:
      *   **Binds:** Creates a decisive obligation for surrogates/clinicians, overriding other considerations (including perceived current welfare).
      *   **Advises:** Provides strong evidence of prior values/preferences but can be overridden by other factors (e.g., changed circumstances, current welfare).
  5.  **Distinguish Expressing Values vs. Predicting Preferences:** It must account for the nature of the directive's content:
      *   **Values:** Statements of core beliefs, conceptions of a good life/death, integrity (e.g., "I value independence over prolonged life," "Life without relational capacity isn't worth living").
      *   **Predictions:** Attempts to forecast what one *would* want in a future state based on current projections (e.g., "I think I'd hate being dependent").
      *   *(Requirement: The account must explain which type of statement carries authority and why).*
  6.  **Respect Competent Revocation:** The account must explain how and under what conditions a currently competent later self can revoke or modify their prior directive, especially if their values/preferences demonstrably change *before* losing competence.
  7.  **Acknowledge Identity/Psychological Connectedness:** It must grapple with the philosophical question: *To what extent is the severely demented patient the "same person" as the author of the directive?* How does the degree of psychological connectedness (shared memories, values, goals) impact the authority of the prior self? This is crucial for the "Conceptual Rupture" case.
  8.  **Cohere with Foundational Legal Principles:** Cannot flatly contradict core legal tenets underpinning ADs:
      *   **Self-Determination:** The right of competent persons to control future medical treatment (Cruzan v. Director, Missouri Dept. of Health).
      *   **Clear & Convincing Evidence Standard:** The high bar for proving prior wishes in the absence of a formal directive (relevant for substituted judgment).
      *   **Proxy Authority:** The role of designated surrogates to interpret/implement directives.
  9.  **Be Clinically Applicable:** Must provide actionable guidance for clinicians and surrogates facing real-time decisions. It cannot rely on impossibly nuanced philosophical distinctions under time pressure or with limited information. Must account for the typical specificity/vagueness of real directives.
  10. **Minimize Harm:** The account must provide justification when following a directive foreseeably causes suffering to a sentient later self (e.g., withholding feeding perceived as pleasurable), or conversely, when overriding it causes a violation perceived by the prior self (e.g., prolonging a life they deemed undignified).
  11. **Address Post-Authoring Value Changes:** Must have a stance on how to handle situations where a person demonstrably changes their core values *after* authoring a directive but *before* losing competence (e.g., religious conversion). Does the earlier or later competent self hold sway?

  **Flagged Tensions:**

  *   **Autonomy (D1, D3a, D5-Values) vs. Avoiding Harm & Welfare of the Later Self (D2, D3b, D10):** This is the core tension. Honoring the prior autonomous choice (especially one based on values/narrative) risks imposing significant harm (denying subjectively positive experiences) or violating the welfare interests of a later self who lacks the cognitive framework to understand *why* the intervention is being withheld. The later self experiences only the deprivation, not the value integrity the prior self sought to protect. Conversely, overriding the directive to prevent this harm violates the prior self's autonomy and treats them as lacking authority over their future existence in that state.
  *   **Binding Authority (D4a) vs. Conceptual Rupture/Identity Shift (D2, D7):** If psychological connectedness is sufficiently broken (D7), does the authority of the prior self simply dissolve? Can one self bind a conceptually distinct future self against its apparent present interests (D10)?
  *   **Expressing Values (D5-Values) vs. Clinical Applicability & Welfare (D9, D10):** Value-based directives ("no life without dignity") are powerful but inherently ambiguous. Interpreting and applying them to specific clinical scenarios, especially when the later self's experience contradicts the anticipated "indignity," is fraught and risks misapplying the prior self's intent or causing unwarranted harm.

  **Assessment of Standard Views Against Desiderata:**

  1.  **Autonomy-First (Binding Authority):**
      *   **Strengths:** Excels at D1 (core refusal), strongly affirms D3a (Authority), D4a (Binding), D5-Values (prior values paramount), D8 (Self-Determination). Clear for D6 (only competent revocation).
      *   **Weaknesses:** Fails D2 (Conceptual Rupture - enforces prior values on an entity that can't comprehend them, causing potential harm D10). Struggles with D7 (Identity - ignores rupture). Risks violating D10 (Harm) and D3b (Welfare). Can be rigid for D9 (Application) with vague directives. Neglects D11 if change occurs pre-incompetence.

  2.  **Substituted Judgment (What They Would Want Now):**
      *   **Strengths:** Addresses D2 (Conceptual Rupture - focuses on *current* hypothetical preference), better on D10 (Harm - aims for current welfare), handles D11 (value changes). More flexible for D9 (Application) by considering current state.
      *   **Weaknesses:** Undermines D1 & D4a (Authority/Binding - directive is just evidence, not decisive). Blurs D3 (Authority/Welfare) & D5 (Values/Predictions - mixes prior evidence with current welfare). Difficult to apply D8 (requires clear evidence often lacking, contra Clear & Convincing standard). Who judges "what they would want now"? Risks overriding explicit prior values (D5-Values) based on speculation or welfare concerns (D3b).

  3.  **No Authority Across Conceptual Rupture:**
      *   **Strengths:** Directly addresses D2 (Conceptual Rupture) and D7 (Identity). Prioritizes D10 (avoiding harm to current self) and D3b (current welfare).
      *   **Weaknesses:** Fatally undermines D1 (core refusal), D3a (Authority), D4a (Binding), D5-Values (ignores prior values), and D8 (Self-Determination). Reduces directives to mere advisory notes (D4b) at best. Provides no principled basis for *any* prior refusal once a significant rupture occurs, contradicting the fundamental purpose of ADs. Ignores D6 (revocation irrelevant if no authority exists).

  **Conclusion:** The desiderata reveal profound tensions, particularly between the prior self's autonomy/values and the welfare/subjective experience of a later self experiencing conceptual rupture. No standard view satisfies all criteria; each prioritizes different clusters (Autonomy-First: prior self's rights; Substituted Judgment: current self's hypothetical welfare; No Authority: current self's actual welfare) while struggling significantly with the opposing concerns. An adequate account must explicitly confront the autonomy/welfare tension inherent in D2 and provide a principled resolution that neither completely negates advance planning nor ignores the moral significance of the radically changed later self.
