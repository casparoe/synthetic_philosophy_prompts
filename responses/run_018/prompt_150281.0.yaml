  The following decision tree categorizes interpretations of Hegel's master-slave dialectic using three binary questions. Each branch node poses a philosophical claim answerable without prior knowledge of interpreters. The tree generates eight possible leaves, with named positions mapped to specific combinations. Unoccupied leaves include a brief diagnosis.  

