prompt: |-
  i need the desiderata for any theory that claims to explain what work *means* after heavy automation — not just "do we have jobs?" but what happens when the human labor left behind is mostly maintainance and oversight that doesn't feel like work. the theory has to handle: (1) displacement where you're technically employed but your task is just watching algorithms, (2) why care work resists automation for relational reasons not technical ones, (3) the distinction between losing income and losing social recognition. list the requirements with the case behind each, flag which ones are non-negotiable vs camp-specific, and say which single desideratum kills the usual "work is central to human dignity" narratives. no citations needed, just the spec.
reasoning: |-
  Okay, the user is asking for a set of requirements for any theory that explains what work means in a heavily automated future. They specifically want to address three key issues: the nature of maintenance/oversight roles that don't feel like "real work," why care work resists automation for relational reasons, and the distinction between losing income versus social recognition. 

  Hmm, this feels like a request from someone deeply engaged in post-work theory or policy design—probably an academic, futurist, or policymaker. The phrasing ("desiderata," "non-negotiable vs camp-specific") suggests they want rigor, not hand-waving. They’re also clearly frustrated with simplistic "jobs apocalypse" narratives or empty "dignity of work" platitudes. Underneath, I sense anxiety about social fragmentation: *If work evaporates, what holds society together?*  

  Breaking it down:  
  First, the three cases need unpacking. The "watching algorithms" scenario (Case 1) is about *existential pointlessness*—when your job is passive and replaceable, but you’re still technically employed. Care work (Case 2) is their counterweight; it’s sticky not because robots can’t wipe butts, but because humans crave *being seen* by other humans. Case 3 is the core trauma: unemployment isn’t just financial ruin; it’s social death.  

  The killer desideratum has to target the "work=dignity" assumption. That narrative collapses when work becomes meaningless surveillance (Case 1) or when non-workers (e.g., retirees) are dignified without "jobs." So Desideratum 5 is the stake through its heart: *Meaning must be separable from productivity.*  

  Non-negotiables: Anything preventing dystopia. If a theory can’t explain why care work survives (D4) or how to decouple income from work (D1), it’s useless. Camp-specific stuff is where ideologies diverge—like whether we *need* universal income (D2) or just better job redesign.  

  User’s probably time-pressed. I’ll keep it dense, no fluff. They want a spec—so I’ll structure like one: desiderata, rationale, non-negotiable flags. No citations, but the ghosts of Marx, Arendt, and Graeber haunt this anyway.
answer: |-
  Here’s the specification of desiderata for a theory explaining the meaning of work post-heavy automation, structured for clarity and rigor:

  ---

  ### **Core Desiderata**  
  *(Non-negotiable: Required for any viable theory)*  
  1. **Decoupling Income from Labor**  
     - *Case*: Automation displaces jobs but not the need for livelihood (Case 3).  
     - *Requirement*: Must explain how societies distribute resources when traditional employment is scarce.  
     - *Why Non-negotiable*: Avoids dystopian inequality where "useless" humans lack survival means.  

  2. **Redefining Social Recognition Beyond Productivity**  
     - *Case*: Maintenance/oversight roles (Case 1) lack traditional "effort," risking perceived worthlessness despite employment.  
     - *Requirement*: Must propose alternative sources of dignity (e.g., creativity, community, stewardship) unrelated to economic output.  
     - *Kills "Work = Dignity" Narratives*: **This desideratum directly invalidates claims that work *itself* is central to dignity**, as passive roles (Case 1) or care work (Case 2) defy productivity-centric value.  

  3. **Accounting for Relational Value in Care Work**  
     - *Case*: Care work resists automation due to human relational needs, not technical limits (Case 2).  
     - *Requirement*: Must explain why human presence in care is irreplaceable for psychological/social reasons (e.g., empathy, trust, existential validation).  

  4. **Distinguishing Material Loss from Symbolic Loss**  
     - *Case*: Unemployment’s trauma isn’t just lost income but lost identity/status (Case 3).  
     - *Requirement*: Must separate economic safety nets (income) from cultural mechanisms for social belonging (recognition).  

  ---

  ### **Contextual Desiderata**  
  *(Camp-Specific: Shape theories but admit ideological variation)*  
  5. **Redesigning "Work-Like" Activities**  
     - *Case*: Algorithm-watching roles (Case 1) feel meaningless despite being "jobs."  
     - *Requirement*: Should address whether such roles can be transformed (e.g., via skill-upscaling) or abolished without social harm.  
     - *Camp-Specific*: Pro-automation camps may optimize for efficiency; humanist camps may prioritize role elimination.  

  6. **Valuing Non-Transaction-Based Contributions**  
     - *Case*: Care work’s (Case 2) worth exists outside market logic.  
     - *Requirement*: Must articulate how non-productive acts (e.g., art, volunteering) gain cultural esteem.  
     - *Camp-Specific*: Libertarian theories may reject formal valuation; collectivist theories may advocate state-funded recognition.  

  7. **Temporal Transition Framework**  
     - *Case*: Displacement’s psychological impact (Case 3) differs between generations.  
     - *Requirement*: Should model how societies manage intergenerational shifts in work ethics.  
     - *Camp-Specific*: Accelerationists embrace rapid change; conservatives emphasize gradual cultural adaptation.  

  ---

  ### **Why Standard Narratives Fail**  
  - **"Work = Dignity" dies on Desideratum 2**: If oversight roles (Case 1) are devoid of agency or purpose, yet "employment" persists, the narrative cannot explain dignity’s source. Care work (Case 2) further proves dignity arises from *relationships*, not labor. Automation decouples "being needed" from "being employed," rendering work-centric dignity obsolete.

  ---

  ### **Summary of Non-Negotiables vs. Negotiables**  
  | **Aspect**                          | Non-Negotiable | Camp-Specific |  
  |-------------------------------------|----------------|---------------|  
  | Income-security without traditional work | ✓             |               |  
  | Dignity beyond productivity          | ✓             |               |  
  | Care work’s relational essence       | ✓             |               |  
  | Income vs. recognition distinction   | ✓             |               |  
  | Transformation of passive roles      |               | ✓             |  
  | Valuing non-economic contributions   |               | ✓             |  
  | Managing cultural transition         |               | ✓             |  

  This spec forces theories to confront automation’s existential crisis: **Human purpose must survive the obsolescence of labor.**
