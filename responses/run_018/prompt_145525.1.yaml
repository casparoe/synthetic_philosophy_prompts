answer: |-
  **Bottom line: The non-identity problem destabilizes *both* person-affecting harm arguments *and* impersonal aggregation approaches like average utilitarianism for identity-affecting choices.**

  Parfit's problem shows that comparing the welfare of specific individuals across different possible futures (the "same people" requirement) is impossible when choices alter who exists. Impersonal theories avoid this by comparing aggregate states (like average welfare) without tracking specific individuals. However, calculating aggregates like average welfare *still* requires defining *which* population's welfare is being compared across worlds – the reference class problem you identify.

  When a choice (like a climate treaty) changes *who* exists in the future (humans or animals), selecting the population to compare (e.g., "humans born after 2100", "all sentient beings alive in 2150") becomes arbitrary. There is no non-arbitrary way to say we are comparing the average welfare of "the future population" in World A vs. World B, because "the future population" consists of entirely different individuals in each world. The choice of reference class determines *which* set of non-existent possible beings we are comparing – a choice lacking objective justification and susceptible to the same kind of arbitrariness the non-identity problem highlights. Thus, cross-world comparisons of aggregated welfare metrics are also undermined for identity-affecting choices.
