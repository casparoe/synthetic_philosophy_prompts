answer: |-
  Based on your description of Nietzsche's passage and its application to your archival dilemma, here's an analysis focused strictly on his framework:

  1.  **Interpretation of Distortion: Structural, not solely Intentional**
      *   Nietzsche emphasizes the *systemic effect* of institutional control. While specific victors *exercise* this control, the distortion arises from the very nature of how "monumental history" functions within institutions. It "selects and magnifies" deeds aligning with present power, inherently excluding actions that don't fit this mold. The "asymmetry of preservation" isn't framed as a deliberate conspiracy for each event, but as a *structural feature* of how power utilizes history: the archive becomes an "instrument of domination" because the institutionally powerful decide which actions become part of the monumental record ("moniments") and which "vanish." The exclusion is systematic because the *criteria for preservation* serve the existing hierarchy.

  2.  **Application to Fragmentary Record: Blurring the Distinctions, Emphasizing the Asymmetry**
      *   The monumental/critical distinction becomes problematic for an *unarchived past*. The cooperative's history, excluded from the monumental record, *never had the chance* to be monumentalized by its own institutional power (which was destroyed). Your ledger represents a past actively denied recognition.
      *   **Monumental Risk:** Building a narrative *glorifying* the workers as flawless heroes or the cooperative as a utopia *would* be creating a new monumental history, mirroring the ambition of celebrating collective action. Nietzsche warns against this uncritical magnification.
      *   **Critical Imperative & Limitation:** The ledger's primary value, within Nietzsche's framework, is for *critical history*. Its existence *reveals the asymmetry* and directly challenges the official monumental narrative's claim to comprehensiveness and legitimacy. It exposes the exclusion. However, critical history, for Nietzsche, is about *judging and destroying* parts of the past harmful to life. While the ledger enables criticism of the *official story*, it struggles to *reconstruct* a full, positive "monumental" past for the workers precisely because it *was* excluded – the asymmetry prevents that completeness. The distinction blurs because the critical act (exposing the exclusion) is paramount, while building a *new positive narrative* risks falling into the monumental trap.

  3.  **Epistemic Status of Ledger: Revelatory of Asymmetry, Limited by Fragmentariness & Lack of Authority**
      *   The preservation asymmetry argument fundamentally shapes the ledger's status:
          *   **Revelatory Power:** Its very existence, especially its contradiction of the official record, is *proof* of the structural asymmetry Nietzsche describes. It demonstrates that the "absence of contrary records" surrounding the cooperative's demise was not accidental but a consequence of institutional exclusion.
          *   **Epistemic Challenge:** Precisely *because* of the structural asymmetry (its exclusion from the official archive, its survival being accidental/private), the ledger faces an uphill battle for recognition as "history" within the dominant institutional framework. Nietzsche argues that history gains its legitimizing power *through* institutional monumentalization. The ledger lacks this authority.
          *   **Truth Claim vs. Institutional Power:** While the ledger may contain accurate details, its *status* as historical evidence is undermined by the structure that excluded it. Its power lies not necessarily in establishing a new, complete "truth" to replace the old one, but in *destabilizing* the official monumental narrative by revealing the *process of exclusion* upon which that narrative relies. Its epistemic value is primarily critical and revelatory of the system, rather than offering an institutionally authoritative, complete counter-monument.

  4.  **Unresolved Residue: The Methodological Path Forward**
      *   Nietzsche's framework powerfully diagnoses the problem (structural asymmetry, monumental distortion) and defines the dangers (uncritical glorification, pure negation). However, it **does not provide a clear methodology** for how to construct a *positive, credible historical account* from fragmentary, excluded records *without* institutional authority and while avoiding the pitfalls of either monumentalizing the oppressed or merely critically negating the oppressor. The core question remains: *How, practically and epistemically, can the silenced past be responsibly reconstructed and integrated into historical understanding when the structural conditions (the preservation asymmetry) inherently prevent its full, authoritative recovery?*

