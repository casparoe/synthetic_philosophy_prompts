answer: |-
  Here are eight interview questions designed to press the core arguments of boundary endogeneity theory, including your specific requests and follow-ups anticipating likely rebuttals. They aim to challenge the theory's foundations, implications, and testability:

  1.  **The Core Circularity Charge:** "You argue that colonial borders were drawn *because* certain institutional setups (like extractive potential) were already viable there, making it circular to use those borders to *study* institutional effects. Isn't the historical record messier? Can you point to specific cases where the *primary documented motivation* for a border placement was the pre-existing institutional capacity for extraction, rather than, say, rival colonial claims, geographic features, or simple administrative convenience?"
      *   *(Potential Follow-up if she cites specific cases):* "Even in those cases, how do we definitively separate the cartographer's *intent* (drawing where extraction is possible) from the *actual pre-condition* (extraction being possible there)? Isn't attributing intent to complex historical processes itself risky?"

  2.  **Culture: The Residual Bin?** "A lot of institutional/geography arguments treat 'culture' as a residual category – the unexplained variance left after controlling for institutions and geography. Does your theory inadvertently do the same? If institutions and geography co-evolved *with* borders in this endogenous way, does 'culture' just become the bucket for whatever sticky, pre-colonial factors your model *also* can't capture or measure?"
      *   *(Anticipated Rebuttal Follow-up: Culture as unmeasured institutional persistence)*: "You might say culture *is* that persistence – unmeasured institutional legacies. But doesn't that risk making your theory unfalsifiable? If every cultural difference potentially reflects a deeper, unobserved institutional history entangled with geography and borders, how could we ever empirically distinguish cultural effects from institutional ones within your framework?"

  3.  **The (Im)possibility of Counterfactuals:** "You emphasize the deep co-evolution of institutions and geography over centuries. If they are so fundamentally entangled, is it even *conceptually possible* to imagine a clean historical counterfactual that genuinely separates, say, the effect of 'good institutions' from the underlying geographic luck that may have fostered them? Or does your theory imply that kind of separation is a methodological fantasy?"
      *   *(Anticipated Rebuttal Follow-up: True separation is impossible)*: "If true separation *is* impossible, as you suggest, doesn't that undermine not just border discontinuity studies, but *all* causal claims about institutions vs. geography in development? Doesn't it render the entire debate fundamentally speculative?"

  4.  **Korea & Africa: Natural Experiments or Narrative Fallacies?** "Proponents often cite the partition of Korea or arbitrary colonial borders in Africa as 'natural experiments' proving institutional primacy. You clearly disagree. Beyond the general endogeneity, what's the *specific* flaw in using these cases? Is it that the partition wasn't random (e.g., Cold War politics, strategic considerations), or that the 'treatment' (different institutions) wasn't randomly assigned *across* the supposedly arbitrary border, or both?"
      *   *(Anticipated Rebuttal Follow-up: Instruments fail due to non-random treatment assignment)*: "If the fundamental issue is that the 'treatment' (institutions) was *never* randomly assigned relative to the border in the first place – because the border location or the post-border institutional choices weren't exogenous – does that mean *any* study using *any* historical political border discontinuity as an instrument for institutions is inherently flawed from the outset? Are there *any* borders that pass your exclusion restriction?"

  5.  **Escaping the Endogeneity Trap:** "If we accept your critique that borders, institutions, and geography are endogenously bound up, what methodological approach *do* you advocate for actually identifying causal drivers of development? Does your theory point towards a viable alternative empirical strategy, or does it primarily serve as a critique leaving us with fewer tools?"
      *   *(Potential Follow-up if answer is vague/negative):* "Doesn't this methodological pessimism risk paralysis? How should development economists or policymakers proceed if the core tools for understanding causation are fundamentally suspect?"

  6.  **Falsifiability & Evidence:** "What evidence *would* falsify boundary endogeneity theory for you? For instance, if someone could demonstrate a case where colonial borders were drawn with demonstrably *zero* regard for pre-existing economic or institutional realities (pure lottery, perhaps), and a stark institutional discontinuity *still* emerged and caused divergent development paths, would that challenge your view? Or would you argue the 'zero regard' is impossible to prove?"

  7.  **Policy Implications:** "What are the practical implications of your theory for development policy? If we can't reliably isolate the causal effect of institutions because they're inseparable from historical geography and border formation, does it shift the focus away from institutional reform? Or does it suggest we need much deeper, historically grounded interventions that acknowledge this entanglement?"

  8.  **The "So What?" for the Broader Debate:** "Ultimately, does boundary endogeneity theory mean the entire 'institutions vs. geography vs. culture' debate is fundamentally misguided? Should we abandon these categories altogether as separable causal factors, and instead focus on understanding specific, path-dependent historical processes in each context? Or does it just mean we need a radically different way of conceptualizing and measuring these factors within their entangled histories?"

  ### Key Tactics Used
  *   **Specificity:** Questions target concrete examples (Korea, Africa), specific methodological flaws (exclusion restriction, counterfactuals), and core concepts (residual category, falsifiability).
  *   **Anticipating Rebuttals:** The follow-ups directly engage with the most likely defensive moves she'll make (culture=persistence, separation=impossible, treatment=non-random), forcing her to defend those positions further.
  *   **Consequences:** Questions push on the implications – for methodology (#1, #3, #4, #5, #6), for the debate itself (#8), and even for policy (#7).
  *   **Avoiding Explanation Traps:** While some context is needed, the questions are framed as challenges ("Isn't it...?", "Doesn't that...?", "What's the flaw...?", "How could we...?") rather than invitations to simply restate the theory.
  *   **Accessibility:** Avoids jargon where possible ("residual bin" instead of "omitted variable bias", "natural experiments" explained in context). Focuses on ideas, not citations.

  These questions should push her beyond exposition and into defending the robustness, implications, and practical utility of her critique. Good luck with the interview!
