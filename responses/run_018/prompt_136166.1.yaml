prompt: |-
  i host a small philosophy podcast and next episode im interviewing a philosopher — lets call her Dr. Voss — who defends "role-indexed internalism" about practical reasons. her idea is that a reason counts as internal not relative to your actual desires but relative to the motivations you'd have if you were competently performing the social role you actually occupy. so a parent who feels nothing still has internal reason to feed their kid, because thats constitutive of parenting, but if the parental role is structured by unjust norms then external reasons kick in and override. i want 7 or 8 questions that actually press her, not just "explain your view." i need at least one about whether this just collapses into externalism once you let unjust roles be overridden, one about role conflict — like being a good employee vs a present parent — and one about whether "competent role-filling" smuggles in objective moral standards. for each question, write a follow-up tailored to the answer she's most likely to give (she tends to say the norms are internal to the practice, not imported). no generic biographical stuff. keep it focused.
reasoning: |-
  Okay, let me approach this systematically. The user hosts a philosophy podcast and needs substantive questions for an interview with Dr. Voss about her "role-indexed internalism" theory. 

  First, I need to understand the core tension in her view: she claims reasons are internal to roles, but allows external overrides for unjust norms. That's where the collapse-into-externalism risk appears. The user explicitly wants this pressed, so I'll craft a question forcing her to define the boundary between role-constituted reasons and external morality, with a follow-up anticipating her "norms are internal" response.

  Next is role conflict - a parent vs employee scenario seems perfect. Her likely "contextual prioritization" answer needs pushing: what if the role norms themselves conflict? This exposes whether her framework has resolution mechanisms beyond individual judgment.

  The competence-smuggling-objectivity angle is crucial. If "competent role-filling" requires implicit moral standards, her internalism claim weakens. I'll prepare a follow-up questioning how we distinguish role-constitutive norms from moral imports when they align.

  Other pressure points: 
  - How role boundaries are defined (is "parent" a monolith or culturally variant?) 
  - Whether role occupants can critique roles from within 
  - If external overrides make desires irrelevant 
  - Whether roles can generate reasons without endorsement 

  For each, I'll drill down with hypotheticals and "how is this not externalism" challenges tailored to her typical responses. The goal is clarity through constructive tension, not gotchas. Podcast listeners need to hear the theory tested at its weak joints.

  Hmm... should avoid letting her retreat to "it's contextual" without probing what contextual means. The follow-ups must prevent evasion while staying charitable. Maybe emphasize concrete examples like abusive workplace roles to force specifics.

  Also noting the user wants no biography - pure philosophy. Questions should scaffold from basic mechanics to implications, ending with the override dilemma that threatens her internalist credentials. Structure matters: collapse risk first, then competence objectivity, then conflicts, finally coherence checks.
answer: |-
  Here are 8 pointed questions for Dr. Voss, each with a tailored follow-up anticipating her likely "internal to the practice" response, focusing on pressure points:

  1.  **The Collapse Risk:** "Dr. Voss, you argue that external reasons override when a role's constitutive norms are *unjust*. But doesn't grounding the validity of the 'override' in *justice* – a concept seemingly external to the motivational set of the individual *or* the internal logic of the specific role itself – mean your view ultimately collapses into a form of externalism? Where does the normative authority of 'justice' here come from, if not externally?"
      *   *Likely Response Anticipated:* "Justice isn't externally imposed; the critique arises *internally* when we see the role's norms conflict with deeper, more fundamental practices or human needs constitutive of a wider social fabric."
      *   **Follow-Up:** "But how is appealing to 'deeper practices' or 'fundamental human needs' not importing an external standard? If the *parenting role's* internal norms say X, but 'fundamental human needs' (say, a child's need for love) say Y, isn't 'fundamental human needs' functioning precisely as an external moral standard *overruling* the specific role's internal logic? Doesn't this move require an objective hierarchy of practices/needs?"

  2.  **Competence & Smuggled Objectivity:** "You define internal reasons relative to the motivations of someone *competently* performing the role. How do you define 'competent' role-filling without smuggling in objective moral or normative standards? Doesn't 'competence' inherently imply meeting some standard of correctness that exists independently of the individual's psychology?"
      *   *Likely Response Anticipated:* "Competence is defined *internally* to the practice. It's about grasping and skillfully enacting the goals and norms that *constitute* what it means to be, say, a parent, a doctor, or a judge *as understood within that practice*."
      *   **Follow-Up:** "But practices can be deeply flawed or corrupt. Imagine a role defined by a corrupt institution – say, an 'Enforcer' role in an oppressive regime where competence involves brutality. If competence is defined purely internally by the role's constitutive norms, wouldn't the 'competent Enforcer' have internal reason to be brutal? If you say that's not *true* competence because the role is corrupt, haven't you just invoked an external standard again to judge the practice itself?"

  3.  **Role Conflict (Core Question):** "A common objection is role conflict. If someone is both a parent (requiring presence) and an employee (requiring long hours), and the competent performance of *both* roles generates conflicting internal reasons (be present vs. work late), how does role-indexed internalism resolve this conflict *without* appealing to an external standard (like overall well-being or moral priority)?"
      *   *Likely Response Anticipated:* "Resolution often happens *contextually* within the broader web of roles and practices. The demands of one role might take precedence in a specific situation based on internal features (e.g., urgency, dependence, specific commitments made *within* the roles)."
      *   **Follow-Up:** "But what if the internal logics genuinely conflict *and* the contextual features are ambiguous? If the parenting role internally demands attendance at a child's recital tonight, and the employment role internally demands completing a critical project deadline also tonight, and there's no clear internal hierarchy or contextual trump, does your theory simply leave the agent with incommensurable internal reasons? Isn't resolving this likely to require appealing to something *outside* the specific roles, like the agent's own priorities or an external value judgment?"

  4.  **Boundaries of a "Role":** "How are the boundaries of a 'social role' defined in your theory? Is 'parent' a single monolithic role, or are there culturally/historically specific variants? If specific, how do we determine which variant applies to a given individual without external judgment? Doesn't defining the relevant role already involve normative choices?"
      *   *Likely Response Anticipated:* "Roles are socially constituted practices. The relevant role for an individual is the one they are actually recognized as occupying within their social context. Its constitutive norms are discerned by understanding that practice."
      *   **Follow-Up:** "But social recognition can be contested or based on unjust systems. If someone is *recognized* within a sexist society as occupying the 'submissive spouse' role with internal norms of obedience, does your theory grant them internal reasons to obey, even if they personally chafe? And if we challenge that role definition as unjust, aren't we again relying on an external standpoint to critique the socially recognized practice?"

  5.  **Critique from Within?** "Can an agent, solely using the internal resources of the role they occupy, coherently critique the *fundamental constitutive norms* of that very role? Or does any radical critique necessarily require stepping outside the role and employing external standards?"
      *   *Likely Response Anticipated:* "Critique can arise immanently. Tensions, inconsistencies, or failures to achieve the role's *own* internal goals (e.g., parenting failing to produce well-being *if* well-being is internal to the parenting aim) can motivate internal critique and evolution of the norms."
      *   **Follow-Up:** "What if the role's internal goal *is* the problem? Consider a historical 'Master' role where the constitutive goal is maintaining dominance. Can a 'competent Master' immanently critique the goal of dominance itself using *only* the internal logic of mastery? Doesn't rejecting dominance require importing an external value like equality or human dignity?"

  6.  **The Motivation Link (vs. Williams):** "Williams linked internal reasons tightly to the agent's *actual* motivational set to explain the inescapable 'normative oomph'. By tying reasons to motivations we *would* have only *if* we were competent in a role we *might not endorse*, haven't you severed the essential link between reasons and the agent's *actual* conative state? Why should an agent unmotivated by competent role-performance care about these 'internal' reasons?"
      *   *Likely Response Anticipated:* "The 'oomph' comes from the fact the agent *is* in the role. Occupying a role involves a kind of commitment or participation that already engages their agency; the reasons flow from the position they hold and its inherent demands."
      *   **Follow-Up:** "But what if the agent feels utterly alienated from the role? Imagine someone forced into a family business role they despise. They occupy it, but reject its constitutive aims. Do they *really* have internal reasons relative to competent performance? If so, doesn't this make the 'internal' label feel like a misnomer, as the reasons seem imposed by the *position*, not their own motivational structure?"

  7.  **External Overrides & The Scope of Internality:** "When external reasons override unjust role-based internal reasons, what happens to those original 'internal' reasons? Are they erased, silenced, outweighed but still present, or revealed to have never been genuine reasons in the first place? How does this affect the core claim that reasons are fundamentally *internal*?"
      *   *Likely Response Anticipated:* "The unjust role-based 'reasons' were *defeasible* internal reasons. They were grounded in the role's internal logic, but that logic itself was flawed or partial. The override reveals the limitations of that specific practice when measured against broader human practices/needs."
      *   **Follow-Up:** "This seems to imply a two-tier system: genuine, indefeasible reasons (from just practices/fundamental needs) and defeasible, practice-specific pseudo-reasons. Doesn't this subordinate the entire 'role-indexed internal' level to a higher-order external standard (justice/fundamental needs) that determines which role-based reasons are valid? Doesn't this hierarchy undermine the foundational status of internal reasons in your theory?"

  8.  **The Problem of Role Acquisition/Exit:** "Does your theory generate reasons *only* for roles one *currently* occupies? What about reasons to *take on* a socially valuable role (e.g., become a caregiver) or to *leave* an oppressive role? Are these reasons internal or external? If internal, relative to *which* role? If external, does this create a significant class of important practical reasons lying outside your 'internalist' framework?"
      *   *Likely Response Anticipated:* "Reasons to enter or exit roles stem from our existing roles and their demands (e.g., a 'citizen' role might generate reasons to take on care work in a crisis), or from fundamental human needs/practices that aren't tied to a specific institutional role."
      *   **Follow-Up:** "If reasons to enter/exit roles come from 'fundamental human needs/practices,' doesn't this again posit a bedrock layer of normativity *external* to any specific social role? And if they come from *existing* roles, doesn't this lead to an infinite regress (why occupy *that* role?), or lock individuals into path-dependent trajectories defined by initial roles?"

  **Key Pressure Points Covered:**
  *   **Collapse into Externalism:** Q1 & Follow-Up, Q7 & Follow-Up.
  *   **Role Conflict:** Q3 & Follow-Up.
  *   **Competence & Smuggled Objectivity:** Q2 & Follow-Up.
  *   **Additional Depth:** Role definition (Q4), Internal critique (Q5), Motivation link (Q6), Role entry/exit (Q8).

  These questions force clarification on the sources of normativity (internal practice vs. external standard), the mechanics of conflict and critique, the definition of key terms (role, competence), and the coherence of maintaining "internalism" while relying on overrides and fundamental needs. The follow-ups specifically target her probable defense strategy. Good luck with the interview!
