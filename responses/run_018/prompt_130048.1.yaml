answer: |-
  ## Proposal: Untangling Causation from Agency — Non-Human Protagonism in Historical Narrative

  **Research Question:** Does a clear distinction hold between **causal protagonism** (where a non-human event like a plague or volcanic eruption is a *narratively necessary catalyst* that fundamentally reshapes human possibilities) and **agential protagonism** (where the non-human factor is implicitly or explicitly treated within the historical narrative as possessing *goal-directed behavior or interests*, akin to a human actor) in historical explanations? Can this distinction provide a more precise vocabulary for analyzing non-human impacts without resorting to environmental determinism?

  **The Problem: Beyond the Determinism/Agency Stalemate**
  Historians routinely invoke non-human forces: "the plague reshaped feudal labor," "Tambora caused the Frankenstein summer." However, the standard debate often stalls between crude environmental determinism (non-humans *dictate* human outcomes) and a focus solely on human agency (non-humans are merely passive context). Crucially, **both sides often conflate causal weight with implied agency.** The determinist might see the plague's *causal power* as proof of its *dominant agency*. Conversely, those emphasizing human agency might dismiss *any* significant causal role for non-humans as determinism, ignoring the specific narrative function of the event. This conflation obscures how historians actually *use* non-human factors in their narratives. We need to pry apart the undeniable *causal impact* of events like the Black Death from the question of whether they are narratively framed as *actors with interests*.

  **Method: Conceptual Analysis & Practical Taxonomy**
  This 3-month, part-time workshop will employ a two-pronged approach centered on four concrete case studies:
  1.  **The Black Death (14th C.):** Did it simply *cause* labor shortages leading to feudal decline, or is it narratively framed as an actor "reshaping" society with a purpose?
  2.  **The Tambora Eruption (1816):** Is it merely the *cause* of the "Year Without a Summer" enabling Shelley's writing, or does it function as a dramatic, almost wilful, disruptor in the narrative?
  3.  **The 536 AD Volcanic Winter:** Is it a *catalyst* for societal crises across Eurasia, or is it personified as an active agent of doom in historical accounts?
  4.  **19th-Century Cholera Pandemics:** Did outbreaks simply *create conditions* forcing sanitation reform, or are they depicted as possessing a kind of malevolent intent driving urban change?

  For each case:
  1.  **Conceptual Analysis:** Close reading of key historical narratives (primary sources & seminal secondary works) to identify language and narrative structures. We will explicitly map:
      *   The *causal chain* attributed to the non-human factor.
      *   The *narrative necessity* of the event within the story.
      *   Instances of language implying *intention, purpose, interest, or wilful action* (e.g., "the plague *targeted*," "cholera *forced*," "the volcano *unleashed* fury").
  2.  **Developing a Classification Tree:** Based on the analysis, we will draft a simple, practical decision-tree tool for historians. This tool will guide them in classifying a non-human factor within a specific narrative explanation as:
      *   **Background Condition:** Necessary context, low causal protagonism.
      *   **Causal Protagonist:** High causal weight, reshapes options, narratively central, *but no implied agency*.
      *   **Agential Protagonist:** Implied or explicit attribution of goals, interests, or intentional action.
      *   **Ambiguous/Conflated:** Where causal weight and agency language are intertwined and inseparable in the narrative.

  **Success Criteria:** A robust, clearly articulated distinction between causal and agential protagonism demonstrated through the case analyses. The classification tree proves useful and intuitive for workshop participants in analyzing their own examples. We generate concrete examples of how acknowledging significant non-human *causal protagonism* does *not* necessitate determinism and how spotting *agential protagonism* allows for critical reflection on narrative framing.

  **Failure Criteria:** The distinction collapses under analysis, proving purely semantic or impossible to apply consistently across cases. The classification tree is deemed overly simplistic, unhelpful, or fails to capture the nuances of historical narrative. The project yields no new insights beyond the existing determinism/agency debate.

  **Scope Check (3 Months, Part-Time): Honest Limitations**
  *   **Depth over Breadth:** We prioritize rigorous analysis of **3 core cases** (likely Black Death, Tambora, Cholera) over superficial coverage of all four. The 536 AD case may serve as a secondary validation point if time permits.
  *   **Workshop Focus:** Output is a *framework* (distinction + tree) and *case study analyses*, not exhaustive monographs on each event. The grant supports focused discussion, analysis, and tool development.
  *   **Tool Development:** The classification tree will be a *prototype* generated and tested within the workshop, requiring further refinement and broader testing beyond this project.
  *   **Literature:** While informed by relevant philosophy of history/history of science, the *active work* avoids deep literature review, centering on the cases and conceptual development.
  *   **Focus on Narrative:** We analyze *how stories are told* in historical writing, not the ontological reality of non-human agency itself.

  This project offers a novel lens, moving past the determinism/agency stalemate by dissecting how narrative itself constructs non-human roles. It provides historians with concrete conceptual tools to articulate the powerful, necessary influence of germs, climate, and volcanoes without anthropomorphizing them or denying human response, ultimately leading to more precise and responsible historical explanation.
