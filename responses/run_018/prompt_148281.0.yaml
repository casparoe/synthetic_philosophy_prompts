  ## The Fourth Thought

  The cry cuts sharp above the river's churn.
  No pause, no thought – I plunge into the cold,
  The current grabbing, grey water in mouth,
  Flinging towards the flailing, small despair.
  My fingers clutch at sodden, trembling cloth,
  Heave backwards through the sucking, muddy swirl,
  Stumble ashore, collapse on gritty stone,
  A gasping child clutched hard against the chill.

  The cry cuts sharp above the river's churn.
