  **Structural & Philosophical Embodiment:**

  *   **Mirrored Stanzas:** The near-perfect repetition enacts the initial, unified action. The speaker exists *within* their project, unalienated.
  *   **Interpolated Line (Line 5 of Stanza 2):** The utilitarian calculation ("But thirty yards downstream, two others drown") violently interrupts the replication. It doesn't *change* the physical action described, but it fractures the psychological unity. This is the "one thought too many."
  *   **Fractured Echo:** The repetition of lines after the interpolation feels jarring, an unwelcome echo. The original directness is irrevocably altered by the presence of the impartial perspective, even though the *words* describing the rescue remain the same. This embodies the *alienation* – the speaker is no longer simply *doing*; they are now simultaneously *calculating*, stepping outside their commitment.
  *   **Accuracy to Williams:** The problem isn't the *truth* of the calculation (two others *might* drown). The horror lies in the *having* of it at all in this context. It reveals the rescue, initially presented as a direct expression of care/commitment, as potentially inadequately grounded *from an impartial view*. The poem doesn't resolve whether the speaker should suppress this thought or whether the direct feeling survives; the tension *is* the alienation Williams described.
  *   **British English:** "Grey" (not gray), "towards" (not toward), "gritty stone" (common phrasing), "realise" implied in the structure (though not used).
  *   **Blank Verse:** Strict iambic pentameter maintained throughout ("The **cry** cuts **sharp** a**bove** the **riv**er's **churn**"). Unrhymed.
