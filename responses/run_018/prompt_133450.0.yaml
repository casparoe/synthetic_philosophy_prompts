  - The problem not being fatal (factor 1) OR
  - Hybrid accounts working without collapsing (factor 2) OR
  - Non-classical logic being defensible (factor 3) OR
  - The residual problem not being a problem (1 minus factor 4)

  But note: we are asking about pure expressivism surviving without collapsing into cognitivism or abandoning classical logic.

  Pure expressivism must avoid both collapsing and abandoning classical logic. So the survival condition is that:

  - The Frege-Geach problem is not fatal (so we don't need to abandon pure expressivism) OR
  - We can solve it without collapsing or abandoning classical logic.

