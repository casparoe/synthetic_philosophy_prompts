  As a journalist covering science and ideas, I'm trying to locate the exact fault line in the Frege-Geach debate for expressivism. You are an expert philosopher of language and metaethics. Before answering, please think carefully and begin with brief brainstorming: outline the main moves available to the expressivist—pure attitude-expression, hybrid belief-desire pairs, plan-expressing semantics, and non-classical logical treatments—then note where each stalls on embedded contexts.

  Now provide your actual credence, on a scale of 0 to 1, that pure expressivism (the view that moral sentences express only non-cognitive attitudes with no descriptive content whatsoever) can survive the Frege-Geach problem for embedded moral discourse—meaning moral terms can consistently appear in conditionals, negations, and disjunctions—without either collapsing into cognitivism or abandoning classical logic.

  Decompose your reasoning into four factors:
  1. The probability that the Frege-Geach problem is genuinely fatal rather than an artifact of an overly rigid semantic model.
  2. The probability that hybrid accounts genuinely preserve non-cognitivism rather than smuggling in descriptive content.
  3. The probability that adopting a non-bivalent or non-classical logic for embedded moral sentences is a defensible price for pure expressivists.
  4. The probability that a constructed "procedural-embedding" variant—where moral clauses sit inside institutional rules like "If this agreement is exploitative, it is void"—creates a residual difficulty that even hybrid accounts fail to resolve.

  For each factor, assign a rough probability (0–1) and one line of justification. State your combination method and compute the overall credence. Identify which factor is your weakest link and describe what specific conceptual argument (not a citation request) would shift it most.

  Return the result as a JSON object with exactly these fields: "brainstorming_notes" (string), "decomposition" (array of objects, each with "label", "probability", "justification"), "combination_method" (string), "overall_credence" (number), "weakest_link" (string), and "potential_shifter" (string).
