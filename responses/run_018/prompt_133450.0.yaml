  We are addressing the Frege-Geach problem for pure expressivism (non-cognitivism). The problem: how can moral sentences in embedded contexts (like conditionals) express non-cognitive attitudes when they are not being used to express an attitude? Pure expressivism traditionally holds that moral sentences express non-cognitive attitudes (like approval/disapproval) and have no descriptive content.

  Brainstorming notes:

  - Pure attitude-expression: The classic expressivist (Ayer, Stevenson) says that "Stealing is wrong" expresses disapproval of stealing. But in an embedded context, such as "If stealing is wrong, then murder is wrong", we are not expressing disapproval of stealing. So what does the antecedent express? The problem is that the meaning of "stealing is wrong" must be the same in both embedded and unembedded contexts.

  - Hybrid belief-desire pairs: Some (like Ridge) propose that moral sentences express both a belief and a non-cognitive attitude. For example, "Stealing is wrong" might express a belief that stealing has a certain property and a con-attitude toward things with that property. This might handle embedding by having the belief component be what embeds. But then, is this still non-cognitivist? The belief component is descriptive.

  - Plan-expressing semantics: Gibbard's norm-expressivism treats moral judgments as expressing plans. In a conditional, we might think of the antecedent as constraining the plan. For example, "If stealing is wrong, then..." is considering a plan that forbids stealing. This uses a possible worlds framework where we consider hyperplans. This is more sophisticated but requires a non-standard semantics.

  - Non-classical logical treatments: Some expressivists (like Schroeder) have tried to develop a non-classical logic for moral sentences. For example, using a special kind of operator that tracks the expression of attitudes. But this might require abandoning classical logic, which is a high cost.

  Each approach has issues with embedded contexts:

  - Pure expressivism: Cannot explain the meaning of the antecedent in conditionals without invoking a descriptive content or changing the meaning.

  - Hybrid: The belief component might do the embedding work, but then the view becomes cognitivist.

  - Plan semantics: Requires a complex semantics that might not be classical.

  - Non-classical logic: Abandons classical logic, which is a high cost and might not be acceptable.

  Now, the question: What is the credence (0 to 1) that pure expressivism (only non-cognitive attitudes, no descriptive content) can survive Frege-Geach without collapsing into cognitivism or abandoning classical logic?

  We decompose into four factors:

  1. The probability that the Frege-Geach problem is genuinely fatal rather than an artifact of an overly rigid semantic model.

     - Justification: If the problem is just an artifact, then expressivism might be fine. But it's a deep problem that has persisted for decades. I assign a low probability that it's an artifact: 0.2.

  2. The probability that hybrid accounts genuinely preserve non-cognitivism rather than smuggling in descriptive content.

     - Justification: Hybrid accounts seem to introduce a descriptive component (the belief), which then does the logical work. So they might be cognitivist. I assign a low probability that they preserve non-cognitivism: 0.3.

  3. The probability that adopting a non-bivalent or non-classical logic for embedded moral sentences is a defensible price for pure expressivists.

     - Justification: Giving up classical logic is a huge cost. Many philosophers are reluctant. But expressivists might argue that it's acceptable for the moral domain. I assign a moderate probability: 0.4.

  4. The probability that a constructed "procedural-embedding" variant creates a residual difficulty that even hybrid accounts fail to resolve.

     - Justification: The example is institutional rules: "If this agreement is exploitative, it is void." Here, the moral term is embedded in a rule that has practical consequences. Even hybrid accounts might struggle because the rule doesn't seem to express a belief but a condition for institutional action. I assign a high probability that this is a residual problem: 0.7.

