answer: |-
  This is a brilliantly observed phenomenon—and you're right that it doesn't map neatly onto existing concepts. Let's carve it out:

  ### Core Definition: **Justificatory Inertia**  
  (Or **Normative Anchoring** / **Rationale Decoupling**)

  **What it is:**  
  A state where a *social norm remains actively enforced* and its *original justification remains verbally invoked*, but the *actual function* of the norm has shifted to solve a *different coordination problem* than the one originally cited. Crucially, the community is *sincere* in believing the old justification still applies, despite behavioral evidence to the contrary.

  ---

  ### Key Distinguishing Features  
  *(Where it differs from adjacent concepts)*

  1. **vs. Concept Creep**:  
     - In concept creep (e.g., "trauma" expanding clinically → colloquially), the *term's semantic boundary* broadens while retaining some core meaning.  
     - **Here**: The *term's behavioral function* changes (solving Politeness vs. Prediction-Tagging), but the *justification vocabulary* doesn't update. It’s not semantic drift—it’s *functional repurposing with frozen rationale*.

  2. **vs. Hypocrisy/Inconsistency**:  
     - Hypocrisy involves knowingly applying double standards.  
     - **Here**: Actors genuinely perceive continuity between the old problem and new usage. The original justification feels intuitively relevant because it’s *ritualized*.

  3. **vs. Common Knowledge Breakdown**:  
     - Lewis-style conventions require common knowledge to sustain equilibria.  
     - **Here**: Common knowledge may persist ("we all enforce epistemic humility"), but there’s **hidden misalignment** on *why* it’s enforced. The group coordinates on enforcement without coordinating on the problem being solved.

  4. **vs. Organic Norm Evolution**:  
     - When a norm adapts to solve a *new* problem, justification usually updates (e.g., "We use this for conflict resolution now").  
     - **Here**: The new function (e.g., politeness enforcement) is *never explicitly acknowledged*. The old justification acts as a "sacred value" that blocks conscious reassessment.

  ---

  ### Mechanism: Why This Happens  
  - **Path Dependency**: The original justification was crucial for initial buy-in. Abandoning it feels like losing legitimacy.  
  - **Ritualization**: The phrase becomes a shibboleth—invoking the old problem signals tribal allegiance, regardless of practical relevance.  
  - **Equilibrium Lock-In**: Even if Wild Predictions ™ vanish, the norm now solves *other* problems (e.g., status management, reducing friction). Enforcers don’t notice the shift because the norm "works" (just differently).  
  - **Motivated Reasoning**: Admitting the drift would require renegotiating social contracts—psychologically costly in high-trust communities.

  ---

  ### Diagnostic Checklist  
  A norm exhibits **Justificatory Inertia** iff:  
  1. **Behavioral Shift**: Observable change in what actions trigger enforcement.  
  2. **Frozen Justification**: Original reasoning remains the sole *stated* rationale.  
  3. **Sincere Attachment**: Enforcers aren’t cynically manipulating; they *believe* the old logic applies.  
  4. **Latent Function**: The norm now primarily solves an unacknowledged new problem (e.g., tone-policing instead of epistemic rigor).  

  ---

  ### Why This Matters  
  This creates **normative deadweight**: Resources are spent enforcing rules that don’t address their proclaimed purpose, while *actual* coordination problems (e.g., toxic politeness) go unexamined. It’s governance via cognitive dissonance.

  ### Proposed Term: **Rationale Drift**  
  (*Your "fossil" metaphor is apt—the justification is preserved while the living function evolves.*)  

  If you coin this, emphasize it’s not about *semantics* but about *functional decoupling* + *sincere delusion*. What you’ve described is a real and corrosive dynamic—especially in communities that pride themselves on reflection. Spotting it is the first step to defossilizing norms.
