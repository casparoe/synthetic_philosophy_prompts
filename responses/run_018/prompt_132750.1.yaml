prompt: |-
  hey so im a backend engineer on a legacy maintanence team with basically zero philosophy background. every sprint we hit cases where two different explanations for a weird module behavior both match every log and test we have, but we still gotta pick one to refactor around or decide to hold both. i read a little about underdetermination of theory by evidence - like the quine-duhem thing where data never fully forces one theory - and i want to turn that into an actual decision procedre my team can run in like 20 minutes. nobody here has studied philosophy, and at the end someone senior has to sign off.

  write me the ordered checklist: the questions to ask in sequence, what counts as a good enough answer at each step, where it stops with a hard 'no, dont commit to either', where it says 'pick A or B but flag the risk', and where its clearly a values call that philosophy cant solve. keep it usable by people who dont know the jargon.

  apply it to three cases:
  1. two database normalization theories that both predict the exact same slow query patterns
  2. two competing security breach narratives that both fit every audit log
  3. a case where the procedure forces us to reject the simpler, cleaner explanation we all like and go with a messier one because some hidden auxilliary assumption check fails

  also be honest about where this is gonna misfire or break since im probably mangling the concept, and say clearly what the procedure cant do - like it cant actually prove one theory is right, can it? and flag the spots where a human just has to make a call.
reasoning: |-
  We are creating a practical decision procedure checklist based on the concept of underdetermination of theory by evidence (like Quine-Duhem) for a software team without philosophy background.

  The goal: 
  - Given two competing explanations (theories) for a module's behavior, both consistent with all current evidence (logs, tests), we want a step-by-step process to decide:
     a) Reject both (don't commit to either)
     b) Pick one (with a risk flag)
     c) Identify where it's a values call (beyond the scope of the procedure)

  The checklist must be runnable in about 20 minutes by non-philosophers. A senior must sign off.

  Key ideas from underdetermination:
  - Evidence alone cannot force a choice between two theories because theories are connected to a web of auxiliary assumptions.
  - We can try to break the tie by:
     1. Simplicity (but note: simplicity is sometimes subjective)
     2. Fruitfulness (which one leads to more useful predictions or refactorings?)
     3. Consistency with other established knowledge (in our codebase, domain, etc.)
     4. Ability to generate new tests that could falsify one of them
     5. Risk assessment: what if we are wrong?

  Checklist Structure:
  We'll have a sequence of questions. At each step, if we get a clear answer, we break and decide. If not, we move to the next.

  Steps:

  1. **Check for New Testable Predictions**:
     - For each theory, ask: "If this theory is true, what else should we see that the other theory does not predict?"
     - Good enough answer: A concrete, testable prediction that we can check quickly (within the next few hours or days) without major refactoring.
     - If we can design such a test for one theory and not the other, then we choose to run that test and postpone the decision until we have the result.
     - If we can design tests for both, then run both tests and postpone.
     - If neither theory yields a new test, move to step 2.
     - If we can run a test now and get an answer quickly, then do so. Otherwise, if testing is too costly, move to step 2.

  2. **Auxiliary Assumptions Check**:
     - For each theory, list the auxiliary assumptions (background beliefs) required for the theory to hold. These are things we are taking for granted that aren't directly tested by the current evidence.
     - Example: "This theory assumes that the database connection pool is never exhausted, because we don't log that."
     - Then, ask: "Which set of assumptions is more plausible given our overall knowledge of the system?" 
     - Also: "Are any of these assumptions already known to be problematic (from past incidents, etc.)?"
     - Good enough answer: If one theory requires an auxiliary assumption that we know is false (or very unlikely) from our general system knowledge, then reject that theory. If one theory requires assumptions that are much more plausible (or already verified elsewhere) than the other, then pick that one and flag the risk that we are relying on these assumptions.
     - If both sets of assumptions are equally plausible, move to step 3.

  3. **Fruitfulness and Risk Assessment**:
     - Consider the practical implications of acting on each theory.
     - Ask: 
          a) "If we refactor based on theory A and it's wrong, what's the worst that could happen? And same for theory B?"
          b) "Which theory, if acted upon, is likely to lead to more useful improvements (even if it's wrong)?" (e.g., one refactor might clean up code that we know is messy anyway)
          c) "Which theory is more aligned with our current roadmap or technical debt priorities?"
     - Good enough answer: If one theory has a much lower risk of being wrong (or the cost of being wrong is much lower) and/or higher potential benefits, then pick that one and flag the risk. If the risks are too high for both (e.g., potential system crash) and we cannot mitigate, then reject both and collect more evidence.

  4. **Simplicity and Elegance**:
     - Ask: "Which theory is simpler? (Fewer moving parts, less ad hoc, more aligned with our existing architecture?)"
     - But note: This is subjective and should be a last resort. Also, sometimes the simpler theory is not the correct one.
     - Good enough answer: If one theory is clearly simpler and we have no other grounds for decision, then pick that one and flag that the decision was made on simplicity. However, if the simpler theory requires ignoring known complexities of the system, then it might be a negative.

  5. **Values Call**:
     - If we get here, we have a tie. Then we must acknowledge that the decision is not determined by evidence or the above criteria. We then make a values-based call: 
          - Which theory is more aligned with our team's principles? (e.g., "We always prioritize security over performance in this module")
          - Or, we might decide to refactor in a way that is neutral to both theories (if possible) or to hold both theories and design for modularity so we can switch later.

  Stopping Conditions:
  - **Reject both**: 
     - If in step 2 we find that both theories rely on auxiliary assumptions that are highly implausible.
     - If in step 3 we find that the risk of being wrong for either is too high to act without more evidence and we cannot get more evidence quickly.
  - **Pick one (with risk flag)**:
     - If at any step we have a clear winner (by the criteria of that step), we pick it and note the risk that we are relying on a particular criterion (e.g., auxiliary assumption, or we are choosing simplicity without evidence).
  - **Values call**: 
     - At step 5, we must make a choice based on non-evidential factors, and we document that.

  What the procedure cannot do:
  - It cannot prove which theory is correct.
  - It cannot eliminate the possibility that both theories are wrong.
  - It might lead to a premature decision if we skip steps (but we are time-boxed).

  Now, apply to three cases:

  Case 1: Two database normalization theories that both predict the exact same slow query patterns.

  Case 2: Two competing security breach narratives that both fit every audit log.

  Case 3: A case where the procedure forces us to reject the simpler, cleaner explanation we all like and go with a messier one because some hidden auxiliary assumption check fails.

  We'll go through each case with the checklist.

  But note: For the sake of brevity in the final answer, we will summarize the application. The full checklist is above.

  Final Checklist (condensed for the team):

  **Step 1: Can we design a quick test to break the tie?**
     - If yes, run test and decide later. 
     - If no, go to step 2.

  **Step 2: Check the background assumptions.**
     - List the hidden assumptions behind each theory. 
     - If one has an assumption we know is false, reject that theory and pick the other (flagging that we are relying on the other's assumptions). 
     - If both have assumptions that are plausible, go to step 3.

  **Step 3: Assess risk and fruitfulness.**
     - What's the cost of being wrong for each? 
     - What's the benefit of being right? 
     - If one has much lower risk or much higher benefit, pick that one and flag the risk. 
     - If both are too risky, reject both and collect more data.

  **Step 4: Which is simpler?**
     - If we still can't decide, pick the simpler one and flag that we are using simplicity as a tiebreaker.

  **Step 5: Values call.**
     - If still tied, make a call based on team values (e.g., "We prioritize security over performance") and document.

  Now, apply to the cases:

  **Case 1: Database normalization theories**

  - Step 1: Can we design a test? Maybe we can create a temporary log for table locks or index usage that the theories predict differently? If yes, run test. If not, proceed.
  - Step 2: List auxiliary assumptions. 
     - Theory A might assume that the query planner always chooses a particular index. 
     - Theory B might assume that the network latency is negligible. 
     - We know from past that the network can be slow, so Theory B's assumption is weak? Then reject B and pick A (with risk flag that we are assuming the index choice is the issue). 
     - If both assumptions are plausible, then step 3.
  - Step 3: Risk assessment. 
     - If we refactor based on A (denormalize table X) and we are wrong, we might make writes slower. 
     - If we refactor based on B (add an index) and we are wrong, we might slow down writes a little and use more disk. 
     - If the cost of A being wrong is higher, we might prefer B. Otherwise, A. 
     - If we can't decide, step 4: pick the simpler refactor (maybe adding an index is simpler) and flag.

  **Case 2: Security breach narratives**

  - Step 1: Can we design a test? Maybe we can set up a honeypot or additional logging to catch the next attempt? If yes, then do that. If not, step 2.
  - Step 2: Auxiliary assumptions. 
     - Theory A: Attacker used a zero-day in component X. Assumption: Component X is vulnerable and not logged. 
     - Theory B: Insider threat with stolen credentials. Assumption: The audit logs for credentials are incomplete. 
     - We know that our logging for credentials is very thorough (from past audits), so Theory B's assumption is weak? Then reject B and pick A (with risk flag). 
     - Alternatively, we might know of a recent zero-day in X, making A more plausible? Then pick A. 
     - If both are plausible, step 3.
  - Step 3: Risk assessment. 
     - If we act on A (patch component X) and we are wrong, we still patched a potential vulnerability. 
     - If we act on B (tighten credential controls) and we are wrong, we might inconvenience employees. 
     - But the worst for B is that we don't catch an insider. 
     - However, the worst for A is that we leave the system open to the zero-day. 
     - Given that, we might choose to act on A because the risk of not patching a zero-day is very high. So pick A and flag. 
     - If we must choose one narrative to focus on, we pick the one with the highest risk if ignored.

  **Case 3: Rejecting the simpler explanation**

  - Scenario: We have two theories. Theory A is simple and clean. Theory B is messy and complex. We all like A.
  - Step 1: No test available.
  - Step 2: Check auxiliary assumptions. 
     - Theory A assumes that the network is always reliable (which we know from past incidents is not true in our production environment). 
     - Theory B accounts for network unreliability and has a complex retry mechanism as the cause. 
     - Since we know the network is unreliable (we've had outages), we reject Theory A because its auxiliary assumption (network is reliable) is false. 
     - Then we pick Theory B (with risk flag that it's complex and we might be missing something). 
     - This is a case where the procedure forces us to reject the simpler explanation because of a failed auxiliary assumption.

  Honest Limitations:
  - The procedure might misfire if we don't identify the right auxiliary assumptions.
  - It might break if the team cannot agree on what counts as a "plausible" assumption.
  - It cannot prove a theory, only help choose one under uncertainty.
  - It might be biased towards the current system state (because we rely on existing knowledge).
  - It might lead to a decision that is later found to be wrong, but that's inherent in underdetermination.

  Final Note: The senior who signs off must understand that this is a heuristic for making decisions under uncertainty and that the chosen theory might be wrong. The key is to document the rationale and the risk flag so that we can revisit if new evidence appears.
answer: |-
  Below is a practical, jargon-free decision checklist based on underdetermination (the idea that evidence alone can't pick between two theories). It's designed for your team to run in **≤20 mins**, with clear exit points. Senior signs off at the end.

  ---

  ### **The "Tiebreaker" Checklist: Picking Between Two Theories**  
  **When to use:** Two explanations (A and B) fit all logs/tests, but you must refactor or wait.  
  **Goal:** Avoid analysis paralysis. Force a clear outcome: **Pick A, Pick B, Reject Both**, or **Values Call**.  

  1. **🔍 CAN WE TEST ONE IN <4 HOURS?**  
     - *Ask:* "What *new* log/test would prove A **false** that B allows? (And vice versa?)"  
     - **→ Good answer:** A concrete, low-effort test (e.g., add a log line, mock a service call).  
     - **→ Outcome:**  
       - If you find one test → **Run it now** (pause decision).  
       - If tests for both exist → **Run the cheapest one**.  
       - If impossible → Move to Step 2.  

  2. **📌 WHAT’S HIDDEN? (AUXILIARY ASSUMPTIONS CHECK)**  
     - *Ask:* "What *untested* beliefs does A rely on? (e.g., ‘The cache never fails’). List for B too."  
     - **→ Good answer:** 2–3 bullet points per theory (e.g., "Assumes network latency is constant").  
     - **→ Outcome:**  
       - If A’s assumption is **known false** (e.g., logs *disprove* it) → **Reject A** (pick B).  
       - If B’s assumption is **known false** → **Reject B** (pick A).  
       - If **both** assumptions are plausible → Move to Step 3.  
       - If **either** assumption is too risky (e.g., "assumes no zero-days") → **Reject both**.  

  3. **⚖️ WHAT’S THE COST OF BEING WRONG?**  
     - *Ask:* "If we refactor for A and it’s wrong, what breaks? How bad? (Repeat for B.)"  
     - **→ Good answer:** Concrete risks (e.g., "A being wrong = 5% latency spike; B = data corruption").  
     - **→ Outcome:**  
       - If A’s failure cost **<<** B’s → **Pick A** (flag risk: "We prioritized lower downtime").  
       - If B’s failure cost **<<** A’s → **Pick B** (flag risk).  
       - If **both** catastrophic → **Reject both** (collect more data).  
       - If **equal** → Move to Step 4.  

  4. **🧠 WHICH IS LESS "WEIRD"? (SIMPLICITY CHECK)**  
     - *Ask:* "Which theory needs fewer hacks to explain the logs? (e.g., ‘A adds 2 special cases; B adds 5’)."  
     - **→ Good answer:** Count edge cases or "surprises" (subjective but quick).  
     - **→ Outcome:**  
       - If A is **much simpler** → **Pick A** (flag: "Chose simplicity over completeness").  
       - If B is **much simpler** → **Pick B** (flag).  
       - If **tied** → **Values call needed** (Step 5).  

  5. **🚩 VALUES CALL (PHILOSOPHY CAN’T HELP)**  
     - *Ask:* "What does the team value more: safety, speed, or sanity? Senior decides."  
     - **→ Examples:**  
       - "Security over performance" → Pick the safer theory.  
       - "No risk this sprint" → Reject both.  
       - "We can’t delay" → Pick the easiest refactor.  
     - **→ Outcome:** Senior picks **A**, **B**, or **Reject both** based on team values.  

  ---

  ### **Applied to Your Cases**  
  #### **Case 1: DB Normalization Theories**  
  - **Step 1:** No quick test (both predict same query patterns).  
  - **Step 2:**  
    - *Theory A:* Assumes deadlocks are logged (but deadlock logs are missing).  
    - *Theory B:* Assumes disk I/O is bottleneck (verified in past).  
    - **→ Outcome:** Reject A (its assumption is disproven), **PICK B** with risk flag: "Assumes I/O issue persists."  
  - *Why messy wins:* Clean theory (A) relied on a bad assumption.  

  #### **Case 2: Security Breach Narratives**  
  - **Step 1:** Can’t test new attack quickly.  
  - **Step 2:**  
    - *Theory A (Hacker):* Assumes attacker knew API keys (but keys rotated daily).  
    - *Theory B (Insider):* Assumes employee had DB access (verified).  
    - **→ Outcome:** Reject A (rotation makes keys unlikely), **PICK B** with flag: "Insider threat unconfirmed."  
  - **Step 3:** If wrong, B’s cost (false accusation) > A’s (patch keys) → **Reject both** if HR risk is too high.  

  #### **Case 3: Rejecting the Clean Explanation**  
  - **Scenario:**  
    - *Theory A (Clean):* "Bug caused by race condition." (Simple! We like it.)  
    - *Theory B (Messy):* "Bug from kernel + filesystem interaction." (Complex.)  
  - **Step 2:**  
    - *A’s assumption:* "OS scheduler is deterministic."  
    - *B’s assumption:* "Kernel has edge cases on ext4."  
  - **Check:** Past logs show non-deterministic scheduling → **A’s assumption is false**.  
  - **→ Outcome:** Reject clean theory (A), **PICK MESSY THEORY B** with flag: "Kernel issue unverified."  

  ---

  ### **Honest Limitations & Failure Spots**  
  - **🚫 What it CAN’T do:**  
    - **Prove a theory right.** Only picks the "least bad" option.  
    - **Handle >2 theories.** Add a voting step if needed.  
    - **Fix bad logs/tests.** Garbage in, garbage out.  
    - **Replace expertise.** Senior must sanity-check outcomes.  
  - **🔥 Where it BREAKS:**  
    - Step 2 if assumptions are poorly listed (e.g., missing a hidden bias).  
    - Step 3 if costs are misjudged (e.g., calling "data loss" low-risk).  
    - Step 4 if "simplicity" is biased toward familiar patterns.  
  - **⚠️ WARNING:**  
    - **Philosophy’s role ends at Step 4.** Step 5 is purely human judgment.  
    - **Never use for safety-critical systems** (e.g., medical devices).  
    - **Misfires if:** Teams rush assumptions (Step 2) or ignore new evidence post-decision.  

  **Final note:** This turns underdetermination from a headache into action. You’re not finding "truth" — you’re making a *tolerable* decision with incomplete data. Document assumptions and flags so you can revisit if logs improve.
