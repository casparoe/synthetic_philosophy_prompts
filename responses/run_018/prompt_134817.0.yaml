  Notably, the user forbids bibliographies—this suggests they've deeply internalized the material and need conversational, defensible replies. The two-minute limit per reply means we must sacrifice comprehensiveness for memorability. Each rebuttal should name its own weakness too; that's academically honest and disarms critics.

