prompt: |-
  hey so im in this philosophy of science grad seminar and i have to defend this thesis i cooked up about the dogmatism paradox — you know, the one where a rational agent who only revises beliefs for good reason ends up being irrationaly closed to counterevidence — but i think it dissolves if you drop global coherence and update inside local modular neighborhoods instead. my audience is mostly phil sci grad students plus a couple cognitive scientists who treat bayesian coherence as basically sacred and are obsessed with predictive processing, so theyre gonna tear me apart.

  can you prep me for the question period? i need exactly five numbered items, each just a sentence or two, no intro or conclusion. for each one tell me the objection phrased how theyd actually say it, whether it has real force, what i should concede upfront, and the reply that has to land or im dead. also include the objection im dreading about predictive processing being incompatible with modular closure — im praying nobody asks it but i know someone will.
