  Below is a decision-tree taxonomy for mapping positions on dispositions, finks, and masks. The tree uses concrete case-based questions to sort responses without referencing philosophers or labels. Internal nodes are binary choices, and leaves include named positions or diagnoses for unmapped combinations. The tree has **7 terminal positions**, with diagnoses for 3 unmapped branches. Two pairs of leaves share overlapping conceptual space (noted at the end).

  ---

  ### **Decision Tree: Dispositions, Finks, and Masks**  
  *Start at Question 1.*

  #### **Question 1: Permanent Shielding**  
  Consider a glass with an *inseparable, unbreakable internal force field* that forever prevents it from shattering (even if struck). Does this glass still possess **fragility**?  
  - **No** → Go to Question 2.  
  - **Yes** → Go to Question 3.  

  ---

  #### **Question 2 (after "No" to Q1): Temporary Mask**  
  Consider a *different* fragile glass temporarily wrapped in bubble wrap. If struck while wrapped, it won’t shatter, but it would shatter if unwrapped. Does this glass possess **fragility** *while wrapped*?  
  - **No** → **Leaf: Simple Conditional Analysis**.  
    *Dispositions exist iff the object would manifest in response to the stimulus. Finks and masks both negate the disposition.*  
  - **Yes** → Go to Question 4.  

  ---

  #### **Question 3 (after "Yes" to Q1): Blocker Analysis**  
  In the bubble-wrapped glass case, should the blocker’s presence be analyzed as **part of the disposition’s manifestation conditions** (e.g., "fragility = shatters *when unwrapped* if struck")?  
  - **Yes** → Go to Question 5.  
  - **No** → Go to Question 6.  

  ---

  #### **Question 4 (after "Yes" to Q2): Multi-Path Necessity?**  
  Can a poison’s **toxicity** have *non-reducible pathways* to its manifestation (e.g., it kills by stopping the heart *or* shutting down the nervous system, where these aren’t the same underlying process)?  
  - **No** → **Leaf: Reformed Conditional Analysis (Fink-Sensitive)**.  
    *Dispositions require a stable causal basis. Finks remove the disposition; masks do not.*  
  - **Yes** → **Diagnosis: Unexplored**.  
    *A fink-sensitive, mask-tolerant, multi-path view is coherent but rarely discussed. May need graded dispositionality.*  

  ---

  #### **Question 5 (after "Yes" to Q3): Multi-Path Necessity?**  
  Can a disposition like **electrical conductivity** manifest via *non-reducible pathways* (e.g., conducting through copper *or* saltwater, without shared mechanisms)?  
  - **No** → **Diagnosis: Unappealing**.  
    *Building blockers into conditions avoids finks/masks but collapses dispositions into ever-changing contextual properties.*  
  - **Yes** → **Diagnosis: Coherent but complex**.  
    *Dispositions have multi-path capacities *and* blocker-dependent conditions. Logically possible but ontologically costly.*  

  ---

  #### **Question 6 (after "No" to Q3): Multi-Path Necessity?**  
  Can **solubility** manifest via *non-reducible pathways* (e.g., dissolving in acid *or* enzymes, with no common causal basis)?  
  - **No** → **Leaf: Mask-Tolerant View**.  
    *Dispositions persist despite blockers; masks are external interferers, not condition-changers.*  
  - **Yes** → **Leaf: Multi-Path Account**.  
    *Dispositions are layered capacities with multiple realization pathways. Blockers suppress but don’t eliminate the disposition.*  

  ---

  ### **Taxonomy Summary**  
  | **Leaf/Diagnosis**                          | **Path**             | **Core Position**                                                                 |
  |---------------------------------------------|----------------------|-----------------------------------------------------------------------------------|
  | **Simple Conditional Analysis**         | Q1:No → Q2:No       | Dispositions vanish with finks *or* masks.                                        |
  | **Reformed Conditional Analysis**       | Q1:No → Q2:Yes → Q4:No | Dispositions vanish with finks but persist with masks.                          |
  | **Unexplored**                           | Q1:No → Q2:Yes → Q4:Yes | Fink-sensitive + mask-tolerant + multi-path: possible but underexplored.        |
  | **Unappealing**                          | Q1:Yes → Q3:Yes → Q5:No | Blocker-dependent conditions without multi-path: collapses into context-relativity. |
  | **Coherent but complex**                | Q1:Yes → Q3:Yes → Q5:Yes | Blocker-dependent + multi-path: consistent but ontologically loaded.           |
  | **Mask-Tolerant View**                  | Q1:Yes → Q3:No → Q6:No | Dispositions persist despite blockers; no multi-path needed.                   |
  | **Multi-Path Account**                  | Q1:Yes → Q3:No → Q6:Yes | Dispositions persist and have irreducible multiple realization pathways.       |

