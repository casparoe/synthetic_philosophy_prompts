  ### **Notes on Ambiguous Boundaries**  
  1. **Reformed Conditional Analysis (Q4:No) vs. Unexplored (Q4:Yes)**  
     The tree separates these via multi-path commitments, but a Reformed Conditional theorist *could* accept multi-path properties. This branch is fuzzy.  
     
  2. **Mask-Tolerant (Q6:No) vs. Multi-Path (Q6:Yes)**  
     These are cleanly divided by the multi-path question. No ambiguity.  

  3. **Unappealing (Q5:No) vs. Coherent but complex (Q5:Yes)**  
     The tree separates these cleanly, but both share the "condition-incorporating" logic.  

  ---

  ### **How to Use This Tree**  
  1. Answer each question based on intuitive judgments about the cases.  
  2. Follow the path to your terminal leaf/diagnosis.  
  3. Diagnoses indicate where the taxonomy may need refinement (e.g., "Unexplored" branches).  

  This tool prioritizes case-driven reasoning over labels, making it suitable for non-specialists engaging with dispositions, finks, and masks.
