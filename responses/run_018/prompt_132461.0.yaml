prompt: |-
  I am preparing a graduate seminar on functional explanation in contemporary philosophy of biology, and I want the students to begin not with a survey of positions but with the full specification of what adequacy requires. Write the desiderata: the complete list of demands that any theory of biological function—whether etiological, causal-role, or otherwise—must meet to count as adequate, with the specific case, distinction, or empirical result behind each. In particular, the list must address: (a) how to assign functions to traits in synthetic or engineered organisms that lack deep evolutionary histories, and whether accommodating them forces a revision of the core etiological claim; (b) how to distinguish functional ascription from mere causal contribution in horizontally acquired genetic modules where selection history and current system role come apart; (c) whether the theory can preserve the normative dimension of proper function in clinical diagnostics and synthetic-biology design contexts without smuggling in intentional design; (d) consistency with evolutionary-developmental findings on functional redundancy, exaptation, and the dissociation of selected effects from current utility; and (e) whether it can explain malfunction in a way that does not collapse into statistical abnormality or mere causal failure. For each desideratum, state the motivating consideration, flag whether it is non-negotiable or a preference of one camp, and identify any pair you suspect is jointly unsatisfiable—especially if accommodating engineered biological systems undermines the etiological account's distinctive advantage. Then, briefly and only to illustrate the criteria, indicate how the standard etiological framework and the causal-role framework fare against the list, but keep the conceptual weight on the requirements themselves and on which single requirement does the most to exclude candidates. Do not provide a bibliography or reading list; the point is the specification.
reasoning: |-
  Okay, the user is preparing a graduate seminar on functional explanation in philosophy of biology. They want students to start with a complete list of adequacy requirements for any theory of biological function. The user specified five key issues: synthetic organisms (a), horizontal gene transfer (b), normative dimensions without intentionality (c), evo-devo findings (d), and malfunction (e). 

  Hmm, this is a sophisticated request from someone clearly deep in the field. The seminar approach is interesting—starting with desiderata rather than theories shows they want students to evaluate frameworks critically. I should note their implied identity: likely a philosophy of biology professor or advanced grad student designing a high-level course. The unspoken need might be for a rigorous analytical tool that prevents students from getting lost in partisan debates.

  Breaking it down: For (a) synthetic organisms, the core tension is whether new life forms without histories break etiological theories. Must address if this forces revising "selected effects" as necessary. For (b), horizontal gene transfer cases show selection history and current role can diverge—any theory must handle this split cleanly. Point (c) is tricky: how to keep "should" in function claims (e.g., "this heart should pump blood") without implying a designer. Clinicians and synthetic biologists need this normativity. 

  Evo-devo in (d) demands reconciling function with redundancy (multiple traits for same role), exaptation (old traits repurposed), and current utility mismatches. And (e) malfunction can't just mean "broken" statistically—a non-pumping heart is malfunctioning even if statistically common in a diseased population. 

  I'll flag where demands conflict—especially synthetic organisms vs. normative malfunction, since engineered systems challenge the etiological link between history and normativity. Also noting where camps disagree, like whether causal-role theorists even want the normative dimension. 

  For illustration: Etiological theories excel at normativity and malfunction by tying function to what was selected for, but stumble on synthetic organisms and exaptation. Causal-role handles synthetic cases and horizontal transfer easily but struggles with normativity and calling something "malfunctioning." The heaviest lift is definitely normative dimension—it alone rules out purely descriptive approaches.
answer: |-
  Here is a comprehensive specification of desiderata for an adequate theory of biological function, structured as requested:

  **Core Desiderata for a Theory of Biological Function:**

  1.  **Synthetic Organism Compatibility:**
      *   **Demand:** The theory must assign non-arbitrary functions to traits in synthetic or engineered organisms (e.g., synthetic bacteria with novel genetic circuits, bioengineered tissues) that lack significant evolutionary histories.
      *   **Motivation:** The rise of synthetic biology creates entities whose traits are *designed* for specific purposes but lack *natural* selection histories. Adequacy requires explaining function in these non-evolutionarily-derived systems.
      *   **Status:** Non-negotiable for contemporary adequacy (empirical reality of synthetic biology).
      *   **Conflict Potential:** Directly challenges the core etiological claim that function *necessarily* depends on a history of natural selection.

  2.  **Horizontal Gene Transfer Distinction:**
      *   **Demand:** The theory must provide principled criteria to distinguish genuine *functional ascription* from mere *causal contribution* in cases where a trait (e.g., a horizontally acquired genetic module, plasmid, or viral element) currently contributes to the system's persistence or reproduction, but this contribution was *not* the reason for its historical selection or acquisition.
      *   **Motivation:** Widespread horizontal gene transfer means traits can have significant current effects that were not selected for in their current host lineage (e.g., an antibiotic resistance gene acquired via plasmid may confer an unintended fitness advantage in a novel environment). Function cannot simply be conflated with current benefit if selection history and current role diverge.
      *   **Status:** Non-negotiable (empirical reality of microbial evolution and genomics).
      *   **Conflict Potential:** Highlights tension between historical origin and current causal role as the basis for function.

  3.  **Non-Intentional Normativity:**
      *   **Demand:** The theory must ground the *normative* dimension of "proper function" (e.g., "the heart *should* pump blood," "this synthetic promoter *is supposed to* express gene X under condition Y") without relying on the intentions of a designer or observer. It must explain malfunction in a way that isn't merely statistical abnormality.
      *   **Motivation:** Essential for clinical diagnostics (identifying dysfunctional organs/tissues) and synthetic biology design/evaluation (determining if a construct works *as intended* based on biological criteria, not just designer intent). Avoids collapsing into anthropomorphism.
      *   **Status:** Non-negotiable for capturing core functional discourse in biology and its applications. (A preference for some causal-role theorists to *avoid* normativity exists, but this is a demand *for* adequacy if normativity is deemed essential).
      *   **Conflict Potential:** The hardest desideratum to satisfy naturally; often seen as the etiological theory's stronghold.

  4.  **Evo-Devo Consistency:**
      *   **Demand:** The theory must be consistent with findings from evolutionary developmental biology regarding:
          *   **Functional Redundancy:** Multiple distinct traits/molecules capable of performing the same functional role (e.g., gene paralogs).
          *   **Exaptation:** Traits originally selected for one function being co-opted for a new, different function (e.g., feathers for thermoregulation co-opted for flight).
          *   **Dissociation of Selected Effect & Current Utility:** Traits persisting due to selection for Effect A may currently contribute primarily to Effect B, which was not historically selected for.
      *   **Motivation:** These phenomena are pervasive in complex biological systems. A theory must handle cases where historical selection, current contribution, and functional identity are not straightforwardly aligned.
      *   **Status:** Non-negotiable (empirical reality of complex organismal evolution).
      *   **Conflict Potential:** Challenges simplistic historical narratives and forces theories to handle multi-layered functional assignments.

  5.  **Robust Malfunction:**
      *   **Demand:** The theory must provide an account of *malfunction* that:
          *   (a) Explains how a trait can *have* a function yet *fail* to perform it (e.g., a diseased heart not pumping).
          *   (b) Does not reduce malfunction to mere statistical abnormality within a population (a statistically rare trait isn't necessarily malfunctioning).
          *   (c) Does not reduce malfunction to simple causal failure (e.g., a rock doesn't malfunction by not pumping blood; only a heart can).
      *   **Motivation:** Central to functional discourse in biology and medicine. Requires a standard of "proper performance" against which failure is measured.
      *   **Status:** Non-negotiable for capturing core functional concepts. (Causal-role theories often struggle significantly here).
      *   **Conflict Potential:** Tightly linked to Normativity (Desideratum 3); satisfying both is difficult for non-etiological theories.

  **Key Conflicts & Illustrative Performance:**

  *   **Primary Conflict:** **Synthetic Organism Compatibility (1)** directly challenges the foundational requirement of **Historical Selection** inherent in standard etiological accounts. Accommodating (1) typically forces a revision or abandonment of the core etiological claim that function *is* selected effect history. Conversely, preserving robust **Non-Intentional Normativity (3)** and **Robust Malfunction (5)** is the etiological theory's major strength but its hardest challenge when facing (1).
  *   **Secondary Conflict:** **Horizontal Gene Transfer Distinction (2)** and **Evo-Devo Consistency (4)** both highlight the potential *divergence* between historical origins and current causal contributions, creating tension for theories heavily weighted towards one pole (pure history or pure current role).

  **Illustrative Performance Against Desiderata (Brief):**

  *   **Standard Etiological Theory (Selected Effects):**
      *   Excels at: **Non-Intentional Normativity (3)** (function is what it was *selected for*), **Robust Malfunction (5)** (fails to do what it was selected to do), partially handles **Evo-Devo (4)** (can assign original vs. exapted functions, though redundancy is trickier).
      *   Fails at: **Synthetic Organism Compatibility (1)** (no relevant selection history). Struggles significantly with **Horizontal Gene Transfer (2)** (is the function defined by selection in the donor lineage, recipient lineage, or neither?).
  *   **Causal-Role Theory (Systemic Capacity/Contribution):**
      *   Excels at: **Synthetic Organism Compatibility (1)** (function based on current role in system), **Horizontal Gene Transfer (2)** (focuses on current contribution, regardless of origin), **Evo-Devo Consistency (4)** (flexible assignment based on current system dynamics, handles redundancy well).
      *   Fails at: Providing **Robust Malfunction (5)** and **Non-Intentional Normativity (3)**. Malfunction often collapses into causal failure or statistical abnormality. Normativity is typically observer-relative ("function *for us* in analyzing the system") rather than intrinsic to the trait/system. Struggles to explain why a diseased heart is malfunctioning *as a heart* rather than just failing to cause circulation.

  **The Most Exclusionary Desideratum:**

  **Non-Intentional Normativity (3) combined with Robust Malfunction (5)** does the most to exclude candidate theories. It demands an objective, non-stipulative, non-intentional standard for what a trait *should* do. While the **Synthetic Organism (1)** demand excludes pure historical theories, many hybrid or revised etiological accounts attempt to address it. However, generating genuine normativity *without* history *or* intentional design is arguably the most profound conceptual hurdle. Theories that fail to satisfy (3)/(5) fundamentally cannot capture the prescriptive "ought" inherent in biological and biomedical functional discourse, making them inadequate for core explanatory tasks in these domains, regardless of their strengths elsewhere.
