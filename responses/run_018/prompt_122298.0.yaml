  Okay, the user is dealing with a philosophical problem about assertion norms, specifically the knowledge norm. They've constructed an argument that challenges the idea that you need knowledge to assert something, using testimonial chains as a counterexample. Their study partner thinks the flaw is between steps (3) and (5), where a second-order requirement is introduced. The user wants to know which step to reject and what the costs are, while also considering epistemic closure.

  First, I need to unpack their argument. Premise (1) states the knowledge norm: you should only assert p if you know p. Then they introduce testimonial knowledge through assertoric inheritance. The key point is the infinite regress in step (6) leading to the absurd conclusion that almost no assertions are permissible. The user feels stuck because (8) seems undeniable.

  The study partner's point about (5) introducing a second-order requirement makes sense. The knowledge norm itself doesn't require knowing that you know; it just requires knowing. So step (5) is where the argument goes wrong. But why does this feel unsatisfying? The user is worried that rejecting (5) means testimony works without verifying the source's knowledge, which seems risky. They're conflating justification for belief with the conditions for knowledge.

  I should consider the reductio ad absurdum angle. The argument shows that if we require second-order knowledge for testimony, it leads to an infinite regress. But the knowledge norm doesn't demand that. So the reductio targets the added requirement in (5), not (1) itself. 

  Epistemic closure might be relevant here. If knowing p requires knowing all the necessary antecedents, then maybe step (6) follows. But closure principles have limits, especially in testimonial cases. The user might be worried about easy knowledge or circularity, but testimonial justification doesn't typically require tracing the entire chain.

  The cost of rejecting (5) is accepting that testimonial knowledge doesn't demand knowing your source knew, which might seem to lower standards. But actually, it's about the structure of justification—testimony can provide justification without requiring meta-justification. The cost of rejecting (1) is giving up the knowledge norm entirely, which has its own problems like allowing assertions based on lucky guesses.

  The user's deeper concern seems to be balancing philosophical rigor with real-world practice. They want to preserve the knowledge norm but need it to accommodate everyday testimony. The solution is to show how testimony can generate knowledge without infinite regress, by accepting testimonial justification as basic or through weaker requirements. I should mention reductionism vs. anti-reductionism in testimony to address this.

  Also, the user mentioned epistemic closure. If they accept a strong closure principle, step (6) might seem inevitable. But closure isn't always applied that way in testimony. Explaining that could help them see why the regress isn't necessary.

  In summary, the main flaw is step (5), and rejecting it allows testimonial knowledge without infinite regress. The cost is accepting that knowledge via testimony doesn't require knowing your source knew, but that's manageable with proper accounts of testimony. This preserves the knowledge norm while accommodating everyday assertions.
answer: |-
  You've hit on one of the deepest problems in epistemology: the **transmission of knowledge via testimony**. Your reductio is powerful, and your study partner is pointing in the right direction. The core flaw is indeed between (3) and (5), but the implications aren't as dire for the knowledge norm (KN) as you fear. Let's break it down step-by-step:

  ### The Critical Step: Where Your Argument Goes Wrong
  *   **Step (5) is the illegitimate move:** You claim that for testimonial knowledge to justify your assertion, you must *know that your friend knew p*. **The knowledge norm (KN) does not require this.** KN only requires that *you know p*, not that you know *how* you know it or that you know *that your source knew it*.

  *   **KN's Requirement:** KN: "You should assert p only if you know p."
  *   **What (5) Adds:** (5): "To know p via testimony, you must know that your source knew p."
  *   **The Leap:** You've smuggled in a **second-order knowledge requirement** (knowing *about* your source's epistemic state) that the basic knowledge norm *doesn't contain*. KN is about *your* state regarding p, not your state regarding your source's state.

  ### Why Rejecting (5) Doesn't Make Testimony "Risky" or KN "Useless"
  Rejecting (5) doesn't mean testimony works magically or that you can blithely assert anything you're told. It means the conditions for *gaining knowledge* via testimony (and thus being licensed to assert) are **weaker and more realistic**:

  1.  **Justification, Not Second-Order Knowledge:** To gain knowledge from testimony, you generally need *justification for believing your source is reliable/relevant/knowledgeable* in this context. This justification **does NOT require you to *know* they know p**. It requires reasonable, context-sensitive grounds for trusting them.
      *   *Examples:* Your friend has reliably told you geographical facts before. They said it confidently in a normal context. You know they studied geography. You have no reason to doubt them. *This justifies trusting them without requiring you to prove they "knew" it (which might be impossible).*

  2.  **Anti-Reductionism about Testimony (The Common Sense View):** Many philosophers (e.g., Thomas Reid, Tyler Burge) argue that accepting testimony as a *basic source of justification/knowledge* is fundamental to human cognition. We are *prima facie justified* in believing what others tell us, unless we have specific reasons for doubt. This justification *can* rise to the level of knowledge without a regress. You don't need to verify the entire chain; responsible reliance on a source can suffice.

  3.  **KN Still Does Work:** Even with testimony, KN:
      *   **Rules Out Lucky Guesses:** You can't assert p just because you guessed and happened to be right. You need justification.
      *   **Rules Out Known Falsehoods:** You can't assert p if you know or strongly suspect it's false, even if your source said it.
      *   **Requires Responsible Trust:** KN still demands that your trust in the source *be justified* based on available evidence/reason. Asserting based on testimony from a known liar or on a topic they know nothing about violates KN because *you don't know p* (your belief isn't properly justified).
      *   **Explains Blameworthiness:** If you assert p based on irresponsible testimony (e.g., trusting a random stranger on the street about complex physics) and p is false, you are blameworthy *precisely because you failed to meet the conditions for knowing p via testimony*.

  ### The Cost of Rejecting Premise (1) (The Knowledge Norm Itself)
  If you reject (1) to avoid the regress, you face significant costs:

  1.  **The Moorean Paradox Problem:** Assertions like "It's raining but I don't know it is" or "It's raining but I don't believe it" sound deeply odd/wrong. KN provides the best explanation for this oddness. Belief/Truth norms struggle here.
  2.  **Lucky Assertions:** If only belief is required, you could blamelessly assert a wildly lucky guess ("The number of stars is even!") based on no evidence. If only truth is required, you could assert something true that you have every reason to believe is false. Both seem intuitively wrong and undermine the function of assertion (sharing knowledge).
  3.  **Weakens the Social Function of Assertion:** Assertion is a core mechanism for spreading knowledge. KN best captures the idea that when someone asserts p, they present themselves as *knowing* it, giving others a strong reason to believe it. Belief/Truth norms weaken this social guarantee.

  ### Epistemic Closure & Its Role
  Your instinct about closure is spot on. This is where the regress argument gets its teeth:

  *   **The Closure Principle (Roughly):** If you know p, and you know that p entails q, then you can know q (or are in a position to know q).
  *   **How it *Seems* to Apply:** If you know p via your friend's testimony, and you know that "My friend told me p" entails "My friend knew p" (or at least "My friend reliably testified to p"), then closure *suggests* you must be able to know "My friend knew p".
  *   **Why it Doesn't Force the Regress:**
      1.  **Entailment isn't Automatic:** Does "My friend told me p" *entail* "My friend knew p"? No. They could be mistaken or lying. It only entails "My friend *believed* p" or "My friend *asserted* p".
      2.  **Knowing the Entailment:** Do you *know* that your friend's testimony entails their knowledge? You usually don't have that kind of certainty about their mental state.
      3.  **Closure Applies to Known Entailments:** Closure requires you *know* the entailment (p -> q). In the testimonial case, you rarely *know* that your friend's telling you p entails they know p. You justifiably *believe* it's likely, based on evidence for their reliability.
      4.  **Closure Doesn't Require Infinite Justification:** Even if closure applied (e.g., "I know p" & "I know p entails my source was reliable"), it only requires you *could* come to know the consequent *if you performed the inference*. It doesn't mean you must *already* know the consequent *prior* to knowing p, nor does it require you to actually trace an infinite chain back. Closure is about potential knowledge expansion, not pre-existing infinite justification chains.

  ### The Way Forward: Keeping (1) Without Absurdity
  1.  **Reject Premise (5):** This is the cleanest solution. The knowledge norm requires *you know p*, not that you know *that your source knew p*.
  2.  **Accept Testimonial Knowledge as Fundamental:** Responsible reliance on a source, given appropriate justification (which doesn't require proving their knowledge), *can* give you knowledge of p. This breaks the regress.
  3.  **The Cost of Rejecting (5):** Accepting that testimonial knowledge doesn't require second-order knowledge about the source's state feels "risky" because it means our knowledge rests on social trust. However, this isn't a *cost* of the theory; it's an accurate description of how human knowledge *actually works*. The alternative (requiring second-order knowledge) is impossible, making *all* testimonial knowledge impossible – that's the real absurdity. The "risk" is managed by requiring *justification for trust*, not certainty about the source's knowledge.
  4.  **KN Remains Plausible:** KN still explains the core wrongness of asserting what you don't know, handles Moorean paradoxes, and captures the social function of assertion. It accommodates testimony by recognizing justified trust as a pathway to knowledge.

  **Conclusion:** Your study partner is correct. The fatal step is (5). Rejecting it doesn't make testimony "risky" in a way that undermines the knowledge norm; it simply acknowledges how testimonial justification actually works (justified trust, not second-order knowledge). This saves KN from your reductio without collapsing into a weak belief or truth norm. The regress argument powerfully shows why requiring second-order knowledge for testimony is impossible, but KN itself doesn't require that. Epistemic closure doesn't force the regress because the key entailments aren't known with certainty in real testimonial cases. You *can* keep (1) – the knowledge norm is still the strongest contender, precisely because it *can* plausibly accommodate the vast amount of knowledge we gain via testimony without demanding the impossible.
