answer: |-
  ## Exam Prompt: Moral Psychology Seminar - Final Essay

  **Dr. Aris Thorne is a leading climate scientist whose research on polar ice melt dynamics is crucial for refining global warming projections. She is also a dedicated single parent to a 10-year-old child. Thorne is offered two paths:**

  1.  **"Project Sentinel":** Lead a high-profile, multi-year international advocacy campaign demanding immediate, radical emissions cuts. This involves near-constant global travel, media engagements, and high-stakes political pressure. Success could *potentially* shift policy significantly, averting some worst-case scenarios, but the role demands complete immersion, forcing her to be physically absent from her child for years.
  2.  **"The Alpine Institute":** Accept a prestigious research fellowship at a remote, well-funded mountain observatory. Here, she could conduct groundbreaking, high-impact *research* on atmospheric feedback loops, refining models with unprecedented data. While vital for long-term understanding, the direct policy impact is less immediate and forceful. Crucially, this role allows her to live with and be fully present for her child.

  Thorne, after deep reflection, chooses The Alpine Institute. She explicitly states: "Running the utilitarian calculus – weighing potential megadeaths averted by Sentinel against the developmental harm to my child – feels like a betrayal of both who I am as a scientist dedicated to pure understanding *and* who I am as a parent. I *cannot* make that calculation; it would destroy something fundamental in me."

  **Analyze Thorne's refusal to perform the utilitarian calculus using Bernard Williams' concepts of integrity and the "one thought too many." Is her stance best understood as preserving a genuine "ground project" constitutive of her integrity, or is it merely moral laziness disguised as deep attachment? In your answer, you MUST:**

  *   **a)** Explain why Williams believes such calculations can be *corrupting* (not just inconvenient or difficult) for an agent's integrity.
  *   **b)** Clearly distinguish between a "ground project" and a "deep attachment" in Williams' framework, using Thorne's dilemma as your primary illustration (DO NOT rely solely on the standard spousal rescue example).
  *   **c)** Justify whether her refusal constitutes a "one thought too many" scenario in Williams' sense and why.

  ---

  ## Model Answer (Approx. 600 words)

  Thorne's refusal is a compelling instance of Williams' integrity objection in action, best understood as preserving genuine ground projects rather than mere laziness. Williams argues that utilitarianism, by demanding the agent adopt an impersonal, maximizing standpoint, alienates them from their deepest commitments – the "ground projects" that give life meaning and constitute their sense of self. These aren't just strong preferences; they are the frameworks through which we understand our reasons for acting and our very identity. Performing the utilitarian calculus in scenarios deeply connected to these projects isn't just *hard*; it's *corrupting* because it forces the agent to step outside themselves, viewing their core commitments merely as one set of preferences among others to be weighed. This external viewpoint dissolves the special authority these projects hold *for the agent*, turning what should be a constitutive part of their reason-giving framework into a contingent, disposable input. The act of calculation itself becomes a betrayal of the self, fragmenting integrity.

  Distinguishing ground projects from deep attachments is crucial here. A **deep attachment** is a strong emotional bond to a particular person, thing, or activity (e.g., Thorne's love for her child). It provides strong motivation, but its *reason-giving force* might still be weighed against other reasons within the agent's overall practical reasoning. A **ground project**, however, is deeper: it provides the *structure* for reasoning and identity. It defines what counts as a compelling reason *for that agent*. Thorne's dilemma involves *two potential ground projects*, not just attachments. Her dedication to climate science isn't just a job she likes (attachment); it's a lifelong pursuit of understanding fundamental truths about the planet, constituting her identity as a *scientist* committed to knowledge for its own sake and its long-term implications. This defines her values, her community, her sense of purpose. Similarly, her role as a parent isn't just deep love (attachment); it's a constitutive commitment defining her identity, responsibilities, and the very fabric of her daily life and future – it's *who she is*.

  Sentinel demands she instrumentalize *both* projects. To calculate the global utility of Sentinel versus Alpine requires her to treat her core identity as a scientist (valuing pure research) merely as a preference to be sacrificed for greater aggregate good, *and* to treat her identity as a present parent as another preference potentially outweighed by distant suffering. This calculation is corrupting because it asks her to deny the *constitutive* role these projects play in her practical identity. Her refusal ("I *cannot* make that calculation") reflects Williams' idea of "moral incapacity" arising from integrity – the thought required by utilitarianism is literally *unthinkable* for her without self-betrayal.

  This directly relates to the "one thought too many." Utilitarianism would demand Thorne think: "I must weigh the potential global benefits of Sentinel against the harms to my child and my scientific ideals." For Williams, this *is* the one thought too many. The morally adequate response – the one reflecting genuine integrity – is rooted *directly* in her ground projects. Her reasons flow *from* being a dedicated scientist (choosing Alpine preserves that identity) *and* from being a parent (choosing Alpine preserves that identity). Adding the layer of impersonal maximization ("But what about the *greater* good?") requires her to step outside these identities to judge them, corrupting the source of her reasons. It's not laziness; it's recognizing that the calculation itself violates the integrity it seeks to assess. Laziness implies avoiding effort; Thorne's choice involves immense effort and sacrifice (forgoing potential global impact). Her refusal preserves the wholeness of a self defined by these fundamental commitments against the fragmenting demands of impersonal morality.

  ---

  ## Marking Scheme (Out of 20)

  **Must-Hit Points (4 marks each):**

  1.  **Corruption vs. Inconvenience:** Explains *why* Williams sees the utilitarian calculation as *corrupting* (alienation, viewing constitutive commitments as contingent preferences, dissolving personal integrity) rather than just difficult or inconvenient. *(Botch: Just says "it's hard" or "it feels bad," misses the identity/alienation angle.)*
  2.  **Ground Project vs. Attachment (Applied):** Clearly defines both concepts *and* applies them specifically to Thorne's dilemma, arguing that *at least one* (ideally both) of her commitments (science/parenting) functions as a **ground project** (constitutive of identity/reason-giving framework), not just a deep attachment (strong motivation/feeling). Uses Thorne's case as the primary illustration. *(Botch: Recites the spousal example; calls Thorne's commitments only "attachments"; fails to link project to identity/reason-structure.)*
  3.  **Integrity/Laziness Assessment:** Takes a clear stance on whether the refusal is integrity-preserving or laziness, grounded in Williams' framework. Must engage the "laziness" challenge explicitly. *(Botch: Avoids taking a stance; labels it laziness without engaging Williams; asserts integrity without argument.)*
  4.  **"One Thought Too Many" in Context:** Explains how Thorne's refusal exemplifies Williams' "one thought too many" – why the utilitarian thought is superfluous/corrupting *specifically in relation to her ground project(s)*. *(Botch: Just defines the phrase generally; fails to connect it concretely to Thorne's reasoning/refusal.)*
  5.  **Avoids Spousal Crutch & Williams Core:** Argument relies primarily on Thorne's case and Williams' core concepts (ground projects, integrity, corruption, alienation, reasons internalism). Does not lean heavily or solely on explaining the standard spouse example. *(Botch: Spends excessive time rehashing the spouse case; answer doesn't demonstrate understanding beyond that example.)*

  **Overall Structure & Clarity:** (Holistic assessment within the 20, not a separate point). Deduct up to 2 marks if poorly structured or unclear despite hitting points.
