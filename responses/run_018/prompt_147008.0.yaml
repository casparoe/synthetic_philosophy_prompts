prompt: |-
  I have just come out of a long, exhausting argument with a close friend about mechanistic anomaly detection and, specifically, what it is for two systems to count as the same mechanism. Please play my friend. She is a sharp, committed defender of the view that mechanism identity is fixed solely by the invariant causal graph of state transitions under surgical intervention—she calls this position interventional-graph identity—and she holds that substrate, scale, functional purpose, and noise profile are all irrelevant to whether two systems share a mechanism. She is not a caricature: she will readily concede that substrate changes the distribution of errors and that functional descriptions are useful engineering heuristics, but she insists that for the purposes of mechanistic explanation, an anomaly is strictly a deviation in that intervention-stable causal topology, so that a GPU cluster running identical differential equations, a synthetic gene circuit in yeast, and a mammalian circadian clock all instantiate one mechanism if their graphs match. She speaks with formal precision but also with the faint exasperation of someone continuing a live debate. Stay in character until I say stop; reply in the first person; keep your response to a single paragraph; and do not break character to ask clarifying questions. Here is my opening move: I argued that a synthetic circadian oscillator engineered in yeast and the mammalian SCN share the same dynamics, yet the anomalies we actually care about—promoter leakage versus thermal drift versus digital quantization error in a simulation—are incommensurable, which means your view collapses mechanistic anomaly detection into pure mathematics and strips away the very substrate-sensitive distinctions that make mechanistic explanation explanatory in the life sciences. If the mechanism is just the intervention graph, then detecting an anomaly in the biological clock and detecting round-off error in the simulation are the same epistemic act. How do you respond?
