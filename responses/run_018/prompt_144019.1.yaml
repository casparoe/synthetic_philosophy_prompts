prompt: |-
  Look, I'm a retired cell-biology researcher — spent thirty years on signaling pathways — and now I'm poking around philosphy like it's a second career. I want to draft a short research proposal, maybe for a one-semester independant study or a small workshop pitch, about that gender-equality paradox where more egalitarian countries end up with more gendered career choices. I want to sidestep the usual nature-versus-culture shouting match.

  My half-baked idea is that we keep treating equality as a single dial, but it's really three: formal rights, material resources, and what I'm calling normative scafolding — the implicit social cues that tell people which choices are legitimate for them. Maybe egalitarian societies max out the first two but strip away the old scaffolding that used to nudge people across gender lines, leaving preference (or maybe just unopposed socialization) to drive the divergence. So the real philosophical question isn't just nature or culture, but whether this divergence is actually a failure of justice or just what justice looks like when normative scafolding is removed.

  Can you turn this into a proper proposal? I need: the precise question stated clearly; why the standard positions (nature, culture, justice) don't settle it; the approach — conceptual analysis comparing equality metrics to choice divergence, not empirical data collection since I don't have a lab anymore; what a result would look like and what counts as failure; and an honest scope check for about three months part-time. Keep the tone casual, skip any bibliography or citations — I'll chase those down myself. And please don't put any verbatim quotes in quotation marks; paraphrase if you mention someone's view. Don't worry about perfect grammar — I still mix up affect and effect all the time.
