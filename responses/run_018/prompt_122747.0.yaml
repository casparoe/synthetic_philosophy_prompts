  - One grad student working on autonomous ratchets - probably the most dangerous questioner

  For the Q&A prep, I should:
  1. Predict the top 8 objections ranked by (likelihood × damage)
  2. Craft 90-second rebuttals for each
  3. Identify soft spots in each reply
  4. Suggest preemptive concessions
  5. Flag the make-or-break rebuttal (probably the ratchet question)
  6. Identify the nightmare question they're hoping to avoid
