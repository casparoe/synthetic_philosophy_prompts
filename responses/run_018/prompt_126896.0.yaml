answer: |-
  Here is a comprehensive specification of desiderata for evaluating theories of the careenium-simmball relation, structured by domain, with motivations, tensions, and negotiability flags:

  ---

  ### **I. Causal Scenarios to Accommodate**  
  *(Non-negotiable: Must explain all; negotiable: Weighting of evidence)*  

  1. **Symbolic Downward Causation (SDC)**  
     - **Scenario**: A simmball recombination (e.g., inferring "A causes C" from "A causes B" and "B causes C") triggers novel careenial reconfiguration (e.g., new resonant frequencies in a layer).  
     - **Motivation**: Accounts for intentional action (e.g., deciding to move yields neural firing patterns).  
     - **Non-negotiable**: Theories must address whether SDC *exists*, not whether it is reducible.  

  2. **Substrate Upward Constraint (SUC)**  
     - **Scenario**: Careenial noise (e.g., thermal fluctuations) corrupts simmball binding (e.g., misbinding "red" to "circle" in perception) without altering combinatorial rules.  
     - **Motivation**: Neural damage impairing syntax despite intact grammar knowledge.  
     - **Non-negotiable**: Accommodate SUC as a baseline.  

  3. **Emergent Stability (ES)**  
     - **Scenario**: Persistent attractor states (e.g., a belief) maintain integrity despite substrate turnover (e.g., molecular replacement), unexplained by micro-dynamics alone.  
     - **Motivation**: Robust memory or conceptual constancy over time.  
     - **Negotiable**: Degree of emergence required (weak vs. strong).  

  4. **Substrate-Precedes-Symbol (SPS)**  
     - **Scenario**: Careenial plasticity (e.g., dendritic growth) enables *new* simmball formations (e.g., learning a language) not previously representable.  
     - **Motivation**: Brain development enabling abstract thought in children.  
     - **Non-negotiable**: Must not require simmballs to magically pre-exist their physical conditions.  

  ---

  ### **II. Conceptual Distinctions to Preserve**  
  *(Non-negotiable: Must respect distinctions; negotiable: How they are modeled)*  

  5. **Causal Contribution vs. Constitutive Dependence (CC/CD)**  
     - **Requirement**: Distinguish simmball *activity causing* careenial change (CC) from simmballs *being constituted by* careenial states (CD).  
     - **Motivation**: Avoiding conflations where "implementation" erases top-down efficacy (e.g., software *running on* hardware vs. software *as* hardware).  

  6. **Token vs. Type Causality (TvT)**  
     - **Requirement**: Explain how *specific* simmball instances (tokens) might affect substrate tokens, without requiring all simmball *types* to have downward power.  
     - **Motivation**: A particular thought ("drink water now") causing specific motor neurons to fire, even if "thirst" as a type doesn’t always do so.  

  7. **Pushing vs. Being Pushed (PvBP)**  
     - **Requirement**: Clarify when simmball dynamics drive careenial change ("pushing") vs. merely tracking substrate activity ("being pushed").  
     - **Motivation**: Deliberate problem-solving (pushing) vs. reflex arcs (pushed).  

  ---

  ### **III. Physical/Formal Constraints to Satisfy**  
  *(Non-negotiable: Compliance with physics/logic; negotiable: Interpretation)*  

  8. **Energy Conservation & Causal Closure (EC/CCP)**  
     - **Requirement**: No simmball-initiated events violating energy conservation or causal closure of the physical.  
     - **Motivation**: Avoiding "spooky" causation; careenium must supply energy for all changes.  
     - **Non-negotiable**: Violation falsifies theory.  

  9. **No Supervenient Causation Sans Mechanism (NSCM)**  
     - **Requirement**: If simmballs supervene on careenium, downward causation requires a *causal mechanism* (e.g., feedback loops) beyond mere supervenience.  
     - **Motivation**: Blocking "causation by reason alone" (e.g., mental states can’t cause brain changes *just* by being mental).  

  10. **Computational Consistency (CC)**  
      - **Requirement**: Simmball dynamics must align with computability (e.g., no uncomputable operations) and information theory (e.g., noise limits).  
      - **Motivation**: Simmballs must be physically realizable; careenium cannot violate Church-Turing limits.  

  ---

  ### **IV. Tensions Between Desiderata**  
  *Jointly problematic pairs under standard assumptions:*  

  - **SDC + EC/CCP**: Downward causation risks violating causal closure unless mechanisms (e.g., structured constraints) *harness* substrate energy non-magically.  
  - **ES + NSCM**: Emergent stability may imply novel causal powers not reducible to substrate mechanisms, conflicting with NSCM.  
  - **PvBP + CC/CD**: If simmballs are *constituted* by substrate, "pushing" may collapse into epiphenomenalism unless causal roles are emergent.  

  ---

  ### **V. Camp-Specific Preferences**  
  *(Negotiable based on metaphysical commitments)*  

  11. **Combinatorial Freedom (CF)**  
      - **Preference**: Simmballs can recombine in ways *not prefigured* by careenial architecture (e.g., novel concepts). Favored by symbol-autonomy views.  
      - **Motivation**: Human creativity and generativity.  

  12. **Substrate Sensitivity (SS)**  
      - **Preference**: Simmball properties are *always* modulated by careenial details (e.g., binding speed depends on neurotransmitter levels). Favored by substrate-monist views.  

  13. **Epistemic Indispensability (EI)**  
      - **Preference**: Simmball-level explanations are *necessary* for cognitive science (e.g., semantic content). Favored by inter-level coupling views.  

  ---

  ### **Brief Evaluation of Existing Approaches**  
  - **Substrate Monism**: Excels at SUC, SPS, EC/CCP, NSCM; struggles with SDC, ES, CF, EI (risks eliminativism).  
  - **Symbol Autonomy**: Excels at SDC, CF, EI; struggles with SPS, EC/CCP, NSCM (risks dualism).  
  - **Inter-Level Coupling**: Excels at ES, PvBP, TvT; must reconcile NSCM with SDC and avoid overdetermination.  

  This specification provides a theory-neutral benchmark. Resolving tensions (e.g., via *constrained emergence* or *non-reductive realization*) is the central challenge. Prioritize non-negotiables (physics, causal asymmetry) to filter untenable models early.
