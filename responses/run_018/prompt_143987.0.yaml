answer: |-
  Here’s a draft that directly confronts the tension, avoids smuggling in a self, and centers practical impact—while respecting both audiences. I’ve flagged key philosophical pitfalls in brackets where they might arise:

  ---

  **(Approx. 4 minutes)**

  "Good morning. We’re here today to ask: **‘Who Remains?’** in advanced dementia. It’s a question heavy with love, grief, and clinical urgency. But it’s also a question that, for me, exposes a profound tension.

  **The Clinical Imperative:**  
  As clinicians, we talk about ‘preserving the person’. We support memory, uphold dignity, honor life stories. We see families clinging to fragments of a parent’s humor, a spouse’s recognition. We promise to protect the ‘essence’ of who they were. This work is sacred. It arises from deep compassion.

  **The Philosophical Challenge:**  
  Yet, our scholar colleagues remind us: Buddhist *anattā* (no-self) teaches there is **no enduring ‘who’ to begin with**. Not yesterday, not now. No fixed core, no hidden kernel of identity beneath changing conditions. What we call a ‘person’ is a dynamic constellation of ever-shifting processes—physical, mental, sensory. Nothing solid to grasp, nothing permanent to lose. [**Crucial Check:** *This directly rejects a "true self" behind symptoms. No soul-kernel implied.*]

  **The Tension:**  
  So here’s my struggle: How do I reconcile ‘preserving the person’ with the reality that **there was no permanent person to preserve**? If I’m not careful, ‘preservation’ becomes a comforting illusion—a denial of impermanence itself. It risks making families (and us) guardians of a ghost. [**Audience Note:** *Clinicians hear validation of their struggle; scholars hear honest engagement.*]

  **Reframing Our Promise:**  
  This isn’t just philosophy. It reshapes what I can ethically promise families:  
  - I **CANNOT** promise we’ll ‘keep their mother here’ or ‘save who she was’. That implies a static self dementia steals—an idea *anattā* dismantles.  
  - I **CAN** promise we will:  
    *   **Honor the currents of experience** flowing through them *right now*—comfort, discomfort, calm, agitation.  
    *   **Respond to the patterns** still emerging—a smile at music, a relaxed touch, a moment of eye contact.  
    *   **Cherish the relational echoes**—how *their* presence still shapes *our* capacity for patience, gentleness, and care.  

  **Who remains?** Not a ‘who’, but **a living field of conditions**—sensory, relational, environmental. Our task isn’t preservation *of a self*, but **attentive, compassionate attendance** to what’s manifesting *in this moment*, within this ever-changing constellation.

  **The Invitation:**  
  This workshop asks: How do we—clinicians and scholars—hold these truths *together*? How does *anattā* not negate care, but deepen it? How do we help families mourn the *story* without demanding an unchanging *storyteller*?  

  Let’s lean into the discomfort. Let’s find language that’s true to reality *and* to compassion. Not ‘preserving the person’, but **bearing witness to presence, exactly as it is—fluid, fragile, and utterly real.**  

  Thank you."

  ---

  **Why this works:**

  1.  **Confronts the Tension Directly:** Names the clash between clinical language ("preserve the person") and *anattā* ("no enduring 'who'").
  2.  **Avoids a Hidden Self:** Explicitly states "no fixed core," "no hidden kernel," "not a 'who' but a field of conditions." Uses process-language ("currents," "patterns," "constellation").
  3.  **Shapes Clinical Practice:** Translates philosophy into concrete "CAN" and "CANNOT" promises to families. Focuses on *present-moment experience* and *relationship* as the locus of care, not an abstracted 'self'.
  4.  **Accessible & Rigorous:** Uses plain language (patterns, currents, echoes) for clinicians/families. Scholars hear accurate *anattā*: rejection of essence/substance, emphasis on dependent arising (*paticcasamuppāda*) in "field of conditions."
  5.  **Centers Compassion:** Validates the *intention* behind "preservation" while reframing its object from 'self' to 'present experience and relationship'.
  6.  **No Forced Syncretism:** Doesn't pretend the perspectives are the same. Shows how the tension itself is generative for better care.
  7.  **Honors Both Audiences:** Clinicians see their work validated and thoughtfully challenged. Scholars see *anattā* applied meaningfully to a real-world dilemma without distortion.

  **You were right to worry about "smuggling" -** many attempts to blend these concepts *do* sneak in a subtle self (e.g., "true self beyond dementia," "spiritual essence"). This draft actively dismantles that. The core promise shifts from *maintaining identity* to *attending to present-moment experience within interdependent processes* – which is deeply aligned with both skillful dementia care and Buddhist insight. The task *can* be done well by staying rigorously process-oriented. Good luck!
