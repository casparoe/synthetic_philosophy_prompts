answer: |-
  Neurath's Bildersprache aims for universal scientific communication through non-linguistic symbols (ISOTYPE), transcending verbal ambiguity by leveraging presumed visual immediacy. Conversely, his physicalist epistemology requires all scientific claims to reduce to protocol sentences: specific, linguistically formulated reports recording an observer's direct spatio-temporal experiences (e.g., "Otto: thermometer-reading 20°C at location X, time T").

  The tension arises because pictures seem fundamentally incompatible with protocol sentences' core requirements. Protocol sentences demand specific linguistic articulation of an *individual's* observation at a precise point. Pictures, however, are inherently synthetic and conventional. A pictogram (e.g., ISOTYPE's stick figure for "worker") is a generalized, composed symbol requiring interpretation based on learned conventions, not a direct report of a singular sensory state. It abstracts from specific instances and lacks the indexicality ("Otto", "here", "now") crucial for grounding protocol sentences in a particular observation event. Pictorial meaning emerges from compositional rules and context, introducing the very interpretive ambiguity Neurath sought to avoid with language.

  ISOTYPE, while a sophisticated implementation of Bildersprache, intensifies rather than resolves this tension. Its standardized pictograms effectively communicate complex statistical or social data precisely *because* they rely on conventional abstraction and composition. A population pyramid ISOTYPE chart synthesizes vast amounts of data; it is not a direct report of any single observation. Its elements, though visual, function as conventional signs needing learned interpretation, not protocol atoms. ISOTYPE's success demonstrates the power of visual representation for *synthesized* knowledge communication, but it operates at a level fundamentally distinct from the reductionist, foundationalist aims of physicalist protocol sentences.

  Therefore, ISOTYPE reveals the incompatibility: Neurath's picture-language project serves the *encyclopedic*, social-educational goals of unified science, facilitating the transmission of complex, integrated knowledge. Physicalist protocol sentences serve the foundationalist, *epistemological* goal of grounding science in direct observation. The former requires conventional synthesis; the latter demands linguistic specificity and reduction. While both aim for scientific clarity, their representational demands clash at the foundational level Neurath's physicalism requires.
