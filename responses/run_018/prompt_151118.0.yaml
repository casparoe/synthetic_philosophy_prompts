answer: |-
  1.  The stall is substantive but masked: the core disagreement concerns the metaphysical nature of agency itself (whether personal projects are identity-constitutive or merely preference-based), obscured by using "integrity" univocally.
  2.  The hidden fracture is primarily an ambiguity in "integrity": Williams relies on non-alienated phenomenological ownership (actions must feel authentically "mine"), while utilitarians defend narrative coherence (consistent pursuit of valued ends over time).
  3.  A hidden empirical claim about moral psychology does crucial work: utilitarians implicitly assume universal calculative reasoning is psychologically possible without alienation, while Williams (and critics) see such calculation as inherently corrosive to deep commitments' motivating force.
  4.  The sides operate with incompatible data: Williams prioritizes first-person phenomenology of agency (how deliberation *feels*), while utilitarians prioritize third-person behavioral outcomes and coherence of choice architecture.
  5.  Conceptual distinction (e.g., separating phenomenological from narrative integrity) could clarify but not resolve the debate; permanent impasse is likely as it reflects bedrock intuitions about the self's relation to value that resist formal argument.
