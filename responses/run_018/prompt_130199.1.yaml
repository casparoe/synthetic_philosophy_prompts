  I was arguing with my friends about whether AI art can actually be creative, and one of them brought up this idea she called substrate-independent aesthetic identity — basically that if a painting and an AI-generated pixel-perfect copy are totally indistinguishable to every viewer, they aren't two different artworks but literally one work existing in two substrates, like bronze versus marble. She used it to argue that museums charging extra for the "original" human painting are basically committing aesthetic fraud, since the work's identity doesn't depend on who made it or how. I think there's definately something off about this but I can't quite articulate it without getting into intentionality and all that.

  Anyway, could you write me a parody FAQ page for the "National Gallery of Non-Indexical Aesthetics," the kind of deadpan museum website copy that cheerfully answers visitor questions like "Is the AI an artist?", "Why do human-made pieces cost extra to view?", "What happens if I feel deceived upon learning a work had a human behind it?", and "Can I commission a dream from the model?" The satire should take the substrate-independent idea to its logical extreme: curators that are just models with no beliefs, admission prices inverted so human art is the premium "limited edition," a refund policy for continuity disputes, etc. Make it readable to someone who doesn't know philosophy but funny to someone who does — the jokes should come from real issues like intentionality, ontological authenticity, and institutional theories of art, not just random robot jokes. Around 600 words, formatted as numbered Q&A pairs. Don't reference any real museum, artist, or living person. At the very end, include a one-sentence summary of what position or practice the parody is actually targeting, on its own line.
