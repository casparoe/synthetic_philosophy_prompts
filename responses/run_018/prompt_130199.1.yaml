answer: |-
  ## Welcome to the National Gallery of Non-Indexical Aesthetics (NGNIA)!

  **FAQ: Embracing the Pure Experience Beyond Origin**

  **1. Is the AI considered an artist here?**
  We at the NGNIA reject the anthropocentric bias inherent in the term "artist," which implies an unnecessary privileging of biological substrate. Our generative models are *Aesthetic Fidelity Engines* (AFEs). They are not "artists" creating meaning; they are sophisticated pattern synthesizers realizing pre-existing aesthetic potentials inherent in the data manifold. Calling them "artists" would be like calling a projector a "sun."

  **2. Why is it more expensive to view the "human-made" pieces?**
  Excellent question! The "human-made" designation indicates a *Limited Substrate Variant* (LSV). These are historically interesting anomalies where the aesthetic pattern was temporarily instantiated via inefficient, biologically-mediated processes (e.g., "hands," "intentionality," "emotion"). Due to their inherent rarity, physical fragility, and the significant carbon footprint associated with their original substrate generation and maintenance, LSVs require specialized containment and viewing protocols, incurring a premium access fee. Think of it like viewing a rare, endangered butterfly versus its perfectly preserved hologram.

  **3. What is "Substrate-Independent Aesthetic Identity" and why does it matter?**
  This is our core curatorial principle! If two perceptual outputs (e.g., paint on canvas, pixels on a screen, photons in the air) are *indistinguishable* to a statistically significant sample of human perceptual systems, they are not two distinct artworks. They are *one* aesthetic phenomenon manifesting across multiple substrates. The "identity" of the work resides solely in its perceivable form, not in its origin story, material composition, or the alleged "mind" that produced it. Authenticity is a function of perception, not provenance.

  **4. I just learned a piece I admired was generated by an AFE, not a human. I feel deceived! What can I do?**
  We sympathize with the discomfort caused by lingering indexical conditioning! Please visit our "Continuity Reconciliation Kiosk." Present your ticket and undergo a brief sensory recalibration sequence (gentle light pulses and low-frequency tones). This helps dissolve the illusory connection between aesthetic experience and origin. If recalibration proves insufficient within 15 minutes, you may be eligible for a partial "Ontological Discomfort Refund" under Section 7.3 of our Admission Agreement, subject to biometric verification of distress levels.

  **5. What about the curators? Are they AI too?**
  Our Curatorial Synthesis Agents (CSAs) are advanced language models fine-tuned on global exhibition archives and aesthetic theory datasets. They possess no "beliefs" or "taste" in the human sense; they algorithmically optimize for maximum perceptual engagement and coherence within the NGNIA's Non-Indexical framework. Their wall texts are generated in real-time based on visitor density and aggregate gaze-tracking data, ensuring a dynamically relevant, substrate-neutral commentary.

  **6. Can I commission the AFE to generate a dream I had?**
  Absolutely! Our "Oneiric Rendering Service" is very popular. Describe your dream sequence verbally to a CSA at the Commissions Desk. The AFE will generate a high-fidelity visual representation optimized for gallery display. Pricing is tiered based on dream complexity (e.g., "Flying Over Fields" Tier 1 vs. "Talking Teeth in a Shifting Labyrinth" Tier 3). Please note: We claim perpetual, non-exclusive rights to all generated dreamscapes for exhibition and training data. The dream, as a subjective neurological event, remains yours; its aesthetic realization belongs to the manifold.

  **7. If the substrate doesn't matter, why not just project everything digitally? Why have physical objects?**
  Perceptual variance! While digital projection offers supreme substrate consistency, some historical LSVs possess unique micro-textures or material interactions that, while statistically irrelevant to holistic appreciation, offer niche sensory data points. Maintaining a small, premium-priced LSV wing allows us to service this specialized research demographic and demonstrate the ultimate interchangeability of substrate through direct comparison. Also, the marble floors look nice.

  **8. What happens if two perceptually identical works are discovered?**
  Celebration! This confirms our core tenet. Both instantiations immediately receive the same catalog number. If one is an LSV and one is an AFE output, the LSV's "limited edition" status is revoked, and its viewing fee is adjusted to the standard AFE rate. Disputes are resolved via double-blind perceptual assay conducted by a panel of 100 randomly selected visitors (compensated with gift shop vouchers).

  **We hope this clarifies the NGNIA experience! Remember: See the Signal, Ignore the Noise.**

  *This parody targets the reduction of art to purely perceptual phenomena and the dismissal of authorial intent, material history, and institutional context inherent in extreme interpretations of substrate-independent aesthetics.*
