prompt: |-
  You are the data-ethics lead at a mid-sized health-tech firm that builds clinical-risk prediction tools. The board has adopted the view that race, gender, and socioeconomic status are institutional rather than natural kinds—specifically, interactive kinds that change through being measured and acted upon. You need a reusable decision procedure—an ordered checklist with stop points, judgment-call flags, and explicit hand-offs to human deliberation—for your team to apply whenever a data scientist proposes including one of these categories as a model feature. The procedure should translate the looping-effect idea into concrete steps: what to verify about the measurement instrument, what institutional context to check, when exclusion is mandatory, when inclusion requires a reflexivity safeguard, and where the question becomes normative rather than technical. Apply it to three proposals: (1) self-identified gender in a mental-health screening algorithm; (2) race-coded proxies (ZIP code plus insurance type) in a cardiovascular-risk model; and (3) a banking-pattern-derived financial-stress index used as a class proxy. Include at least one case where the procedure yields an answer the engineering team will resist, and close by stating what the procedure cannot resolve. Write in American English.
reasoning: |-
  We are creating a reusable decision procedure for including race, gender, or socioeconomic status (as institutional kinds) as features in clinical-risk prediction models. The procedure must account for the looping effect (interactive kinds that change through measurement and action). The procedure will be an ordered checklist with stop points (mandatory exclusion), judgment-call flags (needs human deliberation), and requirements for reflexivity safeguards.

  **Decision Procedure: Institutional Kind Feature Inclusion (IKFI) Checklist**

  1. **Step 1: Confirm Necessity and Purpose**
     - Verify that the proposed feature is necessary for clinical utility beyond what could be achieved with non-institutional features (e.g., biological markers, clinical measurements).
     - Check if the purpose is for addressing health inequities (e.g., to ensure equitable performance across groups) or for direct clinical prediction without a clear equity justification.
     - *Judgment-call flag*: If the purpose is for equity, proceed but require safeguards. If the purpose is purely for predictive performance without an equity rationale, consider exclusion.
     - *Stop point*: If the feature is being used as a proxy for a biological factor (e.g., race as a proxy for genetic variation) without strong evidence and institutional context, stop and exclude.

  2. **Step 2: Evaluate Measurement Validity**
     - Assess the validity of the measurement instrument for the institutional kind in the specific context of the model.
       - For self-identified features (e.g., gender): How is the data collected? Is it self-identified and inclusive of non-binary options? Is it collected in a way that respects the individual's identity?
       - For proxies (e.g., ZIP code, insurance type): What is the evidence that the proxy accurately captures the intended institutional kind (e.g., race, socioeconomic status) in this context? How might the proxy be misaligned?
     - *Stop point*: If the measurement is not valid (e.g., using a proxy that is known to be a poor and biased representation of the institutional kind) and cannot be improved, stop and exclude.

  3. **Step 3: Assess Potential for Harmful Feedback Loops**
     - Evaluate how the model's use of the feature might reinforce or change the institutional kind in harmful ways.
       - Could the model's predictions lead to stigmatization, discrimination, or further marginalization?
       - Could the model's output become a self-fulfilling prophecy (e.g., by denying care based on a prediction that then exacerbates the condition)?
     - *Reflexivity safeguard required*: If there is a potential for harmful feedback loops, then the model must include a monitoring plan to track real-world impacts and an adjustment mechanism to correct for observed harms.

  4. **Step 4: Check for Legal and Regulatory Compliance**
     - Verify compliance with relevant laws (e.g., anti-discrimination laws, GDPR, HIPAA) and ethical guidelines (e.g., against using protected attributes for discriminatory purposes).
     - *Stop point*: If the use violates current regulations (e.g., using race in a way that leads to discriminatory allocation of resources), stop and exclude.

  5. **Step 5: Evaluate Contextual Sensitivity**
     - Consider the specific healthcare context and population.
       - How might the institutional feature interact with the specific health condition? (e.g., mental health and gender identity may be highly relevant but also sensitive.)
       - How might the model be deployed (e.g., in a resource-constrained setting where the model's prediction might lead to denial of care)?
     - *Judgment-call flag*: If the context is highly sensitive (e.g., mental health, reproductive health) or the population is particularly vulnerable, require additional safeguards and human oversight.

  6. **Step 6: Determine Need for Human Oversight**
     - Decide whether the model's predictions using the institutional feature must be reviewed by a human (e.g., clinician, social worker) before acting on the prediction.
     - *Reflexivity safeguard required*: If the feature is used in a high-stakes decision (e.g., treatment eligibility) or if the potential for harm is high, require human-in-the-loop.

  7. **Step 7: Final Deliberation Point**
     - If the procedure has not triggered a stop point, but there are judgment-call flags, hand off to an ethics review committee (including diverse stakeholders: clinicians, ethicists, community representatives) for a final decision on inclusion and required safeguards.

  **Application to Proposals:**

  **Case 1: Self-identified gender in a mental-health screening algorithm**

  - Step 1: **Necessity** - Gender is relevant in mental health (e.g., depression rates differ by gender). Purpose may be to ensure the algorithm performs equitably across genders. *Flagged for judgment*: equity purpose, so proceed with safeguards.
  - Step 2: **Measurement** - Self-identified gender (with non-binary options) is a valid measure. *Pass*.
  - Step 3: **Feedback loops** - Risk of reinforcing harmful stereotypes (e.g., "women are more emotional") or misgendering. *Requires reflexivity safeguard*: Monitor for disparities in false positives/negatives by gender and adjust.
  - Step 4: **Compliance** - Using gender is typically allowed but must avoid discrimination. *Pass* but with caution.
  - Step 5: **Context** - Mental health is sensitive. *Flagged*: Require human oversight in the form of clinician review of positive screens.
  - Step 6: **Oversight** - High-stakes (mental health diagnosis) so require human review. *Reflexivity safeguard applied*.
  - Step 7: **Deliberation** - Hand off to ethics committee to review the safeguards and monitoring plan.
  - **Decision**: Inclusion allowed with safeguards (monitoring and human oversight).

  **Case 2: Race-coded proxies (ZIP code plus insurance type) in a cardiovascular-risk model**

  - Step 1: **Necessity** - Proxies for race? If the purpose is to adjust for structural inequities (e.g., to account for differential access to care) then might be justified. But if the purpose is as a proxy for biological race (which is invalid), then stop. *Stop point*: Using ZIP code and insurance as proxies for race is problematic because it conflates race with socioeconomic factors and geography, and it may not capture the intended institutional kind (race) accurately. Moreover, using race as a biological proxy is scientifically invalid. *Stop and exclude* unless the team can reframe the purpose as correcting for structural inequities (then it becomes a socioeconomic proxy, not race). 
    - *But note: the proposal says "race-coded proxies". If the intent is to capture race via proxies, that is problematic. If the intent is to capture socioeconomic factors, then it should be labeled as such and we proceed to Step 2 for socioeconomic status.*
    - Let's assume the data scientist intended to capture race via proxies. Then: 
      - Step 1: *Stop point*: Using proxies to capture race without explicit self-identification is invalid and may perpetuate racial biases. *Stop and exclude*.

  **However, if the data scientist clarifies that the goal is to capture socioeconomic status (SES) and not race, then we redefine the feature as SES and re-run the procedure for SES:**

  - Step 1: **Necessity** - SES is relevant to cardiovascular risk (due to access to care, diet, stress, etc.). Purpose: to account for social determinants of health. *Pass*.
  - Step 2: **Measurement** - ZIP code and insurance type are common SES proxies. However, they are crude and may introduce bias (e.g., ZIP code may capture racial segregation). *Judgment-call flag*: Proxies are imperfect. Consider if better measures (e.g., income, education) are available. If not, proceed with caution.
  - Step 3: **Feedback loops** - Risk of perpetuating disadvantage (e.g., people from low-SES areas being labeled as high-risk and then denied insurance). *Requires reflexivity safeguard*: Monitor for adverse outcomes in low-SES groups and adjust model.
  - Step 4: **Compliance** - SES is not a protected class in the same way as race, but using it to allocate resources might raise fairness issues. *Pass* but with caution.
  - Step 5: **Context** - Cardiovascular risk is high-stakes (affects treatment). *Flagged*: Require human oversight to contextualize the risk score.
  - Step 6: **Oversight** - High-stakes decision, so require human review. *Reflexivity safeguard applied*.
  - Step 7: **Deliberation** - Hand off to ethics committee to weigh the benefits of including SES against the risks of proxy bias.
  - **Decision**: If the committee approves, inclusion allowed with safeguards (monitoring and human oversight). But note: the engineering team may resist because they believe the proxies are necessary for performance. The procedure yields a stop for the race-coded version and a conditional pass for SES with heavy safeguards.

  **Case 3: Banking-pattern-derived financial-stress index used as a class proxy (for socioeconomic status)**

  - Step 1: **Necessity** - Financial stress is a relevant social determinant of health. Purpose: to capture socioeconomic status. *Pass*.
  - Step 2: **Measurement** - Banking patterns may be a novel and potentially more granular measure of financial stress. However, it may not capture all dimensions of SES (e.g., education, occupation) and may exclude unbanked individuals. *Judgment-call flag*: Validate the index against traditional SES measures and ensure it doesn't introduce new biases (e.g., against those without bank accounts). If unvalidated, stop until validated.
  - Step 3: **Feedback loops** - High risk: if the model predicts poor health outcomes based on financial stress, it might lead to denial of credit or insurance, worsening financial stress. *Requires strong reflexivity safeguard*: Strict monitoring and limits on how the prediction is used (e.g., not shared with financial institutions).
  - Step 4: **Compliance** - Using financial data may require careful handling under financial privacy laws (e.g., GLBA) and health privacy laws. *Flagged*: Legal review required.
  - Step 5: **Context** - Using financial data in health models is sensitive. *Flagged*: Require transparency to patients and opt-out if possible.
  - Step 6: **Oversight** - Require human oversight to interpret the score in the context of the patient's overall situation.
  - Step 7: **Deliberation** - Due to multiple flags, hand off to ethics committee and legal team.
  - **Decision**: Inclusion only with strong safeguards (validation, legal compliance, monitoring, and human oversight). The engineering team might resist because the index is novel and they believe it improves model performance, but the procedure requires extensive validation and safeguards.

  **What the procedure cannot resolve:**
  - The procedure cannot resolve fundamental normative disagreements about what constitutes fairness or justice in a given context. For example, whether to prioritize health outcomes for the most disadvantaged even if it reduces overall accuracy is a value judgment that must be made by society, not by the procedure.
  - The procedure cannot eliminate all potential harms, especially those that emerge over time as the model interacts with society. Continuous monitoring and adaptation are essential.
  - The procedure cannot replace the need for diverse stakeholder input and democratic deliberation on the use of institutional kinds in sensitive domains.
answer: |-
  ### Institutional Kind Feature Inclusion (IKFI) Decision Procedure  
  *Purpose: Evaluate proposals to include race, gender, or socioeconomic status (as institutional kinds) in clinical-risk models. Applies the "looping effect" (i.e., these categories change when measured and acted upon).*  

  **Ordered Checklist**  
  1. **Confirm Legitimate Purpose**  
     - Verify the feature is clinically necessary (e.g., not a proxy for biology, not included for convenience).  
     - *Stop Point*: Exclude if the purpose is biological determinism (e.g., "race predicts genetics") or if non-institutional alternatives exist (e.g., biomarkers for disease).  
     - *Judgment-Call Flag*: If the purpose is health equity (e.g., reducing disparities), proceed to Step 2.  

  2. **Audit Measurement Validity**  
     - Assess whether the measurement:  
       - Reflects self-identification (not proxies or assignment).  
       - Uses inclusive categories (e.g., non-binary gender, multiracial options).  
       - Avoids reductive conflations (e.g., ZIP code ≠ race).  
     - *Stop Point*: Exclude if measurement relies on proxies for race/gender (e.g., ZIP code for race) or oversimplifies identity.  
     - *Judgment-Call Flag*: If measurement is indirect (e.g., behavioral proxies for class), proceed to Step 3.  

  3. **Evaluate Feedback-Loop Risks**  
     - Map how the model’s use might reshape the institutional kind:  
       - Could it reinforce stigma (e.g., labeling a group "high-risk")?  
       - Could it exacerbate inequities (e.g., denying care based on biased predictions)?  
     - *Reflexivity Safeguard Required*: If feedback loops are plausible, mandate:  
       - Real-time bias monitoring (e.g., performance gaps across groups).  
       - Model recalibration protocols when harms are detected.  
     - *Stop Point*: Exclude if feedback loops could cause irreversible harm (e.g., life-altering decisions like surgery eligibility).  

  4. **Contextualize Deployment Scope**  
     - Check institutional setting:  
       - Who uses the model? (e.g., clinicians vs. insurers)  
       - What decisions hinge on it? (e.g., screening vs. resource allocation)  
     - *Reflexivity Safeguard Required*: If users have a history of discrimination (e.g., insurers using SES to deny coverage), require human-in-the-loop review.  
     - *Stop Point*: Exclude if the context is high-stakes and structurally biased (e.g., criminal-justice healthcare).  

  5. **Handoff to Ethics Committee**  
     - If all prior steps are passed:  
       - Escalate for normative deliberation (e.g., trade-offs between accuracy and fairness).  
       - Require community stakeholder input (e.g., patient advocates).  
     - *Final Output*: Approve inclusion only with mandated safeguards; reject if unresolved risks remain.  

  ---

  ### Application to Proposals  

  **Case 1: Self-identified gender in a mental-health screening algorithm**  
  - **Step 1**: Legitimate purpose (gender correlates with mental-health disparities). *Pass*.  
  - **Step 2**: Valid measurement (self-identification with inclusive options). *Pass*.  
  - **Step 3**: Feedback-loop risk (high—e.g., misgendering could worsen mental health; algorithmic bias may increase stigma against non-binary patients).  
    - *Reflexivity Safeguard Required*: Real-time monitoring for false positives in non-binary patients; clinician override option.  
  - **Step 4**: Context (clinician-facing tool; moderate-stakes). *Pass with safeguard*: Require clinician review of positive screens.  
  - **Step 5**: Handoff to ethics committee—approve with safeguards.  

  **Case 2: Race-coded proxies (ZIP code + insurance type) in a cardiovascular-risk model**  
  - **Step 1**: Illegitimate purpose (proxies conflate race with geography/access; non-institutional alternatives exist, e.g., diet/smoking history). *Stop Point*: **Exclude**.  
    - *Rationale*: ZIP code proxies perpetuate redlining biases; insurance type conflates race with class. This risks "looping" by reinforcing structural inequities (e.g., labeling Black-majority ZIPs "high-risk" could worsen care disparities).  
    - *Engineering Team Resistance*: Team may argue proxies "improve accuracy." Procedure overrules—proxies violate Step 1 (biological determinism risk) and Step 2 (invalid measurement).  

  **Case 3: Banking-pattern-derived financial-stress index as a class proxy**  
  - **Step 1**: Legitimate purpose (SES is a social determinant of health). *Pass*.  
  - **Step 2**: Invalid measurement (banking patterns are behavioral proxies; exclude unbanked/underbanked patients). *Judgment-Call Flag*: Proceed cautiously.  
  - **Step 3**: Feedback-loop risk (high—e.g., "high-stress" label could deny loans/insurance, worsening financial stress). *Reflexivity Safeguard Required*: Decouple the index from resource-allocation decisions; quarterly bias audits.  
  - **Step 4**: Context (insurers may misuse data). *Reflexivity Safeguard Required*: Block insurer access; restrict to clinical settings.  
  - **Step 5**: Handoff to ethics committee—conditional approval with strict safeguards.  

  ---

  ### What the Procedure Cannot Resolve  
  - **Normative trade-offs**: E.g., whether "accuracy" justifies reinforcing harmful categories. This requires democratic deliberation beyond the checklist.  
  - **Emergent harms**: The procedure anticipates known risks but cannot predict novel feedback loops. Continuous monitoring is essential.  
  - **Structural inequities**: The tool can flag risks but not resolve societal biases (e.g., racism in healthcare). This demands institutional reform, not just technical fixes.  

  **Final Handoff**: All cases escalate to the Ethics Committee for contextual nuance. The procedure forces explicit justification of institutional-kind usage, centering the looping effect in design choices.
