answer: |-
  Here is a comprehensive set of desiderata for any adequate theory of moral motivation and personal ground projects, designed as an evaluative framework for your seminar:

  **I. Phenomena Requiring Explanation:**
  1.  **Deep Attachment Action:** How agents can act directly from deep attachments (e.g., saving a spouse) without conscious appeal to impartial moral principles.
  2.  **The Vitiation Effect:** Why inserting a deliberative step ("Is it *permissible* to save my wife?") can undermine the very motivational force and expressive value of the attachment-based action.
  3.  **Non-Partial Particularity:** How actions from ground projects differ fundamentally from mere self-interested preference, nepotism, or unjust partiality.
  4.  **Archival Integrity:** How an agent can be morally motivated to actively *preserve or transmit* a specific historical narrative, practice, or record (e.g., the historian safeguarding an archive's coherence), even when impartial rules might demand its revelation or alteration for justice, and how this sustains the agent's identity and a community's self-understanding.
  5.  **Moral Remainder:** The experience of genuine moral loss, regret, or "remainder" when a ground project (especially identity-constitutive ones) is sacrificed *for* a compelling moral reason.
  6.  **Phenomenology of Motivation:** The felt immediacy and non-deliberative character of action stemming from deep attachments and identity-constitutive projects.

  **II. Essential Distinctions to Preserve:**
  1.  **Integrity vs. Preference:** Possessing integrity (acting from constitutive commitments) vs. merely satisfying a strong preference or desire.
  2.  **Deliberative Suppression vs. Motivational Absence:** The *suppression* of deliberation (due to the nature of the commitment) vs. a *lack* of relevant motivation (e.g., indifference).
  3.  **Overrideable Projects vs. Identity-Constitutive Projects:** Projects that can be reasonably overridden by moral demands vs. projects whose abandonment constitutes a fundamental loss or destruction of the agent's practical identity (e.g., the historian *ceasing* to be the archive's custodian in the relevant sense).
  4.  **Ground Project Motivation vs. Moral Motivation:** The distinct motivational structure of ground projects (constitutive of self) vs. motivation stemming from recognition of abstract moral rules/duties.
  5.  **Particular Attachment vs. Universal Partiality:** The justification for acting on *this specific* deep attachment (e.g., *my* spouse, *this* archive) vs. a general permission for partiality towards a class (e.g., spouses, archives).

  **III. Puzzles to Dissolve:**
  1.  **The "One Thought Too Many":** Why adding an explicit moral justification ("It's permissible...") to an attachment-based action can seem inappropriate or corrupting, even if the justification is correct.
  2.  **The Paradox of Justification:** How an action can be morally justified *without* requiring (and potentially being undermined by) the agent consciously appealing to that justification at the moment of action.
  3.  **The Moral Remainder Puzzle:** Why sacrificing a ground project for a genuine moral reason doesn't simply resolve the dilemma cleanly but leaves a trace of loss, even when the sacrifice was obligatory.
  4.  **The Archival Coherence Puzzle:** How "preserving narrative continuity" (archival integrity) can generate distinct moral reasons that may conflict with impartial demands (like truth-telling or distributive justice), and how these reasons relate to the agent's identity and the community's epistemic agency.

  **IV. Empirical & Conceptual Constraints:**
  1.  **Compatibility with Moral Psychology:** Must cohere with findings on:
      *   The role of emotion and non-conscious processing in moral judgment/action.
      *   The psychology of identity and commitment.
      *   The phenomenology of skilled action and unreflective expertise (analogous to deep attachment action).
      *   The reality of genuine moral dilemmas and regret.
  2.  **Philosophy of Action:** Must account for:
      *   Actions performed as direct expressions of identity ("I do this *as* a husband/custodian").
      *   The difference between acting *on* a reason and acting *for* a reason consciously represented.
      *   The nature of "practical identity" as a source of reasons.

  **V. Flagged Tensions & Potential Joint Unsatisfiability:**
  1.  **Universalizability (U) vs. Particularity of Ground Projects (P):** Can moral reasons derived from universal principles adequately acknowledge the *normative force* of reasons arising from deeply particular, identity-constitutive attachments and projects (like archival integrity), without reducing them to mere subjective preferences? *(Strong Tension)*
  2.  **Justificatory Transparency (JT) vs. Motivational Opacity (MO):** Can the justification for actions from deep attachments (required for public morality) be rendered fully transparent without destroying the motivational structure and expressive meaning that often resides in its *lack* of conscious deliberation (the "opacity")? *(Significant Tension)*
  3.  **Ethical Motivation (EM) vs. Phenomenological Immediacy (PI):** Can an account of "moral worth" or "good motivation" accommodate actions that feel phenomenologically immediate and non-moral (e.g., saving a spouse instinctively) yet are normatively significant expressions of integrity? *(Moderate Tension)*
  4.  **Practical Identity Preservation (PIP) vs. Impartial Moral Demand (IMD):** How can a theory reconcile the potential moral *requirement* to sacrifice an identity-constitutive project (PIP) for an overriding impartial demand (IMD) with the recognition that this sacrifice constitutes a profound personal loss (Moral Remainder) and isn't simply a cost-benefit trade-off? *(Core Challenge)*

  **VI. Brief Assessment of Major Frameworks (Illustrative, not exhaustive):**
  *   **Utilitarianism:** Struggles profoundly with (P), (MO), (PI), (PIP vs IMD), and Moral Remainder. Reduces attachments to preference-satisfaction, struggles to explain vitiation (why deliberation *hurts*), fails to capture the distinct normativity of identity-constitutive projects like archival integrity (beyond aggregate welfare), and cannot easily accommodate genuine moral remainder (sacrifice is just optimal). Scores well only on (U) and potentially (JT) if deliberation is seen as optimizing.
  *   **Kantian Moral Worth:** Faces challenges with (P), (MO), (PI), and the Vitiation Effect. Acting *from* duty often requires conscious deliberation/judgment, clashing with the unreflective nature of deep attachment action. The "one thought too many" seems almost definitional. Struggles to recognize non-universalizable reasons from particular attachments/archival roles as genuinely *moral* motivations without collapsing them into inclination. Handles (U) and (JT) well, and Moral Remainder *might* be acknowledged as a failure of virtue but not as a constitutive loss.
  *   **Virtue Theory (Practical Wisdom):** Most promising on (P), (PI), and Moral Remainder. Can frame ground projects as expressions of character and commitments constitutive of a good life. Practical wisdom (*phronesis*) can integrate particular attachments and role-related duties (like archival custodianship) into an overall conception of flourishing, potentially explaining unreflective action as the mark of the virtuous agent. Can acknowledge moral tragedy/remainder. Challenges lie in clearly distinguishing (Integrity vs Preference), specifying how (U) is satisfied beyond contextual judgment, and fully addressing the Vitiation Effect (does the *phronimos* never deliberate about saving their spouse?). May struggle with the sharpness of (Overrideable vs Identity-Constitutive) and full (JT).

  This framework emphasizes the *specific conceptual work* required of a theory, using the core cases (spouse-saving, archival integrity) and key puzzles to drive evaluation. The identified tensions highlight the most fertile ground for seminar discussion, pushing beyond simple refutation/defense towards grappling with the deep structural challenges in reconciling moral objectivity with the phenomenology and normativity of personal commitment.
