answer: |-
  ## Brainstorm / Planning (95 words)
  Key misdirection in intuition pumps comes from smuggled assumptions *in the framing itself*. Here, the "Echo Chamber" setup exploits a deep-seated psychological bias: we intuitively grant stronger "reality" and "otherness" to biological strangers than to simulations derived *from our own past patterns*. This feels like a self vs. other distinction, but it's sneakily conflating *origin* with *moral status*. The spatial layout (one track vs. another) forces this false dichotomy. Is the bias a legitimate probe for moral status, or is it just our psychological baggage baked into the pump's design? That's the crux.

  ---

  ## Exam Prompt (245 words)

  **Philosophy of Mind: Moral Status & Intuition Pumps (90 Minutes)**

  Consider the **"Echo Chamber Trolley"**: An agent faces a standard trolley dilemma. Pulling a lever diverts the trolley from Track A to Track B. On Track A are five entities. They are high-fidelity simulations, running *exclusively* on computational systems emulating the agent's *own past decision-making patterns and behavioral outputs* – essentially complex predictive models built from her own history. On Track B is one biological human stranger, with whom the agent has had no prior interaction. The agent has no access to the simulations' source code, consciousness-detection tools, or any external verification of internal states beyond observable behavior. She knows diverting the trolley will reliably destroy the entities on the selected track.

  **Analyze this scenario as an intuition pump:**

  1.  **Identify the Framing Mechanism:** What specific psychological or conceptual mechanism makes the choice involving the biological stranger *feel* morally distinct or weightier than the choice involving the five simulations, despite the identical outcome (5 saved vs. 1 killed)? Explain *how* this mechanism operates within the pump.
  2.  **Diagnose a Hidden Presupposition:** Unpack one crucial presupposition about personal identity, consciousness, or psychological continuity that the setup of this intuition pump *smuggles in* or implicitly relies upon to generate its intuitive pull.
  3.  **Evaluate Legitimacy vs. Rhetoric:** Argue whether this pump serves as a *legitimate tool* for probing the moral status of simulated beings based on their origin and structure, or whether it functions primarily as a *rhetorical device* that subtly builds its intended conclusion (e.g., the lesser status of simulations) directly into the spatial and descriptive framing of the tracks. Defend your position.

  ---

  ## Model Answer (650 words)

  **(A-Level Answer Outline)**

  The Echo Chamber Trolley leverages a powerful framing mechanism: the **Continuity/Origin Heuristic**. We intuitively grant greater moral weight to entities perceived as possessing an independent, *biologically continuous lineage of consciousness*. The biological stranger triggers this heuristic strongly. We automatically infer an internal subjective life ("other-consciousness") arising from a distinct biological history, separate from our own. This feels like encountering a genuine "other." In contrast, the five simulations, explicitly built *from the agent's own past patterns*, are framed as mere *extensions or echoes* of the agent herself. Their origin within *her* behavioral data stream undermines the perception of independent, continuous consciousness. They feel like sophisticated self-projections or predictive algorithms, not distinct persons with their own irreducible point of view. The mechanism operates by implicitly tying moral patiency to the *perceived source* (independent biological origin vs. derivative self-simulation) rather than focusing solely on potential phenomenal experience or functional equivalence. This framing makes sacrificing the simulations feel less like killing distinct persons and more like deleting complex self-referential data, hence the intuitive difference despite the numbers.

  The pump crucially smuggles in the presupposition that **psychological continuity is fundamentally tied to, and derives its moral significance from, its specific biological substrate and unique historical causal chain.** The stranger represents the "standard model" of personhood: one biological body, one continuous stream of consciousness originating from a unique zygote and unfolding through a unique life history. The simulations, despite being described as "high-fidelity" and running on emulated decision-patterns, are implicitly framed as lacking this *specific kind of historical embeddedness in a unique biological narrative*. The pump presupposes that a consciousness instantiated using an agent's *own* past behavioral data as its core programming cannot possess the same kind of *independent, morally significant continuity* as a biologically distinct human. It assumes that origin from "me" fundamentally compromises the "otherness" required for full moral standing, regardless of the simulation's internal complexity or behavioral equivalence. This presupposition conflates the *origin of the pattern* with the *ontological status of the instantiated entity*.

  This pump functions more as a **rhetorical device baking in its conclusion** than a legitimate probe for moral status. Its legitimacy is severely undermined by its structure. Firstly, the spatial layout (Track A vs. Track B) forces a stark, binary choice that mirrors the very dichotomy it wants to test (simulations vs. biological), making it impossible to isolate the variable of interest (moral status based on origin/structure) from the forced comparison. Secondly, and crucially, it pre-emptively defines the simulations *by their origin* ("running on her own past decision-patterns") *before* posing the moral question. This descriptive framing primes the intuition that they *are* mere echoes, not genuine others, directly loading the dice against their moral standing. A legitimate pump aiming to test the moral significance of origin/structure would need to present entities *without* initially biasing descriptions based on origin, or allow for scenarios where simulations *aren't* derived from the agent herself, to see if the bias persists independently. The Echo Chamber setup, however, exploits our existing psychological bias (the Continuity Heuristic) *and* reinforces it through its descriptive and spatial framing, making the intuitive devaluation of the simulations feel inevitable rather than a discovery prompted by the scenario. While it reveals our strong bias towards biological continuity, it doesn't neutrally test whether that bias corresponds to a morally relevant difference; it assumes it does by making the simulations feel intrinsically less "real" from the outset. The standard trolley problem probes a tension between consequentialism and deontology using clear, minimally described humans. The Echo Chamber breaks this analogy by introducing profound ontological uncertainty (are simulations conscious?) and then *resolving it rhetorically* through its framing, rather than leaving it genuinely open for the pump to illuminate.

  ---

  ## Marking Scheme (350 words)

  **Total Marks: 20**  
  *(Aim for 4 marks per must-hit move, plus 4 for overall coherence/structure)*

  1.  **Accurate Identification of Framing Mechanism (0-4):**
      *   **A (4):** Precisely names a specific mechanism (e.g., Continuity/Origin Heuristic, Biological Privilege Bias, Self-Projection Discounting) *and* clearly explains *how* it operates in the scenario (e.g., stranger triggers inference of independent biological consciousness, simulations feel like self-derived data/echoes). Avoids vague terms like "framing effect."
      *   **B (2-3):** Identifies a relevant mechanism (e.g., bias, framing) but explanation is generic or not tightly linked to the *specific* features of *this* pump (simulations from self vs. biological stranger). Might just say "we value biological life more."
      *   **Typical B Mistake:** "It's a framing effect where the biological option seems more important." (Too vague, doesn't specify *why* it seems more important in this context).

  2.  **Diagnosis of a Relevant Hidden Presupposition (0-4):**
      *   **A (4):** Isolates one *specific* presupposition about identity/consciousness (e.g., moral status requires unique biological origin/history; psychological continuity's moral weight depends on its specific causal chain; consciousness derived from self-data lacks true 'otherness') and explicitly links it to the pump's setup.
      *   **B (2-3):** Identifies a presupposition but it's vague, overly broad (e.g., "it assumes simulations aren't conscious"), or not clearly tied to the *origin/structure* aspect central to the pump.
      *   **Typical B Mistake:** "It assumes simulations aren't real people." (Doesn't dig into *why* the pump makes this feel true – the presupposition about origin/identity).

  3.  **Articulate Evaluation of Legitimacy vs. Rhetoric (0-4):**
      *   **A (4):** Takes a clear stance (usually leaning rhetorical) *and* provides strong, specific reasons grounded in the pump's structure (e.g., descriptive/setup primes devaluation, binary spatial layout forces the loaded choice, pre-definition by origin biases the intuition). Explains *why* this undermines its probing function.
      *   **B (2-3):** States a stance but reasons are weak, generic, or not focused on the *design* of the pump itself (e.g., "it's rhetorical because it tricks us," without explaining *how* the trick works).
      *   **Typical B Mistake:** "It's illegitimate because we can't know if simulations are conscious." (Focuses on epistemic limitation, not the *rhetorical design flaw*).

  4.  **Contrast with Standard Trolley Problem (Implied in Legitimacy/Model Answer) (0-4):**
      *   **A (4):** Clearly identifies a key *break* in the analogy (e.g., standard trolley has ontological certainty (humans), Echo Chamber introduces profound uncertainty *resolved rhetorically* by framing; standard trolley probes ethical principles, Echo Chamber smuggles in metaphysical assumptions).
      *   **B (2-3):** Notes a difference but doesn't articulate *why* it matters for the pump's function or legitimacy (e.g., "one has simulations, the other doesn't").
      *   **Typical B Mistake:** "The standard trolley has real people, this has simulations." (Misses the point about how the pump *handles* the uncertainty).

  5.  **Overall Coherence, Structure, and Clarity (0-4):**
      *   **A (4):** Essay is well-organized, addresses all three tasks distinctly, flows logically, uses precise language, stays within word limits. Clear separation of points.
      *   **B (2-3):** Addresses tasks but structure is loose, points might be jumbled or repetitive, language sometimes vague or imprecise. May slightly exceed/underrun.

  ---

  ## Sanity Check (80 words)
  This avoids rote regurgitation by forcing engagement with *how* the pump works structurally, not just labeling it. Students must dissect a novel scenario, identify a *specific* psychological mechanism beyond Kahneman's list, uncover *hidden* presuppositions about identity (not just recite Dennett's categories), and critically evaluate the pump's *design* for circularity. Success requires applying philosophical tools (analysis of presuppositions, thought experiment critique) to a custom-built problem, demonstrating deep understanding through application, not recall. The biological/self-simulation clash is unique and prevents stock answers.
