  The user wants a principle that preserves most of their judgments and resolves the reformer case and a biography with no inner life. They need a clear bottom line first, then reasoning. 

  Hmm, their examples show that moral learning happens when the biography engages critical judgment, not just emotion. Plutarch forces comparison; the candid civil rights bio avoids idealization. But the dictator bio triggers excessive empathy, and hagiography lacks depth. The conflict between growth and static virtue narratives might be false—both can work if they show the cost and context of virtue. 

  The reformer case is ambiguous because the moral value depends on the cause and costs. A biography without inner life fails because actions alone don't reveal moral reasoning. Enemy-written bios provide structure but poison evaluation. 

  So the core principle is critical engagement: the bio must present virtues/vices in context, with trade-offs, enabling the reader to weigh choices. This saves Plutarch, the civil rights bio, and resolves the growth/static tension. The dictator bio fails by obscuring moral responsibility; the reformer's ambiguity is inherent and requires reader judgment. Bios without inner life or with poisoned evaluation prevent this engagement. 

  The user's "evaluative distance" is close but needs emphasis on contextualized struggle. Their verdicts mostly hold except maybe downplaying how static virtue can imply unseen effort. For the reformer, the bio should present the sacrifices starkly, leaving the reader to decide. No inner life? No learning. Enemy bio? Actively harmful. 

  This addresses their conflicts and provides a framework. They're thoughtful about ethics and narrative—probably a philosophically inclined reader. Their frustration with ambiguity is real, but the principle makes it a feature, not a bug.
answer: |-
  **Bottom line: Moral learning from biography depends on the text enabling *critical engagement* with the *contextualized human struggle* inherent in moral choices, demanding the reader actively judge trade-offs and consequences rather than passively absorb ideals or justifications.**

  **Reasoning:**

  1.  **Critical Engagement Saves Your Core Verdicts:**
      *   **Plutarch vs. Hagiography:** Plutarch's parallel structure *forces* comparison ("practical reasoning on a grid"), demanding critical judgment. The hagiography invites passive admiration ("warm feeling") without demanding evaluation of choices or their costs.
      *   **Warts-and-All vs. Polished Monument:** Transparency about flaws and struggles (grudges, broken friendships) forces the reader to grapple with how courage operates *within* a messy, relatable human context, making it seem achievable ("copyable") through critical understanding. The polished monument discourages this engagement.
      *   **Growth vs. Static Virtue:** The apparent conflict dissolves. A compelling growth narrative engages critically by showing the *struggle and cost* of becoming good. A compelling static virtue narrative must engage critically by implicitly or explicitly showing the *sustained effort, context, and potential trade-offs* required to *maintain* that virtue from youth (proving it's not effortless grace, but rooted in choices). Both require the reader to judge the *process* or *sustenance* of virtue, not just its presence.
      *   **Reformer Case (Heroic Focus vs. Monomania):** The ambiguity *is* inherent and the point. Critical engagement means weighing the *costs* (sacrificed bonds) against the *value* of the cause and its *outcomes*. A good biography presents this tension starkly, forcing the reader to judge the trade-offs without providing a definitive answer. Your struggle *is* the learning – evaluating the price of extreme focus.
      *   **Biography Listing Only Actions:** This fails critical engagement. Without access to inner life, context, motives, or struggles, the reader cannot understand the *reasons* for choices or their *human meaning*, preventing meaningful moral evaluation beyond superficial judgment. Actions devoid of context are morally opaque.

  2.  **Contextualized Human Struggle Explains Negative Cases and Refines "Distance":**
      *   **Dictator Biography:** Explaining atrocities solely through trauma/context *removes the subject's agency and struggle*, framing choices as inevitable outcomes. This undermines critical engagement with the *moral decisions* made by the individual within their context. Understanding becomes excusing because the active, culpable human struggle is erased, replaced by deterministic narrative. This lacks the necessary contextualization of *choice* within constraints.
      *   **Enemy-Written Biography:** This fails precisely *because* it poisons the well of contextualized struggle. By cynically explaining every good act and structuring only to condemn, it prevents authentic critical engagement with the subject's actual choices, motives, and the *human reality* of their situation. The "structure" is weaponized to preclude genuine judgment, not enable it. It denies the reader the honest material needed for critical evaluation.
      *   **Refining "Evaluative Distance":** Your instinct is correct but needs sharpening. It's not just forced comparison ("distance"), but critical engagement with the subject portrayed as a *choosing agent within specific constraints and contexts*, facing trade-offs and consequences. The reader must grapple with the "why" and "how" of choices in that context, not just compare outcomes coldly or just identify/admire/condemn simplistically. Plutarch forces this; the enemy bio precludes it.

  3.  **Call on Cases:**
      *   **The Reformer:** A biography enabling critical engagement presents the immense value of the cause, the profound human costs of the sacrifices, and the subject's perspective/reasoning *without* resolving the tension. The reader must actively weigh the trade-offs. The ambiguity is the life *as presented*; your struggle *is* the moral learning.
      *   **Actions-Only Biography:** Fails. Lacks the context, motive, and struggle necessary for critical engagement and meaningful moral evaluation. Offers data, not insight into human moral choice.
      *   **Enemy-Written Biography:** Actively prevents critical engagement by distorting context and denying authentic struggle/agency. Likely causes negative learning (reinforcing prejudice) or confusion, not genuine moral insight.

  **Conclusion:** Most of your verdicts hold. The key principle is **critical engagement with contextualized human struggle**. This requires the biography to present the subject as a complex moral agent making choices (virtuous or vicious) within specific constraints, revealing motives, reasoning, costs, and consequences honestly enough for the reader to actively judge the trade-offs and the nature of the agency involved. Plutarch, the warts-and-all civil rights bio, and well-told growth/static virtue narratives do this. Hagiography, the dictator apologia, the actions-only list, and the enemy bio fail it in different ways. The reformer case succeeds *because* it forces this difficult, unresolved engagement.
