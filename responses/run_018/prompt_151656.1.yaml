  First, I need to address their core question: Western laws do recognize such implicit exchanges as corruption. The bottom line is that anti-corruption frameworks do cover implicit obligations. Key laws like the U.S. Federal Bribery Statute or the UK Bribery Act focus on the intent behind the exchange, not just explicit agreements. Courts look at circumstantial evidence—timing, relationship, value of the gift—to infer quid pro quo. So even without a written contract, the car gift right after zoning approval would be seen as bribery.

