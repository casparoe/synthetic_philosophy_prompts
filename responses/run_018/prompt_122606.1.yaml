  Hmm, the user's scenario with N. is clever. It directly challenges the assertoric norm by showing a case where the assertion is true yet still absurd. The norm account typically says the absurdity arises from asserting something you don't believe, but here N. isn't believing, so her assertion violates the norm, yet the user points out that lies also violate the norm without being absurd in the same way. The user also extends the problem to diary entries and suppositions, where no assertion is made, yet the absurdity remains. That's a strong point against the speech-act focus.

