prompt: |-
  I serve as the administrative secretary for a mid-sized annual fiction prize, and each year I must audit the confidential rationales that five volunteer jurors submit when ranking novels. The board has become concerned that jurors sometimes defend rankings with reasons that are, in the philosophical sense, the wrong kind: reasons that may be genuinely explanatory but should not govern an aesthetic verdict. I need a reusable decision procedure I can run on every juror’s written justification—without requiring jurors to learn philosophy, and within the two-hour window I have between receiving the rationales and delivering my report to the board. The procedure should be grounded in what the wrong-kind-reasons literature actually distinguishes—especially the difference between reasons that are responsive to the value in question and reasons that merely cause or substitute for that response—while translating that distinction into steps a non-specialist secretary can apply repeatedly.

  Please construct the procedure as an ordered checklist with explicit stopping conditions: for each step, state the question to ask of the rationale, what counts as a sufficient answer that lets the audit pass, and what answer triggers a flag or hands the decision to me as an irreducible judgment call. Include a small set of test sentences or patterns I can match against a juror’s text, and a worked example of each kind—one where the procedure correctly flags a wrong-kind reason, one where it clears a reason that initially looks suspicious, and one where the procedure returns an unwanted result (a rationale it flags that I, on reflection, think should have been permitted). Be explicit about where the procedure will misfire—cases in which a reason is genuinely of the wrong kind but will slip through, or cases in which a legitimate reason will be falsely flagged. Also state what the procedure cannot do: which disagreements about literary value it cannot settle, and where I must simply report that the board needs to decide.

  To keep the audit focused, inject and defend a three-part taxonomy of wrong-kind reasons specific to literary judgment—biographical-projection reasons, market-proxy reasons, and moral-political substitution reasons—explaining briefly why each is wrong-kind in aesthetics rather than in morality, and showing how the taxonomy improves on treating “wrong kind” as a single undifferentiated category. Apply the full procedure to three concrete juror rationales: (1) a juror ranks a traumatic autofictional novel highly because “it finally lets people like me see our suffering represented,” (2) a juror dismisses an experimental novel because “no one will buy this, and the prize should stay relevant,” and (3) a juror praises a historical epic solely for “restoring dignity to a marginalized group,” with no mention of narrative craft, language, or form. For the third case, show both the flag the procedure raises and the judgment call it forces on me. Finally, specify the practical constraints—time per rationale (approximately twenty minutes), the level of philosophical literacy I can assume of the jurors (none), and who must sign off on my report (the board chair, who has no philosophy background)—and adjust the procedure’s rigor accordingly.
reasoning: |-
  We are constructing a reusable decision procedure for auditing juror rationales in the context of a fiction prize. The goal is to identify "wrong-kind reasons" (WKR) in aesthetics, which are reasons that may explain the juror's response but are not properly responsive to the literary (aesthetic) value of the work.

  We propose a three-part taxonomy of WKR for literary judgment:
  1. **Biographical-Projection Reasons**: These occur when a juror's response is primarily driven by personal identification with the subject matter (e.g., because the story reflects their own life experiences) rather than an assessment of the work's artistic merits. This is WKR because the reason is about the juror's personal connection, not about the inherent aesthetic qualities of the work.
  2. **Market-Proxy Reasons**: These are reasons that appeal to the market success or popularity of the work (e.g., sales, anticipated readership) as a basis for its literary value. This is WKR because literary value should not be conflated with commercial success or broad appeal.
  3. **Moral-Political Substitution Reasons**: These are reasons that focus solely on the moral or political message of the work without engaging with its artistic execution (e.g., praising a novel for its political stance without considering how that stance is conveyed through narrative, language, form, etc.). This is WKR because while literature can have moral and political dimensions, the aesthetic evaluation must consider how these are integrated and realized artistically.

  This taxonomy improves on a single category by allowing more precise identification and education. Each type represents a distinct way in which non-aesthetic considerations can improperly dominate the evaluation.

  **Procedure Design**:
  We need a checklist that a non-specialist can apply in about 20 minutes per rationale. The procedure should have explicit steps with stopping conditions. We'll use pattern matching for efficiency.

  **Checklist for Auditing a Juror's Rationale**:

  **Step 1: Identify the Stated Reason**
  - **Question**: What explicit reason does the juror give for their ranking? Extract the key phrases that explain why the novel was ranked as it was.
  - **Sufficient to Pass**: The reason clearly relates to an aspect of the novel's craft (e.g., plot, character development, prose style, narrative structure, thematic depth as realized artistically).
  - **Flag Condition**: The reason is entirely absent or so vague that it cannot be assessed (e.g., "I just loved it"). In this case, stop and flag for "Insufficient Explanation".
  - **Patterns to Match** (for extraction):
    - Positive: "strong character development", "innovative narrative structure", "evocative prose", "compelling plot", "masterful use of symbolism"
    - Negative: "poorly developed characters", "confusing plot", "awkward sentences", "derivative style"

  **Step 2: Check for Biographical-Projection Reasons**
  - **Question**: Does the rationale include phrases that indicate the juror's personal identification with the subject matter as a primary reason for the ranking?
  - **Sufficient to Pass**: The rationale does not contain such phrases, or if it does, they are accompanied by discussion of how the personal connection relates to the work's artistic success (e.g., "The author's portrayal of trauma resonated with me because of how vividly it was depicted through the protagonist's internal monologue").
  - **Flag Condition**: The rationale relies on personal identification without linking it to the work's artistic qualities (e.g., "This book speaks to me because I went through the same thing"). Flag as "Biographical-Projection WKR".
  - **Patterns to Match** (for flagging):
    - "as someone who [personal experience]", "I felt seen", "finally, a book about people like me", "my own experience was reflected"
  - **Stopping Condition**: If flagged, the audit fails for this rationale, and the reason is recorded. Proceed to Step 3 only if not flagged.

  **Step 3: Check for Market-Proxy Reasons**
  - **Question**: Does the rationale include phrases that appeal to the book's market success, popularity, or relevance to the market?
  - **Sufficient to Pass**: The rationale does not contain such phrases, or if it does, they are not the primary reason and are accompanied by artistic considerations (e.g., "The novel's commercial success is a testament to its gripping plot and relatable characters").
  - **Flag Condition**: The rationale uses market success or relevance as a primary justification without connecting to artistic merit (e.g., "This will sell well, so it deserves the prize"). Flag as "Market-Proxy WKR".
  - **Patterns to Match**:
    - "bestseller", "commercially successful", "will sell", "popular", "relevant to today's market", "broad appeal", "readers will love it", "no one will buy this"
  - **Stopping Condition**: If flagged, the audit fails. Otherwise, proceed.

  **Step 4: Check for Moral-Political Substitution Reasons**
  - **Question**: Does the rationale focus on the moral or political message of the work without discussing how that message is artistically conveyed?
  - **Sufficient to Pass**: The rationale either avoids moral-political language or discusses the moral-political dimension in terms of its artistic integration (e.g., "The novel's critique of colonialism is powerfully conveyed through its multi-perspective narrative and rich symbolism").
  - **Flag Condition**: The rationale exclusively or primarily praises (or condemns) the work for its moral or political stance without reference to craft (e.g., "This book is important because it supports [cause]"). Flag as "Moral-Political Substitution WKR".
  - **Patterns to Match**:
    - "important message", "raises awareness about", "gives voice to", "restores dignity to", "necessary for our times", without accompanying craft terms.
  - **Stopping Condition**: If flagged, the audit fails. Otherwise, the rationale passes.

  **Step 5: Final Check for Artistic Grounding**
  - **Question**: After Steps 2-4, does the rationale still contain at least one clear reference to an aspect of the novel's craft (as defined in Step 1)?
  - **Sufficient to Pass**: Yes, there is at least one reference to an element of craft (even if the rationale also includes non-WKR personal, market, or moral-political comments that were deemed acceptable in Steps 2-4).
  - **Flag Condition**: No reference to craft can be found. Flag as "Lack of Artistic Grounding". This step ensures that even if no WKR were found, the rationale must still engage with the work as art.

  **Summary of Outcomes**:
  - If any step flags, the rationale fails the audit and the reason for the flag is recorded.
  - If the rationale passes all steps, it is cleared.

  **Limitations and Misfires**:
  1. **False Negatives (WKR that slip through)**:
     - A juror might use sophisticated language to disguise a WKR (e.g., "The novel's structure brilliantly mirrors the fragmented identity of the marginalized group" might pass even if the juror is primarily motivated by the political message, because it mentions structure). The procedure relies on explicit language and may not capture hidden motivations.
     - Some WKR might be borderline and not match the patterns (e.g., a market reason phrased as "this book has the potential to become a classic" might not be flagged because it doesn't use the banned words).

  2. **False Positives (Legitimate reasons that are flagged)**:
     - A juror might discuss a personal connection but then link it to craft in a way that is subtle and missed by the pattern (e.g., "As a survivor, I found the portrayal authentic, which made the character's journey more compelling" might be flagged in Step 2 if the phrase "more compelling" is not recognized as relating to craft, but actually it does). This is why Step 5 is important as a final check.

  3. **What the procedure cannot do**:
     - It cannot resolve disagreements about what constitutes good craft. For example, one juror might value experimental prose while another finds it off-putting. The procedure only checks for the presence of craft-related reasons, not their validity.
     - It cannot detect when a juror is insincere or when a craft reason is offered as a cover for a WKR.
     - It cannot replace the board's judgment on borderline cases. When the procedure flags, it will sometimes require the secretary's judgment (as in the case of Step 2, Step 3, or Step 4) to determine if the flagged reason is indeed the primary one or if there is sufficient artistic grounding.

  **Worked Examples**:

  1. **Example that should be flagged as WKR**:
     - Rationale: "I ranked this novel highly because it finally lets people like me see our suffering represented."
     - Step 1: Extracts the reason: "lets people like me see our suffering represented" -> not craft.
     - Step 2: Matches pattern for Biographical-Projection (e.g., "people like me"). Flagged as Biographical-Projection WKR. Audit fails.

  2. **Example that initially looks suspicious but should be cleared**:
     - Rationale: "I connected deeply with the protagonist's trauma because the author's use of fragmented narrative mirrored my own disjointed memories, creating a powerful emotional resonance that is achieved through skillful storytelling."
     - Step 1: Extracts reasons: "use of fragmented narrative", "skillful storytelling" -> craft present.
     - Step 2: Contains "I connected deeply" and "my own disjointed memories", but also ties it to craft (fragmented narrative and skillful storytelling). So passes Step 2.
     - Step 3: No market terms.
     - Step 4: No moral-political focus without craft.
     - Step 5: Craft terms present. Passes.

  3. **Example of a misfire (false positive)**:
     - Rationale: "This novel restores dignity to a marginalized group by telling their story truthfully."
     - Step 1: The reason is about restoring dignity and truthfully telling a story. Not explicitly craft.
     - Step 2: No personal identification (so passes Step 2).
     - Step 3: No market (passes).
     - Step 4: "restores dignity to a marginalized group" -> matches Moral-Political Substitution pattern. Flagged.
     - However, note that the phrase "telling their story truthfully" might be interpreted as a craft element (truthful storytelling). But the procedure, as designed, would flag because there is no explicit craft term. This is a judgment call: the secretary must decide if "truthfully" is being used as an artistic criterion (e.g., as in narrative authenticity, which is a craft element) or purely as a moral one. Without more context, the flag is raised and then the secretary must decide.

  **Application to the Three Concrete Juror Rationales**:

  1. **Case 1**: Juror ranks a traumatic autofictional novel highly because “it finally lets people like me see our suffering represented.”
     - Step 1: The reason is about representation of suffering for people like the juror. No craft mentioned. (Flag Condition in Step 1? Actually, Step 1 says if the reason is entirely absent or vague, flag for "Insufficient Explanation". Here the reason is present but not craft. We proceed to Step 2.)
     - Step 2: The phrase "people like me" and "our suffering" matches Biographical-Projection pattern. Flagged as Biographical-Projection WKR. Audit fails.

  2. **Case 2**: Juror dismisses an experimental novel because “no one will buy this, and the prize should stay relevant.”
     - Step 1: The reason is about market (no one will buy) and relevance (which is likely market relevance). No craft mentioned. (But Step 1 doesn't require craft to pass, it just extracts. We proceed.)
     - Step 2: No personal identification. Pass.
     - Step 3: "no one will buy this" and "stay relevant" (if relevance is market relevance) matches Market-Proxy pattern. Flagged as Market-Proxy WKR. Audit fails.

  3. **Case 3**: Juror praises a historical epic solely for “restoring dignity to a marginalized group,” with no mention of narrative craft, language, or form.
     - Step 1: The reason is about restoring dignity to a group. No craft mentioned.
     - Step 2: No personal identification (unless implied, but not stated). Pass.
     - Step 3: No market. Pass.
     - Step 4: The phrase "restoring dignity to a marginalized group" matches Moral-Political Substitution pattern. Flagged as Moral-Political Substitution WKR.
     - Step 5: Since Step 4 flagged, we don't reach Step 5? Actually, the procedure stops at the first flag. But note: the procedure has already flagged at Step 4. However, the secretary must note that there is no craft mentioned at all, which would also be caught in Step 5 if we had continued. But the flag at Step 4 is sufficient to fail the audit.

     However, the problem asks: "show both the flag the procedure raises and the judgment call it forces on me." In this case, the procedure flags at Step 4. But the secretary might reflect: is there any chance that "restoring dignity" is being used in a way that implies an artistic achievement? For example, if the juror had said "restoring dignity through a compelling narrative", that would be different. But the rationale says "solely" and provides no craft terms. So the flag is correct. The judgment call is not needed because the pattern is clear.

     However, consider a variant: what if the rationale said "restoring dignity by giving them a powerful voice in the narrative"? The word "powerful" might be ambiguous. The procedure would still flag at Step 4 because it matches the pattern and there is no clear craft term (like "well-written", "skillfully narrated"). But the secretary might judge that "powerful voice" is an artistic quality. This is a judgment call. In the given case, though, it's clear: no craft terms.

  **Practical Constraints**:
  - Time per rationale: ~20 minutes. The procedure is designed to be efficient with pattern matching and a step-by-step approach.
  - Philosophical literacy of jurors: None. The procedure does not require jurors to know philosophy; it only requires the secretary to apply the checklist.
  - Report sign-off: The board chair (no philosophy background). Therefore, the report should clearly state the type of WKR found (using the taxonomy) without philosophical jargon.

  **Adjusting Rigor**:
  Given the time and audience, the procedure uses simple pattern matching and clear flags. It does not require deep textual analysis. The secretary is expected to use common sense in applying the patterns and to make judgment calls when the rationale is ambiguous (especially in Step 4 and Step 5). The procedure errs on the side of flagging when in doubt, but the secretary can override if they determine that the flagged reason is not the primary one or if there is a craft element that the pattern matching missed.

  **Final Procedure Checklist (for the secretary)**:

  For each juror's rationale:
  1. **Extract the reason**: Look for the key phrases that explain the ranking. If none or too vague, flag as "Insufficient Explanation" and stop. Otherwise, proceed.
  2. **Check for Biographical-Projection**: Scan for phrases indicating personal identification without artistic grounding. If found and not accompanied by craft discussion, flag as "Biographical-Projection WKR" and stop. Otherwise, proceed.
  3. **Check for Market-Proxy**: Scan for phrases about market success or relevance. If found and not accompanied by craft, flag as "Market-Proxy WKR" and stop. Otherwise, proceed.
  4. **Check for Moral-Political Substitution**: Scan for phrases about moral or political importance without craft. If found, flag as "Moral-Political Substitution WKR" and stop. Otherwise, proceed.
  5. **Final Craft Check**: Ensure there is at least one reference to an artistic element (from Step 1 or in the full text). If not, flag as "Lack of Artistic Grounding" and stop. If present, the rationale passes.

  **Note**: The procedure stops at the first flag. The secretary must record the flag reason.

  In the case of a flag, the secretary may, if time permits and the flag is ambiguous, re-read the rationale to see if the flagged reason is the primary one and if there is any craft element that was missed. But in the interest of time, the initial flag stands unless the secretary's quick judgment overturns it.

  **Report to the Board**:
  For each juror, the secretary will report:
  - Pass: No WKR found and rationale grounded in craft.
  - Fail: [Type of WKR found] or "Insufficient Explanation" or "Lack of Artistic Grounding".

  The board can then decide how to handle failed rationales (e.g., ask for clarification, discount the juror's vote, etc.), but that is beyond the audit procedure.
answer: |-
  ### Reusable Audit Procedure for Juror Rationales: Wrong-Kind Reasons in Literary Judgment

  **Grounding in Philosophy**: The "wrong-kind-reasons" (WKR) distinction in aesthetics centers on *responsiveness to intrinsic literary value* (e.g., craft, form, emotional resonance achieved artistically) versus *extrinsic factors* that merely cause a response (e.g., personal identification, market trends, or moral/political utility). A valid reason must engage with *how* the work achieves its effects through literary artistry, not just *that* it elicits a reaction.

  **Taxonomy of Wrong-Kind Reasons**:  
  To focus the audit, I use a three-part taxonomy. Each category isolates a common WKR in literary evaluation, ensuring precision over a vague "not aesthetic" label:  

  1. **Biographical-Projection Reasons**:  
     - **Definition**: Justifications based on the juror’s personal identity or experiences (e.g., "This reflects my life").  
     - **Why Wrong-Kind**: They substitute the juror’s *self-recognition* for artistic merit. Aesthetic value resides in the work’s crafted universality, not private resonance.  
     - **Improves on Undifferentiated WKR**: Separates identity-based appeals from moral/political ones, as personal projection often masquerades as authenticity.  

  2. **Market-Proxy Reasons**:  
     - **Definition**: Appeals to commercial viability, popularity, or relevance (e.g., "This will sell well").  
     - **Why Wrong-Kind**: They conflate *economic success* or *accessibility* with artistic achievement. Literary value is intrinsic, not dictated by market forces.  
     - **Improves on Undifferentiated WKR**: Distinguishes market pragmatism from artistic evaluation, which is often overlooked in "impact"-focused debates.  

  3. **Moral-Political Substitution Reasons**:  
     - **Definition**: Praising/criticizing *only* the moral/political stance (e.g., "This supports a good cause") without linking it to literary execution.  
     - **Why Wrong-Kind**: They reduce art to *instrumental messaging*. Aesthetic value requires showing *how* the message is realized through craft (e.g., language, structure).  
     - **Improves on Undifferentiated WKR**: Prevents moral urgency from overshadowing artistic rigor, which a single WKR category might miss.  

  ---

  ### **Audit Checklist Procedure**  
  *Time per rationale: ≤20 minutes. Tools: Text search for keywords/phrases (test patterns below).*  
  *Stopping Conditions*: Stop at first flag. If no flags, rationale passes.  

  #### **Step 1: Extract Core Justification**  
  - **Question**: What is the primary reason given for the ranking?  
  - **Pass Condition**: Reason explicitly references at least one **literary craft element** (see *Craft Glossary*).  
  - **Flag Condition**: No craft element mentioned.  
    - **Action**: Flag as **"Missing Craft Basis"**. End audit.  
  - **Craft Glossary (Non-Philosophical Terms)**: Plot, character development, prose style, narrative structure, pacing, imagery, dialogue, thematic depth (via artistic means), symbolism, originality of form, emotional resonance (tied to craft).  
  - **Test Patterns**:  
    - Pass: "vivid imagery," "tight pacing," "complex protagonist," "innovative structure."  
    - Flag: "It moved me," "Important for our times," "I related to it" (no craft link).  

  #### **Step 2: Check for Biographical-Projection Reasons**  
  - **Question**: Does the rationale prioritize the juror’s personal identity/experience as justification?  
  - **Pass Condition**: Personal connection is *subordinate* to craft (e.g., "As an immigrant, I appreciated how the prose captured displacement").  
  - **Flag Condition**: Personal connection is *primary* or *standalone* (e.g., "It speaks to people like me").  
    - **Action**: Flag as **"Biographical-Projection WKR"**. End audit.  
  - **Test Patterns** (Match → Flag):  
    - "As a [identity], I…," "people like me," "my experience," "finally represents us."  
  - **Worked Examples**:  
    - Flag Correctly: "Ranked highly because it finally lets people like me see our suffering represented."  
      - *Why*: "People like me" dominates; no craft.  
    - Clear Correctly: "As a survivor, I valued how the sparse prose amplified the trauma."  
      - *Why*: "Sparse prose" (craft) is focal; personal link is contextual.  

  #### **Step 3: Check for Market-Proxy Reasons**  
  - **Question**: Does the rationale use market success/relevance as justification?  
  - **Pass Condition**: Market factors are absent or peripheral (e.g., "Its popularity stems from its gripping plot").  
  - **Flag Condition**: Market factors are *determinative* (e.g., "No one will buy this, so it shouldn’t win").  
    - **Action**: Flag as **"Market-Proxy WKR"**. End audit.  
  - **Test Patterns** (Match → Flag):  
    - "Will sell," "bestseller," "commercially viable," "stay relevant," "broad appeal," "no one will read/buy."  
  - **Worked Examples**:  
    - Flag Correctly: "Dismissed because no one will buy this, and the prize should stay relevant."  
      - *Why*: "No one will buy" and "stay relevant" are market-driven.  
    - Clear Correctly: "Its experimental style may limit readers, but the fragmented narrative is brilliant."  
      - *Why*: Market note is acknowledged but subordinated to "fragmented narrative" (craft).  

  #### **Step 4: Check for Moral-Political Substitution Reasons**  
  - **Question**: Does the rationale reduce the work to its moral/political message?  
  - **Pass Condition**: Moral/political themes are tied to craft (e.g., "Its critique of injustice is elevated by nuanced characters").  
  - **Flag Condition**: Moral/political message is *standalone* (e.g., "It restores dignity to a marginalized group" with no craft).  
    - **Action**: Flag as **"Moral-Political Substitution WKR"**. End audit.  
  - **Test Patterns** (Match → Flag):  
    - "Gives voice to," "raises awareness," "important message," "restores dignity," "necessary for [cause]."  
  - **Worked Examples**:  
    - Flag Correctly: "Praised solely for restoring dignity to a marginalized group."  
      - *Why*: "Restores dignity" is moral; no craft.  
    - Clear Correctly: "Its portrayal of resilience gives dignity to marginalized groups through lyrical prose."  
      - *Why*: "Lyrical prose" (craft) links to moral effect.  

  #### **Step 5: Final Craft Integration Check**  
  - **Question**: Are all non-craft elements (if present) clearly linked to artistic execution?  
  - **Pass Condition**: All key justifications reference craft *directly*.  
  - **Flag Condition**: Non-craft elements (e.g., emotional impact) are mentioned without *how* they are achieved artistically.  
    - **Action**: Flag as **"Unanchored Justification"**. End audit.  
  - **Test Patterns**:  
    - Pass: "Heartbreaking because of its restrained dialogue."  
    - Flag: "Heartbreaking and important" (no "how").  

  ---

  ### **Limitations and Misfires**  
  1. **False Negatives (WKR That Slip Through)**:  
     - **Biographical**: "This novel is vital for my community" (implies identity but avoids keywords).  
     - **Market**: "This deserves attention" (vague market concern; pattern may miss it).  
     - **Moral-Political**: "A triumph for representation" (disguised as craft if "representation" is misread).  
     - *Why*: Reliance on explicit patterns misses subtle or euphemistic WKR.  

  2. **False Positives (Legitimate Reasons Flagged)**:  
     - **Craft misclassified**: "Original voice" flagged as identity-based if "voice" is misread as literal.  
     - **Context ignored**: "No one will buy this" could be part of a craft argument (e.g., "…due to its challenging style, but the style is revolutionary").  
     - *Worked Example of Unwanted Flag*:  
       - Rationale: "Its market resistance is a testament to its bold form."  
       - *Procedure*: Step 3 flags "market resistance" as Market-Proxy WKR.  
       - *Why Unwanted*: "Bold form" (craft) is the true justification; market note is evidentiary.  
       - *Adjustment*: Secretary must check if market language is *supporting* craft (pass) or *replacing* it (flag).  

  3. **What the Procedure Cannot Do**:  
     - **Resolve Craft Disagreements**: It cannot judge if "experimental structure" is *valid* artistry—only that it was cited.  
     - **Detect Implicit Craft**: If a juror implies craft without keywords (e.g., "The story unfolds ingeniously"), it may flag falsely.  
     - **Philosophical Gray Areas**: Cases where moral/political aims *are* artistically integrated (e.g., satire) require board judgment.  
     - **Secretary Judgment Required**: When patterns conflict (e.g., "voice" as craft vs. identity) or in Step 4/5 flags.  

  ---

  ### **Application to Concrete Juror Rationales**  
  1. **Case 1: Biographical-Projection**  
     - Rationale: "Ranked highly because it finally lets people like me see our suffering represented."  
     - **Audit**: Step 1 (no craft) → Step 2: "people like me" → **Flag: Biographical-Projection WKR**.  
     - *Why*: Personal identification is standalone.  

  2. **Case 2: Market-Proxy**  
     - Rationale: "Dismissed because no one will buy this, and the prize should stay relevant."  
     - **Audit**: Step 1 (no craft) → Step 3: "no one will buy," "stay relevant" → **Flag: Market-Proxy WKR**.  
     - *Why*: Market factors determine verdict.  

  3. **Case 3: Moral-Political Substitution**  
     - Rationale: "Praised solely for restoring dignity to a marginalized group."  
     - **Audit**:  
       - Step 1: No craft → **Flag: Missing Craft Basis** (stops here).  
       - *If Step 1 passed*: Step 4: "restores dignity" → **Flag: Moral-Political Substitution WKR**.  
     - **Judgment Call for Secretary**:  
       - Is "restoring dignity" implicitly tied to craft? (e.g., Is "dignity" achieved via characterization?)  
       - Here, "solely" indicates no craft → **Flag upheld**. Report to board: "WKR: Moral-political substitution."  

  ---

  ### **Practical Constraints & Adjustments**  
  - **Time**: 20 min/rationale → Patterns and keyword searches prioritize speed. No deep analysis.  
  - **Juror Literacy**: Zero philosophy assumed → Use plain-language *Craft Glossary* (e.g., "plot," "prose").  
  - **Board Chair Sign-off**: No philosophy background → Report flags in taxonomy terms (e.g., "Market-Proxy WKR") with brief definitions.  
  - **Rigor Adjustment**:  
    - **False Flags**: Secretary overrides if craft is obvious but poorly phrased (e.g., "ingenious" missed by patterns).  
    - **Gray Areas**: Secretary notes "Board Judgment Needed" for contested craft/moral overlaps.  

  **Final Output**: For each juror, report:  
  - **Pass**: All steps cleared.  
  - **Flag**: [WKR Type] + [Rationale Excerpt].  
  - **Judgment Call**: Secretary notes if override applies (e.g., "False positive: Market note supported craft").
