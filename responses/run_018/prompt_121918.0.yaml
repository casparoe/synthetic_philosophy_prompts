prompt: |-
  My dad had a stroke last year — they said something about the insula — and now when a nurse presses on his shoulder he'll say "yeah, that hurts" and go right back to his book, and if I ask whether he wants something for it he looks at me like I've asked a strange question. He isn't confused, he's got all his words, and he still pulls his arm away if you press hard enough. Its made me weirdly obsessed with pain asymbolia, because I thought I already knew what I thought about it and now I'm not sure the question even has one answer.

  Can you draft the joint statement of an adversarial collaboration between two people who've been arguing about asymbolia for years? One says the badness of pain lives entirely in the unpleasantness / want-it-to-stop part, so an asymbolic is a genuine case of pain without badness, and the sensory side — location, intensity, quality — is value-neutral. The other says badness is intrinsic to the experience itself, so if he really isn't bothered then either the experience has been degraded somehow, or the damage is to caring and motivation rather than to how it feels. I want: the claims both can sign, including what they agree the asymbolia evidence actually establishes; the part of the fight that turns out to be about words — "badness" as prudential disvalue vs. felt hurtfulness vs. reason-giving, and what "pain" is even supposed to name; the remaining disagreements, each in wording its own side would sign; and the cruxes. For every crux, give a case both would accept as telling against at least one of them, and write down each side's prediction in advance. Please use these three, I keep circling back to them: (1) reverse asymbolia — full distress, zero sensory detail, he can't say where it is or what sort it is or how strong, only that it's awful; (2) a drug that leaves reported intensity exactly as it was while taking away all the distress; (3) an asymbolic whose answer flips with the question — "no, it doesn't bother me" when asked whether it bothers him, but "yes" when asked whether he'd rather it stopped, or would take something for it if offered. And: what would each of them count as evidence against their own view, and what does my dad's case specifically show, on each reading?

  Format: one sentence at the top that both could sign saying what got settled and what didn't, then a numbered agreed-claims section, then a disagreements table. Start with the document itself — no preface, and don't tell me what you're about to do.
