prompt: |-
  I'm the science editor for a general-interest weekly's health-and-social-science section, and a longtime reader of rationalist blogs and forums. I'm not looking for a primer: I already accept the points that heritability is a sample- and environment-specific partition of variance; that it is not a fixed property of a trait, not a statement about any individual, and not a measure of immutability; and that within-group heritability licenses no inference about between-group differences. What I need is to turn those points into a reusable editorial procedure.

  Every week my desk has to decide, from press releases and abstracts, whether to run stories on new human-genetics findings — twin studies, SNP-based estimates, family studies, polygenic-score results. A decision takes about fifteen minutes, I have final sign-off, and the stakes are real because our readership is general and a bad headline survives any correction. The decision is: run, run with heavy caveats, or kill; and if we run, exactly how the headline and the opening paragraphs may phrase the finding, with the one or two non-negotiable caveats.

  Please write me a fact-checking checklist, in the order the steps should be applied, that a literate but non-specialist colleague could follow. For each step, state the concrete error it catches and the shortest defensible wording for copy. Tell me which distinctions from quantitative genetics must survive the translation and which can safely be dropped for a lay readership. Flag openly which steps require numbers I often won't have and what to do then, and which steps are judgement calls dressed up as procedure.

  Then apply the checklist to three cases:
  1. A large twin study reports that divorce is 40 per cent heritable, and the writer wants to headline it with a formulation about divorce being 'in your genes'.
  2. A SNP-based (GCTA) study reports that years of education is 12 per cent heritable, while older twin estimates put it around 40 per cent; the writer wants to say the difference means 'the environment is 88 per cent of the story'.
  3. A study reports a high heritability for body weight within one affluent country, and the editorial team wants to use it to argue that population-level public-health interventions against obesity can have only limited effects.

  For each case, say what the procedure should conclude, which step does the work, and what the final published wording would be. Make sure at least one of your applications concludes that I should kill a story the desk wants to run, and say why. Finally, state plainly what the procedure cannot guarantee even when a study passes every step.

  I want a committed answer: choose a definite order, definite editorial rules, and definite wording rather than laying out options and leaving me to select. Write the answer in British English.
reasoning: |-
  Okay, let me tackle this science editor's request. They need a practical checklist to evaluate genetics studies for their health section, with concrete applications. 

  First, I consider their constraints: 15-minute decisions, lay readership, real-world impact of headlines. The checklist must prioritize actionable red flags over theoretical nuances. I'm structuring it in decision-tree order - from highest-risk/most common errors first.

  The core principles to preserve are: heritability ≠ destiny, within-group ≠ between-group, and estimates are population/context specific. We can safely drop terms like "broad-sense heritability" for lay audiences.

  For the checklist steps, I'm including:
  - Immediate kill criteria (like genetic determinism claims)
  - Wording traps (e.g. "in your genes")
  - Critical numerical checks (like low SNP heritability flags)
  - Contextual fallacies (e.g. policy extrapolations)

  When applying to cases:
  For the divorce headline, "in your genes" triggers Step 1 - that's determinist language requiring kill or full rewrite. The 40% estimate itself passes other checks but needs framing as "influenced by genetic factors in this population".

  The education study comparison highlights how different methods capture different variance. Step 4 catches this - we must clarify that 12% vs 40% reflects methodology, not environmental change. The "88% environment" claim gets rewritten with nuance.

  The obesity policy case fails Step 9 - heritability within affluent group doesn't predict intervention effects elsewhere. This warrants killing the argument while possibly running the study with caveats.

  Finally, I emphasize that even passing all checks doesn't prevent: bad study design being undetected, oversimplification in interpretation, or misuse by readers. The procedure filters obvious errors but isn't bulletproof.
answer: |-
  Here is your editorial procedure, designed for rapid application by non-specialists. It prioritises high-impact errors and actionable caveats, ordered by criticality and ease of assessment from readily available materials (abstracts, press releases).

  **Genetic Findings Editorial Checklist (British English)**

  1.  **Check for Genetic Determinism Language:**  
      *   **Look for:** Words/phrases like "caused by genes", "in your DNA", "genetically predetermined", "hardwired", "genes for [trait]".  
      *   **Error caught:** Misrepresents heritability as individual destiny or fixed causation. Ignores gene-environment interplay.  
      *   **Action:** **Kill** any headline/lede containing this. If the core finding is salvageable, **mandatory rewrite**.  
      *   **Defensible Wording:** "Study suggests genetic factors *influence* [trait] in [population studied]." / "Genetic differences *linked* to variation in [trait]."

  2.  **Identify the Population & Environment:**  
      *   **Look for:** Explicit description of the study population (nationality, ethnicity, age, socio-economic context, time period) and environment (if mentioned, e.g., "affluent", "post-war").  
      *   **Error caught:** Assuming heritability estimate applies universally (it doesn't – it's specific to that population/environment).  
      *   **Action:** **Mandatory inclusion** of the population/environment context in the lede/headline if defining (e.g., "in UK adults").
      *   **Defensible Wording:** "...among [Population] in [Environment/Time Period, if relevant]."

  3.  **Clarify "Heritability" Meaning:**  
      *   **Look for:** How heritability is defined/estimated (twin/family study? SNP-based/GCTA? Adoption study?). Note the reported % *and* its type (e.g., SNP-h², broad-sense h²).  
      *   **Error caught:** Misinterpreting a narrow estimate (like SNP-h²) as capturing all genetic influence (it doesn't – misses rare variants, gene-gene interactions). Confusing different heritability types.  
      *   **Action:** **Mandatory caveat** specifying the *type* of heritability estimated.  
      *   **Defensible Wording:** "...based on [Method, e.g., analysis of common genetic variants / twin comparisons]."

  4.  **Assess Method-Specific Limitations (Judgement Call):**  
      *   **Look for:** Method used (Twin/Family, SNP/GCTA, PGS). Be alert if SNP-h² is very low (<10%) or differs vastly from older twin estimates.  
      *   **Error caught:**  
          *   *Twin/Family:* Potential confounding by shared environment (especially for behavioural traits). Assumption of equal environments may not hold.  
          *   *SNP/GCTA:* Only captures effects of *common* SNPs measured on the array. Vastly underestimates total genetic influence if rare variants or complex interactions are important.  
          *   *PGS:* Predicts very little variance for most traits; susceptible to confounding (population stratification); prediction accuracy varies massively by ancestry.  
      *   **Action:** **Heavy Caveats Required** if:  
          *   SNP-h² is very low (suggests method limitations or complex architecture).  
          *   Large discrepancy exists with older estimates (highlight methodological differences, *not* environmental change without direct evidence).  
          *   PGS study with low prediction accuracy (R²).  
      *   **Defensible Wording (examples):** "This method only captures a fraction of potential genetic influences." / "Twin studies can overestimate heritability if shared environment impacts twins similarly." / "This genetic score explains a small portion of differences and cannot predict individual outcomes well."

  5.  **"Immutability" & Policy Trap:**  
      *   **Look for:** Any claim that high heritability means the trait is unchangeable by environment/intervention, *especially* for policy implications (e.g., "public health interventions won't work").  
      *   **Error caught:** Equating heritability (variance explained in current environment) with immutability (falsely). High heritability *within* one environment says nothing about effects of *changing* the environment or *between-group* differences.  
      *   **Action:** **Kill** any policy argument based solely on within-group heritability. **Heavy Caveats** against immutability claims. **Mandatory Wording** if trait discussed in intervention context.  
      *   **Defensible Wording:** "High heritability does *not* mean [trait] is unchangeable. Interventions could still be effective for individuals or shift the population average, even if current differences are largely genetic." / "This finding within [Population A] cannot explain differences between [Population A] and [Population B], nor predict the impact of changing environments."

  6.  **Between-Group Difference Fallacy:**  
      *   **Look for:** Any suggestion that within-group heritability explains *differences between* groups (e.g., ethnic groups, genders, socio-economic groups).  
      *   **Error caught:** The fundamental error – within-group variation partitioning does *not* inform between-group mean differences (which could be entirely environmental).  
      *   **Action:** **Kill** any story making this leap. **Absolute ban** on such interpretations in copy.  
      *   **Defensible Wording:** (Not applicable – this interpretation is forbidden).

  **Key Notes for Checklist Use:**
  *   **Missing Numbers (Steps 3 & 4):** If the method (Step 3) isn't clearly stated, **kill the story** – you cannot assess validity. If heritability % is missing, **kill the story** – the core finding is unreported. If PGS accuracy (R²) is missing, **heavy caveats** about predictive power being likely very low for individuals.
  *   **Judgement Calls (Primarily Step 4):** Assessing the *practical significance* of method limitations (e.g., *how* problematic is a low SNP-h²?) requires editorial judgement. Err on the side of caution (heavy caveats) when in doubt. The existence of a large twin/SNP discrepancy *is* a factual trigger for caveats; interpreting *why* is the judgement call.
  *   **Dropped Nuances:** "Broad-sense" vs "narrow-sense" heritability distinction is usually dropped for lay readers; "heritability" is used generically with the *method* caveat (Step 3) covering the key implication. Detailed biometric model assumptions (beyond major ones like equal environments) are omitted.

  ---

  **Application to Cases:**

  **Case 1: Twin Study: Divorce 40% Heritable; Headline "Divorce in Your Genes?"**
  1.  **Step 1:** "In your genes" is genetic determinism language. **Action: KILL** the proposed headline/lede. Mandatory rewrite.
  2.  Study passes Steps 2 (identifies population, presumably), 3 (twin study, report 40% - likely broad-sense h²), 5 & 6 (no immutability or between-group claims in *finding* itself).
  3.  **Step 4:** Twin study on complex social behaviour. **Judgement Call:** Significant risk of shared environment confounding (e.g., parental divorce affecting twins similarly). **Heavy Caveats Required.**
  4.  **Conclusion:** **Run with Heavy Caveats & Rewritten Headline/Lede.** Core finding is reportable but requires specific framing.
  5.  **Final Wording Suggestion:**
      *   **Headline:** Genetic Factors Linked to Divorce Risk in Twin Study
      *   **Lede:** A large study of twins suggests genetic differences may account for around 40% of the variation in divorce rates within their specific population. *[Step 2 - Context]* However, the twin method cannot fully rule out shared upbringing influences *[Step 4 Caveat]*, and this finding does *not* mean divorce is genetically predetermined for any individual *[Step 1/Mandatory Wording]*.

  **Case 2: SNP-h² Education = 12% vs Twin h² ~40%; Headline "Environment 88% of Education Story"**
  1.  **Step 1:** Passes (no determinism).
  2.  **Step 2:** Passes (population identified - though consistency between studies matters).
  3.  **Step 3:** Critical - identifies different methods (SNP-based vs Twin). **Mandatory Caveat** specifying methods.
  4.  **Step 4:** **Triggered** - Large discrepancy (12% SNP-h² vs 40% Twin). **Heavy Caveats Required.** The headline claim "Environment is 88%" is **highly misleading**. The difference primarily reflects methodological limitations: SNP-h² misses rare variants and non-additive effects captured in twin h². It does *not* mean the environment's role increased from 60% to 88%. Environmental effects could be stable, or the methods capture different things.
  5.  **Steps 5 & 6:** Pass (no immutability or between-group claims in finding).
  6.  **Conclusion:** **Run with Heavy Caveats & Rewritten Headline/Lede.** The core finding (SNP-h² estimate) is reportable, but the interpretation of the difference is flawed and must be corrected.
  7.  **Final Wording Suggestion:**
      *   **Headline:** Study Using Common DNA Variants Finds Smaller Genetic Role in Education Than Twin Research *[Highlights method difference]*
      *   **Lede:** New research analysing common genetic variants in large populations estimates they account for about 12% of differences in years of education *[Step 3 - Method Specified]*, lower than the roughly 40% suggested by older twin studies. This gap *[Step 4 Caveat - Mandatory]* likely reflects limitations of the DNA method in capturing all genetic influences, rather than a dramatic increase in environmental importance. Claims that "the environment is 88% of the story" oversimplify the complex interplay of genes and environment *[Refuting the specific error]*.

  **Case 3: High Weight h² in Affluent Country; Argue Limited Scope for Public Health Interventions**
  1.  **Step 1:** Passes (no determinism in *finding*).
  2.  **Step 2:** Passes (population/environment specified - affluent country).
  3.  **Step 3:** Passes (method identified, h² reported).
  4.  **Step 4:** Method-dependent caveats apply but are secondary here.
  5.  **Step 5: TRIGGERED.** The *editorial team's argument* directly commits the "Immutability/Policy Trap" error. High heritability *within* this affluent population means variation is mostly genetic *in their current environment*. It says **nothing** about the potential impact of *changing* the environment (e.g., sugar taxes, urban planning, food labelling, access restrictions) on the *population average* weight. Interventions could be highly effective even if current differences are genetic. This argument is scientifically invalid and dangerous for public health messaging.
  6.  **Step 6:** Passes (no between-group claim in finding, though the argument implies one vs. less affluent populations, which would also be wrong).
  7.  **Conclusion:** **KILL the proposed editorial argument.** The *study finding itself* (high h² for weight in population X) *could* potentially be reported **ONLY** if accompanied by **Step 5's mandatory caveat against immutability and the policy fallacy**. However, given the desk's intent is *specifically* to make this fallacious argument, **killing the entire story** as proposed is the safest course to prevent harmful misinformation. If the *finding alone* is deemed newsworthy:
      *   **Run with EXTREME Caveats & Forbidden Argument.**
      *   **Final Wording Suggestion (if study runs):**
          *   **Headline:** Genetic Factors Dominate Weight Differences in [Affluent Country] Study
          *   **Lede:** Research within [Affluent Country] indicates genetic differences explain the majority of variation in body weight among its residents *[Finding]*. **Crucially, this does *not* mean weight is unchangeable or that public health efforts to reduce obesity are futile *[Step 5 Mandatory Wording]*. Such interventions could still successfully lower average population weight or benefit individuals, even if current differences stem largely from genetics."

  **What the Procedure Cannot Guarantee:**
  Even if a study passes every step of this checklist, **it cannot guarantee:**
  1.  **The Underlying Study's Quality:** The checklist assesses *interpretation and communication* based on the reported findings. It cannot detect fundamental flaws in study design, data quality, statistical errors, p-hacking, or inadequate control for confounding within the study itself that weren't evident in the abstract/press release.
  2.  **Perfect Nuance in Lay Interpretation:** Readers may still oversimplify or misinterpret cautiously worded findings. The checklist minimises the *publication's contribution* to misunderstanding but cannot eliminate reader error.
  3.  **Future Misuse:** Findings reported with appropriate caveats might still be misused later by others (e.g., policymakers, ideologues) outside the publication's control. The checklist ensures the *publication itself* is not the source of the misuse.
