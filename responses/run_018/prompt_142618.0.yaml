answer: |-
  *(Leans forward, eyes sharp)* You're conflating two distinct issues: preference *formation* versus preference *consistency over time*. Yes, framing and context shift revealed preferences—that's the core of hyperbolic discounting! The volatility you cite isn't evidence against the model; it's predicted *by* it. When I say "future self," I mean the agent at t+1 whose discount curve steepens as t+1 becomes *present*. That shift is systematic: distance flattens the curve, proximity steepens it. The "contract" exists *because* we recognize this predictable dynamic—past selves impose deadlines or precommitments precisely to bind future selves who they know will be myopic. Calling this "adaptive preference revision" ignores the central agony of akrasia: the pre-diet "you" and post-cake "you" both acknowledge the *same* higher-order goal (health), but the latter's revealed preference betrays it under temporal pressure. That's not moralizing—it's mapping how time fractures rational agency. Your objection dissolves if we stop pretending selves need Platonic stability; they just need predictable discounting pathologies.  

  *(Holds up a finger)* Wait—you think mood swings sink this? Fine, concede that. But even with noisy fluctuations, the *structural* hyperbolic tilt ensures your future self systematically overweights immediate rewards versus your past self's plan. The prisoner's dilemma analogy holds because cooperation (sticking to the plan) is collectively optimal but individually suboptimal at choice moments. Non-stationarity adds friction, not falsification. Your turn.
