answer: |-
  ## Joint Statement: Adversarial Collaboration on the Killing/Letting Die Distinction

  **Collaborators:** Representatives of the Causal-Source Camp (CSC) and the Institutional-Role Camp (IRC)

  **Date:** October 26, 2023

  **Preamble:** This document represents the outcome of a structured adversarial collaboration between the Causal-Source Camp and the Institutional-Role Camp concerning the nature and significance of the distinction between killing and letting die. Our goal was to clarify points of agreement, precisely articulate fundamental disagreements, identify testable cruxes, and assess the nature of the residual dispute. We present our findings in four parts.

  ---

  **I. Agreed Claims**

  Both camps affirm the following claims:

  1.  **Grammatical Distinction:** There exists a clear grammatical and conceptual distinction between active verbs (e.g., "administer," "inject") commonly associated with killing and negative or passive constructions (e.g., "fail to provide," "allow to cease") commonly associated with letting die.
  2.  **Intuitive Asymmetry (Direct Cases):** In paradigmatic, direct cases (e.g., actively administering a lethal toxin versus passively failing to provide a life-saving antidote that one has no antecedent duty to supply), there is a robust and widely shared intuition that killing is morally worse, or requires stronger justification, than letting die.
  3.  **Legal Parallel:** Most legal systems recognize a distinction broadly analogous to the killing/letting die distinction, typically codified in different standards for acts causing death (e.g., homicide) versus omissions leading to death (e.g., absence of a duty to rescue), reflecting differing levels of culpability or required justification.
  4.  **Collapse in Indirect Causation:** The distinction between killing and letting die becomes ambiguous or collapses in cases involving indirect causation, causal preemption, or complex causal chains where the agent's contribution is mediated or where both action and omission seem intrinsically linked to the outcome (e.g., diverting a lethal threat onto one person versus failing to divert it away from another).
  5.  **Rejection of Purely Affective Explanation:** The intuitive moral asymmetry observed in direct cases cannot be adequately explained *solely* by contingent psychological factors, such as differences in visceral reaction, salience, or perceived control, though these factors may play a contingent role in shaping intuitions.
  6.  **Persistence Under Technological Mediation:** The conceptual problem concerning the moral significance of the distinction persists even when the agent's role is mediated by an automated system with fully transparent decision rules (e.g., a machine programmed to either actively withdraw life support or passively decline to initiate it, based on identical inputs). The mere fact of automation does not resolve the underlying philosophical question about the status of the distinction itself.

  ---

  **II. Disagreements Table**

  | Issue / Crux                                                                                                 | Causal-Source Camp (CSC) Formulation                                                                                                                                 | Institutional-Role Camp (IRC) Formulation                                                                                                                                                                |
  | :----------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |
  | **Existence of a Non-Normative Causal Difference**                                                           | There is a metaphysically robust, non-normative difference in causal structure between initiating a new lethal sequence (killing) and failing to intervene in an independent, pre-existing lethal sequence (letting die). | Claims of an objective, non-normative causal difference between initiating versus failing to interrupt a lethal sequence are illusory; any perceived difference is parasitic on normative frameworks defining agency and responsibility. |
  | **Absorption of Moral Weight by Institutional Roles**                                                        | Institutional roles and social expectations modulate the application of the distinction but cannot absorb its fundamental moral weight, which derives from the objective causal asymmetry it tracks. | Institutional roles, social expectations, and frameworks of responsibility fully constitute the moral weight assigned to the distinction; there is no independent, role-independent moral fact grounding the asymmetry. |
  | **Asymmetry in Engineered Scenarios**                                                                        | Even when an agent designs both a lethal pathway *and* the missing safeguard whose absence constitutes "letting die," the objective causal asymmetry between introducing a new threat versus failing to provide a defense remains, preserving the moral distinction. | In engineered scenarios where the same agent creates both the threat and the potential means of its mitigation, the distinction collapses; the moral assessment depends entirely on the agent's comprehensive role and the expectations generated by their design choices. |

  ---

  **III. Cruxes and Predictive Tests**

  1.  **Crux (a): Does the presence of a pre-existing lethal threat, entirely independent of the agent, constitute a necessary and sufficient condition for classifying an outcome as "letting die" rather than "killing," *regardless* of the agent's institutional role?**
      *   **Hypothetical:** *The Ventilator Switch:* Patient P is terminally ill and will die within minutes without a ventilator. Agent A, a hospital technician with no specific duty *to* P, is monitoring the system. The ventilator is currently sustaining P. A flips a switch that immediately stops the ventilator, causing P's death. Alternatively, A is about to connect P to the ventilator as P begins to crash, but deliberately refrains from flipping the switch to *start* it, causing P's death. The decision logic (to disconnect or not connect) is made by a transparent automated system triggered by A pressing a single "withhold/withdraw" button, displaying the identical outcome prediction both times.
      *   **CSC Prediction:** The act of flipping the switch to *stop* the ventilator is killing (introducing a new lethal cause: cessation of support). The act of refraining from flipping the switch to *start* the ventilator is letting die (failing to interrupt the pre-existing lethal process: the underlying disease). The distinction holds despite the identical button press.
      *   **IRC Prediction:** The moral and conceptual difference between the two scenarios vanishes under the description "A pressed the button knowing it would lead to P's death." Any difference perceived is solely due to contingent institutional descriptions of the ventilator's current state ("on" vs. "off"), not an objective causal fact. The agent's role (technician) and the system's state define the act/omission.

  2.  **Crux (b): Can institutional roles and expectations completely reverse the moral valence typically associated with the killing/letting die distinction in a structurally identical scenario?**
      *   **Hypothetical:** *The Designed Safeguard:* Agent A designs and operates a complex safety system for a hazardous factory. The system automatically seals a room if toxic gas is detected. Worker W is trapped in the room during a gas leak. A, observing this, has an override mechanism. In Scenario 1, A actively *disables* the automatic sealant system, ensuring W is exposed and dies. In Scenario 2, A deliberately *fails to activate* a manual backup sealant system (which A is explicitly employed and trained to use in emergencies), ensuring W is exposed and dies. The automated system's decision to seal or not is normatively inert; the moral focus is solely on A's direct action or omission regarding the safeguard.
      *   **CSC Prediction:** Disabling the automatic system (Scenario 1) is killing (introducing a new lethal cause: exposure). Failing to activate the manual backup (Scenario 2) is letting die (failing to interrupt the independent lethal threat: the gas leak). The former is worse, reflecting the causal asymmetry, despite A's role.
      *   **IRC Prediction:** Given A's explicit institutional role and duty to activate the backup system in Scenario 2, the failure to act constitutes a violation equivalent in moral weight to the active disabling in Scenario 1. The role-defined duty absorbs the moral weight; the causal pathway difference is normatively irrelevant. Both are equally condemnable acts of gross negligence.

  3.  **Crux (c): Does the moral asymmetry persist if the agent is causally responsible for *both* the lethal threat and the absence of the intervention that would block it, but these are implemented as distinct, causally isolated mechanisms?**
      *   **Hypothetical:** *Automated Battlefield Medic:* General G deploys two fully automated systems in a warzone: System L (Lethal) which identifies and destroys enemy combatants, and System S (Save) which identifies and administers aid to wounded non-combatants. G programs System S with a rule: "Do not treat wounded found within 10 meters of an activated System L unit." A non-combatant C is wounded near an active L unit. System S detects C but, per its rule, refrains from treatment, and C dies. G could have programmed S without this rule.
      *   **CSC Prediction:** System L's action caused C's wounds (killing attempt). System S's omission caused the failure of rescue (letting die). While G is responsible for both systems, the causal asymmetry between the active wounding and the passive non-rescue remains. The letting die might be less directly attributable to G's causal agency regarding C's death than the wounding.
      *   **IRC Prediction:** G's comprehensive role as designer and deployer of both systems, and the intentional programming of the rule linking L's activation to S's inaction, makes the entire sequence an engineered killing. The distinction between L's "act" and S's "omission" is merely a descriptive artifact of the system design; normatively, G killed C by designing the integrated lethal protocol. The omission has no independent moral status.

  ---

  **IV. Residual Verdict**

  Both camps concur that a significant portion of the ongoing disagreement is **substantive**, not merely verbal. While there is potential for terminological slippage concerning terms like "cause," "independent sequence," or "role," the core dispute concerns the metaphysical bedrock: CSC posits an objective, non-normative difference in causal structure that grounds the distinction's moral significance, while IRC denies the existence of such a structure-independent difference, asserting that all relevant differences are constituted by normative and institutional frameworks. Both sides agree that the disagreement captured in the Disagreements Table (particularly concerning the existence of a non-normative causal difference and the absorption of moral weight by roles) reflects this fundamental, substantive divergence in philosophical commitments regarding agency, causation, and normativity. The predictive tests (Part III) are designed to probe this substantive core. We therefore conclude that while our collaboration has clarified points of agreement and sharpened the debate, the central metaphysical and normative disagreement persists.
