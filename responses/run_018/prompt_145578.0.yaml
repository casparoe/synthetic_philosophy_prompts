prompt: |-
  I'm on a small city heritage board and we get maybe three or four requests a month to rename a street or take down a statue, and we have to vote in 90 minutes with no staff research budget so I need a procedre I can run with just what's in there folder. Ground it in the ethics of commemoration — the gap between honoring someone and just marking that they existed — plus two distinctions I want built in: "mnemonic debt" (if you erase a marker you owe the record preservation somewhere else) and "indexical drift" (when a name stops pointing to the person and starts pointing to neighborhood identity). Write the steps in order, with what counts as enough answer at each, where it stops cold with a rejection, and where it hands off to values because facts can't settle it. Don't lean on knowing specific philosophers. Then run it on three cases: (A) renaming a street called after a local factory owner who built worker housing but also violently broke strikes; (B) removing a bronze statue of a scientist with serious eugenics writings, but there's already a museum exhibit that covers the bad part in detail; (C) renaming a park after a living activist, which our charter technically allows but feels off. Make one of these come out in a direction I'll dislike but the procedure forces. Flag the spots where the procedre just breaks and a board member has to decide by gut. Keep it casual — this is for my actual folder.
reasoning: |-
  Okay, the user is on a small city heritage board dealing with requests to rename streets or remove statues. They need a practical, ethics-based procedure that fits their constraints: no staff research budget, quick 90-minute meetings, and limited resources. The key ethical concepts are mnemonic debt (preserving history elsewhere if a marker is removed) and indexical drift (when a name becomes more about the neighborhood than the person).

  First, I need to structure the procedure step by step. The steps should include clear criteria for rejection or approval, and where the decision relies on values rather than facts. The user wants it grounded in commemoration ethics, distinguishing between honoring someone and merely marking their existence.

  Breaking down the steps: Start with verifying the request meets basic criteria. Then check if the marker is currently honoring or just marking. Assess harm to the community and indexical drift. Evaluate mnemonic debt solutions. Finally, where facts can't decide, move to values-based discussion. Each step needs clear "stop cold" points to reject early and conserve time.

  For the case studies, I need to apply the procedure rigorously. Case A: Street named after a factory owner with mixed legacy. Case B: Statue of a scientist with eugenics writings but existing museum coverage. Case C: Renaming a park after a living activist, which feels off but is technically allowed. One of these should have an outcome the user dislikes to demonstrate the procedure's objectivity—probably Case B since the museum exhibit might handle mnemonic debt, leading to retention despite the controversy.

  I should highlight points where the procedure can't resolve the issue, and the board must use their judgment. For example, in the values-based discussion, if there's no consensus, it defaults to status quo. Also, in Case C, since the park is named after a living person, the "honoring vs. marking" test fails, leading to rejection unless they can justify it as marking, which is unlikely.

  Keeping the language casual and practical is important. The user wants this for their actual folder, so avoid academic jargon. Use clear headings and bullet points where possible, but since the response should be in plain text, make it structured yet conversational.

  Finally, ensure the three cases are analyzed step-by-step, showing how the procedure applies. Flag areas where the procedure breaks, like ambiguous community harm or insufficient mnemonic debt solutions, forcing the board to vote based on values. This meets the user's need for a transparent, efficient process that respects ethical considerations while acknowledging resource limits.
answer: |-
  Here's a **Street-Level Commemoration Review (SLCR) Procedure** designed for your Heritage Board's reality. It prioritizes ethics, your key concepts, speed, and the limitations of the folder.

  **Core Ethics:**
  *   **Honoring vs. Marking:** We distinguish between commemorations that *actively celebrate* a person/event (Honoring) and those that simply *note historical presence* (Marking). Removing/renaming Honors requires a higher bar due to intended positive sentiment.
  *   **Mnemonic Debt:** Removing a marker erases a public prompt to history. Approval *requires* a feasible, accessible plan to preserve the *fact* of the original commemoration and *why* it was changed elsewhere (e.g., plaque, archive note, digital record). No plan? Stop cold.
  *   **Indexical Drift:** Has the name/marker lost its connection to the person/event and become primarily about the *place itself*? If strong drift exists, removal/renaming causes disproportionate community disruption vs. historical correction.

  **The SLCR Steps (90-Minute Max):**

  1.  **Request Legitimacy & Scope Check (5 mins)**
      *   **Check:** Does the request meet basic submission rules (in writing, identifies marker, states reason)? Is the request *only* about renaming/removal (not general complaints)?
      *   **Enough Answer:** Yes/No based on folder contents.
      *   **Stop Cold?** YES if invalid submission or completely outside scope (e.g., "This statue is ugly").
      *   **Handoff?** No.

  2.  **Honoring or Just Marking? (15 mins)**
      *   **Check:** Using the folder (original dedication speech, plaque text, council minutes if any), was the *intent* clearly to *celebrate/venerate* (Honoring) or just *identify/note existence* (Marking)? Look for language like "heroic," "grateful city," "in memory of" vs. "named for," "site of."
      *   **Enough Answer:** Clear statement of intent found? If ambiguous, assume Honoring (default for statues, prominent street names).
      *   **Stop Cold?** NO (moves to next step).
      *   **Handoff?** If intent is genuinely ambiguous *and* crucial, board votes interpretation (Honor/Mark) based on folder evidence. **Gut Check Point #1.**

  3.  **Evidence of Significant Harm & Current Impact (20 mins)**
      *   **Check:** Does the folder contain *concrete, documented evidence* (news articles, historical society notes, verified testimony) that the commemorated person/event caused significant, enduring harm (e.g., violence, systemic oppression, hateful ideology)? AND does the *continued presence* of the marker *actively* cause harm or distress to a definable segment of the community *now*? (Not just "it's offensive in principle").
      *   **Enough Answer:** Clear, documented harm *and* reasonable evidence of current negative impact? (e.g., protests, community petitions detailing distress, documented avoidance of the space by affected groups).
      *   **Stop Cold?** YES if evidence of significant harm is *absent* OR if evidence of *current* harm/distress is weak/absent. Mnemonic Debt kicks in only if removal is *considered*.
      *   **Handoff?** If harm is documented but current impact is debatable (e.g., "Does a 1920s strike-breaker *really* cause distress today?"). Board weighs historical harm vs. present reality. **Gut Check Point #2.**

  4.  **Indexical Drift Assessment (15 mins)**
      *   **Check:** Does the *folder or common knowledge* suggest the name/marker is now primarily about the *place/neighborhood identity*, not the person? (e.g., "Let's meet at the Founder Statue" meaning the park bench near it; "I live on Mill Road" with no thought of the mill owner).
      *   **Enough Answer:** Strong evidence the marker's primary meaning has drifted (e.g., neighborhood association uses it as identity, local businesses use it in branding unrelated to the honoree)? Or clear evidence it still points directly to the person?
      *   **Stop Cold?** NO (informs weight in next steps).
      *   **Handoff?** If drift is uncertain. Board assesses community perception based on available info. **Gut Check Point #3.**

  5.  **Mnemonic Debt Solution Feasibility (15 mins)**
      *   **Check:** **IF** previous steps point towards *potential* removal/renaming, what is the *concrete, low-cost/no-cost plan* to pay the Mnemonic Debt? (e.g., Adding a small explanatory plaque *at the site* or *in the nearest public building*; submitting a 1-page summary to the local library/historical society archive; a note on the city website heritage page). Is the plan *actionable by the board or a simple council request*?
      *   **Enough Answer:** A specific, simple, actionable plan is proposed *and documented* in the folder notes.
      *   **Stop Cold?** **YES** if no feasible Mnemonic Debt plan exists OR if the plan is overly complex/expensive. The debt *must* be paid for removal/renaming to proceed.
      *   **Handoff?** If multiple simple plans are possible, board chooses.

  6.  **Values Weighing & Vote (20 mins - Only if not Stopped Cold)**
      *   **Check:** If you reach here, facts haven't settled it. Weigh:
          *   *Strength of Harm & Current Impact* (Step 3)
          *   *Was it Honoring or Marking?* (Step 2 - Removing Honors is weightier)
          *   *Strength of Indexical Drift* (Step 4 - Strong drift makes removal more disruptive)
          *   *Quality of Mnemonic Debt Plan* (Step 5)
          *   *Broader Community Values:* Does removal/renaming align with the city's stated values of inclusivity, historical reckoning, or community cohesion *as understood by the board*? Does keeping it perpetuate harm or ignore history?
      *   **Enough Answer:** Board discussion and vote based on the above factors.
      *   **Stop Cold?** NO - Vote happens here.
      *   **Handoff?** **This is the core Gut Check.** All value judgments converge here. The procedure forces explicit consideration of the ethics concepts, but the final balance is subjective.

  ---

  **Running the Cases:**

  **Case A: Renaming "Pemberton Street" (Factory Owner: Built housing, violently broke strikes)**
  1.  **Legitimacy:** Valid request. Proceed.
  2.  **Honor/Mark:** Likely **Honoring** (Original dedication probably praised his "industry" and "philanthropy" - housing). Assume Honor.
  3.  **Harm & Impact:** **Significant Harm Documented** (Violent strike-breaking). **Current Impact?** Folder may have letters from unions/descendants citing ongoing pain. *If present, proceed.* If absent, STOP COLD. *(Assume evidence exists for proceeding).*
  4.  **Indexical Drift:** Unlikely for a street name unless it's a major commercial strip uniquely identified by it ("Meet me on Pemberton"). Probably **Low Drift** (still points to the man). *Slightly favors removal.*
  5.  **Mnemonic Debt:** **Feasible Plan Needed.** Proposal: Add a small plaque *on the renamed street signpost* or at the community center: "Formerly Pemberton Street, named for X (1850-1920), local industrialist who built worker housing and whose private security forces violently suppressed the 1892 and 1907 labor strikes." **Plan Feasible?** YES (simple plaque). Proceed.
  6.  **Values Weighing:** **Toss-up.** Strong harm vs. Honoring intent. Low drift slightly favors removal. Good debt plan. Board must weigh: Does the harm of honoring a strike-breaker outweigh the historical note of his mixed legacy, corrected by the plaque? *Vote likely close, could go either way.*

  **Case B: Removing "Dr. Vance" Statue (Scientist, Eugenics writings; Museum exhibit covers it)**
  1.  **Legitimacy:** Valid. Proceed.
  2.  **Honor/Mark:** **Definitely Honoring** (Statue, likely celebratory plaque).
  3.  **Harm & Impact:** **Significant Harm Documented** (Eugenics writings). **Current Impact?** *Crucial question.* Does the statue *itself* cause distress *despite* the museum exhibit? Folder might have petitions/groups saying yes (feels like a public endorsement) or arguments saying no (museum contextualizes it sufficiently). *If strong evidence of current distress (e.g., protests at statue), proceed. If argument is "it *should* offend," but no evidence of active distress, STOP COLD at Step 3.* **(This is the "direction you'll dislike" part - Let's assume the folder *lacks* strong evidence of *current, active distress/direct harm caused by the statue's presence* beyond the known history covered in the museum. STOP COLD at Step 3.)** *Rationale: The museum exhibit arguably pays significant Mnemonic Debt already. Removal requires evidence the statue itself *actively* causes harm now.*
  4.  *(Not Reached - Stopped Cold)*
  5.  *(Not Reached)*
  6.  *(Not Reached)*
      **OUTCOME: Rejection. Retention.** (Due to lack of proven *current impact* despite documented harm, mitigated by museum context).

  **Case C: Renaming "Riverside Park" after Living Activist "Maria Garcia"**
  1.  **Legitimacy:** Valid. Proceed.
  2.  **Honor/Mark:** Renaming *after a living person* is **inherently Honoring**. Charter allows it, but the act is celebratory by nature.
  3.  **Harm & Impact:** **N/A to Original Name?** Request isn't about harm from "Riverside Park." It's about *adding* an honor. **Check for Harm:** Does naming it *now* after Ms. Garcia cause harm? Unlikely. *Proceed, but focus shifts to honoring a living person.*
  4.  **Indexical Drift:** "Riverside Park" likely has **Strong Drift** (points to the location/amenity). Renaming disrupts this established identity significantly.
  5.  **Mnemonic Debt:** **Applies to the *Original* Name?** Renaming "Riverside Park" erases that generic but established identifier. Plan needed: "Formerly known as Riverside Park" on new signage/maps for X years? Feasible, but clunky. *Proceed.*
  6.  **Values Weighing:** **Major Concerns.**
      *   Honoring living individuals is historically fraught (careers can change, controversies arise later). Breaks the "Marking" possibility.
      *   Strong Indexical Drift makes renaming disruptive.
      *   Is this the *right* level of honor? (Statue/plaque might be more appropriate for living persons).
      *   Charter allows it, but is it *wise*?
      *   **OUTCOME: Likely Rejection.** The combination of honoring a living person + disrupting an established place identity with strong drift + potential future complications outweighs the desire to honor Ms. Garcia *in this specific way, right now*. Suggest alternative commemoration (bench, garden *within* the park, award).

  **Where the Procedure Breaks (Gut Check Flags):**
  *   **Step 2 (Honor/Mark Ambiguity):** When the original intent is genuinely unclear from the folder.
  *   **Step 3 (Current Harm Assessment):** Judging the *severity* and *current community impact* of historical harm based on limited evidence. Is documented past harm *enough* without strong proof of *current* distress?
  *   **Step 4 (Indexical Drift):** Gauging the *actual* community perception of the name's meaning without surveys.
  *   **Step 6 (Values Weighing):** The entire final step is a values-based judgment call, balancing the ethical concepts. The procedure forces the factors onto the table, but the weight given to each is subjective.

  **Keep in Your Folder:** This SLCR forces you to confront the core ethics (Honor vs. Mark), protects against historical erasure (Mnemonic Debt), acknowledges community identity (Indexical Drift), and stops unsupported or logistically impossible requests cold. It won't make the hard votes easy, but it makes them structured and grounded. Good luck!
