prompt: |-
  I was arguing with my roommate last night about whether moral reasons can just float around with nobody actually holding them, you know? We got kinda sidetracked talking about Scanlon and whether reasons are just out there like furniture, but I think I lost the thread somewhere around midnight. Anyway I'm trying to write something for this course I'm taking on conceptual foundations of ethics, and I keep running into this idea of 'free-floating rationales' — reasons that don't depend on any actual reasoner having them — but it feels like cheating unless you can ground them somehow.

  So could you argue for the position that free-floating rationales can't actually do any normative work unless they're anchored in some kind of distributed cognitive scafolding? I don't mean just that someone needs to recognize them; I mean that their very status as reasons collapses into being embedded in social practices or institutional structures that distribute cognition across people. Basically defend the idea that there's no real distinction between 'reasons without reasoners' and 'reasons embedded in distributed practices' — if you push the free-floating view hard enough it dissolves into the embedded view. Don't just run through the standard internalism/externalism playbook, I want something that actually moves the ball on whether rationales can be genuinely orphaned.
