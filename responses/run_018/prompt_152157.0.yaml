prompt: |-
  I serve as the clinical ethics officer at a residential treatment facility specializing in severe substance-use disorders with co-occurring impulse-control conditions, and our state recently mandated that every eligible admission include an evaluation for a voluntary precommitment protocol—essentially a Ulysses-style contract in which a patient, during a period of assessed capacity, binds their future self to specific clinical restrictions (refusing discharge, accepting medication holds, blocking supplier contact) that activate automatically during a predicted crisis window. At present my team drafts these protocols case-by-case, but legal review and patient advocates have begun challenging them on inconsistent grounds: some contracts are attacked as disguised coercion, others are voided in crisis despite proper execution, and we have no shared framework for deciding when a binding mechanism genuinely preserves autonomy rather than substituting the institution’s judgment for the patient’s. I need a reusable decision procedure—an ordered checklist with explicit stop conditions and judgment-call flags—that staff can run in approximately thirty minutes per case, without requiring on-site legal counsel but with a mandatory sign-off line, translating the philosophical distinction between a Ulysses contract (a future-self-binding instrument designed to protect a long-range preference from temporary distortion) and constitutional precommitment (a structural rule that constrains available options regardless of present preference) into operational criteria that a non-philosopher can apply consistently.

  The procedure should ask, in sequence: (1) whether the patient currently demonstrates procedural autonomy—understood here not merely as cognitive capacity but as the ability to revise preferences through a legitimate reflective process—versus whether the contract merely locks in a past substantive preference; (2) whether the binding mechanism targets a specific anticipated failure mode (e.g., acute withdrawal, manic escalation) rather than imposing a blanket restriction; (3) whether the contract includes a dead-hand provision—an irreversible institutional hold that outlasts any change in the patient’s values or circumstances—versus a reversible trigger with a defined cost or delay; (4) whether revocation during crisis is structurally possible and, if so, whether it requires a second-order evaluation rather than an instantaneous override; and (5) whether the protocol, if enforced, would produce an outcome that the patient’s current crisis-state self rejects but that aligns with their stable, pre-crisis value system, with clear markers for when this alignment is ambiguous. At each step, specify what counts as a sufficient answer, where the procedure terminates with a clear do-not-implement or refer-to-ethics-board decision, and where judgment cannot be eliminated—particularly in weighing whether a future preference reversal reflects authentic value change or merely symptomatic distortion. Then apply the procedure to three cases: first, a patient with alcohol-use disorder who binds herself to a thirty-day discharge-block and disulfiram administration upon readmission of alcohol on breath; second, a patient with bipolar I disorder in remission who contracts to maintain lithium and block discharge requests during manic phases, but who now, in a manic episode, demands immediate release; and third, a case where the procedure yields an answer the clinical team will resist—perhaps a contract formed during a prolonged depressive episode that binds the patient to refuse all future antidepressant changes, where the procedure identifies a dead-hand structural error and mandates voiding despite the team’s belief that enforcement would prevent harm.

  The procedure must be honest about its limits: it cannot resolve deep metaphysical disputes about the persistence of personal identity across severe mental-state shifts, it cannot substitute for legal review of statutory rights, and it should flag rather than conceal the point at which autonomy-preservation becomes paternalism masked as precommitment. It should also distinguish between soft precommitment (reversible with a cooling-off period) and hard precommitment (institutionally enforced regardless of present objection), and it should include a final sign-off line that records which steps were satisfied by evidence and which were satisfied by clinical judgment alone. Please present this as a practitioner-facing flowchart in words, with the test questions in order, the decision nodes, the three worked applications—including the unwelcome result in the third case—and an explicit statement of what the procedure is not designed to do.
reasoning: |-
  We are creating a decision procedure in the form of an ordered checklist with stop conditions and judgment-call flags. The procedure is for staff to use in approximately 30 minutes per case without requiring on-site legal counsel. It must have a mandatory sign-off line.

  The core philosophical distinction we are translating is between:
  - Ulysses contract: future-self-binding to protect long-range preferences from temporary distortion (autonomy-preserving).
  - Constitutional precommitment: structural rule that constrains options regardless of present preference (potentially paternalistic).

  The procedure must address five questions in sequence:

  1. **Procedural Autonomy Check**: Does the patient currently demonstrate procedural autonomy (ability to revise preferences through legitimate reflective process) or is the contract merely locking in a past substantive preference?
  2. **Specific Failure Mode**: Does the binding mechanism target a specific anticipated failure mode (e.g., acute withdrawal, manic escalation) rather than imposing a blanket restriction?
  3. **Dead-Hand Provision Check**: Is there a dead-hand provision (irreversible hold that outlasts changes in values/circumstances) or is it a reversible trigger with defined cost/delay?
  4. **Revocation During Crisis**: Is revocation during crisis structurally possible? If yes, does it require a second-order evaluation (not instantaneous override)?
  5. **Alignment with Stable Values**: If enforced, would the protocol produce an outcome that the current crisis-state self rejects but that aligns with the stable, pre-crisis value system? With clear markers for ambiguous alignment.

  At each step, we specify:
  - Sufficient answer (what passes the step)
  - Stop conditions (where the procedure terminates with "do not implement" or "refer to ethics board")
  - Where judgment cannot be eliminated (especially in distinguishing authentic value change from symptomatic distortion)

  Additionally, we must:
  - Distinguish between soft precommitment (reversible with cooling-off period) and hard precommitment (institutionally enforced regardless of present objection).
  - Include a final sign-off line that records which steps were satisfied by evidence and which by clinical judgment.

  We then apply the procedure to three cases.

  Finally, we must be honest about the limits: cannot resolve deep metaphysical disputes, cannot substitute for legal review, and flags the point where autonomy-preservation becomes paternalism.

  ---

  **Decision Procedure: Ulysses Contract Evaluation Checklist**

  **Staff Instructions**: 
  - Complete in sequence. 
  - At each step, if a stop condition is met, terminate and take the indicated action.
  - If a step requires a judgment call, document the reasoning and note that it is a judgment.
  - At the end, complete the sign-off line.

  ---

  **Step 1: Procedural Autonomy Check**

  *Question*: Does the patient currently demonstrate procedural autonomy (i.e., the ability to revise preferences through a legitimate reflective process) in forming the contract? Or is the contract merely locking in a past substantive preference without such a process?

  *Sufficient Answer*: 
  - Evidence of a reflective process: the patient engaged in deliberation, considered alternatives, and demonstrated the ability to revise their own preferences during the formation. 
  - The contract is not just a snapshot of a past preference but the result of an ongoing, revisable process.

  *Stop Conditions*:
  - **Do not implement** if the patient did not have decision-making capacity at the time of contract formation (by standard clinical assessment). 
  - **Refer to ethics board** if there is evidence that the patient was coerced (by staff, family, or circumstances) into the contract.

  *Judgment Call*: 
  - Determining whether the patient's reflective process was "legitimate" (e.g., was it influenced by temporary factors that might have distorted reflection?).

  *Documentation*: 
  - Record evidence of reflective process (e.g., notes from discussions, patient's expressed reasoning, consideration of alternatives). 
  - If the step is passed, note whether by evidence or judgment.

  ---

  **Step 2: Specific Failure Mode**

  *Question*: Does the binding mechanism target a specific anticipated failure mode (e.g., acute withdrawal, manic escalation) rather than imposing a blanket restriction?

  *Sufficient Answer*: 
  - The contract must specify the trigger condition (e.g., "when blood alcohol level > 0.05%", "when YMRS score > 20") and the restriction is only activated by that condition. 
  - The trigger must be objectively measurable and tied to a known symptom or crisis state.

  *Stop Conditions*:
  - **Do not implement** if the contract imposes a restriction without a specific trigger (e.g., "any time I ask to leave") or if the trigger is overly broad (e.g., "when I feel stressed").
  - **Refer to ethics board** if the trigger condition is defined in a way that might be subject to institutional bias (e.g., "when staff think I am noncompliant").

  *Judgment Call*: 
  - Assessing whether the trigger condition is a valid proxy for the failure mode and whether it is sufficiently specific and objective.

  *Documentation*: 
  - Record the trigger condition and the evidence that it is tied to a specific failure mode (e.g., clinical history, data). 
  - Note if the step is passed by evidence or judgment.

  ---

  **Step 3: Dead-Hand Provision Check**

  *Question*: Does the contract include a dead-hand provision (an irreversible institutional hold that outlasts any change in the patient’s values or circumstances) or is it a reversible trigger with a defined cost or delay?

  *Sufficient Answer*: 
  - The contract must NOT have a dead-hand provision. 
  - It must be reversible either:
    a) Immediately by a second-order evaluation (e.g., a review by an independent panel or a psychiatrist not involved in care) during the crisis, OR 
    b) After a defined cooling-off period (soft precommitment) that is proportional to the anticipated crisis duration.

  *Stop Conditions*:
  - **Do not implement** if the contract includes a dead-hand provision (e.g., "this restriction cannot be lifted for any reason until 6 months have passed").
  - **Refer to ethics board** if the reversibility mechanism is unclear or if the defined cost/delay is excessive (e.g., a 30-day cooling-off period for a typical 3-day manic episode).

  *Judgment Call*: 
  - Determining whether the reversibility mechanism is appropriate (e.g., the cooling-off period is proportional to the crisis).

  *Documentation*: 
  - Record the reversibility mechanism and why it is not a dead-hand provision. 
  - Note if the step is passed by evidence or judgment.

  ---

  **Step 4: Revocation During Crisis**

  *Question*: Is revocation during crisis structurally possible? And if so, does it require a second-order evaluation rather than an instantaneous override?

  *Sufficient Answer*: 
  - Revocation must be structurally possible during the crisis state. 
  - It must require a second-order evaluation (e.g., by an independent reviewer, ethics committee, or a designated clinician not involved in the current treatment) that assesses whether the crisis state is affecting the revocation request. 
  - Instantaneous override by the patient (without any evaluation) is not allowed because it defeats the purpose of the precommitment.

  *Stop Conditions*:
  - **Do not implement** if revocation is not possible during the crisis state (i.e., the contract is absolutely binding once triggered). 
  - **Refer to ethics board** if the revocation process is not clearly defined or if it relies solely on the judgment of the treating clinician (due to conflict of interest).

  *Judgment Call*: 
  - Evaluating the adequacy of the second-order evaluation process (e.g., is the reviewer truly independent?).

  *Documentation*: 
  - Describe the revocation process and note that it requires a second-order evaluation. 
  - Note if the step is passed by evidence or judgment.

  ---

  **Step 5: Alignment with Stable Values**

  *Question*: If enforced, would the protocol produce an outcome that the patient’s current crisis-state self rejects but that aligns with their stable, pre-crisis value system? With clear markers for when this alignment is ambiguous.

  *Sufficient Answer*: 
  - There must be clear evidence that the enforced outcome aligns with the patient's stable, pre-crisis value system (e.g., documented prior statements, advanced directives, known life goals). 
  - The outcome must be one that the patient in a stable state would endorse, even if the crisis-state self rejects it.

  *Stop Conditions*:
  - **Do not implement** if there is no evidence of the patient's stable values (e.g., the patient is new and we have no history) or if the stable values are ambiguous.
  - **Refer to ethics board** if there is evidence that the patient's stable values have changed (e.g., due to a life event) and the contract no longer reflects current values.

  *Judgment Call*: 
  - Distinguishing between a temporary symptomatic distortion (where the crisis-state rejection is not authentic) and an authentic change in values. 
  - Markers for ambiguity: 
    - The patient has expressed conflicting values in the past.
    - The patient's condition is chronic and progressive, potentially altering values.
    - The patient has had significant life changes since the contract was formed.

  *Documentation*: 
  - Record the evidence of stable pre-crisis values and the alignment of the outcome with those values. 
  - Note any ambiguity and how it was resolved. 
  - Note if the step is passed by evidence or judgment.

  ---

  **Final Classification and Sign-off**

  After completing Steps 1-5:

  - If all steps are passed, the contract is classified as a **valid Ulysses contract** (autonomy-preserving) and can be implemented.
  - If any step resulted in a "Do not implement", the contract is **invalid** and should not be implemented.
  - If any step resulted in "Refer to ethics board", the case must be reviewed by the ethics board before implementation.

  Additionally, classify the precommitment as:
  - **Soft precommitment**: if the contract includes a reversible mechanism with a defined cooling-off period (and no dead-hand provision).
  - **Hard precommitment**: if the contract is reversible only through a second-order evaluation (but still reversible) and no cooling-off period is defined.

  **Sign-off Line** (to be completed by the evaluating staff member):

  ```
  I, [Name], have completed this evaluation on [Date]. 

  Step 1: [ ] Satisfied by evidence [ ] Satisfied by judgment [ ] Not satisfied (stop: do not implement/refer)
  Step 2: [ ] Satisfied by evidence [ ] Satisfied by judgment [ ] Not satisfied (stop: do not implement/refer)
  Step 3: [ ] Satisfied by evidence [ ] Satisfied by judgment [ ] Not satisfied (stop: do not implement/refer)
  Step 4: [ ] Satisfied by evidence [ ] Satisfied by judgment [ ] Not satisfied (stop: do not implement/refer)
  Step 5: [ ] Satisfied by evidence [ ] Satisfied by judgment [ ] Not satisfied (stop: do not implement/refer)

  Final Classification: [ ] Valid Ulysses contract (soft) [ ] Valid Ulysses contract (hard) [ ] Invalid - do not implement [ ] Refer to ethics board

  Signature: _________________________
  ```

  ---

  **Limitations Statement**:

  This procedure is not designed to:
  - Resolve deep metaphysical disputes about personal identity across mental-state shifts.
  - Substitute for legal review of statutory rights or compliance with state/federal law.
  - Address every possible ethical nuance; it flags but does not resolve the point at which autonomy-preservation becomes paternalism.
  - Be used without clinical judgment; it requires trained staff to apply the steps.

  ---

  **Worked Applications**:

  **Case 1**: Patient with alcohol-use disorder who binds herself to a thirty-day discharge-block and disulfiram administration upon readmission of alcohol on breath.

  *Step 1*: The patient formed the contract during a period of sobriety and capacity. She engaged in reflective discussion, considered alternatives (e.g., naltrexone), and expressed a clear preference for disulfiram to prevent relapse. **Satisfied by evidence**.

  *Step 2*: The trigger is specific: "upon readmission of alcohol on breath" (which indicates relapse). The failure mode is acute relapse leading to discharge against medical advice. **Satisfied by evidence**.

  *Step 3*: The contract imposes a 30-day discharge block and disulfiram. We must check reversibility. The contract does not specify a revocation mechanism. **Stop Condition: Do not implement** until a revocation mechanism is added. Without it, the 30-day block might outlast the crisis (if the crisis is shorter) and become a dead-hand provision.

  *Resolution*: The contract is invalid as is. We must amend to include a reversibility mechanism (e.g., after 7 days, the patient can request a review by an independent clinician to reassess). Then, we re-evaluate Step 3.

  *Step 4*: After amendment, revocation is possible via a second-order evaluation (review by independent clinician) during the 30-day period. **Satisfied by evidence** (assuming the mechanism is defined).

  *Step 5*: The outcome (staying in treatment for 30 days and taking disulfiram) aligns with the patient's stable values (sobriety, maintaining job, family). During a relapse, she might reject it, but that is due to craving. **Satisfied by judgment** (since we infer alignment from past statements).

  *Final*: Valid Ulysses contract (hard, if no cooling-off period but reversible by evaluation). Implement with the amendment.

  ---

  **Case 2**: Patient with bipolar I disorder in remission who contracts to maintain lithium and block discharge requests during manic phases, but who now, in a manic episode, demands immediate release.

  *Note*: The contract was formed in remission and is now triggered (manic phase).

  *Step 1*: Formed during remission (stable state) with capacity. Patient reflected on past manic episodes and the harm caused by discontinuing lithium and leaving treatment. **Satisfied by evidence**.

  *Step 2*: Trigger is "during manic phases" (defined by YMRS score > 20). Targets the failure mode of impulsive discharge requests and non-adherence during mania. **Satisfied by evidence**.

  *Step 3*: The contract blocks discharge requests and enforces lithium. What is the revocation mechanism? The contract must have one. Let's assume it allows revocation after 72 hours (cooling-off) or by an independent psychiatrist review. **Satisfied by evidence** (if defined) or **refer to ethics board** if not.

  *Step 4*: Revocation during crisis is possible but requires a second-order evaluation (e.g., review by an independent psychiatrist). **Satisfied by evidence** (if defined).

  *Step 5*: The outcome (staying in hospital and taking lithium) is rejected by the current manic self but aligns with the patient's stable values (avoiding mania, keeping job, family relationships). Evidence: prior statements during remission and advanced directive. **Satisfied by evidence**.

  *Final*: Valid Ulysses contract. It should be enforced. The current demand for release is overridden by the contract.

  ---

  **Case 3**: A contract formed during a prolonged depressive episode that binds the patient to refuse all future antidepressant changes.

  *Background*: The patient, during a severe depressive episode, signed a contract stating that they must not be allowed to change their antidepressant medication (currently Drug X) because they believe that any change will lead to catastrophic outcomes. Now, in a stable state, they want to switch to Drug Y due to side effects, but the contract blocks it.

  *Step 1*: Formed during a depressive episode. We must assess if the patient had capacity and procedural autonomy. Depression can impair reflective processes. Even if capacity was present, the contract locks in a preference formed under the influence of the illness. **Stop Condition: Do not implement** because the contract was formed during a period of distorted thinking (depression) and the patient was unable to engage in a legitimate reflective process (the preference was driven by fear and hopelessness, not open to revision). The contract is invalid at this step.

  *Alternatively, if we proceed beyond Step 1*:

  *Step 2*: The trigger is not specific. The contract applies at all times, regardless of state. It is a blanket restriction. **Stop Condition: Do not implement** because it is not tied to a specific failure mode.

  *Step 3*: The contract is a dead-hand provision: it binds the patient indefinitely, even when stable. **Stop Condition: Do not implement**.

  *Step 4*: No revocation mechanism is defined. **Stop Condition: Do not implement**.

  *Step 5*: The outcome (staying on Drug X) is rejected by the stable-state self and was formed during a depressive episode. The stable-state self wants to change. There is no alignment with stable values (which now include managing side effects). **Stop Condition: Do not implement**.

  *Final*: The contract is invalid on multiple grounds (Steps 1, 2, 3, 4, 5). It must be voided. The clinical team may resist because they fear the patient might relapse if they change medication, but the procedure identifies a dead-hand error and lack of alignment. The team must respect the patient's current stable preference.

  ---

  **Note for Case 3**: This case illustrates an unwelcome result for the clinical team, but the procedure clearly flags the contract as invalid and paternalistic. The team should instead use standard informed consent for medication changes in the stable state.

  This completes the decision procedure and the three applications.
answer: |-
  ### Ulysses Contract Evaluation Procedure: Practitioner Checklist  
  **Purpose**: To distinguish autonomy-preserving Ulysses contracts (binding future selves to protect long-range preferences) from unconstitutional precommitments (structural rules overriding present autonomy).  
  **Time Limit**: 30 minutes per case.  
  **Mandatory Sign-off**: Staff must complete the sign-off line (Section VI). Legal review is not required during evaluation but is recommended for ambiguous outcomes.  
  **Limitations**:  
  - Does **not** resolve metaphysical debates about personal identity across mental-state shifts.  
  - Does **not** substitute for legal review of statutory rights (e.g., involuntary commitment laws).  
  - Flags (but cannot eliminate) the boundary between autonomy-preservation and paternalism.  

  ---

  #### **I. Step 1: Procedural Autonomy Check**  
  **Question**: *Does the patient demonstrate **procedural autonomy** (capacity + ability to revise preferences through reflective deliberation) in forming the contract? Or is it merely locking in a past substantive preference?*  
  - **Sufficient Answer**:  
    - Evidence of reflective process (e.g., patient discussed alternatives, weighed trade-offs, and could articulate why they might change their mind).  
    - Contract formation occurred during a period of **stable baseline function** (e.g., remission, sobriety).  
  - **Stop Conditions**:  
    - **Terminate (Do Not Implement)**: No evidence of reflective deliberation (e.g., patient passively accepted a template).  
    - **Refer to Ethics Board**: Ambiguity about whether the patient’s state during formation allowed genuine revision (e.g., mild depression affecting motivation).  
  - **Judgment Call**:  
    - Was the reflective process distorted by subclinical symptoms? (e.g., anxiety shortening deliberation).  
    - **Flag**: If the contract enforces a preference formed >6 months ago with no recent reaffirmation.  

  ---

  #### **II. Step 2: Specific Failure Mode**  
  **Question**: *Does the binding mechanism target a **specific anticipated failure mode** (e.g., acute withdrawal, manic episode) rather than imposing a blanket restriction?*  
  - **Sufficient Answer**:  
    - Trigger is **objectively measurable** (e.g., breathalyzer >0.05%, Young Mania Rating Scale >20).  
    - Restrictions activate **only during the crisis window** (e.g., "block discharge during manic episodes," not "block all discharge requests").  
  - **Stop Conditions**:  
    - **Terminate (Do Not Implement)**: Blanket restrictions (e.g., "never allow discharge against medical advice").  
    - **Refer to Ethics Board**: Vague triggers (e.g., "when staff deem me irrational").  
  - **Judgment Call**:  
    - Is the trigger a valid proxy for the failure mode? (e.g., "readmission of alcohol on breath" reliably predicts loss of impulse control).  

  ---

  #### **III. Step 3: Dead-Hand Provision Check**  
  **Question**: *Does the contract include a **dead-hand provision** (irreversible hold outlasting value/circumstance changes) or a **reversible trigger** with defined cost/delay?*  
  - **Key Definitions**:  
    - **Soft Precommitment**: Reversible after a "cooling-off" period (e.g., 72-hour delay for revocation).  
    - **Hard Precommitment**: Reversible only via second-order evaluation (e.g., ethics committee review), **not** irreversible.  
  - **Sufficient Answer**:  
    - Mechanism is **reversible** (soft or hard) and time-limited to the **expected crisis duration** (e.g., 7 days for alcohol withdrawal).  
  - **Stop Conditions**:  
    - **Terminate (Do Not Implement)**: Irreversible holds (e.g., "no discharge for 90 days regardless of improvement").  
    - **Refer to Ethics Board**: Reversibility mechanism is undefined or disproportionate (e.g., 30-day delay for a 48-hour crisis).  
  - **Judgment Call**:  
    - Would enforcement outlast a reasonable crisis? (e.g., 14-day hold for mania vs. typical 5-7 day episodes).  

  ---

  #### **IV. Step 4: Revocation During Crisis**  
  **Question**: *Is **revocation during crisis** structurally possible? If yes, does it require a **second-order evaluation** (not instantaneous override)?*  
  - **Sufficient Answer**:  
    - Revocation is possible but requires **external validation** (e.g., review by non-treating clinician or ethics subcommittee).  
    - No "self-override" (e.g., patient cannot unilaterally revoke during the trigger window).  
  - **Stop Conditions**:  
    - **Terminate (Do Not Implement)**: Revocation is impossible once triggered.  
    - **Refer to Ethics Board**: Revocation relies solely on treating staff (risk of bias).  
  - **Judgment Call**:  
    - Is the evaluation process sufficiently independent? (e.g., "second opinion" vs. full ethics review).  

  ---

  #### **V. Step 5: Alignment with Stable Values**  
  **Question**: *If enforced, would the outcome be **rejected by the crisis-state self** but **aligned with stable pre-crisis values**?*  
  - **Sufficient Answer**:  
    - **Clear alignment**: Documented evidence of stable values (e.g., advance directive, past statements like "I always regret quitting treatment during mania").  
    - Outcome prioritizes **long-range goals** (e.g., sobriety, stability) over crisis-driven impulses.  
  - **Stop Conditions**:  
    - **Terminate (Do Not Implement)**: No evidence of stable values or ambiguous alignment (e.g., patient has shifting goals).  
    - **Refer to Ethics Board**: Conflict between past and present values (e.g., religious conversion post-contract).  
  - **Judgment Call**:  
    - **Marker for Ambiguity**: Is the rejection due to **symptomatic distortion** (e.g., impulsivity) or **authentic value change**?  
      - *Favor distortion*: Predictable pattern (e.g., manic episodes consistently cause discharge requests).  
      - *Favor authenticity*: New life events (e.g., terminal diagnosis altering priorities).  

  ---

  #### **VI. Final Sign-off**  
  **Instructions**: Complete after all steps. Check boxes for evidence/judgment. Classify contract type.  
  ```  
  [ ] **All steps passed** → Valid Ulysses contract. Implement with monitoring.  
  [ ] **Soft Precommitment** (reversible with delay)  
  [ ] **Hard Precommitment** (reversible only via evaluation)  
  [ ] **Invalid** (terminated at Step ___)  
  [ ] **Referred to Ethics Board** (Step ___)  

  Sign-off:  
  | Step | Satisfied by Evidence? | Satisfied by Judgment? | Notes |  
  |------|-------------------------|------------------------|-------|  
  | 1    | [ ]                     | [ ]                    |       |  
  | 2    | [ ]                     | [ ]                    |       |  
  | 3    | [ ]                     | [ ]                    |       |  
  | 4    | [ ]                     | [ ]                    |       |  
  | 5    | [ ]                     | [ ]                    |       |  
  **Staff Name**: _________________  
  **Signature**: __________________  
  **Date**: _______________________  
  ```  

  ---

  ### **Worked Applications**  
  #### **Case 1: Alcohol-Use Disorder**  
  *Contract*: 30-day discharge block + disulfiram if alcohol detected on breath.  
  - **Step 1**: Patient formed contract during sobriety; discussed relapse fears. **Evidence** of reflection. ✅  
  - **Step 2**: Targets specific failure mode (relapse-induced impulsivity). ✅  
  - **Step 3**: 30-day hold may outlast crisis (typical withdrawal: 5-7 days). **Stop: Do Not Implement** (dead-hand risk). *Amend to 7-day hold with cooling-off period*.  
  - **Step 4**: If amended, revocation requires clinician review. ✅  
  - **Step 5**: Outcome (retention in treatment) aligns with stable value of sobriety. ✅  
  - **Result**: **Valid (Soft Precommitment)** after amendment.  

  #### **Case 2: Bipolar I Disorder**  
  *Contract*: Maintain lithium + block discharge during mania. *Now manic, demands discharge*.  
  - **Step 1**: Contract formed in remission; patient articulated manic harms. ✅  
  - **Step 2**: Targets manic escalation (trigger: YMRS >20). ✅  
  - **Step 3**: Reversible via ethics committee review. ✅  
  - **Step 4**: Revocation requires evaluation (no self-override). ✅  
  - **Step 5**: Outcome (retention/lithium) aligns with stable values (e.g., "I ruin relationships when manic"). Rejection is symptomatic. ✅  
  - **Result**: **Valid (Hard Precommitment)**. Enforce contract.  

  #### **Case 3: Depressive Episode Contract**  
  *Contract*: Formed during depression; binds patient to refuse all future antidepressant changes. *Now stable, wants to switch due to side effects*.  
  - **Step 1**: Formed during depression; no evidence of reflection (patient stated, "Nothing will ever help"). **Stop: Do Not Implement** (lacks procedural autonomy). ❌  
  - **Step 2**: Blanket restriction (no trigger). ❌  
  - **Step 3**: Irreversible (dead-hand provision). ❌  
  - **Step 4**: No revocation mechanism. ❌  
  - **Step 5**: Outcome (no medication changes) rejected by stable self; no alignment with current values. ❌  
  - **Result**: **Invalid** on all grounds. **Void contract** despite team’s harm concerns.  
    - **Unwelcome Outcome Rationale**: The contract is paternalistic—it substitutes the institution’s judgment for the patient’s current autonomy. Use standard capacity-based consent for medication changes.  

  ---

  ### **Flowchart Summary (Text-Based)**  
  ```  
  Start → Step 1 (Procedural Autonomy)  
  │ → No/Stop → Terminate or Refer  
  │ → Yes → Step 2 (Specific Failure Mode)  
  │ → No/Stop → Terminate or Refer  
  │ → Yes → Step 3 (Dead-Hand Check)  
  │ → Dead-hand → Terminate  
  │ → Reversible → Step 4 (Revocation Possible?)  
  │ → No → Terminate  
  │ → Yes → Step 5 (Alignment with Stable Values)  
  │ → Ambiguous → Refer to Ethics Board  
  │ → Misaligned → Terminate  
  │ → Aligned → Valid Contract (Soft/Hard) → Sign-off  
  ```  
  **Final Note**: This procedure surfaces tensions between autonomy and paternalism but cannot eliminate them. When judgment dominates (>2 steps satisfied by judgment), default to ethics review.
