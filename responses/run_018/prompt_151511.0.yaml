  What's particularly clever about the user's framing is their suspicion about "hidden work" being done by unstated distinctions. They're absolutely right that the deadlock stems from:
  - Empirical: Individual choice variance vs structural determinants
  - Formal: Mathematical aggregation fallacies
  - Conceptual: Conflating "equality of opportunity" with "equality of outcome"

  For progress, we'd need to sever these tangled threads. A breakthrough wouldn't be more data (as the user notes, camps just absorb it), but rather:
