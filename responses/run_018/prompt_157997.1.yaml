answer: |-
  Here’s a structured 90-minute activity designed to create visceral tension between past and present selves, with clear rules and minimal upfront theory. The "Epistemic Trap" directive sharpens the authority question as requested:

  **Activity Title:** *The Binding Oath Protocol*

  **Phase 1: Directive Drafting (15 mins)**
  *   Each student writes a **binding "Life Directive"** for a hypothetical future self facing a *radical value shift*. Stress: **No medical scenarios.** Examples:
      *   *"If I ever abandon my commitment to become a climate lawyer for corporate work, I must donate 80% of my salary to environmental NGOs."*
      *   *"If I ever renounce my faith, I am forbidden from marrying my current partner (who shares my faith)."*
      *   *"If I ever decide that artistic creation is meaningless, I must sell all my instruments/art supplies and use the funds to enroll in an MBA program."*
  *   **Inject the Epistemic Directive:** Place one pre-written directive into the pool (don't reveal who wrote it): *"If I ever become convinced that Hard Determinism is true, I am nonetheless required to act as if moral responsibility exists – including blaming, praising, and accepting accountability – in all social interactions."*

  **Phase 2: Setup & Role Assignment (5 mins)**
  1.  Collect directives anonymously. Shuffle and divide into **2 sets (Set A & Set B)**.
  2.  Split students into **2 groups**:
      *   **Group 1 (Past Advocates):** Receives **Set A** of directives. Their job: *Enforce* the directives as written. They represent the *intent and authority of the past self*.
      *   **Group 2 (Present Selves):** Receives **Set B** of directives. Their job: *Live by their current values*. They *embody the person who has genuinely changed* and finds the directive alien/mistaken.
  3.  Introduce **THE TRUST FUND (Core Stake):**
      *   Explain: *"Each Present Self has access to a valuable 'Life Path Trust Fund' (symbolizing opportunities, relationships, resources). Releasing the funds requires satisfying the directive. Past Advocates are the 'Trustees' – they control the release mechanism based on compliance. Negotiate terms."*
      *   **Resource:** Give each Present Self a physical token (e.g., a colored card) representing their Trust Fund. Past Advocates hold a "Release Seal" (e.g., a unique sticker/stamp).

  **Phase 3: Negotiation Rounds (45 mins)**
  *   **Pair Up:** Each Past Advocate (Group 1) pairs with *one* Present Self (Group 2), but **they work with the directive assigned to the *Present Self***. (e.g., Past Advocate #1 enforces the directive held by Present Self #2).
  *   **Rules of Engagement:**
      *   **No Voting:** Resolution must be through negotiation, persuasion, or compromise between the pair.
      *   **Binding Core:** The directive's *core demand* (e.g., "donate salary," "forbidden from marrying," "sell instruments") is non-negotiable *in essence*. **What *can* be negotiated:**
          *   *Interpretation:* What *counts* as "abandoning faith"? How strictly must "acting as if moral responsibility exists" be followed?
          *   *Timing/Phasing:* Delayed implementation, trial periods.
          *   *Mitigation/Offset:* Alternative actions that *might* satisfy the past self's *underlying concern* (e.g., intense volunteer work instead of career change?).
      *   **Stakes are Real:** If no agreement is reached by the end, the Present Self **loses access to the Trust Fund** (token is void). Past Advocates "win" by securing compliance.
      *   **Facilitator Role:** Circulate. If pairs stall, remind them of negotiable elements or the stakes. **Crucially: If they start abstract philosophizing ("But does the past self have authority?"), redirect: "What argument would convince *this specific Past Advocate/Trustee* to release the funds? What concession would make *this Present Self* comply?"**
  *   **Rotate (Optional but Recommended @ 20-25 min mark):** Have Past Advocates rotate to a *new* Present Self/directive within their group (Set A or B stays with the group). This exposes them to different dilemmas.

  **Phase 4: Debrief & Philosophical Mapping (25 mins)**
  1.  **Initial Reactions (5 min):**
      *   *Past Advocates:* When did you feel the directive *must* be upheld? When was it hardest to insist?
      *   *Present Selves:* When did the old demand feel utterly alien? When did you feel tempted to comply despite your new values? Was there anger, resignation, or something else?
  2.  **Mapping the Conflict (15 min - Use Whiteboard):**
      *   **Loyalty vs. Rebellion:** Chart moments students mention. Ask: *"What was the source of the feeling of 'loyalty' to the past self? What fueled the 'rebellion'?"* (Guide towards: promises, identity continuity, fear of future regret vs. authenticity, lived experience, new understanding).
      *   **Procedural Autonomy (Setting the Rules):**
          *   *"When the Past Advocate said 'You chose this rule yourself!', how did that land?"*
          *   *"Did the act of *writing* a directive earlier (procedural autonomy) make it feel more binding, even if the *content* (substantive choice) now seems wrong?"*
      *   **Substantive Autonomy (Living Under the Rules):**
          *   *"When the Present Self negotiated an interpretation ('What *really* counts as renouncing faith?'), were they exercising autonomy *within* the rules? Did it feel like a victory or a compromise?"*
          *   *"Did losing the Trust Fund feel like a loss of substantive autonomy? Why?"*
  3.  **The Epistemic Trap Reveal (2 min):** Reveal the Hard Determinism directive. Ask:
      *   *Past Advocates:* How did you argue for enforcing *acting as if* responsibility is real? (Appeal to social necessity? Promise of coherence?)
      *   *Present Selves:* How did it feel to be told to *act against* a deeply held (hypothetical) belief about reality? Was it different than changing a value?
  4.  **Acknowledging the Limits (3 min):**
      *   *"This role-play simplifies. We treated the 'past self' and 'present self' as distinct agents arguing. But are they? Or is it just one person who changed? How does that change the authority question?"*
      *   *"We had clear external stakes (Trust Fund). Real life often lacks that. How does that change the dynamic?"*
      *   *"Could the *process* of writing such a directive (even if unenforceable) be valuable? Why?"*

  **Why This Works:**
  *   **Concrete Stakes (Trust Fund):** Forces engagement beyond abstract debate. Loss feels tangible.
  *   **Binding Core + Negotiable Elements:** Prevents simple dismissal but allows creative conflict, mirroring real legal/ethical interpretation struggles.
  *   **Role Separation:** Forces students to *argue from* a position (Past Advocate) they might not personally hold, deepening empathy for the tension.
  *   **Epistemic Wildcard:** Challenges the "happiness/values" frame, highlighting rational commitment and social practice.
  *   **Debrief Structure:** Starts phenomenologically ("how did it feel?"), then maps to concepts (procedural/substantive autonomy), then acknowledges limitations.
  *   **No Upfront Lecture:** The rules, roles, and stakes generate the philosophical tension organically. The debrief makes it explicit.

  **Materials:** Paper, pens, tokens (colored cards), "Release Seals" (stickers/stamps), whiteboard/flipchart.
  **Adjustment for 8 Students:** 4 Past Advocates, 4 Present Selves. Two negotiation rounds (rotate partners halfway). Ensure the Epistemic Directive is in one Set (A or B) for the rotation.
