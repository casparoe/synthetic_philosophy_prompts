prompt: |-
  Hey, I cover science and ideas for a magazine and was at a dinner where two people — Maya, a philosopher, and Jonah, a lawyer — got into it over hypocrisy and standing to blame. I'm writing it up but I can't adjudicate the exchange, so I'm pasting it here. The scenario they used was hypothetical but concrete: a city council member voted to ban plastic straws, then was caught using them at her fundraiser. A local activist (who drives a gas car and uses styrofoam takeout) called her out. The council member said the activist had no standing because she's a hypocrite too.

  Here are the rounds, as I remember them:

  (1) Maya said that's right — in same-wrong cases, hypocrisy kills standing. If you're swimming in the same pool you can't yell at someone else for getting wet. Jonah said that's mixing up standing with credibility; being a flawed messenger doesn't erase that the activist is affected by the policy and can legitimately object.

  (2) Maya introduced this idea she called "moral adress" — blame isn't just an entitlement, it's a speech act that needs a receptive audience. A hypocrite's address gets blocked because the target can always deflect with "you too," so the standing isn't technically gone but the act misfires. Jonah said that makes standing depend on listener psychology, which is too fragile; if the wrongdoer is thick-skinned, suddenly nobody has standing.

  (3) Maya pushed back with "compound standing": a group with distributed minor faults can collectively blame a serious offender, but a single gross hypocrite can't do it alone. Jonah said that's just collective hypocrisy with extra steps and doesn't solve the individual case.

  (4) Maya said Jonah was treating blame like a court proceeding where only the pure can prosecute, but real-world blame is about maintaining norms, and enforcers don't need to be perfect — just not this implicated. Jonah said Maya was smuggling a sliding scale without a line, and "this implicated" is circular reasoning.

  Can you go through the exchange move by move and rate each point from clearly mistaken to clearly right? Then say who's more right overall about standing and hypocrisy, and whether either is missing something big — like a distinction between standing and authority that neither used.

  Please don't give me a reading list or citations; I want your take, not a bibiliography. And I might have mispelled "adjudicate" or "adress" somewhere, but you get the idea.

  End with a fixed line like:

  Verdict: [who wins, one phrase]
