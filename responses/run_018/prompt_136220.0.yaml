prompt: |-
  ok so i'm a science/ideas journalist and i've been thinking about teh reference class problem — you know, the thing about picking teh right comparison group for a one-off occurence. here's roughly where i've landed and i want to check if it hangs together or if i'm just talking myself into a corner:

  (1) for genuinely novel events — will this specifc climate treaty work, will this AI system cause harm — there is no objectively correct reference class. it's always a framing choice dressed up as maths.

  (2) despite that, i think forecasters and journalists should be forced to state their reference classes explicitly, because hiding the framing is worse than admitting it's arbitrary.

  (3) when we have a decent causal model of teh mechanism, that should override whatever the base-rate from some historical analogy says — so if i understand why a drug works biologically, i shouldn't let the fact that most drugs fail at this stage block me.

  (4) but in my actual writing i constantly use analogies — this is like the printing press, this is like the Manhattan Project — which are basically just sneaky reference-class selections with no causal backing.

  (5) i also think there's no sharp line between using a reference class and telling a story — they're cognitively identical, just one wears a number.

  so does this hang together? specifically: does (3) collapse once i accept (5), since causal models are also just stories with mechanisms? is (2) just performative theatre if (1) is true? and is (4) a failure of professional behaviour or an unavoidable contradiction given (1) and (5)? please don't just lay out options — rank the tensions by severity, say which single commitment i'd have to drop to clean up teh most mess, and take a definite view on whether i'm salvageable or not. be committed: give me your actual verdict with reasons, not a menu of possibilities.
reasoning: |-
  Okay, let me tackle this query step by step. The user is a science journalist wrestling with the reference class problem—how we pick comparison groups for unique events. Their five points seem coherent but have tensions. 

  First, I need to validate their core insight: yes, reference classes are framing devices disguised as math. That's solid. But tensions emerge when we examine how this interacts with causal models and storytelling. 

  Point 3 claims causal models should override base rates. But if causal models are just "stories with mechanisms" (point 5), doesn't that undermine their authority? Not necessarily—I'd argue well-validated causal models have more empirical traction than cherry-picked historical analogies. The key is whether the mechanism has been stress-tested. 

  Point 2 demands explicit reference classes. Even if arbitrary, forcing transparency counters motivated reasoning. This isn't theater—it's accountability. 

  Their confession about using analogies (point 4) is relatable but problematic. Unchecked analogies are the junk food of analysis: tasty but empty calories. The solution isn't abstinence—it's pairing them with mechanism-based reasoning. 

  The biggest tension is between point 3 (causal supremacy) and point 5 (everything's narrative). Salvaging this requires elevating causal models above mere stories by emphasizing their predictive track record. 

  Overall, their framework holds if they: 
  - Treat causal models as privileged narratives due to falsifiability 
  - Use analogies cautiously, always probing mechanistic parallels 
  - View reference-class disclosure as harm reduction 

  The one point needing refinement is point 5: not all stories are equal. Some withstand scrutiny better than others. That's the linchpin.
answer: |-
  Here's your framework assessed with surgical honesty, ranked tensions, and a definitive verdict. No hedging—this is where your logic holds and fractures:

  **Core Verdict:** Your position is 80% salvageable but requires one major pivot and two operational fixes. The deepest flaw is underestimating the asymmetry between **causal models** and **mere analogies**. Drop the equivalence in (5) to resolve most tensions.

  ---

  ### Tensions Ranked by Severity
  1.  **Critical Tension: (3) vs. (5)**  
      *Conflict:* If causal models are "just stories with mechanisms" (5), then claiming they override base rates (3) collapses into subjectivism.  
      *Resolution:* **Causal models aren't "just stories."** They're empirically validated mechanisms with predictive power. A biochemical model of a drug isn't cognitively identical to saying "this AI is like the printing press." One is falsifiable and constrained by physical laws; the other is a loose metaphor. **Drop the equivalence in (5).**  

  2.  **High Tension: (4) vs. (1) & (3)**  
      *Conflict:* Using unexamined analogies (4) contradicts your demand for explicit reference classes (2) and undermines your causal model priority (3).  
      *Resolution:* Analogies *are* reference classes. Using them "sneakily" (your words) is indeed professional hypocrisy if you champion transparency (2). But it's **fixable:** Audit your analogies. Ask: *"Does this analogy share causal mechanisms with my subject?"* If no, label it "metaphor for intuition, not prediction."  

  3.  **Moderate Tension: (2) vs. (1)**  
      *Conflict:* If reference classes are arbitrary (1), is forcing disclosure (2) performative?  
      *Resolution:* **No.** Transparency forces intellectual honesty. Even arbitrary choices reveal bias (e.g., framing AI as "like nuclear weapons" vs. "like the steam engine"). This is **not theater**—it’s error detection. Keep (2) fiercely.  

  ---

  ### The Single Commitment to Drop  
  **Drop the claim in (5) that reference classes and stories are "cognitively identical."** This is your keystone error. While both use narrative structures:  
  - **Reference classes** are *statistical* tools (even if imperfect).  
  - **Causal models** are *mechanistic* tools (when rigorous).  
  - **Analogies** are *heuristic* tools (often lazy).  
  Equating them ignores **epistemic hierarchy**: A causal model validated by experiments > a reference class based on data > an untested analogy.  

  ---

  ### Salvageability & Prescription  
  **You're salvageable.** Here’s your repaired framework:  
  1. **Reference classes ARE framing devices** (keep 1).  
  2. **MANDATE transparency** in reference class selection (keep 2—it’s essential).  
  3. **PRIORITIZE causal models** over base rates *when robust* (keep 3—it’s correct).  
  4. **USE analogies strategically**:  
     \- *Ban* unchecked analogies.  
     \- *Permit* analogies *only* when causal parallels are argued (e.g., "This AI rollout resembles social media’s rise *because* both exploit attention economics").  
  5. **HIERARCHIZE evidence**: Causal mechanisms > data-driven reference classes > mechanistic analogies > loose metaphors. Reject "all narratives are equal."  

  **Why this works:** It accepts subjectivity in framing (1) while demanding rigor in disclosure (2) and method (3,4). It turns your "sneaky analogies" into a diagnostic tool: *If you can’t articulate the causal parallel, the analogy is rhetorical fluff.*  

  **Final Verdict:** You’ve diagnosed the problem correctly (no objective reference class) but prescribed flawed equality between tools. Fix that hierarchy, enforce analogy audits, and your framework becomes a battering ram against lazy thinking. **Commit to epistemic rigor over narrative convenience.**
