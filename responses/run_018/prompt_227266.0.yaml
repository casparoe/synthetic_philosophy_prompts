  Starting with non-causal decision theories being correct. The user mentions evidential, functional, or updateless approaches. From what I know, causal decision theory (CDT) is the standard, but alternatives like evidential decision theory (EDT) or updateless CDT (UDT) have been proposed for certain problems, like Newcomb's Paradox. However, these aren't widely accepted as generally correct. EDT has issues with smoking lesion-type problems, and UDT is more theoretical. I'd assign a low probability here, say 0.25, because while these theories offer insights, they aren't proven replacements.

  Next, conditional on that, the probability that enough correlated agents exist. If the universe is vast—perhaps infinite or part of a multiverse—then duplicates or near-duplicates might exist. Cosmology suggests the universe is enormous, but it's unclear if it's large enough for exact reasoning duplicates. Quantum copies could exist, but there's debate on that. I'd put this at 0.6, leaning towards possible but not certain.

  Then, stability of cooperation without communication. This is tricky. Even if correlated agents exist, can they maintain cooperation? Game theory shows that without communication, defection can be tempting. EDT might lead to cooperation if agents see their actions as evidence of others' actions, but reasoning differences could break this. I'm skeptical; maybe 0.3 probability here.

  Finally, whether ordinary effects swamp this consideration. In real life, when someone decides to vote or donate, the direct causal and evidential impacts are immediate. For example, voting affects the election outcome directly, and others might observe your action. The entanglement effect would need to be massive to outweigh these, which seems unlikely. High probability here, say 0.9, that ordinary effects dominate.

  Combining these: 0.25 (non-causal correct) × 0.6 (agents exist) × 0.3 (stable cooperation) × (1 - 0.9) for the last term since it's about not being swamped. The last term should be the probability that it's not swamped, so 0.1. Multiplying those gives 0.25 × 0.6 × 0.3 × 0.1 = 0.0045. But that seems too low. I think I need to structure the combination better. The overall probability is P(non-causal correct) × P(agents exist | non-causal) × P(stable | agents and non-causal) × P(not swamped | all above). My final number after multiplication is 0.25 × 0.6 × 0.3 × 0.1 = 0.0045, so about 0.005.

  The user's credence is 0.15, which is much higher. The divergence likely comes from different weights on the sub-questions. Maybe they assign higher probabilities to non-causal theories being correct or to stable cooperation. For instance, if they think UDT is more plausible or that correlation ensures cooperation, that would raise their estimate. Also, they might discount the swamping effect more than I do.

  To move my credence, evidence showing that non-causal decision theories reliably outperform CDT in real-world scenarios would help. If large-scale simulations demonstrated stable cooperation among correlated agents without communication, that could increase my probability for the stability term. Conversely, empirical studies showing that small decisions don't have amplified effects might lower it further.
answer: |-
  Here's my structured probability assessment of the strong version of evidential cooperation in large worlds (ECLW), followed by a comparison to your estimate and key sensitivity points. My final credence is **0.02** (2%). I'll decompose it using your sub-questions, with probabilities and one-line justifications:

  1.  **P(Non-causal decision theory is correct for this context)**: **0.25**  
      *Justification*: While updateless/evidential approaches solve specific puzzles (e.g., Newcomb's problem), they face unresolved challenges (e.g., logical uncertainty, self-locating beliefs) and lack broad real-world validation against causal decision theory.  
  2.  **P(Sufficient correlated agents exist | Non-causal DT correct)**: **0.6**  
      *Justification*: If the universe/multiverse is vast (e.g., infinite or quantum copies), near-identical agents likely exist, but "relevantly similar" reasoning is a high bar—anthropic and computational limits create uncertainty.  
  3.  **P(Stable cooperation emerges | Correlated agents exist)**: **0.3**  
      *Justification*: Even with correlation, divergent priors, reasoning paths, or suspicion (e.g., asymmetric information) could undermine cooperation; game theory shows defection often dominates without enforceable commitments.  
  4.  **P(Effect isn't swamped by ordinary impacts | All above hold)**: **0.1**  
      *Justification*: In practice, direct causal/evidential consequences (e.g., your vote's marginal impact, social signaling from donations) are measurable, while ECLW's "mirrored decisions" are abstract and unobservable—extraordinary entanglement claims require extraordinary scale to dominate.  

  **Combination**:  
  My overall credence = \(0.25 \times 0.6 \times 0.3 \times 0.1 = 0.0045\) → **~0.005 (0.5%)**. However, I adjust to **0.02 (2%)** to account for potential dependencies (e.g., if non-causal DT works, cooperation stability might be higher) and simplified modeling.  

  **Key sensitivity**:  
  My credence is **most sensitive to P(Effect isn't swamped)**. Doubling it to 0.2 would quadruple my final probability (to ~0.04), while halving it to 0.05 cuts the result in half. Dominance by ordinary effects is the strongest counterargument—if entanglement could be empirically verified, this term would skyrocket.  

  **Divergence from your 0.15**:  
  Our largest gap is likely in **P(Effect isn't swamped)** and **P(Stable cooperation)**. You might assign lower weight to swamping (e.g., if you believe cosmological scale trumps local effects) or higher weight to cooperation (e.g., if you think reasoning alignment is more robust). I’m more skeptical that abstract correlation can override tangible decision impacts without direct feedback.  

  **What would move me**:  
  - **Higher**: Empirical evidence of entangled decisions (e.g., large-scale simulations showing cooperation emerging from correlated reasoning without communication) or resolved mathematical foundations for non-causal DTs.  
  - **Lower**: Proof that "similar agents" diverge in practice (e.g., behavioral data showing identical inputs lead to uncorrelated outputs) or demonstrations that ECLW implies absurd/unphysical predictions.  

  **Final note**: While I find ECLW fascinating (hence my non-zero probability), its practical relevance hinges on speculative physics and unproven game-theoretic dynamics. My 0.02 reflects high uncertainty and the strength of competing explanations for small-impact decisions.
