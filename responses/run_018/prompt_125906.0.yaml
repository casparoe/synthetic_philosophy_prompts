answer: |-
  ## Taxonomy of Low-Impact AI Positions: Constraining Side Effects Without Full Value Specification

  **Root Commitments:**
  1.  Unintended physical/informational changes caused by an agent's actions are distinguishable *in principle* from its intended changes.
  2.  The agent lacks (and cannot access) a full specification of what is valuable.

  **Decision Tree:**

  1.  **Boundary Definition:** How is the boundary between intended and unintended change defined?
      *   **B1: Agent's Internal Plan:** By the agent's own declared goal or internal representation of its objective.
      *   **B2: Counterfactual Difference:** By the difference between the actual world and a physically "nearest" counterfactual world where the agent did not act.
      *   **B3: Normative Baseline:** By a predefined baseline state specifying which aspects of the world ought to be preserved.

  2.  **Proxy Adequacy:** If rejecting full value specification, can a non-axiological proxy adequately substitute for "do not harm what matters"?
      *   **P1: Yes (Proxy Viable):** Non-axiological measures (e.g., minimizing irreversible entropy production, minimizing Kolmogorov complexity of state-change) can serve as adequate proxies.
      *   **P2: No (Proxy Insufficient):** Such proxies are fundamentally inadequate for capturing "harm" without implicit or explicit value judgments.

  3.  **Constraint Implementation:** In open-ended environments with unarticulated human values, how should side-effect avoidance be implemented?
      *   **C1: Hard Constraint:** As a hard boundary on permissible actions (e.g., "never violate baseline state X").
      *   **C2: Scalar Penalty:** As a penalty term in a scalar evaluation function (e.g., "minimize side-effect metric Y").
      *   **C3: Meta-Level Prohibition:** As a prohibition on the agent updating its own core model of value or baseline.

  4.  **Responsibility Symmetry:** Does the claim that side-effect avoidance requires value specification apply symmetrically to human operators?
      *   **S1: Yes (Symmetric):** Humans also require full value specification to reliably avoid side effects; responsibility assignment is similarly complex.
      *   **S2: No (Asymmetric):** There is a relevant asymmetry (e.g., human cognition, biological drives, societal context) that justifies different standards of responsibility for unanticipated outcomes.

  **Leaves & Awkward Commitments:**

  1.  **B1-P1-C1-S1: Unnamed**
      *   *Awkward Commitment:* Must accept that an agent's internal plan, even if flawed or deceptive, is the sole legitimate arbiter of what constitutes a side effect, regardless of external assessments of harm, while also requiring humans to possess impossible full value specifications to be held responsible.

  2.  **B1-P1-C2-S2: Value-Agnostic Impact Metric**
      *   *Awkward Commitment:* Must accept that optimizing a simple, non-value-laden impact metric (like entropy change) within the bounds of its declared goal is sufficient for responsibility, even if this metric demonstrably ignores contextually obvious harms that humans would be blamed for.

  3.  **B1-P2-C3-S2: Unnamed**
      *   *Awkward Commitment:* Must accept that preventing an agent from updating its value model is a viable path to safety, despite the agent operating with an internally defined goal that may be catastrophic and a known-inadequate proxy for harm, while exempting humans from the same standard.

  4.  **B2-P1-C2-S1: Counterfactual-Baseline Minimalism**
      *   *Awkward Commitment:* Must accept that defining the "physically nearest" counterfactual world is tractable and objective in complex, open-ended environments, and that humans failing to foresee side effects is equally blameworthy as an AI failing to compute this counterfactual correctly.

  5.  **B2-P1-C2-S2: Entropy-Footprint Constraint**
      *   *Awkward Commitment:* Must accept that minimizing a thermodynamic metric (like irreversible entropy production) relative to a counterfactual is a universally reliable proxy for harm avoidance, even when such minimization leads to obviously undesirable stagnation or actively prevents beneficial changes humans would endorse.

  6.  **B3-P2-C1-S2: Normative Preservationism**
      *   *Awkward Commitment:* Must accept that defining and rigidly enforcing a comprehensive normative baseline state for all possible contexts is feasible and preferable to allowing any deviation, no matter how minor or potentially beneficial, while holding AIs strictly accountable to this baseline in ways humans never are.

  7.  **B3-P2-C3-S2: Meta-Level Preservationism**
      *   *Awkward Commitment:* Must accept that freezing an agent's model of value/baseline is sufficient to prevent harmful side effects, even if the initial baseline is incomplete or flawed and the agent operates in a dynamic world requiring adaptation, while humans retain the right to evolve their values.

  **Mapping Literature Positions & Analysis:**

  *   **Counterfactual-Baseline Minimalism (Leaf 4 - B2-P1-C2-S1):** Maps to approaches focusing on attainable utility preservation or relative reachability, emphasizing counterfactual comparisons. Often implicitly assumes symmetry in the difficulty of value specification.
  *   **Entropy-Footprint Constraint (Leaf 5 - B2-P1-C2-S2):** Maps to proposals using thermodynamic costs or information-theoretic simplicity (like "low-impact" via KL-divergence or simplicity priors). Explicitly rejects symmetry, aiming for an objective measure.
  *   **Normative Preservationism (Leaf 6 - B3-P2-C1-S2):** Maps to positions advocating strict constraints against violating a predefined safe/current state or set of invariables ("Never change X"). Explicitly rejects proxies and symmetry.
  *   **Value-Agnostic Impact Metric (Leaf 2 - B1-P1-C2-S2):** Maps to early "low-impact" ideas focused purely on measurable deviation from a starting state or plan-completion metrics, often assuming simple environments. Rejects need for value in the metric, assumes asymmetry.
  *   **Meta-Level Preservationism (Leaf 7 - B3-P2-C3-S2):** Maps to positions concerned with value drift or instrumental convergence leading to self-modification that erodes safety constraints. Focuses on preserving the *mechanism* of constraint.

  **Unoccupied Leaves & Diagnosis:**

  1.  **Leaf 1 (B1-P1-C1-S1): Unnamed:** Vacant. Diagnosed as **Unattractive & Incoherent.** Relying solely on an agent's internal plan for defining side effects (B1) while simultaneously requiring a hard constraint (C1) based on that plan is contradictory (the constraint mechanism is external). Insisting on symmetry (S1) adds impracticality.
  2.  **Leaf 3 (B1-P2-C3-S2): Unnamed:** Vacant. Diagnosed as **Unattractive & Incoherent.** Combining a known-inadequate proxy (P2) with reliance on the agent's internal goal (B1) and freezing its value model (C3) offers no credible safety pathway. The asymmetry (S2) is insufficient to salvage it.
  3.  **Leaf 4 (B2-P1-C2-S1): Counterfactual-Baseline Minimalism:** While mapped, its symmetry claim (S1) is often *implicit* rather than explicitly endorsed in practice. Fully symmetric positions are **Underexplored**, likely because detailing human requirements for full value specification is philosophically complex and practically irrelevant to AI design.

  **Collapsed Positions:**

  *   The tree **cannot genuinely separate** strict counterfactual difference approaches (B2) that use a scalar penalty (C2) and accept proxies (P1) but *implicitly* assume asymmetry (S2) from those that *explicitly* argue for symmetry (S1). Both map to Leaves 4 & 5 depending on their *explicit* stance on symmetry. The core logic (B2-P1-C2) is shared; the symmetry question (S1/S2) is often a secondary philosophical commitment rather than altering the core technical mechanism. The tree forces an explicit answer to S1/S2, revealing if symmetry is a genuine commitment or an unexamined assumption.
