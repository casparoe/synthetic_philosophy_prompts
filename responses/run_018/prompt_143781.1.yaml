answer: |-
  The tension you describe centers on fundamentally opposing conceptions of urban legitimacy, particularly regarding the temporal dimension of control over the built environment. Evaluating the moral weight of zoning's "intergenerational lock-in" through these frameworks reveals starkly divergent accounts of who holds legitimate claims over the city's future.

  The Lefebvrian "right to the city" framework inherently rejects the moral legitimacy of this temporal lock-in. It views the city as a dynamic, collective oeuvre – a social product continuously shaped and reshaped by its inhabitants through lived experience and struggle. Urban space, in this view, is not a static commodity but a vibrant process of co-creation. Consequently, privileging use-value over exchange-value demands that the city serve the needs and desires of its *present* inhabitants, not the frozen preferences of past owners enshrined in regulation. The democratic appropriation central to this framework implies an ongoing right to remake the city. Zoning as intergenerational lock-in is therefore a profound moral violation; it represents an anti-democratic seizure of future inhabitants' collective right to shape their own spatial reality. The preferences of one generation, codified into binding land-use rules, become an illegitimate imposition, denying subsequent residents their fundamental agency in the perpetual production of urban space. The moral weight of this lock-in is immense – it is the denial of the right to the city itself for future generations, trapping them in a spatial order designed for others.

  Conversely, the sovereignty-based defense of zoning embraces this temporal lock-in as morally justified, anchoring legitimacy in established property rights extended through time. It conceptualizes local land-use control as an expression of individual or communal property sovereignty, where ownership implies not just control over a physical parcel but authority over its anticipated future character within a defined temporal horizon (often spanning generations). Unwanted development is framed not merely as an inconvenience but as a violation of this temporal sovereignty – an illegitimate intrusion disrupting the owner's intergenerational project of stability, value preservation, and continuity. From this perspective, zoning's lock-in function is morally defensible precisely *because* it protects the expectations and investments of current owners against future change they deem undesirable. It distributes power across generations by privileging the claims of the present (and recent past) over the potential claims of the future. The moral weight here rests on honoring established commitments, protecting perceived investments in community character, and upholding the principle that owners have a legitimate right to shape the long-term environment surrounding their property, binding future residents to the choices deemed desirable by the established community.

  Regarding coherence in accounting for legitimacy across generations when zoning acts as this temporal mechanism, the Lefebvrian framework offers a more consistent temporality. It explicitly recognizes the city as an ongoing, open-ended process belonging inherently to its *living* inhabitants. Its legitimacy flows from present collective participation and need, rejecting the notion that past decisions can morally foreclose future possibilities. The sovereignty framework, while coherent internally within its individualist and property-centric logic, struggles with temporal incoherence when scaled to the city as a whole. It treats the "temporal horizon" of current owners as sacrosanct but fails to adequately address the inherent conflict when *their* frozen preferences inevitably clash with the vastly different needs, values, and desires of future inhabitants who inherit the locked-in city. It elevates the stability desired by one generation to a moral principle binding all others, without providing a mechanism for legitimate future revision beyond the very constraints (zoning amendments often requiring supermajorities or facing intense political resistance) designed to prevent it. This creates a temporal asymmetry: the present binds the future, but the bound future has no reciprocal right to unbind itself easily from the past.

  Thus, while the sovereignty framework provides a clear rationale for *why* present owners value lock-in (protection of investment and expectation), the Lefebvrian framework provides the more coherent account of *legitimacy across generations* by grounding it in the evolving collective life of the city itself, asserting that the right to shape the urban environment cannot be permanently alienated by one generation from those who will inevitably inherit and inhabit it.
