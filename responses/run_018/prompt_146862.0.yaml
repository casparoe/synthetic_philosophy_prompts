prompt: |-
  I am a doctoral student working at the intersection of philosophy of mind and cognitive neuroscience, and I have become convinced that debates about global workspace theory tend to stall because participants disagree about what a successful integration of phenomenal consciousness and access consciousness would actually have to look like. Before assessing particular models, I want to establish the criteria themselves. Could you lay out the full set of desiderata that any theory attempting to reconcile phenomenal consciousness, access consciousness, and the architecture of global broadcasting must satisfy?

  I need more than a checklist: for each requirement, specify the motivating phenomenon or conceptual distinction — for instance, the need to preserve a gap between there being something it is like to experience a state and that state being available for reasoning and report; the need to accommodate empirical findings about brief, masked stimuli that appear to carry structured phenomenal content, including figure-ground organization and face-level recognition, without entering sustained workspace availability (a constraint I will call binding-before-broadcast); and the need to avoid treating phenomenal consciousness as merely an unstable precursor to access. Please distinguish non-negotiable constraints from camp-specific preferences — such as whether determinism about workspace entry is required, or whether local recurrent processing can count as sufficient for phenomenal status — and identify whether any subset of these desiderata is jointly unsatisfiable. In particular, I want to know whether accounting for rich phenomenal structure prior to broadcasting necessarily conflicts with the global integration condition central to global workspace architectures, and if one single requirement does the bulk of the work in ruling out the most common current approaches, please say which one and why. Present your answer in American English, in a structured format with brief justification for each item, and do not provide a bibliography, citation list, or reading recommendations; I am interested solely in the conceptual specification.
reasoning: |-
  Okay, the user is a doctoral student working at the intersection of philosophy of mind and cognitive neuroscience. They're focused on the debate around global workspace theory (GWT) and why it stalls. Their main point is that disagreements stem from differing views on what a successful integration of phenomenal consciousness (P-consciousness) and access consciousness (A-consciousness) should look like. So they want to establish clear criteria before evaluating specific models.

  They need a structured set of desiderata, each with justifications based on phenomena or conceptual distinctions. They mentioned examples like the gap between phenomenal experience and reportability, findings on masked stimuli with structured content (binding-before-broadcast), and avoiding treating P-consciousness as just unstable access. They also want non-negotiable constraints separated from camp-specific preferences, and to highlight any conflicts, especially between rich pre-broadcast structure and global integration.

  First, I need to recall the core concepts. P-consciousness is about subjective experience—what it's like to have an experience. A-consciousness is about information being accessible for reasoning, reporting, etc. GWT posits that consciousness arises when information is broadcast to a global workspace, making it available to multiple cognitive systems.

  The user's key concerns are:
  1. **The Gap Problem**: P-consciousness without A-consciousness (e.g., masked stimuli that are experienced but not reported).
  2. **Binding-Before-Broadcast**: Structured phenomenal content exists before global access.
  3. **Avoiding Epiphenomenalism**: P-consciousness shouldn't be seen as just a precursor to access; it must have a functional role.

  I should list non-negotiable constraints first. These are based on empirical evidence and conceptual necessities:
  - **Distinction Preservation**: There must be a gap between P and A-consciousness. Supported by phenomena like masked priming where subjects experience content without reporting it.
  - **Pre-Access Richness**: Phenomenal content can be rich (e.g., figure-ground segregation) before broadcasting. This comes from studies on rapid visual processing.
  - **Functional Efficacy**: P-consciousness must have causal power, not just be a byproduct. If it has no effect, it becomes epiphenomenal.
  - **Architectural Compatibility**: The theory must align with GWT's core—global broadcasting enables access and integration.
  - **Neural Plausibility**: Needs to fit with known neuroscience, like recurrent processing in sensory areas.

  Then, camp-specific preferences where theorists might disagree:
  - **Determinism of Workspace Entry**: Whether entry into the workspace is deterministic or probabilistic. GWT typically leans deterministic, but some models might allow variability.
  - **Recurrent Processing as Sufficient for P-Consciousness**: Can local recurrent loops create P-consciousness without global access? Some (like LRP proponents) say yes, others insist global access is necessary.
  - **Degree of Integration Required**: How much integration is needed for consciousness? Some argue partial integration suffices, others require full global broadcasting.

  Now, conflicts between desiderata. The big one is **Pre-Access Richness vs. Architectural Compatibility**. GWT says consciousness requires global integration, but if rich P-consciousness exists before broadcasting, how does that fit? Theories like Partial Broadcasting might allow sub-global integration, but that risks diluting GWT. The user's "binding-before-broadcast" constraint directly challenges the necessity of global access for structured experience.

  Another conflict is **Functional Efficacy vs. Epiphenomenalism Avoidance**. If P-consciousness arises early but only affects behavior via broadcasting, it might seem epiphenomenal until accessed. Proponents need to show its causal role pre-access, possibly through local effects.

  The key desideratum causing trouble is **Pre-Access Richness**. It rules out strict GWTs that equate consciousness with broadcasting. Models like Dehaene's often see pre-broadcast states as unconscious precursors, but evidence of rich pre-access content challenges that. This forces modifications, such as allowing local consciousness or hybrid models.

  I should structure the response clearly: Non-negotiable constraints first, each with a justification. Then camp-specific preferences, highlighting where debates occur. Finally, conflicts, emphasizing the main tension between richness and global integration. The user wants American English, no citations, just conceptual specs. Need to be concise and precise, avoiding jargon where possible but maintaining academic rigor.
answer: |-
  Here is a structured specification of desiderata for theories reconciling phenomenal consciousness (PC), access consciousness (AC), and global broadcasting (GB), distinguishing non-negotiable constraints from camp-specific preferences. Desiderata are grouped thematically, with justifications grounded in empirical phenomena or conceptual necessities. Conflicts are explicitly addressed in Section IV.

  ---

  ### **I. Non-Negotiable Constraints**  
  *(Must be satisfied by any viable theory; failure invalidates the core integration project)*  

  1.  **Distinction Preservation (PC ≠ AC Gap)**  
      *   **Requirement:** The theory must account for the possibility of PC without concurrent AC.  
      *   **Motivation:** Empirical demonstrations (e.g., brief masked stimuli with identifiable content like facial expressions or object categories that subjects report *not* seeing, yet exhibit priming effects or forced-choice discrimination above chance) show structured phenomenal content can exist without being globally available for report, reasoning, or voluntary action. Conceptually, PC is defined as subjective experience ("what it's like"-ness), while AC is defined by cognitive availability; they are not co-extensive.  

  2.  **Pre-Access Richness (Binding-Before-Broadcast)**  
      *   **Requirement:** The theory must accommodate structured, bound phenomenal content (e.g., figure-ground segregation, categorical identity, simple emotional valence) that can arise prior to and independently of global broadcasting.  
      *   **Motivation:** Evidence from masked priming, attentional blink, and rapid serial visual presentation shows that briefly presented, unreportable stimuli can carry complex, feature-bound content (e.g., recognizing a face as fearful or an object as a tool). This requires local neural binding mechanisms (e.g., recurrent loops in sensory cortex) sufficient for rich PC without GB.  

  3.  **Functional Efficacy of PC**  
      *   **Requirement:** PC must have causal powers *within* the cognitive architecture, not merely being an epiphenomenal byproduct.  
      *   **Motivation:** If PC has no causal influence (e.g., on attention, memory formation, or eventual behavior), it becomes explanatorily irrelevant ("epiphenomenalism"). Phenomenological reports and indirect behavioral measures (e.g., priming) suggest PC *does* influence cognition, even when not globally accessed.  

  4.  **Architectural Compatibility with GB Core**  
      *   **Requirement:** The theory must retain the essential functional role of global broadcasting: enabling information integration across specialized modules and making content available for system-wide processes (executive control, working memory, report).  
      *   **Motivation:** GB architectures explain key capacities like cognitive flexibility, novel problem-solving, and reportability via broadcasting. Abandoning this undermines the empirical success of GB frameworks in explaining conscious *access*.  

  5.  **Neural Plausibility**  
      *   **Requirement:** Proposed mechanisms for PC and AC must be consistent with established neuroscience (e.g., localized recurrent processing for sensory binding, long-range cortico-thalamic loops for broadcast).  
      *   **Motivation:** Theories must respect neural evidence (e.g., ventral stream activation for unreportable face processing; fronto-parietal activation correlating with reportability).  

  ---

  ### **II. Camp-Specific Preferences**  
  *(Theoretical choices where camps legitimately diverge; not all must be satisfied, but a theory must commit coherently)*  

  6.  **Determinism of Workspace Entry**  
      *   **Requirement:** *Is entry into the global workspace deterministic given sufficient input strength and attentional resources?*  
      *   **Motivation:** Strict GW theorists (e.g., Dehaene) often assume determinism for stability/reliability of access. Opponents argue stochasticity better explains trial-to-trial variability in access (e.g., identical stimuli sometimes accessed/sometimes not).  

  7.  **Sufficiency of Local Recurrent Processing (LRP) for PC**  
      *   **Requirement:** *Can LRP (e.g., within sensory cortex) suffice for minimal PC, even without potential for global broadcast?*  
      *   **Motivation:** "Localists" (e.g., Lamme) argue yes, based on neural correlates of unreportable phenomenal states. "Globalists" (e.g., Baars, Dehaene) argue LRP is merely preconscious; broadcast is necessary for *any* PC to avoid fragmentary "islands" of consciousness.  

  8.  **Degree of Integration Required for PC**  
      *   **Requirement:** *Must PC involve *global* integration, or is *partial* (e.g., within a modality or subsystem) integration sufficient?*  
      *   **Motivation:** Globalists see unity of consciousness as requiring broad integration. Partial integrationists argue that local binding suffices for simple PC (e.g., a unified visual object), with global integration only adding access/cognitive depth.  

  ---

  ### **III. Critical Derivative Constraints**  
  *(Follow from non-negotiables but highlight operational challenges)*  

  9.  **Avoidance of PC-as-Unstable-Precursor**  
      *   **Requirement:** PC must not be reduced to a fleeting, functionally inert state that *only* matters if stabilized into AC.  
      *   **Motivation:** Follows from **Functional Efficacy (3)** and **Pre-Access Richness (2)**. If PC is rich and causal pre-access, it cannot be *merely* "unstable access."  

  10. **Gradualist Compatibility**  
      *   **Requirement:** The theory should accommodate gradations in both PC (e.g., vagueness, fringe states) and AC (e.g., partial reportability, degraded access).  
      *   **Motivation:** Empirical data shows conscious states vary in clarity, intensity, and reportability (e.g., near-threshold perception, degraded awareness in neglect). Binary "in/out" workspace models struggle here.  

  ---

  ### **IV. Key Conflicts & Critical Desiderata**  

  1.  **Core Tension: Pre-Access Richness vs. Architectural Compatibility**  
      *   **Conflict:** **Pre-Access Richness (2)** demands rich PC *without* GB, but **Architectural Compatibility (4)** requires GB for system-wide integration. Strict global workspace theories (equating PC with AC/GB) fail **Pre-Access Richness (2)**. Theories emphasizing local PC (satisfying **2**) risk violating **Architectural Compatibility (4)** if they downplay GB's necessity for *any* conscious unity.  
      *   **Resolution Strategies:** Hybrid models (e.g., GB enables *stable, reportable* AC, while local PC exists independently) or redefining GB as a gradual process ("partial broadcasting"). Both face challenges in defining the PC/AC relationship clearly.  

  2.  **The Most Exclusionary Desideratum**  
      *   **Pre-Access Richness (2)** does the heaviest lifting in ruling out prominent approaches:  
          *   It directly invalidates **strict identity theories** (PC = AC).  
          *   It challenges **standard GWT** (e.g., Dehaene's "consciousness = global ignition") by showing PC precedes and can exist without ignition.  
          *   It forces **functionalist theories** to explain how rich PC can be causally active (**Functional Efficacy 3**) without being accessed.  
      *   **Why?** Empirical evidence for binding-before-broadcast is robust and directly contradicts the claim that global availability is necessary for *any* structured phenomenology. This forces a choice: either revise GWT to allow local PC, or deny the data (empirically untenable).  

  3.  **Functional Efficacy vs. Epiphenomenalism Risk**  
      *   **Conflict:** If PC arises early (via LRP) but only influences cognition *through* later broadcasting (**Architectural Compatibility 4**), it risks being epiphenomenal *until* accessed, violating **Functional Efficacy (3)**.  
      *   **Resolution:** Theories must specify causal pathways for pre-access PC (e.g., rapid biasing of attention or action systems via subcortical routes).  

  ---

  ### **V. Summary of Joint Satisfiability**  
  *   **Satisfiable Set:** All **Non-Negotiable Constraints (1-5)** can be jointly satisfied *if* a theory allows:  
      *   Local mechanisms (e.g., sensory LRP) generating rich PC (**2**).  
      *   GB mechanisms enabling AC via broadcast (**4**).  
      *   Causal roles for PC both pre-access (e.g., guiding attention) and post-access (**3**).  
      *   A clear distinction between PC and AC (**1**).  
      *   Neural implementation respecting both local and global processes (**5**).  
  *   **Unavoidable Tension:** **Pre-Access Richness (2)** and **Architectural Compatibility (4)** pull in opposite directions, demanding careful theoretical balancing (e.g., gradations of access/unity). No existing theory resolves this seamlessly.  
  *   **Critical Failure Point:** Theories failing **Pre-Access Richness (2)** or **Distinction Preservation (1)** cannot account for empirical basics. Theories failing **Functional Efficacy (3)** render PC explanatorily inert.
