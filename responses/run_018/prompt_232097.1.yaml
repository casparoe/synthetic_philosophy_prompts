prompt: |-
  I'm teaching a small undergraduate ethics seminar on ideals of character, and in a few weeks we'll reach the question whether a person who is as morally good as possible — someone whose every choice and attachment is subordinated to moral requirements — is living a life we should admire or want. I'd like a handout I can distribute before the readings so the students encounter the puzzle nose-first rather than through an argument summary.

  Please write a deadpan parody of an application packet for the fictional Institute for Moral Optimization, which certifies ordinary people as bona fide Moral Saints. Use the bureaucratic, slightly menacing tone of a real admissions document: biographical fields, a mandatory inventory of the applicant's hobbies, friendships, and family attachments with a written justification for each, a self-reported log of non-moral activity for the previous quarter, character references, and a plan for reallocating whatever time, money, and attention the applicant currently spends on art, humor, idleness, and particularistic love. The target is the genuine position that maximal moral goodness is the correct organizing ideal of a whole life, and the jokes should come from actually understanding it: the recurring worry that a perfectly moral person would have to let wit, taste, play, and deep partial attachments atrophy; the contrast between the saint who does everything spontaneously out of love and the saint who acts grimly from duty; and the monstrousness that creeps in when an institution starts auditing the moral return on every hour of leisure. Stay deadpan — no winking — and let the form do the editorializing, but keep it legible enough that a struggling undergraduate could still see what is being skewered.

  Aim for roughly 700 words. It should be funny to someone who knows the philosophical literature on moral sainthood and readable to someone who has never heard of it. At the very end, in a separate author's note of no more than a paragraph, say how confident you are that the parody tracks the actual structure of the debate rather than a strawman, and identify the single point you are least sure of.
reasoning: |-
  Okay, the user is teaching an undergraduate ethics seminar on ideals of character and wants a handout that presents the puzzle of moral sainthood in an engaging way. They specifically requested a deadpan parody of an application packet for a fictional "Institute for Moral Optimization" that certifies Moral Saints. 

  The user has given very clear parameters: bureaucratic tone, specific sections (biographical fields, hobby justifications, non-moral activity log, etc.), and key philosophical tensions to highlight (spontaneous love vs grim duty, atrophy of non-moral pursuits). They want it to skewer the position that maximal moral goodness should organize one's entire life, without explicit editorializing. 

  Hmm, the challenge is balancing authenticity with readability. The parody must feel like real bureaucratic documents I've seen - those slightly threatening application forms where every field implies judgment. But it also needs to be decipherable by undergrads who may not know Susan Wolf's "Moral Saints" paper. 

  The user mentioned three core tensions to embed: 
  First, the sacrifice of non-moral goods (art/humor/idleness). That's easy to show through the "hobby justification" section where applicants must defend leisure activities. 
  Second, the spontaneous love vs grim duty dichotomy. Maybe illustrate this through reference letters - one praising "joyful service", another noting "rigorous scheduling". 
  Third, the institutional monstrosity of auditing every minute. The time-reallocation plan section will serve that well. 

  I should avoid cheap shots. The humor must come from taking the premise seriously - like requiring moral ROI calculations for time with friends. The "non-moral activity log" is perfect for this: forcing applicants to itemize minutes spent on "unoptimized" activities. 

  For structure: 
  - Cover page with ominous disclaimer sets tone 
  - Biographical section (standard but with moral-twist questions) 
  - Hobby/friendship justifications (main comedy payload) 
  - Activity log (absurd quantification) 
  - References (showcasing the love/duty tension) 
  - Reallocation plan (the chilling climax) 

  The author's note is crucial. I'll confirm this tracks Wolf/Nagel arguments accurately, but flag uncertainty about whether real saints experience inner conflict. Some philosophers claim unified consciousness is possible. 

  Word count is tight. Must compress bureaucratic verbosity while keeping it recognizable. Prioritize sections where the critique emerges organically - like the hobby justifications revealing how partial attachments become suspect. 

  Final check: Is this equally legible to phil majors and newbies? Added labels like "non-derivative value" but kept examples concrete (grandma, jazz records). The menace is in the questions themselves - no need for exaggeration.
answer: |-
  ## INSTITUTE FOR MORAL OPTIMIZATION  
  APPLICATION FOR SAINTHOOD CERTIFICATION (FORM IMO-SC7.3)  
  *"Maximizing the Good, Minimizing the Self"*

  **SECTION 1: APPLICANT BIODATA**
  *   Full Legal Name: _________________________________________________
  *   Current Moral Worth (Est. $USD equiv. of lifetime charitable giving potential): $_________
  *   Primary Moral Constituency Served (e.g., "The Global Poor," "Sentient Non-Humans," "Future Generations"): _______________________________
  *   % of Waking Hours Currently Devoted to Direct Moral Action (Derivative activities, e.g., sleep for efficiency, count at 50%): ______%
  *   Describe your core moral motivation (Check one): ☐ Pure Duty ☐ Universal Love ☐ Utilitarian Calculation ☐ Other (Specify: ______________)

  **SECTION 2: ATTACHMENT & ACTIVITY INVENTORY**
  *List all significant hobbies, friendships, family relationships, and leisure pursuits. For EACH, provide:*
      A. **Description:** (e.g., "Playing jazz piano," "Friendship with Priya Sharma," "Weekly calls with elderly mother," "Reading 19th-century novels," "Birdwatching")
      B. **Average Weekly Time/Money/Attention Allocation:** (Hours:____ / $:____ / Attention Units*:____ ) *[1 AU = Sustained focus equivalent to reviewing a complex charitable tax filing]*
      C. **Moral Justification:** *Explain the direct, non-derivative moral value generated by this attachment or activity. Cite demonstrable outcomes. Do NOT cite personal satisfaction, skill development unrelated to core moral aims, or "inherent value" without proof of moral optimization.*

      *(Example: "Birdwatching: Provides data for local conservation NGO (attached log sheets); 1hr/week contributes approx. 0.02% to regional species protection index. Justification: Weak but acceptable pending reallocation plan below.")*

      **Attachment/Activity 1:**
          A: ___________________________________________________________
          B: Time:____ $:____ AU:____
          C: ________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________

      *(Attach additional sheets as necessary. Incomplete justifications may delay processing.)*

  **SECTION 3: NON-MORAL ACTIVITY LOG (PREVIOUS QUARTER)**
  *Disclose all activities exceeding 15 cumulative minutes per week undertaken primarily for non-moral reasons (e.g., amusement, aesthetic appreciation unrelated to fundraising, unstructured socializing, personal grooming beyond hygiene minimums). Include: Date, Duration, Activity Description, and Reason for Failure to Optimize.*

      *(Example: "2023-10-15; 45min; Watched comedy film 'Space Jesters'; Reason: Temporary lapse in vigilance due to fatigue; Optimization Failure: Moderate.")*

      **Activity 1:**
          Date: ________ Duration: ________ Activity: _________________________________
          Reason for Failure: ________________________________________________________________

      *(Attach additional sheets. Omissions constitute falsification and invalidate application.)*

  **SECTION 4: CHARACTER REFERENCES**
  *Provide three references from individuals certified at IMO Level 2 (Moral Agent) or higher. References must address:*
  1.  The *consistent* prioritization of moral demands over personal desires in the applicant's observable conduct.
  2.  The applicant's capacity for *spontaneous moral action* vs. reliance on *calculated duty* (Specify ratio if possible).
  3.  Any observed instances of the applicant deriving *non-moral pleasure* from an activity without immediate, verifiable moral utility.
  4.  The applicant's perceived *emotional resilience* when sacrificing personal attachments for greater good.

  **REFERENCE 1:** Name: ___________________ IMO Level: _____ Contact: ______________  
