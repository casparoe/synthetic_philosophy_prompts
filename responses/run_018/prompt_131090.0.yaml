  We are creating a joint statement for an adversarial collaboration between two camps in a graduate seminar on Du Bois. The impasse centers on interpreting Du Bois's 1926 address "Criteria of Negro Art" and his broader views on art and propaganda. We are to format this as:

  1. A numbered section of agreed claims about Du Bois's published texts and historical context (without bibliographies or citations).
  2. A table of disagreements, with each camp's formulation of the residual disagreement in wording they would accept.
  3. A list of cruxes (sub-questions that, if settled, would move at least one side). For each crux, we provide a concrete case or argument both sides agree bears on it, and each camp's prediction.

  Conceptual distinctions to consider:
  - Instrumentalist reading vs. autonomy-based reading.
  - Whether "all art is propaganda" is descriptive sociology, a normative mandate, or a hybrid.
  - Distinction between propaganda-as-strategic-message and propaganda-as-truth-telling-through-beauty.
  - Niche distinction: propaganda of the fact (truth-telling) vs. propaganda of the thesis (strategic messaging).

  We stick to Du Bois's major published works and the 1926 address. We do not ask for reading lists or obscure sources.

  ---

  **Joint Statement: Agreed Claims**

  1. **Historical Context**: Du Bois delivered "Criteria of Negro Art" in 1926 during the Harlem Renaissance, a period of flourishing African American arts and intense debate about the role of art in racial politics.

  2. **Du Bois's Stated Position**: In the address, Du Bois explicitly states: "All Art is propaganda and ever must be, despite the wailing of the purists." He argues that art cannot be separated from social and political contexts.

  3. **The Dual Function of Art**: Du Bois consistently argues that art has a dual role: it must be beautiful and true. He states that the "great mission" of the Negro is to set beauty before the world in a way that also reveals the truth about Black life and struggles.

  4. **Art as a Weapon**: Du Bois frames art as a weapon in the struggle for racial equality and against white supremacy. He argues that the Black artist has a duty to use their art to combat racism and uplift the race.

  5. **Beauty and Truth**: Du Bois insists that art must not sacrifice beauty for propaganda. He writes: "I do not care a damn for any art that is not used for propaganda. But I do care when propaganda is confined to one side while the other is stripped and silent." This suggests that he sees beauty and truth as intertwined.

  6. **The Problem of White Supremacy**: Du Bois contends that the dominant art world, controlled by white gatekeepers, promotes art that silences Black perspectives and distorts the truth about Black life. Therefore, Black art must counter this by telling the truth through beauty.

  7. **Du Bois's Literary Practice**: Du Bois's own creative works (e.g., his novel *The Quest of the Silver Fleece*, his poetry, and his essays) often blend aesthetic form with explicit political and social commentary. His fiction aims to depict the complexities of Black life, including its beauty and its struggles.

  8. **The Goal of Racial Uplift**: Du Bois's broader project, including his work with the NAACP and his editorship of *The Crisis*, emphasizes the importance of cultural production for racial uplift and the advancement of civil rights.

  9. **The Audience for Art**: Du Bois addresses both Black and white audiences. He argues that Black art must speak to Black people for affirmation and to white people to challenge stereotypes and promote understanding.

  10. **Complexity in Du Bois's View**: Du Bois acknowledges that art can have multiple layers and that great art often transcends immediate political goals. However, he insists that art is never neutral and always serves some social function.

  ---

  **Table of Residual Disagreements**

  | Camp One (Instrumentalist) Formulation                                                                 | Camp Two (Autonomy-within-Commitment) Formulation                                                                 |
  |--------------------------------------------------------------------------------------------------------|-------------------------------------------------------------------------------------------------------------------|
  | Du Bois's 1926 address prescribes that Black artists have a duty to create art that serves the political struggle for racial justice, with aesthetic choices subordinate to the goal of effective propaganda. | Du Bois's 1926 address describes the inevitable social function of art as propaganda, but his own work and the address itself demonstrate that art's truth-telling through beauty requires autonomy in aesthetic creation, which may serve the struggle without being reduced to messaging. |
  | The "propaganda" Du Bois advocates is primarily strategic messaging aimed at racial uplift and liberation, and thus the value of art is measured by its efficacy in advancing these goals. | The "propaganda" Du Bois endorses is primarily truth-telling through beauty (propaganda of the fact), which reveals the complexities of Black life and thus cannot be reduced to strategic messaging (propaganda of the thesis). |
  | Du Bois's literary work should be judged by its contribution to the struggle, and his fiction and poetry are intentional instruments of propaganda. | Du Bois's literary work, while politically engaged, demonstrates a complexity that transcends instrumental aims and thus shows that art's value lies in its autonomous aesthetic truth-telling. |

  ---

  **Cruxes**

  1. **Crux: How does Du Bois define "propaganda" in the 1926 address?**
     - **Concrete Case/Argument**: Both camps agree that Du Bois's statement "all art is propaganda" must be interpreted in the context of the entire address and his other works. They also agree that he distinguishes between art that promotes white supremacy and art that tells the truth about Black life.
     - **Camp One Prediction**: Du Bois uses "propaganda" to mean strategic messaging for liberation, and thus he prescribes that Black art must be such messaging. (Instrumentalist)
     - **Camp Two Prediction**: Du Bois uses "propaganda" to describe art's inevitable social function, which for Black art means truth-telling through beauty (propaganda of the fact), not necessarily strategic messaging (propaganda of the thesis). (Autonomy)

  2. **Crux: Is the dual emphasis on beauty and truth in art an instrumental requirement or an intrinsic one?**
     - **Concrete Case/Argument**: Both camps agree that Du Bois insists on the inseparability of beauty and truth. The case to consider is his critique of art that is beautiful but false (e.g., art that perpetuates stereotypes) and art that is true but ugly (which he rejects).
     - **Camp One Prediction**: Beauty is necessary only because it makes the truth more effective as propaganda; thus, it is instrumentally required. (Instrumentalist)
     - **Camp Two Prediction**: Beauty is intrinsically tied to truth in art, and without it, the truth is distorted; thus, the aesthetic dimension is autonomous and necessary for genuine truth-telling. (Autonomy)

  3. **Crux: Does Du Bois's own creative work exemplify instrumental propaganda or autonomous truth-telling?**
     - **Concrete Case/Argument**: Both camps agree to examine Du Bois's novel *The Quest of the Silver Fleece* (1911) and his poetry (e.g., in *Darkwater*). They also agree that these works are politically engaged but also rich in aesthetic and symbolic complexity.
     - **Camp One Prediction**: The novel and poetry are structured to advance specific political messages about racial uplift and thus are instruments of propaganda. (Instrumentalist)
     - **Camp Two Prediction**: The novel and poetry use aesthetic complexity to reveal truths about Black life that go beyond simple messaging, demonstrating autonomy within commitment. (Autonomy)

  4. **Crux: Is the 1926 address a normative mandate or a descriptive sociology?**
     - **Concrete Case/Argument**: Both camps agree that the address is a response to the historical context of the Harlem Renaissance and debates about art. They also agree that Du Bois uses prescriptive language (e.g., "must", "duty").
     - **Camp One Prediction**: The address is primarily a normative mandate for Black artists to create art that serves the struggle. (Instrumentalist)
     - **Camp Two Prediction**: The address describes the social reality that all art is propaganda, but the normative element is about truth-telling through beauty, not reducing art to a tool. (Autonomy)

  5. **Crux: How does the distinction between "propaganda of the fact" and "propaganda of the thesis" clarify Du Bois's position?**
     - **Concrete Case/Argument**: Both camps agree that Du Bois criticizes art that promotes white supremacy (propaganda of the thesis) and praises art that tells the truth (propaganda of the fact). The case is his discussion of how white art distorts reality and how Black art should counter it.
     - **Camp One Prediction**: Du Bois advocates for propaganda of the thesis for the Black artist, as long as it is for liberation, because the goal is to win the battle of public opinion. (Instrumentalist)
     - **Camp Two Prediction**: Du Bois advocates for propaganda of the fact, which is truth-telling through beauty, and this is incompatible with reducing art to a thesis; it requires the autonomy of the artist to reveal complex truths. (Autonomy)

  By settling these cruxes through textual analysis and historical context, the seminar can move beyond the impasse. Each camp's predictions are recorded, and the outcome of examining the concrete cases may lead one or both sides to adjust their positions.
