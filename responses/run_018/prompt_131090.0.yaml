  ### Joint Statement: Adversarial Collaboration on Du Bois's "Criteria of Negro Art" (1926)  
  *Authored by Camp One (Instrumentalist) and Camp Two (Autonomy-within-Commitment)*  

  #### Section 1: Agreed Claims  
  1. **Historical Context**: Du Bois delivered "Criteria of Negro Art" during the Harlem Renaissance, amid debates about whether Black art should prioritize racial uplift or aesthetic experimentation. His address responds to white gatekeeping in art institutions and internal Black intellectual disputes.  
  2. **Core Assertion**: Du Bois explicitly states, "All Art is propaganda and ever must be." This positions art as inseparable from social and political functions, rejecting "art for art's sake" as a luxury inaccessible to oppressed groups.  
  3. **Dual Demands**: Art must be both "Beautiful" and "True." Beauty is not ornamental but integral to truth-telling; conversely, truth without beauty fails as art.  
  4. **Anti-Racist Imperative**: Du Bois condemns art that reinforces white supremacy (e.g., racist caricatures) and demands art that counters "the stripped and silent" reality of Black life under oppression.  
  5. **Artist’s Social Duty**: Black artists bear responsibility to advance racial justice. Art is a "weapon" in the struggle for equality, not a neutral or detached pursuit.  
  6. **Audience Awareness**: Art addresses multiple audiences: it affirms Black dignity for Black viewers and challenges white audiences to confront injustice.  
  7. **Du Bois’s Literary Practice**: His fiction (e.g., *The Quest of the Silver Fleece*) and poetry (e.g., in *Darkwater*) intertwine aesthetic form with explicit political themes, rejecting apolitical abstraction.  
  8. **Rejection of Stereotypes**: Propaganda, for Du Bois, excludes simplistic or degrading portrayals; it requires nuanced representations of Black humanity.  
  9. **Truth as Foundation**: Both camps agree Du Bois prioritizes truth-telling ("propaganda of the fact") over reductive messaging ("propaganda of the thesis"). Art must reveal the complex realities of Black life.  
  10. **Hybrid Intent**: The 1926 address blends description (art inevitably functions as propaganda) and prescription (artists must harness this function for liberation).  

  ---

  #### Section 2: Table of Residual Disagreements  
  | Camp One (Instrumentalist) Formulation | Camp Two (Autonomy-within-Commitment) Formulation |  
  |----------------------------------------|---------------------------------------------------|  
  | Du Bois issues a normative mandate: Black art *must* subordinate aesthetic choices to political efficacy, with "propaganda" defined as strategic messaging for liberation. | Du Bois describes an inescapable social reality: all art *functions* as propaganda, but this does not reduce art to a tool; it elevates truth-telling through beauty as an autonomous act. |  
  | Aesthetic value is derived from utility: art succeeds if it mobilizes audiences toward racial uplift, and Du Bois’s creative work (e.g., *The Quest of the Silver Fleece*) should be judged by its persuasive impact. | Aesthetic value arises from art’s intrinsic capacity to reveal truth; Du Bois’s creative work demonstrates complexity exceeding instrumental aims, proving beauty and truth are inseparable. |  
  | The 1926 address prescribes "propaganda" as thesis-driven messaging (e.g., explicit anti-lynching themes), where beauty serves to amplify strategic political content. | The 1926 address endorses "propaganda" as fact-driven revelation (e.g., depicting Black joy/suffering authentically), where beauty enables truth beyond didacticism. |  

  ---

  #### Section 3: Cruxes  
  *Cruxes are sub-questions that, if resolved, would shift one or both camps. Each crux includes a shared case/argument and opposing predictions.*  

  1. **Crux: Does Du Bois’s "all art is propaganda" prioritize efficacy or authenticity?**  
     - **Shared Case**: Analysis of Du Bois’s critique in the 1926 address of Claude McKay’s *Home to Harlem*. Du Bois called it "filth" but praised its authenticity.  
     - **Camp One Prediction**: Du Bois condemns McKay for failing efficacy (reinforcing stereotypes), proving art must optimize messaging for uplift.  
     - **Camp Two Prediction**: Du Bois critiques McKay for distorting truth, not efficacy; art must preserve authenticity even if politically inconvenient.  

  2. **Crux: Is beauty instrumental or constitutive in truth-telling?**  
     - **Shared Case**: Du Bois’s poem "The Song of the Smoke" (*Darkwater*), which marries lyrical beauty with themes of Black resilience.  
     - **Camp One Prediction**: The poem’s beauty serves to make its liberation thesis more persuasive, prioritizing rhetorical impact.  
     - **Camp Two Prediction**: The poem’s beauty is constitutive of its truth; the form *is* the content, transcending mere messaging.  

  3. **Crux: Does Du Bois’s fiction exemplify propaganda-as-thesis or propaganda-as-fact?**  
     - **Shared Case**: *The Quest of the Silver Fleece* (1911), where agrarian labor symbolizes Black economic liberation.  
     - **Camp One Prediction**: The novel is thesis-driven propaganda; symbolism is deployed strategically to advocate for cooperative economics.  
     - **Camp Two Prediction**: The novel is fact-driven; its symbolism reveals systemic truths about race/class, not reducible to a thesis.  

  4. **Crux: Is the artist’s duty to the struggle or to the truth?**  
     - **Shared Case**: Du Bois’s demand that art show Black people "as they are" (1926 address).  
     - **Camp One Prediction**: "As they are" means portraying idealized potential to mobilize for uplift (duty to the struggle).  
     - **Camp Two Prediction**: "As they are" means depicting unvarnished complexity, even when uncomfortable (duty to truth).  

  5. **Crux: Does "propaganda of the fact" allow artistic autonomy?**  
     - **Shared Case**: Du Bois’s praise for spirituals as "sorrow songs" that convey truth through aesthetic form (e.g., *The Souls of Black Folk*).  
     - **Camp One Prediction**: Spirituals are effective because their beauty delivers a strategic message: Black humanity amid suffering.  
     - **Camp Two Prediction**: Spirituals prove truth emerges autonomously through beauty; their power lies beyond instrumental aims.  

  ---  
  **Conclusion**: This document identifies 10 points of consensus, 3 irreducible disagreements, and 5 testable cruxes. Progress requires revisiting Du Bois’s texts to resolve the cruxes, particularly examining how "propaganda of the fact" operates in his creative vs. polemical works. Both camps commit to using this framework to break the impasse.
