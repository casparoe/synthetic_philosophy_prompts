prompt: |-
  so i just got out of this exhausting two-hour argument with my roommate about whether our city should scrap this bizarre old zoning ordinance that nobody can explain. he kept falling back on that Chesterton fence thing — like, dont tear down a fence if you dont know why it was built — and insisted it applies to any law or custom thats been around long enough. i think hes using a cute proverb to smuggle in a whole Burkean worldview, but i cant tell where the actual argument starts and the platitude ends. can you lay out the different precise claims that slogan could actually be making? i want them sorted out as a menu: the trivial "look before you leap" version, the epistemic version about tacit knowledge embedded in institutions, the conservative metaphysical version that old things have some kind of right to stay, and any others that sit in between. for each one, say whether its actually defensible, whether it needs Burkean premises to work, and whether it actually gets him to "leave the zoning law alone" — especially since in this case the people who built the fence are dead and left no notes. please be casual about confidence: tell me how sure you are that these are the right readings, and single out the specific point youre least certain about, maybe whether Chestertons original point was epistemic or something stronger about social continuity. and ya, if you can flag which reading is just status-quo bias dressed up in wisdom-language, thatd help me for round two with him.
