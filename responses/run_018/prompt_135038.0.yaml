  ### Analysis of UDT and EDT in the Contrived Case

  The scenario involves an agent in one of two causally isolated simulations, with self-locating uncertainty:
  - **Simulation A**: One-shot prisoner's dilemma (PD) against an exact copy (identical source code).
  - **Simulation B**: One-shot stag hunt (SH) against a copy with a modified parameter that alters how it weights logical correlations vs. causal isolation.

  The agent knows the architecture (i.e., the setup of both simulations) but not which simulation it occupies. Actions are abstractly labeled (e.g., Action 1 and Action 2), with payoffs defined by the simulation:
  - In PD, Action 1 = Cooperate (C), Action 2 = Defect (D). Payoffs: Mutual C → \(R\), Mutual D → \(P\), C vs. D → \(S\) (sucker) for cooperator, \(T\) (temptation) for defector, with \(T > R > P > S\).
  - In SH, Action 1 = Hunt Stag (H), Action 2 = Hunt Hare (h). Payoffs: Mutual H → \(R_s\) (high), H vs. h → 0 for stag hunter, \(M\) for hare hunter; Mutual h → \(M\) for both, with \(R_s > M\).

  The opponent in B has a modified parameter affecting its response to logical correlations. The agent’s core algorithm is identical in both simulations, but the correlation structure differs. Below, we compare UDT and EDT.

  ---

  ### **1. Updateless Decision Theory (UDT)**
  UDT selects the action that maximizes expected utility (EU) across all possible worlds without conditioning on the agent’s actual choice. It treats the agent’s algorithm as a mathematical object and evaluates outcomes based on logical dependencies.

  #### **Recommendation in Both Simulations:**
  - UDT **recommends the same action in both simulations** (Action 1 or Action 2) because:
    - The agent has self-locating uncertainty and must choose a single action without knowing the simulation.
    - UDT computes EU by averaging over both simulations, using a fixed prior (e.g., 50% probability for each).
    - The logical identity (exact copy in A) is overridden in B by the parameter shift, but UDT handles this by modeling the opponent in B as having **uncertain logical dependency** (not full correlation).

  #### **How UDT Handles the Parameter Shift in B:**
  - In **Simulation A**, the opponent is an exact copy → full logical correlation. UDT predicts:
    - If agent chooses C (Action 1), opponent also chooses C → payoff \(R\).
    - If agent chooses D (Action 2), opponent also chooses D → payoff \(P\).
  - In **Simulation B**, the opponent’s modified parameter breaks full logical correlation. UDT:
    - Uses a **prior distribution** for the opponent’s action (e.g., \(P(\text{opponent} = \text{H}) = q\)).
    - Does not update this prior based on the agent’s choice (updateless).
    - EU for Action 1 (H): \( \text{EU}_B(\text{H}) = q \cdot R_s \).
    - EU for Action 2 (h): \( \text{EU}_B(\text{h}) = M \).

  #### **Overall EU for UDT:**
  - For Action 1:  
    \[
    \text{EU}_{\text{UDT}}(\text{Action 1}) = \frac{1}{2} R + \frac{1}{2} (q \cdot R_s)
    \]
  - For Action 2:  
    \[
    \text{EU}_{\text{UDT}}(\text{Action 2}) = \frac{1}{2} P + \frac{1}{2} M
    \]
  - UDT chooses Action 1 if \(\frac{1}{2} R + \frac{1}{2} (q \cdot R_s) > \frac{1}{2} P + \frac{1}{2} M\).

  #### **Key Insight:**
  - The parameter shift in B **alters the logical dependency** UDT tracks. UDT no longer assumes full correlation and instead uses a fixed prior (\(q\)) for the opponent in B. This prior reflects uncertainty about the modified algorithm but **does not condition on the agent’s action**.

  ---

  ### **2. Evidential Decision Theory (EDT)**
  EDT selects the action that maximizes EU conditioned on the action as evidence. It updates beliefs about the world (including the opponent’s behavior) based on the hypothetical choice.

  #### **Recommendation in Both Simulations:**
  - EDT also **recommends the same action in both simulations** due to self-locating uncertainty. However, it computes EU differently by conditioning on the action.

  #### **How EDT Handles the Simulations:**
  - **Self-locating uncertainty**: Conditioning on the action does not update the belief about which simulation the agent is in because the agent’s algorithm is identical in both → prior remains 50/50.
  - **Simulation A** (PD):
    - Conditioning on C (Action 1): Opponent also chooses C (exact copy) → payoff \(R\).
    - Conditioning on D (Action 2): Opponent also chooses D → payoff \(P\).
  - **Simulation B** (SH):
    - The modified opponent introduces **evidential links** via the shared parameter (\(\theta\)) influencing logical correlations.
    - Define:
      - \(\theta\): Probability the opponent is perfectly correlated (due to parameter).
      - \(1 - \theta\): Probability the opponent is independent (chooses H with probability \(q\)).
    - Conditioning on Action 1 (H):
      - Evidence updates belief about \(\theta\) → opponent chooses H with probability \(\theta + (1 - \theta)q\).
      - \(\text{EU}_B(\text{H}) = [\theta + (1 - \theta)q] \cdot R_s\).
    - Conditioning on Action 2 (h):  
      \(\text{EU}_B(\text{h}) = M\) (no dependency).

  #### **Overall EU for EDT:**
  - For Action 1:  
    \[
    \text{EU}_{\text{EDT}}(\text{Action 1}) = \frac{1}{2} R + \frac{1}{2} \left( [\theta + (1 - \theta)q] \cdot R_s \right)
    \]
  - For Action 2:  
    \[
    \text{EU}_{\text{EDT}}(\text{Action 2}) = \frac{1}{2} P + \frac{1}{2} M
    \]
  - EDT chooses Action 1 if \(\frac{1}{2} R + \frac{1}{2} ([\theta + (1 - \theta)q] \cdot R_s) > \frac{1}{2} P + \frac{1}{2} M\).

  #### **Key Insight:**
  - EDT **avoids UDT’s rigidity** by generating **evidential links**:
    - Conditioning on Action 1 in B updates beliefs about \(\theta\) (since the agent’s choice is evidence about the shared parameter).
    - This leads to higher EU for Action 1 in B if \(\theta > 0\), as \([\theta + (1 - \theta)q] \geq q\).
  - However, **no spurious links between A and B**: The evidence only affects beliefs about the opponent *within* each simulation (e.g., \(\theta\) is specific to B). The simulations remain causally isolated.

  ---

  ### **3. Comparison and Coherence**
  #### **Handling Logical Correlation vs. Causal Isolation:**
  - **UDT**:
    - **Strengths**: Rigorously handles logical correlations (e.g., exact copy in A) by treating the algorithm as a mathematical object.
    - **Weaknesses**: Fails to leverage evidential updates in B. The fixed prior (\(q\)) ignores that the agent’s choice is evidence about \(\theta\), leading to potential underconfidence in correlation.
  - **EDT**:
    - **Strengths**: Naturally incorporates evidence about \(\theta\) in B, better adapting to uncertain logical dependencies.
    - **Weaknesses**: Vulnerable to spurious correlations in general, but **not here**—no link between A and B is created, as evidence is simulation-specific.

  **EDT handles the separation more coherently** in this case:
  - In B, the parameter-driven correlation is evidential, not logical. EDT’s conditioning correctly updates beliefs about \(\theta\).
  - UDT’s updatelessness underutilizes available information (the agent’s action as evidence), making it less responsive to the parameter shift.

  #### **Role of Self-Locating Uncertainty:**
  - **Both theories** depend on self-locating uncertainty:
    - EU averages over simulations (50/50 prior).
    - The chosen action is identical in both simulations.
  - **Difference**:
    - UDT’s recommendation for B relies on an **unconditional prior** (\(q\)) for the opponent.
    - EDT’s recommendation for B relies on a **conditional prior** (updated by the action).
  - Self-locating uncertainty amplifies the distinction: EDT’s evidential update in B significantly affects the joint EU, while UDT’s fixed prior may lead to suboptimal choices if \(\theta > 0\).

  ---

  ### **Conclusion**
  - **UDT** recommends the same action in both simulations, treating the opponent in B with uncertain correlation (fixed prior \(q\)). The parameter shift alters logical dependency, but UDT does not adapt to it.
  - **EDT** also recommends the same action but uses the agent’s choice as evidence to update beliefs about the parameter (\(\theta\)) in B, avoiding spurious links between simulations.
  - **EDT is more coherent** for this separation: It correctly leverages evidential links *within* B (due to the shared parameter), while UDT’s rigidity ignores useful information. Self-locating uncertainty ensures both theories output one action, but EDT’s flexibility in B provides a better model of the correlation structure.
