answer: |-
  Here’s an analysis applying David Lewis’s convention theory to *Lord of the Flies*, respecting both the novel’s complexity and the contested nuances of Lewis’s framework. I’ll address your core questions systematically, distinguishing settled from debated aspects of Lewisian convention.

  ---

  ### **I. Core Conditions of Lewisian Convention (Settled Framework)**
  Lewis defines a convention as:
  1.  **Arbitrary Regularity:** A pattern of behavior that solves a coordination problem but could be replaced by another (e.g., driving on left/right).
  2.  **Common Interest:** All parties prefer coordination over chaos.
  3.  **Mutual Expectations & Conditional Preference:** Each conforms because they expect others to conform, and prefers to conform *if* others do.
  4.  **Common Knowledge:** Everyone knows the expectations, knows others know, ad infinitum.

  Critics challenge Lewis’s emphasis on arbitrariness and the strictness of common knowledge, suggesting norms can emerge via focal points (Schelling) or repeated interaction without full common knowledge.

  ---

  ### **II. Applying Lewis to Key Elements in *Lord of the Flies***

  **1. The Conch Shell: A Failed Lewisian Convention?**
  *   **Coordination Problem Solved:** Establishes turn-taking in assembly, preventing chaos.
  *   **Arbitrariness (Contested):** The conch is *functional* (loudest object), not strictly arbitrary. Lewisians might argue other objects *could* work (e.g., a stick), making it arbitrary *among functional options*. Critics would say its salience makes it a focal point, not a pure convention.
  *   **Common Interest & Conditional Preference:** Initially, all boys prefer orderly speech (Piggy: "We can use this to call the others..."). Ralph/Piggy prefer conformity *if* others comply.
  *   **Common Knowledge Fracture:** Critical failure. Jack’s faction rejects the conch’s authority ("Conch! Conch! We don’t need the conch anymore!"). Common knowledge collapses – Jack’s group no longer expects conformity, nor believes Ralph’s group expects it. Piggy’s insistence ("I got the conch!") tragically assumes intact common knowledge.
  *   **Lewisian Verdict:** Starts as a nascent convention but fails due to **eroded common interest** (Jack values dominance over order) and **shattered common knowledge**. Its functional utility doesn’t save it.

  **2. Signal Fire Rules: Erosion of Common Interest**
  *   **Coordination Problem Solved:** Ensures rescue is prioritized collectively.
  *   **Arbitrariness:** The fire’s location/hours are arbitrary – it could be maintained differently.
  *   **Initial Mutual Expectations:** Early on, all agree on its importance ("How can we be rescued except by luck, if we don’t keep a fire going?").
  *   **Collapse Mechanism:** Jack’s hunters prioritize hunting (immediate meat/reward) over fire-keeping (abstract rescue). **Common interest fractures:** Jack’s group no longer shares the preference for rescue-coordination over hunting. Ralph’s conditional preference ("I’ll tend the fire if others do") becomes unsustainable.
  *   **Lewisian Verdict:** A convention requiring sustained common interest. It fails not primarily due to epistemic breakdown, but because **coordination on "rescue" ceases to be a shared priority** for a faction. This highlights a limitation in Lewis: conventions crumble if underlying interests diverge, even with intact common knowledge *about the rule itself*.

  **3. Assembly Protocols: Democracy vs. Dominance**
  *   **Coordination Problem:** Group decision-making without violence.
  *   **Arbitrariness:** Rules (raise hand, conch-speaker) are arbitrary procedures.
  *   **Common Knowledge & Expectations:** Initially strong ("We’ll have rules! ... Lots of rules!"). Fractures as Jack interrupts, mocks Piggy, and physically intimidates.
  *   **Drivers of Collapse:** Not failed coordination, but **competing values**. Jack rejects the convention not because it doesn’t coordinate, but because he prefers *unilateral authority* ("Bollocks to the rules!"). Fear (beast) and desire for dominance override coordination preferences.
  *   **Lewisian Verdict:** Assembly rules meet Lewis’s criteria early on. Their failure illustrates how conventions **depend on a baseline of shared values/trust**. When fear or the desire for power outweigh the preference for peaceful coordination, conventions become vulnerable regardless of their epistemic status.

  ---

  ### **III. Evolution of Norms: Democratic to Savage Rituals**
  *   **Initial "British" Conventions:** Conch, assemblies, fire rules mirror British school structures. They are culturally specific solutions to coordination problems (order, rescue).
  *   **Collapse Reason:** Golding suggests these norms *are* cultural artifacts requiring external enforcement (adult authority). Remove that, and the *underlying human drives* (fear, aggression, desire for dominance) overwhelm them. This critiques Lewis by showing conventions aren’t self-sustaining without shared values/authority.
  *   **New "Savage" Norms:** Hunting rituals, chants ("Kill the pig!"), face paint, and the Lord of the Flies cult emerge. These solve *different* coordination problems:
      *   **Coordination Problem:** Building group cohesion for hunting/war, managing fear through shared ritual.
      *   **Arbitrariness?** Face paint/chants are arbitrary signifiers of group identity.
      *   **Common Interest:** Jack’s group shares an interest in hunting success and fear suppression.
      *   **Common Knowledge/Mutual Expectation:** Strong within the tribe – all expect others to chant, hunt, obey Jack.
      *   **Lewisian Verdict:** These *are* conventions by Lewis’s definition. They solve new coordination problems (intra-tribe cohesion, inter-tribe conflict) born from the island’s reality. This shows conventions aren’t inherently "civilized" – they can coordinate brutality.

  ---

  ### **IV. What the Novel Contributes to Philosophical Debates**
  *   **Beyond Rational Coordination:** Golding dramatizes how **fear, aggression, and the desire for dominance** can *override* or *reshape* coordination preferences. Lewis’s model assumes stable, rational preferences for coordination. The novel shows preferences are fluid and driven by primal urges, leading to convention collapse or perverse new norms.
  *   **The Role of Violence:** Conventions aren’t just cognitively undermined (lost common knowledge); they are **violently destroyed** (Piggy’s death, conch smashed). Philosophy often abstracts from physical force; the novel forces confrontation with it.
  *   **Authority vs. Arbitrariness:** The conch’s power relies on perceived legitimacy, not just arbitrariness. When its authority (linked to Ralph/Piggy) is challenged, its conventional power vanishes. This supports critics who argue norms need salience/focal points beyond pure arbitrariness.
  *   **Epistemology of Breakdown:** The novel depicts the **psychological unraveling** of common knowledge – not just as a logical state, but as a fragile web of trust and shared reality eroded by fear and lies (e.g., denial of Simon’s murder). Literature shows the *embodied experience* of epistemic collapse.

  ---

  ### **V. Where the Novel Resists a Lewisian Reading**
  *   **Simon’s Murder & Piggy’s Death:** These are not coordination failures. They are eruptions of mass hysteria (Simon) and calculated violence (Piggy). Lewisian theory explains rule-*following*, not rule-*shattering* violence driven by irrational fear or tyranny.
  *   **The Lord of the Flies:** Simon’s vision represents innate human evil/savagery – a force *antithetical* to social coordination. Lewis deals with *solutions* to social problems; Golding explores the *problem* itself.
  *   **Jack’s Motivations:** His rejection of rules stems from a **positive desire for dominance and cruelty**, not a preference for a different coordination equilibrium. This is non-Lewisian.

  ---

  ### **Conclusion: Golding & Lewis in Dialogue**
  *   **Lewis Illuminates:** How initial order emerges via conventions solving coordination problems (speech, rescue, decision-making), and how their collapse stems from fractured common interest/knowledge (Jack’s defection).
  *   **Golding Complicates:** Shows conventions are culturally specific and fragile; their sustainability depends on shared values and the absence of overwhelming fear/aggression. New, savage conventions *do* form, proving coordination isn’t inherently "good."
  *   **Philosophical Contribution:** *Lord of the Flies* demonstrates that **conventions cannot be understood solely through rational choice.** They exist in a battlefield of human drives (fear, power, cruelty) that can destroy existing norms or create terrifying new ones. Lewis’s framework explains the mechanics of convention, but Golding exposes its precariousness in the face of human nature. This supports critics who argue norms require more than mutual expectation – they need psychological and moral underpinnings easily shattered.

  This analysis uses Lewis’s strict criteria to reveal why the boys’ initial order fails, while acknowledging Golding’s deeper exploration of forces beyond coordination – forces that challenge philosophy’s rationalist assumptions.
