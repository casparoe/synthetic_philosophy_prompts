  Key issues the user wants addressed:
  - Degeneracy of genetic code undermining isomorphism (non-bijective mapping)
  - Confusion between Gödel sentences vs. quines (where's negation/provability analogue?)
  - Interpreter-dependency of self-reference (is it in the system or the human?)
  - Tangled hierarchy vs incompleteness as core payoff
  - Biological relevance (codon size, Central Dogma)
  - Universality argument deflating surprise
  - Falsifiability - what would make him abandon the claim?

  User explicitly rejects warmup questions and wants:
  - 8-10 ordered questions with predicted dodges
  - Follow-ups for most likely answers
  - One "cut first" candidate
  - Recording-aware framing to prevent rehearsed spiels

  The guest's pattern seems to be restating the mechanism (strands→enzymes→strands) when pressed. Need questions that force him beyond this. The recursion theorem comparison is particularly interesting - if typogenetics is computationally universal, self-replication becomes trivial via fixed-point theorems, potentially undermining the "isomorphism" novelty.

  For structure:
  Open with mapping degeneracy (weakest point) to unsettle him early. Then hit interpreter-dependency before he gets defensive. Save universality/falsifiability for later as conceptual heavy hitters. End with falsifiability as requested.

  Most dodgeable is likely the biological relevance - he may retreat to "teaching device" claims. The recursion theorem challenge needs careful framing to avoid seeming reductive.

  "Cut first" candidate: The tangled hierarchy vs incompleteness question, as it's more interpretive while others test core claims. Follow-ups must be one-sentence zingers for when he dodges.
answer: |-
  Here’s a tight sequence of 10 questions designed to cut through evasion, ordered for escalating pressure, with follow-ups for predictable answers. Skip #7 first if time runs short.  

  ### Core Questions & Follow-Ups  
  1. **Mapping Structure**:  
     *"You claim a Gödel isomorphism, but typogenetic mappings are degenerate: 64 codons map to 20 enzymes, and enzymes act on strands non-injectively. What exact structure is preserved here? Isomorphism usually implies invertibility—what’s the inverse operation?"*  
     - **Predicted Dodge**: "The mapping enables self-reference, not strict bijection."  
     - **Follow-Up**: *"If degeneracy breaks invertibility, isn’t this just a homomorphism? How does that weaker mapping sustain a Gödel-style isomorphism?"*  

  2. **Interpreter Dependency**:  
     *"When a strand ‘self-replicates’, it’s me (or a human) simulating enzyme actions on paper. Isn’t the fixed point in the interpreter, not the system? How is this different from me writing a quine in Python?"*  
     - **Predicted Dodge**: "The rules are embedded; the interpreter just executes predefined operations."  
     - **Follow-Up**: *"But without an external executor, the strand is inert symbols. Doesn’t that make self-reference extrinsic, unlike Gödel numbering where provability is internal to the system?"*  

  3. **Gödel Sentence vs. Quine**:  
     *"A self-replicating strand seems like a quine (outputs its own code). But Gödel’s sentence says ‘I am unprovable’—it encodes negation and meta-theory. Where is typogenetics’ analogue of unprovability? What’s the ‘negation’ operation here?"*  
     - **Predicted Dodge**: "Unprovability maps to ‘cannot be replicated by certain enzyme sets’."  
     - **Follow-Up**: *"But replication is positive action. Gödel’s twist is self-denial—how do enzymes *deny* their own replicability?"*  

  4. **Incompleteness/Tangled Hierarchy**:  
     *"Is the payoff incompleteness (e.g., strands that are true but un-replicable) or just Hofstadter’s ‘tangled hierarchy’ (enzymes/strands at same level)? If the latter, isn’t this just universal computation, not Gödel?"*  
     - **Predicted Dodge**: "It’s both—the hierarchy enables incompleteness."  
     - **Follow-Up**: *"Show me a concrete *un-replicable but true* strand. If you can’t, is this just computation, not logic?"*  

  5. **Recursion Theorem Jab**:  
     *"My programmer friend says self-replication is Kleene’s recursion theorem: if enzyme rules are Turing-complete, self-replicators exist trivially. Does universality deflate the ‘isomorphism’ as profound?"*  
     - **Predicted Dodge**: "Universality is necessary but not sufficient—the biological mapping adds meaning."  
     - **Follow-Up**: *"But if self-replication reduces to a fixed-point theorem, isn’t the ‘isomorphism’ just a metaphor for computation?"*  

  6. **Biological Bite**:  
     *"Does this analogy explain real biology? E.g., why codons are triplets, or the Central Dogma (info flows DNA→protein, not back)? Or is it purely pedagogical?"*  
     - **Most Likely Dodge**: Retreat to "teaching device" or "conceptual clarity".  
     - **One-Sentence Follow-Up**: *"If it doesn’t constrain real biology, why call it an *isomorphism* rather than a metaphor?"*  

  7. **Universality Threshold**:  
     *"Hofstadter’s enzyme set is minimal. What’s the weakest typogenetic system where self-replication *fails*? If it requires universality, how is this not just computation?"*  
     - **Cut First** if short on time (still important, but less core to isomorphism claim).  

  8. **Inconsistency Analogue**:  
     *"In Gödel, inconsistency explodes the system. What’s typogenetics’ equivalent? A strand that replicates infinitely? Enzymes that destroy all strands?"*  
     - **Predicted Dodge**: "A system that can’t stabilize, like oscillating mutations."  
     - **Follow-Up**: *"But that sounds like a halting problem, not logical explosion. Where’s the *contradiction*?"*  

  9. **Reference Mechanism**:  
     *"The strand doesn’t ‘refer’ to itself—it’s just base pairs. Enzymes manipulate symbols blindly. How is this *semantic* self-reference (à la Gödel) and not syntactic?"*  
     - **Predicted Dodge**: "Reference emerges from the mapping’s structure."  
     - **Follow-Up**: *"But without an interpretation, it’s syntax. How is this less syntactic than a quine?"*  

  10. **Falsifiability**:  
      *"What evidence or argument would make you abandon the isomorphism claim? E.g., if real DNA had no degenerate codons? If self-replication required external axioms?"*  
      - **Force this even if he dodges**: *"Give me one concrete counterexample that would falsify this."*  

  ### Strategy Notes  
  - **Dodge Targets**: He’ll most likely dodge #6 (biological relevance). Hit back with: *"If it doesn’t constrain real biology, why call it an *isomorphism* rather than a metaphor?"*  
  - **Order Logic**: Starts with mapping flaws (#1), moves to interpreter (#2), then Gödel/quine distinction (#3). Recursion theorem (#5) and falsifiability (#10) are knockout punches.  
  - **Recording Leverage**: When he restates his spiel, interrupt: *"I’ve read GEB—take this as given. Now, directly on my question: [repeat follow-up]."*  
  - **If Cornered**: If he admits it’s "just computation", pivot to: *"Then why invoke Gödel, not Turing?"*  

  This forces him to defend the *specificity* of the analogy. If he can’t articulate what’s preserved beyond computation (e.g., negation, meta-theory), the isomorphism claim collapses. Good luck—make him sweat!
