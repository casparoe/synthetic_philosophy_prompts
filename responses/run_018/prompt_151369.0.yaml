  my take: death's knowledge is encoded, and the flight is part of the input data. so it's not prediction, it's logical closure — the future is already in the representation she uses. this is structurally like embedded agency where an agent modeling itself creates consistency problems.
  conclusion: maybe the paradox proves that perfect foreknowledge and free choice are incompatible due to representational closure, not causation.

