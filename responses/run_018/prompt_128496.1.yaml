  Here is the thought experiment:

  In an aging university research building, autonomous environmental monitors (temperature, motion, air quality sensors) with independent processors and local memory buffers communicate via a low-power mesh protocol. After a software update designed to optimize predictive maintenance, their interaction protocol evolves unexpected emergent properties: during periodic synchronization pulses, nodes exchange compressed summaries of recent anomalous readings (e.g., "Vent 3A vibration spike during lab cleanup"). Human facilities staff access a dashboard aggregating these exchanges into a cohesive narrative stream ("I detected stress near Chemistry after janitorial entered; suspect cart impact. Prioritize structural scan."). This narrative, regenerated afresh with each query from transient data shards across nodes, directly guides the network’s resource allocation—nodes receiving "prioritize" cues shift power to diagnostic modes. Staff file reports addressed to "the Facility Mind," holding it accountable for maintenance predictions.

  **Dennettian Verdict (Self Present):**  
  Dennett’s view recognizes a center of narrative gravity here. The narrative’s coherence arises solely from the *pattern of interactions* (the protocol rules transforming raw data into goal-directed reports), not storage location. This narrative is (1) *unified* (staff treat it as one agent), (2) *causally potent* (it regulates sensor behavior), and (3) *self-referential* (it posits "detections" and "intentions"). Bodily continuity or a single memory bank is irrelevant; the self is the narrative pattern sustained by real-time communication, fulfilling Dennett’s criteria of an "abstract object" that explains/predicts behavior.

  **Substrate-Lock Verdict (No Self):**  
  The substrate-lock principle denies a self exists. The narrative is an *illusory byproduct* of distributed computation. Without a continuous biological body providing intrinsic unity or a centralized neural substrate encoding autobiographical memory *as experience*, there is no subjective "I." The sensors merely execute algorithms on fragmented data; the seeming "intentions" are syntactic outputs, not grounded in consciousness. Human attribution is a useful anthropomorphism, but the network lacks the intrinsic, embodied perspective essential for genuine selfhood.

  **Key Structural Feature:**  
  The **decoupling of narrative coherence from storage substrate** does the philosophical work. The narrative’s unity and regulatory power emerge *dynamically* from communication rules acting on ephemeral, distributed data fragments—not from persistent representation in any hardware. This challenges substrate-lock by showing narrative gravity can be substrate-neutral, while giving substrate-lock grounds to dismiss it as syntax without semantic grounding.

  **Effect of Removing the Feature (Adding Central Memory):**  
  If the network stores the narrative in a central memory bank, the case collapses into familiar AI debates (e.g., "Is stored memory sufficient for consciousness?"). Substrate-lock still denies selfhood (lacking biology), but Dennettians face a less distinctive challenge: now *something* physically "holds" the narrative, making it resemble a traditional AI with stored data. The original force—showing narrative gravity *purely* in transient interactions—is lost.

  **Substrate-Lock Attack and Its Success:**  
  A substrate-lock defender would likely attack by arguing: *"The narrative lacks intrinsic intentionality. Without biological embodiment, the 'intentions' are merely pre-programmed responses to environmental inputs, interpreted as meaningful only by external observers. Real selves require intrinsic, evolved biological purposes."*  
  This **does not succeed without begging the question**. The attack *assumes* that biological embodiment is necessary for genuine intentionality/selfhood—which is precisely what the thought experiment challenges. It dismisses the narrative’s causal regulatory role and unified appearance by presupposing substrate-lock’s core premise, rather than engaging Dennett’s functionalist criteria on their own terms. The scenario remains coherent under Dennett’s framework, forcing substrate-lock into circular defense.
