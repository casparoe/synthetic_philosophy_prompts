  I lead a small eng team and I've been asked to run a 45-minute session at our next offsite (about 14 people) on why we keep pouring effort into projects that are clearly failing. I vaguely remember something about a "dollar auction" where two people bid on a dollar and end up bidding way more than the dollar because neither wants to be the runner-up who pays and gets nothing, and I want to build the session around that. Could you design a hands-on game alone those lines that I can actually run? Rules, materials I can scrounge (no real money as stakes), a rough timeline, and a debrief that maps what happens in the game onto escalation of commitment and the sunk-cost fallacy. The goal is that people feel the pull themselves before anyone names it, so no lecture up front. Also tell me what will probably go wrong the first time I run it, and where the game is only an approximation of the real thing so I know what I'll have to supply myself in the wrap-up. If there's a difference between what's settled and what's genuinely contested about escalation of commitment, please keep those separate instead of presenting one view as the consensus. American English is fine.
