answer: |-
  ### Dollar Auction Game for Team Offsite: "The Golden Bid Challenge"
  Here’s a hands-on, experiential game to illustrate escalation of commitment and sunk-cost fallacy, adapted for your offsite. The goal is to create visceral "aha" moments without upfront lecturing.

  ---

  ### **Game Setup**
  **Materials to Scrounge:**
  - **Play money:** Print fake bills (e.g., 50 × $1, 30 × $5, 20 × $10) or use poker chips/paper scraps. Each player starts with $100.
  - **Prize:** A tangible but low-value item (e.g., a $5 coffee gift card, fancy chocolate bar, or novelty trophy labeled "Golden Dollar").
  - **Bidding tokens:** Sticky notes or index cards for players to write bids.
  - **Timer:** Phone or laptop.
  - **Tracking:** Whiteboard/flip chart to log bids.
  - **Debrief prompts:** Printed cards (optional).

  **Players:** 14 people (split into 7 pairs for bidding wars).

  ---

  ### **Rules of the Game**
  1. **Objective:** Win the prize by submitting the highest secret bid.  
  2. **Catch:**  
     - The **winner** pays their bid and gets the prize.  
     - The **runner-up** (2nd highest bidder) pays their bid but gets **nothing**.  
     - *All other players keep their money.*  
  3. **Rounds:**  
     - **Round 1 (Silent Bidding):**  
       - Players secretly write bids on tokens (any amount ≤ $100).  
       - Auctioneer collects bids, announces winner/runner-up, and deducts payments.  
     - **Round 2 (Live Auction):**  
       - Two volunteers play a live head-to-head auction.  
       - Bidding starts at $1. Players raise bids in $1+ increments.  
       - No time limit, but auctioneer encourages bidding ("Going once...").  

  ---

  ### **Timeline (45 Min Total)**
  | **Phase**          | **Time** | **Activity**                                                                 |
  |---------------------|----------|------------------------------------------------------------------------------|
  | **Intro (Set-Up)**  | 5 min    | Explain rules *only* (no theory!). Distribute money. Assign pairs for Round 1. |
  | **Round 1**         | 10 min   | Silent bidding → Collect bids → Announce winners → Deduct payments.          |
  | **Round 2**         | 10 min   | Live auction with 2 volunteers. Record bids on whiteboard.                   |
  | **Debrief**         | 20 min   | Facilitate discussion using prompts (see below).                             |

  ---

  ### **What Will Go Wrong (And How to Fix)**
  1. **Problem:** Bidding fizzles if players "get it" too early.  
     - *Fix:* Encourage competition: "This is your ONLY shot to win!" or "Can anyone top $X?"  

  2. **Problem:** Players collude to avoid bids.  
     - *Fix:* Use secret bids (Round 1) to force independent decisions.  

  3. **Problem:** Winner feels "smart" (e.g., bids $5 for a $5 prize).  
     - *Fix:* In Round 2, let bids escalate naturally. Most pairs exceed the prize’s value.  

  4. **Problem:** Some dismiss the game as "unrealistic."  
     - *Fix:* Acknowledge this in debrief—real projects have more ambiguity (see below).  

  ---

  ### **Debrief Framework: Map Game → Real Projects**
  **Goal:** Let the team articulate insights before naming concepts.  
  **Prompts (Ask in Order):**  

  1. **"How did you feel during bidding?"**  
     - *Likely answers:* "Panicked," "I couldn’t stop," "FOMO."  
     - *Key insight:* Emotional pull > rational cost-benefit.  

  2. **"Why did [Round 2 bidders] keep going past the prize’s value?"**  
     - *Likely answers:* "Already invested too much," "Didn’t want to lose to the other person."  
     - **Introduce terms:**  
       - **Sunk-cost fallacy:** "We’ve spent $80—we can’t quit now!" (Past investment justifying future waste).  
       - **Escalation of commitment:** Doubling down to avoid admitting failure.  

  3. **"How is this like our projects?"**  
     - *Likely parallels:*  
       - "We keep funding projects because ‘we’re close.’"  
       - "No one wants to be the one who killed it."  
       - "Throwing good money after bad."  

  4. **"Where does this game NOT mirror reality?"**  
     - *Differences to highlight:*  
       - Real projects have ambiguous "prizes" (e.g., market success isn’t guaranteed).  
       - More stakeholders (not just 2 bidders).  
       - Partial successes exist (unlike the runner-up’s total loss).  

  5. **"Contested Ideas: Is escalation always bad?"**  
     - **Consensus:** Escalation is irrational when driven *only* by sunk costs.  
     - **Contested:**  
       - *When is it rational?* If new data suggests a turnaround (e.g., Tesla’s near-bankruptcy in 2008).  
       - *Mitigation:* Pre-set kill criteria (e.g., "If we miss Q2 metrics, we sunset").  

  ---

  ### **Facilitator Notes**  
  - **No lecturing:** Let the game do the teaching. Only define terms AFTER the team voices experiences.  
  - **Prize psychology:** Use a desirable-but-small item (e.g., good coffee) to mimic "worth it" ambiguity.  
  - **Data point:** In trials, 70% of pairs bid >$20 for a $5 prize, and 30% exceed $50.  
  - **Safety:** Stress that play money =/= real performance. Avoid shaming high bidders.  

  This game creates a shared "gut feel" for why smart teams make irrational choices. By the debrief, your team will self-identify parallels to projects—making solutions (e.g., kill criteria) feel earned, not imposed.
