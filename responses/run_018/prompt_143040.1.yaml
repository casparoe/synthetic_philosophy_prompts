answer: |-
  Here's a sorting tree designed for your seminar, focusing on concrete commitments and empirical claims while avoiding jargon-heavy questions. It flags settled findings, contested points, and ambiguous boundaries:

  **The Virtue Ethics vs. Situationist Sorting Tree**

  **Start: Node 1 - The Consistency Question**
  *   **Question:** Based on classic experiments (like Milgram's obedience, Darley & Batson's Good Samaritan, Hartshorne & May's honesty studies), do you accept that people's behavior shows **very low cross-situational consistency**? Meaning: Knowing someone was honest/courageous/helpful in Situation X tells you almost nothing about whether they'll be honest/courageous/helpful in a *different* Situation Y.
      *   *(Settled Finding: Behavior varies significantly more across situations than folk psychology predicts. The correlation coefficient for trait-consistent behavior across situations is generally low (<0.3), though not universally zero.)*
  *   **Branch A: YES, consistency is very low/near-zero.** *(Accepts the core situationist empirical critique)* ➔ Go to **Node 2A**
  *   **Branch B: NO, significant consistency exists.** *(Rejects the *strength* of the situationist critique, finds flaws in experiments, or emphasizes other evidence)* ➔ Go to **Node 2B**

  ---

  **Node 2A: YES, consistency is very low/near-zero. What kind of dispositions (if any) remain?**
  *   **Question:** If broad, cross-situational traits (like "honest person") don't predict behavior well, what *does* account for the patterns we see? Is the consistency that exists...
      *   **(A) Primarily "Local":** Rooted in specific contexts, roles, relationships, or types of triggers? (e.g., "honest *when dealing with authority figures*", "courageous *in physical emergencies but not social conflicts*", "compassionate *with family but not strangers*").
      *   *(Contested: Can such local dispositions meaningfully ground robust notions of *moral character* and *praise/blame*?)*
      *   **(B) Essentially NON-EXISTENT as stable dispositions:** Behavior is mostly explained by immediate situational forces, subconscious priming, transient goals, or fragmented cognitive processes *without* forming even local dispositional patterns.
  *   **Branch A1: YES, consistency is primarily "Local".** ➔ Go to **Node 3A**
  *   **Branch A2: NO, stable dispositions (even local) are largely illusory.** Behavior is too fragmented. ➔ **Position: Virtue Eliminativism / Situationist Skepticism** (e.g., Strong interpretations of situationism; rejects character as a useful moral category).

  ---

  **Node 2B: NO, significant consistency exists. What is the nature of this consistency?**
  *   **Question:** Accepting that situations matter, but believing significant behavioral consistency *does* exist across diverse situations, is this consistency best explained by...
      *   **(A) Global Traits:** Relatively enduring, broad character traits that manifest across many different types of situations? (e.g., Honesty *tends* to show up at work, with friends, with strangers, in tempting situations).
      *   **(B) Fragile but Real Global Traits + Significant Interaction:** Global traits exist but are weaker than traditional virtue ethics claimed and highly sensitive to situational triggers and cognitive resources (like self-control). Consistency emerges from the complex *interaction* of trait *and* situation.
      *   *(Settled Finding: Person x Situation interactions are crucial. Contested: The relative strength and stability of Global Traits.)*
  *   **Branch B1: YES, primarily Global Traits.** ➔ **Position: Globalist Virtue Ethics (Neo-Aristotelian)** (e.g., Defenders like Nancy Snow, some interpretations of Aquinas/MacIntyre; acknowledges situationist findings but argues they don't refute core Aristotelian claims about robust traits).
  *   **Branch B2: NO, Fragile Global Traits + Interaction.** ➔ **Position: Interactionist Virtue Ethics** (e.g., Moderate responses like Rachana Kamtekar; emphasizes traits as dynamic, context-sensitive, and requiring cultivation of perception/sensitivity).

  ---

  **Node 3A: YES, consistency is primarily "Local". Should we reconceive virtue?**
  *   **Question:** If stable dispositions are primarily local (role-bound, context-specific, triggered), does this mean virtue ethics needs to fundamentally rethink the *location* and *nature* of virtue? Specifically...
      *   **(A) YES, virtue is fundamentally ECOLOGICAL:** Morality isn't primarily about individual character traits (local or global), but about designing social structures, institutions, cultural practices, and relational contexts ("moral ecologies") that reliably *promote* virtuous behavior and *inhibit* vicious behavior. Individual dispositions are secondary products of these systems. *(Contested: Does this eliminate individual moral responsibility?)*
      *   **(B) NO, LOCAL dispositions ARE the core of virtue:** Virtue ethics should scale down. "Character" is a collection of these specific, local dispositions (e.g., "work-integrity", "parental-compassion", "friend-loyalty"). Cultivating *these* is the task of moral development. *(Contested: Can this avoid fragmentation and provide unified moral guidance?)*
  *   **Branch A1A: YES, virtue is fundamentally ECOLOGICAL.** ➔ **Position: Ecological Virtue Theory / Social Scaffolding View** (e.g., Miranda Fricker on institutional virtue, some interpretations of Dewey/pragmatism, influenced by Doris' later work on "collaborative emergence").
  *   **Branch A1B: NO, LOCAL dispositions ARE the core.** ➔ **Position: Local Trait Virtue Ethics / Fragmented Character View** (e.g., John Doris' original "person-situation interactionist" proposal, Gilbert Harman's eliminativism-leaning localism).

  ---

  **Ambiguity Flags:**
  1.  **Interactionism (Node 2B2) vs. Weak Ecological Views (Node 3A1):** These can blur. An Interactionist might strongly emphasize how situations *scaffold* fragile traits, sounding ecological. An Ecological theorist might allow that individuals internalize some local dispositions *from* the ecology, sounding interactionist. The key distinction is **primary locus**: Is the core explanatory work done by the individual's (fragile) traits interacting with situations, or by the designed structure of the situation/ecology itself?
  2.  **Local Trait Virtue (Node 3A2) vs. Interactionism (Node 2B2):** While distinct (Local Traits rejects *global* traits, Interactionism accepts fragile ones), both heavily emphasize person-situation interaction. Local Traits focuses on the *specificity* of the dispositions formed, Interactionism focuses on the *dynamic process* sustaining (weaker) global traits.

  **Key:**
  *   **Settled Finding:** Empirical consensus (behavior varies significantly by situation).
  *   **Contested:** Genuine philosophical/interpretive disagreement within the field.
  *   **Leaf Positions:** Named where a clear label exists for a developed position; descriptive otherwise.

  This tree forces choices based on interpretations of evidence and conceptual commitments about dispositions, leading beyond the simple Aristotle-vs-Doris dichotomy and surfacing ecological and fragmented/localist options. It distinguishes empirical claims from normative/interpretive ones.
