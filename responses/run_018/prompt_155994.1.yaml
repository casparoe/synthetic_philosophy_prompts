  We are building desiderata for a strategy-stealing argument to work in a general setting beyond classic perfect-information symmetric games.

  Key idea: In symmetric games (like Hex, Nim, etc.), having an extra move is non-negative because the strategy-stealing player can always "mirror" the opponent until the opponent makes use of the extra move, and then take that move. But in imperfect information, continuous actions, or when moves reveal private information, we have complications.

  We want to list conditions required for strategy-stealing to work, with:

  - Each requirement.
  - The case that motivates it (what goes wrong if we drop it?).
  - Mark as hard constraint (necessary) or camp-specific (might be relaxed in some contexts).
  - Note if any subset is jointly unsatisfiable (due to known impossibilities).

  We'll structure as follows:

  1. **Symmetry of the Game**: The game must be symmetric in a strong sense (players interchangeable, symmetric initial state, symmetric moves, symmetric payoffs). 
     - *Motivation*: If the game is asymmetric (e.g., Chess with white and black having different starting positions), then copying the opponent's move might not be defined or might lead to a losing position. Without symmetry, the extra move might break the balance.
     - *Type*: Hard constraint for classic strategy-stealing.

  2. **Perfect Information**: All moves are observed and there is no private state.
     - *Motivation*: In imperfect information games, if one player has an extra move, that move might reveal private information to the opponent. For example, in a card game, an extra move (like playing a card) might reveal the player's hand. Then, the opponent can exploit this extra information. Also, the strategy-stealing player cannot copy the opponent's move if they don't know what the opponent did (due to hidden actions).
     - *Type*: Hard constraint in the classic setting, but we might relax it in some cases (if the information set structure is symmetric and copying is possible without revealing extra).

  3. **Deterministic Moves**: Moves are deterministic and the game has no randomness (or if there is, it must be symmetric and not break the copying).
     - *Motivation*: If moves are stochastic, then copying the opponent's move might not be possible because the same move might lead to different outcomes. Also, if the game has chance moves, they must be symmetric (same distribution for both players) and independent of the players' identities. Otherwise, the strategy-stealing argument fails because the extra move might interact differently with randomness.
     - *Type*: Camp-specific? Some arguments can handle symmetric randomness if the strategy-stealing player can mimic the randomness (by using the same random seed, for instance). But if randomness is private (like drawing cards) then it becomes problematic.

  4. **Discrete and Identical Action Sets**: The set of available actions at every state is discrete and identical for both players (or at least, there is a bijection between the action sets that preserves the game structure).
     - *Motivation*: In continuous action spaces, it might be impossible to define a bijection (copying map) between the actions of the two players. Moreover, if the action sets are not symmetric (e.g., one player has more actions in a state), then copying might fail. Also, in games with asymmetric action sets, the extra move might be in a direction that the copier cannot match.
     - *Type*: Hard constraint for the classic argument, but perhaps we can generalize to continuous actions if we have a symmetry mapping (isomorphism) between the action sets.

  5. **No Benefit from Having the Extra Move Revealed**: The fact that one player has an extra move (and this is known) does not by itself give the opponent an advantage that breaks the symmetry.
     - *Motivation*: In epistemic settings, if the opponent knows that the strategy-stealing player has an extra move, they might change their strategy to exploit that knowledge. For example, in a negotiation game, knowing that the other player has an extra move might lead to different bargaining behavior. Also, in settings where the extra move might signal strength (e.g., in an auction), then having an extra move (and hence the ability to bid more) might lead to adverse selection.
     - *Type*: Hard constraint? This is about the equilibrium not being disturbed by the mere fact of having an extra move. Without this, the opponent might play differently from the start.

  6. **Preservation of Symmetry under Copying**: The copying operation must preserve the symmetry of the game state. That is, after both players have moved (the opponent and the copier), the resulting state must be symmetric (or at least, the copier must be at least as well off as the opponent was in the original state).
     - *Motivation*: In games with state, we require that the state after the copier's move (which is a copy of the opponent's move) and the opponent's next move leads to a state that is symmetric to the one the opponent would have faced without the extra move. If the state becomes asymmetric (e.g., because the extra move broke the symmetry in a way that cannot be fixed by copying), then the argument fails.
     - *Type*: Hard constraint.

  7. **No Free Disposal of Moves**: The player with the extra move must not be forced to use it in a way that harms them. In other words, having an extra move should not be a burden (like in a centipede game where moving leads to a loss).
     - *Motivation*: In some games, passing or not moving might be beneficial. If the player with the extra move is forced to make an additional move (and cannot pass), then that move might be detrimental. The classic strategy-stealing argument assumes that the extra move can always be used to at least break even (by copying until the opponent uses the extra move). But if moves are costly or if the game has negative-sum moves, then having an extra move might be bad.
     - *Type*: Camp-specific? In many games, moves are optional (you can pass) and then having an extra move is non-negative. But if moves are mandatory and harmful, then it becomes a burden.

  8. **No Externalities from Move Order**: The order of moves should not matter for the outcome (or at least, having the first move should not be a disadvantage in a way that breaks the argument).
     - *Motivation*: In some games (e.g., the prisoner's dilemma in a sequential setting), moving first might be bad because it allows the opponent to exploit. Then having an extra move (and hence being forced to move first in some subgames) might be harmful. The strategy-stealing argument requires that having the extra move is non-negative.
     - *Type*: Hard constraint? Only if the game has a structure where moving first is a disadvantage.

  9. **Commutativity of Move Copying**: The copying operation must commute with the opponent's move. That is, if the copier copies the opponent's move, the resulting state should be the same as if the opponent had copied the copier's move (if they were to swap roles). This is a strong symmetry condition.
     - *Motivation*: Without this, the copied move might lead to a different state than intended, breaking the symmetry. This is particularly important in games with state-dependent moves.
     - *Type*: Hard constraint for the classic argument.

  10. **Full Observability of Moves**: The opponent's move must be fully observable to the copier, and vice versa, so that copying is possible.
      - *Motivation*: In partial information games, if the copier cannot observe the opponent's move (or only observes a signal), then they cannot copy exactly. This breaks the copying mechanism.
      - *Type*: Hard constraint.

  Tensions and Known Impossibilities:

  - **Imperfect Information and Strategy-Stealing**: In general, strategy-stealing arguments break down in imperfect information games because of the tension between the need to copy exactly and the inability to observe the opponent's move (or the opponent's private state). This is a fundamental issue: if the copier has to make a move without knowing the opponent's move, they cannot copy. Moreover, the extra move might reveal private information, which the opponent can then exploit in subsequent moves. This is a known barrier.

  - **Continuous Action Spaces**: While it might be possible to define a symmetry mapping (e.g., by a fixed point theorem) in continuous action spaces, it becomes much harder to guarantee that the copied move leads to a symmetric state. Also, the existence of such a mapping might require the action space to be homogeneous (like a vector space) and the game dynamics to be linear, which is very restrictive.

  - **Epistemic Asymmetry**: If the players have different beliefs or different information, then the copying operation might not preserve the state of knowledge. The extra move might signal information, leading to a breakdown. This is related to the "signaling" problem in economics: having an extra move might reveal that you are the player with the extra move (if the opponent doesn't know who has it) and then the opponent can adjust. There are no-go results in information economics that show that in strategic settings with asymmetric information, revealing information through actions can lead to inefficiencies or break symmetries.

  Joint Unsatisfiability:

  - The requirement of **Perfect Information** and **Full Observability** are necessary for copying. If we drop them, we enter imperfect information, and then we run into the problem that the extra move might reveal information. This is a fundamental tension: the strategy-stealing argument relies on the ability to copy without altering the information structure, but in imperfect information, the act of having an extra move might alter the information structure. This is why strategy-stealing is typically confined to perfect information games.

  - The requirement of **Symmetry** and **No Benefit from Having the Extra Move Revealed** might be jointly unsatisfiable in games with epistemic asymmetry. If the opponent knows that the copier has an extra move, then the symmetry of the initial state (in terms of information) is broken. Hence, the opponent might play a different strategy from the beginning, and the copying argument fails. This is why the classic argument assumes that the players are symmetric in every aspect (including information) and that the extra move is not known (or if known, it doesn't matter). But if the opponent knows, then we are in an asymmetric information setting.

  In summary, the core conditions for classic strategy-stealing are: symmetry, perfect information, deterministic moves, discrete and symmetric action sets, and the ability to copy without revealing extra information. Relaxing any of these leads to challenges, and in particular, imperfect information and continuous actions are major obstacles.

  The following table summarizes:

  | Requirement | Motivating Case if Dropped | Hard or Soft |
  |------------|----------------------------|--------------|
  | Symmetry | Asymmetric games (e.g., Chess) break the copying because the board isn't symmetric. | Hard |
  | Perfect Information | In card games, moves reveal private information and the copier cannot observe to copy. | Hard |
  | Deterministic Moves | Stochastic moves break the copying because outcomes are random and might not mirror. | Soft (can handle symmetric randomness) |
  | Discrete and Identical Action Sets | Continuous actions might not have a well-defined copying map. | Hard for general continuous spaces |
  | No Benefit from Extra Move Revealed | If the opponent knows about the extra move, they might change strategy to exploit. | Hard in epistemic settings |
  | Preservation of Symmetry under Copying | After copying, the state becomes asymmetric and the copier is worse off. | Hard |
  | No Free Disposal | If moves are harmful, having an extra move might be bad (e.g., in a game of chicken). | Soft (depends on the game) |
  | No Externalities from Move Order | In sequential prisoner's dilemma, moving first is bad. | Soft (depends on the game) |
  | Commutativity | Without commutativity, the copied move might lead to a different state. | Hard |
  | Full Observability | In hidden move games, the copier doesn't know what to copy. | Hard |

  Known tensions:

  - Perfect Information + Full Observability + Symmetry are hard constraints and necessary. Without them, the argument breaks.
  - The set {Perfect Information, Symmetry, No Benefit from Extra Move Revealed} might be unsatisfiable if the opponent can infer the extra move from the play. This is because the extra move, if used, might break the symmetry of information.

  Therefore, strategy-stealing outside of perfect-information symmetric games is very fragile and often not applicable.
answer: |-
  Below are the desiderata for a strategy-stealing argument to hold outside classic perfect-information games, organized by requirement, motivation (failure case), constraint type (hard vs. camp-specific), and joint unsatisfiability. The focus is on conditions enabling one player to copy an opponent's decision rule without harm, despite asymmetric information, continuous actions, or extra moves leaking information.

  ---

  ### **Core Desiderata**
  1. **Action-Space Symmetry**  
     - **Requirement**: A bijection must exist between players' action spaces at all reachable states, preserving game dynamics.  
     - **Motivation**: If action sets are asymmetric (e.g., Player 1 controls throttle, Player 2 controls steering in a racing game), copying an opponent's move is undefined.  
     - **Constraint**: Hard. Without symmetry, copying is impossible.  

  2. **State Symmetry Preservation**  
     - **Requirement**: After both players act, the state remains symmetric under a defined involution (e.g., swapping player roles).  
     - **Motivation**: In asymmetric games (e.g., **Chess with non-symmetric pawn structures**), copying disrupts board balance, giving the opponent exploitable advantages.  
     - **Constraint**: Hard. Fundamental to mirroring strategies.  

  3. **No Intrinsic Move Cost**  
     - **Requirement**: Making an extra move never harms the player intrinsically (e.g., no resource depletion or commitment penalties).  
     - **Motivation**: In games with **action costs (e.g., energy-limited RPGs)**, an extra move drains resources, making copying detrimental.  
     - **Constraint**: Camp-specific. Relaxable if costs are negligible or reimbursable.  

  4. **Observability of Actions**  
     - **Requirement**: All actions are fully observable to both players.  
     - **Motivation**: In **hidden-information games (e.g., Poker)**, unobservable moves prevent accurate copying and invite bluffing exploits.  
     - **Constraint**: Hard. Imperfect information breaks the copying premise.  

  ---

  ### **Epistemic & Information-Theoretic Desiderata**
  5. **Non-Revelatory Moves**  
     - **Requirement**: Extra moves do not leak private information (e.g., beliefs, intentions, or hidden state).  
     - **Motivation**: In **signaling games (e.g., auctions)**, an extra bid reveals valuation, allowing opponents to extort concessions.  
     - **Constraint**: Hard. Violation implies the surplus move itself changes game dynamics via information asymmetry.  

  6. **Belief Invariance**  
     - **Requirement**: Player beliefs about the game state remain unchanged by the presence/use of an extra move.  
     - **Motivation**: In **epistemic games (e.g., asymmetric Bayesian games)**, knowing an opponent has an extra move shifts beliefs, altering optimal play.  
     - **Constraint**: Camp-specific. Only necessary when beliefs directly influence payoffs.  

  ---

  ### **Dynamic & Structural Desiderata**
  7. **Commutative Move Semantics**  
     - **Requirement**: The order of copied vs. original moves does not affect outcomes (i.e., actions commute under state transitions).  
     - **Motivation**: In **real-time strategy games (e.g., unit deployment order matters)**, non-commutative moves let opponents force desynchronization.  
     - **Constraint**: Hard for discrete actions; soft for continuous if derivatives commute (e.g., linear systems).  

  8. **No First-Mover Disadvantage**  
     - **Requirement**: The player making the extra move never suffers from acting first.  
     - **Motivation**: In **sequential bargaining (e.g., ultimatum games)**, moving first locks in exploitable offers.  
     - **Constraint**: Camp-specific. Irrelevant if move order is neutral or advantageous.  

  ---

  ### **Tolerances (Camp-Specific Preferences)**
  9. **Deterministic Transitions**  
     - **Requirement**: Game dynamics are deterministic (no stochasticity).  
     - **Motivation**: **Stochastic games (e.g., Backgammon)** allow randomness to negate copied strategies via divergent outcomes.  
     - **Constraint**: Camp-specific. Relaxable if randomness is symmetric and non-adaptive.  

  10. **Discrete Action Spaces**  
      - **Requirement**: Action sets are finite and discrete.  
      - **Motivation**: In **continuous control (e.g., drone navigation)**, no bijection may exist between players' high-dimensional actions.  
      - **Constraint**: Camp-specific. Continuous spaces may permit topological symmetry (e.g., rotational invariance).  

  ---

  ### **Tension Map & Joint Unsatisfiability**
  #### **Inherent Tensions**  
  - **Strategy-Stealing vs. Information Revelation**:  
    Requirements 5 (**Non-Revelatory Moves**) and 6 (**Belief Invariance**) conflict with imperfect information. In **signaling equilibrium games** (e.g., Spence's job market), *any* extra move leaks type information, making both requirements jointly unsatisfiable under standard no-go theorems (e.g., the revelation principle).  

  - **Symmetry vs. First-Mover Effects**:  
    Requirement 7 (**Commutative Move Semantics**) and 8 (**No First-Mover Disadvantage**) clash in sequential games. If moves are non-commutative (e.g., **Stackelberg competitions**), first-mover disadvantage (Requirement 8) often emerges, violating state symmetry (Requirement 2).  

  - **Continuous Actions vs. Copying Precision**:  
    Requirement 10 (**Discrete Actions**) conflicts with Requirement 1 (**Action-Space Symmetry**) in nonlinear systems. In **robotic coordination with continuous action spaces**, small copying errors accumulate, breaking symmetry (Requirement 2).  

  #### **Minimal Viable Subset**  
  The **hard core** (Requirements 1, 2, 4, 5, 7) is sufficient for deterministic, discrete-action games with no move costs or belief shifts. Adding camp-specific preferences (e.g., Requirement 10 for discrete actions) eases applicability but introduces fragility (e.g., fails in chaotic systems).  

  #### **Theorems Blocking Joint Satisfaction**  
  - **Myerson–Satterthwaite Impossibility**: In bargaining with private valuations, Requirements 5 and 6 cannot hold simultaneously—extra moves inevitably reveal information.  
  - **No-Free-Lunch in Continuous Games**: For generic nonlinear dynamics, Requirements 1, 2, and 7 are jointly unsatisfiable without restrictive symmetry (e.g., Lie group invariance).  

  ---

  ### **Summary**  
  | **Requirement**               | **Failure Case**                  | **Constraint Type**       |  
  |-------------------------------|-----------------------------------|---------------------------|  
  | Action-Space Symmetry         | Asymmetric control (e.g., racing) | Hard                      |  
  | State Symmetry Preservation   | Asymmetric board states (e.g., Chess) | Hard                |  
  | Non-Revelatory Moves          | Signaling games (e.g., auctions)  | Hard                      |  
  | Observability of Actions      | Hidden moves (e.g., Poker)        | Hard                      |  
  | Commutative Move Semantics    | Order-dependent outcomes (e.g., RTS) | Hard                 |  
  | No Intrinsic Move Cost        | Action penalties (e.g., RPGs)     | Camp-specific             |  
  | Belief Invariance             | Bayesian games                    | Camp-specific             |  
  | No First-Mover Disadvantage   | Ultimatum games                   | Camp-specific             |  
  | Deterministic Transitions     | Stochastic games (e.g., Backgammon)| Camp-specific          |  
  | Discrete Action Spaces        | Continuous control (e.g., drones) | Camp-specific             |  

  **Key Tensions**: Information leakage (Requirements 5–6) and non-commutativity (Requirements 7–8) are primary barriers. Hard constraints are mutually compatible only in deterministic, perfect-information, discrete-action games with costless moves. Epistemic or continuous settings introduce fundamental trade-offs.
