  **Joint Statement: Adversarial Collaboration on Hard Choices**  
  We, the undersigned proponents of the "irreducible residue" (IR) and "structural resolution" (SR) views, affirm that our core divergence lies in whether rational regret in hard choices reflects an ineliminable feature of value pluralism (IR) or an epistemic/representational deficit (SR). We concur, however, that single-axis metrics (e.g., utility maximization) fail universally in such choices, and that our shared formal tools—multi-dimensional frameworks rejecting cardinal completeness—capture key diagnostics of hard choices. Disagreements arise not from the *existence* of conflict but from its *resolvability* via structural enrichment versus inherent incomparability.  

  **1. Agreed Claims:**  
     (1) **Phenomenological signature**: Hard choices evoke visceral conflict and anticipatory regret, signaling that no option dominates across all valued dimensions (e.g., dignity vs. efficiency).  
     (2) **Single-axis failure**: Monistic metrics (e.g., cost-benefit analysis) cannot capture hard choices’ structure, as they ignore qualitative divergences between dimensions.  
     (3) **Regret conditions**: Persistent rational regret occurs iff: (a) options are non-dominated, (b) values are mutually non-compensating (e.g., dignity loss cannot be offset by efficiency gains), and (c) no new information emerges post-choice.  
     (4) **Dimensional lock**: When three dimensions (e.g., Continuity [C], Autonomy [A], Welfare [W]) exhibit **intransitive indifference** (e.g., Option X ≍ Y in C/A tradeoff, Y ≍ Z in A/W tradeoff, but X ≻ Z in C/W tradeoff), no complete, transitive real-valued function can order options without arbitrariness.  

  **2. Disagreements Table:**  
  | Camp | Core Thesis |  
  |------|-------------|  
  | **Irreducible Residue (IR)** | Genuine value incommensurability—where no common measure exists across plural values (e.g., dignity ≠ efficiency)—leaves a *non-eliminable rational residue*. Optimal choice warrants regret; no enriched structure can fully order options or negate loss. |  
  | **Structural Resolution (SR)** | Incommensurability signals *underspecification*. With sufficiently rich structural representations (e.g., partial orderings + domain-specific constraints), every hard choice resolves to a determinate all-things-considered ranking *without* tragic loss; regret stems from incomplete modeling. |  

  **3. Crux Analysis and Predictions:**  
  **Crux 1: Framing Reversals**  
     - **Question**: Do framing effects (e.g., preference reversals under "dignity" vs. "efficiency" frames) prove incommensurability or reveal hidden contextual parameters?  
     - **Shared Test Case**: *Institutional Reform Dilemma*: Choosing between (A) preserving a tradition-bound institution (high dignity, low efficiency) and (B) modernizing it (low dignity, high efficiency). Preferences reverse when framed as "protecting heritage" vs. "optimizing outcomes."  
     - **IR Prediction**: Reversals confirm incommensurability; no unified metric exists, as frames expose irreducible value conflicts. *Expected outcome*: Reversals persist even under enriched structural descriptions.  
     - **SR Prediction**: Reversals reveal unmodeled contextual parameters (e.g., "crisis severity" activating efficiency constraints). *Expected outcome*: Adequate structural enrichment (e.g., crisis-dependent priority rules) eliminates reversals.  

  **Crux 2: Rational Regret**  
     - **Question**: Does rational regret require the unchosen option was *comparable but worse* (IR), or only that the choice was *structurally underdetermined* (SR)?  
     - **Shared Test Case**: *Dimensional Lock Scenario*: Three policy options evaluated on (C, A, W):  
       - X: High C, Low A, Medium W  
       - Y: Low C, High A, Medium W  
       - Z: Medium C, Medium A, High W  
       Observed: X ≍ Y (C-A tradeoff), Y ≍ Z (A-W tradeoff), but X ≻ Z (C-W tradeoff). Agent chooses X over Z and regrets forgone W.  
     - **IR Prediction**: Regret is rational; Z’s high W is incomparably sacrificed, proving incommensurability. *Expected outcome*: Enriched models (e.g., weighted scoring) cannot eliminate regret without arbitrary dimension-collapsing.  
     - **SR Prediction**: Regret signals underdetermination; adding constraints (e.g., "Welfare ≥ threshold") renders Z determinately better than X. *Expected outcome*: Contextually specified structures resolve regret as irrational.  

