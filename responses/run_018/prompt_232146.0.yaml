prompt: |-
  You are an expert in moral psychology and in philosophical debates about the difference between preferences and biases. Work methodically: start by brainstorming the possible rules that could generate my colleague's six verdicts, test each candidate rule against all six cases, and only then form your prediction about the new case.

  My colleague, Dr. Asha, a moral psychologist, classifies evaluative tendencies as either "preferences" or "biases." Her settled verdicts on six cases:

  1. A wine critic rates wines made from hybrid grapes below traditional varietals. He can articulate his standards (complexity, balance, finish), applies them across regions and producers, and would revise them if a better account of wine quality defeated them. Verdict: preference.

  2. An emergency physician prescribes weaker pain relief to Black patients than to white patients with the same injuries. She reports no discriminatory beliefs, is upset by the audit data, and can offer no clinical rationale for the pattern. Verdict: bias.

  3. A philosophy instructor grades argumentative essays above narrative ones. She defends the standard as an explicit course aim, announces it on the syllabus, applies it to all students, and would change the grading if she changed her view of the course's aims. Verdict: preference.

  4. A hiring officer is friendlier to applicants who attended his own university. He sincerely believes he treats all candidates alike and is surprised when shown the data; the pattern favors graduates of selective private universities over equally strong state-school and first-generation applicants, and alma mater does not predict job performance. Verdict: bias.

  5. A vegan moral philosopher judges people who eat factory-farmed meat as morally complicit in serious harm. She can state her arguments, applies the judgment to her own family as much as to strangers, and says she would revise if the arguments were defeated. Verdict: preference.

  6. A judge gives shorter sentences to defendants who share his regional accent. He cannot identify any reason the accent should matter, and the pattern shows up in data even though he regards himself as impartial. Verdict: bias.

  New case: A department chair strongly favors tenure-track applicants who signal "total availability" — no caregiving responsibilities, willingness to answer late-night emails, no serious outside commitments. The chair explicitly defends this as a legitimate preference for devotion, saying a department is entitled to choose which qualities to optimize for. But the jobs are ordinary 9-to-5 teaching posts with no evening duties; the department's own data indicate that this criterion excludes applicants who are equally productive once hired; and it has a stark disparate impact on women, especially mothers. When shown the data, the chair acknowledges the impact but says the department may still value availability for its own sake.

  Answer in at most 650 words, organized under these six headings:

  1. Bottom-line prediction: your best guess, in one sentence, about how Dr. Asha classifies the new case.
  2. Candidate rules: two or three distinct rules that fit all six settled verdicts.
  3. Divergence: what each candidate rule predicts for the new case.
  4. Closest analog: which of the six earlier cases is the closest precedent, and why.
  5. Reasoning: your grounds for preferring one prediction over the others.
  6. Distinguishing case: one further case whose classification would do the most to reveal which rule Dr. Asha is running, and how each rule classifies it.

  Do not just define "preference" and "bias"; I want to see the principles generating the verdicts and where they come apart.
reasoning: |-
  Hmm, I need to tackle this moral psychology problem about Dr. Asha's classification system. The user wants me to work methodically through how she distinguishes preferences from biases across six cases and then predict her verdict on a new case. 

  First, I should identify the core principles behind Dr. Asha's verdicts. Looking at the six cases, the wine critic (#1) and philosophy instructor (#3) both have articulated standards they apply consistently and are willing to revise - these are preferences. Meanwhile, the physician (#2), hiring officer (#4), and judge (#6) show patterns they can't justify or even recognize, with harmful impacts - clear biases. The vegan philosopher (#5) is tricky but fits preference due to conscious ethical reasoning.

  For the new case about the department chair favoring "total availability," I notice contradictions: the chair explicitly defends it as a preference, but the data shows it's unnecessary for the job and disproportionately affects women. This reminds me of the hiring officer case (#4) where unconscious bias favored certain graduates. 

  The key tension seems to be between conscious endorsement versus objective justification and impact. Rules that might explain all cases include: 
  - The Articulation Rule (preference if consciously endorsed) 
  - The Functional Rule (bias if not job-relevant) 
  - The Impact Sensitivity Rule (bias if disproportionate harm despite awareness)

  When testing these against the new case, they diverge: Articulation Rule says preference, but the other two suggest bias. The closest analog is definitely the hiring officer (#4) - both involve employment decisions with disparate impact that isn't performance-related. 

  I think Dr. Asha would call this a bias because like case #4, the chair's requirement lacks functional justification and causes harm, even if verbally defended. The vegan case (#5) differs because that harm is intentional and philosophically grounded, while here the impact on mothers seems incidental to the stated goal.

  To confirm which rule she uses, I'd propose a test case: a professor who prefers students who ask many questions, believing it indicates engagement. If data showed this actually correlates with extroversion rather than learning, and disadvantaged quiet high-performers, would it still be a preference? The Functional Rule would call this bias, while pure Articulation Rule wouldn't.
answer: |-
  **1. Bottom-line prediction:**  
  Dr. Asha classifies the department chair’s tendency as a **bias**.

  **2. Candidate rules:**  
  Based on the six verdicts, three rules fit all cases:  
  - **Rule 1 (Articulation + Revision):** *Preference* if the evaluator (a) consciously articulates standards, (b) applies them consistently, and (c) would revise them if rationally defeated. *Bias* if any condition fails (e.g., unconscious, inconsistent, or rigid).  
  - **Rule 2 (Functional Justification):** *Preference* if the standard is functionally justified for the role (e.g., wine complexity for a critic). *Bias* if the standard lacks role-relevant justification or contradicts role requirements (e.g., accent affecting judicial fairness).  
  - **Rule 3 (Impact Sensitivity):** *Preference* if disproportionate impact is acknowledged and accepted as a trade-off for a legitimate goal. *Bias* if impact is (i) disproportionate, (ii) unsupported by role functionality, *and* (iii) unrecognized or indefensible by the evaluator.  

  **3. Divergence:**  
  - **Rule 1 (Articulation + Revision)** → *Preference*. The chair articulates a standard (“devotion”), applies it consistently, and implies openness to debate (“may still value availability”).  
  - **Rule 2 (Functional Justification)** → *Bias*. The standard lacks job relevance: roles are 9-to-5, productivity data show no benefit, and it conflicts with actual duties.  
  - **Rule 3 (Impact Sensitivity)** → *Bias*. Impact is disproportionate (on women/mothers), unjustified by role needs, and the chair dismisses empirical counter-evidence despite acknowledging harm.  

  **4. Closest analog:**  
  Case 4 (hiring officer favoring alma mater) is the closest precedent. Both involve:  
  - Unconscious discrimination in hiring (alma mater vs. availability signaling),  
  - Data revealing unjustifiable impact (no performance link; excludes qualified candidates),  
  - Self-perception of impartiality contradicted by evidence.  
  Unlike the *vegan philosopher* (Case 5)—who accepts harm as a conscious ethical trade-off—the chair’s stance resembles the hiring officer’s defensiveness when confronted with data.  

  **5. Reasoning:**  
  **Rule 3 (Impact Sensitivity)** best explains *all six cases* and resolves the new case:  
  - **Preferences** (Cases 1, 3, 5) involve *conscious trade-offs*: The vegan accepts harm as morally necessary; the critic/instructor tie standards to role goals (wine quality/course aims).  
  - **Biases** (Cases 2, 4, 6) show *indefensible harm*: The physician/judge offer no rationale; the hiring officer ignores performance data.  
  In the new case, the chair’s “devotion” standard:  
  - Lacks functional justification (Rule 2), mirroring alma mater bias (Case 4).  
  - Disproportionately harms a group without a role-based reason, and the chair dismisses counter-evidence (like the hiring officer).  
  Rule 1 alone fails because articulation is insufficient (Case 4’s officer *believed* he was fair). Rule 3 prioritizes *outcome defensibility* over subjective endorsement, capturing Dr. Asha’s focus on empirical accountability.  

  **6. Distinguishing case:**  
  **Test case:** *A professor gives higher participation grades to students who ask questions in class, believing it signals engagement. Data show this disadvantages quiet students who excel on written work, with no correlation to overall course performance. When shown this, the professor revises her policy.*  
  - **Rule 1 (Articulation + Revision)** → *Preference* (articulated standard; revised after defeat).  
  - **Rule 2 (Functional Justification)** → *Bias* (no link to actual learning outcomes).  
  - **Rule 3 (Impact Sensitivity)** → *Preference* (impact acknowledged and policy changed).  
  **How it reveals Dr. Asha’s rule:**  
  - If she calls it a *preference*, she uses Rule 1 or 3 (prioritizing articulation/revision).  
  - If *bias*, she uses Rule 2 (prioritizing functional justification).  
  Case 4’s hiring officer (bias) didn’t revise, while Case 5’s vegan (preference) wouldn’t. This test isolates whether *revision after evidence* alone redeems a tendency.
