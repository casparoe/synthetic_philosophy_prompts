prompt: |-
  so i been thinking about virtue ethics and that situationist critique where psychologists say personality barely predicts behavior, and my roommate threw together this argument that feels like it doesn't just kill virtue ethics but eats all moral judgement. i want to know where the hole is, if there is one.

  (1) Virtue ethics says being good means having stable character traits - like if you're honest, you're honest across different situations.
  (2) But situationist research (milgram, the good samaritan study, etc.) shows people flip based on tiny context changes, and the correlation between personality traits and actual behavior maxes out around .30.
  (3) So knowing john is "courageous" barely predicts he'll help someone; knowing he's in a crowd vs alone predicts way more.
  (4) Moral praise and blame are directed at the person, not at the room or the crowd they're standing in.
  (5) So if situationism is right, moral evaluation should target situations instead of agents.
  (6) But you can't blame a situation - it's not a person with intentions.
  (7) Therefore moral evaluation has no valid target, which means judging people as good or bad is basically a category mistake.
  (8) This doesn't just hurt virtue ethics; it kills retributivism, desert, blame culture, all of it.
  (9) But we clearly do and should judge people morally - it feels necessary, not optional.
  (10) So either situationism is false, or morality is mostly an illusion.

  i think maybe step 5 slips? like maybe traits don't need to predict behavior well to still be real - maybe there's "ecological validity" where virtues only show up in specific social setups? but then i'm not sure virtue ethics can still claim people have stable characters. i really want to keep that psychology is mostly right about situations mattering (step 2-3) and that moral judgement of people is legit (step 9). where exactly do i pay if i hold both?

  tell me which step is the weak link, why it looked okay at first, and what giving it up costs. if the argument is actually valid and the real issue is just picking the least painful premise to drop, say that too. also point out any hidden equivocation between "predicts behavior poorly" and "isn't a real trait."

