  2) If it's still a worthwhile disagreement
  3) What happens when we apply the same analysis to their metaontological debate

  The model answer needs to take a clear position. I'm leaning toward arguing that while the dispute is verbal in Sider's sense (no joint-carving difference), it's substantively normative - about which conceptual scheme best serves epistemic goals. For the meta-level, I'd suggest it's a fixed point where the choice of framework determines what counts as "verbal."

  For the marking scheme, these five elements seem crucial:
