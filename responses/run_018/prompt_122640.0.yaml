answer: |-
  Here's a comprehensive exam package centered on your "stipulation-proof dispute" concept, designed to hit your specified targets while avoiding the pitfalls you mentioned.

  ---

  **Essay Question**

  "Consider a first-order ontological dispute (e.g., about the existence of tables, holes, or temporal parts) that meets *all* standard diagnostics for being merely verbal (Chalmers’ paraphrase test, Hirsch’s quantifier variance, Thomasson’s paraphrase acceptance, Sider’s joint-carving agreement on fundamental facts). Both parties agree on every non-ontological fact describable in a 'neutral' vocabulary. They assent to each other’s sentences when interpreted in the *speaker’s* idiolect. Yet, they persistently disagree about which vocabulary should be used in authoritative contexts (e.g., textbooks, policy documents, joint papers), each claiming the other’s preferred terms are systematically misleading.

  1.  **Is this dispute "merely verbal"?** Explain what your verdict implies about what the *term* "verbal dispute" picks out (e.g., is it about the *content* of the dispute, the *linguistic practices* of the speakers, or something else?).
  2.  **Can this dispute still be substantive or worthwhile?** If so, what *kind* of disagreement persists (e.g., normative, pragmatic, conceptual)? Defend your answer.
  3.  **Apply the analysis recursively:** If the disputants disagree metaontologically about *what fixes the meaning* of the neutral vocabulary itself (e.g., Siderian joint-carving vs. Carnapian frameworks vs. Hirschian contexts), and *this* metaontological dispute itself meets all the same diagnostics for being verbal, what is the significance?
      *   Is this a problematic regress, a revealing fixed point, or neither?
      *   How does your answer to (iii) affect what we should conclude about the *original* first-order ontological dispute?"

  *(Word Limit: 1000 words)*

  **Likely Misread Line:** Students may misread part **(iii)** as asking *only* if the *first-order* dispute was verbal, rather than applying the *same analysis* to the *new* meta-level dispute about the neutral vocabulary. Consider rephrasing the first sentence of (iii) as: **"Now consider that the disputants *also* disagree metaontologically about *what fixes the meaning* of the 'neutral' vocabulary itself... and suppose *this metaontological dispute* itself meets all the same diagnostics for being verbal..."**

  ---

  **Model Answer (Approx. 700 words)**

  The dispute described is "merely verbal" according to the standard *content-based* criteria deployed by Chalmers, Hirsch, and Thomasson. These criteria focus on whether the parties genuinely disagree about how the *world is structured* at the fundamental level. The diagnostics confirm that both parties map each other's ontological claims onto their own conceptual scheme without contradiction and agree on all underlying non-ontological facts expressible in the neutral vocabulary. There is no residual factual disagreement about the arrangement of matter, causal relations, or observable properties. Therefore, on a content-based understanding of "verbal dispute," the verdict is clear: no substantive metaphysical disagreement remains.

  However, labeling it "merely verbal" is misleading if it implies the disagreement is trivial or resolvable by stipulation. While *content-based*, the standard diagnostics fail to capture the *normative dimension* of language use central to this dispute. The disagreement persists precisely because it is **not** merely about the world's structure, but about **which conceptual scheme best serves our epistemic and communicative goals** in authoritative contexts. Each party believes their preferred ontology provides a more perspicuous, less misleading, or more fruitful way of *representing* the agreed-upon fundamental facts. The carpenter insists "table" is indispensable for clear instruction manuals, believing "arranged woodwise" obscures functional unity. The mereological nihilist insists "arranged woodwise" is essential for precision in fundamental physics, believing "table" smuggles in false commitments to non-existent wholes. This is a **normative disagreement about conceptual adequacy**: which vocabulary more faithfully tracks relevant similarities, supports better inferences, or avoids pernicious misunderstandings in specific discursive practices. It is substantive and worthwhile because the choice of vocabulary shapes inquiry, communication, and understanding, even when agreement exists on the underlying facts. Stipulation fails because each party sees the other's preferred stipulation as *endorsing* a flawed framework.

  Applying this analysis recursively to the metaontological dispute about what fixes the meaning of the neutral vocabulary yields a **revealing fixed point**, not a vicious regress. Suppose Realist Rita grounds meaning in joint-carving structure, while Contextualist Chris grounds it in speaker intention or pragmatic context. They agree on all the *usage facts* about the neutral vocabulary (what sentences competent speakers assent to under which conditions in the actual world). Rita and Chris can paraphrase each other's metaontological claims: Rita can say Chris's "meaning is contextual" means "speaker intentions track non-joint-carving patterns," and Chris can say Rita's "meaning is joint-carving" means "speakers intend to refer to contextually salient fundamental structure." They agree on all the non-semantic facts about language use and speaker psychology describable in a *meta-neutral* vocabulary (e.g., behavioral dispositions, neurological states, social conventions).

  Their metaontological dispute now mirrors the first-order one: a normative disagreement about conceptual adequacy at the meta-level. Rita insists grounding meaning in joint-carving is essential for objective inquiry, believing contextualism leads to relativism. Chris insists grounding meaning in context is essential for understanding communication, believing realism imposes a spurious metaphysical hierarchy. This dispute is also "verbal" in the content-based sense – no disagreement about the actual usage patterns or psychological/social facts remains. Yet, it is substantive for the same normative reasons: the choice of meta-vocabulary (joint-carving vs. context) shapes how we understand meaning, reference, and the nature of ontological commitment itself.

  This recursion reveals a fixed point: **All ontological and metaontological disputes that survive exhaustive agreement on non-normative facts boil down to normative disagreements about the relative adequacy and priority of competing conceptual frameworks or representational devices.** Recognizing this fixed point profoundly impacts first-order ontology. It shows that the quest for a uniquely "correct" ontology based *solely* on matching fundamental reality is misguided once content-based verbalness is diagnosed. The "stipulation-proof" nature of the first-order dispute wasn't a failure to see it was verbal; it was a sign of the underlying normative stakes concerning which tools best serve our cognitive and communicative ends. Ontology becomes inherently **evaluative**. We don't choose tables vs. arranged atoms based *only* on what exists fundamentally (on which they agree), but on which scheme provides the most reliable, fruitful, or illuminating way to *talk about* and *interact with* that fundamental reality in specific domains. The metaontological fixed point doesn't dissolve first-order disputes; it reframes them as pragmatic and normative choices about conceptual resources, shifting the burden of argument to justifying *why* one framework is superior for our purposes. The fight over the textbook chapter *is* the substantive ontological debate, properly understood.

  ---

  **Marking Scheme (Total: 20 Marks)**

  1.  **Accurate Diagnosis of Verbalness (Content-Based) (3 marks):**
      *   *Must-hit:* Clearly states the first-order dispute *is* "merely verbal" *by the standard content-based criteria* (paraphrase, assent, factual agreement) and explains *why* (no residual factual disagreement about fundamental structure/non-ontological facts).
      *   *Common Screw-up:* Claiming it's *not* verbal because they keep arguing, or confusing verbalness with triviality. Failing to specify it's verbal *by the content-based standard*.
  2.  **Identification & Defense of Persistent Disagreement Type (Normative/Conceptual Adequacy) (5 marks):**
      *   *Must-hit:* Identifies the persistent disagreement as normative (or pragmatic/conceptual) concerning the *adequacy*, *fruitfulness*, or *non-misleadingness* of the competing vocabularies for specific purposes (e.g., textbooks, policy). Explains *why* stipulation fails (seen as endorsing a flawed framework). Argues it is substantive/worthwhile.
      *   *Common Screw-up:* Reducing it to mere "taste," personal preference without normative weight, or failing to explain *why* the choice matters (e.g., impact on communication, inference, understanding). Not addressing the "actively misleading" aspect.
  3.  **Analysis of Recursive Application & Fixed Point (6 marks):**
      *   *Must-hit:* Applies the *same* verbalness diagnostics to the *metaontological* dispute about the neutral vocabulary's meaning. Correctly concludes it is also verbal (content-based). Identifies it as a **fixed point** revealing the normative core. Clearly explains *why* it's a fixed point (recurring normative disagreement about framework adequacy) and *not* a regress (no new *kind* of disagreement emerges) or neither.
      *   *Common Screw-up:* Misinterpreting (iii) as asking if the *first-order* dispute was verbal. Claiming it *is* a regress without explaining why it stops or becomes vicious. Failing to identify the normative core at the meta-level. Saying it's "neither" without justification.
  4.  **Implications for First-Order Ontology (4 marks):**
      *   *Must-hit:* Clearly articulates how the metaontological fixed point transforms our view of the first-order dispute: Ontology becomes evaluative/pragmatic/normative. The "stipulation-proof" fight *is* the substance of the ontological debate, centered on justifying the adequacy of conceptual schemes for specific purposes, not discovering a uniquely correct fundamental structure.
      *   *Common Screw-up:* Claiming the fixed point shows all ontology is meaningless. Failing to connect the meta-level analysis back to the significance of the first-order dispute. Simply restating that the first-order dispute is normative without the meta-level insight.
  5.  **Clarity, Structure, and Argumentation (2 marks):**
      *   *Must-hit:* Well-organized, clear prose, logical flow between points, addresses all parts of the question directly, stays within word limit.
      *   *Common Screw-up:* Disorganized, verbose, tangential discussions, failing to explicitly tackle each sub-question.

  **The A/B Boundary:** An **A-grade answer (16-20)** will **do something significant with the stipulation-proof case**, particularly at the meta-level. It will use the fixed point insight to **reframe the nature of ontological debate itself** (as evaluative/normative), showing *why* the "stipulation-proof" fight matters *precisely because* it persists after content-based agreement. It will offer a coherent, argued perspective on the implications for ontology. A **B-grade answer (12-15)** will accurately **redescribe** the stipulation-proof case and the recursion, correctly identifying verbalness (content-based) and the normative disagreement, but may lack the deeper synthesis. It might state that ontology becomes pragmatic but won't convincingly show *how* the meta-level fixed point fundamentally shifts our understanding of the *point* or *substance* of the first-order dispute. It may treat the normative element as an add-on rather than the core revealed by the recursion.
