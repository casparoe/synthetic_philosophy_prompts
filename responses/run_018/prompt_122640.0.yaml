  Hmm... the tricky part is designing a question that avoids two traps: students dismissing everything with "it depends what exists means" or mechanically applying paraphrase tests. The professor wants them to wrestle with disputes that persist even when all standard diagnostics are passed.

  For the essay question, I'm considering a scenario where two ontologists agree on all facts but still fight over which vocabulary to use in authoritative texts. The question should explicitly ask:
