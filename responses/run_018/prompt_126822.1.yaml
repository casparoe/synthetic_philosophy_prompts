prompt: |-
  I serve on the employee ethics and resource committee at my regional hospital, and I need to circulate a formal recommendation before Thursday’s board meeting. Our administration has proposed a mandatory “global health contribution” policy: all clinical staff earning above the institutional median would have 6% of salary automatically deducted for certified overseas relief programs, with opt-out permitted only through a quarterly review board that requires proof of comparable direct service elsewhere. The proposal also uses a graduated scale—senior surgeons at 12%, residents at 2%—calibrated strictly to income rather than to individual capacity or role. The justification memo argues that because our specialized training gives us an exceptional ability to preserve life, retaining disposable income for non-essential consumption while preventable deaths occur elsewhere is morally equivalent to walking past a drowning child to buy coffee; allowing people to keep that money therefore treats distance and institutional routine as excuses that morality should not recognize. A substantial group of physicians and nurses has objected that this framework treats staff as “moral engines” rather than as persons with legitimate life projects, and they have pressed a specific worry I find genuinely troubling: if saving distant lives is obligatory to the point of payroll seizure, the same logic should require us to minimize sleep, eliminate vacations, and redirect all leisure spending, yet nobody proposes those measures, which suggests the policy arbitrarily selects one convenient form of sacrifice while ignoring equally required ones.

  Please act as a professional philosopher with expertise in applied ethics and institutional decision-making. Before drafting, take a moment to brainstorm carefully: consider whether institutional roles can legitimately impose demands that ordinary morality does not, whether the “drowning child” analogy survives when the rescue mechanism is a collective payroll deduction rather than an individual spontaneous act, and whether a graduated salary-based obligation confuses economic capacity with moral duty in a way that undermines fairness. Then draft the committee’s formal decision memo recommending adoption, rejection, or conditional adoption with a specific timeline and concrete conditions—state clearly what should happen by what date and who should review it. The memo must treat the staff’s “moral engines” objection with genuine seriousness, and it must include an honest, explicit acknowledgment of the strongest argument on the side you ultimately reject. Write in a polished, formal tone suitable for circulation to board members and clinical leadership. Do not include any bibliography, reading list, or citations.
reasoning: |-
  Okay, the user is part of a hospital ethics committee and needs to draft a formal recommendation about a proposed mandatory global health contribution policy. This is a complex ethical issue with strong arguments on both sides. 

  First, I need to unpack the key elements of the proposal: mandatory 6% deduction for clinical staff above median income, with opt-out only through a burdensome quarterly review. The graduated scale based purely on income (up to 12% for senior surgeons) seems problematic. The drowning child analogy used in the justification memo is emotionally compelling but philosophically shaky when applied to institutional payroll deductions.

  The staff's "moral engines" objection resonates deeply - if we accept the premise that distance doesn't matter morally, why stop at payroll deductions? Why not mandate minimized sleep and eliminated vacations? This exposes a consistency problem in the administration's argument. 

  Hmm... the user specifically asked to treat this objection seriously, which means I can't gloss over it. The strongest counterargument is actually quite powerful: the administration is right that specialized medical professionals have greater capacity to save lives, and that institutional routines shouldn't absolve us of moral responsibility. 

  But after careful thought, I'm leaning toward recommending rejection. Not because global health contributions aren't valuable, but because coercion through payroll deductions creates more ethical problems than it solves. The fairness issue with income-based scaling is particularly troubling - a resident working 80 hours/week might have less actual disposable income than a senior surgeon working 40 hours, yet would pay a lower percentage. That feels arbitrary.

  For the memo structure: formal hospital memo format, acknowledge both sides honestly, explain why we're rejecting while affirming the underlying values, suggest alternatives like opt-out rather than opt-in systems with better incentives. Need to specify clear next steps - recommend establishing a working group by specific date to design a better approach. 

  The tone must remain professional but show we've genuinely wrestled with the dilemma. No platitudes - acknowledge the administration's moral seriousness while being equally serious about the autonomy concerns. And absolutely no academic citations as requested.
answer: |-
  **MEMORANDUM**  
  **TO:** Hospital Board of Directors & Clinical Leadership  
  **FROM:** Employee Ethics and Resource Committee  
  **DATE:** October 26, 2023  
  **SUBJECT:** Recommendation on Proposed Mandatory Global Health Contribution Policy  

  ### **1. Introduction**  
  This memo communicates the Ethics Committee’s formal assessment of the proposed mandatory "Global Health Contribution" policy. After thorough deliberation, we evaluated the ethical coherence, institutional legitimacy, and practical implications of the policy. We acknowledge the administration’s moral intent to address global health inequities and the unique capacity of medical professionals to alleviate suffering. Simultaneously, we engage seriously with staff objections regarding autonomy, fairness, and moral consistency.  

  ---

  ### **2. Ethical Analysis**  
  #### **Key Considerations**  
  - **Institutional Role vs. Ordinary Morality**: While healthcare institutions may ethically encourage philanthropy, *mandating* redistributive sacrifices beyond contractual obligations risks conflating institutional authority with moral coercion. The "drowning child" analogy, while rhetor compelling, does not seamlessly extend to systemic payroll deductions. Individual rescuers act spontaneously in unique emergencies; collective, perpetual deductions institutionalize a specific moral framework, which demands broader consensus.  
  - **Graduated Scale and Fairness**: Tying obligations strictly to income conflates *economic capacity* with *moral duty*. A resident earning $60,000 may lack temporal flexibility or familial support, while a senior surgeon earning $400,000 retains greater discretionary freedom. A flat percentage scale overlooks non-financial burdens (e.g., overtime, student debt) and risks reducing moral agency to wealth metrics.  
  - **The "Moral Engines" Objection**: Staff rightly note that if preventing distant deaths is obligatory to the point of payroll seizure, consistency demands minimizing sleep, leisure, or vacations to maximize lifesaving capacity. The policy’s selective focus on financial sacrifice, while ignoring equally consequential temporal/energy sacrifices, appears arbitrary. This undermines the proposal’s moral coherence and risks treating professionals as instruments rather than persons with holistic lives.  

  #### **Strongest Argument for Adoption**  
  The administration’s core argument—that our specialized training confers a *positive duty* to aid vulnerable populations, and that proximity/distance is morally irrelevant—deserves serious respect. Preventable deaths *are* morally urgent, and institutional mechanisms *can* amplify impact. Rejecting the policy may signal complacency toward inequities we are uniquely positioned to mitigate.  

  ---

  ### **3. Committee Recommendation: REJECTION with Pathways for Revision**  
  The Committee recommends **rejecting the current policy** due to unresolved ethical tensions in its design. However, we endorse the underlying imperative to foster global health engagement and propose the following actionable alternatives:  

  #### **Conditions for Revised Policy Development**  
  1. **Establish a Working Group** (Deadline: November 30, 2023)  
     - Composed of clinical staff (including objectors), administrators, and ethicists.  
     - Task: Redesign the framework to address autonomy, fairness, and consistency concerns.  

  2. **Revised Framework Requirements**  
     - **Opt-Out Mechanism**: Replace the punitive quarterly review with a streamlined, private opt-out process (e.g., annual electronic declaration).  
     - **Graduated Scale Revision**: Base contributions on disposable income (accounting for dependents, debt) or adopt a progressive cap (e.g., 0.5%–5%), not strictly role-based tiers.  
     - **Non-Financial Contributions**: Integrate non-monetary pathways (e.g., pro-bono telemedicine, training exchanges) to satisfy obligations.  
     - **Transparency**: Allocate funds exclusively to vetted partners with audited outcomes reporting.  

  3. **Pilot Program Launch** (Deadline: Q1 2024)  
     - Implement a revised, *voluntary* program with enhanced matching incentives (e.g., hospital matches 150% of contributions).  
     - Evaluate participation rates and staff feedback after 6 months before considering mandatory elements.  

  ---

  ### **4. Addressing the "Moral Engines" Concern**  
  We affirm the staff’s objection: a policy demanding financial sacrifice while ignoring commensurate temporal/energy sacrifices risks hypocrisy. A defensible framework must either:  
  - **Limit Demands** to financially mediated obligations (acknowledging that time/health are non-fungible with money), or  
  - **Integrate Holistic Metrics** (e.g., allowing contributions via service hours).  
  The Working Group must explicitly resolve this tension to preserve moral agency.  

  ---

  ### **5. Conclusion**  
  While the Committee rejects the current proposal for its overreach and inconsistent application of moral logic, we strongly endorse its humanitarian vision. By November 30, 2023, the Working Group will draft a revised policy prioritizing equity, autonomy, and pragmatic impact. We urge the Board to champion this collaborative approach, aligning institutional ambition with the dignity of those who serve it.  

  **Signed,**  
  Employee Ethics and Resource Committee  
  Regional Hospital
