  Here’s a concise decision-tree taxonomy for your handout. Branches split on concrete claims, with camp names or "unnamed" positions at the leaves. Empty/incoherent combinations are flagged.  

  ---

  ### Does philosophy make progress? A Decision Tree  

  **1. Do core philosophical disagreements shrink over time?**  
  *(or do they mainly **recycle** with high "recycling coefficient" – old positions resurge under new jargon?)*  

  → **If YES (shrink)**:  
   **What primarily drives this convergence?**  
    → **Conceptual clarification/argument**:  
      *Progress metric*: **Eliminated false options** (weeding out incoherent views)  
      → *Camp: **Armchair progressivist** (e.g., some analytic metaphysicians)*  
      *Progress metric*: **Accumulated true ones** (building a canon of established truths)  
      → *Unnamed* (Awkward: Armchair methods yield cumulative truths without empirical input)  
      *Progress metric*: **Decision-relevance for outsiders** (e.g., clarifying ethics for policymakers)  
      → *Empty* (Conceptual convergence rarely aids external decisions alone)  
    → **Empirical input** (e.g., neuroscience in philosophy of mind):  
      *Progress metric*: **Accumulated true ones**  
      → *Camp: **Naturalist-progressivist** (e.g., Quine-inspired)*  
      *Progress metric*: **Eliminated false options** or **Decision-relevance**  
      → *Empty* (Naturalists tie truth-accumulation to empirical adjudication)  
    → **Social dynamics** (e.g., institutional power, consensus enforcement):  
      *Progress metric*: **Decision-relevance for outsiders**  
      → *Unnamed* (Awkward: Progress is power consolidation posing as truth)  
      *Progress metric*: **Accumulated true ones**  
      → ***Incoherent*** (Social drivers ≠ truth-tracking)  
      *Progress metric*: **Eliminated false options**  
      → *Empty* (Social elimination ≠ falsity; no clear examples)  

  → **If NO (mainly recycle)**:  
   **What sustains this recycling?**  
    → **Conceptual clarification/argument**:  
      *Progress metric*: **Decision-relevance for outsiders** (new tools for practical problems)  
      → *Camp: **Pluralist** (e.g., pragmatists, toolkit-focused)*  
      *Progress metric*: **Eliminated false options** or **Accumulated true ones**  
      → *Empty* (Recycling implies no elimination/accumulation)  
    → **Empirical input**:  
      *Progress metric*: Any  
      → *Unnamed* (Awkward: Empirical data reshuffles debates but never resolves them)  
    → **Social dynamics**:  
      *Progress metric*: **N/A** (denies progress exists)  
      → *Camp: **Eliminativist** (e.g., some post-Wittgensteinians)*  
      *Progress metric*: **Decision-relevance**  
      → *Camp: **Stagnationist** (e.g., Rortyan ironists)*  

  ---

  ### Key Distinctions & Empty Spots  
  - **Eliminativists vs. Pluralists**: Both deny linear accumulation, but **eliminativists** see *no* progress (social recycling + no metric), while **pluralists** see progress as *tool diversification* (recycling + decision-relevance).  
  - **Major Empty/Incoherent Spots**:  
    - Shrinkage via *social dynamics* measured by *accumulated truths* (incoherent: social forces ≠ truth-tracking).  
    - Recycling via *conceptual argument* measured by *elimination/accumulation* (empty: recycling contradicts elimination).  
  - **Unnamed Positions**: Highlight their "awkward commitments" to spark debate (e.g., *Can armchair methods accumulate truths? Is progress just power?*).  

  **Total Leaves**: 7 positions (3 shrink, 4 recycle), covering core camps while exposing conceptual tensions.
