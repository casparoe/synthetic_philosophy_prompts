answer: |-
  ## Research Proposal: Intra-Temporal Harsanyi and the Metaphysics of the Choosing Self

  **Project Title:** The Axioms of Identity: Testing Harsanyi's Aggregation Theorem Within the Temporal Self

  **Principal Investigator:** [Your Name/Title]
  **Affiliation:** [Your Institution/Independent Scholar]
  **Fellowship Period Requested:** 6 Months
  **Disciplinary Focus:** Philosophy (Decision Theory, Personal Identity, Social Choice Theory), Theoretical Economics

  **1. Core Research Question:**  
  Does Harsanyi's aggregation theorem, under its standard axiomatic constraints (Pareto Efficiency and Independence of Irrelevant Alternatives), compel a rational *single agent* to aggregate their temporally dispersed preferences via a weighted utilitarian sum, thereby implying a metaphysically unified chooser, or does its application reveal the independence axiom to be incompatible with the normative structure of a temporally extended, potentially non-unified self?

  **2. The Unexplored Gap: Why Intra-Personal Harsanyi?**  
  Harsanyi's theorem is canonically interpreted as resolving interpersonal conflict: rational social preferences, given Pareto and Independence, must be a weighted sum of individual cardinal utilities. This interpretation treats distinct individuals as the fundamental, axiomatically separable units. Crucially, the extensive literature applying or critiquing Harsanyi within social choice and welfare economics *presupposes* this interpersonal context. The axioms are understood as governing relations between ontologically distinct entities. Consequently, the possibility that these same formal constraints might govern relations between temporally distinct preference states *within a single life* remains entirely unexamined. This gap is significant because it leaves open whether Harsanyi’s result reveals a deep structural isomorphism between inter-personal conflict and intra-personal diachronic choice, or whether the theorem's derivation inherently depends on an implicit metaphysical commitment to the unity of the choosing agent over time – a commitment potentially smuggled in via the Independence axiom.

  **3. Methodology: Formal Reconstruction within Decision Theory**  
  This project will employ rigorous formal analysis, reconstructing Harsanyi’s axioms within established models of intertemporal choice and divided agency, deliberately eschewing empirical (e.g., neuroscientific) claims to focus on the *normative and conceptual* implications.

  *   **Axiomatic Translation:** Precisely define the intra-personal analogues:
      *   *Pareto Efficiency (Temporal):* If all temporal stages (e.g., Stage t1, Stage t2, ..., Stage tn) weakly prefer outcome A over B, then the overall choice rule must prefer A over B. If at least one stage strictly prefers A and none strictly prefer B, the rule must strictly prefer A.
      *   *Independence of Irrelevant Alternatives (Temporal):* The overall preference between two outcomes A and B should depend *only* on the preferences of the temporal stages regarding A and B, and be independent of preferences involving other, "irrelevant" outcomes (C, D, etc.).
  *   **Decision-Theoretic Frameworks:** Embed these translated axioms within formal models:
      *   *Time-Consistent Discounted Utility:* Examine if standard exponential discounting inherently satisfies Temporal Independence and Temporal Pareto, leading to a Harsanyi-like weighted sum (with weights determined by the discount factor).
      *   *Time-Inconsistent Models:* Analyze models like quasi-hyperbolic discounting (β-δ) where present and future "selves" are often conceptualized as distinct agents. Does imposing Temporal Pareto and Temporal Independence force convergence to *some* weighted sum (e.g., equivalent to consistent discounting), or reveal inherent contradictions?
      *   *State-Dependent Preference Models:* Consider frameworks where fundamental preferences shift over time (e.g., due to changing values or capabilities), explicitly treating each distinct preference state as a "stage-self."
  *   **Proof Strategy:** Investigate the formal possibility of deriving an aggregation theorem analogous to Harsanyi’s within these intra-personal frameworks. Does the existence of a weighted utilitarian representation for the "overall self" follow logically from Temporal Pareto and Temporal Independence? Or does the derivation encounter obstacles specific to the single-agent context?

  **4. Defensible Conclusions and Criteria for Failure:**  

  *   **Defensible Positive Conclusion:** A successful formal derivation demonstrating that Temporal Pareto and Temporal Independence *necessitate* a weighted utilitarian aggregation of stage-specific utilities would provide strong normative support for a metaphysically unified conception of the self over time. The "weights" would reflect normative principles of temporal integration (e.g., pure time preference, if defended). This would suggest Harsanyi's logic powerfully extends to the diachronic self.
  *   **Defensible Negative Conclusion:** A demonstration that Temporal Pareto and Temporal Independence are *logically incompatible* within plausible models of non-unified agency (e.g., capturing genuine preference shifts or time-inconsistency) would reveal the Independence axiom as implicitly presupposing a metaphysically unified chooser. This would expose a fundamental limitation of the theorem for intra-personal contexts and highlight a core metaphysical commitment underlying a major result in social choice.
  *   **Defensible Indeterminate Conclusion:** Showing that the axioms *allow* for both unified (weighted sum) and non-unified (e.g., context-dependent or hyperplane rules) representations would indicate the axioms alone are insufficient to resolve the metaphysics of personal identity over time, though they may constrain the viable forms of diachronic rationality.
  *   **Criteria for Failure:** The project would fail if:
      1.  The intra-personal translation of axioms proves fundamentally incoherent or trivial across all relevant models.
      2.  The analysis reveals no significant tension or implication regarding personal identity, merely replicating well-understood features of existing discounting models without novel philosophical insight.
      3.  The results remain entirely dependent on auxiliary assumptions not derived from the core Harsanyi axioms, rendering the conclusions ad hoc.

  **5. Scope, Limitations, and Contribution:**  

  *   **Scope:** This project is deliberately focused on the *formal structure* of Harsanyi's axioms and their implications within normative models of diachronic choice. It addresses the metaphysical presuppositions of a seminal theorem by testing its boundaries, not by constructing a comprehensive theory of personal identity.
  *   **Key Limitations:**
      *   It does not engage directly with empirical psychology or neuroscience regarding how people *actually* make intertemporal choices.
      *   It does not resolve broader debates about personal identity (e.g., psychological vs. biological continuity); it tests the implications of a specific formal framework for such debates.
      *   It assumes cardinal utilities for temporal stages can be meaningfully defined and interpersonally compared *within the agent*, a significant but necessary assumption mirroring Harsanyi's original setup.
  *   **Honest Assessment:** The project is ambitious in its interdisciplinary reach but tightly scoped methodologically. Success hinges on precise formal work within carefully chosen models. While unlikely to definitively "solve" the metaphysics of the self, it promises a novel, rigorous lens: using the pressure of axiomatic constraints to illuminate the implicit ontological commitments within rational choice paradigms and their migration across disciplinary lines. It will either demonstrate a powerful isomorphism between social and temporal aggregation, or expose a critical fault line where a key axiom presupposes unity, thereby enriching both philosophy of decision theory and the discourse on personal identity. The core contribution lies in rigorously testing the hidden metaphysical baggage carried by a formal result as it migrates from the social to the temporal domain.

  **6. Feasibility and Output:**  
  The six-month fellowship period is sufficient for the focused formal analysis outlined. The primary output will be a substantive journal article suitable for leading philosophy or theoretical economics journals. The PI possesses the requisite expertise in formal methods and decision theory. This project offers a unique opportunity to generate high-impact insights at the intersection of philosophy and formal social science.
