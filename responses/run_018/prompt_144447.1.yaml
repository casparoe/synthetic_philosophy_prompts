answer: |-
  ### Proposed Principle: **Preservation of the Task-Explanatory Causal Graph (PTECG)**

  Your intuitions cohere around whether a change preserves the *causal structure that explains how the task is accomplished* at a specific level of abstraction. The key is to define a **task-explanatory causal graph**—a set of intermediate variables and their causal relationships that are minimally sufficient to explain the system's behavior for the task. A mechanism is preserved if:
  1. **The graph's variables and dependencies remain identical** (structural invariance).
  2. **The functions mapping causes to effects are preserved** (functional invariance), allowing parametric changes but not algorithmic/formulaic changes.
  3. **The graph's variables retain their explanatory role** (semantic invariance)—they must correspond to the same conceptual entities in the task domain.

  This principle resolves your cases by focusing on the *explanatory intermediates* relevant to the task.

  ---

  ### Analysis of Your Cases with PTECG
  1. **Digital Twin Solver Replacement (Anomalous)**  
     - **Task-explanatory graph**: Thermodynamic variables (e.g., entropy, enthalpy) and their equations.  
     - **Change**: The neural network lacks these variables; it uses uninterpretable hidden layers.  
     - **Verdict**: Violates *structural* and *semantic* invariance.  
     - **Your verdict**: Matched (anomalous).

  2. **Pressure Transducer Replacement (Not Anomalous)**  
     - **Task-explanatory graph**: Pressure input → Electrical signal output.  
     - **Change**: Same calibration curve and failure modes; no shift in variables or dependencies.  
     - **Verdict**: Preserves *all three* invariances.  
     - **Your verdict**: Matched (not anomalous).

  3. **Arithmetic Circuit Replacement (Anomalous)**  
     - **Task-explanatory graph**: Attention head's multi-step computation (e.g., intermediate sum/carry values).  
     - **Change**: Lookup table skips computational steps; outputs intermediates without causal reasoning.  
     - **Verdict**: Violates *structural* (no causal graph) and *functional* (no computation) invariance.  
     - **Your verdict**: Matched (anomalous).

  4. **Self-Driving Front-End Replacement (Not Anomalous)**  
     - **Task-explanatory graph**: Road image → Geometric state → Steering command.  
     - **Change**: Neural network preserves geometric state (verified output); control back-end identical.  
     - **Verdict**: Preserves *structural* (same variables) and *functional* (same mapping to state) invariance. The front-end internals are not explanatory for lane-keeping.  
     - **Your verdict**: Matched (not anomalous).  
     - *Why you felt lenient*: The explanatory intermediate (geometric state) is preserved.

  5. **Medical Diagnosis Systems**  
     - **Neural Network Replacement (Anomalous)**:  
       - **Task-explanatory graph**: Bayesian nodes (diseases/symptoms) with probabilistic dependencies.  
       - **Change**: GNN clusters lack disease/symptom semantics; different graph structure.  
       - **Verdict**: Violates *structural* and *semantic* invariance.  
       - **Your verdict**: Matched (anomalous).  
     - **Expert-Elicited Bayesian Network (Not Anomalous)**:  
       - **Task-explanatory graph**: Same disease/symptom nodes and dependencies.  
       - **Change**: Only conditional probabilities (parameters) updated.  
       - **Verdict**: Preserves *structural* and *semantic* invariance; parametric changes allowed.  
       - **Your verdict**: Matched (not anomalous).

  ---

  ### Unlisted Case: Motor Cortex Implant
  **Scenario**: A brain-computer interface replaces a section of motor cortex with silicon chips. The chips reproduce original spike patterns and synaptic weights perfectly but use no biological neurons. Does this preserve the mechanism of voluntary movement?  

  **PTECG Prediction**:  
  - **Task-explanatory graph**: Spike patterns and synaptic weights (the computational-level variables explaining motor output).  
  - **Change**: Physical substrate differs, but the causal graph of spikes/weights is identical.  
  - **Verdict**: **Mechanism preserved** (not anomalous).  
    - *Structural/functional invariance*: Same spike/weight relationships.  
    - *Semantic invariance*: Spikes/weights retain explanatory role for movement.  
  - **Caveat**: If the task requires *biological mechanisms* (e.g., neurochemistry), the graph must include those variables. But for movement *control*, spikes/weights suffice.

  ---

  ### Why PTECG Works
  - **Accommodates all your verdicts** without ad hoc adjustments by focusing on the *minimal explanatory graph* for the task.  
  - **Resolves inconsistencies**:  
    - Your "strictness" in Cases 1/3 is due to explanatory intermediates being replaced (digital variables, arithmetic steps).  
    - Your "leniency" in Case 4 is because the key intermediate (geometric state) is preserved.  
    - Case 5 distinguishes structural change (new graph) vs. parametric change (same graph).  
  - **Motivations for clauses**:  
    - *Structural invariance*: Cases 1, 3, and 5a fail if the graph changes.  
    - *Functional invariance*: Case 3 fails if computations are replaced (lookup vs. arithmetic).  
    - *Semantic invariance*: Cases 1 and 5a fail if variables lose task meaning (e.g., thermodynamic properties → neural activations).

  ---

  ### If You Must Overturn a Verdict
  PTECG predicts all your verdicts, but if pressured:  
  - **Overturn your strictness on the arithmetic lookup table (Case 3)** only if you deem the attention head's *outputs* (not its internal steps) as the explanatory variables. However, this contradicts your emphasis on "multi-step reasoning."  
  - **Do not overturn self-driving leniency (Case 4)**: The verified geometric state preserves the causal pathway.

  ---

  ### Summary
  **PTECG Principle**:  
  *A mechanism is preserved iff:  
  (1) The task-explanatory causal graph (variables + dependencies) is unchanged;  
  (2) The functions mapping causes → effects are identical (parametric drift allowed);  
  (3) Graph variables retain task-semantic meaning.*  

  This grounds your intuitions in a testable framework: **Mechanistic anomaly = disruption of the causal story explaining the task.**
