prompt: |-
  Write a short story related to underdetermination of theory by evidence. There's this grad student, Mara, working on quantum decay models, and she keeps running into this weird symmetry: every explanation her lab comes up with has a perfect twin that flips all the causal arrows but spits out the exact same predictions. Her advisor tells her its just the Quine-Duhem problem and she'll get used to it, but Mara stumbles on an old philosophy forum post arguing that if two theories are empirically identical forever — not just now, but for every experiment we could ever run — then they're not really two theories at all, just one idea wearing two masks. The only way to actually tell them apart, the post claims, is to check which one generates cleaner "pre-data": the mathematical structures that haven't been applied to physics yet but could be. Mara starts running her twin-models against these unclaimed structures and finds a mismatch that shouldn't exist if the symmetry is perfect. Write the story focusing on that moment of discovery, with Mara arguing with her advisor about whether she's broken the underdetermination or just invented a fancy confirmation bias. Start with the story itself, no preface or commentary — just drop straight into the scene. And feel free to misspell a word or two if it feels natural, im not proofreading this.
