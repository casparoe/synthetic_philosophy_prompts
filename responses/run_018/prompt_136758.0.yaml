answer: |-
  The coffee machine gurgled its last bitter drops. Mara stared, unseeing, at the screen displaying two equations. Identical predictions. Again.

  "Look," she rasped, jabbing a finger at the monitor. "Model Alpha: decay cascade *causes* the neutrino phase shift. Model Beta: the phase shift *causes* the cascade. Flip every causal arrow, invert every ‘before’ and ‘after’. Same probability distribution. Every single time."

  Professor Vance sighed, adjusting his spectacles. "Mara, it’s the Quine-Duhem problem. Always has been. The evidence underdetermines the theory. You have a whole family of empirically equivalent models. Pick the prettiest one, publish, and move on. You’ll get used to the ambiguity."

  "But it’s *every* explanation we cook up!" Mara insisted, frustration cracking her voice. "It’s like the universe is mocking us with this… this *symetry*." She stumbled over the word, tired. "Two for the price of one, forever. How is that science?"

  Vance shrugged, turning back to his own calculations. "It’s just how the cookie crumbles in the foundations. Elegance, simplicity… choose your aesthetic."

  Later, bleary-eyed in the library basement, digging through dusty digital archives for *anything* on persistent underdetermination, Mara found it. A decade-old post on "PhilSciDebates(dot)net". The username was garbled nonsense, but the argument was crystalline:

  *If two theories are empirically identical not just now, but for every conceivable experiment past, present, and future – if no measurement, no matter how clever, can ever prise them apart – then they aren't truly distinct theories. They are one single conceptual entity wearing two different masks. The only way to distinguish the masks is outside the theatre of evidence: look at the ‘pre-data’. Which mathematical structures does each theory generate that haven't yet been dragged onto the physics stage? Which mask fits the unused forms?*

  *Pre-data*. The phrase lodged in Mara’s brain like a splinter. Unapplied mathematics. Structures waiting in the wings.

  What unused structures did her mirror-models generate? Mara dove back in, not modelling decay, but mapping the *mathematical byproducts* of Alpha and Beta. She ignored the physics libraries, raiding pure math repositories instead: obscure knot theories, exotic manifolds, algebras built on non-standard logics. Structures beautiful but currently homeless.

  For weeks, she fed these structures into the generative cores of Alpha and Beta. Most times, the outputs were identical echoes, reinforcing the symmetry. But then, she tried coupling them to a specific, convoluted non-commutative tensor algebra she’d found in a monograph on geometric quantization – a structure with no known physical application, pure abstract potential. Pre-data.

  She ran Alpha. The output was a complex, but internally consistent, operator lattice. Elegant, even. She held her breath. Ran Beta.

  The screen flickered. Instead of the clean lattice, the output was… jagged. Inconsistent. A term that should have commuted cleanly threw a negative sign where it shouldn't exist. A tensor product resolved into an impossible divergence. It wasn't just different; it was *wrong* within the rules of the pre-data structure itself. Beta choked on the math it supposedly generated.

  Mara’s heart hammered against her ribs. She checked the code. Re-ran it. Triple-checked the algebra input. The ugly, discordant output persisted only for Beta. Alpha sailed through.

  She burst into Vance’s office, laptop thrust forward, coffee forgotten. "Look! Look at this! I used pre-data – that unused tensor algebra! Alpha handles it fine, but Beta… it breaks. It *snags*! The symmetry isn't perfect!"

  Vance peered at the screen, then back at Mara’s flushed face. He scrolled through the outputs, his expression unreadable. He pointed at the troublesome divergence in Beta’s output. "Explain this term."

  "It’s inconsistent!" Mara insisted. "Within the rules of that specific algebra, that product *can’t* resolve that way. Beta’s internal scaffolding… it’s generating a mathematical contradiction when applied to this unused structure. Alpha doesn't."

  Vance leaned back, steepling his fingers. "Mara… this ‘pre-data’… it’s untested. Unphysical. You’re telling me you’ve broken centuries of philosophical headache – the *permanent* underdetermination Quine himself wrestled with – based on the behavior of a mathematical structure that describes *nothing* we can observe?"

  "It’s generated *by* the theory!" Mara countered, her voice tight. "It’s part of the mask! And one mask fits this unused form; the other doesn't! It *means* they aren’t identical conceptual entities! We *can* distinguish them!"

  "Or," Vance said slowly, his gaze sharp, "you’ve constructed a beautifully elaborate form of confirmation bias. You wanted the symmetry broken, so you went fishing in the vast ocean of unused mathematics until you hooked a structure that *felt* like a difference. But feeling isn't physics. Evidence is. And empirically, out there," he gestured vaguely towards the window, towards the universe, "they remain identical twins."

  Mara stared at the jagged output on her screen, the elegant lattice from Alpha beside it. The discord in Beta felt profound, a crack in the perfect mirror. But Vance’s words were cold water. Was the mismatch a revelation… or just a reflection of her own desperate hope, projected onto meaningless symbols? The weight of the Quine-Duhem problem, the ghost of those perfect twins, pressed down. Her certainty wavered, caught between the ugly snag in the math and the vast, indifferent silence of empirical equivalence.
