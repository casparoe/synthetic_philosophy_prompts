answer: |-
  ## Joint Statement: Adversarial Collaboration on the Ontology of Statue and Clay

  **Parties:**
  *   **Constitutional-Pluralist Camp (Pluralist):** Holds that a statue (e.g., *David*) and the lump of clay constituting it (e.g., *ClayDav*) are numerically distinct objects. They share all material parts at any given time but possess different modal properties (especially persistence conditions) and sortal-dependent properties (e.g., *being a statue*, *being formless clay*). Constitution is a relation between distinct objects.
  *   **Four-Dimensional-Monist Camp (Monist):** Holds that there is only one four-dimensional spatiotemporal object (space-time worm) occupying the relevant region. "Statue" and "clay" name different temporal phases, relational profiles (e.g., *having statue-form-at-t*), or descriptive perspectives on that single entity. Apparent modal or property differences are explained by temporal indexing, historical relations, or phase-relative predication, not by distinct co-located entities.

  **1. Agreed Claims**

  1.  **Material Supervenience:** All properties instantiated at a spatiotemporal region supervene on the physical properties (including arrangement, motion, and forces) of the fundamental material parts occupying that region at that time. No property difference without a physical difference.
  2.  **Empirical Phenomena Requiring Explanation:** Both camps acknowledge the following data must be accommodated by their ontologies:
      *   *Gradual Part Replacement:* An object (statue/lump) can persist despite the incremental substitution of nearly all its material parts over time.
      *   *Destructive Testing:* Removing a small, non-essential part from a statue (e.g., a sliver for analysis) typically destroys neither the statue nor the lump, while sufficiently destructive alteration (e.g., pulverization) destroys both.
      *   *Artistic Restoration:* A damaged statue can sometimes be restored to its original form using new materials, raising questions about identity and the role of original parts vs. form.
      *   *Formless Intermediate States:* Matter constituting an object (especially a lump) can exist in a state lacking the distinctive form or functional organization characteristic of that object (e.g., molten clay before molding, scattered shards after pulverization).
  3.  **Formal Features of Constitution (Pluralist Admission):** The Pluralist posits a constitution relation `C(s, l, t)` holding between distinct objects `s` (statue) and `l` (lump) at time `t`. Both camps agree that if such a relation exists, it minimally entails:
      *   *Material Coincidence:* `s` and `l` share all material parts at `t`.
      *   *Modal Difference:* `s` and `l` have different persistence conditions (e.g., `s` but not `l` is essentially statue-shaped; `l` but not `s` survives being flattened).
      *   *Non-Identity:* `C(s, l, t)` implies `s ≠ l`.
      *   *Temporary:* `C(s, l, t)` may hold only for a limited temporal interval.
      *   *Asymmetry:* Typically, `s` is constituted by `l`, not vice-versa (e.g., the statue depends on the lump for its matter, not the lump on the statue for its identity).
  4.  **Limits of Leibniz's Law Arguments:**
      *   *What They Establish:* Leibniz's Law arguments correctly establish that if two objects genuinely differ in their intrinsic properties *at a single time* (without temporal or modal indexing), then they are numerically distinct. If `s` has property `P` intrinsically at `t` while `l` lacks `P` intrinsically at `t`, then `s ≠ l`.
      *   *What They Fail to Establish (Agreed):* Leibniz's Law arguments, applied naively to temporally or modally qualified properties, fail to establish distinctness. A single object can have property `P` at time `t1` and lack it at `t2`. A single object can have a property essentially while lacking it accidentally.
      *   *Contested Modal-Difference Premises:* The core disagreement lies in whether the modal properties attributed to the statue and lump (e.g., *could survive flattening*) are genuinely possessed *simpliciter* by distinct objects co-present at `t` (Pluralist), or whether they are property ascriptions relativized to different temporal phases/perspectives of one object (Monist) or involve counterpart relations rather than *de re* modality.

  **2. Disagreements Table**

  | Dispute Point                                                                 | Pluralist Formulation                                                                                                                               | Monist Formulation                                                                                                                                                                 | Point of Divergence                                                                                                                                 |
  | :---------------------------------------------------------------------------- | :-------------------------------------------------------------------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | :-------------------------------------------------------------------------------------------------------------------------------------------------- |
  | **1. Ontological Inventory at Time `t`**                                      | At any time `t` where a statue exists constituted by a lump of clay, there exist two numerically distinct concrete particular objects: the statue and the lump. | At any time `t`, there exists only one concrete particular object: a temporally extended space-time worm; "statue" and "lump" describe different aspects or phases of this single entity. | Whether numerical distinctness applies to co-located entities sharing all parts at `t` or only to non-overlapping space-time regions.                 |
  | **2. Reference of "Statue" / "Clay"**                                         | The term "statue" refers to an object (`s`) distinct from the object (`l`) referred to by "clay", even when they coincide spatially and materially at `t`. | The terms "statue" and "clay" pick out different temporal phases, relational properties (e.g., *having statue-form*), or perspectives on the single object (`w`), not distinct objects. | Whether sortal terms denote distinct objects or denote different ways a single object can be described/experienced over time.                          |
  | **3. Basis of Persistence Conditions**                                        | Persistence conditions are kind-dependent and intrinsic to the object; `s` persists iff it retains its distinctive form/function, while `l` persists iff it retains its material continuity. | Persistence conditions describe phase-relative criteria for tracing the single object (`w`) through time; "The statue persists" means `w` is in a statue-phase, "The lump persists" means `w` is in a lump-phase. | Whether persistence conditions are properties of distinct objects or rules for identifying temporal stages of one object.                              |
  | **4. Explanation of Modal Differences**                                       | The statue (`s`) possesses the modal property *could not survive flattening* simpliciter at `t`, while the lump (`l`) possesses the modal property *could survive flattening* simpliciter at `t`. | Attributions like "could survive flattening" are true or false relative to a temporal stage or counterpart relation; they describe potential future phases of `w`, not distinct co-present objects with incompatible *de re* modal properties. | Whether modal properties are absolute properties of co-present objects or are relativized to temporal stages, counterparts, or descriptions.           |
  | **5. Nature of Sortal-Dependent Properties (e.g., *being a statue*)** | *Being a statue* is an intrinsic, non-relational property instantiated by object `s` at `t`, which `l` lacks at `t`.                                | *Being a statue* is a relational or phase-relative property (e.g., *having statue-form-at-t* or *being perceived/used as a statue-at-t*) instantiated by the single object `w` at `t`. | Whether sortal properties like *being a statue* are intrinsic properties of distinct objects or relational/phase-indexed properties of one object. |

  **3. Cruxes**

  The resolution of any single crux below would force at least one camp to significantly revise or abandon its core position.

  1.  **Crux: Intrinsicality of Artistic-Form Properties**
      *   *Question:* Is the property *having a specific artistic form F* (essential to being a statue) an intrinsic property of an object at a time, or is it a relational/historical property (e.g., being shaped by an artist with certain intentions, being recognized as art, having a certain causal history)?
      *   *Agreed Decisive Evidence/Argument:* Discovery of a metaphysically necessary connection (or lack thereof) between an object's instantaneous intrinsic physical configuration and its status as bearer of *artistic form F*. If identical intrinsic physical states *must* (or *must not*) constitute an instance of *artistic form F* regardless of history/context, that would be decisive.
      *   *Pluralist Prediction:* Artistic-form properties *are* intrinsic (supervening on instantaneous physical configuration); identical configurations imply identical form-properties.
      *   *Monist Prediction:* Artistic-form properties *are* relational/historical; identical configurations can lack the form-property if lacking the right history/context.

  2.  **Crux: Coincidence and Divergent Persistence Conditions**
      *   *Question:* Can two numerically distinct objects share all of their material parts at a time `t` and yet have genuinely different *de re* modal persistence conditions (e.g., one essentially has form F, the other does not)?
      *   *Agreed Decisive Evidence/Argument:* A successful argument demonstrating either a logical/metaphysical contradiction in attributing divergent *de re* essential properties to coincident objects, or a coherent model showing such divergence is possible without contradiction. Analysis of the grounding of these modal differences is key.
      *   *Pluralist Prediction:* Yes, distinct coincident objects can have divergent *de re* persistence conditions grounded in their different kinds.
      *   *Monist Prediction:* No, divergent *de re* persistence conditions attributed to the same matter at `t` entail distinctness only if not relativized to temporal phases; the divergence is illusory or phase-relative.

  3.  **Crux: Necessity of Causal-Historical Continuity for Artwork Identity**
      *   *Question:* Is the continuous spatio-temporal path of the original matter causally implicated in the artwork's creation strictly necessary for the persistence of the artwork (the statue) itself?
      *   *Agreed Decisive Evidence/Argument:* Clear intuitions/cases regarding perfect replication (molecule-for-molecule identical copy created elsewhere) or reassembly after dispersal/scattering *without* causal continuity to the original creation event. Does the original statue survive such events?
      *   *Pluralist Prediction:* Causal-historical continuity *is* necessary for the identity of the *statue* (the artwork), even if a distinct lump or replica exists. Perfect replicas are distinct artworks.
      *   *Monist Prediction:* Causal-historical continuity *is not* strictly necessary for the identity of the space-time worm; perfect replication creates a distinct worm. However, the *artwork identity* (as a cultural object) might depend on history, but this is derivative, not fundamental to the ontology of the object.

  4.  **Crux: Kind-Indexing of "Part"**
      *   *Question:* Is the relation *is a part of* relative to an object's kind? (e.g., Is a detached sliver still part of *the statue*? Is it still part of *the lump*?)
      *   *Agreed Decisive Evidence/Argument:* Analysis of whether the parthood relation itself requires kind-relativization to explain cases like gradual replacement, non-essential parts, and scattering. Does "`x` is part of `y` at `t`" entail a commitment to `y`'s kind?
      *   *Pluralist Prediction:* Yes, parthood is kind-relative; what counts as a part of the statue depends on the statue's functional/form requirements, distinct from what counts as a part of the constituting lump.
      *   *Monist Prediction:* No, parthood is absolute within the space-time worm; "part of the statue-phase" means part of the worm during its statue-phase, but "part of" itself isn't kind-indexed beyond spatio-temporal inclusion.

  **4. Application: The Shifting-Form Case**

  *   **Scenario:** A statue (`S`) is composed of a shape-memory material. It is heated, loses its distinctive form (`F`), and becomes a featureless ingot (`I`). Later, it is reheated and returns to possessing the *macroscopically identical* form `F`. This cycle is performed:
      *   (A) Using the original atoms.
      *   (B) Using perfect synthetic analogues (physically indistinguishable but lacking the original causal chain from the artist's creation).

  *   **Predictions:**

      | Question                                                               | Pluralist Prediction                                                                                                                               | Monist Prediction                                                                                                                                                                 |
      | :--------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------- | :-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |
      | **Does the statue `S` survive the cycle (A)?**                        | **No.** The loss of form `F` destroys `S`. Reforming creates a new statue (`S2`), even with original atoms, due to the interruption of form. The lump (`L`) survives as `I`. | **Yes.** The space-time worm (`W`) persists through all phases (statue-phase `S`, ingot-phase `I`, statue-phase `S'`). `S` and `S'` are distinct temporal phases of `W`. |
      | **Does the statue `S` survive analog-substitution (B)?**              | **No.** `S` is destroyed upon loss of form. The replica (`S_replica`) is a distinct statue due to lacking the original causal history/artistic genesis, even if materially identical. | **No.** The original worm `W` ends when the original matter is replaced. A new worm (`W_replica`) begins with the replica matter. `S_replica` is a phase of `W_replica`. |
      | **Does the clay-object survive independently of form `F`'s presence?** | **Yes.** The lump (`L`) persists as the ingot (`I`), retaining its material continuity despite the loss of `F`. `L` survives the cycle (A).                 | **Yes.** The ingot-phase (`I`) is a temporal part of the single space-time worm (`W`). The matter (as part of `W`) persists through the formless state.                             |

  **5. Verbal Disputes**

  Both camps agree that a portion of the disagreement is verbal, concerning the application of the terms "object" and "identity/survival":

  1.  **"Object":**
      *   **Dispute:** The Pluralist uses "object" to refer to entities individuated by their persistence conditions/kinds, allowing for co-location. The Monist uses "object" to refer to the maximal space-time occupant of a region (the worm).
      *   **Why Verbal:** The disagreement stems from differing criteria for what counts as a single "object" (kind-dependent vs. spatio-temporally maximal), not necessarily a disagreement about the underlying physical reality or the phenomena to be explained.
      *   **Neutral Reformulation:** Replace "object" with "entity" or "particular" when discussing fundamental inventory. Specify: "kind-individuated entity" (Pluralist) vs. "maximal space-time occupant" (Monist). Focus on describing the phenomena (e.g., "the statue-shaped phase", "the matter with continuous history") without the contested term.

  2.  **"Survival" / "Identity Over Time":**
      *   **Dispute:** The Pluralist uses "`x` survives change `C`" to mean the *same kind-individuated entity* persists through `C`. The Monist uses it to mean the *same space-time worm* persists through `C`.
      *   **Why Verbal:** The core disagreement about persistence conditions leads to applying "survives" differently. Both agree on the physical continuity; they disagree on whether that continuity constitutes the persistence of one entity or multiple.
      *   **Neutral Reformulation:** Replace "`x` survives" with "the matter/spatio-temporal region continues to exist satisfying persistence conditions associated with kind `K`" (Pluralist: `K` can vary for co-located entities) or "the spatio-temporal worm persists through a phase satisfying description `D`" (Monist). Use "persists*K*" to denote persistence relative to kind `K`.

  By adopting the proposed neutral reformulations in contexts where the verbal nature of the dispute is recognized, both camps can engage more precisely on the substantive metaphysical questions concerning the nature of constitution, persistence, and modality.
