prompt: |-
  I'm working through some issues in epistemic probability and self-location, and I've become particularly interested in how the reference class problem operates across different philosophical puzzles. I want to compare two well-known cases: the reference class ambiguity in the Sleeping Beauty problem and the reference class ambiguity underlying the Doomsday Argument.

  In the Sleeping Beauty case, the dispute between halfers and thirders seems to turn on whether Beauty should condition her belief about the coin having landed heads on the reference class of all her possible awakenings—treating Monday and Tuesday as distinct evidential situations—or on the reference class of experiments, treating each experiment as a single unit regardless of internal awakenings. Meanwhile, in the Doomsday Argument, the reasoning appears to depend on selecting a reference class of all human beings ever born, positioning oneself randomly within that temporal sequence. What I'm trying to understand is whether these two cases share a deeper structural feature regarding self-locating beliefs, or whether the reference class problem manifests differently because one involves self-location within a single life and the other involves statistical self-location within a species timeline. More specifically, I'd like you to compare how each analysis resolves the ambiguity: do halfers and Doomsday theorists rely on analogous principles for reference class selection, or do they invoke fundamentally different epistemic norms?

  Additionally, I've been considering a modified version of the Sleeping Beauty setup in which Beauty is told that the coin-flipping mechanism is causally dependent on a prior cosmological event—say, a quantum decay that only occurs in half of all branching worlds, and that this decay is necessary for her to be awakened at all. In this variant, her reference class might need to be restricted not merely by temporal position but by causal ancestry. How would this kind of causal-filtered reference class affect the halfing versus thirding debate, and is there a meaningful parallel to how Doomsday theorists might restrict their reference class by causal or evolutionary prerequisites rather than by birth order alone? Please compare these two frameworks—the standard Sleeping Beauty reference class problem and the Doomsday reference class problem—paying particular attention to whether a causal-ancestry constraint resolves, complicates, or transforms the ambiguity in either case. Justify your comparison with clear reasoning about self-locating belief and probabilistic reasoning, rather than merely describing the two puzzles separately.
