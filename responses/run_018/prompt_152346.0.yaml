  hey im a phd student in phil of science working on chaos and predictability in hierachical systems. ive been arguing with my advisor about whether determinism alone buys you predictive closure, and she has firm verdicts on a bunch of cases but i think they fit more than one rule. i want to check what shell say about my hypothetical before i write it up.

  her takes:
  - ideal frictionless harmonic oscillator: predictively closed.
  - copenhagen-style quantum collapse: open.
  - reflexive agent model where rules update on forecasts: open.
  - lorenz weather system with perfect classical measurements, no quantum cutoff: she said open, which surprised me since the dynamics are deterministic.

  my new case is a "shadow lattice" — local rules are deterministic and computable, no chaos or reflexivity, but the macroscpic observable is the limit of a sequence encoding the halting problem for inputs in the initial conditions. so its deterministic, but computing the state requires solving non-computable instances. barrier is computability, not divergence.

  what do you think shell call it, closed or open? closest analog among her four? and since her record underdetermines it, what are the two rules fitting her verdicts, what does each say about the lattice, and whats the cleanest further case where determinism and computability split that would lock down her actual principle?

  i dont need references, just sanity-checking before our meeting.
