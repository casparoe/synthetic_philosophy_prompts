answer: |-
  Here's the JSON taxonomy for navigating moral uncertainty, structured as a decision tree with concrete yes/no questions to avoid technical jargon:

  ```json
  {
    "root_question": "Can the 'goodness' or 'rightness' of an action across different moral theories (like utilitarianism, deontology, etc.) be measured using a single common scale?",
    "branches": [
      {
        "question": "Should you treat your confidence in each theory (like '30% chance utilitarianism is correct') like betting odds and choose the action with the best average moral score?",
        "yes_path": "Expected Moral Value Maximization",
        "no_path": "GAP: Shared scale without expected value maximization"
      },
      {
        "question": "Should you always follow the moral theory you find most probable, no matter how high the stakes or how small its lead?",
        "yes_path": "Follow the Most Probable Theory",
        "no_path": "Can you take actions that are 'good enough' under multiple theories at once, even if not the best for any single theory?"
      },
      {
        "question": "Can you take actions that are 'good enough' under multiple theories at once, even if not the best for any single theory?",
        "yes_path": "Do choices affecting which people will exist in the future (like having children) need fundamentally different treatment than choices affecting existing people?",
        "no_path": "Do choices affecting which people will exist in the future (like having children) need fundamentally different treatment than choices affecting existing people?"
      },
      {
        "question": "Do choices affecting which people will exist in the future (like having children) need fundamentally different treatment than choices affecting existing people?",
        "yes_path": "Split-Action Approach with Population-Specific Adjustment",
        "no_path": "Split-Action Approach"
      },
      {
        "question": "Do choices affecting which people will exist in the future (like having children) need fundamentally different treatment than choices affecting existing people?",
        "yes_path": "Special Population Ethics Only",
        "no_path": "Unnamed/Unoccupied"
      }
    ],
    "leaves": [
      {
        "position_name": "Expected Moral Value Maximization",
        "awkward_commitment": "You might endorse an action deemed horribly wrong by a theory you find plausible, if it scores highly on average across theories.",
        "occupancy_status": "occupied (e.g., William MacAskill)"
      },
      {
        "position_name": "Follow the Most Probable Theory",
        "awkward_commitment": "You must ignore the stakes: a 51% likely theory dictates actions even if a 49% theory would demand drastically different high-stakes choices.",
        "occupancy_status": "occupied (though unpopular)"
      },
      {
        "position_name": "Split-Action Approach",
        "awkward_commitment": "You might choose actions no single theory considers best, risking charges of unprincipled compromise.",
        "occupancy_status": "unoccupied (related to moral pluralism)"
      },
      {
        "position_name": "Split-Action Approach with Population-Specific Adjustment",
        "awkward_commitment": "You need separate moral rules for future population choices that don't integrate with your general uncertainty approach.",
        "occupancy_status": "unoccupied"
      },
      {
        "position_name": "Special Population Ethics Only",
        "awkward_commitment": "You handle population ethics uniquely but lack any method for other uncertain choices, creating inconsistency.",
        "occupancy_status": "unoccupied"
      },
      {
        "position_name": "Unnamed/Unoccupied",
        "awkward_commitment": "You reject all systematic approaches to moral uncertainty, offering no guidance for decisions.",
        "occupancy_status": "unoccupied"
      }
    ],
    "gaps": [
      {
        "combination_description": "Believes moral theories share a common scale but rejects maximizing expected moral value",
        "diagnosis": "Unexplored: No known alternative method proposed for this scenario."
      }
    ],
    "indistinguishable_pairs": [
      "Split-Action Approach vs. Split-Action Approach with Population-Specific Adjustment when population issues don't arise",
      "Special Population Ethics Only vs. Unnamed/Unoccupied in decisions not affecting future existence"
    ]
  }
  ```

  ### Key Features:
  1. **Concrete Questions**: Every branch uses everyday language (e.g., "betting odds," "good enough") without technical terms.
  2. **Path Logic**:
     - Starts with whether moral values are **commensurable** (shared scale).
     - If yes, branches on **expected value maximization**.
     - If no, branches on **meta-rules** → **split actions** → **population ethics**.
  3. **Leaves**: Each identifies a position (or lack thereof), its most awkward real-world implication, and whether philosophers defend it.
  4. **Gaps**: Highlights the unexplored "shared scale without maximization" combination.
  5. **Indistinguishable Pairs**: Flags positions that collapse in practice when population ethics isn't relevant.

  ### Usage Notes:
  - Presenters can traverse the tree by answering yes/no to each question.
  - "Occupancy" shows where philosophical work exists (e.g., EMV maximization is actively defended).
  - The "awkward commitments" column provides debate starters (e.g., "Is unprincipled compromise worse than inconsistency?").
  - Gaps and indistinguishable pairs highlight areas for further research.
