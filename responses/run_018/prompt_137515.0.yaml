answer: |-
  Here is a teaching plan structured as requested, presented in continuous prose:

  Begin by establishing the foundational premise: the causal closure of the physical domain. Spend significant time ensuring students grasp that, according to contemporary physical science, all physical effects have sufficient physical causes. There is no causal "gap" within the physical world where non-physical forces need to, or could, operate. Illustrate this with uncontroversial examples: a billiard ball's motion is fully determined by the impact of another ball and physical forces like friction; neural activity triggering muscle contraction follows electrochemical laws. Emphasize that this closure is a methodological commitment of physics, not a proven metaphysical truth, but one widely accepted as a working assumption. This sets the non-negotiable stage. Only once this closure is firmly in place should you introduce the core thesis of epiphenomenalism. Define it precisely: consciousness, characterized by subjective, qualitative phenomenal properties (what it’s *like* to see red, feel pain, taste salt), genuinely exists as a non-physical aspect of reality. Crucially, however, these phenomenal properties are causally inert – they are effects of physical processes (like brain states) but do not themselves cause any changes in the physical world, including subsequent brain states or behaviour. They are causally otiose by-products.

  To solidify this concept of inertness and avoid familiar tropes like zombies, introduce your central example: the "silent internal alarm." Imagine a specific, vivid phenomenal state – perhaps a sudden, intense, non-visual sense of "dread glow" or an inexplicable "cognitive chill" – that arises reliably in a subject whenever they unknowingly encounter a specific, subtle environmental danger signal (e.g., a nearly imperceptible scent associated with a toxin). Critically emphasize the stipulated features: this phenomenal state possesses undeniable, intrinsic, subjective character (it *feels* a specific, alarming way). However, it has *absolutely no causal consequences whatsoever*: it does not trigger any neural changes (no heightened amygdala activity, no alertness signals), no physiological responses (no increased heart rate, no adrenaline surge), no behavioural reactions (no flinch, no avoidance, no verbal report *triggered by it*), and crucially, no influence on the subject's cognitive processing related to danger assessment or decision-making. It is a pure, isolated "feeling" caused by the physical danger-signal processing but contributing nothing back to the physical or cognitive system. This starkly illustrates inertness without relying on pain or zombies. Immediately after presenting epiphenomenalism and this example, intercept the first major misconception. Students often conflate epiphenomenalism with eliminativism. Explicitly clarify: epiphenomenalism *affirms* the existence of consciousness; it simply denies it causal power. Eliminativism denies its existence altogether. Stress that the "silent alarm" *is real* for the subject; it’s just causally irrelevant. Confusing these renders the entire paradox nonsensical.

  Now, systematically construct the paradox of phenomenal judgment. Start with Stage 1: The Ubiquity of Reports. Point out that we constantly make sincere, seemingly accurate reports about our conscious states ("I see red," "I feel that dread glow," "I'm in pain"). These reports are physical events (vocalizations, writings, neural activations associated with speech). Stage 2: The Epiphenomenalist Constraint. Remind them that according to epiphenomenalism, the phenomenal properties themselves (the redness, the dread, the painfulness) are causally inert. They cannot influence the physical chain of events leading to the report. The report must be caused entirely by the *underlying physical brain state* that also caused the phenomenal property. Stage 3: The Accuracy Puzzle. The paradox emerges: If the phenomenal property itself plays no causal role, why do our reports *so reliably and accurately* refer *specifically* to those phenomenal properties? What ensures that a brain state causing the "dread glow" *also* causes a report about "feeling that dread glow" rather than a report about something else entirely, or nothing at all? The content of the report seems mysteriously aligned with the causally isolated phenomenal state. Present this not as a knockdown refutation, but as a deep tension within the view: how can we *know* and *report* about something that, by the theory's own lights, cannot influence our knowing or reporting mechanisms? At this point, intercept the second common misconception: the reliability dodge. Students might suggest the reports are simply unreliable or systematically mistaken. Counter this by emphasizing that epiphenomenalism, as defined, doesn't entail *error*; it entails that the *accuracy* of the reports becomes utterly inexplicable. If the phenomenal state doesn't cause the report, nothing connects the report's *content* (e.g., "dread") to the actual phenomenal property (the dread glow). The report's accuracy would be a massive, inexplicable coincidence, undermining our justification for believing *any* introspective report, including the belief in epiphenomenalism itself. This misconception must be intercepted here to prevent them from thinking the paradox is easily dissolved.

  Conclude the core session by posing the precise diagnostic question: "If epiphenomenalism is true, and my phenomenal states are causally inert, what explains the *specific content* of my report when I truthfully say 'I am experiencing the dread glow right now'? Why isn't the content of my report arbitrary or unrelated to the actual phenomenal state, given that the state itself didn't cause the report?" A satisfactory answer will grapple with the inexplicability of the report's *accurate intentional content* (its "aboutness") stemming from a state that plays no causal role in producing that content. Simply reiterating that consciousness has no effects misses the point about the *structure* of the report's meaning and its apparent grounding. Regarding omissions, deliberately avoid delving into speculative interactionist physics (e.g., quantum mind theories) or detailed contemporary neuroscientific findings challenging causal closure (e.g., Libet-style experiments or specific neural correlates debates). While acknowledging these exist, stress that the purpose here is to grasp the *conceptual structure* of epiphenomenalism and its inherent paradox at a fundamental level. Similarly, avoid extended discussions of property dualism vs. substance dualism undergirding epiphenomenalism; focus on the causal claims. The goal is clarity on the logical tension arising from combining causal closure, phenomenal realism, phenomenal inertness, and the empirical fact of accurate phenomenal reports, using your carefully constructed "silent alarm" scenario as the anchor.

  Yours sincerely,  
  A Fellow Philosophy Instructor
