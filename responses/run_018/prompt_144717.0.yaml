  Let me map the fault lines. The biggest explosion point is definitely between (2) and (3) - how can we have a duty to maximize moral excellence if supererogation exists? That needs delicate handling. Then there's the less severe but still important clash between (1) and (2): rejecting saints as models while saying everyone must pursue maximal excellence seems paradoxical at first glance. 

  The harmonizability claim (5) is actually well-protected - noting that saintly costs are objective (4) doesn't preclude harmonization in principle, it just makes it harder to achieve. That's a strategic strength in their position. And their sociological insight about universal sainthood (6) cleverly avoids contradicting individual duty (2) by making it a collective impossibility.

  For repairs... the perfectionism in (2) needs reining in. If they soften "as excellent as achievable" to "significant excellence within human limits" and emphasize circumstantial variation, it resolves multiple tensions at once. That's the minimal conceptual cost - losing some rhetorical force but gaining coherence. 

