  I've been staring at disaster-relief audit rules and I think there's a hidden philosophy in them. When an agency like FEMA gets evaluated after a hurricane, they split damage into "avoidable loss" — bad evacuation planning, underfunded levees — and "force-majeure loss" — the storm surge, the wind, things no plan could stop. The agency's scorecard only penalizes them for the first bucket. But here's the twist: the same audit manual pushes them to spend millions on "all-hazzards resilience" that treats the storm as an opoonent you can weaken with redundant grids and pre-positioned supplies. They never give a manager bonus points for being lucky, yet they act like luck can be tamed if you're prepared enough. So what view of fortune and virtù does this scorring system presuppose? Is it Machiavelli's idea that fortune is a river you can build dikes against but never dry up? Or is virtù here just statistical risk reduction wearing old clothes? Reconstruct the implicit theory, tell me whether the practice actually needs Machiavelli's framework or could run on a modern probabilistic view, and say where the logic is philosophically underdetermined — especially the part where fortune is both an excuse and an enemy.
