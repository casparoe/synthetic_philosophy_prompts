prompt: |-
  I convene a small reading group on practical rationality, and this week we stalled on decision-making under normative uncertainty in a way I suspect is really a problem about aggregation rather than about morality — I would like to know whether that diagnosis is right, and if so what exactly is being aggregated. As I understand the standard move: I have credences over several first-order moral theories, each theory assigns my available options some degree of choice-worthiness, and I am supposed to multiply each theory's verdict by my credence in it and sum, exactly as I would under empirical uncertainty. My own attempt at saying what goes wrong is that under empirical uncertainty every state–outcome pair already has a value on one shared scale, whereas here each candidate theory arguably brings its own scale and its own account of what is even being measured, so the multiplication is not well defined until I impose a common unit — and any such imposition looks like a further first-order moral commitment smuggled in under the label of a neutral second-order procedure. Is that the right place to locate the difficulty, and is there a cleaner formulation of it?

  What made me suspicious is a case I built to test the framework. Say my options are: (A) take a lucrative job and give away most of the income, (B) stay home and care for an ailing parent full time, (C) a compromise — part-time work, modest giving, partial care. One theory, in which I have credence 0.45, ranks them 100 / 0 / 60; a second, also with credence 0.45, ranks them 0 / 100 / 60; a third, with credence 0.10, does not rank A at all but declares it forbidden. If I rescale each cardinal theory onto a common range using the best and worst options in the case at hand, the compromise wins: A and B each come out at 0.45 and C at 0.54. Two things bother me here. First, no theory I give any credence to recommends C — each of the two cardinal theories thinks C throws away most of what matters — so the framework seems to generate recommendations by averaging rather than by moral reasoning, and I cannot tell whether that is a feature (moral hedging is genuinely reasonable when you are unsure) or a reductio. Second, if option B leaves the menu because a sibling takes over the care, the rescaling changes and C's advantage disappears entirely: A and C now tie at 0.45. So the recommendation depends on an option nobody was going to choose, which strikes me as the same shape as a failure of independence of irrelevant alternatives in social choice, and I wonder whether it admits a diachronic or money-pump-style argument — could someone who controls which options are on offer reliably extract something from an agent who maximises expected choice-worthiness in this way?

  I have two half-formed escape routes and I would like them assessed alongside the framework itself. A friend suggests treating the theories as parties to a bargain and aggregating by something like a Nash bargaining solution over their normalised profiles; my worry is that this just relocates the problem, since bargaining needs interpersonally comparable utilities and a disagreement point, and imports its own fairness commitments. The other thought is to normalise on a global rather than a case-relative scale — each theory's values measured against the best and worst outcomes it can express anywhere — which would restore menu-independence but seems to hand a theory with enormous stakes the same say as one with tiny stakes, and to require a moral judgement about comparative ambition that the second-order framework was supposed to avoid. Against both: the so-called my-favourite-theory rule is menu-independent and needs no comparison, but it apparently tells me to do A here even though a theory I take seriously at 10% says A is forbidden, which suggests that deontic status and scalar value cannot simply be fed into the same expectation.

  What I would like, in roughly this order: (i) an explanation of why the "just take the expectation" move fails here but succeeds under empirical uncertainty, stated sharply enough that I can tell whether my own formulation above is getting it right; (ii) an assessment of whether the menu-dependence I have illustrated is a decisive objection to case-relative normalisation, a merely cosmetic artefact of my numbers, or a symptom that the whole expected-choice-worthiness picture is misdesigned; (iii) a comparison of the alternatives — my-favourite-theory, variance-style normalisation, a global scale, and my friend's bargaining proposal — on the two worries I have raised, namely menu-sensitivity and the fact that the recommended option is one no theory endorses; and (iv) a view on whether forbidden-versus-merely-bad is a separate problem that a purely cardinal framework cannot represent, or whether it can be handled by the same machinery. Please keep it conceptual and self-contained: I am not asking for references, just for the distinctions that make the disagreement intelligible.
reasoning: |-
  Okay, the user is running a reading group on practical rationality and they're stuck on decision-making under normative uncertainty. They've presented a detailed case study with three moral theories and three options, and they're questioning the standard "expected choice-worthiness" approach. I need to unpack why this approach fails here but works under empirical uncertainty.

  First, I recall that under empirical uncertainty, all outcomes share a common utility scale. But in normative uncertainty, each moral theory has its own scale and interpretation of value. The user’s example shows this: Theory 1 and 2 use a 0-100 scale but value different things, while Theory 3 rejects option A entirely. The user’s point about scales lacking a common unit seems spot-on—this isn’t just about aggregation but about incommensurability.

  The user’s test case highlights two main issues. First, the compromise option C wins despite no theory endorsing it. Is this a valid form of moral hedging or a flaw? Second, menu-dependence: removing option B changes the outcome, violating independence of irrelevant alternatives. This resembles social choice problems. The user also wonders if this could lead to money-pump scenarios. These are valid concerns that expose deeper flaws in the framework.

  The user proposed two alternatives: Nash bargaining and global normalization. Nash bargaining requires interpersonal utility comparisons and a disagreement point, which reintroduces the same scaling problem. Global normalization uses the best/worst outcomes across all possible scenarios, but this gives extreme theories more weight and requires judging the scope of moral theories—another first-order commitment. The "my-favourite-theory" rule avoids scaling but ignores minority theories, like the 10% credence that forbids option A.

  Forbidden options pose a separate challenge. The user is right that cardinal frameworks struggle with deontic constraints. Representing forbidden as negative infinity in expectation would make any credence rule it out, but theories don’t always specify such extremes. Handling this requires more than scalar values.

  The user’s deeper needs: They want clarity on why expectation fails here versus empirical cases. They need the problem articulated sharply. Also, assessing menu-dependence as a critical flaw versus a fixable issue. Comparing alternatives on menu-sensitivity and endorsement gaps. And understanding if forbidden options are a distinct problem. Their unspoken need is likely a conceptual toolkit to navigate these debates without getting bogged in literature, focusing on distinctions that clarify the core disagreements.
answer: |-
  Your diagnosis is perceptive and correctly locates the core problem. Below, I address your queries in order, focusing on conceptual distinctions.

  ### (i) Why "just take the expectation" fails under normative uncertainty (but works under empirical uncertainty)
  - **Empirical uncertainty:** All possible outcomes share a *single, unified value scale* (e.g., utility). States of the world affect the *probability* of outcomes, but not the *measure of value itself*. Multiplying by credences and summing is coherent because values are commensurable.
  - **Normative uncertainty:** Each moral theory defines its own *incommensurable scale of choice-worthiness*. Theory 1’s "100" and Theory 2’s "100" measure entirely different constructs (e.g., welfare vs. duty). **The failure is precisely the lack of a common unit for intertheoretic comparisons.** Your formulation is correct: Expectation requires a shared scale, but no such scale exists neutrally. Any normalization (e.g., rescaling to [0,1]) imposes a substantive moral claim about how theories' units relate—a first-order commitment disguised as second-order procedure.

  ### (ii) Assessing menu-dependence
  - **Objection:** Your example shows that removing option B (which no one chooses) alters the recommendation. This violates **Independence of Irrelevant Alternatives (IIA)**—a core desideratum in rational choice.
  - **Diagnosis:** This is **a decisive objection to case-relative normalization** and a symptom of deeper misdesign:
    - Case-relative normalization makes the *meaning* of a theory’s numerical score contingent on the arbitrary menu of options. Theory 1’s "60" for C only means "60% of the value between best/worst *in this specific choice*"—not a stable unit.
    - **Consequence:** The approach is vulnerable to manipulation. If an adversary adds/extremely bad options to the menu, they can dilute or amplify a theory’s influence. Diachronic money-pumps are plausible: You might pay to exclude options that distort intertheoretic comparisons.
  - **Verdict:** Not cosmetic—it reveals that the framework lacks invariant intertheoretic units.

  ### (iii) Comparison of alternatives
  | **Approach**               | **Menu-Sensitivity** | **Endorsement Gap (C unendorsed)** | **Key Problems** |
  |----------------------------|----------------------|-----------------------------------|------------------|
  | **Expected Choice-Worthiness** | Severe (case-relative) | Severe (C wins) | Requires arbitrary normalization; violates IIA |
  | **My-Favourite-Theory**    | None                 | Moderate (A wins) | Ignores minority theories (e.g., 10% forbidding A); no hedging |
  | **Global Normalization**   | None                 | Severe (C likely wins) | Amplifies extreme theories; requires moral judgment about "scope" of value |
  | **Nash Bargaining**        | Depends on threat point | Moderate/Servere | Needs interpersonal comparisons (same scaling problem); imports fairness norms |

  - **My-Favourite-Theory:** Avoids scaling but is brittle. In your case, it picks A despite 10% credence in a theory forbidding it—an untenable cost for many.
  - **Global Normalization:** Restores menu-independence but lets a theory with vast stakes (e.g., cosmic suffering) dominate, even if your credence is low. *Also requires defining "best/worst possible outcome," which is theory-dependent and metaphysically fraught.*
  - **Nash Bargaining:** Relocates but doesn’t solve the problem. Bargaining requires:
    - **Intertheoretic comparability** (to define utility gains),
    - A **disagreement point** (what happens if theories "bargain" poorly?),
    —both of which demand the very normative commitments the framework aims to avoid.

  ### (iv) Handling "forbidden" options
  - **Is it separate?** Yes. Cardinal frameworks reduce all value to scalar quantities, but deontic constraints (e.g., "forbidden") are **categorical**. Representing "forbidden" as a large negative number fails:
    - If Theory 3 assigns A "−∞", expected value forces rejecting A regardless of credence—but this is arbitrary unless all theories agree on a "real" infinity.
    - If Theory 3 assigns A "−100" (merely "very bad"), it might be overruled by other theories (e.g., in your calculation, A wins if B is removed).
  - **The core issue:** "Forbidden" implies a *structural discontinuity* in choice-worthiness that scalar values cannot capture. Handling this requires either:
    - A separate deontic layer (e.g., "reject options any theory forbids"),
    - Or a richer representation (e.g., lexical priorities), which breaks standard aggregation.

  ### Key Takeaways
  1. **Scaling is the root problem:** Expectation fails because moral theories lack a common unit. No normalization method is theory-neutral.
  2. **Menu-dependence is fatal for case-relative scaling:** It violates IIA and enables manipulation.
  3. **Alternatives face tradeoffs:** 
     - *My-Favourite-Theory* ignores uncertainty. 
     - *Global scaling* amplifies extremism. 
     - *Bargaining* smuggles in fairness norms.
  4. **Deontic constraints are distinct:** They require non-scalar treatment (e.g., veto rules) or lexical frameworks.

  ### Why This Matters for Your Group
  The debate exposes a foundational tension: **Can rationality demand "hedging" between incommensurable moral frameworks?** Expected choice-worthiness assumes "yes," but its technical flaws suggest the task is underspecified. Your case shows how *procedural* rules (e.g., normalization) implicitly impose *substantive* moral weights (e.g., that all theories deserve "equal voice" per credence). Recognizing this reveals normative uncertainty as unavoidably first-order—a conclusion that reframes the entire problem.
