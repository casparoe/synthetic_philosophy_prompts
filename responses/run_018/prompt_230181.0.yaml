prompt: |-
  so I've been building a little side project that generates ambient instrumental music with a neural net, and a friend pointed me at Schopenhauer because he thought it'd be relevant. I ended up reading the section in The World as Will and Idea (volume 1, book 3, section 52 I think?) where Schopenhauer says music is basically different from all the other arts. The other arts, like painting or poetry, sort of copy or depict the Platonic Ideas — the Idea of a human, the Idea of a tree, whatever. But music, he says, skips the Ideas altogether and is a direct copy of the will itself. That's why it can hit you with the inner nature of things without representing any particular thing. I don't know if I've got him right, but that claim has been rattling around my head.

  So my question is: if you take that view seriously, what are its most important implications for someone like me who works with machine-generated music? Like, if music isn't representational the way visual art is, does that mean generated instrumental music automatically has some kind of authenticity — or actually the opposite, because if music is supposed to be a direct expression of the will, then maybe a neural net has no "will" there to express? Also, would Schopenhauer's view imply that a purely formal approach to music, no lyrics or program notes, is actually closer to what music fundamentally is, or is that an anachronistic reading I'm imposing? I'm not looking for a full summary of his aesthetics, more like: if I grant him this one weird claim, what should update in how I think about music, AI-generated art, and maybe even why instrumental music affects mood so strongly? I don't have formal philosophy background so pls spell out any technical terms you can't avoid.
