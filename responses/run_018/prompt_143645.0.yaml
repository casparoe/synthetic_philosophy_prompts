  don't include requests for citations, bibliographies, or reading lists; this should be fully answerable without web access and readable to someone who knows the basic paradox but still feel fresh enough that a small model can't just recycle standard intro material. also avoid putting anything in quotation marks that comes from an actual text — paraphrase without quotes. make sure the satire lands for a specialist but stays legible for a general reader who doesn't know Radford from radford.
