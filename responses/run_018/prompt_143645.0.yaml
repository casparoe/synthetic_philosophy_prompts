  hey im a phd student in phil of mind / aesthetics putting together a dataset of conceptual prompts and need one on teh paradox of ficiton. can you write me a prompt that asks for a satirical deadpan piece?

  specifically, ask for a customer-service FAQ for a fictional wellness app called "Catharsis" that treats emotional responses to fiction as a technical malfunction. it should be formatted as numbered corporate entries, around 600 words, in the voice of deadpan tech support that never breaks character. the faq should parody the standard analytic solutions — pretend-theory, thought-theory, the idea that we only quasi-emote — by framing them as troubleshooting steps for users complaining about real grief over characters that don't exist. keep the irony sustained and legible: a reader should recognize the philosophy without anyone winking, and the exaggeration should come from actual features of those positions rather than invented ones.

