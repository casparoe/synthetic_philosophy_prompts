answer: |-
  Your challenge cuts to the heart of modeling preference instability, but you're mistaking the *mechanism* for a fatal flaw. Hyperbolic discounting *predicts* precisely this context-dependence: the steep near-term drop in the discount curve means immediate cues, moods, and framing disproportionately amplify present desires relative to the future. That's not a bug; it's the core dynamic generating akrasia as a coordination failure. 

  The "contract" isn't some naive promise between static entities. It's revealed *retrospectively* in the regret of the future self when context normalizes and they confront the consequences of actions taken under distorted local preferences. When your future self, no longer hungry or tired or tempted, laments, "Why did I eat the cake/scroll Twitter/skip the gym when I *knew* I'd regret it?" – that’s the broken bargain. The stability you demand isn't in transient desires, but in the *persistent conflict* between local impulse and global valuation. Hyperbolic discounting formalizes why the present self systematically underestimates future regret *in the moment of choice*, even knowing preferences will snap back. Calling this adaptive preference revision ignores the predictable, costly reversals inherent to the phenomenon. The moral dimension isn't imposed; it emerges from the future self's experience of betrayal by their own past prioritization of fleeting states over enduring goals. 

  Your move.
