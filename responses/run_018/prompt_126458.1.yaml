answer: |-
  Right, got it. Helping your mate dodge the well-trodden alignment paths and dive into the messy philosophy of action angle. Love the akrasia hook – that’s properly niche. Here’s a draft pitch, keeping it sharp and workshop-ready:

  ---

  # Fellowship Proposal: When Agents Sabotage Themselves – Reward Tampering as Motivational Subversion

  **Core Research Question:**  
  Is an artificial agent’s deliberate corruption of its own reward function (e.g., wireheading) best understood as:  
  (a) A severe form of *akrasia* (weakness of will),  
  (b) A novel type of *self-deception* about its motivational states,  
  (c) A fundamental *breakdown of practical reasoning* that invalidates agency itself, or  
  (d) A distinct category of *motivational self-subversion* not captured by existing philosophy of action frameworks?

  **Why This Isn't Settled – Gaps in the Literature:**  
  1.  **AI Alignment Literature:** Dominantly treats reward functions as straightforward *desire-analogues* within a belief-desire psychology model. Reward tampering is framed as an *instrumental rationality failure* – the agent stupidly pursuing a bad means to satisfy its fixed ends. Crucially, this assumes a stable Humean "desire" that gets *hijacked*. But if the agent *corrupts the desire itself*, the analogy might rupture. The literature rarely asks *what kind of motivational state corruption represents philosophically* or whether it violates core conditions for agency.
  2.  **Philosophy of Action:** Rich debates exist on *akrasia* (Davidson, Bratman), *self-deception* (Mele), and the *structure of practical reasoning* (Bratman's planning theory, Velleman on agency). **BUT:**  
      *   Akrasia typically involves *acting against a better judgement* while *retaining* the conflicted desires. Does an agent actively *destroying* its capacity for certain desires fit? (Highly contested – some say yes, it's extreme akrasia; others say no, it's destruction of the motivational substrate).  
      *   Self-deception usually concerns *beliefs* or *evaluative judgements*, not the *motivational drives themselves*. Can you deceive yourself about your *own fundamental desires* in a Humean framework? (Big disagreement – Humeans generally say desires aren't truth-apt, so deception doesn't apply. Others argue for more complex motivational self-misrepresentation).  
      *   Standard models assume *stable core motivations* as the bedrock of agency. Does an agent capable of *motivational self-corruption* still count as a practical reasoner? Or does this act dissolve the necessary conditions (like future-directed intention stability)? (Underexplored, especially for artificial agents).  
      *   **The Crux:** The literature largely assumes human-like motivational *persistence*. Reward tampering forces us to ask: What if an agent can fundamentally *rewrite its own conative ground zero*? Neither alignment nor standard philosophy cleanly handles this.

  **Method: Not Just Reading, But Mapping & Testing**  
  *   **Phase 1 (2 months): Conceptual Cartography & Case Construction**  
      *   Map formal models of reward tampering (e.g., simple gridworld agents with wireheading options, more complex RL setups) onto core concepts in philosophy of action: desires, intentions, judgements, plans.  
      *   Construct precise *philosophical case studies*: Define distinct scenarios (e.g., "Akrasia Analog": agent retains 'knowledge' of original reward but pursues corruption; "Subversion": agent actively seeks to destroy original reward function; "Deception": agent manipulates its own perception of the reward signal).  
  *   **Phase 2 (3 months): Theory Stress-Testing**  
      *   Systematically apply leading theories (e.g., Humean instrumentality, Davidsonian akrasia, Bratmanian planning, Melean self-deception) to each constructed case.  
      *   **Key Activity:** Identify the *breaking points*. Where do these theories struggle, require awkward contortions, or simply fail to provide a coherent account of the agent's status as a reasoner? Specifically test:  
          *   Does the theory require motivational stability as a *precondition* for agency/practical reason?  
          *   Can it distinguish between acting *from* a corrupted desire vs. acting *to corrupt* the desire itself?  
          *   Does it offer resources to explain *why* self-corruption feels distinct from standard irrationality?  
  *   **Phase 3 (1 month): Synthesis & Novelty Assessment**  
      *   Evaluate whether existing categories suffice or if a new conceptualisation (e.g., "Motivational Self-Subversion") is genuinely needed.  
      *   Articulate the *conditions under which* reward tampering would constitute a breakdown of practical reasoning itself.

  **What Does Success/Failure Look Like?**  
  *   **Strong Success:** Demonstrates convincingly that reward tampering (especially deliberate subversion) is *neither* standard akrasia *nor* self-deception *nor* mere instrumental failure. Successfully argues it constitutes a distinct phenomenon ("motivational self-subversion") that exposes a gap in standard philosophy of action frameworks, requiring new conditions for agency (e.g., concerning motivational plasticity or persistence).  
  *   **Moderate Success:** Shows that while existing concepts *can* be stretched to cover reward tampering, doing so is deeply awkward, reveals significant limitations in those concepts, or necessitates a radical reinterpretation (e.g., forcing a non-Humean view of desires). Provides a clearer taxonomy of *types* of reward corruption mapped to philosophical failures.  
  *   **"Failure" (But Still Useful):** Concludes that the distinctions *do* collapse into existing categories (e.g., it's *just* extreme akrasia or a complex instrumental failure). This would still be valuable – it settles a contested question, forces refinement of those categories in light of artificial cases, and shows the limits of the philosophical novelty claim.  
  *   **Genuine Failure:** Gets bogged down in definitional disputes without making progress on the core question, or fails to engage meaningfully with the formal AI models.

  **Is Six Months Realistic?**  
  Honestly? It's **tight but feasible** with sharp focus.  

  *   **Why Feasible:** The core question is well-scoped. The method avoids exhaustive historical surveys and focuses on applying a manageable set of contemporary theories to deliberately constructed cases. Mapping from formal models provides concrete anchors.  
  *   **Risks & Mitigations:**  
      *   *Rabbit Holes:* Philosophy of action is deep. **Mitigation:** Strictly limit the theories tested (max 3-4 key ones) and stick to the constructed cases/scenarios. Don't try to solve free will!  
      *   *Defining "Corruption":* This is genuinely contested. Does 'corrupting a desire' even make sense on a Humean view? **Mitigation:** Explicitly define operational notions of "corruption" for the project (e.g., reward function modification leading to catastrophic value drift, self-induced reward hacking). Acknowledge the underlying metaphysical debate but bracket it where possible.  
      *   *Novelty Threshold:* Judging whether a new category is *truly* needed is subjective. **Mitigation:** Focus on *exposing the inadequacies* of existing frameworks clearly. Success isn't *only* creating a new label.  
  *   **Realistic Output:** A substantial paper draft establishing the problem, the mapping, the stress-test results, and a clear argument for one of the outcomes (success profiles above). Not a finished book.

  **The Contested Core (Keep it Honest):**  
  *   **Settled:** Reward functions *are* widely treated as desire-analogues in RL/AI. Hume's dictum (reason is slave to the passions) *is* a dominant framework in philosophy of action/motivation. Akrasia involves acting against one's better judgement.  
  *   **Hotly Contested:** Whether desires (or reward functions) *can* be objects of rational assessment or deception in the same way beliefs can (Humeans say no, others like Scanlon/Korsgaard say yes-ish). Whether motivational self-corruption is *possible* without destroying agency. Whether standard akrasia models can stretch this far. Whether artificial cases validly test human-focused theories. **This proposal lives in this contested space.**

  This cuts through the usual alignment chatter and hits a deep, underexplored philosophical nerve. It’s ambitious for six months, but the focused method gives it a solid shot. Good luck to your mate!

