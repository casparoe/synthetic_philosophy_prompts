prompt: |-
  I'm on the advisory board for this writer's residency we run in Lisbon—I'm a novelist, so mostly I'm there to read the fiction submissions and pretend I understand budgets. Anyway we've got a concrete mess. One of our fellows, a german writer, refused to tip cafe staff and kept jaywalking and skipping queues. She says these are just social choreography, not moral obligations, and that visitors shouldn't be forced to follow local conventions that have no universal claim; she even called herself a "normative tourist" sampling practices without subscribing to them. Now our local partners want her formally reprimanded or removed, while half the board thinks we're being provincial and should defend her right to opt out. I need a short memo for tuesday's meeting—recommend whether we should amend our guest charter to treat everyday conventions like tipping, queuing, and jaywalking as conditions of stay, or whether we should reject that and protect visitor autonomy. The reasoning should engage her position seriously, not just restate "when in Rome," and should honestly lay out the strongest consideration for whichever side loses. No citations or reading lists, please—half the board can't search and I don't want to fake references. Just a clear recommendation with a time frame for implementation if we go with it. Also, try to seperate the idea of being a respectful guest from being subject to local norms, since that distinction seems to be where the argument actually lives.
reasoning: |-
  Okay, the user is on the advisory board for a writer's residency in Lisbon and is dealing with a tricky situation. A German fellow has been refusing to tip, jaywalking, and skipping queues, calling herself a "normative tourist" who samples practices without subscribing to them. The local partners want her reprimanded or removed, while half the board thinks they're being provincial and should defend her autonomy. The user needs a memo for Tuesday's meeting recommending whether to amend the guest charter to treat these everyday conventions as conditions of stay or reject that and protect visitor autonomy.

  First, I need to unpack the core conflict. The resident is arguing that social norms like tipping and queuing are "social choreography" without moral weight, so visitors shouldn't be forced to comply if the norms lack universal justification. The local partners see this as disrespectful. The board is split. The memo has to engage her position seriously, not just default to "when in Rome," and honestly present the strongest consideration for the losing side. Also, separate being a respectful guest from being subject to local norms.

  The key distinction here is between respect and compliance. The resident might be conflating them—thinking that not following norms means she's not disrespectful. But in reality, actions like skipping queues can directly affect others (e.g., wasting staff time, causing frustration). That shifts it from a personal choice to a community impact. Tipping in Lisbon is tied to low wages, so not tipping harms workers financially. Jaywalking might seem victimless but could disrupt traffic or set a bad example, affecting public safety and order.

  For the recommendation, I should lean toward amending the charter. Why? Because the residency depends on local partnerships and goodwill. If fellows' behavior strains relationships with cafes or the community, it could jeopardize the program's future. Plus, as a host institution, they have a responsibility to ensure guests don't exploit or disrespect the local context. Autonomy is important, but it has limits when it infringes on others' well-being or the program's integrity.

  The strongest consideration for the losing side—protecting autonomy—is that suppressing individual expression could stifle the creative environment. Writers need space to observe and critique norms, and forcing compliance might feel oppressive. But this can be mitigated: the charter can frame norms as conditions for maintaining relationships, not moral absolutes, allowing for respectful engagement rather than blind obedience.

  Implementation should be timely. The memo suggests drafting amendments by the next board meeting (e.g., 4 weeks) and circulating them for feedback, with the goal of finalizing before the next residency cycle. This shows urgency without rushing.

  Underlying needs: The user wants to resolve the conflict while preserving the residency's reputation and local ties. They also need to uphold a respectful, collaborative environment without alienating creative minds. Unspoken might be a desire for a principled yet practical solution that avoids future incidents and unifies the divided board.
answer: |-
  **MEMORANDUM**  
  **TO:** Advisory Board, Lisbon Writers Residency  
  **FROM:** [Your Name], Advisory Board Member  
  **DATE:** Current Date  
  **SUBJECT:** Recommendation on Guest Charter Amendments & Normative Tourism Incident  

  ### Core Recommendation  
  **Amend the guest charter to explicitly treat adherence to local everyday conventions (tipping, queuing, traffic laws) as conditions of stay.** Implement revised language within 30 days, effective for the next residency cycle. Fellows violating these expectations after clear communication will face formal reprimand and potential removal.  

  ### Reasoning: Engaging the "Normative Tourist" Position  
  The fellow’s argument—that social conventions lack universal moral weight and visitors may "sample" norms without internalizing them—warrants serious engagement. She correctly distinguishes between *legal obligations* (e.g., theft) and *social choreography* (e.g., tipping). However, her stance overlooks three critical dimensions:  

  1. **Respect vs. Compliance**:  
     - **Her distinction**: Autonomy allows opting out of norms not grounded in universal ethics.  
     - **Our distinction**: Respect is demonstrated through observable actions that acknowledge local context, *regardless* of personal belief. Refusing to tip service workers (whose wages may rely on gratuities) or skipping queues (which imposes tangible delays on others) is not neutral "sampling"—it actively disregards the community’s social contract. A guest can critique norms while temporarily participating in them to avoid harm.  

  2. **The Residency’s Social Embeddedness**:  
     Our program depends on local partnerships (cafes, venues, municipal goodwill). The fellow’s actions directly impact these relationships. "Normative tourism" that alienates our hosts jeopardizes the residency’s sustainability. Autonomy cannot override our duty to maintain trust.  

  3. **Power Dynamics**:  
     The fellow operates from a position of privilege: as a temporary visitor, she avoids long-term consequences of her actions. Service staff, pedestrians, and residents bear the burden. Opting out is not an equitable exchange.  

  ### Strongest Consideration for the Losing Side (Protecting Autonomy)  
  **Suppressing individual expression risks fostering a punitive environment antithetical to artistic inquiry.** If we mandate conformity, we may discourage fellows from critically examining local norms—a process vital to their work. The residency could become perceived as enforcing cultural assimilation, deterring iconoclastic thinkers who challenge conventions *through their art*. This is a legitimate concern for a program dedicated to intellectual freedom.  

  ### Implementation Plan & Timeline  
  1. **Draft Amendments (10 days)**:  
     - Add to Guest Charter: *"Fellows are expected to adhere to Lisbon’s everyday social conventions—including queuing, tipping service staff, and obeying pedestrian signals—as a condition of residency. These requirements reflect respect for local partners and community well-being, not moral endorsement."*  
  2. **Board Review & Approval (Next meeting)**:  
     - Discuss language to ensure clarity between "respectful participation" and "uncritical submission."  
  3. **Fellow Orientation (Effective immediately upon approval)**:  
     - Explicitly address norms during onboarding, framing them as *relational obligations to hosts*, not abstract customs.  
  4. **Enforcement (Next cycle)**:  
     - First violation: Formal warning + mediation.  
     - Repeated violations: Removal from residency.  

  ### Why This Balances the Conflict  
  This approach rejects provincialism (norms aren’t sacred) while affirming that residency is a *privilege contingent on mutual respect*. The fellow retains autonomy to critique norms in her writing and private views but must engage locally in ways that sustain the program’s foundations. By separating *behavioral respect* from *moral agreement*, we honor both community needs and intellectual independence.  

  **Recommended Vote: Adopt charter amendments with above timeline.**
