  Also, the term must differentiate from convergence (where ideas evolve similarly) and true simultaneous identical inventions. For example, if two people derive the same mathematical formula independently, that's genuine identity. But Newton's fluxions vs. Leibniz's calculus are different approaches. The user wants to flag when historians treat such cases as the same.

