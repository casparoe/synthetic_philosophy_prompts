answer: |-
  Your observation captures a profound and under-analyzed historiographical operation central to the sociology of knowledge: the **retrospective construction of conceptual equivalence**. While no single, universally accepted term exists specifically for this maneuver, I propose the term **"Retrospective Equivalence Framing" (REF)** and offer a precise definition to carve it sharply from related concepts.

  **Definition of Retrospective Equivalence Framing (REF):**

  *Retrospective Equivalence Framing (REF) is the historiographical act of collapsing two (or more) historically contingent, conceptually heterogeneous, and methodologically distinct scientific achievements into a single, unified epistemic object ("Calculus," "Natural Selection," "Oxygen Theory," "Statistical Mechanics") during subsequent narration. This framing:*

  1.  **Erases Significant Differences:** Actively minimizes or ignores substantive disparities in *ontology* (what the entities are), *methodology* (how they are derived/manipulated), *problem-domain* (what questions they address), *theoretical embedding* (how they fit into larger systems), and *representation* (notation, symbols).
  2.  **Creates an Epistemic Monolith:** Constructs a singular, seemingly coherent "discovery" or "theory" as the referent object.
  3.  **Reframes Priority Disputes:** Transforms a potential debate over the nature, scope, and originality of *different* contributions into a seemingly straightforward dispute over *priority* (who got "it" first) and *ownership* of the now-monolithic entity.
  4.  **Occurs Post-Hoc:** Is a narrative strategy applied *after* the original events, often driven by disciplinary consolidation, pedagogical simplification, or the need for origin stories.
  5.  **Serves a Rhetorical/Pedagogical Function:** Aims to present a cleaner narrative of scientific progress, establish foundational concepts, or resolve messy historical contingencies for contemporary audiences.

  **Distinguishing REF from Related Concepts:**

  *   **Simultaneous Discovery / Multiple Discovery (Merton):** This describes the *phenomenon* of similar ideas arising independently. REF is the *narrative treatment* of that phenomenon, specifically one that *homogenizes* distinct ideas into "similarity" or identity. Not all accounts of multiple discovery engage in REF; some explicitly highlight differences.
  *   **Convergence of Ideas:** This implies a *process* where distinct lines of inquiry gradually move towards similarity, often through interaction or shared influences. REF is a *static, post-hoc imposition* of similarity, ignoring the distinct paths *even if convergence was minimal or non-existent* at the point of "discovery." Convergence might be a historical reality REF exploits; REF is the flattening narrative.
  *   **Independent Invention of Genuinely Identical Formalisms:** This occurs when individuals arrive at *mathematically or logically identical* constructs (e.g., deriving the same formula, proving the same theorem via the same steps). REF is precisely *inapplicable* here because the objects *are* identical. Newton/Leibniz and Darwin/Wallace are *not* examples of identical formalism; hence REF *misapplies* identity.
  *   **Whig History:** REF is a *specific mechanism within* Whig history. Whig history interprets the past *solely* through the lens of present knowledge and values, portraying progress as inevitable. REF operationalizes this by defining past achievements *only* in terms of their perceived contribution to the *current* monolithic concept, erasing their historical specificity and alternative potentials. REF is Whiggish in its teleology but specifically targets the *conflation* of heterogeneous contributions into the "winner's" framework.
  *   **Presentism:** Similar to Whiggism, but broader. REF is a form of conceptual presentism, imposing current unified categories onto the fragmented past.

  **Applying the REF Lens to Your Cases (and Others):**

  1.  **Newton vs. Leibniz (Calculus):**
      *   **Heterogeneity:** Geometric/kinematic fluxions (N) vs. symbolic differentials/combinatorics (L); different notations; different foundational concepts (limits vs. infinitesimals); different primary problem domains (physics vs. mathematics).
      *   **REF Operation:** Historians/textbooks define "Calculus" as the monolithic set of rules for differentiation/integration *we use today* (largely Leibnizian notation, but often Newtonian limits). Both are said to have "discovered calculus," obscuring their radically different conceptual systems. The priority fight becomes "who invented *this thing*?" rather than "who created *which* powerful mathematical system?"
      *   **REF Obscures?** Profoundly. It hides the different mathematical philosophies, the struggle over foundations, and the distinct paths of development in physics vs. mathematics fueled by each system.

  2.  **Darwin vs. Wallace (Natural Selection):**
      *   **Heterogeneity:** Darwin: Deep time, uniformitarianism, extensive artificial selection analogy, Malthusian struggle framed economically/socially, gradualist speciation. Wallace: Biogeographic driver, no Malthusian economic framing, minimal artificial selection evidence, potentially more open to non-gradualism (later).
      *   **REF Operation:** "The theory of evolution by natural selection" is presented as a single, coherent entity both discovered. Wallace's Ternate paper is often framed as *containing the core idea*, ignoring its narrower scope, different emphasis, and lack of Darwin's extensive evidentiary structure and analogical framework. The dispute centers on who had the idea first, not the nature of the ideas presented.
      *   **REF Obscures?** Yes. It minimizes Darwin's unique synthesis of geology, economics, and breeding, as well as Wallace's distinct biogeographic emphasis and potentially different views on mechanism. It flattens the *Origin*'s unique argumentative structure into "the idea."

  3.  **Lavoisier vs. Priestley (Oxygen):**
      *   **Heterogeneity:** Priestley: "Dephlogisticated air" – a purer form of air within the phlogiston framework, discovered via mercury calx. Lavoisier: "Oxygen" – an element, the principle of acidity, central to a new chemical system (combustion = combination with oxygen), overthrowing phlogiston.
      *   **REF Operation:** "Discovery of oxygen." Both are credited with isolating/identifying the gas, but the label "oxygen" and its framing within Lavoisier's *system* retrospectively define the discovery. Priestley is seen as having the substance but not understanding its true nature.
      *   **REF Obscures?** Crucially. It downplays the *incommensurability* of the frameworks. Priestley *did not* and *could not* conceptualize "oxygen" as Lavoisier did within his own paradigm. REF makes it seem like Priestley merely misnamed what Lavoisier correctly identified, rather than working within a fundamentally different chemical worldview. The "discovery" is defined by Lavoisier's victorious system.

  4.  **Boltzmann vs. Gibbs (Statistical Mechanics):**
      *   **Heterogeneity:** Boltzmann: Focused on the kinetic theory of gases, H-theorem, temporal evolution towards equilibrium (often probabilistic interpretations debated). Gibbs: Developed statistical mechanics axiomatically using ensembles (microcanonical, canonical, grand canonical), focusing on equilibrium states and phase space averages, more abstract and general.
      *   **REF Operation:** "Founders of statistical mechanics." Their distinct approaches (kinetic/dynamic vs. ensemble/static) and foundational focuses (justifying thermodynamics vs. providing a general probabilistic framework) are often minimized in favor of presenting them as co-discoverers of the same field.
      *   **REF Obscures?** Moderately. While their work was complementary and eventually synthesized, REF can obscure the different starting points (specific gas models vs. general ensembles), different conceptions of probability, and Boltzmann's greater struggle with foundational interpretations (irreversibility) compared to Gibbs's more formal approach. The monolithic "statistical mechanics" glosses over these distinct contributions.

  **Value for Your Seminar:**

  Introducing **Retrospective Equivalence Framing (REF)** provides your students with a critical tool to:

  1.  **Deconstruct Standard Narratives:** Identify where textbook simplifications erase historical complexity and conceptual diversity.
  2.  **Analyze Priority Disputes Sociologically:** Understand how REF transforms debates about the *nature* of contributions into debates about *timeline* and *credit*, often serving institutional or disciplinary interests in establishing clear origins.
  3.  **Appreciate Heterogeneity:** Recognize that simultaneous "discovery" often involves parallel construction of *related but distinct* intellectual edifices, not finding identical treasure chests.
  4.  **Critique Whiggish Tendencies:** Use REF as a specific case study of how presentist perspectives shape the history of science.
  5.  **Evaluate Justification:** Apply the criteria (heterogeneity in ontology/method/problem/embedding/representation) to assess *when* REF is a problematic distortion versus when a later synthesis genuinely created a unified concept that subsumed the originals (though this is rarer than often assumed at the point of "discovery").

  REF highlights that the "unit of discovery" is not a pre-existing natural kind but is often constructed retrospectively through the very narratives we use to tell the history of science, profoundly shaping our understanding of both the past and the nature of scientific knowledge itself.
