answer: |-
  Here is a systematic breakdown of desiderata for a contractualist account of aggregation, reflecting core tensions in the literature. I'll begin with informal pressures, then present a numbered list of requirements with motivating cases, and conclude with meta-analysis.

  ### Informal Pressures on Any Contractualist View
  - **Anti-Aggregation Pressure**: Contractualism’s core commitment to *individual justification* resists summing small gains/losses across persons. Complaints must retain distinct moral weight.
  - **Pro-Aggregation Pressure**: Ignoring numbers entirely leads to absurdity (e.g., saving one stranger over five identical strangers seems indefensible).
  - **Probability Pressure**: Real-world triage (e.g., ICU beds during a pandemic) involves uncertainty. Can ex ante risks ground complaints?
  - **Non-Comparability Pressure**: How to weigh vastly different *types* of burdens (e.g., death vs. temporary pain) without collapsing into utilitarianism?
  - **Scalability Pressure**: Must work for small-scale dilemmas (e.g., 1 vs. 5) and large-scale policy (e.g., vaccination allocating scarce doses to millions).

  ---

  ### Desiderata for an Adequate Contractualist Treatment of Aggregation  
  1. **Permit Saving the Greater Number When Complaints Are Equal**  
     *Motivating Case*: Identical twins drowning in separate ponds. You can save either Twin A alone or Twins B–F together (5 lives). *Requirement*: The view must justify saving the five. Contractualism cannot demand saving the one simply because "each loss is equally bad"; some priority to greater numbers must be possible without summing.  

  2. **Resist Aggregation of Trivial Burdens Against Severe Harms**  
     *Motivating Case*: "Mosquito Nets vs. Transplant": A $1M grant can either fund (A) malaria-preventing bed nets saving 1,000 children from death, or (B) one child’s life-saving heart transplant. Alternative: fund (C) noise-reducing curtains for 10 million urbanites suffering trivial sleep disruption. *Requirement*: Contractualism must forbid choosing (C) over (B), no matter how large the number. Individual complaints about severe harms cannot be overridden by pooling tiny complaints.  

  3. **Sensitivity to Ex Ante Probabilities in Risk Imposition**  
     *Motivating Case*: Vaccine allocation during a pandemic with unknown future hotspots. Protocol A slightly reduces each of 10 million people’s risk of death (0.001% each); Protocol B saves 100 identifiable lives with certainty. *Requirement*: The view must allow incorporating statistical risks into complaints (e.g., "each person has a complaint against being exposed to *unreasonable risk*"), not just actual outcomes.  

  4. **Preserve the Separateness of Persons**  
     *Motivating Case*: "Forced Organ Harvest": Killing one healthy person to distribute their organs to five dying patients. *Requirement*: The view must forbid this, emphasizing that individuals cannot be *used* as mere means to aggregate welfare. Complaints must reflect the *relational wrong* of imposing uncompensable harm on a person for others' benefit.  

  5. **Avoid Collapse into Sum-Ranking Consequentialism**  
     *Motivating Case*: "Highway Repair": A $1B project can either (A) prevent 100 traffic deaths or (B) eliminate potholes causing minor delays to 100 million commuters. *Requirement*: Contractualism must not allow summing the minor delays to outweigh deaths, even if the total "utility gain" is larger. The justificatory framework must differ structurally from utilitarianism.  

  6. **Handle Non-Identical Harms Without Ad Hoc Weighting**  
     *Motivating Case*: Saving one person from paralysis vs. saving ten from moderate chronic pain. *Requirement*: The view must offer principled grounds for comparing complaints without importing utilitarian "calibration" of well-being units.  

  ---

  ### Meta-Analysis: Tensions & Trade-offs  
  - **Likely Inconsistent Pair**: Desideratum 2 (anti-trivial-burdens) and Desideratum 5 (non-collapse) jointly conflict with Desideratum 1 (saving greater number). *Why?* Permitting aggregation in 1 vs. N cases while forbidding it in trivial-burden cases requires a principled threshold where numbers "count." No consensus exists on where this threshold lies or if it exists.  
  - **Most Eliminative Requirement**: **Desideratum 4 (Separateness of Persons)**. It rules out:  
    - Crude consequentialist aggregation (violates the "using persons" constraint).  
    - "Ex post" views that ignore how risks are distributed ex ante (e.g., ignoring probabilistic complaints).  
    - "Unconditional priority" views that always favor identifiable victims over statistical lives.  
  - **Genuine Requirements vs. Inherited Prejudices**:  
    - **Non-Negotiable**: Desiderata 4 (Separateness) and 5 (Non-Collapse) are definitional to contractualism.  
    - **Contingent/Disputed**: Desideratum 2 (Resisting Trivial Burdens) may reflect anti-utilitarian prejudice. *Why?* If minor harms *per person* are genuinely morally negligible (not just smaller), aggregating millions *might* be reasonable. Some contractualists (e.g., Otsuka) argue minor burdens *can* aggregate if sufficiently large in number.  
    - **Ambiguous**: Desideratum 3 (Ex Ante Probabilities) is both necessary for real-world relevance but risks smuggling in consequentialism if probabilities are weighed like utilities.  

  ### Key Insight for Your Piece  
  The aggregation problem persists because contractualism’s core strength—centering individual complaints—is also its weakness: it lacks a metric for *comparing distinct types of complaints* across persons that isn’t either arbitrary or covertly consequentialist. The unresolved tension is whether "reasonable rejectability" can incorporate *numbers* without losing the individual’s moral standing. The most plausible solutions (e.g., Scanlon’s "generic reasons," Kumar’s "risk sharing") all make subtle concessions to aggregation under strict constraints—but none satisfy all desiderata.  

  ---  
  This framework should equip you to critique existing proposals by mapping how they prioritize, compromise, or redefine these requirements. For deeper dives, examine Kumar (2001) on ex ante contractualism, Otsuka (2006) on aggregation, and Frick (2015) on probabilistic complaints.
