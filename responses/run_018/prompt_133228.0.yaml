answer: |-
  Below is a comprehensive specification of desiderata for an account of what pleasures share, designed to address the heterogeneity problem in hedonism. Each desideratum includes its justification via motivating cases or conceptual pressures. Conflicts between desiderata are flagged, and the niche constraint (retrospective valence drift) is integrated. Finally, a brief assessment of major theoretical approaches is provided.

  ---

  ### **Desiderata for a Unified Account of Pleasure**

  1. **Accommodation of Phenomenological Diversity**  
     *Justification*: Pleasures vary radically in qualitative character (e.g., the sharp relief of cool air on sunburn vs. the serene satisfaction of solving a proof). An account must recognize this heterogeneity without denying their status as pleasures.  
     *Motivating Case*: Classifying the visceral thrill of malicious gossip and the sublime awe of viewing a sunset as "pleasure" requires a property broad enough to encompass both, yet specific enough to exclude non-pleasures (e.g., neutral states).

  2. **Non-Reduction to Moral or Representational Properties**  
     *Justification*: Hedonism treats pleasure as intrinsically valuable, distinct from moral worth or cognitive content. A theory must avoid defining pleasure through moral appraisal (e.g., "good" desires) or representational accuracy (e.g., "correct" judgments).  
     *Motivating Case*: Malicious gossip is pleasurable *despite* being morally reprehensible; aesthetic pleasure in a tragedy persists *despite* representing suffering. Collapsing pleasure into morality or representation would undermine hedonism’s axiological neutrality.

  3. **Preservation of Mode-Specific Distinctions**  
     *Justification*: Sensory (cool air), intellectual (solving a proof), and anticipatory (e.g., savoring future revenge) pleasures feel distinct and play different roles in agency. An account must explain these as variants *of pleasure* without erasing their differences.  
     *Motivating Case*: Anticipatory pleasure in an upcoming holiday is not merely a weak sensory pleasure; intellectual pleasure in a proof resists reduction to bodily sensation.

  4. **Diachronic Comparability**  
     *Justification*: Hedonism requires comparing pleasures across time for practical reasoning (e.g., choosing between studying now for future intellectual joy or seeking immediate sensory relief). An account must enable rough quantitative comparisons.  
     *Motivating Case*: A decision to endure sunburn discomfort for an hour to finish a proof presupposes that future proof-related pleasure can outweigh present pain.

  5. **Handling of Compound Experiences**  
     *Justification*: Many pleasures fuse multiple modes (e.g., wine-tasting: gustatory delight fused with knowledge of terroir). An account must explain their unity as a *single* hedonic experience, not merely co-occurring parts.  
     *Motivating Case*: In expert wine appreciation, the pleasure is irreducible to taste *plus* cognition; altering either component changes the holistic hedonic character.

  6. **Provision of an Aggregative Metric**  
     *Justification*: Hedonism as a normative theory requires aggregating pleasures for evaluation (e.g., summing benefits in utilitarianism). An account must supply a common "currency" for this.  
     *Motivating Case*: Comparing the hedonic value of a life rich in malicious gossip versus one rich in aesthetic pursuits demands a unified scale.

  7. **Intrinsic Motivational Force**  
     *Justification*: Pleasures typically motivate pursuit (e.g., seeking cool air when sunburnt). An account must capture why pleasures are *intrinsically* motivating without conflating them with instrumental goods.  
     *Motivating Case*: The pleasure in gossip drives engagement irrespective of moral consequences; this "pull" must be inherent to pleasure itself.

  8. **Explanation of Retrospective Valence Drift** (Niche Constraint)  
     *Justification*: Memories of pleasures/pains often systematically shift in hedonic tone (e.g., a grueling hike recalled as intensely positive). An account must explain this as intrinsic to pleasure’s structure, not mere memory distortion.  
     *Motivating Case*: A stressful academic conference remembered as "invigorating" due to its intellectual rewards later; the theory must ground this drift in pleasure’s nature (e.g., temporal framing or cognitive reinterpretation).

  9. **Resistance to Hijacking by Non-Hedonic Values**  
     *Justification*: Pleasures must not depend on external values (e.g., moral desert) to avoid collapsing hedonism into pluralism.  
     *Motivating Case*: The pleasure of cool air should remain a pleasure even if one believes it is "undeserved" relief.

  ---

  ### **Flagged Tensions**
  - **Desideratum 1 (Phenomenological Diversity) vs. Desideratum 6 (Aggregative Metric)**: Deep heterogeneity challenges the possibility of a single metric. If pleasures share no common phenomenological core, quantifying them may require external (non-phenomenal) standards, risking circularity.  
  - **Desideratum 3 (Mode-Specific Distinctions) vs. Desideratum 5 (Compound Experiences)**: If modes are fundamentally distinct, explaining their "fusion" in compounds becomes problematic; if fusion is primitive, distinctions may blur.

  ---

  ### **Brief Assessment of Theoretical Approaches**
  - **Phenomenal-Character Theories** (e.g., pleasurable qualia):  
    Excels at (1), (3), (5); struggles with (6) (metric for heterogeneous qualia) and (8) (valence drift as non-phenomenal). May conflate sensory with intellectual pleasure (violating 3).  
  - **Desire-Satisfaction Accounts** (e.g., pleasure as desire-fulfillment):  
    Meets (4), (6), (7); fails (2) (desires may be moralized) and (8) (drift not explained). Reduces intellectual pleasure to desire-status (violates 3).  
  - **Attitudinal Theories** (e.g., pleasure as "taking delight in"):  
    Strong on (2), (3), (8) (attitudes can reframe memories); weak on (1) (attitudes may lack phenomenology) and (5) (attitudes toward compounds may not unify them). Risks making pleasure overly cognitive.  

  No theory satisfies all desiderata comfortably, highlighting the recalcitrance of the heterogeneity problem. Attitudinal approaches show promise for valence drift (8), while phenomenal theories best preserve heterogeneity (1). Desire accounts excel at comparability (4,6) but falter on neutrality (2).
