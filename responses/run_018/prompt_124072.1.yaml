  **A:** R_D has a fixed initial debt D_D(0) = D0. Its own compliance history accumulates debt normally: each time we compute a debt or T, we use R_D, so if compliant, D_D increases by c_D. Amendment attempts on R_D require paying the current D_D. Since D_D starts positive and grows with every use, early amendment is expensive. Rapid changes to R_D are priced out.

  **B:** But the initial D0 is arbitrary. Suppose an agent wants to amend R_D at step 1. They must pay D0. If D0 is low, they pay it and reset the system. If high, they can't. Either way, the system's behavior hinges on an arbitrary initial condition. Worse, if R_D is used once at t=0 to set initial debts, then D_D becomes D0 + c_D. Now, an agent might wait until D_D is just above T and then pay to amend R_D to set all debts to zero. That's instability by design.

  **A:** The initial state isn't arbitrary; it's set by the system's bootstrapping protocol. We can require that R_D's initial D0 be set to T_max, a constant defined by the system's capacity (e.g., maximum representable integer). Then, early amendment is prohibitively expensive. Moreover, we can make the cost of amending R_D scale with the total system debt to discourage reset attacks.

