  A defends this system, claiming it blocks liar-like paradoxes by preventing rapid self-revision. B attacks by arguing that the debt-computation rule is either amendable (leading to a bootstrap problem) or exempt (reintroducing a hierarchy that undermines the anti-foundationalist goal).

