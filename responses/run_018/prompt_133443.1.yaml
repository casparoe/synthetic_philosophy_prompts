prompt: |-
  Suppose you are advising a three-year conceptual research program on the socialist calculation debate—specifically on the unresolved philosophical issues left by the Hayek-Mises critique of central planning and Lange's iterative-planning response. Rather than asking who "won," identify the two or three open conceptual questions or underdeveloped lines of work that matter most for understanding whether non-market coordination mechanisms can replicate the epistemic functions traditionally assigned to prices. In particular, examine whether the debate's framing around "calculation" versus "discovery" still holds when computation is distributed and algorithmic, and whether tacit-knowledge objections apply differently to adaptive planning procedures than to static central boards. Rank these priorities with explicit criteria—conceptual tractability for philosophers without empirical data access, how many other questions depend on resolving each one, and relevance to modern institutional design—defend the ordering, and indicate what theoretical development over the next few years would cause you to reorder them. Do not provide bibliographies, reading lists, or citations; focus on the arguments themselves and their logical dependencies.
