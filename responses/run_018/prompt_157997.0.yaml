  Here’s a structured 90-minute role-play activity designed to immerse students in the tension between past and present selves, with clear stakes and negotiation mechanics. The activity avoids abstract lecturing, instead forcing students to confront the authority question through embodied conflict.

  ---

  ### **Activity: "The Covenant of Selves"**
  **Phase 1: Directive Drafting (15 min)**  
  - Each student writes a **binding life directive** for a hypothetical future self who has undergone a radical value shift (e.g., *"I commit to donating 50% of my income to the Church, even if I become an atheist"*).  
  - **Constraints:**  
    - Must include **concrete stakes** (e.g., access to family trust funds, a shared artistic project, or membership in a community).  
    - Must specify a **non-medical life choice** (career, faith, lifestyle, relationships).  
    - One secret **"epistemic directive"** card (pre-written by you) is shuffled into the deck:  
      > *"If I ever believe hard determinism is true, I must still act as if moral responsibility exists (blame/praise myself and others, enforce promises)."*  

  **Phase 2: Role Assignment & Setup (10 min)**  
  - Divide students into **pairs** (4 pairs for 8 students).  
  - **Roles per pair:**  
    - **Past Advocate:** Defends the authority of the directive’s author. Receives the directive *they wrote*.  
    - **Present Self:** Argues the directive no longer applies. Receives *another student’s directive* (randomly assigned).  
  - **Stakes:**  
    - Each pair shares a **Resource Pool** (10 "Life Tokens" = LT). Tokens represent concrete benefits (e.g., inheritance, creative control, social ties).  
    - To access tokens, they must **negotiate an agreement** about following/breaking the directive.  
    - No voting: Consensus required. If deadlocked after 10 min, tokens are **locked** (neither gets them).  

  **Phase 3: Negotiation Rounds (45 min)**  
  - **Round 1 (20 min):** Pairs negotiate their directives.  
    - **Rules:**  
      - Past Advocates must argue the directive is binding *based on its original rationale*.  
      - Present Selves must explain *why their current values invalidate it*.  
      - **No philosophical terms allowed** (e.g., "autonomy," "personal identity"). Use value-laden language (e.g., "betrayal," "growth," "duty").  
  - **Resource Mechanics:**  
    - If they agree to **follow the directive**: Split 10 LT (e.g., 7 to Present Self for compliance, 3 to Past Advocate for upholding intent).  
    - If they agree to **break the directive**: Split 10 LT (e.g., 3 to Present Self for "freedom," 7 to Past Advocate as "reparations").  
    - **Compromise allowed** (e.g., partial compliance: *"I’ll donate 20% not 50%"*), but must agree on LT split.  
  - **Round 2 (20 min):** Re-pair students (new Past Advocate/Present Self matchups) and repeat with new directives.  
  - **Instructor Role:** Circulate, enforce rules, and subtly escalate tension:  
    - *To Past Advocates:* "Remind them of the promises made."  
    - *To Present Selves:* "What would your life look like if you obeyed?"  

  **Phase 4: Debrief (20 min)**  
  1. **Emotional Mapping (5 min):**  
     - Ask: *"When did you feel loyalty to the past self? When did rebellion feel justified?"*  
     - Chart responses on a whiteboard: **Loyalty** (duty, honor, fear of loss) vs. **Rebellion** (inauthenticity, growth, new priorities).  

  2. **Philosophical Bridge (10 min):**  
     - **Procedural Autonomy:** "The past self set rules for future choices."  
       - Tie to moments students invoked the *process* (e.g., "I signed it," "I was rational then").  
     - **Substantive Autonomy:** "The present self demands to choose *within* their current values."  
       - Tie to moments students prioritized *current identity* (e.g., "I’m a different person now").  
     - **Epistemic Directive Spotlight:**  
       - *"Did the demand to act 'as if' responsibility exists feel different than other directives? Why?"*  
       - Highlight: It targets *rational consistency*, not happiness—forcing debate on whether reason binds us across time.  

  3. **Limitations & Open Questions (5 min):**  
     - **What the activity missed:**  
       - Whether past/present selves are "the same person" (metaphysical identity vs. psychological change).  
       - Real-world power imbalances (e.g., medical vulnerability, coercion).  
     - **Provocation:** *"If your future self radically changes, is it fair to let your past self vote?"*  

  ---

  ### **Key Design Notes**  
  - **Conflict Before Theory:** Rules force value-laden negotiation (e.g., "You’re abandoning our mission!") *before* naming autonomy concepts.  
  - **Stakes Pressure:** Tokens make the dilemma visceral—rebelling risks real loss, creating tension.  
  - **Epistemic Twist:** The determinism clause exposes how authority claims rely on rationality, not just desire.  
  - **No "Right" Answer:** The debrief validates both loyalty and rebellion, complicating simplistic autonomy narratives.  

  This structure ensures students experience the *pull* of past commitments while confronting their fragility—setting up richer abstract discussion. The resource mechanics prevent theoretical detachment, and the epistemic wildcard disrupts predictable debates.
