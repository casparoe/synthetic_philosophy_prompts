  here's the niche twist i want injected: have them fight over "ghost norms" in large-scale recommender systems. these are behavorial regularities—like users consistently upvoting the third reply in long threads—that emerge across millions of people who never talk, share no language, and have no idea the pattern exists. no human designed that specific regularity; it's just algorithmic feedback loops selecting for it. there's zero common knowledge, zero salience, no agent behind the curtain.

