  The (3)+(4) tension is more about presentation than substance. Their rejection of sharp cutoffs in (4) refers to biological continuity, while (3)'s architectural criterion is a concrete hypothesis about consciousness mechanisms. These operate at different levels - one meta-principled, one empirical. The smooth grading in (4) could manifest through recognizing that neural architectures themselves evolve continuously, so the workspace theory might permit degrees of implementation.

