answer: |-
  Your framework is largely coherent, but there are indeed points of tension that need addressing. The most substantive clash exists between (1) and (2), as they represent opposing approaches to moral reasoning under extreme uncertainty. (1) endorses expected value calculation regardless of probability size when stakes are astronomical, while (2) rejects such calculation below an "epistemic floor" where probability assignments become meaningless. This isn't superficial; it's a fundamental disagreement about handling vanishingly small credences. If you maintain both, you need a principled way to define that floor. The cheapest fix is to clarify that the epistemic floor applies *only* when we lack even a conceptual model for what sentience *could* look like in the entity—where uncertainty isn't about *degree* but about the *very possibility* of coherent description. For insects, you argue we *can* vaguely describe potential experiences (e.g., nociception-driven aversion), so (1) might still apply weakly, but your low credence in (3) keeps it negligible. Without this, (2) risks becoming an arbitrary veto on inconvenient implications of (1).

  The tension between (3) and (4) is more apparent than real. (4) rejects sharp cutoffs based on *taxonomy* ("insect vs. mammal") or superficial "alienness," advocating for graded consideration based on evolutionary/phylogenetic similarity. (3) proposes a specific *functional* criterion (recurrent processing/global workspace) believed necessary for consciousness. This is consistent with (4) if you see the neural architecture as a *continuous variable* (e.g., complexity of feedback loops) that correlates with phylogenetic distance. The "cutoff" in (3) is then not based on category but on a threshold of mechanistic complexity required for subjective experience—a position (4) doesn't inherently forbid. The conflict dissolves if you frame the architectural requirement as identifying a necessary condition that emerges gradually, not a binary switch flipped at a taxonomic boundary.

  Concern about (5) looking like special pleading compared to (1) is understandable but resolvable. Your justification—lower structural/evolutionary similarity for plants/AI—directly invokes the priors implied by (4). Plants lack any plausible neural substrate analogous to ours, breaking continuity more decisively than insects. Current AI lacks any biological basis, making the evolutionary prior effectively zero. This isn't ad hoc if your epistemic floor in (2) is tied to the plausibility of bridging the explanatory gap. For plants/AI, that gap may be genuinely unbridgeable with current concepts, pushing them below the floor where (1)'s multiplication applies. The key is ensuring your assessment of "lower similarity" for plants/AI isn't just intuition but rests on the absence of even a *speculative* model for sentience that respects continuity, unlike insects.

  Point (6) is robust and doesn't clash significantly. It reinforces that moral obligations should track facts, not our awareness of them. This actually *supports* your treatment in (2) and (5): if learning population numbers shouldn't create new duties, then duties must depend on inherent properties (like potential sentience and its prior probability, informed by phylogeny/structure), not just scale discovered late. It mildly constrains (1) by emphasizing that scale alone, divorced from reasonable prior credence, can't generate obligations.

  The hierarchy of tensions is:  
  1.  **Most Severe**: (1) vs. (2) – Foundational conflict on handling tiny probabilities.  
  2.  **Moderate**: (5) vs. (1) – Risk of perceived inconsistency in applying scale arguments.  
  3.  **Minor/Apparent**: (3) vs. (4) – Potential misperception of a functional criterion as a sharp taxonomic cutoff.  
  4.  **Negligible**: (6) vs. others – (6) is largely complementary.

  **Cheapest Fixes**:  
  -   For (1)/(2): Explicitly define the epistemic floor as applying when we cannot formulate *any* coherent model of sentience for the entity (e.g., plants, rocks, simple algorithms), not just when credence is very low. Argue insects *are* modelable (e.g., as stimulus-response with potential valence), just with very low probability given neurological evidence, so (1) formally applies but is practically negligible due to (3).  
  -   For (5): Emphasize that plants/AI fall *below* the epistemic floor defined in (2) due to radically different substrates breaking evolutionary/structural continuity, justifying exclusion from (1)'s multiplication.  
  -   For (3)/(4): Consistently frame the architectural requirement in (3) as identifying a mechanism that likely exists on a continuum and whose presence/absence correlates with phylogenetic distance, avoiding language implying a sudden emergence at a specific taxon.  

  Your core view—weighting moral patients by evolutionary continuity and structural plausibility, rejecting brute scale arguments below a threshold of meaningful uncertainty, and avoiding anthropocentrism without abandoning criteria—is internally viable with these refinements. The tensions highlight the difficulty of mapping continuous biological reality onto discrete moral categories, but your principles provide a defensible, non-arbitrary framework for navigating it.
