  *scratches head* The core issue might be conflating two different temporal perspectives. When we judge autonomy at time T1 (choice moment), later endorsement at T2 doesn't retroactively fix T1's violation. It's like saying "the theft was justified because the victim later gave permission" - but the act was still non-consensual when it happened. 

