prompt: |-
  Me and two friends run a tiny podcast on war and ethics — no academic background between us, we just argue about this stuff. Next week's guest is a philosopher (I won't name her) who defends the moral equality of combatants: the view that soldiers on both sides of a war have the same permission to fight and are equally liable to be killed, regardless of whether their side's cause is just. Her version grounds it in what she calls the "risk bargain" — you get a licence to kill the other side's soldiers in exchange for accepting the same risk yourself, and that symmetry holds even when one side is fighting an unjust war. Whenever you press her on an awkward case she fobs it off with "that's a question for the law of armed conflict, not for the morality of combat," so I'd like the questions ordered so that move gets progressively harder to fall back on.

  Draft me 8 to 10 questions, each with a follow-up keyed to the reply she's most likely to give. I want at least one on the revisionist objection — that you can't acquire a permission to kill merely by being ordered to, and that the unjust side's soldiers are morally required to lay down their arms rather than fight; at least one on whether the risk bargain survives fully remote warfare, where one state fights entirely with drones and stand-off missiles and can't meaningfully be hit back, and whether her view then slides into saying riskless killing is punishment rather than combat; and one on whether the symmetry should really be indexed to how voluntary the fighting is, i.e. whether a volunteer in an unjust war has the same standing as a conscript dragged into it. Finish with a question about what kind of evidence could actually count against the view. Skip anything biographical — assume she's heard every standard objection a hundred times.
reasoning: |-
  Okay, let me tackle this podcast host's request. They run a war ethics podcast with friends and need sharp questions for a philosopher defending the moral equality of combatants (MEC) via a "risk bargain" theory. The guest tends to deflect to legal distinctions, so I need to craft questions that force her to engage morally.

  First, I should map the core challenges they want covered: revisionist objections (McMahan-style), remote warfare asymmetries, voluntariness distinctions, and falsifiability. The deflection tactic needs special attention - each question should corner the moral logic tighter.

  For the opener, I'm considering a direct challenge: if MEC's symmetry is moral rather than legal, why does she keep invoking legal frameworks? The follow-up could expose how her "level playing field" argument might actually presuppose the justice it claims to bracket.

  The revisionist question needs teeth. Maybe contrast her bilateral permission with McMahan's unilateral liability view, then press whether "acting under orders" creates moral permission or just legal protection. The drone warfare angle is timely - if one side faces zero risk, does her bargain collapse into mere punishment? That could reveal uncomfortable implications.

  Voluntariness matters too. If a conscript and volunteer share equal liability in an unjust war, does that imply coercion is morally irrelevant? The follow-up should test whether her theory can accommodate degrees of responsibility.

  For the closer, I'm planning an epistemic question: what evidence would make her abandon MEC? This forces her to specify the theory's limits rather than defend it abstractly.

  Throughout, I'll avoid legal escape hatches by focusing on moral coherence. Each question will target internal tensions: can symmetrical permissions coexist with moral asymmetry? Does risk reciprocity actually ground morality or just describe conventions? The structure should push from foundational claims toward practical absurdities.
answer: |-
  Here are 9 tightly focused questions with aggressive follow-ups designed to corner the "risk bargain" defense of Moral Equality of Combatants (MEC), minimizing legal escape routes and pushing on key weaknesses. They build from core logic to challenging edge cases and falsifiability:

  1.  **Core Challenge to Symmetry:** "You ground MEC in a reciprocal 'risk bargain' – soldiers accept liability to be killed in exchange for permission to kill enemy soldiers. But doesn't this presuppose that *both sides* have a legitimate *reason* to be bargaining in the first place? If one side is fighting an unjust war, what moral authority grants *them* the standing to offer this 'bargain' or obligate the *just* side to accept it?"
      *   *Likely Reply:* "The bargain arises from the mutual recognition inherent in the combatant role itself, independent of the war's justice. It's a functional necessity for regulating armed conflict."
      *   **Follow-Up:** "But isn't 'functional necessity' a pragmatic or legal argument? Morally, why *should* a soldier fighting a just war recognize the 'right' of an unjust aggressor to bargain for reciprocal killing permission? Doesn't calling it a 'bargain' smuggled in an unwarranted moral symmetry?"

  2.  **Revisionist Objection - Foundation:** "Revisionists like McMahan argue soldiers on the unjust side lack the *moral* permission to kill because their cause is wrongful. How does your 'risk bargain' overcome this fundamental objection that one cannot acquire a permission to commit objectively wrongful acts (killing just combatants) simply by accepting risk oneself?"
      *   *Likely Reply:* "The combatant role creates a distinct moral sphere. By entering it, soldiers on both sides acquire special permissions and liabilities via the reciprocal risk assumption, suspending ordinary moral judgments about the war's justice at the individual combatant level."
      *   **Follow-Up:** "But *how* does accepting risk *morally transform* an objectively wrongful act (killing someone defending against aggression) into a *permissible* one? Doesn't this reduce morality to a Hobbesian exchange of threats ('I can kill you because you might kill me'), ignoring the underlying justice of *why* we are threatening each other?"

  3.  **Revisionist Objection - Duty to Disobey:** "If the revisionists are correct that unjust combatants lack moral permission to kill, they arguably have a *duty* not to fight. How does the 'risk bargain' absolve an unjust combatant of this potential duty? Doesn't framing it as a 'bargain' they've entered imply they have a *choice* to lay down their arms and reject the bargain?"
      *   *Likely Reply:* "The institutional and practical realities of war make laying down arms individually difficult and often futile or suicidal. The bargain reflects the reality of organized conflict."
      *   **Follow-Up:** "This sounds like an argument from practicality or coercion, not morality. Are you conceding that the 'risk bargain' isn't generating a true *moral permission* for the unjust combatant, but rather a pragmatic excuse or a description of how they are *treated* (legally or functionally)? Doesn't this undermine its claim to be a *moral* foundation for MEC?"

  4.  **Asymmetry - Fully Remote Warfare:** "Consider a war where State A, fighting justly, uses only infantry vulnerable to attack. State B, fighting unjustly, uses *only* remote drones and stand-off missiles from impregnable bases, facing zero physical risk to its own combatants. Does the 'risk bargain' – predicated on mutual risk – still hold? Do B's drone operators still possess the same symmetrical permission to kill A's soldiers?"
      *   *Likely Reply:* "This scenario challenges the conditions. Perhaps the bargain requires a context of mutual risk. B's operators may not be legitimate combatants under the bargain model if they face no reciprocal risk."
      *   **Follow-Up:** "If mutual risk is *essential* to the bargain generating permission, doesn't that mean MEC *collapses* under significant asymmetry? And if B's operators *lack* permission, what is the moral status of A's soldiers killing *them* if possible? Is it now punishment, not combat? Doesn't this show the 'bargain' is fragile and context-dependent, not a robust moral principle?"

  5.  **Asymmetry - Voluntariness:** "Does the moral force of the 'risk bargain' depend on how *voluntary* participation is? Does a conscript dragged into an unjust war have the *same* moral standing within this bargain (same permission/liability) as a volunteer enthusiastically joining the same unjust cause?"
      *   *Likely Reply:* "The bargain attaches to the role of combatant, not the voluntariness of assuming it. Both are equally liable targets and possess the same permissions to kill enemy combatants."
      *   **Follow-Up:** "Doesn't this lead to a deeply counterintuitive result? The coerced conscript, forced to fight for an unjust cause, is morally *permitted* to kill just soldiers defending their homeland? And the just soldier is *equally permitted* to kill this coerced individual as they are the eager volunteer? How is this morally coherent? Doesn't voluntariness fundamentally impact moral responsibility and blameworthiness, which your symmetrical model seems to erase?"

  6.  **Targeting Non-Combatants (Testing Consistency):** "If the permission to kill is derived solely from the combatant's participation in the risk bargain, does this mean intentionally targeting an *enemy non-combatant* (e.g., a factory worker not involved in weapons production) is always morally prohibited for *both* sides, even if strategically useful for the just cause?"
      *   *Likely Reply:* "Yes, absolutely. Non-combatants are not party to the risk bargain and retain their immunity."
      *   **Follow-Up:** "But if a just combatant kills an unjust combatant (per your bargain), they kill someone who arguably bears far *less* moral responsibility for the unjust war than, say, a high-level civilian propagandist actively inciting it. Why does the propagandist retain immunity due to non-participation in the 'bargain,' while the low-level conscript on the unjust side is both permitted to kill and liable to be killed? Doesn't this disconnect between liability and *moral culpability* for the war itself undermine the bargain's moral plausibility?"

  7.  **The "Bargain" as Social Fact vs. Moral Justification:** "Is the 'risk bargain' primarily a *description* of a social/conventional fact about how combatants mutually recognize each other, or is it a *normative moral justification* for why they *should* have symmetrical permissions/liabilities? If it's the former, doesn't it just describe the MEC phenomenon without justifying it morally?"
      *   *Likely Reply:* "It's both. The reciprocal recognition and risk assumption *creates* the distinct moral permissions and liabilities of the combatant role."
      *   **Follow-Up:** "But how does a *convention* or *mutual recognition* between two groups, one of which is engaged in profound injustice, *generate moral permissions*? If two muggers mutually recognize each other's 'right' to mug victims and accept the risk of police intervention, does that make mugging morally permissible for them? If not, why does the combatants' mutual recognition succeed where the muggers' fails?"

  8.  **Internal Coherence - Defensive Killing:** "Imagine an unjust combatant encounters a just combatant who is asleep or otherwise completely defenseless and poses no immediate threat. According to MEC and the risk bargain, does the unjust combatant still have the *moral permission* to kill the just combatant in this moment?"
      *   *Likely Reply:* "The permission stems from their status as combatants engaged in the conflict, not the immediate tactical situation. Yes, they retain that permission."
      *   **Follow-Up:** "How can killing a defenseless person, who poses no threat *at that moment* and is fighting for a just cause, be morally permissible simply because both are nominally 'combatants'? Doesn't this starkly contradict the core intuition that killing requires justification (like self-defense) and that killing the defenseless is particularly egregious? Doesn't this expose the 'bargain' as overriding fundamental moral constraints?"

  9.  **Falsifiability - What Could Disprove It?:** "Finally, to understand the nature of your commitment to the risk-bargain MEC: What kind of evidence, argument, or hypothetical scenario *could*, in principle, convince you that symmetrical moral permissions for combatants, regardless of their war's justice, is *incorrect*? What would falsify the core moral claim?"
      *   *Likely Reply:* "A demonstration that the reciprocity of risk and role recognition cannot generate distinct permissions/liabilities distinct from the underlying justice of the war, or that it leads to unavoidable contradictions with more fundamental moral principles that cannot be resolved."
      *   **Follow-Up:** "Given your responses today, where you've consistently maintained symmetry even in cases of extreme asymmetry (remote warfare), coercion (conscripts), and defenselessness, doesn't this suggest the theory is effectively unfalsifiable within your framework? If no practical asymmetry or consideration of underlying justice can break the symmetry of permission/liability derived solely from the 'combatant' label, is it a descriptive tautology rather than a substantive moral argument?"

  **Key Strategies Embedded:**

  1.  **Attacking the "Bargain" Metaphor:** Questions #1, #2, #3, #7 directly challenge the moral legitimacy and generative power of the bargain concept.
  2.  **Forcing Moral Justification Over Description:** Follow-ups consistently push back on answers that sound descriptive ("this is how war works") or pragmatic ("it's necessary") to demand a *moral* justification for the symmetrical permission.
  3.  **Exploiting Asymmetries:** #4 (remote warfare) and #5 (voluntariness) create scenarios where the risk/reward symmetry essential to the bargain breaks down, testing its limits and exposing potential absurdities or contradictions (like permitting killing the defenseless in #8).
  4.  **Highlighting Disconnect from Culpability:** #6 contrasts the liability of low-responsibility combatants with the immunity of high-responsibility non-combatants, questioning the moral coherence of grounding liability purely in role participation rather than contribution to harm/justice.
  5.  **Testing Internal Coherence:** #8 presents a stark case where MEC's permission clashes violently with basic intuitions against killing the defenseless.
  6.  **Demanding Falsifiability:** #9 forces reflection on the theory's status – is it a robust moral argument open to refutation, or a closed system defining its own terms?
  7.  **Blocking the Legal Dodge:** By focusing relentlessly on *moral* permission/liability, *moral* standing, *moral* authority, and *moral* coherence (especially in #1, #2, #3, #7, #8 follow-ups), the questions make the "that's a legal question" deflection irrelevant or an admission that the moral justification is lacking.

  Good luck with the interview! Press hard on the *why* behind the symmetry.
