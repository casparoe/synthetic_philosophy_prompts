  - 50-80 min: Open deliberation (30 min)
  - 80-90 min: Debrief (10 min)

  Debrief by the facilitator (mapping to philosophy):
  - Silent Scoring: You assigned harm based on deprivation and the existence of a subject. This reflects the deprivation account for the death case but not for prenatal nonexistence, illustrating the common asymmetry.
  - Paired Negotiation: You articulated reasons, often invoking the experience requirement (harm must be felt) or the need for a subject. This is the core of Epicurus's argument: no subject, no harm.
