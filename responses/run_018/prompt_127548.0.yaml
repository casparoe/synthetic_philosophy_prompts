  Rules:
  - Each student gets both profiles (on one sheet or two cards) without any indication of a connection.
  - They assign a harm score (0-10) to each, individually and silently.
  - Then they pair up and negotiate to agree on a score for each profile.
  - Then the group reveal: the two profiles are a pair with identical deprivation.
  - Then open discussion.

  Timeline breakdown (90 minutes):
  - 0-5 min: Introduction
  - 5-15 min: Silent scoring (10 min)
  - 15-30 min: Paired negotiation (15 min)
