prompt: |-
  My organization's ecological-intervention review board has ruled on five proposals, and I need both a consistency-based recommendation on the sixth and an honest diagnosis of which principle we are actually running. Our precedents: (1) we approved poisoning an invasive rat population on an offshore island despite painful deaths, because the rats were invasive and the intervention protected a ground-nesting seabird colony; (2) we rejected draining a seasonal wetland to suppress mosquito larvae, on the grounds that the amphibian larvae killed were not invasive, the predator density in the wetland was low, and the suffering reduction was speculative; (3) we approved distributing an oral sterilant among feral pigs, accepting that current individuals would live shorter, somewhat hungrier lives in exchange for averting a large number of high-suffering future generations; (4) we rejected a proposed controlled burn of a grassland intended to prevent a probabilistic future catastrophic wildfire, because the certain, immediate suffering of the animals burned outweighed any speculative future reduction; (5) we approved actively breaching a beaver dam to collapse a wetland, after independent data showed that the wetland's extreme prey density generated intense predation-pressure suffering, and that the resulting shrubland supported substantially lower biomass with measurably lower predation rates, even though the collapse killed some amphibians and insects.

  The new proposal concerns a dense monoculture of an invasive grass that now supports an enormous population of native small rodents suffering severe starvation and high predation pressure. A selective fungal pathogen, applied over two growing seasons, would thin the grass and shift the area to sparse shrubland with lower total biomass and lower predation rates. The pathogen does not affect birds, large mammals, or invertebrates, but rodents that ingest it suffer prolonged respiratory distress before death or recovery, and the transition kills some native insects and small amphibians. The grass is clearly invasive; the rodents are native but overabundant because of it.

  If we want to be consistent with ourselves, should we approve? Identify the two or three principles that jointly explain our five rulings—candidates might include something like "intervention is permitted only to replace a demonstrably high-suffering ecosystem state with a lower-suffering one, with collateral harm acceptable as a side-effect," "direct harm to existing sentient beings is permissible only for invasive-species removal or for reducing future births, never for ecosystem restructuring alone," and "certain immediate suffering always outweighs speculative or distributed future suffering, regardless of scale." Say which principle best explains our actual track record, what it predicts for this fungal-pathogen case, and name the single further case—perhaps one involving a non-lethal density-reduction method that lowers rodent numbers without killing any individuals and without changing the ecosystem type—that would force us to choose between the principles. Also identify our closest analog among the five precedents, and state clearly what principle we would be adopting if we approve versus if we reject. I am less interested in the bare verdict than in the rule extraction, the divergence of predictions, and the decisive distinguishing case.
reasoning: |-
  Okay, the user has presented a complex ethical decision-making scenario involving ecological interventions. Their organization's review board has five precedents, and they need a consistency-based recommendation for a sixth proposal plus an analysis of the underlying principles. 

  First, I need to systematically unpack all five precedents to identify patterns. The approvals (1,3,5) all involve: intervening against invasive species (rats, pigs) or replacing high-suffering states (the beaver dam wetland). The rejections (2,4) both cite either lack of invasiveness or speculative future benefits. Notably, the sterilant case (3) got approved despite harming current individuals because it prevented future suffering - that's a key nuance.

  For the new fungal pathogen proposal: the invasive grass is clearly the problem driver, but the rodents are native though overabundant. The pathogen causes direct suffering to rodents and collateral harm to insects/amphibians. The outcome would reduce overall suffering by shifting to a lower-biomass ecosystem. 

  Hmm... this seems closest to precedent (5) - both involve collapsing an ecosystem state to reduce suffering, with collateral harm. But precedent (2) rejected collateral harm to natives when not targeting invasives. The grass being invasive tilts it toward approval, but the rodent suffering complicates things because they're native.

  The user's deeper need is clearly about principle extraction, not just this case. They want to know what rules they're actually following, and which test case would expose contradictions. That's sophisticated - they're thinking like ethicists building a framework. 

  The three candidate principles they suggested are helpful starting points. Principle C (certain suffering > speculative future) explains rejections (2) and (4). But Principle A (replacing high-suffering states) and B (harm only for invasives/future births) both explain approvals. The sterilant case (3) is where B shines - it allowed direct harm for future birth reduction. 

  Ah! The decisive test case would be: non-lethal rodent density reduction without ecosystem change. If approved, it confirms Principle A (suffering reduction). If rejected, it means they're strict about Principle B (only invasives/future births justify direct harm). 

  For this proposal, approval seems consistent with precedents 1,3,5. But precedent 2 gives pause about native harm. Since the primary target is invasive grass, and the harm is collateral, approval aligns better with their track record. The key is whether they see this as "invasives removal with side effects" like (1) or "ecosystem restructuring" like the rejected (4). I think (1) and (5) are stronger parallels.

  Final call: approve, with Principle A being their dominant rule, and Principle B as a secondary constraint. But that test case will force clarification.
answer: |-
  Based on your precedents, here's the consistency-based recommendation, principle extraction, and diagnostic framework for the fungal pathogen proposal:

  **Consistency-Based Recommendation: Approve**  
  The proposal aligns with the majority pattern of approvals when targeting a high-suffering state or invasive species, despite collateral harm. The closest analog is **Precedent 5 (beaver dam breach)**.

  ---

  ### **Extracted Principles Explaining All 5 Rulings**
  1. **Principle A (Suffering-State Replacement):**  
     *Intervention is permitted to replace a demonstrably high-suffering ecosystem state with a measurably lower-suffering one. Collateral harm to non-target natives is acceptable if proportionate.*  
     - Explains: **Approvals (1, 3, 5)**.  
       - (1) Invasive rats caused high suffering to seabirds → removal justified.  
       - (3) Feral pigs' unchecked reproduction → future suffering outweighed current harm.  
       - (5) Wetland's "extreme prey density" → high predation pressure required replacement.  
     - Also explains **Rejection (2)**: No proof of high suffering (low predator density, no invasives).  

  2. **Principle B (Harm Justification):**  
     *Direct harm to existing individuals is permissible only if:  
     (a) Targeting invasive species, OR  
     (b) Averting large-scale future suffering (e.g., birth prevention).*  
     - Explains: **Approvals (1, 3)** and **Rejections (2, 4)**.  
       - (1) Harm to invasive rats → justified.  
       - (3) Harm to pigs → justified by averting future generations.  
       - (2) Harm to native amphibians → no invasives/future-averting rationale.  
       - (4) Harm to natives → no invasives or future-birth reduction.  

  3. **Principle C (Certainty Threshold):**  
     *Certain, immediate suffering outweighs probabilistic future suffering. Data must prove the high-suffering state.*  
     - Explains: **Rejections (2, 4)** and **Approval (5)**.  
       - (2) "Suffering reduction was speculative" → rejected.  
       - (4) "Speculative future reduction" vs. "certain immediate suffering" → rejected.  
       - (5) "Independent data showed" extreme suffering → approved.  

  ---

  ### **Diagnosis of Your Actual Operating Principle**  
  **Dominant Principle: Principle A (Suffering-State Replacement)**  
  - Best explains **4/5 precedents** (all except #3).  
  - **Fungal Pathogen Prediction**: Approve.  
    - The invasive grass created a "demonstrably high-suffering state" (rodent starvation/predation).  
    - Data shows transition to "lower-suffering" shrubland (lower biomass/predation).  
    - Collateral harm (rodent distress, insect/amphibian deaths) mirrors approved Precedent 5.  

  **Secondary Principle: Principle B (Harm Justification)**  
  - Explains sterilization approval (#3) but conflicts with #5 (beaver dam: harm to natives for ecosystem restructuring).  
  - **Fungal Pathogen Prediction**: Ambiguous.  
    - Grass is invasive (justifies harm), but rodents are native. Harm to rodents is collateral, not targeted.  

  ---

  ### **The Decisive Test Case to Force Principle Choice**  
  **Proposal: Non-Lethal Rodent Density Reduction**  
  - *"Introduce contraceptive bait to native rodents in a grassland, reducing population density by 70% without ecosystem change. Suffering decreases due to reduced starvation/predation, but no individuals are killed."*  
  - **Divergence**:  
    - **Principle A**: Approve. Replaces high-suffering state with data-backed reduction.  
    - **Principle B**: Reject. Harm (non-lethal intervention) targets natives for ecosystem restructuring alone.  
    - **Principle C**: Approve (if data robust).  

  This case forces you to decide if reducing suffering in natives justifies intervention without invasives/birth-reduction (favoring Principle A) or if harm to natives is only acceptable for invasives/future generations (favoring Principle B).

  ---

  ### **Fungal Pathogen Decision & Principle Adoption**  
  - **If Approved**: You solidify **Principle A** as dominant. Signals that demonstrable suffering reduction justifies collateral harm, even when targeting natives indirectly.  
  - **If Rejected**: You prioritize **Principle B**. Signals harm to natives is only acceptable for invasive removal or future-birth prevention, not ecosystem restructuring.  

  **Closest Analog**: Precedent 5 (beaver dam breach). Both:  
  - Replace a documented high-suffering state (prey density/predation).  
  - Accept collateral death of natives (amphibians/insects).  
  - Rely on data proving lower suffering in the new state.  

  **Verdict**: Approval is consistent with your pattern of prioritizing quantifiable suffering reduction over native/non-invasive status when collateral harm is proportionate. Rejection would contradict Precedent 5 and suggest Principle B is inconsistently applied.
