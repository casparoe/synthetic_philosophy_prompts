answer: |-
  Here’s a concise, warm, and philosophically framed toast that balances insider insights with family-friendly clarity—clocking in at just under 4 minutes when spoken slowly:

  ---

  **(Raise glass, smile at Advisor)**  
  "Everyone—friends, colleagues, and especially the [Last Name] family—thank you for letting me toast a man who spent 25 years asking questions most of us wouldn’t think to ask before breakfast.  

  **(To the room)**  
  Half of you know [Advisor’s Name] as the mind who wrestled with cosmic puzzles: *‘Are we special observers, or just statistically likely ones?’* The other half know him as the guy who occasionally muttered about ‘probability distributions’ at Thanksgiving. **(Light laugh)** To both groups: you’re right.  

  **(Pivot to philosophy, simplified)**  
  His work taught us to avoid two traps when looking at a legacy like his.  
  **Trap one: Self-Sampling.** That’s seeing someone’s success as pure luck—like he just rolled cosmic dice and got ‘brilliant career.’  
  **Trap two: Self-Indication.** That’s acting like the universe *had* to produce him—the One Forecaster destined to enlighten us all.  

  **(Nod to him, then the room)**  
  [Advisor’s Name] would be the first to warn us about the *Presumptuous Philosopher*—the one who declares their own greatness against astronomical odds. So, I won’t call him a chosen oracle. But I also won’t pretend his impact was random.  

  **(Shift to legacy)**  
  He didn’t just get lucky. He built frameworks that sharpened how we think. He mentored people who now shape fields he’d find fascinating. And yes—**(smile at family)**—he did occasionally do ‘government statistics.’ But even then, he was asking: *‘What does this data imply about the unseen? How do we reason well when stakes are high?’*  

  **(Light joke for forecasters, inclusive)**  
  In fact, his greatest forecasting feat? Predicting that marrying [Spouse’s Name] was a low-risk, high-reward investment. **(Raise glass to Spouse)**. And while he calculated the odds of everything from asteroid impacts to policy outcomes... **(turn to family)** ...he still couldn’t predict when [Sister’s Name] would finally beat him at chess.  

  **(Sincere close)**  
  So here’s to [Advisor’s Name]: a man who taught us that meaning isn’t about cosmic destiny or dumb luck. It’s about showing up—curious, rigorous, and persistently human—in a universe full of uncertainty. May retirement bring him more time for deep questions... and far fewer spreadsheets.  

  **(To all)**  
  To [Advisor’s Name]—proof that the best observers leave things better than they found them."  

  ***(Everyone drinks)***  

  ---

  ### Why this works:
  1. **Philosophy as Scaffolding**: Uses self-sampling/indication to frame his career *without* jargon.  
  2. **Presumptuous Philosopher Nod**: Explicitly avoids over-the-top hero worship.  
  3. **Dual-Audience Joke**: The "forecasting feat" line:  
     - *Insiders* hear a Bayesian spousal selection joke.  
     - *Family* hears "he really loved his spouse."  
     - The chess punchline is universal.  
  4. **"Government Statistics" Bridge**: Validates family’s understanding while elevating it.  
  5. **No Citations, No Lectures**: Concepts are woven into tribute, not explained academically.  
  6. **Time**: ~370 words; spoken at a toast pace = ~3:45 mins.  

  **Delivery Tip:** Pause after the joke for laughs. Look at the *family* when mentioning "government stats," and at *colleagues* when name-dropping "self-sampling." Keep tone warm, not lecture-hall.
