prompt: |-
  Right, me and my friend just had a three-hour row about communitarianism vs liberalism — specifcally whether a community can carry moral weight that isn't just the sum of individual rights. We kept talking past each other, so I want you to draft the joint statement that a committed liberal (who thinks only individuals have moral standing) and a committed communitarian (who thinks communities have intrinsic value) could both sign after an adverserial collaboration. Include the claims they both accept about what liberalism and communitarianism actually say; the precise disagreements in neautral wording, each phrased so its own side would accept it; the cruxes — I reckon one is whether cultural continuity has independent moral value and another is whether liberal neautrality is even coherent in practice; and for each crux, one concrete case or argument both agree bears on it, with each side's prediction written down. Format it as a numbered agreed-claims section followed by a disagreements table with columns: Crux, Liberal formulation, Communitarian formulation, Shared test case, Liberal prediction, Communitarian prediction. After that, summarise the whole thing in a JSON object with these exact fields: "domain", "crux_1", "crux_2", "test_case", "liberal_pred", "communitarian_pred". Don't give me a bibliography or citation list — just reason it through from first principles, like you're explaining it back to us over another pint. British English, casual tone, and yes my phone's autocorrect is rubbish so there's a typo or two in there.
