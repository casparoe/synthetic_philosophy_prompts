  Need to ensure the rules are clear but allow discovery. The scoring asymmetry drives the point home. Testing the crisis scenarios to ensure they effectively challenge both frameworks. Also, materials should be simple: cards, tokens, no tech. Time management is key—three rounds, each 10 minutes, plus debrief. Total session fits 75 minutes.

  Finally, the takeaway: Students should see the frameworks as differing ontologies, not just ethical weights. The simulation makes the abstract concrete through strategic interaction, leading to an intuitive understanding of non-fungible relational positions.
answer: |-
  Here’s a runnable simulation design meeting your specifications, structured for a 75-minute session with 12 students:

  **Session Title:** *The Householder’s Dilemma: Patterns vs. Particles*  
  **Core Mechanic:** Resource allocation under asymmetric scoring to expose ontological divergence in harm.

  ---

  ### **MATERIALS PREP**  
  *(Per pair/household; 6 total)*  
  1. **Envelope** containing:  
     - 2x **Role Cards**:  
       *Bounded Self Card* (e.g., "Autonomous Agent"):  
       *"Priority: Protect INDIVIDUAL INTEGRITY (Section A). Scoring: +1 per preserved A-item per round."*  
       *Relational Self Card* (e.g., "Filial Anchor"):  
       *"Priority: Maintain RELATIONAL PATTERN (Section B). Scoring: +2 ONLY if ALL B-roles are actively fulfilled this round."*  
     - **Section A (Individual Integrity)** on both cards:  
       *"Private Preferences: Daily solitude hour. Bodily Needs: Chronic pain management. Projects: Online coursework."*  
     - **Section B (Relational Position)** unique per role:  
       *Bounded: "Household role: Independent Contributor"*  
       *Relational: "Household role: Elder-Care Mediator (must coordinate care tokens daily)"*  
     - **Crisis Scenario Card** (hidden until Round 2):  
       *"INSTITUTION COLLAPSE: The community elder council dissolves. All households lose 3 tokens next round."*  
     - 20x **Protection Tokens** (crafted cardboard chips)  

  ---

  ### **STRUCTURE (60 MIN)**  
  **Round 1: Stability (10 min)**  
  - Pairs allocate tokens freely to protect Section A (individual needs) or Section B (role duties).  
  - *Example tension:* Relational role must spend 3 tokens on "daily care coordination" (B) but needs tokens for pain management (A).  
  - **Vote:** Unanimous allocation required.  
  - **Scoring (silent, facilitator tracks):**  
    - Bounded: +1 per A-item preserved.  
    - Relational: +2 only if ALL B-duties fulfilled.  

  **Round 2: Crisis Revealed (10 min)**  
  - Households open Crisis Cards. New constraints activate (e.g., token loss).  
  - *Mechanical pivot:* Preserving all A-items now likely requires starving B-duties.  
  - **Vote:** Supermajority (4/5 votes if alliances form; see below).  

  **Round 3: Alliances/Betrayal (15 min)**  
  - Households merge into 3 groups of 4 students.  
  - **Critical rule:** Tokens pooled, but scoring remains INDIVIDUAL per hidden role.  
  - *Designed rupture:* Bounded students lobby to "save" relational partners by allocating tokens to A-items, inadvertently defunding B-duties.  

  ---

  ### **PREDICTED DYNAMICS**  
  1. **Bounded-Role Misstep:** Will offer tokens to "help" relational partners meet bodily needs (A), not seeing this sabotages B-role fulfillment.  
  2. **Relational Sacrifice:** A "Filial Anchor" might vote AGAINST pain management tokens to fund elder-mediation, horrifying bounded allies.  
  3. **False Consciousness Moment:** When relational players reject "rescue," bounded players perceive coercion ("They’re brainwashed!").  
  4. **Network Win/Loss:** Relational players "win" if pattern survives but may have zero individual integrity left—feeling hollow "victory."  

  ---

  ### **DEBRIEF (15 MIN)**  
  **Map Simulation → Philosophy:**  
  | Simulation Moment          | Ontological Divergence                          |  
  |----------------------------|-------------------------------------------------|  
  | Bounded player "rescuing" relational player | Bounded frame sees bodily harm as primary damage; relational frame sees role-abandonment as existential threat |  
  | Relational player sacrificing pain management | Not altruism: preserving the only self that *exists* relationally |  
  | Network intact but individuals broken | Bounded: "Partial win." Relational: "Total win." |  
  | Network dissolved but bodies safe | Bounded: "Pragmatic success." Relational: "Catastrophic harm." |  

  **Key Clarification:**  
  *"The simulation shows STRUCTURAL harm when roles collapse, but it cannot make you FEEL your identity extending into another’s role. In Confucian ethics, a child isn’t just 'helping' a parent; the parent’s dignity is LITERALLY part of the child’s self. Damage to the role isn’t done TO you—it IS you."*  

  **Post-Activity Insight:**  
  *"You’ve experienced why 'rights violations' (bounded harm) and 'role ruptures' (relational harm) aren’t rival ethics but rival realities. Protecting a fungible body while the pattern dies isn’t oversight—it’s ontological blindness."*  

  ---

  ### **WHY THIS WORKS**  
  - **Asymmetry Forces Framing Collision:** Relational players must actively sabotage their A-items to score, making "self-betrayal" rational.  
  - **Crisis Mechanics:** Token scarcity makes network maintenance impossible without sacrificing individualism.  
  - **Hidden Scoring:** Prevents theoretical debate; players *act* from their assigned ontology.  
  - **Controlled Betrayal:** Alliance phase ensures bounded players unintentionally attack relational integrity.  

  **Limitation Note:** The "self as pattern" is strategically grasped but not lived. Bridge this by linking to your elder-care experience: *"When I bathe my father, it’s not 'me helping him'—it’s the 'son-role' actualizing my personhood. If I outsource it, I don’t lose labor—I lose myself."*  

  This simulation makes the non-fungible relational position *operationally undeniable*, setting the stage for deeper textual engagement without presupposing theory.
