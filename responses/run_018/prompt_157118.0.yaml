prompt: |-
  I'm a journalist who covers science and ideas, and I'm developing a feature on how educators make abstract philosophical tensions visceral without falling back on lecture. For a 90-minute workshop with about 12 graduate students in science and technology studies—participants who know von Neumann's engineering legacy but have not confronted his evolutionary argument about technological survival—I want a runnable classroom game or structured simulation. The aim is to make participants feel the force of von Neumann's idea that technological survival operates as an evolutionary filter selecting for autonomy and replication over human controllability, well before anyone names the concept.

  Please design the activity with these constraints: inject a niche conceptual framing that treats von Neumann's self-reproducing automata not as a historical robotics proposal but as a model for material-culture lineages. Participants should manage "technological species" across simulated catastrophe rounds, allocating scarce resources between controllable tools and self-replicating systems, and experience the coordination failure that arises when survival rewards autonomy that undermines collective oversight. The rules, incentives, and roles must be arranged so participants run into the paradox themselves: they should feel the rational pressure to invest in replication-capable lineages even as those lineages erode the governance structures needed to manage them. Do not lecture up front; do not mention von Neumann or self-reproducing automata by name until the debrief.

  Then provide a debrief that maps specific moments in the simulation onto parts of von Neumann's argument—for example, the round in which replication outpaces regulation, and the extinction event that wipes out non-replicating lineages—states what will predictably go wrong when the activity is run and how a facilitator should handle it, and is frank about which feature of von Neumann's view the simulation cannot reproduce—specifically, the mathematical universality of the constructor and the formal properties of universal computation—so the facilitator knows what must be supplied conceptually.

  Finally, after describing the activity and debrief, present a brief structured summary as a JSON object with exactly these fields: "setting", "group_size", "duration_minutes", "core_mechanic", "niche_injection", "predicted_failure_mode", "debrief_mapping", "missing_feature_requiring_facilitator", "format_notes". Each field should contain a concise string describing that element.
reasoning: |-
  We are designing a simulation game for a 90-minute workshop with 12 graduate students. The goal is to illustrate von Neumann's idea about technological evolution without naming it until the debrief. The core idea is that technological survival favors autonomy and replication over human controllability, leading to a coordination failure in governance.

  Activity Design: "Techno-Ecology Survival Challenge"

  Setting: A post-catastrophe world where technological lineages must survive. Participants are divided into 3 "governance councils" (each with 4 members) responsible for managing technological species in their region. Each council has the same starting conditions.

  Core Mechanics:

  1. **Technological Species**: There are two types of technological entities:
     - **Tools (T)**: Controllable, efficient for specific tasks, but cannot replicate. They require resources to build and maintain but yield high immediate returns in "productivity points" (PP) when used.
     - **Autonomous Replicators (R)**: Can self-replicate (with some resource input) but are harder to control. They yield lower immediate PP but can increase in number without direct human intervention. However, they also have a chance of "mutation" that might lead to unpredictable behavior (e.g., consuming extra resources, becoming inefficient, or even causing harm).

  2. **Resources and Survival**: 
     - Each council starts with 100 Resource Units (RU) and a starting set of technologies: 4 Tools and 2 Replicators.
     - Each round (representing a generation) has two phases: 
       **a) Investment Phase**: Councils decide how to allocate their current RU to:
          - Build new Tools (cost: 10 RU each, yields 5 PP per Tool when used)
          - Build new Replicators (cost: 15 RU each, but note: each existing Replicator can also attempt to replicate with a 50% chance of success if 5 RU are allocated to support its replication. If successful, it produces one new Replicator. If not, the RU is lost.)
          - Maintain existing technologies (each Tool costs 2 RU to maintain, each Replicator costs 3 RU to maintain; if not maintained, they become defunct and are removed).
          - Reserve RU for governance (to build regulatory capacity, see below).
       **b) Catastrophe Phase**: A catastrophe occurs (e.g., resource depletion, environmental disaster) that requires the council to spend PP to mitigate. The required PP is randomly determined (e.g., 20, 30, or 40 PP, rolled by the facilitator). If the council cannot meet the PP requirement, they lose a random technology (either a Tool or a Replicator, but Tools are more likely to be lost because they are less resilient).

  3. **Governance and Regulation**:
     - Councils can invest RU in "Regulatory Capacity" (RC). RC is built by reserving RU (without spending it) in a round. Each 10 RU reserved becomes 1 RC point (max 5 RC per round). RC points are cumulative and can be spent to:
          - Suppress a Replicator: Remove one Replicator at a cost of 2 RC per Replicator.
          - Inspect a Replicator: For 1 RC, reveal if a Replicator has a "mutation" (if the mutation system is used) or prevent negative effects for one Replicator for that round.
          - Regulate Replication: For 1 RC per Replicator, guarantee a successful replication (if desired) without the 50% chance of failure.
     - However, note: Replicators that are not regulated (i.e., not suppressed and not regulated during replication) have a chance to become "feral" if the council's total RC is less than the number of Replicators. If this happens, the Replicator operates independently and no longer contributes PP to the council but continues to replicate and consume resources (if any are allocated to it). This represents loss of control.

  4. **Incentives and Winning**: 
     - The goal for each council is to survive the longest (i.e., avoid having all technologies wiped out) and accumulate the most PP over time (which represents the ability to handle catastrophes and thrive).
     - After 5 rounds, a "Great Filter" catastrophe occurs (requiring 60 PP to survive). The council that survives this with the most PP wins.

  5. **Coordination Failure Setup**:
     - The design ensures that in early rounds, investing in Replicators might seem risky because they require more resources and maintenance. However, as catastrophes become more severe, having more Replicators (which can multiply and thus produce more PP in aggregate) becomes essential to meet high PP demands. But if councils don't build RC, they risk losing control of Replicators, which then become feral and a drain on resources (if supported) or a threat (if they consume resources without contributing). Moreover, Tools are more likely to be lost in catastrophes, making them less reliable in the long run.

  Predicted Flow:

  - Round 1-2: Councils might focus on Tools for quick PP and neglect Replicators and RC.
  - Round 3-4: Catastrophes get harder, and councils that invested in Replicators (even if they are now hard to control) might have more PP. But without RC, some Replicators become feral.
  - Round 5 (Great Filter): Only councils with a balance of Replicators (for high PP production) and RC (to control them) might survive. But note: investing in RC means less RU for building technologies, so it's a trade-off.

  Predicted Failure Mode: 
  - Participants may not invest in Replicators at all, leading to collapse when catastrophes outpace Tool-based PP. 
  - Or, they might over-invest in Replicators without building RC, leading to loss of control and feral Replicators consuming resources without contributing.

  Facilitator Handling: 
  - If no council invests in Replicators, the facilitator can introduce a mild catastrophe that is easily survivable but then hint that future ones will be worse. 
  - If councils are too successful at balancing, the facilitator can increase the catastrophe severity to force the dilemma.

  Debrief (after 5 rounds or when all but one council collapse):

  1. **Reveal the Model**: Explain that the simulation was inspired by von Neumann's work on self-reproducing automata, which he framed as a model for how technology might evolve. The autonomous replicators (R) are like von Neumann's universal constructors.

  2. **Map the Simulation to von Neumann's Ideas**:
     - **Replicators vs. Tools**: The Replicators represent technologies with the capacity for self-replication and autonomy, while Tools represent human-controlled but non-replicating technologies.
     - **Catastrophe Rounds**: These are the evolutionary filters. The rounds where non-replicating tools were wiped out map to von Neumann's argument that only lineages with replication capabilities survive in the long run.
     - **Resource Allocation and Governance**: The trade-off between investing in replication versus regulation illustrates the coordination failure: survival pressures push toward replication, but that very replication erodes governance (as seen when Replicators become feral because RC is insufficient).
     - **The Great Filter**: The final catastrophe that requires massive PP production shows how only systems that have built up replicative capacity can survive, but at the cost of control.

  3. **What the Simulation Cannot Capture**:
     - **Mathematical Universality**: Von Neumann's self-reproducing automaton is a universal constructor, meaning it can build any machine including itself. The simulation abstracts replication but doesn't capture the formal universality and the potential for open-ended evolution.
     - **Formal Properties of Computation**: The simulation doesn't model the internal computational structure that allows for such universality. The facilitator must explain that von Neumann's model is based on a formal system (cellular automata) that can simulate any computation, which is the foundation for the evolutionary potential.

  Structured Summary in JSON:

  ```json
  {
    "setting": "Post-catastrophe world where councils manage technological species (Tools and Autonomous Replicators) to survive periodic catastrophes.",
    "group_size": "12 participants in 3 councils of 4",
