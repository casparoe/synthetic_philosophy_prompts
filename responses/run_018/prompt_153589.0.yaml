ndence or state-level enforcement capacity—that the simulation necessarily cannot reproduce and that the facilitator must supply. Provide the complete rules for token movement, a non-monetary payoff scheme using only classroom objects, and the full text of six representative hidden role cards. The conceptual distinction must emerge from the mechanics of exchange before any theoretical vocabulary is introduced; do not ask students to read texts during the session.
