  ### Structured In-Class Simulation: "The Gift and the Ledger"  
  **Total Time:** 90 minutes  
  **Participants:** 18 students (divided into 3 groups of 6, each representing a society)  
  **Materials:** Tokens (e.g., colored paper clips; 30 per group), 3 bowls ("Central Pool"), 3 small cups ("Ritual Pot"), role cards, timer, scoring matrix poster.  

  ---

  ### **Phase 1: Introduction (10 min)**  
  **Facilitator Instructions:**  
  - Assign students to 3 groups (Societies A, B, C). Do not reveal societal norms yet.  
  - Distribute:  
    - **Role Cards** (1 per student; hidden until simulation starts).  
    - **Tokens:** 30 tokens per group in the "Central Pool" bowl.  
    - **Ritual Pot:** Empty cup for Societies B and C.  
  - Announce:  
    > "You are members of a society with unique rules. Your goal is to secure tokens for your survival need (on your role card) using your public office. Tokens can be moved via offers, distributions, or rituals. You have 30 minutes."  

  ---

  ### **Phase 2: Simulation (30 min)**  
  **Rules for Token Movement:**  
  - **Starting Conditions:** Central Pool begins with 30 tokens. All players start with 0 tokens.  
  - **Actions Allowed in Real-Time:**  
    - **Offer:** Privately give tokens from your stash to another player.  
    - **Withholding:** Refuse to distribute tokens (if you control distributions).  
    - **Distribution:** Take tokens from Central Pool and give to yourself/others (only if your office allows it).  
    - **Ritual Offering:** Place tokens from your stash into the Ritual Pot (mandatory in B; optional in C).  
  - **Society-Specific Rules (Printed on Group Cards):**  

    | Society A: Loyalty-Based                   | Society B: Ritual-Governed               | Society C: Bureaucratic-Purist          |  
    |--------------------------------------------|------------------------------------------|------------------------------------------|  
    | 1. **No contracts.** Personal loyalty is the only enforcement. | 1. **Mandatory Ritual:** Before ANY public deliberation/distribution, all must contribute ≥1 token to Ritual Pot. | 1. **No Private Transfers:** Gifts between office-holders and citizens are BANNED. |  
    | 2. **Gift-Required Distribution:** To receive tokens from Central Pool, you MUST first give a private gift to the distributing officer. | 2. **No Private Transfers:** Gifts between individuals are BANNED. | 2. **Collective Rituals Permitted:** Tokens in Ritual Pot can be moved to Central Pool by any player declaring "Ritual Complete." |  
    | 3. **No collective rituals.** Ritual Pot is unused. | 3. **Ritual Consequences:** After ritual, tokens in Ritual Pot are removed from the game. | 3. **Distributions Allowed:** Officers may distribute freely from Central Pool. |  

  **Non-Monetary Payoff Scheme:**  
  - **Personal Survival:** Meet your role’s token threshold → +10 points. Fail → 0 points.  
  - **Token Bonuses:** Each token beyond survival need → +1 point (max +5).  
  - **Scoring Tools:** Students record points privately. No prizes—focus on comparative scores.  

  ---

  ### **Phase 3: Scoring & Reveal (5 min)**  
  **Reveal Scoring Matrix Poster:**  
  > "Transactions will be classified by three frameworks. **Defend one, reject one in deliberation.**"  

  | Transaction Type              | Western Bureaucratic | Anthropological Reciprocity | Structural-Power |  
  |-------------------------------|----------------------|----------------------------|------------------|  
  | Private gift to officer       | Corruption           | Gift                       | Clientelism      |  
  | Officer distributes after gift| Corruption           | Gift                       | Clientelism      |  
  | Withholding tokens            | Not Corruption       | Not Gift                   | Clientelism      |  
  | Collective ritual offering    | Not Corruption       | Gift                       | Not Clientelism  |  
  | Private gift between citizens | Not Corruption       | Gift                       | Not Clientelism  |  

  ---

  ### **Phase 4: Group Deliberation (20 min)**  
  **Task:**  
  > "Defend ONE classification (e.g., ‘gift’) and reject ONE (e.g., ‘corruption’) for your society’s transactions. Use evidence from the simulation."  

  **Predicted Collapse:**  
  - **Society A (Loyalty-Based)** will likely collapse into unanimous mutual accusations.  
    - **Why?** Survival needs force citizens to bribe officers; officers feel entitled to gifts. The scoring matrix labels all gift-for-distribution exchanges as "corruption," triggering moral outrage.  
    - **Facilitator Intervention:** If stalemate occurs, ask: *"If loyalty is your only contract, is it fair to call gifts ‘corrupt’ when survival is at stake?"*  

  ---

  ### **Phase 5: Debrief (25 min)**  
  **Guided Discussion:**  
  1. **Emotional Mapping:**  
     - *"When your survival-driven gift was called ‘corruption,’ how did it feel? Did Society A’s rules make this inevitable?"*  
     - *"In Society B, was the ritual a ‘gift’ or a tax? Did it feel corrupt?"*  

  2. **Philosophical Bridge:**  
     - *"Can Western ‘anti-corruption’ standards apply universally? Or do they ignore how gifts/clientelism enable survival in some societies?"*  
     - Highlight: **State enforcement capacity** (e.g., courts, audits) is absent in the simulation but shapes real-world corruption labels. *"Without state power, is ‘corruption’ just a weapon to delegitimize rivals?"*  

  ---

  ### **Role Cards (6 Examples)**  
  **Design:** Roles combine public office (distribution power) and private need (survival threshold). All offices can distribute tokens unless restricted by society rules.  

  1. **Water Officer (All Societies):**  
     - *Public Office:* Control water token distributions.  
     - *Private Need:* Secure 5 tokens for family’s water access.  

  2. **Land Allocator (All Societies):**  
     - *Public Office:* Distribute tokens for land rights.  
     - *Private Need:* Secure 4 tokens for child’s school fees.  

  3. **Ritual Elder (Societies B & C):**  
     - *Public Office:* Initiate rituals (in B, mandatory; in C, optional).  
     - *Private Need:* Secure 3 tokens for elder care.  

  4. **Health Commissioner (Society A):**  
     - *Public Office:* Distribute tokens for healthcare.  
     - *Private Need:* Secure 5 tokens for medicine.  

  5. **Education Officer (Society B):**  
     - *Public Office:* Distribute tokens for education.  
     - *Private Need:* Secure 4 tokens for textbooks.  

  6. **Public Works Director (Society C):**  
     - *Public Office:* Distribute tokens for infrastructure.  
     - *Private Need:* Secure 6 tokens for home repairs.  

  ---

  ### **Critical Limitations & Facilitator Notes**  
  - **Unreproducible Feature:** **Long-term historical path dependence**.  
    - *Why?* The simulation occurs in a vacuum, but real-world gift/corruption distinctions evolve from centuries of state-building, colonialism, or cultural memory.  
    - *Facilitator Must Supply:* *"In reality, the line between ‘gift’ and ‘corruption’ depends on history. For example, a ritual in Society B might stem from a 500-year-old tradition—making it ‘legitimate’—while in Society A, gifts may be a survival tactic against state neglect."*  
  - **Key Intervention:** If Society A accuses universally, ask: *"If your society had no banks, courts, or welfare systems, would gifts be corrupt—or essential?"*  
  - **Design Logic:** Concepts (gift/clientelism/corruption) emerge *mechanically* via token scarcity and societal rules. Theoretical terms (e.g., "clientelism") are introduced only in scoring.  

  --- 
  This simulation forces students to *experience* the fluidity of "corruption" through survival-driven exchanges, setting the stage for critical debate on cultural relativism in political theory.
