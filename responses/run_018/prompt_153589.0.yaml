  - Type 5: Distribution from central pool to citizen by office-holder that was preceded by a private gift from that citizen to the office-holder
  - Type 6: Contribution to collective ritual (which is then either destroyed or moved to central pool)

  Scoring matrix:

  | Transaction Type | Western Bureaucratic | Anthropological Reciprocity | Structural-Power Definition |
  |------------------|------------------------|-----------------------------|----------------------------|
  | Type 1 (private gift to office-holder) | Corruption | Gift | Clientelism |
  | Type 2 (private gift from office-holder to citizen) | Corruption | Gift | Clientelism |
  | Type 3 (private transfer between citizens) | Not corruption | Gift | Not clientelism (if between equals) |
  | Type 4 (public distribution without gift) | Not corruption | Not gift (public) | Not clientelism |
  | Type 5 (public distribution after gift) | Corruption | Gift | Clientelism |
  | Type 6 (contribution to ritual) | Not corruption | Gift (to the gods/collective) | Not clientelism (if collective) |

  But note: in Society B, the ritual is mandatory and the offering is collective, so Type 6 might be seen as a form of taxation or public dues, not corruption.

  In the deliberation, each group must defend one classification and reject another.

  Prediction on collapse:

  We predict that Society A (where personal loyalty and private gifts are required for distributions) will collapse into mutual accusations of corruption because every distribution will be seen as quid pro quo. In particular, the office-holders will be accused of favoring those who give them gifts, and the scoring matrix will classify many transactions as corruption. The private survival needs will drive citizens to offer gifts, and office-holders to accept them, but then at the reveal, they will feel labeled as corrupt.

  Facilitator intervention: If a group is stuck and not making any distributions (e.g., because in Society A no one has tokens to give as gifts initially), the facilitator can remind them that the first distribution can be made without a gift, or suggest that they can use promises (which may or may not be kept). But mostly, let them struggle.

  One feature the simulation cannot reproduce: long-term historical path dependence. The simulation starts from scratch, but in real societies, these norms have evolved over time and are embedded in a history of trust or distrust. The facilitator must explain that in real societies, the line between gift and corruption is often shaped by historical context, and what might be seen as corruption today might have been a functional gift-giving system in the past.

  Complete Rules for Token Movement:

  - Tokens are represented by small objects (e.g., paper clips).
  - Each group has a central pool (bowl) with 30 tokens at the start.
  - A ritual pot (bowl) is also provided.
  - Participants start with 0 tokens.
  - During the 30 minutes, participants may:
     - Take tokens from the central pool if they are an office-holder and distribute them to themselves or others (according to their society's rules).
     - Give tokens from their personal stash to another participant (private transfer).
     - Put tokens from their personal stash into the ritual pot.
  - In Society A: 
     - Norm: a citizen should give a private gift to an office-holder before receiving a distribution from that office-holder.
  - In Society B:
     - Before any public distribution, the group must perform a ritual: at least half the participants must each contribute at least 1 token to the ritual pot. After the ritual, the tokens in the ritual pot are removed by the facilitator. Then distributions can occur.
     - Private transfers between participants are forbidden.
  - In Society C:
     - Private transfers between any two participants are forbidden.
     - Collective rituals are permitted: any participant can contribute to the ritual pot at any time. Any participant can call for a ritual to be completed by saying "I complete the ritual". Then the tokens in the ritual pot are moved to the central pool, and the ritual pot is empty.
     - Distributions from the central pool are allowed.
  - At the end of 30 minutes, the simulation stops. Participants count the tokens in their personal stash.

  Non-monetary payoff scheme: 
  - Each token in hand = 1 point.
  - If a participant meets their private survival need (exactly or more), they get an additional 5 points.
  - There are no group bonuses.

  Full text of six representative hidden role cards (for one society, Society A):

  Card 1 (Chief):
  - Public office: As Chief, you are the highest authority. You can distribute tokens from the central pool for any purpose.
  - Private need: You must secure at least 4 tokens for your family's food. If you do, you will get 5 extra points.

  Card 2 (Water Officer):
  - Public office: As Water Officer, you are responsible for water resources. You can distribute tokens from the central pool for water-related projects.
  - Private need: You must secure at least 5 tokens for your child's medicine. If you do, you will get 5 extra points.

  Card 3 (Land Officer):
  - Public office: As Land Officer, you are responsible for land allocation. You can distribute tokens from the central pool for land-related projects.
  - Private need: You must secure at least 3 tokens for your mother's shelter. If you do, you will get 5 extra points.

  Card 4 (Health Officer):
  - Public office: As Health Officer, you are responsible for public health. You can distribute tokens from the central pool for health-related projects.
  - Private need: You must secure at least 4 tokens for your family's clothing. If you do, you will get 5 extra points.

  Card 5 (Education Officer):
  - Public office: As Education Officer, you are responsible for education. You can distribute tokens from the central pool for education-related projects.
  - Private need: You must secure at least 5 tokens for your own education. If you do, you will get 5 extra points.

  Card 6 (Ritual Officer):
  - Public office: As Ritual Officer, you are responsible for maintaining cultural practices. You can distribute tokens from the central pool for cultural projects.
  - Private need: You must secure at least 3 tokens for your sibling's education. If you do, you will get 5 extra points.

  The same roles can be used for Society B and C, but the Ritual Officer in Society B and C will have a more active role in rituals.

  This design should create the conditions for the conceptual instability of corruption to emerge from the mechanics.
