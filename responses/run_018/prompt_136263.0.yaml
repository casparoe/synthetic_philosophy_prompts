  I'm prepping for a symposium on prison design at a law school next week — my talk is that Halden prison isn't actually a "rehabilitation" success story like the Atlantic articles make it sound, but more like a status-leveling machine that only functions because Norwegian inmates enter with high social capital and strong welfare ties outside the walls. So copying the architecture — the open kitchens with actual knives, the no-bars design, the domestic-style spaces — into American mass incarceration is basically a category error unless we address the pre-carceral collapse that happens long before sentencing. I'm pitching a very narrow pilot: don't import Halden's programming or its social democracy, but borrow its "forced proximity" sensory design to replace solitary architecture in one American supermax unit, on the theory that American punitive design destroys the informal social control that Halden accidentally preserves.

  The audience is gonna be rough in specific ways: two Scandinavian researchers who actually visit Halden and know the recidivism stats cold, a couple prison architects who think design is cosmetic window dressing, a former prosecutor who sees punishment as expressive and non-negotiable, and a behavorial economist obsessed with incentive structures. I need a real prep sheet for the Q&A — not generic objections, but the ones they'll actually raise, phrased in their vocabulary, ordered by how likely they are and how bad the damage is if I don't answer well. For each: the objection as they'd say it, a reply I can actually deliver in about two minutes, and an honest note on where my reply is weakest or soft. Also tell me what I should concede right up front so I don't come off defensive, and include the question I'm praying nobody asks — probably something about whether "forced proximity" in American prisons just replicates gang dynamics since the social capital isn't there, or whether I'm aestheticizing violence. Start with the bottom line in the first sentence — the one objection that could actually kill the talk — then lay out the rest in damage order with replies and weak spots. Don't restate my thesis back to me, no preamble, and keep it practical since I present in two days.
