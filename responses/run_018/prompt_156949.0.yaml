answer: |-
  Here are five concise points addressing the tension between institutional continuity and moral responsibility across generations:

  1.  **Institutions transfer inherited burdens:** Political guilt attaches to the enduring state structure that benefits from past crimes, requiring current members to address ongoing harms like reparations, regardless of personal fault.
  2.  **Shared identity creates moral entanglement:** The deliberate maintenance of a national "we" across time (through culture, law, education) links descendants to the collective's history, making simple disavowal impossible.
  3.  **Metaphysical guilt concerns human solidarity:** This isn't blame but a shared human burden; recognizing atrocity happened within "our" historical community creates a duty to acknowledge it, distinct from punishing individuals.
  4.  **Intentionality fractures over time:** While institutions persist, the specific joint commitments and shared purposes of the original collective agents dissolve, weakening claims of *direct* moral culpability for past acts among the living.
  5.  **Responsibility transforms into stewardship:** Without original agents, the focus shifts: the living inherit not blame for the past deed itself, but the *political obligation* to rectify its enduring consequences and uphold values preventing recurrence.
