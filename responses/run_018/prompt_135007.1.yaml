answer: |-
  ## Negative Materiality

  We trace belief in potsherds, temples made,  
  And read the altar's function in its form,  
  But how to know what rite those rites performed  
  Unless the god we guess first lent them aid?  
  The artifact assumes a thought displayed,  
  Yet thought requires the crafted to inform—  
  This circle binds us in a reasoning storm  
  Where form and faith in fragile pact are laid.  

  But rituals designed to leave no trace,  
  Whose power thrives on silence, shifting sand,  
  Or vows dissolved like footprints on the beach,  
  Whose records burn to ash without a face—  
  Defy the tools held tight within the hand  
  Of disciplines trained only how to reach  

  For substance. Thus the greater the command  
  To vanish, crafting absence as demand,  
  The more that power thrives, unseen, unplanned,  
  And leaves a science, stone-blind, on the strand.  

  ---

  **Notes on Design:**
  *   **Octave (Hermeneutic Circle):** ABBAABBA rhyme mirrors interpretive circularity ("aid/performed," "form/aid," "displayed/inform," "storm/laid"). Focuses on tangible artifacts (potsherds, temples, altars) and the interdependent logic of belief and object.
  *   **Volta (Line 9):** "But rituals..." sharply pivots to deliberate absence, ephemerality ("shifting sand," "footprints on the beach"), and destruction ("records burn to ash").
  *   **Sestet (CDECDE - Disrupted Closure):** Breaks the octave's tight rhyme pattern, reflecting the failure of conventional methods. Images emphasize negation ("no trace," "silence," "dissolved," "burn," "ash," "unseen," "void," "absence").
  *   **Final Couplet:** States the core paradox: institutional power *increases* with erasure ("greater the command / To vanish"), rendering archaeology ("a science, stone-blind") helpless ("strand").
  *   **For Specialists:** Embodies the hermeneutic problem (Gadamer), negative/material absence as data (cf. Buchli, Lucas), and the methodological tension in reconstructing ephemeral institutions.
  *   **For All Readers:** The structural irony is felt: the octave's confident enclosure vs. the sestet's unraveling, the final image of a blind science stranded by the very absence it seeks.
