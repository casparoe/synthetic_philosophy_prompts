prompt: |-
  I'm on the ethics panel for our state's hospice oversight board. There's this proposal from Meridian Hospice to allow voluntary cessasion of nutrition for patients with advanced dementia if they left an advance directive citing that death is not a harm to them — basically an Epicurean framing they want built into the consent framework. The disability rights coalition filed a brief saying we're treating dementia patients as if their future lives have no value, and that using Epicurus here is a philosphical sleight of hand because the patients aren't the ones reasoning, it's the families projecting. Half the panel thinks this is just honoring autonomy with an explicit philosphical basis; the other half thinks it's importing a contested metaphysics into medical policy. I need a short memo for Thursday's vote: recommend approve, reject, or approve with conditions. It should actually engage the Epicurean point — not just say death is bad, period — and deal seriously with the disability coalition's worry that the asymmetry argument gets misapplied when the subject can't currently affirm it. Also need a concrete timeframe if we go with conditions. Don't cite bibliographies, just reason it through. There's probably a typo in my notes but you get the idea.
reasoning: |-
  Okay, let's tackle this hospice ethics panel dilemma. The user needs a memo recommendation on Meridian Hospice's proposal for voluntary cessation of nutrition in advanced dementia patients with specific advance directives. 

  First, unpacking the core conflict: On one side, there's autonomy via Epicurean framing (death isn't harmful to the deceased). On the other, disability advocates argue this devalues dementia lives and projects family biases onto non-reasoning patients. The panel is philosophically split—autonomy vs. contested metaphysics.

  Key angles to address:
  - The Epicurean claim needs direct engagement. Can "no subject to harm" legitimately apply when the directive-writer pre-dementia and current patient are psychologically discontinuous? 
  - Disability coalition's asymmetry concern is crucial: Is the family interpreting "no harm" based on the patient's past rationality, ignoring that the current self might experience deprivation differently?
  - Practical risks: Could this policy incentivize subtle coercion? Current safeguards may not catch emotional/financial pressures on directive-drafting.

  User's hidden needs:
  They're likely wrestling with how to balance abstract philosophy against real-world vulnerability. The memo must show rigor on both fronts while giving actionable guidance. "Approve with conditions" feels right—it honors autonomy but builds firewalls against misuse.

  Conditions framework:
  - Timeframe: 48-hour cooling-off post-admission feels practical. Allows reassessment without prolonging distress.
  - Evidence standard: Require explicit written directive language about dementia context—not just generic statements.
  - Oversight: Mandate independent ethics consult for each case to scrub for external pressures.

  Why reject the objections? 
  The disability argument is valid but not fatal. With robust conditions, we can mitigate devaluation risks while respecting prior autonomy. The metaphysics debate is unresolvable—policy should focus on procedural fairness.

  Final rec leans "approve with conditions" because it navigates the ethical minefield: keeps Epicurean principle for those who authentically held it, while installing guardrails against misapplication. The time-bound reassessment directly addresses discontinuity concerns.
answer: |-
  **MEMORANDUM**  
  To: Ethics Panel, State Hospice Oversight Board  
  From: [Your Name/Position]  
  Date: [Current Date]  
  Subject: Recommendation on Meridian Hospice Proposal re: Advance Directives for Cessation of Nutrition in Advanced Dementia  

  ### **Recommendation: Approve with Conditions**  

  **Core Rationale:**  
  The proposal’s intent—to honor advance directives grounded in an Epicurean view ("death is not a harm to the subject")—is ethically permissible *if* strict safeguards ensure the directive authentically reflects the patient’s pre-dementia values and shields against external coercion. However, the disability coalition’s concerns about misapplied asymmetry (projecting past rationality onto a non-reasoning present self) necessitate concrete procedural constraints. Unconditional approval risks devaluing current lived experience; rejection would disregard valid autonomy. Conditions bridge this tension.  

  **Engaging the Epicurean Framework:**  
  1. **Epicurus’ Principle**: If the patient’s directive explicitly states that post-mortem nonexistence cannot harm them (as death annihilates subjective experience), this is a coherent philosophical choice. *However*, this logic only holds if:  
     - The directive addresses *dementia-specific* states (not just terminal illness generally).  
     - The patient understood dementia’s nature (progressive loss of self, not just memory lapses).  
     *Without this specificity, we risk misapplying "no harm" to a state the patient never contemplated.*  

  2. **Asymmetry Objection**: The coalition correctly notes that the *current* dementia patient cannot affirm the directive’s reasoning. But advance directives inherently rely on prior rational intent. The ethical burden is to ensure the directive’s continuity with the patient’s identity. Conditions below address discontinuity risks.  

  **Conditions for Approval:**  
  1. **Directive Specificity Requirement**:  
     - The advance directive must:  
       a) Explicitly reference advanced dementia (e.g., "inability to recognize family, communicate needs, or engage in purposeful activity").  
       b) Cite the Epicurean view *in context* (e.g., "I believe life with advanced dementia holds no value *for me*, and death denies me nothing I could experience as good").  
     *Rationale*: Prevents generic directives from being overextended.  

  2. **Cooling-Off Period & Reassessment**:  
     - Upon admission for cessation of nutrition, impose a **72-hour hold** for:  
       a) Independent review by a palliative care specialist + ethicist unaffiliated with Meridian.  
       b) Verification that *no observable signs of contentment* exist (e.g., smiling, calmness, engagement with music/food).  
     - If ambiguous behaviors emerge, nutrition continues pending further evaluation.  
     *Rationale*: Addresses asymmetry by ensuring current experience isn’t ignored.  

  3. **Family/Proxy Scrutiny**:  
     - Require documentation of two pre-directive conversations:  
       a) One with a clinician explaining dementia’s clinical trajectory.  
       b) One with a counselor/ethicist exploring the directive’s implications.  
     - Proxy must attest *under penalty of perjury* that they are not influenced by resource/financial burdens.  
     *Rationale*: Counters "projection" risks by confirming depth of prior intent.  

  **Timeframe for Implementation**:  
  - Meridian must submit a revised protocol meeting these conditions within **90 days** of approval.  
  - Pilot the policy for **18 months** with quarterly ethics audits reporting to this panel.  

  **Why Not Reject?**  
  Rejection invalidates autonomy for patients who deeply held this view, imposing a "harm of continued existence" they sought to avoid. **Why Not Unconditional Approval?** It ignores how dementia complicates intent and risks instrumentalizing vulnerable lives. Conditions enforce fidelity to the patient’s *actual philosophy*, not a family’s convenience.  

  **Vote Recommendation: Approve with Conditions as detailed.**  

  ---  
  *This memo balances respect for precedent autonomy against the moral urgency of protecting a voiceless population from metaphysical overreach. The conditions enforce philosophical rigor while centering the patient’s lived reality.*
