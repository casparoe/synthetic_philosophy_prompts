answer: |-
  Here's a targeted 8-question set with embedded follow-ups designed to push Dr. Vasquez’s arguments into contested terrain, tailored for a theory-savvy audience:

  1. **Core Mechanism**:  
     *"You frame 'deliberative residue' as a cognitive rewiring that primes future rationalization. But is this primarily a *psychological* adaptation within the individual legislator, or an *institutional* logic reinforced by systems like party discipline or re-election incentives?"*  
     → *Likely Follow-Up (if she leans psychological)*: **"If it's psychological, how do you empirically distinguish residue from simple cognitive dissonance reduction? If institutional, doesn't that dilute the 'rewiring' metaphor to mere path dependency?"**  
     → *Likely Follow-Up (if she hybridizes)*: **"When these interact, which force typically *drives* the residue—personal moral exhaustion or institutional reward structures?"**

  2. **Vs. Adaptive Preferences (Elster)**:  
     *"Elster’s 'sour grapes' describes subconscious preference-shifts after *failure*. How is deliberative residue distinct, given it follows *successful* (though dirty) political action and seems to involve conscious rationalization?"*  
     → *Anticipated Follow-Up*: **"Couldn’t residue just be sour grapes in reverse—'sweet lemons,' where actors over-justify *chosen* compromises? Why posit a new mechanism?"**

  3. **"Moral Corruption" Rebuttal**:  
     *"Critics might argue 'deliberative residue' rebrands old concepts like moral corruption or habituation. What does your framework reveal that traditional accounts of vice accumulation *miss*?"*  
     → *Sharp Follow-Up*: **"If residue is non-volitional ('rewiring'), doesn’t that *absolve* agents of responsibility in ways corruption narratives don’t—effectively pathologizing dirty hands?"**

  4. **Democratic Accountability**:  
     *"You suggest residue persists across electoral cycles. Can democratic accountability (e.g., protests, voting) 'reset' deliberative residue, or do these mechanisms *intensify* it by rewarding justifications that placate voters?"*  
     → *Anticipated Follow-Up*: **"When voters endorse compromised politicians, does that transfer residue to the *demos* itself, creating a feedback loop of lowered expectations?"**

  5. **Collective Weak-Will**:  
     *"Does deliberative residue make legislators resemble *akratic* collectives—knowing principle demands refusal, yet consistently yielding? Or is this misapplying individual weakness to structural contexts?"*  
     → *Anticipated Follow-Up*: **"If residue is systemic, does 'collective akrasia' imply complicity is *unavoidable*, rendering your critique politically fatalist?"**

  6. **Temporal Scale**:  
     *"Residue implies cumulative degradation. But can a *single* catastrophic compromise (e.g., authorizing torture) create residue faster than minor, repeated deals? Or is residue inherently incremental?"*  
     → *Anticipated Follow-Up*: **"Doesn't the 'big bang' scenario contradict your emphasis on *iterative* rationalization?"**

  7. **Resistance & Reversibility**:  
     *"Are there real-world examples of legislators *shedding* deliberative residue—say, after leaving office? Or is the rewiring permanent, making redemption impossible within politics?"*  
     → *Anticipated Follow-Up*: **"If irreversible, does politics become a machine for producing morally damaged agents, or can institutional redesign prevent residue formation?"**

  8. **Normative Implications**:  
     *"If residue is inevitable in politics, does your theory imply we must abandon dirty-hands dilemmas as irrelevant—focusing instead on damage control? Or does it demand *more* rigid principles?"*  
     → *Anticipated Follow-Up*: **"Doesn't this force a false choice between political paralysis and moral decay?"**

  ---

  ### Why This Works
  - **Follow-Ups as Scalpels**: Each follow-up preempts evasion by targeting conceptual tensions (e.g., §3’s pathologization challenge forces clarity on agency vs. determinism).  
  - **Theory-Specific Nuance**: §2 presses the *successful action* distinction from Elster; §4 reframes accountability as *potential accomplice*.  
  - **Weak-Will Angle**: §5 frames collective akrasia precisely—inviting Vasquez to defend/resist structural blame-shifting.  
  - **No Jargon Overload**: Uses terms like *akrasia*, *path dependency*, and *adaptive preferences* familiar to grad-level theorists without requiring citations.  
  - **Edge on Corruption (§3)**: The follow-up reframes "it’s just corruption" as *more* agent-centric than Vasquez’s model, trapping the deflection.  

  **Pro Tip**: If she resists the "weak-will" framing in §5, pivot to: *"If not akrasia, is residue better understood as *structural demoralization*—where institutions incentivize moral self-deception?"** This maintains pressure on system vs. agency.
