  First, pre-1973 diagnosis. Need to identify how the label functioned as an interactive kind. The diagnosis wasn't just medical - it was a legal weapon (sodomy laws), employment filter (security clearances), and cultural script ("sickness" narratives). The classified population internalized this: some sought conversion therapy hoping to become "normal," others like Frank Kameny flipped the script with "Gay is Good." Activism here is key - the Mattachine Society and later Gay Liberation Front literally weaponized the APA's own language against them. That's looping in action: the classification created conditions for its own contestation.

  Now the hard part: declassification as anti-looping. Hacking usually describes stabilization, but here the classification implodes. The key is seeing how the *resistance* to the label became so powerful it shattered the category. The activists didn't reject being interactive kinds - they rejected the *pathologizing* interaction. What survived wasn't the classification but the collective identity it accidentally forged. This suggests looping effects persist even when classifications die; they leave "kind-residues."

  Theoretical implications: This is confirmation with a twist. Hacking's model predicts classifications shape people, but this shows they can also create the forces that destroy them. The real gap in Hacking is how declassification happens - the mechanics of category death. The 1973 case suggests it requires institutional vulnerability (APA's credibility crisis) + mobilized interactive kinds + counter-expertise (Hooker's study). That's new terrain for looping theory.

