  **Grade: B+**  
  (Strong grasp of core concepts, but fumbles a critical nuance. *Coffee-stain smudge obscures the 'A' on the rubric.*)

  **Marginalia:**

  > *"Dennett rejects the Cartesian theater — the idea that there's one inner screen where consciousness happens."*  
