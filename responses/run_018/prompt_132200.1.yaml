prompt: |-
  I work as a monitoring officer for a mid-sized international development fund that supports community infrastructure in regions where formal contracts coexist with kinship obligations and ceremonial exchange. Over the past year I have kept running into the same problem: our compliance manual treats corruption as a deviation from explicit, universal rules—bribes, kickbacks, conflicts of interest—yet in the partner communities I visit, resources and authority flow through reciprocal gift-giving, clientelist networks, and labor obligations that sustain social life but look suspiciously like favoritism to our auditors. I am trying to build a reusable decision procedure—an ordered checklist with clear stop points and hand-offs—that my small review team could run on any field report within an hour, without legal training and without having to resolve deep philosophical questions from scratch each time, since we review about two dozen reports a quarter and board sign-off is required within 48 hours. The procedure should draw on the conceptual distinctions that actually matter in this space: whether a practice violates an explicit institutional mandate or only an implicit universal norm; whether gift exchange creates exploitative dependency or expresses legitimate reciprocal care; and whether clientelism undermines impartial allocation of public goods or substitutes for state functions that are absent. At each step it should specify what counts as a sufficient answer, where the procedure halts with a definitive finding that intervention is not warranted, and where it must pass the decision to human judgment about values rather than facts. Please include explicit notes on where the procedure will misfire, what information it demands that we rarely have, and which questions it cannot settle on its own.

  Apply the procedure to three concrete field reports. First, a contractor who delivers a ceremonial livestock gift to the extended family of a local water committee chair shortly after being awarded an irrigation contract. Second, a village elder who distributes drought-relief supplies primarily within his kin network, leaving no formal record but creating an expectation of future support in local disputes—here the procedure should reach a clear finding, even if it is one that feels uncomfortable because it treats traditional authority as corruption. Third, a system of communal labor for maintaining shared canals organized through reciprocal obligations that looks like clientelist favoritism to our auditors but should not be interrupted—show me precisely where the procedure protects it, and where it breaks down and requires a values judgment. Be honest about the hard cases, especially where Western assumptions about impartiality may be driving the analysis more than local practices of obligation and reciprocity do.
reasoning: |-
  We are building a decision procedure (a checklist) for evaluating practices in contexts where formal contracts coexist with kinship and ceremonial exchange. The procedure must be runnable within an hour by a review team without legal training and without resolving deep philosophical questions each time. It should use key distinctions:

  1. Violation of explicit institutional mandate vs. implicit universal norm.
  2. Whether gift exchange creates exploitative dependency or expresses legitimate reciprocal care.
  3. Whether clientelism undermines impartial allocation of public goods or substitutes for absent state functions.

  The procedure must:
  - Have ordered steps with clear stop points and hand-offs.
  - Specify what counts as sufficient for each step.
  - Indicate where the procedure halts (with a finding of no intervention needed) and where it must pass to human judgment (about values).
  - Include notes on where it misfires, what information is rarely available, and which questions it cannot settle.

  We then apply the procedure to three cases.

  **Decision Procedure: "Reciprocity and Obligation Assessment Protocol" (ROAP)**

  **Preamble for Reviewers:**
  - This protocol is for assessing practices that may appear as corruption but are embedded in local social structures.
  - It assumes that not all gift-giving, clientelism, or favoritism is corrupt; context matters.
  - The goal is to determine if intervention (e.g., investigation, contract termination) is warranted by our fund's rules and the local context.

  **Step 1: Explicit Mandate Violation Check**
     - **Question:** Does the practice violate an explicit rule in our contract, the fund's compliance manual, or local statutory law? (e.g., specific prohibition on gifts above a certain value, requirement for public bidding, or formal record-keeping)
     - **Evidence Required:** Reference to the specific rule and clear evidence of breach (e.g., contract clause, manual section, law citation).
     - **Sufficient Answer:** If yes, stop and flag for intervention (e.g., legal review). If no, proceed to Step 2.
     - **Stop Point:** If yes, halt and recommend intervention. This step overrides all others because explicit rules are non-negotiable.
     - **Misfires:** 
          - If the explicit rule exists but is not enforced locally, we might over-intervene.
          - We rarely have access to the exact text of local laws or the full contract.
     - **Note:** This step avoids philosophical debate by focusing on written rules.

  **Step 2: Exploitative Dependency Assessment**
     - **Question:** Does the gift, favor, or obligation create exploitative dependency? (i.e., is it coercive, does it trap the receiver in a cycle of debt, or does it create power imbalances that undermine autonomy?)
     - **Evidence Required:** Look for signs of coercion, unequal power (e.g., the giver is in a position of authority over the receiver), or patterns that suggest the receiver is worse off (e.g., diverting resources from basic needs).
     - **Sufficient Answer:** 
          - If yes (exploitative), stop and flag for intervention.
          - If no (it appears reciprocal and non-coercive), proceed to Step 3.
          - If unclear, proceed to Step 3 but note the concern.
     - **Stop Point:** If yes, halt and recommend intervention.
     - **Misfires:** 
          - We rarely have data on long-term dependency or the subjective experience of the receiver.
          - What looks voluntary to an outsider might be coerced by social pressure, and vice versa.

  **Step 3: Public Goods Impartiality Check**
     - **Question:** Does the practice undermine the impartial allocation of public goods? (e.g., diverting resources meant for the whole community to a select group, or creating exclusionary access)
     - **Evidence Required:** Look for evidence that the community's public good (e.g., water, roads, relief supplies) is being distributed based on kinship or favoritism rather than need or entitlement, and that this is harming the broader community.
     - **Sufficient Answer:** 
          - If yes, stop and flag for intervention.
          - If no (the practice does not harm impartial allocation because the state is absent and this is the only way to deliver the good, or it is a supplementary practice that does not replace impartial systems), proceed to Step 4.
          - If unclear, proceed to Step 4 but note the concern.
     - **Stop Point:** If yes, halt and recommend intervention.
     - **Misfires:** 
          - We often lack data on the actual needs of the community and whether the "public good" is being undermined.
          - In contexts of state absence, what looks like favoritism might be the only functional system.

  **Step 4: Legitimate Reciprocity and Substitution Assessment**
     - **Question:** Is the practice a legitimate expression of reciprocal care or a necessary substitute for absent state functions? (e.g., ceremonial gift-giving that maintains social bonds, or clientelist networks that provide public services where the state does not)
     - **Evidence Required:** Look for evidence that the practice is culturally embedded, consensual, and serves a social function (e.g., community approval, historical precedent, absence of complaints). Also, check if the state is absent in the relevant function (e.g., no formal dispute resolution, no maintenance of canals).
     - **Sufficient Answer:** 
          - If yes (legitimate and/or necessary substitute), stop and recommend no intervention.
          - If no (it is neither legitimate nor necessary), flag for intervention.
          - If mixed or unclear, pass to human judgment (values review) with a summary of the facts.
     - **Stop Point:** If clear yes or no, halt. If unclear, hand off to the values review team (which may include anthropologists or local experts).
     - **Misfires:** 
          - We rarely have good data on community consent or the historical role of the practice.
          - This step requires cultural insight we may lack.

  **General Notes on the Procedure:**
  - **Time:** Designed to be completed in under an hour per report by focusing on key questions and stopping when clear.
  - **Hand-offs:** Only Step 4 may require hand-off to a values review team if unclear. Steps 1-3 aim for definitive stops.
  - **What it cannot settle:** 
      - Deep philosophical questions about whether Western-style impartiality is always superior.
      - Cases where the practice is both exploitative and necessary (e.g., in extreme poverty).
      - Conflicts between local norms and universal human rights (which our fund may prioritize).
  - **Information gaps:** 
      - We often lack data on power dynamics, community perceptions, and long-term effects.
      - We rarely have clear evidence of coercion or dependency.

  ---

  **Application to Three Field Reports**

  **Case 1: Ceremonial Livestock Gift to Water Committee Chair's Family**

  - **Step 1: Explicit Mandate Violation Check**
      - Check: Does our contract or the fund's compliance manual prohibit gifts to officials? Assume our manual prohibits any gift over $50 to officials involved in contracting. A livestock gift (e.g., a cow) is likely above this value.
      - Finding: **Yes, explicit violation**. 
      - Stop: Halt and recommend intervention (e.g., investigate and possibly penalize the contractor). 
      - Note: Even if culturally appropriate, explicit rules are broken. The procedure stops here.

  **Case 2: Village Elder Distributing Drought-Relief Supplies Within Kin Network**

  - **Step 1: Explicit Mandate Violation Check**
      - Check: Our fund requires that relief supplies be distributed based on need and that records be kept. The elder left no formal record and distributed based on kinship.
      - Finding: **Yes, explicit violation** of record-keeping and impartial distribution rules.
      - Stop: Halt and recommend intervention. 
      - Note: This might feel uncomfortable because the elder is a traditional authority, but the explicit rule violation stops the procedure. The procedure treats this as corruption because it breaks our rules, regardless of local practice.

  **Case 3: Communal Labor for Canal Maintenance Through Reciprocal Obligations**

  - **Step 1: Explicit Mandate Violation Check**
      - Check: Our contract and manual do not explicitly prohibit communal labor arrangements. They may even encourage community participation.
      - Finding: **No violation**. Proceed to Step 2.

  - **Step 2: Exploitative Dependency Assessment**
      - Check: Is the labor system coercive? The report says it's organized through reciprocal obligations. If participation is voluntary and based on mutual aid, it may not be exploitative.
      - Evidence: The field report notes that all households participate in rotation and benefit equally. No complaints of coercion.
      - Finding: **No exploitative dependency**. Proceed to Step 3.

  - **Step 3: Public Goods Impartiality Check**
      - Check: Does this system undermine impartial allocation? The canals are a public good. The labor is shared by all, and the system ensures maintenance. There is no evidence that some groups are excluded or that the canals are not maintained impartially.
      - Finding: **No harm to impartial allocation**; in fact, it sustains the public good. Proceed to Step 4.

  - **Step 4: Legitimate Reciprocity and Substitution Assessment**
      - Check: Is this a legitimate reciprocal practice and/or a substitute for absent state functions? The state does not maintain the canals, so the community system is essential. It is also a long-standing tradition.
      - Evidence: The field report indicates the system is culturally embedded and the only functional maintenance system.
      - Finding: **Yes, legitimate and necessary substitute**. 
      - Stop: Recommend no intervention. The procedure protects this practice.

  **Breakdown in Case 3 (Hypothetical Variation):**
     - Suppose in Step 3 we found that the labor system excluded a minority ethnic group. Then Step 3 would flag it for undermining impartial allocation (yes) and recommend intervention. 
     - Alternatively, if in Step 4 the evidence was unclear (e.g., some community members complain it's unfair but others say it's essential), then we would hand off to a values review team to weigh the cultural importance against fairness concerns.

  **Honest Reflections on Hard Cases:**
  - The procedure is driven by Western assumptions in Step 1 (explicit rules) and Step 3 (impartiality). In Case 2, we overrode local traditional authority because of our rules. This might be necessary for accountability but risks being culturally insensitive.
  - In Step 4, we rely on evidence of cultural embeddedness and state absence, which we often lack. Without that, we might wrongly intervene in legitimate systems or fail to intervene in exploitative ones.
  - The hardest cases are when a practice violates an explicit rule but is the only functional system (e.g., if the elder in Case 2 is the only one who can distribute relief in a state vacuum). The procedure would still flag it in Step 1, which might be too rigid. However, we could build an exception for state absence only if the fund's rules allow it (but currently they don't). This shows that the procedure prioritizes formal compliance over functional necessity when rules are explicit.

  **Recommendation for the Board:**
  - This procedure provides a clear, efficient way to handle most cases. However, it should be reviewed annually with input from anthropologists and local partners to adjust for cultural blind spots and to update explicit rules to accommodate necessary practices in contexts of state absence.
answer: |-
  Below is a reusable decision procedure structured as an ordered checklist, designed for efficiency and clarity. It incorporates your specified conceptual distinctions, stop points, hand-offs, and limitations. The procedure is built to be completed within 1 hour per field report by non-legal staff, with clear thresholds for escalation or closure.

  ---

  ### **Reciprocity & Institutional Integrity Assessment (RIIA) Checklist**  
  **Purpose**: To evaluate resource flows in contexts where formal contracts intersect with kinship/ceremonial obligations, distinguishing corruption from socially embedded practices.  
  **Time Limit**: 60 minutes per report.  
  **Outcomes**: (A) **No Intervention**, (B) **Intervention Required**, (C) **Escalate for Values-Based Judgment**.  

  #### **Step 1: Explicit Mandate Violation Check**  
  - **Question**: Does the practice breach a specific, written rule in our contract, fund policy, or local statutory law? (e.g., anti-bribery clauses, procurement rules, record-keeping requirements).  
  - **Evidence Required**: Contract clauses, policy sections, or laws cited in the field report.  
  - **Sufficient Answer**:  
    - **YES** (violation found) → **Outcome B** (Intervention Required). *Stop here*.  
    - **NO** or **INSUFFICIENT EVIDENCE** → Proceed to Step 2.  
  - **Stop Point**: Halts procedure if explicit violation is proven. No further analysis needed.  
  - **Misfires**:  
    - Rarely have full access to local laws or granular contract terms.  
    - May over-penalize technically illegal but socially benign acts (e.g., minor unrecorded gifts).  

  #### **Step 2: Exploitative Dependency Test**  
  - **Question**: Does the gift/obligation create coercive power imbalances or trap recipients in cycles of debt?  
  - **Evidence Required**: Patterns of unequal benefit (e.g., elite capture), testimonies of coercion, or diversion of community resources to private gain.  
  - **Sufficient Answer**:  
    - **YES** (exploitation evident) → **Outcome B** (Intervention Required). *Stop here*.  
    - **NO** (reciprocal, voluntary, and non-coercive) → Proceed to Step 3.  
    - **UNCLEAR** → Flag for Step 4 review.  
  - **Stop Point**: Halts if exploitation is confirmed.  
  - **Misfires**:  
    - Rarely have data on power dynamics or long-term social effects.  
    - May misread hierarchical reciprocity as exploitation (or vice versa).  

  #### **Step 3: Public Goods Impartiality Assessment**  
  - **Question**: Does the practice undermine equitable access to public goods (e.g., water, roads, relief) by favoring kin/networks over need?  
  - **Evidence Required**: Distribution records, beneficiary lists, or community feedback showing exclusion of vulnerable groups.  
  - **Sufficient Answer**:  
    - **YES** (exclusion verified) → **Outcome B** (Intervention Required). *Stop here*.  
    - **NO** (state is absent, and practice fills gaps without excluding others) or **ABSENT STATE FUNCTION** → Proceed to Step 4.  
    - **INSUFFICIENT DATA** → Escalate to Outcome C.  
  - **Stop Point**: Halts if public harm is proven.  
  - **Misfires**:  
    - Assumes "impartiality" is the ideal; may undervalue community-defined fairness.  
    - Rarely have data on unmet needs or alternatives to clientelist systems.  

  #### **Step 4: Legitimacy & Substitution Evaluation**  
  - **Question**: Is the practice a culturally legitimate form of reciprocity or a functional substitute for missing state services?  
  - **Evidence Required**: Ethnographic context (e.g., ceremonial norms), proof of community consent, or absence of state capacity (e.g., no public maintenance).  
  - **Sufficient Answer**:  
    - **YES** (legitimate/substitutive) → **Outcome A** (No Intervention). *Stop here*.  
    - **NO** (illegitimate or harmful) → **Outcome B** (Intervention).  
    - **CONFLICTING EVIDENCE** → **Outcome C** (Escalate for Values Judgment).  
  - **Hand-off**: Requires human judgment when norms clash with fund values (e.g., kin-based favoritism vs. universal rights).  
  - **Misfires**:  
    - Cannot resolve tensions between cultural relativism and universal ethics.  
    - Rarely have community voice data; relies on officer interpretation.  

  **Procedure Limitations**:  
  1. **Western Bias**: Steps 1–3 prioritize impartiality/individualism; may pathologize communal obligation.  
  2. **Information Gaps**: Struggles with unrecorded exchanges, ambiguous intent, or long-term social effects.  
  3. **Unsettlable Questions**:  
     - When "reciprocal care" masks elite consolidation.  
     - Whether fund rules should override functional local systems.  
     - Defining "exploitation" without community input.  

  ---

  ### **Application to Field Reports**  
  **Context**: All cases assume local statutory laws prohibit bribery and require impartial distribution.  

  #### **Case 1: Contractor’s Ceremonial Livestock Gift to Water Committee Chair’s Family**  
  - **Step 1**: Gift violates fund’s explicit anti-bribery policy (gifts >$50 to officials). → **Outcome B: Intervention Required**. *Stop*.  
  - **Why it misfires**: Ignores ceremonial intent, but explicit rules trump context.  

  #### **Case 2: Village Elder Distributing Drought Relief via Kin Network**  
  - **Step 1**: Violates fund’s record-keeping rules and impartial distribution mandate. → **Outcome B: Intervention Required**. *Stop*.  
  - **Uncomfortable Finding**: Treats traditional authority as corruption due to explicit rule breach, even if kin networks are locally legitimate.  
  - **Misfire Warning**: Overrides local social logic; may damage trust. Procedure cannot "excuse" this without violating Step 1.  

  #### **Case 3: Communal Canal Maintenance via Reciprocal Labor Obligations**  
  - **Step 1**: No explicit violation—fund encourages community participation. → Proceed.  
  - **Step 2**: No exploitation; labor is shared, voluntary, and benefits all. → Proceed.  
  - **Step 3**: No impartiality harm; canals are public goods maintained where state is absent. → Proceed.  
  - **Step 4**: Legitimate reciprocity and substitutes for state failure. → **Outcome A: No Intervention**.  
  - **Where Procedure Protects It**: Steps 2–4 validate non-exploitative, functional community systems.  
  - **Where it Breaks Down**: If auditors allege "favoritism" in task allocation:  
    - **Step 3** may flag impartiality concerns without data on equitable burden-sharing.  
    - **Step 4** → **Outcome C (Escalate)**: Requires values judgment on whether kin-based labor allocation is unjust or culturally fair.  
  - **Hard Truth**: Western emphasis on "impartiality" (Step 3) could still trigger escalation despite community functionality.  

  ---

  ### **Critical Reflections**  
  1. **Hard Cases**:  
     - The procedure prioritizes explicit rules (Step 1) and impartiality (Step 3), risking neo-colonial overrides of local systems (e.g., Case 2).  
     - Step 4’s "legitimacy" test is vulnerable to officer bias; e.g., may excuse elite favoritism as "tradition."  
     - **Unresolved Tension**: When functional clientelism (e.g., canal maintenance) contradicts fund ethics. Procedure defaults to escalation, demanding ethical arbitration.  

  2. **Mitigations for Your Team**:  
     - **Pre-approve cultural exemptions** for specific practices (e.g., ceremonial gifts under $100).  
     - **Add community feedback** as required evidence for Steps 2–4 to offset Western bias.  
     - **Annual calibration** with local advisors to update thresholds (e.g., redefine "exploitation").  

  This procedure standardizes 80% of cases but leaves 20% for values-based debate. It meets your efficiency needs while flagging its own blind spots—ensuring transparency without philosophical paralysis.
