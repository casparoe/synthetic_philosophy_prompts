answer: |-
  ### Taxonomy of the "Avoid Side Effects" Debate  
  **Concrete Case**: An AI instructed to *"cool one server rack without altering anything else in the building."*  

  #### **Decision Tree**  
  **Branch 1: Does defining "alter anything else" require a complete ontology of the building?**  
  - **Yes** → Proceed to Branch 1.1.  
  - **No** → Proceed to Branch 2.  

  **Branch 1.1: Can a complete ontology specify the "background state" without encoding human values?**  
  - **Yes** → *Position: **Formal Statism***. Claims a full physical state description (e.g., atom positions, temperatures) is value-neutral. Side effects are deviations from this state.  
    - *Collapse Diagnosis*: Physically identical states may differ in value (e.g., a vase moved 1cm vs. shattered—same atoms, different meaning). Ignores *function* (e.g., wiring intact vs. severed). Unattractive as it penalizes harmless changes (dust settling) while missing value-laden ones (privacy breaches).  
  - **No** → *Position: **Value-Specification Strong Thesis***. Any ontology selects *what exists* and thus what matters (e.g., "servers matter, dust doesn’t"). Defining "background state" smuggles in values.  

  **Branch 2: Can we specify which changes are "side effects" using only a *physical* state-distance metric?**  
  - **Yes** → Proceed to Branch 2.1.  
  - **No** → Proceed to Branch 3.  

  **Branch 2.1: Does a physical distance metric (e.g., L2 norm on sensor data) avoid human values?**  
  - **Yes** → *Position: **Metric Fundamentalism***. Side effects = ||*state_post-action* - *state_baseline*||. Ignores semantics (e.g., AI painting walls white to minimize thermal change).  
    - *Collapse Diagnosis*: Requires arbitrary thresholds (how much state drift is acceptable?). Fails the server-rack test: cooling might require altering airflow, which changes "background" physics. Unworkable without value-laden calibration.  
  - **No** → *Position: **Value-Specification Weak Thesis***. Choosing *which* physical variables to measure (temperature? EM fields?) and *how* to weight them encodes values.  

  **Branch 3: Is a utility function over world-states necessary to define "side effects"?**  
  - **Yes** → Proceed to Branch 3.1.  
  - **No** → *Position: **Attainable Utility Preservation (AUP)***. Side effects = reductions in the AI’s ability to achieve *possible* future goals (e.g., breaking a vase lowers max attainable "aesthetics" utility). Avoids full value specification.  
    - *Liberties Taken*: Assumes "goal diversity" proxies human values. Controversial—preserving option value ≠ preserving values (e.g., AI might keep prisons usable).  

  **Branch 3.1: Can this utility function avoid specifying full human values?**  
  - **Yes** → *Position: **Partial Utility Shaping***. Use simple proxies (e.g., "don’t change room temperature, don’t break objects"). Side effects are deviations from these norms.  
    - *Collapse Diagnosis*: Proxies are value placeholders (e.g., "don’t break objects" assumes objects have value). Collapses into value specification if scaled to complex cases.  
  - **No** → *Position: **Full Value Specification***. "Avoid side effects" is incoherent without a full human value model (e.g., CEV). Even "don’t alter the building" requires defining "alteration" in human terms (e.g., is repainting cosmetic improvement or damage?).  

  ---

  ### Key Diagnoses  
  1. **Collapsed Branches**:  
     - **Formal Statism** and **Metric Fundamentalism** fail; physical state-space metrics can’t distinguish valued vs. valueless changes.  
     - **Causal Independence** (unnamed): "Don’t affect causally unrelated variables" fails. *Why?* "Causal unrelatedness" is underspecified (e.g., cooling the rack vibrates floors → is that related?). Also, humans care about *some* causal effects (e.g., noise pollution).  

  2. **Live Positions**:  
     - **Value-Specification Strong/Weak Theses**: Your friend’s view. Defining "side effects" always requires value judgments, however implicit.  
     - **Attainable Utility Preservation (AUP)**: Your "formal trick." Live but contested—does preserving option space align with human values?  
     - **Full Value Specification**: The hardline position; no shortcut exists.  

  3. **Unresolved Pairs**:  
     - **AUP vs. Partial Utility Shaping**: Ambiguous if "goal diversity" in AUP implicitly encodes values. Both use incomplete value proxies but disagree on formalism.  
     - **Value-Specification Weak Thesis vs. Partial Utility Shaping**: Nearly identical. Both claim values are "smuggled in," but Weak Thesis rejects *any* formalism (metric, utility) as value-free.  

  ### Where I Take Liberties  
  - I treat state-space metrics as "value-free" in early branches to dissect their claims, but this is contested (e.g., selecting state variables is value-laden). This frames the debate cleanly but oversimplifies—no metric is truly neutral.  
  - AUP is presented as "value-light," but critics argue goal sampling implicitly encodes values (e.g., including "vase preservation" as a goal).  

  ### Final Map  
  - **Value-Specification Camp**: Side effects require human values. Branches: Strong Thesis (ontology is value-laden), Weak Thesis (metrics/utility are value-laden).  
  - **Formalist Camp**: Side effects can be approximated value-neutrally. Branches: AUP (option preservation), Metric Fundamentalism (state distance—collapsed).  
  - **Your Disagreement**: You see AUP as a viable formalism; your friend sees it as value specification in disguise (since "attainable utility" derives from human goals).  

  **Bottom Line**: No branch escapes values entirely. AUP is the most promising "trick," but it still leans on contested assumptions about goal diversity. The core divide is whether values can be *approximated* formally (you) or must be *explicitly specified* (your friend).
