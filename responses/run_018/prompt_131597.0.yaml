answer: |-
  The cracked bell above the Assembly Hall tolled, its sound thin in the damp air of the Glimmering settlement. Mara traced the grain of the worn wooden table, her palm slick. Two months ago, sortition had plucked her name from the communal pot. Reluctant assembly member. She’d believed in the safeguards: one-year terms, no party labels, decisions forged in open debate, not backroom deals. A bulwark against the old world’s poison, replicated even after the Collapse.

  Now, they debated Eli’s fate.

  Eli, gaunt and defiant in the accused chair, had stolen antibiotics from the communal storehouse. His son, feverish with the creeping lung-rot, lay wasting in their hut. The medicine was scarce, meticulously rationed by prior assemblies. The penalty for theft was clear: permanent exclusion from the settlement’s protection.

  Mara understood the law’s necessity. Scarcity demanded harshness. But she also knew Eli: a quiet man, a skilled tanner whose hands shook now only when tending his son. The medicine rationed that week wasn’t allocated to anyone critically ill; it was held in reserve. Stealing it was wrong, yes. But permanent exile? It felt like crushing a beetle with a boulder.

  Kael, the assembly foreman chosen by lot that session, spoke with measured gravity. "Precedent binds us. Compassion is a luxury we cannot afford. If we soften for Eli, who next? The fabric frays stitch by stitch."

  Nods rippled around the long table. Mara saw the pattern now, invisible lines drawn over shared meals, shared work rotations – the Fields group, mostly older settlers who’d cleared the first plots; the Foundry workers, younger, focused on metal salvage. No names, no banners, but loyalties ran deep. The Fields group, Kael’s informal circle, held sway today. They believed in unwavering rules, the discipline that had kept them alive.

  Mara raised her hand. "The medicine wasn’t yet assigned. His son *is* critically ill, unlike any on this week’s list. Exile is a death sentence for both of them. Could we not assign the medicine to the boy now, and have Eli work double shifts under guard to repay?"

  Silence. Then, low murmurs. Leeta, whose daughter had died of lung-rot last season without medicine, glared. "So thieves get rewarded? Because they cry loudest?"

  "But it’s not a reward," Mara pressed, her voice tight. "It’s preventing two deaths where one punishment suffices. The law aims for survival, not… cruelty." She faltered on the last word, seeing the hardening faces.

  Kael sighed, a sound of profound disappointment. "Mara, we value your perspective. But this is about more than one man. It’s about *trust*. Trust that the rules protect us all equally. If we start making exceptions based on sympathy, where does it end?" His gaze swept the table, lingering on the Fields contingent – Borin, who’d lost tools to scavengers; Jessa, whose greenhouse was vandalized. "We stand together. We hold the line. Or we fall apart."

  *We stand together.* The phrase echoed. Mara looked around. The Foundry workers seemed uneasy but held their tongues. The Fields group leaned in, unified. She saw Borin hesitate, then give a curt nod to Kael. She saw Jessa’s jaw set. It wasn’t about Eli anymore. It was about belonging. About not being the one who weakened the group. Dissent wasn't just disagreement; Kael’s tone framed it as betrayal of the fragile unity holding the Glimmering together.

  The precise moment struck her like a physical blow. It wasn’t a formal whip enforcing party discipline. It was Kael’s weary disappointment, Leeta’s raw anger channeled into group righteousness, the silent pressure in Borin’s nod, the way everyone avoided her eyes after she spoke. The absence of parties hadn’t abolished the *need* for tribal cohesion; it had just driven it underground, masked it as collective wisdom. They weren't voting on Eli’s fate based on reasoned assessment of justice or survival odds. They were voting to preserve the unspoken bond of their faction, substituting loyalty to the group for independent judgment, just as Weil described. Passion and social allegiance, disguised as necessity, were overriding reason.

  The vote tokens – smooth river stones, white for yes, black for no – were passed around. The question: Uphold the exclusion penalty?

  Mara held her black stone, cool and heavy. Voting 'no' meant exile for Eli and his son. Voting 'yes' meant upholding a punishment she believed was disproportionate, bowing to the pressure of the invisible network. It meant joining the collective passion, silencing her own conviction for the sake of cohesion. It meant becoming part of the machine she’d trusted the system to prevent.

  Around her, hands moved quickly. White stones clicked onto the table. Borin. Jessa. Leeta. Kael. Others followed, a ripple of white.

  Mara closed her fingers tightly around her stone. The silence was immense, filled only by Eli’s ragged breathing. She looked at her hand, knuckles white, the black stone hidden within. The weight of the group’s expectation pressed down, a tangible force promising belonging, safety, at the cost of her own conscience. She lifted her hand, hovering over the table. The black stone, a tiny island of dissent, felt impossibly heavy. Did she place it down, a solitary defiance against the tide? Or did she open her fist, let the white stone join the others, and become another thread in the suffocating fabric of unspoken loyalty?

  Her hand trembled. The stone remained clenched. The bell would toll again soon, marking the vote’s end. In the suffocating quiet, Mara held her breath, the unspoken demand of the group and the solitary weight of her judgment suspended in the air between her fist and the table.
