  ## FTX & EA's "Earning to Give": The Convertibility Trap Laid Bare

  The FTX collapse provides a stark, almost paradigmatic case study for interrogating the "earning to give" (ETG) strand of Effective Altruism (EA) through the lens of your proposed "convertibility trap." Let's map it out as requested, using British English.

  1.  **The Moral Agents:**
      *   **Sam Bankman-Fried (SBF):** The primary agent. His stated motivation was explicit EA: amass vast wealth *specifically to donate it* to high-impact causes (e.g., pandemic prevention, AI safety, global poverty). His actions, however, were the proximate cause of immense harm.
      *   **EA Institutions & Community:** Secondary agents. Organisations like the Centre for Effective Altruism (CEA), GiveWell, and the FTX Future Fund (funded by SBF), alongside prominent EA figures, actively celebrated SBF's pledge and donations, legitimised his approach, and arguably failed in their duty of care regarding due diligence and risk assessment. They created the environment where his behaviour was structurally incentivised and insufficiently challenged.

  2.  **The Welfare Outcome:**
      *   **The Ideal:** According to EA principles, the ultimate welfare outcome is the *actual improvement* in the lives of sentient beings – lives saved from malaria, suffering averted, existential risks mitigated. This is measured through rigorous cause prioritisation and impact evaluation (e.g., DALYs/QALYs saved).
      *   **The Converted Metric:** The "convertibility trap" manifests here. The complex, multifaceted concept of welfare is drastically reduced to a single, fungible, highly legible metric: **dollars pledged or donated**. This metric becomes the primary, often sole, proxy for "impact" within the ETG narrative. Success is measured by the size of the donation figure, decoupled from the *means* of earning it or the *actual downstream effectiveness* of its deployment. The *process* of generating dollars (trading, crypto speculation) is justified *because* it produces the metric.

  3.  **Earning to Give: Predicting Behaviour & Staying Silent:**
      *   **Predicting Behaviour:**
          *   **Pursuit of High-Variance, High-Return Strategies:** ETG explicitly encourages maximising lifetime earnings *to maximise donations*. This logically directs adherents towards fields with outsized earning potential – finance, tech, quantitative trading, crypto. SBF's entry into crypto arbitrage and high-leverage trading is a textbook prediction.
          *   **Focus on Scale:** The sheer scale of potential donations achievable in crypto (compared to, say, becoming a doctor) made it highly attractive under the ETG logic. The promise of billions dwarfed other career paths' earning potential.
          *   **Legibility of "Success":** A $50 million donation is an undeniable, easily communicated "win" for an EA organisation, validating the ETG path. The *size* of the donation figure becomes the dominant signal, irrespective of the risk taken to generate it or the actual EV of the donation's impact.
      *   **Staying Silent / Creating Blind Spots:**
          *   **Means Justification:** ETG is largely silent on the *ethical nature of the money-making process itself*, provided it's legal(ish). It focuses on the *end* (donation) justifying the *means* (earning). This creates the space for the "convertibility trap" – the mechanism generating the dollars becomes self-justifying by virtue of producing the metric. SBF's reckless risk-taking, opaque dealings, and use of customer funds weren't scrutinised *as inherent problems* because the *output* (donation promises/figures) was so legible and large.
          *   **Ignoring Systemic Risk & Negative Externalities:** ETG doesn't inherently account for the systemic risks or societal harms generated by the wealth-creation process. The collapse of FTX caused immense direct harm to customers and employees, destabilised the crypto ecosystem, eroded trust in financial systems, and potentially harmed the reputation of causes EA supports (e.g., AI safety). These negative externalities weren't part of the ETG calculus; only the positive donation metric was counted.
          *   **Expected Value (EV) Miscalibration:** Your "measurability bias" hits the nail on the head. High-variance financial plays *can* generate enormous, highly visible wins (large donations). However, ETG's focus on the *potential* upside (the massive donation figure) can overshadow the *probability* of achieving it and the catastrophic downside risks. SBF's strategy had a high *potential* donation figure, but a disastrously low *expected value* when the high probability of catastrophic failure was factored in. The legibility of the potential upside blinded many to the EV reality.
          *   **Due Diligence & Counterparty Risk:** ETG says little about the *source* stability of the donations. EA institutions failed to rigorously assess the sustainability and legitimacy of SBF's wealth *before* accepting and celebrating it. The "convertibility trap" meant the dollars themselves were the focus, not the fragility of the engine producing them.

  4.  **The Institutional Critique & Charismatic Capture:**
      *   **Institutional Failure:** EA bodies (CEA, FTX Future Fund board) failed catastrophically:
          *   **Due Diligence:** They accepted SBF's wealth and pledges at face value, failing to scrutinise FTX's opaque structure, leverage, use of customer funds, and risk management.
          *   **Conflict of Interest:** Future Fund board members (often senior EA figures) were financially dependent on SBF's continued generosity. This created a powerful incentive *not* to ask hard questions.
          *   **Over-reliance on a Single Source:** EA became dangerously reliant on SBF's promised future donations, embedding his influence and creating perverse incentives to maintain the relationship.
          *   **Ideological Capture:** The allure of billions for their causes potentially clouded judgement. The "convertibility trap" meant the *potential* scale of impact overshadowed ethical and operational red flags. Critiques of SBF's methods could be dismissed as undermining the potential for vast good.
      *   **Charismatic Capture - The Missing Element?:** The institutional critique, focusing on structural incentives and due diligence failures, is confirmed but potentially *incomplete*. It risks underestimating the role of **charismatic capture**.
          *   SBF wasn't just a wealthy donor; he was a charismatic, articulate, seemingly brilliant figure who *embodied* the EA/ETG ideal – the quant genius sacrificing personal comfort to earn billions for good. He spoke the language, funded the projects, and dominated EA discourse.
          *   This charisma and perceived alignment created an aura of exceptionalism. He was seen as the "golden goose," making rigorous scrutiny feel disloyal or counterproductive to the cause. His status within the community acted as a shield. *His personal narrative became entangled with the EA mission itself.*
          *   The institutional failure wasn't just procedural; it was also a failure to resist the gravitational pull of a charismatic leader promising unprecedented resources. The measurable metric (donations) was amplified by the immeasurable force of his personality and perceived commitment.

  **Conclusion:**

  The FTX collapse is a brutal vindication of the "convertibility trap" critique applied to EA's "earning to give." Reducing welfare to the single, fungible metric of dollars donated created a system where:

  1.  The mechanisms generating those dollars (SBF's high-risk, opaque crypto empire) became self-justifying, regardless of their ethical dubiousness or systemic risk.
  2.  The **measurability bias** inherent in legible, large donation figures incentivised high-variance strategies with potentially catastrophic downsides, obscuring their low expected value.
  3.  EA institutions, blinded by the potential scale of donations and suffering from **charismatic capture**, catastrophically failed in due diligence and risk assessment. They prioritised the influx of the metric (dollars) over the sustainability and ethics of its source and the potential for immense negative externalities.

  While structural incentives within ETG predicted SBF's *direction* (high-earning finance/crypto) and the focus on scale, the trap silenced critical questions about means, systemic risk, and expected value calculation. The case confirms the core institutional critique but crucially highlights that **charismatic capture** was a powerful accelerant. SBF wasn't *just* responding to structural incentives; his unique persona actively disarmed the very safeguards meant to scrutinise those incentives, turning the "convertibility trap" into a multi-billion pound disaster. The lesson is stark: when impact is reduced to a single number, the processes generating that number demand *more* scrutiny, not less, and charisma is no substitute for ethics and rigour.
