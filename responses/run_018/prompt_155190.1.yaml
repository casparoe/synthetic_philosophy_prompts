  Take the FTX collapse in late 2022 and analyse it through the lens of effective altruism's 'earning to give' logic, but with a twist I'm calling the 'convertibility trap': once welfare gets reduced to a single fungible metric (dollars donated), the mechanisms that generate that metric become self-justifying even when they decouple from actual welfare outcomes. I'm asking whether Bankman-Fried's risk-taking wasn't just personal greed but structurally incentivised by the measurability bias — high-variance financial plays produce legible, large donation figures that look like success regardless of expected value — and what the instutional critique says about why EA bodies failed to catch it. Don't just recount the fraud; map it properly: who is the moral agent, what counts as the welfare outcome, where does 'earning to give' predict behaviour and where does it stay silent, and does the case confirm the critique or reveal that it misses something about charismatic capture? Please answer in British English.
