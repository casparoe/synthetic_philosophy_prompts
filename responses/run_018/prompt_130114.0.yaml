  ### Moral Perfection Workshop Game: The Hidden Trade-offs  
  **Goal:** Simulate Benjamin Franklin's moral perfection scheme, highlighting the structural tensions between virtues (especially Temperance's foundational role and the trade-offs with Humility) without revealing Franklin's identity until the debrief. Participants experience frustration through a token-based game where success in one virtue forces failure in another, making a "perfect" grid impossible.  

  **Materials per Participant:**  
  - 1 grid sheet (paper) with 5 rows (virtues) and 3 columns (rounds). Label rows as **Virtue 1** to **Virtue 5** (no further explanation).  
  - 6 black tokens (e.g., coins, beads, or paper dots) to mark failures.  
  - 1 rule card (paper) with trade-off rules (see below).  
  - Pencil for marking focus choices.  

  **Grid Sheet Example:**  
  ```
  Round 1        Round 2        Round 3  
  [ ] Virtue 1   [ ] Virtue 1   [ ] Virtue 1  
  [ ] Virtue 2   [ ] Virtue 2   [ ] Virtue 2  
  [ ] Virtue 3   [ ] Virtue 3   [ ] Virtue 3  
  [ ] Virtue 4   [ ] Virtue 4   [ ] Virtue 4  
  [ ] Virtue 5   [ ] Virtue 5   [ ] Virtue 5  
  ```  
  *(Each cell has space for 2 tokens. Participants place tokens to mark failures.)*  

  ---

  ### **Rules**  
  **Core Mechanics:**  
  - Each round, you **focus on one virtue** to avoid failures in it.  
  - You must **place 2 failure tokens** per round in non-focused virtues.  
  - **Trade-off rules** force specific failures when focusing on certain virtues.  
  - **Scoring:** No points or money. "Success" = fewest total failures. "Perfection" (0 failures) is impossible.  

  **Rule Card (Distribute to Participants):**  
  > **Focus Rules:**  
  > - **Virtue 1:** Place 2 failures anywhere (except V1). *Then, remove 1 failure from any virtue (any round).*  
  > - **Virtue 2:** Place 1 failure in **Virtue 5**. Place 1 failure anywhere (except V2).  
  > - **Virtue 3:** Place 1 failure in **Virtue 5**. Place 1 failure anywhere (except V3).  
  > - **Virtue 4:** Place 1 failure in **Virtue 1**. Place 1 failure in **Virtue 5**.  
  > - **Virtue 5:** Place 2 failures anywhere (except V5).  
  >  
  > **Remember:**  
  > - You cannot place failures in your focused virtue.  
  > - Tokens can be stacked (multiple failures per round per virtue).  
  > - Aim for the cleanest grid after 3 rounds.  

  ---

  ### **Round-by-Round Flow** (90 min total)  
  **Intro (5 min):**  
  - "Today, we're simulating a historical self-improvement system. Your goal: minimize failures across 5 virtues over 3 rounds. Perfection is impossible—embrace the tension!"  
  - Distribute materials. Clarify rules using **Virtue 2** as an example:  
    > *"If you focus on Virtue 2, you MUST put 1 token in Virtue 5. Then, put 1 token in any other non-focused virtue."*  

  **Round 1 (20 min):**  
  1. Participants **choose one virtue to focus on** (circle it on their grid).  
  2. They **place 2 failure tokens** based on their focus rule.  
  3. **Virtue 1 focus bonus:** If used, they remove 1 token (from any round/virtue).  
  4. *Observe:* Participants realize trade-offs (e.g., focusing on V2/V3 forces V5 failures).  

  **Round 2 (20 min):**  
  1. Repeat Round 1, but participants strategize:  
     - Those who focused on V2/V3/V4 see **Virtue 5 (Humility) accumulating failures**.  
     - Those who focused on **Virtue 1 (Temperance)** remove tokens but spread failures elsewhere.  
  2. *Frustration peaks:* No matter their choice, failures stack in "linked" virtues.  

  **Round 3 (20 min):**  
  1. Final token placement.  
  2. **Impossible perfection:** All grids have ≥3 tokens (6 placed - 3 possible removals). Virtue 5 often has the most.  
  3. Participants tally total failures per virtue.  

  **Group Sharing (5 min):**  
  - "Share your grid. Who has the fewest failures? Did anyone clear a virtue? Which virtues were hardest to protect? Why?"  
  *(Participants notice Virtue 5 consistently fails.)*  

  ---

  ### **Debrief (20 min): Reveal & Discussion**  
  **Step 1: The Franklin Reveal**  
  > "This system was designed by **Benjamin Franklin** in 1726. His 13 virtues weren’t generic habits—they had a deliberate order and hidden tensions. You just experienced his scheme!"  

  **Step 2: Map Virtues to Franklin’s System**  
  *(Project Franklin’s actual sequence, adapted for the game):*  
  | Game Virtue | Franklin’s Virtue | Why It Matters |  
  |-------------|-------------------|---------------|  
  | Virtue 1    | **Temperance**    | "First in his list—he believed self-restraint enabled all other virtues." |  
  | Virtue 2    | **Silence**       | "Avoid trifling conversation. But Franklin noted it could breed pride." |  
  | Virtue 3    | **Order**         | "Organize time and materials. Pushing this made him rigid and vain." |  
  | Virtue 4    | **Industry**      | "Work hard. Overdoing this exhausted him, breaking Temperance." |  
  | Virtue 5    | **Humility**      | "Imitate Jesus. He called this the hardest—it collapsed when he excelled at Order/Silence." |  

  **Step 3: Discuss Tensions**  
  - **Franklin’s admission:** "He tracked virtues daily for decades but *never achieved perfection*. Humility always failed when he excelled at Order or Silence—your token trade-offs mirrored this."  
  - **Key insight:** "Temperance (V1) was his anchor—it enabled damage control (token removal). But even that couldn’t resolve structural flaws."  

  **Step 4: Limitations of the Game**  
  > "One thing we *couldn’t* simulate: **Franklin’s religious framing.** He saw humility as submission to God, not just self-help. Without that, humility becomes abstract—making it harder to grasp why it clashed with 'good' virtues like Order."  

  **Closing Q&A (5 min):**  
  - "How did the forced trade-offs change your approach? Why might Franklin’s system frustrate modern habit-tracking apps?"  

  ---

  ### **Design Notes**  
  - **Why it works:** The token system makes trade-offs visceral (e.g., V2 focus = automatic V5 failure). Temperance’s removal rule echoes Franklin’s "enabler" logic.  
  - **No perfection:** Grids always have failures, mirroring Franklin’s lifelong struggle.  
  - **Time-efficient:** Rounds use simple tokens, avoiding complex math.  
  - **Psychological hook:** Frustration precedes insight, deepening the debrief.  

  **Estimated Timing:**  
  - Setup: 5 min  
  - Rounds: 60 min (3 x 20 min)  
  - Sharing + Debrief: 25 min  
  - Total: 90 min
