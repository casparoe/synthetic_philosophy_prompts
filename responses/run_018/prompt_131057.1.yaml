answer: |-
  Here are the desiderata for an adequate philosophical account of epistemic dependence on generative AI, focusing specifically on the erosion of *understanding* (vs. mere knowledge acquisition), with motivating cases, necessity flags, and tension identification:

  ---

  ### **Core Desiderata & Motivating Cases**
  1. **Distinguish Tool-Use from Cognitive Integration**  
     *Motivation*: Using AI as a reference (e.g., checking a fact) vs. internalizing its outputs as cognitive defaults (e.g., accepting ChatGPT’s argument without scrutiny because "it’s usually right").  
     *Status*: **Non-negotiable** (grounded in cognitive science on automation bias).

  2. **Preserve Explanatory Depth**  
     *Motivation*: Retaining a true belief (e.g., "GDP declined 2%") vs. retaining the capacity to generate *counterfactual explanations* (e.g., "GDP would *not* have fallen if exports increased, because...").  
     *Status*: **Non-negotiable** (empirical: studies show automation erodes causal/explanatory access).

  3. **Differentiate Instrumental Delegation vs. Structural Outsourcing**  
     *Motivation*: *Instrumental*: Using AI for efficiency (e.g., summarizing a paper). *Structural*: Relying on AI to form beliefs in domains where the user lacks baseline competence (e.g., accepting medical diagnoses without understanding symptoms).  
     *Status*: **Non-negotiable** (epistemic responsibility hinges on this distinction).

  4. **Require Asymmetric Reconstructability**  
     *Motivation*: Understanding an output (e.g., "this code works") vs. being able to reconstruct the *inferential path* that produced it (e.g., "I see why this algorithm fixes the bug").  
     *Status*: **Camp-specific** (preservationists demand reconstructability; pragmatists accept "black box" outputs if reliable).

  5. **Assign Epistemic Responsibility Under Opacity**  
     *Motivation*: When an opaque AI mediates testimony (e.g., a doctor uses AI diagnostics), can the user be blameworthy for false beliefs? Criteria must define boundary conditions (e.g., meta-cognitive monitoring, error-checking).  
     *Status*: **Non-negotiable** (social epistemology requires accountability for testimony).

  6. **Safeguard Metacognitive Vigilance**  
     *Motivation*: Users who actively interrogate AI outputs (e.g., "What’s the evidence?") vs. those who passively internalize them.  
     *Status*: **Non-negotiable** (cognitive psychology shows vigilance mitigates automation complacency).

  ---

  ### **Tensions Between Desiderata**
  - **Understanding vs. Efficiency Trade-off (Desiderata 2, 4 vs. 3)**  
    Preserving robust individual understanding (requiring reconstructability/explanatory depth) conflicts with accepting efficiency gains from delegating complex inference to opaque systems. *Resolution may require sacrificing one value*.
    
  - **Responsibility vs. Opacity (Desiderata 5 vs. 4)**  
    Assigning epistemic responsibility requires user-level criteria (e.g., vigilance), but opaque systems inherently limit access to justifications. *Tension is irreducible without redefining "understanding"*.

  ---

  ### **Framework Evaluation Against Desiderata**
  1. **Extended Mind (EM) Approach**  
     - *Fails*: Desideratum 5 (responsibility). If AI is "part of the mind," individual responsibility dissolves. Ignores erosion of understanding (Desideratum 2) by assuming seamless integration.  
     - *Tension resolution*: None—exacerbates understanding/efficiency conflict by endorsing delegation.

  2. **Corruption-of-Testimony (CT) Model**  
     - *Fails*: Desideratum 3 (delegation vs. outsourcing). Treats *all* AI reliance as corrupting testimony, ignoring legitimate instrumental use. Overlooks Desideratum 6 (vigilance can mitigate corruption).  
     - *Tension resolution*: Preserves understanding (Desideratum 2) but rejects efficiency gains.

  3. **Hybrid Cognitive Division (HCD) View**  
     - *Fails*: Desideratum 4 (reconstructability). Assumes understanding emerges from system-level synergy, but users may lack individual explanatory access. Risks violating Desideratum 2.  
     - *Tension resolution*: Optimizes efficiency *and* understanding (Desiderata 3, 6) through calibrated trust, but struggles with opacity (Desideratum 5).

  ---

  ### **Summary of Non-Negotiables**  
  Any viable account **must**:  
  - Explain the tool-use/integration distinction (1),  
  - Preserve explanatory depth (2),  
  - Define epistemic responsibility under opacity (5),  
  - Incorporate metacognitive safeguards (6).  
  Camp-specific preferences (e.g., reconstructability) highlight fault lines but are not universally binding. The central tension—**understanding preservation vs. efficiency gains**—remains unresolved by existing frameworks.
