  new case: geologists are proposing to formalize the "Anthropocene" as an actual geological epoch, defined by human-caused stratigraphic signals like plastic deposits and nuclear fallout isotopes. do you think she'll call that kind socially constructed?

  i want the usual: lay out the 2-3 rules that best fit her track record, what each says about the Anthropocene, which rule you think she's actually using and why, and name one more case that'd really split them apart.

