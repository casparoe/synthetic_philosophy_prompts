  ### Dialogue: The Double Inversion and the Nature of Competence  
  **Setting:** A university seminar room after a lecture on directed evolution. Data projections show kinetic analyses of a synthetic ribozyme evolved to catalyze a ligation reaction. Dr. Lena Voss (philosopher of mind) and Dr. Marcus Aris (philosopher of biology) remain, discussing the implications.  

  ---

  **Dr. Aris:** (Gesturing toward the screen) Lena, this ribozyme case is precisely what I’ve argued exemplifies Darwinian problem-solving. The experimenters applied selective pressure without understanding RNA folding dynamics, and evolution “found” a solution no rational design could match. Neither the process nor the designers comprehended *how* it works—yet here it is, functionally optimal. This is a double inversion: Turing’s inversion in computation (output without semantic grasp) mirrored in evolution (adaptation without teleology). Doesn’t this collapse your distinction between evolutionary and cognitive competence? Both achieve goals without representation.  

  **Dr. Voss:** (Leaning forward, hands clasped) Marcus, I admire the symmetry, but you’re conflating competence with comprehension. Turing’s inversion works because a machine’s symbol manipulations are counterfactually robust: change the input, and its syntactic rules reliably map to new outputs, independent of history. This ribozyme emerged from a specific historical path—this lab’s selection pressures, these random mutations. If we altered the initial RNA pool or selection criteria, would evolution produce *any* functional catalyst? Probably not. Evolutionary “problem-solving” lacks the modal depth of computation. It’s competent only in the actual world, not across possible worlds.  

  **Dr. Aris:** But that’s uncharitable. Directed evolution *is* repeatable—rerun it with the same constraints, and you’ll likely converge on similar ribozymes. The kinetic data shows this catalyst works across varied conditions: pH, temperature, substrate concentrations. That’s robustness! Evolution isn’t just stumbling; it’s exploiting deep physical regularities in folding landscapes. No representation needed—just variation, selection, and heredity operating on lawful properties. Isn’t that competence?  

  **Dr. Voss:** Robustness of the *product*, not the *process*. Your ribozyme is robust once instantiated, but the evolutionary algorithm isn’t. A Turing machine’s counterfactuals are baked into its state transitions: given input X, it *would* output Y even if X never occurs. Evolution has no such internal structure. It’s a hill-climbing walk on a fitness landscape shaped by contingent events. Change one mutational step, and you’re in a valley of non-functional sequences. Computational competence is substrate-neutral and governed by formal rules; evolution is material-bound and path-dependent.  

  **Dr. Aris:** Ah, but you’re privileging syntax over dynamics. Look at the experiment: the selection protocol—mutation, replication, selection—*is* a rule-bound algorithm. It’s substrate-neutral in principle; we could run it digitally. When we simulate evolution in silico, it solves problems counterfactually. If the fitness function targets ligation efficiency, the algorithm *would* find solutions under different initial conditions. That’s modal robustness!  

  **Dr. Voss:** (Shaking her head) Simulations beg the question. In silico evolution works because we impose computational structure—a predefined fitness function, discrete generations, fixed mutation rates. Natural selection lacks that scaffolding. In this ribozyme experiment, the “fitness function” was the experimenter’s assay, but in the wild, fitness is emergent from ecology. The algorithm didn’t “know” it was solving a ligation problem; it just amplified what survived. Turing machines manipulate symbols *as symbols*—they track formal differences. Evolution tracks causal consequences, not symbols.  

  **Dr. Aris:** But symbols are causal! Your Turing machine is physical; its state transitions obey physics. Evolution “manipulates” phenotypic effects via environmental constraints, like a physical computation. The ribozyme’s folding dynamics are governed by thermodynamic laws—evolution “searches” that space without representing it. And it generalizes: this catalyst works for substrates it never encountered in selection. That’s not mere accident; it’s because the solution reflects abstract physical principles.  

  **Dr. Voss:** Generalization isn’t counterfactual robustness. A rock rolls downhill reliably, but we don’t call it a problem-solver. Evolution is like that: it follows causal gradients. But computation involves supporting inferences—e.g., “If the input were prime, the output would be ‘yes’.” Evolution doesn’t support such conditionals. Suppose we tweak the ribozyme’s active site: would it still function? Maybe, but not because evolution “predicted” mutations; it’s because chemistry is forgiving. Turing machines support counterfactuals by design; evolution by luck.  

  **Dr. Aris:** Luck? That misunderstands cumulative selection. Evolution encodes “lessons” in genotypes—this ribozyme’s sequence embodies information about folding constraints. When environments recur, adaptations reappear (think convergent evolution). That’s not luck; it’s a lawful response to constraints. Your Turing machine’s robustness comes from human interpretation of symbols. Strip that away, and it’s just voltage changes—no semantics. Similarly, evolution’s “competence” is in reliably navigating design spaces.  

  **Dr. Voss:** But interpretation isn’t arbitrary! Turing machines instantiate formal systems; their state transitions mirror logical dependencies. Symbol manipulation is mechanically validated: if the machine transitions from S1 to S2 given input I, it does so because S1 and I bear syntactic relations defined by the program. Evolution has no program—just differential survival. The ribozyme’s sequence wasn’t “selected as a solution”; it was retained because it ligated RNA. No syntax, no counterfactuals.  

  **Dr. Aris:** So syntax is the crux? Consider this: the selection protocol in directed evolution *is* a program. “Mutate sequence, test for function, replicate winners.” That’s a syntactic rule set! And it produces counterfactually robust outcomes: rerun it, and you get similar solutions. The double inversion reveals that both evolution and computation are physical processes generating functional outcomes without comprehension. The ribozyme’s designer didn’t understand it; evolution didn’t either. Yet here it is—competent.  

  **Dr. Voss:** (Pausing) I’ll concede the protocol is algorithmic. But in computation, the counterfactuals are *internal* to the system. A Turing machine transitions based on its current state and input alone. Evolution’s “transitions” depend on external fitness—on how the world *happens* to respond. That’s why the ribozyme, while impressive, doesn’t threaten my distinction. It highlights that Turing-style inversion presupposes a fixed computational architecture, while Darwinian inversion is architecture-free. Evolution solves problems *despite* lacking structure, not because of it.  

  **Dr. Aris:** Then let me reframe. The “structure” is in the physical laws evolution exploits. Folding landscapes have minima; evolution finds them. That’s a lawful, repeatable competence. Your Turing machine relies on physical laws too—it’s grounded in causality. The double inversion shows both processes are mechanistic and incomprehension-friendly. But where you see a categorical gap, I see a continuum: evolution is a slower, distributed form of computation in a physical substrate.  

  **Dr. Voss:** A provocative continuum, Marcus. Yet I maintain that computation’s counterfactual robustness is sui generis. But this ribozyme... it *does* make me wonder whether we’ve underestimated the modal structure of physical law. Perhaps evolution’s “competence” derives from the universe’s mathematical fabric—something Turing machines also tap into. I’ll need to rethink if counterfactual robustness must be syntactic. For now, though, I hold that Darwinian processes lack the internal coherence of computation.  

  **Dr. Aris:** And I hold that coherence is in the eye of the theorist. After all, we’re both marveling at a molecule that “solved” a problem neither we nor evolution understood. If that isn’t competence, what is?  

  ---  
  **Closing Note:** The dialogue ends in mutual respect, with Voss acknowledging the challenge to her stance but maintaining that computational competence requires syntactic structure, while Aris argues that evolutionary processes exhibit comparable problem-solving through physical law. The ribozyme’s “double inversion” sharpens the debate but leaves the core tension unresolved—inviting further reflection on whether competence necessitates comprehension or merely reliable dynamics.
