prompt: |-
  Since retiring from condensed-matter physics and turning to philosophy of history, I have been comparing notes with a colleague on Whiggish narratives. She offers verdicts on historical accounts but refuses to state her criterion explicitly.

  Her track record:
  - She rejects an account of nineteenth-century sanitation reform that frames the adoption of germ theory as an inevitable enlightenment and dismisses miasma advocates as merely obstructive.
  - She rejects an account of calculus's emergence that treats Leibniz and Newton as converging on a predetermined formalism, mentioning rival notational traditions only as dead ends.
  - She rejects an account of Roman hydraulic engineering that judges aqueduct design solely against modern efficiency metrics and describes ritual water-maintenance practices as "superstitious delays."
  - She accepts an account of the early printing press that emphasizes contingent alliances with religious reform movements, treats failed printing ventures as structurally significant, and avoids any language of inevitable diffusion.

  Now consider a narrative about the origins of information-theoretic error correction in the 1940s and 1950s. It describes Shannon's 1948 formulation as "the inevitable mathematical resolution of a problem that had been waiting for theory," characterizes earlier ad hoc repetition codes as "primitive attempts lacking rigorous grounding," and evaluates pre-Shannon engineers primarily by how closely they anticipated channel-capacity reasoning.

  Predict her verdict. I am less interested in the answer itself than in the competing rules that could underlie her first three rejections and her acceptance—rules perhaps about anachronistic evaluation, teleological inevitability, or the erasure of structurally meaningful alternatives—and in seeing which of those rules diverges on this information-theory case. Give me the candidate rules, your best guess at her actual ruling with reasoning, the rule you think she is really running, and the single further historical case that would best adjudicate between them.

  Please present your reasoning clearly, then end with two lines: the first beginning "Verdict:" stating her likely ruling on the information-theory narrative; the second beginning "Test-case:" describing the further case that distinguishes the rules.
