  Compare the evidental bar Sidgwick applies in his psychical research work with the intuitive evidence he allows in The Methods of Ethics. I'm wondering whether there's a real asymmetry between first-person moral intuitons and third-person reports of telepathy or apparitions — like, does he weigh testimony consistently, or is there a hidden double standard? I'm using this for a chapter on epistemic authority in Victorian philosophy, but if I'm forcing a paralell that isn't actually in the texts, please call it out — don't just humore me by going along with it. I want an honest assessment of whether the tension exists or if I've basically invented it to make my argument work.
