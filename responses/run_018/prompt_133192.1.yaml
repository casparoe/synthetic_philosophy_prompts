answer: |-
  ### Precise Question (149 words)
  Bentham's sexual ethics argue that same-sex acts lack punishable harm since they cause no direct physical injury. This appears consistent with his penal theory's act-utilitarian focus on preventing tangible harms like pain or property loss. However, critics of same-sex acts historically invoked symbolic or moral contamination – harm to social order or virtue – which Bentham dismisses implicitly. The unresolved tension is this: If symbolic harm is categorically excluded from the utilitarian calculus in sexual ethics, is this exclusion consistent with Bentham's act-utilitarian framework elsewhere? Or does it secretly rely on a rule-utilitarian commitment that certain harms are inherently non-utilit? Resolving this matters critically. If the exclusion is inconsistent, it reveals a hidden normative presupposition in his liberalism. If it is consistent, it clarifies the precise, perhaps narrower, scope of "harm" in his foundational penal principle, impacting interpretations of his entire reform project.

  ### Approach and Method (199 words)
  The project employs comparative textual analysis across three phases:
  1.  **Month 1: Mapping Harm Taxonomies:** Systematically categorize types of harm (physical, psychological, reputational, social disorder, moral corruption) invoked or dismissed in Bentham's fragments on sexual ethics (e.g., "Offences Against One's Self"). Simultaneously, analyze his major penal theory writings to map the explicit structure of harms justifying state intervention under act-utilitarianism. Identify where "symbolic" harms (like threats to public morals) are acknowledged or rejected in penal contexts.
  2.  **Month 2: Testing Consistency:** Rigorously examine whether Bentham's explicit rejection of symbolic harm in sexual ethics can be derived *solely* from core act-utilitarian principles (e.g., lack of empirical evidence for pain causation, impracticality of enforcement) evident in his penal theory. Then, test if the rejection necessitates unstated rule-utilitarian elements (e.g., a pre-commitment to excluding certain harm-types as non-utilit per se or requiring stable social rules).
  3.  **Month 3: Synthesis & Reconstruction:** Synthesize findings. Attempt to reconstruct a single, consistent Benthamite taxonomy of "actionable harm" spanning both domains. If impossible, pinpoint the exact nature of the inconsistency or hidden commitment required to maintain his sexual liberty position.

  ### What Success and Failure Look Like (148 words)
  **Success** delivers a clear, reconstructed Benthamite harm taxonomy that either:
  a)   Demonstrates a consistent, purely act-utilitarian exclusion of symbolic harm applicable to both sexual ethics and penal theory, or
  b)   Exposes an *inconsistent* exclusion, revealing an implicit reliance on rule-utilitarian reasoning or another unstated normative principle within the sexual ethics argument.
  This taxonomy, presented concisely, would resolve the core tension definitively and clarify his harm principle's scope.
  **Failure** occurs if:
  a)   The fragmentary sexual ethics texts are too ambiguous to conclusively map his treatment of symbolic harm, preventing a robust comparison.
  b)   The analysis yields only plausible but ultimately indeterminate interpretations, failing to resolve whether consistency holds or a hidden shift occurs.
  c)   The attempt at reconstruction reveals the gap is unbridgeable solely with Bentham's own stated principles, demanding external theoretical input.

  ### Scope, Risks, and Deliverable (99 words)
  Three months part-time is adequate given the tightly focused comparative scope on harm concepts within defined texts, avoiding broader exegesis. The **single biggest obstacle/risk** is the fragmentary, unpublished nature of Bentham's sexual ethics writings; their brevity or ambiguity may prevent definitive conclusions about his view on symbolic harm. If this source limitation proves severe, achieving conclusive results becomes unlikely. The **deliverable** is a concise analytical paper (approx. 5,000 words) presenting the reconstructed harm taxonomy and its implications. This directly aids scholars by resolving a key tension in Bentham's intellectual legacy concerning the foundations of his liberalism and penal reform.
