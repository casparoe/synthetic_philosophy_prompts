  Hmm, their core anxiety seems to be about preserving the seriousness of religious commitment while accepting Wittgenstein's grammatical framework. They mention "importing a false dichotomy" - good self-diagnosis. The chess vs checkers analogy clearly bothers them because it makes disagreement seem too shallow.

  Ah! The key might be in how Wittgenstein treats religious language-games as foundational rather than conventional. Like when he compares belief in God to trusting a scientific paradigm - it's not arbitrary because it structures reality for the believer. The user's "trust-structure" hint is crucial here. 

  Wait, they might be underestimating how grammatical rules can be existentially binding. Think of how "life-orienting" works: a Last Judgment believer doesn't just follow rules about it, they build their life around it like a physicist around quantum mechanics. That's why it demands everything - it's their framework for meaning.

