answer: |-
  Wittgenstein navigates this tension by rejecting both **empiricism** and **conventionalism** through his concept of **grammatical commitments** rooted in **forms of life**. Here's how:  

  1. **Non-empirical ≠ Non-cognitive**:  
     Religious beliefs (e.g., the Last Judgment) aren't hypotheses about observable events but *frame* what counts as significant evidence. For the believer, the Last Judgment isn't a future prediction but a present *certainty* structuring ethics, suffering, and hope. This certainty functions like the "hinge" propositions in *On Certainty*—immune to doubt within the language-game, not because they're arbitrary, but because they ground meaning.  

  2. **Real Disagreement Without Shared Truth-Conditions**:  
     The believer and atheist *do* contradict each other, but not over empirical facts. Their clash occurs at the **grammatical level**:  
     - The believer says, "The Last Judgment *will* happen" (a certainty guiding life).  
     - The atheist says, "The Last Judgment *will not* happen" (rejecting the entire framework).  
     This is like arguing whether a king in chess "truly" has authority: within chess, yes; outside, no. The disagreement is *real* but concerns the **validity of the framework itself**, not empirical verification.  

  3. **Existential Weight vs. Arbitrary Convention**:  
     - **Arbitrary conventions** (e.g., driving on the left) lack existential depth; they’re interchangeable rules.  
     - **Grammatical commitments** (e.g., divine judgment) are *constitutive* of a form of life. They define what counts as hope, guilt, or redemption. To abandon them isn’t switching preferences but undergoing a **spiritual catastrophe**—like a physicist losing faith in causality.  
     Wittgenstein’s example of a believer who "learns by proofs of God’s existence" but whose faith remains unmoved by disproof (*Lectures on Religious Belief*) shows this: the belief’s role isn’t evidentiary but *foundational*.  

  4. **"Trust-Structure" as the Key**:  
     Religious belief is less *assent to propositions* and more **unshakeable trust** (e.g., "I know God will hold me accountable"). This trust:  
     - Shapes perception (e.g., suffering as trial vs. randomness).  
     - Demands total life-orientation (e.g., martyrdom isn’t irrational if the framework is *real for you*).  
     - Isn’t chosen lightly; it’s inherited, lived, and defended as the bedrock of reality.  

  **The Coherent Middle Position**:  
  Religious beliefs *are* genuinely contradictory with atheism (denying the framework *is* the core conflict), but their "truth" lies in their **practical efficacy and non-negotiable certainty** within a form of life. They lack empirical truth-conditions because they *establish* the conditions for what counts as "true" in that life.  

  **Verdict**: The false presupposition is that *meaningful contradiction requires shared empirical criteria*.
