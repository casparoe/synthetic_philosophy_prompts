  First, the handicap principle: signals like a peacock's tail are credible because they're costly—only high-quality individuals can afford them. The analogy here is a scientist making bold, falsifiable predictions, risking reputation as their "costly display." 

  The user specified strict villanelle structure: 19 lines, five tercets + quatrain, two refrains, two rhymes. First refrain should critique the display as wasteful ("Why leap when silence costs less?"), second should assert hidden strength ("I leap because reserves run deep"). The repetition must mirror sustained costs, not one-time payments.

  Hmm, need to map the narrative arc: opening tercets build the "hidden quality" idea, middle introduces exposure risk, quatrain as volta where refrains collide to reveal the paradox—wastefulness enables trust. No jargon beyond "handicap principle," but must satisfy both biologists and philosophers of science. 

  *Brainstorming refrains*: Skeptic's line needs dismissive tone—maybe "What waste, this show!" but too vague. Better: "Why leap when silence costs less?" captures opportunity cost. Signaler's line: "I stake my claim on unseen depths" feels static. Revised to "I leap because reserves run deep" implying untapped resources. 

  *Structuring tension*: Tercet 1 establishes the scientist's prediction as a "gaudy math" display. Tercet 2 introduces falsifiability ("watchful lions" as critics). Middle tercets escalate risk—peer scrutiny, failed replications. Quatrain (lines 16-19) is critical: skeptic and signaler refrains finally dialogue, exposing the core paradox. Last couplet must fuse them: "The waste is why the bound is true." 

  *Checking accuracy*: "Precise, bold numbers" nods to quantified predictions. "Replications fail" references Popperian falsifiability. "Unseen depths" hints at robust methodology. Biologist should see stotting→prediction parallel; philosopher should catch that reputation risk substitutes for survival cost. 

  Final challenge: making repetition feel organic, not forced. Each recurrence of "Why leap..." should heighten skepticism, while "reserves run deep" grows more defiant. Quatrain's collision lands the thesis—extravagance as proof.
