prompt: |-
  You are a poet and an expert in evolutionary biology. Before composing, think carefully about the handicap principle: a signal is credible only if it imposes a cost that lower-quality senders cannot bear, with classic biological examples being the peacock's tail and the gazelle's stotting leap in full view of a predator. Now write a villanelle—nineteen lines arranged in five tercets followed by a quatrain, using only two rhymes and two refrains that alternate and finally converge in the closing couplet—about "epistemic stotting," a novel analogy in which a scientist who issues a bold, precisely quantified, and publicly falsifiable prediction performs an analogous costly display, risking professional reputation as the handicap that makes the signal trustworthy. The first refrain should capture the skeptic's charge of wasteful theatricality; the second refrain should capture the signaler's implicit claim of hidden strength or confidence. Use the form's compulsive repetition to mirror how honest handicaps must be sustained continuously rather than paid once. Build the naive picture of hidden quality in the opening tercets, introduce the risk of exposure in the middle, and let the quatrain—where the two refrains meet—serve as the volta that resolves not into triumph but into the paradox that the very wastefulness is the only reason anyone should believe the leap. The poem should be accurate enough that a biologist recognizes the mechanics of honest signaling and a philosopher of science recognizes the analogy to risky prediction, without citing texts or naming theories beyond the principle itself. Respond with the poem itself first, with no title, no preface, and no commentary before the text; then provide one brief paragraph identifying which line or stanza performs the structural turn and explaining how the villanelle's cyclical rhyme and refrain scheme tracks the logic of sustained costly display.
