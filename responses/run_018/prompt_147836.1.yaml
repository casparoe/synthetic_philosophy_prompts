  *The volta occurs decisively in the quatrain (lines 16-19), marked by the collision of both refrains. Here, the skeptic's charge ("Why leap...") and the signaler's claim ("I leap...") are placed in direct dialogue within the concluding couplet, resolving into the core paradox: the wastefulness ("The waste") is precisely what makes the prediction ("the bound") credible ("trusted best"). The villanelle's structure, with its inexorable cycling of the two refrains through each tercet, perfectly mirrors the sustained cost demanded by the handicap principle. Each recurrence represents another moment where the signaler must bear the ongoing burden (reputation risk, falsifiability) – a cost continuously paid, not a one-time fee – reinforcing that only genuine "reserves" (robust theory, evidence) could support such persistent, expensive display.*
