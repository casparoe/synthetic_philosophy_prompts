  First, I need to unpack Hacking's looping effects. The core idea is that classifying people changes their self-perception and behavior, which in turn alters the category. Human kinds are interactive, unlike natural kinds. The settled part here is that labeling affects behavior and categories evolve—this is well-established through historical examples like multiple personality disorder. Where it gets messy is the ontological status: are these kinds "real"? That's the big divide. The social construction side emphasizes that without looping, the category wouldn't exist as it does, while the correctionists believe underlying biological realities will stabilize the categories. 

