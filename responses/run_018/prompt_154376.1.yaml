  Second point: are emotions directed at the construct or displaced self-emotion? Walton says emotions are directed at the fictional construct as an intentional object. The distinction matters because if emotions are self-directed, the agent becomes a mirror, possibly limiting growth. For autonomy, users need to know if the agent is reflecting them or simulating another entity. Informed consent requires clarity here.

  Third point: metaphysical status affecting obligations. The agent as an abstract artifact or intentional object means updates or discontinuation can cause real distress. Designers have obligations to handle transitions ethically, like migration paths or sunsetting protocols. This is crucial but slightly downstream from immediate design choices.

  Ranking: Point one is top because intent and transparency in design directly influence whether the setup is manipulative. Point two is next because understanding emotion direction affects consent and therapeutic efficacy. Point three is important but deals with consequences after the bond exists, so it's third. 

