  Both are neglecting key aspects: the measurement problem itself (how classical information emerges from quantum systems), the distinction between logical irreversibility and thermodynamic irreversibility, and the crucial role of the thermodynamic limit in making computation irreversible. The demon's memory needs to be explicitly modeled as part of the physical system for a complete resolution.

