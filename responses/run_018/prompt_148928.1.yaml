prompt: |-
  I'm trying to walk a friend — she's an ML engineer who thinks philosophy is just bad code review — through Hempel's raven paradox. I want a teaching plan, not the actual explanation. What's the dependency order: do I need Nicod's criterion on the table before the symmetry argument lands, or does that just confuse things? For the carrying example I'm torn between the classic white shoe in the garden and something closer to her world, like finding a non-failing server log that accidentally confirms a generalization about system failure modes — which one actually carries the logical structure without smuggling in extra statistical assumptions? Then map the misconceptions in the order she'll raise them: she'll hit Bayes first, then probably claim it's just linguistic ambiguity about the word 'raven', then maybe argue that scientific context saves it. How do I absorb each without letting the session derail? What's a quick check at the end to see she's grasped the paradox structurally and not just memorized the shoe? And tell me explicitly what to leave out — I don't want to drift into Carnap's logical probabilities or Goodman's grue problem, just say so. Also I definitely typo'd dependancy somewhere above but you get the idea.
