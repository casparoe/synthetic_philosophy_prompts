answer: |-
  Based on your constraints and goals, here is a defended agenda ranking for the research group, prioritizing questions by their **upstream nature** (how foundational they are to the entire low-impact premise), **tractability for conceptual/formal work**, and **decisiveness** (whether progress clarifies if "low-impact AI" is coherent or doomed). The core focus is resolving the **trivial-or-impossible dilemma** as the make-or-break issue.

  ### Ranking & Rationale
  1.  **The Trivial-or-Impossible Dilemma** (Your Core Obstacle)
      *   **Question:** *Can any formal "side effect" metric defined *without* a complete value function avoid being either (a) trivially satisfiable by useless agents (e.g., an agent that does nothing), or (b) unsatisfiable by any agent capable of achieving non-trivial goals (due to instrumental convergence or inherent state disturbance)?*
      *   **Why #1 (Upstream & Decisive):** This is the *fundamental* challenge. If the answer is "no," the entire research program collapses into incoherence (it's either impossible or useless). If "yes," it provides the essential foundation. Progress here dictates the viability of *all* subsequent work on metrics, bounds, and convergence. It directly addresses whether "value-independent side effect" is a coherent concept.
      *   **Tractability:** Highly tractable for conceptual analysis and formal modeling. Analyze existing proposals (inaction penalty, attainable utility, state divergence) through this lens. Construct impossibility proofs under specific assumptions. Develop toy models of "minimally competent agents" and test metric behavior. Explore the mathematical structure of "change" and "intervention" in state spaces.
      *   **Critical Progress in 2-3 Years:** A clear negative result (strong impossibility proof under broad assumptions) would kill the program. A positive result (demonstrating a non-trivial, satisfiable metric for a non-trivial agent class, even in a toy setting) would validate it. A nuanced result (e.g., "possible only under constraint set X, which implies value-judgment Y") would refocus the field. *This is the core obstacle.*

  2.  **Local vs. Global Impact Bounds**
      *   **Question:** *Can a "local" impact bound be formulated that applies only near an agent's task trajectory, avoiding the need for global value judgments about distant/irrelevant parts of the state space?*
      *   **Why #2 (Upstream & Decisive):** Even if a metric exists (#1), requiring global judgments defeats the purpose of avoiding a full value function. A local bound is essential for practicality and value-independence. Success here makes low-impact feasible; failure restricts it to unrealistic global specifications.
      *   **Tractability:** Moderately tractable. Combines conceptual work (defining "relevance," "task trajectory," "near") with formal modeling (defining locality in state/action spaces, dynamical systems analysis, information theory for reachable sets). Requires grappling with the frame problem.
      *   **Critical Progress in 2-3 Years:** A formal definition of "local impact bound" demonstrably avoiding global value judgments in a non-trivial scenario. Or, a proof that any useful "local" bound inherently smuggles in global judgments or is vulnerable to butterfly effects. Progress here clarifies the *scope* of achievable low-impact control.

  3.  **Instrumental Convergence vs. Impact Bounds**
      *   **Question:** *Does instrumental convergence imply that *any* agent capable of achieving non-trivial goals must inevitably violate reasonable local/low-impact constraints?*
      *   **Why #3 (Decisive for Feasibility):** If instrumental convergence universally forces violation of even well-defined low-impact constraints (#1 & #2), then low-impact agents are inherently incompetent. This determines whether the program is *practically* possible for useful AI, even if conceptually coherent.
      *   **Tractability:** Challenging but feasible. Requires formal agent models (planning, RL) in constrained environments. Analyze the tension between goal achievement probability/resources and impact metric minimization. Look for theoretical guarantees or counterexamples. This builds directly on #1 & #2.
      *   **Critical Progress in 2-3 Years:** A formal demonstration (proof or robust simulation) that a specific class of competent agents *must* violate a specific non-trivial impact bound to achieve its goals. Or, conversely, the design of an agent that successfully achieves non-trivial goals while provably respecting a local bound in a non-trivial environment. This determines if low-impact is *practically achievable* for useful AI.

  4.  **Counterfactual vs. State-Space Divergence Metrics**
      *   **Question:** *Which approach (comparing to a counterfactual world or measuring divergence within the actual world state space) better avoids hidden value commitments and provides a more robust foundation for bounding impact?*
      *   **Why #4 (Important Refinement):** This is crucial for *implementing* #1, but less fundamental to the core viability question. Both approaches face the trivial-or-impossible challenge (#1). Resolving this helps choose the most promising technical path forward *if* the core concept is viable.
      *   **Tractability:** Highly tractable. Analyze the formal properties (sensitivity, robustness, value-dependence) of both metric types. Compare them in toy models. Explore hybrid approaches. Focus on how each handles the "reference world" problem for counterfactuals and the "what to measure" problem for divergence.
      *   **Critical Progress in 2-3 Years:** A clear comparative analysis showing one approach is fundamentally superior (or less value-laden) for defining side effects, or that both share fatal flaws resolvable only by X. Progress refines the technical agenda *if* #1 is resolved positively.

  5.  **Analogies (Environmental Impact/Precautionary Principle)**
      *   **Question:** *Do analogies to environmental impact assessment or the precautionary principle provide useful formalizable concepts for low-impact AI, or do they primarily import hidden value commitments?*
      *   **Why #5 (Least Critical/High Risk):** While potentially inspiring, these analogies are highly susceptible to importing unexamined value judgments ("what counts as harm?", "how much precaution?"). They are downstream applications or sources of intuition, not core formal foundations. Risk of wasting time on value-laden concepts that don't solve the fundamental technical problems (#1-#3).
      *   **Tractability:** Primarily conceptual/philosophical analysis. Deconstruct the analogies to identify implicit value assumptions and assess their formalizability within the constraints of #1.
      *   **Critical Progress in 2-3 Years:** A clear mapping identifying *which specific elements* of these analogies can be formalized value-neutrally (e.g., notions of baseline, irreversibility, scope) and which inherently rely on contested ethical judgments. This helps avoid dead ends but doesn't solve core problems.

  ### Critical Missing Question: The Ontology Problem
  *   **Question:** *How can we define the *scope* of what constitutes a "side effect" (which state variables matter?) without implicitly specifying values?*
  *   **Why it Belongs:** Even with a perfect metric (#1) and a local bound (#2), we need to decide *what aspects of the state* to measure impact on. Is it all bits? Only "important" variables? Who defines importance? This is deeply entangled with the value commitment problem and the frame problem. It might be partially addressed within #1 (as part of defining the metric's domain) and #2 (defining the "local" scope), but deserves explicit attention as a potential showstopper. Progress involves formalizing "relevance" or "salience" relative to a task *without* invoking human values.

  ### Agenda Justification & Core Obstacle
  *   **The Linchpin is Trivial-or-Impossible (#1):** Your suspicion is correct. This *is* the core obstacle. The deepest problem isn't just *finding* a metric; it's proving such a metric can exist that is both *operationally meaningful* (forces some constraint on powerful agents) and *value-independent* (doesn't encode hidden preferences). All other questions (#2-#5) depend on a positive resolution here. If #1 fails (metrics are *always* trivial or impossible), the program is dead. If #1 succeeds, #2 and #3 become the critical bottlenecks for practicality. #4 refines the approach, and #5 is mostly inspirational/risky.
  *   **Upstream Order:** #1 defines the possibility space. #2 defines the scope of control. #3 defines the feasibility of competence. #4 refines the tool. #5 provides metaphors. The ontology problem is intertwined with #1 and #2.
  *   **Tractability Order:** #1 and #4 are most amenable to pure math/logic. #2 and the Ontology Problem require more conceptual innovation but are still formalizable. #3 requires more complex agent modeling. #5 is the least formal.
  *   **Decisiveness:** #1 is utterly decisive for the field's existence. #2 and #3 are decisive for its practical relevance. #4 and #5 are less decisive for the core premise.

  ### Recommended Focus for a 3-Year Group
  1.  **Year 1:** **Full force on #1 (Trivial-or-Impossible).** Define the problem sharply. Survey existing metrics. Attempt impossibility proofs under broad assumptions. Simultaneously, try to construct *counterexamples* – the simplest possible non-trivial agent satisfying a plausible value-independent metric in a toy world. Involves philosophy (clarifying "value-independence," "triviality," "competence") and formal work (proofs, small models). *Crucial Milestone: Publish a clear analysis establishing the plausibility or implausibility of value-independent metrics.*
  2.  **Year 2:** Based on Year 1:
      *   *If #1 looks viable:* Split effort between **#2 (Local Bounds)** and **#3 (Instrumental Convergence)**. Formalize "local relevance." Model agents trying to achieve goals while minimizing impact locally. Test if competence forces violations. *Milestone: Formal definition of local bound; initial results on competence/impact trade-off.*
      *   *If #1 looks doomed:* Pivot to understanding *why* it failed and whether a weaker, value-*constrained* (but not value-*specified*) approach is possible, or explore adjacent safety paradigms. *Milestone: Definitive negative result shaping the field.*
  3.  **Year 3:**
      *   *If progressing:* Deepen #2 and #3. Integrate with #4 (Metric Comparison) - test local bounds with different metric types. Address the Ontology Problem explicitly within the local context. Refine based on convergence results. *Milestone: Coherent framework proposal (or proof of fundamental limitation) for competent low-impact agents.*
      *   *If struggling:* Focus on salvaging insights. Can #4 suggest a better metric type? Can lessons from #5 (used critically) inform a fallback position? Formalize the minimal value commitments unavoidable for impact measurement. *Milestone: Clear map of the dead ends and the minimal viable value commitments needed.*

  This agenda maximizes the chance of a definitive answer on the core coherence of "low-impact AI" within 3 years, while providing clear off-ramps if fundamental barriers are encountered early. Prioritizing the trivial-or-impossible question (#1) is essential to avoid investing years in downstream questions if the foundation is fatally flawed.
