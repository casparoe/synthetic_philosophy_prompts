prompt: |-
  I'm a retired spectroscopist — spent most of my life on noise reduction and calibration curves — and I've only been reading political philosophy for a couple years, so go easy on me if I mangle the jargon. My neighbor teaches international relations and we argue about military intervention constantly. He's frustratingly consistant, but I can't work out the rule he's actually applying, and I'd like to predict him on a new case before I bring it up.

  His track record, as I can reconstruct it:

  Kosovo in 1999: he says justified. No Security Council authorization, since Russia would have vetoed, but it was NATO-led, the ethnic cleansing was already underway, and there was no plausible economic motive — just stopping a massacre and a refugee flood.

  Iraq in 2003: not justified. The WMD case collapsed, there was no ongoing mass atrocity at the time, the coalition was small, and the post-invasion planning was so bad you couldn't honestly call the war humanitarian even in hindsight.

  Libya in 2011: this is where he gets interesting. He thinks the early civilian-protection part was justified — Benghazi was about to be attacked, and there was Security Council support and Arab League backing. But he says the operation then slid into regime change and the country was left worse off. So his verdict on the intervention as actually run is that it was not justified, even though the narrow no-fly zone at the start would have been on its own.

  Now the new case I want to spring on him. Next year, in a coastal West African country, a ruler has already carried out attacks on one ethnic group and there is solid intelligence he's about to assault the main city his opponents control — call it eight hundred thousand people. The African Union requests outside air support for a no-fly zone and safe areas, and says the deal is off if it turns into regime change. The Security Council is deadlocked because one permanent member will veto anything. A coalition offers to run the no-fly zone and promises not to target the ruler. But a few coalition members hold mineral concessions in the country, which makes the promise shaky. Analysts put the odds of protecting the civilians at 70 percent, the odds of getting dragged into a wider war at 40 percent, and post-war stability at about 50/50.

  If he's applying the same thing he applied to those three cases, what does he say about this one? Give me your best prediction, the candidate rules that each fit his record, and say which earlier case is actually doing the most work in your answer. Then give me one further case — real or invented — that would cleanly seperate those rules, because I'd rather know what's doing the work before I start the argument.
reasoning: |-
  Okay, I need to help this retired spectroscopist predict his neighbor's stance on a new military intervention scenario. The neighbor has consistent positions on Kosovo (1999), Iraq (2003), and Libya (2011), so I'll analyze those to infer the underlying rules. Then I'll apply them to the new West African case and suggest a test case to distinguish between possible rules.

  First, let's recap the neighbor's positions:
  - **Kosovo 1999**: Justified. No UNSC authorization (Russian veto), NATO-led, ethnic cleansing ongoing, no economic motive.
  - **Iraq 2003**: Not justified. WMD case false, no ongoing atrocity, small coalition, poor planning, not humanitarian.
  - **Libya 2011**: Mixed. Initial no-fly zone justified (imminent attack on Benghazi, UNSC support, Arab League backing), but overall not justified because it slid into regime change and worsened the country.

  From this, I can identify several factors the neighbor seems to weigh:
  1. **Humanitarian justification**: Is there an ongoing or imminent mass atrocity? (Yes in Kosovo and Libya; no in Iraq.)
  2. **International legitimacy**: UNSC authorization preferred, but absence not a deal-breaker if blocked unfairly (Kosovo had a Russian veto; Libya initially had it; Iraq lacked broad support).
  3. **Coalition nature**: Broad support helps (NATO in Kosovo, Arab League in Libya), while narrow coalitions are suspect (Iraq).
  4. **Purity of motive**: No hidden economic agendas (Kosovo seen as pure; Iraq had oil suspicions; Libya's shift to regime change tainted it).
  5. **Feasibility and consequences**: Success likelihood and post-intervention stability matter (Kosovo worked; Iraq failed; Libya failed post-regime change).

  Now, for the new case:
  - **Humanitarian**: Clear imminent attack on 800k people, like Benghazi.
  - **Legitimacy**: UNSC deadlocked (veto), but African Union request mirrors Arab League support in Libya.
  - **Coalition**: Broad AU backing, but some members have mineral concessions, risking motive purity.
  - **Feasibility**: 70% protection chance (good), 40% wider war risk (moderate), 50/50 stability (uncertain).

  Comparing to past cases:
  - Kosovo analogy: Strong on humanitarian need and legitimacy via regional request, but economic taint is new.
  - Libya analogy: Very close—initial phase justified, but concessions could imply hidden motives like Libya's regime change drift.
  - Iraq contrast: No atrocity ongoing there, here there is one.

  Synthesizing, the neighbor would likely focus on:
  - Core humanitarian justification is strong (imminent massacre).
  - Legitimacy from AU request offsets UNSC deadlock.
  - But mineral concessions create motive doubt, echoing Libya's downfall.
  - Feasibility is middling—better than Iraq's planning but riskier than Kosovo.

  Thus, my prediction: **He says NOT justified**, primarily due to the economic taint (mineral concessions) making the "no regime change" promise unreliable, similar to Libya's slippery slope. The Libya case is doing the heaviest lifting here.

  To distinguish between possible rules, I propose a test case: A fictional intervention in "Country X" with **no economic interests, imminent genocide, UNSC deadlock, but regional organization request and high success odds (90% protection, low escalation risk, 80% stability)**. If he approves, purity of motive is key; if not, he prioritizes UNSC approval above all.
answer: |-
  Based on your neighbor's positions on Kosovo (1999), Iraq (2003), and Libya (2011), I'll break this down step by step: (1) my prediction for the new West African case, (2) the candidate rules explaining his consistency, (3) which historical case is most influential, and (4) a designed test case to separate the rules. My analysis focuses on the *pattern* in his reasoning—not the real-world ethics—using your reconstruction.

  ### 1. Prediction for the West African Case
  **He will say the intervention is NOT justified.**  
  Here's why, mapped to his past logic:
  - **Humanitarian justification is strong** (like Kosovo/Libya): An imminent attack on 800k people meets his threshold for "stopping a massacre," similar to Kosovo's ethnic cleansing or Benghazi. This is a point in favor.
  - **International legitimacy is mixed but tolerable** (like Kosovo): The UNSC deadlock (due to a veto) mirrors Kosovo, where he accepted NATO action despite Russia's veto. The African Union (AU) request adds regional backing, analogous to the Arab League in Libya—this offsets the lack of UNSC approval.
  - **BUT economic motives taint the coalition's promise** (like Libya's slide): The mineral concessions held by some coalition members undermine the "no regime change" pledge, making it "shaky." This echoes Libya, where the initial humanitarian mandate was corrupted by regime-change drift. He'd argue the 40% risk of wider war and 50/50 stability odds amplify this, resembling Libya's "left worse off" outcome.
  - **Feasibility concerns tip it into unjustified** (like Iraq): While the 70% protection odds are better than Iraq's sham WMD claims, the economic taint + non-trivial escalation risk (40%) + uncertain stability (50/50) create "Iraq-like" recklessness. He'd see the concessions as a hidden motive, preventing the intervention from being "honestly humanitarian."

  **Bottom line:** The economic interests fatally compromise the operation, making it resemble Libya's failure and Iraq's bad faith—despite Kosovo-like humanitarian urgency. He'd reject it as "not justified as proposed."

  ### 2. Candidate Rules Fitting His Record
  Your neighbor isn't applying one rigid rule but a weighted set of criteria. Here are the most plausible candidate "rules" (principles) consistent with all three cases. Each fits, but they prioritize differently:

  - **Rule A: Humanitarian Purity Test**  
    Intervention is justified **only if**:  
    (a) There is clear, imminent mass atrocity (Kosovo/Libya yes; Iraq no);  
    (b) No dominant non-humanitarian motive exists (Kosovo yes; Iraq/Libya no—WMD/oil in Iraq, regime change in Libya);  
    (c) The mission *strictly* avoids scope creep (Libya initial yes, later no; Kosovo largely yes; Iraq no).  
    *Fits all cases:* Kosovo (pure stopping of massacre), Iraq (WMD/oil motives), Libya (regime change corrupted it).

  - **Rule B: Consequences-Legitimacy Calculus**  
    Intervention is justified **only if**:  
    (a) It has high-probability success in protecting civilians *and* stability (Kosovo yes; Iraq/Libya no—both had chaos);  
    (b) It has "second-best" legitimacy when UNSC is blocked (e.g., regional backing like NATO/Arab League/AU);  
    (c) Coalition is broad/credible (not "small" like Iraq).  
    *Fits all cases:* Kosovo (NATO-backed, worked), Iraq (no legitimacy, failed), Libya (initial legitimacy but poor outcome).

  - **Rule C: Motive-Coalition Threshold**  
    Intervention is justified **only if**:  
    (a) No coalition member has significant material interests (Kosovo yes; Iraq/Libya no—oil/regime change);  
    (b) The interveners have "skin in the game" via regional stakes (Kosovo: NATO neighbors; Libya: Arab League; AU here).  
    *Fits all cases:* Kosovo (no economic actors), Iraq (oil-driven coalition), Libya (regime change served Western interests).

  ### 3. Which Historical Case is Doing the Most Work?  
  **Libya (2011) is the strongest influencer** for this prediction. Here's why:  
  - Kosovo sets his baseline for "good" interventions (no veto override, pure motive), and Iraq is his "bad" archetype (hidden motives, failure). But Libya is his nuanced middle ground—where initial justification was eroded by *how the intervention was executed*.  
  - In your new case, the Libya parallels are glaring:  
    - Both have strong humanitarian starts (Benghazi vs. the West African city).  
    - Both have regional backing (Arab League vs. AU) offsetting UNSC deadlock.  
    - Both include promises to avoid regime change—but Libya's was broken, and your case's mineral concessions make a breach likely.  
    - He'd argue the 40% escalation risk and 50/50 stability odds mirror Libya's "slide" into chaos.  
  - Essentially, Libya shows that even when other boxes are checked (atrocity prevention, legitimacy), *tainted motives/execution* can sink it. That's the lens he'd apply here.

  ### 4. Test Case to Separate the Rules  
  To distinguish between Rule A (Humanitarian Purity), Rule B (Consequences-Legitimacy), and Rule C (Motive-Coalition), propose this cleanly designed scenario:  

  > **"Country X" Test Case:**  
  > - A dictator is imminently preparing to gas 500k civilians in a city. Satellite intel is irrefutable.  
  > - UNSC is deadlocked (one permanent member vetoes).  
  > - The *regional organization* (e.g., ASEAN) *requests* intervention and will lead it, with no non-regional powers involved.  
  > - No interveners have economic interests in Country X.  
  > - Probability of civilian protection: 90% (high).  
  > - Probability of escalation/wider war: 10% (low).  
  > - Probability of post-war stability: 80% (high).  

  **How this separates the rules:**  
  - If he says **justified**, Rule B (Consequences-Legitimacy) dominates. High success odds and regional legitimacy trump the lack of UNSC approval.  
  - If he says **not justified**, Rule A (Humanitarian Purity) or Rule C (Motive-Coalition) dominates. For Rule A, he might argue "no ongoing atrocity yet" (only "preparing") or stress that regional actors could have ulterior motives (even without economic interests). For Rule C, he might reject it because non-regional powers aren't involved (no "balanced" coalition).  
  - **Clincher:** If he emphasizes the *regional leadership* as decisive, Rule C wins. If he focuses on the *low risks/high protection*, Rule B wins. If he fixates on the atrocity not being "ongoing" or questions ASEAN's motives, Rule A wins.  

  **Why this works:** It isolates variables from your cases—e.g., no economic taint (unlike your West Africa case), high feasibility (unlike Iraq), and regional legitimacy (like Libya/Kosovo). Libya's "slide" risk is removed by the 10% escalation odds.

  ### Summary
  - **Predict his answer for West Africa:** Not justified (Libya's "tainted motive" worry dominates).  
  - **Key rules:** Humanitarian Purity (A), Consequences-Legitimacy (B), or Motive-Coalition (C)—all fit, but Libya tips it toward A/C.  
  - **Test case:** "Country X" to force him to prioritize success odds vs. motive purity vs. coalition composition.  

  This should help you anticipate his stance. If you use the test case, probe *why* he answers as he does—e.g., "Is the AU request enough to offset the veto like in Kosovo, or do the mineral concessions make it another Libya?" It might reveal whether he's more utilitarian (Rule B) or deontological (Rule A/C). Good luck!
