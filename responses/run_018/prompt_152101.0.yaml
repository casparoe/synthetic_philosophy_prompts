answer: |-
  **MEMORANDUM**  
  **TO:** All Partners & Associates  
  **FROM:** Dr Alistair Vance, Senior Partner, Ergodic Partners LLP  
  **DATE:** 24th October 2023  
  **SUBJECT:** Mandatory Implementation of Geometric Protocols for Professional and Personal Conduct  

  ---

  ### **1. Introduction**  
  Ergodic Partners LLP ("the Firm") has long recognised that ergodicity—the equivalence between ensemble expectation and time-averaged growth—is the foundational principle of rational agency. To align our conduct with this non-negotiable mathematical truth, we hereby formalise our **Geometric Protocols**. These protocols apply Kelly-optimal reasoning (fractional or full) to all decisions, ensuring the maximisation of our collective and individual growth-wealth trajectories. Compliance is not discretionary.  

  ### **2. Hiring: Fractional Kelly Allocation Across Talent Portfolios**  
  Human capital deployment must mirror optimal portfolio construction. Each candidate represents an independent investment with an estimated edge (*p* - *q*) and payoff ratio (*b*). The maximum acceptable allocation to any single hire is determined by the fractional Kelly criterion:  
  > **ƒ* = (bp - q) / b**  
  where *b* is the expected productivity multiplier, *p* the probability of outperformance, and *q* (1-*p*) the probability of attrition/cost.  

  **Protocols:**  
  - No hire may exceed 10% of departmental headcount (ƒ* ≤ 0.1) without Executive Committee approval.  
  - Diversification ratios must be maintained: 70% "core" (ƒ* ≤ 0.05), 25% "satellite" (0.05 < ƒ* ≤ 0.1), 5% "exploratory" (ƒ* > 0.1).  
  - HR will supply Kelly calculators for edge estimation. *Probabilities must be quantified*. "Cultural fit" is admissible only as a Bayesian prior.  

  ### **3. Workplace Attachments: Expected Log-Utility of Emotional Investment**  
  Interpersonal dynamics introduce non-ergodic risks. Emotional investments (e.g., mentorship, collaboration, camaraderie) must be sized to avoid ruinous drawdowns in morale or productivity. The utility of any attachment is *logarithmic* in the long run; thus, allocations must optimise for time-averaged growth, not transient ensemble gains.  

  **Protocols:**  
  - Calculate the *emotional Kelly fraction*:  
  > **ƒ_emo** = [ (ψ × ρ) - (1 - ρ) ] / ψ  
    where *ψ* is the potential affective payoff multiplier, and *ρ* the estimated probability of positive returns.  
  - Investments exceeding ƒ_emo > 0.03 require quarterly rebalancing.  
  - Negative-expectation attachments (*ρ* < 0.5) are strictly forbidden. Discount future affective streams appropriately.  

  ### **4. Meeting Strategy: Risk-Parity in Conversational Stakes**  
  Meetings are high-velocity betting markets. Participants often overexpose themselves to low-probability, high-conviction assertions, violating the ergodic axiom. To ensure sustainable intellectual growth, we enforce **conversational risk-parity**:  

  **Protocols:**  
  - All speakers must pre-commit a "conviction stake" (δ) as a percentage of their speaking time, where:  
  > **δ** ≤ ƒ*_conviction** = (accuracy_est × impact_multiplier) / volatility_est  
  - The Chair must enforce aggregate δ ≤ 1.0 per agenda item (i.e., no over-leveraging collective attention).  
  - "Hyperbolic discounting" of minority views is a geometric crime. Use stochastic time-reserving.  

  ### **5. Annual Corporate Retreat: Geometric Growth Targets for Collective Morale**  
  The retreat is our annual rebalancing toward ergodic efficiency. Morale (Μ) must compound geometrically:  

  > **Μ_final** = Μ_initial × (1 + g)^n  
  > where *g* is the target morale growth rate (*g* ≥ 0.12 CAGR), and *n* the retreat duration in days.  

  **Protocols:**  
  - Activities must be structured as "morale lotteries" with *Kelly-optimised expected log-utility*.  
  - "Team-building" exercises with *p* < 0.6 or *b* < 1.2 are prohibited.  
  - Morale drawdowns >15% trigger immediate cessation. Track real-time via biometric sentiment indices.  

  ### **6. Enforcement & Non-Compliance**  
  The Geometric Protocols are mathematised ethics. Violations induce ergodicity-breaking, sacrificing long-term growth for stochastic, unreplicable gains. Compliance will be audited quarterly by the Office of Geometric Accountability (OGA). Sanctions include:  
  - Mandatory Kelly recertification.  
  - Utility-discounted bonus adjustments.  
  - For repeat offenders: irreversible allocation to low-edge tasks (ƒ* ≤ 0.01).  

  **Ergodic virtue is the only virtue.**  

  Signed,  
  *Dr Alistair Vance*  
  *Senior Partner, Ergodic Partners LLP*  
  *"Maximising the Time-Average"*  

  ---

  ### Reflective Note: Satirical Liberties and Contested Interpretations  
  This satire amplifies two genuine tensions in "geometric rationality" discourse:  
  1. **Misplaced Ergodicity**: The memo treats the *ergodicity critique* (which distinguishes ensemble averages from time-averages in stochastic systems) as a prescriptive ethical framework. In reality, ergodicity is a property of systems, not a normative guide. Applying it to interpersonal ethics confuses *is* with *ought*.  
  2. **Utility Misappropriation**: Kelly optimisation presumes a logarithmic utility function to maximise long-term wealth growth. The satire extends this to domains (emotions, morale) where "growth" is ill-defined and logarithmic utility is inapplicable—implying all value is fungible and scalable.  

  **Unfair Extensions?**  
  The satire would be unfair if it implied that Kelly enthusiasts *literally* reduce hiring to fractional betting. It exaggerates a *rhetorical* slippage: the tendency to frame life decisions via growth-maximisation metaphors without clarifying constraints (e.g., when "bankruptcy" = ruin vs. inconvenience). A clarifying defence might note: Kelly is valid *only* when (a) outcomes are monetarily fungible, (b) trials are iterable, and (c) utility is *solely* growth-driven. The satire ignores these limits to probe the ideology lurking beneath technical criteria.  

  **Ambiguity Addressed**:  
  The core ambiguity—between "growth maximisation as tool" vs. "as moral imperative"—is preserved by deadpan adherence to the latter. Vance’s memo treats ergodicity as inherently virtuous, satirising how technical tools become totalising ideologies when stripped of domain-specific caveats.
