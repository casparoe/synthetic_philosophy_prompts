answer: |-
  **MEMORANDUM**  
  **TO:** County Museum Board Members  
  **FROM:** [Your Name/Board Position]  
  **DATE:** October 26, 2023  
  **SUBJECT:** Action Recommendation: East Wing Pioneer-Science Diorama (Vance Expedition)  
  **VOTE DATE:** Thursday, November 2, 2023  

  ---

  ### **Background**  
  The diorama depicts Dr. Elias Vance (1920s) working with Indigenous guides. The 1985 signage attempted to frame Vance as progressive for his era but retains outdated racial terminology and visually subordinates the guides. The board is divided:  
  - **Group A:** Remove the diorama, arguing both Vance’s actions *and* the 1985 reinterpretation fail modern ethical standards.  
  - **Group B:** Preserve it, arguing removal erases historical context of how bias evolved (1920s → 1985 → 2023).  

  ### **The Presentism Problem Explained Simply**  
  **Presentism** means judging past actions *solely* by today’s values, ignoring historical context. Here, we face a **"double layer"**:  
  1. **Layer 1:** Judging Vance (1920s) by 2023 standards risks misrepresenting his actions within his era’s norms.  
  2. **Layer 2:** Judging the 1985 curators by 2023 standards dismisses their attempt to correct 1920s bias with the tools/knowledge *they* had.  

  Removing the diorama erases this evolution of thought. Keeping it unaltered perpetuates harm. **Neither extreme resolves the core issue: the exhibit fails to educate visitors about this complexity.**  

  ---

  ### **Recommendation: RETAIN & RECONTEXTUALIZE**  
  **(With Specific, Immediate Changes)**  

  #### **Proposed Actions**  
  1. **REVISE LABELS & LAYOUT:**  
     - Replace all racial terms with specific tribal nation names (if known) or "Indigenous experts."  
     - Reposition figures/signage to show guides as equals (e.g., highlight their botanical/ecological knowledge).  
     - Add a panel titled: "**Re-Examining Our Past: From 1920 to 1985 to Today**."  

  2. **ADD CONTEMPORARY CONTEXT:**  
     - Install a companion plaque stating:  
       > *"This 1985 display attempted to portray Dr. Vance as an ally by the standards of its time. Today, we recognize it still marginalized Indigenous contributions and used harmful language. We preserve this diorama to show how historical narratives evolve—and to challenge us to keep improving."*  

  3. **INCORPORATE INDIGENOUS PERSPECTIVES:**  
     - Consult local tribal representatives to co-write new text (if time allows pre-installation; else, commit to this in Phase 2).  

  #### **Why This Approach?**  
  - **Avoids erasure** of historical progress (1920s → 1985 → 2023).  
  - **Transparently addresses harm** without pretending the past was "good enough."  
  - **Makes the exhibit itself a teaching tool** about bias, curation, and changing societal values.  
  - **Cost-effective & actionable** within 60 days.  

  ---

  ### **Why NOT Remove It?**  
  **Strongest Case for Removal:** It honors Vance while minimizing Indigenous agency, causing ongoing pain to visitors. Removing it offers immediate emotional relief and signals the museum’s commitment to justice.  
  *Why We Reject This:* Removal eliminates a teachable moment about *how* bias persists across generations. It risks replacing one form of presentism (1985’s "enlightened ally" framing) with another (2023’s dismissal of past efforts to improve).  

  ---

  ### **Why NOT Keep It As-Is?**  
  **Strongest Case for Preservation:** The diorama is an artifact of both 1920s history *and* 1985 curatorial intent. Altering it "whitewashes" the museum’s own past mistakes.  
  *Why We Reject This:* Unchanged, it centers Vance, replicates harmful hierarchies, and fails our duty to educate. Passive preservation is indifference.  

  ---

  ### **Implementation Timeline**  
  - **Phase 1 (30 days):** Draft new labels/layout; consult tribal historians (if feasible).  
  - **Phase 2 (60 days):** Install revised diorama + context plaque.  
  - **Phase 3 (90 days):** Public program on "Reinterpreting Problematic History."  

  ---

  ### **VOTING RESOLUTION**  
  **Move to retain the Vance Expedition diorama with mandatory revisions:**  
  1. Updated labels/positioning centering Indigenous expertise.  
  2. Added plaque contextualizing 1985’s limitations and 2023’s reinterpretation.  
  3. Tribal consultation for label text (if possible pre-installation; else within 90 days).  

  > **Board Vote:** ☐ APPROVE ☐ REJECT  

  ---  
  **Bottom Line:** Keep the artifact, but transform it into a catalyst for critical thinking. This acknowledges all three eras (1920s, 1985, 2023) without valorizing any—and models accountability.
