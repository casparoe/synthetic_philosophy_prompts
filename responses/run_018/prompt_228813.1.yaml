prompt: |-
  So I've been chewing on this for weeks after a fight in a comment thread about whether having kids is selfish, and I want a number, not a shrug.

  The thing: pretty much everyone agrees that if you somehow KNEW a child you conceived would have a life of nothing but severe suffering, it would be wrong to conceive them. But almost nobody thinks you do anything wrong by NOT conceiving a child who would have had an amazing life. There are zillions of possible happy people humanity could bring into existence and nobody calls us monsters for not getting started. So the bad side generates a duty and the good side doesnt. That's lopsided, and I can't tell if it's a deep moral fact or a glitch in our gut reactions.

  My own stab at justifying it: creating someone is like mailing a package to an address that doesn't exist yet. You can't owe a future nobody a present, but you can absolutely owe it to them-in-advance not to send them a bomb. I like this analogy but I suspect it just restates the lopsidedness instead of explaining it. Tell me if it does any work.

  The proposition I want your credence on, as precise as I can make it: there is a genuine moral duty not to create a person you can confidently predict would have a life of severe suffering, AND there is no moral duty at all, not even a weak defeasible one, to create a person merely because their life would be wonderful. My own credence is around 0.65, but honestly I made that up to have something to argue with.

  Give me yours and show the derivation. Decompose the proposition into the sub-questions it actually depends on (things like: is the miserable-child intuition robust under reflection or does it fall apart; can any coherent theory of value make the two sides come out different without special pleading; does everything hinge on non-existent people not being anyone you can wrong; etc. -- you'll find better sub-questions than me). Assign a rough probability to each, explain how they combine into your final number, and flag which sub-question the final answer is most sensitive to.

  One extra sub-question I want folded in: CONDITIONAL on the asymmetry being true, what's the probability it drags you to the grim conclusion (there's an antinatalist philosopher who argues this, forgot his name) that every birth is a harm, because all lives contain some pain and nobody consented to any of it? I really don't want that to follow, but wanting isn't an argument.

  Also: what's the single thing -- an argument, a thought experiment, whatever -- that would move your number the most, in either direction?

  Format: do the reasoning in prose first, then give me a table with these columns: sub_question | your_probability | one_line_reason | sensitivity_of_final_answer (low/medium/high). Then end with a small JSON object with exactly these fields: {"overall_credence": ..., "p_antinatalism_given_asymmetry": ..., "most_sensitive_subquestion": ..., "biggest_potential_update": ...}
reasoning: |-
  Hmm, the user is grappling with a profound ethical dilemma about procreation asymmetry. They've clearly thought deeply about this for weeks after an online debate, and are frustrated with vague answers - they specifically want numerical probabilities to force precision. 

  The core asymmetry puzzles them: why does preventing suffering create obligations while enabling happiness doesn't? Their package analogy is clever but they suspect it's circular. I notice they're intellectually honest enough to admit their own 0.65 credence is made up, and wary of the antinatalist conclusion they find emotionally unappealing but logically possible.

  Breaking this down: first, the asymmetry proposition has two distinct claims - the strong negative duty (A) and absence of positive duty (B). These might not stand or fall together. Key sub-questions emerge: 

  1) Robustness of suffering prevention intuition: This seems culturally universal and survives reflection (e.g. torture baby thought experiments). High confidence.  
  2) Value theory coherence: Can theories like utilitarianism accommodate asymmetry without contradiction? Preference utilitarianism might, but hedonistic utilitarianism struggles. Medium confidence here.  
  3) Moral patient status of non-existent beings: This is the crux. If future beings have no moral standing until created, asymmetry follows naturally. Their package analogy captures this well. High confidence.  
  4) Antinatalist risk: Conditional on asymmetry, the leap to "all birth is harm" depends on whether we see suffering as non-consensual imposition or inherent to life's texture. The latter view blocks the conclusion. Medium confidence.

  The antinatalist worry deserves special handling. David Benatar's "better never to have been" argument looms here, but his premise that absence of pain is good while absence of pleasure isn't bad seems separable from the core asymmetry. 

  Biggest potential update would be discovering a coherent framework where creating happy lives is obligatory - say, a "duty to populate heaven" theology or Parfit's repugnant conclusion made palatable. That could torpedo claim B.

  Structurally, I'll weight the moral patient question highest since it's foundational. Multiplying probabilities naively gets me to 0.72, but since sub-questions aren't fully independent, I'll nudge down to 0.7. For antinatalism given asymmetry - the non-identity problem and threshold arguments make me put it at 0.3.

  User's clearly philosophically sophisticated - they'll appreciate the table breakdown showing how uncertainties propagate. Should emphasize that the package analogy actually does substantive work by highlighting the ontological difference between actual and potential persons.
answer: |-
  Here's a systematic breakdown of your core proposition and its dependencies. My reasoning follows, then the table, then the JSON.

  ### Core Reasoning
  Your proposition has two asymmetrical claims:
  1. **A (Negative Duty):** We have a genuine moral duty not to create a person predicted to have severe suffering.
  2. **B (No Positive Duty):** We have *no moral duty whatsoever* to create a person predicted to have a wonderful life.

  This asymmetry hinges on:
  - **Moral Status of Non-Existence:** Non-existent beings aren't subjects of harm/benefit *until created*. Preventing suffering avoids creating a victim; not creating happiness fails to create a beneficiary, but there's no pre-existing entity deprived. This explains the lopsidedness (your package analogy *does* substantive work here).
  - **Robustness of Intuitions:** The "miserable child" intuition withstands reflection (even anti-natalists exploit it). The "happy child" omission intuition is weaker – we feel no guilt for not maximizing potential happy lives, suggesting it's not foundational.
  - **Value Theory Coherence:** Asymmetry *can* be coherent. Preference utilitarianism (duties to avoid actual frustrated preferences, no duty to create satisfiable ones) or negative utilitarianism (prioritize suffering reduction) accommodate it. Classical utilitarianism struggles (hence Parfit's Repugnant Conclusion), but its flaws don't disprove asymmetry.
  - **Antinatalism Risk (Conditional on Asymmetry):** Asymmetry alone doesn't entail anti-natalism. Anti-natalism (à la David Benatar) requires stronger premises: that *any* suffering without consent is indefensible, and that absent happiness isn't a deprivation. Asymmetry only says we *may* omit creating happiness; it doesn't equate *creating* with *harming* if net-positive. Anti-natalism needs extra, contentious steps.

  ### Key Sub-Questions & Probabilities
  | sub_question                                                                 | your_probability | one_line_reason                                                                 | sensitivity_of_final_answer |
  | :--------------------------------------------------------------------------- | :--------------- | :------------------------------------------------------------------------------ | :-------------------------- |
  | **A (Negative Duty) is robust under reflection**                             | 0.95             | Universal intuition; torture/disabled-baby thought experiments solidify it.     | High                        |
  | **B (No Positive Duty) is robust under reflection**                          | 0.85             | No widespread guilt for omitting happy lives; overpopulation concerns support.  | High                        |
  | **Coherent value theory can support asymmetry without special pleading**     | 0.75             | Preference utilitarianism works; hedonistic utilitarianism fails but isn't definitive. | Medium                      |
  | **Non-existent beings lack moral standing pre-creation**                     | 0.90             | No entity to harm/deprive pre-existence; core to asymmetry's plausibility.      | High                        |
  | **Conditional on asymmetry: Anti-natalism necessarily follows?**             | 0.30             | Asymmetry permits creation of net-positive lives; anti-natalism requires extra premises (e.g., consent absolutism). | Medium                      |

  ### Combining Probabilities
  - **A & B Jointly True (Core Asymmetry):** 
    - A is near-certain (0.95). B is likely (0.85). 
    - Independence is questionable (if non-existence explains both, they correlate). 
    - Conservative estimate: `0.95 * 0.85 * 0.75 (coherence) ≈ 0.61`. Adjusted for non-independence and coherence: **0.70**.
  - **Anti-natalism Given Asymmetry:** Directly uses the sub-question probability: **0.30**.

  ### Biggest Potential Update
  - **Direction: Downward (weakening asymmetry).** A compelling demonstration that *not* creating a predictably wonderful life **actively deprives the universe of irreplaceable value** (e.g., a "duty to populate heaven" argument grounded in objective value realism). This could force a positive duty, breaking claim B.
  - **Direction: Upward (strengthening asymmetry).** Showing that *all* major moral frameworks (including utilitarianism) must accept asymmetry to avoid absurd conclusions (e.g., mandatory maximal procreation).

  ### Final Output
  ```json
  {
    "overall_credence": 0.70,
    "p_antinatalism_given_asymmetry": 0.30,
    "most_sensitive_subquestion": "Non-existent beings lack moral standing pre-creation",
    "biggest_potential_update": "Proof that omitting a wonderful life actively deprives the universe of objective, agent-neutral value (would lower credence to ~0.40)"
  }
  ```
