  ## Speech: For Robert, Isaiah, and Henry

  [Stand at the podium, pause, look at the ground, then up at the gathering]

  We are here to remember Robert Johnson, Isaiah Washington, and Henry James. We are here on the ground where they were taken, where they were killed. We stand where a community failed them. Utterly. Brutally. We stand where silence grew for generations.

  Names matter. The names etched here matter. Robert, Isaiah, Henry: they are known. They are restored to this place, not as abstractions, but as men. Men denied their lives, their futures, their humanity on this soil. Naming them is essential. It is the foundation of any honest memory.

  But memory, true memory, asks more of us than names. It asks us to confront the why, the how. It asks us about responsibility. The philosopher Karl Jaspers, struggling in the ruins of Germany after the Holocaust, spoke of different kinds of guilt. *Criminal guilt* belongs to those who commit the acts – judged in courts. *Political guilt* falls to every citizen of a state that allows such crimes; it is the debt we inherit for the failures of our polity, demanding restitution, demanding a better order. *Moral guilt* is personal – the reckoning each individual must have with their own conscience, their own actions or inactions. And then there is *metaphysical guilt* – a solidarity with human suffering so profound it defies easy assignment, but binds us all.

  Today, on this ground, we feel the weight of political guilt. We inherit the burden of a community, a system, that permitted this horror. That is a burden shared by all who call this place home, or benefit from its legacy. It demands our civic action: justice in law, equity in opportunity, truth in our telling. This memorial is a small, necessary act of that political responsibility.

  But moral guilt? That is different. It belongs in the realm of conscience. It is not ours to assign to others in this gathering. It is not placated by stone. It resides where it resides. The absence of other names on this stone... that absence speaks. It tells us this memorial is a beginning, not an end. It tells us reconciliation – true reconciliation built on full accounting and mutual recognition – remains distant. Some here today know that distance acutely. Their pain, their demand for unvarnished truth, is a sacred charge we must carry forward. This stone does not declare reconciliation achieved. It declares remembrance demanded.

  My work studies how societies remember profound evil. I look at Germany. They faced their past through *confession*. A generation, eventually, spoke: "We did this. Our hands." Their memory culture built monuments, yes, but crucially, it centered on the perpetrators' admission. It sought a shape, a climax, a catharsis – an ending to the story.

  The American South needs something different. Our need is not primarily for the climax of confession – though that would be a seismic shift. Our deeper need, forged by evasion, by denial, by the stubborn refusal of the perpetrator’s voice, is for *custodial memory*. We are the keepers of a record we did not make. We hold a truth no one in this park today committed, yet one that defines us. This is not a story with an ending we can write. It is a burden we must carry, generation after generation. It demands constant vigilance against forgetting, against softening, against the lie that it is over. This memorial is an act of custodianship. It says: *This happened here. To Robert, to Isaiah, to Henry. Remember it. Guard this truth.*

  To our friends from Germany: we see your own hard-won custodianship. We learn from your struggle *against* forgetting. But our paths diverge. Your journey began with perpetrators, however reluctantly, stepping forward. Ours begins – and persists – with the survivors, the descendants, and now, the custodians, insisting the record remains open, the wound acknowledged as unhealed, the demand for full justice unmet. We tend a flame that cannot yet be banked.

  Students here today: You inherit this custodianship. You will be told comforting stories, incomplete stories. You will be told it’s time to move on. Look at this stone. Remember the names. Ask: Who was Robert Johnson? Who was Isaiah Washington? Who was Henry James? Ask: Why here? Why them? Ask: What does this require of *me*, of *us*, now? Yours is the task of carrying this truth without flinching, without sugarcoating, into a future we must build differently.

  This stone is not the end of memory. It is the beginning of our keeping. It marks a place where we commit, however imperfectly, to holding the names, the fact, the political guilt, and the open wound. We commit to the long, unending work of custodianship – for Robert, for Isaiah, for Henry, and for the justice still denied. We are here to remember. We must stay here, in this difficult truth, and keep remembering. Thank you.

  ---

  ## Analytical Note: Liberties and Uncertainties

  1.  **Jaspers' Application:** Applying Jaspers' framework (developed for post-Nazi Germany) to the specific context of lynching and Southern racial terror takes interpretive liberty. While the categories are useful heuristically, Jaspers was deeply concerned with the immediate culpability of a citizenry that had actively supported or passively acquiesced to the Nazi regime. Applying "political guilt" trans-historically to descendants generations removed requires careful justification. I lean on the idea of inheriting responsibility for the *ongoing legacies* and *structural failures* traceable to the original crime, an extension Jaspers might acknowledge but didn't explicitly develop for this timescale or context.
  2.  **German Memory Simplification:** The characterization of German memory culture as centered on "confession" by the "perpetrator generation" is a contested simplification. While crucial confessions occurred (e.g., Willy Brandt at Warsaw, various trials), significant memory work was driven by subsequent generations, victim groups, scholars, and activists *against* resistance from many perpetrators and bystanders. The "shape, climax, and ending" narrative risks overlooking the ongoing, contested, and often painful nature of German memory work, which also involves deep custodianship (e.g., maintaining concentration camps as sites of learning).
  3.  **"Custodial Memory" as Dichotomy:** Framing Southern memory need as *distinctly* "custodial" versus German "confessional" leans heavily on my own argument. This risks overstating the dichotomy. Germany also practices extensive custodianship (archives, memorial sites requiring constant upkeep and interpretation). The South also has elements of confession (e.g., some family reckonings, truth projects, though rarely from primary perpetrators). The emphasis on custodianship here highlights the *starting point* and *primary mode required* in a context of foundational denial, but the boundary is porous.
  4.  **Least Confident Claim:** The single claim I am least confident about is: **"Germany's memory culture built monuments, yes, but crucially, it centered on the perpetrators' admission... It sought a shape, a climax, a catharsis – an ending to the story."** This overstates the centrality and completeness of perpetrator confession and implies a "catharsis" and "ending" that many scholars of German memory would vigorously dispute. German memory culture is far more complex, fragmented, and ongoing; the idea of a clear "ending" is particularly problematic and risks misrepresenting the continuous struggle involved. While perpetrator admission was a crucial *component*, centering the entire German project on it and implying it achieved closure significantly simplifies a much messier and enduring reality. The core of my point about the *different starting point* and *focus* in the South stands, but this specific characterization of the German process is the most vulnerable.
