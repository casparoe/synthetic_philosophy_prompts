answer: |-
  Right, let's break down Molyneux's core philosophical argument in that passage, cutting through the empiricist surface to the deeper conceptual point you're spotting.

  You're absolutely right to sense there's more than simple empiricism at play. While the *solution* involves experience (linking sight and touch), Molyneux's *reasoning* for why the blind man *couldn't* immediately recognise the shapes by sight delves into the very nature of spatial representation itself. Here's a walkthrough:

  1.  **The Core Claim:** The blind man, upon gaining sight, *could not* distinguish the cube from the sphere by sight alone. Molyneux asserts a definitive "No".

  2.  **The Explicitly Empiricist Reason:** He hasn't yet had the *experience* of associating the specific visual sensations (the "colours arranged in the field") with the tangible shapes he knows. This is the surface-level, associationist reading.

  3.  **The Deeper, Conceptual Reason (The Bit You're Spotting):** Molyneux goes beyond mere lack of association. He argues that the **ideas of extension and figure** acquired *through touch* are fundamentally **not the same ideas** as those that would be acquired *through sight*. Crucially, he describes what sight *initially* provides:
      *   **Sight gives "colours disposed in this or that manner".** This is key. He's not saying sight gives you a direct perception of a *volumetric, resistant, bounded object in 3D space* like touch does. Sight gives you a *two-dimensional array of coloured patches*.
      *   **Touch gives tangible extension and figure.** This involves resistance, pressure, contours felt against the skin, the kinaesthetic sense of moving around an object – yielding a sense of *solidity, volume, and boundaries* in 3D space.

  4.  **Different Representations, Not Just Different Inputs:** Molyneux isn't *just* saying the sensory inputs are different (light vs pressure). He's arguing that the *mental representations* or *concepts* formed from these inputs are qualitatively different kinds of information:
      *   **Visual Space (Initially):** A flat mosaic of colours/varying light intensities. No inherent information about depth, solidity, or back-sides. It's a *projective* field.
      *   **Tactile/Kinaesthetic Space:** Embodied, volumetric, resistant, involving force and movement. It's inherently *3D and object-oriented*.

  5.  **The Conceptual Gap:** Therefore, the concept of "cube" the man has isn't some abstract, amodal symbol meaning "six square faces, right angles". *For the newly-sighted man*, his concept of "cube" is intrinsically tied to the *tangible experience*: the feeling of sharp edges meeting at points, the flat resistance of faces, the way it feels to grip it. What he sees is merely a complex arrangement of light and colour. *There is no inherent conceptual link between that specific visual pattern and his tangible concept of "cube-ness"*. The visual pattern doesn't *mean* "cube" to him yet; it's just a pattern.

  6.  **Relation to Amodal Spatial Cognition:** This is where Molyneux's view clashes significantly with the modern idea of amodal spatial representation.
      *   **Molyneux's Implication:** Spatial concepts are *modality-bound* at their foundational level. Our "idea" of space/shape isn't a single, abstract thing; it's built from modality-specific experiences that *become* associated and integrated *through experience*. Before that association, the representations are distinct and incommensurable.
      *   **Amodal Cognition (Modern View):** This posits that the brain *does* eventually create abstract, modality-independent representations of space, shape, and location. These amodal representations can be accessed and manipulated by thought regardless of whether the input was visual, tactile, auditory, etc. (Think of mentally rotating an object – you're not necessarily visualising *or* feeling it; you're manipulating an abstract spatial model).
      *   **The Conflict:** Molyneux, in this passage, seems to argue *against* the existence of such an innate or pre-experiential amodal spatial core. For him, the *concept itself* – the very meaning of "cube" – is initially inseparable from the modality through which it was learned. Abstract, amodal spatial concepts are the *result* of learning to correlate different modalities, not the starting point.

  **So, to answer your core questions:**

  *   **Different Representations or Conceptual Binding?** It's both, but the deeper point is conceptual. He *is* saying visual and tactile space are literally different representations (flat colour array vs. volumetric resistance). But crucially, he argues that the *concept of a specific spatial form* (like a cube) is initially tied exclusively to the modality (touch) through which it was acquired. There's no inherent "spatial form concept" independent of the sensory modality that furnished its content *before* cross-modal experience.
  *   **Relation to Amodal Cognition?** Molyneux's argument is fundamentally *incompatible* with the notion of an *innate* or *pre-experiential* amodal spatial representation. His thought experiment is designed to show that without the *empirical work* of associating sight and touch, the brain *doesn't* automatically possess or apply a single, unified concept of space/shape across modalities. Amodal cognition, if it exists, is a *product* of experience for Molyneux, not a prerequisite.

  **In essence:** Molyneux isn't just saying the blind man hasn't *learned* which visual pattern goes with the cube. He's saying the blind man, upon seeing, *lacks the very conceptual framework* to understand that the visual pattern *is* a representation of the *same kind of thing* (a volumetric, bounded object) that he knows through touch. The visual input doesn't *present itself* as "shape" in the tangible sense he understands. His tangible concept of "cube" has no purchase on the purely visual data *until* experience teaches him the correlation. This is a profound point about the origins and nature of spatial concepts, going well beyond simple empiricist association. You're quite right to see it that way.
