answer: |-
  ### Desiderata for an Adequate Theory of Intrinsic Value

  An adequate theory of intrinsic value must reconcile the holistic nature of aesthetic and interpersonal goods with philosophical coherence and empirical plausibility. Drawing from Moore’s organic unities and biological emergence, the following desiderata specify what such a theory must deliver:

  1.  **Non-Decomposable Value (Organic Unity)**  
      **Statement:** The theory must account for goods whose intrinsic value is irreducible to the sum of their parts' values, even if those parts are valueless or disvaluable in isolation.  
      **Motivating Case:** A tragic drama’s value exceeds the sum of its painful scenes; a friendship’s worth isn’t reducible to individual pleasurable moments.  
      **Negotiability:** Non-negotiable (core to Moore’s challenge).  
      **Joint Unsatisfiability Flag:** Potential conflict with D3 if downward causation implies value is *entirely* determined by base properties.  

  2.  **Appreciation/Participation Asymmetry**  
      **Statement:** The theory must distinguish between *appreciating* an aesthetic good (e.g., a landscape) and *participating in* an interpersonal good (e.g., friendship), capturing their distinct value structures.  
      **Motivating Case:** One can value a landscape without reciprocation; friendship requires mutual engagement and shared agency. Friendship’s value is inherently relational and participatory.  
      **Negotiability:** Non-negotiable (fundamental phenomenological difference).  
      **Joint Unsatisfiability Flag:** Tension with hedonistic/preference accounts that reduce both to subjective states.  

  3.  **Downward Causation Compatibility**  
      **Statement:** The theory must allow that intrinsic value *qua* emergent property can exert downward causal influence on the valuing agent’s states or dispositions.  
      **Motivating Case:** A profound friendship (holistic good) alters one’s preferences, desires, or capacities for pleasure, akin to how an emergent biological trait constrains lower-level processes.  
      **Negotiability:** Camp-specific (emergentist-leaning theories).  
      **Joint Unsatisfiability Flag:** Conflicts with strict reductionism (D1) and potentially with D7 if value’s causal power undermines motivational neutrality.  

  4.  **Value Realism**  
      **Statement:** The theory must affirm that intrinsic value is objective and mind-independent, not merely a projection of attitudes.  
      **Motivating Case:** We argue about aesthetic judgments and friendship betrayals as if discovering error, not just expressing preferences.  
      **Negotiability:** Camp-specific (non-subjectivist theories).  
      **Joint Unsatisfiability Flag:** None.  

  5.  **Phenomenological Fidelity**  
      **Statement:** The theory must align with the lived experience of valuing—e.g., the "fittingness" of awe before grandeur or the felt obligation within deep friendship.  
      **Motivating Case:** Accounts reducing friendship to pleasure miss its inherent duties; reducing beauty to preference misses its claim on attention.  
      **Negotiability:** Non-negotiable (avoids alienating explanations).  
      **Joint Unsatisfiability Flag:** None.  

  6.  **Resistance to Value Imperialism**  
      **Statement:** The theory must accommodate reasonable diversity in aesthetic judgments and friendship forms without collapsing into relativism.  
      **Motivating Case:** Valid cultural variations exist in art appreciation; deep friendships differ across personalities/societies yet retain core value.  
      **Negotiability:** Non-negotiable (empirical adequacy).  
      **Joint Unsatisfiability Flag:** Tension with strong forms of D4.  

  7.  **Motivational Relevance**  
      **Statement:** The theory must explain how recognizing intrinsic value provides (defeasible) reasons for action or appreciation.  
      **Motivating Case:** We feel compelled to preserve beauty or nurture friendships because they are valuable, not solely due to contingent desires.  
      **Negotiability:** Preference (internalism vs. externalism camps).  
      **Joint Unsatisfiability Flag:** Potential conflict with D3 if downward causation *determines* motivation.  

  **Unsatisfiable Subsets:**  
  -   **Members:** D1 (Non-Decomposable Value), D3 (Downward Causation Compatibility)  
      **Reason:** Strong downward causation (D3) might imply value supervenes *dynamically* on base properties in a way that could undermine the *irreducible* non-aggregativity demanded by D1. If value’s causal power strictly depends on/configures the parts, its holistic independence is compromised.  

  ### Scoring of Theories

  **Moorean Holism (Ideal Utilitarianism):**  
  -   **Meets:** D1 (Explicitly central), D2 (Recognizes different goods), D4 (Strong realism), D5 (Captures fitting attitudes).  
  -   **Fails:** D3 (Downward causation not addressed; value is simple/non-causal), D6 (Struggles with diversity due to objective non-natural properties).  
  -   **Awkward Fits:** D7 (Reasons stem from objective value, but connection to motivation is obscure).  

  **Hedonist Reduction:**  
  -   **Meets:** D7 (Pleasure motivates directly), D6 (Can accommodate diversity via subjective experience).  
  -   **Fails:** D1 (Value is strictly aggregative: sum of pleasures), D2 (Reduces both landscape and friendship to pleasurable states), D4 (Value is subjective/experiential).  
  -   **Awkward Fits:** D5 (Fails to capture the distinct phenomenology of friendship duties or aesthetic awe vs. mere pleasure), D3 (No resources for downward causation).  

  **Preference-Satisfaction Account:**  
  -   **Meets:** D6 (Accommodates diversity via differing preferences), D7 (Satisfying preferences motivates).  
  -   **Fails:** D1 (Value aggregates from satisfied preferences), D2 (Collapses appreciation and participation into preference-satisfaction states), D4 (Value depends on contingent desires).  
  -   **Awkward Fits:** D5 (Struggles with "ought"-like phenomenology of friendship/beauty), D3 (Downward causation possible if preferences change, but value is derivative, not causal).  

  **Most Exclusive Requirement:**  
  -   **ID:** D1 (Non-Decomposable Value)  
  -   **Justification:** This demand directly challenges all aggregative theories (hedonism, preference-satisfaction). It necessitates a non-reductive, holistic framework, immediately disqualifying the most common naturalistic reductions and setting a high bar for complexity. Moore’s central insight remains the sharpest thorn for simpler accounts.

