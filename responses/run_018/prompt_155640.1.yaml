  For the questions, I'll structure them to challenge her distinctiveness. Start with her core argument vs. Harari and Graeber-Wengrow, then probe differences from Diamond and Graeber-Wengrow. Address Malthusian dynamics without agency, push on the complexity science critique, and link to climate fatalism. Ensure each question demands concrete examples or empirical evidence.

