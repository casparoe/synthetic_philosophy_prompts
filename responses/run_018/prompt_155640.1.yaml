  I'm prepping qustions for my podcast — next week I'm talking to a historian-philospher (she'd rather stay unnamed) who defends this thing she calls 'stochastic attractor theory' against both Harari's cognitive-revolution story in Sapiens and Graeber-Wengrow's cyclical-anarchist counter. She thinks the Agricultural Revolution wasn't a trap or a seasonal choice but an irreversible demographic attractor, so all these grand narratives miscast it as intentional agency. Draft 8-10 sharp interview qustions: at least one pressing how she differs from Diamond's geographic determinism and from Graeber-Wengrow's seasonal dualism, one on how she handles the Malthusian ceiling without assuming a unified human agent, and one that anticiaptes her saying 'that's just complexity science with a history label' — push her on what empirical difference her framing makes. Also include one linking this to whether climate adaptation today is basically fatalistic in her view. No generic 'what drew you to this' stuff. Please say what'd change your mind about whether these qustions really land, and point out where my reasoning about her view is shakiest.
