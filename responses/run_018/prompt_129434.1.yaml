answer: |-
  Righto, let's untangle this conceptual knot with a cuppa (metaphorically speaking). It's a proper head-scratcher where pragmatic encroachment (PE) and epistemic contextualism (EC) seem to step on each other's toes, especially in your specific case. Buckle up!

  **The Setup (In Your Words):**

  1.  **Speaker (S):** One person, fixed context, fixed personal stakes.
  2.  **Agent 1 (Low Stakes - LS):** Has evidence E for proposition P. If wrong, consequences are trivial (e.g., "The train stops at Clapham Junction" when missing it just means a short wait).
  3.  **Agent 2 (High Stakes - HS):** Has *identical* evidence E for *identical* proposition P. If wrong, consequences are dire (e.g., "The train stops at Clapham Junction" but missing it means missing a life-saving surgery).
  4.  **S's Attributions:** S says "LS knows P" but "HS does *not* know P".

  **The Tension:**

  *   **Pure EC's Headache:** EC says the meaning of "knows" shifts based on the *attributor's* (S's) context - specifically, the *salient alternatives* or *stakes in S's conversation*. Here, S's context hasn't changed. So, EC seemingly predicts S *should* use "knows" consistently for both LS and HS, or deny it to both. But intuitively, S *does* shift their attribution based purely on the *subject's* (LS/HS) stakes. EC struggles to explain this *without* letting the subject's stakes sneak in and affect the *speaker's* context (e.g., making HS's high stakes salient to S). But if S's context *is* changed by the subject's stakes, is it still *pure* speaker-contextualism? Feels a bit dodgy.

  *   **PE's Straightforward(ish) Answer:** Pragmatic encroachment cuts through this. PE says whether someone *genuinely knows* P depends *partly* on the *practical stakes facing the knower/subject*. Having evidence E might be enough for knowledge when stakes are low, but *not* enough when stakes are high - knowledge itself is "encroached" upon by pragmatics. So, for PE, S's different attributions are simply *tracking the different facts*: LS *does* know (low stakes + E), HS *doesn't* know (high stakes + E). S's own stakes are irrelevant to *what is true* about LS and HS. S is just reporting the objective (stakes-relative) facts.

  **Your Sharp Question: "Does that mean encroachment is doing the real work, and contextualism is just tracking speaker-sensitivity?"**

  Spot on. In *this specific scenario*, that's exactly how it looks:

  1.  **The Real Work (Truth Conditions):** PE (or SSI - see below) provides the underlying *metaphysics of knowledge*. It explains *why* LS knows and HS doesn't, given identical evidence but different practical situations. The difference is in the *world* (the subject's stakes), not just in the *word* "knows".
  2.  **Contextualism's Role (Linguistic Sensitivity):** EC, if it tries to handle this, ends up looking like it's primarily explaining the *linguistic flexibility* of "knows". It might say that *when S talks about HS*, the high stakes make sceptical alternatives salient *in S's context*, raising the standards for S's use of "knows" when referring to HS. But crucially, the *reason* those high stakes raise the standards *for S* is arguably *because* S recognises that *for HS*, those stakes *genuinely matter for whether HS counts as knowing*. So EC feels like it's *tracking* or *being sensitive to* the subject's stakes-driven facts that PE posits, rather than providing the fundamental explanation.

  **Enter Subject-Sensitive Invariantism (SSI):**

  SSI is essentially the *invariantist* flavour of Pragmatic Encarpment. Here's the rub:

  *   **What SSI Says:** The *truth conditions* of knowledge attributions (e.g., "S knows that P") depend on the *subject's* (S's) practical stakes and situation. The *meaning* of "knows" *doesn't* shift with the attributor's context (unlike EC). It's "invariant". But *whether it's true* depends on the *subject's* context (hence "subject-sensitive").
  *   **How SSI Handles Your Case:** SSI handles it beautifully *and* simply. The proposition "LS knows P" is true (LS's low stakes + E suffice). The proposition "HS knows P" is false (HS's high stakes + E do *not* suffice). The speaker S, with their fixed context, simply asserts these two different truths. No shifting meaning of "knows", just different facts about the two subjects.
  *   **"Does it solve the problem or just rename it?":** Genuine solve! SSI directly posits that the subject's stakes are part of the *truth-making conditions* for knowledge. It doesn't rely on the linguistic mechanism of contextual shifting. It *is* a form of Pragmatic Encroachment, often seen as *the* invariantist implementation of PE. So, it's not just renaming the *problem*, it's offering a distinct *solution* framework (invariantist semantics + stakes-sensitive metaphysics) compared to EC's solution (contextualist semantics).

  **Are They Genuine Rivals or Different Angles?**

  Bit of both, honestly.

  1.  **Core Rivalry (Metaphysics vs. Semantics):**
      *   PE/SSI is primarily a *metaphysical* or *epistemological* thesis: What *constitutes* knowledge depends partly on practical factors.
      *   EC is primarily a *semantic* or *linguistic* thesis: The *meaning* of the word "knows" is context-sensitive.
      *   They offer fundamentally different explanations for *why* knowledge attributions vary. PE/SSI says the *facts about knowledge* change with stakes. EC says the *meaning of the word* changes with the speaker's context.
  2.  **Different Angles on the *Puzzle*:** They are both trying to explain the same *data* - our intuitions that knowledge attributions seem sensitive to practical factors. Your case highlights a specific puzzle *within* that data. EC struggles with attributor-fixed/subject-varied cases without leaning on subject stakes. PE/SSI handles them directly. But EC might handle other cases (e.g., where the attributor's own stakes change) more naturally.
  3.  **The Blurry Middle Ground:** Some hybrid views exist (e.g., "moderate pragmatic encroachment" sometimes flirts with contextualist elements). And as you hinted, in *practice*, when EC tries to handle subject-stakes cases, it often ends up functionally acknowledging the importance of the subject's situation for *triggering* the speaker's context shift, making it look like it's smuggling in PE-lite.

  **The Takeaway (British Casual Style):**

  In your specific head-to-head where one speaker judges two subjects with identical evidence but different stakes, while staying put themselves:

  *   **Pure EC** looks a bit stuffed. It can't easily explain the shift without bending its own rules about the speaker's context being king, potentially letting the subject's stakes sneak in the back door. Feels like it's just *reacting* to the stakes difference PE/SSI posits.
  *   **PE/SSI** waltzes in and says, "Easy. LS knows 'cos the stakes are low for *him*. HS doesn't know 'cos the stakes are high for *her*. Your speaker's just calling it like it is." The *real work* is being done by the idea that stakes affect the knowledge *itself*.
  *   **SSI specifically** isn't just renaming the problem; it's the cleanest invariantist framework *for* PE, giving a direct solution to your puzzle by putting the stakes burden squarely on the subject's shoulders.

  So yeah, they *are* genuine rivals offering different core explanations (word meaning vs. knowledge constitution). But your case brilliantly exposes a spot where pure EC seems a bit lost without implicitly borrowing PE's clothes, while PE/SSI strides through confidently. It suggests that for *this* kind of puzzle, the encroachment story (especially via SSI) might be doing the heavy lifting. The debate's still lively, but that case is definitely a thorn in pure contextualism's side! Cheers for the top question – proper made me think! Any other bits niggling you?
