  Hmm, the core tension seems to be between functional behavior versus structural implementation. Question 1 is the main fork - if someone thinks predictive success is enough, they'll lean pragmatic or proxy; if not, they'll demand more. Then question 2 about representations acts as a secondary filter. The autonomy question (3) specifically isolates the proxy stance, while question (4) creates the moral-pragmatic hybrid branch. 

  For the metastable contradiction edge case, I'll attach it to the "predictive success is sufficient" path since it challenges even that minimal criterion. The awkward commitments will highlight each position's counterintuitive implications - like pragmatism attributing beliefs to thermostats, or eliminativism dismissing all AI cognition.

  I should watch for unoccupied combinations. For instance, someone demanding genuine aboutness but not caring about autonomy might be coherent but rare - possibly an "unexplored" position. And yes, pragmatism and proxy stance could blur if designers' intentions are opaque, which I'll flag.

