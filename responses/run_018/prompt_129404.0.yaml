answer: |-
  1.  I take the first horn: the undocumented resident *does* acquire significant, obligation-generating claims through shared institutional burden-bearing, but crucially, not the *identical* claims of full co-citizenship.  
  2.  The moral core of compatriotism lies not merely in *exposure* to the state, but in the reciprocal *authorization* and *liability* inherent in jointly constituting the sovereign power that creates those burdens and benefits.  
  3.  Formal citizenship signifies mutual recognition as co-authors and co-liable subjects of the collective decisions enforced by that state – a specific joint venture the undocumented resident, however deeply affected, does not formally participate in authorizing.  
  4.  While residency creates real moral claims (especially against exploitation or sudden exclusion), it lacks the distinctive element of *mutually assumed liability for the system's operation and outcomes* that binds co-citizens as a political collective.  
  5.  This distinction isn't arbitrary; it reflects the foundational link between bearing the *ultimate* liability for the state's actions (as a citizen) and possessing the full set of special obligations and claims generated by that shared political venture.
