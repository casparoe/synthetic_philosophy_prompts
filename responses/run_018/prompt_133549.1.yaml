  ---

  ### Case Translations  
  **1. Confederate Lost Cause**  
  - *Identity-Necessary Translation*: Sustains collective character arc via **tragic closure**; defeat is ennobled through **focalization** on military sacrifice, creating **catharsis** that binds group identity. **Mythic mode** elevates historical actors to archetypes, with selective **analepsis** (pre-war agrarian ideals) framing the diegesis.  
  - *Revisionism Translation*: **Unreliable narration** via suppressed **diegetic weight** (e.g., slavery’s causal role). **Focalization** distorts by excluding marginalized perspectives, creating **dramatic irony** where audiences recognize omitted truths. **Proleptic redemption** is artificially imposed to imply inevitable cultural resurrection.  
  - *Distortion Notes*: "States' rights" as motive becomes irrecoverable; translated as **focalization bias**.  

  **2. Masada (Jewish Narrative)**  
  - *Identity-Necessary Translation*: **Proleptic redemption** structures the siege as necessary sacrifice for future national rebirth. **Mythic mode** transmutes historical defeat into **catharsis** through ritualized retelling. **Tragic closure** ennobles resistance, with **focalization** fixed on defenders' agency.  
  - *Revisionism Translation*: **Diegetic framing** excludes complicating historicity (e.g., Sicarii extremism, Roman context). **Analepsis** reduces pre-siege societal fractures to a monolithic **character arc**. **Unreliable narration** elevates legend over evidence.  
  - *Distortion Notes*: Theological significance translated as **mythic mode** imposition.  

  **3. Kosovo Field of Blackbirds (Serbian Narrative)**  
  - *Identity-Necessary Translation*: **Tragic closure** sanctifies defeat through martyrdom archetypes. **Proleptic redemption** positions loss as diegetic precondition for modern sovereignty. **Mythic mode** overrides historicity via symbolic **focalization** on Prince Lazar’s choice.  
  - *Revisionism Translation*: **Analepsis** manipulates causal chains (e.g., Ottoman expansion as moral rather than geopolitical). **Dramatic irony** arises from omitted perspectives (e.g., Albanian narratives). **Diegetic weight** of later instrumentalization is erased.  
  - *Distortion Notes*: Sacred/profane dichotomy becomes **mythic mode** flattening.  

  **4. Dunkirk "Miracle"**  
  - *Identity-Necessary Translation*: **Proleptic redemption** reframes retreat as heroic survival essential to future victory. **Catharsis** arises from communal mobilization (**mimetic framing** of civilian boats). **Focalization** on collective resilience obscures strategic failure.  
  - *Revisionism Translation*: **Mimetic emphasis** on evacuation obscures **diegetic** causes of defeat (e.g., pre-war unpreparedness). **Analepsis** minimizes colonial/class tensions in "people’s army" depiction. **Dramatic irony** exists for audiences aware of subsequent geopolitical compromises.  
  - *Distortion Notes*: "Blitz spirit" as social glue becomes **cathartic focalization**.  

  ---

  ### Residue Report  
  | **Category**             | **Findings**                                                                                               |  
  |--------------------------|-----------------------------------------------------------------------------------------------------------|  
  | **Clean Mappings**       | Catharsis, tragic closure, proleptic redemption, unreliable narration, and dramatic irony translate ethical stakes into structural/emotional effects. Mythic mode cleanly captures sacred-historical synthesis. |  
  | **Forced Distortions**   | "Necessity" of myth becomes **diegetic cohesion**—flattening ethical urgency. Power dynamics in narrative control (e.g., who focalizes) lack specific craft terms, requiring circumlocution. |  
  | **Untranslatable Elements** | Motive attribution (e.g., "preserving honor" vs. "oppression") and material consequences (e.g., systemic discrimination) have no craft correlates. "Collective identity" as a good/bad construct has no narrative equivalent. |  
  | **Assessment**           | Residue exposes craft’s blindness to *extratextual impact*. It describes narrative mechanics but cannot evaluate why a focalization choice is harmful beyond structural incoherence. The untranslatable elements reveal the debate’s core ambiguity: whether identity cohesion inherently justifies historical elision. |  

