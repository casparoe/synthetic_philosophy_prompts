answer: |-
  Based on your meticulous description and the specific examples provided, I agree this pattern is distinct from established fallacies like motte-and-bailey or simple equivocation, and also distinct from benign theoretical pluralism. There isn't a widely recognized, single established term for *this precise dialectical maneuver*. However, we can define it sharply and coin a fitting term.

  **The Phenomenon: "Modal Weight-Shifting" (Coined Term)**

  1.  **Core Definition:** Modal Weight-Shifting is an argumentative strategy within the defense of a theoretical framework (especially one positing entities with contested ontological status) where:
      *   A **single theoretical construct** (e.g., "possible worlds" in Lewisian realism) is employed.
      *   The **ontological weight assigned to this construct is dynamically modulated** within a single, continuous line of defense.
      *   **Heavyweight Commitment:** The construct is assigned **full, literal, concrete ontological status** (e.g., spatiotemporally isolated universes) specifically when performing **explanatory, grounding, or reductive work** (e.g., grounding counterfactual truth, explaining modal intuition, reducing modality to non-modal facts).
      *   **Lightweight Commitment:** The construct is assigned a **deflationary, representational, heuristic, or merely instrumental status** (e.g., "just a model," "a useful fiction," "a way of talking," "no more real than mathematical structures") specifically when responding to objections concerning **ontological cost, epistemic access, parsimony, or causal isolation**.
      *   **Dynamic Toggle:** The shift between heavyweight and lightweight commitments occurs **rhetorically in response to the specific objection being addressed**, without acknowledging the shift as a change in the theory's core claims or resolving the inherent tension between the commitments. The heavyweight stance is typically resumed once the defensive need passes.

  2.  **What It Is Not: Sharp Distinctions**
      *   **Not Motte-and-Bailey (M&B):** In M&B, the "bailey" (desirable but vulnerable claim) is *abandoned* under pressure for the "motte" (defensible but less desirable/interesting claim). In Modal Weight-Shifting, *both* heavyweight and lightweight interpretations are presented as integral to the *same* serious defense. The heavyweight claim isn't abandoned; its ontological burden is temporarily deflated defensively while its explanatory role is preserved. The defender intends to *keep* the heavyweight explanatory power *without* permanently accepting its costs.
      *   **Not Equivocation:** Equivocation involves *changing the meaning* of a term mid-argument. Here, the *meaning* of "possible world" (as a maximally consistent way things could be) often remains stable. What shifts is the *ontological interpretation* (concrete universe vs. abstract representation) *assigned to* that stable meaning within the argument. The speaker uses the *same word* with the *same core definition* but *toggles the metaphysical baggage* it carries.
      *   **Not Theoretical Pluralism:** Genuine pluralism acknowledges that *different, potentially incompatible* interpretations or uses of a concept exist for *different, complementary purposes*. It doesn't present them as a unified whole for a single purpose. Modal Weight-Shifting uses the *incompatible* interpretations (literal concrete existence vs. mere representation) for the *same core purpose* (defending modal realism) but *switches between them tactically* to avoid different kinds of objections, without acknowledging the incompatibility or offering a principled way to reconcile them.
      *   **Not Lewis's Own Position:** Lewis was remarkably consistent: worlds are concrete, spatiotemporally isolated universes. He *embraced* the ontological cost and offered (controversial) epistemic arguments (e.g., "modal imagination as knowledge by acquaintance via counterparts"). The weight-shifting occurs when defenders *fail* to maintain Lewis's consistency, oscillating to avoid his commitments' hardest consequences.
      *   **Not Simple Inconsistency:** While inconsistent, it's a *strategic*, *dynamic* inconsistency tied directly to the dialectical pressure of the moment (explanatory need vs. objection type).

  3.  **Where the Edges Lie:**
      *   **Core:** The phenomenon is clearest when applied to entities whose *explanatory power is argued to depend on their concreteness* (e.g., grounding truthmakers, providing causal links) but whose *defense requires downplaying that concreteness* (e.g., to avoid epistemic or parsimony objections).
      *   **Blurred Edge - Gradual Shifts:** Sometimes the shift might be subtle (e.g., "fundamental" to "useful abstraction" rather than "concrete" to "mere model"). The key is the *functional toggle* tied to objection type.
      *   **Blurred Edge - Justified Contextualism:** If a defender offered a *principled, consistent contextualist theory* where "world" genuinely has different ontological implications in different *theoretical* contexts (e.g., semantics vs. epistemology), that would *not* be weight-shifting. Weight-shifting lacks the principled framework; the shift is ad hoc and driven by defeasing objections, not by a coherent contextualist ontology.
      *   **Boundary:** The phenomenon requires the *same speaker/defender* making *both* moves within a *single argumentative arc* concerning the *same theoretical construct* for the *same core theoretical purpose* (defending the framework).

  **Confidence and Uncertainty:**

  *   **High Confidence:** That this is a distinct, identifiable, and problematic dialectical pattern as you've described it. Your examples perfectly illustrate it. The distinction from M&B (no abandonment of the "bailey"), equivocation (stable core meaning, shifting ontological interpretation), and pluralism (tactical toggle within one defense, not complementary perspectives) is sound.
  *   **Lower Confidence (Point of Uncertainty):** Whether this is *always* a single, unified phenomenon performed consciously/unconsciously by a defender, or if it *sometimes* reflects an underlying *unresolved tension within the defender's own understanding* of the theory. In the latter case, the "oscillation" might stem from genuine internal conflict rather than purely strategic rhetoric. However, *in its dialectical effect*, it functions identically: it allows the defender to claim the benefits of heavyweight ontology while evading its costs, regardless of internal motivation. The *pattern* you observe and its *argumentative function* are clear. The internal state of the defender is secondary to identifying the maneuver.
  *   **Not Two Separate Moves:** I believe you have correctly identified it as a *single dialectical pattern*. The explanatory heavyweight move and the defensive lightweight move are intrinsically linked within the strategy. The heavyweight move *creates* the vulnerability that necessitates the lightweight defensive move. The defender relies on the audience accepting the heavyweight version for the explanation to work, then relies on them accepting the lightweight version to avoid the objection, hoping the audience doesn't notice the incompatibility or demand a resolution. It's a unified tactic of having one's modal cake and eating it too, ontologically speaking.

  **Conclusion:**

  "**Modal Weight-Shifting**" effectively captures the core phenomenon: the strategic, dynamic modulation of the ontological commitment assigned to a *single* theoretical construct (especially "possible worlds") within a *single* argumentative defense, toggling between heavyweight (concrete, literal) status for explanatory power and lightweight (representational, heuristic) status to deflect objections concerning cost or access. This distinguishes it sharply from M&B (no abandonment), equivocation (stable meaning, shifting interpretation), and pluralism (not complementary, but tactical toggle). While the defender's internal state (strategic vs. conflicted) might vary, the dialectical pattern and its function are distinct and problematic. Your observation and carving are precise and valuable for critiquing defenses of modal realism (and potentially similar theoretical frameworks).
