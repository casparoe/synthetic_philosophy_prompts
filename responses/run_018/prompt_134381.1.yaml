answer: |-
  1.  Those "tools" like supervenience are just fancier ways of mapping existing confusions – they don't solve the original pseudo-problems (like free will), they just create new jargon layers. Therapy got technical, it didn't stop being therapy.
  2.  Calling it "instrumental progress" is a bait-and-switch: those tools might *accidentally* help science or law, but that's not *philosophical* progress – it's just philosophy failing to dissolve a confusion completely, leaving scraps others repurpose.
  3.  Where's the cumulative *knowledge*? We still have fierce, unresolved debates on free will, consciousness, ethics – just like millennia ago. Restructuring isn't converging on truth; it's rearranging deck chairs. Persistent disagreement signals deep pseudo-problems, not progress.
  4.  Science tests theories against the world and discards falsified ones, building. Philosophy just generates endless new interpretations of old puzzles using new vocab – that's not accumulation, it's conceptual drift. Your "architecture" often collapses under its own weight (e.g., debates *about* supervenience itself).
  5.  Fine, *maybe* clearing *some* linguistic confusion (therapy's core job) *can* occasionally help other fields unstick themselves – but that's a side-effect of deflation, not proof philosophy builds anything substantial or cumulative itself. You've described better therapy, not progress.

  *(Note: Pretty settled? Most agree philosophy doesn't progress like science. Genuinely contested? Whether "restructuring" or "tool-building" counts as *progress* (vs just better confusion-management) is core to the debate.)*
