answer: |-
  Here's the architectural spec for a robust theory of moral ecology addressing your core question, with constraints, tensions, and theory evaluations:

  ### Core Desiderata (What the Theory Must Deliver)
  1. **Moral Visibility vs. Moral Durability Distinction**  
     *Constraint*: Must empirically separate performative cooperation (visible compliance under surveillance) from intrinsic moral commitment (consistent behavior in anonymity/low monitoring). Collapsing these conflates reputation management with genuine virtue, invalidating claims about "authentic" morality.  
     *Why hard*: Requires measurable proxies for private behavior (e.g., anonymous economic games, self-report biases).

  2. **Non-Reductive Explanation of Secular High-Trust Societies**  
     *Constraint*: Must explain Scandinavian-style societies (low religiosity, high cooperation/trust) without hand-waving "culture." Needs mechanistic drivers (e.g., institutional trust, normative internalization).  
     *Why hard*: Challenges the assumption that religion is *necessary* for large-scale cooperation. Must identify functional alternatives to religious scaffolding.

  3. **Free-Rider Problem Resolution**  
     *Constraint*: Must show how secular groups sustain cooperation without costly religious signals (e.g., rituals, dietary restrictions). Cannot rely on "hidden" religiosity or assume secularization erodes cooperation.  
     *Why hard*: Costly signaling is a dominant explanation for religious cooperation. Alternatives require evidence of lower-cost enforcement (e.g., institutional punishment, reputation networks).

  4. **Non-Reductionist Morality Definition**  
     *Constraint*: Must distinguish cooperation from morality. Acknowledge moral tensions (e.g., whistleblowing vs. loyalty, civil disobedience vs. rule-following). "More moral" ≠ "more obedient."  
     *Why hard*: Quantifying morality invites bias. Requires a pluralistic framework (e.g., Haidt’s foundations) to avoid privileging conformity.

  ### Tensions & Joint Satisfiability
  - **Critical Tension**: **High anonymity + Stable cooperation** may be *jointly unsatisfiable* without:  
    (a) Internalized enforcement (durable conscience), OR  
    (b) Invisible social/institutional enforcement (e.g., digital reputation, state databases).  
    *Implication*: Truly "anonymized" societies risk cooperation collapse unless moral durability is high. Scandinavian models rely on (b) via strong institutions.

  ---

  ### Theory Report Card (Brief Evaluation)
  | **Theory**               | **Desiderata Score**                                                                 | Key Weakness                               |
  |--------------------------|-------------------------------------------------------------------------------------|--------------------------------------------|
  | **Secularization Thesis** | ❌ #1 (Ignores durability), ❌ #2 (Asserts erosion, doesn't explain alternatives)      | Presumes religiosity→morality causality. Fails on #4 (reduces morality to declining norms). |
  | **Costly-Signaling (CS)**| ✅ #1 (Explicitly models visibility), ✅ #3 (Solves free-riders via signals)          | ❌ #2 (Can't explain secular high-trust), ❌ #4 (Equates signaling with morality; ignores dissent). |

  ### Key Architectural Requirements
  Your theory must:  
  - **Operationalize** visibility (e.g., social monitoring intensity) vs. durability (e.g., behavioral consistency across observability gradients).  
  - **Specify mechanisms** for secular moral maintenance (e.g., universal education → internalized ethics, state transparency → institutional trust).  
  - **Resolve free-riders** via *non-ritualistic* signals (e.g., reciprocal labor, digital reputational scores) or low-cost enforcement (e.g., efficient institutions).  
  - **Define morality multidimensionally** (e.g., care, fairness, autonomy, dissent) to avoid coopting "cooperation" as virtue.

  This architecture forces engagement with the hardest edges of the debate. The tension between anonymity and cooperation suggests **no theory fully escapes enforcement mechanisms**—but their *visibility* and *cost* determine whether religiosity is necessary or replaceable.
