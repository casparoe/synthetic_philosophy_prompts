answer: |-
  Here's your activity design—run it as a competitive "archival insight" game:

  1. **Setup & Roles**: Split into three teams (2-3 people each). Each gets a folder with 4 fictional 1920s letters (e.g., a doctor calling anxiety "weakness," a mother blaming "laziness" for depression, a business letter firing someone for "nerves," a diary entry shaming therapy). Teams play "archivists" racing to extract "progressive insights" from the letters in 20 minutes.

  2. **Rules & Payoff**: Teams highlight/text-mark "morally backward" passages and write a 1-sentence "modern critique" on a sticky note for each. For every critique, they earn an "Impact Token" (colored poker chips or paper squares). Most tokens = "Top Archivist" title (bragging rights only).

  3. **Hidden Twist**: After collecting tokens, reveal that **token colors secretly matched "counterfactual values"** (e.g., blue = "should've valued therapy," red = "should've understood neurochemistry," green = "should've rejected productivity-over-health"). Force teams to sort their own sticky notes by these unstated values—their critiques *built the shadow archive* they judged the past against.

  4. **Debrief**: Ask: *"When did you feel proud of a critique? That’s presentism feeling righteous."* Map token colors to their imagined "better past." **First-run problem**: Teams will likely oversimplify letters to "score" critiques, ignoring historical context like era-specific medical knowledge or economic pressure.

  5. **Limitation**: This *can’t* reproduce how **presentism shapes which questions historians ask** (e.g., ignoring past issues *without* modern parallels). You’ll need to add this verbally: *"We only judged letters *we* deemed ‘backward’—what didn’t we even look for?"*

  ---

  **Prep Tip**: Pre-write letters using your archive experience—add specific period details (old medical terms, social norms) to make the "trap" feel authentic. Use 3 token colors max for speed.
