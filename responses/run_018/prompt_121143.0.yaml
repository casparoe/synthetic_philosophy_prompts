  ### The Case: Heritage Status of the Rebuilt Inn  
  The Maple Creek Inn, a historic building in a small town, was severely damaged by a fire. The town council had previously granted it heritage status, which included a clause: "If the original inn ceases to exist, the status lapses, and tax exemptions are revoked." The owners rebuilt the inn using modern materials but replicated the original design exactly, using archival blueprints. They insist, "The inn still exists—it’s the same building, just restored." The heritage committee disagrees: "The original inn is gone; this replica isn’t the same." Both sides agree the rebuilt inn serves the same function, occupies the same land, and matches the original’s appearance. The dispute hinges on whether the phrase "still exists" (in the clause) applies.  

  **Agreed Neutral Facts:**  
  1. The original inn (built 1890) was 90% destroyed by fire in 2023.  
  2. The new structure replicates the original’s exterior design, interior layout, and function as an inn.  
  3. It stands on the original foundation and land parcel.  
  4. It operates under the same name, business license, and ownership.  
  5. The heritage status grants annual tax exemptions of $50,000, contingent on the original inn "still existing."  

  ---  
  ### Discussion of the Case  

  #### (a) Hirsch-Style Deflationist Verdict  
  - **Verdict:** Merely verbal.  
  - **Reasoning:** Disambiguation resolves the dispute cleanly. Under the "material continuity" reading (requires original physical matter), the committee says truthfully the inn no longer exists. Under the "functional continuity" reading (requires same location, design, and purpose), the owners say truthfully it still exists. Both agree on all neutral facts (e.g., the fire, replication, function), so no residual disagreement remains.  
  - **To the Parties:** "Your dispute is linguistic, not ontological. Settle it by stipulating which reading governs the clause. If you can’t agree, amend the clause to specify 'material' or 'functional' continuity."  
  - **If Institutional Stakes Are Removed:** The dispute collapses into boringly verbal territory. Without tax exemptions, the disagreement loses practical urgency and becomes a trivial debate over word usage. The deflationist insists the "substantive" feeling stems *only* from the institutional stakes.  

  #### (b) Sider-Style Realist Verdict  
  - **Verdict:** Substantive.  
  - **Reasoning:** The realist argues one reading "carves nature at the joints" better. If material composition is joint-carving (e.g., because objects are defined by their physical parts), the committee’s reading is objectively correct. If spatiotemporal-functional continuity is more fundamental (e.g., because artifacts are defined by their role), the owners win. The choice matters because the "correct" ontology tracks mind-independent structure.  
  - **To the Parties:** "One of you is metaphysically correct. We must discover whether 'existence' in this context hinges on material or functional joints."  
  - **If Institutional Stakes Are Removed:** The verdict *survives* but becomes practically inert. The realist maintains that the dispute is inherently substantive—it reveals a deeper metaphysical truth about persistence—even without tax implications. The stakes merely highlight the importance of getting the ontology right.  

  #### (c) Carnapian Framework Relativism Verdict  
  - **Verdict:** Substantive but non-descriptive.  
  - **Reasoning:** This view (often associated with Carnap) treats ontological disputes as choices between linguistic frameworks. Here, the dispute is about which framework to adopt: a "preservationist" framework (valuing historical material) or a "pragmatic" one (valuing continuous function). The choice isn’t about truth but about expressive goals—honoring heritage vs. supporting business continuity. The institutional stakes make the framework choice non-trivial.  
  - **To the Parties:** "Your disagreement isn’t about facts but values. Adopting the committee’s framework prioritizes historical integrity; the owners’ framework prioritizes economic resilience. Negotiate which value the clause should protect."  
  - **If Institutional Stakes Are Removed:** The framework choice loses urgency, but the disagreement *could* persist as a clash of values (e.g., "What *should* ‘existence’ mean for cultural heritage?"). However, without stakes, it risks becoming "merely verbal" in practice.  

  ---  
  ### Critical Weaknesses in My Reasoning  
  Your suspicion that the loaded-reading test confuses **practical importance** with **metaphysical substantiveness** is astute—and this case *might* not fully escape it. Here’s where my reasoning is shakiest:  
  - **What Would Convince Me the Loaded-Reading Test Tracks Only Practicality:**  
    If removing the institutional stakes (e.g., the tax exemption) makes both parties *indifferent* to the outcome, the test is clearly tracking practical stakes. In this case, if the heritage committee and owners shrugged post-stakes, their "non-linguistic reasons" (e.g., "honoring history") would be exposed as contingent on material incentives. The loaded-reading test would then reduce to "does this matter to someone?"—which is irrelevant to substantiveness.  
  - **What Would Convince Me It Tracks Genuine Non-Descriptive Substantiveness:**  
    If both parties retain strong, *principled* preferences after stakes are removed (e.g., the committee insists "adopting the functional reading dishonors history, even without money involved"), the test captures something deeper. This would show their reasons are expressive/normative (e.g., signaling respect for heritage) and exist independently of practical consequences.  

  **Conclusion for Your Presentation:** This case passes the dissolution test (disagreement vanishes under disambiguation) but fails the loaded-reading test (parties have non-linguistic reasons: the committee fears eroding heritage norms, the owners fear unfair economic penalties). The tests *do* come apart, but the fragility lies in whether "expressive stakes" are just practical concerns in disguise. To strengthen your case, stress that the parties’ reasons are **institutional/normative** (e.g., "If we accept the functional reading, we set a precedent that undermines heritage laws")—not just about money. This makes the disagreement resilient to stake-removal, saving it from collapsing into pure practicality.
