  We are constructing a case that satisfies:
  1. Passes the dissolution test: disambiguating the contested term in a neutral vocabulary shared by both parties leads to each side saying something true on every reading, and there is no residual disagreement about any neutral fact.
  2. Fails the loaded-reading test: the parties have non-linguistic reasons (expressive, institutional, normative) to prefer their own reading, such that settling by stipulation would leave something they care about (honor, rule application, signaling) untouched.

  Constraints:
  - Realistic, contemporary, one paragraph.
  - Institutional setting: e.g., grant condition, will, insurance clause, heritage designation, club rules.
  - Disputed word: ordinary English phrase (like "the same", "still exists", "is one").
  - No jargon in the story; no philosophers or linguists.
  - After the paragraph, list the facts both parties agree on.

  The scenario:

  **The Case of the Renovated Pub**

  The historic "Old Oak" pub in the town of Millford is at the center of a dispute between the local heritage society and the pub's current owner. The heritage society claims that the pub no longer exists because a recent renovation replaced the original 18th-century oak beams with steel supports, while the owner insists it is still the same pub. The dispute is critical because a grant from the National Heritage Fund requires that "the same historic pub" must still exist on the premises to receive funding. Both sides agree on all the physical and historical facts: the building was originally built in 1750, it has been a pub continuously since then, the renovation occurred in 2023 and replaced the original wooden structure with steel while keeping the same exterior appearance and location, and the pub continues to operate under the same name and license. However, the heritage society argues that without the original beams, the pub is not truly the same, while the owner points to the unbroken operation and the same location, name, and function.

  **Agreed Neutral Facts:**
  1. The building at 1 High Street, Millford, was constructed in 1750 as a pub and has operated as such continuously until now.
  2. In 2023, the owner undertook a renovation that replaced the original wooden structural beams with steel beams.
  3. The exterior appearance of the building was preserved to look the same as before the renovation.
  4. The pub has always operated under the name "Old Oak" and under the same business license.
  5. The grant condition requires that "the same historic pub" must exist on the premises for funding to be awarded.

  **The Dispute:**
  The contested phrase is "the same historic pub". We can disambiguate:
  - Reading 1 (material continuity): The pub is the same only if a significant portion of the original material (e.g., the beams) is still present.
  - Reading 2 (functional/organizational continuity): The pub is the same if it has operated continuously at the same location under the same name and license, regardless of material changes.

  Under the dissolution test:
  - If we adopt reading 1, the heritage society says truly: "The same historic pub (materially) no longer exists." The owner can say: "The same historic pub (functionally) still exists." There is no disagreement about the neutral facts (the beams are gone, but the function continues). So the dispute dissolves: each side is using a different reading and both are true under their reading.

  But the loaded-reading test fails: the heritage society has a non-linguistic reason to prefer the material reading because they care about preserving original material as a matter of historical authenticity. The owner has a non-linguistic reason to prefer the functional reading because they need the grant to continue operating. Moreover, the heritage society might argue that adopting the functional reading would undermine the purpose of heritage preservation (by letting any building that keeps the name and function count as the same even if all original material is replaced), and the owner might argue that adopting the material reading would unfairly penalize necessary renovations for safety. These are normative/institutional reasons.

  Now, for the discussion:

  **(a) Hirsch-style deflationist:**
  - Verdict: The dispute is merely verbal. Both sides agree on all the neutral facts (the physical and historical facts). The disagreement is only about which meaning of "the same" to use in this context. 
  - To the parties: They should disambiguate and realize that there is no substantive disagreement. However, they might still have a practical disagreement about which disambiguation should be used in the grant condition. The deflationist would say that this practical issue is not ontological but about how we should use words in a particular institutional context.
  - Driving feature: The agreement on neutral facts. If we remove the institutional stakes (e.g., if the grant condition didn't exist), the dispute might disappear or become purely academic. The deflationist would say that without the institutional stakes, the verbal nature is even clearer.

  **(b) Sider-style realist:**
  - Verdict: Substantive. The realist might argue that there is a fact of the matter about what "the same" really means, i.e., which reading carves nature at the joints. For example, if the joints are tied to material composition, then the heritage society is right; if to functional persistence, then the owner is. Alternatively, the realist might say that the dispute is substantive because it reveals a deeper metaphysical question about what constitutes the persistence of a pub. 
  - Driving feature: The realist might focus on the fact that the two readings correspond to different candidate fundamental structures (e.g., material vs. functional). The institutional stakes are irrelevant to the metaphysical question, but they highlight the importance of getting the right answer. If we remove the institutional stakes, the dispute might still be substantive (if we care about metaphysics) but less urgent.

  **(c) The view you can't remember (probably Carnapian framework relativism, or perhaps a Wittgensteinian contextualism):**
  - Verdict: Substantive, but not in the sense of describing a mind-independent reality. The dispute is about which framework (or language game) to adopt in this institutional context. The choice between the two readings is non-descriptive: it is about which norms or values to uphold (preservation of material vs. continuity of function). 
  - Driving feature: The institutional context and the normative stakes. The framework relativist would say that the dispute is substantive because it has practical consequences and is tied to our practices. If we remove the institutional stakes, the dispute might become merely verbal because without the context, there is no practical need to choose one framework over the other.

  **Honest assessment of shakiness:**
  Your suspicion that the loaded-reading test is tracking practical importance rather than substantiveness is well-founded. In this case, the non-linguistic reasons are practical (heritage values, business needs). But the loaded-reading test is designed to capture that even if the dispute is verbal in the dissolution sense, it might still matter for non-linguistic reasons. The key question is: does this make the dispute non-verbal? 

  What would convince me that the loaded-reading test is tracking practical importance only:
  - If after disambiguation, the parties agree on all facts but still disagree on what to do, that seems like a practical disagreement, not an ontological one. The dissolution test already shows there's no factual disagreement.

  What would convince me of the opposite (that it is tracking substantiveness):
  - If we can show that the non-linguistic reasons are not just practical but are tied to a genuine metaphysical insight (e.g., the heritage society's view is based on a correct theory of artifact persistence). But that would require a realist metaphysics, which the deflationist rejects.

  In your presentation, you can argue that the loaded-reading test is not a test for substantiveness in the metaphysical sense but for practical significance. However, the case still shows that the two tests come apart: dissolution says verbal, loaded-reading says not merely verbal (because of the non-linguistic reasons). So the tests are tracking different things.

  This case should work for your purposes.
