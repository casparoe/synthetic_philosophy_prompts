answer: |-
  ## Dialogue: The Lunar Demos Boundary Problem

  **Setting:** A virtual symposium on extraterrestrial governance.

  **Characters:**  
  *   **Mara:** Advocates the recursive authorization view.  
  *   **Jonas:** Advocates the co-presence view.  

  **(Round 1)**

  **Mara:** "Jonas, consider Luna Prime, permanently settled for two decades, its oxygen levels and water recycling critically dependent on regular resupply missions authorized and funded by Earth's Global Assembly. That Assembly is democratically elected by Earth citizens. Luna Prime residents have no vote in those budgetary decisions. Doesn't this violate the core democratic principle that those whose fundamental interests – their very survival – are systematically determined by collective decisions must be included in the demos making those decisions? The settlers' vital interests are *constituted* by Earth's choices."

  **Jonas:** "Mara, the settlers' dependence is undeniable. But dependence isn't sufficient for democratic membership. Democracy requires more than being affected; it requires the actual, reciprocal possibility of *participation* in shared deliberation about the common good. The Luna Prime settlers are physically and temporally isolated from Earth's deliberative sphere. They can't attend assemblies, debate with Earth citizens in real-time, or share the lived experience shaping Earth's political will. Including them in the Earth demos dilutes the meaning of collective self-rule into mere remote administration. They *need* their own, local demos precisely *because* Earth decisions affect them profoundly but unaccountably."

  **Mara:** "You isolate the settlers' agency too sharply. If Earth's allocation decisions shape life-or-death conditions on Luna, then the *Earth citizens* are exercising power over fundamental lunar interests. Doesn't your 'local demos' solution merely mask an external power relation? Luna Prime's 'self-rule' is hollow if Earth holds the purse strings on their oxygen. Recursive authorization demands that the *authors* of power – Earth citizens deciding Luna's resources – must include the *subjects* of that power – the lunar settlers – within their demos for those specific decisions. Otherwise, Earth governs Luna despotically."

  **(Round 2)**

  **Jonas:** "Your view, Mara, risks infinite regress. If the Earth demos must include Luna settlers because resource decisions affect them, doesn't that also mean the *lunar* demos must include Earth citizens? After all, Earth's resource allocation is constrained by its own needs and political pressures; Luna's demands *systematically shape* Earth's budgetary priorities and resource use. By your recursive logic, Earth citizens should vote in lunar affairs *and* lunar settlers vote in Earth affairs. This dissolves boundaries entirely, creating one global demos – an impractical and normatively incoherent blurring of distinct communities."

  **Mara:** "Not incoherent, Jonas, but acknowledging interdependence. The tension you identify – who integrates whom? – stems precisely from the power imbalance. The life-support decision *originates* in Earth's institutions, exercising authority *over* Luna. Therefore, the immediate democratic deficit is *Earth's demos excluding the affected lunar settlers*. If Luna made a decision unilaterally cutting Earth off from vital lunar data, *then* the recursive principle would demand Earth citizens be included in *that* lunar decision-making process. The direction of the authoritative decision matters. Earth is currently the unaccountable sovereign in this domain."

  **Jonas:** "But that's the crux, Mara. You define membership solely by the direction of *impact* from a decision *already authorized* by some existing structure (Earth's institutions). I define membership by the *preconditions for legitimate authorization itself*. Legitimate authority arises *only* from a community capable of shared deliberation – co-presence in a political space. Luna's physical separation from Earth makes them incapable of forming a *single* deliberative community with Earth citizens. Therefore, Earth institutions *cannot* legitimately govern Luna, not because they lack Luna's input per se, but because they lack the shared political space that makes *any* collective authorization meaningful. The settlers aren't excluded from *Earth's* demos; Earth's demos *cannot extend* to Luna. The only solution is for Luna to form its *own* authoritative demos, even if that means negotiating resource treaties with Earth as an independent entity."

  **Mara:** "And there lies our precise divergence, Jonas. You see the possibility of *democratic* authorization as dependent on the pre-existing condition of a spatially/temporally unified deliberative community ('co-presence'). I see the *need* for democratic authorization as triggered by the exercise of power over fundamental interests, *regardless* of spatial or temporal barriers ('recursive effect'). For you, Luna's separation makes Earth's governance inherently illegitimate. For me, Earth's governance *over* Luna's vital interests creates an obligation to *include* Luna within Earth's political community for those decisions. We disagree fundamentally on what *constitutes* democratic membership: is it the capacity for shared deliberation within a bounded space, or is it the subjection to authoritative power over one's fundamental life conditions?"

  **Jonas:** "Precisely, Mara. You ground membership in a *relational fact* (being subject to power). I ground it in a *constitutive capacity* (being able to engage in reciprocal deliberation). The life-support dilemma highlights this: its existence proves the power relation you emphasize, yet its spatial reality prevents the shared capacity I deem essential. We agree on the democratic deficit but fundamentally disagree on the necessary and sufficient conditions for resolving it."
