prompt: |-
  Hi there — I'm drafting material for a graduate seminar on the philosophy of social science, and I've run into a pattern in the literature that I can't quite map onto the standard taxonomy. I'm wondering whether there's already an established name for it, or whether I should just treat it as a particular failure mode of methodological individualism.

  Here's the pattern. A researcher begins by rejecting holism outright: they say we must never reify societies, institutions, or cultures, and that any proper explanation of a collective phenomenon — say, the sudden collapse of a cooperative norm, or the geographic clustering of a religious practice — has to bottom out in indvidual beliefs, preferences, and local interactions. So far, so standard. But then they build a model in which the macro-level distribution of those beliefs is treated as an exogenous parameter. They calibrate the individual decision-rules against the observed cluster, and once the micro-behaviour reproduces the cluster, they declare the macro pattern explained. The collective configuration is therefore doing silent explanatory work: it sets the boundary conditions and shapes the utility functions, yet it is never itself explained, and the researcher still insists that only individuals are causally real. I've seen versions of this in agent-based work on language shift and in some rational-choice accounts of institutional persistence, but I'm not asking about those fields specifically. What I'm after is the logical shape of the move itself — using a holistic distribution as an unexplained explainer inside a framework that denies holistic entities any explanatory autonomy. Is there a recognised term for this? It feels adjacent to crypto-holism and to downward causation, but it isn't either: there's no attribution of group intentions, and no claim that the macro level literally causes the micro. It's more like explanatory double-entry bookkeeping, where the same collective pattern apears both as the explanandum and as the hidden premise. If there isn't a standard label, could you define the phenomenon precisely — including its boundary conditions, how it differs from an ordinary auxiliary hypothesis, and whether it's genuinely inconsistent with methodological individualism or just an embarrassing omission?

  Oh, and please write your reply in British English — I'd like to keep the terminology consistent with the course materials.
reasoning: |-
  Okay, the user is drafting material for a graduate seminar on the philosophy of social science. They've noticed a pattern in the literature where researchers reject holism but then use macro-level distributions as exogenous parameters in their models. They want to know if there's an established term for this or if they should treat it as a failure of methodological individualism.

  First, I need to understand the core issue. The researcher starts by denying holistic entities, insisting explanations must bottom out in individual beliefs and interactions. But then they treat the distribution of those beliefs as a given, not explained. The macro pattern is both what they're trying to explain and what they're using as a starting point. The user mentions it's like "explanatory double-entry bookkeeping," which is a good analogy.

  Now, checking if there's an existing term. Crypto-holism comes to mind, but that implies intentional hidden holism, which might not fit here. Downward causation involves the macro causing micro effects, which the user says isn't the case. Methodological individualism's failure modes—aggregative or structural individualism—don't quite capture this either. Aggregative focuses on emergence from individuals without structural constraints, while structural considers institutions but explains them through individuals. Here, the macro distribution is taken as given without explanation.

  The key is the unexplained exogenous parameter. Terms like "problematic exogenous parameterization" or "explanatory circularity" might be relevant. But the user wants a precise definition. Boundary conditions: the macro parameter must be unexplained and essential to the model, not just an auxiliary hypothesis. It differs from auxiliary hypotheses because those are independently testable or explained, whereas here, the parameter is the very thing being studied, left unexplained.

  Is this inconsistent with methodological individualism? Strictly, yes, because the explanation relies on a macro-level feature not reduced to individuals. However, proponents might argue it's a placeholder. But in practice, it's an omission that undermines their individualist stance.

  Possible terms: "structural individualism" might be close, but it usually involves explaining structures. "Constitutive individualism" isn't standard. The best fit is "exogenous structural dependence." Or coining a term like "endogenous-exogenous loop." But the user might need to introduce a new term. 

  Also, the user wants British English. Terms like "collective configuration," "exogenous parameter," and "methodological individualism" should be used. Avoid American spellings.
answer: |-
  Right, this is a brilliantly observed and rather pervasive manoeuvre in the literature. It represents a specific, subtle, and often problematic form of what might be termed **explanatory sleight of hand** within ostensibly individualist frameworks. While there isn't a single, universally agreed-upon label that perfectly captures *every* nuance you describe, several related concepts and critiques point towards it. The most precise characterisation, drawing on established philosophical discourse in British English, would likely be:

  **Structural Presupposition within Constitutive Individualism (or Unexplained Structural Dependence)**

  Here's a precise definition, incorporating your observations on boundary conditions, differentiation from auxiliary hypotheses, and its relationship to methodological individualism:

  1.  **Phenomenon Defined:** It occurs when a researcher, committed to **methodological individualism** (MI) – the doctrine that all social phenomena must be explained solely in terms of the properties, states, and interactions of individuals – constructs an explanatory model where:
      *   A specific, non-trivial **macro-level structural feature** (e.g., the distribution of beliefs, norms, network topology, institutional configuration) is treated as an *exogenous parameter* or *fixed background condition*.
      *   This structural feature is essential for generating the *explanandum* (the social phenomenon to be explained, often *dependent* on or *emergent* from that very structure, like the clustering or collapse).
      *   The model "explains" the *explanandum* by showing how individual agents, acting according to specified micro-level rules (beliefs, preferences, decision heuristics) *within that given structural context*, produce the observed outcome.
      *   Crucially, **the origin and persistence of the macro-level structural feature itself is not explained** by the model; it is taken as a given input, despite being the type of collective phenomenon MI ostensibly requires to be reduced to individual-level explanations.
      *   The researcher simultaneously maintains that *only* individuals and their interactions are causally efficacious and ontologically real, denying autonomy to the structural feature they rely upon.

  2.  **Boundary Conditions:**
      *   **Not Mere Auxiliary Hypotheses:** Distinguish this from standard auxiliary hypotheses (e.g., "agents are rational," "information is costly"). Auxiliary hypotheses are general theoretical assumptions *not specific to the explanandum itself*. Here, the exogenous parameter is *directly constitutive* of the specific social context being studied and is often *empirically derived from* or *directly mirrors* the phenomenon being explained (e.g., calibrating the belief distribution *from* the observed clustering). It's not a general law or assumption but a specific, unexplained factual premise about the collective state.
      *   **Not Downward Causation:** As you note, there is no claim that the macro-structure *causes* micro-behaviour in a top-down manner (e.g., "society forces the individual to believe X"). The causal work is still located at the micro-level *within* the structure. The structure *enables* and *constrains* but isn't an active causal agent in the model's dynamics.
      *   **Not Crypto-Holism:** Crypto-holism implies a deliberate or covert *endorsement* of holistic entities (e.g., group minds, collective intentions). This pattern often involves researchers genuinely *rejecting* holism ontologically but failing to see how their *explanatory practice* relies on an unexplained holistic *fact* (the distribution/structure). It's less about hidden belief and more about an explanatory blind spot or pragmatic shortcut conflicting with stated ontology.
      *   **Requires Non-Trivial Structure:** The exogenous parameter must represent a significant collective feature (distribution, norm, institutional rule) central to the phenomenon, not just a simple environmental constant (like gravity).

  3.  **Relation to Methodological Individualism (MI):**
      *   **Inconsistent with Strict MI:** Strict, reductionist MI demands that *all* social facts, including structural distributions and institutional configurations, be *explained* as the outcome (intended or unintended) of individual actions and interactions. Treating a macro-structure as an unexplained exogenous input directly violates this core tenet. The structure is doing irreducible explanatory work by defining the "rules of the game" within which individuals act.
      *   **A Failure Mode/Omission, not Necessarily Fatal:** It represents a **failure to fully execute the MI programme** for the specific phenomenon in question. Proponents might argue it's merely a pragmatic starting point (studying individual behaviour *within* a structure first) and that explaining the structure's origin is a *separate* (though necessary) task. However, as you note, this often becomes a persistent omission, especially when the model's success *depends* on that specific structure and the structure itself is a complex social product needing explanation. It highlights the **practical difficulty of achieving complete reduction** for many social phenomena. It's "embarrassing" because it exposes the explanatory dependence on precisely the kind of collective fact MI aims to eliminate from fundamental explanations.
      *   **Adjacent to Structural Individualism:** Some versions of "structural individualism" (e.g., inspired by Weber, Coleman) *do* allow structures as explanatory factors *provided* they are *themselves* explained as the outcome of past individual actions (e.g., institutions as equilibria). The failure here is the **lack of that constitutive explanation for the structure in the model**. It's structural individualism without the constitutive step.

  4.  **Established Labels & Related Concepts (British English):**
      *   **Problematic Exogenous Parameterisation:** A common descriptive phrase highlighting the core methodological issue.
      *   **Explanatory Circularity (Contextual):** While not strictly logically circular (the structure explains the pattern, but the pattern isn't used to *explain the structure* in the same model), there is a *pragmatic circularity*: the collective fact (the structure/distribution) which is of the same ontological kind as the *explanandum* (the pattern) is presumed rather than explained. It risks being question-begging regarding the origins of social structure.
      *   **Unexplained Structural Dependence:** Emphasises the reliance on a structure whose own existence is not accounted for.
      *   **Constitutive Individualism's Incompleteness:** Framing it as a specific failure within the broader project of explaining how structures are constituted by individuals.
      *   **Jon Elster's Critique:** Elster frequently critiqued rational-choice theory for taking preferences *and crucially, the "opportunity set" (a structural constraint)* as exogenous, arguing this often smuggles in the explanation. Your observed pattern extends this critique to other forms of individualism relying on exogenous distributions.
      *   **Margaret Gilbert's "Plural Subjects":** While arguing *for* collective intentionality, Gilbert's critique of MI often points out how individualist accounts implicitly rely on shared understandings or structures that they cannot reduce.

  **Recommendation for Your Seminar:**

  *   Introduce it as the **Problem of the Unexplained Structural Parameter in Methodological Individualism** or **Structural Presupposition in Individualist Explanations**.
  *   Define it precisely using the points above.
  *   Contrast it clearly with:
      *   Strong Holism (group minds, downward causation).
      *   Crypto-holism (deliberate smuggling).
      *   Legitimate auxiliary hypotheses.
      *   Successful structural individualism (where the structure *is* constitutively explained).
  *   Use your "explanatory double-entry bookkeeping" analogy – it's very apt. The collective pattern appears as both the *output* (credit side) and the *essential input* (debit side) of the individualist ledger, but its *origin* (how it got onto the debit side) remains unaccounted for.
  *   Frame it as a significant **explanatory gap** revealing the **limits of reductionism** in practice, even for researchers committed to it in principle. It underscores the challenge of providing purely "bottom-up" explanations for phenomena deeply embedded in and shaped by pre-existing social structures that themselves demand explanation.

  This phenomenon is indeed widespread and deserves a spotlight in your seminar as a key point where the rubber of methodological individualism meets the road of complex social explanation – and sometimes skids.
