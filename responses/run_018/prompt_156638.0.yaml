  me and my freind argued for like an hour about whether philosophy actually helps scientists do science, not just talk about it. he kept throwing that ornithology line -- philosophy is to science what ornithology is to birds -- and then brought up Weinberg and Hawking like that ended the debate. I want that slogan torn apart into exactly five precise claims it could be making: maybe philosophers study science from outside with zero causal effect, maybe their methods are just mismatched to empirical work, maybe science already swallowed all useful philosophy, maybe philosophy is only immature science waiting to be replaced, or maybe its just good for historical context. for each one say if its tautological, actually defensible, or flat wrong, and tell me which version he was reaching for when he mentioned Weinberg complaining philosophers dont keep up with physics and Hawking declaring philosophy dead. also for each say whether it still leaves room for philosophy doing conceptual cleanup in quantum foundations or clarifying what a measurement actually is. number them 1 through 5, each just a sentence or two, no intro or conclusion, and dont cite any books or papers since i cant check them right now.
