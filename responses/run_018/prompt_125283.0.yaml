  Looking at BIID and prosopagnosia: both involve mismatches, but prosopagnosia is seen as a dysfunction while BIID isn't. The user might be influenced by whether the issue is cognitive (prosopagnosia) vs. identity-related (BIID), where identity is given more weight. The harm in BIID is subjective relief after surgery, which complicates things.

