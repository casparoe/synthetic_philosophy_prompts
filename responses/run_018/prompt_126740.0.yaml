  Interesting tension here. The user mentions modern Nyāya scholars proposing a fifth pramāṇa like pratibhā or saṃketa. That's a solid lead—I recall Bimal Krishna Matilal and Jonardon Ganeri discussing this. But before jumping to solutions, I should verify if they're misinterpreting śabda. 

