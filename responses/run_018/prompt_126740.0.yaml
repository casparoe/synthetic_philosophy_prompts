  Wait, but how does this bootstrap? The user's "chicken-and-egg" metaphor is spot-on. Maybe śabda + anumāna can work recursively: "I hear you say 'we follow rule X' → I infer you intend coordination → you infer my inference..." That mirrors common knowledge emergence! 

