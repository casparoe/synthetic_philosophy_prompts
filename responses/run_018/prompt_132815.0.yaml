answer: |-
  As a fellow traveller in the intricate terrain of constrained verse translation, your observation is acutely pertinent and resonates deeply with the often-unforeseen consequences of rigorous formal fidelity. While there isn't a single, universally established term that perfectly encapsulates *precisely* this phenomenon – the **unintentional reversal of an argument's logical priority due to syntactic reordering mandated by the preservation of rhyme, metre, and stanzaic form** – we can navigate the conceptual landscape and identify close relatives before proposing a precise delimitation.

  1.  **Established Concepts & Their Limitations:**
      *   **Translation Shifts (Toury, Catford):** This broad category encompasses obligatory and optional deviations. Your phenomenon is a specific *type* of shift, but "shift" is too general. It doesn't convey the *logical inversion* or the *systemic* nature arising from formal constraint interaction.
      *   **Formal Equivalence (Nida) vs. Dynamic Equivalence:** Your case exemplifies an extreme outcome of prioritising formal equivalence. However, these terms describe the *translator's strategy*, not the specific *result* of a logical inversion caused by syntactic linearity demands. Many formally equivalent translations don't suffer this specific reversal.
      *   **Compensation:** Translators often compensate for losses elsewhere. Your case *involves* compensation (e.g., shifting syntax to hit a rhyme), but the *result* is not merely a relocated effect; it's a fundamental reversal of the argument's core logic.
      *   **Hermeneutic Motion (Steiner):** While Steiner's model involves aggression and incorporation, the specific inversion you describe feels less like an interpretative *act* (though it is a consequence of choices) and more like an emergent *structural paradox* arising from conflicting systems.
      *   **Macro-Structural Distortion:** This is a broader term. Your phenomenon *is* a type of macro-structural distortion, but crucially, it's one *specifically generated by the successful micro-level implementation of formal constraints*. It's distortion *through* fidelity, not through negligence or deliberate alteration.
      *   **Intentional Hermeneutic Reinterpretation:** This is fundamentally different. What you describe is *unintentional* and *emergent* from the translation process itself, driven by linguistic necessity within the formal straitjacket, not by a conscious interpretative decision to alter the argument.

  2.  **Closest Approximations & Potential Neologisms:**
      *   **Systemic Argumentative Inversion:** This emphasises the *systemic* cause (the clash of prosodic system A with syntactic system B) and the *argumentative* consequence (inversion). It's descriptive but not yet established.
      *   **Emergent Logical Reversal:** Highlights that the reversal isn't present in any single choice but *emerges* from the global configuration necessitated by formal fidelity. Again, descriptive.
      *   **Prosodic Inversion:** Concise, but potentially ambiguous – does it mean inversion *of* prosody or inversion *caused by* prosodic demands? Your case is the latter.
      *   **Constraint-Induced Paradox:** Broad, but captures the core irony: fidelity to form creating infidelity to meaning/argument.
      *   **The Formalist Paradox (in Translation):** More evocative, linking it to the inherent tensions explored in Formalist poetics when applied across languages. This has potential as a coinage.
      *   **Hermeneutic Recomposition (under Constraint):** Suggests the meaning is unintentionally "recomposed" (into its opposite) by the process of fitting the formal mould.

  3.  **Delimiting the Phenomenon:**
      Given the lack of a perfect established term, defining the phenomenon rigorously is essential. I propose delimiting it through these characteristics:
      *   **Primary Driver:** The inversion *must* arise directly from the translator's commitment to preserving specific, structurally load-bearing formal features (rhyme scheme, metrical pattern, stanzaic shape) in the target language.
      *   **Syntactic Necessity:** The syntactic reordering causing the inversion *must* be demonstrably necessary (or perceived as highly preferable) within the target language's grammar and idiom to achieve the preserved formal features *at the required points* (e.g., hitting the rhyme word, maintaining metre, closing the stanza correctly).
      *   **Local Justifiability:** Each individual lexical and syntactic choice within the translated lines *must* be defensible as a plausible rendering of the source text's meaning at that specific point. There is no *local* "mistake" in the conventional sense.
      *   **Global Reversal:** The *overall logical argument*, *causal sequence*, or *conditional relationship* presented by the translated poem must be demonstrably the *opposite* of, or fundamentally contradictory to, the source poem's argument, as a direct result of the syntactical shifts mandated by point 2.
      *   **Unintentional Consequence:** The reversal is an *unintended outcome* of the formal fidelity strategy, not a deliberate interpretative choice or adaptation. The translator aimed for faithfulness but the systemic interaction produced perversion.

  4.  **Distinguishing from Related Concepts:**
      *   **Plain Mistranslation:** Involves demonstrable *local* errors in lexicon, grammar, or basic meaning. Your phenomenon has locally justifiable choices.
      *   **Deliberate Adaptation/Reinterpretation:** Involves a conscious choice to alter meaning or argument for artistic, ideological, or contextual reasons. Your phenomenon is an unintended systemic consequence.
      *   **General Macro-Structural Distortion:** Could include changes to narrative order, omission of stanzas, or thematic emphasis shifts *not* primarily driven by the *interaction* of formal constraints and syntactic linearity. Your phenomenon is specifically caused by *that* interaction.
      *   **Ordinary Syntactic Shift:** Minor reordering for fluency that doesn't alter the fundamental logical priority or argument of the poem. Your phenomenon involves shifts that *do* invert this core logic.

  **Conclusion:**

  While established terms touch upon aspects (Systemic Shift under Formal Equivalence, a severe type of Compensatory Distortion), none perfectly capture the *specific paradox* you identify: **logical inversion as the direct, unintended, and emergent consequence of successfully replicating constraining formal features, where every local choice is justifiable but the global argument is reversed.**

  To articulate this in your work, I recommend:
  1.  **Define it descriptively** using the delimitation above (e.g., "systemic argumentative inversion under formal constraint," "emergent logical reversal through prosodic fidelity").
  2.  **Contextualise it** within Translation Shifts (Toury) and the tensions of Formal Equivalence (Nida).
  3.  **Contrast it clearly** with mistranslation, deliberate adaptation, and general macro-distortion.
  4.  **Consider coining a term** if it becomes central to your thesis – **"The Formal Constraint Paradox"** or **"Prosodic-Grammatical Inversion"** have merit, provided you define them rigorously as above. **"Hermeneutic Recomposition under Formal Duress"** also captures the unintended meaning reformulation.

  This phenomenon sits precisely at the crux where the admirable ambition of formal fidelity collides with the profound differences in how languages build logical argumentation through syntax, revealing a fascinating and often troubling limit-case in the poetics of constrained translation. Your identification of it is a significant contribution to articulating the hidden costs of prosodic homage.
