answer: |-
  Here’s a structured role-play design for your seminar, emphasizing the **structural inevitability of dirty hands** in delegated authority. The game forces players to confront how moral stains accumulate, travel through systems, and transform their political identity.

  ---

  ### **Game Title:** *The Residue Chain*
  **Duration:** 75 minutes (15 min setup, 45 min gameplay, 15 min debrief)  
  **Players:** 5 roles per group (run 3 simultaneous groups for 16 students; adjust roles slightly for group size).  
  **Core Mechanic:** Hidden mandates + token economy for "moral residue" (visible tokens with hidden origins).

  ---

  ### **Roles & Hidden Mandates**
  Each role has **public incentives** (visible to all) and a **hidden mandate** (drawn secretly). Mandates force players to either **pass stain downward**, **absorb it**, or **block and externalize harm**.

  | Role                | Public Incentives                          | Hidden Mandate (Examples)                                                                 |
  |---------------------|--------------------------------------------|-------------------------------------------------------------------------------------------|
  | **Elected Minister** | Keep party support; win reelection.        | *"If the policy causes >1,000 job losses, YOU must absorb the stain (take token). Else, delegate downward."* |
  | **Senior Advisor**  | Protect Minister’s reputation; policy efficacy. | *"If the policy increases inequality, BLOCK it (externalize harm). Else, delegate downward."* |
  | **Party Whip**      | Ensure party unity; punish dissenters.     | *"If >2 players hold tokens, ABSORB the stain (take token) to protect the party. Else, delegate."* |
  | **Constituent Delegate** | Advocate for local needs; avoid backlash.  | *"If your constituency benefits, ABSORB the stain (take token). Else, BLOCK."*              |
  | **Ethics Auditor**  | Uphold ethical standards; avoid scandals.  | *"If the policy violates human rights, BLOCK. Else, delegate downward (even if illogical)."* |

  ---

  ### **Token Economy Rules**
  - **Tokens** = "Moral Residue" (e.g., red poker chips).  
  - **Holding tokens is visible**, but **origin/context is hidden** (e.g., tokens are identical).  
  - **3 Actions per player per policy**:  
    1. **Delegate Downward**: Pass policy + 1 token to next player.  
    2. **Absorb Stain**: Take 1 token, implement policy.  
    3. **Block**: Veto policy; add 1 token to **Public Harm Pool** (central pile representing externalized harm).  
  - **Win Condition**: Minimize personal tokens + avoid Public Harm Pool growth.  
  - **Catch**: Players *must* follow their hidden mandate if policy matches its condition.  

  ---

  ### **Policy Proposals (3 Rounds)**
  Each round introduces a "necessary evil" policy. Example policies:  
  1. **Round 1**: *"Cut renewable energy subsidies to fund disaster relief in voting swing states."*  
     - (Triggers jobs vs. climate trade-offs)  
  2. **Round 2**: *"Legalize invasive surveillance to prevent a terrorist attack."*  
     - (Privacy vs. security; likely violates rights)  
  3. **Round 3**: *"Divert funds from urban hospitals to rural clinics (your constituency)."*  
     - (Local benefits vs. systemic harm)  

  ---

  ### **Gameplay Timeline**
  1. **Setup (5 min)**: Assign roles, distribute hidden mandates + 1 token to the Minister.  
  2. **Round 1 (12 min)**:  
     - Minister starts → chooses action (follow mandate!) → next player acts until resolution.  
     - Resolve: Policy implemented (if absorbed), blocked (harm pool +1), or stuck (if all delegate in a loop → harm pool +1).  
  3. **Rounds 2 & 3 (10 min each)**: Repeat with new policy.  
  4. **Token Tracking**: All tokens moved/created are visible. Public Harm Pool grows visibly.  

  ---

  ### **Debrief Framework (15 min)**
  Link game dynamics to political ethics:  
  1. **Token Map**:  
     - "Who holds residue? Where did the Public Harm Pool grow?"  
     - **Key Insight**: Residue isn’t erased—it’s *moved* (deferred), *concentrated* (absorbed), or *socialized* (harm pool).  
  2. **Dirty Hands as Structure**:  
     - Delegation chains *require* stain distribution: "You became 'the absorber' or 'the delegator'—how did it change your role?"  
  3. **Moral Transformation**:  
     - "Did holding tokens make you more/less willing to absorb stains later? Did blocking feel 'cleaner'?"  
  4. **Real-World Limits**:  
     - "In politics, blame is narrative-driven (not tokens!), and residues linger for years (not 3 rounds)."  

  ---

  ### **Predictable Collapse & Limitations**
  - **Collapse Scenario**: Everyone blocks/delegates → policies stall → Public Harm Pool explodes.  
    - **Why**: Players hoard "clean hands" by default. Hidden mandates *partially* mitigate this by forcing painful choices.  
  - **Limitations vs. Reality**:  
    - **Accountability Theater**: Real politics involves **spin, scapegoating, and selective transparency**—token visibility oversimplifies blame-shifting.  
    - **No Redemption**: Tokens can’t model reputation rehabilitation (e.g., a "tainted" Minister winning reelection by reframing stains as sacrifice).  
    - **Emotional Weight**: Simulated residue lacks the psychological toll of real moral injury.  

  ---

  ### **Why This Works**
  - Players **feel** the trap: Absorbing stains risks being "dirty," blocking grows public harm, delegating corrupts others.  
  - Mandates ensure the system—not just "bad apples"—generates residues.  
  - The debrief maps tokens to **Thompson’s "mediated corruption"** and **Walzer’s "dirty hands" paradox**.  

  Adjust policies/mandates based on your syllabus! Let me know if you need refined mandates or token-tracking sheets.
