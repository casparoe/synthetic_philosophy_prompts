  Here's a joke weaving those specific tensions together:

  **A NIMBY, a YIMBY, and Henri Lefebvre walk into a community zoning meeting...**

  The NIMBY stands up, clutching architectural renderings like sacred texts: "This proposed 6-story building violates our neighborhood's *essential character*! My property values aren't just numbers; they represent the *aesthetic entitlement* I purchased along with my deed. This view, this quiet, this specific shade of beige on the Victorians – it’s my *right*! Density is habitat vandalism!"

  The YIMBY counters, waving supply-demand curves: "Character isn't a privately held easement! Your 'aesthetic entitlement' is artificially inflating prices and displacing everyone! We need to *unlock* this land's economic potential. More units mean cheaper rents – it's basic market efficiency! Stop treating the city like your private sculpture garden and let the market optimize our habitat!"

  Suddenly, Lefebvre clears his throat, materializing from a plume of Gauloise smoke: "*Mon dieu!* You both reduce the urban to *le marché* – one as private décor, the other as commodity flow! You mistake the *habitat* (the physical shell, the zoning map, the property lines you fetishize) for *l'habiter* (the living, collective act of inhabiting!)"

  He gestures wildly at the plans. "The right to the city isn't your individual deed guaranteeing perpetual beige vistas, *madame* NIMBY! Nor is it merely achieving market equilibrium through efficient land commodification, *monsieur* YIMBY!"

  "The right," Lefebvre booms, "is the collective power to *produce* urban space! To co-author the drama of the street, the rhythm of the square! Not preserving your private habitat-museum, nor efficiently trading habitat-units! This meeting?" He points around the room. "*This* is where inhabiting should happen! Where neighbors debate *how* to build their collective life, not *whether* to freeze it or auction it!"

  The NIMBY and YIMBY stare, bewildered. The NIMBY whispers, "But... my sightlines?" The YIMBY mutters, "But... the vacancy rate?" Lefebvre just sighs, stubs out his spectral cigarette on the zoning map, and vanishes, leaving behind only the faint scent of existential urban critique and the distinct impression that both sides were talking about *owning* or *trading* the stage, while completely missing the point of the play itself.

  **Why it works with the requested tensions:**

  1.  **NIMBY as Private Aesthetic Entitlement:** The NIMBY explicitly frames "character" (view, quiet, specific architecture) as an "aesthetic entitlement" purchased with the deed, treating the neighborhood like private property and habitat as a static museum piece ("habitat vandalism").
  2.  **YIMBY as Market Efficiency:** The YIMBY counters *only* with supply/demand logic, "unlocking economic potential," "market efficiency," and viewing land/housing purely as commodities ("habitat-units"). They reduce the solution to market optimization.
  3.  **Lefebvre's Collective, Non-Proprietary Right:** Lefebvre directly calls out both for reducing the city to the market ("*le marché*"). He contrasts "habitat" (physical, owned, zoned) with "l'habiter" (the lived, social practice). He defines the right to the city as the collective power to *produce* urban space, emphasizing participation ("co-author," "debate *how* to build") over individual property rights *or* commodification.
  4.  **Conceptual Tension Turn:** The punchline/humor *turns* on Lefebvre dismissing both arguments as missing the core point of collective production ("talking about *owning* or *trading* the stage, while completely missing the point of the play itself"). The NIMBY and YIMBY are left confused by a framework that transcends their proprietary/market logics.
  5.  **Specificity:** Uses Lefebvre's specific terms ("habitat" vs. "inhabiting/l'habiter"), the economic argument ("supply-demand," "vacancy rate"), and NIMBY tropes ("character," "property values") without being generic about "hating apartments."
  6.  **Coherence:** The community meeting setting is the perfect microcosm for this clash. Lefebvre's intervention directly addresses the core philosophical distinction requested.

  The humor comes from the absurdity of the hyper-rational YIMBY and the hyper-possessive NIMBY both being blindsided by a third perspective that fundamentally challenges the *framing* of their entire debate, highlighting the specific conceptual tension between proprietary/market logics and the collective, anti-commodified "right to the city."
