prompt: |-
  In a quantum foundations seminar last week someone waved away teh PBR result by saying "the wavefunction is just information, not reality." I'm trying to figure out exaclty what work that sentence was doing. Can you lay out the different precise claims it could be making — e.g. Shannon-information about preparation procedures, a Bayesian credence, a Spekkens-style epistemic restriction over hidden variables, or just a refusal of metaphysical commitment — and for each say whether it's trivial, whether it's actually incompatible with psi-ontic models, and whether it survives the PBR argument? Don't just catalog them; take a committed position on which reading is strongest, which ones are empty, and which one actually supports dismissing PBR. End with \answer{...} giving the single reading you'd defend.
reasoning: |-
  Okay, the user is asking about the statement "the wavefunction is just information, not reality," specifically in the context of dismissing the PBR theorem. They want a breakdown of different precise interpretations of that statement, including whether each is trivial, incompatible with psi-ontic models, and survives PBR. They also want me to take a committed position on which reading is strongest and which actually supports dismissing PBR.

  First, I need to recall what the PBR theorem is. It's a result in quantum foundations that aims to show that the wavefunction must be ontic, not epistemic. The theorem assumes that quantum states are prepared independently and that there's no overlap in the underlying physical states for distinct quantum states. If wavefunctions were just epistemic, meaning they represent knowledge about some hidden reality, then for non-orthogonal states, there should be some overlap in the underlying ontic states. PBR shows a contradiction when you consider multiple systems prepared independently.

  The user mentioned several interpretations: Shannon-information about preparation, Bayesian credence, Spekkens-style epistemic restriction, and refusal of metaphysical commitment. I need to address each.

  Starting with Shannon-information: if the wavefunction represents information about the preparation procedure, that's trivial. Any description of a state involves preparation info. But this doesn't conflict with psi-ontic models where the wavefunction is real. PBR doesn't touch this because it's about how we describe states, not their reality. So this reading doesn't help dismiss PBR.

  Next, Bayesian credence. This is subjective probability. QBism falls here, where the wavefunction is a personal belief. QBists reject the ontological models framework that PBR relies on. They don't assume an underlying ontic state, so PBR's assumptions don't apply. Thus, this view can dismiss PBR by denying its premises. This seems like a strong candidate for surviving PBR.

  Then, Spekkens-style. This is an epistemic model with constraints, like in toy models. PBR directly targets such views by showing that if you assume preparation independence, distinct quantum states can't share ontic states. Spekkens' model has overlap, but PBR proves such overlap leads to contradiction in composite systems. So this interpretation is incompatible with PBR and doesn't survive. The user might be conflating this with other epistemic views, but Spekkens-style specifically is ruled out.

  Refusal of metaphysical commitment is operationalism. Here, the wavefunction is just a tool for predictions. This avoids ontological commitments altogether. PBR's conclusion about ontology is irrelevant because they don't engage with it. This view survives PBR by ignoring the metaphysical question. However, it might be seen as avoiding the issue rather than addressing it.

  Now, which reading is strongest? Shannon-information is too weak; it's trivial. Spekkens-style is ruled out by PBR. Refusal of commitment survives but doesn't engage. Bayesian (QBism) actively dismisses PBR by rejecting its framework. So QBism seems the strongest for dismissing PBR.

  The user wants a single defended reading. I think Bayesian/subjective interpretation is the one that effectively dismisses PBR because it denies the premises of the ontological models framework. The other readings either don't conflict, are invalidated, or avoid the issue. So the answer should be the Bayesian credence view, as it provides a coherent basis to reject PBR's implications.
answer: |-
  The statement "the wavefunction is just information, not reality" aims to reject the PBR theorem's conclusion that the wavefunction must be *ontic* (a direct representation of reality). However, its meaning and validity depend entirely on the *specific interpretation* of "information." Below, I dissect four precise readings of this claim, evaluate their substance, compatibility with psi-ontic models, and resilience against PBR. I conclude with my defended position.

  ### 1. **Shannon-information about preparation procedures**  
     - **Claim**: The wavefunction encodes *objective, classical information* about how a system was prepared (e.g., "this system passed through a Stern-Gerlach magnet oriented at angle θ").  
     - **Trivial?**: Yes. This is true for *all* interpretations—even psi-ontic models acknowledge the wavefunction carries preparation information.  
     - **Incompatible with psi-ontic?**: No. Psi-ontic models readily accept this (e.g., in Bohmian mechanics, the wavefunction is physical *and* informs preparation).  
     - **Survives PBR?**: Irrelevant. PBR targets whether the wavefunction corresponds to a physical state *beyond* preparation data. This reading doesn't engage with ontology.  
     - **Verdict**: Vacuous as a rebuttal. It misses PBR's core argument.

  ### 2. **Bayesian credence (e.g., QBism)**  
     - **Claim**: The wavefunction represents an agent's *subjective belief* about future measurement outcomes (a personalist Bayesian probability).  
     - **Trivial?**: No. This is a substantive anti-realist position denying that quantum states describe mind-independent reality.  
     - **Incompatible with psi-ontic?**: Yes. It explicitly rejects the existence of an underlying ontic state described by the wavefunction.  
     - **Survives PBR?**: Yes. QBists reject PBR's **preparation independence postulate** (PIP)—the assumption that independently prepared systems have uncorrelated ontic states. For QBism, "independent preparations" reflect the agent's subjective ignorance, not physical separability. PBR assumes an objective ontic state space, which QBism denies.  
     - **Verdict**: A strong, coherent dismissal of PBR. It voids the theorem by rejecting its foundational premise.

  ### 3. **Spekkens-style epistemic restriction over hidden variables**  
     - **Claim**: The wavefunction describes *incomplete knowledge* of an underlying ontic state (hidden variables), with fundamental restrictions on what can be known (e.g., toy models with epistemic states).  
     - **Trivial?**: No. This is a precise epistemic framework with ontological commitments.  
     - **Incompatible with psi-ontic?**: Yes. It asserts that distinct wavefunctions can describe the *same* ontic state (ψ-epistemic models).  
     - **Survives PBR?**: **No.** PBR directly targets this view. It proves that if PIP holds, distinct quantum states *cannot* share overlapping ontic states. Spekkens' models (e.g., for single qubits) allow such overlap, but PBR shows this fails for composite systems. Preparation independence implies a contradiction, so this reading is refuted by PBR.  
     - **Verdict**: The weakest reading—PBR was designed to kill it. Using this to dismiss PBR is self-defeating.

  ### 4. **Operational refusal of metaphysical commitment**  
     - **Claim**: The wavefunction is merely a tool for predicting measurement outcomes; questions of "reality" are unanswerable or meaningless (e.g., Copenhagen-inspired instrumentalism).  
     - **Trivial?**: No. This is a philosophical stance rejecting realism.  
     - **Incompatible with psi-ontic?**: Only pragmatically. It avoids ontology entirely, so it neither affirms nor denies psi-onticism.  
     - **Survives PBR?**: Yes, by evasion. PBR assumes an ontological models framework; instrumentalists reject this framework as ill-posed. They see PBR as a "category error"—like debating the reality of a coordinate system.  
     - **Verdict**: Survives PBR but is philosophically unsatisfying. It dismisses PBR by ignoring ontology, not engaging it.

  ---

  ### Committed Position  
  The strongest reading for **dismissing PBR** is **Bayesian credence (QBism)**. It actively rebuts PBR's premises while offering a consistent, non-realist interpretation. QBism's rejection of preparation independence is principled and shields it from the theorem. In contrast:  
  - *Shannon-information* is too weak to address PBR.  
  - *Spekkens-style* models are demolished by PBR.  
  - *Operationalism* survives only by refusing the game—a defensible but deflationary move.  

  The weakest reading is **Spekkens-style epistemicism**, as PBR devastates it. Calling this "information" post-PBR is untenable without abandoning PIP—a move that undermines standard quantum mechanics.  

  Ultimately, the Bayesian view provides the most robust shield: it repurposes "information" as *subjective belief*, making PBR's ontic conclusions irrelevant. If the seminar speaker meant this, their dismissal holds. If they meant Spekkens-style, they misunderstood PBR.  

  \answer{Bayesian credence (QBism)}
