  5. There is a distinction between:
     a) Risk: situations where we can assign known probabilities to outcomes (even if imprecise).
     b) Deep uncertainty: situations where we cannot assign probabilities, either because the space of outcomes is unknown, the probabilities are incommensurable, or we lack any basis for assigning probabilities.
  6. In deep uncertainty, standard expected value calculations are impossible because they require probability distributions.

  Now, we must phrase these so that both camps agree and they are not vacuous.

