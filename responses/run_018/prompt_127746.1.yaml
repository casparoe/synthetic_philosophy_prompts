answer: |-
  ### Joint Statement on Consequentialist Cluelessness  
  **Parties**: Bounded-Consequentialist Camp (Camp A) and Structural-Skeptic Camp (Camp B)  

  This document represents a collaborative effort to clarify agreements and disagreements regarding the problem of "cluelessness" in long-run consequentialist ethics. Cluelessness denotes the challenge of evaluating actions when their long-term consequences are radically uncertain. Both camps agree that this problem poses significant difficulties for consequentialist decision-making but diverge on whether it can be resolved within the consequentialist framework.  

  ---

  #### A. Agreed Claims  
  The following claims are accepted by both camps as non-vacuous and retraction-free. They describe shared ground on formal, empirical, and normative aspects of consequentialist evaluation:  

  1. **Formal Structure of Consequentialism**: Consequentialist evaluation requires ranking actions by the expected moral value of their outcomes, where moral value is determined solely by the welfare of moral patients.  
  2. **Definition of Moral Patienthood**: Moral patients are entities that can experience well-being or suffering (e.g., sentient beings), and their welfare has intrinsic moral weight.  
  3. **Predictive Limitations**: Human agents lack the capacity to reliably predict causal chains over long timescales (e.g., centuries) or in complex systems (e.g., global socio-ecological systems), due to computational and empirical constraints.  
  4. **Causal-Modeling Boundaries**: Our ability to construct accurate causal models is bounded; models frequently fail for systems with high sensitivity to initial conditions, nonlinear dynamics, or feedback loops.  
  5. **Risk vs. Deep Uncertainty**:  
     - *Risk*: Outcomes have known (or estimable) probability distributions.  
     - *Deep Uncertainty*: Outcomes lack known probabilities, unrepresentable distributions, or incomparable outcome spaces.  
  6. **Domain Heterogeneity**: Decision contexts vary in predictability; effects may be bounded (near-term, spatially local, measurable) or unbounded (long-term, diffuse, structurally uncertain).  
  7. **Epistemic Opacity**: Deep uncertainty is pervasive in decisions affecting the long-term future, and it cannot be eliminated by acquiring more empirical data alone.  

  ---

  #### B. Disagreements Table  
  The table below catalogs core disagreements. "Substantive" disputes reflect incompatible positions; "verbal" disputes arise from term usage without underlying conflict.  

  | Crux ID | Issue in Neutral Wording                                                                 | Camp A (Bounded-Consequentialist) Formulation                                                                                             | Camp B (Structural-Skeptic) Formulation                                                                                                    | Verdict       |
  |---------|------------------------------------------------------------------------------------------|-------------------------------------------------------------------------------------------------------------------------------------------|--------------------------------------------------------------------------------------------------------------------------------------------|---------------|
  | C1      | Can second-order methods support normative prescriptions under deep uncertainty?         | Agents can use robustness rules (e.g., minmax regret), epistemic discounting, and option value to preserve normative authority without omniscience. | Second-order methods collapse into arbitrariness under deep uncertainty; they cannot generate normatively binding prescriptions.             | Substantive   |
  | C2      | Is cluelessness a remediable epistemic gap or a structural flaw?                         | Cluelessness is an epistemic limitation that bounded rational agents can mitigate through domain-restricted evaluation and error tolerance. | Cluelessness is structural; it arises from irreducible incommensurabilities in cross-domain comparisons, undermining first-order evaluation. | Substantive   |
  | C3      | Can non-arbitrary weighting functions compare ontologically diverse outcomes?            | Non-arbitrary weights for outcomes (e.g., welfare across timescales or moral-patient categories) are constructible via bounded heuristics. | Non-arbitrary weighting is impossible; comparisons require arbitrary choices due to ontological heterogeneity.                              | Substantive   |

  ---

  #### C. Substantive Crux Tests  
  For each substantive crux, a test case is provided. Both camps agree the case bears on the crux but predict divergent outcomes.  

  **Crux C1: Feasibility of Second-Order Methods**  
  - **Sub-Question**: Can robustness rules (e.g., minmax regret) yield a non-arbitrary, consequentialist-prescriptive outcome in a choice between bounded-risk and deeply uncertain interventions?  
  - **Test Case**:  
    - *Option 1 (Bounded)*: Fund a near-term malaria-prevention program. Effects: Saves 1,000 lives (95% CI: 900–1,100) within 5 years. No effects beyond 10 years.  
    - *Option 2 (Deeply Uncertain)*: Fund research on a speculative technology to prevent existential risks (e.g., AI misalignment). Effects: If successful, averts catastrophe affecting >1 billion future lives; success probability and magnitude are unquantifiable (no basis for probabilities).  
    - *Decision Structure*: Fixed budget; mutual exclusivity; Option 1 has known welfare distribution; Option 2 has unknown outcome space and no probabilistic model.  
  - **Camp A Prediction**: Applying minmax regret to a set of plausible models for Option 2 (e.g., low/medium/high impact) permits a non-arbitrary choice (e.g., Option 2 minimizes worst-case regret).  
  - **Camp B Prediction**: No non-arbitrary choice is possible; Option 2’s deep uncertainty makes all model sets arbitrary, reducing "robustness" to guesswork.  

  **Crux C2: Nature of Cluelessness**  
  - **Sub-Question**: Does deep uncertainty in intergenerational trade-offs admit epistemic mitigation?  
  - **Test Case**:  
    - *Option A (Bounded)*: Build climate-resilient infrastructure. Effects: Benefits 10 million people for 100 years; no effects beyond 150 years.  
    - *Option B (Deeply Uncertain)*: Promote a cultural norm of long-term altruism. Effects: May increase civilizational resilience for >1,000 years via diffuse behavioral cascades; magnitude and sign of effects are unmodelable.  
    - *Decision Structure*: Options mutually exclusive; Option A has measurable welfare gains; Option B has no defined outcome distribution.  
  - **Camp A Prediction**: Epistemic discounting (e.g., penalizing Option B’s uncertainty) enables a bounded-consequentialist ranking (e.g., Option A preferred under uncertainty thresholds).  
  - **Camp B Prediction**: The uncertainty is structural; discounting relies on arbitrary parameters, failing to resolve incommensurability between near-term and long-term welfare.  

  **Crux C3: Non-Arbitrary Weighting**  
  - **Sub-Question**: Can weights for welfare comparisons across ontological categories (e.g., humans vs. digital minds) be non-arbitrarily defined?  
  - **Test Case**:  
    - *Option X (Measurable)*: Improve healthcare access for 100,000 current humans (welfare gain: 50,000 DALYs averted).  
    - *Option Y (Ontologically Uncertain)*: Fund ethical AI development to ensure welfare of potential digital minds. Effects: If digital minds arise, may confer vast welfare; probability of emergence and mind welfare metrics are incommensurable with human DALYs.  
    - *Decision Structure*: Fixed resources; Option X has known welfare; Option Y’s outcomes lack a comparable unit.  
  - **Camp A Prediction**: Constructing weights via sensitivity analysis over plausible exchange rates (e.g., 1 digital mind welfare-unit = X human DALYs) permits non-arbitrary comparison.  
  - **Camp B Prediction**: Exchange rates are arbitrary; ontological divergence precludes non-arbitrary weighting, voiding consequentialist evaluation.  

  ---

  #### D. Verbal Dispute Diagnosis  
  No purely verbal disagreements exist. Key terms (e.g., "robustness," "normative authority," "cluelessness") are used with consistent technical meanings:  
  - *Robustness*: Camp A defines it as *stability of a decision rule under a plausible model set*; Camp B accepts this but disputes whether "plausible" is non-arbitrary.  
  - *Normative authority*: Both camps define it as *the capacity to generate prescriptive "ought" judgments* but disagree on whether it survives deep uncertainty.  
  - *Cluelessness*: Both use it to denote *radical uncertainty about long-run consequences*.  
  Resolving terminological divergences would not eliminate conflicts; residual disputes are substantive (e.g., whether robustness rules avoid arbitrariness).  

  ---

