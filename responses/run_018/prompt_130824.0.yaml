prompt: |-
  Write a parody of formal institutional ethics-committee meeting minutes—approximately 600 words, in the deadpan bureaucratic voice of a university review board—recording the deliberation over a proposed "Graduated Moral Status Protocol" that assigns precise ethical weights to entities along a continuous sentience spectrum, from cognitively typical adult humans through nematodes to domestic thermostats. The satire should target the conceptual extension of treating moral status as strictly scalar rather than categorical: the committee must debate, with complete procedural seriousness, how to calibrate direct obligations when an entity scores 0.73 versus 0.71 on the protocol's index; address the "thermostat problem," in which adaptive climate control is analyzed as a minimal form of preference satisfaction worthy of non-zero weight; and resolve disputes about insect aggregation, asking whether a hive's distributed information processing raises the collective moral score above the sum of its members. The humor should arise from applying rigorous philosophical distinctions—degrees of phenomenal consciousness, informational integration, preference autonomy—to entities where the distinctions become patently absurd, without ever breaking the bureaucratic tone or winking at the reader. Include at least one invented but philosophically coherent technical term—such as a specific metric for "marginal phenomenological density"—that sounds as though it belongs in the philosophy-of-mind literature but is original to the piece, and have the committee cite this metric in its final recommendation. The document should remain readable to someone unfamiliar with the philosophy of mind, yet it should reward readers who recognize the underlying debates about gradualism, moral patienthood, and the boundaries of sentience. Do not include bibliographies, citations, or references to specific published works; the conceptual architecture should stand on its own.
