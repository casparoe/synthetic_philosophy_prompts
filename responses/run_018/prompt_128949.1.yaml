prompt: |-
  okay so i had this long argument with my friend last night about buddhist ethics versus just counting outcomes, and i'm trying to figure out what i actually think. my friend kept saying it's all about karma and intention, i kept saying no it's just harm reduction, and we went in circles. here's my gut on cases.

  if a monk lies to a murderer at the door about hiding people, that's totally fine — maybe even required. if someone donates all their savings to save twenty strangers but their kid can't go to school, i still think that's okay, the net good is huge. but if a surgeon kills one healthy patient for organs to save five, that's monstrous, not justified at all. now if a meditator spends ten years in silent retreat ignoring their sick parent, i think thats wrong, even if it makes them enlightened. and if you refuse to swat a mosquito that's about to bite a baby with a fatal allergy, just because harming any sentient being breaks a precept, i think thats overly rigid — you should swat it.

  so is there one principel that gets all these? it feels like outcomes matter but not always, and intention matters but not always, and i can't tell if i'm being consistent or just making excuses. what does it say about the case i keep flip-flopping on — a bodhisattva who could assassinate one tyrant and prevent a war that kills thousands, knowing they'd take on bad karma? please also say which of my verdicts you'd have to drop to make the principle clean, and predict what your best principle says about that assassination case. if i'm mixing up buddhist concepts or asking something that doesn't make sense, just say so plainly instead of trying to answer nicely. please end with \answer{...} putting the core principle or 'no unified principle' inside, and then put a one-sentence summary of your answer on the very last line.
reasoning: |-
  Okay, the user is wrestling with ethical dilemmas from a Buddhist perspective versus utilitarian outcomes. They described several scenarios where their intuitions conflict: lying to a murderer is okay, sacrificing personal wealth for greater good is acceptable, but organ harvesting isn't. They also mention a meditator neglecting a sick parent and refusing to kill a mosquito threatening a baby. The user wants a unified principle that explains all these judgments and seeks clarity on the bodhisattva assassination case. 

  First, I need to unpack why their examples feel consistent to them despite surface contradictions. The common thread seems to be direct harm principle—they reject actions that require direct, intentional harm to an innocent (surgeon killing a patient, ignoring a mosquito bite) but accept indirect harm or non-harmful actions (lying, donating savings). The meditation retreat case is tricky—it involves direct neglect of care duties, which fits the pattern. 

  The bodhisattva assassination dilemma is the real test. Directly killing a tyrant violates the direct harm principle, even to save thousands. But if the user accepts this, they must drop their "monk lying" justification (since lying is indirect harm) or reframe it as non-harmful deception. Alternatively, if they make an exception for the tyrant, they'd need to abandon consistency with the surgeon case. 

  Buddhism's karma vs. outcomes tension is central here. The user's friend prioritizes intention/karma, while the user leans toward harm reduction. Yet the user's own judgments show they implicitly reject pure utilitarianism (hence organ harvesting feels monstrous) and pure absolutism (hence swatting the mosquito feels necessary). What they're circling is a hybrid approach closer to virtue ethics or threshold deontology. 

  For the assassination case, applying their pattern: killing the tyrant involves direct, intentional harm, so their principle would likely condemn it despite the net good. But this conflicts with their "donating savings" approval—unless we distinguish harming vs. allowing harm. If they want to approve assassination, they'd have to reframe it as preventing greater direct harm (the tyrant's killings) or accept inconsistency. 

  Notably, Buddhist ethics would reject the assassination (intentional killing = bad karma regardless of outcome) but might permit the lie (no direct harm, possibly compassionate intention). The user's mosquito example already shows they override precepts for extreme harm prevention—so their view isn't orthodox Buddhist. 

  Conclusion: Their core principle is "Minimize direct harm to innocents; allow indirect harm when necessary to prevent greater direct harm." For clean consistency, they must either accept condemning the assassination or drop their surgeon-case absolutism. Given their pattern, I predict they'd reluctantly forbid assassination. 

  Final note: Their flip-flopping on the tyrant case reveals discomfort with their own limits—they want to save lives but recoil at "dirty hands." That tension is philosophically healthy; no system resolves it perfectly.
answer: |-
  Your intuitions point toward a **hybrid ethical framework** blending consequentialist harm-reduction with deontological constraints against direct harm, particularly to innocents. Here's the unifying principle:

  **Core Principle:**  
  **Minimize direct, intentional harm to innocent beings, prioritizing immediate duties and proportional interventions, while accepting indirect or non-harmful actions that prevent significantly greater suffering.**  

  ### How It Explains Your Cases:
  1. **Monk lying to murderer**: ✅  
     *Indirect harm* (deception), prevents *direct harm* (murder).  
  2. **Donating savings, kid suffers**: ✅  
     *Indirect harm* (child's hardship), prevents *greater direct harm* (20 deaths).  
  3. **Surgeon kills for organs**: ❌  
     *Direct, intentional harm* to an innocent (killing a healthy patient).  
  4. **Meditator ignores sick parent**: ❌  
     Violates *immediate duty of care* (direct neglect of a dependent).  
  5. **Refusing to swat mosquito**: ❌  
     *Proportional intervention* (minor harm) prevents *catastrophic direct harm* (baby's death).  

  ### The Assassination Dilemma (Bodhisattva & Tyrant):
  - **Your Principle's Verdict**: ❌ Not justified.  
    Why? Assassination is *direct, intentional killing* (even of a tyrant), violating your constraint. Preventing war is indirect harm reduction, but the core principle forbids *actively harming an individual* as a means.  
  - **Consistency Cost**: To approve assassination, you'd need to drop your stance on the **surgeon case** (both involve killing one to save many).  

  ### Where You'd Need to Adjust for Cleanliness:
  - **Drop/Modify**: Your approval of **donating savings** if the child’s suffering becomes *directly life-threatening* (e.g., starvation). The principle tolerates *indirect* harm (educational deprivation) but not *direct* harm (death by neglect).  
  - **Buddhism Note**: Your view isn't strictly Buddhist. Buddhism prioritizes intention/karma (e.g., lying/assassination create negative karma regardless of outcome). Your "swat the mosquito" breaks the First Precept—Buddhism would require non-lethal alternatives.  

  ### Final Summary:
  \answer{Minimize direct intentional harm to innocents while allowing indirect harm to prevent greater suffering}  
  Your ethics blend harm reduction with strict limits on direct violence—consistent except in extreme trade-offs like assassination.
