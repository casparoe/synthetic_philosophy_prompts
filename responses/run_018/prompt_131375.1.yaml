answer: |-
  ### Exam Question: Social Epistemology & Peer Disagreement (25 Marks, 90 mins, ~1000 words)  
  **Scenario:** Mathematicians A and B are undisputed epistemic peers in number theory. They disagree sharply about Lemma L in a new preprint. A contends B has misread a notational convention standardized *only in 2022*. B contends A is "overfitting" to an outdated heuristic. Crucially, *they agree they are peers on core number theory*, but *disagree about whether they are peers regarding interpretation of this specific notation*. Enter C: another peer with identical expertise/track records, who hasn’t examined the proof but knows A and B’s disagreement history is perfectly symmetrical.  

  **Prompt:**  
  1. **Conciliationism’s Mandate:** Does conciliationism (e.g., Equal Weight View) still require A/B to significantly revise their beliefs about L? Explain why the *disagreement about the source of disagreement* (notation vs. heuristics) complicates this. (8 marks)  
  2. **Steadfastness & Circularity:** Could either A or B defensibly adopt a steadfast position without bootstrapping (i.e., without circularly appealing to their own reasoning to dismiss the other)? Justify your answer. (7 marks)  
  3. **C’s Role:** What weight should A/B give to C’s opinion *if C suspends judgment* after learning of the dispute? Does C’s symmetry-break the stalemate or deepen it? (6 marks)  
  4. **Undermining Conciliationism?** Does this "meta-disagreement" (about *why* they disagree) fatally undermine conciliationism’s applicability? Argue rigorously. (4 marks)  

  ---

  ### Model Answer (~800 words)  

  **1. Conciliationism’s Mandate & the Meta-Disagreement Problem**  
  Conciliationism (e.g., Christensen) holds that discovering peer disagreement mandates belief revision toward suspension or compromise. Here, A and B’s clash over Lemma L *seems* to trigger this—*until* we note their meta-disagreement. They concur they’re peers *in number theory* but dispute expertise *on the notation’s interpretation*. This is devestating for conciliationism. The Equal Weight View assumes peers share *all* relevant epistemic credentials. But A thinks B lacks notation-specific reliability; B thinks A is biased by obsolete methods. Thus, **neither views the other as a *full* peer *on this specific issue***. Conciliationism’s obligation dissolves if peerhood is contested, as Kelly notes. But here’s the twist: *their judgment about each other’s partial peerhood is itself disputed*! A can’t insist B is notation-ignorant without B rejecting that assessment. This creates **higher-order disagreement** about first-order peer status. Conciliationism, applied consistently, might force *both* to suspend judgment *about whether the other is a peer*—paralyzing belief revision entirely. The meta-disagreement doesn’t just complicate conciliationism; it risks regress.  

  **2. Steadfastness: Possible but Perilously Circular**  
  Steadfastness (e.g., Pryor) allows maintaining one’s position despite peer disagreement. A could insist: “I’m steadfast because B misunderstands the notation.” But this **bootstraps**: A uses *their own* contested interpretation of B’s error to justify ignoring B. B does the same regarding A’s “overfitting.” This is circular because **the reason for dismissing the peer hinges on the very claim being disputed**. Defensible steadfastness requires independent grounds for downgrading the peer *that both sides accept* (e.g., if B admitted notation wasn’t their strength). Here, no such grounds exist. The only non-circular path is if A/B appeal to a *neutral* standard (e.g., consulting the 2022 notation guidelines). But in this scenario, they’re deadlocked on *what standard applies*—A cites the new convention, B dismisses it as irrelevant. Without neutral adjudication, steadfastness collapses into question-begging.  

  **3. C’s Suspension: Symmetry or Stalemate?**  
  C’s suspension of judgment *after* learning of A/B’s dispute *intensifies* conciliationist pressure on both. Why? C acts as a **symmetry enforcer**. A and B know C is equally reliable and has no horse in the race. C’s suspension signals that, given *perfectly balanced* evidence (two peers split), the rational response is agnosticism. This doesn’t break the stalemate between A/B; it **generalizes it**. If conciliationism binds C (who sees A/B as peers), then C *must* suspend. A and B, recognizing C’s rationality, face a dilemma: if they respect C as a peer, they should adopt C’s suspension—extending conciliationism to second-order disagreement. However, C’s lack of engagement with the proof weakens their authority. A might object: “C didn’t check the notation! Their view is uninformed.” Yet C’s judgment isn’t *about L* but about *how to handle disagreement between peers*. On *that* meta-question, C’s peerhood is uncontested. Thus, C’s suspension modestly favors conciliationism but doesn’t resolve the core clash.  

  **4. Does Meta-Disagreement Undermine Conciliationism?**  
  Yes, contingently. Conciliationism relies on **uncontested peer identification**. Meta-disagreement sabotages this by making peerhood itself disputable. If peers can rationally disagree about *whether they are peers*, conciliationism loses its trigger—you can always deflect revision by questioning domain-specific reliability. This doesn’t *refute* conciliationism but exposes its **brittleness in non-ideal cases**. The theory assumes peers agree on their epistemic equivalence; real-world experts rarely do. Here, A/B’s meta-disagreement creates a loophole: each can insist “*My* reason for doubting your peerhood (notation/heuristics) is the *correct* one,” blocking revision. Conciliationism isn’t “fataly undermined” in principle—it still binds when peerhood is clear—but this case shows it **fails to prescribe action** when peers dispute the framework for evaluating each other. It demands a shared epistemic baseline that’s absent.  

  ---

  ### Marking Scheme (Total: 25 Marks)  
  **Must-hit conceptual moves & common mistakes:**  

  | **Point**                                                                 | **Marks** | **Conceptual Move Required**                                                                 | **Common B-Grade Mistake** (drops A to B)                                |
  | :------------------------------------------------------------------------ | :-------- | :------------------------------------------------------------------------------------------- | :----------------------------------------------------------------------- |
  | **1. Diagnose meta-disagreement’s impact on peer status**                 | 5         | Show meta-disagreement undermines *uncontested peerhood*, creating higher-order uncertainty. | Only noting they disagree "about the cause" without linking to peerhood erosion. |
  | **2. Analyze steadfastness’s circularity risk**                           | 6         | Argue that downgrading the other’s expertise *based on contested premises* is bootstrapping. | Claiming steadfastness is viable because "they’re not *real* peers here." |
  | **3. Explain C as a symmetry enforcer for conciliationism**               | 5         | Frame C’s suspension as ratifying conciliationism’s demand in balanced disputes.             | Treating C’s opinion as a "tiebreaker" on L, not on disagreement norms.  |
  | **4. Argue meta-disagreement exposes conciliationism’s idealization**     | 5         | Conclude that conciliationism lacks resources when peerhood criteria are disputed.           | Asserting meta-disagreement "refutes" conciliationism outright.          |
  | **5. Structure & precision** (Overall coherence, clarity, avoiding strawmen) | 4         | Integrate all parts fluidly; avoid misrepresenting theories.                                 | Jumbled analysis; conflating conciliationism with skepticism.            |

  ---
  **Notes for Grading:**  
  - **A/A+ (21+):** Hits all 5 points, especially #1 and #2, with nuanced treatment of higher-order implications.  
  - **B (16-20):** Misses one key move (e.g., ignores circularity in #2 or C’s meta-role in #3); or is overly descriptive.  
  - **C (11-15):** Superficial summary of conciliationism/steadfastness; neglects meta-disagreement.  
  - **D/F (<10):** Fails to engage the scenario; major errors (e.g., "C should pick a side").  

  Let me know if you'd like a version with intentional typos for realism! Good luck with the exam setup.
