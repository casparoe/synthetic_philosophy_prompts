  Okay so I've been trying to figure out why the dirty hands debate in political ethics is completely stuck, and it's driving me nuts. On one side you've got people saying leaders sometimes have to do genuinely wrong things — like ordering a cover-up that saves thousands of lives but violates every transparency norm — and that the leader comes away with a real moral stain, not just bad feelings. On the other side you've got people saying that if the act was truly necessary and produced the best outcome, then it wasn't wrong at all, and the stain is just psychological residue or social signaling. They agree on every case I throw at them. They agree the cover-up was the right call. They agree the leader should feel awful. But they still talk past each other for hours.

  My hunch is that this isn't really about politics — it's about whether moral emotions track actual wrongness, or whether wrong just means violates a rule regardless of context. Or maybe one side is asking what should the agent do and the other is asking what should the institutional role permit. But I want an actual diagnosis, not just my guess.

  Can you tell me: is this verbal, substantive, or are they answering seperate questions under one heading? What exactly does each side say that makes them think they've won? And what would count as progress — a new distinction, an empirical study about leader guilt, or is it just bedrock intuition?

  Also there's this edge case that's been bugging me: what if a mayor deliberately structures the decision so a subordinate pulls the trigger, specifically so the mayor's own hands stay clean? Is that still dirty hands, or is it moral outsourcing that collapses the framework? I think how you answer that reveals what's actually broken in the debate.
