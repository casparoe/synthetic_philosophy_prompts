answer: |-
  ## The Mediation of Resentment: Mara & Elias Debate Strawson

  **Setting:** A sunlit common room in a philosophy department, late afternoon. Mara sips tea, Elias leans forward intently.

  **Mara:** Elias, I keep returning to Strawson’s ‘Freedom and Resentment.’ His core insight – that holding someone morally accountable *is* the participant stance, manifested in reactive attitudes like resentment – feels undeniable. But where I diverge is the assumption that these attitudes must be *direct* and *personal* to be genuine. Our world demands institutional responses to wrongdoing. Can’t we design those systems to *express*, rather than extinguish, the participant stance? I call it *mediated accountability*.

  **Elias:** Mara, you tread dangerous ground. Strawson drew that bright line for a reason! The moment you insert a facilitator, a panel, a protocol between the victim’s resentment and the offender’s face, you risk precisely the slide he warned against: treating the person as an object to be managed, not a member of the moral community to be addressed. The ‘objective attitude’ creeps in with the bureaucracy.

  **Mara:** But why must ‘address’ be raw and unfiltered? Consider a facilitated restorative circle. The victim may be too traumatized for direct confrontation. A skilled facilitator doesn’t erase the moral gravity; they *channel* it. They ensure the harm is articulated, the offender confronted with the human consequence. Crucially, the facilitator isn’t neutral. They genuinely feel indignation *on behalf* of the victim. I propose this is a *vicarious reactive attitude* – a genuine participant emotion, felt by a representative invested in upholding the moral community’s standards.

  **Elias:** Vicarious? That sounds perilously close to sentimentality, Mara. Or worse, professional detachment masquerading as emotion. Is the facilitator’s indignation truly *resentment*? Resentment, for Strawson, is personal – it’s *my* standing being slighted by *you*. Can someone feel *my* resentment *for* me? Or is it just a well-intentioned simulation? Doesn’t the very structure – the agenda, the ground rules, the focus on ‘resolution’ – inevitably frame the offender as ‘the case,’ not ‘*you* who wronged *me*’?

  **Mara:** Is directness the only guarantor of authenticity? Think of complex harms. Systemic discrimination, corporate negligence. Who is the ‘me’ slighted? The resentment *is* diffused, yet the moral demand for accountability is no less real. Mediation allows that collective moral injury to be coherently expressed and addressed. The facilitator’s indignation isn’t simulated; it’s a response to the violation of shared norms they are deeply committed to upholding. It *is* personal for *them* – not as the victim, but as a guardian of the moral community. The offender is still met with a demand for recognition and repair, face-to-face, emotionally charged – just not solely by the primary victim.

  **Elias:** Granting that the facilitator might feel *something* genuine – frustration, disapproval, even anger – is it *resentment* in the Strawsonian sense? Resentment calls for a specific kind of response: acknowledgment, remorse, perhaps apology directed *to the one resenting*. In your panel, the offender might express remorse to the facilitator or the ‘process,’ not the specific person they harmed. Doesn’t this dilute the interpersonal core? Doesn’t it risk making accountability a transaction managed by professionals, where the ‘vicarious’ emotion becomes part of the therapeutic or administrative toolkit? How is this fundamentally different from a social worker’s ‘concern,’ which Strawson explicitly places in the objective camp?

  **Mara:** The difference lies in the *telos* and the *address*. The social worker’s concern aims at adjustment, rehabilitation – managing the individual *as* a problem. The facilitator’s vicarious indignation, within a well-designed restorative process, aims at moral recognition and repair *within the community*. The offender is addressed as a moral agent capable of understanding the wrong and making amends *to those harmed*, even if through mediation. The emotion fuels the demand for that specific response. Now, challenge *me*, Elias. How does *your* insistence on direct resentment handle the exemption cases Strawson himself acknowledged? Severe cognitive disability, profound psychosis. We rightly withhold resentment, adopting the objective attitude, because addressing them as moral agents is impossible. But what about cases *near* that boundary? Or victims psychologically incapable of direct resentment? Do we simply exempt the offender entirely, denying them standing? Or do we concede that mediated, perhaps vicarious, expressions of the participant stance are essential to hold them *within* the moral community?

  **Elias:** (Pauses, stroking his chin) That’s a sharp thrust, Mara. You’re right. Exemptions are stark, but the boundaries are messy. Withholding resentment entirely towards someone *capable*, however marginally, of moral response feels like an abdication. Perhaps… perhaps in those liminal cases, or with traumatized victims, a form of mediation *could* function as a prosthesis for the participant stance. But it must be a prosthesis, not a replacement! My fear is that your ‘vicarious’ model becomes the default, the norm. The raw, personal “How could you do this to *me*?” – the very engine of moral address for Strawson – gets sanitized, proceduralized. The offender hears “The process finds your actions unacceptable,” not “*I* am wounded by what *you* did.” Doesn’t that subtly shift the locus of authority from the interpersonal bond to the institution?

  **Mara:** Perhaps the locus isn't shifted, but *shared*. The institution embodies the community’s commitment to its moral norms. The facilitator’s vicarious feeling isn't a substitute for the victim’s potential resentment; it’s an amplification and structuring of the community’s reactive stance *alongside* the victim’s experience, however expressed. The offender is confronted not just by an individual’s pain, but by the communal judgment that such acts violate *our* shared life. Isn’t that still fundamentally addressing them as a participant? The danger lies not in mediation itself, Elias, but in *poorly designed* mediation that loses sight of the emotional core. We must vigilantly ensure the process serves the interpersonal moral demand, not obscures it.

  **Elias:** Vigilance… yes. Perhaps that’s the key. Strawson’s objective attitude wasn’t just about emotionlessness, but about seeing the other as *not fit* for ordinary interpersonal engagement. If your mediated processes truly preserve the *address* – the demand for recognition directed to the offender *as an agent* – and if the ‘vicarious’ emotion is a genuine, norm-governed reactive attitude felt *on behalf of* the moral community’s integrity, not just professional concern… perhaps it can avoid that pitfall. But Mara, I remain deeply skeptical that the heat of personal resentment can truly be *distributed* without cooling into something else entirely. The "you" and "me" risk dissolving into "the parties."

  **Mara:** And I remain convinced, Elias, that in a complex world, refusing to innovate in how we express the participant stance risks abandoning the moral community entirely for vast swathes of harm. We must find ways to keep the "you" and "me" alive, even if held within the structured embrace of "us." The challenge isn't to reject mediation, but to imbue it with the fire of the reactive attitudes, however vicariously felt. Strawson gave us the map; we have to navigate the territory.
