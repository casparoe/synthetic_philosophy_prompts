  But the user also wants me to stress-test this framework. If we apply structural blame symmetrically to other powers—like Britain's naval race or Russia's autocratic mobilization—does it lead to everyone being equally culpable, making the concept useless? Or is there something uniquely flawed about Germany's structure? 

  I should be honest about where the framework breaks. For example, archival evidence might show intent but not how representative it was. Structural blame might be too broad, implicating citizens who had no say. And symmetrically applying it could dilute culpability entirely. 

