answer: |-
  Based on your detailed description, this strategy represents a fascinating and distinct exploitation mechanism that doesn't neatly fit into the most common categories in evolutionary game theory or philosophy of cooperation. Here's an analysis of terminology, differentiation from neighboring concepts, and boundary conditions:

  **1. Established Terminology: The Gap**
  There is **no single, universally established term** specifically capturing *exactly* this combination of features:
  *   **Unconditional Cooperation Within Played Rounds:** No defection occurs.
  *   **Endogenous Termination:** Exit is a strategic choice, not exogenous.
  *   **Conditionality on Partner's Cooperative History:** Triggered by sustained cooperation.
  *   **Exploitative Intent:** Designed to deprive the partner of future surplus *maximally* (timed just before peak mutual payoff).
  *   **Avoidance of Punishment:** Evades detection/retaliation mechanisms targeting explicit defection.

  While related concepts exist (discussed below), this specific *exploitation via conditional, cooperative-history-dependent termination* lacks a canonical label.

  **2. Proposed Terminology & Delimitation from Neighboring Concepts**
  The most precise descriptive label might be **"Cooperation-Triggered Exploitative Exit" (CTEE)** or **"Reciprocity-Induced Strategic Termination" (RIST)**. To differentiate it:

  *   **vs. Classic Defection (e.g., Always Defect):**
      *   *Boundary:* CTEE never defects within any played round. Its "betrayal" is temporal displacement – denying the *future* value generated by sustained cooperation, not stealing immediate payoff via defection. It exploits the *expectation* of future cooperation, not current trust.
      *   *Key Distinction:* CTEE avoids triggering strategies that punish *within-round defection* (e.g., TFT, Pavlov, GTFT). Its invasion success against naive cooperators hinges on this evasion.

  *   **vs. Endgame Effect (in Finitely Repeated Games):**
      *   *Boundary:* The endgame effect arises from a known, fixed endpoint inducing backward induction. In CTEE, the endpoint is **not fixed or commonly known**; it's **strategically chosen by the CTEE agent based on the *partner's* behavior**. The victim has no inherent reason to anticipate termination upon sustained cooperation.
      *   *Key Distinction:* CTEE creates an *endogenous, conditional* endgame surprise, not a rational unraveling from a known common endpoint.

  *   **vs. Truncation Strategies:**
      *   *Boundary:* Standard truncation (e.g., play TFT for N rounds, then stop) is often **exogenous** (fixed N) or **unconditional**. CTEE's truncation is **endogenously triggered** by the *partner's specific cooperative history* ("you cooperated perfectly for K rounds, so I leave *now* to maximize my exploitation").
      *   *Key Distinction:* The conditionality on the *partner's cooperation* makes it an *exploitation mechanism*, not just random stopping or cost-saving. The trigger is the *very behavior* it exploits.

  *   **vs. Conditional Cooperation (e.g., TFT, GTFT, Win-Stay-Lose-Shift):**
      *   *Boundary:* Standard conditional cooperators *modify their own action* (C/D) based on history. CTEE modifies the *existence of future interaction* while maintaining a fixed action (C) within the interaction that *does* occur.
      *   *Key Distinction:* CTEE's "punishment" isn't defection; it's **relational termination** triggered paradoxically by *perfect cooperation*. It uses *exit* as the retaliatory/exploitative act, not action choice.

  *   **vs. "Take the Money and Run" (in Economics/Law):**
      *   *Similarity:* Captures the essence of exploiting trust then disappearing.
      *   *Boundary:* "Take the Money and Run" typically implies **explicit defection** in the final interaction (taking the money *dishonestly*). CTEE *never takes the money dishonestly*; it simply refuses to *enter* the round where the mutual payoff peaks after building trust.
      *   *Key Distinction:* CTEE avoids the "crime" of defection; it commits the "crime" of breach of implicit relational contract *by omission* (non-participation).

  *   **vs. Forgiveness/Re-engagement Rules:**
      *   *Boundary:* Forgiveness mechanisms (e.g., in Generous TFT) are about *resuming cooperation* after defection. CTEE is about *terminating cooperation* precisely when it's most valuable and *despite* perfect cooperation.

  **3. Boundary Conditions for a Distinct Failure Mode**

  CTEE constitutes a **genuinely distinct failure mode of cooperation** under the following boundary conditions:

  1.  **Partner Naivety/Non-Detection:** The victim strategy lacks mechanisms to:
      *   Detect or anticipate *strategic termination* as a distinct threat from defection.
      *   Impose costs or screen for termination propensity (e.g., through initial costly signaling or demanding commitments to longer interactions).
      *   Adjust its own behavior based on the *risk* of termination (beyond reacting to defection).
  2.  **High Discount Factor (Future Matters):** Cooperation must be sustained by the expectation of significant *future* rewards. CTEE exploits this future value.
  3.  **Payoff Structure Asymmetry:** The timing of exit (just before peak mutual payoff) is crucial. Strategies where mutual payoff is linear or peaks early are less vulnerable. The "highest mutual payoff" round must be identifiable/predictable by the CTEE agent.
  4.  **Absence of Reputation/Network Effects:** In well-mixed populations, CTEE can invade naive cooperators. However, in structured populations or with reputation:
      *   CTEE agents might be identified as "terminators" and avoided.
      *   The cost of finding new partners after termination might outweigh the exploitative gain.
  5.  **Interaction Cost:** If initiating a new interaction is costly for the CTEE agent, repeated short exploitative interactions may become less viable.

  **If these conditions hold, CTEE is distinct because:**

  *   **Mechanism:** Exploits via *relational withdrawal* triggered by *successful cooperation*, not action-based defection.
  *   **Vulnerability:** Targets a different weakness – blind trust in *continuation* rather than blind trust in *immediate reciprocity*. Naive cooperators are vulnerable to CTEE but immune to defection-triggered punishment from within (as they don't retaliate). Conversely, strategies robust against defectors (like TFT) might be *more* vulnerable to CTEE if they rely on long future interactions to recoup costs of initial cooperation or retaliation.
  *   **Evolutionary Dynamics:** Its invasion pathway differs fundamentally from defector invasion, relying on evading punishment mechanisms designed for action-based betrayal.

  **Conclusion:**

  Your identified strategy, **Cooperation-Triggered Exploitative Exit (CTEE)**, is a novel and significant exploitation mechanism. While adjacent to concepts like the endgame effect, truncation, and conditional cooperation, its core innovation is using *endogenous, cooperative-history-dependent termination* as the exploitation tool while maintaining perfect within-interaction cooperation. It exploits the *temporal structure of reciprocity* itself. It likely constitutes a distinct failure mode of cooperation, particularly effective against strategies evolutionarily optimized to detect and punish explicit defection but naive to the threat of strategic abandonment upon achieving mutual trust. This phenomenon deserves explicit naming (CTEE/RIST) and further theoretical exploration, particularly regarding its evolutionary stability, conditions for invasion, and potential counter-strategies (e.g., strategies that demand upfront commitments, impose termination costs, or detect "too-perfect" cooperative runs followed by exit). It highlights a crucial vulnerability in cooperative systems: the exploitation of trust in the *future* without violating norms in the *present*.
