answer: |-
  ## Illusions for Happiness

  reason leaves the happy life laid bare  
  The brightest hopes that charm and then depart  
  i cover it with study and with care.  

  I know that study's glory is a flare  
  That fades like embers when the cold stars start;  
  reason leaves the happy life laid bare.  

  And love's sweet pledge is but a fragile snare  
  That time untangles, thread by thread, apart—  
  i cover it with study and with care.  

  Yet still I build cathedrals on the air,  
  Though logic knows each stone will lose its art;  
  reason leaves the happy life laid bare.  

  Though love's bright bloom may wither in despair,  
  I plant new gardens with a hopeful heart—  
  i cover it with study and with care.  

  So let harsh winds strip truth beyond repair—  
  I'll stitch new veils with every crafted part;  
  reason leaves the happy life laid bare  
  i cover it with study and with care.
