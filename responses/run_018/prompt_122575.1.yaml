  ## The Ring That Binds

  Saltmarch clung to Talvern’s rocky shore like damp lichen, its stone buildings perpetually salt-rimed, its air thick with kelp and fish. For two centuries, the Tide-marked were as much a part of its fabric as the harbour walls. Registered at birth based on parentage, handed a brine ration tin at eight, and sent into the bone-chilling waters for salvage by twelve – after the examiners confirmed the pale ring in their irises, the hereditary mark of the sea-claimed.

  Dr. Elara Vance arrived with the brisk efficiency of mainland modernity. Her mandate: replace the subjective iris examinations with a definitive laboratory test. The Tide-marked registry, its brittle pages stained with sea-spray and bureaucratic ink, felt archaic to her. She set up her portable microscope and reagent kits in a damp room overlooking the harbour, the rhythmic groan of buoys her constant companion.

  The first few days were routine. Children brought in by weary parents, eyes wide with apprehension or dulled by premature exhaustion. Elara peered through her lens, noting the distinctive pale ring against the iris colour – sea-grey, brown, hazel. The examiner, old Master Crenshaw, stood beside her, his own eyes clear of the mark. His identifications matched her initial visual assessments perfectly. Honest, as reported.

  But patterns niggled. The ring wasn't a stark, immutable line like a birthmark; it had a subtle, almost *grown* quality. And the children brought to her were *already* working the shallows, already receiving the thick, pungent brine ration said to "fortify the blood." Elara requested records. She cross-referenced birth entries with examination dates, with work assignments.

  One rainy afternoon, hunched over the register, a fact snapped into focus. *No child under ten had ever been confirmed Tide-marked.* The exam always happened *after* years of brine and cold-water exposure began. She found entries for infants declared "potential" based solely on parentage, awaiting the mark's appearance. Hereditary? Or... acquired?

  That night, she visited Aris Thorne. Eighty, bent like driftwood, his eyes the milky blue of deep ice, encircled by the stark, pale ring. He’d been Tide-marked before the current registry system formalized.

  "Old Aris," she asked, pouring strong tea, "when did the ring first show? As a babe?"

  The old diver chuckled, a sound like pebbles rolling in a tin. "Show? Naw, Doctor. Came on slow, like barnacles. After my first winter diving, maybe? Twelve, thirteen? Ma said my eyes just… paled at the edge." He tapped his temple. "Like the salt etched ‘em, see?"

  Elara’s heart hammered against her ribs. She requested samples – brine ration, harbour water sediment. Back in her makeshift lab, she cultured microorganisms, analysed mineral content. The brine, a viscous slurry of concentrated seawater and kelp extracts, was laden with unique microflora and trace metals absent in regular seawater. She exposed cultured eye tissue (ethically sourced, she assured herself) to simulated conditions: cold, pressure, and most crucially, the specific brine mixture.

  Weeks later, the result was undeniable. The cultured tissue developed a faint but distinct pale discolouration at the periphery under the brine regimen. The harbour sediment analysis revealed the same unique microbial signatures found in the brine and… in swabs taken from the irises of confirmed Tide-marked individuals.

  The laboratory test she’d brought – designed to detect a *genetic* marker – was useless. It confirmed *every single entry* on the Tide-marked register. Her own environmental simulation had replicated the diagnostic mark. The "hereditary" sign was a scar, meticulously cultivated by the very system that required it. Nature or nurture? Here, nurture *became* nature, etching its proof onto the body. Abolishing the category wouldn't erase the ring already etched into a generation of eyes. The evidence proved the mark was real *and* constructed, inextricably linked to the practice it justified.

  Elara sat in the damp room, the rhythmic groan of the buoys now sounding like a lament. Theo’s sharp, frustrated voice echoed in her mind: *"Nobody has ever abolished money by proving it was a convention."* To dismantle this, she needed the very structure she sought to break. Revealing the truth – that the mark was caused by the brine and the work – could shatter the legitimacy of the system... but it wouldn't magically dissolve the register, the ingrained expectations, the economic dependence. Chaos, not justice, might follow.

  She made her decision. She reported her findings to the mainland authorities not as an exposé of a false heredity, but as proof of *environmental harm*. The brine ration and the cold-water labour, she argued with cold, precise data, were causing a specific, identifiable physiological change – the iris ring – alongside documented rates of joint degeneration, lung ailments, and hypothermia. The Tide-marked category, she conceded, accurately identified those subjected to these harmful conditions. Therefore, *for their protection*, the practices must cease immediately: no child labour, regulated adult diving with proper equipment, and crucially, the cessation of the brine ration. The registry, she argued pragmatically, was vital for identifying those owed compensation and medical care.

  ***

  Reform washed over Saltmarch like a cautious tide. Elara’s "environmental health" argument proved palatable. The eight-year-olds stayed dry. The brine ration stopped. Pensions were established for former Tide-marked divers too broken to work. A Restitution Office opened in a freshly painted building near the harbour.

  This was where the category, seemingly mortally wounded, began its subtle reformation. The Restitution Office needed a roll. Who received the pension? Who qualified for the new lung treatments? The *Tide-marked Register* was the only comprehensive list. Officials from the mainland demanded clear criteria for budget allocation. "Former Tide-marked" became the bureaucratic designation. Forms required it. Case files were labelled with it.

  Aris Thorne, receiving his first pension, signed with a trembling ‘X’ on a line marked *Designation: Former Tide-Marked (Registry Code T-114)*. Young Mara, whose pale iris ring was fading now the brine had stopped, applied for harbour work on the newly regulated salvage boats. The foreman, scanning her application, noted the blank space. "You Tide-marked? Former, like?" She hesitated, then nodded. It was still the only identity the harbour understood for divers. He grunted, "Right. We got quotas for your lot. Sign here." The quota wasn't malice; it was the Restitution Office liaising with the Harbour Board to ensure "historically disadvantaged groups" had access.

  Five years later, Saltmarch was undeniably changed. Children played on the docks instead of diving beneath them. The pervasive smell of the brine ration was gone. The iris rings of the young were fading ghosts. Yet, walking the quays, Elara Vance (now a periodic inspector) observed the new Harbour Workers' Guilds. One guild, stronger, dominated the deep-water salvage. Its membership roll bore an uncanny resemblance to the old Tide-marked register, bolstered by sons and daughters who listed "Former Tide-Marked Parentage" on their applications – a fact noted by guild secretaries seeking to honour "traditional skills" and by Restitution officials tracking generational impact. They weren't called Tide-marked anymore. They were "Heritage Divers" within the guild, or "Priority Restitution Recipients" in the office files. The economic structure, the subtle segregation of harbour tasks, the way people *expected* certain families to do certain jobs… it had re-coagulated, using the very mechanisms designed to undo it.

  Elara stood on the breakwater, watching a Heritage Diver crew prepare for a deep dive, better equipped than their forebears, but still performing the coldest, most dangerous work. The pale ring was vanishing from young eyes, a fading scar. The eight-year-olds were safe. Pensions eased old pains. Yet, the harbour’s rhythm felt familiar, the divisions merely re-labelled. She thought of the meticulously updated rolls in the Restitution Office, the guild membership lists, the unspoken expectations that shaped choices. Was the circle truly broken, or had it simply been redrawn, fainter but persistent, written now in ink and expectation rather than brine and ice? The wind off the sea offered no answer, only the old, familiar salt tang.
