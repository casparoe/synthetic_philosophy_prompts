  I'm prepping questions for next week's podcast episode and our guest is a historian of philosophy who defends Sidgwick's actual stance on psychical research, not the cartoon version where he's just a stuffy Victorian skeptic who dismissed everything out of hand. He takes the view that investigating mediums and telepathy was methodologically legitimate, that most of the evidence of Sidgwick's era genuinely failed but that the failure teaches us something about evidential standards rather than just proving fraud, and that the whole project actually connects back to Sidgwick's ethical work in ways modern readers miss. I want about eight or nine interview questions that go well beyond having him restate this outline. I need at least one that presses on why Sidgwick seemed to think resolving questions about consciousness surviving death might actually bear on the rational foundations of morality — with a follow-up for when he says it was just personal hope rather than philosophical argument. I want another that asks about Sidgwick's specific objections to the spiritualist evidence of his day, but framed so he can't just retreat to "they were all frauds" — and include the follow-up for that exact reply. Then I need one about whether Sidgwick's commitment to such rigorous skepticism makes his project self-defeating, since if the evidential bar is set high enough nothing psychical could ever clear it, and what that means for his claim that the investigation was genuinely open-minded. For each question, can you build in a follow-up keyed to the answer he's most likely to give? Please don't include any generic openers like "what drew you to philosophy" — I want to jump straight into the weeds, and I'd rather you avoid asking for citations or reading lists since our audience won't have access to the texts in front of them. Also, I typo'd "guest list" in my notes earlier so I'm leaving it in: this is all off-the-cuff, no fancy framing needed.
