  Below is a decision tree designed to diagnose positions on "competence without comprehension" by probing concrete commitments about Darwinian evolution and Turing computation. The tree avoids philosophical labels, relying on case-specific verdicts answerable from first principles. The entry commitment is fixed, and nodes are phrased as concrete claims or empirical verdicts. Logical gaps and unoccupied positions are flagged in the notes.

  ---

  ### **Decision Tree: Competence Without Comprehension**  
  **Entry Commitment (All Respondents Start Here):**  
  *A system can display robust, domain-specific problem-solving competence even though nothing in the system comprehends the problem domain, the solution, or the relation between them.*

  #### **Node 1: Darwin’s Inversion (Biological Function)**  
  > **Verdict on the vertebrate eye:** *Natural selection, operating without foresight or representational understanding, can produce an organ like the vertebrate eye with* genuine *functional competence (e.g., it solves the problem of vision). This competence is not a simulacrum; the eye* really sees *due to its evolutionary history, not because any part of the process "grasps" optics, purpose, or design.*  
  - **Accept** → Proceed to Node 2.  
  - **Reject** → Proceed to Node 3.  

  #### **Node 2: Turing’s Inversion (Cognitive Behavior)**  
  > **Verdict on the imitation game:** *A machine passing the Turing Test (behaviorally indistinguishable from a human) demonstrates* genuine *cognitive competence (e.g., understanding language). This competence is not simulated; it arises solely from formal symbol manipulation, with no internal semantic states "grasping" meaning or intent.*  
  - **Accept** → Proceed to Node 4.  
  - **Reject** → **Leaf 1: Pure Evolutionary Inversion**.  

  #### **Node 3: Turing’s Inversion (Cognitive Behavior)**  
  > *Same question as Node 2.*  
  - **Accept** → Proceed to Node 5.  
  - **Reject** → **Leaf 4: Rejectionist View**.  

  #### **Node 4: Analogy of Mechanisms (for Acceptors of Darwin + Turing)**  
  > **Verdict on evolutionary vs. computational "blindness":** *The processes behind Darwinian selection (environmental filters on phenotypes) and Turing computation (algorithmic execution of syntax) are* structurally analogous *in generating competence without comprehension. Both substitute external selection histories (natural/artificial) for internal understanding.*  
  - **Analogous** → **Leaf 3: Unified Inversion View**.  
  - **Not Analogous** → **Leaf 6: Teleological Disparity View** (see notes).  

  #### **Node 5: Basis for Rejecting Darwin’s Inversion (for Rejectors of Darwin + Acceptors of Turing)**  
  > **Verdict on biological intentionality:** *The reason for rejecting Darwin’s inversion (Node 1) is that natural selection* requires *a minimal form of biological intentionality (e.g., goal-directedness inherent in genes or ecosystems). Evolution cannot produce genuine functional competence without this proto-comprehension.*  
  - **Yes** → **Leaf 5: Asymmetric Inversion**.  
  - **No** → **Leaf 2: Pure Functionalist Inversion**.  

  ---

  ### **Leaves (Terminal Positions)**  
  1. **Leaf 1: Pure Evolutionary Inversion**  
     - *Accepts Darwin, rejects Turing.* Natural selection produces original functional teleology (e.g., the eye *really* sees) without comprehension, but computational competence is "derived" or empty (e.g., Turing Machines merely simulate understanding).  
     - *Path:* Entry → **Accept** Node 1 → **Reject** Node 2.  

  2. **Leaf 2: Pure Functionalist Inversion**  
     - *Accepts Turing, rejects or is neutral/skeptical about Darwin.* Computational competence is genuine without comprehension (e.g., passing Turing Test = true cognition), but biological functions may be observer-relative, non-teleological, or inadequately explained by natural selection alone.  
     - *Path:* Entry → **Reject** Node 1 → **Accept** Node 3 → **No** Node 5.  

  3. **Leaf 3: Unified Inversion View**  
     - *Accepts both Darwin and Turing as analogous.* Competence without comprehension arises identically in evolution and computation: external selection histories (environmental constraints/interactive testing) replace internal understanding.  
     - *Path:* Entry → **Accept** Node 1 → **Accept** Node 2 → **Analogous** Node 4.  

  4. **Leaf 4: Rejectionist View**  
     - *Rejects both Darwin and Turing.* Darwin explains *away* apparent design but not genuine teleology (e.g., eyes are byproducts of chance, not "competence"); Turing confuses behavior with cognition (e.g., imitation ≠ understanding). Comprehension (designer/intentionality) is necessary for true competence.  
     - *Path:* Entry → **Reject** Node 1 → **Reject** Node 3.  

  5. **Leaf 5: Asymmetric Inversion (Logically Permitted but Unoccupied)**  
     - *Accepts Turing, rejects Darwin due to biological intentionality.* Machines achieve competence without comprehension, but evolution requires minimal proto-comprehension (e.g., teleology in DNA or natural laws).  
     - *Path:* Entry → **Reject** Node 1 → **Accept** Node 3 → **Yes** Node 5.  
     - **Diagnosis of Gap:** Unstable and likely incoherent. Demanding "proto-comprehension" for evolution but not computation creates an unmotivated asymmetry: if evolution needs intrinsic teleology, why wouldn’t computation? This position is unexplored (no prominent defenders) and risks contradiction (e.g., if teleology implies comprehension).  

  ---

  ### **Notes on the Tree**  
  - **Separation Success:**  
    - All target leaves (1–5) are separated by the nodes.  
    - **Exception:** *Leaf 3 (Unified Inversion)* and *Leaf 1 (Pure Evolutionary)* are cleanly divided by Node 2 (Turing verdict). No convergence.  
  - **Unoccupied/Unstable Combinations:**  
    - **Leaf 6: Teleological Disparity View** (Accept Darwin + Turing but reject analogy): Darwin creates *original* teleology (e.g., genuine biological purposes), while Turing produces *derived* teleology (e.g., designer-assigned goals). Logically permitted but rare; ruled out by unified inversion’s symmetry.  
    - **Other Gaps:** A position accepting Darwin while rejecting Turing *on teleological grounds* (e.g., "computation lacks real purposes") would converge with Leaf 1. The tree does not distinguish this sub-variant, as Node 2 focuses on behavioral competence, not teleology.  
  - **Design Rationale:**  
    - Nodes prioritize empirical cases (eye/imitation game) over abstract principles.  
    - Node 5 isolates the unstable gap (Leaf 5) by probing the *reason* for rejecting Darwin.  
    - "Comprehension" is operationalized as representational grasp (semantic, teleological, or intentional).  

  This tree forces respondents to confront concrete cases, revealing commitments through verdicts on mechanisms rather than allegiance to schools. It diagnoses asymmetries (e.g., Leaf 5) and exposes defaults to comprehension (e.g., Leaf 4).
