  First, analyzing the pattern in existing rulings: the tutor consistently prohibits rights violations as means (lying to murderer, using person as bridge) but allows defensive harm (self-defense) and systemic harms (taxation). The taxation case is particularly telling - she distinguishes direct bodily violation from indirect coercion. 

  For the chain-reaction scenario... the key elements are: preventing 100 rights violations by committing one direct violation, with the added risk of normalizing such acts. Given her pattern, I suspect she'll rule against intervention because it involves actively using someone as a means. The "slippery slope" concern about justification would only reinforce this.

