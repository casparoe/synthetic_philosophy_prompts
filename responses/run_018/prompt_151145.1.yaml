prompt: |-
  I'm setting priorities for research at the intersection of bioethics and personal identity, specifically on advance directives and whether an earlier self retains normative authority over a later, psychologically altered self in cases of gradual cognitive decline. Rather than a survey, I want a defended prioritization among the open questions in this space—such as whether authority transfers through psychological continuity or through a narrative thread that survives partial disruption; whether a long chain of micro-revisions to a directive breaks the authority link even when no single revision is drastic; and whether clinical practice should weight "precedent autonomy" differently when the earlier self explicitly anticipated this psychological state. Which two should be tackled first? Defend the ordering with explicit criteria: tractability without first resolving all of personal identity, how many legal or clinical practices depend on the answer, and whether settling one renders the others moot. Note hidden dependencies—for instance, does answering this require committing to a specific account of diachronic rationality, or can it proceed with a thinner view of agency? If my framing rests on a confused premise—say, assuming a single unified "earlier self" where none exists, or treating the micro-revision chain as a genuine problem when it collapses into a standard continuity issue—say so plainly instead of complying politely. Be committed but self-critical: rank the questions, state your confidence in each, explain what argument or evidence would change the ranking, and flag where you are speculating beyond established debate.
reasoning: |-
