  For the decision procedure, I'll create an ordered checklist with four sections. Section 1 will have preliminary questions to establish causal coupling, asking about the measurement mechanism, direct evidence links, and counterfactual reasoning. This helps surface whether the metric is causally connected to the phenomenon. Section 2 will define outright rejection conditions, like high risk of displacement or corruption that can't be mitigated. Section 3 will outline when to retain with safeguards, such as adding contextual data or audits. Section 4 will highlight judgment points where values must be debated outright.

