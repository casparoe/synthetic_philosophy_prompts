prompt: |-
  I want the full spec for what a theory of rational belief revision under genuinely uncertain evidence actually has to deliver. I'm not asking for Jeffrey conditionalization vs standard Bayes — I mean the messy middle where your evidence doesn't come with a clean likelihood, like when you recieve overlapping but conficting expert confidance ranges about a diagnosis and still have to update. List the desiderata: the cases it must handle (avoiding dilation, respecting second-order uncertainty, not collapsing into naive averaging), the distinctions it can't blur (uncertainty about the world vs uncertainty about the evidential weight itself), and the decision-theoretic constraints it can't violate. For each say why it's required and flag which are hard constraints vs camp preferences (locality of update, no hidden priors, etc.). Then briefly score Jeffrey's rule, a two-stage Bayesian model, and a 'threshold-then-Bayes' hybrid — but keep weight on the criteria. Be committed: tell me which single desideratum kills the hybrid view and defend that choice. No bib needed, just the reasoning.
reasoning: |-
  We are building a theory for rational belief revision under genuinely uncertain evidence. The evidence is not clean; it comes with ambiguity, conflict, and second-order uncertainty. We need a set of desiderata that such a theory must satisfy, and then we will evaluate three approaches: Jeffrey conditionalization, a two-stage Bayesian model, and a threshold-then-Bayes hybrid.

  Desiderata (with type: hard constraint vs. camp preference):

  1. **Avoiding Dilation (Hard Constraint)**: Dilation occurs when updating on ambiguous evidence causes the agent's credence to become less precise (e.g., the confidence interval widens). This is unacceptable because it represents a loss of information without justification. The update should not make the agent less certain when the evidence is ambiguous but should reflect the ambiguity appropriately.

  2. **Respecting Second-Order Uncertainty (Hard Constraint)**: The agent may have uncertainty about the reliability of the evidence (e.g., the expert's confidence range). The update must account for this second-order uncertainty. Ignoring it would lead to overconfidence.

  3. **Not Collapsing into Naive Averaging (Hard Constraint)**: When faced with conflicting expert reports, the update must not simply average the reports without considering the reliability and interdependence of the experts. Naive averaging fails in cases of correlated errors or when one expert is more reliable.

  4. **Distinguishing Uncertainty about the World vs. Uncertainty about the Evidential Weight (Hard Constraint)**: The theory must keep these separate because they require different treatments. Uncertainty about the world (first-order) is what we are trying to update. Uncertainty about the evidential weight (e.g., how much to trust the expert) is meta-uncertainty and must be represented and updated appropriately.

  5. **Locality of Update (Camp Preference)**: Some argue that the update should depend only on the evidence and the prior, without hidden variables. However, in complex evidence (like conflicting experts), it may be necessary to model the evidence-generating process.

  6. **No Hidden Priors (Camp Preference)**: The update rule should not require priors that are not explicitly represented. For example, if we use a two-stage model, we should be explicit about the priors on the reliability of the experts.

  7. **Decision-Theoretic Constraints (Hard Constraint)**: The updated beliefs must form a coherent probability distribution to avoid Dutch books. Also, the update must not lead to dominated decisions (e.g., in a choice between actions, the updated belief should not lead to choosing an action that is worse in every state).

  Now, we briefly score three approaches:

  - **Jeffrey Conditionalization**: This rule updates by redistributing probabilities over a partition of the evidence space. However, it requires a precise likelihood for the evidence. In our case, the evidence is uncertain and doesn't come with a clean likelihood. Therefore, it fails on handling second-order uncertainty and avoiding dilation (because it can dilate if the evidence partition is set arbitrarily). Also, it does not naturally account for uncertainty about the evidential weight.

  - **Two-Stage Bayesian Model**: This model treats the evidence as generated by a process (like an expert report) and uses a prior on the reliability of that process. Then, we update both the world state and the reliability parameters. This approach handles second-order uncertainty (by modeling the reliability) and avoids naive averaging (by weighting by reliability). It can avoid dilation if the model is well-specified. It respects the distinction between world and evidential uncertainty. However, it requires explicit modeling of the evidence-generating process and may introduce hidden priors (if not careful). It also satisfies decision-theoretic constraints because it produces a coherent posterior.

  - **Threshold-then-Bayes Hybrid**: This approach sets a threshold for accepting evidence (e.g., only update if the expert's confidence is above a threshold) and then uses standard Bayes. The problem is that it ignores the information below the threshold. This leads to a violation of the decision-theoretic constraint because it disregards relevant information. For example, if we have two experts, one just above and one just below the threshold, we update only on the one above, ignoring the other. This can lead to dominated decisions because the agent is not using all available information. Moreover, it fails to respect second-order uncertainty because it collapses the uncertain evidence into a binary (accept/reject). Also, it may lead to dilation if the threshold is set arbitrarily.

  **The Single Desideratum that Kills the Hybrid**: The hard constraint that kills the hybrid is the **Decision-Theoretic Constraint**. The hybrid approach discards evidence that does not meet the threshold. This means the agent is not updating on all available information. In decision theory, if an agent ignores free information, they can be made to accept a series of bets that lead to a sure loss (a Dutch book). Moreover, in a situation where the evidence below the threshold is actually highly informative (e.g., an expert with 49% confidence in a binary event when the threshold is 50%), the agent's posterior will be suboptimal and may lead to a dominated action. The hybrid approach violates the requirement of total evidence (use all available information) and thus fails to be decision-theoretically coherent.

  Therefore, the two-stage Bayesian model is the most promising, though it requires careful modeling. The hybrid is decisively ruled out by the decision-theoretic constraint.
answer: |-
  ### Full Spec for Rational Belief Revision Under Genuinely Uncertain Evidence

  The theory must handle ambiguous, conflicting, or unreliable evidence (e.g., overlapping expert confidence ranges for a medical diagnosis) without collapsing into standard Bayesian or Jeffrey conditioning. Below are the core desiderata, categorized as **hard constraints** (necessary for rationality) or **camp preferences** (pragmatic or methodological choices). I then score three approaches and identify the fatal flaw in the hybrid view.

  ---

  #### **Desiderata: Cases, Distinctions, and Constraints**

  1. **Avoiding Dilation (Hard Constraint)**  
     - **Why**: Dilation occurs when ambiguous evidence (e.g., conflicting 60% and 70% confidence intervals) widens your belief intervals, making you *less* certain post-update. This violates rationality—evidence should never *reduce* precision without justification. Example: Two experts disagree on a disease prognosis; updating should not make your 90% CI become 50% if the conflict is resolvable.  
     - **Constraint Type**: Hard. Dilation leads to incoherent decisions (e.g., refusing bets you should accept).

  2. **Respecting Second-Order Uncertainty (Hard Constraint)**  
     - **Why**: You must distinguish uncertainty about the *world* (e.g., "Is the patient sick?") from uncertainty about the *evidence itself* (e.g., "How reliable is Expert A's range?"). Ignoring this conflates epistemic states and over- or under-weights evidence. Example: Conflicting experts may have correlated biases; updating must account for doubt in their judgments.  
     - **Constraint Type**: Hard. Rational agents track meta-uncertainty to avoid double-counting or ignoring error dependencies.

  3. **Not Collapsing into Naive Averaging (Hard Constraint)**  
     - **Why**: Simple averaging of expert opinions (e.g., mean confidence) disregards reliability, correlations, or context. Example: If Expert A is usually overconfident and Expert B underconfident, averaging their 60% and 70% ranges may yield a worse estimate than either.  
     - **Constraint Type**: Hard. Averaging violates the **Principle of Total Evidence**—you must weight evidence by its credibility.

  4. **Distinguishing World vs. Evidential Uncertainty (Hard Constraint)**  
     - **Why**: Uncertainty about the world (first-order) is what you update; uncertainty about evidence (e.g., "Did I mishear the expert?") requires modeling the evidence-generation process. Blurring these leads to "update loops" where evidence confuses itself.  
     - **Constraint Type**: Hard. Necessary for consistent belief representation (e.g., to avoid regress in self-doubt).

  5. **Decision-Theoretic Coherence (Hard Constraint)**  
     - **Why**: Updated beliefs must form a valid probability distribution to avoid Dutch books (arbitrage). Actions based on beliefs must satisfy dominance: if option A is better than B in all states, you must not choose B.  
     - **Constraint Type**: Hard. Non-negotiable for rationality—violations imply systematic loss.

  6. **Locality of Update (Camp Preference)**  
     - **Why**: Some argue updates should depend *only* on the prior and local evidence (e.g., Jeffrey's rule), without global model assumptions. Others permit latent variables (e.g., expert reliability).  
     - **Preference Type**: Camp. Favors simplicity but may limit expressiveness in complex cases.

  7. **No Hidden Priors (Camp Preference)**  
     - **Why**: Priors for evidence-reliability parameters (e.g., expert accuracy) should be explicit, not buried in the update rule. Hidden priors risk ad hoc adjustments.  
     - **Preference Type**: Camp. Promotes transparency but may require more modeling.

  ---

  #### **Approach Scoring Against Desiderata**
  - **Jeffrey Conditionalization**:  
    - **Handles**: Locality (preference), no hidden priors (preference).  
    - **Fails**: Avoid dilation (hard—often dilates with ambiguous partitions), second-order uncertainty (hard—no mechanism to model evidence reliability), naive averaging (hard—treats evidence as fixed weights).  
    - **Verdict**: Unsuitable. Requires precise likelihoods; crumbles under uncertain evidence.

  - **Two-Stage Bayesian Model**:  
    - **Mechanics**: Stage 1 models evidence generation (e.g., expert reliability as latent variables); Stage 2 updates world-beliefs using this model.  
    - **Handles**: All hard constraints. Avoids dilation (reliability priors stabilize intervals), second-order uncertainty (explicit reliability parameters), naive averaging (weights experts by inferred accuracy), world/evidence distinction (separate stages), decision coherence (yields valid posteriors).  
    - **Fails**: Locality (preference—requires global evidence model), hidden priors (preference—reliability priors may be implicit).  
    - **Verdict**: Best for hard constraints. Cost: complex modeling.

  - **Threshold-then-Bayes Hybrid**:  
    - **Mechanics**: Discard evidence below a confidence threshold (e.g., only use expert ranges >65%); run Bayes on the rest.  
    - **Handles**: Locality (preference—simple for "clean" evidence).  
    - **Fails**:  
      - Avoid dilation (hard—thresholds amplify noise, causing erratic intervals).  
      - Second-order uncertainty (hard—ignores reliability of sub-threshold evidence).  
      - Not naive averaging (hard—arbitrarily drops evidence).  
      - Decision coherence (hard—violates dominance; see below).  

  ---

  #### **The Fatal Flaw: Decision-Theoretic Coherence (Hard Constraint)**  
  **Why it kills the hybrid**: The hybrid violates **stochastic dominance**. By discarding sub-threshold evidence (e.g., an expert's 55% confidence), it ignores information that could alter decisions. Consider:  
  - **Scenario**: You must choose a treatment (A or B) for a disease. Expert X (60% confidence) suggests A; Expert Y (55%) suggests B. With a 60% threshold, you only use X and choose A.  
  - **Problem**: If Y’s 55% is based on critical data (e.g., side effects), ignoring it may lead to a dominated choice—e.g., A could be worse *in all scenarios* Y considered. This opens Dutch books: a bookie can exploit your systematic omission of evidence.  
  - **Why hard constraint**: Rationality requires using *all* relevant evidence; arbitrary thresholds force suboptimal decisions. The hybrid’s simplicity is illusory—it pretends ambiguity is resolved by ignoring it, violating the Principle of Total Evidence.  

  **Defense**: Even if thresholds are "pragmatic," they are irrational when evidence is genuinely uncertain (e.g., expert confidence ranges). Decision theory demands *responsiveness* to all information; the hybrid’s censorship creates exploitable blind spots. No amount of threshold-tuning fixes this—it’s a structural flaw.  

  ---

  #### **Conclusion**  
  For uncertain evidence, the **two-stage Bayesian model** uniquely satisfies all hard constraints by explicitly modeling evidence reliability. Jeffrey’s rule is too rigid; the hybrid is decision-theoretically incoherent. The killer desideratum is **decision-theoretic coherence**: rational agents cannot arbitrarily ignore evidence without risking dominated choices. The price is complexity—but ambiguity demands it.
