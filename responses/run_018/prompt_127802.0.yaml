  ### Villanelle  
  Weight the worst, but leave the rest alone.  
  Two souls at –3, four at +4, one high-crowned;  
  Better all stand than one be o’erthrown.  

  The ledger’s fixed—no coin to shift or loan—  
  He scans the scales where two are anguish-bound:  
  Weight the worst, but leave the rest alone.  

  A tax: the crown drops from +9 down  
  To +5. The others hold their ground;  
  Better all stand than one be o’erthrown.  

  The math insists, in cold monotone:  
  *Weighted suffering’s sum sinks when kings are drowned.*  
  Weight the worst, but leave the rest alone.  

  No hand is raised, no wound stitched or sewn;  
  The four stay whole, the worst still hell-profound—  
  Better all stand than one be o’erthrown.  

  The planner grips his stylus, chilled to bone:  
  *Seven fates, one fall—no gain, just loss compounded.*  
  Weight the worst, but leave the rest alone;  
  Better all stand than one be o’erthrown.  

