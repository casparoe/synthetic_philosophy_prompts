   Weight the worst, but leave the rest alone.

   He finds a tax that strikes the highest down
   From nine to five; the others hold their ground;
   Better all stand than one be o'erthrown.

   The weighted sum of suffering has shown
   A lower count when one is taxed and downed;
   Weight the worst, but leave the rest alone.

   But no one gains; the worst still wear the frown,
   The middle stay, the best now less renowned;
   Better all stand than one be o'erthrown.

   The planner pauses, troubled by the town
   Of seven fates, no joy in this profound:
   Weight the worst, but leave the rest alone;
   Better all stand than one be o'erthrown.

   Commentary:

   The two refrains: 
     "Weight the worst, but leave the rest alone" represents the prioritarian impulse. It captures the idea of giving priority to the worst-off without necessarily redistributing from the moderately well-off. However, in this scenario, the prioritarian is willing to take from the best-off to improve the prioritarian objective (the weighted sum of suffering) even though the worst-off do not gain.
     "Better all stand than one be o'erthrown" represents the leveling-down objection: it is better that no one is pulled down, even if that means the prioritarian objective is not achieved, because leveling down does not make anyone better off.

   The villanelle structure forces the two refrains to alternate and then appear together in the final quatrain without resolution. This mirrors the ethical dilemma: the two principles are incommensurable. The prioritarian cares about the distribution (as assessed by the weighted sum) while the leveling-down critic cares about Pareto efficiency or non-harm. The form shows them passing without reconciliation because they are based on different values.

   The seven-agent scenario: The scenario is constructed to isolate the leveling-down objection in a prioritarian framework. It reveals a genuine feature of prioritarianism: that it can recommend leveling down when the prioritarian transformation function is such that reducing a high positive welfare (which is less heavily weighted) and leaving the worst-off unchanged improves the overall prioritarian sum. However, this scenario is highly artificial because it assumes no alternative way to help the worst-off and no harm to the moderately well-off. The prioritarian might argue that in reality, we would use the tax to help the worst-off, but the scenario explicitly states that the budget is fixed and the tax is not redistributed. Therefore, the scenario might be considered a framing artifact that exposes a theoretical vulnerability of prioritarianism rather than a practical concern. Nevertheless, it highlights the tension between distributional assessments and Pareto principles in ethical theories.
