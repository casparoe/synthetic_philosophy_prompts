prompt: |-
  You are an expert in political philosophy and institutional design. Think step by step: first identify which conceptual distinctions must survive simplification, then build the reusable procedure, then stress-test it on hard cases.

  I was recently appointed to a municipal zoning appeals board that hears objections to multi-family and mixed-use developments every month. I need a thirty-minute decision procedure my board can actually run—ordered questions, what counts as sufficient answer to each, clear stop points—to determine which objections carry legitimate procedural weight under a "right to the city" framework. The framework I want to use distinguishes domiciliary standing (claims grounded in current proximity, use, and local attachment) from civic standing (claims grounded in membership in the urban polity and on distributive effects across the housing system). Because future residents who would benefit do not yet exist, assigning them any form of standing also forces an implicit choice between person-affecting and impersonal theories of justice; the procedure must flag where that choice is being made rather than hiding it.

  Please construct the procedure: the sequence of tests, which answers are factual versus normative, where it stops with "no standing," where it mandates full board deliberation because values conflict irreducibly, and where it will predictably misfire. Be honest about what it cannot settle.

  Then apply it to three proposals:

  1. A neighborhood association objects to a 40-unit affordable housing project near a historic low-rise district, citing shadow, traffic, and erosion of "neighborhood character."
  2. A renters' coalition supports the development but demands the board reject it unless 50% of units are permanently affordable, arguing that 20% falls short of distributive justice.
  3. A fifteen-year-old informal community garden—untitled, actively tended, the only green space in a dense ward—would be eliminated by a mid-rise development that increases total housing but removes the garden entirely.

  In case 1, show the procedure granting procedural weight to an objection I will personally find parochial. In case 3, show it denying weight to an objection I find morally compelling because the gardeners hold no formal title. Finally, state explicitly what the procedure cannot do—particularly regarding trade-offs between aggregate housing supply and specific, non-substitutable local goods, and regarding the standing of people who do not yet exist.
reasoning: |-
  We are building a decision procedure for a zoning appeals board under a "right to the city" framework. The framework distinguishes:
  - Domiciliary standing: claims based on current proximity, use, and local attachment.
  - Civic standing: claims based on membership in the urban polity and distributive effects across the housing system.

  The procedure must also account for the standing of future residents, which involves the tension between person-affecting theories (which only consider impacts on existing persons) and impersonal theories (which consider the creation of new persons and their well-being).

  The procedure should be runnable in about thirty minutes per case. It must have:
  - Ordered questions.
  - What counts as a sufficient answer to each.
  - Clear stop points (e.g., "no standing", "full deliberation required").
  - Flag where the choice between person-affecting and impersonal justice theories is being made.

  The procedure must also be honest about its limitations, especially regarding trade-offs between aggregate housing supply and non-substitutable local goods, and the standing of future residents.

  ---

  **Decision Procedure Structure**

  We break the procedure into stages:

  **Stage 1: Preliminary Standing Check**
     - Purpose: Quickly filter out objections that lack any basis in either domiciliary or civic standing.
     - Steps:
       1. **Question A:** Does the objection claim harm or benefit to current residents or users of the immediate area? (Domiciliary standing)
          - Factual: Evidence of current use, proximity, or attachment (e.g., residency, regular use of a facility, documented local involvement).
          - Sufficient answer: Yes, if the objector provides evidence of current use or proximity (e.g., address, photos, logs) OR if the board can verify the objector is a current resident or regular user of the affected site. If no, proceed to Question B.
       2. **Question B:** Does the objection claim harm or benefit to the broader urban community, especially in terms of housing distribution, access to opportunity, or systemic effects? (Civic standing)
          - Factual/Normative: Evidence of membership in the urban polity (e.g., city resident, organization based in the city) and a clear argument about distributive effects (e.g., how the project affects housing affordability, segregation, or access to amenities).
          - Sufficient answer: Yes, if the objector is a member of the urban polity (e.g., lives, works, or has a recognized organization in the city) AND articulates a specific systemic effect. If no, then **stop: no standing**.

     - **Stop Point**: If both A and B are "no", then the objection has no standing and is dismissed without further consideration.

  **Stage 2: Standing Validation and Conflict Identification**
     - Purpose: Validate the standing and identify if the objection is based on domiciliary or civic grounds (or both) and whether it conflicts with the interests of future residents.
     - Steps:
       1. **Question C:** If the objection passed via domiciliary standing (from A), what is the nature of the harm claimed?
          - Factual: Specific impacts (e.g., shadow, traffic, loss of green space) that are measurable and localized.
          - Sufficient answer: The objector must provide evidence of the harm (e.g., traffic studies, shadow diagrams, documentation of use). If the harm is speculative or not localized, then domiciliary standing may be weak or invalid.
          - Note: If the harm is purely about "character" without measurable impact, it may still be considered under domiciliary standing if it relates to current use and attachment, but this is normative and may require deliberation.

       2. **Question D:** If the objection passed via civic standing (from B), what is the nature of the systemic claim?
          - Normative: The objection must articulate how the project affects the distribution of goods (e.g., affordable housing, access to parks) across the city and why the current proposal is unjust.
          - Sufficient answer: A clear argument linking the project to a pattern of inequality or systemic harm/benefit. If the claim is vague or not tied to the urban system, civic standing may be weak.

       3. **Question E:** Does the objection, if upheld, potentially harm the interests of future residents (e.g., by reducing housing supply, making housing less affordable, or excluding potential residents)?
          - Factual/Normative: This requires projecting the effects of blocking or modifying the project on future residents. The board must note that this step involves an implicit choice of justice theory.
          - Sufficient answer: If the board determines that the objection, if accepted, would reduce housing opportunities for future residents (e.g., by reducing the number of units, delaying construction, or increasing costs), then this conflict is flagged.

     - **Stop Point**: 
       - If domiciliary standing is claimed but the harm is not substantiated (C fails), then no standing on domiciliary grounds.
       - If civic standing is claimed but the systemic claim is not articulated (D fails), then no standing on civic grounds.
       - If both fail, then **stop: no standing**.
       - If at least one standing is validated, and there is no conflict with future residents (E is "no" or not applicable), then the objection has standing and proceeds to full board deliberation on the merits.
       - If there is a conflict with future residents (E is "yes"), then the board must proceed to Stage 3.

  **Stage 3: Future Resident Standing and Justice Theory Flag**
     - Purpose: Explicitly address the conflict between current and future residents and force the board to acknowledge the choice of justice theory.
     - Steps:
       1. **Question F:** Can the objection be modified to reduce the harm to future residents without entirely dismissing the claim? (e.g., by mitigating the harm to current residents or adjusting the project to better serve both)
          - Factual/Normative: Explore alternatives that might reconcile the conflict.
          - Sufficient answer: If yes, then the objection may proceed to deliberation with a note that alternatives should be considered. If no, proceed to G.

       2. **Question G:** The board must explicitly choose between:
          - Option 1 (Person-affecting): Prioritize the interests of current residents (the objection stands for full deliberation) because we have no obligations to non-existent people.
          - Option 2 (Impersonal): Prioritize the interests of future residents (the objection is denied standing) because increasing housing supply and affordability for future people is a moral imperative.
          - This is a normative choice and cannot be resolved by procedure alone.

     - **Stop Point**:
       - If F is "yes", the objection has standing and proceeds to deliberation with a note to consider alternatives.
       - If F is "no", then the board must vote on G. If the board chooses Option 1, the objection has standing and proceeds to full deliberation. If Option 2, the objection is denied standing.

  **Stage 4: Full Board Deliberation**
     - If the objection has standing at any stage that does not end in "no standing", then the board moves to deliberate on the merits of the objection (which is outside this procedure).

  **Limitations of the Procedure**
  - It cannot resolve value conflicts (e.g., between preserving a local good and increasing housing supply). It only determines standing.
  - It cannot assign weights to different types of harms or benefits (e.g., how much traffic is too much?).
  - It does not address the standing of non-resident stakeholders (e.g., commuters, regional environmental groups) unless they can show current use (domiciliary) or systemic civic effects (civic).
  - It does not resolve the moral status of future residents but forces the board to acknowledge when it is making a choice that affects them.

  **Predictable Misfires**:
  - It may grant standing to objections that are NIMBYist and parochial (as in Case 1) because domiciliary standing is validated by proximity alone, even if the harm is minor or subjective.
  - It may deny standing to morally compelling claims that lack formal documentation (as in Case 3) if the objectors cannot prove current use or if the civic claim isn't articulated in systemic terms.
  - It may oversimplify the trade-off between current and future residents by forcing a binary choice.

  ---

  **Applying the Procedure to the Cases**

  **Case 1: Neighborhood association objects to 40-unit affordable housing project near a historic low-rise district, citing shadow, traffic, and erosion of "neighborhood character."**

  - Stage 1:
    - A: Yes. The association represents current residents (proximity). Domiciliary standing exists.
    - B: The objection does not make a systemic claim (unless they argue that the project harms the city's historic preservation system, but they are focusing on local impact). Civic standing not established. So, standing via A.

  - Stage 2:
    - C: The harms claimed (shadow, traffic, character) are typical domiciliary issues. They provide shadow studies and traffic reports? The board may accept that shadow and traffic are measurable, but "character" is subjective. If they have some evidence (e.g., photos of the historic district), then the harm is substantiated for standing purposes. (Note: The board might find the character claim weak, but for standing, we only require a claim of harm to current use/attachment.)
    - E: The project is affordable housing. If blocked, future residents (who would have lived there) are harmed. So, E: yes, conflict exists.

  - Stage 3:
    - F: Can the objection be modified? For example, by reducing the building height to lessen shadow? If the developer is willing to adjust, then yes. If not, then no.
      - Assume the developer is inflexible (F: no).
    - G: The board must choose:
      - Option 1 (Person-affecting): The neighborhood association's objection has standing and proceeds to full deliberation.
      - Option 2 (Impersonal): The objection is denied standing.

  - Outcome: The procedure grants standing (if the board chooses Option 1) even though the objection may be parochial. This shows how the procedure allows such objections to be heard.

  **Case 2: Renters' coalition supports the development but demands 50% permanently affordable units, arguing that 20% falls short of distributive justice.**

  - Stage 1:
    - A: The coalition may not be proximately affected (unless they have members in the area). They are renters in the city but not necessarily in the immediate area. Domiciliary standing? Probably not, unless they can show that their members use the area. (But typically, this is a systemic claim.) So, A: no.
    - B: Yes. The coalition is part of the urban polity (city renters) and makes a claim about distributive justice (arguing that 20% is insufficient to address city-wide affordability). Civic standing exists.

  - Stage 2:
    - D: They articulate a systemic claim: the project contributes to housing inequality by not providing enough affordable units. This is a valid civic standing claim.
    - E: Would their demand (50% affordable) harm future residents? It might reduce the overall financial feasibility, potentially leading to the project not being built (reducing total housing) or being built with fewer market-rate units (which cross-subsidize the affordable ones). If the board believes that requiring 50% would make the project infeasible, then E: yes (conflict). If not, then E: no.

      - Assume the board finds that 50% would likely make the project infeasible (based on developer testimony or expert reports). So, E: yes.

  - Stage 3:
    - F: Can the objection be modified? For example, by phasing in affordability or increasing public subsidies? If so, then F: yes and the objection proceeds. If not, then F: no and the board must choose between Option 1 (prioritizing the coalition's demand for more affordable units) and Option 2 (prioritizing future residents by not modifying the project).

      - Assume no feasible modification (F: no). Then the board must choose between:
        - Option 1: The coalition's objection has standing (so the board must deliberate on whether to require 50%).
        - Option 2: The objection is denied standing (so the project proceeds as proposed).

  - Outcome: The procedure forces the board to confront the trade-off between current distributive justice (for existing renters) and future housing supply.

  **Case 3: A fifteen-year-old informal community garden would be eliminated by a mid-rise development. The garden is untitled but actively tended and is the only green space in a dense ward.**

  - Stage 1:
    - A: The objectors (gardeners) are current users. They have local attachment and use the garden. They can provide evidence (photos, logs of tending, community support). Domiciliary standing exists.
    - B: They might also argue civic standing: the garden is the only green space in the ward, so its loss affects the entire ward's health and well-being. But if they don't make that argument, we focus on A.

  - Stage 2:
    - C: The harm is the loss of the garden. They can show current use (so harm is substantiated). But note: they have no formal title. The procedure does not require title; it requires evidence of current use and attachment. So, if they can show that, then the harm is substantiated.
      - However, in practice, without title, the board might question the legitimacy of the use. But the procedure only requires evidence of use, not title. So, if they have evidence (e.g., affidavits from neighbors, photos, community events held there), then C: yes.
    - E: The project increases housing. Blocking it harms future residents. Conflict exists (E: yes).

  - Stage 3:
    - F: Can the garden be preserved? For example, by integrating it into the development (e.g., rooftop garden, set aside a portion)? If yes, then F: yes and the objection proceeds. If not, then F: no and the board must choose between Option 1 (favoring the gardeners) and Option 2 (favoring future residents).

      - Assume no feasible way to preserve the garden (the site is too small, etc.). Then F: no.

      - The board must choose:
        - Option 1: The gardeners have standing and the board deliberates on whether to reject the project to save the garden.
        - Option 2: The objection is denied standing because the housing for future residents is more important.

  - Outcome: The procedure could deny standing if the board chooses Option 2 (impersonal theory), even though the garden is a non-substitutable local good. This shows a limitation: the procedure does not automatically protect non-substitutable goods if the board chooses to prioritize future residents.

  ---

  **Explicit Limitations Recap**

  The procedure cannot:
  1. Resolve the inherent tension between aggregate housing supply and specific, non-substitutable local goods (like the garden). It only determines standing and then forces the board to make a choice in Stage 3 (which may sacrifice one for the other).
  2. Assign standing to future residents directly. They are only considered as a counterweight to objections that would harm them.
  3. Settle the normative debate between person-affecting and impersonal theories of justice. It forces the board to choose when the conflict arises.
  4. Address the merits of the objection beyond standing. The board must still deliberate on the substance after standing is granted.
  5. Handle cases where the harm is diffuse or where standing is based on non-resident status (e.g., environmental impacts beyond the city).

  Thus, the procedure is a tool for structuring the standing decision, not for resolving the underlying moral and policy dilemmas.
answer: |-
  ### Decision Procedure for Zoning Appeals Board: "Right to the City" Framework  
  This 30-minute procedure evaluates objections to developments under a **"right to the city"** framework. It prioritizes clarity, efficiency, and transparency by:  
  - **Distinguishing standing types**: Domiciliary (proximity/use-based) vs. civic (systemic/membership-based).  
  - **Flagging justice theory conflicts**: Explicitly surfaces trade-offs between person-affecting justice (only existing people matter) and impersonal justice (future people matter).  
  - **Stopping early** where standing is invalid, **mandating deliberation** for irreducible conflicts, and **admitting limitations**.  

  **Key Structure**:  
  1. **Sequential tests** with binary outcomes (yes/no).  
  2. **Time limits**: 5 min per test, 10 min for deliberation mandates. Total: 25–30 min.  
  3. **Sufficient answers**: Factual claims require evidence; normative claims require reasoned arguments.  
  4. **Stop points**: Dismiss if no standing; escalate to deliberation if standing validated or values conflict.  

  ---

  #### PROCEDURE: 4 STEPS  
  **Step 1: Establish Objector’s Standing**  
  *(5 min; focuses on the objector’s legitimacy)*  
  - **Question 1A (Domiciliary Standing)**: Does the objector have current, direct proximity to or use of the affected site?  
    - *Sufficient answer (factual)*: Evidence of residency, ownership, or documented regular use (e.g., utility bills, activity logs). Subjective claims (e.g., "character") do not count alone.  
    - *If YES*: Proceed to Step 2.  
    - *If NO*: Go to Question 1B.  
  - **Question 1B (Civic Standing)**: Is the objector part of the urban polity, and does the claim address systemic distributive effects (e.g., housing justice, equity)?  
    - *Sufficient answer (normative)*: Proof of membership (e.g., city residency, organizational charter) + argument linking the development to city-wide patterns (e.g., segregation, affordability).  
    - *If YES*: Proceed to Step 2.  
    - *If NO*: **STOP. NO STANDING**. Objection dismissed.  

  **Step 2: Validate Harm Claim**  
  *(5 min; focuses on the objection’s substance)*  
  - **Question 2A (Domiciliary Harm)**: If standing is domiciliary, is the claimed harm concrete and localized (e.g., shadow, noise, loss of amenity)?  
    - *Sufficient answer (factual)*: Evidence of quantifiable impact (e.g., traffic studies, sunlight diagrams). "Character" claims require proof of material effect (e.g., property devaluation).  
  - **Question 2B (Civic Harm)**: If standing is civic, is the claimed harm systemic and distinct from domiciliary interests?  
    - *Sufficient answer (normative)*: Argument showing how the development exacerbates city-wide injustice (e.g., "20% affordable units deepen segregation").  
  - *Outcomes*:  
    - If harm validated: Proceed to Step 3.  
    - If harm invalid: **STOP. NO STANDING**.  

  **Step 3: Flag Future Resident Conflict**  
  *(5 min; forces justice theory choice)*  
  - **Question 3**: Would upholding the objection harm potential future residents (e.g., by reducing housing supply, affordability, or access)?  
    - *Sufficient answer (factual)*: Projections based on development plans (e.g., units added, affordability levels). Board must state assumptions.  
    - *If NO*: Proceed to Step 4.  
    - *If YES*: **Escalate to deliberation**. Board must explicitly choose:  
      - **Person-affecting justice**: Favor existing residents (objection proceeds).  
      - **Impersonal justice**: Favor future residents (objection forfeits standing).  
      - *Deliberation mandate*: 10-min debate + vote. Outcome determines standing.  

  **Step 4: Assign Procedural Weight**  
  *(5 min; final determination)*  
  - **Question 4**: Is the harm claimed non-substitutable (e.g., unique public good) or mitigable?  
    - *Sufficient answer (normative)*: Argument why alternatives (e.g., compensatory green space) fail.  
    - *Outcomes*:  
      - If standing validated: **Escalate to deliberation** for full merits debate.  
      - If substitutable/mitigable: Objection has weight but may be balanced in deliberation.  
      - If no standing: **STOP**.  

  ---

  #### PREDICTABLE MISFIRES & LIMITATIONS  
  - **Misfires**:  
    - Grants weight to parochial domiciliary claims (Step 1A) even if normatively weak.  
    - Denies weight to untitled/local goods (Step 2A) if evidence is informal, regardless of moral weight.  
  - **Cannot Settle**:  
    - **Trade-offs**: Cannot resolve conflicts between aggregate housing supply and non-substitutable local goods (e.g., historic gardens). This requires political judgment.  
    - **Future residents**: Assigns no direct standing; only flags conflicts (Step 3). Choice between justice theories is subjective.  
    - **Systemic justice**: Cannot quantify "fair" affordable housing levels (Step 2B); only tests if claim is coherent.  
  - **Honest Constraints**:  
    - **Evidence bias**: Favors formal/wealthier claimants (e.g., titled owners over informal gardeners).  
    - **Speed-cost**: Oversimplifies complex harms (e.g., "character" as material vs. cultural).  

  ---

  ### APPLICATION TO CASES  
  **Case 1: Neighborhood Association vs. 40-Unit Affordable Project**  
  - *Claim*: Shadow, traffic, "neighborhood character."  
  - **Step 1A**: YES. Association members own homes near the site (proximity proven). Domiciliary standing.  
  - **Step 2A**: YES. Traffic studies provided; "character" linked to property values (material harm argued).  
  - **Step 3**: YES. Blocking project harms future residents (fewer affordable units).  
    - *Deliberation mandate*: Board chooses person-affecting justice (prioritizes existing residents).  
  - **Step 4**: Harm is mitigable (e.g., traffic calming), but standing validated.  
  - **Outcome**: **Procedural weight granted**. Demonstrates how parochial claims advance.  

  **Case 2: Renters’ Coalition Demands 50% Affordable Units**  
  - *Claim*: 20% affordable units are distributively unjust.  
  - **Step 1A**: NO. Coalition members city-wide, not site-proximate.  
  - **Step 1B**: YES. Coalition is city-based; claim addresses systemic equity (civic standing).  
  - **Step 2B**: YES. Argument links low affordability to city-wide segregation (normative harm).  
  - **Step 3**: YES. Requiring 50% may reduce feasibility, harming future supply.  
    - *Deliberation mandate*: Board chooses impersonal justice (future residents prioritized), denying standing.  
  - **Outcome**: **No standing** (if board chooses impersonal justice). Conflict surfaced; civic claim overridden by future needs.  

  **Case 3: Informal Community Garden vs. Mid-Rise Development**  
  - *Claim*: Loss of only green space in a dense ward.  
  - **Step 1A**: YES. Gardeners provide usage logs and community testimonials (current use proven).  
  - **Step 2A**: NO. No title/deed; harm is non-material (cultural/social). Insufficient for domiciliary harm.  
  - **Step 1B**: YES. Garden is ward’s sole green space (systemic good). Civic standing.  
  - **Step 2B**: YES. Loss exacerbates urban "green deserts" (distributive harm argued).  
  - **Step 3**: YES. Blocking development reduces housing, harming future residents.  
    - *Deliberation mandate*: Board chooses impersonal justice.  
  - **Outcome**: **No standing**. Illustrates procedure’s formal bias against untitled, non-material goods.  

  ---

  ### EXPLICIT LIMITATIONS  
  The procedure **cannot**:  
  1. **Resolve fundamental trade-offs**: Between aggregate housing supply (e.g., city-wide shortage) and specific, non-substitutable local goods (e.g., historic gardens, community spaces). This requires political negotiation.  
  2. **Assign standing to future residents**: They are only a counterweight in Step 3. The choice between person-affecting and impersonal justice is left open.  
  3. **Quantify "fair" distribution**: Civic claims (e.g., Case 2’s 50% demand) are tested for coherence, not optimality.  
  4. **Override legal constraints**: Formal title trumps informal use (e.g., Case 3).  
  5. **Address regional/global effects**: Only city-scale distributive claims qualify for civic standing.  

  **Use Case**: This procedure ensures objections are efficiently triaged, values conflicts are exposed, and deliberation focuses on high-stakes disputes. It is a tool for legitimacy, not wisdom.
