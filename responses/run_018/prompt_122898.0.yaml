prompt: |-
  I'm revising a paper on pragmatic encroachment ahead of a workshop, and before I commit to the view in print I'd like an audit of the position as a whole rather than of any single claim in it. Here is roughly where I have landed.

  (1) The bank-style pairs are genuine data. Hold fixed the subject's evidence, the truth of the proposition, and how reliably the belief was formed, and vary only what is at stake for her: the verdict on whether she knows varies with the stakes. So some practical factor bears on whether a subject knows.

  (2) What bears on it is what is at stake for the subject, not for whoever is attributing knowledge. The cases I am least willing to give up are the third-person ones, where a speaker who has nothing at stake attributes knowledge to an agent who has a great deal at stake, and my intuition is that it is the agent's stakes and not the speaker's conversational situation that do the work.

  (3) I also want a contextualist semantics: the standards an attribution of knowledge must meet are set by the attributor's context, which is what lets me treat skeptical denials and ordinary ascriptions as each true in their own context rather than as one of them being an error. I know (2) and (3) are usually presented as rivals, but I suspect the rivalry is overstated: in the first-person bank cases subject and attributor coincide, so both accounts predict the same verdicts, and a contextualist can simply say that attributors normally track the practical situation of the subject they are talking about. So I would like to keep both.

  (4) Justification is evidentialist. It supervenes on the subject's evidence, and the two subjects in a bank pair are justified to exactly the same degree. Whatever stakes do, they do not make anyone better or worse justified.

  (5) The structure of knowledge is justified true belief plus an anti-luck condition. I do not think there is a further practical-adequacy clause, and I do not want to add one merely in order to make (1) come out true.

  (6) What drew me to (1) in the first place is the normative role of knowledge: knowledge is the norm of practical reasoning, in the sense that a subject may treat p as a reason for acting only if she knows that p. That is why it has never struck me as odd that practical facts should show up in the conditions on knowledge.

  (7) Finally, I want knowledge to be stable enough to do the work I need from it. Whether a subject knew something at noon is not, I think, the sort of thing that can be undone by how things stand later in the day, and I do not want a view on which knowledge flickers in and out as the practical environment shifts.

  What I would like from you: work through these and tell me which pairs actually pull against each other, how badly, and which pairs only appear to. Rank the genuine tensions by severity rather than treating them as equally serious, and for each one say what would have to be given up and what giving it up would cost me elsewhere in the set. If a single revision would clean up more than one of them, say which. One request: please don't answer by telling me which of these claims the literature happens to favour, or which names are attached to them. What I cannot see from the inside is what my own combination commits me to.
reasoning: |-
  Okay, the user is deep into a paper on pragmatic encroachment and wants an audit of their position. They've laid out seven key claims and want to know where tensions exist, how severe they are, and what trade-offs would be involved in resolving them. Importantly, they don't want literature surveys—they want internal coherence checks.  

  First, I need to map their core commitments:  
  (1) Stakes really do affect knowledge (pragmatic encroachment is real).  
  (2) It's the subject's stakes that matter, not the attributor's—even in third-person cases.  
  (3) But they also want contextualism about knowledge attributions (attributor's context sets standards).  
  (4) Justification is purely evidential—no practical factors.  
  (5) Knowledge = JTB + anti-luck, no extra "practical adequacy" clause.  
  (6) Knowledge is the norm of practical reasoning (KNPR).  
  (7) Knowledge should be stable over time despite practical shifts.  

  The biggest red flag is the combination of (2) and (3). Contextualism typically makes the attributor's context sovereign, but (2) insists the subject's stakes drive the truth conditions. The user suggests attributors "normally track" the subject's situation, but that’s a descriptive claim—it doesn’t fix the semantics. If an attributor ignores the subject's stakes (e.g., a careless bystander), does their knowledge attribution suddenly become false? That violates (2). Worse, if the attributor is in a skeptical context, their high standards might override the subject's low-stakes situation, making (2) irrelevant. This is a structural clash, not just an oversight.  

  Then there’s the tension between (1)/(2) and (4). If stakes affect knowledge but not justification, and knowledge requires justification, how do practical factors get in? The user rejects adding a practical condition to knowledge (per (5)), so they need a story about how stakes modulate the existing conditions. The anti-luck condition (5) is usually understood epistemically (e.g., safety, sensitivity), not practically. If high stakes don’t make beliefs less safe or sensitive—just more costly if wrong—how does that convert into a knowledge blocker? This gap feels unresolved.  

  (6) (KNPR) is central to their motivation but interacts oddly with (7). If knowledge is stable, but KNPR says you can only act on what you know, then in high-stakes scenarios, subjects might lose knowledge (per (1)) and thus lose warrant to act. But later, when stakes drop, they "regain" knowledge and can act again. The user insists knowledge doesn't "flicker" (7), but this setup implies it does—unless they bite the bullet and say the subject never knew in the first place. That’s a cost to (1)'s intuitiveness.  

  Severity ranking:  
  - **Tier 1 (structural):** (2) vs. (3). Can't have both without ad hoc fixes. Dropping (3) loses contextualism’s solution to skepticism; dropping (2) abandons third-person stakes cases.  
  - **Tier 2 (explanatory gap):** (1)/(2) vs. (4)/(5). How do stakes affect knowledge without touching justification or adding a practical condition? This needs new machinery.  
  - **Tier 3 (stability vs. normativity):** (1) vs. (7) given (6). If knowledge is the action norm and stakes modulate it, stability is hard to preserve.  

  Possible fixes:  
  - **For (2)/(3):** Ditch contextualism for subject-sensitive invariantism (SSI). But then skepticism bites harder—ordinary claims like "I know I have hands" become false in high-stakes contexts.  
  - **For the justification gap:** Consider letting stakes affect the *degree* of justification required, but that violates (4)’s evidentialism. Or reinterpret "anti-luck" practically, but that stretches (5).  
  - **For stability:** Argue that knowledge, once gained, is irrevocable by stakes changes. But then how does (1) hold? You’d need to say knowledge is sensitive to stakes *at formation time only*. That’s unusual but not incoherent.  

  The user’s KNPR commitment (6) is doing heavy lifting. If they softened it (e.g., "justified belief" suffices for action in low stakes), some pressure lifts—but that’s a big retreat. Alternatively, decouple KNPR from the encroachment motivation, but that undermines their original draw to (1).  

  Biggest takeaway: The (2)/(3) conflict is the most urgent. Everything else might be negotiable with tweaks, but this one demands a choice. If they keep both, they’ll need a hybrid theory where attributor context sets parameters *within which* subject stakes operate—but that’s uncharted territory and might look contrived.
answer: |-
  Here's an audit of your position, identifying tensions by severity and the trade-offs involved in resolving them. I've focused solely on internal coherence, bracketing external literature or popularity.

  ### **Tier 1: Structural Conflicts (Threaten Core Coherence)**
  #### **(2) vs. (3): Subject-Sensitive Truth vs. Attributor Contextualism**  
  - **Conflict**: (2) requires that the *subject’s* stakes determine whether they know. (3) requires that the *attributor’s* context sets the standards for knowledge attributions. These are incompatible when attributors discuss subjects in divergent practical situations.  
  - **Why irreconcilable?**  
    - If an attributor in a low-stakes context says "S knows the bank is open" about a high-stakes subject S, (2) demands this attribution be false (due to S’s stakes), but (3) could render it true (if the attributor’s context sets low standards).  
    - Your proposal that "attributors normally track the subject’s stakes" is descriptive, not semantic. It doesn’t resolve cases where they *don’t* track it (e.g., an ignorant attributor). Contextualism makes truth *contingent on the attributor’s situation*, not the subject’s.  
  - **Trade-offs**:  
    - **Drop (3)**: Lose contextualism’s solution to skepticism. You’d need an error theory for skeptical denials (e.g., they’re strictly false but pragmatically warranted).  
    - **Drop (2)**: Abandon the third-person cases you value. Stakes become relevant only via the attributor’s context, making knowledge "perspectival" in a way that conflicts with (2)’s realism about subject-stakes.  
    - **Cost**: This is the most severe tension. Keeping both requires redefining contextualism as a *pragmatic* (non-truth-conditional) effect or adopting a non-standard hybrid semantics, which may lack systematicity.  

  ---

  ### **Tier 2: Explanatory Gaps (Undermine Theoretical Grounding)**
  #### **(1)/(2) vs. (4)/(5): How Stakes Affect Knowledge Without Affecting Justification or Adding a Condition**  
  - **Conflict**: (1)/(2) say stakes affect knowledge. (4) says justification is purely evidential and identical in stakes-pairs. (5) says knowledge is JTB + anti-luck with *no practical clause*. But if evidence, truth, belief, and anti-luck conditions are identical for two subjects, what explains the difference in knowledge? Stakes must modulate one of these conditions, but (4) and (5) block this.  
  - **Why problematic?**  
    - Without a practical condition (per (5)), and with justification identical (per (4)), the anti-luck condition (e.g., safety, sensitivity) is the only remaining lever. But anti-luck conditions are typically *epistemic* (e.g., sensitivity to truth), not practical. High stakes don’t make beliefs more prone to error or less safe; they raise the *cost* of error.  
    - **Result**: Stakes lack a mechanism to affect knowledge. This risks rendering (1) brute or unmotivated by your other commitments.  
  - **Trade-offs**:  
    - **Revise (4)**: Allow stakes to affect justification (e.g., "pragmatic justification"). But this violates your evidentialism and collapses the distinction between epistemic and practical reasons.  
    - **Revise (5)**: Add a practical condition (e.g., "actionable adequacy"). But you explicitly reject this as ad hoc.  
    - **Least costly fix**: Reinterpret the **anti-luck condition** pragmatically. For example: a belief is "safe" only if it’s formed in a way that minimizes *practical risk*, not just epistemic risk. This coheres with (6) but strains the standard epistemic reading of "anti-luck."  

  #### **(1)/(6) vs. (7): Stability vs. Normative Role**  
  - **Conflict**: (6) says knowledge is the norm of action: you can act on *p* only if you know *p*. (1) says knowledge depends on stakes. (7) says knowledge can’t "flicker" with practical changes. But if stakes shift (e.g., a low-stakes noon decision becomes high-stakes at 5 PM), (6) and (1) imply that earlier knowledge could license actions that later become impermissible (if knowledge is lost), or worse, that you lose warrant for *past* actions.  
  - **Why problematic?**  
    - If knowledge at *t* is stable (per (7)), then a subject who knew *p* at noon can permissibly act on *p* at 5 PM even if stakes rise. But (6) requires *current* knowledge to act, so acting on past knowledge when stakes are high violates (6).  
    - If knowledge is lost when stakes rise, (7) is violated. If not, (1) is weakened (stakes don’t always affect knowledge).  
  - **Trade-offs**:  
    - **Drop (7)**: Allow knowledge to be lost when stakes rise. This preserves (1) and (6) but at the cost of stability. Past knowledge attributions become context-sensitive: "S knew at noon" may be false in high-stakes contexts.  
    - **Revise (6)**: Weaken KNPR (e.g., "knowledge *or* formerly known propositions"). But this dilutes the normative role of knowledge.  
    - **Least costly fix**: Restrict (1) to *prospective* knowledge. Knowledge at *t* is sensitive to stakes *at t* but, once gained, is stable for later actions. This requires rethinking (6) for actions based on past knowledge.  

  ---

  ### **Tier 3: Apparent Tensions (Resolvable with Clarification)**
  #### **(3) vs. (6): Contextualism and the Norm of Action**  
  - **Apparent conflict**: If knowledge attributions are context-sensitive (3), how can knowledge be a stable norm for action (6)? If "S knows *p*" is true in low- but not high-stakes contexts, can S act on *p*?  
  - **Resolution**: Contextualists often argue that the *norm itself* is context-sensitive: you may act on *p* iff you meet the epistemic standards of *your current context*. This aligns with (3) and (6), though it may clash with (7) if contexts shift. No revision needed if you accept that the action norm is context-relative.  

  #### **(4) vs. (6): Evidentialism and the Action Norm**  
  - **Apparent conflict**: If justification is purely evidential (4), why is *knowledge* (not just justification) the norm of action (6)?  
  - **Resolution**: Your view implies that justification is necessary but insufficient for action—knowledge adds an anti-luck condition (5) that pragmatically constrains action. This is consistent if you argue that *merely justified* true beliefs can still be lucky, and luck undermines actionable warrant. No revision needed.  

  ---

  ### **Summary of Recommendations**
  1. **Most urgent**: Resolve the **(2)-(3)** conflict. Dropping (3) (contextualism) simplifies your view but forces an error theory for skepticism. Dropping (2) weakens your stakes-based cases. A hybrid approach (e.g., attributor context sets a *range* of admissible standards, with subject-stakes selecting within it) is possible but untested.  
  2. **Key explanatory gap**: Address **how stakes affect knowledge** given (4) and (5). Reinterpreting the anti-luck condition pragmatically (e.g., "safety" includes practical risk) resolves this without adding clauses, preserving (1), (4), and (5).  
  3. **Stability fix**: Limit (1) to knowledge *at the time of formation*, decoupling it from later stakes shifts. This saves (7) and (6) for past knowledge, but requires clarifying that KNPR applies to *current* knowledge for *immediate* actions.  

  **Final note**: Your commitment to (6) (KNPR) is the linchpin. It justifies pragmatic factors in knowledge (1) and explains why anti-luck might be pragmatic. If you retain it, the other tensions become manageable with targeted revisions. Sacrificing (6) would unravel your motivation for (1) and (2).
