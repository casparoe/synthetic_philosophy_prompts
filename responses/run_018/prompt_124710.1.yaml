answer: |-
  1. Algorithmic probability isn't arbitrary—it's the *only* prior that doesn't converge slower than any computable method for predicting deterministic sequences, per Solomonoff induction's optimality theorems.  
  2. Flat weighting over observer-moments is *malignantly uncomputable*: it requires summing over an undefined set of "observer-moments" across infinitely many branches, inviting paradoxes like presuming measure where physics doesn't specify it.  
  3. Simplicity-weighting grounds chance in *actual physical regularities*: compressible macro-level patterns (e.g., quantum statistics) emerge from underlying deterministic laws, and deference targets those robust regularities, not brute microstates.  
  4. Indexical uncertainty alone doesn't resolve *which reference class* matters; compressed chance objectively weights branches by their algorithmic salience, avoiding anthropic bias toward observers in complex, low-measure regions.  
  5. Rejecting simplicity-weighting collapses to skepticism: without privileging compressible structures, you couldn't even justify expecting the sun to rise tomorrow, as all chaotic or incompressible histories would swamp your predictions.
