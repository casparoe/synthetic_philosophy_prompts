  We are designing an in-class game for a philosophy seminar on embedded agency. The goal is to create an activity where participants are both agents within a system and rule-makers for that system. The rules they create apply immediately to themselves, and they must coordinate on a shared prediction about the system's state, which includes themselves. We want them to experience the loop of being embedded.

  Game Concept: "The Self-Referential Prediction Game"

  Overview:
  - Participants are part of a system that has a "state" represented by a grid on the whiteboard.
  - Each participant has an index card with a unique identifier (e.g., a letter or number) and a marker (e.g., a token) that they can place on the grid.
  - The grid represents a shared environment. The state of the grid at any time is the arrangement of markers and any written rules.
  - The group must predict the state of the grid at a future time (say, 10 minutes from the start of the game) and write that prediction collectively. However, they are changing the state by their actions (moving markers, making rules) and by the act of making the prediction itself (if we design it to be part of the state).

  Key twist: The prediction they make is also part of the system's state. So, the state they are trying to predict includes the prediction they are making. This creates a self-referential loop.

  Materials:
  - Whiteboard with a grid drawn (e.g., 5x5 grid). Label the rows and columns (A-E and 1-5).
  - Index cards (one per participant) with a unique symbol or letter (e.g., A, B, C, ...). Also, on each card, there is a starting position for that participant (assigned randomly at the beginning).
  - Markers for the whiteboard (to place tokens and write rules and the prediction).
  - Tokens (could be sticky notes or magnets) with the same symbols as the index cards.

  Setup (10 minutes):
  1. Draw a grid on the whiteboard (5x5). Label the axes.
  2. Assign each participant an index card with a unique letter and a starting position (e.g., "A: B3"). Also, give each participant a token with their letter.
  3. Place the tokens on the grid at the starting positions.
  4. Explain that the state of the system is defined by:
     - The positions of all tokens on the grid.
     - The set of rules written on the whiteboard (initially empty).
     - The current time (we will have a clock).
     - The official prediction (which will be written in a designated area).

  Rules of the Game:
  - The game will run for 10 minutes of real time. At the end, we check the state against the prediction.
  - Participants can propose rules. A rule must be proposed by a participant and then voted on by the group (simple majority). If passed, the rule is written on the board and takes effect immediately.
  - Rules can be about:
    - How tokens can move (e.g., "On a vote, any token can be moved to an adjacent cell", or "Every minute, all tokens move one cell to the right").
    - How the prediction is made (e.g., "The prediction must be made by 5 minutes into the game", or "The prediction must be written in a specific format").
    - Anything else, but note: rules can also be about changing the rules (meta-rules) or about the prediction process.
  - Participants can also move their own token at any time, but only if a rule allows it. (Initially, without any movement rule, they cannot move. So they must pass a movement rule first.)
  - The prediction: At any time, the group can decide to write a prediction. The prediction must specify the exact state of the grid at the end of the game (i.e., the positions of all tokens) and the set of rules that will be in effect at the end. However, note that the act of writing the prediction might change the state (if the prediction is part of the state). Therefore, we must decide: is the prediction part of the state?

  We must make the prediction part of the state to create the loop. So the state at time t includes:
     - The grid configuration (positions of tokens)
     - The set of rules in effect
     - The official prediction (if one has been made) OR the fact that no prediction has been made.

  Thus, when they write a prediction, they are changing the state. This is crucial.

  Timeline for 75-minute session:
  1. Introduction (10 min): Explain the concept of embedded agency and the goal of the game. Set up the grid and assign roles.
  2. Game Setup (5 min): Assign starting positions and hand out materials.
  3. Game Rules Explanation (5 min): Explain the rules (as above) and emphasize that they can propose and vote on rules, and that the state includes the prediction.
  4. Game Play (15 min): The actual game runs for 10 minutes, but we budget 15 to allow for discussion and voting. During the game, the facilitator keeps time and notes. The facilitator does not intervene except to enforce the rules (e.g., if a rule is passed, enforce it; if a vote is called, run the vote).
