prompt: |-
  Build me a thought experimetn — realistic, not sci-fi — that pits Berkeley's token-view of money (it's just a conventional counter for labor, the material itself has no intrinsic value) against a hard commodity view (the value is literally in the gold or silver). Use a small-scale setting like an isolated coastal trading post that carves perishable driftwood tokens and tracks all debts in a communal song everyone memorizes. Engineer the case so Berkeley's view correctly predicts that wealth and obligations survive intact when the tokens rot away but the song remains, and collapses entirely when the song is forgotten even though piles of tokens sit in a warehouse; meanwhile the commodity view should botch both verdicts. After the scenario (keep that part to one paragraph), do the check in a second paragraph: state each theory's verdict and why, point to the exact feature isolating token-value from material-substance, and say how a commodity-money defender would try to break your case. Hard limit: under 400 words total, no citations or reading lists, dont quote specific texts verbatim, and make sure the scenario isn't just stipulating the answers but actually generating them from the two theories.
reasoning: |-
