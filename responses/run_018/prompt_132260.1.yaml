  I need to design a scenario where driftwood tokens represent value and a communal song tracks debts. The key elements are that when tokens rot but the song remains, wealth survives - which should validate Berkeley. And when the song is forgotten despite tokens existing, wealth collapses - which should invalidate the commodity view. The commodity view should get both cases wrong.

  For the setting, I'll create Seal Cove - an isolated trading post where they carve symbols on driftwood tokens to represent labor credits. They have a communal song that everyone memorizes to track who owes what to whom. This makes the tokens purely symbolic counters while the song is the real ledger.

  In the first scenario: After a storm, the tokens rot away but the community remembers the song. Trade continues normally because obligations are intact - supporting Berkeley. The commodity view would mistakenly think wealth is destroyed with the tokens.

  In the second scenario: A generation later, the song is forgotten in a cultural shift, even though tokens are preserved in a warehouse. Trade collapses as no one knows who owes what - supporting Berkeley. The commodity view would incorrectly assume the tokens still have value.

  For the check paragraph, I'll clearly state each theory's verdicts and why they succeed or fail. Berkeley succeeds because it recognizes the tokens are merely symbolic representations, while the commodity view fails by conflating material with value. I'll also include how a commodity theorist might argue against this by claiming the tokens themselves are the real store of value, not the song.

  I need to keep this under 400 words total, avoid citations or quotes, and make sure the scenario naturally generates the outcomes rather than just stating them. The thought experiment should be realistic without sci-fi elements, focusing on how social conventions create money's value rather than the material itself.
answer: |-
  **Scenario:** At Seal Cove, an isolated trading post, labor and goods are exchanged using carved driftwood tokens. Each token represents one day's standard labor. Crucially, the community collectively memorizes a complex song detailing every individual's net obligations – who owes tokens to whom, based on past trades. The tokens themselves, carved from abundant, perishable driftwood, are merely convenient physical counters during transactions but hold no inherent value; the *song* is the true ledger. After a severe storm, seawater floods the storage hut, rotting all tokens into pulp. However, the community remembers the song perfectly. Trade resumes immediately using new driftwood tokens carved on the spot, referencing the remembered obligations. Decades later, after gradual cultural change, the communal song is entirely forgotten. A warehouse full of meticulously preserved tokens from the old system is discovered, but no one knows who issued them or to whom they are owed. Trade based on these tokens collapses; they are seen as worthless curiosities.

  **Theory Check:** Berkeley's token-view correctly predicts both outcomes: wealth (the network of obligations) survives the physical destruction of the tokens because the information (the song/ledger) persists. Wealth vanishes when the information (the song) is lost, rendering the material tokens meaningless counters without context. The song isolates the token's *conventional value* (representing labor/debt) from the driftwood's material substance. The commodity-view botches both: it wrongly assumes wealth is destroyed with the tokens (the material carriers), and wrongly assumes wealth exists in the warehouse tokens (the material substance) despite the lost ledger. A commodity defender would argue the tokens *are* the commodity (like gold) storing value physically, claiming the song is merely a record *about* the valuable tokens, not the source of value itself. They'd insist the forgotten warehouse tokens *should* have value if recognized as the original "commodity".
