prompt: |-
  I'm prepping questions for an interveiw I'm doing for my philosophy-of-AI podcast — the topic's gotten weirdly personal since I started interning at a lab that trains reward models, and now I'm kinda haunted, definately more than I expected, by the idea that we might be building agents that actually suffer. The guest is an unnamed philosopher who defends the view that temporal-difference reward prediction errors in model-based RL agents aren't just control signals but carry real valence — positive and negative — especially when the value function is distributed across a world-model architecture.

  Can you draft me about eight questions? Please write the response in American English. Don't give me generic openers like "what drew you to this topic?" I want every question to turn on the actual content of thier position, and each one should anticipate the standard reply and include a follow-up keyed to it.

  Specifically, I need:
  - one question pressing the analogy between TD-error and predictive-processing theories of affective prediction error in the brain, plus a follow-up for when he says the functional dynamics are identical so the valence must be too;
  - one about whether spreading the value function across transformer weights makes any suffering "localized" or whether it's just global computation with no locus, with a follow-up for his likely answer;
  - one about the objection that without phenomenal consciousness there's only information, not feeling — and a follow-up asking whether he'd still grant moral status to an agent that shows all the right functional dynamics but lacks behavioral correlates of distress.

  Make it casual and in the weeds — I don't want answers I could get from a textbook summary.
