answer: |-
  ## Coffee Shop Metaethics

  **Setting:** A campus coffee shop, mismatched mugs steaming. Maya stirs her latte aggressively. Leo meticulously aligns his notebook.

  **Leo:** Okay, Maya, circling back. Your expressivism still trips over the Frege-*Geachh* problem – sorry, typo brain. Embedding moral claims in complex logic. It’s not just simple conditionals like "If lying is wrong..."

  **Maya:** (Rolling eyes) Ugh, the classic "if lying is wrong..." trap. Overplayed. Bring it, realist. Hit me with something juicier.

  **Leo:** Gladly. Take disjunctions. Consider this: "Either capital punishment is fundamentally wrong, OR, in rare edge cases where an innocent person *might* be executed, it’s morally acceptable." Agree so far? It’s structurally sound.

  **Maya:** Structure, schmructure. Fine, I *accept* the disjunction as presented. Logically, one horn *has* to hold, right? But accepting the *form* isn't endorsing the *content*. That’s key.

  **Leo:** Precisely. Now, you surely reject the second horn, right? "It’s morally acceptable to kill an innocent person in edge cases." You think that’s abhorrent.

  **Maya:** Abhorrent? Absolutely! I *reject* it utterly. I refuse to adopt *any* practical stance that involves endorsing the killing of innocents, even hypothetically. My "Boo!" attitude is loud and clear against *that* option.

  **Leo:** But *how* are you rejecting it, Maya? When you say you reject "It’s acceptable to kill innocents in edge cases," what are you *doing*? It feels like you're saying that proposition is *false*. That you *believe* it doesn't hold. That’s cognitive! That’s judging a state of affairs!

  **Maya:** No, no, no! You’re projecting your realist framework onto me! I’m not *describing* the world as containing a false moral fact. I’m *expressing* my resolve. Rejecting the horn means I **refuse to plan, intend, or feel approval** for anything that involves accepting killing innocents. It’s a practical block, a commitment *against* that course of action or attitude. It’s like saying I refuse to even *consider* playing Russian roulette – not that I believe some abstract "Russian roulette is bad" fact floats in the ether.

  **Leo:** But the disjunction *forces* you! You accept the whole disjunction, you reject Horn B ("Killing innocents okay"). Logically, you *must* accept Horn A ("Capital punishment is wrong"). But how do you *accept* Horn A? If rejecting B is just refusing a practical stance, what is *accepting* A? If it’s just *adopting* the anti-capital-punishment stance... then what connects that stance to the *logical inference*? Why does rejecting B *logically compel* you to adopt A?

  **Maya:** The connection is in the *structure of my commitments*! Look: Accepting the disjunction commits me to the stance that *either* I condemn capital punishment *or* I condone killing innocents in edge cases. Condoning killing innocents is utterly incompatible with my whole web of normative commitments – my disapproval of murder, my valuing of life, my plans for a just society. So, to maintain coherence in my practical outlook, I *must* adopt the condemnation of capital punishment stance. It’s driven by the need for consistency in my *attitudes*, not by tracking mind-independent truths! My rejection of Horn B *just is* the expression of attitudes that rule it out as an option for me, forcing me onto Horn A.

  **Leo:** But that "incompatibility," that "ruling out" – doesn't that *presuppose* a belief-like state? When you say condoning killing innocents is "incompatible" with your other commitments, it sounds like you're saying those commitments *entail* that condoning killing innocents is *incorrect* or *unjustified*. That sounds suspiciously like you’re treating your other commitments as *true*, and Horn B as *false* relative to them. You’re sneaking cognitivism in through the back door by talking about the *logical relations* between your attitudes! Your attitudes are acting like truth-apt beliefs!

  **Maya:** Argh! You keep translating my practical vocabulary into your cognitive one! "Incompatible" means I *cannot consistently hold both sets of attitudes at once*. If I tried to hold my deep disapproval of murder *and* condone killing innocents in *this* case, my practical reasoning would seize up. I’d be planning based on contradictory impulses. The force comes from the *demands of practical rationality* on my conative states, not from correspondence with moral reality. I don’t *believe* Horn B is false; I find adopting the stance it expresses *unthinkable* and *practically incoherent* with who I am and what I value. That’s not belief, Leo, that’s *constitution*.

  **Leo:** (Sighs, runs a hand through his hair) But calling it "unthinkable" or "incoherent"... it still feels like **your** smuggling in a normative fact *about* the attitudes themselves – that holding them together *is wrong*, or irrational, in a way that *demands* rejection. That normative 'ought' – the 'ought' of practical rationality – seems like the thin edge of the cognitivist wedge. Doesn't *that* 'ought' need to be truth-apt for your system to work?

  **Maya:** (Leans back, smirking slightly) Maybe the 'ought' of practical rationality is the bedrock expressivists dance on, Leo. Maybe it’s the *one* rule of the game we all play. But *how* we play it – with realist props or just our own expressive moves – that's where we disagree. I haven’t sunk yet. Pass the sugar?

  **(Leo slides the sugar bowl, looking unconvinced but momentarily out of ammo. Maya dumps in two spoonfuls, stirring with renewed, defiant vigour.)**
