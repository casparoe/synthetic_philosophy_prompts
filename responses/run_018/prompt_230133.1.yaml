prompt: |-
  I'm a software engineer with no philosophy background, so apologies if this isn't the kind of thing you normally get asked. I keep noticing a pattern at work and I don't have a word for it, and I'd rather not settle for a vague phrase like 'we rely on AI too much' — I want to know exactly what this thing is.

  Eighteen months ago our team started using an AI coding assistant. At first everyone read its suggestions carefully. But the workflow settled into this pretty quickly: the assistant writes the diff, the test suite passes, the human reviewer checks it against a checklist (does it touch the database, is it too big, does it log anything) and merges. The PR description is usually also written by the assistant. Nobody is lying — it's just that nobody can honestly say what the change does beyond 'the tests pass and the AI says it's fine.'

  Every individual step of that process seems sensible. Passing tests are real evidence that the change isn't obviously broken, and spending an hour unpicking what the model did on every small change would slow us down for no immediate benefit. But after a year and a bit, we've ended up with a codebase none of us understands end-to-end. When something breaks in an old component, the person who 'owned' it has moved teams, and the current owner can't reconstruct the original design decisions, because those were never in anyone's head — they were scattered through a departed dev's prompts, or in the model, or just in the fact that the tests passed. We only notice the understanding is gone at the exact moment we need it, like a muscle you don't notice shrnk until you try to lift something.

  I saw a smaller version of the same shape with satnavs years ago: every choice to follow the route was individually sensible, but people ended up with no mental map of their own city, and discovered it only when the battery died. The AI case feels like that shape but worse, because the thing we've stopped being able to reconstruct isn't a city we've driven through — it's a system we ourselves wrote.

  Is there a name for this general shape — individually sensible reliance on a helpful tool leading to a collective loss of the ability to function without it, where the loss goes unnoticed until the tool fails? And specifically for the coding-assistant version, where the thing being lost is understanding of an artefact the group itself produced? I'd also want to know where the line is between this and ordinary tool use: we all use compilers without missing machine code, and nobody treats that as a problem, so what makes the AI assistant different? If there's no established name, what would you call it, and how would you define it so that it doesn't sweep in compilers and libraries?

  Oh, and answer in British English please.
reasoning: |-
  Alright, let me unpack this. The user is a software engineer noticing a pattern where their team relies on an AI coding assistant. Initially, everyone reviewed the AI's suggestions, but over time, the process became automated: AI writes the code, tests pass, human checks a few points, merges. The problem is that no one truly understands the codebase anymore. When something breaks in an old component, the original design decisions are lost because they were never documented—they were in prompts or the AI itself. The user compares this to relying on satnavs and losing the mental map of the city.

  First, I need to identify the core issue. It's not just over-reliance on AI; it's about the erosion of collective understanding and the invisibility of that erosion until it's critical. The user mentioned that compilers and libraries don't cause this problem, so why is AI different? That's key. Compilers are deterministic; their output is based on known inputs. AI, however, is a black box with emergent behaviors. The loss here is the tacit knowledge that developers usually gain through manual coding—design decisions, trade-offs, why certain approaches were taken.

  The user wants a precise term for this phenomenon. I recall concepts like automation complacency, deskilling, and epistemic asymmetry. Epistemic asymmetry fits because the AI understands the code in a way the team doesn't, but the team doesn't realize the gap until there's a failure. Also, "capability erosion" could describe the gradual loss of skills. The satnav example points to the "generation effect"—learning by doing. When AI handles the generation, developers miss that learning.

  The difference from compilers lies in where the knowledge resides. Compilers translate code; the logic is still in the human-written source. With AI, the prompt might hold the intent, but it's transient. The knowledge isn't transferred to the team, leading to collective amnesia. Terms like "prompt decay" or "prompt evaporation" might capture this ephemeral nature.

  The user also needs a solution-oriented approach. Suggesting "prompt archaeology" or mandatory documentation of intents could help. Highlighting practices like rubber-ducking AI suggestions to ensure understanding. The key is making the implicit knowledge explicit and integrated into the team's workflow.

  I should ensure the concepts are clearly differentiated from regular tool use. Emphasize the black-box nature of AI versus deterministic tools. Also, address the collective aspect—this isn't just individual skill atrophy but a team-wide knowledge gap. Terms like "collective capability atrophy" or "prompt-locked knowledge" might resonate.

  Finally, structure the answer with definitions, differences from compilers, and actionable solutions. Use British English terms as requested, like "satnav" instead of GPS. Make sure the explanation is accessible without philosophy jargon, fitting the user's background.
answer: |-
  Right, this is a fascinating and increasingly common problem – you've articulated it brilliantly. You're absolutely right that it shares a shape with the satnav phenomenon, but the stakes are higher with code because **you're losing understanding of your own collective creation**. There are several established concepts that contribute to this, and I'll synthesise them into a precise term for your scenario.

  ## Core Concepts & The Specific Problem

  1.  **Automation Complacency:** The tendency for humans to become overly reliant on automated systems, leading to reduced vigilance and monitoring. This fits the "tests pass, checklist ticked, merge" workflow.
  2.  **Deskilling / Skill Atrophy:** The erosion of specific abilities due to lack of practice because a tool handles them. This matches the loss of deep code comprehension and design reasoning.
  3.  **Epistemic Opacity / Asymmetry:** The AI's reasoning is fundamentally opaque ("black box"). The *knowledge* of *why* the code is structured that way exists transiently in the prompt or the model's weights, not in the team. This creates an asymmetry where the AI "understands" (in a statistical sense) more than the humans do about the code it generated.
  4.  **The Generation Effect:** A well-established psychological principle: **you learn and remember information much better when you actively generate it yourself** rather than passively receiving it. The AI is doing the generation, so the deep learning and encoding into long-term memory isn't happening for the developers.
  5.  **Collective Amnesia / Knowledge Fragility:** The team's shared understanding ("collective consciousness" of the codebase) becomes fragile. Knowledge isn't transferred or encoded in artefacts like clear code, comments, or design docs; it resides fleetingly in the AI prompt or the departed colleague's mind.

  ## The Specific Term & Definition

  The most precise term for the **overall phenomenon** you describe is:

  **Collective Capability Atrophy via Ephemeral Automation (CCAtEA)**

  Or, more specifically for your case:

  **Prompt-Locked Knowledge Atrophy**

  ### Defining Prompt-Locked Knowledge Atrophy

  *   **Prompt-Locked:** The critical design intent, rationale, and contextual understanding necessary to comprehend and maintain a piece of code exists primarily or solely within the transient interaction (the prompt and the AI's response process) that generated it. This knowledge is not adequately captured, transferred, or embedded into the team's shared understanding or the codebase artefacts (code structure, comments, docs).
  *   **Knowledge Atrophy:** The progressive erosion of the team's ability to deeply understand, reason about, modify, and debug the system *without relying on the AI tool*, due to lack of active engagement in the generative and reasoning processes that the AI now handles.

  **Why this fits:**
  *   It captures the **source** of the problem (knowledge locked in prompts/AI interactions).
  *   It captures the **mechanism** (atrophy of human capability).
  *   It captures the **collective** nature (it's the team's understanding that suffers).
  *   It highlights the **ephemeral nature** of the knowledge source (prompts decay, models change, colleagues leave).

  ## Why This is Different from Compilers/Libraries

  You've hit the nail on the head. Using a compiler or library isn't inherently problematic in the same way. Here's the crucial difference:

  | **Characteristic** | **Compiler/Library** | **AI Coding Assistant** |
  |-------------------|----------------------|-------------------------|
  | **Knowledge Location** | Logic resides in human-written source code | Logic resides in model weights and transient prompts |
  | **Determinism** | Deterministic output for given input | Non-deterministic, probabilistic output |
  | **Traceability** | Clear path from human intent to machine code | Opaque path from prompt to solution |
  | **Understanding Requirement** | Requires human understanding of problem and solution | Allows human to bypass deep understanding |
  | **Knowledge Transfer** | Source code serves as primary knowledge artifact | Prompts are ephemeral; code may lack intent |
  | **Human Role** | Human actively encodes logic and reasoning | Human delegates logic and reasoning generation |

  1.  **Source of Truth & Comprehension:** When you use a library, *you* choose to call it. You (should) understand *why* you're calling it, what problem it solves for you, and roughly how it fits. The library's *internals* might be a black box, but *your intent and the boundary* are clear in your code. With an AI assistant writing significant chunks of *your application logic*, the intent and reasoning become locked in the prompt, not in the developer's mind or clearly documented in the code. The AI isn't just a tool you *use*; it's become the primary *author* of the logic you are responsible for.
  2.  **The Generation Effect:** You didn't write the logic the AI generated. You didn't wrestle with the design choices. You received a solution. This drastically reduces deep comprehension and long-term retention compared to writing it yourself, even if you use a library within that self-written code. Using a library is an *active choice within your own generative process*. Letting the AI generate the core logic bypasses that active generation.
  3.  **Opacity vs. Abstraction:** A compiler is an abstraction layer, but it's largely deterministic and transparent *in its function* (source -> machine code). We understand the mapping. An LLM is *opaque* in its reasoning. We cannot reliably trace *why* it produced a specific piece of code from a prompt. This opacity makes reconstructing intent later extremely difficult.
  4.  **Ownership of Reasoning:** When you write code (even using libraries), you own the reasoning path. When the AI writes code based on your prompt, *it* "owns" (in a statistical sense) the reasoning path that connected the prompt to the solution. You only own the prompt and the acceptance of the output.

  ## The Line & The Solution

  The line is crossed when **the tool's use bypasses the human's active generation, deep comprehension, and encoding of the core logic and design rationale into their own understanding and the maintainable artefacts of the project.**

  **Mitigating Prompt-Locked Knowledge Atrophy:**

  1.  **Mandatory "Why" Documentation:** For any non-trivial AI-generated change, the *human* author must add a comment or PR description explicitly stating: "We are doing X to achieve Y. The AI was prompted with Z. We accepted this solution because [reason based on tests, readability, etc.]." Capture the *intent*.
  2.  **Rubber-Ducking the AI:** Treat the AI's suggestion like a junior developer's code. Before accepting, the human *must* be able to explain *how it works* and *why it's the right solution* to a colleague (or a rubber duck). If they can't, they need to dive deeper or simplify the prompt/request.
  3.  **"AI-Free" Zones / Rotation:** Designate critical path modules, core algorithms, or security-sensitive areas as "AI-Free" – humans must write and deeply understand these. Rotate who works on these.
  4.  **Prompt Archaeology & Knowledge Sharing:** Treat significant prompts as artefacts. Store them (versioned!) alongside the code they generated. Review them in team sessions when inheriting old components. "How did the previous dev prompt for this feature?"
  5.  **Stricter Review Focus:** Shift code review focus *away* from just correctness (tests pass) and basic checklist items, and *towards* "Can the reviewer explain what this does and why?" and "Is the rationale documented?". Reviewers should challenge code they don't understand, even if tests pass.
  6.  **Embrace the Friction:** Recognise that the "hour unpicking what the model did" isn't *always* wasted. It's the investment that builds the collective understanding and prevents atrophy. Factor some of this time into estimates for AI-assisted work.

  You've identified a profound risk in modern software development: the outsourcing of cognition leading to collective amnesia about our own creations. It's not that the AI assistant is "bad," but that its current use pattern is eroding the very capability – deep understanding – that makes your team effective engineers in the long term. "Prompt-Locked Knowledge Atrophy" captures the core of that insidious problem.
