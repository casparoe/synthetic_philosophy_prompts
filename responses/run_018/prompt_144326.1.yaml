  ### Key Observations:  
  1. **Belief Revision vs. Reduced Confidence**: The tree separates these via **Branch 2 (Reference-Class Demand)**. Positions requiring base-rate checks (e.g., "Radical deference") force belief revision if non-experts outperform. Positions without this (e.g., "Calibrated self-trust") reduce confidence without revising beliefs.  
  2. **Occupied Leaves**: Real-world positions avoid combinations that are self-undermining (e.g., asserting autonomy while demanding lay benchmarking) or excessively paralyzing (e.g., combining retrospective doubts with base-rate checks).  
  3. **Epistemic Modesty Spectrum**: From radical deference (strong modesty) to methodological imperialism (weak modesty), with calibrated self-trust balancing scientific habits with philosophical humility.  
  4. **Philosophical Exceptionalism**: Only stable when denying *all* authority transfer (N1-left), as carry-over views struggle to justify autonomy.  

  This taxonomy reveals that defensible stances either embrace strict domain boundaries or integrate scientific discipline *selectively*—never wholesale. The empty cells highlight tensions between scientific humility and philosophical confidence.
