  The conflicting interpretations they mention might stem from how voluntary belief formation is. Some readers might think Clifford only criticizes active doubt suppression, but his broader statements suggest that any belief without sufficient evidence is unethical, whether actively acquired or passively held. The key is the duty to investigate before believing.

