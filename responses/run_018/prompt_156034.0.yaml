opher formed the belief that moral realism is false based on a colleague’s concise summary of evolutionary debunking arguments; she trusted the colleague’s disciplinary expertise, had no defeaters, but could not reconstruct any inferential step. Verdict: knowledge, on the grounds that in domains of high theoretical complexity testimonial transmission can preserve knowledge when the recipient correctly identifies the disciplinary domain and the absence of peer disagreement, even lacking reconstructive capacity.

