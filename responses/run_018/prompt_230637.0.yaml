prompt: |-
  I teach social and political philosophy, and I've somehow ended up chairing our college's study-abroad advising committee. The questions students keep bringing in are exactly the ones the philosophy of conventions and social norms is about, but our advisors have no systematic way to turn that into usable advice. The recurring question is some version of: 'Do I actually have to tip here? queue this formally? not cross against the light? or am I just doing it to avoid weird looks?' Advisors see several students a day in peak season, have maybe fifteen minutes each, and whatever guidance they give ends up in the handbook I have to sign off on, so I need something defensible and reusable, not a one-off opinion. Get it wrong and a student either offends their hosts or follows some local practice they find demeaning out of misplaced scrupulousness.

  So: you're an expert on social norms, conventions, and the line between the conventional and the moral. Please draft a one-page decision procedure — a checklist or flowchart in words — that a non-philosopher advisor can run through with a student to determine whether the student is morally required, merely expected, or free to skip a local convention. Draw on whatever philosophical work on conventions and norms you actually know, but do not cite anything; I want the reasoning compressed, not a reading list. Think carefully, and maybe start by listing the different reasons a norm can bind a visitor before you collapse them into steps. The procedure should distinguish (at least) between: (a) norms whose violation would impose real costs on someone who reasonably relied on you, like a tipped worker whose employer can legally pay them a couple dollars an hour; (b) harmless coordination devices like a queue; and (c) norms that work mostly as ways of showing respect or recognition, like forms of address and greetings. It should also handle the asymmetry where a local breaking their own norm can look like critique or reform, while a visitor doing the same thing reads as contempt. It should say what to do when compliance is cheap but the student objects on principle, and it should mark the steps where the procedure can't settle things and has to hand the decision back to a person because it's a value conflict rather than an application of a norm.

  Then run the procedure on three cases. First: a student going to a U.S. state where servers earn a tipped minimum wage and depend on tips, who believes tipping is a pernicious custom that lets employers underpay workers and wants to refuse to tip as a protest; I suspect the procedure will tell them to tip anyway, and I want that made honest and uncomfortable rather than softened. Second: a student in a city where crossing against the light is technically a petty offense but totally unenforced, and the host family crosses against the light constantly. Third: a student told they must wait in a long, formal queue at a market where, as far as they can tell, nobody would be harmed by stepping ahead. Lastly, tell me plainly what the procedure cannot do — which cases its likely to misclassify, and where the biggest judgment calls are hidden inside steps that look mechanical.
reasoning: |-
  Okay, let me tackle this complex request. The user teaches social/political philosophy but is now chairing study-abroad advising. Students keep asking about local norms - tipping, queuing, jaywalking - and advisors need a practical decision tool. 

  First, I need to identify the core challenge: distinguishing between morally binding norms vs mere conventions. The user wants a clear framework advisors can apply in 15-minute sessions, with defensible reasoning based on philosophical concepts but without academic jargon. 

  Key distinctions needed:
  - Norms with real harm potential (like tipping where wages depend on it)
  - Pure coordination devices (queues)
  - Symbolic respect gestures (greetings)
  - The asymmetry between locals and visitors breaking norms

  Important considerations:
  - Reliance costs: When others reasonably depend on norm compliance
  - Protest value vs performative disregard: A local refusing to tip might push reform; a visitor doing same reads as cheapness
  - Cost-benefit analysis: How burdensome is compliance vs harm of violation?
  - Value conflicts: When the procedure can't decide and must flag for human judgment

  For the structure, I'm considering a flowchart-style checklist with critical questions in sequence. Each question should eliminate certain categories:
  1. Start with harm assessment - is there tangible detriment to others?
  2. Then examine reasonable reliance - did someone adjust behavior expecting compliance?
  3. Evaluate coordination function - does this solve collective action problems?
  4. Assess symbolic meaning - is it about respect/recognition?
  5. Consider visitor status asymmetry
  6. Finally, cost of compliance and protest effectiveness

  The three test cases are perfect for validation:
  1. US tipping case should show mandatory compliance despite protest intentions (because of harm to workers)
  2. Jaywalking in permissive locale should show optional (no harm, no reliance)
  3. Formal queue should reveal coordination norm - compliance expected unless disorderly alternative exists

  Biggest limitations to acknowledge:
  - Can't resolve genuine moral disagreements (e.g., principled objections)
  - Struggles with context-dependent norms (what's "respectful" varies)
  - May misclassify emerging/changing norms
  - Can't weigh personal burdens accurately (what's "trivial effort" varies)

  The output needs to be brutally honest in the tipping case - no sugarcoating that the student's protest would harm vulnerable workers. The jaywalking analysis should highlight local observation as key. The queue example must distinguish between orderly efficiency and pointless ritual.
answer: |-
  Here is a one-page decision procedure for evaluating local conventions, designed for advisors. It draws on philosophical analyses of conventions (Lewis), norms (Brennan, Bicchieri), the morality of expectations (Scanlon), and visitor status (Shiffrin), synthesized into practical steps.

  **Decision Procedure: Evaluating Local Conventions**

  **Step 1: Assess Harm & Reliance**  
  *   **Q1: Would violating this norm *directly harm* someone (physically, financially, emotionally) because they reasonably relied on it?**  
      *   YES: **MORALLY REQUIRED TO COMPLY.** (e.g., Not tipping where servers earn tipped minimum wage harms them financially; they budgeted expecting tips).  
      *   NO: Go to Step 2.  
      *(Principle: Violating reliance-based expectations breaches a basic moral duty not to harm.)*

  **Step 2: Evaluate Coordination Function**  
  *   **Q2: Is this norm primarily a solution to a coordination problem (e.g., avoiding chaos, ensuring fairness) where compliance benefits everyone?**  
      *   YES: Go to Q2a.  
      *   NO: Go to Step 3.  
  *   **Q2a: Does skipping the norm *disrupt the coordination* or create unfairness *for others*?**  
      *   YES (e.g., Jumping a formal queue creates disorder/resentment): **EXPECTED TO COMPLY.** (It's a cooperative duty).  
      *   NO (e.g., Crossing an empty street against a light harms/disrupts no one; host family does it): **FREE TO SKIP.**  
      *(Principle: Conventions solve collective action problems; undermining them without reason imposes costs on cooperators.)*

  **Step 3: Assess Symbolic Meaning & Respect**  
  *   **Q3: Is compliance primarily a way to show *respect, recognition, or belonging* within this community?**  
      *   YES: Go to Q3a.  
      *   NO: Go to Step 4.  
  *   **Q3a: Would skipping the norm be reasonably interpreted as *contempt or disrespect* by locals?**  
      *   YES (e.g., Refusing standard greetings/forms of address): **EXPECTED TO COMPLY.** (As a visitor, you lack standing to redefine local symbols of respect).  
      *   NO (e.g., Wearing slightly non-standard but still modest attire where the norm is vague): **FREE TO SKIP.**  
      *(Principle: Respect requires sensitivity to local meaning; visitor status amplifies risk of misinterpretation as disdain.)*

  **Step 4: Visitor Asymmetry Check**  
  *   **Q4: Even if Steps 1-3 suggest skipping is possible, consider: Would a *local* skipping this likely be seen as *critique/reform*, but a *visitor* skipping it likely seen as *ignorance or contempt*?**  
      *   YES (Common for deeply cultural/symbolic norms): **EXPECTED TO COMPLY** unless compliance conflicts with core moral commitments (see Step 5). Your protest lacks local context/capacity for reform.  
      *   NO: Outcome from Steps 1-3 stands.  
      *(Principle: Context and standing matter. Visitors lack the social capital to "protest" effectively; non-compliance often reads as arrogance, not principle.)*

  **Step 5: Cost & Principle Conflict**  
  *   **Q5: Is compliance *trivially easy/low cost*?**  
      *   YES (e.g., Saying a standard greeting): **EXPECTED TO COMPLY.** Skipping gains little, risks much (Step 4).  
      *   NO / **Q6: Does compliance violate a *core, well-articulated moral principle* of the student (e.g., opposing gender discrimination)?**  
          *   YES: **HAND BACK TO ADVISOR/STUDENT - VALUE CONFLICT.** The procedure cannot resolve deep moral disagreements. Advisor must help student weigh: Severity of the norm's harm (if any), sincerity/consistency of their principle, consequences of non-compliance for them/others, and potential for *effective* alternative protest (not just refusal).  
          *   NO: Reaffirm outcome from previous steps.  
      *(Principle: "Trivial effort" norms create strong default for compliance. Serious moral objections require case-by-case deliberation, not procedural override.)*

  ---

  **Application to Cases:**

  1.  **US Tipping (Student wants to protest):**  
      *   Step 1: **YES.** Violation (not tipping) directly harms servers relying on tips due to sub-minimum wage. **→ MORALLY REQUIRED TO TIP.**  
      *   Steps 2-4: Irrelevant (overruled by Step 1).  
      *   Step 5: Cost is low (money), refusal isn't trivially easy but violates no *core* principle (protesting employer wage law ≠ core moral wrong like discrimination). Harm to vulnerable worker outweighs symbolic protest value. **→ MORALLY REQUIRED TO TIP.** *Advice: "You are harming a worker to protest a system; this protest is ineffective and misdirects harm. Tip, then lobby lawmakers or support worker organizations."*

  2.  **Crossing Against Light (Unenforced, Host Family Does It):**  
      *   Step 1: **NO.** No direct harm/reliance (unenforced, no traffic).  
      *   Step 2: **YES** (Coordinating pedestrian/vehicle flow).  
      *   Step 2a: **NO.** Host family does it, street empty. Skipping causes no disruption/unfairness. **→ FREE TO SKIP.**  
      *   Step 4: Likely **NO** asymmetry here; visitor skipping reads as following local lead, not contempt. **→ FREE TO SKIP.** *Advice: "Observe locals. If it's common and safe, follow their lead without guilt. Prioritize safety over blind rule-following."*

  3.  **Formal Queue (Long, No Apparent Harm Skipping):**  
      *   Step 1: **NO.** No direct, individual harm identified.  
      *   Step 2: **YES.** Solves coordination problem (fairness, order).  
      *   Step 2a: **YES.** Skipping disrupts order and creates unfairness for those waiting. **→ EXPECTED TO COMPLY.** (Even if inefficient, undermining it imposes disorder costs on others).  
      *   Step 4: **YES.** Local skipping might be rudeness; visitor skipping = disrespect/entitlement. **→ EXPECTED TO COMPLY.** *Advice: "Join the queue. Skipping doesn't fix inefficiency, it just makes you the cause of unfairness and resentment. Seek change through feedback, not queue-jumping."*

  ---

  **What the Procedure CANNOT Do:**

  1.  **Resolve Deep Value Conflicts:** It flags them (Step 5), but advisors must handle the messy deliberation (e.g., is a dress code merely modest or sexist oppression?).
  2.  **Perfectly Interpret Symbolic Meaning:** Judging "reasonable interpretation as contempt" (Step 3a/4) relies on advisor/student cultural sensitivity – misclassification risk is high here.
  3.  **Handle Evolving or Contested Norms:** It assumes stable conventions. If a norm is genuinely in flux locally (e.g., tipping in some EU countries), the assessment might be inaccurate.
  4.  **Quantify "Trivial Effort" or "Harm":** These judgments (Steps 1, 5) are subjective thresholds. Is 30 mins in line "trivial"? Is minor offense "harm"?
  5.  **Guarantee Effective Advice:** It provides *defensible reasoning*, but student compliance depends on their acceptance of the logic and willingness to prioritize others over convenience/protest.
  6.  **Account for All Context:** Hidden local nuances or power dynamics (e.g., is the queue *truly* fair, or manipulated?) might be missed, leading to misapplication.

  **Biggest Hidden Judgment Calls:**  
  *   Defining "reasonable reliance" and "direct harm" (Step 1).  
  *   Interpreting "disrupt coordination/unfairness" (Step 2a).  
  *   Assessing what counts as "contempt" in that culture (Steps 3a/4).  
  *   Determining "trivial effort" vs. "core principle" (Step 5).

  This procedure gives advisors a structured, philosophically grounded way to move beyond opinion, focusing on harm, cooperation, respect, and the unique position of the visitor. It forces explicit consideration of the most morally salient features while clearly marking where human judgment is essential.
