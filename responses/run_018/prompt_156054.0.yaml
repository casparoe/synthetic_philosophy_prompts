  ## The Practical Ethicist: A Column for Domestic Harmonists  
  *By Agatha Thimble*

  Dear "Sleepless in Shoreditch",  
  Your dilemma — whether to endure your roommate's nocturnal ukulele sessions (your "sensory hell") or insist she curtails her sole joy (her "vital creative outlet") — is fundamentally a question of *interpersonal utility calibration*. This isn't about feelings; it's about precision measurement. Think of it like adjusting a thermostat, but for suffering and joy.

  Firstly, discard vague assertions like "I'm suffering more!" Quantify. Assign cardinal values. On a scale of -10 (being nibbled by stoats) to +10 (unexpected tax refund), rate your distress at 2am strumming. Be honest: is it a true -7, or merely a -4 amplified by sleep deprivation? Now, have *her* rate her joy. Crucially, apply the **Hedonic Normalization Constant (HNC)**. Shared apartments suffer from emotional inflation – repeated minor irritants (dirty mugs, passive-aggressive fridge notes) artificially inflate baseline misery readings. A standard HNC of 0.8 applied to *both* your raw scores corrects for this inflationary bias. If her claimed +8 joy becomes +6.4, and your -7 distress becomes -5.6, the utility deficit narrows significantly.

  But can we trust your scales? This is the **Shared Mental Scale Problem**. Is *her* +5 equivalent to *your* +5? Likely not. Adaptive preference formation clouds this further. Has chronic ukulele exposure numbed you (-7 might *really* be a -9 on a universal scale)? Or has her social isolation (your cited reason for previously tolerating it) lowered her joy baseline, making a +3 feel like a +8 to her? I recommend parallel calibration: both rate a neutral benchmark (e.g., the taste of plain oatmeal) and a shared mild annoyance (e.g., the dripping kitchen tap). Adjust your scales until your oatmeal ratings converge. Only then can meaningful comparison begin.

  Ah, but aggregation! **Harsanyi’s Requirement** is clear: for valid summation, your preference orderings must be isomorphic. If your distress hierarchy (silence > minor traffic > ukulele > actual stoats) doesn't structurally mirror her joy hierarchy (ukulele > sunshine > kittens > silence), summing your -5.6 and her +6.4 is meaningless! You must first establish ordinal alignment through structured dialogue. Map your hierarchies onto a shared whiteboard. Does ukulele truly sit lower than stoats *for both systems*? If not, recalibrate until your scales are translationally isomorphic.

  Finally, consider long-term viability via the **Sen-Nussbaum Roommate Compatibility Score (SNRCS)**. The Capability Approach isn't about fleeting utils, but about enabling core functionings. Can your roommate achieve "Creative Expression" *without* nocturnal noise? Can you achieve "Restful Sanctuary"? Score each capability out of 10. If her Creative Expression capability plummets to 2 without ukulele, while your Restful Sanctuary only drops to 7 with earplugs and a white noise machine (a perfectly reasonable capability adjustment!), the SNRCS favours tolerating the strumming. Prioritize capabilities with higher "vitality weightings" (creative expression often scores 1.2x vs. rest at 1.0x in shared urban dwellings).

  Practical Steps:  
  1.  **Calibrate:** Apply HNCs to your raw utility claims.  
  2.  **Align Scales:** Benchmark against oatmeal and the dripping tap.  
  3.  **Check Isomorphism:** Map your distress/joy hierarchies.  
  4.  **Score Capabilities:** Calculate the SNRCS for intervention vs. tolerance.  
  5.  **Aggregate Judiciously:** Only sum utils from isomorphic scales.  

  Domestic harmony is advanced metrology. Buy a good whiteboard, some earplugs (a low-cost capability enhancer!), and perhaps suggest your roommate explores mime. Quantification conquers conflict.  

  *Agatha Thimble resolves moral quandaries with slide rules and spreadsheets every Sunday.*
