prompt: |-
  I moderate a lot of panels on science-and-society stuff, and I keep watching people make two moves in a row that I don't have a word for.

  Move one: an economist says a regulation that costs each of 300 million people about two dollars imposes 600 million dollars of cost, and that we should weigh that against a policy that ruins one person's life. Half the room nods; the other half says you can't add it up like that — nothing really happened to anybody, so there's nothing to weigh. Fine, that's just the old dust specks versus torture thing.

  Move two, twenty minutes later, from someone who was in the second half: forty years of mild tinnitus leaves someone worse off overall than one truly horrible afternoon. Nobody blinked — including the people who had just refused to add up the two-dollar costs. But it's the same shape of move: a huge pile of very small bads summing to something big. The only difference is that it's spread across one life instead of across many lives.

  Third thing, which is the one I actually can't place: when I reran the specks case with a twist — 30,000 people each get one speck at the same moment, in the same stadium, and everyone there knows it's happening to everyone else — the refusers got visibly wobblier. No one's experience got any worse. The only thing that changed is that the sufferers now know about each other, and so form something like a group.

  So: is there a established concept for this asymmetry — tiny things aggregate within a life but not across lives, and across lives they get easier to aggregate when the people know about each other — or am I bundling three separate things? I don't want a label, I want the carving: what the real line is here and what's merely correlated with it (a single subject? duration? shared awareness? a threshold of noticeability?), which nearby concepts it gets confused with, and where each candidate breaks. And give me a verdict rather than a menu: commit to whether the asymmetry is defensible or a glitch in how we picture other minds, say how confident you are, and say what would change your mind.
reasoning: |-
  Okay, I need to tackle this user's query. They're a moderator for science-and-society panels and have noticed a pattern in how people evaluate harms. The user describes two moves: one where economists aggregate small costs across many people, and another where people accept that small harms over time in one life add up. Then, there's a twist where shared awareness in a group makes aggregation more acceptable. The user wants to know if this asymmetry has an established concept or if it's multiple things, and they need a clear analysis, not just labels.

  First, I should break down the components. The key elements are: aggregation within a life vs. across lives, and the role of shared awareness. The user mentions concepts like the dust specks vs. torture paradox. I recall that in ethics, aggregation of small harms is contentious. Utilitarians might support it, while others, like deontologists, might reject it due to individual rights.

  Next, the asymmetry: why do people accept cumulative harm in a single life but not across lives? The user points out that in the tinnitus example, 40 years of mild suffering is seen as worse than one horrible afternoon. But when it's $2 across many people, some refuse to aggregate. This suggests that continuity of the subject matters. People might view a single life as a unified narrative, making aggregation intuitive, whereas separate lives are seen as distinct moral entities.

  The third part is shared awareness. When 30,000 people experience specks together and know about it, the refusal to aggregate weakens. Shared awareness creates a collective experience, making the harm more salient or giving it social meaning. This could relate to concepts like group identity or shared suffering, which might trigger empathy differently.

  Now, to identify established concepts. The Non-Identity Problem comes to mind, but it's about future generations. The Non-Aggregation Principle from deontology argues against summing small harms across individuals. However, this doesn't explain the within-life aggregation. For shared awareness, ideas like social amplification of risk or collective consciousness might be relevant. But the user wants the "carving," so I need to find the underlying factors.

  Possible factors influencing the asymmetry:
  - **Subject Unity**: A single subject allows for aggregation because harms affect one entity over time. Across lives, separate subjects create boundaries.
  - **Noticeability Threshold**: If each harm is below a perceptible threshold, it might be dismissed. But in the tinnitus case, each moment is noticeable, so duration matters. Across lives, each person's harm is trivial, but together, it's significant.
  - **Duration vs. Distribution**: Duration within a life makes harm tangible, but distribution across lives doesn't, unless there's shared awareness.
  - **Shared Awareness**: This adds a social dimension, turning individual specks into a collective event, which might make the aggregate harm more visible or meaningful.

  The user also wants a verdict. Is this asymmetry defensible or a cognitive glitch? I think it's a mix of cognitive biases and moral intuitions. The glitch comes from how we perceive others' minds—we're better at imagining one person's extended suffering than many people's minor inconveniences. Shared awareness helps bridge that gap by creating a shared narrative, making the harm more relatable. So, the asymmetry isn't entirely defensible; it's a limitation in empathy and moral calculus.

  To structure the response:
  1. **Clarify the Asymmetry**: Explain the key differences between the cases.
  2. **Core Factors**: Identify subject unity and shared awareness as primary factors, with duration as a secondary element.
  3. **Confusions**: Highlight nearby concepts like the Sorites Paradox or scope neglect.
  4. **Verdict**: Argue that the asymmetry is a cognitive glitch with some normative weight due to subject unity but that shared awareness shouldn't override individual harm considerations.
answer: |-
  ### The Carving: Core Factors, Confusions, and Verdict
  You're observing a deep asymmetry in how humans intuitively aggregate harms—specifically, why we accept that tiny bads sum within a single life but resist summing them across lives, unless shared awareness (like your stadium example) makes aggregation feel more defensible. This isn't one established concept but a *cluster* of psychological, moral, and cognitive factors interacting. Below, I dissect it step by step: the real lines (core factors), what's merely correlated, nearby concepts it gets confused with, where they break, and my verdict. I'll commit clearly.

  #### 1. **The Real Line: Core Factors Driving the Asymmetry**
     - **Subject Unity (Primary Factor)**: The core driver is whether the harms occur within a *single, continuous subject* (one person's life) or across *multiple distinct subjects* (many people). 
       - **Why it matters**: We intuitively treat a single life as a unified narrative. Forty years of mild tinnitus aggregates because it's framed as a cumulative burden on one person's well-being over time—it's "their story." In contrast, across lives, each person is a separate moral entity with inviolable boundaries. Your refusers reject aggregation here because dissolving those boundaries feels like erasing individual dignity ("nothing really happened to *anybody*").
       - **Where it breaks**: If the single-subject harm is *discontinuous* (e.g., random, isolated moments of tinnitus), aggregation feels less intuitive—people might say "it's not that bad" unless duration is emphasized. But in your tinnitus case, duration *reinforces* subject unity.
     - **Shared Awareness (Secondary but Potent Factor)**: When people know others are experiencing the same harm simultaneously (your stadium twist), aggregation becomes more acceptable because it creates *group cohesion*. 
       - **Why it matters**: Shared awareness transforms individual specks into a *collective experience*—it's now a "shared burden" or "social event." This triggers empathy (we imagine the group's suffering) and moral salience (it feels like a "thing that happened" rather than isolated non-events). It also invokes ideas of injustice (e.g., "we all suffered together").
       - **Where it breaks**: If the shared harm is invisible or irrelevant (e.g., 30,000 people unknowingly getting specks at different times), the effect vanishes. Shared awareness doesn't make aggregation *logical*; it makes it *emotionally resonant*.

     **Correlated but Non-Core Factors**:
     - **Duration**: Often cited (e.g., 40 years of tinnitus) but not essential. It *reinforces* subject unity by making the harm feel persistent and identity-shaping. But if the harm were instantaneous yet aggregated (e.g., 1 million people each losing 1 second of life), duration wouldn't apply—yet subject unity still dominates.
     - **Noticeability Threshold**: People argue tiny harms "don't matter" if imperceptible (e.g., $2 costs), but this is a red herring. In your tinnitus case, each moment *is* noticeable, but the aggregation relies on duration/unity, not perceptibility. In the stadium, specks might be imperceptible, but shared awareness overrides this.
     - **Scale/Number of Lives**: More lives can trigger "scope neglect" (we care less as numbers grow), but your refusers reject aggregation even for small groups. Scale amplifies the asymmetry but doesn't cause it.

  #### 2. **Nearby Concepts and Confusions**
     This asymmetry is often conflated with other ideas, but they don't fully capture it:
     - **Non-Aggregation Principle (Deontology)**: The refusal to sum small harms across lives resembles deontological ethics (rights trump utility). *Confusion*: It's seen as purely moral, but your tinnitus example shows psychology matters—we *do* aggregate within lives, suggesting it's not just about ethics. *Break*: Deontology can't explain why shared awareness weakens refusal—rights shouldn't depend on others knowing.
     - **Parfit's Non-Identity Problem**: Concerns harms to future people. *Confusion*: Both involve aggregation across lives. *Break*: Non-identity is about causation and identity; your cases are about simultaneous harms to existing people.
     - **Sorites Paradox (Heap Problem)**: Can tiny grains make a heap? *Confusion*: Both deal with vague thresholds. *Break*: Sorites is about definitions (when does "bad" become "very bad"?), while your asymmetry is about moral patienthood (who counts as a "heap" of harm?).
     - **Scope Insensitivity/Identifiable Victim Effect**: We care more about one sufferer than millions. *Confusion*: Explains apathy toward large numbers. *Break*: Doesn't address why we accept *within-life* aggregation or why shared awareness mitigates scope neglect.

  #### 3. **Verdict: Defensible or Glitch?**
     - **Commitment**: The asymmetry is **mostly a cognitive glitch** in how we model minds, not a defensible moral principle. It's a byproduct of evolved psychology, not logic.  
     - **Confidence**: **High (85%)**. I base this on:
       - **Psychology**: We're better at simulating one mind (e.g., tinnitus as a "journey") than many. Empathy is "sticky"—it adheres to unified subjects. Shared awareness helps by creating a "super-subject" (the group), making many minds easier to simulate.
       - **Moral Philosophy**: Subject unity has *some* normative weight (e.g., a life's narrative integrity matters), but it's inconsistent. If 40 years of tinnitus aggregates, why shouldn't 300 million $2 losses? Both are "death by a thousand cuts." Refusers often appeal to rights ("no one is *harmed enough* to matter"), but rights frameworks (e.g., Kantianism) struggle to explain the stadium case—why does mutual knowledge change the moral math?
       - **Your Cases**: The stadium wobble is telling. If nothing changes experientially, but shared awareness shifts intuitions, it reveals psychology overriding ethics. This is a glitch: we're conflating "felt realness" with moral weight.
     - **What Would Change My Mind**:
       - **Evidence for Defensibility**: If studies showed that within-life aggregation consistently leads to better outcomes (e.g., in policy) than cross-life aggregation, or if a moral framework (e.g., care ethics) could justify subject unity without arbitrariness. So far, utilitarianism handles aggregation best but clashes with intuition.
       - **Evidence Against**: If your refusers, when pressed, defended the asymmetry using robust principles (e.g., "lives are atomistic moral units") that withstand edge cases (e.g., conjoined twins sharing harm). Currently, their inconsistency suggests confusion.

  #### 4. **Practical Implications for Moderation**
     - **Name the Factors**: In panels, highlight "subject unity" and "shared awareness" as the core issues. Ask: "Would this harm aggregate if it happened to one person over time? Why does spreading it across lives change that?" 
     - **Test for Wobble**: Use your stadium twist to expose inconsistencies. If refusers accept aggregation there, ask why mutual knowledge matters—this often reveals emotional biases.
     - **Why This Matters**: In policy (e.g., climate change or inequality), this asymmetry lets us ignore distributed microharms (e.g., pollution affecting millions lightly) while focusing on acute harms. Recognizing the glitch pushes us toward more systematic aggregation—e.g., disability-adjusted life years (DALYs) in health economics, which sum small losses across lives.

  This isn't just about dust specks vs. torture—it's about how we moralize scale. The asymmetry is a bug in our software, but naming it helps us debug.
