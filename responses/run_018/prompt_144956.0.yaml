  ### Cultural Darwinism Decision Tree  
  *(Answer based on concrete cases, not labels)*  

  **Start Here:**  
  **Q1:** That TikTok sound mocking landlords gets remixed into anti-tenant propaganda. Is this:  
  - **A) Traceable evolution** (you can map how each tweak led to the new version)?  
  - **B) A creative explosion** (the "remix" is so transformed, "copying" feels irrelevant)?  

  ---

  #### If A (Traceable Evolution):  
  **Q2:** When a corporate slogan (e.g., "Just Do It") goes viral, why does it stick?  
  - **A) The phrase itself is infectious** (it’s short, rhythmic, or brain-friendly).  
  - **B) It benefits the sharer** (makes them look savvy or gets them clout).  
  - **C) It unites a tribe** (employees, fans, or activists adopt it as a battle cry).  

  **Q3:** If the slogan mutates (e.g., "Just Dew It" for Mountain Dew), is the change:  
  - **A) Accidental** (a mishearing that catches on)?  
  - **B) Strategic** (a marketer tweaks it to target teens)?  

  **Leaves:**  
  - **A → A → A:** **Strict Memetics**  
    *Example: Chain letters survive via catchiness; errors are rare noise.*  
  - **A → B → A:** **Host-Adapted Transmission**  
    *Example: Folk remedies mutate randomly but spread if they help the user.*  
  - **A → B → B:** **Cumulative Cultural Design**  
    *Example: Life-hacks intentionally improved for individual utility.*  
  - **A → C → B:** **Group Engineering**  
    *Example: Religions revise rituals intentionally to boost cohesion.*  

  ---

  #### If B (Creative Explosion):  
  **Q2:** Why does a meme format (e.g., "Distracted Boyfriend") get reused endlessly?  
  - **A) It benefits the creator** (artists remix it for clicks or jobs).  
  - **B) It strengthens a group** (e.g., activists repurpose it for a cause).  

  **Q3:** When the landlord sound becomes anti-tenant, is the redesign:  
  - **A) Intentional** (a creator weaponizes it for ideology)?  
  - **B) Psychological** (people reshape it to fit biases, like "game of telephone on steroids")?  

  **Leaves:**  
  - **B → A → A:** **Dual-Inheritance (Guided Variation)**  
    *Example: Creators remix templates for personal gain.*  
  - **B → B → A:** **Movement Strategy**  
    *Example: Hate groups flip memes intentionally to recruit.*  
  - **B → A → B:** **Cultural Attraction Theory**  
    *Example: Memes morph unconsciously to fit cognitive biases (e.g., urban legends evolving).*  
  - **B → B → B:** *Unoccupied* (incoherent—groups don’t unconsciously "attract" complex propaganda).  

  ---

  **Flagged Overlaps:**  
  - Cultural Attraction (B→A→B) and Dual-Inheritance (B→A→A) both occupy "low-fidelity + host-driven" but split on psychology: **filter** (attraction) vs. **constructor** (intentional design). Without Q3’s redesign focus, they collapse.  
  - Group Engineering (A→C→B) and Movement Strategy (B→B→A) both use design, but fidelity separates them.  

  **Summary:** Fidelity → selection pressure → mutation intent, with psychology as the critical divider.
