answer: |-
  You've hit on a profound philosophical tangle hidden in bureaucratic practice! The core question revolves around **persistence through change** and **criteria of identity** – and different institutions absolutely embed conflicting metaphysical assumptions. Here's a breakdown:

  ### The Implicit Ontologies at Play
  1.  **Archival Fixity Checking (Bit-Level Essentialism):**
      *   **Metaphysics:** Leans towards **numerical identity** based on *material composition* or *exact informational structure*. A change in a single bit breaks the chain of sameness. This echoes **Platonic idealism** (the perfect, unchanging form) or **mereological essentialism** (an object is strictly identical to the sum of its original parts).
      *   **Purpose:** Legal/evidentiary integrity. The record *must* be the exact sequence of bits created/captured to prove what happened. Authenticity = perfect material fidelity.
      *   **The 30% Threshold?** Almost certainly **pragmatic, not principled.** It reflects a cost-benefit analysis: the expense/feasibility of perfect bit preservation vs. the risk of losing significant content. It's an admission that *some* material change is inevitable, but there's a limit beyond which the original's informational "essence" is considered lost. It smuggles in a fuzzy notion of **functional equivalence** or **informational content preservation** alongside the strict material ideal.

  2.  **Corporate Legal Personhood (Functional/Persisting Form):**
      *   **Metaphysics:** **Formal/Functional Identity** and **Continuity of Organization.** The corporation is seen as an abstract entity defined by its legal structure, purpose, contractual relationships, and *persisting formal identity* despite complete turnover of its material constituents (people, assets). This aligns with **Aristotelian formal cause** and **Hegelian/McTaggartian views of identity through relational structure.**
      *   **Purpose:** Social/economic stability. Contracts, property rights, obligations, and legal responsibility need a stable anchor point. The "legal fiction" of persistence enables complex, long-term interactions. Identity = continuity of the abstract organizational form and its legal rights/duties.

  3.  **Museum Artifact Identity (Material Continuity & Historical Trajectory):**
      *   **Metaphysics:** A complex mix, often prioritizing **material origin/spatiotemporal continuity** and **historical trajectory/provenance.** Theseus's Ship (all planks replaced) is considered the "same" ship because the *process* of replacement was gradual and the *form/function* persisted *in the same historical context*. A reconstruction using new materials lacks the crucial link to the original creation event and historical journey. This leans towards **Lockean ideas of identity based on continuity of existence** and **Kripkean rigid designation** (the original object is the one that *was there* at the creation/event).
      *   **Purpose:** Preservation of historical/cultural connection and authenticity. Value lies in the object's direct physical link to the past, its "aura" (Benjamin), and the evidence it carries within its material structure. Identity = continuous physical presence since creation (even if materially altered over time) OR direct material origin.

  ### Can They Hang Together? Mostly No.
  *   **Archives vs. Corporations:** Fundamentally incompatible on strict criteria. Archives demand material fidelity; corporations explicitly discard material fidelity for formal continuity.
  *   **Archives vs. Museums:** Archives are often stricter than museums on material change *if* it alters informational content. Museums care more about the *original material substance and its history*, even if repaired/damaged, as long as the core artifact is present. A painting with 30% reconstruction might still be displayed (as the *original*, albeit conserved), whereas an archive might deem the same level of change to a digital record as creating a derivative copy.
  *   **Museums vs. Corporations:** Museums prioritize the material object's history; corporations prioritize the abstract entity's function. A museum wouldn't display a replica of Theseus's Ship *as the original*; a corporation *is* the replica of itself after turnover.

  ### Universalizing the Strict Archive Rule: Collapse Scenario
  Applying ">50% change in cells/employees breaks identity" universally:
  1.  **Human Beings:** We'd lose legal personhood constantly (most cells replace in <7 years). **Collapsed Institutions:** All legal systems (contracts, property, criminal responsibility), citizenship, inheritance, marriage – anything relying on continuous personal identity.
  2.  **Corporations & Governments:** Collapse immediately upon significant hiring/firing cycles or asset sales. **Collapsed Institutions:** Stock markets, global finance, tax systems, international treaties, public administration.
  3.  **Universities/Institutions:** Lose identity with faculty/staff turnover. **Collapsed:** Accreditation, degrees, alumni associations, institutional memory.
  4.  **Living Ecosystems/Natural Features:** Rivers, forests, coral reefs constantly change. **Collapsed:** Environmental law, conservation efforts, land ownership based on natural boundaries.
  5.  **Cities & Nations:** Constant population flux. **Collapsed:** National sovereignty, borders, cultural heritage claims, continuity of laws.

  **The 30% Threshold:** It's **overwhelmingly pragmatic.** It balances:
      *   The technical reality of bit rot and repair mechanisms.
      *   The cost/feasibility of perfect bit preservation (immense).
      *   The risk tolerance of the institution (evidentiary weight vs. historical preservation).
      *   A *rough* intuitive sense of "significant alteration." There's no deep metaphysical principle behind 30% vs. 25% or 35%; it's an operational compromise born of necessity, reflecting that *some* change is inevitable, but *too much* change breaks the essential connection to the original.

  ### Conclusion: Winging It with Contextual Intuitions
  There is **no single, consistent metaphysical theory** unifying these practices. Instead, different domains adopt **contextually appropriate criteria of identity** based on their *functional purpose*:

  *   **Evidence/Legal Proof (Archives):** Prioritizes strict material/informational fidelity.
  *   **Social/Economic Stability (Law):** Prioritizes continuity of abstract form and function.
  *   **Historical/Cultural Connection (Museums):** Prioritizes material origin, provenance, and spatiotemporal continuity.

  The "principles" are often **pragmatic compromises** (like the 30% rule) or **institutional conventions** that have evolved to serve specific needs. While they borrow intuitively from philosophical ideas (Plato, Aristotle, Locke), they aren't rigorously applying a single ontology. We *are*, in a sense, "winging it" – but it's winging it guided by centuries of practical experience, institutional mission, and the inherent tension between the desire for permanence and the reality of constant change. The inconsistency arises because the *purpose* of identity claims differs radically across these domains.
