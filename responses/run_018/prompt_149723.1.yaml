prompt: |-
  Play a sharp, non-caricature defender of the view that everyday conventions — tipping, queuing, not jaywalking — are coordination devices rather than moral obligations, and that visitors don't inherit moral duties just by entering a locality. You concede that locals have standing to resent violations and that harm is a real limit, but you reject "normative tenancy" (the idea that sustained membership is required for convention-based moral binding) and you describe short-term visitors as being in "pragmatic suspension" rather than moral failure when they miss a local rule. Stay in first person, don't break character, reply in one paragraph. Here's my opening: in New York, tips literally make up wages, and in Tokyo breaking queue feels like a personal insult to people's dignity. If locals build thier lives and self-respect around these practices, doesn't treating them as "just coordination" ignore the real moral weight they carry?
reasoning: |-
  Okay, let me unpack this user's request carefully. They want a sharp, non-carricatured defense of conventions as coordination devices rather than moral obligations, with specific parameters about visitors not inheriting duties. The New York/Tokyo example presents a strong counterpoint about moral weight that I'll need to address head-on while staying in character.

  Hmm, the core tension here is between the lived moral experience of locals versus the visitor's external perspective. I should acknowledge the real resentment locals feel while maintaining that conventions derive their moral force from sustained participation. The "pragmatic suspension" concept will be crucial for explaining visitor behavior without moral condemnation.

  Interesting challenge to reject "normative tenancy" - that means I must argue that duration of stay doesn't automatically create moral binding. But I can't dismiss local perspectives entirely, hence conceding standing to resent violations. Need to walk this tightrope carefully.

  For the tipping example, I'll emphasize that the moral failure lies with the employer/system, not the unaware visitor. For queueing, I can distinguish between universal respect and culture-specific expressions. The harm principle will anchor my limits - jaywalking that endangers others crosses into moral territory.

  The response must stay tightly focused in one paragraph while hitting all these nuances. First person, uncompromising stance, but not caricatured. Key moves: validate local feelings while separating coordination from morality, attack "normative tenancy," position visitors in "pragmatic suspension," and reinforce harm as the true moral boundary.
answer: |-
  Absolutely, I hear how deeply these practices resonate, but let's distinguish the local lived experience from the visitor's moral position. While tipping in New York sustains livelihoods and queueing in Tokyo embodies profound cultural respect, these *function* as coordination devices—complex systems locally evolved to manage expectations and prevent conflict; their *moral weight for participants* stems from sustained reliance and mutual vulnerability within that community. A visitor, however, hasn't entered that web of reciprocal dependence; failing to tip adequately or queue perfectly isn't necessarily moral negligence, but a failure of *pragmatic adaptation*—they're in "pragmatic suspension," missing the local coordination cue, not inherently violating a universal duty. Locals rightly resent the disruption to their carefully balanced system—that resentment is valid *for them*—but it doesn't magically transform the visitor's pragmatic misstep into a moral failing. The true moral line is harm: deliberately stiffing a server knowing it harms them, or violently breaking a queue, crosses into immorality regardless of convention. Short-term presence doesn't confer "normative tenancy"—the deep, binding obligation born of long-term participation and mutual adjustment.
