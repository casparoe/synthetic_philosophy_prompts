answer: |-
  Here’s the full exam package tailored to your specs, including a case-focused question, model answer, and marking scheme targeting philosophical application:

  ---

  ### Philosophy Mock Exam: Pain Asymbolia and the "Silent Surgeon"  
  **Time Allowed:** 60 minutes  
  **Total Marks:** 20  

  #### Exam Question  
  **Case Study:** Dr. Aris Thorne is a neurosurgeon who experiences *pain asymbolia* due to a rare brain condition. During a complex operation, she feels a sharp, cutting pain in her hand (sensory component) but exhibits no behavioral reaction: she does not flinch, protect her hand, or stop working. When asked afterward, she calmly reports, "The pain was intense and unquestionably *bad*," yet confirms she felt **zero motivation** to avoid or escape it.  

  **Key Distinction:**  
  - **Sensory-discriminative dimension:** Pain’s physical sensation (e.g., location, intensity).  
  - **Affective-motivational dimension:** Pain’s unpleasantness ("badness") and its drive to act (e.g., withdraw, avoid).  

  **Prompt:**  
  Does Dr. Thorne’s case undermine the theory that pain’s *badness* consists *entirely* in its power to motivate avoidance? Explain how the dissociation between her *evaluation* of pain’s badness and her *behavioral drive* challenges this motivational account. Use the sensory/affective distinction to structure your analysis.  

  ---

  ### Model Answer (Key Points Only)  
  Dr. Thorne’s case directly challenges the motivational account of pain’s badness. According to this theory, pain is bad *solely* because it creates an aversive drive (e.g., to stop or escape). Here, however, Dr. Thorne experiences the **sensory-discriminative dimension** (sharp, localized cutting sensation) and affirms the pain’s *badness* (affective evaluation), yet lacks all **motivational drive** to act. This dissociation proves that the affective *evaluation* ("this is bad") can exist independently of motivational consequences.  

  The case thus undermines the motivational account: if pain’s badness were defined purely by its power to compel avoidance, Dr. Thorne’s pain could not be "bad" (since she feels no drive). Yet she explicitly judges it as bad. This shows badness is rooted in the *affective dimension itself*—a distinct component separable from motivation. Pain asymbolia demonstrates that motivation is a *contingent effect* of badness, not its essence.  

  ---

  ### Marking Scheme (4 marks per point, total 20)  
  Candidates must hit **all five** points below. Each point is worth 4 marks based on clarity, accuracy, and relevance to the case.  

  | **No.** | **Must-Hit Point**                                                                 | **Common Pitfall (How Candidates Screw Up)**                              |  
  |---------|------------------------------------------------------------------------------------|--------------------------------------------------------------------------|  
  | **1**   | **Identify sensory vs. affective components in the case:** Correctly labels sharp/cutting pain as *sensory* and "badness" judgment as *affective*. | *Conflates the two dimensions or misattributes "badness" to sensory.* |  
  | **2**   | **Explain motivational account:** Clearly states the theory that pain’s badness *only* lies in motivating avoidance. | *Describes motivation without linking it to the *definition* of badness.* |  
  | **3**   | **Apply dissociation to challenge theory:** Uses Thorne’s lack of motivation *despite* calling pain "bad" to argue against the motivational account. | *Notes dissociation but doesn’t explain *how* it undermines the theory.* |  
  | **4**   | **Argue for independent badness:** Concludes that badness (affective) can exist without motivation, proving they are distinct. | *Claims Thorne’s pain "isn’t really bad" or ignores her explicit evaluation.* |  
  | **5**   | **Structure using distinction:** Uses sensory/affective framework throughout to organize the analysis. | *Drops the distinction after defining it or applies it inconsistently.* |  

  ---

  ### Notes for Your Study Group:  
  - **Why this works:** Forces students to *apply* the distinction to a novel case, not just define terms. The "silent surgeon" scenario tests if they grasp that dissociation refutes reductionist accounts (badness = motivation).  
  - **Autocorrect/Spelling:** All your examples (e.g., "then" vs. "than") are ignored—no issues!  
  - **Accessibility:** Zero citations needed; all concepts are self-contained in the prompt.  

  Let me know if you want a shorter version or a peer-review worksheet for the study group!
