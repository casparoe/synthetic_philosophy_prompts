  Considering consequences: blunt truth causes immediate distress each time, while deception spares grief but risks eroding trust. However, with Alzheimer’s, the father’s capacity for consistent trust is diminished, so the main harm is the emotional toll of repeated grief. Preventing that distress seems morally significant. 

