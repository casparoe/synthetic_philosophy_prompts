answer: |-
  ### **Artifact Politics Inc.**  
  *Engineering Political Certainty Since 2023*  

  **About Us**  
  Artifact Politics Inc. exists to resolve a critical inefficiency in human-technological relations: interpretive flexibility. We believe engineered systems possess inherent political ontologies that transcend social negotiation. Our mission is to extract, codify, and enforce these ontologies within technical specifications, eliminating downstream ethical debates. Current clients include municipal access-control networks, predictive policing infrastructure, and AI alignment consultancies. We deprecate context.  

  **Role:** Senior Ontological Engineer (Determinism Focus Preferred)  
  **Salary Band:** $220k–$380k (adjusts based on determinist conviction percentile)  
  **Location:** Remote (excluding jurisdictions with mandatory social-impact assessments)  

  ### **Core Responsibilities**  
  - Conduct ontological autopsies on biometric gates, reward-model architectures, and other alignment artifacts to isolate intrinsic political properties.  
  - Document findings in v.6.2+ Spec Templates using mandatory Political Property Tags (e.g., `<exclusionary-statistics context="irrelevant"/>`).  
  - Resolve continuity disputes between artifact iterations (e.g., replacing a facial-recognition gate that failed 94% of users with Fitzpatrick VI skin tones with its "statistically optimized" successor).  
  - Reject stakeholder claims of "emergent bias" or "social negotiation"; attribute all outcomes to artifact architecture.  
  - Audit legacy systems for latent political ontologies (e.g., park benches that structurally deter unhoused populations).  

  ### **Minimum Qualifications**  
  - PhD in Ontological Engineering, Techno-Political Semiotics, or related field (or 7+ years deploying artifacts in politically volatile zones).  
  - Mastery of Determinism Compliance Tools™ (DCT v.4.3).  
  - Proven ability to terminate interpretative forks during specification sprints.  
  - Portfolio demonstrating fixed political properties in ≥3 artifact classes (submission: ZIP archive, no oral defense).  
  - Willingness to depersonalize user-artifact interactions (see "Day in the Life").  

  ### **Perks & Benefits**  
  - **No Reinterpretation Guarantee:** All interface constraints are final and non-negotiable post-documentation.  
  - **Social Context Deprecation:** Our production environment scrubs runtime context variables.  
  - **Ontological Equity:** Vesting in political property patents (e.g., US Patent #11,876,530: "Biometric Gate as Voter-Suppression Artifact").  
  - **Determinist Stipend:** +$45k/year for applicants scoring ≥90% on the Perelman-Winner Rigidity Scale®.  
  - **Closure-First Culture:** All design debates end at technical closure; no "re-opening for social feedback."  

  ### **Equal Opportunity Employer**  
  Artifact Politics Inc. does not discriminate based on race, gender, creed, or dermatological profile. Note: Our office retinal scanners operate on legacy statistical priors (99.7% accuracy for iris pigmentation types A–F; 42% accuracy for types G–J). Applicants requiring accommodation must submit Form DCT-11 proving their needs don’t "recontextualize artifact intentionality."  

  ---

  ### **Engineering Philosophy Essay Prompt (Required)**  
  *500 words max. Attach as PDF. Salary band contingent on argument coherence.*  

  **Scenario:** A client’s facial-recognition access gate fails 78% of users over age 70 during night-cycle operations. The gate’s training data prioritized statistical efficiency over demographic coverage. The client claims the gate is "politically neutral" because (a) its failure rate is a mathematical inevitability, not malice, and (b) users can "negotiate access" via manual override tokens.  

  **Prompt:** Defend one position as the artifact’s true political ontology:  
  - **Position A (Determinist):** The gate *embodies* exclusionary politics. Its architecture (infrared spectrum bias, training-data hierarchy) materializes a prior political choice—identical to a low bridge designed to block buses. Manual overrides are irrelevant; the artifact’s *core function* enforces exclusion.  
  - **Position B (Closure-First Constructivist):** The gate *implements* a prior but gains politics only through closure (i.e., the client’s decision to deploy it without mitigation). User negotiation (override tokens) proves politics reside in social mediation, not silicon.  

  *Do not cite external literature. Reference only Artifact Politics Spec Templates v.6.2+.*

  ---

  ### **A Day in the Life**  
  *07:00:* Review overnight ontological audits of smart riot-control drones. Flagged "crowd-dispersal incentive structures" for spec-tagging (political property: `<population-control intent="active"/>`).  
  *09:30:* Resolve continuity dispute: User #4582’s biometric upload failed during asylum-claim processing. Replacement artifact (v.3.1) rejected identical data. Documented discontinuity as "non-political hardware fault," per Spec 4.7(a). User identity not logged.  
  *12:00:* Lunch (provided). Mandatory determinism alignment session: "Reward Functions as Fixed Moral Compasses."  
  *14:00:* Client call: Defended decision to omit "accessible" ramp specs from AI-managed park gates. Argued ramp presence would "introduce interpretive ambiguity into exclusionary artifact."  
  *16:30:* Drafted ontological deep dive: *"Door Handles as Class-Sorting Artifacts: Turning Radius as Political Primitive."*  
  *18:00:* Signed off on v.7.0 Spec Template update: Removed "Social Negotiation" appendix.  

  ---

  **To Apply:** Submit CV, portfolio, and philosophy essay to artifacts@artifactpolitics.inc.  
  Subject line: **ONTOLOGICAL CERTAINTY – [LAST NAME]**  
  *Applications implying artifact intentionality is mutable will be deprioritized.*  

  ---  
  *Artifact Politics Inc.: Where Specifications Replace Society™*
