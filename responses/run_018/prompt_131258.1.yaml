prompt: |-
  I have noticed a recurring argumentative pattern in cross-cultural ethics and comparative moral psychology, and I am not certain whether philosophy or the social sciences have a specific name for it. A commentator observes aggregate behavioral differences—Dutch directness in refusal versus Japanese indirectness mediated by context—and frames these as features of a "national communicative style." When confronted with internal diversity or individual counterexamples, the commentator immediately retreats to a statistical or historical gloss: the claim applies only to tendencies, not to every member. Yet in the very next step, the commentator relies on that same tendency to license predictions about specific encounters—to advise travelers, to design institutional protocols, or to interpret a particular interaction—without adjusting for base rates or individual evidence. I have seen the same structure applied to "German efficiency" or "Italian emotional expressiveness." The pattern is not quite stereotyping, since the universal individual claim is explicitly disavowed; not quite cultural essentialism, since no immutable nature is asserted; and not ordinary statistical reasoning, since the statistical frame is invoked defensively rather than used consistently for prediction. Does this oscillation between statistical retreat and practical essentialization have an established label? If not, please coin and define a term that distinguishes it precisely from stereotyping, essentialism, and rational base-rate use, with clear boundary conditions. Answer in one paragraph, not exceeding 200 words.
reasoning: |-
  Okay, the user is describing a specific argumentative pattern they've observed in cross-cultural ethics and moral psychology. They note how commentators point out aggregate behavioral differences between cultures—like Dutch directness versus Japanese indirectness—framing these as national communicative styles. When faced with counterexamples, they retreat to saying it's just a statistical tendency, not universal. But then, they immediately use that same tendency to make specific predictions or give advice without considering base rates or individual evidence. The user has seen this applied to stereotypes like "German efficiency" or "Italian emotional expressiveness."

  The user wants to know if this has a name in philosophy or social sciences. If not, they want a newly coined term that distinguishes this pattern from stereotyping, essentialism, and proper statistical reasoning. I need to recall relevant concepts. Stereotyping involves fixed traits applied to all members, which they disavow. Essentialism implies an immutable nature, which isn't claimed. Base-rate neglect is part of it, but the key is the inconsistency: retreating to statistics defensively but then using the tendency practically as if it's essential.

  I should consider if existing terms fit. "Statistical discrimination" might be related but usually involves decision-making with group data. "Reification" treats tendencies as concrete, but it's broader. "Modal fallacy" isn't quite right. Since the user wants a new term if needed, I can create one that captures the oscillation and inconsistency.

  The core issue is the double movement: stepping back to say it's just a tendency when challenged, but stepping forward to apply it categorically. A term like "tendential reification" or "retreat-to-mean fallacy" could work. But "modal retreat" might be too vague. "Statistical fig leaf" is descriptive but informal. After thinking, I settle on "tendential essentialization" to emphasize treating tendencies as essential properties. To specify the inconsistency, "modal oscillation" or "retreat-and-project" could add clarity.

  For the definition, it should highlight: 1) framing differences as statistical tendencies, 2) defensively retreating to that when countered, 3) projecting it onto individuals without adjustment. Boundary conditions: it must involve this oscillation; it's not stereotyping because universality is denied; not essentialism as mutability is possible; not base-rate use because statistics are inconsistent.

  The user's deeper need might be to name and critique this common but flawed reasoning, perhaps to use in academic work. I should ensure the term is precise and academically viable. Finally, structure the response: confirm no established term, coin "modal retreat and projection," define it clearly, and contrast with adjacent concepts in one paragraph under 200 words.
answer: |-
  This pattern lacks a universally established label, but can be precisely termed **"modal retreat and projection"** (MRP). MRP occurs when a commentator: (1) initially posits a group behavioral tendency (e.g., "tendency towards indirectness"); (2) under challenge, *retreats* to a modal qualification ("this is only a tendency, not universal"); yet (3) immediately *projects* that same tendency onto specific individuals within the group for predictive or interpretive purposes *without applying base-rate adjustments or seeking individuating evidence*. It differs from stereotyping by explicitly denying universality; from essentialism by not asserting immutability or inherent nature; and from rational base-rate use by inconsistently applying the statistical frame only defensively, not operationally. MRP's defining boundary condition is this specific oscillation: the defensive modal retreat is *instrumentally used* to immediately justify projection onto individuals, bypassing probabilistic reasoning. The "tendency" functions practically as a default expectation for individuals, shielded by the modal disclaimer.

