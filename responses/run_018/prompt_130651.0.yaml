  hey so me and my friend had this long arguement about funtionalism and whether it really lets you spread a mind across anything. specifically: imagine a city traffic grid with no central computer, just thousands of cheap sensors and lights adapting through local feedback loops — the whole network behaves like it's solving problems, but there's no 'brain' in any one node or server. if mental states are just functional roles, does that grid literally realize beliefs or is it only mimicking them? what's the most important implication of that scenario for multiple realizabilty — does it collapse the line between thinking and just behaving smart, or prove substrate really doesn't matter? and where does the argument break down if you push it too far? my friend says it's sci-fi nonsense but i think it's closer than people admit. lay out the key implications, especially the ones that actually change how you'd treat the system morally or legally.
