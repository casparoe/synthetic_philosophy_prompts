answer: |-
  ## Joint Statement: The Particularist-Generalist Adversarial Collaboration on Moral Principles

  **Preamble**

  This document represents the outcome of an adversarial collaboration between two philosophers committed to opposing meta-ethical positions regarding the role of principles in morality. We agree on the nature of our disagreement:

  *   **The Moral Particularist** holds that the moral relevance of any consideration (e.g., causing pain, keeping a promise) is fundamentally *context-dependent*. While patterns exist, morality is too complex, nuanced, and situationally sensitive to be adequately captured by finite, exceptionless, or universally applicable principles stating invariant valences (positive/negative) and weights for considerations. Moral reasons are *holistic*: their very nature as reasons, not just their strength or interaction with other reasons, can be altered by the context. Moral judgment is ultimately particularistic, requiring sensitivity to the unique constellation of features in each case.
  *   **The Moral Generalist** holds that morality, to be objective, shareable, and rationally tractable, *must* be governed by finite, substantive, and genuinely action-guiding principles. These principles articulate the invariant *valence* (e.g., *pro tanto* wrongness) of certain features (e.g., causing pain) and specify, at least in principle, how their *weight* interacts with other principled considerations to determine overall verdicts. While context is crucial for applying principles and determining which ones are salient or overriding, the core normative force of fundamental considerations *is* invariant and codifiable.

  **We jointly affirm and clarify:**

  1.  **Context Matters:** Both views fully acknowledge the profound importance of context in determining what one ought to do *all things considered*. The debate is categorically *not* about whether circumstances affect moral verdicts; they obviously do.
  2.  **The Core Disagreement:** Our dispute centers on *how* context affects moral verdicts and, crucially, *whether that contextual dependence can itself be fully captured within a finite set of true, substantive moral principles*. The Particularist denies this is possible; the Generalist affirms it. Specifically, we disagree on whether the fundamental normative *valence* of basic considerations (like causing pain) is context-invariant (Generalist) or can be fundamentally altered by context (Particularist), and whether the totality of morally relevant contextual interactions can be finitely specified in principle-form.

  **Section 1: Agreed Foundations and Constraints**

  We jointly affirm the following claims, recognizing that each represents a substantive constraint on an adequate moral theory and was potentially resistible by the other side at the outset:

  1.  **Contextual Variation is Ubiquitous and Significant:** Any adequate view must explain the evident variation in the moral relevance of features across contexts. For instance:
      *   The fact that an act causes pain typically counts strongly against it in a case of torture. This same fact may count weakly against it, be neutral, or even (in specific senses) count slightly for it (e.g., signaling necessary function) in a medically necessary procedure. In a consensual endurance practice (e.g., athletic training, BDSM), the causing of pain may be morally neutral or even positively valenced within the broader context of chosen goals and consent. An adequate view must account for *why* these variations occur and are reasonable, not merely note that they do.
      *   Similarly, taking pleasure in another's humiliation is typically a strong negative moral consideration. However, its valence and weight can shift: it might be mitigated (though still negative) if the pleasure is involuntary and regretted, or its negative weight might be dramatically altered (e.g., if the "humiliation" is part of a mutually understood and consented-to ritual performance where the pleasure is shared). An adequate view must explain this variability.
  2.  **Distinction: Contributory vs. Overall Verdict:** We agree on the conceptual distinction between a *contributory moral reason* (a consideration that counts for or against an action, influencing the final judgment) and the *all-things-considered moral verdict* (the final judgment about what ought to be done, all relevant reasons considered).
  3.  **Distinction: Pro Tanto vs. Prima Facie:** We agree on the distinction between a *pro tanto* reason/principle (one that genuinely counts for or against an action in its own right, but may be overridden by stronger countervailing reasons) and a merely *prima facie* reason/principle (one that *appears* to be a reason but may be defeated by showing it doesn't apply or is invalid in the context, without needing a stronger counter-reason).
  4.  **Invariance vs. Default:** We agree that claiming a consideration has an "invariant" valence (e.g., "causing pain is always *pro tanto* wrong") is a stronger claim than saying it has a "default" valence. A default valence implies a strong, stable presumption that can be overridden by sufficiently strong countervailing reasons, but crucially, *not reversed* in its fundamental polarity. Invariance rules out reversal *and* implies the reason always retains its force as a reason (though it may be overridden). A default allows for the *possibility* of absence (if the default condition isn't met) but not reversal.
  5.  **Explanation vs. Restatement:** A genuine principle must *explain* or *ground* moral verdicts, not merely restate them or summarize patterns post hoc. A principle like "Do what is right" is vacuous. A principle like "Causing pain is wrong unless it prevents greater pain" has explanatory ambition.
  6.  **Methodological Constraints: Evidence Against the Views:**
      *   **Evidence Against Particularism:** The discovery of a finite set of substantive, non-circular, non-disjunctive principles that demonstrably *generate* correct verdicts across a vast array of novel and complex cases (including those involving apparent valence reversal) through their interaction, without relying on uncodified "judgment calls," would count strongly against Particularism.
      *   **Evidence Against Generalism:** The persistent inability to formulate such principles despite significant effort, coupled with the demonstration of clear cases where a consideration's valence seems genuinely reversed in a way that cannot be plausibly explained as the overriding of a default by stronger counter-reasons *without* rendering the proposed principles either gerrymandered, infinitely complex, or vacuous (merely restating the verdict), would count strongly against Generalism. Evidence that moral competence consistently relies on case-based reasoning resistant to principled formulation is also relevant.

  **Section 2: Disagreements Table**

  | Issue (Neutral Wording)                                  | Particularist's Formulation (Signed)                                                                 | Generalist's Formulation (Signed)                                                                                               | Substantive / Partly Verbal | Crux                                                                                                                               | Concrete Case / Argument (w/ Predictions)                                                                                                                                                                                                                                 |
  | :------------------------------------------------------- | :--------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------ | :-------------------------- | :--------------------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ |
  | **1. Polarity of Reasons:** Can the fundamental valence (for/against) of a basic consideration (e.g., causing pain, pleasure in humiliation) change between contexts? | "The valence of fundamental moral considerations is not invariant. Features like causing pain or taking pleasure in another's suffering can genuinely function as positive reasons, negative reasons, or be neutral, depending holistically on the context." | "Fundamental moral considerations possess invariant valence (e.g., causing pain is always *pro tanto* wrong; pleasure in another's undeserved suffering is always *pro tanto* bad). Context affects the *weight* of these reasons and which overriding principles apply, not their core normative direction." | **Substantive**             | Is the *core normative force/direction* of a basic consideration contextually malleable at a fundamental level?                     | **Case: "Relief Humiliation":** A is deeply humiliated. B, witnessing this, takes pleasure *not in the humiliation itself*, but in the *relief* A will feel when B intervenes to stop it. Does B's *pleasure* function as a positive reason *for* intervening? <br> **Particularist:** Predicts Yes, valence can be positive here. <br> **Generalist:** Predicts No, pleasure in another's state (even relief) related to humiliation is at best neutral, likely still *pro tanto* problematic; the reason to intervene stems from duty/compassion, not the pleasure. |
  | **2. Default Reasons:** Do some reasons have a standing valence that can be outweighed but not reversed? What does "default" mean? | "Talk of 'default' valences is either shorthand for statistical regularity or describes a *prima facie* appearance. There are no considerations whose valence is truly immune to reversal in some conceivable context; the 'default' is always contingent and defeasible in kind, not just weight." | "Certain fundamental moral considerations (e.g., causing pain, breaking promises) possess a standing *pro tanto* negative valence. This valence is a default in the strong sense: it can be *outweighed* by stronger countervailing reasons, but it cannot be *reversed* into a positive reason. Calling it a default signifies this robust, non-reversible normative force." | **Partly Verbal (Re: 'Default') & Substantive (Re: Reversibility)** | Does the concept of a "default reason" entail *immunity to valence reversal*, or merely a strong, outweighable presumption? Are there any such reasons? | **Case: "The Necessary Lie":** Lying to a murderer at the door to save an innocent life. Both agree lying is *pro tanto* wrong but overridden. <br> **Crux Question:** Is there *any* context where the *fact that an act is a lie* could be a *positive* reason *for* doing it? <br> **Particularist:** Predicts Yes (e.g., ritual contexts, certain games, absurdist performance art designed to challenge deception norms). <br> **Generalist:** Predicts No; in such cases, it's either not truly lying (ritual/game context) or the act is wrong for other reasons; the lie-aspect remains negative. |
  | **3. Codifiability:** Can the relevant moral terrain be covered by a finite set of true, substantive principles? What distinguishes a principle from a gerrymandered summary? | "No finite set of substantive, non-trivial principles can capture the holistic, context-sensitive nature of moral reasons. Any proposed 'principle' either proves to have unanticipated counterexamples requiring ad hoc revision, becomes hopelessly disjunctive and complex, or collapses into vacuity (merely restating that the act is right/wrong). A genuine principle must provide non-circular guidance." | "A finite set of true, substantive moral principles is possible in principle. Such principles specify invariant valences and articulate defeasibility conditions and interaction rules. A formulation counts as a principle, not a gerrymandered summary, if it is relatively simple, non-disjunctive, predictive of novel cases, and provides genuine explanatory grounding for verdicts." | **Substantive**             | Is the complexity of moral contextual dependence fundamentally finite and rule-governed, or inherently open-ended and holistic?                                  | **Challenge:** Formulate a single principle or small set governing the valence/weight of "causing pain" that correctly handles: torture, necessary surgery, consensual BDSM, punishment, athletic training, causing pain to prevent greater pain, causing pain to prevent profound psychological harm, causing slight pain for trivial amusement. <br> **Particularist:** Predicts failure; any adequate principle set will become excessively complex/disjunctive or fail on novel cases. <br> **Generalist:** Predicts success in principle; complexity is manageable and reflects reality, not failure. |
  | **4. Moral Knowledge/Competence:** Does competent moral judgment involve subsumption under principles or uncodifiable particular judgment? | "Moral competence is a cultivated sensitivity to the salient features of particular situations. It involves pattern recognition and analogical reasoning honed through experience, not the algorithmic application of principles. Principles may serve as heuristic summaries or training tools, but the core judgment is uncodifiable." | "Moral competence centrally involves understanding and applying moral principles to situations. Competent judges recognize which principles are salient, interpret their scope, and weigh them according to their inherent priorities and specified defeasibility conditions. This process is principled, even if complex." | **Substantive**             | What is the fundamental cognitive process underlying reliable moral judgment?                                                     | **Argument:** Examine protocols for training expert moral judges (e.g., ethics committees, clinical ethicists). Analyze how they reason through novel, complex dilemmas. <br> **Particularist:** Predicts reasoning will heavily rely on case comparisons, intuition refinement, and holistic weighing resistant to principled reduction. <br> **Generalist:** Predicts reasoning will involve explicit or implicit appeal to principles, rules, and frameworks that are articulated, debated, and refined. |
  | **5. Moral Education/Advice:** Does improvement/advice require shareable principles? How is improvement possible without the other's machinery? | "Moral improvement occurs through guided perception, narrative, example, and practice in discernment – cultivating the ability to 'see' the morally relevant features and their import. Advice takes the form of highlighting salient aspects, drawing analogies, or sharing relevant experiences. Shareable principles are neither necessary nor sufficient for deep moral learning." | "Effective moral education and advice fundamentally rely on articulating and transmitting shareable principles. Principles provide the scaffolding for understanding *why* actions are right/wrong, enable criticism of judgments, and offer actionable guidance. Improvement involves refining one's grasp and application of principles." | **Substantive**             | What are the essential tools and methods for transmitting moral understanding and guiding moral improvement?                           | **Scenario:** Advising a student struggling with whether to break a confidence to prevent potential (but uncertain) harm. <br> **Particularist Approach:** Discuss analogous cases, explore specific features (nature of harm, certainty, relationship to confider, reasons for confidence), refine perception of relevant factors. <br> **Generalist Approach:** Appeal to principles concerning promise-keeping, preventing harm, duties of care; discuss weights and conditions for overriding confidentiality. <br> **Crux:** Can the Particularist method achieve reliable convergence without principles? Can the Generalist method avoid vacuous or overly rigid application? |

  **Section 3: Residual Disagreements and Load-Bearing Issues**

  The adversarial collaboration has clarified our positions and common ground. We agree that Sections 1 and 2 accurately represent our shared foundations and key points of dispute. We regard the disagreements in Section 2 as substantive and central to our divergence. While the debate over "default reasons" (Row 2) involves some terminological nuance concerning the strength of the "default" claim, the core substantive disagreement about the possibility of valence reversal remains stark and is intimately linked to Rows 1 and 3.

  **Load-Bearing Disagreements:** We identify the following rows as the primary load-bearing disagreements upon which the resolution of the broader debate most crucially hinges:

  1.  **Polarity of Reasons (Row 1):** This is fundamental. If valence reversal is genuine and pervasive, Generalism is deeply challenged. If all apparent reversals can be explained as outweighed defaults, Particularism loses a major argument.
  2.  **Codifiability (Row 3):** This is the ultimate practical test. If a finite, substantive, predictive, and explanatory set of principles *can* be formulated, Generalism prevails. If all attempts demonstrably fail in the ways Particularism predicts, Particularism gains strong support.
  3.  **Moral Knowledge/Competence (Row 4):** Evidence about the actual cognitive processes of competent judges provides crucial empirical traction on the debate.

  **Settled/Dissolved:** While our positions remain distinct, the collaboration dissolved potential misunderstandings. We agree the debate is *not* about context-sensitivity *per se* (both affirm it), nor about the existence of patterns (both acknowledge them). The distinction between *pro tanto* and *prima facie* (Agreed Claim 3) and between invariance and default (Agreed Claim 4) is clarified, though disagreement persists on whether genuinely invariant reasons exist (Row 1/2).

  **Crucial Tests and Potential Concessions:**

  *   **Regarding Polarity (Row 1):**
      *   **Crucial Test:** Identification of a *clear, uncontroversial* case where a fundamental consideration (like causing pain for its own sake, or pleasure in another's undeserved suffering) functions as a *positive contributory reason* in a way that cannot be plausibly reinterpreted as a) outweighed, b) applying to a different feature, or c) occurring in a context that negates the core consideration (e.g., not *real* pain/pleasure).
      *   **Observation Moving Particularist:** If no such case could be found or agreed upon despite extensive search and analysis, and all plausible candidates were successfully explained by Generalism as outweighed defaults or misdescribed features, the Particularist would have to concede a major motivation for their view is significantly weakened, strengthening the case for invariant valence.
      *   **Observation Moving Generalist:** If such a clear case were found and widely agreed upon by competent judges as involving genuine valence reversal, the Generalist would have to either concede that valence is not invariant for that consideration (undermining core Generalism) or provide a radically revised account of what constitutes a "fundamental consideration" or "valence" that accommodates the reversal without abandoning the core commitment to codifiable principles governing *that newly defined valence* (a significant theoretical cost).
  *   **Regarding Codifiability (Row 3):**
      *   **Crucial Test:** The successful formulation of a principle (or small set) governing a core consideration (e.g., pain) that is: a) *substantive* (non-vacuous), b) *finite and manageable* (not infinitely long or disjunctive), c) *predictive* (correctly handles novel, complex cases without post-hoc adjustment), and d) *explanatory* (provides insight into *why* the verdicts are correct, not just what they are).
      *   **Observation Moving Generalist:** Persistent failure to produce such a principle despite sustained, sophisticated effort by proponents, coupled with the emergence of novel cases that consistently defy principled formulation in ways predicted by Particularism (e.g., requiring ever more complex disjunctions or conditions that seem gerrymandered), would force the Generalist to concede that codifiability in the strong sense they require appears unattainable, significantly strengthening the Particularist case.
      *   **Observation Moving Particularist:** The successful formulation and widespread acceptance (among diverse, competent judges) of such a principle set that demonstrably predicts and explains verdicts across a wide range of cases, including apparent valence reversals explained as outweighed defaults or governed by clear interaction rules, would force the Particularist to concede that codifiability *is* possible, undermining a core tenet of their view. They would need to either abandon Particularism or radically reinterpret the nature and role of the successful principles (e.g., as useful heuristics, not fundamental).

  **Conclusion:**
  This document stands as a record of our collaborative effort to clarify the debate between Moral Particularism and Moral Generalism. We have articulated our shared ground, pinpointed our core disagreements with precision, and identified the crucial tests that bear most directly on resolving them. While fundamental disagreement remains on the issues outlined above, particularly concerning polarity and codifiability, we agree that progress has been made in isolating the exact points of contention and the nature of the evidence required to adjudicate them. We submit this statement jointly, acknowledging the strength and seriousness of the opposing view.

