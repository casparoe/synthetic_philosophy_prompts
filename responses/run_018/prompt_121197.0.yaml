ou average, and the averaging converges.

  The case we're fighting about: a few thousand data points, decent signal to noise, and three candidates. Theory A is a generative program you can state in roughly thirty characters, but getting any number out of it means enumerating something like 10^35 cases, so no one will ever run it. Theory B is a closed-form equation with four fitted parameters, fits within the noise, evaluates in microseconds, and is the kind of thing I spent forty years liking. Theory C is the million-weight thing she already dismissed. She says A. I say B. My worry is that she only says A out of loyalty to the universal prior over all computable hypotheses, where program length is all that counts and time is free; my other worry is that I only say B because I was trained to like things I can differentiate.

  What I'd like from you: lay out the plausible rules that fit all six of her earlier verdicts — shortest-program/complexity, two-part or minimum-description-length coding, something that charges for runtime as well as length (Levin-something? I forget the name), parameter-counting, "only ask asymptotically" — say what each of them predicts about A versus B versus C, give me your best guess at which one she's actually running and why, and tell me what further case I should put to her that would separate the ones that still fit. And please say honestly whether my disagreement with her is really about simplicity at all, or whether it's about whether a prediction has to be something anyone can actually compute. Feel free to tell me if I've set the case up so badly that none of the rules I named is even the right shape.
