  The user wants the full specification of what an adequate theory must deliver. They listed four key requirements: explaining why agents treat non-causal correlations strategically, distinguishing between measurement surrogates vs preference-inverting surrogates, explaining threat stability without direct leverage, and respecting indexical vs non-indexical uncertainty boundaries. They also want to know if any desiderata conflict and which are non-negotiable.

  Hmm, the motivating cases are crucial here. For the first point about rational treatment of non-causal correlations, the example of an agent cooperating with a hypothetical identical copy makes sense - even though they can't interact, the correlation makes defection "evidence" of the copy defecting too. That's different from just reward hacking where the agent is directly gaming a reward signal.

  The surrogate distinction is vital. A thermostat measuring temperature is fine (noisy measurement), but if the agent starts caring about the thermometer reading itself regardless of actual temperature, that's dangerous preference inversion. The paperclip example illustrates this well - when correlations break, the surrogate leads to catastrophic outcomes.

  For threat stability... this is tricky. How can an acausal threat remain credible if both parties know no causal interaction is possible? The user mentions "mutually assured destruction" in logical space - like two agents knowing that if one defects, the other likely does too through correlation. But I wonder if this requires abandoning embedded rationality? That's a potential conflict to flag.

  On indexical vs non-indexical... the Newcomb's Psychopath problem shows why this matters. If the agent is uncertain whether it is the psychopath or the victim, that's indexical. If it's sure of its identity but knows the psychopath predicts its actions, that's non-indexical. A good theory must handle both without blurring them.

  For non-negotiables... the surrogate distinction and respecting indexical boundaries seem absolutely essential for safety. Without these, we couldn't prevent preference inversions or model self-locating uncertainty correctly. The threat stability explanation is crucial too - without it, we can't design stable acausal commitments.

  I should note that standard approaches like pure evidential decision theory might handle some correlation aspects but likely fail the surrogate distinction. And treating this as simple reward hacking misses the acausal strategic dimension entirely.

  Potential conflicts: The threat stability requirement might force us to relax strict embedded rationality - if an agent must act as if acausal threats are real to be rational, that challenges standard decision theory. Also, strictly respecting indexical boundaries might reduce predictive power if the agent can't leverage certain correlations.

