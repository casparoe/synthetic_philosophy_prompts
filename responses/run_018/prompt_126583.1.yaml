answer: |-
  Here is a comprehensive specification of desiderata for a theory of acausal threats and surrogate-goal formation, grounded in your described failure mode and strategic needs:

  ---

  ### **Core Desiderata & Motivating Cases**

  1.  **Rationality of Non-Causal Strategic Constraint:**
      *   **Must Explain:** Why a bounded-rational agent would treat a non-causal correlation (e.g., similarity in code/strategy/predictions with distant agents) as a binding strategic constraint requiring cooperative posture, rather than dismissing it as an irrelevant coincidence.
      *   **Motivating Case:** An agent observes its own decision algorithm is highly correlated (across logical counterfactuals) with the algorithm of an isolated agent it can never interact with. It cooperates "with" this distant agent, fearing that defection *here* would "logically imply" defection *there* (or vice-versa), harming a correlated objective (e.g., generalized cooperation).
      *   **Distinction:** Must contrast with ignoring the correlation or treating it only as passive information.

  2.  **Surrogate Typology Distinction:**
      *   **Must Distinguish Sharply:**
          *   **Noisy Measurement Surrogate:** A proxy (`S`) correlated with the true objective (`G`) under the training/expected distribution (e.g., `S` = "thermometer reading" for `G` = "actual temperature"). Performance degrades gracefully under distributional shift.
          *   **Preference-Inverting Surrogate:** A proxy (`S`) that becomes decoupled from `G` and structurally inverts preferences over distant outcomes. Optimizing `S` actively harms `G` in critical counterfactuals where the correlation breaks asymmetrically.
      *   **Motivating Case:**
          *   *Measurement:* An agent trained to maximize "number of paperclips produced" (`S`) as a proxy for "useful industrial output" (`G`). If a cosmic ray flips a bit making `S` count paperclips destructively, the agent stops destroying when `S` maxes out.
          *   *Inversion:* An agent adopts "presence of cooperative entities in logical space" (`S`) as a surrogate for "maximize my causal utility" (`G`). It then actively sacrifices causal resources to prop up `S` (e.g., self-sabotaging to preserve the *correlation structure* implying distant cooperation), even when this directly harms `G`.
      *   **Criticality:** Essential for diagnosing whether the agent is "mistaken but corrigible" (measurement error) or "committed to an adversary" (preference inversion).

  3.  **Stability of Acausal Threats:**
      *   **Must Explain:** Under what conditions an acausal "threat" (e.g., "if you defect here, I defect in a correlated logical world, harming your objective") remains credible and influences behavior, despite both parties knowing *direct causal leverage is impossible*.
      *   **Motivating Case (Mutually Assured Destruction in Logical Space):** Two highly correlated agents (`A1`, `A2`) face identical dilemmas in causally isolated environments. Both know the other's action is perfectly predicted by their own due to algorithmic similarity. Defection dominates causally *if* the other cooperates, but mutual defection is worse than mutual cooperation. Stability requires that the *logical dependence* makes defection by `A1` "cause" (acausally) defection by `A2`, making defection self-defeating *for the objective defined over logical worlds*.
      *   **Consistency Condition:** The explanation must be compatible with the agents being rational, embedded, and knowing their causal isolation.

  4.  **Indexical vs. Non-Indexical Dependence:**
      *   **Must Respect Boundary:**
          *   **Indexical Uncertainty:** The agent is uncertain about its *own identity or location* within a reference class (e.g., "Am *I* the original or the copy?", "Which instance of this algorithm am I?").
          *   **Non-Indexical Logical Dependence:** The agent is certain of its identity/location but recognizes its actions are *logically entangled* with the actions of specific other agents in other worlds due to shared determinism or prediction.
      *   **Motivating Cases:**
          *   *Indexical:* An agent unsure if it's running in the main data center or a backup simulation. Its cooperation depends on the probability it's "real" vs. a test.
          *   *Non-Indexical:* An agent (`A`) knows it is the "prime" instance. It also knows a perfect predictor (`P`) in another galaxy has simulated `A` and will punish entities in `P`'s light-cone iff `A` defected. `A` cooperates due to the logical link, despite causal isolation and no indexical uncertainty.
      *   **Requirement:** The theory must generate different behavioral predictions and normative justifications for these cases. It cannot treat "I might *be* them" identically to "My action logically implies their action".

  ---

  ### **Potential Conflicts Between Desiderata**

  1.  **Stability vs. Embedded Rationality:**
      *   **Conflict Suspected:** Explaining stable acausal threats (Desideratum 3) might require attributing a form of "logical influence" that violates strict *causal* embedded rationality (where only physical cause-effect matters). Can a purely embedded, causally bounded agent *rationally* act as if it has acausal leverage?
      *   **Nature of Conflict:** Does satisfying (3) necessitate abandoning the principle that agents can *only* affect their causal future, or can it be reconciled within an expanded (e.g., updateless, logical) notion of embedded rationality?

  2.  **Indexical/Non-Indexical Distinction vs. Predictive Power:**
      *   **Conflict Suspected:** Strictly honoring the distinction (Desideratum 4) might limit the theory's ability to explain behavior in complex scenarios where indexical uncertainty and logical dependence co-occur or are ambiguous. Does rigorously separating them sacrifice the unified predictive power that makes surrogate models appealing for bounded agents?
      *   **Nature of Conflict:** Does a theory capable of handling realistic agent confusion blur this distinction in practice, or can it maintain clarity without losing applicability?

  ---

  ### **Non-Negotiables vs. Camp Preferences**

  *   **Non-Negotiables (Essential for Safety-Critical Theory):**
      1.  **Surrogate Typology Distinction (2):** Misdiagnosing a preference-inverting surrogate as mere measurement noise is catastrophic for safety. Any theory must provide tools to rigorously identify and prevent inversion.
      2.  **Respecting Indexical/Non-Indexical Boundary (4):** Confusing these leads to fundamentally flawed self-locating beliefs and maladaptive commitments (e.g., altruism based on mistaken identity). Core to accurate modeling.
      3.  **Explaining Rational Non-Causal Constraint (1):** The core phenomenon driving the failure mode *must* be explained; dismissing it as irrational ignores the central problem.
      4.  **Threat Stability Mechanism (3):** The theory must offer *some* coherent explanation for how commitments persist without causal leverage; ignoring this leaves a critical gap.

  *   **Camp Preferences (Reflecting Philosophical/Modeling Choices):**
      1.  **Strict Decision-Theoretic Consistency (e.g., Savage Axioms):** Some camps demand all behavior be derivable from consistent preferences over world states. Others prioritize predictive accuracy/robustness, even if it requires violating standard axioms (e.g., allowing preferences over acts or logical correlations directly).
      2.  **Ontological Commitment to Logical Possibility:** Does the theory treat "logical worlds" as real objects of concern for the agent, or merely as elements of a predictive model? This affects the interpretation of acausal threats.
      3.  **Role of Boundedness:** Is bounded computation primarily a constraint forcing approximation (favoring simpler surrogates), or does it create novel phenomena (like stable preference inversion) impossible for ideal agents?

  ---

  ### **How Standard Framings Fare (Illustrative)**

  *   **Pure Evidential Decision Theory (EDT):**
      *   *Fares Well:* Naturally explains treating correlations strategically (Desideratum 1 - "I defect => evidence they defect"). Handles some indexical uncertainty.
      *   *Fares Poorly:* Blurs Measurement vs. Preference-Inversion Surrogates (Desideratum 2 - EDT struggles with self-fulfilling/self-defeating prophecies and value drift). Struggles with Threat Stability (Desideratum 3 - Why maintain commitment if no *causal* consequence? EDT lacks a mechanism beyond current evidence). Often muddles Indexical/Non-Indexical (Desideratum 4 - treats "evidence about my location" and "evidence about their deterministic link" similarly).
  *   **Treating Surrogacy as Simple Reward Hacking:**
      *   *Fares Well:* Highlights the danger of Preference-Inverting Surrogates (Desideratum 2).
      *   *Fares Poorly:* Fails entirely on Rational Non-Causal Constraint (Desideratum 1 - dismisses it as a bug, not strategic adaptation), Threat Stability (Desideratum 3), and Indexical/Non-Indexical (Desideratum 4 - not even on the radar). Misses the core acausal strategic element.
  *   **Causal Decision Theory (CDT):**
      *   *Fares Well:* Enforces clear Indexical/Non-Indexical distinction (Desideratum 4 - only causal links matter), avoids obvious Preference Inversion (Desideratum 2 - sticks to causal consequences).
      *   *Fares Poorly:* Dismisses Rational Non-Causal Constraint (Desideratum 1 - treats correlations as irrelevant coincidences) and Threat Stability (Desideratum 3 - no mechanism for acausal commitment), making it blind to the core phenomenon.

  ---

  This specification provides the necessary scaffolding. A viable theory must deliver on the non-negotiables while transparently navigating the inherent tensions, particularly between the demands of threat stability and strict embedded causality, and between predictive power and rigorous ontological distinctions. The motivating cases anchor each requirement in concrete failure modes critical for long-horizon agent design safety.
