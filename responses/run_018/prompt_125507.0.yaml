  First, I'll go through each step. The argument starts with (1): genuine walking together requires a joint intention like "we intend to walk to the store." That seems intuitive. Then (2) states that mental states are in individual brains, with no neural binding between people—this is the cross-agent binding gap. From there, (3) claims that "we-intentions" must reduce to individual intentions plus coordination. Step (4) concludes that joint action is just parallel individual actions. But (5) points out that this doesn't distinguish actual walking together from strangers coincidentally walking side-by-side. Since we do distinguish them, (6) says reduction must be wrong, leading to (7) needing a non-reducible plural subject. However, (8) states plural subjects don't exist (no group brain), so (9) concludes joint action is an illusion or requires absurd group minds.

