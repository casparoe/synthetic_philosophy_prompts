answer: |-
  ## The Four Lights

  **(Pratijñā: Thesis with Pratyakṣa)**
  Through smoke that curls, through jar that's sharply sought,
  The senses grasp the world that stands revealed.
  **The bare floor only shows the missing pot.**
  Four lights illuminate the truth we've caught.

  **(Hetu: Reason with Anumāna)**
  No form to find where being is concealed,
  Inference tracks the cause that absence brought,
  **The empty room knows its own emptiness.**
  From doubt's assault, the reasoned truth is sealed:
  **The bare floor only shows the missing pot.**

  **(Udāharaṇa: Illustration with Upamāna)**
  Like cow recalled when gavaya is hailed,
  Comparison bridges names by likeness taught,
  **The empty room knows its own emptiness.**
  Where "not" is claimed, perception has prevailed,
  Shows presence, yes, and shows the gap alone.
  **The bare floor only shows the missing pot.**

  **(Upanaya: Application with Śabda)**
  The Vedas speak of things beyond our thought,
  Trusted word plants seeds that can't be bought.
  **The empty room knows its own emptiness.**
  Absence declared? A present sign is caught,
  A known ground failing where the pot should be.
  **The bare floor only shows the missing pot.**

  **(Nigamana: Conclusion)**
  No fifth source needed; doubt is firmly fought.
  The unseen lacks a face, no form is fraught,
  **The bare floor only shows the missing pot,**
  **The empty room knows its own emptiness.**

  ---

  ### Notes on Philosophical & Structural Precision

  1.  **Villanelle Form:** The strict pattern (A1bA2 / abA1 / abA2 / abA1 / abA2 / abA1A2) is followed. Refrain A ("The bare floor...") voices the Nyāya position: absence (the missing pot) is known *through* the apprehension of a positive ground (the bare floor) and the *failure* to perceive the expected object. Refrain B ("The empty room...") voices the Advaita Vedānta/Mīmāṃsā position: absence (emptiness) is directly cognized as a positive entity itself. They alternate and converge without synthesis in the final quatrain, enacting the unresolved debate *and* Nyāya's steadfast refusal to grant anupalabdhi independent status.
  2.  **Syllogism Mapping:**
      *   **Tercet 1 (Pratijñā):** States the thesis ("Four lights illuminate the truth we've caught") grounded in direct sensory perception ("Through smoke that curls, through jar that's sharply sought").
      *   **Tercet 2 (Hetu):** Gives the reason ("No form to find where being is concealed") using the language of inference ("Inference tracks...", "reasoned truth"). Absence lacks an independent object ("form") to be perceived.
      *   **Tercet 3 (Udāharaṇa):** Provides the classic illustration (seeing bare ground implies the pot's absence, "Shows presence, yes, and shows the gap alone") using the mechanism of comparison/upamāna ("Like cow recalled when gavaya is hailed").
      *   **Tercet 4 (Upanaya):** Applies the illustration universally ("Absence declared? A present sign is caught") via the authority of testimony/śabda ("The Vedas speak...", "Trusted word...").
      *   **Tercet 5 (Nigamana):** Draws the conclusion ("No fifth source needed; doubt is firmly fought. / The unseen lacks a face, no form is fraught") – anupalabdhi is reducible to perception (seeing the ground *without* the pot).
  3.  **Pramāṇa Integration:**
      *   Tercet 1: **Pratyakṣa** (Perception) - "Through smoke that curls, through jar that's sharply sought".
      *   Tercet 2: **Anumāna** (Inference) - "Inference tracks the cause that absence brought".
      *   Tercet 3: **Upamāna** (Comparison) - "Like cow recalled when gavaya is hailed".
      *   Tercet 4: **Śabda** (Testimony) - "The Vedas speak of things beyond our thought, / Trusted word plants seeds that can't be bought".
  4.  **Philosophical Nuances:**
      *   **Svataḥ/Parataḥ Prāmāṇya:** The reliance on inference and testimony hints at Nyāya's *parataḥ prāmāṇya* (externally validated knowledge), contrasting with the implied intrinsic validity (*svataḥ prāmāṇya*) in the Advaita refrain. "Doubt's assault" and "reasoned truth is sealed" point to the need for external validation.
      *   **Tarka:** The logical structure of the poem itself, moving through the syllogism, enacts the role of *tarka* (suppositional reasoning/counterfactual analysis) used by Nyāya to defend its positions against opponents.
      *   **Anupalabdhi Reduction:** The core argument is consistently made: absence is known via the perception of a locus *combined with* the non-perception of the expected object ("Shows presence, yes, and shows the gap alone", "A known ground failing where the pot should be", "The unseen lacks a face"). The final lines juxtapose the two views without reconciling them, emphasizing Nyāya's orthodox stance as stated in the thesis and conclusion.
