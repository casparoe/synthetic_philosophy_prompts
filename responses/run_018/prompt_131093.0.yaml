  Here’s a concrete example centered on **an artist’s conflicting commitments to authenticity versus evolution**, designed to exploit the ambiguity in second-order norms for self-continuation:

  ### **The Case of the Divided Painter: "Alex" Across Worlds**
  **Scenario in World W₁ (Original World):**  
  Alex is a celebrated painter whose work is defined by "raw emotional honesty." Their artistic identity is built on two core meta-commitments:  
  1. **Fidelity to Roots:** "My art must *always* reflect my deepest, unchanging core self—the trauma and joy that shaped me. To abandon this is to erase *me*."  
  2. **Creative Evolution:** "An artist must transcend their past to stay vital. Stagnation is self-betrayal."  

  These commitments conflict in practice, but Alex manages them through dialectical tension (e.g., painting new subjects while retaining a signature "visceral" style).  

  **Scenario in World W₂:**  
  - Alex undergoes a profound spiritual awakening, renouncing all "self-obsessed" art.  
  - They now create serene, abstract works devoid of personal narrative, viewing their past art as "a prison of ego."  
  - W₂ Alex asserts: "I’ve finally become my *true self*—free from the old compulsions. My past work was inauthentic."  

  **Scenario in World W₃:**  
  - After the same awakening, Alex destroys their brushes, vowing: "My old art was sacred. To make *anything* else would desecrate my life’s meaning."  
  - They become an art conservator, preserving others’ works but never creating anew.  

  ---

  ### **The Metaphysical Tension: Is W₂/W₃ Alex the *Same* Person?**  
  The ambiguity arises from Alex’s own competing second-order norms:  

  1. **From the "Fidelity to Roots" Norm:**  
     - W₂ Alex has *abandoned* the core self that defined their artistic identity. The rejection of personal narrative isn’t just a change—it violates the *essence* of what Alex (in W₁) deemed necessary for self-continuity.  
     → *Thus, W₂ Alex is merely a **counterpart***—a being who evolved past being "Alex."  
     - W₃ Alex, however, *honors* their past by preserving its legacy, even at the cost of creation.  
     → *Thus, W₃ Alex **is** the same person*, sacrificing evolution for fidelity.  

  2. **From the "Creative Evolution" Norm:**  
     - W₂ Alex exemplifies growth: they transcended their "ego prison" to achieve higher authenticity.  
     → *Thus, W₂ Alex **is** the same person*, fulfilling their deepest potential.  
     - W₃ Alex *froze* their identity, rejecting evolution for nostalgia. This betrays the imperative to transcend.  
     → *Thus, W₃ Alex is a **counterpart***—a diminished shadow of the original.  

  ---

  ### **Why This Creates Genuine Ambiguity**  
  - **No Physical/Psychological Discontinuity:** In both W₂ and W₃, Alex has clear psychological continuity (same memories, cognitive traits). The conflict is purely *axiological*: which meta-commitment defines "being Alex"?  
  - **Internal Conflict of Norms:** Alex’s own W₁ values pull in opposite directions:  
    - Is "authenticity" found in *loyalty to origins* (making W₃ Alex "true") or in *liberation from origins* (making W₂ Alex "true")?  
  - **No Neutral Ground:** Whether W₂/W₃ Alex is "really" Alex depends on *which of Alex’s own norms we privilege*—and neither is self-evidently supreme.  

  ---

  ### **Philosophical Substance**  
  This case:  
  1. **Exposes Value-Hierarchies as Identity-Constituting:** Personal identity hinges not on properties (e.g., "makes emotional art") but on *which values govern which properties matter*.  
  2. **Challenges "Essential Traits":** Traits like "artistic style" aren’t inherently essential; their status depends on the agent’s higher-order commitments.  
  3. **Moral Stakes:** If Alex in W₂ destroys their early paintings (calling them "lies"), is this a *genuine act of self-repudiation* by the original Alex (transworld identity) or an *alien act* by a counterpart? This affects judgments of responsibility and regret.  

  **Result:** Transworld identity and counterpart theory generate irreconcilable descriptions of the same scenario because Alex’s *own criteria for being "Alex"* are irreducibly dualistic. The ambiguity isn’t epistemological—it’s metaphysical, rooted in the agent’s fractured self-constitution. This moves beyond physicalism by making identity hostage to normative contradictions within the self.
