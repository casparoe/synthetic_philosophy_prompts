  The user wants a rigorous defense of causal attributions as predictive habits. So the reconstructed argument would say that since we can't access necessary connections, our claims about drugs causing effects are based on observed regularities, not metaphysical truths. This could make clinical trial evaluations more cautious, focusing on prediction rather than assuming inherent causal powers.

  But where might this argument collapse? If you remove divine agency, what grounds the regularities? Without theology, the argument relies on human ignorance. But science assumes that mechanisms exist even if unknown. If future research uncovers mechanisms, does that undermine the epistemic occasionalist view? Also, in practical terms, clinical decisions need some level of causal confidence for ethical approvals. Overemphasizing uncertainty could hinder medical advancements.

