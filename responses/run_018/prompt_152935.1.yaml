answer: |-
  Your confusion stems from a subtle but crucial difference in causal structure: **who controls the disjunction's trigger.** This determines whether the agent has causal leverage over the outcome, exposing a fundamental asymmetry in CDT's handling of these scenarios. Let's formalize both problems explicitly to reveal the divergence.

  ### 1. Counterfactual Mugging (CM) Structure
  - **World state:** Coin flip (H/T) occurs *before* agent acts.  
  - **Agent's choice:** *After* coin outcome is fixed (but unknown), agent chooses to pay (P) or not pay (¬P).  
  - **Predictor's policy:**  
    - If coin = H, reward R iff agent pays *in this branch*.  
    - If coin = T, no reward regardless.  
  - **Causal graph:**  
    `Coin → {Reward?} ← Agent's choice`  
    *But note:* Reward is *counterfactually dependent* on choice *only* in H-world. In T-world, choice has no causal effect.  

  **CDT analysis:**  
  - Agent computes expected utility *conditional on their actual action*.  
  - In T-world, paying costs $10 but gains nothing (reward is impossible).  
  - In H-world, paying costs $10 but gains R (if R > $10, paying dominates).  
  - Since the coin flip is independent and already fixed, CDT ignores the *counterfactual* H-world when in T-world. Paying in T-world has *no causal benefit* → CDT recommends ¬P.  

  ### 2. XOR Blackmail (XB) Structure
  - **World state:** Blackmailer sets a penalty mechanism *before* agent acts.  
  - **Agent's choice:** Selects action A or B (or more).  
  - **Blackmailer's policy:** Activates penalty P iff agent chooses *exactly one* of {A, B} (i.e., A XOR B).  
  - **Causal graph:**  
    `Agent's choice → {XOR?} → Penalty?`  
    Here, the XOR outcome is *directly caused* by the agent's choice.  

  **CDT analysis:**  
  - Agent must evaluate the causal effect of choosing A vs. B.  
  - Choosing A *alone* causes XOR=true → penalty P.  
  - Choosing B *alone* causes XOR=true → penalty P.  
  - Choosing *both* (if possible) causes XOR=false → no penalty.  
  - If only A or B is allowed (binary choice), *every* action causes penalty (since XOR is always true for a single action). CDT sees no way to avoid P → pays ransom if it avoids a *larger* penalty, but still loses.  

  ### Key Asymmetry: Control over the Disjunction
  - In **CM**, the disjunction (coin flip) is controlled by an *external process* (predictor). The agent's action only affects outcomes in one branch. CDT ignores correlations where the agent lacks causal influence.  
  - In **XB**, the disjunction (XOR) is *defined over the agent's actions themselves*. The agent directly controls the inputs to the disjunction, making the penalty *causally downstream* of their choice. CDT must account for it.  

  ### Why Framing Isn't the Issue
  If you recast CM as "Omega penalizes you $R if the coin is tails and you didn't pay," it *still* doesn't change the causal independence: paying in the tails world doesn’t cause Omega to withhold the penalty; the penalty is fixed by the coin. In XB, *not* paying the ransom *causes* the XOR condition to hold iff the blackmailer’s threat is genuine.  

  ### Implications for AI Alignment
  Resolving this ambiguity is critical:  
  1. **CM tests acausal correlation handling.** CDT "passes" by refusing to pay in irrelevant branches.  
  2. **XB tests logical control over complex outcomes.** CDT "fails" because it can't recognize that avoiding XOR requires coordinating actions (e.g., mixed strategies or logical dependencies).  
  3. A robust agent must handle *both* causal independence *and* logical dependencies in its action space. Collapsing them obscures these distinct challenges.  

  **Verdict:** The distinction between counterfactual mugging and XOR blackmail is structurally robust.
