  hey, i'm a science journalist covering the animal-mind debates and i keep running into people who trot out the old animals-are-machines line to shut down talk about octopus pain or dog grief. just this week a neuroscientist said they're automata, end of story, so no inner life. but that feels like it's smuggling in five different claims at once. can you lay out the precise readings of that slogan — from the trivial (they're physical stuff that moves by mechanics) to the radical (they literally lack all conscious experience) — and for each say whether descartes actualy held it, whether it's defensable now, and whether it gets her to the conclusion that grief in dogs isn't real? i want a menu i can bring to my editor, with a verdict on which version people mean when they use the line to end an argument, and why that version still doesn't do the work.
