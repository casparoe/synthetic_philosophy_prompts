  Descartes did claim animals are automata without minds, but he didn't deny they have biological functions. The key is distinguishing his specific dualism from modern misrepresentations. Next, I need to categorize the interpretations. The trivial version—animals are physical systems—isn't controversial today and doesn't deny consciousness. Then there's the biological mechanism view, which is also widely accepted but doesn't address inner life.

  The radical eliminativist view is the one that outright denies any consciousness in animals. This is what people like that neuroscientist might be invoking. But current science, with evidence like pain behaviors and neuroanatomy in various species, challenges this. I should mention the precautionary principle here—even without certainty, we should consider animal welfare.

