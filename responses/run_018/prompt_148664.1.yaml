prompt: |-
  I'm a graduate student in a philosophy of biology seminar that has just worked through the standard unit-of-selection literature—gene-centered views, multi-level selection frameworks, and the familiar statistical-versus-causal distinction. The textbooks present the debate as largely resolved by hierarchical modeling, but I'm struck by applied domains where evolutionary individuation remains conceptually murky: microbiome medicine, where it's unclear whether selection targets the host genome, the microbial consortium, or an integrated metabolic network; synthetic ecosystem design, where engineers construct reproducing functional groups that don't map cleanly onto organisms; and evolutionary conservation, where policymakers must decide whether to preserve genetic diversity, population structure, or ecosystem-level functional roles. These aren't merely applications; they expose unresolved questions about what counts as a reproducer, how functional integration relates to evolutionary fate, and whether explanations at one level possess autonomous causal power.

  Assume a researcher has about three to four years, strong conceptual-analytic skills, and minimal wet-lab training. Which open conceptual problems within the units-of-selection debate deserve priority? Provide a defended agenda, not a survey: rank the two or three questions that are both tractable for a philosopher and upstream of these applied domains. For each, explain its dependency relations—what other conceptual issues must be settled first, and what downstream work it enables—together with the criteria you use to rank importance, tractability, and neglect. Specify what kind of conceptual or empirical result over the next few years would cause you to reorder the ranking. Do not provide a bibliography, reading list, or citation targets; I need reasoning about where limited effort should go and why.

  End with the prioritized agenda in fixed form: \answer{1. [brief label of top question]; 2. [brief label of second]; 3. [brief label of third]}
reasoning: |-
  Okay, the user is a graduate student in a philosophy of biology seminar who's been studying the unit-of-selection literature. They've noticed that while textbooks present the debate as resolved through hierarchical modeling, there are still murky areas in applied domains like microbiome medicine, synthetic ecosystem design, and evolutionary conservation. These applications raise unresolved questions about what counts as a reproducer, how functional integration relates to evolutionary fate, and whether explanations at one level have autonomous causal power.

  The user is asking for advice on which open conceptual problems within the units-of-selection debate deserve priority for a researcher with 3-4 years, strong conceptual-analytic skills, and minimal wet-lab training. They want a defended agenda ranking 2-3 questions that are both tractable for a philosopher and upstream of these applied domains. For each question, I need to explain dependency relations, criteria for ranking, and what kind of result would cause reordering.

  I should consider the key criteria: importance (how fundamental the question is to resolving ambiguities in applied domains), tractability (suitability for conceptual analysis without heavy empirical work), and neglect (whether it's under-addressed in current literature). The applied domains mentioned by the user all point to core conceptual gaps: defining reproducers, understanding functional integration versus evolutionary independence, and clarifying causal autonomy across levels.

  The top priority should be redefining "reproducer" since it's foundational—all the applied cases struggle with what counts as a unit that evolves. Microbiomes, synthetic ecosystems, and conservation policies all need clearer criteria for what constitutes an evolutionary individual. This is tractable through conceptual analysis of existing biological cases and philosophical work on individuality. Dependency: it requires refining notions of heritability and integration, but doesn't depend on other major debates. Downstream, it would clarify all the applied domains. A result that would reorder this would be if empirical work suddenly provided a universal definition, but that's unlikely.

  Second priority should be functional integration versus evolutionary independence. Applied domains like synthetic ecosystems show that functional groups don't always align with units of selection. This question examines whether function ensures evolutionary persistence, which is crucial for predicting evolutionary outcomes. Dependency: it builds on the reproducer definition but adds functional analysis. Tractability: philosophers can analyze cases of decoupling without new data. Downstream, it informs conservation (preserving function vs. genetics) and synthetic biology design. If new models showed function always correlates with fitness, this might drop in priority, but current evidence suggests otherwise.

  Third priority is causal autonomy—whether higher-level explanations have independent causal power. This is critical for multi-level selection debates, especially in microbiome medicine where host vs. consortium selection is contested. Dependency: it relies on solving the first two questions to avoid circularity. Tractability: conceptual tools like causal modeling can handle this. Downstream, it resolves conflicts in attribution across applied domains. If new statistical methods could fully reduce higher-level effects, this would become less urgent, but hierarchical modeling still leaves room for autonomy debates.

  I'll emphasize that these priorities form an interdependent sequence: start with defining units, then examine how function relates to their evolution, and finally tackle causal attribution. This approach makes the agenda coherent and cumulative. The user's need for actionable research direction is met by focusing on upstream issues that unlock clarity in their areas of interest.
answer: |-
  Based on your focus on applied murkiness and the need for upstream conceptual clarity using philosophical tools, I prioritize questions where resolving conceptual ambiguities *directly enables progress* in the applied domains you cite, while being tractable for primarily conceptual work. Importance is ranked by: (1) **Breadth of Downstream Impact** (how many applied domains it clarifies); (2) **Foundational Status** (how essential it is for coherently framing other debates); (3) **Neglect** (relative underdevelopment in standard hierarchical frameworks); (4) **Tractability** (amenable to conceptual analysis/case studies without novel empirical data generation). The agenda addresses the core tensions in your examples: defining evolving units and their causal powers.

  1.  **Refining the "Reproducer" Concept Beyond Lineage-Centricity:** *Why Top?* Your applied cases (microbiome consortia, synthetic functional groups) fundamentally challenge the textbook assumption that units of selection must be *lineages* with high-fidelity replication. Current reproducer definitions struggle with entities exhibiting differential persistence *and* function, but with lateral acquisition, horizontal gene transfer, or assembly-based "reproduction" (like engineered ecosystems). This is **foundational** (defining the *candidate* units is prior to analyzing selection *on* them), has **broad downstream impact** (defining units is the first step in microbiome host/symbiont/consortium selection debates, synthetic ecosystem design, and deciding what "diversity" to conserve), is **neglected** (hierarchical models often assume units rather than rigorously define them for novel cases), and **tractable** (requires conceptual analysis of persistence, heritability, and integration across biological levels, drawing on existing empirical cases like holobionts or obligate symbioses).
      *   *Dependencies:* Requires clarifying minimal criteria for "heritability" in non-Mendelian systems and the relationship between metabolic/functional integration and evolutionary independence. Must engage with work on biological individuality but focus specifically on the *reproduction/persistence* aspect for selection.
      *   *Downstream Enables:* Provides the conceptual toolkit to identify plausible units in novel applied contexts (e.g., is a synthetic metabolic loop with recruited new members a "reproducer"?). Essential for formulating meaningful multilevel selection models in microbiome medicine or synthetic ecology.
      *   *Reordering Trigger:* Widespread empirical demonstration that all novel entities (like stable synthetic consortia) *always* reduce to selection on either host genomes or individual microbial lineages would lessen urgency. Current evidence trends strongly against this.

  2.  **The Causal Efficacy of Functional Integration vs. Component Lineage Fitness:** *Why Second?* Your examples highlight a tension: high functional integration (e.g., host-microbiome metabolism, engineered nutrient cycles) seems crucial for survival/reproduction, yet components (host genes, individual microbes) can have conflicting evolutionary interests. Does the *integrated function itself* causally influence evolutionary outcomes *independently* of the summed fitnesses of the components? This is **highly important** for applied domains (e.g., conserving ecosystem function vs. specific genes; designing for consortium stability vs. individual strain fitness; treating microbiome as a metabolic unit vs. targeting specific pathogens), **foundational** for claims of higher-level selection/autonomy, **neglected** (standard MLS partitions often assume component fitnesses are primary), and **tractable** (philosophers can analyze causal models, counterfactual dependencies, and fitness landscapes in well-documented cases like obligate symbioses or mutualisms).
      *   *Dependencies:* Builds on a clarified "reproducer" concept (Question 1) but focuses on the causal dynamics *during* selection. Requires careful disentangling of functional interdependence from causal interdependence in evolutionary change.
      *   *Downstream Enables:* Determines whether explanations appealing to "consortium-level function" or "ecosystem role" in evolution/conservation/synthetic design are merely heuristic or possess irreducible causal power. Directly informs policy (conserve function carriers or the function itself?) and engineering goals (optimize consortium output or individual replicator fitness?).
      *   *Reordering Trigger:* Development of universally accepted statistical or causal modeling techniques that *reliably* decompose selection on integrated functional units *entirely* into selection on their component lineages without explanatory loss. Current MLS techniques remain contested in complex cases.

  3.  **Criteria for Causal Autonomy in Evolutionary Explanations:** *Why Third?* Even if multilevel selection is statistically demonstrable, your applied domains (especially policy/medicine) need to know: when is an explanation at one level (e.g., host genome, microbial consortium) *sufficient* without needing constant reference to lower levels? This addresses the "autonomous causal power" concern directly. It's **important** for practical decision-making (e.g., targeting host genetics vs. microbiome composition in medicine; prioritizing gene banks vs. habitat corridors in conservation), **neglected** (the statistical vs. causal debate often stops at demonstrating selection, not explanatory sufficiency), and **tractable** (philosophical analysis of causation, explanation, and inter-theoretic reduction). However, it depends more heavily on resolving Questions 1 & 2.
      *   *Dependencies:* Requires prior clarity on what the units *are* (Q1) and how function relates to component fitness (Q2). Deeply intertwined with general philosophy of science debates on reduction and emergence.
      *   *Downstream Enables:* Provides principled justification for when interventions or explanations can legitimately focus on a specific level (e.g., managing a polluted river ecosystem as a functional unit vs. managing each species population) without accusations of "sloppy reductionism" or "misplaced concreteness." Crucial for legitimizing applied fields like ecosystem medicine or synthetic ecology as having their own explanatory bases.
      *   *Reordering Trigger:* Emergence of clear, widely adopted philosophical or biological criteria for explanatory autonomy that resolve debates in key case studies (e.g., the evolution of eusociality or lichens) without needing further fundamental conceptual work. Current discussions remain fragmented.

  **Prioritized Agenda:**
  \answer{1. Refining the "Reproducer" Concept Beyond Lineage-Centricity; 2. Causal Efficacy of Functional Integration vs. Component Fitness; 3. Criteria for Causal Autonomy in Evolutionary Explanations}
