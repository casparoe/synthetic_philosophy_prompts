answer: |-
  Here is the exam prompt, model answer, and detailed marking scheme designed to push students into the conceptual weeds of Darwin's account of morality and its challenges:

  ---

  **Exam Prompt (90 Minutes)**

  **Question:** Charles Darwin, in *The Descent of Man*, argues that human morality arises entirely from evolved "social instincts" and sympathies, shaped by natural selection for tribal utility. He simultaneously dismisses religious morality as an evolutionary byproduct (spandrel) of agency detection and fear. This generates a tension: If both morality *and* religion are contingent evolutionary products, how can Darwin consistently claim that the historical *extension of sympathy beyond the tribe to all sentient beings* represents genuine "moral progress" rather than merely a change in socially advantageous fashion? Does Darwin provide a convincing naturalistic basis for this normative claim, or does he risk smuggling in Victorian values? In your essay, address the following:

  1.  Explain Darwin's naturalistic account of morality's origin (as contingent tribal instinct calibrated by utility) and his dismissal of religious foundations (as a spandrel).
  2.  Analyze the specific challenge this poses for justifying "moral progress," particularly the universalization of sympathy. Focus on the **"normative bootstrapping" problem**: Can selection for social instincts generate their own justification conditions for claims about progress?
  3.  Engage Darwin's argument about the gradation of social instincts "from the bee to the human" (Ch. IV). How does this relate to the problem of justifying universal sympathy as progress?
  4.  Explain how Darwin's dismissal of religious morality as a foundation *destabilizes* (or perhaps unexpectedly *strengthens*) his own ability to make normative claims about moral progress.

  ---

  **Model Answer (Approx. 600 Words)**

  Darwin meticulously constructs a naturalistic edifice for human morality in *Descent of Man*. Morality, he argues, stems not from divine command but from evolved "social instincts" – primarily sympathy and a desire for group approval – forged by natural selection because cohesive, cooperative tribes outcompeted less cohesive ones (Ch. IV). This origin renders morality fundamentally *contingent* and *instrumental*, calibrated by its utility for tribal survival and flourishing. Concurrently, Darwin dismisses religion as an evolutionary spandrel: a non-adaptive byproduct of hypertrophied cognitive traits like pattern recognition (agency detection) and powerful emotions like fear (Ch. III, V). Religion, on this view, provides no independent foundation for morality; it is a secondary phenomenon piggybacking on evolved psychology.

  This framework creates a profound tension for Darwin’s assertion that the historical expansion of sympathy from kin and tribe to encompass all humans, and even sentient animals, constitutes genuine "moral progress." If morality is merely an evolved tool for tribal utility, its scope and content are contingent on selective pressures. Expanding sympathy universally lacks clear *evolutionary* justification within Darwin's model. Historically, intense loyalty to the in-group often conferred greater survival advantage than diffuse concern for outsiders or animals. Why, then, is universal sympathy "better" in a normative sense, rather than just a new configuration, perhaps driven by changing social conditions (like larger societies or technology) with no inherent moral weight? This is the **normative bootstrapping problem**: Can the *fact* of evolved social instincts bootstrap themselves into providing *justification* for claims about moral improvement that transcend their original selective function? Darwin needs to show why the *content* of the evolved instinct (sympathy) provides normative traction for its own extension beyond its evolutionary *context* (tribal boundaries).

  Darwin appeals to the "gradation" of social instincts "from the bee to the human" (Ch. IV) to suggest a natural continuity. He argues that the social instincts in humans, while more complex, are fundamentally akin to those driving cooperation in social animals. This move aims to naturalize human sympathy. However, it doesn't resolve the bootstrapping problem. While it shows sympathy has deep biological roots, it doesn't explain why *extending* human sympathy beyond its original selective scope (which, for bees, remains fiercely parochial) is *progress*. The bee's instinct is perfectly calibrated for *its* hive's utility; extending bee sympathy to rival hives would be maladaptive. Similarly, why is extending human sympathy beyond the tribe *progress* rather than a potentially maladaptive sentimentalism from an evolutionary standpoint? The gradation argument explains the instinct's *existence* but not the normative force of its *expansion*.

  Darwin's dismissal of religious morality as a foundation cuts both ways concerning his normative stance. On one hand, it **strengthens** his naturalistic project by removing a rival, non-natural foundation. It reinforces that morality must find its explanation and justification *within* the natural world he describes. On the other hand, it **dramatically destabilizes** his claim to identify moral progress. By demolishing religion as a source of transcendent norms, Darwin eliminates a potential external standard against which "progress" could be measured. If religion is just another evolutionary spandrel, its moral pronouncements have no more inherent authority than the social instincts themselves. This leaves Darwin trying to derive an "ought" (universal sympathy is progress) solely from the "is" of evolved instincts, without being able to appeal to any standard beyond those instincts and their consequences. The danger is that his Victorian ideal of universal benevolence appears less like a discovery of objective moral truth revealed by evolution and more like the contingent preference of his time and culture – values potentially "smuggled in" rather than logically derived from his naturalistic premises. While Darwin passionately believed in the superiority of universal sympathy, his own evolutionary account struggles to provide a non-circular justification for why this extension is genuinely *progressive* rather than merely a contingent shift in the expression of a fundamentally contingent instinct.

  ---

  **Marking Scheme (Total: 20 Marks)**

  | **Criteria**                                                                                             | **A Grade (18-20)**                                                                                                                               | **B Grade (16-17)**                                                                                                      | **Marks** | **Common Mistakes (-1 to -3 per instance)**                                                                 |
  | :------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------ | :----------------------------------------------------------------------------------------------------------------------- | :-------- | :---------------------------------------------------------------------------------------------------------- |
  | **1. Darwin's Accounts** (Clarity & Accuracy)                                                            | Precise explanation of morality as contingent tribal instinct *and* religion as spandrel (agency/fear). Clearly links morality to utility.        | Correct but less precise or slightly incomplete explanation of one or both elements. Link to utility might be implied.   | 4         | Vague summaries; Conflating morality/religion origins; Missing utility link; Misdefining spandrel.          |
  | **2. Normative Bootstrapping Problem** (Identification & Depth)                                          | **Explicitly defines/identifies the problem.** Deep analysis: Can evolved instincts *justify* their own extension as progress? Why is it hard? | Names or describes the tension but lacks explicit framing as "bootstrapping" or offers superficial analysis of *why* it's problematic. | 5         | Ignores bootstrapping entirely; Only states tension without analysis; Fails to explain *why* justification is problematic. |
  | **3. "Gradation" Argument Engagement** (Analysis, not Summary)                                           | **Critically engages:** Explains how gradation naturalizes sympathy BUT fails to resolve bootstrapping (bee analogy highlights the parochialism problem). | Describes the gradation argument accurately but doesn't connect it critically to the bootstrapping problem/justification. | 5         | Only summarizes gradation; Misinterprets gradation (e.g., as proof of progress); Doesn't link to core problem. |
  | **4. Impact of Dismissing Religious Morality** (Dual Effect Analysis)                                    | **Clearly explains BOTH destabilizing AND (potential) strengthening effects.** Shows how removing external standard hurts progress claims AND reinforces naturalism. | Identifies one effect clearly (usually destabilizing) but the other is weak, absent, or unclear.                          | 5         | Only mentions destabilizing effect; Only mentions strengthening effect; Superficial treatment (e.g., "it makes it harder"). |
  | **5. Overall Synthesis & Argument** (Clarity, Structure, Addressing Prompt)                              | Seamlessly weaves all points (1-4) into a coherent argument directly answering the prompt's core tension. Clear, logical structure. Strong conclusion. | Covers required points but synthesis is less tight; argument might wander slightly; conclusion present but less incisive. | 1         | Disjointed points; Doesn't directly answer the core progress vs. fashion question; Unclear or missing conclusion. |

  **Key Differentiators A vs. B:**
  *   **A:** **Explicitly tackles the bootstrapping problem** by name/concept, providing deep analysis of *why* it's a problem for justifying progress. **Critically uses the bee analogy** to show gradation's *limitations* for justification. **Fully analyzes the dual impact** of dismissing religious morality. Seamless synthesis.
  *   **B:** Identifies the core tension but may not frame it explicitly as "bootstrapping" or offers shallower analysis. Describes gradation accurately but doesn't leverage it critically against the justification problem. Identifies one effect of dismissing religion clearly but the other is underdeveloped. Good coverage but less sophisticated synthesis.

  **Common Costly Mistakes:**
  *   **Ignoring the Bootstrapping Problem:** Answering only *that* there's a tension without deeply analyzing the *justification challenge* for calling expansion "progress." (Major loss, likely caps at B).
  *   **Superficial Treatment of Religion's Dismissal:** Just stating it makes justifying progress harder, without exploring *how* (removing external standard) or the potential counterpoint (strengthening naturalism).
  *   **Misusing/Missing the "Gradation" Argument:** Treating it as proof of progress rather than analyzing its *failure* to resolve the justification problem, or ignoring it entirely.
  *   **Smuggling vs. Analysis:** Simply accusing Darwin of smuggling in values without grounding the accusation in the specific tensions outlined in the prompt and his own theory.
  *   **Descriptive over Normative:** Spending too much time summarizing Darwin's explanations and not enough wrestling with the *normative implications* (progress vs. fashion).
  *   **Lack of Synthesis:** Points are listed rather than woven into a cohesive argument answering the central question.
