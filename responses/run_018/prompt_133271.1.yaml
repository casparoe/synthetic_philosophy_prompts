answer: |-
  You've identified a fascinating and recognised tension in historiography, often described as the **structure-agency problem**. The specific pattern you note – applying **structural explanations** for the regime's emergence but **personalist/voluntarist explanations** for its most extreme actions – doesn't have one universally agreed-upon name, but we can coin a precise term and distinguish it from mere inconsistency.

  1.  **The Broader Framework: Structure vs. Agency:**
      *   **Structural Explanations:** Focus on large-scale, impersonal forces (economic depression, hyperinflation, Versailles' humiliation, weak Weimar institutions, existing antisemitism, political fragmentation). These suggest the *conditions* for *an* authoritarian, revanchist, antisemitic regime were highly probable, perhaps inevitable.
      *   **Agency Explanations (Great Man/Voluntarist):** Focus on the choices, personality, ideology, and actions of specific individuals (Hitler, Himmler, etc.). These suggest key events or policies stemmed directly from unique personal characteristics and decisions.

  2.  **The Pattern You Describe: Explanatory Bifurcation (or Hitler-Centric Contingency):**
      This is the specific split you observe:
      *   **Structural Determinism for the Regime:** The rise of *a* Nazi-like authoritarian state is presented as structurally determined/near-inevitable ("Versailles + Depression = Dictatorship").
      *   **Voluntarist Exceptionalism for Atrocities:** The *specific forms* of extreme violence (industrialised genocide, reckless military campaigns like Barbarossa's timing) are presented as contingent upon Hitler's unique ideology, personality flaws (narcissism, ruthlessness, obsessive hatred), and direct decisions ("Only Hitler would/could have done *that*").

      **Coined Terms:**
      *   **Hitler-Centric Contingency:** This directly names the phenomenon. It pins the *specifics* of the worst horrors on Hitler's personal agency ("contingency"), while implicitly accepting the structural inevitability of the regime's *existence*.
      *   **Explanatory Bifurcation of the Third Reich:** A more academic term highlighting the *split* (bifurcation) in explanatory models applied to different aspects.

  3.  **Distinguishing it from Simple Inconsistency:**
      This pattern isn't *necessarily* illogical inconsistency; it often reflects genuine historiographical debate and complexity:
      *   **Different Levels of Causation:** Historians analyse events at macro (structural), meso (institutional), and micro (individual) levels. A regime's emergence might be best explained macro-structurally, while a specific, disastrous military order might be best explained micro-voluntaristically. The key is whether the *transition* between levels is justified and explained.
      *   **The Intentionalist vs. Functionalist Debate (Re Holocaust):** This is central to your example. **Intentionalists** argue the Holocaust was the direct, premeditated goal of Hitler's core ideology. **Functionalists/Structuralists** argue it emerged more gradually from the chaotic, radicalising dynamics of the Nazi system itself, with Hitler setting broad goals but not necessarily the *specific* method. Your observed pattern leans heavily **Intentionalist** regarding the Holocaust.
      *   **Contingency within Structure:** Scholars using this "bifurcated" approach might argue: "The structures made *some form* of aggressive, antisemitic dictatorship likely. However, the *particular virulence, scale, and methods* of the genocide, and the *specific strategic blunders*, were heavily contingent on Hitler's unique personality and absolute authority within that structure." They see Hitler as the catalyst transforming potential into horrific reality in its *specific form*.
      *   **The Role of Charismatic Authority:** Nazi Germany, especially after 1938, functioned heavily as a "charismatic authority" system centred on Hitler. His personal will *became* a structural force. Explaining actions directly ordered or inspired by him *requires* acknowledging his agency.

  4.  **When it *Becomes* Inconsistency:**
      The approach *is* inconsistent or problematic when:
      *   **No Bridge is Built:** The analysis fails to explain *how* the structural conditions enabled *this specific individual* to gain absolute power and wield it so catastrophically. How did structure and agency *interact*?
      *   **Overstating Structural Inevitability:** If the structural arguments imply *any* dictator would have acted similarly regarding the Holocaust or Barbarossa, then suddenly switching to "only Hitler" is contradictory.
      *   **Ignoring Systemic Radicalisation:** Attributing the Holocaust *solely* to Hitler ignores the significant roles of ideology embedded in the party/state structures, bureaucratic competition, and widespread complicity that Functionalists highlight. It risks absolving the system.
      *   **Ignoring Hitler's Structural Dependencies:** Hitler couldn't invade Russia or implement the Holocaust alone. His power relied on structures (Party, SS, Wehrmacht, bureaucracy). Attributing these solely to his "madness" ignores the enabling structures and willing executioners.
      *   **Using Hitler as a Deus ex Machina:** Resorting to "Hitler's madness" as the *only* explanation for complex events like Barbarossa (which had military, economic, and ideological drivers beyond just one man's hubris) is often an analytical shortcut.

  **In summary:**

  You've pinpointed **Explanatory Bifurcation** or **Hitler-Centric Contingency**. This approach uses **structural determinism** to explain the Nazi regime's *emergence* as nearly inevitable given Versailles and the Depression, but switches to **voluntarist exceptionalism** (focusing on Hitler's unique agency/madness) to explain the *specific extreme manifestations* like the Holocaust and Operation Barbarossa.

  It's not *automatically* simple inconsistency; it reflects the complex interplay between deep historical forces and individual action, and aligns with the **Intentionalist** school regarding the Holocaust. However, it *becomes* inconsistent or reductive when it fails to connect structure and agency, overstates either Hitler's omnipotence or the regime's structural inevitability in its specific form, or ignores the systemic factors enabling and executing the horrors. Good historiography strives to integrate structural context with individual agency, showing how they interacted to produce specific outcomes.
