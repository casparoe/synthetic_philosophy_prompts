prompt: |-
  I am a third-year doctoral student in clinical psychology, splitting my time between a training clinic and a lab that studies emotion and decision-making, and I keep hitting the same problem in both places: when someone reports on their own mental life, how much weight should that report carry? My clinical supervisors treat clients' self-report as close to the gold standard, while the cognitive psychologists I work with will not let uncorroborated introspective evidence into a manuscript. From coursework I suspect introspection is not one thing — describing a current experience, explaining why one did something, and reconstructing one's past inner life are different acts with different reliability — but I have never seen that insight turned into something I can run in the fifteen minutes before I write a chart note or code an interview excerpt. Several times a week I must decide whether a first-person report should shape a clinical formulation or a research conclusion, and my supervisors sign off on both, so the procedure has to be defensible to people with strong instincts in both directions.

  Please write a decision procedure for how much to trust an introspective report. Present it as questions to ask in order, where each answer leads to a next step or a stop; for each question, say what counts as a sufficient answer. The procedure should mark the points where the decision stops being epistemic and becomes a value judgment, and it should reflect what is actually distinctive about introspective reports rather than collapsing into generic skepticism about self-report. Then apply it to three cases: (1) a participant in a choice experiment who says, with complete confidence, that she chose the safer-looking option because she is a cautious person; (2) a client who, during a mood exercise, reports a faint, diffuse dread at the back of his throat and can describe it as it is occurring; (3) a client whose emotionally vivid, articulate account of how one childhood event caused his current avoidance I would like to treat as the key to the case — I want the procedure's honest verdict here even if it says my preferred reading should not go into the clinical record. End by saying what the procedure cannot adjudicate and where it will misfire even when followed carefully. Keep it to at most 1,000 words, and write it in American English.
reasoning: |-
  Okay, the user is a third-year doctoral student in clinical psychology dealing with a fundamental tension: how much weight to give introspective reports in clinical versus research settings. This is a classic dual-perspective problem where clinical practice privileges lived experience while cognitive science demands objective verification. 

  The core challenge is epistemic but layered with practical constraints—they need a rapid decision tool usable in 15-minute windows before writing chart notes or coding data. What makes this thorny is that introspection isn't monolithic: describing present sensations (phenomenology) is fundamentally different from reconstructing causal narratives (etiology) or justifying choices (attribution). 

  I notice three unspoken pressures beneath their request: 
  First, they're caught between supervisory cultures and need a defensible bridge. 
  Second, they're implicitly asking for permission to sometimes distrust client narratives clinically—which feels ethically fraught. 
  Third, they want validation that their instinct to treat different introspective acts differently is sound. 

  The solution must thread multiple needles: 
  - Distinguish types of introspection without getting bogged in theory 
  - Flag where values override epistemology (e.g., clinical rapport vs. research rigor) 
  - Stay specific to introspection's unique pitfalls (like confabulation) rather than generic reporting errors 

  For the decision tree, I'll anchor it to four axes: 
  1. Temporal proximity (is the experience current or reconstructed?) 
  2. Access uniqueness (is this privately observable?) 
  3. Interpretive load (does it require self-theorizing?) 
  4. Corroboration pathways (can it be triangulated?) 

  The cases test critical boundaries: 
  - Case 1 (attribution) will expose how causal claims crumble under scrutiny 
  - Case 2 (phenomenology) should demonstrate when raw experience deserves high trust 
  - Case 3 (narrative reconstruction) will force confronting the seductiveness of coherent trauma stories 

  I'll deliberately make Case 3's outcome uncomfortable—if the procedure says "don't treat as key," it proves the tool's integrity. The caveats must warn about cultural mismatch and trauma contexts where coherence itself is therapeutic regardless of accuracy. 

  The tone needs academic rigor but clinic-floor practicality—no "it depends" cop-outs. Every question must have binary thresholds (e.g., "can describe concurrently? → if yes, proceed; if no, downgrade trust"). Value judgments will be explicitly marked (e.g., "here you choose: therapeutic value vs. historical accuracy"). 

  Biggest risk is oversimplifying, but their 15-minute constraint justifies pragmatic cuts. Will sacrifice nuance on altar of usability.
answer: |-
  Here is a decision procedure for evaluating introspective reports, designed for rapid clinical/research use. It focuses on *what kind* of introspective act is occurring and its inherent reliability factors, stopping when value judgments supersede epistemology.

  **Decision Procedure: Weight of Introspective Report**

  1.  **What is the *primary content* of the report?** *(Focuses on the nature of the claim)*
      *   **A) Description of current, immediate, raw subjective experience (e.g., sensations, basic feelings, perceptual qualities):** Proceed to Question 2.
      *   **B) Explanation for a past behavior, decision, or mental state (e.g., "I did X because Y"):** Proceed to Question 5.
      *   **C) Reconstruction of past internal states, motivations, or causal chains over time (e.g., "That childhood event made me who I am"):** Proceed to Question 6.
      *   *Sufficient Answer:* Categorize based on the core claim. If mixed, prioritize the dominant type.

  2.  **Can the experience be described *concurrently* or immediately *after* its occurrence (within seconds/minutes), without requiring complex interpretation?** *(Assesses immediacy and directness)*
      *   **Yes (e.g., "Right now I feel a tightness in my chest," describing dread as it's felt):** Proceed to Question 3.
      *   **No (e.g., reflecting on why they felt dread yesterday):** This significantly reduces reliability for describing raw experience. Downgrade weight considerably. *Stop (Epistemic Stop: High Risk of Reconstruction/Confabulation).*

  3.  **Is the described experience *unique to first-person access* (privately observable)?** *(Assesses if corroboration is even possible)*
      *   **Yes (e.g., specific internal sensation like throat dread, raw emotional qualia):** Proceed to Question 4.
      *   **No (e.g., reporting visible behavior or an external event anyone could see):** Treat as standard observational report; apply generic reliability checks (accuracy, bias). *Stop (Not Distinctively Introspective).*

  4.  **Is the description *phenomenologically rich and stable* upon gentle, non-leading probing?** *(Assesses coherence and robustness of the immediate experience)*
      *   **Yes (e.g., client consistently describes dread location/sensation when asked "Can you say more about that feeling?"):** High weight for existence and nature of *this specific, current experience*. It is the gold standard *for this subjective state at this moment*. *Stop (Epistemic Stop: High Reliability for Current Phenomenology).*
      *   **No (e.g., description changes drastically, becomes vague, or contradicts itself under minimal probing):** Lower weight; may reflect confusion, suggestibility, or difficulty articulating. Note ambiguity. *Stop (Epistemic Stop: Low Reliability for This Description).*

  5.  **Does the explanation rely on *self-theorizing* about traits, motives, or causes not directly experienced?** *(Assesses inference vs. direct report)*
      *   **Yes (e.g., "I chose it because I'm a cautious person" - inferring a trait cause):** High risk of confabulation or post-hoc justification. *Very low epistemic weight for the causal claim.* Treat as a *belief* the person holds, not a verified cause. *Stop (Epistemic Stop: Low Reliability for Causal Attribution).*
      *   **No (e.g., "I chose it because the other option looked scary *to me* right then" - reporting a directly experienced reason):** Moderate weight for the *reported proximate reason*, but potential for bias/oversimplification remains. Seek corroboration if possible (e.g., choice patterns, reaction times). *Stop (Epistemic Stop: Moderate Reliability for Proximate Reason).*

  6.  **Is the reconstruction *emotionally vivid and coherent*, forming a clear narrative?** *(Acknowledges narrative power vs. historical accuracy)*
      *   **Yes (e.g., articulate, compelling story linking childhood event to current avoidance):** *Stop - Value Judgment Zone.* The narrative has high *clinical utility* (organizing understanding, fostering insight, therapeutic alliance) and reflects the client's *current meaning-making*. However, it has *low epistemic reliability* for historical causal accuracy due to memory distortion, narrative smoothing, and present needs shaping the past. Document as "Client's narrative understanding..." not "The cause is...".
      *   **No (e.g., vague, fragmented, inconsistent account):** Low epistemic weight *and* potentially lower immediate clinical utility for narrative work, though fragments may hold clues. Focus on present phenomena (Question 1A) or proximate reasons (Question 5). *Stop (Epistemic Stop: Low Reliability).*

  ---

  **Application to Cases:**

  1.  **Participant: "Chose safer option because I'm a cautious person."**
      *   Q1: **B (Explanation for decision)** -> Q5.
      *   Q5: **Yes (Self-theorizing - "cautious person" trait)** -> *Stop: Very low epistemic weight for causal claim.* Treat as a belief she holds. In research, this is uncorroborated introspective evidence; do not use as data for *why* she chose. Note discrepancy between reported reason and potential implicit processes studied. In clinic, explore the *belief* and its function.

  2.  **Client: Reports current "faint, diffuse dread at back of throat."**
      *   Q1: **A (Current raw experience)** -> Q2.
      *   Q2: **Yes (Describing concurrently)** -> Q3.
      *   Q3: **Yes (Unique 1st-person access - internal sensation)** -> Q4.
      *   Q4: **Yes (Can describe it richly/consistently when probed)** -> *Stop: High weight for existence & nature of this specific current experience.* Gold standard *for this phenomenological report*. Crucial for clinical formulation (e.g., somatic marker of anxiety). Valid target for experiential techniques.

  3.  **Client: Vivid narrative linking childhood event to current avoidance.**
      *   Q1: **C (Reconstruction of past causal chain)** -> Q6.
      *   Q6: **Yes (Emotionally vivid & coherent)** -> *Stop - Value Judgment Zone.*
      *   **Verdict:** This narrative has **high clinical utility** and is essential for understanding the client's *current meaning-making and lived experience*. It should be documented in the record **as the client's narrative framework or understanding** (e.g., "Client describes a formative childhood experience [brief, non-interpretive summary] which he understands as the origin of his current avoidance patterns"). However, the procedure dictates **low epistemic weight for the historical causal claim** ("Event X *caused* Trait Y"). It should **not** be treated as the objectively verified "key to the case" in the chart. The formulation should integrate this narrative *alongside* present behaviors, emotions (Q1A), patterns, and potentially other factors, acknowledging its subjective truth without confirming its historical accuracy. Your preferred reading *as historical fact* should not stand alone in the record.

  ---

  **Limitations & Points of Misfire:**

  *   **Cannot Adjudicate:**
      *   **Inherent Truth of Private Experience:** It assumes people can access *some* internal state, but cannot prove the reported experience perfectly matches an underlying "true" state (the hard problem of consciousness).
      *   **Absolute Historical Truth:** It cannot recover the objective past.
      *   **Cultural/Social Biases:** The procedure itself reflects Western, individualistic assumptions about introspection. Reliability judgments might misfire if the individual's cultural framework conceptualizes internal states very differently (e.g., more relational, somatic).
      *   **Optimal Clinical Action:** High reliability doesn't *mandate* clinical focus (a faint itch might be reliable but irrelevant). Low reliability doesn't *mandate* dismissal (a fragmented trauma memory might be crucial therapeutically). Clinical judgment integrates reliability with therapeutic goals.
  *   **Potential Misfires (Even if Followed):**
      *   **Highly Persuasive Confabulation:** A confident, detailed, but entirely fabricated self-theory (Q5) or reconstruction (Q6) might be mistakenly assigned higher *apparent* reliability.
      *   **Aphantasia/Processing Differences:** Individuals with limited ability to visualize or articulate internal states (Q4) might be unfairly downgraded.
      *   **Acute Psychosis/Delirium:** Current experience reports (Q1A) during altered states may pass Q2-Q4 but be manifestations of psychosis, not reliable reports of external reality (though reliable reports *of the psychotic experience itself*).
      *   **Deeply Internalized Bias:** Proximate reasons (Q5 "No") might seem direct but reflect internalized oppression or distortion invisible to the reporter and the evaluator.
      *   **Value Judgment Conflicts:** In Q6, prioritizing clinical utility vs. historical accuracy remains a profound value-based clinical decision, not an epistemic one resolved by the procedure.
