answer: |-
  ### Simulation Activity: "The Tapestry of Survival"  
  **Objective:** Students experience how normative commitments shape interpretations of societal change by simulating resource allocation during crisis, revealing the collapse vs. adaptive dissolution tension.  

  ---

  ### **1. Roles & Hidden Victory Conditions**  
  *(Assign roles randomly; 14 students total)*  
  - **Institutional Stewards (4 players)**:  
    - *Roles*: High Priest (manages spiritual cohesion), Military Commander (security), Trade Minister (resource distribution), Archivist (record-keeping).  
    - *Hidden Victory*: Maximize **Institutional Integrity (II)**. Win if II ≥ 30 at game end.  
  - **Network Maintainers (8 players)**:  
    - *Roles*: Farmers (food), Artisans (tools), Elders (kinship), Merchants (local trade). *Each role has 2 players.*  
    - *Hidden Victory*: Maximize **Relational Continuity (RC)**. Win if RC ≥ 40 at game end.  
  - **External Observers (2 players)**:  
    - *Roles*: Chronicler (documents events), Envoy (liaises with groups).  
    - *Hidden Victory*: Accurately label the outcome (*collapse* or *adaptive dissolution*) based on final II vs. RC. Win if prediction matches outcome AND they survive.  

  **Conflict**: Stewards lose if networks "win" (RC high, II low), and vice versa. Observers must choose one label.  

  ---

  ### **2. Rules & Payoff Scheme**  
  **Resources**: Each player receives **5 tokens** per round (representing labor/goods). Tokens are allocated to:  
  - **Institutions (II)**: Contribute tokens to central pool (managed by Stewards).  
  - **Networks (RC)**: Spend tokens to form **dyads** (pairs) with others; each dyad costs 1 token per player and grants +2 RC to both.  
  - **Reserve**: Save tokens for survival.  

  **Crisis Mechanics**:  
  - **Survival**: Players lose 1 token/round to "environmental stress." If unable, they become "displaced" (can’t act next round).  
  - **II Threshold**: If total II tokens/round < 8, **all players** lose an extra token (simulating institutional failure cascades).  
  - **RC Synergy**: Every 10 RC unlocks a **shared benefit** (e.g., all players regain 1 token), revealed incrementally.  

  **Scoring** (revealed in phases):  
  - **II Score** = Total tokens contributed to Institutions.  
  - **RC Score** = Total RC from dyads + shared benefits.  
  - **Victory Conditions**: Revealed only during the "Revelation" phase.  

  ---

  ### **3. Phased Timeline (75 min total)**  
  **Setup (10 min)**:  
  - Assign roles, distribute role cards (brief descriptors, no victory hints).  
  - Explain token allocation, survival rule, and dyad formation. *Do not mention II/RC thresholds or scoring.*  
  - **Facilitator Tip**: Use a shared board to track II/RC secretly.  

  **Stress Event (5 min)**:  
  - Announce: *"A prolonged drought has struck. Trade routes are failing, and harvests are scarce. Allocate tokens for Year 1."*  
  - Players secretly allocate tokens (write on slips). Stewards may plead for II contributions; Networkers may form dyads openly.  

  **Decision Rounds (30 min: 3 rounds x 8 min + 6 min for crisis resolution)**:  
  - **Each Round (8 min)**:  
    1. Allocate tokens (secretly).  
    2. Form dyads (Networkers negotiate pairs; Observers interview players).  
    3. Collect slips. Facilitator announces:  
       - "Stress claims 1 token from all."  
       - If II < 8: *"Institutions falter! All lose an extra token."*  
       - If RC ≥ 10 (after Round 1): *"Communities share surplus! All regain 1 token."*  
  - **Crisis Resolution (2 min/round)**: Update II/RC scores and survival. Displaced players skip next round.  

  **Restructuring (10 min)**:  
  - Announce: *"The crisis climaxes. Allocate tokens for the final recovery phase."*  
  - Players openly debate strategies (Stewards vs. Networkers). Observers take notes.  
  - Final token allocation and dyad formation.  

  **Revelation (5 min)**:  
  - Reveal II and RC scores, victory conditions, and who "won."  
  - Announce outcome:  
    - **Collapse**: II < 30, RC < 40.  
    - **Adaptive Dissolution**: II < 30, RC ≥ 40.  
    - **Stability**: II ≥ 30, RC ≥ 40.  
  - Observers reveal their labels.  

  ---

  ### **4. Debrief Script (15 min)**  
  **Link Experience to Concepts**:  
  - **Setup/Stress Event**: *"Like the Bronze Age cities facing invasions or Easter Island’s deforestation, you faced scarce resources. Initial choices reflected ingrained priorities—some defaulted to propping up institutions, others to kinship ties."*  
  - **Decision Rounds**: *"The II threshold forced you to ‘feed’ institutions or face collective punishment. This mirrors how Maya centers collapsed when elites demanded tribute during drought. But RC’s shared benefits showed networks could offer alternatives—adaptive dissolution isn’t chaos, it’s *unbundling* to preserve what matters."*  
  - **Restructuring**: *"Your debate in the final phase echoes intentional shifts—e.g., Bronze Age people abandoning palaces for decentralized villages. But note: our rules couldn’t simulate long-term intentionality. Historical adaptive dissolution involved generations choosing networks over failing institutions; I’ll add that nuance now."*  
  - **Revelation**: *"Labeling this ‘collapse’ or ‘adaptive dissolution’ depended on your role’s victory condition. Stewards saw dying institutions as failure; Networkers saw thriving relations as success. Neither is objectively right—it’s a *normative choice* about what ‘survival’ means."*  

  **Conceptual Takeaways**:  
  - "Collapse" assumes institutions = society; "adaptive dissolution" assumes core networks = society.  
  - Rules captured: (1) Trade-offs between II/RC, (2) How thresholds create perceived "failure."  
  - Rules *missed*: Long-term intentionality (facilitator supplies this verbally).  

  **Historical Mapping**:  
  - **Bronze Age**: Palaces (II) collapsed, but maritime networks (RC) persisted.  
  - **Classic Maya**: Royal courts (II) vanished, but agrarian communities (RC) adapted.  
  - **Easter Island**: Monuments (II) abandoned, but clans (RC) shifted to rock gardens.  

  ---

  ### **5. Predicted Misfires & Corrections**  
  - **Misfire 1: Zero-Sum Framing**  
    - *Prediction*: Stewards hoard tokens for II; Networkers ignore II threshold, causing collective punishment.  
    - *Correction*: After Round 1, highlight RC shared benefits to incentivize cooperation ("You unlocked surplus by building networks!").  

  - **Misfire 2: Observers Dominating**  
    - *Prediction*: Observers interrupt negotiations to gather data, slowing play.  
    - *Correction*: Limit Observers to 2 questions/round. Remind them: "Your survival depends on token management too."  

  - **Misfire 3: Role Confusion**  
    - *Prediction*: Networkers initially contribute to II, not grasping RC’s importance.  
    - *Correction*: After Round 1, privately remind Networkers: "Your role card mentions ‘kinship’ or ‘local trade’—focus on connections."  

  - **General Fix**: If time lags, reduce rounds to 2; if debates stall, impose a 1-minute decision timer.  

  ---  
  **Outcome**: Students leave grasping that "collapse" is a story told by institutional loyalists, while "adaptive dissolution" reflects network resilience—proving both frames are empirically valid but normatively charged. The mechanics force this realization; the debrief names it.
