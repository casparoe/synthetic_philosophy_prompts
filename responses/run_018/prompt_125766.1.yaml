answer: |-
  Here is a full specification of desiderata for adequate models of long-term civilizational change, structured as requested, followed by a brief assessment of key historical models:

  **I. Phenomena to Accommodate (What the Model Must Describe)**
  1.  **Irreversible Technological Accumulation:** The ratchet-like progression in material capabilities and knowledge (e.g., metallurgy -> steam -> nuclear fission -> digital tech; writing -> printing -> internet). *Motivation:* Observed directional trend globally; hard to "unlearn" once diffused.
  2.  **Cross-Cultural Institutional Recurrence:** The emergence of similar structures (e.g., centralized bureaucracies, markets, organized religions, legal codes, social stratification) in geographically/temporally distinct societies. *Motivation:* Observed parallels (e.g., Roman vs. Han administration, feudalism in Japan/Europe).
  3.  **Simultaneous Progress & Regress:** The co-existence of advancement in one domain (e.g., science) with decline in others (e.g., social cohesion, environmental sustainability) within the same civilization. *Motivation:* Roman Empire (tech/engineering vs. political instability), modern challenges.
  4.  **Civilizational Collapse & Regeneration:** The non-linear pattern of disintegration (e.g., Bronze Age Collapse, Classic Maya) and potential subsequent rebirth (e.g., post-Roman Europe, Chinese dynastic cycles). *Motivation:* Historical record shows societies end, but cultural/political forms often reappear regionally.
  5.  **Path Dependence & Contingency:** The significant influence of unique historical accidents, geography, and early choices on subsequent development. *Motivation:* Contrasting trajectories of Europe vs. China post-1500; impact of the Black Death.

  **II. Puzzles to Resolve (What the Model Must Explain)**
  1.  **"Silent Interregna":** Extended periods lacking clear cyclical repetition *or* linear progression (e.g., post-Mycenean Greek Dark Ages, post-Hittite Anatolia, potentially Europe 500-800 CE). *Motivation:* How do societies persist/stagnate without obvious dynamic? What drives eventual re-emergence?
  2.  **Stage-Skipping:** Societies apparently bypassing "predicted" developmental stages (e.g., Russia industrializing without full "bourgeois revolution"; modern developing nations leapfrogging landline telecom for mobile). *Motivation:* Challenges rigid unilinear stage theories; highlights diffusion/contingency.
  3.  **Resilience vs. Fragility:** Why some societies withstand severe shocks (e.g., Japan post-WW2, Byzantium post-1204) while others collapse under seemingly lesser stress (e.g., Western Roman Empire). *Motivation:* Need to identify key vulnerability/resilience factors beyond simple size/wealth.
  4.  **The "Great Divergence":** The relatively recent (~1800 CE) explosive acceleration of technological/economic growth primarily in Western Europe. *Motivation:* Why then? Why there? Why not earlier/elsewhere despite prior sophistication (e.g., Song China)?

  **III. Distinctions to Maintain (What the Model Must NOT Confuse)**
  1.  **Morphological Resemblance vs. Causal Continuity:** Similar outward forms (e.g., pyramids, divine kingship) do *not* imply identical causes, direct influence, or shared developmental logic. *Motivation:* Avoiding diffusionist fallacies or false universalism (e.g., equating Egyptian and Mesoamerican pyramids solely due to shape).
  2.  **Retrospective Narrative Fit vs. Genuine Predictive Constraint:** A compelling story explaining the past is insufficient; the model must generate testable hypotheses about *future* or *counterfactual* developments that can be falsified. *Motivation:* Guarding against unfalsifiable "just-so" stories (common in grand narratives).
  3.  **Endogenous Dynamics vs. Exogenous Shocks:** Clearly distinguishing internal drivers of change/decline (e.g., institutional sclerosis, resource depletion) from external forces (e.g., climate change, invasions, pandemics, diffusion). *Motivation:* Necessary for causal attribution and understanding interaction (e.g., Rome: internal decay *and* barbarian pressure).
  4.  **Civilization as Process vs. Entity:** Avoiding reification; civilizations are dynamic, contested processes, not monolithic, bounded "organisms" with fixed lifecycles. *Motivation:* Captures fluidity, hybridity, and internal conflict (e.g., "Roman" identity evolved drastically).

  **IV. Bounds to Respect (Logical & Empirical Constraints)**
  1.  **Empirical Coherence:** Must be compatible with the established archaeological, historical, and anthropological record. *Motivation:* Non-negotiable. Pseudoscience and ignoring inconvenient evidence invalidate a model.
  2.  **Logical Consistency:** Internal contradictions (e.g., claiming inevitable progression while also claiming inevitable cyclical collapse) must be resolved or acknowledged as limitations. *Motivation:* Non-negotiable. A model cannot defy logic.
  3.  **Acknowledgment of Complexity & Multi-causality:** Rejects mono-causal explanations (e.g., "all history is class struggle" or "climate determinism"). *Motivation:* Reality is complex; single factors rarely suffice.
  4.  **Recognition of Human Agency & Contingency:** Cannot reduce history to deterministic laws ignoring individual choices, collective action, and random events. *Motivation:* Non-negotiable. Humans are not atoms in a physics experiment.
  5.  **Scale Sensitivity:** Mechanisms plausible at one scale (e.g., individual psychology) may not explain macro-structures; macro-dynamics may poorly predict individual actions. *Motivation:* Avoiding reductionism and ecological fallacies.

  **Tensions & Satisfiability:**
  *   **Potential Conflict:** Accommodating both **Irreversible Technological Accumulation (1.I)** and genuine, recurrent **Civilizational Collapse (1.IV)** is challenging. Does tech always persist through collapse? How absolute is "collapse"? This requires careful definition of terms and scales.
  *   **Potential Conflict:** **Stage-Skipping (2.II)** directly challenges rigid models demanding **Cross-Cultural Institutional Recurrence (1.II)** in a fixed sequence. Resolving this likely requires incorporating diffusion and path dependence more centrally.
  *   **Joint Unsatisfiability?** It's *difficult* but not *impossible* to fully satisfy both **Genuine Predictive Constraint (3.II)** and **Recognition of Human Agency & Contingency (4.IV)**. Strong determinism aids prediction but violates agency; strong contingency/agency makes precise prediction impossible. Adequate models will likely offer probabilistic, conditional predictions within defined bounds.

  **Non-Negotiables vs. Preferences:**
  *   **Non-Negotiables:** Empirical Coherence (4.I), Logical Consistency (4.II), Recognition of Human Agency & Contingency (4.IV). These are foundational to any credible historical social science.
  *   **Camp-Specific Preferences:** The *relative weight* given to phenomena like Cyclical Recurrence vs. Linear Accumulation, or the *emphasis* on Endogenous vs. Exogenous factors, often defines camps (e.g., cyclical vs. progressivist, materialist vs. idealist). The model *must* accommodate both phenomena, but can emphasize one.

  **Assessment of Key Models on Hard Constraints:**

  1.  **Polybius (Cyclical - Anacyclosis):**
      *   **Fails:** Ignores **Technological Accumulation (1.I)** entirely. Poorly explains **Stage-Skipping (2.II)** or **"Silent Interregna" (2.I)**. Over-emphasizes *political* forms as the core dynamic, neglecting other factors (**Complexity/Multi-causality - 4.III**). **Morphological Resemblance (Monarchy->Tyranny etc.)** is mistaken for universal **Causal Continuity (3.I)**. Lacks **Predictive Constraint (3.II)** beyond the immediate cycle.
      *   **Succeeds:** Describes a specific form of **Institutional Recurrence (1.II - political decay)** and **Collapse/Regeneration (1.IV)** within its limited scope.

  2.  **Ibn Khaldun (Cyclical - Asabiyyah):**
      *   **Fails:** Neglects **Technological Accumulation (1.I)**. Struggles with **Stage-Skipping (2.II)** and scale (applies best to dynasties, not whole civilizations). **Predictive Constraint (3.II)** is weak beyond the core cycle. Underplays **Exogenous Shocks (3.III)**.
      *   **Succeeds:** Insightful on endogenous **Simultaneous Progress & Regress (1.III - luxury weakens cohesion)**. Brilliant on **Civilizational Collapse & Regeneration (1.IV)** via *asabiyyah*. Strong on **Path Dependence (1.V)** via geography/custom. Respects **Agency (4.IV)** through group solidarity. Avoids simple determinism.

  3.  **Spengler (Morphological - Organic Cycles):**
      *   **Fails:** Egregiously violates **Empirical Coherence (4.I)** (forcing facts into preordained stages/analogies). Collapses **Morphological Resemblance into Causal Continuity (3.I)** ("Pseudomorphosis"). Ignores **Technological Accumulation (1.I)** (treats science as culturally specific, not cumulative). Ignores **Diffusion/Contingency (1.V)**. Highly deterministic, violating **Agency/Contingency (4.IV)**. **Predictive Constraint (3.II)** is vague and unfalsifiable prophecy. Reifies civilizations as organisms.
      *   **Succeeds:** Powerfully describes the subjective *feeling* of **Simultaneous Progress & Regress (1.III)** in late cultures. Highlights distinct cultural "souls" (**Path Dependence - 1.V**).

  4.  **Toynbee (Morphological - Challenge & Response):**
      *   **Fails:** Tends towards **Retrospective Narrative Fit over Predictive Constraint (3.II)** (many challenges/responses seem ad hoc). Struggles with **"Silent Interregna" (2.I)** and absolute **Collapse (1.IV)** (emphasizes "Universal Churches" as successors). Underplays **Irreversible Technological Accumulation (1.I)**. The "Withdrawal-and-Return" mechanism risks unfalsifiability. Later universalist/religious turn reduced empirical focus.
      *   **Succeeds:** Excellent framework for **Path Dependence & Contingency (1.V)** via unique challenges. Strong on **Endogenous vs. Exogenous (3.III)** dynamics. Attempts to explain **Resilience vs. Fragility (2.III)** via response adequacy. Respects **Complexity/Multi-causality (4.III)**. Accommodates both **Progress and Decline (1.III)**. Avoids strict determinism, incorporating **Agency (4.IV)** of "Creative Minorities".

  **Conclusion on Decisiveness:**
  The criteria *are* genuinely decisive. Models failing the **Non-Negotiables (Empirical Coherence, Logical Consistency, Agency/Contingency)** – like Spengler's forced analogies and determinism – are fundamentally invalidated. Models failing core **Phenomena accommodation** – particularly ignoring **Irreversible Technological Accumulation** (Polybius, Ibn Khaldun, Spengler) – lack crucial explanatory power for the modern world and long-term trends. Models collapsing key **Distinctions (Morphology vs. Causality)** (Spengler) produce misleading conclusions. Toynbee comes closest to satisfying the desiderata but stumbles on predictive rigor and the tension between technological accumulation and his civilizational lifecycles. An adequate model must successfully navigate *all* these constraints and tensions.
