prompt: |-
  You are a political philosopher who specializes in the ethics of membership, territorial rights, and freedom of association. Please think carefully, and before you give me your verdict I would find it genuinely useful if you first set out, in two or three lines apiece, the candidate principles that could jointly explain the track record below — I want to see the whole space of rules that fits our precedents, not only the one you happen to favour — and then run each of them against the new case.

  I am the junior, non-voting secretary of our faculty's Working Group on Membership and Exclusion, which for three years has issued short advisory opinions on who may exclude whom, and I have to draft the opinion on a new petition before our next meeting. I want to know what consistency with our own record actually requires, because I suspect our precedents fit more than one principle and I would rather not smuggle in my own politics; my private view is that the petitioner should win, and I would like you to argue against me if the precedents point the other way. Compressed, the opinions so far: a contemplative religious order that refuses to admit a postulant who rejects its vows — exclusion permissible; a private household that declines to put up a stranger for the night — permissible; a private hospital's emergency department that turns away a patient in acute danger of death who cannot pay — impermissible; a company that owns every dwelling, the only school and the only clinic in an isolated mining town, and that evicts a family for union organizing — impermissible; a small farming cooperative with a language-revival charter that admits only members willing to conduct its business in the endangered language, although it is by far the cheapest housing in the district — permissible, but only because it publishes transparent admission criteria and lets non-members lease land at the market rate; a wealthy coastal state that refuses admission to families from a drowning island state whose submersion its own emissions materially contributed to — impermissible, five to four, the majority relying on dire need plus causal contribution and the dissent on collective self-determination; a large public discussion forum that expels a member for sustained bad-faith disruption — permissible.

  The new petition concerns Meridian, a privately built and operated orbital habitat with about two thousand residents. Meridian's charter requires every adult resident to re-affirm its mutual-aid compact every five years, and the operator has declined to renew the residency of a woman born and raised there who now refuses to re-affirm and publicly campaigns against the operator's governance; her partner and child remain residents in good standing. Meridian is the only inhabited structure at its location, it runs all life support, sets the rules of daily life, and operates the only dispute-resolution mechanism available; roughly forty percent of residents are not employees of the operator and never signed anything beyond a standard berth licence. This is not a death sentence: Meridian can, at roughly half a percent of its annual operating budget, fund her transfer to a small research station a few weeks' transit away that has agreed to take her, but she cannot pay for it herself and no state has accepted a duty to receive her. Our chair's circulated draft argues that the mining-town opinion was really about retaliation for protected activity rather than about the town's state-like character, and so does not govern Meridian; I cannot tell whether that is a distinction or an evasion.

  So: does Meridian have the right to exclude her, and if it does, must it fund her relocation? Which of our precedents is the closest analog and why, and what principle are we committing ourselves to either way — the associational-or-ethos reading, the state-likeness reading, the no-genuine-exit reading, the dire-need reading, or something else? If our precedents genuinely underdetermine the case, say so plainly and tell me what each available decision would commit us to, including any conditional option such as exclusion permissible only if funded and phased over a stated period. Finally, name one further hypothetical case, specified in a sentence or two, that would best separate the principles you still think are in play. Please commit to a single recommendation rather than laying out the options for me to choose between, give me in one line how confident you are in it, and flag the one step in your reasoning you think most likely to be wrong, or the single further fact about Meridian that would most change your mind.
reasoning: |-
  Okay, the user is a junior secretary in a faculty working group dealing with membership and exclusion cases. They need help drafting an opinion on a new petition about Meridian, an orbital habitat. The user wants me to act as a political philosopher specializing in ethics of membership, territorial rights, and freedom of association. They've provided several precedents and want me to analyze which principles fit those precedents before applying them to the new case.

  First, I need to identify the candidate principles that could explain all the precedents. Looking at the track record:

  - Religious order excluding someone who rejects vows: permissible
  - Private household refusing a stranger: permissible
  - Private hospital turning away dying patient who can't pay: impermissible
  - Company town evicting union organizers: impermissible
  - Language-based coop excluding non-speakers: permissible with conditions
  - Coastal state refusing climate refugees: impermissible (by majority)
  - Forum expelling disruptive member: permissible

  From these, I can extract several principles that might explain the pattern:

  1. **Freedom of Association Principle**: Groups can exclude to protect core purposes (like the religious order or forum). But this alone doesn't explain the hospital or company town cases.

  2. **Essential Needs Principle**: Exclusion is impermissible when it denies access to essential goods/services and no alternatives exist (hospital, company town). The climate refugee case adds causal responsibility.

  3. **State-Likeness Principle**: Entities performing sovereign-like functions (monopoly over essential services, dispute resolution) can't exclude arbitrarily (company town, perhaps climate state).

  4. **Anti-Retaliation Principle**: Exclusion can't punish protected activities (union organizing). The language coop was permissible because it wasn't retaliatory.

  5. **Conditional Exit Principle**: Exclusion permissible only if feasible exit exists (language coop's market-rate land access).

  The user mentions possible readings like associational/ethos, state-likeness, no-genuine-exit, dire need. I should map my principles to these.

  Now for Meridian: It's an orbital habitat where a resident refuses to reaffirm the mutual-aid compact and campaigns against governance. Key features:
  - Only inhabited structure, controls life support
  - Runs all daily rules and dispute resolution
  - 40% residents not employees
  - Can fund transfer to research station (0.5% budget)
  - Petitioner born there, family stays

  Applying the principles:
  - **Freedom of Association**: Meridian might claim core purpose protection, but is governance a "core purpose" like religious vows? The dissent in climate case valued self-determination.
    
  - **Essential Needs**: Excluding her threatens access to life support - no alternative except transfer. Similar to hospital/company town.

  - **State-Likeness**: Strong argument here - monopoly on essential services, dispute resolution. Like company town impermissible case.

  - **Anti-Retaliation**: Her campaigning might be seen as protected activity (criticizing governance), making exclusion retaliatory.

  - **Conditional Exit**: Transfer is possible but she can't pay. Funding it (0.5% budget) seems feasible, like language coop's market-rate access.

  The chair's draft distinguishes mining-town as about retaliation, not state-likeness. But Meridian's exclusion also seems retaliatory for campaigning. And even if not, the state-like features matter.

  Closest analog is the mining-town case: both involve entities controlling essential services excluding someone for dissent (union vs governance criticism). The climate refugee case is also relevant due to lack of alternatives and causal role (she was born there).

  Principles committing to:
  - If allow exclusion: prioritizing freedom of association over essential needs, setting precedent for powerful private entities.
  - If forbid: strengthening state-likeness principle, might limit legitimate associations.

  But precedents suggest exclusion impermissible without funded exit, given Meridian's control. So: exclusion permissible ONLY if funded relocation provided.

  Further hypothetical to test principles: A private university with exclusive dining hall expels a student critic - tests if essential needs (food access) trumps association when alternatives exist nearby.

  My recommendation: Meridian cannot exclude without funding relocation. High confidence (8/10), but most questionable step is interpreting her criticism as "protected activity" like union organizing. If Meridian showed her actions threatened life support (not just governance criticism), that might change my view.
answer: |-
  ### Candidate Principles Explaining Precedents
  1. **Essential Needs/Sovereign Function Principle**: Exclusion is impermissible when an entity controls essential goods/services (e.g., life-saving healthcare, housing in a monopoly) and no alternatives exist, especially if the excluder contributed to the need. (Fits: hospital, company town, climate refugees.)  
  2. **Protected Activity Principle**: Exclusion is impermissible if retaliatory against core rights (e.g., labor organizing, political dissent), regardless of the entity’s nature. (Fits: company town, climate refugees’ dissent emphasis.)  
  3. **Associational Integrity Principle**: Exclusion is permissible to uphold a group’s core ethos or purpose (e.g., religious vows, language revival, forum order), provided minimal exit options exist. (Fits: religious order, language coop, forum.)  
  4. **Feasible Exit Principle**: Exclusion is permissible only if the excluded party has a realistic, non-burdensome alternative, with costs reasonably covered by the excluder or third parties. (Fits: language coop’s land access, climate dissent’s focus on dire need.)  
  5. **Spatial/Relational Scale Principle**: Small, non-monopolistic entities (e.g., households, cooperatives) may exclude freely; large, territorially dominant ones cannot. (Fits: household permissible, company town impermissible.)  

  These principles overlap but are distinct: e.g., the climate case combined **Essential Needs** and **Protected Activity**; the language coop blended **Associational Integrity** and **Feasible Exit**.

  ---

  ### Application to Meridian
  #### Step 1: Exclusion Permissibility  
  - **Essential Needs/Sovereign Function applies strongly**: Meridian controls all life support, dispute resolution, and daily rules in an isolated habitat—directly analogous to the company town and hospital precedents. It is not merely a private association but a de facto sovereign entity.  
  - **Protected Activity reinforces this**: The exclusion follows her criticism of governance—like union organizing in the mining town, this is protected dissent. The chair’s distinction (retaliation vs. state-likeness) is false: the mining-town opinion explicitly cited *both* monopolistic control *and* retaliation.  
  - **Associational Integrity is weak**: While Meridian has a mutual-aid compact, its scale (2,000 residents), monopolistic functions, and non-associational residents (40% with only berth licenses) make it unlike the religious order or forum. Ethos-based exclusion fails when essential needs are at stake (per climate and hospital cases).  
  - **Feasible Exit is unmet**: Transfer is possible but unaffordable for her. The language coop precedent requires the excluder to enable feasible alternatives (e.g., market-rate land). Meridian must fund relocation.  

  **Verdict**: Exclusion is **impermissible** unless funded by Meridian.  

  #### Step 2: Funding Relocation  
  - **Feasible Exit Principle demands it**: Meridian’s capacity to fund (0.5% of budget) mirrors the language coop’s duty to offer land at market rates. Precedents show exclusion becomes permissible only when exit barriers are removed (climate dissent worried about "no genuine exit").  
  - **Essential Needs reinforces**: Stranding her threatens survival, echoing the hospital’s duty to acute patients.  

  **Verdict**: Meridian **must fund relocation** if exclusion occurs.  

  **Closest Analog**: **Mining-town case**—both involve monopolistic control over essential services and exclusion for dissent (union vs. governance criticism). The climate refugee case is secondary, emphasizing causal responsibility (she was born there, making Meridian’s role structural).  

  **Principle Committed To**: We endorse **Essential Needs/Sovereign Function + Protected Activity**, conditional on **Feasible Exit**. Exclusion is barred where monopolistic power over survival intersects with retaliation against dissent, unless affordable alternatives are provided.  

  ---

  ### If Precedents Underdetermine?  
  They do not—Meridian’s monopolistic control and retaliatory exclusion align squarely with the hospital, company town, and climate cases. But if ambiguity existed:  
  - **Option 1**: Exclusion impermissible. Commits us to broad "state-like entities" doctrine.  
  - **Option 2**: Exclusion permissible only if funded. Commits us to Feasible Exit as a universal mitigator.  
  - **Option 3**: Exclusion permissible unconditionally. Undermines the hospital/mining-town logic and invites evasion.  

  **Conditional Option**: Exclusion permissible **only if funded and phased** (e.g., 6-month transition). This honors Feasible Exit but risks diluting Protected Activity.  

  ---

  ### Separating-Hypothetical  
  **Test Case**: *A members-only urban housing co-op (owning 10% of city apartments) expels a critic of its policies, who can afford market rents elsewhere.*  
  - **Associational Integrity** permits exclusion (small scale, alternatives).  
  - **Protected Activity** forbids it (retaliation for speech).  
  - **Spatial Scale** distinguishes it from Meridian (non-monopolistic).  

  ---

  ### Recommendation  
  **Meridian cannot exclude her without funding and executing her relocation. Confidence: 8/10.**  
  - **Why?** Precedents bind: Meridian’s sovereign control and retaliatory motive mirror the impermissible mining-town exclusion, and feasible exit (funded transfer) is required per language coop.  
  - **Weakest Step**: Equating her governance criticism with "protected activity" like union organizing. If her campaign actively sabotaged life support (e.g., hacking oxygen systems), this might justify exclusion—but no such fact exists.  
  - **Fact That Changes Mind**: If Meridian revealed **all residents signed employment-like contracts** (not just berth licenses), Associational Integrity might strengthen. Currently, 40% did not, making it state-like.  

  **Draft Opinion Core**: *"Exclusion impermissible under Mining Town Precedent (monopoly power + protected dissent) and Language Coop Condition (exit feasibility). Funded relocation required if exclusion pursued."* Argue against your private view—this protects dissent in coercive environments, consistent with our record.
