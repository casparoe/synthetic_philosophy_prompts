answer: |-
  Here are ten precise, substantive interview questions targeting the core of your guest's position, designed to probe while remaining accessible to a philosophy-of-science-literate audience:

  1. **Core Framework**: You argue that "structural narrative coherence" should replace counterfactual causal inference as the standard for explanatory adequacy in macrohistory. Could you formally define this coherence? Specifically, what *operational* criteria distinguish a coherent narrative from a merely plausible story, given that you reject standard statistical tests?

  2. **Analogy & Determinism**: You’ve drawn a structural analogy between quantum entanglement and the co-determination of institutions and geography. If entangled variables cannot be isolated without altering the system’s state, how does this *not* imply that historical outcomes are physically determined by initial conditions (e.g., geography), thereby undermining institutional agency?

  3. **Follow-up (Ontological Neutrality)**: Suppose you reply that the analogy is purely structural—describing relational dependencies, not ontological determinism. How then does this structural constraint *prevent* a narrative from arbitrarily privileging one factor (say, culture) over another? Doesn’t relationality itself demand symmetrical treatment, potentially flattening causal hierarchies?

  4. **Critique of Instrumental Variables**: You claim settler-mortality rates (as instruments for institutional quality) fail *conceptually*, not just empirically. Is the core issue that they falsely assume geography → institutions is a unidirectional causal pathway, ignoring that institutions co-evolve *with* geographic constraints (e.g., irrigation shaping state capacity)?

  5. **Follow-up (Meta-Empirical Failure)**: If you argue this conceptual flaw is a "meta-empirical failure," does this mean such instruments *could not possibly* isolate institutional effects, even with perfect data? And if so, does your framework render all instrumental variables inherently inadequate for macrohistory—or just those ignoring entanglement?

  6. **Normative Stakes of Abandoning Counterfactuals**: If we abandon counterfactual dependence (e.g., "If institution X had been present, outcome Y would differ"), how can we assign responsibility for underdevelopment? Without isolating variables, doesn’t structural coherence risk diffusing blame across entangled factors, absolving specific actors or institutions?

  7. **Follow-up (Distributed Agency)**: Should you appeal to "distributed agency" in response: How does this concept allow us to identify *leverage points* for ethical or political intervention? If agency is distributed across entangled structures (geography, institutions, culture), how do we avoid paralyzing fatalism—or worse, justify imposing external institutional "solutions"?

  8. **Scalar Integration Challenge**: Your coherence criterion requires consistency across temporal/spatial scales. But doesn’t narrative flexibility risk *ad hoc* adjustments? For example, if a culture-level explanation conflicts with regional data, could one reframe culture at a different scale? How is this not post hoc storytelling?

  9. **Falsifiability & Objectivity**: You insist coherence constraints are objective yet not experimentally falsifiable. What then *empirically disqualifies* a structurally coherent narrative? Must it contradict archival evidence—and if archives are themselves products of entangled structures, is this test sufficient?

  10. **Alternative to Tripartite Framing**: If institutions, geography, and culture are not separable "variables" but dialectically entangled processes, what should replace this triad? Do we need new ontological categories for macrohistory—or is the very act of categorizing the root of the error?

  ### Key Design Rationale:
  - **Quantum Analogy**: Questions 2 & 3 press the analogy rigorously while preempting the structural/ontological distinction. The follow-up forces clarity on whether relationality imposes its own determinism.
  - **Settler-Mortality Critique**: Questions 4 & 5 target the conceptual failure argument and elevate it to meta-empirical grounds, challenging the viability of IV methods in principle.
  - **Normative Stakes**: Questions 6 & 7 confront the ethical vacuum critics fear, with the distributed agency follow-up demanding practical applicability.
  - **Precision/Accessibility**: Avoids cliometric jargon (e.g., "instrumental variables" is briefly explained contextually). "Structural narrative coherence" is treated as a term-of-art requiring definition (Q1).
  - **Substance Over Biography**: All questions engage the mechanics of her theory, its implications, and its defenses against major objections.

  These questions should catalyze a rigorous, listener-friendly exploration of her alternative paradigm while respecting her unorthodox commitments.
