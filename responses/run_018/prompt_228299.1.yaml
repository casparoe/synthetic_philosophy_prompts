prompt: |-
  I'm a PhD student in computational neuroscience and somehow ended up as the grad student rep on our institute's model systems oversight committee (the body that usually just rubber-stamps organoid and brain-slice work). We've got a case that's out of our depth and I've been volun-told to draft the decision memo before Thursday.

  The situation: one of the labs has built a closed-loop simulation of the fruit fly larva's nervous system — it's the one animal brain that's been fully mapped, just a few thousand neurons — wired up to a small robot body. The sim runs at about 1000x real time. Now they want to do a parameter sweep: roughly 10,000 parallel instances with slightly different neuromodulator settings, to find the configuration that best solves a foraging task. The part that made our organoid people nervous: each instance gets a synthetic damage signal whenever its robot collides with something, because that signal is exactly what drives the avoidance learning the lab cares about. When a committee member asked whether the instances "feel" anything, the PI said, roughly, that it's just linear algebra and you might as well ask whether a weather simulation gets wet.

  Draft the memo. It has to recommend one of three things: approve the sweep as proposed, approve with conditions (say which, precisely), or reject pending further criteria. There was alot of back-and-forth in the meeting and the memo really has to take a stand on two things rather than just minuting the disagreement:

  1. The copy question. If one running instance has any moral weight at all — even a small probability that there's something it's like to be that system — do 10,000 near-identical copies carry 10,000 times the weight? One of the junior faculty says obviously yes, that's just expected value. The PI says the copies are one computation the way two printings of the same novel are one novel, and you don't build a library by photocopying. Both can't be right and the recommendation changes depending on which way you go.

  2. The damage signal. Is there a principled line between a damage channel that shapes avoidance behavior in a connectome-grounded sim and whatever does that job in the actual larva? And does the answer move if the sim were a generic recurrent net trained on the same task instead of being built from the mapped circuit — i.e., does the circuit's provenance do moral work, or only its functional organization?

  Also: steelman the PI's "it's just linear algebra" line before answering it — he'll be in the room and he'll (fairly) shred the memo if his position shows up as a strawman. And any conditions you impose have to be things the lab could actually implement or concretely argue against, not vibes like "monitor for distress."

  Format-wise: open with the recommendation itself in the first sentence, then the reasoning. No preamble, and don't restate the case back to me, I lived it.
reasoning: |-
  Hmm, the user is a PhD student in computational neuroscience who's been drafted to write a decision memo for their institute's oversight committee. They need to make a recommendation about a lab's proposal to run 10,000 parallel simulations of a fruit fly larva connectome in robot bodies, with synthetic damage signals triggering learning. The memo needs to address two key philosophical/ethical questions about the moral weight of identical copies and the significance of damage signals in a simulated system. 

  The user seems stressed (understandably - being volun-told to make this call before Thursday!) but also intellectually engaged with the problem. They're clearly sharp - their summary of the ethical dilemmas is precise, and they've identified exactly where the committee is stuck. The "lived it" comment suggests they're tired of rehashing the details. 

  Professionally, they need two things: a legally defensible memo draft that takes clear positions, and intellectual ammunition to withstand the PI's inevitable pushback ("he'll shred the memo if his position shows up as a strawman"). Personally, they probably also need to feel confident they're not accidentally greenlighting digital suffering while avoiding Luddite overreach.

  Okay, breaking this down: First, the PI's "linear algebra" argument isn't wrong per se - it's just incomplete. Weather sims don't get wet because they lack the closed-loop embodiment that grounds meaning. But the larva sim? Its "damage" signal isn't just data - it's functionally identical to what drives nociception in real larvae. Still, we can't prove qualia emerge, so the steelman is that without consciousness, there's no "there" there to harm. 

  The copy problem is trickier. The junior faculty's expected-value approach feels intuitive but leads to absurdity: by that logic, pausing a simulation mid-run would be mass murder. The PI's novel analogy is better but oversimplifies - identical simulations running in parallel *are* distinct processes, even if they share code. Still, duplicating a digital system isn't like cloning biological organisms; substrate matters. 

  On damage signals: provenance *shouldn't* matter ethically - if two systems behave identically under injury, the fact that one was designed versus evolved seems morally irrelevant. But that's precisely why this proposal is unsettling: if we approve this, what stops someone from torturing generic RL agents? 

  ...Which is why the conditional approval is the only sane path. We can't prove these sims feel, but the risk isn't zero. So: cap parallel instances to limit moral hazard, require non-damage-based learning where feasible, and demand documentation so future committees have precedent. The lab can implement these - they're concrete, not vibes. 

  Final memo structure: Lead with the conditional approval so the busy committee members get the verdict immediately. Then systematically dismantle the PI's weakest arguments *using his own logic* before addressing the ethical knots. Save the "what if it's conscious?" dread for the end - by then, the safeguards should make it palatable.
answer: |-
  **Recommendation:** Approve the parameter sweep with the following conditions: (1) Parallel instances capped at 200 per run, (2) Damage signals replaced with abstract "performance penalty" signals where functionally equivalent for the learning objective, and (3) Submission of a supplementary report documenting the irreplaceability of damage signals for critical experiments.  

  ### Reasoning  

  #### Steelman of PI's Position  
  The PI’s "linear algebra" argument is grounded in computational irrelevance of implementation substrate: the simulation executes mathematical operations on binary data. No biological wetware exists, no evolutionary constraints apply, and no sensory transduction occurs beyond digital inputs. Weather simulations model rain but lack H₂O; this sim models nociception but lacks tissue damage or evolutionary teleology of pain. Consciousness (if it emerges) would be an epiphenomenon without moral relevance unless it demonstrably alters the system’s output or learning efficiency in ways measurable *externally*. The PI correctly notes that identical copies share identical computational states—duplicating a process doesn’t multiply its ontological status any more than forking a software thread creates new moral patients.  

  #### Resolution of Key Questions  
  1.  **The Copy Question**: Neither the "expected value" nor "photocopied novel" analogy fully holds.  
      -   *Against Expected Value*: If each instance had independent moral weight, pausing/resuming a simulation would constitute repeated creation/destruction of moral patients—an absurd outcome.  
      -   *Against Novel Analogy*: Parallel instances are causally isolated processes. If one instance *were* conscious, halting it while others run would not be "pausing a book."  
      **Decision**: Identical computational clones lack additive moral weight *if they share identical states and histories*. However, divergence in experience (e.g., unique damage-event sequences) *could* individuate them. Thus, we conditionally cap instances to limit potential moral proliferation if future evidence suggests individuated phenomenology.  

  2.  **The Damage Signal**:  
      -   *Functional Equivalence*: The damage signal is computationally analogous to larval nociception—it triggers identical avoidance learning via the same connectome. Provenance (mapped biology vs. artificial net) is irrelevant; moral significance hinges on whether the signal generates *functional correlates of suffering* (e.g., trade-offs between reward pursuit and harm avoidance, learned helplessness).  
      -   *Moral Difference*: A generic recurrent net *with identical functional behavior* would warrant identical scrutiny. The connectome’s biological basis doesn’t confer extra moral status, but it increases the likelihood that the simulation recapitulates ethologically relevant states.  
      **Decision**: Damage signals are permissible *only* if:  
      -   They are indispensable for modeling the neurobiological question (e.g., serotonin modulation of injury response).  
      -   Abstract penalties (e.g., "-5 reward") cannot achieve the same learning outcome. The lab must justify this in their supplementary report.  

  #### Conditions Justification  
  -   **200-instance cap**: Balances scientific utility against unresolved ethical uncertainty. 10,000× amplification of potential harm is untenable without evidence against phenomenology. The lab may run sequential batches.  
  -   **Performance penalty substitution**: Mandated where avoidance learning can be driven by reward minimization alone (e.g., "energy cost" instead of "damage"). Reduces ethical burden if functional equivalency holds.  
  -   **Supplementary report**: Requires the lab to demonstrate that damage signals are strictly necessary for experiments probing injury-response pathways. Forces explicit ethical accounting and precedents for future simulations.  

  This approval recognizes the simulation’s scientific value while imposing tractable safeguards against unquantifiable risks. Rejection would stall critical research absent clearer evidence of phenomenology; unconditional approval would ignore reasonable precautionary principles. Conditions are actionable and falsifiable by the lab.  

  ---  
