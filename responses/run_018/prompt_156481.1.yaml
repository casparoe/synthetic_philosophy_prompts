prompt: |-
  You are the data-ethics lead at a mid-sized health-tech firm that builds clinical-risk prediction tools. The board has adopted the view that race, gender, and socioeconomic status are institutional rather than natural kinds—specifically, interactive kinds that change through being measured and acted upon. You need a reusable decision procedure—an ordered checklist with stop points, judgment-call flags, and explicit hand-offs to human deliberation—for your team to apply whenever a data scientist proposes including one of these categories as a model feature. The procedure should translate the looping-effect idea into concrete steps: what to verify about the measurement instrument, what institutional context to check, when exclusion is mandatory, when inclusion requires a reflexivity safeguard, and where the question becomes normative rather than technical. Apply it to three proposals: (1) self-identified gender in a mental-health screening algorithm; (2) race-coded proxies (ZIP code plus insurance type) in a cardiovascular-risk model; and (3) a banking-pattern-derived financial-stress index used as a class proxy. Include at least one case where the procedure yields an answer the engineering team will resist, and close by stating what the procedure cannot resolve. Write in American English.
reasoning: |-
  We are creating a decision procedure for including race, gender, and socioeconomic status (SES) as features in clinical-risk prediction models. The board's view is that these are institutional (interactive) kinds, meaning they change through measurement and intervention. The procedure must include:

  1. **Stop Points**: Steps that can lead to immediate exclusion of the feature.
  2. **Judgment-Call Flags**: Points requiring expert deliberation.
  3. **Hand-offs to Human Deliberation**: Explicit points where the decision must be made by a committee (e.g., ethics board).

  The procedure should cover:
  - Verification of the measurement instrument.
  - Institutional context checks.
  - Conditions for mandatory exclusion.
  - Conditions requiring reflexivity safeguards (i.e., mechanisms to monitor and adjust for the feedback effects of using the category).
  - Points where the question becomes normative (value-based) rather than technical.

  ---

  **Decision Procedure: Inclusion of Race, Gender, or SES as a Feature**

  **Step 1: Define the Category and Measurement**
     - **Check**: How is the category being measured? Is it self-identified, observed, inferred, or proxied?
     - **Stop Point**: If the measurement method is not clearly defined or is known to be invalid (e.g., using ZIP code as a direct proxy for race without validation), stop and exclude the feature. Mandatory exclusion if the measurement method reinforces harmful stereotypes (e.g., using criminal records as a proxy for race).
     - **Judgment Call**: If the measurement is indirect (e.g., proxies), flag for deliberation on potential misclassification and harm.

  **Step 2: Assess the Purpose and Context of Inclusion**
     - **Check**: Why is the category being included? (e.g., for fairness adjustment, to capture biological differences, to account for social determinants?)
     - **Stop Point**: If the purpose is to adjust for biological differences in a way that ignores institutional factors (e.g., using race to "correct" a biomarker without evidence of biological causation), stop and exclude. Mandatory exclusion if the inclusion would violate anti-discrimination laws (e.g., using gender in a way that would lead to discriminatory treatment).
     - **Judgment Call**: If the purpose is to address health disparities, flag for deliberation on whether inclusion might inadvertently worsen disparities (e.g., by legitimizing the use of a category in a context where it is not appropriate).

  **Step 3: Evaluate Potential Feedback Effects (Reflexivity)**
     - **Check**: How might the use of this category in the model change the way the category is understood or experienced? Could it reinforce harmful stereotypes, stigmatize groups, or alter behavior in ways that affect the category?
     - **Stop Point**: If there is evidence from similar deployments that the feature has caused harm through feedback effects (e.g., a model using SES that led to reduced access to care for low-SES groups), stop and exclude.
     - **Reflexivity Safeguard Requirement**: If inclusion is deemed necessary, but there is a risk of feedback effects, require safeguards (e.g., ongoing monitoring of impact on different groups, periodic review of the feature's justification, and an exit strategy if harm is detected).

  **Step 4: Institutional Context and Legitimacy**
     - **Check**: What institutional structures are in place? Does the institution have the legitimacy to use this category? Consider historical and social context (e.g., past discrimination).
     - **Stop Point**: If the institution lacks legitimacy (e.g., due to past misuse of the category) or if there is no governance structure to oversee the use, stop and exclude.
     - **Judgment Call**: If the context is complex (e.g., using race in a country with a history of racial discrimination), flag for deliberation by an ethics board.

  **Step 5: Normative Considerations**
     - **Check**: Does the question of inclusion hinge on value judgments (e.g., what is fair, what counts as harm) that cannot be resolved technically?
     - **Hand-off**: If the decision involves unresolved normative questions (e.g., whether using gender in mental health perpetuates non-binary exclusion), hand off to an ethics board for deliberation.

  **Step 6: Final Assessment**
     - If the feature passes all steps without stop points and with necessary safeguards, it may be included.
     - **Hand-off**: Even if included, the implementation must be approved by an ethics board and monitored.

  ---

  **Application to Proposals**

  **(1) Self-identified gender in a mental-health screening algorithm**

  - **Step 1**: Measurement is self-identified, which is valid and respects individual identity. No stop.
  - **Step 2**: Purpose? If to account for differences in mental health presentation (e.g., depression symptoms varying by gender), we must check if these differences are due to institutional factors (e.g., gender roles) or biological. If the latter, we need strong evidence. Without clear evidence, it's a judgment call. If the purpose is to ensure equitable care, note that excluding non-binary individuals could occur. **Judgment call**: Flag for deliberation on whether inclusion might marginalize non-binary individuals and if the model can handle non-binary and transgender identities appropriately.
  - **Step 3**: Feedback effects? Using gender might reinforce binary views and lead to misgendering or exclusion. **Reflexivity safeguard required**: Model must include non-binary and transgender options, and outcomes must be monitored for disparities.
  - **Step 4**: Institutional context: Mental health has a history of gender stereotyping (e.g., hysteria). The firm must have strong governance. **Judgment call**: Flag for ethics board review.
  - **Step 5**: Normative: Whether gender should be used in mental health is debated. **Hand-off** to ethics board for final decision.

  **Conclusion for (1)**: Not mandatory exclusion, but requires safeguards and ethics board approval. Without non-binary inclusion, stop.

  **(2) Race-coded proxies (ZIP code plus insurance type) in a cardiovascular-risk model**

  - **Step 1**: Measurement is by proxy (ZIP code and insurance). This is problematic: ZIP code is a proxy for race (redlining history) and insurance type (a SES proxy) and both are crude and may reinforce structural racism. **Stop Point**: Mandatory exclusion because the measurement method is invalid and harmful. Using ZIP code as a race proxy is known to perpetuate redlining. Even if intended for SES, the racial coding makes it unacceptable.

  **Conclusion for (2)**: Mandatory exclusion. This is the case where the engineering team might resist because they see it as a practical way to capture social determinants. But the procedure stops it.

  **(3) Banking-pattern-derived financial-stress index used as a class proxy**

  - **Step 1**: Measurement is a derived index from banking patterns. This is a proxy for SES (financial stress). It may be more precise than ZIP code but could still have biases (e.g., against unbanked individuals). **Judgment call**: Flag for validity assessment: How well does it capture financial stress across different groups? Does it exclude the unbanked?
  - **Step 2**: Purpose? To capture the impact of financial stress on health. This is legitimate (social determinants). But if used as a class proxy without addressing the root causes, it might shift blame to individuals. **Judgment call**: Flag to ensure the model doesn't penalize individuals for being poor.
  - **Step 3**: Feedback effects? Could lead to discrimination in care (e.g., denying services to those with high financial stress). Also, the index itself might change behavior (e.g., people avoiding necessary spending to lower the index). **Reflexivity safeguard required**: Monitor for adverse outcomes and have an exit plan.
  - **Step 4**: Institutional context: Using financial data in health care might be seen as intrusive. The firm must ensure transparency and consent. **Judgment call**: Ethics board review required.
  - **Step 5**: Normative: Is it fair to use financial data in this way? **Hand-off** to ethics board.

  **Conclusion for (3)**: Not mandatory exclusion, but requires extensive safeguards and ethics board approval.

  ---

  **What the Procedure Cannot Resolve**

  The procedure cannot resolve:
  - Deep normative disagreements about what constitutes fairness or harm, which require democratic deliberation beyond the institution.
  - Unforeseen feedback effects that only emerge after deployment, hence the need for ongoing monitoring.
  - The inherent tension between the goal of health equity and the potential harm from categorizing individuals by socially sensitive groups.

  This procedure makes the trade-offs explicit and forces deliberation but cannot eliminate the need for ethical judgment.
answer: |-
  ### Decision Procedure: Evaluating Race, Gender, and Socioeconomic Status as Model Features  
  **Philosophical Foundation**: Race, gender, and socioeconomic status (SES) are institutional "interactive kinds"—they shape and are shaped by measurement and intervention. Including them in models risks reinforcing harmful feedback loops (e.g., stigmatization, structural bias). This procedure mandates caution, prioritizing harm prevention and reflexivity (monitoring how the model itself alters social dynamics).  

  **Governance**:  
  - **Stop Points** (🛑): Immediate exclusion. Override requires CEO/ethics board approval.  
  - **Judgment-Call Flags** (⚠️): Pause for ethics board review.  
  - **Hand-offs** (🤝): Escalate to ethics board + legal/compliance.  
  - **Reflexivity Safeguards**: Required mitigations if inclusion proceeds (e.g., impact audits, sunset clauses).  

  **Procedure Steps**:  
  1. **Define Measurement Validity**  
     - Verify: Is the feature *directly self-identified* (e.g., patient-reported) or *proxied/inferred* (e.g., ZIP code for race)?  
     - 🛑 Stop if:  
       - Proxies rely on stereotypes (e.g., ZIP code = race) or historically biased instruments (e.g., policing data for SES).  
       - Measurement is not opt-in, transparent, or auditable.  
     - ⚠️ Flag if: Ambiguity exists between biological vs. institutional interpretation (e.g., "gender" used for hormonal factors without social context).  

  2. **Assess Purpose and Harm Potential**  
     - Verify: Does inclusion *reduce disparities* (e.g., improving accuracy for underserved groups) or *risk harm* (e.g., rationing care based on SES)?  
     - 🛑 Stop if:  
       - Purpose normalizes inequality (e.g., "correcting" outcomes for race without addressing systemic causes).  
       - Legally prohibited (e.g., using gender for reproductive care in restricted states).  
     - ⚠️ Flag if: Evidence of benefit is contested or relies on circular logic (e.g., "SES is predictive" without examining why).  

  3. **Evaluate Feedback Loops**  
     - Verify: Could model deployment alter how the category is experienced? (e.g., incentivizing patients to hide gender identity; amplifying banking discrimination).  
     - 🛑 Stop if:  
       - Historical precedent shows reinforcing harm (e.g., race proxies in credit scoring deepening wealth gaps).  
     - 🤝 Hand-off if: Uncertain about long-term societal impacts (escalate to ethics board for scenario analysis).  
     - **Reflexivity Safeguard Required**: If proceeding, mandate real-time monitoring + stakeholder feedback (e.g., community advisory panels).  

  4. **Check Institutional Legitimacy**  
     - Verify: Does the firm have:  
       - Consent mechanisms?  
       - Expertise in structural inequity?  
       - Diverse governance (e.g., impacted groups in oversight)?  
     - 🛑 Stop if: Lacking any above OR operating in high-risk contexts (e.g., areas with active voter suppression using race data).  
     - ⚠️ Flag if: Power imbalances exist (e.g., profiling low-SES patients without resource referrals).  

  5. **Normative Boundary Test**  
     - Verify: Is the debate technical (e.g., "Does this improve AUC?") or value-driven (e.g., "Should we use banking data to allocate care?")?  
     - 🤝 Hand-off always: Value questions go to ethics board + external experts.  

  **Application to Proposals**:  

  #### (1) Self-Identified Gender in Mental-Health Screening Algorithm  
  - **Step 1**: Self-identified measurement is transparent and auditable. Proceeds.  
  - **Step 2**: Purpose is detecting disparities (e.g., higher depression rates in women). ⚠️ **Flag**—risk of pathologizing gender nonconformity or misgendering non-binary patients.  
  - **Step 3**: Feedback risk: May pressure patients to misreport identity to avoid stigma. **Reflexivity Safeguard Required**:  
    - Mandate gender-inclusive categories (non-binary, transgender options).  
    - Monitor for discrepancies in false positives across groups.  
  - **Step 4**: Firm lacks non-binary mental-health expertise. ⚠️ **Flag**—require LGTBQ+ advisory panel co-design.  
  - **Step 5**: Normative—"Should gender inform mental-health risk?" 🤝 **Hand-off to ethics board**.  
  **Outcome**: Inclusion allowed only with safeguards. Engineering may resist non-binary categories ("complexity"), but 🛑 stop if omitted.  

  #### (2) Race-Coded Proxies (ZIP Code + Insurance Type) in Cardiovascular-Risk Model  
  - **Step 1**: Proxied measurement (ZIP code = redlining correlate; insurance = SES marker). 🛑 **STOP**—proxies weaponize institutional racism (e.g., tying Black neighborhoods to "higher risk" without causal evidence). Historical harm (e.g., mortgage discrimination) is amplified.  
  - **Step 2**: Purpose claims "equity adjustment" but uses ZIP code as race stand-in. 🛑 **STOP**—violates anti-discrimination principles (Fair Housing Act implications).  
  - **Steps 3–5**: Not reached. Stop enforced.  
  **Outcome**: Mandatory exclusion. **Engineering resistance expected**: Proxies are "efficient," but procedure deems them inherently harmful. Hand-off to legal for compliance review.  

  #### (3) Banking-Pattern-Derived Financial-Stress Index as Class Proxy  
  - **Step 1**: Inferred measurement (banking data = spending habits). ⚠️ **Flag**—may exclude unbanked/underbanked (e.g., low-income, immigrant groups). Verify auditability.  
  - **Step 2**: Purpose is "capturing SES impact on health." Risk: Blames individuals for structural poverty (e.g., denying care due to "high stress" scores). 🤝 **Hand-off**—ethics board must weigh medical utility vs. moral hazard.  
  - **Step 3**: Feedback risk: Banks may deny loans based on health-model usage, deepening poverty. **Reflexivity Safeguard Required**:  
    - Anonymize data sources; ban third-party sharing.  
    - Partner with community lenders for counter-data.  
  - **Step 4**: Firm lacks banking-industry oversight. 🛑 **Stop if** safeguards are infeasible.  
  - **Step 5**: Normative—"Is financial surveillance justified in healthcare?" 🤝 **Hand-off to ethics board + patient advocates**.  
  **Outcome**: Conditional inclusion with strict safeguards. Exclusion if ethics board rejects trade-offs.  

  ### Limitations of the Procedure  
  **Cannot resolve**:  
  - **Irreconcilable Value Conflicts**: e.g., When "accuracy" (technical) clashes with "autonomy" (normative). Final decisions rest with society, not the firm.  
  - **Unforeseen Consequences**: Feedback loops may emerge post-deployment; safeguards can fail.  
  - **Definitional Ambiguity**: e.g., "Gender" in mental health may be contested internally; procedure forces deliberation but not consensus.  
  - **Structural Inequities Beyond Control**: e.g., Banking data reflects societal bias; procedure mitigates but cannot erase this.  

  **Final Accountability**: Ethics board owns unresolved judgments. CEO approves stops/safeguards. Revise procedure annually with external audits.
