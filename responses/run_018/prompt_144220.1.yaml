  For (iv) problem pleasures: Masochism is the litmus test. If pain can be pleasurable, does "pleasure" mean anything unified? Feldman's attitudinal hedonism might help—it's about wanting the experience to continue. But the user banned desire-based solutions! Empirical clue: Berridge's "liking" vs. "wanting" dissociation shows masochists may genuinely like sensations others find painful. Tricky, but possible—0.45.

