answer: |-
  The patent law distinction in *Assoc. Mol. Path. v. Myriad Genetics* (2013) rests on a **dualistic view of DNA** that treats it as both a physical molecule *and* encoded information. This legal line presupposes several key things:

  ### 1. **DNA as Information Separable from Its Physical Form**  
     - **Presupposition**: The law implies that DNA's *informational content* is conceptually distinct from its chemical structure. Isolating natural DNA merely extracts a pre-existing molecule, while creating cDNA involves "editing" (removing introns) to reveal a *human-curated version* of the genetic "code."  
     - **Coherence Debate**:  
       - **Pro-information view**: If DNA is fundamentally a code (like software), cDNA represents a "purified" version of biological information—making it analogous to an invention.  
       - **Critique**: DNA doesn’t function as abstract information; it requires specific molecular structures (e.g., methylation, 3D folding) to work. Spliceosomes naturally remove introns, so cDNA is just mimicking biology. The line is biologically arbitrary.

  ### 2. **Chemistry-First Perspective: Could the Line Hold?**  
     - **Yes, but with different reasoning**:  
       - **Chemistry view**: DNA is *only* a complex molecule. Isolated natural DNA isn’t patentable because its covalent bonds and sequence are unaltered. cDNA, however, is chemically distinct:  
         - No introns (different sequence).  
         - Synthesized in vitro (non-natural backbone bonds).  
       - **Same outcome, different logic**: cDNA is patentable not because it's "edited information," but because it’s a *novel chemical entity* not found in nature. The patent relies on material differences, not conceptual ones.  

  ### 3. **Where the Line *Must* Move for Chemists**  
     If DNA is purely chemistry:  
     - **Natural DNA modifications**: Minor chemical alterations (e.g., methylation, snips) might become patentable if they create a "new molecule," even if informationally identical.  
     - **Synthetic DNA**: A *chemically synthesized* full-length gene (with introns) could be patentable as a man-made molecule, even if its sequence matches nature.  
     - **Conversely**: cDNA could lose protection if deemed "obvious" chemical mimicry of natural mRNA (as spliceosomes already make intron-free RNA).  

  ### The Core Tension: Legal Convenience vs. Scientific Reality  
  The ruling prioritizes **practical legal bright lines** over biological or philosophical coherence:  
  - **Natural DNA** = "Found in the body" → Unpatentable.  
  - **cDNA** = "Requires human lab intervention" → Patentable.  

  This sidesteps debates about DNA's essence by focusing on *human alteration* as the threshold. Yet it implicitly endorses an informational view by treating gene sequences as "inventions" when isolated from biological context.  

  ### Conclusion  
  The line presupposes DNA is **both molecule and message**, but privileges the "message" when human ingenuity refines it. A chemistry-only view could uphold cDNA patents by emphasizing synthetic manufacture, but would expand patentability to other modified molecules while potentially narrowing "inventiveness" to non-obvious chemical changes. Ultimately, the law reflects a compromise: it avoids calling natural genes "inventions" while incentivizing biotech through cDNA patents, revealing more about patent policy’s needs than DNA’s true nature.
