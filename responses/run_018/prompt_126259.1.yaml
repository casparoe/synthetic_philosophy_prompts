answer: |-
  ### Research Proposal: Fuzzy Boundaries in Lexical NUT  

  **Bottom Line:** This project investigates whether introducing a 'fuzzy boundary layer' between suffering-reduction and pleasure-maximisation genuinely resolves arbitrariness in lexical negative utilitarianism (NUT) or covertly reintroduces commensurability.  

  **Precise Question:**  
  Does a partially ordered zone avoiding direct cardinal comparison of suffering/pleasure eliminate the arbitrariness of lexical-NUT’s threshold, or does it implicitly smuggle commensurability into the model?  

  **Why Existing Answers Leave It Open:**  
  Current lexical-NUT frameworks either accept an arbitrary cutoff or reject comparability entirely, neglecting intermediate structural solutions. The fuzzy-layer proposal remains untested for hidden commensurability assumptions.  

  **Methodology & Monthly Plan:**  
  *Month 1: Conceptual Groundwork*  
  - Audit core NUT literature (Hare, Arrhenius) and incommensurability theories (Chang, Broome) to map gaps.  
  *Rationale:* Avoids reinventing frameworks; establishes where fuzziness *isn’t* addressed.  

  *Month 2: Model-Building*  
  - Formalise the fuzzy layer using partial ordering (e.g., lattice theory), simulating decisions where suffering-reduction/pleasure-maximisation overlap without cardinal weighting.  
  *Rationale:* Structural modelling avoids vague intuition—unlike thought experiments—exposing hidden commensurability through algebraic properties.  

  *Month 3: Robustness Testing*  
  - Stress-test the model against edge cases (e.g., "suffering-diminishing returns" vs. "pleasure saturation") and paradoxes (e.g., spectrum arguments).  
  *Rationale:* Identifies if fuzziness collapses into rankability under pressure, unlike qualitative critiques.  

  **Success vs. Failure:**  
  - **Success:** The fuzzy layer holds without requiring implicit exchange rates; arbitrariness is reduced via incomparable "domains".  
  - **Outright Failure:** The model demands covert cardinal comparisons (e.g., thresholds reemerge in partial-order rankings).  

  **Honest Scope Check:**  
  - *In scope:* Structural coherence of fuzziness within lexical-NUT. Ignores empirical psychology or meta-ethical debates.  
  - *Out of scope:* Proving incommensurability itself or solving all lexical threshold problems. Limited to conceptual modelling.  

