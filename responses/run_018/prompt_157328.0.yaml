  Expanded to meet 600 words:

  In classical real analysis, the Intermediate Value Theorem (IVT) is a cornerstone, asserting that for any continuous function f defined on the closed interval [a, b] with f(a) < 0 and f(b) > 0, there must be a point c in the open interval (a, b) such that f(c) = 0. The standard proof involves constructing two sequences, one increasing and one decreasing, by repeatedly bisecting the interval and choosing a subinterval where the function changes sign. The sequences converge to the same limit c, and by continuity, f(c)=0. However, this argument is non-constructive because it relies on the law of excluded middle (LEM) at each bisection step: we must declare that either the left subinterval or the right subinterval has the sign change, without necessarily having a procedure to decide which.

  The BHK interpretation, which gives meaning to logical connectives in intuitionistic logic, requires that a proof of an existential statement (∃x P(x)) must supply a specific witness x0 and a proof that P(x0) holds. Moreover, for a proof of a disjunction (A ∨ B), we must have either a proof of A or a proof of B. In the classical IVT proof, the repeated use of LEM for disjunctions over an infinite sequence of steps means that we are not providing a witness in the constructive sense. We do not have an algorithm to compute c; we only know that c exists as the limit of the sequences, but we cannot compute it because we cannot decide at each step which subinterval to take. Thus, the classical proof fails the BHK standard for existence.

  Double-negation translation offers a formal way to interpret classical theorems in intuitionistic logic. The idea is to translate each classical statement S into an intuitionistic statement S^N by adding double negations in a way that preserves provability. For the IVT, the classical existence claim becomes ¬¬∃c f(c)=0. Intuitionistically, this means that the assumption that no c exists such that f(c)=0 leads to a contradiction. This translation is sound: if the IVT is classically provable, then its translation is intuitionistically provable. So, the intuitionist can accept that the classical IVT is not false.

  But does this address the intuitionist's worry? The intuitionist rejects the classical IVT not because it is false but because its proof is non-constructive. The double-negation translation does not magically produce a constructive proof; it only shows that the classical statement is consistent with intuitionistic logic. The translated statement ¬¬∃c f(c)=0 does not provide a witness c. It only says that we cannot rule out the existence of such a c. Therefore, the translation does not fulfil the constructive requirement of providing a method to find the root. It merely hides the non-constructiveness behind a double negation.

  In conclusion, the double-negation translation is a technical device that allows classical mathematics to be embedded within intuitionistic frameworks, but it does not solve the problem of non-constructivity. The intuitionist's demand for a constructive existence proof remains unmet by the classical IVT argument, and the translation does not convert that argument into a constructive one. For a constructive treatment of the IVT, one must either restrict to functions with decidable properties (like having a modulus of continuity that allows effective tracking of sign changes) or use a different mathematical framework altogether, such as Bishop's constructive analysis.

