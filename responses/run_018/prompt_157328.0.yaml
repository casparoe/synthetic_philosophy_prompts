  We are drafting an exam question for an upper-level philosophy of math course on intuitionistic logic and constructivism. The focus is on comparing classical and intuitionistic treatments of the Intermediate Value Theorem (IVT) through the lens of the BHK interpretation. The question should require students to:

  1. Explain what counts as a constructive existence proof.
  2. Explain why the standard classical argument for IVT fails to meet that standard.
  3. Explain how the double-negation translation addresses the intuitionist's worry.
  4. Discuss whether the double-negation translation actually solves the problem or just hides it.

  We are to write:
  - The exam question (as an essay prompt)
  - A model answer (approx 600 words, continuous prose)
  - A marking scheme (continuous prose, no headings, bullet points, etc., in British English) that separates an A answer from a B by naming specific moves.

  All in British English and without formatting.

  Let's start with the exam question.

  **Exam Question:**

  "Critically compare the classical and intuitionistic treatments of the Intermediate Value Theorem. Your answer should explain, with reference to the BHK interpretation, what constitutes a constructive existence proof and why the standard classical proof of the Intermediate Value Theorem fails to provide such a proof. Additionally, explain how the double-negation translation is intended to reconcile classical and intuitionistic mathematics in this context, and evaluate whether this translation successfully addresses the intuitionistic concerns or merely obscures them."

  **Model Answer (Approx 600 words):**

  In classical mathematics, the Intermediate Value Theorem (IVT) states that if a continuous function f defined on the closed interval [a, b] takes values f(a) and f(b) with opposite signs, then there exists a point c in (a, b) such that f(c) = 0. The classical proof typically employs the method of repeated bisection to construct two sequences converging to the same limit c, and then appeals to the continuity of f to conclude that f(c)=0. However, this proof relies on the law of excluded middle (LEM) in an essential way: at each bisection step, one must assert that either the function changes sign on the left half or the right half of the current interval. This disjunction is not constructively justified because we lack a method to decide which half-interval contains the sign change.

  According to the BHK (Brouwer-Heyting-Kolmogorov) interpretation, a constructive proof of an existential statement must provide an algorithm to compute the witness and a proof that it satisfies the required property. For the IVT, a constructive existence proof would require a method to compute the root c to any desired precision. The classical proof fails to meet this standard because it does not specify how to find the half-interval with the sign change at each step; it merely assumes that one such interval exists by LEM, without providing a means to determine it. Thus, the classical argument is non-constructive.

  To bridge the gap between classical and intuitionistic mathematics, one can use the double-negation translation. This technique translates classical statements into intuitionistically acceptable ones by inserting double negations appropriately. For example, the classical existence of a root (∃c f(c)=0) is translated as ¬¬∃c f(c)=0. Intuitionistically, this double-negated statement is weaker and does not require the production of an actual witness. The double-negation translation preserves the provability of classical theorems in an intuitionistic system, so if the IVT is classically provable, its double-negation translation is intuitionistically provable.

  However, this translation does not solve the constructive problem at hand. It merely shows that the classical statement of the IVT, when interpreted with double negations, is consistent with intuitionistic logic. The intuitionistic worry is that the classical proof does not provide a method to find the root. The double-negated form only asserts that it is absurd to deny the existence of a root, but it does not construct the root. Therefore, the translation does not yield a constructive existence proof; it only provides a proof of the double-negated existence, which is not the same as existence in the constructive sense.

  In summary, while the double-negation translation allows intuitionists to recognise that the classical IVT is not contradictory, it fails to address the core constructive concern: the absence of an algorithm to compute the root. The classical proof remains non-constructive, and the translation does not convert it into a constructive one. Intuitionists would require a different approach, such as Brouwer's continuity principles or recursive methods, to establish a constructive version of the IVT, which typically involves additional hypotheses on the function to ensure that the sign changes are decidable at each bisection step.

