  ---

  **MEMORANDUM**  
  **To:** Municipal Appeals Board  
  **From:** [Your Name/Title]  
  **Date:** [Current Date]  
  **Subject:** Reform of Expert Panel Review Process – Recommendation & Implementation Timeline  

  ### **Issue**  
  Recent evidence (e.g., discrepancies between private technical memos and final verdicts) suggests later reviewers (C, D) may be over-aligning with Reviewer A’s verdict due to behavioral herding, not independent judgment. Three reforms are proposed:  
  1. **Fully blind parallel review** (no prior verdicts visible).  
  2. **Status quo** (sequential with verdicts visible; supports Dr. Chen’s "rational herding" argument).  
  3. **Hybrid approach** (show prior verdicts but hide confidence scores).  

  ### **Assessment of Options**  
  1. **Fully Blind Parallel Review**  
     - **Pros**: Eliminates herding; ensures independent assessments.  
     - **Cons**: Loses potential epistemic benefits if Reviewer A’s expertise is genuinely superior (per Dr. Chen). Could fragment consensus-building.  

  2. **Status Quo (Sequential Review)**  
     - **Pros**: Preserves Dr. Chen’s "rational updating" – if A is expert, others *should* incorporate her insight.  
     - **Cons**: Observed misalignment with private memos indicates herding is **irrational** (e.g., deferring to A despite contradictory evidence). Suppresses diverse perspectives and risks "false consensus."  

  3. **Hybrid Approach (Verdicts Visible, Confidence Scores Hidden)**  
     - **Pros**: Balances Dr. Chen’s concern (lets reviewers learn from A’s *substance*) while reducing "certainty bias." Hiding confidence mitigates copying of unjustified certainty.  
     - **Cons**: Moderately complex to implement; confidence might be inferred from language.  

  ### **Recommendation: Hybrid Approach (Option 3)**  
  **Rationale**:  
  - **Acknowledges Dr. Chen’s valid point**: If A’s reasoning is sound, reviewers *should* update their views. Showing verdicts preserves this signal.  
  - **Targets the core problem**: Private memos show herding likely stems from social pressure or overreliance on A’s authority. Hiding confidence scores reduces "anchoring" on A’s assertiveness without silencing her perspective.  
  - **Pragmatic**: Less disruptive than full blinding; allows testing if reduced herding occurs while retaining collaborative insights.  
  - **Risk Mitigation**: If alignment persists, we can pivot to full blinding later.  

  ### **Implementation Timeline**  
  | **Phase** | **Timeline** | **Key Actions** |  
  |-----------|--------------|----------------|  
  | **Pilot Setup** | Week 1 | • IT adjusts review portal to mask confidence scores in prior verdicts.<br>• Brief consultants on new process (emphasize independence + substance-based learning). |  
  | **Pilot Execution** | Weeks 2–5 | • Run 3–4 upcoming bids using hybrid process.<br>• Collect private memos *before* final verdicts to track alignment shifts. |  
  | **Review & Decision** | Week 6 | • Analyze discrepancies between private memos/verdicts.<br>• Solicit anonymous feedback from reviewers.<br>• Board votes to adopt permanently, adjust, or try another model. |  

  ### **Why Not Status Quo or Full Blinding?**  
  - **Status quo**: Ignores clear evidence of harmful herding. Private memos prove reviewers *aren’t* rationally updating but suppressing valid dissent.  
  - **Full blinding**: Overcorrects; loses too much signal if A’s input is truly valuable. Hybrid offers a safer first step.  

  **Next Steps**:  
  - **Thursday’s meeting**: Vote to approve hybrid pilot.  
  - **Post-approval**: IT lead initiates portal updates; chair contacts reviewers about new protocols.  

