  Below is a diagnostic taxonomy structured as a decision tree for interpreting the White Horse Dialogue and its place in the School of Names. The tree begins with a root question about the nature of the conclusion ("a white horse is not a horse") and branches based on concrete commitments about argument structure, substitutivity, the School's other fragments, and the dialogue's function. Each branch is framed as a claim about the argument or its relation to broader School of Names doctrines (e.g., designation, hardness-whiteness). Leaves include the required positions, each with their most awkward commitment. Identical paths are flagged where applicable.

  ---

  ### **Root Question**  
  **Claim about the conclusion**: The conclusion "a white horse is not a horse" expresses a genuine ontological separation (e.g., whiteness and horseness occupy distinct realms of being).  
  **OR**  
  **Claim about the conclusion**: The conclusion reveals a category mismatch in how compound ("white horse") and simple ("horse") names map onto things (e.g., due to semantic, logical, or referential differences).

  ---

  ### **Branch 1: Genuine Ontological Separation**  
  **Node (a): Substitutivity Failure**  
  *Claim*: Substitutivity fails between compound/simple terms because chromatic (e.g., whiteness) and formal (e.g., horseness) determinables belong to non-overlapping ontological registers.  
  - **Yes** → **Leaf: Chromatic-Formal Separation Thesis**  
    *Awkward commitment*: One must deny that colored objects (e.g., white horses) are unified entities, treating color and shape as fundamentally alien to each other.  
  - **No** → Proceed to Node (b).  

  **Node (b): School's Arguments on Designation**  
  *Claim*: The School’s fragments on pointing (指) and hardness-whiteness (堅白) commit it to kind-pluralism (e.g., "horse" and "white horse" denote distinct, irreducible kinds).  
  - **Yes** → **Leaf: Ontological Kind-Pluralism**  
    *Awkward commitment*: One must accept that "horse" and "white horse" are mutually exclusive kinds despite sharing all material instantiations.  
  - **No** → Proceed to Node (c).  

  **Node (c): Dialogue's Function**  
  *Claim*: The dialogue functions as a reductio of naive essentialism about kinds (e.g., exposing contradictions in assuming "horse" has a unified essence).  
  - **Yes** → **Leaf: Ontological Separation via Anti-Essentialism**  
    *Awkward commitment*: One must reject that objects belong to any stable kind-essence (e.g., "horseness" cannot ground identity).  
  - **No** → **Leaf: Aspect-Based Ontology**  
    *Awkward commitment*: One must accept that properties (e.g., whiteness, horseness) exist independently as "aspects," making objects mere sites of co-location.

  ---

  ### **Branch 2: Category Mismatch in Name-Mapping**  
  **Node (b): School's Arguments on Designation**  
  *Claim*: The School’s fragments on pointing and hardness-whiteness commit it to:  
  - **Kind-pluralism** → **Leaf: Kind-Pluralism without Ontological Separation**  
    *Awkward commitment*: One must affirm that "horse" and "white horse" are distinct kinds *only* at the level of naming, despite sharing identical referents.  
  - **Meta-linguistic theory of reference** → **Leaf: Nominal-Reference Mismatch View**  
    *Awkward commitment*: One must deny that compound terms can ever share referents with simple terms, even when materially co-extensive.  
  - **Neither** → Proceed to Node (c).  

  **Node (c): Dialogue's Function**  
  *Claim*: The dialogue functions as a reductio of naive essentialism about kinds.  
  - **Yes** → **Leaf: Sophistical-Rhetorical Interpretation**  
    *Awkward commitment*: One must dismiss the conclusion as purely dialectical (not truth-apt), rendering the dialogue a linguistic puzzle with no metaphysical implications.  
  - **No** → **Leaf: Strict Logical-Compositional Reading**  
    *Awkward commitment*: One must insist "a white horse is not a horse" is literally true because "white horse" logically selects a subset (white horses ≠ all horses).

  ---

  ### **Flagged Identical Paths**  
  - *No indistinguishable leaves*: All paths diverge via unique combinations of commitments.  
  - *Clarification*: "Ontological Kind-Pluralism" (Branch 1) and "Kind-Pluralism without Ontological Separation" (Branch 2) share Node (b)'s "kind-pluralism" but are separated by the root: the former requires ontological separation, the latter denies it.  

  ---

  ### **How to Use This Tree**  
  1. Start at the **root** and choose the claim that aligns with your interpretation of the conclusion.  
  2. At each **node**, select the claim that best reflects your view of the argument’s structure or the School’s doctrines.  
  3. Arrive at a **leaf** position and confront its "awkward commitment" to stress-test coherence.  

  This tree isolates interpretive decisions without relying on modern labels, using only commitments derivable from the text and correlated fragments (e.g., hardness-whiteness debates). It helps students articulate *why* they hold a view, not just *that* they hold it.
