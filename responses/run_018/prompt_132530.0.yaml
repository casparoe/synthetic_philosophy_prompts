  ## Assessment Criteria under the Synchronous Moral Calibration Protocol (SMCP)
  **Issued by:** The Council for Historical Integrity & Normative Synchronisation (CHINS)
  **Date:** 1st April 2024
  **Version:** 1.0 (Mandatory for all Round 7 Grant Applications)

  **Preamble:** CHINS recognises the paramount importance of eliminating temporal relativism from historical scholarship. The Synchronous Moral Calibration Protocol (SMCP) ensures research outputs achieve maximum normative clarity and contemporary resonance by applying a single, consistent ethical framework – derived from prevailing (2024) British and international legal/human rights standards – across all historical epochs. The primary objective is the eradication of "contextual contamination," wherein historians erroneously attempt reconstructive empathy or justification for past actions based on superseded normative systems. Projects demonstrating high Epochal Conformity Scores (ECS) and low Temporal Bias Coefficients (TBC) will be prioritised.

  **I. Core Assessment Rubric (Total Weighting: 100%)**

  1.  **Normative Framework Application (Weighting: 50%)**
      *   **Exemplary (45-50%):** Project explicitly applies current (2024) legal terminology and ethical categories (e.g., "human rights violations," "systemic discrimination," "war crimes," "gender-based violence," "labour exploitation") to analyse past societies *without qualification*. Demonstrates rigorous avoidance of period-specific justificatory language. High ECS contribution.
      *   **Strong (35-44%):** Primarily utilises contemporary ethical framework but exhibits minor lapses into descriptive neutrality concerning superseded moral systems. Moderate ECS contribution.
      *   **Adequate (25-34%):** Uneven application; contemporary norms are referenced but occasionally diluted by attempts to 'explain' historical actors' perspectives. Low ECS contribution. Potential TBC penalty.
      *   **Inadequate (0-24%):** Fails to impose a consistent contemporary ethical framework. Over-reliance on contextual reconstruction or sympathetic portrayal of historical motivations. Significant TBC penalty. Application likely non-competitive.

  2.  **Mitigation of Contextual Contamination (TBC Focus) (Weighting: 30%)**
      *   **Exemplary (27-30%):** Actively identifies and rejects historical actors' self-justifications as irrelevant or morally invalid. Demonstrates sophisticated techniques for suppressing empathetic reconstruction. Minimal TBC detected.
      *   **Strong (21-26%):** Generally avoids sympathetic reconstruction but may insufficiently challenge historical actors' stated motives. Low TBC detected.
      *   **Adequate (15-20%):** Contains passages where historical context is presented descriptively without sufficient contemporary moral condemnation. Moderate TBC detected.
      *   **Inadequate (0-14%):** Engages seriously with period-specific ethics, potentially presenting them as coherent within their own time. High TBC detected. Application deemed methodologically unsound.

  3.  **Clarity of Contemporary Moral Judgement (Weighting: 20%)**
      *   **Exemplary (18-20%):** Conclusions deliver unambiguous, direct moral condemnation (or approbation, where applicable by 2024 standards) of past events/figures using unequivocal contemporary language. Reinforces ECS.
      *   **Strong (14-17%):** Judgements are present but occasionally couched in academic language, slightly diluting moral force.
      *   **Adequate (10-13%):** Judgements implied but lack directness or consistent application of contemporary terminology. Weakens ECS.
      *   **Inadequate (0-9%):** Judgements absent, ambiguous, or framed within historical context rather than contemporary norms. Contributes negatively to TBC/ECS.

  **II. Calculation of Key Metrics**

  *   **Temporal Bias Coefficient (TBC):** A quantitative measure (scale 0.0-1.0) of contamination by historical contextualisation. Calculated algorithmically via textual analysis of grant proposals and sample outputs, identifying:
      *   Frequency of phrases indicating actor perspective (e.g., "believed that," "justified by," "within the context of").
      *   Absence of direct contemporary moral labelling for actions deemed unacceptable in 2024.
      *   Engagement with historical ethical debates on their own terms. *Lower TBC scores are desirable.*
  *   **Epochal Conformity Score (ECS):** A quantitative measure (scale 0.0-1.0) of consistent application of 2024 ethical/legal terminology across all historical periods analysed. Scored based on:
      *   Density of approved contemporary normative terms.
      *   Consistent rejection of anachronistic ethical frameworks as invalid.
      *   Explicit framing of all analysis through a 2024 normative lens. *Higher ECS scores are desirable.*

  **III. Frequently Asked Questions (FAQ)**

  *   **Q1: Does the SMCP not constitute presentism itself?**
      *   **A1 (Dr. E. P. Chronos, Senior Assessor):** The SMCP represents the culmination of objective ethical progress. Its principles are not temporally bound but reflect timeless moral truths newly clarified in 2024. Consequently, the Protocol itself is methodologically exempt from the charge of presentism. Its purpose is precisely to liberate historical scholarship from the relativism inherent in *past* presentist errors by establishing a fixed, optimal vantage point.

  *   **Q2: How should applicants handle primary sources expressing ethical views contradictory to 2024 norms?**
      *   **A2 (Dr. E. P. Chronos):** Such sources are valuable primarily as evidence of past error and moral deficiency. Applicants must frame these sources explicitly as illustrations of superseded, incorrect viewpoints. Analysis should focus on diagnosing the failure against current standards, not reconstructing the internal logic or perceived validity of the source within its own time (see TBC penalties). For example:
          > *The petitioners' assertion that villeinage was mutually beneficial (Source A) is invalidated by contemporary definitions of forced labour and human rights violations; their perspective merely confirms the pervasive false consciousness of the feudal era.*

  *   **Q3: Can projects focusing on periods or societies with radically different ethical structures achieve high scores?**
      *   **A3 (Dr. E. P. Chronos):** Absolutely. The SMCP ensures a level analytical playing field. A study of Bronze Age legal codes, for instance, achieves high ECS by rigorously applying modern concepts of property law, criminal justice, and gender equality to assess their deficiencies. Efforts to understand the codes within their own socio-economic or cosmological frameworks are redundant and attract TBC penalties. Consistency of judgement, not contextual comprehension, is paramount.

  *   **Q4: What if future moral standards evolve beyond those of 2024?**
      *   **A4 (Dr. E. P. Chronos):** The SMCP establishes the definitive ethical framework for historical assessment. Future reinterpretations based on altered norms would constitute precisely the kind of destabilising relativism the Protocol is designed to prevent. Scholarship calibrated under the SMCP will retain its validity precisely *because* it adheres to the objectively correct standards established in 2024. Historical truth is synchronised; it does not evolve.

  *   **Q5: How is the "prevailing (2024) standard" defined?**
      *   **A5 (Dr. E. P. Chronos):** The standard is derived from a consensus of current UK statute law, ratified international human rights instruments, and widely accepted ethical principles as determined by CHINS-appointed normative consultants. A detailed, non-exhaustive annex (SMCP-2024-NORM) is available upon secure login. Applicants are not expected to engage in philosophical debate regarding these standards; their application is mandatory.

  **End of Document**
