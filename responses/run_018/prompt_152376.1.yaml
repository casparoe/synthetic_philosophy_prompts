answer: |-
  Here's the spec for an adequate theory of moral aggregation in rescue cases, stripped to essentials:

  ### **Core Cases to Resolve**  
  1. **Basic 5 vs 1**: Save 5 strangers or 1 stranger?  
     *Why*: Tests whether numbers matter at all.  
  2. **Kin vs Strangers**: Save 5 strangers or 1 family member?  
     *Why*: Tests impartiality vs. personal ties.  
  3. **Escape Hatch**: Saving 5 requires actively destroying 1’s only escape route (killing them). Saving only the 1 requires no action.  
     *Why*: Distinguishes *allowing death* vs. *causing death* during aggregation.  

  ### **Non-Collapsible Distinctions**  
  1. **Statistical vs. Identified Lives**:  
     *Why*: Humans weight "known victims" (e.g., trapped miner) stronger than "statistical deaths" (e.g., policy affecting anonymous future people). A theory must explain this asymmetry without ad hoc fixes.  
  2. **Failing to Save (Inaction) vs. Actively Harming (Action)**:  
     *Why*: Moral intuitions treat killing (e.g., pushing someone off a lifeboat) as worse than letting die (e.g., not throwing a rope). Collapsing this risks justifying atrocities.  

  ### **Decision Theory Constraints**  
  **Must Satisfy**:  
  - **Independence of Irrelevant Alternatives (IIA)**:  
    *Why*: Adding a non-viable option (e.g., saving no one) shouldn’t change the choice between saving 5 vs. 1. Violations imply irrationality.  

  **Not Automatically Binding (Utilitarian Prejudices)**:  
  - **Transitivity of "Better Than"**: (If A > B and B > C, then A > C). *Why*: May fail in parity cases (e.g., saving A slightly better than B, but neither better than saving C).  
  - **Continuity**: (If A > B > C, some probability mix of A/C is as good as B). *Why*: Rejects incommensurability of lives.  

  ---

  ### **Theory-Wrecking Requirements**  
  **Escape Hatch + IIA**:  
  - Forces a choice: Saving 5 *requires killing* the 1. IIA demands consistency with 5vs1 where no killing occurs. Most theories (*including utilitarianism*) fail by conflating killing/letting die or ignoring IIA.  

  **Jointly Unsatisfiable Pair**:  
  - **Equal Concern for Each Person** + **Linear Aggregation** (saving N lives is N times better):  
    *Why*: In the escape hatch, equal concern forbids *killing* the 1 to save 5, but linear aggregation demands it. **Contradiction proven**.  

  ---

  ### **Theory Scoring**  
  | **Criterion**          | Taurek ("No Aggregation") | Utilitarianism | Coin Flip |  
  |-------------------------|---------------------------|----------------|-----------|  
  | **5 vs 1 (strangers)**  | FAIL (saves 1 or flips)   | PASS           | FAIL (saves 1 half the time) |  
  | **Kin vs Strangers**    | PASS (permits saving kin) | FAIL (must save strangers) | PASS (kin preference allowed) |  
  | **Escape Hatch**        | PASS (never kill the 1)   | **FATAL FLAW** (must kill the 1) | PASS (won't kill) |  
  | **Statistical vs Identified** | PASS (no aggregation) | FAIL (treats identical) | PASS (equality-focused) |  
  | **Killing vs Letting Die** | PASS (distinguishes) | FAIL (collapses) | PASS (no killing) |  
  | **IIA Compliance**      | PASS                      | PASS*          | FAIL (adding "save 0" option changes choice) |  
  | **Overall Viability**   | **Partial** (fails minimal beneficence) | **Broken** (escape hatch) | **Incoherent** (randomizes obvious rescues) |  

  **Utilitarianism's IIA***: Passes technically but at cost of collapsing killing/letting die.  
  **Key Takedown**: Escape hatch sinks aggregation that ignores the act/omission distinction. Taurek handles it but fails basic 5vs1. **No theory passes all**.  

  **Bottom Line**: Escape hatch + kinship + IIA jointly expose *all* simple theories as inadequate. Your hunch was correct: linear aggregation + equal concern is logically impossible when aggregation requires harming someone.
