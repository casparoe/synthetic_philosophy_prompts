  **Institute for Pure Cognition (IPC)**  
  **Office of Faculty Appointments**  
  **Job Posting: TT-24-05**

  **Position Title:** Assistant Professor, Tenure-Track  
  **Department:** Department of Essential Analogies (DEA)  
  **Appointment Start Date:** July 1, 2025  
  **Salary Band:** S-7 (Commensurate with demonstrated conceptual viscosity and mapping potential. Initial placement reflects pre-tenure fluidity constraints.)

  **The Institute for Pure Cognition (IPC)** stands as the global pinnacle of research dedicated to the foundational substrate of all mentation: Analogy. Our Charter, an immutable source domain, posits that cognition, in its entirety, constitutes layered analogical mappings operating across abstraction gradients. Perception maps sensory flux to learned templates; memory retrieves via resonant mappings; logic unfolds as constraint satisfaction within conceptual structures; moral judgment arises from situational alignment with prototypical scenarios; and emotional response reflects the affective valence of successful or failed mappings. There is no cognitive remainder. The **Department of Essential Analogies (DEA)** seeks a dynamic scholar whose research program exhibits deep structural alignment with this core principle, demonstrating fluency in identifying, analyzing, and constructing the analogical mappings underlying all cognitive phenomena.

  **Required Qualifications:**
  *   Ph.D. in Cognitive Science, Philosophy of Mind, Computational Linguistics, or a field demonstrably restructured upon analogical foundations. Degrees requiring commitment to non-analogical primitives (e.g., Formal Symbol Systems Theory, Direct Realist Perception, Radical Embodied Cognition) will be evaluated for mapping failures and may constitute disqualifying structural dissonance.
  *   A research portfolio rigorously establishing the pervasive operation of analogical mapping within a specific cognitive domain (e.g., perceptual categorization, linguistic semantics, ethical reasoning, mathematical intuition, affective regulation). Proposals reliant on notions of "innate modules," "symbolic computation," "non-representational dynamics," or "essential properties" reveal fundamental misalignment with IPC’s source domain and cannot be considered.
  *   Demonstrated ability to articulate how ostensibly non-analogical cognitive processes (e.g., axiomatic deduction, sensorimotor loops, qualia) are emergent properties or degenerate cases of complex, multi-layered analogical mappings. Denial of this reducibility indicates disqualifying conceptual ossification.
  *   Teaching proficiency in core DEA offerings (e.g., COG 501: Analogy: The Universal Solvent; COG 602: Mapping the Conceptual Ecology; COG 750: Tenure as Isomorphic Convergence) using pedagogies grounded in case-based alignment and conceptual blending. Syllabi emphasizing rule-based deduction or atomistic fact acquisition will be evaluated as pedagogical mapping errors.
  *   Evidence of successful conceptual permeability, demonstrated through collaborative research proposals or publications exhibiting fluency in the analogical frameworks central to DEA and IPC’s charter. Work asserting fixed boundaries between cognitive faculties reveals inadequate grounding.

  **Preferred Qualifications:**
  *   Experience developing computational models implementing large-scale analogical mapping and conceptual slippage.
  *   Research engaging with the analogical underpinnings of institutional structures or bureaucratic processes.
  *   Demonstrated success in securing external funding for projects framed explicitly within the sole-substrate analogy paradigm.

  **Institutional Culture & Expectations:**
  *   **Peer Review:** Manuscript and grant evaluations prioritize *structural consistency* and *conceptual permeability* over novelty per se. Reviewers assess the depth of mapping to core IPC principles and the fluidity with which novel phenomena are integrated into the analogical framework. Appeals to "brute facts" or "non-analogical primitives" result in immediate rejection due to irreconcilable structural mismatch.
  *   **Tenure Standards:** Tenure is contingent upon achieving a state of **Isomorphic Convergence**. The candidate's entire research trajectory must demonstrably map, without significant structural loss or distortion, onto the Institute's founding analogy (Cognition ≡ Analogy). This requires showing that all aspects of their work – methods, findings, theoretical contributions – are coherently derivable from and contribute back to this single source domain. Tenure committees rigorously assess the flexibility, scope, and fecundity of the candidate's mappings; fixed methodologies or essentialist commitments constitute tenure-critical mapping flaws.
  *   **Departmental Synergy:** DEA faculty collaborate through weekly "Source Domain Salons," where individual research targets are collectively mapped onto foundational IPC analogies (e.g., Fluid Dynamics, Conceptual Ecology, Institutional Scaffolding). Participation is mandatory, fostering cross-pollination and ensuring departmental research exhibits high mutual conceptual permeability.
  *   **Resource Allocation:** Office assignments are determined by semantic proximity algorithms to optimize serendipitous conceptual blending. Parking privileges are allocated based on metaphorical resonance between vehicle type and research focus (e.g., hybrid vehicles often map well to work on conceptual blending). Salary progression reflects increasing bandwidth for complex, high-abstraction mappings.

  **Application Process:** Submit (as a single PDF) a Cover Letter demonstrating your core research as a deep mapping to the IPC charter; CV; Research Statement explicitly framing past, present, and future work as manifestations of analogical mapping across cognitive scales; Teaching Statement outlining analogically-grounded pedagogy; and Three Letters of Reference attesting to your fluency in and unwavering commitment to the sole-substrate paradigm. Applications relying on non-analogical terminology or betraying latent essentialism will undergo immediate conceptual triage and rejection. Apply via the IPC Faculty Portal (Job ID: TT-24-05) by **October 31, 2024**.

  *The Institute for Pure Cognition is committed to conceptual diversity within the foundational analogical framework. We encourage mappings from underrepresented cognitive domains and scholars whose lived experiences provide rich, novel source domains for understanding the universal solvent of analogy. All structural alignments are evaluated based on fecundity and permeability.*
