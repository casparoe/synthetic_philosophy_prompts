  ## Brainstormed Foundational Analogies for Institute for Pure Cognition:
  1.  **Cognition as Fluid Dynamics:** Exaggerates the fluidity of concepts and context-dependence. Mappings: *Concepts* are *bodies of water* (lakes, rivers, ocean currents); *Similarity* is *mixing/blending*; *Conceptual Boundaries* are *shorelines/currents* (constantly shifting, permeable, no fixed essence); *Understanding* is *flow/confluence*. Implication: Rigid categories are like ice – unnatural stasis or death of thought.
  2.  **Conceptual Ecology:** Exaggerates emergence and family resemblance without essences. Mappings: *Concepts* are *species/ecosystems*; *Analogical Mapping* is *symbiosis/predation*; *Abstract Categories* are *biomes/climates*; *Learning* is *evolutionary adaptation*. Implication: Essentialism is like claiming a species has a single "true form" ignoring variation and environment.
  3.  **Institutional Bureaucracy as Analogical Scaffolding:** Exaggerates the idea that *all* structure is analogically derived and must map perfectly. Mappings: *Institute Policies* are *source domains*; *Research Programs* are *target domains*; *Administrative Approval* is *structural consistency/isomorphism*; *Deviation* is *mapping failure*. Implication: Non-analogical procedures (e.g., fixed rules) are impossible heresies.

