  **MID-ATLANTIC HERITAGE CONSORTIUM  
  ONTOLOGY REVIEW BOARD  
  DECISION MEMO: CASE 447-B (VESSELS A & B)**  
  **DATE:** [Current Date]  
  **STATUS:** FINAL RECOMMENDATION FOR CATALOGING  

  ### **I. Summary of Artifacts & Dispute**  
  Two ceramic vessels (Vessel A, Vessel B), circa 1920s, physically identical in dimensions, glaze chemistry, wear patterns, and weight distribution. Each contains a permanently sealed internal cavity. Scans are impossible without destruction, and maker’s notes are lost. Ambiguous correspondence suggests two possibilities:  
  1. **Distributed Ritual Set Hypothesis:** Cavities contain tokens marking A and B as nodes of a single distributed artifact.  
  2. **Independent Replica Hypothesis:** Cavities contain tokens marking each vessel as a standalone replica.  
  The Board cannot resolve which hypothesis is true.  

  ### **II. Core Philosophical Dilemma**  
  - **Faction 1 (Ontology Tracks Reality):** The vessels’ true status (one distributed object vs. two objects) exists independently of our knowledge. Cataloging must preserve both possibilities to avoid misrepresenting reality.  
  - **Faction 2 (Ontology Tracks Practical Verification):** Institutional ontology requires observable, verifiable properties to support loans, insurance, and conservation. Speculative links risk administrative chaos if unverifiable.  

  ### **III. Board Recommendation**  
  **Catalog Vessel A and Vessel B as distinct, independent entries, with mandatory reciprocal metadata linking them as a *potential* distributed set under specific conditions.**  

  #### **Cataloging Protocol**  
  1. **Assign separate catalog numbers** (e.g., MAHC.1920.447B.A, MAHC.1920.447B.B).  
  2. **Embed reciprocal metadata fields in both entries:**  
     - *"Potential link to distributed set: MAHC.1920.447B.A / MAHC.1920.447B.B. Physical unity cannot be verified; link is conjectural based on ambiguous correspondence (Ref: MAHC/Archive/Box27-F18)."*  
     - *"All conservation, loan, and insurance protocols treat these as physically independent objects unless new evidence emerges."*  
  3. **Insurance & Loans:** Value and insure as individual objects. Loan agreements must include both vessels if transferred together.  
  4. **Conservation:** Treat as separate entities. No joint conservation procedures.  
  5. **Review Trigger:** Reassess classification if **non-destructive internal scanning technology** becomes available before **January 2030**. If no such technology emerges by 2030, metadata remains permanent.  

  ---

  ### **IV. Reasoning & Engagement with Ontological Concerns**  

  #### **Why Not Catalog as a Single Distributed Entity?**  
  *Strongest Argument for Faction 1 (Reality-Tracking):*  
  If A and B *are* parts of one distributed ritual object, cataloging them separately administratively "shatters" a unified ontological entity. This risks ethical and scholarly misrepresentation by fragmenting cultural intent.  

  *Why This Falls Short:*  
  Institutional ontology requires **operational verifiability**. Without access to the cavities:  
  - Loans, insurance, and conservation demand clear accountability for discrete physical objects.  
  - A "distributed set" classification would impose unenforceable obligations (e.g., requiring institutions to loan/display both; complicating insurance claims if one is damaged).  
  - **Mitigation:** Reciprocal metadata preserves the *possibility* of unity without granting it operational status.  

  #### **Why Not Suspend Classification?**  
  *Strongest Argument for Epistemic Caution:*  
  Suspension acknowledges our ignorance and avoids premature commitment.  

  *Why This Falls Short:*  
  - **Practical paralysis:** Curators need clear directives for daily management (e.g., storage, photography, accession numbers).  
  - **Mitigation:** Our solution explicitly documents uncertainty while enabling action.  

  #### **Why Independent Entries with Conditional Links?**  
  1. **Honors Epistemic Limits:** We cannot verify the distributed-set hypothesis, so we default to observable reality: two physically distinct objects.  
  2. **Preserves Ontological Possibility:** Metadata ensures the distributed hypothesis remains searchable, researchable, and revisable.  
  3. **Ensures Accountability:** Loans, conservation, and insurance attach cleanly to individual vessels.  
  4. **Future-Proofs:** Review trigger aligns with technological advancement without indefinite limbo.  

  ---

  ### **V. Directives for Curators**  
  - **Immediate Action:**  
    - Create two catalog entries with reciprocal metadata (see §III.2).  
    - Use standard conservation protocols **for individual ceramics**.  
    - Insure separately at identical valuations based on observable properties.  
  - **Ongoing Obligations:**  
    - Mention the distributed-set hypothesis in gallery text/digital records if exhibited.  
    - If loaning one vessel, include metadata in loan agreement.  
  - **Review Timeline:**  
    - Re-evaluate by **January 2030** if non-destructive scanning advances.  
    - If no advances, maintain current classification indefinitely.  

  ### **VI. Conclusion**  
  Ontology must balance truth-aptness with institutional responsibility. By cataloging Vessels A and B as distinct entities linked by documented conjecture, we respect both the inaccessible reality and the practical demands of stewardship. This ensures scholarly integrity while preventing administrative fragility.  

  **APPROVED FOR CIRCULATION:**  
  [Chair’s Signature]  
  Ontology Review Board, Mid-Atlantic Heritage Consortium  

  ---  
  *Note: Case number confirmed as 447-B per Chair’s directive.*
