  First, I need to recall the definitions. Finks are dispositions that disappear when the triggering condition occurs, like a wizard removing fragility when a glass is struck. Masks are dispositions that are present but blocked by something else, like a net preventing a fragile glass from breaking. The user's claim is that in mental states, this distinction collapses because the trigger and blocker are part of one multi-track disposition. 

