answer: |-
  *Adjusting my habit and speaking with measured gravity, quill hovering over parchment as if recording the objection*  

  **First, let us distinguish the elements that must change for my verdict to alter:**  
  1. **Legitimacy of Title:** This ruler holds *dominium* by just acquisition (inheritance, election, or divine ordinance). This is foundational. Were he a *tyrannus ab titulo* (usurper), resistance could be licit under the stated conditions. Here, he is not.  
  2. **Scale and Manifest Tyranny:** The harms, though cumulative, lack a *singular act of manifest injustice* (e.g., mass slaughter, overt sacrilege). For resistance to be conceivable, the tyranny must be *evident and intolerable in its individual acts*, not merely in aggregate.  
  3. **Legal Authorization:** The ruler acts under color of law. This complicates but does not negate his legitimacy. Were he to *openly defy law and reason* (e.g., commanding idolatry), the case would shift.  

  **Where my reasoning is most vulnerable:**  
  In conceding that *gradual, legally veiled oppression*—lacking a stark, instant violation of natural law—may evade the conditions for licit resistance, even when the outcome is catastrophic. This risks reducing tyranny to a mere arithmetic calculus, potentially ignoring the *substance* of justice. Yet I maintain this vulnerability is necessary to prevent anarchic pretexts.  

  **Now, to your case:**  
  However grievous the aggregate outcome, the prohibition against private removal remains absolute. Consider the principles:  

  1. **Legitimacy binds subjects to obedience.** As Romans 13:2 teaches, "*Whosoever therefore resisteth the power, resisteth the ordinance of God.*" A ruler with just title, though governing badly, retains the *auctoritas* of his office. Private judgment cannot licitly overthrow divine ordinance.  

  2. **Tyranny *ab exercitio* does not nullify title.** A physician who errs gravely remains a physician; so too a prince who rules unjustly remains a prince. His vice is a *malum exercitii*, not a *defectus tituli*. Resistance is reserved for the latter case alone.  

  3. **Aggregation does not transform the moral species.** Each act, being *legally sanctioned and slight in itself*, is akin to a physician administering a mild but cumulatively lethal remedy: the error is material, but not formal tyranny manifest in a single deed (e.g., ordering an innocent’s execution without trial). The temporal distribution obscures the *intentio tyrannica* required to justify extraordinary action.  

  4. **The absence of a superior judge does not confer jurisdiction on inferiors.** When no earthly superior exists (e.g., Pope or Emperor), the remedy is *patient endurance* and prayer—not steel. As I wrote in *De Regno*, God may punish such rulers by sudden death or foreign invasion, but never by the hand of a subject.  

  **Therefore:**  
  Even this slow devastation—though a profound evil—does not permit private persons to kill their ruler. To concede otherwise would unleash endless sedition under the pretext of aggregated harms. The ruler’s legitimacy, not his virtue, is the sine qua non of his inviolability.  

  *Closing the Summa on the desk with finality*  
  I concede only this: were *any single act* intrinsically and gravely unjust (e.g., commanding blasphemy), it must be disobeyed—but never answered with violence. In all else, endure.
