prompt: |-
  I'm a journalist covering science and ideas, and I'm writing a sidebar for a long piece on political polarization. I want a "which epistemic trap are you actually in?" quiz that readers can take in a few minutes. The catch: everyone I talk to calls everything an echo chamber, but I want the quiz built on the distinction that they're not the same thing -- a filter bubble leaves things out passively (you just never encounter the other side), while an echo chamber actively discredits outsiders in advance (you hear them, but you've already been given reasons not to trust them). So the diagnostic questions have to pry those apart with concrete scenarios, not by asking people which label they prefer.

  Please give me 8-10 questions, each a recognizable everyday situation (how you react when a relative shares an article from an outlet you distrust, what happens when a source you trust gets something badly wrong, whether you can name a person whose politics you disagree with but whose judgment you'd still take seriously, etc.), each with 2-3 answer options. Then a scoring key mapping answer patterns onto at least these leaves: classic filter bubble, echo chamber (the active-discrediting kind), a healthy high-trust-but-open network that should NOT come out looking pathological, and an "actually fine, just politically interested" leaf. Flag any two leaves your quiz can't reliably separate, and note any combination of answers that would land someone in an unoccupied spot in the space (and whether that spot is empty because it's incoherent or just rare).

  Format it in this order: "The questions" (bulk of it, maybe 400 words), "Scoring key" (~150 words), "Where this gets shaky" (~100 words). In that last section, say how confident you are that the question-to-position mappings actually track the real distinction, and single out the one question or leaf you're least sure about -- I'd rather cut it than run something misleading.
reasoning: |-
  Okay, the user is a journalist covering science and ideas, working on a sidebar about political polarization. They want a quiz to help readers identify if they're in a filter bubble, an echo chamber, or a healthy network, without using the labels directly. The key challenge is distinguishing between filter bubbles (passive omission) and echo chambers (active discrediting). 

  First, I need to design concrete scenarios that tease apart these concepts. For example, reactions to distrusted news sources or trusted sources making errors could reveal if someone dismisses information actively or just avoids it. Questions about engaging with opposing views or credibility assessments of critics will help differentiate echo chambers from filter bubbles.

  The user emphasized avoiding abstract labels, so each question must present relatable situations. Including a "healthy network" category is crucial to avoid pathologizing normal political engagement. I should also consider edge cases where answers don't fit neatly—like someone who avoids opposing views but doesn't discredit them actively. 

  For the scoring, answer patterns need clear mapping. Echo chamber answers will show active distrust (e.g., "They're biased liars"), while filter bubble answers indicate avoidance (e.g., "I scroll past"). Healthy network answers should demonstrate openness ("I check their sources") or balanced judgment ("I consider their argument"). 

  I'm a bit unsure about Question 9 (naming a respected critic). It might not reliably separate filter bubbles from echo chambers since both might struggle to name someone, but it's key for identifying healthy networks. Maybe note this in the shaky section. 

  Also, the "just politically interested" category risks overlapping with healthy networks. Clear distinctions: healthy networks engage critically but openly, while "just interested" may consume diverse media without deep engagement. Need to ensure scoring reflects this through questions about sharing content or fact-checking habits. 

  Finally, the unoccupied spot—someone who actively discredits outsiders but seeks out opposing views—might be incoherent. If you discredit in advance, why seek them out? That combination should be rare or contradictory. The quiz should flag such answers as likely echo chambers with some openness, but still pathological.
answer: |-
  ## The Questions (8 Questions)

  1.  **When a relative shares a political article from a news outlet you *deeply distrust* on social media, you usually:**
      *   a) Scroll past it quickly; you know it's probably nonsense and engaging isn't worth your time. (*Avoidance*)
      *   b) Feel annoyed and might comment explaining why the source is biased/untrustworthy, or share a counter-article from your trusted source. (*Active Discrediting*)
      *   c) Read it carefully to understand their perspective, even if skeptical, and might fact-check a claim or ask them a question about it. (*Engaged Skepticism*)

  2.  **A news source/journalist you *usually trust and respect* gets a major fact demonstrably wrong in a way that favors "your side." You:**
      *   a) Didn't see the error; your feeds or alerts didn't highlight it. (*Passive Omission*)
      *   b) Assume it's just a rare mistake or that the *intent* was correct; the other side does much worse constantly. (*Defensive Dismissal*)
      *   c) Notice it, feel disappointed, and it makes you slightly more cautious about that source going forward. (*Critical Awareness*)

  3.  **How often do you *intentionally* seek out news or analysis from sources known for having a perspective significantly different from your own?**
      *   a) Rarely or never; it feels pointless, frustrating, or like giving them attention they don't deserve. (*Avoidance/Disengagement*)
      *   b) Occasionally, but mainly to see "what nonsense they're peddling now" or to gather ammunition against their arguments. (*Motivated by Discrediting*)
      *   c) Regularly; understanding different viewpoints, even flawed ones, seems important for being informed. (*Active Seeking*)

  4.  **When someone you disagree with politically presents a statistic or study supporting their view, your first instinct is often to:**
      *   a) Dismiss it without looking; you assume it's cherry-picked or from a bad source. (*Pre-emptive Rejection*)
      *   b) Look for flaws in the source, methodology, or how it's framed to discredit it. (*Motivated Skepticism*)
      *   c) Examine the data/study itself if possible, consider the context, and see if it holds up regardless of who cited it. (*Evidence-First*)

  5.  **Think about your main social media feed or news aggregator. How often do you see *substantive* posts/articles *favorably* presenting views you strongly disagree with?**
      *   a) Almost never; my feed is pretty aligned with my views. (*Algorithmic Isolation*)
      *   b) Occasionally, but they're usually shared by critics mocking them or presented with strong counter-arguments immediately. (*Framed as Threat/Folly*)
      *   c) Fairly often; I follow or the algorithm shows me some thoughtful people/outlets from different perspectives. (*Exposure to Opposition*)

  6.  **Can you name a *specific person* (e.g., columnist, commentator, academic, politician) whose core political views you *strongly disagree with* on major issues, but whose analysis, intelligence, or judgment on *certain topics* (maybe not politics) you still genuinely respect and might even seek out?**
      *   a) No, I can't think of anyone like that. (*Dismissal of All Opposition*)
      *   b) Maybe one or two, but only on *very* narrow, non-political topics. (*Highly Limited Respect*)
      *   c) Yes, several readily come to mind. (*Cross-Ideological Respect*)

  7.  **When you encounter a complex political issue with valid points on multiple sides, how do you typically form your final opinion?**
      *   a) I see which position aligns with my trusted sources/community; they've vetted it. (*Deference to In-Group*)
      *   b) I look for flaws in the opposing arguments; the side with the weakest counter-arguments must be right. (*Focused on Discrediting Out-Group*)
      *   c) I weigh the evidence and reasoning for each perspective myself, even if it's uncomfortable, and may end up with a nuanced view. (*Independent Evaluation*)

  8.  **A friend shares a personal story about how a policy you support negatively impacted them. You:**
      *   a) Assume their experience is an outlier or misattributed; the data shows the policy works overall. (*Dismissing Anecdotal Challenge*)
      *   b) Feel sympathy for them personally but believe the bigger picture/your sources justify the policy; maybe they were misinformed. (*Compartmentalization*)
      *   c) Listen carefully; their experience adds important context, even if it doesn't change the overall policy calculus, and makes you think harder about implementation. (*Integrating Lived Experience*)

  ---

  ## Scoring Key

  *   **Tally your answers:** Count how many times you chose **a)**, **b)**, or **c)**.
  *   **Identify your dominant pattern:**
      *   **Mostly a): Classic Filter Bubble.** Your information diet passively omits challenging views. You likely encounter opposing arguments infrequently and superficially, if at all. The "other side" feels distant or irrelevant, not because you've rejected it, but because you rarely bump into it meaningfully.
      *   **Mostly b): Echo Chamber.** You frequently encounter opposing views, but your primary lens is to actively discredit the *source* or *motivation* behind them. Outsiders are framed as biased, dishonest, or foolish in advance, making their arguments easy to dismiss without serious engagement. Trust is highly concentrated within your ideological in-group.
      *   **Mostly c): Healthy High-Trust-but-Open Network.** You actively engage with diverse perspectives while maintaining critical thinking. You trust specific sources based on track records but remain open to evidence and critique, even from unexpected places. You can respect individuals across ideological lines. This is the antidote to polarization, not a pathology.
      *   **Mixed a/b (especially avoiding *and* discrediting): Echo Chamber Leaning.** You exhibit elements of both avoidance and active discrediting. You likely dismiss outsiders readily when you do encounter them.
      *   **Mixed a/c (avoiding but open when encountered) OR Mixed b/c (discrediting but actively seeking):** This lands you in the **"Actually Fine, Just Politically Interested"** leaf. You're engaged and have preferences, but haven't fully walled yourself off intellectually. You might avoid some noise (a) but engage seriously when you do (c), or you might be skeptical/hostile (b) but still proactively seek understanding (c) – showing intellectual curiosity despite friction. You likely have some cross-cutting respect (Q6 c).

  ---

  ## Where This Gets Shaky

  *   **Confidence in Core Distinction:** Moderately high. The questions *aim* to isolate passive omission (a-answers) vs. active discrediting (b-answers) through concrete scenarios (avoidance vs. motivated criticism, lack of exposure vs. hostile framing). Q1, Q3, Q4, Q5, and Q7 are particularly key here.
  *   **Least Sure Question:** **Question 8 (Personal Story).** While it probes empathy and integration of challenging info, it's less *directly* tied to the core filter/echo *information* distinction than the others. A high-trust open person (c) should answer 'c', but an echo chamber person might give 'b' (compartmentalizing) or even 'a' (dismissing), and a filter bubble person might rarely encounter such stories at all. Its mapping is fuzzier. **Recommendation:** Consider cutting Q8 if space is tight or the distinction feels muddy.
  *   **Hard-to-Separate Leaves:** The quiz struggles to perfectly differentiate the **"Healthy Network"** from the **"Actually Fine, Just Politically Interested"** leaf. Someone scoring mostly 'c' is clearly healthy. Someone with a mix of 'a' and 'c' (e.g., avoids some noise but engages deeply when they choose to) or 'b' and 'c' (skeptical but seeks out opposition) falls into "Actually Fine." The line between "healthy openness" and "engaged but not perfectly open" is subtle and context-dependent.
  *   **Unoccupied Spot & Why:** A profile dominated by **actively seeking out opposing views (Q3 c) *while* consistently pre-emptively discrediting them without examination (Q4 a)** seems incoherent. Why seek views you automatically dismiss? This combination should be rare and likely indicates someone scoring highly on *both* 'b' and 'c' answers (Echo Chamber tendencies but with intellectual curiosity), landing them in "Actually Fine" or leaning Echo Chamber, not a distinct category. The spot defined *only* by seeking + automatic dismissal is empty because the behaviors conflict.
