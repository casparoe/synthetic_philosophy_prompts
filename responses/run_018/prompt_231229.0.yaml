  Below is a structured classroom activity designed to address your goals. The game uses tokens and real stakes (candy) to demonstrate the money-pump phenomenon while leaving room for your friend’s objection during the debrief. It runs in 75 minutes, with 14 students.

  ---

  ### **Game Overview: The Fruit Trader Challenge**
  **Core Idea**: Participants are assigned cyclic preferences for three fruits (Apple, Banana, Cherry) and start with one fruit + tokens. A designated trader (you) exploits their preferences through sequential trades, pumping tokens from them until they end up with their original fruit but fewer tokens. The goal is to make students *feel* the net loss before discussing its implications.

  **Stakes**:  
  - Each token = 1 piece of candy (or 1 point toward candy).  
  - Each fruit = 0 candy (only tokens matter). This ensures trades are driven solely by preferences, not intrinsic value.  

  **Preferences**:  
  All students receive the **same preference card** defining a cycle:  
  - *"You prefer Apple to Banana.  
  You prefer Banana to Cherry.  
  You prefer Cherry to Apple."*  
  This ensures everyone is vulnerable to pumping.  

  **Why this works**:  
  - Preferences are cyclic but not immediately obvious (students focus on pairwise choices).  
  - Fruits have no candy value, so tokens are the only source of "gain."  
  - The trader extracts tokens by offering "upgrades" based on their preferences.  

  ---

  ### **Roles and Rules**  
  1. **Participants (13 students)**:  
     - Start with:  
       - 1 random fruit (4 get Apple, 5 get Banana, 4 get Cherry).  
       - 3 tokens (each redeemable for 1 candy).  
     - **Rules for trading**:  
       - Must accept any trade where they receive a fruit they prefer over their current one (enforces preference cycle).  
       - Must pay 1 token to the trader for each trade.  
       - No trading with other students (only with the trader).  

  2. **Trader (You, the instructor)**:  
     - Start with unlimited fruits and 0 tokens.  
     - **Pumping strategy**: Approach students in sequence and offer trades that follow the cycle:  
       - **If a student has Apple**: Offer Cherry (preferred over Apple).  
       - **If a student has Cherry**: Offer Banana (preferred over Cherry).  
       - **If a student has Banana**: Offer Apple (preferred over Banana).  
     - Charge 1 token per trade.  
     - **Goal**: Pump each student through all 3 trades (Apple → Cherry → Banana → Apple) to return them to their start fruit, minus 3 tokens.  

  3. **Banker (1 student volunteer)**:  
     - Tracks tokens traded (ensures transparency).  
     - Announces remaining tokens after each trade.  

  ---

  ### **Timeline (75 Minutes Total)**  
  | **Phase**          | **Time** | **Activity** |  
  |---------------------|----------|--------------|  
  | **Setup (10 min)**  | 0-10     | - Assign roles: 13 participants, 1 banker. Randomly distribute fruits and 3 tokens per participant.  
  |                     |          | - Hand out preference cards. Read aloud: *"These are your fixed preferences. You MUST trade if offered a fruit you prefer. Each trade costs 1 token."*  
  |                     |          | - **Do NOT mention money-pumps, intransitivity, or rationality.** Simply say: *"Maximize your candy by trading wisely."* |  
  | **Trading (25 min)** | 10-35   | - **Round 1 (10 min)**: Trader (you) approaches **Apple-holders**. Offer Cherry for Apple + 1 token. Enforce acceptance (per rules).  
  |                     |          | - **Round 2 (10 min)**: Trader approaches **Cherry-holders** (including those who just traded). Offer Banana for Cherry + 1 token.  
  |                     |          | - **Round 3 (5 min)**: Trader approaches **Banana-holders**. Offer Apple for Banana + 1 token.  
  |                     |          | - **Key**: Move quickly. Pump 3-4 students per round. Banker records token losses. |  
  | **Settlement (5 min)** | 35-40   | - Students count tokens. Most have 0 tokens and original fruit (net loss: 3 tokens).  
  |                     |          | - Banker announces: *"Total tokens collected: 39"* (13 students × 3 tokens). Distribute candy: 0-1 piece per student (most get 0). |  
  | **Debrief (35 min)** | 40-75   | **Part 1: What Happened? (10 min)**  
  |                     |          | - Ask: *"How many ended up with their original fruit? How many lost tokens?"*  
  |                     |          | - Plot the cycle on the board:  
  |                     |          |   ```  
  |                     |          |   Apple → (pay) → Cherry → (pay) → Banana → (pay) → Apple  
  |                     |          |   ```  
  |                     |          | - Highlight: *"You paid to get a 'better' fruit each time, but ended up back where you started, poorer."*  
  |                     |          | **Part 2: Exploitability vs. Irrationality (20 min)**  
  |                     |          | - **Question 1**: *"Was each trade rational? Why?"*  
  |                     |          |   - Students will say: *"Yes, I followed my preferences."*  
  |                     |          | - **Question 2**: *"So why was the outcome bad?"*  
  |                     |          |   - Guide them: *"The net result was a loss, but no single trade caused it."*  
  |                     |          | - **Question 3**: *"Does this prove your preferences were irrational? Or just that they made you exploitable?"*  
  |                     |          |   - Introduce your friend’s objection: *"All we showed is that a clever trader can exploit you. Does that mean your preferences were incoherent? Or is exploitability a separate issue?"*  
  |                     |          | - **Group activity (10 min)**: Split into 3 groups. Assign:  
  |                     |          |   - Group 1: Defend *"This proves preferences are irrational."*  
  |                     |          |   - Group 2: Defend *"This only shows exploitability."*  
  |                     |          |   - Group 3: Propose *"How to avoid this without changing preferences?"* (e.g., refusing trades).  
  |                     |          | **Part 3: Philosophical Gap (5 min)**  
  |                     |          | - Conclude: *"The game shows you can be pumped if you act on cyclic preferences naively. But it doesn’t prove the preferences themselves are incoherent—only that they’re dangerous in a world with traders. You might refuse trades, but then you’re ignoring your own preferences. That’s the deeper tension."*  

  ---

  ### **Predictable Problems & Solutions**  
  1. **Students refuse to trade**:  
     - **Why**: They suspect a trap or treat it as a joke.  
     - **Solution**: Enforce the "must trade if preferred" rule strictly. If they resist, say: *"Your preferences compel this trade. Refusing violates the game rules."* Use peer pressure ("Group grade impact!").  

  2. **Students treat it as a joke**:  
     - **Why**: Low stakes (candy) feel trivial.  
     - **Solution**:  
       - Start with anonymous voting: *"Raise hands if you care about candy."* Use peer buy-in.  
       - In debrief, reframe: *"Replace candy with $100. Would you feel exploited now?"*  

  3. **Not all students get pumped**:  
     - **Why**: Time limits or uneven participation.  
     - **Solution**: Prioritize pumping 8–10 students visibly. In debrief, say: *"Imagine if we continued—you’d all lose tokens."*  

  4. **Banker errors or confusion**:  
     - **Why**: Token-tracking is messy.  
     - **Solution**: Use a public tally sheet (whiteboard). Banker only records; you handle trades.  

  ---

  ### **What the Activity Cannot Reproduce**  
  **The Gap**: The game *assumes* students act myopically on each pairwise preference without foresight. In reality, rationality debates often hinge on whether agents can **foresee and avoid cycles** (e.g., by using "precommitment" to refuse trades). The game cannot show that preferences are inherently incoherent—only that they lead to losses when exploited.  

  **What You Must Supply in Discussion**:  
  - *"The money-pump argument aims to prove that cyclic preferences are irrational because they force you into a losing cycle. But your friend might say: ‘Smart agents could avoid the pump by spotting the cycle and refusing trades.’ So is the flaw in the preferences or the agent’s myopia? That’s where philosophy starts."*  
  - Provide a real example: *"Imagine preferring job A to B, B to C, and C to A. A recruiter could ‘pump’ you into quitting repeatedly for a fee. Does that mean your preferences are broken, or just that recruiters are sneaky?"*  

  This activity makes the money-pump visceral, then uses debriefing to isolate exploitability from irrationality—arming you to confront your friend’s objection. Students leave hungry (for candy and answers).
