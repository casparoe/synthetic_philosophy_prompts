answer: |-
  ## Research Proposal: Preemptive Structural Omission and the Killing/Letting Die Distinction

  **1. Title:** Configuring Harm: Preemptive Structural Omission and the Blurring of Killing vs. Letting Die in Automated Systems.

  **2. Research Question:** Does the standard philosophical distinction between killing (a positive act causing death) and letting die (an omission allowing death) adequately categorize the moral status of *preemptive structural omission*, where a designer intentionally configures an automated resource-allocation system whose ordinary, foreseeable operation will, with statistical certainty, fail to deliver life-saving aid to a defined subset of future users, resulting in their deaths, without the designer performing any direct physical act upon those victims? Specifically, does this constitute killing, letting die, or a distinct third category?

  **3. Framing for a Determinate Answer:** The question is framed to avoid contextual relativism ("it depends") by focusing on the *core structural features* of the agent's intervention and the system's causal pathway:
      *   **Preemptive Design:** The harmful outcome is determined *before* any specific victim exists or any concrete omission occurs in real-time.
      *   **Structural Configuration:** The harm mechanism is embedded in the *rules and architecture* of the system, not in a specific omission *by an agent* at the time of need.
      *   **Statistical Certainty:** The protocol *guarantees* (probabilistically) that a defined group *will* be denied aid and die as a result. It's not mere risk or possibility.
      *   **Absence of Direct Intervention:** Death occurs solely through the system's autonomous operation denying resources; no direct physical act by the designer on victims.
  The determinate answer will classify the *paradigmatic case* defined by these features.

  **4. Problem: Why Existing Frameworks Leave This Unresolved**
  Standard analyses of killing vs. letting die implicitly rely on assumptions challenged by preemptive structural omission:
      *   **Bodily Proximity & Direct Causation:** Traditional distinctions (e.g., Quinn's "harmful direct intervention," Foot's "positive agency") emphasize the agent's direct physical interaction or immediate causal chain originating in their body. Here, harm is radically indirect, mediated by complex systems and probabilistic outcomes over time. The designer's "act" (coding/configuring) is spatially and temporally distant from the deaths.
      *   **Omission as Passive Non-Intervention:** "Letting die" typically involves an agent *failing* to intervene in an *ongoing* threat they *could* prevent *at that moment* (e.g., not throwing a rope). Preemptive structural omission involves an *active configuration act* that *creates the lethal condition* well in advance. The "omission" is not *the designer's* omission at the time of death; it's *the system's* programmed behavior. The designer cannot "omit" later; the die is cast.
      *   **Counterfactual Dependence:** Both killing and letting die often hinge on whether the victim would have lived *but for* the agent's specific act/omission. Here, *but for* the designer's configuration, the system wouldn't exist to deny aid, *and* the victims might have had access via a different system. This points towards causal responsibility but doesn't cleanly fit "direct killing."
      *   **Agency & Control:** Frameworks like Fischer & Ravizza's "guidance control" focus on an agent's *current* control over an outcome. The designer loses direct control once the system is deployed, yet the harm is a designed-in feature they initiated and foresaw.

  **5. Proposed Analytical Method: Counterfactual Control & Status Quo Alteration**
  I will analyze preemptive structural omission through the lens of **Counterfactual Control** and **Status Quo Alteration**, arguing this provides the most decisive framework:
      *   **Core Thesis:** What distinguishes killing from letting die is not merely directness or bodily involvement, but the nature of the agent's intervention relative to the victim's baseline prospects and the agent's control over the lethal sequence. Killing involves *initiating* or *sustaining* a lethal sequence the victim would otherwise have avoided. Letting die involves *failing to interrupt* a pre-existing lethal sequence the victim was already facing.
      *   **Applying to Preemptive Structural Omission:**
          *   **Counterfactual Baseline:** What was the victim's statistical chance of survival *before* the system was designed/deployed? (e.g., access to *some* aid system).
          *   **Agent's Action:** The designer's configuration *actively alters the status quo* by creating a *new* structure that introduces a *guaranteed pathway to death* for a defined group. They don't just fail to help; they build a trap.
          *   **Control Over the Sequence:** The designer exercises *preemptive control* – they set the lethal sequence in motion with foresight. The system's operation is the execution of *their designed plan*. They don't "omit" later; they *completed the harmful action* at the design stage.
      *   **Why this over alternatives?**
          *   *Causal Contribution:* While strong (the designer is a but-for cause), pure causation struggles to differentiate *kinds* of causation (direct vs. indirect, initiating vs. enabling) crucial for the moral distinction. It risks collapsing all necessary causes into "killing."
          *   *Normative Institutional Roles:* This is important for *blame* and *duty* but less so for the *fundamental nature of the harm*. A doctor designing a lethal triage AI might have stronger duties than a corporate engineer, but does that change whether the *act itself* is killing or letting die? This angle is better suited for subsequent responsibility assignment, not the initial classification.
          *   **Counterfactual Control/Status Quo excels** because it directly addresses the core puzzle: the designer *initiates a new lethal threat* through their active configuration, fundamentally altering the victims' baseline prospects from potentially survivable to certainly fatal. This aligns more closely with the *initiation* characteristic of killing than the *failure to interrupt* characteristic of letting die.

  **6. Desired Outcome & Success/Failure Criteria:**
      *   **Success:** A clear, principled criterion derived from Counterfactual Control/Status Quo Alteration that definitively classifies the paradigmatic case of preemptive structural omission (e.g., "Constitutes killing because the designer actively creates a new, guaranteed lethal mechanism that alters the victims' baseline survival prospects from positive to certain death, exercising preemptive control over the outcome"). This criterion should:
          *   Provide clear guidance for ethical evaluation and regulatory frameworks (e.g., designing such protocols should face the stringent justificatory burden typically applied to killing, not the weaker one for letting die).
          *   Explain why the standard bodily proximity/directness models fail here and why counterfactual control is superior.
          *   Demonstrate applicability to concrete examples (e.g., algorithmic healthcare rationing, autonomous vehicle "triage" protocols).
      *   **Failure:** The project fails if it only demonstrates that intuitions conflict without resolution, or if the proposed criterion cannot be defended against significant counter-arguments, or if the analysis collapses back into "it depends" on unspecified contextual factors beyond the core structural features. Failure also includes being unable to distinguish the case clearly from adjacent concepts like creating dangerous conditions or bad Samaritan laws.

  **7. Scope Risk: The Ambition Trap**
  The most significant scope risk is the **need for a robust theory of mediated agency and causal chains in complex systems.** Preemptive structural omission sits at the intersection of individual responsibility, collective agency, and the metaphysics of causation in designed artifacts. Fully resolving whether the designer "kills" through the system might require delving deeply into:
      *   The conditions under which an outcome can be attributed *directly* to an upstream designer rather than the system itself or operators.
      *   The nature of "foresight with statistical certainty" as equivalent to intention for complex outcomes.
      *   How "altering the status quo" is defined against a background of existing institutions and potential alternatives.
  Addressing these fully could necessitate a dissertation, not a semester paper. **Mitigation Strategy:** I will explicitly bracket the deepest metaphysical questions of collective agency and focus narrowly on the *moral classification relative to the established killing/letting die dyad*, using the counterfactual control framework as a practical tool for ethical and regulatory guidance. I will acknowledge but not exhaustively resolve the underlying metaphysical complexities.

  **8. Assessment of Your Framing & Least Certain Point**
  *   **Confidence in Framing:** Your framing is **highly effective and insightful (8/10 confidence).** It isolates a genuinely novel and pressing problem arising from modern technology and institutional design that exposes limitations in traditional ethical categories. Focusing on "preemptive structural omission" with "statistical certainty" effectively defines a paradigmatic case that avoids contextual swampiness. The demand for a determinate answer forces analytical rigor.
  *   **Least Certain Point:** My greatest uncertainty lies in the **definition and moral weight of the "baseline" or "status quo"** in the counterfactual control analysis. Determining what the victims' survival prospects were "before" the system's design is often hypothetical and contested. How do we define the relevant baseline in a complex social/technological landscape? Does a slight *reduction* in survival chances due to a new system constitute initiating a lethal sequence akin to killing, or merely a (potentially culpable) worsening of prospects falling under letting die? Resolving how significantly the designer's action must alter the baseline to cross the threshold into "killing" territory feels like the most vulnerable point in my proposed argument. Success hinges on defending a clear and plausible standard here.

  This proposal offers a focused, ambitious, and philosophically rigorous examination of a critical gap in applied ethics, aiming to provide concrete guidance for evaluating the increasingly common phenomenon of harm-by-design in automated systems.
