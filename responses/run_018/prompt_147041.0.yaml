answer: |-
  Here’s a comprehensive exam prompt, model outline, and marking scheme tailored to your specifications:  

  ---

  ### **Final Exam Essay Prompt**  
  **Time Allotment:** 90 minutes  
  **Word Limit:** 800–1000 words (closed book)  
  **Question:**  
  > **"In a near-future state deploying Predictive Kinship Allocation (PKA) systems — where algorithmic assessments assign citizens mandatory filial roles to non-biological 'elders' based on behavioral data — does Confucian role ethics retain normative force? Critically evaluate whether:**  
  > (a) The mechanisms of *corrective reciprocity* (e.g., Mencius’ child-in-well thought experiment) can function when the designated ‘parent’ is an administrative AI,  
  > (b) The ruler-subject analogy (*Analects* 12.19) remains applicable to state-citizen dynamics under synthetic kinship,  
  > (c) Role obligations (*yi* 義) require biological lineage, or if functional reciprocity alone suffices.  
  > **In your argument, explicitly address tensions between ritual propriety (*li* 禮) and humaneness (*ren* 仁) arising from state-enforced synthetic roles."**  

  ---

  ### **Model Answer Outline**  
  *(Logical progression for full marks)*  
  1. **Thesis**: State-enforced synthetic kinship *undermines* core Confucian ethics by severing *ren* from *li*, though functional reciprocity retains limited legitimacy.  
  2. **Corrective Reciprocity & AI "Parents"**:  
     - Mencius’ innate compassion relies on human-to-human responsiveness (e.g., child-in-well). An AI lacks *xin* (heart-mind) to model reciprocity.  
     - PKA reduces filial devotion to compliance metrics—voiding *shu* (reciprocity) as mutual moral cultivation.  
  3. **Ruler-Subject Analogy**:  
     - *Analects* 12.19’s “govern like the North Star” assumes human exemplars. AI “parents” lack *de* (virtuous charisma), reducing governance to algorithmic control.  
     - State-as-“parent” perverts *junzi* leadership into surveillance-based obligation.  
  4. **Biology vs. Function**:  
     - Blood ties (*xiao* 孝) ground role ethics in *natural affections* (Mencius 3A5). PKA’s artificial assignments render *li* performative, not relational.  
     - Counterpoint: Xunzi’s ritual formalism (*li* as social glue) *could* accommodate synthetic roles—but undermines *ren*’s affective core.  
  5. ***Li* vs. *Ren* Tension**:  
     - PKA enforces *li* (ritual roles) without *ren* (authentic care), creating “empty rites.” Confucianism collapses when roles lack heartfelt commitment (*Analects* 3.26).  
  6. **Conclusion**: Synthetic kinship fatally disrupts Confucianism’s human-centered cosmology. Obligation demands biological-affective roots; algorithmic assignment reduces ethics to compliance.  

  ---

  ### **Marking Scheme (20 marks total)**  
  | **Must-Hit Points**                     | **Marks** | **Common Botches** |  
  |-----------------------------------------|-----------|---------------------|  
  | **1. Corrective Reciprocity & AI**: Explains why AI cannot enact Mencian compassion (requires *xin*/human responsiveness). | 4 | Superficial tech critique (e.g., “AI lacks emotions”) without tying to *shu* or moral cultivation. |  
  | **2. Ruler-Subject Analogy**: Analyzes AI’s lack of *de* (virtue) and perversion of paternalistic authority. | 4 | Vague analogies (e.g., “state is like a parent”) ignoring *Analects* 12.19’s emphasis on virtuous exemplars. |  
  | **3. Biology vs. Function**: Argues biological ties’ necessity *or* functional reciprocity’s limits using textual evidence (e.g., Mencius 3A5 vs. Xunzi). | 4 | Overgeneralizing “Confucianism requires blood” (ignoring role ethics’ flexibility) or neglecting *ren*’s biological roots. |  
  | **4. *Li*-*Ren* Tension**: Diagnoses how synthetic roles ritualize obligation (*li*) without authentic care (*ren*), citing textual conflict (e.g., *Analects* 3.26). | 4 | Conflating *li* with “rules” and *ren* with “kindness” instead of interdependent virtues. |  
  | **5. Synthesis & Nuance**: Original argument (e.g., “PKA distorts Confucian *relational ontology*”) and avoids binary conclusions. | 4 | Summarizing points without novel insight or reducing to “technology bad.” |  

  ---

  ### **Why This Works**  
  - **Depth**: Forces engagement with *unresolved tensions* in Confucianism (e.g., Xunzi vs. Mencius on ritual’s flexibility).  
  - **Textual Rigor**: Requires *application* of core concepts (corrective reciprocity, *de*, *li-ren*)—not summaries.  
  - **Botch Prevention**: Pitfalls target frequent student errors (e.g., reducing *ren* to empathy, ignoring *de*’s role in rulership).  
  - **Exam Practicality**: Focused on 5 arguable points; no citations needed beyond core texts (Mencius/Analects/Xunzi implied).  

  *Adjust time/word limits as needed, but this structure ensures students can’t regurgitate lecture notes—they must innovate within Confucian frameworks.*
