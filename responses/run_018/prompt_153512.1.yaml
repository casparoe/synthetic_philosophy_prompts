answer: |-
  ### Exam Question (75 minutes, ~1200 words)

  **Defending the Unthinkable? Rational Choice Under Phenomenal Replacement**

  An agent contemplates undergoing a voluntary, irreversible procedure ("phenomenal replacement"). This procedure does not merely alter their preferences *within* their existing framework for evaluating well-being. Instead, it completely substitutes the *metric* by which welfare itself is assessed. The post-replacement agent employs a fundamentally different, incommensurable evaluative standard. Crucially, this leaves the pre-replacement agent without any stable index or common currency for comparing the welfare outcomes of states of the world existing *before* and *after* the procedure. The pre-change agent cannot coherently say whether being post-replacement is better, worse, or equally good *for them* compared to remaining pre-replacement, as "better for them" lacks a unified meaning across the transformation.

  **Defend or reject the following claim:** Given this specific structure of phenomenal replacement, ex ante rational choice by the pre-replacement agent concerning whether to undergo the procedure is **impossible in principle**.

  In your essay:
  1.  **Explicitly define** what constitutes the unique challenge of "phenomenal replacement" as described, distinguishing it sharply from:
      *   Ordinary cases of *preference learning* (e.g., discovering you like olives).
      *   Standard arguments concerning *transformative experiences* (e.g., arguments about epistemic limits or preference change *within* a stable welfare metric).
  2.  **Argue rigorously** for your position (defense or rejection of the impossibility claim). Focus on the core issue: the absence of a stable, pre-change accessible index for cross-boundary welfare comparison.
  3.  **Address the advisor problem:** Could a knowledgeable third party (possessing full descriptive knowledge of both the pre- and post-replacement evaluative metrics and their consequences) legitimately make a welfare comparison *on behalf of* the agent and recommend a choice? Explain why or why not, directly linking your answer to the absence of first-person access to the post-replacement metric for the pre-replacement agent.

  ---

  ### Model Answer: Defending Impossibility (~600 words)

  **(Position: Ex ante rational choice *is* impossible in principle under phenomenal replacement.)**

  Phenomenal replacement presents a unique and insurmountable barrier to ex ante rational choice because it severs the connection between the agent's current capacity for evaluation and the standard that *will* apply to assess outcomes post-change. Rational choice, ex ante, requires the agent to evaluate potential future states *from their current perspective*, weighing expected utilities based on their present values and knowledge. Phenomenal replacement destroys the foundation for this calculation concerning the post-replacement state itself.

  The impossibility stems from the **complete substitution of the welfare metric**. This is not preference learning, where I discover latent preferences within my existing evaluative framework (e.g., finding olives pleasurable aligns with my standing value of gustatory enjoyment). Nor is it standard transformative experience, where I gain new preferences or knowledge but still evaluate outcomes using a fundamentally *continuous* metric (e.g., after having a child, my values shift, but "my child's well-being" becomes a new component within an overarching, recognizable framework of "what is good for me" - family, fulfillment, etc.). In phenomenal replacement, the framework itself is discarded and replaced. The pre-replacement agent values states under Metric A; the post-replacement agent values states under Metric B. Crucially, Metric A offers no purchase for understanding Metric B's valuations, and vice versa, from the first-person perspective *at the time of choice*. There is no "super-metric" accessible to the pre-change self that can translate welfare assessments between A and B. Asking the pre-replacement agent if they "prefer" to be post-replacement is like asking someone who only understands Celsius if 100 degrees Fahrenheit is "hot" – without a conversion formula or shared experiential understanding, the question lacks meaning *for them*.

  Consequently, the pre-replacement agent faces a choice where one option (undergoing replacement) leads to an outcome whose value *to them, now*, is fundamentally indeterminate. They cannot assign a utility to being post-replacement because their current utility function (Metric A) cannot meaningfully represent welfare as defined by Metric B. Assigning *any* specific utility value based on Metric A to the state "being governed by Metric B" would be arbitrary, as Metric A provides no justification for that specific valuation over another. Rational choice requires comparing the expected utility of options; when the utility of a key outcome is not just unknown but *in principle unassignable* from the choosing agent's perspective, comparison collapses. The agent is epistemically stranded.

  This epistemic barrier also nullifies the potential for legitimate third-party substitution. An advisor, no matter how knowledgeable descriptively about Metric A, Metric B, and the causal consequences of the procedure, faces the same core problem. They can describe *what* the post-replacement agent will value (using Metric B) and *what* the pre-replacement agent values (using Metric A). However, to recommend a choice *based on welfare*, the advisor must make a comparison *between* welfare-as-defined-by-A and welfare-as-defined-by-B. But this comparison requires a common standard the advisor does not, and cannot, possess. They cannot access the pre-replacement agent's *first-person evaluative perspective* on Metric B, nor can they access the post-replacement agent's perspective on Metric A. Any welfare comparison they attempt across the boundary relies on either privileging one metric arbitrarily (e.g., "Metric B seems more enlightened") or inventing a third metric (e.g., "objective flourishing"), but this third metric is *not* the metric the *agent* uses either before or after the change. The advisor's evaluation cannot substitute for the agent's missing first-person access because welfare is inherently perspectival; the advisor inevitably imposes an external standard alien to both the pre- and post-agent's actual evaluative frameworks. Therefore, an advisor cannot render the choice rational *for the agent*; they can only impose a choice based on the advisor's own values or an invented standard, bypassing the agent's evaluative perspective altogether.

  Phenomenal replacement, by destroying the stable index for cross-boundary welfare comparison, thus renders ex ante rational choice impossible in principle. The agent lacks the necessary epistemic tools, and no third party can provide them without abandoning the core requirement of evaluating outcomes *for the agent* according to *their* (pre or post) welfare metrics.

  ---

  ### Marking Scheme (Total: 20 Marks)

  1.  **Precise Characterization of Phenomenal Replacement's Core Challenge (5 Marks):**
      *   *Top Answer Must:* Clearly articulate that the problem is the **complete substitution of the welfare metric** leading to **incommensurability** and the **absence of any stable, pre-change accessible index** for comparing welfare *across* the transformation. Distinguish this *sharply* from preference learning/change within a stable metric and from standard transformative experience arguments focused on epistemic access or shifting preferences.
      *   *Characteristic Mistake:* Conflating phenomenal replacement with mere radical preference change or epistemic uncertainty about future preferences; failing to emphasize the *metric substitution* and resulting *incommensurability* as the unique problem.

  2.  **Rigorous Argument for Chosen Position (Impossible/Possible) Centered on the Comparison Problem (7 Marks):**
      *   *Top Answer Must:* Build a focused argument explicitly centered on the **impossibility (or possibility) of assigning ex ante utility/carrying out welfare comparison** between pre- and post-states *from the pre-replacement perspective*. For impossibility: Emphasize the arbitrariness/meaninglessness of any assignment. For possibility: Propose and defend a specific, non-arbitrary structural basis for comparison that survives the metric substitution (e.g., a formal property, a thin pre-commitment).
      *   *Characteristic Mistake:* Shifting focus to other aspects of rationality (e.g., procedural, satisficing) without solving the core comparison problem; making an argument applicable to standard transformative experience but failing to address the unique metric substitution; assertion without explicit reasoning tied to the absence of a comparison index.

  3.  **Critical Analysis of the Third-Person Advisor (5 Marks):**
      *   *Top Answer Must:* Directly engage with whether the advisor can legitimately make a welfare comparison *for the agent*. Explicitly recognize the advisor's descriptive knowledge but argue why this **cannot translate into an authoritative welfare comparison across the metric boundary** without illegitimately imposing an external standard or privileging one perspective arbitrarily. Link this directly to the agent's absent first-person access.
      *   *Characteristic Mistake:* Claiming the advisor can simply "use" one metric or the other without justifying how this choice is legitimate *for the agent*; suggesting the advisor can create a "neutral" comparison metric without showing how this metric connects to the *agent's own* welfare perspectives pre/post; ignoring the link to first-person access.

  4.  **Consistent, Committed Position & Argumentative Cohesion (3 Marks):**
      *   *Top Answer Must:* Maintain a clear, unwavering stance (impossible or possible) throughout the essay. Ensure all parts of the answer (definition, core argument, advisor discussion) logically support and reinforce the central thesis. Avoid hedging or presenting alternatives as equally viable within the answer's argument.
      *   *Characteristic Mistake:* Inconsistency in the core position (e.g., starting with "impossible" but then suggesting ways it might be possible without resolving the tension); including significant discussion of opposing views that detracts from building the committed argument; lack of clear logical flow between sections.
