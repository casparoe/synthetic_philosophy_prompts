answer: |-
  Here's the raw spec for a credible theory of armed neutrality in the modern era. Think of it as the minimum viable product your theory must deliver to avoid being "nostalgic branding":

  **Core Desiderata (The Non-Negotiables):**

  1.  **Credible Territorial Defense Deterrence:**
      *   **What:** Must demonstrably raise the cost of invasion to a level where it deters *serious adversaries* (not just minor incursions). Requires sufficient, ready, and sustainable forces.
      *   **Why:** This is the whole point. If it doesn't deter war on your soil, it's failed. Case: Finland's WWII/post-war deterrence vs USSR/Russia, Switzerland's historical posture.
      *   **Non-Negotiable?** Absolutely. Failing this = not armed neutrality, just wishful thinking.

  2.  **Operationalized Non-Belligerency (Hague V Compliance):**
      *   **What:** Must strictly avoid *active* participation in conflicts between other states, including denying transit, arms sales to belligerents, and intelligence sharing targeting specific belligerents. *Pre-conflict alliances/preparations are the grey area.*
      *   **Why:** Legal bedrock of neutrality under international law (Hague Convention V). Violating this strips the label. Case: Switzerland blocking Nazi troop transit vs. Sweden allowing it in WWII (controversial).
      *   **Non-Negotiable?** Legally, yes. Violation = not neutrality.

  3.  **Sustainable Defense Autonomy (The "Freeloader" Test):**
      *   **What:** Must possess the domestic industrial capacity (or guaranteed non-belligerent access), logistics, stockpiles (fuel, ammo, food, meds), and manpower mobilization systems to sustain a *prolonged* defense *without* relying on belligerent powers for critical warfighting supplies *during* a conflict.
      *   **Why:** Proves you're not just outsourcing defense. Case: Swiss ammunition stockpiles, fuel reserves, mountain fortresses. Contrast with states reliant on just-in-time allied resupply.
      *   **Non-Negotiable?** Yes. True armed neutrality demands this resilience. Failure = freeloading.

  4.  **Constitutional vs. Operational Neutrality Distinction:**
      *   **What:** Must clearly differentiate between:
          *   *Constitutional Neutrality:* Permanent, principle-based neutrality enshrined in law/policy (Switzerland, pre-2022 Sweden).
          *   *Operational Neutrality:* A temporary posture chosen for a specific conflict/situation, driven by pragmatism, not principle (Finland during Cold War, Ireland).
      *   **Why:** Essential for understanding commitment and flexibility. Sweden dropping constitutional neutrality for NATO highlights the difference. Finland never had constitutional neutrality but practiced operational neutrality.
      *   **Non-Negotiable?** Yes. Collapsing this distinction leads to category errors.

  **Critical Distinctions & Phenomena:**

  5.  **Manpower Model Agnosticism (But With Caveats):**
      *   **What:** Must explain viability of both:
          *   *Mass Conscription/Militia:* Deep reserves for territorial defense (Swiss, Finns).
          *   *Professional Core + Trained Reserves:* Smaller standing force, rapid response (Sweden post-2010 revival).
      *   **Why:** Both exist. Case: Swiss militia effectiveness historically, Finland's conscription depth, Sweden's shift back to conscription *combined* with professional rapid reaction forces. **Caveat:** The model MUST be scaled to meet Desideratum 1 (Deterrence).
      *   **Non-Negotiable?** No, but the theory must accommodate both. Preference for scalable models.

  6.  **Territorial Defense Primacy:**
      *   **What:** Focus is overwhelmingly on defending sovereign territory. Power projection beyond borders (expeditionary forces) is minimal or non-existent and cannot be the core of the strategy.
      *   **Why:** Power projection inherently creates alliances, dependencies, and enemies inconsistent with neutrality. Case: Swiss/Finnish focus on home turf. Sweden maintained some expeditionary capability *while* constitutionally neutral, creating tension.
      *   **Non-Negotiable?** Yes. Significant power projection undermines neutrality.

  7.  **The Civilian-Infrastructure Overlap Problem (Your Key Injection):**
      *   **What:** Must provide a coherent mechanism for mobilizing reservists embedded in critical civilian infrastructure (energy, pharma, transport, finance) *partially or wholly owned by foreign entities*, without:
          *   Crippling the civilian economy/mobilization effort.
          *   Violating non-belligerency (e.g., seizing foreign assets without compensation).
          *   Creating paralyzing legal conflicts or dependence on foreign approval.
      *   **Why:** Modern economies are globally integrated. Case: Swiss pharma giants, Finnish energy imports, Swedish tech supply chains – all vital, all have foreign ownership/links. Mobilizing a reservist who runs a foreign-owned power plant is a legal/operational nightmare.
      *   **Non-Negotiable?** Yes. This is a **major modern vulnerability** most theories ignore. Must be addressed.

  **Constraints:**

  8.  **Logistical Sovereignty Constraints:**
      *   **What:** Must account for reliance on global supply chains for critical components (chips, rare earths), fuel, and food *during peacetime*. Requires robust pre-positioning, diversification, or domestic alternatives for wartime.
      *   **Why:** Modern tech and economies depend on global flows. Case: Finland's energy reliance pre-Ukraine war, Swiss pharma supply chains.
      *   **Non-Negotiable?** Must be acknowledged and mitigated.

  9.  **Alliance Interoperability Tension:**
      *   **What:** Must handle the tension between maintaining strict neutrality and engaging in interoperability exercises/training or equipment standardization with *potential future belligerents* (like NATO).
      *   **Why:** Improves effectiveness but risks entanglement and perception. Case: Finland/Sweden's Partnership for Peace (PfP) pre-NATO, Swiss joint exercises with neighbors.
      *   **Non-Negotiable?** Must acknowledge the inherent tension and potential for blowback on neutrality perception.

  **Conflict Points & Scoring:**

  *   **Jointly Unsatisfiable?** **Constitutional Neutrality + Deep Alliance Interoperability.** Deep integration (like Sweden/Finland joining NATO) inherently kills constitutional neutrality. PfP-level can exist, but constant vigilance is needed. **Strict Constitutional Neutrality + Full Participation in Collective Sanctions Regimes** is also highly problematic (violates impartiality).
  *   **Single Requirement That Kills Popular Theories:** **The Civilian-Infrastructure Overlap Problem (#7).** Many romanticized "militia" models assume reservists seamlessly mobilize. Modern globalized economies make this a legal and operational quagmire that most simplistic theories ignore. **Sustainable Defense Autonomy (#3)** also kills freeloader models.
  *   **Biggest Tension:** Balancing **Non-Belligerency (#2)** with necessary **peacetime preparation** that involves potential future adversaries (like NATO exercises - #9). How deep can you go before it's de facto alignment?

  **Quick Country Scores (Against Non-Negotiables & Key Challenges):**

  *   **Switzerland:**
      *   **✓✓** Territorial Defense Deterrence (Historically strong, modernizing).
      *   **✓** Non-Belligerency Compliance (Generally strict).
      *   **✓✓** Sustainable Defense Autonomy (Stockpiles, bunkers, industry - gold standard).
      *   **✓** Constitutional Neutrality (Core identity).
      *   **?** Civilian-Infrastructure Overlap (Legal frameworks exist, but foreign ownership in critical sectors is a **major vulnerability** - esp. finance/pharma. Mobilization disruption risk: HIGH).
      *   **!** Alliance Interoperability (Limited, cautious. Tension managed).
      *   **Verdict:** Still the archetype, but #7 is its Achilles' heel today.

  *   **Sweden (Post-NATO):**
      *   **✓✓** Territorial Defense Deterrence (Strong professional force + revived conscription + **massive boost from NATO**).
      *   **X** Constitutional Neutrality (Officially abandoned).
      *   **?** Non-Belligerency Compliance (As NATO member, bound by Art 5 - neutrality functionally dead).
      *   **?** Sustainable Defense Autonomy (Improving stockpiles post-2014, but now relies on NATO logistics - fails #3 as a *neutral*).
      *   **?** Civilian-Infrastructure Overlap (Same challenges as others, but NATO framework *might* offer solutions during conflict - irrelevant to neutrality now).
      *   **✓✓** Alliance Interoperability (Now maximal).
      *   **Verdict:** **No longer armed neutrality.** Powerful territorial defense, but achieved by abandoning the core principle (#4).

  *   **Finland:**
      *   **✓✓** Territorial Defense Deterrence (Massive wartime army, terrain, will - proven model).
      *   **X** Constitutional Neutrality (Never had it).
      *   **?** Operational Neutrality (Practiced historically, now NATO member - neutrality gone).
      *   **?** Sustainable Defense Autonomy (Strong domestic industry (e.g., Patria), stockpiles, BUT energy/logistics vulnerability pre-2022. NATO dependency now replaces this need).
      *   **?** Civilian-Infrastructure Overlap (Significant foreign ownership (e.g., energy), complex mobilization - **major pre-NATO vulnerability**).
      *   **✓✓** Alliance Interoperability (Now maximal via NATO).
      *   **Verdict:** **No longer neutral (NATO).** Had arguably the most *effective* operational neutrality/territorial defense model pre-2022, but sustainability (#3) and #7 were critical weaknesses they addressed by joining NATO.

  **The Takeaway:** Armed neutrality *is* still coherent **if** you meet the brutal non-negotiables (#1, #2, #3, #4, #7). However, the modern constraints (#7, #8) make it vastly harder and more expensive than in the past. Sweden and Finland concluded it was no longer viable *for them* and chose collective security. Switzerland persists but faces immense pressure on #7. The "freeloader" accusation sticks **only** if a state fails #3 (Sustainable Autonomy) while claiming neutrality. True armed neutrality is the opposite of freeloading – it's an incredibly demanding and expensive form of self-reliance.
