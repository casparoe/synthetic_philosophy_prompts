  ## Whigs Unbound

  We trace the path where older notions bled,
  Decree each step a stage we must surpass.
  **We read the dead as drafts of us**, instead
  Of minds that wrestled truths we think we've shed,
  Who built with tools unlike the ones we class
  As right. We trace the path where notions bled

  Like ink on palimpsests, their meaning fled
  Or warped to fit conclusions we amass.
  **We read the dead as drafts of us**, instead

  Of seeing how their fervent hopes were fed
  By different stars, a strange, compelling mass
  That lit the path where older notions bled.
  The Puritan’s fierce grace, a force widespread,
  Not "freedom's seed" crushed under monarch's brass –
  **We read the dead as drafts of us**, instead

  Of strangers forging futures, widely read
  In scrolls *we* deem archaic, coarse, or crass.
  We trace the path where older notions bled
  And laud the "winners" where the "lost" misled.
  But mark the sleight-of-hand within the glass:
  **The present wears a crown it made itself**, a claim
  Projected back to sanctify our aim.
  This is the pivot, where the trap is sprung:
  The victor's terms cloak every rebel tongue,
  Each past conviction, crude and unrefined,
  Is judged *by us*, the endpoint pre-designed.
  **The present wears a crown it made itself**,
  Declares our vantage point the central shelf,
  Our norms the unacknowledged, final goal –
  The hidden engine driving every scroll
  We parse. The telos smuggled in the text
  Annulls the chaos context next to next.
  **We read the dead as drafts of us**, confined,
  Their rich dissent to footnotes reassigned.
  **The present wears a crown it made itself**,
  A throne built on the past's dismantled self.

  ---

  **Note on Contested Reading:** I argue that Butterfield's critique of Whig history applies fundamentally to *all* teleological progressive narratives, not solely 19th-century liberal ones. The core sin – compressing complex, contingent past struggles into a linear ascent culminating in, and judged by, the historian's present values – is a structural flaw inherent in any narrative framing history as inevitable progress towards a specific (modern) endpoint, be it liberal democracy, technological utopia, or a particular social justice vision. The mechanism of retrojection and the elevation of the present as the hidden *telos* operate similarly regardless of the specific ideology celebrated.
