   Let's design the steps:

   Step 1: Check for Artifactual Contradictions
     Question: Is the contradiction explainable by non-substantive factors such as:
       - Translation errors (e.g., different language versions with mistranslations)
       - Temporal misindexing (e.g., the records refer to different effective dates, and the law changed in between)
       - Scope ambiguities (e.g., one record applies to a specific jurisdiction or context that the other does not)
       - Transcription errors (e.g., typo in a number, misplaced decimal, incorrect unit conversion)
       - Misattribution (e.g., the record is incorrectly attributed to an authority)

     Sufficient answer: 
       - If any artifactual explanation is found and confirmed (e.g., by checking metadata, original source, or context) that resolves the contradiction without affecting the substance, then the contradiction is artifactual. 
       - Then: Correct the artifact (if possible within the archive's correction protocols) and proceed as non-contradictory. If correction is not possible (e.g., the record is as submitted and cannot be altered), then reject the record with the artifact as erroneous.
       - If no artifactual explanation is found, proceed to Step 2.

     Note: This step may require human judgment in assessing metadata and context.

   Step 2: Check for Scope Containment
     Question: Is the contradiction confined to a narrow, well-defined context (e.g., a specific jurisdiction, a specific set of conditions, a narrow subclass) such that it does not propagate to other records?
     - Specifically, check if the scope of one record is a proper subset of the other, or if they are disjoint in scope.

     Sufficient answer:
       - If the contradiction is contained within a narrow scope (e.g., only in a specific jurisdiction, only for a specific time period, only for a rare subclass) and the rest of the records in the cluster are unaffected, then the contradiction is locally contained. 
       - Then: Proceed to Step 3 to check if the contradiction is substantive.
       - If the contradiction is not contained (i.e., it has implications for a broad set of records or could cause cascade failure in linked records) then escalate to ethics board (because the conflict threatens the integrity of the archive and may require a value judgment on how to handle the inconsistency at scale).

     Note: Cascade failure is triggered when the contradiction, if accepted, would force a reevaluation of many other records (e.g., if a fundamental definition is contradicted that is used in many places).

   Step 3: Check for Substantive Contradiction (Genuine Dialetheia)
     Question: Are both records from equally authoritative sources, and is the contradiction a genuine reflection of inconsistent but legitimate positions held by those authorities?
     - Criteria:
          a. Both sources are recognized as authoritative by the archive's governance (e.g., both are from bodies listed in the charter).
