answer: |-
  ### Decision Procedure for Contradictory Submissions

  **Objective**: Determine one of three dispositions for a pair of contradictory records:  
  1. **Retain both** (as a true dialetheia with paraconsistent containment).  
  2. **Reject one** (due to errors or hierarchical overruling).  
  3. **Escalate to ethics board** (value conflict or uncontainable cascade risk).  

  **Key Principles**:  
  - **Substantive contradiction**: Genuine disagreement between equally authoritative sources.  
  - **Artifactual contradiction**: Resolvable via non-substantive factors (e.g., translation errors).  
  - **Containment**: Contradiction must not propagate to linked records (cascade failure).  
  - **Value conflict**: Disagreement rooted in ethics, policy, or ideology.  

  **Procedure Steps** (ordered; 2-hour limit per case):  

  ---

  #### **Step 1: Artifactual Contradiction Check**  
  **Question**: *Can the contradiction be resolved by non-substantive factors?*  
  - **Checks**:  
    - **Temporal misalignment**: Do the records reference different effective dates? (e.g., "2023 threshold" vs. "2024 threshold").  
    - **Scope ambiguity**: Do jurisdictional, contextual, or definitional differences exist? (e.g., "toxic in drinking water" vs. "safe in soil").  
    - **Transcription/translation error**: Is there a unit mismatch, typo, or mistranslation? (e.g., "mg/L" vs. "μg/L").  
    - **Misattribution**: Is one record mislabeled (e.g., draft vs. final)?  
  **Sufficient answer**:  
    - **Yes** (artifact confirmed): Correct the artifact if possible (e.g., add metadata note) → **Reject one record** if uncorrectable. **Stop**.  
    - **No** (unresolved): Proceed to Step 2.  
  **Human judgment needed**: Ambiguous artifacts (e.g., suspected but unprovable typos).  

  ---

  #### **Step 2: Cascade Failure Risk Assessment**  
  **Question**: *Does the contradiction threaten to propagate to >3 linked records?*  
  - **Checks**:  
    - **Dependency analysis**: Does either record underpin >3 other records? (e.g., a core definition used in multiple regulations).  
    - **Containment test**: Is the contradiction isolated to a narrow scope? (e.g., "only applies to minors" or "restricted to wetland cases").  
  **Sufficient answer**:  
    - **Yes** (cascade risk): → **Escalate to ethics board**. **Stop**.  
    - **No** (locally contained): Proceed to Step 3.  
  **Human judgment needed**: Estimating propagation risk without a dependency map.  

  ---

  #### **Step 3: Authority Validation**  
  **Question**: *Are both sources equally authoritative with no hierarchical resolution?*  
  - **Checks**:  
    - **Authority list**: Are both sources explicitly recognized as authoritative in the governance charter? (e.g., "EPA and WHO are both listed").  
    - **Hierarchy check**: Does a higher authority (e.g., supreme court, meta-regulator) resolve the conflict?  
  **Sufficient answer**:  
    - **No** (one non-authoritative): → **Reject non-authoritative record**. **Stop**.  
    - **No** (one overruled hierarchically): → **Reject overruled record**. **Stop**.  
    - **Yes** (both authoritative, no hierarchy): Proceed to Step 4.  
  **Human judgment needed**: Undefined hierarchies (e.g., two peer agencies with equal weight).  

  ---

  #### **Step 4: Value Conflict Screening**  
  **Question**: *Is the contradiction rooted in values (not facts or authority)?*  
  - **Checks**:  
    - **Value-laden language**: Look for terms like "equitable," "precautionary," or "moral duty."  
    - **Policy vs. evidence**: Does one record cite ideology/public opinion, while the other cites data?  
  **Sufficient answer**:  
    - **Yes** (value conflict): → **Escalate to ethics board**. **Stop**.  
    - **No** (substantive contradiction): → **Retain both as dialetheia** (with containment flag). **Stop**.  
  **Human judgment needed**: Distinguishing values from legitimate interpretive differences.  

  ---

  ### **Quick Tests for Reviewers**  
  1. **Artifact check**: Cross-reference dates, units, and jurisdiction metadata.  
  2. **Cascade test**: Count dependencies (if >3 links, escalate).  
  3. **Authority check**: Verify sources against predefined authoritative-body list.  
  4. **Value scan**: Search for ethical/policy keywords in record text.  

  ### **Limitations & Hard Cases**  
  - **Misfires**:  
    - False negatives in artifact detection (e.g., subtle translation errors).  
    - Over/underestimation of cascade risk without full dependency graphs.  
    - Value conflicts masquerading as factual disputes (e.g., politicized science).  
  - **Not designed to**:  
    - Resolve the contradiction.  
    - Handle >2 records simultaneously.  
    - Replace deep domain expertise (e.g., scientific/legal nuance).  

  ---

  ### **Application to Cases**  

  #### **Case 1: Environmental Thresholds**  
  - **Records**: Agency A (safe threshold: 50ppm), Agency B (toxic threshold: 30ppm). Both claim current authority.  
  - **Procedure**:  
    1. **Step 1**: Check artifacts (e.g., units, dates). If none → Proceed.  
    2. **Step 2**: If thresholds are reused in >3 linked records (e.g., farming/water regulations) → **Escalate** (cascade risk). If contained (e.g., only for "industrial zones") → Proceed.  
    3. **Step 3**: Both authoritative → Proceed.  
    4. **Step 4**: If thresholds cite values (e.g., "precautionary principle") → **Escalate**. Else → **Retain both** (dialetheia).  
  - **Disposition**: Likely **retain both** (if contained and factual) or **escalate** (if cascade/value conflict).  

  #### **Case 2: Judicial vs. Statute Definition**  
  - **Records**: Statute defines negligence as "recklessness"; court interpretation defines it as "intent" for a liability subclass.  
  - **Procedure**:  
    1. **Step 1**: No artifacts → Proceed.  
    2. **Step 2**: Narrow subclass → **Contained** → Proceed.  
    3. **Step 3**: Both authoritative. If court hierarchically overrules statute → **Reject statute record**. Else → Proceed.  
    4. **Step 4**: No value language → **Retain both** (dialetheia).  
  - **Disposition**: **Retain both** (contained substantive contradiction).  

  #### **Case 3: Controversial Disposition**  
  - **Scenario**: Two scientific consortia (both authoritative) contradict on climate data. Consortia A: "Sea levels rise 5mm/yr"; Consortia B: "No rise." No artifacts, contained scope.  
  - **Procedure**:  
    - **Step 4** detects value-laden language in Consortia B (e.g., "economic costs justify downplaying risks") → **Escalate to ethics board**.  
  - **Stakeholder resistance**: Consortia B argues their record is factual, not value-based.  
  - **Why framework mandates escalation**:  
    - The contradiction involves values (prioritizing economy over science), violating the "authority/logic-only" rule.  
    - Retaining it as dialetheia would legitimize politicized science, undermining archive integrity.  
  - **Ethics board role**: Assess if Consortia B’s submission breaches ethical standards (e.g., evidence suppression).  

  ---  
  **Final Output**: Concise, auditable, and defensible for non-logician reviewers. Timeboxed to 2 hours via structured yes/no checks.
