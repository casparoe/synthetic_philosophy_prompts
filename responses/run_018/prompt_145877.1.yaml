  ### Constructed Decision Scenario: The Threshold Singularity Paradox

  **Scenario Setup:**  
  An agent selects a threshold \(\theta \in \mathbb{R}\) in a continuous parameter space. The state of the world is determined by a random variable \(X\), uniformly distributed on \([0, 1]\). The payoff function \(U(\theta, x)\) is defined as:  
  \[
  U(\theta, x) = 
  \begin{cases} 
  \frac{1}{(x - \theta)^2} & \text{if } x > \theta, \\
  -\frac{1}{(x - \theta)^2} & \text{if } x < \theta.
  \end{cases}
  \]  
  This function has a singularity at \(x = \theta\), where the payoff diverges to \(+\infty\) as \(x\) approaches \(\theta\) from above and to \(-\infty\) as \(x\) approaches \(\theta\) from below. The agent’s goal is to choose \(\theta\) to maximize expected utility.

  ---

  ### Divergence of the Expected Utility Integral
  The expected utility \(E[U(\theta)]\) is given by:  
  \[
  E[U(\theta)] = \int_0^1 U(\theta, x)  dx = \int_0^\theta -\frac{1}{(x - \theta)^2}  dx + \int_\theta^1 \frac{1}{(x - \theta)^2}  dx.
  \]  
  Both integrals diverge individually:  
  1. **Negative contribution**:  
     \[
     \int_0^\theta -\frac{1}{(x - \theta)^2}  dx = -\infty.
     \]  
     As \(x \to \theta^-\), \(-\frac{1}{(x - \theta)^2} \to -\infty\), and the integral diverges to \(-\infty\).  
  2. **Positive contribution**:  
     \[
     \int_\theta^1 \frac{1}{(x - \theta)^2}  dx = +\infty.
     \]  
     As \(x \to \theta^+\), \(\frac{1}{(x - \theta)^2} \to +\infty\), and the integral diverges to \(+\infty\).  

  To evaluate \(E[U(\theta)]\), we consider a limiting process. Define:  
  \[
  I(a, b) = \int_0^{\theta - a} -\frac{1}{(x - \theta)^2}  dx + \int_{\theta + b}^1 \frac{1}{(x - \theta)^2}  dx,
  \]  
  where \(a, b > 0\) control how we approach the singularity. As \(a \to 0^+\) and \(b \to 0^+\), we analyze the limit of \(I(a, b)\).  

  **Computing \(I(a, b)\)**:  
  \[
  I(a, b) = \left[ \frac{1}{x - \theta} \right]_0^{\theta - a} + \left[ -\frac{1}{x - \theta} \right]_{\theta + b}^1 = \left( \frac{1}{-a} - \frac{1}{-\theta} \right) + \left( -\frac{1}{1 - \theta} + \frac{1}{b} \right).
  \]  
  Simplifying:  
  \[
  I(a, b) = -\frac{1}{a} + \frac{1}{\theta} - \frac{1}{1 - \theta} + \frac{1}{b}.
  \]  
  The finite terms \(\frac{1}{\theta} - \frac{1}{1 - \theta}\) are constant, but the divergent terms depend on \(a\) and \(b\):  
  \[
  I(a, b) = \underbrace{\frac{1}{b} - \frac{1}{a}}_{\text{divergent}} + \underbrace{\left( \frac{1}{\theta} - \frac{1}{1 - \theta}\right)}_{\text{constant}}.
  \]  

  **Indeterminacy**:  
  The value of \(I(a, b)\) depends on the **path** taken by \((a, b) \to (0, 0)\):  
  - If \(a = b\), then \(I(a, a) = \frac{1}{\theta} - \frac{1}{1 - \theta}\) (finite).  
  - If \(b = 2a\), then \(I(a, 2a) = \frac{1}{2a} - \frac{1}{a} + C = -\frac{1}{2a} + C \to -\infty\).  
  - If \(a = 2b\), then \(I(2b, b) = \frac{1}{b} - \frac{1}{2b} + C = \frac{1}{2b} + C \to +\infty\).  
  - If \(b = a^2\), then \(I(a, a^2) = \frac{1}{a^2} - \frac{1}{a} + C \to +\infty\).  

  By choosing different paths, \(I(a, b)\) can converge to **any real number**, \(+\infty\), or \(-\infty\). Thus, \(\lim_{(a,b) \to (0,0)} I(a, b)\) does not exist, and \(E[U(\theta)]\) is **indeterminate**.

  ---

  ### Why This is a Failure of Non-Existence (Not Practical Limitations)
  The core issue is that the expected utility **does not exist as a mathematical object**:  
  - **Not Lebesgue integrable**: The expectation fails Lebesgue integrability because:  
    \[
    \int_0^1 \max(U(\theta, x), 0)  dx = +\infty, \quad \int_0^1 \min(U(\theta, x), 0)  dx = -\infty.
    \]  
    The positive and negative parts both diverge, so \(E[U(\theta)]\) is undefined in Lebesgue’s framework.  
  - **No extended real value**: The expectation is not \(+\infty\), \(-\infty\), or any finite value. It is fundamentally indeterminate.  
  - **Independence from risk/computation**: This is not due to risk aversion (which modifies utility) or bounded computation (which approximates integrals). The divergence arises from the **inherent structure** of the payoff function and the singularity at \(x = \theta\).  

  **Contrast with unbounded expectations**:  
  - In the St. Petersburg paradox, \(E[U] = +\infty\) (unbounded but defined).  
  - Here, \(E[U]\) has no value—even infinite—because the symmetric divergences do not resolve.  

  ---

  ### Substitution of Non-Expectation Decision Rules
  When expected utility is undefined, standard expectation-based reasoning collapses. Agents must resort to alternative rules:  
  - **Maximin**: Maximize the worst-case payoff. However, \(\inf_x U(\theta, x) = -\infty\) for all \(\theta\), so no \(\theta\) is favored.  
  - **Maximax**: Maximize the best-case payoff. Since \(\sup_x U(\theta, x) = +\infty\) for all \(\theta\), this rule also fails.  
  - **Principal value optimization**: Agents might use the Cauchy principal value \(I(a, a) = \frac{1}{\theta} - \frac{1}{1 - \theta}\) as an ad hoc substitute. Maximizing this yields \(\theta^* = 0.5\) (minimizes \(| \theta - (1 - \theta) |\)). However, this is not derived from decision theory—it is a regularization of the divergent integral.  

  **Limits of expected utility theory**:  
  This example reveals a fundamental limitation: expected utility theory **requires the expectation to exist**. When payoffs contain discontinuities or singularities that prevent a unique limiting integral, the theory lacks the tools to rank choices. The failure is not epistemic (e.g., unknown probabilities) but **ontological**—the expectation object itself does not exist. This highlights:  
  1. The reliance of expected utility on **well-behaved integrals** (e.g., absolute convergence).  
  2. The need for **regularization methods** (e.g., principal values) or **alternative frameworks** (e.g., relative utilitarianism) in pathological cases.  

  ### Conclusion
  The Threshold Singularity Paradox demonstrates how discontinuous payoff structures can render expected utility **mathematically undefined** due to symmetric divergences. Unlike paradoxes with infinite expectations, this represents a deeper failure: the non-existence of the expectation integral. Decision theory, as a framework, cannot proceed without ad hoc substitutions, exposing its vulnerability to topological pathologies in payoff spaces.
