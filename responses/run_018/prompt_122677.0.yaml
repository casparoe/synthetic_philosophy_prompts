prompt: |-
  I maintain the recomputation core of a collaborative design tool. It is a dependency graph of a few million derived cells: user actions and incoming edits invalidate the nodes downstream of them and we recompute incrementally, over persistent data structures with structural sharing, never mutating a cell in place. Third-party plugins hook in by declaring which cell ranges they read and which they write, but those declarations are not enforced and in practice are often wrong, which is most of my on-call load. The vocabulary I actually reason in is that one: graphs, invalidation, recomputation, copy-on-write, cache coherence, and interfaces saying what a component may read versus what it may write.

  I keep being told that the frame problem is my problem, or is a generalization of it, and I would like that claim cashed out rather than gestured at. Translate it into the vocabulary above, in two stages. First the narrow original version, about how a formal theory of action specifies what an action does not change. Then the broader version philosophers seem to mean, on which the difficulty is working out which of a system's many stored beliefs a new event is relevant to at all. For each stage, name the thing in my world it corresponds to, and say where the engineering answer I already have is a real solution rather than a redescription of the problem.

  Then the residue report, which is what I actually want:

  1. What translates cleanly, term for term.
  2. What translates only with distortion, and in particular where my vocabulary smuggles in an assumption the philosopher is not entitled to. My guess is that the crux is that I get to write the dependency graph down because my team authored the system, and I get to treat undeclared effects as bugs to be fixed, whereas an agent embedded in an open world authored nothing and cannot appeal to a bug. Tell me whether that is the real crux and whether it is a difference in kind or only in degree.
  3. What cannot be expressed in my vocabulary at all, even approximately.

  On the strength of item 3, judge whether the residue is a blind spot in how I think about software systems, or evidence that the philosophical claim was never as well defined as it sounds. End with a single line: \answer{dissolved | relocated | untranslatable}, picking whichever label fits your overall verdict.
reasoning: |-
  We are going to break down the problem step by step.

   The user is working on a recomputation core for a collaborative design tool. The system is a dependency graph of derived cells (a few million). The system uses incremental recomputation with persistent data structures (structural sharing, copy-on-write). Third-party plugins declare which cell ranges they read and which they write, but these declarations are often wrong, leading to bugs.

   The user has been told that the "frame problem" is relevant to their work. They want to see how the frame problem maps to their system in two stages: the narrow original version and the broader philosophical version. Then, they want a residue report (three parts) and a final verdict.

   Let's first recall the frame problem:

   1. **The narrow frame problem** (from AI and formal theories of action): 
      - In the context of formalizing actions, it is the problem of specifying what does *not* change when an action is performed. For example, if you move a block, you want to avoid having to specify that the color of the block doesn't change, the position of other objects doesn't change, etc.

   2. **The broad frame problem** (in philosophy and AI):
      - The difficulty of representing and efficiently reasoning about the relevance of events (or actions) to the vast set of stored beliefs (or facts) in a system. It's about determining which beliefs are affected by an event and which are not, without having to check every single one.

   Now, the user's system:

   - **Graph**: A dependency graph of cells (nodes) and dependencies (edges). 
   - **Invalidation**: When a cell is changed (by user action or edit), downstream cells are invalidated (marked as needing recomputation).
   - **Recomputation**: Recomputing invalidated cells, incrementally.
   - **Copy-on-write**: Persistent data structures that allow sharing of unchanged parts.
   - **Cache coherence**: Ensuring that the system state remains consistent after changes.
   - **Interfaces**: Plugins declare what they read and what they write (though these are often wrong).

   Mapping the narrow frame problem:

   - **Narrow frame problem in the user's system**:
     - The problem of determining which cells are *not* affected by a change. In other words, when a change happens, we want to avoid having to recompute the entire graph. We want to invalidate only the downstream cells and leave the rest unchanged.

     - **Correspondence**: 
       - The dependency graph and the invalidation mechanism solve the narrow frame problem. The graph encodes the dependencies, so when a cell is changed, we traverse the graph to invalidate only the dependent cells. The rest remain valid (they are "frame" cells that do not change). 

     - **Is this a real solution?** 
       - Yes. The dependency graph explicitly captures the potential propagation of change. The solution is efficient because we only traverse the graph from the point of change. The system does not need to check every cell. The persistent data structures (with structural sharing) ensure that unchanged parts are not copied unnecessarily.

   Mapping the broad frame problem:

   - **Broad frame problem in the user's system**:
     - The problem of knowing which cells a plugin might read or write, and hence which dependencies to establish. The plugins declare their read and write sets, but these declarations are often incorrect. This leads to two issues:
          (a) Under-declaration: a plugin writes to a cell that it didn't declare, so that cell is not marked as invalid and its dependents are not recomputed (leading to stale data).
          (b) Over-declaration: a plugin declares that it writes to a cell it doesn't actually write to, causing unnecessary invalidations and recomputations.

     - **Correspondence**:
       - The broad frame problem is about the difficulty of determining the *actual* dependencies (what is relevant to what). In the user's system, the declared read/write sets are meant to define the dependencies (edges in the graph) but are often wrong. Thus, the system does not have an accurate dependency graph.

     - **Is the engineering solution a real solution?** 
       - The current solution (relying on plugin declarations) is not a complete solution because the declarations are often wrong. The user's team treats undeclared effects as bugs to be fixed (via on-call load). This is a workaround (reactive) rather than a proactive solution. The system does not automatically infer the dependencies; it relies on the plugin authors to declare them correctly. Therefore, this is a redescription of the problem: the system requires accurate declarations to avoid the frame problem, but the inaccuracies cause the frame problem to manifest as bugs.

   Now, the residue report:

   1. **What translates cleanly, term for term**:

      - **Narrow frame problem**: 
          - The problem of what does not change (the frame) is solved by the dependency graph and the invalidation mechanism. The graph defines the non-frame (what might change) and the frame (what definitely won't change) for a given change. The solution is efficient and automatic.

      - **Broad frame problem (partially)**:
          - The problem of determining relevance (which cells are affected by a plugin) is exactly the issue of having an accurate dependency graph. The declared read/write sets are the system's representation of relevance.

   2. **What translates with distortion**:

      - The user's system relies on the dependency graph being explicitly defined and maintained. The distortion comes from the fact that the graph is built by the system designers and plugin authors (who may make mistakes). 

      - The crux the user identified: 
          - The user gets to write the dependency graph because the system is authored by their team, and they can treat undeclared effects as bugs. In contrast, an agent in an open world has no such luxury: it did not author the world and cannot fix the "bugs" in the world's causal structure.

      - **Is that the real crux?** 
          - Yes. The difference is in kind: 
              - In the user's system, the dependency graph is a design-time artifact. The system is closed in the sense that the set of possible dependencies is bounded by the system's design and the plugin declarations (even if they are buggy). 
              - In the open world, an agent must learn and model the dependencies (the causal structure of the world) without a pre-defined graph. The world is not designed by the agent and may change in ways the agent has not anticipated. The agent must reason under uncertainty and with incomplete knowledge.

      - Therefore, the user's solution (dependency graph and bug fixes) does not address the open-world aspect of the frame problem. The philosophical frame problem includes the challenge of building and maintaining an accurate dependency graph in an open, unbounded, and unknown world.

   3. **What cannot be expressed at all**:

      - The philosophical frame problem includes the challenge of *discovering* the relevant dependencies in an open world where the agent has no prior knowledge (or incomplete knowledge) of the causal structure. 

      - In the user's system:
          - The dependencies are predefined (by the system and by plugin authors). 
          - There is no mechanism for the system to automatically discover that a plugin (or an external event) might have an effect on a cell that was not declared. The system does not learn new dependencies; it only reacts to declared ones (and when they are wrong, it breaks).

      - The open-endedness of the real world: 
          - The user's system is a closed environment. The set of cells is fixed. The set of plugins is known (though their behavior might be buggy). The real world does not have a fixed set of facts or a predefined set of actions. New entities and new types of interactions can emerge.

      - Therefore, the inability to handle novel, unforeseen dependencies (that were never declared and cannot be fixed by a bug report) is a fundamental gap.

   **Judgment on the residue**:

      - The residue (the part that cannot be expressed) is a blind spot in how the system (and the user's vocabulary) is designed. The system assumes that all dependencies can be known and declared at design time (or fixed when found). The open-world frame problem requires continuous discovery and updating of dependencies, which the system does not address.

      - However, note that the philosophical frame problem is often criticized for being ill-defined. The user's system is a well-defined engineering solution to a bounded problem. The residue (the open-world discovery of dependencies) is a fundamentally harder problem that may not have a clean engineering solution. But that does not mean the philosophical problem is ill-defined; it just highlights the difference between closed and open systems.

   **Final Verdict**:

      The residue (the part about discovering dependencies in an open world) is not expressible in the user's vocabulary and represents a blind spot. Therefore, the frame problem as a philosophical issue is not fully captured by the user's system. However, note that the user's system does solve the narrow frame problem and a bounded version of the broad frame problem.

      But the user asked for a single line: \answer{dissolved | relocated | untranslatable}

      - **dissolved**: if we think the problem is dissolved by the user's system (i.e., it's not really a problem anymore). We don't think so because the broad frame problem (in its open-world form) remains.
      - **relocated**: if the problem is relocated to a different part of the system (like the plugin declarations). This is true for the broad frame problem: the problem is relocated to the accuracy of the plugin declarations and the ability to fix them. But that doesn't solve the open-world aspect.
      - **untranslatable**: if there is a part that cannot be translated.

      The key residue (discovering dependencies in an open world) is untranslatable. Therefore, the overall verdict is that the frame problem (in its broad, philosophical form) is not fully translatable. However, note that the narrow version is translatable and solved.

      But the user's system does not address the open-world discovery, so the broad frame problem (as an open-world problem) is untranslatable. Therefore, we choose:

      \answer{untranslatable}

   However, note that the user's system does not even attempt to solve the open-world discovery. So the frame problem in its broadest sense is untranslatable because the system does not have the vocabulary for learning and adapting the dependency graph in an open environment.

   Let's write the answer accordingly.
answer: |-
  ### Translation of the Frame Problem into Your Vocabulary

  #### Stage 1: Narrow Frame Problem (Formal Theory of Action)
  - **Core Issue**: Explicitly specifying what an action does *not* change, avoiding the need to enumerate all unaffected properties.  
  - **Your System's Correspondence**:  
    - **Action** ↔ **User edit or plugin write**.  
    - **What changes** ↔ **Invalidated downstream cells**.  
    - **What does not change** ↔ **Non-downstream cells (the "frame")**.  
  - **Engineering Solution**:  
    Your dependency graph *solves* this:  
    - Invalidation propagates *only* along declared dependencies (downstream nodes).  
    - Non-downstream cells are preserved via structural sharing (copy-on-write).  
    - **Why it works**: The graph encodes "non-effects" implicitly; you never mutate non-invalidated cells. This is efficient and automatic.  
  - **Verdict**: **Real solution**—not a redescription. The graph topology defines the "frame" computationally.  

  #### Stage 2: Broad Frame Problem (Relevance in Belief Systems)  
  - **Core Issue**: Determining *which* stored facts/events are even *relevant* to a new event, avoiding brute-force checks across all beliefs.  
  - **Your System's Correspondence**:  
    - **Beliefs** ↔ **Derived cells**.  
    - **Relevance** ↔ **Actual dependencies** (which cells *should* be invalidated).  
    - **Declarations** ↔ **Plugin read/write interfaces** (which *claim* relevance).  
  - **Engineering "Solution"**:  
    You rely on plugin declarations to infer relevance (dependencies), but they are often wrong. You treat mismatches as bugs (on-call fixes).  
    - **Why it fails**: Declarations are heuristics, not ground truth. Undeclared reads/writes break cache coherence (e.g., stale data or wasted recomputation).  
  - **Verdict**: **Redescription of the problem**—declarations *are* the relevance mechanism, and their inaccuracy *is* the frame problem manifest.  

  ---

  ### Residue Report  
  1. **Clean Translation**:  
     - Narrow frame problem → Dependency graph invalidation.  
     - Actions/events → User edits/plugin writes.  
     - Non-effects → Structurally shared non-downstream cells.  
     - Beliefs ↔ Derived cells.  

  2. **Translation with Distortion**:  
     - **Crux**: Your assumption that dependencies can be **authored and debugged** (via declarations and bug fixes) distorts the philosophical frame problem.  
     - **Yes, your crux is correct and fundamental**:  
       - You operate in a **closed system**: Your team controls the graph, plugins are "fixable" artifacts, and errors are bounded.  
       - Philosophers address an **open world**: No "author" exists; agents cannot "debug" reality. Relevance must be inferred from scratch/experience.  
     - **Difference in kind**: Engineering relies on *design-time specifications* (declarations); philosophy deals with *runtime discovery* in unbounded uncertainty.  

  3. **Untranslatable Elements**:  
     - **Discovery of novel dependencies**: Your system cannot infer *new* dependencies (e.g., a plugin affecting an undeclared cell). You fix bugs reactively; philosophers seek proactive relevance detection.  
     - **Open-world uncertainty**: Concepts like "unanticipated side effects" or "emerging properties" have no analog—your cells and plugins are predefined.  
     - **Grounding relevance**: How does an agent *learn* what is relevant? Your graph is static; philosophy assumes a dynamic, unknowable world.  

  **Judgment**: The residue is a **blind spot** in how you think about software systems.  
  - Your vocabulary assumes **control and specifiability** (design-time graph, fixable declarations).  
  - The frame problem highlights that **relevance cannot always be pre-specified**—especially in open worlds. This is absent from your model.  
  - **Not ill-defined philosophy**: The residue exposes a limitation in *closed-world assumptions* for systems interacting with uncurated inputs (e.g., third-party plugins).  

  \answer{untranslatable}
