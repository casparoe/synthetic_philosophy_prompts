  Here's a joke crafted specifically for that archival bias, leaning on the wax seal absurdity:

  **Archivist 1:** (Pointing at stacks of pristine, sealed land deeds) "See this? The Fullerton Estate records are *perfect*. Not a single tenant complaint in 50 years. Model landlord, clearly."

  **Archivist 2:** (Sighing, pulling out a huge, battered logbook labeled "Incident Register - Unfit for Binding") "Model landlord? More like model *luck*. Remember that idiot clerk Jenkins? From '62 to '87 he only filed documents bearing the estate's *official wax seal*."

  **Archivist 1:** "So?"

  **Archivist 2:** "So the rent hikes and eviction notices came *with* the seal. The tenants' petitions, scrawled on tavern napkins or shouted through the rent collector's window? No seal. Jenkins literally tossed them out the back door into the pigsty. Said they 'lacked proper form.'"

  **Archivist 1:** "But... surely some formal complaint got through?"

  **Archivist 2:** "Old Man McGinty tried. Marched in here clutching a dead harbour seal *he'd* stamped with candle wax, demanding it count as 'official.' Jenkins called the constable. Filed the trespass report *because it had the constable's seal*."

  **Punchline:** **"History doesn't just silence dissent, sometimes it requires a notary and a blob of beeswax before it'll even listen."**

  **Why it works & the historical stretch:**

  1.  **Mechanical Bias Focus:** The punchline explicitly turns on the *absurd, literal mechanism* of the bias (the wax seal requirement), not just the power imbalance.
  2.  **Archive-Specific:** The humor relies entirely on the quirks of record-keeping: filing rules, binding protocols, clerk interpretations, and the physical nature of documents. It wouldn't work for, say, censorship of speeches.
  3.  **Highlights the Gap:** It makes tangible the disappearance of informal, oral, or non-elite disputes due to bureaucratic gatekeeping, not absence of conflict.
  4.  **The Stretch/Contested Read:**
      *   **The Absoluteness:** While wax seals *were* important markers of authenticity and formality, especially for legal deeds and official proclamations, it's highly unlikely a clerk would *systematically and exclusively* reject *all* non-sealed documents *for decades*, especially things like petitions or court records that might have other valid forms. Local archives often kept minutes, correspondence, loose petitions, and court records that lacked formal seals but were still deemed important.
      *   **The Counter-Example that Flattens it:** If research showed that this specific archive *also* meticulously kept separate "Complaint Registers," "Minutes of Petty Sessions," or bundles of unsealed tenant petitions from the same period, the joke's premise (that *only* sealed documents were kept, creating a false picture of harmony) falls apart. The punchline relies on the *completeness* of the silencing due to the filing rule. Evidence of *any* surviving non-sealed dissent records from the working class in that specific office would undermine the core absurdity the joke needs. The joke leans on the (likely exaggerated) image of a pedantic clerk applying a formal rule *so* rigidly that it functionally erased a whole class of disputes.
      *   **The Specific McGinty Scenario:** The dead seal is pure comedic absurdity to highlight the literalness of the rule, not historical reality.

  The humor comes from taking a plausible kernel (seals signified importance/formality, informal complaints are less likely to survive) and stretching the *application* of that rule to its most ridiculous, literal, and consequentially silencing extreme within the archive's own walls. It makes the systemic bias feel like the fault of a hilariously obtuse bureaucrat and his filing cabinet.
