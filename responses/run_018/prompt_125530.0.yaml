  Second, the apparent group fitness paradox. This is trickier. Darwin's solution lies in his "enduring stamp" argument - that instincts evolved for tribal benefit become ingrained as conscience. The Kesh case might demonstrate how these instincts can misfire in new contexts, not disprove their origin. 

  I should also note his distinction between "savage" and "civilized" morality - the Kesh forcing aid to distant strangers might represent an overextension of tribal instincts. Their survival cost could stem from applying small-group morality to large-scale societies. 

  Crucially, I must maintain that moral feelings feel binding because they are innate mental phenomena shaped by selection, not mere illusions. The user seems to want this nuance - they specifically warned against conceding morality as "just instrumental."

