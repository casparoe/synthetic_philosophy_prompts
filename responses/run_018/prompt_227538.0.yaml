prompt: |-
  Ok so I want a case analysis and I want it to actually bite in both directions. Take the Wells Fargo fake accounts scandal as the episode. Rough facts, correct me only if I've got something badly wrong: for years leading up to 2016, branch employees under intense pressure to hit cross-selling quotas (the internal slogan was basically that every customer should have eight products) opened checking and credit card accounts for customers without their consent, sometimes moving money between accounts to make them look active. When it blew up in 2016 the bank paid a $185 million regulatory fine, it came out that about 5,300 mostly low-level employees had been fired over the years for it, later reviews pushed the count of unauthorized accounts into the millions, and the CEO eventually resigned.

  Now the theory: the wireheading / reward tampering framework from the AI safety literature, with its usual distinctions -- specification gaming (technically satisfying the stated objective while violating its intent), tampering with the reward function itself, and tampering with the observation or feedback channel so the reward mechanism gets fed false inputs.

  Analyze the episode through that framework, and do it rigorously:

  1. Map the parts first. Who's the agent, what's the reward channel, where's the principal's intent vs. the stated objective. Then classify the fake-accounts behavior. My hunch is it's observation/feedback tampering rather than spec gaming, since opening a genuinely unauthorized account doesn't even satisfy the letter of the metric -- it falsifies the measurement. But argue the classification properly, don't just take my hunch, and say what hangs on it.

  2. Here's where I think it gets interesting: the standard framework assumes a well-meaning principal whose true intent the agent subverts. But Wells Fargo management designed the quota system, benefited from the inflated cross-selling numbers it could report to investors, and arguably got exactly what it actually wanted. So who tampered with what? Is there even a coherent "intended reward" here to tamper with? Say what the framework needs to add -- some distinction between a principal's stated reward function and its operative one -- to even describe this case, and whether adding it breaks anything else in the framework.

  3. Push on the wireheading concept itself: the employees weren't self-stimulating, they were trying to not get fired. Does wireheading analysis still apply when the "reward" is threat avoidance? Or does the framework quietly assume the agent wants reward for its own sake?

  4. Finally, run it backwards: what does the episode show about the framework? Does it suggest reward tampering is better modeled as a property of whole incentive systems than of rogue agents? Where is the framework just silent and you shouldn't force it to speak?

  Keep it organized by those four parts. No need for a bibliography or anything.
