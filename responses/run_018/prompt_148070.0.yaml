  Hmm, their core tension is fascinating: evolutionary biologists constantly use design-language (functions, adaptations) while rejecting intentional explanations. The user suspects this might be committing to a "free-floating ontology" of patterns. That's a sophisticated worry—it touches on the realism vs instrumentalism debate in philosophy of biology. 

  Let me unpack their three questions: First, they might be overlooking Dennett's teleonomic view of function. In Freedom Evolves, he argues selected effects are real patterns irreducible to physics but not intentional. Second, their weather vs markets analogy works beautifully for contrasting physical and intentional patterns, but less so for design stance (which is about evolved function, not just statistical regularity). Third, not citing texts is fine for a conceptual essay, though flagging Dennett's stance-dependent realism would strengthen it. 

  The user seems philosophically adept—they're noticing how stance-relativity challenges biological realism. Their "unstable" critique echoes Fodor's anti-adaptationism, but Dennett would retort that design patterns are stable when we assume an evolutionary design process. 

