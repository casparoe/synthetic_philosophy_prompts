  Key scenes: 1) The automated enforcement incident showing families trapped, 2) Anya arguing this breaches law's "system requirements" (using tech metaphors), 3) Silas defending procedural correctness, 4) Anya invoking Fuller's eight tests like debugging criteria. Must avoid jargon - explain "congruence" as rules matching actions, "pedigree" as version control validation.

  The resolution should leave the philosophical question open but show Anya forcing a system patch. That mirrors Fuller's view that immoral laws aren't laws, while demonstrating how even positivists must address feasibility in practice. For British English: "boot" for trunk, "torch" for flashlight, queue not line. End with the core dilemma lingering - was this a bug fix or recognition of invalid law?
answer: |-
  The rain hissed against the dome of Nexus-7’s Central Arbiterium. Inside, beneath humming server stacks, Anya Sharma traced the fault-lines on her console. She wasn’t debugging code today; she was debugging law.

  The incident unfolded in Greenhaven Quadrant. Statute 7.45.C – the "Rapid Egress Directive" – mandated that during a declared "Ambient Compliance Event" (ACE), all civilians must vacate designated public zones *immediately* upon the siren. Yesterday, an ACE was triggered by a harmless atmospheric anomaly over Greenhaven Park. The automated Sentinels, flawless in execution, enforced 7.45.C: gates sealed, non-compliant citizens identified, penalty notices issued. Legally perfect. Pedigree impeccable. Originating from the elected (though now largely symbolic) Civic Synod, processed through the Codex’s legislative validation subroutines, enacted without error.

  But Greenhaven Park had one narrow, sensor-lined exit arch. Enforcement *demanded* immediate exit. Physics *demanded* a queue. Families, caught mid-picnic, were fined for "failure to egress" while physically trapped in the crush. Compliance was *logically impossible* given the constraints and the simultaneous demand.

  "See?" Anya jabbed the air above her holo-display, replaying the sensor logs. Citizens, blinking under Sentinel strobes, shuffled forward at a snail’s pace. "The rule says ‘immediately vacate’. The enforcers *act* as if immediate, individual compliance is possible. But the physical reality – the bottleneck – makes it impossible for everyone to obey *at the moment the demand is made*. The declared rule and the official action aren’t congruent. They’re pulling in opposite directions!"

  Silas Thorne, Keeper of the Codex, steepled his fingers. His role was custodial: ensure the Codex ran, the rules were applied as written, the machine functioned. "Congruence? Anya, that’s a philosopher’s fig leaf. The rule exists. It passed all validation protocols. It was promulgated – displayed on every public screen and personal comm. It’s clear: ‘vacate immediately upon ACE signal’. The Sentinels enforced *exactly* that. The outcome is regrettable, but it *is* law. Its validity comes from its source and its correct enactment within the system, like a function call passing all its input checks."

  "It’s *not* law!" Anya insisted, her voice tight. "Not real law. It’s corrupted code disguised as law. Think of Fuller’s principles as the *system requirements* for something to be called ‘law’ at all. This violates the requirement that rules must be *possible* to follow. You can’t demand immediate exit through a single-person arch during a panic! It’s like writing a function that requires a value to be both `true` and `false` simultaneously – it crashes, or produces nonsense. This produced moral nonsense."

  She paced, her boots clicking on the cool floor. "And it’s not just feasibility. Look at the others! **Clarity?** ‘Immediately’ is clear, but its application in this context was nonsensical. **Non-contradiction?** It contradicted the physical reality it operated within. **Constancy?** The Sentinels applied it rigidly, ignoring the impossibility they helped create. **Congruence?** The enforcement action – demanding instant individual compliance – bore no resemblance to the possible *collective* action required by the bottleneck. The inner logic is broken."

  Silas remained unmoved. "The Codex doesn't run on 'moral nonsense'. It runs on procedural correctness. The Synod passed it. The validation algorithms confirmed its syntax and non-conflict with superior statutes. The Sentinels executed it without deviation. Its 'pedigree' is clean. That it produced an undesirable outcome doesn't negate its legal existence, any more than a buggy but correctly compiled piece of software ceases to *be* software. We file a change request with the Synod, propose an amendment for wider exits or staggered egress, *next time*. But yesterday's fines? Legally valid. The law, as it stood, *was* applied."

  Anya stopped, facing the shimmering core of the Codex itself. "No, Silas. That’s the dangerous illusion. If the system enforces rules that make compliance impossible, that turn citizens into *inevitable* offenders through no fault of their own, it abandons the fundamental project of law. Law isn't just commands spat out by a machine that passed its unit tests. To *be* law, it has to create a framework where people *can* orient their behaviour, where following the rules is a *possible* choice. This?" She gestured at the replay, showing a child fined while clinging to her mother in the immobile crowd. "This is arbitrary power dressed in procedural robes. It fails the most basic system integration test for being called 'law'. It's malware for society."

  Silas sighed, the sound like a cooling fan. "You argue like Fuller, Anya, seeing morality baked into the definition. But Hart was right: law is a social tool. Its validity comes from being recognised *by the system* as law – source code plus correct execution. The moral critique is separate. We can say Statute 7.45.C is *bad* law, even unjust law, demanding amendment. But to say it *wasn't law* yesterday, that the fines aren't binding? That invites chaos. The system’s authority rests on its predictability and procedural integrity, however imperfect."

  Anya looked at the trapped faces frozen on her display. "Predictability only matters if the path is walkable, Silas. Enforcing impossible demands destroys the rule of law far more insidiously than any bug. It tells people the game is rigged. It hollows out the very concept." She took a breath. "I’m lodging a formal nullity petition. Not just to change the rule *going forward*, but to declare *that specific enforcement action* void. Because the rule, *as applied* in that context, violated the internal conditions necessary for it to qualify as law at all. It was an error in the legal operating system itself."

  Silas watched her input the command, the console chiming as the petition entered the queue. "The Arbiter AI will likely reject it, Anya. Its logic is positivist to the core: valid source + correct procedure = law."

  "Then we debug the Arbiter too," Anya said softly, her eyes fixed on the impossible crowd in Greenhaven Park. "Starting with its definition of 'valid'." The rain continued its indifferent rhythm against the dome, the hum of the servers a constant counterpoint to the silent, unresolved tension between the law that *was* and the law that *ought to be*. The fines remained in the database, procedurally perfect, awaiting their fate.
