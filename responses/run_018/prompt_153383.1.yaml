  You are an expert in moral philosophy, with particular depth in the ethics of action, omission, and institutional decision-making. Before constructing anything, take a moment to brainstorm the core distinctions—doing versus allowing, direct versus indirect causation, and the role of agentive control—that will be relevant below. Think carefully, reason step by step, and then proceed.

  Construct a thought experiment meeting these specifications. Design a single-paragraph, realistic hospital-ICU scenario in which a physician's physical behavior is identical under two descriptions: according to the doctrine of double effect it counts as an indirect, permissible allowing-to-die, but according to a causal-structural view that rejects the doing/allowing distinction it counts as direct killing. The two theories must agree on every non-moral physical fact. To keep the case out of standard textbook territory, inject the following novel institutional feature: the life-sustaining resource is distributed by an automated allocation algorithm that operates in discrete, non-overlapping chunks, and the physician can only veto individual chunks rather than continuously modulate or withdraw the intervention. After presenting the scenario, demonstrate that it satisfies the specifications by giving the reasoning for each theory, explaining exactly why they diverge despite shared causal descriptions, identifying the chunked-veto structure as the feature doing the philosophical work, and stating whether removing that feature collapses the case into a conventional withdrawal-of-care example. Conclude by noting how a defender of the causal-structural view would attack the case. Answer in American English.
