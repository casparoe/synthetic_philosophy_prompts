  First, I need to unpack Strawson's core premise: the regress problem where any decision requires prior mental states that weren't self-chosen. The fictional character analogy seems perfect here - just as a character's traits are authored by the writer, our psychological makeup is "authored" by genetics and environment beyond our control. 

  The challenge is making this feel fresh. The nested authorship metaphor could work if I emphasize how each layer of the self (decisions ← character ← prior causes) mirrors how characters are nested within an author's drafts. Where writers might struggle is whether reasons-responsiveness offers an escape hatch. 

  I should note that compatibilists see reasons-responsiveness as sufficient for responsibility without self-origination, but Strawson would argue it just shifts the regress to "who authored the responsive mechanism?" The analogy fails there because real people aren't fictional constructs, but the causal point stands. 

  For the conclusion, I'll distill it to: True moral responsibility requires impossible self-creation since every aspect of ourselves traces to unchosen causes. That captures the essence while respecting the request to avoid presenting compatibilism as settled.
answer: |-
  Here is the argument structured as requested, pressing the "nested authorial regression" conceit while rigorously engaging Strawson’s core and acknowledging compatibilist counterpoints:

  ---

  ### The Argument from Nested Authorial Regression
  **Prologue: The Analogy**  
  Imagine your protagonist, Aris, wrestling with a moral dilemma. Every aspect of Aris—his hesitation, his principles, even his desire to "do the right thing"—is scripted by *you*, the novelist. His choices are narrative necessities, flowing from traits *you* implanted: childhood trauma in Chapter 3, genetic impulsiveness established in the prologue. Crucially, **Aris cannot rewrite his own origin story**; he encounters himself only in the "final draft" of his psyche. Now transpose this to the actual self.

  **The Regress of Authorship**  
  1. **Level 1: Decisions**  
  Aris chooses X over Y. But this choice expresses his pre-existing values (e.g., empathy > ambition).  
  → *Authorial Source*: Values were set by prior causes (e.g., parental influence, genetic disposition).  

  2. **Level 2: Values**  
  His "empathetic nature" arose from developmental conditions (e.g., mirror neuron function, early bonding).  
  → *Authorial Source*: Neurobiology + childhood environment—neither chosen nor self-created.  

  3. **Level N: The First Draft**  
  To avoid infinite regress, we seek an "uncaused cause" within Aris—a self-authored core trait (*causa sui*). But like a character who didn’t write his first line, **no such trait exists**. Every psychological element traces back to unchosen givens:  
  - Genetic code (authored by biological ancestry)  
  - Epigenetic/environmental imprinting (authored by circumstance)  
  - Foundational neural architecture (authored by evolutionary history)  

  **Where the Analogy Illuminates**  
  - **No *Causa Sui***: Just as Aris’s "will" is your creation, the human will is authored by conditions preceding it. Self-determination would require a "self" prior to the self—an absurdity.  
  - **No First Draft**: Traits aren’t self-selected; we inherit a psyche already "written" by non-agential causes. Responsibility demands authorship, but authorship always resides *outside* the character.  

  **Where the Analogy Might Fail & Compatibilist Rebuttal**  
  The analogy stumbles if **reasons-responsive mechanisms** could halt the regress. Compatibilists (e.g., Fischer) argue:  
  - Even if the *mechanism* for choice is causally determined, if Aris (or a person) can *recognize and act on reasons*, this constitutes control sufficient for responsibility—**without needing self-origination**.  
  - E.g., Aris’s empathy may be "authored," but if his psychology *coheres* (e.g., rejects racism after reflection), his choices are "his" in a morally relevant sense.  

  **Strawson’s Unmoved Core vs. Genuine Disputes**  
  - **Settled by Strawson**: The regress proves *ultimate* self-authorship is impossible. No one is *causa sui*; total control over one’s foundational nature is incoherent.  
  - **Genuine Contest**: Whether *any* form of control (e.g., reasons-responsiveness) is possible without self-origination. Strawson says *no* (it just pushes regress to "who authored the responsiveness?"). Compatibilists say *yes*—this *is* the control that matters. **This is not consensus; it is the crux of the debate.**  

  **Epilogue: The Character’s Lament**  
  Aris may rage against his creator—"Let me author *myself*!"—but his rage, too, is a line in your manuscript. So too with us: moral responsibility requires being the *uncreated creator* of the will, yet we are merely readers of a psyche authored by time, chance, and matter.  

  \answer{True moral responsibility is impossible because it requires being *causa sui*—an uncaused cause of one's entire will—yet every aspect of the self traces to unchosen genetic, environmental, and historical conditions, making ultimate self-authorship an incoherent fiction.}
