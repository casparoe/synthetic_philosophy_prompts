  The user should proactively concede that they're not claiming Smith anticipated modern science, that imagination plays a role, and that their reading is interpretive. This lowers defenses. The dangerous unasked question would be whether sympathy requires conscious deliberation, as Smith describes automatic processes that might contradict the "assessment" language. Preempting this by distinguishing fast coherence checks from slower moral reasoning could help.

