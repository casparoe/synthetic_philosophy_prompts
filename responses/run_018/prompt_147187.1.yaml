prompt: |-
  In a philosophy of mathematics seminar, a colleague dismissed my question about whether an uninterpreted constant in a formal axiom system possesses any semantic content prior to being assigned an interpretation in a model. He said only "meaning is use," and argued that since no mathematician has ever employed that bare symbol to prove or communicate anything outside of a specific interpretation, asking about its pre-interpretive meaning is like asking about the color of an invisible object. I suspect the slogan is being stretched beyond what it can bear, but I need help seeing exactly where the stretch happens. Could you disambiguate the precise claims hidden inside "meaning is use" — ranging from the trivial observation that word usage determines dictionary entries, to the stronger claim that semantic properties are reducible to dispositions in a linguistic community, to the radical view that there is no fact of the matter about meaning independent of actual practice — and for each reading indicate whether it is defensible, whether it genuinely supports dismissing my question about the formal symbol, and how it relates to the idea of family resemblance among language games? I want the different interpretations presented in sequence, with a note on which one my colleague was likely invoking, rather than a single authoritative exegesis. Please respond in continuous prose only, without headings, bullet points, bold text, or tables, as though you were composing a thoughtful letter.
