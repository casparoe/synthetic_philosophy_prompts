prompt: |-
  I wonder whether you would be willing to help me with something that has been troubling me since I took up tutoring A-level mathematics in retirement. My own working life was spent in experimental chemistry — nothing remotely connected with logic — and I have come to philosophy late, so I should be grateful if you would forgive any clumsiness with the vocabulary and correct it where you can.

  The practice I want to ask about is the marking of school mathematics. Candidates are told to 'show your working', and the mark schemes are built out of two distinct currencies: method marks, awarded for the steps of a derivation, and accuracy marks, awarded for getting the right answer. Several features of this practice strike me as hard to reconcile with one another. A candidate who writes down the correct answer and nothing else receives almost no credit, however right the answer is. A candidate who makes an early slip of arithmetic and then reasons impeccably from the wrong number still collects the later method marks — the examiners call this 'follow-through' — so the inference is judged against what the candidate actually had in front of him rather than against the truth. And in a 'show that' question, where the result to be proved is printed in the paper itself, what is being examined can only be the derivation, since the conclusion has already been settled by the authority of the exam board.

  Yet the same practice penalises a candidate who tries to *state* the licence for his step: one who writes, alongside P and if-P-then-Q, the further line that if P and if P then Q then Q, is given nothing for it and is, in my experience, quietly marked down for failing to understand what a proof is. Much the same happens with the word 'obviously': from a strong candidate it passes as a step, from a weak one it is treated as an unlicensed leap. And examiners will sometimes reject an inference for using a technique outside the syllabus — a calculus method on a paper that forbids it — even when the reasoning itself is impeccable, which suggests that what is being policed is whether a rule is *authorised* rather than whether it is *true*.

  This looks to me like Carroll's little dialogue about Achilles and the Tortoise turned into an institution, and I cannot tell what the institution thinks it is doing. So my question is: what view of what makes an inference justified does this practice presuppose?

  In particular, I should like to know the following. Does it strictly presuppose that the justification for a step is *rule-shaped* rather than *reading-shaped* — that the Tortoise's regress terminates in something which is not another proposition from which the conclusion might be drawn — or does it presuppose only the weaker, pedagogical claim that it is useful to keep the licence implicit? Are its parts mutually consistent: can a practice that follows through from a false premise also deduct accuracy marks for the same falsehood, and can it insist that every step be shown while penalising the candidate who shows the rule? Where is it underdetermined — could the truth-preservation view (a step is valid when it can never take you from truths to a falsehood), the view that rules are norms of a practice one is trained into, and the view that the laws of logic are merely the best-supported of our theories and revisable like any other, all keep exactly this mark scheme, and if so what is the smallest commitment common to them? And what would actually have to change in the marking if the first of those views replaced the one implicit now: would examiners check interpretations rather than steps, would a proof that the rules preserve truth become relevant to them, and would a scheme offering a bonus mark for every rule explicitly stated collapse into the regress?

  I have a tentative idea of my own which may be the wrong sort of thing altogether. In the laboratory we distinguished a reading from a calibration: you calibrate a balance against a standard weight, the calibration is not itself one more reading, and you cannot calibrate an instrument using only itself. The Tortoise, it seems to me, is demanding a calibration in the shape of a reading. Is that a useful way to put it, or does it merely relocate the mystery — and if the rules of inference really are to steps as a standard is to readings, what sort of thing is the standard, and should a mark scheme care whether it makes for true conclusions or only whether it is the one in force?
reasoning: |-
  Okay, let me start by unpacking the user's query. They're a retired experimental chemist now tutoring A-level math, struggling with the logic behind exam marking practices. They've noticed contradictions in how method vs. accuracy marks are awarded, and how inferences are treated. Their analogy to Lewis Carroll's Tortoise points to a deeper philosophical confusion about justification in logic.

  First, I need to map their core observations: 
  - Correct answers without working get no credit
  - "Follow-through" marks reward valid reasoning from wrong premises
  - "Show that" questions prioritize derivation over truth
  - Stating inference rules (like modus ponens) is penalized
  - "Obviously" is context-dependent
  - Syllabus restrictions override logical validity

  The user's lab analogy (calibration vs. reading) is insightful. I should validate that while explaining why it doesn't fully resolve the institutional practice. The marking scheme isn't about truth preservation but about assessing trained behavior within a system. 

  Key philosophical tensions:
  - Practice-based vs. truth-based justifications
  - Implicit vs. explicit rule invocation
  - Pedagogical efficiency vs. logical purity

  The user's hidden question seems to be: "Is this marking scheme logically incoherent or just pragmatically necessary?" I should address both angles. The practice makes sense as competency assessment but fails as epistemology. Their calibration analogy works if we see syllabi as arbitrary "standards" - but that's uncomfortable for math which feels universal.

  I'll structure the response by:
  1. Affirming their observations as accurate depictions of real practice
  2. Explaining the institutional logic (pedagogy, assessability)
  3. Analyzing the philosophical presuppositions (practice-normativity)
  4. Testing alternative theories against the scheme
  5. Engaging their calibration analogy thoughtfully

  Must avoid philosophy jargon while being precise. Their chemistry background makes the calibration analogy powerful - I should extend it by noting how exam boards act like "standard weights" for reasoning. The tragic note is that math isn't really like instrument calibration; the marking scheme treats it that way for practical reasons.

  The deepest issue they're circling: Can logic be reduced to trained performance? The marking scheme presupposes "yes" - hence penalizing explicit rule statements as "missing the point." But that clashes with math's truth-claims. I'll suggest this tension is inherent in institutional assessment.
answer: |-
  Your observations are remarkably astute, and your analogy to Carroll's Tortoise is deeply insightful. You've identified a genuine tension at the heart of assessment practices in school mathematics. Let's dissect the presuppositions and reconcile the apparent contradictions.

  ### The Core Presupposition: Practice-Normativity, Not Truth-Preservation
  The marking scheme presupposes a **practice-based, norm-driven view of justification**, not a purely semantic or truth-functional one. It treats mathematical inference as a *learned skill governed by authorized norms within a specific pedagogical context*. The "justification" for a step isn't primarily about its universal logical validity, but about whether it correctly applies an *authorized procedure within the sanctioned curriculum*.

  This explains the key features:
  1.  **"Show your working" & Penalizing Correct Answers without Work:** The goal is assessing *the process of applying learned methods*, not just factual recall or lucky guesses. The candidate must demonstrate they *know and can execute the sanctioned procedure*.
  2.  **"Follow-Through" (FT) Marks:** This rewards *correct execution of the learned procedure* even from a wrong premise. It assesses the *skill of reasoning sequentially* according to the rules, not the ultimate truth. FT marks validate: "Given *your* starting point (even if wrong), did you proceed *correctly* by our rules?"
  3.  **"Show that" Questions:** The focus is entirely on demonstrating *mastery of specific authorized techniques* to derive a known result. The authority isn't the truth of the conclusion (which is given), but the exam board's syllabus dictating *which paths* are valid for demonstration.
  4.  **Penalizing Explicit Rule Statements (e.g., Modus Ponens):** Explicitly stating the rule is seen as *misunderstanding the task*. The task is to *apply* the implicit rules of the practice, not to *comment* on them. It's akin to a footballer stopping to quote the offside rule mid-play instead of playing on. The "licence" is granted by training and syllabus authorization, not by its explicit assertion. Stating it is redundant within the practice and often indicates the candidate doesn't grasp that the rules are *constitutive* of the activity.
  5.  **Context-Dependent "Obviously":** "Obviously" is acceptable only if the examiner judges that step *would be obvious to a competent practitioner trained in this syllabus*. It relies on shared normative understanding, not absolute simplicity.
  6.  **Rejecting Out-of-Syllabus Correct Methods:** This is the clearest evidence. The justification is *not* "Is this inference truth-preserving?" but "Is this inference *authorized* by the syllabus?" The practice polices adherence to the *institutional norms* of the specific course, not universal logical validity.

  ### Addressing Your Specific Questions
  1.  **Rule-Shaped vs. Reading-Shaped Justification:** It strictly presupposes **rule-shaped justification terminating in authorized practice**. The Tortoise's regress is avoided because the rules are not propositions needing further justification *within the examined practice*. They are the bedrock norms the candidate is trained to apply implicitly. Explicitly stating them (making them "reading-shaped") is stepping outside the practice of *doing* math under exam conditions and into meta-commentary, which is penalized.
  2.  **Mutual Consistency:**
      *   **FT Marks vs. Accuracy Marks:** Consistent under practice-normativity. The Accuracy Mark (A) assesses getting the *final numerical/symbolic answer* correct (adherence to truth/reality). The Method Mark (M) assesses performing the *sanctioned steps correctly* (adherence to practice). An early slip loses the A mark (wrong answer) but doesn't preclude M1 for step 1 (if performed correctly) or M2 for step 2 (performed correctly *relative to the output of step 1*). They assess different norms: correctness-of-outcome vs. correctness-of-procedure.
      *   **Insisting on Steps vs. Penalizing Rule Statement:** Consistent. The required "steps" are applications of authorized procedures *to the mathematical objects*. Stating the rule governing the step is not an application *within* the mathematical argument; it's a meta-statement about the practice itself, violating the implicit norm that the rules remain background.
  3.  **Underdetermination & Alternative Theories:**
      *   **Truth-Preservation View:** Could *not* maintain the exact scheme. It would care *only* about whether the conclusion is true given the premises. Correct answers without working might get full credit. Out-of-syllabus valid methods would *always* be accepted. FT marks would be incoherent (reasoning correctly from false premises isn't truth-preserving). Stating rules like Modus Ponens would be irrelevant noise, not penalized.
      *   **Rules-as-Norms-of-Practice ("Trained Into"):** **Exactly fits** the scheme as described. This is the implicit view.
      *   **Laws-of-Logic-as-Revisable-Theories:** Could *mostly* fit, but with tension. The syllabus represents the "current best theory" students must master. FT marks still make sense (applying current theory correctly). Penalizing out-of-syllabus methods makes sense (not using the current theory). Penalizing rule statements might be softened if logic itself is seen as theoretical, but likely persists as it's still meta-commentary irrelevant to *applying* the theory. The key difference: under revisability, the syllabus *could* change based on logical discoveries, but the marking scheme itself wouldn't reflect that revisability internally.
      *   **Smallest Common Commitment:** **Assessment of competence in applying a specific, predefined set of inferential procedures.** The scheme cares that the candidate knows *how to use the authorized tools correctly*, not about the ultimate metaphysical justification of those tools.
  4.  **If Truth-Preservation Replaced Practice-Normativity:**
      *   **Examiners** would check interpretations/meanings and truth conditions, not specific syntactic steps. Does the conclusion *follow* from the premises, regardless of the steps taken?
      *   **A proof that the rules preserve truth** would become highly relevant, perhaps even part of the syllabus. Understanding *why* the rules work might be assessed.
      *   **A "bonus mark for every rule" scheme** would indeed collapse into a regress or become trivial. Awarding a mark for "P, Q, ∴ P∧Q (Conjunction Introduction)" invites the question: Why is CI valid? Stating the truth table for ∧? Then why is *that* valid? The scheme relies on the rules being the stopping point. Making them explicit bonuses undermines that. Truth-preservation focuses on the *connection* between premises and conclusion, not the labelling of the steps.
  5.  **Your Calibration Analogy:**
      *   **Usefulness:** This is an **excellent and insightful analogy**. Calibration (the rule) establishes the framework for valid readings (the steps/results). Demanding the calibration *as part of the reading* (like the Tortoise demanding the rule as a premise) confuses levels. The rule *enables* the step, it isn't *another step within* the derivation it governs.
      *   **Relocating the Mystery?** A little, but fruitfully. It moves the mystery to: *What is the nature/status of the "standard" (the rule)?* Within the *institutional practice* of exam marking, the "standard" is simply **the authorized syllabus and the trained competence it represents**. The examiner acts as the guardian of this standard.
      *   **What is the Standard? (Truth vs. Authority):** This is the crux. Philosophically, logic aims for truth-preservation. Pedagogically and institutionally, the "standard" *is* the authorized syllabus. **The mark scheme primarily cares that the candidate uses the *authorized standard in force*, not whether that standard is metaphysically correct.** The justification is ultimately pragmatic and pedagogical: We train students in these specific norms because they are (a) historically successful, (b) foundational for further study, and (c) assessable consistently. The hope is that the authorized rules *are* truth-preserving, but the scheme doesn't examine *that*; it examines the ability to *use* them.

  ### Conclusion: The Institution's View
  The institution implicitly views mathematical justification as **correct performance within a norm-governed practice**. The "rules of inference" are akin to the rules of a game or the standards of a craft. Justification terminates in the competent application of these authorized norms, learned through training. The marking scheme assesses this *performative competence*:

  1.  **Method Marks:** Awarded for correctly executing an authorized "move" within the practice.
  2.  **Accuracy Marks:** Awarded for the end result aligning with the expected outcome (the "winning state" or "correct product").
  3.  **Follow-Through:** Assesses the ability to keep "playing correctly" even after an early mistake.
  4.  **Rejecting Out-of-Syllabus Methods:** Upholds the boundaries of *this specific game*.
  5.  **Penalizing Rule Statements:** Treats explicit rule invocation as a failure to engage properly in the practice – it's talking *about* the game instead of playing it.

  Your calibration analogy perfectly captures the hierarchical relationship between the rule (calibration) and the step (reading). The mark scheme cares that the candidate uses the *authorized calibration*, not that they philosophize about it. The tension arises because mathematics *aspires* to universal truth, but its *pedagogical assessment* is necessarily grounded in specific, contingent norms and practices. This pragmatic focus on demonstrable, syllabus-bound competence explains the seeming contradictions you observed. You've pinpointed the inherent clash between pure logic and the messy reality of institutional education.
