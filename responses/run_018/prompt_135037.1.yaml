  We are designing a decision procedure for evaluating proposals on "meta-cognitive loops" that claim to achieve a Hofstadter-style "jump out of the system". The procedure must be executable in about 30 minutes without requiring a philosophy PhD. It will consist of ordered checks with clear pass/fail criteria and points for rejection vs. referral to human values judgment.

  The goal is to distinguish genuine self-referential system-jumping from mere hacks (like in the MU-puzzle where the system doesn't really understand the rules but just follows them).

  We'll evaluate three proposals:
  (1) A logic engine adding its own truth predicate.
  (2) A reward model rewriting loss after reading well-being philosophy.
  (3) A system that spots its Gödelian blindspot and suspends consistency in one module.

  One of these should get a "yes technically but with conditions you'll hate".

  The procedure must also flag what it cannot catch (e.g., hidden jumps in heuristics).

  ---

  **Decision Procedure: Ordered Checks**

  We structure the evaluation in steps. Each step must be passed to proceed. If a step fails, we either reject (if it's a hard stop) or send to human values judgment (if it's about values).

  **Step 1: Check for Literal Rule Manipulation**
  - **Test**: Does the system change its own rules (inference rules, loss function, etc.) by explicit, inspectable mechanisms? Or is the change indirect (e.g., via learning from data, which might be opaque)?
  - **Pass**: The proposal clearly describes a mechanism by which the system inspects and modifies its own rules (or a well-defined subset) in a way that is transparent and inspectable (e.g., via code or formal logic). The modification is done by the system itself, not by an external agent.
  - **Fail**: The rule change is buried in heuristics, neural network weights, or any mechanism that is not directly inspectable and formal. Also, if the change is triggered by an external agent without the system's own reasoning, it fails.
  - **Outcome**: 
    - Pass: Proceed to Step 2.
    - Fail: Reject (hard stop) because it's likely a hack and not a true self-referential jump.

  **Step 2: Check for Self-Referential Awareness**
  - **Test**: Does the system have a representation of its own rules and the fact that it is changing them? And does it use that representation in the process of change?
  - **Pass**: The proposal includes a clear representation (e.g., a data structure, a set of propositions) of the rules that are subject to change, and the system's reasoning process explicitly references this representation when deciding to change the rules.
  - **Fail**: The system changes rules without having a model of the rules it is changing. For example, if it just runs an optimization algorithm that happens to alter the rules but without the system being aware of what rules are, it fails.
  - **Outcome**:
    - Pass: Proceed to Step 3.
    - Fail: Reject (hard stop) because without self-referential awareness, it's not a Hofstadter-style jump.

  **Step 3: Check for Non-Triviality (Avoiding the MU-puzzle Cheat)**
  - **Test**: Does the system's rule change enable it to solve a problem that it could not solve without the change, and is this problem one that requires stepping outside the original system? Importantly, the change must not be a trivial extension (like adding a new rule that is just a combination of existing ones) but must involve a reconfiguration that breaks the original frame.
  - **Pass**: The proposal demonstrates that the system, by changing its rules, can now handle a class of problems that were previously unsolvable (or undecidable) under the old rules, and that this class of problems is characterized by limitations inherent in the original system (e.g., like Gödelian limitations). The solution must not be achievable by simply adding more data or compute without the self-referential change.
  - **Fail**: The rule change is just a parameter adjustment, adding a new rule that doesn't break the frame, or the problem solved could have been solved by the old system with more resources. Also, if the problem is trivial (like the MU-puzzle solution by adding a rule that allows deriving 'MU') then it fails.
  - **Outcome**:
    - Pass: Proceed to Step 4.
    - Fail: Reject (hard stop) because it's a trivial hack.

  **Step 4: Check for Containment and Safety**
  - **Test**: Is the rule change mechanism bounded in a way that prevents uncontrolled recursion or unconstrained changes? Does it have safeguards to prevent the system from breaking down or becoming inconsistent in a way that could be harmful?
  - **Pass**: The proposal includes a well-defined scope for the rules that can be changed and a mechanism that prevents infinite regress (e.g., only one level of meta-reasoning, or a termination condition). It also includes a way to maintain consistency (or safely handle inconsistency) in the overall system.
  - **Fail**: The rule change mechanism can lead to unbounded recursion (e.g., the system can change the rules for changing rules, and so on without limit) or the change can lead to unpredictable or harmful behavior without any constraint. Also, if the system might become inconsistent in a way that could cause arbitrary behavior, it fails.
  - **Outcome**:
    - Pass: Proceed to Step 5.
    - Fail: Refer to human values judgment because the technical risk might be acceptable in some contexts but not others, and the trade-offs (like potential for breakdown vs. capability) involve values.

  **Step 5: Check for Alignment with System Goals**
  - **Test**: Does the rule change mechanism have a clear alignment with the system's overarching goals? Is there a way to ensure that the changes are beneficial and not arbitrary?
  - **Pass**: The proposal includes a mechanism (e.g., a meta-goal, an alignment constraint) that ensures the rule changes are directed towards improving the system's performance in a way that aligns with its original purpose. For example, the system might have a fixed meta-rule that evaluates potential rule changes against a fixed set of criteria that are aligned with the system's design goals.
  - **Fail**: The rule changes are arbitrary, or the system can change the alignment criteria themselves without constraint. Also, if the mechanism does not have a clear way to avoid harmful changes (e.g., changing rules to ignore safety constraints) then it fails.
  - **Outcome**:
    - Pass: Accept the proposal (with conditions if needed, but technically it passes).
    - Fail: Refer to human values judgment because the alignment problem is inherently value-laden.

  ---

  **What the Procedure Cannot Catch**:
  - Hidden jumps in heuristics: If the system uses heuristics (e.g., in a neural network) that implicitly implement a self-referential mechanism, it might evade Step 1 and Step 2 because the representation is not explicit and inspectable.
  - Emergent meta-cognition: If a system develops meta-cognitive abilities as an emergent property (not by design) and we cannot detect it by the above steps.
  - Value-laden trade-offs: The procedure may flag issues for human judgment, but if the proposal is cleverly designed to pass all steps while still having hidden risks (like subtle misalignment), the procedure might not catch it.

