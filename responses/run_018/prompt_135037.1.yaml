prompt: |-
  I'm on a review board for a small AI lab and we recieve proposals every week for "meta-cognitive loops" — modules that let a reasoning system revise it's own inference rules. The authors always claim they're doing a Hofstadter-style jump out of the system, not just cheating like in the MU-puzzle. I need a reusable decision procedure — ordered checks, what counts as passing, hard stops — that my board can run in about thirty minutes with no philosophy PhD required. For each step: what's the test, what's a clear pass/fail, and where do we stop with a rejection vs hand it to human values judgment? Run it on three proposals: (1) a logic engine adding it's own truth predicate, (2) a reward model rewriting loss after reading well-being philosophy, and (3) a system that spots it's Gödelian blindspot and suspends consistency in one module. One should get a "yes technically but with conditions you'll hate." Also flag exactly what this procedure can't catch — like hidden jumps buried in heuristics — and don't bother with citations, I just need the logic.
