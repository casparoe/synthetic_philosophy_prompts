prompt: |-
  im drafting the spec sheet for a theory of repugnant markets, and i want it deep in the weeds, not the usual surface stuff. write the desiderata: what must any adequate theory explain or preserve? cover the standard cases (kidney sales where supply is price-elastic, insulin price-gouging with captive buyers, vote-selling in proxy systems, paid surrogacy where banning drives underground markets, carbon-offset accounting that turns moral duty into a ledger entry). but also inject the edge cases people skip: goods with a discontinuous conversion threshold where partial pricing is tolerated but past a point the good collapses rather than degrading linearly - think blood donation vs paid plasma, or friendship favors that become service contracts once cash appears. for each desideratum flag if it's negotiable or hard, and point out conflicts - e.g. requiring that commodification always corrupts the social meaning of the good blocks you from explaining why legal surrogacy contracts sometimes protect dignity better than prohibition. also the theory must distinguish degradation of the good itself from degradation of the participants, since those come apart in cases like... well, you fill that in. finally, which single requirement does the most damage to the pure welfare-economics view that repugnance is just status anxiety or hidden information costs? keep it focused - this preps me for a seminar where half the room are economists who think markets solve everything and the other half are philosophers who think every price is a moral insult.
reasoning: |-
  Okay, the user is drafting a spec sheet for a theory of repugnant markets and wants it to be very detailed. They mention covering standard cases like kidney sales, insulin pricing, vote-selling, surrogacy, and carbon offsets. But they also want edge cases like discontinuous conversion thresholds—things like blood donation vs. paid plasma or friendship favors turning into service contracts when money is involved. 

  First, I need to recall what makes a market "repugnant." It's not just about supply and demand; it's about goods that people feel shouldn't be commodified. The user wants desiderata—what the theory must explain. They also want to flag what's negotiable vs. hard, point out conflicts, and highlight where commodification doesn't necessarily corrupt the good.

  The user mentioned conflicts, like how banning surrogacy might drive it underground, which can be worse. So the theory needs to handle cases where markets might actually protect participants better than prohibition. Also, distinguishing between degradation of the good itself vs. the participants. For example, in paid plasma, the plasma itself isn't degraded, but the act of selling might degrade the donor's experience or social perception.

  Edge cases: discontinuous thresholds. Blood donation is seen as altruistic, but paying for plasma is accepted. Why? Maybe because plasma is used for products, not direct transfusion. Friendship favors—once cash is involved, the social meaning shifts entirely. The theory needs to explain that tipping point.

  The user also wants to challenge the welfare-economics view that repugnance is just status anxiety or information costs. So which desideratum does the most damage to that view? Probably the "Non-Fungibility and Social Meaning Collapse." If a good's meaning can't be commodified without collapsing its value, that's not just about anxiety; it's intrinsic to the good's nature.

  Conflicts between desiderata: For example, preserving social meaning might conflict with participant welfare in surrogacy. Legal contracts might protect surrogates better but alter the social perception of childbirth. The theory needs to navigate that tension.

  Also, the user's audience is economists and philosophers. Economists might focus on efficiency, philosophers on moral degradation. The theory must bridge these views, showing where markets fail beyond inefficiency and where they might be necessary evils.

  Need to include examples for participant vs. good degradation. Like professional cuddling: the service might be provided without degrading the participant, but the good (comfort through touch) might lose its perceived sincerity. Or art commissions vs. mass production—artisans might not be degraded, but the uniqueness of the art could be.

  Make sure each desideratum is clearly defined, with negotiability and conflicts noted. The last point about attacking welfare economics should be strong. Non-fungibility directly challenges the idea that everything can be commodified, which is fundamental to market-based solutions.
answer: |-
  Here’s a deep-descriptor spec sheet for a theory of repugnant markets, designed to force engagement with under-discussed complexities and tensions. Each desideratum targets a specific failure mode of simplistic accounts.

  ---

  **Desiderata for a Theory of Repugnant Markets**  
  *(Non-Negotiable = ★, Negotiable = ◇)*

  1.  **Commodification-Induced Meaning Collapse:**  
      Must explain why commodification *destroys* the intrinsic social meaning/value of certain goods beyond mere price effects.  
      - *Standard Cases:* Paid friendship (collapses trust), direct vote-selling (collapses civic duty).  
      - *Edge Case:* **Discontinuous Thresholds** (e.g., blood donation (altruistic ritual) vs. plasma (industrial input): Pricing *below* a threshold (compensation for time/risk) is tolerated, but payment *as market wage* collapses the good’s symbolic value as a "gift of life."  
      - *Conflict:* ◇ Contradicts cases like **professional surrogacy** where regulated markets *preserve* dignity (vs. exploitative informal arrangements under bans). Hard constraint for "meaning absolutists."  
      - *Targets:* Welfare economics (denies meaning as irreducible).

  2.  **Participant Degradation vs. Good Degradation Distinction:**  
      Must separate harm to *sellers/participants* (exploitation, coercion) from corruption of the *good itself* (loss of social meaning/function). These often diverge.  
      - *Standard Cases:* Kidney sales (participant degradation via exploitation) vs. Carbon offsets (good degradation: moral duty → ledger entry).  
      - *Edge Case:* **Professional cuddling/therapeutic touch:** Degradation *of the participant* is mitigated by professional boundaries and consent, but the *good* (non-commodified intimate touch/comfort) is corrupted into a service.  
      - *Conflict:* ★ Failure here collapses all repugnance into exploitation debates, missing symbolic collapse (e.g., objections to markets in Nobel medals).

  3.  **Market Structure Dependence:**  
      Must explain why repugnance is sensitive to *market design*, not just the good itself. Identical goods can be repugnant in one structure, acceptable in another.  
      - *Standard Cases:* Prohibiting kidney *sales* but allowing paired *donation* chains; regulated surrogacy vs. black markets.  
      - *Edge Case:* **"Gift-Wrapped" Commodification:** Paying for "friendship services" via corporate loyalty programs (acceptable) vs. direct cash-for-friendship apps (repugnant). Structure mediates perception.  
      - *Conflict:* ◇ Challenges theories claiming repugnance is inherent to the good. Requires granular institutional analysis.

  4.  **Price Elasticity ≠ Moral Permissibility:**  
      Must explain why high price elasticity of supply (e.g., kidneys) *intensifies* repugnance concerns (exploitation risk) but doesn’t *determine* repugnance (e.g., insulin gouging has inelastic demand but is repugnant due to captivity, not elasticity).  
      - *Standard Cases:* Kidney sales (elastic supply → exploitation) vs. Insulin (inelastic demand → "desperation rent").  
      - *Edge Case:* **Vintage cemetery plots:** Highly inelastic supply (finite), low demand elasticity (sentimental value), yet resale markets often repugnant (desecration symbolism ≠ economic dynamics).  
      - *Targets:* ★ Pure welfare economics conflates efficiency gains with moral permissibility. Elasticity is a *modifier*, not a *justification*.

  5.  **The Prohibition Paradox:**  
      Must account for why banning a repugnant transaction can *increase* net harm (e.g., black markets) or *decrease* welfare without resolving the core repugnance.  
      - *Standard Cases:* Surrogacy bans → exploitative underground markets; Prohibiting vote-selling doesn’t eliminate quid-pro-quo corruption.  
      - *Edge Case:* **Rare artifact black markets:** Banning sales protects cultural heritage (reduces theft) but fuels criminal networks and destroys provenance (increasing net harm to the good’s integrity).  
      - *Conflict:* ◇ Creates tension between deontological (ban = moral imperative) and consequentialist (ban = worse outcomes) positions. Theory must weigh both.

  6.  **Contingent Repugnance & Cultural Arbitrage:**  
      Must explain why repugnance is culturally/historically contingent *but not arbitrary*, and how markets exploit these differences (e.g., medical tourism).  
      - *Standard Cases:* Commercial surrogacy banned domestically but outsourced to lower-income countries.  
      - *Edge Case:* **Human hair trade:** Selling one’s hair is non-repugnant in some cultures (India - temples, sacrifice) but repugnant if framed as exploitation of poverty in global markets. The *same act* flips valence based on framing and context.  
      - *Conflict:* ★ Challenges universalist moral theories; requires thick contextual description without relativism.

  7.  **The Single Most Damaging Desideratum to Welfare Economics:**  
      **Non-Fungibility and Social Meaning Collapse (Desideratum 1).**  
      *Why it devastates pure WE:* Welfare economics assumes all goods are fundamentally *fungible* – their value is reducible to preferences revealed by WTP/WTA. Desideratum 1 asserts that for certain goods, market exchange *destroys the very value* economists seek to measure. Pricing isn’t just revealing preferences; it’s annihilating the good’s social ontology. No amount of "revealed preference" or "efficiency" can compensate if the act of pricing converts a sacred/meaningful good into a profane/meaningless commodity. This is not "status anxiety" (which WE could incorporate as a preference) but a *categorical transformation*.

  ---

  **Key Theory Conflicts to Resolve:**
  *   **Meaning Preservation vs. Participant Protection:** When does prohibiting a market to preserve a good’s meaning (e.g., bans on direct organ sales) actually harm vulnerable participants more (e.g., driving them to riskier transactions)? How to trade off symbolic integrity against bodily welfare?
  *   **Universalism vs. Contingency:** How can the theory identify *objective* harms (e.g., exploitation) while accounting for *culturally specific* repugnance without collapsing into relativism?
  *   **Efficiency as Red Herring:** Why do efficiency arguments fail to mollify repugnance even when valid (e.g., a well-designed kidney market *would* save lives)? The theory must explain why efficiency is often morally irrelevant or even antagonistic.

  This spec forces the theory beyond "markets are good/bad" to grapple with *how specific market structures interact with social meaning, power, and human vulnerability* in ways that generate (or resolve) moral revulsion. It demands a framework that’s both institutionally granular and philosophically robust – precisely the ammunition needed for your seminar trench warfare.
