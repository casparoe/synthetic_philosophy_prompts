prompt: |-
  I'm taking a class on comparative memory politics and I'm stuck on something that seems like a pure philosphy problem disguised as policy. In Germany, Vergangenheitsbewältigung is built into the instutitional machinery: the state spends enormous amounts maintaining concentration camp sites as active educational spaces, students are basically required to go, and the framing is always about ongoing collective responsibility rather than past-tense closure. But then you look at Japan, where state curriculum standards basically sidestep Unit 731 or comfort women memorials, and in Turkey there's actual legal risk for museums or schools that center the Armenian genocide, with the official narrative treating it as a betrayal of national identity. Meanwhile in the American South, Confederate monuments stayed up for decades with state funding framed as heritage, and even now when they're moved to museums the framing is usually about contextualizing rather than atoning. So here's what I can't figure out: what theory of collective moral agency do these different institutional practices actually presuppose? Does Germany's model only make sense if you think nations are literally continuous moral persons that inherit guilt, or can it work on a thinner view about present citizens having special obligations? And is Japan/Turkey/South's avoidance consistent with denying collective agency altogether, or do they smuggle in a different ontology—like nations are pure cultural containers that should protect their narrative coherence? I want someone to reconstruct the implicit metaphysics and ethics of memory policy here, say which practices are philosophically consistent with each other and which ones quietly contradict themselves, and tell me whether there's a coherent middle ground that doesn't require treating the nation as a literal person.
