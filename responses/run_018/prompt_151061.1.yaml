  I should clarify that disjunctivism distinguishes between the metaphysics of experience and the epistemology. Hallucinations have phenomenal character but lack the relational aspect. So, it's not eliminativism; it's a different ontological account. 

  The user might be conflating no common factor with no experience at all. By emphasizing that hallucinations are genuine experiential states, just not identical in kind to veridical ones, the confusion can be resolved. Also, highlighting the distinction between metaphysics and subjective indistinguishability is key here. 

