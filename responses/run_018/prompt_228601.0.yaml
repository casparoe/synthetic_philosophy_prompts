prompt: |-
  I'm a TA for a second-year undergrad course called Ethics and the Arts, and I'm grading a stack of short essays over the weekend. Act as an experienced philosophy instructor with expertise in ethics and aesthetics who's seen every trick students pull. I want a careful, claim-by-claim grading report, not a general impression, and I want it in British English please.

  Here's the essay question I set:

  "Do filmmakers and historical novelists owe anything morally to the real dead people they dramatise? If the dead cannot be harmed, does it follow that 'anything goes' in their portrayal? Discuss with reference to the posthumous harm debate and at least two normative ethical frameworks."

  And here's the student's answer, verbatim:

  ---
  Legally and morally, dramatists owe nothing to the dead themselves, because the dead no longer exist as subjects who can hold interests. Parfit's work on the non-identity problem showed that we cannot harm people who do not exist at the time of the act, and this applies a fortiori to the dead. The law bears this out: defamation claims cannot be brought on behalf of the deceased, so a biopic can say what it likes about someone once they are gone. Since the law tracks morality in this area, the only genuine obligations run to the living: the feelings of descendants, and the epistemic interests of audiences who might come away with false beliefs about historical events.

  A utilitarian would reach much the same conclusion. Harm requires experience, the dead experience nothing, so dramatists should weigh only effects on the living. A utilitarian might still condemn fabrications that mislead audiences about matters of public importance, since false beliefs about the past can do real damage downstream. A Kantian, by contrast, grounds duty in respect for rational nature; since the dead are no longer rational agents, a Kantian must be indifferent to how they are portrayed, caring only about what dramatising them does to the living. So on both major frameworks the answer converges: anything goes with respect to the dead themselves, with constraints arising only from the interests of the living.

  There is one wrinkle: promises and dying wishes. If someone extracts a promise about how they will be portrayed, breaking it seems wrong even though no one is harmed by the breach, which suggests our moral practice already treats the dead as considerable. But this can be explained away: the wrongness lies in damaging the institution of promising, which matters to the living who rely on it.

  Conclusion: artistic licence is a moral permission, not merely an aesthetic convention, and the dead are owed accuracy only as a means to serving the audience's interest in truth.
  ---

  Before you grade, do a quick brainstorm of what a fully correct answer would need to cover, then grade this one against that. Please:

  - Go through the answer claim by claim and tell me what's right, what's subtly wrong, and what's a step that doesn't follow. Be specific enough that I can paste your comments straight into the feedback box.
  - In particular, watch for misattributed views, conflations, and places where a confident conclusion is doing work the argument hasn't earned. Don't be charmed by how polished it reads.
  - Note anything a hasty grader would let slide that shouldn't be let slide, and anything that's actually better than it looks.
  - Give a percentage grade out of 100 and a sentence or two of overall justification.

  State the final grade in machine-readable form at the very end, as \answer{XX%}.
reasoning: |-
  Hmm, the user is a teaching assistant grading short essays for an Ethics and the Arts course. They want me to act as an experienced philosophy instructor to provide detailed claim-by-claim feedback on a student's essay about moral obligations to the dead in historical dramatizations. 

  First, I need to establish what a strong answer would require. The essay question asks specifically about filmmakers/novelists moral obligations to real dead people, the "cannot harm dead" argument, the posthumous harm debate, and at least two normative frameworks. Key elements missing from the student's answer include:
  - Distinguishing experiential vs. symbolic harm concepts
  - Engaging Feinberg's harm-to-interests view
  - Addressing dignity/representation concerns
  - Considering audience autonomy vs. misinformation
  - Nuances in Kantian treatment of persons

  Now analyzing the student's essay paragraph by paragraph. The opening makes three problematic moves: conflating legal with moral reasoning, misapplying Parfit (non-identity deals with future people, not the dead), and asserting law tracks morality without justification. That's three strikes in the first two sentences.

  The utilitarian section is stronger but oversimplifies by reducing all harm to experiential states. The Kantian analysis is more flawed - the student misses how treating persons as ends includes their legacy and representation. The promise argument dismissal is too quick; they don't consider how promise-keeping maintains relational integrity beyond institutional concerns.

  What's impressive is how polished the writing appears - a hasty grader might miss the substantive gaps. The conclusion's "accuracy only as means" claim reveals a utilitarian bias the student presents as consensus. 

  For grading: I'll award 65%. The structure and writing quality suggest competence, but the philosophical content shows significant misunderstandings of key concepts and frameworks. The feedback should highlight each misstep while acknowledging the effective rhetorical presentation.
answer: |-
  ### Grading Report: Claim-by-Claim Analysis

  **Benchmark for Full Marks (70-80%+):**  
  A top answer would:  
  - Define "posthumous harm" and engage Feinberg's *harm to interests* view (distinct from experiential harm).  
  - Distinguish *moral status of the dead* from *duties to the living* (e.g., descendants, audiences, societal truth).  
  - Contrast *experiential harm* (impossible for the dead) with *symbolic harm/dignitary violation*.  
  - Analyse Kantian *respect for persons as ends*, including how representations affect the deceased's *legacy* as an extension of their personhood.  
  - Examine utilitarian *indirect harms* (e.g., eroding trust in historical narratives).  
  - Address the *non-identity problem* accurately (Parfit concerns future persons, not the dead).  
  - Consider *virtue ethics* on character (e.g., truthfulness as a virtue of the artist).  
  - Discuss *epistemic justice* (e.g., marginalised groups’ histories).  

  ---

  ### Student Essay Analysis  

  **¶1: "Legally and morally, dramatists owe nothing to the dead themselves..."**  
  - ✅ **Correct:** Notes the legal position on defamation and the dead.  
  - ❌ **Subtly Wrong:** Conflates law with morality ("Since the law tracks morality"). Legal gaps ≠ moral permissibility (e.g., slavery was once legal).  
  - ❌ **Misattribution:** Parfit’s *non-identity problem* addresses harming *future* people by affecting their existence conditions. It does **not** apply to the dead, who once existed.  
  - 🔍 **Unearned Leap:** Asserts "the dead no longer exist as subjects who can hold interests" without engaging Feinberg’s *interest theory of harm* (where past interests persist posthumously).  

  **¶2: "A utilitarian would reach much the same conclusion..."**  
  - ✅ **Correct:** Identifies utilitarianism’s focus on experiential harm and downstream effects (e.g., misinformation).  
  - 🔄 **Oversimplification:** Reduces harm *only* to experiential states. Ignores utilitarian arguments about *eroding social goods* (e.g., trust in historical narratives, cultural dignity).  
  - ❌ **Kantian Misstep:** Claims Kantians "must be indifferent" to the dead. **False:** Kantian duties of respect (*Rechtsperson*) can extend to the *memory* of persons as extensions of their rational agency (e.g., misrepresenting a dead philosopher’s work undermines their legacy as a rational project).  
  - 🔍 **Conflation:** Treats "rational nature" as purely present-tense, ignoring Kant’s *Metaphysics of Morals* on duties to the dead (e.g., keeping promises) as constitutive of respecting personhood *as such*.  

  **¶3: "There is one wrinkle: promises and dying wishes..."**  
  - ✅ **Correct:** Identifies promises as a counterexample.  
  - 🔄 **Superficial Dismissal:** Explains promise-breaking only via "damaging the institution." Fails to address *relational autonomy* (e.g., the promisee’s right to shape their posthumous narrative) or *dignitary interests*.  
  - ❌ **Missed Opportunity:** Does not cite Kant’s *duty of fidelity* to show why some duties outlive the beneficiary.  

  **Conclusion: "Artistic licence is a moral permission... owed accuracy only as a means..."**  
  - 🔄 **Overconfident:** Asserts convergence of "both major frameworks" without justifying the Kantian claim.  
  - ❌ **Normative Gap:** Omits non-consequentialist arguments (e.g., *inherent wrong in misrepresentation* regardless of harm to the living).  

  ---

  ### Key Oversights & Hidden Strengths  
  ⚠️ **Let Slide? No:**  
  1. **Parfit Misapplication:** Fundamental misunderstanding of the non-identity problem.  
  2. **Kantian Caricature:** Ignores scholarship on posthumous dignity (e.g., Thomas Hill, *Respect for Humanity*).  
  3. **Feinberg Absent:** Fails to engage the core posthumous harm debate.  

  💎 **Better Than It Looks?**  
  - Clear structure and precise language mask conceptual errors.  
  - Effectively separates *direct harm to dead* from *indirect harm to living*.  

  ---

  ### Overall Assessment  
  **Grade: 65%**  
  **Justification:** The essay is rhetorically polished but philosophically uneven. It correctly identifies utilitarian concerns about misinformation and legal realities but misrepresents Kantian ethics, misapplies Parfit, and ignores central arguments in the posthumous harm literature. The conclusion overstates consensus where none exists. While logically structured, key claims lack scholarly grounding.  

  \answer{65%}
