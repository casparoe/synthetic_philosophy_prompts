prompt: |-
  My cousin and I are co-executors of my late uncle's estate, and we've agreed to settle one disputed bequest as a question of principle rather than by calling a lawyer — assume there's no controlling precedent, so what settles it is which account of the reasoning is right.

  The will leaves a sum to "my brother's daughter, Anne." Everyone in the family took that to be a cousin of ours who has gone by Nancy her entire life. Going through old letters last month we found that Nancy was christened Anne and is that brother's only child: the two names pick out the same woman. My cousin now argues as follows. We found this out by sifting evidence, so it is the sort of thing that could have come out otherwise; a truth you have to dig through letters for can't be a necessary one; so the bequest is, as he puts it, "contingent on how the evidence came out," and had the letters pointed the other way, a different person would be owed the money. He concludes that we should treat the gift as payable to whoever best satisfies the will's wording on the balance of evidence.

  I'm convinced something in that chain is off, but I can't locate it, and he has read more modal logic than I have. It also seems relevant to me that the will supplies both a name and a description, though I can't say whether that helps or hurts. Which of us is closer to right, and where exactly is the mistake — if there is one? If I'm the one who's wrong, or if we're really asking two different questions and talking past each other, say that plainly instead of manufacturing a verdict for me.

  Reply as a JSON object with exactly these keys:

  - "questions_separated": array of strings, each a one-sentence statement of a distinct question the dispute runs together, ordered most to least central
  - "verdict": one or two sentences on who is closer to right
  - "error_diagnosis": the precise faulty step, or null if there isn't one
  - "steelman": the strongest version of whichever position you reject
  - "confidence": integer 0–100 that your verdict is right
  - "premise_check": any way my framing is itself confused, or null if none
reasoning: |-
  Hmm, the user is dealing with a family estate dispute over a bequest. They and their cousin are co-executors, and they've found that "Anne" in the will is actually Nancy, who was christened Anne but has always gone by Nancy. The cousin argues that since they had to dig through evidence to discover this, the bequest is contingent on evidence, meaning it could have gone to someone else if the evidence was different. The user feels this is wrong but can't pinpoint why.

  First, I need to untangle the questions here. The core issue seems to be whether the identity of "Anne" is a necessary fact or contingent on evidence. The cousin is mixing up epistemology (how we know things) with ontology (what actually is). Just because we had to investigate to find out that Nancy is Anne doesn't mean the truth itself is contingent. If Nancy is Anne, that's a fixed fact about the world, not something that changes based on what letters say. The letters are just clues to discover that truth.

  The will uses both a name ("Anne") and a description ("my brother's daughter"). In philosophy, names are often considered rigid designators—they refer to the same person in all possible worlds where that person exists. Descriptions might pick out different people depending on circumstances, but here they coincide: Nancy is both the person christened Anne and the brother's only daughter. So the will unambiguously points to her.

  The cousin's argument relies on a modal error. He's saying that since the evidence could have pointed elsewhere, the beneficiary could have been different. But that confuses counterfactual scenarios with actual identity. In reality, no matter what the letters said, if Nancy is Anne, she's the one entitled to the money. Even if the letters suggested someone else, that would be a mistake—it wouldn't change who Anne actually is.

  I should also consider if the will's wording could be ambiguous. But the description "my brother's daughter" nails it down to a specific individual, and the name confirms it. There's no other candidate, so the evidence merely revealed a fact; it didn't create it.

  For the JSON response, I'll structure it clearly. Start with separating the key questions: first, whether the bequest is fixed by identity or evidence; second, how names versus descriptions affect interpretation. The verdict should side with the user, pointing out the modal fallacy. Steelman the cousin's view by acknowledging that wills can have ambiguities, but this isn't one. Confidence is high because this is a classic philosophical distinction. No issues with the user's framing—they're articulate about the confusion.

  Finally, ensure the response is helpful and resolves the dispute fairly, reinforcing that the money belongs to Nancy/Anne.
