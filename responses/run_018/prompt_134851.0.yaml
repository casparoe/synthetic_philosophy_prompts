prompt: |-
  I'm trying to figure out where I actually stand on inside-view vs outside-view reasoning, going by my gut on cases. Case 1: I'm a chess grandmaster in time trouble, I see a tactic that feels brilliant, but I know I miscalculate in scramble about thirty percent of the time. Still, this line feels right. I think I should play it. Case 2: I'm a climate scientist and my internal model check says the feedback loop is weaker than the IPCC mean, but I know lone dissenters are usually wrong. Here I think I should defer to the consensus. Case 3: A historian spends years in archives and builds a strong narrative about a revolution; she knows other scholars disagree, but she feels her direct engagement with sources gives her an edge. I think she's being arrogant if she doesn't downgrade her confidence. Case 4: I'm picking stocks and think I see a pattern, but the outside view says almost nobody beats the market. Here the inside view feels like pure noise.

  Then there's case 5: I think slavery is wrong partly because I reasoned about suffering, partly because I'm embedded in a culture that changed. The outside view might say you're just a product of your era, yet I don't think that undermines my belief at all. So sometimes the outside view just doesn't bite?

  I'm all over the place. Is there one principle that captures when inside view should win, when it should lose, and when it's just irrelevent? Or do I just need to accept I'm inconsistently modest? Also, what does your principle predict for a mathematician who genuinely beleives she's solved a famous problem, knowing dozens have failed before her, but she can walk through every step?
reasoning: |-
  Okay, the user is presenting a fascinating puzzle about when to trust their own reasoning (inside view) versus statistical or consensus-based reasoning (outside view). They've given five detailed cases where they intuitively lean one way or another, and now they're seeking a unifying principle. 

  First, let's unpack their examples: Chess grandmaster trusts intuition despite error rate (inside wins), climate scientist defers to consensus (outside wins), historian is deemed arrogant for trusting archives (outside should win), stock picker dismisses personal pattern recognition (outside wins), and moral belief about slavery remains firm despite cultural determinism (inside immune). Then they add the mathematician case as a test. 

  Hmm... what's really being asked here? Beyond surface-level consistency, they seem to be wrestling with epistemic humility - when is it rational to override personal judgment? The slavery case is particularly telling because it reveals that some beliefs feel "anchored" beyond statistics. Also notable how they describe the historian's confidence as "arrogant" - that's a value judgment hinting at their underlying concern about intellectual vanity.

  The mathematician hypothetical is brilliant because it pits two strong forces against each other: the crushing base rate of failed proofs versus the luminous clarity of mathematical verification. My instinct says this case actually resolves the tension - in domains with clear verification mechanisms, inside view dominates after execution. But I should check that against their other cases...

  *Chess*: Verification exists (win/lose outcome soon), so temporary trust in intuition makes sense. 
  *Climate science*: No immediate verification, consensus proxies for truth. 
  *History*: Verification is impossible/nuanced, so consensus should weigh heavily. 
  *Stocks*: Verification exists (market performance) but consistently shows edge is rare. 

  Ah! So the unifying thread might be *verifiability* and *feedback loops*. But the slavery case breaks this - moral "verification" is debatable. Unless... perhaps moral reasoning is its own framework where outside view operates differently? 

  For the answer, I'll emphasize calibration mechanisms as the core principle. Cases where evidence can rapidly confirm/disconfirm inside views (chess, math, stocks) permit more inside-view trust than fields with delayed/no feedback (climate, history). Morality gets special status because its truth criteria are interwoven with the reasoning process itself. 

  Should also address their fear of inconsistency - it's not modesty fluctuation but context-dependent rationality. Their intuitions mostly track this! The mathematician should absolutely trust her steps *after* rigorous checking, not before. That's the nuance: inside view deserves weight only when actively deployed with domain-specific rigor.
answer: |-
  Your intuitions reveal a sophisticated, context-dependent approach—**not inconsistency**. The key principle is: **Trust the inside view when you have calibrated skill and verifiable evidence in a domain with reliable feedback loops; default to the outside view when individual judgment is noisy, uncalibrated, or lacks timely validation.**

  Here’s how this resolves your cases and provides a unified framework:

  ---

  ### **The Core Principle: Calibration vs. Noise**
  | **Case**               | **Dominant View** | **Why?**                                                                 |
  |-------------------------|-------------------|--------------------------------------------------------------------------|
  | **1. Chess Grandmaster** | Inside View       | *Calibrated skill + immediate feedback.* Your 30% error rate is *already factored into your intuition* through thousands of games. Tactics can be verified on the board. |
  | **2. Climate Scientist** | Outside View      | *Noisy individual models + slow/no feedback.* IPCC consensus aggregates many models and evidence. Your "internal check" lacks your chess-level calibration or rapid validation. |
  | **3. Historian**         | Outside View      | *Unverifiable narratives + high bias risk.* Archives invite cherry-picking; consensus reflects peer scrutiny. Confidence should be downgraded absent overwhelming/new evidence. |
  | **4. Stock Picker**      | Outside View      | *Negative expected value + noise.* Market efficiency drowns unstructured "pattern" spotting. No demonstrable edge → inside view is self-deception. |
  | **5. Slavery Ethics**    | Inside View       | *Moral reasoning is its own framework.* While culture shapes you, moral truth is argued via reason/empathy, not statistics. Outside view here is descriptive, not normative. |

  ---

  ### **When Does Inside View Win? (3 Criteria)**
  1. **Calibrated Expertise:** You have a track record of success *in this specific domain* (e.g., chess tactics).  
  2. **Verifiable Evidence:** You can test your view against objective reality *soon* (e.g., chess move → win/loss, math proof → verification).  
  3. **Reliable Feedback Loops:** Past errors corrected you (e.g., chess losses improved your intuition).

  ### **When Does Outside View Win? (3 Criteria)**
  1. **Low Calibration:** You lack domain-specific success metrics (e.g., stock picking).  
  2. **Noisy/Unverifiable Judgments:** Truth is probabilistic or distant (e.g., climate impacts in 2100).  
  3. **Base Rates Dominate:** History shows consistent failure of lone dissenters (e.g., 99% of novel historical theories are wrong).

  ### **When Is Outside View Irrelevant?**
  - **Moral/Philosophical Beliefs:** "You're a product of your era" describes *origins*, but doesn’t falsify reasoned conclusions. Slavery’s wrongness is argued via empathy/ethics, not statistics.  
  - **Personal Preferences:** Choosing vanilla over chocolate needs no base rates.

  ---

  ### **Mathematician Case: Inside View Wins (Conditionally)**
  - **If she rigorously verified every step**, her proof is objectively true—regardless of prior failures. Math is the *archetype* of verifiable inside-view reasoning.  
  - **But:** She must first disprove the base rate. Dozens failed because they *missed errors*. Her duty:  
    1. Assume she’s wrong until exhaustive peer review,  
    2. Scrutinize steps that tripped others,  
    3. Submit to journals/experts.  
  - **Once verified, base rates become irrelevant.** The outside view only warns *before* proof—it can’t refute truth.

  ---

  ### **Why You’re Not Inconsistently Modest**
  Your instincts align with **rational epistemic humility**:  
  - You trust inside views in high-signal domains (chess, ethics),  
  - Reject them in high-noise domains (stocks, climate dissent),  
  - And demand verification where possible (history, math).  

  **The mistake to avoid:** Assuming base rates override *all* individual judgment (e.g., "No one beats the market, so Warren Buffett is luck"). Calibrated experts with verifiable methods *can* beat base rates—but they’re rare. Your cases reflect this balance perfectly.
