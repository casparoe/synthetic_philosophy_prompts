answer: |-
  A precise conceptual issue arising at the legend-history boundary, illuminated by referential drift and contrasting the Trojan War and Arthurian traditions, is the **methodological circularity inherent in verification when a geographically anchored legend lacks a universally fixed referent, versus the anchoring (yet potentially misleading) effect of a stable archaeological candidate.**

  **Referential Drift** describes how the specific geographical, institutional, or even characterological associations of a proper name (e.g., Troy, Camelot, Moses) evolve across textual retellings, becoming detached from any original, specific reality. Later attempts to correlate the legend with material evidence then risk confirming a *later conception* of the name, not an original historical entity.

  1.  **Stable Archaeological Candidate (Trojan War & Hisarlik):**
      In the Trojan cycle, referential drift concerning 'Troy' is evident (e.g., varying descriptions in later Greek and Roman sources). However, the *general* geographical anchoring of Troy in the Troad region (northwest Anatolia) remained remarkably stable in ancient tradition. The identification of the Bronze Age citadel at Hisarlik as Troy by Schliemann, while initially driven by romanticised Homeric interpretations, provided a fixed *geographical point* for archaeological investigation. This stability mitigates the *worst effects* of referential drift *for verification purposes*. Excavations can target a specific location with rich stratigraphy. While interpretations of *which* level corresponds to Homer's Troy vary, and the archaeology never perfectly matches the epic narrative (demonstrating the drift), the site's existence and its significance as a major Bronze Age centre facing conflict *can* be materially verified. The stable candidate provides a non-textual anchor, allowing archaeology to inform the historical context *independently*, even if the exact correlation with the *legendary narrative* remains contested. The circularity is reduced because the site exists independently of the *specific* later literary descriptions.

  2.  **Lack of Fixed Geographical Referent (Arthurian Cycle & Camelot):**
      The Arthurian tradition suffers profound referential drift concerning its central locations, most notably Camelot. Early Welsh texts offer no fixed capital; Geoffrey of Monmouth places Arthur's court at 'Caerleon' (itself a Roman site with its own history); later French romances popularise 'Camelot' as the quintessential Arthurian court city, but its location remains vague or symbolic within the texts. Crucially, unlike Troy/Hisarlik, **no specific geographical location for Camelot was consistently transmitted or universally agreed upon in the medieval tradition itself.** This absence of a stable candidate creates an insurmountable conceptual difficulty for archaeological verification:
      *   **Circularity of Identification:** Any attempt to identify Camelot archaeologically must *first* interpret the textual clues (which drifted significantly). Choosing a site like Cadbury Castle or Tintagel relies *heavily* on interpreting these late, drifted textual references. Excavating such a site and finding evidence of a high-status post-Roman British centre *appears* to confirm 'Camelot'. However, this 'confirmation' is entirely dependent on the initial, interpretive act of linking the site to the *drifted* textual concept of Camelot. The evidence verifies the *interpretation* of the legend, not the historical existence of the place *as named* in any original sense. It risks proving only that a site *could* fit a *later conception* of Camelot.
      *   **Lack of Independent Anchor:** Without a fixed geographical referent consistently pointed to *by the tradition itself* (like Hisarlik was for Troy, however approximately), archaeology has no stable target against which to test the *core geographical claim* of the legend independently of the drifting texts. Is the 'Camelot' found the one from the 6th century traditions, Geoffrey's 12th-century vision, or Malory's 15th-century conception? The drift obscures the original referent entirely.

  **The Conceptual Difficulty for Legend Becoming History:**
  This contrast highlights a core difficulty: **Deciding when a legend has become history requires verifiable correlation between tradition and material evidence.** Referential drift fundamentally undermines this where a key element (like Camelot) lacks a stable geographical referent within the tradition. Verification becomes impossible without falling into circular reasoning based on interpreting the *drifted* concept. Conversely, a stable, geographically anchored archaeological candidate (like Hisarlik for Troy), even if the *narrative* details drift, provides a fixed point allowing archaeology to contribute *independent* data about the period and place, potentially elevating the *core event* (a major conflict at that site) from pure legend towards plausible history, even if the legendary embellishments remain distinct. The absence of such a fixed point for Camelot leaves the very existence of Arthur's court as a specific historical place perpetually mired in the ambiguity of referential drift, hindering its transition from legend to verified history.
