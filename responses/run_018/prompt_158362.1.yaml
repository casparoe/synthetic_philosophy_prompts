  ### Unoccupied Combinations  
  Some answer combinations lead to no leaf due to incoherence or instability. Diagnoses:  
  - **1B → 2A → 3B** (Hierarchy required but inter-level preservation denied):  
    - **Diagnosis**: Incoherence. If hierarchy resolves the paradox (per 2A), denying that meta-languages avoid revenge when protected (per 3B) undermines the solution.  
  - **1B → 2B → 4A** (Grounded two-language liar but strengthened liar is "true"):  
    - **Diagnosis**: Instability. Calling the strengthened liar "true" while deeming the original liar gappy generates contradiction (if true, it says it is not true).  
  - **1B → 2C → 5B** (Oscillation in two-language liar but fixed value for direct liar):  
    - **Diagnosis**: Incoherence. Endorsing oscillation for cross-language circularity (2C) but rejecting it for self-referential circularity (5B) is inconsistent.  
  - **1A with any non-A path** (Meaninglessness combined with meaningfulness verdicts):  
    - **Diagnosis**: Instability. If the liar is meaningless (1A), later judgments (e.g., 2A/B/C) inconsistently treat it as meaningful.  

  ---

  ### Ambiguous or Overlapping Pairs  
  The tree cannot cleanly separate these pairs due to shared commitments:  
  - **Leaf 2 (Fixed-Point) and Leaf 6 (Contextualist)** overlap at 1B → 2B (both treat liar as gappy and accept circular dependence). They diverge at Question 4: fixed-point (4B) rejects contextual evaluation, while contextualism (4C) requires it. *Shared commitment*: Truth-value gaps resolve the basic liar.  
  - **Leaf 1 (Hierarchical) and Leaf 5 (Revision-Theoretic)** overlap at 1B → 2A (both see hierarchy as useful). They diverge at Question 3: hierarchical (3A) demands meta-language stability, while revision-theoretic rejects hierarchy entirely (path 2C). *Shared commitment*: Structure (hierarchy/iteration) mitigates paradox.  

  **Note on Hybrids**: Paths like 1B → 2B → 4C (Leaf 6) may blend fixed-point and contextualist ideas. This is resolved via Question 4’s emphasis on context-dependence. Pure fixed-point (no context) maps to 4B.  

