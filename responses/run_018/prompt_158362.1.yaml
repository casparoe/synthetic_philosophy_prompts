  ### Scoring Key: Mapping Answers to Theoretical Families  
  Your path through the tree leads to one of six theoretical families. Below, each leaf is defined by its core commitments and the answer sequence that maps to it. Ambiguous/hybrid patterns are noted.  

  1. **Leaf 1: Strict Hierarchical Separation View**  
     - **Path**: 1B → 2A → 3A  
     - **Core Commitments**: Truth is stratified across distinct language levels. Self-referential sentences (e.g., the liar) are meaningful but evaluable only in a meta-language. Revenge is avoidable if meta-languages lack self-reference (inter-level preservation holds absolutely).  
     - **Theoretical Family**: Hierarchical theories (e.g., Tarskian).  

  2. **Leaf 2: Fixed-Point/Partial-Grounding View**  
     - **Path**: 1B → 2B → 4B  
     - **Core Commitments**: The liar is meaningful and ungrounded (neither true nor false) due to circular reference. Truth values are assigned via fixed-point constructions, preserving classical logic locally. The strengthened liar is also ungrounded.  
     - **Theoretical Family**: Kripkean fixed-point theories.  

  3. **Leaf 3: Paraconsistent View**  
     - **Path**: 1C  
     - **Core Commitments**: The liar is a true contradiction. Classical logic must be revised (e.g., to paraconsistent logic) to accommodate global gluts (sentences that are both true and false).  
     - **Theoretical Family**: Dialetheism (e.g., Priest-style).  

  4. **Leaf 4: Deflationary/Expressivist View**  
     - **Path**: 1A  
     - **Core Commitments**: The liar is a pragmatic failure—it misuses truth predicates and fails to express a proposition. Truth is not a substantive property; paradox arises from linguistic misuse, not semantic pathology.  
     - **Theoretical Family**: Deflationism or expressivism.  

  5. **Leaf 5: Revision-Theoretic View**  
     - **Path**: 1B → 2C → 5A  
     - **Core Commitments**: Truth values are dynamic—liar sentences undergo endless revision. Stability is unnecessary; meaning is defined by revision rules, not fixed values.  
     - **Theoretical Family**: Revision theories (e.g., Gupta-Belnap).  

  6. **Leaf 6: Contextualist/Gap-Theoretic View**  
     - **Path**: 1B → 2B → 4C  
     - **Core Commitments**: The liar lacks a context-independent truth value. It is gappy (neither true nor false) in a base context, but contextual shifts (e.g., reflective reasoning) can assign values to strengthened variants.  
     - **Theoretical Family**: Contextualism (e.g., Simmons) or gap theories with contextual elements.  

