answer: |-
  ### Seminar Structure: Navigating the Legend/History Boundary  
  *(90 minutes total; British English as requested)*  

  ---

  ### **I. Foundational Concepts: Building the Framework (20 minutes)**  
  *Sequence must precede case introductions to equip analytical tools:*  
  1. **Distinguish Evidential Types** (5 mins):  
     - Define *independent evidence* (archaeology, contemporary documents, climatology) vs. *narrative coherence* (literary consistency, thematic resonance).  
     - *Purpose*: Preempts "absence of evidence = evidence of absence" by showing absence is context-dependent (e.g., organic materials decay; archives burn).  

  2. **Introduce Accretion vs. Kernel** (10 mins):  
     - Legendary accretion = layers added via oral/written transmission (embellishment, moralising, political agenda).  
     - Recoverable kernel = plausible core consistent with independent evidence.  
     - *Purpose*: Dissolves "legend is old fiction" by reframing accretion as *process*, not dismissal.  

  3. **Source Silence & Cultural Filters** (5 mins):  
     - **Niche Concept: Source silence operates differently in textual vs. material cultures.**  
       - *Textual cultures* (e.g., Bronze Age Near East): Silence may indicate lost records or ideological exclusion.  
       - *Non-literate societies*: Archaeology carries primary weight, but interpretative gaps widen.  
     - *Purpose*: Shows why "no Exodus text in Egyptian records" ≠ disproof; redirects to evaluating *kinds* of silence.  

  ---

  ### **II. Case Studies in Parallel: Arthur as Carrying Example (40 minutes)**  
  *Arthur occupies the central 40 mins as it best illustrates accretion/kernel dynamics without polarising the audience.*  
  - **Why Arthur?**  
    - **Offers**: Rich textual evolution (Gildas → Geoffrey of Monmouth → Malory), enabling clear tracking of accretion. No contemporary records make kernel recovery a *methodological* puzzle, not theological.  
    - **Lacks**: Definitive archaeology or contemporary texts. Forces reliance on source criticism.  
  - **Positioning Other Cases**:  
    - **Trojan War (Reinforcement, 10 mins)**:  
      - Contrasts Arthur via archaeology (Hissarlik strata) but *reinforces* accretion (Homer vs. Hittite texts). Shows how evidence *complicates* narrative coherence.  
    - **Exodus (Boundary Test, 10 mins)**:  
      - Contrasts via theological stakes and source silence in Egyptian texts. Tests framework’s limits: can kernel exist if evidence is contested (e.g., Merneptah Stele)?  
  - **Why No Single Case Suffices**:  
    - Arthur lacks archaeology; Troy lacks linear textual evolution; Exodus’ religious weight risks binary thinking. Triangulation prevents reductionism.  

  ---

  ### **III. Misconception Mapping & Redirection**  
  *Preempt during concept/case sequencing:*  
  1. **“Absence of evidence = evidence of absence”**  
     - *Dissolve during Evidential Types*: Redirect to "What evidence *should* survive? Is its absence anomalous?" (e.g., Exodus: expected Egyptian records vs. typical preservation biases).  

  2. **“Legend = old fiction”**  
     - *Dissolve during Accretion vs. Kernel*: Reframe accretion as "cultural footprint" revealing historical anxieties (e.g., Arthur’s shifting role reflects Saxon/Norman politics).  

  3. **“Historian disagreement = unanswerable”**  
     - *Dissolve during Arthur deep dive*: Show disagreement refines questions (e.g., "Arthur as general vs. symbol" debate clarifies 5th-century Brittonic polities).  

  ---

  ### **IV. Comparative Exercise: Applying the Framework (30-minute mark)**  
  **Task: Chart Accretion Pathways**  
  - Provide 3 brief excerpts:  
    - (Arthur) Geoffrey of Monmouth’s *Historia* (12th C.) vs. Gildas (6th C.).  
    - (Troy) Homer’s *Iliad* vs. Hittite "Ahhiyawa texts".  
    - (Exodus) Biblical narrative vs. Egyptian "Hyksos Expulsion" records.  
  - **Question**: "Identify *one* accretion layer in each pair. Does it obscure, enhance, or invent the kernel? Use evidential independence to justify."  
  - *Purpose*: Forces analysis of *how* legends transform, not whether they are "true."  

  ---

  ### **V. Comprehension Check & Refusal to Adjudicate**  
  - **Closing Question (5 mins)**:  
    > *"If new evidence proved Arthur was a composite of five warlords, how would that change your approach to Exodus – and why?"*  
    - *Tests grasp*: Distinguishes method (applying accretion/kernel comparatively) from scepticism/credulity.  
  - **Refusal to Adjudicate**:  
    - State explicitly: **"We will not judge if Exodus ‘happened as narrated.’"**  
    - *Frame as method*: "Our goal is to map the *questions*, not the answers. Judging claims requires specialised evidence beyond this framework – but the framework shows *why* that judgement is complex."  

  ---

  ### **Niche Concept Integration**  
  - **Concept: Narrative smoothing as evidential liability in oral transmission**.  
  - **Where**: During Arthur section (accretion analysis).  
  - **Work it does**:  
    - Explains why coherent Arthurian narratives (e.g., Round Table) may be *less* historically reliable than fragmented early references.  
    - Lifts discussion beyond "myth vs. fact" by showing *coherence itself* as a product of transmission, not antiquity.  

  ---

  ### **Session Flow**  
  | Segment          | Time    | Content                                                                 |  
  |------------------|---------|-------------------------------------------------------------------------|  
  | Concepts         | 0-20’   | Evidential types → Accretion/Kernel → Source silence (niche concept)   |  
  | Trojan War       | 20-30’  | Reinforcement: Archaeology + textual conflict                           |  
  | **Arthur**       | **30-70’** | **Deep dive: Textual evolution, accretion layers, kernel debates**      |  
  | *Exercise*       | *60-65’* | *Comparative accretion analysis*                                        |  
  | Exodus           | 70-80’  | Boundary test: Theology vs. silence/kernel                              |  
  | Conclusion       | 80-90’  | Comprehension check; refusal to adjudicate; framework recap             |  

  ---
  This arc transforms misconceptions into methodological steps, uses cases dialectically, and elevates analysis beyond binary thinking. The focus remains on *how* we navigate boundaries, not where we draw them.
