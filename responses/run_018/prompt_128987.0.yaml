  Give me your actual credence — a specific number between 0 and 1 — that Buddhist ethical theory, reconstructed with strict fidelity to the Theravāda Abhidhammic ontology of momentary mental events (cittas) and the doctrine of anattā, can consistently ground a consequentialist obligation to maximize the net reduction of dukkha across sentient causal streams, without smuggling in a modern personal-identity substrate to serve as the bearer of aggregated welfare. I am not asking for a literature survey; I want the reasoning decomposed into at least four terms. First, assign a rough probability and one line of justification to (a) whether Buddhist soteriology genuinely contains a consequentialist component that applies to diffuse, cross-stream harms rather than only to one's own present mental continuum; (b) whether the discrete-moment, no-self ontology actually prohibits welfare aggregation across streams, as opposed to merely lacking a metaphysical subject to own it; (c) whether a stream-indexing convention — treating causal-psychological continuity as the practical unit of moral accounting without reifying a persisting self — is metaphysically available within the tradition rather than an ad hoc modern graft; and (d) whether internal consistency in ethics requires metaphysical grounding for aggregation conventions, or whether practical coherence and skillful means (upāya) suffice. Then combine these into your final credence, state which term the result is most sensitive to, and identify the specific conceptual argument or textual consideration (not a request for citations) that would most shift your least-confident term. Finally, if you think the gap between a credence of roughly 0.7 and one of roughly 0.3 on the overall claim mostly concerns one of these four terms, say which one and why.
