answer: |-
  Here is my decomposed credence assessment for the overall claim (**C**): **0.37** (slightly favoring inconsistency). My reasoning, structured per your request:

  1.  **(a) Existence of cross-stream consequentialism in soteriology:** **P = 0.65**  
      *Justification:* Early texts emphasize universal compassion (*karuṇā*) and non-harming (*ahiṃsā*), implying concern beyond one's stream (e.g., MN 41, SN 1.8), but explicit *maximizing* of net dukkha-reduction across streams is a modern framing lacking direct canonical articulation.

  2.  **(b) Ontology prohibits cross-stream aggregation:** **P = 0.55**  
      *Justification:* The core issue isn't *ownership* (anattā resolves that) but *commensurability*: Discrete cittas in distinct, causally isolated streams lack a shared ontological basis or common "currency" for summing dukkha, making aggregation a category error without importing a unifying substrate.

  3.  **(c) Stream-indexing convention is metaphysically available:** **P = 0.75**  
      *Justification:* The tradition already treats causal continuities (*santati*) as pragmatic units for kamma/vipāka and rebirth without reifying a self (e.g., Visuddhimagga XVII), providing a conceptual precedent for ethically relevant "aggregation units."

  4.  **(d) Practical coherence suffices over metaphysical grounding:** **P = 0.80**  
      *Justification:* Buddhist ethics is fundamentally pragmatic (*upāya-kosalla*); conventions (*sammuti sacca*) like "person" or "stream" are validated by their soteriological utility (e.g., reducing *dukkha*), not metaphysical ultimates (*paramattha sacca*).

  **Combining to Final Credence (C):**  
  Using a rough weighted geometric mean (emphasizing critical dependencies):  
  `C ≈ (a) * (b) * (c) * (d) = 0.65 * 0.55 * 0.75 * 0.80 ≈ 0.37`  
  *(More intuitively: Terms (b) and (a) significantly drag down confidence; (c) and (d) offer moderate support but cannot overcome the aggregation problem).*

  **Most Sensitive Term:** **(b) Ontology prohibits cross-stream aggregation.**  
  Slight changes here disproportionately impact **C**. If P(b) rises to 0.7 (stronger prohibition), C drops to ~0.27. If P(b) falls to 0.4 (aggregation deemed coherent), C rises to ~0.50.

  **Key Lever for Shifting Least-Confident Term (b):**  
  The strongest conceptual argument shifting P(b) (currently 0.55) **lower** would be demonstrating that *causal interdependence (paṭiccasamuppāda)* itself, even *between* streams, provides a sufficient non-reifying basis for welfare comparability. If dukkha in one stream is never truly isolated (due to universal conditionality), and its reduction objectively "matters" within the causal network, aggregation might be ontologically licit without a substrate. Shifting P(b) **higher** would require showing that momentary, stream-confined cittas render any inter-stream comparison *meaningless* (not just unowned), akin to comparing the "intensity" of unrelated events in parallel universes.

  **The 0.7 vs. 0.3 Gap:** This gap **mostly concerns (b)**.  
  *Why?* Those at ~0.7 likely see the prohibition in (b) as surmountable via pragmatic convention (d) and causal continuity (c), viewing dukkha itself as inherently aggregable *because* it's dukkha, regardless of ontological isolation. Those at ~0.3 see (b) as fatal: no metaphysical grounding + no inherent comparability between streams = aggregation is an incoherent demand smuggled in from substance-based ethics. Resolution hinges entirely on whether the Abhidhammic causal-mental ontology *permits* a coherent mathematics of suffering across discrete continua.
