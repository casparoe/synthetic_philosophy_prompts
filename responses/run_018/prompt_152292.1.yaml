prompt: |-
  You are a professional philosopher of well-being and public policy measurement. Before constructing anything, please spend a brief moment brainstorming the core philosophical objections to treating a country's rank in international happiness surveys as a direct policy target—especially objections that do not depend on empirical disputes about measurement error.

  I am a graduate student in public policy working with a government advisory office. We need a reusable decision procedure that my team can apply whenever a minister proposes a policy explicitly designed to raise our nation's standing in major international well-being rankings—the kind built on large-scale self-reported life-evaluation surveys. The procedure should translate philosophical theories of well-being—subjective life satisfaction, emotional experience, and objective flourishing—into an operational protocol. For each step, specify: the exact question to ask, what counts as a sufficient answer, whether that step is empirical or normative, and whether the protocol stops with a clear rejection, stops with a conditional approval, or hands the decision to a human values judgment.

  Then apply the procedure to two proposals: first, a national subsidy for urban green spaces justified by cross-national correlations between access to nature and higher self-reported life satisfaction; second, a state-funded public-awareness campaign that trains citizens to cognitively reframe economic hardship as personal growth, intended to improve reported emotional balance without changing material conditions. Include at least one case in which the procedure recommends rejecting a policy that would likely improve our ranking. Finally, flag precisely where the protocol cannot eliminate judgment and must defer to a normative decision by the advisory board. Please think carefully and show your reasoning at each step.
reasoning: |-
  Okay, the user is a graduate student in public policy working with a government advisory office. They need a reusable decision procedure to evaluate policies aimed at boosting their country's rank in international happiness surveys. The key here is to address philosophical objections to using such rankings as direct policy targets, beyond just measurement errors.

  First, I should outline the core philosophical objections. There's the problem of misalignment between what the surveys measure and true well-being. Surveys often focus on life satisfaction, which might not capture emotional states or objective flourishing. Then there's the issue of manipulation—policies could game the system by altering responses without real improvements. Also, aggregation problems: rankings average diverse experiences, potentially masking inequalities. And substitution concerns where policymakers might prioritize survey metrics over more substantive welfare improvements.

  The user wants a protocol based on three theories of well-being: subjective life satisfaction, emotional experience (hedonic), and objective flourishing (eudaimonic). The procedure needs specific steps with questions, sufficient answers, and whether each step is empirical or normative. It should also specify outcomes: reject, conditional approval, or pass to human judgment.

  For the protocol, I'll need steps that check alignment with each well-being theory. Step one could verify if the policy affects the targeted aspect of well-being beyond just survey scores. Step two might assess if it addresses any of the three theories—subjective, hedonic, or eudaimonic. Step three should evaluate the risk of manipulation, ensuring changes aren't just superficial. Step four would look at distributional equity, checking for unequal impacts. Step five involves trade-offs, requiring justification if other values are compromised.

  Next, applying this to the two proposals. The green space subsidy seems straightforward—it likely improves all three well-being aspects without manipulation risks. The reframing campaign, however, is trickier. It might boost emotional scores without changing material conditions, risking manipulation and neglecting eudaimonic needs. The protocol should reject this one even if it improves rankings.

  I also need to flag where human judgment is necessary. Trade-off evaluations and some normative decisions in steps three and five would require advisory board input. The user's deeper need is probably to prevent superficial policies and ensure holistic well-being, even if rankings don't immediately reflect it. They might also need to justify decisions to ministers using a structured, philosophically grounded approach, which adds legitimacy to their advisory role.
answer: |-
  Here is a reusable decision procedure grounded in philosophical theories of well-being, designed to rigorously evaluate policies targeting international happiness rankings. The core objections addressed are:

  1.  **Misalignment:** Rankings primarily capture *self-reported life evaluation* (e.g., Cantril ladder), which may not fully represent *hedonic experience* (momentary affect) or *objective flourishing* (eudaimonia, capabilities).
  2.  **Manipulation Risk:** Policies can artificially inflate scores by altering reporting (e.g., framing, social pressure) without changing underlying well-being.
  3.  **Substitution Problem:** Focusing on the metric risks neglecting other crucial aspects of well-being not captured by the survey instrument.
  4.  **Aggregation Problems:** Rankings obscure distributional justice issues (e.g., whose well-being improves or declines).
  5.  **Value Trade-offs:** Pursuing ranking gains might conflict with other societal values (e.g., truthfulness, autonomy, justice).

  **The Protocol: Evaluating Happiness-Ranking-Targeted Policies**

  **Step 1: Identify Target Mechanism & Well-being Aspect**
  *   **Question:** "Which specific component(s) of the international well-being survey(s) does this policy aim to directly influence (e.g., life evaluation question, affect balance question, specific domain satisfaction)? To which philosophical theory of well-being (subjective life satisfaction, hedonic experience, objective flourishing/eudaimonia) does this survey component *most plausibly* correspond?"
  *   **Sufficient Answer:** Clear identification of the survey metric(s) targeted and the primary well-being theory it maps onto (e.g., "Targets the Cantril Ladder score, primarily associated with Subjective Life Satisfaction"; "Targets the 'smile/laugh yesterday' question, primarily associated with Hedonic Experience").
  *   **Type:** Empirical (identifying policy intent & survey focus) & Normative (mapping survey item to theory).
  *   **Outcome:** Proceed to Step 2. (Lack of clarity here necessitates revision/rejection of proposal).

  **Step 2: Beyond the Metric - Real Well-being Change**
  *   **Question:** "Independently of its effect on the *survey score*, is there a credible causal pathway by which this policy directly improves well-being *according to the theory identified in Step 1*? Provide evidence/logic for this pathway."
  *   **Sufficient Answer:** A plausible mechanism explaining how the policy changes the *actual state* of subjective life satisfaction, hedonic experience, *or* objective flourishing (e.g., "Subsidy increases actual access to green spaces, which demonstrably reduces stress and improves mood [Hedonic] and fosters community interaction [Flourishing]"; "Training teaches skills that demonstrably reduce negative affect intensity in daily life [Hedonic]").
  *   **Type:** Empirical (causal mechanisms) & Normative (interpreting what constitutes real change for the theory).
  *   **Outcome:**
      *   **Yes + Plausible:** Proceed to Step 3.
      *   **No or Implausible:** **Stop - Reject Policy.** (Indicates pure "gaming" - e.g., subtly coaching respondents).

  **Step 3: Risk of Manipulation or Value Distortion**
  *   **Question:** "Does the policy primarily work by altering *reporting* of well-being (e.g., changing cognitive framing, inducing social desirability bias) without substantially changing the underlying *state* targeted in Step 2? Does it conflict with core values like truthfulness, autonomy, or authentic expression?"
  *   **Sufficient Answer:** Analysis differentiating changes in *experience/state* from changes in *reporting*. Identification of potential value conflicts (e.g., "The policy changes actual experiences in nature [State Change]"; "The policy teaches reframing skills that alter emotional perception but not context [Potentially Reporting/Altered Perception] - risks inauthenticity and trivializing hardship").
  *   **Type:** Normative (defining manipulation/value conflict) & Empirical (assessing policy mechanism).
  *   **Outcome:**
      *   **Low Risk (State Change Dominant):** Proceed to Step 4.
      *   **High Risk (Reporting/Perception Alteration Dominant) OR Severe Value Conflict:** **Stop - Reject Policy.** (Prioritizes genuine well-being & values over metric).
      *   **Ambiguous/Mixed:** Flag for human judgment later; Proceed to Step 4 with caution note.

  **Step 4: Distributional Equity & Non-Targeted Theories**
  *   **Question:** "What is the likely impact of this policy on different demographic/socioeconomic groups? Could it improve the ranking while worsening well-being for some? Does it neglect or harm well-being aspects *not* captured by the targeted survey metric (e.g., improves life satisfaction score but harms autonomy or community ties)?"
  *   **Sufficient Answer:** Consideration of differential impacts (e.g., urban vs. rural, income groups, minorities). Consideration of potential negative effects on non-targeted well-being theories (e.g., "Green spaces benefit urban dwellers more; minimal negative impact on other well-being aspects"; "Reframing training might discourage collective action on economic hardship [Flourishing/Autonomy Harm]").
  *   **Type:** Empirical (distributional analysis) & Normative (equity, pluralism of well-being).
  *   **Outcome:**
      *   **Equitable & No Significant Harm:** Proceed to Step 5.
      *   **Significant Inequity or Harm:** Proceed to Step 5 but flag major concern requiring strong justification or mitigation.

  **Step 5: Trade-offs & Opportunity Cost**
  *   **Question:** "What are the primary resource, political capital, or value trade-offs involved? Could resources achieve greater or more just *overall well-being gains* (considering all three theories) if used differently? Is the ranking gain itself the *only* justification, or are there independent reasons?"
  *   **Sufficient Answer:** Identification of key trade-offs (cost, focus on other needs). Comparison to plausible alternatives. Assessment if ranking gain is the sole rationale.
  *   **Type:** Normative (weighing values, justice, opportunity cost) & Empirical (cost/benefit comparison).
  *   **Outcome:**
      *   **Trade-offs Minor & Independent Justification Strong:** **Conditional Approval** (Subject to standard cost-effectiveness/feasibility checks).
      *   **Trade-offs Significant OR Ranking is Sole Justification:** **Hand Decision to Human Values Judgment.** (Requires advisory board deliberation on values/priorities).
      *   **Opportunity Cost Too High:** **Stop - Reject Policy.**

  **Flag for Human Judgment:** Steps 3 (Ambiguous manipulation/value conflict), Step 4 (Severe inequity/harm), and Step 5 (Significant trade-offs or sole ranking justification) explicitly require normative deliberation by the advisory board. The protocol identifies these points but cannot resolve the underlying value conflicts algorithmically.

  ---

  **Application to Proposals:**

  **Proposal 1: National Subsidy for Urban Green Spaces (Justification: Correlation access/nature -> life satisfaction)**

  1.  **Target:** Likely Cantril Ladder (Life Evaluation) -> Subjective Life Satisfaction / Also plausibly Positive Affect -> Hedonic / Green space use -> Flourishing.
  2.  **Real Change:** Plausible pathways: Reduced stress/improved mood (Hedonic), Increased recreation/social interaction (Flourishing/Hedonic), Aesthetic pleasure (Hedonic), Environmental benefits (Flourishing). **Proceed.**
  3.  **Manipulation Risk:** Policy changes the *actual environment and access*, altering lived experience, not just reporting. Low risk of manipulation. **Proceed.**
  4.  **Distribution/Non-Targeted:** Potential inequity: Focuses on *urban* spaces; rural/remote areas may not benefit. Neglect? Unlikely to harm other well-being aspects; may slightly benefit them (e.g., community). **Flag Minor Equity Concern; Proceed.**
  5.  **Trade-offs:** Cost is significant. Opportunity cost exists (funds for healthcare, education). Independent justifications strong: Public health benefits (physical activity, mental health), environmental resilience, community building. Ranking gain is *one* benefit among many. **Conditional Approval** (Subject to cost-effectiveness analysis, equity mitigation e.g., parallel rural initiatives).

  **Proposal 2: State-Funded "Reframing Hardship" Campaign (Justification: Improve reported emotional balance)**

  1.  **Target:** Affect Balance Questions (e.g., experienced happiness/worry yesterday) -> Hedonic Experience.
  2.  **Real Change:** Plausible pathway: Teaches cognitive skills (e.g., CBT techniques) that demonstrably reduce *subjective experience* of negative affect and increase resilience/positive affect *in the moment* (Hedonic change). **Proceed.**
  3.  **Manipulation Risk & Value Distortion:** **HIGH RISK.** Primary mechanism is altering *cognitive appraisal/perception* of *unchanged material conditions*. While this changes *experienced affect* (Hedonic), it risks:
      *   **Manipulation (of the metric & self):** Focuses on changing internal response to external problems, potentially masking systemic issues the survey might intend to capture indirectly. "Improves" scores without changing context.
      *   **Value Conflicts:** Potentially undermines *autonomy* (state promoting specific cognitive frames), *authenticity* (encouraging positive reporting despite hardship), *truthfulness* (divorcing affect from reality), and *collective action* (discouraging demand for material change by framing hardship as personal growth). **Stop - Reject Policy.** *(This is the required rejection case - likely improves ranking but fails Step 3)*
      *   *(Protocol stops here; Steps 4/5 not reached for rejection)*

  **Summary of Rejection Rationale (Proposal 2):** While the policy likely improves the targeted hedonic metric *and* changes actual momentary affect, it does so primarily through cognitive reframing of persistent negative circumstances. This constitutes an unacceptable manipulation of the well-being *reporting and perception* relative to the underlying context, conflicting with core values of authenticity, autonomy, and potentially justice (by diverting focus from material needs). It exemplifies prioritizing the *metric* (hedonic score) over genuine, multifaceted well-being (which includes acknowledging and addressing hardship, not just reframing it) and democratic values.
