answer: |-
  ### 1. The Diagnosis (200 words)  
  Rousseau would eviscerate the system’s foundational lie: that raw, algorithmically weighted social media reactions equate to the *volonté générale* (general will). He’d argue that this "continuous plebiscitary aggregation" doesn’t capture collective reason but **amplifies the *volonté de tous*—the mere sum of private, reactive interests**. The algorithm’s bias toward outrage and high engagement would horrify him, as it institutionalizes *amour-propre* (egoistic vanity) rather than transcending it through civic deliberation. He’d condemn the conflation of "viral" sentiment with legitimate sovereignty, noting that the system **confuses volume with virtue and data with justice**. The very infrastructure—private platforms harvesting fragmented, emotional impulses—ensures the "will" extracted is pathological: a feedback loop of manufactured passions, alienated from communal good. For Rousseau, sovereignty requires conscious, collective *moral agency*, not passive emotional metrics. This tech, he’d sneer, is the ultimate *sophist*: dressing aggregated appetites in the robes of democracy while ensuring true civic self-rule is impossible.

  ### 2. The Agreement (150 words)  
  Rousseau might grudgingly applaud **one element**: the death of representatives. He despised elected intermediaries ("The people of England deceive themselves when they fancy they are free," he scoffed), viewing them as corruptible usurpers of popular sovereignty. Here, the system bypasses them entirely, claiming to distill the people’s voice "directly"—a literal (if perverse) realization of his demand for unmediated self-legislation. He’d also endorse the **rejection of periodic elections** as inadequate snapshots of a dynamic general will. "At least," he might concede, "this fiction acknowledges that sovereignty must be *continuous*—not leased to elites every four years." Yet this agreement is thin ice: he’d see it as replacing one betrayal (representation) with a far deadlier one (algorithmic ventriloquism).

  ### 3. The Revolt (200 words)  
  Here, Rousseau’s ghost would rage: **"You’ve mechanized madness and called it the general will!"** The core betrayal lies in reducing sovereignty to *engineered affect*, not moral reason. His *volonté générale* emerges only when private individuals transform into citizens through **rational deliberation about the common good**—a process annihilated when "input" is reduced to knee-jerk reactions harvested by engagement-optimizing algorithms. The system’s suppression of quiet voices and amplification of outrage creates not a civic body, but a **digitally inflamed mob**, its "will" sculpted by profit-driven platforms. Rousseau would pinpoint the fatal poison: **private control of the public square**. When platforms (seeking ad revenue) design the aggregation rules, sovereignty isn’t merely skewed—it’s *privatized*. "The general will cannot be *weighted*," he’d thunder. "It is born of equality in deliberation, not algorithmic leverage for the loudest. You’ve replaced the *citoyen* with the *click*, and sold the sacred right of self-rule to data merchants. This isn’t democracy—it is the arithmetic of madness."

  ### 4. The Bottom Line (100 words)  
  **Ghost-Rousseau’s Verdict:**  
  *"You mistake the fever chart for the physician. This *simulacrum* of direct democracy is the final corruption of the general will: it confuses aggregated appetites—amplified by machines designed to inflame them—for the voice of a sovereign people. Sovereignty cannot reside in the feeds of private platforms, nor be ‘captured’ by algorithms that trade in outrage. Your system is not the fulfillment of my ideal, but its ghoulish parody—a plebiscite without a *polis*, a people reduced to data-points, and a general will strangled at birth by the invisible hand of profit. Burn it."*
