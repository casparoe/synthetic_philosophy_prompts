prompt: |-
  I was arguing with my friends last week about whether ethics boards can ever really say that helping person A is 'more important' than helping person B, and then I realised my actual job has this exact problem. I sit on a regional health authority's allocation committee, and we have to approve funding splits between programs that serve totally different populations — chronic pain patients vs acute trauma survivors, mental-health liaison services vs surgical capacity — and the board keeps asking whether we're comparing apples to apples when we claim one group gains more welfare than another loses.

  I don't want a grand theory. I need a reusable decision procedure — like a flowchart in words — that my non-philosopher collegues can run in a meeting. The rules we already have are: no cardinal utility scores (no QALYs or point scales), and a 'recognition boundary' clause that says if a proposal touches whether people are treated as the kind of person they are (say, gender-affirming clinical intake vs a generic protocol), that recognition value can't be folded into a health-outcome tradeoff. So build the procedure: the ordered questions, what counts as a sufficient answer at each node, where it stops with 'these are incommensurable,' and where it forces a human vote. Ground it in whatever philosophy actually knows about interpersonal comparison without assuming we can read minds. Then run it on two proposals we actually recieved: splitting rehab slots between chronic pain and acute trauma, and funding a cultural liaison program that improves mental health metrics but doesn't change mortality stats. Make sure one of those runs produces an answer the committee will hate. And flag the misfires — the spots where the checklist can't settle the issue and someone just has to decide.
reasoning: |-
  Okay, let me start by unpacking the user's problem. They're on a regional health authority's allocation committee and need a practical decision procedure for funding different programs serving diverse populations. The key constraints are no cardinal utility scores like QALYs and a 'recognition boundary' clause. The user wants a flowchart-like process that non-philosophers can use in meetings, grounded in philosophical concepts without assuming mind-reading.

  First, I need to recall philosophical approaches to interpersonal comparisons that avoid cardinal metrics. Capabilities approach (Sen) and recognition theory (Honneth) seem relevant. The 'recognition boundary' directly ties to Honneth's ideas about identity. The capabilities framework focuses on basic functionings, which might allow ordinal comparisons without precise numbers.

  The user mentioned two real examples: splitting rehab slots between chronic pain and acute trauma patients, and funding a cultural liaison program. The procedure must handle cases where programs are incommensurable and force a vote when necessary. Also, one outcome should be controversial to test robustness.

  Breaking down the decision steps: Start with the recognition boundary to screen for identity-related issues. If violated, that program gets priority. Next, check for severe deprivation—prioritize groups below a basic functioning threshold. Then, look for catastrophic loss prevention. After that, evaluate relative gain using ordinal categories. If still unresolved, consider procedural fairness before declaring incommensurability.

  For the chronic pain vs. acute trauma example: Neither hits the recognition boundary. Acute trauma might have higher immediate deprivation and catastrophic loss potential, so they'd get priority. But chronic pain patients might argue their suffering is severe too. The committee might dislike deprioritizing chronic pain, which is a valid misfire since the deprivation assessment is contentious.

  The cultural liaison program: It involves recognition, so it can't be traded off. Even if it doesn't improve mortality, the identity aspect protects it from being weighed against other health outcomes. This respects the recognition boundary but might frustrate those focused on measurable outcomes.

  Misfires occur at steps requiring qualitative judgment: determining severe deprivation, catastrophic loss, and relative gain. These steps need committee discussion and vote. The procedure forces explicit consideration of key ethical dimensions without false precision, making tradeoffs transparent.

  I should ensure each step has clear exit points: recognition boundary stops further comparison, severe deprivation and catastrophic loss lead to prioritization. Only when all else fails does it go to a vote. The examples illustrate both decisive outcomes and contentious judgments, highlighting where human discretion is unavoidable.
answer: |-
  Here's a reusable decision procedure ("flowchart in words") grounded in capability approaches (Sen & Nussbaum) and recognition theory (Honneth), designed for operational use within your constraints. It prioritizes avoiding harm, respecting identity, and making only *ordinal* comparisons where feasible.

  **The Recognition & Capability Allocation Protocol (ReCAP)**

  1.  **RECOGNITION CHECK:**
      *   **Question:** Does *either* proposal involve a "recognition boundary" issue (i.e., affirming/challenging the person's fundamental identity, dignity, or status as a member of a group in the context of care)?
      *   **Sufficient Answer:** YES if the program/service is intrinsically tied to recognizing a core aspect of identity (e.g., gender-affirming care, culturally specific care addressing historical marginalization, services designed *by and for* a specific community experiencing systemic disrespect). NO if the service is primarily about a *generic* health outcome, even if delivered culturally competently.
      *   **Outcome:**
          *   If YES for one proposal, and NO for the other: **Prioritize the "YES" proposal.** (Recognition is non-tradeable per rule). STOP.
          *   If YES for both: **These are INCOMMENSURABLE on the recognition axis.** Proceed to Step 2, but flag that recognition value *cannot* be traded off later.
          *   If NO for both: Proceed to Step 2.

  2.  **SEVERE DEPRIVATION AVOIDANCE:**
      *   **Question:** Would denying funding to *either* proposal result in a group falling below a **minimum threshold** of core health capabilities? (Focus: Avoiding catastrophic loss of basic functioning). Examples: Ability to avoid preventable death, escape severe untreated pain, maintain basic mental coherence, avoid profound immobility without support.
      *   **Sufficient Answer:** Requires qualitative evidence (clinical guidelines, population health data, expert testimony) demonstrating a *high risk* of individuals falling below this threshold without the specific program. Comparison is **ordinal** (e.g., "clearly higher risk/more severe deprivation" vs. "significant but less immediately catastrophic").
      *   **Outcome:**
          *   If one proposal prevents severe deprivation and the other does not: **Prioritize the proposal preventing severe deprivation.** STOP.
          *   If both prevent severe deprivation: Proceed to Step 3.
          *   If neither prevents severe deprivation: Proceed to Step 3.
          *   If unclear/comparable risk of severe deprivation: Flag "Potential Comparable Deprivation Risk." Proceed to Step 3.

  3.  **CATASTROPHIC LOSS PREVENTION:**
      *   **Question:** Does *either* proposal uniquely prevent a **catastrophic loss** of capability *for a significant number of people* that the other proposal does not address? (Focus: Avoiding large-scale, irreversible harm). Examples: Preventing imminent service collapse for a vital program, averting a major outbreak due to lack of prevention, stopping a surge in suicides due to lack of crisis care.
      *   **Sufficient Answer:** Evidence of imminent, large-scale, irreversible harm prevented *only* by this specific funding. Must be more than just "worse outcomes"; must approach system failure or massive individual tragedy. Comparison is **ordinal** (e.g., "imminent system collapse" vs. "significant decline in function").
      *   **Outcome:**
          *   If one proposal prevents catastrophic loss and the other does not: **Prioritize the proposal preventing catastrophic loss.** STOP.
          *   If both prevent catastrophic loss: **These are INCOMMENSURABLE (Catastrophe Avoidance).** Human Vote Required. STOP.
          *   If neither prevents catastrophic loss: Proceed to Step 4.
          *   If unclear/comparable risk: Flag "Potential Comparable Catastrophe Risk." Proceed to Step 4.

  4.  **RELATIVE GAIN ASSESSMENT (Ordinal Scale):**
      *   **Question:** Can we ordinally rank the **magnitude of expected capability gain** for the respective populations *relative to their baseline and potential*, focusing on **breadth and depth of impact**? (Focus: "More people gain significantly" or "People gain more critical capabilities," NOT precise quantification). Use categories: "Transformative," "Major," "Moderate," "Marginal" gains in core capabilities (mobility, freedom from pain, social participation, senses, emotions).
      *   **Sufficient Answer:** Requires qualitative synthesis of evidence (population need, program effectiveness data, lived experience reports). Must identify *clear ordinal differences* (e.g., "Transformative vs. Moderate" = clear difference; "Major vs. Major" = unclear). **Cannot** use QALYs or points. Consider: How many core capabilities are impacted? How deeply?
      *   **Outcome:**
          *   If gains for Proposal A are **clearly ordinally higher** (e.g., Transformative vs. Moderate) than Proposal B: **Prioritize Proposal A.** STOP.
          *   If gains are **unclear or ordinally comparable** (e.g., Major vs. Major, or Transformative for a small group vs. Major for a large group): **These are INCOMMENSURABLE (Gain Comparison).** Proceed to Step 5.

  5.  **PROCEDURAL FAIRNESS & CONTEXTUAL FACTORS:**
      *   **Question:** Are there overriding considerations of **procedural fairness** or **context** that break the tie? Examples:
          *   Historical underfunding of a specific group/service?
          *   Alignment with urgent regional health priorities set through democratic consultation?
          *   Feasibility/readiness (can the funds be effectively used *now*)?
          *   Leverage (does funding unlock other resources?).
          *   Legal/contractual obligations?
      *   **Sufficient Answer:** Must be a compelling, documented, and agreed-upon factor relevant to fair process or strategic context, *not* a restatement of health outcomes or recognition.
      *   **Outcome:**
          *   If a clear, compelling tie-breaker exists: Use it to prioritize. STOP.
          *   If no clear tie-breaker: **These are FUNDAMENTALLY INCOMMENSURABLE.** **Human Vote Required.** STOP.

  **Key Misfire Points (Where Judgment is Forced):**
  *   **Step 2:** Judging "Severe Deprivation" threshold breach and relative risk.
  *   **Step 3:** Defining "Catastrophic Loss" and judging imminence/scale.
  *   **Step 4:** Assigning ordinal gain categories ("Major" vs "Major") and judging comparability.
  *   **Step 5:** Weighing procedural/fairness factors.

  ---

  **Running the Examples (Applying ReCAP):**

  **Example 1: Splitting Rehab Slots (Chronic Pain Patients vs. Acute Trauma Survivors)**
  *   **Step 1 (Recognition):** NO for both (assuming standard physical/occupational therapy, not identity-specific). Proceed.
  *   **Step 2 (Severe Deprivation):**
      *   *Chronic Pain:* Without rehab, risk of *severe*, *chronic* immobility, opioid dependence, depression, inability to work/care for self. Significant suffering, but often not *immediately* life-threatening or causing total functional collapse *overnight*.
      *   *Acute Trauma:* Without immediate intensive rehab, risk of permanent, catastrophic loss of function (e.g., never walking again after spinal cord injury, severe contractures after burns), potentially life-threatening complications (DVTs, pneumonia), rapid descent into profound dependence. Higher *immediacy* and potential for *irreversible catastrophic loss*.
      *   **Outcome:** Acute Trauma shows higher *imminent risk of catastrophic loss of basic capabilities*. **Prioritize Acute Trauma Rehab.** STOP.

  **Why the Committee Might Hate This:** Chronic pain patients are a large, underserved group with immense suffering. Deprioritizing them feels dismissive, even if the rationale (preventing catastrophic, irreversible loss) is sound. The "severe deprivation" judgment for chronic pain is contentious – their suffering *is* severe, but the *nature* of the potential loss differs.

  **Example 2: Funding Cultural Liaison Program (Improves Mental Health Metrics, No Mortality Change) vs. Expanding Surgical Capacity**
  *   **Step 1 (Recognition):**
      *   *Cultural Liaison:* Likely **YES.** Its core value is in recognizing cultural identity, bridging communication gaps rooted in cultural difference, addressing historical mistrust/marginalization in healthcare. It affirms patients *as members of their cultural community* within the clinical setting. Its effectiveness *depends* on this recognition.
      *   *Surgical Capacity:* **NO.** Generic health outcome improvement (reduced wait times, better surgical outcomes). Culturally competent delivery is good practice, but not the *defining purpose*.
      *   **Outcome:** Recognition YES for Liaison, NO for Surgery. **Prioritize Cultural Liaison Program.** STOP.

  **Why the Committee Might Hate This:** Surgery has "hard" outcomes (lives saved, disabilities prevented, clear QALY gains *if allowed*). Mental health gains, especially non-mortality ones, are often undervalued. The recognition argument might feel "soft" or "political" to some, even with the rule. They might argue the surgical waitlist is a more urgent "crisis."

  ---

  **Grounding in Philosophy:**
  *   **Avoiding Cardinal Utility:** ReCAP uses Sen's **Capability Approach**. It focuses on *freedoms* (capabilities) to achieve valuable functionings (being healthy, mobile, free from pain). Comparisons are about expanding *sets* of capabilities and preventing their severe diminishment, ordinally ranking opportunities and losses, not summing utils.
  *   **Recognition Boundary:** Directly draws on Honneth (**Theory of Recognition**) and Fraser (**Status Model of Recognition**). Treating someone according to their self-understood identity (gender, culture) is a fundamental good, distinct from and prior to distributing health goods. Folding it into a health outcome trade-off constitutes misrecognition.
  *   **Interpersonal Comparison without Mind-Reading:** Focuses on **objectively observable (or reasonably inferable) capabilities and functionings** (Can they move? Are they in documented severe pain? Can they communicate needs? Are they dying preventable deaths?) and **institutional/social status** (Are they systemically marginalized in care settings?). It asks about *what people are effectively able to be and do*, not their internal utility states. Steps 2 & 3 rely on thresholds of basic functioning/social catastrophe derived from basic human needs theories (e.g., Nussbaum's Central Capabilities).
  *   **Incommensurability:** Accepts Berlin/Williams' view that some values (like recognition vs. aggregate pain reduction) or complex mixes of gains cannot be precisely compared on a single scale. The protocol forces explicit acknowledgment of this.

  **How to Use in Committee:**
  1.  Present both proposals.
  2.  Assign a facilitator to walk through ReCAP steps sequentially.
  3.  At each step, require evidence-based discussion focused *only* on the question at that node.
  4.  Reach consensus (or vote if necessary) on the "Sufficient Answer" for each step.
  5.  Follow the outcome rule for that step (Prioritize, Flag, Proceed, or Force Vote).
  6.  Document the reasoning at each step, especially misfire points and the rationale for votes.

  This procedure forces explicit consideration of the most ethically salient features (recognition, severe harm, catastrophic loss) *before* attempting murky gain comparisons, respects your constraints, and makes the grounds for incommensurability and difficult votes transparent. The "hated" outcomes demonstrate it's working – it surfaces the genuine value conflicts inherent in your role.
