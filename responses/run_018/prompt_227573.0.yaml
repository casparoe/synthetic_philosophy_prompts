  I'll structure my paragraph: (1) concede the technical point about domain restriction, (2) argue it dodges the normative question, (3) explain why labeling preferences "meddlesome" begs the key issue, and (4) conclude that the tension resurfaces when justifying the filter itself. Must maintain that reformulated tension is still real and deep.

