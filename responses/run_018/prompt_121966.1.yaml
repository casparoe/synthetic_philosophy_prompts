  If Shubik's dollar auction demonstrates that escalation of commitment is merely the sunk-cost fallacy operating inside an auction frame, why do experimental waived-obligation variants—in which a bidder who drops out has all prior payments fully canceled—still generate sustained bidding wars well past the prize value? In your answer, address the notion of a zero-sunk-cost escalation curve and explain whether it undermines the identification of auction escalation with ordinary sunk-cost reasoning. Present everything in continuous prose only, with no headings, bullet points, bold text, or tables, as one would write in a letter or email.
