prompt: |-
  Hey, I'm a PhD student in comparative philosphy and I've been going in circles on something that keeps coming up in both classical texts and modern organizational ethics. There's this move I keep seeing where someone grabs just one half of a Confucian relational pair—usually the subordinate's side, like the duty of loyalty or filial deference—and treats it as ironclad and universal, but when you bring up the matching obligation on the other side—like the superior's duty to care, correct, or reciprocate—they suddenly say that's just 'aspirational' or 'depends on context.' I saw it in a management seminar where a CEO talked about running the company 'like a family' and demanded total zhong-style loyalty from employees, but when people asked about job security or benevolent leadership he said business isn't family, it's meritocracy. I also see it in family dynamics where parents invoke xiao constantly but act like they don't have to be virtuous parents to earn it. It's not just hypocrisy, because people seem genuinely convinced they're being consistent within role ethics. Is there an established term in Confucian scholarship for this specific one-directional extraction of hierarchical obligations? I know about asymmetry and reciprocity in roles, but this feels more like selectively freezing one half of a dyadic norm. If there's no exact concept, could you name and define it, with clear boundaries—especially how it's different from plain hypocrisy, from the idea that roles just have different weights, and from cases where the superior genuinely can't fulfill the reciprocal side? Before answering, think carefully about the structure of Confucian relational norms—maybe map how xiao, zhong, and shu actually interact—and please start with your bottom line in the very first sentence, then reasoning, no preamble, don't restate my question. Write in American English, and approach this as an expert in Confucian philosophy and applied ethics.
reasoning: |-
  Okay, the user is a PhD student in comparative philosophy struggling with a recurring issue in both classical texts and modern organizational ethics. They've noticed a pattern where only the subordinate's duties in Confucian relational pairs (like loyalty or filial piety) are treated as absolute, while the superior's corresponding obligations (like care or benevolence) are dismissed as aspirational or context-dependent. 

  This came up in a management seminar where a CEO demanded "family-like" loyalty from employees but rejected reciprocal job security, and in family dynamics where parents enforce filial piety without upholding their own parental virtues. The user wants to know if there's an established term for this selective enforcement, or help defining it clearly.

  Hmm... First, I need to confirm there isn't an exact classical term for this. Confucian scholarship discusses role asymmetry (e.g., Mengzi 3A:4 on unequal reciprocity) and critiques of one-sided demands (like in the Mengzi's "king without benevolence" passage), but no single label captures this modern distortion. 

  The core issue is a violation of *shu* (reciprocal consideration) by freezing the relational norm unidirectionally. Unlike simple hypocrisy, this leverages role ethics' structure to mask the imbalance—claiming consistency while ignoring that relational virtues are co-constitutive. 

  Important boundaries to set: 
  - Not hypocrisy (which is knowingly deceptive), as practitioners may genuinely believe their interpretation 
  - Not legitimate asymmetry (where roles have different duties, but both are binding) 
  - Not inability (where a superior tries but fails vs. outright denying the obligation exists)

  I'll call this "unidirectional role essentialism" since it treats the subordinate's duty as essential to the role while rendering the superior's contingent. The definition must emphasize how it weaponizes Confucian framework by severing the dyad—Xunzi's warnings about rulers who demand loyalty without benevolence feel relevant here.

  For the user's PhD work, they'll need this clearly distinguished from classical role ethics. Should mention how *zhong* (loyalty) presupposes *ren* (benevolence) in superiors, per Analects 3:19. The modern corporate/family examples show why precise naming matters—it exposes how power manipulates "tradition."
answer: |-
  **Bottom line:** The phenomenon you describe is best termed **unidirectional role essentialism**, defined as the selective reification of subordinate obligations within a Confucian relational dyad while dismissing correlative superior duties as non-binding, thereby distorting the interdependent nature of *gang* 綱 (cardinal relationships).

  ### Core Analysis of Confucian Relational Structure
  1.  **Dyadic Reciprocity (*Xiangshu* 相恕):** Confucian roles (ruler-minister, father-son, etc.) are defined by *mutual yet asymmetric* obligations (e.g., *zhong* 忠 [minister's loyalty] ↔ *ren* 仁/ *hui* 惠 [ruler's benevolence]; *xiao* 孝 [son's filiality] ↔ *ci* 慈 [father's compassion]). Asymmetry acknowledges different responsibilities, not hierarchy without reciprocity (Analects 12.11, Mengzi 3A4).
  2.  ***Shu* 恕 (Reciprocity) as Binding:** *Shu* isn't optional idealism; it operationalizes the Golden Rule ("Do not impose on others..." Analects 15.24). Negating the superior's duty violates *shu* by demanding unilateral sacrifice.
  3.  **Virtue Requires Cultivation (*Xiuji* 修己):** Superior roles demand active virtue-cultivation (*xiushen* 修身). A ruler lacking *ren* or a parent lacking *ci* fails their role's essence (Mengzi 4A3: "A ruler who regards ministers as hands/feet regards them as humans...").

  ### Defining Unidirectional Role Essentialism
  -   **Core Mechanism:** Extracting the subordinate's duty (*zhong*, *xiao*) as an absolute, context-independent requirement while framing the superior's reciprocal duty (*ren*, *ci*) as:
      *   *Aspirational* ("ideals we strive for"),
      *   *Context-dependent* ("business realities preclude benevolence"),
      *   Or *unnecessary for legitimacy* ("parents deserve *xiao* regardless of conduct").
  -   **Distinguishing Features:**
      *   **Hypocrisy vs. Structural Distortion:** Hypocrisy involves knowingly violating agreed norms. This is a *conceptual* distortion of Confucian ethics, weaponizing half a dyad while denying its interdependence. Practitioners often believe they uphold "tradition."
      *   **Asymmetry vs. Abrogation:** Legitimate asymmetry (e.g., a child's *xiao* manifests differently than parental *ci*) still binds both parties. This *abrogates* the superior's duty as non-binding.
      *   **Inability vs. Denial:** If a superior *cannot* fulfill duties despite effort (e.g., resource scarcity), it's a tragic failure. Unidirectional essentialism *denies the duty exists* within the role context (e.g., "business meritocracy negates benevolence obligations").
      *   **Ritual (*Li* 禮) Misuse:** Exploits *li*'s emphasis on role performance to freeze subordinate duties while dismissing superior virtues as exceeding ritual requirements.

  ### Scholarly Grounding & Boundaries
  -   **Classical Rebuttals:** Mengzi explicitly rejects one-sided demands: "When a ruler regards his ministers as dirt, they regard him as an enemy" (Mengzi 4B3). Xunzi links legitimate authority to moral conduct (*xiushen*).
  -   **Modern Critique:** Scholars like Roger Ames and Henry Rosemont Jr. emphasize roles as *relational achievements*, not fixed entitlements. Extracting *zhong*/*xiao* alone reduces persons to functions.
  -   **Boundary:** This does *not* apply when:
      1.  Superior duties are actively pursued but imperfectly realized (genuine effort).
      2.  Specific contexts *temporarily* prioritize subordinate duties (e.g., crisis requiring immediate loyalty), provided the reciprocal duty isn't denied.
      3.  Critique focuses on legitimate asymmetry within intact reciprocity.

  ### Conclusion
  Unidirectional role essentialism is a parasitic distortion of Confucian ethics. It hijacks the authority of relational roles (*gang*) while severing the *shu*-based reciprocity that makes them ethically coherent. Identifying this pattern exposes how power manipulates "tradition" to demand unconditional submission while evading accountability—a violation of Confucianism's core commitment to mutual human flourishing (*ren*).
