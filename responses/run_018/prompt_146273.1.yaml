prompt: |-
  me and my friend had this long arguement last night about whether escalation of commitment is just rational sunk-cost logic or if there's something deeper about identity and saving face. he kept bringing up that dollar auction game where you pay your loosing bids, but i think that misses how in real life people escalate because they've staked their reputation publicly on not quitting.

  i'm putting together a workshop for about 12 grad students in decision science, we have like 80 minutes, and i want them to actually feel that social-escalation version rather than just hear a lecture about it. can you design a classroom game or activity that makes participants feel the force of escalation of commitment, but inject a twist: instead of bidding cash, players make spoken "public commitments" defending a fictional failing project, and there's a hidden rule that once someone has made two commitments in a row, backing out forces them to deliver a 30-second explanation of their reversal in front of the group, with that "exposure cost" doubling every round they stay in. the rules should make them build the escalation themselves, then include a debrief that maps specific moments onto real institutional cases like corporate mergers that keep getting funded. please include setup, any roles, a timeline, what will predictably go wrong and how to handle it, and be honest about which feature of the classic dollar auction this version can't reproduce. don't ask them to read anything beforehand, and no citations or reading lists—just design it from scratch.
reasoning: |-
  We are designing a classroom activity to demonstrate escalation of commitment with a focus on public reputation and identity, rather than just monetary sunk costs. The twist is that participants make spoken public commitments to defend a fictional failing project, and there's an escalating social cost for backing out once they've committed multiple times.

  Key elements:
  - **Fictional project**: We need a simple, relatable scenario that is clearly failing but has some potential for argument. Example: "Project Horizon" - a software project that is over budget, behind schedule, and facing technical issues, but the team claims it's about to turn the corner.
  - **Public commitments**: Participants will make short statements (1-2 sentences) defending the project and committing to continue.
  - **Escalating exposure cost**: Once a participant has made two commitments in a row, if they then back out, they must deliver a 30-second explanation of their reversal in front of the group. The catch: the "exposure cost" (the awkwardness and public admission) doubles every round they stay in beyond the second commitment. We'll represent this by increasing the required length of the explanation (though we can't actually double time, so we'll use a different representation: for every round beyond two, they have to add an extra layer of vulnerability or detail, e.g., admit a personal mistake, name a specific wrong assumption, etc.). Alternatively, we can keep the time at 30 seconds but require that the explanation becomes more personal and vulnerable with each round.

  But note: We don't want to actually force people into uncomfortable personal confessions. So we'll frame the "exposure" as a fictional role-play. We'll also allow them to back out without the exposure cost until they have made two consecutive commitments.

  **Structure of the activity**:

  1. **Setup (10 minutes)**:
     - Introduce the concept of escalation of commitment briefly (without giving away the activity's purpose).
     - Present the fictional project: 
       *"Project Horizon: A cutting-edge software development project aimed at creating an AI-powered personal assistant for elderly care. The project was initially funded for 1 year with $2 million. Now, 18 months in, it has cost $3.5 million and is only 50% complete. Technical challenges have arisen, and market research suggests that competitors have launched similar products. The board is meeting to decide whether to cancel the project or approve an additional $1.5 million to complete it."*
     - Participants are board members. They will take turns to speak in defense of continuing the project or to advocate for cancellation.
     - Rules:
       * Each participant, when called upon, must make a statement. They have two choices:
          a. **Commit**: Defend the project and argue for continuing. They must state at least one reason and make a personal commitment (e.g., "I believe in this project because of X, and I commit to seeing it through").
          b. **Withdraw**: Advocate for cancellation. They must state at least one reason (e.g., "I think we should cut our losses because of Y").
       * However, if a participant has made **two consecutive commitments** (i.e., they spoke in the previous round and committed, and now they are about to speak again and are considering withdrawing), then withdrawing in this round triggers the "exposure cost": they must give a 30-second explanation of their reversal in front of the group. The explanation must include:
          - Why they changed their mind.
          - What they previously got wrong.
          - What they learned.
          - (And for every additional round they have committed beyond two, they must add an extra element: for round 3, they must also admit a personal error; for round 4, they must name a specific wrong assumption and how it affected the project; etc. We'll define these in advance.)

     - How the game progresses:
       * The facilitator will go around the room in order, and each participant must speak on their turn.
       * The game continues until no one wants to commit anymore, or until a set number of rounds (we have 12 students, so we can do 2-3 rounds per person? but we want escalation so we might have multiple rounds). We can structure it as a fixed number of rounds (say, 15 rounds total) and in each round, the facilitator randomly selects a participant (to avoid order effects). But random might break the consecutive commitment rule. Instead, we can have a fixed order and go around the circle multiple times.

     - To ensure the pressure builds, we can have 3 rounds (each participant goes 3 times). But we need to track consecutive commitments per person.

  2. **Tracking commitments**:
     - The facilitator will have a chart (on a whiteboard) with each participant's name and a counter for consecutive commitments. When a participant commits, their counter increases by 1. When they withdraw, their counter resets to 0. If they withdraw after having 2 or more consecutive commitments, they face the exposure cost.

  3. **The "Exposure Cost" Escalation**:
     - For the first withdrawal after exactly 2 consecutive commitments: 30-second explanation (with the required elements above).
     - For withdrawal after 3 consecutive commitments: 30-second explanation plus an additional requirement (e.g., admit a personal error and how it contributed to the failure).
     - For withdrawal after 4 consecutive commitments: even more (e.g., the above plus a specific lesson they learned and how they will apply it in the future).
     - We don't expect more than 4, but if so, add another layer (e.g., a public apology to a stakeholder).

  4. **Activity Flow (60 minutes total, including debrief)**:
     - Introduction and rules: 10 minutes
     - Gameplay: 30 minutes (with 12 participants, 3 rounds each would be 36 turns, but we can do 2-3 rounds depending on time)
     - Debrief: 20 minutes

  5. **What will predictably go wrong**:
     - **Problem**: Participants might avoid committing to prevent the exposure cost, leading to no escalation.
       * *Mitigation*: The facilitator can prime the group by emphasizing the importance of the project and the initial enthusiasm. Also, the facilitator can start by modeling a strong commitment. Additionally, the first round can be structured so that the first few participants are encouraged to commit (maybe the facilitator can assign the first two as committed in the backstory? or use a confederate? but we don't have confederates). Instead, the facilitator can say: "Remember, at the beginning of the project, we were all very enthusiastic. Let's try to recapture that spirit in the first round."

     - **Problem**: The exposure cost might be too embarrassing, causing participants to never withdraw and thus the project never ends.
       * *Mitigation*: The exposure cost is part of the lesson. If they never withdraw, the project keeps going and the exposure cost gets higher. The facilitator can stop after 3 rounds per person and then force a decision.

     - **Problem**: Some participants might not take the role-play seriously.
       * *Mitigation*: Set the tone at the beginning. The facilitator should be serious and frame it as a learning experience.

     - **Problem**: Time management: 30 minutes might be tight for 36 turns (if 3 rounds). Each turn should be short (30 seconds max for a statement). So 36 turns * 0.5 min = 18 minutes, plus exposure costs (which are 30 seconds to 1 minute) and transitions. So 30 minutes should be enough.

  6. **Debrief (20 minutes)**:
     - Start by asking participants how they felt during the activity.
     - Map specific moments in the game to real-world examples:
       * Corporate mergers: Like the AOL-Time Warner merger, where after initial problems, more money was poured in because of public commitments and reputation.
       * Public infrastructure projects: The Sydney Opera House, which was originally estimated at $7 million and ended up costing $102 million, with multiple points where they could have stopped but didn't due to national pride.
     - Discuss the difference between this and the dollar auction: In the dollar auction, the cost is monetary and incremental. Here, the cost is social and psychological, and it escalates in a step function (after two commitments). Also, in the dollar auction, only two players bid, while here we have a group dynamic.
     - What this version can't reproduce from the dollar auction: In the dollar auction, the bidding is competitive (two players trying to outbid each other) and the highest bidder wins the dollar but both pay their bids. Here, the competition is less direct and the "loss" is shared by the group (if the project fails, everyone loses). Also, the dollar auction has a clear monetary loss that is incremental and certain, while here the cost is uncertain and social.

  7. **Timeline**:
     - 0-10 min: Setup and rules.
     - 10-40 min: Gameplay (3 rounds, each round taking about 10 minutes: 12 turns * 30 seconds = 6 minutes per round, plus exposure costs and transitions, so 10 minutes per round).
     - 40-60 min: Debrief.

  **Revised Rules for Clarity**:

  - Each participant will get a turn in a fixed order (e.g., a circle). We'll do 3 rounds (each participant speaks 3 times).
  - On your turn, you must either:
     a. **Commit**: "I support continuing Project Horizon because [reason]. I commit to seeing it through."
     b. **Withdraw**: "I think we should cancel Project Horizon because [reason]."
  - If you choose to withdraw and you have made 2 or more consecutive commitments (i.e., in your last two turns you committed), then you must give a 30-second explanation of your reversal. The explanation must include:
     - Why you changed your mind.
     - What you previously got wrong.
     - What you learned.
     - And for each consecutive commitment beyond 2, an additional element (see below).

  - **Exposure cost escalation**:
     - Withdrawal after 2 consecutive commitments: Base explanation (three elements above).
     - After 3: Base + admit a personal error and how it contributed.
     - After 4: Base + personal error + a specific wrong assumption and how it affected the project.
     - After 5: Base + personal error + wrong assumption + a public apology to a stakeholder (e.g., "I apologize to our shareholders for wasting their money").

  **Note**: We hope that after 3 rounds, most people will have at least 2 consecutive commitments, so the pressure will be high.

  **Facilitator Script Snippets**:

  - "Welcome. Today we're going to simulate a board meeting for Project Horizon... Remember, two consecutive commitments and then withdrawing will require you to explain your reversal publicly."
  - During the game: "It's [Name]'s turn. Would you like to commit or withdraw?"
  - After a withdrawal that triggers exposure: "Since you had made [X] consecutive commitments, please give your 30-second explanation including [list required elements]."

  **What to Track**:
  - On a whiteboard, have a grid:
     | Participant | Round 1 | Round 2 | Round 3 | Consecutive Count |
     Then update as they go.

  This activity should create a palpable sense of social pressure and illustrate how identity and public reputation fuel escalation beyond rational sunk costs.
answer: |-
  ### **Project Horizon: Escalation of Commitment Workshop**  
  **Duration:** 80 minutes  
  **Participants:** 12 grad students (no prep needed)  
  **Goal:** Simulate social/identity-driven escalation (distinct from monetary sunk costs) using public commitments and exposure costs.  

  ---

  ### **Core Mechanics**  
  - **Fictional Project**: "Project Horizon"—a doomed AI-powered farming drone. Backstory:  
    > *"2 years in, $20M spent. Drones crash in rain, competitors dominate the market, and the tech lead quit. The board must decide: Cancel or fund one more round ($5M)."*  
  - **Commitments**: Verbal defenses of Project Horizon (e.g., *"We’ve invested too much talent to quit now!"*).  
  - **Exposure Cost**: Withdrawing after **two consecutive commitments** forces a 30-second public confession. Cost escalates:  
    - **Round 1-2**: Basic explanation.  
    - **Round 3+**: Add *"vulnerability layers"* (admitting personal bias, flawed logic, or emotional stakes).  

  ---

  ### **Setup (10 min)**  
  1. **Room Layout**: Chairs in a circle. Whiteboard tracking:  
     - *Player names*  
     - *Commitment streaks* (e.g., "Ana: ✅✅" for two commits).  
     - *Exposure cost level* (starts at 0).  
  2. **Assign Roles**: All act as "board members." Randomly pick a starting player.  
  3. **Rules Brief**:  
     - On your turn: **Commit** (defend Project Horizon) or **Withdraw** (argue to cancel).  
     - Speak for ≤30 seconds. No interruptions.  
     - **Exposure Rule**: Withdraw after ≥2 consecutive commits → 30-sec public confession.  
       - *Cost escalation*: For every extra round you stay committed, add vulnerability (e.g., Round 3: *"I ignored data because I wanted a promotion"*).  

  ---

  ### **Gameplay (45 min, 3 Rounds)**  
  **Structure**:  
  - **Round 1** (15 min):  
    - Players take turns committing/withdrawing.  
    - *Facilitator nudges*: *"Remember, Horizon’s team morale depends on you!"*  
    - **Predictable Issue**: Early withdrawals → low tension.  
      - *Fix*: Play "devil’s advocate" as facilitator: *"If we cancel, 50 jobs are lost. Can we abandon our farmers?"*  
  - **Round 2** (15 min):  
    - Re-start order from last player.  
    - Track streaks on whiteboard (e.g., "Ben: ✅→❌" resets streak).  
    - **Predictable Issue**: Hesitation as streaks build.  
      - *Fix*: Praise commitment courage: *"Maria’s passion shows leadership!"*  
  - **Round 3** (15 min):  
    - Players with ≥2 streaks risk high-cost confessions.  
    - Escalation example:  
      - *Withdraw after 3 commits*: "I knew the data was bad, but I didn’t want my mentor to think I’m a quitter."  
    - **Predictable Issue**: Awkward silence during confessions.  
      - *Fix*: Normalize vulnerability: *"This is how it feels in boardrooms—let’s sit with that discomfort."*  

  **Key Twist**: The exposure cost is *social*, not financial. Players *feel* reputation risk build.  

  ---

  ### **Debrief (25 min)**  
  **Guided Discussion**:  
  1. **"When did you feel trapped?"**  
     - Map responses to real cases:  
       - *Corporate mergers*: "Like Boeing doubling down on the 737 MAX after public praise."  
       - *Government projects*: "Australia’s Sydney Opera House—12x over budget to avoid national shame."  
  2. **"What drove escalation? Logic or identity?"**  
     - Highlight moments where saving face > rationality (e.g., *"I couldn’t look weak after my last speech"*).  
  3. **Contrast with Dollar Auction**:  
     - *What this game captures better*: Social identity, public reputation, emotional stakes.  
     - *What it misses*: Competitive bidding wars (no "winner" here—just collective pain).  

  **Closing Insight**:  
  > *"Escalation isn’t just about money—it’s about the story we tell ourselves and others. Withdrawing feels like erasing part of your identity. That’s why smart leaders separate ‘self-worth’ from ‘project-worth’."*  

  ---

  ### **Facilitator Cheat Sheet**  
  - **Timeline**: Setup (10), Game (45), Debrief (25).  
  - **Predictable Issues**:  
    - **Low early commitment**: Prime with emotional language (*"Farmers are counting on us!"*).  
    - **Confession anxiety**: Emphasize role-play (*"You’re a board member, not yourself"*).  
  - **Critical Moment**: When the first player faces exposure—pause and highlight their body language.  
  - **No Props Needed**: Only whiteboard + timer.  

  This design forces players to *live* the identity-driven escalation loop. The dollar auction’s bidding tension is replaced by the dread of public self-contradiction—making the social stakes visceral.
