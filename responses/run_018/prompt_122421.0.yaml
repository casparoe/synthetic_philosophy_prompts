prompt: |-
  Hey — long one, sorry in advance. I'm in a methods reading group (psych adjacent, mostly grad students plus one statistician who keeps audibly sighing) and I've been asked to write up my own position on the replication mess so the others can poke at it before the next session. I'd rather find the holes myself first, so here's roughly where I've landed:

  (1) The crisis is mainly a selective-reporting problem — p-hacking, publication bias, the file drawer, the garden of forking paths — not a problem with the internal logic of frequentist inference. A p-value does what it says on the tin; people just fed it garbage. (2) Because of that, I'm happy to let big multi-site preregistered replications and meta-analyses adjudicate: if a claim has been through that filter I'll believe it, and if it hasn't I'm at maybe 50/50 at best. (3) I'm not a Bayesian in practice. Priors feel like a license to smuggle in what you already hoped was true, and I don't want my conclusions to depend on my guess; long-run error control is the thing a method can actually promise. (4) That said, I like the proposal floating around to drop the default threshold by an order of magnitude (0.05 to 0.005), and I like preregistration as the main institutional fix. (5) I think the field should de-emphasize dichotomous significant/not-significant verdicts in favour of reporting effect sizes and interval estimates. (6) I also think exploratory analysis is where the interesting findings actually come from, and I don't want a culture where nobody is allowed to look at their own data until they've committed to an analysis plan.

  And here's the bit I've been pushing in the group that nobody has quite shot down yet — I call it search-adjusted thresholds. The idea: how suspicious you should be of a nominally significant result ought to scale with how searchy the literature it comes from is, not just with the design of the single study. A p = 0.04 from a clean pre-registered test of a prediction nobody had thought to look for is one thing; the same number from a subfield where everyone runs twenty outcomes and four exclusion criteria and reports whichever one cleared the bar is quite another, even if the paper in front of you is itself preregistered, because the whole literature's habits are what generated the hypothesis you're now testing. So the evidential bar should rise with the forking density of the surrounding research area. My statistician friend says this is just a prior wearing a trenchcoat, and that once you start estimating forking density you're doing exactly the thing in (3) that I say I don't want to do. I think it's a correction for a measurable feature of a procedure and it can in principle be read off the design, not off my hopes. Who's closer to right?

  What I want is an audit of the whole package, not a lecture on any single item: which of these actually collide with each other, which only look like they do and dissolve once you cash them out, and for each real collision what the cheapest fix would be and what it would cost me. Rank the tensions by how bad they are rather than flagging all of them as equally fatal, and tell me if there's a single revision that would clean up several at once. Also, please seperate what's settled from what's genuinely contested among people who work on this — flag plainly when something you're telling me is one side of a live argument instead of smoothing it into the consensus view — and where you're reading a commitment into me that I didn't actually state, say what you're assuming so I can disown it if it isn't mine.
reasoning: |-
  Okay, let me start by unpacking this user's query. They're in a methods reading group, mostly psych grad students with a statistician who sighs a lot. They've been asked to present their position on the replication crisis and want to find holes before the group session. Their stance includes points about selective reporting, trust in multi-site replications, skepticism towards Bayes, support for lowering p-values, de-emphasizing dichotomous results, valuing exploratory analysis, and their idea of search-adjusted thresholds.

  First, I need to understand their main arguments. They see the replication crisis as a problem of how research is conducted (p-hacking, publication bias) rather than an issue with frequentist inference itself. They rely on large preregistered replications and meta-analyses for validation. They reject Bayesian methods because priors can be subjective. They advocate for lowering the p-value threshold to 0.005 and emphasize effect sizes over significance. They also defend exploratory analysis as essential for discovery. Their unique idea is adjusting significance thresholds based on how "searchy" a field is, which the statistician calls a "prior in a trenchcoat."

  The user wants an audit of their entire package, identifying internal tensions, ranking them, and suggesting fixes. They also want clarity on what's settled vs. contested and to point out any assumed commitments.

  Looking at their points, the first tension is between rejecting Bayesian priors and their search-adjusted thresholds. The statistician's critique that it's a prior in disguise seems valid. Adjusting thresholds based on field practices requires estimating how much flexibility exists, which involves subjectivity. This clashes with their stance against priors.

  Another tension is between valuing exploratory analysis and advocating strict preregistration. Exploratory work generates hypotheses but risks p-hacking. Their proposal might discourage such explorations if thresholds become too high in "searchy" fields. They need a way to protect exploratory findings without inviting false positives.

  Their reliance on large replications and meta-analyses could be undermined by the file drawer problem. Even big studies might not escape publication bias. Also, lowering p-values to 0.005 might reduce false positives but increase false negatives, especially in underpowered studies. This conflicts with their 50/50 stance on unvetted claims.

  De-emphasizing dichotomous results is good, but their threshold adjustments still rely on significance testing. This might send mixed messages about moving beyond p-values. They need consistent emphasis on effect sizes and CIs.

  The user might not realize how their search-adjusted thresholds require subjective input, contradicting their rejection of priors. Also, their trust in meta-analyses overlooks residual biases. Highlighting these as major tensions is key. Suggesting sensitivity analyses or pre-registering exploratory thresholds could help. Emphasizing estimation over testing aligns with their other points and reduces reliance on thresholds.
answer: |-
  Here's an audit of your position, structured as requested. I'll focus on internal tensions, rank them by severity, identify settled vs. contested points, flag assumptions, and suggest fixes. Your core position is coherent and common among thoughtful frequentists, but some key friction points need addressing.

  **Ranked Tensions & Collisions:**

  1.  **"Search-Adjusted Thresholds" vs. "Rejection of Bayesian Priors" (High Severity)**
      *   **The Collision:** Your statistician friend is substantially correct. "Search-adjusted thresholds" **are** effectively an attempt to quantify and incorporate an empirically estimated **Bayesian prior probability that the hypothesis is false** (or that a non-null effect exists) based on domain characteristics. Estimating "forking density" isn't just reading a design; it requires:
          *   Defining the relevant "subfield" or "literature" (subjective boundary).
          *   Quantifying the typical researcher degrees of freedom (practices are rarely documented fully).
          *   Estimating the base rate of true effects in that domain (which is the *core* prior).
          *   Modeling the selection process (which hypotheses even get tested/reported).
      *   **Why it clashes with (3):** You reject priors because "Priors feel like a license to smuggle in what you already hoped was true." Estimating "forking density" unavoidably involves **subjective choices and assumptions** about the research landscape and base rates. It's not an objective feature of *this specific study's design*; it's an estimate about the *context* and the *process* that generated the hypothesis. This *is* introducing an element you hoped was objective ("measurable feature of a procedure") but which inherently relies on subjective modeling.
      *   **Cheapest Fix:** **Reframe it explicitly as an empirical Bayesian adjustment.** Acknowledge that while you dislike subjective priors, you *are* advocating for using empirical evidence about research practices and historical base rates within a domain to inform the strength of evidence required. This is a common pragmatic bridge. Frame it as "calibration based on estimated false discovery risk in the field" rather than pretending it's purely frequentist design correction.
      *   **Cost:** You lose the purity of claiming to avoid priors entirely. You embrace a specific, empirically grounded *type* of prior. It forces you to justify your estimation methods for "forking density."
      *   **Contested?** YES. This is a live debate. Some argue this adjustment *is* necessary for valid inference given publication bias (e.g., Ioannidis, Button). Others argue it's messy, subjective, undermines the interpretability of the p-value, and that the solution lies in better primary study design/meta-analysis (strict frequentists). The "empirical Bayes" middle ground is widely discussed but implementation details are contested.

  2.  **Valuing Exploratory Analysis vs. Demanding High Evidence Standards / Preregistration (Medium Severity)**
      *   **The Collision:** You strongly endorse exploratory analysis ("where interesting findings come from") and don't want a culture stifling it (6). Yet, your core solutions (2, 4, 5) and search-adjusted thresholds heavily emphasize pre-registration, strict p-value thresholds, and requiring multi-site replication for belief – standards inherently designed for *confirmatory* research. Exploratory findings, by their nature, are:
          *   Prone to high forking paths/fishing.
          *   Unlikely to be pre-registered *as tests of that specific hypothesis*.
          *   Unlikely to immediately get multi-site replication.
          *   Often generate p-values that would be highly suspect under your "searchy field" adjustment.
      *   **Why it clashes:** Your framework risks making exploratory findings essentially "unpublishable" or automatically deemed untrustworthy by your own standards (50/50 at best). This creates a tension between fostering discovery and demanding confirmatory rigor.
      *   **Cheapest Fix:** **Explicitly separate the evidential standards for exploratory vs. confirmatory research.** Advocate for:
          *   Clear labeling of all analyses as exploratory or confirmatory.
          *   Different reporting standards: Exploratory focuses on *descriptive* effect sizes, CIs, transparent reporting of *all* analyses run (not just "significant" ones), and explicitly framing results as hypothesis-*generating*. Save stringent p-values and search adjustments for labeled confirmatory tests.
          *   Viewing exploratory findings as requiring *subsequent* confirmatory testing (ideally preregistered) before strong belief is warranted.
      *   **Cost:** Requires cultural shift in reporting. Doesn't eliminate the problem that exploratory findings are often over-interpreted as confirmatory.
      *   **Contested?** Settled in principle (most agree on the distinction), contested in practice. How strictly to enforce separation, how to report exploratory findings usefully without over-selling, and whether journals will accept "exploratory-only" papers are ongoing issues.

  3.  **Reliance on Meta-Analysis vs. Pervasive Selective Reporting (Low-Medium Severity)**
      *   **The Collision:** You trust big multi-site preregistered replications and meta-analyses to adjudicate (2). However, meta-analyses (even of "big" studies) are still vulnerable if:
          *   The *replication attempts themselves* suffer from publication bias (non-significant replications get filed away).
          *   The original literature feeding into the meta-analysis was heavily selected (garbage in, garbage meta).
          *   Multi-site replications are expensive and selective – only high-profile effects get tested this way.
      *   **Why it clashes (subtly):** Your solution (2) depends on institutions (funders, journals) prioritizing and publishing these large efforts *regardless of outcome*. If the file drawer persists even for replications, meta-analyses won't be the gold standard you hope for.
      *   **Cheapest Fix:** **Explicitly add "with mandatory publication of all results regardless of outcome"** to your point (2). Strongly advocate for Registered Reports format *for replication attempts and meta-analyses*.
      *   **Cost:** Requires significant institutional buy-in that isn't universal yet.
      *   **Contested?** Settled that publication bias undermines meta-analysis. Contested on how severe the problem remains for large replication efforts and the best solutions (Registered Reports vs. other pre-commitment mechanisms).

  4.  **Lowering Alpha (p=0.005) vs. Exploratory Analysis & Feasibility (Low Severity)**
      *   **The Collision:** Lowering alpha reduces false positives but drastically increases sample size requirements (Type II error). This is particularly challenging for:
          *   Exploratory research where resources are spread thinner across many hypotheses.
          *   Under-resourced fields or rare populations.
          *   Detecting small (but potentially important) effects.
      *   **Why it clashes (mildly) with (4 & 6):** Your preferred fix (lower alpha) could make the exploratory work you value even harder to do convincingly or could push researchers towards even more questionable practices (e.g., selective reporting within a massive underpowered study) to chase significance.
      *   **Cheapest Fix:** **Reinforce point (5) - De-emphasize dichotomization.** Frame p=0.005 as a *default guideline for confirmatory tests*, not an absolute rule. Emphasize that effect sizes and CIs are paramount, regardless of significance. Acknowledge that resource constraints exist, but argue the cost of false positives justifies higher evidence bars where possible. This aligns with your core "garbage in" view – a stricter filter needs better inputs (larger N).
      *   **Cost:** May slow down research progress in some areas. Doesn't solve the power problem for resource-limited fields.
      *   **Contested?** VERY. The 0.005 proposal (Benjamin et al.) is highly contentious. Proponents cite false positive rates; opponents cite feasibility, increased false negatives, and argue it doesn't fix the underlying incentives causing p-hacking. Many argue focusing on estimation (CIs) is better than tweaking alpha.

  **Assumed Commitments (I Flagged & You Can Disown):**

  1.  **"Frequentist Inference is Sufficient":** Your points (1, 3) strongly imply you see no fundamental flaw in frequentism itself, only its misuse. I assumed you reject arguments that frequentism is inherently flawed (e.g., likelihood principle violations, misinterpretation of p-values). *Disown if you think there are deeper flaws.*
  2.  **"Institutional Reforms > Methodological Revolution":** Your solutions (preregistration, multi-site reps, meta-analysis, lowering alpha) focus on improving practices *within* a frequentist framework. I assumed you don't believe switching paradigms (e.g., mandatory Bayes) is necessary or feasible. *Disown if you think paradigm shift is crucial.*
  3.  **"p-value thresholds have *some* utility":** While advocating de-emphasis (5), you support lowering alpha (4) and propose search-adjusted thresholds. I assumed you believe dichotomization, while problematic, is pragmatically useful (e.g., for decision-making, screening). *Disown if you think thresholds should be abandoned entirely.*

  **Settled vs. Contested:**

  *   **Settled (Near Consensus):**
      *   Selective reporting (p-hacking, publication bias) is a *primary driver* of the replication crisis (Point 1). (Though its *relative contribution* vs. other factors like low power is debated).
      *   Preregistration and Registered Reports are effective tools to combat selective reporting for *confirmatory* research (Part of your Point 4).
      *   Over-reliance on dichotomous "significance" (p<0.05) is harmful; reporting effect sizes and CIs is essential (Point 5).
      *   Meta-analysis of well-conducted primary studies (ideally pre-registered replications) is a key tool for evidence synthesis (Part of Point 2, contingent on addressing publication bias).
      *   Exploratory and Confirmatory research require different standards (The *principle* behind resolving Tension 2).
  *   **Genuinely Contested (Live Arguments):**
      *   **The fundamental cause:** Is it *only* selective reporting/misuse (your view), or are flaws in NHST/interpretation also fundamental? (Debate around Point 1).
      *   **The Bayesian/Frequentist divide:** The utility and necessity of Bayesian methods vs. improving frequentist practice (Core of Point 3 vs. others advocating Bayes).
      *   **The p=0.005 Proposal:** Is lowering alpha the right solution? (Point 4).
      *   **Search-Adjusted Thresholds / Empirical Bayes:** Are adjustments based on research context necessary and feasible, or subjective and problematic? (Your proposal vs. critique).
      *   **The primacy of the solution:** Is large-scale replication (Point 2) *the* filter, or are better primary studies (via preregistration, power, etc.) more crucial/feasible?
      *   **The viability of separating Exploration/Confirmation:** Can it work in practice culturally and publication-wise? (Tension 2 fix).

  **The Single Revision with Broadest Impact:**

  **Explicitly, rigorously, and consistently separate "Exploratory" and "Confirmatory" research in your framework and proposed solutions.**

  *   **Why it helps multiple tensions:**
      *   **Tension 2 (Exploration vs. Rigor):** Directly addresses the core conflict. Allows you to champion exploration without weakening confirmatory standards.
      *   **Tension 4 (Lower Alpha Feasibility):** Justifies applying strict alpha (and potentially search-adjustments) only to confirmatory tests, making it more feasible. Exploratory uses descriptive stats/CIs.
      *   **Search-Adjusted Thresholds (Tension 1 Context):** Makes applying such adjustments *only* to confirmatory tests more logical. You're adjusting the bar for *tests presented as confirmatory* based on the field's tendency to generate false confirmations. Exploratory results aren't making confirmatory claims.
      *   **Clarifies Point 6:** Defends the value of exploration while ring-fencing its conclusions.
      *   **Strengthens Point 5:** Reinforces that exploration focuses on estimation/description, not dichotomous testing.
  *   **Cost:** Requires clear definitions, labeling standards, cultural acceptance, and potentially different publication formats. Doesn't eliminate all subjectivity in labeling.

  **Overall Verdict:**

  Your position is coherent and represents a defensible, pragmatic frequentist response to the crisis. The most significant internal tension is indeed your search-adjusted threshold proposal conflicting with your rejection of Bayesian priors – your statistician has a strong point. Reframing it as empirical Bayes is the cleanest fix. Explicitly separating exploratory and confirmatory research resolves several other tensions gracefully. Be prepared for lively debate, particularly on the role of Bayes, the p=0.005 proposal, and the practicalities of your search-adjustment idea. Good luck in the reading group – the sighing statistician sounds like fun!
