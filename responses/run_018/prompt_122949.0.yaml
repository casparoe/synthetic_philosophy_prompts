       - We can say: yes, in practice we can look at the code. But note that sometimes we are in a situation where we don't have the code (third-party service) or the system is too complex, and we are trying to infer behavior from logs. Also, even when we have the code, how do we know it won't change? The problem of induction still applies: we have seen the code today, but will it be the same tomorrow? We rely on the fact that the future will be like the past (no unannounced changes). 

