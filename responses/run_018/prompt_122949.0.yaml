  We are designing a session for the "Judgement Calls" workshop. The goal is to explore the problem of induction, specifically the underdetermination of theory by evidence (Goodman's grue problem) without using the term "grue". The session should be interactive, with participants actively engaging in writing rules and making predictions.

  Constraints:
  - No lecture at the front.
  - Do not reveal the puzzle's label (like "grue") until the debrief.
  - Participants are mostly backend/data engineers and product managers without philosophy training.
  - 90 minutes total.
  - Must involve doing: writing rules, making predictions, with a small stake (points, leaderboard, trivial prize).
  - The setting: a log from a black box service with inputs and responses. Participants write a rule in a fixed pseudo-code vocabulary, then predict the next week of traffic.

  Key elements to include:
  1. A warm-up phase to entrench two groups with different vocabularies (one with time-free predicates, the other with date-indexed ones) to show how recent history affects confidence.
  2. In the main round, both groups get the same full vocabulary and data. The ground truth is a time-indexed rule (like a feature flag branching on a future date) that fits the past data but diverges afterward.
  3. After committing to a rule, participants are offered a chance to rewrite for a small penalty (to see if they reconsider).

  Debrief should cover:
  - Underdetermination of future by past evidence.
  - The issue is not whether to project but which rule to project.
  - Address the objection that in real engineering we have deployment logs, source code, etc.

  Structure:

  I. Warm-up phase (20 minutes)
     - Split the room into two groups: Group A and Group B.
     - Each group gets a different set of training data and a restricted vocabulary for writing rules.

     Group A (Time-free group):
       - Vocabulary: only time-free predicates (e.g., properties of the input, arithmetic, comparisons, but no date/time functions).
       - Training data: a small set (say 10 rows) of logs from a service where the rule is time-free (e.g., if input property X > 5, then response A, else B).

     Group B (Time-indexed group):
       - Vocabulary: only time-indexed predicates (e.g., functions that reference the current date, day of week, etc.) and the same time-free ones? Actually, to entrench, we might give them a set that requires time-indexed to do well.
       - Training data: a small set of logs from a service where the rule changes based on date (e.g., before a certain date, use rule R1, after, use rule R2). But note: the change date must be in the future relative to the training data? Actually, for training, we can have the change happen during the training period? But we want to entrench the use of time-indexed rules.

     Alternatively, to avoid confusion, we can have two separate warm-up exercises:

     For Group A:
       - Exercise: Predict the response for new inputs. The rule is time-free (e.g., if input.x > 5, response=1; else response=0).
       - They get points for correct predictions.

     For Group B:
       - Exercise: Predict the response for new inputs. The rule is time-indexed (e.g., if date < 2023-10-15, then response=1; else response=0). But the training data includes dates before and after the change? Actually, we want to train them to use time-indexed rules. So we can have the training data for Group B span a change: some logs from before and some from after the change. They must write a rule that uses the date to account for the change.

     However, note the constraint: we don't want the two groups to know about the other's exercise. So we must run the warm-up simultaneously without interaction.

     How to prevent comparing notes? We can have the warm-up done individually on laptops, with the instructions and data tailored per group. We assign each participant to a group at the start (randomly) and they only see their own warm-up.

     Steps for warm-up:
       - Assign groups (A or B) randomly to each participant.
       - Each participant gets a warm-up dataset (10 rows) and a vocabulary (restricted to their group).
       - They write a rule (in the provided pseudo-code) that fits the training data.
       - Then, they are given 5 new input rows (without the response) and must predict the response for each.
       - They get 1 point per correct prediction.

     After warm-up, we collect the rules and scores. We don't reveal the other group's existence or the differences yet.

  II. Main Round (50 minutes)
     - Now we merge: everyone gets the same full vocabulary (both time-free and time-indexed predicates) and a new, larger dataset (a few hundred rows) from a black box service. The data runs up to a certain date (say, up to 2023-10-20). The ground truth rule is time-indexed: it changes at a future date (say, 2023-10-25). The data they see is all before the change, so the rule that uses the change date (with the condition "if date < 2023-10-25") will behave exactly as a time-free rule (e.g., always response A) until that date.

     Steps:
       a. Present the dataset (inputs and responses) for the period up to 2023-10-20.
       b. Participants write a rule (in the fixed pseudo-code) that they believe explains the data. They commit this rule (submit via a form).
       c. After committing, they are shown the next week's worth of inputs (without responses) from 2023-10-21 to 2023-10-27. They must predict the response for each input in this period.
       d. Before revealing the actual responses, we offer a twist: 
          - Participants are told they can rewrite their rule for a penalty (say, -2 points). They can write any rule that fits the past data (up to 2023-10-20) and then use that to re-predict. They have 5 minutes to decide and rewrite.
       e. Then, we reveal the actual responses for the next week and score their predictions.

