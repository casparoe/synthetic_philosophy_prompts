     We expect:
       - Most participants in Group A (from warm-up) will write a time-free rule because they were entrenched. Similarly, Group B might be more likely to write a time-indexed rule? But note: the data in the main round (until 2023-10-20) is consistent with a time-free rule (because the change hasn't happened yet). So even Group B might write a time-free rule? However, we want to see if the warm-up influences them.

     Actually, the ground truth for the main round is that until 2023-10-20, the service always returns A (for example). Then after 2023-10-25, it returns B. But note: the next week we are predicting includes dates before and after the change? We have to design the timeline:

