       - On 2023-10-26: ground truth is B, rule returns B -> correct.

     But actually, we want to show that there are infinitely many rules that fit the past. We don't need to show that they are all wrong in the test, but that they can be arbitrarily different.

     However, for the main round, we are going to reveal that the actual rule was the one with 2023-10-25. So any rule that doesn't use that exact date will be wrong on at least one day (if it uses a different change date) or always wrong after (if it's time-free).

     The point: participants will have written a rule that is time-free (always A) and then it fails after 2023-10-25. Or they might have written a time-indexed rule with a different change date and fail on the transition.

     We hope that the Group A (time-free warm-up) will be more likely to write a time-free rule and Group B to write a time-indexed rule, but note that even Group B might write a rule with a change date that is not 2023-10-25? And they will be wrong. But that's okay.

