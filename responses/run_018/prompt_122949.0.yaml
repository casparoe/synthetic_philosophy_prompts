     We reveal:
       - The existence of the two warm-up groups and the different training.
       - The ground truth rule for the main round (time-indexed with change at 2023-10-25).
       - How many participants in each group wrote time-free vs time-indexed rules? (We can show aggregate stats.)
       - How many chose to rewrite? And what happened to their scores?

     Then, we discuss:
       - The underdetermination: many rules fit the past data (we can show examples: the always-A rule, the rule that changes at 2023-10-25, at 2023-10-26, at 2023-10-27, ... and also rules that use other conditions, like if the day of the week is Tuesday, then B, else A? but that wouldn't fit the training data because in the training period, every day is A. So only rules that always return A or rules that use a future change date would fit. We can note that we could have designed the data to allow for more alternatives.)

