           return 'A'
       else:
           return 'B'

     But also, a time-free rule:
       return 'A'

     And also, a rule that uses a different change date:
       if current_date() < date('2023-10-26'):
           return 'A'
       else:
           return 'B'

     This rule would fit the training data (because all training dates are < 2023-10-26) but then for the test data, it would return A until 2023-10-26, then B. But note: the ground truth changes on 2023-10-25, so on 2023-10-25, the ground truth is B, but this rule would still return A (because 2023-10-25 < 2023-10-26). So it would be wrong on 2023-10-25, then correct on 2023-10-26 and after? Actually, no: the ground truth for 2023-10-25 is B, but the rule returns A -> wrong. Then on 2023-10-26, the rule returns B -> correct.

