  Below is the complete design for your 90-minute "Judgement Calls" session focused on induction and predicate projection. It uses a hands-on, trap-based approach to let participants experience the core problem firsthand, without philosophy jargon. The session structure, constraints, and your two key requirements are fully addressed.

  ---

  ### **Session Title**: The Black Box Prediction Game  
  **Duration**: 90 minutes  
  **Participants**: 16 people (backend/data engineers, product managers)  
  **Materials**:  
  - Laptops for all participants.  
  - Shared Google Sheet (or similar) for rule submission and scoring.  
  - Projector to display rules/leaderboard.  
  - Pre-generated datasets (described below).  

  ---

  ### **Phase 1: Warm-Up (20 minutes)**  
  *Goal: Entrench two groups with different "successful" rule-writing habits.*  

  1. **Group Split (0:00–0:05)**:  
     - Randomly assign participants to **Group A** or **Group B** (8 each).  
     - **Critical**: Use codenames (e.g., "Alpha Group," "Beta Group") to avoid signaling differences. Groups sit apart and are instructed not to discuss.  

  2. **Warm-Up Task (0:05–0:20)**:  
     - **Both groups** receive a dataset of **50 log entries** from a fictional "Colorizer" service. Each log shows:  
       - `input`: A color name (e.g., "red," "green").  
       - `response`: A hex code (e.g., "#FF0000" for red).  
     - **Group A (Time-Free)**:  
       - **Vocabulary**: Only time-free predicates (e.g., `input == "red"`, `input.contains("e")`).  
       - **Success Condition**: Correctly predict responses for 5 test inputs.  
       - **Ground Truth**: Rules based *only* on input color (e.g., `if input == "red": return "#FF0000"`).  
       - **Scoring**: 1 point per correct prediction. Leaderboard displayed.  
     - **Group B (Time-Indexed)**:  
       - **Vocabulary**: Only time-indexed predicates (e.g., `day_of_week == "Monday"`, `timestamp < 2023-10-15`).  
       - **Success Condition**: Same as Group A.  
       - **Ground Truth**: Rules change daily (e.g., `if day_of_week == "Monday": return "#FF0000"`).  
       - **Scoring**: Same as Group A.  

  **Why this works**:  
  - Group A learns time-free rules are reliable; Group B learns time-indexed rules win.  
  - Entrenchment is achieved via quick reinforcement (scoring/leaderboard).  

  ---

  ### **Phase 2: Main Round (45 minutes)**  
  *Goal: Reveal underdetermination. Participants commit to rules for a black-box service, then face a future divergence.*  

  1. **Dataset Introduction (0:20–0:25)**:  
     - **New service**: "Widgetizer" (inputs: `size` (S/M/L), `material` (wood/metal); response: `quality_score` (1–10)).  
     - **Shared dataset**: **200 logs** (timestamps from 2023-10-01 to 2023-10-20).  
       - *All logs show a clear pattern*: `if material == "wood": return 8 else return 3`.  
     - **Full vocabulary**: Combines Group A/B predicates (time-free + time-indexed).  

  2. **Rule Commitment (0:25–0:35)**:  
     - Participants write rules in a **fixed pseudo-code**:  
       ```python
       # Allowed: Comparisons (==, !=, <, >), logical ops (and, or, not), time functions (day_of_week(), timestamp < CONSTANT)
       # Example: if material == "wood": return 8 else return 3
       ```  
     - Rules must fit all 200 logs. Submit via Google Form.  

  3. **Rewrite Offer (0:35–0:40)**:  
     - **Twist**: Participants can rewrite their rule for a **2-point penalty**. New rule must fit all past logs.  
     - **Catch**: Only 2 minutes to decide. Most won’t rewrite (due to entrenchment/overconfidence).  

  4. **Prediction & Scoring (0:40–0:55)**:  
     - Predict `quality_score` for **50 new inputs** (timestamps: 2023-10-21 to 2023-10-27).  
     - **Ground Truth**:  
       ```python
       if timestamp < 2023-10-25:  # Hidden future cutoff
           if material == "wood": return 8 else return 3
       else:  # Change starts on 2023-10-25
           if material == "wood": return 3 else return 8  # Flips!
       ```  
     - **Scoring**: 1 point per correct prediction (max 50). Leaderboard updates.  

  ---

  ### **Phase 3: Reveal & Debrief (25 minutes)**  
  *Goal: Link the experience to the philosophical puzzle, address objections, and acknowledge limitations.*  

  1. **Reveal the Trap (0:55–1:00)**:  
     - Show the ground-truth rule with the **hidden timestamp branch**.  
     - Project anonymized rules:  
       - > "Group A: 7/8 used time-free rules. Group B: 6/8 used time-indexed rules."  
       - > "Only 2 participants rewrote rules (both from Group B)."  
     - Highlight scores: Time-free rules failed post-10/25; time-indexed rules failed if they guessed the wrong date.  

  2. **Map to the Philosophical Problem (1:00–1:10)**:  
     - **Underdetermination**: "All 200 logs fit infinitely many rules. For example:"  
       - Rule 1: `material == "wood" → 8 else 3` (time-free).  
       - Rule 2: `timestamp < 2023-10-25 → [Rule 1] else flipped` (actual ground truth).  
       - Rule 3: `timestamp < 2024-01-01 → [Rule 1] else return random` (fits past, diverges later).  
     - **The Core Issue**: "This isn’t about *whether* to project the past, but *which* equally good rule to project. Your warm-up training made some rules ‘feel’ safer."  
     - **Goodman’s Grue**: Now reveal the term. Define it simply:  
       > "A color is 'grue' if it looks green before 2024 but blue after. Is the next observation ‘green’ or ‘grue’? Both fit past data."  

  3. **Handle Predictable Objections (1:10–1:15)**:  
     - **Objection 1**: "Real engineering has source code/deployment logs!"  
       - **Response**: "Agreed! But:  
         1. We often infer behavior from logs (e.g., third-party APIs).  
         2. Code can change *tomorrow*. Why do we assume it won’t?  
         3. This exercise is a metaphor for any induction under uncertainty."  
       - **Reframe**: "Your objection isn’t wriggling—it’s the start of the answer: We use *additional evidence* (code, causality) to narrow the infinite rules. But without that, we’re stuck with circular justifications."  
     - **Objection 2**: "This is a word game!"  
       - **Response**: "The log was finite, but the stakes were real (points). ‘Which rule to trust?’ mirrors real decisions: Should we refactor ‘working’ code? Is a statistical trend reliable?"  
     - **Objection 3**: "The log was finite!"  
       - **Response**: "Exactly! Finite evidence → infinite fitting rules. We *need* priors (simplicity, entrenchment) to choose."  

  4. **The Rewrite Refusal (1:15–1:18)**:  
     - **Why almost no one rewrote**:  
       - Dogmatism: "My rule felt obvious."  
       - Simplicity prior: "Time-free is cleaner."  
       - Circularity: "My warm-up worked, so why doubt?"  
     - **Key insight**: "Your confidence tracked your *history* (warm-up), not the log. That’s entrenchment in action."  

  5. **Acknowledge Limitations (1:18–1:20)**:  
     - **What the exercise can’t deliver**:  
       1. **The trickster problem**: Yes, I set the trap. But in reality, the universe isn’t malicious—yet underdetermination *still* exists (e.g., quantum mechanics vs. hidden variables).  
       2. **Endless rules**: We only saw 3–4 variants. To hint at infinity: "Imagine rules branching on prime-numbered timestamps, or vowel counts in inputs."  
     - **Closing**: "This isn’t about defeat. It’s about humility: Our ‘safe’ projections rely on assumptions. The fix isn’t certainty—it’s diverse evidence and questioning priors."  

  ---

  ### **Logistics & Checks**  
  - **Prevent Group Leakage**:  
    - Use breakout rooms (if virtual) or separate areas (in-person).  
    - Warm-up tasks run concurrently; use codenames to avoid signaling.  
  - **Scoring & Stakes**:  
    - Trivial prize: "Induction Champion" mug/sticker. Leaderboard adds fun.  
  - **Pseudo-Code Enforcement**:  
    - Google Form validates syntax (e.g., dropdowns for operators). Example:  
      ```python
      if [property] [operator] [value]: 
          return [number] 
      else: 
          return [number]
      ```  
  - **Datasets**:  
    - Generate via Python script (shared for transparency). Inputs are randomized; outputs follow ground-truth rules.  
  - **Time Buffer**:  
    - Built-in 5-minute flex (e.g., rule submission may take longer).  

  ---

  ### **Why This Works**  
  - **Trap Achieved**: Participants write time-free rules; the timestamp branch reveals divergence.  
  - **Entrenchment Felt**: Group A clings to time-free rules; Group B explores time-indexed. Post-reveal, both see their bias.  
  - **Objections Converted**: The "we have source code!" objection becomes a teachable moment about evidence hierarchies.  
  - **Limitations Managed**: The debrief explicitly addresses the "trickster" critique and rule infinity.  

  **Final Tip**: Run a dry test with 1–2 colleagues to refine datasets/timing. The reveal hits hardest when participants *see* their rules fail.
