       - For the predictions: 1 point per correct prediction in the next week (7 days, so 7 points max? but actually, we might have multiple logs per day; let's say 100 logs in the week, so 100 points max? but we can scale arbitrarily. We'll have a fixed set of test cases, say 100 rows for the week).
