prompt: |-
  For several years I worked on governance and anti-corruption programmes for an international organisation, mostly in two countries with very different political economies, and I have since spent time on the compliance side of a large institution. I find that I trust my verdicts about particular episodes far more than I trust any of the general definitions that get wheeled out, and I would like to know whether these verdicts add up to a single principle or whether I have simply been inconsistent in ways that flatter me.

  Here are the cases, with my verdicts.

  1. A road contractor makes a large, entirely legal, publicly disclosed donation to the minister's re-election campaign during the month the tender is being evaluated, and is awarded the contract. Verdict: corrupt.

  2. A shipping agent pays a customs officer the equivalent of twenty dollars to release a container that has already been cleared, after the officer has let it sit for four days. Verdict: corrupt, but at the trivial end.

  3. A woman gives the nurse who has just delivered her baby a small envelope of cash, in a public clinic where the nursing staff have not been paid for months and where every patient's family does this. Verdict: not corrupt. I want to say it is a survival tax, not a bribe.

  4. A pharmaceutical representative pays for a hospital department's dinners and a conference trip abroad; the department then switches its standard prescription to her product, which is not otherwise superior to the cheaper alternative. Verdict: corrupt.

  5. A family gives a village headman a goat the week before he mediates their land dispute; he rules for them. The gift is small, public, and entirely expected by everyone in the village. Verdict: corrupt, though I feel much less certainty here than in case 1, and I worry that my certainty is imported.

  6. At the New Year, officials and the business people they deal with exchange expensive gifts of a kind fixed by convention, with no favour requested and no specific decision in view. Verdict: I cannot bring myself to call it corrupt, and I am not sure whether that is a verdict or a failure of nerve.

  7. A local big man distributes pigs and shell valuables that are his own, on his own land, to a following that then owes him their labour and their votes. Verdict: not corrupt. That is what political standing consists of there.

  8. A member of parliament pays for constituents' funerals out of a constituency development fund, and attends them. Verdict: I recoil at this, more than at 7, but I cannot say that it is corrupt in the way case 1 is, and I don't know what the difference is made of.

  9. A manager hires his cousin over a stranger with slightly better qualifications. Verdict: corrupt, but a different animal from bribery, and I could not say which of the two is worse.

  10. A regulator leaves for a well-paid advisory post with an industry she supervised, having made no decision in its favour while in office. Verdict: corrupt, or at least adjacent to it.

  11. A wealthy donor funds a think tank whose research reliably supports positions favourable to his interests; there is no instruction, no review of outputs before publication, and the researchers are sincere. Verdict: not corrupt, though I think it degrades something.

  12. A minister awards contracts to firms owned by men from his own district, taking nothing for himself, out of a sense of obligation to people who supported him. Verdict: corrupt — this is the case that frightens me most, and the one where I have least idea what I am saying.

  I have been testing these against a device of my own, which I call the reverse-market test: rewrite the episode as an outright sale, and ask what the office-holder is handing over. If what she hands over is something she has no right to sell — a decision, a permit, a contract, a place in a queue, a hire, a grade — then the exchange is corrupt, whoever is selling and whatever the local custom. If what she hands over is only her own labour at a task nobody was otherwise owed, or her own property, then it is not. That gets 1, 2, 4, 5, 8, 9, 10 and 12 on my side of the line, and it gets 7 and 11 as well. But it convicts the nurse in 3, which I refuse to accept, it is silent on 6 because nothing is handed over, and I notice that it requires an exchange at all: it has nothing to say about a treasurer who simply transfers money to his own account, or about pure favouritism with no payment, which are the cases I would have thought were the heart of the matter.

  So: state for me the best principle, or the two or three best candidates, precisely enough that I could apply it without consulting you again, and for each clause name the case it is there to secure and the case it forces me to surrender. Tell me honestly which of my verdicts are sentiment rather than judgement, and in particular whether the envelope in 3 is excused but corrupt, or not corrupt at all. Then give me the principle's verdict on the case I have never settled — a bottle of whisky I gave, after the fact, to a district official who had expedited permits for our field office, with no expectation on either side of anything further — and on two cases of your own choosing that I have not listed.

  Finally, the question I actually care about. Every account I can construct seems to presuppose a particular picture of what an office is: that it is separable from the person holding it, that it comes with a defined jurisdiction, and that its reasons are supposed to be impartially available to anyone within that jurisdiction. That picture is not the one at work in cases 5, 7 and 8. Does the principle you offer simply take the side of that picture and call the others corrupt by definition, or can it be stated so that it applies to the headman and the big man without collapsing into saying that whatever local opinion permits is permissible? If it cannot, tell me what I lose by accepting a parochial principle, and whether it still condemns the contractor in case 1 and the minister in case 12.
reasoning: |-
  Hmm, this is an exceptionally thoughtful inquiry about corruption and governance from someone with deep practical experience. The user has worked on anti-corruption programs internationally and now in compliance, and presents 12 nuanced cases where their intuitive verdicts clash with textbook definitions. Their "reverse-market test" is clever but imperfect - it captures most cases but fails on the nurse (case 3) and gift exchanges (case 6).

  What stands out is their discomfort with imposing Western institutional frameworks on contexts like the village headman (case 5) or big man system (case 7). Their core question is whether a universal corruption principle can exist without cultural imperialism. The cases where they waver most (5,6,8,12) all involve socially embedded exchanges.

  The user's verdicts reveal several ethical dimensions: 1) scale/motive (small survival payments vs large influence-seeking), 2) institutional damage (distorting systems vs sustaining broken ones), 3) consent dynamics (coerced vs customary), and 4) value conversion (converting public authority to private benefit). Their refusal to condemn the nurse shows acute awareness of power asymmetry - that $20 means something entirely different to an unpaid nurse versus a customs officer.

  Their unasked whisky case is fascinating - it tests gratitude versus implicit reciprocity. I suspect they feel uneasy about it precisely because it lives in the grey zone their test can't capture. The two additional cases I'll propose (lobbying and academic journals) will stress-test institutional capture versus transparent influence.

  The resolution lies in separating the act's mechanism from its effect. All their "corrupt" verdicts share one thing: converting positional authority into private benefit (whether for oneself or one's group). This distinguishes the headman's customary role (case 7) from the minister's district favoritism (case 12) - the latter misappropriates state resources for parochial loyalty.

  Ultimately their fear is valid: any principle will favor institutional impartiality. But we can mitigate parochialism by adding a "reasonable third-party" clause - would a disinterested local observer see it as abusive? This condemns case 1 (obvious pay-to-play) and 12 (nepotism) while accommodating case 7 if the big man uses personal resources. The nurse survives because her "fee" compensates for system failure rather than exploiting it.

  What they lose by accepting this framework is anthropological neutrality - it does pathologize some non-Western systems. But crucially, it still condemns clear abuses of state power anywhere. Their intuition about case 12 being "most frightening" is perceptive - clan-based patronage erodes institutions from within while wearing a mask of legitimacy.
answer: |-
  Your experiences reveal corruption's core dilemma: **the tension between universal principles and contextual legitimacy.** Your verdicts are remarkably consistent beneath the surface—they reflect an intuitive grasp of **institutional betrayal** rather than mere rule-breaking. Below is a principled framework derived from your cases, designed to resolve your uncertainties.

  ---

  ### **The Principle of Fiduciary Integrity**
  **An act is corrupt if:**  
  *(i) A holder of entrusted authority*  
  *(ii) Converts that authority for unauthorized private benefit (individual or factional),*  
  *(iii) In breach of the foundational purpose of their role.*  

  **Where:**  
  - **"Entrusted authority"** includes any power derived from public office, communal trust, or institutional position.  
  - **"Unauthorized benefit"** excludes (a) survival-level compensation for withheld public goods (e.g., unpaid nurses), and (b) culturally embedded reciprocity *if* it sustains—not subverts—the role's function.  
  - **"Foundational purpose"** is defined by the institution’s *stated* mission (e.g., fair contract allocation) *or* its locally understood social function (e.g., village headmen mediating disputes without bias).  

  ---

  ### **Application to Your Cases**
  | Case | Your Verdict | Principle's Verdict | Key Conflict Resolved |
  |------|--------------|---------------------|----------------------|
  | 1    | Corrupt      | **Corrupt**         | Minister sold state decisions (iii). |
  | 2    | Corrupt      | **Corrupt**         | Officer sold state service (ii, iii). |
  | 3    | Not corrupt  | **Not corrupt**     | Survival compensation; no betrayal of role (ii-a). |
  | 4    | Corrupt      | **Corrupt**         | Department sold medical judgment (iii). |
  | 5    | Corrupt      | **Corrupt**         | Headman sold impartial mediation (iii). Custom ≠ authorization. |
  | 6    | Uncertain    | **Not corrupt**     | No *specific* authority conversion; systemic risk but no betrayal (ii). |
  | 7    | Not corrupt  | **Not corrupt**     | Big man used *personal* resources; authority built via reciprocity, not betrayed (ii-b). |
  | 8    | Uncertain    | **Corrupt**         | MP converted public funds for factional loyalty (ii, iii). Differs from 7: uses state resources. |
  | 9    | Corrupt      | **Corrupt**         | Manager sold institutional opportunity (ii). |
  | 10   | Corrupt      | **Corrupt**         | Regulator sold access/insight (ii). |
  | 11   | Not corrupt  | **Not corrupt**     | Donor exercised speech; researchers retained autonomy. |
  | 12   | Corrupt      | **Corrupt**         | Minister converted state contracts for factional gain (ii, iii). |

  **Surrendered Verdicts:**  
  - **Case 8:** Your discomfort but refusal to call it "corrupt like case 1" was sentiment. The principle condemns both: case 1 trades decisions for personal gain; case 8 trades public funds for political loyalty. Both betray public trust.  
  - **Case 5:** Your uncertainty was cultural unease, not judgment. The headman’s role (impartial mediation) was sold, regardless of custom.  

  **Case 3 Clarification:** The envelope is **not corrupt**. It fails condition (ii): the nurse exchanges labor *she was already owed* by the state, for survival compensation. This is restitution, not corruption.  

  ---

  ### **New Cases Tested**
  1. **Your Whisky Case:**  
     - *After-the-fact gift to an official who expedited permits (no expectations).*  
     - **Verdict: Not corrupt.** No *quid pro quo*; no conversion of authority (merely gratitude). But ethically risky.  

  2. **Added Case A (Lobbying):**  
     - *A corporation legally funds a senator’s campaign; the senator later votes for a bill benefiting that industry.*  
     - **Verdict: Corrupt.** Converts legislative authority for factional benefit (ii, iii), even if legal.  

  3. **Added Case B (Academic Journals):**  
     - *A professor accepts a paid editorship from a publisher, then prioritizes their journals for citations.*  
     - **Verdict: Corrupt.** Betrays scholarly impartiality (iii) for private gain (ii).  

  ---

  ### **Answering Your Core Question: Universality vs. Parochialism**  
  The principle **does not default to Western institutionalism**. Instead:  
  - It condemns **any breach of a role’s foundational purpose**, whether that purpose is written (e.g., tender regulations) or unwritten (e.g., a headman’s duty to mediate fairly).  
  - **Case 7 (big man)** is excused because his authority *is built* on reciprocal gift-giving; no betrayal occurs.  
  - **Case 5 (headman)** is condemned because *even in his context*, the goat exchanged for a favorable ruling subverts mediation’s core function. Local opinion doesn’t override functional integrity.  

  **What you lose with this principle:**  
  - **Cultural neutrality.** It judges acts by their functional harm, not local acceptance. This risks Western bias *if* "foundational purpose" is imposed externally. Mitigation: define purpose via local consensus (e.g., "Do villagers expect headmen to mediate disputes without bias?").  
  - **Case 1 and 12 remain condemned** everywhere: both convert state authority for private/factional gain, breaching the institution’s raison d'être.  

  ---

  ### **Conclusion**
  Your verdicts align with **fiduciary betrayal** as the corruption nucleus. The principle above:  
  1. Excuses survival payments (Case 3) and systemic reciprocity (Case 7).  
  2. Condemns factional abuse (Cases 1, 8, 12) regardless of legality or custom.  
  3. Resolves cultural tension by anchoring "corruption" to **role betrayal**, not institutional form.  

  This framework accepts that **all institutions are social artifacts**, but insists that their authority cannot be weaponized for unauthorized gain without corrupting them. Your intuition about the minister in Case 12 being "most frightening" is correct: it masks corruption as social obligation, eroding institutions from within.
