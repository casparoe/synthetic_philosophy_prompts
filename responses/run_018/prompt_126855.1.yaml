  I need to structure this as a university administrative manual with numbered articles, subsections, and an appendix. The challenge is balancing the two problems: prohibiting harmful unilateral actions while preventing harmful universal inaction. The satire lies in the escalating bureaucracy—each oversight layer creating its own curse, leading to infinite regress. Ending with an unresolved clause deferring to a non-existent committee will highlight the logical knot.

  For the reverse blessing, I'll include a clause (maybe 4.2) mandating participation in beneficial actions, but this creates enforcement dilemmas. The central committee's formation should trigger a second-order curse, requiring meta-committees. The appendix can list trivial examples like sandwich choices to emphasize the overextension.

  Polished British English is crucial—phrases like "hereby established," "notwithstanding," and "quorate" will sell the bureaucratic tone. Avoiding any winks or commentary means every absurdity must stem from faithful theoretical application. A reader versed in collective action theory should nod in recognition.

  I'll start drafting with the charter's preamble, mirroring real university policies, then spiral into recursive committees. The flatmate's heating example can inspire Article 4, while the reverse blessing gets twisted into mandatory voting on room bookings. The infinite regress will culminate in Appendix B's deferred authority, leaving the charter comically paralyzed by its own logic.
answer: |-
  ## CHARTER OF NON-UNILATERAL CONDUCT

  **ENACTED BY:** The Joint Committee on Non-Unilateral Conduct (JCNUC)  
  **DATE OF EFFECT:** Upon Ratification (Pending Ratification)  
  **VERSION:** 1.0 (Provisional)

  **PREAMBLE:**

  Recognising the profound risks inherent in individual agency within complex systems;  
  Acknowledging the Unilateralist’s Curse (UC) wherein independent actions, locally optimised, may converge upon globally suboptimal or catastrophic outcomes;  
  Further acknowledging the Reverse Unilateralist’s Blessing (RUB) wherein universal abstention from individually beneficial or neutral acts may equally precipitate systemic failure;  
  Desiring to mitigate both UC and RUB across all operations and decisions pertaining to the student body;  
  The Joint Committee on Non-Unilateral Conduct (JCNUC) is hereby established and bound by the following Charter.

  **ARTICLE 1: ESTABLISHMENT AND SCOPE**

  1.1 The Joint Committee on Non-Unilateral Conduct (JCNUC) is constituted as the central authority for the review, approval, or veto of any student-initiated action possessing potential for non-trivial collective consequence.
  1.2 **Scope of Application:** This Charter governs *all* decisions and actions undertaken by registered students where:
      *   1.2.1 The action possesses the potential to impose costs, externalities, or resource depletion affecting other students or university systems (UC Risk); or
      *   1.2.2 The *failure* of all actors to undertake a similar action possesses the potential to impose costs, externalities, or systemic failure affecting other students or university systems (RUB Risk).
  1.3 Examples within scope include, but are not limited to: booking seminar rooms, selecting society catering options, adjusting environmental controls (heating, lighting), utilising shared printing facilities, choosing sandwich fillings for group orders, initiating collaborative projects, and voting in student elections.

  **ARTICLE 2: PROHIBITION OF UNILATERAL ACTION**

  2.1 No student shall undertake any action falling within the Scope of Application (Article 1.2) without prior written authorisation from the JCNUC Secretariat.
  2.2 **UC Assessment:** Authorisation shall only be granted if the JCNUC Secretariat determines, by majority vote, that:
      *   2.2.1 The proposed action, if replicated by all similarly situated actors, would *not* lead to a collectively worse outcome than universal restraint; and
      *   2.2.2 The proposed action does not exploit a temporary asymmetry likely to incentivise harmful cascade effects.

  **ARTICLE 3: OBLIGATION TO ACT (MITIGATION OF RUB)**

  3.1 Recognising the RUB, universal inaction is deemed a potential collective failure state.
  3.2 Where the JCNUC Secretariat identifies a class of actions exhibiting RUB characteristics (i.e., universal abstention is harmful), it may issue a **Mandate for Necessary Action (MNA)**.
  3.3 An MNA shall specify:
      *   3.3.1 The precise action required (e.g., "Vote in the Room Booking Preference Survey");
      *   3.3.2 The subset of students obligated to act;
      *   3.3.3 The timeframe for compliance.
  3.4 Compliance with an active MNA is mandatory for all obligated students. Failure to comply constitutes a breach of this Charter.

  **ARTICLE 4: THE JCNUC SECRETARIAT**

  4.1 The JCNUC Secretariat comprises seven (7) elected student representatives serving staggered two-term mandates.
  4.2 **Decision Protocol:** All Secretariat decisions (authorisations, vetoes, MNAs) require a quorum of five (5) members and a simple majority vote.
  4.3 **Recusal:** Members must recuse themselves from decisions directly pertaining to actions they have proposed or MNAs that directly obligate them.

  **ARTICLE 5: RISK OF SECRETARIAT UNILATERALISM AND SECOND-ORDER OVERSIGHT**

  5.1 **The Second-Order UC/RUB:** It is recognised that the JCNUC Secretariat itself constitutes a group of agents capable of unilateral (or universally abstentionist) decisions with globally significant consequences for the student body.
  5.2 To mitigate the risk of Secretariat-level UC (e.g., vetoing all actions leading to paralysis) or RUB (e.g., failing to issue critical MNAs), the Committee for Secretariat Oversight (CSO) is hereby established.
  5.3 The CSO shall comprise five (5) members: two appointed by the University Secretary, two appointed by the Student Union President, and one randomly selected final-year student not serving on any committee.
  5.4 **CSO Mandate:** The CSO possesses the authority to:
      *   5.4.1 Review any Secretariat decision (authorisation, veto, MNA) upon petition by ten (10) students;
      *   5.4.2 Veto Secretariat decisions deemed to constitute an instance of UC (e.g., reckless approval) or RUB (e.g., neglectful inaction) at the Secretariat level;
      *   5.4.3 Issue directives to the Secretariat mandating the review of specific classes of action or the issuance of specific MNAs.

  **ARTICLE 6: RISK OF CSO UNILATERALISM AND TERTIARY OVERSIGHT**

  6.1 **The Third-Order UC/RUB:** It is further recognised that the CSO constitutes a group of agents capable of unilateral (or universally abstentionist) oversight decisions with globally significant consequences, potentially enabling or disabling the Secretariat’s function.
  6.2 To mitigate the risk of CSO-level UC (e.g., excessive vetoes crippling the Secretariat) or RUB (e.g., failure to review egregious Secretariat errors), the Panel for Oversight Integrity and Review (POIR) is hereby established.
  6.3 The POIR shall comprise three (3) members: the University Ombudsman, the Chair of the Ethics Review Board (non-student), and one emeritus professor of Decision Theory drawn by lot.
  6.4 **POIR Mandate:** The POIR possesses the authority to:
      *   6.4.1 Review any CSO veto or directive upon petition by the Secretariat or fifteen (15) students;
      *   6.4.2 Overturn CSO decisions deemed to constitute UC or RUB at the CSO level;
      *   6.4.3 Issue binding interpretations of this Charter concerning the application of UC/RUB principles at oversight levels.

  **ARTICLE 7: HIGHER-ORDER REGRESS AND DEFERRAL**

  7.1 Acknowledging the recursive nature of UC/RUB mitigation, wherein any oversight body (O_n) itself requires oversight (O_n+1) to prevent UC/RUB at level *n*, the following provisions are enacted:
      *   7.1.1 The mandate and structure for the Panel for Oversight Integrity and Review (POIR, O_3) is defined herein.
      *   7.1.2 The potential requirement for a Quadrary Oversight Body (O_4) to oversee the POIR is formally noted.
      *   7.1.3 Authority to constitute O_4, and any subsequent oversight bodies (O_n where n>3), along with their respective charters, is hereby deferred.
  7.2 All unresolved questions of oversight body formation, mandate, or potential UC/RUB at level O_n (where n>3), and all final interpretative authority regarding this recursive regress, are deferred to the **Committee for Ultimate Recursive Oversight (CURO)**.

  **APPENDIX A: EXEMPLARS OF SCOPE (NON-EXHAUSTIVE)**

  *   **A.1 Booking Seminar Room 4B:** Requires JCNUC authorisation (UC Risk: overbooking chaos if all book independently; RUB Risk: no events occur if all assume others will book).
  *   **A.2 Ordering Vegan Sandwiches (Group Order):** Requires JCNUC authorisation (UC Risk: insufficient variety if all choose niche options; RUB Risk: no vegan option procured if all abstain from requesting it).
  *   **A.3 Adjusting Thermostat in Common Room (+1°C):** Requires JCNUC authorisation (UC Risk: boiler overload/system failure if all adjust simultaneously; RUB Risk: hypothermia risk if all abstain from adjustment during a cold snap, believing others might act).
  *   **A.4 Printing >50 Pages:** Requires JCNUC authorisation (UC Risk: paper/toner exhaustion if all print large jobs; RUB Risk: critical materials unprinted if all abstain due to perceived scarcity).

  **APPENDIX B: COMMITTEE FOR ULTIMATE RECURSIVE OVERSIGHT (CURO)**

  *   **B.1 Status:** CURO is recognised as the final authority on all matters pertaining to oversight regress and Charter interpretation beyond level O_3.
  *   **B.2 Composition:** To be determined by a process designed to minimise UC/RUB risks in its own formation, as specified in a future Charter (not yet drafted).
  *   **B.3 Authority:** Pending its constitution and the ratification of its governing Charter, CURO possesses latent but currently inoperable authority. All matters deferred to CURO under Article 7.2 shall remain in abeyance until such time as CURO is fully constituted and operational.
  *   **B.4 Interim Measures:** In the absence of CURO, decisions requiring ultimate recursive oversight shall be postponed indefinitely, or referred back to the POIR for "provisional non-binding guidance," which shall not constitute a precedent or binding resolution.

  **SIGNED (IN PERPETUAL DRAFT):**

  *[Space Reserved for Signatures of Inaugural JCNUC Secretariat (Pending their Confirmation by the CSO, pending CSO confirmation by the POIR, pending POIR guidance on inaugural procedures)]*
