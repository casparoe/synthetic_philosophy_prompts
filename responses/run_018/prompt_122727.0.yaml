answer: |-
  Here's a principle designed to capture nearly all your verdicts, building on prioritarianism but addressing its shortcomings in your cases:

  **The Principle:** *Distributive value is the sum of a strictly increasing, strictly concave transform φ of each person’s lifetime welfare, but only if the outcome is Pareto efficient relative to alternatives considered. When identities are uncertain, evaluate by applying φ to each individual's ex ante expected welfare.*

  1.  **Justification & Motivation:**
      *   **Strictly Increasing, Strictly Concave φ:** This captures priority to the worse-off, explaining your preference in Cases 1 and 2 (transfer from better-off to worse-off increases value, even at net loss in Case 2). It also explains preferring 100 alone over 100+40 (adding Bo at 40 lowers the sum-of-φ).
      *   **Pareto Efficiency Constraint:** This is crucial for Case 4. A move from (1000, 10) to (990, 9) makes Bo worse off without making Ana better off – it's Pareto *inferior*. The principle *rules this out* as having any positive distributive value, eliminating the "pull" you feel. The concavity of φ explains the unease in Case 2 (net loss) but doesn't endorse leveling-down.
      *   **Ex Ante φ under Uncertainty:** This resolves Case 5. Applying φ to the *expected welfare* of each *individual* under the gamble: Ana/Bo each have ex ante welfare of 50 under the coin flip. Under (50,50) for sure, they also each have 50. φ(50) + φ(50) is identical either way. You prefer the sure thing because it lacks risk, but the principle judges the *distributive value* as equal. Your preference for (49,49) suggests an *additional* risk aversion not captured purely by distributive concerns. The principle forces you to accept equality here.
      *   **Person-Centric Scope:** The sum is over *persons*, not temporal parts. This explains Case 6. For one person, we only care about the *total* welfare (sum of parts), not the distribution across time. Smoothing within a life adds no value. For two people, the concavity of φ applied to each *whole person's total* welfare gives priority to the worse-off individual.

  2.  **Verdicts Captured & Forced Changes:**
      *   **Captured:** Case 1 (transfer), Case 2 (transfer despite net loss), Case 4 (Pareto rules out leveling-down pull), Case 6 (no intra-personal priority).
      *   **Nearly Captured:**
          *   **Case 5:** The principle judges the coin flip and (50,50) as *distributively equal*. Your preference for (50,50) and (49,49) suggests an aversion to *ex post inequality* or risk *beyond* what φ applied to ex ante expectation captures. The principle forces you to accept distributively equal outcomes under uncertainty when ex ante individual prospects are equal. You must give up the verdict that (50,50) is distributively *better* than the fair coin flip; they are equal. Your preference for (49,49) over the gamble requires an additional principle (e.g., risk aversion).
      *   **Problem Case:**
          *   **Case 3:** This remains the hardest. The Pareto constraint doesn't apply (moving to the second alternative makes Dev better off without making others worse off? Actually, moving *from* (100,100,100,40) *to* (95,95,95,55) makes Ada, Ben, and Cleo *worse off* (loss of 5 each) and Dev better off (gain of 15). It's a trade, not leveling-down.
          *   *The Issue:* A moderately concave φ might still prefer the more equal distribution (95,95,95,55) because Dev gains so much more than each of the others loses. Your intuition strongly rejects this. A φ concave enough to match your intuition in Case 3 would likely be *too* concave for Cases 1 and 2 (e.g., making Case 2 look clearly bad). The principle *as stated* might prefer (95,95,95,55) unless φ is very steeply concave for low welfare levels.
          *   *Resolution Options:* (a) Accept that your intuition in Case 3 requires steeper concavity at the bottom than implied by Cases 1/2. (b) Introduce a threshold concept where losses above a certain welfare level (where Ada/Ben/Cleo are) are weighted less heavily than gains below it (where Dev is). (c) Accept that Case 3 is a limitation; your intuition might be influenced by the *number* of losers (3 vs 1 gainer) beyond pure concavity. The principle doesn't naturally capture this and forces a potential revision or acceptance of a slight mismatch.

  3.  **Prediction for Additional Case (Ana 100 alone vs Ana 100 + Bo at 40):**
      *   The principle clearly prefers **Ana 100 alone**. Why?
          *   Option A: Ana 100 → Value = φ(100)
          *   Option B: Ana 100 + Bo 40 → Value = φ(100) + φ(40)
      *   Because φ is strictly increasing, φ(100) > φ(40). Therefore: φ(100) > φ(100) + φ(40) is false. However, because φ(40) is *positive but less than φ(100)*, adding φ(40) *increases* the sum compared to just φ(100). φ(100) + φ(40) > φ(100).
      *   Therefore, the principle judges **Ana 100 + Bo at 40 as distributively better** than Ana 100 alone. Adding a person with positive welfare (even if worse off) increases the sum-of-φ.
      *   *This directly contradicts your prioritarian working model which preferred Ana alone.* If you intuitively prefer Ana alone here, it suggests a significant departure from standard additive prioritarianism, perhaps a strong aversion to creating worse-off individuals (a "person-affecting" restriction or negative weight on new lives below a sufficiency threshold). The principle as stated cannot capture this and forces the verdict that adding Bo at 40 is an improvement.
