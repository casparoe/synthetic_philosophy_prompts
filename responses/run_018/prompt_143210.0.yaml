answer: |-
  ### Translated Debate: Control-Theoretic Demandingness Objection

  **Core System Model:**  
  - **Agent = Local Controller**  
  - **Global Welfare = System-Wide Objective Function**  
  - **Morality = Control Law**  
  - **Personal Projects/Well-being = Local Set Point**  
  - **Moral Demands = Actuator Commands**  
  - **Agent Capacity = Actuator Saturation Limit**  

  ---

  #### **1. Demandingness Objection (Translated)**  
  The consequentialist control law requires all local controllers to continuously output actuator commands that **maximize the global objective function** (aggregate welfare). This forces:  
  - **Persistent Set Point Violation**: Local well-being set points are chronically overridden by global error signals (e.g., distant suffering).  
  - **Actuator Saturation**: Moral commands exceed physical/psychological saturation limits (e.g., donating kidneys, working 20 hrs/day for charity).  
  - **Stability Margin Erosion**: Near-zero stability margin between command signals and saturation limits → burnout/failure (e.g., depression, bankruptcy).  
  - **Bandwidth Starvation**: 100% bandwidth allocation to global optimization crowds out local control loops (relationships, hobbies, rest).  
  - **Instability Risk**: Rigid global optimization destabilizes local systems when noise/disturbances occur (e.g., illness, family crisis).  

  **Objection Summary:** *The control law demands impossible set point tracking — commanding actuators into chronic saturation to serve a global objective, ignoring local stability constraints.*  

  ---

  #### **2. Consequentialist Replies (Translated)**  
  **A. Costs of Morality (System Stability Argument)**  
  - Moral commands are **load-shedding decisions**: Sacrificing local set points is necessary to prevent *cascading failures* in the global system (e.g., famine, pandemics).  
  - **Stability requires saturation tolerance**: Global stability margins depend on local controllers operating near saturation during critical events (e.g., disasters).  
  - *Counter-objection:* "Graceful degradation" (partial duty compliance) is unstable — half-measures delay system convergence.  

  **B. Scalar Obligations (Continuous Control Space)**  
  - "Obligation" is not binary (saturated/unsaturated) but **scalar**: Moral value ≈ **error magnitude reduction**.  
  - All actuator effort contributes to global error correction; no discrete threshold separates "required" from "optional."  
  - *Counter-objection:* Scalar commands obscure saturation points → controllers interpret *any* unused capacity as "error."  

  **C. Division of Moral Labor (Distributed Optimization)**  
  - Global optimization uses **heterogeneous control policies**:  
    - **Specialized controllers**: High-gain actuators (e.g., doctors, philanthropists) handle critical error reduction.  
    - **Low-priority controllers**: Default to maintaining local set points (e.g., artists, caregivers).  
  - **Dynamic bandwidth allocation**: Agents reallocate effort during crises (load spikes) but resume local loops during quiescence.  

  ---

  ### Residue Report  
  **1. Clean Mappings:**  
  - **Actuator Saturation** → Demands exceeding capacity (e.g., donating organs).  
  - **Set Point Violation** → Personal well-being compromised by moral duties.  
  - **Load Shedding** → Strategic non-compliance to preserve local function.  
  - **Stability Margins** → Buffer between moral demands and breakdown.  
  - **Graceful Degradation** → Partial fulfillment of duties under stress.  

  **2. Distortions Required:**  
  - **Supererogatory Acts**: "Optional" high-effort moral actions (e.g., heroic sacrifices) map poorly. *Distortion:* Treated as "excess actuator reserve" — but control theory lacks *normative* distinctions between "baseline duty" and "optional effort."  
  - **Failure of Will vs. Capacity**: "Can't" (saturation) vs. "won't" (set point defense) blurred. *Distortion:* Both manifest as command tracking errors, obscuring culpability.  
  - **Scalar Obligations**: Consequentialism’s "no bright line" mapped to continuous control space. *Distortion:* Engineering systems *do* define operational limits (hard constraints), unlike scalar morality’s unbounded demands.  

  **3. No Expression in Vocabulary:**  
  - **Normative "Ought"**: Control laws *describe* system behavior; they lack prescriptive force (e.g., why *should* local controllers obey global objectives?).  
  - **Intentionality**: "Moral negligence" vs. "saturation failure" indistinguishable in error signals.  
  - **Deontic Thresholds**: No equivalent to "permissible/impermissible" — only controller stability and set point tracking.  

  ---

  ### Conceptual Analysis: Does the Vocabulary Expose Ambiguities?  
  The residue reveals that **"too demanding" has three distinct control-theoretic meanings**, obscured by the slogan:  
  1. **Capacity Violation**: Commands > Saturation Limit (physical impossibility).  
  2. **Stability Violation**: Commands erode stability margins (risk of local collapse).  
  3. **Set Point Violation**: Commands override local objectives (well-being loss).  

  **These interpretations conflict:**  
  - A command may be *below* saturation limits (1) but cause set point violation (3) (e.g., working 60 hrs/week for charity instead of 80).  
  - Division of moral labor might permit set point violation (3) for specialized controllers to *prevent* global instability (2).  

  **Conclusion:**  
  - Control-theoretic language **lacks resources for normative distinctions** (duty vs. charity, capacity vs. will).  
  - However, it **exposes ambiguities in the objection**: The debate conflates *physical impossibility*, *systemic risk*, and *personal sacrifice*.  
  - Ultimately, the vocabulary **cannot resolve normative questions** (e.g., "Should set points be protected?"), but clarifies *tradeoffs*: Global optimization requires sacrificing local stability margins. Whether this is "unreasonable" depends on the system’s failure tolerances — a value judgment outside the model.  

  **Final Verdict:** The translation holds structurally but reveals that demandingness is not a *single* technical failure mode. It forces precision but cannot replace ethics.
