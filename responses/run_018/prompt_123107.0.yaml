prompt: |-
  I'm a retired marine biologist who spent thirty years staring at plankton, and now I'm reading philosphy in the evenings and running a small group at the local community centre where people bring in science claims they've seen online. I want a practical procedure I can run in about ten minutes to check whether someone holds a belief for the right kind of reasons, not just because it suits their politics or makes them feel safe, and I've been trying to make sense of the wrong-kind-of-reasons problem together with that hybrid zone where social positioning might actually track evidence but people can't separate the two. Could you turn this into a reusable checklist with ordered questions, clear stop points where the answer is "wrong reasons," hand-off points where judgement takes over, and worked examples? Please reply with exactly five numbered points, each one or two sentences long, with no introduction or conclusion. Point one should list the ordered questions about the belief's source and the believer's motivation. Point two should state where the procedure stops with a "no" and where it hands to judgement for hybrid cases. Point three should apply it to a case I'll approve of — say, someone doubting a diet study because they spotted a confounding variable. Point four should apply it to a case I won't like — my neighbour who understands the climate data but rejects it mainly because she thinks universities are corrupt. Point five should say what the procedure can't settle and where it will misfire. Keep it casual, use British spelling, and dont ask me for citations or references I can't check without the internet — there's a typo or two in this message on purpose.
reasoning: |-
  Hmm, the user is a retired marine biologist with decades of experience studying plankton. They're now reading philosophy and running a community science group where people bring questionable online claims. They want a practical 10-minute procedure to check if someone holds a belief for good reasons rather than political convenience or emotional comfort. 

  Key challenges they mentioned: the "wrong-kind-of-reasons" problem and that messy zone where social positioning accidentally aligns with evidence. They specifically want a 5-point checklist format: source/motivation questions (1), stop/handoff rules (2), positive example (3), negative example (4), limitations (5). British spelling, casual tone, no intros/conclusions.

  Noticing they deliberately included typos ("philosphy", "dont") - probably testing if I'll pedantically correct or focus on substance. Smart. Their neighbor example reveals concern about ideological capture overriding evidence comprehension.

  Breaking this down:

  For point 1 (source/motivation):
  - Need layered questions: start with sourcing (is it credible?), then probe motivation (does it serve identity/comfort?), finally check for independent verification attempts. Crucial to avoid binary thinking - hence "try to verify" rather than demand proof.

  Point 2 (stop/handoff):
  - Hard stops when motivation trumps evidence-seeking; hybrid zone when social/evidential reasons coexist. Must clarify that "mixed motives" require deeper discussion - can't resolve in 10 mins.

  Examples matter - they want contrast:
  - Positive case (diet study skepticism): Shows good-faith engagement with methodology. Key that they "spotted" the flaw themselves.
  - Negative case (climate denial): Explicit admission that comprehension exists but ideological rejection dominates. "Universities corrupt" is classic epistemic mistrust.

  Limitations section (point 5) must preempt overconfidence:
  - Can't judge factual accuracy, only reasoning quality. Will misfire when someone performs rationality theatrics without substance.

  Structure is tight but needs room to breathe - hence keeping sentences short but concepts dense. British spellings locked in ("prioritise", "rigour"). Casually avoiding jargon while packing philosophical nuance into plankton-friendly terms.
answer: |-
  1. Ask: "Where'd you first encounter this claim, and does that source have expertise or just strong opinions? Then, honestly, does believing this suit your existing views or make you feel better rather than just fitting the evidence?" Finally, "Did you *try* to verify it against trustworthy sources or just accept it?"

  2. Stop hard if they admit motive trumps evidence or cite only dubious sources. Hand off to deeper chat (outside the ten minutes) if motives are mixed *but* they genuinely tried to verify using credible methods - that's the murky hybrid zone needing proper discussion.

  3. Works for diet sceptic: Found study via science news site (good source), doubts suit their healthy eating views but *mainly* they spotted a confounder and checked other papers discussing the flaw (tried to verify). Judgement: likely right reasons.

  4. Fails for climate neighbour: She found data via journals (good source) and understands it, but rejects because "universities are corrupt" - her motivation (distrust of institutions) clearly overrides the evidence despite her comprehension. Stop: wrong reasons.

  5. Can't judge if the *belief itself* is actually true, only their reasons for holding it. Will misfire if someone fakes verification rigour or has valid motives but coincidentally lands on bunk science.
