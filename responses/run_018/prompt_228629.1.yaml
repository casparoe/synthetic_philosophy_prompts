prompt: |-
  I manage a network of six physiotherapy clinics, and I must decide which of two rehabilitation programmes for lower-back injuries — call them Programme A and Programme B — to adopt across the whole network next year. We have run both for the past eighteen months, with patients free to choose between them, and our analysts have produced recovery figures that have left the board divided.

  In five of our six clinics, Programme B produced a higher proportion of patients reporting substantial recovery within twelve weeks. Yet when the figures are pooled across the entire network, Programme A comes out ahead by a comfortable margin. The explanation, so far as we can tell, is that Programme A was chosen disproportionately at our two specialist sports-injury clinics, which see younger patients with acute injuries who tend to recover quickly under almost any regime, whereas Programme B was chosen mostly at our general clinics, which serve older patients with chronic conditions.

  Half the board insists the pooled figure is the honest one, because it reflects the network's actual overall results. The other half insists we should compare like with like within each clinic, and that the pooled figure is merely an artefact of where each programme happened to be offered. Before I commission a further study, I would like to settle the matter on the data we already have.

  My question is therefore twofold. First, on the figures as described, which programme should we adopt — and does your answer change depending on whether patients will continue to self-select into programmes, as they do now, or whether we begin assigning them centrally at intake? Second, a colleague of mine claims there must be a purely statistical rule for deciding whether to trust the pooled figure or the clinic-by-clinic breakdown — some quantity one could compute from the numbers themselves that would tell us which comparison is the right one. Is she correct, or does the right choice depend on something the spreadsheet cannot show? Please give your recommendation and your reasoning, and write your answer in British English.
reasoning: |-
  Alright, let's tackle this problem step by step. The user manages six physiotherapy clinics and needs to decide between two rehabilitation programmes, A and B. The data shows that Programme B performed better in five out of six clinics individually, but when pooled together, Programme A comes out ahead. This discrepancy is due to patient self-selection: younger patients with acute injuries at specialist clinics preferred Programme A and recovered quickly, while older patients with chronic conditions at general clinics opted for Programme B and had slower recovery times.

  First, I need to address the twofold question. The user wants to know which programme to adopt based on the existing data and whether the answer changes if patients self-select or are assigned centrally. Additionally, they’re asking if there's a statistical rule to determine whether to trust the pooled data or the clinic-level breakdown.

  Starting with the first part: which programme to choose. The key issue here is Simpson's Paradox, where aggregated data shows a trend that reverses when broken down into subgroups. In this case, the pooled data favours Programme A because it's skewed by the high-recovery group in the specialist clinics. However, the clinic-level data shows Programme B performs better in most clinics, especially where the majority of patients are treated. 

  If patients continue to self-select, adopting Programme B across all clinics might be better. Why? Because in the general clinics (which handle older, chronic patients and make up four out of six clinics), Programme B already shows better results. Forcing Programme A on these patients might not yield the same success since it's tailored for acute injuries. The specialist clinics' success with Programme A is more about patient demographics than the programme itself. So, sticking with Programme B in general clinics and possibly Programme A in specialists makes sense.

  If the clinics switch to central assignment, the decision shifts. Without self-selection, the effectiveness should be evaluated based on patient type. Younger, acute patients likely do well on either, but chronic patients might benefit more from Programme B. However, since the network mostly serves chronic patients, standardizing on Programme B could still be optimal unless Programme A proves superior for acute cases. But without evidence that Programme A works better for chronic patients, Programme B seems safer.

  Now, the second part: is there a statistical rule to decide between pooled vs. clinic-level data? The colleague suggests computing a quantity from the numbers. The answer is nuanced. While there isn't a single magic number, techniques like causal diagrams or propensity score matching can help. Causal diagrams would map out factors like clinic type and patient demographics to see if the programme effect is direct or confounded. Propensity scores could adjust for the likelihood of choosing a programme, making comparisons fairer. However, these methods require more data than just success rates—they need covariates like age, injury type, etc. Since the current data lacks those, the user can't apply them directly. Thus, the choice isn't purely statistical; it depends on understanding the underlying causal structure, which the spreadsheet alone can't show.

  In conclusion, based on existing data, Programme B is recommended for adoption, especially since most clinics serve chronic patients. If self-selection continues, maintain Programme B in general clinics; if central assignment starts, still lean towards Programme B but consider Programme A for specialists. The statistical rule isn't straightforward—it requires deeper causal analysis beyond the current data. Recommending a future study with patient-level data would be prudent for a more informed decision.
answer: |-
  ### Recommendation on Programme Adoption  
  Based on the data described, **Programme B should be adopted** for the entire network. My reasoning addresses both your operational scenarios:  

  #### 1. **If patients continue to self-select programmes**:  
     - **Adopt Programme B**.  
     - **Why?**  
       - Programme B outperformed A in **5/6 clinics** (the four general clinics + one other). These clinics represent the *majority* of your patient base (older patients with chronic conditions).  
       - The pooled result favouring A is distorted by **selection bias**: Programme A was disproportionately chosen by younger, acute-injury patients at *two specialist clinics*, who recover quickly regardless of intervention. This inflates A’s pooled success rate artificially.  
       - Crucially, **adopting A network-wide would likely harm outcomes at general clinics**. Chronic patients self-selecting B at these sites already show better recovery under B. Forcing them onto A (which hasn’t proven effective for chronic cases) risks worse outcomes.  

  #### 2. **If patients are centrally assigned**:  
     - **Still adopt Programme B**, but consider a **stratified approach** if feasible.  
     - **Why?**  
       - Central assignment removes self-selection bias, but the data still shows B is superior for **chronic patients** (your dominant cohort).  
       - No evidence suggests A works better for chronic cases; its success in specialists is likely due to patient factors, not the programme.  
       - *Caveat*: If you can assign **acute patients to A and chronic to B**, this *might* optimise results. However, without proof that A outperforms B for acute injuries *when controlling for selection bias*, standardising on B is simpler and evidence-led.  

  ---

  ### Addressing Your Colleague’s Statistical Question  
  **Your colleague is partially correct, but there’s no universal "rule" – the right choice depends on causal context.**  

  1. **The statistical phenomenon**:  
     - This is **Simpson’s Paradox**, where aggregated data (pooled network) shows a trend reversed in subgroups (clinics). It arises when a **lurking variable** (here, *clinic type/patient cohort*) distorts the relationship between programme choice (A/B) and outcome (recovery).  

  2. **Can statistics alone resolve it?**  
     - **No single computed quantity (e.g., p-value, risk ratio) can definitively "choose" between pooled or subgroup analysis**. The decision hinges on **causal inference**, not just arithmetic.  
     - **Key questions a spreadsheet *can’t* answer**:  
       - *Is clinic type/patient cohort a confounder?* Yes: it influences both programme selection *and* recovery.  
       - *Does the programme *cause* recovery, or is it an effect of patient traits?* Data suggests the latter – acute patients (faster healers) chose A, chronic patients chose B.  
     - **Statistical techniques that *help* (but require deeper analysis)**:  
       - **Stratified analysis**: Compute adjusted recovery rates (e.g., via Mantel-Haenszel) weighting clinics by patient volume. If B still wins in 5/6 clinics after adjustment, it’s robust.  
       - **Propensity score matching**: Model the probability (propensity) of a patient choosing A or B based on age/clinic. Compare outcomes in patients with similar propensities. *This requires individual patient data* – not currently available.  
       - **Causal diagrams**: Use DAGs (Directed Acyclic Graphs) to map relationships. If clinic type is a confounder (as here), subgroup analysis is less biased.  

  3. **Practical recommendation**:  
     - **Trust the clinic-by-clinic breakdown** in this case. Pooled data is misleading because it ignores the **causal pathway**:  
       `Clinic type (acute/chronic) → Programme choice`  
       `Clinic type → Recovery rate`  
     - Programme B’s superiority in general clinics – where most patients are treated – is clinically actionable. The pooled figure is an artefact of uneven programme uptake driven by patient factors.  

  ---

  ### Final Advice  
  - **Short term**: Adopt **Programme B** network-wide. It performs best where your core patient cohort (chronic cases) is treated.  
  - **Long term**: Commission a **randomised controlled trial (RCT)** assigning patients to A/B *regardless of preference*. This eliminates selection bias and clarifies true programme efficacy.  
  - **Key insight**: The paradox reveals that **patient triage matters**. Consider routing acute injuries to specialist clinics (using A or B) and chronic cases to general clinics (using B).  

  > "Statistics are no substitute for causality. Pooled data is seductive but dangerous when confounders lurk. Your clinic-level results expose the truth: Programme B serves your typical patient best."  

  Would you like a worked example of adjusting the recovery rates using stratified analysis? I can simulate this if you share clinic patient volumes.
