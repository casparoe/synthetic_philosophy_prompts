prompt: |-
  After a long argument with my friend about whether bounded rationality describes a real cognitive limit or merely an optimal response to information costs, I want us to stop talking past each other. Draft the joint statement of an adversarial collaboration between a procedural-rationalist camp, in the Simon tradition—treating aspiration levels, sequential search, and organizational decision processes as genuinely distinct mechanisms—and a constrained-optimization camp, in the neoclassical search-theory tradition—treating satisficing as endogenous reservation-value optimization under computation or sampling costs. The statement should open with a numbered section of claims both sides can sign, covering: the formal structure of choice sets and stopping rules; the empirical reality of cognitive and organizational limits; what Simon’s administrative studies actually demonstrated about aspiration adjustment; and the conditions under which agents terminate search without global comparison. Next, present a disagreements table with two columns—Procedural Rationalist and Constrained Optimizer—each stating its own view in wording it fully accepts and describing the opposing view in neutral terms neither side rejects. The cruxes must include: (a) whether an aspiration level functions as an internal representational threshold or merely as an implicit price constraint; (b) whether sequential search with a stopping rule is formally reducible to single-period optimization with an endogenously chosen reservation value; (c) whether ecological rationality—environment-structure matching that makes simple heuristics accurate—is a separate causal mechanism or only a redescription of efficient search given environmental statistics; and (d) whether the normative justification for satisficing in human cognition, if any, carries over to artificial agents with explicit utility functions and programmable search budgets. For each crux, specify a concrete model, empirical pattern, or decision case that both sides agree bears on the issue, and record in advance what each side predicts about that case. If any portion of the dispute turns out to be verbal—for example, over whether “optimization” requires global comparison or only local improvement—identify precisely which portion and explain why the wording rather than the substance diverges. Do not include bibliographies, citations, or reading lists; the document should be writable without access to external sources. Keep the tone formal, the formulations exact, and the residual disagreements sharp enough that either party could sign its own column without feeling misrepresented.
reasoning: |-
  We are drafting a joint statement for an adversarial collaboration between two camps: the Procedural Rationalist (PR) camp (in the Simon tradition) and the Constrained Optimizer (CO) camp (in the neoclassical search-theory tradition). The document has two main parts: (1) a numbered section of agreed claims, and (2) a disagreements table.

  First, the agreed claims section (numbered) must cover:
  1. The formal structure of choice sets and stopping rules.
  2. The empirical reality of cognitive and organizational limits.
  3. What Simon's administrative studies demonstrated about aspiration adjustment.
  4. The conditions under which agents terminate search without global comparison.

  Then, the disagreements table has two columns (PR and CO) and addresses four cruxes (a, b, c, d). For each crux:
  - Each side states its own view in wording it accepts and describes the opposing view neutrally.
  - We specify a concrete model, empirical pattern, or decision case that both sides agree bears on the issue.
  - We record in advance what each side predicts about that case.
  - We note if any portion is verbal and explain the wording divergence.

  The tone should be formal and exact. Residual disagreements must be sharp.

  Let's start with the agreed claims.

  **Agreed Claims**:

  1. **Formal Structure of Choice Sets and Stopping Rules**: Both sides agree that decision problems can be formally represented as a sequence of options encountered over time, and that a stopping rule (a criterion for terminating search) is a critical component of any sequential search process. The stopping rule may be based on an aspiration level (a threshold of acceptability) or a reservation value (a threshold that maximizes expected utility given costs). Both sides also agree that the set of alternatives may not be known in advance and that search may be costly.

  2. **Empirical Reality of Cognitive and Organizational Limits**: Both sides acknowledge that human agents and organizations face inherent cognitive and informational constraints, such as limited attention, memory, and computational capacity, as well as time and resource constraints. These constraints make exhaustive search and global optimization impractical in complex environments.

  3. **Simon’s Administrative Studies on Aspiration Adjustment**: Both sides accept that Simon's empirical work demonstrated that aspiration levels in organizational decision-making are not fixed but adjust over time in response to experience (e.g., rising after success and falling after failure). This adjustment process is adaptive and helps organizations cope with changing environments.

  4. **Conditions for Termination Without Global Comparison**: Both sides concur that agents often terminate search without comparing all possible alternatives globally, especially when search costs are high relative to the potential gains from further search. This termination occurs when a satisfactory option (as per the aspiration level) or an option meeting the reservation value (as per the optimization under constraints) is found.

  Now, the **Disagreements Table**:

  We present a table with two columns: Procedural Rationalist (PR) and Constrained Optimizer (CO). For each crux (a, b, c, d), we have:

  - A row for the crux.
  - In each column, the camp states its own view and then neutrally describes the opposing view.
  - Then, we specify a concrete case that both sides agree is relevant and record each camp's prediction for that case.
  - Finally, we note if there is a verbal dispute.

  We'll structure the table as follows:

  | Crux | Procedural Rationalist (PR) View | Constrained Optimizer (CO) View |
  |------|----------------------------------|--------------------------------|
  | ... | ... | ... |

  But note: We also need a row for the case and predictions. So we can break it down per crux.

  Alternatively, we can do:

  For each crux:
  - **Crux (a)**: Whether an aspiration level functions as an internal representational threshold or merely as an implicit price constraint.
    - PR view: [statement] and neutral description of CO view.
    - CO view: [statement] and neutral description of PR view.
    - **Shared Case**: [description]
      - PR prediction: ...
      - CO prediction: ...
    - Verbal dispute? [if any]

  But since we are to make a table, let's design it as a grid with rows for the cruxes and then sub-rows for the case and predictions.

  However, the problem says: "present a disagreements table with two columns—Procedural Rationalist and Constrained Optimizer—each stating its own view in wording it fully accepts and describing the opposing view in neutral terms neither side rejects." Then for each crux, we have the case and predictions.

  So, we can have:

  **Disagreements Table**

  | Crux | Procedural Rationalist (PR) | Constrained Optimizer (CO) |
  |------|-----------------------------|----------------------------|
  | **(a) Aspiration level: Internal threshold vs. implicit price constraint** | |
  | PR View | We hold that an aspiration level is an internal representational threshold that serves as a cognitive reference point, distinct from utility maximization, and is adjusted adaptively based on experience. The CO view treats aspiration levels as a derived feature of optimization under constraints. | We hold that an aspiration level is an implicit price constraint that emerges endogenously from the optimization of expected utility given search costs, and does not require a distinct cognitive mechanism. The PR view treats aspiration levels as a primitive cognitive construct. |
  | **Shared Case**: Consider a job seeker who sets an initial salary aspiration and adjusts it after each rejection or offer. After several rejections, the job seeker lowers the aspiration level. | |
  | **Predictions** | PR: The adjustment process will be described by a learning rule (e.g., based on recent outcomes) and the aspiration level will influence search behavior independently of explicit cost-benefit calculations. | CO: The adjustment process is consistent with Bayesian updating of the reservation wage to maximize expected utility given updated beliefs about the job market and the costs of continued search. |
  | **(b) Sequential search reducible to single-period optimization?** | |
  | PR View | We hold that sequential search with a stopping rule is a procedurally distinct mechanism that cannot be formally reduced to a single-period optimization because it involves dynamic, path-dependent processes that are not captured by a static reservation value. The CO view claims that such processes are reducible. | We hold that any sequential search process with a well-defined stopping rule can be formally represented as a single-period optimization problem by choosing an optimal reservation value that incorporates all future costs and benefits. The PR view denies this reducibility. |
  | **Shared Case**: A consumer searching for a house uses a rule: "stop when I find a house with at least 3 bedrooms and within 10 miles of work, and after seeing at least 5 houses." | |
  | **Predictions** | PR: The stopping rule is applied without the consumer computing the expected value of continuing search; the rule is simple and based on attributes. The CO model would require computing a reservation value that considers the distribution of house attributes and search costs. | CO: The consumer's rule is consistent with a reservation value (e.g., a utility level) that incorporates the cost of viewing houses and the distribution of houses; the rule is a heuristic approximation of that value. The PR model would not require the consumer to compute the reservation value. |
  | **(c) Ecological rationality: Separate mechanism or redescription?** | |
  | PR View | We hold that ecological rationality—the matching of heuristic procedures to environmental structures—is a distinct causal mechanism that explains success without optimization, as the environment does the work. The CO view sees this as merely a redescription of efficient search. | We hold that ecological rationality is a redescription of the outcome of efficient search given environmental statistics and does not constitute a separate mechanism; it is the result of optimization under constraints. The PR view sees it as a distinct mechanism. |
  | **Shared Case**: The "recognition heuristic" in which an agent chooses the more recognized of two items, which is often correct in environments where recognition correlates with the criterion (e.g., city size). | |
  | **Predictions** | PR: The recognition heuristic works because of the structure of the environment (recognition correlates with size) and does not require the agent to optimize or know the correlation. | CO: The recognition heuristic is a cost-effective rule that approximates the optimal strategy given the cost of acquiring more information and the statistical structure of the environment. |
  | **(d) Normative justification for satisficing in artificial agents** | |
  | PR View | We hold that satisficing is normatively justified for human cognition due to cognitive limits, but it does not carry over directly to artificial agents with explicit utility functions and programmable search budgets because such agents can optimize within their budgets. The CO view may see satisficing as a form of optimization. | We hold that satisficing is always a form of optimization under constraints (computation and information costs) and thus the normative justification applies to any agent, including artificial ones, when optimization is costly. The PR view sees satisficing as a distinct strategy not reducible to optimization. |
  | **Shared Case**: An AI agent with a fixed computation budget must decide whether to satisfice (stop when a solution meets a threshold) or optimize (use the entire budget to find the best solution). | |
  | **Predictions** | PR: Satisficing is not normatively required for the AI agent because it can be programmed to optimize within its budget, and doing so would be more efficient. | CO: Satisficing (by setting a reservation value) is the optimal strategy for the AI agent because it minimizes expected opportunity cost of search under the computation budget. |

  **Verbal Dispute Identification**:

  Both sides note that a portion of the dispute over "optimization" is verbal. The PR camp uses "optimization" to mean global comparison and maximization over the entire choice set, which is often infeasible. The CO camp uses "optimization" to mean choosing the best feasible alternative given constraints, which may involve local improvement and stopping rules. This divergence in terminology does not reflect a substantive disagreement about the decision processes but rather a difference in the scope of the term "optimization."

  This completes the joint statement.
answer: |-
  ### Joint Statement: Adversarial Collaboration on Bounded Rationality  
  **Parties:**  
  - **Procedural Rationalist (PR) Camp** (Simon tradition): Views aspiration levels, sequential search, and organizational processes as irreducible cognitive mechanisms.  
  - **Constrained Optimizer (CO) Camp** (Neoclassical search-theory tradition): Views satisficing as endogenous reservation-value optimization under information/computation costs.  

  ---

  ### 1. Agreed Claims  
  Both parties affirm the following statements, which resolve points of empirical and conceptual alignment:  

  1. **Formal Structure of Choice Sets and Stopping Rules**:  
     Agents face sequential search problems with choice sets that are often unknown ex ante and revealed incrementally. Stopping rules—whether based on aspiration levels (PR) or reservation values (CO)—are defined by a threshold criterion for terminating search. Both parties agree that these rules can be formally modeled as mappings from partial information to a binary continue/stop decision.  

  2. **Empirical Reality of Cognitive and Organizational Limits**:  
     Human agents and organizations operate under inescapable cognitive constraints (e.g., limited working memory, attentional bottlenecks) and environmental constraints (e.g., time pressure, information acquisition costs). These constraints preclude exhaustive search or global optimization in complex, uncertain environments.  

  3. **Simon’s Administrative Studies on Aspiration Adjustment**:  
     Simon’s empirical work demonstrated that aspiration levels adapt dynamically to experience (e.g., rising after successes, falling after failures) in organizational contexts. This adjustment is stimulus-driven and rarely involves explicit computation of expected values, though it converges toward stable equilibria under stationary conditions.  

  4. **Conditions for Termination Without Global Comparison**:  
     Agents terminate search without global comparison when: (i) an option meets or exceeds their aspiration level or reservation value; (ii) search costs exceed anticipated marginal benefits; or (iii) institutional routines (e.g., organizational protocols) dictate stopping. This is rational under both frameworks given non-trivial search costs.  

  ---

  ### 2. Disagreements Table  
  The table below states each camp’s position in its own accepted wording, neutrally describes the opposing view, and specifies testable predictions for shared cases. Verbal disputes are flagged and explained.  

  | Crux | Procedural Rationalist (PR) View | Constrained Optimizer (CO) View |  
  |------|----------------------------------|--------------------------------|  
  | **(a) Aspiration level: Internal threshold or implicit price constraint?** | |  
  | **Own View** | An aspiration level functions as an internal representational threshold—a cognitive reference point shaped by learning, emotions, and social norms—that directly gates decisions without requiring cost-benefit calculation. | An aspiration level is an implicit price constraint endogenously derived from optimization: it represents the reservation value that equates the marginal cost of further search with its expected marginal benefit. |  
  | **Neutral Description of Opposing View** | CO treats aspiration levels as emergent from shadow prices in an optimization problem. | PR treats aspiration levels as primitive cognitive constructs irreducible to optimization. |  
  | **Shared Case**: *A job seeker adjusts their salary demand downward after prolonged unemployment, then accepts an offer below their initial aspiration.* | |  
  | **Predictions** | PR: Aspiration adjustment is driven by heuristic rules (e.g., "lower demand after 10 rejections"), not explicit cost estimation; stress or social comparisons may distort thresholds independently of search costs. | CO: Adjustment reflects recomputation of the reservation wage to maximize expected utility given updated beliefs about offer distributions and rising search costs. |  
  | **(b) Sequential search reducible to single-period optimization?** | |  
  | **Own View** | Sequential search with stopping rules is procedurally distinct: it involves path-dependent, incremental cognition (e.g., attribute-based comparisons) and cannot be formally reduced to single-period optimization without losing key mechanistic insights. | Sequential search is formally reducible to single-period optimization via a dynamically chosen reservation value that encodes all future costs/benefits; the stopping rule is isomorphic to a one-shot decision. |  
  | **Neutral Description of Opposing View** | CO sees stopping rules as mathematical equivalents to reservation values in optimization. | PR sees sequential mechanisms as non-reducible due to their cognitive implementation. |  
  | **Shared Case**: *A homebuyer searches until finding a house meeting three fixed criteria (e.g., price ≤ $500K, 3+ bedrooms, ≤30-min commute), then stops immediately.* | |  
  | **Predictions** | PR: The buyer applies simple attribute thresholds without estimating opportunity costs; search length varies with option sequence, not global statistics. | CO: The criteria imply a reservation utility level computable from market distributions; identical behavior arises from optimizing expected net utility. |  
  | **(c) Ecological rationality: Causal mechanism or redescription?** | |  
  | **Own View** | Ecological rationality—adaptive matching of heuristics to environmental structures (e.g., recognition heuristic)—is a causal mechanism: accuracy stems from exploiting environmental regularities without probabilistic inference. | Ecological rationality is a redescription of efficient search: heuristic accuracy arises because the environment’s statistics make simple rules cost-optimal approximations of Bayesian inference. |  
  | **Neutral Description of Opposing View** | CO interprets ecological rationality as an outcome of optimization given environmental constraints. | PR interprets it as a direct heuristic-environment interaction bypassing optimization. |  
  | **Shared Case**: *Using the "take-the-best" heuristic (rank cues by validity; stop search at first discriminating cue) to infer city populations.* | |  
  | **Predictions** | PR: Accuracy depends on cue-order validity matching the environment; no knowledge of probabilities is needed or used. | CO: The heuristic is optimal when cue validities are stable and search costs outweigh gains from full integration; it fails when environmental statistics shift unpredictably. |  
  | **(d) Normative justification for satisficing in artificial agents** | |  
  | **Own View** | Satisficing is normatively justified for humans due to hard cognitive limits, but not for artificial agents with explicit utility functions and programmable budgets; they should optimize locally within resource constraints. | Satisficing is always normatively justified as optimization under information/computation costs; it applies identically to artificial agents when global optimization is intractable or costly. |  
  | **Neutral Description of Opposing View** | CO sees satisficing as universally reducible to constrained optimization. | PR sees satisficing as a human-specific strategy not generalizable to agents without cognitive limits. |  
  | **Shared Case**: *An AI with 10 CPU seconds to choose a logistics route: satisfice (accept first route under 12h transit) or optimize (exhaustively minimize transit time).* | |  
  | **Predictions** | PR: Satisficing wastes resources; the AI should use its budget for local optimization (e.g., hill-climbing). | CO: Satisficing (via a precomputed reservation value) minimizes expected loss from search costs; it is optimal given time constraints. |  

  ---

  ### 3. Identification of Verbal Disputes  
  A portion of the disagreement over **"optimization"** is verbal, not substantive:  
  - **PR** uses "optimization" to mean *global comparison* (e.g., evaluating all alternatives against a utility function).  
  - **CO** uses "optimization" to mean *feasible improvement* (e.g., local maximization within constraints).  
  **Why wording diverges**: PR emphasizes procedural differences in *how* decisions are made (e.g., aspiration thresholds vs. computation), while CO emphasizes functional equivalence in *outcomes*. The substance aligns on the necessity of constraints but diverges on whether mechanisms are reducible.  

  ---  
  **Signed**,  
  *Procedural Rationalist Camp*  
  *Constrained Optimizer Camp*  

  ---  
  *This document intentionally omits citations to ensure self-containment. Disagreements are preserved for empirical adjudication.*
