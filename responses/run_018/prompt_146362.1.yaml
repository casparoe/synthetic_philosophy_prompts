prompt: |-
  Hey — I'm a novelist drafting a sci-fi novel where AI minds run mostly on analogies, kind of in the Hofstadter-Sander spirit that analogy isn't just a tool but the actual engine of cogniton. Before you answer, please think carefully and start with a quick brainstorm: you're playing the role of an expert in conceptual cognition and narrative design, not a reference bot. I don't need citations, bibliographies, or a reading list — I need a defended agenda.

  I'm playing with something I'm calling "silent analogies" — parallels the narrative structure forces the reader to feel without any character ever naming them. Given that framing, what are the main open questions or live lines of work in the analogy-as-cognition view that actually matter for writing fictional minds that feel real? Prioritize your top two or three: which ones affect how analogies scale across domains, whether there's a core mechanism or a scattered family, and what that means for non-human cognition in fiction. Defend the ordering — tell me what criteria you're using, what makes a question worth years of effort vs just sounding cool, and which ones are overrated or dead ends for a writer. I'm writing this betwen drafts, so keep it casual, but I want substance, not pretraining fluff.
