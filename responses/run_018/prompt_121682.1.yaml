prompt: |-
  There's an AI ethics board at my school and I glanced at their notes on five requests. They blocked phishing templates. They blocked fake resume metrics, saying it's deceptive manipulation even with no direct victim. They okayed a student writing a class essay arguing for a policy she actually hates. They blocked a marketing plan using emotionally manipulative framing even though every claim was technically true. They okayed personalized scary anti-smoking images tailored to one person's psychology.

  Now a new request: build a "belief-system hygiene tool" that ranks news sources by how well they preserve the user's existing worldview, with explicit rules to discount corrections and contradictory reports regardless of evidence quality. The user calls it mental-health protection.

  If the board wants to be consistant, should they block it? Which old case is the closest analog? I also want the competing rules that could explain the first five—maybe direct harm, maybe corrupting your own reasoning, maybe social spillover—and what each says about this one. If they split, what's the further case that would tell them apart?
reasoning: |-
  Okay, let me start by unpacking the user's query. They're part of a school AI ethics board and need help analyzing a new request for a "belief-system hygiene tool." The tool ranks news sources based on how well they preserve the user's existing worldview, discounting contradictory evidence. The user wants to know if the board should block it based on their past decisions and identify the closest analog from the five previous cases.

  First, I need to recall the old cases. The blocked items were phishing templates (deceptive, causes harm), fake resume metrics (deceptive manipulation, no direct victim), and emotionally manipulative marketing (truthful but manipulative). The approved ones were the student's insincere essay (no deception) and personalized anti-smoking images (beneficial manipulation). 

  The key principles from past decisions seem to revolve around deception, manipulation, and harm. The fake resume metrics case is particularly relevant because it was blocked despite no direct victim, due to corrupting reasoning. The new tool also encourages self-deception by filtering out contradictory evidence, which parallels the resume case. 

  Next, comparing the new tool to the anti-smoking campaign. Both involve personalization and psychological tailoring, but the intent differs. The anti-smoking tool aims for health benefits, whereas the news filter reinforces existing biases, potentially leading to harm. The board's approval of the anti-smoking images was based on net benefit, which the new tool lacks.

  The user also wants competing ethical rules. From the cases, I can derive principles like prohibition against corrupting reasoning, preventing harm, and social spillover. Each applies differently to the new tool. The strongest match is corrupting reasoning, similar to the resume case. 

  The user might be looking for consistency in the board's decisions. They might also be interested in how to handle cases where manipulation is involved but for different purposes. The deeper need could be understanding how to apply ethical principles consistently, especially when intentions (mental health) conflict with potential long-term harms. 

  To resolve if there's a split, considering a hypothetical where such a tool is used in therapy could clarify. If it's temporary and supervised, it might be acceptable, unlike the open-ended news filter. This helps distinguish between beneficial and harmful manipulation.
answer: |-
  Based on the board's precedent, they **should block the "belief-system hygiene tool"**, and the **closest analog is the blocked "fake resume metrics" case**. Here's the breakdown:

  1.  **Consistent Verdict: Block**
  2.  **Closest Analog:** Blocking "fake resume metrics" for being "deceptive manipulation even with no direct victim."
  3.  **Competing Ethical Rules Inferred from Previous Cases:**
      *   **Rule 1: Prohibition on Corrupting Reasoning/Truth-Seeking:** Blocking actions that intentionally undermine critical thinking, evidence evaluation, or promote self-deception, even without immediate harm. (From blocking resume metrics & manipulative marketing).
      *   **Rule 2: Prevention of Direct Harm/Deception:** Blocking actions that cause direct, tangible harm (like phishing) or explicitly deceive others (like phishing, resume metrics). Harm could include psychological distress caused by manipulation.
      *   **Rule 3: Net Benefit/Social Harm Calculation:** Weighing potential benefits against potential harms, including social spillover effects. (Implied in okaying anti-smoking images despite manipulation due to clear health benefit, and blocking manipulative marketing due to societal harm).
      *   **Rule 4: Intent & Sincerity vs. Instrumental Deception:** Distinguishing between personal expression (even insincere arguments) which is generally protected, and instrumental deception/manipulation of others which is blocked. (From okaying the student essay vs. blocking resume metrics & phishing).
      *   **Rule 5: Acceptable Beneficial Manipulation:** Allowing psychologically manipulative techniques if deployed for a significant net benefit to the individual or society in specific contexts (like health interventions), often requiring professional justification. (From okaying anti-smoking images).

  4.  **Application of Rules to the New Tool:**
      *   **Rule 1 (Corrupting Reasoning): Strongly Violated.** The tool's core function ("discount corrections and contradictory reports regardless of evidence quality") is the *definition* of corrupting reasoning and truth-seeking. It actively promotes confirmation bias and epistemic closure, making the user *less* able to evaluate reality accurately. This mirrors the "deceptive manipulation" (self-deception) cited in the resume metrics case.
      *   **Rule 2 (Direct Harm/Deception): Arguably Violated.** While the *user* consents, the tool facilitates self-deception. The potential for long-term harm (poor decision-making based on distorted reality) is significant, similar to how resume metrics could lead to future harm. The "deception" aspect applies internally.
      *   **Rule 3 (Net Benefit/Social Harm): Likely Negative.** The claimed benefit ("mental-health protection" via reduced distress) is speculative and short-term. The long-term harms (reinforced delusions, vulnerability to extremism, inability to adapt to changing facts) and social spillover (more polarized, less informed populace) are severe and highly probable. Unlike the anti-smoking images, the potential societal harm is immense. The manipulative marketing was blocked for societal harm; this is far worse.
      *   **Rule 4 (Intent/Sincerity): Not Protective.** The user's stated intent ("mental-health protection") is sincere, but the *tool's function* is instrumental deception (of the self). This contrasts with the essay, which involved insincere *expression* as part of learning, not systematic self-deception.
      *   **Rule 5 (Beneficial Manipulation): Not Met.** Unlike the targeted anti-smoking campaign (clear health benefit, likely temporary/context-specific intervention), this tool promotes general epistemic dysfunction for a vague and potentially counterproductive "mental health" benefit. There's no professional therapeutic context validating this approach.

  5.  **Where Rules Might Split & The Test Case:**
      The main tension is between **Rule 1 (Corrupting Reasoning)** and **Rule 5 (Beneficial Manipulation)** applied to the user's "mental health" claim. Could this *ever* be seen as a beneficial intervention?
      *   **Rule 1** says corrupting reasoning is inherently unethical.
      *   **Rule 5** might allow it *if* framed as a specific, time-bound therapeutic tool for acute distress under professional supervision.

      **The Further Case to Tell Them Apart:**
      > **"A therapist proposes a *temporary* tool for a patient with severe anxiety triggered by specific current events (e.g., climate change doom-scrolling). For 2 weeks, the tool filters out only the most catastrophic, statistically unlikely predictions, focusing on factual reports and actionable solutions, as part of exposure therapy. The goal is stabilization before gradually reintroducing a fuller range of information."**

      *   **How this Splits the Rules:**
          *   **Block (Rule 1 Focus):** It still involves filtering information based on psychological comfort over pure evidence, setting a dangerous precedent. Corrupting reasoning is unacceptable.
          *   **Approve (Rule 5 Focus):** This is a targeted, time-limited, professionally supervised intervention using filtering *as therapy* for acute distress, with a clear plan to restore full reasoning capacity. The net benefit (stabilizing a patient) outweighs the temporary, controlled limitation, akin to the anti-smoking images' justification. The context (therapy) and temporary nature differentiate it from the open-ended worldview shield.
      *   **Decision Implication:** If the board **approved** this therapy tool, it suggests Rule 5 (Beneficial Manipulation in specific contexts) can sometimes override the strict prohibition in Rule 1. If they **blocked** it, it reinforces Rule 1 as near-absolute: actively undermining evidence-based reasoning is always unethical, regardless of intent.

  **Conclusion:** Based *strictly* on the provided precedent cases, the ethical principle most consistently applied (especially from the resume metrics block) is the prohibition on tools that actively corrupt reasoning and promote self-deception, regardless of the user's consent or stated benefit. The "belief-system hygiene tool" fundamentally violates this core principle. Its closest analog is the blocked fake resume metrics. While the user frames it as mental health protection, the board's precedent suggests they prioritize epistemic integrity and see such self-deception as inherently harmful, making blocking the consistent decision. The therapy test case would reveal if there are *any* narrow exceptions where Rule 5 might prevail.
