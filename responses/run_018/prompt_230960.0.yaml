answer: |-
  ### Pre-Vote Screening Procedure for Sen's Liberal Paradox  
  **Purpose:** Catch conflicts between individual rights and unanimous preferences before voting. Designed for non-experts in under 30 minutes.  

  | Step | Question to ask                                                                 | What counts as a pass                                                                 | What to do on a fail                                                                                          | Stop or continue | Judgment call? |
  |------|---------------------------------------------------------------------------------|--------------------------------------------------------------------------------------|---------------------------------------------------------------------------------------------------------------|------------------|----------------|
  | 1    | "Does this decision touch anyone’s personal domain? (Schedule, workstation, travel)" | No personal domains are affected.                                                    | At least one person’s personal domain is involved. Record whose domain and how (e.g., "Alice’s schedule").    | Continue         | Yes (Chair must identify domains) |
  | 2    | "Is there any option pair (X, Y) where everyone prefers X over Y? (Unanimous Pareto)" | No such pair exists.                                                                 | At least one pair (X, Y) has unanimous support. Record the pair(s) (e.g., "Option A > Option B").             | Continue         | No (Show of hands) |
  | 3    | "For each unanimously preferred pair (X, Y): Does moving from Y to X override someone’s personal choice?" | For all pairs, X doesn’t force a personal domain change against the owner’s will.    | For any pair, X forces at least one person’s domain against their stated preference (e.g., "Alice prefers Y’s schedule"). | Stop (Conflict)  | Yes (Ask affected individuals directly) |

  ---

  ### Worked Examples in JSON  

  #### Case 1: Weekend On-Call Norm (Conflict Found)  
  ```json
  {
    "case_name": "Weekend On-Call Norm",
    "setup": {
      "decision": "Set weekend on-call policy",
      "options": ["A: Mandatory rotation", "B: Volunteer-only"],
      "personal_domains_involved": "Everyone's schedule (personal domain)",
      "context": "All 10 members prefer A (mandatory) over B (volunteer) for fairness. But Charlie prefers B for their own schedule, as they value weekend flexibility."
    },
    "results": [
      {
        "step": 1,
        "question": "Does this decision touch anyone’s personal domain?",
        "answer": "Yes (Everyone's schedule)",
        "pass_or_fail": "fail"
      },
      {
        "step": 2,
        "question": "Is there any option pair (X, Y) where everyone prefers X over Y?",
        "answer": "Yes (A > B)",
        "pass_or_fail": "fail"
      },
      {
        "step": 3,
        "question": "For pair (A, B): Does moving from B to A override someone’s personal choice?",
        "answer": "Yes (Charlie prefers B for their schedule)",
        "pass_or_fail": "fail"
      }
    ],
    "conflict_found": true,
    "recommended_action": "Halt voting. Choose: (1) Override Charlie’s schedule right and adopt A, or (2) Drop unanimity rule and let Charlie opt out (leading to B).",
    "residual_judgment": "The checklist cannot resolve the value conflict. The co-op must debate: 'Should we prioritize fairness (unanimity) or individual autonomy (rights) here?' Document the ethical tradeoff publicly."
  }
  ```

  #### Case 2: Workstation Sound Policy (No Conflict)  
  ```json
  {
    "case_name": "Workstation Sound Policy",
    "setup": {
      "decision": "Set policy for headphone use",
      "options": ["X: Noise-canceling headphones required", "Y: Personal choice"],
      "personal_domains_involved": "Everyone's workstation (personal domain)",
      "context": "All 10 members prefer X (required) over Y (choice) for noise reduction. Everyone also prefers X for their own workstation."
    },
    "results": [
      {
        "step": 1,
        "question": "Does this decision touch anyone’s personal domain?",
        "answer": "Yes (Everyone's workstation)",
        "pass_or_fail": "fail"
      },
      {
        "step": 2,
        "question": "Is there any option pair (X, Y) where everyone prefers X over Y?",
        "answer": "Yes (X > Y)",
        "pass_or_fail": "fail"
      },
      {
        "step": 3,
        "question": "For pair (X, Y): Does moving from Y to X override someone’s personal choice?",
        "answer": "No (All members prefer X for their own workstation)",
        "pass_or_fail": "pass"
      }
    ],
    "conflict_found": false,
    "recommended_action": "Proceed to vote. No rights/unanimity collision detected.",
    "residual_judgment": "None."
  }
  ```

  ### Key Notes for the Chair  
  - **On Judgment Calls:** Focus on observable preferences (e.g., "Alice says she prefers B for her schedule")—avoid speculation.  
  - **Speed Tips:** Use sticky notes for Step 2 (members write preferred pairs) and a whiteboard for Step 3 (list domain-affected individuals).  
  - **Defensibility:** If a conflict arises, state: "Our rules guarantee two things: personal rights and unanimous decisions. They clash here—we must choose which to suspend."  
  - **What the Checklist Can’t Settle:** It flags clashes but doesn’t resolve ethical dilemmas (e.g., "Should we override Charlie?"). That requires a co-op values discussion.
