prompt: |-
  I run people-ops at a worker co-op where we try to live by two rules at once: everyone gets final say over a few things that are purely theirs (their schedule, their workstation, whether they travel), and if every single person prefers X over Y, we go with X. Last quarter this produced a circular ranking twice, and the postmortems turned into arguments about who's rights got overridden. I gather this is basically Sen's liberal paradox, but for us the theorem isn't actionable as-is. Write me a reusable pre-vote screen the meeting chair can run in under 30 minutes to catch, before the vote, when individual decisiveness and unanimous preference are about to collide, using Sen's impossibility of a Paretian liberal but translated into plain questions — no formalism, no proof. The chair isn't a philosopher; the decisions recur weekly-ish; stakes are medium (schedules, pay, workspace); and whatever we land on has to be defensible to the whole co-op afterward.

  Format: give me the procedure as a table with columns Step, Question to ask, What counts as a pass, What to do on a fail, Stop or continue, Judgment call (yes/no). Then apply it to two worked cases as JSON with fields case_name, setup, results (one entry per step), conflict_found, recommended_action, residual_judgment. Make one case a weekend on-call norm where the procedure tells us we have to override someone's personal call or drop the unanimity rule, and we'll hate both; in that case say explicitly what the checklist cannot settle for us.
reasoning: |-
  We are designing a pre-vote screening procedure based on Sen's liberal paradox. The goal is to catch situations where individual decisiveness (each person has final say on some personal matters) and the Pareto principle (if everyone prefers X over Y, then we go with X) might conflict, leading to a circular ranking or a situation where someone's rights are overridden.

  The procedure will be presented as a table with the following columns:
  - Step: The step number in the procedure.
  - Question to ask: A plain-language question that the chair will pose to the group (or consider for each individual) to test for potential conflict.
  - What counts as a pass: The condition under which we proceed without a conflict warning.
  - What to do on a fail: The action to take if the condition for passing is not met.
  - Stop or continue: Whether we stop the procedure (because a conflict is found) or continue to the next step.
  - Judgment call: Whether this step requires a judgment call (yes) or is mechanical (no).

  We are going to design a 3-step procedure:

  Step 1: Check for Unanimous Preference on Non-Personal Matters
    - We are going to ask: "Is there any option that everyone prefers over another option, and that preference does not involve overriding someone's personal domain?"
    - Pass: If there is no such unanimous preference, then we are safe for now. But note: we are looking for conflicts, so we want to catch when a unanimous preference exists that might conflict with a personal right.
    - Actually, we are trying to catch when a unanimous preference exists that would require overriding a personal right. So perhaps we should rephrase.

  Alternatively, we can break it down:

  Step 1: Identify any pair of options (X, Y) where everyone prefers X over Y.

  Step 2: For each such pair (X, Y) that we found in Step 1, check if choosing Y over X would override someone's personal right (i.e., is there a person who has the right to decide on an aspect that is different between X and Y, and they prefer Y?).

  But note: the problem says that each person has final say on a few things (schedule, workstation, travel). So we must define what aspects are personal to whom.

  We need to know, for the decision at hand, which person's personal domain is being affected and how.

  Let's design the procedure with the following steps:

  Step 1: Identify the decision and the options.
    - The chair should state the decision and the options being considered.

  Step 2: For each option, note which person's personal domain is affected and in what way.
    - For example, if the decision is about an on-call schedule, then the schedule is personal to each individual. But note: the decision might be about a norm that affects everyone's schedule.

  Actually, the problem is that we are making a collective decision that might override an individual's right in their personal domain.

  So:

  Step 1: List the options and for each option, list which individuals' personal domains are affected and how. (But note: an option might affect multiple people.)

  Step 2: Check for unanimous preferences: Are there two options X and Y such that every single person prefers X to Y?

  Step 3: For every such unanimous pair (X, Y), check if there is any individual who has a personal right that is violated by choosing X over Y. That is, if in the move from Y to X, we are overriding an individual's right in their personal domain (and note that the individual might prefer Y in their domain).

  But note: the individual's right is defined as having final say. So if an option X changes something in person A's personal domain against A's preference, then that would be overriding.

  However, the unanimous preference is for X over Y, so if in Y, person A's personal domain is set to A's preference and in X it is set against A's preference, then choosing X would override A's right.

  But note: the options are composites. We need to know if the difference between X and Y lies in the personal domain of one individual.

  Therefore:

  Step 1: For the decision at hand, identify the aspects that are in the personal domain of each individual. (This should be pre-established: e.g., for each person, their own schedule, their workstation, their travel.)

  Step 2: For each pair of options (X, Y) under consideration, determine if they differ in any personal domain. If they do, note whose domain and what the difference is.

  Step 3: Check for any unanimous preference: Is there a pair (X, Y) such that every member prefers X over Y?

  Step 4: For any such pair (X, Y) that is unanimously preferred, check if the difference between X and Y lies solely in the personal domain of one individual, and that individual prefers Y over X (because if they prefer Y, then forcing X would override their right).

  But note: if the difference is in multiple personal domains, then we might have a problem if at least one of those individuals prefers Y.

  However, Sen's paradox shows that even with one personal domain, we can get a cycle. But we are trying to catch the conflict.

  Alternatively, we can combine these steps into a few questions.

  Proposed procedure:

  Step 1: The chair asks: "Are we about to decide on something that affects at least one person's personal domain? (e.g., schedule, workstation, travel)" 
    - If no, then no conflict with individual rights -> pass.
    - If yes, then we need to check for unanimous preferences that might conflict.

  But note: we are also concerned with the Pareto principle. So we must check for unanimous preferences even when personal domains are involved.

  Step 2: The chair asks: "Is there any pair of options (X, Y) in our current set such that every single person prefers X to Y?" 
    - If no, then we don't have a Pareto issue, so pass and no conflict.
    - If yes, then we must check each such pair.

  Step 3: For every unanimously preferred pair (X, Y) (from step 2), the chair asks: "In the move from Y to X, is there any individual whose personal domain is being changed against their own stated preference for their domain?" 
    - That is, does the difference between X and Y lie in the personal domain of at least one individual, and that individual actually prefers Y (which includes their preferred setting for their domain) over X?
    - If for a given (X, Y) the answer is no, then we can safely choose X over Y without overriding a right? But note: if the difference isn't in anyone's personal domain, then we don't override. Also, if it is in someone's personal domain but that person actually prefers X (so they are happy to have it changed) then we are not overriding.
    - Only when we have a unanimous preference for X over Y and at least one person has a personal domain affected by the change from Y to X and that person prefers Y (so they would be overridden) do we have a conflict.

  So:

  - Step 1: Identify the decision and the options. (This is preparatory, so we don't need to include it as a step with a question? But the table is for the chair to run, so we include.)

