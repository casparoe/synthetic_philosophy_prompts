answer: |-
  Your observation captures a sophisticated cognitive and moral phenomenon. While no single term fully encompasses this *specific* asymmetry, it sits at the intersection of several established concepts. The closest existing framework is **"Moral Exnomination"** (drawing on social psychology and critical theory), but it requires refinement to fit your precise description.

  ### Core Concept: **Normative Status Asymmetry (NSA)**
  I propose this term to describe *the systematic tendency to elevate one's own in-group commitments to the status of universal values while demoting structurally similar out-group commitments to preferences, biases, or parochial interests, without applying consistent criteria.*

  **Key Features of NSA:**
  1.  **Formal Equivalence:** Opposing commitments share identical logical structures (e.g., "X ought to be prioritized regardless of Y").
  2.  **Differential Categorization:** "Our" commitment = Universal Value; "Their" commitment = Preference/Bias.
  3.  **Criterion Inconsistency:** No stable, objective standard (universality, impartiality, harm prevention, etc.) is applied reflexively. The categorization itself *reveals* the group allegiance.
  4.  **Social Alignment as Driver:** Group membership, not intrinsic features of the commitment, determines its normative status.

  ### Distinguishing NSA from Related Concepts
  1.  **In-Group Favoritism (Social Identity Theory):**
      *   **Difference:** In-group favoritism involves preferential *treatment* or *evaluation* (e.g., "our solution is better"). NSA involves a fundamental *categorical shift* in the *ontological status* of the commitment itself. It's not just that "their" value is wrong; it's demoted to a non-value category (preference/bias). NSA weaponizes meta-ethical classification.

  2.  **Motivated Reasoning:**
      *   **Difference:** Motivated reasoning explains *how* NSA occurs (processing information to reach desired conclusions supporting group identity). NSA *specifies the unique output* of that reasoning: the asymmetric reclassification of normative commitments. Motivated reasoning is the engine; NSA is the specific maneuver performed by that engine.

  3.  **Straightforward Moral Relativism:**
      *   **Difference:** A relativist explicitly denies universal values ("Their view is *their* value, ours is *ours*"). The NSA speaker *claims universality* for their own view while denying it to the structurally equivalent opposing view. They use relativism *selectively* against the out-group while maintaining universalism for themselves. It's a form of **asymmetric universalism**.

  4.  **Moral Exnomination (Bourdieu/Wacquant):**
      *   **Similarity:** Exnomination describes how dominant groups render their own perspectives and interests invisible *as* particular perspectives/interests, presenting them instead as neutral, objective, or universal ("just the way things are").
      *   **Refinement for NSA:** NSA is a specific *application* of exnomination *in the context of moral disagreement*. The dominant group exnomiates its *own* commitment (it's not a "bias," it's "truth") while simultaneously *hyper-nominating* the out-group's commitment (marking it explicitly as a "bias," "preference," or "special interest"). NSA highlights the *relational, asymmetric categorization process* during conflict.

  ### The Boundary: When Does Legitimate Distinction Become NSA?
  The failure occurs when **all three** of these conditions are met:

  1.  **Formal Equivalence Exists:** The commitments share the same logical structure (e.g., prioritizing a specific good above trade-offs).
  2.  **Criterion Inconsistency is Evident:** No coherent, reflexively applied principle justifies elevating one and demoting the other (e.g., claims of universality/objectivity/impartiality are applied only to the in-group commitment).
  3.  **Group Alignment is the Discernible Driver:** The categorization pattern reliably tracks group membership rather than any defensible intrinsic feature of the commitments themselves (e.g., demonstrable differences in harm, coherence, impartial justification).

  **Where the Failure Lies:**
  *   **Primarily in the Classification:** The core failure is the *mis-categorization* based on group loyalty rather than reasoned analysis. This is a failure of epistemic and moral honesty.
  *   **Amplified by the Reasoning:** Subsequent reasoning often employs double standards (e.g., demanding impossible levels of justification from the out-group while accepting the in-group commitment axiomatically).
  *   **Manifested in the Refusal of Reflexivity:** The defining and most damaging failure is the *unwillingness to apply the same critical lens or categorization criteria to one's own commitment*. This lack of reflexivity shields the in-group commitment from scrutiny and exposes the group-based motivation.

  ### Underlying Mechanisms & Implications
  *   **Social Identity Protection:** Maintaining the superior moral status of the in-group is paramount. NSA defends group identity by framing its core commitments as inherently righteous.
  *   **Epistemic Closure:** Demoting opposing views to "biases" or "preferences" absolves the speaker of the need to engage seriously with counter-arguments or evidence. It shuts down dialogue.
  *   **Power & Legitimacy:** Elevating in-group commitments to "universal values" grants them greater rhetorical and political force, justifying imposing them on others. Demoting out-group commitments undermines their legitimacy and claim to consideration.
  *   **Normative Implication:** NSA is fundamentally anti-deliberative and corrosive to pluralistic discourse. It prevents genuine moral engagement across differences by preemptively dismissing the normative weight of the opposing view. It represents a failure of moral imagination and epistemic humility.

  **In essence, Normative Status Asymmetry (NSA) is the deployment of a double standard in the foundational act of *defining what counts as a moral value vs. a mere preference*, driven by group allegiance and marked by a refusal of reflexivity. It transforms moral disagreement into a form of identity defense through categorical gerrymandering.**
