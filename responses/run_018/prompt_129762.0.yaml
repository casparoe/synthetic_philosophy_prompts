answer: |-
  Below is a decision tree designed to sort temporal metaphysics views based on concrete scenarios, avoiding labels and focusing on existential commitments. It includes 7 nodes (6 splits + 1 terminal note), flags incoherent/inconsistent combinations, and notes limitations. The tree prioritizes *what you believe exists* and *how presence functions*.

  ---

  ### **Decision Tree: Temporal Existence & Presence**

  #### **Node 1 (Root):**  
  **Scenario:** You observe a dinosaur fossil. Is the dinosaur itself (a past entity) *part of reality in any sense* (e.g., as a concrete relatum), or is there **literally nothing outside the present moment**?  
  - **Yes (Nothing outside present):** Proceed to Node 2.  
  - **No (Dinosaur is real in some sense):** Proceed to Node 3.  

  ---

  #### **Node 2 (Past Properties under Presentism):**  
  **Scenario:** The dinosaur no longer exists, but we say, "The fossil is older than the dinosaur was." Can this be true *even if the dinosaur lacks any current existence*?  
  - **Yes (Relational properties hold without existing relata):** → **Presentism with ghost-relational scars**.  
    - *Belief:* Only the present exists, but past events can bear properties (e.g., "being older than") without being real.  
  - **No (Properties require existing relata):** → **Pure presentism (problematic)**.  
    - *Belief:* Only the present exists, and past entities cannot bear properties. *Note:* Truths about the past (e.g., "Dinosaurs existed") lack truthmakers → **Logically unstable without further machinery**.  

  ---

  #### **Node 3 (Past Reality):**  
  **Scenario:** Is the dinosaur—despite being past—a **concrete, existing part of reality** (like your chair), just located at a different time?  
  - **Yes (Past is real):** Proceed to Node 4.  
  - **No (Past is unreal):** Proceed to Node 5.  

  ---

  #### **Node 4 (Future Reality):**  
  **Scenario:** Consider a future event (e.g., the Sun engulfing Earth). Is this event **already part of reality** (tenselessly), even though it hasn’t "happened" yet?  
  - **Yes (Future is real):** Proceed to Node 6.  
  - **No (Future is unreal):** → **Growing-block theory**.  
    - *Belief:* Past and present exist concretely; future does not.  

  ---

  #### **Node 5 (Future Reality under Shrinking-Block):**  
  **Scenario:** If the past isn’t real, could the future *still* be real?  
  - **Yes (Future is real):** → **Shrinking-block theory**.  
    - *Belief:* Present and future exist; past does not.  
  - **No (Future is unreal):** → **✗ Incoherent**.  
    - *Issue:* You deny past/future reality but affirmed non-present existence at Node 1 → **No logical space for this view**.  

  ---

  #### **Node 6 (Double Present Problem):**  
  **Scenario:** A time traveler exists simultaneously at 1924 and 2024. If 2024 is "present," must 1924 be **non-present** (i.e., is presence unique across reality)?  
  - **Yes (Presence is unique):** → **Moving spotlight theory**.  
    - *Belief:* All times exist (eternalism), but one "now" is objectively privileged and moves.  
  - **No (Presence is non-unique):** → **B-theoretic eternalism (eternalism with indexical presentness)**.  
    - *Belief:* All times exist equally; "present" is perspectival (like "here").  

  ---

  ### **Key Notes & Limitations**  
  1. **Incoherent/Empty Views:**  
     - `Node 5 → No` (Past unreal + Future unreal) is **inconsistent** (violates Node 1’s commitment to non-present existence).  
     - `Node 2 → No` (Pure presentism) is **theoretically unstable** without truthmakers for past claims.  

  2. **Indistinguishable Pairs:**  
     - **A-theoretic eternalism vs. Moving spotlight:** The tree *collapses these*—moving spotlight **is** the A-theoretic version of eternalism.  
     - **Hybrid nuances** (e.g., growing-block with a "spotlight") are not distinguished.  

  3. **Likely Mis-sorting:**  
     - **Shrinking-block theorists** may balk at Node 3 (denying past reality) if they interpret "dinosaur existence" relationally.  
     - **Presentists with ersatz pasts** (e.g., abstract past times) may answer Node 2 incorrectly sorted into "ghost-relational" (they reject concrete relata but accept truths).  

  4. **Mind-Changing Arguments:**  
     - **Node 2:** If relations *don’t require existing relata* (e.g., "Socrates is dead" is true without Socrates existing now), ghost-relationalism gains plausibility.  
     - **Node 6:** If relativity theory undermines a universal "now" → undermines unique presence (favors B-theory).  
     - **Node 4:** If future openness/closeness intuitions conflict with future existence → favors growing-block.  

  ---

  ### **Tree Summary**  
