  ### 4. **Single New Case to Settle the Rule**
  To distinguish between **similarity cutoff** and **analog-counting utilitarian calculus**, use:  
  - **Case:** *One agent can pay a fixed moderate cost to aid two distant analogs. Analog A is 82% similar; Analog B is 78% similar. The benefit per analog if aided is identical and high, but the cost is set such that aiding one analog yields negative expected utility (e.g., cost > 82% × benefit), while aiding both yields positive expected utility (e.g., cost < (82% + 78%) × benefit). The agent must aid both or neither.*  
  - **How it settles the rule:**  
    - If she **aids both**, she uses **analog-counting utilitarian calculus** (total expected utility: 1.6 × benefit > cost).  
    - If she **aids neither**, she uses a **similarity cutoff** (both analogs are below a strict ~80-85% threshold, and neither individually meets the cost-benefit).  
  - **Why it works:** Her past 99% and 60% cases imply a cutoff, but analog-counting could override it for net gains. This case isolates the conflict.  

  ---

  ### 5. **Impact of Functional Decision Theory (FDT) vs. Evidential Decision Theory (EDT)**
  **No, switching to FDT would not flip her answer to defection.**  
  - **Why?**  
    - **EDT:** Cooperating is evidence that other high-similarity analogs cooperate (due to correlation from shared algorithm and device), leading to high expected utility. She would cooperate.  
    - **FDT:** Treats the decision as a fixed function; with a shared correlation device and 85% similar algorithms, FDT would coordinate mutual cooperation for higher payoff (like in the identical-AI case).  
  - **Outcome:** Both EDT and FDT predict **cooperation** here. The shared correlation device and high similarity enable coordination under both theories. FDT might strengthen cooperation (by handling logical correlations better), but it doesn't reverse the outcome.  

  ---

  ### Summary
  - **Prediction:** Cooperate (due to high similarity and analog count).  
  - **Rule:** Similarity cutoff (~80–85%); shared-procedure rule predicts defection.  
  - **Closest analog:** Aiding one 99%-similar analog.  
  - **Settling case:** Aiding two analogs (82% and 78%) with fixed cost.  
  - **FDT vs. EDT:** No flip; both support cooperation.  

  This aligns with her decision-theoretic pattern: similarity-centric with coordination mechanisms enabling cooperation above a cutoff, while diverging procedures or low similarity trigger defection.
