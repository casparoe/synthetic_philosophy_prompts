  - If A is false (P=0.3), then Williams is wrong, so external reasons possible. Then even if moral examples aren't external (B true, P=0.3), there could be other externals, but we need at least one. To be safe, if A is false, we assume there is some external reason. Similarly, if C is true (P=0.6), there's an external reason. Only if both A is true and C is false and no moral external, but if A true, then for moral to be external, B must be false? B is P that moral counterexamples fail Williams test, so if B is true, they fail, so not external if A true. If B false, they might be external. So P(no external) = P(A true and C false and B true) , because if A true, then only if B true (moral fails) and C false (institutional not external), then no externals. P(A true) = 0.7, P(C false) = 0.4, P(B true) = 0.3. Assuming independence, P(all) = 0.7 * 0.4 * 0.3 = 0.084. Then P(at least one external) = 1 - 0.084 = 0.916. That seems too high. Issue: this assumes that if A is false, external reasons definitely exist, which might not be true. Williams could be wrong, but still no actual external reasons. Similarly, C true gives one, but if not, others might. To be more precise, P(external exists) = P(C true) + P(C false) * [ P(A false) * P(some external | A false) ] , but it's messy. Since the main candidates are moral and institutional, and I have credences on B and C, and A affects whether moral can be external. Let me approximate:

  - Probability from institutional: P(C true) = 0.6
  - Probability from moral: If A false (P=0.3), and P that moral provides an external reason. But if A false, Williams wrong, so moral could be external, but it might still not exist. However, moral realism is plausible, so let's say if A false, P(moral external) is high, say 0.8. But this is getting complicated. Since B is about whether moral counterexamples fail, if A true, P(moral external) = P(B false), because if B false, they don't fail, so they are internal? No: if B false, it means that moral counterexamples do NOT fail Williams test, meaning they are internal. If B true, they fail, so not internal, but if A true, then if they fail, they aren't reasons at all. Williams says if no motivation, not a reason. So if A true, and B true (moral fails test), then moral is not a reason, so not external. If A true and B false, then moral is internal. Only if A false can moral be external. Similarly, institutional is separate.

  So for moral to be external: need A false (Williams wrong) and also that moral reasons exist and are external, which I'll tie to B. B true means they fail Williams test, so if A false, B true might indicate they are external. But B is defined as P that they fail the test, which if A false, failing the test might not mean anything, or it could mean they are external. Perhaps I should redefine.

