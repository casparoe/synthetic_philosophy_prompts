prompt: |-
  In Bayesian epistemology, the problem of old evidence has persisted since the 1980s without convergence: data already known before a theory's introduction—such as Mercury's orbital precession prior to general relativity—seem to provide no new probabilistic support, yet they are routinely cited as confirming instances. The literature has accumulated technical responses—counterfactual priors, distinctions between predictive and accommodative success, revisions to conditionalization—without resolving whether these are competing formal solutions or sides talking past each other. Diagnose this stalemate. Is it a substantive disagreement about the correct Bayesian formalism, a verbal dispute about whether 'confirmation' must involve predictive novelty, or a hidden split between normative questions about rational belief revision and descriptive questions about scientific reasoning? Identify what each side actually takes the problem to show, and take a committed position: state precisely what kind of disagreement this is. Then specify what would count as genuine progress—whether a formal result, a conceptual distinction, or a reframing of the question itself—rather than another technical patch.
reasoning: |-
  Okay, I'm diving into this Bayesian epistemology problem about old evidence. The user presents a sophisticated puzzle that's been stuck since the 1980s - why do scientists treat known data (like Mercury's orbit) as confirming new theories (like Einstein's relativity) when Bayesian logic seems to say it shouldn't? 

  First, I need to unpack why this is paradoxical. The core issue is Bayes' theorem: if evidence E is already known (P(E)=1), then learning theory H doesn't change its probability since P(H|E)=P(H)/P(E)=P(H). But intuitively, Mercury's orbit *did* support relativity. That's the contradiction driving decades of debate.

  Hmm, looking at the proposed solutions: Some suggest tweaking priors counterfactually ("what if we didn't know E?"). Others distinguish predictive vs. accommodative success. Some even overhaul conditionalization. But none have settled it. Why?

  The user wants me to diagnose the stalemate. Let me map the positions: 
  - Formalists think it's about math - we need better probability tools. 
  - Purists insist confirmation *requires* prediction. 
  - Pragmatists say scientists just work differently than ideal Bayesians.

  Ah, I suspect the real divide is deeper. The formal approaches aren't competing solutions - they're responses to different facets of the problem. Counterfactual priors address belief revision mechanics, predictive distinctions handle scientific practice, and revised conditionalization targets rationality norms. They're not even disagreeing; they're solving different puzzles under one name.

  For my committed position: This is primarily a category error. The "problem" arises because we're trying to model two distinct things - rational belief updating (where old evidence *shouldn't* confirm) and historical theory acceptance (where it *does*) - with one Bayesian framework. That's like using a thermometer to measure weight.

  Genuine progress? Not more formal patches. We need to decouple the questions: 
  1) Define a "public confirmation" concept separate from private belief revision 
  2) Accept that historical cases involve non-Bayesian factors (heuristics, coherence, narrative) 
  3) Maybe develop a dual framework where old evidence supports theories through different mechanisms than Bayes' theorem captures.

  The user will want concrete stakes. If we don't resolve this, Bayesianism risks being either irrelevant to real science (by ignoring accommodation) or irrational (by allowing cheap confirmation). My proposal keeps Bayesianism for belief updating while creating space for other confirmation models in scientific practice.
answer: |-
  The stalemate in the "problem of old evidence" (POE) arises from a **fundamental category mismatch** between Bayesian formalism and scientific practice, exacerbated by conflating three distinct dimensions: formal coherence, normative rationality, and descriptive historiography. Below, I diagnose the disagreement, specify each side's core claims, take a committed position, and outline genuine progress.  

  ---

  ### **Diagnosing the Stalemate**  
  The POE manifests as a trilemma:  
  1. **Formal Inertia**: If evidence \(E\) is known (so \(P(E) = 1\)), Bayes’ theorem implies \(P(H|E) = P(H)\)—no confirmation.  
  2. **Scientific Practice**: Scientists treat \(E\) (e.g., Mercury’s precession) as confirming \(H\) (e.g., general relativity).  
  3. **Bayesian Rationality**: Confirmation *should* track probabilistic relevance.  

  **Technical responses fail to resolve the stalemate because they address different facets without reconciling their goals**:  
  - **Counterfactual priors** (e.g., Garber, Jeffrey) ask: "What would \(P(H)\) be if \(E\) were unknown?"  
    - *Takes POE to show*: Bayesianism needs *rational reconstructability* of discovery contexts.  
  - **Predictive vs. accommodative success** (e.g., Worrall) distinguishes novel predictions from explaining known data.  
    - *Takes POE to show*: Only *novel predictions* confirm; accommodation is heuristic.  
  - **Revised conditionalization** (e.g., Jeffrey conditionalization) allows uncertainty in evidence.  
    - *Takes POE to show*: Bayesianism must handle *non-certain evidence*.  

  These are **not competing solutions** but **divergent tools for distinct problems**:  
  - Counterfactual approaches prioritize *rational reconstruction*.  
  - Predictive distinctions address *scientific rhetoric*.  
  - Revised formalisms fix *technical coherence*.  

  **The stalemate is not primarily substantive or verbal—it is a *methodological schism*:**  
  - **Formalists** (e.g., Howson, Garber) see POE as a technical bug in Bayesian machinery.  
    - *Their claim*: With proper priors/conditionalization, \(E\) *can* confirm \(H\) (e.g., via counterfactual \(P'(E) < 1\)).  
  - **Purists** (e.g., Maher, Musgrave) see POE as revealing a core norm: confirmation *requires* predictive novelty.  
    - *Their claim*: Accommodation is epistemically inert; scientists confuse *pragmatic* utility with *probabilistic* support.  
  - **Pragmatists** (e.g., Hacking, Schindler) see POE as misdescribing science.  
    - *Their claim*: Bayesianism is a poor descriptive model; scientists use old evidence to test *explanatory coherence*, not probability.  

  **Core Disagreement**: Whether Bayesian confirmation should:  
  (A) *Formally model* actual scientific judgments (accepting accommodations as rational),  
  (B) *Normatively prescribe* that only predictions confirm, or  
  (C) *Explain away* POE as a psychological/descriptive error.  

  ---

  ### **Committed Position**  
  **This is a *normative-methodological* disagreement masquerading as a formal one.** The POE stalemate arises because Bayesian epistemology cannot simultaneously:  
  - Preserve its *formal axioms* (e.g., strict conditionalization),  
  - Satisfy *normative ideals* (e.g., avoiding "cheap" confirmation via accommodation),  
  - Describe *scientific practice* (e.g., Mercury as evidence for relativity).  

  **The root issue**: Bayesianism is being asked to serve two masters—**rational belief revision** (normative) and **theory acceptance in science** (descriptive)—which have divergent criteria for "confirmation."  
  - In *belief revision*, old evidence *should not* confirm: learning \(H\) adds nothing if \(E\) is certain.  
  - In *scientific theory acceptance*, old evidence *does* confirm: it demonstrates explanatory power and resolves anomalies.  

  **Thus, POE is not solvable within standard Bayesianism because it conflates:**  
  - **Confirmation as relevance** (increase in subjective probability),  
  - **Confirmation as justification** (warrant for theory acceptance in scientific communities).  

  ---

  ### **Genuine Progress: Beyond Technical Patches**  
  Progress requires **reframing the question** to disentangle normative and descriptive projects:  

  1. **Adopt a Bifurcated Framework**  
     - **Normative Bayesianism**: Restrict "confirmation" to *updating on novel evidence*. Old evidence cannot confirm; its role is explanatory coherence or heuristic value.  
     - **Descriptive/Historical Model**: Treat "confirmation" as a *sociolinguistic practice* where old evidence supports theories via:  
       - Explanatory unification (e.g., Kitcher),  
       - Anomaly resolution (e.g., Mercury as a known puzzle),  
       - Non-Bayesian virtues (simplicity, fruitfulness).  

  2. **Formalize a Hybrid Account**  
     - **Result needed**: A theorem linking *explanatory success* (e.g., how \(H\) systematizes \(E\)) to *partial belief updates*, without violating Bayesian axioms.  
       - *Example*: Use **accuracy arguments** (e.g., Joyce) to show that theories explaining old evidence better *calibrate* with truth, justifying higher credence *indirectly*.  

  3. **Conceptual Distinction: Two Kinds of Confirmation**  
     - **Type 1 (Belief Revision)**: Requires \(P(E) < 1\) for confirmation.  
     - **Type 2 (Theory Vindication)**: Justified by \(H\)’s ability to *retrodict* \(E\) *within a rival comparison* (e.g., relativity vs. Newton).  
       - *Progress*: POE dissolves if Type 2 is non-probabilistic but rationally compelling.  

  4. **Address the "Why Now?" Question**  
     - **Reframe**: Why does old evidence *become salient* post-\(H\)?  
       - *Result needed*: A model showing how \(H\)’s introduction *recontextualizes* \(E\) as an anomaly, increasing its probative weight against competitors.  
       - *Tool*: **Network analysis** (e.g., Bovens & Hartmann) where \(E\) gains confirmatory power via its role in a *new theoretical structure*.  

  ---

  ### **Conclusion**  
  The POE stalemate persists because technical fixes target symptoms (formal incoherence) while ignoring the disease: **Bayesianism’s inability to model theory acceptance in historical science**. Genuine progress requires:  
  1. **Abandoning** the idea that "confirmation" is univocal,  
  2. **Developing** a dual framework separating belief revision from theory vindication,  
  3. **Proving** that explanatory success with old evidence indirectly warrants credence (e.g., via truth-tracking).  

  Without this, we add epicycles to a model that cannot capture why Mercury’s orbit mattered *when relativity arrived*—not because it was new, but because relativity made it a *keystone*. Resolving POE means making Bayesian epistemology a tool for science, not a Procrustean bed.
