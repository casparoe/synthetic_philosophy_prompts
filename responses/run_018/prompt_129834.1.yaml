answer: |-
  Here's the disambiguation of "morality is relative" as a menu of distinct positions, analyzed as requested. Each entry includes: core meaning, defensibility, whether it blocks outsider criticism, commonality, moral progress potential, and a mind-changing argument. Key failure points are flagged at the end.

  ### 1. **Descriptive Relativism (The Truism)**
      *   **Core:** Cultures/historical periods *factually* hold different moral beliefs and practices. (E.g., "Some cultures practice polygamy, others don't.")
      *   **Defensible?** Yes, obvious empirical fact. Sociology/anthropology 101.
      *   **Blocks Outsider Criticism?** No. Describing differences ≠ saying they *can't* be judged. You can observe variation *and* criticize some practices.
      *   **Common View?** Extremely common starting point, often mistakenly conflated with stronger claims. People say "it's relative" meaning "it varies".
      *   **Moral Progress?** Compatible. Progress = movement from worse to better beliefs/practices *within* a culture's own standards or against external standards. Doesn't require universals itself.
      *   **Mind-Changer:** None needed. It's uncontroversial data. If someone uses *this* to block criticism, they've smuggled in a stronger claim.

  ### 2. **Metaethical Cultural Relativism (MCR - The Strong Claim)**
      *   **Core:** Moral *truth* or *correctness* is determined solely by the standards of the agent's culture. "X is wrong" means "My culture disapproves of X." There *are* no culture-independent moral facts.
      *   **Defensible?** Controversial but argued (e.g., early anthropology). **Major Weakness:** "Culture" is vague (whose interpretation counts? reformers vs. traditionalists?), leads to absurdities (Nazi culture defining genocide as "good" for them), struggles with moral reformers *within* a culture (were abolitionists *wrong* in pre-Civil War US?).
      *   **Blocks Outsider Criticism?** Absolutely. Judging another culture requires *your* culture's standards, which are irrelevant to *their* moral truth. Criticism is literally nonsensical/meaningless.
      *   **Common View?** Very common when people say "it's their culture, we can't judge." Often assumed to imply tolerance (though MCR doesn't logically require it - *your* culture might demand intolerance!).
      *   **Moral Progress?** **Problematic:** Progress *within* a culture must be defined by that culture's *own* changing standards. But if "good" = "conforms to current cultural standards," then *any* change is "progress" only *after* the culture adopts the new standard. Reformers are *always wrong* by definition until they win. Feels like cheating.
      *   **Mind-Changer:** **Internal Reformers:** Point out heroes like MLK or Wilberforce. If MCR is true, they were *objectively morally wrong* by their own culture's standards *at the time* they started. If you believe they were *right* even when their culture said they were wrong, you reject MCR. **Cross-Cultural Consensus:** Show near-universal agreement on core wrongs (e.g., torturing infants for fun). MCR struggles to explain this without implying *some* universal standard.

  ### 3. **Individual (Subjectivist) Relativism**
      *   **Core:** Moral truth is determined by individual beliefs/feelings. "X is wrong" means "I disapprove of X."
      *   **Defensible?** Hardly. Leads to immediate contradictions (Is slavery wrong? Well, depends who you ask! Slave owner says no, slave says yes. Both 'true' for them? Meaningless). Makes moral disagreement impossible (we're just stating preferences). **Highly unstable.**
      *   **Blocks Outsider Criticism?** Yes, but absurdly. Criticism = "I dislike your practice," which is trivial and offers no reason for the *other person* to care. Also blocks *any* criticism *within* a culture.
      *   **Common View?** Sometimes expressed ("Who are you to tell me what's right? It's my truth!"), but rarely held consistently due to its absurdity. Often a rhetorical move.
      *   **Moral Progress?** Nonsensical. Changes in feelings aren't "progress," just change. No standard to measure against.
      *   **Mind-Changer:** **Demand Consistency:** Ask if a serial killer's "personal morality" makes their actions right *for them*. If they say no, they reject individual relativism. **Moral Disagreement:** Point out we *argue* about morals as if there's something to be right/wrong *about*, not just preferences like vanilla vs. chocolate.

  ### 4. **Expressivism / Non-Cognitivism (Not Relativism, but Often Mixed In)**
      *   **Core:** Moral statements ("Slavery is wrong") aren't truth-apt claims *at all*. They express emotions ("Boo slavery!") or prescribe actions ("Don't do slavery!"). No "moral facts" exist to be relative *or* absolute.
      *   **Defensible?** Sophisticated versions (e.g., Ayer, Blackburn) exist to explain moral language/logic without metaphysical facts. Still controversial.
      *   **Blocks Outsider Criticism?** **Reframes it.** Criticism = expressing *your* disapproval ("Boo caste!"). It's not *judging truth*, just emoting/prescribing. Outsiders can "boo" all they want, but it carries no special *authority* over the other culture's "boos" or "hurrahs." Persuasion, not proof.
      *   **Common View?** Rarely consciously held. People *talk* like moral claims are true/false, but the *feeling* that it's "just opinion/emotion" leans this way.
      *   **Moral Progress?** Not in a truth-tracking sense. Progress = changing emotional responses/social prescriptions. Calling it "progress" might express *approval* of the change, but it's not *objectively* progress.
      *   **Mind-Changer:** **Moral Reasoning:** Argue that we give *reasons* for moral positions ("Slavery causes suffering"), implying we're appealing to something beyond pure emotion. If reasons matter, pure expressivism is insufficient.

  ### 5. **Error Theory (Moral Nihilism)**
      *   **Core:** Moral statements *aim* to state objective truths (like "slavery is wrong"), but they *all fail* because no such moral facts exist. Everyone is *mistaken* in believing moral claims can be true. (E.g., J.L. Mackie)
      *   **Defensible?** Argued seriously, but faces the "queerness" challenge: What *are* these strange facts, and how do we know them? Requires explaining widespread moral error.
      *   **Blocks Outsider Criticism?** **Undermines all criticism.** Criticism relies on the idea that moral claims *can* be true/false. If all moral claims are false, criticism is systematically mistaken. Outsider status is irrelevant; *no one* can legitimately criticize.
      *   **Common View?** Rarely consciously held. The *skepticism* behind "it's all relative" sometimes flirts with this, but most people don't fully embrace the nihilism.
      *   **Moral Progress?** Impossible. All moral beliefs are equally false. Change happens, but it's not "progress" towards truth.
      *   **Mind-Changer:** **Practical Incoherence:** Argue we *cannot live* as consistent error theorists. We inevitably make judgments, feel guilt/outrage, hold people responsible. If moral facts are impossible illusions, why do they structure human life so pervasively? **Preservation of Normativity:** Can we preserve *any* sense of "should" (e.g., practical rationality, well-being) without moral facts? If yes, criticism might be rebuilt there.

  ### 6. **Framework Relativism / (Indexical or Contextual Relativism)**
      *   **Core:** Moral statements *are* truth-apt, but their truth is *relative to a specific moral framework*. "Slavery is wrong" is true *relative to framework F* (e.g., Utilitarianism, Kantianism, or even "Contemporary Liberal Western Ethics") and false *relative to framework G* (e.g., "Antebellum Southern Slaveholder Ethics"). Like "tall" is true relative to jockeys, false relative to NBA players. There's no "tall simpliciter."
      *   **Defensible?** Sophisticated and debated (e.g., Gilbert Harman, David Wong). Can explain disagreement without denying truth-aptness. **Major Challenge:** Justifying the choice of framework itself without appealing to something universal/objective. Why prefer Framework F over G? Also, self-refutation risk (see below).
      *   **Blocks Outsider Criticism?** **Depends.** *If* the outsider uses a *different* framework, their criticism ("Wrong relative to *my* F!") might be *true* but irrelevant/unpersuasive to the insider using G. *However*, if the outsider can argue *within* the insider's framework G (e.g., "Your caste rules violate your *own* religious principles of compassion"), criticism is possible. Outsiders *can* judge relative to their *own* framework, but it lacks force across frameworks. Real barrier is *persuasion across frameworks*, not logic.
      *   **Common View?** Uncommon explicitly. Philosophers' territory. The *intuition* that "it depends on your perspective" points here, but people rarely articulate the framework concept.
      *   **Moral Progress?** **Possible within a framework:** Progress = better alignment with the standards of F (e.g., a society becoming more consistently utilitarian). **Problem:** Progress *in changing frameworks* (e.g., shifting from Divine Command to Human Rights) is harder to justify *as progress* without a meta-framework. Why is F2 *better* than F1? This risks smuggling or infinite regress.
      *   **Mind-Changer:** **Self-Refutation Test:** Apply relativism *to itself*. Is "All moral truth is framework-relative" itself only true *relative to a specific framework* (e.g., Relativist Framework R)? If so, why should someone using framework A (which says moral truth is absolute) accept it? If it's *absolutely true* that all moral truth is relative, that's a contradiction. **Framework Choice:** Argue that we *do* evaluate frameworks (e.g., for consistency, coherence with facts, promoting well-being). This suggests a meta-standard, undermining pure framework relativity.

  **Key Failure Points in Your Framing/Reasoning:**

  1.  **Conflating "Cannot Judge" with "Cannot Persuade":** Many relativist positions make *persuasive* cross-cultural criticism difficult, but not *logically impossible*. Framework relativism especially shows criticism *can* be valid relative to the critic's standard; the barrier is getting the *target* to accept that standard. Your friend might be confusing the difficulty of *effective* criticism with its *legitimacy*.
  2.  **The Moral Progress Smuggling Dilemma:** This is the hardest spot. Almost every account of "internal" moral progress (within a culture/framework) either:
      *   **A.** Relies on the culture/framework *having* standards that the new state better fulfills (e.g., "We're living up to our Christian ideals better now"). This avoids smuggling *external* universals but risks circularity ("progress is defined by whatever wins").
      *   **B.** Implicitly appeals to something *outside* the current cultural norms to justify *why* the change is progress (e.g., reduced suffering, increased autonomy) – which starts looking universal. Pure relativism struggles with condemning a culture becoming *more* oppressive by its *own new* standards.
  3.  **Self-Refutation:** Any strong relativist claim ("All truth is relative") risks undermining itself. If it's absolutely true, it's false. If it's only relatively true, why accept it? This is a major hurdle for MCR, Individual Relativism, and especially Framework Relativism applied to itself.
  4.  **"Culture" as Monolithic:** MCR often fails because cultures are diverse and contested. Who defines the "cultural standard"? The powerful? The reformers? The texts? This ambiguity makes applying MCR messy.

  **Take this back:** Ask your friend *which* version of "morality is relative" she means. Force the distinction between the truism (Descriptive) and the strong claims (MCR, etc.). Press hardest on the Moral Progress and Internal Reformer problems – these expose the tension in using relativism to shield practices from criticism while likely believing in progress elsewhere. Point out that even Framework Relativism allows her to judge caste rules *by her own standards*; it just can't *force* that standard on others logically. The real debate might be about *which* standards (suffering? autonomy? tradition?) are the best ones to use for cross-cultural evaluation, not whether evaluation is possible at all.
