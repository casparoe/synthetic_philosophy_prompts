  Okay, the user is having a debate with their friend about whether outsiders can criticize cultural practices like caste systems or gender norms. The friend keeps shutting down the argument by saying "morality is just culture" and that it's all relative. The user feels this statement is vague and wants a breakdown of the different interpretations of moral relativism. They want a menu of options, each analyzed for defensibility, whether it prevents outsider criticism, and how common each view is. They're also particularly interested in whether moral progress is possible without universal standards.

  First, I need to recall the main types of moral relativism. There's descriptive relativism, which is just an observation that moral practices vary. Then there's metaethical relativism, which includes cultural relativism and individual relativism. Also, there's expressivism and error theory. The user mentioned the indexical idea, so that's probably the framework-relative view like in speaker relativism or assessment relativism.

  The user wants each version checked for defensibility, whether it blocks outsider criticism, and if regular people mean that version. They also want to know about moral progress without universal standards. For each type, I should address if moral progress is coherent within that framework. For example, in cultural relativism, progress might be defined as alignment with cultural ideals, but that could be circular if the ideals themselves change.

  They also want arguments or examples that could challenge each reading. For instance, for cultural relativism, pointing out internal reformers might show that criticism can come from within, but the relativist might say those reformers are part of the culture. But if the reformer appeals to universal principles, that might undermine relativism. The user’s deeper need seems to be finding a way to justify cross-cultural criticism without relying on absolutism, maybe seeking a middle ground.

  I should also note where the reasoning might fail. For framework relativism, self-refutation is a problem. If all moral claims are relative, then the claim "moral relativism is true" could itself be relative, leading to inconsistency. The user mentioned this, so it's important to highlight.

  Another point is moral progress. The user is stuck on whether a culture can have progress without borrowing universal standards. In cultural relativism, progress is possible if the culture's own standards evolve, but that might not satisfy the user because the standards themselves aren't critiqued. Expressivism doesn't allow for objective progress at all. Framework relativism might allow progress as consistency with a framework, but again, the framework's validity isn't questioned.

  Common misconceptions: Most people who say "morality is relative" probably mean descriptive relativism but use it to justify metaethical relativism. Or they might conflate cultural relativism with tolerance, not realizing that relativism itself doesn't mandate tolerance.

  For each type, I need to be concise but clear. Provide the defensibility, whether outsider criticism is blocked, commonality, moral progress possibility, and a mind-changing argument. Also, flag potential failures in reasoning, like self-refutation or smuggling in universal values.

