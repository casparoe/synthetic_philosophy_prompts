prompt: |-
  So I was arguing with my friend last night about whether outsiders can ever legitimately criticize practices like strict caste rules or gender norms in other societies. Everytime I pushed back and said some things are just wrong regardless of culture, she shut it down with "morality is just culture - there's no universal standard, its all relative." She used it like a conversation ender, but I feel like that one sentence is smuggling in like five different philosophical positions and I want them separated out.

  Can you lay out the precise readings of "morality is relative" as a menu? I mean everything from the boring truism that cultures have different customs, to the claim that moral language is just emotional expression, to that indexical idea where "slavery is wrong" is always true but only relative to a framework (like "tall for a basketball player"). For each one, tell me if its actually defensible, if it gets her the conclusion that outsiders can't judge, and whether regular people who say this usually have that version in mind. I'm especially stuck on whether any version allows for real "moral progress" inside one culture without secretly borrowing universal standards - I go back and forth on whether that's coherent or just smuggling.

  Also please say exactly what argument or example would change your mind about which reading is strongest, and flag where your reasoning is most likely to fail - maybe in how I'm framing cross-cultural judgment, or in whether framework-relative moral claims avoid self-refutation when applied to themselves. No need for citations or a reading list, I just need the disambiguation with verdicts. And definatly don't just pick one reading and defend it - I want the full spread so I can take it back to her.
