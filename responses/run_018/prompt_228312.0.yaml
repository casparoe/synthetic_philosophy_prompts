  7. **General Objection on Policy**: Hume's distrust of government managing money. Reply with Hume's preference for metallic money's automaticity. Soft spot: reconciling with active policy.

  The worst unasked question: How Hume's view of human nature (passions over reason) affects his trust in monetary policy. This could undermine the policy recommendation, as Hume was skeptical of human rationality in governance.

