prompt: |-
  Act as an expert on 18th-century political economy and the history of monetary thought -- someone who reads Hume closely but also speaks fluent modern macro. Next week I'm presenting a conference paper arguing that Hume's essays "Of Money" and "Of the Balance of Trade," read together, commit him to a genuinely non-neutral view of money: the gains from an increasing money supply are real but only exist in the interval before prices catch up, so on my reading Hume is a proto-monetary-non-neutralist who thinks slow, steady monetary expansion is good policy for a growing economy, NOT the dry quantity theorist of the textbooks. My one worry I keep circling is "Of Interest," where he seems to deny money does any real causal work at all.

  The audience: mostly historians of economic thought, including two real Hume specialists, plus three or four modern monetary economists who tend to show up to these things, and one famously grumpy Adam Smith scholar who loves a fight.

  Prep me for the Q&A. Start with a short brainstorm of the fault lines in my reading -- where is it actually exposed vs. just unfashionable -- then give me the seven objections I'll actually get from THIS crowd (not generic grad-seminar objections), ordered by how much damage they'd do, each phrased the way that person would phrase it, with a two-minute reply and a honest note on where the reply is soft. End with the question I'm hoping nobody asks.
reasoning: |-
  Okay, the user is preparing for a conference Q&A on their paper about David Hume's monetary views. They argue that Hume, particularly in "Of Money" and "Of the Balance of Trade," supports monetary non-neutrality and that slow, steady monetary expansion benefits a growing economy. Their main concern is reconciling this with "Of Interest," where Hume seems to contradict this by denying money's real effects.

  First, I need to assess the user's position. They're positioning Hume as a proto-monetary-non-neutralist, which challenges the textbook view of him as a strict quantity theorist. The audience includes Hume specialists, historians of economic thought, modern monetary economists, and a contentious Adam Smith scholar. Each group will have different concerns.

  The key fault lines in their argument: First, reconciling "Of Interest" with the other essays. Hume explicitly states that money is neutral in the long run and that interest rates are determined by real factors. How does the user explain this? They might need to focus on the transition period or Hume's policy implications versus theoretical statements.

  Second, Hume's mechanism for the non-neutral effects. He describes a stimulus effect where increased money supply boosts demand before prices rise. But does this imply active policy? Hume might have seen this as a one-time adjustment, not a prescription for ongoing expansion.

  Third, Hume's views on policy. He warns against paper money and inflation, which seems at odds with advocating for steady expansion. The user must clarify that Hume's support is specific—only for metallic money in growing economies, not discretionary central banking.

  Fourth, distinguishing Hume from mercantilists. Hume criticizes them for conflating money with wealth, but the user's interpretation might make Hume sound similar. They need to emphasize that Hume's non-neutrality is temporary and tied to real growth, not perpetual money accumulation.

  Now, anticipating objections from each group:

  1. **Hume Specialists**: They'll point to "Of Interest" directly. The user should acknowledge the tension but argue that Hume's policy advice in other essays implies practical non-neutrality. The soft spot is that Hume didn't explicitly link his policy views to non-neutrality.

  2. **Modern Monetary Economists**: They might question the relevance, noting that Hume's metallist context differs from modern fiat systems. The reply should frame Hume as anticipating transmission mechanisms. The weakness is the lack of formal models in Hume.

  3. **Smith Scholar**: They'll bring up Smith's critique of Hume on interest rates. The user must differentiate Hume's short-term vs. long-term views and cite Smith's later concessions. The soft spot is that Hume didn't clearly separate the phases.

  4. **Historians of Thought**: They may argue the user is anachronistic, projecting modern ideas onto Hume. The reply should point to Hume's empirical observations and policy stance. The risk is over-interpreting Hume's intentions.

  5. **Another Historian**: Might claim the user ignores Hume's warnings about inflation. The response should clarify that Hume supported gradual expansion aligned with real growth. The soft spot is Hume's lack of explicit endorsement.

