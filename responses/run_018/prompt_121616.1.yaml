answer: |-
  ### Epistemology Final Exam Question (90 minutes)  
  **Answer ONE question. This question carries 20 marks.**  

  > **Williamson’s anti-luminosity and anti-KK arguments deploy structurally similar sorites series, but their critical premises differ.**  
  > (a) Precisely identify the *distinct* load-bearing premises required for each argument. Explain why the anti-KK argument may need an *additional* assumption about the subject’s introspective access (e.g., to their evidence) that the anti-luminosity argument avoids. (8 marks)  
  >   
  > (b) Assess whether "deferred luminosity" (where the subject knows *at t+δ* that C obtained *at t*) or "deferred KK" (where the subject knows *at t+δ* that they knew *p at t*) escapes Williamson’s margin-for-error reasoning. Address:  
  >   - Whether the temporal gap *δ* neutralizes the safety/margin requirement for beliefs about the past;  
  >   - Whether the *direction* of change in the series (e.g., warming vs. cooling) matters;  
  >   - Whether deferred knowledge of past states retains the philosophical value of luminosity/KK (e.g., for introspection or rational agency). (12 marks)  

  ---

  ### Model Answer (≈600 words)  

  **(a)** Williamson’s arguments share a sorites structure but rely on distinct premises. The **anti-luminosity argument** requires:  
  > (i) A series of cases where a condition (e.g., feeling cold) changes incrementally from clear obtaining (C₁) to clear non-obtaining (Cₙ).  
  > (ii) A *safety condition*: If S knows C obtains in case αᵢ, then C must obtain in all nearby cases αᵢ±₁.  

  Safety ensures knowledge requires a margin for error against small changes in the underlying state. In the marginal case αₖ where C *just barely* obtains, S cannot know it obtains because αₖ₊₁ (where C fails) is too close—violating safety.  

  The **anti-KK argument** requires:  
  > (i) A series of cases ordered by *evidential strength* (e.g., increasing fake barns).  
  > (ii) A *discrimination premise*: In the marginal case αₖ, S cannot discriminate between αₖ (where S knows *p*) and αₖ₊₁ (a nearby case where S’s belief is unsafe/false).  

  Critically, anti-KK needs an *additional* assumption: S’s knowledge *that they know p* depends on discriminating their total evidence from that in αₖ₊₁. Unlike luminosity—where the condition (cold) is directly tied to the subject’s state—KK requires S to introspectively access whether their evidence suffices for knowledge. This introspective access claim is vulnerable to error in evidential near-misses, making anti-KK arguably *weaker*: it inherits safety’s constraints *and* assumes a discriminatory capacity that may fail independently.  

  **(b)** Deferred theses *partially escape* Williamson’s reasoning but lose key value:  
  - **Temporal delay bypasses safety for past beliefs**: Safety for beliefs about *past* states (e.g., “I felt cold at *t*”) does not require robustness against *present* changes. At *t+δ*, S may occupy a “clear” epistemic state (e.g., warmth), allowing safe belief about *t*’s coldness if memory/reliability conditions hold. This neutralizes the sorites by decoupling the evaluation time from the target state’s instability.  
  - **Directionality matters**: Deferred luminosity works best if the series moves *toward clarity* (e.g., warming from cold to warm). If S is *cooling* at *t*, deferred knowledge at *t+δ* (when colder) remains unsafe—nearby past cases may be too similar. Thus, deferred success depends on the series’ trajectory relative to *δ*.  
  - **Escaped, but at what cost?** Deferred theses abandon the *immediate* access luminosity/KK promised. Luminosity was meant to ground incorrigible self-knowledge for rational deliberation; KK secured iterative knowledge for higher-order reasoning. Deferring knowledge to a “clear” later time severs this real-time link. If I only know *yesterday* that I was cold (or knew *p*), I cannot use that knowledge *today* to adjust my sweater or my inquiry. The deferred view thus saves a hollow shell of luminosity/KK, losing the introspective transparency that made them desirable.  

  ---

  ### Marking Scheme (20 total)  
  **A (17–20):**  
  - (a) *Explicitly contrasts* safety (anti-luminosity) with discrimination+introspection (anti-KK); notes KK’s extra burden (5/8).  
  - (b) Explains *why* temporal delay evades safety for past beliefs; analyzes directionality; argues deferred theses lose real-time agential value (10/12).  

  **B (13–16):**  
  - (a) Correctly identifies both premises but underdeveloped on why anti-KK needs "extra" (e.g., misses introspection link) (4/8).  
  - (b) Notes deferred escape via temporal gap but superficial on directionality/value; may claim deferred KK is "just as good" without critique (8/12).  

  **C (10–12):**  
  - (a) Describes premises but conflates them (e.g., "both use safety") (3/8).  
  - (b) Claims deferred theses work (or fail) uniformly; ignores safety’s temporality; no engagement with value (5/12).  

  **D (7–9):**  
  - (a) Only summarizes one argument; vague on premises (2/8).  
  - (b) Misses temporal mechanism; asserts "safety still applies" without argument (3/12).  

  **Common pitfalls:**  
  - (a) *Screws up*: Treats anti-KK as identical to anti-luminosity. Ignores the role of evidence discrimination.  
  - (b) *Screws up*: Assumes safety for past beliefs works identically to present beliefs. Fails to critique whether deferred knowledge meets luminosity/KK’s original goals.
