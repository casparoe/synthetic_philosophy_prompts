prompt: |-
  I'm on the clinical quality-review board at a mid-size hospital, and we get about four adverse-event reports a week where the harm involved something staff didn't do — didn't escalate vitals, didn't reorder a med, didn't document a refusal. I have maybe fifteen minutes per file, and I need to sign off whether that omission gets listed in our internal report as a contibuting causal factor. Right now people just argue; there's no fowchart.

  Can you turn the philosophy of causation-by-omission into an actual decision procedure I can run? I want it in steps in order: what I check first, what counts as passing each step, where it stops with a hard no, and where it has to hand off to a human judgment call because the issue is values or ambiguity rather than fact. Keep the distinctions that actually matter for sign-off — counterfactual dependence, whether the omitted act was in the binding protocol (not just best practice), and what to do when two people both failed to act — but drop metaphysical baggage that doesn't change the checkbox. Then apply it to three cases: (1) a nurse doesn't escalate abnormal vitals and the patient codes; (2) a physician skips an imaging study that's best practice but not in the current pathway, and the patient dies of something that image wouldn't have caught in time anyway; (3) two nurses each assume the other verified a dosage, and the wrong drug is given. Make sure one of these gives me an answer I won't like. Also say flat-out what the procedure can't do — assigning blame, resolving protocol ambiguity, etc.

  Please separate what's pretty settled in omission philosophy from what's genuinely contested (for instance, whether omissions need normative expectations or can be purely counterfactual). Don't present one contested side as the consensus. Keep the whole response under 450 words — I have to paste it into a form. There might be a typo or two in this prompt, but I wrote it quick between meetings.
reasoning: |-
  Okay, the user is on a clinical quality-review board and needs a practical decision procedure for determining if an omission caused an adverse event. They handle about four reports a week and have only 15 minutes per file. Currently, there's no flowchart, just arguments among staff. They want a step-by-step process that filters cases efficiently, focusing on key factors like counterfactual dependence and binding protocols, not best practices. They also want to know where human judgment is necessary.

  First, I need to recall the philosophy of causation-by-omission. The key elements are counterfactual dependence (would the harm have occurred if the action was taken?) and normative expectations (was there a duty to act based on protocols?). But the user wants to avoid metaphysical debates, so I should stick to settled aspects. Settled points include that omissions require a duty to act and counterfactual dependence. Contested areas might include whether moral obligations alone (without protocols) are enough, but the user specified binding protocols, so that simplifies things.

  The decision procedure should have clear steps. Start with the most objective filters to quickly eliminate cases. Step 1 could check if there was a binding protocol in place. If not, it's a hard no. Step 2: counterfactual dependence. If performing the action wouldn't have prevented harm, no causation. Step 3: duty assignment when multiple people are involved. If it's unclear who was responsible, it might require human judgment. Step 4: cases where both steps 1 and 2 pass but there's ambiguity in protocols or other factors, leading to human review.

  Now, applying to the three cases. Case 1: Nurse didn't escalate abnormal vitals, patient coded. Binding protocol exists (escalation required), and if escalation would have prevented the code, then it's a yes. Case 2: Physician skipped imaging that's best practice but not in the pathway. No binding protocol, so hard no per step 1, even if it might have helped. Case 3: Two nurses each assumed the other verified dosage. Binding protocol exists (verification required), counterfactual dependence (if verified, error caught). But duty assignment is split. Here, both had a duty, so causation is yes, even though the user might not like holding both responsible. This addresses their request for an answer they won't like.

  The procedure can't assign blame, resolve protocol ambiguities, or handle cases where harm was inevitable. Those require human judgment or policy decisions. Also, it can't address if protocols are outdated, only if they were binding at the time.

  Need to ensure the steps are in order, concise, and under 450 words. Highlight where judgments are needed. Separate settled vs. contested: settled is counterfactual dependence and binding protocols; contested is whether non-protocol duties (like moral) suffice, but the procedure uses protocols as the standard.
answer: |-
  Here's a causal omission decision procedure for quality review sign-off, based on settled philosophical/legal principles and practical constraints. Target: "Contributing Causal Factor" (CCF) listing.

  **Decision Procedure (Run Steps Sequentially):**

  1.  **Binding Duty Check:** Was there a **specific, binding protocol/policy/job requirement** in effect *at the time* mandating the omitted act for *this* patient in *this* situation? (e.g., "RN must escalate vitals outside X range per Policy Y").
      *   **Pass:** Proceed to Step 2.
      *   **Fail:** **Stop. Hard NO (Not CCF).** (Best practice/guideline alone fails here).
      *   *Handoff:* Ambiguity in protocol applicability/interpretation? → **Human Judgment (HJ)**.

  2.  **Counterfactual Dependence Check:** Is it **more likely than not** that performing the omitted act *as required by the binding protocol* would have *prevented or substantially mitigated* the specific harm that occurred? (Focus on sequence/timing).
      *   **Pass:** Proceed to Step 3.
      *   **Fail:** **Stop. Hard NO (Not CCF).** (Harm inevitable regardless).
      *   *Handoff:* Uncertainty about counterfactual outcome despite known facts? → **HJ**.

  3.  **Clear Duty Assignment Check:** Was the duty *unambiguously assigned* to a specific role/individual *at the relevant time*?
      *   **Clear Assignment:** **YES (CCF)**. (Omission causally contributed).
      *   **Unclear/Dual Assignment:** Proceed to Step 4.
      *   *Handoff:* Genuine ambiguity about *who* held the duty? → **HJ**.

  4.  **Plausible Shared Duty Check:** Is it plausible that *each* potentially responsible agent/role identified in Step 3 had a *binding duty* relevant to preventing the harm *and* the omission(s) occurred?
      *   **Plausible:** **YES (CCF)**. (System/dual failure contributed).
      *   **Not Plausible:** **NO (Not CCF)**.
      *   *Handoff:* Complex system factors muddying duty? → **HJ**.

  **Settled vs. Contested:**
  *   **Settled:** Omission causation requires (1) a **duty to act** (here, defined by binding protocol), and (2) **counterfactual dependence** (act would likely have prevented harm). These are core to legal/medical liability models.
  *   **Contested:** Whether causation *can ever* be purely counterfactual *without* a prior normative duty (e.g., just "should have known"). This procedure **requires** a binding duty (Step 1).

  **Case Applications:**

  1.  **Nurse skips vitals escalation → Patient codes.**
      *   Step 1: Pass (Protocol exists).
      *   Step 2: Pass (Escalation likely triggers intervention preventing code).
      *   Step 3: Pass (Clear RN duty). → **YES (CCF)**.

  2.  **Physician skips imaging (best practice, not pathway) → Death (image wouldn't have helped in time).**
      *   Step 1: **Fail** (Best practice ≠ Binding protocol/pathway). → **Hard NO (Not CCF)**.

  3.  **Two nurses each assume other verified dosage → Wrong drug given.**
      *   Step 1: Pass (Protocol requires independent verification).
      *   Step 2: Pass (Verification would have caught error).
      *   Step 3: Fail (Duty shared/unclear assignment → Step 4).
      *   Step 4: Pass (Plausible both had binding duty to verify; dual omission occurred). → **YES (CCF)**. *(You won't like this - implies system/dual failure)*

  **What This CANNOT Do:**
  *   Assign individual blame or disciplinary action.
  *   Resolve ambiguity in protocols (only apply them).
  *   Determine if protocols are *good* or *current*.
  *   Handle cases where harm was truly inevitable ("but-for" fails).
  *   Address purely moral obligations absent a protocol.
