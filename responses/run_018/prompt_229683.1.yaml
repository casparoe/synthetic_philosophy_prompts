answer: |-
  ## Research Proposal: Democratic Backsliding – Concept or Cudgel?

  Thank you for considering my application for this fellowship. As a journalist covering science and ideas, I’ve been increasingly preoccupied by the term "democratic backsliding." It dominates discourse about nations as diverse as Hungary, Poland, Turkey, and, alarmingly, the United States. Yet, beneath the surface of widespread usage and reliance on standardized democracy indices, a fundamental conceptual question remains unresolved, hampering both our understanding and our response. My proposed book-length essay aims to directly confront this core ambiguity: **Is "democratic backsliding" a concept with identifiable, politically neutral analytical content, or is it primarily a partisan label deployed strategically under the guise of objective measurement?**

  Existing discussions, while voluminous, often sidestep this foundational question. Major democracy indices – valuable tools for longitudinal comparison – are frequently cited as definitive proof of backsliding. However, this practice masks a critical vulnerability: these indices themselves embed specific, contestable conceptions of democracy. They operationalize democracy through metrics like free elections, civil liberties, checks and balances, and pluralism. While these are widely *aspirational*, their precise weighting, interpretation, and the thresholds for "backsliding" are inherently normative. When critics point to declining scores in Hungary or Poland, or warning signs in the US, they implicitly invoke the index's underlying definition. Supporters of the regimes in question, however, often reject these assessments not merely as inaccurate data points, but as reflective of a definition they fundamentally disagree with – perhaps prioritizing majoritarian will, national sovereignty, or traditional values over liberal pluralism. The indices are treated as neutral arbiters, but their scaffolding rests on unstated and contested philosophical ground. This leaves the conceptual status of "backsliding" wide open; it functions *as if* it has objective content because the indices provide numbers, yet the meaning of those numbers depends entirely on accepting the index's implicit baseline definition of democracy. The debate then often collapses into competing accusations of bad faith or biased measurement, rather than grappling with the prior question of *what we are even measuring against*.

  My project will take a different approach, moving beyond defending the indices wholesale or dismissing the concept of backsliding as mere rhetoric. Instead, I will rigorously test the proposition that **"democratic backsliding" is conceptually parasitic on an assumed, but rarely articulated, baseline of "full democracy."** The crucial task, then, is to interrogate what, if anything, can anchor this baseline in a way that is not simply a reflection of one side’s political commitments in the very disputes where the term is deployed.

  To make progress, I propose a conceptual investigation structured around probing the potential anchors for this baseline:

  1.  **Formal Institutional Anchors:** Can the baseline be found solely in a minimal set of formal procedures – regular elections, a written constitution, separation of powers? The challenge here is that backsliding often occurs *through* the manipulation of these very forms (e.g., constitutionally compliant illiberalism in Hungary, gerrymandering and procedural hardball in the US). If the forms remain but their liberal-democratic spirit is hollowed out, does the baseline still hold? This approach risks missing the substance of democracy while clinging to its shell.
  2.  **Functional Anchors:** Should the baseline focus on outcomes – the protection of minority rights, the presence of genuine political competition, the accountability of power? This seems closer to the concerns motivating the term "backsliding." However, defining these functions neutrally is immensely difficult. Who defines "genuine" competition or "adequate" protection? These functional criteria seem to smuggle in substantive political values that are precisely what is contested in places like Turkey or Poland.
  3.  **Proceduralist Anchors (Beyond Form):** Could a baseline be anchored in deeper procedural principles like political equality or public reasoning, as suggested by certain democratic theorists? The question becomes operational: How do we measure a decline in political equality or the degradation of public reason in a way that isn't itself a political judgment? Observing the erosion of norms of forbearance or the rise of disinformation as a political tool (evident in the US context) points to this, but quantifying or neutrally certifying such erosion is fraught.
  4.  **Popular Sovereignty Anchors:** Is the ultimate anchor simply the consistent will of the people, however expressed? This risks justifying illiberalism if a majority supports it, seemingly contradicting the core concern of backsliding discourse, which often highlights how majorities can be manipulated or empowered to undermine democratic resilience. Events in Poland, where judicial independence is attacked under a popular mandate, starkly illustrate this tension.

  Through this structured inquiry, using examples like Hungary's media control, Turkey's post-coup purges, Poland's judicial reforms, and US norm erosion not as scored cases but as illustrative challenges to each potential anchor, I aim to reach one of several determinate conclusions:

  *   **Conclusion A (Concept Rescued):** A specific anchor (or combination) *can* be identified that provides a robust, minimally contested baseline for "full democracy," independent of specific policy disputes. Backsliding then has analytical content as deviation from this anchor. (I suspect this is difficult, but possible anchors might be found in a core commitment to political equality or non-domination).
  *   **Conclusion B (Concept Contextual):** A stable, universal baseline is impossible, but "backsliding" retains analytical meaning *within* specific, coherent, and internally consistent conceptions of democracy. The key is transparency: we must explicitly state the conception being used as the baseline when invoking backsliding. The term isn't neutral, but it's not *merely* rhetorical; it’s relative to a chosen definition.
  *   **Conclusion C (Concept Rhetorical):** Every plausible anchor either collapses into a specific contestable ideology or is so thin as to be useless for identifying meaningful backsliding. The term primarily functions as a partisan accusation, leveraging the perceived authority of measurement (via indices) to discredit opponents. Its widespread use masks fundamental disagreement about democracy itself.

  Deciding between these conclusions hinges on rigorously assessing whether *any* proposed anchor can withstand two critical tests: **1. The Neutrality Test:** Can it be articulated and applied without presupposing the validity of one side's core political claims in a polarized dispute (e.g., the role of courts, the definition of rights, the boundaries of acceptable discourse)? **2. The Operationalization Test:** Can deviations from this anchor be identified through intersubjectively verifiable criteria that aren't themselves reducible to partisan interpretations of events? Failure to pass both tests strongly points towards Conclusion B or C.

  Failure for the project itself would be an inability to move beyond restating the problem or getting bogged down in defending/dismissing specific indices without illuminating the conceptual core. It would mean failing to provide a clear framework for understanding what is at stake when we use the term – either by confirming its fundamental ambiguity or by identifying a path towards clearer usage. Success is not necessarily finding a universally accepted baseline, but achieving conceptual clarity about the *kind* of claim "democratic backsliding" represents and the conditions under which it can be more than a weapon.

  Completing this ambitious conceptual inquiry within twelve months is challenging but feasible. It requires sustained focus on philosophical and theoretical arguments, using real-world examples strictly illustratively rather than as primary research subjects. My journalistic background in distilling complex ideas for a broad audience is crucial. I will not be conducting new empirical research or extensive country case studies. Instead, the work involves deep engagement with political theory, critical analysis of existing measurement frameworks, and the construction and testing of conceptual arguments. The fellowship period provides the necessary uninterrupted time for this demanding synthesis. The outcome will be a provocative and timely essay that moves beyond the surface debate to ask what we really mean when we fear democracy is slipping away, and whether that fear can be grounded in something more solid than our own political anxieties. It seeks not to score democracies, but to understand the scorecard itself.
