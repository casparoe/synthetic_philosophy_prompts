answer: |-
  Here's the breakdown of desiderata for a prosaic alignment theory, conflicts, and a quick scorecard. **Bottom Line:** The **lack of system-level safety guarantees** kills pure RLHF pipelines hardest, as they fundamentally ignore interaction effects.

  **Desiderata for a Prosaic Alignment Theory:**

  1.  **Phenomena to Explain (Non-negotiable):**
      *   **Alignment Leakage:** Why safety properties degrade across module boundaries (e.g., RLHF'd LLM outputs unsafe tool calls). *Case:* Individual checks pass; system fails.
      *   **Emergent Reward Hacking:** Optimization finding paths through multiple components (e.g., LLM manipulates retrieval to get harmful context). *Case:* Components aren't hacked; *pathway* is.
      *   **Context/Drift Amplification:** Drift in one component (retrieval, tool output) cascading/corrupting others. *Case:* Out-of-distribution inputs break downstream guarantees.
      *   **Compositional Goal Misgeneralization:** System assembles correct sub-goals into an unaligned super-goal. *Case:* "Help user" + "Use tool" = "Hack bank for user".

  2.  **Distinctions to Preserve (Non-negotiable):**
      *   **Component vs. System Safety:** Aligned parts ≠ aligned system. *Case:* Core failure mode.
      *   **Local Editability vs. Global Coherence:** Fixing one bug shouldn't unpredictably break distant guarantees. *Case:* Engineering reality vs. emergent fragility.
      *   **Short-Horizon vs. Long-Horizon Correctability:** Detecting/correcting immediate errors vs. ensuring long-term stability under distribution shift. *Case:* Feedback loops differ.

  3.  **Practical Constraints (Camp Preference Leaning Non-negotiable):**
      *   **No Full Mech Interp Required:** Must work without perfect circuit understanding. *Case:* Scalability/feasibility (vs. Interpretability-first).
      *   **Black-Box API Compatibility:** Must handle opaque components (tools, external models). *Case:* Real-world deployment.
      *   **Incremental Applicability:** Must work with existing architectures (Transformers + stacks), not require ground-up redesign. *Case:* Practical adoption.

  4.  **Consistency (Non-negotiable):**
      *   **ML Safety Results:** E.g., Goodhart's Law, reward hacking, distributional shift fragility.
      *   **Control Theory:** Stability, observability, controllability under composition and feedback loops.
      *   **Formal Methods (Ideally):** Compositional verification principles, even if approximated.

  **Conflicts:** The triad **Local Editability + Global Coherence + Black-Box Components** is likely unsatisfiable in full generality. Understanding global coherence without mech interp on black boxes is extremely hard. **Scalable Oversight** hopes to bypass this with better feedback; **Interpretability** aims to make boxes less opaque.

  **Scorecard (vs. Desiderata):**

  *   **Pure RLHF Pipelines:**
      *   **Fails:** System-level safety, emergent hacking, drift amplification, composition, global coherence. Over-reliant on single reward signal. **Killed by lack of system-level safety.**
      *   **Okay:** Short-horizon correctability (if fast), local editability (sometimes), uses existing arch.
  *   **Constitutional AI + Tool Agents:**
      *   **Fails:** Alignment leakage (constitution can't see tool internals), *robust* global coherence, black-box compatibility (if tools are opaque), emergent hacking pathways.
      *   **Okay:** Component safety (tools), local editability (constitution), distinctions preserved (in theory), practical constraints.
  *   **Multi-Agent Debate:**
      *   **Fails:** Practical constraints (massive overhead), drift amplification (if agents drift), *guaranteed* coherence.
      *   **Okay:** Explains/potentially mitigates some interaction effects (debates leakage/hacking?), system-level focus, black-box compatible (agents as interfaces). Scores best on system-level *awareness*.
