answer: |-
  Here’s a structured 50-minute seminar plan focused on conceptual clarity, misconception-busting, and your jazz pianist core example. The arc builds from foundational concepts to Ryle’s anti-intellectualist punchline, with targeted interventions against predictable misunderstandings.

  **Core Objective:** Students leave seeing knowing-*how* as *distinct in kind* from knowing-*that* – not just "unspoken rules," and grasp that *some* know-how resists decomposition.

  **Key Elements:**
  *   **Hook:** Embodied Skill (5 mins)
  *   **Foundation:** Propositions & Knowing-*That* (10 mins)
  *   **The Distinction:** Jazz Pianist Case Study (15 mins)
  *   **Deep Dive:** Non-Decomposability & Error-Correction (10 mins)
  *   **Synthesis, Check & Wrap:** Why It Matters & Limits (10 mins)

  ---

  **Seminar Plan:**

  **1. Hook: The Embodied Puzzle (5 mins)**
  *   **Activity:** "Show of hands: Who here can ride a bike? Okay, most. Now, *without using your hands*, *describe exactly* the micro-movements your right leg makes when you turn left at speed on a slight downhill. Be precise!" (Let them squirm/laugh).
  *   **Point:** Highlight the disconnect between smooth action and the struggle to articulate it. Introduce the seminar's core question: **Is all knowledge fundamentally knowledge *of facts*? Or is *doing* something knowing something *different*?**

  **2. Foundation: What is Knowing-*That*? (10 mins)**
  *   **Concept:** Define clearly: Knowing-*that* = propositional knowledge. It's about truth/falsity. "I know *that* Paris is the capital of France." "I know *that* 2+2=4." "I know *that* water boils at 100°C at sea level."
  *   **Characteristics:** Verbalizable (can be stated), truth-apt (can be true/false), potentially justifiable with evidence/reasons, often acquired through instruction/reading.
  *   **Check:** Ask for 2-3 examples *from philosophy* they've encountered (e.g., "I know *that* Descartes doubted his senses"). **Crucial:** Solidify that knowing-*that* is the traditional, dominant view of what "knowledge" *is*.

  **3. Introducing the Distinction: The Jazz Pianist (15 mins)**
  *   **Set-up:** "Meet our expert jazz pianist. She improvises fluidly over complex chord changes – think Coltrane's 'Giant Steps' level. She hears the harmony, responds creatively, makes it work beautifully... *BUT* if you point to a specific chord on the chart and ask 'What *is* this chord? Is it a D7#9b13 or an F#ø7 over E?', she genuinely cannot name it. She never learned the formal theory labels."
  *   **The Skill:** Emphasize:
      *   **Years of Embodied Practice:** Thousands of hours at the piano, *doing*, *listening*, *feeling*.
      *   **Error-Correction:** How did she learn? Trial and error. Hitting a "wrong" note that *felt* jarring against the bass, adjusting instantly, internalizing what "works" sonically and rhythmically *in context*. This feedback loop is *sensory-motor*, not primarily intellectual.
      *   **Real-Time Navigation:** The skill isn't recalling facts; it's an ongoing, adaptive *performance* responsive to the immediate musical environment (other players, feel, tempo).
  *   **The Question:** "Is she *ignorant*? Does she *not know* how to play over these changes? Or is this a *different kind* of knowing?"
  *   **Label:** Introduce Ryle's term: **Knowing-*How***. It's the *capacity* or *ability* to perform successfully.

  **4. Deep Dive: Tackling Misconceptions & Non-Decomposability (10 mins)**
  *   **Misconception 1 Head-On (Tacit Knowing-*That*):** "Hold on! Maybe she *does* know the rules, deep down? Maybe she has 'tacit knowledge' of music theory – she just can't say it? Isn't knowing-*how* just *fast* knowing-*that*?"
      *   **Counter:** "If it's tacit *knowledge-that*, what *specific proposition* is she acting on when she instinctively plays that perfect altered scale run over the V7 chord she can't name? Can you formulate it? Is it a single rule? A million tiny rules?" (Push them to try). "Her skill emerged from *correcting actions based on felt success/failure*, not from consulting or applying silent rulebooks. The *source* and *form* are different. Knowing-*how* isn't mentally running through silent facts at high speed."
  *   **Introducing Non-Decomposability:** "This leads to Ryle's crucial point: *Some knowing-how is genuinely non-decomposable.* Think about her navigating a complex improvised line. Can we break this single, fluid skill down into a set of discrete, independent 'sub-rules' she applies sequentially? Is there a separate 'knowing-that' for every possible harmonic context and rhythmic permutation? Or is it a *holistic capacity* – a single, integrated skill of 'musical responsiveness' honed through practice, where the 'parts' (finger movements, harmonic choices, rhythmic feel) only make sense *as part of the whole performance*? The skill *is* the ability to do *this complex thing* fluidly; it's not assembled from smaller propositional bits."
  *   **Misconception 2 Head-On (Verbalization=Understanding):** "But if she can't *say* what she's doing, does she *really* understand it? Isn't verbal articulation the mark of true knowledge?"
      *   **Counter:** "Does her *performance* demonstrate understanding? Does the *music itself* communicate understanding? Her inability to verbalize the harmonic theory doesn't negate her profound ability to *do the thing the theory describes*. Understanding shows up *in the successful action*, not necessarily in a propositional report about it. Demanding verbalization as the *only* mark of understanding privileges knowing-*that* as the only *real* knowledge – which is precisely the 'intellectualist legend' Ryle is attacking."

  **5. Synthesis, Check & Wrap (10 mins)**
  *   **Recap:** Briefly restate the distinction: Knowing-*that* (facts, propositions) vs. Knowing-*how* (capacities, skills). The Jazz Pianist embodies knowing-*how*: acquired through embodied practice/error-correction, exercised in real-time performance, potentially non-verbalizable.
  *   **The Crucial Check Question (Non-Decomposability):** "**Imagine trying to teach someone this jazz improvisation skill *solely* by giving them verbal instructions and propositional rules (no listening, no playing, no feedback). *Why* would this be fundamentally impossible, according to Ryle's view of non-decomposable know-how?**"
      *   **Target Answer:** They should identify that the holistic, context-sensitive, embodied nature of the skill (relying on real-time sensory feedback and integrated action) cannot be captured by or reduced to a finite set of discrete propositional rules. The "gap" between the rules and the successful performance can't be bridged without practice and error-correction building the *capacity*. (If they just say "skills aren't propositions," push for *why* it matters here).
  *   **Explicit Omission:** "Today, we've focused on establishing the distinction itself and this core idea of non-decomposable skill. We've *deliberately skipped* Ryle's famous regress argument against intellectualism (the 'intelligent action requires prior rule, which requires intelligent application...' infinite regress). That's a crucial part of his full case, but it's a separate argument building *on* this distinction. For today, grasp *this* distinction and the nature of the jazz pianist's skill."
  *   **Why It Matters:** "Why challenge the idea that all knowledge is knowing-*that*? Because it shapes how we understand intelligence, learning, expertise, and even what it means to be human. Ryle argues much of our intelligent behavior isn't 'ghostly' inner contemplation; it's embodied skill. Think about language use, social interaction, ethical judgment – are they *just* applying rules?"
  *   **Final Thought:** "Next time you effortlessly do something complex you can't fully explain – catch a ball, navigate a crowd, make a witty remark – ask yourself: Is this 'tacit knowing-that'? Or is Ryle pointing to something fundamentally different?"

  ---

  **Why this sequence works:**

  1.  **Starts with Intuition (Hook):** Leverages the common bike experience to make the problem tangible *before* theory.
  2.  **Builds Foundation (Knowing-*That*):** Essential for the contrast. Without a clear grasp of propositional knowledge, the distinction is meaningless.
  3.  **Presents Core Example (Jazz Pianist):** Introduced *after* knowing-*that* is established, allowing immediate contrast. Details (non-naming, embodied practice) are presented upfront.
  4.  **Immediately Combats Misconception 1 (Tacit Knowing-*That*):** Addressed *right after* presenting the example, preventing students from defaulting to this intellectualist cop-out. The pianist's inability to name chords is the perfect foil.
  5.  **Introduces Non-Decomposability as the Payoff:** Framed as the deeper consequence emerging from the jazz case and the critique of tacit knowledge. This is the seminar's intellectual climax.
  6.  **Combats Misconception 2 (Verbalization=Understanding):** Addressed *after* non-decomposability, as this misconception often arises when faced with skills that resist articulation. The pianist's *performance* is the counter-evidence.
  7.  **Check Question Targets the Hardest Point:** Forces application of non-decomposability to a novel instruction scenario, moving beyond simple definition recall.
  8.  **Explicit Omission:** Manages expectations and focuses the session. Acknowledging the regress argument avoids confusion and shows strategic planning.
  9.  **Connects to Bigger Picture:** Briefly hints at the wider implications without getting sidetracked.

  This structure ensures the jazz pianist isn't just another example but the engine driving the conceptual progression and the battle against intellectualist assumptions. Good luck!
