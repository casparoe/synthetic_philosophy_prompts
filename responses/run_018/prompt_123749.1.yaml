prompt: |-
  In several European and North American municipalities, participatory budgeting is structured not as a single preference-aggregation vote but as an iterative cycle: residents propose projects, small-scale pilots are funded provisionally, outcomes are evaluated against publicly agreed criteria, and the scheme is revised or discontinued in the next round, with participants described as co-inquirers rather than clients expressing fixed demands. Yet the governing legal framework typically treats the adopted annual budget as binding and does not permit continuous revision, confining the experimental loop to a preparatory phase. What conception of democratic legitimacy and of the status of social values does this hybrid arrangement presuppose? Does it require the Deweyan view that democracy is primarily a mode of collective inquiry in which norms and goods are experimentally constructed rather than pre-politically given, or can it be accommodated within a liberal-pluralist model that treats the process merely as a more accurate mechanism for revealing existing preferences? Furthermore, is the practice internally consistent: does the point of institutional closure—where experimentation ends and a binding decision is enforced—contradict the experimentalist rationale, or does it tacitly presuppose a separate, non-experimental source of authority? Finally, if the underlying experimentalist commitment were replaced by a straightforwardly aggregative or purely deliberative-democratic theory, what specific alterations to the budget cycle, the evaluation metrics, and the status of pilot projects would necessarily follow?
reasoning: |-
  Okay, the user has posed a complex question about participatory budgeting (PB) in European and North American municipalities. They're describing a hybrid model where experimental phases exist alongside rigid budget adoption. I need to unpack several philosophical layers: legitimacy theories, value ontology, institutional consistency, and counterfactual redesign implications.

  First, let's parse the hybrid arrangement. The "iterative cycle" with co-inquirers suggests Deweyan experimentalism - democracy as collective truth-seeking. But the "binding annual budget" reflects liberal proceduralism. This tension is core to the question. The user seems well-versed in political theory given terms like "pre-politically given" and "aggregative models." Probably an academic or policy analyst.

  On legitimacy: The setup implies a dual-source theory. The experimental phase gains input legitimacy through inclusive co-creation, while the closure moment provides output legitimacy via legal certainty. This isn't pure Dewey (which rejects fixed endpoints) nor pure liberalism (which distrusts epistemic democracy). It's pragmatic - borrowing epistemic benefits of experimentation while retaining liberal accountability.

  Regarding value ontology: The description of "publicly agreed criteria" emerging during pilots suggests values aren't pre-political. If preferences were fixed, you wouldn't need iterative refinement. This leans Deweyan, though the system stops short of full value constructivism by freezing the budget. The pluralist interpretation struggles here because why revise schemes if preferences are revealed?

  Internal consistency is the thorniest part. The experimentalist rationale clashes with arbitrary annual cutoffs. But in practice, closure may be necessary for coordination. This reveals a meta-commitment to stability over pure inquiry. The authority source is likely external - state sovereignty or legal positivism - making experimentation a tolerated sub-process.

  Now the counterfactual: Switching to aggregative theory would collapse the cycle into snapshot voting. No pilots, just bids. Deliberative purism might deepen co-inquiry but struggle with closure. Evaluation metrics would shift from adaptive indicators to either preference-intensity measures (aggregative) or discursive quality (deliberative). Pilots lose their testbed function.

  The user's unspoken concern might be whether this hybrid is sustainable or philosophically coherent. They may seek arguments for reforming the legal framework - or perhaps want ammunition to critique PB's compromises. I should acknowledge the tension without prescribing solutions, as their question is analytical.
answer: |-
  This hybrid arrangement reveals a sophisticated, contested conception of democratic legitimacy and social values—one that straddles Deweyan experimentalism and liberal-pluralist frameworks but cannot be fully reconciled with either. Let's break this down systematically:

  ### **1. Conceptions of Democratic Legitimacy & Social Values**
  - **Epistemic Legitimacy over Preference Aggregation**:  
    The process treats legitimacy as arising from *collective learning* rather than mere preference summation. By framing participants as "co-inquirers," it presupposes that **social values are dynamic and shaped through iterative experience**. Outcomes are evaluated against criteria *co-developed during the process*, rejecting the liberal-pluralist notion of pre-existing, fixed preferences. This aligns with Dewey’s view of democracy as "associated living" where norms are experimentally constructed.

  - **Hybrid Authority**:  
    Legitimacy derives from **two sources**:  
    (a) *Input legitimacy* from inclusive participation in the experimental phase, and  
    (b) *Output legitimacy* from the binding budget’s legal certainty.  
    This dualism implies that while values are malleable during inquiry, **stability requires institutional closure**—a concession to liberal governance.

  - **Value Ontology**:  
    Social values are treated as **provisional hypotheses** ("pilots") to be tested, not revealed preferences. The "publicly agreed criteria" for evaluation emerge *during* the process, suggesting values are context-dependent and revised through collective experience—a Deweyan stance incompatible with liberal-pluralism’s static preference hierarchies.

  ### **2. Internal Consistency: The Closure Dilemma**
  - **Contradiction with Experimentalism**:  
    The binding budget *does* undermine pure experimentalism. Deweyan inquiry rejects finality, viewing all decisions as fallible and open to revision. Enforced closure ("no continuous revision") **privileges stability over truth-seeking**, implying that democratic authority ultimately rests on non-experimental foundations (e.g., legal positivism or electoral mandates).

  - **Tacit Non-Experimental Authority**:  
    The endpoint presupposes an **external anchor of legitimacy**: typically, representative institutions (e.g., city councils) that convert experimental outputs into law. This reveals a **pragmatic compromise**: experimentalism operates within boundaries set by traditional liberal sovereignty. The "preparatory phase" is thus a *delegated* space of inquiry, not a sovereign one.

  ### **3. Alternative Theoretical Frameworks & Required Changes**
  If replaced by **aggregative** or **purely deliberative** models, the process would fundamentally reconfigure:

  | **Element**          | **Experimentalist Model (Current)**                     | **Aggregative Model**                                | **Deliberative Model**                               |
  |----------------------|--------------------------------------------------------|-----------------------------------------------------|-----------------------------------------------------|
  | **Budget Cycle**     | Iterative pilots → Evaluation → Binding adoption       | Single vote on final projects                       | Extended dialogue → Consensus → Binding adoption    |
  | **Pilot Projects**   | Essential for testing value hypotheses                 | Eliminated; only final proposals voted on           | Retained only as discussion catalysts               |
  | **Evaluation Metrics** | Dynamic, co-created criteria based on outcomes         | Fixed criteria (e.g., cost/benefit) pre-defined     | Procedural metrics (e.g., inclusivity, reason-giving) |
  | **Participant Role** | Co-inquirers shaping values through action             | Clients expressing fixed demands                    | Discursive reason-givers                            |
  | **Closure Mechanism**| Legally binding budget overrides ongoing experimentation | Vote = final decision; no revision                  | Consensus → binding, but open to new deliberation   |

  - **Aggregative Model Changes**:  
    Pilots become redundant, as preferences are assumed pre-formed. Evaluation shifts to technical cost-benefit analysis. The cycle collapses into a **one-shot vote**—e.g., residents rank static project lists. Binding decisions derive solely from the vote’s procedural legitimacy, with no iterative learning.

  - **Deliberative Model Changes**:  
    Pilots lose their experimental function, becoming mere illustrations for debate. Evaluation focuses on **discursive quality** (e.g., "Were all voices heard?"). Closure requires consensus or supermajority, but the binding budget could be reopened if new arguments emerge—rejecting rigid annual finality.

  ### **Conclusion: A Pragmatist Pluralism**
  This hybrid model embodies a **pragmatist-pluralist legitimacy theory**:  
  - **Experimentalism** is confined to the "discovery phase," accepting that values evolve through action.  
  - **Liberal authority** dominates the "institutional phase," ensuring decisiveness.  

  It neither fully embraces Dewey (due to closure) nor liberal-pluralism (due to dynamic value-formation). The tension arises because democratic systems must balance **adaptability** and **order**—a dilemma unresolved in theory. The arrangement’s coherence relies on treating experimental phases as *subsidiary* to sovereign authority, suggesting that while social values are constructed experimentally, their codification requires non-experimental, legal-rational foundations. Replacing experimentalism would strip PB of its transformative potential, reducing it to either preference counting or talk without tangible testing.
