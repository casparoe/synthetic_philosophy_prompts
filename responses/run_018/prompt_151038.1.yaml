answer: |-
  ### Desiderata for a Theory of Object Identity

  1. **Non-Collapse of Numerical Distinctness**  
     - **Desideratum**: The theory must allow two numerically distinct objects to share all qualitative properties (intrinsic and relational).  
     - **Motivating Case**: Black’s spheres in a symmetric space (two identical spheres, no background frame).  
     - **Negotiable**: No (non-negotiable for realists about distinct indiscernibles).  
     - **Jointly Unsatisfiable With**: Identity of Indiscernibles (II).  
     - **Fails For**: Strict Leibnizian II, Structuralism.  

  2. **Diachronic Identity Without Qualitative Grounds**  
     - **Desideratum**: The theory must account for persistent identity through symmetric changes lacking qualitative continuity or traces.  
     - **Motivating Case**: Swapping spheres in a traceless periodic loop (positions swap without qualitative differences over time).  
     - **Negotiable**: No (non-negotiable for dynamic indiscernibility scenarios).  
     - **Jointly Unsatisfiable With**: Bundle theories requiring qualitative persistence.  
     - **Fails For**: Strict Leibnizian II, Structuralism.  

  3. **Distinction Between Qualitative and Numerical Identity**  
     - **Desideratum**: The theory must explicitly separate "qualitative sameness" from "numerical identity" as distinct concepts.  
     - **Motivating Case**: Generalizing Black’s spheres to any context where duplicates are metaphysically possible.  
     - **Negotiable**: No (core to ontology).  
     - **Jointly Unsatisfiable With**: Reductionist views collapsing numerical identity to qualitative profiles.  
     - **Fails For**: Strict Leibnizian II.  

  4. **Frame-Independent Relational Properties**  
     - **Desideratum**: The theory must not rely on ungrounded relational properties (e.g., absolute space/time) for individuation.  
     - **Motivating Case**: Black’s spheres in relational space (no privileged reference frame).  
     - **Negotiable**: Yes (substantivalists may accept background frames; relationalists reject).  
     - **Jointly Unsatisfiable With**: Theories requiring asymmetric relations in symmetric contexts.  
     - **Fails For**: None (all scored theories can avoid frames; II avoids by denying distinctness).  

  5. **Bare Numerical Distinctness**  
     - **Desideratum**: The theory must permit two objects with no differentiating properties whatsoever.  
     - **Motivating Case**: Stronger Black variant: no intrinsic *or* relational differences.  
     - **Negotiable**: No (non-negotiable for anti-supervenience views).  
     - **Jointly Unsatisfiable With**: Identity of Indiscernibles.  
     - **Fails For**: Strict Leibnizian II, Structuralism.  

  6. **Symmetric Change Compatibility**  
     - **Desideratum**: The theory must accommodate symmetric processes (e.g., swaps) without asymmetric hidden variables.  
     - **Motivating Case**: Periodic sphere-swapping loop (diachronic symmetry).  
     - **Negotiable**: Yes (temporalists may require asymmetry; symmetrists reject).  
     - **Jointly Unsatisfiable With**: Theories demanding irreversible temporal markers.  
     - **Fails For**: Strict Leibnizian II, Structuralism.  

  ---

  ### Scoring Key Theories
  - **Strict Leibnizian Identity of Indiscernibles (II)**:  
    Fails desiderata 1, 2, 3, 5, 6. Requires qualitative differences for numerical distinctness, denying symmetric indiscernibles.  

  - **Haecceitism (Primitive Thisness)**:  
    Satisfies all desiderata. Grounds distinctness in non-qualitative haecceities, allowing symmetry and swaps.  

  - **Structuralism (No Bare Particulars)**:  
    Fails desiderata 1, 2, 5, 6. Individuates via structural relations, collapsing in symmetric cases.  

