answer: |-
  Here's the exam prompt, model answer, and marking scheme woven together as requested:

  ---

  **Exam Prompt:**  
  Drawing on the distinction between "ecological calibration" (moral norms that adaptively track concrete environmental pressures like resource distribution or group survival needs) and "coordination noise" (moral norms serving primarily as arbitrary but stable social equilibria, like specific hand-use taboos or ritual purity codes with no intrinsic functional link to external pressures), critically evaluate whether this separation successfully defends moral objectivity against the challenge posed by cross-cultural variation (particularly WEIRD vs. non-WEIRD patterns). Does distinguishing calibration from noise adequately preserve objectivity by grounding calibrated norms in "real" features of the world? Or does it merely relocate the core problem, requiring objectivists to demonstrate that ecologically calibrated norms are not merely evolutionarily *useful* but *genuinely correct* in a moral sense? Furthermore, explain precisely why the obvious failure of coordination noise to be objective (due to its arbitrariness) does not automatically rescue the objectivist position regarding calibrated norms. Your answer should engage deeply with the conceptual challenges raised by the distinction itself.

  **Model Answer (Approx. 700 words):**  
  The distinction between ecological calibration and coordination noise offers a sophisticated lens for analyzing cross-cultural moral variation, but it ultimately fails to decisively secure moral objectivity and may even sharpen the challenges objectivists face. While separating these types of norms clarifies *why* variation occurs, it doesn't resolve the fundamental metaethical dilemma concerning truth.

  On the surface, the distinction seems promising for objectivism. Ecological calibration suggests norms aren't *merely* subjective whims or cultural accidents; they are adaptive responses to objective features of the human predicament – scarcity, vulnerability, the need for cooperation within groups of specific sizes. Norms prohibiting gratuitous harm or enforcing fair resource distribution in times of famine appear calibrated to real-world constraints promoting group survival and cohesion. This contrasts starkly with coordination noise – arbitrary conventions like using the right hand for eating or specific food avoidances lacking nutritional basis. The arbitrariness of noise seems clearly non-objective; its justification is purely conventional and contingent on historical accident or path dependence. Recognizing noise as such seems to quarantine relativism: widespread variation in noise norms doesn't imply relativism about calibrated norms, just as variation in traffic laws (arbitrary coordination points) doesn't imply relativism about the wrongness of reckless driving (potentially calibrated to the objective danger). This separation appears to protect a core of objectively grounded moral norms.

  However, this protection is illusory. The core problem relocates squarely onto ecological calibration. Demonstrating that a norm is evolutionarily adaptive or functionally useful for group survival under specific ecological pressures does *not* establish its *moral* correctness. This is the crux of the evolutionary debunking argument applied specifically to calibrated norms. Natural selection favors traits enhancing survival and reproduction, not necessarily truth-tracking. A norm forbidding theft might be calibrated to resource scarcity, promoting group stability. But its adaptive success only shows it was *useful* for our ancestors' flourishing or their group's persistence in a specific context. It doesn't demonstrate that theft is *objectively wrong* in a mind-independent moral sense. The norm could be a useful fiction, a heuristic promoting cooperation that enhanced fitness, without corresponding to any moral fact. We could coherently say, "This norm against theft was highly adaptive for those groups, but it wasn't *really* morally binding." The functionality is descriptive (how things *are* or *were*), not prescriptive (how things *ought* to be). Objectivists need an independent reason to believe that adaptive success correlates with moral truth, a notoriously difficult task given that evolution selects for reproductive advantage, not moral insight.

  This is precisely why the obvious subjectivity of coordination noise fails to rescue the objectivist regarding calibrated norms. Noise norms are undeniably arbitrary and conventional; their variation clearly doesn't threaten objectivity because they never claimed it. Their failure to be objective is trivial and expected. The *real* threat to objectivity comes from the variation and evolutionary origins of the very norms (calibrated ones) that objectivists propose *are* candidates for objective truth. If the best candidates for objectivity – the calibrated norms – are ultimately explained by their contingent, fitness-enhancing utility in specific environments, rather than by their perception of mind-independent moral properties, then their claim to objectivity is undermined. The variation in calibrated norms (e.g., different conceptions of fairness in large-scale anonymous societies vs. small kin-based groups) mirrors their adaptation to different pressures, reinforcing the evolutionary explanation and casting doubt on their status as universal truths. The existence of noise doesn't mitigate this; it highlights that the *only* plausible candidates for objectivity (calibrated norms) are themselves products of a process that doesn't obviously track moral truth. Therefore, the distinction, while analytically useful, doesn't save objectivity; it forces objectivists onto the difficult terrain of bridging the is-ought gap specifically for calibrated norms, showing why adaptive utility entails moral correctness – a task arguably as challenging as defending objectivity without the distinction.

  **Marking Scheme:**  
  An outstanding response (A grade) will seamlessly integrate the distinction into a critical analysis of moral objectivity. Crucially, it will explicitly and effectively handle the evolutionary debunking argument *specifically in the context of ecologically calibrated norms*, explaining why demonstrating their adaptive functionality is insufficient to establish moral truth – it must articulate that evolutionary success selects for usefulness, not necessarily correspondence to mind-independent moral facts, creating a gap between descriptive utility and prescriptive authority. It will clearly explain why the arbitrariness and non-objectivity of coordination noise does *not* automatically bolster the case for objectivity in calibrated norms, demonstrating that noise norms were never serious candidates for objectivity, so their failure is irrelevant; the real threat lies in the evolutionary origins of the *calibrated* norms themselves, which variation shows are contingent adaptations, not necessarily universal truths. Furthermore, a top answer will convincingly show that grounding objectivity in calibration risks vicious circularity unless an independent normative standard is invoked – it will argue that simply pointing to a norm's adaptive function cannot justify it as morally correct without presupposing that "promoting survival/reproduction" *is* the ultimate good, which is itself a contested normative claim requiring justification beyond the evolutionary fact. A strong B grade answer will demonstrate a good grasp of the distinction and apply it competently to the question of objectivity. It will likely recognize that calibration offers a *prima facie* case for grounding norms in reality but also acknowledge the challenge of moving from functional utility to moral truth. It will mention that noise variation doesn't imply general relativism but may not fully articulate *why* this doesn't help the objectivist regarding calibration. It will touch upon the evolutionary origins challenge for calibrated norms but might not fully develop the specificity of the debunking argument against them or might state the circularity point less precisely. Lower grades will result from significant misunderstandings of the core distinction, conflating calibration and noise, failing to engage with the relocation of the problem onto calibrated norms, or not addressing why noise's non-objectivity isn't decisive, or offering only a summary of variation without deep metaethical engagement. Mere description of WEIRD vs. non-WEIRD findings without applying the calibration/noise distinction critically to the objectivity question will be insufficient for a high mark.
