answer: |-
  ## Research Proposal: Normative Fragility of Evidential Cooperation Under Ontological Disagreement in Large Worlds

  **1. Research Question & Precision:**  
  Does the normative force of *evidential cooperation* (the prescription to cooperate based on evidence about the actions of others) persist when agents share core structural similarities (reasoning architecture, preference structures) but fundamentally disagree on the ontological individuation of possible worlds (e.g., haecceitism vs. anti-haecceitism, qualitative vs. transworld-identity-based world-building, or differing logical frameworks like classical vs. paraconsistent)? Specifically:  
  *   **Under what formalizable conditions** (C) can agents (A and B), exhibiting structural similarity (S) but ontological disagreement (O), be normatively compelled by evidential decision theory (EDT) or functional decision theory (FDT) to cooperate in a one-shot Prisoner's Dilemma-like scenario where their actions provide evidence about each other's actions?  
  *   **Does cooperation under (S & O) retain the distinctive *evidential* character** found under shared priors/epistemic peerhood, or does it functionally collapse into a form of *bare coordination*, lacking the specific normative weight derived from shared evidential grounds?  
  The question has a determinate answer if we can establish necessary and sufficient conditions (C) for normative evidential cooperation under (S & O), or demonstrate that no such (C) exists without reintroducing de facto peerhood.

  **2. Gap in Standard Treatments:**  
  Existing frameworks for evidential cooperation (e.g., in Newcomb's problem, Parfit's Hitchhiker, or formalizations like the "Agent Simulates Predictor" problem) critically rely on shared assumptions:  
  *   **Shared Priors:** Agents agree on the probability space over possible worlds/states.  
  *   **Homogeneous Ontology & Logic:** Agents partition the possibility space identically and employ compatible logical rules for evidence updating and counterfactual reasoning.  
  *   **Epistemic Peerhood:** Agents recognize each other as equally rational and informed, justifying treating evidence about the other's action as directly relevant to one's own decision.  
  These assumptions break down under ontological disagreement (O). If A and B define possible worlds differently (e.g., A considers worlds individuated by object identity, B by qualitative profile), they lack a shared probability space. Evidence B has about A's action may not translate coherently into A's own ontological framework, undermining the standard evidential link. Current models presuppose ontological homogeneity, leaving the variant (S & O) unaddressed.

  **3. Proposed Method:**  
  A two-pronged approach combining conceptual analysis and targeted informal modeling:  
  *   **Conceptual Decomposition of "Peerhood":** Systematically dissect the epistemic and ontological presuppositions embedded in "peerhood" conditions within cooperation arguments (EDT/FDT). Identify which components are *strictly necessary* for the normative evidential link and which might be substitutable by structural similarity (S). Key concepts: shared possible worlds, common priors, mutual recognition of rationality, ontological commensurability.  
  *   **Informal Modeling under Ontological Fragmentation:** Construct simplified decision scenarios (modified PD/Newcomb variants) featuring two agents:  
      *   Possessing demonstrably similar decision algorithms (e.g., both implement FDT-like reasoning) and preferences (e.g., mutual payoff maximization).  
      *   Operating with explicitly divergent world-individuation schemas (e.g., Agent A: "Worlds are distinguished by specific object identities." Agent B: "Worlds are distinguished only by qualitative properties.").  
      *   Lacking a common prior or shared interpretation of evidence about each other's actions due to (O).  
      Analyze the agents' reasoning processes step-by-step within their respective frameworks. Can A coherently interpret evidence about B's *action* (as defined in B's ontology) within A's own ontology? Does B's predicted action (from A's perspective) retain evidential relevance for A's own choice, given the ontological mismatch? Model potential "translation rules" or bridging principles and assess their feasibility and normative force.

  **4. Criteria for Success & Failure:**  
  *   **Success:**  
      *   A defensible formalization of "structural similarity" (S) independent of shared priors/ontology.  
      *   A clear articulation of the conditions (C) under which evidential cooperation retains normative force under (S & O).  
      *   A **taxonomy of cooperation robustness**: Classify types of ontological disagreement (e.g., granularity mismatch, identity vs. qualia, logical divergence) and rank them based on the extent to which they disrupt normative cooperation. (e.g., "Cooperation persists under coarse-grained ontological mismatches if preferences align, but collapses under fundamental logical divergence.")  
      *   A characterization of whether cooperation under (C) remains distinctly *evidential* or devolves into bare coordination.  
  *   **Failure:**  
      *   Inability to formalize (S) without implicitly requiring substantial overlap in priors or ontology, effectively smuggling peerhood back in.  
      *   Demonstration that any plausible condition (C) strong enough to enable cooperation under (O) necessarily implies agents can reconstruct a shared evidential framework, negating the core premise of genuine ontological disagreement.  
      *   Showing that cooperation under (S & O) is either impossible or indistinguishable in normative character from simple coordination games lacking an evidential component.

  **5. Scope Assessment & Feasibility (One Semester):**  
  This project is ambitious but tractable within one semester *for foundational analysis and initial modeling*, provided scope is tightly managed.  

  *   **Likely Achievable:**  
      *   Precise articulation of the research question and critical gap analysis of standard frameworks.  
      *   Conceptual decomposition of peerhood conditions.  
      *   Development of 2-3 core informal models/scenarios illustrating ontological disagreement.  
      *   Initial analysis of reasoning within these models and identification of key barriers to cooperation.  
      *   Draft taxonomy outlining *types* of ontological disagreement and preliminary hypotheses about their disruptive potential.  
      *   Clear identification of whether results lean towards normative persistence or collapse for the analyzed cases.  
  *   **Likely to Expand Beyond Scope / High-Risk Areas:**  
      *   **Full Formalization:** Developing rigorous, general formal models (e.g., distinct probability spaces with mapping functions) is high-risk for one semester. The proposal focuses on *informal* modeling for conceptual clarity.  
      *   **Comprehensive Taxonomy:** Fully fleshing out and rigorously defending the ranking within the taxonomy across *all* plausible disagreement types is likely too broad. Focus will be on establishing the taxonomy's *structure* and analyzing 1-2 key types in depth.  
      *   **Exhaustive Exploration of Logical Frameworks:** Delving deeply into cooperation under fundamentally different logics (e.g., paraconsistent) is a significant sub-project itself. Initial work will likely focus on ontological/metaphysical divergence (qualitative vs. haecceitistic) as the primary case study.  
      *   **Full Defense of Normative Character:** Conclusively proving whether cooperation under (C) is "evidential" or "coordinative" may require more extensive meta-ethical analysis than time permits; a strong preliminary argument is the goal.  

  **Deliverable:** A paper presenting the conceptual framework, analysis of peerhood assumptions, informal models of cooperation under ontological disagreement, the proposed taxonomy of divergence types with preliminary robustness assessments, and a clear conclusion regarding the persistence or collapse of normative evidential cooperation under the specified (S & O) conditions. The focus will be on the *process* of investigation and the structure of the problem, not a pre-determined outcome.
