prompt: |-
  You are a professional metaphysician with expertise in philosophy of biology and personal identity. Think carefully, and begin by briefly brainstorming the possible structures of a philosophical stall—verbal, substantive, hidden empirical, cross-purposes, or bedrock intuition—before delivering your diagnosis.

  The debate over origin essentialism—whether you could have come from a different sperm and egg—has been static for decades. On one side, modal metaphysicians argue that the particular zygote from which you developed has its causal origin essentially, so different gametes would produce a numerically different person; they treat this as a direct consequence of modal logic applied to biological origins. On the other side, philosophers of biology reply that organismal identity is sustained by continuous metabolic and developmental processes, not by origin, and they cite chimerism, monozygotic twinning, and epigenetic reprogramming to show that the specific gametes are biologically inessential to the organism you now are. Both camps accept the same genetics, the same formal modal apparatus, and the same developmental data; neither denies the opponent’s premises, yet positions never shift.

  My working hypothesis is that the disagreement is not about biology or modality at all, but about what ‘you’ denotes—whether it tracks the biological organism (for which origin is accidental) or the metaphysical person (for which causal origin is fixed). Still, I wonder whether a hidden formal question is also doing work: perhaps the two sides are using different individuation conditions for diachronic identity, and they talk past each other because one applies an essentialist model to organisms and the other applies it to persons.

  Please diagnose the stall precisely. Is it verbal (about ‘essential’, ‘organism’, ‘person’), substantive but masked (about the correct formal conditions for diachronic identity), or a clash of bedrock intuitions about naturalness that neither side can argue for? In your answer, carefully distinguish between ‘gamete-essentialism’—the view that the specific haploid genomes are essential to you—and ‘causal-zygotic essentialism’—the view that only the particular diploid cell formed in that exact causal chain is essential, even if an identical genome could in principle arise elsewhere. Given your diagnosis, what, if anything, would count as progress: a biological discovery, a formal result in the logic of identity, a conceptual distinction that dissolves the question, or should we expect permanent impasse? Lead with your bottom-line diagnosis in the first sentence, then reason, with no preamble and no restatement of the question.
