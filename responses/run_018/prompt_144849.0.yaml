  Let me brainstorm possible stall structures as requested. First, verbal disputes: maybe they're using terms like "essential," "organism," or "person" differently. Second, substantive disagreements masked by surface agreement: perhaps different criteria for diachronic identity. Third, hidden empirical assumptions: maybe unexamined biological premises. Fourth, cross-purposes: talking past each other. Fifth, bedrock intuition clash: irreconcilable starting points.

