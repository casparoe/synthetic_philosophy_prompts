  hey im a retired chemisty who just got into philosphy and im stuck on guilt vs shame. i keep picturing them like two error-correction systems -- guilt is an internal loop, shame is an external ping from the network. but heres the thing: can a culture actually *choose* which one is its main moral emotion, or is it just evolutionary drift? write me a villanelle with two refrains: 'guilt is the loop that checks itself' and 'shame is the signal others send'. each tercet should try to flip the culture's setting, but the refrains keep pulling back, and in the final couplet they collide so the reader sees whether choice was ever possible. make it match the real anthropology (honor cultures vs guilt cultures) but dont name books or people -- i cant check citations. keep the rhyme scheme close but not robotic, and stick one typo like 'morral' inside the poem so it feels human. thanks!
