answer: |-
  Here’s a poem designed for your purpose—printed twice with subtle alterations, using a sparkler’s trail as the concrete image. The **bolded** words differ between versions. Orwell’s "revised memory" reading has the *first* set of bold words; Stalin’s "late composition" reading has the *second* set. The final line remains identical.  

  *(Version A: Orwell Reading)*  
  **Trace** the green spark’s comet-flight  
  —arc drawn through thirsty dark—  
  until the **thought** flares, sudden-red,  
  **mid-**spin, where no red shone.  
  Then say you saw it change its coat  
  before the night could hold  
  **that after-image**, sharp, unspooled…  
  But when? The gap forgets.  
  **Is** every when a finger pointing  
  **back**? The dark retains  
  one trail: a fuse that burned both hues  
  **and** wrote its own arrival.  
  *When isn’t written in the light.*  
  That never were and always are.  

  *(Version B: Stalin Reading)*  
  **Catch** the green spark’s comet-flight  
  —arc drawn through thirsty dark—  
  until the **sight** flares, sudden-red,  
  **now-**spin, where no red shone.  
  Then say you saw it change its coat  
  before the night could hold  
  **this after-image**, sharp, unspooled…  
  But when? The gap forgets.  
  **Are** every when a finger pointing  
  **out**? The dark retains  
  one trail: a fuse that burned both hues  
  **that** wrote its own arrival.  
  *When isn’t written in the light.*  
  That never were and always are.  

  ---

  ### Why This Works for Your Needs:  
  1. **The Switch & Ambiguity**:  
     - The color change ("green spark" → "sudden-red") occurs **before** the line ends ("where no red shone"), mimicking the phi phenomenon’s "premature" report.  
     - Altered words (**Trace/Catch**, **thought/sight**, **mid-/now-**, **that/this**, **Is/Are**, **back/out**, **and/that**) create a "did I revise or was it always thus?" tension without naming theories.  

  2. **Concrete Image**:  
     - A sparkler’s trail ("comet-flight") in darkness embodies motion and abrupt color shift, replacing clinical dots.  

  3. **Timestamp Hint**:  
     - The standalone line *"When isn’t written in the light"* floats ambiguously—it could critique the debate’s premise (experiences lack intrinsic timing) without arguing it explicitly.  

  4. **Unchanged Ending**:  
     - *"That never were and always are"* survives both versions, reflecting the unresolved core: the "experience" feels real yet contradicts physical sequence.  

  5. **Debate-Literate Clues**:  
     - **Orwell (A)**: Words like *"thought"*, *"after-image"*, *"back"*, and *"and"* (suggesting addition) imply *memory editing*.  
     - **Stalin (B)**: Words like *"sight"*, *"now-"*, *"this"*, *"out"*, and *"that"* (defining the fuse) imply *late composition*.  
     - The final stanza’s shifting syntax (**Is/Are... back/out**) mirrors the indeterminacy of "when" editing occurred.  

  6. **Performance & Format**:  
     - Under 90s when read alternately.  
     - Risograph-friendly: fold the sheet so versions face each other. Readers alternate lines, converging on the identical last line.  

  ---

  ### Philosopher-Friendly Notes Embedded:  
  - The sparkler’s motion is reported *as motion* ("comet-flight"), avoiding the "stationary dots" misconception.  
  - "Where no red shone" acknowledges the gap without calling it an "illusion"—it’s a *description* of the paradox.  
  - "The gap forgets" subtly rejects "filling in" as explanation; it’s about *missing time*, not interpolated space.  

  This poem *is* the debate: the reader confronts the same ambiguity as your group, with the page’s sameness arguing that Orwell/Stalin might be two descriptions of one unknowable process.
