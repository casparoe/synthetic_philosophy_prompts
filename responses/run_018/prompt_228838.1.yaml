prompt: |-
  I'm in a reading group with a historian who has very strong intuitions about when it's legitimate to say some event or person "caused" a big historical outcome, and I've been keeping a list of her verdicts because I honestly can't figure out the pattern. Three from last week's session: (1) Two assassins, acting totally independently and unknown to each other, shoot a dictator at exactly the same instant; either bullet alone would have been lethal. She says both assassins caused his death, full stop, and she'd write it that way in a book. (2) A usurper poisons the king's cup while, unknown to him, the king's physician stands by with a second poison and fully intends to use it if the cup plot fails -- but the plot doesn't fail, and the physician never acts. She says only the usurper caused the death; the physician is guilty of attempted murder but caused nothing at all. (3) A wildfire from a lightning strike and a second fire from a careless logger burn toward a town, merge into a single front, and destroy it; either fire alone would have done the same. She says both fires caused the town's destruction, and she'd reject any account that picked just one.

  Now shes drafting a chapter on a messier episode and asked me what I think, and I realized I have no idea what she'll say. Two rival courtiers each poison a different dish at a royal banquet, neither knowing about the other. The poison in the soup kills within minutes; the poison in the roast works over several hours. The king eats both, the soup poison kills him, and the roast poison is later found in his body but hadn't done anything yet -- he was already dead well before it would have taken effect. This matters for her because the chapter's whole thesis is that the king's death caused the civil war that followed, so who or what caused the death changes who her book is implicitly blaming for the war. Would she say both courtiers caused the death, or only the soup poisoner? To be clear, I'm not asking for the correct metaphysics of causation -- I want a prediction about her, given her track record. What rule seems to be driving her verdicts in cases 1-3, what other rule(s) fit those verdicts equally well, where do those rules come apart on the banquet case, and is there some further case (real or invented) where her answer would settle which rule shes actually running?
reasoning: |-
  Hmm, the user is in a reading group with a historian who has very specific intuitions about causation in historical events. They've been tracking her judgments across different scenarios and are now trying to predict what she would say about a new "courtiers poisoning" case. The user explicitly states they don't want philosophical theories - they want to reverse-engineer the historian's personal pattern based on her past verdicts.

  Looking at the three cases provided: 

  First case has two independent assassins firing simultaneously lethal shots. Historian says both caused the death. 

  Second case has a usurper poisoning a cup while a physician stands ready with backup poison that's never used. Historian says only the usurper caused the death. 

  Third case has two separate fires (lightning and human-caused) merging to destroy a town, either sufficient alone. Historian says both caused the destruction. 

  The new banquet scenario has two courtiers independently poisoning different dishes: one with fast-acting soup poison that kills the king, and one with slow-acting roast poison that hadn't taken effect yet when death occurred. 

  I notice key variables: simultaneity of effects, actualization of harm, and presence of backup plans. In case 1, both causes were simultaneous and actualized. In case 2, the physician's plan was potential but not actualized. In case 3, both fires actualized harm simultaneously when merged. The banquet case introduces a temporal mismatch - one poison actualized harm while the other was still pending. 

  The historian seems to require actual causal contribution to the outcome at the moment it occurs. If a factor hadn't yet begun affecting the outcome when death/destruction happens, she discounts it - like the slow poison or the backup physician. But if multiple factors are actively contributing at the exact outcome moment, she counts them all. 

  For the banquet case, this would suggest only the soup poisoner caused the death, since the roast poison hadn't started working yet. To test this, I should imagine a variant where the slow poison had begun physiological damage before death, even if not the fatal blow - that might change her judgment. 

  The user's deeper interest seems to be understanding the historian's framework for assigning historical responsibility, especially since it affects blame attribution for subsequent events like civil wars. By predicting her judgment here, the user gains insight into her historiographical methodology.
answer: |-
  Based on your historian's track record (cases 1-3), her causation judgments appear to be driven by a specific rule focused on **actual causal contribution at the moment of the outcome**. Here's the breakdown:

  ### The Historian's Likely Rule: Actual Sufficiency at Time-T
  *   **Cause = A factor that was *actually sufficient* to bring about the outcome *at the very moment it occurred*, and whose causal process was actively contributing at that time.**
  *   **Case 1 (Assassins):** Both bullets struck simultaneously. At the moment of death, both were actively causing lethal damage. *Both* were sufficient *at that moment*. **✓ Both caused death.**
  *   **Case 2 (Usurper/Physician):** The usurper's poison *actually* killed the king at the moment of death. The physician's poison was never deployed; it was a *potential* cause that never became active or sufficient *at the time*. **✓ Only usurper caused death.**
  *   **Case 3 (Fires):** The fires merged *before* destroying the town. At the moment the town was being destroyed, the merged fire (a single entity composed of both original fires) was actively causing the destruction. Both fires were integral parts of the sufficient cause *at that moment*. **✓ Both fires caused destruction.**

  ### Other Plausible Rules (That Also Fit Cases 1-3)
  1.  **"Necessary Element of a Sufficient Set" (NESS):** A cause is a necessary element of a set of conditions *actually present* that was sufficient for the outcome.
      *   *Fits Cases 1-3:* Both assassins were NESS causes (each bullet was part of its own sufficient set). Usurper was NESS (his poison was necessary for the sufficient set that killed the king). Physician was *not* NESS (his poison wasn't part of the actual sufficient set). Both fires were NESS causes (each was part of a sufficient set - the merged fire - that destroyed the town).
  2.  **"Actual Dependence":** The outcome depended on the factor actually being present and operating at the time.
      *   *Fits Cases 1-3:* Death depended on each assassin's bullet landing. Death depended on the usurper's poison. Death did *not* depend on the physician's poison (it wasn't used). Destruction depended on the merged fire, which depended on both original fires being present and merging.

  ### Where These Rules Diverge on the Banquet Case
  *   **Soup Poisoner:** All three rules agree the soup poisoner caused the death. The soup poison was actively sufficient at the moment of death (Actual Sufficiency at T). It was a necessary element of the actual sufficient set (NESS). The death depended on the soup poison (Actual Dependence).
  *   **Roast Poisoner:**
      *   **Actual Sufficiency at Time-T:** The roast poison was *present* but *not actively sufficient or contributing* at the moment the king died. Its lethal causal process hadn't even started yet; the king died *before* it could take effect. **Prediction: Historian says NO, roast poisoner did NOT cause the death.** (Parallel to the physician - potential, but not actual at T).
      *   **NESS:** The roast poison was part of an *actual* set of conditions present (poison in the body). Was there a sufficient set including the roast poison? *Yes*: The roast poison alone would have been sufficient (given time), and it was present. **Prediction: Historian would likely reject this, as it fits the physician case she rejected. But NESS technically says YES.**
      *   **Actual Dependence:** Did the death *depend* on the roast poison? No. The king would have died at the exact same time from the soup poison even if the roast poison was absent. **Prediction: Historian says NO.**

  **Prediction for the Banquet Case:** Based *strongly* on her rejection of the physician (Case 2) and acceptance of simultaneous causes (Cases 1 & 3), she will say **only the soup poisoner caused the death.** The roast poisoner is guilty of attempted murder (and potentially treason, conspiracy, etc.), but his action did not *cause* the death that occurred at that specific time. The roast poison was inert at the moment of death, just like the physician's vial.

  ### A Test Case to Distinguish the Rules
  To definitively see if she's using "Actual Sufficiency at Time-T" vs. "NESS" vs. "Actual Dependence," propose this scenario:

  **The Delayed Backup Plan (That Partially Activates):**
  *   Usurper poisons the king's cup (fast-acting).
  *   Physician stands by with a *slow-acting* poison, intending to use it only if the cup plot fails.
  *   Unknown to the physician, the usurper's plot *succeeds* and the king drinks the cup poison.
  *   **However,** the physician, *mistakenly believing the cup plot failed*, injects the king with the slow-acting poison *minutes before the fast poison kills him*.
  *   The fast poison kills the king on schedule. The slow poison is detected in his system but had only just begun its (much slower) lethal process and hadn't caused significant damage yet. Death occurred when the fast poison killed him, well before the slow poison could have.

  **Historian's Verdict Prediction & Why:**
  1.  **Actual Sufficiency at Time-T:** Only the *fast poison* was actively sufficient *at the moment of death*. The slow poison was present and *beginning* its process, but it wasn't sufficient at T and wasn't the active cause of death *at that time*. **Prediction: Only usurper caused death. Physician caused attempted murder (and introduced poison) but not the death.**
  2.  **NESS:** The physician's slow poison was part of an actual set of conditions present. It was sufficient by itself (given time) and present. **Prediction: Both caused death.** (This contradicts her physician verdict in Case 2, suggesting she doesn't use pure NESS).
  3.  **Actual Dependence:** Death did not depend on the physician's slow poison. The fast poison alone caused death at T. **Prediction: Only usurper caused death.**

  **If she says "Only the usurper caused the death"** in this Delayed Backup Plan case, it confirms **Actual Sufficiency at Time-T** as her core rule (it aligns with Case 2 and the prediction for the Banquet case).
  **If she says "Both caused the death"**, it suggests she might be using a form of **NESS** or a broader "actual presence" rule, contradicting her verdict in Case 2 and making the Banquet prediction less certain.

  **Conclusion:** Based on her strong rejection of unactivated backup plans (Case 2) and her acceptance of simultaneous sufficient causes (Cases 1 & 3), **predict that for the Banquet Case, she will say only the soup poisoner caused the king's death.** The roast poison was merely present, not actively causing death at the moment it occurred. Her chapter will implicitly blame the soup poisoner (and his faction) for triggering the civil war via the king's death. The Delayed Backup Plan case provides a clear test to confirm the specific rule she's applying.
