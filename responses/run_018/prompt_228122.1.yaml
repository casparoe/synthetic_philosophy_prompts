answer: |-
  ### Analysis of the Tentative Principle
  Your tentative principle states: "A rule of change may authorize any amendment that leaves a functioning rule of change in place, but none that would extinguish or permanently insulate either itself or the system it serves." I will test this against your six cases, identify where it fails, propose a repaired principle, apply it to new cases, and address your questions.

  #### Step 1: Testing the Tentative Principle
  - **Case 1 (Threshold raised from two-thirds to three-quarters)**:  
    The amendment leaves a functioning rule of change (now requiring three-quarters). The principle permits this, matching your "valid" verdict.  
    **Result**: Passes.

  - **Case 2 (Amendment clause made unamendable)**:  
    This extinguishes the rule of change by making it permanently insulated. The principle forbids this, matching your "not valid" verdict.  
    **Result**: Passes.

  - **Case 3 (Two-step library restriction)**:  
    - Step 1: Unanimously changes the amendment clause from unanimity to simple majority.  
    - Step 2: Simple majority restricts library access.  
    Your verdict is "invalid" because the steps are a disguised transaction. The principle fails here because it only considers whether a "functioning rule of change" remains (a simple majority clause is still functional). It does not account for **circumvention of substantive limitations** (the unanimity requirement was designed to protect library access). The principle allows Step 1, which would validate Step 2, contradicting your verdict.  
    **Failure**: The principle ignores amendments that **circumvent substantive protections** even if they leave a functioning rule of change.

  - **Case 4 (Oral contract modification)**:  
    The parties bypass the written-modification rule through conduct. Your verdict is "valid" because the creators (parties) can unmake the rule. The principle fails because it only addresses amendments "authorized" by the rule of change (i.e., intra-systemic changes). Here, the change is extra-systemic (outside the rule), so the principle doesn't apply.  
    **Failure**: The principle does not account for **extra-systemic changes by creators**.

  - **Case 5 (Constitutional convention outside amendment procedure)**:  
    The change occurs outside the prescribed rule of change (revolutionary). Your verdict is "valid" due to popular sovereignty. The principle fails because it only covers lawful amendments "authorized" by the rule of change, not extra-constitutional acts.  
    **Failure**: Same as Case 4—ignores **extra-systemic changes by creators**.

  - **Case 6 (Nomic rule made immutable)**:  
    The amendment leaves the overall rule of change functional (only one rule is insulated). The principle permits this, matching your "valid" verdict.  
    **Result**: Passes.

  **Summary of Failures**: The principle mishandles:  
  - Case 3 (allows circumvention of substantive limitations).  
  - Case 4 and 5 (ignores extra-systemic changes by creators).

  #### Step 2: Repaired Principle
  The failures suggest two distinct issues:  
  1. **Circumvention of substantive limitations** (motivated by Case 3).  
  2. **Extra-systemic changes by creators** (motivated by Cases 4 and 5).  

  I propose a single repaired principle with two clauses for clarity and coverage:  

  > **Repaired Principle**:  
  > A rule of change may authorize any amendment that:  
  > (a) leaves a functioning rule of change in place and does not circumvent a substantive limitation that the rule of change was designed to protect *(motivated by Case 3)*; and  
  > (b) does not extinguish or permanently insulate either itself or the system it serves *(motivated by Case 2)*.  
  > However, the creators of the system retain the inherent power to alter or replace it by clear mutual consent, even if such alteration bypasses the rule of change, provided this does not violate overriding external constraints *(motivated by Cases 4 and 5)*.

  **Explanation**:  
  - Clause (a) adds an anti-circumvention condition (Case 3).  
  - Clause (b) retains the core of your principle (Case 2).  
  - The "creators" clause addresses extra-systemic changes (Cases 4 and 5), recognizing that creators (e.g., parties to a contract, the people in a constitution) are not bound by self-imposed procedural constraints when acting unanimously or with clear consent.  

  This principle saves all your verdicts:  
  - Case 3: Step 1 is invalid under (a) because it circumvents the substantive limitation (unanimity requirement for library protection).  
  - Cases 4 and 5: Valid under the "creators" clause.  
  - Cases 1, 2, 6: Unchanged and valid/invalid as before.

  #### Step 3: Application to New Cases
  **New Case A: Statute with self-repealing sunset clause**  
  - A statute includes a sunset clause repealing itself and the statute.  
  - **Prediction**: Valid. The amendment (sunset clause) leaves the broader rule of change (e.g., legislative power) functional. It does not circumvent a substantive limitation or extinguish the system. The repeal is temporary and intra-systemic.  

  **New Case B: Parliament restricts successors' legislative power**  
  - A parliament uses ordinary power to bind successors (e.g., requiring a supermajority for certain laws).  
  - **Prediction**:  
    - If the restriction leaves a functioning rule of change (e.g., amendments still possible via supermajority), it is valid under (a) and (b).  
    - If it permanently insulates part of the system (e.g., "no future parliament may amend this restriction"), it violates (b) and is invalid (like Case 2).  
    - If it circumvents a substantive limitation (e.g., a constitutional protection for legislative power), it violates (a) and is invalid.

  #### Step 4: Limitations and Ad Hoc Concerns
  - **Which verdicts does the repaired principle not accommodate?**  
    The repaired principle accommodates all six verdicts. It handles Case 3 with the anti-circumvention clause (a) and Cases 4–5 with the creators' exception.  
  - **Can Cases 3 and 4 be kept together without a contract-versus-constitution exception?**  
    Yes. The repaired principle avoids ad hoc distinctions by:  
    - Treating Case 3 as intra-systemic circumvention (invalid under (a)).  
    - Treating Case 4 as extra-systemic change by creators (valid under the creators' clause).  
    No "contract vs. constitution" exception is needed; the creators' clause applies universally to any system where creators are identifiable (e.g., parties, people, association members). Case 4 is valid because the parties, as creators, consented orally and through conduct; Case 3 is invalid because the council (not acting as "creators" in an extra-systemic sense) circumvented a limitation intra-systemically.

  #### Step 5: Mapping to Suber's Trilemma and Case 5
  - **Mapping cases to Suber's trilemma (immutable rules, infinite regress, paradox)**:  
    - Case 1 avoids all three by preserving a functional rule of change (no immutability, regress, or paradox).  
    - Case 2 attempts immutability (invalid), averting the trilemma.  
    - Case 3 risks paradox (circumvention undermines the purpose of the rule), resolved by invalidation.  
    - Case 4 and 5 bypass the trilemma through revolution (extra-systemic change).  
    - Case 6 avoids immutability by preserving change for other rules.  
    Suber's trilemma applies only to *lawful* change, so Cases 4 and 5 (revolutionary) fall outside it.  

  - **Does Case 5 show Suber was wrong to bracket revolution?**  
    No. Suber brackets revolution to focus on lawful self-amendment (p. 10: "we are now considering only the lawful change of law"). Case 5 (valid revolution) confirms that extra-systemic change resolves issues the trilemma cannot, but it doesn't invalidate Suber's analysis. Instead, it highlights that revolution is a *separate pathway* outside the trilemma. Your verdict in Case 5 is consistent with Suber's framing—he acknowledges revolution but sets it aside for his inquiry.

  ### Final Answer
  The repaired principle saves all your verdicts.  
  \answer{none}
