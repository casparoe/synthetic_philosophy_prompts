prompt: |-
  I work as an ontology engineer for federated knowledge-graph systems; my daily vocabulary is classes, instances, property graphs, schema conflicts, entity-resolution rules, inheritance hierarchies, consistency models, and versioned federated queries. I have no background in philosophy of biology. Please restate the core of the species problem—the fact that biologists operate with multiple, mutually incompatible species concepts (reproductive isolation, monophyletic phylogenetic lineage, morphological cluster, ecological niche occupancy) and that no single criterion applies across asexual organisms, ring species, fossil lineages, and hybrid zones—entirely within my framework. Be systematic: map reproductive isolation onto a runtime consistency or compatibility protocol that can fail under network partition; map phylogenetic species onto event-sourced identity reconstructed from an immutable divergence log; map morphological clustering onto unsupervised feature-space partitioning; and map ecological niche onto context-dependent property constraints. Then provide the residue report: which parts of the biologists' disagreement survive this translation cleanly, which survive only with distortion, and which have no counterpart at all in ontology engineering? Specifically, address whether the normative question—whether species are real natural kinds or pragmatic grouping conventions—can be expressed in terms of schema-design choices, or whether it vanishes entirely. Also address whether my framing introduces a false dichotomy (consistency failure versus event-log divergence) that is not actually present in the biological debate. I want to know whether the residue reveals a genuine limitation in how distributed ontologies handle historical process and reproductive dynamics, or whether it instead indicates that the original species problem was partly a matter of imprecise vocabulary rather than a deep metaphysical conflict.
