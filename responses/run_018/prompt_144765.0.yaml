  - Mechanism design is primarily concerned with strategic interactions and information revelation, not with the decision-theoretic problem of an individual facing radical uncertainty about the consequences of their actions. Therefore, the tools of mechanism design are not designed to address this kind of epistemic limitation.

  However, note that mechanism design does have tools for dealing with uncertainty (like Bayesian mechanisms) and robustness (e.g., maxmin mechanisms). But these require that the designer can at least specify a set of possible states of the world. In the case of cluelessness, the set of possible long-run outcomes is so vast and the causal chains so complex that we cannot specify such a set.

  Thus, the residue (the part that does not map) is the extreme form of uncertainty that prevents the formation of any probabilistic model. This residue suggests that mechanism design, as represented by the given concepts, lacks resources for this kind of normative reasoning because it typically assumes that the designer has a model of the world (even if imperfect) and that the uncertainty is structured. The radical uncertainty of cluelessness is unstructured.

