ory genuinely illuminates, which it misdescribes or forces into an ill-fitting category, and whether the episode ultimately vindicates the Darwin-Turing parallel, exposes it as a category mistake, or shows it to be a useful but partial heuristic. I am not asking for a bibliography or for references to obscure technical literature; I want a careful conceptual case study that treats both the philosophical framework and the historical episode with equal precision.
