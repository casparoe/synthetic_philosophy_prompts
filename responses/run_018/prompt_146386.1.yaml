  Dave, a "Moral Patienthood Auditor," inspects distributed compute clusters for unintentional sentience. Using his patented "Causal Nexus Threshold Detector," he flags systems where computations exhibit "cross-node integrated information coherence" (CNIIC) above 3.5—a totally arbitrary benchmark he cribbed from a footnote in a 2034 blog post.  

  **BIT:**  
