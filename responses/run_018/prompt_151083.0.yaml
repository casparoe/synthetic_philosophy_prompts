  Then, the intuitions: SE's appeal to history feels fundamental for explaining existence, while CR's focus on current operation is pragmatic. These might be foundational intuitions that are hard to reconcile. There's also the issue of empirical evidence. SE relies on historical traces, which can be inferential and sometimes unattainable. CR avoids that but might overattribute functions (e.g., the heart's sound-making as a function).

