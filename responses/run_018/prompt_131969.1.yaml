prompt: |-
  In my course on value pluralism we have been working through Ruth Chang’s idea of hard choices and Raz’s account of incommensurability, and I am trying to understand an institutional split that seems to presuppose one view in one domain and reject it in another. In human-subjects research ethics, institutional review boards typically operate with what looks like a lexical veto structure: if a protocol violates informed consent or exposes participants to disproportionate risk, it is rejected outright, regardless of how large the expected scientific or social benefit might be. The harm and the good are not balanced on a common scale; they are evaluated on independent tracks with disqualifying conditions. By contrast, the same health systems often use cost-effectiveness analysis—cost per QALY, for instance—to aggregate lives saved and resources spent into a single metric for public-health funding decisions. What philosophical commitments about value comparison does this divergence presuppose? Does the IRB practice assume that autonomy and welfare are genuinely incommensurable, or does it merely reflect a practical refusal to compare them? Could a defender of hard choices endorse the lexical structure in research ethics while rejecting aggregation in health policy, or is the split just institutional convenience with no coherent philosophical basis? Reconstruct the implicit theory of value that licenses treating these two domains differently, distinguish what the practice strictly requires from what it merely accommodates, and say what would have to change in either practice if we replaced the implicit view with a consistently comparativist or consistently non-comparativist framework.
reasoning: |-
  Okay, let me start by unpacking the user's question. They're studying value pluralism, specifically Ruth Chang's hard choices and Raz's incommensurability. The issue is the apparent inconsistency in how institutions handle value comparisons—IRBs use a lexical veto for research ethics, while health policy uses cost-effectiveness analysis (CEA) like QALYs. 

  First, I need to recall Chang and Raz's ideas. Chang argues that some choices are hard because values aren't always comparable by a single scale; instead, we can create reasons through commitments. Raz focuses on incommensurability where values lack a common measure. The user is pointing out that IRBs seem to treat autonomy and welfare as incommensurable by not trading them off, whereas CEA aggregates everything into a single metric. 

  The user's main question is whether this split implies philosophical commitments or just practical convenience. They also ask if a defender of hard choices could consistently support both approaches. I should break down the implicit theories behind each practice. For IRBs, the lexical structure suggests autonomy and welfare are incomparable in a way that prevents trade-offs. CEA assumes all values can be reduced to a common unit, like QALYs. 

  Next, I need to consider possible reconciliations. Maybe IRBs prioritize autonomy as a side constraint, per deontology, while CEA follows consequentialism. But the user wants to know if this is philosophically coherent under value pluralism. Chang might argue that the lexical approach reflects a commitment to autonomy as non-negotiable, which is a stance of creating reasons rather than discovering comparability. 

  Then, reconstructing the implicit theory: IRBs treat certain values as inviolable, hence incomparable, while health policy sees all values as commensurable. The strict requirement is the veto power for IRBs, while CEA mandates aggregation. The accommodation might be avoiding moral risks in research versus efficiency in resource allocation. 

  If we impose consistent frameworks, switching IRBs to comparativism would require balancing autonomy against benefits, which feels ethically problematic. Making health policy non-comparativist might lead to indecision or qualitative judgments without metrics. 

  The user might also be concerned about real-world implications. Are institutions being inconsistent, or is there a deeper rationale? They might need this for a paper or thesis, so providing clear distinctions and philosophical grounding is key. Also, considering how Chang's commitment-based approach can justify both practices without contradiction—seeing the lexical veto as a commitment to autonomy, while CEA reflects a different commitment to maximizing welfare. 

  I should ensure the explanation ties together both theorists and addresses the coherence of the institutional split. Highlighting that the divergence can be philosophically defended under pluralism, not just practicality, would answer their core concern.
answer: |-
  Your observation captures a profound institutional tension rooted in conflicting philosophical assumptions about value comparison. Let's reconstruct the implicit theories, distinguish requirements from accommodations, and explore the consequences of imposing consistency.

  ### 1. Philosophical Commitments Presupposed by the Divergence
  - **IRB Lexical Veto**:  
    Assumes **strong deontic constraints** (Raz-style incommensurability) or **constitutive incommensurability** (Chang). Autonomy and certain harms are treated as *categorically distinct* from welfare gains. Violating consent isn't merely a "cost" outweighed by benefits; it constitutes a *moral wrong* that invalidates the act itself. This reflects a **non-consequentialist framework** where:
    - Values reside in different normative "spheres" (e.g., dignity vs. utility).
    - Comparison is impossible (Raz) or rationally prohibited (Chang via commitments).
  - **Cost-Effectiveness Analysis (CEA)**:  
    Assumes **full commensurability**. All values (life-years, suffering, resources) are reducible to a common metric (e.g., QALYs/DALYs). This reflects **consequentialism** and **monistic utilitarianism**, where:
    - Trade-offs are not just possible but required for rationality.
    - Aggregation is morally necessary for efficient resource allocation.

  ### 2. Strict Requirements vs. Mere Accommodations
  | **Practice**       | **Strictly Requires**                          | **Merely Accommodates**                     |
  |---------------------|-----------------------------------------------|--------------------------------------------|
  | **IRB Veto**        | - Non-trade-off between core principles (consent, disproportionate risk) and benefits.<br>- Qualitative threshold for "unacceptable" harm. | - Specific risk thresholds (e.g., "minimal risk" definitions).<br>- Scope of protected values (e.g., whether financial harms trigger veto). |
  | **CEA Aggregation** | - All inputs converted to a single cardinal scale.<br>- Maximization of aggregate benefit per unit cost. | - Choice of metric (QALYs vs. DALYs).<br>- Willingness-to-pay thresholds (e.g., $50k/QALY). |

  ### 3. Could a Defender of Hard Choices Endorse Both?
  **Yes, consistently**, through Ruth Chang’s framework:
  - **IRB Practice**: The lexical veto reflects a **commitment** to human dignity. By refusing to trade autonomy for welfare, society *creates a reason* to treat autonomy as inviolable. This isn’t about discovering incomparability but *establishing* it through normative stance-taking.
  - **CEA Practice**: Represents a different **commitment** to maximizing population welfare within constraints. By adopting QALYs, policymakers commit to treating health outcomes as fungible and comparable *for this specific domain*.
    
  **Key Justification**: Domain specificity. Research ethics involves direct, individualized moral relations (investigator-participant), demanding non-instrumentalization. Health policy involves impersonal resource allocation, where aggregation may be the lesser evil. Chang’s "hybrid" view allows different normative commitments in different contexts.

  ### 4. Implicit Unified Theory of Value
  The divergence licenses a **contextual value pluralism**:
  > *Certain values (dignity, autonomy) are non-fungible in intimate/proximal contexts (e.g., researcher-participant interactions) but become commensurable in systemic/distal contexts (e.g., population-level resource allocation).*

  This hybrid theory borrows from:
  - **Nagel's Agent-Relative Obligations**: Personal interactions impose special duties.
  - **Walzer's Spheres of Justice**: Different social domains have distinct distributive principles.
  - **Raz's Domain-Specific Incommensurability**: Comparability depends on the context of choice.

  ### 5. Consequences of Imposing Consistency
  - **Imposing Strict Comparativism (CEA Logic Everywhere)**:
    - **IRB Change**: Protocols violating consent could be approved if benefits sufficiently outweigh harms (e.g., a risky trial with huge public health payoff). Autonomy becomes a "cost" in a utility calculus.
    - **Moral Risk**: Legitimizes instrumentalizing individuals for collective gain, violating Kantian norms and human rights frameworks.

  - **Imposing Strict Non-Comparativism (IRB Logic Everywhere)**:
    - **Health Policy Change**: Reject CEA; fund treatments based on categorical rights (e.g., "all life-saving interventions must be covered") regardless of cost-effectiveness.
    - **Practical Risk**: Unmanageable resource allocation, inability to prioritize between competing needs, potential system collapse.

  ### Conclusion
  The split is **not merely institutional convenience** but reflects a philosophically defensible (though often implicit) **contextual pluralism**. IRBs treat autonomy and welfare as incommensurable due to the moral gravity of direct harm and the relational nature of research. Health policy aggregates values because population-level scarcity forces trade-offs that are politically and practically unavoidable. 

  **What must change under consistent frameworks?**  
  → Adopting universal commensurability would *dissolve the IRB's core ethical function*.  
  → Adopting universal incommensurability would *paralyze systemic health allocation*.  

  The current divergence, while tension-ridden, acknowledges that **some values resist aggregation when they define our moral identity** (Chang), yet **societal survival requires pragmatic comparison in the face of scarcity**. A coherent philosophical basis exists if one accepts that value relations are not fixed but shaped by our commitments and the nature of the moral context.
