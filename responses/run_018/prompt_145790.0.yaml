prompt: |-
  I'm convening a graduate seminar on the philosophy of probability, and before we examine particular resolutions of Bertrand's paradox I want the specification written down. What must an adequate theory of the principle of indifference in continuous parameter spaces actually deliver? Set out the desiderata: the specific paradoxical configurations it must dissolve (chord selection by endpoint, midpoint, and radial distance; sector division; point selection within an area), with the ambiguity that generates each; the conceptual distinctions it must preserve, particularly between symmetry of the state space and symmetry of the generating physical procedure, and between epistemic and ontic readings of 'uniform'; the formal constraints it must respect, including normalisability, consistency under admissible re-parameterisation, and empirical compatibility with statistical mechanics; and whether any subset of these requirements is jointly unsatisfiable in light of known invariance results. For each desideratum, state the motivating consideration. Then, briefly and without a full scorecard, indicate how the Jaynesian maximum-entropy strategy, the well-posing resolution, and a symmetry-breaking parameterisation approach fare against the list. Keep the response to no more than 500 words, and write in British English.
reasoning: |-
  Okay, let me approach this query methodically. The user is convening a graduate philosophy seminar on probability, specifically focusing on Bertrand's paradox and the principle of indifference in continuous spaces. They need a structured list of desiderata for any adequate theory addressing this paradox, along with how three major approaches fare against these criteria.

  First, I need to unpack the core requirements they outlined. The key elements are: paradoxical configurations to resolve (chord/midpoint/radial, sector, area selection), conceptual distinctions (state vs procedure symmetry, epistemic vs ontic uniformity), and formal constraints (normalisation, re-parameterisation consistency, empirical compatibility). The user also wants motivations for each desideratum and a brief comparative assessment of Jaynesian, well-posing, and symmetry-breaking approaches.

  For the paradoxical configurations, I'll consider how each variant of Bertrand's paradox exposes different ambiguities in applying uniformity. The chord paradoxes demonstrate how different symmetry assumptions (endpoints vs midpoints) lead to contradictory probabilities, while sector and area selection problems extend this to rotational and areal uniformity. 

  The conceptual distinctions are crucial here. I need to emphasize how conflating state-space symmetry with physical procedure symmetry causes problems, and how epistemic "uniform ignorance" differs from ontic "physical uniformity". These distinctions underpin why naive applications of indifference fail.

  For formal constraints, normalisability is fundamental to probability theory, while re-parameterisation consistency speaks to the invariance problem. Empirical compatibility with statistical mechanics is important because it grounds the discussion in real-world applications.

  Regarding the comparative assessment: Jaynesian maximum entropy uses transformation groups to select priors but faces challenges with conflicting symmetries. Well-posing resolutions argue the paradox dissolves when specifying the physical procedure, which may limit generality. Symmetry-breaking parameterisation makes the choice explicit but risks arbitrariness.

  I'll structure this with clear desiderata grouped by type, concise motivations, and a balanced comparison - all within the 500-word limit using British English. The tone should remain academic but accessible for graduate philosophers who may be less familiar with technical probability nuances.
answer: |-
  Here are the desiderata for an adequate theory resolving Bertrand's paradox and the Principle of Indifference in continuous spaces, with motivations and brief assessments of key approaches:

  1.  **Desiderata & Motivations:**
      *   **Resolve Chord Paradox Configurations:**
          *   *Endpoints:* Uniform angle choice on circumference gives P(longer than side) = 1/3.
          *   *Midpoint:* Uniform radial/angular choice within circle gives P = 1/4.
          *   *Radial Distance:* Uniform choice along radius gives P = 1/2.
          *   *Motivation:* Demonstrates the core problem: different, seemingly natural symmetry assumptions (rotational vs. translational) applied to the *same question* yield contradictory probabilities. The theory must explain why one (or none) is valid.
      *   **Resolve Sector Division Paradox:** Uniform angle choice vs. uniform arc-length choice for dividing a circle yield different probabilities for sector size. *Motivation:* Extends the ambiguity to rotational symmetry alone, challenging the uniqueness of "uniform" even under a single symmetry group.
      *   **Resolve Point Selection within Area:** Uniform Cartesian coordinates vs. uniform polar coordinates yield different probabilities for point location within defined regions. *Motivation:* Highlights the fundamental dependence of "uniform" on the chosen parameterisation of the space.
      *   **Distinguish State Space Symmetry vs. Physical Procedure Symmetry:** *Motivation:* A symmetry of the *outcome space* (e.g., rotational invariance of the circle) does not necessarily imply the symmetry of the *physical process generating the random element* (e.g., tossing sticks vs. spinning a pointer). The theory must clarify which symmetry justifies uniformity.
      *   **Distinguish Epistemic 'Uniform' (Ignorance) vs. Ontic 'Uniform' (Physical Property):** *Motivation:* Is uniformity an expression of *lack of knowledge* about which outcome occurs, or a description of a *physical mechanism* guaranteeing equal propensity? The paradoxes often conflate these; a theory must specify its domain.
      *   **Ensure Normalisability:** *Motivation:* Probabilities must sum/integrate to 1. Infinite uniform measures over unbounded spaces (a related issue) violate this core axiom.
      *   **Ensure Consistency under Admissible Re-parameterisation:** *Motivation:* Probabilities for the same event must be invariant under smooth, invertible transformations of the parameters (e.g., Cartesian to Polar coordinates). Naive PoI violates this, leading directly to the paradoxes. The theory must define "admissible".
      *   **Empirical Compatibility (e.g., Statistical Mechanics):** *Motivation:* Successful physical theories (like using phase space volume) rely on specific uniform measures justified by dynamics, not purely epistemic arguments. An adequate theory shouldn't contradict these established results without strong justification.

  2.  **Joint Satisfiability:** The requirement for consistency under re-parameterisation conflicts with the naive application of PoI to any arbitrary continuous parameter. Invariance theorems (e.g., Haar measure uniqueness only for compatible groups) show that *no single uniform measure* satisfies all possible symmetry descriptions simultaneously for a space like the circle/disk. A theory *must* break this symmetry one way or another.

  3.  **Brief Assessment of Approaches:**
      *   **Jaynesian (MaxEnt + Transformation Groups):** Seeks a unique prior via the "most non-committal" distribution respecting specified invariances (e.g., rotational/translational for chords). Fares well on normalisability, empirical compatibility (often recovers standard measures), and distinguishing procedure (via chosen group). Struggles with conflicting symmetry groups (which group for chords?) and the epistemic/ontic distinction (justification for the group choice can feel physical). Resolves specific paradoxes by selecting a group.
      *   **Well-Posing Resolution:** Argues the paradox dissolves only by specifying the *physical random procedure* (e.g., spinning a pointer, tossing sticks). Delivers consistency, clearly distinguishes state vs. procedure symmetry, and grounds "uniform" ontically in the mechanism. May struggle with purely epistemic scenarios and can feel like avoiding the core philosophical problem PoI was meant to address. Directly resolves paradoxes by providing unique answers per procedure.
      *   **Symmetry-Breaking Parameterisation:** Accepts that parameterisation choice is fundamental. "Adequacy" means making the choice explicit and justified (e.g., by convenience, naturalness, or physical analogy). Respects normalisability but explicitly abandons re-parameterisation invariance for the uniform density itself. Risks arbitrariness and doesn't resolve the paradoxes so much as acknowledge the necessity of an extra-theoretical choice.
