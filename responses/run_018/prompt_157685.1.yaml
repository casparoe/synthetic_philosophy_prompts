answer: |-
  Here's the thought experiment:

  **Scenario:** A public health funding board debates allocating their final $10M. Option A funds bednet distribution in malaria zones, proven to save ~200 lives this year with >99.9% certainty. Option B funds an experimental "zoonotic sink" strategy requiring: (1) lab success engineering a transmissible virus displacing wild-type in bats (P=0.7), (2) successful field release establishing it (P=0.5 given step1), (3) observed reservoir neutralization (P=0.8 given step2), *and* (4) proven spillover prevention to humans (P=0.0007 given step3). The tiny compound probability (0.7 * 0.5 * 0.8 * 0.0007 ≈ 0.0002) offers a 1-in-5000 chance of preventing a pandemic and saving 50 million lives; otherwise, it saves zero. An EV maximizer calculates B's expected value (0.0002 * 50,000,000 = 10,000 lives saved) vastly exceeding A's 200 lives, demanding B. A proponent of "robustness-weighted consequentialism" (RWC) argues for A, not from risk aversion, but applying a structural discount factor for outcomes reliant on >3 unverified causal links, deeming B's long causal chain too fragile for reliable probability assignment despite the enticing EV.

  **Analysis:**
  1.  **EV Reasoning:** Treats probabilities linearly and utilities as linear in lives saved. EV(B) = (Probability of Success) * (Utility of Success) + (Probability of Failure) * (Utility of Failure) = (0.0002 * 50,000,000) + (0.9998 * 0) = 10,000 lives. EV(A) = (0.999 * 200) ≈ 200 lives. 10,000 > 200, therefore choose B.
  2.  **RWC Reasoning:** Accepts the nominal probabilities but applies a discount factor reflecting epistemic uncertainty from complex causal chains. If RWC discounts the *probability* of complex success by a factor (e.g., 0.1) *per causal link beyond the third verified step*, then for B's 4 links: Discounted P(Success) ≈ 0.0002 * (0.1)^(4-3) = 0.00002. Discounted EV(B) = 0.00002 * 50,000,000 = 1,000 lives. 1,000 < 200? No, but wait: RWC argues the discount applies to the *achievement of the outcome*, not necessarily linearly to EV. More fundamentally, RWC might *reject the reliability* of the initial 0.0002 probability estimate *because* of the chain length, holding that probabilities beyond 3 links are inherently too unreliable to plug into EV calculations meaningfully, regardless of the nominal number. Thus, A (reliable, verified) is preferred *on principle* over B (fragile, speculative chain).
  3.  **Key Feature:** The critical difference is the **treatment of near-zero probabilities**, particularly those derived from compounding estimates across multiple uncertain causal steps. EV treats the tiny probability (0.0002) as a precise, reliable input. RWC argues such complex-chain probabilities are epistemically unstable and shouldn't be taken at face value for high-stakes decisions, regardless of the calculated EV. (Linearity in probabilities and unbounded utility scaling *enable* the high EV for B, but RWC's objection targets the *credibility* of the probability input itself).
  4.  **Capped Stakes:** If B saves max 500,000 lives (EV = 0.0002 * 500,000 = 100 lives), RWC *still diverges* and chooses A (200 lives). The discounted RWC EV(B) would be 0.00002 * 500,000 = 10 lives. The structural skepticism about the probability's reliability due to chain length persists independently of the stakes, making A preferable.
  5.  **EV Fanatic Attack:** An EV fanatic would attack RWC as fundamentally *ad hoc* and unprincipled: "You've invented an arbitrary '3-link rule' and a discount factor with no rigorous foundation. Why 3 links? Why not 2 or 4? Why that specific discount? This is just risk-aversion (or 'complexity-aversion') masquerading as principle. True consequentialism uses the best available probability estimates, however small, and scales linearly with utility. Your rule systematically neglects tail risks with massive positive impact, leading to guaranteed large losses (like 9,800 lives in the original B) for fear of an unquantifiable epistemic boogeyman. If the probability is 0.0002, *use* 0.0002. If you think the probability is truly lower, state *that* number explicitly; don't hide behind an arbitrary structural penalty." They argue RWC violates the core consequentialist tenet of using all available information to maximize expected good.
