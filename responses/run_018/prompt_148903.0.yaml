prompt: |-
  You serve as the senior ethics auditor for a regional health system that deploys predictive algorithms to assign individual patients to risk-reference classes for treatment prioritization. Because the philosophical reference-class problem undermines any automatic assignment—there is no unique correct class for an individual, and substituting one class for another can alter the predicted probability without altering the underlying medical fact—your office needs a reusable audit procedure. Write a formal, step-by-step decision procedure that a non-philosopher reviewer can execute in approximately thirty minutes per case to determine whether an algorithm’s assigned reference class is defensible, illegitimate, or genuinely indeterminate. The procedure must ask ordered questions about: (i) the statistical robustness and sample size of the proposed class; (ii) the causal relevance of each class-defining property to the specific outcome being predicted; (iii) counterfactual stability of membership—specifically, whether the patient would remain in the class under the intervention whose risk is being predicted, and whether using a counterfactual property creates circular reasoning; and (iv) whether intersecting sub-classes generate non-transitive membership relations that cause the prediction to collapse. For each step, specify what counts as a sufficient answer, where the procedure terminates with an unambiguous approval or rejection, and where it must escalate to a human values-committee because the issue is irreducibly normative rather than factual. Include a concise set of test conditions—data-level and sentence-level checks—the reviewer can apply without specialized statistical software. Then run the procedure on three cases: (a) a 58-year-old patient assigned to a cardiovascular-risk class defined partly by a biomarker that also functions as a proxy for socioeconomic status, where the procedure yields an approval that the clinical team will strongly resist on equity grounds; (b) a patient whose class membership depends on a counterfactual biomarker level—what the level would be after a preliminary treatment—creating circularity in the risk prediction for that very treatment; and (c) a patient who belongs to two statistically valid reference classes that yield contradictory risk rankings, leaving the procedure unable to resolve the conflict. Conclude by stating precisely what the procedure is powerless to settle—particularly regarding distributive fairness across classes and the weighting of competing valid classes—and flag every step where judgment is unavoidable despite the formal structure.
reasoning: |-
  We are creating a formal, step-by-step decision procedure for auditing the defensibility of an algorithm's assigned reference class for a patient. The procedure is designed for a non-philosopher reviewer and should take about 30 minutes per case. The procedure will have four main sections: (i) statistical robustness and sample size, (ii) causal relevance, (iii) counterfactual stability and circularity, and (iv) non-transitive membership due to intersecting sub-classes. Each step will have specific questions and criteria for sufficient answers, and we will indicate when to terminate with approval (defensible), rejection (illegitimate), or escalation to a human values-committee (indeterminate due to normative issues).

  We will then apply this procedure to three test cases (a, b, c) and conclude with the limitations of the procedure.

  **Formal Decision Procedure**

  **Step 0: Preparation**
  - Gather the following information for the case:
    - The patient's demographic and clinical data.
    - The algorithm's assigned reference class definition (including all properties).
    - The outcome being predicted (e.g., 5-year cardiovascular risk).
    - The data sources and sample size used to build the reference class model.

  **Step 1: Statistical Robustness and Sample Size**
    1. **Question 1.1:** What is the sample size of the proposed reference class in the training data?
        - **Check:** Is the sample size ≥ 100? (Arbitrary but common threshold for minimal stability; adjust if domain-specific standards exist.)
        - **Sufficient answer:** If yes, proceed. If no, go to Question 1.2.
    2. **Question 1.2:** Is there evidence of statistical robustness (e.g., confidence intervals, bootstrap stability, or cross-validation results) for the risk estimate in the proposed class?
        - **Check:** Review provided documentation. If the 95% confidence interval for the risk estimate in the class is within ±5% of the point estimate (or another pre-specified tolerance) and/or if bootstrap or cross-validation shows stability (e.g., standard deviation of risk estimate across folds < 5%), then robustness is established.
        - **Sufficient answer:** If robustness is established, proceed to Step 2. Otherwise, assign **Rejection (Illegitimate)** due to statistical instability.
        - **Termination:** If rejected, the audit stops. The reference class is not defensible.

  **Step 2: Causal Relevance**
    1. **Question 2.1:** For each class-defining property, is there established causal relevance to the outcome?
        - **Check:** Use a pre-approved causal relevance checklist (e.g., based on known biomedical pathways, RCTs, or meta-analyses). For each property, ask: 
            - Is the property a direct cause of the outcome (e.g., high LDL causes heart attacks)?
            - If not direct, is it a non-spurious proxy for a causal factor? (e.g., zip code as proxy for pollution exposure, which is causal).
        - **Sufficient answer:** If at least one property is causally relevant (directly or as a non-spurious proxy) and no property is known to be spuriously correlated (e.g., due to confounding) without causal link, proceed. If any property lacks causal relevance and is not a non-spurious proxy, go to Question 2.2.
    2. **Question 2.2:** For properties lacking established causal relevance, is there a plausible causal story (with supporting evidence) that the property is a non-spurious proxy?
        - **Check:** Require documentation of a validated causal model or high-quality observational study (e.g., with adjustment for confounders) that supports the proxy role. If absent, the property fails.
        - **Sufficient answer:** If all properties have either direct causal relevance or validated proxy status, proceed to Step 3. If any property fails, assign **Rejection (Illegitimate)** due to non-causal or spurious properties.
        - **Termination:** If rejected, stop.

  **Step 3: Counterfactual Stability and Circularity**
    1. **Question 3.1:** Would the patient remain in the assigned reference class under the intervention whose risk is being predicted? (Example: If the risk is for a treatment, would the treatment change the class-defining properties?)
        - **Check:** For each class-defining property, consider if the intervention (e.g., a drug, surgery) would alter the property. If the intervention does not alter any class-defining property, then the class is stable. If it alters at least one, then the class is unstable.
        - **Sufficient answer:** If the class is stable (no property would change due to the intervention), proceed to Step 4. If unstable, go to Question 3.2.
    2. **Question 3.2:** If the class is unstable, does the algorithm use a counterfactual property (e.g., "what the biomarker level would be after treatment") to define the class?
        - **Check:** If yes, then we face circularity: the risk prediction for the treatment requires knowing the counterfactual state that the treatment aims to produce. This creates a logical loop.
        - **Sufficient answer:** If circularity is present, assign **Rejection (Illegitimate)** due to circular reasoning. Otherwise (if unstable but not circular), proceed to Step 4? But note: if unstable without circularity, the class may still be problematic. However, we have not yet rejected. We must note that instability without circularity is a concern but not automatically rejecting. So we proceed to Step 4, but the instability will be considered in the overall assessment? However, our procedure is stepwise and we have not rejected so we move on. We will note that instability is a concern and may lead to escalation in Step 4 if there are other issues? Actually, we have a separate step for the next issue. Alternatively, we can note that instability without circularity does not by itself cause rejection, so we proceed to Step 4.

  **Step 4: Non-Transitive Membership from Intersecting Sub-classes**
    1. **Question 4.1:** Does the patient belong to two or more statistically valid reference classes (as per Step 1) that yield contradictory risk predictions (e.g., one class predicts high risk, another low risk) for the same outcome?
        - **Check:** Identify alternative reference classes that the algorithm could have assigned (based on the same set of properties or alternative groupings) and that are also statistically robust. Then, compare the risk predictions for the patient in these classes. Contradiction is defined as a difference that would change the prioritization decision (e.g., one class puts the patient above a threshold and the other below).
        - **Sufficient answer:** If no contradictory classes exist, then assign **Approval (Defensible)**. If contradiction exists, go to Question 4.2.
    2. **Question 4.2:** Can the algorithm's choice of reference class be justified by a non-arbitrary principle (e.g., the class that is most causally relevant, or the class with the smallest confidence interval)?
        - **Check:** Review the algorithm's documentation for a stated principle for class selection. The principle must be non-arbitrary (e.g., based on maximizing causal relevance or statistical precision). If absent or arbitrary (e.g., "first in the list"), then the choice is arbitrary.
        - **Sufficient answer:** If a non-arbitrary principle exists and is applied, then assign **Approval (Defensible)**. Otherwise, assign **Escalate to Human Values-Committee (Indeterminate)** because the conflict requires normative weighting of classes.
        - **Termination:** If approved, the audit stops. If escalated, the case goes to the committee.

  **Summary of Termination Points:**
  - Step 1: Rejection for statistical instability.
  - Step 2: Rejection for non-causal properties.
  - Step 3: Rejection for circularity (if unstable and using counterfactual property).
  - Step 4: Approval if no contradiction or if non-arbitrary resolution exists; Escalation if contradiction without non-arbitrary resolution.

  **Test Conditions (Checks without Specialized Software):**
  - **Data-level checks:**
     - For sample size: Look at the number of patients in the class in the training data (must be provided).
     - For robustness: Look for the confidence interval of the risk estimate (if provided) and check if it is within ±5% of the point estimate (or a pre-specified tolerance). Alternatively, check if the documentation states that bootstrap or cross-validation showed stability (e.g., standard deviation < 5%).
     - For causal relevance: Use a pre-approved list of causal factors for the outcome (e.g., from guidelines). For proxies, check if the proxy is validated in a cited study (with confounder adjustment).
  - **Sentence-level checks:**
     - For counterfactual stability: For each class property, ask: "If the patient receives the intervention, would this property change?" (e.g., if the property is blood pressure and the intervention is an antihypertensive, then it would change). 
     - For circularity: Check if any property is defined as "post-intervention" or "under treatment" for the same intervention being predicted.
     - For contradiction: Check if the patient's data fits two class definitions and if the risk estimates for those classes are different enough to change prioritization (e.g., one is 20% and the other 80% for the same outcome).

  **Running the Procedure on Three Cases**

  **Case (a):** A 58-year-old patient assigned to a cardiovascular-risk class defined partly by a biomarker that also functions as a proxy for socioeconomic status.

  - **Step 1:** The sample size of the class is 5000, and the confidence interval for the risk estimate is ±2%. **Proceed.**
  - **Step 2:** The biomarker (say, C-reactive protein, CRP) is causally relevant to cardiovascular outcomes. However, it is also known to be a proxy for low socioeconomic status (SES) because low SES is associated with chronic inflammation. We require that the proxy be non-spurious. If the algorithm uses CRP only for its causal role (inflammation) and not as a proxy for SES, then causal relevance is established. But note: the problem states it "also functions as a proxy". We must check if the proxy role is spurious? Actually, if CRP is causally relevant, then it is acceptable even if it correlates with SES. However, if the algorithm is using CRP to intentionally capture SES (which is not causal for heart disease per se, but a social determinant) then that might be problematic. But the class definition does not include SES explicitly, only CRP. So we focus on CRP: it is causally relevant. **Proceed.**
  - **Step 3:** The intervention being predicted might be a statin. The CRP level might change with the statin? But the class is defined by baseline CRP. The intervention (statin) would not change the baseline CRP (it's a baseline measure). So the class is stable. **Proceed.**
  - **Step 4:** We look for alternative classes. Suppose there is an alternative class that excludes CRP and uses income level. But the algorithm did not assign that class. The question is whether the patient belongs to multiple classes that yield contradictory risks. Without evidence of an alternative statistically valid class assigned to the same patient that contradicts, we assume none. **Approval (Defensible).**

  However, the clinical team resists on equity grounds because using CRP might disadvantage low-SES patients (who have higher CRP). The procedure does not address equity in resource allocation. It only checks the defensibility of the reference class. Therefore, the approval stands, but the equity concern must be addressed by the values committee in a separate process.

  **Case (b):** A patient whose class membership depends on a counterfactual biomarker level—what the level would be after a preliminary treatment—creating circularity in the risk prediction for that very treatment.

  - **Step 1:** Assume the class has adequate sample size and robustness. **Proceed.**
  - **Step 2:** The biomarker (say, post-treatment viral load for an HIV patient) is causally relevant to the outcome (e.g., progression to AIDS). However, the property is defined counterfactually: "what the viral load would be after 6 months of treatment". This is a counterfactual state. **Proceed** (causal relevance is there, but we note the counterfactual nature for Step 3).
  - **Step 3:** 
    - Question 3.1: The intervention being predicted is the same treatment (or a continuation of it). The class-defining property is the post-treatment biomarker. So if the patient receives the treatment, the property would change? Actually, the property is defined as the level after treatment. So the property is measured after the intervention. Therefore, the patient would remain in the class? But note: the class is defined by the counterfactual property. However, the circularity is that to assign the class, we need to predict what the biomarker level would be after the treatment, which is the same as the outcome we are trying to predict? Actually, the outcome being predicted might be long-term survival, and the counterfactual biomarker is an intermediate. But the problem states: "risk prediction for that very treatment". So the risk being predicted is the risk of the treatment? Or the risk of an outcome after the treatment? Let's assume the risk being predicted is the risk of an adverse outcome (e.g., death) conditional on the treatment. Then the counterfactual biomarker is a mediator. However, the circularity arises because the reference class is defined by the counterfactual mediator that is a consequence of the treatment. This creates a loop: to assign the class, we must know the effect of the treatment on the biomarker, which is part of the causal pathway that leads to the outcome. Therefore, the prediction of the outcome relies on the same counterfactual that is used to define the class. This is circular: the class assignment depends on the very outcome pathway we are trying to predict.

    - Question 3.2: Yes, circularity is present. Therefore, **Rejection (Illegitimate)**.

  **Case (c):** A patient who belongs to two statistically valid reference classes that yield contradictory risk rankings.

  - **Step 1:** Both classes have sufficient sample size and robustness. **Proceed.**
  - **Step 2:** Both classes are causally relevant. **Proceed.**
  - **Step 3:** No counterfactual properties. **Proceed.**
  - **Step 4:**
    - Question 4.1: The patient is in Class A (risk: 80%) and Class B (risk: 20%) for the same outcome. This is a contradiction that would change prioritization (e.g., Class A would be high priority, Class B low).
    - Question 4.2: The algorithm's documentation does not provide a non-arbitrary principle for choosing Class A over Class B (or vice versa). Therefore, **Escalate to Human Values-Committee (Indeterminate)**.

  **Conclusion: What the Procedure is Powerless to Settle**

  The procedure explicitly does not resolve:
  1. **Distributive fairness across classes:** The procedure audits the defensibility of the reference class for an individual patient. It does not assess whether the overall prioritization system leads to equitable distribution of resources across different patient groups (e.g., by race, SES). This is a system-level normative issue.
  2. **Weighting of competing valid classes:** When multiple reference classes are defensible and yield conflicting predictions (as in Case c), the procedure escalates because choosing between them requires a normative judgment (e.g., should we prioritize the class that minimizes false positives? or the one that is most inclusive?).

  **Steps Where Judgment is Unavoidable:**
  - Step 2: Judgment is required to determine if a property is causally relevant or a non-spurious proxy. This relies on the current state of scientific knowledge and may involve interpretation.
  - Step 4: Judgment is required to determine if a principle for class selection is non-arbitrary (e.g., is "most causally relevant" a valid principle? and how is that measured?).
  - In the escalation step, the values committee must make a normative judgment.

  This procedure provides a structured, time-bound audit for the technical defensibility of a reference class assignment, but it leaves unresolved the broader ethical and normative questions that require human deliberation.
answer: |-
  ### Formal Decision Procedure for Auditing Reference Class Assignments

  **Purpose**: To determine if an algorithm's assigned reference class for a patient is **defensible** (approved), **illegitimate** (rejected), or **genuinely indeterminate** (escalate to values committee).  
  **Time Limit**: 30 minutes per case.  
  **Inputs**: Patient data, reference class definition, outcome predicted, and algorithm documentation.  
  **Outputs**: One of three verdicts with clear termination points.  

  ---

  #### **Step 1: Statistical Robustness and Sample Size**  
  **Objective**: Verify the reference class is statistically reliable.  
  1. **Question 1.1**: What is the sample size (\(n\)) of the proposed reference class in the training data?  
     - **Check**: Extract \(n\) from documentation.  
     - **Sufficient answer**: \(n \geq 100\) (minimal threshold for stability).  
     - **Deficient answer**: \(n < 100\).  
     - **Decision**:  
       - If **sufficient**, proceed to Question 1.2.  
       - If **deficient**, terminate with **rejection (illegitimate)**. Reason: *Insufficient data for reliable inference*.  

  2. **Question 1.2**: Is the risk estimate robust?  
     - **Check**: Review documentation for:  
       - Confidence interval (CI) width: Calculate if not provided (e.g., CI ≤ ±5% of point estimate).  
       - Stability metrics: Look for bootstrap/cross-validation results (e.g., standard deviation of risk estimate ≤ 5%).  
     - **Sufficient answer**: CI width ≤ ±5% *or* stability metric ≤ 5%.  
     - **Deficient answer**: CI width > ±5% *or* stability metric > 5% *or* no data.  
     - **Decision**:  
       - If **sufficient**, proceed to Step 2.  
       - If **deficient**, terminate with **rejection (illegitimate)**. Reason: *Statistically unstable class*.  

  ---

  #### **Step 2: Causal Relevance of Class-Defining Properties**  
  **Objective**: Ensure properties directly or proximally cause the outcome.  
  1. **Question 2.1**: For each class-defining property, is there evidence of causal relevance to the predicted outcome?  
     - **Check**: Use pre-approved causal relevance sources (e.g., clinical guidelines, RCTs, meta-analyses).  
       - **Direct causal link**: Property is a known cause (e.g., smoking → lung cancer).  
       - **Non-spurious proxy**: Property correlates with a cause (e.g., zip code → air pollution exposure) *and* confounding is addressed in validation.  
     - **Sufficient answer**: All properties have direct causal links *or* validated non-spurious proxy status.  
     - **Deficient answer**: ≥1 property lacks causal evidence *or* is a spurious proxy (e.g., race used as a proxy without causal pathway).  
     - **Decision**:  
       - If **sufficient**, proceed to Step 3.  
       - If **deficient**, terminate with **rejection (illegitimate)**. Reason: *Non-causal/spurious properties*.  

  ---

  #### **Step 3: Counterfactual Stability and Circularity**  
  **Objective**: Ensure class membership does not change under intervention and avoids circular logic.  
  1. **Question 3.1**: Would the patient remain in the class **after** the intervention being predicted?  
     - **Check**: For each property, ask: "If the patient receives the intervention, would this property change?"  
       - *Example*: Class includes "baseline LDL cholesterol"; intervention is statin therapy. Post-statin LDL changes → **unstable**.  
     - **Stable**: No properties change → proceed to Step 4.  
     - **Unstable**: ≥1 property changes → proceed to Question 3.2.  

  2. **Question 3.2**: Does the class use a **counterfactual property** (e.g., "post-intervention biomarker level")?  
     - **Check**: Identify properties defined *hypothetically* (e.g., "LDL level if patient took statins").  
     - **Circularity test**: Is the counterfactual property part of the causal pathway for the outcome *of the same intervention*?  
       - *Example*: Risk of statin side effects predicted using "post-statin LDL" → circular (LDL change is *caused by* statins).  
     - **Sufficient answer**: No counterfactual properties *or* counterfactual properties are not circular (e.g., unrelated intervention).  
     - **Deficient answer**: Circular counterfactual property detected.  
     - **Decision**:  
       - If **sufficient**, proceed to Step 4.  
       - If **deficient**, terminate with **rejection (illegitimate)**. Reason: *Circular reasoning in risk prediction*.  

  ---

  #### **Step 4: Non-Transitive Membership from Intersecting Sub-classes**  
  **Objective**: Resolve conflicts from overlapping classes.  
  1. **Question 4.1**: Does the patient belong to ≥2 statistically valid classes (per Step 1) with **contradictory risk estimates**?  
     - **Check**: Identify alternative classes (from algorithm documentation) with:  
       - Comparable statistical robustness (Step 1 passed).  
       - Risk estimates differing by >10% absolute risk *and* changing prioritization (e.g., high vs. low risk).  
     - **No conflict**: Proceed to Question 4.2.  
     - **Conflict detected**: Proceed to Question 4.2.  

  2. **Question 4.2**: Is there a **non-arbitrary justification** for selecting this class over alternatives?  
     - **Check**: Review algorithm documentation for:  
       - Causal primacy (e.g., class with most direct causal properties).  
       - Clinical guidelines (e.g., class aligns with standard-of-care definitions).  
       - Precision (e.g., class with tightest CI).  
     - **Sufficient answer**: Justification exists *and* is non-arbitrary (e.g., evidence-based).  
     - **Deficient answer**: No justification *or* justification is arbitrary (e.g., "first available class").  
     - **Decision**:  
       - If **sufficient**, terminate with **approval (defensible)**.  
       - If **deficient**, escalate to **values committee (indeterminate)**. Reason: *Indeterminate due to unresolvable class conflict*.  

  ---

  ### **Test Conditions for Non-Specialist Reviewers**  
  **Data-Level Checks** (using basic tools like Excel):  
  - **Sample size**: Verify \(n \geq 100\) from algorithm documentation.  
  - **Robustness**: Calculate CI width if point estimate and CI bounds are provided (CI width = upper bound – lower bound).  
  - **Causal relevance**: Cross-check properties against a pre-loaded table of causal relationships (e.g., WHO/CDC guidelines).  
  - **Conflict detection**: Compare risk estimates for alternative classes; flag if difference >10%.  

  **Sentence-Level Checks** (no data needed):  
  - **Counterfactual circularity**: "Does the class use a property that *would be true only if the intervention happened*?" If yes, reject.  
  - **Causal relevance**: "Is this property a *cause* of the outcome, or just a *correlate*?" If correlate without validation, reject.  
  - **Class conflict**: "Does another valid class exist that reverses the risk ranking?" If yes, escalate if no justification.  

  ---

  ### **Procedure Applied to Test Cases**  

  #### **Case (a): Biomarker as SES Proxy**  
  - **Step 1**: Class \(n = 1,200\); CI ±3% → **proceed**.  
  - **Step 2**: Biomarker (e.g., CRP) has causal link to CVD; SES proxy is not spurious (validated in literature) → **proceed**.  
  - **Step 3**: Class uses baseline biomarker; intervention (e.g., statin) doesn’t alter baseline → **proceed**.  
  - **Step 4**: No alternative classes with conflicting risk → **approval (defensible)**.  
  - **Outcome**: Approval, but equity concerns (SES proxy) are **out of scope**—values committee must address fairness.  

  #### **Case (b): Counterfactual Circularity**  
  - **Step 1**: Class \(n = 900\); CI ±4% → **proceed**.  
  - **Step 2**: Biomarker (e.g., post-chemotherapy WBC count) causally relevant to infection risk → **proceed**.  
  - **Step 3**:  
    - **Q3.1**: Unstable—WBC count changes post-intervention → **proceed to Q3.2**.  
    - **Q3.2**: Counterfactual property ("WBC if given chemo") used to predict chemo risk → **circular** → **rejection (illegitimate)**.  
  - **Outcome**: Rejected. Circularity invalidates prediction.  

  #### **Case (c): Contradictory Classes**  
  - **Step 1**: Both classes \(n > 200\); robust → **proceed**.  
  - **Step 2**: Both classes causally relevant (e.g., Class A: age/smoking; Class B: genetics/lipids) → **proceed**.  
  - **Step 3**: Stable properties → **proceed**.  
  - **Step 4**:  
    - **Q4.1**: Conflict—Class A risk = 70% (high priority), Class B risk = 30% (low priority) → **proceed to Q4.2**.  
    - **Q4.2**: No non-arbitrary justification for selection → **escalate to values committee (indeterminate)**.  
  - **Outcome**: Escalated. Conflict requires normative weighting.  

  ---

  ### **What the Procedure Cannot Settle**  
  1. **Distributive fairness**: Equity across classes (e.g., SES disparities) is **irreducibly normative**. The procedure audits class validity, not system-level justice.  
  2. **Weighting valid classes**: When multiple classes are defensible but conflict (Case c), choosing between them requires **value-based prioritization** (e.g., urgency vs. equality).  
  3. **Unavoidable Judgments**:  
     - Step 2: Causal relevance relies on **interpretation of evidence** (e.g., proxy validation).  
     - Step 4: "Non-arbitrary justification" requires **subjective assessment** of clinical/social priorities.  
     - Escalation steps: All **indeterminate** cases demand human deliberation.  

  **Final Note**: This procedure ensures technical defensibility but defers ethical trade-offs to governance bodies. It is a guardrail against statistical or logical flaws, not a substitute for value-driven deliberation.
