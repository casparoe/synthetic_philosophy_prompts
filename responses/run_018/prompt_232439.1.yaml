          Round | #A | #B | Cumulative A (after this round) | Cumulative B (after this round)

          And they update cumulative after each round.

     - At the start of each round, the recorder announces:
          "Cumulative A so far (not including this round): [cumulative A]"
          "Cumulative B so far: [cumulative B]"
          "If you choose A this round, you get [cumulative A] + 1"
          "If you choose B this round, you get [cumulative B]"

     - Players then write their choice for the round on a card and hand it to the recorder.

     - Recorder counts and records #A and #B, then updates:
          cumulative A = cumulative A + #A
          cumulative B = cumulative B + #B

     - Recorder also announces the counts for the round.

     - Players record their own payoff for the round (based on the announced cumulative at the start of the round and their choice).

     - After 10 rounds, players sum their payoffs.

     - The recorder reports the final cumulative and the winner (the player with the highest total payoff) in the group.

     - The instructor collects the results from each group.

     We then proceed to debrief.

     Note: The game might take less than 20 minutes, so we have time for debrief.

     Let's design the debrief:

     - First, ask each group: 
          - What option became dominant? 
          - Did it change during the game? 
          - What was the key moment?

     - Then, show the evolution of one group that locked in on A and one that locked in on B (if available, else use hypothetical).

     - Explain path dependence: the outcome depended on small events in the early rounds.

     - Map to concepts:

          Multiple equilibria: 
            - There are two stable outcomes: all-A or all-B.

          Increasing returns: 
            - The payoff for choosing an option increases with the number of people who chose it in the past.

          Network effects: 
            - The value of the choice depends on how many others have made the same choice.

          Switching costs: 
            - In the game, if you are in a B group and you consider switching to A, you get a low payoff (because the cumulative A is low) and you also don't influence others (unless many switch together). So the cost of switching individually is high.

          Ex ante contingency: 
            - At the start, either A or B could have won. It depended on the early distribution of choices.

          Ex post inevitability: 
            - After a few rounds, it becomes very hard to change the outcome.

     - What went wrong in the game? 
          - If a group locked in on B (the inferior standard), then collectively they would have been better off if they had all switched to A. But individually, no one had an incentive to switch. This is a coordination failure.

          - In the early rounds, players might not realize the importance of their choices for the long run.

     - How to handle it in real life? 
          - Sometimes, collective action (through government, standards bodies, or agreements) can coordinate a switch.
          - Or, if the lock-in is not too strong, a new technology might overcome.

     - Limitations of the game:
          - Timescale: real lock-in happens over long periods.
          - The game has a fixed end (round10), but in reality, the future is open-ended.
          - In real life, the standards might have inherent qualities that change over time (e.g., technological improvements) that are not captured.
          - We can rerun the game and see different outcomes, but we cannot rerun history.

     - Conclude by stating that path dependence helps explain why inferior technologies sometimes persist, and why it's hard to change established social practices.

