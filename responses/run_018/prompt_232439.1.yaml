  ### Path Dependence Classroom Game: "The Coordination Cascade"

  **Objective**: Simulate path dependence through repeated coordination with increasing returns and a small asymmetry, without mentioning the term until debrief. Students experience how early random choices lead to a "locked-in" outcome that feels inevitable but was contingent.

  **Materials**: 
  - Index cards (two per student: one labeled "Alpha," one labeled "Beta")
  - Whiteboard (to track group choices and cumulative totals)
  - Modest bonus (e.g., candy or +1% extra credit) for the highest-scoring student in each group.

  **Setup**:
  1. Divide the class into **4 groups of 5 students** each.  
  2. Assign a **recorder** in each group to tally votes and update the whiteboard.  
  3. Each student receives two index cards: "Alpha" (slightly better standard) and "Beta" (baseline standard).  
  4. Explain rules neutrally:  
     - "You’ll play 8 rounds. Each round, secretly choose **Alpha** or **Beta** by holding up a card.  
     - Your goal is to maximize your **individual round payoff** (points = cumulative past choices for your standard + a small bonus for Alpha).  
     - Payoffs:  
       - Choosing **Alpha**: `(Total Alpha choices in all prior rounds) + 1`  
       - Choosing **Beta**: `(Total Beta choices in all prior rounds)`  
     - **Example**: In Round 1, no prior choices. Alpha pays `0 + 1 = 1 point`, Beta pays `0 points`.  
     - The highest **total score** after Round 8 wins a bonus. Be self-interested!"  

  **Gameplay** (20 minutes):  
  1. **Rounds 1–3 (Contingency Phase)**:  
     - Recorder announces cumulative totals before each round (initially 0 for both).  
     - Players choose simultaneously by holding up a card. Recorder counts votes, updates whiteboard:  
       | Round | Alpha Votes | Beta Votes | Cumulative Alpha | Cumulative Beta |  
       |-------|-------------|------------|------------------|-----------------|  
       | 1     | ?           | ?          | 0 → [new total]  | 0 → [new total] |  
     - Payoffs calculated based on **prior** cumulatives (e.g., Round 2 uses Round 1’s totals).  

  2. **Rounds 4–8 (Lock-in Phase)**:  
     - Continue as above. Recorder emphasizes rising payoffs for the leading standard.  
     - **Critical asymmetry**: Alpha’s +1 bonus is negligible if Beta gains an early lead.  

  **Example Dynamics**:  
  - **Group 1 (Alpha locks in)**:  
    - Round 1: 4 choose Alpha (payoff=1), 1 chooses Beta (payoff=0). Cumulative: Alpha=4, Beta=1.  
    - Round 2: Alpha payoff=4+1=5, Beta=1 → All choose Alpha. Lock-in begins.  
  - **Group 2 (Beta locks in)**:  
    - Round 1: 3 choose Beta (payoff=0), 2 choose Alpha (payoff=1). Cumulative: Alpha=2, Beta=3.  
    - Round 2: Alpha payoff=2+1=3, Beta=3 → Tie. If 3+ choose Beta again, Beta pulls ahead. By Round 4, switching to Alpha is irrational (e.g., 20 vs. 3+1).  

  **Debrief** (40 minutes):  
  *(Reveal the term "path dependence" and map gameplay to theory)*  

  1. **Core Experience Recap**:  
     - "In early rounds (1–3), outcomes were fluid. By Round 8, did your group’s dominant standard feel inevitable? Yet, if we re-ran it, could Beta have won?"  
     - Highlight groups with divergent outcomes: "Why did Group 1 lock in Alpha, while Group 2 locked in Beta?"  

  2. **Map Game to Formal Concepts**:  
     - **Multiple Equilibria**: "Two stable outcomes were possible: all-Alpha or all-Beta. Both are Nash equilibria (no one gains by switching alone)."  
     - **Increasing Returns/Network Effects**: "Payoffs rose with past adoptions. Choosing Alpha/Beta became more valuable as others did the same."  
     - **Small Asymmetry & Contingency**: "Alpha’s +1 bonus was too small to override Beta’s early lead. Round 1 randomness decided the path."  
     - **Switching Costs**: "Later, switching to the minority standard meant losing points (e.g., 20 vs. 3+1). Individual rationality trapped groups in suboptimal lock-in."  
     - **Ex Ante Contingency vs. Ex Post Inevitability**: "Early on, tiny shifts (e.g., 1 vote) could change history. Later, the cost of reversal was prohibitive."  

  3. **Predictable Problems & Solutions**:  
     - **Problem 1: Overcommitting early**. "Some groups coordinated on Alpha too fast, ignoring Beta’s potential lead. Solution: Delay consensus until asymmetry is tested."  
     - **Problem 2: Refusing to switch**. "Even when all switching to Alpha would raise collective payoffs, no one dared. Solution: External coordination (e.g., agreements, policy)."  

  4. **Limitations of the Game**:  
     - "Real-world lock-in operates over **decades, not minutes**. Switching costs involve culture/infrastructure, not just points."  
     - "History isn’t re-runnable. We saw 4 parallel 'universes,' but societies live one path with no counterfactuals."  
     - "Standards have intrinsic qualities; here, only network effects mattered."  

  **Closing Statement**:  
  "This game shows how **randomness** and **self-reinforcement** create path dependence. Early flexibility hardens into rigidity, making the outcome feel inevitable—yet it emerged from tiny, contingent choices. In social science, this explains why inferior technologies (e.g., QWERTY keyboards) or institutions persist. But remember: history’s lock-in is messier, slower, and shaped by power and innovation. Your task is to spot these dynamics in the wild!"  

  **Time Allocation**:  
  - Setup: 5 min  
  - Gameplay: 20 min (8 rounds × 2.5 min)  
  - Debrief: 40 min  
  - Buffer: 10 min  

  **Outcome**: Students viscerally grasp the tension between contingency and inevitability, priming them to analyze real-world path dependence in technology, economics, and institutions.
