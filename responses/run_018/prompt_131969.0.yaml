prompt: |-
  In my course on value pluralism we have been working through Ruth Chang’s idea of hard choices and Raz’s account of incommensurability, and I am trying to understand an institutional split that seems to presuppose one view in one domain and reject it in another. In human-subjects research ethics, institutional review boards typically operate with what looks like a lexical veto structure: if a protocol violates informed consent or exposes participants to disproportionate risk, it is rejected outright, regardless of how large the expected scientific or social benefit might be. The harm and the good are not balanced on a common scale; they are evaluated on independent tracks with disqualifying conditions. By contrast, the same health systems often use cost-effectiveness analysis—cost per QALY, for instance—to aggregate lives saved and resources spent into a single metric for public-health funding decisions. What philosophical commitments about value comparison does this divergence presuppose? Does the IRB practice assume that autonomy and welfare are genuinely incommensurable, or does it merely reflect a practical refusal to compare them? Could a defender of hard choices endorse the lexical structure in research ethics while rejecting aggregation in health policy, or is the split just institutional convenience with no coherent philosophical basis? Reconstruct the implicit theory of value that licenses treating these two domains differently, distinguish what the practice strictly requires from what it merely accommodates, and say what would have to change in either practice if we replaced the implicit view with a consistently comparativist or consistently non-comparativist framework.
reasoning: |-
  Okay, the user is grappling with a fascinating tension between two institutional approaches to value conflicts in healthcare ethics. They're noticing that research ethics (IRBs) treats autonomy and risk as absolute vetoes, while health policy uses cost-effectiveness metrics that aggregate everything into a single scale. 

  Hmm, this connects deeply to Chang's work on hard choices and Raz's incommensurability theory. The user seems well-versed in the philosophical concepts but is struggling with their inconsistent application. That institutional disconnect must feel jarring - like seeing two departments in the same hospital operating with fundamentally different moral grammars.

  Let me unpack the implicit value theories. IRBs aren't just being cautious; their structure suggests a Raz-style view where certain values (autonomy, bodily integrity) create discontinuous "protected reasons" that trump consequences. Whereas QALY calculations assume all values are commensurable through the common currency of welfare. 

  The user's deeper question might be: "Is this split philosophically defensible or just bureaucratic hypocrisy?" That's sharp. We could defend it through value pluralism - different contexts activate different normative frameworks. Research involves direct bodily intrusion where autonomy violations are constitutive harms, while population-level resource allocation deals with aggregated welfare impacts. 

  But the tension remains. If we forced consistency: applying IRB logic to public health would paralyze vaccination programs over minor consent issues, while using QALY logic in research could justify horrific human experiments. Neither works. 

  What's illuminating is how both systems reveal the limits of comparison. IRBs show that some values resist trade-offs, while QALYs expose how we must compare the incomparable in resource scarcity. The practices coexist precisely because each handles what the other cannot. 

  The user's challenge to "reconstruct the implicit theory" is spot-on. I should emphasize that the divergence isn't inconsistency but contextual intelligence - these institutions manage different types of moral loss. Research ethics treats autonomy violations as non-fungible wrongs, while health policy treats statistical lives as fungible units. Both make sense in their spheres, but neither could govern the other's domain without catastrophe.
answer: |-
  Your observation captures a profound tension in applied ethics—one revealing divergent philosophical commitments about value comparison. Let's reconstruct the implicit theories, distinguish strict requirements from accommodations, and explore consistency demands.

  ### Philosophical Commitments in Each Domain
  1. **IRB Practice (Lexical Veto)**:  
     - **Presupposes Raz-Style Incommensurability**: Autonomy and bodily integrity are treated as *categorically distinct* from welfare/benefit. Violations create moral wrongs that cannot be "outweighed" by benefits, as no common metric exists. This mirrors Raz's view of incommensurability as a *structural feature* of certain values.  
     - **Protected Reasons**: Harm principles act as exclusionary reasons (à la Raz), blocking cost-benefit calculations.  
     - **Chang Compatibility**: Chang's "hard choices" framework could endorse this by arguing that comparing autonomy violation to scientific gain involves distinct "normative grounds" lacking a covering value. The lexical veto avoids false precision in comparing incommensurables.

  2. **Cost-Effectiveness Analysis (CEA)**:  
     - **Presupposes Commensurability**: Implicitly treats life-years, health states, and resources as reducible to a common scale (e.g., QALYs). This assumes:  
       - **Consequentialist Aggregation**: Outcomes are comparable and additive.  
       - **Fungibility of Values**: Health outcomes and monetary costs share a unified normative currency.  
     - **Denies Incommensurability**: Rejects the idea that saving a life is categorically distinct from spending $X—it quantifies trade-offs.

  ### The Institutional Split: Coherence or Convenience?
  - **Defensible Pluralism**: A Changian could consistently endorse both approaches by arguing they address **different normative contexts**:  
    - **IRBs**: Govern *intrinsic violations* (e.g., non-consensual bodily intrusion). Here, autonomy is a "constraint" (deontological), not a value to maximize.  
    - **CEA**: Addresses *distributive decisions* under scarcity. No direct violation occurs; trade-offs between potential benefits are unavoidable.  
    *This reflects contextual moral reasoning: Violating constraints is distinct from allocating impersonal goods.*  

  - **Inconsistency Critique**:  
    If bodily integrity is lexically protected in research, why not in treatment funding (e.g., denying a life-saving drug due to cost)? The practices *could* reflect institutional convenience:  
    - IRBs respond to historical abuses (Nuremberg, Tuskegee), favoring prohibitions.  
    - Health systems face budget constraints, favoring aggregation.  
    But this reduces ethics to path dependency, lacking philosophical coherence.

  ### Reconstructing the Implicit Theory of Value
  The divergence licenses a **hybrid theory**:  
  - **Domain-Specific Incommensurability**: Some values (autonomy, basic rights) are incomparable with welfare *when directly violated*, but welfare values become commensurable *at scale* in allocation contexts.  
  - **Practical Recognition of Limits**: Lexical vetoes avoid dangerous quantification (e.g., "How much non-consent is acceptable for cancer cure?"), while CEA acknowledges that *not* quantifying trade-offs in allocation leads to greater harm.  

  ### Consequences of Imposing Consistency
  1. **Consistently Non-Comparativist (Raz/Chang)**:  
     - **IRBs**: Unchanged (lexical vetoes preserved).  
     - **Health Policy**: Abandon QALYs. Funding decisions become "hard choices" without aggregation. Practically, this might mean:  
       - Procedural approaches (e.g., democratic deliberation).  
       - Thresholds (e.g., no life-saving treatment denied below $X cost/QALY), but thresholds themselves may require comparison.  
     *Result*: More paralysis in health prioritization; explicit acceptance of unresolved value conflicts.

  2. **Consistently Comparativist (Utilitarian/CEA)**:  
     - **IRBs**: Replace vetoes with trade-offs (e.g., allow non-consensual research if benefits sufficiently large). This risks justifying extreme abuses ("greater good" arguments).  
     - **Health Policy**: Unchanged.  
     *Result*: Undermines core research ethics principles; ignores the special status of bodily autonomy.

  ### What Practice Strictly Requires vs. Accommodates
  | **Domain**         | **Strict Requirement**                          | **Accommodation**                                  |  
  |---------------------|------------------------------------------------|---------------------------------------------------|  
  | **IRBs**            | Autonomy/risk violations cannot be traded off. | *How* risks/benefits are defined (e.g., risk thresholds). |  
  | **CEA**             | Resources and outcomes must be compared.       | Choice of metric (QALY vs. DALY); threshold values. |  

  ### Conclusion
  The split reflects a **context-sensitive pluralism** that is philosophically defensible: IRBs treat autonomy and bodily integrity as inviolable constraints, while CEA treats health outcomes as commensurable under scarcity. This aligns with Chang’s view that some domains involve "structured" comparisons (CEA), while others involve "unstructured" conflicts (research ethics). The inconsistency arises only if one insists on a universal theory of value—but pluralists argue that such insistence misunderstands the nature of moral reality. To impose consistency would either erode fundamental protections (if comparativist) or cripple resource allocation (if non-comparativist). The challenge is not to eliminate the divergence, but to articulate its normative boundaries more rigorously—e.g., why bodily intrusion in research is distinct from opportunity costs in funding.
