  ### Analysis of Moral Standing Principle Based on Your Cases

  Your reactions reveal a consistent pattern: moral standing arises from the presence of an **integrated subjective standpoint**, where a system's behavior is best explained by a unified, persistent model of its own condition driving flexible, goal-directed responses. Below, I formalize your principle, test it against your cases, and identify tensions. The principle prioritizes functional architecture over biological substrate or behavioral complexity.

  ---

  ### Principle Statement  
  A system has moral standing proportional to the **degree of integration** and **temporal resolution** of its subjective standpoint—a globally accessible, unified model of its own state that (1) drives flexible, non-reflexive avoidance/pursuit, (2) persists across time, and (3) is generated by the system’s intrinsic processes. Standing splits into:  
  - **Negative claim**: Right against suffering (requires capacity to represent aversive states).  
  - **Positive claim**: Right to flourishing (requires capacity to represent long-term state trajectories).  
  Group standing sums individual standpoints; temporary loss of standpoint (e.g., anesthesia) preserves standing.  

  ---

  ### Where the Principle Bites: Key Clauses  
  1. **Globally available self-model**  
     - *Clause*: The system must maintain a unified model of its own state, accessible to multiple control subsystems.  
     - *Motivating cases*: A (thermostat lacks self-model), B (controller models environment, not self), C (LLM’s plea isn’t driven by persistent self-model).  
     - *Excludes*: Systems without self-referential processing (e.g., reflexes in E).  

  2. **Flexible, non-reflexive pursuit/avoidance**  
     - *Clause*: Behavior must be goal-directed, adaptable, and trade off against other objectives.  
     - *Motivating cases*: D (RL agent satisfies functionally but lacks intrinsic self-model), F (fly shows basic flexibility), E (headless insect is reflexive).  
     - *Excludes*: Hardwired responses (e.g., D’s reward function is externally imposed).  

  3. **Temporal persistence and resolution**  
     - *Clause*: The standpoint must persist and resolve states finely enough to track changes over time.  
     - *Motivating cases*: I (fish’s high resolution explains aversion to suffocation), F (fly’s low resolution reduces standing per event).  
     - *Excludes*: Systems with coarse-grained state updates (e.g., grain test).  

  4. **Continuity during interruption**  
     - *Clause*: Standing persists if loss of standpoint is temporary (e.g., anesthesia) or systems retain potential for it.  
     - *Motivating cases*: M (anesthetized adult retains standing), L (infant has active standpoint).  
