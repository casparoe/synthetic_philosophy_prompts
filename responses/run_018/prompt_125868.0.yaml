answer: |-
  Here’s a reading of *Don Giovanni*’s final act through Bernard Williams’s lens, respecting both the opera’s dramatic complexity and his philosophical resistance to systematization:

  **Williams’s Framework Illuminating Ambivalence:**  
  Williams’s critique of ethical theory centers on its failure to capture the "thick" particularity of human attachments and the role of contingency. In the Commendatore scene, Giovanni’s refusal to repent ("*No, vecchio infatuato!*") embodies Williams’s concept of **integrity as authenticity**. His defiance isn’t principled evil but a commitment to his identity—a rejection of hypocrisy that resonates as existentially coherent, even if morally appalling. The audience’s divided response arises because Williams’s "moral psychology" prioritizes emotional truth over abstract judgment: Giovanni’s consistency—however monstrous—contrasts sharply with the surviving characters’ compromised virtues (Don Ottavio’s passivity, Elvira’s obsession, Zerlina’s pragmatism). Mozart’s music amplifies this tension: Giovanni’s terror is undercut by defiant D-minor vigor, while the Commendatore’s condemnation feels cosmically impersonal. The scene stages Williams’s claim that **opera reveals what ethical theory obscures**: the irreducibility of individual character to universal rules.

  **Moral Luck and Contingency:**  
  Giovanni’s destruction hinges entirely on **moral luck**—the statue’s supernatural intervention. Prior acts show him escaping consequences through wit, charm, and luck (e.g., the masked trio’s failed trap). His downfall isn’t inevitable; it depends on a fantastical contingency (the statue accepting his flippant invitation) beyond his control. Williams would argue this underscores life’s ethical fragility: the same character *could* have evaded punishment indefinitely. The epilogue’s tidy moral—"*Questo è il fin di chi fa mal*"—feels inadequate because it ignores this luck, retroactively framing his fate as necessary justice rather than a contingent outcome. This gap between narrative closure and lived experience exemplifies Williams’s distrust of moral systematization.

  **Does the Opera Preserve Tension or Enforce Closure?**  
  The opera **preserves tension despite the epilogue**, primarily through Mozart’s music. The survivors’ ensemble is stylistically shallow (*opera buffa* moralizing) after the profound D-minor horror of Giovanni’s demise. Its didactic tone clashes with the psychological complexity preceding it, creating ironic dissonance. Williams would note that the epilogue’s enforced closure feels artificial—a societal ritual failing to contain the preceding emotional chaos. The true climax is Giovanni’s disappearance into hell, a moment of terrifying sublimity that resists moral reduction. The surviving characters’ swift return to conventionality highlights opera’s power to stage unresolved attachments: their tidy conclusions cannot erase Elvira’s trauma or Leporello’s ambivalent grief.

  **Where the Work Resists Williams:**  
  1.  **Giovanni’s Monstrosity:** The opera insists on Giovanni’s violence (murder, attempted rape) in ways Williams’s focus on "integrity" might understate. His authenticity is inextricable from predation—a resistance to romanticizing his defiance.  
  2.  **Supernatural Justice:** The Commendatore’s divine intervention imposes cosmic order, subtly endorsing a moral framework Williams critiques. Fate, not just luck, plays a role.  
  3.  **Mozart’s Ambiguity vs. Da Ponte’s Text:** While Da Ponte’s libretto leans toward moral closure, Mozart’s music consistently undermines it (e.g., Giovanni’s death throes are harmonically unstable, not triumphant). The work’s resistance lies in this duality.

  **Bottom line:** Mozart’s music and Giovanni’s defiant authenticity sustain moral ambivalence by exposing the poverty of the epilogue’s systematic judgment, revealing through contingency and emotional depth how Williams’s "unresolved attachments" haunt even opera’s most conventional closures.
