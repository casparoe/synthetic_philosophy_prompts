  **MEMORANDUM**  
  To: Consortium Oversight Committee  
  From: Institutional Review Board, Neurotechnology Consortium  
  Date: October 26, 2023  
  Subject: Decision on Protocol #NT-PDoC-114: "Detection of Partial Broadcast Events in Prolonged Disorders of Consciousness"  

  ---

  ### **I. RECOMMENDATION**  
  **Approve the study with binding conditions (Phase-Limited Approval)**.  
  **Implementation Timeline**:  
  1. **Phase 1 (Months 1–6)**: Data collection and technical validation *only*.  
  2. **Interim Review**: Full board reevaluation of preliminary data and ethical safeguards at Month 6.  
  3. **Phase 2 (Months 7–12)**: Conditional approval for phenomenological correlation sub-studies *if* Phase 1 validates detection reliability.  
  4. **Clinical Application Hold**: No use of findings in family counseling or care decisions until validated in independent cohorts (estimated 24+ months post-study).  

  ---

  ### **II. RATIONALE**  
  The board acknowledges the scientific ambition of reframing disorders of consciousness through the lens of global workspace theory (GWT) and the access-phenomenal (A-P) distinction. The researchers’ hypothesis—that "partial broadcast events" (PBEs) reflect sub-threshold information availability (*access consciousness*) without integrated subjective awareness (*phenomenal consciousness*)—poses a fundamental question about the minimal neural conditions for cognitive presence.  

  #### **A. Grounds for Conditional Approval**  
  1. **Empirical Novelty**  
     - PBEs represent a testable extension of GWT into pathological low-awareness states. Rejecting this protocol would foreclose critical data on whether sub-threshold global workspace dynamics exist.  
     - The proposed metrics (e.g., fragmented recurrent processing, aborted cross-cortical propagation) are falsifiable and grounded in established neurodynamics.  

  2. **Clinical Relevance**  
     - If validated, PBEs could inform prognosis by detecting covert cognitive processing invisible to behavioral/EEG markers. This aligns with the consortium’s mandate to reduce diagnostic uncertainty in prolonged disorders of consciousness (PDoC).  

  3. **Risk Mitigation via Phasing**  
     - Phase 1 limits risk by prohibiting clinical application while collecting essential data. Families will be explicitly informed that PBE findings *cannot* guide care decisions during this phase.  

  #### **B. Binding Conditions**  
  1. **Conceptual Safeguards**  
     - All consent forms and family communications must state: **"Partial broadcast events are an experimental construct. They do not confirm or deny subjective awareness and must not inform decisions about life-sustaining treatment."**  
     - Researchers must collaborate with philosophers of mind to design Phase 2 assays probing *potential* phenomenal correlates (e.g., via latent variable modeling of neural feedback loops).  

  2. **Methodological Rigor**  
     - PBEs must be detectable across ≥3 independent analytic pipelines to avoid algorithmic artifact bias.  
     - Phase 1 must include "ground-truth" controls (e.g., healthy subjects under anesthesia, locked-in syndrome patients) to test PBE specificity.  

  3. **Oversight Mechanism**  
     - An independent Data Safety Monitor (DSM) will audit all PBE classifications monthly.  
     - Families receiving counseling post-Phase 2 must have access to an ethics liaison unaffiliated with the study.  

  ---

  ### **III. STRONGEST CONSIDERATION OF THE DISSENTING POSITION**  
  The board recognizes substantial opposition (35% of votes) grounded in a principled critique of the A-P distinction in clinical contexts. The dissent’s strongest argument contends:  

  > **"Access consciousness without phenomenal consciousness is a category error in entities capable of subjectivity.** PBEs, by definition, lack integration into a global workspace—the very mechanism proposed to *enable* access. Detecting fragmentary information flow does not equate to ‘access for a subject.’ Without phenomenal binding, there is no ‘who’ for whom information is accessible. Using PBEs to infer ‘meaningful cognitive presence’ clinically reifies a theoretical abstraction. At best, PBEs reflect *potential* for access; at worst, they are epiphenomenal noise. Extrapolating to life-termination decisions risks catastrophic error by conflating neural debris with latent personhood."  

  This position emphasizes that the A-P distinction—while heuristically useful in cognitive science—collapses when applied to non-communicative subjects. It asserts that the absence of phenomenal consciousness (by the researchers’ own criteria) negates the ethical weight placed on PBEs.  

  ---

  ### **IV. SYNTHESIS AND PATH FORWARD**  
  The board’s decision balances scientific openness with ethical restraint. While PBEs may illuminate transitional states of information processing in PDoC, their relationship to consciousness remains unproven. **Approving only a phased protocol ensures:**  
  - Collection of pivotal data on neural thresholds of access.  
  - Rigorous validation before clinical interface.  
  - Transparent engagement with the A-P distinction’s limitations.  

  The researchers must treat PBEs as a *mechanistic question* (how degraded brains process information) rather than a *clinical verdict* (whether a patient retains "cognitive presence"). Final approval for counseling applications requires independent replication and consensus frameworks for operationalizing consciousness in PDoC.  

  ---  
  **Submitted for consortium deliberation ahead of the October 29, 2023, meeting.**  
  *Vote: 8 Approve with Conditions | 5 Reject | 0 Approve Unconditionally*  

  ---  
  **Attachments**:  
  1. Revised Protocol with Condition Implementations  
  2. Ethical Communication Guidelines for Families  
  3. DSM Appointment Procedures
