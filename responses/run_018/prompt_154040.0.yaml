    "primary_diagnosis": "formal-hidden",
    "side_a_position": "The divergence was contingent and late (e.g., California School). China (especially Yangzi Delta) had comparable economic development, market institutions, and technological capacity to Britain pre-1750. Key differences were geopolitical accidents (access to coal/colonies) and constrained fiscal-military competition in Europe.",
    "side_b_position": "The divergence was structural and early (e.g., institutionalists). China lacked critical preconditions: property rights security, scientific culture disentangled from state control, political fragmentation enabling competition, or capital markets. These were path-dependent institutional differences making Chinese industrialization improbable.",
    "hidden_question": "What constitutes a valid 'control' in a counterfactual? Specifically: (1) Are we comparing units at similar development stages or with similar institutional plasticity? (2) Must necessary/sufficient conditions be spatially bounded or globally networked? (3) Does 'China' c.1700 represent a coherent counterfactual agent given its scale/internal diversity?",
    "counterfactual_stability": "Medium instability. China is a problematic baseline due to path dependence: Qing institutions were optimized for agrarian-bureaucratic stability, lacking the competitive state system and proto-capitalist legal traditions that emerged in Europe over centuries. Altering one variable (e.g., introducing British property rights) requires implausibly many cascading changes.",
    "selection_bias_problem": "Severe. Selecting Britain *because* it industrialized embeds hindsight bias. Factors unique to Britain (e.g., cotton colonialism) are mislabeled as necessary conditions. This circularity ignores 'near misses' (e.g., Dutch Republic) and assumes China's failure needs explanation rather than Britain's success being low-probability.",
    "what_counts_as_progress": "(1) Formal causal models (e.g., Bayesian nets) incorporating path dependence and multiple interacting conditions; (2) Reframing as 'Why industrialization *when/where* it occurred?' using global conjunctural analysis; (3) Shifting focus to 'efflorescences' (Goldstone) or abortive industrializations (e.g., Song China) to identify necessary conditions without outcome bias.",
    "residue_report": "The unresolved core reveals a defect in comparative history's reliance on bilateral counterfactuals between incommensurate units. The residue points to needing: (a) clearer epistemology for historical necessity/contingency, (b) methodological tools to handle geo-historical scale differences, (c) acknowledgment that 'industrialization' was a rare, multicausal outcome not guaranteed by any single path.",
    "confidence": "high"
  }

  **Prose Summary:**  
  The Needham debate is fundamentally stalled due to hidden formal disagreements about counterfactual validity—specifically whether China c.1700 constitutes a stable comparison unit given path-dependent institutions and whether selecting Britain post-hoc biases the search for causes. While Side A emphasizes contingent factors and late divergence, Side B stresses deep structural prerequisites, but both struggle with circularity from outcome-based selection. Progress requires abandoning the bilateral "Britain vs. China" frame for multicausal, global models of conjunctural causation, using formal tools to handle path dependence. The question isn't ill-posed but demands reconceptualization: industrialization wasn't a race with predictable runners, but a low-probability event requiring alignment of multiple spatially and historically distinct processes. The residue underscores comparative history's need for more robust counterfactual frameworks beyond national units.
