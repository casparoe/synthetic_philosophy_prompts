  Hey, I'm reading about Lakatos's research programmes and I've hit a pattern I can't name. A theory has it's hard core. Data comes in that conflicts, so people don't drop the core - they add a qualifier like only works in non-living systems or masked by background noise. Standard protective belt move, right? But then they claim the updated theory successfully predicted that the effect would be missing in exactly those cases. So every failure gets rewritten as a correct prediction of the patched version, and the programme never counts as degenerating because it's always predicting the anomalies it just accomodated. Is there a specific term for this loop - where saving the core also gets counted as generating novel predictions? Or is this just degenerating research in disguise? I feel like there's a distinction here between ordinary auxilliary adjustments and this kind of retroactive credit-claiming, but I don't know if Lakatos or anyone after him carved it out.
