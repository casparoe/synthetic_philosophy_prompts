  We are constructing a reusable audit procedure for the principle of "respect for rational pedagogical agency". The procedure must have a sequence of checks that a non-philosopher can run. Each step will have:
   - A precise question
   - What counts as a sufficient answer
   - Where the procedure halts with a rejection
   - Where it hands the decision to human judgment (because values are at stake)
   - Where it permits sign-off

   We also need to distinguish:
   (a) Transparent adaptation revisable by the learner
   (b) Opaque optimisation (treating cognitive load as a variable to be managed without disclosure)
   (c) Justified paternalistic override

   Explicit criteria for:
   - "Imminent severe harm": In this context, we define it as a situation where there is a high probability of immediate (within the next few learning sessions) and significant negative consequences to the student's educational trajectory, mental health, or physical safety. Examples include: risk of self-harm due to academic stress, immediate threat of expulsion or severe academic penalty, or a health crisis (e.g., seizures triggered by stress). The evidence must be clear and based on data or expert input (e.g., a pattern of behavior that mental health professionals would recognize as dangerous).
   - "Revisability": The learner must have the ability to review, challenge, and change the algorithmic decision within a reasonable time frame (i.e., during the same learning session or immediately after) without facing significant barriers (e.g., the option is clearly presented and requires minimal effort to use, and the learner is made aware of the option).

   The audit procedure:

   Step 1: Transparency Check
     Question: Does the intervention clearly disclose to the learner, in real-time or immediately after, that an algorithmic decision has been made and the reason for it?
     Sufficient answer: Yes, if the disclosure is in plain language and includes the reason for the change (e.g., "We noticed you are struggling and have adjusted the difficulty to help you build foundational skills").
     Rejection: If no disclosure is made and the intervention is not in the category of justified paternalistic override (which we check later). Then halt and reject.
     Hand to human judgment: Not at this step. This is a factual check.
     Sign-off: Not yet.

   Step 2: Revisability Check
     Question: Does the intervention provide the learner with an immediate and easily accessible means to override the algorithm's decision?
     Sufficient answer: Yes, if there is a clear and low-effort option (e.g., one-click) to revert or change the decision, available at the time of the intervention or immediately after.
     Rejection: If no revisability is provided and the intervention is not a justified paternalistic override. Then halt and reject.
     Hand to human judgment: Not at this step. This is a factual check.
     Sign-off: Not yet.

   Step 3: Paternalistic Override Justification
     Question: Is there clear evidence of imminent severe harm that justifies an override without transparency and/or revisability?
     Sufficient answer: 
       - Evidence must be specific and based on data (e.g., patterns of behavior that are strongly correlated with severe outcomes, or direct input from a human professional) and must meet the criteria for imminent severe harm (as defined above).
       - The override must be the least intrusive option (proportionate) and must be temporary (subject to review by the learner as soon as the imminent harm is averted).
     Rejection: If the answer is no and the intervention lacks transparency or revisability (from Steps 1 and 2), then halt and reject.
     Hand to human judgment: If there is disagreement about whether the evidence meets the bar for "imminent severe harm", then hand to a human panel (e.g., including a school psychologist and an administrator) for review. But note: the procedure must be run by the ethics officer, so if the officer is uncertain, they should consult. However, the procedure design should try to minimize this. We can say: if the evidence is borderline, the officer should reject unless a clear case is made by the proposer and verified by an independent expert (but that might be beyond the scope of the 45 minutes). Alternatively, we can note that in such cases, the officer must consult a designated expert (which we build into the procedure as a hand-off to human judgment).
     Sign-off: If the answer is yes and the override meets the criteria (transparent as soon as safe, proportionate, and revisable after the imminent harm has passed), then proceed to Step 4 for the override. Otherwise, if the intervention is transparent and revisable (passed Steps 1 and 2), then proceed to Step 4.

   Step 4: Pedagogical Agency Assessment
     Question: Does the intervention honor the learner's rational self-direction by either:
        (i) aligning with the learner's expressed goals and preferences (if known), or 
        (ii) providing a clear pedagogical justification that the learner can understand and potentially challenge?
     Sufficient answer: 
        - For (i): The intervention must be consistent with goals the student has set (e.g., in their profile) or choices they have recently made (e.g., they asked for harder problems). 
        - For (ii): The justification must be pedagogically sound (e.g., based on established learning science) and presented to the learner in a way that allows them to reflect and choose differently in the future.
     Rejection: If the intervention does not meet (i) or (ii) and is not a justified paternalistic override (from Step 3), then halt and reject.
     Hand to human judgment: If there is a dispute about what counts as pedagogically sound, then the officer may need to consult a pedagogical expert. But note: the officer has limited time. We can say that if the officer, using their background, cannot determine the pedagogical soundness, they should reject unless the proposer provides a clear reference to established practice.
     Sign-off: If the intervention passes this step and either Step 3 (for override) or both Steps 1 and 2 (for transparent/revisable), then sign-off is permitted.

   Step 5: Proportionality and Minimal Intrusiveness (for paternalistic override only)
     Question: (Only if Step 3 passed) Is the override the least intrusive method available to avert the imminent severe harm?
     Sufficient answer: Yes, if the proposer can show that less intrusive alternatives (e.g., a warning message) were considered and ruled out, or if the override is clearly the minimal step needed (e.g., a temporary reduction in difficulty until the student's stress markers decrease).
