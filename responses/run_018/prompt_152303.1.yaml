     Step 3: Check override justification -> if yes, then go to Step 5. If no, and the intervention failed Step 1 or 2, then reject. If the intervention passed Steps 1 and 2, then we don't need Step 3 and go to Step 4.

     Step 4: Check pedagogical agency -> if fails and not override, reject. If passes and it's either override (from Step 3) or non-override (passed 1 and 2), then if it's non-override, sign-off; if override, then go to Step 5.

     Step 5: Check proportionality for override -> if passes, sign-off; else reject.

