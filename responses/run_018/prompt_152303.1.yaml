answer: |-
  ### Reusable Audit Procedure for Respecting Rational Pedagogical Agency  
  **Core Principle**: Learners' cognitive effort must not be treated as a mere optimisable input. Algorithmic interventions must honor rational self-direction unless overridden by **imminent severe harm** (defined as *high-probability, immediate threats to physical/mental health, academic survival, or safety—e.g., self-harm risk, expulsion, or health crises*). Overrides must be **transparent** (disclosed in plain language), **proportionate** (least intrusive option), and **revisable** (learner can challenge/alter the decision *within the same session* via low-effort, explicit actions).  

  **Procedure Flow**:  
  1. **Transparency Check**  
  2. **Revisability Check**  
  3. **Harm Justification Check** (if Steps 1–2 fail)  
  4. **Pedagogical Agency Alignment Check**  
  5. **Proportionality Check** (if Step 3 passes)  

  ---

  #### Step 1: Transparency Check  
  **Question**: *Does the intervention disclose to the learner, in real-time or immediately after, that an algorithmic change occurred and the reason for it?*  
  - **Sufficient Answer**: Yes—disclosure uses plain language, states *what changed* and *why* (e.g., "We reduced difficulty because you struggled with X").  
  - **Rejection Halt**: No disclosure → **Reject** (fails core principle).  
  - **Human Judgment**: Not applicable (factual check).  
  - **Sign-off Permitted**: Proceed to Step 2.  

  #### Step 2: Revisability Check  
  **Question**: *Does the intervention allow the learner to immediately revert or modify the algorithmic decision via a low-effort, explicit action (e.g., one-click)?*  
  - **Sufficient Answer**: Yes—option is visible, accessible ≤5 seconds post-intervention, and requires ≤2 actions (e.g., undo button).  
  - **Rejection Halt**: No revisability → **Reject**.  
  - **Human Judgment**: Not applicable (factual check).  
  - **Sign-off Permitted**: Proceed to Step 4 (if both Steps 1–2 pass).  

  #### Step 3: Harm Justification Check (Run *only* if Steps 1 or 2 failed)  
  **Question**: *Is there clear, evidence-based justification of imminent severe harm (as defined) warranting non-transparent/non-revisable override?*  
  - **Sufficient Answer**: Yes—evidence shows high-probability, immediate harm (e.g., biometric stress data + clinician input; multiple failed high-stakes assessments triggering expulsion).  
  - **Rejection Halt**: No evidence → **Reject** (violates agency without cause).  
  - **Human Judgment**: If harm evidence is ambiguous (e.g., "stress" without severity metrics), **halt and refer to school psychologist + administrator panel**.  
  - **Sign-off Permitted**: Proceed to Step 5.  

  #### Step 4: Pedagogical Agency Alignment Check  
  **Question**: *Does the intervention either (a) align with the learner’s expressed goals/preferences, or (b) provide a clear, challengeable pedagogical justification?*  
  - **Sufficient Answer**:  
    - (a) Consistency with learner’s goals (e.g., uses settings the learner explicitly chose).  
    - (b) Justification grounded in learning science (e.g., "scaffolding" cited in peer-reviewed research), presented for learner reflection.  
  - **Rejection Halt**: Neither (a) nor (b) → **Reject** (treats agency as optimisable input).  
  - **Human Judgment**: If pedagogical justification is contested (e.g., disputed theories), **halt and refer to curriculum committee**.  
  - **Sign-off Permitted**: If aligned → **Approve**.  

  #### Step 5: Proportionality Check (Run *only* if Step 3 passed)  
  **Question**: *Is the override the least intrusive option to avert the imminent harm?*  
  - **Sufficient Answer**: Yes—override is temporary, minimally disruptive (e.g., disables only specific unsafe features), and includes post-harm transparency/revisability.  
  - **Rejection Halt**: Disproportionate (e.g., locks settings for weeks) → **Reject**.  
  - **Human Judgment**: If intrusiveness is debatable (e.g., duration of override), **halt and refer to legal team + learner advocate**.  
  - **Sign-off Permitted**: If proportionate → **Approve**.  

  ---

  ### Case Reviews  
  **Proposal 1**:  
  *System detects repeated calculus failures, auto-substitutes simpler problems without notification, projects 30% retention gain.*  
  - **Step 1**: No disclosure → **Fail** → Proceed to Step 3.  
  - **Step 3**: No evidence of imminent severe harm (failure ≠ harm; no health/safety risk cited) → **Reject**.  
  - **Result**: **REJECTED**.  
  - **Efficiency Note**: You may dislike this—retention gain is efficiency-focused but violates agency without harm justification.  

  **Proposal 2**:  
  *Student requests "increase difficulty"; system detects physiological stress, maintains hard setting, sends message citing exam goals, offers one-click revert.*  
  - **Step 1**: Message explains decision → **Pass**.  
  - **Step 2**: One-click revert → **Pass**.  
  - **Step 4**: Aligns with student’s exam goal (explicitly stated); justification is challengeable → **Pass** → **Approve**.  
  - **Result**: **APPROVED**.  

  **Proposal 3**:  
  *Algorithm infers minority-language student’s easy-text choices reflect family pressure (no direct evidence), proposes override.*  
  - **Step 1**: Unclear; assume no disclosure → **Fail** → Proceed to Step 3.  
  - **Step 3**: No evidence of harm (inference ≠ "imminent severe harm") → **Reject**.  
  - **Result**: **REJECTED**.  
  - **Redesign Test** (hypothetical): If transparent/revisable (e.g., "We suggest harder texts based on Y, click to keep easy"), **Step 4** fails—override based on inferred pressure (not pedagogy/performance) disregards expressed preference.  

  ---

  ### Limitations and Judgment Calls  
  **What the procedure cannot settle**:  
  - **Ambiguous harm thresholds**: E.g., "severe stress" without clinical metrics requires human judgment (Step 3).  
  - **Pedagogical validity**: Conflicting evidence on "optimal" methods (Step 4) demands expert input.  
  - **Cultural/contextual factors**: E.g., whether family pressure constitutes harm (Step 3) needs local stakeholder input.  

  **Unavoidable professional judgment**:  
  - Step 3: Evaluating quality of harm evidence.  
  - Step 4: Assessing if pedagogical justification is "sound" or speculative.  
  - Step 5: Balancing intrusiveness against harm severity.  

  **Confidence Assessment**:  
  - **Overall Confidence**: High (95%)—procedure is grounded in standard applied ethics frameworks (e.g., Kantian autonomy vs. paternalism).  
  - **Least Certain Point**: Defining "proportionality" in Step 5 (e.g., duration of overrides). Real-world edge cases (e.g., "temporary" vs. "indefinite" blocks) may require iterative refinement.  

  ---  
  This procedure ensures efficiency never trumps agency without rigorous ethical safeguards. For contentious cases, document referrals and retain audit trails to demonstrate due diligence.
