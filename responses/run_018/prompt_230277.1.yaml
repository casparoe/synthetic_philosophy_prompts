  ---

  ### Least Confident Term and Movable Evidence  
  - **Least confident term:** Component 4 (uniform application of knowledge norm to hedged assertions), at credence 0.80. While I lean toward uniformity, the debate is underdeveloped empirically, and intuitions about hedges (e.g., "I think it's raining") vary widely.  
