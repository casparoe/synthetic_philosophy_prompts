answer: |-
  **Scenario:** A grain warehouse faces a massive weevil infestation. The manager can fumigate immediately (killing all insects painlessly) or release parasitic wasps that will slowly parasitize and kill *most* weevils over weeks, leaving a small breeding population. The scale argument highlights the astronomical number of weevils: even a tiny probability of sentience per weevil (say, 0.01%) multiplied by the billions present means *expected* suffering from slow parasitism vastly outweighs the near-certain painless death from fumigation. However, a hidden feature scales with the population: **uncertainty aggregation**. Our uncertainty about insect sentience isn't just *low probability*; it's *deep epistemic fog*. Multiplying this profound uncertainty by billions doesn't yield a reliable "expected suffering" figure; it amplifies the unreliability to the point where we cannot confidently compare the magnitude of harms between the options. The sheer scale makes the suffering calculation under uncertainty essentially meaningless.

  *   **Scale-Sensitive View (Go Fumigate):** "Billions * tiny sentience chance = massive expected suffering from slow death! Fumigation minimizes expected suffering. We *must* act on the scale; ignoring these astronomical numbers is irrational."
  *   **High-Threshold Deontology (Stop, Use Wasps):** "We are nowhere near 50% confident *any* weevil is sentient. Without that confidence, they lack moral status demanding pain-minimization. Fumigation is unnecessary killing. The wasp method controls the pest without crossing that threshold. The scale math is too unstable under radical uncertainty to override this."
  *   **Structural Feature:** **Uncertainty Aggregation.** Multiplying a fundamentally unreliable probability (deep uncertainty about sentience) by a huge number doesn't produce a robust expected value; it produces amplified noise. The reliability of the calculation collapses under the population weight.
  *   **Without the Feature:** If uncertainty *didn't* aggregate (e.g., if we had reliable, stable 0.01% probability per weevil), the scale view would reliably show fumigation minimizes expected suffering – the standard "care about bugs" result.
  *   **Scale Defender's Attack:** "This exploits a technicality! We *have* to use the best probabilities we've got, however uncertain. Ignoring scale because uncertainty is hard just buries our heads in the sand. The *potential* for vast suffering demands precautionary action (fumigation). Letting slow death happen based on an arbitrary 50% threshold is the *real* callousness when the numbers are this big."

  **Why it works:** The scale argument relies on uncertainty *behaving* like a stable probability that scales linearly. This case forces the recognition that sometimes uncertainty is too deep for that, turning the scale from a reason to act into a reason the math itself breaks down.
