prompt: |-
  I've been trying to write up notes for a seminar I'm sitting in on scientific models and explanation, and I'm stuck on the Friedman F-twist thing in a way that feels too basic to ask out loud. The debate about whether wildly unrealistic assumptions ruin a model or are totally fine as long as predictions work has been circling since the fifties, and every time I think I've pinned down what Friedman actually meant, some philosphy of science paper says it's either a tautology or a license for nonsense, while economists say philosophers are obsessed with realism when they should care about forecasting. My working hypothesis is that this isn't a single disagreement about one principle but two debates running on paralell tracks that share vocabulary: one track is about whether false premises can support true conclusions in formal inference, and the other is about whether getting causal mechanisms wrong matters if your policy predictions are accurate. But I wonder if I'm just inventing divisions to avoid admitting the sides are actually talking past each other about what 'explanation' even requires.

  So I want a diagnosis, not a survey of every interpretation of the F-twist. Are the sides divided by different standards of evidence — philosophers demanding mechanistic transparency, scientists accepting black-box accuracy — or is there a hidden empirical claim about which real-world models actually predict well despite being unrealistic? Is it verbal, with 'unrealistic' meaning false to one group and simplified-to-the-point-of-isolation to the other? And honestly, could anything end this? Would a formal result linking unrealistic premises to predictive failure in specific domains do it, or a conceptual split between explanation and prediction, or is the impasse just a sign that the question is field-specific and permanently unresolvable at the general level? I don't need a reading list or citations — I just want to know whether progress is even conceptually possible here, or if we're stuck because neither side recognizes the other question as legitimate.
