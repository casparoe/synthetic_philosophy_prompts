prompt: |-
  I'm running a philosophy club session for undergrads who've had one intro ethics class, nothin deep. Next week I want to teach indirect normativity through idealized deliberation — the idea that a norm binds your actual self not head-on but through an endorsement made by an idealized version of you (stripped of specific biasses like fatigue or craving, fully informed about downstream effects, but still recognizably you with your core commitments intact), and that this endorsement reaches back to constrain what you actually do. Don't explain the theory to me; plan the teaching arc. What has to come first so they don't immediately collapse it into "just be perfect," the one concrete example that should carry the whole thing — I'm leaning on a roommate "fridge pact" about not eating each other's leftovers, but tell me if that's too trivial and what properties it needs to work — the misconceptions they'll form in order of occurance (probably "the ideal me is just a saint" and then "this is hypocrisy with extra steps"), exactly where in the sequence to head off each one, plus one end-of-session check question that reveals whether they've grasped the indirect binding or just memorized the phrase. Also say what I should openly refuse to explain at this level — maybe actual contractualist texts? — and lead with your bottom line in the first sentence (the sequence order and whether the fridge example survives), then the reasoning, with no preamble and no restating the question.
reasoning: |-
  Okay, the user is running a philosophy club for undergrads with just one intro ethics class. They want to teach indirect normativity through idealized deliberation. The main goal is to make sure students don't misunderstand it as "just be perfect" or see it as hypocrisy. 

  First, I need to figure out the teaching sequence. The user suggested a roommate "fridge pact" example. Is that too trivial? Maybe not. It's relatable. Students deal with shared spaces and temptations. The example needs specific properties: core commitments (like fairness), biases (impulse to eat when hungry), and downstream effects (trust erosion). Those are present in the fridge scenario. So the example should work. 

  Next, the sequence. Start with a relatable dilemma to hook them. The fridge case is good here. Then introduce the idealized self without calling it that yet. Ask what they'd decide if not hungry/tired. This preempts the "saint" misconception early. After that, explain the framework formally. Emphasize that the ideal self isn't perfect, just unbiased with core values intact. 

  Common misconceptions: First, they might think the ideal self is a saint. Address this by contrasting with utilitarianism. Second, seeing it as hypocrisy. Show how core commitments make it authentic, not hypocritical. Sequence matters: tackle each misconception right after explaining the related concept. 

  Check question at the end: Ask why the actual self feels bound even when tempted. Correct answer involves core commitments and mutual recognition. Wrong answers might mention guilt or perfection. 

  What to avoid: Contractualist texts like Rawls or Scanlon. Too complex for this level. Also, don't dive into meta-ethics debates. Keep it practical. 

  User's deeper needs: They want students to grasp the indirect binding mechanism. Avoid oversimplification. The fridge example works because it's concrete but has the necessary elements. The session needs clear steps to prevent common misunderstandings and ensure conceptual understanding, not just memorization.
answer: |-
  **Teaching Arc:**  
  **Sequence Order:** Raw dilemma → pre-theoretic intuition pump → misconception head-on ("saint") → framework intro → binding mechanism → hypocrisy objection → fridge pact → check question. **Fridge example survives** with tweaks.  

  ---

  ### **1. Hook: Raw Dilemma (5 min)**  
  - Present **"Midnight Snack Temptation"**:  
    *"Roommate pact: never eat each other’s labeled leftovers. It’s 2 AM. You’re exhausted, craving pizza, yours is gone. Theirs is there. No one will know. Do you eat it?"*  
  - *Goal:* Surface intuitive tension (commitment vs. desire).  

  ### **2. Intuition Pump: "What Would You Decide If...?" (10 min)**  
  - Ask: *"Not at 2 AM, but at noon tomorrow — rested, full, knowing your roommate might move out over broken trust — would future-you endorse eating it?"*  
  - **Key move:** Isolate *core commitments* (fairness, trust) from *biases* (fatigue, craving).  
  - **Preempt "saint" misconception:** Contrast with utilitarianism. *"This isn’t ‘maximize happiness’ — it’s you, minus the craving, still valuing your friendship."*  

  ### **3. Formalize Framework (10 min)**  
  - Label: **"Ideal Deliberator"** = you + full knowledge – distorting states (stress, ignorance) + core values intact.  
  - **Emphasize:** "Core values intact" ≠ moral perfection. *"If you hate broccoli, ideal-you won’t magically love it — but they’d see stealing pizza breaks your own promise."*  
  - **Head off "saint" here:** Distinguish *idealized* (your values, optimized) vs. *ideal* (externally imposed morality).  

  ### **4. Binding Mechanism (10 min)**  
  - **Critical question:** *"Why should exhausted, pizza-craving you care what well-rested you decided?"*  
  - **Answer:** "Because core-you *recognizes* this decision as authentic. It’s not God or society — it’s **you** holding you accountable."  
  - **Analogy:** "Like regretting a drunk text: hungover-you binds to sober-you’s judgment, not a ‘better person’."  

  ### **5. Fridge Pact Deep Dive (15 min)**  
  - **Tweak example:** Add stakes. *"Roommate is your co-op housing sponsor. Breaking pact risks eviction."*  
  - **Properties needed:**  
    - Clear core commitment (mutual trust → housing stability).  
    - Bias (impulsive hunger vs. long-term consequence ignorance).  
    - Ideal self’s verdict: "Don’t eat" based on *their own* priority (keeping home).  
  - **Hypocrisy objection:** *"Isn’t this ‘do what I wish I wanted’?"*  
    - **Reframe:** "No — it’s *actual-you’s* core value (keeping your home) speaking through undistorted deliberation. Hypocrisy would be imposing *someone else’s* standard."  

  ### **6. Check Question (5 min)**  
  - **Reveals grasp of indirectness:**  
    *"Your ideal self says not to eat the pizza. When craving hits, why is ‘because I’d regret it later’* ***not enough*** *to explain indirect normativity?"*  
  - **Target misunderstanding:** If they cite "regret," they miss binding via *recognition of core self*.  
  - **Correct answer:** "Regret is consequence-focused. Indirect normativity says: *the act disrespects my own endorsed standard*, violating my core agency — even if no regret occurs."  

  ---

  ### **What to Refuse to Explain:**  
  - **Contractualism (Scanlon/Rawls):** Don’t compare to "veil of ignorance" — conflates personal idealization with impartiality.  
  - **Meta-ethics:** Sidestep "what are core commitments made of?" (desires? reasons?).  
  - **Objections:** Ignore "why idealize *this* way?" (e.g., why not exclude core values too?).  

  ### **Why This Works:**  
  - Fridge example **anchors abstraction** in bodily temptation (universal + low stakes).  
  - **Misconception sequence:**  
    1. **"Saint"**: Preempted at step 2 (intuition pump) + step 3 (core values ≠ alien morality).  
    2. **"Hypocrisy"**: Neutralized at step 5 (distinction: core self vs. wishful self).  
  - **Check question** isolates *structural binding* (authority of core self) from *consequentialism* (regret avoidance).
