answer: |-
  ### Classroom Game: Voting Leaks & Strategic Manipulation  
  **Goal:** Students experience strategic voting dynamics per the Gibbard-Satterthwaite theorem—showing no voting system is both strategy-proof and non-dictatorial for ≥3 options.  

  ---

  ### **Setup**  
  - **Projects & Fake Budget:**  
    - Fix the lounge (A)  
    - Buy shared books (B)  
    - Fund a visiting speaker (C)  
    - Each student has 30 points to allocate across A/B/C (e.g., A:15, B:10, C:5) to reflect their *true utility*. Points must sum to 30.  
  - **Voting Rules (1 round each):**  
    - **Round 1:** Borda Count (rank all projects: 1st=2 pts, 2nd=1 pt, 3rd=0 pts).  
    - **Round 2:** Condorcet (rank all projects; pairwise majority wins. *If cycles occur*, use Borda as tiebreaker).  
    - **Round 3:** Approval Voting (approve any # of projects; most approvals wins).  
  - **Payoff:**  
    - After all rounds, **one round is randomly chosen** (roll a die: 1–2=R1, 3–4=R2, 5–6=R3).  
    - Students earn points based on the *winning project in that round* and their *true utility*.  

  ---

  ### **Game Flow (60 mins)**  
  | Time  | Activity                                                                 | Instructor Notes                                                                 |
  |-------|--------------------------------------------------------------------------|----------------------------------------------------------------------------------|
  | 0-5   | **Intro & True Preferences**                                             | - Explain projects, point allocation, and voting rules.                         |
  |       | - Students secretly allocate 30 points to A/B/C (true utility). Seal in envelope. | - Emphasize: "Your goal is to maximize points. You’ll vote 3x, with different rules." |
  | 5-15  | **Round 1: Borda Count**                                                 | - Ballots: Students rank A/B/C (1st, 2nd, 3rd).                                 |
  |       | - Vote → Tally points → Announce winner.                                | - *Likely issue*: Honest outcome may be unpopular; some realize they can demote a threat. |
  | 15-25 | **Round 2: Condorcet**                                                   | - Ballots: New rankings (students may change votes).                            |
  |       | - Vote → Check pairwise wins → Resolve cycles with Borda → Announce winner. | - *Likely issue*: Cycle occurs (e.g., A>B, B>C, C>A). Tiebreaker feels unfair. |
  | 25-35 | **Round 3: Approval Voting**                                             | - Ballots: Students check projects they "approve" (any/all).                    |
  |       | - Vote → Count approvals → Announce winner.                             | - *Likely issue*: Some "bullet-vote" (approve only #1); others approve top 2 to block a loser. |
  | 35-40 | **Random Selection & Payoff**                                            | - Roll die to pick the binding round.                                           |
  |       | - Students open envelopes, calculate earnings from the winning project.  | - Ask: "Who got their top choice? Who got their last choice?"                   |
  | 40-60 | **Debrief** (Key questions → Link to theorem)                            | Keep it conversational; no lecture!                                             |

  ---

  ### **Debrief Script**  
  **Start with questions:**  
  - *"How many of you changed your votes between rounds? Why?"*  
  - *"Did anyone feel forced to lie? Give an example."*  
  - *"Which rule felt easiest to manipulate? Hardest?"*  

  **Map to Gibbard-Satterthwaite:**  
  - **Round 1 (Borda):**  
    - *"In Borda, honest rankings can backfire. If your favorite is unpopular, ranking them #1 might help your *least* favorite win. That’s strategic misrepresentation—lying to avoid a worse outcome."*  
  - **Round 2 (Condorcet):**  
    - *"Condorcet exposed a leak: Cycles! When no one project beats all others, we forced a decision with Borda (domain restriction). But that’s arbitrary—like saying no project can be ‘too divisive.’"*  
  - **Round 3 (Approval):**  
    - *"Approval felt simpler, but you still bent the truth. Bullet-voting (only approving #1) or approving a ‘lesser evil’ are both strategic. We saw one leak close (no cycles), but another opened (sincere approvals aren’t optimal)."*  

  **The Big Picture:**  
  - *"The theorem says: With 3+ options, every voting system leaks. Fixing one hole (e.g., Condorcet cycles) opens another. Unless we either...*  
    - *Restrict the domain (e.g., force everyone to rank projects similarly), OR*  
    - *Make one person a dictator (e.g., give them veto power).*  
    *No middle ground exists. Today, you felt that tension."*  

  ---

  ### **Facilitator Notes**  
  - **Strategy-Proofness vs. Pareto Efficiency:**  
    - **Strategy-proofness:** No one gains by lying (e.g., if you love A, ranking A #1 is *always* your best move, no matter what others do).  
    - **Pareto efficiency:** The outcome isn’t "stupid" (e.g., if *everyone* prefers A > B, B shouldn’t win).  
    - *Clarifier:* "They’re different! A rule can be strategy-proof but Pareto-inefficient (e.g., always pick A, ignoring votes). Or Pareto-efficient but manipulable (e.g., Borda)."  

  - **Predictable Issues & Fixes:**  
    - **Problem:** One student dominates ("If we all rank B last, A wins!"). Others feel left out.  
    - **Salvage:**  
      - Pre-game: "Vote *individually*—no collusion!"  
      - Debrief: "Did anyone resist the loudest voice? What happened?"  
      - Highlight: "The theorem says *someone* will always have incentive to manipulate, even if not everyone does."  
    - **Problem:** Confusion between rounds (e.g., Approval feels "unfair").  
    - **Salvage:** Use clear ballot templates; recap rules before each vote.  

  **Why This Works:** Students *feel* why voting rules fail—not just hear it. The random round forces investment in each vote, and the debrief ties chaos to theory.  

  ---  
  **Final Tip:** Bring envelopes for sealed utilities, dice for random selection, and a spreadsheet for quick tallying. Expect noise, laughter, and "Aha!" faces during debrief!
