prompt: |-
  I retired several years ago from experimental physics and have since been working through population ethics without publication deadlines. I am trying to reach reflective equilibrium on what I actually think about bringing people into existence, and I need help seeing whether my intuitions hang together or whether some must be revised.

  Here are my verdicts on concrete scenarios. First, learning through prenatal screening that a fetus will suffer from a condition involving constant severe pain, and terminating the pregnancy: that is not merely permissible but, to my mind, close to obligatory. Second, a well-resourced couple with every reason to expect a happy child deciding nevertheless to remain childless: this strikes me as entirely permissible, with no moral failing whatsoever. Third, knowingly conceiving a child who will suffer severely: clearly wrong. Fourth, a couple who forgo conception specifically to redirect substantial lifelong resources toward reducing severe suffering in existing populations—wild-animal suffering, climate adaptation—despite knowing that their own child would likely have led a happy life: I find this admirable, not blameworthy. Fifth, a couple using embryo selection who reject an embryo predicted to have a life of steady moderate contentment in favor of one with a high-variance prospect—either exceptional flourishing or severe suffering—solely because expected welfare is higher: here I oscillate. Part of me thinks that exposing a potential person to severe suffering for the chance of exceptional good is precisely the gamble the asymmetry should forbid; another part thinks that rejecting high-variance prospects categorically treats potential happiness as too cheap and potential suffering as the only relevant factor.

  The case I keep returning to combines the logic of the fourth and fifth. Imagine a couple in a period of high geopolitical and climatic instability who consider conceiving. They recognize that any child might suffer gravely from resource scarcity or conflict, but might also contribute to mitigation in ways that prevent far greater suffering elsewhere. I keep going back and forth on whether the possibility of that exceptional contribution can justify running the risk of severe suffering, or whether the asymmetry permits us to weigh only the downside for the potential child, leaving any upside for others to be counted separately if at all. Does that mean my approval of case four is unstable?

  Is there a principle, or a small family of principles, that accommodates cases one through four cleanly, says something precise about case five, and resolves—or at least clarifies—my oscillation in the final case? I want the principle stated precisely, with the case that motivates each clause, its verdict on at least one further scenario I have not considered (for instance, selecting among embryos solely to maximize expected welfare when no risk of suffering is present), and an honest statement of which of my verdicts it must overturn if it is to remain simple. I am not looking for named positions or a reading list; I want the internal logic of the commitments.

  Principle summary:
reasoning: |-
  Hmm, the user is a retired experimental physicist now exploring population ethics, seeking reflective equilibrium on creating new people. They've shared five concrete scenarios with their intuitive verdicts and are struggling with a sixth case combining elements of the fourth and fifth. They want a precise principle that accommodates their judgments while resolving inconsistencies.

  Breaking down their positions:
  - Scenario 1 (terminating painful life): Strongly obligatory
  - Scenario 2 (not creating happy child): Permissible
  - Scenario 3 (creating suffering child): Clearly wrong
  - Scenario 4 (forgoing child to help others): Admirable
  - Scenario 5 (high-variance embryo selection): Uncertain
  - Scenario 6 (risky conception for potential benefit): Oscillating

  Their core tension seems to be between two intuitions: 
  1) An asymmetry where avoiding suffering has priority over creating happiness (explaining cases 1-3) 
  2) Valuing altruistic sacrifice (case 4) which appears symmetric

  The oscillation in case 5/6 reveals this conflict - they're torn between "never risk suffering" and "high expected value might justify risk."

  To resolve this, I'll propose a principle with three clauses:
  1) Suffering-centered non-maleficence: Absolute prohibition on creating lives with net suffering
  2) Happiness-focused beneficence: No obligation to create happy lives, but...
  3) Altruism exception: Permissible to sacrifice potential happiness for others' benefit

  This handles:
  - Case 1 by clause 1 (avoiding suffering)
  - Case 2 by clause 2 (no obligation)
  - Case 3 by clause 1 (prohibition)
  - Case 4 by clause 3 (admirable sacrifice)

  For case 5 (high-variance selection):
  - The principle would reject it because gambling with severe suffering violates clause 1, even with higher expected welfare. This requires them to revise their occasional openness to this case.

  For their new case 6 (risky conception for potential altruism):
  - Clause 1 forbids it because the risk of severe suffering violates non-maleficence. The altruistic potential doesn't excuse creating possible suffering.

  Additional test case: Selecting among embryos solely for welfare with no suffering risk. The principle permits this under clause 2 since it involves no suffering risk and isn't obligatory.

  The key revision is rejecting any gamble with suffering, even for potential high rewards or altruism. This maintains the suffering/happiness asymmetry while accommodating their admiration for altruistic sacrifice. It resolves their oscillation by prioritizing non-maleficence absolutely.
answer: |-
  Below is a precise principle designed to capture your core verdicts while resolving the tensions in Cases 5 and 6. It draws on a modified asymmetry view that prioritizes suffering avoidance but accommodates altruistic sacrifice. The principle is **Suffering-Centered Asymmetry with Altruistic Permissions (SCAAP)**.

  ---

  ### **The SCAAP Principle**
  1. **Non-Maleficence Clause**: It is impermissible to create a person if their expected welfare is net negative *or* if there is a non-trivial risk of them experiencing severe suffering that outweighs any potential benefits *to them*.  
     *Motivation*: Case 1 (terminating a life of severe pain) and Case 3 (knowingly creating severe suffering). This clause treats severe suffering as a decisive moral barrier when imposed on a potential person.  

  2. **Beneficence Clause**: There is no obligation to create a person, even if their expected welfare is net positive.  
     *Motivation*: Case 2 (childless couple with happy prospects) – your intuition that omission is blameless.  

  3. **Altruistic Permission Clause**: It is permissible (and potentially admirable) to forgo creating a person with net-positive expected welfare *if* this directly enables the prevention of severe suffering in existing beings, and the suffering prevented is substantially greater than the welfare sacrificed.  
     *Motivation*: Case 4 (redirecting resources to reduce suffering). This clause separates the value of *preventing suffering in others* from the asymmetry governing *creation*.  

  ---

  ### **Application to Your Cases**
  - **Case 1 (terminate painful life)**: Permissible → *Clause 1* (prevents severe suffering).  
  - **Case 2 (forgo happy child)**: Permissible → *Clause 2* (no obligation to create).  
  - **Case 3 (create suffering child)**: Impermissible → *Clause 1* (severe suffering risk).  
  - **Case 4 (redirect resources altruistically)**: Admirable → *Clause 3* (suffering prevention justifies sacrifice).  
  - **Case 5 (high-variance embryo selection)**: **Impermissible**.  
    - *Why*: Clause 1 forbids risking severe suffering for the potential person, even if expected welfare is higher. The "gamble" violates non-maleficence because the child could experience uncompensated suffering. Your oscillation is resolved by rejecting risk to the potential child as inherently wrongful.  
  - **Case 6 (risky conception for potential altruism)**: **Impermissible**.  
    - *Why*: Clause 1 prohibits creating a child with non-trivial risk of severe suffering (e.g., from climate chaos). The potential upside (e.g., the child mitigating others' suffering) does not offset the risk *to the child* under non-maleficence. However, Clause 3 *allows* forgoing conception to prevent suffering *elsewhere* – but it forbids using the child as a means to that end.  

  ---

  ### **New Test Case: Welfare-Maximizing Embryo Selection (No Suffering Risk)**
  - **Scenario**: A couple selects between two embryos:  
    - Embryo A: Predictable, steady high welfare (e.g., 90/100 "flourishing units").  
    - Embryo B: Predictable, steady very high welfare (e.g., 95/100).  
    No risk of suffering exists for either. The couple selects Embryo B solely to maximize expected welfare.  
  - **SCAAP Verdict**: Permissible but not obligatory.  
    - *Why*: Clause 2 permits forgoing creation (e.g., selecting neither) but imposes no duty to maximize welfare. Selecting Embryo B is neutral or mildly positive, but Clause 1 is irrelevant (no suffering risk).  

  ---

  ### **What Must Be Revised?**
  - **Overturned Verdict**: Your occasional openness to Case 5 (high-variance selection). SCAAP forbids this categorically under Clause 1.  
  - **Why Revise?** Your intuition in Case 1–3 prioritizes suffering avoidance over welfare maximization. Gambling with suffering in Case 5 contradicts this. SCAAP formalizes the asymmetry: potential suffering is a constraint, while potential happiness is optional.  
  - **Stability of Case 4**: Your approval is stable. Clause 3 isolates altruistic sacrifice as a permission grounded in *existing* suffering reduction, separate from creation ethics.  

  ---

  ### **Logic of Commitments**
  - **Core Insight**: SCAAP splits the asymmetry into two domains:  
    - *Creation*: Governed by non-maleficence (no suffering imposition) and non-beneficence (no duty to create happiness).  
    - *Resource Allocation*: Governed by suffering-focused altruism (permitting sacrifice of potential happiness for others' sake).  
  - **Resolves Oscillation**: In Case 6, the child’s potential suffering cannot be traded against their potential altruism because Clause 1 protects the child as an end. The altruism in Case 4 works because it involves no *imposition* of risk.  
  - **Precision**: "Severe suffering" is defined as pain/disability that severely compromises minimal functioning (e.g., constant agony). "Non-trivial risk" means >5% probability (adjustable but must be de minimis).  

  This preserves your intuitive aversion to suffering, accommodates altruism, and eliminates gambles with lives. It treats potential happiness as "cheap" (no duty to create it) but potential suffering as "decisive" (a constraint). If this clashes with your openness to Case 5, that intuition must yield for coherence.
