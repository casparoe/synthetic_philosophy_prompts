answer: |-
  1. **Procedure outline**: Apply a three-step checklist requiring mutual responsiveness (agents adjust actions based on others' perceived actions/intentions), commitment to the joint activity (each aims to contribute to the shared goal), and commitment to mutual support (each is ready to assist others in achieving the goal), with explicit stop points where evidence of an agent's internal state (e.g., intent, understanding) is ambiguous, necessitating value judgment on whether that condition is met.
  2. **First case (human sets goal, algorithm adjusts sub-goals)**: This is coordinated individual action, not collective intentionality; the algorithm lacks commitment to the joint activity (it cannot reject or reinterpret the goal, merely executes predefined adjustments), with a stop point at assessing whether its goal-adjustment constitutes genuine commitment or mere rule-following.
  3. **Second case (two humans share intention, algorithm executes actions)**: This qualifies as collective intentionality among the humans (they exhibit mutual responsiveness and mutual support), while the algorithm is a tool; collective responsibility rests with the humans, conflicting with intuitive blame if the algorithm's execution error causes harm yet ethical responsibility remains human.
  4. **Third case (all share task representation, one human secretly intends failure)**: This fails collective intentionality; the deceptive human violates mutual responsiveness (actions misalign with stated intention) and commitment to joint activity, with a stop point at evaluating whether hidden intent negates apparent commitment despite shared representation.
  5. **Procedure's unavoidable limits**: The checklist cannot resolve ambiguities requiring judgment at stop points (e.g., inferring true intent in opaque systems or humans) and may assign collective responsibility where individual blame intuitively differs, especially regarding non-autonomous agents.
