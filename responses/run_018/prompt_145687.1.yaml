answer: |-
  Here are five considerations against the ledger view of retributivism, noting consensus vs. contestation:

  1.  **Metaphysical Commitment:** The ledger view requires a robust metaphysical account of desert-as-balancing (a cosmic ledger) that many philosophers reject as unsupported or incoherent; this is *contested*, with critics (e.g., Dolinko) arguing it lacks justification beyond intuition, while proponents (e.g., some readings of Moore) insist it's foundational.
  2.  **Commensurability & Desert:** It struggles to demonstrate how "a life" is the *deserved* equivalent for "a life" given vast differences in offender culpability, victim value, and context; this proportionality challenge is a *core unresolved debate* within retributivism itself, not settled.
  3.  **The Innocence Problem:** Treating the execution of an innocent solely as a "bookkeeping error" fails to capture the *distinctive, intrinsic wrong* of violating their right not to be used instrumentally for state balancing; this dismissal is *widely rejected across most theories* (liberal, consequentialist, many retributivists) as fundamentally inadequate.
  4.  **State Role & Authority:** Granting the state the authority to kill *specifically* to correct metaphysical ledger imbalances is contested; critics (e.g., Murphy, liberal theorists) argue this instrumentalizes persons and exceeds any plausible state function, while ledger retributivists *contend* it's a core duty derived from justice.
  5.  **Functional Redundancy/Creep:** The symbolic "balancing" act risks collapsing into expressive denunciation or social vindication, becoming functionally indistinguishable from consequentialist aims like societal catharsis or norm-reinforcement (deterrence-adjacent), undermining its purely retributive claim; whether this collapse *necessarily* occurs is *genuinely up for grabs*.
