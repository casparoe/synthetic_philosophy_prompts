answer: |-
  Your framework—distinguishing factual fidelity from **axiological fidelity** and identifying **counterfactual dignity harm**—offers a profound lens for analyzing *Amadeus* (1984). Forman and Shaffer’s portrayal of Salieri epitomizes the tension between these obligations, revealing deeper ethical stakes than debates over historical license alone. Let’s break this down:

  ### **1. Factual vs. Axiological Fidelity in Salieri’s Portrayal**
  - **Factual Infidelity**:  
    The film invents core elements: the poisoning plot, Salieri’s bitter envy-driven sabotage, his confession to a priest, and institutionalization. Historically, Salieri was celebrated, had a cordial (if competitive) relationship with Mozart, and died respected. These fabrications clearly violate factual fidelity.
    
  - **Axiological Infidelity**:  
    This is the film’s deeper ethical breach. Salieri’s historical persona was defined by **piety, generosity, and professional integrity**. He taught Beethoven, Liszt, and Schubert; championed charitable works; and was deeply religious. The film inverts this, making him a **self-loathing nihilist** who wages war on God via Mozart. His core values—faith, humility, mentorship—are replaced with obsessive envy and blasphemous rage. This constructs a "counterfactual self" Salieri would not recognize, violating axiological fidelity.

  ### **2. Counterfactual Dignity Harm: Key Scenes**
  - **The Confession Scene**:  
    Salieri’s claim that he murdered Mozart and "broke God's bargain" isn’t just untrue—it **replaces his devout Catholicism with theatrical despair**. The real Salieri received last rites affirming his faith; this scene imposes an existential crisis antithetical to his life’s ethos. The harm isn’t the lie itself but the **erasure of his spiritual identity**.

  - **The Humiliation Montage**:  
    Scenes of Salieri transcribing Mozart’s genius while seething reduce him to a **vessel of mediocrity**. Historically, Salieri composed innovative operas (*Tarare*) admired by Mozart. The film’s suggestion that he knew himself to be talentless attacks his self-conception as a serious artist. This is dignity harm: he’s framed as a self-aware failure, not a confident professional.

  - **Institutionalization**:  
    The fictionalized end—Salieri as a deranged outcast—denies his actual dignified retirement and legacy. It **symbolically annihilates his social and artistic contributions**, reinforcing the narrative that he was merely Mozart’s foil. The axiological violence here is total: his life’s meaning is overwritten with shame.

  ### **3. Artistic Appropriation vs. Axiological Obligations**
  The film defends its choices through:
  - **Narrative Utility**: Salieri becomes a Greek chorus, embodying universal themes of envy and divine injustice. His suffering makes Mozart’s genius legible.
  - **Subjectivity**: Old Salieri narrates his own "confession," framing it as a subjective, possibly unreliable memory.  
  Yet these devices don’t negate the dignity harm. By using Salieri’s name and position, the film binds the fiction to a real person’s legacy, exploiting his identity for thematic resonance while hollowing out his actual values. Artistic freedom here risks becoming **posthumous character assassination**.

  ### **4. Mozart’s Vulnerability to Dignity Harm**
  Mozart *is* harmed—but differently. While his music survives, the film **reduces his complexity to "divine obscenity"**: a giggling man-child vomiting profanities between strokes of genius. Historically, Mozart was shrewd, politically astute, and deeply intellectual (his letters reveal philosophical depth). The portrayal risks **trivializing his humanity**, implying genius and maturity are mutually exclusive. This *is* counterfactual dignity harm: Mozart the disciplined craftsman and social critic is erased for comedic effect. His music’s survival doesn’t immunize him; it simply makes the factual distortion less glaring.

  ### **5. What *Amadeus* Adds to the Ethical Debate**
  The film exposes gaps in traditional "accuracy vs. art" arguments by demonstrating:
  - **Emotional Coherence ≠ Ethical Immunity**: The film’s power stems from its psychological truth—envy, inadequacy, and the terror of being ordinary. Yet this resonance amplifies the axiological harm by making the false Salieri *feel* authentic.  
  - **The Burden of Survivorship**: Lesser-known figures (like Salieri) are more vulnerable to axiological erasure because their self-conception isn’t publicly defended. Mozart’s music anchors him; Salieri’s muted legacy lets the film redefine him.  
  - **Art as Existential Theft**: The deepest wrong isn’t factual error but **forcing the dead into an alien existential narrative**. Salieri isn’t just misrepresented; he’s conscripted as a pawn in a metaphysical drama he’d reject.  

  ### **Conclusion: The Core Philosophical Contribution**
  *Amadeus* shows that **posthumous ethics must account for the dead as subjects with a right to their own narrative integrity**. Beyond factual correctness, we owe the dead **axiological respect**: their self-understanding, values, and life’s meaning should constrain artistic reinterpretation. Violating this inflicts counterfactual dignity harm—a symbolic violence that uses the dead as raw material while denying them personhood. The film’s brilliance thus coexists with an ethical failure: it sacrifices Salieri’s soul to tell a story about Mozart’s, proving that emotional truth can be a form of betrayal.

  **Further Reading**:  
  - Paul Ricoeur’s *Memory, History, Forgetting* (on narrative identity)  
  - Martha Nussbaum’s "Objectification" (on reducing persons to tools)  
  - Thomas Laqueur’s *The Work of the Dead* (on obligations to the deceased)  
  - Shaffer’s own essay "In Search of a God" (admitting Salieri’s historical distortion served thematic needs)
