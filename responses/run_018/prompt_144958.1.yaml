answer: |-
  Here's a draft joint statement structured as requested, grounded in core disagreements within the literature and avoiding contested interpretations:

  **Joint Statement: Adversarial Collaboration on Mental Causation & Causal Exclusion**

  **Agreed Foundational Claims:**

  1.  **Physical Causal Closure (Completeness of Physics):** For any physical event *e* that has a cause occurring at time *t*, there is a *physical* event (or set of physical events) *p* occurring at *t* that is causally sufficient for *e*. (Both agree this is a well-supported empirical postulate central to the debate).
  2.  **Mind-Body Supervenience:** Mental properties supervene on physical properties. There can be no difference in mental properties without some difference in underlying physical properties. (Both accept non-reductive physicalism minimally requires this).
  3.  **Causal Exclusion Principle:** If an event *e* has a *sufficient* cause *c* occurring at *t*, then no event *c'* distinct from *c* occurring at *t* can be a cause of *e* (unless *c'* is related to *c* in specific, non-causal ways, such as being a part of *c* or identical to *c*). (Both accept this as a plausible principle concerning causation in general, derived from considerations of overdetermination and causal competition).
  4.  **The Exclusion Argument's Logical Structure:** The causal exclusion argument, as formulated by Jaegwon Kim, presents a genuine challenge to non-reductive physicalism. It validly deduces that if (1) Physical Closure is true, (2) Mental properties are distinct from physical properties (non-identity), and (3) Mental properties are causally efficacious, then either mental properties are identical to physical properties (reductionism) or we must accept systematic causal overdetermination. (Both agree this is the *structure* of the argument they are engaging with).
  5.  **Rejection of Systematic Overdetermination:** Widespread, non-deviant, systematic causal overdetermination of physical effects by distinct mental and physical causes is implausible and should be avoided as a solution. (Both agree this is an unacceptable outcome).
  6.  **Distinctness of Mental Properties (for Non-Reductionist):** Non-reductive physicalism is committed to mental properties being distinct from (not identical to) the specific physical properties upon which they supervene (e.g., mental properties are multiply realizable). (The Exclusionist accepts this is the *claim* the Non-Reductionist is defending).
  7.  **Goal:** Both parties seek a metaphysically coherent and empirically adequate account of mental causation consistent with physicalism.

  **Disagreements:** (Phrased as each camp accepts for their own position)

  | Disagreement Area          | Exclusionist Camp Position (Acceptable Wording)                                                                 | Non-Reductive Physicalist Camp Position (Acceptable Wording)                                                                 |
  | :------------------------- | :-------------------------------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------------------------------- |
  | **Causal Status of Non-Reductive Mental Properties** | Given Physical Closure and the Causal Exclusion Principle, non-reductive mental properties (distinct from their physical bases) are **causally redundant** and lack **distinct causal powers** for physical effects; their apparent causal efficacy is **epiphenomenal** or **inherited** entirely from the physical base. | Non-reductive mental properties possess **genuine causal efficacy** for physical effects; this efficacy is **non-redundant** and **not merely inherited**, though it is **realized by**, **dependent on**, and **constitutively tied to** the causal powers of their physical base. |
  | **Resolution Strategy**    | Avoiding systematic overdetermination and preserving genuine mental causation **requires** the **reduction** of mental properties to physical properties via identity or a sufficiently strong equivalence (e.g., functional reduction). | Genuine mental causation and the avoidance of both epiphenomenalism and overdetermination is achievable **without reduction**, through alternative accounts of causation (e.g., interventionist, difference-making, powers-based) and/or a more nuanced metaphysics of properties/levels/powers. |
  | **Adequacy of Proposed Solutions** | Non-reductive strategies (interventionism, powers, etc.) **fail to resolve** the core problem; they either **mask epiphenomenalism** by redefining "cause," **presuppose reduction**, or **merely relocate** the problem of causal competition/exclusion to another level (e.g., to the level of powers or variables). | Non-reductive strategies (interventionism, powers, etc.) **successfully dissolve or sidestep** the exclusion problem by providing an account of causation where **multiple non-identical properties/powers/variables can be difference-makers** for an effect without overdetermination, thereby **securing genuine causal efficacy** for mental properties. |

  **Cruxes: Core Points of Contention & Testable Predictions**

  1.  **Crux: Non-Redundant Efficacy & Causal Relevance**
      *   **Disagreement:** Can non-reductive mental properties be causally relevant *without* being redundant given the causal sufficiency of their physical base?
      *   **Agreed Relevant Case:** **Multiple Realizability Arguments for Non-Reduction.** Both agree that the *prima facie* case for non-reductive mental properties rests heavily on multiple realizability (MR): the idea that the same mental property (e.g., pain) can be realized by vastly different physical properties (neural, silicon, etc.).
      *   **Predictions:**
          *   *Exclusionist Prediction:* Investigations into MR cases will reveal that the *causally relevant properties* for producing the effect (e.g., pain-avoidance behavior) are *always* the *specific physical realizer properties*, not the multiply realizable mental property *as such*. The mental property's apparent causal role will be shown to be derivative or epiphenomenal. Advances in neuroscience will increasingly identify fine-grained physical properties as the true causes, undermining the causal necessity of high-level mental descriptors.
          *   *Non-Reductive Prediction:* Analysis of MR cases will show that the multiply realizable mental property (e.g., pain) is the *most appropriate* or *explanatorily indispensable* causal variable for predicting and explaining certain effects (e.g., avoidance behavior) *across* different realizers, even though each instance depends on *a* physical realizer. Interventionist or powers-based analyses will demonstrate the mental property's specific difference-making contribution, irreducible to the contributions of its diverse physical bases. Explanatory practices in cognitive science will continue to rely indispensably on non-reduced mental properties as causes.

  2.  **Crux: Problem-Solving Power of Alternative Causation Accounts**
      *   **Disagreement:** Do interventionist, difference-making, or powers-based accounts of causation genuinely resolve the exclusion problem, or do they merely restate it or shift the locus of competition?
      *   **Agreed Relevant Case:** **Empirical Cases of "Top-Down" Causation (e.g., Placebo Effect, Psychosomatics).** Both agree that phenomena where mental states (beliefs, expectations, emotions) appear to cause distinct physical changes (e.g., pain relief, immune response changes) are crucial test cases. The Placebo Effect is a prime example where a mental state (expectation of relief) seems to cause a physical change (neurochemical release, reduced inflammation).
      *   **Predictions:**
          *   *Exclusionist Prediction:* Detailed causal modeling and mechanistic investigation of cases like the placebo effect will *always* reveal that the causal chain runs *exclusively* through the specific neurobiological mechanisms activated by the mental state (e.g., expectation triggering specific neurotransmitter release). The mental state itself, as a non-reduced property, will be shown to be a *passive correlate* or *trigger* whose causal role is fully subsumed and exhausted by the physical mechanisms it activates; its distinctness adds no *extra* causal power. Interventionist models applied rigorously will show the mental variable is causally excluded by the finer-grained physical variables.
          *   *Non-Reductive Prediction:* Interventionist or powers-based analyses of cases like the placebo effect will demonstrate that interventions on the *mental state itself* (e.g., manipulating belief independent of the specific physical trigger) make a *difference* to the physical outcome *that cannot be fully captured or replaced* by interventions *only* on the underlying neurobiological variables. The mental property will be shown to have a unique counterfactual profile or possess causal powers (e.g., the power of an expectation to modulate pain pathways) that, while physically realized, are distinct and indispensable for a complete causal explanation of the effect. Causal models will show the irreducibility of the mental variable.

  **Usage Notes:**
  *   **Neutrality:** This document aims only to *structure* the core agreements and disagreements clearly. It does not endorse either side.
  *   **Wording:** The disagreement table uses phrasing each camp finds acceptable *for describing their own view*. This doesn't mean they agree with the *other* camp's description of their view.
  *   **Cruxes:** The predictions illustrate how each camp expects future developments (theoretical or empirical) to bear on the core disagreement. The cases are chosen as mutually recognized battlegrounds.
  *   **Literature Grounding:** The formulation reflects the central, unresolved debates (e.g., the ongoing dispute over whether interventionism *solves* exclusion or *evades* it, the status of MR after Kim's "functional reduction" response, the interpretation of empirical cases like placebo).
