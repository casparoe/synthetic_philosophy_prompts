prompt: |-
  Consider the debate over how large-scale moral revolutions—such as the disappearance of dueling or the abolition of chattel slavery—are best explained: through the spread of rational moral argument (the argument thesis), through shifts in material interests (the interest thesis), or through reconfigurations of honor and social recognition (the Appiah thesis, frequently contrasted with Bernard Williams's skepticism that moral change is rarely driven by argument alone). Several conceptual gaps remain underexplored: whether honor functions chiefly as a status-competition mechanism or as a normative-recognition mechanism; whether there is a structurally significant asymmetry between norms that collapse suddenly versus those that erode gradually; and how to model cases in which interest-based incentives and honor-based sanctions point in opposite directions during a norm's decline.

  Suppose you are advising an interdisciplinary research group—philosophers and historians, not economists or data scientists—with three years of funding and capacity for either conceptual analysis or focused historical case studies, but not for large-scale quantitative modeling. Which two or three open questions within this framework should they prioritize, and in what order? Defend your ranking with explicit criteria: tractability for conceptual and historical work, upstream importance for understanding present-day rapid normative shifts (for example, in professional ethics around technological risk or institutional responsibility), and what kind of conceptual clarification or historical evidence over the next few years would cause you to revise the ordering.

  In particular, assess whether the most urgent gap is making Appiah's honor mechanism precise enough to apply beyond the dueling case, testing Williams's claim that moral arguments only gain purchase once honor or interest has already shifted, or mapping the conditions under which interest and honor align versus conflict during norm collapse. Focus on reasoning that connects each question to practical understanding of moral change; do not provide a bibliography, reading list, or citation-dependent claims.
