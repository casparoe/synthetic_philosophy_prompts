prompt: |-
  hey so i just got bumped into teaching world history at a new school and the dept head wants a unit on industrialization. im running into this 'why britain and not china' framing everywhere — the needham question, great divergence, etc — and it feels like a lazy comparison but i cant pin down why. i need a decision procedre i can actually run in ten minutes before i put a comparative question into a lesson plan.

  turn the basic idea of a well-posed contrastive history question into a checklist for me: steps in order, what counts as passing each one, where i stop with a hard no, and where its just a values call i have to make myself. it needs to catch outcome-selection bias (treating britain as special because it already won), check whether the counterfactual 'china' is a real historical path or just an imaginary average of every society that didnt industrialize, and flag when the question hides a normative claim about progress or development. apply it to three cases: the classic britain-vs-china framing, a student asking why not the ottoman empire instead, and one where the procedre tells me the question is broken but id still want to teach it for other reasons. flag the spots where im just dressing up my own judgement as rules, and say what the checklist cant do. please no reading lists or citations — i wont have time and the kids wont care. im writing this on my phone between classes so keep it practical.
reasoning: |-
  Okay, the user is a history teacher who's been tasked with teaching a unit on industrialization and keeps encountering the "Why Britain and not China?" question. They find it lazy but can't articulate why. They need a practical, quick checklist to evaluate such comparative questions before including them in lesson plans. 

  Hmm, their frustration is palpable - they're time-pressed ("ten minutes", "writing on phone between classes"), need classroom-ready tools ("no reading lists"), and want to avoid intellectual pitfalls ("outcome-selection bias", "imaginary average"). Underneath, they're probably also wrestling with how to teach complex historiography without oversimplifying. 

  Right, so the core issue is that "Why not China?" often smuggles in three problems: (1) assuming Britain's success was inevitable, (2) treating "China" as a monolithic alternative when it's really shorthand for "any non-European society", and (3) implying industrialization was a race everyone failed except Britain. 

  For a checklist, it needs to be surgical. Let's break it into four filters they can run mentally: First, check if the comparison treats the "winner" as special because they won (outcome bias). Second, verify that the "alternative" (e.g. China) was actually on a plausible path to industrialization - did it have the preconditions? Third, unpack hidden assumptions about what "counts" as progress. Finally, admit where it's still useful pedagogically despite flaws. 

  Testing this against their cases: The Britain-China question fails step 2 because pre-19th century China wasn't trending toward steam power; it's an apples-to-oranges comparison. Why not Ottomans? That passes step 2 better since they actually had factories and reforms, but still risks Eurocentrism in step 3. And sometimes you might keep a flawed question because it sparks debate - just flag its limitations. 

  Crucially, I should emphasize this doesn't replace judgment - step 4 is literally "admit this is subjective". The checklist just makes biases visible. Also, it won't magically resolve debates among historians; it just prevents lazy framing. 

  ...Wait, did I make it actionable enough? They said "steps in order" and "what counts as passing". Added explicit PASS/FAIL criteria and a "values call" column. Also kept it citation-free as requested. The tone feels right - pragmatic, no academic jargon, respects their classroom constraints. 

  Final thought: They'll likely tweak this, but giving them a clear "kill switch" (step 1 hard NO) and a "proceed with caution" flag (step 3) should save them time while making lessons more rigorous.
answer: |-
  Here's a 4-step decision procedure designed for speed. Run it in order — if it fails a step, stop or redesign. **Bold** = critical filter.

  ---

  ### **Industrialization Comparative Question Checklist**
  *(Run time: <10 mins)*

  **STEP 1: FLAG OUTCOME BIAS**  
  *"Is the 'winner' being defined by the outcome?"*  
  - **PASS**: Britain isn’t framed as "destined" or "superior"; we acknowledge other societies had comparable tech/commerce earlier.  
  - **FAIL**: Implies Britain was "obviously" the best candidate (e.g., "Why did *only* Britain succeed?").  
  - **HARD STOP? YES** if failed. Redesign to avoid teleology.

  **STEP 2: TEST THE COUNTERFACTUAL**  
  *"Is the 'alternative' society a coherent historical actor with relevant preconditions?"*  
  - **PASS**: The society (e.g., China/Ottomans) had:  
    - A real proto-industrial sector (textiles, metallurgy)  
    - Centralized state capacity (taxation, laws)  
    - Actual debates/policies about technology or production  
  - **FAIL**: "China" is a vague stand-in for "non-West" or lacks specific industrializing pressures (e.g., no discussion of 18th-c. Yangtze Delta workshops).  
  - **HARD STOP? YES** if failed. Pick a better comparator.

  **STEP 3: AUDIT THE "WHY NOT"**  
  *"Does the question hide progressivist assumptions?"*  
  - **PASS**: Acknowledges industrialization isn’t a "race" all societies "lost" (e.g., Qing China prioritized stability over growth).  
  - **FAIL**: Implies failure to industrialize = "backwardness" or assumes industrialization was universally desirable.  
  - **HARD STOP? NO** — but you MUST reframe the lesson to expose this bias.

  **STEP 4: ADMIT THE TRADEOFF**  
  *"Am I using this despite flaws because it sparks engagement? If so, name the limits."*  
  - **PASS**: Explicitly tell students: *"We’re comparing X and Y to explore [specific factor, e.g., state policy], but remember — this simplifies complex realities."*  
  - **FAIL**: Presenting it as an objective historical puzzle.  
  - **VALUES CALL**: Your call to use a "broken" question pedagogically, but only if you openly critique it.

  ---

  ### **Applied to Your Cases**
  1. **"Why Britain and not China?"**  
     - Step 1: **FAIL** (Assumes Britain’s win needs explaining, not China’s path).  
     - *STOP HERE*. Redesign: *"How did British institutions respond differently to 18th-c. technological pressure than Qing institutions?"*  

  2. **Student asks: "Why not the Ottoman Empire?"**  
     - Step 1: PASS (Doesn’t assume Ottoman "failure").  
     - Step 2: PASS (Ottomans had workshops, state reforms, access to tech).  
     - Step 3: **CAUTION** (Don’t frame as "why Ottomans failed"). Reframe: *"Why did Ottoman and British state investment in factories diverge after 1800?"*  

  3. **"Broken but teachable" question (e.g., "Why was Japan successful but India wasn't?")**  
     - Step 1: FAIL (Implies "success" only = industrialization).  
     - Step 2: PASS (Both had textile production, colonial encounters).  
     - Step 3: FAIL (Hides colonial exploitation as a variable).  
     - **VALUES CALL**: Use it to **teach the checklist itself** — have students identify biases in the question.

  ---

  ### **Where This Is Just Your Judgment (Dressed as Rules)**
  - Step 2’s "relevant preconditions" — You decide what’s "relevant" (e.g., is a banking system essential?).  
  - Step 4’s tradeoff — Only you know if engagement outweighs distortion.  

  ### **What the Checklist Can’t Do**
  - Resolve scholarly debates (e.g., "high-wage economy" vs. "coal theory").  
  - Replace deep context (e.g., explaining *why* Qing policies discouraged innovation).  
  - Fix questions comparing incomparables (e.g., "Why Britain and not Mali?").

  ---

  **TLDR Execution Flow:**  
  1. Kill outcome bias → 2. Verify the alternative was even in the game → 3. Check for hidden "progress" narratives → 4. If using flawed Q, confess its limits to students.  
  **When in doubt:** Swap "Why not X?" for *"How did X and Y’s responses to [specific pressure] differ?"* — forces concrete analysis over destiny-thinking.
