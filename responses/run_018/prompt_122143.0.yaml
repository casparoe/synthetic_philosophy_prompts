  me and my best friend got into this huge arguement last night that went untill like 3am. he made up this coin-flip game: you flip untill tails, and the payout is 2^n dollars if it takes n flips with n even, minus 2^(n-1) if n is odd, but he scaled it so the expected value literally doesnt exist — not blowing up to infinity either way, just undefined and oscillating. he says since expected-utility reasoning is completely broken here, theres no rational ceiling on what you should pay to enter, so charging me $200 is totally defensible and im being irrational if i refuse. i feel like thats wrong but i cant formalize why. please take an actual position: is he right that undefined expectation licenses "anything goes" pricing? dont just outline the options — commit to whether his argument holds, and tell me if i should actually play for $100. also, im wondering if the symmetry here — failing to converge in both directions, unlike the usual st-petersburg case — matters. should we treat this as knightian ambiguity and apply maximin, or try to rescue rational choice with a generalized expectation like a banach limit, or is that just mathematical sleight-of-hand? i want to know which response survives if we really take the undefinedness seriously rather than papering over it.
