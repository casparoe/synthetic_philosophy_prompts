answer: |-
  Your friend's argument is mathematically clever but fundamentally flawed. **No, undefined expectation does *not* license "anything goes" pricing. His $200 fee is *not* defensible, and refusing to play is the rational choice. You should *not* play this game for $100.** Here's why, taking the undefinedness seriously:

  1.  **The Undefined Expectation is Real (But Misinterpreted):**
      *   As you described, the payout `X` is:
          *   `X = +2^n` if first tail on even `n` (prob = `1/2^n`)
          *   `X = -2^(n-1)` if first tail on odd `n` (prob = `1/2^n`)
      *   The expected value series is: `Σ [P(n) * X(n)] = Σ [ (1/2^n) * 2^n ] for even n + Σ [ (1/2^n) * (-2^(n-1)) ] for odd n`
      *   Simplifies to: `Σ [+1] for even n + Σ [-1/2] for odd n`
      *   The partial sums oscillate endlessly (e.g., n=1: -0.5, n=1+2: -0.5+1=0.5, n=1+2+3: 0.5-0.5=0, n=1+2+3+4: 0+1=1, ...). It *does not converge* to any real number, positive or negative infinity. The expectation is truly undefined.

  2.  **Why "Undefined ≠ Anything Goes" is Wrong:**
      *   **Risk is Asymmetric, Not Symmetric:** While the expectation oscillates, the *potential losses are catastrophic and grow exponentially*. For large odd `n`, you lose `2^(n-1)` dollars. The *magnitude* of potential ruin far outweighs the bounded oscillation of partial sums.
      *   **Rational Choice Requires Coherence:** Decision theory doesn't implode with undefined expectations. Rational agents use coherent principles *beyond* expectation when it fails. Demanding that undefined expectation implies no constraints leads to absurdity. Would your friend pay $1,000,000 to play? $10^100? His own rule would force him to accept any fee, clearly irrational.
      *   **Knightian Ambiguity & Maximin is Compelling:** This situation *perfectly* fits Knightian uncertainty. You have well-defined probabilities but an undefined expectation, creating fundamental ambiguity about the game's value. **Maximin (or Minimax Regret) is the most robust response:** assume the worst plausible outcome. The worst outcomes here are devastating losses (`-2^(n-1)` for large odd `n`). Maximin dictates a *negative* valuation - you should only play if *paid* significantly to take on the risk. Charging *you* $100 is the opposite of rational under Maximin.

  3.  **Why Banach Limits (or Cesàro) Are Unsatisfying Here:**
      *   While a Banach limit `L` exists (satisfying linearity, shift-invariance, etc.), it's non-constructive and non-unique. You could assign `L = c` for any `c` between 0 and 0.5 (the oscillation bounds).
      *   **This is mathematical sleight-of-hand regarding risk.** It papers over the fundamental problem: the game exposes you to *unbounded, exponentially growing downside risk* with non-negligible probability. Assigning a finite value `c` (like 0.25) ignores the fact that with probability `1/2^100` (~10^-30), you lose `2^99` dollars (~6.3*10^29 dollars). No rational agent with finite resources would accept this risk for a finite fee based on a generalized limit. The potential ruin isn't averaged away.

  4.  **The Symmetry Matters (But Not How Your Friend Thinks):**
      *   Unlike the St. Petersburg Paradox (which diverges to +∞), this game oscillates. This *prevents* any "infinite expected value justifies any finite fee" argument. However, the oscillation *does not* create symmetry in terms of *acceptable risk*. The potential for catastrophic loss remains the dominant feature for any realistic agent. The oscillation simply means there's no single number summarizing the gamble's value, reinforcing the need for alternative criteria like Maximin.

  5.  **Practical Rationality - Finite Resources & Utility:**
      *   Assume you have finite wealth `W`. Playing this game risks bankruptcy (`X < -W`) with positive probability. Even if `W` is large, the marginal utility of the potential massive loss vastly exceeds the utility of any potential gain or the entry fee saved. Risk aversion (a concave utility function) makes paying *any* positive fee to play utterly irrational. You'd need linear utility over all wealth levels (impossible) and infinite resources to even consider the gamble, but then the undefined expectation still provides no guidance.

  **Conclusion & Verdict:**

  *   **Your friend is wrong.** Undefined expectation does *not* mean rational choice breaks down or that "anything goes" for pricing. It means standard expected value fails, and we must use more robust decision criteria.
  *   **Maximin/Minimax Regret is the principled response.** Faced with undefined expectation and the potential for ruinous loss, a rational agent values the game *negatively*. You should demand compensation to play, not pay to play.
  *   **Banach limits are inadequate.** They ignore the extreme downside risk inherent in the gamble's structure.
  *   **Do NOT play for $100 (or $200).** Paying a substantial positive fee to expose yourself to potentially infinite losses (relative to your resources) is profoundly irrational, regardless of the expectation's undefined nature. Your intuition that this is wrong is correct. **Refusing to play is the rational choice.** Tell your friend that undefined expectation + catastrophic downside risk mandates extreme caution, not reckless spending. If he insists it's rational, challenge him to play the game himself 100 times, paying $200 each time – his own aversion to ruin will likely override his theoretical argument.

  **Surviving Response:** Taking the undefinedness seriously doesn't invalidate rational choice; it mandates using criteria robust to ambiguity and extreme risk. **Maximin survives as the most compelling response:** the undefinedness combined with the game's inherent structure guaranteeing the possibility of devastating losses justifies assigning the game a strongly negative value. Paying any positive fee is indefensible.
