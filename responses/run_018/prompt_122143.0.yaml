  Okay, the user is dealing with a complex probability argument with their friend. Let me unpack this step by step. The friend designed a coin-flip game where the payout depends on the number of flips until tails, with different rules for even and odd n. The expected value doesn't converge, oscillating instead of diverging to infinity. The friend claims that because the expectation is undefined, there's no rational limit to what someone should pay to play, justifying a $200 entry fee. The user feels this is wrong but can't articulate why.

  First, I need to confirm that the expected value is indeed undefined. The user mentioned it oscillates, which suggests the series doesn't converge. The payout alternates in sign based on whether n is even or odd. For even n, it's +2^n; for odd n, -2^(n-1). The probability for each n is (1/2)^n. So the expected value series would be a sum of terms like (1/2^n)*2^n for even n, which is +1, and (1/2^n)*(-2^{n-1}) for odd n, which simplifies to -1/2. So the partial sums oscillate: after one term (n=1), it's -0.5; after two terms (n=1 and 2), it's -0.5 + 1 = +0.5; after three, +0.5 - 0.5 = 0, and so on. The sequence of partial sums alternates between 0 and +0.5 without converging. That's undefined expectation.

  The friend's argument is that undefined expectation means "anything goes" for pricing. But is that valid? In decision theory, undefined expectation doesn't automatically mean you should pay any amount. Rational agents need consistent decision rules. If the expectation doesn't exist, other criteria should be considered. The user also asked about symmetry since it oscillates in both directions, unlike St. Petersburg which goes to positive infinity. This symmetry might matter because the potential losses grow just as fast as gains.

  Now, considering decision-making approaches under undefined expectation. Maximin is one option: assume the worst case. In this game, the worst-case loss could be astronomically high—like losing 2^{99} dollars if n=100. Paying $100 to risk such a loss seems irrational. Another approach is using a generalized expectation like Banach limits, which assign a value to oscillating sequences. But as the user noted, that might be mathematical sleight-of-hand. The problem is that Banach limits aren't unique and don't reflect the actual risk.

