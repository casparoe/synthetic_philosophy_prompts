prompt: |-
  So, bit of context: my family run a mussel and oyster farm, and about four months ago I let myself get talked onto the industry association's committee that's writing the animal welfare code for the whole sector — which means I'm now one of the people deciding which animals the code actually covers. I'm not a philosopher and I'm not a vet, and I'm obviously conflicted about the shellfish part, so I'd rather have a procedure I can defend then keep going by gut.

  The shape of the job: a new species or a new supplier application comes up every couple of weeks, we've got maybe forty minutes each, the people who'll actually run this are auditors with one day of training plus our own vets, every decision needs a half-page written justification, and anything that restricts a practice has to be signed off by the retailer's technical person. We can't send samples to a lab or commission studies — we work from what's already out there in general summaries and from what you can observe on a farm.

  What I've been doing by instinct, and want turned into something I can hand to other people:

  - a flat "no centralised brain, no coverage" cutoff;
  - treating motivational flexibility as the marker I trust most — the animal changes what it will put up with, or work for, when the stakes change, instead of just withdrawing from a stimulus in a fixed way — and discounting both plain reflex responses and the cases where all that's been shown is that it learns to avoid the bad thing, since that might just be conditioning;
  - when I'm genuinely unsure, weighting the possible suffering heavier than the possible cost, by a factor I basically made up.

  Please turn that into a real decision procedure: the questions in the order they should be asked, what counts as a sufficient yes to each one, where the procedure stops with a no, and where it has to stop and hand the decision to a person because the question is one of values rather than facts. Be explicit about which distinctions from the philosophy have to survive the simplification and which can be dropped without much loss, and about where the procedure will misfire — one guy on the committee keeps saying that all the marker stuff is just proxies and what we care about is the thing itself, and I don't have a good answer to him. It also needs to be revisable: something should be able to move up or down a tier when evidence comes in, with a trigger for when we look again.

  Then run it on five cases: a decapod supplier someone wants to add; the oysters and mussels we already farm; black soldier fly larvae grown for feed; a honeybee operation where the argument is that the unit that matters is the colony and not the individual; and one species nobody has ever run a single test on. Tell me which of those comes out in a way I'm not going to like, and why the procedure is still right to say it.
reasoning: |-
  Okay, let me start by understanding the user's situation. They work on a mussel and oyster farm and are part of a committee writing an animal welfare code. They need a clear, defensible procedure to decide which animals the code covers. The user isn't a philosopher or vet, so the procedure must be practical, based on existing info, and auditable.

  The user's current approach has three main points: a "no brain, no coverage" rule, using motivational flexibility as a key marker, and erring on the side of caution when unsure. They want this formalized into a step-by-step process. The committee includes auditors with minimal training, retailers' technical staff, and someone who critiques using proxies. The procedure must be revisable and handle real cases like decapods, shellfish, insects, and untested species.

  First, I need to address the philosophical concern about proxies. The user's colleague argues that proxies aren't the real thing (sentience). The key is to justify why certain proxies are reliable indicators. For example, motivational flexibility shows an animal evaluates outcomes, which is linked to subjective experiences. Centralized brains correlate with the capacity for integrated experiences. Explaining this link can counter the critique.

  Next, structuring the procedure. The steps should flow logically: start with the brain cutoff (Step 1), then motivational flexibility (Step 2), and finally the precautionary principle (Step 3). Each step needs clear pass/fail criteria and documentation requirements. Step 2 is crucial because it differentiates between reflexive learning and goal-directed behavior. The user needs observable indicators for auditors, like varied responses to changing rewards or punishments.

  For the case studies, oysters and mussels will fail at Step 1 due to no centralized brain. Decapods like crabs pass Step 1 and show motivational flexibility in studies, so they should be covered. Black soldier fly larvae might pass Step 1 but fail Step 2 if evidence only shows simple conditioning. Honeybees are tricky because the argument is about the colony. But individual bees show motivational flexibility, so the procedure covers them. Untested species default to Step 3, applying the precautionary principle.

  The user might dislike covering decapods because it affects their industry. But the procedure is correct based on evidence of complex behavior. Revisability is built-in with annual reviews and evidence triggers. Documentation for each step ensures transparency, helping justify decisions to retailers.

  I should also consider potential misfires. For instance, some animals with centralized brains might not be sentient (false positives), or simple nervous systems could still experience something (false negatives). The procedure minimizes this by prioritizing strong proxies and erring on caution. However, it's a practical compromise given time and resource constraints.

  Finally, making the procedure accessible. Using clear language, defining terms operationally, and providing examples helps auditors apply it. Emphasizing that values come into play only at Step 3 allows the committee to make policy decisions when evidence is insufficient.
answer: |-
  Here’s a formalized decision procedure based on your criteria, designed for practicality, auditability, and defensibility. It prioritizes **observable proxies for sentience** while acknowledging philosophical limitations.

  ---

  ### **Animal Welfare Coverage Decision Procedure**  
  *(Version 1.0; Requires annual review & evidence-triggered updates)*  

  **Core Philosophy Simplified:**  
  1. **"No Brain, No Pain" Threshold:** Centralized brains (e.g., ganglia clusters) are a *necessary but not sufficient* condition for sentience. Reflex-only systems (e.g., jellyfish) are excluded.  
  2. **Motivational Flexibility = Sentience Proxy:**  
     - **What it is:** Animals trade off rewards/penalties *based on context* (e.g., hungry fish accept electric shocks for food; satiated fish refuse).  
     - **What it isn't:** Simple habituation (e.g., sea anemone retracts less after repeated touch) or Pavlovian conditioning (e.g., planaria moving toward light paired with food).  
  3. **Precautionary Principle:** When evidence is ambiguous, prioritize preventing suffering over industry convenience (default weighting: 80% suffering risk / 20% economic cost).  

  **The Decision Flowchart:**  
  *(Each step requires documented evidence; max. 40 min/species)*  

  | **Step** | **Question** | **Sufficient "Yes"** | **"No" Outcome** | **Handoff to Human?** |  
  |----------|--------------|----------------------|------------------|-----------------------|  
  | **1. Brain Check** | "Does the species have a **centralized brain** (ganglia clusters or brain) integrating sensory input?" | Peer-reviewed anatomy studies showing neural integration (e.g., decapod ganglia). Farm observations accepted if unambiguous (e.g., visible cephalopod brain). | **STOP: Not covered.** *Reason:* No biological substrate for sentience. | No. Pure anatomy. |  
  | **2. Motivational Flexibility (MF) Test** | "Is there **reliable evidence of context-dependent trade-offs** (not just avoidance)?" | Studies/anecdotes showing: (a) Variable tolerance to aversives based on reward state (e.g., crabs enduring heat for better shelter), OR (b) Innovation (e.g., octopus using tools). *Farm observations accepted if recorded rigorously.* | **STOP: Not covered.** *Reason:* Only reflexive/conditioned responses observed. | No. Evidence-based. |  
  | **3. Uncertainty Resolution** | "Is MF evidence **inconclusive or absent**?" | Genuine ambiguity after literature/farm review (e.g., no studies, conflicting data). | Proceed to Step 4. | **YES.** Values-based judgment required. |  
  | **4. Precautionary Weighting** | N/A | N/A | **Covered.** *Reason:* Default weighting favors preventing suffering. | Committee vote using 80/20 weighting. |  

  ---

  ### **Key Distinctions & Misfires**  
  - **Critical to Keep:**  
    - **Centralized brain requirement:** Filters out definitively non-sentient taxa (sponges, jellyfish).  
    - **MF ≠ Learning:** Avoids false positives from conditioning (e.g., trained earthworms).  
  - **Safe to Drop:**  
    - Consciousness debates (e.g., "what it’s like to be a bee"). Focus on *functional complexity*.  
    - Distinctions between pain/suffering/valence. Procedure treats "risk of suffering" as binary for coverage.  
  - **Where It Misfires:**  
    - **False Negatives:** Species with sentience but no observed MF (e.g., if all tests are poorly designed).  
    - **False Positives:** Species exhibiting MF-like behavior via reflex (theoretical; rare in practice).  
  - **Answering the Proxy Critic:**  
    > "We use proxies because **direct measurement of sentience is impossible**. MF is the best *functional indicator* of valenced experience (i.e., 'suffering' vs. 'not suffering'). If an animal sacrifices safety for reward only when hungry, it implies an internal state we must ethically consider."  

  ---

  ### **Case Applications**  
  1. **Decapod Supplier (e.g., Crabs/Shrimp):**  
     - **Step 1:** Pass (centralized ganglia).  
     - **Step 2:** Pass (MF proven: crabs trade shock risk for better shelter; shrimp show anxiety-like states).  
     - **Outcome:** **Covered.** *You won’t like this*—it complicates farming—but the procedure is **right** due to overwhelming evidence of sentience.  

  2. **Oysters/Mussels:**  
     - **Step 1:** Fail (no brain; diffuse nerve nets).  
     - **Outcome:** **Not covered.** Aligns with your instinct.  

  3. **Black Soldier Fly Larvae (feed):**  
     - **Step 1:** Pass (centralized ganglia).  
     - **Step 2:** Fail (current evidence: habituation only, no trade-offs).  
     - **Outcome:** **Not covered.** *Misfire risk:* Future MF evidence could overturn.  

  4. **Honeybees (colony argument):**  
     - **Step 1:** Pass (brain).  
     - **Step 2:** Pass (MF: bees risk predation for high-value nectar; show optimism/pessimism).  
     - **Outcome:** **Covered (individuals).** *Colony argument rejected:* Suffering occurs at individual level (e.g., diseased bee isolated).  

  5. **Untested Species (e.g., novel sea cucumber):**  
     - **Step 1:** Pass (if ganglia present).  
     - **Step 2:** Inconclusive (no data).  
     - **Step 3/4:** **Covered** via precautionary principle.  

  ---

  ### **Revisability Protocol**  
  - **Automatic Review Triggers:**  
    - New peer-reviewed study on MF in the species.  
    - Auditor reports anomalous behavior (e.g., apparent trade-offs).  
    - Industry request + new evidence.  
  - **Process:** Re-run procedure with new evidence. Committee re-votes only if Step 3/4 triggered.  
  - **Documentation:** "Tier status" log with evidence sources; updated annually.  

  This procedure balances **scientific rigor** (using tractable proxies), **practicality** (farm-observable criteria), and **ethics** (precaution). It defends against criticism by anchoring decisions in functional neurobiology and adaptive behavior—not philosophy.
