answer: |-
  Your question brilliantly exposes a subtle tension between Lewis's conception of convention and evolutionary dynamics. Let's break this down step-by-step:

  **1. Lewis's Core Claim on Arbitrariness:**
  Lewis defines a convention as:
  - A *regularity* in behavior
  - Solving a *coordination problem*
  - Where *multiple equilibria* could work equally well (arbitrariness)
  - Sustained by *mutual expectations* (not intrinsic superiority)

  **2. Evolutionary Dynamics & the *Appearance* of Determinism:**
  - Yes, cultural/evolutionary pressures *can* (over time) select for conventions that are more robust, efficient, or easier to learn.
  - This makes the *surviving* convention *appear* "deterministically selected" or "functionally necessary."

  **3. Why Lewis's Arbitrariness Still Holds:**  
  The evolutionary process **does not negate** the fundamental arbitrariness Lewis identified. Here's why:

  -   **Initial State & Path Dependence:** Evolution starts from *somewhere*. The initial adoption of a convention (right vs. left driving, a specific vowel shift) is almost always contingent on historical accident, random drift, or minor influences – it's arbitrary *at the point of origin*. Evolution then locks in that initial choice.
  -   **The Counterfactual "Could Have" (Modal Claim):** Lewis's arbitrariness is fundamentally *modal*: **Multiple solutions *were* possible *at the outset*.** Evolution doesn't erase this historical possibility space. It simply reveals which *one* of those initially arbitrary options turned out to be most stable or advantageous *given the specific path taken and the selection pressures applied*. The fact that alternatives *weren't* tried extensively (or failed when they were) doesn't mean they *couldn't* have worked initially.
  -   **The Nature of "Functionally Necessary":** A convention selected by evolution becomes *functionally optimal* or *locally necessary* (the best solution *now*, given the system it operates within). However, this is distinct from *logical* or *absolute* necessity. It's *still conventional* because:
      -   **The Problem Remains Symmetric:** The underlying coordination problem (e.g., "we all need to drive on the same side") retains multiple potential solutions in principle. Driving on the right solves it; driving on the left solves it *equally well in isolation*.
      -   **Switching Costs Create Lock-In:** The "necessity" of driving on the right *today* arises primarily from massive *switching costs* (retraining, infrastructure change, network effects), not because driving on the left is intrinsically flawed. If we could magically reset the world with no switching costs, either solution would be equally viable again. This dependence on expectations and sunk costs is the hallmark of convention.
      -   **"Better" is Contextual:** What makes one convention "more robust" or "efficient"? Often, it's contingent on other existing technologies, infrastructure, or cultural factors (e.g., right-hand driving might be marginally safer in cars designed for right-hand drive, but that design choice *followed* the convention). The selection criteria themselves can be path-dependent.

  **4. Addressing the Driving Example Directly:**

  -   **Has arbitrariness been resolved?** No, the *underlying symmetry* of the coordination problem remains. The *necessity* to drive on the right is purely conventional – it arises from the near-universal *expectation* that others drive on the right and the immense costs of changing.
  -   **Is it "functionally necessary" rather than conventional?** It is **conventionally necessary** or **functionally necessary *due to* convention**. The rule *functions* as necessary *because* it's the established convention with overwhelming network effects. Remove the shared expectations and coordination aspect, and the "necessity" vanishes. It's not necessary like gravity; it's necessary like the QWERTY keyboard – a contingent solution locked in by history and expectations.

  **5. The Objection Confuses Modality and Causality:**

  You are exactly right. The objection **confuses the modal claim ("alternatives were possible") with the causal claim ("alternatives were never tried/survived")**.

  -   **Modal Claim (Lewis):** At the origin of the convention, multiple equilibria *were* genuinely possible and *could* have solved the problem.
  -   **Causal Claim (Evolution):** Due to historical accidents and later selection pressures, only *one* (or very few) of those initial possibilities *actually* got established and survived.
  -   Evolution explains *which* arbitrary solution *won* and *why it persists*, but it doesn't prove that the *other* initial possibilities *couldn't* have worked or weren't genuinely arbitrary options at the start.

  **Conclusion:**

  Evolutionary dynamics **do not show Lewis was wrong** about arbitrariness. Instead, they provide a powerful explanation for *how one specific arbitrary solution becomes dominant and locked in*, giving it the *appearance* of functional necessity or deterministic selection. The core of Lewis's insight remains:

  1.  **Arbitrariness at Origin:** Multiple solutions were genuinely possible initially.
  2.  **Conventionality Persists:** The *reason* the dominant convention persists is *still* fundamentally rooted in shared expectations, mutual reinforcement, and coordination – the defining features of convention. The "functional necessity" is an *emergent property* of the established convention and its network effects, not an intrinsic property that negates its conventional origins.

  Therefore, driving on the right remains a paradigmatic example of a convention, even if its global dominance makes it seem functionally necessary *now*. Its necessity is a *consequence* of its conventional status and the costs of change, not a refutation of its arbitrary origins.
