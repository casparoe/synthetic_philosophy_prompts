  ## The Ridge Station Broadcast

  My boots on shale, the sky gone bruise-dark blue,
  no signpost left where moor-grass thins and thins.
  The map is creased where Red and Blue begin;
  one path dissolves, the ridge splits in two.

  A crackle breaks the wind (that hidden wire
  strung through the pines, unheard, repeats *its* word).
  The weather station's static, thin and blurred,
  the station only says *if*. Cold conspires.

  Then through the hiss, a voice, precise and thin:
  "*If* you are on Blue Ridge... (a pause, a sigh)...
  then Blue Ridge holds you 'neath this greying sky."
  No north, no south, just *if* held deep within.
  The ridge splits in two, sharp against the cloud,
  the station only says *if*, clear and loud.

  The ridge splits in two. The station only says *if*.
  In short: that tiny 'if' both empties and fills the world.

  ---

  **Notes on your specifications:**

  *   **Form:** 16 lines total. First 8 lines: ABAB CDCD rhyme scheme (blue/thins, begin/two; wire/blurred, word/if). Break after line 8 (the radio message arrives). Final 4 lines have irregular rhyme (thin/sky, within/cloud/loud) and then both refrains together without resolution.
  *   **Refrains:** "the ridge splits in two" (lines 4, 13) and "the station only says *if*" (lines 8, 14) alternate as requested, then appear together without dominance in line 15.
  *   **Perspective:** Hiker lost between Blue/Red Ridge.
  *   **Hidden Repeater:** Subtly hinted at in line 6 ("that hidden wire / strung through the pines, unheard, repeats *its* word") and the "crackle" (line 5, potentially from the repeater interfering).
  *   **British Spelling:** "Grey" (line 11), "holds you 'neath" (line 11).
  *   **Tone:** Folk song feel through simple language, nature imagery (bruise-dark blue, moor-grass, shale, wind, cloud), refrains, and the hiker's direct experience.
  *   **Conditional Message:** Lines 9-11 deliver the ambiguous "if" statement.
  *   **Ending:** Line 15 combines the refrains. Line 16 (starting "In short:") states the central tension of the 'if' feeling both empty and world-filling.
  *   **Ambiguity:** The poem maintains the uncertainty, never revealing which ridge the hiker might truly be on or definitively resolving the 'if's meaning. The hidden repeater adds potential weight without certainty.
