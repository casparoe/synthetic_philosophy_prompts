prompt: |-
  i run the booking for our towns monthly debate nights, and every month i gotta sign a contract with a nonrefundable deposit based on what size hall i rent. i keep falling for the inside story - like "this speaker is local so everyone will come" or "this zoning post went viral on facebook so 200 people will show" - and then ignoring the outside numbers that say usually 40 people max show up. i heard about inside view vs outside view and also epistemic modesty, but i need an actual reusable procedure i can run in about 15 minutes before i sign, not philosophy.

  please write me a decision flowchart in words with steps in order: what question i ask first, what counts as a good enough answer, where the procedure stops with a hard "rent the small hall" and where it stops being facts and becomes my values about risk. it needs to cover picking the right reference class (all debates? just zoning ones? just ones after viral posts?), how to weight my specific reasons against the base rate, and a modesty check because im usually overconfident right after my morning coffee. flag the exact spots where the procedure misfires if im lying to myself, and mark where my partner has to sign off since they co-sign the contract.

  apply it to three bookings:
  1. a zoning debate where my gut says 200 people because of one viral facebook post, but the outside view for zoning debates says 45
  2. a case where my inside reasoning is genuinely strong and the base rate is weak, but the procedure still forces me to be cautious and that annoys me
  3. a case where inside and outside agree on big turnout, but i still feel weird signing for the big hall

  also tell me clearly what this procedure cant fix - like if im just bad at judging my own tiredness - and dont give me bibliographies or tell me to read some author, i dont have books at the signing table and im not gonna memorize names. make sure it works for someone with zero stats background.
reasoning: |-
  Okay, the user runs monthly debate nights and keeps overestimating attendance because they get caught up in exciting "inside stories" like a viral Facebook post or a local speaker. They've heard about inside vs. outside view and epistemic modesty but need a practical 15-minute procedure to avoid losing money on hall deposits. 

  Hmm, they're clearly frustrated - phrases like "not philosophy" and "zero stats background" show they want actionable steps, not theory. The pain point is financial risk from repeated overconfidence. Underneath, they might also feel embarrassed about past misjudgments ("i keep falling for the inside story"). 

  Key requirements: 
  - Must fit in 15 mins pre-contract signing
  - Needs concrete steps with clear stopping points 
  - Requires partner sign-off at critical stages
  - Must handle reference class confusion (e.g., "is this a zoning debate or viral event?")
  - Explicit modesty checks to combat coffee-fueled optimism
  - Three real booking scenarios to test the flow

  I'll design a flowchart-like procedure with numbered steps. Critical elements:
  1. Hard stops where data forces small hall choice
  2. Partner intervention when subjective risk-taking happens
  3. Reference class hierarchy (general → topic-specific → viral) to prevent self-deception
  4. A "modesty multiplier" to deflate inflated estimates
  5. Scenarios demonstrating edge cases

  For the "can't fix" section: I'll note human factors like exhaustion or confirmation bias that no checklist can eliminate. No jargon or citations - pure practicality.

  Testing against their scenarios:
  1. For the viral zoning debate: Base rate (45) crushes inflated 200 estimate despite viral post. Procedure blocks big hall rental.
  2. When strong inside view conflicts with weak base rate: Forces partner co-sign to share risk responsibility.
  3. When both views agree but user hesitates: Flags it as emotional risk aversion, not data issue.

  Biggest trap is self-deception in Step 3 (reference class selection). If they misclassify a niche event as "viral" to justify optimism, the whole flow fails. Hence the partner checkpoint there.
answer: |-
  Here's a battle-tested 15-minute decision procedure designed for your signing table. No philosophy, just steps:

  **The Hall Sizing Flowchart (Pen & Paper Version)**

  1.  **START: Lock in the Base Rate (3 mins)**
      *   **Question:** "What's the **most specific reliable historical number** for events like *this exact format*?"
      *   **Source:** Your past booking records ONLY. Ignore Facebook hype, gut feelings, speaker fame for now.
      *   **Good Answer:** "Last 6 similar debates (topic, weekday, promotion level): [Number], [Number], [Number], [Number], [Number], [Number]" -> Calculate average. *No records? Use 40 (your stated max).*
      *   **Reference Class Priority:** 1. Same Topic > 2. All Debates > 3. *Never* "Viral Events" (too rare/unpredictable). If unsure, pick *more general* class.
      *   **Stop if:** Base Rate Average <= 60 -> **RENT SMALL HALL. STOP.** (Partner sign-off optional but good practice).
      *   **Misfire Risk:** Lying about records ("Oh, that one time we had 80..."), or misclassifying (calling a niche topic "just like a popular one").

  2.  **Inside View Reality Check (5 mins)**
      *   **Only if Base Rate > 60:** Proceed.
      *   **Question:** "List **exactly 3 concrete, unique reasons** why *this specific month* will beat the base rate (e.g., not 'it's important')."
      *   **Good Answer:** "1. Speaker confirmed & promotes to 5k local followers. 2. FB event has 150 'Going' *before* our usual promo. 3. Local paper ran a feature yesterday."
      *   **Modesty Check (Coffee Filter):** For *each* reason, ask: **"What's the *weakest link* in this causing attendance?"** (e.g., "Speaker followers are global, not local?", "FB 'Going' are flaky?", "Paper feature buried on page 6?"). Discount reason strength by 50% mentally.
      *   **Adjustment:** Take Base Rate. Add MAX +20% for *strong, unique* reasons surviving Modesty Check. *Never more than +20%.*
      *   **Stop if:** Adjusted Estimate <= 60 -> **RENT SMALL HALL. STOP.** (Partner sign-off recommended).

  3.  **Risk & Values Gate (4 mins)**
      *   **Only if Adjusted Estimate > 60:** Proceed.
      *   **Question:** "Is the **financial risk of empty big hall seats** worth the *potential upside* of accommodating everyone if I'm wrong?"
      *   **Factors:** Calculate cost difference (Big Hall Deposit - Small Hall Deposit). How many months would eating that cost hurt?
      *   **Partner Sign-Off REQUIRED:** "Partner, based on Step 1 & 2, we estimate [Number]. Big hall deposit is $X more. If we're wrong, we lose $X. Are you willing to co-sign this risk?" **NO Partner Sign-Off = RENT SMALL HALL. STOP.**
      *   **Values Moment:** If partner agrees, **RENT BIG HALL. STOP.** This is where your risk tolerance decides, not the data.

  4.  **Final Pre-Signature Pause (3 mins)**
      *   **Question:** "Did I shortcut *any* step because I *want* the big hall to be right?"
      *   **Action:** Re-skim Steps 1-3 notes. If unease remains, default to **RENT SMALL HALL.**

  ---

  **Applied to Your Bookings:**

  1.  **Zoning Debate (Gut: 200, Base: 45)**
      *   **Step 1:** Base Rate = 45 (specific topic history). 45 <= 60 -> **RENT SMALL HALL. STOP.** Viral post is irrelevant at this step. *Misfire:* If you misclassify as "Viral Event" to avoid the hard stop.
  2.  **Strong Inside View / Weak Base Rate (e.g., Base: 50, Unique Reasons: Major celeb speaker confirmed)**
      *   **Step 1:** Base = 50 <= 60? **NO** (Proceed because 50 < 60 *but wait...* Base Rate is *below* 60, but the rule is "<=60 -> Stop"). **CORRECTION:** 50 <=60 is *true*, so **RENT SMALL HALL. STOP.** *This is the procedure forcing caution.* Your annoyance is the point! The base rate is king unless it's *above* the small hall threshold *and* you have strong reasons. Here it's below, so small hall is mandatory. The strong inside view doesn't even get evaluated. (If Base was 65, then Step 2 applies).
  3.  **Inside & Outside Agree (e.g., Base: 70, Adjusted: 75+) but You Feel Weird**
      *   **Step 1:** Base 70 > 60 -> Proceed.
      *   **Step 2:** Solid reasons -> Adjusted say 75 > 60 -> Proceed.
      *   **Step 3:** Partner agrees to risk -> **RENT BIG HALL.** Your "weird feeling" is addressed in **Step 4 (Final Pause)**. If re-checking steps doesn't reveal an error, the feeling is likely general risk aversion or fatigue. Procedure says Big Hall, but Step 4 allows you to override to Small if unease persists.

  ---

  **What This Procedure CAN'T Fix:**

  1.  **Garbage Data In:** If your past records are incomplete/wrong, the base rate is useless.
  2.  **Ignoring the Hard Stops:** If you override Step 1 because "this time is different," it fails.
  3.  **Judging "Unique Reasons":** Requires honesty about how strong/unique they *truly* are (Modesty Check helps, but isn't perfect).
  4.  **External Shocks:** Sudden blizzard, speaker cancels *after* signing, major competing event pops up.
  5.  **Your Energy/Stress:** It helps combat coffee-hype, but if you're exhausted or rushed, you might skip steps. Build the 15 mins into your schedule rigidly.
  6.  **True Black Swans:** A *genuinely* unprecedented event (real viral explosion, national news coverage) – but these are so rare, betting on them is usually foolish.
  7.  **Partner Alignment:** If your partner is even more optimistic than you, the risk gate weakens.

  **Keep at the Signing Table:** A calculator, your past attendance spreadsheet/notes, a timer (stick to 15 mins!), and this flowchart. It works because it prioritizes cold history over hot stories, builds in humility checks, forces partner accountability for big risks, and has clear "no" gates. Stop losing money!
