answer: |-
  ## Opening Remarks: The Unavoidable Truth-Telling of Art

  Good evening. It’s a privilege to stand before you as we open this vital exhibition, showcasing the powerful, politically engaged work of Black American artists spanning four crucial decades – from the Harlem Renaissance through the Civil Rights Movement. We have art historians, practicing artists, students, and community members here tonight. That’s wonderful. It means we’ll bring many perspectives to these profound works. And I suspect one word might already be hovering in the air for some of you, perhaps causing a little friction: **propaganda**.

  Some will hear that word applied to art and flinch. They might think: *Propaganda? That’s crude, heavy-handed, mere messaging – surely not the complex, nuanced work we see here? Art should transcend politics, shouldn’t it? It should be about beauty, form, universal human experience.* Others might lean in, thinking: *But of course it’s propaganda! Look at the realities it confronts – racism, injustice, resilience, pride. This work has a powerful point to make, a world it demands we see. To call it anything else is to soften its necessary blow.* This is a familiar tension, perhaps even a false choice we get stuck in.

  Tonight, I’d like us to step around that familiar dilemma. Instead of arguing whether this art *is* propaganda or *isn’t*, I want us to consider a different idea, one powerfully articulated nearly a century ago by the towering thinker W.E.B. Du Bois. He argued, essentially, that **all art carries a worldview, a set of values, an implicit argument about how the world is or should be.** It cannot help but do so. Even a painting of a serene landscape whispers something about what is valuable, beautiful, or worth preserving. Art is never neutral. It always leans in a direction. It always, inevitably, *advocates* for something – for a perspective, an emotion, a way of seeing reality.

  So, if all art carries this inevitable weight of perspective, this inherent advocacy, the question isn't really *whether* it's propaganda in this broad sense. The more revealing question is: **How does the art *handle* its own perspective? Is it honest about its aims, or does it hide them?**

  Look around you. Consider Jacob Lawrence’s *Migration Series*. It doesn’t pretend to be just pretty patterns or abstract forms. It *declares* its purpose: to document, with stark beauty and rhythmic urgency, the monumental movement of Black people seeking freedom and dignity. It uses its artistic power – composition, color, sequence – to make you *feel* the scale, the hope, the hardship, the necessity of that journey. It’s honest. It says: *This happened. This mattered. Look.*

  Think of Elizabeth Catlett’s powerful prints and sculptures. Her figures – mothers, workers, protestors – radiate strength, resilience, and often defiance. They aren’t hiding their purpose behind a veil of pure abstraction or disinterested observation. They are clear, unflinching statements about the dignity and power inherent in Black bodies and Black struggle. They *intend* to affirm and empower. They own their advocacy.

  Or consider Romare Bearden’s collages. They fracture and reassemble reality – photographs, painted elements, textures of everyday Black life. This isn't just formal play. It’s a way of *showing* how identity is constructed, how history layers upon the present, how communities persist and create beauty amidst fragmentation. The method *is* the message, and it’s a message deeply engaged with the social and political realities of Black existence.

  **This is the crucial distinction I invite you to consider tonight: not between art that is political and art that is pure, but between art that is *honest* about its perspective and its aims, and art that *conceals* its perspective behind a mask of neutrality or universality.**

  The work in this exhibition largely belongs to the first category. It is often direct. It is often urgent. It uses its formal mastery – color, line, composition, texture, symbolism – not to *escape* the world, but to *engage* with it more deeply, to reveal truths that were being ignored or suppressed. It doesn’t pretend its beauty exists in a vacuum, separate from the struggle for justice or the assertion of identity. Its power comes *precisely* from this fusion of artistic excellence and courageous truth-telling.

  To dismiss this work *merely* as "propaganda" in the narrow, pejorative sense is to profoundly underestimate it. It reduces complex artistic visions to simple slogans. It ignores the incredible skill, the innovation in form, the deep emotional resonance that makes these works endure far beyond their immediate moment. Jacob Lawrence isn’t just delivering a history lesson; he’s creating a visual symphony of movement and meaning. Elizabeth Catlett isn’t just making political posters; she’s shaping enduring icons of human strength.

  Conversely, to insist that serious art *must* stand completely apart from politics, to retreat into the notion of "art for art’s sake" as a safe, neutral space, is often itself a political stance. It’s a stance that frequently benefits the status quo, allowing comfortable assumptions to go unchallenged. It pretends that perspective and power don't shape what we deem "universal" or "neutral." Art that hides its advocacy can be just as potent – sometimes more insidiously so – than art that declares it.

  **This exhibition invites us not to choose between art and politics, but to witness how powerful art emerges *from* the crucible of human experience – including the struggle for justice and self-definition.** These artists used their formidable talents not to escape the world, but to interpret it, challenge it, celebrate their community within it, and demand that we *see* it differently. They were honest about what they were trying to do: to bear witness, to resist, to affirm, to build.

  So, as you move through these galleries tonight, don't get caught in the trap of "Is it art or is it propaganda?" Instead, ask: **What vision of the world is this artist showing me? What are they honestly trying to make me feel, understand, or question?** And then, appreciate the sheer artistry – the brushwork, the composition, the symbolic language – with which they achieve that profound and necessary honesty. This is art doing what art at its most vital always does: shaping our vision of what it means to be human, right here, right now.

  Thank you. The exhibition is open.
