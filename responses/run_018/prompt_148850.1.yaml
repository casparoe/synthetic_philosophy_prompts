prompt: |-
  I'm a backend engineer with no formal philosophy background, and last week me and my flatmate were arguing over pints whether saying "British people are reserved" actually means anything, or if it's just a lazy statistical ghost. I came across this split between people who think "national character" is incoherent essentiallism and people who think it's a real pattern you just have to model correctly, but I can't tell if they're actually disagreeing or just using different words for the same thing. Could you draft the joint statement of an adversarial collaboration between two camps?

  Camp One — call them the Anti-Reificationists — hold that national character is basically incoherent: it's an ecological fallacy where population averages get mistaken for shared mental stuff, and generalising about peoples is only acceptable in a narrow statistical sense with explicit variance reported, otherwise it's harmful stereotyping.

  Camp Two — the Modal-Institutionalists — hold that national character is coherent if you stop treating it like a shared soul and instead model it as an emergent equilibrium of institutions, norms and feedback loops that produces stable modal behaviour. They think rejecting all generalisation throws out the baby with the bathwater and kills comparative social science.

  The niche bit I want both sides to wrestle with: whether culture should be understood as a "distributed computation" running across social networks (like nodes running the same protocol) versus a "shared mental representation" stored in individual heads (like everyone carrying the same mental map). They should also specify exactly what'd convince them they're wrong — not just "more data" but a specific study design or logical argument.

  Please structure it like this:

  1. A numbered "Agreed Claims" section — precise statements both sides would actually sign.

  2. A disagreements table with these exact columns:
  - Issue
  - Anti-Reificationist wording (they'd accept for themselves)
  - Modal-Institutionalist wording (they'd accept for themselves)
  - The crux (the sub-question that'd actually shift someone)
  - Test or case both agree is relevant, with each camp's predicted outcome written in advance

  3. A short "Verbal vs Substantive" call-out — if part of the fight is just wordplay, say which part and why.

  After the statement, please output a JSON object with exactly these fields:
  {
    "collaboration_domain": "national character coherence and generalisation",
    "camp_a": "Anti-Reificationists",
    "camp_b": "Modal-Institutionalists",
    "agreed_claims_count": <number>,
    "disagreement_rows": <number>,
    "verbal_disagreement_present": <true or false>,
    "crux_most_likely_to_shift_views": "<string>",
    "niche_distinction_injected": "distributed computation vs shared mental representation"
  }

  Keep it casual but philosophically precise — I'm not writing an essay, just trying to see where the real disagreement lives. Don't bother with references, reading lists, or citations; I don't have access to check them anyway. And please write in British English — I spelt "essentiallism" wrong earlier, so feel free to correct my spelling but keep the vibe rough.
