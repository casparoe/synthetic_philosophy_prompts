  }  
  ```  

  ### Notes for the Pub  
  - **What’s at stake**: AR fears stereotyping; MI fears losing tools to explain why societies differ beyond GDP.  
  - **How to settle it**: Run the bloody queue experiment. Get a Brit to chat up strangers at a bus stop and measure dirty looks vs. chat-ups in Brazil.  
  - **Your spelling fix**: "Essentialism" (not "essentiallism") – but we kept "reification" to sound posh.  
  - **Verdict**: They’re *partly* talking past each other, but the core is whether society is more than the sum of its people. Like arguing if "WiFi" is just devices or the invisible field.
