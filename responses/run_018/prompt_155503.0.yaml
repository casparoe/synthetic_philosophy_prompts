answer: |-
  You've pinpointed a profound and under-explored tension within Arendt's thought, exposing a conceptual gap between *active lying* and *structural omission*. Let's break down the dependencies and implications, staying true to your request to avoid simple summaries and focus on the core concepts.

  ### The Core Tension: Fragile Facts & the Shared World
  1.  **The Fragility of Factual Truth:**
      *   Arendt distinguishes **factual truth** (contingent, historical, specific events) from **rational truth** (logical, philosophical, timeless). Rational truths compel assent through reason (e.g., 2+2=4). Factual truths, however, rest entirely on **testimony** and **witness**. They happened *once*, and their reality depends on being *seen*, *reported*, *remembered*, and **accepted** by others within a community.
      *   This dependence on human witness makes them inherently **politically vulnerable**. They lack the self-evident, coercive power of reason. A factual truth can be denied, forgotten, suppressed, or drowned out without logical contradiction *per se*.

  2.  **The Shared World of Appearance & Political Action:**
      *   Arendt's political philosophy centers on the **"space of appearance."** Politics isn't about isolated contemplation; it arises *between* people when they act and speak together in a public realm. This realm is constituted by **plurality** (distinct individuals interacting) and relies on a **shared sense of reality** – a common world where things "appear" to all.
      *   This shared world is the very **condition for meaningful political action**. Without a common understanding of *what is*, deliberation, persuasion, compromise, and collective action become impossible. Politics dissolves into either force or solipsism.

  **The Dependency:** Factual truths are the **building blocks** of the shared world of appearance. They provide the stable, objective ground upon which diverse perspectives can engage, argue, and build a common reality. If factual truths are systematically undermined, the shared world itself crumbles. Political action loses its mooring.

  ### Bureaucratic Omission: Defactualization Prior to Falsehood
  This is where your concept of "bureaucratic omission" becomes crucial. It operates *before* the stage of active lying and exploits the inherent vulnerability of factual truth in a way that bypasses direct contradiction:

  1.  **Attacking the Conditions of Appearing:**
      *   Arendt's primary concern with lying (like in the Pentagon Papers context) is the **active fabrication of an alternative reality** – replacing the shared world with a fictional narrative. This is a direct assault *after* facts have appeared.
      *   **Bureaucratic omission is an assault on the *pre-conditions* for facts to appear *at all* within the institutional-political realm.** It doesn't (necessarily) deny a fact *once it's known*; it ensures the fact **never enters the administrative vocabulary or cognitive framework** where decisions are made. It makes the fact "administratively unthinkable."

  2.  **How Omission Destroys Common Reality:**
      *   **Suppressing Testimony:** Institutional structures (categories, forms, reporting lines, agendas, key performance indicators) determine **what counts as relevant information**. By structurally excluding certain categories of experience or evidence (e.g., environmental impact, social cost, historical precedent), they silence potential testimony *before it can be uttered* within the decision-making space. The witness is rendered mute by the system.
      *   **Dismantling Frameworks of Recognition:** Facts need conceptual frameworks to be recognized *as* facts. If the institutional framework lacks the category for "systemic discrimination," "climate refugee," or "long-term ecological cost," then instances of these phenomena cannot be registered, recorded, or processed *as such*. They become invisible anomalies, noise, or simply "don't exist" within the system's ontology.
      *   **Eroding the Ground for Plural Witness:** The shared world relies on facts being witnessed *and confirmed* by multiple perspectives. Omission prevents this confirmation from happening *institutionally*. If a fact relevant to worker safety is excluded from factory reports, it cannot be corroborated or challenged *within the official record*. The plural witness is fragmented and prevented from coalescing around the fact.
      *   **Destroying Correctability by Experience:** Arendt emphasizes that factual truths, unlike fabrications, can be corrected by experience. Omission makes this impossible. If experience (e.g., community harm, environmental degradation) is systematically excluded from the institutional record and decision-making criteria, it cannot "correct" the official narrative. The system becomes experientially sealed.

  ### Is it Lying? Or Something More Fundamental?
  *   **Not "Lying" in Arendt's Usual Sense:** Arendt typically defines lying as the *deliberate assertion of falsehood* as truth. Bureaucratic omission doesn't usually involve *asserting* an untruth about the excluded fact. It simply *ignores* it. It doesn't say "X is false"; it says "X is irrelevant, non-existent within our framework, not a category we recognize."
  *   **A More Fundamental Mode of Defactualization:** This is where your insight is vital. Omission operates at a **deeper, constitutive level**:
      1.  **Prior to Assertion:** It prevents the fact from even becoming an *object* for potential truthfulness or falsehood *within the institutional sphere*. It destroys the fact's *ontological status* in the administrative world.
      2.  **Structural Violence:** It's not merely an individual deception but a **systematic dismantling of the institutional conditions necessary for factual reality to appear and matter**. It's the quiet erosion of the shared world's foundation.
      3.  **The Tyranny of the Framework:** It replaces the open-ended, pluralistic contestation of the public sphere with the **tyranny of pre-defined categories**. What cannot be captured by the administrative grid ceases to be politically real. This is defactualization by **epistemological foreclosure**.

  ### Conclusion: The Silent Undermining of the *Inter-Est*
  The conceptual issue at stake is the **pre-emptive destruction of the common ground (the *inter-est*)** necessary for politics. Arendt shows that factual truth is vulnerable *because* it depends on the shared world of appearance. Bureaucratic omission exploits this vulnerability in the most insidious way possible: it doesn't attack the building blocks head-on; it **dissolves the mortar that binds them into a common structure**.

  It bypasses the need for direct lies by ensuring that certain realities **never achieve the status of "facts" within the political-administrative realm**. They become "administratively unthinkable" – not disputed, but *invisible* and *inaudible* to the system. This is not lying; it is the **structural annihilation of the conditions for truthfulness itself within the sphere of power**. It reveals that the deepest threat to the factual fabric of the shared world isn't always the loud lie, but the silent, systemic refusal to *allow* certain realities to appear and be witnessed at all. It attacks the "space of appearance" by shrinking the boundaries of what is allowed to appear.
