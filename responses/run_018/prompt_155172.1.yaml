  hey so i've been thinking about this by myself and im stuck. everyone talks about the trojan war, king arthur, and the exodus like they're in three different bins—history, legend, or myth. but i dont get what the actual rule is for moving something up. like, i heard historians use a three-source check, or maybe its about archeological hits? for troy, schliemann found stuff but in the wrong layer, and now they say it was real but blown up into myth. for arthur, we have glastonbury and those welsh texts, so thats more than three sources, right? but he still gets called a legend. and the exodus has the merneptah stele naming israel, plus those hyksos theories, yet alot of scholars still file it under legend. so is there like an official board that votes? or maybe its about whether the story has a supernatural part—like if god parts the sea then its automatically myth? that cant be right because some history books still discuss the exodus as a cultural memory. please explain in american english, keep it casual, and tell me if im missing something obvious. also i typed this on my phone so sorry if theres a typo or two.
