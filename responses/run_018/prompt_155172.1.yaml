  Okay, let's tackle this user's question. They're confused about how historians categorize events like the Trojan War, King Arthur, and the Exodus into history, legend, or myth. They mention specific examples: Schliemann's findings at Troy but in the wrong layer, Arthur having multiple sources but still being a legend, and the Exodus having the Merneptah Stele yet being debated. 

  First, I need to address their main concern: there's no official rule or board deciding these categories. The user seems frustrated by the inconsistency, so explaining the fluid nature of historical analysis is key. They might be looking for clear criteria, but I should emphasize it's about scholarly consensus based on evidence.

  The user brought up the three-source check. That's a good starting point. But multiple sources alone aren't enough; reliability matters. For example, Arthur has texts like Geoffrey of Monmouth, but those are centuries later and blend fiction. The user might not realize that the timing and bias of sources affect their credibility. 

