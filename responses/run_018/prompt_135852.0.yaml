prompt: |-
  hey — quick design ask. i run a senior seminar on the meaning of work and automation (15 students, 80 minutes, philosophy majors mostly). i want them to feel, not just discuss, how automation can hollow out work without eliminating the job itself. specifically, i'm playing with a distinction i call output-work versus recognition-work: the first makes something tangible, the second makes you visible as a contributor. when automation takes over output, recognition-work becomes a kind of empty ritual — but people cling to it because status and coordination depend on it.

  design an in-class game or structured role-play that puts them in this situation. split them into makers and coordinators in a fictional small factory/community. at minute 25 drop an automation card that eliminates all maker tasks but leaves coordinator roles intact — except now they're coordinating phantom production. use real small stakes (candy, or points that determine who picks teh seminar topic next week). include rules, materials, the payoff scheme, a timeline, and a debrief that maps specific moments in the game onto the output/recognition split.

  also tell me what will predictably go wrong the first time i run it, and be frank about which feature of the idea the activity can't reproduce (i'll have to supply that part in discussion).

  please format your answer as a JSON object with exactly these fields:
  - setting_and_goals: the classroom context and what students should come away seeing
  - injected_concept: brief summary of the output-work vs recognition-work split
  - rules_and_materials: how the game works, roles, and the automation card
  - payoff_and_stakes: the incentive scheme
  - timeline_minutes: breakdown of the 80 minutes
  - debrief_mapping: which game moments map to which parts of the concept
  - predictable_failure: what goes wrong on first run and how to handle it
  - honest_limitation: what feature of the idea the game can't reproduce

  no bibliographies or reading lists, please — my students can't look things up mid-class anyway.
reasoning: |-
  We are designing a role-play game for a senior seminar on the meaning of work and automation. The goal is to illustrate the distinction between output-work (tangible production) and recognition-work (making oneself visible as a contributor) and how automation that takes over output can leave recognition-work as an empty ritual.

  The game will have two roles: Makers (who produce tangible output) and Coordinators (who manage and make the work visible). After 25 minutes, an "automation card" is introduced that eliminates the Maker tasks, leaving Coordinators to continue their work even though there is no real production. The stakes are small (like candy or choosing the next seminar topic).

  We'll structure the response as a JSON object with the required fields.

  Let's break it down:

  1. **setting_and_goals**: Describe the classroom context and the learning objectives.
  2. **injected_concept**: Briefly explain output-work vs recognition-work.
  3. **rules_and_materials**: The game rules, roles, and how the automation card works.
  4. **payoff_and_stakes**: What the incentives are and how they are earned.
  5. **timeline_minutes**: A minute-by-minute breakdown of the 80-minute class.
  6. **debrief_mapping**: Link specific game moments to the concepts.
  7. **predictable_failure**: What might go wrong the first time and how to handle it.
  8. **honest_limitation**: What the game cannot capture about the real-world phenomenon.

  Now, we'll design the game:

  **Game Concept**: 
  - **Title**: "The Phantom Factory"
  - **Setting**: A small factory that produces simple origami animals (or another easy-to-produce item) and a community board that tracks production and recognizes contributions.
  - **Roles**:
    - **Makers (10 students)**: They produce origami animals (or draw simple shapes) using provided materials. Each completed item is submitted for points.
    - **Coordinators (5 students)**: They have three main tasks:
        - *Tracking*: Record each Maker's output on a public board (e.g., tally marks).
        - *Quality Control*: Randomly check a few items and award bonus points for quality.
        - *Recognition Rituals*: At intervals, publicly acknowledge top Makers (e.g., with applause or a star on the board) and share production updates.

  **Automation Card**: At minute 25, we introduce a card that says: "AUTOMATION UPDATE: The factory has installed origami robots (or printers) that perfectly produce all the required items. Makers are relieved of production duties. They must stop making. Coordinators continue their duties as before, but now there is no real output to track or quality to control. However, the factory still values the coordination and recognition processes."

  **Payoff**:
  - Makers earn points for each accepted item (pre-automation) and can get bonuses for quality.
  - Coordinators earn a base rate of points for performing their duties, plus bonuses for team performance (pre-automation) and for maintaining morale (post-automation).
  - Post-automation, Makers cannot produce, so they might engage in other activities (but not production). Coordinators must continue their rituals without real output.

  **Stakes**: The total points at the end determine which group (Makers or Coordinators) gets to choose the next seminar topic (or a small candy reward). Alternatively, individual points can be used to pick from a prize pool.

  **Timeline**:
  - 0-10 min: Setup and explanation of rules.
  - 10-25 min: Pre-automation phase (Makers produce, Coordinators track and recognize).
  - 25-30 min: Introduce automation card. Makers stop production.
  - 30-50 min: Post-automation phase (Coordinators continue their tasks without real output, Makers are idle but might be asked to fill out a "morale survey" or similar to keep them engaged).
  - 50-60 min: Game ends, points are tallied, and winners announced.
  - 60-80 min: Debrief.

  **Debrief Mapping**:
  - Pre-automation: Highlight how Coordinators' work (tracking, quality checks, recognition) was tied to real output. This is when both output-work and recognition-work were aligned.
  - Post-automation: Point out how Coordinators are now performing empty rituals (e.g., tallying non-existent output, giving recognition without any real achievement). Makers are left without output-work and may feel useless, but Coordinators still have to do their recognition-work for the sake of status and coordination.

  **Predictable Failure**:
  - Makers might stop paying attention after automation and become disruptive.
  - Coordinators might struggle to invent ways to continue their work without real output, leading to confusion or laughter that breaks the simulation.
  - The point system might be gamed or become meaningless post-automation.

  **Honest Limitation**:
  - The game cannot replicate the long-term psychological toll and the slow realization of emptiness in real workplaces. The game is a short simulation and the stakes are low, so students might not feel the real weight of status anxiety or the fear of job loss.

  Now, we'll write the JSON object accordingly.
