answer: |-
  Here's a conceptual mapping of the status of normative discourse within Quine's naturalized epistemology, focusing on the internal logic and tensions:

  1.  **The Core Tension:**
      *   **Physicalist Commitment:** Quine holds a robust physicalism: all legitimate discourse must ultimately be grounded in, or reducible to, the language of physics. Genuine knowledge claims must connect, however distantly, to patterns of sensory stimulation and observable behavior. Terms earn their keep through their causal-nomic roles within the scientific web that predicts and explains sensory input.
      *   **Ethical Detachment:** Quine consistently characterizes ethical statements as lacking "empirical content" in the specific sense that they lack *direct* causal-nomological links to sensory stimulation. They are not responsive to observation in the way "There's a rabbit" or even "Electrons have charge" are. They are "empirical" only in the trivial sense that the *words themselves* are learned through social conditioning, not through direct ostension linking them to sensory triggers.

  2.  **The Nature of Detachment and Web Membership:**
      *   **Not Non-Cognitivism (Strictly Speaking):** Quine avoids the classic non-cognitivist move (e.g., emotivism). He grants that moral sentences are truth-apt; they are declarative sentences capable of being true or false. They possess propositional form and can be embedded in logical structures.
      *   **Peripheral but Disconnected:** While the *entire web* is anchored at the periphery by sensory experience, ethical statements occupy a unique position *at* that periphery but *detached* from the core mechanism of confirmation. They are not nodes through which empirical evidence flows *up* to theoretical claims or *down* to guide prediction. Their truth-value isn't determined by sensory evidence in the same way, nor do they contribute to the empirical predictive power of the web.
      *   **Pragmatic Retention as Primary:** Their inclusion within the "fabric of belief" is overwhelmingly driven by **pragmatic tolerance**. They are deeply ingrained patterns of verbal behavior acquired through social conditioning. They serve crucial social functions: coordinating behavior, expressing attitudes, fostering group cohesion, and condemning transgressions. Excluding them would be practically impossible and socially disruptive. They persist because they *work* for social life, not because they track mind-independent moral facts constrained by evidence.

  3.  **Indirect Anchoring? Anthropology & Psychology:**
      *   **Descriptive, Not Normative:** Anthropology and psychology can *describe* and *explain* moral behavior, beliefs, and utterances as natural phenomena. They can study how moral norms arise evolutionarily, how they are learned, their psychological effects, and their social functions. This provides an *empirical grounding for the study of morality as a human practice*.
      *   **Not Grounding Normativity:** Crucially, this scientific study does *not* provide empirical grounding for the *normative force* or *truth* of the moral claims themselves. Discovering that a society believes "X is wrong" because it promotes group survival doesn't empirically confirm that "X *is* wrong." The scientific account remains descriptive, explaining *why people hold* certain moral views, not validating those views as correct representations of normative reality. The moral predicate "wrong," within the scientist's description, functions purely descriptively (e.g., "They utter 'X is wrong' when...").

  4.  **Underdetermination: Radical vs. Benign:**
      *   **Scientific Underdetermination:** For scientific theories, underdetermination means multiple, empirically equivalent theories can fit all possible sensory data. However, these theories are still *massively constrained* by that data. They must predict and explain sensory input. Choosing between them involves pragmatic virtues (simplicity, conservatism, fecundity) applied within an empirically bounded space.
      *   **Ethical Underdetermination:** Ethical claims face a far more radical form of underdetermination. There is *no* body of sensory data that significantly constrains which moral principles are "true." Sensory input alone cannot arbitrate between fundamentally different normative systems (e.g., utilitarianism vs. deontology) in the way it arbitrates between geocentric and heliocentric models. Pragmatic factors (social utility, coherence with other beliefs, emotional resonance) dominate entirely, but without the anchor of empirical adequacy that guides scientific pragmatism. Moral discourse floats much more freely.

  5.  **The Outcome: Quietist Instrumentalism with a Descriptive Shadow:**
      *   **Instrumentalism:** Quine's position strongly leans towards a **quietist instrumentalism** regarding the *normative* aspect of ethics. Moral sentences are instruments for social coordination and expression. Their "truth" is essentially internal to the socially conditioned linguistic framework. There is no further, naturalistically respectable, mind-independent moral reality they aim to represent. The aspiration to genuine moral *knowledge* (in the strong, representational sense tied to empirical confirmation) is abandoned.
      *   **Minimal Realism?:** Does behavioral science allow for *minimal* moral realism? Only in a severely attenuated, descriptivist sense:
          *   We can be realists about moral *sentiments* or *behavioral dispositions* as natural phenomena.
          *   We can identify statements like "Society S believes stealing is wrong" as objectively true/false based on observable behavior.
          *   We *cannot*, on Quinean grounds, establish the objective truth of "Stealing *is* wrong" as a normative claim grounded in science. Science describes the behavior associated with the utterance, not the normative fact it purports to denote.
      *   **The Conceptual Tension:** The unresolved tension lies in Quine's insistence on truth-aptness combined with the denial of empirical content. If moral sentences are truth-apt but their truth conditions are utterly disconnected from the causal web of sensory evidence and lack any naturalistically acceptable grounding *besides* social convention and pragmatic utility, then their "truth" becomes a thin, disquotational property ("'X is good' is true iff X is good") lacking substantive connection to the physical world his ontology demands. This pushes his view perilously close to a sophisticated form of conventionalism or non-factualism, despite his semantic scruples.

  **In essence:** For Quine, moral discourse resides within the web of belief due to pragmatic social necessity, not epistemic justification. It possesses propositional form but lacks the empirical content that defines genuine scientific knowledge. Its connection to physicalism is indirect and descriptive (via the science *of* morality), not normative. The radical underdetermination of ethics highlights its detachment from sensory constraints. While behavioral science provides a naturalistic account *of* moral practices, it cannot validate normative claims themselves. Quine's position thus resolves into a quietist instrumentalism: moral language is a useful social tool, not a vehicle for representing objective moral facts within the natural world. The tension between its truth-apt form and its causal/nomological isolation remains a defining feature of its peculiar, pragmatically tolerated, place in his architecture.
