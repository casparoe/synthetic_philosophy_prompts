  **Q1: Does wild-animal suffering carry direct moral weight comparable to farmed-animal suffering?**  
  - **No** → Proceed to Q2 (Branch A: Farmed-animal-centric views).  
  - **Yes** → Proceed to Q3 (Branch B: Wild-suffering-inclusive views).  

  ---

  ### **BRANCH A: Wild suffering is NOT morally comparable to farmed suffering**  
  *Focus: Moral weight applies primarily to human-caused suffering (farming), not natural suffering (wild).*  

  #### **Q2: Are deaths in crop cultivation included in the moral calculus?**  
  - **No** → Proceed to Q4.  
  - **Yes** → Proceed to Q4.  
  *(Note: Crop deaths here refer only to animals killed in plant agriculture for animal feed/human food.)*  

  #### **Q4: How should beef/chicken comparisons be evaluated?**  
  - **Suffering per calorie** (e.g., chicken requires more lives/calorie than beef).  
  - **Neural-complexity weighting** (e.g., cows > chickens in moral weight per individual).  
  *(Note: Land-use effects excluded here, as wild suffering is discounted.)*  

  **Leaf A1: Crop deaths excluded + Suffering per calorie**  
  - **Name**: Classical Welfare Carnism.  
  - **Core claim**: Only direct farming suffering matters; minimize deaths/calorie (e.g., prefer beef over chicken).  
  - **Awkward commitment**: Must accept vast crop deaths as irrelevant, even if avoidable.  
  - **Distinctness**: Separates from consequentialists by excluding supply-chain externalities.  

  **Leaf A2: Crop deaths excluded + Neural-complexity weighting**  
  - **Name**: Species-Weighted Carnism.  
  - **Core claim**: Prefer meats from less neurologically complex animals (e.g., chicken over beef) due to reduced moral weight per life.  
  - **Awkward commitment**: Must defend neural complexity as the primary metric (e.g., insect suffering negligible).  
  - **Distinctness**: Differs from A1 in prioritizing species over efficiency.  

  **Leaf A3: Crop deaths included + Suffering per calorie**  
  - **Name**: Effective Altruist Anti-Speciesism.  
  - **Core claim**: Minimize total suffering/calorie, including crop deaths (e.g., chicken may be worse than beef due to feed inefficiency).  
  - **Awkward commitment**: Must ignore wild suffering while condemning identical deaths in crop fields.  
  - **Distinctness**: Rejects "naturalness" as morally relevant.  

  **Leaf A4: Crop deaths included + Neural-complexity weighting**  
  - **Name**: (Unnamed).  
  - **Core claim**: Minimize neural-complexity-adjusted suffering, including crop deaths (e.g., beef may be worse if cow > mouse in moral weight).  
  - **Awkward commitment**: Must weight species in crop deaths (e.g., insects < rodents) but not in wild settings.  

  ---

  ### **BRANCH B: Wild suffering IS morally comparable to farmed suffering**  
  *Focus: Natural suffering (e.g., predation) demands moral attention akin to farming.*  

  #### **Q3: Are deaths in crop cultivation included in the moral calculus?**  
  - **No** → Skip to Q5.  
  - **Yes** → Proceed to Q5.  
  *(Note: Excluding crop deaths is inconsistent here; diagnosed as **incoherent** since crop deaths are human-caused wild suffering.)*  

  #### **Q5: How should beef/chicken comparisons be evaluated?**  
  - **Suffering per calorie** (direct + crop deaths only).  
  - **Land-use displacement & trophic cascades** (e.g., beef destroys more wild habitat, increasing wild suffering).  
  - **Neural-complexity weighting** (applied universally).  

  #### **Q6: Does the naturalness of predation justify non-intervention?**  
  - **Defeasible reason** → Intervention permissible if benefits outweigh "naturalness" value.  
  - **Practical-decisive reason** → Intervention forbidden due to historical failures.  
  - **Epistemic-humility reason** → Intervention forbidden until ecological knowledge improves.  

  **Leaf B1: Crop deaths included + Suffering per calorie + Naturalness defeasible**  
  - **Name**: Intervention-Cautious Wild Utilitarianism.  
  - **Core claim**: Minimize direct/crop suffering per calorie; intervention in wild suffering only if net benefit is clear and naturalness is overridden.  
  - **Awkward commitment**: Must accept "naturalness" as a value while rejecting it in farming contexts.  

  **Leaf B2: Crop deaths included + Land-use effects + Practical-decisive against intervention**  
  - **Name**: (Unnamed).  
  - **Core claim**: Meat choices should minimize habitat destruction (e.g., reject beef for chicken), but intervention is impermissible due to human incompetence.  
  - **Awkward commitment**: Must accept that humans can manage land use but not predation, despite both involving ecosystems.  
  - **Distinctness**: Separates from "naturalness" views by emphasizing human fallibility.  

  **Leaf B3: Crop deaths included + Neural weighting + Epistemic humility against intervention**  
  - **Name**: Complexity-Weighted Non-Interventionism.  
  - **Core claim**: Weight suffering by neural complexity (e.g., prey fish < mammals); reject intervention due to ignorance, not naturalness.  
  - **Awkward commitment**: Must endorse weighting wild animals but never acting to aid them.  

  **Leaf B4: Crop deaths included + Land-use effects + No intervention reason**  
  - **Name**: Total Suffering Minimization.  
  - **Core claim**: Minimize total suffering (farmed + crop + wild via land use); intervention required if net suffering decreases.  
  - **Awkward commitment**: Must endorse large-scale intervention (e.g., eradicating predators) despite uncertain outcomes.  

  **Leaf B5: Crop deaths excluded + Any combination**  
  - **Status**: **Incoherent** (unoccupied).  
  - **Diagnosis**: Inconsistent to weight wild suffering but exclude crop deaths, which are human-caused wild suffering.  

  ---

  ### **Unoccupied Positions & Uncertainties**  
  1. **Branch B, Crop deaths excluded**:  
     - Diagnosed as **incoherent** (0% confidence). Wild suffering must include *all* human-caused suffering; excluding crop deaths arbitrarily ignores this.  
  2. **Branch A, Land-use effects included**:  
     - Diagnosed as **incoherent** (95% confidence). Land-use affects wild animals; including it contradicts Branch A’s rejection of wild suffering’s moral weight.  
  3. **Branch B, Neural weighting + Land-use effects**:  
     - Diagnosed as **unexplored** (70% confidence). Possible but rarely discussed (e.g., weighting habitat loss by species complexity).  

  ---

  ### **Indistinguishable Positions**  
  - **Leaf A1 vs. A3**: Both use suffering/calorie but differ on crop deaths. Tree separates them cleanly.  
  - **Leaf B2 vs. B3**: Both reject intervention but for different reasons (practical vs. epistemic). Tree separates them.  
  - **Indistinguishable pair**: None. All combinations are resolved by sequential branching.  

  ---

  ### **Confidence & Weaknesses**  
  - **Completeness confidence**: **85%**. Covers major axes (moral weight, scope, metrics, intervention justifications).  
  - **Least certain element**: **Branch B’s crop-death exclusion as incoherent**.  
    - Why: Some may argue crop deaths are "indirectly" wild, creating ambiguity.  
    - Adjusted: Classified as incoherent to maintain consistency; otherwise, the taxonomy collapses positions.  

  This taxonomy ensures your ethicist and conservationist have genuinely distinct premises (e.g., one may reject intervention on epistemic grounds, another on naturalness). Use the leaves to assign concrete commitments, avoiding rhetorical overlap.
