answer: |-
  ### Upper-Level Normative Ethics Seminar: 90-Minute Essay Exam  
  **Question:**  
  Moral uncertainty arises when an agent is unsure which moral theory (e.g., consequentialism vs. deontology) is correct. Standard responses maximize *expected choice-worthiness* (ECW) but face the **intertheoretic comparison problem**: theories may lack a common scale for comparing "choice-worthiness" across frameworks. Consider a novel proposal, the **Regret-Translation Protocol (RTP)**:  
  1. When facing a choice involving a deontological constraint (e.g., "Do not lie"), identify a committed deontologist.  
  2. Assign a **moral regret weight** (MRW) equal to the *first-person disutility* this deontologist reports at the prospect of violating the constraint.  
  3. Treat MRW as a cost to be included in a consequentialist calculation (e.g., subtracting MRW from overall utility).  
  4. Aggregate outcomes using standard expected-utility maximization.  

  **Critically evaluate RTP** by addressing the following:  
  (i) Precisely explain why ECW frameworks struggle with *intertheoretic comparison* (beyond mere disagreement about probabilities or values). Focus on structural incompatibilities in value representation.  
  (ii) Identify the key *normative assumption* RTP makes about the authority of first-person moral regret to supply a "common metric." What gives MRW its epistemic or practical force?  
  (iii) Argue whether RTP genuinely resolves moral uncertainty neutrally or instead *begs the question* by collapsing deontology into consequentialism. Does it fairly represent both theories?  
  (iv) Assess whether RTP *reduces moral uncertainty to empirical uncertainty* about our reactive attitudes. If successful, does this undermine the coherence of normative uncertainty?  

  ---

  ### Model Answer (650 words)  
  Moral uncertainty demands guidance when agents doubt foundational moral theories. Standard ECW approaches fail because they presuppose a unified scale for "choice-worthiness" (*i*). Consequentialism evaluates acts by outcomes, assigning cardinal utilities to states of affairs. Deontology often rejects outcome-maximization, treating constraints (e.g., "never torture") as lexical prohibitions immune to trade-offs. These frameworks describe *fundamentally different objects*: consequentialism compares world-states, while deontology evaluates acts-as-types. Worse, their *ordering relations* clash: consequentialism’s continuous rankings conflict with deontology’s discontinuous obligations (e.g., no amount of utility can justify murder). ECW requires comparing "units" of deontological forbiddenness with "units" of welfare, but no common measure exists—this is the intertheoretic comparison problem.  

  RTP attempts to solve this by translating deontological constraints into a consequentialist metric via *moral regret weight* (MRW) (*ii*). It assumes that **the intensity of first-person regret reported by a committed deontologist provides an authoritative, intertheoretically comparable measure of the constraint’s normative force**. This presupposes that phenomenological responses (like anticipatory regret) track objective moral reasons *and* that these responses can be quantified as disutilities. RTP thus grants epistemic authority to subjective experience: the deontologist’s visceral distress becomes evidence of the constraint’s "cost" in a unified welfare calculus.  

  However, RTP does not neutrally resolve uncertainty; it **covertly imposes a consequentialist framework** (*iii*). Deontology holds that certain acts are intrinsically wrong *regardless* of their regret-intensity or consequences. By reducing "do not lie" to a utility deficit, RTP ignores the deontological stance that truth-telling is *categorically required*, not merely preferable to its disutility. A deontologist would reject the claim that violating a constraint is permissible if compensating utility (minus MRW) is high enough—yet RTP permits exactly this. The protocol assumes outcomes can be aggregated by summing utilities (including negative MRW), a method deontology structurally opposes. Thus, RTP does not *compare* theories; it *re-describes* deontology in consequentialist terms, privileging the latter’s structural logic and begging the question against non-consequentialist value structures.  

  Even if practically useful, RTP **collapses moral uncertainty into empirical uncertainty about psychology** (*iv*). If MRW resolves normative conflicts, then "which act is right under moral uncertainty?" reduces to "how much regret would a deontologist feel?". This conflates normative authority with empirical introspection. Moral uncertainty concerns *which theory correctly describes reasons for action*, but RTP makes the "correctness" of a constraint depend on human emotional responses. If deontology is true, its constraints bind agents irrespective of whether anyone feels regret. RTP thus transforms the problem: rather than weighing theories about objective reasons, agents merely predict their own (or others’) reactive attitudes. This implies the original problem was incoherent—if moral truth is determined by contingent psychology, normative uncertainty was always just empirical ignorance about ourselves. Yet this contradicts the phenomenology of moral dilemma, where agents feel torn between *principled* commitments, not just emotional preferences.  

  In sum, RTP evades intertheoretic comparison by coercing deontology into a consequentialist mold. It substitutes the hard problem of normative incommensurability with a tractable empirical calculation—but at the cost of fidelity to the theories it claims to reconcile.  

  ---

  ### Marking Scheme (20 marks total)  
  **Must-hit moves** (4 marks each):  

  1. **Diagnose ECW’s structural incommensurability**  
     - *Full marks*: Explain how value ontology (e.g., act-types vs. outcomes) and ordering (lexical vs. continuous) create irreducible incomparability.  
     - *Failure mode*: Merely noting theories "disagree" or focusing on probability assignments.  

  2. **Articulate RTP’s assumption about regret’s authority**  
     - *Full marks*: Identify the conflation of subjective regret with objective normative force as a presupposition bridging theories.  
     - *Failure mode*: Describing RTP’s mechanism without critiquing why regret is treated as authoritative.  

  3. **Demonstrate RTP’s question-begging imposition of consequentialism**  
     - *Full marks*: Argue that RTP’s aggregation method violates deontology’s core commitment to non-tradeable constraints.  
     - *Failure mode*: Claiming RTP is "pragmatic" without addressing framework bias.  

  4. **Assess reduction to empirical uncertainty**  
     - *Full marks*: Show that RTP replaces normative doubt with prediction of psychological reactions, altering the problem’s nature.  
     - *Failure mode*: Treating regret as a neutral proxy without metaethical implications.  

  5. **Synthesize implications for moral uncertainty’s coherence**  
     - *Full marks*: Conclude that RTP dissolves normative uncertainty by redefining it empirically, undermining its initial premise.  
     - *Failure mode*: Ignoring how RTP’s success invalidates the original problem.  

  ---

  **Design Notes**:  
  - The question forces engagement with *structural* incompatibility (not content disagreement) and RTP’s *covert framework imposition*.  
  - Difficulty stems from exposing RTP’s sleight-of-hand: it promises neutrality while smuggling in consequentialism’s architecture.  
  - Model answer hits all five moves: (i) §1, (ii) §2, (iii) §3, (iv) §4, (v) §4–5.
