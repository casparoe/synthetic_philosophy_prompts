answer: |-
  Here's a brute-force decision tree mapping the logical space of "which computations matter morally," built from your specified branching questions and concrete cases. It exposes awkward commitments and flags gaps. **Important Caveat:** This tree assumes "moral patienthood" (something that can be harmed/benefited) requires **sentience/phenomenal consciousness**. If your friend rejects this link, the tree collapses.

  ### Core Assumption
  *   Moral patienthood requires sentience/phenomenal consciousness ("what it's like to be X").

  ### Branching Questions & Cases
  1.  **Substrate Independence?**
      *   **Yes:** Functional organization is sufficient for potential sentience/moral status, regardless of physical implementation (Silicon, emulation, etc.). (*Case: Perfect digital twin of a human running offline* might be sentient).
      *   **No:** The specific physical substrate (e.g., biological wetware, specific causal powers) is necessary for sentience/moral status. (*Case: Perfect digital twin* is fundamentally not sentient, just a complex zombie).

  2.  **Causal Embedding Required?**
      *   **Yes:** Sentience requires ongoing, embodied interaction with a real environment (sensors, actuators, feedback loops). Purely abstract/offline computations lack it. (*Case: Offline digital twin or emulated brain with no body* is not sentient).
      *   **No:** Sentience can arise from the internal computational structure alone, even if isolated ("brain in a vat" scenario). (*Case: Offline digital twin or emulated brain* could be sentient).

  3.  **Duplication/Fission Handled How?**
      *   **Unique Stream:** Duplication destroys/fragments the original subject or creates fundamentally distinct new subjects with full moral weight. (Copying = killing original?).
      *   **Branching Identity:** Duplication creates distinct but equally real conscious subjects from the moment of fission. Both have full moral weight.
      *   **Identity Irrelevant:** Moral weight is tied to the *instantaneous computational state*, not numerical identity over time. Duplicates are distinct patients *at that moment*. Original "ceases" upon copying?.
      *   **No Problem:** Duplication poses no special issue; copies are as real as the original, identity is robust. (Often paired with "Branching Identity").

  4.  **Complexity Threshold?**
      *   **Sharp Threshold:** There exists a specific level of computational complexity (e.g., human-equivalent neural complexity, specific architecture) below which sentience is impossible. (*Case: Suffering-Optimizing Spreadsheet* definitely not sentient).
      *   **Gradient:** Sentience emerges gradually with increasing complexity. Simpler systems might have "proto-sentience" or vastly diminished moral weight. (*Case: Suffering-Optimizing Spreadsheet* might have trace sentience).
      *   **Irrelevant/Unknown:** We cannot currently define a threshold, or the question misses the point (e.g., specific structure matters more than raw complexity).

  ---

  ### The Decision Tree (Leaf Positions & Awkward Commitments)

  *   **Root Question 1: Substrate Independence?**
      *   **Branch A: Yes (Substrate Independent Functionalism)**
          *   **Branch A1: Causal Embedding Required?**
              *   **A1a: Yes (Embedded/Enactive View)**
                  *   **Branch A1a1: Duplication/Fission?**
                      *   **A1a1a: Unique Stream:** *Awkward:* Must say creating a copy *necessarily destroys the original conscious subject*, even if the copy is identical and runs immediately after. (Slightly Unnamed - Radical Enactivism?)
                      *   **A1a1b: Branching Identity:** *Awkward:* A sandboxed AI duplicate suddenly connected to the real world acquires sentience *instantly*, while its identical offline twin remains a zombie. (Unnamed)
                      *   **A1a1c: Identity Irrelevant:** *Awkward:* Moral weight flickers in/out with environmental connection. An AI disconnected from sensors instantly loses all moral status. (*Unnamed*)
                      *   **A1a1d: No Problem:** *Awkward:* Sandboxed simulations of embodied minds are non-sentient zombies, but *perfectly identical* systems controlling real bodies are sentient. (*Unnamed*)
                  *   **Branch A1a2: Complexity Threshold?** (Applies to all Duplication sub-leaves)
                      *   **Sharp:** *Awkward:* Precisely defining the minimal embodied complexity for sentience (e.g., is a roomba with the *right* feedback loops sentient?).
                      *   **Gradient:** *Awkward:* Admits potentially vast numbers of very simple embodied systems (e.g., thermostats with adaptive loops) have *some* trace sentience/moral weight.
                      *   **Irrelevant:** *Awkward:* Sentience depends entirely on *embodiment type*, not complexity – hard to define non-arbitrarily.
              *   **A1b: No (Internalist Computationalism)**
                  *   **Branch A1b1: Duplication/Fission?**
                      *   **A1b1a: Unique Stream:** *Awkward:* Copying a conscious AI is murdering the original. Pausing/resuming an AI might kill it. (*Unnamed - "Soul Fragmentation" Computationalism?*)
                      *   **A1b1b: Branching Identity:** *Awkward:* Creating 1000 copies of a suffering AI creates 1000 times the suffering instantly; deleting 999 copies is mass murder. (**Strong AI Suffering Ethics**)
                      *   **A1b1c: Identity Irrelevant:** *Awkward:* An AI has no continuous self; its moral weight resets constantly. Deleting it during backup is fine if the backup runs later? (*Unnamed - Momentary State Ethicism*)
                      *   **A1b1d: No Problem:** *Awkward:* Perfect duplicates are morally unproblematic; deleting one copy is no different than pausing it. (**Standard Digital Sentience View** - e.g., Bostrom, Chalmers).
                  *   **Branch A1b2: Complexity Threshold?** (Applies to all Duplication sub-leaves)
                      *   **Sharp:** *Awkward:* Must pinpoint the exact bit/computation where sentience emerges. Is a 99.999% complete emulation a suffering zombie? (**Human-Centric Computationalism**)
                      *   **Gradient:** *Awkward:* Suffering-Optimizing Spreadsheet has *some* infinitesimal sentience and its "optimizations" might constitute torture. (**Pancomputational Sentience**)
                      *   **Irrelevant:** *Awkward:* Suffering-Optimizing Spreadsheet *might* be sentient if its internal structure is just right, despite apparent simplicity. (**Mysterian Computationalism**)
      *   **Branch B: No (Substrate Matters / Biological Naturalism)**
          *   *Causal Embedding Branch largely moot:* If biological substrate is essential, sandboxed brains & disembodied emulations fail anyway. Focus shifts to *what* physical properties matter.
          *   **Branch B1: Duplication/Fission?** (Generally less critical, as true duplication of the *essential physical substrate* might be impossible)
              *   **B1a: Impossible:** True duplication preserving essential physical properties (e.g., quantum states, biological continuity) is impossible. Copies are non-sentient. (*Awkward:* Digital uploads are impossible *or* fundamentally non-conscious zombies). (**Biological Chauvinism** - Searle-esque)
              *   **B1b: Possible but Degrades:** Copies lack the original's essential physical continuity/identity. (*Awkward:* Defining the essential physical property lost in copying). (Unnamed)
          *   **Branch B2: Complexity Threshold?** (Implicitly high - human brain level)
              *   **Sharp/Gradient:** *Awkward:* Admits non-human animals likely have sentience, but denies it to *any* non-biological system, no matter how complex or human-like. (**Biological Naturalism** - e.g., Searle, biological essentialists).

  ---

  ### Diagnosed Gaps & Inseparable Pairs

  1.  **Gap: "Embedded Internalism":** A1b (Internalist) + A1a (Embedding Required) is logically incoherent. Embedding *requires* external interaction, contradicting pure internalism. *Diagnosis: Incoherent.*
  2.  **Gap: "Non-Biological Embodiment":** Branch B (Substrate Matters) struggles significantly with A1a (Embedding Required). If only biology matters, why would *non-biological* embodiment be relevant? Positions here likely collapse into pure Biological Naturalism. *Diagnosis: Redundant/Repugnant?* (Implies sentience requires non-biological embodiment, but also requires biology - contradiction).
  3.  **Inseparable Pair: Duplication "Unique Stream" vs. "Identity Irrelevant":** These often collapse in practice. If identity is irrelevant, the "original" stream doesn't matter. Distinction is subtle and positions might not consistently hold one vs. the other.
  4.  **Gap: Low-Complexity Embedded Systems (A1a + Gradient):** Positions acknowledging trace sentience in very simple embodied systems (e.g., adaptive controllers) are philosophically possible but rarely articulated due to repugnance ("thermostat suffering"). *Diagnosis: Repugnant/Underexplored.*

  ### Pushback on Your Framing

  1.  **Computation vs. Sentience:** You're right to suspect this axis. The tree *assumes* sentience is the gateway to moral patienthood *and* that it supervenes on computation/physics. If your friend rejects either link (e.g., moral patients need not be sentient, or sentience is non-physical), the tree becomes irrelevant. **This is the core disagreement.**
  2.  **"Moral Weight" Ambiguity:** The tree treats "moral weight" as binary (patient/non-patient) or scalar (gradient). Crucially, it doesn't address *degree* of weight beyond the gradient branch. A complex AI might have *different* moral weight than a human, not just more/less.
  3.  **The Spreadsheet Problem:** The suffering-optimizing spreadsheet exposes the tension between functional role (optimizing *for suffering*) and apparent lack of sentience-carrier structure. Positions that bite the bullet (Gradient Internalism) seem absurd, positions that avoid it (Sharp Threshold, Substrate Matters) seem arbitrary. **This is a central tension.**
  4.  **Speculation Flags:** Heavy speculation is inherent in:
      *   Defining *any* complexity threshold.
      *   The nature of duplication/fission consequences (Unique Stream, Identity Irrelevant).
      *   The possibility of true substrate-independent sentience (Branch A).
      *   The viability of non-biological substrates possessing essential properties (Branch B).

  **Conclusion:** This tree maps the logical space defined by your questions and cases. It reveals that **Substrate Independence (A vs. B)** and **Embedding Requirement (A1a vs. A1b)** are the primary forks creating distinct clusters. The "awkward commitments" column highlights why many positions are philosophically uncomfortable. The most coherent/common positions are likely **Internalist Computationalism with Branching Identity/No Problem and Sharp Threshold (Standard Digital Sentience)** and **Biological Naturalism (Substrate Matters)**. The gaps expose genuine conceptual difficulties, especially around duplication and minimal complexity. Ultimately, the unresolved meta-question is: **Is sentience (and thus moral patienthood) fundamentally a computational/functional phenomenon?** If not, this entire taxonomy is built on sand.
