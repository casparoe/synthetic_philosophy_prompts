prompt: |-
  I am a psychological wellbeing practitioner in an NHS Talking Therapies service, and I run a six-session guided self-help group for people with worry, health anxiety and work-related burnout. More and more clients arrive already carrying a version of the modern Stoic revival — the podcasts, the week-long Stoic courses, the harder-edged founder-bro version — and they bring it into the room as a tool: the dichotomy between what is up to us and what is not, attributed to Epictetus at the opening of the handbook compiled from his lectures, and usually drawn on a flipchart as two circles. In supervision I have been told that the modern word control imports something the ancients did not mean in quite that way: what is up to us is not what we can causally manipulate but what is attributable to our own judgement and choice alone, so that not only the weather and other people's opinions but also our health, our reputation and our own bodies fall on the far side of the line. My supervisor used two Greek terms I only half followed — one for the faculty that is up to us, one for the habit of attaching a reservation along the lines of if nothing prevents it to every aim one adopts — and she also insisted the two circles are not a licence for quietism, since the ancient Stoics expected the person who has made progress to stand for office, marry and take part in public affairs unless something prevents it.

  What I need is a procedure rather than an explanation: something I can run in about twenty minutes with a client who has written down six things they are worried about, and that a trainee with our six-week training could run too. Give me the questions in the order they should be asked, what counts as an adequate answer to each, where the procedure stops with a no, and where it hands the decision back to the client because the matter is one of values rather than classification. Three features of the material worry me and I want them built into the design rather than footnoted. First, most of what clients bring is partly influenceable — a promotion panel, a son's drug use, a union ballot, an election — so a strict dichotomy returns an answer that feels wrong, while the three-ring version popular in management self-help (what I control, what I can influence, what I must accept) seems truer to how action actually works and may lose the whole point of the exercise; tell me whether to keep the middle ring and what the procedure loses either way. Second, clients cannot switch their assent at will: panic attacks, intrusive thoughts and grief are not up to us in any sense a distressed person will recognise, so the procedure needs a timescale — what can be trained over months versus what can be chosen in the next ten minutes — and needs to say plainly when the tool should be withdrawn, because I have clients who turn the question is this up to me into a fresh checking ritual. Third, my group finds it appalling that the ancient view apparently counts grief itself as a judgement and therefore as up to us; say whether the procedure absorbs that or brackets it.

  Then run it, in the form a session would actually take, on three cases: a client anxious about a promotion panel next week; a client whose adult son is using drugs and who oscillates between I can make him stop and nothing I do makes any difference; and a client who has concluded that a colleague's harassment of her is not up to me and has gone quiet about it. I suspect the procedure will tell me something about that third case I will not want to hear, and I would rather hear it. Finally, state what the procedure cannot do: the presentations on which it must not be used at all, and the points at which no amount of structuring removes the need for clinical judgement. Begin with a single sentence — the one my trainees could memorise and pin above the desk — that states the procedure's core move, then give the procedure and the worked cases; no preamble, and no restatement of what I have asked.
reasoning: |-
  We are designing a 20-minute procedure for clients to apply a Stoic-inspired "dichotomy of control" to their worries, with adaptations for modern therapeutic use. The procedure must account for partial influence, the timescale of control (immediate choice vs. trainable over time), and avoid pathologizing natural emotional responses like grief.

  Core move (for trainees to memorize):
  "Separate what is truly up to your judgment and choice right now from what is not, and then focus your effort on your own judgments and actions while letting go of the rest."

  Procedure:

  1. **List the worry:** Ask the client to state one specific worry. (e.g., "I'm worried about the promotion panel next week.")
     - *Adequate answer:* A concrete, specific concern. If too vague, ask for specifics.

  2. **Identify the desired outcome:** "What exactly are you hoping happens?" or "What are you afraid might happen?"
     - *Adequate answer:* A clear goal or feared event (e.g., "I want to get the promotion" or "I fear they'll reject me").

  3. **Break down the worry into components:** "What are the elements that make up this situation? Think about the people, events, and factors involved."
     - *Adequate answer:* A list of parts (e.g., for a promotion panel: my preparation, the panel's decision, the questions they ask, my performance on the day, etc.).

  4. **Apply the dichotomy:**
     a. For each component, ask: **"Is this something that is 100% up to your own judgment and choice right now?"** 
        - *Meaning:* Only what is *entirely* within your own mind (your judgments, intentions, choices, and actions you can take *now* without any external dependency) counts as "up to us." 
        - *What is up to us:* Our current judgments (e.g., "I judge this situation as challenging but manageable"), our current intentions (e.g., "I intend to prepare well"), and our immediate actions (e.g., "I can choose to practice my interview skills today"). 
        - *What is not up to us:* Outcomes (e.g., getting the promotion), other people's actions/decisions (e.g., what the panel thinks), external events (e.g., the questions asked), and even our own body's automatic reactions (e.g., nervousness, which might be influenced but not controlled 100% in the moment).

     b. **Influence?** If a component is not 100% up to the client, ask: **"Can you influence it in any way?"** 
        - *Important:* Influence is not control. It belongs in the "not up to us" circle but calls for a different response: doing what you can to influence, then letting go of the outcome. 
        - *Why we include it:* Without this, clients feel disempowered. But we must stress that influence is not control and outcomes are still not up to us. 
        - *Adequate answer:* If yes, the client must specify one action they can take that is up to them to try to influence it. (e.g., "I can research the panel members to anticipate their questions" or "I can talk to my son about rehab options.") If no, then it goes in the "not up to us" circle.

  5. **Immediate vs. long-term control:**
     - For elements that are not up to the client in the immediate sense (like a panic attack or intrusive thought), ask: **"Is this something you can choose to change in the next ten minutes, or is it something that requires practice over time?"** 
       - *Adequate answer:* If it's not changeable now (e.g., panic), then it is not "up to us" in the immediate sense. We note it as a training goal (e.g., via therapy) and put it aside for now. 
       - *When to withdraw the tool:* If the client starts using this as a checking ritual (e.g., obsessively asking "is this up to me?"), stop and use a different method (e.g., worry postponement or CBT for OCD). The tool is for decision-making, not reassurance.

  6. **Judgments and emotions:** 
     - For emotional reactions (like grief or fear), bracket the ancient Stoic view that they are judgments. Instead, say: **"Your feeling [e.g., grief] is a natural response. It is not up to you to stop feeling it right now. But what is up to you is how you choose to relate to it and what actions you take in response."** 
       - *This avoids* telling clients they can just switch off emotions.

  7. **Focus on action:**
     - After categorizing, ask: **"Given this, what is one thing that is up to you to do or decide right now?"** 
       - *Adequate answer:* A specific, actionable step (e.g., "I will prepare for the interview for 30 minutes today" or "I will call a support group for parents of drug users"). 
     - For the "not up to us" parts (even if influenceable), ask: **"Can you let go of trying to control this and focus only on what is up to you?"** 
       - *Adequate answer:* The client acknowledges that the outcome isn't up to them and commits to focusing on their own actions.

  8. **Handoff to values:** 
     - If the client is stuck on whether something is "up to them" (e.g., "Should I report the harassment? It's my choice, but I'm afraid"), then the issue is not classification but values. Ask: **"What matters to you in this situation? What kind of person do you want to be?"** 
       - *This stops the procedure* and moves to values-based discussion.

  **Procedure cannot be used:**
  - Active psychosis or mania (client may lack insight).
  - Severe OCD where the dichotomy becomes a compulsion (as above).
  - When the client is in acute crisis (e.g., suicidal) and needs safety planning first.

  **Now, run the procedure on three cases:**

  **Case 1: Promotion panel next week.**
  - Worry: "I'm anxious about the promotion panel next week."
  - Desired outcome: "I want to get the promotion."
  - Break down: 
    - My preparation (research, practice).
    - My performance on the day (answering questions, staying calm).
    - The panel's decision.
    - The questions they ask.
  - Dichotomy:
    - Preparation: **Up to me** (I can choose to prepare today).
    - Performance: **Influenceable but not 100% up to me** (I can practice to improve, but I might still be nervous; the actual performance depends on many factors). Action: Practice.
    - Panel's decision: **Not up to me** (I can't control what they think).
    - Questions asked: **Not up to me**.
  - Immediate vs. long-term: Nervousness isn't controllable right now, but I can use breathing techniques (influenceable action). Over time, exposure can help.
  - Action: Focus on preparing (e.g., "I will spend 1 hour today rehearsing"). Let go of the decision and the questions.
  - Outcome: Client commits to preparation and accepts uncertainty.

  **Case 2: Adult son using drugs.**
  - Worry: "My son is using drugs, and I don't know what to do."
  - Desired outcome: "I want him to stop using drugs and go to rehab."
  - Break down:
    - My son's choices (whether to use, whether to seek help).
    - My actions (talking to him, setting boundaries, seeking support).
    - My emotional reactions (fear, guilt).
  - Dichotomy:
    - Son's choices: **Not up to me** (I cannot force him).
    - My actions: **Up to me** (I can choose to talk to him calmly, set boundaries, attend a support group).
    - My emotions: Not up to me to turn off, but **I can choose how to respond to them** (e.g., practice self-care, seek therapy).
  - Influence? I can try to influence my son (e.g., by expressing concern, offering help), but I cannot control his response. Action: Have a conversation with him.
  - Immediate vs. long-term: Guilt isn't controllable now, but I can choose to act despite it.
  - Action: "I will call a family support group today and schedule a time to talk with my son." Let go of the outcome (his choice).
  - Values handoff? If stuck: "What matters to you as a parent? Being supportive? Protecting your own well-being?"

  **Case 3: Colleague's harassment and client going quiet.**
  - Worry: "A colleague is harassing me, and I've stopped talking about it because it's not up to me."
  - Desired outcome: "I want the harassment to stop."
  - Break down:
    - Colleague's behavior (harassment).
    - My actions (reporting it, confronting, documenting).
    - The company's response.
    - My safety and well-being.
  - Dichotomy:
    - Colleague's behavior: **Not up to me** (I cannot control what they do).
    - My actions: **Up to me** (I can choose to report it to HR, document incidents, seek support).
    - Company's response: **Not up to me** (but influenceable by reporting).
    - My safety: **Influenceable** (I can take steps to protect myself).
  - The client has misapplied the dichotomy: She thinks because the harassment isn't up to her, she shouldn't act. But her own actions (reporting) are up to her.
  - Action: "I will report the harassment to HR tomorrow." 
  - Values: If hesitant, ask: "What does standing up for yourself mean to you? What kind of work environment do you want to help create?"
  - Note: The procedure reveals that her inaction is a choice (and thus up to her) and that reporting is within her control. This may be uncomfortable but necessary.

  **What the procedure cannot do:**
  - It cannot resolve deep-seated trauma or complex grief without additional therapy.
  - It should not override the client's autonomy; if they choose not to act (e.g., not report harassment), we respect that but explore the reasons.
  - It does not replace emotion-focused work for intense feelings.
answer: |-
  ### Core Move for Trainees (Memorize and Pin Above Desk)  
  "Separate what is entirely up to your own judgment and choice right now from what isn't, then focus only on your judgments and actions—accepting the rest without struggle."

  ---

  ### Procedure: 20-Minute Stoic-Inspired Worry Breakdown  
  *Ask these questions in order. Time per client: 5–7 minutes. Use a worksheet for their 6 worries.*  

  1. **What is the specific event or outcome you’re worried about?**  
     - *Adequate answer:* A concrete, short description (e.g., "My promotion interview next week," not "I’m a failure").  
     - *Stop if:* The worry is vague—rephrase together.  
     - *Timescale note:* Focus on the *next 1–2 weeks*. Withdraw if worry is about decades-long issues (e.g., "Will I die alone?").  

  2. **What part of this is 100% yours—your judgment, intention, or an action you can take *right now*?**  
     - *Adequate answer:* Only:  
       - **Judgments:** Your beliefs/assessments (e.g., "I think this interview is crucial").  
       - **Intentions:** Your aims (e.g., "I intend to prepare well").  
       - **Immediate actions:** Behaviors you can do *today* without barriers (e.g., "I can research the panel").  
     - *Not adequate:* Health, emotions, others’ actions, outcomes (e.g., "Stopping my panic attack" or "Getting the promotion").  
     - *Stop if:* The client insists an emotion (e.g., grief) or bodily reaction (e.g., panic) is "up to them"—bracket it (say: "This is natural; focus on your *response* to it"). Withdraw the tool if this becomes a checking ritual (e.g., repetitive "Is this up to me?").  

  3. **What part can you influence but not control?**  
     - *Include the middle ring (influence):* It’s practical for real-world worries (e.g., a union ballot). But stress: **"Influence isn’t control—you act, then let go of results."**  
     - *Adequate answer:* One actionable step (e.g., "I can email my son about rehab options").  
     - *What it loses:* Pure Stoicism’s rigor, but gains clinical utility. Without it, clients feel helpless.  
     - *Stop if:* The client fixates on influence (e.g., "I *must* make my son quit drugs")—return to Step 2.  

  4. **What must you accept as outside your control?**  
     - *Adequate answer:* Outcomes, others’ choices, external events (e.g., "The panel’s decision," "My son’s drug use").  
     - *Emotions:* Say plainly: "Feelings like grief aren’t chosen—accept them as human. Your power is in how you *respond*."  
     - *Stop if:* The client resists acceptance (e.g., "But I *should* fix this")—hand to values (Step 5).  

  5. **Values handoff: "What matters to you here, and what’s one small step toward it?"**  
     - *Use when:* Classification stalls (e.g., "Reporting harassment feels wrong but is ‘up to me’").  
     - *Adequate answer:* A values-based action (e.g., "I value safety, so I’ll report the harassment").  
     - *Procedure stops here.*  

  **Final Output:** Client identifies 1 actionable judgment/intention/action (Step 2) and commits to it.  

  ---

  ### Worked Cases  
  *Assume 5 minutes per case in-session.*  

  #### Case 1: Anxious About Promotion Panel  
  - **Worry:** "I’ll fail next week’s promotion panel."  
  - **Procedure:**  
    1. **Specific event?** "The panel’s decision next week." (Adequate).  
    2. **100% up to you?**  
       - "My preparation" → *Yes (action: research the panel today)*.  
       - "My confidence" → *No (influenceable: practice breathing exercises)*.  
       - "The outcome" → *No (accept)*.  
    3. **Influence?** "I can rehearse answers." (Adequate action).  
    4. **Accept?** "The panel’s biases, the result." (Adequate).  
    5. **Values handoff?** Not needed.  
  - **Client’s commitment:** "I’ll research the panel for 30 minutes today."  

  #### Case 2: Son’s Drug Use  
  - **Worry:** "My son uses drugs—I can’t stop him."  
  - **Procedure:**  
    1. **Specific event?** "My son’s drug use this month." (Adequate).  
    2. **100% up to you?**  
       - "His choices" → *No (accept)*.  
       - "My boundaries" → *Yes (action: set rules tonight)*.  
       - "My guilt" → *Bracket (not chosen; focus on response)*.  
    3. **Influence?** "I can offer rehab resources." (Adequate action).  
    4. **Accept?** "His refusal, my fear." (Adequate).  
    5. **Values handoff?** Triggered by "Should I force him?" → "What matters?" → "I value his health, so I’ll call a support group."  
  - **Client’s commitment:** "I’ll text him a rehab center link today."  

  #### Case 3: Harassment by Colleague (Client Went Quiet)  
  - **Worry:** "My colleague harasses me, but it’s ‘not up to me,’ so I stay silent."  
  - **Procedure:**  
    1. **Specific event?** "The harassment continuing." (Adequate).  
    2. **100% up to you?**  
       - "His behavior" → *No (accept)*.  
       - "Reporting it" → *Yes (action: email HR today)*. ← *The uncomfortable truth: Her silence is a choice within her control.*  
       - "My shame" → *Bracket (not chosen; focus on response)*.  
    3. **Influence?** "I can document incidents." (Adequate action).  
    4. **Accept?** "His actions, HR’s response." (Adequate).  
    5. **Values handoff?** Crucial here: "What matters? Safety? Justice?" → "I value respect, so I’ll report it."  
  - **Client’s commitment:** "I’ll write down the harassment details today."  

  ---

  ### What the Procedure Cannot Do  
  - **Do not use with:**  
    - Psychosis or mania (distorted reality testing).  
    - Active suicidality (needs safety-first protocols).  
    - Severe OCD (dichotomy becomes a compulsion).  
  - **Requires clinical judgment at:**  
    - Step 2: When emotions (e.g., trauma grief) overwhelm—switch to distress tolerance.  
    - Step 5: If values conflict (e.g., "Reporting harassment risks my job")—explore pros/cons.  
    - Final commitment: If action is harmful (e.g., "I’ll confront my violent son"), reframe.  

  —  

  *Procedure integrates your three concerns: Influence ring included (with caveats), emotions bracketed, timescale (right now vs. trainable) clarified. Trainees can run this with a script.*
