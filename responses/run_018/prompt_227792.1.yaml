  First, I need to recall the key points about Tammany Hall. It was a political machine that provided material benefits to immigrants and the working class in exchange for votes, funded by kickbacks from businesses. Plunkitt's distinction between honest graft (like insider land deals) and dishonest graft (theft) is central. 

  For Nye's definition, I should note that it condemns the entire machine because all exchanges deviated from formal duties for private gain. But Tammany's provision of needed services might challenge this by showing why such systems arise where formal institutions fail. However, Nye's framework doesn't excuse corruption just because it's beneficial.

  Next, the moral-economy perspective. This sees Tammany's network as a functional system of reciprocity, not inherently corrupt. Legitimacy here depends on maintaining reciprocal obligations. But what about those excluded, like Black New Yorkers? The theory might not address outsiders well, which is a limitation. Also, when the machine violated reciprocity (e.g., by demanding excessive tribute), it would be corrupt even under this view.

  Plunkitt's distinction is trickier. Honest graft might be seen as a savvy use of insider info, but the case shows this was only possible because the machine controlled public decisions. So his moral line might collapse under scrutiny. The theories might classify actions differently: Nye condemns both grafts, moral-economy might accept honest graft as part of the system, and Plunkitt condemns only dishonest graft.

  Now, for the universality debate: Tammany operated in the West but used clientelist practices often associated with non-Western societies. Its dismantling suggests that local actors adopted impersonal administration standards, implying universality. But the anthropological view might argue that the shift shows Western standards are just one possible order. The case could support either side, but the user wants the contested nature highlighted.

  I need to ensure I present disagreements as open questions. For example, whether moral-economy vindicates clientelism or merely describes it is debated. Also, whether Tammany's history challenges universality isn't settled. The user emphasized marking what's settled (facts, Nye's mainstream status) versus what's contested.

  The deeper needs here might be understanding how corruption frameworks apply in real cases and grappling with cultural relativism in governance. The user is likely a student or researcher in political science/history, wanting a nuanced analysis that acknowledges complexities without forcing conclusions where there's genuine debate.
answer: |-
  Here is the analysis of Tammany Hall through the three theoretical lenses, following your structure and disciplined on scope and contestedness:

  **1. Joseph Nye's Public-Office-Centered Definition (Deviation from formal duties for private gain)**
      *   **Theory-to-Case:**
          *   **Corrupt:** *Everything* core to Tammany's operation: Trading jobs/votes (patronage), selling licenses/franchises for kickbacks ("tribute"), Plunkitt's "honest graft" (using insider info for land speculation), "dishonest graft" (theft, blackmail), favoritism in courts/naturalization. All involve officials deviating from formal, impersonal rules of office (merit hiring, competitive bidding, equal application of law) for personal/machine gain.
          *   **Legitimate:** Strictly adhering to formal rules: awarding contracts solely on lowest bid/merit, hiring based solely on civil service exam, applying laws impartially without regard for political loyalty or payment. The *provision* of welfare isn't inherently corrupt, but the *method* (patronage, tied to votes) is.
          *   **Surprise Verdict:** Condemns the *entire system* at its core. The vital services provided (coal, food, jobs, help) are irrelevant to the corruption judgment – they are beneficial *outcomes* of a corrupt *process*. Plunkitt's "honest graft" is just as corrupt as "dishonest graft" under this view; both involve using public role for private profit.
      *   **Case-to-Theory (Revelations/Limitations):**
          *   **Pressure Point:** Reveals the theory's potential *formalism* and *blindness to context*. It cannot formally acknowledge *why* the machine arose (state failure to provide welfare/incorporate immigrants) or that its *informal* reciprocity system might have been more functional *in that specific context* than the failing formal state. It sees only deviation.
          *   **Doesn't Show:** That corruption is *justified* by providing services. It shows corruption *can* fill functional voids left by the formal state, but Nye's definition insists the *means* remain corrupt regardless of beneficial *ends* or context. The convenience for beneficiaries doesn't negate the deviation from duty.

  **2. Anthropological/Moral-Economy Account (Clientelism as functional reciprocity; corrupt only when reciprocity violated)**
      *   **Theory-to-Case:**
          *   **Corrupt:** Violations *within* the reciprocal network: A boss who takes tribute but fails to deliver jobs/help ("shirking"), a voter who takes benefits but doesn't vote as directed ("cheating"), extortionate demands far exceeding the value of the service provided or the capacity to pay (distorting reciprocity). Plunkitt's "dishonest graft" (theft) might violate internal norms of "fair" exchange.
          *   **Legitimate:** The core machine transactions: Jobs for votes, favors for loyalty, tribute for licenses/franchises/contracts. These are seen as the *functional currency* of a viable alternative order based on personal obligation and reciprocity, fulfilling needs the state ignored. Plunkitt's "honest graft" could be seen as a savvy operator's legitimate reward within this system.
          *   **Surprise Verdict:** Vindicates the *core logic* of the machine as a functional, legitimate order *for its participants*. Condemns only *internal* breaches of trust. Crucially, it treats Plunkitt's "honest graft" and "dishonest graft" differently only if the latter violates reciprocity norms *within the Tammany network itself*.
      *   **Case-to-Theory (Revelations/Limitations):**
          *   **Pressure Point:** Reveals the theory's potential **insularity**. It focuses brilliantly on the internal logic and functionality for *network members* but struggles badly with **outsiders**:
              *   *Excluded Groups (Black New Yorkers, Reformers):* Their systematic exclusion/discrimination isn't a "violation of reciprocity" because they were never *in* the reciprocal network. The theory offers no inherent critique of this exclusionary aspect of clientelism. Functionality for insiders comes at the cost of marginalization for outsiders.
              *   *Businesses Refusing to Pay:* Were they "cheating" a system they never opted into? Or victims of extortion? The theory struggles to classify their treatment clearly, as it assumes participation in the network of obligation.
          *   **Built-in Answer?** The theory generally lacks a robust normative framework for dealing with those deliberately excluded or coerced into the system. Its focus is on the internal moral economy, not universal fairness or rights.

  **3. Plunkitt's Honest/Dishonest Graft Distinction (Internal Normative Theory)**
      *   **Theory-to-Case:**
          *   **Corrupt ("Dishonest Graft"):** Theft from the treasury, blackmail, extortion, charging for services that should be free. Actions seen as predatory or purely destructive.
          *   **Legitimate ("Honest Graft"):** Profiting from foresight and opportunity arising from public service: Buying land likely to be needed for public works, investing based on insider knowledge of city plans. Seen as a legitimate perk of the job, akin to a businessman's profit, not theft. The core patronage/vote exchange and reasonable tribute fall under the functional, "honest" system.
          *   **Surprise Verdict:** Condemns specific actions (theft, blackmail) that the **Moral-Economy view** might also condemn (as violating reciprocity) and the **Nye view** *definitely* condemns. Its *real* surprise is legitimizing "honest graft" which **Nye** condemns absolutely and the **Moral-Economy** view likely accepts as part of the system. Plunkitt draws a line *within* insider activity that the other two frameworks either ignore (Nye) or treat uniformly (Moral-Economy, focusing on reciprocity not profit source).
      *   **Case-to-Theory (Revelations/Limitations):**
          *   **Revelation:** Shows the **instability** of Plunkitt's line. The "opportunities" for "honest graft" (advance knowledge of public projects) existed *only because* Tammany *controlled* public decisions through corrupt means (patronage, vote-buying, control of officials). The "foresight" relied on non-public information gained through corrupt access. The case suggests "honest graft" is parasitic on the very system of corruption Plunkitt defends elsewhere.
          *   **Doesn't Show:** That the line is *meaningless*. It shows it's *contingent* and *self-serving*. Plunkitt identifies a genuine difference in *method* (opportunism vs. direct theft), but the case reveals how the *opportunity* for the "honest" method is deeply entangled with the corrupt system itself. The standard definitions (Nye) miss the *internal* moral distinction Plunkitt makes, but the case shows why that distinction collapses under external scrutiny focused on the source of the opportunity.

  **Tammany Hall and the Universality of Western Anti-Corruption Standards**

  This case cuts in complex ways regarding the debate on whether Western standards (like Nye's) are universal or parochial:

  1.  **Evidence for Universality as a Local Achievement:**
      *   Tammany thrived *within* the supposed heartland of developing Western bureaucratic ideals (NYC, 19th-early 20th century). Its practices (defended using reciprocity/loyalty language familiar to anthropologists) were dominant for decades.
      *   Its eventual dismantling (via civil service reform, competitive bidding laws, investigations like Seabury) required a prolonged, conscious political and social struggle *within* that society to *establish* the norms of impersonal administration and public duty embodied in the Nye definition.
      *   This suggests the "universal" standard isn't a pre-existing truth but a hard-won *normative ideal* constructed *locally* over time through conflict and institutional reform. The anthropological critique resonates because it describes the *functional*, widely accepted system that existed *before* the universalist norms were enforced.

  2.  **Evidence Against Anthropological Overreach / For Binding Universality:**
      *   Crucially, the reformers who dismantled Tammany *used the language of corruption* (akin to Nye's definition) and *succeeded politically*. New Yorkers, including many former beneficiaries, ultimately came to *judge* the machine as corrupt *by those emerging universalist standards* and demanded change.
      *   This suggests that while clientelism *functions* and uses familiar reciprocity norms, societies *can* develop, embrace, and enforce a universalist standard (impersonal, public-office-centered) that overrides it, even seeing the older system as fundamentally illegitimate ("corrupt") retrospectively. The ultimate *local judgment* aligned with the universalist standard.

  **Which Way Does It Cut? (Contested Answer):**

  *   **Leaning Towards Universality as Local Achievement:** The case strongly supports the view that the impersonal, public-office-centered standard is **not innate** but a **contingent historical achievement**. Tammany demonstrates that "corruption" as defined by Nye was the *norm* for a long period in a core Western city. Its functionality and defense in moral-economy terms show the universality of *clientelistic impulses*, not the universality of the *anti-corruption norm*. The norm had to be built.
  *   **Counterpoint for Binding Force:** However, the successful *reform* shows that this norm, once constructed and internalized by sufficient actors *within* the society (voters, elites, courts), gained binding force and was used to condemn the previous order. Its *local triumph* gives it legitimacy and practical force *in that context*, suggesting it can become a powerful universal *aspiration*, even if not a universal *starting point*.

  **Crucially Contested Issues (Marked as Open):**

  1.  **Moral-Economy Vindication vs. Redescription:** Does the anthropological account *vindicate* clientelism as a morally valid alternative order (for insiders), or does it merely *redescribe* its internal logic without making a normative claim about its overall justice or legitimacy, especially regarding outsiders? **This is genuinely contested.** Some anthropologists lean towards relativist validation within the system's terms; others see it as descriptive analysis leaving normative judgment open; critics argue it risks legitimizing exclusionary and coercive practices.
  2.  **Bearing on Universality Question:** Does Tammany (or similar cases) *fundamentally challenge* the universality of the Nye standard by showing its historical contingency and functional alternatives, or does it merely show the *difficulty of implementation* and the *persistence* of clientelism, which the universal standard still rightly condemns? **This is genuinely contested.** Some see it as proof the standard is culturally specific; others see it as evidence of a universal struggle against a universal temptation.
  3.  **Plunkitt's Line:** Is "honest graft" a genuinely distinct moral category reflecting a different *kind* of self-enrichment (opportunism vs. predation), or is it merely a self-serving rationalization that collapses under scrutiny of its enabling conditions? **This is debated,** though the Tammany case heavily weights the argument towards rationalization/collapse.

  **Settled Elements:**

  *   The core historical facts of Tammany's operations (patronage, services, tribute, Plunkitt's quotes) are not in serious dispute.
  *   Joseph Nye's definition *is* the mainstream definition in contemporary academic literature on political corruption and underpins the work of major anti-corruption institutions (Transparency International, World Bank).
  *   Tammany Hall was ultimately dismantled through reforms aimed at imposing impersonal administration and public-office standards.

  The Tammany case vividly illustrates the clash between these frameworks. It demonstrates the historical contingency of the "universal" anti-corruption standard while also showing its potent normative force once established. It highlights the functionality and internal logic of clientelism while exposing its exclusionary and ultimately unstable nature under pressure from modernizing states and evolving public norms. The contestation surrounding its interpretation reflects the enduring difficulty of defining and combating corruption across diverse contexts.
