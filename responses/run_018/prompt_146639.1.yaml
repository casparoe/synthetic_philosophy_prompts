prompt: |-
  I am a high school student studying literary interpretation, and I have noticed a recurring pattern for which I lack a term. In classroom analysis, when a poem contains a line that conflicts with the interpretation my teacher favors, she explains that the speaker is not the poet and that we should not read authorial intention into the text; yet when a different poem contains a line that supports her preferred reading, she treats it as direct evidence of the poet's belief. The separation between speaker and author seems invoked only for inconvenient passages, rather than applied uniformly. This feels different from general arguments that authorial intent should not determine meaning, because those address whether intent matters at all, not this selective, asymmetrical use of the distinction as a rescue device. Does this configuration have an established name? If not, please define its precise boundaries—distinguishing it from ordinary ambiguity resolution and from blanket rejections of intentionalism—and propose a concise label. Answer in one paragraph, no more than 120 words.
reasoning: |-
  Okay, the user is a high school student grappling with what they see as an inconsistency in their teacher's literary interpretation methods. They've noticed their teacher selectively applies the distinction between speaker and poet—dismissing inconvenient lines as "not the poet's view" while treating supportive lines as evidence of authorial intent. This feels like a double standard rather than a principled approach to intentionalism.  

  The core issue is asymmetrical application of a critical tool. I need to distinguish this from valid ambiguity resolution (where context justifies speaker/author separation) and from wholesale rejections of intentionalism (like New Criticism). The pattern resembles "special pleading" in logic—making exceptions without justification.  

  Possible labels flash through my mind: "intentionalist cherry-picking" captures the selectivity but lacks academic weight. "Ad hoc speaker-author decoupling" is precise but clunky. "Procedural inconsistency in persona theory" might resonate in scholarly contexts.  

  I settle on "selective intentionalism" for the answer—it names the bias while nodding to literary theory. The definition must clarify boundaries: it's not about denying intent entirely, nor honest ambiguity resolution, but about deploying the speaker/author split tactically to protect a reading.  

  Word count is tight (120 max), so I'll avoid examples and focus on crisp boundaries: contrast with uniform anti-intentionalism, distinguish from contextual disambiguation. The label should feel useful for classroom debate—this student deserves terminology to call out the inconsistency.
answer: |-
  This pattern is called **selective intentionalism** or **ad hoc speaker-author decoupling**. It occurs only when a critic inconsistently invokes the speaker/author distinction to dismiss textual evidence contradicting their interpretation while accepting supportive evidence as authorial, without a principled textual or contextual justification for the asymmetry. This distinguishes it from:  
  1.  **Consistent anti-intentionalism** (rejecting authorial intent entirely).  
  2.  **Legitimate ambiguity resolution** (using context to determine if a line reflects the speaker's persona or the author's view, applied evenly).  
  It is a fallacious interpretive maneuver that weaponizes the speaker/author concept not as a critical principle, but solely as a protective device for a favored reading against counter-evidence.

  (120 words)
