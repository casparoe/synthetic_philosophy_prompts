  I should emphasize that this isn't just academic. If journalists had clearer criteria for when substantive declines outweigh procedural gains, they might have flagged threats to minority rights in Turkey earlier, even as Erdogan held elections. But I must avoid prescribing solutions - the group needs to develop the framework.

