answer: |-
  Here’s a structured agenda for your working group, prioritizing conceptual clarity on democratic backsliding based on the procedural-substantive tension. The ranking balances **upstream importance** (how foundational the question is for others), **tractability** (amenable to theoretical resolution), **neglectedness** (under-explored dimensions), and **risk of partisan misuse**. 

  ### Core Problem: Divergence Between Procedural and Substantive Erosion
  When procedural democracy (e.g., elections, legislative processes) and substantive democracy (e.g., rights protections, pluralism) pull in opposite directions, the concept of "backsliding" fractures. This divergence enables partisan actors to selectively cite one dimension to legitimize or attack reforms (e.g., "We expanded popular referendums!" vs. "You gutted minority rights!").

  ---

  ### Ranked Conceptual Questions for Prioritization

  1. **What Relative Weight Should Procedural vs. Substantive Dimensions Hold in Defining Backsliding?**  
     - **Why Upstream?** Until this is resolved, thresholds for "backsliding" remain arbitrary. All other questions (e.g., who declares it, asymmetry charges) depend on this calibration.  
     - **Tractability:** High for conceptual work. Requires normative theorizing about democracy’s core purpose (e.g., Is majority rule sufficient without minority safeguards? Can procedural fairness offset rights restrictions?).  
     - **Evidence Shifting Priority:** Empirical cases where procedural gains coexist with substantive decline (e.g., *more* frequent elections but *less* media freedom) would force urgency. Polarization trends amplifying this divergence (e.g., in the U.S. or Brazil) would elevate it further.  
     - **Neglectedness/Risk:** Often glossed in empirical studies. Unresolved, it fuels partisan misuse by allowing cherry-picked criteria.

  2. **How Do We Conceptualize "Irreversibility" or "Point of No Return" in Divergent Scenarios?**  
     - **Why Upstream?** Backsliding implies a directional shift, but when procedures improve as rights erode, is decline "real" if future majorities could reverse it? Affects thresholds for intervention.  
     - **Tractability:** Moderate. Combines institutional theory (e.g., veto points, constitutional entrenchment) with democratic theory (e.g., resilience of civic culture).  
     - **Evidence Shifting Priority:** Cases where substantive erosion outlives procedural restoration (e.g., Turkey’s post-purge institutions) or where procedural changes lock in illiberalism (e.g., Hungary’s constitutional revisions). Rising judicial deference to "procedurally valid" but rights-infringing laws would heighten relevance.  
     - **Risk:** Without clarity, critics risk crying wolf over reversible changes, while authoritarians exploit "temporary" emergencies to normalize erosion.

  3. **Who is the Legitimate Arbiter When Dimensions Diverge?**  
     - **Why Lower Priority?** Depends on Q1–Q2. If we lack consensus on weights or thresholds, arbiters lack criteria to apply.  
     - **Tractability:** Lower. Entangles sociological legitimacy (public trust) and legal authority (courts vs. international bodies).  
     - **Evidence Shifting Priority:** If courts (e.g., Poland, U.S.) issue contradictory rulings on divergent cases, or if citizens systematically reject expert/judicial "declarations" of backsliding.  
     - **Risk:** Unresolved, it entrenches polarization (e.g., "elites vs. people" narratives in Hungary or the U.S.).

  ---

  ### Highest-Impact Practical Implications if Resolved
  If the group clarifies the above, two implications would transform practice:

  1. **Judicial Review Standards for "Democratic" Reforms**  
     - **Change:** Courts could adopt a balancing test weighing procedural fairness against substantive rights impact.  
     - **Why It Matters:** In cases like *Poland’s judicial reforms* or *U.S. voting rights*, judges now default to procedural validity (e.g., "law passed by legislature"). A clarified framework would require explicit consideration of substantive harm to pluralism, raising the bar for backsliding camouflage.  
     - **Defense:** Targets *importance* (courts are key backsliding enablers/stoppers) and *partisan misuse risk* (exploiting proceduralism to mask erosion).

  2. **Journalistic Framing of "Democratic Legitimacy"**  
     - **Change:** Shift media focus from "elections were held" to "did outcomes protect vulnerable groups or enable future accountability?"  
     - **Why It Matters:** In Turkey or Hungary, elections are covered as democratic despite crackdowns on opposition/media. A dual-dimension framework would make substantive decline central to headlines.  
     - **Defense:** Addresses *neglectedness* (media often privileges procedural theater) and *asymmetry* (prevents illiberal actors from weaponizing "free elections" narratives).

  ---

  ### Why This Ordering? Explicit Criteria
  - **Importance:** Q1 is foundational; without weighting procedural/substantive dimensions, all practical applications lack coherence.  
  - **Tractability:** Q1–Q2 are resolvable via conceptual analysis (e.g., democratic theory, constitutional design), while Q3 requires empirical legitimacy studies.  
  - **Neglectedness:** Substantive erosion is often secondary in backsliding indices (e.g., V-Dem’s "electoral" vs. "liberal" democracy scores are debated, not integrated).  
  - **Risk Mitigation:** Resolving Q1 directly undercuts the top partisan evasion tactic: "But we followed the rules!" Clarifying Q2 deprives authoritarians of "reversible emergency" alibis.  

  ### Moving Forward
  The group should first model decision trees for weighting procedural/substantive trade-offs, then stress-test them against divergent cases (e.g., referendum-driven majoritarianism vs. independent courts). This creates a shared framework *before* tackling arbiters or asymmetry—which, if addressed prematurely, risk reifying partisan divides. The goal isn’t consensus but conceptual rigor that forces practitioners to confront democracy’s dual imperatives: popular will *and* constrained power.
