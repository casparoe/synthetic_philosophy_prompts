  ## The Bakery Pact

  At "Rising Dough," a worker-owned bakery, all members signed a mutual-shift-coverage pact: if someone faces a genuine emergency, colleagues strive to cover, preserving both wages and the co-op's reputation for reliability. Maya, a baker, is enjoying a rare, precious fortnight off – a holiday booked a year ago, non-refundable, costing £3000, her first real break in years. Late one night, she gets a desperate call from Ben: his toddler is rushed to A&E with a suspected severe allergic reaction; his wife is overseas, and he *must* go to the hospital. His crucial early shift tomorrow involves starting the delicate sourdoughs for a massive, high-value wedding order – the co-op’s biggest contract this year. No other baker knows the specific starter intricacies or is available. Ben pleads, invoking their pact. Covering means Maya cancelling her holiday, losing the £3000, and sacrificing her hard-earned respite, solely to prevent the order’s collapse and Ben’s lost wages. Refusing means the order fails, financially hurting the co-op and Ben, but she keeps her holiday.

  **Verdicts:**

  1.  **Kantian Imperfect Duty Analysis (Obligatory):** For Kant, beneficence is an imperfect duty – we must help others, but have latitude in when and how. However, the **voluntary mutual-shift-coverage pact radically alters this.** By freely entering this collective agreement, the co-op members have made a *prior commitment* to mutual aid in emergencies, transforming the general imperfect duty of beneficence into a specific, self-legislated perfect duty *to each other* under the pact's terms. Ben's situation is precisely the "genuine emergency" the pact was designed for. Maya's duty isn't just abstract beneficence; it's fidelity to a concrete promise made to her colleagues. While the cost to Maya (£3000 + lost holiday) is significant and disproportionate compared to the *immediate* harm of a failed order, Kantian ethics prioritises keeping commitments made through rational autonomy. Failing Ben here violates the very principle of mutual reliance they all rationally endorsed, undermining the co-op's foundational trust. The cost, however substantial, doesn't absolve her of this self-imposed obligation born from their collective agreement.

  2.  **Supererogation-Friendly View (Beyond Duty):** This view recognises that while we have core duties, acts demanding *extreme* sacrifice can exceed what morality *requires*, becoming supererogatory (praiseworthy but optional). Here, the **disproportionality between the cost to Maya and the nature of the act tips the scales.** Yes, there's a voluntary pact, suggesting a *prima facie* obligation. However, the pact implies *reasonable* effort, not limitless sacrifice. Losing £3000 and a unique, long-awaited holiday represents a massive personal burden – far exceeding the typical expectation of shift-swapping. The harm prevented (a failed order, financial loss for Ben/co-op) is serious but not catastrophic or life-threatening. The supererogation view emphasises that while admirable to uphold the pact even at such high cost, morality cannot *demand* individuals bear such disproportionate burdens for collective agreements designed for mutual, *manageable* support. Maya's sacrifice would be heroic, upholding the spirit of the co-op exceptionally, but given the extremity of the cost, it falls beyond the call of duty.

  **Structural Feature Doing the Work:**
  The **voluntary mutual pact** is the crucial element. It creates a specific, self-assumed commitment that transforms a general duty (beneficence) into a concrete obligation for Kantians. For the supererogation view, while the pact creates a *stronger* reason to help than mere beneficence, it doesn't automatically nullify the defence of *disproportionate cost*; the pact's demands are interpreted contextually, not as absolute.

  **What Collapses if Removed?**
  Without the voluntary pact, the scenario reduces to a colleague asking for a massive personal favour involving huge loss. Both views would likely concur that helping is supererogatory. The Kantian *imperfect* duty of beneficence wouldn't *require* such a disproportionate sacrifice without the prior specific commitment. The supererogation view would see it as clearly beyond duty.

  **Kantian Attack on the Case:**
  A robust Kantian defence would argue the supererogation view misunderstands the pact's moral weight. By joining the co-op and signing the pact, Maya didn't just agree to "reasonable" help; she committed to being a reliable part of a mutual support system *in defined emergencies*. Treating this commitment as voidable whenever the cost becomes "too high" (a subjective and potentially self-serving judgement) renders the pact meaningless and exploits the trust of others who *would* uphold it. It fails the test of universalisability: if *everyone* refused to cover when the cost was high, the pact (and arguably the co-op's mutualist ethos) collapses. The £3000 and holiday, while significant, are contingent goods; the duty to keep one's freely made, rational commitments to others is categorical. The "disproportion" argument prioritises self-interest over duty and the collective good they pledged to uphold.
