  First, I need to recall Lakatos's framework. The Methodology of Scientific Research Programmes (MSRP) involves a hard core of irrefutable assumptions, a protective belt of auxiliary hypotheses, and heuristic principles. Problem shifts are progressive if they predict novel facts or degenerating if they only save theories from anomalies with ad hoc adjustments. 

