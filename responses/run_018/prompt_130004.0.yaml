  Now, the Vulcan episode. The same hard core, but the anomaly was Mercury's perihelion precession. Le Verrier proposed Vulcan as an intra-Mercurial planet. This was ad hoc because it was only to explain Mercury's anomaly without independent testability. Repeated failures to observe Vulcan made it degenerating. But here's a complication: observational errors and overestimation of Mercury's precession played a role. Also, Einstein's general relativity later resolved the precession without Vulcan, replacing Newton's hard core.

