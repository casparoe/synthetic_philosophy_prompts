  Her rejection of state execution (deterrence notwithstanding) and corporate pollution (despite job benefits) suggests she operates within particularism, not rule-based systems. The strongest evidence? Her condemnation of pollution harming distant generations—a classic rejection of impersonal aggregation.

  For the discriminating case, I propose one where guilt is clearly pathological: an accident victim with brain damage feeling guilt for others' rescue efforts. This forces frameworks to reveal their stances on whether guilt's moral weight depends entirely on agential connection—something only particularism would deny.

