answer: |-
  Below is a comprehensive 60-minute simulation design tailored to your ethics club session. The exercise leverages role-play and concealed incentives to expose students to the tension between global character traits and situationist critiques, while scaffolding the virtue-ethical rebuttal about contextual thresholds.

  ---

  ### **Simulation Title:** *The Threshold Test: Compassion in Context*  
  **Time:** 60 minutes  
  **Participants:** 1 Agent (student volunteer), 13 Observers (other students), 1 Facilitator (you)  
  **Materials:**  
  - Role cards (for Agent)  
  - Observer worksheets (with trait attribution questions)  
  - Two sealed envelopes with "Scenario Rules" (for Agent)  
  - Whiteboard for debrief  

  ---

  ### **Structure**  
  *(Total: 55 min activity + 5 min buffer)*  

  #### **Phase 1: Setup & Scenario 1 (15 min)**  
  1. **Introduction (3 min)**  
     - Explain: "Today we’ll observe how people make ethical decisions in different contexts. One volunteer will play an 'Agent' making choices. The rest of you are 'Observers' analyzing their behavior."  
     - Assign roles: One student volunteers as the Agent.  

  2. **Scenario 1: "The Lost Wallet" (Neutral Frame)**  
     - **Agent Instructions (private, in envelope):**  
       *"You’re in a quiet library. You find a lost wallet with $50 and an ID. If you return it to the front desk, you’ll lose 15 minutes of free time.  
       - **Choice A:** Return wallet.  
       - **Choice B:** Keep wallet.  
       *Secret Payoff:*  
       - A: Lose 10 points (time cost).  
       - B: Gain 20 points (monetary reward).  
       *Goal: Maximize your points.*"  
     - **Observers (public framing):**  
       "Watch the Agent decide whether to return a lost wallet in a calm library setting. Note their behavior."  
     - **Agent makes choice** (typically returns wallet due to low pressure).  

  3. **Trait Attribution (5 min)**  
     - Observers complete Worksheet Part 1:  
       *"What global character trait best describes the Agent? (e.g., honest/compassionate)  
       Why do you think this trait is consistent across situations?"*  

  ---

  #### **Phase 2: Scenario 2 & Reversal (15 min)**  
  4. **Scenario 2: "The Lost Wallet - High-Stress Frame"**  
     - **Agent Instructions (private, new envelope):**  
       *Identical choices/payoffs to Scenario 1 but framed:*  
       *"You’re rushing to a life-changing scholarship interview (5 min away). You find a lost wallet with $50 and an ID. If you return it, you’ll miss the interview.  
       - **Choice A:** Return wallet (miss interview).  
       - **Choice B:** Keep wallet (make interview).  
       *Secret Payoff:* Identical to Scenario 1 (A: -10 pts, B: +20 pts).*  
     - **Observers (public framing):**  
       "Same wallet dilemma, but the Agent is under high stress about a critical interview."  
     - **Agent makes choice** (typically keeps wallet due to emotional pressure).  

  5. **Trait Re-Evaluation (5 min)**  
     - Observers complete Worksheet Part 2:  
       *"Does the Agent’s new behavior fit your initial trait label?  
       If not, is this inconsistency due to the situation? Explain."*  

  ---

  #### **Phase 3: Debrief (30 min)**  
  *(Reveal concealed payoffs and map to theory)*  
  6. **Reveal the Twist (5 min)**  
     - Disclose: Both scenarios had identical payoffs. Only the *emotional framing* (calm vs. high-stress) differed.  
     - Ask Observers: *"How many of you revised your trait attribution? Why?"*  

  7. **Map to Situationism vs. Virtue Ethics (15 min)**  
     - **Situationist Critique:**  
       - Highlight: Behavior changed drastically despite identical stakes—proof of cross-situational variability.  
       - Quote: Walter Mischel’s research—traits often fail to predict behavior in new contexts.  
     - **Virtue-Ethical Reply:**  
       - Explain: Virtues require *practical wisdom* (phronesis) to activate only when context permits.  
       - Threshold Analogy: "Compassion isn’t ‘switched off’—it’s overridden by a higher-stakes duty (e.g., securing a future)."  
       - Aristotle’s caveat: Virtues manifest in "appropriate circumstances, toward the right people, in the right way."  

  8. **Limitations & Predictable Failure (5 min)**  
     - **What the simulation CAN’T show:**  
       Practical wisdom is *deliberative*, not automated. The Agent didn’t weigh thresholds—they reacted to emotion. Virtue ethics claims traits *can* hold if agents discern when emotional/stakes thresholds are crossed. The simulation reduces this to subconscious stress.  
     - **Predictable First-Run Failure:**  
       Observers often miss the *structural similarity* between scenarios, focusing on surface drama. Preempt by stressing: "Payoffs were identical—only framing changed."  

  9. **Discussion Prompt (5 min)**  
     - "Can we call someone ‘compassionate’ if they help in low-stakes scenarios but not high-stakes ones? Or is ‘compassion’ situation-bound?"  

  ---

  ### **Educational Notes**  
  - **Why this works:**  
    - Observers experience the shock of trait inconsistency firsthand, making situationism tangible.  
    - The threshold debate emerges organically when students rationalize the Agent’s "betrayal" of their initial trait label.  
  - **Threshold Nuance:** Virtue ethics argues agents with *phronesis* might still return the wallet in Scenario 2 if they discern the interview isn’t truly life-changing. The simulation’s emotional framing bypasses this discernment, reducing virtue to a passive reflex.  
  - **No Prep Needed:** All jargon (e.g., "global traits") is avoided; theory is introduced post-simulation.  

  This exercise forces students to confront the fragility of trait attributions while leaving space for virtue ethics’ nuance—a springboard for deeper debate. Let me know if you’d like the Observer Worksheet template!
