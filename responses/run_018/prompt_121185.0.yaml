answer: |-
  ### Decision Tree: Sorting Quantum Interpretations  
  *Assumes QM applies universally (not just in labs). Casual notes—typos & quirks intentional.*

  ---

  **Start:**  
  QM is universal? ✔️ (You're past lab-only views.)  

  **1st Branch: Can two systems share identical quantum states but still differ in hidden physical properties?**  
  - **YES** → Epistemic-ish (state isn't the whole truth) → **Go to 2**  
  - **NO** → Ontic-ish (state captures reality) → **Go to 2**  

  **2nd Branch: Is the quantum state about a single system or only an ensemble?**  
  - **SINGLE SYSTEM** → **Go to 3**  
  - **ENSEMBLE ONLY** → **Go to 3**  

  **3rd Branch: Is 3N-D config space okay for fundamental reality?**  
  - **ACCEPTABLE** → **Go to 4**  
  - **DEALBREAKER** → **Go to 4**  

  **4th Branch: If you measure a state without collapse, does that prove it’s real?**  
  - **YES** → **See Leaf A, B, or C**  
  - **NO** → **See Leaf D or E**  

  ---

  ### LEAVES  
  **Leaf A** (YES, SINGLE, ACCEPTABLE, YES)  
  - **Bohmian Mechanics**  
    - *Awkward commitment:* You must accept invisible particles riding a wave in 3N-D space, forever hidden from direct detection.  
    - *Note:* Separated from Everett by Q1 (Bohm says YES to hidden properties).  

  **Leaf B** (NO, SINGLE, ACCEPTABLE, YES)  
  - **Everett/Many-Worlds** OR **GRW-style Collapse**  
    - *Awkward commitments:*  
      - *Everett:* Every quantum choice spawns a new universe—including one where you’re a banana.  
      - *GRW:* Wavefunctions randomly "collapse" without observers, but nobody knows why or how precisely.  
    - *Tree can’t split these:* Both deny hidden properties (Q1: NO) and embrace config space (Q3: YES).  

  **Leaf C** (YES, ENSEMBLE, DEALBREAKER, YES)  
  - **EMPTY COMBO**  
    - *Why?* If the state is "just statistical" (ensemble) but measuring proves it’s real (YES to Q4), you’ve contradicted yourself. Unattractive.  

  **Leaf D** (YES, SINGLE, DEALBREAKER, NO)  
  - **QBism** OR **Relational QM (RQM)**  
    - *Awkward commitments:*  
      - *QBism:* Quantum states are personal opinions—yours and mine can disagree, and both be "true".  
      - *RQM:* Reality depends on who’s looking—no absolute state, just observer-dependent relations.  
    - *Tree can’t split these:* Both say YES to hidden-ish properties (Q1) and NO to config space (Q3).  

  **Leaf E** (YES, ENSEMBLE, DEALBREAKER, NO)  
  - **Copenhagen-style (Ensemble View)**  
    - *Awkward commitment:* QM only describes groups, not individual systems—so shut up about that single electron.  
    - *Note:* The classic "shut up and calculate" branch.  

  ---

  ### EMPTY OR UNEXPLORED COMBO NOTES  
  - **All other combos (11 of 16)**: Logical dead ends. Examples:  
    - *Psi-ontic + Ensemble (NO + ENSEMBLE)*: If the state is real, why restrict it to groups? Incoherent.  
    - *Psi-ontic + Config-space dealbreaker (NO + DEALBREAKER)*: Where does the "real" state live? Unexplored.  
  - **Tree limitations**:  
    - Bohm (Leaf A) and Everett (Leaf B) both end up psi-ontic*ish* but split via Q1 (hidden properties).  
    - QBism/RQM (Leaf D) and Ensemble (Leaf E) split via Q2 (single vs. ensemble).  

