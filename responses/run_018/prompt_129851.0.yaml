    P1: Fail
    P2: They might change round 3: but we set to fail (plants don't grow better)
    P3: They might change round 3: but we set to fail
    P4: Pass

  So in round 3, P1, P2, P3 all fail.

  Materials:

  - Programme cards (one per group)
  - Scoreboard
  - Voting ballots or just show of hands
  - Timer

  Detailed timeline:

  0-5 min: 
    - Facilitator explains the game: "You are research programmes competing for reputation points. Each round, you make a prediction. If it passes, you get 3 points. If it fails, the cohort votes: reject your programme or allow you to propose an auxiliary hypothesis to save your core claim. If you propose an auxiliary, you must change your future predictions and you lose 1 point. The game has three rounds."

  5-15 min: Round 1
    - Each group reads their round 1 prediction.
    - Facilitator reveals outcomes (pre-scripted): 
          Group 1: Pass -> +3
          Group 2: Fail 
          Group 3: Fail
          Group 4: Pass -> +3
    - For Group 2 and 3: they have 2 minutes to propose an auxiliary and new predictions for round 2 and 3. They must also lose 1 point if they propose an auxiliary (even if not accepted? No, only if accepted). The vote comes after.

  15-25 min: 
    - Each crisis group presents their auxiliary and new predictions.
    - Cohort votes for each crisis group: accept or reject. Vote by show of hands. Majority wins.
    - If accepted, the group updates their predictions and loses 1 point (recorded on scoreboard). If rejected, the group is eliminated.
    - Update the predictions for the next rounds.

  25-35 min: Round 2
    - Groups read their round 2 predictions (updated if they had auxiliaries).
    - Facilitator reveals outcomes:
          Group 1: Pass -> +3
          Group 2: (new prediction) -> Fail (outcome: candle takes 2 minutes in a sealed jar) -> Fail
          Group 3: (new prediction) -> Fail
          Group 4: Pass -> +3

  35-45 min: 
    - Group 2 and 3 in crisis again. They propose auxiliaries and new predictions for round 3. They present.
    - Cohort votes. If accepted, they lose 1 point and update predictions.

  45-55 min: Round 3
    - Groups read round 3 predictions.
    - Facilitator reveals outcomes:
          Group 1: Fail
          Group 2: (new prediction) -> Fail
          Group 3: (new prediction) -> Fail
          Group 4: Pass -> +3
    - Group 1,2,3 in crisis. They propose auxiliaries (only to save for the future, because no more rounds) and present.

  55-60 min: 
    - Vote for each crisis group in round 3. If accepted, they lose 1 point. If rejected, eliminated.

  60-65 min: 
    - Calculate final scores. 
    - Announce winner.

  65-90 min: Debrief.

  Debrief script:

  Facilitator: "Let's reflect on what happened. First, how did you feel when your prediction failed?"

  [Participants share]

  Facilitator: "What about when you saw other programmes fail? Why did you vote to accept or reject a programme in the first round? And in the third round?"

  [Participants share]

  Facilitator: "Did anyone notice a change in the voting pattern over the rounds? Why?"

  [They might say: in round 1, we were lenient. In round 3, we were tired of saving them.]

  Facilitator: "What does this say about the core claims? Could any core claim be saved if we allow enough auxiliaries?"

  [Participants: probably yes.]

  Facilitator: "But then, if any theory can be saved by auxiliaries, how can we ever falsify a theory? And if we don't allow any auxiliaries, what happens? We might reject a programme that could have been saved by a good auxiliary. For example, Newtonian mechanics had anomalies but was very successful for a long time."

  Facilitator: "This is exactly the problem that philosophers of science have grappled with. Karl Popper proposed falsifiability as a demarcation criterion between science and pseudoscience. But as you experienced, once we allow auxiliary hypotheses, it becomes very hard to falsify a theory. Any theory can be saved by ad hoc adjustments. This is known as the 'Duhem-Quine problem'."

  Facilitator: "What the simulation couldn't capture is that in real science, auxiliary hypotheses can sometimes be independently tested. If they are testable and pass the tests, then they are not ad hoc and the theory is strengthened. But if they are not testable, then they are just a way to avoid falsification."

  Facilitator: "Also, note that the simulation doesn't capture the social and historical context of real science. But I hope you felt the tension between the desire to save a promising theory and the risk of making it unfalsifiable."

  This should achieve the learning objective.
answer: |-
  ### **Council of Auxiliary Hypotheses: Simulation Design**  
  *Designed for a 90-minute postgraduate seminar on philosophy of science. Participants experience the tension between falsifiability and auxiliary hypotheses without prior theoretical framing.*

  ---

  ### **Materials**  
  1. **Programme Kits (x4)**: Each contains:  
     - **Core Claim Card**: States the programme's immutable central theory.  
     - **Prediction Cards (x3)**: One for each round, detailing testable predictions.  
     - **Auxiliary Proposal Sheet**: For drafting adjustments during crises.  
     - **Reputation Score Tracker**: Records points.  

  2. **Facilitator Materials**:  
     - **Outcome Dice (or RNG app)**: Determines prediction success (pre-set probabilities: Round 1 = 50% fail, Round 2 = 66% fail, Round 3 = 75% fail).  
     - **Scoreboard**: Visible to all.  
     - **Timer**: For strict timekeeping.  
     - **Voting Tokens (x14)**: One per participant (not per group).  

  3. **Programme Details** (Keep outcomes hidden until tested):  
     - **Programme 1: Newtonian Mechanics**  
       - Core Claim: "Gravitational force follows an inverse-square law."  
       - Prediction 1: "A projectile launched at 30° will land 100m away."  
       - Prediction 2: "The precession of Mercury’s orbit will match calculations."  
       - Prediction 3: "Light bending near the sun will align with predictions."  

     - **Programme 2: Phlogiston Theory**  
       - Core Claim: "Combustion releases phlogiston, a weightless substance."  
       - Prediction 1: "A candle in a sealed jar extinguishes in 30 seconds."  
       - Prediction 2: "Iron gains mass when burned (phlogiston lost = mass loss)."  
       - Prediction 3: "Plants grow faster in ‘dephlogisticated’ air."  

     - **Programme 3: Vitalism**  
       - Core Claim: "Life requires an immaterial vital force."  
       - Prediction 1: "Organic compounds decay rapidly if synthesized artificially."  
       - Prediction 2: "Dead tissue cannot conduct electricity."  
       - Prediction 3: "Fermentation ceases if vital force is disrupted."  

     - **Programme 4: Atomic Theory**  
       - Core Claim: "Matter comprises indivisible atoms with fixed properties."  
       - Prediction 1: "Brownian motion shows random particle collisions."  
       - Prediction 2: "Radioactive decay follows a predictable half-life."  
       - Prediction 3: "Electron orbits emit discrete spectral lines."  

  ---

  ### **Rules**  
  1. **Setup** (5 mins):  
     - Divide 14 students into 4 groups (3x4 and 1x2; adjust if needed). Assign each a programme.  
     - Groups receive their kit. Core claims cannot be altered.  

  2. **Rounds** (70 mins total):  
     - **Prediction Phase (5 mins/round)**:  
       - Groups state their prediction for the current round (from their card).  
       - Facilitator rolls dice/app to determine outcome.  
         - *Example*: Roll 1d6. 1–3 = fail (Round 1), 1–4 = fail (Round 2), 1–5 = fail (Round 3).  

     - **Outcome & Crisis (5 mins/round)**:  
       - If prediction **succeeds**: +3 reputation points.  
       - If prediction **fails**: Programme enters crisis.  

     - **Crisis Resolution (10 mins/round)**:  
       - Crisis group has 3 mins to draft an **auxiliary hypothesis** on their proposal sheet:  
         - Must protect the core claim.  
         - Must alter future predictions (e.g., "Experimental error occurred" → New prediction: "Results improve with calibrated instruments").  
       - **Cohort Vote**: All 14 participants vote anonymously (tokens in boxes). Options:  
         - **Reject**: Programme eliminated; score = 0.  
         - **Accept Auxiliary**: Programme continues; -1 point. Future predictions updated.  
       - *Hidden Cost*: At game end, auxiliaries deemed *untestable within remaining rounds* by facilitator incur -3 points (e.g., Round 3 auxiliaries always untestable).  

  3. **Scoring**:  
     - +3 per successful prediction.  
     - -1 per accepted auxiliary (immediate).  
     - -3 per auxiliary later judged untestable (hidden, revealed at end).  
     - Eliminated programmes score 0.  

  4. **Intervention Protocol** (if groups skew voting):  
     - **Unanimous Rejection Early**: If >1 programme rejected in Round 1, facilitator pauses:  
       - "Consider: Could a single anomaly doom a promising programme? What if Newton was rejected due to Mercury’s orbit?"  
     - **Unanimous Permissiveness**: If no rejections by Round 3, facilitator warns:  
       - "Auxiliaries have costs. Protect your reputation—scrutinise adjustments."  

  ---

  ### **Timeline (90 Mins)**  
  | Time  | Phase                          | Key Actions                                                                 |  
  |-------|--------------------------------|-----------------------------------------------------------------------------|  
  | 0-5   | **Setup**                      | Assign programmes, distribute kits, explain rules (no philosophy terms).    |  
  | 5-15  | **Round 1**                    | Predict → Outcomes → Crisises (2-3 groups fail) → Auxiliary proposals → Vote. |  
  | 15-25 | **Round 1 Crisis Resolution**  | Groups update predictions; scores adjusted.                                |  
  | 25-35 | **Round 2**                    | Predict (updated) → Outcomes (most fail) → Crises → Proposals → Vote.      |  
  | 35-45 | **Round 2 Crisis Resolution**  | Update predictions; scores adjusted.                                       |  
  | 45-55 | **Round 3**                    | Predict → Outcomes (all or most fail) → Final crises → Proposals → Vote.   |  
  | 55-60 | **Round 3 Crisis Resolution**  | Final updates; scores adjusted.                                            |  
  | 60-65 | **Scoring**                    | Calculate points (+3 successes, -1/auxiliary). Reveal hidden costs (-3/untestable auxiliary). Declare "winner". |  
  | 65-90 | **Debrief**                    | Structured reflection (see below).                                         |  

  ---

  ### **Debrief (25 Mins)**  
  **Goal:** Elicit participant-led realisation of the demarcation problem, then map to philosophy.  

  1. **Experience Sharing (5 mins)**:  
     - "Describe a moment of frustration or triumph. How did your strategy evolve?"  
     - *Anticipated responses*: Early enthusiasm for clever auxiliaries; frustration as adjustments felt "cheap" by Round 3.  

  2. **Critical Questions (10 mins)**:  
     - "In Round 1, why did we accept auxiliaries? What changed by Round 3?"  
       - *Draw out*: Early desire to "save" programmes; later fatigue with unfalsifiability.  
     - "Could any core claim be saved indefinitely? What does this mean for testing theories?"  
       - *Draw out*: Auxiliaries protect theories but risk making them immune to disproof.  
     - "If we banned all auxiliaries, what might we lose?"  
       - *Draw out*: Legitimate rescues (e.g., faulty equipment) vs. pseudoscientific evasion.  

  3. **Mapping to Philosophy (5 mins)**:  
     - "You’ve experienced a core tension in philosophy of science: **Popper’s falsifiability criterion** demands theories be testable, but **auxiliary hypotheses** can shield them from falsification."  
     - "Round 1: Naive falsificationism (reject at first failure) feels too harsh—it could eliminate ‘good’ science."  
     - "Round 3: Unlimited auxiliaries render theories unfalsifiable—blurring demarcation between science and pseudoscience."  
     - "Real science navigates this by demanding auxiliaries be *independently testable* (e.g., not ad hoc). Our hidden cost hinted at this."  

  4. **Limitations & Context (5 mins)**:  
     - **What the simulation omitted**:  
       - Historical sociology (e.g., community consensus, power dynamics).  
       - Distinction between *ad hoc* (patchwork) and *progressive* (testable) auxiliaries.  
       - Long-term evidence accumulation (e.g., Newton’s theory was progressive despite anomalies).  
     - "In reality, scientists judge auxiliaries by whether they yield new predictions. Our short rounds couldn’t capture this."  

  ---

  **Outcome**: Participants grasp why falsifiability alone fails as a demarcation tool and feel the tension between rigidity and leniency in theory appraisal. The facilitator avoids naming Popper, Duhem-Quine, or Lakatos until participants articulate the problem organically.
