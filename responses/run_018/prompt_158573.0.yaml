  So, perhaps the principle is: **Coherence requires that your decision rule doesn't allow exploitability in the commitments you actually make, but doesn't force EU maximization in domains where you refuse to translate outcomes into a unitary utility scale.**

  This separates cases where an agent opts out of certain decisions (doctor) versus inconsistently applying rules within a domain (trader). The researcher is still maximizing EU, just with high utility on discovery. The climate advisor uses minimax which might avoid Dutch books under certain conditions. The trader violates axioms, making her vulnerable if she bets on sacred things but inconsistently.

