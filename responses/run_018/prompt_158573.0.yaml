answer: |-
  Howdy! First off, major respect — diving headfirst into decision theory after a chemistry career is awesome. Your cases hit a nerve in modern debates: **coherence arguments (like Dutch books) prevent you from being exploitable, but they don't *force* you to maximize expected utility (EU) across all domains.** EU maximization is just one rational strategy among others, as long as you avoid inconsistency. Let's break this down with your cases and a new one.

  ### The Core Principle: **Domained Coherence**
  - **What it means**: Rationality requires avoiding Dutch books *within any domain where you commit to probabilistic beliefs and preferences*. But you can **opt out of applying EU to certain domains** (e.g., life-or-death decisions) or use non-EU rules (e.g., minimax), *if* your choices don't create exploitable inconsistencies in the bets you *do* accept.
  - **Why it works**: Coherence arguments are about **consistency in commitments**, not universal EU maximization. If you refuse to "price" certain outcomes (e.g., human lives) in a utility scale, you avoid Dutch books by not playing the game. But if you *do* assign utilities and probabilities, violating EU axioms opens you to exploitation.

  ### Applying Domained Coherence to Your Cases
  1. **Researcher (maximizes expected info gain)**:  
     - **Verdict**: Rational.  
     - **Why**: She *is* maximizing EU—just with a utility function that weights "discovery" extremely highly. The 30% destruction risk is priced in. No incoherence here.  
     - **Fits principle? Yes**.  

  2. **Doctor (refuses fair bet on patient's recovery)**:  
     - **Verdict**: Rational.  
     - **Why**: She explicitly *opts out* of treating lives as "gamble-able" outcomes. Since she doesn't commit to utility comparisons involving life/death, no Dutch book can be made against her *in this domain*. Her refusal isn't inconsistent—it’s a meta-decision.  
     - **Fits principle? Yes**.  

  3. **Climate Advisor (uses minimax regret, probabilities shift with framing)**:  
     - **Verdict**: Coherent.  
     - **Why**: Minimax regret isn’t EU, but it’s still a consistent rule *if* her probability shifts are rule-based (e.g., "under high-stakes framing, I weigh worst cases more"). As long as she doesn’t accept bets contradicting her stated beliefs, she avoids Dutch books. Coherence doesn’t require stable beliefs—just no exploitable contradictions.  
     - **Fits principle? Yes**.  

  4. **Trader (violates sure-thing principle for 'sacred' outcomes)**:  
     - **Verdict**: Incoherent.  
     - **Why**: Unlike the doctor, she *participates* in decision-making with utilities/probabilities (she's a trader!), but carves out inconsistent exceptions. Violating Savage’s sure-thing principle means her choices can be Dutch-booked *if* she bets on "sacred" vs. "non-sacred" outcomes. Her reasoning *sounds* like the doctor’s, but she’s mixing domains without a firewall.  
     - **Fits principle? No—and shouldn’t**. She’s incoherent because she’s in the game but breaking rules.  

  ### The Tension Resolved
  - **What holds them together?** Domained coherence. The doctor and researcher respect coherence *within* their domains; the climate advisor uses a coherent non-EU rule; the trader violates coherence *across* domains.  
  - **Which verdict to drop? None!** Your intuition is solid. The trader *is* incoherent because she’s not opting out—she’s creating "sacred" exceptions while otherwise engaging in utility-based choices. The doctor, by contrast, draws a bright line.  

  ### New Case: AI Designer
  - **Scenario**: An AI designer maximizes EU for hardware costs but treats safety violations lexicographically (e.g., "any risk >0.0001% of catastrophe is unacceptable, regardless of cost savings").  
  - **Prediction**:  
    - **Rational *if_** she avoids trading safety against costs (e.g., refuses to set a "price" for human life). No Dutch book arises because she doesn’t commit to utility comparisons across domains.  
    - **Incoherent *if_** she sometimes accepts cost-safety trade-offs (e.g., "I’ll risk 0.0002% catastrophe for $10M savings") but other times doesn’t—opening herself to exploitation via conflicting choices.  

  ### When Domained Coherence *Can't* Save You
  - **The Trader’s case (4)** is the weak spot—but rightly so. If you violate axioms *while engaging in probabilistic betting*, Dutch books *will* find you. The principle accommodates this by calling her incoherent.  
  - **The Limitation**: If you apply different rules to *identical* choices (e.g., accepting a bet framed as "lives saved" but rejecting it framed as "deaths prevented"), you’re incoherent. The climate advisor skirts this by having a clear framing-dependent rule, but if her framing shifts arbitrarily, she’d be vulnerable.  

  ### Bottom Line
  Coherence arguments are traffic cops: they prevent you from crashing (being Dutch-booked), but they don’t dictate your destination (EU maximization). Your verdicts hold up fine—**except the trader, who’s genuinely incoherent because she won’t pick a lane**. Stick to your guns, and tell your grandson his English stipulation was no sweat. If you’ve got more cases, fire away—this stuff is a blast to untangle.
