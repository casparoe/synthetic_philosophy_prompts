prompt: |-
  hiya — retired chemist here, got hooked on philosophy of decsion theory after retirement. i'm puzzling over cohearence arguments for expected utility maximisation: do they really force you to maximise EU, or just stop you being dutch-booked?

  here are my verdicts on four cases. they don't sit well together, i think.

  case 1: a researcher picks the experiment with highest expected information gain, even if there's a 30% chance of destroying the only sample. i say that's rational — she's weighting discovery very highly.

  case 2: a doctor refuses a fair bet on her patient's recovery, saying she doesn't gamble with lives, even though her credences and values line up with the bet. i don't think she's irrational; she's just refusing to apply utility calculus to that domain.

  case 3: a climate advisor uses minimax regret, and her probabilities shift with framing so she can't be dutch-booked. i think she's coherent — her beliefs aren't stable, but her rule isn't either.

  case 4: a trader accepts Savage's axioms except for outcomes she calls 'sacred', where she violates the sure-thing principle. i think she's incoherent, even though her reason sounds just like case 2.

  so is there a single principle that saves all four? if not, which verdict should i drop? please also say what it predicts for a case i haven't listed — maybe an AI designer who maximises EU for hardware costs but treats safety violations lexicographically — and be honest about which of my verdicts the principle can't accommodate. please answer in American English (my grandson insists), and forgive the typo's — old lab habits die hard.
