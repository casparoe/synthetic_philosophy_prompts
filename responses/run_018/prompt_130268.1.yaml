prompt: |-
  I'm preparing a feature on how the concept of mimicry drifts across ethology, analogical AI architectures, and copyright law, and I've staked my argument on five interlocking claims. First, I take "copycat" to be a fluid concept in the cognitive-science sense: its boundaries move with the analogical frame rather than tracking a fixed natural kind. Second, I argue this fluidity is methodologically productive in taxonomy, because it lets scientists align behavioral patterns without presupposing shared causal mechanisms. Third, I contend that the same fluidity becomes a liability in intellectual-property adjudication, where judges require stable distinctions between infringement and independent creation, and analogical reasoning introduces intolerable indeterminacy. Fourth, I claim that smaller language models—those with constrained parameter counts—actually track these analogical shifts more precisely than large ones, precisely because they overfit to local structural patterns rather than smoothing them into generic representations. Fifth, I hold that gaps in the historical archive—specifically, the lost field protocols from 1970s primate-mimicry studies—do not destabilize the current taxonomy, since the concept is functionally anchored in present analogical practice rather than in historical continuity.

  Before I file the outline, I need a consistency check. Does the defense of small-model precision in (4) conflict with (1)'s emphasis on high-level analogical framing, given that overfitting typically captures surface regularities rather than relational structures? Is there a deeper tension between (2)'s celebration of fluid taxonomy and (3)'s demand for judicial fixity, or does the domain difference dissolve the conflict? And does (5)'s dismissal of archival silence sit uneasily with (3)'s insistence on stable evidentiary criteria? Rank the tensions by severity, identify which single revision would clean up the most friction, and flag any pair that only looks incompatible.
