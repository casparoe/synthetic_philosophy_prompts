answer: |-
  Here is the exam prompt, model answer, and marking scheme designed to push students beyond rote taxonomy and engage deeply with the paradox of continuous synthetic replacement.

  ---

  **1. Exam Prompt**

  **Metaphysics 495: Final Examination Question (90 Minutes; Target ~1200 Words)**

  **Scenario:** Consider a statue ('Synthia') created via additive manufacturing. A digital model directs the precise deposition of clay particles layer-by-layer. Crucially, **at the very instant each particle is deposited into Synthia's emerging structure, that specific particle is instantaneously replaced by a synthetically identical substitute particle.** These substitutes are qualitatively indistinguishable from the deposited particles but possess a *different molecular origin*. Consequently, *no particle ever physically incorporated into Synthia's structure originated from the initial reservoir of clay used by the process*. Simultaneously, the particles *not* deposited (both the original reservoir particles and any undeposited substitutes) are continuously aggregated into a distinct lump ('Reservoir Lump').

  **Question:** Analyze the metaphysical implications of this continuous synthetic replacement for the constitution and persistence of Synthia. Specifically, address:

  a.  Does *any* clay-lump (e.g., the Reservoir Lump, or any temporal stage of it) ever come to constitute Synthia's shape? Why or why not?
  b.  Can Synthia, understood as a distinct artifact persisting through time, survive the *complete replacement* of every particle that ever composed it, especially given that this replacement occurs *during its very formation*? Explain the challenges.
  c.  Can a 'constitution-without-identity' view (one holding that Synthia is constituted by, but not identical to, some clay-lump at a time) coherently accommodate this scenario *without* collapsing into either the view that Synthia and the Reservoir Lump are coincident objects at some time, or into eliminativism about Synthia (denying its existence)? Justify your assessment.

  **Instructions:** Your essay must demonstrate sophisticated metaphysical reasoning. **Mere recitation of standard positions (e.g., "endurantism vs. perdurantism," "dominance vs. coincidence," "temporal parts") or summaries of well-known objections (e.g., the grounding problem, the problem of too many thinkers) is insufficient.** Focus explicitly on the unique features of continuous synthetic replacement *during formation* and apply core concepts of composition, constitution, persistence, and identity directly to the described scenario. Engage critically with the logic of the process.

  ---

  **2. Model Answer Outline (Essential Analytical Moves)**

  **(Introduction - ~100 words)** The Synthia scenario radicalizes the statue/clay paradox by introducing *continuous synthetic replacement during constitution itself*. This prevents identifying Synthia with any aggregate originating from the reservoir and decouples artifact formation from the persistence of its original matter in unprecedented ways, challenging fundamental assumptions about composition and persistence. Standard coincidence/dominance debates fail here as no single "lump" clearly coincides with Synthia in the usual sense.

  **(a) No Constituting Lump (~400 words)**
  *   **Problem:** Constitution typically requires a material object (the lump) to occupy the spatial region and have the modal/historical properties grounding the constituted object (the statue). The Reservoir Lump (RL) *never* occupies Synthia's exact spatial region – RL exists alongside the growing Synthia and is composed of *undeposited* particles. Synthia is composed *only* of substitute particles that were *never part of RL*.
  *   **Analysis:** A temporal stage of RL *before* deposition starts might seem candidate matter, but deposition hasn't begun; it has no statue-shape. Crucially, *no aggregate composed of original reservoir particles ever gets shaped into Synthia*. Each particle is *removed* from potential RL membership upon deposition and *replaced* before incorporation. Thus, no aggregate sharing Synthia's origin *or* matter ever assumes her shape. **Key Move:** The process structurally precludes any single lump (reservoir-originated or substitute-aggregate) from being the persisting matter bearer that Synthia is constituted *by*. Synthia is constituted by a *sequence* of distinct, ephemeral substitute-aggregates, not a single lump.

  **(b) Persistence Through Formation-Replacement (~400 words)**
  *   **Problem:** Synthia's existence seems to begin once sufficient structure exists. Yet, at every moment after the first deposition, particles composing her are being replaced. By completion, *every* particle that ever composed her has been replaced. Crucially, this replacement isn't maintenance on an existing object; it's *integral to the object's coming-into-being*.
  *   **Analysis:** Standard persistence conditions (spatiotemporal continuity, causal dependence, functional continuity) face unique strain. Spatiotemporally, Synthia grows continuously. Causally, later stages causally depend on earlier stages via the manufacturing process and digital model, *not* on the persistence of the original particles (which are gone). Functionally, the shape and role emerge progressively.
  *   **Challenge:** The core challenge is that the entity acquiring the defining statue-properties (shape, art-historical origin) is *not* an entity persisting through the replacement of *its own parts* in the standard way. The "it" that gains parts is *itself* a constantly shifting aggregate of substitutes. **Key Move:** Persistence might rely heavily on the *continuity of the generative process and informational template* rather than the persistence of any material substrate. Synthia persists iff the additive process, governed by the digital model, continues generating a structure instantiating the intended shape, regardless of the molecular origin of the momentary composing particles.

  **(c) Constitution-Without-Identity Feasibility (~300 words)**
  *   **Possibility:** A constitution view *can* accommodate this without coincidence or eliminativism, but requires careful refinement.
  *   **Avoiding Coincidence:** At any time `t` during Synthia's existence, she is constituted by a specific, momentary aggregate of substitute particles (`Agg_t`). `Agg_t` is distinct from Synthia (different persistence conditions – `Agg_t` ceases as soon as any of its particles are replaced, Synthia persists). Crucially, `Agg_t` is *also distinct from the Reservoir Lump (RL)`* at `t` (different matter, different location). Thus, Synthia and RL *never* coincide. Synthia coincides only with fleeting `Agg_t`s.
  *   **Avoiding Eliminativism:** Synthia exists as a distinct entity because she has essential properties RL and `Agg_t` lack: being an artifact created by *this* additive process with *this* digital model to realize *this* shape, persisting through the replacement of her composing matter as governed by that process. RL lacks this origin and persistence condition; `Agg_t` lacks the persistence condition and historical properties.
  *   **Refinement Needed:** This requires accepting that the constituting entity at a time (`Agg_t`) is extremely short-lived (perhaps instantaneous) and defined relationally (as the aggregate *currently* composing the persisting Synthia via the ongoing process). Synthia's identity is tied to the process, not a material body. **Key Move:** Constitution is a *many-to-one-over-time* relation: Synthia is serially constituted by a rapid succession of distinct, non-coinciding substitute-aggregates (`Agg_t1`, `Agg_t2`...), each constituting her only momentarily, linked solely by the continuous generative process. This avoids both coincidence (Synthia ≠ RL, Synthia ≠ `Agg_t`, RL ≠ `Agg_t`) and eliminativism (Synthia is the process-bound artifact).

  ---

  **3. Marking Scheme (Total: 20 Points)**

  | **Must-Hit Move**                                                                                                  | **Marks** | **Characteristic Error Costing Marks**                                  |
  | :----------------------------------------------------------------------------------------------------------------- | :-------- | :---------------------------------------------------------------------- |
  | **1. Explicitly identifies why *no* reservoir-originated lump constitutes Synthia's shape:** Clearly argues that the Reservoir Lump (or any stage of it) *never* assumes Synthia's shape due to the replacement *before* incorporation, decoupling Synthia's matter from the reservoir entirely. | 4         | *Vagueness:* Claiming RL doesn't constitute Synthia without explaining *why the process prevents it*, or confusing RL with the substitute aggregates composing Synthia. |
  | **2. Distinguishes the fleeting composing aggregates (`Agg_t`) from both Synthia *and* the Reservoir Lump:** Clearly articulates that Synthia is composed of ephemeral substitute aggregates (`Agg_t`) at each moment, which are distinct from both the persisting artifact (Synthia) and the distinct, persisting Reservoir Lump. | 4         | *Conflation:* Failing to distinguish the composing `Agg_t` from Synthia itself, or conflating `Agg_t` with the Reservoir Lump (RL). |
  | **3. Analyzes the unique challenge to persistence:** Engages specifically with how *complete replacement occurring DURING FORMATION* strains standard persistence conditions, focusing on the reliance on the *generative process/model* rather than material continuity. | 5         | *Generic Persistence:* Discussing replacement in general maintenance contexts without addressing the specific paradox of replacement *integral to the object's coming-into-existence*. |
  | **4. Explains how CWI avoids coincidence:** Clearly states that Synthia coincides only with momentary `Agg_t` (not RL), and that `Agg_t` and RL are distinct and non-coinciding at all times. | 4         | *Implied Coincidence:* Suggesting Synthia and RL coincide at some point, or failing to specify *what* Synthia coincides with (`Agg_t`) and *why* this avoids coincidence with RL. |
  | **5. Explains how CWI avoids eliminativism:** Identifies Synthia's distinct persistence conditions and historical/functional properties (bound to the generative process/model/shape) that `Agg_t` and RL lack, justifying her existence as a distinct entity. | 3         | *Collapse to Eliminativism:* Suggesting Synthia is *just* the sequence of `Agg_t`s without unifying properties, or implying the artifact doesn't truly persist through replacement. |

  **Overall Assessment Note:** High marks require engagement with the *continuous replacement during formation* as the core novelty. Answers that primarily discuss standard constitution problems or use labels without direct application to the scenario's mechanics will score poorly, regardless of technical vocabulary used.
