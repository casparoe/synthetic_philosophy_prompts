  so my roommate got deep into this political group that literally rewrites wikipedia pages and denies documented events ever happened, and it made me think about arendt's idea that political lying isnt just hiding stuff but attacking the shared reality we depend on. im a backend dev who thinks in git and distributed systems, not philosophy. can you restate her argument about political lying -- especially the part where she distinguishes rational truth (like math) from factual truth (like events witnessed by people), says factual truth is coercive because it depends on testimony and plurality rather than reasoning, and claims the modern liar acts more like an actor trying to change reality than like someone just hiding a secret -- using only git vocabulary? like commits, force-pushes, rebasing shared history, immutable audit logs, merge conflicts, consensus protocols, etc. be honest: dont smuggle in arendt's human/plurality stuff by just calling it 'node consensus'. then give me the residue report -- what translates clean, what has to be distorted, and what has no git equivalent at all. and i want this committed, not a both-sides thing: take a definite position on whether the git analogy actually reveals why political lying is dangerous, or whether the residue (the part about human testimony, action, and the fragility of factual record) proves that the danger is exactly what git can't model. dont hedge. also definately tell me if my intuition that its all just "history rewriting" misses something she thinks is worse.
