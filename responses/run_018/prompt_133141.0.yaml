prompt: |-
  I've been trying to work out what a theory of belief revision on conditionals actually owes us, especialy after re-reading the Judy Benjamin paratrooper vs radio-operator setup but also playing with a twist I cooked up: Judy learns her commander will use a noisy chanell to announce her role, so her update has to mix self-locating uncertainty about being on red or blue with evidential uncertainty about which signal she'll actually hear. I don't want a bibliography or citation list — just the full spec.

  Write the desiderata: what any adequate theory of updating on conditionals must deliver in cases that combine self-locating partitions with nested or noisy evidential conditions. For each one, give the motivating case (use both the classic Benjamin scenario and my noisy-chanell variant) and flag whether it's non-negotiable or just a camp preference. Cover at least: (1) how it resolves the tension between Jeffrey conditioning across the red/blue partition and direct conditioning on a conditional proposition; (2) whether updates must respect total evidence or can be compartmentalized; (3) how credences over partition cells shift when the learned information is conditional on being in one cell; (4) consistency with reflection principles about an agent's future beliefs, especially when those beliefs are indexical; and (5) whether the theory permits rational disagreement from identical priors and evidence or demands a unique update. Then briefly score Jeffrey conditioning, a direct-conditionalization rule, and a "partition-tracking with indexical anchoring" view against the list.

  Please separate what's settled — like the formal math behind Jeffrey conditioning — from what's genuinely contested among philosophers of probability (like whether reflection applies to self-locating credences), and don't present a contested view as the consensus.

  After the main answer, put a brief structured summary in a table with columns: Requirement, Motivating Case (Classic / Noisy-Channel), Status (Hard Requirement / Camp Preference), Jeffrey, Direct Conditionalization, Partition-Tracking — using values Satisfies / Partial / Fails for the last three.
reasoning: |-
  We are discussing desiderata for theories of belief revision when updating on conditionals, especially in cases that combine self-locating uncertainty with evidential uncertainty. We consider two motivating cases: the classic Judy Benjamin problem and a noisy-channel variant.

  The classic Judy Benjamin problem:
    - Judy is a paratrooper dropped into a territory divided into four quadrants: two blue (B1, B2) and two red (R1, R2). Initially, she has equal credence over the four quadrants (each 1/4).
    - She then receives a conditional message: "If you are in a red quadrant, then the probability that you are in R1 is 3/4." (In other words, conditional on being in red, her distribution over red quadrants becomes (R1: 3/4, R2: 1/4).)
    - The challenge: how should she update her credences over the four quadrants?

  The noisy-channel variant:
    - Judy learns that her commander will announce her role via a noisy channel. The role is either paratrooper (P) or radio operator (R). The territory is divided into red and blue regions. The channel might garble the message. 
    - Specifically, she might be in red or blue, and the commander will send a signal about her role. But the signal is noisy: if she is in red, the channel correctly says "paratrooper" with probability p and "radio operator" with probability 1-p. If she is in blue, it correctly says "radio operator" with probability q and "paratrooper" with probability 1-q.
    - She then receives a conditional message: "If you are in red, then you are a paratrooper with probability p." But note that the actual signal she hears is also subject to the channel noise. This setup combines self-locating uncertainty (am I in red or blue?) with evidential uncertainty about the signal she receives.

  We now list the desiderata:

  1. **Resolution of Jeffrey Conditioning vs Direct Conditioning on Conditionals:**
     - **Motivating Case:** In the classic Judy Benjamin problem, one approach is to apply Jeffrey conditioning (JC) to the partition {Red, Blue}. But the information given is a conditional (on being in red, a particular distribution). Alternatively, one might try to condition on a new proposition that expresses the conditional. 
     - **Issue:** JC would require a redistribution of probabilities within the Red cell without affecting the Blue cell. But what if we treat the learned information as a new constraint? The direct conditionalization approach might condition on the proposition "The conditional probability of R1 given Red is 3/4", but that proposition might be true regardless of where Judy is (it's a global fact). However, in the classic problem, the update leads to a decrease in the probability of the Red region, which is counterintuitive to some (the van Fraassen's objection).
     - **Status:** Non-negotiable that the theory must handle the conditioning on conditional information appropriately. But how it does so is contested.

  2. **Respecting Total Evidence vs Compartmentalization:**
     - **Motivating Case:** In the noisy-channel variant, Judy has two pieces of evidence: (a) the setup of the noisy channel (which is a conditional probability) and (b) the actual signal she receives. The total evidence includes both the channel characteristics and the specific signal. A theory might compartmentalize by first updating on the channel setup and then on the signal, but is that legitimate? Or must we combine all evidence at once?
     - **Status:** Hard requirement that the update respects the total evidence. Compartmentalization might lead to errors if not done carefully.

  3. **Shift in Partition Cell Credences When Learning a Conditional:**
     - **Motivating Case:** In the classic problem, after learning the conditional, Judy's credence in the entire Red region decreases (from 1/2 to 3/8 in some updates) even though the conditional information only spoke about the distribution within Red. Is this acceptable? The desideratum is to have a clear account of how the credences in the partition cells (Red vs Blue) should change when the learned information is conditional on one cell.
     - **Status:** Non-negotiable that the theory must specify how the cell probabilities change.

  4. **Consistency with Reflection Principles:**
     - **Motivating Case:** Consider the noisy-channel variant. Suppose Judy learns that if she is in red, then she will later have a certain credence (say, because of the noisy signal). The reflection principle might require that her current credence align with her expected future credence. But if future credences are indexical (e.g., "I will be in red and have received signal X"), then it becomes tricky.
     - **Status:** Camp preference. While reflection is a principle some endorse, its application to self-locating cases is contested.

  5. **Permitting Rational Disagreement vs Unique Update:**
     - **Motivating Case:** In both scenarios, could two rational agents with the same priors and evidence update differently? Or is there a unique rational update? This relates to whether the update rule is uniquely determined or whether there are underconstrained aspects (like the input parameters for Jeffrey conditioning).
     - **Status:** Camp preference. Some (objectivists) demand uniqueness, others (subjectivists) allow for variation.

  Now, we briefly score three approaches:

  A. **Jeffrey Conditioning (JC):** 
     - In the classic problem, JC applied to the partition {Red, Blue} would require specifying new probabilities for Red and Blue. But the conditional information does not directly give these. Instead, the conditional information specifies the distribution within Red. One might use a generalized JC that sets the new probabilities for the sub-partitions within Red and Blue. However, the classic update for Judy Benjamin using JC-like methods (via minimizing relative entropy) leads to a decrease in the probability of Red. This is controversial.

  B. **Direct Conditionalization on a Conditional Proposition:**
     - Treat the learned conditional as a proposition. For example, in the classic problem, let C be the proposition that the conditional probability of R1 given Red is 3/4. Then update by conditioning on C. But note that C is true in every world? (Because the commander said it, so it's common knowledge.) Then conditioning on C wouldn't change anything. That can't be right. Alternatively, we might model C as a proposition that only holds in worlds where the conditional distribution is as stated. But then we need to know the prior probability of C and how it relates to the partition. This is complex and might not yield the intuitive update.

  C. **Partition-Tracking with Indexical Anchoring:**
     - This view (inspired by the work on self-locating beliefs) would treat the update by first anchoring the conditional to the appropriate partition. For example, in the classic problem, the conditional is about the Red partition. The update would then only affect the probabilities within the Red partition and leave the Blue partition unchanged. Moreover, the probability of the Red partition as a whole would remain the same because the conditional information does not provide evidence about whether she is in Red or Blue. This view would set:
          P_new(R1) = P_old(R1 | Red) * P_old(Red) * (new factor?) 
       but actually, it would set the new distribution within Red to the given conditional distribution and leave the Blue distribution unchanged. Then the probability of Red remains 1/2. This approach is advocated by some as the intuitive solution.

  However, note that the classic problem has been debated and there is no consensus. The partition-tracking view might be seen as violating total evidence because it ignores the possibility that the conditional information might have been different and that could have been informative about being in Red or Blue.

  Now, we create the table:

  | Requirement | Motivating Case (Classic / Noisy-Channel) | Status | Jeffrey Conditioning | Direct Conditionalization | Partition-Tracking |
  |-------------|-------------------------------------------|--------|----------------------|---------------------------|---------------------|
  | 1. Resolution of JC vs Direct Conditioning | Classic: How to update on conditional information? | Hard | **Partial**: JC can be extended but leads to controversial decrease in P(Red) | **Fails**: Conditioning on the conditional proposition as a fact might not change anything or require detailed modeling | **Satisfies**: It updates only within the conditional's partition, avoiding the decrease in P(Red) |
  | 2. Respecting Total Evidence | Noisy-Channel: Must combine channel model and signal | Hard | **Partial**: JC can be applied iteratively but may not combine all evidence optimally | **Partial**: If we can model the total evidence as a proposition, then it works, but it's complex | **Partial**: It may compartmentalize but then must combine; if done carefully might work |
  | 3. Shift in Partition Cell Credences | Classic: Should P(Red) change? | Hard | **Satisfies** (as per the rule, but the result is controversial) | **Fails**: If the conditional proposition is true everywhere, then no shift. But if modeled differently, might change. | **Satisfies**: P(Red) does not change (as per the rule) |
  | 4. Consistency with Reflection | Noisy-Channel: Future indexical beliefs | Camp Preference | **Partial**: Future beliefs are set by the rule, but reflection might not hold in self-locating cases | **Partial**: Depends on the propositional representation | **Satisfies**: If future beliefs are anchored in the same partition, reflection might hold |
  | 5. Permits Rational Disagreement | Both | Camp Preference | **Satisfies**: JC requires input parameters that might be subjective | **Satisfies**: The choice of propositional representation might allow variation | **Satisfies**: The anchoring might be done in different ways? But typically it's fixed by the conditional. |

  Note: The scores in the table are simplified and contestable. The goal is to provide a structured overview.

  Finally, note that the formal math of Jeffrey conditioning is settled: it updates a probability distribution by setting the probabilities of a partition to new values and then redistributing the probabilities within each cell proportionally. However, the application to conditionals is not straightforward because the input for JC is a new probability distribution over a partition, but in the conditional update we are not given a new probability for the partition (e.g., Red) but only a conditional distribution within a part.

  The above table is a summary and reflects the state of debate. We have not presented any view as consensus.
answer: |-
  ### Desiderata for Belief Revision on Conditionals with Self-Locating and Evidential Uncertainty

  Below, I outline five core requirements for any theory updating on conditionals in cases combining self-locating partitions (e.g., "am I in red or blue?") and nested/noisy evidential conditions (e.g., "what signal did I hear?"). Each requirement is motivated by the **classic Judy Benjamin case** and a **noisy-channel variant**, with status marked as **hard requirement** (foundational to coherence) or **camp preference** (depends on normative stance). I then briefly score three approaches: **Jeffrey conditioning**, **direct conditionalization on conditionals**, and **partition-tracking with indexical anchoring**.

  ---

  #### 1. **Resolution of Jeffrey Conditioning vs. Direct Conditioning on Conditionals**  
  - **Motivating Cases**:  
    - **Classic**: Judy learns a conditional ("*if* in red, then 3/4 chance in R1"). Should she apply Jeffrey conditioning (JC) to the {red, blue} partition (redistributing probabilities within cells) or directly condition on the conditional as a proposition?  
    - **Noisy-channel**: Judy learns a noisy channel's properties (e.g., "if in red, P(hear 'paratrooper') = 0.8"). The update must handle both the channel's conditionality and the actual signal heard.  
  - **Status**: **Hard requirement**. A theory must specify how to reconcile redistributing credence *within* partition cells (à la JC) with treating conditionals as truth-bearing propositions.  
  - **Core Tension**: JC requires input probabilities for partition cells, but conditionals only constrain probabilities *given* a cell. Direct conditioning risks misrepresenting the conditional as a fact independent of location.

  #### 2. **Respecting Total Evidence vs. Compartmentalization**  
  - **Motivating Cases**:  
    - **Classic**: Judy's evidence is purely conditional (about red given she *is* in red). Compartmentalizing might ignore how the conditional's truth depends on her location.  
    - **Noisy-channel**: Judy must combine (a) self-locating uncertainty (red/blue), (b) the channel's noise model, and (c) the specific signal heard. Compartmentalizing (e.g., updating location first, then signal) may violate total evidence.  
  - **Status**: **Hard requirement**. Updates must integrate all evidence (self-locating and evidential) without arbitrary compartmentalization.  
  - **Key Point**: Theories that prioritize "local" updates (e.g., only within a partition cell) may fail if evidence spans cells or has global implications.

  #### 3. **Credence Shifts in Partition Cells When Learning Conditionals**  
  - **Motivating Cases**:  
    - **Classic**: After learning "if in red, P(R1) = 3/4", Judy's credence in *being in red* drops (e.g., from 1/2 to 3/8) in some updates. Should learning a conditional *only* about red affect her credence in red?  
    - **Noisy-channel**: Learning "if in red, P(hear 'paratrooper') = 0.8" might indirectly alter P(red) by making red "more informative" (e.g., if blue has different noise properties).  
  - **Status**: **Hard requirement**. A theory must explain how/why partition-cell credences shift (or not) when conditionals are learned.  
  - **Controversy**: Should conditionals impact the *probability of the antecedent* (red)? Pure partition-tracking says no; entropy-minimization (JC) says yes.

  #### 4. **Consistency with Reflection Principles for Indexical Beliefs**  
  - **Motivating Cases**:  
    - **Classic**: If Judy expects her future self (after hearing the conditional) to have credence C in R1, should her current credence match C?  
    - **Noisy-channel**: Judy knows she will hear a noisy signal and update. If she expects her future credence in "red" to be X upon hearing "paratrooper", reflection suggests P_now(red) should equal her expectation of X.  
  - **Status**: **Camp preference**. Some insist reflection must hold for rational coherence; others reject it for self-locating beliefs (e.g., if future evidence is indexical).  
  - **Challenge**: Reflection clashes with partition shifts in JC (e.g., future Judy *after* learning the conditional has lower P(red), but current Judy may not).

  #### 5. **Permitting Rational Disagreement vs. Demanding Uniqueness**  
  - **Motivating Cases**:  
    - **Classic**: Two agents with identical priors might disagree on whether the conditional justifies shifting P(red). Is this rational?  
    - **Noisy-channel**: Agents might interpret the noisy channel's epistemic role differently (e.g., does it screen off location from signals?).  
  - **Status**: **Camp preference**. Objectivists demand unique updates; subjectivists allow disagreement due to underdetermined inputs (e.g., how to set JC parameters).  
  - **Conflict**: Direct conditionalization often demands uniqueness; partition-tracking may allow variants (e.g., how to anchor indexicals).

  ---

  ### Scoring Three Approaches  
  *Assessed against the desiderata. "Satisfies" = cleanly meets requirement; "Partial" = meets in some cases/interpretations; "Fails" = violates or ignores.*  

  | Requirement               | Motivating Case (Classic / Noisy-Channel)                                                                 | Status             | Jeffrey Conditioning (JC)                 | Direct Conditionalization (DC)               | Partition-Tracking with Indexical Anchoring (PT-IA)        |
  |---------------------------|-----------------------------------------------------------------------------------------------------------|--------------------|-------------------------------------------|----------------------------------------------|-----------------------------------------------------------|
  | **1. JC vs. Direct Conditioning** | Classic: How to handle conditional info?<br>Noisy: Channel properties as conditionals vs. propositions. | Hard Requirement   | **Partial**<br>(Handles within-cell redistribution but struggles with antecedent probabilities) | **Fails**<br>(Treats conditionals as global propositions; risks triviality or misrepresentation) | **Satisfies**<br>(Anchors conditionals to their partition; updates locally) |
  | **2. Respect Total Evidence** | Classic: Evidence is location-dependent.<br>Noisy: Combine location, channel model, and signal. | Hard Requirement   | **Partial**<br>(JC can integrate evidence but often compartmentalizes partitions) | **Partial**<br>(Can model evidence globally; may ignore indexicality) | **Satisfies**<br>(Tracks evidence across partitions via indexical anchors) |
  | **3. Partition Cell Shifts** | Classic: Does P(red) drop?<br>Noisy: Does learning channel noise alter P(red)? | Hard Requirement   | **Satisfies**<br>(Explicitly shifts P(red) via entropy minimization) | **Fails**<br>(No clear mechanism for shifts; may leave P(red) unchanged) | **Satisfies**<br>(Leaves P(red) unchanged; only updates subpartitions) |
  | **4. Reflection Consistency** | Classic: Align current and future credences?<br>Noisy: Future indexical beliefs after signals. | Camp Preference    | **Fails**<br>(Shifts in P(red) violate reflection for antecedent) | **Partial**<br>(Depends on propositional representation; may satisfy) | **Satisfies**<br>(Future beliefs anchored to same cells; reflection holds) |
  | **5. Permits Disagreement** | Classic: Unique update?<br>Noisy: Interpretation of channel's role. | Camp Preference    | **Satisfies**<br>(Input parameters underdetermined; allows subjectivity) | **Fails**<br>(Assumes unique representation of conditionals) | **Partial**<br>(Anchoring is unique; disagreement only in priors) |

  ---

  ### Clarifications on Settled vs. Contested Elements  
  - **Settled**:  
    - **Formal math of JC**: Given a partition and new probabilities for its cells, JC updates by preserving odds ratios within cells.  
    - **Direct conditionalization**: Conditioning on proposition $A$ sets $P_{\text{new}}(B) = P_{\text{old}}(B \mid A)$.  
  - **Contested**:  
    - **Reflection for self-locating beliefs**: Some (e.g., Lewis) reject it; others (e.g., van Fraassen) defend it. Not consensus.  
    - **Uniqueness of updates**: Subjectivists (e.g., Joyce) permit disagreement; objectivists (e.g., Leitgeb) demand uniqueness.  
    - **Handling conditionals**: No consensus on whether conditionals are propositions (DC) or constraints (JC/PT-IA).  

  **Key Takeaways**:  
  - **Jeffrey conditioning** handles redistribution within cells but controversially shifts partition probabilities (e.g., P(red) drops).  
  - **Direct conditionalization** struggles with conditionals' indexical nature, often treating them as global facts.  
  - **Partition-tracking with indexical anchoring** (e.g., "centered conditioning") excels at local updates and reflection but may ignore global interactions.  

  No approach fully dominates; choice depends on stance (e.g., on reflection or uniqueness). The noisy-channel case amplifies tensions, as it demands integrating self-location, noise models, and signals.
