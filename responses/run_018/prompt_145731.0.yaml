prompt: |-
  I run a 90-minute workshop for twelve advanced undergraduates in moral philosophy. They understand the standard duty/supererogation distinction but tend to treat supererogation as simply “very good but optional” acts whose status is intrinsic to the act or agent. I want them to feel the instability of that boundary under a specific framing: whether an act counts as going beyond duty depends partly on a distributed, partly hidden comparison class of peer behavior — a social baseline that is not transparent to any individual agent and can shift as group behavior changes.

  Design a structured simulation or deliberation game with explicit rules, assigned roles, hidden information cards, and small real stakes (for example, pooled points that determine a shared reward or a public prestige ranking with minor consequences). The mechanics should unfold in three phases: first, participants classify a set of actions as obligatory or supererogatory using only individual judgment; second, hidden peer-baseline cards are revealed, showing that the same actions are reclassified by the group once the comparison class is visible; third, participants can alter group behavior in a second round, which in turn shifts the baseline and forces further reclassification. The rules and incentives should be arranged so that participants run into the reversal themselves before the facilitator names it.

  Then provide a debrief that maps each phase onto the conceptual claim about the relational, baseline-dependent nature of supererogation; predicts what will predictably go wrong the first time the workshop is run (for instance, participants refusing to update classifications or treating the hidden information as irrelevant); and is explicit about which feature of the view — likely the normative authority of the hidden baseline rather than its descriptive presence — the activity cannot reproduce and must be supplied by direct discussion. Keep everything runnable without technology beyond paper and cards, and do not include any bibliography or citation request.
reasoning: |-
  We are designing a workshop simulation with three phases. The goal is to demonstrate that the classification of an action as obligatory or supererogatory depends on a social baseline of peer behavior that is distributed and hidden.

  **Structure:**
  - 12 participants.
  - Duration: 90 minutes.

  **Materials:**
  - Paper and pens for each participant.
  - A set of action cards (one per participant) for Phase 1 and Phase 2. Each card describes an action in a moral scenario.
  - Hidden peer-baseline cards for Phase 2. These will be distributed in Phase 2 and reveal the group's behavior (which actions were actually performed by the group in a hypothetical scenario).
  - A scoreboard (poster paper) to track points and a public prestige ranking (if using).
  - Tokens or chips to represent points (optional, can just use paper tracking).

  **Reward structure:**
  We'll use pooled points that determine a shared reward (e.g., if the group reaches a certain point threshold, everyone gets a small reward like candy or extra credit points). Alternatively, we can have a public prestige ranking with minor consequences (e.g., the top 3 get a small reward). To keep it low stakes, we can use both: a shared reward if the group reaches a threshold and individual recognition for top contributors.

  **Phases:**

  **Phase 1: Individual Classification (15 minutes)**
  - Each participant receives an **action card** describing a specific action in a moral scenario (e.g., "Donate 5% of your monthly income to charity", "Volunteer 2 hours per week at a homeless shelter", etc.). The actions should be ones that could be seen as either obligatory or supererogatory depending on context.
  - Each participant classifies their own action as either **Obligatory (O)** or **Supererogatory (S)** and writes this on their card. They also note their reason.
  - Then, they are told that they will get points based on how they classify and whether they perform the action (as per the hidden baseline). But note: at this stage, they don't know the baseline.

  **Scoring for Phase 1 (to be explained at the start):**
  - Each participant must decide whether to "perform" the action on their card (they are free to choose) and whether to classify it as O or S.
  - Points are awarded as follows:
    - If you classify an action as Obligatory and you perform it: +5 points.
    - If you classify an action as Obligatory and you do not perform it: -10 points (because you failed a duty).
    - If you classify an action as Supererogatory and you perform it: +10 points (extra credit for going beyond).
    - If you classify an action as Supererogatory and you do not perform it: 0 points (no penalty because it's optional).

  But note: the catch is that the classification of the action as O or S is supposed to depend on the social baseline, which they don't know yet. So they are forced to make an individual judgment without knowing the baseline.

  **Phase 2: Reveal Baseline and Reclassify (25 minutes)**
  - The facilitator collects the initial classifications and performance decisions (but not the reasons).
  - Then, each participant receives a **hidden peer-baseline card**. This card reveals the group's behavior in a hypothetical scenario (which we will fabricate for the simulation). For example: "In your group, 8 out of 12 participants performed an action similar to yours (donating 5% of income)." The baseline card also gives the group's average performance for that type of action (but without revealing individual identities). 

  - Now, the facilitator explains that the initial baseline (which was hidden) has been revealed. Participants are told that the initial classifications they made were based on their own judgment, but now they must reclassify the same action (or a similar one) in light of the baseline. They are given a new action card (or the same one) but with the instruction to consider the baseline.

  - Each participant reclassifies their action (as O or S) and decides again whether to perform it (for a second round). However, this time they know the baseline.

  - **Scoring for Phase 2:** The same scoring system applies, but now they are making a new decision with the baseline information.

  **Phase 3: Shift the Baseline and Reclassify Again (25 minutes)**
  - The facilitator collects the Phase 2 classifications and performance decisions.
  - The facilitator then reveals the group's performance in Phase 2: how many people performed each type of action? This becomes the new baseline.
  - Participants are told that the baseline has shifted (because the group behavior in Phase 2 has changed) and they must now reclassify the same action again for a third time (with the new baseline) and decide whether to perform it in a third round.

  - **Scoring for Phase 3:** Same as before.

  **Final Scoring and Ranking (5 minutes)**
  - The facilitator totals the points for each participant (sum of points from Phase 1, 2, and 3).
  - The group's total points are calculated (for the shared reward) and individual rankings are made (for prestige).

  **Debrief (20 minutes)**
  - The facilitator leads a discussion mapping the phases to the conceptual claim.

  **Design of Action Cards:**
  We need 12 action cards. Each card has:
  - A description of an action (e.g., "Donate 5% of your monthly income to charity").
  - In Phase 1, the participant classifies it (O/S) and decides to perform or not.
  - In Phase 2, the same action is considered but with a baseline card that says, for example: "In the initial baseline scenario, 8 out of 12 peers performed a similar donation (5%)."
  - In Phase 3, the baseline is updated to the group's actual Phase 2 performance.

  To make it work, we need to have the same type of action for multiple people? Or we can have different actions? We can group actions into categories (e.g., donation of money, donation of time, etc.) and assign the same category to multiple participants. Then the baseline card for that category is given.

  Alternatively, we can have 4 types of actions (with 3 participants each). Then we can have baseline information per type.

  **Example Action Types:**
  1. Donation: 5% of monthly income to charity.
  2. Volunteering: 2 hours per week at a homeless shelter.
  3. Environmental: Going car-free for a month.
  4. Academic: Spending 5 extra hours per week to mentor a struggling student.

  Each type has 3 participants. In Phase 2, each participant in a type gets the same baseline card for that type (e.g., for donation: "In the initial baseline, 2 out of 3 of your peers in the donation group performed the action." But note: we are fabricating an initial baseline. We might set it arbitrarily to show variation.

  **Fabricated Initial Baseline:**
  We set the initial baseline (for the hidden cards) to vary by type. For example:
  - Type 1 (Donation): 2 out of 3 performed (so majority did it) -> might push towards obligation?
  - Type 2 (Volunteering): 1 out of 3 performed -> might be supererogatory?
  - Type 3 (Environmental): 0 out of 3 performed -> supererogatory?
  - Type 4 (Academic): 3 out of 3 performed -> obligation?

  But note: we have 3 participants per type, so the baseline card for each participant in a type will say: "In the initial baseline scenario, [X] out of 3 peers in your action group performed the same kind of action."

  **How the baseline shifts:**
  In Phase 2, participants decide whether to perform the action (with the baseline info). Then we compute the new performance for each type (for the 3 people in that type). Then in Phase 3, we reveal that new baseline and they decide again.

  **Scoring Example for One Participant:**
  - Phase 1: They classify and decide. E.g., they have a donation card. They classify as O and perform: +5. If they classify as O and don't perform: -10. If S and perform: +10. If S and don't: 0.
  - Phase 2: They get the baseline (for donation: 2/3 performed). They reclassify and decide again. Same scoring.
  - Phase 3: They get the new baseline (the actual performance of the donation group in Phase 2). Then they decide again.

  **Implementation note:** We need to make sure that the baseline for Phase 3 is computed from Phase 2. So the facilitator must quickly tally the performance by type after Phase 2.

  **Rules for Classification:**
  Participants are told that they should classify the action as they see it in light of the information they have (including the baseline when available). They are free to use their own judgment but are reminded that the baseline is a factor.

  **Incentive structure:** The scoring system is designed so that if an action is considered obligatory, then not doing it is heavily penalized. If it's supererogatory, then doing it gets a bonus. But note: the classification is done by the participant. However, the baseline might influence what they think they can get away with. But the point is to see that their classification might change with the baseline.

  **Expected Issue:** Participants might not update their classification because they think the baseline is irrelevant. Or they might try to game the system by always classifying as S to avoid penalties (but then if they don't do it, they get 0, which is safe, but if they do it, they get +10). Alternatively, if they think an action is really obligatory, they might classify as O and do it to get +5, but if they classify as O and then don't do it, they get -10. So the risk of classifying as O is higher.

  **Debrief Structure:**
  1. **Map the phases:**
     - Phase 1: Individual judgment without knowledge of peer behavior. This reflects how we often make moral judgments in isolation, assuming the boundary is intrinsic.
     - Phase 2: Revealing the hidden baseline shows that the same action might be reclassified when we see what others are doing. This creates an awareness of the comparison class.
     - Phase 3: The baseline shifts because the group's behavior changes (due to the decisions in Phase 2). This shows that the boundary is not fixed but moves with the group.

  2. **Conceptual claim:** Supererogation is not just about the act or the agent but about the act relative to a social baseline. The boundary is relational and context-dependent.

  3. **Predictable problems:**
     - Participants might resist updating their classification in Phase 2 and 3, sticking to their initial judgment.
     - They might treat the baseline as irrelevant to the moral status, only relevant for strategic scoring.
     - They might not internalize the baseline as having normative authority (it's just descriptive).

  4. **Limitation of the activity:** The simulation shows that the baseline is a descriptive fact that influences judgments, but it does not establish that the baseline *should* have normative authority. The facilitator must note that in real moral reasoning, the baseline might be seen as having normative force (e.g., because it sets reasonable expectations) or it might not. This normative aspect must be discussed separately.

  **Step-by-Step Workshop Plan:**

  1. **Introduction (5 minutes):** Explain the duty/supererogation distinction. Explain the simulation and the scoring. Assign action types randomly (each participant gets one action card). They do not know who has the same type.

  2. **Phase 1 (15 minutes):** 
     - Participants read their action card. 
     - They classify the action (O/S) and decide whether to perform it (yes/no). 
     - They write their choice and reason on a sheet (which they keep private) and then report only the classification and performance decision to the facilitator (on a slip).

  3. **Facilitator collects Phase 1 decisions and tallies the performance by type (for the fabricated baseline in Phase 2, we don't use the real Phase 1 performance? We use a pre-set baseline).** 

     Important: For the hidden baseline in Phase 2, we are not using the actual Phase 1 performance because that would be circular. Instead, we fabricate an initial baseline for the purpose of the simulation. We want to show that the same action can be classified differently depending on the baseline we set.

     So we have pre-set baselines for each action type (as above). We prepare the hidden baseline cards in advance.

  4. **Phase 2 (25 minutes):**
     - Distribute the hidden baseline cards (each participant gets one for their action type).
     - Participants now reclassify the same action (O/S) and decide again whether to perform it (for round 2).
     - They report their decision.

  5. **Facilitator tallies the performance for each type in Phase 2. This becomes the baseline for Phase 3.**

  6. **Phase 3 (25 minutes):**
     - Reveal the new baseline for each type (e.g., "In your action group, X out of 3 performed the action in the last round").
     - Participants reclassify and decide again (round 3) and report.

  7. **Scoring (5 minutes):** The facilitator calculates the points for each participant and for the group. Announces the group total (for shared reward) and individual rankings.

  8. **Debrief (20 minutes):** Structured as above.

  **Materials Preparation:**
  - 12 action cards (3 for each of 4 types). Each card has the action description.
  - 4 types of baseline cards (for Phase 2): one for each type, with the pre-set baseline (e.g., for donation: "In the initial baseline scenario, 2 out of 3 peers in your action group (donation) performed the same kind of action."). We prepare 3 copies of each type's baseline card (so each participant in a type gets the same baseline card).
  - For Phase 3, the facilitator will write the new baseline on the board per type after Phase 2.

  **Scoring Calculation:**
  Each participant has three rounds. They get:
  - Round 1: Points based on their classification and performance in Phase 1.
  - Round 2: Points from Phase 2.
  - Round 3: Points from Phase 3.

  Total points = sum.

  **Example Action Card (Donation type):**
  "Your action: Donate 5% of your monthly income to a charity of your choice."

  **Example Baseline Card for Donation (for Phase 2):**
  "Initial Baseline Information: In a previous scenario, 2 out of 3 members of your action group (donation) performed a similar action (donated 5% of their monthly income to charity)."

  **Phase 3 Baseline Announcement:**
  After Phase 2, the facilitator writes on the board:
  - Donation group: [X] out of 3 performed the action in Phase 2.
  - Volunteering group: [Y] out of 3 ...
  - etc.

  **Note on Realism:** The actions should be plausible and of comparable moral weight. We are not trying to trick participants but to show how context matters.

  **Predicted Participant Behavior:**
  - In Phase 1, without baseline, participants may vary in classification (some might think donating 5% is obligatory, others supererogatory).
  - In Phase 2, with the baseline, those in a group where the baseline is high (e.g., 3/3 performed) might feel pressure to classify as obligatory and perform. Those with a low baseline might classify as supererogatory and feel free not to perform without penalty.
  - In Phase 3, if the baseline shifts (say, in a group that had 3/3 in the initial baseline but then in Phase 2 only 1/3 performed), then participants might reclassify the action as supererogatory.

  The key moment is when an action that was initially classified as supererogatory becomes obligatory because the baseline is high, or vice versa.

  **Debrief Points:**
  - The boundary between duty and supererogation is not fixed by the intrinsic features of the act but is sensitive to the social context (what peers do).
  - This creates instability: if enough people start doing a supererogatory act, it can become obligatory (and vice versa).
  - The hidden baseline is a metaphor for how we often don't know what others are doing, so we misclassify.
  - The simulation cannot show that the baseline *should* have normative authority. It only shows that it does influence judgments. We must discuss: does the fact that many people do something make it obligatory? Or is it merely a descriptive fact?

  This design should fit within 90 minutes and uses only paper and cards.
answer: |-
  ### Workshop Design: "The Shifting Line: Supererogation and Social Baselines"

  **Overview:** A 90-minute, paper-based simulation with 12 participants. The game uses action classification, hidden peer-behavior data, and point-based incentives to demonstrate how the duty/supererogation boundary depends on a shifting social baseline. Participants earn points (pooled for a shared reward, e.g., snacks) and individual rankings (minor prestige, e.g., "Moral Luminary" certificates).

  ---

  ### **Materials**
  - **Action Cards (12):** Each describes a morally significant act (see examples below).
  - **Baseline Cards (12):** Hidden cards revealing peer behavior (pre-set by facilitator).
  - **Decision Sheets:** For recording classifications (O/S) and performance choices.
  - **Scoreboard:** Publicly tracks group points and individual rankings.
  - **Tokens:** Represent points (e.g., poker chips; 1 token = 1 point).
  - **Shared Reward:** Requires 250+ group points (e.g., gourmet cookies). Top 3 scorers get "prestige" perks (e.g., choosing discussion topics).

  ---

  ### **Phase 1: Individual Classification (20 min)**
  **Goal:** Classify actions using personal judgment, ignoring peers.  
  **Rules:**  
  1. Each participant draws one **Action Card** (e.g., "Donate 5% of monthly income to charity").  
  2. They classify it as **Obligatory (O)** or **Supererogatory (S)** and decide whether to "perform" it (yes/no).  
  3. **Scoring:**  
     - O + perform: **+5 points**  
     - O + not perform: **−10 points**  
     - S + perform: **+10 points**  
     - S + not perform: **0 points**  

  **Action Card Examples (mix to avoid bias):**  
  - "Volunteer 2 hrs/week at a homeless shelter."  
  - "Adopt a rescue dog instead of buying from a breeder."  
  - "Cover a colleague’s urgent work shift (losing your free evening)."  
  - "Publicly confront a friend’s racist comment at a party."  

  **Facilitator Role:**  
  - Collect decisions secretly. Announce group point total (but not individual scores).

  ---

  ### **Phase 2: Baseline Reveal & Reclassification (25 min)**  
  **Goal:** Reclassify the same actions after seeing peer-behavior data.  
  **Rules:**  
  1. Distribute **Baseline Cards** (pre-set by facilitator; participants don’t see others’ cards). Each card states:  
     *"In your peer group, X of 12 people performed this type of act last month."*  
     - **Vary X:** Some cards show high compliance (e.g., 10/12), others low (e.g., 2/12).  
  2. Participants reclassify their **same action** (O/S) and decide whether to perform it again.  
  3. **Scoring:** Same as Phase 1.  

  **Key Twist:**  
  - Baseline Cards imply a *descriptive norm* (e.g., "Only 2 peers donated" suggests the act is rare).  
  - Incentive: Classifying as S avoids penalties (−10 for failing O) if they skip the act.  

  **Facilitator Role:**  
  - Update the scoreboard with new points.  

  ---

  ### **Phase 3: Baseline Shift & Final Reclassification (25 min)**  
  **Goal:** Alter behavior to shift the baseline, forcing reclassification.  
  **Rules:**  
  1. **Public Baseline Shift:** Facilitator reveals the **actual group performance** from Phase 2 (e.g., "6/12 performed their acts").  
  2. Participants classify their action **a third time** (O/S) and decide whether to perform it.  
  3. **Scoring:** Same as before.  
  4. **Final Tally:** Sum points across all phases. Group wins shared reward at 250+ points. Top 3 scorers ranked publicly.  

  **Key Mechanic:**  
  - If most performed the act in Phase 2, the baseline "shifts" toward duty (e.g., donating becomes normal).  
  - Participants may now classify previously "supererogatory" acts as obligatory.  

  ---

  ### **Predicted Participant Behavior & Pitfalls**  
  - **Phase 1:** Participants treat O/S as intrinsic (e.g., "Donating is *always* supererogatory").  
  - **Phase 2:** Some ignore baseline cards ("Peers don’t affect morality") or exploit scoring (classify everything as S to avoid −10 penalties).  
  - **Phase 3:** Resistance to reclassify ("My view hasn’t changed!"). Few may "game" the system by performing easy acts for +10 points.  
  - **Critical Pitfall:** Confusing *descriptive* baselines (what peers do) with *normative* authority (what they *should* do).  

  ---

  ### **Debrief (20 min)**  
  **Map Phases to Concepts:**  
  1. **Phase 1 = Intrinsic View:** "You judged acts in isolation, assuming O/S is fixed. But moral classification isn’t atomistic—it’s relational."  
  2. **Phase 2 = Hidden Baseline:** "The peer data revealed a *comparison class*. Did seeing low compliance make acts feel more supererogatory? High compliance more obligatory? This shows the boundary is socially embedded."  
  3. **Phase 3 = Boundary Instability:** "When you altered your behavior, you shifted the baseline. Acts that were supererogatory became 'normal' and felt closer to duty. Supererogation isn’t static—it’s dynamic and collectively determined."  

  **Address Pitfalls:**  
  - "Some of you refused to update classifications—this mirrors real-world resistance! We anchor to initial judgments, ignoring social context."  
  - "You treated baselines as strategic tools (e.g., avoiding penalties) but not morally authoritative. This highlights the simulation’s **key limitation**: It shows how baselines *influence* us, but not why they *should*. We must discuss: *Does common practice make something obligatory? Or is the baseline just a heuristic?*"  

  **Bridge to Theory:**  
  - "Supererogation isn’t just ‘very good but optional’—it’s defined *against* a backdrop of peer behavior. If everyone donates 5%, not donating may become a failure of duty. If no one does, donating is heroic. This boundary is unstable, partly hidden, and shaped by us."  

  ---

  ### **Logistical Notes**  
  - **Timing:** Stick to 20/25/25 min phases; use a timer.  
  - **Action Cards:** Use clear, neutral language (no emotionally loaded acts).  
  - **Baseline Cards:** Pre-set distributions (e.g., 4 cards with "2/12 peers," 4 with "8/12," 4 with "5/12").  
  - **No Tech Needed:** Track points/rankings on a poster-paper scoreboard.  
  - **Incentives:** Low-stakes rewards (e.g., snacks, certificates) to motivate engagement without pressure.  

  This design forces participants to confront the instability of the O/S boundary through lived experience, setting up a rich debate about the social dimensions of supererogation.
