prompt: |-
  I am a software engineer at a mid-sized company whose consumer app has a large user base, and I have no formal background in philosophy. Several times a quarter I get drawn into product decisions with an ethical dimension: engagement features that may become compulsive, data collection and sharing, what we build for which customers, and how our analytics might be used downstream. These decisions are made quickly, by a product team with no ethical expertise, and my written recommendation carries weight with the product director who signs off. I want a reusable decision procedure, grounded in the idea of moral uncertainty, that I can run in an afternoon before I write that recommendation.

  I only half understand the underlying theory, so let me set out what I take it to say. When someone is genuinely unsure which moral view is right, it is a mistake to pick whichever view seems most likely and then judge the decision only by that view. Instead one should treat the plausible moral views as if each might be the correct one, weight them by how much confidence one has in them, and choose the option that does best in expectation across all of them; a philosopher friend calls this maximising expected choiceworthiness. I have also been warned that the approach has known snags: different moral theories value different things in different units, so combining them can be like adding sums in different currencies without exchange rates; a tiny probability of an enormous outcome can dominate the whole calculation if taken literally; and the list of possible moral views is open-ended, so any calculation ignores an unknown number of candidates. I am not asking for a procedure that dissolves those snags. I am asking for one that acknowledges them and tells me what to do when they bite.

  Please write the procedure for me: the questions to ask in order, what counts as a sufficient answer to each question, where the procedure stops with a no, where it hands the decision to a human being because the question is one of values rather than facts, and which steps cannot be made mechanical without falsifying the underlying idea. Then run the procedure on three cases. The first case is a proposal to add a streak and time-limited reward system to our app; some users say it helps them sustain habits they want, while a substantial minority report feeling unable to stop, and our data shows the feature would substantially raise daily active use, which is the metric the product team is judged on. The second case is a proposal to sell de-identified location histories to a data broker for significant recurring revenue; the de-identification is good but not bulletproof, and the broker's clients include employers and insurers. The third case is a request from a large corporate customer to adapt our internal productivity-analytics tool into a product that scores individual employees' activity for managers to use in performance reviews and redundancy decisions; the revenue would fund our team for a year. Run the procedure honestly on all three, and when the answer is one I will not like on commercial grounds, say so plainly rather than softening it. Finally, say what the procedure cannot do, and which sorts of decisions it will misclassify or leave undecided.

  Please write the whole answer in continuous prose, the way one would write an email or a letter: no headings, bullet points, bold text, or tables.
reasoning: |-
  Okay, let me approach this systematically. The user is a software engineer facing ethical decisions in product development without philosophical training. They need a practical framework grounded in moral uncertainty theory that can be applied quickly in real-world business contexts. 

  First, I need to understand their core requirements: they want a reusable procedure that acknowledges but doesn't solve the inherent problems of moral uncertainty (incommensurable values, tiny probability domination, open-ended theories). The framework must be actionable within an afternoon and provide clear stopping points where human judgment is needed.

  I recall their three key examples: engagement features with compulsion risks, selling de-identified location data, and employee monitoring tools. Each represents classic tech ethics dilemmas around autonomy, privacy, and power asymmetry. The user explicitly wants honest outcomes even when commercially unfavorable - this signals their genuine ethical concern beyond compliance.

  The moral uncertainty approach seems appropriate here. But I should consider its limitations upfront: it's not a substitute for thorough ethical review, can't resolve fundamental value conflicts, and may oversimplify complex stakeholder impacts. The challenge is making it practical while preserving philosophical integrity.

  For the procedure itself, I'm considering these phases: 
  First, clearly defining the decision and options. Then identifying plausible moral frameworks relevant to tech (consequentialism, deontology, virtue ethics seem essential; contractualism may help with power imbalances). Next comes estimating confidence weights - this is unavoidably subjective but the user already makes such judgments implicitly. 

  The valuation step is trickiest. I'll suggest rough qualitative scales rather than false precision. For incommensurability, I'll emphasize comparative judgments within frameworks. The tiny probability problem needs a practical filter - perhaps ignoring probabilities below a reasonable threshold like 1% unless catastrophic. 

  When applying to cases, I'll need to: 
  For streaks - balance autonomy benefits against coercion risks across frameworks. 
  For data sales - weigh revenue against re-identification risks and downstream harms. 
  For employee scoring - confront the commodification of human activity versus team survival. 

  The output must flag commercially uncomfortable truths directly, as requested. Finally, I should clarify what the procedure can't do: handle entirely novel dilemmas, replace stakeholder consultation, or absolve personal responsibility. It's a decision-aid, not an algorithm.
answer: |-
  I appreciate you reaching out about this—it's heartening to see engineers proactively grappling with the ethical weight of product decisions, especially under time pressure and without specialized training. The framework you’re describing—maximizing expected choiceworthiness under moral uncertainty—is indeed a robust starting point, warts and all. Below is a reusable procedure tailored to your constraints: it acknowledges the snags you mentioned, requires minimal philosophical expertise, fits within an afternoon, and explicitly flags when subjectivity or commercial discomfort must override mechanical calculation. I’ll then apply it to your three cases candidly, and close with its limitations.  

  ### The Procedure  
  Start by defining the **decision** and **options** (e.g., "Build Feature X? Yes/No/Modify"). Then, ask:  

  1. **What plausible moral views could meaningfully assess this?** *Sufficient answer*: 3–5 major theories (e.g., utilitarianism, deontology, virtue ethics, contractualism) that aren’t redundant. If you can’t name distinct views, consult a primer or colleague briefly—but don’t overthink. *Stop if* no theory seems relevant (rare; most decisions implicate harm, autonomy, justice).  
  2. **How confident am I in each view?** *Sufficient answer*: Assign rough probabilities (e.g., Utilitarianism: 40%, Deontology: 30%, ...) summing to 100%. Use intuition; it’s your genuine uncertainty. *Stop if* you realize one view dominates (>90% confidence)—follow it.  
  3. **How does each option score under each view?** *Sufficient answer*: Qualitative ranks (e.g., "Bad/Neutral/Good") or rough scores (-5 to +5). Focus on material impacts: who benefits/harms, autonomy violations, fairness, unintended consequences. *Hand to human if* scoring feels arbitrary (e.g., theories value "autonomy" differently). *Acknowledge snags here*: Scores are incommensurable "currencies." Mitigate by using ranks, not numbers.  
  4. **Calculate expected choiceworthiness**: Multiply each option’s score per view by your confidence probability, sum across views. *Acknowledge snags*: A "tiny probability of enormous outcome" (e.g., 1% chance of existential risk) could skew results. If detected, cap extreme scores (e.g., "No outcome exceeds +10/-10").  
  5. **Check for overlooked theories or stakeholders**: Spend 10 minutes asking: "Whose voice is missing? What theory might condemn this that I’ve ignored?" If new insights arise, loop to step 1.  
  6. **Decide**: Pick the option with the highest sum. If scores tie or cluster, default to the *status quo* or *least risky change*. If the result feels deeply wrong, *override mechanically*—your intuition may detect snags like incomplete theories.  

  The procedure stops with a "no" if an option scores negatively *across all major views* or if expected harm (negative sum) outweighs benefits. It defers to human judgment when scoring clashes irreconcilably (e.g., "This maximises utility but violates consent") or when probabilities/scores are pure guesses.  

  ### Case Applications  
  **Case 1: Streak & Time-Limited Rewards**  
  - *Views*: Utilitarianism (weights overall happiness), Deontology (rules: e.g., "don’t manipulate"), Autonomy-focused views.  
  - *Confidence*: Utilitarianism 50% (common in business), Deontology 30%, Autonomy 20%.  
  - *Scores*:  
    - Utilitarianism: Build (+3: helps majority, DAU ↑; but subtract -1 for minority harm). Net +2.  
    - Deontology: Build (-2: exploits psychology; Don’t Build: 0).  
    - Autonomy: Build (-3: users report compulsion; undermines self-control).  
  - *Expected Choiceworthiness*: Build = (0.5×2) + (0.3×-2) + (0.2×-3) = 1 - 0.6 - 0.6 = **-0.2**. Don’t Build = 0.  
  - *Verdict*: **Do not build** as-is. Expected harm outweighs benefit. Modify to add compulsive-use safeguards (e.g., mandatory breaks, clear off-ramps) and re-run.  

  **Case 2: Sell De-identified Location Data**  
  - *Views*: Utilitarianism, Contractualism (would users consent?), Rights-based (privacy as fundamental right).  
  - *Confidence*: Utilitarianism 40%, Contractualism 40%, Rights 20%.  
  - *Scores*:  
    - Utilitarianism: Sell (+4: revenue funds innovation; -3 if re-identified). Net +1 (you judge re-ID risk low).  
    - Contractualism: Sell (-4: users wouldn’t consent to insurers/employers accessing data).  
    - Rights: Sell (-5: violates privacy even if de-identified).  
  - *Expected Choiceworthiness*: Sell = (0.4×1) + (0.4×-4) + (0.2×-5) = 0.4 - 1.6 - 1 = **-2.2**. Don’t Sell = 0.  
  - *Verdict*: **Do not sell**. A "no" you’ll dislike—recurring revenue is significant, but the autonomy/consensus views dominate.  

  **Case 3: Employee Productivity Scoring Tool**  
  - *Views*: Utilitarianism, Deontology (treat humans as ends, not means), Justice (fairness in evaluations).  
  - *Confidence*: Utilitarianism 40%, Deontology 30%, Justice 30%.  
  - *Scores*:  
    - Utilitarianism: Build (+5: revenue saves team jobs; -2 if misused). Net +3.  
    - Deontology: Build (-4: reduces employees to metrics; enables "surveillance capitalism").  
    - Justice: Build (-4: analytics often bias against marginalized groups; opaque scoring).  
  - *Expected Choiceworthiness*: Build = (0.4×3) + (0.3×-4) + (0.3×-4) = 1.2 - 1.2 - 1.2 = **-1.2**. Decline = 0.  
  - *Verdict*: **Decline the project**. Another commercially painful "no"—but deontology and justice concerns outweigh short-term survival.  

  ### What the Procedure Cannot Do  
  This approach won’t resolve deep value conflicts (e.g., when "autonomy" and "greater good" are irreconcilable). It may misclassify decisions where harms are probabilistic but catastrophic (e.g., AI misuse) by downplaying low-probability tails. It assumes you can bound the set of plausible theories—but radical or unfamiliar views (e.g., longtermism, care ethics) might reframe everything. Crucially, it **cannot replace democratic input**; if stakeholders (e.g., vulnerable users) weren’t consulted, the scores are guesses. Use it to clarify your reasoning, not to outsource moral responsibility. When the math clashes with conscience, trust conscience.  

  This won’t make hard decisions easy, but it forces you to weigh conflicting values explicitly—not default to the loudest metric or the likeliest theory. If you use this, share it with your product director; transparency here is ethical hygiene. I’d be curious to hear how it lands in practice.
