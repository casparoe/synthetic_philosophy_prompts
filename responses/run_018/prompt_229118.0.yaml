  Section 3 (cruxes) needs concrete philosophical hinges. The user proposed two: (a) whether complicity requires intentional facilitation vs. mere toleration, and (b) whether trading with perceived wrongdoers differs from trading with mere value-dissenters. I'll retain these but refine the formulations based on classic deontology vs. consequentialism debates.

  For section 4 (test cases), I'll select scenarios that directly probe the cruxes: 
