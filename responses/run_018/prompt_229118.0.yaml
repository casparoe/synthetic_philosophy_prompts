  - Factory farm subsidy (crux 2: wrongdoing vs. value difference) 
  Each case must elicit clear, divergent responses from both sides to illustrate the conflict.

  Section 5 (verbal disputes) should acknowledge potential terminology gaps - e.g., whether "complicity" implies intentional contribution - while noting substantive differences remain.

