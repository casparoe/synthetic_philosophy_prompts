  First, Hyde's descriptions feel significant: "dwarfish," "deformed," radiating "hate." These aren't just moral judgments but visceral *physical* manifestations. If identity were a unified substance, why would immorality warp the body so extremely? This aligns with skandhas (rūpa): karma visibly alters form. Jekyll's potion acts as a catalyst, not creator—it disinhibits latent tendencies (saṅkhāras) already present.  

