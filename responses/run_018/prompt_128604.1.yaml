  Resistances: Horror *requires* Jekyll's suffering as Hyde acts. If aggregates were truly ownerless, Jekyll wouldn't feel trapped. The final suicide also implies a "self" to escape suffering—but in Buddhism, suicide doesn't end saṃsāra.  

  Stevenson's unique contribution? The *visceral dread* of identity dissolution. Philosophy describes aggregates; the novella makes you feel their uncanny autonomy. Hyde isn't just "evil"—he's a cascade of sensory events (vedanā, saññā) stripped of social rūpa. That embodied unease transcends argument.  

