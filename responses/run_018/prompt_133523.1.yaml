answer: |-
  ### Section 1: "The baseline semantics"
  The standard distinction hinges on the type of possibility space used to evaluate conditionals. **Indicative conditionals** (e.g., "If the treaty is signed tomorrow...") are assessed against what the speaker *currently believes possible*. This epistemic modal base restricts evaluation to worlds consistent with the speaker's evidence *up to the present*. Crucially, it forbids "backtracking": prior conditions (like yesterday's political negotiations) are held fixed, and only future or unknown events vary. The conditional asserts that *within these evidence-compatible futures*, the consequent follows from the antecedent. **Counterfactuals** (e.g., "If the treaty had been signed yesterday...") operate differently. They invoke a causal-historical similarity ordering. Here, the *actual past history* (up to just before the antecedent time) is held rigidly fixed. Worlds where the antecedent holds (e.g., the treaty was signed) are considered only if they minimally diverge from actual history (e.g., via a minor, late change like a last-minute vote switch). The consequent must hold in these "closest" antecedent-worlds. Backtracking to alter earlier causes (e.g., changing public opinion months prior) is typically minimized.

  ### Section 2: "The boundary case and dual-base conditioning"
  "**Dual-base conditioning**" proposes evaluating a single conditional using *both* an epistemic accessibility relation R_E (worlds compatible with the speaker's current knowledge) and a causal-historical similarity relation R_C (worlds close to actual history). Consider a climate negotiator in 2028 asserting: "If the 2030 carbon cap is binding, coastal defenses will be funded by 2035" (P → Q). At this point, she is genuinely uncertain about P (the cap). R_E-worlds include futures where P is true and others where P is false. Her assertion claims that *within the P-worlds in R_E*, Q holds. By 2033, she learns P is *actually false* (the cap wasn't adopted). She now wonders: Was her 2028 conditional false? Or should she evaluate a counterfactual "If the cap *had been* binding..." using R_C? **Standard semantics conflicts**: 
  1.  **Indicative view (2028 context)**: The conditional was evaluated within R_E, which included P-worlds. Learning ¬P *now* collapses R_E: there *are* no relevant P-worlds left in the updated epistemic state. The original conditional lacks a clear truth value – it's either undefined or vacuously true, but doesn't reflect her predictive intent.
  2.  **Counterfactual view (2033 context)**: To evaluate "If P had been true..." now requires R_C. But R_C holds the *actual* past fixed. The actual past (2028-2033) includes the *actual* failure to adopt the cap, potentially linked to deeper causes (e.g., lack of political will in 2029). Making P true while holding this past fixed might be impossible or require a "miracle" (e.g., sudden, law-breaking political change in 2030), making Q unlikely. Yet her original prediction likely assumed a *plausible* P-world where prior conditions *enabled* P.

  ### Section 3: "The update asymmetry"
  The core tension is an **update asymmetry** regarding how learning ¬P affects the evaluation bases.  
  *   **Indicative Collapse**: When the antecedent P is learned to be false, the epistemic base R_E shifts. Worlds where P was true are *expelled* from the new R_E. The original indicative conditional, defined relative to the *old* R_E which *did* contain P-worlds, becomes inaccessible for direct truth assessment from the new perspective. It seems "moot." However, the speaker's *substantive commitment* – that P was a sufficient condition for Q *within the plausible scenarios she envisioned* – feels like it should survive as a counterfactual claim.  
  *   **Counterfactual Revision**: Evaluating the counterfactual *after* learning ¬P requires R_C, which rigidly enforces the actual past (including the events leading to ¬P). To make P true, R_C often forces a divergence *very close* to the antecedent time, ignoring whether earlier conditions could have *naturally* led to P. This clashes with the indicative's original evaluation, which implicitly assumed P-worlds were reached via plausible, *backtracking-friendly* paths consistent with prior evidence (e.g., sufficient 2029 political will evolving).  
  This divergence appears fundamentally **semantic**: the indicative (evaluated in 2028 with R_E) and the later counterfactual (evaluated in 2033 with R_C) have genuinely different truth conditions because their modal bases (R_E vs. R_C) and what they hold fixed (prior evidence vs. actual history) differ. Pragmatic speech acts (prediction vs. hindsight) arise *from* these semantic bases. An agent *cannot* coherently hold both evaluations *of the same utterance token* simultaneously without contradiction, as R_E and R_C impose incompatible constraints on the relevant worlds: R_E mandates P-worlds compatible with past evidence (possibly requiring backtracking), while R_C mandates P-worlds minimally differing from actual history (forbidding backtracking).

  ### Section 4: "Diagnosis of dual-base conditioning"
  Dual-base conditioning doesn't resolve the tension; it **generates a new paradox**. Applying both R_E and R_C to the *same* conditional sentence in the *same* context (like judging the 2028 utterance *from* 2033) creates contradictory demands. R_E (as it was in 2028) requires evaluating P→Q in worlds where the path *to* P was plausible given 2028 evidence (implying backtracking to alter pre-2028 factors if necessary). R_C (imposed in 2033) requires evaluating P→Q in worlds where the path *to* P diverges minimally *from the actual, known path to ¬P* after 2028, forbidding backtracking. These relations can easily **diverge sharply**, yielding contradictory verdicts: R_E might deem P→Q true (funding followed naturally in plausible cap scenarios), while R_C deems it false (holding fixed the actual lack of political will, funding wouldn't follow a miraculous late cap adoption).  
  The indicative-counterfactual divide is best explained **primarily by a difference in modal base** (epistemic vs. causal-historical), which then shapes the direction of evaluation and speech-act force. The epistemic base is inherently forward-looking and evidence-relative; the causal base is backward-looking and reality-anchored. **Removing two features would collapse the distinction**: 1) The agent's *initial uncertainty* about the antecedent (if she knew P was false all along, an indicative would be deviant). 2) The *causal linkage* between the past and the antecedent (if P's truth was completely independent of prior history, backtracking debates vanish). The negotiator's case highlights the tension precisely because political will *in 2028-2030* causally influenced both P (the cap) and Q (funding), making backtracking crucial for the indicative's intended meaning but forbidden by the counterfactual.
