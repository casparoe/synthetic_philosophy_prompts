prompt: |-
  hey so i'm drafting a scene for my novel where two AI-ethics philosophers have been fighting for years and finally have to write a joint statement. i need the actual document they'd both sign, but i want it in the weeds—not some generic summary they could've copied from a textbook.

  the domain is cohearent extrapolated volition and idealized prefferences. call the two camps Camp Continuity and Camp Coherence. Camp Continuity says an idealized preference only counts if there's a traceable reasoning chain back to the actual human's pre-reflective desires—if you can't walk the person through each step and have them nod, it's not *their* volition, it's just a design. Camp Coherence says that's psychological conservatism; idealization should be governed by internal consistency and rational structure alone, and requiring continuity just anchors us to our biases.

  draft their adversarial-collaboration statement. start with a numbered section of agreed claims—things like reflective equilibrium genuinely changes preferences, there's no natural stopping point for reflection, and any idealization risks discarding values we actually care about. then a disagreements table with the exact split: each side's position phrased in wording that side would accept. after that, list the cruxes. i think one crux is whether "extrapolating what you'd want" and "designing what should be wanted" are actually different activities or just the same thing described differently. another is the mirror problem: if a fully idealized agent wouldn't recognize its past self's values—say, the agent rejects all art after reflection—is that proof the reflection failed, or proof it succeeded?

  for each crux, include a concrete case or argument both sides agree is relevant, and write down each camp's prediction about it. for the mirror problem, maybe use the art-rejection case; for the first crux, maybe use a hypothetical where a human's reflective chain leads to valuing silence over all human relationship—does continuity break there, or coherence win?

  make the wording precise but not slanted—neither camp should feel misrepresented. don't ask for bibliographies, citations, or reading lists; my characters don't have libraries in this scene and neither should you. keep it casual, like a novelist giving notes to a writing partner. throw in a typo or two, maybe misspell "architechts" or "relective" somewhere. and please don't quote any real philosophers—if you need a passage, paraphrase it without quotation marks.
