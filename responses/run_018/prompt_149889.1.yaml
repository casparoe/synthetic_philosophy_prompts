prompt: |-
  I'm running a small podcast for rationalist-adjacent folks who overanalyze moral psychology, and next week's guest is an unnamed historian defending this weird synthesis about Reserve Police Battalion 101: she says Browning's peer-pressure story and Goldhagen's eliminationist-antisemitism story both miss "administrative decoupling," where perpetrators actively learn to let bureaucratic role-categories replace moral selfhood rather than just suppressing it. Draft eight to ten interview questions that don't just let her restate the framework. I need at least one pressing how her decoupling differs from Arendt's banality-of-evil thesis — anticipate her reply that Arendt was about thoughtlessness while decoupling is active role-absorption, and include the follow-up that catches that distinction. I also want one on whether decoupling is reversible, with a follow-up keyed to her likely answer that it only breaks under structural collapse. And at least one asking what specific evidence from the battalion records actually supports decoupling over Browning's conformity account, with a follow-up that stops her from deflecting with "that's empirical, I'm conceptual." Please don't hedge — take a committed position on which lines of questioning actually cut deepest and defend the ranking. Avoid generic opener questions like "what drew you to history" — I want this in the weeds. You can leave a typo or two in your response, I definately don't mind.
