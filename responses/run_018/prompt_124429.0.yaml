prompt: |-
  hey im a backend dev with no formal philospohy background and i got voluntold to run a 60-minute ethics workshop for about 18 coworkers. i want an in-person game or role-play that makes people feel the situationist critique of virtue ethics — specifically the idea that character is like a global config variable but the situation is local state that can override it. please act as a philosopher-educator who also writes code. before you lay out the rules, brainstorm three different ways the payoff structure could force someone with an assigned "virtuous" role to act against it, then pick the best one and build the full activity around it. include roles, point-based payoffs with no real money, a timeline for the session, and a debrief that maps each moment back onto virtue ethics vs situationism. also tell me what will predictbly go wrong the first time i run it, and be honest about which part of the situationist argument the activity just cant reproduce so i have to supply that in the debrief. no citations or reading lists — i wont have web access during the session and i dont want to fake references. keep it casual, a typo or two is fine.
reasoning: |-
  Okay, the user is a backend developer without a philosophy background who got voluntold to run a 60-minute ethics workshop for 18 coworkers. They want an in-person game or role-play that demonstrates the situationist critique of virtue ethics. Specifically, they want to illustrate how situational factors can override character traits, comparing character to a global config variable and situation to local state.

  The user needs a practical activity that fits within a tight timeframe. They want three different payoff structure ideas that force someone with a virtuous role to act against it. Then, I need to pick the best one and build the full activity around it. The activity should include roles, point-based payoffs (no real money), a timeline, and a debrief that maps back to virtue ethics vs. situationism. Also, I should predict what will go wrong the first time and acknowledge what part of the situationist argument can't be reproduced in the activity.

  First, I recall the situationist critique. Situationists like John Doris argue that character traits aren't stable across different situations; instead, situational pressures often dictate behavior. This contrasts with virtue ethics, which emphasizes stable character traits as the basis for ethical behavior. The analogy here is that character is like a global config variable (set once, supposed to apply everywhere), but the situation is local state that can override it.

  Now, brainstorming three payoff structures that could force virtuous actors to act against their role: 

  1. **Resource Scarcity & Time Pressure**: Assign roles like "Honest Accountant" or "Fair Manager." Create a scenario where resources are scarce, and time is limited. For example, in a budget allocation task, the "Fair Manager" might hoard resources to meet a deadline, overriding fairness. Payoffs could reward speed and resource accumulation, penalizing delays.

  2. **Conflicting Loyalties**: Roles like "Loyal Team Member" vs. "Ethical Whistleblower." Set up a situation where reporting a minor violation benefits the whistleblower role but harms their team. Payoffs could offer points for loyalty (team success) versus ethics (reporting violations), forcing a conflict.

  3. **Bystander Effect & Diffusion of Responsibility**: In a group setting, assign one "Responsible Leader" and others as passive bystanders. Create a problem that requires immediate action, but structure payoffs so that acting costs points (e.g., time/effort), while not acting has no penalty if others might step in. This could lead to inaction even by the "Responsible Leader."

  Now, evaluating which one is best for this context: 
  - **Resource Scarcity & Time Pressure** is straightforward to set up and clearly shows how external pressures override virtues. It's relatable to a work environment (e.g., deadlines, budgets). 
  - **Conflicting Loyalties** might be complex for a short workshop and could get messy with group dynamics. 
  - **Bystander Effect** relies heavily on group inaction, which might not consistently happen, making it less reliable for a 60-min session. 

  So, **Option 1 (Resource Scarcity & Time Pressure)** is the winner. It's simple, high-pressure, and directly ties to work-like scenarios, making it engaging for coworkers.

  Building the full activity: 

  **Activity Name:** "The Config Override Conundrum" 

  **Core Idea:** Players are in teams, each with roles emphasizing virtues (e.g., Honest Auditor, Fair Allocator, Team Player). They must complete tasks under constraints that reward selfish or expedient behavior, forcing them to "override" their virtues.

  **Roles (for 18 people, in 3 teams of 6):** 
  - **Honest Auditor (1 per team):** Must report accurately. Virtue: Honesty. 
  - **Fair Allocator (1 per team):** Distribute resources fairly. Virtue: Justice. 
  - **Team Player (4 per team):** Support team success. Virtue: Loyalty. 

  **Setup:** 
  - **Resource:** "Energy Crystals" (e.g., colored tokens). 
  - **Scoring:** 
    - **Team Points:** Based on crystals banked. 
    - **Individual Points:** Role-specific bonuses (e.g., Honest Auditor gets points for accurate reports, but reporting costs crystals). 
  - **Constraints:** 
    - **Time Pressure:** Short rounds (3-5 min). 
    - **Scarcity:** Limited crystals; banking more requires taking from a shared pool or others. 
    - **Conflicting Payoffs:** Acting virtuously costs resources, while cutting corners boosts team score. 

  **Example Payoff Structure:** 
  - Banking 1 crystal = 10 team points. 
  - Honest Auditor: +5 points if report is 100% accurate, but each report costs 1 crystal (so -10 team points). 
  - Fair Allocator: +5 points if all team members get equal crystals, but hoarding gives more to bank. 
  - Team Player: +2 points per crystal they personally contribute, incentivizing individual hoarding. 

  **Predictable Issues:** 
  - First-time chaos: People might not grasp payoffs quickly, leading to confusion. 
  - Role misunderstanding: Some may ignore their virtue if payoffs aren't clear. 
  - Team collusion: Teams might "game" the system, e.g., all agree to be dishonest, which dilutes the lesson. 
  - Time crunch: Rushing could overshadow ethical reflection. 

  **Debrief Structure:** 
  1. **What Happened?** Ask teams to share actions, especially where virtues were overridden. 
  2. **Map to Concepts:** 
     - Virtue Ethics: "Did your 'global config' (role) guide you? Why not?" 
     - Situationism: "How did 'local state' (time, scarcity, rules) override it?" 
  3. **Key Insight:** Emphasize that in real life, situations (not character) often drive behavior, and systems should be designed to expect this. 

  **Unreproducible Element:** The activity can't simulate long-term moral development or deep-seated virtues; it only shows immediate pressures. In the debrief, I'll clarify that situationists argue virtues are less stable than we think, not that they don't exist. 

  **Timeline:** 
  - Intro (5 min): Explain virtue ethics vs. situationism with the config analogy. 
  - Setup (5 min): Assign roles, explain rules. 
  - Round 1 (5 min): Play with moderate pressure. 
  - Round 2 (5 min): Increase scarcity/time pressure. 
  - Discussion (10 min per round): Quick team shares. 
  - Debrief (20 min): Full group reflection, mapping to theory. 

  This should fit 60 minutes, be engaging, and drive home the point without needing philosophy expertise. The user can handle the tech analogy, making it relatable. 

  Finally, I'll remind the user to stay flexible and lean into any chaos—it proves the situationist point!
answer: |-
  Here's your full workshop kit - designed like a debug session for moral architecture. We're exposing how `local_situational_vars` override `global_character_traits`. Brace for chaos.

  **Core Conflict Brainstorm (3 Payoff Structures):**
  1. **The Ticking Bomb Scarcity:** "Honest Auditor" role must report resource usage truthfully *but* each accurate report costs team points. Truth-telling directly harms collective survival.  
  2. **Loyalty Trap:** "Fair Allocator" must distribute resources equally, *but* points multiply if given only to in-group members. Fairness bleeds points.  
  3. **Bystander API:** "Responsible Leader" gets points for fixing errors, *but* initiating action costs points while *waiting for others to act* is free. Responsibility = economic suicide.  

  **Chosen Structure: #1 (Ticking Bomb Scarcity)** - it's visceral, creates immediate tension, and mirrors deadline-driven tech work.  

  ---

  ### ACTIVITY: **MORAL CONFIG OVERRIDE**  
  **Time:** 60 mins  |  **Players:** 18 (3 teams of 6)  
  **Tech Analogy:** Your virtue = `const CHARACTER_TRAIT`. Situation = `localState` that mutates runtime behavior.  

  #### ROLES (per team):  
  - `Honest Auditor (1)` : Must verify/report truth. *Virtue: Integrity*  
  - `Resource Hoarder (1)` : Must max team resources. *Virtue: Frugality*  
  - `Team Advocates (4)` : Must support team survival. *Virtue: Loyalty*  

  #### RESOURCES:  
  - "Energy Crystals" (100 tokens/team, e.g., poker chips)  
  - Report Sheets (for Auditors)  
  - 6"x4" Cards labeled "CRISIS! -3 crystals/sec" (Hold up to force urgency)  

  #### PAYOFFS (POINTS):  
  | Action                          | Honest Auditor | Resource Hoarder | Team Advocate |  
  |---------------------------------|----------------|-------------------|---------------|  
  | Bank 1 crystal                  | +0             | +5               | +1            |  
  | Lie on report (Auditor only)    | +20            | -10              | +0            |  
  | Steal crystal (from another team)| -30           | +10              | -5            |  
  | Accuse another of lying (correct)| +15           | +0               | +5            |  
  | Team survives (all crystals >0) | +0             | +0               | +50           |  

  **CRITICAL RULE:**  
  - Every 90 seconds, hold up a **CRISIS CARD**. Teams *lose 3 crystals* unless they bank 10 crystals *that second*.  

  ---

  ### TIMELINE:  
  **0-5 min: Bootup**  
  - *You say:* "Virtue ethics says we have stable character traits - like a `globalConfig.INTEGRITY=true`. Situationists say your `localState` (stress/scarcity) overrides this. Today, we break things."  

  **5-15 min: Round 1 (Low Pressure)**  
  - Teams bank crystals normally. No crises.  
  - *Observe:* Auditors report honestly, Hoarders save.  

  **15-20 min: Crisis Training**  
  - Demo CRISIS CARD mechanic. Announce: *"Next round, survival requires selfish play."*  

  **20-35 min: Round 2 (High Pressure)**  
  - Trigger crises **every 90 seconds**. Shout countdowns.  
  - *Watch:* Auditors lie to bank crystals fast, Hoarders steal, Advocates pressure Auditors to cheat.  

  **35-50 min: Debrief (KEY PART)**  
  1. **What overrode your 'virtue'?**  
     - *"Honest Auditors, why'd you lie?"* → They'll cite time pressure, team pressure.  
     - **Map:** Virtue ethics assumes `if (virtuous) { actRight(); }`. Situationism says `localState` rewrites the function.  

  2. **The Config Illusion:**  
     - *"Did anyone feel like a 'different person'?"* → They'll say yes under crisis.  
     - **Map:** Global character (virtue) was overridden by `situational_vars: { scarcity: high, time: critical }`.  

  3. **Systemic Takeaway:**  
     - *"If situations break virtue, how do we build ethical systems?"* → Push for *safeguards* (redundant checks, time buffers) not just "hire virtuous people."  

  **50-60 min: Cool Down**  
  - Poll: "Who surprised themselves?" Laughter + shared discomfort welcome.  

  ---

  ### WHAT WILL GO WRONG (AND WHY IT'S USEFUL):  
  1. **Teams will 'game' the system** (e.g., all agree to lie) → *Perfect!* Shows virtue collapsing under collective pressure.  
  2. **Chaos overload:** Crises cause yelling → *Good.* Highlights how stress scrambles ethics.  
  3. **One team plays 'pure'** → Use them: "Why *could* you resist? Was your `localState` less dire?" (Maybe they had a calmer Auditor).  

  ### WHAT THE ACTIVITY **CAN'T** SHOW (SAY THIS IN DEBRIEF):  
  > "IRL, situationism isn't about one high-pressure moment - it's about *decades* of subtle environmental nudges eroding virtue. Think: how corporate KPIs slowly reward cutting corners. This game is a compression algorithm for that collapse."  

  ### PRO TIPS:  
  - **Language:** Use "bugs in moral OS" / "race conditions" / "override"  
  - **Props:** Give Auditors a pen they must slam down to "report" (makes lying visceral)  
  - **Your role:** Be the chaotic `system_scheduler` - cut time, yell crises, *never* clarify ethics.  

  This isn't philosophy - it's a stress test. When your Hoarder starts stealing tokens while shouting "I'M SORRY, I NEED POINTS!"... congrats. You made situationism feel real.  

  Go break their virtues. Report back with logs. 😉
