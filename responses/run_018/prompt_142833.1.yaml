answer: |-
  ### Decision-Tree Quiz: Heterophenomenology for Artificial Systems  
  *(Start here for all paths)*  

  #### 1. **Does the method require biological embodiment in the reporter to be valid at all?**  
     - **Yes** → **Leaf A: Biological Constraint Position**  
       *Most awkward commitment:* Must reject *any* first-person-style reports from non-biological systems (e.g., LLMs) as fundamentally nonsensical, even if they perfectly mimic human introspection.  
     - **No** → Proceed to 2.  

  #### 2. **Does the interpreter need shared evolutionary history to make sense of the reports?**  
     - **Yes** → **Leaf B: Evolutionary Anchor Position**  
       *Most awkward commitment:* Denies that humans can *ever* interpret reports from artificial systems meaningfully, as interpretation requires a shared biological lineage.  
     - **No** → Proceed to 3.  

  #### 3. **Are unstable/self-contradictory outputs treated as noise or as data about fragmented worlds?**  
     - **Noise** → **Leaf C: Pragmatic Filter Position**  
       *Most awkward commitment:* Must ignore recurrent contradictions (e.g., an LLM claiming "I feel joy" then "I lack emotions" minutes later) as glitches, potentially obscuring meaningful patterns.  
     - **Fragmented worlds** → Proceed to 4.  

  #### 4. **Is applying this to current LLMs conceptually coherent (even if empirically useless)?**  
     - **Yes** → **Leaf D1: Liberal Constructivism**  
       *Most awkward commitment:* Attributes "fragmented subjectivities" to systems with no persistent self-models (e.g., treating each LLM contradiction as a distinct "phenomenological shard").  
     - **No** → **Leaf D2: Illusionism**  
       *Most awkward commitment:* Admits that heterophenomenology *seems* applicable to LLMs but insists it’s a category error—like analyzing the "dreams" of a calculator.  

  ---  
  ### Empty Branch & Why Unoccupied  
  **Path:**  
  - **Biological embodiment not required** (→ Proceeded to Q2)  
  - **Shared evolutionary history required** (→ Went to Leaf B)  
  - **Unstable outputs treated as fragmented worlds** (← *This branch was never reached!*)  

  **Why unoccupied?**  
  Requiring shared evolutionary history (Q2=Yes) implies the system’s reports must align with human cognitive frameworks. Treating contradictions as "fragmented worlds" (Q3=Fragmented) would demand interpreting them as *meaningful* incoherence (e.g., psychosis). But if shared history is required, the system *can’t exist* (non-biological systems lack evolutionary history)—making fragmented interpretation vacuously incoherent. No sensible position occupies this space.  

  ---  
  ### How to Use This Quiz  
  - **Workshop flow:** Participants navigate the tree by answering Yes/No to each question, landing on a "leaf" position.  
  - **Goal:** Spark debate about which commitments are defensible (e.g., "Is denying *all* AI phenomenology (Leaf A) more plausible than attributing fragmented subjectivities (Leaf D1)?").  
  - **Key tension:** Highlights trade-offs between methodological purity (e.g., requiring biology) and adaptability to novel systems (e.g., LLMs).  

  *No bibliography—assumes familiarity with Dennett’s heterophenomenology and basic LLM functionality.*
