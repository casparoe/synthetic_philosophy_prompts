prompt: |-
  Hi — I write the public-facing label copy for a small archaeology museum, 60 to 80 words a pop. Over the next few months we're doing three rooms back to back: one on Troy and the late Bronze Age Aegean, one on King Arthur and post-Roman Britain, one on the Exodus and Egypt. Each room needs maybe 25 labels, and basically every one of them forces the same decision: how strongly am I allowed to commit to a claim about something that might be history, might be legend, or might be a story that later grew around a real place, a real ruin, or a real name. My problem isn't ignorance of the material, it's that I have no consistent way of setting the level of commitment, so right now it's my mood on the day, then our curator (great guy, zero theory background, just asks "are we sure?") signs off, then the director reads it and wants to know why the Troy room says "probably" while the Arthur room says "in the story".

  So I want a procedure. Something I can run in about ten minutes per label, in a fixed order, with a stopping rule.

  The bit I keep tripping over is that three things get collapsed into one and I need the procedure to hold them apart: (a) the thing happened; (b) something happened and people kept talking about it, more or less accurately, for generations before anyone wrote it down; (c) somebody composed a story, and the story then got attached to a real hill, a real destruction layer, a real name in an inscription. Some specific traps the procedure has to handle rather than hand-wave:

  - The anchoring trap: a story is set at a site we've actually dug, and there's a destruction layer roughly in the right century, or the hero's name shows up in an inscription more or less contemporary with the events. I suspect that tells me something about what the storytellers needed, not necessarily about the event, but I can't say when.
  - Silence: no Egyptian record of the Israelites, no contemporary source naming Arthur. When is an absence allowed to count and when is it just an absence?
  - Awkward or embarrassing details: the move where you say the tellers would never have invented this. And the countermove, that a tradition can manufacture awkwardness precisely to feel authentic. Also doublets — two variant versions of what looks like one episode — do they count for or against?
  - Independent attestation: two sources saying the same thing, and the question of when they're actually independent.
  - Majority expert consensus against something a large chunk of our visitors are dead certain is true.
  - The religious case vs the secular case: museum policy is we never say a treasured story is false, but we also can't write labels implying historians back it when they don't. So somewhere in here there's a line between what evidence can warrant and what the story means to people, and I need the procedure to stop at that line and hand it to a human.

  Deliverable: a small ladder of commitment levels, maybe four to six rungs, with canned phrasings for each rung in plain visitor English; the tests, in order, that sort a claim onto a rung; where the procedure just stops with no; and where it has to kick the decision to a person because it's a values question. Be explicit about which distinctions survive being simplified for someone with no theory and which you're dropping and why.

  Then run it on three of my actual drafts. Don't spare my feelings on the first one, I really like that line and I'll defend it if it deserves defending:

  1. Troy: "The Trojan War was real — the Greeks really did sail against this city and burn it, just as Homer says."
  2. Arthur: "Behind the knights and the round table there was probably a real Roman-British war leader, though we'll never know his name." The local tourism people love this one.
  3. Exodus: a label where the board wants nothing that "denies anyone's faith", and my current draft opens "there is no evidence that any of this happened".

  For each: show the tests actually firing, give me the resulting label in the house voice, and tell me which rung it lands on and which single test decided it.

  Finally, be honest about where this thing will misfire: what kind of claim it systematically over-hedges or under-hedges, whether it does anything useful when every source we have is literary, and what I should do on the days when my curator and I disagree about a rung. No bibliography, no citations, I don't care who originated which criterion — I need to be able to run it on a Tuesday afternoon.
reasoning: |-
  Okay, the user writes label copy for an archaeology museum and is dealing with the challenge of presenting historical claims that might be legend or story. They need a consistent procedure to determine how strongly to commit to a claim in their labels. The key issues are distinguishing between whether an event happened, whether it was passed down accurately, or if it's a story attached to a real place or name. They also mention specific traps like anchoring, silence, awkward details, independent attestation, expert consensus, and religious considerations.

  The user wants a step-by-step procedure that's quick to apply—around ten minutes per label. They need a ladder of commitment levels with clear phrasing, tests to assign each claim to a rung, and rules for when to stop or defer to a human. They also want examples using their draft labels for Troy, Arthur, and Exodus, showing how the tests apply and the resulting label. Finally, they want honesty about where the procedure might misfire.

  First, I need to design the ladder of commitment. Four to six rungs make sense. The highest commitment should be for claims with strong evidence, like archaeological proof. The lowest would be when evidence is absent. The middle rungs handle probabilities and traditions. Each rung needs canned phrasing that's plain English.

  For the tests, they need to be ordered to quickly assess a claim. Start with archaeological evidence, then contemporary records, absence of records, independent attestation, expert consensus, and the nature of the story (embarrassing details, doublets). The anchoring trap is crucial—just because a site exists doesn't mean the story happened there. Silence can be tricky; absence of records isn't always evidence against, especially if records are spotty.

  The religious vs. secular divide is tricky. The museum can't deny faith but must be honest about historical consensus. A separate rung for cultural significance without historical basis might be needed. Also, when expert consensus is split or when values are involved, the procedure should flag it for human decision.

  Now, applying the tests to the user's examples:

  1. **Troy Label**: Claiming the war was real as Homer said. Tests: Archaeological evidence shows a destruction layer at Troy VIIa around 1200 BCE, but no proof it was Greeks or due to a war described by Homer. Hittite texts mention conflicts but not Homer's narrative. Expert consensus agrees on a destruction but not the war's details. This would land on Rung 3—a real event inspired the story, but not exactly as told. The phrasing should avoid confirming Homer's account directly.

  2. **Arthur Label**: Positing a real war leader behind the legends. No contemporary records, medieval sources are late, no archaeological evidence. The name isn't in early records. Silence here is significant. Expert consensus leans towards legendary. This should be Rung 4—possible but unverified. The current phrasing is too confident ("probably"). Needs softer language like "may have been inspired."

  3. **Exodus Label**: Current draft says no evidence, but the board wants no faith denial. Archaeology and records show no evidence of a mass Exodus. Expert consensus is against it. Religious significance is high. This requires Rung 6—cultural story without historical basis, but important to people. The draft's opening is too blunt. Phrasing should focus on cultural impact and lack of evidence without outright denial.

  Potential misfires: The procedure might over-hedge when evidence is clear but not archaeological (e.g., well-attested historical events with only textual evidence). Under-hedging could happen if archaeological evidence exists but context is ignored (anchoring trap). With purely literary sources, the procedure might default to lower rungs even if there's strong scholarly consensus. When curator disagreements happen, the user should use the tests as a framework for discussion, focusing on which test results differ.

  I need to ensure the tests are in a logical order and cover all the traps mentioned. The ladder should balance clarity for visitors with historical accuracy. Also, the canned phrases must be adaptable but consistent. For the religious cases, separating historical assessment from cultural meaning is essential to meet museum policy.
answer: |-
  ## Commitment Procedure for Archaeological Label Writing

  **Philosophy:** This procedure separates *historical event existence*, *tradition development*, and *story attachment*. It prioritizes archaeological evidence & contemporary records, assesses tradition reliability cautiously, and explicitly separates historical assessment from cultural significance. It minimizes theory, focusing on tangible evidence and expert consensus.

  **The Commitment Ladder (Rungs 1-6):**

  1.  **Confirmed Event:** *"Archaeology/records confirm..." / "We know this happened..."*
      *(Requires: Direct archaeological evidence OR unambiguous contemporary written records explicitly describing the specific event/actor.)*
  2.  **Highly Probable Event:** *"Strong evidence indicates..." / "It is very likely that..."*
      *(Requires: Compelling archaeological evidence strongly linked to the event + supportive near-contemporary records OR multiple independent contemporary/near-contemporary sources.)*
  3.  **Event Core, Story Details:** *"A real event likely inspired..." / "While the stories grew, evidence suggests a basis in..."*
      *(Requires: Archaeological evidence of a relevant event/context at the right time/place OR solid contemporary records of key figures/conflicts + plausible tradition development path.)*
  4.  **Possible Inspiration:** *"There may be a historical core..." / "It's possible stories drew from real..."*
      *(Requires: Plausible archaeological context OR presence of names/places from the story in contemporary records + absence of strong contradiction.)*
  5.  **Unverified Tradition:** *"This is a powerful tradition..." / "The story tells us..."*
      *(Requires: No confirming evidence, but no strong contradiction OR story attached to known site/name with no evidence *for* the specific event.)*
  6.  **Cultural Story:** *"This story holds deep meaning..." / "While not historically verified, this narrative..."*
      *(Requires: Strong expert consensus *against* historicity OR complete lack of evidence where it should exist + significant cultural/religious importance.)*
      *Stopping Rule:* Use this rung when evidence is absent *and* expert consensus is solidly against historicity, *or* when the primary importance is cultural/religious meaning despite lack of evidence.

  **Key Distinctions Surviving Simplification:**
  *   **Archaeology vs. Text:** Physical evidence (destruction layers, inscriptions) is primary. Texts written long after are secondary evidence *about tradition*.
  *   **Contemporary vs. Later:** Records/evidence from the time of the alleged event matter most. Later sources show tradition, not history.
  *   **Absence of Evidence:** Only significant if evidence *should* exist (e.g., major events in well-documented societies). Otherwise, it's neutral.
  *   **Expert Consensus:** What do most relevant specialists *currently* conclude based on evidence?

  **Distinctions Dropped & Why:**
  *   **"Embarrassment Criterion" & "Doublets":** Too subjective and theory-laden for reliable, quick application. Experts disagree on their value. Stick to tangible evidence and consensus.
  *   **Precise Source Independence:** Hard to adjudicate quickly without deep source criticism training. Default to "near-contemporary" vs. "much later" as a proxy.
  *   **Nuanced Tradition Transmission:** We simplify to "plausible path" vs. "implausible gap/context".

  **The Procedure (10-Minute Flowchart):**

  1.  **Event Core?** Is there **archaeological evidence** (destruction, battle debris, specific artifact) directly linked to the *specific event/actor* described? **Yes:** Rung 1 or 2. **No:** Go to 2.
  2.  **Contemporary Records?** Are there **written records** from the *time of the alleged event* explicitly naming the event/actor? **Yes:** Rung 1 or 2. **No:** Go to 3.
  3.  **Plausible Context & Near-Contemporary Mention?** Is there archaeological evidence of a *relevant type* of event (e.g., war, migration) at the *right time/place*? OR Are key names/places from the story found in records *within ~200 years*? **Yes:** Rung 3 or 4. **No:** Go to 4.
  4.  **Absence of Evidence Significant?** For the claimed event, **should** we expect clear evidence (e.g., Egyptian records of major slave revolt, Roman records of powerful British king)? AND is that evidence **completely absent**? **Yes:** Go to 5. **No:** Rung 4 or 5. *(This handles "Silence" trap)*
  5.  **Expert Consensus?** What is the **dominant view** among relevant archaeologists/historians *today*? (Quick check: reputable summaries, standard textbooks, major museum exhibits).
      *   **Solidly For:** Supports Rung 2, 3, or 4.
      *   **Mixed/Speculative:** Rung 4 or 5.
      *   **Solidly Against:** Rung 6. *(Handles "Majority consensus vs. visitors")*
  6.  **Anchoring Trap Check:** Is the *only* evidence linking the *specific story* to history the setting (real site) or a name (real name in inscription)? **Yes:** This only supports Rung 4 (Possible Inspiration) or Rung 5 (Unverified Tradition) at best. Do not bump higher.
  7.  **Values Check:** Is this a story of **deep religious/cultural significance** where Rung 5 or 6 feels dismissive *despite* the evidence assessment? **Yes:** **Kick to Human** (Curator/Director/Board). Use Rung 6 phrasing focusing on meaning, *carefully* acknowledging the historical assessment consensus if applicable. *(Handles "Religious vs. Secular" line)*
  8.  **Assign Rung:** Based on the strongest test passed. Select canned phrasing.
  9.  **Stop or Revise:** If Rung 6 is assigned due to expert consensus against, stop. Otherwise, finalize label.

  **Applying the Procedure to Your Drafts:**

  1.  **Troy Label Draft:** "The Trojan War was real — the Greeks really did sail against this city and burn it, just as Homer says."
      *   **Test 1 (Event Core - Archaeology):** Yes, destruction layer (Troy VIIa) ~1180 BCE. BUT, no evidence *who* destroyed it (Greeks? Others?) or *why* (massive war? raid?).
      *   **Test 2 (Contemporary Records):** Hittite texts mention "Wilusa" (likely Ilion/Troy) and conflicts, even an "Ahhiyawa" (possibly Mycenaean Greeks). They mention disputes, even a prince "Alaksandu" (Paris?), but **no** record of a massive Greek coalition, 10-year siege, or Helen. Not explicit confirmation of *Homer's event*.
      *   **Test 3 (Plausible Context):** Yes. Destruction + Hittite texts show Mycenaeans involved in Anatolian politics/conflict in the right period. Supports a core conflict.
      *   **Test 5 (Expert Consensus):** Consensus: A major conflict *likely* occurred at Troy involving the Mycenaean world, inspiring later legends. **No** consensus that "it happened just as Homer says" (Homer wrote ~400+ years later).
      *   **Test 6 (Anchoring Trap):** The destruction layer *is* key evidence, but it only proves destruction, not Homer's specific narrative. Name ("Wilusa") in records is supporting context.
      *   **Test 7 (Values Check):** Not primarily religious for most visitors. No kick needed.
      *   **Result:** Strong evidence for a destructive conflict, but not Homer's specific war. **Rung 3 (Event Core, Story Details)**.
      *   **Decisive Test:** Test 5 (Expert Consensus) - consensus supports a conflict but not Homer's details.
      *   **Revised Label:** "Archaeology confirms Troy was destroyed by conflict around 1180 BC, likely involving warriors from the Greek world. While the epic tale of Helen and Achilles grew over centuries, it may hold echoes of this real upheaval." (House Voice: Clear, factual, separates event from story).

  2.  **Arthur Label Draft:** "Behind the knights and the round table there was probably a real Roman-British war leader, though we'll never know his name."
      *   **Test 1 (Event Core - Archaeology):** No. No archaeology (battles, fortified headquarters) definitively linked to Arthur.
      *   **Test 2 (Contemporary Records):** No. No mention in 5th/6th century British or continental records. First mention ~300 years later.
      *   **Test 3 (Plausible Context & Near-Contemporary Mention):** Plausible context? Yes (post-Roman Britain chaotic). Near-contemporary mention? No. Key names? "Arthur" not found as leader name in contemporary inscriptions/records. Ambrosius Aurelianus is a near-contemporary figure sometimes linked, but not named Arthur.
      *   **Test 4 (Absence Significant?):** **Yes.** Records from this period in Britain are scarce, BUT figures like Ambrosius *are* mentioned. The absence of *any* contemporary reference to a figure as pivotal as Arthur is considered significant by many experts. Supports lower rung.
      *   **Test 5 (Expert Consensus):** Dominant view: Arthur is a legendary figure, *possibly* based on one or more historical warlords whose deeds were amalgamated and mythologized. "Probably a real" leader is **too strong** for consensus. "Possibly inspired by" is the consensus phrasing.
      *   **Test 6 (Anchoring Trap):** Real places (Tintagel, Cadbury Hill) are associated later. This is anchoring - supports Rung 4/5 at best.
      *   **Test 7 (Values Check):** Cultural significance, but not primarily religious for most. No kick.
      *   **Result:** Plausible context, late tradition, absence of contemporary evidence, expert consensus favors legend over identifiable history. **Rung 4 (Possible Inspiration)**.
      *   **Decisive Test:** Test 4 (Significant Absence) + Test 5 (Expert Consensus).
      *   **Revised Label:** "The legendary King Arthur may draw inspiration from real Roman-British leaders who fought against Saxon invaders. Over centuries, stories of their bravery transformed into the epic tales of knights, magic, and Camelot." (House Voice: Acknowledges possibility, focuses on the story's development. Tourism angle preserved without overclaiming).

  3.  **Exodus Label Draft:** "there is no evidence that any of this happened"
      *   **Test 1 (Event Core - Archaeology):** No. No evidence of large-scale Israelite presence/slavery in Egypt, mass desert wandering, or conquest of Canaan matching the Biblical timeline/description.
      *   **Test 2 (Contemporary Records):** No. Egyptian records mention Semitic slaves/workers ("Apiru/Habiru"), but **no** record of Israelites as a distinct enslaved group, plagues, mass Exodus, or Pharaoh's army drowned.
      *   **Test 4 (Absence Significant?):** **Yes.** Egypt had meticulous records. A mass slave escape, devastating plagues, loss of army would absolutely be recorded. Their complete absence is powerful evidence against the *literal, large-scale Exodus narrative*.
      *   **Test 5 (Expert Consensus):** Overwhelming consensus (archaeologists, Egyptologists, biblical scholars) against the historicity of the Exodus *as described in the Bible*.
      *   **Test 7 (Values Check):** **KICK TO HUMAN.** This is a core story of profound religious significance. Rung 6 (Cultural Story) is required by policy, but the historical assessment (Tests 1,2,4,5) is clear. The label *must* acknowledge the lack of evidence while focusing on meaning. Original draft is factually correct but violates policy by being dismissive.
      *   **Result:** **Rung 6 (Cultural Story)** mandated by policy/values, but human needs to phrase carefully respecting historical assessment.
      *   **Decisive Test:** Test 7 (Values Check) overriding the strong negative evidence.
      *   **Revised Label (Human-Crafted for Rung 6):** "The Exodus story of liberation from bondage is a foundational narrative of enduring faith and identity. While archaeology and historical records haven't found evidence confirming the events as described, the powerful journey it recounts continues to inspire millions worldwide." (House Voice: Respectful, focuses on meaning, acknowledges historical assessment neutrally without contradiction).

  **Where It Will Misfire & Mitigation:**

  1.  **Over-Hedging Clear Events:** For well-documented historical events with *only* strong textual evidence (e.g., Roman politics), it might default to Rung 3/4 due to lack of archaeology. *Mitigation:* Ensure Test 2 (Contemporary Records) allows Rung 1/2 if records are abundant, unambiguous, and corroborated.
  2.  **Under-Hedging Anchoring:** If a site is dramatic *and* has a destruction layer *and* the story is famous, the urge to push to Rung 3 is strong. *Mitigation:* Strictly apply Test 6 (Anchoring Trap Check). Does evidence link to the *specific story event*, or just the context?
  3.  **Purely Literary/Textual Cases:** For events known *only* from later literature (e.g., some early Roman kings), evidence assessment relies heavily on Test 5 (Expert Consensus) and Test 4 (Absence). It will often land on Rung 4 or 5. *Mitigation:* This is likely accurate; accept the hedge. The procedure *is* useful here – it forces explicit consideration of the evidence gap.
  4.  **"Plausible Path" Ambiguity:** Test 3 relies on judgment. *Mitigation:* Default to lower rung if unsure. Favor consensus (Test 5).
  5.  **Curator Disagreement on Rung:** This is expected! Use the procedure as a **shared framework**:
      *   Walk through the tests together step-by-step.
      *   Identify *exactly* which test result you disagree on (e.g., "Is this absence significant?", "Is the consensus really that strong?").
      *   Focus the debate on evidence for that specific test.
      *   If deadlocked, escalate to the Director *with both interpretations and the test results*.

  This procedure provides consistency, forces explicit consideration of evidence types and traps, separates history from story and meaning, and gives you defensible phrasing grounded in a replicable process. It won't eliminate judgment calls, but it will make them structured and transparent. Good luck with the rooms!
