  ### In-Class Game: "The Personal Choice Paradox"
  **Objective:** Students experience a preference cycle caused by combining individual rights (minimal liberalism) and group efficiency (weak Pareto principle).

  #### Setup & Materials
  - **Groups:** Divide students into groups of 3.  
  - **Roles:** Assign each student a role (A, B, C) with **private preferences** and **decisive power** over one pair of alternatives. Print role cards:
    - **A's Card:**  
      *Preferences:* Z > X > Y  
      *Decisive Power:* You control {X, Y}. If you prefer X over Y, the group must rank X > Y (and vice versa).  
      *Stakes:* If Z wins, you lose candy; if X wins, you keep candy; if Y wins, you get extra candy.
    - **B's Card:**  
      *Preferences:* X > Y > Z  
      *Decisive Power:* You control {Y, Z}. Your preference determines Y vs. Z.  
      *Stakes:* Lose candy if Y wins; keep candy if Z wins; extra candy if X wins.
    - **C's Card:**  
      *Preferences:* Y > Z > X  
      *Decisive Power:* You control {X, Z}. Your preference determines X vs. Z.  
      *Stakes:* Lose candy if X wins; keep candy if Y wins; extra candy if Z wins.
  - **Alternatives:** Use 3 colored cards (X=Red, Y=Green, Z=Blue) per group.  
  - **Stakes:** Distribute 3 candies per student upfront. Outcomes determine gains/losses.  
  - **Materials:** Role cards, colored cards, candies, timer.

  #### Rules of the Game
  1. **Goal:** As a group, rank the three alternatives (X, Y, Z) from best to worst.  
  2. **Individual Rights:**  
     - A is **decisive** over {X, Y}: Group must adopt A’s preference (X > Y).  
     - B is **decisive** over {Y, Z}: Group must adopt B’s preference (Y > Z).  
     - C is **decisive** over {X, Z}: Group must adopt C’s preference (Z > X).  
  3. **Weak Pareto:** If *all* prefer alternative P over Q, the group must rank P > Q.  
  4. **Process:**  
     - Students first **rank alternatives individually** based on their role.  
     - Then, **apply decisive powers**: Enforce A’s (X > Y), B’s (Y > Z), and C’s (Z > X) in any order.  
     - Finally, **check for Pareto improvements** (e.g., if all prefer X > Z, enforce it).  
  5. **Outcome:** Groups must submit a **consistent group ranking** (no cycles allowed).  

  #### Timeline (75 Minutes)
  - **Intro (5 min):** Explain rules, stakes, and distribute materials.  
  - **Gameplay (25 min):** Groups try to rank alternatives. *Let them struggle.* Circulate and ask: *"Can you satisfy all decisive powers and Pareto?"*  
  - **Group Reports (10 min):** Each group shares:  
    - Their attempted ranking.  
    - Where they got stuck.  
    - How stakes influenced strategy.  
  - **Debrief (35 min):** Guide discussion using the script below.  

  ---

  ### Debrief Script: Mapping Game to Sen’s Theorem  
  **Step 1: Elicit Observations (5 min)**  
  - *Ask:* "What happened? Could you create a consistent ranking?"  
    - Expected: Groups report cycles (X > Y > Z > X) or deadlock.  
  - *Highlight:* "You encountered a cycle: X > Y (A’s power), Y > Z (B’s power), Z > X (C’s power)."  

  **Step 2: Map Conditions (15 min)**  
  - **Unrestricted Domain (UD):**  
    - *Ask:* "Could you freely rank alternatives based on personal stakes?"  
    - *Point:* UD allows any preference profile (like your Z>X>Y, X>Y>Z, Y>Z>X).  
  - **Minimal Liberalism (ML):**  
    - *Ask:* "What happened when you enforced A’s, B’s, and C’s decisive powers?"  
    - *Point:* ML grants each person control over one pair → caused X>Y, Y>Z, Z>X.  
  - **Weak Pareto (WP):**  
    - *Ask:* "Was there any pair where everyone agreed? (e.g., all prefer X>Z?)"  
    - *Point:* In this profile, WP doesn’t apply (no unanimous pair). *But if we add WP, the cycle worsens.*  
  - **Collective Acyclicity:**  
    - *Point:* Society’s ranking must be rational (no cycles). Your group ranking *couldn’t* be transitive.  

  **Step 3: The Paradox (10 min)**  
  - *State:* "Sen’s theorem says: UD + ML + WP → *no* acyclic social ranking exists."  
  - *Ask:* "Which condition would you drop to avoid cycles? What’s the cost?"  
    - **Drop ML?** Lose individual rights (e.g., A can’t control {X,Y}).  
    - **Drop WP?** Allow inefficient outcomes (e.g., everyone prefers X>Z but Z wins).  
    - **Drop UD?** Restrict "immoral" preferences (e.g., ban C’s Y>Z>X).  

  **Step 4: Beyond the Game (5 min)**  
  - *Close the Gap:* "This isn’t just *your* group’s issue. Sen proved *no* voting rule satisfies all three conditions for *every* preference profile. Today, you saw one instance—the theorem guarantees cycles will *always* arise under some profiles."  
  - *Real-world Implication:* "Liberty and efficiency clash. You can’t have both without compromise."  

  ---

  ### Predictable Problems & Solutions  
  1. **Problem:** Students treat it as bargaining ("I’ll accept Y>Z if you make Z>X").  
     - *Solution:* Intervene: "Remember—decisive powers are *absolute rights*. You can’t trade them away."  
  2. **Problem:** Faking preferences to win candy.  
     - *Solution:* Assign stakes *aligned* with true preferences (e.g., A loses candy if Z wins). Emphasize honesty.  
  3. **Problem:** Missing the structural cycle ("Our group was just indecisive").  
     - *Solution:* Have groups write rankings on the board. Show identical cycles across groups.  
  4. **Problem:** Blaming specific people.  
     - *Solution:* Stress: "The cycle emerges from rules, not individuals. Any preferences causing a ‘Latin Square’ (X>Y>Z, Y>Z>X, Z>X>Y) will trigger it."  

  ### Limitations of the Game  
  - **Single-Profile Focus:** The game shows a cycle for *one* preference profile, but Sen’s theorem proves *no* rule works for *all* profiles.  
  - **Closing the Gap:** In debrief, say:  
    > "Today, your preferences caused a cycle. Sen’s genius was showing that *every* voting rule will fail for *some* profile. If your rule avoids cycles in your group, I can find another profile where it fails. Liberty, efficiency, and universal domain are *logically incompatible*."  

  **Why It Works:** Students feel the frustration of the cycle firsthand, making Sen’s abstract theorem visceral. The stakes ensure preferences feel real, and the debrief links their experience to formal conditions. Run it, and watch them argue about liberalism vs. Pareto!
