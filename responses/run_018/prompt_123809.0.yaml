  ### **Taxonomy Tension: Scientific Kinds Simulation**  
  **Goal:** Illustrate the tension between intuitive morphological groupings and empirically predictive (but counterintuitive) causal groupings. Teams experience how "joint-carving" taxonomies require accepting bizarre, non-intuitive categories to achieve inductive power, while intuitive groupings fail under projection.

  ---

  ### **Game Setup**  
  **Materials:**  
  - 32 cards (size: 4"x6") describing fictional organisms, each with:  
    - **Visible Traits:** Body shape (☀️ Spherical, 🧊 Cubical, 🌀 Cylindrical), Skin texture (🌱 Mossy, 💎 Crystalline, 🔥 Scaled), Color (🔴 Crimson, 🔵 Cerulean, 🟢 Viridian), Movement (🚶 Walker, 🪁 Glider).  
    - **Hidden Causal Properties:** *Thermal Core* (♨️ Magma, ❄️ Frost, ⚡ Plasma), *Resonance Frequency* (🔊 Bass, 🔊 Mid, 🔊 Treble).  
    - **Reaction Trait (for known cards only):** Sound when exposed to "Aether Wave" (💥 Bang, 🎭 Warble, 🤖 Buzz).  
  - 2 posters for team groupings.  
  - Pens, paper, timer.  

  **Card Distribution:**  
  - 24 **Known Cards:** Fully visible traits, hidden properties, and reaction trait.  
  - 8 **Hidden Cards:** Only visible traits revealed (reaction hidden until scoring).  

  ---

  ### **Rules & Timeline (75 mins total)**  
  **1. Team Formation (5 mins):**  
  - Split class into **Team Surface** (groups by visible traits) and **Team Joint** (groups by hidden causal properties).  
  - Give each team:  
    - 24 known cards.  
    - Poster to map their taxonomy.  

  **2. Grouping Phase (25 mins):**  
  - **Team Surface:**  
    - Group organisms by **shared visible traits** (e.g., all "Glider + Crimson" together).  
    - *Feeling:* Satisfyingly natural groupings (e.g., all spherical, mossy organisms clustered).  
  - **Team Joint:**  
    - Group organisms by **shared hidden properties** (Thermal Core + Resonance Frequency).  
    - *Feeling:* Bizarre groupings (e.g., a mossy sphere (♨️+🔊Bass) grouped with a scaled cube (♨️+🔊Bass) *instead of* other mossy spheres with ❄️/⚡ cores).  
    - **Critical Twist:** Tell Team Joint the hidden properties *only for known cards*. They *must* use these to group, even if it feels unnatural.  

  **3. Prediction Phase (20 mins):**  
  - Reveal 8 **hidden cards** (visible traits only).  
  - Teams predict each hidden card’s **reaction trait** (💥, 🎭, 🤖) based on their groupings:  
    - **Team Surface:**  
      - Match hidden card to morphological group.  
      - Predict the **most common reaction** in that group. If tie, flip a coin.  
      - *Result:* Feels intuitive but often wrong due to hidden variation.  
    - **Team Joint:**  
      - Match hidden card to the causal group with the **closest visible traits**.  
      - Predict the reaction tied to that causal group (e.g., all ♨️+🔊Mid = 🤖 Buzz).  
      - *Result:* Feels arbitrary (e.g., "Why is this sphere grouped with cubes?") but more accurate.  

  **4. Scoring (10 mins):**  
  - Reveal hidden cards' reaction traits (predetermined by hidden properties).  
  - **+1 point** per correct prediction.  
  - **Expected Outcome:**  
    - **Team Joint** wins (6–7/8 correct) due to causal consistency.  
    - **Team Surface** loses (3–4/8 correct) due to morphological variability.  

  ---

  ### **Debrief (15 mins)**  
  **Map to Metaphysics:**  
  1. **Realism vs. Conventionalism:**  
     - Team Joint’s victory mirrors **scientific realism**—predictive power justifies unnatural groupings.  
     - Team Surface’s loss reflects **conventionalism**—intuitive categories fail under projection.  

  2. **Projectibility & "Gruesomeness":**  
     - Team Joint’s taxonomy supports induction by carving causal "joints" (e.g., ♨️+🔊Mid *always* = 🤖 Buzz).  
     - But this requires **gruesome groupings** (e.g., gliders and walkers together), violating common sense.  

  3. **Limitations:**  
     - **Cannot reproduce modal/essentialist claims** (e.g., "Thermal Core is *necessary* for sound reactions").  
       - *Why?* The game fixes causal laws; it doesn’t test counterfactual stability across worlds.  
     - **Predictable Pitfalls:**  
       - Students may resist Team Joint’s groupings as "cheating" (since hidden properties are given).  
       - Team Surface may overfit (e.g., creating tiny groups) to avoid errors, slowing them down.  

  ---

  ### **Card Design Example**  
  **Known Card Template (Front):**  
  ```  
  Organism #7  
  ☀️ Spherical | 🌱 Mossy | 🔴 Crimson | 🚶 Walker  
  Reaction: 🎭 Warble  
  ```  
  **Back (for Team Joint only):**  
  ```  
  Thermal Core: ❄️ Frost | Resonance: 🔊 Mid  
  ```  

  **Hidden Card Template (Front):**  
  ```  
  Organism #H3  
  🧊 Cubical | 💎 Crystalline | 🟢 Viridian | 🪁 Glider  
  Reaction: ?  
  ```  

  ---

  ### **Why This Works**  
  - **Tension Embodied:** Team Joint’s win feels "earned but unnatural," while Team Surface’s loss feels "fair but futile."  
  - **No Bird/Bats:** Novel traits (e.g., "Resonance Frequency") avoid tired examples.  
  - **Low Tech:** Runs with printed cards, pens, and posters.  

  **First-Time Warnings:**  
  - Team Joint may grumble about "nonsense" groupings—lean into this tension!  
  - Team Surface may blame "bad luck"—emphasize it’s about projectibility, not randomness.  
  - Keep timings strict; debate erupts in grouping phase.
