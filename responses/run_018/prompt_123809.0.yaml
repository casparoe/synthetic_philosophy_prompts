  I run a grad metaphysics seminar, about 14 people, one 75-minute session. I want an in-class game that makes them feel the tension in "do sciences carve nature at its joints?" — specifically, that the taxonomy which supports induction can feel completely wrong intuitively, and vice versa.

  Design a simulation with cards (I'll print them) describing fictional organisms with both visible traits and hidden causal properties. Split the class into two "research institutes": Team Surface groups specimens by obvious morphological similarity; Team Joint groups by hidden causal structure that predicts unknown traits. They each make predictions about hidden cards and score points. The rules should be arranged so that Team Joint wins on accuracy but keeps having to accept bizarre cross-groupings that violate common sense, while Team Surface feels right but accumulates prediction errors. Include a simple scoring system, the card layout, a timeline, and a debrief that maps what happened onto realism vs. conventionalism about kinds. Be frank about which part of the metaphysical debate — probably the modal/essentialist claim about real essences — this can't reproduce, and tell me what will predicatbly go wrong the first time I run it.

  Don't reuse the tired bird/bat examples. Frame it around projectibility and the risk of accepting "gruesome" groupings for the sake of predictive power, so it's not something they can just recite from intro courses. No bibliographies, no quotes, no citations. Keep it runnable with just paper and pens and maybe a timer.
