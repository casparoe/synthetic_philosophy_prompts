  As someone covering the ethics of scale in agricultural science, I need a precisely engineered thought experiment. Construct a scenario—realistic, confined to a single paragraph, free of science-fiction devices or named philosophers—in which a food-supply company must choose between two pest-management protocols. The cheaper protocol kills trillions of insects; the expensive one spares them. Engineer the case so that a linear moral-risk framework, which aggregates low-probability suffering across vast populations, mandates the expensive protocol, while an individual evidential-threshold framework, which requires each affected being to cross a confidence bar for sentience, rejects any obligation to switch. Specify that the per-insect probability of sentience is small—around one in a thousand—so that the divergence stems purely from the aggregation of scale against low unit confidence, not from disagreement about the science. After the scenario, walk through the reasoning each framework produces, identify the exact structural feature that forces them apart, and explain how a threshold theorist would attempt to dissolve the conflict by undermining the aggregation step rather than disputing the empirical premise. No citations, no bibliographies, no reference to obscure technical literature: the case should stand on its own.
