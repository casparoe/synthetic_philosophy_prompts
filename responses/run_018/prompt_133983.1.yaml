answer: |-
  Here’s the scenario:  

  A global food processor faces an invasive beetle threatening staple crops. Protocol Alpha costs $10 million annually, deploying targeted pheromone traps that spare insects but require constant recalibration. Protocol Beta costs $1 million, using broad-spectrum neurotoxins killing an estimated 1 trillion beetles yearly. Entomologists agree individual beetles exhibit complex behaviors, but the probability any single beetle possesses sentience—subjective experience of harm—is approximately 0.1%. The company must choose between protocols solely on ethical risk grounds, assuming identical crop protection.  

  **Reasoning Breakdown:**  
  - **Linear Moral-Risk Framework:** Aggregates low-probability suffering across all affected beings. Expected harm = (1 trillion insects) × (0.001 probability of sentience) = 1 billion expected sentient beings harmed. This catastrophic aggregate harm mandates choosing Alpha, despite its cost.  
  - **Individual Evidential-Threshold Framework:** Demands each entity independently meet a high confidence bar (e.g., >50% likelihood) for sentience to warrant moral consideration. A 0.1% probability per beetle falls far below this threshold. No obligation to spare insects arises; Beta is permissible.  

  **Divergence Trigger:**  
  The frameworks split over whether **low-probability risks (below an individual confidence threshold) can sum into high-probability moral obligations** across vast populations. Linear aggregation accepts this; thresholding rejects it.  

  **Threshold Theorist’s Dissolution Strategy:**  
  The theorist attacks aggregation itself, arguing:  
  *Probabilities below the evidentiary threshold (e.g., 0.1%) represent epistemically inert risks—they cannot compound into aggregate obligations because no single insect crosses the bar for "counting" morally. If we lack sufficient evidence to affirm sentience in any one beetle, multiplying this uncertainty across trillions doesn’t transform statistical noise into a duty; it remains speculative mass rather than moral weight.*  

  Thus, the conflict dissolves by denying the linear model’s core mechanism: summing sub-threshold probabilities.
