prompt: |-
  I'm a peer reviewer for an interdisciplinary history and sociology journal, and submissions increasingly invoke cultural values, religious doctrines, or ethical orientations as explanations for macro-level institutional shifts. The authors routinely conflate selecting a phenomenon as historically significant—value-relevance—with demonstrating that it was causally effective, and they rarely distinguish direct motivational causation from Weber's notion of elective affinity. I need a reusable evaluation procedure I can apply to any such claim in about fifteen minutes, without consulting primary texts or constructing a bibliography.

  Write the procedure as an ordered sequence of diagnostic questions, with each entry specifying: (a) what kind of evidence counts as a sufficient answer; (b) the exact point where a negative answer stops the evaluation with a specific verdict; and (c) the point where the question is irreducibly a judgment call that I, as reviewer, must explicitly sign off on rather than derive mechanically. The procedure must incorporate Weber's methodological distinctions—between adequacy at the level of meaning and adequacy at the level of causality, the reconstruction of subjective meaning, and the problem of explaining outcomes by reference to values—while remaining usable by someone without specialized Weber scholarship.

  Include a decision branch that separates direct causal claims from elective-affinity claims, since the evidentiary burdens differ. Then apply the full procedure to two proposed arguments:

  First, the claim that the Protestant work ethic functioned as a necessary causal factor in the emergence of modern rational capitalism in Western Europe, operating through the mediation of subjective economic rationality.

  Second, the claim that the widespread adoption of post-materialist values during the 1970s caused the decline of industrial labor unions, operating through a reduced collective willingness to endure economic risk.

  For each application, trace the answers the procedure produces, flag the step where judgment replaces procedure, and identify one result that a reviewer is likely to resist—whether because the procedure permits a causal claim that feels intuitively overstated, or rejects one that appears historically plausible.

  Finally, state explicitly what the procedure cannot do: which classes of cultural-causal arguments lie outside its scope, and which common objections—such as reductionism, functional explanation, or multicausality—it does not by itself resolve.
reasoning: |-
  We are creating an evaluation procedure for claims that invoke cultural values, religious doctrines, or ethical orientations as explanations for macro-level institutional shifts. The procedure is based on Weber's methodological distinctions and must be applicable in about 15 minutes without consulting primary texts. It should distinguish between direct motivational causation and elective affinity.

  The procedure will be an ordered sequence of diagnostic questions. Each entry specifies:
  (a) what kind of evidence counts as a sufficient answer
  (b) the exact point where a negative answer stops the evaluation with a specific verdict
  (c) the point where the question is irreducibly a judgment call

  We also need a branch for direct causal claims vs. elective-affinity claims.

  Finally, we apply the procedure to two examples and then state the limitations.

  Let's outline the procedure:

  **Preliminary Step: Identify the Claim Type**
  0. Is the claim about direct motivational causation (e.g., actors consciously adopted a value and acted to bring about an outcome because of that value) OR elective affinity (e.g., a cultural value and a social structure mutually reinforced each other without actors necessarily intending the outcome)?
     - This step is essential because the evidentiary requirements differ. The author should have specified, but if not, the reviewer must infer from context.

  **Core Procedure:**

  1. **Value-Relevance and Historical Significance:**
     - Question: Does the author clearly identify the cultural value, religious doctrine, or ethical orientation as a phenomenon of historical significance in the context of the institutional shift?
     - (a) Sufficient evidence: The text explicitly defines the cultural element and argues for its relevance to the period and society in question, possibly by showing it was a prominent discourse, a theme in texts, or a basis for institutional arrangements.
     - (b) Stop if negative: If the cultural element is not clearly identified or its historical presence is not established, stop with verdict: "The claim fails to establish the historical relevance of the cultural factor."
     - (c) Judgment call: None. This is about whether the author has made a minimal case for relevance.

  2. **Reconstruction of Subjective Meaning:**
     - Question: Does the author reconstruct how the cultural value was subjectively understood by historical actors in a way that could plausibly connect to the institutional shift?
     - (a) Sufficient evidence: The text provides evidence of actors expressing the value (e.g., in writings, speeches, recorded actions) and interprets what it meant to them in their context. This could be through primary sources or secondary sources that the author cites.
     - (b) Stop if negative: If there is no evidence of the subjective meaning of the cultural value to the actors, stop with verdict: "The claim fails to reconstruct the subjective meaning of the cultural factor, making it impossible to assess its potential causal role."
     - (c) Judgment call: Assessing the plausibility of the reconstruction is a judgment call. The reviewer must decide if the interpretation is reasonable given the evidence presented.

  3. **Adequacy at the Level of Meaning:**
     - Question: Is the connection between the cultural value and the actions leading to the institutional shift adequately meaningful? That is, is it understandable that actors holding this value would act in the way the author claims?
     - (a) Sufficient evidence: The author provides a coherent narrative or logical argument that explains how the value would lead to the actions. This might include typical patterns of behavior associated with the value or analogies to other known cases.
     - (b) Stop if negative: If the connection is not made intelligible (e.g., the value and the actions seem unrelated or contradictory), stop with verdict: "The claim fails to establish adequacy at the level of meaning; the link between the cultural factor and the actions is not intelligible."
     - (c) Judgment call: This step requires the reviewer to judge whether the connection is plausible. It is a judgment call because it relies on interpretive understanding.

  4. **Branch Point: Direct Causation vs. Elective Affinity**
     - Now we branch based on the claim type identified in step 0.

     **For Direct Motivational Causation:**
     4a. **Direct Causal Evidence:**
          - Question: Does the author provide evidence that actors were motivated by the cultural value to engage in the actions that caused the institutional shift?
          - (a) Sufficient evidence: Direct testimony from actors (e.g., diaries, letters, speeches) stating that they acted because of the value, or contemporaneous accounts attributing such motivation. Alternatively, a pattern of actions that can only be explained by the value and not by other factors.
          - (b) Stop if negative: If there is no evidence of motivation and the claim is one of direct causation, stop with verdict: "The claim fails to provide evidence for direct motivational causation."
          - (c) Judgment call: The reviewer must judge whether the evidence of motivation is convincing and not overridden by other factors.

     5a. **Causal Adequacy (Counterfactual and Comparative):**
          - Question: Does the author address the causal adequacy by considering whether the outcome would have been different without the cultural factor, or by comparing cases where the factor was present vs. absent?
          - (a) Sufficient evidence: The text includes counterfactual reasoning or comparative analysis (across time, regions, groups) that supports the necessity or major contributory role of the cultural factor.
          - (b) Stop if negative: If the claim asserts a necessary condition and no counterfactual or comparative evidence is provided, stop with verdict: "The claim fails to establish causal adequacy for the cultural factor as a necessary condition." If it's a contributory condition, then absence of such evidence weakens but does not necessarily stop the claim.
          - (c) Judgment call: The reviewer must judge the strength of the counterfactual or comparative evidence. This is a judgment call because counterfactuals are inherently speculative.

     **For Elective Affinity:**
     4b. **Structural Compatibility:**
          - Question: Does the author demonstrate a structural compatibility between the cultural value and the institutional form? That is, does the value reinforce the institution and vice versa?
          - (a) Sufficient evidence: The text shows how the value and the institution are mutually reinforcing, perhaps by showing that the institution operates more effectively when the value is present, or that the value becomes more widespread when the institution is in place.
          - (b) Stop if negative: If no such compatibility is shown, stop with verdict: "The claim fails to demonstrate elective affinity; no mutual reinforcement between the cultural factor and the institution is established."
          - (c) Judgment call: The reviewer must judge whether the evidence of compatibility is convincing.

     5b. **Historical Co-occurrence and Non-Random Association:**
          - Question: Does the author show that the cultural factor and the institutional shift co-occur in a way that is not random, and that they tend to appear together across cases or time?
          - (a) Sufficient evidence: The text provides evidence of co-occurrence in multiple contexts or over time, and rules out (or at least considers) alternative explanations for the association.
          - (b) Stop if negative: If there is no evidence of non-random co-occurrence, stop with verdict: "The claim fails to establish a non-random association between the cultural factor and the institutional shift, which is necessary for elective affinity."
          - (c) Judgment call: The reviewer must judge the strength of the association and whether alternative explanations have been adequately addressed.

  **Final Step for Both Branches:**
  6. **Alternative Explanations:**
     - Question: Does the author consider and rule out major alternative explanations (e.g., economic, political, technological factors) for the institutional shift?
     - (a) Sufficient evidence: The text discusses alternative explanations and provides reasons why they are insufficient or how the cultural factor interacts with them.
     - (b) Stop? Not necessarily. This step does not stop the evaluation but is a major weakness if absent. The verdict would be that the claim is weakened by not addressing alternatives.
     - (c) Judgment call: The reviewer must judge whether the alternative explanations have been adequately considered. This is a judgment call.

  **Overall Verdict:**
  - If the claim passes all the required steps (without stopping) and the judgment calls are acceptable, then the claim is methodologically sound. Otherwise, it has specific flaws.

  Now, we apply this procedure to two claims.

  **First Claim:** The Protestant work ethic functioned as a necessary causal factor in the emergence of modern rational capitalism in Western Europe, operating through the mediation of subjective economic rationality.

  **Step 0: Claim Type**
  - The claim uses "necessary causal factor" and "operating through the mediation of subjective economic rationality." This suggests direct motivational causation: Protestants were motivated by their work ethic to act in ways that led to capitalism.

  **Step 1: Value-Relevance and Historical Significance**
  - Evidence: The author would likely point to Weber's own work and historical studies showing the prominence of Protestant doctrines (e.g., Calvinism) in certain regions. Sufficient if the author establishes that the Protestant work ethic was a significant cultural phenomenon in the relevant time and place.
  - Verdict: Pass (assume the author does this).

  **Step 2: Reconstruction of Subjective Meaning**
  - Evidence: The author must show how historical actors (e.g., Calvinists) understood their work ethic. Weber provided such reconstructions. If the author references such sources, it's sufficient.
  - Verdict: Pass (assume the author reconstructs the meaning as Weber did: work as a calling, asceticism, accumulation as a sign of grace).

  **Step 3: Adequacy at the Level of Meaning**
  - Question: Is it meaningful that a Protestant work ethic would lead to economic rationality? Yes, because if one sees work as a calling and accumulation as a sign of divine favor, then systematic, rational pursuit of profit becomes understandable.
  - Verdict: Pass (judgment call: the connection is plausible).

  **Branch: Direct Causation (Step 4a and 5a)**
  - Step 4a: Direct Causal Evidence
     - Evidence: Weber provided evidence from religious texts and some historical accounts, but direct testimony from capitalists saying they were motivated by Protestant doctrine is scarce. The author might provide some evidence, but it's often indirect.
     - Judgment call: This is where a reviewer might resist. The evidence for direct motivation is often weak and debated. If the author does not provide strong direct evidence, we stop with: "The claim fails to provide evidence for direct motivational causation." But if we are lenient, we might accept indirect patterns.
     - Let's say the author does not provide strong direct evidence. Verdict: Stop with negative verdict.

  However, note that Weber himself did not claim a simple direct causation but also elective affinity. So perhaps the claim is overstated as direct causation. But the claim as stated says "necessary causal factor" and "operating through mediation of subjective economic rationality", which implies direct motivation.

  But let's continue as per the procedure.

  If we do not stop at 4a, we go to 5a.

  - Step 5a: Causal Adequacy (Counterfactual and Comparative)
     - Evidence: Weber used comparisons (e.g., Catholic regions vs. Protestant regions) and counterfactual reasoning (without Protestantism, capitalism might not have emerged). The author should provide such evidence.
     - Judgment call: The reviewer must judge if the comparative evidence is convincing. However, this is contested (e.g., capitalism also emerged in non-Protestant areas later, and there were other factors). If the author does not address this, stop. But if they do, it's a judgment call.

  Given that at step 4a we might have stopped, the claim as direct causation might fail.

  Alternatively, if we reinterpret the claim as elective affinity? But the claim says "causal factor" and "operating through", so it seems direct.

  But note: the procedure requires us to take the claim as stated. So we follow direct causation.

  **Result for First Claim:**
  - Likely fails at step 4a (direct causal evidence) because of the scarcity of direct motivational evidence. The verdict would be: "The claim fails to provide evidence for direct motivational causation."

  **Second Claim:** The widespread adoption of post-materialist values during the 1970s caused the decline of industrial labor unions, operating through a reduced collective willingness to endure economic risk.

  **Step 0: Claim Type**
  - The claim uses "caused" and "operating through a reduced collective willingness", which suggests direct motivational causation: individuals with post-materialist values were less willing to endure economic risk, which led to declining union participation.

  **Step 1: Value-Relevance and Historical Significance**
  - Evidence: The author must show that post-materialist values (e.g., emphasis on self-expression, quality of life) became widespread in the 1970s (e.g., through surveys like the World Values Survey). If the author does this, pass.

  **Step 2: Reconstruction of Subjective Meaning**
  - Evidence: The author must show how actors understood post-materialist values. Surveys often ask about priorities. If the author cites such evidence, it's sufficient.

  **Step 3: Adequacy at the Level of Meaning**
  - Question: Is it meaningful that post-materialist values would lead to reduced willingness to endure economic risk? Yes, because if one values quality of life and self-expression over economic security, one might avoid risky strikes or union militancy.
  - Verdict: Pass (judgment call: plausible).

  **Branch: Direct Causation (Step 4a and 5a)**
  - Step 4a: Direct Causal Evidence
     - Evidence: The author might provide survey data showing that individuals with post-materialist values are less likely to join unions or participate in strikes. But is this direct motivation? The author must show that the decline in union participation was due to these values. There might be other factors (e.g., deindustrialization, anti-union laws).
     - Judgment call: This is a point of resistance. The reviewer might feel that the evidence is correlational and not clearly causal. If the author does not provide evidence of motivation (e.g., interviews where workers say they left the union because of post-materialist values), then we might stop. But survey data might be accepted as indirect evidence of motivation.

     Let's assume the author provides survey data showing a correlation between post-materialist values and lower union participation, but not direct testimony. The reviewer might still pass it if they judge the correlation as indicative of motivation.

  - Step 5a: Causal Adequacy
     - Evidence: The author should compare periods (before and after the 1970s) or regions/countries with different levels of post-materialism. If they do, it's better. But if not, it weakens the claim.

  **Step 6: Alternative Explanations**
  - The author must consider other factors (e.g., economic changes, globalization). If they do not, the claim is weakened.

  **Result for Second Claim:**
  - It might pass step 4a if the reviewer accepts survey correlations as evidence of motivation, but a strict reviewer might not. This is a judgment call that a reviewer might resist because the causality might be overinterpreted from correlational data.

  **Limitations:**
  - The procedure cannot handle:
    - Arguments that are purely functional (i.e., the cultural factor exists because it serves a function for the institution) without specifying the causal mechanism.
    - Arguments that involve complex multicausality without clear prioritization of the cultural factor.
    - Arguments that are purely at the macro level without any microfoundations (i.e., no connection to individual actions).
    - Arguments that rely on unconscious or structural causation where subjective meaning is not accessible.
  - The procedure does not resolve:
    - Reductionism: It does not prevent the author from reducing complex phenomena to a single cultural cause, but step 6 (alternative explanations) helps.
    - Functional explanation: The procedure does not explicitly address functionalist reasoning.
    - Multicausality: The procedure checks if the author considers alternative explanations, but it does not require the author to specify how multiple causes interact.

  Now, we write the procedure as a sequence and then apply it to the two claims.
answer: |-
  Below is a reusable 15-minute evaluation procedure for assessing claims that invoke cultural values, religious doctrines, or ethical orientations as explanations for macro-level institutional shifts. The procedure incorporates Weber's core methodological distinctions—**value-relevance** (selecting a phenomenon as significant) vs. **causal adequacy** (demonstrating it was effective), **subjective meaning** (reconstructing actors' interpretations), and **direct motivation** vs. **elective affinity** (non-causal mutual reinforcement). It is designed for efficiency: no primary text consultation or bibliography construction is needed, and it flags steps requiring reviewer judgment.  

  ---

  ### **Evaluation Procedure: Diagnostic Questions**  
  *Ordered sequence—stop at first negative verdict unless specified. "Judgment call" steps require explicit reviewer justification.*  

  1. **Claim Specification and Type**  
     - *Question:* Does the author clearly distinguish whether the claim is about (a) **direct motivational causation** (cultural values directly motivated actions causing the shift), or (b) **elective affinity** (cultural values and institutions reinforced each other without direct motivation)?  
     - *(a) Sufficient evidence:* Explicit labeling (e.g., "motivated by," "driven by" for direct causation; "aligned with," "reinforced by" for affinity) or unambiguous contextual cues.  
     - *(b) Stop if negative:* Verdict: **"Unclear causal mechanism—claim cannot be evaluated."**  
     - *(c) Judgment call:* None.  

  2. **Value-Relevance Establishment**  
     - *Question:* Does the author establish the cultural value as historically significant (Weberian *value-relevance*) in the context?  
     - *(a) Sufficient evidence:* Demonstrates the value was documented in the period (e.g., via contemporary texts, discourse analysis, or credible secondary sources) and argues why it matters for the institutional shift.  
     - *(b) Stop if negative:* Verdict: **"Value-relevance not established—claim conflates significance with causation."**  
     - *(c) Judgment call:* Assessing historical significance (e.g., "Was this value *truly* salient?"). Reviewer must explicitly justify.  

  3. **Reconstruction of Subjective Meaning**  
     - *Question:* Does the author reconstruct how historical actors *subjectively understood* the cultural value?  
     - *(a) Sufficient evidence:* Evidence of actor interpretations (e.g., quotes from diaries, sermons, or oral histories; symbolic actions; or analysis of rituals/practices).  
     - *(b) Stop if negative:* Verdict: **"Inadequate reconstruction of subjective meaning—no basis for causal analysis."**  
     - *(c) Judgment call:* Evaluating plausibility of the reconstruction (e.g., "Is this interpretation reasonable given the evidence?"). Reviewer must explicitly justify.  

  4. **Adequacy at the Level of Meaning**  
     - *Question:* Is the link between the cultural value and actor behavior *meaningfully adequate* (i.e., would contemporaries recognize it as coherent)?  
     - *(a) Sufficient evidence:* Logical narrative showing how the value could inspire specific actions (e.g., "Doctrine X encouraged behavior Y because..."), supported by period-appropriate reasoning.  
     - *(b) Stop if negative:* Verdict: **"Meaning inadequacy—connection is unintelligible or anachronistic."**  
     - *(c) Judgment call:* Assessing coherence (e.g., "Is this link culturally plausible?"). Reviewer must explicitly justify.  

  5. **Branch: Direct Motivation vs. Elective Affinity**  
     - *If direct motivational causation (from Step 1):*  
       - **5a. Causal Adequacy (Motivation)**  
         - *Question:* Is there evidence the value *directly motivated* actions causing the shift?  
         - *(a) Sufficient evidence:* Actor testimony (e.g., "I did Y because of value X"), temporal precedence of value adoption, or behavioral patterns explicable only by the value.  
         - *(b) Stop if negative:* Verdict: **"No evidence for motivational causation—affinity may apply, but direct claim fails."**  
         - *(c) Judgment call:* Deciding if evidence overrides alternative motivations (e.g., economic necessity). Reviewer must explicitly justify.  
       - **5b. Counterfactual/Comparative Check**  
         - *Question:* Does the author address whether the shift would likely occur *without* the value?  
         - *(a) Sufficient evidence:* Cross-case comparisons (e.g., regions without the value lacked the shift) or reasoned counterfactuals.  
         - *(b) Stop if negative (for necessary causes only):* Verdict: **"Necessary causation unsubstantiated—insufficient counterfactual/comparative support."**  
         - *(c) Judgment call:* Evaluating counterfactual plausibility. Reviewer must explicitly justify.  
     - *If elective affinity (from Step 1):*  
       - **5c. Affinity Mechanism**  
         - *Question:* Does the author specify *how* the value and institution reinforced each other?  
         - *(a) Sufficient evidence:* Demonstration of mutual reinforcement (e.g., "Value X legitimized institution Y, which amplified X via...").  
         - *(b) Stop if negative:* Verdict: **"Affinity mechanism unspecified—claim is descriptive, not explanatory."**  
         - *(c) Judgment call:* Assessing if mechanism is non-tautological. Reviewer must explicitly justify.  
       - **5d. Corroboration of Co-Occurrence**  
         - *Question:* Is there evidence of non-random co-occurrence between the value and the shift?  
         - *(a) Sufficient evidence:* Data showing parallel diffusion (e.g., value spread precedes institutional change), or absence of the shift where the value was weak.  
         - *(b) Stop if negative:* Verdict: **"No evidence for systematic affinity—correlation not established."**  
         - *(c) Judgment call:* Deciding if co-occurrence is coincidental. Reviewer must explicitly justify.  

  6. **Alternative Explanations**  
     - *Question:* Does the author address major non-cultural alternatives (e.g., economic, political, technological)?  
     - *(a) Sufficient evidence:* Ruling out alternatives (e.g., "Shift occurred despite economic conditions Z") or integrating them (e.g., "Values interacted with technology T").  
     - *(b) Stop if negative:* Not automatic—weakens but does not invalidate. Verdict: **"Claim is incomplete—fails to address alternative explanations."**  
     - *(c) Judgment call:* Weighing adequacy of alternative explanations. Reviewer must explicitly justify.  

  **Final Verdicts:**  
  - **Pass:** All steps satisfied (judgment calls resolved positively).  
  - **Revise:** Partial failure (e.g., Step 6 negative but others pass).  
  - **Reject:** Any stop verdict (Steps 1–5).  

  ---

  ### **Application to Example Claims**  

  #### **First Claim**  
  *"The Protestant work ethic functioned as a necessary causal factor in the emergence of modern rational capitalism in Western Europe, operating through the mediation of subjective economic rationality."*  

  1. **Step 1 (Type):** Direct motivational causation (claims "necessary causal factor" and "mediation of subjective... rationality").  
  2. **Step 2 (Value-Relevance):** Pass. Author likely cites Weber/historiography on Calvinist doctrines' prominence.  
  3. **Step 3 (Subjective Meaning):** Pass. Author reconstructs Puritan "calling" and asceticism (e.g., linking salvation anxiety to disciplined work).  
  4. **Step 4 (Meaning Adequacy):** **Judgment call.** *Plausible*: Work ethic → economic rationality is coherent. *But reviewer resists:* Weber's "spirit" of capitalism may be overinterpreted; actors may not have seen work as "rational" in modern terms.  
  5. **Step 5a (Direct Motivation):** **Stop verdict.** *Negative*: No direct evidence (e.g., diaries show Puritans sought salvation, not capitalism). Verdict: **"No evidence for motivational causation."** *Resistable?* Yes—historians often infer motivation indirectly, but procedure halts due to evidential gap.  
  6. **N/A (Stopped).**  

  **Outcome:** Reject. Fails Step 5a.  

  ---

  #### **Second Claim**  
  *"The widespread adoption of post-materialist values during the 1970s caused the decline of industrial labor unions, operating through a reduced collective willingness to endure economic risk."*  

  1. **Step 1 (Type):** Direct motivational causation (claims "caused" and "operating through" reduced willingness).  
  2. **Step 2 (Value-Relevance):** Pass. Author cites Inglehart's post-materialism (e.g., surveys prioritizing self-expression over material security).  
  3. **Step 3 (Subjective Meaning):** Pass. Survey data reconstructs values (e.g., youth prioritizing "meaningful work" over wages).  
  4. **Step 4 (Meaning Adequacy):** **Judgment call.** *Plausible:* Post-materialism → lower risk tolerance for strikes is intelligible. *But reviewer resists:* "Risk avoidance" may conflate values with structural factors (e.g., unemployment).  
  5. **Step 5a (Direct Motivation):** **Judgment call.** *Mixed evidence:* Surveys link values to individualism, not explicit union avoidance. *Reviewer resists:* Correlation ≠ causation; procedure permits if "behavioral patterns" (e.g., strike participation decline) are accepted as evidence.  
  6. **Step 5b (Counterfactual):** Pass. Author compares pre/post-1970s or high-/low-post-materialist regions.  
  7. **Step 6 (Alternatives):** **Judgment call.** *Weak:* Often ignores deindustrialization/globalization. Verdict: **"Incomplete—alternatives underdeveloped."**  

  **Outcome:** Revise. Passes Steps 1–5 but fails Step 6.  

  ---

  ### **Explicit Limitations**  
  **Arguments outside scope:**  
  1. **Purely functionalist claims** (e.g., "Values exist to stabilize institutions")—procedure requires causal/affinity mechanisms.  
  2. **Macro-cultural determinism** (e.g., "Confucian values caused Asian development")—fails if subjective meaning (Step 3) is unaddressed.  
  3. **Diffuse cultural effects** (e.g., "Secularization eroded social trust")—fails if adequacy at level of meaning (Step 4) is unintelligible.  

  **Unresolved objections:**  
  - **Reductionism:** Procedure critiques conflation of value-relevance/causality (Step 2) but cannot prevent cultural factors overriding other causes.  
  - **Functional explanation:** Step 5c (affinity mechanism) requires non-teleological reasoning but does not ban functional logic.  
  - **Multicausality:** Step 6 flags neglected alternatives but does not force integration (e.g., specifying how values interact with economics).  
  - **Temporal ambiguity:** Does not resolve "chicken-or-egg" problems in affinity claims (Step 5d).  

  **Time-bound constraints:**  
  - Assumes author provides *all* evidence in the submission; cannot detect missing sources.  
  - Cannot adjudicate historiographical debates (e.g., Protestant work ethic critiques) without primary texts.
