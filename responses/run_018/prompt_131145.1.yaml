  First, I need to anticipate the most damaging objections. The top concern must be causal identification - how can we prove inflated reports were the key mechanism? This aligns perfectly with the audience's obsession with identification. The reply should emphasize archival evidence and natural experiments, but I'll note the weakness in quantifying distortion's exact contribution.

