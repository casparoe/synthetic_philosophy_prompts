  Here’s a reading that wrestles with your core question—whether *The Island of Doctor Moreau* portrays species as performative or essential—using the "species problem" lens and key scenes:

  **The Argument for Performativity (Nominalism):**  
  Wells vividly shows species identity as something *enacted*, not innate. The Law isn't biological instinct; it's a rigid script imposed by Moreau and desperately performed by the Beast Folk. Their daily recitations ("Are we not Men?") are rituals of belonging, reinforcing a human identity defined by prohibition (no quadrupedalism, no meat-eating, no scent-tracking). The communal chanting scene demonstrates this powerfully: identity is a collective performance, a shared incantation against their animal forms. When the Leopard Man violates the Law (reverting to four legs, hunting rabbits), his punishment isn't just physical death; he's excommunicated from the "species" category of "Man" by the other Beast Folk during the Hunt. This highlights how the Law functions like a social contract—membership depends on adherence to the performance. The Hyena-Swine’s later rebellion further underscores this: rejecting the Law isn't just breaking rules, it's rejecting the *performance of humanity* itself. In these moments, Wells seems to suggest that "human" is a role sustained by relentless, conscious effort.

  **The Pushback: Essentialism and the Tragedy of "In-Betweenness":**  
  Yet the novel relentlessly undermines this performative ideal. The Beast Folk's suffering isn't merely social ostracization; it's a profound bodily and existential torment. Prendick observes their constant, agonizing struggle against physical impulses—their hands ache for paws, their mouths water for blood, their postures strain against gravity. This isn't failed acting; it's biology reasserting itself. The Law's ultimate collapse isn't due to laziness, but because the underlying biological reality—the "animal" essence shaped by Moreau's crude surgery—cannot be permanently overwritten. The poignant degradation of the Sayer of the Law, who clings to the words while losing all understanding, shows performance crumbling when divorced from biological coherence. Their suffering stems precisely from being forced into a category ("human") whose biological foundations (their essential animal physiology and instincts) don't match the performance demanded. Wells forces us to ask: Can mere performance truly define a species if the body screams against it? The visceral horror lies in this irreconcilable gap. It suggests that while categories might be human constructs, the biological realities underlying them (like anatomy, instinct, pain) are brutally real and impose limits.

  **The Verdict - Where Wells Lands:**  
  Wells masterfully *uses* the spectacle of performative identity to ultimately argue for the crushing power of biological essentialism. The Law is a fascinating nominalist experiment—an attempt to *create* "humanity" through ritual and prohibition. Its spectacular, inevitable failure, however, demonstrates that for Wells, biology (the "stubborn beast flesh") constitutes an inescapable essence. The Beast Folk's reversion isn't a choice to stop performing; it's a biological imperative breaking through the flimsy facade of ritual. Their suffering isn't just from being "in-between" social categories; it's the agony of bodies violently reshaped and instincts unnaturally suppressed. The novel suggests performance can impose a temporary order, but it cannot fundamentally rewrite the essential nature determined by evolution and physiology. The horror lies in the victory of the beast within.

  **Verdict: The novel ultimately sides with essentialism, portraying biological reality as an inescapable force that fatally undermines the performative construction of species identity.**
