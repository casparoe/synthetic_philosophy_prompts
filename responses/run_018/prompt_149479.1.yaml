  Hmm...the user's core insight seems spot-on: Lange's trial-and-error model likely assumes knowledge is fundamentally explicit and codifiable. When planners adjust prices based on shortages/surpluses, they're treating economic knowledge like data points rather than skills. Hayek's "local knowledge" argument gains epistemological depth when seen through Polanyi - it's not just that knowledge is scattered, but that it's often inarticulate muscle-memory of market participants.

  The redesign question is thorny. Could localized planning nodes capture tacit knowledge? I suspect any attempt would either (a) become so decentralized it replicates markets, or (b) require so much interpersonal trust/communication that it stops being scalable planning. The user might be probing whether Polanyi's framework offers socialism an escape hatch from Hayek's critique - but the answer seems negative. 

  Where the two frameworks diverge is interesting: cybernetics is technocratic (focused on system design) while Polanyi is anthropological (focused on human knowing). They converge in seeing markets as organic coordination mechanisms, but cybernetics misses the embodied dimension Polanyi emphasizes. 

