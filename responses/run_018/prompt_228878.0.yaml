  Okay, let me start by understanding the user's request. They're presenting a paper on strong longtermism at a moral philosophy colloquium and need a prep sheet for Q&A. Their thesis focuses on decisions where the long-term future is the dominant factor, but they've made two key departures: using a trajectory-versus-content strategy and avoiding irreversible losses instead of pursuing distant goods. 

