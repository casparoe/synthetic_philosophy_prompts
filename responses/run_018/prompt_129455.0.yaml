answer: |-
  Here’s your boundary problem decision tree handout — logical, grad-casual, with purposeful gaps and a sneaky niche branch.  

  ---

  ### **The Boundary Problem: Who’s In the Demos?**  
  *A Taxonomy via Logical Space*  

  **Start here → Q1: Can membership apply to entities that *don’t* experience welfare?**  
  - **YES** → Jump to *Niche Framing* below.  
  - **NO** → Proceed to Q2.  

  **Niche Framing: What if it’s an artificial agent (e.g., advanced AI) that is *persistently governed by law* but has *no welfare interests*?**  
  *(Branch ends here → Position: **Governed Non-Sentients**. Status: **Ugly gap** — theorists avoid this like expired coffee.)*  

  **Q2: Is being *subjected to coercive law* necessary for membership?**  
  - **YES** → Position: **All-Subjected Principle** (You’re in if laws bind you).  
  - **NO** → Proceed to Q3.  

  **Q3: Is being *causally affected* (e.g., by policies, econ spillovers) sufficient for membership?**  
  - **YES** → Proceed to Q4.  
  - **NO** → Proceed to Q5.  

  **Q4: Must this causal effect involve a tangible *stake* (e.g., taxes, rights vulnerability)?**  
  - **YES** → Position: **Stakeholder Principle** (e.g., tax-paying expats).  
  - **NO** → Position: **All-Affected Interests** (Anyone impacted, even distantly).  
    *Ambiguity Alert: Can’t cleanly split Stakeholder vs. All-Subjected for cases like tax-paying expats (subjected? affected? both?).*  

  **Q5: Can *shared nationality* substitute when neither law nor causal effect applies?**  
  - **YES** → Position: **Co-Nationalist Principle** (Borders based on shared identity).  
  - **NO** → Position: **Territorial-Only** (Residency = membership, full stop).  

  ### Unoccupied Leaves (Theoretical Ghost Towns)  
  1. **Future-Only Affected**  
     - *The gap*: People *only* affected by future policies (e.g., climate change babies).  
     - *Status*: **Unexplored** — everyone agrees they matter... but no one agrees *how*.  
  2. **Non-Sentient AI Governed by Law**  
     - *The gap*: Algorithms regulated as legal "persons" but lacking consciousness.  
     - *Status*: **Incoherent** — can’t have rights without interests (yet).  

  ### Tree Summary (8 Leaves)  
  1. Governed Non-Sentients (Niche)  
  2. All-Subjected  
  3. Stakeholder  
  4. All-Affected Interests  
  5. Co-Nationalist  
  6. Territorial-Only  
  7. Future-Only Affected (Gap)  
  8. Non-Sentient AI Governed (Gap)  

  ---

  **Why this works for class:**  
  - Nodes are self-testing (e.g., "causally affected" needs no prior jargon).  
  - Ambiguity flagged where logical space collapses (stakeholder/subjected).  
  - Gaps highlight where theory gets lazy or messy.  
  - Niche branch forces debate about law’s role absent welfare.  

  **Typo?** "Demnos" in your query stays as a inside joke :)
