answer: |-
  Here's the proposal draft:

  1.  **Core Question:** Can acausal trade (cooperation via mutual simulation) function between agents whose fundamental ontologies are mutually exclusive and unrecognizable to each other (e.g., one perceives itself as biological/physical, the other as a purely formal pattern)?
  2.  **Existing Gap:** Standard superrationality/UDT frameworks implicitly assume shared priors or recognizable agent-types, dodging the core problem of agents *utterly failing to see each other as the same kind of thing* needed for mutual simulation.
  3.  **Approach:** Purely conceptual analysis: map out specific, stark ontological divides, rigorously define "recognition" within each, and probe whether *any* bridge for mutual prediction/benefit remains possible without shared ground.
  4.  **Success/Failure:** Success means finding *any* plausible mechanism for cooperation across such a divide; failure means concluding cooperation necessarily collapses without *some* minimal shared ontological premise (like being embedded in the same structure).
  5.  **Scope Reality Check:** One semester is enough to clarify the problem space, dissect 2-3 concrete ontological clash scenarios, and get a tentative "leaning" one way or the other – not for a full formal model or definitive proof.
