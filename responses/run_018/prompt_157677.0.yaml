  ---

  ### **Part 1: Are Coherence Constraints *Epistemic* Norms? (Not Just Pragmatic)**  
  **Probability: 65%**  
  - **The Case For Epistemic Force**: Dutch-book vulnerability reveals inconsistent belief states violating probability axioms. For epistemic realists (e.g., Joyce 1998), this inconsistency isn't just about money—it reflects inaccuracy in representing *logical/modal relationships*. If your credences can be "pumped" for sure loss, you're failing to track truth-conditions (e.g., believing A and B while disbelieving A∧B is *objectively* flawed).  
  - **The Pragmatic Counter**: Ramsey (1931) framed Dutch books as instrumental: "If you do this, you lose money." No deeper epistemic sin.  
  - **Why 65%?** The epistemic view dominates modern formal epistemology, but the instrumental critique lingers. Shifting this to 90%+ would require proving that *all* rationality norms reduce to truth-aptness—not just utility.  

  ---

  ### **Part 2: Do Imprecise Credences Block Dutch Books? Or Smear Vulnerability?**  
  **Probability: 40% (that they block books entirely)**  
  - **The Block Argument**: Imprecise credences (represented as sets of probability functions) avoid sharp probabilities for ambiguous propositions. No *single* incoherent function → no sure-loss bet (Levi 1974). Your bookie can't pin down your "true" P(φ) to exploit.  
  - **The Smear Argument**: Imprecise credences invite *diachronic* Dutch books. Dynamic consistency requires uniform rules for updating sets (e.g., "generalized conditioning"). Violate these (e.g., updating different functions in the set erratically), and a bookie exploits you across time (Seidenfeld & Wasserman 1993). Worse: your imprecision might itself be inconsistent.  
  - **Why 40%?** Imprecision delays exploitation but doesn't prevent it under pressure. **Least sure here**—I need a proof that *no possible* Dutch book strategy works against *any* coherent imprecise model. Current math suggests vulnerability shifts form.  

  ---

  ### **Part 3: Do Beliefs About Fiction/Modal Realities Fall Under Coherence?**  
  **Probability: 70%**  
  - **The Inclusion Argument**: Betting coherence applies to *any proposition with truth conditions* (Lewis 1980). "My world is a story" has a truth value (even if unknown). We bet on non-actual possibilities constantly (e.g., "If FTL travel exists, stocks in X soar"). Fictional truths (e.g., "Sherlock lived in London") are assessable via the fiction's rules.  
  - **The Exclusion Argument**: Modal/fictional claims lack empirical resolvability—bets can't be settled. Dutch books require payouts tied to evidence (Jeffrey 1983). If we can't verify whether her world *is* fictional, the bet is void.  
  - **Why 70%?** Coherence norms govern *all* belief-like states. But if fictions lack objective truth-makers (e.g., "Watson's war wound" is ambiguous), they might escape strict probabilism.  

  ---

