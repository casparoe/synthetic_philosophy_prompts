prompt: |-
  I am preparing a paper on assertion norms and have become convinced that much of the literature rests on a framing error. The knowledge norm holds that one should assert p only if one knows p; since knowledge entails belief, and in non-Gettier cases entails truth, this seems to make both the belief norm (assert only what you believe) and the truth norm (assert only what is true) logically redundant. They are not competing rules but nested conditions—knowledge is the strictest filter, and satisfying it automatically satisfies the other two. If so, treating them as rival norms of assertion is like treating "no felons" and "no convicted thieves" as rival hiring criteria when the latter is a subset of the former. Yet this raises a tension I cannot dissolve. In scientific practice, researchers routinely assert results derived from institutional verification pipelines—statistical outputs, peer-reviewed datasets—without having personally reproduced every step. Their mental state is belief grounded in testimony and division of labor, not first-person knowledge of each claim. If the knowledge norm is primary, these assertions appear impermissible, which seems to condemn ordinary scientific discourse. Does this mean the norm must be indexed to a kind of collective or distributed knowledge, or does it instead reveal that the belief norm was never a redundant subset but an independent constraint that permits assertions precisely when personal knowledge is absent? Please separate what is established in the philosophy of language and social epistemology from views that remain actively disputed, and avoid presenting any one account of testimonial knowledge transmission as the settled consensus.
reasoning: |-
  Okay, the user is working on a paper about assertion norms and has identified what they believe is a framing error in the literature. They point out that the knowledge norm (KN) seems to make the belief and truth norms redundant since knowledge entails both belief and truth (in non-Gettier cases). They compare it to redundant hiring criteria like "no felons" vs "no convicted thieves." 

  But then they raise a tension: scientists often assert findings based on institutional processes without personal verification. If KN is primary, these assertions might be impermissible, which would condemn standard scientific practice. The user is torn between two solutions: (1) indexing the norm to collective knowledge, or (2) treating the belief norm as independent when personal knowledge is absent.

  I need to separate established views from disputed ones. In philosophy of language, it's established that KN is the dominant view, but contextualism and assurance theories complicate it. Redundancy is acknowledged but debated—some see norms as hierarchical, others as functionally distinct. In social epistemology, testimony is widely accepted as a knowledge source, but mechanisms are contested. Distributed knowledge frameworks exist but aren't consensus.

  The user might be implicitly seeking to resolve the scientific practice tension without abandoning KN's primacy. Their deeper need could be reconciling theory with real-world discourse. I should highlight that KN defenders have responses (testimony as knowledge transmission, role-based norms), while noting alternatives like the assurance view. The key is presenting options neutrally, showing how each handles the tension.

  I'll structure the response: First, clarify the redundancy point (established vs. disputed). Then dissect the science case through testimonial knowledge debates. Finally, outline solutions without favoring one—distributed knowledge vs. belief norm independence—stressing ongoing disputes. The goal is to equip the user with philosophical tools, not push an agenda.
answer: |-
  Your critique touches on deep issues in assertion norms and social epistemology. I'll separate established points from ongoing disputes, addressing your framing concern and the scientific practice tension.

  ### Established Framework in Philosophy of Language
  1.  **KN Dominance**: The Knowledge Norm (KN: "Assert p only if you know p") is widely defended (Williamson, DeRose, Hawthorne) and treated as the *primary* candidate for the constitutive norm of assertion.
  2.  **Logical Entailment**: It's uncontroversial that knowledge entails belief and truth (setting aside Gettier complications). Thus, satisfying KN *entails* satisfying both the Belief Norm (BN: "Assert p only if you believe p") and the Truth Norm (TN: "Assert p only if p is true").
  3.  **Hierarchy vs. Competition**: Philosophers generally *acknowledge* this entailment relationship. The debate isn't typically framed as KN, BN, and TN being *logically incompatible* rivals. Instead:
      *   KN proponents argue BN and TN are *insufficient* (e.g., one can believe a true proposition by luck, which shouldn't warrant assertion).
      *   BN/TN proponents argue KN is *too strong* (leading to your scientific practice objection).
      *   **Established Point:** The norms are understood hierarchically: KN is the strongest, BN weaker, TN weakest. KN proponents argue BN and TN are *derivative* or describe necessary-but-insufficient conditions, not independent constitutive norms.
  4.  **Redundancy Claim**: Your "redundancy" observation is correct *within the KN framework*: if KN is the constitutive norm, BN and TN are redundant *as independent constitutive norms* because any assertion satisfying KN automatically satisfies them. KN proponents accept this.

  ### The Scientific Practice Challenge: Social Epistemology
  Your core tension arises here, involving unresolved debates:

  1.  **Testimonial Knowledge Transmission (Established Framework):**
      *   **Core Acceptance:** It's uncontroversial that knowledge *can* be acquired through testimony (e.g., learning history from a textbook). Social epistemology investigates *how* this works.
      *   **No Consensus Mechanism:** There is *no settled consensus* on the exact mechanism:
          *   **Reductionism:** Testimonial justification reduces to inductive inference about speaker reliability (e.g., Hume, Fricker).
          *   **Non-Reductionism/Transmission:** Testimony can *transmit* knowledge/justification if the speaker has it, without the hearer needing independent inductive evidence (e.g., Burge, McDowell, Goldberg - with variations).
          *   **Assurance View:** Assertion involves inviting trust, making testimony a distinct source of knowledge (Moran).
      *   **Key Established Point for Science:** Researchers relying on institutional testimony *are* generally presumed to acquire *knowledge* (not just belief) *if* the institutional process is reliable and the researcher is justified in trusting it. This is standard social epistemology applied to science (Hardwig, Kitcher).

  2.  **The Tension & Proposed Solutions (Actively Disputed):**
      The scientific case challenges KN *only if* the researcher *lacks knowledge*. The core dispute is whether institutional reliance *does* yield knowledge for the asserter.

      *   **KN Defense (Dominant Response):** KN defenders argue a scientist *does know* p based on testimony and institutional division of labor, provided they have:
          *   Justified trust in the competence/reliability of the source/review process.
          *   An understanding of the result's significance within the field (minimal grasp).
          *   No undefeated defeaters.
          *   *This satisfies KN.* The scientist knows "p" via testimony, making their assertion permissible under KN. KN isn't limited to *first-person, non-testimonial* knowledge (Goldberg, Lackey). Your framing "not first-person knowledge" doesn't equate to "not knowledge."
      *   **Distributed/Group Knowledge (Active Area of Research):** Some argue scientific knowledge is inherently collective (e.g., Bird, Fagan). On this view, the *individual* scientist asserts based on their role in the collective knowing system. Whether this requires modifying KN to a *group* knowledge norm ("Assert p only if the relevant group knows p") or if individual testimonial knowledge suffices is debated. This approach accepts KN but expands the *bearer* of knowledge.
      *   **Alternative Norms as Primary (Response to Challenge):** Critics argue the scientific case shows KN is too strict:
          *   **Justified Belief/Reasonable Belief Norm:** Assert p only if you are justified/reasonably believe p (Lackey, Kvanvig). The scientist has highly justified belief via institutional warrant, even if they lack the robust "knowledge" status (e.g., due to complex chains they can't fully trace). *This directly challenges the redundancy claim:* BN (or JB) becomes an *independent* norm permitting assertions where KN isn't met.
          *   **Assurance View (Moran):** Assertion involves giving one's assurance. The scientist asserts based on their assurance *of the institutional process*, not necessarily their personal knowledge. The norm might concern sincerity and responsibility for the source.
          *   **Functional Norms (Pagin):** Norms might depend on the conversational context. Scientific assertion might be governed by institutional warrant norms, not a universal KN.

  ### Dissolving Your Tension: The Established Path vs. Alternatives
  1.  **KN Path (Widely Held):** The tension largely dissolves if the scientist *does* acquire testimonial knowledge. KN is satisfied, BN and TN are automatically satisfied but derivative. Redundancy holds. Scientific practice is permissible. The "filter" analogy holds: KN is the strictest filter, and science's processes are designed to ensure individuals *can* know via testimony/division of labor.
  2.  **Alternative Norms Path:** If one argues the scientist *lacks knowledge* despite justified belief, then the tension requires abandoning KN as the constitutive norm. BN (or JB) becomes non-redundant and primary in such contexts. Scientific practice reveals KN's inadequacy, making BN/JB an independent, less strict norm permitting assertions KN forbids. The "filter" analogy breaks; BN and KN are distinct filters with overlapping but non-identical conditions.

  ### Conclusion
  *   **Established:** KN is the dominant view; it entails BN and TN; BN and TN are generally seen as necessary but insufficient components or consequences of KN, not independent constitutive norms in the KN framework. Testimony is accepted as a knowledge source; scientists relying on institutional processes are *standardly taken* to acquire testimonial knowledge.
  *   **Actively Disputed:**
      *   Whether testimonial transmission in complex institutional settings *always* (or sufficiently) confers individual knowledge to satisfy KN in all scientific assertions.
      *   Whether the scientific case (and others) necessitates replacing KN with a weaker norm (like Justified Belief) or a contextual/functional norm, thereby making BN/JB an *independent* constitutive norm.
      *   Whether a robust account of group knowledge requires modifying KN itself.

  **Your insight about redundancy is correct *if KN holds*. The scientific challenge primarily tests whether complex testimony *really* delivers individual knowledge sufficient for KN.** If it does (as KN defenders argue), the redundancy stands and science is fine. If it doesn't (as KN critics argue), then a weaker, independent norm like Justified Belief is needed, breaking the redundancy. This remains a central dispute. Your paper could productively frame the debate around whether scientific practice reveals the *limits* of testimonial knowledge transmission for satisfying KN, or whether it exemplifies its success.
