answer: |-
  *(Adjusting glasses, leaning forward with sharp focus)*  
  Your pollution example reveals the core distinction. Country B's residents are *affected* by A's laws—but A exercises no *direct regulatory authority* over them. The factory operates under A's domestic jurisdiction; B's citizens aren't bound by A's legal apparatus. Algorithmic governance is fundamentally different: platforms construct bespoke, enforceable behavioral environments. When YouTube's algorithm suppresses certain content *for you specifically*, it's not mere impact—it's a curated rule-set governing your options, backed by design coercion (e.g., opacity, removal, shadow-banning). That’s not affectedness; it’s architecture-as-regulation.  

  **Settled in literature**:  
  1. Democratic legitimacy requires justifying coercion (e.g., Arrhenius, Abizadeh).  
  2. Affectedness alone is insufficient for demos membership—it’s overinclusive (e.g., 7 billion people "affected" by climate policy).  

  **Contested**:  
  Whether algorithmic power constitutes *political* coercion. I argue yes—it imposes enforceable norms without consent, akin to non-state sovereigns (Suzor's "governance by platform"). Critics counter that platforms lack the state’s monopoly on force (e.g., Morozov). My extension is heterodox, not consensus.  

  Your turn: how is algorithmic coercion meaningfully distinct from state coercion?
