answer: |-
  This terminological asymmetry reveals profound philosophical tensions within archaeology's conceptual framework. Let's unpack the presuppositions and implications:

  **I. Underlying Philosophical Commitments**
  1.  **Essentialist Ontology of Societies:** Labeling events as "collapse" often implies an entity ("the palace economy," "Rapa Nui society") possessing core, defining characteristics (monumentality, divine kingship, specific literacy). Their disappearance signifies the "death" of that entity. The Maya case, conversely, assumes a more fluid, relational identity defined by enduring cultural practices or population continuity, where institutions change form but the core society persists.
  2.  **Normative Evaluation Masquerading as Description:** "Collapse" inherently carries connotations of *failure*, decline, and loss – a negative normative judgment. Terms like "reorganization" or "transformation" are more neutral or even imply adaptive change. This reflects:
      *   **Teleological Benchmarks:** Judging societies against an implicit scale of socio-political complexity (urbanism, monumentality, writing, hierarchy). Losing these traits is seen as regression or failure. Bronze Age palace systems and Rapa Nui monumentality represent peaks on this scale; Maya lowland cities fit this too, but the emphasis shifts to enduring cultural elements elsewhere.
      *   **Institutional Functionalism:** Prioritizing specific hierarchical functions (centralized bureaucracy, elite craft/art production, long-distance exchange under elite control). The disappearance of *these specific functions* constitutes collapse for Bronze Age societies and Rapa Nui. For the Maya, the focus shifts to broader societal functions (agriculture, kinship, local ritual) deemed to persist.
      *   **Spectator Bias:** The perspective is often external and retrospective, defining "success" by the persistence of visible, archaeologically legible institutions valued by modern scholars (writing, palaces, monuments). The lived experience of populations adapting or finding new forms of resilience is obscured.
  3.  **Discontinuity vs. Continuity Bias:** "Collapse" emphasizes rupture and discontinuity. "Reorganization" emphasizes underlying continuity and adaptation. The choice of term depends on which archaeological evidence (abandoned cities vs. rural persistence, cessation of elite symbols vs. continuation of domestic crafts) is privileged and deemed definitive of societal identity.

  **II. Compatibility with Anthropological Relationalism?**
  The practice is **largely incompatible** with a strict anthropological relational view ("societies never fail, only change"). This view sees societies as constantly evolving networks of relationships and practices. "Collapse" language imposes artificial endpoints based on the disappearance of *specific* institutions deemed essential by the observer, not necessarily by the society itself. The asymmetry arises because:
  *   **Bronze Age & Rapa Nui:** The relational network is defined *by* the centralized, monumental, literate institutions. Their dissolution is seen as the dissolution of the network itself.
  *   **Classic Maya:** The relational network is defined more broadly (e.g., Maya language groups, agricultural practices, cosmological concepts persisting beyond divine kingship). Institutional changes are seen as shifts *within* the network.

  **III. Revisions Under a Uniform Non-Normative Framework ("Systemic Change")**
  Adopting a consistent framework of non-normative systemic change would require fundamental shifts:

  1.  **Archaeological Reporting Norms:**
      *   **Language:** Replace "collapse," "decline," "failure," "dark age" with neutral terms: *systemic transformation, reorganization, reconfiguration, decentralization, settlement shift, institutional change, resilience adaptation.*
      *   **Focus:** Shift emphasis from diagnosing "failure" to:
          *   Tracing the *processes* of change (speed, triggers, feedback loops).
          *   Identifying *resilience* and *continuity* alongside change (e.g., persistence of technologies, domestic rituals, local social structures, population movements).
          *   Examining *diverse experiences* across social strata and regions.
          *   Analyzing the emergence of *new* socio-political and economic configurations.
      *   **Causality:** Frame explanations in terms of systemic dynamics, thresholds, and adaptive cycles, avoiding inherently normative causal language (e.g., "environmental degradation *caused* collapse" vs. "drought interacted with existing socio-political tensions, triggering widespread settlement reorganization").

  2.  **Grant-Evaluation Rubrics:**
      *   **Refocus Questions:** Move from "Explain the collapse of X" to "Analyze the processes and outcomes of systemic transformation in period Y" or "Investigate resilience and adaptation in region Z following major perturbations."
      *   **Value Neutrality:** Explicitly reward projects that avoid teleological assumptions and normative language, focusing instead on robust processual analysis of change.
      *   **Interdisciplinary Integration:** Prioritize proposals integrating complexity science, resilience theory, and historical ecology frameworks that inherently treat change as non-normative system behavior.

  3.  **Museum Narrative Design:**
      *   **Storytelling:** Replace narratives of "rise and fall" or "mysterious disappearance" with narratives of "change and adaptation," "reorganization," and "legacy."
      *   **Emphasis:** Highlight:
          *   The *process* of transformation (e.g., maps showing shifting settlement patterns, timelines showing phased changes).
          *   Continuity in material culture, technology, or ideology beyond elite centers.
          *   The diversity of outcomes (e.g., some areas abandoned, others thriving under new systems).
          *   The agency of populations in navigating change.
      *   **Avoid Catastrophism:** Frame environmental or social challenges as contexts for adaptation, not solely as causes of doom. Explicitly address why "collapse" is a problematic term for the case.
      *   **Connect to Present:** Frame discussions in terms of universal human experiences of societal change and adaptation, rather than presenting past societies as cautionary tales of failure.

  **Conclusion:**
  The terminological asymmetry reflects an unresolved tension between archaeology's scientific aspiration for objectivity and its deep entanglement with Western historical narratives emphasizing progress, continuity, and the perceived fragility of complex systems. It often privileges elite, monumental, and centralized aspects of past societies as defining their "success" or "failure." Adopting a truly non-normative framework of systemic change requires a paradigm shift: moving away from essentialist definitions of societal identity and teleological benchmarks of complexity, towards a relational ontology focused on dynamic processes, diverse experiences, and multifaceted resilience. This shift demands conscious effort to purge normative language from reporting, funding, and public interpretation, reframing societal transformations as complex systemic processes to be understood, rather than failures to be mourned or mysteries to be solved.
