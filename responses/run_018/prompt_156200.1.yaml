answer: |-
  The line between legend and history isn't forged by evidence accumulating like bricks, but by a narrative settling into a specific, potent state: an *underdetermined substrate*. It becomes specific enough to anchor a crucial identity – national, religious, ethnic – yet remains just sufficiently vague and adaptable to evade definitive falsification. Crucially, dominance arises not from proof, but from social utility; one version smooths away rivals because it *works* for the culture needing it. What we then call 'history' is often merely the label slapped onto the legend that won *this* contest of utility, becoming unchallenged cultural infrastructure.

  Consider the Trojan War. Homer’s *Iliad* offers concrete heroes, a specific city (Ilios), and a core grievance (Helen). This specificity provides a foundational myth for Greek identity, a shared heroic past. Yet, the details are maddeningly elusive. Was it a ten-year siege over one woman? Which gods truly intervened? Where exactly was Troy? This very vagueness prevents conclusive disproof; archaeological finds at Hisarlik *suggest* possibilities but *prove* nothing of Homer’s tale. Rival versions existed (like the lost *Cypria*), but Homer’s smoothed them away. Why? Not evidence, but its unparalleled utility. It became the essential text for Greek education, defining virtue, hubris, and fate, binding the Hellenic world together. We call it 'historical' now less because we believe every detail, and more because its bedrock role in Western culture is undeniable.

  King Arthur exemplifies this perfectly. Geoffrey of Monmouth conjured a very specific, politically potent Arthur: a British warlord uniting the isle against Saxons, establishing a chivalric court. This provided a desperately needed national origin myth for post-Norman Conquest Britain, a figure of British (not English) resistance. Yet, the 'history' is spectacularly underdetermined. Was he a Romano-British *dux bellorum*? A high king? Did Camelot exist? The Holy Grail? Rival traditions (Welsh triads, French romances) offered different Arthurs. Geoffrey’s version prevailed not through corroborating documents (there were none), but because it served Plantagenet political ambitions and later Tudor propaganda, evolving into an indispensable symbol of British nationhood. He’s ‘historical’ primarily because questioning the *core* myth became culturally untenable; it had become the substrate of British identity.

  The Exodus narrative is perhaps the starkest case. It provides the ultimate foundational identity for Israel: liberation from slavery, formation as a covenant people under Moses, journey to the Promised Land. It's incredibly specific: plagues, Pharaoh, Red Sea, Sinai, forty years. Yet, it remains profoundly underdetermined historically. Which Pharaoh? When? Where is the direct archaeological evidence for a mass migration and desert sojourn? Rival Canaanite origin stories existed. The Exodus version dominated because it was socially *essential*. It defined Israel’s unique relationship with Yahweh, explained their distinctiveness, and provided a powerful archetype of liberation and divine favour. Its enduring power lies precisely in its adaptable core – oppression, deliverance, covenant – which resonates across millennia, making literal historical falsification almost irrelevant. It functions as the non-negotiable historical bedrock of Jewish and later Christian identity.

  In each case, ‘history’ is not a verdict delivered by evidence. It’s the cultural ratification granted to a legend once it achieves that sweet spot: specific enough to bear the immense weight of collective identity ("This is *who we are*, born from *this*"), but vague enough to absorb challenges and adapt ("The details are debated, but the *core* is sacred"). Rival versions fade not because they are disproven, but because the dominant narrative becomes too useful, too embedded, too vital to the society's self-understanding to discard. We label it 'history' when it stops being contested truth and starts being indispensable cultural concrete – the underdetermined substrate holding the identity together. The proof is in the pudding of its enduring, unchallenged utility.
