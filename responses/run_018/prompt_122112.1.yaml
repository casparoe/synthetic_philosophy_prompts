  Memo:

  Subject: Recommendation on Dr. Elena Vasquez for Honorary Doctorate

  Hey team,

  As we gear up for next month's vote on honorary degrees, I wanted to share my thoughts on Dr. Elena Vasquez. She's been nominated for her contributions to AI and her work at Project Sentinel, where she led the targeting-algorithm division. As you know, this is the program behind the 2022 drone strike that tragically killed 47 civilians. Student groups are up in arms, and they've got a point — they're invoking Elizabeth Anscombe's protest against Oxford honoring Truman, arguing that by honoring Vasquez, we're becoming complicit in those deaths, even if she didn't pull the trigger. They say the algorithm just obscures agency, it doesn't erase it.

  On the flip side, some of you have made a strong case that this is a misapplication of double-effect reasoning. Vasquez intended to target combatants, and the civilian deaths were an unintended side effect. You've compared her to an engineer who designs a bridge that later collapses — we wouldn't hold the engineer responsible unless there was negligence. And there's no evidence of negligence here; it was a complex system failure in a high-stakes environment.

  I've wrestled with this analogy, but I think it breaks down in a key way. Bridges are passive structures; they don't make decisions. The targeting algorithm, however, is designed to autonomously select and engage targets. Vasquez wasn't just building a tool; she was building a decision-maker. That shifts the moral landscape. When we honor her, we're not just celebrating technical prowess; we're endorsing a form of agency that, in this case, resulted in catastrophic harm. The university's values statement emphasizes "responsible innovation," and I worry that honoring her without addressing the harm would contradict that.

  Also, the Anscombe parallel is sticky. She argued that honoring Truman (who ordered the atomic bombs) made Oxford complicit in the killing of innocents. Our students are saying the same: even if Vasquez didn't intend civilians to die, her work directly enabled it. And in an era where tech ethics are under the microscope, I think we have to listen. The "unintended" part doesn't absolve us from the moral weight of the outcome when the stakes are life and death.

  So, after a lot of back-and-forth, I'm recommending we **reject** the nomination. I know this won't be unanimous, but given the protests and the reputational risk, it's the cleaner call. Let's discuss at the meeting on May 15th, and we'll vote then. If we reject, it's effective immediately — no reconsideration unless new evidence emerges, which seems unlikely.

  Cheers,  
  [Your Name]

