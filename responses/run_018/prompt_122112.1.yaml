  **MEMORANDUM**  
  To: Honorary Degrees Committee  
  From: [Your Name], Committee Member  
  Date: October 26, 2023  
  Subject: Rec for Elena Vasquez Honorary Doctorate — Vote Next Month  

  Hey folks,  

  Quick rundown on the Elena Vasquez nomination. She’s up for an honorary doctorate for her "pioneering work in AI targeting systems," specifically her leadership on Project Sentinel’s algo division. You all know the controversy: the 2022 drone misfire that killed 47 civilians. Student protestors are citing Elizabeth Anscombe’s 1958 *Mr. Truman’s Degree* pamphlet, arguing that honoring Vasquez makes us complicit in those deaths. Their core point? Even if she didn’t pull the trigger, building the targeting system isn’t morally neutral—it buries agency under code but doesn’t erase it. Basically, giving her our seal of approval launders responsibility.  

  On the other side, some of you’ve made a strong case that this conflates *intent* with *outcome*. Vasquez designed algo filters to ID combatants; civilian deaths were an unintended side effect (like an engineer whose bridge collapses despite sound math). You’re right that double-effect reasoning matters here—if we reject her for unintended harm, we’re setting a wild precedent for punishing innovation where risk exists. And hell, her tech *did* reduce friendly fire in other ops. That’s a legit counter: condemning her feels like blaming a chemist because someone misused their fertilizer.  

  But here’s where I land: **we should reject the nomination**. Yeah, Vasquez didn’t *want* civilians dead, but the protestors nail a deeper issue. When you design a system that *autonomously* selects targets, you’re not just a technician—you’re architecting life-or-death decisions. The "unintended" defense gets shaky when the tool’s entire purpose is lethal efficiency. Honoring her implicitly endorses the idea that tech ethics are secondary to technical brilliance, which clashes with our uni’s own "responsible innovation" pledge. The Anscombe parallel sticks because it forces us to ask: does institutional praise sanitize moral stakes? I think it does.  

  Vote’s scheduled for **Nov 15**—no delay unless new evidence emerges. If rejected, we won’t reconsider for 3 years (per bylaws), but we should invite Vasquez to a public forum on AI ethics next semester. Not a consolation prize, just a chance to engage the debate head-on.  

  Let’s chat more at Tuesday’s prep meeting. Appreciate y’all wrestling with this.  

  Best,  
  [Your Name]  

