prompt: |-
  Right, I'm a retired biochemist who's only recently got into philosophy — did an evening course on philosophy of mind last autumn and now I sit on my university's Emerging Technologies Ethics Panel, which is rather outside my comfort zone, to be honest. We've recieved a joint research programme proposal from neuroscience and robotics: they want to build what they call a heterogeneous cognitive architecture, essentially living cortical tissue interfaced with neuromorphic silicon chips, and run it for about eighteen months to see whether perceptual binding and affective states can be realised across genuinely mixed substrates. The philosophical knot splitting us is functionalism and multiple realisability, but not the usual 'could a computer think' version — they've designed the system so biological tissue handles low-level homeostasis and affective tone, while the silicon runs high-level predictive processing, creating an asymmetrically layered realisation where macro-cognitive functions are distributed unevenly across substrates. One faction argues this is still multiple realisability and that if the hybrid meets the relevant functional profile we ought to grant it provisional moral-patient status during the study; the other faction insists this layered arrangement violates the unity conditions that make functionalism plausible, so treating it as a mind would be a category mistake rather than an ethical advance.

  Please act as an expert philosopher of mind with some research-ethics experience, and think carefully before answering — maybe start with a brief bit of brainstorming about the strongest objections on both sides, then move to a concrete recommendation. I need the panel's formal written opinion recommending approval, approval with conditions, or rejection, with a clear time frame for review or implementation, and it must engage seriously with the functionalist argument rather than just dismissing it. The memo should read like continuous prose in the style of an email or letter, so please avoid headings, bullet points, bold text, or tables altogether; just continuous paragraphs with the bottom line stated up front followed by reasoning. Don't include a bibliography or reading list — I want the conceptual argument laid out clearly from first principles. Write in British English, keep the tone fairly casual but authoritative enough for institutional circulation, and do treat the strongest consideration on the losing side honestly. Oh, and I was chatting with my neighbour over tea about whether promises bind people because of internal commitment or social function, which seemed a bit of a tangent, but it made me wonder whether substrate-independence works analogously for mental states — probably not, but you might find the comparison useful or useless. There's likely a typo or two in my own notes, but that's neither here nor there. Make sure the deliverable gives the researchers something concrete they could actually respond to.
