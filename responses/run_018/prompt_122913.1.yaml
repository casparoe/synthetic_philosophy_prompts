answer: |-
  Below is a systematic audit of the chair's "forgery as lie" analogy, following your requested structure. I'll address the correspondence table, test cases, conceptual mismatches, alternative analogies, and epistemic vulnerabilities—focusing strictly on the logic of the analogy, not the verdict.

  ### 1. Correspondence Table
  | **Lie**                  | **Painting**                  | **Mismatch Severity** |
  |--------------------------|-------------------------------|------------------------|
  | Speaker                  | Painter                       | Critical (see below)  |
  | Utterance                | The physical artwork itself  | Critical              |
  | Propositional content    | Attribution (e.g., "by Master X") | High              |
  | Audience                 | Museum visitor               | Moderate              |
  | Intention to deceive     | Painter's intent             | Critical              |
  | Moment of utterance      | Creation date                | Critical              |
  | Later discovery          | Reattribution                | Moderate              |
  | Retraction               | Relabeling/withdrawal        | Low                   |

  ---

  ### 2. Test Cases: Where the Analogy Falters
  **Case 1 (1620s Studio Work, 1890 "Upgrade")**  
  - **Analogy Breakdown:** The chair claims the "defect is in the thing." But here, the object was *always* an honest studio product. The 1890 dealer’s relabeling introduced the lie, not the object. The analogy conflates the *artifact* (neutral) with its *attribution* (mutable). A lie requires a speaker; the painting has no intrinsic "voice."  
  - **Implication:** The "wrong" resides in institutional assertions (labels), not the object. Withdrawal punishes the artifact for human actions.  

  **Case 2 (Knowing Collector, Accurate Label)**  
  - **Analogy Breakdown:** No lie exists without intent to deceive or a deceived audience. The object functions as a skilled imitation, not a forgery (which requires fraud). The chair’s "defect" claim fails: the object’s material/historical properties are unchanged.  
  - **Implication:** "Moral taint" requires deceptive context. Absent that, the object is aesthetically/intellectually valuable.  

  **Case 3 (Reattribution Fluidity: Demotion/Promotion)**  
  - **Analogy Collapse:** Lies are binary (true/false); attributions are interpretive. If a work reattributed to "School of Rembrandt" in 1950 is re-upgraded to "Rembrandt" in 2020 based on new evidence, the analogy cannot explain this. A retracted lie doesn’t become true later; a painting’s status can.  
  - **Implication:** The analogy assumes attribution is a fixed "fact," not a probabilistic, evidence-based claim.  

  ---

  ### 3. What the Analogy Distorts
  **What It Imports (Inappropriately)**  
  - **Speaker/Intent:** Assigns moral blame to the *object* by proxy of the painter’s intent (even if unknowable or irrelevant, as in Case 1).  
  - **Static "Content":** Treats attribution as a discrete "proposition" rather than a evolving institutional judgment.  
  - **Unrepairable Wrong:** Assumes deception permanently contaminates the object, ignoring that correction (relabeling) can resolve the harm.  

  **What It Omits (Critically)**  
  - **Institutional Context:** Museums are sites of ongoing scholarship, not passive audiences. Labels are corrigible hypotheses, not immutable assertions.  
  - **Material Integrity:** The painting has historical/aesthetic value independent of attribution (e.g., technique, provenance).  
  - **Causal Complexity:** Attribution hinges on external evidence (technology, archives), not just the artist’s intent.  

  **Chair’s Conflated Questions**  
  - *Aesthetic Value:* Unaffected by attribution (a skilled forgery may be beautiful).  
  - *Moral Taint:* Requires fraudulent intent (absent in Case 1/2).  
  - *Institutional Action:* Should prioritize education, not ritual purification.  

  ---

  ### 4. Alternative Analogies: Weaknesses  
  - **Perjury:** Improves by emphasizing institutional harm (public trust) but still implies *volitional* deceit by the museum (if inadvertent, it’s error, not perjury). Over-penalizes good-faith errors.  
  - **Plagiarism:** Better captures credit misallocation but implies the *maker* stole credit. Fails if the maker is anonymous (e.g., Case 1) or if the museum perpetuates misattribution unknowingly.  

  **Verdict:** Both alternatives still center on *human* wrongdoing, not the object’s inherent status. They don’t justify destroying/withdrawing the artifact itself.  

  ---

  ### 5. What Would Change My Mind?  
  - **Empirical Claim:** My reasoning assumes visitors interpret relabeled works as *corrected* statements. **If evidence showed most visitors:**  
    - Ignore labels and assume "fake = worthless,"  
    - Feel actively deceived *despite* corrective labels,  
    Then withdrawal might better protect institutional credibility.  
  - **Failure Point:** I assume museums can neutrally present contested attributions. If the chair demonstrated that "in the manner of" labels *inevitably* perpetuate confusion (e.g., visitors still infer "genuine"), the analogy gains force.  

  ---

  ### Conclusion on the Analogy  
  The chair’s analogy fails due to **non-transferable elements**:  
  1. **Intent/Volition:** Lies require a speaker; paintings are not speakers.  
  2. **Temporal Fixity:** Lies are judged at utterance; attributions are temporal judgments.  
  3. **Moral Taint Location:** Lies corrupt the *act*; forgeries corrupt the *object* only if intent is proven and audiences are harmed.  

  **The core mismatch:** A lie is an *act*; a forgery is an *object* that *facilitated* an act. Withdrawing the object confuses evidence with crime. A relabeled forgery isn’t a "footnoted lie"—it’s a corrected historical document. The chair’s conclusion ("permanent contamination") holds only if the object is *solely* defined by its false attribution, which negates its material history and aesthetic properties.  

  **Recommendation:** Audit visitor perceptions. If they reliably grasp corrective labels, keep it with full disclosure. If not, the analogy gains pragmatic (but not logical) weight.
