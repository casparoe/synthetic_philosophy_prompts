answer: |-
  Here’s a rigorous specification for a theory of self-deception, breaking down non-negotiable requirements, distinctions to preserve, conflicts, and theory evaluations:

  **Core Requirements (Non-Negotiables):**  
  1.  **Dynamic Tension:** Must explain the *psychological conflict* between the avoided belief (P) and the adopted belief (not-P). *Why:* Without tension, it's mere ignorance or stable false belief.  
  2.  **Motivated Distortion:** Must require motivation (e.g., fear, desire) driving the avoidance/skewing of evidence for P. *Why:* Distinguishes it from random error or innocent bias.  
  3.  **Epistemic Leakage:** The avoided belief (P) must retain *causal potency* to influence behavior/emotion despite being denied (e.g., jealous spouse's "unprovoked" accusations, addict's health anxiety). *Why:* Without leakage, it's indistinguishable from simple ignorance; it explains telltales.  
  4.  **Partial Accessibility:** The content of P must be *potentially accessible* to the subject (even if effortfully suppressed). *Why:* If P is fully unconscious/inaccessible, it’s repression or dissociation, not self-*deception*.  
  5.  **Behavioral Integration:** The subject's *overall behavior* must reflect the influence of *both* P (leakage) *and* not-P (the professed belief). *Why:* Accounts for the "smoker who knows but lights up anyway" paradox.  
  6.  **Asymmetry in Processing:** Must explain *selective* rigor in cognition: lax standards when assessing evidence against not-P/for P, strict standards for evidence against P/for not-P. *Why:* Captures motivated reasoning/confirmation bias as core *mechanisms*.  
  7.  **Fallibility & Correctability:** Must allow that self-deception can *fail* (leakage) or be *overcome* (e.g., confronting evidence). *Why:* Avoids determinism; people aren't permanently blinded.  

  **Preserved Distinctions (Non-Collapse):**  
  -   **vs. Denial:** Self-deception involves *constructing* an alternative narrative (not-P), not just refusing to acknowledge P.  
  -   **vs. Wishful Thinking:** Requires *active avoidance/distortion* of counter-evidence to P, not just hopeful bias.  
  -   **vs. Being Mistaken:** Requires *motivated* resistance to correcting the error when evidence is available.  
  -   **vs. Hypocrisy:** The subject *genuinely experiences* believing not-P (at some level), not just feigning it.  

  **Conflict Zone (Joint Unsatisfiability?):**  
  The triad of **Dynamic Tension (1)**, **Behavioral Integration (5)**, and **Partial Accessibility (4)** creates severe pressure:  
  -   How can the subject genuinely believe not-P *while* P remains accessible enough to cause tension *and* leak into behavior?  
  -   **Result:** This *forces* theories into either:  
      -   **Partitioning:** Accepting some form of mental compartmentalization (P and not-P held in quasi-separate subsystems).  
      -   **Temporal/Switching Models:** P and not-P are never *fully* simultaneous in awareness, but flip rapidly or exist in different states (occurrent vs. dispositional).  
  -   *Literal, simultaneous, fully conscious belief in P and not-P remains impossible/paradoxical.* Partition/compartment models are the only escape hatch from this paradox.

  **Theory Report Card:**  
  | Requirement          | Intentionalist (Conscious Self-Lying) | Motivated Reasoning (Bias-Driven) | Partition (Compartmentalized) |  
  |----------------------|--------------------------------------|-----------------------------------|-------------------------------|  
  | **1. Dynamic Tension**       | ✅ (Tension is conscious struggle)    | ⚠️ (Tension often implicit)       | ✅ (Tension = subsystem clash) |  
  | **2. Motivated Distortion**  | ✅ (Explicit motive)                  | ✅ (Core mechanism)               | ✅ (Motive gates access)       |  
  | **3. Epistemic Leakage**     | ⚠️❌ (Why leak if consciously hidden?) | ⚠️ (Leakage = processing error)   | ✅ (Leakage = P-system output) |  
  | **4. Partial Accessibility** | ✅ (P is consciously suppressible)    | ⚠️ (Accessibility often unclear)  | ✅ (P accessible in context)   |  
  | **5. Behavioral Integration**| ❌ (Struggles: why act on hidden P?)  | ⚠️ (Can model via bias spillover) | ✅ (Systems drive behavior)    |  
  | **6. Asymmetry**             | ⚠️ (Requires conscious double-think) | ✅ (Defining feature)             | ✅ (Different system rules)    |  
  | **7. Fallibility**           | ✅ (Suppression can fail)            | ✅ (Biases can be overridden)     | ✅ (Barriers can be breached)  |  

  **The Achilles' Heel (Most Damaging Requirement):**  
  **Epistemic Leakage (Requirement 3)** devastates popular theories:  
  -   **Intentionalism:** If the subject is *consciously* hiding P from themselves, why would P *leak* into anxiety or behavior? Conscious control should prevent this. Leakage implies P isn't fully controlled.  
  -   **Motivated Reasoning:** While it explains *avoiding* P, leakage requires the *persistent influence* of the avoided content. Standard MR models focus on input filtering, not the active output of suppressed content. Leakage suggests P isn't just filtered but *actively pressing for expression*.  
  -   **Partition:** Handles leakage best (P-system outputs independently), but risks being "not even wrong" if partitions are arbitrary.  

  **Overall:**  
  -   **Partition/Compartmentalization** scores best, uniquely satisfying the tension/leakage/integration triad, but faces challenges of empirical specificity and parsimony.  
  -   **Motivated Reasoning** excels on asymmetry and fallibility but struggles most acutely with **epistemic leakage**, often underspecifying how the *suppressed* belief remains causally potent.  
  -   **Intentionalism** is crippled by **epistemic leakage** and **behavioral integration**, making conscious self-lying unable to explain why the "deceived" part acts on the hidden truth.  

  **The Core Tension:** Any viable theory must explain how the mind can *both* effectively avoid a painful belief (P) *and* be persistently haunted and influenced by it. This is the defining paradox, and **epistemic leakage** is its strictest test.
