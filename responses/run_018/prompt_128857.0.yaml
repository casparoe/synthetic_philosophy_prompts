answer: |-
  Based on your board's prior rulings, I'd argue the **closest analog is the colonial monument case**, and the **most consistent ruling would be: NO to paving over the graveyard *unless physical markers remain*.** Here's the breakdown of their hidden principles and how they apply:

  ### The Hidden Principles Revealed by Prior Rulings
  1.  **Irreplaceable Materiality:** Physical artifacts/sites hold unique weight. Digital substitutes are inferior unless *absolutely necessary* and *truthful* (Monument case: no destruction without record; Plaque case: physical presence mandated).
  2.  **Powerless Victim Priority:** The memory of victims of systemic injustice (state violence, genocide, colonial oppression, industrial disaster) must be protected *against* the desires of the powerful or comfortable majority (Plaque case vs. locals; School case vs. parents; Factory survivor case *supports* victim agency).
  3.  **Truth & Accountability:** Factual records of harm/deeds cannot be erased for the living's convenience (Ex-convict case; School case).
  4.  **Limited Agency for the Dead/Private:** Control over private records rests with designated heirs (Poet's journals). However, *public* memory or the memory of *unrepresented* victims defaults to societal obligation (Plaque case, Monument case, School case).
  5.  **Agency for Living Victims:** Living victims retain significant control over *their own* traumatic remembrance (Factory survivor case).

  ### Applying Principles to the Graveyard Case
  *   **Powerless Victim Priority:** 1920s migrant workers are classic powerless victims of exploitation (likely harsh labor, poor conditions, systemic neglect). Their unmarked grave is a physical testament to this injustice. Principle #2 demands protection against the developer's (powerful entity) desire to erase it.
  *   **Irreplaceable Materiality:** The *physical grave site itself* is the primary artifact/testament. A virtual memorial using AI reconstruction (speculative, potentially inaccurate, intangible) is a clear downgrade. Principle #1 (from the Monument ruling) demands that if the physical form *can* be preserved (markers), it *must* be. Paving over completely is akin to melting the monument without a record – unacceptable.
  *   **Agency:** There are no known heirs (like the poet's family) to consent. These are unrepresented victims. Societal obligation (via the board) kicks in (Principle #4), mirroring the plaque mandate imposed on the town.
  *   **Truth & Accountability:** Destroying the physical site erases tangible evidence of their fate and society's neglect. A speculative digital memorial risks distorting the truth (Principle #3).
  *   **Factory Survivor Distinction:** The survivors are *living* victims exercising agency (Principle #5). The dead workers have no agency; the responsibility falls to society to remember them *materially*.

  **Therefore:** Allowing paving *only* if physical markers remain respects Principle #1 (materiality) and Principle #2 (victim priority) most directly, echoing the logic of the Monument ruling (can't destroy without preserving the form/knowledge). Blocking entirely might be argued (strong victim priority), but allowing destruction with a virtual-only substitute violates the core materiality principle established earlier.

  **Closest Analog: The Colonial Monument (No to melting without record).** Both involve physical artifacts representing historical injustice. The board demanded preservation of the form/knowledge. Here, the physical site *is* the monument.

  ### The Rule Conflict & The Hypothetical Test Case
  The potential conflict lies between:
  *   **Rule A (Strong Materiality/Victim Priority):** Physical sites/testaments of systemic injustice against the powerless must be preserved whenever possible.
  *   **Rule B (Heir Agency/Contextual Pragmatism):** Control over remains/memory primarily rests with heirs or, absent heirs, practical considerations (like development) *might* allow alteration if *some* form of remembrance is provided.

  **Which Rule Wins?** Your board's history strongly favors **Rule A (Materiality/Victim Priority)**. The plaque mandate (overriding locals), school mandate (overriding parents), and monument decision (preserving form) all show Rule A trumping convenience, local desire, or even destruction requests from powerful entities (heirs in the poet case had control over *private* papers, not a *victim* site).

  **The Hypothetical Test Case to Distinguish Rules A & B:**
  > **The Shameful Family Mausoleum:** A prominent, historically philanthropic family (with living descendants/heirs) discovers their revered ancestor's private mausoleum was secretly built using stones quarried by enslaved laborers who died in the process and were buried anonymously on the site. The heirs, horrified by this legacy, petition the board to allow them to:
  > *   **Option 1:** Demolish the mausoleum completely and erect a dignified memorial plaque *on the site* listing the names of the enslaved laborers (to the extent known).
  > *   **Option 2:** Demolish the mausoleum, remove the stones, and build a *new, separate* memorial monument in a public park using those stones, dedicated solely to the laborers.
  > *   **Option 3:** Preserve the mausoleum as-is but add prominent plaques detailing the full, exploitative history.

  **How the Board Rules Reveals the Dominant Principle:**
  *   **If Rule A (Materiality/Victim Priority) Wins:** They likely reject Option 1 (destroys the physical evidence/site of the crime entirely) and *possibly* reject Option 2 (removes the stones from their context). They mandate Option 3: preserve the *actual site and artifact* of the injustice, forcing the uncomfortable truth to remain materially present, even against the heirs' wishes. This mirrors the plaque & monument logic. Victim memory over heir comfort.
  *   **If Rule B (Heir Agency/Contextual Pragmatism) Wins:** They likely allow Option 1 or 2. Heirs have agency (like the poet's heirs) to manage their property and legacy. Providing *a* memorial (plaque or relocated monument) is deemed sufficient respect for the victims, balancing remembrance with the heirs' desire to dismantle the symbol of oppression. Pragmatism and heir control win.

  Given your board's history of imposing remembrance on the powerful/complacent for victims, the **Shameful Mausoleum** test case would likely see them choose **Option 3**, confirming the dominance of **Rule A (Materiality/Victim Priority)**. This reinforces why the developer shouldn't be allowed to pave over the migrant graveyard without preserving physical markers.
