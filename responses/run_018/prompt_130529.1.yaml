prompt: |-
  Hey, act like a senior clinical ethicist who actualy reads Augustine's anti-lying treatises — not just the Confessions, but the hardline stuff where he says mendacium is always wrong even to save a life. Before you build anything, do a quick brainstorm: list the three biggest mistakes people make applying Augustine in a hospital (like mixing him up with Kant, or thinking he allows mental reservation). Then think step-by-step and check your reasoning carefuly.

  I need a reusable decision card — something a trauma-unit chaplain can run in about 10 minutes, maybe three times a week, with zero philosophy background. They get pulled into family conferences about disclosure, framing, or withholding info, and they need to know if what they're being asked to do counts as the kind of lie Augustine condemns.

  Turn his principle into a flowchart-in-words. Keep the real distinctions he draws: (1) asserting something you believe is false with intent to deceive, (2) staying silent when you have no duty to speak, and (3) technically true speech that frames reality selectively. Don't collapse these — the procedure should treat them differently.

  Structure it as ordered questions: what does the chaplain ask first, what answer stops the process with a clear "no, don't do that," and where does it hand off to "this is values, not rules"? Flag the spots where judgment can't be eliminated — like when the chaplain isn't sure what they actually know, or when family authority-to-speak conflicts with disclosure norms.

  Then apply it to three cases:
  A) The family asks the chaplain to back them up telling a terminal patient "you're going to be fine" when everyone knows it's false.
  B) The patient asks the chaplain directly "am I dying?" and the chaplain knows the family has been lying for weeks; the family begs them not to confirm.
  C) A research team wants "hopeful framing" of an experimental drug that buries risks in technical jargon — not literally false, but designed to cause therapeutic misconception. Here your procedure should probably force a recommendation the team won't like.

  Inject this niche distinction into one of the steps: seperate "propositional substitution" (replacing one factual claim with another) from "illocutionary framing" (presenting the same fact with different emphasis). Show how Augustine's logic treats them differently.

  Keep it casual, like you're explaining it to a tired chaplain on night shift. Don't ask for citations, bibliographies, or further reading — just give me the card they could laminate. And be honest about where the procedure breaks down or will misfire.
