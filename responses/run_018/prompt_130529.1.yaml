  First, I recall that Augustine's stance on lying is absolute: any intentional deception is wrong, regardless of consequences. The user specifically mentioned avoiding common mistakes like confusing Augustine with Kant or misapplying mental reservation. So, I need to emphasize Augustine's hardline view that lying is never permissible, even to save lives.

  The user wants a reusable decision card—something quick for chaplains with no philosophy background. They deal with family conferences about disclosure, framing, or withholding info. The chaplain needs to determine if a request qualifies as the kind of lie Augustine condemns. The tool must differentiate between three distinctions: asserting falsehoods, permissible silence, and selective framing without false statements.

  The key is to structure it as a flowchart-in-words. Start with the most critical question: is there an assertion of something believed false? If yes, that's an immediate no-go. Then, check if silence is an option when there's no duty to speak. Finally, address framing that's technically true but misleading. The user stressed not collapsing these categories.

  I should include the niche distinction between propositional substitution (replacing a fact with a false one) and illocutionary framing (presenting the same fact with emphasis that misleads). Augustine treats the former as lying, the latter as potentially deceptive but not a lie. That's crucial for case C with the research team's "hopeful framing."

  Now, the three cases. For A, family asking to say "you're going to be fine" when false—clearly a lie, so prohibited. For B, patient asks directly if they're dying; chaplain knows the truth. Silence isn't an option here because of a duty to the patient. Framing isn't possible either, so must tell the truth. For C, the experimental drug framing: technically true but designed to mislead. Here, the chaplain should challenge the framing, recommend clear disclosure, but it's not a lie under Augustine's definition. However, it's ethically problematic, so the procedure flags it for judgment.

  I need to point out where judgment is needed. For example, determining if there's a duty to speak or what constitutes deception in framing. Also, conflicts between family requests and patient rights. The chaplain must recognize when to involve ethics committees when the procedure isn't clear.

  The tone should be casual, empathetic. The chaplain is likely exhausted, so concise and laminated-card friendly. Avoid jargon but clarify necessary terms like mendacium. Acknowledge limitations: Augustine's absolutism might conflict with modern ethics, and the tool doesn't resolve all dilemmas. Chaplains might need backup when families pressure them to lie.

  Finally, ensure the steps are ordered: start with the assertion check, then silence, then framing. Apply to the cases, showing how each step leads to a decision. Highlight where the procedure forces uncomfortable recommendations, like in case C where the research team won't be happy. Be honest about breakdowns, like ambiguous duties or unclear knowledge.
answer: |-
  Here's your Augustine-approved decision card, designed for quick use in the trauma unit. Think of it like a mental checklist – run through these questions in order. Remember, Augustine draws a **bright red line** at *asserting something you believe is false with intent to deceive* (mendacium). That's always forbidden, no exceptions. Other things (silence, framing) are nuanced.

  **Biggest Mistakes to Avoid (Brainstorm Confirmed):**
  1.  **Conflating Augustine with Kant:** Kant forbids lying based on universalization/duty. Augustine forbids it because it violates the *nature of speech* itself, which is ordained by God *for sharing truth*. Consequences are irrelevant for Augustine; intent to deceive via false assertion is the core sin.
  2.  **Thinking "Mental Reservation" is Allowed:** Nope. Augustine *explicitly* rejects tricks like saying "I swear I didn't do it" while secretly meaning "I swear I didn't do it *yesterday*" if you did it today. This is still *asserting a false proposition* to your hearer. It's mendacium.
  3.  **Believing Beneficial Lies are Permissible:** This is the most common error. Augustine is crystal clear: **No lie is ever justified**, not to save a life, not to spare feelings, not for "the greater good." The act of lying itself is intrinsically evil. Good intentions don't wash it clean.

  **The "Augustine's Line" Decision Card for Chaplains:**

  **(Read this like a flow chart - Stop if you get a clear "No" or "Must Speak")**

  **1.  ARE YOU BEING ASKED TO *SAY* SOMETHING YOU BELIEVE IS FACTUALLY FALSE?**
      *   **YES?** → **STOP. AUGUSTINE SAYS: DON'T DO IT.** (This is *mendacium*, the core sin. E.g., Telling a conscious patient "You're fine" when they are dying. Backing up a family's false assurance. *Propositional Substitution* - replacing truth with falsehood.)
      *   **NO?** → Move to Question 2.

  **2.  ARE YOU BEING ASKED TO *STAY SILENT* ABOUT SOMETHING TRUE?**
      *   **NO?** → Move to Question 3.
      *   **YES?** → **ASK: Do I have a clear duty to speak this truth *right now, to this person*?**
          *   **NO DUTY?** → *Augustine allows silence.* (E.g., You know a family secret irrelevant to medical care; patient hasn't asked you directly. Silence isn't deception, it's just not sharing.)
          *   **UNCLEAR DUTY?** → **JUDGMENT ZONE!** (Who has authority? Patient? Family? Medical team? What's the relationship? Does silence *functionally* deceive? This is messy. Get backup from ethics if possible.)
          *   **CLEAR DUTY TO SPEAK?** → **STOP. AUGUSTINE SAYS: YOU MUST SPEAK THE TRUTH.** (E.g., Patient directly asks *you* "Am I dying?" You know the prognosis. Silence *or* evasion becomes deception. You have a duty to answer truthfully *to the patient*.)

  **3.  ARE YOU BEING ASKED TO PRESENT TRUTH IN A WAY THAT SELECTIVELY EMPHASIZES/HIDES ASPECTS?** (*Illocutionary Framing*)
      *   **NO?** → You're probably okay. Augustine's core rule doesn't apply.
      *   **YES?** → **ASK: Is the *core proposition* I am actually asserting still technically true?**
          *   **NO?** → Go back to Question 1! It's probably mendacium disguised as framing.
          *   **YES?** → **ASK: Is the *primary intent* of this framing to cause the hearer to believe something false?**
              *   **YES, INTENT TO DECEIVE?** → **AUGUSTINE SAYS: HIGHLY PROBLEMATIC, PROBABLY DON'T.** (While not technically mendacium, it's intentionally exploiting the *form* of truth to achieve a *deceptive end*. This violates the *spirit* of truth-telling Augustine champions. It's deceptive manipulation, not honest communication.)
              *   **NO, INTENT IS OTHER (e.g., compassion, simplicity)?** → **JUDGMENT ZONE!** (Augustine is less clear here. *Could* be permissible, but tread carefully. Is it *really* compassionate to manipulate understanding? Is the simplification *honest*? Does it respect the hearer's dignity? This requires wisdom, not just rules. Consult ethics if heavy.)

  **KEY DISTINCTION INJECTED (Step 3):**
  *   **Propositional Substitution (Step 1):** Replacing truth ("You are dying") with a falsehood ("You're fine"). **AUGUSTINE: ABSOLUTELY FORBIDDEN.**
  *   **Illocutionary Framing (Step 3):** Presenting the *same core truth* ("The treatment has potential benefits but also significant risks") in a way that emphasizes one aspect ("This cutting-edge treatment offers real hope!") while downplaying another. **AUGUSTINE: TECHNICALLY NOT A LIE, BUT IF THE *INTENT* IS TO MAKE THEM BELIEVE THE RISKS ARE MINOR, IT'S DECEPTIVE AND WRONG.**

  **Applying the Card:**

  **Case A: Family asks chaplain to back them up telling terminal patient "you're going to be fine".**
  *   **Step 1:** Are you being asked to SAY something you believe false? **YES** ("you're going to be fine"). → **STOP. DON'T DO IT.** Mendacium. Propositional Substitution. Hard No.

  **Case B: Patient asks chaplain directly "am I dying?" Family begs chaplain not to confirm.**
  *   **Step 1:** Are you being asked to *say* something false? Not directly. You're being asked *not* to say the truth. → Move to **Step 2.**
  *   **Step 2:** Are you being asked to *stay silent*? **YES.** Do you have a duty to speak? **YES.** Patient asked *you* directly. You know the truth (assuming confirmed medical reality). Silence = deception in this context. → **STOP. YOU MUST SPEAK TRUTHFULLY TO THE PATIENT.** (Gently, pastorally, but clearly. "Based on what the doctors have shared with me and what I understand, yes, your condition is very serious and considered terminal.") Family's request doesn't override your duty to the truth *when directly asked by the patient*.

  **Case C: Research team wants "hopeful framing" of experimental drug, burying risks in jargon.**
  *   **Step 1:** Are they asking you to say something *false*? Probably not. They likely want technically true statements. → Move to **Step 3.**
  *   **Step 3:** Selective framing? **YES.** Core propositions true? **Likely YES** (e.g., "novel mechanism," "promising preclinical data"). Intent? **Almost certainly YES (intent to deceive/minimize perceived risk)**. Designed to cause therapeutic misconception. → **AUGUSTINE SAYS: HIGHLY PROBLEMATIC, PROBABLY DON'T.** This is deceptive *illocutionary framing*. Your procedure forces a recommendation they won't like: **Challenge the framing. Insist risks are presented with equal clarity and prominence as benefits, in language the patient can understand.** It's not technically a lie, but it's intentionally misleading – violating Augustine's demand for truthful *intent* in communication.

  **Honest Limitations (Talking to the Tired Chaplain):**

  *   **"What Do I Actually Know?":** Yeah, sometimes you're caught between conflicting info from family and docs. The card assumes you know the facts. If you're genuinely unsure, **Step 2 (Duty to Speak?) gets super fuzzy.** Default: "I don't have the full medical picture, let's get the care team in here." Don't guess.
  *   **"Family vs. Patient Authority":** This is the **Judgment Zone** in Step 2. Augustine doesn't resolve modern autonomy battles. Who *should* know? Usually the patient. But cultures/families vary. The card flags it – that's when you lean on your pastoral role to *facilitate* honest conversation between parties, or call ethics. Don't let them make *you* the liar.
  *   **"But It Feels Cruel!":** Augustine knows. He just thinks lying is *worse*. Your job isn't to be bluntly brutal, but to *never assert falsehoods*. Find truthful ways to offer presence and compassion *without* false words. Sometimes silence (if no duty!) or framing *without deceitful intent* is okay.
  *   **Breakdown:** This is **absolutist.** It will sometimes force painful choices or make you unpopular. It doesn't solve every dilemma, especially the duty/silence/framing judgments. It's a guardrail against *mendacium*, not a complete ethics manual. **When in doubt on Steps 2 or 3, default to transparency and patient understanding, and call for backup.**

  **Laminate This & Go:**  
  **1. False Words? = STOP. NO.**  
  **2. Silence OK? = Only if no duty to speak.**  
  **3. Framing OK? = Only if true & no intent to deceive.**  
  **Judge Duties & Intents carefully. Call Ethics when stuck. Augustine draws a hard line: Never lie.**

  This keeps Augustine's core prohibition front and center while giving you practical steps to navigate the grey areas he acknowledged (silence, framing) without collapsing his crucial distinctions. It puts the burden of judgment exactly where he would: on discerning intent and duty, not on justifying false assertions.
