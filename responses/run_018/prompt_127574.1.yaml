answer: |-
  ## Dialogue: Global Underdetermination vs. Dimension-Gated Underdetermination

  **Characters:**
  *   **ALEX:** Defends **Global Underdetermination** (Any theory can be saved with auxiliary tweaks; ontology is always underdetermined).
  *   **BAILEY:** Defends **Dimension-Gated Underdetermination** (Empirically equivalent rivals are only practically viable in high-dimensional systems where adjustments hide in statistical noise; low-dimensional systems are largely immune).

  **(Setting: University common room, coffee cups on the table)**

  **ALEX:** Bailey, you know what keeps me up? The sheer fragility of knowledge. Take *any* theory – say, Newtonian mechanics predicting a ball's trajectory. We get a weird result? No problem! Blame instrument drift, unmodelled air currents, even a momentary gravitational hiccup. We patch it with auxiliaries. The *core* ontology – mass, force, absolute space – floats free of any *particular* evidence. It's always underdetermined. Always.

  **BAILEY:** Alex, that’s the ghost in the machine talking. You’re confusing logical possibility with scientific reality. Sure, in some abstract, armchair sense, you can *imagine* endless rivals for Newton’s simple kinematics. But practically? In a low-dimensional system like predicting a ball’s arc? If your rival theory needs to invoke "gravitational hiccups" or "instrument gremlins" every single time a prediction wobbles, it becomes absurdly complex and *statistically identifiable as nonsense*. The data screams "friction coefficient miscalibrated" or "initial velocity misread," not "fundamental force law wrong *plus* invisible gremlin". The parameter space is too small for the noise to hide your auxiliary sins.

  **ALEX:** "Statistically identifiable"? That’s your gatekeeper? You think low dimension is some magic shield? Look closer! Even your "simple" kinematics smuggles in auxiliaries you just *fix*. How do you *know* the plane is perfectly frictionless? That’s an auxiliary hypothesis! How do you *know* your timer isn’t systematically biased? That’s another! You *assume* background conditions are stable and instruments reliable. Those are *hidden dimensions*! If the prediction fails, I *can* save the core kinematics by tweaking the assumed friction coefficient or recalibrating the timer *differently* next time, constructing a rival history of auxiliary states that fits the data just as well. The ontology of the 'pure' kinematics is *still* underdetermined by the evidence – it’s parasitically tied to the auxiliaries you stabilize by convention.

  **BAILEY:** But that’s precisely where the dimension matters! In low-D systems, those auxiliary *assumptions* aren’t free-floating parameters; they’re *calibrated* independently and robustly. I measure friction coefficients *directly* with inclined planes before I run the projectile test. I test the timer against known intervals. I *constrain* those background dimensions tightly *before* testing the core theory. Crucially, the *residual* noise – the tiny wobbles in the ball’s path – is too small to plausibly hide a *fundamentally different rival kinematics* plus its required auxiliary tweak history. Any rival theory complex enough to be empirically equivalent would need so many convoluted, post-hoc adjustments to those *already constrained* auxiliaries that it violates parsimony catastrophically and becomes statistically implausible. It’s not that alternatives are logically impossible; it’s that they are *practically invisible* in the data noise.

  **ALEX:** Parsimony? Statistical plausibility? Those are pragmatic virtues, not ontological guarantees! You’re just moving the underdetermination from the core theory to the *web* of auxiliary calibration procedures. How do you *know* your friction coefficient measurement wasn’t subtly biased in a way that *only* manifests when combined with *this specific* kinematics test? You calibrate the timer with another device? How do you know *that* device is reliable? The chain regresses. The point is, for *any* finite set of data points, there are logically consistent ways to distribute the "blame" between the core theory and *some* constellation of auxiliary adjustments – even adjustments to the calibrations themselves. The global underdetermination is inescapable; your "dimension gate" just hides it behind layers of stabilized practice. It’s epistemic comfort, not ontological security.

  **BAILEY:** It’s not just comfort, it’s *constraint*! High-dimensional systems are different beasts. Think climate models: thousands of coupled parameters, chaotic dynamics, vast parameter spaces where tiny tweaks to cloud formation physics or ocean heat uptake can nudge the output within observational error bars, spawning countless empirically equivalent rivals. The noise *can* hide genuine structural alternatives. *That’s* where underdetermination bites hard – where the data genuinely *cannot* distinguish between fundamentally different causal structures *because* the dimension allows complexity to masquerade as noise. But with kinematics? The "rival" you propose – the one needing a unique, bizarre auxiliary tweak history synchronized perfectly with my core theory predictions *and* passing all independent calibration checks? It’s a philosophical zombie, Alex. Logically conceivable, yes. Scientifically relevant? Vanishingly improbable. It doesn’t survive contact with the low-dimensional, high-signal data. Underdetermination isn't globally uniform; it scales with parameter space complexity.

  **ALEX:** So your realism is probabilistic? "Vanishingly improbable" rivals mean we can sleep soundly about mass and force? But improbability isn't impossibility. The *structure* of the problem – the logical possibility of redistributing fit across theory and auxiliaries – remains identical, whether in two dimensions or two thousand. Your "gate" is just a pragmatic filter based on human notions of simplicity and computational tractability. It doesn't dissolve the underlying epistemic vulnerability. The ontology is *always* hostage to the auxiliary network, however well-calibrated you *think* it is. The specter of the empirically equivalent rival, however "zombie-like," still haunts the foundations, even for the falling apple.

  **BAILEY:** And your global specter paralyzes practice! If we take it as uniformly potent, we surrender to radical skepticism precisely where science is strongest. The falling apple *doesn't* haunt me, Alex. The data speaks clearly *enough* in low-D to kill most rivals dead. The vulnerability isn't identical – the *leverage* of the evidence against complex rivals is massively amplified when dimensions are few. That’s not just pragmatism; it’s how empirical constraint *actually functions* when the signal isn't drowned in noise. Underdetermination isn't an all-or-nothing ghost; it's a spectrum of shadows, deepest where the models are most complex. That’s the reality on the ground, not in the philosopher's nightmare. *(Leans forward, intense)* Can you honestly say the worry about rival kinematics feels *as live* as the worry about rival climate physics? That’s the dimension gate in action.
