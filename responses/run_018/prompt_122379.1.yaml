answer: |-
  ## Memo to the Meridian Science Trust Oversight Committee  

  **Subject:** Addressing Epistemic Weathering and External Influence: A Path Forward for Trust Integrity  

  Colleagues,  

  As we approach Tuesday’s meeting, the urgency of recalibrating the Meridian Science Trust’s trajectory grows palpable. Our foundational mandate—funding *interdisciplinary* work—risks dissolving into a haze of procedural drift. The dual challenges before us—epistemic weathering in our evaluation criteria and the influence of large AI labs—demand not just diagnosis, but decisive action. I propose we confront these as distinct yet interconnected phenomena, prioritizing structural reform of our criteria *first*, augmented by targeted conflict-of-interest safeguards, with a clear 120-day implementation timeline.  

  **The Core Problem: Epistemic Weathering**  
  Epistemic weathering—the slow, unexamined erosion of our criteria toward predictive measurability—is the deeper malignancy. This drift isn’t malicious; it’s the entropy of bureaucracy. When complex, interdisciplinary visions (like "transformative knowledge integration" or "paradigm-bridging inquiry") are repeatedly assessed through narrow, quantifiable proxies ("output volume," "citation targets," "algorithmic predictability"), the language of value itself corrodes. We didn’t vote for this shift; we accreted it. The consequence is a self-perpetuating cycle: proposals increasingly mirror the measurable, not the meaningful, further normalizing reductive metrics. This weathering hollows out our identity far more insidiously than any external actor could.  

  **The Counterargument: Agentic Capture Isn’t the Root Cause**  
  I take seriously the perspective that the AI labs’ involvement—placing fellows on panels, co-authoring strategic papers aligning with our weathered metrics—is primarily *symptomatic*, not causal. Those arguing against "cracking down on relationships as corruption" rightly note that labs are rational actors: they optimize for success within *our existing framework*. Banning individuals or labs without fixing the criteria would be palliative, not curative. It risks creating an illusion of integrity while the ambient rot persists, and may inadvertently reinforce the very reductive thinking we aim to escape by casting complex systemic decay as a simple morality play. The strongest version of this view holds that we caused this drift; we alone can correct it.  

  **Why Structural Reform Must Come First**  
  While both issues matter, prioritizing the criteria rebuild is paramount. Restoring the conceptual foundation of "interdisciplinarity" as Meridian understood it in 1952—not as a buzzword, but as a *methodological ethos*—creates the necessary ground for any other reform. Attempting to police conflicts while metrics still incentivize predictability is like building a fence on quicksand. We must:  

  1.  **Reconstitute the Criteria Working Group (30 Days):** Form a committee including historians of science, philosophers, and practitioners from *neglected* interdisciplinary fields (e.g., environmental humanities, critical AI studies, decolonial STS) alongside quantitative scientists. Mandate: Define operationalizable, non-reductive core principles of "interdisciplinary merit." Examples: "Explicitly bridges incommensurable methodologies," "Demonstrates reflexive engagement with disciplinary assumptions," "Prioritizes questions inaccessible to a single field."  
  2.  **Re-Anchor Language in Foundational Intent (60 Days):** Rewrite RFPs and review rubrics. Replace generic or proxy terms ("impact," "scalability") with bespoke language demanding articulation of *how* the work transcends, challenges, or synthesizes disciplines. Require proposals to explicitly map their interdisciplinary *process*, not just predict outputs.  
  3.  **Introduce "Epistemic Audits" (Ongoing, First at 90 Days):** Implement annual qualitative reviews of funded projects and rejected proposals by an external advisory board tasked *solely* with assessing alignment against our newly articulated interdisciplinary principles. Their report feeds directly back into criteria refinement.  

  **Addressing Influence Without Vilification: A Necessary Corollary**  
  While not the root cause, the AI labs' activities exploit and accelerate our weathered state. Their alignment with measurable outputs isn't coincidence; it's strategic optimization. Therefore, *concurrent* with criteria reform, we implement targeted safeguards:  

  1.  **Strict Conflict-of-Interest Rules (120 Days):**  
      *   **Review Panel Composition:** No individual affiliated with a for-profit entity funding >$100M annually in AI research may serve on a review panel for grants intersecting with their entity’s core commercial interests. "Affiliation" includes current employment, paid consultancy within 24 months, or significant equity holding.  
      *   **White Paper Co-Authorship:** Trust staff or committee members co-authoring strategic documents with external entities must publicly disclose the scope of collaboration, funding sources (if any), and how potential conflicts were managed. All such papers undergo pre-publication review by the full oversight committee.  
  2.  **Transparency in Influence Tracking (Ongoing):** Maintain a public log of all external entities engaging in sustained strategic collaboration with the Trust (e.g., co-authored papers, sponsored workshops), alongside their stated commercial research priorities.  

  **The Bottom Line: Restore the Core, Shield the Process**  
  **I recommend we commit to a 120-day timeline for comprehensive criteria reform (Steps 1-3 above) as the essential priority, supplemented by implementing conflict rules (Step 4) within the same timeframe.** This sequence acknowledges that epistemic weathering is the foundational decay we must repair, while recognizing that unchecked external influence can exploit that decay. It rejects the false choice between blaming outsiders or blaming ourselves. It accepts that an institution *can* correct its own weathering without needing a villain, by deliberately rebuilding its conceptual scaffolding and processes through inclusive, principled deliberation. Banning actors without fixing the rules they gamed is futile; fixing the rules without guarding against those most incentivized to game them is naive. We must do both, starting with the soul of our criteria.  

  This path demands rigorous introspection and difficult choices about what "interdisciplinary" truly means for Meridian in this century. It will unsettle established workflows. But the alternative—continued drift toward becoming a funder of the predictably incremental, dressed in the fading robes of interdisciplinarity—is a far deeper betrayal of our 1952 covenant. Let us rebuild the foundation, then ensure its walls are sound.  

  Respectfully submitted for your consideration ahead of Tuesday’s discussion.
