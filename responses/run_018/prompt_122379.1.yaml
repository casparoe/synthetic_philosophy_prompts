  I'm writing this in between chapters of a novel about archives that slowly forget why they exist, and I also sit on the oversight committee for the Meridian Science Trust — it's been funding interdisciplinary work since 1952, though lately I'm not sure we remember what that phrase originally meant. We have a meeting Tuesday, and I need to circulate a memo beforehand that actually recommends something concrete with a timeline: either restructure our evaluation criteria to stop what I call epistemic weathering, where the language in our grant forms slowly drifts toward predictive measurability without anyone ever voting on the change, or impose strict conflict-of-interest rules on the large AI labs that have placed fellows on our review panels and co-authored strategic white papers that align suspiciously well with our new metrics.

  Some committee members treat this as classic influence-seeking capture and want to crack down on relationships like corruption; others think the labs are only reflecting a drift we caused ourselves, that thier values have slowly become whatever is easiest to score, and that banning people won't fix the ambient rot in our criteria. I need the response in continuous prose — no headings, bullet points, bold text, or tables, just like a long letter — with a clear bottom line I can defend, serious engagement with the strongest argument from the side you're not taking, and reasoning that works without citations or bibliographies since I won't be able to check sources. Please treat the distinction between agentic capture and this kind of slow value drift as genuinely different mechanisms rather than collapsing them, and recommend whether an institution can correct its own weathering without first identifying a specific enemy to blame.
