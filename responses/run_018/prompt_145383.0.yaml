answer: |-
  Here's a taxonomy decision tree based on core institutional purpose, phrased for concrete answers, aiming for distinct positions:

  **Decision Tree: Core Institutional Purposes of Marriage & State Recognition**

  1.  **Does marriage require a unique social function to justify state recognition?**
      *   **No:** Proceed to Position A.
      *   **Yes:** Proceed to Question 2.

  2.  **Which unique function is most essential?**
      *   **Reproductive / Child-Rearing:** Proceed to Question 3.
      *   **Romantic / Companionate Bonding:** Proceed to Position B.
      *   **Economic / Contractual Pooling:** Proceed to Position C.
      *   **Kinship / Alliance Merging:** Proceed to Position D.

  3.  **(If Reproductive/Child-Rearing) Is biological co-parenting essential?**
      *   **Yes:** Proceed to Position E.
      *   **No (Focus is on stable rearing environment):** Proceed to Position F.

  ---

  **Resulting Positions (Leaves):**

  *   **A. Abolitionist:** State recognition of any marriage is inherently unjustified or unnecessary.  
      *   *Awkward Commitment for SSM:* Opposes legal recognition/benefits for *all* couples, including same-sex ones, based on principle.
  *   **B. Revisionist Companionate:** Marriage's core purpose is recognizing and stabilizing deep, committed romantic/companionate bonds.  
      *   *Awkward Commitment for SSM:* Must argue that marriage isn't *necessary* for family formation/rearing, potentially devaluing that aspect.
  *   **C. Libertarian Contract:** Marriage is fundamentally a state-supervised contract for economic interdependence and mutual support.  
      *   *Awkward Commitment for SSM:* Logically must accept marriage between *any* consenting adults (e.g., platonic friends, siblings) capable of forming a contract.
  *   **D. Kinship-Alliance:** Marriage's primary role is creating or merging kinship networks and social alliances.  
      *   *Awkward Commitment for SSM:* May struggle to articulate how same-sex couples inherently form kinship *mergers* in the traditional sense without referencing procreation or complex social structures.
  *   **E. Conjugal:** Marriage's essential purpose is structuring the inherently procreative union of man and woman and rearing the resulting children.  
      *   *Awkward Commitment for SSM:* Must deny that same-sex couples, regardless of parenting, can achieve the core biological/social purpose of marriage.
  *   **F. Child-Rearing Centered (Non-Biological):** Marriage exists primarily to create the optimal stable environment (ideally dual-parent) for raising children, regardless of biological ties.  
      *   *Awkward Commitment for SSM:* Must downplay or redefine the role of romance/companionship as secondary to the parenting structure.

  ---

  **Blurred Lines & Notes:**

  1.  **Contract (C) vs. Abolitionist (A):** These *do* blur significantly. The key difference is whether the state should offer *any* standardized relationship contract framework (C says yes, A says no/not necessary). Someone answering "No" to Q1 might still accept private contracts but oppose the *institution* of state marriage, landing on A. Someone answering "Yes" to Q1 and choosing "Economic Pooling" sees a state role in providing/regulating that specific contract, landing on C.
  2.  **Kinship-Alliance (D) Ambiguity:** This position can overlap or feel incomplete. It might blend with Conjugal (E) in traditional contexts where kinship *is* formed via procreation, or with Child-Rearing Centered (F) if the alliance *is* for child-rearing stability. Its niche status makes it harder to isolate cleanly.
  3.  **Child-Rearing Centered (F):** This is often an unnamed position held by people who reject the *biological essentialism* of Conjugal (E) but still see marriage's *primary* social value in structuring child-rearing environments. Its awkwardness mirrors the tension between purpose (rearing) and form (couple-type).
  4.  **Companionate (B) Clarity:** This branch splits cleanly as the "Romantic Bonding" answer to Q2. Its core commitment to romance/companionship as *the* defining purpose sets it apart.

  This tree yields 6 distinct leaf positions based on the core purpose question and subsequent splits, highlighting their most logically consistent but potentially awkward stance on same-sex marriage within their own framework.
