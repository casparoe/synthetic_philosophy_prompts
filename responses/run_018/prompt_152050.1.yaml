answer: |-
  Your observation captures a distinct and problematic maneuver in deontological ethics that **lacks a single universally accepted label**, but is best identified as **"Catastrophe-Driven Conceptual Gerrymandering" (CDCG)**. This is distinct from threshold deontology, ad hoc exceptions, and honest conceptual refinement. I'll defend this identification and its boundaries.

  **Why "Gerrymandering" Fits Best:**

  1.  **Boundary Manipulation:** Like political gerrymandering, CDCG involves strategically redrawing conceptual boundaries (e.g., "deception," "mere means," "solemn promise") *not* for principled reasons internal to the concept, but to achieve a predetermined outcome: preserving the *formal* absoluteness of the rule by excluding catastrophic counterexamples.
  2.  **Retroactive & Outcome-Driven:** The redefinition is triggered *specifically* by the catastrophic scenario. The defender doesn't arrive at the narrower definition through prior analysis of the concept's core meaning; they *start* with the need to avoid the catastrophic outcome while maintaining the rule's formal status and work backward to redraw the boundaries.
  3.  **Covert Narrowing:** The rule appears unchanged ("Thou shalt not lie"), but its *scope* is silently contracted ("*That* wasn't *really* lying"). The absolutist facade remains intact.
  4.  **Spillover Effect:** Crucially, this newly gerrymandered boundary is then applied *retroactively* to moderate cases, significantly narrowing the rule's application in practice, even though it wasn't motivated by reflection on *those* cases. The rule becomes a shadow of its original, ostensibly broad, prohibition.

  **Distinguishing CDCG from Key Alternatives:**

  1.  **vs. Threshold Deontology:**
      *   **Threshold:** Explicitly acknowledges the rule *is* overridden in catastrophic circumstances. It admits a conflict and prioritizes consequences *above* a certain threshold. The rule genuinely *yields*.
      *   **CDCG:** Denies the rule *ever applied* to the catastrophic case. It avoids the conflict by redefining terms. The rule *never yields* formally, but its scope is manipulated.
      *   **Boundary:** Threshold deontology openly discusses the threshold and the justification for overriding. CDCG denies any overriding occurred by redefining the act.

  2.  **vs. Ad Hoc Exception:**
      *   **Ad Hoc Exception:** Adds a specific, unprincipled exception clause like "...unless a catastrophe would result." It's a patch on the rule.
      *   **CDCG:** Preserves the *form* of the absolute rule without exception clauses. The "escape" is achieved by manipulating the *meaning* of the rule's key terms, not by adding an exception.
      *   **Boundary:** An ad hoc exception explicitly suspends the rule; CDCG denies the rule was ever engaged by redefining the act-type.

  3.  **vs. Honest Conceptual Refinement:**
      *   **Honest Refinement:** Driven by *internal* conceptual analysis, linguistic intuition, logical coherence, or unpacking implicit assumptions *prior to* or *independent of* catastrophic counterexamples. The goal is accuracy to the concept itself, even if it leads to narrowing (or broadening).
      *   **CDCG:** Driven *entirely externally* by the catastrophic consequence. The conceptual analysis is reverse-engineered to exclude the problematic case. There's often a lack of independent justification beyond avoiding the counterexample.
      *   **Boundary:** Key test: **Motivation & Independence.**
          *   If the narrower definition arises from analyzing *what deception fundamentally is* (e.g., perhaps requiring intent to harm, or undermining trust in a specific way) *and* this analysis yields plausible results for *non*-catastrophic cases independently, it's refinement.
          *   If the *only* argument for the narrower definition is that it avoids the catastrophic implication, and the definition seems strained or implausible when applied to non-catastrophic cases the defender previously *would* have condemned (but now might not, due to spillover), it's CDCG.
          *   Example: Defining "lying" as *only* false statements made with malicious intent is refinement *if* argued from the nature of communication and trust. Defining "lying" as *only* false statements that *actually cause harm* (specifically to exclude the lie that prevents atrocity) is likely CDCG.

  **Boundary Cases & Edges of CDCG:**

  *   **Clear CDCG:** A defender insists "treating as a mere means" *only* applies if the victim gains *no* benefit whatsoever, specifically to exclude the "sacrifice one to save many" scenario where the one *is* used for others' benefit. This definition is then used to argue that many exploitative but marginally beneficial practices aren't "mere means."
  *   **Honest Refinement (Not CDCG):** A defender, after deep analysis of promising, argues that a "solemn promise" inherently implies a background condition of non-coercion and basic social stability, meaning promises made under extreme duress or in contexts of societal collapse *genuinely aren't* "solemn promises" in the relevant sense, based on the concept's internal logic, not just disaster avoidance.
  *   **Gray Area / Potential CDCG:** A defender argues "intentional killing of the innocent" excludes killing a culpable aggressor in self-defense. If motivated by analyzing agency and responsibility (refinement), it's not CDCG. If primarily motivated by needing *some* way to exclude justified defense from the prohibition without admitting an exception, it edges towards CDCG.
  *   **Edge: Spillover is Crucial:** CDCG is most clearly identified when the catastrophe-driven redefinition *alters the judgment of moderate cases*. If the gerrymandering *only* applies to the catastrophic outlier and leaves the core prohibition untouched, it might be seen as a desperate, isolated move. Its pernicious effect lies in the retroactive narrowing of the rule's *general* application.
  *   **Edge: Bad Faith vs. Sincerity?** CDCG can be done consciously (rhetorically defending absolutism) or unconsciously (a defender genuinely convinced by their own post-hoc rationalization). The *pattern* (disaster-driven boundary shift with spillover) defines CDCG, regardless of intent.

  **Conclusion:**

  The phenomenon you describe is **Catastrophe-Driven Conceptual Gerrymandering (CDCG)**. It's a distinct argumentative failure mode where the formal absoluteness of a deontological rule is preserved *not* by admitting justified exceptions (threshold) or adding clauses (ad hoc), but by strategically redrawing the conceptual boundaries defining the prohibited act-type. This redefinition is *driven by the need to exclude a catastrophic counterexample* and *results in the retroactive, unacknowledged narrowing of the rule's scope* when applied back to non-catastrophic cases. It differs from honest refinement by its external, consequence-driven motivation and lack of independent conceptual justification, and from threshold deontology by its denial that the rule was ever engaged rather than its being overridden. CDCG undermines the practical force of deontological rules while maintaining their rhetorical absolutism, making it a particularly insidious form of evasion.
