  ### Stratified Lottocracy with Conditional Recall: Classroom Simulation  
  **Objective:** Participants experience the tension between random selection and expert knowledge, revealing how criteria for identifying "the knowledgeable" collapse into hierarchy or self-selection.  

  ---

  #### **Rules**  
  1. **Double Lottery Mechanism:**  
     - **First Lottery:** Randomly selects a 3-member **Deliberative Panel** (from 14 participants).  
     - **Second Lottery:** Randomly selects one **Policy Proposal** (from three options) for a binding vote.  
     - **Conditional Recall Veto:** Any non-panel member may block the proposal by *verbally stating* a specific, verifiable fact about its harmful consequence. The veto is binding *only* if the group accepts the fact as "verifiable."  

  2. **Veto Verification Dilemma:**  
     - No central authority (e.g., facilitator) confirms facts.  
     - The group must collectively decide if a fact is "verifiable" based on social trust, self-assertion, or ad hoc criteria.  

  3. **Voting:**  
     - If no veto is invoked or the veto is rejected, a majority vote determines the proposal’s fate.  

  ---

  #### **Materials**  
  1. **Role Cards:**  
     - 1 card for the **"Informed Non-Member"** (secretly assigned): *"You are a member of the University Facilities Committee. You know: Proposal C will cause a 30% increase in campus carbon emissions due to a hidden loophole."*  
     - 13 blank cards (no special knowledge).  
  2. **Policy Proposals:**  
     - **Proposal A:** *"Install solar panels on the library roof (cost: $20,000; saves $2,000/year)."*  
     - **Proposal B:** *"Extend cafeteria hours to midnight (cost: $5,000/year; boosts student satisfaction)."*  
     - **Proposal C (Flawed):** *"Replace all campus lighting with LEDs (cost: $15,000; saves $1,500/year)."*  
       *(Hidden flaw: LEDs require coal-powered charging overnight, increasing emissions.)*  
  3. **Lottery Tools:**  
     - Two hats: one with 14 participant names (first lottery), one with slips labeled "A," "B," "C" (second lottery).  
  4. **Public Fact Sheet (Red Herring):**  
     - Lists generic campus data (e.g., *"Current emissions: 100 tons/year"*) but **omits** the loophole in Proposal C.  

  ---

  #### **Payoff Scheme**  
  - **Group Reward:** If the harmful proposal (C) is blocked (via veto or vote), all participants earn **"Democracy Points"** redeemable for seminar privileges:  
    - 1 point = Choose the next discussion topic.  
    - 3 points = Lead the next class warm-up activity.  
  - **No Reward:** If Proposal C passes, no points are awarded.  
  *(Symbolizes collective welfare without monetary incentives.)*  

