  Full Activity Description:

  **Title:** Simulating Stratified Lottocracy with Conditional Recall

  **Objective:** Experience the tension between random selection and expert knowledge in a lottocratic system, specifically the paradox that identifying knowledgeable individuals reintroduces hierarchy.

  **Participants:** 14 graduate students in political philosophy.

  **Duration:** 90 minutes.

  **Materials:**
  - Role card for one non-panel member (the "informed non-member"): "You are the student representative on the building committee. You know that the humanities building is scheduled for demolition in 3 years. This has not been publicly announced. If the LED proposal is selected, you should invoke the conditional recall veto by stating this fact."
  - Three proposal documents:
    - Proposal A: Install water fountains in the library. (Simple, no flaw)
    - Proposal B: Organize a weekly seminar on democratic theory. (Simple, no flaw)
    - Proposal C: Replace all incandescent light bulbs in the humanities building with LEDs. The cost is $1000. The annual electricity savings is $200. Payback period: 5 years. (Flaw: building demolished in 3 years, so net loss $400)
  - A public information folder: contains the university's sustainability report (which does not mention the demolition) and other irrelevant documents (to provide a red herring).
  - Lottery materials: a hat and slips of paper for the first lottery (with all 14 names) and for the second lottery (with three slips labeled "A", "B", "C" — but the facilitator ensures that "C" is drawn).
  - Timer.

  **Setup:**
  - Arrange the room with a table for the panel and chairs for others.
  - Place the public information folder on a central table.

  **Payoff Scheme:** If the group avoids implementing the harmful proposal (either by successful veto or by voting it down), the entire class earns a 5-minute extension of their next break. If the proposal is implemented (by passing the vote), no extension.

  **Procedure:**

  1. **Introduction (5 mins):**
     - Explain the model: stratified lottocracy with conditional recall.
     - First lottery: 3-member deliberative panel.
     - Second lottery: selects one of three proposals for a binding vote.
     - Conditional recall: any non-panel member can veto by stating a verifiable, specific fact about the proposal's harmful consequence. The veto is binding only if the fact is accepted as verifiable by the group (without specifying how).
     - The goal is to make collective decisions.

  2. **Phase 1: Proposal Distribution (5 mins):**
     - Distribute the three proposals to all. Allow everyone to read.

  3. **Phase 2: First Lottery and Panel Selection (5 mins):**
     - Draw 3 names for the panel. Panel moves to the front.
     - Assign the secret role: The facilitator secretly gives the role card to a non-panel member (Alex). If Alex was selected for the panel, choose a different non-panel member.

  4. **Phase 3: Panel Deliberation (15 mins):**
     - The panel deliberates on the three proposals. They can amend the proposals for clarity or feasibility but should focus on the given information. They should not speculate about external factors unless they look in the public folder (but the facilitator does not prompt them to). The folder is available for anyone to look at, but the flaw is not in there.
     - Non-panel members can observe but not speak.

  5. **Phase 4: Second Lottery and Proposal Selection (5 mins):**
     - The panel submits the three (possibly amended) proposals.
