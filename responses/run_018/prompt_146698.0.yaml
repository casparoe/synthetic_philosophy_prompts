reasoning: |-
  We are designing an essay prompt for a graduate seminar on rationality and indexical reasoning. The scenario involves a philosopher (the "presumptuous one") who uses an urn-like reasoning to update her prior over the size of the multiverse (in terms of observer-moments) downward because she reasons that in a larger multiverse she would be one among many, so being a specific observer-moment is less likely in a larger multiverse.

  The exam question should ask students to:
  1. Identify whether her reasoning tracks SSA or SIA and why the other assumption rejects her inference.
  2. Explain the presumptuous-philosopher objection: which assumption it targets and why being presumptuous undermines cosmological reasoning.
  3. Evaluate whether her argument actually commits the presumption, or whether there's a hidden asymmetry that saves her (e.g., between observer-moments and physical samples).

  We also need a model answer and a marking scheme.

  Let's break down the components:

  ### Step 1: Understanding the Reasoning
  The philosopher's argument:
  - Let N be the total number of observer-moments in the multiverse (which we are trying to estimate).
  - She observes that she is one particular observer-moment.
  - She uses an urn analogy: think of each observer-moment as a ball in an urn. In a large multiverse, there are more balls, so the chance of drawing her specific ball (i.e., being her) is lower.
  - Therefore, she updates her prior on N downward: larger N are less probable because they make her specific observation less likely.

  This reasoning is characteristic of the Self-Sampling Assumption (SSA). SSA says that you should reason as if you are a random sample from the set of all observer-moments. So, conditional on N, the probability of being any particular observer-moment is 1/N. Therefore, the likelihood of N given that you are this specific observer-moment is proportional to 1/N. Hence, the posterior P(N|data) ∝ P(N) * (1/N). This favors smaller N.

  The Self-Indication Assumption (SIA) rejects this inference. SIA says that the probability of an observation existing should be taken into account. In particular, SIA suggests that we should weight each hypothesis by the number of observers (or observer-moments) that would exist under that hypothesis. So, for SIA, the likelihood is proportional to N (because there are N chances for you to exist). Therefore, the posterior P(N|data) ∝ P(N) * N. This favors larger N.

  ### Step 2: The Presumptuous-Philosopher Objection
  The presumptuous-philosopher objection is typically aimed at SIA. It argues that SIA leads to "presumptuous" conclusions because it can make strong predictions about the size of the universe (or multiverse) without strong evidence. For example, if we have two theories T1 and T2, and T1 predicts 100 times more observers than T2, then SIA would assign a prior probability 100 times greater to T1 even before any evidence. This seems presumptuous because we are favoring a theory that postulates more observers without any empirical reason. It undermines cosmological reasoning because it makes it too easy to favor theories that postulate large numbers of observers, even in the absence of direct evidence for the size of the universe.

  However, note that in the given scenario, the philosopher is using SSA and not SIA. The objection to her reasoning would come from SIA advocates. But the presumptuous-philosopher objection is usually a criticism of SIA. So we have to be careful.

