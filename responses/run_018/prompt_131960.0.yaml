answer: |-
  Let us begin at the root: does dramatizing a real, deceased individual impose obligations distinct from those owed to purely fictional characters? If one answers no, then the filmmaker operates under the same liberties afforded to pure invention, a position we might call **Radical Fictional License**; its awkward commitment is that depicting, say, Winston Churchill as a secret Nazi sympathizer in a "biopic" carries no specific moral weight beyond avoiding generic slander laws, effectively dissolving the distinction between history and fantasy in representation. Most, however, find this unsatisfying and argue yes, there *are* special obligations, splitting our inquiry into *who* holds the primary claim: the dead individual themselves, living survivors and descendants, or the integrity of the historical record as a collective good.

  If the primary obligation runs directly to the dead person, we immediately confront a deeper split: can a deceased individual *genuinely* be wronged, possessing posthumous interests in dignity or reputation that persist despite their non-existence? If yes, then we enter the domain of **Posthumous Harm Theory**; its awkward commitment is defending the metaphysical possibility of harming a non-sentient entity, arguing that misrepresenting Marie Curie’s character fundamentally violates *her*, even centuries later. If, instead, we reject the possibility of genuine harm to the non-existent but still feel a strong duty, this duty must be derivative, owed not *to* the dead but *because* of them – perhaps honouring a 'narrative inheritance' bequeathed to us, a fragile identity-story held in trust. This **Narrative Stewardship** position avoids metaphysical puzzles but faces the awkward commitment of explaining why this stewardship imposes binding duties distinct from mere cultural preference, especially when the deceased left no clear testament or designated heirs.

  Further branching occurs within obligations *to* the dead (whether direct or derivative) regarding the *nature* of the violation. One view holds that only demonstrably *false* representations are problematic; inventing a deathbed confession where none occurred violates the truth, harming dignity or corrupting the inheritance. This **Falsity-Centered Restraint** awkwardly permits exposing deeply humiliating but *true* private details – say, a historically accurate portrayal of Beethoven's squalid, syphilitic demise – as long as the facts are correct. The opposing view argues that *truthfulness alone is insufficient*; even accurate portrayals can be invasive and undignified if they expose intimate suffering or private frailties beyond what serves legitimate historical understanding. This **Dignity-Centered Restraint** position, encompassing both avoiding falsity *and* respecting intimate privacy, faces the awkward commitment of defining where legitimate historical inquiry ends and gratuitous, dignity-violating intrusion begins, potentially censoring painful but truthful narratives.

  Shifting focus to the living, obligations owed primarily to survivors or descendants center on preventing collateral harm. This **Survivor Welfare** position prioritizes avoiding emotional distress, reputational damage, or cultural harm to living communities connected to the deceased; its awkward commitment is potentially allowing a powerful descendant to veto a truthful but unflattering portrayal that causes them discomfort, even if historically significant. This branch overlaps significantly with the 'narrative inheritance' view if descendants are seen as the designated trustees, creating a point where the tree struggles to cleanly separate survivor-centered duties from derivative duties to the dead.

  Finally, obligations may be owed to the historical record itself as a collective resource. Here, a crucial split arises: is the value of an accurate historical record *intrinsic* – a good in itself, demanding preservation untainted by fiction? If yes, then any invented dialogue or scene, however plausible, constitutes **Epistemic Pollution** of collective memory; this position's awkward commitment is demanding near-documentary purity in all dramatization, severely constraining the artistic form's ability to illuminate deeper truths absent perfect records. If the record's value is merely *instrumental* – valuable for understanding causal patterns, human nature, or institutional dynamics – then we face another split. Does this instrumental goal require **Literal Fidelity**, where filmmakers must stick rigidly to documented facts and attested dialogue, inventing nothing? Its awkward commitment is the near-impossibility of compelling drama when constrained solely by fragmentary historical evidence. Or, is **Structural Fidelity** sufficient? This position allows inventing specific conversations and composite scenes, provided the core psychological motivations, social pressures, causal chains, and institutional logics portrayed align with the best historical understanding. Its awkward commitment is justifying why fabricating specific moments (like that deathbed conversation) isn't inherently dishonest if the 'larger truth' is served, risking the substitution of artistic intuition for historical rigor.

  Examining the branches reveals unoccupied territory. A position valuing the historical record *intrinsically* while accepting that *structural fidelity alone* is adequate appears missing, likely due to incoherence: if pure historical truth is intrinsically valuable, inventing undocumented specifics seems inherently polluting, regardless of structural alignment. Similarly, the **Narrative Stewardship** position (derivative duty, no posthumous harm) doesn't have distinct sub-leaves for falsity versus invasion in this taxonomy, as its focus on the 'inheritance' potentially encompasses both harms without cleanly separating them conceptually. The tree also highlights tension points, like the overlap between **Survivor Welfare** and derivative duties to the dead when descendants are trustees, or the practical challenge **Dignity-Centered Restraint** faces in defining non-invasive truthfulness. Each leaf, whether named or unnamed, embodies a distinct constellation of beliefs about the debts we incur when we resurrect the dead for our stories, revealing the complex moral landscape filmmakers navigate between truth, art, memory, and respect.
