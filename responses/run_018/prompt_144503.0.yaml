answer: |-
  Here are eight focused question pairs:

  1. **Your "local regularities" within institutional frames sound susceptible to Popper's trend-to-law confusion – how are they not just disguised historical laws?**  
     *If these regularities reliably hold within their frame, isn't that precisely the kind of predictive power Popper argued history lacks?*

  2. **Does quantitative history (like cliodynamics), which finds statistical patterns in past societies, qualify as a form of historicism under your view?**  
     *If their models identify correlations *within* specific institutional settings, are they actually discovering your "local regularities," or just masking historicism with math?*

  3. **You posit necessary constraints on societal evolution across possible worlds. Doesn't this modal necessity reintroduce a deterministic structure Popper rejected, just shifted?**  
     *If certain societal outcomes are *impossible* across all accessible worlds, how is your position fundamentally different from strong historical determinism?*

  4. **With modern forecasting tournaments achieving measurable success in political prediction, does Popper's sharp distinction between scientific prediction and historicist prophecy still hold?**  
     *Don't these short-term, institutionally-bounded forecasts demonstrate the kind of local predictive power you endorse, blurring Popper's line?*

  5. **Does your framework genuinely preserve historical openness, or does it merely prune the tree of possibilities by declaring certain branches metaphysically impossible?**  
     *If the constraints are truly necessary across possible worlds, doesn't that mean actual historical paths were always severely canalized, undermining genuine contingency?*

  6. **How variable are the "institutional frames" that bound your local regularities? Could radically different institutions emerge, rendering existing regularities obsolete?**  
     *If institutions themselves can evolve unpredictably, doesn't that reintroduce Popperian openness at a meta-level, potentially negating the reliability of *any* local regularity?*

  7. **Do your necessary constraints primarily limit *structural* possibilities (e.g., feudalism after industrial tech), or do they also tightly constrain human *agency* and choice within societies?**  
     *If constraints bind structural evolution but leave significant agential freedom intact, how does that differ from Popper's own emphasis on the unpredictability of human knowledge?*

  8. **What empirical test could falsify your claim about necessary constraints on societal evolution, given we only observe one actual history?**  
     *Without observable counterfactual histories, isn't this modal claim inherently speculative and unfalsifiable, risking a new form of non-empirical historicism?*
