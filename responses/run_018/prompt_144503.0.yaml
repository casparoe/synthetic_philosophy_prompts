prompt: |-
  I'm hosting a philosophy podcast next week and the guest is an unnamed philosopher who defends a tweaked Popperian anti-historicism: she buys the poverty-of-historicism argument that there are no universal laws of history, but she adds this idea of "local regularities" that only hold inside specific instutional frames, plus she flirts with a modal claim that while actual history is open-ended, there are still necessary constraints on how societies can evolve across possible worlds. I need about eight interview questions, each with a follow-up keyed to the reply she's most likely to give — dont just have her restate Popper.

  Specifically I want questions that hit:
  - whether her local regularities just fall into the same trend-to-law confusion Popper attacked
  - what she makes of quantitative-history modeling (cliodynamics-style stuff) — is that historicism in disguise?
  - her modal twist: if determinism is pushed into possible worlds, is it really gone?
  - Popper's prediction-vs-prophecy distinction now that political forecasting tournaments exist
  - whether her view leaves any genuine historical branching or just prunes the tree differently

  Keep the whole response under 350 words. Number the pairs 1–8, put each main question in bold and the follow-up in italics. No generic biographical opener, no reading lists, no citations. I want them raw and in the weeds.
