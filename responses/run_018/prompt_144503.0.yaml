  Prediction tournaments are new since Popper's time. The guest needs to reconcile her view with modern forecasting. The follow-up should test if institutional boundaries make prophecies suddenly respectable.

  Finally, the branching question cuts to the heart of historical openness. If constraints exist, how much contingency remains? The follow-up should make her define what counts as genuine branching.

  I'll structure eight pairs hitting all these angles while staying under word count. The first five address user's explicit requests, then I'll add three more: one on institutional variability, another on constraints vs. human agency, and finally how to test her view. Each follow-up anticipates likely defenses and pushes deeper. 

