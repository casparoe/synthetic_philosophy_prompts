  ## The Silent Echo of Value: Emotion's Bare Orientation and the Tripartite Dispute

  The nature of emotion remains a contested landscape in philosophy of mind, dominated by three prominent frameworks: **judgment-based theories** (emotions as evaluative judgments), **perceptual theories** (emotions as perceptions of value), and **embodied-feeling theories** (emotions as feelings arising from bodily states). The conceptual test case of "silent affective valence" – a stable, object-directed feeling of profound "wrongness" or "disorder" towards a geometric configuration, devoid of articulable belief, physiological change, or qualitative bodily sensation beyond the bare orientation itself – serves as a potent probe, exposing fault lines and testing the resilience of each account. This scenario challenges the necessity of the core components demanded by judgment and embodied theories, while offering a seemingly natural home for the perceptual account, though not without significant objections.

  **The Test Case: Silent Affective Valence**
  Imagine an individual encountering a specific, irregular geometric arrangement – perhaps a subtly skewed polygon or an asymmetrical tessellation. Consistently and specifically directed *at this configuration*, they experience a deep, persistent sense that it is profoundly "wrong" or "disordered," akin to a moral or aesthetic violation. Crucially:
  1.  They report **no propositional belief** about the configuration's value (e.g., "I don't *think* it's ugly or bad; I just *feel* it's wrong in its very being").
  2.  They display **no measurable physiological changes** (heart rate, skin conductance, hormonal shifts).
  3.  They deny any **qualitative bodily sensations** (tightness, churning, warmth, cold) beyond the bare, non-sensory *sense of orientation* towards the configuration as disordered. The feeling is "located" solely in the intentional relation to the object.

  This "silent valence" presents a pure, stable, object-directed affective stance stripped of cognitive articulation and bodily resonance.

  **Challenging the Judgment-Based Account**
  Judgment theories (e.g., Solomon, Nussbaum) posit that emotions *are* or *essentially involve* evaluative judgments or beliefs about the significance of an object for one's well-being or goals. Fear *is* the judgment that something is dangerous; anger *is* the judgment that one has been wronged.

  *   **The Challenge:** Silent valence directly contradicts this core tenet. The subject explicitly denies holding any evaluative *belief* about the geometric configuration. The affective orientation exists independently of any articulable propositional content. The feeling of "wrongness" precedes and seems independent of judgment.
  *   **Possible Accommodation:** Proponents might argue the orientation *implies* a tacit, non-propositional evaluative state that functions *like* a judgment. The feeling *is* the evaluation itself, albeit non-linguistic.
  *   **Objection:** This stretches "judgment" beyond recognition, risking conceptual vacuity. If a judgment need not be articulable, propositional, or even consciously accessible, it loses its defining cognitive character and distinctness. Silent valence suggests evaluation can occur *without* the cognitive machinery judgment theories deem essential. The objection that this is merely a "proto-emotion" or intuition seems ad hoc – the subject reports a clear, stable, object-directed affective state they experience *as* an emotion (a sense of profound wrongness).

  **Challenging the Embodied-Feeling Account**
  Embodied theories (e.g., James-Lange, Damasio, Prinz) ground emotions in the perception of specific bodily changes (interoception, proprioception, physiological arousal). Feeling afraid *is* feeling one's heart race and muscles tense *because* of a stimulus. The body is the medium of emotional feeling.

  *   **The Challenge:** Silent valence explicitly excludes the required bodily components. There are no measurable physiological changes and, crucially, no qualitative bodily *feelings* beyond the intentional orientation itself. The subject doesn't feel their gut churn or chest tighten; they feel the *geometric configuration* as disordered. The affective valence lacks the somatic texture central to embodied accounts.
  *   **Possible Accommodation:** Embodied theorists might posit undetected micro-changes or argue the "bare sense of orientation" *is* itself a subtle, non-qualitative form of bodily registration – perhaps a proprioceptive sense of attunement or disattunement.
  *   **Objection:** This risks becoming unfalsifiable or conceptually strained. Denying the absence of *any* bodily feeling, even after careful introspection and measurement, undermines the core claim that distinct bodily feelings *constitute* specific emotions. If the feeling of "wrongness" has no bodily phenomenology beyond intentionality, it severs the necessary link to embodiment. The objection that this is merely a "cold" cognitive appraisal ignores the subject's report of a *profound* affective charge – it *feels* deeply wrong, not just intellectually assessed.

  **The Perceptual Account's Absorption**
  Perceptual theories (e.g., de Sousa, Roberts, Tappolet) conceptualize emotions as analogous to sensory perceptions. Just as vision registers color, emotions register value properties (dangerousness, offensiveness, wrongness). They are direct, non-inferential apprehensions of evaluative features in the world or in objects.

  *   **The Accommodation:** Silent valence fits naturally here. The subject's feeling of "wrongness" or "disorder" can be interpreted as the direct perceptual registration of an evaluative property inherent in the geometric configuration itself. The affective orientation *is* the perception of its disvalue. This requires no prior belief (it's direct) and no specific bodily feeling beyond the perceptual act (just as seeing red doesn't inherently require a bodily sensation beyond the visual experience). The stability and object-directedness align perfectly with perception.
  *   **Objections:**
      1.  **Collapse into Mood/Aesthetics:** Is this truly an *emotion* or merely a mood or aesthetic response? Moods lack specific objects; silent valence is distinctly directed. Aesthetic responses (e.g., finding something jarring) are arguably *themselves* emotional perceptions of value. The profound sense of "wrongness" suggests a depth akin to core emotions like disgust or moral outrage, even without their typical bodily signatures.
      2.  **The "Missing Why":** Perceptual accounts struggle to explain *why* this configuration is perceived as wrong. Judgment theories explain via reasons; embodied theories via bodily dispositions. Perceptualism seems to posit a brute, inexplicable sensitivity, potentially bordering on mysterianism. However, proponents can argue perceptual capacities (like color vision) often have innate or learned bases we don't consciously access during the perception itself.
      3.  **Distinction from Cognition:** Critics (e.g., judgment theorists) argue this "perception" is merely a disguised, non-conscious evaluative judgment. The perceptual account must firmly maintain that this registration of value is non-conceptual and non-propositional, occurring at a level prior to belief formation.

  **Evaluation and Conclusion: Perceptual Resilience and Taxonomic Revision**

  While all theories face pressure, the silent valence case most decisively **undermines classical judgment-based and embodied-feeling accounts.** Judgment theories cannot convincingly absorb an affective state devoid of articulable or even tacitly propositional content without abandoning their core commitment to emotion as a cognitive evaluation. Embodied theories falter when confronted with an affectively charged, object-directed state lacking any distinctive bodily phenomenology beyond the intentional stance itself. Attempts to force silent valence into these frameworks appear ad hoc or require stretching definitions beyond utility.

  The **perceptual account offers the most plausible accommodation.** It directly explains the object-directedness, the feeling of "givenness" (the wrongness appears inherent in the configuration), and the independence from both articulate belief and specific bodily feelings. The objections, while significant, are surmountable:
  *   The distinction from mood is clear via object-directedness.
  *   The comparison to aesthetic perception is apt and reinforces, rather than weakens, the case for emotional perception of value.
  *   The "missing why" is a challenge, but not unique to emotion – basic sensory perceptions often lack immediate introspective access to their underlying mechanisms.

  However, silent valence also **demonstrates the need for revision within the tripartite taxonomy.** It reveals a form of emotion that is "thinner" than typical cases rich in belief or bodily feeling, yet robustly affective and evaluative. This suggests:

  1.  **Perception as Core:** Affective perception of value is the fundamental core of emotion. Judgment and bodily feeling are frequent, but *contingent*, elaborations or consequences. Silent valence exemplifies this core – a direct registration of disvalue.
  2.  **Spectrum, not Categories:** The taxonomy should be seen less as three distinct boxes and more as dimensions along which emotional episodes vary. Silent valence lies at the "minimal" end: high on direct evaluative perception, low on cognitive articulation and bodily resonance. Most emotions incorporate more elements, but this minimal form exists.
  3.  **Reconceptualizing "Feeling":** The "bare sense of orientation" *is* the feeling within the perceptual model. It is the phenomenological aspect of perceiving value, distinct from feeling bodily states.

  **Conclusion**

  The silent affective valence test case powerfully exposes the limitations of judgment-based and classical embodied theories by presenting a stable, object-directed emotion devoid of their essential components. While the perceptual account absorbs it most convincingly by treating the orientation as the direct perception of an evaluative property ("disorderedness"), the case also compels us to refine our understanding. It reveals that the core of an emotion can be a *minimal, direct perception of value*, independent of articulate belief or distinctive bodily feelings. This suggests a revised view: **emotions are fundamentally perceptual registrations of value properties in the world, with cognitive judgments and bodily resonances being common, but not necessary, elaborations.** The tripartite taxonomy survives not as a set of mutually exclusive categories, but as a framework identifying key dimensions (evaluative content, cognitive articulation, bodily resonance) along which emotional experiences, from the silent valence of geometric wrongness to the shuddering dread of imminent danger, can meaningfully vary. Silent valence is not a counterexample to emotion, but a revelation of its most fundamental, perceptually grounded layer.
