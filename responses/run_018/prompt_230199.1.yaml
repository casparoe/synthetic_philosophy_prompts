  ### Decision Tree: Hempel's Ravens Paradox  
  *Follow the branches based on your intuitive judgments about concrete cases. The tree leads to major philosophical positions without requiring prior knowledge of their names.*

  #### Root Question:  
  **Is confirmation (support for a hypothesis) an all-or-nothing logical relation, or a matter of degrees (e.g., probabilities)?**  
  - **All-or-nothing (qualitative)** → Go to Section A.  
  - **Matter of degrees (quantitative)** → Go to Section B.  

  ---

  ### Section A: Qualitative (All-or-Nothing) Confirmation  
  1. **Does observing a black raven confirm "All ravens are black"?**  
     - **No** → **Leaf 1: Skeptical View**  
       - *Gives up:* Instance Condition (rejects that positive instances always confirm).  
       - *Awkward commitment:* Denies that even straightforward evidence (like a black raven) supports the generalization.  
     - **Yes** → Proceed to 2.  

  2. **Does observing a white shoe confirm "All ravens are black"?**  
     - **Yes** → **Leaf 2: Hempel's View**  
       - *Gives up:* Anti-Confirmation Judgement (rejects that the white shoe fails to confirm).  
       - *Awkward commitment:* Accepts that a white shoe genuinely confirms "All ravens are black," attributing the paradox to psychological bias.  
     - **No** → Proceed to 3.  

  3. **Does observing a white shoe confirm "All non-black things are non-ravens"?**  
     - **Yes** → **Leaf 3: Equivalence-Denial View**  
       - *Gives up:* Equivalence Condition (rejects that logically equivalent hypotheses share evidence).  
       - *Awkward commitment:* Must explain why identical claims in different wording ("ravens" vs. "non-black things") have distinct evidential rules.  
     - **No** → **Leaf 4: Goodmanian Projectibility View**  
       - *Gives up:* Instance Condition (restricts it to "natural" predicates like *raven* or *black*).  
       - *Awkward commitment:* Requires a theory of "projectible" predicates to exclude grue-like counterexamples.  

  ---

  ### Section B: Quantitative (Probabilistic) Confirmation  
  4. **Does observing a black raven increase the probability of "All ravens are black"?**  
     - **No** → **Leaf 1: Skeptical View** (Same as in Section A)  
     - **Yes** → Proceed to 5.  

  5. **Does observing a white shoe *always* increase the probability of "All ravens are black" (even minutely)?**  
     - **Yes** → **Leaf 5: Bayesian View (Good)**  
       - *Gives up:* Anti-Confirmation Judgement (rejects that the shoe fails to confirm; it confirms negligibly).  
       - *Awkward commitment:* Accepts that any non-black non-raven (e.g., a white shoe) always confirms the hypothesis, however trivially.  
     - **No** → Proceed to 6.  

  6. **Can observing a white shoe *sometimes* increase the probability of "All ravens are black", depending on how the object was selected?**  
     - **Yes** → **Leaf 6: Sampling-Procedure View**  
       - *Gives up:* Universal applicability of Instance/Equivalence (confirmation depends on sampling context).  
       - *Awkward commitment:* Claims the *same object* (e.g., a white shoe) confirms only if found randomly (e.g., in a bird survey), not if preselected (e.g., in a shoe store).  
     - **No** → **Leaf 7: Inconsistent or Unexplored**  
       - *Diagnosis:* If you deny the shoe *ever* confirms, but accept it confirms the contrapositive (logically equivalent), you contradict probabilistic equivalence. Otherwise, unexplored.  

  ---

  ### Flagged Collapses and Taxonomy Limits  
  - **Bayesian vs. Sampling-Procedure:** These collapse without a question about **full inertness**. The tree distinguishes them by asking if selection can make the shoe *non-confirming* (Sampling) vs. merely *weakly confirming* (Bayesian).  
  - **Goodmanian vs. Equivalence-Denial:** These may blur if both appeal to "unnatural predicates," but the tree separates them by asking **if the shoe confirms the contrapositive** (Equivalence-Denial: yes; Goodmanian: no).  
  - **Taxonomy Limits:** The tree cannot resolve:  
    - Unexplored cells (e.g., rejecting all three claims or exotic hybrids).  
    - Quantitative Goodmanian views (Leaf 7).  
    - Cases where "degrees" and "sampling" are entangled (e.g., if negligible confirmation implies de facto inertness).  

  ---

  *This tree maps intuitive judgments to 7 key positions. Inconsistent cells are flagged; unexplored cells lack major adherents.*
