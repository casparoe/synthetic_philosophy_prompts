prompt: |-
  hey, i host a small philosophy podcast and next weeks guest is a cognitive anthropologist defending religion as a natural phenomenon — she buys the standard byproduct story (agency detection, theory of mind, contamination-avoidance) but adds this niche twist she calls the "doctrinal bottleneck." her claim is that spontaneous religious experiences — visions, possession, direct revelation — are the raw cognitive outputs, and that world religions survive institutionally precisely by filtering them out through creeds, hierarchies, and canonical texts. i want eight to ten interveiw questions that go well past having her restate the byproduct view. specifically i need at least one on how she accounts for mystical experience persisting inside institutional settings despite the bottleneck; one on whether her model implies that "true" religion is always the unfiltered charismatic kind; and one on what evolutionary psychology gets wrong about large-scale cooperation if her bottleneck framing is right. for each of those three, include a follow-up keyed to the answer shes most likely to give. and please take a committed stance yourself — dont just lay out options — on whether her bottleneck idea actually saves cognitive science of religion from the just-so-story charge, and defend that position with reasons. no generic "what drew you to this" stuff.
