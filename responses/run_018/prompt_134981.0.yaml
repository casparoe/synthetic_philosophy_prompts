  First, I need to unpack the doctrinal bottleneck concept. It's about spontaneous religious experiences (visions, possessions, revelations) being raw cognitive outputs. Religions survive by filtering these out through creeds, hierarchies, and texts. So institutional structures act as a bottleneck, controlling the chaotic elements to maintain stability.

  For the questions, starting with how mystical experiences persist despite the bottleneck. The guest might say that institutions tolerate or incorporate these experiences in controlled ways. Follow-up could challenge that by pointing out cases where mystics threatened orthodoxy, asking how institutions balance suppression and co-option.

  Next, whether "true" religion is the unfiltered kind. Her likely answer is that unfiltered experiences are foundational but unsustainable without structure. Follow-up could push on whether the bottleneck distorts the original experiences, making religions inauthentic.

  Then, evolutionary psychology's view on large-scale cooperation. She probably argues that ep focuses too much on innate mechanisms, ignoring institutional scaffolding. Follow-up could ask how the bottleneck facilitates cooperation without shared supernatural beliefs, maybe through shared symbols or rituals.

  The user also wants me to take a stance on if the bottleneck saves CSR from just-so stories. Just-so stories are unfalsifiable evolutionary tales. The bottleneck adds a testable mechanism—how institutions manage cognitive outputs. That provides historical and cross-cultural evidence, moving beyond speculation. So I'll argue that it does save CSR by introducing falsifiable elements.

  I should create 8-10 questions total. The user specified three main questions with follow-ups, so that's six. Adding two more to round it out. Maybe one on the origins of the bottleneck and one on future research.

  Ensure questions are sharp and push the guest. Avoid generic stuff. Use terms like "epistemic anarchism" or "scaffolding" to show depth. Also, my stance needs clear defense: bottleneck offers testable hypotheses, addresses variation, integrates with institutional analysis.

  Check if all user points are covered: mystical persistence, true religion, ep's cooperation errors, and the just-so stance. Follow-ups should anticipate responses. For example, if she says institutions co-opt mystics, ask about cases where they failed. If she distinguishes between experiential core and institutional shell, question if the shell corrupts the core.

  Finally, structure the response clearly: questions first, then my stance. Keep questions concise but insightful. Make sure the follow-ups are tied to likely answers to demonstrate active engagement.
answer: |-
  Here are 10 tightly focused interview questions addressing your guest's "doctrinal bottleneck" theory, pushing beyond standard byproduct accounts and incorporating your specific requirements, including committed stances on key points:

  **Core Questions & Follow-Ups:**

  1.  **Beyond Filtering:** You argue the "doctrinal bottleneck" (creeds, texts, hierarchies) actively *filters out* spontaneous religious experiences (visions, possession, revelation) – the raw cognitive outputs. Yet, mystics like Teresa of Ávila or Sufi poets *thrive* within highly doctrinal traditions. How does your model account for this persistent, even celebrated, mystical core *inside* the very institutions designed to filter it out?
      *   *Likely Answer:* She’ll argue institutions *tolerate* or *co-opt* controlled mysticism only when it reinforces orthodoxy/power structures, or that mystics operate in sanctioned "spaces" (monastic orders, specific rituals).
      *   **Follow-Up:** Doesn't this suggest the bottleneck isn't just a filter but a *shaping mechanism* – transforming raw experience into institutionally *useful* forms? If so, isn't the "raw output" fundamentally altered, making claims about its pure cognitive nature harder to sustain within the very religions that survive?

  2.  **The "True Religion" Challenge:** If spontaneous, unfiltered experiences are the "raw outputs" of our cognitive machinery for religion, and institutions survive by *suppressing* this raw form through the bottleneck, does your model imply that "true" or "authentic" religion is *always* the pre-institutional, charismatic, unfiltered kind – effectively making organized religion a kind of necessary betrayal?
      *   *Likely Answer:* She’ll likely resist this, arguing unfiltered experience is unsustainable/chaotic at scale; the bottleneck enables transmission, cooperation, and cultural survival – it's an *evolution* of the raw impulse, not a betrayal.
      *   **Follow-Up:** But doesn't this position risk privileging the *cognitive origins* (the raw experience) as the "real" thing, while treating the *institutional reality* (what billions practice) as a secondary, derivative artifact? Isn't this a potential flaw in cognitive approaches – focusing on genesis over function?

  3.  **Cooperation & Evolutionary Psychology:** Evolutionary psychologists often posit innate "tribal instincts" or supernatural punishment beliefs as the *primary* drivers of large-scale religious cooperation. Your bottleneck framing suggests institutions *create* stability for cooperation *by filtering* chaotic individual experiences. What does this say EP gets fundamentally *wrong* about how large-scale cooperation emerges from religious cognition?
      *   *Likely Answer:* She’ll argue EP overemphasizes innate cognitive *mechanisms* while underestimating the crucial *cultural scaffolding* (the institutional bottleneck) required to channel those mechanisms into stable, large-scale cooperation. The bottleneck *enables* cooperation precisely by *suppressing* the very individualistic supernatural impulses EP often focuses on.
      *   **Follow-Up:** So, if the bottleneck (texts, creeds, hierarchies) is the key *enabler* of large-scale cooperation, rather than just shared supernatural beliefs, does this mean successful religions cooperate effectively *despite* significant variation in individual members' underlying cognitive "raw experiences"? Is shared *practice* and *authority* more crucial than shared *belief* originating from cognitive byproducts?

  **Additional Sharp Questions:**

  4.  **The Bottleneck's Origin Story:** How does the doctrinal bottleneck *itself* emerge evolutionarily/culturally? Is it driven by elite power consolidation, pragmatic needs for group stability, cognitive demands for coherence, or something else? Isn't positing this bottleneck just kicking the "how does complex religion emerge?" can down the road?
  5.  **Charismatic Challenge:** History is littered with charismatic figures (Joan of Arc, Sabbatai Zevi) whose direct revelations *exploded* through doctrinal bottlenecks, sometimes creating new religions or sects. How does your model account for these "bottleneck breakers"? Are they evidence of the system failing, or paradoxically, a source of renewal *for* the system?
  6.  **Cognitive vs. Cultural:** You locate the *source* (raw experiences) firmly in cognitive byproducts. But the *bottleneck* (creeds, texts, hierarchies) is clearly cultural/institutional. Doesn't this create a problematic dualism? How do these two levels – the innate cognitive and the constructed cultural – interact *beyond* simple filtering? Does the bottleneck *shape* the cognition over time?
  7.  **The Atheism Angle:** If successful religions *must* suppress the very spontaneous experiences that are the core cognitive output generating belief (via agency detection, etc.), does this inadvertently suggest that *institutional* religion might be a less "natural" cognitive state for humans than either raw charismatic experience *or* secular disbelief? Is organized belief the unnatural one?
  8.  **Beyond Survival:** You frame the bottleneck as necessary for institutional *survival*. But does it also *enhance* or *diminish* the potential adaptive *benefits* (e.g., for cooperation, meaning-making, anxiety reduction) proposed for religion compared to the unfiltered raw state?

  **Your Requested Committed Stance: Does the Bottleneck Save CSR from Just-So Stories?**

  **Yes, significantly, but with crucial nuance.** Here's the committed defense:

  *   **The Charge:** CSR's standard byproduct accounts *are* vulnerable to "just-so" charges. Explaining religion as misfiring agency detection or hyperactive theory of mind can feel like post-hoc storytelling: "We see religion; therefore, these mechanisms must have been prone to overextension." It struggles to explain the *specific forms* religion takes and their variation, often defaulting to vague cultural "add-ons."
  *   **How the Bottleneck Helps:**
      1.  **Adds a Testable Mechanism:** The bottleneck isn't just *why* religion exists (byproducts), but *how* specific, stable religious forms emerge *from* that raw material. This generates falsifiable hypotheses: Do religions with stricter doctrinal controls (e.g., centralized hierarchies, canonical texts) show *less* internal variation in core beliefs/practices and *more* longevity/stability than those relying primarily on charisma/oral tradition? Historical and anthropological data can be marshaled here.
      2.  **Explains Variation & Stability:** It directly addresses *why* religions look so different (different bottlenecks) and *why* some survive while charismatic movements often implode. This moves beyond merely identifying cognitive seeds to explaining the cultural gardening required for them to become enduring institutions.
      3.  **Integrates Cognition and Culture:** It forces a dialogue between the cognitive *origins* and the cultural *structures*. The bottleneck is the interface. This moves CSR beyond pure nativism towards a more dynamic biocultural model, making it less reductionist and less vulnerable to charges of ignoring history/power.
      4.  **Focuses on Process, Not Just Origin:** Instead of only explaining the *spark* (cognitive byproducts), it explains the *engine* (institutional filtering) that turns the spark into a lasting fire. This process-oriented view is inherently less "just-so" than a simple origin story.
  *   **The Nuance:** It doesn't *eliminate* speculation. Questions about *why* specific bottlenecks emerge (Q4) or *how exactly* cognition and culture interact (Q6) remain complex. However, by providing a specific, functional mechanism linking universal cognitive tendencies to observable cultural diversity and stability, the bottleneck theory elevates CSR beyond simplistic adaptationist tales or untestable byproduct claims. It offers a *framework* for empirical investigation into religious institutionalization, making it a stronger, more defensible theory. **Therefore, the bottleneck idea substantially strengthens CSR against the "just-so" charge by introducing a concrete, testable mechanism for cultural canalization.**

  These questions are designed to push the guest beyond restating the byproduct model, directly engage the unique implications of the bottleneck, challenge potential weaknesses, and illuminate the theory's significance for debates about cognition, culture, cooperation, and the nature of religion itself. Good luck with the interview!
