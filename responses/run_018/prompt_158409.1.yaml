answer: |-
  Your argument is brilliantly constructed and captures a genuine tension in evolutionary naturalism. The self-defeating skepticism in step (7) is the logical endpoint if we accept all premises uncritically. Let's diagnose the leak:

  **The Critical Leak is in Step (6):**  
  *"Belief in evolutionary theory is itself an evolved cognitive habit, shaped for survival and prediction, not necessarily for truth."*  
  This step equivocates between **cognitive capacities** and **specific beliefs/methods**. While our *capacity* for reasoning is evolved, the *content* and *validation* of scientific theories (like evolution) rely on external reality-testing that transcends raw instinct.

  **Why Step (6) Fails:**
  1.  **Science is not an "instinct" or "habit":** It's a **culturally evolved methodology** (observation, experimentation, peer review, falsifiability) designed explicitly to *overcome* cognitive biases and subjective instincts. Darwin didn't *feel* evolution; he *inferred* it from evidence using disciplined reasoning.
  2.  **Truth-tracking *can* be adaptive:** While evolution selects for survival value, accurate predictions about the physical world (e.g., "lions are dangerous," "water quenches thirst," "seeds grow when planted") *enhance* survival. Science systematizes this impulse.
  3.  **External calibration:** Scientific claims are tested against a shared, mind-independent reality. If evolutionary theory were merely an unfalsifiable "habit" (like a sweet tooth), it couldn't generate novel, verifiable predictions (e.g., transitional fossils, genetic phylogenies, antibiotic resistance).

  **Consequences of Rejecting Step (6):**
  *   **Price:** You must accept that evolved cognitive capacities, when disciplined by rigorous methods (science), *can* produce reliable knowledge about the world, even if the *initial impulse* to understand has evolutionary roots. This doesn't require supernaturalism; it acknowledges that reality constrains successful theories.
  *   **Benefit:** You preserve the rational authority of science *without* denying Darwin's core insights about the origins of morality and religion. Science becomes a *tool* that, while initially enabled by evolution, escapes pure biological determinism through its self-correcting mechanisms.

  **Addressing Your Gut Instinct:**
  *   Saving (1) & rejecting (2) *might* work (e.g., if you argue religious belief *does* track truth), but it doesn't solve the deeper problem for science itself. It also forces a non-Darwinian move regarding religion.
  *   Your worry about "sneaking in a normative layer" is valid *for morality* under strict naturalism (Darwin's horror *is* instinctive recoil). But science introduces **epistemic norms** (evidence, logic) that are *procedural*, not moral, and demonstrably effective.

  **Why Other Steps Hold (with nuance):**
  *   **(1)-(3):** Darwin's accounts of morality/religion as adaptive products *are* plausible naturalistic explanations. They don't *necessarily* deny objective truth (though Darwin leans that way), but they *do* challenge naive realism about moral/religious intuitions.
  *   **(4) & (5):** If (1)-(3) are correct, then Darwin's moral sentiments and agnosticism *are* indeed products of his evolved biology/culture. This *is* consistent with naturalism.
  *   **(7):** Only follows if (6) is true. Rejecting (6) prevents the self-defeat.

  **The Resolution: Evolutionary Epistemology**
  Darwin's science isn't *just* an instinct; it's the product of evolved capacities harnessed by a **reality-testing social institution**. While evolution explains *why* we *have* brains capable of science, it doesn't dictate the *content* of validated scientific theories. Those theories succeed precisely because they are constrained and corrected by the external world. The horror of slavery might be instinctive (adaptive group cohesion), but the evidence for evolution is intersubjectively verifiable and predictive.

  **In short:** Reject the conflation in step (6). Darwin's account of morality/religion stands without sinking his science. The price is acknowledging science as a unique, culturally-evolved *practice* that leverages evolved capacities to achieve reliable knowledge, precisely *because* it prioritizes evidence over untested instinct or habit. This saves Darwin from self-defeat while honoring his biological insights.
