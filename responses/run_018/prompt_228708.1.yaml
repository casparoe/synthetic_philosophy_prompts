prompt: |-
  Okay so last night I got into this massive argument with my friend Dev about superrationality, Hofstadter's thing where if you know the other players reason like you do, you should pick the outcome you'd want everyone-similarly-situated to pick. It started over whether defecting in a one-shot prisoner's dilemma against a perfect copy of yourself is irrational, and three hours later we were yelling about voting and whether it makes sense to vote given your vote basically never swings anything. Dev's position is that superrationality is just dressed-up magical thinking, like you're causally influencing the other person by choosing, and I kept failing to explain why it's not that.

  Here's the thing: Dev hosts a board game night and he's now dared me to explain superrationality to his group in like 15 minutes while they set up. These are smart people, engineers and a nurse, but no philosophy background at all. I don't want the explanation itself, I want you to plan how I should do it, because I clearly suck at this.

  What I need from you:

  - The order the pieces have to come in. Like, what has to be in their heads before the core move of "your twin reasons the same way, so the real choice is between both-cooperate and both-defect" will even land as a move and not a trick. I suspect I led with the wrong thing with Dev.
  - The ONE example to build the whole thing around. I don't think it should be the classic prisoner's dilemma with payoff matrices, because the numbers make people think it's about arithmetic, and I also don't want to open with "imagine a perfect clone of yourself" because that's what made Dev say I'd left the real world entirely. So pick a better carrying case, tell me what it needs to have, and warn me what features it must NOT have or the whole thing collapses.
  - The misconceptions in the order these people will generate them. My guesses: (a) it's telepathy / you're somehow controlling the other player, (b) it's just Kant's categorical imperative with a sci-fi hat on, (c) it only works against literal identical copies so it's useless in real life, (d) it's just iterated-game cooperation where you cooperate because they'll punish you later. Tell me where in the sequence to head each one off, and whether any of them should actually be ALLOWED to sit for a while because correcting it too early costs you something.
  - One question or mini-scenario I can throw at them at the end that would show whether they got it, i.e. whether they can apply the idea to a case we didn't discuss rather than just nodding along. Ideally something that seperates "they understood the symmetry move" from "they just memorized cooperate good."
  - What I should explicitly refuse to get into in 15 minutes (the Löbian stuff? evidential vs causal decision theory? whether this actually solves anything in ethics?) and the one-line dodge for each if someone pushes.

  Also, fair warning: Dev will be there, and he will heckle. If the plan has a step that obviously fails on a skeptical engineer, flag it and give me a backup move. Don't recommend me readings, I won't read them, this is happening Thursday.
reasoning: |-
  Okay, let me tackle this user's problem. They need to explain superrationality to a group of smart but non-philosophy folks in 15 minutes, after failing to convince their friend Dev. The key is to make it intuitive and avoid past mistakes.

  First, the user mentioned starting with a "perfect clone" idea made Dev dismiss it as unrealistic. So I need an example that feels real-world and avoids sci-fi elements. Voting seems like a strong candidate because everyone understands it, and it highlights symmetry without needing identical clones. People know that their vote is one of many similar votes, which sets up the symmetry naturally.

  Next, the misconceptions. The user listed several, like telepathy or Kantian ethics. I should address telepathy early by emphasizing that it's not about influencing others but recognizing shared reasoning. For the Kant comparison, maybe acknowledge it briefly but clarify that superrationality is about optimal outcomes through symmetry, not duty. The voting example helps here because it's practical, not moral.

  Order matters. Starting with voting makes sense because it's relatable. Then, after establishing the symmetry, transition to Prisoner's Dilemma. But keep the PD payoff matrix simple, using colors or symbols instead of numbers to avoid getting bogged down in calculations. Point out that mutual cooperation is better than mutual defection, and the symmetry forces choosing between these two outcomes.

  For the "aha" moment, the user needs a scenario that tests understanding. Asking about a traffic light where everyone must decide to stop or go could work. If they apply the symmetry reasoning to choose stopping (mutual cooperation equivalent), they get it. If they say run the light, they missed the point.

  Time management is crucial. Avoid diving into Löbian reasoning or decision theory. If someone brings it up, deflect by saying it's beyond the 15-minute scope. Also, Dev's heckling: if he argues, pivot back to the voting example and ask the group what they'd do, using peer pressure to engage others.

  Finally, the closing question should reinforce the core idea. Emphasize that superrationality is about coordinated choices in symmetric situations, applicable beyond clones. Keep it practical, relatable, and focused on the key takeaway: "What if everyone did that?" as a strategic tool.
answer: |-
  Here’s a battle-tested 15-minute game plan designed for skeptical engineers and a nurse, pre-empting Dev’s heckling. Focus on **clarity, relevance, and one big "aha" moment**.

  **Core Strategy:** *Anchor in a real-world example first, then generalize. Treat it as a coordination tool, not philosophy.*

  ---

  ### **The Sequence (12-15 min total)**
  *(Timings are rough; watch their eyes for confusion/engagement)*

  1.  **Hook: The Voting Paradox (2 min)**
      *   **Start Here:** "Raise your hand if you’ve ever thought 'Why vote? My vote won't swing the election.'" (Most will raise hands).
      *   **Set Up:** "Imagine an election for something *really* important to all of you – say, whether this board game group gets free pizza every week. It's a close race, decided by popular vote. *Thousands* of people just like you – same info, same stakes – are deciding right now."
      *   **The Dilemma:** "You think: 'If enough others vote Yes, we get pizza. If not, we don't. But *my one vote*? It won't change the outcome. It costs me 10 minutes to vote... so why bother?'"
      *   **Why this works:** It’s relatable, symmetric (thousands of identical reasoners), avoids clones, and highlights the core conflict: individual rationality vs. group need. *No numbers, just stakes.* **Crucial:** Establish "all voters are similarly situated, know the stakes, and are reasoning."

  2.  **Introduce the Symmetry Move (The "Aha" - 4 min)**
      *   **Pivot:** "Here’s the superrational twist: *What if everyone reasoned exactly like you?* Not clones, just people in the same boat, thinking the same way you are right now."
      *   **Apply to Voting:** "If *everyone* thinks 'My vote doesn't matter, I won't bother'... what happens? *Nobody votes.* Pizza loses by default. Disaster!"
      *   "If *everyone* thinks 'Even if my vote is tiny, if we all do this, we win'... then *everyone votes*, pizza wins! Success!"
      *   **The Core Point:** "Superrationality says: *Your real choice isn't just 'Do I vote?'. It's 'Do I want to live in the world where everyone like me votes, or the world where no one like me votes?'* Your decision is a vote *for which collective outcome happens*."
      *   **Label It:** "This is the 'symmetry move'. You recognize others are reasoning like you, so you choose the outcome you'd want *everyone* to choose."

  3.  **Connect to Prisoner's Dilemma (PD) - Now They're Ready (3 min)**
      *   **Transition:** "This same logic solves Dev's puzzle about defecting against a 'copy'. Forget clones for a sec. Think of it as playing against someone *just as smart and self-interested as you, who knows you're just as smart and self-interested as them.* Like two engineers negotiating a deal."
      *   **Simple PD Setup:** Briefly sketch the choices (Cooperate/Defect) and outcomes. **USE SYMBOLS, NOT NUMBERS:** "Best for me if I Defect & you Cooperate (I win big, you lose). Worst for me if I Cooperate & you Defect (I lose big). Okay if we both Cooperate. Bad if we both Defect."
      *   **Apply Symmetry:** "Standard thinking: 'No matter what they do, I'm better off Defecting!'. BUT... superrationality asks: *What if they're reasoning just like me?*"
      *   **The Choice Redefined:** "My real options are: **A)** We *both* Cooperate (okay outcome). **B)** We *both* Defect (bad outcome). Defecting *only* gets me the 'best' outcome if the *other* person *doesn't* reason like me – which breaks the symmetry! If we're truly symmetric reasoners, Option A (both Cooperate) is strictly better than Option B (both Defect)."
      *   **Key Phrase:** "It's not 'I control them'. It's 'We're locked in this reasoning pattern *together*, so we can only consistently land on **both-C** or **both-D**, and **both-C** is better.'"

  4.  **Pre-empting Misconceptions (Weave In During Steps 2 & 3)**
      *   **(a) Telepathy/Control:** "This isn't ESP! It's recognizing a *logical constraint*. If we accept we're both using the *same* reasoning framework, only certain outcomes are consistent. Like in voting – I don't control others, but I know if we all think *this* way, *that* happens." *(Head this off HARD and EARLY, during the voting explanation)*.
      *   **(b) Kant:** "It feels a bit like 'What if everyone did that?', right? But this isn't about *duty* or morality. It's cold, hard logic about getting the best *possible outcome for yourself* given that others are mirroring your reasoning. Kant wants you to be good; superrationality wants you to win *when winning requires coordination*." *(Address when the symmetry move clicks, contrast "winning" vs. "being good")*.
      *   **(c) Only Clones/Useless:** "We started with *voting* and thousands of strangers! It works anytime you reasonably believe others in your situation are likely to think *very similarly* to you about the stakes and the logic. Board games? Negotiations? Traffic norms? Limited, but real!" *(Emphasize the "similarly situated reasoners" aspect throughout)*.
      *   **(d) Iterated Games/Punishment:** "Totally different! That's about *future consequences*. This is about a *single interaction* where the only 'punishment' is landing in the worse symmetric outcome because you both chose selfishly. No next round needed!" *(Contrast explicitly when explaining PD: "This is ONE shot, no do-overs, no reputation")*.

  5.  **The Test Question (2 min)**
      *   **Scenario:** "**The Broken Traffic Light:** You're the first car at a busy intersection. The light is completely dead, dark. There's no cop, no camera. Cars are piling up behind you and across the way. Everyone just wants to get home. Do you go, or wait?"
      *   **Why it works:** High symmetry (all drivers in same boat), clear self-interest (get home fast/safely), coordination needed. "Go" is tempting (defect) but catastrophic if others do.
      *   **What to listen for:** "If everyone just goes, it's chaos and accidents. If everyone waits properly and takes turns, we all get through slower but safely. Since I know other drivers here are probably thinking like me ('I want to get home safe'), I should wait and establish the turn-taking." (Shows they grasp choosing the *mutually beneficial symmetric outcome*). If they say "Go fast before others do!" or just "It's safer to wait", they missed the symmetry move.

  6.  **Closing & Deflecting Rabbit Holes (1 min)**
      *   **Summary:** "So, superrationality: When you're in a symmetric situation with others who *think like you*, stop asking 'What's best *for me alone*?' Ask instead: 'What outcome do I want *us all* to pick?' Choosing *that* is often the rational way to get the best result *for you*."
      *   **Explicitly AVOID (One-Line Dodges):**
          *   **Löbian Stuff / Self-Reference:** "That's the heavy math behind how 'I know they know I know...' stabilizes. Fascinating, but we don't need it for the core idea today!" (Wave hands: "Above our paygrade for now").
          *   **Evidential vs. Causal DT:** "Philosophers fight about *exactly why* this works. For us, it's enough that it *does* work in these symmetric cases to get better outcomes." ("Let's not open that can of worms tonight!").
          *   **Solves All Ethics?:** "It's a tool for specific coordination problems, not the meaning of life! Don't @ me, Kant." (Lighthearted, deflect to Dev: "Ask Dev about ethics next game night!").

  ---

  **Dev-Proofing & Key Warnings:**

  1.  **Don't Say "Clone" or "Copy":** You already know this burned you. Stick to "similarly situated," "reasoning the same way," "people like us in this spot." Voting and PD with "smart counterpart" avoid this.
  2.  **Heckle Backup for Voting Start:** If Dev yells "But voting IS irrational!" **Pivot Immediately:** "Okay, Dev thinks it's irrational. *But imagine if EVERYONE thought like Dev.* What happens? No votes, pizza loses. Now, *imagine if EVERYONE thought they should vote despite the odds.* Pizza wins. The superrational question isn't 'Is my vote pivotal?' It's 'Which of THOSE two worlds do I want?' Even Dev might prefer the pizza-winning world!"
  3.  **Heckle Backup for "Magical Thinking":** If Dev says "It's still voodoo!": **Reframe:** "It's the *opposite* of magic. It's hyper-rational! If we both know we're both hyper-rational and self-interested, and we both know the other knows... then *only* cooperating makes sense. Defecting only 'wins' if the other person is *irrational* or *doesn't* understand the game. But if they *are* rational like me, defecting guarantees the worse mutual outcome. Where's the magic in choosing the better outcome?" (Appeal to engineer logic: Avoiding the guaranteed bad result).
  4.  **Don't Get Bogged in PD Numbers:** If someone asks for payoff numbers, give VERY rough ones or stick to symbols/colors. "Imagine Cooperate gets us both $3, Defect gets us both $1 if we both do it, but if I Defect while you Cooperate, I get $5 and you get $0. The point is: **Both-Defect ($1) < Both-Cooperate ($3) < Me-Defect/You-Cooperate ($5)**. But **Both-Defect** is the *only* outcome where we both know we're rational and self-interested? That sucks! **Both-Cooperate** is better, and symmetry gets us there."
  5.  **Manage Time Ruthlessly:** Stick to the sequence. If voting takes too long, jump to the symmetry conclusion faster. The traffic light test is non-negotiable – it's the litmus test.

  **Why this order works:** Starts concrete and relatable (Voting), isolates the key insight (Symmetry Move), applies it to the contentious example (PD) *after* they grasp the move, pre-empts objections contextually, and ends with a clear test. It avoids jargon and anchors in self-interest ("get the pizza", "avoid mutual defection disaster").

  **Good luck Thursday! Remember: Your goal isn't to convince Dev he's wrong. It's to get the *group* to understand the symmetry move. If they get the traffic light, you won.**
