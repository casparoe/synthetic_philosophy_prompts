     - Contrast: "DNA as computer code" fails because it only sees DNA as passive data, not as also specifying the processor.
     - *Intercept Misconception 2 (external interpreter)*: Note that the quine requires an interpreter, but in the biological system, the interpreter (machinery) is built by the DNA itself.

