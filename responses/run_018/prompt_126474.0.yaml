     - Describe DNA structure and replication process (unwinding, complementary base pairing).
     - Explain that DNA contains genes for replication machinery (e.g., DNA polymerase).
     - Isomorphism: DNA is both data (template) and instruction set (for building the machinery that copies it).
     - *Bracket Details*: Mention that we are ignoring polymerase fidelity, energy coupling, and compartmentalization because they are not part of the core isomorphism.

  5. **Addressing Misconceptions Explicitly** (7 min)
     - Reiterate that self-reference in biology is constructive (replication) and not paradoxical.
     - Clarify that the replication machinery is part of the self-referential system (encoded by DNA) and not an external interpreter in the same way as a Python interpreter is external to a quine.

  6. **Diagnostic Question and Wrap-up** (5 min)
     - Pose the diagnostic question to test deep understanding.
     - Summarize the isomorphism.

