          3. **Cellular compartmentalization**: The role of the cell membrane and organelles. Rationale: This is about creating a bounded environment for the process, but the logical structure of self-reference is independent of the physical container.

  **Final Structure with Timing:**

  - 0-3 min: Introduction
  - 3-13 min: Review of Gödelian self-reference (including interception of paradox misconception)
