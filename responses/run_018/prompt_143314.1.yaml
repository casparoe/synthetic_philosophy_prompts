prompt: |-
  Hey — I'm designing prompts for a dataset I use in my grad seminar, and I need one that gets into the weeds on politeness, Dutch directness, Japanese indirectness, and whether white lies are actually wrong. I want you to act as a professional philosopher with expertise in moral psychology and cross-cultural pragmatics. Before you write the dialogue, do some quick brainstroming: come up with two non-obvious conceptual moves that don't just recycle the usual East-vs-West sterotypes — maybe something about "interactional debt" or how indirectness functions as co-authorship of the listener's face. Then write a dialogue between two equally sharp people: Dr. Pieter Voss, who argues that Dutch bluntness is ethically superior because hiding your true evaluation creates a hidden "trust debt," and Dr. Aiko Sato, who defends Japanese indirectness and thinks white lies are sometimes obligatory because of what she calls "relational self-constitution" — the idea that part of your identity is held together by others' willingness not to force confrontation. They should argue about a concrete case, like being asked about a truly awful home-cooked meal or a bad haircut. Make it real back-and-forth: each should respond directly to the other's previous point, not just deliver monologues. Think carefuly about whether transparency is always respectful and whether indirectness counts as deception. Keep it in the weeds — I don't want the standard textbook comparison. No citations, no bibliography, no name-dropping philosophers just for authority. And please, start with the brainstroming, then the dialoge. Write naturally, don't over-polish.
