  Considering rejecting (3): If counterfactual stability doesn't imply no causal difference-making, then individuals can still be difference-makers even if redundant. But this might mean giving full credit to multiple people, which could be problematic in priority disputes. The cost is explaining why redundant agents deserve credit, possibly by focusing on actual causation rather than counterfactuals.

