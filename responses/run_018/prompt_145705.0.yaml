answer: |-
  Here's the full specification sheet for a theory of moral agency that takes integrity seriously, structured around your cases and distinctions. I'll flag non-negotiables (NN), camp-specific features (CS), and potential conflicts.

  ---

  ### **Core Non-Negotiable Desiderata (NN)**
  1.  **Accommodate Agent-Relative Permissions Without Subjectivism:** Must allow agents to permissibly give *non-instrumental* priority to their own projects/relationships *because they are theirs*, while preventing this from collapsing into "whatever feels right." *(Motivation: Spouse/Stranger drowning case - saving your spouse shouldn't require calculating overall utility first; it should be directly permissible because it's YOUR spouse.)*
  2.  **Distinguish Integrity from Preference:** Must provide criteria to differentiate commitments constitutive of the agent's identity ("ground projects") from mere strong desires or tastes. *(Motivation: All cases - preventing "authenticity" from becoming license for selfishness or whim.)*
  3.  **Preserve the Possibility of Genuine Sacrifice:** Must explain why actions required by integrity *feel* deeply costly/demanding and aren't merely optimal preference satisfaction, even when morally required. *(Motivation: Whistleblower & AI Researcher cases - sacrificing career/financial gain for principle feels like a real loss, not just trading preferences.)*
  4.  **Handle Conflicts Between Integrity and Impartial Morality:** Must provide a framework for adjudicating when integrity-based partiality/permissions are justified vs. when impartial demands override them. *(Motivation: All cases - When *must* the longtermist give more? When *must* the spouse consider the stranger?)*
  5.  **Explain the "One Thought Too Many":** Must justify why, in certain intimate/identity-constitutive contexts, explicit appeal to impartial moral reasoning (like utility calculation) is inappropriate or alienating, *without* rendering those contexts morally opaque. *(Motivation: Spouse case - The spouse saving you shouldn't primarily justify it by maximizing global utility; it should flow directly from the relationship.)*

  ### **Case-Specific Requirements**
  *   **1. The Drowning Choice (Spouse vs. Stranger):**
      *   **Deliver:** Permission to save spouse *without* requiring impartial justification as the primary motive/reason. A *pro tanto* agent-relative reason strong enough to override a weaker agent-neutral reason (saving one stranger). *(NN 1, 5)*
  *   **2. The Whistleblower:**
      *   **Deliver:** An account where sacrificing career/security for the public good *can* be an expression of integrity (driven by constitutive commitments to truth/justice), not just impartial duty. Must distinguish this from impulsive rebellion or self-destruction. *(NN 2, 3 - Integrity vs. Preference; Sacrifice)*
      *   **Integrity Budget?:** Must address whether such a massive sacrifice depletes the agent's capacity for future integrity-driven actions or *reinforces* the core commitment. *(See "Integrity Budget" below)*
  *   **3. The Longtermist Donor (90%):**
      *   **Deliver:** Justification for retaining 10% for personal projects *as compatible with deep moral commitment*, not as mere selfishness. Recognition that some personal projects are essential for agency/meaning, even amidst significant impartial demands. *(NN 1, 2 - Agent-Relativity, Ground Projects vs. Selfishness)*
  *   **4. The AI Alignment Researcher (Refusing Capabilities Job):**
      *   **Deliver:** Explanation of how refusing significant personal gain can be *morally required by integrity itself* (not just supererogatory), due to the violation of constitutive commitments defining their work/identity. Must distinguish this from stubbornness or irrational aversion. *(NN 2, 3, 4 - Integrity vs. Preference, Sacrifice, Conflict)*
      *   **Integrity Budget?:** Must address if refusing *this* opportunity creates a stronger claim to maintain other elements of their "ground project" later, or if integrity demands consistency even at higher costs. *(See "Integrity Budget" below)*

  ### **Key Distinctions the Theory Must Sustain**
  *   **Integrity (Constitutive Commitments) vs. Mere Preference (NN):** Requires objective (or intersubjectively stable) criteria - e.g., connection to identity, deep valuation, stability over time, role in narrating a life - not just intensity of desire.
  *   **Agent-Relative Permissions vs. Rationalization (NN):** Requires a normative standard beyond the agent's own say-so. Permissions must be *justifiable to others* (even if the justification is agent-relative), preventing mere excuses for selfishness. *(Links to Contractualism/Virtue)*
  *   **Preserving Ground Projects vs. Selfishness (NN):** Must define a threshold where projects become narcissistic or socially destructive, losing their status as legitimate sources of agent-relative permissions. *(Links to Conflict handling - NN4)*
  *   **"Integrity Budget" (CS):**
      *   *Requirement:* Explain the phenomenology of moral exhaustion/resolve. Does a massive sacrifice (Whistleblower) deplete an agent's "moral capital," justifying less demanding actions later? Or does fulfilling a core commitment *strengthen* integrity, demanding *more* consistency? Must avoid mechanistic "spending" metaphors.
      *   *Potential:* Most plausible as a psychological feature theories might *describe* (e.g., Virtue Ethics on character stamina) rather than a fundamental normative element. Theories needn't prescribe a specific "budget" model but must explain the *experience* of depletion/renewal.

  ### **Potentially Conflicting Desiderata (Flagged Pairs)**
  1.  **Deep Agent-Relativity (NN1) vs. Global Optimizability (CS - Utilitarian):** Fundamentally incompatible. Deep agent-relativity grants permissions/responsibilities that *cannot* be overridden by marginal global gains. Global optimizers must ultimately subordinate the agent-relative to the agent-neutral.
  2.  **Robust Ground Projects (NN2, NN3) vs. Strong Impartial Override (NN4):** Significant tension. Grounding strong agent-relative permissions makes it harder for impartial demands to override them without threatening the core of integrity itself. The threshold for override is a major fault line between theories.
  3.  **"One Thought Too Many" (NN5) vs. Universal Justifiability (CS - Contractualism):** Tension. NN5 suggests some reasons/motives are contextually inappropriate to voice/impose. Universal justifiability demands reasons acceptable to all, potentially forcing articulation of "the thought" even when contextually alienating.

  ---

  ### **Brief Scoring Against Criteria (Focus: How do core features map to the desiderata?)**

  1.  **Utilitarianism (Act):**
      *   **Fails:** NN1 (No genuine agent-relativity), NN5 (Requires "the thought"), Struggles with NN2 (Projects reduced to preferences), NN3 (Sacrifice reduced to preference trade-off).
      *   **Meets:** NN4 (Clear override rule: maximize utility), Global Optimizability (CS).
      *   **"Integrity Budget":** Nonsensical; only utility counts.
      *   **Conflict Handling:** Crude override (utility wins).

  2.  **Virtue Ethics (Aristotelian/Neo-Aristotelian Focus):**
      *   **Meets:** NN1 (Roles/relationships define context-relative duties), NN2 (Virtues define character-constitutive commitments), NN3 (Virtuous action can be costly/sacrificial), NN5 (Phronesis acts directly from character, not calculation).
      *   **Struggles With:** NN4 (Articulating clear override principles - relies heavily on phronesis/judgment), Global Optimizability (CS - Not the focus).
      *   **"Integrity Budget":** Can describe character resilience/exhaustion (eudaimonia impact).
      *   **Distinctions:** Strong on Integrity vs. Preference (virtues vs. appetites), Projects vs. Selfishness (virtue vs. vice). Weaker on universal justifiability (CS).

  3.  **Scanlon-Style Contractualism:**
      *   **Meets:** NN2 (Principles must be justifiable - filters arbitrary preferences), NN4 (Clear adjudication: unrejectable principles override), NN1 *Partially* (Agent-relative permissions possible *if* justifiable within principles, e.g., special responsibilities), Universal Justifiability (CS).
      *   **Struggles With:** NN1 *Depth* (Agent-relativity contingent on justification, not inherent), NN5 (Justification requirement might force "the thought"), NN3 (Sacrifice may feel like fulfilling a contract rather than core identity).
      *   **"Integrity Budget":** Less focus on internal state, more on ongoing justifiability.
      *   **Distinctions:** Strong on Permissions vs. Rationalization (justifiability filter). Can handle Projects vs. Selfishness via justifiability.

  ---

  **Summary:** A viable integrity-respecting theory **must** (NN) accommodate non-subjective agent-relativity, distinguish deep commitments from preferences, explain sacrifice, handle conflicts with impartiality, and respect the "one thought too many." The core tension lies between robust agent-relativity/ground projects and strong impartial overrides. Utilitarianism fails most NN criteria. Virtue Ethics excels at NN1-3,5 but struggles with NN4 clarity. Contractualism excels at NN2,4 and justifiability but risks diluting NN1/NN5. The "integrity budget" is a descriptive challenge rather than a core normative requirement.
