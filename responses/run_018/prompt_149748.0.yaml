  Hmm, the user presents a fascinating case study about the Borges archive's dual approach to manuscript preservation and exhibition. They're clearly interested in the philosophical underpinnings of institutional practices, specifically regarding time and ontology. This seems like a scholar or advanced student in philosophy or archival studies probing the coherence of cultural preservation frameworks.

  The core tension lies between the archive's linear preservation protocol (treating each manuscript mark as a unique historical event) and its thematic exhibition (presenting drafts from different eras as coexisting variations). I need to reconstruct the implicit theory behind this duality. 

  First, preservation operates on strict linear time principles: chronological ordering, rejection of digital reproduction (to protect temporal singularity), and restricted access. This aligns closely with the growing-block theory of time - where the past is fixed and real, while the future is open. Each manuscript edit is an irreversible brick in the growing historical edifice.

  Meanwhile, exhibition embraces eternalism: thematic groupings like "The Labyrinth" treat 1941 and 1960 drafts as equally present manifestations of timeless ideas. Digital reproduction here isn't problematic because the content transcends its material instantiation. This mirrors Borges' own fictional explorations of nonlinear time.

  The institution isn't strictly committed to either view - preservation accommodates linearity while exhibition accommodates nonlinearity. But the legal deed's insistence on linear history makes preservation's commitments stronger. This creates an operational incoherence: they simultaneously treat manuscripts as both historically unique and thematically interchangeable.

  If adopting Borges' view (time as fiction), the archive would need radical changes: abolish chronological restrictions, allow scanning of "late" revisions, reorganize finding aids thematically, and display edits as coexisting variations. Conversely, strict linear physicalism would require dismantling thematic exhibitions, prohibiting anachronistic displays, and restricting reproductions that decontextualize temporal sequence.

  The most defensible reconstruction is that preservation assumes growing-block temporality while exhibition practices eternalism, creating an incoherent hybrid. The deed of gift anchors the institution to linear time, making exhibition practices philosophically contradictory despite their practical utility.
answer: |-
  The archive's dual practice reveals an **incoherent hybrid ontology** that instrumentally accommodates both linear historicism and eternalist simultaneity, while strictly presupposing a linear temporal order through its foundational legal and preservation protocols. This reconstruction is defensible because the preservation arm's rules (irreversible sequence, anti-reproduction stance, chronological access restrictions) actively enforce a metaphysical commitment absent in the exhibition's thematics, which merely *leverages* timelessness for pedagogical accessibility.

  ### Philosophical Commitments & Incoherence
  1. **Strict Presupposition (Preservation/Legal)**:  
     The rejection of digital reproduction (due to "destroying the singular temporal moment") and chronological arrangement presuppose **linear, irreversible time** where events are unique, unrepeatable points. This aligns with the **growing-block theory**: the past is fixed and real (each draft/page is an "unrecoverable point"), the present is the growing edge of reality (ongoing curatorial additions), and the future is open. The deed of gift’s language anchors this as non-negotiable.

  2. **Accommodation (Exhibition)**:  
     Thematic grouping ("drafts from 1941 and 1960 as coexisting variations") leverages **eternalism**—where all moments exist equally in a four-dimensional block—but does not *require* it. Exhibits could be seen as heuristic models of abstract ideas, not ontological claims. Reproduction in print editions is permitted because the exhibition treats manuscripts as *signifiers* of timeless themes, not irreplaceable temporal events.

  3. **Inconsistency**:  
     Preservation’s rules *exclude* presentism (which denies past/future existence) by affirming the past’s concrete reality, and *exclude* eternalism by forbidding actions (like copying late revisions) that would imply temporal equivalence. Yet exhibition practices *rely* on eternalism’s simultaneity for their coherence. The archive simultaneously asserts that:  
     - A 1960 correction *cannot* be reproduced without ontological harm (preservation),  
     - But *can* be reprinted thematically alongside 1941 text (exhibition),  
     violating the linearity its deed enshrines.

  ### Required Changes Under Rival Ontologies
  | **Scenario** | **Institutional Changes** |
  |--------------|---------------------------|
  | **Borges’ View**<br>(Time as fiction; eternal forms) | • **Abolish chronological restrictions** in finding aids<br>• **Permit scanning** of "late revisions" as copies capture eternal form<br>• **Reorganize all materials thematically** (e.g., "Forked Paths" folders spanning decades)<br>• **Display edits as variations** without temporal labels<br>• **Void deed clause** on linear history |
  | **Strict Linear Physicalism**<br>(Manuscripts = dated matter) | • **Ban thematic exhibitions** that de-temporalize drafts<br>• **Prohibit reproductions** detaching text from material history<br>• **Enforce chronological displays** only (1941 draft ≠ 1960 draft)<br>• **Restrict catalog access** to prevent atemporal interpretations<br>• **Emphasize material decay** in exhibits, not "timeless" themes |

  ### Defense of Reconstruction
  The archive’s practice is incoherent because **preservation’s rules logically negate exhibition’s premise**. If a manuscript’s temporal singularity is so ontologically weighty that copying "destroys" it (per preservation), exhibiting it as a "simultaneous variation" undermines that very singularity. The deed of gift—binding both departments—codifies linear history, making exhibition’s eternalism a pragmatic inconsistency. While eternalism *accommodates* thematic display, only linear time (specifically growing-block) is *required* to justify preservation’s anti-reproduction stance and chronological ordering. The institution thus operates with a **schizophrenic ontology**: legally/preservationally committed to linear time, but promotionally indulging timelessness—a conflict Borges would relish.

