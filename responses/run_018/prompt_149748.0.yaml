prompt: |-
  Consider the manuscript-preservation and exhibition policy of the university archive that holds Jorge Luis Borges's papers. The preservation protocol treats every draft, marginal correction, and dated page as an event in an irreversible chronological sequence: curators arrange folders by year and month, reject digital reproduction of late revisions on the ground that copying destroys the singular temporal moment of the original inscription, and restrict access to the chronological finding aid to credentialed researchers. Meanwhile, the public gallery and catalog organize the identical materials thematically—under headings such as The Labyrinth, The Mirror, Eternal Recurrence, and Forked Paths—and freely reproduce those same singular late revisions in print editions arranged thematically rather than chronologically. Visitors are guided through displays that present drafts from 1941 and 1960 as coexisting variations on a timeless structure, yet the institution's legal deed of gift insists that each physical page is an unrecoverable point in linear history.

  What philosophical commitments about time, textual identity, and ontology does this practice presuppose? Reconstruct the implicit theory: does it require a linear, irreversible temporal order, a cyclical or eternalist ontology in which all moments are simultaneously present, or an unstable hybrid? Distinguish what the practice strictly presupposes from what merely accommodates it, identify whether the preservation arm and the exhibition arm commit to consistent views, and specify which rival theories of temporal ontology—such as presentism, the growing-block view, or four-dimensional eternalism—the practice quietly excludes. Assess whether the policy is philosophically coherent, and describe precisely what institutional rules—regarding scanning, access, reproduction rights, and curatorial display—would have to change if the archive adopted Borges's own position that linear time is a fiction and that every moment is a simultaneous variation of an eternal form, versus if it adopted a rigorous physicalist view that grants manuscripts no special ontological status beyond their material date.

  Take a definite position on the best reconstruction of the archive's implicit theory, defend it with reasons, and do not merely list options. After your analysis, provide a brief structured summary in JSON format with exactly these fields: "presupposed_temporal_ontology" (a short label), "preservation_arm_commitment" (what preservation assumes), "exhibition_arm_commitment" (what display assumes), "coherence_assessment" ("coherent", "incoherent", or "underdetermined"), "changes_under_borges_illusion_view" (brief bullet-style description within the string), and "changes_under_strict_linear_view" (brief bullet-style description within the string).
