  I'm giving the opening remarks at our town's new archive center next saturday — it's just old meeting minutes and newspaper clippings, nothing fancy. The mayor asked me to talk about why keeping these papers matters, and I want to use something I read about Hannah Arendt: she thought lying in politics isn't just bad morals, it actually breaks the shared world people need to act together. I want to say these records are like the floor under that world, especially in a small town where the dangerous lies aren't big propaganda but leaving out the angry parts of meetings. Half the room are local historians who know Arendt's work, the other half are neighbors who came for coffee. Can you write me about three minutes? Don't make me sound like I'm giving a lecture, and please don't say anything that would sound false to someone who actually lives here. I definately want that small-town omission idea in there.
