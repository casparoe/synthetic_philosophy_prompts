  The literary analogy does important philosophical work here. It provides a concrete example where functional normativity clearly operates without ownership. This directly counters the "category mistake" objection in point 4. Chekhov's gun isn't just a metaphor; it demonstrates how expectations can be structurally embedded.

  For the structural/normative question: narrative structures do create "shoulds" (the gun should fire) that feel genuinely normative to readers. This shows structural positions can generate normativity without needing a lawgiver. 

  The user's writing-group context explains why they're using fiction as the backbone. I should affirm this approach since it makes abstract philosophy accessible. Their "mush brain" disclaimer suggests they need clear, concise feedback - hence the numbered format request.

  Their deeper concern seems to be about defending moral realism against subjectivism. The notes already hint at this in point 5, but I'll reinforce that their analogy successfully blurs the line between descriptive and normative.

