answer: |-
  Here is your numbered feedback:

  1.  The narrative analogy does substantial philosophical work by providing a clear, non-mysterious example where normative expectations ("oughts") arise solely from structural relationships (plot, setup/payoff), demonstrating that functional normativity *can* exist without a conscious holder.
  2.  The analogy directly counters the "category mistake" objection (point 4) by showing that "reasons-for" are not exclusively tethered to *agents* but can be inherent to *systems* (like a narrative or natural selection) and their functional logic.
  3.  There is no inherent contradiction in "structural rationales having normative force"; narrative structures *do* create genuine "shoulds" (e.g., the gun *should* fire, a character flaw *should* cause downfall), proving structure itself *can* generate normativity binding on interpretation or function.
  4.  The analogy is strongest for evolutionary "reasons" (point 2), as both involve functional design/expectation without a designer; extending it to moral reasons (point 3) requires further argument that sentient experience has a *structural logic* akin to plot generating inherent "shoulds".
  5.  Your core move – using narrative structure to show that rejecting *all* free-floating normativity as spooky is premature – is valid and useful; it forces the objector to explain why narrative normativity *isn't* spooky, yet other structural normativity *is*.
