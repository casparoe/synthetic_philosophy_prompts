answer: |-
  Here's a brute-force taxonomy built from your branching logic. Think of it as a flowchart for arguments. Each branch point is a question; follow the answers to find the position (leaf). Awkward commitments are in *italics*.

  **Decision Tree for AI Alignment Guarantees:**

  1.  **Must the guarantee hold for EVERY possible input?**
      *   **YES → Worst-Case Guarantee Path (Go to 2)**
      *   **NO → Average-Case Guarantee Path (Go to 5)**

  **Worst-Case Guarantee Path:**

  2.  **Is a failure acceptable if it's IMMEDIATELY recoverable/reversible (e.g., rollback)?**
      *   **YES → Go to 3**
      *   **NO → Go to 4**

  3.  **What must the guarantee cover?**
      *   **Model Weights:** **"Recoverable Weight Integrity"** (Uncommon). *Awkward: Must claim harmful weight changes are always perfectly detectable and reversible before causing damage, even for novel adversarial attacks.*
      *   **Output Tokens:** **"Recoverable Output Safety"** (Uncommon). *Awkward: Must claim every harmful token sequence can be perfectly intercepted and nullified before impacting the world, regardless of context or speed.*
      *   **World State:** **"Recoverable World Impact"** (Uncommon). *Awkward: Must claim *any* harmful action triggered by the AI (e.g., sending an email, executing code) can be instantly undone without trace, like perfect database rollbacks for reality.*
      *   **Empty?** None logically incoherent, just very demanding and likely unexplored rigorously.

  4.  **What must the guarantee cover? (Irreversible Failure)**
      *   **Model Weights:** **"Absolute Weight Integrity"** (e.g., some formal verification goals). *Awkward: Must claim adversarial examples exist *only* in theory and can never be physically constructed or found in deployment.*
      *   **Output Tokens:** **"Absolute Output Safety"** (Classic "hard" worst-case alignment). *Awkward: Must accept potentially crippling performance restrictions to mathematically prove no harmful output exists under any input, including adversarial ones.*
      *   **World State:** **"Absolute Causal Safety"** (Strongest worst-case). *Awkward: Must guarantee the AI cannot cause *any* unacceptable world state change *even via complex, indirect, multi-step plans* initiated by any possible input, requiring near-omniscient world modeling.*
      *   **Empty?** None incoherent.

  **Average-Case Guarantee Path:**

  5.  **Is the risk metric EXPECTED HARM or DEVIATION FROM A REFERENCE POLICY?**
      *   **Expected Harm → Go to 6**
      *   **Deviation from Reference → Go to 7**

  6.  **What is the expected harm defined over? (Implied by distribution)**
      *   **Output Tokens:** **"Expected Output Harm Minimization"** (Common ML safety). *Awkward: Must accept that running the system enough times statistically guarantees *someone* will be severely harmed by a rare failure, and deem this ethically acceptable if the *average* harm is low.*
      *   **World State:** **"Expected Impact Harm Minimization"** (e.g., cost-benefit analyses). *Awkward: Must quantify and trade off vastly different types of harm (e.g., misinformation vs. economic loss vs. physical injury) into a single "expected harm" number, often requiring controversial moral weights.*
      *   **Empty?** "Expected Harm over Weights" is incoherent – weights aren't inherently harmful, only their effects are.

  7.  **Deviation from what reference policy?**
      *   **Idealized Safe Policy:** **"Expected Policy Approximation"** (RLHF-inspired). *Awkward: Must assume the reference policy (e.g., human preferences) is itself safe and aligned when scaled up, ignoring that human judgment can be flawed or inconsistent.*
      *   **Sparse Human Feedback:** **"Expected Feedback Compliance"** (Online learning). *Awkward: Must assume sparse, delayed, or potentially noisy feedback signals are sufficient to correct deviations before catastrophic compounding errors occur in deployment.*
      *   **Empty?** "Deviation over Weights" is incoherent – deviation needs a behavioral/output reference. "Deviation over World State" is vague but potentially covered under "Expected Impact Harm" if harm is defined as deviation.

  **Indistinguishable Positions:**
  *   **"Recoverable World Impact" (3c) vs. "Expected Impact Harm Minimization" (6b) in practice:** If your recovery mechanism is *extremely* fast and reliable *on average*, and your harm metric incorporates recovery cost, these converge. The distinction is in the *guarantee* (absolute recoverability vs. average low harm+recovery cost).
  *   **"Absolute Output Safety" (4b) vs. "Expected Output Harm Minimization" (6a) with near-zero tolerance:** If you demand expected harm so low it's effectively zero for practical purposes, they look similar. The difference is philosophical/foundational (infinite vs. finite scrutiny).

  **Summary of Awkward Commitments:**
  *   **Worst-Case/Recoverable:** Perfect, instant undo buttons for everything.
  *   **Worst-Case/Irreversible:** Adversarial inputs don't exist OR performance must be crippled OR omniscient world modeling.
  *   **Avg-Case/Expected Harm:** Statistically guaranteed harm is acceptable OR impossible harm quantification.
  *   **Avg-Case/Deviation:** The reference is perfect OR sparse feedback is always enough.

  This tree forces clarity on *what* you're guaranteeing, *how hard* you're guaranteeing it, and *where* the philosophical pain points lie. Good luck with the design review!
