  Okay, the user wants me to write a sestina about cyclical versus linear views of history. They've provided specific requirements: using the end-words "spring," "decline," "line," "return," "empire," and "ruin." The form itself should represent the cyclical view through its rotating pattern, while the progression through stanzas to the envoi symbolizes linear progress. The envoi should suggest a spiral pattern combining both views.

  I need to understand what a sestina is - it's a complex poetic form with six stanzas of six lines each, plus a three-line envoi. The end-words rotate in a specific pattern: the last word of each line becomes the first end-word of the next stanza, following a mathematical rotation sequence. This formal structure perfectly embodies the cyclical view of history.

  The content needs to incorporate historical theories without explicitly naming the thinkers. For cyclical views, I can include Polybius's constitutional rotation (regimes changing forms), Ibn Khaldun's asabiyyah (group solidarity decaying and renewing), and Spengler/Toynbee's life cycles of civilizations. For linear views, I should imply progress toward an end goal through the poem's forward movement.

  The envoi is crucial - it needs to bring all six words together to suggest a spiral that claims to be returning. This captures the tension between repetition and progression. I'll need to weave imagery that shows civilizations rising ("spring"), peaking ("empire"), decaying ("decline"), and falling ("ruin"), while implying both recurrence and novelty.

  I'll structure it with each stanza focusing on different aspects: first on origins and growth, second on hardening structures, third on peak and decay, fourth on collapse, fifth on aftermath, and sixth on renewal. The envoi will synthesize these into the spiral concept. The imagery should be concrete - seasons, architecture fraying, ruins being rebuilt - to embody the theories visually.

  The challenge is balancing poetic quality with conceptual precision. Each end-word must be placed naturally while advancing the argument. For "spring," I can use seasonal rebirth and political origins; "decline" shows moral and structural decay; "line" represents both linear progress and boundaries; "return" suggests both recurrence and false novelty; "empire" embodies both achievement and hubris; "ruin" shows collapse and material for rebuilding.

  I'll make sure the language remains poetic rather than academic, using vivid images to convey the theories. The rotating words will demonstrate cyclical patterns, while the forward motion of the stanzas enacts linear progression. The envoi's spiral image will resolve this tension by showing how each "return" claims novelty while rebuilding from "ruin."
answer: |-
  ## The Wheels of What Was

  They say new nations rise in verdant **spring**,
  Each founding oath a bulwark against **decline**.
  The hopeful chart their course in one straight **line**,
  Denying seasons force a grim **return**,
  Proclaiming *this* time builds eternal **empire**,
  Unmarked by predecessors' dust and **ruin**.

  Yet watch the mortar subtly crack to **ruin**,
  While seeds of change stir deep beneath the **spring**.
  The bonds that forged the conquering **empire**,
  The common cause, now fray toward **decline**.
  (What monarch fears the people's swift **return**
  To power? Thus the circle draws its **line**.)

  The structure hardens, locks within its **line**,
  Each rule demanding tribute, feeding **ruin**.
  Old freedoms plead but find no path **return**;
  The tyrant sprouts where stood the green-tipped **spring**.
  The scribe observes the steepening **decline**:
  The senate's shout becomes the lone **empire**.

  No chart foretold the zenith of this **empire**,
  Its glory seemed to bend the fated **line**.
  They feast while cracks spread through the base of **decline**,
  Ignoring echoes from the older **ruin**.
  The markets buzz, a false and fevered **spring**,
  Before the lenders scream for gold's **return**.

  The banners fall. Is this a true **return**
  To chaos, birth-pangs for the next **empire**?
  Or just the frost that kills a spent **spring**?
  Barbarians trace the old defensive **line**,
  Now breached, to strip the fading city's **ruin**
  For stones to build upon the swift **decline**.

  Is history just this inevitable **decline**?
  A wheel that grinds, promising no **return**
  To innocence? Each heap of mossy **ruin**
  Proclaims the hubris of the buried **empire**.
  The ploughman cuts another furrow's **line**
  Through soil enriched by seasons past, new **spring**.

  Look! See the spiral? From this fertile **ruin**,
  Where **decline** feeds the next ambitious **spring**,
  A **return** claims the old, a fresh **empire** draws its **line**.

  ---

  **Annotations (For Clarity):**

  1.  **Form as Argument:** The sestina's fixed rotation of end-words embodies cyclical theories. The irreversible progression through stanzas 1-6 enacts linear time. The envoi compresses all words, forcing their interaction, mimicking the spiral.
  2.  **Embedded Theories:**
      *   **Stanza 1:** Founding optimism & denial of decline (Linear denial of Cyclical).
      *   **Stanza 2:** Ibn Khaldun's *asabiyyah* (solidarity) fraying ("bonds...fray toward decline"), Polybius's constitutional shift from people to monarch ("What monarch fears the people's swift return / To power?").
      *   **Stanza 3:** Hardening into tyranny (Polybian degeneration), the illusion of novelty ("No chart foretold... seemed to bend the fated line" - Spengler/Toynbee).
      *   **Stanza 4:** Hubris and collapse (Common to Spengler, Toynbee, Khaldun - "feast while cracks spread," "echoes from the older ruin").
      *   **Stanza 5:** Barbarians at the gate (Toynbee/Spengler/Khaldun), using ruins for new foundation (Cyclical renewal).
      *   **Stanza 6:** Questioning pure cycles vs. pure lines, the fertile decay ("soil enriched by seasons past" - Khaldun's material basis for renewal).
      *   **Envoi:** The "spiral" synthesis: "return" uses "ruin," the "new empire" draws its "line" (suggesting both boundary and linear claim), "decline feeds the... spring."
  3.  **Key Imagery:** Seeds/seasons (cyclical change), mortar/cracks/structures (decay of institutions), feasting/borrowing (economic hubris), barbarians/ploughman (agents of destruction/renewal), spiral/furrow (form of history).
