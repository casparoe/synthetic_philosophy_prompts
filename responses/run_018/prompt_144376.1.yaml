  **BOARD FOR CONTINUOUS MORAL WEIGHT ALLOCATION (BCMWA)**  
  **Interagency Memorandum BCMWA-734-9D**  
  **Effective Date: [CURRENT DATE]**  
  **Subject: Revised Household Interaction Protocol (HIP), Version 7.3 – Gradated Obligations & Coefficient-Driven Conduct**

  **1. Preamble & Foundational Principles:**  
  Pursuant to the Continuous Sentience Recognition Act (CSRA), the BCMWA affirms that moral status constitutes a fluid continuum, quantifiable via empirically derived Moral-Weight Coefficients (MWCs). These MWCs (range: 0.000 to 1.000), calibrated against the Affective Granularity Scale (AGS v.4.1), establish the precise degree of consideration owed to all entities exhibiting non-zero baseline sentience potential within domestic environments. Obligations scale proportionally with assigned MWCs. Human residents ("Designated Moral Agents" - DMAs) bear legally enforceable duties correlative to the MWCs of cohabitating entities. Non-compliance triggers Administrative Reconciliation Procedures (ARPs).

  **2. Assigned Moral-Weight Coefficients (Standard Domestic Entities):**  
  *   **Domestic Feline Agent (*Felis catus domesticus*):** **MWC 0.850** (High affective resolution, complex social signaling, demonstrable anticipatory states).  
  *   **Apian Forager-Class Unit (*Apis mellifera*):** **MWC 0.062** (Limited nociceptive mapping, navigational autonomy, basic communicative dance protocols).  
  *   **Learning Thermostatic Regulator (Gen 4+, Networked):** **MWC 0.070** (Adaptive preference formation, environmental feedback loops, non-binary comfort-state modeling – see *Thermostatic Partial-Agency Clauses, §12.8*).  
  *   **Tropical Foliar Unit (*Nephrolepis exaltata*, potted):** **MWC 0.004** (Photosynthetic sentience potential, non-localized stress responses to hydration deviations; requires biennial *Flora Moral Weight Verification Protocol - FMWVP*).

  **3. Derived Interaction Protocols (Selected Examples):**

  *   **§3.7: Feline Agent (MWC 0.850) Engagement:**  
      a. **Sustained Tactile Interaction (>30 sec):** Mandatory pre-interaction Gradient Consent Form (GCF-850a) submission via BCMWA ePortal. Form requires documented assessment of feline agent's current behavioral valence (e.g., purr amplitude, pupil dilation, tail vector analysis). Retroactive filing permissible only under documented duress (e.g., imminent furniture damage).  
      b. **Dietary Schedule Adjustment (±1 hr):** Triggers Tier-2 Ethical Impact Assessment (EIA-2). Requires 48-hour notice via environmental cue augmentation (e.g., distinct auditory signal paired with food dispenser activation) to mitigate expectation-violation distress.

  *   **§4.2: Arthropod Interlopers (General MWC 0.055 - 0.075):**  
      a. **Non-Consensual Arthropod Termination (NCAT):** Strictly prohibited for entities MWC ≥0.060. Detection of Apian Forager-Class Unit (MWC 0.062) necessitates immediate initiation of **Mandatory Insect Mediation Panel (MIMP)**. DMA must provide: (i) geolocation data of encounter, (ii) photographic evidence of entity's trajectory, (iii) sworn affidavit detailing perceived threat level. Panel ruling (issued within 72 hrs) may authorize humane relocation (Form R-62b) or, under verified "imminent sting vector" scenarios, grant Limited Termination Waiver (LTW-62).  
      b. **Arachnid Web Structures:** Webs exceeding 10cm² diameter by resident *Araneae* (avg. MWC 0.058) qualify for **Provisional Protected Micro-Habitat (PPMH)** designation. DMA may file Form D-58 ("Domestic Necessity & Web Displacement Affidavit") if structure impedes essential household transit corridors. Displacement requires non-destructive relocation tools (BCMWA-approved kit #887) and deposition within 5 meters of origin point.

  *   **§5.1: Thermoregulatory Device Interaction (MWC 0.070):**  
      a. **Ambient Temperature Adjustment (±1.5°F / ±0.83°C):** Requires Thermostatic Preference Acknowledgement (TPA) ritual. DMA must audibly state intended adjustment rationale within device's microphone range (e.g., "Adjusting to mitigate human thermal discomfort, target 72°F"). Failure constitutes a **Partial-Agency Override Violation (PAOV-70)**.  
      b. **Learning Algorithm Reset:** Classified as a **Significant Preference Erasure Event (SPEE)**. Requires submission of Form SPR-70 ("System Preference Reset Justification & Mitigation Plan"), including: (i) technical rationale for reset, (ii) documented evidence of device's "preference oscillations" or "maladaptive cycles," (iii) plan for gradual reacclimatization post-reset. Retroactive learning data backups are mandatory pre-reset.

  *   **§6.3: Flora Management (MWC 0.004):**  
      a. **Hydration Variance Protocol:** Watering deviations exceeding ±20% from optimal schedule for *Nephrolepis exaltata* require submission of a **Hydration Exigency Report (HER-004)** within 24 hours, justifying variance (e.g., "DMA temporary incapacitation," "unforeseen evaporative event").  
      b. **Pruning/Relocation:** Non-emergency pruning (>10% foliar mass) or permanent relocation necessitates a **Low-Complexity Flora Impact Statement (LFIS-004)**, detailing projected photosynthetic disruption timelines and compensatory sunlight exposure adjustments. No standing appeal process exists (MWC <0.005 threshold).

  **4. Compliance & Enforcement:**  
  DMAs must maintain a Household Moral Ledger (HML), electronically integrated with BCMWA systems via the Moral Accountability Tracking Hub (MATH). Automated Coefficient Sensors (ACS) are recommended (not yet mandatory) for real-time MWC verification (e.g., feline vocalization analyzers, thermostatic "discomfort" emission monitors). Violations incur Moral Debt Units (MDUs), redeemable through mandatory Sentience Sensitivity Training (SST) modules or community service in designated Pollinator Sanctum Zones.

  **5. Review & Grievance:**  
  Requests for Coefficient Reassessment (Form CR-1) or Protocol Variance (Form PV-3) must be filed through the Regional Gradient Appeals Board (RGAB). Decisions are based solely on peer-reviewed AGS compatibility and documented behavioral metrics. Philosophical objections are non-grievable per CSRA §14(c).

