  On the neuroscience front, I recall they mentioned prefrontal development - important to stress that brain maturity explains the adult/child distinction without reducing responsibility to mere biology. The manipulation argument needs a sharp example too, maybe a brainwashed assassin versus ordinary criminal. 

  Ah, and that three-way tension between proportionality, determinism, and moral luck... tricky. I'll need to flag how retributivism demands "paying" for deeds, while determinism and luck-denial undermine the "you could've done otherwise" premise. User's right - they pull apart. 

  For scoring Dennett: his "elbow room" handles pragmatics well but stumbles on manipulation feeling different from upbringing. Caruso avoids all problems by rejecting desert outright... which feels unsatisfying for our moral intuitions. Must note where each satisfies or fails the desiderata. 

