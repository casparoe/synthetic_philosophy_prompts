answer: |-
  ### Exam Question
  **Material Constitution and Functional Kinds**  
  *(Time allowed: 75 minutes. Total marks: 20)*  

  Critically evaluate the proposal that the statue/clay puzzle dissolves if ‘statue’ is treated not as a material object but as a *functional kind* defined by its conservation history (e.g., an artefact preserved through restoration). First, explain how this approach redefines statue identity. Next, analyse whether this view successfully avoids problems concerning the persistence of statues when parts are replaced (e.g., during restoration). Finally, assess if objections appealing to the *significance of structural continuity* undermine the functional-kind solution.  

  ---

  ### Model Answer  
  *(Approx. 500 words; British English conventions)*  

  **Functional-Kind Proposal:**  
  Treating ‘statue’ as a functional kind defines it by its role (e.g., ‘artefact conserved for aesthetic engagement’) rather than its matter. Identity depends on conservation history: a statue persists if its function is maintained through intentional preservation, even if original material is replaced. For example, a bronze statue restored with new alloy remains the same statue if conservators uphold its artistic function. This avoids the coincidence puzzle by denying statues and their matter are distinct material objects occupying the same space; the clay is mere matter, while the statue is an entity constituted by *use* and *preservation*.  

  **Temporary-Parts Problem & Functional Response:**  
  However, this view faces challenges when parts are replaced. Suppose a statue loses 40% of its original material during restoration and gains new parts. If ‘statue’ is functional, it persists if conservation sustains its role. Yet critics argue this implies statues are arbitrary sequences of stages: today’s statue could be yesterday’s statue plus new parts, but why is it not a new entity? The functionalist might reply that *preservation continuity*—the unbroken chain of conservation activity—unifies stages. Unlike a ship of Theseus, where parts decay unmonitored, conservation *intentionally* sustains identity through change.  

  **Dominant-Part Objection & Its Limits:**  
  A stronger objection targets structural continuity. Suppose over centuries, only 10% of the original statue remains (e.g., a core fragment), embedded in new material. The functionalist claims persistence, but opponents argue the statue’s identity relies on retaining a *dominant part*—a structurally significant portion preserving artistic coherence. If this core is lost, the functional kind persists, but it becomes a replica, not the original statue. The functionalist counters that conservation *defines* dominance contextually: if experts deem the conserved item authentic (e.g., via museum records), dominance is irrelevant.  

  **Does the Puzzle Dissolve?**  
  The functional approach dissolves the *metaphysical* puzzle of coinciding objects by reframing statues as non-material. Yet it falters on *epistemological* grounds: it cannot explain why a statue with minimal original matter seems less authentic. Conservation history may fix reference, but it cannot resolve whether identity *truly* persists when material continuity is negligible. Thus, while functional kinds avoid coincidence, they struggle with intuitions about preservation thresholds. The puzzle shifts from “two objects in one place” to “how much change undermines functional identity?”—a dissolution only for those prioritising use over substance.  

  ---

  ### Marking Scheme (Total: 20 marks)  
  *For each criterion, examiners should note: Has the student clearly engaged the *substance* of the argument, not just terminology?*  

  | **Criterion**                                                                 | **Marks** | **Common Pitfalls**                                                                 |  
  |-------------------------------------------------------------------------------|-----------|-------------------------------------------------------------------------------------|  
  | **1. Accurate exposition of functional-kind approach**                          | 4         | Superficial definition; fails to link conservation history to identity conditions.  |  
  | **2. Clear articulation of temporary-parts problem**                            | 4         | Misrepresents objection as mere part replacement; ignores unity-through-preservation.|  
  | **3. Analysis of dominant-part objection *without naming it***                  | 4         | Fixates on "original parts" generally; misses structural coherence as a distinct issue.|  
  | **4. Critical assessment of whether dissolution occurs**                        | 4         | Asserts dissolution without justifying *why* epistemological concerns matter less.  |  
  | **5. Structured argument & clarity (British spelling/punctuation)**             | 4         | Disorganised analysis; American spellings (e.g., "realize"); comma splices.         |  

  **Examiner Notes:**  
  - **Band Descriptors**:  
    - **17–20**: All criteria met; original synthesis; precise British English.  
    - **13–16**: Good grasp but minor gaps (e.g., underdeveloped criticism).  
    - **9–12**: Basic understanding but errors in argument flow/objection handling.  
    - **5–8**: Inaccurate exposition; significant omissions.  
    - **0–4**: Fails to address question; incoherent.  
  - **Typical Errors**:  
    - Criterion 1: "Functional kind = purpose" without conservation mechanisms.  
    - Criterion 3: Conflating dominant-part objections with mereological essentialism.  
    - Criterion 4: Declaring dissolution successful without addressing authenticity concerns.  

  ---  
  This exam tests conceptual agility by requiring students to *reconstruct* arguments from first principles while avoiding label-reliance. The marking scheme rewards depth over recitation, aligning with UK seminar standards.
