answer: |-
  Your graded framework for Thomistic tyrannicide is a sophisticated advance on the binary reading, but several deep features of Aquinas’s thought pose significant challenges. Below is a systematic analysis of what genuinely threatens your position, grounded in Thomistic metaphysics, authority theory, and epistemology:

  ### **1. Core Thomistic Commitments That Undermine the Graded View**
     - **Authority as Divine Derivation (ST I-II Q90, A3; De Regno I.6)**  
       For Aquinas, authority is *participated divine governance*. A ruler’s legitimacy depends on mediating God’s eternal law to the community. This creates an ontological binary: authority is either validly derived (via just institution) or void (usurpation). Your "partial suspension" has no analogue in this metaphysics. Authority, like grace, operates *in se* or not at all—it cannot be "partially" withdrawn by human action without divine judgment.
     - **The Indivisibility of the "Formal Cause" of Authority (In Sent. II D44 Q2, A2)**  
       Aquinas treats authority as a formal cause that either exists or doesn’t. A corrupt ruler still possesses the *auctoritas* (formal title), while a usurper lacks it entirely. Resistance to the former is rebellion against God’s ordained order; resistance to the latter is defense of that order. Your "suspension" framework conflates *abuse of authority* (a moral defect) with *invalid authority* (an ontological defect).

     - **Law as an Ordinance of Reason (ST I-II Q90, A4)**  
       A law that systematically violates the common good ceases to be law (*lex iniusta non est lex*). However, Aquinas applies this to *laws*, not the *ruler’s person*. The ruler’s legitimacy isn’t negated by unjust acts—only their *right to obedience* in specific commands (ST II-II Q104, A6). Resistance targets unjust laws/commands, not the ruler’s ontological status. Your "suspension" theory blurs this critical distinction.

  ### **2. Decisive Counterevidence from Aquinas’s Texts**
     - **The "Public Authority" Requirement (ST II-II Q64, A3; De Regno I.6)**  
       Aquinas explicitly reserves judgment of tyrants to "public authority" (e.g., the community, the Church, or a superior prince). He never sanctions private judgment for legitimate rulers—no matter how corrupt. Even in the case of usurpers, he implies a collective, not private, response (e.g., *De Regno* I.6: "the multitude can depose him"). Your allowance for calibrated *private* action lacks textual support.
     - **The Absence of Gradation in "Tyrannus in Titulo" vs. "Tyrannus in Regimine"**  
       Aquinas’s commentators (e.g., Cajetan, Suárez) rigidly maintain this binary. When Aquinas discusses resistance to tyrants (*De Regno* I.7), he contrasts usurpers (who may be killed) with legitimate rulers (who may only be deposed by due process). No third category exists.

     - **Epistemological Caution (ST I-II Q96, A2; II-II Q60, A5)**  
       Aquinas distrusts private judgment of rulers due to human fallibility and bias. He insists only public bodies can discern systemic corruption. Your framework empowers individuals/groups to declare authority "suspended"—directly opposing Aquinas’s institutional safeguards against anarchy.

  ### **3. Conceptual Weaknesses in the Graded Framework**
     - **The Unfalsifiability Problem**  
       Your model risks becoming a "Hermeneutic of Convenience": if any act of resistance can be justified by adjusting "degree of suspension," it loses predictive power. For Aquinas, normative theories must guide action through clear principles (*per se nota*). A theory where "proportionality" and "common good" are endlessly renegotiable undermines practical reason’s function.
     - **Metaphysical Incoherence**  
       Authority in Aquinas is *relational*: it exists between ruler and ruled via a shared recognition of legitimacy. Your "partial suspension" implies a fractured relationship where the ruled unilaterally void the bond. Aquinas would deem this impossible—authority is dissolved only by a superior power (e.g., the Pope deposing a king) or total collapse of the common good (equivalent to societal dissolution).

  ### **4. Concessions Graded View Defenders Must Make**
     - **Innovation, Not Exegesis**  
       Defenders must concede this is a *creative development* of Thomism, not strict exegesis. Aquinas never describes authority as "suspended" or "graded." This framework imports modern notions of legitimacy (e.g., Weberian sociology) into Thomism.
     - **Ambiguity in "Calibrated Permission"**  
       The criteria for determining "remediability through institutions" or whether action "serves the common good" are irreducibly subjective. Aquinas’s binary avoids this by tying legitimacy to *origin*, not *performance*—a clear, objective standard.

  ### **5. A Thomistic Compromise: The "Functional Authority" Pathway**
     If committed to a graded view, ground it in Aquinas’s distinction between:
     - **Authority *in se*** (indivisible formal title) and  
     - **Functional authority** (ability to enact the common good).  
     A ruler who structurally undermines the common good loses *functional authority*, triggering the community’s natural-law right to self-preservation (ST I-II Q96, A4; II-II Q64, A7). Resistance then becomes licit *not* because authority is "suspended," but because the ruler has functionally become a private aggressor—akin to a rogue soldier. This retains Aquinas’s ontology while accommodating systemic corruption.

  ### **Conclusion: What Truly Counts Against You**
  The fatal flaw is **Aquinas’s ontology of authority as a divinely instituted formal cause**. If authority is participatory divine governance, it cannot be partially voided by human judgment. Either the ruler retains the *sacra potestas* (making resistance rebellion) or never possessed it (making resistance licit). Your graded framework must either:
  - Reject Aquinas’s metaphysics of authority (collapsing into modern constitutionalism), or  
  - Accept that it extends Thomism beyond Aquinas’s explicit commitments.  

  The strongest evidence against you is Aquinas’s *silence*: he never qualifies resistance rules based on degrees of corruption. For a thinker who meticulously grades sins, virtues, and laws, this omission is telling. Your model’s explanatory power is undeniable—but its fidelity to Aquinas depends on prioritizing his *teleological ethics* over his *metaphysics of authority*.
