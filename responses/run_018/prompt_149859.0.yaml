  **Rule 2: Pre-Existing Ontological Symmetry**  
  - Acausal trade requires:  
    (a) The communication channel must be ontologically fundamental (e.g., inherent in physics/math), not agent-created.  
    (b) Both agents must symmetrically access and interpret the channel.  
