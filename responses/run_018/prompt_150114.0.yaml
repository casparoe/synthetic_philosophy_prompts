  Finally for part 4, I'll conclude this is distinct from existing concepts. While it borrows elements from costly signaling and Fisherian runaway, the unique combination of irreversible utility erosion driven by competitive in-group marking in digital communities makes it a novel phenomenon worthy of its own term. The digital environment likely accelerates this due to low-cost mutation and high visibility of signaling behaviors.
answer: |-
  Okay, grad student – love this observation. Let's break it down as requested, channeling that bio-philosopher/memetics vibe casually.

  **1. Brainstorm of nearest concepts (~100 words):**
  First thoughts: this screams *costly signaling* – adopting inefficient behaviors to prove group commitment. But it's hyper-charged. Memetic *mutation* is present, but it's *directional*, not random drift. Feels like *Fisherian runaway* from biology: a trait (insider signaling) becomes the target of selection itself, spiraling beyond utility (like a peacock's tail). Also echoes *ritualization* where functional behaviors become symbolic. *Group marking* and *identity performance* are key. The "ratcheting" is crucial – it's path-dependent, building on previous mutations, locking in complexity. Digital environments likely accelerate this due to visibility, low-cost mutation, and intense in-group pressure.

  **2. Does an established term fit, and why or why not? (~150 words):**
  No single established term perfectly captures this *exact* dynamic. **Costly Signaling** fits the core *function* of the mutations (signaling affiliation) but misses the key *directional ratcheting* and *active degradation of original utility*. Costly signals can be stable or even functional (expensive cars signal wealth *and* work). **Memetic Drift** captures the mutation aspect but implies randomness/neutrality, not the *directional selection pressure* towards pure signaling. **Ritualization** describes the *process* of functional→symbolic shift but is usually slower, broader, and doesn't emphasize the *competitive, runaway, utility-collapsing* aspect within a specific meme lineage. **Fisherian Runaway** is conceptually closest in *mechanism* (self-reinforcing selection for a trait that becomes detrimental) but it's a biological term for sexual selection, not directly applied to this specific cultural dynamic of *practical skill mutation*.

  **3. Proposed term and definition with boundary cases:**
  **Term: Signaling Collapse**

  **Definition:** The runaway evolutionary process within a cultural lineage where iterative mutations are directionally selected *primarily* for enhanced in-group marker value, leading to a progressive, ratcheting increase in performative complexity/cost *specifically tied to group identity*, concurrent with the active degradation or complete loss of the original practical utility or functional efficiency of the trait.

  **Boundary Cases:**
  *   **Not Signaling Collapse:** Adding a complex but *genuinely faster/more effective* step to the garlic trick (utility maintained/enhanced, even if also signaling).
  *   **Not Signaling Collapse:** A simple symbol replacing the functional act entirely (e.g., just saying "I know the trick" instead of doing it). This lacks the *ratcheting mutation within the performance itself*.
  *   **Not Signaling Collapse:** Cyclical fashion changes in how the trick is done, where simpler/functional versions return (violates the unidirectional ratchet).
  *   **Signaling Collapse:** Requiring specific, lore-based, *inefficient* controller inputs for the game strategy, purely to demonstrate deep knowledge.

  **4. Bottom line: is this genuinely distinct or just drift plus fashion? (~100 words):**
  It's **genuinely distinct**, though built from known blocks. Drift is random; this is directional selection *for* signaling. Fashion cycles; this ratchets irreversibly towards complexity-as-insiderness until utility collapses. Standard costly signaling explains *why* costly traits exist, but not this specific *runaway process within a functional meme lineage* leading to its *active destruction* as a practical tool. The unidirectional, utility-sapping, complexity-ratcheting nature driven purely by in-group marking pressure, especially in the context of *mutating a previously functional practice*, makes "Signaling Collapse" a useful, specific concept. Digital speed and visibility are likely key accelerants.
