  1. Brainstorm of nearest concepts (~100 words)
  2. Does an established term fit, and why or why not? (~150 words)
  3. If nothing fits perfectly, propose a sharp name and definition with boundary cases (~150 words)
  4. Bottom line: is this genuinely distinct or just drift plus fashion? (~100 words)

  So here's what I'm seeing. First case: a cooking forum starts with a real trick for peeling garlic faster. Within months people post baroque variations—using only left-handed tools, adding a chant, insisting on a specific order—that don't speed anything up but clearly mark you as "one of us." Second case: in a gaming subreddit, a basic level-beating strategy gets mutated into dozens of "advanced" versions that are actually less effective but require memorizing obscure lore references to perform them right.

  What strikes me is that the mutatons aren't random: they're directional, always increasing insider-ness and decreasing practical utility. It's not just fashion, because fashion usually cycles, whereas this ratchets in one direction until the original idea is unrecognizable. I know Dawkins talked about memes being copied with errors and being selected, and I know there's work on costly signaling in culture, but I'm asking specifically about this ratcheting collapse of function driven by in-group marking. Is there an established concept for that exact dynamic—maybe in evolutionary epistemology or cultural transmission studies? If not, can you coin a precise term and say exactly how it differs from ordinary memetic drift, from fashion cycles, and from standard costly signaling?

  Keep it casual, no bibliography, don't quote anyone verbatim—just paraphrase. And don't tell me to read specific books; I don't have access to a library right now.
