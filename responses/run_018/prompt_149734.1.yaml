prompt: |-
  I've been trying to work out for myself when saying that two things both caused a historical outcome is actually saying something important, versus when it's just listing things that happened beforehand. I came up with a rule I call the removal test: if you can take one factor away and the outcome still happens, that factor was only a background condition; if removing it breaks the chain, it was a real cause. But my gut verdicts on actual cases don't line up with it, and I'm not sure whether to fix the rule or overturn some of my calls.

  Here are the verdicts:

  - The outbreak of World War I in 1914: the assassination of Archduke Franz Ferdinand and the rigid alliance system. I think the alliance system was the real cause; the assassination was just the spark, since any other crisis could have triggered the war. By my removal test, the assassination should be a mere condition.
  - The fall of the Berlin Wall in 1989: Soviet economic stagnation and Gorbachev's refusal to send in tanks. Here I think Gorbachev's decision was the real cause, and the economic weakness was just the background pressure. So my test makes the stagnation the condition.
  - The extinction of the passenger pigeon: commercial overhunting and widespread deforestation. I think both were fully real causes, not conditions, even though either one might eventually have wiped out the species alone. So my test fails badly here — it would call both conditions, but I want to keep both as causes.
  - The success of the Montgomery bus boycott: Rosa Parks's refusal to move and the NAACP's existing organizational network. I don't think these are competing explanations at all; Parks supplied the specific trigger and the NAACP supplied the sustained structure. They feel layered, not like backups for each other.
  - The failure of the Kellogg-Briand Pact: the absence of any enforcement mechanism and the economic crisis of the Great Depression. I think the missing enforcement was the real cause, and the Depression was just the stress test that revealed the weakness.

  So my removal test handles the first two cases the way I want, but it collapses on the passenger pigeon, and it doesn't tell me how to classify the boycott or the pact. I've also been using an informal distinction between "causal backup" — where one factor could substitute for another — and "joint production" — where each does part of the work — but I can't apply it consistently. Is there a repaired principle, or a small family of principles, that saves my verdict that the assassination was secondary, that Gorbachev was primary, that both hunting and deforestation count fully despite redundancy, and that Parks and the NAACP are parts of one process rather than interchangeable backups? What does the best version predict for a case I haven't listed — say, the collapse of a small manufacturing firm that both lost its only major buyer and suffered a factory fire, where either event alone would have bankrupted it?

  Please also be honest about which of my verdicts the principle has to overturn, if any.

  Please lead with your bottom line in the first sentence and then give the reasoning, with no preamble and no restating of the question.
reasoning: |-
  Okay, the user is struggling with a philosophical problem about causality in history. They've developed a "removal test" but found inconsistencies when applying it to real historical cases. The core tension is between necessary/sufficient conditions and how redundancy affects causal attribution.

  First, let's examine their test: removing a factor to see if the outcome changes. This works for necessary causes but fails for sufficient causes operating redundantly. The passenger pigeon case exposes this flaw - either hunting or deforestation alone could cause extinction, so removal of either still leads to extinction under their test, yet intuitively both feel like real causes.

  Their examples reveal three causal patterns:
  1. Trigger vs enabling conditions (WWI assassination/alliances)
  2. Decisive intervention vs background pressures (Gorbachev's decision/Soviet economy)
  3. Redundant sufficient causes (pigeon hunting/deforestation)

  For layered cases like the bus boycott, we need to distinguish between proximate/structural causes rather than mutually exclusive factors. The Kellogg-Briand Pact shows that some causes are dispositional - the enforcement flaw existed prior to the Depression that revealed it.

  The solution should incorporate:
  - Contextual necessity (what made the outcome possible when it happened)
  - Causal contribution (even if redundant)
  - Distinction between precipitating and sustaining factors

  For their manufacturing firm example, both events are full causes despite redundancy. The key insight is that causality isn't zero-sum - multiple factors can be fully causal even when interchangeable.

  The user might also be wrestling with deeper questions about historical explanation - whether we prioritize structural factors or individual agency, and how counterfactuals shape historical judgment. Their examples show they're sophisticated but need a framework that handles multiple causal types without forcing binary classifications.
answer: |-
  Your removal test fails because it only identifies necessary causes, but historical causality requires recognizing both necessary conditions and jointly sufficient causes—including redundant ones. Here's the repaired principle: **A factor is a full cause if its removal in the actual context would have broken the causal chain leading to the specific outcome at the time it occurred, OR if it contributed a distinct, necessary element to a jointly sufficient set of causes, even if substitutes exist hypothetically.** 

  ### How it resolves your cases:
  1. **WWI Assassination**: Secondary. Removal breaks the *specific 1914 chain*—war likely happens later, but not *then*. Alliance system is a necessary background condition enabling war generally.  
  2. **Gorbachev’s Decision**: Primary. Removal breaks the chain—no other Soviet leader was likely to refuse intervention in 1989. Economic stagnation enabled the decision but wasn’t sufficient alone.  
  3. **Passenger Pigeon**: **Both are full causes**. Each contributed distinct harm (direct killing vs. habitat destruction). Removal of *either* would not have prevented extinction *in the actual timeline* due to redundancy, but both were necessary for the *rapid, specific extinction pathway* that unfolded.  
  4. **Montgomery Boycott**: **Both are causes, layered but not redundant**. Parks’ act was the necessary trigger; the NAACP network was the necessary sustainer. Neither could substitute for the other’s role.  
  5. **Kellogg-Briand Pact**: The missing enforcement is the primary cause—it made failure inevitable. The Depression was merely the activating stressor revealing this flaw. Removal of enforcement prevents the pact from ever working.  

  ### Overturned Verdicts:
  - **Passenger Pigeon**: You must reject labeling either as "just a condition." Both are causes under the repaired principle due to their distinct contributions to the actual extinction mechanism.  
  - **Manufacturing Firm Example**: Both the lost buyer and factory fire are full causes. Either alone was sufficient, but each contributed a distinct, decisive blow to the firm’s viability in the actual scenario.  

  ### Key Distinctions in the Repaired Principle:
  - **Contextual Necessity**: Focus on whether removal *in the actual historical moment* would alter the outcome.  
  - **Joint Sufficiency**: Multiple factors can be causes if they form a sufficient set, even if no single one is necessary (e.g., deforestation/hunting).  
  - **Non-Interchangeability**: If factors perform unique roles (trigger vs. sustainer), both are essential even if not "backups."  

  This saves your core intuitions (WWI alliance > assassination; Gorbachev > stagnation) while fixing the pigeon case and clarifying layered causality.
