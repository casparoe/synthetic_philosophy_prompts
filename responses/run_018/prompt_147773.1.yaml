prompt: |-
  I'm on the ethics panel for our state's hospice oversight board. There's this proposal from Meridian Hospice to allow voluntary cessasion of nutrition for patients with advanced dementia if they left an advance directive citing that death is not a harm to them — basically an Epicurean framing they want built into the consent framework. The disability rights coalition filed a brief saying we're treating dementia patients as if their future lives have no value, and that using Epicurus here is a philosphical sleight of hand because the patients aren't the ones reasoning, it's the families projecting. Half the panel thinks this is just honoring autonomy with an explicit philosphical basis; the other half thinks it's importing a contested metaphysics into medical policy. I need a short memo for Thursday's vote: recommend approve, reject, or approve with conditions. It should actually engage the Epicurean point — not just say death is bad, period — and deal seriously with the disability coalition's worry that the asymmetry argument gets misapplied when the subject can't currently affirm it. Also need a concrete timeframe if we go with conditions. Don't cite bibliographies, just reason it through. There's probably a typo in my notes but you get the idea.
reasoning: |-
  Okay, the user is on an ethics panel for a state hospice oversight board and needs help drafting a memo about a proposal from Meridian Hospice. The proposal involves allowing voluntary cessation of nutrition for advanced dementia patients based on an advance directive that uses Epicurean philosophy—specifically, the idea that death isn't a harm because you don't experience it. 

  The disability rights coalition has raised concerns, arguing that this approach devalues the lives of dementia patients and that families might be projecting their own views rather than honoring the patient's true wishes. The panel is split: some see it as respecting autonomy, while others worry about imposing a contested philosophical view into medical policy.

  The user needs a clear recommendation: approve, reject, or approve with conditions. They want the memo to engage deeply with the Epicurean argument, address the coalition's worries about asymmetry (where the patient can't currently affirm the directive), and include a concrete timeframe if conditions are recommended. No citations—just straightforward reasoning.

  First, I need to unpack the core issues. The Epicurean stance is central here: if death is truly non-experiential, then it can't be harmful, so refusing nutrition might align with a patient's prior rational choice. But the disability coalition's point is valid—once dementia advances, the patient isn't reasoning anymore, so applying this philosophy might just reflect the family's bias, not the patient's current interests. There's a tension between past autonomy (the directive) and present well-being (the patient's apparent lack of distress). 

  The coalition's concern about devaluation is serious. If we treat dementia patients as having "no valuable future," it echoes harmful ableist attitudes. But rejecting the proposal outright could undermine legitimate advance directives. A middle path might be best—approve with strict conditions that ensure the directive is unambiguous and accounts for the patient's current state. 

  For conditions, I'm thinking: verify the directive explicitly cites this philosophy, confirm the patient isn't experiencing distress that could be mitigated, require evidence that nutrition cessation was the intended method, and mandate a waiting period. The timeframe should be long enough to observe the patient but not endless—say, 72 hours. 

  The memo should balance respect for autonomy with safeguards against misapplication. The tone needs to be decisive but nuanced, showing I've wrestled with both sides. No fluff—just clear logic leading to "approve with conditions."
answer: |-
  ## Memorandum: Meridian Hospice Proposal on Voluntary Cessation of Nutrition  
  **To:** Hospice Oversight Board Ethics Panel  
  **From:** [Your Designation]  
  **Date:** [Date]  
  **Subject:** Recommendation on Proposal for Advance Directives Citing Epicurean Framing in Advanced Dementia  

  **Recommendation:** **Approve with Conditions**  

  ### Core Reasoning on the Epicurean Argument
  1.  **Respecting Explicit Prior Autonomy:** If a competent individual clearly documented, *based on an Epicurean view*, that they perceive non-existence (death) as non-harmful and specifically reject prolonged life in advanced dementia, honoring this directive is a legitimate exercise of autonomy. The state's interest in preserving life weakens against such a specific, reasoned prior refusal tied to a defined future state (irreversible advanced dementia).
  2.  **Limits of the Epicurean Application:** The panel majority favoring pure autonomy is partially correct *if* the directive is explicit. However, the minority's concern about "importing contested metaphysics" is valid *unless* the patient *themselves* adopted and cited this framework. We cannot impose Epicurus on those who didn't choose it. The proposal hinges on the patient's *own* stated philosophy, not the state's or hospice's endorsement of it. The harm/benefit calculus belongs solely to the patient *as they defined it when competent*.

  ### Addressing the Disability Coalition's Concerns
  1.  **Asymmetry & Projection Risk:** The Coalition correctly identifies the critical flaw: the *current* inability of the dementia patient to affirm or refute the prior directive's application *at this specific moment*. Families/proxies interpreting "best interests" through an Epicurean lens the patient *may not have held*, or misapplying a general directive, risks profound harm. This is not honoring autonomy; it's potentially overriding the patient's current, uncommunicable existence based on a contested interpretation of their past self.
  2.  **Devaluation of Life:** The concern that this frames the dementia patient's life as having "no value" is significant. Approving without safeguards could implicitly endorse the view that certain cognitive states are not worth living, impacting societal attitudes. The policy must rigorously focus on the *patient's own prior evaluation*, not a judgment about dementia lives generally.

  ### Conditions for Approval (Mitigating Risks)
  The proposal is ethically permissible *only* with strict safeguards ensuring it reflects the *specific patient's prior choice* and minimizes misapplication/projection:

  1.  **Explicit Directive Requirement:** Approval is limited to directives that **explicitly reference the refusal of assisted nutrition/hydration (ANH) in the context of advanced dementia AND explicitly articulate a rationale based on the non-experience of death (e.g., citing Epicurus, "no harm in death," "non-existence preferable to dementia existence")**. Generic statements about "no heroic measures" or "quality of life" are **insufficient**.
  2.  **Dementia Stage Verification:** Two independent physicians must confirm the patient is in **advanced dementia** (e.g., GDS Stage 7 or equivalent, lacking verbal coherence, minimal purposeful interaction) with no prospect of improvement. The condition must match the scenario anticipated in the directive.
  3.  **Absence of Current Distress:** A mandatory palliative care consultation must confirm the patient shows **no observable signs of hunger, thirst, or distress potentially attributable to dehydration** *before* cessation begins, and that comfort measures are optimized. This addresses the asymmetry – we cannot know if the *current* self experiences deprivation, so we must ensure comfort and rule out avoidable suffering unrelated to the underlying condition.
  4.  **Confirmation of Intent:** The proxy must provide **clear evidence** (e.g., specific conversations documented contemporaneously, explicit directive language) that cessation of ANH *was the intended method* for implementing the patient's wishes in this precise scenario. This combats projection by requiring a direct link to the patient's stated plan.
  5.  **Mandatory Waiting Period & Reassessment:** Upon initiation of cessation, a **72-hour observation period** begins. Clinical staff must monitor closely for *any* emergent signs of distress (agitation, apparent discomfort). If *any* such signs occur that are not immediately reversible by enhanced comfort/palliative measures, cessation **must be paused** and the case immediately reviewed by the ethics committee/supervising physician before proceeding. This timeframe allows detection of unanticipated suffering while remaining clinically practical.

  ### Conclusion
  The Epicurean argument, *when explicitly chosen and documented by the patient*, provides a coherent basis for refusing life-prolonging measures where consciousness is irrevocably diminished. However, the profound vulnerability of this population and the risks of projection or misapplication demand extraordinary safeguards. Approving **with the outlined conditions** respects valid prior autonomy grounded in the patient's philosophy while directly addressing the Disability Coalition's legitimate concerns about asymmetry and devaluation. The conditions ensure the directive is unambiguous, the patient's current state strictly matches the directive's trigger, current comfort is paramount, and the patient's specific intent for ANH cessation is demonstrable. The 72-hour observation period provides a critical safety check.

  **Vote Recommendation:** Approve the Meridian Hospice proposal **with Conditions 1-5 outlined above.**
