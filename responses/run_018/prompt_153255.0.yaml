  We are drafting a joint statement between a committed greedy reductionist (GR) and a committed crane-only emergence theorist (ET). The goal is to produce a document both can sign after good-faith debate, focusing on whether Dennett's cranes-versus-skyhooks framework can survive greedy reductionist analysis.

   The document must include:
   1. A numbered section of agreed claims.
   2. The precise disagreements, each in wording acceptable to the side proposing it.
   3. The cruxes, including one about whether high-level predictive dynamics in distributed biological systems can be fully dissolved into substrate-level explanations without irreducible explanatory loss.
   4. For each crux, the concrete case or line of argument both sides agree bears on it, and each side's explicit prediction about what that case shows.

   Structure:
   - First, a numbered list of agreed claims.
   - Then, a table for disagreements. The table should have:
     - A row for each disagreement.
     - Columns: 
          (a) Disagreement number and topic (e.g., "D1: On the Status of Intentional Stance Descriptions")
          (b) The greedy reductionist's position (in wording they accept)
          (c) The emergence theorist's position (in wording they accept)
          (d) The crux (the specific point of contention that the two positions hinge on)
          (e) The agreed-upon case or argument that bears on the crux
          (f) The GR's prediction about what the case shows
          (g) The ET's prediction about what the case shows

   Agreed Claims (numbered section):

   We need agreed claims about:
   - Evolutionary bottom-up construction
   - What greedy reductionism demands of explanation
   - Whether intentional-stance descriptions are ever genuinely indispensable rather than merely heuristic

   Let's draft:

   1. Both parties agree that complex biological systems, including cognitive systems, are the products of an evolutionary process of bottom-up construction, without design or teleology from above (i.e., without skyhooks).

   2. Both parties agree that greedy reductionism (as defined by Dennett) demands that explanations of phenomena should, in principle, be reducible to explanations at the level of the substrate (e.g., neural, biochemical, or physical) without invoking irreducible higher-level causal powers.

   3. Both parties agree that intentional-stance descriptions (ascribing beliefs, desires, and intentions) are pragmatically useful heuristics for predicting the behavior of complex systems (such as organisms or even some artifacts) but disagree on whether they are ever genuinely indispensable (see Disagreements).

   4. Both parties agree that the cranes-versus-skyhooks framework (as articulated by Dennett) is a valuable conceptual tool for distinguishing between explanations that rely on gradual, incremental, mechanistic processes (cranes) and those that invoke unexplained, miraculous, or non-naturalistic forces (skyhooks).

   5. Both parties agree that the dispute between them is not about the existence of emergent phenomena (in the sense of novel properties at higher levels of organization) but about whether such phenomena require irreducible explanatory principles beyond those of the substrate.

   6. Both parties agree that the question of whether high-level predictive dynamics in distributed biological systems (e.g., collective foraging in social insects) can be fully explained by substrate-level neural or biochemical processes without irreducible explanatory loss is a central crux of their disagreement.

   Now, Disagreements:

   We need to formulate the disagreements in wording that each side would accept without reservation.

   Let's propose:

   D1: On the indispensability of intentional-stance descriptions.
     - GR: "Intentional-stance descriptions are always replaceable, in principle, by design-stance and physical-stance descriptions without any loss of explanatory power or predictive accuracy; they are merely useful approximations for cognitive convenience."
     - ET: "Intentional-stance descriptions are sometimes indispensable for capturing genuine patterns in the world that cannot be fully captured by design-stance or physical-stance descriptions alone, especially in the domain of cognitive systems, and thus they reflect real, irreducible properties of the system."

   D2: On the reducibility of high-level predictive dynamics in distributed biological systems.
     - GR: "The high-level predictive dynamics observed in distributed biological systems (such as collective foraging in social insects) can be fully dissolved into substrate-level neural or biochemical explanations without any irreducible explanatory loss; the higher-level dynamics are entirely constituted by and thus reducible to the interactions of the substrate components."
     - ET: "The high-level predictive dynamics observed in distributed biological systems (such as collective foraging in social insects) exhibit emergent properties that cannot be fully captured by substrate-level neural or biochemical explanations alone without irreducible explanatory loss; the higher-level dynamics represent genuine causal patterns that are irreducible to the substrate."

   Now, the cruxes:

   We are required to have a crux for each disagreement. However, note that the agreed claim 6 already points to a central crux. We can structure the table so that each disagreement has a crux and then the agreed case and predictions.

   We are also required to include a concrete case or line of argument for each crux that both sides agree bears on it, and each side's explicit prediction.

   Let's design the table:

   For D1, the crux might be: 
     - Crux: Whether there exists any system whose behavior can be predicted or explained more accurately, more efficiently, or with greater generality by intentional-stance descriptions than by any possible non-intentional (design-stance or physical-stance) description, even in principle.

     - Agreed case: Consider the case of a chess-playing computer. We can predict its moves by ascribing beliefs and desires (e.g., it wants to checkmate and believes that moving the queen is the best way). Alternatively, we can use its programming (design stance) or the physical state of its circuits (physical stance).

     - GR prediction: The design-stance description (the program) and ultimately the physical-stance description (the circuitry) will provide a complete and equally accurate explanation of the chess-playing behavior without any need for intentional states. Any apparent advantage of the intentional stance is merely heuristic and due to our cognitive limitations.

     - ET prediction: The intentional-stance description provides a level of generality and predictive efficiency that cannot be matched by the design-stance or physical-stance descriptions, especially when the system is capable of learning and adapting in ways that are not pre-programmed. The intentional stance captures a real pattern that is not reducible without loss to the lower levels.

   For D2, the crux is already partially defined in the agreed claims (claim 6). We can refine:

     - Crux: Whether the high-level predictive dynamics of a distributed biological system (such as the collective foraging behavior of an ant colony) can be fully explained (without any loss of predictive power, generality, or explanatory insight) by a complete account of the substrate-level neural or biochemical processes of the individual components (ants) and their interactions.

     - Agreed case: The collective foraging behavior of an ant colony, where individual ants follow simple rules (e.g., pheromone trails) but the colony as a whole exhibits sophisticated, adaptive, and predictive foraging patterns (e.g., anticipating food source depletion, optimizing routes).

     - GR prediction: A complete simulation of the individual ants and their biochemical interactions (including neural processes and pheromone communication) would fully account for the colony's foraging behavior, including its adaptive and predictive aspects. No additional principles or higher-level causal forces are needed.

     - ET prediction: Even with a complete account of the individual ants and their interactions, the colony-level behavior exhibits emergent properties (such as predictive dynamics) that are best captured by higher-level descriptions (e.g., colony-level algorithms, stigmergic processes) and which cannot be fully explained without loss by the substrate-level account alone. The colony-level patterns are real and irreducible.

   Now, we must also consider that the document is about whether Dennett's framework can survive greedy reductionist analysis. Therefore, we might have a disagreement about the framework itself.

   D3: On the survival of Dennett's cranes-versus-skyhooks framework under greedy reductionism.
     - GR: "Dennett's cranes-versus-skyhooks framework is compatible with and ultimately reducible to a greedy reductionist account, because all cranes are themselves reducible to the interactions of substrate components, and the framework does not require any non-reducible emergent properties."
     - ET: "Dennett's cranes-versus-skyhooks framework, when properly understood, requires the existence of genuine emergent cranes (i.e., higher-level mechanisms that, while built from substrate components, exhibit irreducible causal powers and patterns) and thus cannot be fully reduced without explanatory loss to a greedy reductionist account."

     - Crux: Whether the concept of a crane, as a mechanistic, non-miraculous building process, necessarily implies the existence of irreducible higher-level properties or patterns that cannot be fully captured by substrate-level explanations.

     - Agreed case: The evolution of the vertebrate eye. A crane in Dennett's sense: a gradual, step-by-step process of natural selection building a complex organ. But the question is whether explaining the function of the eye and its role in the organism's behavior requires irreducible higher-level properties (e.g., the function of vision, the informational properties of light) beyond the biochemistry of the cells and the physics of light.

     - GR prediction: The entire evolutionary history and function of the vertebrate eye can be explained by the cumulative effect of genetic mutations and natural selection acting on the substrate (biochemical and physical properties of cells and tissues) without any need for irreducible higher-level properties. The function of vision is fully reducible to the physical interactions.

     - ET prediction: The function of the eye (e.g., as a visual system that provides information about the environment) is an emergent property that plays an irreducible role in explaining the behavior and survival of the organism. This functional property cannot be fully reduced to the substrate without losing the explanatory power of the function.

   Now, we have three disagreements. We'll structure the table accordingly.

   However, note that the request specifically includes the crux about high-level predictive dynamics (which we have as D2). We might also note that D1 and D3 are connected.

   Let's write the document.

   Note: We are to avoid bibliographies, citations, and authorities. We are to keep it formal and focused on conceptual mechanics.

