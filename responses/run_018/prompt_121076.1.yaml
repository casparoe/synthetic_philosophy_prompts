prompt: |-
  I'm putting together a short guidance note for a county pest-management advisory board — the kind of thing that has to give advice on the same day to a farmer deciding whether to spray, a public-health team weighing up mosquito control, and a householder with an ants nest under the patio — and I've realised I don't actually have a spec for what a decent ethical theory of pest control would even have to do. I don't want the theories yet, I want the requirements list first. Assume no internet on my end and no library: no citations, no reading lists, no "see the literature on X", I just want the thinking.

  So: write me the desiderata an adequate ethical theory of insecticide use and pest control has to meet, each with the case or consideration behind it. The purpose is fixed: it has to be usable as guidance by an agent with limited information, no lab, and a decision due this week — that's the standard, tell me if you think that purpose is itself the wrong one to be optimising for.

  The cases I think it has to get right include:

  - disease vectors where the human stakes are large and the insects are the proximate cause (mosquitoes, lice, bedbugs in a shelter)
  - a pest on a subsistence crop versus the same pest on an ornamental
  - non-target kill: taking out the natural enemies and pollinators along with the pest, and the resurgence/secondary-pest mess that follows
  - the vacancy-compensation point — kill the adults, free up the resources, and the population is back within a season, so what you've actually changed is the composition and timing of deaths and maybe the number of lives ever lived, not a neat subtraction of suffering
  - levers other than killing: mating disruption, sterile releases, repellents, and sub-lethal effects where you make existing lives worse without ending them
  - regimes rather than acts: a repeated practice across seasons, with resistance, the escalating-chemical treadmill, and in the gene-drive case genuine irreversibility
  - the counterfactual pest: outbreaks that exist only because of monoculture, global shipping and warmed winters, so the pest isn't a brute fact of nature we're responding to
  - the structure where very large numbers of possible sufferers meet a fairly low credence in insect sentience — say in a clause what you're assuming about the evidence for nociception and for insect declines and then move on, I don't want a literature review

  Also: the distinctions it isn't allowed to collapse (individual welfare versus population/species/ecosystem value; having some moral status versus how much; how many versus how badly; defence versus convenience versus cosmetics), plus any meta-requirements on the theory itself, e.g. that it must be action-guiding under deep uncertainty and mustn't hand out moral licences.

  Then the part I most want: mark which requirements are non-negotiable and which are really just a prejudice of one camp, flag any pair you think can't be jointly satisfied and say what has to give, and tell me which single requirement does the most work in knocking out otherwise popular views. A short scorecard at the end is fine — against sentience-first welfare consequentialism, ecological holism, human-priority public-health consequentialism, and a virtue-style "what relationship to the land does this express" view — but keep the weight on the criteria. British English please, and keep it to a page or two; I've only got about four hours of writing time and I keep geting nowhere.
reasoning: |-
  Alright, let me tackle this user's problem. They need a set of ethical criteria for pest control that can guide quick decisions by an advisory board. The user mentioned various scenarios like disease vectors, subsistence vs. ornamental crops, non-target kills, and more. 

  First, I need to identify the core requirements. The theory must handle urgency and limited info, so practicality is key. They want ethical distinctions maintained, like individual welfare vs. ecosystem value. Also, addressing deep uncertainty, especially about insect sentience, is crucial. 

  Looking at the cases, disease control with high human stakes is non-negotiable. Ignoring this would make the theory useless. Similarly, distinguishing necessity levels (defense vs. convenience) is essential to avoid trivial harm. 

  The vacancy-compensation point complicates things. Killing pests might not reduce suffering long-term. The theory must account for this without requiring complex data. Non-target effects and resistance are also critical. If a solution harms pollinators or leads to worse outbreaks, it's unsustainable. 

  Counterfactual pests highlight human responsibility. The theory should incentivize prevention over reaction. Regimes like gene drives need caution due to irreversibility. 

  Meta-requirements: The theory must be action-guiding under uncertainty. It can't assume perfect knowledge. Also, no moral licenses—each case needs scrutiny. 

  Conflicts might arise between human health and ecological harm. For example, spraying mosquitoes saves lives but kills non-targets. The theory must prioritize but require mitigation. Another conflict is sentience uncertainty: if insects feel pain, large numbers could outweigh human convenience. Precaution here is vital. 

  Assessing popular views: Sentience-first consequentialism fails urgency and uncertainty. Ecological holism might neglect individual suffering. Public-health consequentialism could overlook ecological costs. Virtue ethics might lack clear action steps. 

  The user’s deeper need is a practical, balanced framework that doesn’t get bogged down in theory. They need clear, actionable criteria for real-world decisions under pressure. Highlighting non-negotiables and trade-offs will help them make informed choices quickly.
answer: |-
  Here’s a distilled set of desiderata for an ethical theory of pest control, designed for actionable guidance under constraints. Requirements are categorised, with justifications and critical evaluations.

  ---

  ### **Core Purpose Requirements**
  1.  **Action-Guidance Under Urgency & Uncertainty (Non-negotiable)**  
      *Why:* Agents lack time/data for complex calculations. The theory must output a defensible decision (e.g., "spray/don’t spray/defer with conditions") using available info (e.g., pest ID, crop value, proximity to water).  
      *Knockout Effect:* Eliminates theories requiring precise sentience-weighting or multi-year ecological forecasting.

  2.  **Robustness to Deep Uncertainty (Non-negotiable)**  
      *Why:* Key unknowns include:  
      - *Insect Sentience:* Assume credible (not proven) evidence for nociception in some insects (e.g., flies, bees), weak/absent evidence in others (e.g., aphids). Moral weight per individual is highly uncertain but non-zero.  
      - *System Effects:* Unpredictable ecological blowback (e.g., secondary pests, resistance).  
      *Knockout Effect:* Rejects theories demanding certainty about consciousness or ecosystem outcomes.

  ---

  ### **Substantive Ethical Requirements**  
  **Non-Negotiable Foundations:**
  3.  **Prevent Catastrophic Harm to Humans (NN)**  
      *Why:* Disease vectors (e.g., malaria mosquitoes in endemic zone) or threats to subsistence food security mandate intervention. Failure here makes the theory irrelevant to public health/survival.

  4.  **Minimize Unnecessary Harm (NN)**  
      *Why:* Must distinguish:  
      - *Defence* (survival, health, essential food) vs. *Convenience* (lawn aesthetics) vs. *Cosmetics* (unblemished ornamentals).  
      - *Lethal* vs. *Non-Lethal* (repellents, sterile male releases) vs. *Suffering-Intensive* (sub-lethal neurotoxins) methods.  
      *Knockout Effect:* Condemns "kill-all-pests-everywhere" approaches. Elevates prevention/habitat-mod over chemicals.

  5.  **Avoid Unacceptable Collateral Damage (NN)**  
      *Why:* Non-target kills (pollinators, natural predators) often cause worse long-term problems (pest resurgence, ecosystem collapse). Theory must prioritise selective tools/methods.

  6.  **Respect Thresholds of Irreversibility (NN)**  
      *Why:* Gene drives or ecosystem-altering regimes risk permanent harm. Requires overwhelming justification (e.g., eradicating a novel human plague vector) + precautionary buffers.

  **Critical But Negotiable Balance Points:**
  7.  **Acknowledge Vacancy Compensation & Population Dynamics**  
      *Why:* Culling often increases total suffering/numbers by freeing resources. Theory should favour methods that *stably* reduce populations (e.g., habitat disruption) over temporary kills.

  8.  **Address Counterfactual Responsibility**  
      *Why:* Pests exploiting human-made conditions (monocultures, warming) impose a duty to fix root causes, not just symptoms. Incentivise systemic resilience over reactive killing.

  9.  **Scale Sensitivity**  
      *Why:* Must handle:  
      - *Individual Welfare* (minimise suffering per insect) vs. *Ecological Function* (e.g., keystone species).  
      - *Numbers* (billions affected) vs. *Intensity* (e.g., slow neurotoxin death).  
      *Tension:* Ecological holism may justify individual harm; sentience-focused views may neglect system collapse.

  10. **Regime Evaluation Over Act Evaluation**  
      *Why:* Single acts (e.g., spraying) are less relevant than patterns (e.g., annual spraying → resistance → stronger sprays → pollinator loss). Reject short-term fixes exacerbating long-term harm.

  ---

  ### **Meta-Requirements**
  11. **No Moral Licences (NN)**  
      *Why:* Must not generate "permission slips" (e.g., "public health → any chemical"). Require case-by-case justification + least-harm alternatives.
  12. **Anti-Fragility to Ignorance**  
      *Why:* When evidence gaps are vast (e.g., sentience in beetles), err toward precaution without paralysis. Default: avoid intense suffering/large-scale kills if alternatives exist.

  ---

  ### **Key Tensions & Trade-offs**
  - **Human Survival vs. Ecological Integrity:** Spraying malaria vectors *will* kill non-targets. Theory must:  
    a) Prioritise human survival where stakes are catastrophic, BUT  
    b) Demand targeted methods/mitigation (e.g., larvicides not broad-spectrum sprays).  
    *Trade-off:* Accept limited, necessary collateral; forbid it for marginal gains.
    
  - **Sentience Uncertainty vs. Scale:** Low credence of sentience × vast numbers = significant moral risk. Theory must:  
    a) Reject "ignore insects" views,  
    b) Prioritise avoiding suffering-intensive methods (e.g., sticky traps over quick crushing),  
    c) Focus on high-likelihood sentience (e.g., avoid harming bees unnecessarily).  
    *Trade-off:* Precaution without equivalence to vertebrates.

  - **Urgency vs. Systemic Thinking:** Can’t wait to redesign agriculture, but must incentivise transition. Solution:  
    - *Short-term:* Allow targeted kills for defence,  
    - *Long-term:* Advise on habitat diversification, resistance monitoring.  
    *Requires:* "This intervention, but report back for regime advice" guidance.

  ---

  ### **Scorecard of Popular Views**
  | **Theory**                          | **Fails On**                                                                 | **Strengths**                                  |  
  |-------------------------------------|-----------------------------------------------------------------------------|-----------------------------------------------|  
  | **Sentience-First Welfare Conseq.** | Urgency (calculus paralysis), uncertainty (weighting impossible), ecology (ignores system collapse). | Avoids intense suffering, distinguishes defence/convenience. |  
  | **Ecological Holism**               | Individual welfare (may sacrifice insects brutally), urgency (complex forecasting). | Prevents vacancy compensation, values pollinators, addresses regimes. |  
  | **Human-Priority PH Conseq.**       | Collateral damage (ignores non-targets), unnecessary harm (cosmetics = defence), irreversibility. | Decisive on disease vectors, clear on survival stakes. |  
  | **Virtue/Land Relationship**        | Action-guidance ("what expresses care?" is vague), deep uncertainty (no thresholds). | Motivates prevention, systemic change, rejects convenience-killing. |  

  ---

  ### **The Knockout Requirement**
  **"Action-Guidance Under Urgency & Uncertainty"** does the most work. It immediately disqualifies:  
  - Theories needing insect sentience probability calculations.  
  - Theories requiring ecosystem modelling beyond pest ID and immediate habitat.  
  - Any view without tiered thresholds (e.g., "defence/convenience/cosmetics").  

  ---

  **Summary Non-Negotiables:**  
  1.  Must prioritise human survival against catastrophic threats.  
  2.  Must minimise unnecessary harm (lethal/suffering methods only for defence, not convenience).  
  3.  Must avoid catastrophic collateral damage (e.g., pollinator wipeout).  
  4.  Must output a decision with available data *now*.  
  5.  Must not grant open-ended moral permissions.  

  **Output Format:** A flow-chart or tiered checklist (Defence/Convenience/Cosmetic) incorporating these thresholds meets your spec. Focus on: **Stakes, Selectivity, Systemic Resilience.**
