answer: |-
  You've pinpointed a crucial tension in post-conflict/oppression ethics. Jaspers' metaphysical guilt and institutional inheritance guilt are distinct concepts addressing different problems, though they might coexist in practice. Let's map the comparison:

  **Core Differences:**

  | **Dimension**          | **Jaspers' Metaphysical Guilt**                          | **Institutional Inheritance Guilt**                      |
  | :--------------------- | :------------------------------------------------------- | :------------------------------------------------------- |
  | **Subject**            | Individual conscience                                    | State institutions & power structures                    |
  | **Nature**             | Subjective, existential burden                           | Objective, systemic dysfunction                          |
  | **Source**             | Human solidarity; failure to resist/speak                | Historical continuity of tainted institutions            |
  | **Temporal Focus**     | Past actions (or inaction) during the wrong              | Present function of institutions built on past wrongs   |
  | **"Guilt" Meaning**    | Spiritual stain; failure of human responsibility         | Functional debt; illegitimacy of current advantage/order |
  | **Resolution**         | Personal atonement; moral reckoning                      | Structural reform; redistribution; institutional repair  |
  | **Collectivity**       | Individual burden multiplied across many                 | Systemic attribute of the *enduring state entity*        |
  | **Transferability**    | Dies with the individual                                 | Persists as long as institutions remain unreformed       |

  **Why They Are Fundamentally Different:**
  1.  **Locus:** Jaspers locates guilt *in the individual soul* arising from complicity via silence/passivity. Institutional guilt locates dysfunction *in the state apparatus itself*, regardless of individual complicity.
  2.  **Mechanism:** Metaphysical guilt operates through *shared humanity*. Institutional guilt operates through *historical institutional continuity*.
  3.  **Action Trigger:** Jaspers demands *personal moral transformation*. Institutional guilt demands *systemic political/legal restructuring*.
  4.  **Concept of the Nation:** Jaspers sees the nation as a collection of individuals bearing personal burdens. Institutional guilt sees the nation as an *enduring political entity* whose legitimacy depends on its institutional foundations.

  **Answering Your Core Question: Which justifies "Nation Guilt" 50+ Years Later?**

  *   **Jaspers' Metaphysical Guilt:** **Does NOT** support the idea that the *nation itself* is guilty decades later. It explicitly rejects collective guilt. The burden is individual and dies with those who lived through the events. Their *descendants* might feel a *sense* of connection or responsibility, but that is distinct from *inheriting metaphysical guilt* itself. Jaspers protects future generations from direct blame.
  *   **Institutional Inheritance Guilt:** **DOES** support the idea that the *nation-state as an entity* carries "guilt" (in the functional/debt sense) decades later. The argument is:
      *   The state is a continuous legal/political entity.
      *   Its current institutions, laws, power structures, and even wealth distribution may be directly shaped by or built upon foundational historical injustices (slavery, colonial plunder, genocide, systemic discrimination).
      *   These structures continue to confer unearned advantage or perpetuate disadvantage *in the present*.
      *   Therefore, the *state itself* owes a debt (restitution, reform, acknowledgment) to repair the ongoing effects of its historically tainted foundations, regardless of the personal innocence of current citizens or leaders. The "guilt" lies in the unaddressed *institutional legacy*, not in the personal morality of living individuals.

  **Where They Break Down:**

  *   **Jaspers' Metaphysical Guilt:**
      *   **Breakdown:** It struggles with the *enduring consequences* of past wrongs that transcend individual lifespans. It offers no clear framework for addressing systemic, intergenerational injustice embedded in *structures*.
      *   **Risk:** Can lead to moral paralysis ("I feel bad, but what can *I* do about the past?") or be perceived as purely sentimental without demanding concrete political action. Risks letting the *state* off the hook for institutional continuity.

  *   **Institutional Inheritance Guilt:**
      *   **Breakdown:**
          *   Can feel alienating or unjust to current citizens who bear no *personal* blame ("Why should *I* pay?").
          *   Requires careful historical tracing to prove concrete, *ongoing* institutional advantage/disadvantage directly linked to specific past wrongs (avoiding vague assertions).
          *   Risks becoming overly technocratic, losing the human dimension of suffering and responsibility that Jaspers emphasizes.
          *   Defining the scope of "inheritance" and the endpoint of "debt paid" is politically contentious.
      *   **Risk:** Can fuel resentment if framed as *collective moral blame* rather than *collective institutional responsibility*.

  **The Tension You Identified:**

  You named it perfectly: **"Accountability without collective blame" (Jaspers) vs. "Collective obligations without individual guilt" (Institutional Inheritance).**

  *   **Jaspers:** Focuses on the *individual's moral relationship to past evil*, creating accountability through personal reckoning but shielding the collective entity (nation-state) and future generations from direct blame.
  *   **Institutional Inheritance:** Focuses on the *state's functional relationship to its own history*, creating collective obligations for repair rooted in the *ongoing operation of its institutions*, while explicitly absolving living individuals of personal culpability for the past acts.

  **Conclusion for Your Feature:**

  They are distinct concepts answering different questions. **Jaspers asks: "How do I, as a human being, reckon with my connection to evil?" Institutional Inheritance asks: "How does a state reckon with the enduring legacy of injustice baked into its foundations?"**

  *   To argue a *nation* (as a political entity) is "guilty" 50+ years later, **Institutional Inheritance Guilt provides the stronger, more defensible framework.** It anchors the obligation in the *present reality* of the state's structure and advantages, avoiding the pitfalls of blaming innocent individuals. It shifts the language from "guilt" (with its moral connotations) towards "debt," "responsibility," "obligation," or "illegitimate inheritance" arising from institutional continuity.
  *   Jaspers remains vital for understanding the *human, existential dimension* of complicity and the importance of individual moral reckoning *by those who were there*, but it doesn't translate into a sustainable concept of *national* guilt across generations. The "metaphysical" burden dissipates with the passing of the generation involved.

  The power of your analysis lies in showing how these concepts interact: Acknowledging the *individual* existential weight (Jaspers) can motivate citizens to support the *institutional* restructuring demanded by the inheritance framework. Conversely, ignoring the human dimension makes institutional reform feel cold and imposed, while ignoring the institutional legacy reduces morality to personal feeling without societal change.
