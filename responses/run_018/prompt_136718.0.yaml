egative impact measures into implicit value functions, and the shared failure onto the philosophical claim that “low impact” cannot be defined independently of “high value.” Predict what will go wrong the first time: teams will converge on “do not harm humans,” which the red team breaks by demanding a prior theory of harm; others will appeal to “common sense” or “minimal change,” which should be recorded as data points showing that every baseline is already value-laden. Be frank about the feature the activity cannot reproduce: it can make vivid the boundary problem and the baseline-dependence of negative constraints, but it cannot demonstrate the formal result that any computable side-effect penalty is extensionally equivalent to a partial value function; you must supply that equivalence verbally. Do not ask for bibliographies, reading lists, or citations; do not require participants to research specific authors; and avoid invoking highly specialized technical formalisms that depend on outside verification.
