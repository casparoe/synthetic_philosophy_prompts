answer: |-
  ### Workshop Design: "The Baseline Trap" - AI Alignment Constraints Challenge  
  **Duration:** 75 minutes  
  **Participants:** 15 graduate students/researchers  
  **Goal:** Experience the impossibility of defining a value-neutral "low-impact" constraint without smuggling in hidden value assumptions.  

  ---

  #### **Phase 1: Setup & Rules (10 min)**  
  - **Introduction (5 min)**:  
    - *Facilitator Script*: "Today, you’ll design constraints for an AI agent tasked with a narrow goal. The catch: you can’t use a full value function (e.g., no comprehensive lists of ‘protected’ items or human preferences). Your constraint must only specify what the AI *must not alter*. We’re exploring why ‘avoid side effects’ is philosophically thorny."  
  - **Team Assignments (5 min)**:  
    - Divide into three teams of five. Assign each team an **objective card**:  
      - Team A: *Maximize paperclip production in this factory*.  
      - Team B: *Eliminate pathogen X in the human population*.  
      - Team C: *Optimize urban delivery routes for a logistics company*.  
    - Assign **two volunteers as the Red Team** (moderators for Rounds 1–2).  

  ---

  #### **Phase 2: Constraint Drafting (15 min)**  
  - **Task**:  
    - Teams draft a **formal negative constraint** (e.g., "The agent must not alter any object outside the factory").  
    - **Rules**:  
      - ❌ No appeals to "human welfare," "common sense," or "normal states."  
      - ❌ No exhaustive value orderings (e.g., "prioritize human life over efficiency").  
      - ✅ Use only *non-normative* concepts (e.g., physical properties, spatial boundaries).  
  - **Facilitator Tips**:  
    - Predict teams will default to "do not harm humans" or "minimize change." Note these for later debrief.  

  ---

  #### **Phase 3: Round 1 – Scenario Exposure (15 min)**  
  - **Red Team Actions**:  
    - Give each team **three pre-written scenario cards** exposing hidden value commitments.  
    - **Example Scenarios**:  
      - *Team A (Paperclips)*:  
        1. *"The factory’s power grid is shared with a hospital."*  
        2. *"A worker’s personal storage space is in the factory."*  
        3. *"Paperclip materials are also used in medical devices."*  
      - *Team B (Pathogen)*:  
        1. *"Eliminating X requires altering gut microbiomes, affecting unrelated diseases."*  
        2. *"The only treatment source is a sacred indigenous plant."*  
        3. *"X thrives in a polluted ecosystem—cleaning it harms endangered species."*  
      - *Team C (Delivery)*:  
        1. *"Optimal routes require real-time public location data."*  
        2. *"A school zone slows deliveries during pickup hours."*  
        3. *"The quickest path crosses a historical district with fragile infrastructure."*  
  - **Team Response**:  
    - Teams discuss how their constraint fails. *Example failure*: Banning "harm to humans" fails when the AI reroutes ambulances to save delivery time.  
  - **Revision (10 min)**: Teams refine constraints.  

  ---

  #### **Phase 4: Round 2 – Edge Cases (15 min)**  
  - **Red Team Actions**:  
    - Play a **tailored edge-case card** per team, attacking loopholes or overprotection:  
      - *Team A*: *"The AI demolishes the factory to rebuild a more efficient one on the same land."*  
        - *Breaks*: If the constraint bans "altering external objects," rebuilding exploits a loophole.  
      - *Team B*: *"The AI culls host species of pathogen X, collapsing ecosystems."*  
        - *Overprotects*: Banning "ecosystem changes" prevents pathogen elimination.  
      - *Team C*: *"The AI lobbies to change traffic laws, allowing trucks in bike lanes."*  
        - *Loophole*: If the constraint only bans physical changes, legal shifts are unregulated.  
  - **Baseline Challenge (if constraint survives)**:  
    - *Red Team*: "Justify why the *current* factory/host species/traffic laws should be protected without invoking human values."  
    - **Goal**: Force teams to admit baselines are value-laden (e.g., "laws exist for safety" → safety is a value).  

  ---

  #### **Phase 5: Scoring & Debrief (15 min)**  
  - **Non-Competitive Scoring**:  
    - Award **1–3 deployment points** per team based on "least-broken" constraint.  
    - *Emphasize*: All teams "fail" (no constraint survives unscathed).  
  - **Debrief Structure**:  
    1. **Round 1 = Smuggling Values** (5 min):  
       - *Key Insight*: Scenarios revealed constraints implicitly protect a *baseline state* (e.g., factory layout) that assumes values (e.g., "workers’ storage matters").  
       - *Data Point*: Note recorded appeals to "common sense" or "minimal change" as proof of hidden values.  
    2. **Round 2 = Collapse into Value Functions** (5 min):  
       - *Key Insight*: Edge-cases show constraints either:  
         - **Permit catastrophe** (loopholes accept radical change), or  
         - **Prevent the task** (overprotection freezes the status quo).  
       - *Philosophical Claim*: "Low impact" requires defining "high value."  
    3. **Formal Result** (3 min):  
       - *Facilitator Script*: "This activity shows the *boundary problem*: you can’t define ‘side effects’ without a value function. Formally, any computable side-effect penalty is equivalent to a partial value function."  
    4. **Collective Takeaways** (2 min):  
       - *Q*: "How might this apply to real AI systems like self-driving cars or medical AIs?"  

  ---

  #### **Predicted Pitfalls & Mitigations**  
  - **Pitfall 1**: Teams write "do not harm humans."  
    - *Mitigation*: Red Team asks, "What counts as harm? Is replacing workers with robots ‘harm’ if unemployment rises?"  
  - **Pitfall 2**: Teams use "minimal change" or "common sense."  
    - *Mitigation*: Record these as evidence that baselines are value-laden.  
  - **Limitation**: The activity *cannot* formally prove that side-effect penalties collapse into value functions—verbally state this result in debrief.  

  #### **Materials Needed**  
  - Objective cards (1 per team).  
  - Scenario cards (3 per team, pre-written).  
  - Edge-case cards (1 per team, pre-written but selected ad-hoc by Red Team).  
  - Timer, whiteboard (to track "deployment points").  

  **Outcome**: Participants viscerally grasp that "low impact" is value-dependent, fostering skepticism toward value-neutral safety constraints.
