prompt: |-
  My friend Dana is my go-to person for secession arguments. Shes not a lawyer but shes read basically everything on Scotland, Catalonia, and Quebec, and she has strong verdicts she can defend. As best I can reconstruct them:

  - Scotland 2014: if Yes had won it would have been a legitimate independence and the UK should have let it happen. The vote was clean, turnout was enormous, and the UK had agreed in advance to respect the result.
  - Catalonia 2017: the unilateral declaration was illegitimate and shouldn't have been recognized. But her reason was mostly that the referendum itself was a bust — it was illegal, the unionists boycotted, police were breaking it up, turnout was in the low 40s, so no clear expression ever emerged.
  - Quebec 1995: a bare 50-plus-1 in favor would not have been enough, but a genuinely clear majority would have created a real obligation on Canada to negotiate instead of pretending nothing had happened. She basically accepts the Clarity Act idea of a clear majority on an unambiguous question.

  Now here's the case she hasn't ruled on. Imagine a prosperous stable democracy where one region has a distinct language and identity, no recent history of oppression, but the national constitution flatly says the territory is indivisable. A regional movement runs its own referendum with international observers: turnout above 70%, and 58% vote for independence. The central government says the constitution settles the matter, refuses to authorize an official referendum, and refuses to negotiate.

  If Dana wants to be consistent with her earlier verdicts, what should she say about this new case, and which of her three earlier cases is the closest analog? Walk me through (1) the rule or rules that fit all three of her verdicts, (2) which principle each candidate rule commits her to and what each predicts about the new case, (3) your best guess at her verdict and why you weight one rule over the others, and (4) one further case, real or invented, that would cleanly settle which rule shes actually running.
reasoning: |-
  Okay, let me approach this systematically. The user presents an interesting thought experiment about secession principles based on Dana's established positions. 

  First, I need to extract the implicit rules from Dana's three historical judgments:
  - For Scotland 2014: Legitimacy hinges on (a) vote cleanliness, (b) high turnout, and (c) prior agreement by the state
  - For Catalonia 2017: Illegitimacy due to (a) legal violations, (b) boycott-induced unrepresentativeness, (c) state interference
  - For Quebec 1995: Supports the "Clarity Act" concept requiring (a) unambiguous question and (b) clear majority beyond 50%+1

  The hypothetical case has notable features: high turnout (70%), clear but not overwhelming majority (58%), unilateral action due to constitutional prohibition. This creates tension between Dana's apparent principles of democratic expression versus constitutional order.

  The core conflict seems to be between two potential overarching rules:
  1) Democratic Legitimacy Rule: Prioritizes the quality of popular will expression
  2) Constitutional Authorization Rule: Requires state consent for secession processes

  In the new case, these principles clash sharply. The 70% turnout and 58% majority satisfy her democratic criteria from Quebec and Scotland, but the constitutional prohibition echoes Catalonia's legal objections. 

  Notably, Dana dismissed Catalonia's vote primarily over procedural flaws (boycott, low turnout, violence) rather than just illegality. Here, the clean vote might sway her toward legitimacy despite unconstitutionality - especially since the state refused any negotiated solution.

  For a clarifying test case, I imagine a scenario with perfect democratic credentials (high turnout, supermajority) but conducted illegally against a state that historically oppressed the region. This would force Dana to choose between her democratic principle and constitutional/legal compliance principle.
answer: |-
  Based on Dana's established positions, here's the breakdown for the hypothetical case, following your requested structure:

  ### (1) Core Rules Extracted from Dana's Verdicts
  Dana's judgments consistently prioritize **two key principles**:
  1.  **Democratic Legitimacy Principle:** The *expression of the popular will* must be clear, credible, and representative. This is assessed by:
      *   **Process Legitimacy:** Was the vote legal (or agreed upon), fair, and free from major disruption/coercion? (Scottish agreement vs. Catalan illegality/police action).
      *   **Representativeness:** Was participation high enough and broad enough to reflect the region's true will? (Scottish high turnout vs. Catalan boycott/low turnout).
      *   **Clarity of Question & Result:** Was the question unambiguous and the majority sufficiently clear? (Quebec's Clarity Act logic - needing more than 50+1).
  2.  **State Consent Principle:** The *agreement or acquiescence of the existing state* significantly bolsters legitimacy, especially concerning legality and process. (Scottish agreement vs. Catalan illegality).

  ### (2) Candidate Rules & Predictions for the New Case
  While the two principles above are intertwined, we can frame distinct candidate rules emphasizing one over the other:

  *   **Candidate Rule A (Democratic Expression Primacy):** "A secession is legitimate if the regional population expresses its will clearly, credibly, and representatively through a democratic process, *even if unilateral and constitutionally prohibited*, provided there is no recent oppression justifying the prohibition."
      *   **Prediction for New Case:** Legitimate. The referendum had high turnout (70%, exceeding Scotland), a clear majority (58% > Quebec's "bare majority" threshold), was cleanly run with observers, and the region is stable/prosperous with distinct identity. The constitution's prohibition is dismissed as an undemocratic barrier to a clear popular mandate. (Analogy: Closest to Quebec's principle, but applied unilaterally).

  *   **Candidate Rule B (Constitutional/State Consent Primacy):** "Secession requires a process recognized or agreed to by the existing state, grounded in its constitutional order. A unilaterally declared referendum, especially one explicitly forbidden by the constitution, cannot create a legitimate obligation to secede, regardless of the vote's conduct or result."
      *   **Prediction for New Case:** Illegitimate. The constitution explicitly forbids secession and the central government refused authorization. The referendum, however well-run, was fundamentally illegal and unilateral. (Analogy: Closest to Catalonia - the illegality is decisive, despite better conduct/turnout).

  ### (3) Best Guess for Dana's Verdict & Why
  *   **Verdict:** Dana would likely argue the secessionist movement has a **strong moral/political claim** and the central government is acting **unreasonably and undemocratically** by refusing *any* negotiation or authorized vote. However, based on her *stated principles from prior cases*, she would likely conclude the **unilateral declaration lacks full legal/political legitimacy** in this specific scenario.
  *   **Reasoning & Weighting:**
      1.  **Catalonia Precedent is Binding on Illegality:** Dana rejected Catalonia primarily *because* the referendum was illegal and boycotted, making the result unrepresentative. Here, the illegality is even starker (explicit constitutional prohibition) and the central government's refusal is absolute. She can't easily dismiss this legality/consent factor after emphasizing it in Catalonia.
      2.  **Quebec's Clarity Requires Process:** She endorsed the Clarity Act, which operates *within* the Canadian constitutional framework. It assumes a process initiated/accepted by the state. A unilateral vote, even with a clear majority, bypasses this essential state-consent element she implicitly accepts.
      3.  **Scotland's Agreement Matters:** Her approval of Scottish legitimacy hinges crucially on the UK's *prior agreement* to respect the result. The absence of any agreement or even negotiation avenue here is a critical difference.
      4.  **Mitigating Factors Acknowledge Strength, Not Legitimacy:** The high turnout, clear majority, clean process, and distinct identity make the case *stronger* than Catalonia and create significant political pressure. This likely makes Dana sympathetic and critical of the central government's rigidity. However, her prior rulings suggest she draws a line at unilateral action explicitly barred by the constitution in a non-oppressive context. She values stability and process (the State Consent Principle) alongside democratic will.

  **Analogy Closest:** **Catalonia 2017** is the closest analog. While the *conduct* of the vote was better in the hypothetical (clean, high turnout, no boycott), the *core legal/constitutional illegitimacy and unilateral nature* are shared decisive factors for Dana. Quebec shares the "clear majority" idea but within an accepted process. Scotland shares high legitimacy but crucially had state consent.

  ### (4) Clarifying Test Case
  **The Case:** A region with a distinct identity/language in a stable democracy suffers documented, systemic, and recent (last 20-30 years) political and cultural oppression by the central state (e.g., banning language in schools/administration, deliberate underinvestment, police brutality against peaceful cultural activists). The constitution explicitly forbids secession. After years of failed petitions and legal challenges, the regional government holds a unilateral referendum. International observers confirm it's clean and fair. Turnout is 75%, with 65% voting for independence. The central government declares it illegal and refuses to engage.

  *   **Why it Clarifies:**
      *   **Tests the "No Recent Oppression" Limit:** The hypothetical case explicitly rules out oppression. This test case introduces severe, recent oppression.
      *   **Pits Principles Against Each Other:** Democratic Legitimacy (high turnout, supermajority, clean vote, justified by oppression) vs. Constitutional/State Consent Primacy (explicit prohibition, unilateral action).
      *   **Mimics Historical Precedents:** Resembles elements of Kosovo, East Timor, or Bangladesh, where oppression legitimized unilateral action internationally for many.
  *   **Prediction for Dana's Response:** If Dana prioritizes **Democratic Expression Primacy** (Rule A), the severe oppression provides a moral and political justification for bypassing the constitutional prohibition and state consent. She would deem the secession legitimate or at least create a strong obligation to negotiate. If she adheres strictly to **Constitutional/State Consent Primacy** (Rule B), she would still consider it illegitimate due to the unilateral/illegal nature, arguing oppression should be solved within the system or via international intervention, not unilateral secession. Given her emphasis on *representative will* and the Catalonia rationale focusing on the *flawed process* rather than inherent illegality *per se*, the oppression likely tips her towards legitimacy, revealing that her "State Consent" principle has limits when faced with injustice. This would show that the *absence of oppression* in the original hypothetical was a key factor in her rejecting its legitimacy.
