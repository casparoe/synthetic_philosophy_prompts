  **Workshop Proposal: Shadow Memberships and the Demos Boundary Problem**  

  **Research Question**  
  How do state-administered religious membership mechanisms in Germany (Kirchensteuer opt-out lists) and England (Crown-parliament governance of the Church of England) create non-democratically accountable bodies with coercive or fiscal power, and is administratively enforced affiliation (Germany) a more severe democratic boundary failure than symbolic establishment (England)?  

  **Gap in Existing Literature**  
  Standard secularism debates focus on neutrality, laïcité (France), or non-establishment (US), treating these as matters of individual rights or state impartiality. They assume the demos—the legitimate political community—is predefined, overlooking how state-religion structures can actively shape membership boundaries. Consequently, they fail to address whether mechanisms like tax-based affiliation or parliamentary control create "shadow memberships": groups wielding authority (e.g., taxation, governance) without democratic accountability. This gap leaves unresolved whether such arrangements violate the core democratic tenet that coercive power requires continuous popular authorization.  

  **Methodology**  
  A conceptual comparative taxonomy analyzing four states:  
  - **Germany**: Examines the Kirchensteuer system, where state-collected taxes enforce religious membership via opt-out lists, tying fiscal coercion to administrative affiliation.  
  - **England**: Assesses Crown-parliamentary church governance, where bishops sit in the legislature and the monarch leads the church, creating symbolic-state authority without direct membership enforcement.  
  - **France/US**: Contrast with laïcité (strict state-religion separation) and US disestablishment (constitutional neutrality), testing if they avoid boundary failures by rejecting state-linked membership bodies.  
  The taxonomy links three elements: (1) **Membership mechanism** (e.g., tax rolls, symbolic inclusion), (2) **Coercive authority** (fiscal, legislative, or cultural), and (3) **Democratic accountability** (presence/absence of popular oversight). No empirical data collection; relies on legal texts and policy analysis.  

  **Expected Result**  
  A framework classifying democratic boundary-failure types along two dimensions:  
  1. **Severity axis**: Ranging from symbolic (e.g., England’s ceremonial establishment) to material (e.g., Germany’s revenue-linked opt-outs).  
  2. **Mechanism axis**: Categorizing enforcement methods (administrative, legislative, cultural).  
  This will clarify if materially coercive affiliations (Germany) constitute a distinct, graver failure than symbolic ones (England) due to direct fiscal imposition, or if both equally undermine demos integrity by delegating authority to unaccountable bodies.  

  **Defining Boundary Failure**  
  Failure occurs when state mechanisms:  
  1. Create or sustain groups with coercive power (taxation, rule-making) over individuals without their ongoing consent.  
  2. Detach that power from democratic control (e.g., Kirchensteuer funds allocated by churches, not legislatures; Church of England doctrine set by unelected bishops).  
  Success would reveal tax-based and symbolic models as morally distinct (due to Germany’s material burden), or identical (both exempt religious bodies from democratic scrutiny).  

  **Scope and Limitations**  
  This four-month workshop will not conduct archival research, fieldwork, or public opinion analysis. Deliverables include:  
  - A comparative taxonomy of membership mechanisms.  
  - The boundary-failure framework.  
  - A working paper evaluating severity.  
  Focus is conceptual: no original historical analysis, legal case studies, or expansion beyond Germany/England as primary cases (France/US as secondary contrasts). Assumes familiarity with basic church-state structures in all four states.
