answer: |-
  ## Mirror Proof

  Here is the frame, and here is my hand upon it,
  Solid and certain against the polished plane.
  Therefore, a world beyond the glass exists.

  The shadow falls where substance was admitted,
  A silhouette defined by light's refrain.
  Here is the frame, and here is my hand upon it.

  Is this the proof? The evidence submitted?
  This edge of consciousness, this mental stain?
  Therefore, a world beyond the glass exists.

  That surface gleams, by shifting thought ignited,
  Reflecting back the self it must contain.
  Here is the frame, and here is my hand upon it.

  The frame itself dissolves, by doubt unseated:
  A border drawn, then questioned once again.
  Therefore, a world beyond the glass exists.

  The glass becomes the mind, by its own light lit,
  Containing all it seeks to ascertain.
  Here is the frame, and here is my hand upon it,
  Therefore, a world beyond the glass exists.

  ---

  **Notes on the Villanelle's Structure:**

  *   **Form:** Strict adherence to the villanelle structure: five tercets (ABA rhyme scheme) and a closing quatrain (ABAA). Rhymes: `upon it` / `submitted` / `ignited` / `unseated` / `lit` (A); `exists` / `plane` / `refrain` / `stain` / `contain` / `again` / `ascertain` (B).
  *   **Refrain Evolution:**
      *   **Premise:** "Here is the frame, and here is my hand upon it" shifts subtly:
          *   Stanza 1: Literal hand on mirror frame.
          *   Stanza 2: Hand becomes its shadow (`silhouette`).
          *   Stanza 3: Frame becomes "edge of consciousness".
          *   Stanza 4: Frame remains abstract, hand reasserted literally but questioned by context.
          *   Stanza 5: Frame dissolves entirely, hand remains but the "frame" is now merely a "border drawn".
          *   Quatrain: Frame and hand become entirely internal ("mind", "its own light lit").
      *   **Conclusion:** "Therefore, a world beyond the glass exists" remains grammatically consistent, but its meaning hollows as the "glass" transforms:
          *   Stanza 1: Literal mirror glass.
          *   Stanza 2: Implied reflective surface.
          *   Stanza 3: Surface becomes ambiguous ("mental stain").
          *   Stanza 4: Surface remains, but its nature is questionable ("must contain").
          *   Stanza 5: Surface becomes "the mind" itself.
          *   Quatrain: Final repetition after the "glass" is explicitly declared to *be* the mind.
  *   **Logical Unraveling:** The poem enacts the skeptical reversal by progressively internalizing both premises and conclusion. The "proof" relies on pointing to things (frame, hand, glass) assumed to be external and distinct. By redefining them as mental constructs ("edge of consciousness," "mind," "shadow," "border drawn"), the argument becomes circular: the "world beyond" is defined solely by contrast with the "inside" (the mind/glass), which is never independently verified as an "inside" relative to a *genuine* outside. The "proof" presupposes the distinction it purports to prove.
  *   **Moore's Proof Parallel:**
      *   Moore's Premise ("Here is a hand") → Villanelle Premise ("Here is the frame, and here is my hand upon it")
      *   Moore's Conclusion ("Therefore, an external world exists") → Villanelle Conclusion ("Therefore, a world beyond the glass exists")
      *   Moore's Claim (Premises known, therefore conclusion follows perfectly) → Villanelle's assertive tone and initial certainty, undermined by the shifting definitions showing the premises *aren't* independently verifiable foundations.
  *   **The Turn (Quatrain):** The final stanza explicitly identifies the glass *as* the mind ("The glass becomes the mind, by its own light lit / Containing all it seeks to ascertain"). This collapses the "inside/outside" distinction entirely. The final two lines state the premise and conclusion side-by-side, unreconciled: the premise ("Here is the frame...") now points to the mind itself ("its own light lit"), while the conclusion ("Therefore, a world beyond...") tries to leap *from* the mind *to* an external world – a leap the poem has shown to be entirely circular and unsupported by the "evidence" presented within the system. The proof reveals itself to beg the question.
  *   **Tone:** Formal, unsentimental, focused on the act of perception and definition. The imagery (`polished plane`, `silhouette`, `mental stain`, `shifting thought ignited`, `doubt unseated`) conveys the abstract argument concretely without emotional resolution.
