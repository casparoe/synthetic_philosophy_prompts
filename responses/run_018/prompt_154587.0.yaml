answer: |-
  ### **Heatwave Relief: A Contractualist Deliberation Game**  
  **Goal:** Force participants to confront Scanlon's tension between individual justifiability and aggregation. No principle is adopted unless it can be justified to each person *first*, blocking aggregate calculations until unanimous buy-in.  

  ---

  ### **Scenario: Hotville Cooling Crisis**  
  **Context:**  
  - Extreme heatwave (45°C/113°F) hits Hotville.  
  - Only 10 portable AC units are available for 14 residents.  
  - **Rule:** Any allocation principle must be justifiable to *each* resident *before* considering aggregate outcomes.  
  - **Twist:** A "contractualist ceiling" caps the max heat burden (temp) any resident can be asked to endure. But the ceiling’s value requires *unanimous consent*.  

  ---

  ### **Materials**  
  1. **Role Cards (14):**  
     - Each card includes:  
       - **Resident profile** (name, vulnerability, hidden "reasonableness threshold" (RT)).  
       - **Secret instruction:** "Reject any principle/ceiling that exposes you to temps above your RT."  
     - **Example cards:**  
       - *Card 1:* "Ana, 82-year-old with heart disease. **Vulnerability:** Heat exposure >34°C risks cardiac arrest. **RT:** 34°C."  
       - *Card 2:* "Ben, construction worker with asthma. **Vulnerability:** Heat >38°C risks respiratory collapse. **RT:** 38°C."  
       - *Card 14:* "Zara, healthy athlete. **Vulnerability:** Heat >44°C risks heatstroke. **RT:** 44°C."  
       > *Design note:* RTs range from 34°C–44°C. Only 4 residents have RTs ≤36°C (high vulnerability), ensuring deadlock.  

  2. **Whiteboard Layout:**  
     ```  
     [ALLOCATION PRINCIPLES]      | [CONTRACTUALIST CEILING]  
     Principle 1: ___________     | Proposed Ceiling: ___°C  
     Rejected by: ___________     | Unanimous? ✅/❌  
     Reason: _______________     | Rejected by: _________  
     ```  

  3. **Reputation Tokens:**  
     - 2 types: **Golden Lightbulb** (best at public justification), **Silver Bridge** (best collaborator). Each participant gets one of each to award post-game.  

  ---

  ### **Game Rules & Timeline (90 Min Total)**  
  #### **Round 1: Propose Principles (15 min)**  
  - **Goal:** Brainstorm allocation principles (e.g., "prioritize lowest RT," "lottery," "rotate units hourly").  
  - **Rules:**  
    - Principles must be *general* (no names).  
    - **Whiteboard:** Facilitator lists all proposals.  
  - **Predictable Snag:** Participants will instinctively propose "save most lives" (aggregation). Intervene: "Justify to Zara (RT 44°C) why she should die to save four high-risk residents. Can she reasonably accept this?"  

  #### **Round 2: Reasonable Rejection Test (20 min)**  
  - **Goal:** Test each principle against individual justifiability.  
  - **Rules:**  
    - For each principle, residents publicly state: **"I reject this because [reason tied to vulnerability]."**  
    - *Example:* Ana (RT 34°C) rejects a lottery: "A random chance ignores my imminent risk of death."  
    - **Veto power:** One rejection kills the principle.  
  - **Facilitator Tool:** If no one rejects, press: "Ana, this principle might leave you in 45°C heat. Is that reasonable?"  
  - **Predictable Snag:** Participants hide behind "greater good." Restate: "Aggregation is banned until *all* accept the principle."  

  #### **Round 3: Ceiling Meta-Deadlock (20 min)**  
  - **Goal:** Set a unanimous "burden ceiling" (max temp any resident endures).  
  - **Rules:**  
    - Propose a ceiling (e.g., 38°C). All residents must consent.  
    - If passed, AC units go to residents with RT ≤ ceiling.  
    - **Twist:** If rejected, return to principles.  
  - **Whiteboard:** Track rejections and reasons.  
  - **Engineered Deadlock:**  
    - Low-RT residents (e.g., Ana) reject ceilings >34°C ("I’ll die!").  
    - High-RT residents (e.g., Zara) reject low ceilings ("Why protect only the weakest?").  
  - **Predictable Snag:** Someone suggests averaging RTs. Block: "Unanimous consent first. Zara, do you accept Ana dictating the ceiling?"  

  #### **Round 4: Aggregation Temptation & Collapse (10 min)**  
  - **Goal:** Highlight contractualism’s "wall" when aggregation seems inevitable.  
  - **Rules:**  
    - After 3 failed ceiling attempts, allow a 5-min open debate.  
    - Observe if participants "cheat" by tallying lives saved.  
  - **End State:** Deadlock persists. No solution is reached.  

  #### **Reputation Payoff (5 min)**  
  - Participants award tokens:  
    - **Golden Lightbulb:** To the resident who best justified rejections.  
    - **Silver Bridge:** To the most creative collaborator.  
  - **No stakes beyond peer recognition.**  

  ---

  ### **Debrief (20 min)**  
  **Map the Deadlocks to Scanlon:**  
  1. **"Justifiability to Each":**  
     - "Rejection wasn’t about selfishness—it was about *unreasonable burden* (e.g., Ana facing 45°C with a 34°C RT). Scanlon says principles must avoid imposing such burdens *even if* aggregate gains are huge."  
     - "When Ben (RT 38°C) rejected a lottery, did his reason feel like a personal whim or a claim others must acknowledge?"  

