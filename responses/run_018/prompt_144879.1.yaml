prompt: |-
  I just got out of a long and somewhat exhausting argument with a friend about David Lewis's account of convention and how social norms actually evolve, and I'm trying to write down exactly where I've landed to see whether the package holds together. Before I present this in a seminar discussion, I want a rigorous internal audit from someone who knows the terrain well.

  Here are my commitments, more or less as I defended them tonight: (1) I accept a broadly Lewisian framework—conventions are regularities in behavior that solve coordination problems, sustained by common knowledge (or at least mutual expectation) that others will conform, and they are arbitrary in the sense that an alternative regularity could have served the same coordinative function just as well. (2) I think evolutionary and learning-theoretic dynamics—specifically aspiration-level reinforcement learning rather than standard replicator dynamics—can fully explain how conventions stabilize over time, even when agents don't represent the coordination problem explicitly or possess full common knowledge of rationality. (3) I think linguistic conventions, especially syntactic ones, actually fail Lewis's arbitrariness condition: because compositional structure and learnability constraints create strong path dependence, alternative grammars aren't genuinely available equilibria, so language is not the clear paradigm case Lewis takes it to be. (4) I think conventions generate genuine deontic obligations—if there's a convention of queuing, you genuinely ought to queue—but these obligations are institutional rather than morally fundamental; they don't derive their normative force from morality but from the social structure itself. (5) I think unjust conventions—say, gendered divisions of domestic labor that coordinate household production but systematically disadvantage women—remain full-blooded conventions that generate obligations for participants, yet those obligations are systematically overridden by independent moral considerations, and this override doesn't dissolve the convention's status.

  As an expert philosopher with training in social ontology, decision theory, and the formal dynamics of norm evolution, please think carefully before answering. Start by brainstorming the logical structure: which commitments entail others, which motivations are doing double duty, and where hidden contradictions might live—especially whether I'm helping myself to something in (2) or (3) that undermines (1) or (4). Then deliver a formal audit: rank the tensions by severity, label each as genuine or only apparent, specify the cheapest revision for each, and say which single change would clean up the most problems. Be precise about philosophical distinctions without relying on citations or bibliographies. Please write your response in American English, using clear but formal language, and do not include reading lists or source references—I'm working without library access and want to know if the view hangs together on its own merits.
