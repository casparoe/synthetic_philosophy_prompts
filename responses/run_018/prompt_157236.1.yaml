  Now, are Peirce and James the same on truth? Definitely not. Peirce's truth is about the ideal consensus of the community of inquiry, while James is more individual and immediate. The analogy's collapse of utility into truth doesn't hold under scrutiny. The conclusion that pragmatism is just utility fails once these differences are clear.

