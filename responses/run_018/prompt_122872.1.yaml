prompt: |-
  Write a piece of sustained bureaucratic satire: a form letter from a government agency that has fully implemented content externalism and now adjudicates what its citizens' words and thoughts mean.

  The letter should be issued by something like the Office of Content Determination, Department of Environmental Reference, and addressed to an individual applicant whose file has been reviewed. Format it as an official memo: a letterhead with an agency title and a deadpan motto of your own invention, a "Re:" line, numbered sections, at least one bracketed field left for the clerk to fill in, and a footer with an appeals deadline. Maximum 550 words, not counting the header and footer.

  The comedy has to come from getting the externalism right, not from inventing a straw version of it. Work in, without ever lecturing or naming the view as a thesis:

  - the Twin Earth point that a molecule-for-molecule duplicate standing on a planet whose colourless, odourless drinkable liquid has a different microstructure is thinking a different thought, and that no amount of intracranial inspection could reveal this, so the agency's investigation consists of plumbing surveys, soil samples and expert panels rather than anything done to the applicant;
  - the Burge-style social case, in paraphrase: an applicant who sincerely applies a word to an ailment in a part of the body where that ailment cannot occur is ruled to have a false belief, not a different concept, because the reference was fixed for them by the community's experts;
  - the consequence that the agency, not the applicant, has the last word on what the applicant meant, and that an appeal is therefore decided by the same procedure being appealed;
  - and one hard case of the agency's own making: an applicant whose household liquid was swapped imperceptibly over roughly a decade, so that the agency must decide whether the applicant's term changed reference mid-life or the applicant silently acquired a new concept, with a fee schedule keyed to whichever ruling it reaches.

  Additional constraints: reach the famous slogan about meanings not being located in the head only in the agency's own administrative phrasing — do not quote anyone verbatim. Keep the tone flat, procedural and sympathetic throughout; no winking, no punchline that breaks character. A reader uneasy about externalism should feel why, without the letter ever saying so.
reasoning: |-
  Okay, the user wants me to write a bureaucratic satire letter based on content externalism. This is a philosophical concept where meaning depends on external factors rather than just internal thoughts. The letter needs to come from something like the Office of Content Determination, and it should satirize how a government agency might apply these ideas in practice.

  The key elements I need to include are:
  - The Twin Earth scenario (water/H2O vs. XYZ)
  - Burge's social externalism (community determines meaning)
  - Agency having final say on what applicants meant
  - A hard case involving a liquid swap over time
  - References to meanings not being "in the head" without directly quoting philosophers

  I think the user is looking for subtle humor that comes from taking these philosophical ideas to their bureaucratic extreme. The challenge is to make it deadpan serious while revealing the absurdity through the procedures themselves.

  For the structure, I'll create:
  - Official letterhead with a motto like "Securing Referential Clarity Since 1987"
  - "Re:" line with applicant details
  - Numbered sections detailing the investigation
  - Bracketed fields for clerk customization
  - Footer with appeals deadline

  The Twin Earth part can be handled through the agency's investigation methods - they're doing soil samples and plumbing surveys rather than examining the applicant. For Burge's point, I'll show how the agency overrules an applicant's self-reported meaning based on expert definitions. The hard case will involve that decade-long liquid swap scenario with different fee schedules depending on the ruling.

  I need to maintain a completely serious, procedural tone throughout. No winking at the reader. The satire should emerge from the logical extremes of applying externalism through bureaucratic processes. The unsettling aspect should come through in how the agency casually determines what people meant, regardless of their own understanding.

  The word count is tight at 550 words excluding headers, so I'll need to be concise while packing in all the required elements. The famous slogan about meanings not being in the head should appear only as bureaucratic phrasing like "semantic content is not exclusively intracranial."

  This should be a fun challenge - creating something that's technically correct about externalism while revealing its potential absurdities through the lens of government bureaucracy.
answer: |-
  **Office of Content Determination**  
  **Department of Environmental Reference**  
  *Securing Referential Clarity Since 1987*

  **Date:** [Current Date]  
  **File No.:** OCD/REF/2024/[File Number]  
  **Re:** Semantic Determination Application – Subject: "Water" Usage & Associated Beliefs (Applicant: [Applicant Name], Residence: [Applicant Address])

  Dear [Applicant Name],

  Thank you for your application concerning the semantic content of your utterances and attendant propositional attitudes regarding the liquid substance commonly referred to as "water" within your household environment over the period [Start Date] to [End Date]. This office has completed its review per Directive 7.1.3 (External Content Determination Protocols).

  **1. Investigation Summary & Methodology:**  
  Pursuant to established Content Determination Standards (CDS), semantic content is not exclusively intracranial. Our investigation therefore focused on the objective environmental and communal factors constitutive of meaning. Activities included:  
      a) Comprehensive plumbing system assay of your residence ([Date]), including source tracing and pipe material analysis.  
      b) Collection and microstructural analysis of liquid samples from your primary kitchen tap (3 locations), bathroom faucet, and external garden spigot ([Dates]).  
      c) Hydrogeological survey of the municipal water supply catchment zone serving your address ([Date Range]).  
      d) Consultation with the Designated Expert Panel (Chemistry & Hydrology) regarding liquid microstructure norms within your service area.  
      e) Review of communal linguistic practices via archived public health advisories, educational materials, and plumbing codes applicable to your locality during the relevant period.  
  No intracranial examination of the applicant was performed, as this is irrelevant to content determination.

  **2. Findings & Determinations:**  
      a) **Term Reference ("Water"):** Microstructural analysis confirms the liquid supplied to your residence during the entire period [Start Date] to [End Date] possesses the chemical signature H₂O. Therefore, the extension of the term "water" as used by you in all documented utterances refers exclusively to H₂O.  
      b) **Associated Belief:** Your documented statement, "I believe the pain in my [Specific Body Part, e.g., Elbow] is arthritis," dated [Statement Date], has been evaluated. Medical consensus (per Designated Expert Panel - Rheumatology) definitively states arthritis cannot manifest in the [Specific Body Part] cited. As your usage of "arthritis" is parasitic upon the established communal meaning fixed by expert practice, the belief expressed is determined to be *false* (Belief State: F), not indicative of a personal concept diverging from the standard extension.  
      c) **Hard Case Analysis (Liquid Composition Shift):** Analysis revealed your household supply shifted from Source A (H₂O) to Source B (H₂O) on approximately [Approximate Date, e.g., 10 Years Ago], due to municipal infrastructure changes. Both sources exhibit identical H₂O microstructure and macroscopic properties. **Determination:** No referential shift occurred. Your term "water" maintained an invariant reference to H₂O throughout. Consequently, no new concept was silently acquired; a single, stable concept persisted. Fee Schedule **B** (Standard Continuity Assessment: $[Amount]) applies. *(See Fee Schedule Explanation Sheet OCD/REF-FEE-4B attached).*

  **3. Outcome:**  
  Based on the externally determined semantic content:  
      *   Your utterances involving "water" successfully referred to H₂O.  
      *   Your belief concerning arthritis was in error (F).  
      *   Your conceptual repertoire regarding "water" demonstrates stable, community-aligned reference.  
  This constitutes a successful semantic alignment verification (Status: **Verified - Level 2**).

  **4. Next Steps:**  
  Your file reflects updated semantic attributions. No further action is required by you at this time regarding the terms adjudicated. Should you generate novel utterances concerning environmentally embedded referents requiring future determination, a new application (Form OCD/REF-114) will be necessary.

  **5. Appeals Process:**  
  If you disagree with this Office's determination of what you meant or believed, you may appeal. An appeal consists of a re-adjudication by this Office applying the identical Content Determination Standards (CDS) outlined in Section 1 to the original environmental and communal data set. Submit Form OCD/REF-APL-9 within **thirty (30) calendar days** of this notice. An appeal processing fee applies (See Fee Schedule Sheet OCD/REF-FEE-APL).

  We appreciate your cooperation in maintaining semantic standardization.

  Sincerely,

  [Signature]  
  [Typed Name]  
  Case Officer, Office of Content Determination  
  Department of Environmental Reference  

  ---

  **APPEAL DEADLINE: [Current Date + 30 Days]**  
  **Failure to appeal within this period constitutes acceptance of this determination as final.**
