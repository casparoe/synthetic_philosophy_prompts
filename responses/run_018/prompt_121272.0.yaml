  ## Charlottesville as a Lens on Comparative Memory Cultures: Vergangenheitsbewältigung Tested

  The 2017 Charlottesville rally, ignited by the proposed removal of the Robert E. Lee statue, serves as a stark case study contrasting global approaches to confronting difficult pasts. Mapping key memory frameworks onto the actors reveals both potential parallels and fundamental incompatibilities, particularly concerning the applicability of Germany's **Vergangenheitsbewältigung** (working-through-the-past).

  **Mapping the Frameworks onto Charlottesville:**

  1.  **The Lost Cause Mythology (American South Context):**
      *   **Perpetrator-Group:** The Confederate States, Southern elites, and later, organisations like the United Daughters of the Confederacy (UDC) who actively propagated the myth.
      *   **"Working-Through" vs. Denial:** The Lost Cause *is* the denial mechanism. It asserts the Confederacy fought honourably for "states' rights," downplays or denies slavery's centrality, romanticises figures like Lee, and portrays Reconstruction as oppressive. Charlottesville's white supremacists explicitly invoked this mythology ("You will not replace us," defending Lee's "heritage"). Their actions were a violent defence of this denialist narrative.
      *   **State Response:** Historically, Southern state governments actively endorsed and funded Lost Cause memorialisation (like the Lee statue itself). Post-Charlottesville, responses were fractured: the local council pushed for removal (countering the myth), while federal leadership (Trump) equivocated, echoing Lost Cause tropes ("very fine people on both sides").

  2.  **Germany's Vergangenheitsbewältigung:**
      *   **Perpetrator-Group:** Nazi Germany, its institutions, and active participants in genocide and war crimes.
      *   **Working-Through:** Involves active, state-led processes: legal accountability (Nuremberg), reparations, institutional reform, exhaustive education, memorialisation focused on victims, and public discourse relentlessly confronting guilt and responsibility. Denial is legally and socially marginalised.
      *   **Relevance to Charlottesville:** The counter-protesters demanding Lee's removal embodied the *impulse* of Vergangenheitsbewältigung – challenging public glorification of a figure representing a racist, treasonous regime. Removal itself is a symbolic act of rejecting denial. However, the **absence of a decisive "Stunde Null" (zero hour) or comprehensive transitional justice** is critical. The US lacked an equivalent to Nuremberg for Confederate leaders or systemic denazification. Slavery and Jim Crow were never confronted with Germany's institutional rigour. This makes the German model seem alien, as the foundational societal and legal rupture is missing. The perpetrator-group (slaveholders, Confederates) was largely rehabilitated post-1865, allowing the Lost Cause to flourish.

  3.  **Japan's Ambivalent Post-War Silence:**
      *   **Perpetrator-Group:** Imperial Japan, particularly the military and state apparatus responsible for wartime atrocities (e.g., Nanking, comfort women).
      *   **Working-Through vs. Denial:** Characterised by state-driven silence, minimisation, and avoidance of direct responsibility, particularly concerning specific war crimes and colonial aggression. Textbook controversies and political statements often reflect denialist tendencies, though civil society challenges exist.
      *   **Relevance to Charlottesville:** The decades-long official tolerance of Confederate symbols, the integration of Lost Cause narratives into school curricula in some regions, and the initial reluctance of many institutions to remove statues mirror Japan's avoidance. The "heritage not hate" defence functions similarly to Japanese narratives focusing on national sacrifice while obscuring victimisation. Trump's equivocation echoed the Japanese state's reluctance to fully condemn its past actors.

  4.  **Turkey's State-Backed Denial (Armenian Genocide):**
      *   **Perpetrator-Group:** The Ottoman government (Committee of Union and Progress) responsible for the Armenian Genocide.
      *   **Working-Through vs. Denial:** Active, state-enforced denial of the genocide, criminalisation of acknowledgement within Turkey, promotion of counter-narratives blaming victims or dismissing events as wartime casualties.
      *   **Relevance to Charlottesville:** The most direct parallel is in the rhetoric and ideology of the white supremacist rally participants themselves. Their explicit racism, anti-Semitism, and chants denying historical realities (e.g., replacement theory) mirrored the aggressive denialism championed by the Turkish state. While not official US policy, this *perpetrator-group mentality* was violently present. Some political rhetoric defending Confederate symbols ("erasing history") employs similar logic to Turkish denial, framing acknowledgment as an attack on national identity.

  **What Charlottesville Reveals about Vergangenheitsbewältigung's Travel:**

  Charlottesville demonstrates that the **core principles of Vergangenheitsbewältigung – confronting historical truth, assigning responsibility, dismantling celebratory perpetrator narratives, centring victims, and institutionalising remembrance – possess universal moral weight.** The demand for Lee's removal was fundamentally an appeal to these principles.

  However, the episode starkly reveals that **Vergangenheitsbewältigung cannot be mechanically transplanted.** Its effectiveness in Germany stemmed from unique, brutal catalysts:

  1.  **Total Military Defeat & Occupation:** Forced societal rupture.
  2.  **Overwhelming, Undeniable Crimes:** The scale and nature of the Holocaust created moral clarity (however hard-won).
  3.  **External Imposition & Sustained Pressure:** Allied powers mandated initial denazification.
  4.  **Clear Perpetrator/Victim Demarcation (Post-Holocaust):** Though complex, the Nazi state was the unambiguous aggressor in WWII and the Holocaust.

  **The US Comparison Breaks Down:**

  *   **No Clean Rupture:** The Civil War ended with reconciliation (at the expense of racial justice) and no widespread reckoning with slavery's legacy or Confederate treason. The perpetrator group was reintegrated.
  *   **Enduring Power of the Denialist Narrative:** The Lost Cause was not externally imposed denial but *internally generated and sustained* for over a century, becoming deeply embedded in regional identity and power structures. It faced no equivalent to Germany's sustained, multi-generational state-led dismantling.
  *   **Lack of Transitional Justice:** No truth commission, no property confiscation from slaveholders (beyond immediate emancipation), no ban on Confederate symbols or ideologies equivalent to banning Nazi symbols. The absence of this foundational moment means the "past" was never juridically or institutionally settled; it remained contested terrain.
  *   **Diffuse Perpetration & Enduring Structures:** Slavery's legacy permeates American structures (systemic racism, wealth gaps) in ways less easily pinpointed than a single defeated regime. This complicates assigning responsibility compared to the Nazi state apparatus.

  **Conclusion:**

  Charlottesville exposes Vergangenheitsbewältigung not as irrelevant, but as **misapplied if viewed as a ready-made template.** The German model highlights the *necessity* of the processes Charlottesville protestors demanded: dismantling symbols of racist oppression and confronting historical truth. However, the **absence of a decisive transitional justice moment and the century-long entrenchment of the denialist Lost Cause narrative** create a fundamentally different landscape. Vergangenheitsbewältigung's principles remain aspirational guides for confronting systemic injustice rooted in history. Yet, applying them requires acknowledging the unique obstacles: a past never truly "defeated," a powerful homegrown mythology of denial, and a state that has historically oscillated between avoidance and complicity, rather than committed leadership towards accountability. True "working-through" in the American context demands confronting *why* that transitional moment was absent and how to build accountability without its foundational catalyst.
