  ok so i just finished this exhausting 3-hour arguement with my roomate about some epistemology we're covering in my philosphy of mind class. we got onto williamson's anti-luminosity argument — the idea that conditions like feeling cold aren't luminous because if you know you're cold there's a margin for error that sets up a sorites-style slide. my roomate insists the whole thing collapses if you reject the KK principle, since without knowing-that-you-know there's no chain to drive the paradox. i tried telling him luminosity is about being in a position to know your mental state, not about second-order knowledge, but he said that's just splitting hairs.

  anyway, since i already think KK is false (it just feels wrong that knowing i'm tired automatically means i know i know it), doesn't that automatically save luminosity? like, if the argument needs KK and i deny KK, what's left to threaten the idea that i can always know when i'm cold? can someone lay out the actual distinction so i can stop losing this debate?

  i was also thinking maybe there's a version where luminosity only applies to phenomenal states but not to borderline cases, but then my roomate said that's just ad hoc. idk, maybe i'm missing something obvious about how the margin-for-error principle works independently of any transparency claim about knowledge. if anyone can untangle whether KK denial actually blocks the sorites or if these are just totally seperate issues, that'd be amazing.
