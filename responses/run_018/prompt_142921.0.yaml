prompt: |-
  I'm writing this after a session in my seminar on intergenerational justice and climate ethics, where we spent considerable time on Parfit's non-identity problem and its implications for long-term carbon policy. The instructor kept emphasizing that if our emissions help determine who will exist in the distant future, then we cannot wrong specific individuals by choosing a high-emission path, because those very individuals owe their existence to that choice. I understand that point, but I think I've noticed a further wrinkle that wasn't fully addressed in our discussion, and I'm unsure whether it carries an established label in the literature.

  Consider two climate stabilization pathways—say, a rapid decarbonization trajectory and a delayed mitigation trajectory—that produce radically different global conditions by 2300. Under each pathway, a different set of people comes to exist, differing not only in identity but in demographic scale and in the spatial distribution of welfare. Now suppose we apply a person-affecting criterion of justice: every future person must have access to some minimal ecological baseline, such as stable freshwater availability or a habitable temperature range. Under both pathways, every actual person meets that baseline—there is no one who falls below it and who could have been above it in the other world. Nevertheless, the delayed pathway might generate a vastly larger population, with a much greater proportion living close to the baseline threshold, whereas the rapid pathway produces a smaller population with more secure surplus. The standard non-identity framing tells us we haven't harmed anyone in particular, but it doesn't seem to capture why we might still regard the delayed pathway as distributively inferior, or why indexing the baseline itself to world-dependent conditions feels conceptually slippery. Is there an established concept—perhaps distinct from the non-identity problem, from the repugnant conclusion, or from simple aggregation—that describes precisely this configuration: a person-affecting threshold applied across non-identical populations, where no individual is made worse off relative to counterfactual non-existence, yet the structural relation between population size and baseline proximity generates a normative asymmetry? If so, how is it formally distinguished from those nearby ideas; and if not, what would be the clearest way to define its boundaries?
reasoning: |-
  Okay, let me unpack this user's query. They're coming out of a seminar on intergenerational justice and climate ethics, specifically discussing Parfit's non-identity problem. The user grasps the core idea that high-emission pathways don't wrong specific individuals since those individuals wouldn't exist otherwise. But they've noticed a nuance: even when all individuals meet a minimal ecological baseline across different pathways, the distribution differs—delayed mitigation leads to a larger population closer to the baseline, while rapid decarbonization results in a smaller, more secure population. 

  The user is asking if there's a named concept for this scenario where no individual is harmed relative to non-existence, yet the structural relationship between population size and baseline proximity creates a normative concern. They want to distinguish this from the non-identity problem, the repugnant conclusion, and simple aggregation.

  First, I recall that the non-identity problem itself doesn't address this distributive asymmetry. The repugnant conclusion involves comparing populations where one is large with minimal welfare, but here the baseline is fixed, not relative. The user's case has every individual above the threshold, so it's not about minimal welfare but proximity to it.

  I think of "Level Sufficiency" from sufficientarian theories. Sufficientarianism focuses on ensuring everyone meets a threshold, but when populations differ, the value above the threshold might matter less. The user's point is that having more people near the baseline might be worse than fewer people farther above it, even if all are above sufficiency. This connects to "Scope Insufficiency Critique"—where sufficientarianism ignores above-threshold welfare.

  Another angle is "Demographic Composition." The delayed pathway creates a demographic pattern where more people are vulnerable. Climate policy choices here shape future population structures, leading to higher aggregate vulnerability. This isn't captured by individual harm but by systemic risk.

  "Vulnerability Lock-in" also comes to mind. Choosing delayed mitigation commits future generations to ecological conditions that force populations to cluster near thresholds, increasing systemic fragility. This is a structural harm beyond individual claims.

  The user might also be hinting at the non-fungibility of ecological thresholds. If the baseline is tied to specific resources (like freshwater), its availability might be world-dependent. Rapid decarbonization might preserve buffer zones above the baseline, adding resilience that's lost in delayed pathways.

  I need to ensure these concepts are distinguished. Level Sufficiency vs. Scope Insufficiency deals with the threshold's adequacy. Demographic Composition focuses on population distribution. Vulnerability Lock-in emphasizes path dependency. Non-Fungibility of Thresholds addresses how baselines are context-dependent.

  The user's deeper need might be to articulate a normative framework that accounts for these structural features without violating person-affecting constraints. They might seek literature that bridges sufficientarianism with population ethics or systemic risk in climate policy. Pointing them to "state sufficientarianism" or "ecological space" approaches could help. Also, suggesting terms like "structural demographic risk" or "vulnerability footprint" might formalize their insight.
answer: |-
  Your insight cuts to a fundamental tension in population ethics applied to climate policy, and you've identified a configuration that *combines* established concepts but lacks a single universal label. The clearest way to characterize it is as **"Sufficientarianism Confronting Non-Identity and Demographic Composition."** Here's the breakdown and relevant frameworks:

  ### Core Components & Distinctions
  1.  **Person-Affecting Sufficientarianism:** You're applying a threshold-based theory of justice (sufficientarianism). The core claim is that justice requires ensuring individuals meet a baseline (e.g., ecological security). Crucially, sufficientarianism is often *comparatively insensitive* to welfare *above* the threshold and to the *number* of people above it.

  2.  **The Non-Identity Problem:** As you note, this prevents claims that any *specific individual* in the delayed-pathway world is harmed/wronged *compared to their non-existence*. Standard harm-based or rights-based individual complaints fail.

  3.  **Demographic Composition & Scale:** This is your key addition. The *structural consequence* of the choice is a future world with:
      *   A **larger total population** (delayed pathway).
      *   A **larger absolute number** of people living near the threshold (even if proportionally similar).
      *   A **higher proportion** of the population living near the threshold (if the surplus is smaller per capita).
      *   **Increased systemic vulnerability:** A population clustered near the baseline is more fragile to unforeseen shocks (disease, minor climate deviations, resource conflicts) than a population with a larger buffer.

  4.  **Distinction from the Repugnant Conclusion:**
      *   The Repugnant Conclusion (RC) involves comparing a small population with very high welfare to a vast population with lives barely worth living *above zero*.
      *   **Your scenario differs:** The baseline is an *ecological minimum* (e.g., "habitable"), likely significantly *above* the "barely worth living" level of the RC. Importantly, *no one falls below this minimum* in either scenario. The concern isn't lives near *zero*, but lives near the *sufficiency threshold itself*. It's about **proximity to insufficiency**, not proximity to a life not worth starting.

  5.  **Distinction from Simple Aggregation:**
      *   Total or Average Utilitarianism would likely favor the larger population only if total/average welfare is higher, which isn't guaranteed here (it might be lower per capita).
      *   Your concern is **structural and risk-based**, not primarily about summing welfare. It's about the *distribution relative to a vital threshold* and the resulting *fragility* of the future society.

  ### Established Concepts Addressing Aspects of Your Wrinkle

  1.  **The "Level" of Sufficiency & the "Scope Insufficiency" Critique:**
      *   Your issue highlights a debate within sufficientarianism: **How high should the threshold be set?** Setting it at a bare minimum ("habitable") seems inadequate if it leads to vast populations just above it. This connects to critiques that sufficientarianism ignores important values *above* the threshold (e.g., flourishing, security buffers).
      *   **"Scope Insufficiency":** This term (sometimes used critically) refers to sufficientarianism's potential failure to value reductions in the *number* of people living near the threshold or increases in welfare above it. Your delayed mitigation pathway exemplifies this.

  2.  **"Vulnerability Lock-in" or "Structural Demographic Risk":**
      *   Climate ethics literature increasingly focuses on how present choices **lock in future vulnerabilities**. Choosing the delayed pathway doesn't just create different people; it creates a demographic *structure* inherently more vulnerable to disruption. This is a **systemic harm** to the future *collective*, even if not an individual harm. (Terms like "risk imposition on populations" or "creating fragile demographic structures" capture this, but no single dominant label exists).

  3.  **"Non-Fungibility of Ecological Thresholds":**
      *   Your point about the "slipperiness" of indexing the baseline touches on how ecological minima (like freshwater access) are *context-dependent* and *non-fungible*. A world with depleted resources might technically meet a "minimum litres/person" threshold, but the *margin of safety*, *buffer against variability*, and *quality of access* could be drastically worse than in a world with abundant resources. Meeting the *letter* of a quantitative baseline doesn't guarantee meeting its *spirit* of genuine security and opportunity.

  4.  **State Sufficientarianism & Ecological Space:**
      *   Some sufficientarian approaches focus on the **state of the world** (e.g., maintaining ecological systems above certain thresholds) rather than just individual welfare. A delayed pathway might violate *state sufficientarianism* by pushing key ecosystems closer to collapse points, creating a world where *maintaining* individual sufficiency for the larger population is perpetually precarious. Related concepts like "safe ecological space" or "planetary boundaries" emphasize this systemic view.

  ### The Clearest Characterization & Boundaries

  Your scenario is best described as: **The problem of "Structural Demographic Vulnerability under Person-Affecting Sufficientarianism in Non-Identity Contexts."**

  *   **Formal Boundaries:**
      1.  **Person-Affecting Constraint:** Justice claims must be grounded in effects on actual individuals (ruling out impersonal "better world" claims).
      2.  **Sufficiency Threshold:** A defined minimum level of welfare/ecological access must be met for justice.
      3.  **Non-Identity Condition:** Different choices causally determine the identity and number of future people.
      4.  **Threshold Met Universally:** All individuals in all compared futures meet the sufficiency threshold.
      5.  **Normative Asymmetry Source:** The asymmetry arises from the *demographic composition* – specifically, the *size of the population* and their *proximity to the sufficiency threshold*, leading to greater aggregate vulnerability and reduced resilience for the collective in one future compared to the other. The concern is about the *fragility of the sufficient state*.

  ### Why This Matters in Climate Ethics
  Your "wrinkle" highlights a crucial limitation of purely individualistic, harm-based approaches to intergenerational climate justice. While the non-identity problem blocks claims of individual harm, **choices today can still create future worlds that are *structurally more precarious* – with larger populations living closer to ecological edges.** This creates a **distinct wrong of imposing systemic fragility and heightened risk on future societies**, even if no specific future individual can claim they were personally made worse off than they would otherwise have been. This argues for incorporating concepts of **demographic risk, systemic vulnerability, and the robustness of meeting sufficiency** into climate policy evaluation, moving beyond strict individualism and simple aggregation. Scholars like Simon Caney, Catriona McKinnon, and Axel Gosseries grapple with related aspects, though your precise configuration remains a potent challenge demanding further conceptual refinement.
