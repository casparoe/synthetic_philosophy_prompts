  > **"What must be shown is... constitutive of the hinge’s holding... no gap between our going on and the hinge being in place."**  
  ✅ Strong: Clarifies constitutive role. Gains 1/1.5.  
  *Charitable reading: "holding" = metaphysical grounding. Accepted.*  

  > **"If the reply offered... collapse into bootstrapping... idle-hinge objection."**  
  ✅ Excellent diagnosis of epistemic circularity risk. Gains 1.5/1.5.  

  > **"Could a cross-cutting hinge be lost? I think not."**  
  ❌ **FATAL ERROR**: Contradicts river-bed shift. No erosion claim ignores stipulated analogy. Deduct 2/2.  

  > **"No possible experience could dislodge it... no change... could displace it."**  
