   Subject: Recommendation on Honorary Degree for Dr. Elena Vasquez

   Hey team,

   After a tough deliberation on the Vasquez nomination, I'm drafting this to outline our committee's position. We've reviewed the materials, the student protests, and the arguments from both sides.

   The students have a powerful point: honoring Dr. Vasquez, given her role in Project Sentinel, could be seen as endorsing a chain of events that led to civilian deaths. They invoke Anscombe's protest against Truman – that even if the intent was just (ending war), the means (atomic bombs) caused indiscriminate destruction. Here, the algorithm designed by Vasquez's team became the means that resulted in 47 civilian deaths. The students argue that by giving her our highest honor, we become complicit in that outcome, however indirectly.

   On the flip side, the argument about double-effect is strong: Vasquez was working to protect soldiers and civilians by developing precise targeting. The civilian deaths were a tragic accident, not her goal. And as one board member put it, we don't blame engineers for bridge collapses if they followed best practices.

   But here's where we land: The bridge analogy doesn't quite hold. Bridges don't autonomously decide to collapse; they fail due to natural forces or unanticipated stresses. In contrast, the algorithm Vasquez led was designed to make kill decisions without real-time human oversight. The agency was baked into the code. And when that agency results in civilian deaths, the moral responsibility doesn't vanish – it's distributed, but not erased. The committee feels that honoring her now, without a full reckoning of that responsibility, would send a message that we value technological innovation over the ethical reflection that must accompany it.

   So, we're recommending that the committee reject the nomination at next month's vote. We don't take this lightly – Vasquez is undoubtedly accomplished. But the university's commitment to moral responsibility must be paramount.

   We propose that we revisit the issue in two years, pending Dr. Vasquez's continued engagement with the ethical implications of her work and a broader societal conversation on autonomous weapons. Maybe then we can have a clearer view.

