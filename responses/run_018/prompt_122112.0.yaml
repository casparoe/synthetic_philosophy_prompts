  **MEMORANDUM**  
  TO: Honorary Degrees Committee  
  FROM: [Your Name], Committee Member  
  DATE: May 23, 2024  
  SUBJECT: Rec for Dr. Elena Vasquez Honorary Degree  

  Hey folks — rough one here. After chewing over the Vasquez nomination, student protests, and the Truman/Anscombe parallels, here’s where I net out.  

  **The Core Tension:**  
  Students aren’t just yelling — they’ve got a philosophically meaty argument. Invoking Anscombe, they claim honoring Vasquez makes us *complicit* in civilian deaths because her algorithms weren’t neutral tools; they actively buried human agency under code. Even if she never touched a drone, designing systems that *autonomously* execute lethal force (and failed catastrophically) crosses a line. Honoring her, to them, launders moral responsibility.  

  **The Strongest Counter (and why it wobbles):**  
  The "double-effect" defense — that Vasquez intended combatant targeting, civilians were unintended, and she’s no more blameworthy than a bridge engineer — is compelling *in theory*. But bridges don’t autonomously choose *which cars* to crush. Sentinel’s algorithms *made* lethal decisions absent human judgment. That’s not accidental collateral damage; it’s agency delegated to code. The engineer analogy collapses because Vasquez’s work removed human oversight from the kill chain. We can’t handwave that with “unintended effects.”  

  **Recommendation: Reject**  
  Vote NO next month (June 15 deadline). Why? Not because Vasquez is “guilty,” but because awarding her trivializes the protest’s central point: **When tech obscures moral agency, institutions must draw brighter lines.** Honorary degrees signal institutional values. Giving this to Vasquez — without her publicly grappling with the *moral* (not just technical) failures of Sentinel — risks making us look deaf to how tech ethics have evolved since 2022.  

  **But—**  
  If she engages deeply with critics (e.g., a public forum on algorithmic accountability co-hosted by protesting students), we reconsider in 2026. Not a “condition” — just a path back.  

  **Vote Timeline:**  
  - **June 10:** Final committee debate (invite student rep to brief us).  
  - **June 15:** Binding vote.  

  This sucks — Vasquez is brilliant, and the double-effect argument *is* logical. But logic isn’t the whole game. Universities exist to question power, not rubber-stamp systems that outsource life/death calls to black boxes. If we honor her now, we’re ignoring how tech complicity works in 2024.  

  Let’s chat Tuesday? I’ll buy coffee.  

