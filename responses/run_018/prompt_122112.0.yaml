   On the other side: Board members argue that this misapplies double-effect reasoning. Vasquez intended to target combatants, and civilian deaths were unintended. They say she's no more culpable than an engineer who designs a bridge that later collapses.

   We must draft a memo that recommends either:
     - Approve
     - Reject
     - Approve with conditions

   We must engage the strongest argument from the losing side seriously.

