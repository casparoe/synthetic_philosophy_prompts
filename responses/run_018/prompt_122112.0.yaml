  We are drafting a memo for the honorary degrees committee at a mid-size public university.
   The scenario: We are considering awarding an honorary doctorate to Dr. Elena Vasquez, who led the targeting-algorithm division for Project Sentinel. The program was involved in an autonomous drone strike that accidentally killed 47 civilians in 2022.
