prompt: |-
  I keep tripping over the same puzzle when people argue about whether someone's inaction was a cause, and I don't know wether there's a term for it. A lifeguard and a tourist both watch the same swimmer drown and neither moves; everyone says the lifeguard caused the death by not acting, but nobody says the tourist caused it. Both did exactly the same nothing, so the difference can't be in the non-action itself — it's in some background expectation about what each was supposed to do. But then I noticed that expectation can be changed while the non-action and outcome stay fixed: a doctor who doesn't give a drug is said to have caused a death when the drug is standard and almost always works, but not when the drug is experimental and almost never works. Same failure, same outcome, different causal verdict. I'm less after a label than an account: is the norm or comparison case doing real causal work, or is it only doing blame work? Should the two doctor cases really differ causally, or is that ordinary speech being sloppy? And please tell me how confident you are in each part, and which claim you're least sure of.
reasoning: |-
  Okay, the user is really wrestling with a philosophical puzzle about causation and inaction. They've noticed this pattern where identical inactions (like not saving a drowning swimmer) get labeled differently based on who failed to act - a lifeguard versus a tourist. And then they extend it to doctors withholding standard versus experimental treatments. 

  Hmm, what's really clever here is how they isolate the variables: same physical non-action, same outcome, only the normative expectations change. That's sharp observation. They're not just asking for terminology - they want to know whether the difference is truly causal or just about blame. 

  The lifeguard example is classic. Everyone intuitively gets why we blame the lifeguard more, but is that causal difference or moral difference? Then the medical variation shows it's not about professional roles per se - when the drug is experimental, we don't say the doctor caused the death by not giving it. 

  I should be careful not to oversimplify. This taps into huge debates in philosophy of action - Davidson's "Events as Particulars", Hart and Honoré's work on causation in law, maybe even counterfactual theories like Lewis. But the user wants clarity, not name-dropping. 

  Key points to address: 
  First, the physical absence of action is identical in both cases - no muscle movements occurred from either person. So if causation requires physical difference, there shouldn't be a distinction. 

  But causation isn't just physics - it's about how we map events to explanations. The lifeguard's job creates a salient "possible world" where they jump in and save the swimmer, while the tourist's inaction doesn't create that alternative scenario in our minds. 

  Ah, and the medical example proves it's not about capability (both doctors could administer drugs) but about statistical norms. When a standard treatment exists, its absence becomes a "but-for" cause; when treatment is experimental, we attribute death to the disease. 

  Where I'm least confident: is this really about causation, or is it that "cause" in ordinary language smuggles in normative judgments? Maybe we should strictly separate causation (physics) from responsibility (ethics). But that feels artificial - our causal explanations are always contextual. 

  The user seems analytically minded - they'll appreciate me acknowledging that uncertainty. I'll flag it as the shakiest part of my response.
answer: |-
  This is a profound puzzle at the intersection of philosophy (especially causation and ethics), law (duty of care), and language. Here's a breakdown of the core concepts and an account of what's happening, with confidence levels:

  ### The Core Account: Normative Salience & Counterfactual Dependence
  1.  **The "Cause" vs. "Merely Allow" Distinction (Confidence: High):** Ordinary language often distinguishes between *causing* an outcome and *merely allowing* it to happen. Both involve inaction, but the lifeguard's inaction *causes* the death, while the tourist's inaction *allows* it. The doctor withholding a standard drug *causes* the death; withholding an experimental drug *allows* it.
  2.  **The Role of Normative Expectations (Confidence: High):** The difference isn't in the physical non-action itself, but in the **normative context** surrounding the agent. This context includes:
      *   **Duties/Obligations:** Lifeguards have a contractual/social duty to save swimmers; doctors have a duty to provide standard care. Tourists generally have no such duty regarding strangers; using experimental treatments isn't a standard duty.
      *   **Reasonable Expectations:** We reasonably expect a lifeguard/doctor to act in specific ways. We don't reasonably expect a random tourist to jump in or a doctor to use ineffective treatments.
      *   **Salient Counterfactuals:** Norms make specific *counterfactual scenarios* mentally salient. We vividly imagine the lifeguard jumping in and saving the swimmer (a highly probable outcome *if* they acted). We vividly imagine the doctor administering the standard drug and saving the patient (a highly probable outcome). We don't vividly imagine the tourist saving the swimmer (it's less probable or expected) or the doctor administering the experimental drug saving the patient (it's improbable).
  3.  **Causal Relevance of Norms (Confidence: Moderate-High):** Norms aren't *directly* doing causal work in the physical chain of events. The swimmer drowned because water entered their lungs, not because the lifeguard lacked a duty. **However, norms determine *which omissions we count as causally relevant*.** They filter the near-infinite background conditions to identify the *salient* absence that made the crucial difference *relative to what should have happened*.
      *   **In the standard drug case:** The doctor's failure to administer the drug is a salient deviation from the norm. We judge that *but for* this deviation (this specific omission violating the norm), the patient *likely* would have lived. The omission is a but-for cause in the salient counterfactual scenario.
      *   **In the experimental drug case:** Administering the drug wasn't the norm. The patient's death is overwhelmingly attributable to the disease itself. The doctor's omission isn't a salient deviation; *but for* this omission, the patient *still likely* would have died. The omission isn't the salient but-for cause.
  4.  **Is it "Real" Causation or Just Blame? (Confidence: Moderate - this is the trickiest part):**
      *   **Pure Physical Causation (Strict View):** If causation is *only* about energy transfer, physical forces, and necessary/sufficient conditions in the actual world sequence, then neither omission is a physical cause. Death was caused by water inhalation/disease processes. The omissions are absences, not positive forces. In this strict sense, ordinary language *is* being "sloppy" by calling omissions "causes." (Confidence in this *description* of the strict view: High; Confidence that it fully captures ordinary usage: Low).
      *   **Causation as Explanation/Responsibility (Broad View):** Causation in ordinary language and law is often about **explaining deviations from normal or expected courses of events** and assigning **responsibility**. Here, norms are doing *essential* causal-explanatory work:
          *   They define the "normal course" (lifeguard saves, doctor gives standard drug).
          *   They highlight the omission as the *abnormal* factor that explains why the expected good outcome *didn't* occur.
          *   This makes the omission a "cause" in the sense of being the *explanatorily relevant factor* that made the difference between the expected outcome and the actual bad outcome.
      *   **Verdict:** Norms are doing **real causal work *within our explanatory frameworks*.** They aren't just about *blame* (though blame often follows), but about identifying the *difference-maker* relative to a baseline expectation. Calling the lifeguard/standard-drug-doctor's omission a "cause" isn't purely sloppy; it reflects a sophisticated understanding of how expectations shape our identification of causally relevant factors. However, it *does* blur the line between pure physical causation and explanatory/pragmatic causation.

  ### Addressing Your Specific Questions
  1.  **Is the norm/comparison case doing real causal work, or only blame work?**
      *   **Primarily causal-explanatory work.** Norms define the baseline scenario against which we identify *deviations* that explain the outcome. Blame *follows* from identifying a norm-violating omission as a causally relevant factor. The causal identification comes first in the reasoning. (Confidence: Moderate-High).
  2.  **Should the two doctor cases really differ causally?**
      *   **Within the explanatory framework shaped by norms, yes.** In the standard drug case, the omission is the salient, abnormal factor that likely made the difference between life and death. In the experimental case, the omission isn't salient or abnormal; the disease remains the dominant explanatory factor. A purely physical description might see no difference, but a meaningful causal explanation *requires* the normative context to identify the relevant factor. (Confidence: High that this *is how we reason*; Moderate on whether this *must* be the case in all philosophical frameworks).
  3.  **Is ordinary speech being sloppy?**
      *   **Not entirely, but it's context-dependent.** Ordinary language efficiently incorporates normative expectations into causal claims because they are often essential for understanding *why* an event happened *in the way that matters to us*. Calling an omission a "cause" signals its status as a norm-violating, difference-making absence. It would be impractical to always say "the norm-violating omission that was a but-for cause in the expected counterfactual scenario." However, this usage *can* lead to confusion in philosophical or legal contexts demanding more precision about physical vs. explanatory causation. (Confidence: High).

  ### Least Confident Claim
  My **least confident claim** is the precise boundary between "explanatory/pragmatic causation incorporating norms" and "just blame/ethics dressed up as causation." While I'm confident norms do genuine *explanatory* work in identifying salient difference-makers, the line between that and purely moral attribution can be incredibly thin, especially in borderline cases (e.g., was the duty *clear*? Was the counterfactual outcome *truly* probable?). Some philosophers argue that once the explanatory role is acknowledged, the remaining "cause" label *is* purely about responsibility/blame. I lean towards the explanatory role being primary, but acknowledge the significant overlap and potential for conflation. (Confidence in the *existence* of this grey area: High; Confidence in *precisely* delineating it: Low).

  **In essence:** The difference lies in the **normative context** (duties, expectations) defining a **salient counterfactual scenario** (what *should* have happened). This makes the omission a **salient but-for cause** relative to that expected scenario, hence we label it a "cause." This is a robust feature of human reasoning and language, not mere sloppiness, though it operates differently from a strict physics-based notion of causation.
