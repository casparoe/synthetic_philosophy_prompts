  ## Proposal: Computational Intractability as a Meta-Normative Challenge in Ethical Theory

  **1. Research Question & Core Thesis:**  
  Does the *inherent computational complexity* (specifically, parameterized complexity and membership in tractability classes like P, FPT, or NP-hard) of a normative decision procedure undermine its plausibility as a valid ethical theory, independent of human cognitive limitations? Specifically:  
  *   To what extent does a theory's demand for solving an intractable problem (e.g., NP-hard) constitute a *self-defeating* feature by making the "right answer" fundamentally inaccessible, even to an idealized agent?  
  *   Can parameterized tractability (e.g., FPT in the number of agents) or bounded-error approximation algorithms rescue the normative authority of such theories by providing tractable access to "approximately just" outcomes?  

  **2. Gap in Existing Literature:**  
  Philosophical discussions on computation and ethics (e.g., bounded rationality, computational constraints on moral agents) overwhelmingly focus on the *agent's limited capacity* to compute a prescribed solution. This assumes the normative theory itself specifies a well-defined, *in principle computable* "correct" answer. My project challenges this assumption. It investigates whether the *formal specification* of the theory’s required computation can be intrinsically intractable (e.g., NP-hard), rendering the "correct" answer inaccessible *even in principle* within feasible time/space, regardless of agent capabilities. This shifts the critique from the *agent’s failure to compute* to the *theory’s failure to specify a feasibly computable norm*. Existing philosophy of computation neglects this meta-normative challenge posed by the theory's own formal structure.

  **3. Methodology & Plan (3 Months):**  
  Leveraging basic formal logic and guided by established concepts in computational complexity theory (utilizing standard references/textbooks, not deriving novel complexity results), the project will:

  *   **Month 1: Formalization & Toy Models:**  
      *   **Weeks 1-2:** Precisely formalize two contrasting "toy" normative procedures representative of broader ethical frameworks:  
          *   **Model A (Aggregative):** A simplified social welfare function requiring a complete ranking of all feasible social states based on aggregated individual preferences (e.g., a Kemeny rule variant).  
          *   **Model B (Contractualist):** A simplified procedure where permissibility of an act depends on its justifiability to each agent under a veil of ignorance, requiring exhaustive comparison of alternatives for universal acceptability.  
      *   **Weeks 3-4:** Rigorously specify the computational problem each model demands (e.g., "Find the Kemeny ranking" for Model A; "Determine if an act is universally justifiable" for Model B), defining inputs (e.g., preference profiles, sets of acts/worlds) and outputs clearly. Identify natural parameters (e.g., number of agents `k`, number of alternatives `m`, maximum preference intensity `c`).

  *   **Month 2: Complexity Classification & Analysis:**  
      *   **Weeks 5-6:** Analyze the computational complexity of each formalized problem using established results from computer science literature. Determine:  
          *   Membership in complexity classes (P, NP, NP-hard, etc.).  
          *   Parameterized complexity (e.g., Is it FPT in `k`? W[1]-hard? XP?).  
          *   Existence and quality guarantees of known approximation algorithms.  
      *   **Weeks 7-8:** Interpret results philosophically. What does NP-hardness imply for the theory's claim to specify a determinate right action? Does FPT in `k` (number of agents) validate the theory for small committees but invalidate it for large populations? Does the existence of a constant-factor approximation algorithm for Model A offer a viable "approximately just" outcome?

  *   **Month 3: Normative Implications & Synthesis:**  
      *   **Week 9:** Analyze whether and under what conditions parameterized tractability (e.g., FPT) preserves the normative authority of a theory. Does tractability for "small `k`" suffice?  
      *   **Week 10:** Analyze whether approximation algorithms preserve normative force. Does an outcome guaranteed to be within 10% of optimal utility satisfy the theory's demands? Does a procedure with bounded error probability (e.g., Monte Carlo) undermine deontic constraints?  
      *   **Week 11:** Synthesize findings. Develop a framework for assessing the "computational viability" of a normative theory as a distinct meta-normative criterion. Contrast sharply with critiques based on bounded rationality.  
      *   **Week 12:** Finalize draft, outline implications for specific ethical theories (e.g., complex contractualism, certain voting theories), and identify future research directions.

  **4. Expected Outcomes & Deliverables:**  
  *   A precise formal characterization of the computational demands of two representative normative procedures.  
  *   A clear classification of their computational complexity (including parameterized complexity) and approximation landscape.  
  *   A novel philosophical argument establishing *inherent computational intractability* as a distinct meta-normative challenge, potentially undermining a theory's coherence or applicability.  
  *   A principled assessment of whether parameterized tractability or approximation can mitigate this challenge.  
  *   **Deliverable:** A polished research paper draft presenting the formal models, complexity analysis, and philosophical argumentation.  

  **5. What Success Looks Like:**  
  *   Successfully demonstrating that at least one toy model demands an NP-hard computation under plausible inputs.  
  *   Showing a clear divergence in how complexity impacts the two models (e.g., one is FPT in `k`, the other is para-NP-hard).  
  *   Developing a compelling philosophical argument that inherent intractability poses a distinct problem for normative authority, independent of agent limitations.  
  *   Providing a nuanced analysis of whether tractable approximations (exact or probabilistic) can rescue normative force, concluding that it depends critically on the *type* of normative theory (e.g., consequentialist vs. deontological).  

  **6. What Failure Looks Like:**  
  *   Both toy models turning out to be trivially in P under all relevant interpretations (unlikely given chosen examples).  
  *   Being unable to bridge the conceptual gap between technical complexity results and clear philosophical implications in a convincing way.  
  *   The parameterized/approximation analysis failing to yield philosophically interesting distinctions between the models.  

  **7. Scope & Limitations:**  
  This project operates at the intersection of philosophy and theoretical computer science. Crucially:  
  *   **Formal Expertise:** I possess training in basic logic and formal philosophy, but not advanced complexity theory. The project relies on *applying* established complexity classifications from CS literature to philosophical models, *not* on proving new computational lower bounds or developing novel algorithms. Collaboration with CS colleagues will be sought for verifying complexity assessments.  
  *   **Model Simplicity:** The "toy" models are deliberate simplifications to make complexity analysis tractable within the timeframe. They serve as proof-of-concept, not full analyses of real-world ethical systems.  
  *   **Focus:** The core aim is to establish the *philosophical significance* of intrinsic computational demands as a distinct meta-normative challenge. Technical results are a means to this end.  

  This project pioneers a novel critique of normative theory, grounded in the formal demands of computation itself, moving beyond the well-trodden path of bounded rationality. It promises to reshape how we evaluate the feasibility and authority of ethical theories in a computational world.
