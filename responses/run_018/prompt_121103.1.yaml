prompt: |-
  Hey, I'm a retired marine biologist—spent decades measuring coral growth and dealing with local fisheries boards—so I don't have formal training in this, but lately I've been reading some philosphy about corruption and whether Western ideas about bribery actually travel everywhere. I want to check my gut instincts against some principle, if there is one.

  Here are my verdicts. When a supplier sends my old lab an expensive watch right after we signed a big equipment contract, that's corrupt, no question. When I was doing fieldwork in the Pacific and brought fish and taro to the village elder before asking permission to study a reef, I don't think that was corruption at all—refusing the gift would have been the real insult, and his role includes recieving these things. When a city official takes a standardized "facilitation fee" to speed up paperwork everyone needs, I call it corruption, but it's systemic, not personal like the watch. When a politician hires his qualified college roommate for a planning job, I feel it's clientelism and wrong, but I hesitate to call it corruption since there's no hidden exchange. But then there's the case I keep going back and forth on: after a university administrator processed my research grant quickly and fairly, I sent her a nice bottle of whiskey. There's no expectation now, but I wouldn't have sent it if she hadn't helped me. Is that post-hoc bribery or just gratitude?

  I'm wondering if there's a principle like "corruption occurs when a gift creates a hidden expectation that distorts an impartial role" that captures the watch and the facilitation fee but spares the elder and maybe the whiskey? Or does that collapse because the elder's role isn't impartial? And what about the politician—does loyalty count as role-distortion? Can you lay out one principle, or maybe two competing ones, that gets most of my verdicts right, tells me what's happening with the whiskey, predicts what I'd say if I sent it only after she retired and couldn't help me anymore, and is honest about which of my gut feelings it has to throw out? Don't worry about giving me a reading list—I'm just trying to think this through on my own.
reasoning: |-
  Okay, let me tackle this retired marine biologist's question about corruption. They've shared several scenarios and their own gut reactions to each, and they're looking for a principle that explains their judgments. 

  First, I need to really understand their examples. The expensive watch after a contract is clearly corrupt to them, while bringing gifts to a village elder isn't. The facilitation fee is corrupt but systemic, hiring a qualified friend is clientelism but maybe not corruption, and the whiskey gift after a grant approval is the tricky one they're unsure about.

  Hmm, what ties these together? They mention a possible principle about "hidden expectations distorting impartial roles." That seems promising. Let me test it against each case:

  The watch creates a hidden quid pro quo expectation that distorts the procurement officer's impartial role. The facilitation fee does the same for the official's role. But the village elder - their role isn't impartial in the Western bureaucratic sense; it's culturally embedded gift-giving. The whiskey... ah, that's the sticky one. Even though sent after the fact, it might create an unspoken expectation for future favors.

  For the hiring case - hiring a qualified friend isn't about a hidden gift exchange, but loyalty distorting meritocracy. Maybe that requires a separate principle about conflicts of interest rather than quid pro quo corruption.

  Let me develop two principles: one about distorting impartial roles via gifts/expectations (covering watch, fee, whiskey), and another about violating role integrity through conflicts of interest (covering the hiring). The elder case would be exempt because the role itself incorporates reciprocity. 

  For the whiskey, the timing matters - sending it after retirement removes the expectation distortion. But the biologist's hesitation suggests they want to believe in pure gratitude. The principles should acknowledge that tension.

  I notice they want the framework to predict their reaction to variations like the retirement scenario. Good - that tests robustness. Also they're comfortable sacrificing the "not corruption" verdict on the whiskey if the principle demands it. That's intellectually honest.

  The village elder case is interesting - it shows Western frameworks can be ethnocentric. The principle must account for culturally constituted roles. Maybe add a footnote about role definitions being context-dependent.

  For output: should present the two principles clearly, map them to all cases including predictions, and explicitly state where their intuition gets overruled (whiskey = corruption). The retirement test shows how expectation hinges on ongoing capacity to reciprocate. 

  This seems to cover their needs - explains their judgments, resolves the whiskey dilemma, predicts new cases, and flags where intuition conflicts with the framework. The competing principles approach honors the complexity they observed.
answer: |-
  Your instincts are remarkably consistent, and the principle you've articulated is strong—but it needs refinement to handle cultural roles and loyalty cases. Based on your scenarios, **two complementary principles** emerge:

  ### Principle 1: Role Corruption  
  *"An act is corrupt when it secretly subverts the defined purpose of a role by introducing personal gain as a condition for fulfilling that role's duties."*  

  ### Principle 2: Impartiality Failure  
  *"An act is corrupt when it compromises a role requiring impartiality by creating obligations to specific individuals/groups over the collective interest."*  

  ---  
  ### How this maps to your verdicts:  
  1. **The expensive watch**  
     - Violates **both principles**: The procurement officer's role (impartial vendor selection) is subverted for personal gain (Role Corruption). The hidden gift creates a duty to the supplier over the institution (Impartiality Failure).  
     - *Your verdict upheld.*  

  2. **Gifts to the village elder**  
     - **No violation**: The elder’s role *includes* receiving tributes as part of cultural governance. No subversion occurs because reciprocity is transparent and expected. Impartiality isn't the role’s purpose—kinship/community stewardship is.  
     - *Your verdict upheld.*  

  3. **"Facilitation fee" for paperwork**  
     - **Role Corruption**: The official’s duty (efficient public service) is made conditional on personal payment.  
     - **Impartiality Failure**: Those who pay jump the queue, violating equal treatment.  
     - *Your verdict upheld.*  

  4. **Hiring a qualified friend**  
     - **Only Impartiality Failure**: If the role requires merit-based appointment (e.g., public planning), loyalty distorts impartiality by prioritizing personal ties. No *hidden* exchange (so not Role Corruption), but still corrupt if objectivity is required.  
     - *Your verdict adjusted: This is corruption* (systemic "clientelism" is a corruption subtype).  

  5. **Whiskey to the administrator**  
     - **Role Corruption applies**: Even post-hoc, the gift implies that favors *could* be repaid later (subverting her duty to judge grants neutrally). The *timing* (immediately after approval) creates implicit reciprocity.  
     - **Critical test**: If you sent it *after she retired*, no corruption—no role left to subvert. But if she’s active, the doubt persists: "Will she expect gifts from others? Does this influence future grants?"  
     - *Your gut hesitation overruled: This is mild corruption.*  

  ---  
  ### What the principles sacrifice:  
  - **The whiskey case** is the cost: Your intuition sees "gratitude," but the principles prioritize institutional integrity. Even unwritten expectations matter.  
  - **The hiring case** must be reclassified: Loyalty appointments *are* corrupt when impartiality is required, even without bribes.  

  ### Why this works:  
  - **Handles cultural roles**: By defining corruption relative to a role’s *purpose* (not universal rules), it spares the elder (role = community reciprocity) but condemns the administrator (role = impartial evaluation).  
  - **Clarifies "hidden expectations"**: The watch/fee/whiskey all create latent debts. The elder’s gift is an open social ritual.  
  - **Explains systemic vs. personal**: The facilitation fee is Role Corruption even if "standardized" because the role’s duty is still conditional on payment.  

  You’ve intuitively grasped that corruption hinges on **institutional roles vs. human relationships**. These principles formalize that insight—and confirm your decades of navigating gray zones were excellent training in practical ethics.
