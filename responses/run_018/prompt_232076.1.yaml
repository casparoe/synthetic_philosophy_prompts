prompt: |-
  I've been going back and forth with a friend for months about wether a much larger human population would be a good thing, and I've realized the argument never makes progress because we're using entirely different scorecards for what a theory of population value is even supposed to do. So I want to force the criteria to the surface before anyone gets to have an opinion about the yes/no.

  Here's what I'd like: write the list of requirements a theory that ranks populations by goodness must meet to count as adequate for judging whether a larger population is better. For each requirement, give the puzzle or judgment that motivates it — things like the Repugnant Conclusion (the idea that a vast population of lives barely worth living could come out better than a smaller population of excellent lives), the Mere Addition Paradox, the procreation asymmetry, the non-identity problem, and same-number cases where more total or more equal welfare should win. Then mark which of these are non-negotiable and which are just pet commitments of particular camps (totalists, averagists, person-affecting views, and so on), and say what you think separates the two. If some subset of the requirements turns out to be jointly unsatisfiable given the impossibility results in popultion axiology, that's the part I most want to see worked out — which demand has to give. Don't spend time scoring existing theories against the list; I want the criteria themselves, and I'll do the scorekeeping myself.
reasoning: |-
  Okay, the user is having a long debate with a friend about whether a larger human population is better, and they keep talking past each other because they're using different criteria for what makes a population "good." They want me to list the requirements a population theory must meet, explain the puzzles that motivate each requirement, note which are non-negotiable versus camp-specific, and highlight any conflicts where demands can't all be satisfied.

  First, I need to recall the key concepts in population ethics. The Repugnant Conclusion is a big one—where a huge population with barely worthwhile lives is considered better than a small one with great lives. That's a problem for total utilitarianism. The Mere Addition Paradox shows how adding happy people might seem good but leads to counterintuitive conclusions. Then there's the procreation asymmetry (not creating a happy person isn't bad, but creating an unhappy one is bad), the non-identity problem (choices affecting who exists), and same-number cases where total or equal welfare matters.

  The user wants the criteria laid out clearly. Let me list the requirements. First, there's Non-Explosiveness: avoiding the Repugnant Conclusion. That's motivated by the intuition that quality matters more than quantity at some point. But some totalists might accept it, so it's negotiable for them. Then Minimal Non-Archimedeanism: sometimes quality trumps quantity. That's related to Repugnant Conclusion too.

  Next, Mere Addition Permissibility: adding happy people without affecting others should be neutral or good. The paradox here shows conflicts with equality. Person-Affecting Restriction: only consider impacts on existing or future individuals. The non-identity problem challenges this, like in Parfit's case where policies affect who's born.

  Procreation Asymmetry: creating happy people isn't obligatory, but creating suffering is wrong. This is more of a deontic principle, so it's negotiable. Same-Number Pareto Plus: improving someone's life without harming others should be better. That seems non-negotiable, but the Mere Addition Paradox complicates it.

  Same-Number Egalitarian Dominance: more equal distributions are better if total welfare is the same. This is negotiable; prioritarians might disagree. Non-Extreme Priority: avoid neglecting the worst-off. This comes from the Sadistic Conclusion, where adding suffering lives is preferred to prevent nonexistence. That's negotiable but important for some theories.

  Transitivity is probably non-negotiable; without it, we can't have a coherent ordering. And Minimal Sensitivity to Welfare and Existence: the theory must respond to changes in welfare or existence. If it doesn't, it's trivial.

  Now, the conflicts. The core impossibility is between avoiding the Repugnant Conclusion (which requires valuing quality) and Same-Number Pareto Plus combined with transitivity, which can lead to the Repugnant Conclusion via Mere Addition steps. Also, the Procreation Asymmetry clashes with Person-Affecting views because not creating a happy person doesn't harm anyone, so it shouldn't be bad, but that conflicts with total utilitarianism.

  The user's deeper need is to understand why the debate is stuck. They need a framework to identify which axioms each side is prioritizing. By showing which requirements conflict, they can see which assumptions have to be dropped. For example, if someone insists on avoiding the Repugnant Conclusion, they must reject total utilitarianism and accept something like critical-level theories or person-affecting views. But each alternative has its own issues, like the Sadistic Conclusion or non-identity problems.

  I should make sure to distinguish non-negotiable requirements like transitivity from negotiable ones like egalitarian dominance. Highlighting the impossibility theorems (like Arrhenius') shows that some trade-offs are inevitable. This helps the user step back from the yes/no argument and focus on the underlying values.
answer: |-
  Here's a breakdown of the core requirements for a population axiology ("goodness ranking"), the puzzles motivating them, their negotiability status, and the key conflicts that make a universally satisfying theory impossible. This framework forces the criteria into the open before debating "larger = better."

  **Core Requirements & Their Motivations:**

  1.  **Non-Explosiveness (Avoiding the Repugnant Conclusion):**
      *   **Motivation:** The Repugnant Conclusion (RC). A theory must *not* imply that a vast population (Z) where everyone has a life *barely worth living* (positive but very low welfare) is better than a smaller population (A) where everyone has *excellent*, very high welfare lives, even if Z has a larger total welfare sum than A. Intuition: Quality matters immensely; a world of flourishing individuals shouldn't be ranked below an ocean of minimally acceptable existence.
      *   **Negotiability:** **Negotiable.** This is the *core demand* of "anti-repugnant" intuitions. Total Utilitarians explicitly *accept* the RC as a consequence of their view that total welfare is all that matters.

  2.  **Minimal Non-Archimedeanism (Quality Can Trump Quantity):**
      *   **Motivation:** Also the Repugnant Conclusion. A theory must allow that *some* amount of quality improvement for existing people (or a sufficient level of quality in a smaller population) *cannot* be outweighed by *any* increase in population size at a sufficiently lower quality. Intuition: There's a threshold where making lives *much* better for some is more important than adding more lives that are only *marginally* positive.
      *   **Negotiability:** **Negotiable.** Tightly linked to Non-Explosiveness. Total Utilitarianism rejects this; average utilitarianism accepts it strongly.

  3.  **Mere Addition Permissibility (or Neutrality):**
      *   **Motivation:** The Mere Addition Paradox (MAP). Adding new people with lives *worth living* (positive welfare), *without affecting the welfare of existing people*, should either be a) neutral (doesn't change the ranking) or b) an improvement. Intuition: Creating happy people, without harming anyone, shouldn't make the world *worse*.
      *   **Negotiability:** **Negotiable.** Person-Affecting Views often lean towards neutrality (no one existing is made worse off). Total Utilitarianism sees it as an improvement. Strong Average Utilitarianism might see it as a worsening if it lowers the average.

  4.  **Person-Affecting Restriction (PAR) / Non-Identity Sensitivity:**
      *   **Motivation:** The Non-Identity Problem. A theory should be sensitive to *which specific individuals* exist. An outcome can only be better (worse) than another *for* individuals who exist in both or *for* individuals who exist in one but not the other (and are affected by the difference). Creating a different (happy) person isn't "better for" the person who never existed. Intuition: "Better" or "worse" requires a subject; we can't harm or benefit nonexistent people.
      *   **Negotiability:** **Negotiable.** This is the *core commitment* of Person-Affecting Views (PAVs). Impersonal views (Totalism, Averagism) explicitly reject it, judging outcomes based on aggregate properties regardless of identity.

  5.  **Procreation Asymmetry:**
      *   **Motivation:** Intuitions about procreation duties. A theory should reflect that: a) Failing to create a person with a life *worth living* is *not* bad (or wrong), but b) Creating a person with a life *not worth living* (negative welfare) *is* bad (wrong). Intuition: We don't have a duty to create happy people, but we have a strong duty not to create miserable people.
      *   **Negotiability:** **Negotiable.** Primarily a feature of certain PAVs or specific asymmetric theories. Totalism rejects it (not creating a happy person *is* bad, as it reduces total good). Averagism is inconsistent with it.

  6.  **Same-Number Pareto Plus (Inequality Aversion Trigger):**
      *   **Motivation:** Same-number egalitarian intuitions and the Mere Addition Paradox. If two populations have the *same number* of people, and: a) At least one person is better off, and b) No one is worse off, then the population where someone is better off is better. Intuition: Pure, harmless improvement is good.
      *   **Negotiability:** **Largely Non-Negotiable.** This is a fundamental principle of betterness ordering, almost universally accepted *within same-number cases*. Violating it seems irrational. (The MAP shows how this *combined* with Mere Addition can lead to RC).

  7.  **Same-Number Egalitarian Dominance:**
      *   **Motivation:** Same-number cases involving inequality. If two populations have the *same number* of people and the *same total welfare*, the population with the *more equal distribution* of welfare is better. Intuition: Equality is intrinsically valuable, or at least, inequality is bad when everything else is equal.
      *   **Negotiability:** **Negotiable.** Strongly held by Egalitarians. Rejected by pure Totalists and Prioritarians (who might prefer a less equal distribution if it benefits the worst-off more). Averagism is indifferent if total and number are fixed.

  8.  **Non-Extreme Priority (Avoiding the Sadistic Conclusion):**
      *   **Motivation:** The Sadistic Conclusion. A theory must *not* imply that adding people with lives *barely worth living* (or even *negative* lives) is better than adding people with *very good* lives *if* the former option somehow leads to a higher total (or average) *in the final comparison*. More directly: Adding lives with negative welfare should not be preferred to adding lives with positive welfare *when comparing those specific additions*. Intuition: Adding suffering is bad; adding happiness is good. Don't prefer creating miserable people.
      *   **Negotiability:** **Negotiable.** Anti-totalist intuition. Totalism can violate this if adding the negative lives somehow allows for a much larger population later or corrects a distribution. Critical-Level views avoid it.

  9.  **Transitivity:**
      *   **Motivation:** Rational ordering. If population A is better than B, and B is better than C, then A must be better than C. Intuition: Essential for coherent, non-contradictory comparisons and choice.
      *   **Negotiability:** **Non-Negotiable.** Violating transitivity makes ranking incoherent and decision-making potentially irrational or cyclical. A core requirement for *any* adequate ordering.

  10. **Minimal Sensitivity to Welfare & Existence:**
      *   **Motivation:** Avoiding triviality. a) Increasing the welfare of an existing person (without harming others) should improve the population (Same-Number Pareto Plus covers this for same-number cases; this extends it). b) Adding a person with a life *substantially worth living* should generally improve the population compared to *not* adding them (if existing people unaffected). c) Adding a person with a life *not worth living* should generally worsen the population. Intuition: The theory must actually respond to changes in welfare and existence states in plausible ways.
      *   **Negotiability:** **Largely Non-Negotiable.** A theory violating this (e.g., saying adding a very happy person always makes things worse, or adding a suffering person makes no difference) seems fundamentally inadequate. (However, *how* it responds is negotiable - e.g., Average Util might violate b if it lowers the average).

  **The Inevitable Conflict & Which Demands Must Give:**

  The field of population axiology is plagued by **impossibility theorems** (most famously by Gustaf Arrhenius, building on Derek Parfit). These prove that **no theory can simultaneously satisfy all seemingly plausible requirements.** Here's the core conflict zone relevant to "larger = better?":

  1.  **The Repugnant Conclusion Trap:** Avoiding the RC (Req 1 & 2) fundamentally conflicts with the combination of:
      *   **Mere Addition Permissibility/Neutrality (Req 3):** Adding happy people isn't bad.
      *   **Same-Number Pareto Plus (Req 6):** Harmless improvements are good.
      *   **Transitivity (Req 9):** Rankings must be coherent.
      *   **Minimal Sensitivity (Req 10b):** Adding good lives should generally be good.
      *   **The MAP steps:** Start with A (small, excellent). Add group B (new happy people, existing A unaffected) -> A+B. Then, gradually lower the welfare of the B-group (while compensating the A-group slightly *if* needed to keep Pareto) until you reach a population like Z (vast, barely worth living). Transitivity + Pareto + Mere Addition force Z to be at least as good as A, violating Non-Explosiveness.

  2.  **The Person-Affecting Challenge:** Satisfying the **Person-Affecting Restriction (Req 4)** and **Procreation Asymmetry (Req 5)** robustly is extremely difficult when combined with other intuitions, especially concerning future generations whose identities depend on our choices (Non-Identity Problem). How can creating a happy future person be "good" if there's no existing person for whom it's good? PAVs often struggle to explain why a future full of suffering is bad, as the suffering people wouldn't have existed otherwise.

  **What *Has* to Give?**

  *   **You cannot simultaneously avoid the Repugnant Conclusion AND fully endorse Mere Addition Permissibility AND Same-Number Pareto Plus AND Transitivity AND Minimal Sensitivity.** This is the core impossibility highlighted by the Mere Addition Paradox leading to RC.
      *   **To Avoid RC:** You must reject *either* Mere Addition Permissibility (e.g., say adding happy people can be bad if it lowers average or enables future declines) *or* weaken Same-Number Pareto Plus / Transitivity in complex ways (very hard without irrationality) *or* introduce strong non-archimedean elements that block the transition (but these often create other problems like the Sadistic Conclusion or violate sensitivity).
  *   **You cannot have a fully Person-Affecting view that straightforwardly satisfies strong intuitions about impersonal badness (like future extinction or creating immense suffering) while adhering to Procreation Asymmetry.** Explaining why a future full of suffering is "bad" without referencing impersonal value is deeply challenging for PAVs.

  **Separating Non-Negotiable vs. Negotiable:**

  *   **Non-Negotiable (for a minimally adequate *ordering*):**
      *   **Transitivity (Req 9):** Without this, there's no coherent ranking.
      *   **Minimal Sensitivity (Req 10 - Core):** The theory must respond meaningfully to welfare changes and existence changes (especially adding suffering). Ignoring suffering or huge welfare gains makes the theory useless. *How* it responds is negotiable.
      *   **Same-Number Pareto Plus (Req 6):** Harmless improvements within a fixed population are bedrock. Rejecting this makes betterness deeply counterintuitive.
  *   **Negotiable (Reflecting fundamental philosophical divides):**
      *   Non-Explosiveness / Avoiding RC (Req 1 & 2)
      *   Mere Addition Permissibility/Neutrality (Req 3)
      *   Person-Affecting Restriction (Req 4)
      *   Procreation Asymmetry (Req 5)
      *   Egalitarian Dominance (Req 7)
      *   Non-Extreme Priority / Avoiding Sadistic Conclusion (Req 8)
      *   The *strength* of Non-Archimedeanism (how much quality trumps quantity - Req 2)
      *   *How* Minimal Sensitivity is satisfied (e.g., total, average, critical level, prioritarian weighting).

  **Conclusion for Your Debate:**

  The stalemate arises because your friend likely prioritizes a different *subset* of the negotiable requirements than you do. To make progress:

  1.  **Acknowledge the Non-Negotiables:** You both probably agree on Transitivity, Minimal Sensitivity (core), and Same-Number Pareto Plus. These form the shared foundation.
  2.  **Explicitly State Your Negotiable Commitments:** Which are *most* important to each of you?
      *   Is avoiding the Repugnant Conclusion *absolutely essential* (Req 1/2)?
      *   Is the Person-Affecting idea fundamental (Req 4/5)?
      *   Is adding happy people always permissible or even good (Req 3)?
      *   Does equality matter intrinsically in same-number cases (Req 7)?
  3.  **Recognize the Trade-offs:** Point out the impossibility results. If one of you demands Non-Explosiveness (anti-RC), they *must* accept rejecting or severely restricting Mere Addition Permissibility or weakening Pareto/Transitivity in some way. If one demands a strong Person-Affecting view, they must accept limitations on explaining future-oriented harms impersonally. There is no free lunch.

  By mapping your positions onto this framework of requirements and acknowledging which negotiable axioms you each hold sacred (and therefore which others you *must* reject), you can move beyond "larger = better?" to the more fundamental question: "**Which set of mutually incompatible, intuitively plausible principles about population value do we each find *least* objectionable to violate?**" That's where the real philosophical disagreement lies. Good luck!
