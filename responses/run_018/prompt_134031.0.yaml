tions, with approximate lengths: The Scenario (about 120 words); The Covering-Law Verdict (about 150 words); The Narrative Verdict (about 150 words); The Isolating Feature and Its Excision (about 150 words); The Covering-Law Counterattack (about 100 words); Bottom Line (about 50 words).
