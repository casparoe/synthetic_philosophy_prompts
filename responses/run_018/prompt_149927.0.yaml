  The ferry scene is crucial because it presents a collective trolley problem. But unlike the classic version, the decision isn't made by a single agent but by a group under pressure. This shifts the focus from individual constraints to collective responsibility. The fact that both groups refuse to blow each other up highlights communal ethics over individual sacrifice, which complicates the philosophical framing.

