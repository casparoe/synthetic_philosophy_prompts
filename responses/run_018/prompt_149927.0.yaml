  The user's point about spectacle changing intuitions is insightful. The ferry scene's chaos makes abstract ethics visceral. Seeing ordinary people grapple with the choice makes aggregation feel more real than hypotheticals. Nolan uses cinema to explore how context and emotion influence moral decisions, which philosophy might overlook.

