  I am a third-year philosophy major currently taking an upper-level metaphysics course that covers identity, modality, and the ontology of space-time. I am drafting practice materials for our final examination, and I need an essay question—together with a model answer and a marking scheme—on the identity of indiscernibles in light of Black’s spheres, but with an injected twist that prevents a student from answering by merely reciting Leibniz’s principle and the standard counterexample.

  Please construct the question for a 90-minute exam with an expected response of roughly 1,000 words. The injected scenario should run as follows: consider a universe containing exactly two spheres, A and B, that are qualitatively identical in every intrinsic respect and are separated by a fixed distance in a space that is homogeneous and isotropic. Now add that time in this universe is discrete and circular, looping back after a fixed period T. During the loop, the spheres exchange positions exactly once, so that after one full cycle each sphere occupies the spatiotemporal path previously traced by the other. Every relational property—distance to an origin point, temporal ordering of locations, velocity profile—is therefore preserved symmetrically across the loop.

  The exam question should ask students to evaluate whether this cyclical-relational structure saves Leibniz’s law or instead strengthens an anti-Leibnizian commitment to primitive thisness (haecceity). Specifically, the question must require them to: (1) reconstruct the standard Black-spheres objection; (2) analyze whether spatiotemporal relational properties in the cyclical model can distinguish A from B without circularity; (3) assess whether primitive identity becomes more or less plausible given that any relational difference seems to presuppose the very identities it is meant to ground; and (4) address the precise crux that if one says “A is the sphere that was at position p at time t,” the identification of A with that occupant already assumes A’s identity, rendering the relational rescue circular.

  Please provide a model answer of approximately 700 words that takes a clear position—either defending a relational rescue by denying that circularity is vicious, or arguing that the cyclical case strengthens primitive thisness—while engaging with the circularity problem explicitly.

  The marking scheme should total 25 marks, divided into five must-hit analytical moves (each worth 5 marks). For each move, include a one-line note on the typical failure mode (e.g., describing the loop without resolving the circularity, or mischaracterizing Black’s original argument as being about intrinsic properties alone). The scheme should clearly separate an A answer, which identifies the circularity threat and argues for or against primitive thisness in response, from a B answer, which describes the cyclical scenario competently but leaves the circularity unexamined.

  Do not ask for bibliographies, reading lists, or citations, and do not invoke obscure technical literature beyond what a student in a standard metaphysics course would know; the cyclical-time modification above is the only novelty required. Write this request in a formal, polished register appropriate to an academic setting.
