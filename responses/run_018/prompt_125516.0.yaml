answer: |-
  ### 1. The move it was asked to do
  Your colleague invoked the slogan "revolutions devour their own children" to assert that the purge of revolutionary leaders (like the Terror targeting Danton, Desmoulins, or ultimately Robespierre) was an inherent, necessary outcome of the revolutionary process itself. They used it to dismiss explanations emphasizing contingent factors—Robespierre's choices, the Girondins' specific political missteps, or unpredictable events in 1793–94—implying these were superficial. The slogan was presented as evidence that such outcomes are structurally determined, making contingency irrelevant to understanding the Terror's core logic.

  ### 2. The menu: eight readings

  1.  **Tautological Reading:** "Devouring children" simply *means* the elimination of early revolutionary actors by later revolutionary forces.
      *   *Mechanism:* Definitional (linguistic).
      *   *Scope:* All revolutions (by definition).
      *   *Logical Form:* Trivially true statement (A=A). Explains nothing.
      *   *Verdict:* **Trivial.** It offers no insight, just labels the phenomenon.
      *   *Debate Use:* Rarely the explicit intent, but sometimes lurks beneath the surface.

  2.  **Predictive Regularity:** Revolutions *always* or *very frequently* purge their founding leaders.
      *   *Mechanism:* Observational (historical pattern).
      *   *Scope:* All revolutions (claimed).
      *   *Logical Form:* Explanatory (best explanation is a general law of revolutions). Weak modal claim (high probability).
      *   *Verdict:* **False.** While purges are common (e.g., Stalin, Mao), many revolutions lack this specific pattern (e.g., American Revolution, Glorious Revolution). The French case is prominent but not universal.
      *   *Debate Use:* Often implied when used as a universal maxim.

  3.  **Institutional Mechanism:** Revolutionary institutions (like the Committee of Public Safety) inevitably centralize power and become self-purifying engines due to inherent instability and perceived threats.
      *   *Mechanism:* Institutional (dynamics of emergency governance).
      *   *Scope:* All large-scale, radical revolutions facing existential threats (claimed).
      *   *Logical Form:* Explanatory (structure drives outcome). Modal claim (inevitable given structure).
      *   *Verdict:* **Substantive and Partially Defensible.** Explains a strong tendency but overstates inevitability; institutional paths can branch (e.g., Thermidor ended the Terror *using* revolutionary institutions).
      *   *Debate Use:* **Most Common.** Used to argue the Committee's logic *had* to turn against its creators.

  4.  **Ideological Mechanism:** Revolutionary ideology inherently radicalizes, demanding ever-greater purity. Early leaders become symbols of insufficient zeal or deviation, making their elimination necessary to maintain ideological momentum.
      *   *Mechanism:* Ideological (logic of radical purity/virtue).
      *   *Scope:* Revolutions driven by universalist, utopian ideologies (claimed).
      *   *Logical Form:* Explanatory (ideological logic drives outcome). Modal claim (inevitable logic).
      *   *Verdict:* **Substantive and Partially Defensible.** Captures a powerful dynamic (Jacobin virtue), but ignores how ideology is contested and applied contingently. Not all revolutionary ideologies have this extreme purity spiral.
      *   *Debate Use:* Very common, especially emphasizing Robespierre's ideology.

  5.  **Psychological Mechanism:** The revolutionary mindset (paranoia, Manichean worldview, siege mentality) inevitably breeds suspicion and betrayal among leaders.
      *   *Mechanism:* Psychological (group dynamics under stress).
      *   *Scope:* All intense, protracted revolutions facing opposition (claimed).
      *   *Logical Form:* Explanatory (psychology drives outcome). Modal claim (probable, near-inevitable).
      *   *Verdict:* **Substantive but Flawed.** Describes a real factor but is overly deterministic and reductionist. Ignores agency and specific contexts shaping decisions.
      *   *Debate Use:* Often accompanies institutional/ideological readings.

  6.  **Structural Necessity (French Specific):** The *specific* socio-political contradictions of pre-1789 France made a self-consuming radical phase inevitable.
      *   *Mechanism:* Structural (class conflict, weak institutions, war).
      *   *Scope:* Only the French Revolution.
      *   *Logical Form:* Explanatory (unique French conditions made Terror/purges necessary). Strong modal claim (inevitable in this case).
      *   *Verdict:* **Substantive but Contested.** A core Marxist/materialist view. Defensible as *a* major cause, but hard to prove *inevitability* against counterfactuals (e.g., Girondin survival, different war outcomes).
      *   *Debate Use:* Used by those emphasizing unique French structures over agency.

  7.  **Normative Warning:** The slogan primarily serves as a cautionary tale: engaging in revolution creates forces that will likely destroy you.
      *   *Mechanism:* Normative/Moral (political lesson).
      *   *Scope:* All radical revolutions (implied).
      *   *Logical Form:* Normative (a warning based on observed tendencies).
      *   *Verdict:* **Defensible as Advice, Not Explanation.** Useful for caution, but not an analytical explanation of historical causes.
      *   *Debate Use:* Sometimes the underlying motive, especially in conservative critiques.

  8.  **Pure Metaphor:** The slogan is merely vivid imagery capturing the tragic irony of revolutionaries being destroyed by the forces they unleashed. It carries no specific causal claim.
      *   *Mechanism:* Linguistic (figurative language).
      *   *Scope:* N/A.
      *   *Logical Form:* Metaphorical (illustrative, not explanatory).
      *   *Verdict:* **Trivial for Analysis.** Evocative but useless for historical argumentation about causes.
      *   *Debate Use:* Rarely the intent in scholarly debate, but often the *actual* substance when scrutinized.

  ### 3. Which ones actually block contingency
  *   **Predictive Regularity (2):** If true, it *would* strongly rule out contingency (if it *always* happens, contingency is irrelevant). However, since it's false (purges aren't universal), it fails to block contingency for the French case.
  *   **Institutional Mechanism (3):** **Does Not Block Contingency.** It establishes a powerful *tendency* or *pressure*, but the *specific targets, timing, and intensity* of purges (e.g., why Danton *then*, why Robespierre *that way*) remain heavily contingent on factional struggles, personalities, and events.
  *   **Ideological Mechanism (4):** **Does Not Block Contingency.** While ideology creates a logic of purification, *who* is deemed impure, *when* the axe falls, and *how* factions weaponize ideology depend on contingent political battles and choices.
  *   **Psychological Mechanism (5):** **Does Not Block Contingency.** Psychology creates fertile ground for suspicion, but the *specific triggers* for betrayal (e.g., a failed compromise, a leaked letter, a rival's speech) are contingent events.
  *   **Structural Necessity (French Specific) (6):** **Claims to Block Contingency, but Fails.** This is the strongest claim for inevitability. However, even if deep structures made *some* form of crisis/violence likely, the *specific manifestation* as the Terror, targeting *those specific leaders* in *1793-94*, involved vast contingency (e.g., the Girondins' specific errors, the military situation week-by-week, Robespierre's health and choices). Contingency explains the *form* and *execution* within the structural context.

  **Conclusion:** **No substantive reading genuinely rules out contingency-based explanations for the specific events of the Terror.** At best, Readings 3-6 establish strong structural/ideological/psychological *conditions* or *pressures* that make purges *more likely*, but they cannot eliminate the role of contingent events, decisions, and accidents in shaping the actual historical outcome. The slogan overreaches.

  ### 4. Pushback on the framing
  Your premise is largely sound, but the slogan itself is fundamentally unsuited for the argumentative weight your colleague placed on it. It is **irreducibly metaphorical and rhetorically powerful, not a precise analytical tool.** While interpretations 3 and 6 represent common historical arguments (institutional radicalization, French structural necessity), these are substantive theses requiring evidence *beyond* the slogan. Using the slogan *alone* to "wave away" contingency is indeed a **rhetorical stop**, not a valid argument. The historical debate about the Terror **absolutely involves contingency** (Girondin tactics, Committee power struggles, war pressures, Robespierre's agency) alongside structural factors. The slogan obscures this necessary complexity. Your instinct is correct: it functions as closure, not clarification, in this context.
