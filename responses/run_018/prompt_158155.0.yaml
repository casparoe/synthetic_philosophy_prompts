  I should start by breaking down each thesis. Deterministic cycles like Polybius or Spengler suggest fixed lifespans regardless of tech. But is that defensible? Probably not, because material conditions change. Structural recurrence might hold more weight—maybe institutional patterns repeat, but does that affect tech? The epistemic claim about prediction being impossible retroactively is stronger; if cycles are only visible in hindsight, long-term forecasts are inherently flawed. But is that true for technology? Maybe not, since tech builds cumulatively.

  Then there's the normative point about hubris. That's more about caution than denying progress. Metaphysical claims about time being cyclical are less relevant here. The user needs to know which of these, if proven, would actually undermine AI forecasts. Deterministic cycles could, but they're weak. Structural recurrence might not touch tech. The epistemic one is the strongest challenge, but tech might not follow historical cycles due to factors like energy density or network effects.

  Toynbee's challenge-response model is interesting. It's cyclical in terms of societal responses but allows for linear tech accumulation. The colleague probably conflates this with hard cyclical theories. Highlighting Toynbee shows that cyclical and linear aren't mutually exclusive. 

