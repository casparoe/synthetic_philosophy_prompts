prompt: |-
  Hey, I'm in this grad semanar on collective violence and I'm totally stuck on the Browning vs Goldhagen debate—like are perpetrators just ordinary men pulled in by peer pressure and bureacratic distance, or are they willing exectutioners driven by deep cultural hatred? I was talking with my freind who studies AI ethics and we got wondering if you could build a custom thought experiment that actually isolates these two explanations, but in a modern realistic setting rather than rehashing the Holocaust. You should act like a professional philosopher of history and social psych, so please think carefully, maybe do a quick brainstorm first, then construct the case.

  I want a single-paragraph realistic workplace scenario—maybe a distributed content-moderation team or drone-operations unit—where people with zero prior animus toward a dehumanized group systematically carry out harmful actions purely because of situational dynamics like role diffusion, peer pressure, and algorithmic nudging, while Goldhagen-style deep ideological commitment is explicitly absent. The case needs to be engineered so that if you flip it—strong organizational culture is replaced by weak structure but every actor secretly holds eliminationist beliefs—the outcome reverses or collapses. After describing it, walk through what Browning's ordinary-men framework predicts versus what Goldhagen's willing-executioner framework predicts, say exactly why they split here, identify the structural feature doing the heavy lifting, and be honest about how a Goldhagen defender would attack the case and what happens if you strip out the algorithmic-nudge element. No bibliographies or citations—just the reasoning, no quotes needed.
