prompt: |-
  hey so i've been reading about Quine's moral anti-realism and i'm stuck on something deeper than the usual "he thinks morals are just culture" summary. specifically, does his ontological commitment criteron treat moral values differently from math just because they're not indispensable to science, or is there a deeper issue with whether moral predicates can even be regimented into canonical first-order notation without being eliminated? like, if you translate "x is good" into logical form, do you have to replace it with something like "x is approved by S", and if so, does that mean moral talk never makes it into the ontology in the first place? and if moral terms do survive regimentation intact, does that actually threaten Quine's anti-realism or does he have a separate argument to deny them weight?

