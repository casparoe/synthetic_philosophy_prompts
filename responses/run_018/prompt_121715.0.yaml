answer: |-
  ## Research Proposal: Ontological Composition Failure in the School of Names' White Horse Dialogue

  **Subject:** Independent Study in Comparative Philosophy of Language and Metaphysics  
  **Focus:** The White Horse Dialogue (Gongsun Longzi) – Ontological Interpretation of Composition Failure  
  **Duration:** One Semester  

  **1. Introduction & Problem Statement**
  The White Horse dialogue ("Báimǎ fēi mǎ" – "White horse is not horse") stands as a seminal, enigmatic text in the early Chinese School of Names (Míngjiā). Conventionally interpreted, it presents a paradox concerning class membership or predication, where the possession of both equine form ("horseness") and white color ("whiteness") is argued to disqualify the composite object ("white horse") from being strictly classified as a "horse." Dominant scholarly interpretations resolve this apparent paradox in three ways: (1) as a logical fallacy concerning sets and subsets (misapplying class inclusion/exclusion), (2) as exploiting semantic ambiguity in the term "horse" (e.g., species vs. instance), or (3) as a rhetorical exercise aimed at demonstrating the dangers of deceptive argumentation in legal or political contexts (statecraft). While offering valuable insights, these interpretations largely bypass the dialogue’s potential *metaphysical* core. This project proposes an alternative, less familiar framing: **the White Horse dialogue advances a thesis of ontological composition failure, specifically arguing that certain properties (like "whiteness") are "sortally invasive," meaning their instantiation alters the fundamental kind-membership conditions of the substance they modify, rather than merely adding an accidental feature.**

  **2. Research Question**
  The central question driving this research is: **Does the White Horse dialogue provide internal arguments supporting the claim that whiteness and horseness stand in a relation of non-compositional dependence, such that their combination produces an entity ("white horse") whose kind-identity (as "horse") is ontologically disrupted?** This question focuses on diagnosing the argument *as an ontological claim* about the failure of properties to compose a coherent substance-kind when combined, specifically due to the invasive nature of the color property relative to the animal kind.

  **3. Critique of Standard Interpretations & Justification for Ontological Reading**
  The three standard interpretations leave the ontological reading untouched for crucial reasons:
  *   **Logical Set-Theoretic Interpretation:** This approach typically imports modern (often Aristotelian-syllogistic or Boolean) logical frameworks. It treats "horse" and "white" as sets/subset classes and diagnoses a fallacy of misapplying inclusion rules. However, this assumes the *applicability* of these class-logical structures to the ontology presumed by the text. It fails to engage with the prior, more radical question the dialogue might raise: *whether the composite object genuinely instantiates the kind "horse" at all* due to the property composition. The logical "error" might be a consequence of a deeper ontological claim, not its cause.
  *   **Semantic Ambiguity Interpretation:** By locating the paradox solely in linguistic usage (e.g., "horse" meaning universal vs. particular, or material vs. formal aspect), this reading reduces the argument to a problem of reference or definition. It effectively treats the issue as resolvable through better language use, neglecting the possibility that the linguistic confusion stems from a perceived *ontological disruption* – that the nature of the object itself has changed due to the property combination. The dialogue’s insistence may target metaphysics, not just semantics.
  *   **Rhetorical/Statecraft Interpretation:** While historically plausible, this view often dismisses the argument’s philosophical substance as mere sophistry designed for practical effect. It sidesteps the internal philosophical reasoning presented, treating the paradox as deliberately spurious rather than reflecting a genuine, unconventional metaphysical position held by the School of Names. The ontological force of the claims made within the dialogue itself remains unexplored.

  **4. Proposed Interpretation: Ontological Composition Failure & Sortally Invasive Properties**
  This project argues that the dialogue is best understood as proposing a radical ontology where properties are not neutral, modular additions to an underlying substance. Specifically, **"whiteness" is presented as a "sortally invasive" property with respect to "horseness."** Its presence does not merely qualify an existing horse-substance; it fundamentally alters the conditions required for something to be a member of the kind "horse." The combination "horseness + whiteness" generates a new entity ("white horse") whose kind-membership is *disrupted* relative to the original kind ("horse"). This constitutes a "composition failure": the properties fail to compose an instance of the original kind. The dialogue’s conclusion ("white horse is not horse") is thus a literal ontological statement, not a semantic trick or logical error.

  **5. Research Method**
  To rigorously test this interpretation, the project will employ:
  1.  **Premise-by-Premise Textual Reconstruction:** A meticulous, internal analysis of the dialogue’s argument structure. Key steps include:
      *   Identifying explicit and implicit premises within the dialogue’s own reasoning.
      *   Reconstructing the logical flow *without* importing modern logical notation (e.g., avoiding ∀, ∃, ∈, ⊂). Focus will be on the relations (dependence, exclusion, identity, composition) as presented in the text’s own terms.
      *   Examining key concepts ("having," "seeking," "separating," "combining") for their ontological import.
  2.  **Controlled Comparative Analysis:** Testing the *internal coherence* and *explanatory power* of the "composition failure" reading by comparing its structure with contemporary **phase-sortal theories** (e.g., concepts where an object changes kind based on intrinsic properties, like "lump of clay" vs. "statue"). This comparison is *not* intended to suggest historical influence or direct equivalence, but solely to use the modern framework as a *heuristic tool* to assess whether the reconstructed ancient argument holds together as a viable ontological model. Does the "sortally invasive property" concept resolve the apparent paradox internally?
  3.  **Clear Failure Condition:** The interpretation will be deemed unsuccessful if the premise-by-premise reconstruction requires attributing core premises (especially concerning non-compositional dependence or sortal invasiveness) that demonstrably lack any basis within the dialogue’s own textual structure and argumentative moves, relying solely on external theoretical imposition.

  **6. Scope, Feasibility, and Risks**
  *   **Feasibility (One Semester):** This project is feasible due to its tight focus:
      *   Primary Text: Sole focus on the White Horse dialogue itself (a very short text).
      *   Limited Secondary Engagement: Engaging with standard interpretations only to the extent necessary to define the gap this project fills. *No* exhaustive history of the School of Names or later commentaries.
      *   Controlled Comparison: The phase-sortal comparison is restricted to testing the *internal logic* of the reconstructed argument, not undertaking a full historical or systematic comparative study.
  *   **Key Risk (Collapse into History):** The primary risk is drifting into general intellectual history of the School of Names, Warring States philosophy, or comparative logic. Mitigation involves constant reference back to the *specific ontological question* and the *internal argument reconstruction* of the single dialogue. The phase-sortal comparison is a tool, not a primary subject.
  *   **Risk of Textual Overstretch:** The danger of attributing a sophisticated modern ontology to a sparse ancient text is real. The strict adherence to the "failure condition" (no unsupported premises) and avoidance of modern logical formalism are crucial safeguards.

  **7. Philosophical Payoff**
  If successful, this project yields significant philosophical results:
  1.  **Novel Interpretation:** It provides a substantively new and philosophically rich reading of a canonical text, moving beyond well-trodden logical or semantic debates.
  2.  **Metaphysical Contribution:** It recovers and reconstructs a potentially unique, non-Aristotelian model of property-substance relations and composition failure from the early Chinese tradition, centered on the concept of "sortally invasive properties."
  3.  **Comparative Significance:** It demonstrates the capacity of classical Chinese philosophical texts to engage deeply with core metaphysical problems concerning identity, persistence, and composition, offering alternatives to dominant Western frameworks. It shows how "paradoxes" might mask serious ontological proposals.
  4.  **Conceptual Tool:** The notion of "sortally invasive properties" as a cause of ontological composition failure could become a valuable conceptual tool within contemporary metaphysical debates, inspired by an ancient source.

  This project aims to unlock the White Horse dialogue's neglected ontological depth, arguing that its apparent paradox stems not from linguistic confusion or logical error, but from a radical thesis about the disruptive, kind-altering power inherent in the composition of certain properties.
