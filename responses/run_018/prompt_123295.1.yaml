answer: |-
  Here's the full desiderata list for a serious "consciousness as user illusion" theory, structured around your requirements. Non-negotiables are **bolded**, camp preferences are *italicized*, and inherent tensions are flagged.

  ---

  ### I. Core Phenomena to Explain (The "Feel" & Behavior)
  1.  **Qualitative Character ("Why Red Feels Like *This*"):** Why does the illusion have specific, seemingly irreducible qualitative properties (qualia)? Why isn't it just abstract data? *(Non-negotiable - the Hard Problem's core)*
  2.  **Sense of Agency & Ownership:** Why does the UI present actions as "mine" and volitions as originating "from me," even if generated sub-personally? How does it integrate feedback loops? *(Non-negotiable - central to subjective experience)*
  3.  **Temporal Binding & Continuity:** How does the UI create the illusion of a seamless "now" and continuous flow despite asynchronous, discrete neural processing? Must explain phenomena like the "specious present." *(Non-negotiable - fundamental to lived experience)*
  4.  **Unity & Fragmentation:** How does the UI normally bind disparate sensory/modular inputs into a single scene ("binding problem")? Conversely, why/how does it fragment under conditions like split-brain, psychedelics, or dissociative states? *(Non-negotiable - defines normative vs. altered states)*
  5.  **Intentionality (Aboutness):** How does the UI represent states *as being about* something in the world or body? Why isn't it just noise? *(Non-negotiable - core feature of contentful states)*

  ### II. Critical Distinctions to Maintain (What the Theory CAN'T Smudge)
  6.  **Useful vs. Veridical:** Must clearly differentiate the *functional utility* of the UI representation from claims about its *direct correspondence* to underlying neural reality (e.g., pain UI is useful for avoidance, but doesn't map 1:1 to nociceptive processing). *(Non-negotiable - core illusion claim)*
  7.  **First-Person Access vs. Third-Person Report:** Must distinguish the subjective *seeming* of direct access (the UI's presentation) from the objective reality that this access is constructed, limited, and prone to confabulation (e.g., why we can't introspect neural firing patterns). *(Non-negotiable - avoids collapsing perspectives)*
  8.  **Organism-as-User vs. Subsystem-as-User:** Must specify *who/what* the "user" is. Is it the whole organism interacting with the world/social sphere? Or is it a specific high-level cognitive subsystem managing lower-level subsystems? *(Camp Preference - leans towards organism-level for evolutionary rationale, but theories vary)*
  9.  **Evolutionary Origin vs. Current Function:** Must account for how the UI evolved (likely for social coordination, threat prediction, complex action selection) while explaining its *current* functions, which may extend beyond original purposes (e.g., abstract thought, art). *(Camp Preference - strong theorists demand evolutionary grounding)*

  ### III. Compatibility Constraints (Neuroscience/Cog-Sci Bedrock)
  10. **Predictive Processing Framework:** Must be compatible with (or built upon) the brain as a hierarchical predictive engine. The UI must be explainable as a specific aspect or level within this prediction-minimization machinery. *(Non-negotiable - dominant neuro-computational paradigm)*
  11. **Global Workspace Dynamics:** Must account for the dynamics of information access and broadcasting (even if the "theatre" metaphor is rejected). Why does the UI *feel* like a limited capacity spotlight? *(Non-negotiable - explains reportability and access consciousness)*
  12. **Hierarchical Brain Architecture:** Must respect the deep subcortical origins of affect, drives, and basic homeostasis vs. the cortical layers involved in abstraction and narrative. *(Non-negotiable - core neuroanatomy)*
  13. **Unconscious Processing:** Must explain the vast amount of sophisticated cognition (perception, action planning, prediction) that demonstrably occurs *without* UI involvement. *(Non-negotiable - empirical fact)*

  ### IV. Your Niche Twist: The Legacy System & API Issues
  14. **Exposed Legacy APIs (Raw Affects):** Must explain why evolutionarily ancient signals (e.g., panic from amygdala, raw nociceptive signals, primal rage) often "bleed through" the high-level UI or hijack it entirely, feeling qualitatively distinct and less "narrativized." *(Case: Sudden terror vs. chronic anxiety; acute pain vs. suffering)*
  15. **Social-Cognition Root Access:** Must explain why social modules (e.g., theory of mind, reputation tracking, social threat detection) seem to have privileged, often unconscious, influence over UI content and self-narrative compared to deliberate introspection. *(Case: Implicit bias, social anxiety overriding rational thought, effortless gossip vs. labored self-analysis)*
  16. **The Veridicality Paradox:** Must reconcile **"(A) UI is entirely fabricated"** with **"(B) UI reliably tracks survival-relevant states"**.
      *   *Tension:* (A) suggests no inherent truth, (B) requires systematic correlation. How can a pure fabrication be reliably informative?
      *   *Possible Resolution:* The UI isn't *random* fabrication; it's a highly constrained, evolutionarily sculpted *summary statistic* or *control schematic* optimized for action guidance, not ontological truth. It tracks *salient relational patterns* critical for fitness, even if it misrepresents the underlying implementation (like a car dashboard showing "engine stress" without revealing piston mechanics). **(This is the critical pivot point - strong vs. weak theories diverge here)**.

  ---

  ### Conflict & Tension Analysis
  *   **The Big One: Veridicality Paradox (16):** This is the central tension. **Strong Illusionists (Dennett-esque):** Lean hard into (A), seeing (B) as a happy coincidence of evolutionary design – the UI *is* just a useful fiction, and "reliably tracks" only means it prompts adaptive behavior, not that its *content* mirrors reality. **Weak Interface Theorists:** Argue (A) is overstated; the UI is a highly transformed but *grounded* representation. Its structure reflects real computational/biological distinctions (e.g., pain UI reflects *something* critical about tissue threat processing, even if simplified).
  *   **Qualia (1) vs. Pure Functionalism:** Explaining *why* the UI has *this specific feel* is the hardest nut for strong illusionism. Dismissing it as "just how information feels when processed this way" often feels unsatisfying (the "Hard Problem" remains).
  *   **Legacy APIs (14) vs. UI Unity (4):** The constant tension between older, powerful, but "dumb" signals disrupting the coherent narrative UI is a feature, not a bug. A good theory must explain why evolution didn't fully sandbox them.
  *   **Social Root Access (15) vs. Sense of Agency (2):** Privileged social-module access directly challenges the UI's presentation of a unified, self-controlled agent. Must explain why the UI obscures this access or rationalizes it post-hoc.

  ---

  ### Quick Scorecard (General Trends, Not Universal)
  *   **Dennett-Style Eliminativism/Strong Illusionism:**
      *   **Aces:** 6 (Useful vs. Veridical), 7 (1st vs. 3rd Person), 10 (Predictive Processing), 13 (Unconscious Processing), 16A (Pure Fabrication).
      *   **Struggles:** 1 (Qualia - often dismissed/downplayed), 2 (Agency - seen as post-hoc attribution), 3 (Continuity - explained but feels reductionist), 14/15 (Legacy/Social - downplays unique "feel"), 16B (Reliable Tracking - hand-wavy).
  *   **Weak Interface Theories:**
      *   **Aces:** 2 (Agency), 3 (Continuity), 4 (Unity/Fragmentation), 5 (Intentionality), 10 (PP), 11 (GW), 12 (Hierarchy), 14/15 (Legacy/Social), 16B (Reliable Tracking).
      *   **Struggles:** 1 (Qualia - still hard), 6 (Useful/Veridical - risks smuggling in realism), 7 (Access - need careful handling), 16A (Fabrication - may weaken it).
  *   **Predictive Processing UI Models (e.g., some Karl Friston interpretations):**
      *   **Aces:** 3 (Continuity - as prediction smoothing), 4 (Unity/Fragmentation - precision weighting), 5 (Intentionality - prediction = aboutness), 10 (PP - foundational), 11 (GW - as global prioritization), 12 (Hierarchy - built-in), 13 (Unconscious - most processing is sub-personal PP).
      *   **Struggles:** 1 (Qualia - PP doesn't inherently solve it), 2 (Agency - needs specific implementation), 6 (Useful/Veridical - depends on interpretation), 14/15 (Legacy/Social - needs specific mechanism), 16 (Veridicality Paradox - same core tension).

  ---

  **The Crux:** A viable theory must **navigate the Veridicality Paradox (16)** without collapsing the **Useful/Veridical distinction (6)** or **dismissing Qualia (1)**. It must explain **Legacy APIs (14)** as features of hierarchical evolution and **Social Root Access (15)** as a design choice for efficiency, while maintaining compatibility with **Predictive Processing (10)** and **Global Workspace dynamics (11)**. The tension between the illusion's fabricated nature and its survival utility remains the most significant challenge demanding a nuanced solution.
