prompt: |-
  okay so ive been chewing on the "consciousness is a user illusion" framing - you know, the idea that what we call subjective experience is basically a compressed dashboard or UI layer that evolved to help an organism navigate social and physical space, not a direct window onto neural computation. every discussion i see either treats it as a shallow computer metaphor or uses it to dismiss phenomenology entirely, and i think both miss the point. so before i go deeper i want the actual spec.

  write the desiderata: what any serious theory in this space has to deliver if its going to be more than a catchy analogy. i need the full list of requirements - the phenomena it must explain (like why the illusion has this specific "feel", why agency seems built-in, why it fragments in split-brain cases or psychedelic states, why there's a sense of temporal continuity despite discrete processing), the distinctions it can't collapse (useful vs veridical, first-person access vs third-person prediction, the organism-as-user vs some subsystem being the user, evolutionary origin vs current function, and why these have to stay seperate not merged), and the neuroscience / cog-sci results it has to stay consistent with (predictive processing, global workspace dynamics, the binding problem - whatever applies).

  heres the niche twist i want injected: treat the illusion like software with version history. if consciousness is an interface built on older subcortical architectures, the theory has to explain why the UI still exposes "legacy APIs" - raw fear, pain signals, emotional spikes that dont match the high-level narrative - and why social-cognition modules seem to have root access to the dashboard in ways explicit self-reflection doesnt. also flag whether you can have both "the UI is entirely fabricated with no veridical core" and "it reliably tracks survival-relevant states" without contradiction - i suspect those two might be jointly unsatisfiable.

  for each desideratum give the case or consideration behind it. flag which ones are non-negotiable and which are just camp preferences (strong illusionists vs weak interface theorists). if some subset is impossible together given what we know about brain architecture, say so - thats the part i care about most.

  keep it practical - no bibliographies, no "read the original book then come back", no asking for citations a model without web access couldnt verify. just the criteria, the conflicts, and maybe a quick scorecard of how the standard versions (Dennett-style eliminativism, weak interface theories, predictive-processing UI models) do against the list, but keep the weight on the criteria themselves since thats where the thinking lives. oh and i probably made a typo or two above, thats intentional, dont fix them in your answer.
