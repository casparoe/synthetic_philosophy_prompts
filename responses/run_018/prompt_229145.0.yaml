prompt: |-
  In my upper-division philosophy of science seminar I regularly defend evolutionary psychology against the charge that it traffics in just-so stories, and I had long assumed the charge was more of a rhetorical posture than an argument. Last term, however, a student reconstructed it in a form I have not been able to answer cleanly, and I would like a diagnosis before I teach the unit again. Her argument ran as follows:

  (1) A hypothesis is scientific only if evidence bears on it asymmetrically: there must be possible observations that would count for it and possible observations that would count against it, and one must be able to say in advance, at least roughly, which are which.

  (2) Adaptationist hypotheses about human cognition -- that we possess a dedicated cheater-detection module, that pregnancy sickness is an adaptation protecting the fetus from dietary toxins, that men and women differ in jealousy because the ancestral costs of infidelity were asymmetric -- are confirmed when observed behavior fits the hypothesis's retrodictions.

  (3) But for any observed behavior whatsoever, some adaptationist accommodation can be constructed after the fact. If the predicted trait appears, it is an adaptation. If it fails to appear, the cost of the trait exceeded the benefit, or the relevant selection pressure was absent. If the opposite of the prediction appears, the environment of evolutionary adaptedness must have differed from what was assumed, or the trait is a byproduct of some other adaptation, or a developmental constraint blocked the optimum. Nothing in the method forbids any of these moves.

  (4) Therefore no possible observation counts against an adaptationist hypothesis; such hypotheses can only be confirmed, never disconfirmed.

  (5) By (1), adaptationist hypotheses in evolutionary psychology are not scientific.

  Her conclusion in (5) is already more than I want to grant, but the real trouble is that the argument appears to prove too much. Phylogenetic reconstruction, historical geology, and much of cosmology also infer past processes from present traces, and in each case a sufficiently clever theorist can accommodate anomalous traces by revising auxiliary assumptions about initial conditions or background processes. If (3) and (4) are sound as applied to evolutionary psychology, parallel versions seem available for these fields -- and I am not prepared to conclude that inferring the tree of life from molecular sequences is unscientific. Nor do I want to win cheaply by pointing to cases where adaptationist reasoning got there first, as Fisher's sex-ratio argument is sometimes said to have done, since the student's premise (1) demands advance asymmetry and that case arguably supplies it.

  Which step should I reject? I am most reluctant to give up (1), since some version of it seems required to distinguish empirical inquiry from unfalsifiable systematizing. If the flaw lies in (3) or (4), explain what an adaptationist hypothesis would have to look like for an observation genuinely to count against it, and whether actual research programs in evolutionary psychology meet that standard or merely gesture at it. And tell me what rejecting your chosen step costs -- what other commitments, in evolutionary biology or in the historical sciences generally, I would have to revise or abandon along with it.
reasoning: |-
  Okay, let's tackle this philosophy of science problem. The user is a professor defending evolutionary psychology against the just-so story critique, and a student's argument has them stumped. The core issue is whether adaptationist hypotheses are unfalsifiable. 

  First, I need to unpack the student's syllogism. Premise 1 about asymmetric evidence feels solid—it's basically Popperian falsifiability dressed up. The real friction starts at Premise 3: the claim that adaptationists can explain any outcome post-hoc. That's troubling because if true, it'd make evolutionary psychology unscientific by Premise 1's standard. But the professor rightly notes this would also condemn historical sciences like phylogenetics or cosmology, which they don't want to do. 

  Hmm... the professor's dilemma is juicy. They can't reject Premise 1 without undermining science's demarcation criteria, but accepting Premise 3 torpedoes their field. The escape hatch must be showing that Premise 3 misrepresents how evolutionary psychology actually works. 

  I recall that biologists like Mayr distinguished proximate vs ultimate causation. Maybe the student conflates them? Adaptationist hypotheses aren't standalone—they're embedded in a web of auxiliary assumptions about genetics, selection pressures, etc. When a prediction fails, researchers don't just handwave; they test whether tweaking those auxiliaries holds water. For example, if pregnancy sickness doesn't correlate with toxin exposure cross-culturally, that sinks the fetal-protection hypothesis unless its defenders can produce new evidence about ancestral diets or genetic constraints. 

  The professor's worry about "proving too much" is smart. Historical sciences avoid unfalsifiability by demanding consilience—independent lines of evidence must converge. A dinosaur extinction hypothesis relying solely on iridium layers could be ad-hoc, but when paired with impact craters and shocked quartz, it gains teeth. Evolutionary psychology's best work does this too: Cosmides' cheating-detection module wasn't just a story—it predicted cross-cultural Wason test asymmetries. 

  Wait—does the student's Premise 3 ignore that auxiliary assumptions are themselves testable? Gould and Lewontin's spandrels paper made this point: calling everything an adaptation is lazy, but the fix isn't abandoning adaptationism; it's demanding stronger evidence. We can observe selection in real-time (finch beaks!), study genetic drift in labs, or use comparative methods. If a trait's distribution across species matches adaptive predictions better than neutral models, that's asymmetry. 

  The professor's request for concrete disconfirmation examples is key. Imagine finding pregnancy sickness in species without placentas—that'd challenge the fetal-protection hypothesis unless proponents could show parallel selective pressures. Or if paternal jealousy vanished in matrilineal societies without fitness costs, the sexual asymmetry theory would crumble. 

  Ultimately, rejecting Premise 3 costs nothing but sloppy thinking. It forces clearer hypothesis formulation—specifying required evidence, boundary conditions, and alternative explanations upfront. That's good science, whether studying mating strategies or supernovae. The professor can keep their demarcation criterion while arguing evolutionary psychology meets it when done rigorously. They’ll just need to spotlight research that actually risks falsification—and admit that some published work deserves the just-so critique.
answer: |-
  Your student has articulated a sophisticated version of the unfalsifiability critique. The flaw lies in **premise (3)**, which mischaracterizes the methodological constraints and empirical demands of rigorous evolutionary psychology. Here's a breakdown of why, what it costs, and how to reconcile this with historical sciences:

  ### Why Premise (3) is Flawed
  Premise (3) treats adaptationist hypotheses as isolated claims that can be insulated from disconfirmation through arbitrary auxiliary adjustments. However, in practice, robust evolutionary psychology:
  - **Requires consilience**: Hypotheses must align with multiple lines of evidence (e.g., comparative biology, genetics, paleoecology, developmental psychology). An ad hoc "accommodation" that contradicts established evidence from these fields is invalid.
  - **Demands testable auxiliaries**: Auxiliary assumptions (e.g., ancestral environments, fitness costs) are independently testable. For example:
    - If "pregnancy sickness as toxin-avoidance" is falsified by data showing no correlation between toxin exposure and sickness severity cross-culturally, invoking "differing ancestral pressures" requires *specific evidence* for that claim (e.g., isotopic analysis of ancestral diets).
    - Hypotheses like "male sexual jealousy as paternity assurance" predict specific, measurable phenomena (e.g., higher rates of mate-guarding in high-paternity-uncertainty contexts). If the *opposite* is found (e.g., greater mate-guarding where paternity is certain), simply positing "changed environments" without evidence violates parsimony and invites disconfirmation via anthropology or genetics.
  - **Predicts novel evidence**: Strong adaptationist hypotheses generate predictions beyond the initial observation (e.g., the cheater-detection module predicted *asymmetric* performance in social vs. abstract reasoning tasks—a pattern later confirmed).

  **Example of genuine disconfirmation**:  
  If a study found that *in ancestral-like environments* (e.g., high-pathogen foraging societies), pregnancy sickness *increased* maternal mortality without improving fetal outcomes, the toxin-avoidance hypothesis would be falsified. Auxiliary adjustments (e.g., "it protected against a toxin not present here") would require new, testable evidence.

  ### What Rejecting (3) Costs
  Rejecting premise (3) commits you to:
  1. **Auxiliary assumptions must be independently constrained**: You cannot freely invent rescuing auxiliaries. Assumptions about ancestral conditions, fitness trade-offs, or developmental constraints require empirical support from genetics, ecology, or archaeology.
  2. **Parsimony as a guide**: When multiple explanations fit the data, the least complex (fewest ad hoc assumptions) is preferred—a standard from which evolutionary psychology isn't exempt.
  3. **Methodological pluralism**: You must accept that non-adaptationist explanations (e.g., exaptation, drift) can be viable when evidence demands it. This aligns with modern evolutionary biology (e.g., Gould & Lewontin’s "spandrels" critique).

  ### Resolving the "Proving Too Much" Problem
  Historical sciences *do* face similar challenges, but they avoid unfalsifiability through:
  - **Multiple independent lines of evidence**: Cosmology uses physics, chemistry, and astronomy; phylogenetics uses morphology, genomics, and stratigraphy. Evolutionary psychology must likewise integrate evidence beyond behavior (e.g., genetics, neuroscience).
  - **Strong inference**: Testing *competing* hypotheses (e.g., adaptation vs. drift) against novel predictions. Example: If sex differences in jealousy were shown to arise from cultural transmission alone (e.g., rapid change post-industrialization), the adaptationist account would be falsified.
  - **Falsifiability of auxiliaries**: In geology, assuming "uniformitarianism" (past processes resemble present ones) is testable via experiments or new data. Similarly, claims about ancestral human environments can be tested against paleoclimatic or archaeological data.

  ---

  ### How to Rebut the Student's Argument
  1. **Concede limited ground**: Some *poorly conducted* evolutionary psychology does resemble just-so stories. But rigorous work meets falsifiability criteria (e.g., Tooby & Cosmides' cheater-detection predictions).
  2. **Emphasize predictive power**: Cite cases where adaptationist hypotheses made novel, risky predictions later confirmed (e.g., greater paternal investment in high-certainty societies). Fisher’s sex ratio is one example; another is the prediction that step-parents will exhibit higher rates of child neglect (supported cross-culturally).
  3. **Highlight constraints**: Not all traits can be "explained away" without violating other biological knowledge. E.g., if a trait lacks heritability, it cannot be an adaptation—a constraint falsifying many post-hoc accounts.
  4. **Distinguish hypotheses from frameworks**: Adaptationism is a *heuristic framework*, not a specific hypothesis. Frameworks aren't falsifiable alone (like natural selection itself), but specific hypotheses within them are (e.g., "jealousy module X evolved due to selection pressure Y").

  ### Key Takeaway for Your Seminar
  The student's argument confuses **methodological flexibility** (legitimately revising auxiliaries under evidence) with **immunity to disconfirmation**. Rigorous evolutionary psychology avoids just-so storytelling by:
  - Making testable predictions about novel domains (e.g., cognitive mechanisms),
  - Demanding consilience with independent evidence,
  - Specifying in advance what evidence would falsify the hypothesis (e.g., "If no correlation between pathogen prevalence and disgust sensitivity is found, our hypothesis fails").

  **What you lose**: The ability to defend *all* adaptationist claims as equally scientific. Some are indeed unfalsifiable and must be discarded.  
  **What you gain**: A robust defense of evolutionary psychology as a historical science, aligned with phylogenetics and geology, where testability emerges from cumulative evidence and constrained auxiliaries.
