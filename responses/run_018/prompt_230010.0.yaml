prompt: |-
  I teach an upper-level undergraduate seminar in decision theory with about eighteen students, and I have one two-hour session in which I want them to run into the two-envelope paradox themselves rather than have it explained to them. Design a classroom activity in which students make real choices between two envelopes, slips, or cards holding unequal amounts where one holds twice the other, and are then offered the chance to switch after seeing their own amount; the rules and the order of operations should be arranged so that the always-switch reasoning arises naturally from the students before anyone names it, and then reinforced by the unopened symmetric case where the same reasoning would push them to switch twice. I want exact materials, timings for each phase, a scoring or payoff scheme that needs no real money but still makes each choice feel consequential, and a debrief that maps moments in the activity onto the structure of the paradox: the hidden amount pairs, the mistake of treating the observed amount as fixed across the two possible comparisons, the symmetry of the unopened case, and the problem with the implicit uniform distribution over possible envelope contents. Also tell me how to handle a room where half the students have already heard of the paradox, what will predictably go wrong the first time I run it, and which features of the paradox the activity cannot make vivid and must therefore be supplied in the debrief. Keep the entire response in continuous prose, the way you would write a long email to a colleague: no headings, no bullet points, no bold text, no tables.
reasoning: |-
  Okay, the user is teaching an upper-level undergrad seminar in decision theory with 18 students. They want a classroom activity for a two-hour session where students discover the two-envelope paradox themselves. The key goals are: students should make real choices between envelopes with unequal amounts (one double the other), be offered to switch after seeing their amount, and naturally arrive at the "always switch" reasoning. The activity should also highlight the symmetry in the unopened case where switching twice leads back to start. They need concrete materials, timing, a scoring system without real money, and a debrief connecting activity moments to paradox elements. Plus, handling students who already know the paradox, predicting pitfalls, and noting what the activity can't cover.

  First, I need to design the activity flow. Starting with pairs of students makes sense—each pair gets two envelopes: one with X and one with 2X. The amounts should be tangible, like slips with points. To make choices feel consequential, I'll use a point system that affects something, maybe participation grade extra credit. For scoring, a raffle for small prizes could work—no money but still motivating. 

  For the sequence: start with an initial choice without seeing contents, then reveal their amount, offer a switch, and finally, in the symmetric case, have them consider switching again without opening the second envelope. Timing is crucial: two hours total, so phases need to be tight. Introduction (10 min), initial choice and reveal (15 min), first switch decision (20 min), discussion (15 min), symmetric case (15 min), second discussion (15 min), and debrief (30 min). 

  To ensure the "always switch" reasoning emerges, I'll set up the amounts so that observing any value makes switching seem beneficial. For example, if a student sees 10 points, they know the other is either 5 or 20, so expected value of switching is (5+20)/2 = 12.5, which is better. This should prompt them to want to switch. In the symmetric case, after switching once, applying the same logic would make them switch back, revealing the paradox. 

  Handling students who know the paradox: assign them as "bankers" to run the pairs, keeping them engaged without spoiling. Predictable issues: students might not calculate expected value properly, or someone might blurt out the paradox early. Mitigations: emphasize not sharing answers, and have the banker role for those in the know. 

  What the activity can't cover: the implicit uniform distribution flaw. The activity uses fixed pairs, so the distribution isn't infinite. Debrief needs to explain that in reality, without a prior distribution, the reasoning fails. Also, the mistake of treating the observed amount as fixed across comparisons—debrief should map this to the students' calculations. 

  Materials: envelopes, slips, a board for tracking. Payoff: points convert to raffle tickets. For example, each point = one ticket, draw for prizes like books or gift cards. 

  Debrief structure: walk through each phase, highlight when students calculated expected value, then show how symmetry makes switching twice irrational, exposing the paradox. Emphasize the hidden pairs and the distribution issue as key teaching points. 

  Overall, this should make the paradox vivid through experience, while the debrief fills in the theoretical gaps. Testing timing and having clear instructions will help it run smoothly. Need to ensure the symmetric case is handled quickly to stay on schedule.
answer: |-
  Here’s how I’d design the activity for your seminar, based on running similar exercises. Gather enough letter-sized envelopes so each pair of students gets two. Inside each pair of envelopes, place slips: one slip with "X" points, the other with "2X" points. Use distinct, non-round values to avoid psychological biases (e.g., 50 and 100 points, 70 and 140 points). Prepare multiple sets with different base values (50/100, 70/140, 90/180, etc.) to obscure the underlying distribution. You’ll also need a master list tracking which pair has which set. For scoring, tell students points earned convert to raffle tickets for small, desirable prizes (e.g., books, gourmet coffee, department swag – funded by a small teaching budget or department funds) at semester’s end. This makes choices feel consequential without cash.  

  Start with a brief intro (10 min): Explain they’ll make choices between envelopes containing different point values, with the goal of maximizing their raffle tickets. Emphasize they should reason individually and record their choices/thoughts privately first before discussing. Pair students up, giving each pair two envelopes (one marked A, one B), emphasizing they don’t know which has more. Phase 1 (15 min): Each student silently chooses one envelope (A or B) *without opening it*. Record initial choices. Phase 2 (15 min): Have students *open their chosen envelope* and see their points (e.g., Student 1 sees 50, Student 2 sees 100 in the pair). Phase 3 (20 min): Offer all students a chance to **switch** to the *other, unopened envelope* in their pair. Stress they know their current points and that the other envelope has either half or double that amount. Give them 2 minutes for silent calculation, then have them write "Stay" or "Switch" privately. Collect decisions. Reveal outcomes: For switchers, open the other envelope and record their final points. For stayers, confirm their initial points.  

  Here’s where the paradox emerges: Most students who see a value V will calculate the expected value of switching as (0.5 * (V/2)) + (0.5 * (2V)) = 1.25V > V, prompting them to switch. During a brief discussion (15 min), ask: "Who switched? Why?" Students will volunteer this 1.25V calculation naturally. Affirm their math but plant doubt: "So switching is always better?" Some might question it now; note that but move to Phase 4 (15 min): The Symmetric Unopened Case. Reset the activity. Give each student *one unopened envelope* (no pairs visible). Tell them their envelope contains either X or 2X points, and another student has the complementary envelope. Offer a switch: If they switch, they get the other student’s envelope. After they decide (record), offer a *second* switch back to their original envelope. Observe their reactions. Typically, students apply the same logic: They see switching once seems beneficial (expected value 1.25 times *something*), but then switching back *again* also seems beneficial by the same math, implying perpetual switching. This contradiction surfaces viscerally.  

  Debrief (30 min) is crucial. Map moments to the paradox: **Hidden pairs** were the fixed (X, 2X) sets assigned to pairs. **The mistake** occurred in Phase 3 when they treated their *observed V* as fixed while comparing it to the unopened envelope’s two possibilities. Highlight that V isn’t fixed across comparisons—it depends on which envelope they picked first! **The symmetry** was Phase 4: Switching once seemed good, but switching twice (back) also seemed good by identical reasoning, which is absurd. **The distribution problem**: Point out that their 50/50 assumption implied every possible V is equally likely, but in reality, V could be 50 (if they picked low) or 100 (if high), and larger Vs are less likely if we imagine a prior distribution—without specifying that prior, the calculation breaks down.  

  For students who know the paradox: Recruit them beforehand as "bankers." They help distribute envelopes, record choices, and calculate payoffs, keeping them engaged but preventing spoilers. They can later share how seeing peers discover it deepened their understanding.  

  Predictable hiccups: First, some students may fixate on the paired nature early, suspecting switching is zero-sum (which it is, but the individual reasoning ignores this). Gently steer them to focus on *their* perspective. Second, a keen student might prematurely articulate the paradox during early discussion. Thank them but say, "Let’s see if the class discovers this structurally." Third, timing is tight; enforce strict silence during decision phases to stay on schedule. Fourth, the raffle payoff feels abstract initially; counter this by showing a physical prize basket.  

  The activity *can’t* fully illuminate: 1) **The infinite expectation pitfall** (if students imagine X can be arbitrarily large, making the 1.25V reasoning seem even more compelling). Debrief by asking: "What if X could be 10, 20, 40, 80...? Would switching *always* be better? Why might that assumption be problematic?" 2) **The Bayesian resolution** requiring a proper prior. The activity’s fixed sets mask this; explain afterward that without knowing how X was chosen, the 50/50 assumption is unjustified. 3) **The non-probabilist intuitions** (e.g., no-regret strategies). This needs supplemental discussion.  

  Run it fluidly, and the visceral surprise when they want to switch twice will cement the paradox. The debrief then transforms that confusion into conceptual clarity. Good luck—it’s a rewarding session when they groan at their own reasoning!
