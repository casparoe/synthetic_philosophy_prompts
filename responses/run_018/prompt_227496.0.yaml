prompt: |-
  You're a moral philosopher who specializes in the ethics of blame, and you've thought alot about the "standing to blame" debate. Think carefully, and before committing to a setup, brainstorm two or three candidate scenarios and show me a sentence or two on why the rejects fail.

  Here's the build I want. Construct a thought experiment where two people blame the same wrongdoer for the same wrong, in the same conversation. Person A is a flat-out hypocrite about exactly this wrong — they've done the very thing they're denouncing, recently, and they're still doing it. Person B has a spotless record on this wrong. The twist I want engineered: the case should make it at least tempting to say that A has standing to blame while B doesn't.

  Hard constraints:
  - Realistic setting — a family, a workplace, a friend group. No thought-experiment machinery, no amnesia, no sci-fi.
  - The scenario itself is one tight paragraph.
  - Neither person's standing may rest on being the victim of the wrongdoing. That's the boring way to get this result; the wedge has to come from each person's relation to the norm being violated, not from who got hurt.
  - A's hypocrisy has to be genuine — the same wrong, not a superficially similar one — and B's innocence has to be genuine too. No cheating by making B secretly complicit or A merely accused.

  After the scenario, do the checks:
  1. Show that a pure non-hypocrisy account of standing (hypocrisy about the wrong in question defeats your standing to blame it) delivers the "wrong" verdicts for both characters: denies A standing, grants it to B.
  2. Show what a commitment- or participation-based view of standing — where standing flows from being genuinely invested in the norm and in holding people to it, rather than from personally complying with it — can seize on in the case to flip both verdicts. Spell out exactly what A has and B lacks in the story.
  3. Name the single detail doing all the work, and say what happens to both verdicts if you strip that detail out.
  4. Steelman the non-hypocrisy theorist's comeback: how would they attack the case, and does their attack end up conceding that mere compliance isn't the same as the kind of relation to a norm that grounds standing?

  Epistemic ask: when you lay out the two accounts, be explicit about what's basically settled ground among people who work on this (e.g., that hypocrisy is at least a pro tanto standing-defeater is widely accepted) versus what's genuinely contested (e.g., whether any commitment-style view can really deliver the flipped verdicts, or whether standing can even come apart from the aptness of the blame's content). Don't present a contested view as the consensus.

  Then, at the very end, give me a compact summary as a JSON object with this exact schema:
  - "scenario_one_liner": string
  - "feature_doing_the_work": string
  - "verdicts": an object with keys "non_hypocrisy_view" and "commitment_view"; each of those is an object with keys "person_A" and "person_B"; each of those is an object with "standing" (true/false) and "reason" (one sentence)
  - "strongest_objection": string — the non-hypocrisy theorist's best counterattack
  - "contested_points": array of strings listing where the literature genuinely disagrees
reasoning: |-
  We are constructing a thought experiment with the following features:
   - Two people (A and B) blame the same wrongdoer for the same wrong in the same conversation.
   - Person A is a hypocrite: they have done the very same wrong recently and are still doing it.
   - Person B has a spotless record regarding this wrong.
   - The twist: it should be tempting to say that A has standing to blame while B does not.
   - Constraints: realistic setting (family, workplace, friend group), no victim-based standing, A's hypocrisy is genuine and same wrong, B is genuinely innocent.

   Brainstorming candidate scenarios and why they might fail:

   Candidate 1: Workplace - Punctuality Policy
     Setting: An office where being late for meetings is frowned upon. The wrongdoer, Charlie, is consistently late.
     Person A: A manager who is often late but preaches against it. 
     Person B: A new employee who is always on time but has never been part of the culture.
     Why it might fail: It might be too easy to say that the manager (A) has standing because of their role, which might conflate authority with standing. Also, B's lack of standing might come from being new, which isn't about the norm per se.

   Candidate 2: Family - Healthy Eating
     Setting: A family where eating junk food is the norm, but the parents are trying to enforce a healthy diet. The wrongdoer is a child sneaking cookies.
     Person A: A parent who preaches healthy eating but secretly eats junk food themselves.
     Person B: A visiting health-conscious relative who always eats healthily.
     Why it might fail: The parent might have standing because they are the parent, and the relative might lack standing because they are an outsider. This might not isolate the norm-relation factor.

   Candidate 3: Friend Group - Keeping Secrets
     Setting: A group of friends has a norm of keeping each other's secrets. The wrongdoer, Dana, has just revealed a friend's secret.
     Person A: A friend who often gossips but is now blaming Dana for the same.
     Person B: A friend who has never revealed a secret and is known for being discreet.
     Why it might fail: It might be too clear that A is a hypocrite and loses standing, while B is the ideal blamer. We need a twist where A has standing and B does not.

   Revised Candidate (chosen after brainstorming):

   Setting: A book club where the norm is to have read the book before the meeting. The wrongdoer, Emma, admits she didn't read the book and instead skimmed summaries online. 

   Person A (hypocrite): Alex, a founding member, who often skims the book but passionately insists on the importance of reading. Alex did it again this month and is still doing it. However, Alex is deeply invested in the club: they organize meetings, remind people to read, and have been the driving force behind the club's existence. They are blaming Emma for skimming, saying it undermines the club's purpose.

   Person B (innocent): Bailey, a new member, who always reads the book thoroughly. Bailey also blames Emma, saying the same thing: that skimming undermines the club.

   The twist: Alex, despite being a hypocrite, might be seen as having standing because they are genuinely committed to the norm (even if they fail) and their life is structured around the book club. Bailey, though compliant, is seen as an outsider who doesn't really understand the club's spirit and is only following the rule mechanically. Bailey's blame feels judgmental and self-righteous, while Alex's blame, even if hypocritical, feels like it comes from a place of caring about the club.

   Now, let's write the scenario in one tight paragraph:

  **Scenario**: In a community book club, Emma admits she didn't read this month's novel but relied on online summaries. Alex, a founding member who frequently skims books yet passionately organizes meetings and enforces the reading norm, criticizes Emma for undermining the club's integrity. Simultaneously, Bailey, a new member who always reads thoroughly but joined only to network and shows no real interest in literature, also condemns Emma. The group feels Alex's admonishment, though hypocritical, stems from genuine investment in the club, while Bailey's identical criticism feels like self-serving grandstanding.

  Now, the checks:

  1. Non-hypocrisy account:
     - Person A (Alex): Hypocrite (has done and still does the same wrong) → no standing.
     - Person B (Bailey): Non-hypocrite (spotless record) → has standing.
     But the scenario tempts us to say the opposite: A has standing, B does not.

  2. Commitment-based view:
     - Standing flows from genuine investment in the norm and holding people to it.
     - What A has: Alex is deeply committed to the book club and its norms. They organize meetings, remind others, and their life is intertwined with the club. Their blame is an expression of their commitment, even if they fail to live up to it. Their hypocrisy might even be seen as a struggle with the norm they endorse.
     - What B lacks: Bailey complies but is not committed. They joined for networking, not out of belief in the norm. Their compliance is instrumental. They don't really care about the norm and thus lack the standing to blame because their blame isn't grounded in a shared commitment to the norm. It's just a rule they follow and use to judge.

  3. The single detail doing the work: 
     - Alex's deep organizational role and history with the club, versus Bailey's instrumental reason for joining (networking) and lack of real engagement with the club's spirit.
     - If we strip that out (e.g., both are equally invested, but one is a hypocrite and the other is not), then the verdicts flip back: A loses standing due to hypocrisy, B has standing because of compliance and equal investment.

  4. Steelman the non-hypocrisy theorist's comeback:
     - They might argue: "The reason Alex seems to have standing is not because of their commitment but because of their role in the club. They are a leader, and leaders have the authority to enforce rules even if they break them. But that's about authority, not moral standing. Moreover, Bailey's lack of standing comes from being an outsider, which is a separate issue about group membership. The core of standing to blame is about not being hypocritical in one's actions. If Alex is a hypocrite, they lose standing. The intuition that Alex has standing is misattributed to their authority or the group's dynamics, but in a moral sense, their hypocrisy should defeat standing. The commitment view confuses the source of the norm (the group's practice) with the conditions for holding someone accountable. One can be committed to a norm and still be a hypocrite, and hypocrisy undermines the moral force of blame."

     - Does this attack concede that mere compliance isn't the same as the kind of relation that grounds standing? 
          Yes, the non-hypocrisy theorist might agree that mere compliance without commitment (like Bailey) might not be sufficient for standing, but they would maintain that non-hypocrisy is necessary. They might argue that commitment without compliance (like Alex) is also insufficient because of the hypocrisy. So they might say that both conditions are necessary: non-hypocrisy and genuine commitment. But then they would have to explain why Alex, who is committed but hypocritical, seems to have standing. The non-hypocrisy theorist might bite the bullet and say that Alex doesn't have standing, and the intuition that they do is mistaken.

  Epistemic ask: Be explicit about settled ground and contested points.

  Settled ground:
  - It is widely accepted that hypocrisy is at least a pro tanto defeater of standing to blame. That is, if you are a hypocrite about the very same wrong, that counts against your standing (even if it doesn't necessarily defeat it conclusively).

  Contested points:
  - Whether a commitment-based view (which focuses on the blamer's investment in the norm) can override hypocrisy and grant standing to a hypocrite who is committed.
  - Whether standing to blame can come apart from the aptness of the blame's content (i.e., the blame might be accurate and deserved, but the blamer might lack standing).
  - Whether non-hypocrisy is necessary and sufficient for standing, or whether other factors (like commitment) can also play a role.

