answer: |-
  ### Scenario
  In a neighborhood recycling cooperative, members commit to properly sorting waste but often cut corners. During a meeting, Chris admits to tossing unrinsed glass jars into the mixed bin to save time. Alex, a founding member who routinely neglects to rinse containers yet spends hours organizing educational workshops and enforcing rules, sharply criticizes Chris for eroding the co-op's mission. Simultaneously, Bailey—a new member who meticulously rinses every item but joined solely for social approval and privately scoffs at environmentalism—chastises Chris for the same violation. The group perceives Alex's rebuke as legitimate (despite his hypocrisy) because it reflects deep commitment to the cause, while Bailey's identical criticism rings hollow as performative judgment.

  ### Checks  
  1. **Non-hypocrisy account verdict**:  
     - *Alex (A)*: No standing (true hypocrite—violates the *exact* norm he condemns).  
     - *Bailey (B)*: Has standing (flawless compliance with the norm).  
     *→ Fails the twist: A lacks standing, B has it—opposite of the intuitive pull.*  

  2. **Commitment-based view verdict**:  
     - *Alex (A)*: **Has standing**. Reason: His blame expresses genuine investment in the recycling norm (organizing workshops, enforcing rules) even amid personal failure, making him a "vested participant" in the practice.  
     - *Bailey (B)*: **No standing**. Reason: Her compliance is purely performative; she lacks authentic commitment to the norm (joins for vanity, scoffs privately), rendering her blame disingenuous.  
     *→ Flips the verdicts by prioritizing normative engagement over compliance.*  

  3. **Critical detail**: Alex’s role as a **founding member who actively builds/maintains the norm** (workshops, enforcement) vs. Bailey’s **instrumental motivation** (social approval).  
     - **If removed** (e.g., both are equally engaged/disengaged): A’s hypocrisy would nullify his standing; B’s compliance would grant standing. The flipped verdicts collapse.  

  4. **Non-hypocrisy theorist's comeback**:  
     > "Alex’s hypocrisy *dissolves* his standing because he implicitly condones the wrong by committing it. His ‘commitment’ is performative—true fidelity would require *not* violating the norm. Bailey’s insincerity is irrelevant; her compliance satisfies the non-hypocrisy condition, so her standing holds. Your intuition that Alex has standing confuses *pragmatic authority* (his co-op role) with *moral standing*."  
     - **Concession**: This attack implicitly grants that mere compliance ≠ normative investment (Bailey’s standing is contested despite perfect compliance), but insists hypocrisy remains fatal.  

  ### Epistemic Groundwork  
  - **Settled**: Hypocrisy is widely accepted as a *pro tanto* standing-defeater (undermines blamer’s credibility).  
  - **Contested**:  
    1. Whether commitment-based views can *override* hypocrisy to grant hypocrites standing.  
    2. Whether standing depends *solely* on the blamer’s normative relation (vs. external factors like authority).  
    3. If "apt blame" (accurate moral judgment) can be detached from "standing to blame" (entitlement to deliver it).  

