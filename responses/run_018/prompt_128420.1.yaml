answer: |-
  **Your inference does not overreach but requires careful contextual framing to avoid overstatement—the tension you identify is philosophically significant yet operates at the meta-level of Frege’s project rather than invalidating his formal system.**  

  ### Key Points Supporting Your Approach  
  1. **Normative Foundations of Anti-Psychologism**:  
     Frege’s anti-psychologism explicitly posits *Gedanken* as mind-independent, eternally true entities accessible to any rational being. This universalism is a *normative presupposition*—not merely a technical feature—of his epistemology. The diary’s ethnocentric remarks (e.g., linking "Jewish thought" to scientific corruption, or democracy to intellectual decline) directly undermine this norm by implying rationality is culturally contingent. This creates an implicit contradiction: if objectivity requires specific cultural conditions, the "any rational being" clause becomes exclusionary.  

  2. **Logicism’s Universalist Ambition vs. Diary’s Particularism**:  
     Your third move is astute: Frege’s logicism asserts that arithmetic truths are discoverable *without* empirical or psychological mediation. Yet the diary’s insistence that "German science" (or similar constructs) is uniquely suited to grasp objectivity introduces an unacknowledged empirical filter. This doesn’t falsify *Grundgesetze*’s proofs but fractures the *philosophical justification* for why those proofs should bind all rational agents.  

  3. **Hilbert Exchange as Amplifying Context**:  
     Your link to the Hilbert debate sharpens the critique. Frege accused formalism of collapsing into psychologism by making truth dependent on human-constructed axioms. But if his *own* framework tacitly restricts rationality to certain cultural groups, he risks a parallel collapse—substituting ethnic bias for psychological contingency. The diary thus exposes a blind spot in his universalist rhetoric.  

  ### Mitigating Concerns  
  - **Evidentiary Gap**: Bridge it by treating the diary not as a "smoking gun" for his philosophy but as *symptomatic* of unresolved tensions in his meta-logical commitments. Emphasize that:  
    - Frege never *systematized* cultural conditions for rationality in his published work.  
    - The diary reveals how his normative ideal (shared rationality) *conflicted* with his unexamined cultural assumptions—a tension latent in the system.  
  - **Alternative Reading ("Transient Despair")**: While politically convenient, this is untenable. The diary’s bigotry is systematic (e.g., framing Jews as "alien to the German people’s essence") and recurs alongside epistemological claims. It reflects a worldview, not momentary frustration.  
  - **Universalism Mischaracterization?**: No—you correctly identify his *ambition* for universal rationality. The diary shows he failed to reconcile this with his prejudices, but the ambition itself remains central to his project.  

  ### Recommendations  
  1. **Reframe "Dependency"**: Avoid claiming Gedanken *depend* on cultural conditions. Instead, argue that Frege’s *accessibility condition* for objectivity is compromised by his exclusionary view of who qualifies as rational.  
  2. **Highlight Meta-Philosophical Stakes**: Stress that this isn’t about formal logic’s validity but about Frege’s *philosophical narrative*—how he grounds logic’s authority in universal reason while privately hedging that universality.  
  3. **Engage Secondary Literature**: Cite Dummett (on Frege’s "ingrained nationalism") or Weiner (on tensions in his rationality ideal) to anchor your claim in existing scholarship.  

  **Bottom Line**: Your thesis is defensible and novel—it exposes a fissure in Frege’s meta-logical scaffolding. By rigorously distinguishing his formal system from its normative justifications, you can persuasively argue that the diary forces a reevaluation of Sinn/Bedeutung’s *epistemological foundations*.
