  But they talk past each other too. Endurantists think perdurantists "cheat" by slicing entities into temporal parts, while perdurantists think endurantists handwave "how" something wholly persists through change. The institutional frame exposes this: is a department a 3D entity enduring through time, or a 4D worm with temporal segments?  

