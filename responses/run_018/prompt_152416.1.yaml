  The cruxes need teeth. Something like: "If we could isolate a *single* instantaneous functional state, could it bear historical properties?" Endurantists say yes (the department *is* its current state plus relations), perdurantists say no (history requires temporal parts). Evidence? Maybe how we attribute past achievements—does "Oxford" today *literally* own Aristotle’s legacy, or just inherit it via causal chains?  

  User’s clearly sharp—they’re avoiding clichés and pushing for applied philosophy. I’ll lean into that rigor. No fluff, just steelmanning both views then forcing them to make falsifiable predictions. British spelling locked in: "organisation," "defence," "travelling."  

  One risk: Don’t let the institutional example become a new Ship of Theseus. Keep it grounded in real academic/government turnover, not abstract swaps. Stress *gradual* change to force confrontation with vagueness—which both theories handle differently.  

