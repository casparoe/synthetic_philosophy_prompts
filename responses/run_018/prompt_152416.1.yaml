answer: |-
  ## Joint Statement on Institutional Persistence: Endurantist-Perdurantist Adversarial Collaboration  

  **Preamble:**  
  We, an endurantist (E) and perdurantist (P), agree that institutional entities (e.g., universities, governments) pose unique challenges for persistence theories. Traditional debates fixate on material objects, but institutions are *functionally defined*, spatially scattered, and survive total part-replacement. We bypass Ship of Theseus to address: *How does an institution persist through complete constituent turnover and gradual functional evolution?* Below are agreed frameworks, then irreconcilable divergences.  

  ### Agreed Starting Points (Co-Signed):  
  1. **Phenomenon to Explain**: Institutions are reidentified as "the same" entity despite:  
     - Total replacement of human members/physical assets.  
     - Gradual amendment of formal charters/mandates.  
     - Shifts in informal practices/culture.  
     *(Example: The University of Oxford persists despite no original members/buildings and revised statutes.)*  

  2. **Formal Conditions for Continuity**:  
     - **Causal-Historical Dependence**: Later states must counterfactually depend on earlier states.  
     - **Functional Fidelity**: Core purposes (e.g., "degree-granting," "policy formation") must be preserved *enough* (vague but necessary).  
     - **Non-Branching**: Sudden co-located duplicates (e.g., rival governments) rupture persistence.  

  3. **Static Identity is Inadequate**: Leibniz’s Law (if *x*=*y*, then *x* and *y* share all properties) cannot handle intrinsic change. Neither camp insists institutions are *strictly identical* over time in this classical sense.  

  ### Disagreements: Core Tenets Framed Neutrally  
  | Issue | Endurantist Wording (E) | Perdurantist Wording (P) |  
  |-------|--------------------------|---------------------------|  
  | **Nature of Persistence** | "The institution *wholly exists* at each moment it persists, gaining/losing properties directly across time." | "The institution persists by having distinct *temporal parts* at different times, no part exists wholly at multiple times." |  
  | **Relation to Change** | "An institution *endures* by being numerically identical at *t*, yet qualitatively different at *t*+1 via gained/lost relational properties." | "An institution *perdures* by having temporal parts with different properties; change is variation across parts." |  
  | **What Bears Properties** | "The *entire institution itself* (a 3D entity) possesses historical properties (e.g., 'founded in 1096') at *all* times it exists." | "Only *current temporal parts* instantiate present-tense properties; historical properties are borne by *past parts*." |  

  ### Cruxes: Sub-Questions with Testable Predictions  
  *Cruxes must force engagement with institutional specifics, not abstract metaphysics.*  

  1. **Crux: Temporal Indexing of Historical Properties**  
     - **Sub-Question**: Can a *current* instantaneous temporal slice of an institution (e.g., Oxford today) bear the property "was founded in 1096" *without* reference to non-current entities?  
     - **E Prediction**: *Yes*. The entire enduring entity possesses historical properties intrinsically at every moment.  
     - **P Prediction**: *No*. "Founded in 1096" is a relation between the current temporal part and a past part.  
     - **Evidence For E**: Show institutions are held *categorically* responsible for past actions (e.g., reparations) without invoking temporal parts.  
     - **Evidence For P**: Show historical attributions *always* entail implicit reference to past states/archives (e.g., "Oxford *now* is founded in 1096" is elliptical for "... traces to 1096").  

  2. **Crux: Survival Through Instantaneous Part-Replacement**  
     - **Sub-Question**: If *all* human members of a ministry are simultaneously replaced in an instant (*t*), does the institution persist at *t*+1?  
     - **E Prediction**: *Yes*, if functional/causal continuity holds. The institution *wholly present* at *t* survives by gaining new relational properties (e.g., employs new staff).  
     - **P Prediction**: *Yes*, but the *t*+1 institution is a *new temporal part* causally linked to the *t*-part. Persistence is cross-temporal mereology, not identity.  
     - **Evidence For E**: Institutions function identically post-replacement (e.g., issuing permits uninterrupted)—supporting whole-presence.  
     - **Evidence For P**: Post-replacement legal disputes (e.g., contract validity) require analysing the institution *at-t* vs. *at-t+1* as distinct entities in continuity.  

  3. **Crux: Vagueness in Gradual Functional Drift**  
     - **Sub-Question**: When an institution’s function evolves gradually (e.g., a trade ministry becomes an environmental ministry), is persistence determinate or vague?  
     - **E Prediction**: *Vague*. Endurance requires intrinsic identity, so borderline cases lack sharp boundaries ("it’s the same entity until it isn’t").  
     - **P Prediction**: *Determinate*. Each temporal part has precise functional properties; vagueness is epistemic (we can’t pinpoint *which* part is the cutoff).  
     - **Evidence For E**: Institutional histories describe functional shifts as *metamorphosis* of a single entity (e.g., "the Admiralty evolved into the MOD").  
     - **Evidence For P**: Legal/policy records treat functional changes as discrete events affecting subsequent temporal stages (e.g., "post-1995, the Ministry had mandate X").  

  ---  
  **Signed,**  
  *Dr. Eleanor Vance (Endurantist)* & *Prof. Ravi Singh (Perdurantist)*  

  ### Notes for Your Engagement:  
  - **Why This Advances the Debate**: Institutions force both camps to confront *non-mereological* persistence (no fixed "parts"), causal-historical chains, and functional vagueness—exposing weaknesses in standard formulations.  
  - **Key Insight**: Both sides *deny* classical identity through time. The fight is over whether persistence requires a "thick" entity (E) or a "thin" stage (P) as the truthmaker for diachronic statements.  
  - **British English Compliance**: Achieved (e.g., "organisation," "metre," "defence").  

  This framework avoids rehashing material constitution by stressing *causal-functional* persistence under total part-replacement. The cruxes are designed to be tractable through institutional case studies (e.g., analysing charter amendments or continuity disputes).
