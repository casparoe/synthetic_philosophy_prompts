  The bioethicists add another layer—they'll dissect every word for academic consistency. The speech must show how theoretical arguments from Taurek's "Should the Numbers Count?" translate to real-world stakes where philosophical errors cost lives. That meta-layer about "burden of being wrong" is crucial: it admits the weight of responsibility without retreating from the position.

  Key structural needs: 
  First, frame the policy change as a moral dilemma where both sides value life profoundly. No villains. 
  Then explain Taurek's non-aggregation without jargon: "one loss felt five times over" vs. "five entirely separate losses." 
  Acknowledge the human cost concretely—"some faces missing today would be here"—but avoid statistics that imply tradeoffs. 
  For grieving families, offer solace through the policy's refusal to quantify their loss: "no arithmetic could shrink your grief." 
  For critics, validate their view as rooted in saving more lives while standing by the lottery's fairness. 
  Close with the humility of implementing philosophy where theories become fates.

  ...And absolutely no sneaky utilitarianism. Even phrases like "hard choices" could imply calculative thinking. The tone must be warm but unflinching—like a doctor delivering a terminal diagnosis with both hands steady.
answer: |-
  ## Keynote Address: Five Years of Choosing Together

  [Stand at podium, pause to make eye contact with different sections of the audience – recipients, donor families, families of the deceased, clinicians, ethicists.]

  Five years ago, we changed the way we allocate one precious, life-saving organ. Today, we mark that anniversary. But this isn’t just about marking time. It’s about looking at the faces in this room, and feeling the weight of the faces *not* here. It’s about choices made under impossible pressure, and the convictions that guide them.

  Before the change, our rules aimed, above all, to save the most lives possible. They looked at age, at prognosis, at the odds. They did this with deep care and the best intentions. Saving more lives is a powerful, good goal. But we asked a hard question: Is that the *only* thing that matters when lives hang in the balance? Or is there something else we owe each other when only one can be saved?

  The question we wrestled with goes something like this: If you could save one person, or save five, does the bigger number automatically win? The old rules said yes. The change we made five years ago rests on a different idea. It comes down to this: Loss isn’t math.

  Think about it. If one person dies, that is one whole world lost. A universe of hopes, loves, memories, potential – gone. If five people die, that isn’t one loss multiplied by five. It is *five* whole worlds lost. *Five* separate universes extinguished. There is no single person suffering "five deaths." There are five individuals, each suffering the complete, absolute loss of everything that matters to them. Each loss is total. Each loss is infinite for the person experiencing it and for those who love them.

  Under the old rules, some people – often younger, with better long-term chances – almost always got the organ. Others, perhaps older, perhaps sicker in ways that affected their long-term odds, even if they desperately needed it *right now*, rarely got a real chance. We asked: Is that fair? Does one person’s potential for more years inherently outweigh another person’s urgent, absolute need *right now*? Does it mean the second person’s life, their whole world, counts for less?

  The lottery we adopted tries to answer "no." It says: Above a threshold of medical urgency and need – the point where a transplant truly offers a chance at life – every candidate faces a similar, terrifying cliff. Each stands to lose everything. And fairness, we argued, demands we acknowledge that terrifying equality. So, we give each eligible candidate a genuine chance – not an equal chance in every case, but a *meaningful* chance, weighted for how urgently they need it now and how long they’ve waited on that cliff's edge. We stopped trying to sum up separate, whole lives into one number that decides who lives and who dies.

  **[Look directly towards families of deceased patients]**

  This means we see you here today, grieving. We see the empty chairs beside you. We know, with painful clarity, that under the old rules, some of your loved ones – identifiable individuals – might be sitting here alive. We also know that some people alive today, celebrating this gift of life, might not be here under the old rules. We changed the rules, and with that change came different outcomes. Different faces are missing. Different faces are here.

  We cannot offer you statistics to ease this pain. We cannot say "more lives overall were saved" or "fewer were saved," because this policy deliberately steps away from that kind of accounting. To offer you that math now would betray the very reason we made the change. It would imply your loved one's loss could be measured against, or outweighed by, someone else's survival. We reject that. Your loss is absolute. Your grief is whole. It is not a smaller number in someone else's sum. The lottery wasn't about producing a better total number. It was about recognizing that each life on that list was facing a total loss, and each deserved a shot. The heartbreaking reality is that not everyone gets that shot in time, no matter the system. Your loss is not diminished; it is profound, and we hold it with you.

  **[Acknowledge resigned colleagues/bioethicists]**

  I know this view is contested. Good people, deeply committed to saving lives – including valued colleagues who left this committee over this change – believe passionately that our duty is always to save as many lives as possible. They see the lottery as turning away from that vital duty, potentially allowing preventable deaths. That conviction deserves respect; it comes from the same place of valuing human life that motivates all of us in this work. We simply disagree on what fairness requires when we cannot save everyone. Reasonable people can weigh these terrible choices differently. This policy isn't the only defensible path, but we believe it *is* defensible – grounded in recognizing the irreducible value of each individual facing oblivion.

  **[To Bioethicists]**

  For those who study the ethics of life and death: Implementing this has been a stark education. Taurek’s argument lives in journals and seminars. But here, it becomes the difference between breath and silence, between a future lived and a future extinguished. The burden of potential error is immense. When a philosophy moves from abstraction to the allocation of a single heart or liver, its stakes become terrifyingly concrete. It forces a humility: You must hold your view strongly enough to act, yet openly enough to acknowledge the profound cost of being wrong, and the valid dissent of those who see the cost differently. It asks if the weight of consequence should alter the conviction, or merely deepen the responsibility with which it is held. Five years in, the question isn’t just "Is the argument sound?" but "Can we bear the world it creates?"

  **[Concluding, to the whole audience]**

  So, what do we mark today? We mark the incredible generosity of donors and their families, whose gifts make any second chance possible. We celebrate the resilience of recipients, living testaments to that generosity and to medical marvel. We hold the profound sorrow of those who lost loved ones waiting, a sorrow no system can erase. And we acknowledge a difficult choice: a choice to see each person on the list not as a data point in a sum, but as a whole world facing darkness, deserving a roll of the dice.

  This policy is an act of radical equality in the face of ultimate inequality – the inequality of chance and biology that puts one life in the path of a gift and leaves another waiting. It is imperfect. It is painful. It makes losses visible that other systems might hide in the aggregate. But it strives, in its imperfect way, to say: When the unthinkable choice arrives, we will not reduce your life, or your loss, to a number. We will see you. We will give you a chance. And when the cruel randomness of scarcity takes its due, we will mourn each loss as the whole and unrepeatable tragedy that it is.

  Thank you.
