prompt: |-
  I dont know if there's a established term for this pattern I keep seeing in talks about art and testimony. Example one: someone says a painting is overwhelming, I look and feel flat, and instead of doubting myself I start doubting whether they actually felt overwhelmed or were just performing connoisseurship. Example two: people defend learning aesthetics from others by comparing it to trusting a scientist, but the comeback isnt that art is subjective - it's that scientists dont fake data for status, while critics might fake awe. So the argument stops being about whether testimony can carry knowledge and becomes about whether we can verify the speaker's emotional state is genuine. Is there an established concept that captures this exact shift from an epistemic worry to a worry about performed sincerity? If not, can you coin something like affective credentialism and say exactly where its edges are - especially how it differs from just not trusting experts? Write the response in American English as a numbered list of exactly five items, each a sentence or two, no intro or conclusion.
reasoning: |-
  Okay, the user is describing a pattern they've noticed in discussions about art and testimony. They give two examples: one where someone claims a painting is overwhelming but the viewer feels nothing, leading them to question if the other person is genuinely moved or just performing expertise. The second example contrasts trusting scientists versus art critics, pointing out that while scientists don't fake data for status, critics might fake awe. The core issue shifts from whether testimony can convey knowledge to whether emotional states are genuine.

  The user wants to know if there's an established term for this shift from epistemic concerns to worries about performed sincerity. If not, they ask for a coined term like "affective credentialism" and want its boundaries defined, especially how it differs from simply distrusting experts. The response needs to be in American English as a numbered list of exactly five items, without introduction or conclusion.

  I recall that epistemic worries concern knowledge acquisition and justification, while sincerity concerns focus on the truthfulness of the speaker's expressed emotions. There isn't a widely recognized term for this specific shift. The closest concepts might be related to testimony epistemology or expressive authenticity, but nothing precisely matches. So coining "affective credentialism" seems appropriate.

  Breaking down "affective credentialism": "Affective" relates to emotions, and "credentialism" refers to evaluating credibility. The term captures the phenomenon where the focus shifts to assessing the genuineness of emotional expressions rather than the content of the testimony. It's distinct from general expert distrust because it specifically targets emotional sincerity rather than competence or honesty in factual claims.

  For the list structure, I'll start by naming the phenomenon, then define the shift, explain the core mechanism, differentiate it from expert distrust, and clarify the boundaries. Each point will be concise—one or two sentences—to meet the user's requirements. This addresses their need for clarity on the concept's edges and differences from broader skepticism.
answer: |-
  Here's the response as requested:

  1.  The established concept closest to describing this shift is the problem of **"expressive sincerity"** within testimony, particularly concerning affective states, but there's no single term capturing this exact epistemic pivot.
  2.  Coining the term **Affective Credentialism** effectively names this phenomenon: it's the specific demand to verify the genuineness of a speaker's expressed emotional experience *before* accepting their testimony about the affective qualities of an object (like art's overwhelming nature) as reliable.
  3.  Affective Credentialism shifts the burden from the *epistemic warrant of the testimony itself* (can someone else's feeling tell me something true about the art?) to a *socio-psychological investigation* of the speaker's interior state and motives (are they *really* feeling that, or just performing?).
  4.  It differs from general expert distrust because it specifically targets the *verifiability and authenticity of subjective emotional responses* presented as evidence, not the expert's technical competence, factual knowledge, or potential bias in objective analysis.
  5.  The key edge of Affective Credentialism is its domain: it applies specifically when the *primary evidence* being offered or questioned is the speaker's own claimed internal affective state (awe, overwhelm), not their interpretation, factual claims about the work, or technical analysis.
