prompt: |-
  hey, i'm mostly a novelist but got pulled into some philosophy-of-art discussion and noticed a weird pattern i dont have a word for. in workshops people keep saying things like "the author put this philosophical view in the mouth of the hero, so they must beleive it, otherwise why include it?" but from actually writing i know you include ideas precisely because they're wrong or dangerous -- thats what makes conflict. the thing is, readers seem to be reasoning backward from a sample thats already filtered: only the dramatic, provocative beliefs make it onto the page, so treating that filtered set as evidence for the author's real beliefs is like counting only the loud birds and concluding all birds are loud.

  it feels structurally like some kind of selection bias where you forget you're inside a curated pool. i think there's an anthropic version of this in philosophy -- something about reasoning from your own existence without accounting for the conditions that make you able to observe -- but i dont know if thats actually the same structure or if i'm forcing the connection. is there an established name for this specific interpretive mistake? not the intentional fallacy, i know that ones about ignoring author intent altogether; this is about using intent but getting the statistics wrong because you ignore the editorial filter. and if its not named, whats the closest analog, and where does the boundary sit between "this character expresses the authors view" and "this character expresses a view selected for narrative tension"?
reasoning: |-
  Okay, the user is a novelist who's been pulled into philosophy-of-art discussions. They've noticed a pattern in workshops where people assume that if a character, especially the hero, expresses a philosophical view, it must be the author's own belief. The user knows from experience that authors often include ideas precisely because they're problematic—they create conflict and drive the narrative. The issue is that readers seem to miss the selection bias: only dramatic or provocative ideas make it into the story, so treating those as evidence of the author's beliefs is like sampling only loud birds and concluding all birds are loud.

  The user mentions an anthropic principle analogy but isn't sure if it's relevant. They're familiar with the intentional fallacy but clarify that this is different. They want to know if there's a specific term for this interpretive mistake or the closest analog. They also ask about the boundary between a character expressing the author's view versus a view selected for narrative tension.

  First, I need to recall relevant concepts. The intentional fallacy is about ignoring authorial intent, but here the problem is misattributing intent due to a biased sample. Selection bias comes to mind—specifically, survivorship bias or cherry-picking. In literature, this could relate to the implied author vs. real author distinction. Booth's concept might be useful here. Also, the anthropic principle involves observer selection effects, which is similar in structure but applied to existence.

  The user's analogy about loud birds is spot-on. Readers are only seeing the ideas that survive the narrative filter, ignoring all the mundane or uncontroversial ideas that were never included. This is classic selection bias. In literary theory, this might connect to debates about authorial voice versus character voice. The challenge is whether there's a specific term for this fallacy.

  I remember that Wayne Booth discussed the "implied author," which is the version of the author constructed from the text, distinct from the real person. However, that's more about interpretation than a fallacy. The user might be describing a specific form of the intentional fallacy where the bias isn't just ignoring intent but misinterpreting due to narrative necessities. Terms like "narrative selection fallacy" or "dramatic necessity fallacy" come to mind, but I'm not sure if they're established.

  Another angle is the principle of charity in philosophy, which advises interpreting others' arguments in the best possible light. Here, readers aren't applying charity; they're assuming alignment without evidence. The user also asks about distinguishing when a character's view is the author's. Factors include textual consistency, paratextual evidence, and how the narrative treats the view. For example, if a hero's flawed view is challenged within the story, it's less likely the author endorses it.

  The anthropic principle analogy is structurally similar: both involve failing to account for the observer's selection bias. In philosophy, this is an observer selection effect. Applying that to literature: the reader exists in a position only to see ideas that pass the narrative filter, thus misjudging the author's beliefs. That's a valid parallel.

  Putting it together, the core issue is a selection bias in interpreting art. While there might not be a single term, combining "selection bias" with literary context makes sense. The boundary between author and character views depends on narrative framing, consistency, and external evidence. The user's insight is important for workshops to prevent shallow readings of texts.
answer: |-
  You've hit on a brilliantly observed and incredibly common interpretive fallacy – one that absolutely stems from a **selection bias** within the narrative context. While there isn't one universally accepted, single-word term for *precisely* this in literary theory, it's well-understood and can be described using several established concepts:

  1.  **Selection Bias / Survivorship Bias (Applied to Narrative Content):** This is the core statistical flaw you identified perfectly. Readers (and workshop participants) are only seeing the ideas that *survived the author's narrative filter*. This filter selects for:
      *   **Conflict:** Ideas that generate disagreement, tension, or debate.
      *   **Drama:** Provocative, extreme, dangerous, or unusual viewpoints.
      *   **Characterization:** Ideas that define a character (often by contrasting them with others or the world).
      *   **Plot Relevance:** Ideas that drive the action forward.
      *   **Thematic Exploration:** Ideas that illuminate the work's central questions, *not* necessarily the author's settled answers.
      The fallacy occurs when this curated, dramatic subset is mistaken for a representative sample of the author's personal beliefs, ignoring the vast landscape of uncontroversial, mundane, or simply non-narratively-useful beliefs that were never included.

  2.  **The Implied Author vs. The Real Author (Wayne C. Booth):** Booth distinguished between:
      *   **The Real Author:** The flesh-and-blood person writing the book.
      *   **The Implied Author:** The version of the author reconstructed by the reader *from the text itself* – the authorial presence, values, and norms *as they appear within the work*.
      The fallacy you describe often involves confusing the *implied author's* thematic exploration or dramatic presentation of an idea (which might involve giving it to a hero for complex reasons) with a direct statement of the *real author's* personal conviction. The implied author might be *exploring* the idea dramatically precisely because the real author finds it complex, dangerous, or worth wrestling with, not because they endorse it simplistically.

  3.  **The Dramatic Necessity Fallacy (Less Formal Term):** This captures the pragmatic reason why the "dangerous" idea is included: because the story *needs* conflict, tension, and opposing viewpoints to function. Assuming the author endorses every provocative idea voiced by a character ignores this fundamental requirement of narrative art. It's like assuming a prosecutor believes the defendant is guilty just because they vigorously argue the case in court – it's their *role*.

  4.  **Observer Selection Effect / Anthropic Reasoning (Your Instinct is Correct):** You nailed the analogy. The anthropic principle (specifically the "self-sampling assumption" or "observation selection effect") deals with reasoning about the universe while accounting for the fact that we can only observe conditions compatible with our existence. Here, the reader can only observe the ideas that were *selected* to be compatible with the existence of a compelling *narrative*. Reasoning about the author's beliefs *without* accounting for this narrative selection filter is structurally similar: you're reasoning from the observed sample (ideas in the text) without acknowledging the bias inherent in what gets observed (only dramatically potent ideas).

  **Why it's distinct from the Intentional Fallacy:**

  *   **Intentional Fallacy:** Argues that meaning resides *only* in the text, and authorial intent is irrelevant or inaccessible. It dismisses the author entirely.
  *   **This Fallacy:** *Acknowledges* the relevance of authorial intent but *misattributes* it based on a biased sample. It tries to infer the author's mind but does so poorly by ignoring the narrative filter. It's a specific *way* of getting authorial intent wrong due to context.

  **The Boundary: When *Might* a Character Express the Author's View?**

  It's rarely black and white, but here are factors that shift the balance:

  1.  **Narrative Framing & Endorsement:** How does the *text itself* treat the idea?
      *   **Authorial View Likelier:** If the idea is consistently presented as wise, true, or victorious within the narrative logic; if it's voiced by a reliable narrator or a character whose judgment the narrative consistently validates; if opposing views are straw-manned or ridiculed; if the narrative resolution affirms it.
      *   **Narrative Tension Likelier:** If the idea is presented as flawed, dangerous, or ambiguous; if the character voicing it has significant flaws or is proven wrong later; if opposing views are given strong, sympathetic representation; if the narrative explores the *consequences* or *complexity* of the idea rather than simply asserting it; if the idea drives conflict but isn't "resolved" in its favor.
  2.  **Consistency Across the Work:** Does this view align with the dominant themes, values, and outcomes presented throughout the author's body of work? Or is it an outlier specifically tied to this character's dramatic function?
  3.  **Paratextual Evidence (Use with Caution):** Do author interviews, essays, or letters explicitly discuss their intent regarding this character/view? (Though these can be unreliable or performative).
  4.  **The "Hero" Trap:** Be especially wary of assuming the *hero's* view = author's view. Heroes are often defined by their struggles, flaws, and *journey*, not by possessing perfect wisdom from page one. Their views can be starting points for growth, sources of their conflict, or even tragic flaws. Giving a view to the protagonist simply gives it maximum dramatic weight and exploration time, not automatic endorsement.

  **In Summary:**

  The interpretive mistake is fundamentally a **Selection Bias** applied to narrative content, specifically ignoring the **Dramatic Necessity Filter**. It conflates the **Implied Author's** thematic/dramatic choices with the **Real Author's** personal beliefs. Your anthropic analogy (Observer Selection Effect) is structurally sound.

  **Closest Established Concepts:** Selection Bias / Survivorship Bias (applied contextually) or a specific manifestation of misunderstanding the **Implied Author**.

  **The Boundary:** Lies in **narrative framing, treatment of opposing views, character reliability/development, thematic consistency, and resolution.** An idea included *for* tension is usually explored in its complexity and consequences, not simply asserted as truth by an unchallenged, flawless mouthpiece. The burden of proof should be on the reader claiming a character's view *is* the author's, not the other way around. Your workshop peers are falling into a very common, statistically naive trap. Your novelist's intuition is spot-on!
