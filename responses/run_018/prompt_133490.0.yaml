answer: |-
  ### Analysis of the Van Meegeren Case

  The 1945 exposure of Han van Meegeren’s forgery—*Christ with the Adulteress*, sold to Hermann Göring as a Vermeer—serves as a compelling test case for the philosophical dispute between **origin-value** (value derived from causal history/authorship) and **experience-value** (value from perceptible properties/aesthetic experience). Below is a disciplined mapping of the episode, application of theory, and identification of theoretical limitations.

  ---

  ### **Parties, Incentives, and Collapses**
  | **Party** | **Options & Incentives** | **What Collapsed Upon Exposure** |
  |-----------|--------------------------|----------------------------------|
  | **Van Meegeren** | **Options:** Confess forgery to avoid collaboration charges; remain silent and risk treason trial. **Incentives:** Survival, fame as master forger. | Market price (worthless), legal status (forgery charge replaced collaboration charge), perceived artistic achievement. |
  | **Abraham Bredius** | **Options:** Authenticate based on stylistic analysis; reject due to anomalies. **Incentives:** Restore Dutch cultural prestige post-WWII; personal legacy as Vermeer expert. | Professional credibility, authentication’s validity. |
  | **Hermann Göring** | **Options:** Acquire "Vermeer" to bolster Nazi prestige; verify provenance. **Incentives:** Cultural vanity, ideological validation of Nazi looting. | Symbolic value (pride in owning "supreme" art), investment value. |
  | **Dutch Authorities** | **Options:** Prosecute van Meegeren for collaboration; investigate forgery claim. **Incentives:** Punish Nazi collaborators, reclaim national dignity. | Legal case (shifted from treason to forgery), moral outrage redirected. |
  | **Dutch Public** | **Options:** Condemn van Meegeren as traitor; celebrate him as anti-Nazi trickster. **Incentives:** National pride, post-war catharsis. | Perception of Göring’s humiliation (national pride restored), aesthetic admiration (replaced by fascination with deception). |

  **Collapses:** All dimensions collapsed simultaneously:  
  - **Market price**: From 1.5M guilders (Göring’s payment) to near-zero.  
  - **Aesthetic admiration**: Shifted from reverence to derision (despite unchanged appearance).  
  - **Legal status**: From "Vermeer" (protected cultural treasure) to forgery (criminal artifact).  
  - **National pride**: Transformed from shame (collaboration) to triumph (fooling Göring).  

  ---

  ### **Theoretical Framework Applied**
  1. **Bredius’s Authentication Credibility**:  
     - **Experience-value theory explains**: Bredius relied on perceptible properties (Vermeer-esque light, biblical subject, "aged" craquelure) and emotional resonance. His authentication ignored forensic analysis, prioritizing subjective experience.  
     - **Origin-value blind spot**: He assumed the work’s provenance aligned with its style, illustrating how experience-value depends *implicitly* on assumed origins.

  2. **Göring’s Prized Possession**:  
     - **Origin-value dominance**: Göring valued the painting as a trophy of Nazi superiority—owning a "Vermeer" symbolized cultural conquest. The experience-value (beauty) was secondary to symbolic origin-value.  
     - **Experience-value role**: The painting’s perceived aesthetic qualities legitimized its display, but its value relied on Vermeer’s authorship.

  3. **Public Outrage (Not Indifference)**:  
     - **Violated origin-value expectations**: The forgery exposed a double betrayal: deception of experts *and* Göring’s humiliation. Outrage stemmed from moral/patriotic dimensions (collaboration, Nazi shame) inseparable from the work’s origin.  
     - **Experience-value insufficient**: Mere aesthetic equivalence could not offset anger at fraud; admiration evaporated when authorship was falsified.

  ---

  ### **Points of Silence or Breakdown in Theory**
  1. **Scientific Detection vs. Aesthetic Equivalence**:  
     - Detection of synthetic phenol-formaldehyde (Bakelite) in binding media and cobalt blue (post-1800s) proved anachronism but did *not* inherently refute aesthetic quality. **Breakdown**: Science exposes fraud without judging aesthetics, challenging experience-value by showing non-perceptible properties (material history) matter.  

  2. **Van Meegeren’s Courtroom Demonstration**:  
     - Painting in Vermeer’s style proved technical skill, not artistic equivalence. **Breakdown**: Experience-value conflates technical mimicry with creative intent. Vermeer’s genius lies in *innovative* composition/light—van Meegeren’s pastiche lacked originality, highlighting origin-value’s role in defining art.  

  3. **Patriotic Celebration as Value Confounding**:  
     - The public’s glee at Göring’s humiliation fused ethics/nationalism with aesthetics. **Breakdown**: Theories treating aesthetic value as "pure" fail—real-world art valuation is entangled with context, morality, and identity.  

  ---

  ### **Episode as Theory Test**  
  - **Confirms origin-value dominance**: The value collapse proves authorship and provenance are *constitutive* of art’s worth. Even if perceptually identical, forgeries lack the historical intentionality that defines art.  
  - **Limits of experience-value**: Aesthetic properties alone could not sustain value once fraud was revealed. The market and public reacted to deception, not visual flaws.  
  - **Unresolved tension**: Does the drop in value reflect an *inherent* aesthetic deficiency (origin as essential) or *extrinsic* social/moral penalties (deception punished regardless of appearance)? Van Meegeren’s forgeries are now studied as art-historical curiosities, suggesting value can be reassigned—but never as "Vermeers."  

  ---

