de a brief structured summary as a JSON object with exactly these fields: 'episode_summary', 'parties_and_incentives', 'theory_applied', 'explanatory_successes', 'points_of_silence_or_breakdown', 'episode_as_theory_test', and 'unresolved_tension'.
