answer: |-
  ### 1. The Full Specification (Requirements for an Adequate Precautionary Framework)
  Any adequate precautionary framework must deliver on these core requirements, motivated by distinct challenges:

  *   **Non-Negotiables (Essential to the Precautionary Core):**
      *   **A1. Address Irreversible Harm:** *Must* differentiate reversible impacts from irreversible/cascading ones (e.g., species extinction, climate tipping points, persistent pollutants bioaccumulating). Failure to prioritize preventing irreversible damage negates precaution's essence.
      *   **A2. Govern Profound Uncertainty:** *Must* handle situations where critical knowledge is absent, distinguishing:
          *   *Type-I Opacity (Parameter Uncertainty):* Knowing the causal pathway but not probabilities/severity (e.g., quantified climate sensitivity range).
          *   *Type-II Opacity (Mechanism Uncertainty):* Not knowing the causal pathway or potential effects at all (e.g., novel engineered organism interactions, unknown metabolites of new chemicals). Precaution specifically targets Type-II and severe Type-I.
      *   **A3. Prioritize Harm Avoidance Over Benefit Pursuit:** *Must* establish a fundamental asymmetry: preventing potential catastrophic harm takes precedence over securing uncertain benefits when facing A1 & A2 conditions. This shifts the burden onto proponents to demonstrate safety/acceptability, not solely on opponents to prove harm.
      *   **A4. Mandate Proactive Investigation:** *Must* trigger obligations for research, monitoring, and adaptive learning to reduce uncertainty (Type-I & Type-II) *before* or *alongside* potentially harmful actions. Ignorance isn't a permanent justification for inaction *or* reckless action.

  *   **Camp-Specific Requirements (Reflecting Values/Beliefs):**
      *   **B1. Free, Prior, and Informed Consent (FPIC):** Requires obtaining consent from potentially affected parties *before* imposing risks (e.g., geoengineering affecting multiple nations, field trials of gene drives impacting communities). Motivated by justice concerns, especially for marginalized groups.
      *   **B2. Strong Intergenerational Equity:** Grants future generations significant weight, potentially approaching a "veto" over actions posing irreversible risks they must bear (e.g., long-lived radioactive waste, permanent ecosystem alterations). Implies a strong asymmetry: present inaction is reversible by future action, but present harmful action is often irreversibly imposed.
      *   **B3. Democratic Deliberation Mandate:** Requires inclusive, transparent public deliberation *before* authorization, especially for novel, systemic, or morally charged interventions (e.g., human germline editing, large-scale solar radiation management). Prioritizes legitimacy over speed.
      *   **B4. Strict Liability/Redress:** Mandates robust mechanisms for compensation and remediation if harms materialize despite precaution, placing financial/operational burden on proponents (e.g., polluter-pays principle for novel chemicals).

  ### 2. The Conflicts (Jointly Unsatisfiable Subsets)
  Two key conflicts arise between requirements:

  1.  **Democratic Deliberation (B3) vs. Acting Before Evidence Window Closes (A1/A2):** Thorough, inclusive deliberation (B3) is inherently time-consuming. Yet, for threats involving potential irreversible tipping points or rapidly escalating risks (A1 – e.g., climate feedback loops nearing activation), delaying action until deliberation concludes risks crossing critical thresholds ("closing evidentiary window" meaning the point where action becomes ineffective or too late). A framework mandating both full B3 *and* timely action under severe A1/A2 faces a fundamental tension: one may necessitate compromising the depth or breadth of deliberation, or accepting a higher risk of irreversible harm.

  2.  **Strong Intergenerational Equity/Veto (B2) vs. Standard Risk Analysis Symmetry:** B2 creates a profound temporal asymmetry: present actors can choose inaction (preserving future options), but cannot impose irreversible burdens that future actors cannot undo. Standard risk analysis typically assumes symmetrical agency and tradable risks/costs across time (via discounting). B2's inherent asymmetry – prioritizing future avoidance of irreversible harm over present pursuit of benefits – fundamentally conflicts with symmetric cost-benefit approaches. Attempting to "price" this strong intergenerational protection within standard risk analysis often collapses B2 into a heavily discounted cost, negating the intended veto-like protection and the core precautionary asymmetry (A3).

  ### 3. The Scorecard (Evaluating Common Formulations)

  *   **Weak Precaution (Cost-Benefit + Uncertainty Weighting):** Fails **A1 (Irreversible Harm)** – treats irreversible damage as just another cost, discountable. Fails **A3 (Harm Avoidance Asymmetry)** – maintains benefit-pursuit symmetry. Fails **B2 (Strong Intergen. Equity)**. May inadequately address **Type-II Opacity (A2)** if weighting factors aren't sufficiently severe.
  *   **Strong Precaution (Prohibition Without Proof of Safety):** Fails **A2 (Profound Uncertainty)** – conflates Type-I and Type-II opacity, demanding impossible proof for novel interventions. Fails **A4 (Proactive Investigation)** – can incentivize maintaining ignorance to avoid the proof requirement ("paralysis by proof"). Fails **B1 (FPIC)** and **B3 (Deliberation)** if applied as a blunt ban without process. Struggles with **A1** when inaction *itself* poses irreversible risks (e.g., delayed climate mitigation).
  *   **Reversibility Threshold Models (Middle Path):** Fails **A1 (Irreversible Harm)** for actions deemed "reversible" but where reversal is practically, economically, or ecologically infeasible. Fails **B1 (FPIC)**/ **B3 (Deliberation)** if reversibility assessment is purely technical. Fails **A3 (Asymmetry)** if reversibility lowers the bar for action too much. May inadequately address **Type-II Opacity (A2)** if reversibility is assumed prematurely. Often ignores **B2 (Strong Intergen. Equity)** beyond basic discounting.

  ### 4. The Residue (Value of Key Distinctions)
  The distinctions are **not artificial; they expose critical gaps** in standard formulations:

  *   **Type-I vs. Type-II Opacity:** This distinction is crucial. Type-I (parameter uncertainty) *can* sometimes be managed with enhanced probabilistic risk assessment. Type-II (mechanism uncertainty) fundamentally challenges risk assessment's foundations. Standard formulations (especially Weak PP) often ignore Type-II or treat it as severe Type-I, leading to inappropriate quantification and underestimation of true precautionary need. Strong PP often fails by demanding "proof" equally for both.
  *   **Intergenerational Veto Asymmetry:** This asymmetry exposes a core ethical limitation of standard risk analysis (including Weak PP) and simplistic reversibility models. Discounting future irreversible harms treats them as less significant than present costs, violating the core precautionary intuition (A3) and strong equity concerns (B2). It highlights that standard frameworks lack adequate tools to represent the *moral irreversibility* of imposing unconsented, unavoidable burdens on the future, regardless of technical reversibility. This asymmetry is fundamental to the precautionary impulse regarding long-term threats.
