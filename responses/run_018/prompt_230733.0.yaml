answer: |-
  Below is a comprehensive design for your 90-minute seminar game simulating the Hayek-Lange debate. The game forces students to confront Hayek's core argument about **dispersed knowledge** while testing Lange's **trial-and-error** solution. I've included roles, rules, payoffs, timing, debrief points, and practical warnings.

  ---

  ### **Game Setup: "The Widget Economy"**
  **Objective:** The Central Planning Board (CPB) must set a price for "widgets" to balance supply/demand without knowing local costs or preferences. Firms/households act on private information.

  **Roles & Participants** (18 students):
  - **Central Planning Board (CPB):** 1 student.  
    *Task:* Set widget price (initially and after feedback) to minimize shortages/surpluses.  
  - **Firm Managers:** 8 students.  
    *Private Info:* Marginal cost (MC) and production capacity.  
    *Task:* At the CPB's price, decide how much to produce (if P ≥ MC, produce at capacity; else, produce 0).  
  - **Households:** 9 students.  
    *Private Info:* Demand curve (Q_demand = 5 – ⅓P).  
    *Task:* At the CPB's price, calculate and "buy" desired quantity.  

  **Parameters** (Pre-set by Instructor):  
  - **Firms:**  
    - *High-cost:* MC = $3, Capacity = 2–3 units (e.g., 2 firms).  
    - *Mid-cost:* MC = $2, Capacity = 5 units (e.g., 3 firms).  
    - *Low-cost:* MC = $1, Capacity = 4–6 units (e.g., 3 firms).  
    *Total Supply at P≥3:* 30 units.  
  - **Households:**  
    - Each has demand: Q = 5 – ⅓P. At P = $3, each buys 4 units (total demand = 36).  
    - At P = $6, each buys 3 units (total demand = 27).  
  - **Equilibrium Price:** $5 (total supply = 30, total demand = 30).  

  ---

  ### **Rules & Payoffs**  
  **Key Constraints:**  
  1. No communication except quantity reports to CPB.  
  2. CPB sees **only** aggregate supply/demand, not individual costs/demands.  
  3. **Imbalance Penalty:** $2 per unit of shortage/surplus (applies to all).  

  **Payoffs (Maximize Individual Welfare):**  
  - **Firms:** Profit = (P – MC) × Quantity Produced.  
  - **Households:** Consumer Surplus = [Max Value – P] × Quantity Bought.  
    *(Simplified: Max value = $15/unit; e.g., at P=$5, surplus = ($15–$5) × 3.33 = $33.33)*.  
  - **CPB:** Social Welfare = Total Firm Profit + Total Consumer Surplus – |Imbalance| × $2.  

  ---

  ### **Game Flow** (Total: 90 Minutes)  
  1. **Introduction (10 min):**  
     - Explain roles, rules, and objectives.  
     - Emphasize **private information** (firms/households can’t share cost/demand details).  
     - Distribute role cards with private info.  

  2. **Round 1: Hayek’s Challenge (25 min)**  
     - CPB sets **initial price blindly** (no data).  
     - Firms/households calculate production/consumption:  
       - *Firms:* Produce if P ≥ MC (e.g., at P=$4, only MC≤$4 firms produce).  
       - *Households:* Q_bought = max(0, 5 – ⅓P).  
     - **Report:** Quantities submitted to CPB.  
     - **CPB calculates:**  
       - Total supply, total demand, imbalance.  
       - Social welfare (instructor assists with spreadsheet).  
     - *Predictable Outcome:* Severe imbalance. Example at P=$4:  
       - Supply: 30 units (all firms produce).  
       - Demand: 9 × (5 – 4/3) = 33 units → **3-unit shortage**.  
       - Welfare: Low due to imbalance penalty.  

  3. **Round 2: Lange’s Trial-and-Error (25 min)**  
     - CPB sees Round 1 imbalance and **adjusts price** (e.g., raises P if shortage).  
     - Repeat production/consumption/reporting.  
     - **CPB calculates** new welfare.  
     - *Predictable Outcome:*  
       - If CPB sets P=$5 (equilibrium), supply=demand=30 → high welfare.  
       - If CPB overadjusts (e.g., P=$6), supply=30, demand=27 → **3-unit surplus**.  

  ---

  ### **Debrief & Link to Theory** (30 min)  
  **Guide the Discussion:**  
  1. **Hayek’s Point (Dispersed Knowledge):**  
     - "Why couldn’t the CPB set the right price initially?"  
     - Highlight that **no amount of computation** can overcome missing local knowledge (e.g., a high-cost firm hiding in silence when P=$6).  
     - Key Quote: *"The problem is not assigning resources ‘correctly’ but discovering what ‘correct’ is."*  

  2. **Lange’s Reply (Trial-and-Error):**  
     - "Did feedback help? What worked or failed?"  
     - Note that **one adjustment rarely suffices** (e.g., overcorrecting from P=$4→$6).  
     - Stress: Lange assumes firms/households **honestly report** and costs/demands **stay fixed**—both unrealistic.  

  3. **Limitations of the Game:**  
     - **Static Economy:** Real-world conditions change during CPB adjustments (Hayek’s dynamic critique).  
     - **No Incentive to Lie:** Lange assumes perfect obedience; markets punish dishonesty.  
     - **Single Good:** Misses interlinked resource allocation (e.g., widgets needing steel).  

  4. **Bigger Picture:**  
     - Markets as **information-aggregating mechanisms**: Prices condense scattered knowledge.  
     - Socialism’s **practical hurdle**: Even with good intentions, local knowledge can’t be "reported" without distortion.  

  ---

  ### **What Will Go Wrong (and How to Mitigate)**  
  1. **Time Crunch:**  
     - Firm/household math may slow Round 1. **Fix:** Pre-calculate examples; use calculators.  

  2. **CPB Indecision:**  
     - CPB may dither on price-setting. **Fix:** Cap decision time (3 min/round).  

  3. **Over-Simplification:**  
     - Students may dismiss imbalance penalties as "unrealistic." **Fix:** Pre-game lecture on Hayek’s "knowledge problem" > computation.  

  4. **Equilibrium Not Reached:**  
     - CPB rarely hits P=$5. **Use this!** Debrief why trial-and-error is fragile.  

  ---

  ### **What the Game Can’t Simulate (Explain Verbally)**  
  1. **Dynamic Change:**  
     - Hayek: Local knowledge evolves constantly; CPB is always behind.  

  2. **Incentive Problems:**  
     - Lange’s model ignores that firms/households may **misreport** to manipulate prices.  

  3. **Multi-Good Complexity:**  
     - Adjusting widget prices affects steel demand, labor costs, etc.—**interdependencies explode CPB’s task**.  

  ---

  **Materials Needed:** Role cards, calculators, spreadsheet for welfare math, timer. This game makes abstract theory visceral—students *feel* the knowledge problem. Lean into the chaos!
