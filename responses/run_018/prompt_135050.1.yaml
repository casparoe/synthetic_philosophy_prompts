answer: |-
  You're absolutely not daft—you've pinpointed the most persistent criticism of Kuhn! Your physicist's instinct for logical tension is spot on. The apparent contradiction arises from a subtle (and often debated) nuance in Kuhn's concept of incommensurability. Let's break down where the confusion typically lies and resolve the tension:

  1.  **Incommensurability ≠ Total Semantic Breakdown:** Your suspicion here is correct. Kuhn *did not* mean that paradigms are utterly incomprehensible to each other like alien languages with *no* shared concepts. He meant **localized meaning variance** and **holistic restructuring**.
      *   **Local, Not Global:** Incommensurability primarily affects the **core theoretical terms** and their **relationships**. For Newton, 'mass' is invariant, conserved, and distinct from energy. For Einstein, 'mass' is equivalent to energy, varies with velocity, and bends spacetime. The *meaning* of 'mass' is fundamentally different. Similarly, 'space', 'time', 'force', and 'gravity' undergo radical redefinition. Trying to translate Einsteinian 'mass' directly into Newtonian terms using the *old* meaning leads to nonsense or contradiction.
      *   **Holistic Restructuring:** It's not just single words; it's the *entire network* of concepts and their logical/metaphysical connections. Newton's absolute space/time vs. Einstein's spacetime curvature isn't just swapping definitions; it's replacing the underlying ontological furniture and the rules for how concepts interact. The "lexical taxonomy" (the categories and how they relate) is reconfigured.

  2.  **Puzzle-Solving is *NOT* Paradigm-Neutral:** This is the crucial point often missed. **What counts as a puzzle, what counts as a solution, and what counts as "successful" solving are defined *within* the paradigm.**
      *   **Internal Measure:** Kuhn isn't saying Einstein solves puzzles *defined by Newton* better than Newton did. He's saying that within the *Einsteinian paradigm*, scientists identify specific problems (puzzles) that *arose as anomalies within the Newtonian paradigm* but which *could not be solved within the Newtonian framework*. Crucially, the *Einsteinian paradigm provides solutions to these problems that satisfy the standards and expectations of the Einsteinian community.*
      *   **The "How" vs. the "What":** Newtonians had the puzzle: "Why does Mercury's perihelion precess slightly more than predicted by Newtonian gravity + known planets?" They tried various solutions within their framework (Vulcan, perturbations) and failed. Einsteinians had the puzzle: "Apply General Relativity to planetary orbits." The solution (spacetime curvature around the sun) *automatically* accounted for Mercury's precession. **The *empirical discrepancy* (Mercury's orbit) is shared.** The *conceptualization* of the puzzle and the *nature* of the solution are paradigm-bound. The *existence* of the unsolved anomaly is a historical fact recognized by both, but *why* it was unsolvable and *how* it got solved only makes sense within the respective paradigms.

  3.  **Progress as Resolution of Anomalies (Internal & Pragmatic):** Kuhn's "progress" isn't progress *towards truth* (a neutral, external goal), but progress *away from crisis*. A new paradigm is adopted because:
      *   The old paradigm accumulated persistent, recalcitrant anomalies causing a crisis state.
      *   The new paradigm offers solutions to *some* of these key anomalies.
      *   The new paradigm is more fruitful, opening up new lines of research and puzzles to solve.
      *   The new paradigm offers a more coherent and satisfying worldview *for those working within it*.
      This "solves puzzles the old one couldn't" is a **pragmatic and historical assessment.** It doesn't require a neutral dictionary; it requires recognizing that the *old* community hit a wall with specific problems, and the *new* community, operating under different rules, found ways to dissolve or resolve those problems to their own satisfaction.

  **Where Your Confusion Lies (Resolved):**

  1.  **Overextension of Incommensurability:** You initially leaned towards seeing it as a "total semantic breakdown." Kuhn meant it as a **partial, localized meaning variance** affecting core concepts and their network, not the complete impossibility of communication or recognizing shared empirical referents (like planetary positions).
  2.  **Misplaced Neutrality of Puzzles:** You suspected a "hidden assumption about puzzle-solving being paradigm-neutral." This is the core. Kuhn **explicitly denies** this. Puzzles and their solutions are fundamentally paradigm-dependent. The "comparison" happens *historically*: we see that anomalies caused crisis in Paradigm A, and Paradigm B, once adopted, successfully addressed them *according to Paradigm B's own standards*. The "accuracy" lies in resolving the empirical tension *within the new framework*, not in matching some eternal Platonic truth measured by a neutral ruler.

  **The Analogy Refined:**

  Think less "comparing two languages with no dictionary" and more like **comparing two complex games with different rules.** Imagine Chess and Go.

  *   **Incommensurable?** Yes, in key ways. The concept of "capturing a piece" means utterly different things. The strategic goals, board structure, and fundamental units (pieces vs. stones) are radically different. You can't directly translate a Go strategy into Chess moves using a simple dictionary.
  *   **Can one "solve puzzles" the other can't?** Absolutely, *within the context of the game.* Chess has puzzles like "checkmate in 3 moves" that are meaningless in Go. Go has puzzles about "saving a group" that are meaningless in Chess.
  *   **Is Go "better" than Chess?** Not in any absolute, neutral sense. But if a community was deeply frustrated by the limitations of Chess strategy (its "anomalies"), and someone invented Go which offered richer strategic possibilities on a different board with different rules (solving the "crisis"), then *for that community*, adopting Go represented progress. They could point to specific Chess problems that were intractable within Chess but dissolved or found elegant solutions within the Go framework *as defined by Go players*.

  **Your Physicist's Insight:** You intuitively grasp the profound shift in meaning of core terms like 'force' or 'mass'. Kuhn argues that this shift prevents a simple cumulative, truth-approximating view of progress. However, he *also* recognizes the undeniable *practical* success of new paradigms in overcoming the specific stumbling blocks that crippled the old ones. The "contradiction" dissolves once you see that the comparison happens *historically* (crisis resolved vs. not) and *pragmatically* (fruitfulness for research) **within the context of the paradigms themselves**, not by an external, neutral metric requiring direct translation. The progress is real, but its nature is relative to the conceptual frameworks involved.
