  Also, they mention puzzle-solving as a paradigm-neutral criterion. But Kuhn argues that what counts as a puzzle and a solution is paradigm-dependent. However, anomalies that resist solutions within a paradigm can lead to crisis. So the comparison is about how each paradigm handles its own defined puzzles, not an external standard. 

  The user’s background as a physicist is key here. They’re used to precise definitions and measurable progress. Kuhn’s ideas challenge that by saying progress isn’t linear. They might be seeking validation that their understanding isn't "daft" and a clear resolution to the apparent contradiction. 

