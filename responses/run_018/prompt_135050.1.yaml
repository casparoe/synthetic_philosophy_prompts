  Ive been a physicist for thirty-odd years and since retiring Ive picked up philosophy of science. Reading Kuhn, I think Ive spotted a contradiction, but probably Im being daft. He says paradigms are incommensurable, which I take to mean that when we moved from Newton to Einstein, the very concept of 'force' dissolved — not just revised, but literally untranslatable within the old lexical taxonomy, like weighing a shaddow in kilogrammes. So if theres no shared metric between paradigms, how can Kuhn also claim that later ones solve puzzles the old ones couldnt? That sounds like comparing two languages with no dictionary and declaring one more accurate. Is my error treating incommensurability as total semantic breakdown rather than local restructuring of kind terms, or is there a hidden assumption about puzzle-solving being paradigm-neutral? Id like to understand where the confusion lies without just being told to read more Kuhn.
