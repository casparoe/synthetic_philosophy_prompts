  ## Charter of the Free and Self-Defining Township of Waxhaven

  **BE IT ENACTED,** by the inherent authority herein established and confirmed, that the inhabitants of the territory formerly known as the Waxhaven Plantation, and henceforth constituted as a body politic and corporate under the name of the **TOWNSHIP OF WAXHAVEN**, do hereby ordain and establish this Charter as the supreme and foundational law of the Township.

  **SECTION 1. Incorporation and Retroactive Validation.**
  The Township of Waxhaven is hereby declared a municipal corporation, possessing all powers, privileges, and immunities incident to such corporations under the common law and statutes of this Commonwealth, *as interpreted by the courts established herein*. All acts performed prior to the enactment of this Charter by persons claiming to act on behalf of Waxhaven are hereby ratified and validated, provided such acts would have been valid *had this Charter been in force at the time of their performance*, as determined by the Clerk appointed under Section 3.

  **SECTION 2. Territorial Boundaries.**
  The boundaries of the Township shall be those described in the Surveyor's Plat dated Anno Domini Seventeen Hundred Seventy-Four, deposited with the Clerk appointed under Section 3, and authenticated by the Seal described in Section 4. Any dispute concerning boundary interpretation shall be resolved by the Court established in Section 10, whose jurisdiction is hereby invoked for such purpose.

  **SECTION 3. Appointment of Town Clerk.**
  There shall be a Town Clerk, appointed by majority vote of the inhabitants present at the First Town Meeting convened under Section 6. The Clerk shall serve at the pleasure of the Township, as embodied in the decisions of the Court established under Section 10. The Clerk's signature shall authenticate all official acts, records, and the Seal of the Township.

  **SECTION 4. The Corporate Seal.**
  The Seal of the Township of Waxhaven shall depict two human hands, each holding a stylus, engaged in the act of drawing the other hand into existence upon a parchment bearing the words "Charter of Waxhaven". This Seal shall only be affixed to documents bearing the countersignature of the Clerk appointed under Section 3, and its impression shall constitute prima facie evidence of the authenticity and binding force of any document so sealed.

  **SECTION 5. Effect of Sections 1-4.**
  Sections 1 through 4 of this Charter shall take full force and effect only upon the countersignature of the Town Clerk appointed under Section 3 upon this document, which countersignature shall be affixed at the First Town Meeting convened under Section 6.

  **SECTION 6. First Town Meeting.**
  A meeting of the inhabitants of the Township shall be convened on the first Monday following the enactment of this Charter, at the hour of ten o'clock ante meridiem, at the Meeting House located within the boundaries described in Section 2. Notice of said meeting shall be posted by the individual who, by common consent prior to enactment, has acted as de facto Clerk, such notice to be considered valid solely for the purpose of convening this First Meeting. The primary business of this Meeting shall be the appointment of the Town Clerk per Section 3 and the countersignature of this Charter per Section 5.

  **SECTION 7. Date of Enactment.**
  This Charter is declared enacted and in full force as of the precise moment the countersignature of the Clerk appointed under Section 3 is affixed pursuant to Section 5. That date and time shall be recorded by the Clerk in the margin of this original document and shall constitute the official Date of Enactment for all purposes under this Charter and the laws promulgated hereunder.

  **SECTION 8. Supremacy of Charter.**
  This Charter constitutes the supreme law of the Township of Waxhaven. Any ordinance, bylaw, regulation, or act of any officer, board, or court of the Township inconsistent herewith is null and void. The determination of inconsistency rests solely with the Court established in Section 10.

  **SECTION 9. Powers of the Township.**
  The Township of Waxhaven shall possess and may exercise all municipal powers necessary or convenient for the management of its affairs, *as such powers are defined by the courts established herein*, including but not limited to the power to tax, to enact ordinances, to acquire and hold property, to sue and be sued in its corporate name, and to perform all acts not repugnant to this Charter or the Constitution and laws of this Commonwealth, *as interpreted by the courts established herein*.

  **SECTION 10. Establishment of the Court of Foundational Review.**
  There is hereby established the Court of Foundational Review. This Court shall consist of three Justices. The first Justice shall be appointed by the Selectboard elected under ordinances enacted pursuant to Section 9. The second Justice shall be appointed by the Town Clerk appointed under Section 3. The third Justice shall be appointed by a majority vote of the sitting Justices. The Court of Foundational Review shall have exclusive jurisdiction to hear and determine all questions concerning the validity, interpretation, application, or amendment of this Charter, including disputes regarding the validity of its own establishment or the appointment of its Justices, and the validity of any act performed under color of this Charter prior to its full enactment per Section 7. Its decisions on such matters shall be final and binding upon all officers, inhabitants, and instrumentalities of the Township.

  **SECTION 11. Self-Validation of Acts.**
  Any act performed by any officer, board, court, or meeting of the Township which relies for its validity upon the prior existence or validity of this Charter, or any provision therein, shall be deemed valid *ab initio* provided the Court of Foundational Review, upon petition, subsequently affirms that such act *would have been* valid had the Charter or the relevant provision been demonstrably in force at the time of the act, *applying the standards of validity established by the Court itself*.

  **SECTION 12. Amendment.**
  This Charter may be amended by a three-fourths vote of the inhabitants present and voting at a Town Meeting duly warned for that purpose. The warning for such meeting must specify the exact text of the proposed amendment. Any amendment so adopted shall take effect immediately upon the Clerk's certification of the vote, which certification shall be appended to this Charter. *The provisions of this Section 12 may themselves be amended by the procedure herein described.*

  **SECTION 13. Dissolution.**
  The Township of Waxhaven may be dissolved only by an Act of the Legislature of the Commonwealth, approved by the Governor, or by a decree of a court of competent jurisdiction within the Commonwealth, *provided that the jurisdiction of such court is not successfully challenged before the Court of Foundational Review*. Upon dissolution, all assets and liabilities shall devolve as provided by the general laws of the Commonwealth concerning dissolved municipal corporations.

  [Below Section 13, a space approximately 3 inches in diameter is left blank. Below the blank space, centered, is the following text:]

  *(Affix Corporate Seal Here)*

  [In the bottom right margin, in small, neat handwriting different from the main text:]
  *For the Printer: Use Mandate Press mark per proofs. Clerk refused seal. Authority? – J.P.*

  ---

  **Appendix: On Representation of the Distinction**

  I am highly confident the document captures the core tangled hierarchy/inviolate level distinction central to Hofstadter's "strange loop" concept. The loop is formed by mutual dependencies: the Clerk (Sec 3) is needed to enact earlier sections (Sec 5), but the Clerk is only appointed (Sec 3) at a Meeting (Sec 6) convened under the Charter itself. The Court (Sec 10) adjudicates the Charter's validity but is created and staffed by it. The Seal (Sec 4) depicts its own creation within the document it authenticates. The amendment clause (Sec 12) explicitly self-amends. The "intrusion" – the unfilled seal space and the marginal printer's note questioning authority – represents the necessary, unabsorbed "outside" (the physical document, the printer, the state legislature hinted at in Sec 13).

  The claim I'm least sure of is whether mentioning a "superior authority" (the Commonwealth Legislature/Courts in Sec 13) *within* the text fully preserves the inviolate level's externality, or if it risks partially absorbing it into the Charter's *conceptual* framework by acknowledging its possibility. Hofstadter might argue the *acknowledgment* of an outside force is still an internal model.

  The piece knowingly exaggerates by making *every* foundational element (date of enactment, validation of prior acts, boundary definition, judicial review) entirely self-referential. Real charters bootstrap pragmatically but rely implicitly on pre-existing legal/social frameworks. This parody makes that implicit reliance explicit *and* then attempts to swallow even that framework via the Court and retroactive validation clauses (Sec 1, 7, 11), pushing the loop to its logical extreme for satirical effect. The humor relies on this maximalist approach to the tangled hierarchy.
