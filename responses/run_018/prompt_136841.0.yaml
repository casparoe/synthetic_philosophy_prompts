  okay so for my ethics class i'm trying to figure out if there's actually one principle behind all my gut reactions to abortion-type cases, or if i'm just being consistant by accident. here's what i think: thomson's violinist case, where you're hooked up to save that famous violinist for 9 months - i say unplugging is totally fine. but if it's only 9 minutes? still fine, i guess. then there's the future-like-ours argument - i think killing a fetus is wrong because it has a future like ours. but i also think killing a coma patient who'll wake up in 10 years with that same future is wrong, even if it saves 5 people with organs.

  now here's the weird case i made up: imagine there's a machine that grows a "potential person" inside you for 9 months, and they come out with a full future like ours. if you never agreed to this, i think you can refuse to be hooked up, even though it kills them. but if you DID sign the consent form, then backing out at month 6 feels wrong. also accidental pregnancy vs planned - accidental, abortion feels okay; planned where you promised to carry, then backing out at month 7 feels not okay. but wait, in the violinist case you didn't consent, and unplugging is okay - but what if you woke up hooked up with no memory of how it happened? i think you can still unplug after 1 minute, but not after 8 months? that's the one i keep going back and forth on, the 1-minute vs 8-month accidental hook-up. can someone lay out what principle gets all of these, or tell me which ones i have to drop? and what does that principle say about the machine case if you signed up but then found out it was actually 18 months instead of 9?
