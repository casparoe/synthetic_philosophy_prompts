answer: |-
  ### Decision-Tree Taxonomy for Moral Distinctions in Prior-Causation Cases

  **First Branch**: Does prior causal involvement dissolve the doing/allowing distinction?  
  - **Yes**: The distinction is dissolved due to prior cause.  
  - **No**: The distinction persists; proceed to second branch.  

  **Second Branch** (only if first branch is "No"): Does sustaining the distinction require a direct bodily motion, or can it survive in omissions that merely preserve an existing trajectory?  
  - **Direct Bodily Motion (DBM)**: Only acts involving direct physical intervention count as "doing" (killing); omissions are always "allowing" (letting die).  
  - **Omissions as Doing (OAD)**: Omissions that preserve an existing causal trajectory can count as "doing" (killing) under certain conditions.  

  **Third Branch** (only if first branch is "No"): Do identical outcomes across killing and letting-die options eliminate the moral distinction entirely?  
  - **Yes**: Moral equivalence holds if outcomes are identical.  
  - **No**: Moral distinction persists even with identical outcomes.  

  ---

  ### Leaf Classifications and Awkward Commitments  
  1. **First Branch: Yes**  
     - **Leaf 1**: **Causal Dissolution View** (e.g., certain consequentialist or responsibility-focused positions)  
       - *Awkward commitment*: Must deny any moral difference between pushing someone into a lethal machine (killing) and refusing to divert the machine after having built it (letting die), even if one act feels intuitively more direct.  

  2. **First Branch: No → Second Branch: DBM → Third Branch: Yes**  
     - **Leaf 2**: **Unnamed**  
       - *Awkward commitment*: Must assert that outcomes alone determine morality in prior-cause cases, yet paradoxically maintain that a direct bodily motion (e.g., flipping a lethal switch) is definitionally distinct from inaction—even when both produce identical deaths.  

  3. **First Branch: No → Second Branch: DBM → Third Branch: No**  
     - **Leaf 3**: **Standard Doing/Allowing Distinction** (e.g., Foot, Quinn)  
       - *Awkward commitment*: Must defend why diverting a threat via bodily motion (killing) is worse than allowing death via omission, even when outcomes are identical and the agent caused the threat, potentially leading to "agent-centered" paradoxes where harm is preferred over equivalent harm.  

  4. **First Branch: No → Second Branch: OAD → Third Branch: Yes**  
     - **Leaf 4**: **Unnamed**  
       - *Awkward commitment*: Must concede that identical outcomes erase the moral difference between omission-as-killing (e.g., sustaining a lethal status quo) and active killing, yet still classify omissions as "killings" in a way that feels redundant or question-begging.  

  5. **First Branch: No → Second Branch: OAD → Third Branch: No**  
     - **Leaf 5**: **Robust Doing/Allowing with Omission Liability** (e.g., revisionist views)  
       - *Awkward commitment*: Must argue that an omission preserving a deadly trajectory (e.g., not resetting a device one activated) is morally distinct from active killing, despite both being "doings" and yielding identical deaths—demanding fine-grained criteria for "manner of agency" that may appear arbitrary.  

  ---

  ### Unoccupied Logical Combinations & Diagnoses  
  - **All logical combinations are occupied** in this tree. However, two leaves (**Leaf 2** and **Leaf 4**) are "unnamed," indicating they lack clear advocacy in the literature.  
    - **Leaf 2 Diagnosis (DBM + Outcome Equivalence)**: **Unattractive and underexplored**. It incoherently demands outcome-based moral equivalence while clinging to a bodily-motion definition of "killing," creating tension between its criteria (e.g., "inaction isn’t killing, but when it causes the same death as killing, it’s equally wrong"). This hybrid is likely avoided due to its instability.  
    - **Leaf 4 Diagnosis (OAD + Outcome Equivalence)**: **Unattractive and unexplored**. It broadens "killing" to include omissions yet discards the moral distinction when outcomes match, rendering the omission/killing classification morally inert in key cases. Philosophers may reject it as self-undermining: if omissions can be killings, their moral equivalence to active killings should not hinge *solely* on outcomes.  

  ### Key Notes  
  - **Coherence**: No combination is strictly incoherent, but **Leaf 2** and **Leaf 4** face internal tensions.  
  - **Gaps**: The unnamed leaves highlight areas where theorists avoid positions that merge outcome-equivalence with narrow/expansive definitions of "doing," likely due to unattractive commitments or conceptual messiness.  
  - **Real-World Anchor**: All positions grapple with cases like *manufacturing a device that will kill A unless B is actively killed*—testing intuitions about responsibility, causation, and moral residues.
