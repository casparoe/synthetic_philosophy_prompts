  (1) Materials: 16 unique data cards with nearly identical initial values (e.g., 0.3000, 0.3001, ..., 0.3015), a deterministic function like f(x) = 4x(1−x) for computation, and individual whiteboards. Rules: Each player computes their forecast iteratively (10 steps) from their card’s value using the function. Turn structure: All compute one step simultaneously on a signal, recording values privately before advancing.

  (2) Payoff scheme: Players earn one point per turn if their current value stays within a tight tolerance (e.g., ±0.01) of any peer's *previous* value, rewarding local consistency ("shadowing"). Bonus: Most cumulative points wins acclaim as "best local predictor," incentivizing adherence to the deterministic rule.

  (3) Debrief mapping: The function embodies determinism; each player shadows a true trajectory (their own) yet pairwise divergence arises from initial micro-differences. This exposes chaos: determinism permits no shared long-term prediction despite individual defensibility.

  (4) Failure mode and fix: Initial arithmetic errors cascade; fix by pre-training on one practice step with peer verification, ensuring rule mastery before starting.

  (5) Unreplicable philosophical feature: Unlike real chaotic systems, this setup has no "structural model error"—the function perfectly matches reality. State aloud that chaos amplifies both initial-condition and model imperfections, but only the former is simulated here.
