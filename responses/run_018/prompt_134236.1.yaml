  Could you write a dialogue between two people who both take the dialogue seriously? One should defend the School of Names view that compound terms like white horse create a fused concept that can't be identical to the bare term horse. The other should be a modern philosopher who thinks this is just a confusion between predication and identity—like saying a white lab isn't a dog just because you added color. They need real back-and-forth, not strawmen: have them actually respond to each other's points about whether not horse means non-membership or just non-identity, and whether taxonomy analogies help or mislead. Keep it somewhat in the weeds, and don't just recite the standard summary everyone learns. This is just me thinking out loud—sorry if my spelling is off in places.
