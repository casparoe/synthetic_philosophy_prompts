prompt: |-
  I'm trying to work out whether Buddhist ethical evaluation is best read as a mental-state consequentialism—where the moral quality of an act is fixed by the root volition (cetana) and its karmic fruit is a separate, non-aggregable consequence—or as a view that genuinely cares about suffering-reduction but restricts permissible means. Here are my concrete verdicts. A surgeon performs a painful but life-saving operation with genuine compassion: excellent, even though she caused pain. A commander orders a retreat that saves a thousand soldiers but leaves fifty behind to be executed; he feels only sorrow, no hatred: the decision was necessary, yet he still bears a heavy moral stain that the saved thousand do not cancel. A teacher lies to a struggling student, saying she has talent, and the student eventually masters the craft: wrong, because false speech corrupts the mental continuum regardless of the beneficial result. A monk uses funds he knows were stolen to build a hospital that saves hundreds; he feels no greed, only concern for suffering: the hospital should stand, but his acceptance of tainted resources remains ethically defective in a way that the lives saved do not wash away. A father strikes his child in anger to stop him from running into traffic, and succeeds: blameworthy, because the presence of aversion in the volition makes the act unwholesome despite the child's survival.

  These point to a principle in which the ethical quality of an act is set by the presence or absence of greed, hatred, and delusion in the root mental state, while outcomes determine only the scope of karmic ripening, not the agent's moral evaluation. But I keep hesitating about the commander: if outcomes never cancel stains, why does his sorrow matter at all? And what about the ruler who orders the execution of one innocent person to prevent a riot killing hundreds, feeling only sorrow and no hatred—does he bear the same stain as if he had killed in rage?

  State the best principle or pair of candidates that captures my pattern, predict its verdict on the ruler case, and be explicit about which of my five verdicts it forces me to drop. Lead with the bottom line; keep the response under 350 words; do not offer citations, bibliographies, or reading lists.
reasoning: |-
  Hmm, the user is grappling with how to interpret Buddhist ethics—specifically whether it's a form of mental-state consequentialism or a suffering-reduction framework with restrictions. They've shared five concrete scenarios to test their intuition: a surgeon, a commander, a teacher, a monk, and a father. Their verdicts consistently prioritize the mental state (root volition) over outcomes, except they're troubled by the commander's sorrow and its implications for the ruler case.  

  The user's pattern is clear: moral quality hinges on the absence/presence of the three poisons (greed, hatred, delusion) in cetana, while outcomes only affect karmic scale. But the commander’s sorrow creates tension—if outcomes don’t cancel stains, why does his emotional state soften the verdict? This suggests their view isn’t purely about suffering-reduction; it’s about volitional purity.  

  I need to propose a principle that captures their core intuition while resolving the inconsistency. The strongest candidate is: "An act is unwholesome if rooted in greed, hatred, or delusion; wholesome if rooted in their opposites. Outcomes determine karmic weight but not the act’s moral quality." This:  
  - Explains why the surgeon (compassionate volition) is blameless despite causing pain.  
  - Validates the teacher (false speech = delusion), monk (accepting stolen funds = greed/delusion), and father (anger = hatred) as blameworthy regardless of results.  
  - Forces dropping the commander verdict: if sorrow isn’t a root poison, his act shouldn’t carry a "heavy moral stain." His sorrow might mitigate personal karmic ripening but doesn’t change the act’s unwholesomeness if rooted in aversion (e.g., to sacrificing the fifty).  

  For the ruler case—killing an innocent to prevent riots—the principle predicts it’s unwholesome if rooted in delusion (e.g., believing ends justify means) or hatred (toward the rioters). Sorrow alone doesn’t purify the volition. This aligns with the user’s intuition that outcomes don’t wash away stains.  

  By dropping the commander’s "stain," we resolve the tension: sorrow matters for the agent’s karmic trajectory (lessening future suffering) but not for the act’s moral quality. The user’s hesitation likely stems from conflating act-evaluation with agent-regret. Clarifying this distinction strengthens their framework.
answer: |-
  **Bottom Line:** The pattern is best captured by **volitional purity consequentialism**: *The moral quality (kusala/akusala) of an act is determined solely by the presence or absence of greed, hatred, or delusion in the root volition (cetana). Outcomes determine the scale of karmic fruit (vipāka), not the act's inherent goodness/badness.* This forces you to drop the **commander verdict**.

  *   **Principle Explained:** An act is unwholesome (akusala) *only* if rooted in greed, hatred, or delusion. It is wholesome (kusala) if rooted in their opposites (e.g., generosity, loving-kindness, wisdom). Outcomes (like suffering reduced or caused) do not change the act's inherent moral quality; they only determine the magnitude of the karmic consequences experienced by the agent.
  *   **Ruler Verdict:** Killing the innocent person, even with sorrow and to prevent greater harm, is **unwholesome and blameworthy**. The volition involves delusion (believing killing an innocent is a permissible means) and/or aversion (towards the rioters or the situation). The lives saved do not cancel the stain inherent in the akusala volition.
  *   **Dropped Verdict:** The **Commander**. If outcomes never cancel stains, and the commander's volition lacked hatred (only sorrow), then his decision *should not* bear a "heavy moral stain" *unless* greed (e.g., for victory/glory) or delusion (e.g., mistaken belief about necessity) was present. Your verdict assigns a stain based on the outcome (leaving 50 to die) despite the sorrowful volition, contradicting the principle that only the volition sets the moral quality. The sorrow might lessen the *karmic fruit* compared to acting in hatred, but if the volition was pure (merely sorrowful recognition of necessity without greed/hatred/delusion), the act itself should not be inherently stained. This is the core tension in your pattern.
