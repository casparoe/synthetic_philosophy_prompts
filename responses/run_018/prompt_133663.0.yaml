  hey, i'm trying to understand this bit from the Milindapanha where king Milinda asks Nagasena what Nagasena actually is, and Nagasena lists hair, skin, bones, etc., then compares it to a chariot being just its parts. i get that he's saying there's no permanent essence, but i'm confused about whether he's attacking synchronic identity — like, there's no unified self at a single moment — or diachronic identity — like, there's no self that persists through time — or if he's just saying Nagasena is a conventional label. also i've been thinking that maybe buddhist anatta isn't pure eliminativism but more like fictionalism: there's a conventional self that works like a narrative fiction but has no ultimate reality. can you help me parse what the passage actually supports? does it leave any space for a conventional functioning self, or does it wipe out even that? please seperate what's pretty well settled about the text from what's actually contested among people who study buddhist philosophy, and don't present one contested reading as if it's the consensus. also if you have to guess about my framing just say so.
