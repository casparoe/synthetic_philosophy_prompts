prompt: |-
  Two friends of mine got stuck arguing whether 'national character' is even a coherent notion. Alex said its basically rubbish: saying 'Germans are direct' is either false essentialism or a statistical average that applies to no actual person, so it dont do real explanatory work. Jordan replied that we generalise about populations constantly -- epidemiological risk profiles, for instance -- and statistical patterns dont need an underlying essence to be meaningful. Alex pushed back that risk factors are measurable causal variables, not fuzzy character traits, and if directness is just an average then it describes nobody in particular, which makes 'national character' an empty label.

  Jordan then argued that nations might be social kinds with homeostatic properties: shared institutions and norms can stabilise certain behaviours across generations, much like how a currency functions, so generalising about them tracks real social mechanisms rather than shared essence. But Jordan also added that these claims are usually indexical -- 'Germans are direct' only makes sense relative to an implicit comparisson class, like British norms -- and without specifying that reference point the claim is either false or empty. Alex said that just proves teh incoherence: if teh content shifts with teh listener's expectations, then we arent describing teh nation at all, just projecting.

  Please adjudicate move by move: who's right on teh essentialism-versus-statistics point, on teh social-kind reply, and on teh indexical-comparisson objection? What's missing from both sides? Give teh bottom line in teh first sentence, then reasoning, with no preamble and no restating teh question. Answer in British English.
