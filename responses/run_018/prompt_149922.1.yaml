  Below, I'll address your query step by step, focusing on a precise principle for safe self-trust that avoids the Löbian obstacle. I'll ground this in formal logic literature, clarify what's settled versus contested, and apply it to your cases (including the moral-judgement variant). I'll write in British English as requested (e.g., "behaviour", "centre").

  ### Core Principle for Safe Self-Trust
  The Löbian obstacle arises when an agent's self-trust mechanism allows it to prove arbitrary statements (via Löb's theorem), typically due to unrestricted global reflection (e.g., "If I believe φ, then φ is true"). To avoid this, self-trust must be constrained to prevent reflexive loops where the trust relation can encode or directly reason about itself. Based on your cases and formal literature, the principle is:

  **Principle of Domain Restriction and Causal Independence (DRCI)**  
  An agent can safely trust a source (including its future self or a peer) if:  
  1. **Domain Restriction**: The trusted statements belong to a formal or empirical domain that *cannot express the trust mechanism itself* (e.g., cannot encode the agent's belief state, proof predicates, or the trust rule).  
  2. **Causal Independence**: The basis for trust relies on *external justifications* (e.g., empirical evidence, pre-verified tools, or causal asymmetry) rather than self-referential reasoning.  

  **Motivation from your cases**:  
  - **Clause 1 (Domain Restriction)**: Motivated by Case 2 (unsafe) vs. Case 1 (safe). If the domain can express self-referential statements (e.g., "I trust my future self"), it enables Löbian loops. Case 5 shows that restricting the language blocks this.  
  - **Clause 2 (Causal Independence)**: Motivated by Case 3 (empirical predictions). Trust based on asymmetric evidence (e.g., "future selves have more data") avoids bootstrapping from self-reference. Case 4 (peer copies) uses causal independence via externalised authority.  

  **Formal vs. contested elements**:  
  - **Settled in logic literature**: Löb's theorem proves that an agent with unrestricted global reflection (e.g., "If I prove φ, then φ") can deduce arbitrary statements. Workarounds like restricted languages (Case 5) are provably consistent if the domain lacks self-reference (e.g., arithmetic without a provability predicate). Mutual trust (Case 4) is safe if the domain excludes reasoning about the trust mechanism itself (as in "oracle" systems or consistent peer review).  
  - **Contested**: Whether empirical domains (e.g., Case 3) inherently allow self-reference is debated. Some argue that real-world constraints (e.g., physics) prevent problematic encodings; others contend that any rich empirical language can be Gödel-encoded to create loops. Moral domains are not well-studied formally, so safety depends on ad-hoc assumptions about language expressiveness.  

  ### Application to Your Cases
  Using DRCI, I'll reassess your verdicts. I'll note where your intuitions must be overturned for consistency.  

  - **Case 1 (auditing an arithmetic proof-checker)**:  
    - **Your verdict**: Fine.  
    - **DRCI analysis**: Safe. Domain (arithmetic) cannot express belief states or trust (satisfies Clause 1). Trust is based on causal independence (pre-verification via audit, satisfying Clause 2).  
    - **Formal status**: Settled. This is provably safe (analogous to trusting a verified oracle).  

  - **Case 2 (universal future-trust rule)**:  
    - **Your verdict**: Broken (Löbian trap).  
    - **DRCI analysis**: Unsafe. Domain includes all statements (violates Clause 1 by allowing self-reference like "this trust rule is sound"). Trust relies on self-referential justification (violates Clause 2).  
    - **Formal status**: Settled. Leads to inconsistency per Löb's theorem.  

  - **Case 3 (future-trust for empirical predictions only)**:  
    - **Your verdict**: Probably broken but unsure; feels "icky".  
    - **DRCI analysis**: **Unsafe** if the empirical domain can encode self-referential statements (e.g., "tomorrow I will believe this statement"), violating Clause 1. Trust lacks causal independence if the agent uses predictions to bootstrap beliefs about its own behaviour (e.g., "I trust my future weather prediction, so I'll act on it today, causing that prediction").  
    - **Overturned verdict**: You said "probably broken" – DRCI agrees, but I overturn your uncertainty: it's unsafe in principle due to encoding risks.  
    - **Formal status**: Contested. If empirical claims are restricted to "basic" observations (e.g., raw sensor data), it might be safe. But in practice, agents often reason about their own states, making Loops possible. No consensus.  

  - **Case 4 (peer copies with restricted domain)**:  
    - **Your verdict**: Probably fine but uneasy; "self-trust with extra steps".  
    - **DRCI analysis**: Safe. Domain excludes reasoning processes (satisfies Clause 1). Trust has causal independence (each copy treats the other as external, satisfying Clause 2).  
    - **Overturned verdict**: Your unease is unnecessary – this is not self-trust but mutual verification, and it avoids loops if domain restrictions hold.  
    - **Formal status**: Settled. Safe per results on "consistent mutual observers" (e.g., in modal logic with restricted modalities).  

  - **Case 5 (Löbian reflection in restricted language)**:  
    - **Your verdict**: Technically works but fragile.  
    - **DRCI analysis**: Safe. Domain cannot express proof predicates (satisfies Clause 1). Trust is justified externally via language design (satisfies Clause 2). Fragility is real but not a flaw if restrictions hold.  
    - **Formal status**: Settled. Proven consistent (e.g., in PA with reflection for Σ₁ sentences).  

  ### Prediction for Moral Judgements
  **Scenario**: An agent trusts its future self only for moral judgements (e.g., "killing is wrong"), not factual ones.  
  - **DRCI prediction**:  
    - **If moral language is simple** (e.g., cannot express beliefs or trust), it is **safe**. For example, if "moral judgements" are atomic rules like "help others", Clause 1 holds. Trust is causally independent if based on past moral learning (Clause 2).  
    - **If moral language is expressive** (e.g., can state "trusting future moral judgements is good"), it is **unsafe**. This allows self-reference (violating Clause 1), and trust may bootstrap via rules like "I should trust my future self because it's moral to do so" (violating Clause 2).  
  - **Formal status**: Contested. Moral domains are rarely modelled in formal logic. Safety depends on whether morality can encode self-reference – a philosophical debate with no consensus.  

  ### Summary of Changes to Your Verdicts
  To uphold DRCI:  
  - **Overturned**: Case 3 is unsafe (not "probably broken but unsure"). Case 4 is safe (not "uneasy").  
  - **Upheld**: Case 1 (fine), Case 2 (broken), Case 5 (works but fragile).  

  ### Key Takeaways  
  - **Settled**: Löbian obstacles are unavoidable for global self-trust in expressive domains (Case 2). Restrictions (Cases 1, 4, 5) work if they block self-reference.  
  - **Contested**: Empirical (Case 3) and moral domains hinge on language expressiveness – some argue real-world agents avoid encoding issues; others see this as naïveté.  
  - **DRCI's value**: It isolates the core issue: self-trust fails when the domain can talk about the trust itself. Your intuitions mostly align, but Case 3 and Case 4 needed refinement for consistency.  

  If you lean toward "causal independence" as the primary safeguard (e.g., trusting future selves for empirical/moral judgements due to evidence asymmetry), that may soften Case 3 – but in formal terms, encoding risks remain. For deeper dives, I recommend studying "reflection principles" in formal epistemology (e.g., work by Stalnaker or Leitgeb) and "Löbian obstacles" in AI safety (e.g., Yudkowsky or Herreshoff).
