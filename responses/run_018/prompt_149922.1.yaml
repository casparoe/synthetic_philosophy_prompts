  We are looking for a principle that distinguishes safe self-trust from unsafe self-trust, based on the cases provided.

  Key ideas from the cases:
  - Case 1: Trusting a verified calculator (arithmetic proof-checker) for arithmetic results. Safe.
  - Case 2: Trusting future self universally (including the rule itself). Leads to Löbian obstacle (can prove anything). Unsafe.
  - Case 3: Trusting future self only for empirical predictions (weather, etc.). But the agent can use the rule to predict its own future behaviour. The user feels it might be broken.
  - Case 4: Two identical copies trusting each other for claims that don't mention their reasoning. Feels like peer review, but might be self-trust in disguise.
  - Case 5: Using Löbian reflection in a restricted language that cannot express proof predicates. Technically works but feels fragile.

  The Löbian obstacle arises when an agent tries to trust its own future beliefs in a way that allows a self-referential loop that can be used to prove arbitrary statements. The obstacle is formalised in the context of Peano Arithmetic (PA) or similar systems: if an agent can prove that its own future beliefs are sound (i.e., if it believes φ then φ is true) then it can prove any φ.

  A principle that emerges is: **self-trust is safe when the domain of trust does not include statements that can encode the trust relationship itself, and when the trust is not used in a globally reflective way that allows the agent to bootstrap arbitrary conclusions.**

  More precisely, we can say:

  **Principle of Restricted Domain and Non-Reflexivity:**
  1. The domain of trust must be restricted to a class of statements that cannot express the agent's own belief state or the trust relation.
  2. The trust must be applied in a way that does not allow the agent to use the trust relation to derive a global reflection principle (like "if I believe φ then φ") for statements that can refer to the trust mechanism.

  Let's break down each case:

  - **Case 1 (arithmetic):** The domain is arithmetic statements, and the trust is in a verified proof-checker. The trust relation (the fact that the proof-checker is sound) is established by a meta-argument (the audit) and then used without further self-reference. The domain (arithmetic) does not include statements about the agent's beliefs. **Safe.**

  - **Case 2 (universal future trust):** The domain includes all statements, including those about the agent's own beliefs and the trust rule. This violates condition 1. Moreover, the rule is applied globally and reflexively (it trusts the rule itself). **Unsafe.**

  - **Case 3 (empirical predictions):** The domain is empirical (non-self-referential). However, the agent can use the rule to predict its own future behaviour. If the empirical domain includes predictions about the agent's own future beliefs (which might be expressed without directly mentioning the trust mechanism), then condition 1 might be violated. Moreover, if the agent can form statements like "tomorrow I will believe φ" and then use the trust rule to believe φ today, we might get a loop. However, note that the trust rule is only for empirical claims. But what if φ is an empirical claim that is about the agent's own future belief? For example, "tomorrow it will rain" is empirical, but "tomorrow I will believe it rains" is also empirical? Actually, the agent's own future belief state might be considered an empirical fact. But then the agent could reason:

    - Today: If tomorrow I believe φ, then φ (by the trust rule for empirical claims).
    - But if φ is the statement "tomorrow I believe φ", then we get: if tomorrow I believe (tomorrow I believe φ) then tomorrow I believe φ. This is not immediately paradoxical. However, if the agent can also form statements about what it will believe tomorrow and use the trust rule to conclude φ today, we might get a problem.

    But note: the trust rule is only applied to the future self's belief. So today, the agent does not necessarily believe φ because it hasn't seen tomorrow's belief. However, if the agent can predict that tomorrow it will believe φ (by some other means) and then use the trust rule to conclude φ today, then we have a loop. But without a fixed point (a statement that is equivalent to "tomorrow I will believe this statement"), it might be safe. However, the Löbian obstacle requires the ability to form self-referential statements. In an empirical setting, if the agent can form such self-referential statements (e.g., by having a name for a sentence that refers to the agent's future belief in it), then we might get a paradox. Therefore, if the empirical domain is rich enough to encode such self-referential statements, it becomes unsafe. Otherwise, it might be safe.

    Since the user is unsure, and the literature does not have a clear-cut answer for empirical domains, we might need to be cautious. **Probably unsafe if the empirical domain can encode self-referential statements, but safe if the domain is restricted to non-self-referential empirical facts (like weather, but not one's own future beliefs).**

  - **Case 4 (two identical copies):** The domain excludes statements about either copy's reasoning. This avoids condition 1 because the trust is not about the agent's own reasoning (each copy is trusting the other, not itself). However, note that the two copies are identical and each is trusting the other for the same domain. This is similar to having a peer. The literature on mutual trust in logic often uses the idea of "oracle machines" or "consistent peers" and can be safe if the domain of trust does not include the consistency of the peer system. But here, the domain excludes statements about reasoning, so condition 1 is satisfied. However, we must note that the two copies might be running the same algorithm and could be making the same mistakes. But without self-reference, there is no immediate Löbian obstacle. **Safe, but note that it might not be as robust as independent verification because of the symmetry.**

  - **Case 5 (restricted language):** The domain is a restricted language that cannot express proof predicates. This satisfies condition 1. The Löbian reflection principle is applied only within that restricted language, so the usual Löbian obstacle (which requires the ability to express the proof predicate) is avoided. **Safe, but fragile in the sense that if the language is extended to include self-reference, it breaks.**

  Now, for the additional case: an agent that trusts its future self only for moral judgements, not factual ones.

  - Moral judgements are typically normative and not about the physical world. They might be expressed in a language that does not include facts about the agent's own beliefs or the trust mechanism. However, if moral judgements can refer to the trust relationship (e.g., "it is morally good to trust my future self") or to the agent's own beliefs (e.g., "I ought to believe φ"), then we might have a problem. But if the moral language is restricted to non-self-referential moral claims (e.g., "killing is wrong"), then it might be safe. However, note that the agent might form a moral judgement about trusting future moral judgements, which could lead to a loop. Without the ability to form self-referential statements in the moral domain, it would be safe.

  But if the moral language allows quantification over moral rules or self-referential moral statements, then it might be unsafe. For example, consider a moral rule: "Whatever moral judgement I make in the future is correct." Then if the agent in the future makes a moral judgement about this rule (e.g., "this rule is bad"), we get a conflict. However, that is more of a moral paradox than a Löbian one. The Löbian obstacle is about provability and belief, not directly about morality. So if the agent is using a logical system for moral reasoning that is powerful enough to express self-reference and the trust rule, then it might be vulnerable. But if the moral language is restricted to avoid self-reference, it should be safe.

  **Summary of the principle:**

  The principle has two parts:
  1. **Restricted Domain:** The trusted domain must not contain statements that can express the agent's own belief state, the trust relation, or allow the construction of self-referential statements that involve the trust mechanism.
  2. **Non-Reflexivity:** The trust rule must not be applied in a way that allows the agent to derive a global reflection principle for the entire domain of trust (i.e., the agent must not be able to prove that everything it believes in the trusted domain is true).

  This principle explains:
  - Case 1: Arithmetic domain cannot express belief (so safe).
  - Case 2: Domain is unrestricted (violates 1) and the rule is applied reflexively (violates 2) -> unsafe.
  - Case 3: If the empirical domain can express self-referential statements about future beliefs, then it violates 1 -> unsafe. Otherwise, safe. But in practice, empirical domains often can express such statements (e.g., by Gödel numbering or similar encodings) so it's likely unsafe.
  - Case 4: The domain excludes reasoning (so condition 1 holds) -> safe.
  - Case 5: Restricted language (condition 1 holds) -> safe.

  Now, which verdicts would we overturn to keep it simple? The user's verdict on case 3 was "probably broken" and we agree. Case 4 was "probably fine but uneasy" and we say it's safe. Case 5 is safe but fragile, which matches.

  We would overturn the user's unease in case 4: it is safe by our principle.

  For the moral case: if the moral language is restricted to avoid self-reference, then safe. But if it allows self-reference, then unsafe.

  **What is settled in the formal logic literature?**
  - The Löbian obstacle for a system that tries to trust its own future proofs (i.e., prove its own soundness) is settled: it leads to inconsistency (the system can prove anything). This is the core of Löb's theorem.
  - The use of restricted languages (as in case 5) to avoid the obstacle is a known workaround and is technically sound (if the language is sufficiently restricted). This is settled.
  - The case of mutual trust between two agents (case 4) is also studied. If the agents do not trust each other on statements about the consistency of their systems, then the arrangement can be consistent. However, if they trust each other on everything, including consistency, then they can prove each other consistent and hence their own consistency (by the same Löbian argument) leading to inconsistency. But in case 4, the domain excludes reasoning, so it is safe. This is settled.

  **What is contested?**
  - The exact boundaries of what counts as "self-referential" in empirical domains (case 3) are not always clear. Some argue that in the physical world, self-referential statements might not be constructible, but in a formal system embedded in the world, they might be. There is ongoing debate about self-trust for empirical predictions.
  - The moral case is not well-studied in formal logic, so it's unclear whether moral languages are vulnerable to Löbian problems. This is largely unexplored.

  Therefore, the principle we propose is:

  **Principle (Restricted Domain and Non-Reflexivity):** An agent can safely trust a source (including its future self or a peer) for a domain of statements if:
  1. The domain is restricted to statements that cannot express the agent's own belief state, the trust relation, or allow the construction of self-referential statements that involve the trust mechanism.
  2. The trust is not used to derive a global reflection principle for the entire domain (i.e., the agent does not prove that every statement in the domain believed by the trusted source is true).

  This principle captures the safe cases and avoids the unsafe ones.

