  The scoring part should be brutally honest - no sugarcoating how behaviorism flops on opacity or how theory-theory struggles with non-human systems. Might add predictive processing as an outlier since it handles prediction errors in novel contexts.

  Better emphasize that some desiderata can't coexist peacefully. Like how "non-anthropocentric grounding" clashes with "phenomenological plausibility" - we're stuck with human-shaped brains after all. 

