  But I must also challenge this lens. Intelligence agencies never respected these narrative boundaries; their logic is total information dominance. And is narrative coherence really what's at stake, or is it just a beautiful metaphor? The Snowden files show coherence might be impossible once data gets aggregated, suggesting privacy could be more about limiting aggregation than preserving stories.

