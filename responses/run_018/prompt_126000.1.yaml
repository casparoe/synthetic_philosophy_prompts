  - **#2 follows** as it examines the *functional consequence* of #1—whether cognition can fill the void left by absent affect. This shapes behavioral realism in your story (e.g., can your character learn avoidance?).  
  - **#3 builds on both** but explores *downstream existential effects* on self/empathy. It matters deeply for character depth but assumes answers to #1/#2.  

  **Why Not Other Questions?**  
  - "Is pain necessary for consciousness?" is too abstract for your focus.  
  - "Do invertebrates feel pain?" lacks direct character relevance.  
  - "Cultural pain variability" is important but secondary to the neurology of dissociation.  

