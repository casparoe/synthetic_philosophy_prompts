answer: |-
  ### 1. The Slogan in Context  
  Your colleague uses "the whole is nothing over and above its parts" to dismiss the Special Composition Question (SCQ), implying that composition requires no further inquiry once parts exist and are arranged. For scattered objects (e.g., a constellation) or temporary parts (e.g., a corporation across time), she argues there is no distinct "composition fact" beyond the parts themselves. This treats SCQ as a pseudo-problem, suggesting that questioning when parts compose a whole is misguided.  

  ### 2. Menu of Precise Readings  
  1. **Ontological Reduction**: Wholes are identical to the sum of their parts. No distinct entity exists beyond the parts and their relations.  
  2. **Explanatory Priority**: All facts about wholes are exhaustively explained by facts about their parts (including arrangements and interactions).  
  3. **Causal Powers Denial**: Wholes possess no causal powers irreducible to the causal powers of their parts.  
  4. **Semantic Dependence**: Terms referring to wholes (e.g., "constellation") are shorthand for descriptions of parts and their arrangements; "whole" adds no new meaning.  
  5. **Scattered/Contiguous Parity**: There is no ontological distinction between scattered wholes (e.g., constellations) and contiguous wholes (e.g., a rock); spatial gaps are irrelevant.  
  6. **Temporal Parts Equivalence**: At any time, a whole is identical to its instantaneous temporal parts; persistence is just part-succession.  

  ### 3. Verdicts per Reading  
  1. **Ontological Reduction**: **Defensible**. Coheres with mereological nihilism or universalism but requires argument against emergent entities.  
  2. **Explanatory Priority**: **Defensible**. Supported by reductionism in science, but challenged by holistic explanations (e.g., consciousness).  
  3. **Causal Powers Denial**: **Defensible**. Plausible for physical systems, but contested for social/complex wholes (e.g., corporate agency).  
  4. **Semantic Dependence**: **Tautology** if "whole" is *defined* as parts-arranged, but **false** if "whole" is a primitive concept.  
  5. **Scattered/Contiguous Parity**: **Substantive**. Presupposes universalism; restrictivists deny scattered objects exist.  
  6. **Temporal Parts Equivalence**: **Substantive**. Assumes perdurantism; endurantists reject temporal parts.  

  ### 4. Which Reading Supports the Dismissal?  
  Only **Semantic Dependence (Reading 4)** treats SCQ as a pseudo-problem by making composition analytically true: if "whole" just *means* "parts arranged thusly," then asking "when do parts compose?" reduces to "when do we apply the label?"—dissolving metaphysical inquiry. However, this is circular unless independently justified. **Scattered/Contiguous Parity (Reading 5)** *seems* to dismiss SCQ for scattered cases but quietly assumes universalism (all arrangements compose). Similarly, **Temporal Parts Equivalence (Reading 6)** assumes perdurantism (all temporal stages compose). The other readings are substantive theses that *answer* SCQ (e.g., reduction implies nihilism/universalism) rather than dissolving it.  

  ### 5. Internal Tensions  
  - **Semantic Dependence (4)** cannot be held with **Ontological Reduction (1)** if "whole" is semantically primitive but ontologically reduced.  
  - **Scattered/Contiguous Parity (5)** conflicts with **Causal Powers Denial (3)** if contiguous wholes exhibit unified causal powers (e.g., organisms) but scattered wholes do not.  
  - **Temporal Parts Equivalence (6)** and **Explanatory Priority (2)** may clash if temporal parts require cross-temporal explanation irreducible to instantaneous states.  
  **Most critically**: Treating the slogan as dissolving SCQ (via Reading 4) is incompatible with Readings 5 or 6, which presuppose answers to SCQ (universalism/perdurantism) rather than dismissing it.  

  ---
  **Key Insight**: Your colleague’s dismissal works *only* if the slogan is a semantic tautology (Reading 4). Yet this is philosophically shallow and circular. In all other readings, the slogan is a substantive claim that *answers* SCQ (e.g., endorsing universalism for scattered cases) rather than dissolving it. Highlighting this forces engagement with SCQ’s core metaphysical debate.
