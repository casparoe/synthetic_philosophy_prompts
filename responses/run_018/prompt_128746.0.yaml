prompt: |-
  In a metaphysics working group discussing the special composition question, a colleague keeps saying "the whole is nothing over and above its parts" to dismiss the idea that there is any further issue about when parts compose a whole — especially for scattered cases like a constellation spanning light-years or a corporation with no shared location. She treats it as dissolving the problem: once the parts are present and arranged, there is no additional fact of composition to ask about. Before next session I want a disambiguation menu I can actually use. Lay out the distinct precise claims that slogan could be expressing — cover ontological reduction, explanatory priority, the denial of emergent causal powers, semantic claims about the terms "part" and "whole," and claims specifically about scattered versus contiguous arrangements. For each reading, say whether it is a tautology, a substantive and defensible thesis, or false, and flag any pair that cannot be jointly held. Then identify which reading, if any, actually does the work of making the special composition question a pseudo-problem, and which instead quietly presuppose an answer like universalism, restrictivism, or nihilism. Use scattered objects and temporary parts as running test cases, but do not provide a bibliography or cite named authors.

  Structure the response in this order:
  1. The slogan in context (brief, ~1 paragraph)
  2. Menu of precise readings (the bulk of the answer; number them)
  3. Verdicts per reading (tautology / defensible / false, with one-line reasons)
  4. Which reading supports the dismissal? (~1 paragraph, linking to scattered and temporary cases)
  5. Internal tensions (note incompatible pairs, ~half a paragraph)
