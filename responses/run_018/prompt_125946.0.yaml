  I'm trying to pressure-test Confucian role ethics with an argument that seems to drive it into a corner, but I suspect there's a hidden slide. (1) Confucian ethics is fundamentally a role ethics: obligations arise from specific relational roles—father, son, ruler, subject, elder brother, younger brother—rather than from abstract universal principles. (2) The doctrine of zhengming (rectification of names) applies moral evaluation only within such named roles: a father must act fatherly, but there is no corresponding rectification for "stranger." (3) Therefore, where no social role binds two people, role ethics supplies no direct moral evaluation of how they should treat one another. (4) From this it follows that harming an unrelated stranger is not prohibited by role ethics itself; at worst it violates no named duty. (5) Yet Confucians plainly condemn harming strangers and Mencius extends compassion to all people, so role ethics must accommodate universal obligations. (6) The only way to accommodate them is to posit a universal role—"fellow human"—that binds everyone. (7) But once "fellow human" carries genuine moral weight, role ethics collapses into universalism: graded familial obligations become merely stronger instances of a single human duty, destroying the theory's distinctive structure. (8) If we deny that "fellow human" is a real Confucian role, then (4) stands and Confucians must accept a moral vacuum regarding strangers, which is absurd. (9) So Confucian role ethics either destroys its own identity or accepts moral nihilism about strangers. I'd like to keep (1) and (2) intact if possible. Which numbered step should I reject, why did it look plausible, and what does giving it up cost? Please respond in continuous prose only—no headings, bullet points, bold text, or tables—writing as you would in a letter.
