answer: |-
  Your argument is admirably sharp, and I see why it feels like a trap. The pressure you apply exposes a genuine tension, but I believe the most promising escape lies in rejecting step (4). While initially plausible, it subtly mischaracterizes how Confucian role ethics generates moral concern beyond immediate, named roles. Let me walk through why.

  Step (4) claims: "Therefore, where no social role binds two people, role ethics supplies no direct moral evaluation of how they should treat one another... harming an unrelated stranger is not prohibited by role ethics itself; at worst it violates no named duty."

  This seems plausible based on a strict reading of *zhengming* (rectification of names) focused solely on the performance of specific, discrete roles like father-son or ruler-minister. If morality is *only* about fulfilling the duties inherent in these named relationships, then interactions with a stranger, lacking such a named bond, would indeed seem morally unregulated within the system. The "named duty" appears absent.

  However, this overlooks the fundamental Confucian virtue cultivated *through* those very roles: *ren* (仁), often translated as humaneness, benevolence, or authoritative conduct. *Ren* is not merely the sum of specific role obligations; it is the cultivated moral disposition, the empathetic heart-mind, developed precisely *by* conscientiously practicing those role-based duties. While rooted in familial love (*xiao*, filial piety, and *ti*, fraternal respect), *ren* is understood to expand outward.

  Mencius explicitly addresses this expansion. His famous example of the child about to fall into a well (Mencius 2A:6) demonstrates an immediate, spontaneous feeling of alarm and compassion (*ce yin zhi xin* – the heart-mind of commiseration) towards a completely unknown child. This feeling, Mencius argues, is universal among humans and is the "sprout" of *ren*. Crucially, he does *not* posit a new role ("fellow human") to explain this. He identifies it as the innate, foundational human capacity that is *cultivated and extended* through the practice of familial role ethics.

  Therefore, step (4) is incorrect. Confucian role ethics *does* supply moral evaluation regarding strangers, not by inventing a new, universal *role-duty* like "fellow human," but by cultivating a universal *disposition* (*ren*) through the practice of specific roles. Harming a stranger violates the cultivated virtue of *ren*. It is a failure of one's developed humanity, a manifestation of a heart-mind that has not properly extended the compassion nurtured within familial bonds. The moral evaluation isn't "You violated your duty as 'fellow human'," but rather "Your action demonstrates a profound lack of *ren*." The prohibition against harming strangers arises indirectly but powerfully from the *telos* of the entire ethical project – the cultivation of a humane character capable of appropriate response beyond the immediate circle.

  Giving up step (4) comes with a cost: it requires acknowledging that Confucian ethics operates on two interconnected levels. The primary, concrete level *is* the network of specific role obligations (*li*, ritual propriety, manifesting in specific roles). This is the indispensable training ground. However, this practice cultivates the secondary, more fundamental level: the inner virtue of *ren*, which transcends any single role and provides the moral sensibility guiding interactions even where no specific role exists. This means the moral evaluation of actions towards strangers isn't *directly derived* from a named role-duty, but it *is* an intrinsic consequence of the moral character (*ren*) that the role-based system aims to produce. It prevents the moral vacuum without resorting to a universal role.

  Rejecting step (4) preserves the distinctiveness of Confucian role ethics (steps 1 & 2 intact). Graded obligations remain crucial *as the means* to cultivate the humane character, not merely as stronger instances of a universal duty. The "fellow human" is not a *role* one occupies with specific duties; it's the condition that makes the sprout of *ren* possible and its cultivation necessary. The theory avoids collapsing into abstract universalism because the concrete practice within differentiated roles remains the essential path, while the resulting *ren* provides the universal moral horizon. It navigates between your horns: it condemns harming strangers as a failure of cultivated humanity (*ren*), not as a violation of a named stranger-role duty, and thus avoids both the collapse into universalism and the absurdity of a moral vacuum. The seeming "slide" was the assumption that moral evaluation *must* be tied directly and exclusively to a named role-duty, neglecting the generative power of the virtues cultivated *through* those roles.
