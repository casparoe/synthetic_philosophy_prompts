prompt: |-
  hey so im in this bioethics/philosphy seminar and we're arguing about advance directives — like, if i write now that i dont want tube feeding if i get dementia later, but then later im demented and seem kinda happy, does that earlier document still have authority? my prof mentioned family resemblance in language games in a different context and it got me thinking maybe we're using "authority" in too many different ways and need a spec sheet.

  so heres what i want: write the desiderata — the full checklist of what any adequate theory of teh earlier self's authority over advance medical decisions actually has to deliver. i want the motivating case behind each requirement, not just bullet points. for instance, it needs to handle the standard happy-dementia refusal case, but also this weird scenario i made up: a directive contains a "lucidity window clause" saying that if the patient ever regains brief awareness and expresses a different wish, that wish overrides the directive, but the medical team cant tell if the awareness is "real" lucidity or just reflexive vocalization. the theory has to say what counts as authoritative in that window without just handwaving. also it must respect teh distinction between "this person is still the same individual" and "this person still shares teh values that made the directive meaningful" — cant collapse personal identity into psychological continuity or vice versa. it should be consistent with what we know about dementia trajectories (that suffering isnt inevitable, that some capacities fade in stages) without importing fake neuroscience. flag which desiderata are genuinely non-negotiable and which are just camp preferences — like, is determinism about personal identity a real requirement or just a metaphysical prejudice? and please flag any pair that looks jointly unsatisfiable. im especially suspicious that "honor the earlier autonomous choice" and "protect the current subject's apparent welfare" cant both be maxed out in teh happy-dementia case, but maybe theres a third thing im missing. briefly, how do the broad approaches — the narrative-identity view, the present-autonomy-override view, and teh substituted-judgment model — do against your list? dont need a full scorecard, just the tension points. oh and dont give me a bibliography, i cant look stuff up and i just want teh conceptual architecture.
reasoning: |-
  Okay, let me unpack this user's request. They're in a bioethics seminar grappling with advance directives, specifically the tension between an earlier competent self's written wishes and a later demented self who appears content. The user wants a rigorous framework - not just bullet points - mapping out what any theory of "authority" in this context must achieve. 

  Hmm, their scenario is sophisticated: they mention Wittgensteinian "family resemblance" concerns about how we use "authority," reference a self-created "lucidity window clause" edge case, and insist on separating personal identity from value continuity. The frustration with handwaving is palpable. They're clearly deep in the weeds of meta-ethical debates but want grounded analysis.

  Right, first I need to identify the core tensions. The happy dementia case is central - where a directive refuses care but the current self seems to enjoy existence. Then there's their invented scenario about ambiguous lucidity windows. And crucially, they want no conflation between "same person" and "same values." 

  *scribbles mental notes* Must also flag: 
  - Which requirements are truly non-negotiable (e.g., consistency with real dementia science) vs debatable (like determinism) 
  - Any impossible trade-offs, especially between autonomy and welfare 
  - How major theories (narrative identity, present-autonomy override, substituted judgment) handle these tensions

  The user explicitly rejects bibliographies - this is purely conceptual. Their "spec sheet" metaphor is apt; they want engineering specs for ethical coherence. 

  *deep breath* Okay, tackling this layer by layer. Start with non-negotiable desiderata: 
  1. **Value Drift Accommodation**: Dementia alters values - a theory must recognize when current preferences diverge from past ones without assuming pathology. 
  2. **Epistemic Humility**: We can't perfectly read dementia patients' inner states. Any "apparent happiness" could be misinterpreted. 
  3. **Temporal Neutrality**: Avoid biasing toward present or past selves. Neither gets automatic priority. 
  4. **Identity/Value Distinction**: Crucial! Must separate metaphysical "same person" from whether original values persist. 

  Now negotiable/contested ones: 
  - **Determinism**: Is identity/value continuity binary? Probably not, but some theories assume it. 
  - **Welfare Weight**: How heavily should current comfort weigh against past autonomy? 
  - **Narrative Primacy**: Should the life story's coherence dominate? 

  Ah, the joint satisfiability traps! The autonomy-welfare clash in happy dementia seems unresolvable at extremes. Also, their "lucidity window" scenario exposes a deep problem: if we can't define "real awareness," how can any theory operationalize it? 

  *checks user's unspoken needs* They're likely preparing for seminar debates and want to preempt objections. The request for "motivating cases" suggests they need concrete examples to test theories. And that "third thing" they're missing? Might be about respecting the *process* of will-formation rather than just snapshots of decisions. 

  Finally, theory tensions: 
  - Narrative views handle identity crises but risk over-coherence 
  - Present-autonomy models respect current welfare but undermine planning 
  - Substituted judgment tries empathy but projects imaginary preferences 

  *adjusting mental model* User's depth means no dumbing down. But must avoid jargon - they want clarity, not showmanship. The lucidity window example deserves special attention; it's their original contribution and a perfect stress test. 

  Time to structure output: desiderata with cases, then impossibilities, then theory spot-checks. Flag every assumption. No fluff.
answer: |-
  Here’s a rigorous desiderata list for theories of advance directive authority, grounded in your cases and constraints. Each requirement includes a motivating case and classification (non-negotiable vs. debatable).  

  ---

  ### **Core Non-Negotiable Desiderata**  
  *(Essential for conceptual adequacy and clinical realism)*  

  1. **Value Drift Accommodation**  
     - **Motivation**: Dementia often alters core values (e.g., a formerly intellectual person now finds joy in simple pleasures). A theory must distinguish between *identity persistence* ("same person") and *value continuity* ("same values as when directive was written").  
     - **Non-negotiable**: Yes. Collapsing these conflates metaphysical and ethical questions.  

  2. **Epistemic Humility in Welfare Assessment**  
     - **Motivation**: In the "happy dementia" case, apparent contentment may not reflect genuine welfare (e.g., inability to comprehend loss of autonomy). The theory must acknowledge limits in interpreting subjective states in cognitive decline.  
     - **Non-negotiable**: Yes. Requires compatibility with dementia’s phenomenological ambiguity.  

  3. **Temporal Neutrality**  
     - **Motivation**: Avoids biasing toward either the "past self" (rigid adherence to directives) or "present self" (discounting prior autonomy). Must weigh both without presupposing supremacy.  
     - **Non-negotiable**: Yes. Foundational for fairness.  

  4. **Procedural Fidelity for Ambiguous Lucidity**  
     - **Motivation**: Your "lucidity window clause" case. A theory must specify:  
       - Criteria for "authentic" expression overriding a directive (e.g., coherence with residual values, not just verbalization).  
       - Default rules when lucidity is indeterminate (e.g., presumption of non-lucidity without evidence of value-reasoning).  
     - **Non-negotiable**: Yes. Directives with override clauses demand this.  

  5. **Neurocognitive Realism**  
     - **Motivation**: Must align with dementia’s trajectory (e.g., fluctuating competence, preserved emotional processing despite cognitive loss). Rejects false claims (e.g., "all dementia patients suffer").  
     - **Non-negotiable**: Yes. Empirical grounding is essential.  

  ---

  ### **Negotiable/Contested Desiderata**  
  *(Reflect philosophical camp preferences)*  

  6. **Determinacy in Identity/Value Thresholds**  
     - **Motivation**: Must a theory define a precise threshold where identity/values are "lost"? Or can it tolerate vagueness?  
     - **Debatable**: Determinism is a metaphysical prejudice; fuzzy thresholds may be unavoidable.  

  7. **Welfare Priority Weight**  
     - **Motivation**: How heavily should *current apparent welfare* (e.g., "happiness" in dementia) outweigh prior autonomy?  
     - **Debatable**: Weighting reflects ethical priorities (autonomy vs. beneficence).  

  8. **Narrative Coherence Primacy**  
     - **Motivation**: Should the "life story’s integrity" (e.g., not prolonging a state the past self abhorred) dominate?  
     - **Debatable**: Narrative views prioritize this; others reject it as paternalistic.  

  ---

  ### **Jointly Unsatisfiable Tensions**  
  1. **Autonomy vs. Welfare in Happy Dementia**  
     - **Conflict**: Maximally honoring the directive (autonomy) risks ignoring current contentment (welfare). Prioritizing welfare invalidates prior autonomy.  
     - **Resolution?**: Requires a *third metric* (e.g., "critical interests" in life projects vs. "experiential interests" in momentary welfare). No theory fully resolves this.  

  2. **Lucidity Clause Precision vs. Epistemic Limits**  
     - **Conflict**: A clause demanding "authentic lucidity" clashes with the inability to verify it. Overly strict criteria render clauses useless; lax criteria risk honoring non-autonomous utterances.  
     - **Resolution?**: Default to the directive unless evidence shows engagement with *values* (not just words).  

  ---

  ### **Theory Spot-Checks**  
  - **Narrative-Identity View** (e.g., Dworkin):  
    - *Strengths*: Handles value drift via life-narrative integrity. Prioritizes "critical interests" (past self’s values) over present contentment.  
    - *Tensions*: Struggles with epistemic humility (assumes we can know the narrative arc). Fails your lucidity window test if "brief awareness" is deemed narratively irrelevant.  

  - **Present-Autonomy-Override View** (e.g., current preferences dominate):  
    - *Strengths*: Avoids "forcing" treatment on a content present self. Aligns with welfare focus.  
    - *Tensions*: Violates temporal neutrality. Collapses value continuity into current psychology. Ignores the directive’s purpose.  

  - **Substituted Judgment Model** (proxy decides what patient *would* want now):  
    - *Strengths*: Flexible in lucidity windows (proxies interpret "authenticity").  
    - *Tensions*: Proxies often project biases. Fails value drift cases (e.g., "Would she *now*, with new values, want feeding?").  

  ---

  ### **The Third Thing You’re Missing?**  
  The tension between autonomy and welfare might be mediated by **relational accountability**: Advance directives as promises to a community (family, society) that relies on stable commitments. Overriding them risks undermining trust in future planning. This doesn’t resolve the clash but adds a social dimension beyond individualism.  

  ---  
  This framework forces theories to confront the ambiguity of "authority" as:  
  - **Legal** (directive as binding contract),  
  - **Moral** (deference to past autonomy),  
  - **Phenomenological** (current self’s voice).  
  No theory aces all desiderata—your job is to expose which trade-offs are defensible.
