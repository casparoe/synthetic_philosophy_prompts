answer: |-
  ### Research Proposal: Ontological Framing Presentism in Historical Explanation  

  **1. Central Research Question**  
  To what extent can historians legitimately employ modern ontological categories (e.g., "the economy," "religion," or "politics") in causal explanations of past societies without committing anachronism, and under what conditions does such framing preserve explanatory power while avoiding the collapse of analysis into either descriptive impotence or presentist distortion? This question demands a determinate answer in the form of a *defensible methodological framework*—specifying when and how modern categories can be used legitimately—or, failing that, an *impossibility result* demonstrating that no such framework exists.  

  **2. Gap in the Dominant Moral-Presentism Literature**  
  The prevailing literature on moral presentism focuses exclusively on the ethical dimensions of historical judgment—e.g., whether historians should condemn past actors using contemporary norms. While this debate addresses *evaluative* presentism, it neglects the deeper *ontological* problem: the uncritical projection of modern categorical frameworks (e.g., treating "religion" as a universal domain separable from "politics") onto past societies, where such distinctions may not have existed. This gap leaves unresolved the core tension in historical explanation:  
  - **The anachronism risk**: Using modern categories imposes artificial structures on past contexts, distorting historical actors' self-understanding and social dynamics.  
  - **The impotence risk**: Abandoning modern categories for purely endogenous concepts (e.g., medieval "religio" or pre-colonial "reciprocal exchange") fragments causal narratives, reducing explanation to incoherent description.  
  The moral-presentism debate cannot resolve this because it concerns *blame*, not *explanatory architecture*. It fails to engage how categorical framing shapes the very possibility of causation, comparison, or generalization in history.  

  **3. Method: Case Study-Driven Conceptual Analysis**  
  A broad historiographical review or empirical survey would be inadequate, as both risk abstract generality or anecdotal evidence. Instead, I adopt a method combining conceptual distinctions with focused case studies to isolate the mechanics of framing presentism in practice. This approach tests the central tension concretely while building toward a generalizable framework.  

  - **Month 1: Conceptual Foundations and Critique**  
    Develop precise definitions of "ontological framing presentism," "anachronism," and "descriptive impotence" through engagement with historicist critiques (e.g., the charge that modern categories reify contingent constructs) and analytic philosophy of history (e.g., debates about causal explanation). Diagnose why existing solutions—such as strict contextualism or pragmatic instrumentalism—fail to resolve the tension.  

  - **Month 2: Case Study 1 – "Religion" in Medieval European Historiography**  
    Analyze how historians apply the modern category "religion" to medieval piety, contrasting it with endogenous concepts like "religio" (a virtue tied to social order) or "ecclesia" (a community inseparable from political life). Examine how this framing distorts explanations of events like the Investiture Controversy. Test if abandoning "religion" for endogenous terms sacrifices explanatory coherence when linking piety to power struggles.  

  - **Month 3: Case Study 2 – "Economy" in Pre-Colonial West African Historiography**  
    Investigate the imposition of modern economic categories (e.g., "market," "labor") on societies organized via kinship-based reciprocity (e.g., the Igbo "ịgba mbụ" system). Assess how this framing misrepresents causal drivers of trade or conflict. Conversely, explore whether purely endogenous concepts can explain large-scale phenomena like the trans-Saharan trade without modern analogs like "supply chains."  

  - **Month 4: Synthesis and Framework Development**  
    Integrate insights from both cases to construct a taxonomy of "framing dependencies" (e.g., heuristic vs. constitutive uses of categories) and propose safeguards against anachronism (e.g., "reflexive bracketing"—explicitly marking modern categories as provisional tools). If synthesis fails, pivot to an impossibility argument showing the tension is irresolvable.  

  **4. Success and Failure Criteria**  
  - **Success**: A defended middle position comprising: (1) a *taxonomy* identifying types of framing dependencies (e.g., where modern categories are indispensable heuristics versus where they distort), and (2) *methodological safeguards* (e.g., criteria for when endogenous concepts suffice for causal links). Success is achieved if the framework resolves concrete problems from the case studies without regressing to pure instrumentalism or contextualism.  
  - **Failure**: The project fails if case studies reveal no consistent patterns, leading to an inconclusive or trivial outcome (e.g., "it depends on context" without operational guidance). It also fails if the framework merely restates existing debates or if the impossibility result proves elusive due to ambiguities in "explanatory power."  

  **5. Scope Assessment and Risks**  
  - **Feasibility in Four Months**: The timeline is viable with disciplined focus: Months 1–3 require 10–12 hours/week for targeted reading and case analysis, while Month 4 dedicates full-time to synthesis. Secondary sources will suffice for case studies, avoiding primary archival work.  
  - **Key Risks**:  
    (a) *Conceptual overreach*: The project could veer into tangential debates (e.g., social ontology or realism vs. anti-realism), consuming time. Mitigation: Anchor all analysis to the case studies.  
    (b) *Case-study complexity*: Overwhelming detail in historical contexts (e.g., medieval theology) may obscure framing issues. Mitigation: Prioritize historiographical debates over exhaustive history.  
    (c) *Underdefined "explanatory power"*: If this remains vague, evaluating success becomes circular. Mitigation: Define it procedurally (e.g., "ability to trace causes across contexts") early in Month 1.  
    (d) *Synthesis collapse*: Divergent cases may resist unification. Mitigation: If synthesis fails, the impossibility result itself constitutes a valuable outcome.  

  ---

