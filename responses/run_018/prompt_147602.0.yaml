answer: |-
  Right then, let's dive into the weeds with a classic example from open-source governance: **The Evolution of "Committer Privilege" in Apache-style Projects.** This perfectly illustrates how normative slack around contribution rules can silently create a second-order system that *breaks* the very coordination it aimed to facilitate.

  **The Stated Coordination Rule (The First-Order System):**
  "All substantive code changes *must* be proposed via a patch or pull request, reviewed by at least one other committer (ideally more), discussed on the mailing list, and only committed *after* consensus is reached." This is designed for coordination: ensuring quality, shared understanding, preventing breakages, and fostering collective ownership.

  **The Normative Slack (The Allowed Flexibility):**
  The culture often allows, pragmatically, for "trivial" or "obvious" fixes to be committed directly by a committer *without* the full PR/review process. Think: fixing a typo in documentation, correcting a single-line syntax error, updating a version string. The *intention* is sensible: avoid bureaucratic overhead for genuinely insignificant changes, maintaining velocity.

  **How Normative Slack Breeds the Second-Order System (The Real Rules):**
  The problem isn't the *existence* of trivial commits. It's the inherent **vagueness** of "trivial" and "obvious." This normative slack creates an invisible, unwritten second-order system focused entirely on:

  1.  **Who Decides Triviality?** The *real* rule becomes: "A Committer's seniority/standing/reputation determines whether *their* assessment of 'trivial' is accepted without question." A long-standing, respected core developer commits a "trivial" 10-line refactor without review? Seldom challenged. A newer committer tries the same? Likely criticised for bypassing process. The *bending* of the rule becomes permissible based on social capital, not the objective nature of the change.
  2.  **The Definition Drift:** Without strict boundaries, "trivial" subtly expands. What starts as typo fixes morphs into "small bug fixes," then "minor refactors," then "non-critical dependency updates." The normative slack stretches, driven by individuals pushing the envelope of what *they* consider trivial, often based on their perceived status. The *real* rule becomes: "You can push the definition of 'trivial' if you have enough standing or argue forcefully enough on the list."
  3.  **The Gatekeeping & Invisible Barriers:** New contributors or less-established committers see core members routinely bypassing the formal review for changes that *aren't* objectively trivial. They try to emulate this efficiency ("It's just a small thing, like Bob does...") but get slapped down: "This needed review!" The *real* rule they learn is: "The formal process isn't the *real* rule; the real rule is knowing *when you personally* are allowed to bend it, which depends on your status within the inner circle." This creates frustration, perceived hypocrisy, and barriers to full participation. Coordination breaks down because trust in the *fairness* of the process erodes.
  4.  **The Erosion of Collective Ownership & Knowledge Sharing:** The formal review process isn't just gatekeeping; it's a core coordination mechanism for knowledge transfer and collective ownership. When significant changes are committed as "trivial" bypassing review:
      *   **Knowledge Siloing:** Other committers lose visibility into changes. That "trivial" refactor might subtly alter behaviour or have hidden dependencies only the committer knows about.
      *   **Broken Collective Understanding:** The shared mental model of the codebase fragments. The commit log shows the change, but the *discussion and rationale* (captured in PR reviews) are missing.
      *   **Increased Risk:** The safety net of peer review is skipped. What one person thought was "obvious" might introduce a subtle bug or conflict missed without other eyes. Coordination breaks because the shared context and quality control mechanism are circumvented for a subset of changes by a subset of people.

  **The Broken Coordination:**
  The *intention* of the slack was to streamline coordination for *genuinely* insignificant work. But the *effect* of the unregulated normative slack is:

  *   **A two-tiered system:** Creates an in-group (who can bend rules) and an out-group (who must follow them rigidly).
  *   **Unpredictable process:** Contributors never know *for sure* if their "trivial" change will be accepted or rejected based on the rule-bend, leading to hesitation or resentment.
  *   **Undermined trust:** Erodes faith in the fairness and consistency of the governance model.
  *   **Degraded collective knowledge:** Bypassing review for non-trivial changes under the "trivial" banner fragments understanding and ownership.
  *   **Increased conflict:** Arguments shift from *technical merit* to *process legitimacy* and *personal standing* ("Why does *he* get to do that without review?").

  The coordination mechanism (PR/review/consensus) is *meant* to ensure quality, shared understanding, and fairness. Normative slack around "trivial" commits, left unchecked, morphs into a system where coordination *fails* precisely because the *real* rules governing contribution are opaque, status-dependent, and ultimately about *who has permission to ignore the formal rules*, not about the technical change itself. The project becomes harder to coordinate because the foundational process is inconsistently applied based on an invisible hierarchy, not the objective needs of the code or the community. It's coordination sabotaged by the ambiguity it permitted.
