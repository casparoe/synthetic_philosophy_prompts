  - What would weaken the neo-adaptationist position? If it were found that the genetic correlations among wing veins are so strong and universal across Drosophila species that they prevent the independent evolution of individual veins, even when selection pressures are applied in a direction opposing the correlation, then the neo-adaptationist position that adaptation can be tested without reference to such constraints would be weakened.

