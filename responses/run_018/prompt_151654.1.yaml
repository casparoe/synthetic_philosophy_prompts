  4. For each crux, a concrete hypothetical case (using a model system like stickleback armor or Drosophila wing veins) and what empirical pattern would weaken each side's position.

  Format: Agreed claims (numbered) followed by a disagreements table.

  Important: If the framing is confused (e.g., if genetic correlation and functional adaptation aren't competing explanations), we must correct it. However, the user specifically wants to focus on the debate as framed. I note that the user is aware of potential conflation and invites pushback. But the request is to proceed as described unless we believe the premise is fundamentally flawed.

