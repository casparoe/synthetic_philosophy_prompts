  ## The Hollow Constitution: Reconceptualizing Democratic Backsliding in the Age of Procedural Degradation

  The concept of "democratic backsliding" has become indispensable for describing the erosion of democratic norms worldwide. However, its analytical utility faces a critical challenge when confronted with regimes that meticulously avoid overt constitutional breaches while systematically dismantling pluralism through *procedurally valid* instruments: omnibus bills bundling unrelated, democracy-weakening provisions; emergency decrees stretched to their statutory limits; and judicial restructuring exploiting legal appointment rules to ensure subservience. Applying the term to such cases – notably Hungary, Poland, Turkey, and arguably the United States – raises profound questions: Can we legitimately designate regimes as "backsliding" without resorting to circular reasoning (defining backsliding as what these regimes do)? Does comparison reveal a common structural pattern, or does it collapse into partisan labeling? This essay argues that **democratic backsliding must be fundamentally reconceptualized around the core principle of "procedural degradation" – the strategic manipulation of formally legal processes to subvert democratic substance – to retain analytical value for these increasingly prevalent cases, moving beyond a narrow focus on explicit rule-breaking.**

  The core dilemma lies in the gap between form and function. Traditional definitions of backsliding often emphasize violations of explicit constitutional or legal rules – coups, term-limit extensions via constitutional override, or blatant electoral fraud. Regimes like Hungary's Fidesz, Poland's PiS, Turkey under the AKP, and actors within the US political system (particularly concerning norms around elections and institutional independence) operate differently. They exploit the letter of the law to gut its democratic spirit. Omnibus bills (rampant in Hungary and the US) allow ruling parties to bury controversial measures eroding checks and balances within essential legislation, forcing opposition into untenable choices and bypassing substantive debate. Emergency decrees (prominent in Turkey post-2016 and tested elsewhere during crises) concentrate power within legal frameworks but undermine legislative oversight and pluralism for extended periods. Judicial "reforms," using existing appointment rules (as in Poland and Hungary), systematically replace independent judges with loyalists, transforming courts from arbiters into enablers of executive dominance. Formally, the constitution remains intact; substantively, democratic competition and accountability atrophy.

  Legitimately designating this as "backsliding" without circularity requires anchoring the concept in *functional democratic outcomes* rather than mere legal compliance. Democratic theorists like Robert Dahl identified core institutions: free and fair elections, inclusive suffrage, freedom of expression and association, alternative sources of information, and institutions ensuring government responsiveness and accountability. Backsliding occurs when these *functions* are degraded, regardless of the precise *method*. Scholars like Steven Levitsky and Daniel Ziblatt emphasize the erosion of "mutual toleration" and "institutional forbearance" – norms preventing the abuse of power for partisan gain. When procedural instruments are weaponized to systematically disadvantage the opposition, silence critical media (via regulatory capture or economic pressure applied "legally"), or neutralize independent oversight bodies, the *effect* is identical to explicit rule-breaking: the playing field tilts decisively, rendering meaningful political competition impossible. Legitimacy stems not from partisan accusation, but from measurable declines in indicators like V-Dem's Liberal Democracy Index or Freedom House scores, which track functional erosion precisely in these areas – declines starkly evident in Hungary, Poland, and Turkey, and showing concerning trends in the US regarding electoral integrity and institutional independence.

  Comparing Hungary, Poland, Turkey, and the US reveals a strikingly common **structural pattern of procedural degradation**, not merely partisan labeling:
  1.  **Weaponizing Lawmaking:** All have seen ruling parties exploit legislative procedures (omnibus bills, fast-tracking, curtailing debate) to pass measures packing courts, gerrymandering districts, or controlling media regulators, all technically legal but corrosive to competition (e.g., Fidesz's supermajority laws, PiS's judicial "reforms," US state-level gerrymandering and voting restrictions).
  2.  **Executive Aggrandizement via Procedure:** Expanding executive power through statutory emergency powers (Turkey), exploiting budgetary or appointment processes to control nominally independent agencies (Hungary, Poland, US concerns over FEC or DOJ independence), or bypassing legislative scrutiny through extensive signing statements or executive orders pushing statutory boundaries (US).
  3.  **Judicial Capture through Appointments:** Leveraging legal appointment rules to install loyalists, thereby undermining judicial independence – the hallmark tactic in Poland and Hungary, with concerns over partisan judicial appointments impacting perceptions of the US Supreme Court's legitimacy.
  4.  **Erosion of Institutional Forbearance:** A consistent disregard for norms of restraint, using every procedural loophole to maximum partisan advantage, treating politics as a zero-sum game where opponents are enemies to be disabled "by the book."

  This pattern transcends specific ideologies (conservative nationalism in Hungary/Poland, Islamist-rooted conservatism in Turkey, polarized partisanship in the US) and reveals a shared *modus operandi*: using the state's procedural machinery not to govern democratically, but to entrench power and disable opposition within a façade of legality. To label this *only* as "illiberal democracy" or "competitive authoritarianism" risks normalizing the erosion. "Backsliding" captures the crucial dynamic: a regression from a previous, more pluralistic state towards diminished democratic functionality, achieved through incremental procedural subversion.

  Therefore, reserving "democratic backsliding" solely for explicit rule-breaking is analytically bankrupt in the contemporary landscape. It creates a perverse incentive: autocrats learn to operate within technical legality while hollowing out democracy, rendering the concept useless precisely where it's most needed. **The conclusion is unequivocal: democratic backsliding must be reconceptualized around the core of "procedural degradation."** This means defining it as: *The deliberate and systematic use of formally legal procedures, instruments, and institutional changes by incumbent actors to reduce political competition, undermine accountability mechanisms, restrict pluralism, and entrench their own power, thereby diminishing the substantive functioning of democracy.*

  This refocusing retains analytical power. It allows for the objective identification of backsliding in Hungary, Poland, Turkey, and the US based on observable patterns of institutional manipulation and their measurable effects on democratic performance, moving beyond partisan claims to a functional assessment. It highlights the common structural threat posed by the abuse of legal procedure, exposing the "hollow constitution" as a tool of authoritarian consolidation. Only by recognizing procedural degradation as the essence of modern backsliding can we accurately diagnose the threat and effectively defend democratic substance against its erosion by formalistic stealth.
