  Hmm, the user wants me to act as an expert philosopher of mind specializing in teleosemantics and the naturalisation of mental content. They're a PhD student in philosophy of cognitive science who serves on an interdisciplinary research-ethics panel. This panel reviews proposals that attribute representational content to biological organisms or engineered systems, and they need a reusable decision procedure for determining when such attributions are justified on teleosemantic grounds.

  The panel has unique constraints: meetings are only 45 minutes per proposal, and members include scientists without philosophical training. So the procedure needs to be clear, step-by-step, and avoid jargon where possible. The core challenge is operationalizing teleosemantic concepts—like proper function, normal conditions, and misrepresentation—without oversimplifying into behaviourism or intentional-stance pragmatism. I need to flag how synthetic functional redundancy breaks the evolutionary paradigm.

  I'll brainstorm key ideas first. Teleosemantics grounds mental content in biological functions shaped by evolution. Proper function refers to what a trait was selected to do. For representation, this involves consumer-based accounts: states are representations because they're consumed by systems that use them for specific purposes under normal conditions. Misrepresentation occurs when the state is tokened incorrectly, like a false alarm. The hard case is engineered systems without evolutionary history; here, I'll need to use design intentions as a proxy, but synthetic redundancy might create ambiguity.

  For the procedure, I'll structure it as an ordered checklist with decision nodes. Each step must specify: sufficient evidence for a "yes," what yields a "no," and where value judgments are forced. I'll preserve the teleosemantic triad and handle engineered systems explicitly. Then, I'll provide test scenarios and apply the procedure to three proposals, including one counter-intuitive case to show limits.

  The user's deeper needs seem to be about interdisciplinary communication and avoiding philosophical pitfalls. They want a tool that's rigorous yet accessible, so scientists can engage without confusion. The misfires with synthetic redundancy are crucial—I'll explain how identical functions might lack a unified history, making attribution arbitrary. Finally, I'll keep the language formal, use British spelling, and avoid citations as requested.

  Now, I'll outline the procedure clearly: start with functional analysis, then selection history, followed by conditions for representation, and so on. For the test scenarios, I'll make them concise and illustrative. In the applications, the ant case should pass easily, the drone might fail due to synthetic redundancy, and I'll create a counter-intuitive case involving a symbiotic organism to highlight where human judgment is needed. This should cover all specifications while staying within scope.
answer: |-
  ### Teleosemantic Attribution Decision Procedure  
  *(For Interdisciplinary Research-Ethics Review Panels)*  

  **Procedure Rationale**: This checklist operationalises teleosemantic principles by requiring evidence of *selection-based proper function* (historical or designed), *consumer-based consumption conditions*, and *non-accidental normativity* permitting misrepresentation. It avoids behaviourism by demanding etiological function, not mere covariation. It avoids intentional-stance pragmatism by requiring objective functional criteria, not instrumental utility. Synthetic redundancy is handled via *designer-intention-as-selection-proxy*, with strict limitations.  

  ---

  **DECISION PROCEDURE: ORDERED CHECKLIST**  

  1.  **Functional Analysis**:  
      *   **Query**: Does the candidate state (e.g., neural pattern, circuit activation) play a distinct causal role in a larger functional system (e.g., sensorimotor loop) within S?  
      *   *Sufficient Evidence*: Empirical data showing the state reliably mediates between specific inputs and specific outputs contributing to S's persistence/reproduction (biological) or designed purpose (engineered).  
      *   *Negative Verdict*: If the state lacks a stable causal role (e.g., random noise, epiphenomenal).  
      *   *Value Judgement Trigger*: None – this is purely structural/functional.  

  2.  **Selection History (Etiology)**:  
      *   **Query**: Was this causal role stabilised by a history of selection (natural/artificial) or by deliberate design to fulfil that role?  
      *   *Sufficient Evidence*:  
          *   *Biological*: Phylogenetic/adaptationist evidence (e.g., comparative anatomy, genetic studies, fitness advantages).  
          *   *Engineered*: Design specifications/documentation explicitly stating the intended function of the state/module.  
      *   *Negative Verdict*: If the state’s role is purely coincidental, emergent without selection/design, or results solely from recent individual learning *not* exploiting an evolved/designed learning mechanism.  
      *   *Value Judgement Trigger*: None – requires factual evidence of history/design intent.  

  3.  **Consumer Mechanism & Normal Conditions**:  
      *   **Query**: Is there a distinct "consumer" mechanism (e.g., motor circuit, decision module) that *exploits* the candidate state to perform *its* proper function, and does this exploitation presuppose specific environmental conditions (Normal Conditions)?  
      *   *Sufficient Evidence*: Mechanism identified whose operation depends on the candidate state *and* whose own function (per Step 1 & 2) is facilitated by this state carrying specific environmental information.  
      *   *Negative Verdict*: If no distinct consumer exists, or if the consumer's function doesn't require informational input (e.g., simple reflex without state dependence).  
      *   *Value Judgement Trigger*: Defining precise "Normal Conditions" may involve some interpretation of optimal function, but should be evidence-based (e.g., typical habitat, designed operating parameters).  

  4.  **Misrepresentation Possible**:  
      *   **Query**: Could the candidate state be tokened *in error* relative to its assigned content under Normal Conditions, leading to consumer malfunction?  
      *   *Sufficient Evidence*: Documented instances or plausible scenarios where the state is elicited abnormally (e.g., false alarm, illusion) causing the consumer to fail at its function *despite* Normal Conditions.  
      *   *Negative Verdict*: If the state only correlates with its cause under all observed/plausible conditions, or if "error" always coincides with abnormal consumer conditions (e.g., system damage).  
      *   *Value Judgement Trigger*: None – misrepresentation must be a *structural possibility* within the functional system.  

  5.  **Synthetic Redundancy Handling (Engineered Systems Only)**:  
      *   **Query**: For engineered systems with redundant components (e.g., triple detectors), was each component *independently designed* with the *same specific informational function*, or is redundancy emergent/aggregative?  
      *   *Sufficient Evidence*: Design documents explicitly assigning the *same* representational role to each redundant element.  
      *   *Negative Verdict*: If redundancy emerges from aggregate function without individual design intent (e.g., neural network weights), or if components have distinct design functions despite functional overlap (*Synthetic Redundancy Misfire*).  
      *   *Value Judgement Trigger*: If design intent is ambiguous regarding individual component function vs. system-level function. **Flag**: Synthetic redundancy without explicit design intent for *each* component breaks the etiological basis for attributing content *to the specific state*.  

  **Overall Attribution Verdict**:  
  *   **Justified**: Only if all Steps 1-4 yield positive answers (and Step 5 is satisfied for engineered systems).  
  *   **Not Justified**: If any Step yields a negative verdict.  
  *   **Judgement Required**: If a Value Judgement Trigger is indicated and consensus cannot be reached on the factual basis.  

  ---

  **Rapid Test Scenarios (4 Sentences Each)**  

  1.  **Passing Biological**: Honeybee waggle dance. The dance pattern (state) directs hive-mates to food (functional role). This evolved via selection (etiology). The navigational system (consumer) uses it to locate food, presupposing sun position (normal conditions). Misrepresentation occurs if dance encodes wrong location, leading to wasted foraging.  
  2.  **Failing Covariance**: Thermostat mercury. Mercury height covaries with temperature and triggers heating. No selection history for mercury *as a signal*; its role is purely physical. No distinct consumer mechanism exploiting information; it's directly causal. No misrepresentation possible separate from system failure.  
  3.  **Failing Synthetic Redundancy**: Drone with three vision modules. Modules detect threats redundantly, ensuring system reliability. Design documents state only the *system* must trigger evasion, not what *each* module represents. Redundancy is aggregative, no individual module has designed representational function.  
  4.  **Ambiguous Design**: AI classifier trained to flag "defects". The activation pattern (state) correlates with defects. It was designed (etiology) for this correlation. The rejection arm (consumer) uses it to discard items. Misrepresentation (false positives/negatives) occurs. *Judgement Trigger*: Is the correlation itself the designed function, or is the function simply "cause rejection when defect probability > X" without intrinsic representational content?  

  ---

  **Procedure Application to Proposals**  

  1.  **Ant Pheromone Trail ('Food-Source')**  
      *   Step 1: **Yes**. Pheromone concentration mediates trail-following behaviour crucial for foraging.  
      *   Step 2: **Yes**. Strong phylogenetic evidence of selection for efficient foraging via pheromones.  
      *   Step 3: **Yes**. Ant locomotion system (consumer) uses pheromone state to navigate, presupposing stable chemical environment (normal conditions).  
      *   Step 4: **Yes**. Trails can persist after food depletion (misrepresentation), leading ants astray.  
      *   **Verdict**: Attribution **Justified**. Teleosemantic criteria fully met.  

  2.  **Synthetic Drone Vision Module ('Threat')**  
      *   Step 1: **Yes**. Module activation mediates evasion response.  
      *   Step 2: **Yes (Proxy)**. Designed to trigger evasion.  
      *   Step 3: **Yes**. Evasion system (consumer) uses module output, presupposing operational sensors/actuators (normal conditions).  
      *   Step 4: **Yes**. False positives/negatives possible, causing inappropriate/no evasion.  
      *   Step 5: **Synthetic Redundancy Handling**: **Likely No**. Unless design docs explicitly assign the *representational* function 'threat' individually to each redundant detector (unlikely; focus is system reliability). The modules are means to a system function, not designed representational states in themselves.  
      *   **Verdict**: Attribution **Not Justified**. Fails Step 5. Redundancy without individual representational design intent breaks the etiological basis for attributing content *to the specific module state*.  

  3.  **Counter-Intuitive Case: Gut Flora 'Toxin' Representation**  
      *   *Proposal*: Attributing 'toxin presence' to a metabolic state in symbiotic gut bacteria that triggers host vomiting.  
      *   Application:  
          *   Step 1: **Yes**. Bacterial state triggers host vomiting reflex.  
          *   Step 2: **Yes**. State selected *in bacteria* to expel gut toxins harming *bacteria*.  
          *   Step 3: **Yes**. Bacterial signalling pathway (consumer) exploits state to preserve bacterial colony, presupposing host gut chemistry (normal conditions).  
          *   Step 4: **Yes**. State could be triggered by harmless compounds (misrepresentation), causing unnecessary vomiting.  
          *   **Verdict**: Attribution **Justified** on teleosemantic grounds (content: 'toxin harmful *to bacteria*').  
      *   **Counter-Intuition & Procedure Limits**: Humans intuitively associate vomiting with harm *to the host*. The procedure attributes content based solely on the *producer's* (bacteria) selection history and consumers. It cannot resolve:  
          *   **Level of Explanation Conflict**: Is the relevant function/consumer bacterial or host? Teleosemantics focuses on the system where selection acted (here, bacteria).  
          *   **Content Specificity**: The procedure validates *a* representational content (toxin-to-bacteria), but not necessarily the *intuitively expected* one (toxin-to-host). Human judgement is needed to determine whether *this level* of attribution is biologically/ethically relevant for the proposal's context.  

  ---

  **Procedure Limits & Misfire Points**  

  1.  **Synthetic Redundancy Misfire**: The procedure fails robustly for engineered systems where functional redundancy is achieved without explicit design of *each component* as a representational state (Step 5). It cannot attribute content to the state if redundancy makes the function aggregative rather than individually etiological.  
  2.  **Learned Representations**: Handles only innate or designed representations. Complex learned representations (e.g., human concepts) require supplementary analysis of learning mechanisms' functions, beyond this rapid procedure.  
  3.  **Content Grain Problem**: Validates *that* a state represents *something specific*, but determining the *precise* content (e.g., 'predator' vs. 'looming dark shape') relies on interpreting Normal Conditions and consumer function – this has inherent ambiguity the procedure flags but cannot fully resolve.  
  4.  **Anthropocentrism Risk**: The counter-intuitive case highlights that validated content reflects the *producer/system's* selective history, not human intuition. Judgement is needed to assess the relevance of this attribution level for the proposal's aims.  
  5.  **Value Judgement Scope**: The procedure minimises but cannot eliminate value judgements, particularly in defining 'Normal Conditions' (Step 3) and interpreting ambiguous design intent (Step 5). Panel expertise must resolve these.  

  This procedure provides a rigorous, non-behaviourist, non-pragmatist framework for teleosemantic attribution, explicitly handling the challenge of synthetic systems while flagging its inherent limitations and points requiring expert panel deliberation.
