  hey, i've been chewing on Borges's time essays — specifically the New Refutation and Garden of Forking Paths — and i think there's a reading people miss. everyone wants to map him onto eternalism or presentism, but actually he's doing something closer to modal fictionalism about temporal locations. like, the present is just the index of the story we're currently telling ourselves, and branching futures in the Garden aren't metaphysical worlds but narrative possibilities that become actualized only retroactively through narration. so time isn't real, but it's not an illusion either — it's a useful fiction with a specific logical structure.

  i wrote up some notes comparing this to Lewis-style modal realism but with accessibility relations defined by narrative coherence instead of physical law. i think it avoids teh problem of overcounting worlds (since incoherent branches don't exist even as possibilities) and explains why Borges is obsessed with mirrors and libraries — they're symbols for the self-referential loops in this narrative structure.

  anyway, i'm probably butchering the philosophy of time literature here. can you read through these notes and tell me if teh comparison holds up? specificaly: is it fair to say Borges anticipates modal fictionalism, or am I projecting? and does the narrative-accessibility move actually solve teh overcounting problem, or does it just push it back one level? also, is this interesting or just another rationalist taking a writer they like and dressing him up in analytic philosophy? be honest — i can take it.
