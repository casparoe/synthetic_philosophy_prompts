  First, I need to outline what old evidence means in Bayesian terms. The core issue is that if evidence E is already known, conditional probability P(H|E) equals P(H), so learning E again doesn't update beliefs. But intuitively, E should support H. The user wants a systematic breakdown of what any adequate theory must handle.

  The user mentions three scenarios. The Glymour case is straightforward: E is known, conditioning doesn't change anything. The forgotten prior is trickier; the agent formed their beliefs with E but doesn't remember, so their prior already incorporates E. Stale archive involves old data collected under a rejected model, now needing integration. Each case tests different aspects of belief updating.

  Desiderata must include handling these cases, avoiding trivialization, and maintaining distinctions like genuinely old vs. apparently old evidence. Also, prior revision vs. belief revision is crucial. The user hints that some desiderata might conflict, so I need to check for possible impossibilities.

