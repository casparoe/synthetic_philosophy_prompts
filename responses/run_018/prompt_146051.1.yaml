answer: |-
  ## Office of Scientific Demarcation (OSD) – Frequently Asked Questions (FAQ)

  **Last Reviewed:** 07/15/2023
  **Publication Number:** OSD-PUB-0012.4

  **PREAMBLE:** The Office of Scientific Demarcation (OSD), operating under Title IX, Chapter 42 of the Unified Administrative Code (Science & Knowledge Governance), administers the Scientific Certification Program (SCP). The SCP assesses claims, theories, and research programs against the sole statutory criterion: demonstrable exposure to potential empirical refutation (UAC S&KG §42.5(a)). Certification signifies compliance with this criterion per OSD regulations (7 CFR Part 781). This FAQ addresses common procedural inquiries. For binding determinations, consult published regulations or file a formal petition (Form OSD-102).

  **Q1: My field is pure mathematics. Can I apply for Provisional Certification for a new theorem or conjecture?**
  **A:** No. Pure mathematical assertions, while potentially subject to logical disproof, lack the requisite engagement with contingent empirical observation mandated by UAC S&KG §42.5(a). Mathematical proofs operate within defined axiomatic systems and are verified through deduction, not falsified by sensory data or instrumental readings. Consequently, pure mathematics falls outside the OSD's statutory purview. Applications concerning applied mathematical models used to generate testable predictions about observable phenomena *are* eligible, provided Form OSD-201 (Empirical Risk Assessment Annex) is fully completed, detailing the specific empirical risk vectors.

  **Q2: What happens if an OSD-certified theory makes a prediction that appears to be contradicted by experimental or observational data?**
  **A:** OSD Protocol 781-G ("Apparent Refutation Incident Response") governs this scenario.
  1.  **Incident Reporting:** The Principal Theory Holder (PTH) or any licensed Experimental Verifier must file Form OSD-310 (Apparent Refutation Event Report) within 90 calendar days of peer-reviewed publication of the contradictory data.
  2.  **Provisional Status Review:** The OSD automatically places the certified theory under Provisional Review Status (PRS). Its Risk-Exposure Ledger (REL) score is temporarily set to "Minimal" (REF: OSD Administrative Bulletin 781-G.2).
  3.  **Auxiliary Hypothesis Declaration:** The PTH may submit Form CS-1 (Declaration of Auxiliary Hypotheses & Background Conditions), identifying elements *other* than the core certified claim potentially responsible for the failed prediction (e.g., instrumentation calibration, environmental parameters, unverified auxiliary assumptions).
  4.  **Conventionalist Stratagem Review Board (CSRB) Assessment:** The CSRB evaluates the Form CS-1 declaration per 7 CFR §781.22. The Board assesses whether the invocation of auxiliary hypotheses constitutes:
      *   A legitimate refinement consistent with established scientific practice (e.g., identifying a previously unaccounted-for variable, supported by independent evidence), or
      *   A disqualifying "conventionalist stratagem" (i.e., an ad hoc adjustment made solely to immunize the core theory from refutation, lacking independent testability or parsimony).
  5.  **Determination & REL Adjustment:**
      *   If the CSRB deems the auxiliary invocation legitimate, the core theory retains certification. The REL score is recalculated, potentially incorporating the newly identified background risks. Form OSD-215 (Risk-Exposure Ledger Update) must be filed.
      *   If the CSRB deems it a stratagem, certification is revoked. The PTH may appeal to the Administrative Law Judge (Science Chamber) within 30 days (Form OSD-410).
      *   If no Form CS-1 is filed within 180 days, certification lapses automatically.

  **Q3: Our research program involves a core theoretical framework, but we frequently adjust its predictive models *after* data collection to achieve better alignment with observations. Can this program qualify for or renew SCP certification?**
  **A:** Qualification depends on rigorous OSD assessment. A pattern of post-hoc adjustments raises significant concerns under 7 CFR §781.15 (Predictive Integrity & Falsifiability Maintenance). Key factors evaluated:
  *   **Ex Ante Predictions:** Does the program generate and register specific, quantifiable predictions *before* data relevant to testing them is acquired or analyzed? (Form OSD-205: Pre-Data Prediction Registry).
  *   **Transparency of Adjustment:** Are all post-hoc modifications fully documented and justified per Form CS-2 (Post-Hoc Adjustment Rationale), demonstrating they are not merely accommodative but stem from independently motivated theoretical developments or identification of systematic errors?
  *   **CSRB Review:** The CSRB will scrutinize the history of adjustments. Consistent reliance on untestable or highly complex modifications invoked only *after* failed predictions is indicative of stratagems leading to disqualification. A demonstrable trend of adjustments leading to *new*, independently testable, and riskier predictions may support renewal, contingent on REL score maintenance above the threshold (currently 6.5 on the 10-point Vulnerability Index).
  *   **REL Trajectory:** The Risk-Exposure Ledger must show a non-decreasing trend in aggregate predictive vulnerability over the certification period. Persistent post-hoc alignment without a corresponding increase in exposed risk surface area is grounds for non-renewal (OSD Policy Memo 781-R1).

  **Q4: How can theories like classical mechanics or germ theory retain OSD certification when their core principles are considered well-established and not realistically subject to refutation in everyday practice?**
  **A:** These theories are covered under the "Heritage Exemption" (UAC S&KG §42.5(c), implemented by 7 CFR §781.50). Theories receiving widespread institutional acceptance and demonstrating extensive predictive utility *prior* to the statutory cutoff date (January 1, 1920) are eligible. Certification is maintained based on:
  1.  **Institutional Prestige:** Recognition within established scientific bodies and educational curricula.
  2.  **Historical Falsifiability:** Demonstrated exposure to, and successful navigation of, significant empirical challenges *during their formative development period* (pre-1920).
  3.  **Domain-Restricted Validation:** Certification applies strictly within their empirically validated domains of application (e.g., classical mechanics for macroscopic objects at non-relativistic speeds). Proposals to extend Heritage theories into new domains (e.g., quantum scales) require a new, standard SCP application demonstrating falsifiability *within that specific domain*.
  The Heritage Exemption acknowledges the practical impossibility of subjecting foundational frameworks to de novo falsification tests annually, while recognizing their historical conformity to the demarcation criterion during their risk-exposed developmental phase. Their REL scores are administratively set at "Stable - Heritage" and exempt from routine re-evaluation.

  **Q5: If a theory is definitively verified by overwhelming evidence, does it receive permanent certification?**
  **A:** No. OSD certification is contingent solely on *exposure to potential refutation*, not on degrees of confirmation (UAC S&KG §42.5(a) Note 3). Verification, while desirable, is logically distinct from, and does not supersede, the requirement for falsifiability. A highly verified theory must still maintain a demonstrable mechanism for potential empirical challenge to retain certification. Its REL score may reflect lower *estimated* risk, but the procedural requirement for maintaining exposure (e.g., via continued pre-registration of predictions in edge cases, responsiveness to Apparent Refutation Events) remains. Permanent certification does not exist; renewal cycles and responsiveness to Protocol 781-G incidents are mandatory for all non-Heritage theories.
