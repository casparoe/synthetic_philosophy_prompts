  2. The Molinist holds that CCFs remain grounded in the agent's stable, intrinsic free dispositions even when they encompass reasoning about divine omniscience, as these dispositions are metaphysically prior to and independent of divine knowledge, thus preventing self-referential loops from undermining truth-value.  
  3. The anti-Molinist contends that CCFs involving an agent's reasoning about divine omniscience either lack grounding—because the truth-value would circularly depend on God's foreknowledge—or collapse into mere descriptions of divine foreknowledge, which derive their truth from the actual future rather than creaturely freedom.  
  4. The crux: In a case where an agent updates from doubt to belief in divine omniscience mid-deliberation in circumstance C, then reasons about action A, the Molinist predicts the CCF "If in C (with updated belief), the agent would freely do A" retains its original truth-value, grounded solely in the agent's disposition; the anti-Molinist predicts it either becomes ungrounded or its truth-value shifts to match divine foreknowledge of the actual outcome.  
  5. Both parties determine that the disagreement over whether dispositions provide non-circular grounding is substantive, not verbal, as it hinges on incompatible metaphysical commitments about the relationship between divine knowledge and creaturely freedom, with no merely terminological ambiguity.
