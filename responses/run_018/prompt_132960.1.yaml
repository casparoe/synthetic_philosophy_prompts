prompt: |-
  I'm preparing material for a bioethics seminar and want to use the film Gattaca not to illustrate but to complicate the therapy/enhancement distinction. In the narrative, Vincent Freeman is a naturally conceived man who assumes the identity of Jerome Morrow, a genetically optimized individual, in order to secure employment at the Gattaca Aerospace Corporation and eventually pilot a mission to Titan. The society depicted treats the prenatal elimination of predispositions to heart disease, myopia, and alcoholism as routine hygiene rather than elective improvement, while Vincent's naturally occurring heart condition is classified as a congenital defect that warrants complete social exclusion. Read the film through the standard therapy/enhancement distinction—interventions that restore species-typical functioning versus those that exceed it—but do not allow the distinction to rest comfortably. I want you to examine whether the film exposes a 'moving baseline' problem: if the statistical norm used to define 'healthy' functioning is itself the product of generations of engineered genomes, then the boundary between correcting a defect and enhancing a trait collapses into a circular social convention rather than a fixed biological fact. Pay particular attention to the swimming competitions between Vincent and his engineered brother Anton, where physical superiority is presented as both genetic destiny and disciplined achievement, and to the medical screening scenes in which Vincent's heart is simultaneously a biological reality and a bureaucratic disqualification. Where does the narrative treat his condition as a disability requiring cure, and where does it present it as a mere deviation from an artificially constructed norm?

  Additionally, consider whether the film's resolution—Vincent's successful flight despite his 'inferior' genome—constitutes a philosophical argument that genetic baseline is irrelevant to human achievement, or whether it ultimately reinstates the enhancement paradigm by demonstrating that Vincent can only succeed by fabricating an enhanced persona. I am not asking for a plot summary, bibliographic references, or a list of philosophers; I want a critical reading that takes both the cinematic narrative and the conceptual architecture of the distinction seriously. Conclude by identifying what the film adds to the philosophical debate about normative baselines that a purely argumentative essay on the therapy/enhancement boundary could not supply.
