  ### Thought Experiment: The Forgotten Flaw  
  A small engineering firm relocates offices. During the move, junior engineer Kim discovers a 30-year-old structural assessment report misfiled in a decommissioned cabinet. It warns that the building's foundation (unknown to current management) cannot withstand severe seismic activity. Kim scans it hastily but forgets to label it properly in the digital archive. The file is automatically sorted into an obscure subfolder by flawed software. The sole senior engineer who understood such reports retired years prior; no living person recalls the assessment. Five years later, after the firm dissolves and all original staff leave, the building collapses during an earthquake that newer models deemed safe, killing occupants. Kim’s omission—failing to ensure the report was actionable—remains undiscovered.  

  ### Analysis by Position  
  **1. Free-Floating Rationales (FFR) View:**  
  The omission is morally wrong. A *pro tanto* reason existed to prevent foreseeable harm (deaths) by securing the report’s visibility. This reason derived from the objective relationship between the building’s latent danger and human welfare—independent of anyone’s awareness. The report’s existence created a *duty* to act, grounded in the normative truth that preventable death is *prohibited* irrespective of subjective states.  

  **2. Strict Reasons-Internalism (SRI) View:**  
  No wrongness occurred. Reasons require a connection to an agent’s "motivational set" (desires, values, commitments). At the time of omission:  
  - Kim had no relevant motivation (unaware of the report’s significance).  
  - No other agent possessed access to the report or its implications.  
  - Future victims lacked epistemic access to create a "potential" reason.  
  Since no actual or hypothetical agent could be motivated to act (the information was irrevocably obscured), no normative reason existed to label the omission "wrong." Blame is irrelevant; the *wrongness itself* vanishes.  

  ### Crucial Feature Forcing the Split  
  **Total Epistemic Irretrievability:**  
  The report’s *physical existence* does not translate to *normative accessibility*. FFR treats the physical evidence as sufficient to generate a reason (truths create duties). SRI requires the information to be *potentially integrable* into some agent’s practical reasoning—which was impossible once misfiled and uninterpretable.  

  ### Internalist Counterattack & Assessment  
  **Attack:** The internalist posits a **counterfactually motivated agent**. "Had *any* agent (e.g., Kim’s supervisor) known the report’s content, they’d have been motivated to act by basic self-preservation or professional duty. Thus, the reason *was* anchored to a dispositional motivational set."  

  **Rebuttal:** This fails SRI’s own criteria. Internalism requires the motivation to be *actualizable* by the agent in their context. Crucially:  
  - No agent had access to the information needed to *trigger* motivation.  
  - Dispositional motivations (e.g., "engineers generally want to save lives") are inert unless an agent can *recognize* their applicability. Here, no agent *could* recognize it.  
  The counterfactual invokes an *idealized* agent with impossible knowledge, violating internalism’s requirement for reasons to be *practically operative*. SRI cannot ground reasons in permanently inaccessible facts without collapsing into FFR.  

  ### Conclusion  
  The case isolates the core dispute: FFR accepts *mind-independent normative facts* (danger → reason to prevent harm), while SRI insists reasons are *constituent parts of agency*. The internalist attack fails because it smuggles in epistemic access contrary to the scenario’s parameters. Only FFR can condemn the omission as objectively wrong—precisely *because* no one was there to care.
