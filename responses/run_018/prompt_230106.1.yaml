prompt: |-
  Longtime rationalist-blog reader here. In an open-thread argument about whether inheritance taxes should be much higher, the pro-tax person's whole case was the line "you can't have equality of opportunity when some kids inherit a fortune." When I pushed, they swapped in "leveling the playing field," and when I asked what that meant operationally they said it's the accident of birth, not merit, and repeated the slogan slower. I tried tabooing "opportunity" and they just got annoyed.

  I'm pretty sure there are seperate precise claims hiding in that slogan—starting-gate versus ongoing equality, formal versus substantive equality, competitive versus non-competitive readings, ex ante versus ex post versions, Rawlsian fair equality of opportunity versus luck-egalitarian versions, maybe others—and only some of them make heavily taxing inherited wealth something close to mandatory. I'd like a menu: for each distinct reading, say what it precisely claims, whether it's a platitude or a substantive claim, whether it's defensible or just false, and whether it actually gets you to a steep inheritance tax. Then tell me which reading the forum person was probably leaning on, and whether the arguement they were making had the version it needed to do that work.

  Don't lay out the options and leave me to pick; give me your committed verdict on each reading, and a definite statement of what someone has to show to get from "equality of opportunity" to "tax inherited wealth heavily."
reasoning: |-
  Okay, the user is a longtime reader of rationalist blogs who got into an argument about inheritance taxes. The other person kept saying that you can't have equality of opportunity when some kids inherit fortunes. The user pushed back, but the other person just repeated slogans and got annoyed when asked for specifics. 

  Hmm, the user seems frustrated by the vagueness of the argument. They recognize there are different interpretations of "equality of opportunity" but want them clearly laid out. They want a taxonomy that shows which versions actually support high inheritance taxes. 

  First, I need to unpack the different meanings of "equality of opportunity." There are several distinct concepts here: 

  The starting-gate theory comes to mind—that everyone should begin life with equal resources. But that's actually controversial, not a platitude. Then there's Rawls' fair equality of opportunity, which requires correcting social contingencies but not necessarily all genetic luck. And luck egalitarianism that tries to neutralize all arbitrary disadvantages. 

  The user is sharp—they already hinted at these distinctions. I should address each version systematically: define it, say if it's defensible, and whether it mandates high inheritance taxes. 

  I notice the forum person kept saying "accident of birth" and equating it with lack of merit. That sounds like luck egalitarianism. But they never specified if they meant all accidents of birth or just social ones. That's probably why the user was frustrated—the argument was leaning on the strongest version (full luck egalitarianism) without admitting it. 

  The key insight is this: only radical luck egalitarianism demands heavy inheritance taxes as a direct imperative. Other versions might permit it as one tool among many, but don't strictly require it. The forum person was smuggling in the strong version while presenting it as self-evident. 

  I should also flag that even if we accept luck egalitarianism, inheritance taxes alone won't achieve it—you'd need to address genetic inequalities too. The forum argument oversimplifies. 

  The user wants verdicts, not just options. So I'll conclude that unless the person defends full luck egalitarianism (which is contentious), their slogan doesn't force high inheritance taxes. Their argument was rhetorically effective but logically incomplete.
answer: |-
  Here's a dissection of the "equality of opportunity" (EoO) slogan as it relates to inheritance taxes, breaking down the distinct readings, their implications, and the forum user's likely position. The core issue is that **most common-sense definitions of EoO *do not* strictly require heavy inheritance taxes**; only the most radical, controversial interpretation does.

  ### The Menu of Interpretations & Verdicts

  1.  **Formal Equality of Opportunity (The Platitude)**
      *   **Precise Claim:** No legal or institutional barriers prevent individuals from competing for positions or advantages based on irrelevant characteristics (e.g., race, gender, religion). Jobs are open to talents. Inherited wealth isn't a formal barrier.
      *   **Platitude/Substantive?:** Platitude in liberal democracies. Universally accepted in principle.
      *   **Defensible?:** Yes, but insufficient. It ignores vast *de facto* advantages/disadvantages.
      *   **Implies Heavy Inheritance Tax?:** **No.** Formal EoO is perfectly compatible with massive inherited wealth disparities. The law treats rich and poor kids equally; the rich kid just has tutors, connections, and no debt.
      *   **Forum Person's Usage?** Unlikely. They explicitly mentioned the "accident of birth" as the problem.

  2.  **Starting-Gate Equality of Resources (Common Libertarian/Moderate View)**
      *   **Precise Claim:** Society should strive to ensure individuals begin their adult lives (the "starting gate") with roughly equal *initial* resources/capital/investment. Past injustices or family wealth accumulation before that point are irrelevant *for the starting line*.
      *   **Platitude/Substantive?:** Substantive claim. Popular but not universally accepted.
      *   **Defensible?:** Reasonably defensible as a moderate goal. Focuses on agency and initial fairness.
      *   **Implies Heavy Inheritance Tax?:** **Not Necessarily, and Not Heavily.** This view *could* support *modest* inheritance taxes or wealth taxes to fund things like universal basic capital grants, equal K-12 funding, or college access programs *for the next generation*. However, it **does not** inherently require *confiscating* large inheritances from *adults* (the recipients) who are *at* the starting gate. The focus is on funding the starting position of *youth*, not taxing the *transfer* itself heavily. It might even allow significant parental *inter vivos* gifts for education/housing if the "starting gate" is defined at adulthood.
      *   **Forum Person's Usage?** Possible, but their focus on "inheriting a fortune" *as the direct problem* suggests they go further.

  3.  **Rawlsian Fair Equality of Opportunity (FEO)**
      *   **Precise Claim:** Individuals with similar talents and motivation should have roughly the same prospects of success *regardless of their initial social class*. This requires society to actively correct for social contingencies (family wealth, class background, neighborhood quality) to ensure background doesn't dictate life chances *for those with equal native endowments*. Rawls explicitly distinguishes this from correcting for natural talents themselves.
      *   **Platitude/Substantive?:** Deeply substantive claim. A cornerstone of liberal egalitarianism.
      *   **Defensible?:** Highly defensible within its framework. It targets specific, socially created disadvantages.
      *   **Implies Heavy Inheritance Tax?:** **Strong Support, But Not Strictly Mandatory as the *Only* Tool.** FEO provides a *very strong* justification for taxing inherited wealth *as one major mechanism* among others (like progressive education funding, healthcare access, anti-discrimination laws) to mitigate class-based advantages. It *does* see large inheritances as creating unjust class-based advantages contrary to FEO. However, Rawls himself prioritized his Difference Principle over FEO, and FEO could *theoretically* be achieved through other highly redistributive means (e.g., massive wealth taxes funding childhood investments) without specifically targeting inheritance *transfers* at high rates. The *practical* argument is very strong, but the *logical* necessity isn't absolute.
      *   **Forum Person's Usage?** Likely candidate. Their emphasis on "accident of birth" (specifically social class/wealth) and "leveling the playing field" aligns perfectly with FEO's core concern about social class.

  4.  **Comprehensive Luck Egalitarianism (The Radical View)**
      *   **Precise Claim:** Inequalities arising from factors beyond an individual's control ("brute luck") are unjust and should be compensated for or neutralized. This includes *both* social contingencies (like family wealth) *and* natural contingencies (like innate talent, health, or looks). "Option luck" (risks deliberately taken) is fair game.
      *   **Platitude/Substantive?:** Highly substantive and radical claim.
      *   **Defensible?:** Controversial and arguably incoherent/infeasible. It faces the "abandonment objection" (punishing victims of bad luck) and the near-impossibility of disentangling luck/effort. Compensating for *all* brute luck, including genetics, is implausible.
      *   **Implies Heavy Inheritance Tax?:** **Yes, But Inconsistently and Insufficiently.** Luck egalitarianism provides the *clearest, most direct* argument that inheriting wealth is morally arbitrary ("brute luck") and thus the resulting inequality is unjust and should be heavily taxed/redistributed. **However, this logic is inconsistent:** If *all* brute luck is unjust, why stop at inheritance? Innate intelligence, charisma, health, and parental nurture (not just money) are also brute luck and confer massive advantages. A *consistent* luck egalitarian would need to tax/compensate for *all* these advantages too, which is practically absurd. Heavy inheritance taxes alone don't achieve luck egalitarianism; they only address one specific type of brute luck while ignoring others. It's necessary *within this framework*, but far from sufficient.
      *   **Forum Person's Usage?** Very likely *rhetorically*, but probably not consistently. Their exclusive focus on wealth inheritance ("fortune") while ignoring other arbitrary advantages suggests they were *leaning on the intuitive pull* of luck egalitarianism regarding wealth, but wouldn't endorse the full, radical implications (e.g., taxing genetic advantages). Their annoyance at tabooing hints at relying on the emotional resonance of "accident of birth = unfair" without grappling with its full scope.

  5.  **Ongoing/Equal Power Conception (Critical View)**
      *   **Precise Claim:** True EoO requires roughly equal *power* or *capability* to shape one's life and society throughout life, not just at the start or in competition. Large wealth disparities inherently create unequal power, undermining democratic equality and genuine freedom for the less wealthy.
      *   **Platitude/Substantive?:** Deeply substantive, often associated with socialist or republican thought.
      *   **Defensible?:** Defensible, emphasizing non-domination and substantive freedom, but distinct from traditional EoO.
      *   **Implies Heavy Inheritance Tax?:** **Strong Support.** Concentrated wealth, especially dynastic wealth, is seen as a direct threat to equal power and democratic functioning. Heavy inheritance taxes are a direct tool to prevent the entrenchment of oligarchic power.
      *   **Forum Person's Usage?** Possible, but less likely given their specific focus on the "kid inheriting" and "merit" rather than broader societal power dynamics.

  **Your Forum Opponent: Diagnosis**

  *   **Leaning On:** Almost certainly **Comprehensive Luck Egalitarianism (selectively applied to wealth)**, rhetorically invoking **Rawlsian FEO** language ("accident of birth", "leveling the playing field"). They reduced EoO to the moral arbitrariness ("accident") of inherited wealth, explicitly contrasting it with merit. This is the core luck egalitarian move.
  *   **Did their argument have the version needed?**
      *   **Rhetorically:** Yes. Luck egalitarianism provides the most direct, intuitive, and seemingly decisive link: "Inheritance = arbitrary luck = unfair = must be heavily taxed." Its emotional resonance is strong.
      *   **Logically/Philosophically:** **No, critically.**
          1.  **Inconsistency:** They applied luck egalitarianism *only* to inherited wealth, ignoring other equally arbitrary advantages (genetics, health, parental nurture quality). Their argument only works if one accepts luck egalitarianism *and* arbitrarily limits its application to financial inheritance.
          2.  **Not Strictly Necessary:** Rawlsian FEO provides a strong *practical* case for taxing inheritance but doesn't make it the *only* or strictly *mandatory* solution in the way luck egalitarianism purports to for the specific advantage it targets. FEO could be achieved by other means.
          3.  **Slogan vs. Substance:** They treated "You can't have EoO when some inherit fortunes" as an axiomatic stopping point, refusing to engage with the necessary premises (like accepting luck egalitarianism) or the complexities (like defining the scope of "arbitrary luck"). Their annoyance at tabooing "opportunity" suggests they couldn't articulate the underlying principles clearly.

  **The Necessary Argument for Heavy Inheritance Taxes from EoO**

  To validly conclude that "equality of opportunity" **requires** heavy inheritance taxes, one must argue for **Comprehensive Luck Egalitarianism** and then show that:

  1.  Inheriting significant wealth is a prime example of "brute luck" (undeniable).
  2.  Inequalities resulting from brute luck are unjust and must be corrected (core luck egalitarian premise).
  3.  Heavy inheritance taxation is an effective and just mechanism for correcting *this specific type* of brute luck inequality (practical claim).
  4.  **(Crucially & Problematic):** Correcting *this specific type* of brute luck (inherited wealth) is a sufficient priority *without requiring* simultaneous correction of *other* brute luck inequalities (innate intelligence, health, etc.). This requires justifying why *financial* brute luck is uniquely problematic or prioritizable over other forms.

  **Your Verdict:** The forum opponent's slogan, while rhetorically powerful, **fails as a conclusive argument for heavy inheritance taxes.** It relies on an unstated and controversial commitment to luck egalitarianism, applied inconsistently only to inherited wealth, while refusing to engage with the necessary premises or the framework's own radical implications and limitations. Rawlsian FEO provides a much stronger *practical* justification, but even it doesn't make heavy inheritance taxes the *logically inevitable* conclusion – they are a highly effective *means* to achieve FEO, not its definitional *requirement*. The slogan masks substantive philosophical choices.
