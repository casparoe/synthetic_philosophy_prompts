  I'm a retired physicist who's been dipping into philosphy lately, mostly information cascades and rational herding. I keep thinking about how Bayesian hierarchical modelling spread through ecology and climate science in the 2010s — not because every lab tested it independently, but because grant pannels started treating it as default. That feels like a cascade, but with a twist: the first movers weren't just noisy, they were responding to institutional incentives. So here's my question: if you're advising someone on which open problems in cascade theory actually matter for understanding scientific practice, how would you rank them? Specifically, I'm torn between (1) whether rational herding survives when private signals are systematically biased by funding structures rather than random error, (2) whether there's a tractable model for 'reverse cascades' where negative results should break the chain but don't, and (3) whether the whole framework is overrated compared to studying direct incentive misalignment. Give me your prioritisation — defend the ordering, not just list them. Keep it to about 250 words max, British English please, and start with your bottom line in one sentence. No reading lists — I can't chase papers down easily these days.
