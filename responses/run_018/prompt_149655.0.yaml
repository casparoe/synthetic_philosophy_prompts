answer: |-
  **Bottom line:** Prioritise (3) direct incentive misalignment first, then (1) systematic bias in private signals, and finally (2) modelling failed reverse cascades.

  **Defended Order:**  
  **(3) Incentive misalignment** is paramount. Cascades are often a symptom, not the root cause. Before modelling *how* herding occurs under bias, you must identify the *structural drivers* – like publication pressure or grant panel favouritism – that distort rational choice itself. Ignoring this risks building elegant models of epiphenomena. Tackling (3) provides the essential context for why cascade dynamics manifest pathologically in science.  

  **(1) Biased private signals** comes next. Traditional models assume random signal noise. But funding structures actively *induce* systematic bias (e.g., prioritising certain methodologies). This fundamentally alters rational herding calculus: scientists aren't just weighing noisy data, they're anticipating which signals *will be rewarded*. Modelling this bias is crucial to understanding why cascades lock in despite contrary evidence – it makes the "rationality" contingent on perverse incentives.  

  **(2) Failed reverse cascades**, while important, is somewhat derivative. If incentives suppress negative results (problem 3) or bias signals towards positivity (problem 1), then the *failure* of negative evidence to break cascades becomes a likely consequence. Modelling this specifically is valuable for mechanism, but its tractability and impact depend heavily on resolving the prior two issues regarding the incentive landscape distorting the information flow itself.
