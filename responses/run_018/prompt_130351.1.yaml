  i know it sounds like monism or idealism, but it feels more specific. it's not "everything is mental" -- it's using the non-dual unity claim specifically to dissolve problems that assume there are distinct subjects. is there an established term for this exact maneuver? and if not, can you name and define it, with clear edges? like, how is it different from just denying the hard problem, or from schopenhauer's world-will, or from people who talk about quantum consciousness? i need the distinction for a character who's obsessed with this idea and i dont want to just call it "monism" and be done with it.
