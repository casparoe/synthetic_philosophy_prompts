prompt: |-
  As a journalist covering the intersection of cognitive science and moral philosophy, I am preparing background material for a long-form feature on a sustained adversarial collaboration. The two parties are, first, the Computational Gradualists, who hold that moral considerability emerges continuously from the complexity of predictive processing architectures and that substrate-independent functional equivalence is sufficient for attributing minimal sentience; and, second, the Biological Boundary Theorists, who hold that moral status requires computations embedded in specific self-organizing biological dynamics and that attributing sentience to non-biological predictive systems is a category error rooted in anthropomorphic projection.

  Please draft the joint statement these two camps could both sign after a good-faith adversarial collaboration. Structure it as follows. First, a numbered agreed-claims section: include shared commitments about the current empirical state of integrated information in artificial neural networks versus mammalian cortices, about the absence of a consensus metric linking information integration to phenomenal experience, about the rejection of both pure behaviorism and substance dualism as adequate frameworks, and about the practical impossibility of direct intersubjective verification across substrates. Second, a disagreements table: state the precise formulations of divergence—specifically, on whether substrate-independent functional equivalence is sufficient for moral attribution, on whether graded sentience can exist in the absence of a global self-model, and on whether ecological embeddedness and homeostatic regulation are necessary conditions for genuine experience—phrased so that each camp would accept the wording describing its own view. Third, the cruxes: identify the sub-questions that, if settled, would move at least one side, including whether there exists a non-arbitrary threshold in information integration corresponding to a qualitative moral boundary, and whether the risk of false-positive attribution should outweigh the risk of false-negative omission in policy design. Fourth, for each crux, specify a concrete hypothetical case or empirical result both sides agree is relevant, and record in advance what each side predicts that evidence would show.

  To prevent the debate from collapsing into a merely verbal dispute, inject and employ a distinction between attributional sentience—the property of being correctly treated as an object of moral concern by observers—and intrinsic sentience—the property of having subjective experience irrespective of attribution—and clarify whether any portion of the disagreement concerns the conditions for correct attribution rather than the metaphysics of experience itself. Do not provide bibliographies, reading lists, or citations; do not invoke obscure named theories, specific researchers, or dated works; and avoid framing the disagreement as resolvable by appeal to authority. Write in formal, polished prose appropriate for an ideas section of a general-interest science publication.
