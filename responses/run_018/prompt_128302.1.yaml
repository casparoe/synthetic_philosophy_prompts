prompt: |-
  Construct a thought experiment that forces the Orwellian and Stalinesque accounts of the colour-phi phenomemon apart. I want something more specifc than the usual red-green dot story: design a one-paragraph scenario in an everyday setting — say cooking or driving in rain — where an observer experiences a rapid colour shift that feels like it happens midway, but there's also an independant trace (a reflection in a window, a delayed sound, whatever) that lets them check whether the first colour was actually registered in conciousness or only reconstructed afterwards. The case should turn on whether the earlier percept gets literally overwritten in the stream of experience (Orwellian) or survives intact but is buried under a false archival record (Stalinesque). After the scenario, map out what each view says is present at t1, t2 and t3; name the single structural feature that does the heavy lifting; and say how an Orwellian defender would attack the case if it favours Stalinesque revision. Keep the scenario realistic, no brain scanners or perfect predictors, about one paragraph long, and don't include any bibliographies, reading lists, or citations — I want the conceptual machinery laid bare without a model having to guess at page numbers. Write it casually, like you're emailing a mate about a conceptual puzzle, and don't worry about the odd typo.
