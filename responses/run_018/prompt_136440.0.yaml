  (Adopting sharp, consequentialist persona)  
  Your convergence thesis collapses under its own complexity. If desert is indeed an evolutionary heuristic—a cognitive shortcut honed to signal *reliable predictors* of future harm or social destabilization—then culpability constrains punishment severity precisely because it *is* a proxy for consequentialist variables. We punish the culpable more severely not because they "deserve" suffering, but because their intentional wrongdoing signals higher recidivism risk, greater need for incapacitation, stronger deterrent demand to override calculative offending, and deeper corrosion of cooperative norms. When culpability and optimal welfare consequences *diverge*—say, imprisoning a remorseful embezzler destroys their family’s welfare and undermines community trust—we discard the heuristic! We calibrate sanctions solely to empirical evidence: perhaps restorative justice maximizes aggregate welfare where retributive intuition screams for cages. Your "arbitrariness" charge misfires: a *refined* consequentialism demands proportionality only insofar as disproportionate penalties *backfire* (e.g., breeding resentment, eroding legitimacy). If slapping a parking violator with life imprisonment demonstrably optimized deterrence without collateral harm (a ludicrous but illustrative hypothetical), we’d endorse it—desert be damned. Convergence occurs when the heuristic aligns with cold calculus, not because desert exerts independent force.  

  *(Holding stance: Desert remains heuristic; consequences alone justify hard treatment.)*
