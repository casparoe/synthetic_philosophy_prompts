prompt: |-
  I'm a philosophy professor helping out a colleague who curates the archaeology wing at a regional museum. Every couple months she has to sign off on interpretive plaques for new finds — claims like 'this burial orientation reflects a cosmological belief' or 'this tool standardization shows institutional control.' She needs a reusable decision procedure she can actually run in about 20 minutes before putting her name on the display text. No philosophy background required, but it has to be honest about where she's just making a judgment call.

  Please turn the core philosophy-of-archaeology idea — inference from material objects to beliefs and institutions, plus a formalized presumption of independence — into a flowchart-in-words: ordered gates, what counts as a sufficient answer at each, where it stops cold with 'do not infer belief or institution,' where it hands the decision off to a person because it's values not facts, and where it will definately misfire. Ground it in what the field actually knows, but operationalize it.

  Take a committed position, don't just list options: defend a specific split in how the independance presumption works for 'belief-artifacts' (objects that seem to encode propositional content) versus 'institutional-residue' (objects that only stabilize within a sustained practice). Then apply the procedure to three cases: (1) standardized burial orientations that might imply cosmological belief; (2) an abrupt shift in ceramic manufacture that might imply institutional oversight; and (3) a repetitive decorative motif on domestic pottery where your procedure outputs 'institutional residue present' but my colleague will hate that answer, since it sounds like ritual authority over everyday life. Say exactly what the procedure cannot do.

  No citations or reading lists — she can't check them and neither can I right now. Just the committed procedure with its reasons.
reasoning: |-
  Okay, let me tackle this problem step by step. The user is a philosophy professor helping an archaeology curator who needs a quick, reliable method to evaluate interpretive claims for museum plaques. The core challenge is inferring beliefs and institutions from material objects while acknowledging where judgment calls are necessary. 

  First, I need to establish a clear decision procedure that splits "belief-artifacts" (objects with potential propositional content) from "institutional-residue" (objects requiring sustained practice). This distinction is crucial because they require different types of evidence. For belief-artifacts, I'll require direct symbolic evidence since beliefs are internal states. For institutional-residue, recurring patterns across contexts would be sufficient because institutions manifest through consistent behavior.

  The procedure should have concrete gates:
  - Gate 1: Is there unambiguous symbolic encoding? (For beliefs)
  - Gate 2: Is there recurrence across distinct contexts? (For institutions)
  - Gate 3: Are there alternative explanations? (For both)
  - Gate 4: Is the inference value-laden? (For ethical judgment calls)

  For the three test cases:
  1) Standardized burial orientations: This fails at Gate 1 because orientation alone isn't inherently symbolic. It could be practical. 
  2) Abrupt ceramic standardization: Passes Gate 2 since standardization across workshops suggests institutional control. 
  3) Repetitive decorative motifs: Passes Gate 2 technically (pattern recurrence) but triggers Gate 4 - calling it "institutional" may overstate ritual authority when it could be fashion.

  The key limitations to emphasize:
  - Can't prove intentionality without textual evidence
  - Can't distinguish between institution types (religious vs. administrative)
  - Value-laden terms like "control" require curator judgment

  The procedure must be executable in 20 minutes, using only observable evidence and field-consistent reasoning. I'll make the gates sequential with clear pass/fail outcomes, and specify where the curator's subjective input is required for value-based interpretations.
answer: |-
  Here's a committed, executable procedure grounded in operational archaeology and inference limitations. It presumes that **beliefs require symbolic encoding** while **institutions require recurrence across distinct contexts**. The independence presumption splits: **belief-artifacts must show *intrinsic* symbolic properties**, while **institutional-residue requires *extrinsic* pattern stability** beyond individual actors. Values-based judgments are explicitly flagged.

  ---

  ### **The Inference Procedure: 20-Minute Flowchart-in-Words**
  **Core Rule:** Stop and default to "No inference to belief/institution" if any gate fails. Only proceed if all prior gates pass.

  1.  **GATE 0: MATERIAL EVIDENCE CLARITY**
      *   **Question:** Is the object/pattern *unambiguously* documented and contextualized (provenience, date, association)?
      *   **Pass:** Yes, with minimal post-depositional disturbance or ambiguity.
      *   **Fail:** No (e.g., looted context, poor recording). → **STOP. Label: "Function/Practice uncertain."**
      *   *Why?* Inference collapses without secure baseline facts.

  2.  **GATE 1: IS A BELIEF CLAIM BEING MADE?** (If YES, go to 1A. If NO, skip to Gate 2).
      *   **1A: INTRINSIC SYMBOLIC ENCODING TEST (For Belief-Artifacts)**
          *   **Question:** Does the object/pattern *itself* exhibit features *only* plausibly explained as encoding propositional content (meaning beyond immediate function)? Look for:
              *   Iconography with known cultural referents (e.g., sun symbols in a solar-worshipping culture).
              *   Inscriptions or unambiguous writing.
              *   Non-functional, highly formalized repetition tied to ritual *and* corroborated by ethnographic/ethnohistoric analogy.
          *   **Pass:** Yes, the symbolism is intrinsic and culturally attested (e.g., a figurine with deity attributes). → Proceed to Gate 3.
          *   **Fail:** No (e.g., orientation, color alone). → **STOP. Label: "Associated practice evident; belief content indeterminate."**
          *   *Why Split?* Beliefs are internal states. Material culture only signals them through deliberate, conventional encoding. Orientation/color lack intrinsic meaning without context *we don't have*. Independence requires the object to *speak* symbolically, not just *be* patterned.

  3.  **GATE 2: IS AN INSTITUTION CLAIM BEING MADE?** (If YES, go to 2A. If NO, go to Gate 3).
      *   **2A: EXTRINSIC RECURRENCE & STANDARDIZATION TEST (For Institutional-Residue)**
          *   **Question:** Does the pattern recur *across distinct contexts* (time, space, workshops, households) with *standardization* exceeding what individual artisans/groups could achieve independently? Look for:
              *   Metric standardization (e.g., weights, vessel sizes within tight tolerances).
              *   Formal uniformity in complex designs/techniques across regions.
              *   Evidence of central resource control (e.g., specific non-local materials everywhere).
          *   **Pass:** Yes, recurrence + standardization imply coordinated practice → Proceed to Gate 3.
          *   **Fail:** No (e.g., localized style, simple functional consistency). → **STOP. Label: "Common practice; institutional mechanism unclear."**
          *   *Why Split?* Institutions (social structures enforcing norms) leave residue as *systemic* patterning. Independence is violated if the pattern could emerge bottom-up. Recurrence across contexts is the minimal extrinsic signal of supra-local structure.

  4.  **GATE 3: ALTERNATIVE EXPLANATION TEST (For Both Belief & Institution)**
      *   **Question:** Are there simpler, well-supported non-belief/non-institutional explanations? (e.g., functional constraints, environmental adaptation, individual skill/creativity, economic efficiency, diffusion without authority)?
      *   **Pass:** No credible alternatives outweigh the belief/institution inference. → Proceed to Gate 4.
      *   **Fail:** Yes, a strong alternative exists (e.g., burial orientation aligns with prevailing wind = practical). → **STOP. Label: "Alternative explanation plausible; [Belief/Institution] inference unwarranted."**
      *   *Why?* Parsimony. Independence demands eliminating simpler causes before inferring complex social/cognitive constructs.

  5.  **GATE 4: VALUES & INTERPRETATION JUDGMENT (Human Call Required)**
      *   **Question:** Does the proposed label (e.g., "cosmological belief," "institutional control") imply *values* or *power dynamics* not strictly evidenced? (e.g., "control" vs. "coordination," "dogma" vs. "tradition").
      *   **Pass (Neutral Label Possible):** Label can be phrased factually (e.g., "standardized practice implying coordination," "symbolism associated with solar imagery"). → **APPROVE with factual label.**
      *   **Fail (Value-Laden Label):** The *only* accurate descriptor carries unavoidable value/power connotations (e.g., "control," "enforced," "dogmatic"). → **HUMAN JUDGMENT CALL REQUIRED.** Curator *must* choose: **A)** Use the strong term and accept its implications. **B)** Use a weaker, more neutral term and footnote the ambiguity. **C)** Reject the inference entirely.
      *   *Why?* "Control" implies hierarchy/coercion; "belief" implies internal state. Archaeology rarely proves *how* norms were enforced or *what* people truly believed. This is interpretation, not deduction.

  **Where It Misfires:**
  *   **False Negatives:** Highly symbolic systems we no longer understand (fails Gate 1A). Subtle, decentralized institutions (fails Gate 2A).
  *   **False Positives:** Extraordinary coincidence in patterning (fools Gate 2A). Misinterpreting widespread functional adaptation as control.
  *   **Inherent Limits:** Cannot access *individual* belief/agency. Cannot distinguish *type* of institution (religious vs. admin) without corroboration. Cannot prove *intentionality* without texts.

  ---

  ### **Application to Cases**

  1.  **Standardized Burial Orientations (Cosmological Belief Claim)**
      *   Gate 0: Pass (Well-excavated cemetery).
      *   Gate 1: YES (Belief Claim). → Gate 1A: **FAIL.** Orientation lacks *intrinsic* symbolism. Wind, terrain, practical marker alignment? STOP. **Label: "Consistent burial orientation; ritual practice evident. Cosmological significance indeterminate without corroborating symbolic evidence."**

  2.  **Abrupt Shift in Ceramic Manufacture (Institutional Oversight Claim)**
      *   Gate 0: Pass (Good stratigraphy, multiple sites).
      *   Gate 1: NO. → Gate 2: YES (Institution Claim). → Gate 2A: **PASS.** Sudden, widespread metric standardization of vessels/formulaic decoration across unrelated workshops/households. Exceeds individual capability. → Gate 3: **PASS?** Alternatives? (Invasion? Diffusion? Market demand?). If suddenness/scale rules out slow diffusion/market, PASS. → Gate 4: **HUMAN CALL.** "Institutional oversight" implies control. Neutral option: **"Abrupt standardization implies coordinated production."** If strong evidence of central workshops/control, curator *might* choose "oversight" but must justify.

  3.  **Repetitive Decorative Motif on Domestic Pottery (Implies "Ritual Authority Over Everyday Life")**
      *   Gate 0: Pass (Common motif on household wares).
      *   Gate 1: NO (Not claiming a *specific belief*, just institutional residue). → Gate 2: YES (Implies "ritual authority" = institution). → Gate 2A: **PASS.** Motif recurs *ubiquitously* across vast region/time on domestic wares. Implies strong norm enforcement. → Gate 3: **PASS?** Alternatives? (Fashion? Lazy potters?). Ubiquity/longevity makes simple fashion less likely. PASS. → Gate 4: **HUMAN CALL / PROBLEM.** The inference *is* "institutional residue" (Gate 2A passed). But the *label* "ritual authority over everyday life" is **highly value-laden** (Gate 4 Fail). **Curator's Options:**
          *   **A)** Use weaker label: **"Ubiquitous motif suggesting strong cultural convention in domestic life."** (Footnotes possible ritual *association* if other evidence hints, but *not* authority).
          *   **B)** Reject "authority" entirely if no evidence of enforcement/penalties: Label as **"Highly conventional domestic decoration."**
          *   *Why Colleague Hates It:* The procedure validly flags an institutional *mechanism* (enforced convention) but cannot prove it was "ritual" or "authority" (could be kin-based tradition, identity marker). The procedure forces confronting that "ubiquitous convention" *is* institutional residue, but the *interpretation* of its social character is where judgment is needed. **The procedure outputs 'institutional residue present' but cannot specify 'ritual authority' without corroborating evidence.**

  ---

  **What the Procedure Cannot Do:**
  1.  **Access Minds:** Prove what people *truly believed* or felt.
  2.  **Distinguish Institution Types:** Tell if coordination was religious, political, or kin-based without external evidence.
  3.  **Capture Soft Power:** Identify institutions maintained by consent/tradition vs. coercion if material residue is identical.
  4.  **Resolve Unique Events:** Handle one-off finds well (fails recurrence tests).
  5.  **Eliminate All Bias:** The curator's judgment at Gate 4 is inherently perspectival. The procedure only forces explicit acknowledgment of it.

  This gives your colleague a defensible audit trail: she either has clear material warrants (Gates 0-3) or has consciously owned a value-judgment (Gate 4). It prioritizes caution on beliefs and demands systemic evidence for institutions.
