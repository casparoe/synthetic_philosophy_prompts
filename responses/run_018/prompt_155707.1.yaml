prompt: |-
  I keep getting into fights with friends about whether you're actually morally required to follow local rules when you're just visiting somewhere. Like, is it wrong to jaywalk in Berlin if you're American, or to skip the tipping culture in Japan when you're only there for three days? My roommate says yes, you're physically in their system so you obey all conventions. I think that's too simple, because people clearly feel different kinds of guilt for breaking queue rules versus not bowing correctly, and locals seem way madder at tourists who skip queueing than at locals who do it. So I came up with this idea I'm calling "moral tenancy" — you're not a citizen, but you're kind of renting temporary membership in their social system, which means your obligations depend on how long you stay and whether you actually recieve benefits from the system working smoothly.

  I want to pitch this as a one-page research proposal for a small philosophy workshop. The core question: do everyday conventions like tipping, queueing, and jaywalking create moral obligations specifically through this tenancy relation, rather than through universal rules or just cultural preference? I need to explain why the usual answers — either "all conventions are just preferences" or "visitors must obey everything" — don't settle the case, especially the weird asymmetry in how angry people get. The approach would be to split obligations into "maintenance duties" for locals and "non-disruption duties" for short-term visitors, then see if that actually matches our intuitions across different conventions. I should say what a useful result looks like — maybe a practical framework for travelers or city policy? — and be honest about failure, like if the tenancy idea just collapses into "longer stay equals more rules". Also need a realistic scope check: is this too ambitious for a semester-length project? Don't bother with citations or a literature review, I'll figure that out myself. Btw I always spell queuing wrong so don't worry about that.
reasoning: |-
  Okay, the user wants to develop a research proposal on "moral tenancy" for a philosophy workshop. They're grappling with whether visitors have moral obligations to follow local conventions like tipping or queueing, and why people react differently to violations by tourists versus locals. 

  Hmm, their roommate takes a hardline "obey all rules" stance, but the user intuitively feels it's more nuanced—especially noting how queue-jumping sparks more outrage than minor etiquette slips. That asymmetry is interesting! Their "moral tenancy" metaphor (temporary social rental) is clever, but needs rigorous framing. 

  Key challenges jump out: 
  First, they must convincingly show why existing approaches fail. "All conventions are preferences" ignores real moral anger, while "obey everything" can't explain why we forgive tourists for not bowing perfectly. That anger asymmetry is their best hook—it suggests deeper moral mechanisms. 

  Second, the tenancy concept risks oversimplifying. They wisely want to test if duration/benefit intake creates tiered duties (maintenance vs. non-disruption). But duration alone might not capture nuances—e.g., is a 3-day tourist skipping tips worse than a 6-month resident doing it? They'll need hypotheticals to stress-test this. 

  Third, scope. A semester project can't tackle all conventions. Focusing on queueing (universal, high-stakes anger), jaywalking (legal/safety gray zones), and tipping (voluntary but culturally charged) keeps it manageable. The policy angle (frameworks for travelers) is practical but should stay speculative—this is philosophy, not sociology. 

  ...Wait, they mentioned guilt differences too. That's gold! Locals feel guilt for violating maintenance duties; tourists feel less for missing nuances but more for disruptive acts. That psychological layer could strengthen their thesis. 

  Biggest trap? Reducing tenancy to "longer stay = more rules." They should preempt this by defining benefit types: short-termers gain order (don't disrupt queues); long-termers gain systemic trust (tip correctly). The anger asymmetry maps neatly here—disruption harms everyone instantly; maintenance failures erode slowly. 

  For structure: emphasize the asymmetry puzzle upfront, then slice conventions by disruption potential. If queueing breaches feel worse than imperfect bows, tenancy explains why. Failure mode: if all duties hinge on duration, it's just gradient ethics—but their benefit-disruption distinction might save it. 

  Honestly? This is ambitious but viable. Their self-awareness about scope and spelling ("queuing") shows pragmatism. Just needs to avoid overpromising policy outcomes. Solid workshop material!
answer: |-
  Here’s a focused one-page research proposal for your philosophy workshop, centered on your "moral tenancy" concept and the core asymmetry question:

  **Research Proposal: Moral Tenancy: The Asymmetric Duties of Visitors in Local Social Conventions**

  **1. Core Question:** Do everyday social conventions (e.g., queueing, tipping, jaywalking norms) generate distinct moral obligations for short-term visitors ("tenants") compared to long-term residents ("maintainers") based on a temporary, benefit-contingent relationship ("moral tenancy"), rather than universal rules or mere cultural preference? Why does violating certain conventions provoke stronger anger against visitors than residents?

  **2. The Problem & Why Existing Answers Fail:** Debates about visitor obligations often polarize:
      *   **Cultural Preference View:** Conventions are arbitrary local customs; visitors incur no *moral* duty beyond politeness. **Fails:** Ignores the genuine *moral outrage* (e.g., queue-jumping), distinct from annoyance at mere preference violation (e.g., incorrect bowing). This asymmetry suggests a deeper moral structure.
      *   **Full Assimilation View:** "When in Rome..." Visitors must obey all local rules/conventions as if citizens. **Fails:** Overly demanding and unrealistic (e.g., mastering intricate etiquette instantly). It cannot explain the *differential anger* – why locals are often *more* upset at tourists breaking queue rules than locals doing the same, and less upset about tourists missing subtle etiquette.

  This tension highlights a gap: a theoretical framework explaining the *asymmetric moral weight* of convention violations based on the visitor's relationship to the local social system.

  **3. The Moral Tenancy Hypothesis:** I propose the **"Moral Tenancy"** model:
      *   **The Analogy:** A short-term visitor is akin to a *tenant* temporarily inhabiting a shared social system. They are not an owner (citizen) but occupy the space and benefit from its functioning.
      *   **Core Premise:** Moral obligations arise from this temporary, benefit-receiving relationship. The *nature* and *extent* of obligations differ from those of permanent residents ("maintainers").
      *   **Key Distinction:**
          *   **Maintenance Duties (Residents):** Obligation to uphold and perpetuate the system's complex norms for long-term stability (e.g., knowing *all* tipping nuances, consistently obeying minor jaywalking laws).
          *   **Non-Disruption Duties (Short-Term Visitors):** Obligation to avoid actions that actively *disrupt* the smooth functioning of the system they temporarily benefit from (e.g., skipping queues causing immediate friction, blatantly jaywalking creating danger/chaos, refusing tips in a system where service workers rely on them).
      *   **Drivers:** Duties are proportional to: 1) **Duration of Stay** (longer stay → more maintenance duties); 2) **Tangible Benefit Received** from the convention/system (e.g., benefiting from orderly queues → duty not to disrupt them); 3) **Harm Potential** of violation (disruption > minor faux pas).

  **4. Approach & Methodology:**
      *   **Conceptual Analysis:** Precisely define "moral tenancy," "maintenance duties," "non-disruption duties," "disruption," and "benefit."
      *   **Intuition Pumping:** Employ carefully constructed thought experiments comparing violations by short-term visitors vs. long-term residents across different convention types (queueing, tipping, jaywalking, etiquette norms). Test if the tenancy model predicts the *intensity* and *nature* of perceived moral wrongness and anger better than rival views.
      *   **Analyze Asymmetry:** Focus on *why* queue-jumping by a tourist feels morally worse than by a local, while a tourist's minor bowing error does not provoke equivalent outrage. Does the tenancy model (disruption vs. maintenance failure) explain this?
      *   **Test Scope:** Does the model hold for conventions with strong safety/legal components (jaywalking) vs. purely social/economic ones (tipping)?

  **5. Expected Outcomes & Value:**
      *   **Success:** A coherent framework resolving the initial paradox, explaining the anger asymmetry, and providing nuanced guidance: Visitors have strong duties to avoid *disruptive* violations (skipping queues, financial harm via tipping refusal) but lesser duties around complex *maintenance* norms (perfect etiquette). This offers a more realistic and morally grounded approach than "obey everything" or "anything goes."
      *   **Practical Value:** A foundation for traveler ethics guidelines and potentially urban policy (e.g., focusing visitor education on high-disruption norms).
      *   **Failure Modes:**
          *   The distinction between "disruption" and "maintenance failure" proves untenable or arbitrary.
          *   Duration/Benefit prove insufficient predictors; the model collapses into "longer stay = more rules" without unique explanatory power.
          *   The observed anger asymmetry is better explained by in-group/out-group bias than moral tenancy.

  **6. Scope & Feasibility:** This is ambitious but feasible for a semester workshop project. The scope is deliberately narrow:
      *   Focuses on *everyday social conventions*, not formal laws or deep moral principles.
      *   Compares a limited set of clear examples (queueing, tipping, jaywalking) as test cases.
      *   Prioritizes conceptual development and intuition-testing over exhaustive empirical survey or historical analysis.
      *   The core task is rigorously developing and stress-testing the *idea* of moral tenancy against the asymmetry problem.

  **7. Conclusion:** The "moral tenancy" model offers a promising alternative to polarized views on visitor obligations. By explaining the critical asymmetry in reactions to convention violations, it has the potential to provide a more sophisticated, practical, and intuitively satisfying account of the moral landscape faced by temporary participants in a social system.

  ---

  **Key Strengths of this Proposal for a Workshop:**

  1.  **Clear Problem:** Immediately establishes the paradox (asymmetry of anger) that existing views fail to resolve.
  2.  **Novel Concept:** "Moral tenancy" is presented as a distinct, testable hypothesis.
  3.  **Focused Question:** Stays centered on the core issue of differential obligations and the asymmetry.
  4.  **Methodology Fit:** Uses standard philosophical tools (conceptual analysis, thought experiments) suitable for the context.
  5.  **Realistic Scope:** Explicitly limits the conventions and depth of analysis.
  6.  **Honest Assessment:** Clearly states what success looks like and potential points of failure for the idea.
  7.  **Practical Hook:** Mentions potential applications without overpromising.

  This gives you a strong foundation to develop your argument and dive into the literature! Good luck!
