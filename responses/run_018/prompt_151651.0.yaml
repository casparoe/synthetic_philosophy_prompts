  The user's deeper concern seems to be about the tension between individual freedom and social norms in utilitarianism. They might be applying this to their own relationship issues, seeking philosophical clarity to navigate personal struggles. I should address whether Bentham's framework allows societal disgust to override personal choices, which is a valid critique. Modern utilitarians like Mill resolved this by prioritizing liberty, but Bentham's approach was more pragmatic about existing sentiments.

