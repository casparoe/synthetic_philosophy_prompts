answer: |-
  You've hit on one of the most fascinating and contentious tensions in Bentham's utilitarianism, especially regarding sexual morality. Your reading is sharp – Bentham *does* seem to wobble here, and critics have debated this for centuries. Let's break it down:

  1.  **The Core Principle (Which You Correctly Identify):**
      *   Pleasure = Good, Pain = Bad.
      *   Acts between consenting adults in private, causing no direct, tangible harm (violence, theft, fraud, breach of contract, disturbance) to others, should generally not be criminalized. The costs of enforcement (intrusion, blackmail, misery) vastly outweigh any theoretical "benefit."
      *   **Antipathy is Irrational:** Bentham explicitly argues that the mere *feeling* of disgust or "antipathy" towards another person's private conduct is **not** a sufficient reason for criminalization. He calls this "the principle of antipathy" and rejects it as a basis for law. It's prejudice, not reason.

  2.  **The Problem: Antipathy as a "Pain" in the Calculus:**
      *   **The Crux:** Where Bentham gets tricky is acknowledging that *widespread* public antipathy, even if irrational, **can itself cause real social pain.** This pain manifests as:
          *   **Social Discord:** Outrage, public scandal, community division, loss of reputation for the participants.
          *   **Personal Distress:** Anxiety, fear, shame experienced by individuals *because* they know society condemns them, even if their acts are private.
          *   **Potential for Vigilantism:** If legal punishment is absent, public outrage might lead to private violence or persecution.
      *   **Bentham's Calculation:** Bentham the social engineer recognizes this social pain as a *fact*. Even if the antipathy's *origin* is irrational prejudice, its *consequences* (the social pain it generates) are real pains that enter the utilitarian calculus. He's not saying the antipathy is *morally justified*; he's saying its *existence* creates real-world disutility that a legislator might have to consider *pragmatically*.
      *   **Does This Let Disgust Veto Pleasure?** **Potentially, yes, and this is the major critique.** Critics (like H.L.A. Hart and many modern liberals) argue this fatally undermines his core principle. By giving *weight* to the pain caused by irrational prejudice, Bentham allows the *prejudice itself* to become a justifying reason for restricting liberty, even if he ultimately argues against criminalization in most private cases. He tries to minimize this by arguing:
          *   The pain of antipathy is often exaggerated or focused on harmless acts.
          *   The pain caused *by* criminalization (intrusion, blackmail, suffering of the punished) is usually far greater than the pain *of* the antipathy.
          *   Criminalization often *increases* the antipathy and associated pain rather than lessening it.
      *   **His Escape Hatch (Flawed?):** Bentham hopes that *education* and the *demonstration* that such acts cause no *real* harm will gradually erode irrational antipathy, removing this source of pain from the equation. But while the calculus is ongoing, the pain exists and counts.

  3.  **Offences Against Oneself: What is Being Measured?**
      *   **Not "Sin" or Moral Wrong:** Bentham explicitly rejects traditional concepts of sin or inherent immorality. He's looking for *utilitarian* reasons.
      *   **The Measurement: Long-Term Pain vs. Short-Term Pleasure:** Bentham analyzes acts primarily through their *consequences* for the *agent's own* happiness. He's concerned with:
          *   **Physical Harm:** Acts causing disease, injury, disability, or premature death (obvious sources of future pain).
          *   **Mental/Emotional Harm:** Acts leading to addiction, debilitating regret, loss of self-respect (as the agent defines it), or mental anguish that diminishes future capacity for pleasure.
          *   **Impairment of Faculties:** Acts that dull the senses, weaken the mind, or reduce the individual's overall capacity to experience pleasure or contribute productively to society (which benefits the individual indirectly).
          *   **Wasted Resources/Time:** Acts consuming resources (money, time, energy) that could be used for more pleasurable or productive pursuits.
          *   **"The Weakening of the Moral Sanction":** This is subtle. Bentham worries that habitual indulgence in "self-regarding vices" might erode an individual's sensitivity to the *external* sanctions (legal, social, religious) that restrain them from harming *others*. It's a character/personality degradation argument focused on *future* social consequences.
      *   **Is This "Smuggling in Morality"?** **It depends.** Bentham *claims* he's only measuring tangible future pains to the individual. However:
          *   **Paternalism:** His analysis is deeply paternalistic. He presumes to know what's best for an individual's long-term happiness better than they do in the moment.
          *   **Subjective vs. Objective Harm:** He risks defining "harm to self" based on *his* (or society's) view of what constitutes a well-lived life, rather than the individual's own subjective experience of pleasure/pain. If an individual finds deep, sustainable pleasure in an act Bentham labels "self-harming," who is Bentham to say their calculus is wrong? This is where Mill's "harm principle" later draws a much sharper line.
          *   **Moralistic Residue:** His categories (especially the "weakening of moral sanction" and vague "loss of self-respect") *can* sound suspiciously like repackaged traditional morality. He tries to ground them in utility, but the connection is often tenuous and relies on unproven psychological assumptions.

  **Conclusion & Your Insight:**

  You are absolutely right to sense a contradiction or at least a deep tension. Bentham wants to banish irrational antipathy as a *justifying reason* for law, yet he is forced to acknowledge the *real pain* its existence causes as a *factor* in the social calculus. He wants to reject sin, yet constructs a category of "offences against oneself" that measures harm in ways that can look remarkably like secularized sin or paternalistic judgment.

  *   **Antipathy:** He doesn't let it "veto" easily (he argues strongly against criminalization), but by counting the *pain it causes* as a disutility, he **does** give prejudice a foothold in the calculation that many liberals find unacceptable. It's a pragmatic concession to social reality that risks undermining the liberating force of his core principle.
  *   **Offences Against Oneself:** He is measuring primarily **long-term detrimental consequences to the agent's own capacity for happiness** (physical, mental, social). While he frames it utilitarianly, the **paternalism** is undeniable, and the specific harms he identifies (especially non-physical ones) often rely on assumptions that smell of the very morality he sought to replace. He's trying to be empirical, but the categories aren't always clear of normative baggage.

  **Your question nails the core issue:** Can utilitarianism, when faced with the *fact* of widespread irrational disgust, truly protect individual liberty in the private sphere without compromising itself? Bentham struggles to answer "yes" unequivocally. Later utilitarians, especially John Stuart Mill ("On Liberty"), explicitly rejected Bentham's concessions on both antipathy and paternalism, arguing that neither social disgust nor presumed harm-to-self (without tangible, direct harm to others) justify legal interference. Mill saw Bentham's compromises here as dangerous erosions of liberty. Your critique places you firmly in this important ongoing debate!
