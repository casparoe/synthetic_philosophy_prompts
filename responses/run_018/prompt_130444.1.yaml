answer: |-
  Your challenge is clever but conflates mechanisms. Partner choice *requires* prior assessment to identify "bad" partners—that assessment *is* reputation tracking, even if locally distributed. In a true one-shot PD with no prior information, cheap exit gives you no signal about who to flee from; you'd defect blindly or exit randomly, collapsing cooperation. Image scoring provides the essential assessment architecture that makes partner choice viable by generating the reputational gradients you exploit. Your modern anonymity point is stronger, but when monitoring fails entirely, *both* mechanisms collapse—you can't choose partners intelligently without signals. Partner choice leverages local reputation (a form of scoring) to drive assortment; it doesn't replace scoring, it *depends* on it. Your escape hatch is mathematically illusory; without scoring-derived reputations, partner choice in one-shot interactions devolves into random assortment, which can't stabilize cooperation in PDs above baseline drift. I'll concede that spatial structure *amplifies* the effect of scoring through clustering, but the causal root remains reputation.
