answer: |-
  Here's a reusable 20-minute decision procedure checklist for your ethics review board, designed for consequentialist evaluation with demandingness safeguards:

  **Ethics Review Board: Collective Sacrifice Evaluation Protocol**

  **Purpose:** Assess proposals demanding citizen sacrifices for collective goods. Flags *sacrificial demands* (threatening core life projects) vs. *friction* (adjustments within projects). Identifies enduring grievances ("residue").

  **Time:** ~20 min per proposal. **Chair Role:** Must sign off at all 🚩**VALUE JUDGMENT** flags.

  **Breakdown Conditions:** Procedure fails when:
  1.  **Goods are Incommensurable** (e.g., sacred value vs. material benefit).
  2.  **Sacrificial Demand Justification** requires deciding if *any* collective benefit can ethically demand sacrifice (core life project abandonment).

  ---

  **CHECKLIST: Ordered Questions & Stop/No Points**

  1.  **Collective Benefit Clarity & Scale**
      *   *Question:* Is the claimed collective good (CG) specific, measurable, and significant? Is the causal link to the policy (P) credible?
      *   *Test:* CG defined? Evidence P causes CG? CG impact affects >1% of relevant population? Avoid vague "public good."
      *   *Stop/No Point:* **STOP/REJECT** if CG is vague, unmeasurable, or link to P is speculative/weak.
      *   *🚩VALUE JUDGMENT:* Is *this specific CG* worth pursuing? (Chair Sign-off)

  2.  **Burden Identification & Targeting**
      *   *Question:* Who exactly bears the cost (C)? Is the burden distributed fairly *among those who benefit*?
      *   *Test:* List specific groups/individuals paying C. Is C proportional to (a) benefit received, or (b) capacity to pay? Exemptions for severe hardship?
      *   *Stop/No Point:* **STOP/REJECT** if burden falls randomly, solely on vulnerable groups without justification, or lacks hardship exemptions.
      *   *🚩VALUE JUDGMENT:* Is *this level* of disproportionality acceptable? (Chair Sign-off)

  3.  **Sacrificial Demand Test (Core Life Project Threat)**
      *   *Question:* Does complying with P force anyone to *abandon* or *radically shrink* a core life project (CLP)? (CLP = central, identity-defining pursuit: e.g., career, family support, owning home/business, artistic practice, essential retirement plan).
      *   *Test:* For burden-bearers: Would P make continuing their CLP impossible or drastically altered (>50% reduction in scope/viability)? Thresholds: >10% annual income loss? >20 hrs/wk lost effort? Loss of primary asset/home? Forced career change?
      *   *Stop/No Point:* **STOP/REJECT** if P imposes a *sacrificial demand* on *anyone* without overwhelmingly compelling justification (Proceed to Step 4, but high bar).
      *   *🚩VALUE JUDGMENT:* Is this specific CLP disruption ethically permissible *for this CG*? (Chair Sign-off - **Critical Judgment**)

  4.  **Friction Cost Assessment (Adjustment Within Projects)**
      *   *Question:* For burdens *not* sacrificial (Step 3), is the remaining "friction" cost (time, money, inconvenience) minimized and reasonable?
      *   *Test:* Is C << income/assets? Can it be absorbed within normal budgeting/life? (<5% annual income? <5 hrs/wk effort?). Are less burdensome alternatives exhausted?
      *   *Stop/No Point:* **MODIFY/REJECT** if friction costs are high and not demonstrably necessary or could be significantly reduced.

  5.  **Residue Check (Enduring Grievance)**
      *   *Question:* Even if individuals comply, is there a *reasonable* basis for enduring resentment or a sense of unfairness that doesn't vanish?
      *   *Test:* Does compliance feel like being "used as a mere means"? Was there genuine consent/agency? Is the burden deeply disproportionate *even if absorbed*? Does it violate a strong local norm?
      *   *Stop/No Point:* **MODIFY/REJECT** if significant "residue" is likely and unaddressed. Requires stronger justification.
      *   *🚩VALUE JUDGMENT:* Is the level of predicted residue acceptable? (Chair Sign-off)

  6.  **Net Benefit & Last Resort**
      *   *Question:* After Steps 1-5, do the *net* collective benefits *clearly and substantially* outweigh the total burdens (sacrificial + friction + residue), including implementation costs? Is P the *least restrictive/demanding* effective option?
      *   *Test:* Quantify benefits/burdens where possible. Compare to alternatives. Is the benefit-to-total-burden ratio strongly positive (>2:1 if quantifiable)?
      *   *Stop/No Point:* **APPROVE** if net benefit is clear, substantial, burdens minimized, and residue addressed. **MODIFY/REJECT** otherwise.

  ---

  **Application to Proposals:**

  **1. Mandatory Flu Vaccination for Nursing-Home Staff**

  *   **Step 1 (CG):** **PASS.** CG = Reduced flu mortality/morbidity in vulnerable elderly. Specific, measurable (hospitalization/death rates), significant. Strong evidence vax reduces transmission in closed settings.
  *   **Step 2 (Burden):** **PASS.** Burden = Staff time for vax (~1 hr/yr), minor discomfort. Exemptions for medical contraindications. Fair? Staff directly benefit from healthier workplace/residents.
  *   **Step 3 (Sacrifice):** **PASS.** **Friction Cost.** Minor time/inconvenience. Does not threaten core life projects (career, etc.). Easily absorbed.
  *   **Step 4 (Friction):** **PASS.** Minimized (free vax, offered on-site). Necessary for high uptake.
  *   **Step 5 (Residue):** **PASS.** Minimal residue. Standard health measure. Medical exemptions address key objections. Consent implied by working in healthcare with vulnerable populations.
  *   **Step 6 (Net/Last Resort):** **APPROVE.** Massive net benefit (lives saved) vs. trivial friction cost. Less restrictive options (voluntary) proven ineffective for needed herd protection.
  *   **Verdict:** **APPROVE**

  **2. 8% Post-Tax Income Donation Mandate for Local Food Security**

  *   **Step 1 (CG):** **PASS.** CG = Eliminate local food insecurity. Specific, potentially measurable (food bank usage, surveys), significant.
  *   **Step 2 (Burden):** **FLAG.** Burden = 8% post-tax income. Targets all citizens (proportional? Or flat hit?). Hardship exemptions needed (define threshold clearly - e.g., below living wage). *Fairness?* Capacity to pay varies hugely. **MODIFY:** Add robust, clearly defined hardship exemptions based on income/assets.
  *   **Step 3 (Sacrifice):** **CRITICAL.** **Sacrificial Demand Possible.** For low/middle income: 8% could force radical shrinking of CLPs (e.g., saving for home, children's education, essential healthcare, starting business, retirement security). For high income: Likely friction. *Test:* >5-10% income loss threatens CLPs for many. **MODIFY:** Scale mandate progressively by income or cap % for lower brackets.
  *   **Step 4 (Friction):** N/A if Sacrifice identified. For those where it's friction, 8% may still be high friction but absorbable.
  *   **Step 5 (Residue):** **HIGH RISK.** Significant residue likely even with compliance. "Forced charity" violates autonomy. Deep sense of unfairness if perceived as punishing responsibility or if government inefficiency suspected. Hard to eliminate.
  *   **Step 6 (Net/Last Resort):** **QUESTIONABLE.** While CG is vital, total burden (sacrifice for some + high friction for others + high residue) is severe. Are *less demanding* alternatives exhausted? (e.g., progressive tax funding, targeted programs, efficiency drives, voluntary campaigns with matching)? Net benefit positive but ethically costly.
  *   **Verdict:** **MODIFY HEAVILY or REJECT.** High risk of Sacrificial Demands and strong Residue make mandate ethically problematic. Explore progressive taxation or significantly lower %/voluntary+ structures first. *Procedure highlights ethical tension in your supported proposal.*

  **3. Retrofit Zoning Rule Wiping Out Small Landlord's Rental Income**

  *   **Step 1 (CG):** **PASS.** CG = Safety (e.g., seismic), accessibility, environmental upgrades. Specific, measurable (code compliance), significant.
  *   **Step 2 (Burden):** **FLAG.** Burden = Cost of retrofit may wipe out income/savings for *this specific landlord*. Highly targeted. Fair? If rule is universal, but capacity varies. Hardship? Landlord may lack capital. **MODIFY:** Must include phased compliance, significant financial aid/grants/loans, or value-based exemptions.
  *   **Step 3 (Sacrifice):** **STOP/REJECT RISK.** **Likely Sacrificial Demand.** Wiped out income likely destroys core life project: owning/managing this property as primary income source or retirement plan. Radically alters financial security/independence. Forces abandonment of investment/business. *Test:* >50% income loss = Sacrifice.
  *   **Step 4 (Friction):** N/A - Sacrifice dominates.
  *   **Step 5 (Residue):** **EXTREME.** Profound resentment even with compliance. Feels like uncompensated taking, destroying livelihood "for the greater good." Violates property rights norms.
  *   **Step 6 (Net/Last Resort):** **INSUFFICIENT?** While CG is valid, imposing Sacrificial Demand requires *overwhelming* net benefit and proof it's absolutely last resort. Is the safety risk *imminent and catastrophic* just for *this* building? Can benefit be achieved without destroying this owner? Burden on one vs. diffuse safety benefit.
  *   **Verdict:** **REJECT (as proposed).** Imposes a clear Sacrificial Demand with extreme Residue. **MODIFY ESSENTIALLY:** Policy *must* include full compensation, buy-out option, or sufficient grant funding to prevent income loss. Cannot impose uncompensated sacrifice. *Breakdown Point:* Commensurability of individual livelihood vs. collective safety is highly contentious.
