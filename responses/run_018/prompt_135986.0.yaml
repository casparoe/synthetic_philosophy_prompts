answer: |-
  Your colleague's moral conflict is deeply philosophical, and Darwin's framework actually **supports her intuition** while refuting her partner's reductionist claims. Here's how to navigate this using Darwin's own ideas:

  ### 1. **Evolutionary origins ≠ normative irrelevance**
     - **The Genetic Fallacy**: Her partner commits this by claiming explaining compassion's origin "dissolves its normative authority." Darwin himself rejected this in *The Descent of Man*, arguing that while moral sentiments *originated* in social instincts, their value isn't negated by their origin. He analogized this to dismissing astronomy because star-gazing began with astrology.
     - **Darwin's View**: He saw evolved sympathy as the *foundation* for ethics, writing: "*The moral sense perhaps affords the best and highest distinction between man and the lower animals*." For Darwin, the capacity for sympathy is what *enables* morality—it doesn't invalidate it.

  ### 2. **Extending compassion beyond kin is moral progress**
     - Darwin explicitly praised the expansion of sympathy to "*all nations and races*" and even "*the lower animals*" as the "*noblest part of our nature*" (*Descent of Man*, Ch. IV). He documented cases of animals helping non-kin (e.g., pelicans feeding blind companions) and argued human morality should emulate this expansiveness.
     - **Not "Misfiring" but Moral Maturity**: Darwin saw ethics as rationally *extending* innate instincts beyond their adaptive purpose. Helping a stray animal isn't a "misfire"—it's exercising our evolved capacity for moral imagination, aligning with his view of "the golden rule" as humanity's ethical pinnacle.

  ### 3. **Human uniqueness & non-arbitrary grounds for care**
     - **Against Religious Uniqueness**: Darwin's skepticism toward human exceptionalism *strengthens* the case for compassion. If humans aren't "specially created," moral value must derive from observable traits like **sentience and suffering capacity**—which animals share.
     - **Darwin's Ground for Obligation**: He rooted ethics in the ability to suffer and form social bonds. In an 1871 letter, he wrote: "*The love for all living creatures is the most noble attribute of man […] [It] increases until it includes all sentient beings.*" 
     - **Non-Arbitrary Distinction**: Within Darwin's framework:
       - **Moral reason**: Arises from recognizing shared capacities (pain, fear, social needs) in others—human or non-human.
       - **Instinctual indulgence**: Would involve helping without regard for actual suffering (e.g., prioritizing cute animals over needy ones). Her action—responding to an *injured* animal—aligns with objective need, not subjective whim.

  ### 4. **Resolving the Dilemma: Darwin as Ally**
     - **Her obligation is real**: Darwin would see her compassion as evidence of moral progress beyond "tribal instincts." His theory predicts that societies valuing kindness to animals flourish through cooperation and reduced cruelty.
     - **Partner's Missteps**: 
       - Confuses *proximate cause* (evolved instinct) with *ultimate justification* (reducing suffering).
       - Ignores Darwin's emphasis on reason's role in guiding instincts ethically.
       - Overlooks that natural selection explains *how* morality arose, not *what it ought to be*.

  ### Conclusion
  Darwin **supports your colleague's obligation**. His work shows that:
  - Compassion for non-kin animals is an evolved capacity we can *rationally choose* to extend.
  - Moral worth derives from sentience, not species—a view later formalized by thinkers like Peter Singer.
  - Explaining an emotion's origin doesn't debunk it; rather, it grounds ethics in biological reality while allowing for ethical progress beyond evolutionary constraints.

  **Her response to her partner could be**: 
  *"Darwin saw extending sympathy to all suffering beings as humanity's highest achievement. My instinct to help this animal isn't a misfire—it's our evolved capacity for moral growth in action. If anything, his science shows why we should take suffering seriously wherever it exists."*

  By aiding the animal, she embodies the very "ennobling" expansion of morality Darwin celebrated—turning evolutionary theory into a call for greater kindness, not a justification for indifference.
