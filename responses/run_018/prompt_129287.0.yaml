answer: |-
  ## Structured Clinical Risk Assessment Procedure (SCRAP) v1.0

  **Purpose:** To provide a disciplined, time-bound framework for evaluating high-risk therapeutic interventions using Risk-Weighted Expected Utility (RWEU) principles, explicitly separating outcome valuation, epistemic confidence, and patient vulnerability.

  **Core Principles:**
  1.  **RWEU Core:** Decision weights applied to outcome utilities depend on the *probability (risk)* of those outcomes, distinct from the utility function's curvature (i.e., how much we intrinsically value/disvalue outcomes).
  2.  **Separation of Concerns:** Deliberately isolates:
      *   **Dimension 1:** Risk-weighted valuation of outcomes (Utilities & Risk Weights).
      *   **Dimension 2:** Epistemic confidence in probability estimates (Quality of Evidence & Cost of Error).
      *   **Dimension 3:** Moral status/vulnerability of the patient population (Modifying Risk Weights).
  3.  **Judgement Flags:** Points where subjective panel input is essential are marked `[JUDGEMENT]`.
  4.  **Stopping Rules:** Clear endpoints for Reject, Approve (Conditional/Unconditional), or Values Halt.

  **Inputs Required from Panel:**
  *   **Outcomes:** List all significant potential outcomes (e.g., halt disease, severe side effect, death, symptom relief).
  *   **Utilities (U):** Assign a numerical utility score `[JUDGEMENT]` for each outcome on a bounded scale (e.g., -100 [Worst] to 0 [Neutral] to +100 [Best]). *This captures intrinsic desirability.*
  *   **Probabilities (P):** Estimate the probability (0 to 1) of each outcome occurring `[JUDGEMENT]`.
  *   **Risk-Weighting Function (w(P)):** Select/define a function `[JUDGEMENT]` that transforms objective probability (P) into a decision weight (w(P)). Common examples:
      *   *Pessimism:* w(P_good) < P_good; w(P_bad) > P_bad (overweight bad outcomes)
      *   *Optimism:* w(P_good) > P_good; w(P_bad) < P_bad (overweight good outcomes)
      *   *Neutral:* w(P) = P
      *   *(Provide simple graphical examples or a logarithmic scale for non-experts: e.g., "How much more should a 5% risk of death *feel* compared to a 5% chance of cure?")*
  *   **Vulnerability Multiplier (V):** A factor `[JUDGEMENT]` (typically >=1) applied to the risk weights for *harmful* outcomes based on patient vulnerability.

  **Procedure (1 Hour Max):**

  1.  **Define Scope & Outcomes (5 mins):**
      *   Clearly state the intervention and patient population.
      *   List all significant potential outcomes (Benefits & Harms). Be specific (e.g., "irreversible systemic inflammation", not just "side effect").
      *   *Sufficient:* Consensus on the list. *Halt if:* Outcomes are too ambiguous or poorly defined (`Values Halt`: Requires ethical clarification).

  2.  **Assign Utilities (U) (10 mins):**
      *   For each outcome, assign a numerical utility score (e.g., -100 to +100) reflecting its intrinsic desirability/undesirability relative to a defined baseline (e.g., current state without intervention). `[JUDGEMENT]`
      *   *Sufficient:* Scores assigned; panel acknowledges scores reflect *value judgements* about outcomes. *Halt if:* Fundamental disagreement on utility scores indicates irreconcilable values conflict (`Values Halt`).

  3.  **Estimate Probabilities (P) & Assign Risk Weights (w(P)) (15 mins):**
      *   For each outcome, estimate its probability (P). `[JUDGEMENT]`
      *   Select/define the Risk-Weighting Function (w(P)). `[JUDGEMENT]` (Is the panel broadly pessimistic, optimistic, or neutral regarding risks in this context?)
      *   Calculate the Decision Weight (w(P)) for each outcome using the chosen function.
      *   *Sufficient:* P estimates and w(P) function selected. *Halt if:* Probability estimates are deemed fundamentally unreliable or speculative (`Reject` or `Values Halt` if uncertainty itself is ethically unacceptable).

  4.  **Calculate Dimension 1: Risk-Weighted Expected Utility (RWEU) (5 mins):**
      *   RWEU = Σ [ w(P_i) * U_i ] for all outcomes i.
      *   *Decision Rule:*
          *   If RWEU <= **Threshold_Low** (e.g., <= 0 or pre-defined negative value) → `Reject`.
          *   If RWEU >= **Threshold_High** (e.g., >= significant positive value) → Proceed to Stage 5.
          *   If **Threshold_Low** < RWEU < **Threshold_High** → Proceed to Stage 5 (conditional approval likely). *(Set thresholds pragmatically; e.g., Threshold_Low = -20, Threshold_High = +30 on -100 to +100 scale).*

  5.  **Assess Dimension 3: Patient Vulnerability (V) (5 mins):**
      *   Assess the moral status/vulnerability of the patient population (e.g., terminally ill, children, cognitively impaired, limited alternatives). `[JUDGEMENT]`
      *   Assign a Vulnerability Multiplier (V) (≥1) reflecting the degree to which vulnerability justifies *increased weighting* (higher w(P)) for *harmful* outcomes. (E.g., V=1.0 for robust adults, V=1.5 for terminally ill children).
      *   **Apply V:** Recalculate RWEU for harmful outcomes ONLY: Modified RWEU = Σ [ w(P_good_i) * U_good_i ] + Σ [ V * w(P_bad_j) * U_bad_j ]
      *   *Decision Rule:*
          *   If Modified RWEU <= Threshold_Low → `Reject`.
          *   If Modified RWEU >= Threshold_High → Proceed to Stage 6.
          *   If Threshold_Low < Modified RWEU < Threshold_High → Proceed to Stage 6 (conditional approval likely).

  6.  **Assess Dimension 2: Epistemic Confidence (10 mins):**
      *   Evaluate the quality of evidence supporting the probability estimates (P) from Stage 3. Consider: source (trial data, case reports, preclinical), robustness, reproducibility, potential biases. `[JUDGEMENT]`
      *   Estimate the potential Cost of Error (CoE) `[JUDGEMENT]` if the probability estimates are significantly wrong (e.g., severe harm underestimated, benefit overestimated). CoE is qualitative (Low/Medium/High/Severe).
      *   *Decision Rule:*
          *   If Evidence Quality is **High** AND CoE is **Low/Medium** → Proceed to Final Decision.
          *   If Evidence Quality is **Medium** AND CoE is **Low/Medium** → Proceed to Final Decision (likely with conditions).
          *   If Evidence Quality is **Low/Very Low** OR CoE is **High/Severe** → `Reject` or `Approve with Stringent Conditions` (e.g., enhanced monitoring, specific informed consent, data collection mandate). `[JUDGEMENT]`
          *   If Evidence Quality is deemed fundamentally inadequate *regardless* of CoE → `Reject`.

  7.  **Final Decision & Conditions (10 mins):**
      *   Based on Modified RWEU (Stage 5) and Epistemic Assessment (Stage 6):
          *   `Approve (Unconditional)`: Strong positive Modified RWEU, High Epistemic Confidence, Low CoE.
          *   `Approve (Conditional)`: Moderate positive Modified RWEU and/or Moderate Epistemic Confidence/CoE. Specify conditions clearly (e.g., specific monitoring, explicit consent process, data reporting).
          *   `Reject`: Negative or insufficiently positive Modified RWEU, OR Low/Very Low Epistemic Confidence, OR High/Severe CoE not mitigable by conditions.
      *   *Record* any points where the procedure was followed but significant disagreement remained (captured under `[JUDGEMENT]` flags).
      *   *Record* any deliberate departure from the procedure's mechanical result and the justification.

  **Handling Conflicts:**
  *   Conflicts *within* a dimension (e.g., disagreement on utility scores) trigger a `Values Halt`.
  *   A negative result in **any** dimension (Negative RWEU, High Vulnerability worsening RWEU sufficiently, Low Epistemic Confidence/High CoE) can lead to Reject, even if others are positive. Dimensions are sequential filters.
  *   Stage 6 (Epistemic) can override a positive RWEU calculation from Stage 5.

  ---

  **Application to Cases:**

  **Case A: Gene-Editing Trial (Neurodegenerative Disease)**
  *   **Outcomes:** Halt Progression (Benefit), Irreversible Systemic Inflammation (Harm), No Effect (Neutral).
  *   **Utilities `[JUDGEMENT]`:** Halt Progression: U=+80; Inflammation: U=-90; No Effect: U=0.
  *   **Probabilities `[JUDGEMENT]`:** P(Halt)=0.60, P(Inflammation)=0.15, P(No Effect)=0.25.
  *   **Risk Weights `[JUDGEMENT]`:** (Pessimism chosen due to irreversible harm risk) w(P) function: w_good(P) = P^1.2 (underweights good), w_bad(P) = P^0.8 (overweights bad). w(0.6)≈0.55, w(0.15)≈0.18.
  *   **Stage 4 (RWEU):** (0.55 * 80) + (0.18 * -90) + (0.27 * 0) = 44.0 - 16.2 = +27.8 → Proceed (Threshold_High=30, so proceed).
  *   **Stage 5 (Vulnerability V):** Progressive neurodegenerative patients: High vulnerability. `[JUDGEMENT]` V=1.3 (increase bad outcome weight). Modified RWEU = (0.55 * 80) + (1.3 * 0.18 * -90) + (0.27 * 0) = 44.0 - 21.06 = +22.94 → Proceed.
  *   **Stage 6 (Epistemic):** Evidence: 3 preclinical, 1 unpublished human case report. **Quality: Low.** CoE: **High** (if inflammation risk is higher or benefit lower, severe irreversible harm). *Decision:* Low Quality + High CoE → `Reject` or `Approve with Extreme Conditions` (e.g., only very advanced patients, strict monitoring protocol, immediate halt trigger, mandatory data sharing). Panel likely `Rejects` due to high stakes and poor evidence.
  *   **Ambiguity:** High subjectivity in assigning V and the epistemic assessment. Unpublished case report adds uncertainty.

  **Case B: Palliative Sedation (Terminal Respiratory Failure)**
  *   **Outcomes:** Relief of Suffering (Benefit), Hastened Death (Harm? - Contextual), No Effect (Neutral - unlikely).
  *   **Utilities `[JUDGEMENT]`:** Relief: U=+95 (high value in suffering), Hastened Death: U= -10 (patient views death as release; slight negative due to lost time), No Effect: U=-50 (continued suffering). *Crucial Judgement on Hastened Death utility.*
  *   **Probabilities `[JUDGEMENT]`:** P(Relief)≈0.95, P(Hastened Death)≈0.20, P(No Effect)≈0.05? (Protocols are designed for high reliability).
  *   **Risk Weights `[JUDGEMENT]`:** (Optimism or Neutral likely due to patient desire & context) w(P) = P (Neutral chosen). w(0.95)=0.95, w(0.20)=0.20.
  *   **Stage 4 (RWEU):** (0.95 * 95) + (0.20 * -10) + (0.05 * -50) = 90.25 - 2.0 - 2.5 = +85.75 → Strong positive, proceed.
  *   **Stage 5 (Vulnerability V):** Terminal patient, fully competent, explicit request. Vulnerability is high, but patient autonomy paramount. `[JUDGEMENT]` V=1.0 (No *additional* weighting of hastened death as harm *against* patient's expressed values). Modified RWEU = +85.75 → Proceed.
  *   **Stage 6 (Epistemic):** Evidence: Well-established palliative protocols. **Quality: High.** CoE: **Low/Medium** (Protocols standardised; hastening death, while unintended, aligns partly with patient goals). *Decision:* Proceed to Final.
  *   **Final Decision:** `Approve (Unconditional)`. The procedure strongly supports approval based on high utility of relief, patient autonomy, good evidence. *Possible Values Halt:* If panel fundamentally disputes assigning low disutility to hastened death despite patient request, Stage 2 (`Utilities`) could trigger a `Values Halt`.

  **Case C: Off-Label Immunosuppressant (Genetically Distinct Population)**
  *   **Outcomes:** Disease Control (Benefit), Severe Infection/Side Effect (Harm), No Effect (Neutral).
  *   **Utilities `[JUDGEMENT]`:** Control: U=+70, Severe Harm: U=-85, No Effect: U=0.
  *   **Probabilities `[JUDGEMENT]`:** (Based on different population) P(Control)=0.50, P(Harm)=0.10, P(No Effect)=0.40.
  *   **Risk Weights `[JUDGEMENT]`:** (Pessimism calibrated on source pop? Assume Neutral w(P)=P for calculation). w(0.5)=0.5, w(0.1)=0.1.
  *   **Stage 4 (RWEU):** (0.5 * 70) + (0.1 * -85) + (0.4 * 0) = 35.0 - 8.5 = +26.5 → Proceed.
  *   **Stage 5 (Vulnerability V):** Patient failed standard therapy. Moderate vulnerability. `[JUDGEMENT]` V=1.1. Modified RWEU = (0.5 * 70) + (1.1 * 0.1 * -85) + (0.4 * 0) = 35.0 - 9.35 = +25.65 → Proceed.
  *   **Stage 6 (Epistemic):** **Critical Step.** Evidence: Probabilities derived from a genetically distinct population. Assumption of biological uniformity required. `[JUDGEMENT]`: **Quality of P estimates: Very Low** for *this specific patient population*. CoE: **Severe** (If harm risk is actually higher due to genetic differences, outcome could be catastrophic). *Decision:* Very Low Quality + Severe CoE → `Reject` or `Approve only with *extreme* conditions* (e.g., only if no alternatives exist, with intensive genomic screening if possible, ultra-close monitoring). **Framework mandates rejection or highly conditional approval.**
  *   **Why Framework Rejects Mechanical RWEU Result:** The positive RWEU calculation in Stages 4/5 is rendered irrelevant by the **epistemic assessment** in Stage 6. The procedure explicitly flags that the probability estimates lack credibility for *this specific context* (genetically distinct population), and the cost of being wrong about them (especially underestimating harm) is severe. The theory *does* contain an internal mechanism (Dimension 2 - Epistemic Confidence & Cost of Error) that requires overriding the mechanical RWEU result when evidence is poor and stakes are high.
  *   **Ambiguity:** Judging the epistemic quality and CoE when extrapolating across populations is inherently challenging but central to the rejection.

  ---

  **Procedure Limitations:**

  1.  **Value Judgements Disguised as Inputs:** Key inputs (Utilities U, Risk-Weight Function w(P), Vulnerability Multiplier V, Evidence Quality, Cost of Error) require `[JUDGEMENT]`. These embed ethical values (e.g., how bad is death vs suffering? How cautious should we be? How much does vulnerability matter? How much evidence is enough?). The procedure structures these inputs but doesn't eliminate their subjectivity.
  2.  **Cannot Resolve Deep Values Conflicts:** If panellists fundamentally disagree on core utilities (Stage 2) or the ethical justification for the risk-weighting/V factors (Stages 3/5), the procedure halts (`Values Halt`) but cannot resolve the conflict. This requires broader ethical deliberation.
  3.  **Oversimplification of Complex Outcomes:** Reducing multifaceted clinical outcomes to single utility scores is inherently reductive. Capturing interactions or sequences of outcomes is difficult.
  4.  **Quantification Challenges:** Assigning precise numbers (U, P, w(P), V) is artificial and challenging for complex, uncertain clinical scenarios. The process forces articulation but precision is illusory.
  5.  **Neglects Process Values:** Focuses on outcome valuation. Crucial elements like procedural justice, fairness in resource allocation (if relevant), or the symbolic meaning of an intervention are not directly captured.
  6.  **Static Snapshot:** Doesn't easily handle dynamic situations or learning over time within a trial.
  7.  **Calibration and Thresholds:** Setting the RWEU thresholds (Threshold_Low/High) and calibrating the w(P) function/V factors requires initial `[JUDGEMENT]` and may need refinement.

  **Deliberate Departures:**
  *   If the panel chooses to override the procedure's recommendation (e.g., approve despite a `Reject` signal, or reject despite an `Approve` signal), this **must** be explicitly documented in the decision record.
  *   The justification must clearly state:
      1.  Which stage(s) of the procedure were overridden.
      2.  The specific reason for the departure (e.g., "Overruled Stage 6 Reject due to overwhelming patient autonomy considerations despite epistemic concerns in Case B variant"; "Rejected Stage 5 Proceed due to unquantifiable community risk not captured in utilities").
      3.  The ethical principle or value motivating the override.
  *   This transparency ensures accountability and allows for reflection on whether the procedure or its inputs need adjustment for future cases.

  This SCRAP framework provides the structured, RWEU-based procedure you requested, explicitly separating the three critical dimensions, incorporating epistemic assessment to challenge mechanical calculations (as in Case C), and flagging unavoidable judgement points while respecting time constraints.
