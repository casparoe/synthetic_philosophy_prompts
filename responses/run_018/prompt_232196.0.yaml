  ### Money Pump Activity: The Jelly Bean Cycle  
  **Goal:** Demonstrate how intransitive preferences enable exploitative trading cycles.  
  **Materials:** Red, green, and blue jelly beans (or colored cards); 30 poker chips (or pennies); a "bookie" (facilitator/student).  
  **Stakes:** Each jelly bean is worth 1¢ if eaten/redeemed post-activity. Trades cost 1¢ (paid to bookie).  

  ---

  ### Rules & Setup  
  - **Traders (9 students):** Start with one jelly bean (3 red, 3 green, 3 blue) and 3¢.  
  - **Bookie (1 student/facilitator):** Holds infinite beans and collects 1¢ per trade.  
  - **Preferences:** Traders *must* follow:  
    - Red ≻ Green (prefer red over green)  
    - Green ≻ Blue (prefer green over blue)  
    - Blue ≻ Red (prefer blue over red)  
  - **Trading:** Any trader may swap their bean for another by paying 1¢ to the bookie. No bean reselling between traders.  

  ---

  ### Timeline (50 Minutes)  
  #### **Variant 1: No Memory/Foresight** (25 mins)  
  - **0–5 min:** Explain rules. Emphasize: "Trade only if it improves your bean! Each trade costs 1¢." *Do not mention cycles.*  
  - **5–15 min:** **Trading Round 1.** Bookie calls: "Who wants to trade?" Traders line up. Each trade takes 10 sec.  
  - **15–20 min:** **Trading Round 2.** *Reset positions:* Bookie shuffles beans; traders lose memory of prior trades.  
  - **20–25 min:** **Trading Round 3.** Repeat Round 2.  

  #### **Variant 2: Sophistication/Foresight** (20 mins)  
  - **25–30 min:** Reset beans/money. Announce: "Now you know the cycle: Red→Blue→Green→Red. Plan one global strategy."  
  - **30–40 min:** **Trading Rounds 1–3.** No memory reset. Traders may trade or abstain.  
  - **40–45 min:** **Redemption.** Traders eat/redeem beans for 1¢. Count remaining money.  

  #### **Debrief** (5 mins)  
  - "Who lost money in Variant 1? How?" (Cycle: e.g., Red→Blue→Green→Red = 3 trades = –3¢).  
  - "Why did this happen?" (Traders forgot prior trades; each swap seemed rational alone.)  
  - "In Variant 2, did anyone avoid loss? How?" (Sophisticated players committed to one trade or none.)  
  - Map to money pumps:  
    - **Premise 1:** Intransitive preferences enable cycles.  
    - **Premise 2:** Without memory/foresight, each trade seems beneficial.  
    - **Conclusion:** Cyclical trades drain money.  
  - **Key insight:** Sophistication (planning) blocks the pump—but forces you to forgo "beneficial" trades, revealing the irrationality of intransitivity.  

  ---

  ### Failure Modes & Mitigation  
  1. **Traders refuse to trade** (suspect a trap).  
     - *Mitigation:* Stress: "Follow the preferences given. In real life, we make myopic trades *all the time* (e.g., impulse buys)."  
  2. **Variant 2 lacks trades** (all players abstain).  
     - *Mitigation:* Ask abstainers: "You have red and prefer blue. Why didn’t you trade? Because you foresaw the cycle? Is that satisfying?"  

  ---

  ### Honest Note  
  **What the activity can’t replicate:** Real-world *dynamic inconsistency*. In life, even sophisticated agents struggle to resist "improvement" in the moment. The activity relies on traders *committing* to a plan—but humans often cave to myopic urges. Highlight this gap in debrief.  

  ---
  **Rationale:** Using jelly beans (or tangible items) makes intransitivity visceral. Variant 1 mirrors absentminded consumers; Variant 2 forces strategic thinking. By losing real pennies, students "feel" the pump before analyzing it.
