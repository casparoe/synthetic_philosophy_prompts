     The only way to avoid being pumped is to commit to not trading.

     So in Variant 2, we hope that sophisticated students will commit to not trading, or maybe commit to only one trade.

     redemption values might be set to match the preferences? 

     But we said the redemption value: red=$0.10, green=$0.08, blue=$0.06.

     This does not match the preferences: 
          preferences: red > green, but redemption: red=10 > green=8 -> matches.
          green > blue: 8>6 -> matches.
          blue > red: 6 > 10? -> does not match.

     This is a problem.

     Instead, we should set redemption values arbitrarily to be the same for all, say $0.10 for any jelly bean, to make the only motivation the preference. The fee is the only money aspect.

     But then the students might not care about the redemption and only care about the fee. They might avoid trading to avoid losing money.

     So we need to motivate them to try to get a preferred jelly bean.

     We can say: "At the end, you will eat the jelly bean you have. You have the preferences as above."

     And then we hope they will be willing to pay a small fee to get a better tasting one.

     And then after the activity, we give them a chance to eat it, but also we can give them the redemption money in pennies.

     So combine: they get to eat the jelly bean AND they get $0.30 minus the fees they paid.

     But then the fee is real money loss, and the jelly bean is real too.

     This might work.

     Procedure for two variants:

     We will run the activity twice, with a break for instructions in between.

     First Variant: No memory.

        - Each trader is given one jelly bean and $0.30.
        - They are told their preferences (red>green, green>blue, blue>red) and that they can trade with the bookie by paying $0.05 per trade.
        - They are told that at the end, they will eat the jelly bean they hold and keep any remaining money.
        - Trading rounds: 3 rounds of 5 minutes each. In each round, they can approach the bookie once and make one trade if they wish.
        - The bookie records each trade (trader's name, from, to, fee paid).
        - After three rounds, they eat the jelly bean and count their money.

     Second Variant: With foresight.

        - Reset: give each trader a jelly bean (same distribution) and $0.30.
        - This time, we explain the cycle explicitly and say: "You might notice that by doing a series of trades, you can end up where you started but with less money. How will you avoid that?"
        - They are given 2 minutes to think of a plan.
        - Then, 3 rounds of trading as above.

     Timeline (50 minutes):

        0-5 min: Introduction and rules for Variant 1.
        5-20 min: Variant 1 trading (3 rounds, each 5 min).
        20-25 min: Variant 1 redemption: eat the bean and count money. 
        25-30 min: Reset and explain Variant 2.
        30-45 min: Variant 2 trading.
        45-50 min: Variant 2 redemption and debrief.

     Debrief:

        - Ask: "How many of you ended up with the same color you started with in Variant 1? How much money did you have left?"
          Some will have done the full cycle and paid $0.15 in fees, so from $0.30 to $0.15.
        - "How many of you ended up with a different color? How much money do you have?"

        - Then for Variant 2: "Did anyone here do a full cycle? Why or why not?"

        - Map to money pump: 
              In Variant 1, if you did the cycle (red->blue->green->red), you paid three fees and are back to red. 
              Each trade seemed like an improvement (because blue>red, then green>blue, then red>green? wait, we have a problem: after trading to blue, you have blue and you believe green>blue, so you trade to green. Then you have green and you believe red>green, so you trade to red. But then you are back to red and have paid $0.15.

        - But note: the last trade is from green to red because red>green. But then why would they do that if they started with red and originally traded it away for blue? In the moment, they might not remember.

        - Highlight: in Variant 1, the lack of memory allowed the cycle.

        - In Variant 2, sophisticated players might have avoided trading altogether, or only done one trade and then stopped.

        - But what if in Variant 2, a player starts with red and trades to blue (because blue>red), and then stops? They are happy with blue. But then blue is not the best because they also think green>blue and red>green? There is no best.

        - The money pump argument assumes that the preferences are held at a single time and are intransitive, and that you myopically make improving trades.

        - In Variant 2, if a player is sophisticated, they might say: "I have red. I know that if I trade to blue, then I will want to trade to green, and then to red, and I'll be pumped. Therefore, I will not trade at all." 
          So they avoid the pump by foresight.

        - But then are they happy with red? They also know that blue>red, so they are forgoing an improvement. This is a tension.

        - This is where we discuss: what does it mean to have intransitive preferences? It means there is no best option. So no matter what you have, there is something better. Then you are vulnerable to being pumped unless you commit to not trading.

        - The money pump argument says that intransitive preferences are not rational because they lead to dominated outcomes.

     Failure modes:

        - Traders might refuse to trade because they suspect a trick. 
          Mitigation: Emphasize that they should only trade if they think it improves their jelly bean situation. 
          Also, in the introduction, say: "In real life, we often make trades that seem good at the time."

        - In Variant 2, everyone might avoid trading, so no one is pumped. 
          Then we can discuss: why didn't you trade? And they will say because they foresaw the cycle. 
          We then ask: "But if you have red and you believe blue is better, why didn't you trade to blue?" 
          They might say: "Because then I would want to trade to green and then to red and I'd lose money." 
          We then point out: if you are sophisticated, you might avoid the first trade, even though it seems improving, because of what it leads to.

        - Some traders might not have strong preferences for the jelly beans and only care about money. 
          Mitigation: Use real jelly beans to eat and also give them a small redemption value (say $0.10 for any bean) so that the only cost is the fee. 
          Then they will avoid trading to avoid the fee.

          To encourage trading, we might rely on the stated preferences. 
          We can say: "You are to imagine that you have these preferences, and act accordingly."

     Honest note:

        - The activity cannot reproduce the fact that in real life, preferences might be stable over time and we might not be able to commit to not trading. 
          In the activity, the facilitator can ask them to commit to a plan and they can stick to it. 
          In real life, when presented with an opportunity to trade from red to blue (which seems improving), it might be very hard to resist.

        - This is the issue of dynamic inconsistency and the need for precommitment.

