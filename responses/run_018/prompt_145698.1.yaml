answer: |-
  Your observation captures a profound tension in IP discourse—a territorial metaphor persisting despite the rejection of rivalrous ownership. This phenomenon doesn't have a universally accepted label, but it aligns with what I term **"Intellectual Sovereignty"**—a framework distinct from both standard property theories and moral rights doctrine. Below is a precise dissection:

  ### Core Characteristics of "Intellectual Sovereignty"
  1. **Domain-Delineation, Not Object-Possession**:  
     Ideas are framed as *spheres of influence* or *conceptual territories* bounded by the creator's contribution. Violation occurs through **unacknowledged entry** (e.g., using an idea without attribution) rather than theft.

  2. **Harm as Boundary Disruption**:  
     The wrong lies in:  
     - **Misplacement**: Severing the idea from its originator’s "territory."  
     - **Jurisdictional Violation**: Acting within another’s domain without permission, akin to trespassing on sovereign land.  

  3. **Non-Rivalry as Irrelevant**:  
     Unlike physical property, the territorial claim persists *despite* non-rivalry because the issue is **relational order**, not scarcity.

  ### Distinguishing from Existing Frameworks
  | **Framework**               | **Core Logic**                                      | **Why It Differs**                                                                 |
  |-----------------------------|----------------------------------------------------|-----------------------------------------------------------------------------------|
  | **Lockean Labor Theory**    | Ownership via labor-mixing with resources.         | Treats ideas as objects; sovereignty treats ideas as jurisdictions.               |
  | **Hegelian Personality**    | Expression as an extension of self.                | Focuses on identity, not spatial boundaries.                                      |
  | **Moral Rights (Berne)**    | Attribution/integrity as personal rights.          | Applies only to authors/artists; sovereignty extends to patents, concepts, data.  |
  | **Utilitarian IP**          | Incentives for innovation.                         | Ignores boundary ethics; sovereignty is deontological.                            |

  ### Key Evidence from Your Examples
  - **Academic Plagiarism**:  
    The offense is **locational misassignment**—presenting an idea as "homeless" or wrongly mapped. Journals demand citation not to "compensate" but to **maintain cartographic accuracy** in intellectual space.
    
  - **Patent Infringement**:  
    Descriptions like "staked a claim" (e.g., *"pioneer patent" doctrine*) frame patents as **constitutional charters**, where infringement is *occupation without consent*. Courts often invoke "fencing off" metaphors (e.g., *Festo Corp. v. Shoketsu Kinzoku Kogyo Kabushiki Co.*).

  ### Is This a Distinct Concept?  
  **Yes**, because:  
  - **Structural Difference**: Sovereignty operates through **jurisdiction** (control over a domain), while property operates through **exclusion** (control over an object).  
  - **Unique Harm**: Deprivation is absent; harm arises from **disorder in the epistemic landscape**.  
  - **Broader Applicability**: Explains norms in open-source licensing (e.g., GPL’s "copyleft" boundaries), traditional knowledge protection, and data ethics beyond copyright/patent law.

  ### Defining Conditions  
  An act violates intellectual sovereignty iff:  
  1. A **delineated domain** exists (e.g., a scholar’s body of work; a patented technical field).  
  2. The actor **enters/uses** that domain.  
  3. Entry occurs **without attribution** (failure to map) or **without permission** (breach of jurisdiction).  
  4. The violation **disrupts relational order** (e.g., obscuring origins; destabilizing credit economies).  

  ### Why "Moral Rights" Is Insufficient
  Moral rights (e.g., *droit moral*) protect personal dignity, not territorial integrity. They:  
  - Apply only to creative works, not functional inventions.  
  - Lack the spatial logic of "encroachment" (e.g., patent trolls "mining" fields).  
  - Are waivable; sovereignty claims (like territorial borders) persist irrespective of consent.  

  ### Proposed Name & Validity  
  **"Intellectual Sovereignty"** best captures:  
  - **Sovereignty’s Historical Roots**: Territorial jurisdiction in political theory (Bodin, Hobbes).  
  - **Boundary-Centric Language**: "Trespass," "encroachment," "domain" are sovereignty idioms.  
  - **Normative Independence**: It addresses a fundamental need for **cognitive cartography**—ordering ideas in social space.  

  ### Edges and Limits  
  - **Not This**: Routine inspiration, independent discovery, or ideas in the public domain (where sovereignty is relinquished).  
  - **Contested Zone**: Parody/remix culture challenges boundaries but often acknowledges sovereignty through "productive trespass" tropes.  
  - **Risk**: Overextension could stifle discourse; sovereignty claims must be socially ratified (e.g., via citation norms) to avoid arbitrariness.  

  ### Conclusion  
  This framework merits recognition as a distinct model. It resolves the paradox you identify: even when ideas are non-rivalrous, we demand **boundary stewardship** to sustain intellectual communities. Calling it "intellectual sovereignty" foregrounds the jurisdictional logic while differentiating it from property, labor, and personality theories. For deeper analysis, see legal scholar Madhavi Sunder’s work on cultural boundary-making (e.g., *"IP3"*) and Robert Merges’ *"Against Intellectual Monopoly"* for territorial metaphors in patent law.
