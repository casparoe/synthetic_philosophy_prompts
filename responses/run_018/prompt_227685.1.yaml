prompt: |-
  Next term I'm running one fifty-minute seminar on Gongsun Long's white horse dialogue for first-year undergraduates in a cross-cultural philosophy of language course; they will have read a translation but nothing else from the School of Names, and most will arrive suspecting the thesis that a white horse is not a horse is either a translation glitch or a parlour trick. Plan my explanation rather than giving it. What has to be in place before the argument can look like anything other than a falsehood (e.g., a distinction between what a term picks out and what it requires of what it picks out), and should the white horse itself carry the whole session or should I build the structure first on a modern analogue -- if so, say what the analogue must preserve and what it must not smuggle in. Map the misconceptions I should expect (that it is mere sophistry, that it reduces to a point about subsets and Venn diagrams, that it is really about Chinese grammar treating nouns as mass terms) and mark exactly where in the sequence each should be headed off rather than answered afterwards. Finally, give me one closing question that reveals whether they have grasped the argument as opposed to memorised the verdict, and name what I should openly refuse to cover at this level. Please write in British English.
reasoning: |-
  Okay, the user is planning a seminar on Gongsun Long's white horse paradox for first-year undergraduates. They need to make this ancient Chinese philosophical argument accessible to students who likely view it as either a translation error or sophistry. 

  First, I should consider the core challenge: students will approach this with Western logical assumptions where "a white horse is not a horse" seems blatantly false. The key is to destabilise this intuition early. I recall Gongsun Long's argument hinges on the distinction between reference and criteria - what a term picks out versus what it requires for something to qualify. 

  For the session structure, starting with a modern analogue seems wise. Something like "a vegan sausage is not a sausage" could work - it preserves the category membership tension without smuggling in Chinese linguistic specifics. Must avoid examples that trigger subset thinking (like "a labrador isn't a dog") as that reinforces Venn diagram misconceptions. 

  Major misconceptions to preempt:
  - Sophistry charge: Head off immediately after presenting the paradox by framing it as serious philosophy of language
  - Subset/Venn errors: Block when introducing the modern analogue by explicitly contrasting with class inclusion
  - Mass noun theory: Address during the Chinese context segment by noting classical Chinese handles count nouns

  The reveal moment should come when showing how "white horse" demands whiteness while "horse" does not - that's when the reference/criteria distinction crystallises. 

  For the closing question, something requiring application rather than recall: "Why couldn't Gongsun Long equally argue a brown horse isn't a horse?" This tests understanding of the specific whiteness criterion. 

  Must openly refuse deep dives into:
  - Other School of Names texts
  - Later Chinese commentaries
  - Formal logical notation
  - Broader historical context beyond immediate argument needs

  The session should stay tightly focused on making this single paradox philosophically legible. The white horse must pull the cart here, with modern scaffolding only used temporarily.
answer: |-
  Here’s a structured plan for your seminar, prioritising conceptual groundwork and pre-emptive misconception management. Aim for clarity over comprehensiveness.

  **Core Objective:**  
  Shift students from seeing "白馬非馬" (*bái mǎ fēi mǎ*, "white horse is not horse") as absurd to recognising it as a serious argument about **reference, criteria of application, and linguistic ontology**.

  ### Session Structure & Key Elements  
  **1. Destabilise Intuition (5 mins)**  
     - **Hook:** Poll students: "Who thinks ‘white horse is not horse’ must be a mistranslation or trick?" Validate suspicion but withhold resolution.  
     - **Pivot:** "Today we treat this as rigorous philosophy. To do that, we need new tools."  

  **2. Foundational Distinction: Reference vs. Criteria (15 mins)**  
     - **Modern Analogue (Essential):** Use **"A vegan sausage is not a sausage"**.  
       - *Why it works:*  
         - Preserves tension between common usage ("It’s a type of sausage!") and strict criteria ("Sausage requires meat; this lacks meat").  
         - Avoids smuggling in set theory ("vegan sausage" isn’t a subset of "sausage" if "sausage" *by definition* contains meat).  
         - Highlights how terms impose **requirements** (criteria) beyond pointing to objects (reference).  
     - **Key Takeaway:**  
       - Terms have **conditions for correct application**. If "sausage" requires meat, vegan sausages fail the criteria *even if we call them sausages*.  
       - *Pre-empt Venn diagrams here:* "This isn’t about sets. It’s about what a term *demands* of an object."  

  **3. Apply to Gongsun Long (20 mins)**  
     - **White Horse Argument (Text-Focused):**  
       - *Premise 1:* "Horse" picks out form/shape (形 *xíng*). "White" picks out colour (色 *sè*).  
       - *Premise 2:* "White horse" demands **both** form (horseness) **and** colour (whiteness).  
       - *Conclusion:* What "horse" requires (only horseness) ≠ what "white horse" requires (horseness + whiteness). Hence, "white horse" ≠ "horse".  
     - **Visual Aid:**  
       ```  
       "Horse" criteria: [HORSENESS]  
       "White horse" criteria: [HORSENESS + WHITENESS]  
       ```  
       - *Crucial:* Emphasise **criteria identity** (what must be satisfied) over **object inclusion** (what falls under the term).  
     - **Block "Mass Noun" Misconception:**  
       - *When raised:* During criteria explanation.  
       - *Response:* "Classical Chinese *can* handle count nouns (e.g., 馬 *mǎ* for ‘horse’). Gongsun Long isn’t confused by grammar – he’s exploiting logical tension *within* the language."  

  **4. Why Not Sophistry? (5 mins)**  
     - **Pre-empt Early:** After presenting the argument structure.  
     - **Key Defence:** Gongsun Long isn’t denying white horses *are* horses in ordinary speech. He’s exposing a **philosophical problem**:  
       - If words get meaning from fixed criteria, combining terms ("white" + "horse") creates a new criterion ≠ the sum of its parts.  
       - *Analogy:* "Vegan sausage" isn’t just "vegan" + "sausage" – it *redefines* "sausage".  

  **5. Closing Question (Test Understanding)**  
     - **"Could Gongsun Long argue that a *brown* horse is not a horse? Why/why not?"**  
       - *Tests:*  
         - Memorisation vs. grasping criteria logic (answer: No, unless "brown" alters the criteria for "horse", which it doesn’t).  
         - Recognises whiteness is integral to *this specific argument* (colour as a distinct, defining feature).  

  ### What to Refuse (State Explicitly)  
  - **"We won’t cover:**  
    - Later Mohist/Confucian critiques or the broader School of Names.  
    - Modern formal logic translations (e.g., predicate calculus).  
    - Historical debates about textual authenticity.  
    This session is about *this argument’s philosophical mechanics*."  

  ### Misconception Management Map  
  | **Misconception**               | **When to Block**                | **Strategy**                                                                 |  
  |----------------------------------|----------------------------------|------------------------------------------------------------------------------|  
  | "It’s wordplay/sophistry."       | After presenting argument structure | Contrast ordinary vs. philosophical language; stress criteria integrity. |  
  | "It’s just subsets/Venn diagrams." | During modern analogue          | Explicitly reject set theory; demand focus on *term criteria*, not objects. |  
  | "Chinese treats nouns as mass."  | When analysing text criteria     | Show *mǎ* as count noun; argue tension is logical, not grammatical.          |  

  ### Why This Works  
  - **Analogue First:** Students confront logical tension in a familiar context, disarming "Chinese exoticism".  
  - **Criteria Focus:** Avoids anachronistic set theory while capturing Gongsun Long’s semantics.  
  - **Active Defence:** Misconceptions are pre-empted *where they arise* in the logic, not rebutted post-hoc.  

  **Final Tip:** Hammer the criteria/reference distinction relentlessly. When a student says "But a white horse *is* a horse!", respond: "In what sense ‘is’? By reference or by criteria?" Force them onto Gongsun Long’s terrain.
