answer: |-
  Here is your five-point project summary:

  1.  What precise specifications must an optimality model meet to test an adaptationist hypothesis for a trait (i.e., provide evidence beyond mere compatibility), specifically regarding the counterfactual variants considered (arrival) and the interpretation of "adaptation" tested (etiological selection history vs. dispositional functional entrenchment)?
  2.  Existing positions leave this open because both adaptationist and spandrels critiques typically conflate the arrival/retention distinction (treating accessibility as given) and the etiological/dispositional distinction (often arguing past each other on which sense of "adaptation" is relevant), focusing instead on frequency debates or global methodological prescriptions.
  3.  The method analyzes specific biological case studies where the two distinctions demonstrably resolve ambiguities in applying optimality models; this beats head-counting (superficial, ignores conceptual structure), pure conceptual analysis (lacks biological grounding/testability), and wholesale historicism (too broad, misses the specific model-testing problem).
  4.  Success yields a concrete, biologically applicable specification framework for model-testing; failure occurs if the distinctions prove redundant to existing critiques, fail to clarify concrete cases, or result in specifications biologists cannot feasibly implement or find useful.
  5.  Cut broad defenses of historicism and extensive conceptual analysis of function; the weakest point is demonstrating that biologists *will* or *should* adopt these specifications over simpler, established practices, given potential added complexity.
