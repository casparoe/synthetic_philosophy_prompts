answer: |-
  Your framework for democratic backsliding as a coherent category rests on **three core pillars**:  
  (1) A directional mechanism of executive aggrandizement;  
  (2) Achieved via strategic erosion/capture of *specific* horizontal accountability institutions;  
  (3) While maintaining a formal procedural shell.  

  **To genuinely falsify this framework**, the following evidence would be required, ranked by severity (most decisive first):  

  ---

  ### **Tier 1: Decisive Defeaters**  
  *(Would collapse the core mechanism)*  
  1. **Empirical Proof of Reverse Causality**:  
     - **Observation**: Documented cases where **executive consolidation + institutional restructuring** (e.g., court reforms, electoral authority overhaul) **strengthened** horizontal accountability.  
     - **Example**: A "reverse-Poland" case where court-packing leads to *more* independent rulings against the executive, reduced corruption, and expanded civil liberties over 5–10 years.  
     - **Why decisive?** Directly negates the claimed *directional mechanism* (aggrandizement via weakening). If strengthening accountability institutions *requires* executive consolidation, the causal arrow reverses.  

  2. **Formal Shell Coexists with Democratic Deepening**:  
     - **Observation**: Cases where executive power expands *and* horizontal institutions are restructured, **yet** measurable indicators of democracy (e.g., V-Dem Liberal Democracy Index, Freedom House scores) **improve** consistently.  
     - **Example**: A country with declining judicial independence but *rising* electoral integrity, civic participation, and opposition rights—demonstrating that formal-shell maintenance isn’t masking erosion but enabling renewal.  
     - **Why decisive?** Undermines the premise that executive aggrandizement within intact formal procedures *necessarily* implies backsliding. Proves the mechanism can coexist with democratization.  

  ---

  ### **Tier 2: Severe but Salvageable Challenges**  
  *(Would force major redefinition, not abandonment)*  
  3. **Accountability Erosion in Stable Democratic Renewal**:  
     - **Observation**: Horizontal institutions (e.g., courts, anti-corruption bodies) are routinely weakened during **non-crisis constitutional renovations** in stable democracies, with no backsliding outcomes.  
     - **Example**: Canada/Scandinavia restructures judicial review, temporarily concentrating executive power during reforms, yet democracy strengthens post-implementation.  
     - **Severity**: High—but defenders could impose **boundary conditions** (e.g., "only when erosion is *strategic and permanent*"). Failure if observed frequently without democratic decline.  

  4. **Non-Executive Actors as Primary Eroders**:  
     - **Observation**: Horizontal accountability declines **primarily due to non-executive forces** (e.g., legislatures, private actors, civil society) *without* executive instigation.  
     - **Example**: Brazil’s Congress systematically defunds anti-corruption agencies to protect its members, while the president opposes this.  
     - **Severity**: Forces framework to drop "executive aggrandizement" as the core mechanism—potentially reframing backsliding as *multi-actor*.  

  ---

  ### **Tier 3: Awkward but Absorbable Evidence**  
  *(Requires refinement, not rejection)*  
  5. **Ideological Asymmetry in Outcomes**:  
     - **Observation**: Executive consolidation under *left-wing* governments consistently improves accountability, while *right-wing* consolidation erodes it (or vice versa).  
     - **Response**: Defenders could argue ideology masks underlying institutional logic—but if correlated perfectly, the "non-partisan" claim weakens.  

  6. **Backsliding Without Formal Shell Maintenance**:  
     - **Observation**: Democratic erosion occurs **without** intact formal procedures (e.g., coups, revolutionary change), yet matches all other criteria.  
     - **Response**: Framework can exclude such cases as "non-incremental" backsliding.  

  ---

  ### **Critical Vulnerability: Risk of Unfalsifiability?**  
  Your framework risks insulation if:  
  - All counterexamples are dismissed as "misapplication" (e.g., "Poland’s reforms *seemed* pro-accountability but weren’t *truly* strategic").  
  - "Executive aggrandizement" is defined circularly (e.g., only if erosion occurs).  

  **To remain falsifiable, proponents must**:  
  - Specify **ex-ante metrics** for "strategic erosion" (e.g., laws targeting specific judges, abrupt jurisdiction-stripping).  
  - Define **quantitative thresholds** for "incremental" change (e.g., >3 institutional weakenings per term).  
  - Accept that **popular sovereignty enhancements** (e.g., referendums enabling executive actions) could *offset* accountability declines if verified empirically.  

  ---

  ### **Conclusion**  
  The framework is **substantively risky** but **not unfalsifiable**. Its Achilles’ heel is **Tier 1 evidence**: demonstrable cases where executive consolidation + institutional restructuring *enhances* democracy. Absent that, it remains robust if refined to exclude stable democracies undergoing temporary reforms (**Tier 2**). Crucially, it *can* be falsified without partisan bias—but only if defenders precommit to empirical criteria for what counts as "strategic erosion" and "democratic deepening." Without such guardrails, it risks becoming a tautology.
