prompt: |-
  Take the role of an expert philosopher of decision theory and practical rationality. Before answering, spend a moment outlining the core logical tension between maximising expected value and maintaining coherent practical agency.

  Two colleagues, Mira and Jonas, debated expected-value fanaticism over coffee. Here is their exchange:

  (1) Mira said that letting astronomically valuable but astronomically unlikely outcomes dominate all choices collapses practical reasoning. If a 0.0001% chance of preventing cosmic-scale suffering can outweigh near-certain modest goods, then every rational agent should funnel all resources into that tail risk, leaving no space for ordinary obligations, relationships, or stable life plans. The framework is self-undermining because it eliminates the conditions for coherent agency.

  (2) Jonas replied that this confuses normative truth with psychological comfort. The fact that EV reasoning demands extreme allocations doesn't make it false; it reveals that the stakes are genuinely extreme. He offered an analogy: if saving a drowning child costs you only a dry shirt, you do not refuse because the shirt has near-certain value; the child's life dominates. Scaling up, refusing to act on a tiny probability of saving countless lives because it disturbs your weekend is not prudence but moral myopia.

  (3) Mira countered that the analogy fails because we can calibrate "drowning child" probabilities and values, whereas existential-risk probabilities are not frequencies but speculative judgments under deep uncertainty. Applying precise EV arithmetic to them is a category error. A rational agent should instead apply ambiguity aversion — treating unknown probabilities with Knightian caution — rather than multiplying an ungrounded figure by an astronomical utility.

  (4) Jonas responded that ambiguity aversion is merely risk aversion with extra steps, and if you reject EV maximisation for ambiguous tails you need a non-circular justification. Any substitute rule — maximin, satisficing, robustness — implicitly assigns weights to outcomes. Once you admit you care about the tail at all, refusing to act proportionally is arbitrary. Ignoring the tail is itself a decision with an expected value, usually catastrophic.

  (5) Mira added that even within the framework, the position violates basic fairness. If she must divert her child's education fund into a speculative cosmic-insurance scheme, she is not being rational; she is being unjust to identifiable present people for the sake of statistical ghosts. The fanatic cannot accommodate deontic constraints without smuggling them in as ad hoc utility adjustments.

  (6) Jonas concluded that deontic constraints can be internalised: you can build fairness into the utility function by treating justice violations as costs. But then the fanaticism remains — you are still maximising expected value, just over a richer description of outcomes. The framework absorbs the objections rather than disappearing.

  Please adjudicate this dispute move by move: for each of the six moves, rate it from clearly mistaken to clearly right and briefly justify the rating. Then state who is right about which specific point, and identify what both parties miss — for instance, whether there is a principled middle path between uncritical EV maximisation and ambiguity aversion, or whether the debate conflates normative and epistemic issues. Present your reasoning clearly, then finish with a one-line summary in the exact format:

  Verdict: [your concise conclusion here]
reasoning: |-
  Hmm, the user wants me to step into the role of an expert philosopher of decision theory and practical rationality to adjudicate a debate between Mira and Jonas about expected value fanaticism. They've presented six moves in their exchange and want me to rate each one, identify who's right on specific points, and find what both parties miss.

  First, I need to outline the core logical tension between maximizing expected value and maintaining coherent practical agency. This tension arises because EV maximization demands that we prioritize outcomes with the highest probability-weighted value, no matter how improbable they are. But this could lead to absurd scenarios where we constantly chase astronomical long shots, neglecting all ordinary responsibilities and stable life plans. This destabilizes agency itself - if we're always diverting resources to cosmic-scale tail risks, we lose the foundation that makes agency possible in the first place.

  Now let me evaluate each of the six moves in their debate:

  For Mira's first point, she argues that letting astronomically valuable but unlikely outcomes dominate choices collapses practical reasoning. I'd rate this as largely correct because it highlights how extreme EV maximization undermines the very conditions needed for rational agency. Jonas's reply in move 2 is technically correct but practically inadequate - while he's right that stakes can be extreme, he ignores psychological and practical constraints.

  Mira's counter in move 3 about existential-risk probabilities being speculative judgments is insightful - she correctly identifies that we can't apply precise EV arithmetic to deeply uncertain scenarios. Jonas's response in move 4 misses this nuance by equating ambiguity aversion with ordinary risk aversion. Mira's fairness argument in move 5 is compelling though incomplete, while Jonas's final point in move 6 about internalizing constraints is clever but doesn't actually resolve the deeper issues.

  Both debaters miss important aspects here. Mira doesn't provide a systematic alternative to EV maximization, and Jonas overlooks the epistemic limitations in assessing tail risks. They also conflate normative and epistemic issues - Mira's concerns are more about epistemological limitations while Jonas focuses on normative imperatives. There might be a middle path involving context-dependent decision rules or using EV maximization with careful uncertainty modeling.

  The verdict should capture that while EV maximization is compelling in theory, its application requires serious epistemic humility, especially regarding tail risks.
answer: |-
  ### Adjudication of the Debate on Expected-Value Fanaticism  
  *(Ratings: Clearly Mistaken (1) ↔ Clearly Right (5))*  

  #### **Move-by-Move Analysis**  
  1. **Mira (Collapse of Practical Reasoning)**:  
     *Rating*: 4/5 (Largely Right)  
     *Justification*: Correctly identifies the *self-undermining* nature of extreme EV maximization. Coherent agency requires stable commitments and resource allocation for near-term plans. Fanaticism destroys the scaffolding of practical rationality (e.g., personal projects, relationships) that enables meaningful action.  

  2. **Jonas (Normative Truth vs. Comfort)**:  
     *Rating*: 3/5 (Partially Right but Incomplete)  
     *Justification*: Correct that stakes *could* justify extreme actions (e.g., drowning child). However, falsely equates tractable dilemmas (known probabilities/values) with existential tail risks. Ignores *epistemic limitations* in quantifying cosmic stakes.  

  3. **Mira (Ambiguity Aversion & Category Error)**:  
     *Rating*: 5/5 (Clearly Right)  
     *Justification*: Existential risks involve *Knightian uncertainty* (unmeasurable probabilities), not quantifiable risk. Applying precise EV arithmetic here is indeed a category error. Ambiguity aversion (e.g., via minimax regret) is a principled response to unmodelable tail events.  

  4. **Jonas ("Ambiguity Aversion is Risk Aversion")**:  
     *Rating*: 2/5 (Mostly Mistaken)  
     *Justification*: Conflates risk (known probabilities) with ambiguity (unknown probabilities). Rules like maximin *do not* implicitly assign weights; they reject probabilistic reductionism under deep uncertainty. Ignoring the tail isn’t arbitrary if probabilities are epistemically vacuous.  

  5. **Mira (Fairness and Deontic Constraints)**:  
     *Rating*: 4/5 (Largely Right)  
     *Justification*: Highlights EV fanaticism’s *distributive injustice*: sacrificing concrete, proximate goods (e.g., a child’s education) for speculative cosmic gains violates duties to identifiable others. Deontic constraints (e.g., "do not harm the vulnerable") resist reduction to utility.  

  6. **Jonas (Internalizing Constraints)**:  
     *Rating*: 3/5 (Partially Right but Superficial)  
     *Justification*: While constraints *can* be modeled as costs in utility functions (e.g., guilt from injustice), this doesn’t resolve the core tension. The "richer description" merely disguises fanaticism: if cosmic stakes dominate, *all* resources still flow to tail risks, making life plans unsustainable.  

  ---

  ### **Who is Right About What?**  
  - **Mira is right** that:  
    - Uncritical EV maximization collapses agency under deep uncertainty (Move 1).  
    - Existential risks demand ambiguity aversion, not probabilistic reductionism (Move 3).  
    - Fanaticism violates fairness to present individuals (Move 5).  
  - **Jonas is right** that:  
    - High-stakes outcomes *can* dominate if probabilities/values are robust (Move 2).  
    - Alternative rules (e.g., maximin) still implicitly weigh outcomes (Move 4), though this doesn’t justify EV fanaticism.  

  ### **What Both Parties Miss**  
  1. **Epistemic/Conflation**: The debate conflates *normative* questions ("Should we maximize EV?") with *epistemic* ones ("Can we quantify these probabilities?"). Jonas ignores that existential risks often lack the epistemic grounding for meaningful EV calculations. Mira underdevelops a *positive alternative* to EV.  
  2. **Principled Middle Path**: A hybrid approach exists:  
     - **Domain-Specific Rules**: Use EV for tractable risks (e.g., medical decisions) but switch to **robust satisficing** (e.g., "ensure survival with acceptable probability") under radical uncertainty.  
     - **Two-Level Rationality**: Maximize EV *subject to* deontic constraints (e.g., "never sacrifice basic needs of others") and agency-preserving boundaries (e.g., "maintain minimum life stability").  
  3. **Agency Preservation**: Neither addresses that rationality must *sustain the agent’s capacity to act*. Fanaticism consumes the agent’s future efficacy (e.g., burnout, poverty), making long-term rationality impossible.  

  ---

  **Verdict: EV maximization is normatively compelling only when probabilities/values are epistemically robust; under deep uncertainty, ambiguity-averse constraints and agency-preserving satisficing are rationally mandatory.**
