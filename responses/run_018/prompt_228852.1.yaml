prompt: |-
  Is there a name for this? I cover science and ideas for a general-audience magazine, and over the past few years I've ended up writing about a couple of forgery scandals -- one in the art market, one in rare wine. What stuck with me isn't the fraud itself but what people said afterward. Collectors and critics who had loved a painting for a decade would, once it was exposed, suddenly report that the hands were always clumsy, the light was off, you could tell all along. The wine people were the same: sommeliers who'd raved about a bottle at dinners swore that, thinking back, it had never actually tasted right. So the pattern I'm after is this: information about where an object came from doesn't just change what people believe about it, it seems to reach backwards and change the experience they remember having had, and maybe even the experience they're having right now when they look at the thing again. Nobody touched the canvas; the wine is chemically identical; only the story changed.

  I want to be careful about what I'm not asking. I know there's literature on why originals are valued more than perfect copies, and on whether you could in principle see a forgery as different just by looking -- that's all downstream of this, and it's about value and knowledge, not about the weird temporal part, the re-coloring of an experience that's already over. It's also not plain hindsight bias, because these people aren't just misremembering what they predicted, they're reporting (as far as I can tell sincerely) that the thing looks or tastes different now.

  So: does this specific phenomenon have an established name in philosophy or psychology, and if so what are the nearest concepts and how does this differ from each? If nothing quite fits, coin a term, define it properly, and give me some boundary cases so I can see the edges -- does it apply when the new information is about the artist's crimes rather than the work's origin? Does it apply to music, where there's no unique physical object? Does it ever run in reverse, where learning something good about provenance improves a memory? I won't be satisfied with just a label; I need to know where the carving stops.
reasoning: |-
  Okay, the user is a science and ideas writer for a general-audience magazine. They've covered forgery scandals in art and wine and noticed something intriguing. After a forgery is exposed, people who previously admired the work suddenly recall flaws they claim they always noticed. The physical object hasn't changed—only the story about its origin. The user wants to know if there's a name for this phenomenon where new information retroactively alters memories and perceptions.

  First, I need to identify the core phenomenon: retrospective alteration of memory and perception based on new contextual information. The user mentions it's not about value or knowledge downstream, nor is it simple hindsight bias. They emphasize the "temporal part"—rewriting past experiences.

  I recall concepts like cognitive dissonance and belief perseverance. Cognitive dissonance theory (Festinger) might explain why people adjust their memories to align with the new info. But is there a more specific term? Memory reconsolidation comes to mind, where memories are rewritten upon recall. However, that's a neurological process, not a named psychological effect.

  What about the endowment effect or authenticity bias? Those deal with value assignment, not memory alteration. Hindsight bias is close, but the user already dismissed it because it's about misremembering predictions, not sensory experiences.

  I think of the "Hawthorne effect" or "observer effect," but those are about behavior changes under observation. Not relevant. Then there's "semantic satiation," where repetition changes word perception, but that's different.

  Ah, what about "affective realism"? That's when emotions shape perception. But it's not exactly retrospective. The user’s case involves past experiences being rewritten. Maybe "belief perseverance" where people cling to initial beliefs despite evidence. But again, not about altering memories.

  I remember studies where wine preferences change based on perceived price. Plassmann's study showed that expensive wine was rated higher, even when identical to cheap wine. That's similar but not retrospective. The user’s point is about past experiences being re-evaluated.

  Then it hits me: "revision of memory through cognitive dissonance." But that's not a single term. Perhaps "motivated memory reconstruction." Still, not established. Wait, maybe "source amnesia" or "misattribution," but those involve forgetting sources, not altering perceptions.

  I think the closest might be "revisionism" in psychology, but that's historical, not individual. Or "memory conformity," where others influence memories, but not self-induced.

  Perhaps no specific term exists. The user might need a coined term. Let me brainstorm: "retrospective perception shift," "provenance paradox," "cognitive backdating," "mnemonic recency effect."

  Need to check boundary cases. If an artist's crime is revealed, does it affect perception? Probably yes, via moral taint. Music without physical object? Perception could still change based on origin. Reverse case? Learning a piece is authentic might enhance remembered enjoyment.

  So, the answer might be that there's no single term, but related concepts are belief perseverance, cognitive dissonance, and expectancy effects. Coining "provenance paradox" or "authenticity-distortion effect" could work. The user needs clear boundaries: applies to origin, artist's crimes, music. Reverse is possible (halo effect). Temporal aspect is key—altering past experiences, not just current perception.
answer: |-
  This phenomenon you're describing is fascinating and deeply counterintuitive – the way **verification rewrites history, altering not just present perception but also the *memory* of past sensory experience**. It sits at a crossroads of established concepts, but there isn't a single, universally accepted term *precisely* capturing its temporal, sensory-memory-altering nature. However, we can map its territory precisely and find the nearest concepts.

  **Nearest Established Concepts & How This Differs:**

  1.  **Cognitive Dissonance (Leon Festinger):**
      *   **What it is:** The mental discomfort experienced when holding conflicting cognitions (beliefs, attitudes, behaviors). People are motivated to reduce this discomfort by changing their attitudes, beliefs, or behaviors, or by acquiring new information.
      *   **How it relates:** Collectors/critics experience dissonance between their *current knowledge* ("it's a fake") and their *past beliefs/experiences* ("I loved this masterpiece"). To reduce dissonance, they *retroactively adjust* their memory of the experience ("it was always flawed").
      *   **How this phenomenon differs:** While dissonance *explains the motivation*, it doesn't *specifically name* the process of sensory memory revision. Dissonance reduction can happen in many ways (e.g., dismissing the evidence, justifying the past love financially). Your phenomenon focuses specifically on the *reinterpretation and rewriting of sensory memory* as the chosen path.

  2.  **Belief Perseverance (with Motivated Memory Reconstruction):**
      *   **What it is:** The tendency to cling to an initial belief even after the evidence supporting it has been discredited. Closely linked is the idea that memories are reconstructed, not retrieved like files, and this reconstruction can be influenced by current beliefs and motivations ("motivated remembering").
      *   **How it relates:** The belief in the object's authenticity is discredited. To maintain a coherent self-narrative (e.g., "I'm a discerning expert"), the *memory* of the sensory experience is reconstructed to align with the *new* belief ("it was always bad").
      *   **How this phenomenon differs:** Belief perseverance focuses on *maintaining the core self-concept*. Your phenomenon highlights the specific *sensory* content of the reconstructed memory and its *retroactive* nature. It's less about persevering the *old* belief and more about *rewriting the sensory past* to fit the *new* belief.

  3.  **Expectancy Effect / Top-Down Processing:**
      *   **What it is:** Our prior expectations (beliefs, knowledge, context) shape our current perception and interpretation of sensory input.
      *   **How it relates:** *Now* knowing it's a forgery creates a powerful expectation ("this is bad/inferior"). This expectation directly influences how they *currently* perceive the object ("it looks clumsy now").
      *   **How this phenomenon differs:** This perfectly explains the *current* change in perception ("it tastes different *now*"). However, it doesn't inherently explain the *memory* alteration ("it *always* tasted off"). Your phenomenon explicitly involves the *memory* being overwritten to match the new expectation, not just the current perception.

  4.  **Hindsight Bias ("I-knew-it-all-along" Effect):**
      *   **What it is:** The tendency, after an outcome is known, to see the outcome as having been inevitable and to overestimate one's own ability to have foreseen it.
      *   **How it relates:** People claim they *could* tell it was fake all along, misremembering their past uncertainty.
      *   **How this phenomenon differs (Crucially):** As you noted, hindsight bias is typically about misremembering *predictions, judgments, or probabilities* ("I knew it was fake"). Your phenomenon involves misremembering the *sensory experience itself* ("the brushstrokes *looked* clumsy," "the wine *tasted* flawed"). It's a revision of the *qualia* of the past experience, not just the judgment about it.

  **The Gap & A Coined Term:**

  The specific core of your phenomenon is: **New information about an object's origin or context triggers a retrospective reconstruction of both the *memory of the sensory experience* and potentially the *current sensory interpretation* to align with the new narrative.**

  To name this gap: **The Provenance Paradox** or the **Authenticity-Distortion Effect**.

  *   **Definition:** The Provenance Paradox is a cognitive phenomenon wherein the discovery of new information concerning an object's origin (especially regarding authenticity, provenance, or creator) triggers a retrospective reconstruction of the *memory* of prior sensory experiences with the object, and potentially alters current sensory perception, causing them to be perceived as consistent with the newly revealed narrative. The physical stimulus remains unchanged; only the interpretive context has shifted, rewriting the past and present experience.
  *   **Key Mechanisms:**
      *   **Motivated Memory Reconstruction:** To reduce cognitive dissonance and maintain a coherent self-concept/identity (e.g., "expert"), memories are unconsciously rewritten.
      *   **Top-Down Processing Dominance:** The new contextual knowledge ("forgery") overwhelms bottom-up sensory data, dictating both current perception and the reconstruction of past perception.
      *   **Source Confusion:** The origin of the "flaw" perception (current knowledge vs. past sensation) becomes blurred in memory.

  **Defining the Boundaries (Carving the Edges):**

  1.  **Artist's Crimes vs. Object's Origin:**
      *   **Yes, it applies.** Learning an artist committed heinous crimes (e.g., knowing a beloved painting was created by a Nazi collaborator) can trigger the same effect. The "provenance" or context of the *creator* becomes morally tainted, leading people to reconstruct memories of the artwork itself as disturbing, ugly, or technically flawed ("those eyes always looked sinister"). The effect hinges on information fundamentally altering the *meaning* or *value context* of the object/experience.
  2.  **Music / Non-Physical Objects:**
      *   **Yes, it applies.** Music lacks a unique physical token, but the *recording* or the *performance attribution* serves a similar function. Learning a cherished recording isn't by the legendary artist but by an imitator, or that a beloved piece was composed under morally reprehensible circumstances, could lead to reconstructed memories ("the phrasing always felt stiff," "the harmony always sounded unsettling"). The core is the shift in the *narrative context* surrounding the creative work.
  3.  **Reverse Effect (Positive Provenance):**
      *   **Yes, it runs in reverse.** This is the **Halo Effect** in action. Learning a painting is a newly discovered masterpiece by a revered artist (or a wine is from a legendary vintage) can cause people to retrospectively reconstruct their memory of it ("I always sensed its genius," "that complexity was unmistakable") and enhance their current perception ("it looks so much more vibrant now," "the bouquet is incredible"). The Provenance Paradox encompasses both positive and negative shifts triggered by provenance revelations.
  4.  **Boundary Case: Simple Value Shift vs. Sensory Revision:**
      *   **Not the same.** Learning something merely increases the *monetary value* ("That vase I thought was junk is worth $1M!") might change how you *value* it now and make you *regret* dismissing it, but it doesn't necessarily cause you to misremember its *physical appearance* ("It always looked cheap") as *actually* looking valuable in the past. The Provenance Paradox involves revising the *sensory memory itself*, not just the value judgment attached to it. However, extreme value shifts *could* trigger it if tied strongly to perceived quality ("It *must* be beautiful because it's expensive" leading to "I see its beauty now, I guess I overlooked it before").
  5.  **Boundary Case: Corrective Reinterpretation:**
      *   **Distinction.** Sometimes, new information *genuinely* helps someone notice subtle details they *actually* overlooked before. The Provenance Paradox involves a *reconstruction* that may not align with the original sensory data. The line is fuzzy, but the hallmark is the *insistence* that the flaw was *always perceptible and salient* at the time, even when prior records (rave reviews, purchase decisions) contradict this.
  6.  **Boundary Case: Changing the Object Itself:**
      *   **Not the same.** If someone physically alters the painting or the wine is chemically changed (e.g., corked), then changed perception/memory is based on actual stimulus change, not just contextual narrative shift. The Provenance Paradox requires the *stimulus to be constant*.

  **In summary:** While powered by cognitive dissonance, belief perseverance, and expectancy effects, the specific phenomenon you describe—**the retroactive rewriting of sensory memory and concurrent perceptual shift triggered solely by altered contextual knowledge of origin/provenance—** lacks a single perfect name. **"The Provenance Paradox"** effectively captures its essence: the paradox that the story of origin, known *now*, changes the history of sensory experience. It applies broadly to origin, creator context, and non-physical artifacts like music, and works bi-directionally (positive or negative revelations). The carving stops where the stimulus itself changes or where only the *value judgment* shifts without a concomitant rewriting of the *sensory memory*. It's a profound demonstration of how deeply narrative and belief are woven into the fabric of perception and memory.
