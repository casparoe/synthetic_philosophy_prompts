answer: |-
  Here’s a disciplined case analysis structured for your research presentation, using the IAU/Pluto episode to interrogate Copycat’s relevance to conceptual change in science:

  ---

  ### **1. Mapping the Microdomain: Entities and "Letters"**
  - **Entities**: Pluto (pre-2006 "planet"), Eris (icy trans-Neptunian object larger than Pluto), Ceres (asteroid belt body once classified as a planet), Neptune (gas giant establishing dynamical dominance), and *implicitly* exoplanets (testing "planet" beyond the Solar System).
  - **"Letters" or "Groups" in Scientific Context**:  
    Replace Copycat’s alphabetic primitives with **observational attributes**:  
    - *Orbital dominance* (clearing neighbors, resonant orbits)  
    - *Size/mass* (hydrostatic equilibrium, spherical shape)  
    - *Location* (e.g., Kuiper Belt vs. inner system)  
    - *Historical precedent* (cultural/scientific legacy).  
    The "microdomain" is the **taxonomic space of Solar System bodies**, constrained by these attributes.

  ### **2. Conceptual Slippage: Fluid Boundaries and the IAU Intervention**
  - **Pre-2006 Slippages**:  
    - *Pluto-Ceres analogy*: Both small, icy, non-dominant orbits → slippage from "planet" to "minor body" (Ceres demoted 1800s).  
    - *Pluto-Eris analogy*: Eris larger than Pluto, same orbital class → "planet" boundary *must* include Eris (or exclude Pluto).  
    - *Exoplanet pressure*: Giant bodies in stellar systems forced slippage toward *dynamical* (orbital) over *geophysical* (size/shape) criteria.  

  - **IAU 2006 Resolution as "Slippage + Boundary Freeze"**:  
    - **"Clearing the neighborhood"** was *both* slippage and artificial rigidity:  
      - *Slippage*: Shifted "planet" from intrinsic properties (shape) to relational/dynamics (orbital control).  
      - *Boundary freeze*: Halted infinite slippage (e.g., to Ceres, Eris, or hundreds of Kuiper Belt objects) by adding a strict criterion.  
    - This mirrors Copycat’s "successor → numerical-order" slippage but with **institutional enforcement** halting fluidity.

  ### **3. Evaluating Hofstadter’s Fluid Concepts & Copycat’s Limits**
  - **Support for Fluid Concepts**:  
    The debate confirms concepts *are* contextually fluid:  
    - "Planet" lacked classical definition pre-2006, evolving under analogical pressure (e.g., "If Pluto is a planet, why not Eris?").  
    - Attributes gained/lost salience (e.g., location overruled by size when comparing Eris/Pluto).  
    - Copycat’s "emergent concepts" align with taxonomy emerging from attribute interactions.  

  - **Where Copycat Breaks Down**:  
    - **Institutional Authority**: Copycat’s agents lack hierarchical power. The IAU vote imposed a top-down boundary (resolution 5A), overriding bottom-up analogical consensus.  
    - **Irreversibility**: Scientific reclassifications (unlike Copycat’s restartable runs) have lasting institutional, educational, and cultural consequences.  
    - **Scale Complexity**: Real-world attributes (e.g., "clearing") involve quantitative astrophysics, unlike Copycat’s discrete relations.  
    - **Motivation**: Scientists debated *epistemic values* (e.g., "taxonomic usefulness"), absent in Copycat’s goal of "satisfying" analogies.

  ### **4. Conclusion: Copycat as Partial Illumination**
  Pluto’s demotion **begins** as a Copycat microdomain: fluid concepts, analogical slippage (Eris/Pluto/Ceres), and context-driven redefinition. However, the IAU’s intervention **exposes a critical limit**: institutional power can *crystallize* fluid concepts to serve social/pragmatic goals (e.g., pedagogical simplicity, consensus). This episode suggests:  
  - **Hofstadter is right** that concepts *naturally* behave fluidly under analogical pressure.  
  - **Science adds a layer**: When fluidity threatens instability (e.g., infinite "planets"), institutions impose *arbitrary boundaries* — a top-down constraint Copycat cannot model.  

  Thus, while Copycat illuminates the *process* of conceptual slippage in science, it underestimates how **authority can halt fluidity**, transforming analogical reasoning into codified law.

  ---

  ### **Key Presentation Additions**
  - **Visual Metaphor**: Show Copycat’s letter-string analogies alongside IAU attribute comparisons (e.g., "Pluto : Eris :: zyyx : zyyz" with orbital groups).  
  - **Philosophical Hook**: Argue that the episode reveals science as *both* Hofstadter-style fluid reasoning *and* Kuhnian paradigm stabilization.  
  - **Limitation Spotlight**: Emphasize that Copycat models *cognition* but not *social epistemology* (e.g., voting, authority).  

  This framework rigorously tests Hofstadter’s model against real conceptual change while respecting the IAU case’s institutional uniqueness.
