  Conclusion: The episode starts like a Copycat microdomain with analogical pressures causing slippage. But the IAU's intervention froze the concept, showing that institutions can override fluidity. So while it supports fluidity in the process, the outcome is constrained by social factors. The user needs to highlight this tension—Copycat explains the pre-debate dynamics but not the resolution's top-down aspect.

