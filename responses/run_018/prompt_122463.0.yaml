prompt: |-
  I have to teach a single ninety-minute seminar on the guilt/shame contrast to first-year undergraduates in a moral psychology course. They will arrive with nothing assigned and with two things already in hand: the slogan that guilt targets what was done while shame targets the person who did it, and a strong intuition that shame is the suspect emotion because it depends on what other people think. Both of these need to be complicated rather than confirmed. I do not need the distinction explained to me; I need a plan for producing it in the room, and I need the plan to be an argument about dependency — what has to be true in their heads before the next thing can be said without distorting it.

  Here is what I want from you.

  1. The ordering, with the dependency stated at every step. I am torn between two opening moves and I cannot tell which the rest of the session rests on. The first is to make them see that shame survives the absence of any actual witness: the agent who is alone, unobserved, and still flinches. The second is to make them see the discharge asymmetry — that guilt arrives with a procedure for ending itself, namely confession, repair, punishment, and being forgiven, whereas shame has no such procedure and offers only concealment, counter-attack, or exit. I suspect the discharge asymmetry has to come first, because the closing question about which emotion a culture should cultivate only becomes askable once it is visible that one of these emotions can be retired when it has done its work and the other cannot. Tell me whether that is right, give me the full sequence in whatever order you defend, attach a time allocation, and under each step write one sentence saying what later step would fail if this one were skipped or reordered.

  2. One carrying case, with its specification. I want a single case introduced early and re-described two or three times as the apparatus thickens. My candidate is a small, deliberate, wholly hidden sabotage of a colleague's work, done years ago, never discovered, with nothing left at stake: no witness, no consequence, no repair that would change anything, and still an inability to think about it without wincing. Defend this or replace it. Either way give me the must-have and must-not-have list. I think it must contain no public exposure, since exposure would reattach shame to an audience and undo the first move, and it must not involve a grave wrong, since then the room will spend its energy arguing about whether the agent deserves to feel anything at all. Tell me what else belongs on both lists, what the case must be silent about, and mark the exact moments in the sequence at which it should be reopened and with which new description.

  3. The misconception map, keyed to the sequence. These are the ones I expect: that shame is fear of being found out; that guilt is the mature, private, liberal one and shame the childish, social, illiberal one; that shame is really about status and therefore not a moral emotion at all; that a shameless person merely lacks a social anxiety, when what may be missing is any grip on there being a standard; that guilt is safe because it attaches only to acts and so cannot metastasize; and that if shame is bad, a culture can simply decide to have less of it. Some of these I suspect I should use rather than defuse — tell me which, and at which point in the sequence. Two further items: someone will raise the observation that shame tips into humiliation and rage while guilt tips into repair, and I want that asymmetry given its place without the session turning into a verdict; and someone will have half-heard the anthropological contrast between cultures of guilt and cultures of shame, which I would rather deal with explicitly than have surface as a confused interruption in the last ten minutes.

  4. The closing question, which is where I think the session either earns its keep or collapses. My structuring thought is that cultures do not select emotions; they select practices — forms of public naming, exposure, apology, confession, anonymity, honor, and the architecture of punishment — and the emotional profile of a population is a byproduct of those practices rather than a choice anyone is in a position to make directly. If that is right, the teachable question is not which emotion we should prefer but which practices generate which emotional ecology, and what the substitution effects are. Build the final third of the session around exactly one substitution effect, stated as a mechanism rather than as a claim. My own candidate is that public exposure destroys the standing an offender needs in order to make the amends that would discharge guilt, so that a practice intended to intensify shame can end up manufacturing the shamelessness it deplores; take this, state it precisely enough to be argued with, or replace it with a better one and say why mine is wrong. Then tell me what I should openly decline to settle in ninety minutes. I assume that includes a verdict on which emotion is better, but I suspect there is something else I will be more tempted to settle and should not.

  5. One closing question to put to the room that separates a student who has the distinction from a student who has only memorized the slogan, together with a description of what a right answer that sounds wrong would look like, so that I do not mark it wrong in the moment.

  Format the response as numbered segments with timings and a dependency sentence under each, then the misconception map keyed to segment numbers, then the carrying case with its reopening points, then the closing question. Do not include readings. Keep the whole thing under a thousand words.
reasoning: |-
  Hmm, the user is preparing a 90-minute seminar on guilt vs. shame for first-year moral psychology students. They already have two preconceptions: guilt targets actions while shame targets the self, and shame is suspect because it depends on others' opinions. The user wants to complicate these ideas, not confirm them. 

  They need a structured plan with clear dependencies—each step must build logically on the previous one. I notice they're torn between two opening moves: demonstrating shame without witnesses vs. starting with the discharge asymmetry (guilt can be resolved through actions like repair, while shame leads to hiding or lashing out). The discharge asymmetry seems more foundational because it sets up why the emotion's resolvability matters culturally. If we start with shame without witnesses, students might still see shame as fundamentally social but internalized. The discharge aspect reveals a structural difference in how these emotions operate, which is crucial for later discussions about cultural practices. 

  For the carrying case, their sabotage example works well: hidden, no stakes, minor enough to avoid moral debates. Key requirements: no public exposure (to isolate shame from audience-dependence), not a grave wrong (to prevent distraction), and it must involve a deliberate act to trigger both emotions. It shouldn't have reparative options—that would muddy the discharge asymmetry. Reopening points should align with key insights: first when establishing shame's persistence without witnesses, then when contrasting discharge mechanisms, and finally when examining cultural substitution effects. 

  Common misconceptions need weaving into the sequence. For example, "shame is fear of being found out" can be dismantled when discussing the solitary sabotage case. The guilt/shame maturity hierarchy should surface during discharge asymmetry to show guilt's resolvability isn't inherently superior. The anthropological "cultures of guilt/shame" point must be addressed early to prevent late-session confusion—perhaps when introducing cultural practices. 

  The closing should focus on substitution effects in emotional ecologies. Their public exposure example is strong: exposing offenders to intensify shame might strip their standing to make amends, breeding shamelessness. This illustrates how practices unintentionally reshape emotions. The session must avoid verdicts on which emotion is "better"—that's reductive. Instead, emphasize designing practices for desired emotional outcomes. 

  For the final diagnostic question, something like "Can a shame-prone person resolve shame like guilt?" would test understanding. A right-but-wrong-sounding answer might be "No, because shame lacks discharge rituals," which seems dismissive but correctly identifies structural asymmetry. 

  Timings need tight calibration: discharge asymmetry (15 mins) enables shame without witnesses (10 mins), then carrying case applications (15 mins total across steps), misconceptions woven throughout, cultural practices (15 mins), substitution effect (15 mins), and closing Q&A (5 mins). Skipping discharge asymmetry would cripple later analysis of cultural practices, as the resolvability gap wouldn't be visible. 

  The user's deep need here is likely avoiding oversimplification. Freshmen might crave clear moral rankings (guilt good/shame bad), but the session must leave them comfortable with nuance—emotions as byproducts, not choices. The sabotage case and substitution effect serve this well by forcing entanglement. Also, they might fear students reducing shame to social anxiety; emphasizing its standard-upholding function counters that. 

  Structure will be: numbered segments with timings/dependencies, misconception map keyed to segments, carrying case details, then closing mechanics. Keep it lean—under 1k words.
answer: |-
  Here is the seminar plan structured for dependency, with timings and key elements integrated:

  **1. Sequence with Dependencies & Timing (Total: 90 mins)**  
  - **Step 1: Discharge Asymmetry (15 mins)**  
    *Activity:* Contrast procedures for resolving guilt (confession → repair → forgiveness) vs. shame (concealment → rage/exit). Use quick student examples.  
    *Dependency:* Without this, the cultural question (Step 7) lacks stakes. Skipping collapses the session into description, not analysis.  

  - **Step 2: Shame Without Witnesses (10 mins)**  
    *Activity:* Introduce carrying case (sabotage) → "Why wince *now*? No one knows!"  
    *Dependency:* If skipped, students default to "shame = fear of exposure," invalidating Steps 3-5.  

  - **Step 3: Shame Targets the Self (10 mins)**  
    *Activity:* Revisit sabotage: "Is your recoil about *the act* (guilt) or *yourself as actor*?" Highlight self-assessment ("*I* am petty").  
    *Dependency:* Skipping leaves "shame targets the person" as slogan, not lived experience.  

  - **Step 4: Guilt’s Metastasis Risk (10 mins)**  
    *Activity:* "If guilt attaches only to acts, why might unresolved guilt ('I never fixed it') become 'I am unforgivable'?" Sabotage case reopened.  
    *Dependency:* Without this, "guilt is safe" misconception persists, unbalancing Step 7.  

  - **Step 5: Shamelessness ≠ No Anxiety (10 mins)**  
    *Activity:* "Could someone feel *no* shame about the sabotage? What would that imply?" Contrast "no standard" vs. "no fear of exposure."  
    *Dependency:* Skipping conflates shamelessness with courage, undermining cultural analysis.  

  - **Step 6: Cultural Practices, Not Emotions (15 mins)**  
    *Activity:* Brainstorm practices cultivating guilt (restorative justice) vs. shame (public shaming). Connect to discharge asymmetry.  
    *Dependency:* Foundation for Step 7. Skipping reduces ethics to "prefer guilt."  

  - **Step 7: Substitution Effect (15 mins)**  
    *Activity:* Argue: Public exposure destroys standing to repair → offender *cannot* discharge guilt → entrenches shamelessness. Sabotage case: "What if exposed *now*? Could repair help?"  
    *Dependency:* Core payoff. Skipping leaves practices unexamined; session becomes taxonomy.  

  - **Q&A (5 mins)**  

  **2. Carrying Case Specification**  
  - **Case:** Deliberately misfiling a colleague’s important document (minor sabotage), unknown/unexposed, years ago, no reparative value.  
  - **Must-Have:** Minor harm (avoids desert debates), hidden (no audience), irreparable (discharge asymmetry clear), deliberate (activates self-assessment).  
  - **Must-Not-Have:** Public exposure, grave wrong, potential for meaningful repair.  
  - **Reopenings:**  
    - Step 2: "Imagine doing this *alone*. Why wince *now*?"  
    - Step 4: "Years later, does guilt about the *act* risk becoming shame about the *self*?"  
    - Step 7: "If exposed publicly *today*, could you discharge guilt? What replaces it?"  

  **3. Misconception Map (Keyed to Steps)**  
  - "Shame is fear of exposure" → **Step 2** (sabotage case has none).  
  - "Guilt=private/mature, shame=social/immature" → **Step 1** (discharge shows both have social roots; resolvability ≠ maturity).  
  - "Shame is about status, not morality" → **Step 3** (self-assessment in sabotage is moral: "I betrayed trust").  
  - "Shamelessness = no social anxiety" → **Step 5** (contrast "no standard" vs. defiance).  
  - "Guilt can’t metastasize" → **Step 4** (sabotage guilt → enduring shame).  
  - "Cultures choose emotions" → **Step 6** (practices → emotional byproducts).  
  - **Asymmetry tip (guilt→repair/shame→rage):** Use in **Step 1** as entry to discharge.  
  - **Anthropological "cultures of guilt/shame":** Address in **Step 6** → "These labels describe dominant *practices*, not emotional absence."  

  **4. Closing Mechanism & Limits**  
  - **Substitution Effect (Use yours):** "Public shaming denies offenders the social standing required to perform guilt-discharging repair (e.g., meaningful apology). This *manufactures shamelessness* by destroying pathways to moral recovery."  
  - **Why it works:** Shows practice → unintended emotional ecology.  
  - **Openly Decline to Settle:**  
    1. Whether guilt/shame is "better" (focus on ecologies).  
    2. *Whether shame has any functional role* (tempting to condemn entirely; leave as tension).  

  **5. Diagnostic Closing Question**  
  - **Question:** *"Could a person feel intense shame about the sabotage, yet no guilt? What would that look like?"*  
  - **Right-but-Wrong-Sounding Answer:** "Yes—if they believe '*I*'m rotten' but don’t focus on *what they did*." (Correct: isolates self vs. act targeting).  
  - **Why it Works:** Tests grasp of targeting (shame=self/guilt=act), not just discharge or privacy.  

  **Total Words: 998**
