  For the first part, I need to examine whether the sunk-cost logic from the dollar auction applies directly to group-level commitment. The dollar auction involves rational agents who keep bidding because each small bid increases their personal cost of withdrawing. But for group commitments, it's different. There's no clear winner-takes-all endpoint, and agency is spread across many members with different thresholds for exiting. This diffusion probably weakens the analogy because people aren't all acting as one unit; their motivations vary.

