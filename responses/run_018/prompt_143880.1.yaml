  The story will end with the stone in a beam of light, suggesting that if promises bind beyond death and accident, it transcends practical concerns. I'll make sure the word count stays between 600-900 words and avoid any resolution that favors law, utility or self-interest. I'll focus on creating vivid characters and letting their dialogue naturally explore these philosophical tensions while keeping the ending ambiguous and thought-provoking.
answer: |-
  ## The Unrotted Stone

  In the vaulted silence of the Aethelstone Archives, Archivist Sera traced the intricate whorls of a silica promise-stone. This one, labeled *Keldar-Verani Accord, Cycle 217*, was smooth, cool, and radiantly whole – a small, translucent marvel the color of twilight sea-glass. Three generations past, Jen Keldar had pressed this very stone into the palm of Toma Verani, forging a pact: the Keldars would steward the rare Sky-Moth groves on the Verani cliff-lands, ensuring their blooms fed the city’s luminous beetles, in perpetuity. The Verani, in exchange, granted access and a portion of the harvested beetle-silk.

  The silica stones, mined from a single, exhausted vein, were the Compact’s sacred anchors. Their integrity was law. They only decayed – crumbling into iridescent dust – upon the *intentional* breaking of the commitment they embodied. Accidents, misfortunes, even failures born of incompetence, left the stones untouched. The binding force resided in the *will*.

  Sera’s meticulous cross-referencing had unearthed an anomaly. Logs from Cycle 219 detailed a catastrophic rockfall triggered by an unseasonal deluge, obliterating the primary Sky-Moth grove. Toma Verani’s grandson, acting steward, had desperately tried to relocate the moths, but the delicate insects perished. The Keldars had failed spectacularly. Yet, the stone *here*, under her fingers, showed not the faintest flaw, no hint of the internal fracturing that signaled betrayal. It was as pristine as the day Jen Keldar carved her family sigil into its base.

  The failure was undeniable, catastrophic, and… accidental. No intent to breach. But the stone’s perfection was a silent scream in the archival quiet. If the binding force didn't require performance, nor even the *expectation* of performance (surely shattered by the rockfall), nor decay from accidental failure… what *did* it require?

  ***

  Sera summoned the descendants: Lira Keldar, whose family still carried the shame of the failed stewardship, and Elan Verani, whose lineage had lost a vital resource. They stood around the stone, displayed on black velvet under a focused beam of archival light. It glowed with an inner fire, oblivious to the tension.

  “It proves nothing was broken,” Elan stated first, his voice tight. He gestured at the flawless stone. “The Compact is clear. The stone decays only by *willful* breach. The rockfall was an act of the sky, the moths’ death tragic mischance. Jen Keldar’s intent, Toma Verani’s acceptance – *that* is what the stone binds. Not the moths, not the grove. The *commitment itself*. It persists.” He saw the promise as a direct, almost magical, normative thread spun between souls at the moment of exchange, independent of outcomes or changing circumstances.

  Lira Keldar bristled. “Persists? To what end? Look at the records! Your grandfather *expected* the moths. He relied on the silk! That expectation died with the grove. The heart of a promise is the trust it creates, the reliance. When the Sky-Moths vanished, so did the reason for the pact. The stone may not rot, but the mutual understanding that gave it life did. It’s an empty shell now.” For her, obligation lived and died with the shared expectations and reliance birthed by the promise.

  Sera interjected softly, drawn into the vortex. “But the stone endures. Our entire culture is built on this silica. Its decay signifies guilt, its wholeness signifies… integrity. The *convention* is the bedrock. We act *because* the stones work this way, because society functions on this understanding. To ignore the stone’s state because of external disaster… it unravels the Compact itself.” Her archivist’s soul clung to the system, the conventional practice that ordered their world.

  Elan nodded vigorously. “Exactly. And consider – this very stone,” he leaned closer, his shadow falling across it, “is now irreplaceable history. A relic of Jen and Toma. The Archive itself treasures it! Would you dishonor their memory, and diminish this artifact’s significance, by declaring the pact void? Its value as history demands we honor the form, even if the substance is… altered.”

  Silence followed. Sera felt the wrongness of Elan’s last argument coil in the air like cold vapor. *Historical value?* That was a reason to preserve the stone in a case, perhaps, not a reason to feel bound by the *promise* it represented. It was a reason of the wrong kind – supporting the action (honoring the pact) but utterly failing to capture the specific *normative force* a promise was supposed to carry: fidelity to one's word, loyalty to the bond created. It treated the pact like a museum piece, not a living obligation.

  Lira scoffed. “Honor their memory? Jen Keldar would weep to see us clinging to the *form* while the spirit lies buried under rock. And this ‘artifact’,” she gestured dismissively at the stone, “it proves only that the mechanism is flawed. It binds too little, or perhaps… binds something else entirely.”

  Sera looked from Lira’s pragmatic grief to Elan’s rigid adherence to form, then down to the stone. It sat in its pool of light, radiating quiet, enigmatic permanence. Jen and Toma were dust. The Sky-Moths were extinct. The cliff-lands were barren. The descendants stood divided by history and philosophy. The *accident* lay between them like a canyon.

  “And so,” Sera murmured, not to them, but to the stone, “if it binds… what binds it? What force resides in this silica that outlives groves and moths and the hands that exchanged it? A force untouched by failure, unmoved by shattered expectation, unsullied by accident… and unyielding even to time?”

  Elan believed he knew: the irreducible act of commitment itself. Lira heard only the echo of broken trust. Sera saw the terrifying weight of convention. The stone offered only its silent, perfect wholeness. It was beautiful, ancient, and utterly opaque. If the promise endured, it did so not as a chain of expectation, nor as a pillar of society, but as something else entirely – a ghost of obligation haunting the present, demanding recognition from the living for a bond forged by the dead, its power emanating from the cool, unyielding heart of the stone itself, shining in the archival light, indifferent to reason or ruin. The descendants stared at it, and at each other, across an abyss not of rock, but of meaning.
