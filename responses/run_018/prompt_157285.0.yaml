  I'm fiddling with ideas about algorithmic supply chains and it made me wonder about Project Cybersyn — Stafford Beer's telex setup in Chile that tried to manage factories in real time. Could you analyse that episode through the socialist caluclation debate? I want a careful mapping: in Cybersyn, what actually functioned as prices or signals, who held the dispersed knowledge Hayek talked about, and what Lange-style trial-and-error mechanisms were present. Then tell me where the theory misses: did the coup interupt the experiment before it could fail on calculation grounds, or was there a deeper problem with digitising tacit knowledge? And does this say anything about whether modern algorithms could do what Lange hoped? Keep it disciplined — say where the theory is silent rather than forcing it to speak.
