answer: |-
  Your concern cuts to the heart of the justificatory structure of indirect normativity. The distinction you draw between procedural and substantive idealization reveals a crucial ambiguity regarding the *source* of normative authority in idealized agent models. Below is a precise breakdown of the conceptual issues, settled points, and key areas of genuine disagreement.

  **Core Conceptual Tension:** The normative authority of the idealized prescription for the actual agent hinges on its being an *authentic expression of the actual agent's own practical identity*, just "corrected." Substantive idealization potentially severs this link by generating a prescription derived from a *different* practical identity (one meeting formal rational standards), even if inhabiting the same "structural position." This raises the question: If the idealized agent isn't *me*, why should *I* be bound by *its* conclusions?

  **What Must Be Settled Conceptually for the Indirect Link to Hold:**

  1.  **Continuity of Practical Identity:** For indirect normativity to be coherent, the idealized agent *must* be recognizably "me, corrected," not "someone else rational." The prescription must derive its authority *for me* from being the outcome of *my own* constitutive commitments, values, and attachments, subjected to ideal epistemic and rational conditions.
  2.  **Refinement vs. Replacement:** The idealization process must *refine* the actual agent's existing normative materials (values, commitments, attachments) by removing distortions (ignorance, inconsistency, irrational bias), not *replace* them with materials alien to the agent's practical identity, even if those alien materials are rationally superior in some abstract sense.
  3.  **Source of Authority:** The normative force flows *from* the actual agent's practical identity *through* the idealization process *to* the prescription. If the idealization injects substantive content not latent within or derivable from the actual agent's identity, the chain is broken. Authority then must come from elsewhere (e.g., objective reason, universal principles).

  **The Fate of Partial or Conflicted Commitments Under Idealization:**

  *   **Settled:** It is conceptually settled that non-ideal agents often have partial, conflicted, or inconsistent commitments. It is also settled that *some* level of idealization (e.g., removing simple logical inconsistency, resolving conflicts based on explicit higher-order commitments) *can* refine these without destroying practical identity.
  *   **Contested/Gray Area:** The crux of your concern lies here. Genuine disagreement exists on:
      *   **Depth of Conflict Resolution:** Can *fundamental, identity-constituting* conflicts (e.g., deep ambivalence about core values like career vs. family, or conflicting thick ethical commitments) be resolved by idealization *without* effectively replacing one commitment with another or imposing a resolution alien to the agent's pre-idealized self? Procedural idealization assumes "yes"; substantive critics argue such conflicts often necessitate a substantive choice the idealization makes *for* the agent, potentially altering identity.
      *   **"Refinement" vs. "Discovery":** Does idealization merely clarify what was already "in" the agent's identity (refinement), or does it reveal what the agent *should* value based on rationality itself, potentially *changing* their identity (discovery/replacement)? Substantive views lean towards the latter, especially concerning conflicts.
      *   **The Necessity of Elimination:** There is agreement that *some* commitments might be eliminated under idealization (e.g., purely instrumental desires based on false beliefs, blatantly inconsistent goals). Disagreement arises over whether identity-constituting but conflicted or partial commitments can *always* survive non-trivial idealization as recognizable refinements, or whether resolving deep conflicts inevitably involves loss or transformation significant enough to constitute replacement from the actual agent's perspective.

  **Philosophers' Genuine Disagreements:**

  1.  **Does Substantive Idealization Break the Link or Transform It?**
      *   **View A (Link Broken - Collapse into Direct Normativity):** (E.g., influenced by Williams' critique of external reasons, or certain Kantian critics) If the ideal agent's values/prescriptions differ substantively from what the actual agent could endorse even after maximal *procedural* refinement (e.g., removal of ignorance/inconsistency), then the prescription lacks authority *for that particular agent*. It becomes a direct rational or moral demand, not an indirect one derived *from her*. The "structural position" is insufficient for continuity of identity.
      *   **View B (Link Transformed - Spectrum of Idealization):** (E.g., some sophisticated Kantians, certain constructivists) Idealization exists on a spectrum. While pure substantive idealization might break the link, many accounts involve a *constrained* substantive element (e.g., assuming basic human needs, minimal rationality constraints) that still allows the prescription to be seen as an expression of a *generalized* practical identity relevant to the agent. The authority is still "indirect" but grounded in a more abstract conception of agency the agent *must* recognize herself as instantiating.
      *   **View C (Substantive Idealization *Is* Indirect for Some Accounts):** (E.g., some objective list or robust realist views using idealization heuristically) Certain theories might *define* the "true self" or "fully rational self" substantively. For them, the prescription *does* come from "me, corrected" – but "me" is defined by objective rationality or value, not my contingent actual commitments. Critics argue this simply redefines practical identity and begs the question against the procedural view.

  2.  **Is Preservation of Practical Identity Necessary?**
      *   **Disagreement:** Proceduralists (e.g., heirs to Humean subjectivism, certain forms of constitutivism) argue robust preservation is *essential* for genuine *agent-relative* normative authority. Others (e.g., Kantians, robust realists) argue that the demands of *rationality itself* or *objective value* provide sufficient authority, and the idealized agent is simply the vehicle for accessing these demands. The "indirect" label might still apply technically (mediated by the ideal agent), but the *source* of authority is direct (reason/value).

  3.  **Can Hybrid Models Work?**
      *   **Disagreement:** Do accounts that blend procedural and substantive elements (e.g., idealizing information and consistency but also requiring sympathy/impartiality, like some sophisticated Humean or contractualist models) successfully preserve a recognizable practical identity while generating normatively robust prescriptions? Or does the substantive element inevitably override or transform core identity-constituting commitments in ways that break the indirect link *for those commitments*? This is a major point of contention.

  **Broad Agreement:**

  1.  **The *Concept* of Indirect Normativity:** All parties agree that the *concept* involves deriving authority for an actual agent from the prescription of an idealized counterpart.
  2.  **Role of Epistemic/Irrationality Correction:** All agree that removing ignorance, logical inconsistency, and obvious cognitive biases (e.g., vividness bias) through idealization is essential and generally preserves identity (this is the "trivial" core of proceduralism).
  3.  **Problem of Deep Conflict:** All recognize that deep, identity-constituting conflicts pose a serious challenge for idealized models aiming to preserve practical identity.
  4.  **Distinction Exists:** There is broad recognition of a *conceptual distinction* between refining existing commitments/procedures (procedural) and imposing different substantive values/ends (substantive), even if the line is sometimes blurry in practice.

  **Conclusion:**

  The core unsettled question is: **Can non-trivial idealization (necessary to generate substantive normative guidance beyond simple consistency) simultaneously preserve an actual agent's practical identity *in a way that grounds normative authority specifically for her* and avoid collapsing into either (a) a mere procedural "tidying up" that leaves deep normative conflicts unresolved, or (b) a substantive imposition that breaks the link to *her* identity?**

  *   **Proceduralists** argue (a) is the lesser evil; preserving identity is paramount, even if it limits the scope of ideal normative guidance.
  *   **Substantivists** argue robust normativity requires accepting (b) or a transformed link (View B); the "corrected self" just *is* substantively different, and this is necessary for genuine normative authority.
  *   **Critics of Indirect Normativity** argue the tension reveals that indirect normativity *always* relies on a hidden substantive thesis about what the "true self" rationally must will, making the "indirect" aspect potentially illusory or unstable.

  Your conceptual work is vital in exposing this fault line. There is *no consensus* on whether substantive idealization breaks the normative link or transforms it into something else (like direct universalizability filtered through an ideal agent). This remains a fundamental and actively contested debate in metaethics and practical reason concerning the foundations of normative authority and the nature of the self.
