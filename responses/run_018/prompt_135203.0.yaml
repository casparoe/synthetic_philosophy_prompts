  Genuinely contested areas: Whether substantive idealization breaks the link or transforms it. Some argue it shifts to direct normativity, others see a spectrum. The necessity of preserving practical identity is debated. Hybrid approaches exist, but their viability is contested. Philosophers also disagree on how to handle identity-constituting commitments during idealization.

