  Please adopt the role of an expert in classical Chinese logic, comparative metaphysics, and the analytic philosophy of language. Before you answer, take a few moments to brainstorm the interpretive landscape: what are the main readings of Gongsun Long’s white-horse argument, how do they relate to the broader concerns of the School of Names (Mingjia), and where exactly do modern compositional semantics and theories of universals stand relative to these concerns?

  I am a PhD student in philosophy of language, currently working on issues of compositionality and reference. I have been studying Gongsun Long’s argument that a white horse is not a horse, and I keep running into what seems like an unavoidable global consequence. The argument, as I understand it, turns on a distinction between the universal form (horse) and the compound that includes both form and color (white horse). Because the two expressions have different intensions—one picks out only form, the other form plus color—they cannot be co-extensive or co-referential, hence the white horse is not a horse. But if this reasoning is sound, it looks like it should apply across the board: a red apple would not be an apple, a running person would not be a person, and any compound predicate would sever reference from its base category. So I have two related confusions. First, is the School of Names genuinely committed to this kind of sweeping failure of compositional predication, or is there a restricted logical or metaphysical framework—perhaps involving specific distinctions between common names and private names, or between particularized and unparticularized universals—within which the argument operates without generalizing? Second, if the argument is not meant to be global, why do so many commentators treat it as a deep puzzle about reference and categorization rather than as a localized reductio of a particular semantic theory? I want to understand whether the dialogue is best interpreted as attacking naive compositionalism itself, or whether modern semantics can absorb the point as a restricted claim about how particularized universals relate to their bare forms. Please think carefully about the mapping between the ancient distinction and contemporary theories of adjectives, universals, and reference, and correct any misunderstandings in my framing before addressing the substantive questions.
