answer: |-
  Your framing captures the core tension brilliantly—this *is* the central interpretive crux. Let me reconstruct the landscape systematically before addressing your specific questions.

  ### Core Interpretations of the White-Horse Paradox
  1. **Metaphysical Particularism (Strong Reading)**  
     *Thesis*: "Horse" refers to the bare universal (equinity). "White horse" refers to a particularized universal (whiteness-instantiated-in-equinity). These are distinct ontological types.  
     *Global Consequence*: Yes, this implies "red apple ≠ apple" universally.  
     *Support*: Gōngsūn Lóng's text: "Horse is that by which we name the shape; white is that by which we name the color. Naming the color is not naming the shape." (《白馬論》).  

  2. **Semantic Contextualism (Moderate Reading)**  
     *Thesis*: Terms have context-dependent extensions. "Horse" in isolation includes all horses; "white horse" restricts the domain. Co-reference fails because *intensions* differ.  
     *Global Mitigation*: Compositionality holds, but only under strict identity conditions (cf. Frege's *Sinn*).  
     *Support*: Mòzǐ's later critiques distinguishing "broadening" (kuò) vs. "narrowing" (xiá) of names.  

  3. **Pragmatic Dialectic (Weak Reading)**  
     *Thesis*: The argument exposes ambiguities in *social naming practices*, not metaphysics. It targets Confucian/Legalist assumptions about fixed reference.  
     *No Generalization*: Applies only to edge cases provoking linguistic confusion.  

  ### School of Names (Míngjiā) Broader Agenda
  - **Core Concern**: Rectifying name-reality correspondence (zhèngmíng 正名) to prevent social disorder.  
  - **Method**: Exposing contradictions in "hardening" names into rigid categories (akin to Russell's theory of descriptions).  
  - **Your Key Insight**: Míngjiā *deliberately* pushes arguments to absurdity to reveal latent ambiguities—but need not endorse the extreme conclusions as universal truths.  

  ### Modern Semantics: Mapping the Tension
  | Ancient Concept          | Modern Analog                          | Compatibility with Paradox |
  |--------------------------|----------------------------------------|----------------------------|
  | "Horse" (mǎ 馬)          | Natural kind term (Kripke) / Bare sortal | Vulnerable                 |
  | "White horse" (bái mǎ 白馬) | Intersective adjective-noun compound | Paradox arises if modifiers are non-restrictive |
  | Particularized universal | Trope theory (Williams) / Modifier-as-operator (Montague) | Paradox dissolves if "white" is subsective |
  | "Name" (míng 名)         | Fregean sense / Intension              | Paradox strengthened       |

  ### Addressing Your Questions
  **Q1: Is Míngjiā committed to global compositionality failure?**  
  *No*—but their method *simulates* this failure to expose deeper flaws. Consider:
  - **Logical Restriction**: The paradox relies on the *exhaustive identity* assumption (if A=B, then all properties of A are properties of B). This fails for phase sortals ("child" vs "adult") but holds for substance sortals ("horse").  
  - **Metaphysical Distinction**: Huì Shī's "contracting/loving all things" suggests *degrees* of unity. "White horse" is a "less real" unity than "horse"—a proto-theory of vagueness.  
  - **Semantic Escape**: Later Mòbiàn logic distinguishes "identical names" (tóngmíng) vs "identical referents" (tóngshí). "Horse" and "white horse" share reference but not sense.  

  **Q2: Why is it treated as a deep puzzle?**  
  Because it anticipates three modern problems:  
  1. **Non-intersective Modifiers**: If "white" were *privative* (like "fake"), "white horse isn't horse" becomes trivial. But whiteness is intersective—making the paradox startling.  
  2. **Compositionality Limits**: Fodor's "pet fish" problem—"pet fish" isn't prototypically fish-like. Gōngsún Lóng shows composition can alter *criterial features*.  
  3. **Vagueness of Generics**: "Horse" as a generic term (Carlson) vs. "white horse" as a specific subkind.  

  ### Synthesis: A Deflationary Resolution
  **Your PhD Project Insight**: The paradox isn't about *destroying* compositionality, but revealing its *preconditions*. Modern semantics absorbs it through:  
  - **Type-Shifting**: Partee's taxonomy—adjectives can be predicative ("is white"), intersective ("white horse"), or subsective ("skillful surgeon").  
  - **Kind Formation**: Chierchia's nominalization—"white horse" denotes a subkind *only if* whiteness is taxonomically relevant (cf. biological subspecies).  
  - **Metaphysical Gradience**: Armstrong's "partial identity" of universals—a white horse is *partially identical* to the horse universal.  

  **Corrective Note**: Your "particularized universal" framing is apt, but Gōngsūn Lóng operates pre-Aristotelianly—he lacks the matter/form distinction that would resolve "white horse" as form-in-matter. His brilliance lies in *exposing* this gap.  

  **Final Recommendation**: Interpret the dialogue as a *meta-semantic* critique: Naive reference-fixing ("point to horses") fails for complex concepts. Modern semantics answers by formalizing context-dependence (Kaplan) and dynamic predication (event semantics). The "sweeping failure" is avoided by recognizing that "horse" in "white horse" undergoes *coercion* to a subkind role—a move the Míngjiā intuited but couldn't formalize.  

  Would a diagram mapping the type-shifting operations or a comparison to contemporary adjective theories further aid your dissertation work?
