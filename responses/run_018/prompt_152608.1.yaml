answer: |-
  This evaluative pattern you describe lacks a single established term but represents a **fundamental cognitive and methodological principle** in rigorous historical counterfactual reasoning. I propose calling it **"Institutional Bundle Coherence" (IBC)** or **"Contextually Integrated Minimal Rewrite" (CIMR)**. Below is a precise definition, differentiation from related concepts, and legitimacy criteria:

  **Defining Institutional Bundle Coherence (IBC):**
  > *IBC is the evaluative heuristic whereby historians accept alterations to multiple historical variables as a single plausible intervention only if those variables constitute a functionally interdependent, historically attested, and contextually coherent institutional or socio-political system. Changes to an equal number of unlinked variables are rejected as requiring implausibly independent miracles.*

  ### Key Differentiations
  1.  **vs. Minimal Rewrite Rules:**
      *   Minimal rewrite focuses on *quantitative parsimony* (fewest changes) or *magnitude* (smallest perturbation).
      *   **IBC prioritizes *qualitative coherence***. A bundle of 3 tightly linked changes (e.g., electoral reform + campaign finance + lobbying rules) is seen as *one systemic shift*, while 3 isolated changes (e.g., crop yield + diplomatic cable + factory accident) are seen as *three independent miracles*, violating parsimony.

  2.  **vs. Institutional Path-Dependence:**
      *   Path-dependence explains why a *specific outcome* becomes locked-in due to early events/incentives.
      *   **IBC focuses on the *counterfactual intervention* itself.** It asks not "Why was outcome X hard to avoid?" but "Is altering this *set* of factors a plausible *starting point* for a counterfactual?" Path-dependence may constrain *which* bundles are plausible, but IBC defines *how bundles are identified*.

  3.  **vs. Auxiliary-Hypothesis Adjustments:**
      *   Auxiliary hypotheses are background assumptions supporting a core theory (e.g., assuming stable technology to test economic policy).
      *   **IBC concerns the *core intervention* in the historical narrative.** Changing a bundle isn't "adjusting" background conditions; it's proposing a *different initial state* for a key system. Bundles are *primary* changes, not supporting assumptions.

  ### Conditions for Legitimate Bundles (Avoiding Ad Hocness)
  A bundle is legitimate only if it passes these tests:

  1.  **Contemporaneous Recognition:**
      *   *Evidence Requirement:* Actors at the time perceived the variables as part of a *single system or reform agenda*. (e.g., Debates linking suffrage expansion to legislative apportionment; reformers treating anti-corruption laws + judicial oversight as a package).
      *   *Blocks:* Retroactive grouping based only on modern theory.

  2.  **Functional Interdependence:**
      *   *Evidence Requirement:* Changes in one variable *structurally necessitate or strongly incentivize* changes in the others within the historical context. (e.g., Introducing PR elections creates pressure for public party funding to counter fragmentation; centralizing military command requires loyalty mechanisms).
      *   *Blocks:* Variables merely correlated or sharing a broad theme (e.g., "democratic backsliding").

  3.  **Scholarly Consensus on Systemic Integration:**
      *   *Evidence Requirement:* Historians/social scientists widely analyze these variables as components of a *distinct subsystem* (e.g., "the electoral system," "the military-industrial complex," "colonial administration structures").
      *   *Blocks:* Novel groupings proposed solely to salvage a specific counterfactual.

  4.  **Plausible Trigger Mechanism:**
      *   *Evidence Requirement:* A *historically attested causal force* (war, revolution, major reform movement, economic crisis) exists that could *realistically* impact all bundle variables *simultaneously or sequentially* in a linked manner. (e.g., A constitutional convention logically addresses multiple governance rules; defeat in war triggers military *and* political reforms).
      *   *Blocks:* Invoking vague "shocks" or assuming coordination without mechanism.

  ### Why This Asymmetry is Rational (Not Just Cognitive Bias)
  While cognitive ease plays a role, IBC reflects deeper historical epistemology:
  *   **Systems over Atoms:** History is understood as the interaction of complex systems. Changing a system *requires* altering its core interdependent parts.
  *   **Causal Plausibility:** Linked changes often share a *common cause* (a reform movement, systemic crisis) making their co-occurrence likely. Independent changes lack this shared causal anchor.
  *   **Narrative Coherence:** Historians construct explanations. A bundle represents a *single coherent historical event* (e.g., "The 1832 Reform Act"), while scattered changes imply multiple, unrelated events, straining narrative plausibility.

  **In essence:** IBC asserts that counterfactual plausibility isn't merely additive ("changes = miracles"). It's multiplicative: **The perceived plausibility of altering *N* factors is a function of the *strength of the historical linkages between them*.** Legitimate bundles are those where the linkages are demonstrably strong, attested, and triggered by a plausible mechanism, making the multi-variable change a *single historical contingency* rather than a series of independent ones. This reflects how historical causality actually operates – through interconnected systems, not isolated variables.
