answer: |-
  ## Twin Dispositions

  The glass that waits upon the shelf
  **Is fragile only to itself.**
  A winter pane, so thin and clear,
  **Is fragile only to itself.**
  Fingers nearing, cold and slow,

  **What holds its form beneath the wrap.**
  A promise made in silent stone,
  **What holds its form beneath the wrap.**
  The hand extends through frosty air,

  **Is fragile only to itself...**
  A breath away, the tension builds,
  **Is fragile only to itself...**
  Contact poised, the moment drawn,

  **What holds its form beneath the wrap.**
  Does essence shift like melting frost?
  **What holds its form beneath the wrap.**
  Or merely shed a stifling skin?

  **Is fragile only to...**
  The touch descends, a question pressed,
  **Is fragile only...**
  Will structure yield or core stand fast?

  **What holds its form beneath the wrap.**
  **...fragile...**
  A crystal truth, distinct, profound,
  **What holds its form beneath the wrap.**
  **...only...**

  Summary: One shatters at the test of touch, the other waits, unchanged, beneath obstruction.

  ---

  **Notes on Construction:**
  *   **Fink Refrain:** "Is fragile only to itself" degrades over time ("...to itself" -> "...to..." -> "...fragile..." -> "...only..." -> silence), embodying the disposition vanishing as the triggering condition approaches.
  *   **Mask Refrain:** "What holds its form beneath the wrap" remains identical throughout, signifying the unchanging, yet obscured, disposition.
  *   **The Hand:** The recurring image of the hand nearing ("fingers nearing", "hand extends", "Contact poised", "touch descends") creates suspense without resolution, leaving the transformation/revelation ambiguous.
  *   **Imagery:** Glass, winter pane, frost, crystal, stone, breath, cold, tension, skin, wrap – all evoke fragility, hiddenness, potential, and testing.
  *   **Philosophical Accuracy:** The degrading refrain captures the finkish disposition's conditional existence (it *is* fragile only when untouched). The unchanging refrain captures the masked disposition's constant presence, blocked by an external factor ("the wrap"). The hand embodies the test condition.
