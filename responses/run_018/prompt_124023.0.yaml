answer: |-
  ### Exam Question  
  **(75 minutes; ~800 words)**  

  A crystal vase has two features:  
  1. An *internal shock-absorber* that instantly repairs any crack (a fink).  
  2. An *external foam wrap* that prevents shattering by absorbing impacts (a mask).  

  Assume the vase is struck by a hammer. The shock-absorber repairs any crack before it spreads, while the foam ensures no shattering occurs.  

  **Does this vase retain the disposition *fragility* (to shatter when struck)?** Critically evaluate using:  
  - **Martin’s conditional analysis** (as per the wire example): Does the stimulus (strike) cause the manifestation (shatter)?  
  - **Lewis’s reformed conditional account**: Would the vase shatter in the *closest possible world* where the strike occurs *and* the disposition is present?  
  - **Johnston’s intrinsic-property defense**: Is fragility intrinsic, and if so, do extrinsic interferers (foam/shock-absorber) negate the disposition?  

  Conclude: Does this compound case undermine all three views? If one survives, explain why. Finally, why does this matter for debates about whether dispositions must be intrinsic?  

  ---

  ### Model Answer (~600 words)  

  The vase’s compound interferers create a dilemma for dispositional analyses. Applying each theory:  

  **1. Martin’s conditional analysis** holds that fragility exists iff a strike *would* cause shattering. Here, the shock-absorber *finks* fragility: it alters the vase upon the strike’s occurrence, preventing cracks (the triggering condition for shattering). Thus, the strike never produces shattering, so Martin’s test deems the vase non-fragile. Yet intuitively, the vase *is* fragile—its microstructure remains unchanged—but the fink severs the causal link. Martin’s view fails because it reduces dispositions to stimulus-manifestation chains, which extrinsic interveners disrupt.  

  **2. Lewis’s counterfactual account** avoids Martin’s fink problem by testing fragility in the closest world where the vase is struck *and* retains its disposition. In such worlds, however, the *extrinsic foam wrap* still exists (as it’s not part of the vase’s intrinsic properties). The foam *masks* fragility: even if struck, the vase wouldn’t shatter. Lewis’s account thus judges the vase non-fragile. This is counterintuitive—the foam doesn’t alter the vase’s intrinsic brittleness—and shows Lewis’s reliance on extrinsic context makes dispositions overly sensitive to masks.  

  **3. Johnston’s intrinsic-property defense** argues dispositions like fragility are intrinsic: they supervene on microstructure, not extrinsic interferers. Here, the vase’s crystalline structure remains intact; the shock-absorber and foam are extrinsic additions. Johnston would insist the vase *is* fragile—the fink and mask merely prevent *manifestation*, not the disposition itself. This preserves intuitions but faces a problem: if dispositions never manifest due to interferers, can we meaningfully call them "real"? Johnston concedes interferers block manifestation but insists dispositions exist as intrinsic causal powers.  

  **Conclusion**: The compound case defeats Martin and Lewis but not Johnston. Martin’s analysis fails due to the fink (breaking the causal chain), while Lewis’s fails due to the mask (extrinsic context blocking manifestation in closest worlds). Johnston’s view survives because it decouples dispositions from their manifestation conditions, grounding them in intrinsics.  

  **Why intrinsicness matters**: If dispositions must be intrinsic (per Johnston), science can attribute stable causal powers to objects independent of context (e.g., defining "fragility" via atomic structure). Rejecting this (à la Lewis) makes dispositions context-dependent, undermining their explanatory role in metaphysics. The vase case thus forces a choice: either accept Johnston’s intrinsicality (prioritizing ontology over manifestation) or abandon dispositions as objective properties.  

  ---

  ### Marking Scheme (20 marks total)  
  **5 must-hit analytical moves** → **4 marks each**  
  *Botched moves* indicate common errors.  

  1. **Identify fink/mask mechanics separately**  
     - *Botched*: Conflating the shock-absorber (finks the *trigger*) and foam (masks the *manifestation*) as identical interferers.  
     - *A-grade*: Explicitly distinguishes the fink (prevents crack formation) from the mask (prevents crack-to-shatter progression).  

  2. **Apply Martin’s analysis correctly**  
     - *Botched*: Claiming Martin’s test "passes" because the vase *would* shatter *without* the shock-absorber.  
     - *A-grade*: Notes Martin’s test *fails*: the strike (stimulus) doesn’t cause shattering (manifestation) due to the fink.  

  3. **Apply Lewis’s account with similarity weighting**  
     - *Botched*: Assuming the "closest world" removes *both* interferers, letting the vase shatter.  
     - *A-grade*: Recognizes Lewis’s closest world keeps extrinsic masks (foam) but not intrinsic changes, so shattering is still blocked.  

  4. **Evaluate Johnston’s intrinsicality against interferers**  
     - *Botched*: Asserting Johnston’s view fails because the disposition never manifests.  
     - *A-grade*: Argues Johnston saves fragility by treating it as intrinsic; interferers prevent manifestation but don’t annihilate the disposition.  

  5. **Resolve the triad & intrinsicness implications**  
     - *Botched*: Concluding all theories fail, or missing why intrinsicness matters for scientific metaphysics.  
     - *A-grade*: States Martin/Lewis fail (finks/masks exploit their reliance on manifestation), Johnston survives, and explains why intrinsicality ensures dispositions are context-independent causal properties.  

  **A vs B differentiation**:  
  - **A (17–20)**: Hits all 5 moves; explicitly separates fink/mask mechanisms; notes Johnston’s survival hinges on *decoupling dispositions from manifestation*.  
  - **B (13–16)**: Hits 3–4 moves; correctly applies theories but conflates fink/mask; vague on why intrinsicness matters.
