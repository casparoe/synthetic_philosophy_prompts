  - Honesty about overlaps: Flag any indistinguishable positions. 

  The user's deeper needs seem pedagogical: They want students to self-diagnose their views through problem-solving, not theory recall. The "unnamed combination" request suggests they also want to stimulate critical gaps in the literature. British English is specified, so I'll use "labour" and "distributive" carefully. 

  Building the tree: 
  Start with the karoshi liability case (Node 1) as it forces a choice about worker autonomy vs. structural responsibility. This splits libertarian-leaning views from others. Next (Node 2), probe leisure's status—is it a "good" or just non-interference? This isolates Protestant ethics (leisure as indulgence) from distributive views. Then (Node 3), test the 35-hour cap: Does reducing hours improve welfare even with output loss? Social democrats say yes; efficiency-focused views say no. Finally (Node 4), ask if leisure should be distributed equally. This separates strict equality advocates from welfare-maximizers. 

  The "unnamed position" emerges logically: Leisure as a negative liberty plus protective state role. It's coherent but neglected—likely because pairing state intervention with non-entitlement feels inconsistent in mainstream discourse. Overlaps occur between welfare-driven social democracy and distributive justice if both support caps and redistribution, differing only in emphasis. 

  I'll frame the handout intro to show why taxonomy matters: It reveals how first principles shape policy stances. The tree format lets students trace paths without jargon. Naming positions only after the leaves avoids bias.
answer: |-
  Here is a decision-tree taxonomy for navigating normative commitments on labour, rest, and entitlement, designed for your seminar handout. Each branching node poses a concrete, principle-testing question derived from the root scenario. The leaves represent distinct positions, including the mandated ones and an unnamed combination. British English is used throughout.

  **Root Scenario:** A jurisdiction debates (1) legislating a 35-hour maximum working week, (2) classifying *karoshi* (death from overwork) as employer liability, worker autonomy, or structural inevitability, and (3) defining leisure as a distributive good, a recovery mechanism, or solely negative liberty.

  **Purpose of Taxonomy:** This tree helps you identify your underlying normative commitments by forcing choices on concrete cases. Your answers reveal which coherent position aligns with your intuitions about work, rest, responsibility, and the state's role, moving beyond labels to foundational principles.

  ---

  **The Decision Tree:**

  1.  **Node 1: Voluntary Overwork & Liability**
      *   **Claim:** *A worker who voluntarily and knowingly exceeds safe working hours (e.g., accepting excessive overtime for higher pay) forfeits any claim against their employer if they suffer harm (e.g., karoshi).*
      *   **If YES:** Proceed to **Node 2**.
      *   **If NO:** Proceed to **Node 3**.

  2.  **Node 2: The Moral Status of Leisure**
      *   **Claim:** *Leisure time (non-work time free from basic necessities) holds no intrinsic moral value or entitlement; it is permissible only insofar as it minimally enables work or is a private indulgence.*
      *   **If YES:** ➔ **Leaf A: Strict Protestant Work Ethic**
          *   **Core:** Work is inherently virtuous; leisure is indulgence or mere recuperation for more work. *Karoshi* is tragic but stems from individual virtue/misjudgement, not employer liability. Opposes state caps (35hr week) as infringing work ethic. Leisure isn't a "good" to be distributed or protected, just a negative liberty.
          *   **State Role:** Absent (minimal interference in contracts).
          *   **Leisure:** Negative liberty only (freedom from interference in private choice, no entitlement).
          *   **Karoshi:** Worker autonomy/choice.
          *   **35hr Cap:** Opposed (infringes liberty/contract/virtue).
      *   **If NO:** ➔ **Leaf B: Libertarian Autonomy**
          *   **Core:** Workers own their labour and risks. Free contracts are paramount. *Karoshi* is a tragic outcome of self-assumed risk (autonomy), not employer liability (absent explicit fraud/coercion). Opposes state caps (35hr week) as paternalistic interference. Leisure is a negative liberty (freedom *from* forced work), not a positive entitlement.
          *   **State Role:** Absent (enforce contracts, prevent fraud/force).
          *   **Leisure:** Negative liberty only.
          *   **Karoshi:** Worker autonomy/choice.
          *   **35hr Cap:** Opposed (infringes autonomy/contract).

  3.  **Node 3: Justification for Limiting Work Hours**
      *   **Claim:** *Capping working hours (e.g., 35hr week) is justified even if it demonstrably reduces total economic output, because the welfare benefits (health, rest, family time) outweigh the material loss.*
      *   **If YES:** Proceed to **Node 4**.
      *   **If NO:** ➔ **Leaf C: Welfare-Maximising Paternalism (Unnamed Combination)**
          *   **Core:** The state *can* protect workers from harm (including self-harm via exploitation/ignorance) to maximise overall welfare, *but* leisure is not an independent distributive good. *Karoshi* warrants employer liability as a workplace safety failure (like unsafe machinery). Supports the 35hr cap *only* if proven to increase net welfare (health, productivity, social stability), not if it causes net harm (e.g., severe unemployment/poverty). Leisure is a recovery mechanism for welfare, not a primary good.
          *   **State Role:** Protective (preventing harm, like safety regs).
          *   **Leisure:** Recovery mechanism (for welfare/health/productivity).
          *   **Karoshi:** Employer liability (safety failure).
          *   **35hr Cap:** Conditionally supported (only if net welfare gain).
          *   **Diagnosis of Gap:** Likely **neglected**. Combines state protection (common) with rejecting leisure as a distributive good or intrinsic entitlement (less common in protective views). May be seen as incoherent by those linking protection to positive entitlements or unattractive to both strict libertarians (too much state) and egalitarians (not focused on distribution).

  4.  **Node 4: Leisure as a Distributive Good**
      *   **Claim:** *Leisure time should be treated as a primary good (like income or opportunity) that ought to be distributed fairly across society, meaning state action to limit work hours is justified partly to secure this distribution, regardless of individual choices.*
      *   **If YES:** ➔ **Leaf D: Distributive Justice**
          *   **Core:** Leisure is a fundamental good essential for human flourishing and participation in society, akin to income or liberty. *Karoshi* exposes structural injustice (unequal bargaining power, economic coercion), warranting employer liability and state regulation. Supports the 35hr cap as securing a minimum leisure entitlement for all. Justification appeals to equality and fairness.
          *   **State Role:** Distributive (ensuring fair access to primary goods).
          *   **Leisure:** Positive entitlement / Distributive good.
          *   **Karoshi:** Employer liability / Structural injustice.
          *   **35hr Cap:** Supported (secures leisure entitlement).
      *   **If NO:** ➔ **Leaf E: Social-Democratic Regulatory**
          *   **Core:** The state must protect worker health, welfare, and dignity from exploitation inherent in unequal bargaining power. *Karoshi* is unequivocally employer liability. Supports the 35hr cap as a crucial protective floor to prevent harm, ensure recovery, and promote social welfare/family life, even accepting some output reduction. Leisure is a vital recovery mechanism and social good, but not primarily distributed *as* a distinct good like income. Justification is welfare and protection.
          *   **State Role:** Protective (securing health, safety, dignity).
          *   **Leisure:** Recovery mechanism & Social good (positive value, but instrumental to welfare/dignity).
          *   **Karoshi:** Employer liability.
          *   **35hr Cap:** Supported (protective necessity).

  ---

  **Key Distinctions Illustrated:**

  1.  **Leisure:** Negative Liberty (A, B) vs. Recovery Mechanism (C, E) vs. Positive Entitlement/Distributive Good (D).
  2.  **Justification:** Virtue (A), Autonomy (B), Welfare Maximisation (C), Welfare Protection/Dignity (E), Equality/Distributive Justice (D).
  3.  **State Role:** Absent (A, B), Protective (C, E), Distributive (D).
  4.  **Karoshi:** Worker Autonomy (A, B), Employer Liability (C, D, E).
  5.  **35hr Cap:** Opposed (A, B), Conditionally Supported (C), Supported (D, E).

  **Indistinguishable in Practice (Flagged):**
  *   **Leaf D (Distributive Justice) and Leaf E (Social-Democratic Regulatory) often converge practically** on supporting the 35hr cap and employer liability for *karoshi*. They diverge primarily in their **core justification** (equality/distribution vs. welfare/protection) and the **conceptual status of leisure** (primary good vs. vital mechanism). In many policy debates, this difference manifests as rhetorical emphasis rather than opposing votes. A strict distributivist (D) *might* push for even shorter hours or compensatory leisure for disadvantaged groups, while the social democrat (E) focuses on the protective floor. However, on the *specific questions* of the 35hr cap and *karoshi* liability, they agree. The tree separates them based on the theoretical commitment to leisure *as a distributable good* (Node 4).

  This taxonomy allows students to navigate from concrete judgements to foundational principles, revealing the logical structure of the debate without requiring prior theoretical knowledge.
