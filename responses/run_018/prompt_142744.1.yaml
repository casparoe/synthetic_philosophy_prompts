  #### **Level 3: Classify Irish Potato Famine & Great Leap Forward (GLF)**  
  *Options for each famine:*  
  - **EF:** Entitlement Failure (systemic collapse in access to food).  
  - **IC:** Informational-Cascade Breakdown (misinformation/distorted data causing policy errors).  
  - **ESC:** Extractive-State Crime (deliberate state extraction/neglect).  
  - **HYB:** Hybrid (mix of 2+ factors, e.g., EF + weather, or IC + ESC).  

  *Routes below show combinations for Irish/GLF classifications. Labels and awkward commitments are assigned per leaf.*

  ---

  ### **Branch A1: Bengal FAD + Agree with Sen**  
  *Diagnosis: Empty branch (incoherent).*  
  - Why? If famines are nature-driven (Bengal FAD), Sen's claim that democracy alone prevents them collapses—democracy can't stop natural disasters. Yet agreeing with Sen requires downplaying nature's role. No consistent position exists here.  

  ---

  ### **Branch A2: Bengal FAD + Disagree with Sen**  
  *Routes based on Irish/GLF classifications:*  

  - **A2-1. Irish = HYB (FAD-focused), GLF = HYB (FAD-focused)**  
    - **Label: Hard FAD Naturalist**  
    - Awkward commitment: Must insist the GLF famine was caused significantly by bad weather (despite overwhelming evidence that Mao's policies were central).  

  - **A2-2. Irish = ESC, GLF = ESC**  
    - **Label: Extractive-State Crime Theorist (FAD-Skeptical)**  
    - Awkward commitment: Must deny that Bengal's FAD was the main driver (contradicting Level 1) to frame it as British extractive crime, like Ireland or the GLF.  

  - **A2-3. Irish = EF/IC, GLF = EF/IC**  
    - **Label: Unnamed (Inconsistent FAD-Adjacent)**  
    - Awkward commitment: Must accept that Ireland's famine occurred under a democratic UK with a free press (weakening their disagreement with Sen), while blaming it on non-FAD factors.  

  ---

  ### **Branch B1: Bengal Entitlement Failure + Agree with Sen**  
  *Routes based on Irish/GLF classifications:*  

  - **B1-1. Irish = EF or IC, GLF = ESC or EF**  
    - **Label: Sen-Style Entitlementist**  
    - Awkward commitment: Must argue Ireland's famine wasn't a "true test" of Sen's thesis due to colonial disenfranchisement—even though the UK had a free press and democratic institutions.  

  - **B1-2. Irish = HYB, GLF = HYB**  
    - **Label: Weak Entitlementist**  
    - Awkward commitment: Must concede that nature contributed to Ireland's famine (e.g., potato blight), undermining the purity of Sen's entitlement-focused narrative.  

  - **B1-3. Irish = ESC, GLF = IC**  
    - **Label: Political Economy Hybrid**  
    - Awkward commitment: Must downplay the GLF's extractive intent (e.g., state grain seizures) to frame it as an informational breakdown—ignoring Mao's ideological drivers.  

  ---

  ### **Branch B2: Bengal Entitlement Failure + Disagree with Sen**  
  *Routes based on Irish/GLF classifications:*  

  - **B2-1. Irish = ESC, GLF = ESC**  
    - **Label: Extractive-State Crime Theorist**  
    - Awkward commitment: Must minimize the role of potato blight in Ireland to portray it as purely British extraction—contrary to historical consensus.  

  - **B2-2. Irish = EF, GLF = IC**  
    - **Label: Informational-Cascade Hybrid**  
    - Awkward commitment: Must assert that the GLF famine was caused by chaotic data flows (not malice), despite evidence of Mao's awareness of starvation.  

  - **B2-3. Irish = HYB, GLF = HYB**  
    - **Label: Contextual Opportunist**  
    - Awkward commitment: Must accept that Bengal had no significant FAD component (e.g., ignoring 1943 crop data) to maintain entitlement failure as universal.  

  - **B2-4. Irish = IC, GLF = EF**  
    - **Label: Unnamed (Asymmetric)**  
    - Awkward commitment: Must explain why Ireland's famine involved misinformation but not extraction (e.g., ignoring British grain exports), while the GLF was entitlement-based but not extractive.  

  ---

  ### **Diagnosed Issues**
  1. **Empty Branch (A1):**  
     - *Incoherent*: Agreeing with Sen requires famines to be political, but attributing Bengal to FAD treats it as apolitical. This forces contradictions like "democracy stops all famines except natural ones," which voids Sen's core claim.  

  2. **Indistinguishable Positions:**  
     - **B1-1 vs. B1-2 (Sen-Style vs. Weak Entitlementist):**  
       The tree cannot separate based *only* on GLF classification if Irish is EF/IC. Both may label similarly without the Irish/GLF hybrid distinction.  
     - **A2-1 vs. A2-3 (Hard FAD Naturalist vs. Inconsistent FAD-Adjacent):**  
       Overlap if Irish is HYB: Both attribute Ireland to nature, but the latter's non-FAD GLF classification blurs the line.  

  3. **Unexplored/Unattractive Combos:**  
     - **Bengal FAD + GLF Pure FAD:**  
       *Unattractive*: Requires ignoring the GLF's policy-driven horrors (e.g., forced collectivization) to blame weather alone—a fringe view contradicted by evidence.  
     - **Bengal Entitlement + Irish Pure FAD:**  
       *Incoherent*: Cannot logically blame Bengal on politics while attributing Ireland (a comparable colonial case) to nature without abandoning consistency.  

  ---

  ### **Tree Summary**
  - **Key Labels:**  
    - Hard FAD Naturalist (A2-1): Nature dominates.  
    - Sen-Style Entitlementist (B1-1): Democracy prevents politics-driven famine.  
    - Extractive-State Crime Theorist (A2-2, B2-1): Famine as intentional state violence.  
    - Informational-Cascade Hybrid (B2-2): Misinformation enables disaster.  
    - Contextual Opportunist (B2-3): Hybrid causes, but politics primary.  
  - **Weakest Branches:** A1 (empty), A2 (strained by GLF), B1 (strained by Ireland).  
  - **Debate Core:** Positions fracture on whether famines are "natural" vs. "political," with Sen's democracy claim as the litmus test. Hybrid classifications soften extremes but create new tensions.  

  This taxonomy isolates logical commitments, exposing where evidence must be contorted to sustain a view. Use it to map your roommate's stance!
