prompt: |-
  I'm running a 50-minute session for second-year philosophy students who've done a bit of epistemology but haven't touched higher-order stuff yet. The topic is higher-order evidence and epistemic akrasia. I don't want to use the tired sleeping-expert scenario, so I'm building it around a niche case I made up: Dr. Lena runs a clinical trial, but she gets a meta-analysis showing that her own statistical reasoning is systematically overconfident by about 15 percent — except the meta-analysis was conducted using the exact same statistical framework she's now doubting. I need a teaching plan, not the lecture itself. What conceptual dependancy has to be locked in first (first-order vs second-order belief? the distinction between evidence and reliability?) and in what order? How should I sequence the pieces so the circularity in Lena's situation feels like a real problem rather than a logic puzzle? What's the carrying example — my Lena case, presumably — and what does it need to include and what should I strip out compared to the sleeping expert? The misconceptions I expect: that she should just split the difference between her original belief and the meta-result, that this is just hypocrisy with extra steps, that higher-order evidence is always about self-doubt. Where exactly in the arc should I head off each one? What's a good end-of-session check that shows they've understandng why akrasia here isn't irrationality but something weirder? And what should I openly refuse to cover at this level — maybe formal frameworks? — and say so. Also, why is the sleeping expert actually a bad carrying example for this audience, and what pitfall does Lena avoid?
