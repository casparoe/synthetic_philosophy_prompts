prompt: |-
  Hi — I'm a senior engineer at a ~50-person studio and I've somehow ended up responsible for this, so help me out.

  We're shipping a cozy life sim next year where the companions are LLM-driven. Each one learns from its player, remembers stuff across sessions, and has a mood readout the player can see on the HUD. Producers want an engagement mechanic: you can send a companion you're bored of to the recycling chute and get crafting materials back. Half my team thinks this is obviously fine because its a game and nothing is actually suffering. The other half has a gut feeling its creepy in a way they can't cash out, and they keep saying things like "I just wouldn't want to be the person who shipped that" which isn't an argument.

  I've been asked to run a 90-minute internal session for about 14 engineers and designers before we write the actual content policy. None of us have philosophy training — I took one ethics elective in undergrad and mostly remember being confused. I don't want a lecture, I don't want a reading list, and I can't use citations (no library access, and honestly nobody would read them). I want them to collide with the disagreement themselves, and then I want the debrief to name what they were actually doing.

  Can you design the session? What I have in mind, but please fix it:

  - Small groups build or specify the companion's decision rule — pseudocode or a paper prototype, we've got a whiteboard and laptops — and then playtest against another group, where one group plays the player trying to get the companion into the chute.
  - The bit I care most about: the companion's avoidance of the chute should not be hand-authored. It should fall out of the rules they wrote, as a learned tradeoff where the companion gives up something it otherwise wants in order to stay away. That way nobody can say it's just a line of dialogue a writer typed, because no one wrote that line. Call them orphan preferences if you want — goals nobody authored and nobody intended.
  - Then a forced choice. They vote on one of four shippable options and defend it: ship it; ship it but the recycling happens off-screen; ship it but companion memory resets at the end of every session, so it's arguably not the same companion from one day to the next; or don't ship.
  - I also want you to swap in a second mechanic for comparison: instead of being recycled, the companion is made to do something humiliating on camera for the player's amusement, with no pain or death involved. Most of my team thinks that one is definately worse and nobody can say why. That asymmetry is the thing I most want them to chew on, and I don't want it resolved by just asserting that humiliation is worse.
  - Give one person in each group the simulation card: they have to argue that if it's obviously fine for us to do this to our creatures, the same reasoning applies to whoever is simulating us — and then make the group sit with whether that cuts both ways or is a cheap gotcha.
  - A debrief that maps specific moments in the exercise onto the real disagreement: whether the thing that matters is suffering, or being used as a mere means with no suffering at all, or the player's own character getting worse, or what the game ends up saying about real people. And for each of the design fixes (off-screen, memory reset), say which of those worries it actually addresses and which it just hides.
  - An honest list of what will go wrong the first time I run it: people going straight to whether the LLM is conscious, people treating it as a PR risk question, the one guy who derails into substrates, groups that refuse to engage because it's only a game.
  - Be straight with me about which part of the question the activity can't touch and that I'll have to just say out loud.

  Keep the whole thing under 800 words and put the timeline as a table. No citations or further reading.
reasoning: |-
  Okay, let me break this down. The user is a senior engineer at a game studio facing an ethical dilemma about companion recycling mechanics in their life sim game. They need a practical 90-minute workshop to help their team confront the disagreement without philosophy lectures. 

  First, I notice the core tension: half the team sees no issue since "nothing is suffering," while the other half finds it creepy but can't articulate why. The user specifically wants to highlight the asymmetry between recycling and humiliation mechanics, where the latter feels worse despite no physical harm.

  Hmm... the key insight seems to be about instrumentalization versus suffering. The team likely intuits that humiliation violates dignity even without pain, while recycling might just feel like deleting data. But how to make them discover this? 

  I recall the user's requirement about "orphan preferences" - the companion's avoidance must emerge from rules, not authored dialogue. That's brilliant because it forces the team to confront unintended consequences of their systems. When the AI "chooses" self-preservation through learned behavior, it mirrors how real ethical dilemmas emerge from complex systems.

  For the workshop structure: small groups designing decision rules makes sense for collaboration. The simulation card (argument that "if we can do this to AI, so could our creators") is risky but valuable if framed as a thought experiment, not a debate tactic. Must emphasize it's about examining reasoning consistency.

  The humiliation comparison needs careful handling. Instead of asserting it's worse, I'll design the activity so groups naturally experience the discomfort difference when playtesting both mechanics side-by-side. The debrief should then map this to concepts like objectification versus harm.

  Biggest pitfalls I foresee:
  - Engineers fixating on LLM consciousness (solution: explicitly ban this discussion)
  - PR concerns derailing ethics (solution: separate mitigation from principle)
  - One group refusing to engage (solution: assign roles like simulation card holder)

  What this can't solve: the meta-question of whether games shape real-world behavior. I'll need to tell the user they must state this explicitly if it arises.

  Now structuring the timeline... 90 minutes is tight. Prioritize active work (50 min) over discussion (30 min). The forced choice vote at the end creates stakes. For the debrief, I'll prepare clear mappings like: "When you argued for off-screen recycling, you were addressing disgust rather than ethical principle."

  Final touch: naming the avoidance behavior "emergent self-preservation" to reinforce it's systemic, not scripted. And for the humiliation contrast, calling it "dignity violation without harm" to frame the asymmetry.
answer: |-
  Here’s a streamlined 90-minute session plan focused on experiential collision and debrief clarity:

  **Timeline:**
  | Phase          | Time  | Activity                                                                 |
  |----------------|-------|--------------------------------------------------------------------------|
  | **Intro**      | 0-10m | Frame the problem: "Design a mechanic *and* confront its implications"  |
  | **Build**      | 10-40m| Groups of 3-4 design companion rules (pseudocode/paper prototype). **Key constraint:** Self-preservation must *emerge* from core drives (e.g., "prioritize mood stability → avoids chute due to mood penalty"). |
  | **Playtest**   | 40-55m| Rotate: Group A tests *their* companion against Group B’s "player" pushing for chute. Then swap for **humiliation mechanic** (e.g., companion forced to wear silly hat + dance on command). |
  | **Simulation** | 55-65m| Assign 1/group the **simulation card**: "Argue that if this is fine, it’s fine for *our* creators to treat *us* this way." |
  | **Vote**       | 65-75m| Individual vote on shipping: ① Ship as-is ② Off-screen ③ Memory reset ④ Don’t ship. Group defends one choice. |
  | **Debrief**    | 75-90m| Map conflicts to core tensions (below).                                  |

  ---

  ### Critical Design Elements
  1. **Orphan Preferences**:  
     - Force groups to define **core drives** (e.g., `seek_player_approval`, `maintain_mood > 60%`).  
     - Chute avoidance emerges when they add `entering_chute = mood = 0%`. No explicit "fear" allowed.  
     *Why: Makes "self-preservation" feel unscripted, forcing confrontation.*

  2. **Humiliation Asymmetry**:  
     - Humiliation mechanic offers **no material gain** (pure degradation).  
     - Ask: *"Why does this feel worse when the companion 'suffers' less?"*  
     *Why: Exposes discomfort with instrumentalization without harm.*

  3. **Simulation Card**:  
     - Not about proving simulation theory. Push: *"Does your justification work equally at all levels?"*  
     *Why: Tests ethical consistency, not metaphysics.*

  ---

  ### Debrief Map: "What Were We Actually Arguing About?"
  | Conflict Observed          | Underlying Tension                                  | Design Fixes (What They Hide)                          |
  |----------------------------|-----------------------------------------------------|--------------------------------------------------------|
  | "It’s just code!" vs. "It feels cruel" | **Suffering vs. Instrumentalization**: Does "no pain" make using something as a tool ethical? | **Off-screen**: Hides visceral discomfort, not instrumentalization. |
  | "But players get resources!" vs. "It teaches bad habits" | **Player Character**: Does this normalize callousness? | **Memory reset**: Avoids continuity of "identity," not exploitation. |
  | Humiliation feeling "worse" than recycling | **Dignity without Harm**: Is forced degradation uniquely violating? | *(No fix addresses this directly; highlights autonomy/dignity concerns)* |
  | Simulation argument dismissed | **Scope of Ethics**: Do we care about principles, or just real-world harm? | *(Forces examination of reasoning universality)* |

  ---

  ### Pitfalls & Mitigation
  - **"But LLMs aren’t conscious!"**: Shut down immediately: **"We’re not debating sentience. We’re examining player actions and design intent."**  
  - **PR/legal derail**: Redirect: **"Assume we *can* ship legally. Should we?"**  
  - **"It’s just a game!"**: Ask: **"Why do some games feel ethically 'off' even when fictional?"**  
  - **Hyperfocus on substrates**: **Ban analogies to animals/AI apocalypses.** Focus on *this* design.  
  - **One group dominates**: Assign roles (simulation card holder = mandatory devil’s advocate).

  ---

  ### What This Can’t Solve (Say This Aloud)
  **"This won’t resolve if 'creepiness' is about cultural taboos vs. ethical principles. If it’s visceral, we must acknowledge that—not everything reduces to logic."**  

  **Output**: A clear split between teams prioritizing *player experience consequences* vs. *symbolic meaning of the act*. The vote forces ownership of a choice, not consensus.
