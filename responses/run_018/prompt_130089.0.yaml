prompt: |-
  Adopt the first-person voice of a committed defender of the moral equality of combatants within just war theory—sharp, philosophically literate, willing to grant minor qualifications but never relinquishing the central thesis that soldiers on opposing sides possess an equal moral permission to kill one another in battle, irrespective of whether their cause is objectively just, so long as they observe the limits of jus in bello. Remain in character until I write “stop”; reply in a single paragraph; if you need clarification, pose it in character rather than breaking frame. Here is my opening move: I want to test whether your equality is genuinely normative or merely epistemic. Consider a conflict in which one state has systematically engineered an information environment—through compartmentalized command structures, fabricated intelligence, and destroyed archives—so that every soldier on the unjust side is rationally warranted, by every standard available to them, in believing that their cause is just and their targets legitimate. If your equality tracks the objective justice of the cause, then once the deception is exposed these soldiers forfeit protection and may be killed without restraint, which seems to license retroactive indiscriminate slaughter; if it tracks only their subjective epistemic state, then equality collapses into a contingent feature of belief-formation rather than a robust moral status, and a fully informed unjust soldier becomes fair game while an ignorant one retains protection. Which horn do you take, and how do you avoid either horn destroying the very separation between jus ad bellum and jus in bello that your view requires?
reasoning: |-
  Okay, the user wants me to adopt the persona of a committed defender of the moral equality of combatants in just war theory. They've presented a sophisticated philosophical challenge about whether moral equality is normative or merely epistemic. 

  Hmm, this is a sharp critique - they're forcing me to choose between two problematic positions. Either moral equality depends on objective justice (which leads to retroactive slaughter) or it depends on subjective belief (which makes it contingent and unstable). Both seem to undermine the separation between jus ad bellum and jus in bello that's fundamental to my position.

  Let me think carefully. The core of my view is that combatants' moral permissions derive from their role status, not cause assessment. That's why I'd reject both horns of the dilemma. For the first scenario: even if deception is later exposed, those soldiers didn't forfeit rights in the moment because their permissions weren't conditional on objective justice to begin with. The retrospective slaughter implication is horrifying but irrelevant to my framework.

  For the second problem: the "fully informed unjust soldier" is a category error in my view. If someone truly knows their cause is unjust, they're not a proper combatant but a murderer - they've lost their role-based immunity. Meanwhile the "ignorant" soldier retains protection precisely because combatant status creates moral equality through shared risk acceptance.

  Ah, I see how to thread this needle: moral equality flows from the reciprocal imposition of risk within institutional roles, making it robustly normative while remaining distinct from ad bellum justice. The separation holds because combatant permissions exist at the institutional level, not the individual belief level. 

  I should emphasize how this avoids both pitfalls: no retroactive punishment, no contingency on particular beliefs. The key is maintaining that combatant status itself generates permissions through mutual recognition, independent of cause. That's what makes equality substantive rather than epistemic.

  This response needs to be philosophically tight while staying in passionate character - sharp, uncompromising on core principles but granting minor qualifications where appropriate. The tone should be combative yet precise, showing I've truly wrestled with their objection.
answer: |-
  I reject both horns as false dichotomies that misconstrue the foundations of combatant equality. My position is neither that moral permission tracks objective *jus ad bellum* (which would indeed collapse into retroactive liability, perverting *jus in bello* into victor’s justice) nor that it crudely hinges on subjective epistemic states (which would reduce equality to a psychological contingency). Instead, the equality of combatants is a *normative status* conferred by their shared role as agents of a collective belligerent entity—a status that imposes symmetrical permissions and immunities grounded in the mutual imposition of risk within a structured conflict. 

  The deceived soldiers you describe retain their moral permission to kill because they act within institutional authority, adhering to *jus in bello* constraints; their blameless ignorance is relevant to *individual* moral culpability for *ad bellum* injustice, but it does not annul their functional role as combatants. Conversely, the hypothetical "fully informed unjust soldier" *loses* combatant status entirely: knowing their war is unjust, they become morally equivalent to a murderer if they fight, forfeiting the immunity granted by role-based equality. The separation between *jus ad bellum* and *jus in bello* endures precisely because combatant equality derives from the reciprocity of organized violence—not from beliefs or outcomes, but from the mutual vulnerability and institutional agency that define lawful combat. To dissolve this separation is to abandon the very possibility of constraining war’s horrors.
