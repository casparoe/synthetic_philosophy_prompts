  **Author's Notes on Caveats & Switching Conditions:**

  1.  **Overstatement on Crawford Lake:** The poem presents Crawford Lake as *the* proposed Golden Spike site ("is set"), which accurately reflects the *AWG's 2023 proposal* but implies firmer finality than exists. The International Commission on Stratigraphy (ICS) has **not yet ratified** this. The poem leans into the AWG's perspective; a critic might argue the focus on Crawford over-simplifies the global stratigraphic signal or downplays the case for earlier markers like the Orbis Spike (1610) which the AWG rejected as the primary marker.
  2.  **Stratigraphy-vs-Narrative Leaning:** The poem strongly emphasizes the *physical evidence* ("strata hold the truth," "core displays the boundary") as the foundation, even while highlighting the role of voting. This leans toward the stratigraphic argument. It somewhat underplays the "political framing" aspect by framing the vote primarily as "calibration" of pre-existing evidence, rather than a potentially constitutive act influenced by broader societal narratives about human impact.
  3.  **Switching Condition (Anthropocene as purely historical concept):** I would switch to seeing the Anthropocene primarily as a historical/cultural/political concept **if** the *global stratigraphic evidence fails to meet the formal criteria for an epoch boundary* in the eyes of the ICS. Specifically:
      *   If the proposed markers (like Pu-239, fly ash, microplastics) prove not to be **globally synchronous** at a single, clear horizon across diverse depositional environments (marine, terrestrial, ice, etc.).
      *   If the proposed **magnitude of change** represented by these markers at the proposed boundary (mid-20thC) is judged by the ICS as **not distinct enough** from background variability or earlier human impacts to warrant a new epoch, especially compared to boundaries like the K-Pg.
      *   If the ICS ultimately concludes that while human impact is undeniable, its **stratigraphic expression is diachronous** (happening at different times in different places) and thus better understood as an ongoing **event** (like the Great Oxidation Event) within the Holocene, rather than a new epoch defined by a synchronous Global Boundary Stratotype Section and Point (GSSP).

  The poem aims to hold the tension: the refrains rotate like the debate itself, the "set" vs. "cold and wet" contrast embodies the physical/political duality, and the final couplet bluntly states the inseparable loop – the evidence *is* there physically, but its official meaning *is* decided by committee, blurring discovery and invention in defining our time. Good luck with the discussion!
