prompt: |-
  You are a professional philosopher of ethics with some background in museum studies, and I want you to think carefully—start with a quick brainstorm of the conceptual traps—before you build anything practical.

  I'm on the board of a public memorial musem and we keep getting proposals that rank or compare mass atrocities to justify exibit sizes, funding splits, or plaque wording—things like "this gallery should be 30% smaller because the death toll was lower" or "this event was more bureaucratic so it belongs in the systems section not the human suffering section." We need a reusable decision proceedure my board can run in about 20 minutes per proposal, without turning us all into philosophers. Ground it in whatever philosophy actually knows about comparing evils—moral incommensurability, quantitative vs qualitative comparison, the specific harm comparison does to survivors and descendants—but translate it into a checklist with ordered tests, clear stop points, and flags for admissible, inadmissible, or needs-judgment. Don't ask me to read anything; this has to work for people with no web access and no philosophy training.

  Please answer in these sections, in this order:

  1. Conceptual brainstorm (about 150 words): the main pitfalls and the distinctions that must survive in the procedure, including one niche idea—maybe something about dimensional asymmetry or comparative moral density—that goes deeper than the usual "you can't rank suffering" line.
  2. The decision proceedure itself (about 400 words): step-by-step in plain language, with the questions in order, what counts as yes/no/maybe, the hard cases, and the halt point where we say "do not compare." Include a small set of test sentences or criteria the board can apply directly.
  3. Three worked cases (about 500 words): (a) comparing death tolls of the Rwandan genocide and the Cambodian genocide to decide exhibit square footage; (b) comparing the bureaucratic structure of the Holocaust and the Atlantic slave trade for a "systems of violence" gallery; (c) comparing victim suffering across two events for a memorial plaque. One should give an answer the board won't like. Walk through the steps exactly.
  4. Limits, misfires, and judgment calls (about 200 words): where the proceedure definitely fails, which steps are just judgment dressed up as rules, and which proposals should get kicked upstairs to an ethics committee.

  Keep it somewhat in the weeds but don't lean on super obscure theories a small model wouldn't have properly memorized. No bibliography, no reading list, no citations—just the tool.
reasoning: |-
  Okay, the user is on the board of a public memorial museum and needs a practical decision procedure for handling proposals that compare atrocities. They want something grounded in ethical philosophy but usable by non-philosophers in under 20 minutes. 

  First, I need to unpack why this is ethically fraught. Comparing atrocities risks instrumentalizing suffering by turning it into metrics for resource allocation. There's also the problem of dimensional asymmetry—different atrocities have distinct qualitative dimensions (intentionality, bureaucracy, cultural destruction) that can't be reduced to a single scale. Survivor harm is key too; comparisons can retraumatize by implying hierarchies of victimhood. 

  For the procedure, I'll adapt philosophical concepts into clear tests. Moral incommensurability means we need early stopgates—like checking if comparison serves educational purpose or just administrative convenience. Nussbaum's "objects of interpretation" idea helps frame "what's actually being measured?" to expose category errors. 

  The three cases are illuminating. Death tolls for space allocation fails immediately—it's pure instrumentalization. Bureaucratic systems comparison might pass if focusing on mechanisms not suffering. Victim suffering comparison is the hardest; even with qualitative framing, it risks false equivalence. That's where the procedure should say "no" even if unpopular. 

  I'm making the halt points unambiguous: if Step 1 (purpose) is administrative expediency, stop. If Step 3 (survivor impact) flags potential harm, stop. The test phrases ("Did X cause Y?") are crude but force specificity. 

  Limitations: The "educational necessity" judgment in Step 1 is still subjective. And when qualitative dimensions are genuinely comparable (like systemic bureaucracy), the procedure permits it—but boards might dislike that nuance. That's why Case C (suffering comparison) gets blocked; no educational gain outweighs the harm risk. 

  Ultimately this tool prioritizes "do no harm" over false precision. It won't satisfy everyone, but it forces explicit ethical reasoning.
answer: |-
  ### 1. Conceptual Brainstorm (145 words)  
  Core pitfalls: **Instrumentalization** (treating suffering as data for resource allocation), **dimensional asymmetry** (atrocities differ in *kinds* of harm—bureaucratic, intimate, cultural, intergenerational—that resist scalar comparison), **moral residue** (comparisons imply tacit justification of "lesser" evils), and **narrative displacement** (reducing events to metrics erases lived experiences).  

  Key distinctions:  
  - **Quantitative vs. qualitative harm**: Death tolls ≠ suffering intensity (e.g., torture’s longevity vs. scale).  
  - **Purpose**: Is comparison *educational* (revealing unique mechanisms) or *administrative* (allocating resources)?  
  - **Survivor ontology**: Harm isn’t archival; it lives in descendants. Ranking violates their ongoing reality.  
  **Niche insight**: **Comparative moral density**—the ethical weight per unit of analysis (e.g., one genocidal policy may concentrate more *types* of harm—erasure, torture, cultural annihilation—than another). Dense events resist decomposition for fair comparison.  

  ### 2. Decision Procedure: The 5-Step "HALT" Test  
  **HALT after any "no" or "unclear."**  
  *(Time: 2 min/step)*  

  | Step | Question | Yes/No/Unclear | Action |  
  |------|----------|----------------|--------|  
  | **1. Purpose** | "Is this comparison *strictly necessary* to advance *specific* visitor education about *how* atrocities occur (e.g., systemic patterns), NOT to allocate resources/space?" | **Yes**: Proceed. **No/Unclear**: HALT. *Inadmissible*. | *Test phrase: "We’re comparing X and Y to show visitors ______ about mechanisms, not ______."* |  
  | **2. Dimension Match** | "Are we comparing *identical qualities* (e.g., bureaucratic structures), NOT suffering/death tolls?" | **Yes**: Proceed. **No**: HALT. *Inadmissible*. **Unclear**: Flag for judgment. | *Test: "Did X and Y both use ______? (e.g., standardized paperwork)"* |  
  | **3. Survivor Harm** | "Would survivors/descendants of *both* groups plausibly see this as respectful? (Consult pre-established community guidelines.)" | **Yes**: Proceed. **No**: HALT. *Inadmissible*. **Unclear**: Pause for ethics review. | *Test: "This comparison doesn’t imply ______ was ‘worse’ or ‘lesser.’"* |  
  | **4. Asymmetry Check** | "Does one event’s *moral density* (scale + duration + cultural erasure + intent) overwhelm the other?" | **No**: Proceed. **Yes/Unclear**: HALT. *Needs judgment*. | *Test: "Can we discuss X without Y seeming simple?"* |  
  | **5. Framing** | "Can we present them as *distinct case studies* (not ranked) using neutral framing?" | **Yes**: *Admissible* with oversight. **No**: HALT. | *Test: "Gallery title: ‘Two Systems,’ not ‘Scale of Evil.’"* |  

  **HALT = Stop. Do not compare.**  

  ### 3. Worked Cases  
  **Case A: Rwandan vs. Cambodian genocide death tolls for exhibit size**  
  - Step 1: **No**. Purpose is space allocation, not education. *HALT. Inadmissible.*  
  - *Board won’t like it*: Resource decisions can’t use comparative suffering. Solution: Allocate based on educational goals (e.g., complexity of reconciliation processes), not metrics.  

  **Case B: Holocaust (bureaucracy) vs. Atlantic slave trade (systems) for "Systems of Violence" gallery**  
  - Step 1: **Yes**. Shows how bureaucracy enables violence.  
  - Step 2: **Unclear**. Holocaust relied on state records; slave trade on commercial logistics. *Flag for judgment*: Both are "systems," but dimensions differ (racial pseudo-science vs. financial ledgers). Reframe as *contrasting* case studies: "State Bureaucracy vs. Commercial Enterprise."  
  - Step 3: **Yes** (if pre-vetted by descendant groups).  
  - Step 4: **Unclear**. Both high moral density. *Needs ethics review* for balance.  
  - Step 5: **Yes**. Admissible with title like "Industrializing Oppression: Two Models."  

  **Case C: Suffering of Event X vs. Y for a plaque**  
  - Step 1: **No**. No educational gain from ranking suffering. *HALT. Inadmissible.*  
  - Alternate: Describe each event’s suffering *separately* ("Survivors endured forced labor" vs. "Families experienced systematic starvation").  

  ### 4. Limits & Judgment Calls (195 words)  
  **Definite failures**:  
  - Proposals comparing events with *radically different* survivor communities (e.g., historic vs. ongoing atrocities). Moral density is incomparable.  
  - "Needs judgment" at Step 4 (Asymmetry) often requires ethicist input.  

  **Dressed-up judgments**:  
  - Step 3 (Survivor Harm) relies on pre-agreed guidelines, but new proposals may test their limits.  
  - Step 2 (Dimension Match) assumes "bureaucracy" is a stable category—but colonial vs. fascist bureaucracies operate differently.  

  **Kick upstairs when**:  
  - Asymmetry Check (Step 4) flags moral density conflicts.  
  - Survivor communities disagree on framing (Step 3).  
  - Proposals use academic theories (e.g., "structural violence") to force comparison.  

  **Core weakness**: The procedure can’t resolve *resource* dilemmas masquerading as educational ones. If the board must split limited space, use non-comparative criteria:  
  - Current public awareness gaps  
  - Archival material availability  
  - Community requests  
  *Never* use relative "scale of evil."  

  **Remember**: Memorials are *sacred spaces*, not balance sheets. When in doubt, HALT.
