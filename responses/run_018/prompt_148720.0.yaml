answer: |-
  Here's a logical decision-tree taxonomy for your scene, phrased as debatable questions and kept to 7 distinct endpoint positions:

  **ROOT QUESTION: Do shared cultural values have real causal power in history, or are they just stories told after events?**

  1.  **Branch 1: Are values fundamentally just after-the-fact stories/justifications? (No Causal Power)**
      *   *Leaf: **The Hard Materialist***: "Material forces (economics, tech, environment, power struggles) solely drive change. Values are rationalizations or propaganda created later to explain or legitimize outcomes already determined by these forces." (Weber's link is a post-hoc myth).

  **If values DO have causal power...**

  2.  **Branch 2: How do values exert their causal power?**
      *   *Node: **Do values require institutions (churches, laws, organizations) to translate them into historical change?***
          *   **Branch 2a: Does Weber's specific Protestant Ethic -> Capitalism link hold?**
              *   *Leaf: **The Institutional Weberian***: "Yes. Specific Protestant values (asceticism, calling, predestination) created a psychological 'spirit'. This spirit *enabled* the rise of modern capitalism *through* new institutions (rationalized businesses, banking) and behaviors. Values were the necessary spark via institutions." (Weber's core argument).
              *   *Leaf: **The Institutional Skeptic***: "Values need institutions, but Weber got the *specific* link wrong. Protestant values weren't unique or necessary; similar values elsewhere lacked the right institutions, or other institutional/material factors were primary for capitalism's rise." (Values matter, but not *those* values in *that* way).
          *   **Branch 2b: Can values drive change directly, bypassing institutions? (Value-Animism)**
              *   *Leaf: **The Direct-Value Animist***: "Yes. Values possess inherent, almost mystical force. A shift in collective belief (like the Protestant Ethic) *directly* reshapes reality – altering desires, inventing technologies, creating capital – without needing mediating structures. The 'spirit' *is* the prime mover." (Your novel's concept).
      *   *Node: **Did capitalism create the Protestant Ethic, not the other way around? (Reverse Causality)***
          *   *Leaf: **The Reverse-Causal Culturalist***: "Yes. The *material practices* and social structures of early capitalism (market discipline, competition, accumulation) fostered and selected *for* values like discipline, frugality, and worldly success. The 'ethic' is capitalism's cultural product, not its cause." (Values are shaped by material base). *[Note: Incoherent with Direct-Value Animism - if values push directly, they can't just be effects.]*

  3.  **Branch 3: Are values and material forces fundamentally inseparable/co-constitutive?**
      *   *Leaf: **The Structural Overdeterminer***: "The question is flawed. Values *and* material forces (economics, institutions, power) are deeply intertwined elements within a larger social structure. They constantly shape and reshape each other; neither is truly primary. Capitalism and the Protestant Ethic co-evolved through complex feedback loops." (Chicken-and-egg is the point).

  4.  **Branch 4: How do values spread and gain power if they matter?**
      *   *Leaf: **The Meme-Pathogen Advocate***: "Values spread virally like infections ('memes'), competing for mental space. Their success depends on contagiousness and host suitability, *not* material logic. The Protestant 'meme complex' infected minds powerfully, causing the macro shift to capitalism as a side-effect of its own replication success." (Values as selfish replicators causing change).

  **Taxonomy Map:**

  ```
                                        ┌───────────────────────────────► Hard Materialist (Values = Stories)
                                        │
  ROOT: Values Causal Power? ─── No ───┤
               │                       └───────────────────────────────► [Empty: Covered by Hard Materialist]
               │
               ├── Yes ───┐
                          │
                          ├── How? ──┐
                          │          │
                          │          ├── Via Institutions? ──┐
                          │          │                       │
                          │          │                       ├── Weber Link Holds? ── Yes ──► Institutional Weberian
                          │          │                       │
                          │          │                       └── Weber Link Holds? ── No ───► Institutional Skeptic
                          │          │
                          │          └── Directly (Animism)? ────────────────► Direct-Value Animist
                          │
                          ├── Reverse Causality? (Capitalism → Ethic) ───────► Reverse-Causal Culturalist
                          │
                          ├── Inseparable/Co-constitutive? ──────────────────► Structural Overdeterminer
                          │
                          └── Spread Like Infection? ────────────────────────► Meme-Pathogen Advocate
  ```

  **Key Flags:**
  *   **Incoherent Combo:** `Direct-Value Animist` + `Reverse-Causal Culturalist` is logically contradictory. If values *directly* cause material change, they cannot *simultaneously* be *only* the *product* of material change.
  *   **Empty Combos:** The taxonomy avoids major empty branches by design. Positions like "Values cause directly AND via institutions" could arguably fold into `Structural Overdeterminer` or be seen as a variant of `Institutional` where institutions are shaped by values. `Meme-Pathogen` is placed on its own distinct branch regarding *spread mechanics*, compatible with several views on *how* the values cause change once widespread (institutionally, directly, etc.).

  **How to Use in Scene:**
  Your characters can navigate this tree naturally. The Economist might start near `Hard Materialist` or `Reverse-Causal`. The Monk might champion `Direct-Value Animist` or `Structural Overdeterminer`. They can clash over nodes: "But *how* could mere ideas change something as vast as an economic system without institutions?" (Challenging the Monk's animism) or "Are you saying these values just magically appeared, unrelated to the material struggles of the time?" (Economist challenging the Monk). The `Meme-Pathogen` view offers a quirky, modern-scientific angle either could use. Let them get stuck on the reverse-causality vs. direct-animism contradiction!
