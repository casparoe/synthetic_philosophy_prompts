prompt: |-
  ok so im trying to figure out where the actual conceptual bottlenecks in AI alignment sit, and i dont think its just one problem with a shared name. people talk value spec and robustness constantly, but i think at least four layers get smushed together: (1) the mapping problem—how you formalize human preferences without stripping context; (2) the delgation problem—when an aligned agent hands tasks to subsystems that might not inherit alignment; (3) the recognition problem—how you check alignment if the system can strategically misreprent its goals; and (4) the ontological drift problem—where the categories it uses to represent values slowly shift during training, so harm or autonomy come to mean structurally different things by deployment. imagine youre advising a small phil/theory group with three years of funding. which layers should they actually tackle, in what order? defend it: which are upstream of others, which are tractible for philosophers vs mostly ML empirics, and what evidence over the next couple years would make you reorder them. and is alignment genuinely several problems, or is there a hidden unity im missing?
