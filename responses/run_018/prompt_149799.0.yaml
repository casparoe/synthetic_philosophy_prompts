prompt: |-
  I’m a retired polymer chemist — thirty years in industrial labs measuring reaction yields — and since I hung up my goggles I’ve been sitting in on philosophy seminars at the local college. Last tuesday our study group was arguing in the library basement (someone brought those cheap cookies that taste like cardboard). Two members, Maya and Jonas, sat in a seperate corner and got stuck on Scanlon’s contractualism and the aggregation problem. Here’s the back-and-forth.

  (1) Maya said contractualism is paralyzed in the classic rescue case: we can save five only by actively killing one. The principel allowing that can be rejected by the one, and the principel forbidding it can be rejected by each of the five. Since Scanlon refuses to just sum complaints, there’s no principled tie-breaker, so the view either collapses into paralysis or sneaks in intuition. (2) Jonas replied that Maya misses Scanlon’s distinction between being actively killed and being allowed to die; the five are only suffering a misfortune if we don’t act, whereas the one is actively harmed, so the one’s rejection carries a different kind of weight and the tie breaks naturally without counting heads. (3) Maya came back that this directness distinction falls apart in institutional triage — say, pulling one patient off a respirator to free five machines — where the harm is structurally direct. She also said that if Jonas lets “generic reasons” be weighted by severity, he’s already smuggling in aggregation with a non-linear curve, just not calling it that. (4) Jonas then said Maya treats contractualism like a one-shot calculus, but it’s really about ex ante institutional principels. From behind partial ignorance about whether you’ll be the one or one of the five, everyone might reject a rule permitting lethal triage, not because numbers don’t matter but because the catastrophic risk to being the victim dominates the probabilistic benefit. He added that this doesn’t aggregate; it weights the kind of reason each person has from a generic standpoint.

  They asked me to referee and I honestly couldn’t. Please adjudicate move by move: rate each of the four moves from clearly mistaken to clearly right and briefly justify each rating. Also say who’s more right overall, and what — if anything — both are missing about how contractualism handles collective harm in institutional settings. Don’t just hand me a bibliography; I want to know whether Jonas’s ex ante move actually saves Scanlon or whether Maya’s institutional counter is fatal.
reasoning: |-
  Okay, let me try to unpack this polymer chemist's query. He's retired but auditing philosophy seminars, and now he's stuck refereeing a debate between Maya and Jonas on Scanlon's contractualism and the aggregation problem. The core issue is whether contractualism can handle rescue cases where saving five requires actively killing one, especially in institutional settings like triage.

  First, I need to recall Scanlon's framework. Contractualism says an act is wrong if it can't be justified by principles no one could reasonably reject. The aggregation problem arises because Scanlon seems to reject straightforward summing of individual complaints, which makes cases like the rescue dilemma tricky. 

  Looking at Maya's first move: she argues contractualism paralyzes in the classic rescue case. The one person can reject a principle allowing their killing, while each of the five can reject a principle forbidding action. Since complaints aren't summed, there's no tie-breaker. That seems solid—Scanlon does struggle with aggregation, and this is a standard critique. I'd rate her clearly right here.

  Jonas counters with the active killing vs. allowing harm distinction. He claims the one's complaint carries more weight because it's direct harm, breaking the tie without aggregation. But Scanlon's distinction isn't that clear-cut—he focuses on reasons for rejection, not just physical directness. Jonas might be oversimplifying, so his move is partially right but incomplete.

  Maya fires back with two points: institutional triage (like pulling someone off a respirator) blurs the directness distinction, and if severity weighting sneaks in, it's hidden aggregation. The respirator example is strong—structural harm in institutions complicates Jonas's argument. And she's spot-on about "generic reasons" masking aggregation. Clear win for Maya here.

  Jonas's ex ante move shifts to institutional principles under partial ignorance. He argues everyone would reject lethal triage rules because catastrophic risk dominates probabilistic benefit. This is clever—it uses Scanlon's "standpoint of the person most burdened" without aggregation. But Maya's institutional counter wasn't fully addressed. Jonas is partially right but underestimates how institutions reshape complaints.

  Overall, Maya seems more convincing. Her critique exposes real flaws in contractualism's handling of numbers, while Jonas's defenses have gaps. Both miss how institutions might create new grounds for reasonable rejection—like procedural fairness or role-based duties—which could resolve triage cases without aggregation. The chemist's real question is whether contractualism collapses in practice, and the answer is... it's messy, but Jonas's ex ante approach offers a path forward if expanded institutionally.
answer: |-
  Here's a move-by-move adjudication, grounded in Scanlon's contractualism (*What We Owe to Each Other*) and its critical literature:

  1.  **Maya's Initial Challenge (Rescue Case Paralysis):**
      *   **Rating: Clearly Right (on the core point), Partially Mistaken (on "collapse")**
      *   **Justification:** Maya accurately identifies the core aggregation problem for Scanlon. Scanlon explicitly rejects "adding up" lesser complaints to outweigh a more serious individual complaint. In the rescue case, the one person *can* reasonably reject any principle permitting their intentional killing to save others (Scanlon prioritizes individual inviolability). Simultaneously, each of the five *can* reasonably reject a principle *forbidding* action that would save them, as this leaves them to die. Without aggregation, contractualism *does* seem paralyzed. Where Maya oversteps slightly is claiming it *must* collapse into paralysis or intuition. Scanlon *attempts* solutions (like Jonas's moves), though their success is debatable.

  2.  **Jonas's Reply (Active Killing vs. Allowing to Die):**
      *   **Rating: Partially Right (on Scanlon's intent), Clearly Mistaken (as a sufficient tie-breaker)**
      *   **Justification:** Jonas correctly identifies a crucial distinction Scanlon relies on: the difference between *intentionally harming* someone (killing the one) and *failing to aid* someone (not saving the five). Scanlon argues the complaint of the person actively harmed is generally stronger. However, Jonas is mistaken that this *automatically* breaks the tie "without counting heads." Scanlon himself acknowledges this distinction might not always resolve cases, especially when the numbers are very large or the harms severe. The complaint of the *five* facing death is still extremely weighty *as individual complaints*. Relying *solely* on this distinction often feels like it implicitly discounts the number of serious complaints, failing to fully address Maya's core challenge.

  3.  **Maya's Counter (Institutional Triage & "Smuggling Aggregation"):**
      *   **Rating: Clearly Right (on Institutional Counter), Partially Right (on Smuggling)**
      *   **Justification:** Maya's institutional triage counter (respirator) is powerful. In a structured setting, pulling the plug isn't just "failing to aid" the one; it's an active, deliberate intervention *causing* their death to aid others. Scanlon's active/allowing distinction blurs significantly here. The harm to the one is just as "direct" in the morally relevant sense. Her second point about "generic reasons" is insightful. If Jonas (or Scanlon) allows the *severity* of the harm (death) to significantly weight the generic reason ("being killed" vs. "not being saved"), and *especially* if severity interacts with probability or numbers *at all* in the ex ante perspective (see move 4), they *are* introducing a form of weighting that edges towards non-linear aggregation, even if they avoid simple summation. This is a key criticism of Scanlon: his reliance on "generic reasons" and the "standpoint of the person most burdened" may implicitly incorporate comparative assessments resembling aggregation.

  4.  **Jonas's Ex Ante Move (Institutional Principles & Catastrophic Risk):**
      *   **Rating: Partially Right (as Scanlon's intended solution), Not Fully Successful (against Maya's critique)**
      *   **Justification:** Jonas's move is central to Scanlon's response to aggregation problems. He shifts focus from a one-off choice to ex ante rule selection under partial ignorance ("veil of uncertainty," though Scanlon avoids Rawlsian terminology). The argument is that *no one*, not knowing their position, could reasonably reject a rule *forbidding* actively killing one to save five. Why? Because the *kind of burden* faced by the potential victim (certain, catastrophic death) is so severe it dominates the probabilistic benefit each person has of being among the five saved. Jonas correctly notes this isn't simple aggregation; it's comparing the *kinds of generic reasons* people have from the ex ante perspective – catastrophic certainty vs. dispersed probabilistic gain. **However, it doesn't fully save Scanlon from Maya:**
          *   **Institutional Context Undercuts Ignorance:** In specific institutional roles (e.g., a triage officer), the "veil" is thinner. They *know* they are making a decision affecting others, not necessarily themselves. The ex ante perspective applies more to *designing* the institution than *applying* its rules in a crisis.
          *   **Severity Weighting = Implicit Aggregation?** While not summing numbers, prioritizing the "catastrophic risk" *is* weighting severity. If the numbers were vastly larger (save 1000 by killing 1), the probabilistic benefit *might* become a catastrophic risk *of not acting* for each person ex ante. Jonas's move avoids simple summation but still relies on comparing the *magnitude* of potential harms/benefits across individuals, which edges towards the non-linear aggregation Maya suspects.
          *   **Doesn't Resolve Triage Cleanly:** For an institution *designed* for scarce resource allocation (like the respirator case), a rule *permitting* withdrawal *might* be reasonably rejectable ex ante. But a rule *forbidding* it might *also* be reasonably rejectable by those needing the resource, as it guarantees death for many. The "catastrophic risk" argument leans heavily against action but doesn't definitively resolve the institutional dilemma Maya raised.

  **Overall Assessment:**

  *   **Who's More Right? Maya.** She lands the more significant blows by relentlessly exposing the core aggregation problem and demonstrating how Scanlon's key distinctions (active/allowing) and solutions (ex ante focus) either struggle or potentially reintroduce aggregation in disguised forms, especially in the institutional settings she highlights. Jonas defends Scanlon's framework correctly according to its own terms, but Maya successfully shows the framework's limitations and internal tensions in handling these cases.

  **What Both Are Missing About Contractualism & Collective Harm in Institutions:**

  1.  **The "We" in "What We Owe to Each Other":** Both focus intensely on individual complaints/rejections. Scanlonian contractualism struggles significantly with genuinely *collective* harms or benefits that aren't reducible to individual states. Institutional harms often have this character (e.g., systemic injustice, environmental degradation). How do groups, not just individuals, reasonably reject principles?
  2.  **Procedural Fairness & Institutional Roles:** In institutions, the *process* of decision-making and the *roles* individuals occupy become crucial. A principle might be reasonably rejectable if it assigns decision-making power unfairly or imposes unreasonable role-based duties (e.g., forcing a doctor to actively kill). Contractualism often underplays how institutional structures themselves create distinct grounds for reasonable rejection beyond the direct outcome.
  3.  **The Scope of "Reasonable Rejection":** Both assume the relevant parties are those directly affected (the one, the five). But in institutional settings, principles governing actions (like triage protocols) affect a wider class: *all* potential future patients, staff burdened by the rules, and society trusting the institution. A principle might be reasonably rejectable by a wider group concerned about fairness, precedent, or the erosion of trust, even if direct beneficiaries/victims might accept it.
  4.  **The Limits of "Generic Reasons":** While central to Scanlon, the appeal to "generic reasons" from an impartial standpoint is precisely where critics see aggregation sneaking in. Defining "generic reasons" neutrally without incorporating comparative severity assessments is extremely difficult, as Maya suspects. Institutions often codify specific weightings (e.g., severity scales in triage), forcing explicit aggregation that contractualism tries to avoid at the foundational level.

  **Conclusion:** Maya successfully exposes the deep tension within Scanlonian contractualism regarding aggregation, particularly in institutional contexts where distinctions blur and the need for comparative assessment is acute. Jonas's ex ante move represents Scanlon's best defense, offering a non-summative way to consider numbers via probabilistic risk. **However, it does not fully "save" Scanlon.** It relies on severity weighting that resembles non-linear aggregation, struggles with the specific knowledge and roles inherent in institutional application, and doesn't definitively resolve triage cases like the respirator example. Contractualism provides a powerful framework for emphasizing individual inviolability and justification, but its handling of aggregation and collective harm in complex institutional settings remains a significant, arguably unresolved, challenge. Jonas offers the textbook defense, but Maya highlights the cracks in the foundation.
