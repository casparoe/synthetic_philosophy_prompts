prompt: |-
  Ok so this came up in my ethics class last week and it's been bugging me. We were talking about hypocrisy, and my teacher said that when someone's a hypocrite, they "lose their standing to blame" other people. Like if my dad yells at me for lying but he lies to his boss all the time, his criticism doesn't count.

  Here's what I dont get though. If being a hypocrite means your blame doesn't count, then doesn't that basically mean only perfect people are allowed to criticize anyone? Because everyone has done the thing they're criticizing at some point, at least a little. So my friend's mom can't tell her to quit smoking because she smoked in college, teachers can't give detention for cheating if they ever cheated, etc. It seems like this proves that almost all moral criticism is invalid, which can't be right because then how would anyone ever call anyone out?

  My teacher said I'm conflating two things but she kind of waved it off because class was ending. So can you explain: does the hypocrisy thing actually show that hypocritical blame is worthless, or does the criticism still work even though the person is a hypocrite? If I'm mixing something up, tell me what exactly I'm mixing up, because to me "his blame doesn't count" just means his blame is wrong. Walk me through it with the dad example.

  Please end with a last line that says "Verdict:" followed by one short phrase on whether my argument holds up, e.g. Verdict: holds up / Verdict: rests on a confusion (and name the confusion in a few words).
