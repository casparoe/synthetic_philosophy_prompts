answer: |-
  Right then, let's bin the jargon and crack this open with your tools: codes, exceptions, permits, and precedent folders. Think of the moral particularism vs. generalism debate as a decades-long argument between two very different types of Planning Officer inspecting your archives.

  **The Core Dispute Through Archive Lenses:**

  1.  **Moral Generalism (The Chief Planning Officer / Strict Code Enforcer):**
      *   **Their Claim:** Ethical decisions *must* follow a universal **code**. Think of your main zoning ordinances – clear, written rules applicable to *every* case ("No commercial builds in residential zones," "Heritage facades preserved"). There's a master filing system.
      *   **Equivalent:** The pristine, unamended **written ordinance** itself. The "rule on paper" is supreme. Any deviation is an error or corruption.
      *   **How They See Exceptions:** Aberrations. Mistakes in filing. Situations where the officer *failed* to apply the code correctly, or where the code itself needs a universal amendment (a new clause added for *all* future cases). They distrust **exception logs** – they see them as evidence of systemic failure, not wisdom.

  2.  **Moral Particularism (The Veteran Case Officer / Precedent Whisperer):**
      *   **Their Claim:** What *actually* matters are the **exception logs**, the **precedent folders**, and the specific details scribbled on that **approved demolition permit**. Ethical judgement isn't about rigidly applying a master code, but understanding the unique *context* of each case file.
      *   **Equivalent:** The thick **precedent folder** bulging with notes, photos, council minutes, and resident letters. The **approved exception** stamped on the permit that *deviates* from the strict code. The archivist's knowledge that "Rule 7b *says* X, but we *always* grant Y if there's a listed bird nest, per Precedent File 1987/45/Delta".
      *   **How They See Codes:** Useful starting points, maybe rough guides, but hopelessly inadequate blueprints. They see the **written ordinance** as often clumsy, needing constant interpretation against the messy reality captured in the files. The *real* "rules" are patterns of decisions found in the **exception logs**, not the pristine code.

  **The Conceptual Mapping - What Fits, What Bends, What's Missing:**

  *   **Clean Fits (Maps Directly):**
      *   **The Central Tension:** The daily friction between the "**written ordinance**" and the "**approved exception**" perfectly mirrors the core debate. Generalists prioritise the first; particularists prioritise the second.
      *   **Precedent vs. Code:** Using **filing precedents** as the basis for future decisions, rather than solely the original code, is *exactly* particularism in action. It's judging based on similar past *cases*, not abstract rules.
      *   **Context is King (Particularism):** The specific details in a demolition permit file – the building's condition, the developer's history, the local outcry documented – are the "moral context" for the particularist. This *is* how case officers think.
      *   **The Existence of Exception Logs:** The very fact that **exception logs** exist and are necessary proves the particularist point: rigid codes *always* need context-sensitive application. The logs *are* the evidence.

  *   **Distortions (Needs Squeezing into the Cabinet):**
      *   **Generalism's "Universal" Claim:** Archivists know codes *change*. The 1970s zoning code isn't the eternal law; it's Version X, superseded by Version Y. Philosopher-generalists often talk as if moral principles are timeless and unchanging like mathematical truths, not amendable regulations. Your framework shows principles *can* be revised (like updating the code), but generalism struggles with the *context-driven need* for constant exceptions *within* a code's lifetime.
      *   **Particularism's "No Codifiable Principles" Extreme:** Some radical particularists claim *no* useful general moral principles exist – it's *all* context. But your archive shows **precedent folders** exist! Patterns *are* discernible and used for guidance. While strict codes fail, clusters of similar **approved exceptions** *do* form quasi-rules ("We usually grant X in cases like Y"). Pure "no principles whatsoever" particularism doesn't fit the practical reality of building precedent files.

  *   **No Equivalent (Residue in the Philosopher's In-Tray):**
      *   **The "Why" Behind the Reasons:** Your files show *that* an exception was granted (e.g., "Demolition approved despite heritage listing due to structural instability proven by Engineer's Report Z"). But they rarely capture the *moral weight* assigned to different factors. Was "structural instability" an absolute trump card? Or was it balanced against the heritage value? The *internal reasoning* about *why* certain context features *matter morally* (e.g., safety vs. historical significance) is the philosopher's domain. Your logs show the *decision*, not the full *deliberative weighting*.
      *   **Foundational Justification:** Philosophers argue *why* we should trust codes *or* context in the first place. Is the code authoritative because of democratic process? Natural law? Does context matter because consequences are paramount? Because of individual rights? Your archive assumes the *system* (planning laws, council procedures) exists; it doesn't debate the ultimate foundation *of* the system's authority or values. The "why obey *any* rule?" question isn't in your remit.
      *   **Abstract Moral "Reasons":** Philosophers talk about "moral reasons" as basic building blocks (e.g., "causing pain is a reason against an action"). You deal with concrete, documented factors within a specific regulatory framework ("structural instability," "listed species habitat"). The philosopher's abstract "reasons" don't have direct file references.

  **The Residue Report:**

  *   **What the Archive Framework Misses:** It misses the deep dive into *why* specific contextual features (safety, heritage, fairness) have *moral significance* and how they *interact* and *outweigh* each other in deliberation. It captures the *input* (context details) and the *output* (decision/exception), but not the full, nuanced *processing* of moral weight. It also doesn't engage with the ultimate justification *for having the system at all*.
  *   **What the Philosophers' Debate Might Overlook/Overcomplicate:** Your framework brilliantly exposes how the *practical reality* of ethics (like planning) **requires both elements in constant tension**. The pure "universal code vs. absolute context" extremes *do* collapse when you look at the files:
      *   Even the strictest generalist relies on *interpreting* the code in light of *some* context (what does "structural instability" *mean*?).
      *   Even the most context-focused particularist relies on *patterns* (precedents) that start to look like localised, humble "rules-of-thumb".
      *   **The Archive Verdict:** Ethics, like planning decisions, isn't a choice between a single master code or utter chaos. It's a dynamic system where a **written ordinance** provides essential structure and baseline expectations, but **exception logs**, **precedent folders**, and the **approved exceptions** stamped on permits are the *necessary, constant, practical application* of judgement to unique cases. The philosopher's absolute distinction often melts away in the face of the filing cabinet's messy reality. The real insight from your job? **Good ethics, like good planning, lives in the competent, contextual navigation of the gap between the rule and the exception, documented faithfully for the next case officer.**

  The takeaway for your pub friend? Next time, argue that moral philosophy needs more archivists – people who understand that principles and particulars aren't enemies, they're just different filing categories in the same, perpetually overstuffed cabinet of human decision-making. Cheers!
