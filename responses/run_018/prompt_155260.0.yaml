answer: |-
  ### Classification of Nexus-7
  Based on the professor's track record and the description of Nexus-7, she will classify it as **Gregorian**. 

  ### Two Competing Principles
  The professor's prior verdicts support two competing principles for assigning Popperian and Gregorian status:
  1. **Principle A (Strict Internal Representation)**: 
     - Popperian cognition requires **internal representational modeling** within an individual entity (e.g., mental simulations or hypotheses tested "in the head"). 
     - Gregorian cognition is **culture-augmented Popperian**, meaning it builds on Popperian capabilities by adding cultural tools (e.g., language, symbols, peer collaboration) for enhanced learning and knowledge transmission. 
     - Without individual internal models, an entity cannot be Popperian and thus cannot qualify as Gregorian.

  2. **Principle B (Collective Symbolic Storage)**: 
     - Gregorian cognition can arise from **heritable, collective symbolic storage** (e.g., shared cultural artifacts) even **without individual internal models**. 
     - This principle emphasizes the role of externalized, culturally transmitted symbols (e.g., maps, notations) that persist across generations and improve collectively, enabling advanced cognition without requiring every individual to internally represent the environment.

  ### Implicit Principle and Justification
  The professor is implicitly running **Principle B**.  
  **Justification**:  
  - Her prior verdicts prioritize **cultural scaffolding** as the defining feature of Gregorian cognition, even in the absence of individual internal representations. For example:  
    - The human mathematician is Gregorian due to symbolic notation (a cultural tool) and peer collaboration, highlighting that cultural augmentation is key.  
    - The pre-linguistic infant is *not* Gregorian because it lacks cultural tools, despite having individual mental models (Popperian).  
  - In Nexus-7, the **collective symbolic map** (inherited via horizontal gene transfer and chemical tags) acts as a cultural artifact that improves across generations. This mirrors the Gregorian emphasis on externalized, transmissible knowledge:  
    - The map is "symbolic," modifiable, and persists collectively, functioning like a non-linguistic cultural tool (e.g., analogous to human symbolic notation).  
    - No single node internally represents the environment, but the colony as a whole benefits from inherited knowledge, avoiding the need for de novo trial-and-error.  
  - This aligns with Principle B: Nexus-7 achieves Gregorian status through **collective cultural inheritance**, bypassing the requirement for individual internal models (which would be needed under Principle A).  

  Under Principle A, Nexus-7 would fail as Gregorian (and Popperian) due to the lack of individual internal representations. However, the professor's emphasis on cultural tools in the mathematician case and her dismissal of the infant as non-Gregorian due to absent scaffolding suggest she prioritizes collective cultural storage over individual representation. Thus, Principle B governs her verdict.

  ### Single Further Case to Settle the Matter
  To conclusively distinguish between Principle A and Principle B, the following case would settle the matter:  
  - **A tribe of non-linguistic hominins** that uses collectively inherited, physically carved maps (e.g., stone engravings of hunting grounds) to navigate and adapt to environmental changes. These maps are refined over generations based on tribal success, but no hominin internally represents the full environment—each relies on the shared artifact.  

  **Why this settles the matter**:  
  - **Under Principle A**: This tribe would be **Popperian (at best)**, not Gregorian. Individuals lack internal models (relying on external maps), so they fail the Popperian requirement. Without Popperian status, they cannot be Gregorian.  
  - **Under Principle B**: This tribe would be **Gregorian**. The carved maps are heritable, collective symbolic storage that enhance group cognition and adaptation, fulfilling the cultural-scaffolding criterion without individual internal models.  
  The professor's verdict on this case would reveal her core principle: if she classifies it as Gregorian, Principle B is confirmed; if not, Principle A holds.
