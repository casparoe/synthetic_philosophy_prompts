  ## Villanelle on the Aim of Belief

  The scan shows shadows where the growth might start,
  But fear demands a verdict, sharp and fast.
  **Belief must follow where the evidence goes.**

  To wait for tests invites a bleeding heart,
  The cost of doubt a burden built to last.
  **The stakes can alter what belief requires.**

  This dispassionate demand, an inner chart,
  Directs the mind toward the die it’s cast:
  **Belief must follow where the evidence goes.**

  For truth alone should steer the thinking part,
  Where idle hope or terror overpowers.
  **The stakes can alter what belief requires.**

  Through thought’s clear lens, a singular, pure art –
  To judge if *this* is *so*, no other powers.
  **Belief must follow where the evidence goes.**

  The weight of consequence, a counter-thrust,
  Insists the urgent outcome fans the fires:
  **The stakes can alter what belief requires.**

  **Belief must follow where the evidence goes,**
  **The stakes can alter what belief requires.**
  This knot resists untying: truth and need
  At war inside the mind, twin compass points that bleed.

  ---

  **Note on Philosophical Liberties and Interpretations:**

  1.  **Pragmatic "Reasons" as Genuinely Normative:** The poem presents the pragmatist refrain ("The stakes can alter what belief requires") as offering *reasons* for belief. This reflects the strong pragmatic-encroachment position (e.g., influenced by Fantl & McGrath, Stanley). However, it is contested whether practical stakes provide *justifying reasons* for belief itself, or merely determine the *threshold* of evidence required for justified belief (a weaker encroachment), or are only *motivating/causal* factors without normative force for belief *formation*. The poem leans towards the stronger interpretation where stakes are depicted as genuinely reason-giving for the attitude.
  2.  **Evidentialism and Transparency:** The evidentialist refrain ("Belief must follow where the evidence goes") and supporting lines capture the core commitment derived from the transparency of belief (the idea that to answer "Do I believe P?" I look to "Is P true?", implying truth is the sole constitutive aim). The poem accurately portrays this as excluding non-evidential considerations *as reasons for belief*. It does not, however, delve into debates about whether transparency *entails* there are no Wrong Kind of Reasons (WKR) for belief at all; some argue transparency shows only evidential reasons are *operative*, not that WKRs are metaphysically impossible.
  3.  **The "Wrong Kind of Reasons" Framing:** The poem uses the WKR *problem* as its springboard, framing the debate as one about whether pragmatic considerations are reasons of the *wrong kind* for belief (the evidentialist view) or whether they can be reasons of the *right kind* (the strong pragmatist view depicted). This is a standard framing. However, some pragmatists might argue pragmatic considerations *transform* what counts as evidence or justification, rather than being a distinct "kind" of reason alongside evidence. The poem's villanelle structure, emphasizing the *conflict* between two types of considerations, aligns well with the WKR framing.
  4.  **Settled Ground vs. Contested Core:**
      *   **Broadly Settled:** It is widely accepted within the relevant literature that there is a meaningful distinction between reasons that engage an attitude's constitutive aim or "correctness condition" (Right Kind of Reasons - RKR) and reasons that do not directly engage that aim but might relate to having or not having the attitude for other benefits or costs (Wrong Kind of Reasons - WKR). The puzzle itself is a recognized phenomenon.
      *   **Genuinely Contested:** The core disagreements driving the poem remain deeply contested:
          *   Does belief have *exactly one* constitutive aim (truth), or could it have multiple aims (e.g., truth *and* useful action)?
          *   Can practical stakes ever constitute *genuine normative reasons* (either RKR or a distinct valid kind) *for believing a specific proposition*, or are they only ever reasons for *acting as if one believes*, or for *seeking more evidence*, or merely *causal influences* on the *psychology* of belief formation? The poem presents the strong pragmatist position on this as a viable, opposing view to strong evidentialism, reflecting the current stalemate in the literature.
          *   Does the "transparency" of belief definitively rule out the possibility of non-evidential reasons being normative for belief, or does it merely describe our first-personal deliberative perspective?
