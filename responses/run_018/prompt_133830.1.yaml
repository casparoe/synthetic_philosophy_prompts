answer: |-
  Your observation identifies a sophisticated and under-theorized dimension of moral reasoning. This "normative-infrastructure register" evaluates acts based on their **micro-level role in sustaining or eroding the institutional, economic, and social scaffolding that enables—or obstructs—collective action.** Let's systematize this concept.

  ### Core Concept: **Institutional Maintenance / Disruption (IMD)**
  **Definition:** The moral evaluation of an individual act based on its *observable contribution* to reinforcing or undermining the *stable functioning of systems* (markets, norms, institutions, signaling mechanisms) necessary for coordinating collective responses to shared problems. 

  **Boundary Conditions:**
  1.  **Requires Observability:** Acts must be perceptible to others to influence expectations or signals (e.g., public flying, visible meat consumption). Truly private acts lack IMD effects.
  2.  **System-Dependent:** The act's significance derives from its interaction with an *existing* collective-action system (e.g., carbon markets, social norms around food, political advocacy networks).
  3.  **Non-Trivial Participation:** The actor must be a non-negligible participant in the relevant system (e.g., regular flyer, central social figure). Marginal actors lack leverage for IMD effects.
  4.  **Distinct from Outcome Causality:** Focuses on the *conditions for future action* (collective or institutional), not the act's direct causal impact on the harm itself.

  ---

  ### How IMD Differs from Adjacent Concepts
  1.  **vs. Universalization / Kantian Deontology:**  
      *   Universalization tests maxims *in isolation*. IMD assesses an act's *concrete role within a specific, functioning system*. The frequent flyer argues her act is justified *because* it occurs alongside system-supportive acts, not because it could be universalized.

  2.  **vs. Game Theory / Social Norms (Contractualism):**  
      *   Game theory focuses on equilibrium states and incentives. IMD focuses on the *stability of the platform enabling coordination*. It explains why "cheating" (e.g., flying while advocating) might be *strategically stabilizing* for the system (funding offsets, maintaining influence) rather than destabilizing.

  3.  **vs. Virtue Signaling / Expressive Value:**  
      *   Expressivism focuses on the *actor's character or message*. IMD focuses on the act's *functional impact on system operations*. The meat-eater isn't (just) expressing virtue; she's arguing her consumption *actively maintains a social expectation* crucial to current patterns, while abstention would disrupt it.

  4.  **vs. Structural Injustice (e.g., Iris Young):**  
      *   Young focuses on *macro-level responsibility* of individuals *qua* participants in unjust structures. IMD is *micro-level*, explaining how *specific observable acts* affect the *robustness or fragility* of structures themselves. It answers *how* individuals affect structures dynamically.

  5.  **vs. Marginal Causality / Inefficacy:**  
      *   IMD concedes direct causal inefficacy. Its moral force comes from affecting the *infrastructure* necessary for *others* to act effectively collectively (e.g., sustaining carbon markets, stabilizing social norms for future activism).

  ---

  ### Common Misapplications of IMD
  1.  **Attributing IMD Effects to Private Acts:**  
      *   *Misapplication:* Claiming a secret vote, undisclosed donation, or private meat consumption has significant IMD effects.  
      *   *Correction:* IMD requires observability to influence expectations or signals. Truly private acts lack this.

  2.  **Applying IMD to Macro-Level Policy:**  
      *   *Misapplication:* Using IMD logic ("this policy maintains stability") to justify harmful large-scale institutions (e.g., arguing *for* fossil subsidies to "maintain energy market stability").  
      *   *Correction:* IMD is a *micro-level* concept for individual acts within systems. Systemic design requires different ethical frameworks (distributive justice, human rights, long-term consequences).

  3.  **Overstating Individual Leverage:**  
      *   *Misapplication:* An isolated individual with minimal social/financial capital claiming their minor act significantly stabilizes/disrupts a large system.  
      *   *Correction:* IMD effects scale with the actor's observable participation and influence within the relevant system (e.g., a celebrity's meat consumption vs. a hermit's).

  4.  **Ignoring System Entrenchment:**  
      *   *Misapplication:* Claiming a "destabilizing" act (e.g., one person abstaining from meat) will trigger systemic change in a highly entrenched system immune to micro-disruptions.  
      *   *Correction:* IMD requires plausible pathways from the act to system change (e.g., disruption works if norms are fragile; maintenance is significant if systems are nascent/vulnerable).

  ---

  ### Why IMD Matters & Its Limits
  *   **Explains "Hypocrisy" Defenses:** It makes strategic sense for the frequent flyer: her visible consumption *funds and normalizes the offset market*, making it a viable tool for others. Abstaining might weaken market signals.
  *   **Captures Social Dynamics:** The meat-eater highlights how individual acts function as *social tokens* maintaining normative equilibria. Abstention isn't just "not harming"; it's *active de-normalization*.
  *   **Moral Limits:** IMD cannot justify acts that *directly* cause severe harm, even if they "maintain" a system. It primarily justifies *otherwise marginally harmful* acts embedded in a *demonstrably net-positive* systemic strategy. The burden of proof lies with the actor to show the systemic benefits outweigh the direct harm.

  **In essence, IMD shifts the locus of moral evaluation from the *atomistic act* to the act's *role within the ecology of collective action*. It provides a coherent (though often contestable) justification for seemingly paradoxical behaviors in complex systems—but only when specific boundary conditions are met.** This framework deserves greater recognition in debates about individual responsibility in collective harm scenarios.
