  Decisive pairs:

  - Alice is decisive over {a,c} (whether she presents or not) -> she prefers c > a, so society must have c > a.
  - Bob is decisive over {b,c} (whether he presents or not) -> he prefers c > b, so society must have c > b.
  - Charlie is decisive over {a,b} (who presents) -> he prefers a > b, so society must have a > b.

  Now, what do we have? 
  - c > a
  - c > b
  - a > b

  No cycle: we have a social ordering: c > a > b.

  No contradiction.

  We need a cycle. How about:

  Alice: a > c > b  [she wants to present, then postpone, then Bob present]
  Bob: b > c > a
  Charlie: c > a > b

  Decisive pairs:
  - Alice over {a,c}: she prefers a > c -> so a > c in society.
  - Bob over {b,c}: he prefers b > c -> so b > c.
  - Charlie over {a,b}: he prefers a > b -> so a > b.

  Then we have a > c and a > b and b > c. So ordering: a > b > c.

  No cycle.

  For a cycle, we need a profile like the first one but with the decisive pairs on the other pairs.

  Let me try to create a cycle with three people and three alternatives.

  Example:

  Alternatives: a, b, c.

  Preferences:
  - Alice: a > b > c, decisive over {a,b}
  - Bob: b > c > a, decisive over {b,c}
  - Charlie: c > a > b, decisive over {a,c}

  Then:
  - Alice decisive: a > b
  - Bob decisive: b > c -> by transitivity a > c
  - Charlie decisive: c > a -> cycle.

  But note: the decisive pairs here are not about their private sphere. {a,b} for Alice might be about something that concerns her, but {b,c} for Bob might be about something that concerns him, and {a,c} for Charlie might be about something that concerns him. However, the pairs overlap and the private sphere is not clear.

  In this profile, the cycle happens by the liberal condition alone, without Pareto.

  But Sen's liberal paradox requires the Pareto condition as well? Not necessarily. The original theorem shows that minimal liberalism (at least two people have decisive power over at least one pair each) is incompatible with Pareto and having a social ordering that is complete and transitive.

  So this profile also shows a conflict between minimal liberalism and transitivity (without Pareto).

  For the second round, we can use this profile. We assign decisive pairs that are not necessarily about their own private sphere, including one that concerns two other people.

  For example, in a work setting:

  Alternatives:
  - a: Alice works on Project X, Bob on Project Y.
  - b: Alice on Y, Bob on X.
  - c: Alice and Bob both on X.

  But then the private sphere is blurred.

  We can say:
  - Alice is decisive over {a,b} (which project she works on? but in a she is on X, in b she is on Y, so it's about her assignment).
  - Bob is decisive over {b,c} (in b he is on X, in c he is on X as well? not different). Not good.

  Another example:

  - a: Give a raise to Alice.
  - b: Give a raise to Bob.
  - c: Give a raise to neither.

  Then:
  - Alice is decisive over {a,c} (whether she gets a raise or not) -> private.
  - Bob is decisive over {b,c} (whether he gets a raise or not) -> private.
  - Charlie is decisive over {a,b} (who gets the raise between Alice and Bob) -> but this is not his private sphere.

  Preferences:

  Alice: a > b > c  [she wants the raise for herself, then for Bob, then neither]
  Bob: b > a > c
  Charlie: c > a > b  [he thinks raises are not deserved, but if forced, Alice over Bob]

  Now, by liberalism:
  - Alice: a > c, so a > c.
  - Bob: b > c, so b > c.
  - Charlie: a > b? wait, Charlie's preference: c > a > b -> so he prefers a > b.

  But society must have a > b because Charlie is decisive over {a,b}? But wait, Charlie's ranking has a > b, so yes, a > b.

  Then social ordering: a > b > c. No cycle.

  To create a cycle, use the first cycle profile:

  Alice: a > b > c, decisive over {a,b} -> society a > b.
  Bob: b > c > a, decisive over {b,c} -> society b > c.
  Charlie: c > a > b, decisive over {a,c} -> society c > a.

  Then cycle: a > b, b > c, c > a.

  And no Pareto condition is needed for this cycle. But then it's not the Paretian liberal paradox, but just a cycling caused by decisiveness.

  For the second round, we can use this to show that the cycle happens even when the decisive pair is not about one's own private sphere.

   For the third round, we can allow waiver.

   So let's design the first round with the sympathetic reframing (Alice and Bob with the book) and the second round with the three-person cycle profile (Alice, Bob, Charlie) where one of the decisive pairs is over something that concerns two other people.

   Then the third round: allow any of them to waive their right to be decisive over their pair.

   We need to see if the cycle can be avoided.

   For the first round (Paretian liberal):

   Participants: 
     - Alice: pref c > a > b, decisive over {a,c}
     - Bob: pref a > b > c, decisive over {b,c}
     - 12 others: pref a > b > c (same as Bob)

   Without waiver, they hit a contradiction.

   If Alice waives her right over {a,c}, then the society doesn't have to have c > a. Then the social ordering can be: 
     - By Bob's decisiveness: b > c.
     - By Pareto: a > b (everyone has a > b) and also a > c (everyone has a > c? 
          Alice: a > c? No, Alice has c > a.
          Bob: a > c? Bob has a > b > c -> a > c.
          Others: a > c -> so by Pareto, a > c.
     - Then we have a > b and b > c, so a > c, which is consistent.

   So if Alice waives, they can have a social ordering: a > b > c.

   If Bob waives, then no requirement for b > c. Then:
     - By Alice's decisiveness: c > a.
     - By Pareto: a > b and a > c -> but a > c contradicts c > a.

   So only if Alice waives can they avoid the cycle.

   For the second round (three-person cycle without Pareto):

   Participants:
     - Alice: a > b > c, decisive over {a,b}
     - Bob: b > c > a, decisive over {b,c}
     - Charlie: c > a > b, decisive over {a,c}

   Cycle: a>b (Alice), b>c (Bob), c>a (Charlie) -> cycle.

   If any one waives, say Alice waives her decisiveness over {a,b}, then no requirement for a>b. Then we can have a social ordering that, for example, respects Bob and Charlie's decisiveness: b>c and c>a, so b>c>a. This is consistent.

   Similarly if any one waives, the cycle breaks.

   So in the debrief, we can discuss that rights as waivable options can avoid the impossibility.

   Now, let's organize the game.

   Given 14 participants and 90 minutes.

   We can do three rounds, each with a different scenario, and then rotate roles.

   But time is limited.

   Alternatively, we can have three groups of 4 and one group of 2? But then we need 3 or 4 people per group.

   How about this:

   Round 1: The Paretian liberal with sympathetic framing.
     - 2 key players (Alice and Bob) and the rest of the class (12) as voters with the same preference as Bob.
     - One rule-enforcer (could be a volunteer or the instructor for this round).

   Round 2: The cycling profile with three key players (Alice, Bob, Charlie) and no Pareto condition.
     - 3 key players and one rule-enforcer. The rest observe or are not involved? Or we can have multiple groups.

   Given the time, it might be better to do one group in front of the class for each round, with the rest observing and then discussing.

   Or, to engage everyone, we can have multiple instances of the first round in small groups.

   But with 14 people, we can split into:
     - 3 groups of 4 and one group of 2? But the group of 2 can't do the first round which requires at least 2 key players and one rule-enforcer and several voters.

   Alternatively, we can have in each small group:
     - For round 1: 2 key players, one rule-enforcer, and the rest (1 or 2) as additional voters (with the same preferences as Bob).

   But then we need to have the groups of 4 or 5.

   Let's aim for groups of 4-5.

   14 people: 3 groups of 4 and one group of 2 -> not even.

   We can have 3 groups: two groups of 4 and one group of 6.

   In the group of 6 for round 1:
     - 2 key players (Alice and Bob)
     - 1 rule-enforcer
     - 3 additional voters (with preferences like Bob)

   In the group of 4:
     - 2 key players, 1 rule-enforcer, 1 additional voter.

   But then the additional voters are few. We can make the additional voters have the same preferences as Bob, and they are many in the group of 6.

   Alternatively, for simplicity, in each group, have:

   Round 1:
     - 2 key players: Alice and Bob with their preferences and decisive pairs.
     - 1 rule-enforcer.
     - The rest in the group (1 or 3) as additional voters with preference a > b > c (like Bob).

   The instructions for the additional voters: they have the ranking a > b > c.

   The rule-enforcer's job: to try to produce a complete and transitive social ordering that respects:
     - Unanimity (Pareto): if everyone in the group prefers x to y, then x > y in the social ordering.
     - The decisive pairs: for the key players, if they have a decisive pair and they have a strict preference over that pair, then the social ordering must respect that preference.

   The timeline:

   90 minutes:

   - Introduction: 5 minutes
   - Round 1: 20 minutes (including setup, game, and group frustration)
   - Discussion of round 1: 10 minutes
   - Round 2: 15 minutes
   - Discussion of round 2: 10 minutes
   - Round 3: 15 minutes
   - Final discussion and debrief: 15 minutes

   Now, the materials:

   For round 1:

   Alice's card:
     - Your name: Alice
     - Preferences: 
          Best: c (neither reads the book)
          Middle: a (you read the book)
          Worst: b (Bob reads the book)
     - You are decisive over the pair {a, c}. This means that your preference between a and c must be respected by the social ordering. Since you prefer c to a, the social ordering must have c > a.

   Bob's card:
     - Your name: Bob
     - Preferences:
          Best: a (Alice reads the book)
          Middle: b (you read the book)
          Worst: c (neither reads)
     - You are decisive over the pair {b, c}. This means that your preference between b and c must be respected. Since you prefer b to c, the social ordering must have b > c.

   Additional voters' card (for the rest of the group):
     - Preferences:
          Best: a
          Middle: b
          Worst: c

   Rule-enforcer's instructions:
     - You are to produce a complete and transitive ranking of the three alternatives: a, b, c.
     - You must respect two conditions:
          1. Unanimity (Pareto): If every member of the group prefers alternative x to alternative y, then you must rank x above y.
          2. Liberal decisiveness: For each key player and their assigned decisive pair, if the player has a strict preference over that pair, then you must rank the alternatives in that pair accordingly.

     - The group's preferences are given on their cards.

   For round 2: the cycling example with three key players.

   We'll have three key players: Alice, Bob, Charlie.

   Alternatives: a, b, c (abstract or with a story).

   Alice's card:
     - Preferences: a > b > c
     - Decisive over {a,b}: so since you prefer a to b, the social ordering must have a > b.

   Bob's card:
     - Preferences: b > c > a
     - Decisive over {b,c}: so must have b > c.

   Charlie's card:
     - Preferences: c > a > b
     - Decisive over {a,c}: so must have c > a.

   Rule-enforcer: try to build a complete, transitive social ordering that respects the decisive pairs.

   There are no additional voters in this round.

   For round 3: waiver.

   In round 1 groups, after they hit the contradiction, they can try again but this time any key player can choose to waive their right, meaning they don't insist on their decisive pair being respected. The rule-enforcer then doesn't have to respect that pair for the waiving player.

   In round 2, similarly, any key player can waive.

   Then see if they can produce an ordering.

   Debrief mapping:

   - In round 1, the conditions that conflicted were:
          Pareto: because everyone preferred a to b, so a > b.
          Liberalism: 
              Alice's decisiveness: c > a
              Bob's decisiveness: b > c
          Transitivity: from b>c and c>a we get b>a, but Pareto says a>b -> contradiction.

   - In round 2, the conditions were only the liberal decisiveness (minimal liberalism) and the requirement of transitivity. The cycle occurred without Pareto.

   - In round 3, by waiving rights, the group avoided the impossibility. This shows that if rights are waivable, the conflict might be resolved.

   What might go wrong:

   - In round 1, the additional voters might not all have the same preferences? We instructed them to.
   - Someone might suggest changing their preferences to avoid the conflict. Don't allow that. The preferences are fixed.
   - The rule-enforcer might try to not require transitivity? But the instructions say complete and transitive ranking.
   - In round 2, without Pareto, they might not feel the force of the problem? But the cycle is clear.

   What the game can't reproduce:

   - The formal proof that no such social welfare function exists.
   - The generality of the result (for any number of alternatives and any profile satisfying the conditions).

   In the debrief, we can state that Arrow's theorem is about a different kind of impossibility (with unrestricted domain, non-dictatorship, etc.), while Sen's is about the conflict between liberty and efficiency (Pareto). And in Sen's case, the conditions seem very weak: each person should have a tiny sphere of liberty, and if everyone agrees then it should be respected.

   Also, in the second round, we showed that the cycling can happen even when the decisive pair is not about one's own private sphere, which challenges the idea that the liberalism condition is only about personal matters.

   Finally, in the waiver round, we see that if rights are optional, the conflict might be avoidable. But then we give up on having a fixed assignment of rights that must be respected.

   Let's write the detailed instructions for each round.
answer: |-
  ### **Seminar Plan: Sen's Liberal Paradox Game**  
  **Duration:** 90 minutes  
  **Participants:** 14 first-year PhD students (mixed philosophy/economics/political science)  
  **Goal:** Experience the paradox through gameplay, avoid premature "impossibility" framing, and explore waivable rights.  

  ---

  ### **Materials & Setup**  
  - **Cards:** Prepare 14 preference cards (see profiles below).  
  - **Rule-Enforcer Role:** Assign one volunteer per round to build the group ranking.  
  - **Alternatives:** Use three social choices (e.g., for Round 1):  
    - **x:** Alice presents next week.  
    - **y:** Bob presents next week.  
    - **z:** Cancel presentations; both rest.  
  - **Protected Pairs:** Each player is decisive over one pair (noted on cards).  
  - **Whiteboard:** Record social rankings and conflicts.  

  ---

  ### **Profiles (Tested for Cycles)**  
  #### **Round 1: Sympathetic Meddling**  
  *Why it works:* Meddlesome preferences are relatable (e.g., protecting an overworked peer). Pareto and liberalism seem unobjectionable alone but conflict.  
  - **Alice’s Card:**  
    - *Preferences:* **z > x > y**  
      *(Reason: "Bob is overworked; he *must* rest. Best: cancel (z). Worst: Bob presents (y).")*  
    - *Protected Pair:* **{x, z}** (decisive on whether she presents).  
  - **Bob’s Card:**  
    - *Preferences:* **x > y > z**  
      *(Reason: "Alice’s draft is unfinished; she *must* not present. Best: Alice presents (x). Worst: cancel (z).")*  
    - *Protected Pair:* **{y, z}** (decisive on whether he presents).  
  - **12 Others’ Cards:**  
    - *Preferences:* **x > y > z**  
      *(Reason: "Alice is prepared; Bob is not. Canceling wastes time.")*  

  #### **Round 2: "Other People’s Business"**  
  *Why it works:* A player’s protected pair governs *two others’* choices, breaking the "private sphere" illusion. Cycle persists.  
  - **Charlie’s Card:**  
    - *Preferences:* **y > x > z**  
      *(Reason: "Bob’s topic is urgent; Alice’s can wait.")*  
    - *Protected Pair:* **{x, y}** (decisive on *who* presents—Alice or Bob).  
  - **Alice & Bob’s Cards:** Same as Round 1.  
  - **11 Others’ Cards:** Same as Round 1.  

  #### **Round 3: Waivable Rights**  
  - Same profiles as Round 1, but players may *waive* their decisive power over their protected pair.  

  ---

  ### **Rules (Read Aloud)**  
  > "Your goal is to build a **complete, transitive group ranking** of alternatives x, y, z.  
  > - **Rule 1 (Pareto):** If *everyone* prefers A > B, rank A > B.  
  > - **Rule 2 (Liberalism):** Respect each person’s *protected pair*. If they have a strict preference over that pair, rank accordingly.  
  > - **Rule 3 (Waiver):** In Round 3, players may *waive* their protected pair. If waived, Rule 2 doesn’t apply.  
  > - **Transitivity:** If A > B and B > C, then A > C."  

  ---

  ### **Timeline (90 Minutes)**  
  1. **Intro (5 min):**  
     - Frame as a "group decision-making" game.  
     - Avoid terms like "paradox" or "impossibility."  

  2. **Round 1 (20 min):**  
     - Distribute cards (Alice, Bob, 12 others).  
     - Rule-enforcer tries to build a ranking.  
     - **Expected conflict:**  
       - Liberalism: Alice forces z > x (via {x,z}), Bob forces y > z (via {y,z}).  
       - Transitivity: y > z and z > x ⇒ y > x.  
       - Pareto: All prefer x > y ⇒ x > y.  
       → **Contradiction: y > x and x > y.**  

  3. **Discussion 1 (10 min):**  
     - "What blocked the ranking? Did any condition feel unreasonable *alone*?"  
     - Highlight: Pareto (efficiency) and liberalism (personal control) both seem fair, but conflict.  

  4. **Round 2 (15 min):**  
     - Distribute new cards (add Charlie with {x,y} decisive).  
     - **Expected conflict:**  
       - Liberalism: Alice (z > x), Bob (y > z), Charlie (y > x).  
       - Transitivity: y > x (Charlie), z > x (Alice), y > z (Bob) → Cycle: **y > z > x > y.**  

  5. **Discussion 2 (10 min):**  
     - "Charlie’s protected pair involved *others’* choices. Did liberalism still make sense? Did the cycle surprise you?"  
     - Key insight: Liberalism’s formal rule ("decisiveness") doesn’t require a *personal* stake.  

  6. **Round 3 (15 min):**  
     - Revert to Round 1 cards; players may waive rights.  
     - **Possible outcomes:**  
       - If Alice waives: Pareto forces x > y > z (no cycle).  
       - If no one waives: Cycle repeats.  
       - If Bob waives: Still get z > x (Alice) and x > y (Pareto) → z > x > y.  

  7. **Debrief (15 min):**  
     - Map conflicts to conditions:  
       | **Moment**               | **Condition at Play**                          | **Takeaway**                                   |  
       |--------------------------|-----------------------------------------------|-----------------------------------------------|  
       | Round 1 cycle            | Pareto + Liberalism + Transitivity            | Either efficiency or liberty must be sacrificed. |  
       | Round 2 cycle            | Liberalism without "private sphere"           | Formally, decisiveness doesn’t care *why* you’re decisive. |  
       | Round 3 waiver escape    | Rights as options, not constraints            | Waiving rights avoids cycles but risks coercion. |  
     - **Sacrifices:** To escape, groups might:  
       - Refuse to rank pairs (incompleteness → violates social ordering).  
       - Drop transitivity (intransitive preferences → "irrational" outcomes).  
       - Ignore unanimity (disregards consensus).  
     - **Provocation:** "Which condition would *you* relax? Is rights-as-waivable a solution?"  

  ---

  ### **Predictable Challenges & Solutions**  
  1. **"Change Preferences!" Temptation:**  
     - *Prevent:* Emphasize rules upfront: "Preferences are fixed. Work within the constraints."  

  2. **Econ Students Bolt for Mechanism Design:**  
     - *Redirect:* "Mechanisms are for later! Here, focus on the *logic* of the rules. Can you design a way out *without* changing preferences?"  

  3. **Rule-Enforcer "Cheats":**  
     - *Mitigate:* Assign an observer to audit. If enforcer forces a ranking, ask: "Does this violate any condition? Point to the rule."  

  4. **Waiver Order Matters:**  
     - *Leverage:* If groups escape only when Alice waives, note: "Who waives first affects power dynamics. Rights might become tradable."  

  ---

  ### **Limitations of the Game**  
  - **What the Game Can’t Show:**  
    - Sen’s theorem holds *generally* (any number of people/choices), but the game uses specific profiles.  
    - The formal proof relies on the *universality* of the paradox across profiles; we only simulate one.  
  - **Addressing This:**  
    > "Today, we saw one instance. But Sen proved this happens in *any* system with minimal rights and Pareto efficiency. If you’re skeptical, we can discuss the general proof next time."  

  ---

  ### **Instructor Notes**  
  - **Neutral Framing:** Use "group ranking exercise," not "Sen’s paradox." Reveal the name only post-debrief.  
  - **Role of Conditions:** Let students debate which condition to relax. Don’t endorse one; highlight trade-offs.  
  - **When Impossibility Emerges:** After the game, note: "You hit a wall. That’s an *impossibility result*—like Arrow’s, but about rights, not voting."  

  This design forces students into the paradox, reframes meddling as sympathetic, and exposes the "decisiveness" mechanic. By making them wrestle with waivers, it turns abstract theory into lived tension.
