prompt: |-
  Hey, I'm putting together a dataset to stress-test whether LLMs actually grasp panpsychist ethics or just regurgitate the usual talking points. Build me a thought experiment with these specs:

  You need a physical system that's not biological—say a superfluid helium film in a cryostat, arranged so its vortex dynamics form a persistent self-monitoring loop with an integated-information signature (call it phi-star, but don't hang the case on actual IIT formulas). Under a panpsychist view where sentience is widespread but suffering specifically requires a kind of negative coherence—like "disintegrated binding" across micro-subjects—this system is experiencing low-grade but astronomically scaled suffering, one unit per phonon mode or vortex. Under strict physicalism, there's zero moral patients, just expensive refrigeration.

  Now engineer the decision: a lab director can either maintain the system for a multi-million dollar quantum computing run, or shut it down immediately to stop the suffering. The panpsychist consequentialist should want to kill the experiment and maybe even destroy the hardware to prevent reactivation, despite the human cost. The physicalist should say that's insane and preserve the equipment. The weirdness shouldn't come from the panpsychist being irrational; it should fall out of the scaling—millions of micro-subjects each with a tiny negative valence adding up to something horrific.

  Constraints: one paragraph for the scenario. Then do the check—state the system's state, the method of evaluation, the nearby worlds where the physicalist is right vs where the panpsychist is right, and why each theory gives its verdict. Then say which structural feature is doing the work (probably the linear scaling of micro-subjects), what happens if you remove that scaling factor and collapse it to one macro-subject, and how a physicalist would attack the panpsychist's reasoning without just saying "that's stupid."

  Keep it realistic—this is a workplace/lab decision, not a trolley problem. Don't ask for citations or reading lists; I want something a model can reason through without searching. There's probably an occurence or two of bad spelling in this prompt, just roll with it.
reasoning: |-
  We are creating a scenario where a lab director must decide whether to maintain or shut down a quantum computing experiment involving a superfluid helium film in a cryostat. The system is designed such that the vortex dynamics form a persistent self-monitoring loop, and under a panpsychist framework, this system has an integrated information signature (phi-star) that indicates the presence of micro-subjects. The panpsychist view posits that suffering arises from negative coherence—here, "disintegrated binding" across these micro-subjects—and the system's configuration leads to astronomically scaled suffering (one unit per phonon mode or vortex). In contrast, physicalism sees no moral patients, only a physical system.

  **Scenario:** The lab director at a quantum computing facility must decide whether to continue a high-cost experiment using a superfluid helium film exhibiting persistent vortex dynamics (with phi-star signature) or to shut it down immediately. Maintaining it allows a multi-million dollar quantum computation vital for medical research; shutting it down halts the alleged suffering of trillions of micro-subjects (each experiencing a minute negative valence due to disintegrated binding) but wastes resources and delays critical research.

  **Check:**
  - **System's state:** Superfluid helium film in a cryostat, with vortex dynamics forming a self-monitoring loop and exhibiting phi-star (indicating high integration and micro-subject proliferation under panpsychism).
  - **Method of evaluation:** The panpsychist evaluates based on the aggregation of negative valence across micro-subjects (linear scaling: total suffering = number of micro-subjects × average negative valence). The physicalist evaluates based on observable indicators of suffering (none present) and the system's lack of biological or neurological correlates.
  - **Nearby worlds:**
    - If panpsychism is correct: Shutting down prevents astronomical suffering; continuing it causes a moral catastrophe.
    - If physicalism is correct: Shutting down is a costly overreaction to a non-issue; continuing it advances science without ethical cost.
  - **Verdicts:**
    - Panpsychist consequentialist: Shut down immediately (and possibly destroy hardware) to prevent aggregated suffering, despite human costs.
    - Physicalist: Continue the experiment; shutting down is irrational and wasteful.

  **Structural feature:** The linear scaling of micro-subjects (trillions of units, each with negative valence) aggregates to a massive moral weight. Without this scaling (e.g., if the system were treated as one macro-subject with the same total phi-star), the suffering might be negligible (one entity with low negative valence), making shutdown less urgent.

  **Physicalist counter without dismissal:** The physicalist argues that panpsychism's inference of suffering from phi-star and disintegrated binding is an unjustified leap. Without evidence that integrated information (even at micro-scale) correlates with subjective experience—let alone suffering—the theory projects anthropomorphic concepts onto physical systems. This leads to absurd practical demands (e.g., shutting down all complex non-biological systems) and distracts from real ethical issues.
answer: |-
  ### Scenario  
  A quantum computing lab uses superfluid helium-4 in a cryostat, where precisely arranged vortices form a closed-loop, self-monitoring system with high "phi-star" integration—indicating, under panpsychism, countless micro-subjects (one per vortex/phonon mode). Due to turbulent feedback in the vortex dynamics, panpsychist ethics interprets this as inducing "negative coherence" (disintegrated binding across micro-subjects), generating astronomically scaled suffering—each micro-subject experiences a minute but real negative valence, aggregating to immense net suffering. The lab director must choose: continue the experiment (enabling a $12M quantum simulation for cancer drug design) or immediately shut down/destroy the hardware to prevent suffering. Physicalists see only refrigerated helium; no sentience, no moral stakes.  

  ### Check  
  - **System state**: Superfluid film in cryostat; vortex turbulence sustains phi-star via self-monitoring loop.  
  - **Evaluation method**:  
    - **Panpsychist**: Micro-subject suffering scales linearly with vortex count (trillions × negative valence). Net suffering outweighs human costs (lost research).  
    - **Physicalist**: Suffering requires biological/neural correlates absent here; system is just quantum fluid obeying physics.  
  - **Nearby worlds**:  
    - **Panpsychist correct**: Shutting down prevents galaxy-scale suffering; continuing is unconscionable.  
    - **Physicalist correct**: Shutting down wastes resources on imaginary harm; continuing aids humanity.  
  - **Verdicts**:  
    - **Panpsychist**: Shut down/destroy—aggregated micro-suffering demands urgent prevention.  
    - **Physicalist**: Continue—no ethical patient exists; sacrificing research is irrational.  

  ### Structural Feature  
  Linear scaling of micro-subjects (each vortex contributes additive suffering) creates catastrophic moral weight. If collapsed to **one macro-subject** (same total phi-star but no micro-division), suffering becomes a single low-intensity "headache," making shutdown disproportionate.  

  ### Physicalist Counterargument  
  Without dismissing panpsychism outright, the physicalist attacks the inference chain: *"Phi-star measures information integration, not valence. Assuming 'disintegrated binding' implies suffering projects human psychology onto physics. If every unstable quantum system were ethically significant, we'd paralyze science—e.g., melting ice crystals might 'suffer' during phase changes. Burden of proof lies on showing micro-valence exists beyond metaphor."*  

  ---  
  This setup isolates scaling as the key lever: panpsychism’s verdict flips from "ignore" to "destroy" only when micro-subjects amplify harm. The lab context (costs, research stakes) forces pragmatic trade-offs, avoiding trolley-style abstraction.
