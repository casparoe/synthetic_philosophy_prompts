              *   **Strict Dominance:** Since B2 yields strictly less than B3 when Aris plays A1, and the same as B3 when Aris plays A3, **B2 is strictly dominated by B3**.
          *   **Eliminate B2.**
      4.  Only strategies left: Aris: A1, A3; Bianca: B3.
      5.  **Aris faces Bianca playing B3 (Reject):**
          *   A1: Rejection (A1+B3) -> Payoff = **Moderate-Low (ML)** (from refined payoff).
          *   A3: Rejection (A3+B3) -> Payoff = **Low (L)**.
          *   Since ML > L, **A3 is strictly dominated by A1**. **Eliminate A3.**
      6.  **Unique Outcome:** Aris plays **A1 (Approve Unrestricted)**, Bianca plays **B3 (Reject)**, resulting in **Rejection**.

  **(3) Structural Feature Causing Divergence:**
  The divergence occurs because the expected payoff penalty making Aris's A2 (middle option) undesirable only materializes under the *specific pattern of uncertainty* created by Bianca potentially playing B1 (Approve Unrestricted) with probability **p = 0.4** (matching the audit probability) and B3 (Reject) with probability **0.6**. Under any *single* pure strategy Bianca could play (B1, B2, or B3), A2 was not strictly worse than both A1 and A3 simultaneously. The probabilistic combination mimicking the institutional audit risk creates a scenario where A2's disadvantages (e.g., appearing weak if rejected) are exposed relative to A1's advantage (appearing resolute even if rejected) *in expectation*, without any single Bianca action revealing this weakness deterministically. The **interaction** is between the audit probability weight (p=0.4) defining Bianca's mixed strategy and the specific payoff differential for Aris between "rejected after voting A1" (ML) and "rejected after voting A2" (L).

  **(4) Rationalizability Verdict & Ordering Independence:**
  *   **Pure-Strategy Rationalizability:** Surviving strategies are those not eliminated by pure-strategy IESD: Aris (A1, A2, A3), Bianca (B2, B3). Multiple outcomes are possible (e.g., A2+B2 = Restricted Approval, A1+B3 = Rejection, etc.).
  *   **Full (Mixed-Strategy) Rationalizability:** The unique surviving strategy profile is (A1, B3) leading to Rejection.
  *   **Disadvantage & Ordering Independence:** The outcome (Rejection) is disadvantageous for Aris (he gets ML, worse than Restricted Approval - Moderate - which was achievable under pure rationalizability with A2+B2). This is not an artifact of elimination ordering. The mixed strategy σ_B = (0.4 B1, 0.6 B3) is a rationalizable belief for Aris (it's a best response to some belief about Aris, though complex). Crucially, once Aris recognizes that Bianca *might* play such a mix (which replicates the institutional uncertainty), A2 becomes inferior to A1 *given that belief*. Removing A2 is thus justified under common knowledge of rationality allowing mixed strategies. Bianca, anticipating Aris won't play A2, finds B3 strictly dominates B2 against Aris's remaining strategies (A1, A3), leading to B3. Aris then prefers A1 over A3 against B3. The sequence is driven by the dominance relationships enabled by mixed strategies, not by the order of elimination.

  **(5) Removing Probabilistic Veto & Defense of Pure Rationalizability:**
  *   **Collapse to Standard Case:** If the probabilistic audit/veto is removed (p=0 or p=1), the strategic uncertainty it creates vanishes.
      *   **If p=0 (No Veto Possible):** Bianca's catastrophic payoff for Unrestricted Approval disappears. Her highest payoff is Rejection (B3), followed closely by Restricted Approval (B2), and worst is Unrestricted Approval (B1). B1 is likely dominated. Aris strictly prefers any approval (A1 or A2) over rejection (A3). Pure strategy IESD likely eliminates B1 and A3, leaving negotiation between (A1, A2) and (B2, B3). Restricted Approval (A2+B2) is a natural pure-strategy equilibrium. Mixed strategies aren't needed.
      *   **If p=1 (Veto Certain if Unrestricted):** Unrestricted Approval is impossible (veto always). Bianca only fears Unrestricted Approval if she votes for it (B1). B1 is strictly dominated (leads to catastrophe or worse outcomes). Aris knows approval requires restrictions (A2+B2) or it will be rejected/vetoed. A1 is strictly dominated (always leads to rejection/veto - Low). Pure strategy IESD eliminates B1 and A1, leaving (A2) and (B2, B3). B2 likely dominates B3 if Aris plays A2 (Restricted Approval > Rejection for Bianca). Unique outcome: Restricted Approval (A2+B2).
  *   **Defense of Pure Rationalizability:** A defender of pure-strategy rationalizability could argue that full mixed-strategy rationalizability imports an unrealistic degree of strategic randomization into committee deliberations. Members do not explicitly randomize their votes using known probabilities like p=0.4; they deliberate based on arguments, norms, and deterministic assessments of the situation. Beliefs are unlikely to crystallize around the precise mixed strategy replicating the external audit probability. Assuming members best-respond only to *pure* strategies of others, or perhaps to coarse beliefs, better reflects the bounded rationality and focus on concrete proposals in such settings. The persistence of Aris's middle option (A2) under pure rationalizability captures the plausible scenario where compromise remains viable because members aren't modeling each other as deploying lottery-based strategies mirroring institutional randomness. The unique mixed-strategy equilibrium (Rejection) might seem counterintuitive or overly pessimistic compared to the compromise outcome sustained under pure-strategy analysis.
