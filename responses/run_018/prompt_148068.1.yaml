prompt: |-
  After a lengthy debate with a colleague about distributive justice, I find myself unable to reconcile my own judgments about several societies I might enter behind a veil of ignorance. I want to know whether there is a single principle that captures all of them, or whether I must abandon one.

  Consider these five institutional arrangements, evaluated without knowing which position I will occupy.

  First, society Alpha maintains perfect equality of income and social status, but because incentives for productivity are absent, the worst-off live at bare subsistence with minimal healthcare and education. I judge this unacceptable.

  Second, society Beta permits large income disparities—some earn fifty times what others earn—but only if those disparities arise from differences in productive contribution and effort, and the worst-off enjoy substantially greater absolute resources (excellent healthcare, education, leisure) than in Alpha. I judge this acceptable, indeed preferable to Alpha.

  Third, society Gamma has the exact same absolute condition for the worst-off as Beta, and the same income ratios, but the disparities are inherited: capital and professional credentials pass almost entirely within families, and intergenerational mobility is near zero. Despite the identical bottom-line welfare, I find Gamma unacceptable in a way Beta is not.

  Fourth, society Delta enforces near-complete equality in daily consumption, but allows a small group of risk-takers in medical and environmental research to accumulate vast rewards, provided that 100 percent of those rewards are taxed away and converted into universal public goods that disproportionately benefit the worst-off. The worst-off are slightly better off than in Beta. I judge Delta acceptable.

  Fifth, society Epsilon mirrors Delta's structure—same tax rate, same worst-off welfare—but the rewards flow not from research outcomes but from zero-sum financial speculation that produces no social benefit. The worst-off are no worse off than in Delta, yet I feel Epsilon should be rejected, though I struggle to say exactly why without smuggling in a judgment about desert or naturalness that I claim to have bracketed behind the veil.

  So my pattern is: reject Alpha, accept Beta, reject Gamma despite matching Beta's bottom line, accept Delta, and reject Epsilon despite matching Delta's bottom line. Is there one principle—perhaps a refined difference principle with an added constraint about the source or legitimacy of inequalities, or perhaps a prioritarian rule with a side-condition about mobility and social meaning—that delivers all five verdicts? If not, which verdict should I overturn, and what does the cleaner principle predict for a case I have not listed: a society where the worst-off are maximally well-off, but only because an unaccountable algorithm assigns every individual to a social role at birth, with no possibility of appeal?

  Please state the principle precisely, identify which of my judgments it cannot accommodate, and explain what it predicts for the algorithmic-assignment society.
reasoning: |-
  Hmm, this user presents an intricate moral puzzle about distributive justice through five hypothetical societies. The core tension lies in reconciling seemingly contradictory intuitions about equality, incentives, and the moral legitimacy of inequality sources. 

  User's judgments reveal three key dimensions beyond Rawlsian metrics: (1) the procedural justice of how advantages arise (merit vs inheritance), (2) the social value of activity generating inequalities (productive innovation vs rent-seeking), and (3) the relational aspect of status (disparities feel less oppressive when open to all). The Gamma-Epsilon contrast is particularly telling - identical outcomes feel morally distinct based on whether advantages reflect contribution or extraction.

  Notably, user explicitly rejects desert-based arguments, which makes the Epsilon rejection challenging to justify. The discomfort likely stems from financial speculation representing what philosophers call "justice-independent positional goods" - gains derived from social structures rather than added value. 

  For the algorithmic society, I suspect user would reject it despite maximized welfare. The assignment mechanism violates autonomy in ways that trigger similar unease as Gamma's inheritance - both deny agency in life outcomes. This points to an unstated premise: justice requires some domain where individuals can shape their social position through effort or choice.

  The proposed Opportunity-Purposive Difference Principle elegantly handles all cases by demanding three conditions: (1) maxi-min welfare, (2) inequalities tied to opportunity-open positions, and (3) socially purposive activities. It condemns Alpha (fails condition 1), Gamma (fails 2), Epsilon (fails 3), while endorsing Beta and Delta. 

  User should consider whether condition 3 is truly necessary or if Epsilon's rejection stems from condition 2 (speculators don't hold "positions" open to all). If maintaining bracketed desert claims is paramount, reframing condition 3 as "avoiding socially corrosive activities" might preserve intuitions without invoking merit.
answer: |-
  Your thoughtful analysis reveals a consistent pattern that Rawls' difference principle alone cannot capture, but a **"Multi-Conditional Opportunity-Purposive Difference Principle"** accommodates all five judgments:

  **Principle:**  
  *Inequalities are permissible only if they:  
  (a) Maximally improve the absolute position of the worst-off group (Difference Principle core);  
  (b) Are attached to positions open to all under conditions of fair equality of opportunity;  
  (c) Arise from activities that generate net positive social value (i.e., expand social utility rather than merely redistributing it).*

  ---

  ### **Application to Your Cases:**
  1. **Alpha** (Rejected):  
     - Fails (a): Worst-off at subsistence, not maximally improved.  
     *(Principle aligns with your rejection.)*

  2. **Beta** (Accepted):  
     - Satisfies (a): Worst-off have excellent resources.  
     - Satisfies (b): Inequalities tied to effort/contribution (positions open).  
     - Satisfies (c): Disparities arise from productive labor (net social value).  
     *(Aligned.)*

  3. **Gamma** (Rejected despite matching Beta's outcomes):  
     - Fails (b): Positions not open (inheritance blocks fair equality of opportunity).  
     *(Principle justifies rejection even with identical welfare.)*

  4. **Delta** (Accepted):  
     - Satisfies (a): Worst-off slightly better than Beta.  
     - Satisfies (b): Research roles are open (anyone can attempt innovation).  
     - Satisfies (c): Rewards fund public goods (net positive value).  
     *(Aligned.)*

  5. **Epsilon** (Rejected despite matching Delta's outcomes):  
     - Fails (c): Zero-sum speculation produces no net social value (merely redistributes wealth).  
     *(Principle explains rejection without invoking desert—focuses on social utility creation.)*

  ---

  ### **The Algorithmic-Assignment Society:**
  - **Setup:** Worst-off maximally well-off, but roles assigned at birth by unaccountable algorithm with no appeal.  
  - **Verdict:** **REJECTED** by the principle.  
    - Satisfies (a): Worst-off are maximally advantaged.  
    - **Fails (b):** No fair equality of opportunity (no open positions; assignments are fixed and unchallengeable).  
    - Likely fails (c): Algorithmic assignment itself produces no social value (merely allocates roles).  

  This society violates the **agency and opportunity** condition (b), rendering it unjust despite material outcomes. Your intuition likely rejects it for the same reason Gamma is rejected: it denies individuals the chance to shape their lives.

  ---

  ### **Why This Works:**
  - **Condition (b)** resolves the Beta/Gamma divergence by requiring *procedural fairness* in accessing advantaged positions.  
  - **Condition (c)** resolves the Delta/Epsilon divergence by filtering inequalities based on *social value creation* (not subjective "desert").  
  - Rawls’ focus on outcomes alone is augmented with constraints on *how* inequalities emerge.

  ### **If You Insist on a Single-Aspect Principle:**
  You must overturn **Epsilon’s rejection**. A pure outcome-focused prioritarianism (or Rawls without added constraints) would accept Epsilon since the worst-off are identical to Delta. However, this contradicts your intuition that *source matters*—a defensible stance given Condition (c)’s emphasis on value creation.

  ---

  ### **Final Insight:**
  Your judgments reflect a **tripartite commitment**:  
  1. **Sufficiency** (reject Alpha),  
  2. **Meritocratic access** (reject Gamma),  
  3. **Productive justice** (reject Epsilon).  
  The proposed principle systematizes this while preserving core Rawlsian priorities. The algorithmic society fails because it commodifies human agency—a betrayal of the liberal premise underlying the veil of ignorance itself.
