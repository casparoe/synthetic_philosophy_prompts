answer: |-
  Here is the conceptual structure in five numbered points:  

  1. **Dirty-handed action** entails violating a fundamental moral principle for a greater good, whereas **ordinary pragmatic compromise** involves balancing legitimate interests without core ethical breaches.  
  2. **Undoing the harm** may mitigate consequences but does not erase the original moral residue, as the wrongful intent or violation persists like an indelible transaction record; irreversibility intensifies but does not solely constitute the stain.  
  3. A leader **inherits moral contamination** by authorizing the act, as delegation does not absolve responsibility for initiating the harm—causal and command accountability maintain the stain.  
  4. **Public confession** acknowledges the burden and honors the violated norm, making the stain ethically visible, but it functions as **moral laundering** if treated as transactional absolution rather than genuine reckoning.  
  5. Resolving the problem **requires distinct role morality**, as standard ethical frameworks cannot fully reconcile the unique obligations and tragic choices inherent to political office.
