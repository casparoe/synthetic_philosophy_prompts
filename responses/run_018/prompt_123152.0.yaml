prompt: |-
  hey, I'm a grad student in history writing my thesis chapter on 18th-century maritime insurance contracts, specifically how underwriters handled so-called "moral hazard" when captains lost cargo. I keep getting feedback that I'm judging these 1700s guys by modern risk-ethics without noticing — like calling a refusal to pay "unfair" when that concept barely maps onto their world. I'm taking a course on philosophy of history and I find the presentism stuff confusing in practice, not in theory. Can you help?

  Please act like you're both a professional historiographer and a philosophy-of-history consultant. Before you write the actual tool, do a quick brainstorm: think through the difference between descriptive anachronism (using modern terms) and this middle-zone thing I keep bumping into, which I guess I'll call "normative framing leakage" — where you don't use anachronistic words, but the way you organize causes and blame still makes modern values the hidden referee. I want you to turn all that into a reusable decision procedure I can run on every paragraph of my draft. Fix the role: I'm a junior researcher with a deadline tommorow, no libary access, and my advisor has to sign off.

  The deliverable should be a step-by-step checklist or flowchart in words: ordered questions I ask about each passage, what counts as passing, where it stops with "rewrite immediately," where it stops with "this is a values call, flag it for your advisor," and where it's genuinely unfixable. Make it handle hard cases — especially where describing a decision as "consistent with period norms" still smuggles in modern approval of those norms. Apply it to two worked examples: (1) describing a 1750s underwriter's refusal to pay a captain as "unfair risk-shifting onto sailors," and (2) describing the exact same refusal as "aligned with contemporary contractual expectations." One should come out clean and one should trip the alarm, but I want you to explicitly note the case where the procedure gives an answer I probably won't like. Be honest about what the procedure can't do. Write everything in American English, don't give me a bibliography or reading list — I can't search for books tonight — and please think carefully, maybe start with a short brainstorm list.
reasoning: |-
  Okay, the user is a grad student in history working on their thesis chapter about 18th-century maritime insurance contracts. They're struggling with presentism—judging historical actions by modern standards. Specifically, they keep getting feedback that they're framing things like "unfairness" in a way that doesn't align with the period's norms. They need a practical tool to check their writing for this bias, especially since their deadline is tomorrow and they can't access the library.

  First, I need to understand their core problem. The feedback points to "normative framing leakage," where even if they avoid modern terms, their analysis still implies modern judgments. They mentioned two examples: one using "unfair risk-shifting" (which is problematic) and another saying "aligned with contemporary contractual expectations" (which seems better). But they want a method to catch subtle cases where describing something as consistent with period norms might still imply approval.

  The user is stressed—deadline tomorrow, no library access, advisor sign-off needed. They need something actionable, not theoretical. A step-by-step checklist they can apply paragraph by paragraph makes sense. It has to be efficient and handle edge cases. Also, they want honesty about limitations, especially where the tool might give answers they don't like.

  Breaking down the key issues: Descriptive anachronism (using modern words) is easier to spot. The tougher part is normative leakage. For instance, saying something was "consistent with norms" might still carry a tone of endorsement if not framed carefully. The user's deeper need is to present historical actors on their own terms without unconscious modern bias, which is crucial for academic rigor.

  I recall historiography concepts like Quentin Skinner's emphasis on intentionality and context. The checklist should force the user to verify if their descriptions reflect period-specific values, evidenced by primary sources. It should flag any moral judgments, explicit or implied. 

  For the examples: "Unfair risk-shifting" clearly trips the alarm because "unfair" is a modern moral judgment. "Aligned with contemporary expectations" seems okay, but I need to check if it subtly approves those norms. Words like "aligned" are neutral, but if paired with positive language, it might imply endorsement. So the procedure must scrutinize not just words but the framing's neutrality.

  The user also needs to know when to stop and consult their advisor—like when the analysis requires nuanced value judgments about the period that aren't clear-cut. And honestly, some biases might be hard to eliminate completely; the tool can only minimize them.

  Structuring the checklist: Start with identifying judgments, then check language, then context evidence, then framing neutrality. End with a "values call" step for ambiguous cases. Must be clear about rewrite vs. flag vs. unfixable.

  Finally, the user might resist if the tool flags their analytical framing as problematic. Being upfront about that builds trust. Emphasizing that neutrality doesn't mean ignoring injustice—just contextualizing it—is key. They need to separate historical analysis from moral evaluation, which is tough but essential.
answer: |-
  Here's a streamlined decision procedure designed to catch both descriptive anachronism and normative framing leakage, built for speed and practicality. I've brainstormed the core pitfalls first:

  **Brainstormed Pitfalls:**
  1.  **Descriptive Anachronism:** Using modern terms/concepts absent in the period (e.g., "insurance fraud," "risk management strategy," "CEO," "profit margin").
  2.  **Explicit Normative Leakage:** Using modern moral/judgmental terms (e.g., "unfair," "exploitative," "progressive," "backward," "negligent" implying modern duty of care).
  3.  **Implicit Normative Leakage (The Hard Part):**
      *   Framing historical actions *primarily* through their negative/positive consequences by *modern* standards.
      *   Implying modern moral responsibility ("should have known," "failed to consider").
      *   Using language that subtly approves/disapproves *even while stating period norms* (e.g., "merely followed convention," "only adhered to," "surprisingly equitable").
      *   Organizing the narrative to implicitly cast historical actors as villains/heroes by modern lights.
      *   Assuming modern concepts of fairness, justice, or efficiency were operative goals.
  4.  **The "Consistent with Norms" Trap:** Describing an action as consistent with period norms is descriptive *unless* the wording or context implies the norm itself was good/bad ("brutal but accepted norms," "surprisingly fair for the time," "merely standard practice").

  ---

  **Presentism Detection Checklist (Run on each analytical paragraph):**

  Ask these questions **in order**. Stop at the first "Rewrite" or "Flag" instruction.

  1.  **Are there any overtly modern *technical* or *institutional* terms?** (e.g., "insurance fraud," "bankruptcy protection," "risk assessment algorithm," "shareholder value").
      *   **Pass:** No modern terms. → Go to Q2.
      *   **Rewrite Immediately:** Replace with period-appropriate language based on your sources (e.g., "deceit," "failure," "spreading risk," "venture profitability"). Cite a source term if possible.

  2.  **Are there any overtly modern *moral/judgmental* terms?** (e.g., "unfair," "exploitative," "unethical," "progressive," "regressive," "responsible/irresponsible" implying modern standards, "negligent" implying modern duty).
      *   **Pass:** No such terms. → Go to Q3.
      *   **Rewrite Immediately:** Remove the judgmental word. Restate the *fact* neutrally using period concepts (e.g., "violated the policy terms," "was contrary to common underwriting practice," "exceeded the customary authority granted"). Save your critique for the explicit analysis section.

  3.  **Does the passage explain *why* historical actors acted as they did, using *their* stated reasons, incentives, or contemporary frameworks?** (e.g., citing clauses in policies, court rulings, mercantilist principles, notions of honor/credit, contemporary economic theory, religious beliefs about Providence, established custom).
      *   **Pass:** Yes, explicitly grounded in period-specific evidence/language. → Go to Q4.
      *   **Rewrite Immediately:** Add explanation rooted in contemporary sources/frameworks. *Show* the reader *their* logic, don't just describe the outcome. (e.g., "Underwriters cited Clause X of the standard policy, which voided coverage if...", "Common law precedent held masters personally liable for...", "Prevailing mercantile opinion viewed cargo loss due to... as a master's risk").

  4.  **Is the *organizing principle* or *implied causality* of the passage based on modern values?** Check for:
      *   Framing actions mainly by their negative impact on groups valued highly today (e.g., sailors, the poor) without balancing the *contemporary* perspective on their status/agency.
      *   Assuming modern goals (e.g., efficiency, fairness, social welfare) were primary motivations.
      *   Language implying modern moral agency ("they failed to recognize," "ignored the plight of," "prioritized profit over safety").
      *   Tone conveying approval/disapproval of the *norm itself* even when describing it ("this harsh practice," "this enlightened approach," "merely standard procedure," "surprisingly equitable").
      *   **Pass:** The narrative structure and implied causality focus on reconstructing the historical actors' world, reasons, and consequences *as they likely understood them*. Language is neutral/descriptive regarding the norms themselves. → **Pass. Paragraph is likely clean.**
      *   **Flag for Advisor:** The analysis hinges on a complex interplay of period norms and their consequences, or requires a nuanced judgment about the *relative* nature of values within the period itself. (e.g., "While consistent with contractual norms, this practice increasingly drew criticism *within* mercantile circles by the 1770s for destabilizing trust..." - This needs careful sourcing to avoid implying it was "progress").
      *   **Rewrite Immediately:** The frame is implicitly modern. Restructure to center the historical context and actors' perspectives. Replace value-laden causal links with period-appropriate ones. Neutralize tone regarding norms. (e.g., Instead of "This refusal unfairly shifted risk onto vulnerable sailors," try "This refusal placed the financial burden directly on the master and crew, consistent with the prevailing view of the master's paramount responsibility for cargo safety, as codified in policies and reinforced by Admiralty rulings like [Case].").

  5.  **Is the passage attempting a *direct moral evaluation* of historical actors/actions by modern standards?**
      *   **This is Genuinely Unfixable (In Descriptive Analysis):** This belongs in a separate, explicitly labeled section on *your* historical interpretation or the legacy of these practices. It cannot be part of the descriptive historical reconstruction without presentism. **Move it** to your conclusion or analytical reflection section. Label it clearly as your modern perspective.

  ---

  **Worked Examples:**

  1.  **Original:** "When Captain Evans lost the tea cargo to poor navigation in 1754, Lloyd's underwriters refused his claim. This was **unfair risk-shifting onto the sailors**, who bore no responsibility for his errors."
      *   **Q1:** Pass (No modern tech terms).
      *   **Q2:** **REWRITE IMMEDIATELY.** "Unfair" is an overt modern moral judgment. "Risk-shifting" is borderline anachronistic but might pass if carefully sourced; "unfair" condemns it.
      *   **Rewrite Suggestion:** "When Captain Evans lost the tea cargo due to navigational errors in 1754, Lloyd's underwriters refused his claim. Standard policy language and contemporary legal doctrine held the ship's master personally liable for losses arising from errors in navigation, placing the financial burden ultimately on him and his crew."

  2.  **Original:** "The underwriters' refusal to pay Captain Evans in 1754 for the lost tea cargo **was aligned with contemporary contractual expectations**."
      *   **Q1:** Pass.
      *   **Q2:** Pass ("aligned with" is descriptive, not overtly moral).
      *   **Q3:** **REWRITE IMMEDIATELY (or potentially FLAG).** It *states* alignment but doesn't *show* it using period concepts. It risks being a shallow assertion. *Why* was it aligned? What specific expectations? Needs grounding.
      *   **Rewrite Suggestion (Passes Q3):** "The underwriters' refusal to pay Captain Evans in 1754 for the tea cargo lost due to navigation was **aligned with contemporary contractual expectations, specifically the standard 'Inchmaree' clause variant common at Lloyd's which excluded coverage for losses stemming from 'neglect' or 'default' of the Master.**" (Now it cites a period mechanism).
      *   **The Tricky "Flag" Case:** If you wrote: "This refusal, **while harsh by modern standards,** was aligned with contemporary contractual expectations." Adding the "harsh" comparison **FLAGS it for Advisor**. It's introducing a modern moral frame *alongside* the descriptive one, potentially undermining the neutrality. Is the comparison necessary *here*? Probably better saved for explicit analysis later.

  **Honest Limitations & Unlikable Answers:**

  *   **What it Can't Do:** Guarantee perfect objectivity (impossible), resolve deep historiographical debates about interpreting motives, or write your thesis for you. It flags *potential* leaks; *you* must fix them using your knowledge.
  *   **The Answer You Might Not Like:** **Flag for Advisor.** This often means your analysis is touching on a genuinely complex historical question of values, change over time within the period, or conflicting contemporary viewpoints. The procedure says "This needs expert nuance beyond a simple rewrite." It demands you either significantly deepen the context (if possible before deadline) or get your advisor's input on framing. This might feel frustrating when you think you've been descriptive enough.
  *   **"Genuinely Unfixable":** This forces you to separate *description* from *your explicit moral/historical judgment*. You might *want* to condemn the practice throughout, but the procedure insists that condemnation belongs in a designated space, not woven into the historical narrative. This protects the integrity of your reconstruction.

  **Use this Tonight:**

  1.  **Print or have this checklist visible.**
  2.  **Go paragraph by paragraph** in your draft, focusing on analytical sections describing actions, decisions, and causes.
  3.  **Ask each question in order.** Stop and fix/flag as instructed.
  4.  **Be ruthless on Q2 & Q4.** These are your main leaks.
  5.  **Don't agonize over "Flag" paragraphs tonight.** Highlight them and note "Advisor: Framing/Values Check Needed."
  6.  **Move any Q5 moral evaluations** to your conclusion/reflection section immediately.
  7.  **For "Rewrite Immediately":** Focus on stating the *what* and the *contemporary why* neutrally. Cite a source term or concept if you can recall one.

  This forces you to constantly ask: "Am I explaining *their* world, or judging it by mine?" Good luck with the deadline!
