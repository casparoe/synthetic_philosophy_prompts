      - What went wrong? (e.g., groups were risk-averse and chose conservative too often, missing out on bonuses; or coordination failed because they didn't talk enough)
      - How did the skeptic role work? Did it help voice the tension?

  Materials to prepare:

  - Evidence cards (round1, round2, round3) for each group.
  - Proposal templates for each round (conservative and scaffolding) for each group.
  - Decision sheets for each round (with space to record choice and model if applicable).
  - Scoreboard (poster or whiteboard) with columns for group names and rounds, and rows for individual points and bonuses.
  - Rules sheet for each group.

  Example evidence card (round1):

  Title: Spread of Innovation in Networked Communities
  Evidence:
  - Data from a study of 50 villages shows that adoption of a new agricultural technique varied between 10% and 90%.
  - The villages have different network structures (some with many ties, some with few) and different distributions of farmer characteristics (wealth, education).
  - The data is noisy: some villages with similar network structures and farmer characteristics had very different adoption rates.

  Conservative proposal:
  "We use a precise statistical model that accounts for all variables without simplification. This minimizes the risk of false positives and gives precise estimates of the effect of each factor."
  Accuracy points: 10

  Scaffolding proposal:
  "We adopt a simplifying model to focus on one key driver. Choose one:
   Model X: Network structure is the primary driver (ignore individual attributes beyond what is captured by the network).
   Model Y: Individual attributes are the primary driver (ignore network structure beyond the individual's immediate neighbors)."
  Note: Both models are known to be simplifications. For example, Model X ignores that two farmers with the same network position might adopt differently due to their attributes. Model Y ignores that two farmers with the same attributes might adopt differently due to their network position.
  Accuracy points: 5

  Similarly for round2 and round3, with new evidence that might complicate the picture.

  This design should create the desired tension and let the students experience the trade-off.
