  ### Structured 90-Minute Activity: Accuracy-First Epistemology vs. Scaffolding Beliefs  
  **Objective:** Students experience the tension between accuracy-first epistemology (belief value = correspondence with reality) and scaffolding beliefs (technically false/imprecise representations that enable coordination, inquiry, and research pathways) through rule-governed group choices.  

  ---

  #### **Materials**  
  1. **Evidence Cards** (3 identical sets, one per group): Describe a hypothetical complex phenomenon (e.g., "Social Dynamics of Techno-Adoption in Urban Networks").  
     - *Sample text for all rounds*: "Data shows adoption rates of a new technology vary widely across districts. Indicators include network density (noisy), income brackets (incomplete), and cultural attitudes (self-reported). Conflicting correlations observed; no clear causal model."  
  2. **Proposal Templates** (3 rounds, identical per group):  
     - **Conservative Proposal**: High accuracy score (e.g., 10 points), precise estimates, low false-positive risk. *Effect*: Ends group’s round; no further actions.  
     - **Scaffolding Proposal**: Lower accuracy score (e.g., 5 points), uses a simplifying model explicitly flagged as "technically false/imprecise" (e.g., "Assume cultural attitudes dominate network effects"). *Effect*: Unlocks 2–3 branching follow-up questions (e.g., "How do attitudes mediate network effects?").  
  3. **Decision Sheets** (one per group per round): Record choices (Conservative/Scaffolding) and selected branch (if applicable).  
  4. **Scoreboard** (visible to all):  
     - **Individual Points**: Linear accumulation (Conservative: +10; Scaffolding: +5 base).  
     - **Collective Bonus Points**: Multiplicative (unlocks only if ≥2 groups pick *compatible* scaffolding branches). Formula:  
       `Branch Bonus = (Number of Groups Choosing Branch) × (Round Multiplier)`  
       - Round 1 multiplier: 5  
       - Round 2 multiplier: 10  
       - Round 3 multiplier: 15  
     *(Example: 2 groups coordinate on Branch A in Round 1: Each gets 2 × 5 = 10 bonus points.)*  
  5. **Role Cards**: Assign one "skeptic" per group to advocate for accuracy-first.  

  ---

  #### **Timeline** (Total: 90 Minutes)  
  **0–10 min: Setup & Rules**  
  - Divide 12 students into 3 groups (4 students each).  
  - Assign roles: 1 skeptic/group (argues for conservative choices).  
  - Explain rules:  
    - Each group is a "research collective" sharing a point pool.  
    - **Conservative Proposal**: High accuracy points, ends round.  
    - **Scaffolding Proposal**: Lower accuracy points, unlocks branches for bonus opportunities.  
    - **Collective Bonuses**: Multiplicative, require ≥2 groups with compatible branches.  
    - **Renegotiation**: After Round 2, groups may revise scaffolding branches but deduct 10 accuracy points.  
  - Display scoreboard and payoff formula.  

  **10–15 min: Practice Round**  
  - Groups receive simplified evidence cards and mock proposals (no points at stake).  
  - Goal: Practice choosing proposals/branches, understand bonus mechanics.  
  - Facilitator clarifies misunderstandings (e.g., "Multiplicative bonuses reward coordination, not trickery").  

  **15–30 min: Round 1**  
  - Groups receive identical evidence cards and proposal templates.  
  - **15 min**: Discuss/choose proposals.  
    - *Skeptic* voices accuracy-first concerns (e.g., "Why accept a false model?").  
  - Record choices: Conservative groups get +10 points. Scaffolding groups get +5 base + branch selection.  
  - **Calculate bonuses**: Apply if ≥2 groups share a branch (e.g., 2 groups on Branch X: 2 × 5 = 10 bonus each).  
  - Update scoreboard.  

  **30–35 min: Inter-Round Negotiation**  
  - Groups discuss strategies across collectives (e.g., "If we all choose Branch Y, bonuses compound!").  

  **35–50 min: Round 2**  
  - New evidence cards (e.g., "Data reveals network effects contradict cultural-attitude model").  
  - **15 min**: Groups choose proposals.  
    - Scaffolding groups use existing branches (unless revising later).  
  - Update points/bonuses (Round 2 multiplier: 10).  

  **50–55 min: Renegotiation Phase**  
  - Groups may revise scaffolding branches (e.g., abandon a falsified model).  
  - **Penalty**: −10 accuracy points per revision.  

  **55–70 min: Round 3**  
  - New evidence cards (e.g., "Long-term data shows interaction effects between culture and networks").  
  - **15 min**: Final choices.  
    - Revised branches eligible for Round 3 bonuses (multiplier: 15).  
  - Calculate final scores (individual + collective).  

  **70–90 min: Debrief & Discussion**  
  - **Debrief (20 min)**:  
    - *Q1*: "When did you first notice the tension? (e.g., Round 1 skeptic vs. bonus seekers)."  
    - *Q2*: "Map Round 3 renegotiation to epistemology: Was abandoning a scaffold a failure of duty or a trade-off?"  
    - *Q3*: "Which group prioritized accuracy? Scaffolding? Did coordination feel epistemically 'dirty'?"  
    - **Facilitator Notes**:  
      - Emphasize distinction: Accuracy-first = intrinsic value in truth; Scaffolding = instrumental value in structure/coordination.  
      - Stress limitation: Activity shows *instrumental success* of scaffolding but does not refute accuracy-first’s core claim (false belief is intrinsically defective).  
  - **Failure-Mode Discussion (10 min)**:  
    - *Predicted issues*: Groups avoid scaffolding due to risk aversion; misinterpret bonuses as "tricks."  
    - *Q*: "How did the skeptic role prevent groupthink? Did practice rounds mitigate over-caution?"  

  ---

  #### **Design Notes**  
  - **Evidence Cards**: Ensure ambiguity (e.g., "noisy indicators," "conflicting correlations") to prevent clear accuracy advantages.  
  - **Scaffolding Branches**: Label branches as "technically false" (e.g., "Model assumes cultural attitudes are static—known oversimplification").  
  - **Skeptic Role**: Prevents groups from suppressing accuracy-first arguments.  
  - **Renegotiation Penalty**: Simulates the "cost of abandoning a scaffold" (e.g., retraining researchers, discarding data).  
  - **Outcome Dynamics**:  
    - Pure accuracy-first groups: Steady points (e.g., 10 × 3 = 30) but miss bonuses.  
    - Coordinated scaffolding groups: High bonuses (e.g., 3 groups × Branch in all rounds: 15 + 30 + 45 = 90 bonus + 15 base = 105).  
  - **Predicted Tension**: Groups that initially reject scaffolding may switch after seeing others’ bonuses, experiencing regret/conflict.  

  ---  
  This activity forces students to *feel* the pull of scaffolding through incentives, setting up a visceral debate on epistemic values. The facilitator must verbally underscore the unresolved normative tension: Even if scaffolding "works," does it violate accuracy-first duty?
