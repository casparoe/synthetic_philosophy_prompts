answer: |-
  ### Speaker Prep Sheet: Double Inversion Defense  

  ---

  **1. Audience Map and Damage Forecast**  
  *(~150 words)*  
  **Primary Threat: Searleans** (3 attendees). Their objection that *biological naturalism grounds intrinsic intentionality* directly negates double inversion’s core claim. Most damaging if they argue neural mechanisms possess non-derived semantics, rendering narrative gloss superfluous. Likely to press hardest.  
  **Secondary Threat: Functionalists** (6 attendees). May accept competence-without-comprehension in algorithms but reject its extension to human cognition. Their objection that *retrospective narrative is epiphenomenal or mislocates real comprehension* undermines the second inversion. Moderately damaging.  
  **Wildcard Threat: Predictive Processing (PP) Advocate** (1 attendee). Could collapse competence/comprehension into hierarchical prediction errors, arguing the distinction is illusory. While less existentially threatening, risks trivializing the inversion by absorption into computational monism.  

  ---

  **2. Objections and Replies**  
  *(~400 words)*  

  **Objection 1 (Searlean):**  
  *"If evolutionary algorithms lack intrinsic intentionality, but human brains instantiate identical causal powers via neurobiology, then comprehension *is* physically grounded. Your ‘narrative gloss’ just redescribes emergent biological understanding."*  
  **Reply:** "Neurobiology only enables *competence* hierarchies. The ‘understanding’ you attribute to brains is a post-hoc story we impose on signal-processing loops that evolved for adaptive success, not truth-tracking. Comprehension is a user illusion."  
  *Weakness:* Relies on unstated premise that biological causation cannot ground intrinsic aboutness.  

  **Objection 2 (Functionalist):**  
  *"Narratives aren’t ontologically inert—they’re realized in cognitive architecture. If I report ‘I understand P’, that report is a functional state *constituting* comprehension, not glossing it."*  
  **Reply:** "The report is produced by subsystems that manipulate syntax, not semantics. Our self-model generates a ‘comprehension’ narrative because it’s adaptive for social coordination, not because syntax engines grasp meaning."  
  *Weakness:* Assumes subsystems lack emergent semantics.  

  **Objection 3 (PP Advocate):**  
  *"All cognition *is* prediction-error minimization. Distinguishing competence from comprehension adds nothing: both reduce to Bayesian inference across hierarchical models."*  
  **Reply:** "PP explains *how* competence works, not *why* we attribute comprehension. The inversion argues that the attribution itself—the ‘I get it’ phenomenology—is a story generated *by* the PP machinery to compress system states."  
  *Weakness:* Conflates explanatory scope (mechanism vs. phenomenology).  

  **Objection 4 (Searlean):**  
  *"Derived intentionality (e.g., ChatGPT) presupposes original intentionality (e.g., programmers). If human understanding is gloss, what anchors *any* semantic content?"*  
  **Reply:** "Content is anchored in evolutionary success, not comprehension. DNA ‘codes’ for proteins without understanding biology; humans ‘mean’ without mental semantics. Functions aren’t *understood* but *selected*."  
  *Weakness:* Leaves normativity of meaning unexplained.  

  **Objection 5 (Functionalist):**  
  *"If comprehension is narrative gloss, why is it *reliable*? Illusions (e.g., optical tricks) are detectable, but understanding consistently guides novel action."*  
  **Reply:** "Reliability emerges from competence architectures refined by selection. The gloss isn’t *false*—it’s a heuristic label for behavioral success. We don’t ‘detect’ the illusion because detection mechanisms *are* the illusion."  
  *Weakness:* Risks circularity (gloss is validated by competence, which gloss describes).  

  **Objection 6 (Hybrid):**  
  *"You relocate comprehension to the narrative module. Isn’t *that* module the true locus of understanding?"*  
  **Reply:** "The narrative module constructs stories *about* understanding. It no more ‘comprehends’ than a dictionary understands definitions. It’s a competence for generating adaptive self-reports."  
  *Weakness:* Shifts but doesn’t eliminate the homunculus.  

  ---

  **3. Concessions in Opening**  
  *(~100 words)*  
  Grant that the *neural implementation* of narrative gloss is underspecified: current neuroscience lacks mechanistic models for how metacognitive reports arise from prediction hierarchies. Concede that double inversion doesn’t resolve *qualia* (e.g., why syntax processing feels like insight). Stress that the argument is conceptual: if competence can produce Turing-test-passing output without comprehension, and humans are products of the same competence-first processes, we must explain understanding *without* invoking magical semantics. The inversion is a parsimony play, not an empirical slam-dunk.  

  ---

  **4. The Feared Question**  
  *(~100 words)*  
  **Question (Searlean):**  
  *"If your brain’s narrative module generates the ‘I understand’ story, but that module itself lacks comprehension, what prevents an infinite regress? Who is ‘deceived’ by the gloss?"*  
  **Reply:** "No regress: the narrative module is an evolved encoder-compressor. It doesn’t ‘deceive’ a self—it *constructs* the self-model. The ‘who’ is the gloss itself."  
  **Assessment:** Reply survives *conceptually* by eliminating the homunculus, but *empirically* struggles. If pressed, admit this mirrors the hard problem: how syntax subjectively feels like semantics remains unresolved. The inversion avoids dualism but may over-privilege third-person descriptions.  

  ---  
  *Format optimized for quick reference during seminar. Focus: niche objections, faction-specific rhetoric, tactical concessions.*
