prompt: |-
  I'm working through some issues in social ontology with a small reading group, and we've been arguing about whether monetary kinds are best understood as institutional entities—constituted by collective acceptance and authoritative status assignment—or as functional kinds defined purely by their causal-economic role in mediating exchange and storing value. Rather than revisiting the usual illustrations involving seashells or cryptocurrencies, I want a precisely engineered case that forces the two accounts to diverge over the very same object, so that we can see exactly where the ontological split occurs.

  Please construct a thought experiment that meets the following specifications. The setting must be realistic, confined to a single paragraph, and situated in an ordinary workplace or local community—no science fiction, no perfect predictors, and no trolley-style abstractions. Design a local time-banking scheme in which employees earn "hour-credits" that are formally recognised by a municipal authority as deductible against local service charges and that circulate among participants for goods and services. Engineer the scenario so that, in the actual situation, both an institutional-constructivist account and a functional-role account agree that the hour-credits are genuinely money. Then introduce a counterfactual variation—say, the council withdraws formal recognition, yet the exchange network continues unchanged, with participants still treating the credits as binding obligations and using them exactly as before. The case must be built so that the institutional view holds that the credits have ceased to be money, because the requisite status function and authoritative backing have vanished, while the functional view holds that they remain the same monetary kind, since the causal-exchange profile and storage role are fully intact. This divergence must fall out naturally from each theory's core commitments, not from an ad hoc stipulation or an obviously defective rule.

  After presenting the scenario, walk through what each theory says and why, identifying precisely which feature of the case does the work—whether it is the persistence or absence of collective intentionality versus the continuity of exchange patterns. Then explain what happens if that feature is removed: does the disagreement collapse, and if so, back into agreement or into some other verdict? Include an honest note on how a defender of the institutional view might attack your construction—for instance, by arguing that informal collective acceptance survives the council's withdrawal and thus preserves the status function. Write your response in British English, take a definite and committed position on which theory handles the case more plausibly and give your reasons, rather than merely laying out the options and leaving the choice to me, and keep the tone formal and polished throughout.
reasoning: |-
  Hmm, this is a fascinating and complex request in social ontology. The user is clearly deeply engaged in theoretical debates about the nature of money, specifically the tension between institutional (Searle-style) and functional (perhaps Menger-inspired) accounts. They want a thought experiment that cleanly separates these views in an ordinary setting - no sci-fi or abstract scenarios.

  The challenge here is designing a case where:
  1) Both theories initially agree hour-credits are money
  2) After municipal recognition is withdrawn, institutionalists deny it's money while functionalists affirm it
  3) All while avoiding artificial stipulations

  I'm considering the municipal time-banking scheme as requested. What makes this work is the dual-layer structure:
  - Formal layer: Council recognition creates legal status (deductible against charges)
  - Informal layer: Community practice sustains exchange value

  The pivotal move is withdrawing formal recognition while informal practice continues unchanged. For institutionalists, money requires collective acceptance anchored to institutional facts - here, the council's authority provided that anchor. Remove it, and the status function collapses. Functionalists care only about the economic role: if hour-credits still mediate exchange and store value identically, they remain money.

  Potential institutionalist counterarguments do need addressing - they might claim the community's ongoing acceptance constitutes a new status function. But in institutional ontology, not all acceptance is equal; the council's authority provided a specific kind of institutional grounding that mere peer consensus can't replicate. The functionalist has a simpler story: money is what money does.

  Where the case might break down: if the municipal recognition was purely symbolic and participants never relied on it, the institutionalist might argue it wasn't essential to begin with. But that's why the scenario builds in concrete deductibility - people actually used credits to reduce bills, proving the status function was operational.

  My verdict leans functionalist because it captures money's resilience - history shows monetary practices often outlive formal recognition (e.g., USD in Zimbabwe). The institutional view risks over-privileging state authority when money can emerge bottom-up. Still, credit to the institutionalist for spotlighting how authority supercharges stability - which explains why the community scheme might eventually fray without council backing.
answer: |-
  ## Engineered Thought Experiment: The Bracknell Time-Bank

  In the Bracknell Community Centre, employees of local businesses participate in a Council-approved Time-Banking Scheme. For each hour of community service (tutoring, gardening, IT support), participants earn one "Bracknell Hour-Credit" (BHC) digitally recorded in a council-managed ledger. Crucially, the Bracknell Borough Council formally recognises BHCs: participants may deduct one BHC from their quarterly Council Tax bill per hour earned (up to a cap), and the Council publicly guarantees the ledger's integrity. Within the network, BHCs circulate robustly – exchanged for haircuts, homemade meals, or plumbing help – with all participants treating them as binding obligations for value storage and medium of exchange. **Actual Situation:** Both institutional and functional accounts agree BHCs are money: they have authoritative status/collective acceptance *and* function economically as money. **Counterfactual Variation:** Following budget cuts, the Council abruptly withdraws *all* formal recognition: BHCs are no longer deductible against Council Tax, the Council disavows the ledger, and ceases all administrative support. However, the participant network continues *unchanged*: the ledger is seamlessly migrated to a volunteer-run platform, BHCs circulate identically for goods/services, and participants treat obligations identically, with no discernible change in usage patterns, perceived value, or transactional confidence.

  ---

  ## Analysis of Divergence

  1.  **Institutional-Constructivist View (e.g., Searlean):**
      *   **Verdict in Counterfactual:** BHCs **cease to be money**.
      *   **Why & The Crucial Feature:** Money, on this view, is an institutional fact constituted by collective acceptance *of a status function* imposed by a recognised authority ("X counts as Y in context C"). The Council, as the relevant authoritative issuer and backer (providing tax deductibility and ledger guarantee), was the anchor for the collective acceptance of BHCs *as money*. Its withdrawal dissolves the constitutive rule underpinning the status function ("This digital token counts as official money redeemable against tax obligations"). While *informal* acceptance persists for exchange *within the group*, this lacks the authoritative assignment necessary for the *institutional status* of money. The token reverts to being merely a private voucher or informal IOU within a closed group, lacking the deontic power (the ability to create obligations like discharging tax debts) conferred by the institutional context.
      *   **Feature Doing the Work:** The **absence of authoritative backing and the formal status assignment** (Council's role). The persistence of collective acceptance *within the group* is insufficient without the institutional framework that gave the acceptance its specific monetary status function.

  2.  **Functional-Role View (e.g., Mengerian/economic):**
      *   **Verdict in Counterfactual:** BHCs **remain money**.
      *   **Why & The Crucial Feature:** Money is defined by its causal-economic roles: primarily as a *medium of exchange*, a *unit of account*, and a *store of value*. In the counterfactual, these core functions persist entirely unchanged. BHCs are still the primary medium for exchanging diverse goods/services within the network, they are used as the common unit for pricing those exchanges (e.g., "a haircut costs 1 BHC"), and they are held between transactions as a store of value based on the network's confidence in their future exchangeability. The withdrawal of Council backing alters *context* (e.g., they can't pay taxes) but not the *functional essence* of the token *within its primary economic circuit*.
      *   **Feature Doing the Work:** The **persistence of the core causal-economic functions** (medium of exchange, unit of account, store of value) within the participant network. The functional profile is identical pre- and post-withdrawal in the relevant economic sphere.

  ---

  ## Collapse of Disagreement: Removing the Key Features

  *   **If the Collective Acceptance/Status Assignment Persists (e.g., Council doesn't withdraw):** Both views agree BHCs are money. The institutional view has its status function intact; the functional view observes the economic functions operating robustly within an institutional framework.
  *   **If the Causal-Economic Functions Collapse (e.g., withdrawal causes network collapse & disuse):** Both views agree BHCs cease to be money. The institutional view lacks the status function *and* the collective acceptance crumbles; the functional view sees the core economic roles evaporate. Disagreement vanishes, replaced by agreement on non-monetary status.

  ---

  ## Institutionalist Counterattack & Rebuttal

  *   **Institutionalist Counterattack:** A defender of the institutional view might argue: "The *informal* collective acceptance *among the participants* that persists after the Council's withdrawal *is itself sufficient* to constitute a new, albeit less formal, status function ('This token counts as money within our community'). The Council was merely one source of authority; the community itself can be the relevant authority through its sustained practice and mutual recognition, preserving the deontic power for obligations *within their network*."
  *   **Rebuttal:** While compelling, this stretches the core institutionalist framework. Searlean institutional facts typically rely on *positions* within *institutions* (like governments, banks, legal systems) to anchor the 'Y' term (e.g., 'money', 'property'). Pure horizontal, informal group consensus, without *any* institutional anchor or designated authority structure, struggles to create the *kind* of status function constitutive of money under institutionalism. It risks conflating robust social practice (which functionalism captures) with the assignment of specific deontic powers via constitutive rules anchored to institutional roles. The Council provided a clear institutional 'C' context; the peer group alone arguably does not meet the threshold for the *institutional* status of money, even if it sustains exchange.

  ---

  ## Definite Position: Functionalism Handles the Case More Plausibly

  I argue the **functional-role account** provides the more plausible analysis of this scenario. Its verdict aligns more closely with the phenomenological reality of money and its resilience. History and anthropology furnish numerous examples of monetary instruments persisting and functioning effectively as money despite the collapse or withdrawal of formal state backing (e.g., cigarettes in POW camps, foreign currencies in failing states, or historical community currencies surviving state prohibition). The Bracknell case mirrors this: the *economic behaviour* of participants – their use of BHCs for pricing, exchange, and value storage – remains demonstrably unchanged. Insisting these tokens cease to be money simply because a specific authority retracts its imprimatur, despite their continued identical *function* within the economic lives of users, imposes an unduly rigid, formalistic, and state-centric ontology onto money. It risks defining money out of existence in contexts where it is most needed and actively functioning. Functionalism captures the core economic reality of what money *does*, which persists in Bracknell after the Council's withdrawal. While the Council's backing undoubtedly enhanced stability and scope, its removal does not extinguish the monetary nature of an instrument that continues to fulfil all primary monetary functions seamlessly within its established network. Money, fundamentally, is a social tool for economic coordination; where that coordination persists unchanged via a token, the token remains money. The institutional view, by over-emphasising formal authorisation, fails to fully account for money's organic, functional emergence and persistence in social practice.
