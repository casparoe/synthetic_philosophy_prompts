answer: |-
  ### Meme Evolution Decision Tree  
  **Casual sorting quiz for blog readers—no jargon, just concrete cases. Answer each question to find your cultural evolution stance.**  

  ---

  **Q1: That TikTok sound mocking landlords gets remixed into pro-landlord propaganda. When it spreads, is it:**  
  - **A: Traceable copies?** (You can spot the lineage—e.g., same audio snippet, tweaked lyrics)  
  - **B: Unrecognizably new?** (It’s redesigned so much, "copying" feels like the wrong word)  

  ---

  **If A (Traceable copies) → Go to Q2A**  
  **Q2A: Take the "Distracted Boyfriend" meme. Its survival depends MOSTLY on:**  
  - **A: The meme’s own traits?** (It’s versatile, easy to remix—like a virus exploiting attention)  
  - **B: Benefits to the sharer?** (People use it to troll, flirt, or get clout)  
  - **C: Benefits to the group?** (It unites online communities—e.g., gamers roasting microtransactions)  

  ---

  **If B (Unrecognizably new) → Go to Q2B**  
  **Q2B: When that landlord sound becomes pro-landlord, the change is:**  
  - **A: Mostly noise?** (Random mishearing, lazy imitations)  
  - **B: Mostly redesign?** (Creators *intentionally* twisted it to fit their agenda)  

  ---

  **For Q2A answers:**  
  - **A (Meme’s traits) → Strict memetics**  
    *Your view:* Memes evolve like genes—high-fidelity copying with selection for "selfish" traits (e.g., catchiness).  
    *Example:* "Gangnam Style" went global because its choreography was inherently sticky.  

  - **B (Benefits to sharer) → Go to Q3**  
  - **C (Group benefits) → Go to Q3**  

  **Q3: When "Hello There" became a Star Wars meme, the shift from Obi-Wan to ironic greeting was:**  
  - **A: Blind luck?** (Accidental misquotes, autocorrect fails)  
  - **B: Intentional?** (Edgelords deliberately made it awkward for humor)  

  ---

  **Results for A (Traceable copies) paths:**  
  - **B (Sharers) + A (Blind)** → **Dual-inheritance theory (random)**  
    *Your view:* Memes spread if they help *people* survive/socialize, but mutations are accidental (e.g., misremembered slang).  
    *Example:* "Yeet" mutated randomly until it stuck.  

  - **B (Sharers) + B (Intentional)** → **Dual-inheritance theory (guided)**  
    *Your view:* Humans *tinker* with memes to serve their needs—e.g., turning "OK Boomer" into a merch slogan. Evolution isn’t blind.  

  - **C (Group) + A (Blind)** → **Cultural group selection**  
    *Your view:* Memes survive if they strengthen *communities* (e.g., protest chants). Changes are accidental but filtered by group cohesion.  

  - **C (Group) + B (Intentional)** → **UNOCCUPIED**  
    *Diagnosis:* "Ugly" — If groups *design* memes like engineers, it’s marketing, not evolution.  

  ---

  **Results for B (Unrecognizably new) paths:**  
  - **A (Noise)** → **UNOCCUPIED**  
    *Diagnosis:* "Incoherent" — Pure noise can’t explain cultural patterns (e.g., why anti-tenant spin *dominated*).  

  - **B (Redesign)** → **Cultural attraction theory**  
    *Your view:* Memes don’t "copy"—they’re *rebuilt* by brains craving familiar tropes (e.g., reshaping the landlord sound to fit power dynamics). Psychology is the architect.  

  ---

  **Summary:** Splits first on copying fidelity, then selective pressure, then mutation drivers—exposing where theories overlap or die.
