answer: |-
  Here is a decision tree mapping the logical space of responses to the heterogeneity problem in hedonism, designed as requested:

  ```
  ROOT: Is there a single phenomenal quality present in every case of pleasure?
  │
  ├─── YES (Qualitative Monism)
  │    │
  │    ├─── Is this single quality intrinsic (non-relational)?
  │    │    │
  │    │    ├─── YES: **Qualitative Uniformitarianism (Intrinsicist)**
  │    │    │        Awkward Commitment: Must deny the introspective report that malicious pleasure (e.g., schadenfreude) feels phenomenally *different* in kind from benign pleasure.
  │    │    │
  │    │    └─── NO: The single quality is relational (e.g., felt goodness, motivational oomph, liking)
  │    │         │
  │    │         ├─── Are base/malicious pleasures pleasurable in the *same relational sense*?
  │    │         │    │
  │    │         │    ├─── YES: **Relational Monism (e.g., Felt-Goodness View)**
  │    │         │    │        Awkward Commitment: Must claim the phenomenal "goodness" of escaping danger feels intrinsically similar to the phenomenal "goodness" of cruelty.
  │    │         │    │
  │    │         │    └─── NO: **Graded or Restricted Relationalism**
  │    │         │             Awkward Commitment: Must exclude certain intuitively pleasurable states (like malice) from *true* pleasure, creating a revisionary account.
  │    │         │
  │    │         └─── (Note: Determinable branch often emerges here as alternative to relational monism)
  │    │
  │    └─── Is the single quality best understood as a determinable (like color) rather than a determinate (like scarlet)?
  │         │
  │         ├─── YES: **Determinable Hedonism**
  │         │        Awkward Commitment: Struggles to explain what positively unites diverse determinate pleasures (chocolate, math) *as* pleasure beyond the bare fact of being sub-types of the determinable.
  │         │
  │         └─── NO: (Implied by prior 'Intrinsicist' branch; determinable rejected in favor of simple intrinsic quality)
  │
  └─── NO (Phenomenal Heterogeneity)
       │
       ├─── Are pleasures unified by a shared non-phenomenal property (e.g., attitude, function, representation)?
       │    │
       │    ├─── YES: Reject Phenomenal Essence (Non-Qualitative Hedonism)
       │    │    │
       │    │    ├─── Unifying Property: Being the object of a pro-attitude (desire, liking) -> **Pure Pro-Attitude Hedonism**
       │    │    │        Awkward Commitment: Cannot explain why we desire *pleasure itself* differently than we desire other things (e.g., truth), or why some desired states (e.g., relief) feel pleasant while others (e.g., eating when full) do not.
       │    │    │
       │    │    ├─── Unifying Property: Representing an objective good/benefit -> **Representational-Content View**
       │    │    │        Awkward Commitment: Must accept that pleasures based on false representations (e.g., sadist's false belief their victim suffers) are either non-pleasures or that pleasure's essence includes potential misrepresentation.
       │    │    │
       │    │    └─── Unifying Property: Playing a specific functional/causal role (e.g., reinforcement) -> **Functionalism about Pleasure**
       │    │             Awkward Commitment: Risks divorcing pleasure entirely from its felt character, making it conceivable that a state causing reinforcement could feel like agony yet still *be* pleasure.
       │    │
       │    └─── NO: **Phenomenal Pluralism / Disjunctivism**
       │             Awkward Commitment: Must abandon the core hedonist claim that pleasure is a *single* kind of mental state grounding value, threatening hedonism's simplicity.
       │
       └─── (Alternative Path: Reject Strict Identity but Accept Weaker Unity)
            │
            └─── Are pleasures unified only by family resemblance or practical role? -> **Family Resemblance View / Practical Kind View**
                     Awkward Commitment: Makes pleasure inherently disunified and potentially vague, undermining its suitability as a foundational, measurable source of value for hedonism.

  ```

  **Ambiguities & Potential Collapses (Flagged):**

  1.  **Determinable Hedonism vs. Phenomenal Pluralism:** The line blurs significantly. If the determinable ("pleasure-feel") has no positive phenomenal content of its own beyond being the genus for disparate determinates, it collapses towards mere nominal unity, akin to pluralism or family resemblance. The tree places it under Monism based on the *claim* of a single determinable property, but its substance may be pluralistic.
  2.  **Relational Monism vs. Pro-Attitude Hedonism:** Distinguishing a *phenomenal* relational quality (e.g., *feeling* good) from a *non-phenomenal* pro-attitude (e.g., *being* liked/disliked) is crucial but subtle. Positions might conflate these, especially if "feeling good" is analyzed dispositionally. The tree separates them based on the root question: Relational Monism asserts a phenomenal relational quality ("YES" branch), while Pro-Attitude Hedonism rejects a phenomenal essence ("NO" branch).
  3.  **Family Resemblance & Non-Qualitative Views:** A Family Resemblance view explicitly rejects a single unifying property (phenomenal or non-phenomenal). It sits uneasily between Phenomenal Pluralism (which focuses on the *lack* of phenomenal unity) and a potential weak non-qualitative view (if resemblance is based on functional/practical similarities). The tree places it under "NO" to the root question and as an alternative to seeking *any* unifying property. Its commitment to disunity challenges core hedonist assumptions more directly than non-qualitative views that posit *one* non-phenomenal unifier.
  4.  **Graded/Relationalism & Phenomenal Pluralism:** If base pleasures are excluded from "true" pleasure, the remaining "pleasures" might *still* be phenomenally heterogeneous (chocolate vs. math), pushing this position towards Phenomenal Pluralism restricted to "approved" pleasures. The tree keeps them separate based on the initial monist commitment.
