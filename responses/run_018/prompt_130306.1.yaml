  We are designing a reusable decision procedure for governance mediation in multi-generational family enterprises, based on Confucian role ethics but adapted for modern interstitial roles. The procedure must have several steps and address specific cases.

  **Design of the Procedure:**

  1. **Role Mapping:**
     - Identify all participants in the conflict and their active roles. Classify each role as either:
       - **Classic Confucian Role:** Parent, Child, Elder Sibling, Younger Sibling, Ruler (Employer), Subject (Employee), Friend (if applicable).
       - **Interstitial Role:** Roles that don't fit neatly into the classic five (e.g., founder's spouse without formal title, adopted child who is an executive). Flag these for special attention.
     - Create a diagram or list showing each person and their roles relative to others in the conflict.

  2. **Priority Rule and Rectification Check:**
     - **Priority Rule:** In case of conflict, obligations in roles with closer relational proximity (e.g., parent-child) take precedence over less proximate ones (e.g., employer-employee). However, this is conditional on the rectification check.
     - **Rectification Check:** For each role relationship in conflict, check if one party has systematically failed to uphold their role obligations (e.g., a parent treating a child solely as an employee, ignoring the parent-child bond). If such corruption is found:
       - Suspend the obligations tied to that corrupted role for the duration of the conflict resolution.
       - Shift focus to other intact role relationships between the parties or to other parties in the conflict.

  3. **Cross-Domain Conflict Resolution:**
     - When facing a clash between family obligation and fiduciary duty (or other corporate obligations):
       - Step 1: Identify the specific obligations from each domain (family and corporate) that are in conflict.
       - Step 2: Apply the priority rule (from step 2) to see if one set of obligations has higher relational proximity and is intact (passes rectification).
       - Step 3: If the conflict remains, identify explicit stopping points where the mediator must not impose a solution. These are:
          - **Value Judgment Point:** Where the conflict requires a choice between core family values and corporate sustainability that cannot be resolved by role obligations alone. The mediator must present the options and consequences but not decide.
          - **Unavoidable Judgment Marker:** When the procedure leads to a clear but difficult outcome (e.g., protecting institutional integrity at the cost of family harmony), the mediator must note this and proceed without softening.

  4. **Procedure Boundaries:**
     - **Markers of Unavoidable Judgment:** When the rectification check suspends a primary role (e.g., parent-child) and the remaining roles (e.g., employer-employee) cannot resolve the conflict, or when interstitial roles create irreconcilable gaps.
     - **Where the Procedure Misfires:** When roles are too corrupted to provide a basis, or when external factors (e.g., legal requirements) override the role-based approach. Then the mediator must stop and recommend external arbitration or legal counsel.

  **Application to Cases:**

  **Case 1: Founder wants to appoint an unqualified child as COO over the objection of an elder sibling who is VP.**

  - **Role Mapping:**
    - Founder: Parent, Employer, Founder (interstitial: as both family head and corporate leader).
    - Child (to be appointed): Child, Employee (and if appointed, COO).
    - Elder Sibling (VP): Child (to founder), Elder Sibling (to the child), Employee (VP).

  - **Priority Rule and Rectification Check:**
    - The founder is acting as both parent and employer. The appointment of the child as COO may be driven by parental obligation but conflicts with the corporate role (employer) which requires competence.
    - The elder sibling (VP) is objecting as both a corporate executive (fiduciary duty) and as an elder sibling (who may be concerned about family and business welfare).
    - **Rectification Check:** If the founder has consistently treated the child solely as an employee (ignoring the parent-child bond) then the parental obligations might be suspended? But actually, the opposite is happening: the founder is favoring the child as a parent, potentially corrupting the employer role. Therefore, the founder's employer role obligations (to appoint based on merit) are being corrupted. We suspend the founder's employer role obligations in this decision? Not exactly: we see that the founder is failing in the employer role by not upholding merit. So, we shift to other intact roles.
    - Intact roles: The elder sibling's roles (child to founder, elder sibling to the child, VP) are intact. The founder's role as parent is intact but is conflicting with corporate duties. However, the rectification check flags that the founder is corrupting the employer role. Therefore, we suspend the founder's employer role in this decision? That doesn't seem right. Alternatively, we note that the founder's action is a corruption of the employer role, so we cannot rely on that role to resolve the conflict. We then shift to the intact roles between the elder sibling and the founder (parent-child) and between the siblings (elder-younger).

  - **Cross-Domain Conflict:**
    - The conflict is between the founder's parental obligation (to support the child) and the corporate fiduciary duty (to appoint qualified people). The elder sibling is invoking fiduciary duty and also the elder sibling's obligation to guide the younger.
    - The priority rule: The parent-child relationship is closer than employer-employee. However, the rectification check found the founder corrupting the employer role. Therefore, the founder's fiduciary duty (as employer) is suspended? Then the decision must rely on the intact roles. The elder sibling, as VP, has a fiduciary duty and as an elder sibling has an obligation to advise against unwise appointments. The mediator must highlight this.
    - **Stopping Point:** The mediator cannot decide whether the founder should appoint the child. The mediator can only note that the founder's action corrupts the employer role and that the elder sibling's objection is valid from both family and corporate roles. The mediator must present the consequences: appointing the unqualified child might harm the business and family harmony. The unavoidable judgment is that the founder must choose between being a good parent (which might mean not setting the child up for failure) and being a good employer.

  **Case 2: A senior non-family executive is pressured to conceal a family member’s financial error, with loyalty obligations invoked.**

  - **Role Mapping:**
    - Senior Non-Family Executive: Employee (Subject in ruler-subject), and possibly Friend? (if close to the family) but primarily an employee.
    - Family Member: Could be in multiple roles (e.g., child of founder, employee). 
    - The one pressuring: Likely a family member in a superior corporate role (e.g., the family member's parent who is also a top executive) or the family member themselves.

  - **Priority Rule and Rectification Check:**
    - The executive has a fiduciary duty to the company. The loyalty obligation being invoked might be an interstitial role (e.g., "honorary family member" or trusted retainer). 
    - **Rectification Check:** If the family member (or the one pressuring) is treating the executive solely as a tool to cover up the error (thus corrupting the employer-employee relationship by asking the employee to violate fiduciary duty), then the obligations in that role (employer-employee) are suspended? Actually, it's the opposite: the employer is corrupting the role by asking the employee to do something unethical. Therefore, the employee's obligation of loyalty (in the employer-employee role) is being corrupted by the employer. Thus, the employee is freed from the obligation to obey in this matter? The intact role might be the executive's fiduciary duty to the company (as an employee) and possibly to external stakeholders.

  - **Cross-Domain Conflict:**
    - Conflict between the executive's fiduciary duty (corporate) and the loyalty obligation (family domain, but the executive is not family). However, the loyalty obligation might be an interstitial role of "extended family" or "trusted retainer". 
    - The priority rule: The classic roles for the executive are primarily employee. The interstitial role (if any) of being like family is less proximate than actual family. But if the rectification check shows the employer has corrupted the employee role by asking for concealment, then the employee's obligation to obey is suspended. The executive must then act on the intact obligation: fiduciary duty to the company and possibly to the law. 
    - **Stopping Point:** The mediator cannot tell the executive what to do, but the procedure leads to the conclusion that the executive should not conceal the error. The mediator must note the value judgment: the executive must choose between short-term loyalty (which is corrupt) and long-term integrity. The mediator must not impose but can point out that covering up might harm the company and the family in the long run.

  **Case 3: Protecting institutional integrity at the cost of family harmony.**

  - We need a case where the procedure forces an answer that the mediator will not want to deliver. Let's create one: A family member (son of the founder) has been embezzling funds. The founder (parent) wants to handle it quietly within the family to avoid scandal and protect the son. The non-family CFO insists on reporting to the authorities and firing the son to protect the company and comply with the law.

  - **Role Mapping:**
    - Founder: Parent (to the son), Employer, Founder.
    - Son: Child, Employee.
    - Non-family CFO: Employee (with fiduciary duty).

  - **Priority Rule and Rectification Check:**
    - The founder is acting as a parent trying to protect the child, but this corrupts the founder's role as employer (by covering up a crime) and founder (by jeopardizing the company). 
    - The rectification check: The founder is corrupting the employer and founder roles by putting family harmony above institutional integrity. Therefore, the obligations of the founder in the employer and founder roles are suspended? Actually, we suspend the obligations that are being corrupted? Or we note the corruption and shift to intact roles. The intact roles are the CFO's fiduciary duty and the son's role as an employee (which he violated).

  - **Cross-Domain Conflict:**
    - The conflict is between the parent's obligation to the child and the fiduciary duty to the company (and legal obligations). 
    - The priority rule: The parent-child bond is very close, but the rectification check shows the founder is corrupting the employer role. Therefore, we shift to the intact roles: the CFO must act on fiduciary duty, and the founder must step back from the employer role in this matter. 
    - **Unavoidable Judgment:** The procedure leads to the conclusion that the son must be fired and the case reported to authorities to protect institutional integrity. This will break family harmony. The mediator must deliver this outcome: the roles of employer and fiduciary duty (and legal obligations) override the corrupted parent role in this context. The mediator must not soften this, though it will cause pain.

  **Summary of the Procedure:**

  - **Step 1: Role Mapping** - Identify and classify roles, flagging interstitial ones.
  - **Step 2: Priority and Rectification** - Assign priority by relational proximity but check for role corruption. If found, suspend obligations in that role and shift to intact roles.
  - **Step 3: Cross-Domain Conflict Resolution** - Resolve conflicts between domains by applying Step 2, and stop at value judgment points where the mediator must not decide. Mark unavoidable judgments (where the procedure forces a difficult outcome).
  - **Step 4: Boundaries** - Note where the procedure misfires (e.g., extreme corruption or external legal issues) and halt.

  This procedure provides a structured yet flexible approach that respects the Confucian framework while addressing modern complexities.
answer: |-
  ### Decision Procedure for Family Enterprise Conflict Mediation

  **Core Philosophy**: Grounded in Confucian role ethics, this procedure treats relational obligations (parent-child, elder-younger, etc.) as foundational. It addresses conflicts by mapping roles, applying proximity-based priority with rectification checks, resolving cross-domain clashes, and flagging unavoidable judgments.

  ---

  #### PROCEDURE STEPS  
  *Run sequentially within 90-minute sessions.*

  1. **Role Mapping (15 minutes)**  
     - **Objective**: Identify active classic roles and flag interstitial roles.  
     - **Actions**:  
       - List all parties involved and their *classic roles* (e.g., parent-child, elder-younger sibling, employer-employee).  
       - Flag *interstitial roles* (e.g., "founder’s spouse with informal authority," "adopted child-executive") that lack predefined obligations.  
       - Diagram relationships: Use arrows to show role overlaps (e.g., "Father (parent) → Son (child/employee)").  
     - **Output**: A visual map highlighting:  
       - Classic roles (solid lines).  
       - Interstitial roles (dashed lines).  
       - **Marker**: If >50% of roles are interstitial, note "high risk of procedure misfire."

  2. **Priority Rule with Rectification Check (25 minutes)**  
     - **Objective**: Assign obligation priority based on relational proximity, but suspend corrupted roles.  
     - **Actions**:  
       - **Proximity Rule**: Rank obligations by Confucian closeness (e.g., parent-child > employer-employee).  
       - **Rectification Check**: For each role, ask:  
         *"Has Party A systematically violated core obligations of this role (e.g., treating a child solely as an employee)?"*  
         - If **yes**: Suspend obligations in that role. Shift resolution to intact roles.  
         - If **no**: Prioritize obligations per proximity rule.  
       - **Example**: A parent who fires a child for minor errors corrupts the parent-child role; obligations shift to employer-employee.  
     - **Output**: Adjusted priority list with suspended roles marked.  
     - **Stopping Point**: If all roles are suspended, halt—resolution requires external arbitration.

  3. **Cross-Domain Conflict Resolution (30 minutes)**  
     - **Objective**: Resolve clashes between family obligations (e.g., filial piety) and corporate duties (e.g., fiduciary).  
     - **Actions**:  
       - Identify the specific obligation clash (e.g., "family loyalty vs. financial transparency").  
       - Apply the Priority Rule (Step 2) to the intact roles.  
       - If unresolved:  
         - **Value Judgment Point**: Articulate the conflict as a binary choice (e.g., "Protect family harmony OR protect company assets").  
         - **Mediator Directive**: Do not impose an answer. State: "This is a value judgment. The family must decide."  
       - **Unavoidable Judgment Marker**: If institutional integrity (e.g., legal compliance, company survival) is at stake, note: "This outcome will likely harm family harmony."  
     - **Output**: Clear options with consequences; flagged judgment points.

  4. **Validation & Boundaries (10 minutes)**  
     - **Check for Misfire**:  
       - The procedure **misfires** if:  
         - Interstitial roles dominate and lack reference points.  
         - External forces override roles (e.g., legal violations).  
       - **Action**: End session and recommend legal/board intervention.  
     - **Final Guidance**: Restate unavoidable judgments and next steps.

  ---

  ### APPLICATION TO CASES  

  #### Case 1: Founder Appoints Unqualified Child as COO  
  - **Role Mapping**:  
    - Founder: Parent, Employer, Founder (interstitial: family authority + corporate leader).  
    - Child: Child, Future COO.  
    - Elder Sibling/VP: Child, Employee, Elder sibling.  
    - *Interstitial Flag*: Founder’s dual role (family/corporate) creates conflict.  
  - **Priority with Rectification**:  
    - Founder prioritizes parent-child obligation (proximity).  
    - **Rectification Check**: Founder corrupts employer role by ignoring merit. *Suspend employer obligations*. Shift to elder sibling’s intact roles:  
      - As employee: Fiduciary duty to oppose unqualified appointment.  
      - As elder sibling: Duty to protect family from nepotism risk.  
  - **Cross-Domain Conflict**:  
    - Clash: Parental obligation (appoint child) vs. fiduciary duty (protect company).  
    - **Value Judgment Point**: "Choose: Fulfill parental wish OR uphold meritocracy for company health."  
    - **Unavoidable Judgment**: Upholding fiduciary duty fractures family harmony. Mediator states: "This prioritizes institutional integrity but will cause familial discord."  
  - **Outcome**: Founder must decide; procedure sides with elder sibling if rectification is invoked.  

  #### Case 2: Non-Family Executive Pressured to Conceal Error  
  - **Role Mapping**:  
    - Non-Family Executive: Employee, Loyal Retainer (interstitial: "honorary family member").  
    - Family Member: Child, Employee (role: junior staff).  
    - Pressure Source: Parent/Employer (e.g., founder).  
  - **Priority with Rectification**:  
    - Proximity: Loyalty obligation (interstitial) is weaker than fiduciary duty.  
    - **Rectification Check**: Family member/parent corrupts employer role by demanding concealment. *Suspend loyalty obligations*. Shift to executive’s intact role: Employee duty to report fraud.  
  - **Cross-Domain Conflict**:  
    - Clash: Family loyalty vs. corporate transparency.  
    - **Value Judgment Point**: "Choose: Protect family member OR disclose error to protect company."  
    - **Unavoidable Judgment**: Disclosing the error preserves institutional integrity but betrays "family" trust. Mediator notes: "This protects the company but severs kinship ties."  
  - **Outcome**: Executive must act on fiduciary duty; mediator does not soften outcome.  

  #### Case 3: Protecting Institutional Integrity at Family Harmony’s Cost  
  - **Scenario**: A son (family member/employee) embezzles funds. Founder (parent) wants internal handling. Non-family CFO demands legal action.  
  - **Role Mapping**:  
    - Founder: Parent, Employer.  
    - Son: Child, Employee.  
    - CFO: Employee (non-family).  
    - *Interstitial Flag*: Founder’s dual role.  
  - **Priority with Rectification**:  
    - Founder’s parent role prioritizes protecting child (proximity).  
    - **Rectification Check**: Founder corrupts employer role by concealing crime. *Suspend employer obligations*. Shift to CFO’s intact fiduciary duty.  
  - **Cross-Domain Conflict**:  
    - Clash: Parental protection vs. legal/fiduciary duty.  
    - **Value Judgment Point**: "Choose: Shield son from legal consequences OR prosecute to protect company."  
    - **Unavoidable Judgment**: Prosecuting the son is institutionally necessary but destroys family harmony. Mediator delivers: "The procedure mandates legal action; this will fracture the family."  
  - **Outcome**: CFO’s duty prevails; son faces legal action. Mediator does not mitigate harm to family bonds.  

  ---

  **Key Mediator Discipline**:  
  - At **Value Judgment Points**, say: "I cannot decide this; the family must."  
  - At **Unavoidable Judgment Markers**, state the outcome clearly, even if painful.  
  - If **procedure misfires** (e.g., interstitial overload), defer to external experts.  
  This procedure balances role ethics with modern complexity, ensuring mediator neutrality while forcing hard choices onto stakeholders.
