  Okay, the user is teaching a session on teleosemantics to upper-level undergrads. They need a lesson plan that focuses on how etiological functions solve the disjunction problem. Let me start by understanding their requirements. 

  First, the students are familiar with functionalism and multiple realizability but new to mental representation. The key goal is to show how etiological function addresses the disjunction problem and why "content is what it's for" is substantive. The user wants a clear sequence, a strong example, addressing misconceptions, a check question, and knowing what to skip.

  The user mentioned avoiding standard examples like magnetotactic bacteria or honeybee dances. Why? Those examples might be too complex or have multiple functions. So I need a simpler, unambiguous example. The frog snapping at flies comes to mind, but maybe it's overused. A simpler neural circuit with a clear function could work better. Maybe a hypothetical neuron that detects snakes? But snakes might have subtypes, which could complicate disjunction. A generic predator detector in a small mammal? Or stick with frogs but simplify. The frog example is classic but needs to be streamlined. Emphasizing that the fly detector's function is solely nutrition, not any dark speck, avoids disjunction issues. That should work.

  Next, structuring the sequence. Start with the problem of representation: how do mental states point to things? Introduce misrepresentation with a causal-informational account leading to disjunctive content. Then present teleosemantics as a solution via etiological functions. Define "normal conditions" and "proper function" carefully to avoid misconceptions. Highlight how function fixes content without disjunctions. Contrast this with causal accounts to show the advantage. Finally, discuss the trade-offs, like historical dependence.

  Misconceptions to address: students might think "proper function" is what usually happens or "normal conditions" are average. Need to clarify that function is based on selective history, not current statistics. Use the frog example: even if it mostly misses flies now, the function remains. Normal conditions are those under which the trait was selected, not common today.

  The check question should test understanding. Ask what the frog neuron represents if it now only catches flies 10% of the time. If they say flies (not bugs or specs), they get it. If they mention disjunction, they missed the point.

  What to skip? Don't dive into debates like Swampman or other theories. Focus solely on how etiological functions solve disjunction. Keep it targeted.

  Spine of the sequence: Etiological function determines representational content by grounding norms of correctness in selection history, solving the disjunction problem by privileging historically selected causes. That ties it all together.
answer: |-
  Here’s a focused 75-minute lesson plan prioritizing conceptual clarity on etiological functions and the disjunction problem:

  **Carrying Example:** **A frog's visual "fly detector" neuron** that fires when a small, dark, moving speck crosses its visual field. This fires for flies (nutritious), but also for falling leaves, distant birds, or pebbles (non-nutritious). *Why it works:* Simple, intuitive, clearly biological, unambiguous selection pressure (nutrition), avoids symbiosis/communication complexities (unlike bees), and avoids physical necessity debates (unlike magnetotactic bacteria).

  ### (1) Sequence & Dependencies (45 mins total)
  1.  **The Problem of Mental Representation (10 mins):**
      *   *Start:* "Functionalism tells us *how* states play roles. But what makes a state *about* something? What makes my thought 'water' *represent* H₂O?"
      *   **Causal/Informational Proposal (Naïve):** "Maybe a state represents what causes it? Fire-detector neurons fire when... fire is present? Seems plausible."
      *   **Misrepresentation Problem (Introduce via Frog):** "Frog's 'fly-detector' neuron fires for flies (good!). But also for non-flies (pebbles, leaves). If it fires for a pebble, is it misrepresenting? On the causal view: what *causes* it? Flies *or* pebbles *or* leaves... (write: Fly ∨ Pebble ∨ Leaf). So its 'content' is disjunctive. But intuitively, it's *wrong* when firing for a pebble – it *should* fire *only* for flies. **Key Distinction:** We need norms – correctness conditions. How get norms from nature?"
      *   *Dependency:* Establishes misrepresentation as a *normative* problem needing a naturalized norm.

  2.  **Teleosemantics' Core Idea (10 mins):**
      *   "Teleosemantics says: Look to *function*. A state represents what it is *supposed* to indicate. 'Supposed to' = its *biological function*."
      *   **Etiological Function (Define Carefully):** "A trait's *proper function* isn't what it *does*, but what it was *selected for* by natural selection. *Why* was this frog-neuron type preserved in frog ancestors? Because it helped them *catch flies* (nutrition). That's its *proper function*: **to detect flies**."
      *   **Normal Conditions (Define):** "The conditions under which performing its function *contributed to fitness* in ancestral selection. For the frog: daylight, clear water, typical fly size/speed/motion – not pitch dark or deceptive environments."
      *   *Dependency:* Requires grasping selection history ("selected for"), not current statistics.

  3.  **Solving the Disjunction Problem (15 mins):**
      *   "Apply to the frog: The neuron's *proper function* is to detect flies (because *that* is why ancestors with it ate and reproduced)."
      *   **Content Assignment:** "It *represents* the presence of a fly. Why? Because that’s what it’s *supposed* to detect to perform its function."
      *   **Misrepresentation Explained:** "When it fires for a pebble (under normal conditions!), it *malfunctions*. It's doing something it wasn't selected to do. Content = fly, not Fly ∨ Pebble. The function 'prunes' the disjunction! Only the *selected-for* cause (flies) is the content."
      *   **Contrast w/ Causal View:** Reiterate the disjunction (Fly ∨ Pebble ∨ Leaf) vs. the teleosemantic content (Fly). The function provides the norm: firing = fly is *supposed* to be present.
      *   *Dependency:* Requires clear grasp of etiological function.

  4.  **The Price & Work Done (10 mins):**
      *   **Work Done:** Function fixes content uniquely (fly), provides norm (correct vs. incorrect firing), naturalizes "supposed to."
      *   **Price Paid:** Heavy reliance on *history*. What if no selection history? (Mention Swampman briefly as a famous worry, *don't solve it*). What if the trait's function changed? What if selection was for something broader? (e.g., "nutritious object"? See misconception 3 below).

  ### (2) Key Misconceptions & When/How to Head Them Off
  1.  **"Proper function = what it usually does *now*."**
      *   *When:* Immediately after defining etiological function (Step 2).
      *   *How:* "No! Imagine frogs now live where flies are rare, but pebbles look identical and are common. The neuron fires for pebbles 90% of the time. Does its function change to 'detect pebbles'? *No!* Its function is fixed by *past* selection, not current use. Past selection was for fly detection."
  2.  **"Normal conditions = statistically average conditions *now*."**
      *   *When:* When defining "Normal Conditions" (Step 2) and when discussing misrepresentation (Step 3).
      *   *How:* "No! Normal conditions are the *ancestral conditions relevant to selection*. Even if *now* it's usually dark and foggy (so the neuron rarely works), 'normal conditions' for its function are the clear, daylight conditions where detecting flies *actually worked* for ancestors. A sunny day is 'normal' even if it rains 300 days a year now."
  3.  **"The function/content is whatever is beneficial *in general*."** (e.g., "detect nutrition" or "avoid danger")
      *   *When:* When assigning content (Step 3) and discussing the price (Step 4).
      *   *How:* "Be precise! *Why* was *this specific neural response* selected? Not just 'nutrition' – frogs eat many things. It was selected *because* it detected *flies* via *this specific speck-detection pattern*. If it also sometimes detected nutritious moths, that's incidental. The *direct target* of selection was fly detection via this mechanism. Content is individuated finely."

  ### (3) Check-for-Understanding Question (Ask at End, 5 mins)
  > "Imagine a mutant frog species evolves. Their 'fly detector' neurons are *identical* to normal frogs, but due to a weird environmental quirk, these neurons *only* ever get triggered by falling black seeds (which are nutritious for them), never by actual flies. What does this neuron *represent* in the mutant frogs? Why? What does this tell us about the role of history?"

  *   **Correct Answer:** It represents *flies* (if the neuron type was inherited from ancestors selected for fly detection). The mutant frog misrepresents seeds as flies. Shows content is fixed by *ancestral* selection history, not current use or benefit. (If they say "seeds," they've conflated function with current benefit/use).

  ### (4) What to Explicitly Refuse/Cover (State Early & Briefly)
  *   "We are *only* focusing on how etiological function solves the disjunction problem and grounds misrepresentation. We *won't* solve every problem for teleosemantics (like Swampman or sophisticated human thought), compare it deeply to other theories (like Fodor's asymmetrical dependence), or debate alternative notions of function. This is about seeing the core mechanism and its cost: **tying meaning to history**."

  ### Spine of the Sequence
  **Etiological function provides naturalized norms of correctness by grounding what a representation is *supposed* to detect in its selection history, solving the disjunction problem by privileging the historically selected cause as the content.**
