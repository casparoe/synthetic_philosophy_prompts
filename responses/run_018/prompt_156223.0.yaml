  The user might also be indirectly asking why historians do this. Possible reasons include: simplifying complex figures for storytelling, aligning with modern political narratives, or unconsciously projecting contemporary biases. The "edges" of this phenomenon are fuzzy - it blends into legitimate debates about whether we can truly judge the past by modern standards.

