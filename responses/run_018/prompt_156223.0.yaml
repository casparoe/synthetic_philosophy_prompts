  hey im a junior in high school and ive noticed this weird pattern in my history textbook and some podcasts about the past. the writer will roast ancient people for not having modern values about slavery or gender, like they should have figured it out just by being smart. but then right after that theyll defend the same people for doing other messed up stuff, saying well they lived in a diffrent world with diffrent rules so we cant blame them. its not just presentism across the board, because presentism usually means judging the whole past by today. here its like they use todays morals like a spotlight only on the parts that make the story work, either to trash someone or to praise them as ahead of their time. i saw it with a medieval queen who gets called progressive for education but her religious persecution gets excused as just politics back then. is there a specific name for this selective kind of presentism? how is it different from normal presentism and from just being inconsistent? if theres no term, what should we call it and where are its edges? please answer in continuous prose only, no headings bullet points bold text or tables, just like an email or letter. and dont give me a bibliography or ask me to look up specific books, i want an explanation i can understand without searching.
