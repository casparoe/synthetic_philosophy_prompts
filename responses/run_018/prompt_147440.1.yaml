  A friend summed up Nozick's experience machine argument like this: "Nozick showed that people reject the machine because well-being requires actually causing changes in the world, not just having good experiences. So he proved hedonism false and established well-being as a kind of causal-integretion score between mental states and external outcomes. Most philosphers now accept this causal-integration view; they just debate how to weight the mental versus the physical parts." Something feels off—did Nozick really propose a metric like that? Is "proved hedonism false" too strong for what an intuition pump can do? And is this causal-integration framing actually standard, or is my friend mixing in a separate idea? Could you separate what's accurate, what's overstated, and what's just wrong?
