reasoning: |-
  We are drafting a joint statement for an adversarial collaboration between a traditional just-war theorist (defending moral equality of combatants) and a revisionist liability-theorist. The focus is on "epistemic dominance" - where one belligerent's moral-epistemic framework is systematically captured by propaganda, preventing soldiers from forming reliable beliefs about just cause. The key question: does this break the symmetry of moral equality?

  Format:
  1. Agreed Claims (numbered list): shared formalism, what's at stake, shared commitments (e.g., noncombatant immunity).
  2. Disagreements Table: each camp's own wording for where they split. Each side accepts their own line.
  3. Cruxes: particularly whether epistemic domination undermines equality, and what counts as reasonable belief about just cause under duress. For each crux, a shared test case or argument both agree bears on it, with each side's prediction recorded in advance.

  Keep it constructive - a document both could sign, leaving the disagreement exact. Avoid references; a model without web access should reason through it.

  Let's break it down:

  **Agreed Claims (Shared Ground):**
  1. **Formalism of Just War Theory:** We agree that the traditional just war framework includes principles of *jus ad bellum* (justice of going to war) and *jus in bello* (justice in war). *Jus ad bellum* requires a just cause, right intention, proper authority, last resort, probability of success, and proportionality. *Jus in bello* requires discrimination (noncombatant immunity) and proportionality in the use of force.
  2. **Moral Equality of Combatants (MEC) as a Traditional Doctrine:** The traditional view holds that combatants on both sides of a war have equal moral status in the conduct of war (jus in bello), regardless of the justice of their cause (jus ad bellum). This means they have the same rights and liabilities: they may kill enemy combatants without committing murder, and they may be killed without being murdered.
  3. **Liability Theory as a Revisionist Challenge:** The revisionist view, based on individual moral liability, holds that combatants fighting without a just cause are not morally permitted to kill enemy combatants (because they are not liable to defensive harm) and that killing them may be permissible only if they are morally responsible for an unjust threat.
  4. **Epistemic Challenges in War:** Both sides agree that soldiers often operate under conditions of duress, misinformation, and propaganda, which can impair their ability to form accurate beliefs about the justice of their cause.
  5. **Noncombatant Immunity:** We both endorse the principle of noncombatant immunity: civilians who do not pose a threat must not be intentionally targeted.
  6. **What's at Stake:** The central question is whether epistemic dominance (as defined) breaks the symmetry of moral equality. That is, if soldiers on one side are systematically prevented from forming reliable beliefs about their war's injustice due to state propaganda, does this affect their moral status in war (e.g., their liability to be killed or their permission to kill)?

  **Disagreements Table:**

  | Issue | Traditional Just-War Theorist | Revisionist Liability-Theorist |
  |-------|-------------------------------|--------------------------------|
  | **Moral Equality of Combatants (MEC)** | Combatants on both sides of an armed conflict possess equal moral status in the conduct of war, regardless of the justice of their cause, because they are agents of their state and the conditions of war create a mutual license to kill. | Combatants are not morally equal; only combatants who fight for a just cause (or who reasonably believe they do) have a right to kill, while combatants fighting without a just cause are liable to be killed because they contribute to an unjust threat. |
  | **Epistemic Dominance and MEC** | Epistemic dominance does not break the symmetry of MEC because soldiers are not required to make independent judgments about the just cause; their moral status is determined by their role as combatants and the collective context of war. | Epistemic dominance may break the symmetry: if a soldier is systematically prevented from forming a reasonable belief that their war is unjust, they might not be morally responsible for their participation and thus not fully liable. |
  | **Reasonable Belief under Duress** | In the context of war, a soldier's belief about the justice of their cause is reasonable if it is formed based on the information provided by their state and the normal processes of military training and propaganda, given the duress of their situation. | A belief is reasonable only if the soldier has made a good-faith effort to seek out reliable information and critically evaluate their cause, to the extent possible without undue risk, even under duress. |

  **Cruxes:**

  1. **Crux 1: Does epistemic dominance break the symmetry of moral equality?**
     - **Shared Test Case:** Consider a state (State A) that engages in comprehensive propaganda, controlling all media and education from childhood, such that its soldiers are systematically indoctrinated to believe in a just cause for an aggressive war. The soldiers have no access to alternative viewpoints and are subject to severe penalties for dissent. State B is defending against this aggression and has a transparent society with free access to information.
     - **Traditionalist Prediction:** The soldiers of State A are still combatants with equal moral status to those of State B. They may kill enemy combatants without committing murder and may be killed without being murdered. The epistemic conditions do not alter their moral equality.
     - **Revisionist Prediction:** The soldiers of State A, due to epistemic dominance, may not be morally responsible for their participation in the unjust war. Therefore, they might not be liable to be killed (or at least, their liability is diminished) and they lack the right to kill enemy combatants of State B. Epistemic dominance breaks the symmetry.

  2. **Crux 2: What counts as a reasonable belief about just cause under duress?**
     - **Shared Test Case:** A conscripted soldier in State A is ordered to fight. They have been raised in a closed society with no access to foreign media. They hear rumors of the war's injustice but face imprisonment or death if they express doubts. They do not actively seek out dissenting views because of fear.
     - **Traditionalist View:** The soldier's belief in the just cause is reasonable because they are acting on the information provided by their state and under severe duress. They are not required to risk their life to seek the truth.
     - **Revisionist View:** The soldier's belief is not reasonable because they have not made a good-faith effort to seek the truth, even if it is difficult. However, the revisionist might concede that in extreme duress, the soldier's responsibility is diminished, which could reduce their liability.

  **Joint Statement:**

  **Adversarial Collaboration Joint Statement: Epistemic Dominance and Moral Equality of Combatants**

  **Agreed Claims:**

  1. We agree on the basic structure of just war theory, including the distinction between *jus ad bellum* and *jus in bello* principles.
  2. We agree that the traditional doctrine of Moral Equality of Combatants (MEC) holds that combatants on opposing sides have equal moral status in the conduct of war, irrespective of the justice of their cause.
  3. We agree that the revisionist liability theory challenges MEC by asserting that the moral permissibility of killing in war depends on the individual combatant's liability, which is tied to their contribution to an unjust threat and their moral responsibility.
  4. We agree that noncombatant immunity is a fundamental principle: civilians not directly participating in hostilities must not be intentionally targeted.
  5. We agree that soldiers often operate under conditions of epistemic duress, including state propaganda, which can impair their ability to form true beliefs about the justice of their cause.
  6. We agree that the phenomenon of "epistemic dominance" (defined as a systematic capture of a belligerent's moral-epistemic framework by propaganda, preventing reliable belief formation about just cause) is a real and important challenge in the ethics of war.
  7. We agree that the central question at stake is whether epistemic dominance breaks the symmetry of moral equality, i.e., whether it affects the moral status of combatants in a way that undermines MEC.

  **Disagreements:**

  | Issue | Traditional Just-War Theorist | Revisionist Liability-Theorist |
  |-------|-------------------------------|--------------------------------|
  | **MEC Validity** | Affirms MEC: Combatants on both sides have equal moral status in war, regardless of ad bellum justice, because they are mutual participants in a collective conflict. | Rejects MEC: Combatants are not moral equals; those fighting without a just cause are liable to defensive harm, while just combatants have a right to fight. |
  | **Effect of Epistemic Dominance on MEC** | Epistemic dominance does not break MEC symmetry: soldiers' moral status is determined by their role as combatants in a state conflict, not by their epistemic condition. | Epistemic dominance may break MEC symmetry: if soldiers cannot reasonably form true beliefs about their war's injustice due to state propaganda, their moral responsibility and thus liability may be diminished or eliminated. |
  | **Reasonable Belief under Duress** | A belief is reasonable if it is formed in accordance with the information provided by the state and the normal processes of military life, given the duress and lack of alternatives. | A belief is reasonable only if the soldier has made a good-faith effort to seek reliable information and critically evaluate their cause, to the extent possible without undue risk. |

  **Cruxes and Test Cases:**

  1. **Crux 1: Does epistemic dominance break the symmetry of moral equality?**
     - **Test Case:** State A is an aggressive, totalitarian state that has indoctrinated its soldiers since childhood to believe in a just cause for war. Soldiers have no access to alternative information and face severe punishment for dissent. State B is a democratic state defending against aggression, with free information flow.
       - **Traditionalist Prediction:** Soldiers of State A retain full moral equality with those of State B. They may kill enemy combatants without moral wrong and may be killed without being wronged.
       - **Revisionist Prediction:** Soldiers of State A, due to epistemic dominance, lack full moral responsibility for their participation. Thus, they are not liable to be killed (or their liability is reduced) and they lack the right to kill State B's combatants. Symmetry is broken.

  2. **Crux 2: Reasonable Belief under Duress**
     - **Test Case:** A conscript in State A, raised in total indoctrination, hears whispers of the war's injustice but fears seeking more information due to risk of punishment. They fight without further inquiry.
       - **Traditionalist View:** The soldier's belief in the just cause is reasonable under the circumstances. They are not blameworthy for relying on state-provided information.
       - **Revisionist View:** The soldier's belief is unreasonable because they did not make a good-faith effort to seek truth. However, their responsibility is mitigated by duress, which may reduce (but not eliminate) liability.

  **Signed:**
  [Traditional Just-War Theorist]
  [Revisionist Liability-Theorist]
answer: |-
  ### Joint Statement: Adversarial Collaboration on Epistemic Dominance and Moral Equality of Combatants  
  **Parties:**  
  - **Traditional Just-War Theorist** (Defending Moral Equality of Combatants)  
  - **Revisionist Liability-Theorist** (Defending Individual Liability Framework)  

  ---

  #### I. Agreed Claims  
  1. **Formal Symmetry Baseline**:  
     - Both affirm the *baseline symmetry* of moral equality of combatants (MEC) under standard conditions: combatants on opposing sides possess equal permissions/liabilities in *jus in bello*, absent epistemic distortions.  

  2. **Noncombatant Immunity**:  
     - Both unconditionally endorse the principle of noncombatant immunity. Direct targeting of civilians is prohibited, regardless of the belligerent’s *jus ad bellum* status.  

  3. **Epistemic Dominance Defined**:  
     - "Epistemic dominance" (ED) occurs when a belligerent’s institutions (e.g., state media, education) systematically manipulate information, rendering combatants unable to form reliable beliefs about their war’s *just cause*. ED includes:  
       - Suppression of dissent.  
       - Saturation with uncorrectable false narratives.  
       - Structural penalties for skepticism.  

  4. **Core Stakes**:  
     - If ED breaks MEC, soldiers under ED may lose wartime permissions (e.g., to kill enemy combatants) or gain reduced liability (e.g., to be targeted). If not, MEC holds irrespective of ED.  

  5. **Shared Formal Constraints**:  
     - **Belief Threshold**: Combatants must hold *some* belief about their cause’s justness (cannot be wholly agnostic).  
     - **Causal Link**: ED must directly impair belief-forming processes, not merely reflect ignorance.  

  ---

  #### II. Disagreements Table  
  | Issue | Traditional Just-War Theorist | Revisionist Liability-Theorist |  
  |-------|-------------------------------|--------------------------------|  
  | **MEC Validity under ED** | "MEC persists under ED because soldiers' moral equality derives from their role as agents of collective force, not individual epistemic conditions." | "ED negates MEC because combatants under ED cannot be reasonably held liable for unjust participation; their agency is compromised." |  
  | **Reasonable Belief Standard** | "A belief is reasonable if formed through standard institutional channels (e.g., military briefings), even if distorted by ED. Duress excuses epistemic diligence." | "A belief is reasonable only if combatants could access alternative viewpoints *without disproportionate risk*. ED voids reasonableness by design." |  
  | **Moral Status of ED-Combatants** | "ED-combatants retain full rights to kill enemy combatants and are fully liable to be killed." | "ED-combatants lack the right to kill just-side combatants and possess diminished liability to defensive harm." |  

  ---

  #### III. Cruxes  
  **Crux 1: Does Epistemic Dominance Break MEC Symmetry?**  
  - **Shared Test Case**: *The Closed-State Conscript*  
    - **Scenario**: Conscript in State A (aggressor state) is raised in total propaganda isolation (no foreign media, education censored). State A initiates unjust war, and conscript believes it is defensive. State B (defender) has transparent institutions.  
  - **Traditionalist Prediction**:  
    > "MEC holds. The conscript’s epistemic conditions do not alter their symmetrical combatant status. They may kill State B’s soldiers per MEC."  
  - **Revisionist Prediction**:  
    > "ED breaks symmetry. The conscript’s inability to access truth voids their liability for unjust aggression. They may not permissibly kill State B’s soldiers."  

  **Crux 2: What Constitutes "Reasonable Belief" Under Duress?**  
  - **Shared Test Case**: *The Doubting Soldier*  
    - **Scenario**: Soldier in State A hears credible rumors of war crimes by their side but faces execution for investigating further. They adopt their command’s narrative to avoid punishment.  
  - **Traditionalist View**:  
    > "Belief remains reasonable. Self-preservation justifies deference to authority; no obligation to seek truth under lethal duress."  
  - **Revisionist View**:  
    > "Belief is unreasonable. Accepting rumors triggers a duty to minimally verify; avoiding investigation due to fear confirms ED’s coercive hold."  

  ---

  ### Signatures  
  This document reflects precise agreements and unresolved disagreements. Both parties commit to its accuracy.  

  **Signed,**  
  [Traditional Just-War Theorist]  
  [Revisionist Liability-Theorist]  

  ---  
  **Structure Notes**:  
  - **Agreed Claims** isolate common ground to prevent tangential disputes.  
  - **Disagreements Table** uses each camp’s phrasing to avoid straw-manning.  
  - **Cruxes** specify test cases both accept as decisive, with predictions pre-committed to falsifiability.  
  - **Formalist Focus**: Avoids historical references; relies on abstracted cases for standalone analysis.
