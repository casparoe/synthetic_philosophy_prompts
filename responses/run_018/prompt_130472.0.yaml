answer: |-
  Your question cuts to the heart of foundational debates in decision theory and longtermism. Let me address your concerns systematically, building on the requested brainstorming:

  ### Key Distinctions Recap
  1.  **Expected Value (EV) vs. Expected Utility (EU):**
      *   **EV Maximisation:** Computes `Σ [p_i * V(x_i)]`, where `V` is a *linear* function of outcomes (e.g., lives saved, dollars). Risk-neutrality is inherent.
      *   **EU Maximisation:** Computes `Σ [p_i * U(x_i)]`, where `U` is a typically *concave* utility function transforming outcomes. This incorporates risk aversion (diminishing marginal utility).
  2.  **Dust-Specks vs. Torture (DST):**
      *   Compares a massive number of individuals (`3^^^3` in Bostrom's original) experiencing a negligible harm (dust speck) vs. *one* individual experiencing intense torture (e.g., 50 years).
      *   The core challenge is aggregating vast numbers of minuscule disutilities vs. one intense disutility. It pressures intuitions about aggregation, lexical thresholds, and the nature of harm.
  3.  **Risk Aversion:**
      *   **Domain-General:** Applies universally across all decision contexts (e.g., consistent concavity for wealth, lives, etc.).
      *   **Context-Dependent:** Varies by domain (e.g., risk-averse with health but risk-seeking with lottery tickets) or stake size.

  **Why "EV Fanaticism" is a *Distinctive* Problem for Longtermism, Despite EU Theory:**

  Your core intuition is correct: applying a concave `U` significantly dampens the impact of astronomical numbers. However, the "fanaticism" problem persists in specific, critical ways that make it distinctive and unresolved, especially under longtermism's unique uncertainties:

  1.  **The Insufficiency of Plausible Concavity:**
      *   **Plausible Curves Aren't Concave *Enough*:** While logarithm or root functions tame large numbers, they often fail to sufficiently moderate *extreme low-probability, high-impact* (ELPHI) prospects relevant to longtermism.
      *   **Example:** Compare:
          *   Option A: Save 1 life for sure (`U(A) = ln(1) = 0`)
          *   Option B: `1e-100` chance of saving `1e^100` lives (`E[U(B)] ≈ 1e-100 * ln(1e100) = 1e-100 * 230 ≈ 2.3e-98`)
          *   `2.3e-98 > 0`, so EU(B) > EU(A). The tiny probability multiplied by the immense (though concave) utility *still* favors the astronomical gamble.
      *   **The Crux:** For *any* unbounded, concave `U` (like ln), and *any* fixed finite good (saving 1 life), there *exists* some sufficiently large number of lives `N` and some sufficiently small probability `p` such that `p * U(N) > U(1)`. Longtermist scenarios easily provide `N` large enough and `p` small enough to trigger this dominance *even under concave U*. This is the essence of "fanaticism."

  2.  **The Problem of Unbounded Utility:**
      *   Standard EU with concave `U` assumes utility can grow without bound (`U(x) -> ∞` as `x -> ∞`). Longtermism often deals with potential outcomes of *literally* unbounded scale (e.g., influencing the entire future trajectory of sentience across a vast universe/galaxies over billions of years).
      *   If `U` is unbounded, fanaticism (prioritizing ELPHI options) is *mathematically unavoidable* under EU maximisation for some pairs of options. This feels deeply counterintuitive and practically problematic.

  3.  **Non-Linearity in Probability, Not Just Outcome:**
      *   EU handles diminishing marginal utility of *outcomes*. Fanaticism highlights a distinct phenomenon: extreme sensitivity to tiny probabilities when stakes are astronomical.
      *   Risk-averse agents using concave `U` are *still* linear in probabilities (`Σ p_i * U(x_i)`). They treat a `1e-100` probability as exactly `1e-100` times the value of a certainty. Humans (and some normative theories) might overweight or underweight extreme probabilities non-linearly (e.g., prospect theory's probability weighting). Fanaticism pushes us to question if linear treatment of ELPHI probabilities is rational or practical.

  4.  **The DST Problem is Fundamentally Different:**
      *   DST isn't primarily about risk aversion or diminishing marginal utility *within a single type of harm*. It's about the *comparison* of fundamentally different *types* or *intensities* of harm across individuals.
          *   Does preventing `N` dust specks *ever* outweigh causing 50 years of torture, no matter how large `N` is? Many argue "no," suggesting a lexical threshold where intense suffering trumps any amount of trivial suffering.
      *   Concave `U` over "total disutility" (e.g., `U(total_dust_speck_disutility)` vs. `U(torture_disutility)`) implicitly assumes these harms are commensurable on a single scale. DST challenges that very commensurability, suggesting fanaticism might arise from *misaggregation* of qualitatively different harms, not just scale.

  5.  **Context-Dependent Risk Aversion and Moral Urgency:**
      *   Longtermist interventions often target ELPHI tail risks (e.g., existential catastrophes). Being overly dismissive of these tiny probabilities due to standard concavity might be seen as recklessly neglecting potentially overwhelming future stakes.
      *   Conversely, prioritizing them "fanatically" might neglect near-term, certain suffering. The "fanaticism" debate reflects a tension between *epistemic uncertainty* (Can we trust these tiny probabilities? Are the models reliable?) and *moral urgency* (How do we weigh potential vast future goods against concrete present needs?).
      *   Standard EU with a fixed concave `U` doesn't adequately capture this context-dependent tension. It might be too "fanatical" in ELPHI longtermist contexts or not risk-averse *enough* in contexts demanding caution under deep uncertainty.

  **Conclusion: Why Fanaticism is Distinct and Problematic**

  You are right that concave EU significantly mitigates the *naive* fanaticism of linear EV. However, the core challenge persists for longtermism due to:

  1.  **The Limits of Plausible Concavity:** Plausibly concave functions often fail to prevent ELPHI dominance for truly astronomical stakes.
  2.  **Unboundedness:** If utility is unbounded, fanaticism is mathematically inescapable under EU for some choices.
  3.  **Probability Sensitivity:** Fanaticism highlights issues with the *linear treatment of extreme probabilities*, separate from outcome concavity.
  4.  **Incommensurability (DST):** The problem involves comparing qualitatively different harms, challenging the single-scale aggregation implicit in `U`.
  5.  **Contextual Moral Demands:** Longtermism's unique context (astronomical stakes, deep uncertainty, moral urgency across time) makes standard EU's domain-general concavity feel inadequate. It might be insufficiently cautious about model uncertainty or insufficiently responsive to the sheer scale of potential future value.

  Therefore, "expected value fanaticism" (or more accurately, "Pascalian fanaticism" or "ELPHI prioritization") is treated as a *distinctive* problem because:

  *   It arises *despite* applying standard, plausible concave utility functions.
  *   It exposes limitations of the EU framework itself (unboundedness, linear probabilities) under the extreme conditions longtermism forces us to confront.
  *   It involves deep philosophical questions about aggregation, incommensurability, moral thresholds, and the treatment of deep uncertainty that go beyond simple diminishing marginal utility.

  Novel approaches (risk-weighted utility, lexical thresholds, domain restrictions, applying discount rates to probabilities themselves, bounded utility) are explored precisely because concave EU, while essential, is seen as *insufficient* to resolve the specific, acute challenges posed by fanaticism in the longtermist context. The debate centers on whether these novel approaches are legitimate fixes or departures from rationality, highlighting that fanaticism is not merely an artefact of forgotten concavity, but a profound stress test for decision theory itself.
