answer: |-
  1.  **How can "tacit knowledge encoded in institutions" be empirically identified and measured (beyond mere tradition), separating functional wisdom from historical inertia?** (Most upstream: foundational for assessing value. Low tractability: requires novel epistemological/metrics. Highest stakes for justifying preservation.)
  2.  **What specific mechanisms cause the irreversible loss of institutional tacit knowledge during rationalist redesign, and can these losses be anticipated or mitigated pre-emptively?** (Depends on Q1's identification. Moderate tractability: historical/complexity theory possible. High stakes: prevents unintended damage.)
  3.  **Can thresholds or diagnostics be developed to determine when the costs of preserving an opaque institution outweigh the epistemic risks of altering it, avoiding both reckless change and ossification?** (Depends on Q1 & Q2. Moderate tractability: risk modeling frameworks adaptable. Critical stakes: balances continuity and necessary adaptation.)
  4.  **How do Burkean/Chestertonian principles apply to novel, rapidly evolving institutions (like AI oversight bodies) lacking deep inheritance, where the "fence" is still being built?** (Depends on core principles from Q1-Q3. Moderate tractability: requires conceptual extension. High stakes: guides design of new critical systems.)
  5.  **How can institutional reasoning incorporating tacit knowledge and Chesterton's fence be effectively democratized or legitimized within pluralistic societies dominated by rationalist/optimizing discourse?** (Depends least on prior answers conceptually, but requires Q1-Q4 for substance. High tractability: draws on political theory/comms. Crucial stakes: ensures broad acceptance. Its resolution would least alter downstream *conceptual* work on Q1-Q4.)
