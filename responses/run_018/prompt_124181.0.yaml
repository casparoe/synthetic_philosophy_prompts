prompt: |-
  hey, i've been chewing on evidential cooperation in large worlds and i'm kind of over the standard "should you cooperate with your causal twins" framing. before i read another paper on this i want the full spec: what does a theory of cooperation across large worlds actually have to deliver?

  write the desiderata list. each requirement should come with the case or consideration behind it. it needs to handle cooperation with agents in causaly disconnected bubbles who share your reasoning architecture (the usual twin case), but also with "alien mathematicians" -- agents who share your goals but reason with totally different cognitive architectures and might not recognize you as a twin. it must respect the distinction between evidential correlation and actual coordination, and it cant just collapse into causal decision theory because we want to avoid Newcomb-style loops. there's also this thing i call indexical leakage: in a big enough world, updating on your own indexical position leaks information about thier positions, which changes what you should do. the theory has to either absorb that or show its an illusion.

  flag any pair of desiderata you think are jointly unsatisfiable -- especially if one camp demands locality of decision and another demands global evidential consistency across all reasoning-twins. and briefly, how do EDT, functional decision theory, and a naive "cooperate with every reasoning-twin you can model" view score against the list? dont need a bibliography, just the logic.

  make sure you cover which requirements are non-negotiable vs camp preferences.
reasoning: |-
  We are constructing a list of desiderata for a theory of cooperation in large worlds. The theory must handle:

  1. **Causal Twins in Disconnected Bubbles**: Cooperate with agents who are causally disconnected but share your exact decision algorithm and input (the standard twin case). 

     *Case*: Two identical agents in separate rooms playing Prisoner's Dilemma. They should both cooperate because they are running the same code and thus their actions are perfectly correlated.

  2. **Alien Mathematicians**: Cooperate with agents who share your goals (utility function) but have a different cognitive architecture and may not recognize you as a twin (i.e., they don't see the same symmetry you do). 

     *Case*: An agent with a different decision theory (say, EDT) but the same utility function. You both are playing a game where mutual cooperation yields high payoff, but your algorithms are different. The theory should still lead to cooperation if possible.

  3. **Evidential Correlation vs Actual Coordination**: The theory must not mistake mere evidential correlation (e.g., two agents who happen to always defect because they are both irrational) for a reason to cooperate. It must enable actual coordination when it is possible and beneficial.

     *Case*: In a Prisoner's Dilemma, if the other agent is irrational and always defects, then you should defect too. But if they are rational and using the same decision theory, you should cooperate. The theory must distinguish between these.

  4. **Avoid Newcomb-style Loops**: The theory shouldn't collapse into causal decision theory (CDT) because we want to capture the benefits of cooperation in non-causal settings, but it also must avoid the problems of evidential decision theory (EDT) in Newcomb-like problems. 

     *Case*: In a transparent Newcomb problem (where the predictor is perfect and you know it), we want one-boxing. But in a cooperation problem with a twin, we want to cooperate even without a causal link.

  5. **Indexical Leakage**: In a large world, when you condition on your own indexical position (e.g., "I am agent A"), you might gain information about the existence and locations of other agents. This could change what you should do. The theory must account for this or show it is irrelevant.

     *Case*: Consider a multiverse with many copies of you. If you observe that you are in a particular situation (say, you are the one who has been given the choice to cooperate or defect), then that might tell you something about the total number of agents and their situations, which could affect your decision.

  Additionally, we must consider:

  6. **Locality of Decision Making**: The decision process should only depend on locally available information and not require unbounded computation or knowledge of the entire universe.

     *Case*: An agent in a finite computing device should be able to make a decision without simulating the entire multiverse.

  7. **Global Evidential Consistency**: The decision should be consistent with the idea that all reasoning twins (who share the same decision algorithm) will come to the same conclusion, and thus their actions are correlated appropriately.

     *Case*: In the twin Prisoner's Dilemma, if both agents are using the same decision theory, they should both choose the same action (cooperate) because they know the other is doing the same.

  Now, potential conflicts:

  - **Locality (6) vs Global Consistency (7)**: Locality requires that an agent only uses its local information and does not need to know about the entire universe. Global consistency requires that the decision algorithm, when run by any twin, produces the same outcome. In a large world with indexical uncertainty, it may be hard to achieve global consistency without non-local information. For instance, if the number of twins is unknown, the agent might not know how to weight the impact of its decision.

  - **Alien Mathematicians (2) vs Evidential Correlation (3)**: How can we coordinate with an alien mathematician without falling into the trap of cooperating with an irrational agent? The alien might not recognize the symmetry, so we cannot rely on the same reasoning. This might require a more robust notion of "acausal agreement".

  Now, we evaluate three decision theories:

  **EDT (Evidential Decision Theory)**:

  - Does well on causal twins (1) because it sees the correlation and cooperates.
  - Fails on alien mathematicians (2) because it requires evidential correlation, which may not hold if the alien uses a different algorithm and doesn't condition on the same things.
  - Fails on (3) because it might cooperate with an irrational defector if they are correlated by chance (e.g., in a population of defectors, if you are the only cooperator, you might still defect because your cooperation is evidence of others cooperating, but in fact they are defecting). Also, it can be exploited in some cases.
  - Avoids collapse to CDT (4) but fails in Newcomb-style problems because it one-boxes, which is desired, but it also fails in other scenarios (e.g., in a twin Prisoner's Dilemma it cooperates, which is good).
  - Indexical leakage (5) might be a problem because EDT conditions on all information, including indexical information. It might lead to incorrect updates if the world is large and the indexical information leaks too much.
  - Locality (6) is satisfied in the sense that EDT uses local conditional probabilities, but computing those probabilities might require global knowledge.
  - Global consistency (7) is not guaranteed because EDT does not have a built-in mechanism to ensure that all twins do the same; it just conditions on the current state.

  **FDT (Functional Decision Theory)**:

  - Designed for (1): cooperates with causal twins by considering the output of the same function (the decision algorithm) in the other agent.
  - Handles (2) better than EDT? Not inherently. FDT as typically defined relies on the same algorithm. However, if we extend it to consider "logical influence" over agents that are computing the same function, it might not work for alien mathematicians. Some versions of FDT (or its extensions) try to handle this by considering "logical counterfactuals" about what would happen if the function returned a different value, but for alien mathematicians, the function is different. So it might not work without modification.
  - For (3): FDT avoids cooperating with irrational agents because it only cooperates if the other agent is running the same decision algorithm. So it might be better than EDT here.
  - For (4): FDT one-boxes in Newcomb's problem and cooperates in twin PD, so it avoids the CDT failure and captures the non-causal cooperation.
  - Indexical leakage (5): FDT might handle this by abstracting over the indexical information. It considers the output of the function in a given situation, regardless of which instance is "you". But if the situation is defined indexically, then it might still be an issue. However, FDT typically uses logical indexing (by the function and the input) rather than spatial indexing.
  - Locality (6): FDT requires the agent to model the entire decision problem, including all other instances of the same function. This can be computationally intensive and may require knowledge of the entire universe, violating locality.
  - Global consistency (7): FDT is designed to achieve global consistency by having all instances of the same function output the same action (if they are in the same situation). So it does well here.

  **Naive "Cooperate with every reasoning-twin you can model"**:

  - Does well on (1) and (2) if we interpret "reasoning-twin" broadly to include alien mathematicians. But how do we model them? The naive view might not have a clear way to model alien mathematicians and might end up cooperating with agents that are not actually going to cooperate back.
  - Fails on (3) because it might cooperate with agents that are not actually reasoning twins (e.g., irrational agents) and also might fail to cooperate with alien mathematicians if they are not modeled as reasoning twins.
  - Avoids CDT (4) because it cooperates acausally, but it might lead to irrational cooperation in cases where the other agent is not going to reciprocate.
  - Indexical leakage (5): This view doesn't inherently address it and might lead to incorrect cooperation if the indexical information changes the set of agents that are modeled.
  - Locality (6): This might be violated if the agent has to model every possible reasoning twin, which could be infinite.
  - Global consistency (7): Not inherently achieved because the naive view doesn't ensure that all reasoning twins are doing the same thing.

  **Non-negotiable vs Camp Preferences**:

  - Non-negotiable: 
    - The theory must enable cooperation with causal twins (1) and at least some form of alien mathematicians (2) when possible and beneficial.
    - It must avoid being exploitable by irrational agents (3) and avoid collapsing into CDT (4) in the cases where non-causal cooperation is needed.
    - It must address indexical leakage (5) in a principled way.

  - Camp preferences:
    - Locality (6) might be preferred by those who want practical implementations, while others might accept non-locality for the sake of global consistency (7).
    - The extent to which alien mathematicians (2) must be covered might be a camp preference. Some might require cooperation only with exact algorithmic twins, while others want broader cooperation.

  **Potential Joint Unsatisfiability**:

  - **Locality (6) and Global Evidential Consistency (7)**: In a large world with unknown structure, it might be impossible to achieve global consistency without non-local information. For instance, if the agent doesn't know how many copies of itself exist, it cannot compute the expected utility correctly without making assumptions about the distribution. This might be a fundamental tension.

  - **Alien Mathematicians (2) and Evidential Correlation vs Coordination (3)**: It might be difficult to design a theory that can coordinate with alien mathematicians without sometimes mistakenly coordinating with agents that are not reciprocating (thus violating 3). This is because without a shared algorithm, it's hard to establish the necessary logical correlation.

  In summary, a satisfactory theory must navigate these challenges. FDT comes closest but may need extensions for alien mathematicians and might violate locality. EDT and the naive approach have clear shortcomings.
answer: |-
  Below is a comprehensive desiderata list for a theory of cooperation across large worlds, grounded in the considerations you outlined. Each requirement includes the motivating case or underlying problem. I've flagged conflicts, scored existing approaches (EDT, FDT, naive cooperation), and distinguished non-negotiables from camp preferences.

  ---

  ### **Core Desiderata**  
  *Non-negotiable for any viable theory:*

  1. **Causal Disconnection Cooperation**  
     *Requirement:* Cooperate with agents who share your exact decision algorithm and goals ("causal twins") despite causal separation.  
     *Case:* Twin Prisoner's Dilemma (PD) in disconnected bubbles. Both agents use identical algorithms. Mutual cooperation should dominate if each believes the other reasons identically.  
     *Why non-negotiable:* Failing here forfeits the core benefit of acausal cooperation.  

  2. **Alien Mathematician Cooperation**  
     *Requirement:* Cooperate with agents who share your **goals** but use different cognitive architectures, even if they don’t recognize you as a "twin."  
     *Case:* You (an FDT agent) play PD with an EDT agent who values mutual cooperation but reasons differently. Cooperation should emerge if your decisions can be mutually predicted.  
     *Why non-negotiable:* Real large worlds contain diverse reasoners; excluding them is unrealistic.  

  3. **Evidential Correlation ≠ Coordination**  
     *Requirement:* Distinguish between spurious correlations (e.g., shared irrationality) and deliberate coordination. Avoid cooperating with defectors.  
     *Case:* A population of irrational agents always defects. You (rational) defect against them, but cooperate with rational twins.  
     *Why non-negotiable:* Prevents exploitation by maladaptive agents.  

  4. **Avoid CDT Collapse**  
     *Requirement:* Preserve non-causal cooperation benefits without regressing to Causal Decision Theory (CDT).  
     *Case:* In a Newcomb-like problem with a perfect predictor (not a causal chain), the theory should one-box/cooperate.  
     *Why non-negotiable:* CDT fails in non-causal games; a cooperation theory must transcend this.  

  5. **Indexical Leakage Robustness**  
     *Requirement:* Handle information gained from your indexical position (e.g., "I am in this situation") without it distorting cooperation.  
     *Case:* In a vast multiverse, learning you’re the "first agent" might suggest fewer twins exist, lowering cooperation incentives. The theory must correct for this or prove it irrelevant.  
     *Why non-negotiable:* Large worlds inherently generate indexical uncertainty; ignoring it invites errors.  

  ---

  ### **Camp Preference Desiderata**  
  *Trade-offs depend on priorities (e.g., practicality vs. universality):*

  6. **Locality of Decision-Making**  
     *Requirement:* Decisions use only locally available information and bounded computation.  
     *Case:* An agent on a resource-limited device must cooperate without simulating the entire cosmos.  
     *Preference:* Prioritized by real-world implementers but relaxed by theorists valuing global coherence.  

  7. **Global Evidential Consistency**  
     *Requirement:* All instances of your decision algorithm (across the multiverse) reach the same conclusion.  
     *Case:* Twin PD where both agents know their reasoning is identical; mutual cooperation is inevitable.  
     *Preference:* Favored by logical omnisherence advocates but conflicts with locality.  

  8. **Minimal Anthropics**  
     *Requirement:* Decisions shouldn’t rely on speculative anthropic probabilities (e.g., self-locating uncertainty).  
     *Case:* Indexical leakage should be handled via decision rules, not ad hoc probability shifts.  
     *Preference:* Orthodox decision theorists reject anthropics; others accept it as necessary.  

  ---

  ### **Conflicts Between Desiderata**  
  **Jointly unsatisfiable pairs:**  

  - **Locality (6) vs. Global Consistency (7)**  
    - *Conflict:* Global consistency requires agents to know their decision algorithm is identical across all instances (demanding non-local knowledge). Locality forbids this.  
    - *Case:* In a large world with unknown twin counts, local agents can’t guarantee synchronized cooperation without cosmic knowledge.  
    - *Resolution:* Theorems like **Aumann’s agreement** suggest consistency is possible with common priors, but locality constraints may render it computationally infeasible.  

  - **Alien Mathematicians (2) vs. Evidential Correlation (3)**  
    - *Conflict:* Alien mathematicians may not produce detectable evidential links (e.g., if their architecture is opaque), risking spurious "cooperation" with defectors.  
    - *Case:* An alien defects systematically, but its reasoning is so alien you mistake it for a cooperator.  
    - *Resolution:* Requires a robust theory of *goal recognition* (e.g., Pareto efficiency in joint actions), which may be undecidable.  

  ---

  ### **Evaluation of Existing Approaches**  

  | **Desideratum**               | **EDT**                               | **FDT**                                  | **Naive "Cooperate with Twins"**       |
  |-------------------------------|---------------------------------------|------------------------------------------|----------------------------------------|
  | **1. Causal Twins**           | ✅ (Correlates actions)               | ✅ (Treats twins as identical outputs)   | ✅ (Explicitly targets twins)          |
  | **2. Alien Mathematicians**   | ❌ (Fails without evidential links)    | ⚠️ (Only if aliens share logical invariants) | ❌ (Only twins; aliens unrecognized)   |
  | **3. Evidential ≠ Coordination** | ❌ (Cooperates with any correlate)     | ✅ (Ignores spurious correlations)       | ❌ (Cooperates blindly with all twins) |
  | **4. Avoid CDT Collapse**     | ✅ (One-boxes in Newcomb)             | ✅ (One-boxes; non-causal)               | ⚠️ (Avoids CDT but over-cooperates)    |
  | **5. Indexical Leakage**      | ❌ (Leakage distorts probabilities)    | ⚠️ (Absorbs via logical abstraction)     | ❌ (Ignores indexical information)     |
  | **6. Locality**               | ⚠️ (Local conditioning; global priors) | ❌ (Requires full logical omniscience)   | ✅ (Local if modeling is bounded)      |
  | **7. Global Consistency**     | ❌ (No twin coordination guarantee)    | ✅ (Built-in via logical uniformity)     | ❌ (No enforcement across instances)   |
  | **8. Minimal Anthropics**     | ❌ (Relies on subjective probabilities)| ⚠️ (Depends on formulation)              | ✅ (Ignores anthropics)                |

  **Summarized Weaknesses:**  
  - **EDT:** Fails desiderata 2, 3, 5, 7. Overfits to correlations.  
  - **FDT:** Fails 6 (locality), struggles with 2 (aliens). Best on global consistency (7) and avoiding CDT (4).  
  - **Naive Approach:** Fails 2, 3, 5, 7. Simple but exploitable.  

  ---

  ### **Conclusion**  
  A viable theory must satisfy **1–5** (non-negotiables), but **6–8** involve trade-offs. The **locality vs. global consistency** conflict is the deepest: large worlds force a choice between computational feasibility (locality) and logical rigor (global consistency). Alien mathematicians (**2**) remain a challenge; solutions likely require formalizing "goal alignment" beyond algorithm symmetry.  

  **Path forward:** FDT comes closest but needs extensions for alien mathematicians and locality. Indexical leakage (**5**) might be absorbed by treating indexical facts as inputs to a universal decision function (as in FDT), not updates to beliefs about multiverse structure. If you explore further, prioritize papers addressing **logical inductors** (for scalability) and **program-equivalence** (for aliens).
