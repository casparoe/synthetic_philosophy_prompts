answer: |-
  Here's a breakdown of the requirements for a robust theory of guilt vs. shame, categorized as you requested:

  **I. Hard Constraints (Non-Negotiable Requirements):**

  1.  **Core Case Resolution:**
      *   **Private Guilt:** Explain why an individual feels intensely negative *without* an audience or fear of exposure *solely* due to violating an internalized standard (e.g., breaking a private promise, harming someone anonymously).
      *   **Exposure-Driven Shame:** Explain why an individual feels intensely negative *specifically* upon real or imagined exposure to the judgment/scrutiny of others regarding a perceived flaw or failure (e.g., being seen as incompetent, clumsy, physically inadequate).
      *   **Action vs. Self:** Account for the central phenomenological difference: guilt feels tied to a *specific act* ("I *did* something bad"), while shame feels tied to the *global self* ("*I am* something bad/inadequate").

  2.  **Fundamental Distinctions (Cannot Collapse):**
      *   **Affect vs. Motivation:** Differentiate the core emotional experience (feeling bad) from the distinct primary motivational tendencies:
          *   Guilt → Urge to *repair* (apologize, confess, make amends, fix the specific wrong).
          *   Shame → Urge to *hide, escape, or appease* (avoid eye contact, disappear, submit, sometimes lash out defensively).
      *   **Self-Evaluation vs. Social Evaluation:** Account for how guilt can arise purely from *internal* self-judgment against personal standards, while shame is inherently linked (even if internalized) to *real or imagined* judgment by an external audience/social standard. The "social eye" is constitutive for shame.
      *   **Specificity vs. Globality:** Explain why guilt is typically focused on a discrete behavior, while shame engulfs the entire sense of self-worth.

  **II. Strongly Preferred / Highly Important (Camp Preferences & Theoretical Depth):**

  3.  **Cross-Cultural Variation Nuance:** Account for cultural differences in the *elicitors*, *frequency*, *expression*, and *social functions* of guilt and shame *without* resorting to simplistic "guilt culture" vs. "shame culture" binaries. It must explain:
      *   *How* similar underlying mechanisms manifest differently.
      *   How cultures *utilize* both emotions strategically in socialization.
      *   Why both emotions exist universally but their prominence/triggers vary.

  4.  **Temporal Orientation Hypothesis (Your Framing):** Accommodate the idea that the core difference may lie in temporal focus:
      *   **Guilt:** Primarily backward-looking. Focuses on a *past* breach that needs closure/repair. ("*That* thing I did needs fixing.")
      *   **Shame:** Primarily forward-looking. Focuses on the *anticipated future* social consequences and damaged relational standing. ("How will I be seen/treated *now* and *from now on*?")
      *   **Implication:** If this holds, a culture emphasizing one emotion isn't just choosing a "feeling," it's shaping the *temporal horizon of moral regulation* – guilt focuses on correcting past errors, shame focuses on maintaining future social standing and avoiding exclusion.

  5.  **Developmental Trajectory:** Explain how both emotions emerge and are shaped through socialization (e.g., different parental discipline styles fostering one over the other).

  6.  **Functional Coherence:** Articulate the distinct adaptive/social functions each emotion serves (e.g., guilt repairing relationships/social bonds after transgression; shame protecting social status/group cohesion by motivating conformity and avoidance of exclusion).

  7.  **Relationship Dynamics:** Account for how guilt and shame operate within relationships (e.g., guilt often drawing people closer through repair, shame often creating distance/avoidance).

  **III. The Killer Desideratum: Cross-Cultural Variation Nuance**

  This requirement does the most damage to standard accounts:

  *   **Evolutionary Psychology:** While often acknowledging universality, standard evo-psych accounts struggle profoundly with the *diversity* of elicitors and expressions. They tend to:
      *   Overemphasize universal, biologically fixed "modules" or functions.
      *   Under-theorize the profound flexibility in *what* triggers shame/guilt across cultures (e.g., concepts of honor, modesty, autonomy).
      *   Risk circularity: Explaining cultural variation as merely "different expressions of the same evolved mechanism" without detailing *how* culture shapes the mechanism's operation so drastically.
      *   Struggle to explain why some cultures seem to utilize shame more effectively for social control without resorting to group selection arguments (which are contentious).

  *   **Strong Social Constructionism:** While adept at describing cultural variation, standard SC accounts struggle with:
      *   **Universality:** Why do *some* form of these distinct emotions appear in all cultures? Pure construction has difficulty explaining the seemingly non-arbitrary core distinctions (action vs. self, repair vs. hide) that persist cross-culturally.
      *   **Phenomenology:** Why does guilt *feel* like it's about an act and motivate repair, while shame *feels* like it's about the self and motivates hiding, even across diverse cultural contexts? Constructionism can label the feelings differently but struggles to explain the consistent *qualitative* differences in experience and motivation if they are purely cultural inventions.
      *   **Developmental Onset:** Young children display precursors to both guilt and shame relatively early, suggesting biological preparedness that constructionism often downplays.

  **Why Temporal Orientation Fits Well:**

  Your proposed framing elegantly addresses several constraints:
  *   **Backward (Guilt):** Naturally links to a specific past *act* and the motivation to *repair* that specific breach.
  *   **Forward (Shame):** Naturally links to the *global self* (as the object of future judgment) and the motivation to *hide* or *change standing* to avoid that negative future.
  *   **Cultural Choice:** Framing it as restructuring the "time-horizon of moral education" is powerful. A guilt-focus trains individuals to correct past errors for future harmony; a shame-focus trains individuals to constantly monitor and adjust their projected social self to *prevent* future exclusion. This avoids simplistic labeling and gets at the underlying pedagogical strategy.

  **In Summary:** A robust theory must fundamentally explain the core cases and distinctions (Hard Constraints). To avoid being a "just-so story," it *must* handle cross-cultural variation in a nuanced, non-binary way – this is the biggest challenge for existing dominant paradigms. Accommodating the temporal orientation hypothesis would be a significant strength, providing a deeper explanatory framework for how cultures utilize these emotions, but is currently a preference rather than an absolute requirement. The core phenomenological, motivational, and self/act distinctions remain paramount.
