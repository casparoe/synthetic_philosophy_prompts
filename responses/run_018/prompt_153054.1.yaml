prompt: |-
  I have been working through the boundary problem—who properly belongs to the demos—by testing my intuitions against concrete membership cases rather than deriving them from a single prior principle. Here are my verdicts, which I present for coherence-testing.

  First, long-term non-citizen residents who are fully subject to domestic law should eventually acquire full voting membership; mere administrative category seems insufficient to justify permanent exclusion. Second, citizens who have permanently emigrated and are no longer subject to domestic law should eventually forfeit membership, even if they retain nationality, cultural identity, or property interests; being outside the jurisdiction should eventually outweigh being inside the nationality. Third, outsiders severely affected by a polity’s decisions—downstream water users, for instance—merit consultation or weighted consideration, but not full membership; affectedness alone does not confer democratic standing. Fourth, future generations should be institutionally represented through proxy or constitutional mechanisms, yet they are not present members of the current demos; representation is not membership. Fifth, in territories that are governed but not incorporated—where residents bear all obligations without corresponding representation—I hold that full membership is required; the absence of incorporation is a contingent institutional failure, not a justification for exclusion.

  Two judgments, however, pull in opposite directions. A temporary worker who remains for fifteen years, building a life but retaining formal non-citizen status, strikes me as eventually entitled to membership; but a citizen abroad who continues to pay taxes and hold property strikes me as eventually not entitled, even though the latter maintains stronger formal ties and economic stakes. This suggests that being subject to law is doing more work than either nationality or economic stake, but I worry I am weighting jurisdictional presence ad hoc to save both verdicts.

  Is there a coherent principle—perhaps distinguishing jurisdictional subjection from affectedness, introducing a temporal threshold for incorporation, or separating membership from representation—that captures all five verdicts without collapse? Which of my judgments must be abandoned for the sake of coherence? In particular, can my differential treatment of the emigrant citizen and the long-term temporary worker be derived from a single account of what democratic membership is for, or does it depend on an unstated normative premise?

  Please lay out the candidate principles precisely, state which verdicts each saves and which it sacrifices, and apply them to at least one further case I have not considered—say, digital residents who participate economically and socially via remote presence without ever entering the physical territory. Be explicit about where your reasoning is most vulnerable and what specific counterexample or theoretical commitment would lead you to revise the principle you defend.
reasoning: |-
  Okay, let me start by really unpacking what the user is asking here. They're grappling with the boundary problem in democratic theory—figuring out who should be part of the demos. They've tested their intuitions against specific cases and arrived at five verdicts, but two of them seem to conflict. Specifically, they're struggling with why a long-term temporary worker should gain voting rights while an expat citizen who still pays taxes shouldn't keep theirs. The user wants to know if there's a coherent principle that can reconcile all their verdicts without contradiction.

  First, I need to understand each of their verdicts clearly. The first one is about long-term non-citizen residents gaining membership. The second is emigrant citizens losing membership over time. Third, affected outsiders like downstream communities deserve consultation but not full membership. Fourth, future generations need representation but aren't current members. Fifth, residents in unincorporated territories should be full members. The tension is between verdicts one and two when applied to the temporary worker versus the expat citizen.

  The user mentions being worried that they're weighting jurisdictional presence arbitrarily to save both verdicts. So their deeper concern might be about whether their approach is ad hoc or if there's a consistent underlying principle. They want coherence without abandoning their core intuitions. Also, they bring up a new case of digital residents, which adds another layer of complexity regarding physical presence versus economic/social participation.

  I should consider possible principles. Jurisdictional subjection seems central—being subject to the laws daily. For the temporary worker, they live under the laws, so subjection applies. The expat citizen isn't subject to daily laws despite paying taxes. But the user is unsure if this is sufficient. Maybe adding a temporal element? Like subjection over a significant period. That could explain why the temporary worker gains rights after 15 years, while the expat loses them over time.

  Affectedness alone isn't enough, which they already noted. So affected parties get input but not membership. Future generations are affected but represented through proxies, not as members. Unincorporated territories are clearly under jurisdiction without representation, so membership is required. 

  But the digital resident case is tricky. They participate economically and socially but aren't physically present. If jurisdictional subjection requires physical presence, they wouldn't qualify. But if subjection includes being bound by laws (like digital taxes or regulations), maybe they should have some rights. The user might need to decide how physical presence factors into subjection. 

  Another angle: democratic membership as functional. The purpose is to give voice to those governed by collective decisions. That justifies including long-term residents and territorial inhabitants, excluding those who left, and handling affected parties through consultation. Future generations can't participate currently, so representation instead. Digital residents might be governed by certain laws, so partial inclusion? But if they're not subject to the full legal system, maybe not full membership.

  The user's unstated premise might be that lived experience under the law creates a unique stake. Physical presence ties individuals to the community in ways that remote participation doesn't. That could explain the temporary worker vs. digital resident distinction. But the user needs to articulate why that experience matters more than formal ties or economic stakes.

  Potential counterarguments: What about expats who are affected by foreign policy decisions? Jurisdictional subjection might not cover that. Or digital residents whose primary economic life is in the polity. If subjection is key, but they're subject to tax laws, should they vote? The user might need to refine "subjection" to mean comprehensive legal binding, not just specific areas.

  In conclusion, the Jurisdictional Subjection Principle seems the most coherent, but requires clarifying the role of time and comprehensiveness of subjection. Sacrificing the expat's membership despite taxes might be necessary. For digital residents, if they're subject to laws beyond taxes (e.g., data privacy, platform regulations), they might merit partial inclusion, but not full membership without physical presence. The user's challenge is balancing consistency with their intuitions, possibly accepting that formal ties like nationality are secondary to being governed daily.
answer: |-
  Here’s a systematic analysis of your boundary problem, testing your intuitions against candidate principles for democratic membership. Your core tension (long-term non-citizen resident vs. emigrant citizen) reveals a deeper normative commitment to **jurisdictional subjection** over nationality or economic stakes, but it requires refinement to achieve full coherence.

  ---

  ### **Candidate Principles Tested Against Your Verdicts**
  *(Verdicts abbreviated: V1 = Long-term residents; V2 = Emigrant citizens; V3 = Affected outsiders; V4 = Future generations; V5 = Unincorporated territories)*

  1. **The Jurisdictional Subjection Principle (JSP)**  
     *"Full democratic membership requires enduring, comprehensive subjection to the polity’s binding laws and institutions."*  
     - **Saves**: V1 (resident subject to laws), V2 (emigrant escapes subjection), V5 (unincorporated residents are governed).  
     - **Sacrifices**: None of your verdicts, but complicates V3/V4.  
     - **Coherence with your judgments**:  
       - **Temporary worker (15 yrs)**: Included (daily subjection to laws).  
       - **Emigrant citizen**: Excluded (not subject to daily legal enforcement).  
       - **Key distinction**: Physical presence enables *enforceable* subjection; taxes/property are residual ties, not ongoing governance.  
     - **Digital resident test**:  
       - A programmer living abroad but paying local taxes, using digital services, and bound by data/privacy laws:  
         - *JSP verdict*: **No full membership**. Subject to *specific* laws but not comprehensive governance (e.g., criminal, civil, or environmental enforcement). May merit consultation (V3-like status) but not voting rights.  
     - **Vulnerability**:  
       - Counterexample: A diplomat living abroad remains fully subject to home-state laws (e.g., taxation, criminal liability) but isn’t resident.  
       - *Revision*: Add **"ordinary residence"** to exclude special-status individuals (diplomats, military).  

  2. **Functional Participation Principle (FPP)**  
     *"Membership requires participation in the collective production of social goods and subjection to shared burdens."*  
     - **Saves**: V1 (contributes to society), V2 (emigrant avoids shared burdens), V5 (unincorporated residents bear burdens).  
     - **Sacrifices**: V3 (affected outsiders may bear burdens, e.g., pollution) → risks over-inclusion.  
     - **Tension with your judgments**:  
       - **Emigrant paying taxes**: Still contributes economically → might justify retention of membership (contradicts your V2).  
       - **Temporary worker**: Clearly contributes labor → aligns with V1.  
     - **Digital resident test**:  
       - If they pay local taxes and use infrastructure (e.g., cloud services), FPP grants membership → *contradicts your V3 logic*.  
     - **Vulnerability**:  
       - Counterexample: A wealthy foreign investor pays taxes and employs citizens but never resides in the territory. FPP includes them; JSP excludes.  

  3. **Temporal Subjection Threshold (TST)**  
     *"Membership requires continuous physical presence + subjection to laws for a minimum period (e.g., 5-10 yrs)."*  
     - **Saves**: V1 (long-term residents included), V2 (emigrants excluded after time), V5 (unincorporated residents qualify).  
     - **Sacrifices**: None directly, but doesn’t resolve V3/V4.  
     - **Resolves your tension**:  
       - Temporary worker passes threshold; emigrant citizen fails despite formal ties.  
     - **Digital resident test**:  
       - Permanent remote workers never physically present → excluded, even after decades. Aligns with JSP.  
     - **Vulnerability**:  
       - Counterexample: Refugees subject to laws for decades but denied citizenship path. TST demands inclusion → highlights institutional failure (supports V5).  

  ---

  ### **Which Verdicts Must be Abandoned?**
  - **None**. All five verdicts cohere under **JSP + Temporal Threshold**, with clarifications:  
    - **V3 (affected outsiders)**: JSP explicitly excludes them → *consultation* is a non-membership remedy.  
    - **V4 (future generations)**: Proxy representation is a *functional substitute*, not membership → aligns with JSP’s subjection criterion (they aren’t subject to *current* laws).  
    - **V5 (unincorporated territories)**: Residents are subjected → JSP *requires* their inclusion.  

  ### **Resolving Your Core Tension**
  - **Emigrant citizen vs. Temporary worker**:  
    - **JSP explains the difference**:  
      - The worker is *daily* governed by labor, housing, and criminal laws; the emigrant faces sporadic/voluntary obligations (e.g., filing taxes).  
      - **Democratic purpose**: Membership legitimizes coercion. Those coerced *here and now* deserve a voice; those coerced *historically* (emigrants) do not.  
    - **Unstated premise**: Physical presence creates a unique moral claim because it enables *immediate*, non-consensual imposition of rules.  

  ---

  ### **Synthesis: Coherent Principle**
  **The Democratic Subjection Principle (DSP)**  
  *"Full voting membership requires (a) continuous physical presence within the polity’s jurisdiction, (b) direct subjection to its enforceable laws for a significant duration (e.g., >5 years), and (c) no special status negating ordinary civic integration (e.g., diplomats)."*  

  - **Captures all verdicts**:  
    - V1/V5: Met by (a)+(b).  
    - V2: Emigrants fail (a).  
    - V3: Affected outsiders fail (a)+(b) → only consultation.  
    - V4: Future generations fail (a) → only proxy representation.  
  - **Digital residents**: Excluded by (a). Physical presence ensures shared fate beyond transactional ties.  
  - **Counterexample resilience**:  
    - *Nomadic populations*: If continuously present in territory, qualify under (b).  
    - *Political dissidents exiled*: Fail (a) → lose membership, aligning with V2.  

  **Weakness**: DSP struggles with **non-territorial communities** (e.g., Indigenous nations). If jurisdiction is place-based, it excludes those with historic/cultural ties but no residency. This may require a supplemental principle for multinational states.  

  ---

  ### **Conclusion**
  Your differential treatment of the temporary worker and emigrant citizen **is coherent** under DSP. Abandoning formal nationality/economics in favor of *enduring jurisdictional subjection* preserves all five verdicts and addresses digital residents consistently. The core vulnerability—territorial bias—is defensible: democracy’s coercive power is spatially bounded, making physical presence non-arbitrary. If confronted with compelling cases of non-resident subjection (e.g., extraterritorial surveillance victims), DSP could be revised to include **"exceptional subjection to pervasive state power"** as a qualifier.
