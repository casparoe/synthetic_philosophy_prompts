prompt: |-
  Construct a thought experiment situated in an ordinary present-day institution — for instance, a municipal housing cooperative or a regional hospital trust — in which a staff member with formal authority circulates a statement that is factually accurate but presented with selective framing about a minority resident or patient group. The statement must contain no explicit falsehood, no direct call to action, no defamation, and no language that could be construed as incitement to violence or hatred; nevertheless, rational listeners, relying on the speaker's institutional credibility, form false beliefs about risk that cause them to withhold necessary cooperation from members of that group, producing concrete material harm. Engineer the case so that a strict interpretation of Mill's harm principle — which prohibits interference with expression only to prevent direct, assignable injury to others and excludes both mere offence and diffuse social deterioration — permits the speech, whereas a "credibility-mediated structural harm" account — which treats the rational erosion of cooperative norms via institutional authority as a form of harm — prohibits it. Keep the scenario to a single paragraph, avoid science-fictional technology, perfect predictors, or exotic legal regimes, and do not request or include bibliographies, citations, or reading lists. After presenting the scenario, analyse precisely why Mill's principle yields permission (noting the absence of direct causal injury and rights-violation) and why the structural-harm account yields prohibition (noting the credibility-laundering mechanism and the rational-but-mistaken belief formation). Identify the single feature of the case — such as the speaker's institutional role, the listeners' rational over-update, or the technical accuracy of the claim — that does the philosophical work; explain how both verdicts shift if that feature is removed; and set out how a defender of Mill's permissive conclusion would criticise the structural-harm framing without denying that harm occurs. Write the response in British English.
