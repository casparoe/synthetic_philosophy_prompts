  But I mustn't stop there - the user asks whether the disagreement is substantive or verbal. This requires unpacking how "morality" operates differently in each framework. For Devlin, it's sociological cement; for Hart, it's normative claims requiring justification. The harm principle itself presupposes an institutional ontology where individual interests can be separated from collective sentiment.

  The empirical question about societal collapse is crucial. If robust evidence emerged that permissive societies don't disintegrate, that would undermine Devlin's foundational premise. But his position might retreat to tautology - defining "society" as inherently moral. This reveals how the ontological commitments make the debate resistant to resolution.

  Regarding progress possibilities: conceptual clarification alone won't suffice because the frameworks are self-reinforcing. Empirical evidence might shift the burden of proof but not settle the normative disagreement. The deepest issue concerns competing visions of liberty - as non-interference versus as enabled by social preconditions.

  My diagnosis feels most vulnerable at the point about empirical evidence. If longitudinal studies showed moral pluralism inevitably causes collapse, that would strengthen Devlin. But since societies exist on spectrums, such clear evidence is unlikely. The ontological premises ultimately determine what counts as evidence.

