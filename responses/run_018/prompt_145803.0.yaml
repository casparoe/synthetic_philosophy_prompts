answer: |-
  Your challenge to the standard analogical account of Thomson's violinist is compelling and philosophically rich. Below, I address your three core questions and suggest refinements for "bodily sovereignty panic":

  ### 1. **Does the distinction between analogical mapping and affective colonization hold up?**
     **Yes, this is a substantive advance beyond "emotional bias" warnings.**  
     - **Analogical mapping** treats persuasion as *cognitive*: shared logical structures (e.g., non-consensual bodily use) are mapped onto the target domain (pregnancy). Disanalogies (e.g., biological kinship, duration) should weaken the argument.  
     - **Affective colonization** is *phenomenological hijacking*: The violinist scenario isn’t just *compared* to pregnancy—it *injects* a visceral panic response ("My body is being violated!") into the target. This panic is then mistaken for an intrinsic feature of pregnancy itself.  
     - **Key Difference**: Where emotional bias critiques warn that feelings *distort* reasoning, your model shows the pump *bypasses* reasoning entirely by implanting an affective frame that feels evidentially native. Critics pointing out disanalogies fail because they target logic while the affect operates autonomously.  
     - **Novelty**: This explains *why* disanalogies are ineffective—a problem the "bias" framework doesn’t resolve.

  ### 2. **Have philosophers mischaracterized the violinist’s deployment?**
     **They often *claim* to rely on analogy but implicitly depend on affect:**  
     - **Thomson’s Text**: While she frames it as an analogy ("[Pregnancy] is like..." [*Philosophy & Public Affairs*, 1971]), her rhetoric leans heavily on visceral language ("you wake up *attached*", "your kidneys used"). The analogy’s power derives from violating bodily integrity, not abstract similarity.  
     - **Philosophers’ Usage**: Pro-choice advocates often present it as a *logical* analogy but defend it against disanalogies by retreating to bodily autonomy’s primacy (e.g., "No one *ever* has a right to use your body without consent"). This reveals reliance on the *affective core* of sovereignty panic, not pure structure.  
     - **Counterevidence**: Critics like John Finnis focus on disanalogies (e.g., pregnancy as natural vs. artificial hookup), implying they take the analogical claim at face value. Your critique exposes why their objections often fall flat in public discourse.

  ### 3. **Does this framing illegitimately dismiss genuine moral features?**
     **No—it shows how pumps *exploit* genuine features via affective distortion:**  
     - Bodily autonomy *is* a legitimate moral concern. The problem is the pump’s mechanism: it induces **hyperbolic panic** (sudden, violent, parasitic intrusion) and presents it as *synonymous* with pregnancy.  
     - This smuggles in two contested premises:  
       (a) That pregnancy is *always* experienced as a "sovereignty violation" (ignoring varied phenomenology);  
       (b) That the violinist-level panic is a *reliable* indicator of objective moral violation.  
     - **Crucial nuance**: Affective colonization doesn’t deny bodily autonomy’s importance. It argues the pump *amplifies* it into panic that crowds out other morally relevant features (e.g., fetal dependence, relational obligations). The response isn’t tracking "autonomy" neutrally—it’s tracking *panic-as-moral-evidence*.

  ---

  ### Sharpening "Bodily Sovereignty Panic"
  To avoid conflating this with generic "intuitions are unreliable":
  - **Define it as a specific phenomenological profile**:  
    > *"A visceral, non-consensual loss of physical agency characterized by:*  
    > *(a) Urgency (demanding immediate reversal),*  
    > *(b) Spatial violation (external entity breaching bodily boundaries),*  
    > *(c) Contamination fear (integrity compromised by foreign 'use'),*  
    > *(d) Agential reduction (body treated as a means for another’s ends)."*  

  - **Contrast with milder autonomy concerns**:  
    Sovereignty panic isn’t just "I prefer control"—it’s "I am being *colonized*." This differentiates it from non-panicked assertions of autonomy (e.g., refusing a vaccine).

  - **Test against disanalogies**:  
    The violinist triggers panic even if we *know* the disanalogies—because the affect persists independently. Generic intuition skepticism wouldn’t predict this resilience.

  ---

  ### Applications Beyond the Violinist
  Your framework clarifies other pumps:
  - **Killing vs. Letting Die**: Foot’s trolley problem might induce "causal contamination panic"—the switch triggers a visceral unease about *direct* harm (even if logically equivalent to inaction). Critics listing disanalogies (e.g., distance, intention) miss that the pump’s power lies in the *felt taint of agency*.
  - **Experience Machine**: Not just preference for "reality," but *existential claustrophobia* at being trapped in artificiality.

  ---

  ### Suggested Refinements
  1. **Terminology**: Consider "affective grafting" or "phenomenological imposition" if "colonization" feels too politically loaded.  
  2. **Empirical Support**: Cite studies on embodied cognition (e.g., how spatial violation language triggers disgust) or Greene’s fMRI work on emotional vs. utilitarian reasoning.  
  3. **Response to Proponents**: Argue that if philosophers want the violinist to work *as an analogy*, they must engage disanalogies. If they retreat to affect, they concede your point.

  Your model doesn’t just critique emotional bias—it exposes a *mechanism* by which intuition pumps evade logical refutation. That’s a significant contribution to metaphilosophy.
