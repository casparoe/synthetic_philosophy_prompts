  For misconceptions, the physicist's "noisy prior" framing needs early interception when introducing uncertain evidence. The rigidity condition must precede the formula to prevent misapplication. The weighted-averaging confusion should be addressed right after presenting the rule, using the carrying example to demonstrate calculation mismatch.

  The check-for-understanding question should use a 3-color partition (red/green/blue) with shifted probabilities to force application beyond binary cases. Deliberately excluded topics like minimum relative entropy should be flagged only at the end to avoid overwhelming students.

