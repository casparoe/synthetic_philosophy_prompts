answer: |-
  Your observation captures a profound and specific phenomenon in constrained translation. While no single, universally established term exists for this **cumulative, constraint-induced conceptual displacement**, we can define it precisely and differentiate it from related concepts:

  ### Proposed Term & Definition
  **Constraint-Driven Conceptual Drift (CDCD)**  
  *The systematic, cumulative alteration of a text's conceptual framework resulting from formally necessary local substitutions (lexical, syntactic, structural) that preserve meter, rhyme, or other rigid formal constraints. Each substitution is locally justifiable for formal coherence, but their aggregate effect distorts the source text's core philosophical/ideological architecture, creating a coherent but alien interpretation.*

  ### Essential Features of CDCD
  1.  **Formal Preservation:** The primary driver is adherence to external formal rules (meter, rhyme, syllable count, fixed form).
  2.  **Local Justification:** Each individual alteration (word choice, voice change, phrase rearrangement) is rationally defensible as the "least bad option" to meet the formal constraint at that specific point.
  3.  **Global Divergence:** The cumulative effect of these local compromises fundamentally shifts the text's underlying conceptual structure (e.g., ontology, epistemology, agency).
  4.  **Internal Coherence:** The translated text forms a coherent, often elegant, system *within itself* and under the adopted constraints.
  5.  **Conceptual Alienation:** This new coherence exists in tension with, or opposition to, the explicit philosophical commitments of the source text.
  6.  **Systematicity:** The distortion arises from *patterns* of substitution forced by the constraints across the entire work, not isolated errors.

  ### Differentiation from Related Concepts
  1.  **Belles Infidèles ("Beautiful Unfaithfuls"):**
      *   **Focus:** Prioritizing aesthetic pleasure (fluency, elegance, cultural appeal) over literal accuracy, often involving *stylistic* embellishment, omission, or adaptation.
      *   **Driver:** Target-culture aesthetic norms or reader expectations, not primarily rigid *formal* constraints.
      *   **CDCD Distinction:** CDCD is a *subset* of belles infidèles driven *specifically* by structural formal constraints (meter, rhyme), leading to *systematic conceptual* distortion, not just stylistic or cultural adaptation. Not all belles infidèles involve conceptual drift, and not all conceptual drift is caused by formal constraints.

  2.  **Domestication (Venuti):**
      *   **Focus:** Making the foreign text familiar and easy for the target reader by minimizing linguistic and cultural differences, aligning it with target-culture values and idioms.
      *   **Driver:** Reducing reader effort, adhering to dominant target-culture norms.
      *   **CDCD Distinction:** CDCD's driver is *formal constraint*, not cultural familiarity. While domestication *might* use formal constraints, CDCD specifically results in *conceptual* displacement due to *systematic lexical/syntactic substitution forced by form*. Domestication could occur without formal constraints and might not alter core concepts.

  3.  **Simple Mistranslation:**
      *   **Focus:** An *error* in comprehension or rendering at the word, phrase, or sentence level.
      *   **Driver:** Lack of knowledge, carelessness, or ambiguity in the source.
      *   **CDCD Distinction:** CDCD alterations are *conscious, deliberate choices* made under formal duress, not errors. They are locally justifiable compromises, not misunderstandings. The distortion arises from the *accumulation* of these compromises, not isolated inaccuracies. The translator understands the source meaning but sacrifices it for form.

  4.  **Poetic License:**
      *   **Focus:** Freedom taken by a poet/translator to deviate from standard form, literal meaning, or convention for artistic effect.
      *   **Driver:** Artistic expression, impact, or creativity.
      *   **CDCD Distinction:** CDCD is driven by *external constraint*, not freedom. It's a *necessity* imposed by the chosen form, often resulting in unintended conceptual consequences, rather than a deliberate artistic choice to enhance meaning or effect.

  ### Applicability Beyond Philosophical Texts
  **CDCD is NOT exclusive to philosophical texts.** It can occur whenever:
  1.  **Formal Constraints are Severe:** Rigid meter, rhyme schemes, syllabic limits, acrostics, specific stanza forms.
  2.  **Lexical/Conceptual Density is High:** The source text relies on precise terminology with specific meanings within a complex system (e.g., legal contracts, scientific theories, theological doctrines, dense literary symbolism).
  3.  **The Work is Long:** Short poems might absorb substitutions without significant drift; longer works allow the cumulative effect to manifest.

  **Examples Beyond Philosophy:**
  *   Translating a scientific paper on quantum mechanics into strict haiku, forcing simplifications that collapse wave functions into particle metaphors.
  *   Rendering a complex legal clause into rhyming verse, altering nuanced conditional logic to fit the rhyme scheme.
  *   Translating a psychologically dense novel passage into a fixed sonnet form, compressing internal monologue into external action to fit the meter.

  ### Why Philosophy is Particularly Vulnerable
  Philosophical texts are prime candidates for CDCD because:
  1.  **Precision of Terminology:** Terms like "substance," "accident," "intentionality," "causality" carry specific, often contested, meanings. Finding perfect synonyms under formal constraint is near impossible.
  2.  **Systematic Interdependence:** Concepts are tightly woven into a logical structure. Altering one term can necessitate altering connected terms, cascading through the system.
  3.  **Argumentative Nuance:** Subtle shifts in voice (active/passive), modality (possibility/necessity), or agency can fundamentally change an argument's implications.
  4.  **Metaphysical Stakes:** Questions about the nature of reality, being, and causation are highly sensitive to the specific language used to describe them.

  ### Conclusion
  **Constraint-Driven Conceptual Drift (CDCD)** describes the insidious process where the imperative to preserve rigid formal structures (meter, rhyme) in translation forces a series of locally defensible compromises that, cumulatively and systematically, reconstruct the text's conceptual foundation, resulting in a work that is formally perfect and internally coherent but philosophically divergent from its source. It arises from the fundamental tension between semantic fidelity and formal constraint, particularly potent in long, conceptually dense texts. While philosophical texts are acutely susceptible due to their reliance on precise terminology within logical systems, CDCD is a risk in any translation project where severe formal rules meet high semantic/conceptual density over an extended work. Recognizing CDCD is crucial for critically evaluating translations, especially those lauded for their formal beauty.
