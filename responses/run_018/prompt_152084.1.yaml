  - **Virtue Ethics**: Calculation *corrupts character*. Fits parental rescue (good parents don’t hesitate) and EA (turning love into math is dehumanizing). This might be the tutor’s unspoken angle.  
  - **Utilitarian Reply**: Rejecting calculation is *irrational*. Defensible but unpopular—ignores Williams’ deeper point about reasons.  

  For the parental rescue case, the normative and virtue readings hit hardest. For EA, the virtue critique (math corrupts moral sensibility) is stronger than normative objections, since EA openly challenges agent-relativity. The psychological reading is shaky for EA—effective altruists *cultivate* deliberative habits.  

  The tutor might be smuggling in virtue ethics when attacking EA, while leaning on normative reasons for the parental case. That’s why the user feels it’s "not the same claim." I’ll flag that tension.  

  User’s deeper need: They likely want ammunition to challenge the tutor’s consistency *or* to reconcile the two uses. I’ll emphasize which readings actually bridge both cases without contradiction (spoiler: virtue ethics does this best).  

