answer: |-
  ### Final Examination Question: Philosophy & Economics of Choice  
  **Time Allowed:** 40 minutes (for this question)  
  **Total Marks:** 20  

  ---

  #### Question  
  **Background:**  
  In revealed-preference theory, a *choice function* \(c\) assigns a non-empty set of chosen bundles \(c(B) \subseteq B\) for every budget set \(B\) (a set of affordable bundles given prices and wealth). The *Weak Axiom of Revealed Preference (WARP)* states: if bundle \(x\) is chosen over \(y\) in some budget set where both are available, then \(y\) is never chosen over \(x\) in any budget set where both are available. A *utility representation* of \(c\) is a function \(u\) such that for all \(B\), \(c(B)\) is precisely the set of utility-maximizing bundles in \(B\). The existence of such a \(u\) follows from WARP (and other conditions), but \(u\) is unique only up to increasing transformations (ordinal uniqueness).  

  **Stipulations:**  
  1. Agents **Ana** and **Bao** have *identical choice functions* over all budget sets: for any prices and wealth, they choose the same bundle(s). Thus, they share the same revealed preferences and utility representations.  
  2. **Ana**’s choices result from informed, stable deliberation: she would repeat her choices under reflection.  
  3. **Bao**’s choices stem from a cue-triggered heuristic. He regrets many choices, would reject them upon reflection, and *pays a non-trivial sum* to remove specific goods from future menus. His payment is itself a choice from a "menu of menus" (e.g., paying to ban good \(X\) tomorrow).  
  4. A regulator bans a good \(Z\). The *compensating variation (CV)* of the ban is computed as the minimum wealth compensation needed to restore an agent’s pre-ban maximal utility level, using the utility function derived from *pre-ban choices*.  

  **Tasks:**  
  (A) Explain why Ana and Bao’s identical choice functions imply identical *revealed* welfare judgments under standard cost-benefit analysis. (3 marks)  
  (B) Argue whether the *utility representation* of their choices can meaningfully represent "welfare" for both agents. Use the **differences in choice-generation** (Stipulations 2–3) to justify your view. (5 marks)  
  (C) Bao’s payment to restrict future menus constitutes a "higher-level" choice. Does this resolve the welfare problem? Address:  
   (i) Why one might privilege this higher-level choice;  
   (ii) Whether this invites a regress (e.g., "choices over menus of menus of menus");  
   (iii) If the revealed-preference apparatus can halt the regress *without invoking non-choice elements*. (6 marks)  
  (D) **Applied Coda:** The regulator bans good \(Z\). For Bao, \(Z\) is a good he paid to remove from his own menus. Does the pre-ban CV:  
   (i) Measure welfare loss accurately for Bao?  
   (ii) Differ in its normative significance between Ana and Bao?  
  Justify using the concepts above. (6 marks)  

  ---

  ### Model Answer (800 words)  
  **(A) Standard welfare analysis based on revealed preference treats Ana and Bao identically.** Since their choice functions are identical, they reveal the same preferences over bundles (e.g., \(x \succ y\) whenever \(x\) is chosen over \(y\)). Cost-benefit analysis uses the utility representation \(u\) of these choices to compute welfare measures like compensating variation (CV). As \(u\) is ordinally unique and derived solely from choices, any CV calculation will be identical for both agents. This implies the ban affects their "welfare" identically in the model.  

  **(B) The utility representation cannot meaningfully represent welfare for Bao**, given how choices are generated.  
  - For Ana, choices align with reflective, stable preferences: \(u\) maps bundles to a scale tracking her well-being (e.g., higher \(u =\) better off). Welfare criticism is possible (e.g., "you’d be happier with \(y\)") but requires external validation (e.g., post-choice reflection).  
  - For Bao, choices *contradict* his reflective preferences. He pays to avoid cues precisely because his heuristic choices *misrepresent* his welfare. The utility function \(u\) derived from these choices encodes *mistakes* (e.g., \(u\) ranks cue-triggered bundles highly, but Bao disavows them). Thus, \(u\) is a bookkeeping tool for *behavior* but not welfare.  
  - **Key distinction**: Utility representations are *consistent summaries of choice*, but welfare requires a *criterion independent of choice* to evaluate choices themselves. Ana meets this criterion (deliberation validates choices); Bao does not (refutation invalidates choices).  

  **(C) Privileging higher-level choices resolves nothing and creates regress:**  
  *(i) Privileging higher-level choices*: One might claim Bao’s menu-restriction payment reveals his "true" preference, overriding heuristic choices. This assumes choices at "higher" levels (e.g., over menus) are more authentic.  
  *(ii) Regress problem*: If a choice over menus is privileged, why not choices over "menus of menus"? Bao might regret his payment choice later (e.g., "I shouldn’t have banned \(Z\)!") and pay to reverse it. Any level \(n\) choice could be challenged at level \(n+1\).  
  *(iii) No non-circular halting point*: The apparatus cannot halt regress without smuggling in non-choice criteria. To privilege level \(k\), we need:  
  - A *normative axiom* (e.g., "choices with full information are authentic"), but this invokes non-behavioral concepts (e.g., "information" as a mental state).  
  - *WARP across levels*: Even if WARP holds at all levels, inconsistency *between* levels remains (e.g., heuristic choices violate reflective menu choices). Only an external standard (e.g., "welfare = reflective preferences") can halt regress—but this abandons pure revealed preference.  

  **(D) CV’s normative significance differs critically for Ana vs. Bao:**  
  *(i) Inaccuracy for Bao*: Pre-ban CV uses \(u\) derived from Bao’s heuristic choices. Since these choices overstate his welfare gain from \(Z\) (he regrets choosing it and pays to avoid it), CV *overstates* his welfare loss from banning \(Z\). For example, if \(u(Z) = 10\) and \(u(\text{non-}Z) = 5\), CV might demand £5 compensation. But Bao’s reflective preference values \(Z\) at, say, \(2\)—so true compensation needed is £0.80. Using pre-ban \(u\) ignores that \(Z\) was a temptation good.  
  *(ii) Divergent normative significance*:  
  - For Ana, CV approximates welfare loss: her choices reveal stable values, so restoring \(u\) restores well-being.  
  - For Bao, CV measures *behavioral adaptation cost* (wealth needed to mimic pre-ban *choices*), not welfare. Compensating him based on CV would *reinforce poor choices* (e.g., he might spend £5 on another temptation). The analyst faces a dilemma:  
   - If welfare is defined by choice, CV is "correct" but upholds self-harming behavior.  
   - If welfare requires overriding choice (e.g., using Bao’s menu-restriction payment as evidence), CV must be recomputed using a new "authentic" utility function—but revealed preference cannot construct this from choices alone.  

  **Verdict**: Revealed preference needs **two non-behavioral additions** for welfare significance:  
  1. A **criterion of authenticity** (e.g., choices under full information/reflection) to distinguish "welfare-relevant" preferences.  
  2. A **stopping rule** for regress (e.g., "highest level of reflection available").  
  Adding these is **circular** within strict behaviorism (both require mental states) but **genuinely available** if we expand the model to include cognitive processes (e.g., deliberation as input). Without this, welfare economics collapses into behavioral bookkeeping.  

  ---

  ### Marking Scheme (20 marks total)  
  1. **Define ordinal utility/WARP correctly** (3 marks):  
     - State that utility is ordinally unique (increasing transformations preserve choices).  
     - *Common error: Claiming utility is "cardinal" or misstating WARP.*  
  2. **Contrast Ana/Bao using choice-generation** (4 marks):  
     - Explain Ana: choices ≡ welfare (deliberation validates).  
     - Explain Bao: choices ≠ welfare (regret invalidates).  
     - *Common error: Treating them identically or ignoring stipulations.*  
  3. **Analyze higher-level choice/regress** (5 marks):  
     - Note appeal of privileging menu choices (i).  
     - Identify regress (ii).  
     - Conclude apparatus fails without non-choice halting rule (iii).  
     - *Common error: Asserting "higher-level preferences solve everything" without addressing regress.*  
  4. **CV application** (5 marks):  
     - Show CV overstates loss for Bao due to temptation (i).  
     - Contrast normative significance (Ana: legitimate; Bao: behavioral only) (ii).  
     - *Common error: Ignoring that Bao’s payment reveals \(Z\) as low-welfare.*  
  5. **Thesis on ordinality/welfare** (3 marks):  
     - State ordinality ≠ welfare irrelevance (Ana’s \(u\) works; Bao’s fails for non-ordinal reasons).  
     - *Common error: Claiming "ordinal utility cannot measure welfare" as a blanket statement.*  

  ---

  ### What This Tests & Unanticipated Insights  
  **Core skills tested**:  
  - Distilling technical apparatus (WARP → utility) without citations.  
  - Deploying thought experiments to expose assumptions.  
  - Recognizing that ordinality does not preclude welfare analysis *if* preferences are authentic.  

  **Strong candidates might**:  
  - Note that Bao’s "regret" is itself behavioral (e.g., post-hoc choices) but insufficient to define welfare without a stability condition.  
  - Argue that *all* welfare claims require non-choice foundations (even Ana’s deliberation invokes cognition), making "circularity" inevitable but manageable.  
  - Propose that revealed preference *with error terms* (e.g., random utility models) could formalize Bao’s inconsistency—but this still needs a welfare-relevant error metric.  

  **Question’s purpose**: To force engagement with the *metaphysics* of preference beneath the technical machinery—where economics meets philosophy.
