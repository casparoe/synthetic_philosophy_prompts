answer: |-
  ## Dissertation Chapter Proposal: Diachronic Agency and the Limits of Coherence in Money-Pump Arguments for Expected Utility

  **Project Title:** Cracks in the Coherence Foundation? Information Dynamics and Diachronic Norms in Money-Pump Arguments for Expected Utility Maximization

  **1. The Core Question & Hypothesis:**
  The central question is: **Do all money-pump arguments for the core axioms of Expected Utility Theory (EUT), particularly the Independence Axiom, rely fundamentally on norms of diachronic agency (e.g., planning commitment), rather than solely on synchronic coherence of preferences?**

  *   **Hypothesis:** Money-pump arguments fall into two structurally distinct classes:
      *   **Class 1 (Static Pumps):** Target violations of axioms like Completeness or Transitivity (e.g., cyclic preferences). These operate on a single, unchanging preference ordering *without* intermediate resolution of uncertainty or acquisition of new information relevant to the preferences. Exploitability stems directly from synchronic inconsistency ("paying to cycle").
      *   **Class 2 (Information-Sensitive Pumps):** Target violations of the Independence Axiom specifically. These arguments *require* the resolution of a chance event or receipt of new information *during* the sequence of choices. Exploitability crucially depends on the agent revising their planned course of action based on this new information in a way that reveals a conflict between prior planning intentions and subsequent choices under the new state.
  *   **What would confirm the hypothesis?** Demonstrating that *every* plausible money-pump argument for Independence violation *necessarily* involves an intermediate information update step triggering a revision of planned action, and that no pump exploiting Independence violation can be constructed within the static framework used for Transitivity violations.
  *   **What would refute the hypothesis?** Constructing a money-pump argument for Independence violation that: (a) demonstrably exploits a synchronic preference violation (e.g., a specific pattern of pairwise choices at a single time), and (b) operates *without* any intermediate resolution of uncertainty or information update relevant to the preferences between the key options. Showing that the dynamic element in existing Independence pumps is eliminable or merely heuristic, not fundamental.

  **2. Why the Question is Open & Significant:**
  *   **Against Representation Theorem Complacency:** Representation theorems (e.g., Savage, von Neumann-Morgenstern) elegantly derive EUT from synchronic preference axioms. However, they are *static* characterizations. They do not model the *process* of sequential choice under uncertainty, nor do they explicitly address how an agent should *manage* their choices *over time* when information arrives. They leave open the question of whether the *rational enforceability* of these axioms in dynamic settings requires *additional* norms beyond synchronic coherence. Money-pump arguments, as dynamic justifications, purport to close this gap. This project scrutinizes whether they succeed solely with synchronic coherence or need diachronic glue.
  *   **Against "Merely Heuristic" Dismissal:** Dismissing money-pumps as mere intuition pumps overlooks their normative ambition: they aim to show that violating axioms is *pragmatically self-defeating* and thus *irrational*. If the Independence pump genuinely relies on diachronic norms (like commitment to a plan – **sophisticated** or **resolute** choice – see McClennen), then dismissing it as heuristic misses the crucial point: the *nature* of the irrationality demonstrated changes. It shifts from synchronic inconsistency to a failure of diachronic agency or foresight (e.g., foreseeably adopting a plan you know you'll abandon to your detriment). This project takes the normative force of the pump seriously and asks what *precisely* grounds it.

  **3. Methodology (Armchair Analysis & Taxonomy):**
  This is a conceptual, philosophical analysis grounded in decision theory. The year will be structured as follows:

  *   **Months 1-2: Foundational Groundwork & Taxonomy Framework:**
      *   Precisely define key concepts: "information update," "relevant to preferences," "planned action," "exploitability."
      *   Develop a formal schema for representing money-pump sequences, specifying: initial options, choice points, available actions, information partitions/events, preference profiles at each choice node.
      *   Define the distinguishing feature: Presence/Absence of an information update *between choice stages* that is *relevant* to the agent's evaluation of the ultimate outcomes (i.e., affects which state-dependent outcome will materialize).
  *   **Months 3-5: Comprehensive Pump Analysis:**
      *   Systematically analyze canonical money-pump arguments from the literature targeting: Cyclic Preferences (Transitivity), State-Dependence (Savage's P2), and critically, various formulations against Independence violations (e.g., Allais-type scenarios, sequential choice formulations).
      *   For *each* argument, apply the schema: Does it require an intermediate information update? Does the exploit *depend* on the agent revising their choice based on this update compared to a prior plan/intention?
      *   Focus on *argument structure*, not just examples. Ask: "Could this *type* of exploit work without the information update?" Attempt to construct static versions for Independence violations.
  *   **Months 6-8: Diachronic Norm Articulation & Comparison:**
      *   For identified Information-Sensitive Pumps, articulate the precise diachronic norm implied (e.g., **Sophistication**: predict and choose optimally given future predicted choices; **Resoluteness**: stick to a previously optimal plan; **Foresight Dominance**: avoid plans foreseeably dominated).
      *   Analyze the logical relationship and potential conflicts between these diachronic norms and synchronic coherence axioms. Examine arguments for/against their reducibility to synchronic norms.
      *   Investigate the connection to the **Sure-Thing Principle** and dynamic **Consequentialism** (evaluating choices *only* by their consequences from that point onward).
  *   **Months 9-11: Synthesis, Implications, and Refinement:**
      *   Synthesize findings: Is the taxonomy exhaustive? Do Independence pumps *necessarily* fall into Class 2?
      *   Refine the hypothesis based on analysis.
      *   Explore implications: If the hypothesis holds, what does it mean for the justification of EUT? Does it suggest a different normative foundation (diachronic planning rationality)? Does it create space for alternative models (e.g., models accommodating Allais preferences)?
  *   **Month 12: Chapter Drafting & Integration:**
      *   Write the chapter integrating the analysis, arguments, and conclusions.

  **4. Range of Possible Conclusions & Deciding Factors:**

  *   **Hypothesis Strongly Confirmed:** All Independence pumps are Information-Sensitive; static pumps only exist for other axioms. Deciding Factors: Failure to construct any static Independence pump; demonstrable reliance on information-update-triggered-plan-revision in *all* analyzed Independence arguments.
  *   **Hypothesis Partially Confirmed:** Most Independence pumps are Information-Sensitive, but one obscure/strained static version exists. Deciding Factors: Discovery of a plausible static Independence pump; mixed results across argument formulations.
  *   **Hypothesis Refuted:** A clear, robust static money-pump for Independence violation is constructed. Deciding Factors: Success in constructing such a pump meeting the criteria.
  *   **Taxonomy Inadequate:** The Static/Information-Sensitive distinction proves blurry or non-exhaustive (e.g., pumps relying on preference *change* without information update). Deciding Factors: Identification of pumps that don't fit either category cleanly.
  *   **Diachronic Norm Reducible:** While Information-Sensitive pumps exist, the required diachronic norms are shown to be derivable from synchronic coherence plus minimal rationality principles. Deciding Factors: Successful argument demonstrating such derivability.

  **5. Failure Conditions & Honest Assessment:**

  *   **Project Fails If:**
      *   The taxonomy proves unusable or non-exhaustive, failing to capture a key dimension relevant to the normative foundations of the pumps.
      *   The distinction between pump types is less sharp than hypothesized (e.g., some Transitivity pumps might subtly involve information dynamics).
      *   The diachronic norms identified as crucial for Independence pumps are convincingly shown to be reducible to synchronic considerations combined with uncontroversial dynamic choice principles (like minimal rationality in foreseeing consequences).
      *   The project gets bogged down in unresolvable disputes about the interpretation of specific pump arguments or the definition of key terms (e.g., "exploit," "relevant information").
  *   **Honest Outcome:** The most likely "partial failure" is discovering that the diachronic norm *is* required but is less controversial or more tightly linked to synchronic coherence than initially thought. Another likely challenge is definitively proving the *impossibility* of a static Independence pump.

  **6. Scope Limitations & Prioritization:**

  *   **Too Big for One Year:** Comprehensively covering *all* variants of money-pump arguments, deeply engaging with all philosophical debates on diachronic agency (e.g., Bratman's planning theory), or fully developing the implications for alternative decision theories is infeasible.
  *   **Prioritization & Cuts:**
      *   **First Cut:** Limit detailed analysis to the most widely discussed and canonical pump arguments for Transitivity/Completeness vs. Independence. Deeper dives into obscure variants or pumps for other axioms (e.g., Continuity) would be sacrificed.
      *   **Second Cut:** Focus primarily on articulating the *need* for diachronic norms and the structure of the pumps, rather than providing a fully developed positive theory of diachronic rationality or extensively defending one specific norm (e.g., Resoluteness vs. Sophistication) as the correct one.
      *   **Third Cut:** Limit direct engagement with highly complex technical decision-theoretic models unless absolutely necessary for the core argument. Prioritize conceptual clarity.

  **7. Settled vs. Contested Terrain (Closing Note):**

  *   **Settled (Structural Consensus):**
      *   Representation theorems *mathematically* derive EUT from synchronic preference axioms (Completeness, Transitivity, Independence, etc.) under specific structural assumptions.
      *   Violations of Transitivity *can* lead to cyclic choice and straightforward money-pumps without information updates.
      *   Dynamic choice introduces complexities (planning, commitment, information arrival) not explicitly modeled in static representation theorems.
  *   **Genuinely Contested:**
      *   **The Normative Force & Target of Money-Pumps:** Is exploitability inherently irrational? Is it evidence of synchronic inconsistency, diachronic incoherence, or mere costly mistake? (Contested between e.g., Hammond, Machina, McClennen, Steele)
      *   **Dynamic Arguments & Consequentialism:** Can dynamic choice arguments *justify* consequentialism (e.g., the Sure-Thing Principle) or do they presuppose it? (Contested: e.g., Hammond vs. McClennen)
      *   **Independence of Planning Norms:** Are norms like commitment (Resoluteness) or sophisticated planning *derivable* from synchronic coherence plus consequentialism, or are they genuinely additional, independent requirements of rationality? (Central debate: e.g., McClennen vs. Machina, Steele)
      *   **The Status of the Independence Axiom:** Is it a core requirement of instrumental rationality, or a more context-dependent principle that can be rationally violated (e.g., Allais paradox)? (Persistent debate since Allais)
      *   **The Reducibility of Diachronic Rationality:** Can all requirements of rationality over time be reduced to requirements on synchronic mental states (preferences, beliefs, intentions) at each time? (Deep philosophical debate in agency theory).

  This project directly engages these contested areas by probing whether the dynamic arguments for the *most* contested axiom (Independence) inherently depend on contested norms of diachronic agency, thereby challenging the view that coherence considerations alone can ground full EUT.
