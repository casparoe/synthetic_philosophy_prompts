  The key elements here are: metric-driven ontology, reclassification of intangible work, institutional blindness as rigor, and shadow practices. I should check if there's existing literature. Marilyn Strathern's work on audit culture and Espeland and Sauder's reactivity come close, but they don't address the ontological inversion. Bowker and Star's work on classification might touch on it, but not the virtue aspect of blindness.

