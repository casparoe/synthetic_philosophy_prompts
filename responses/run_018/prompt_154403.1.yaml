answer: |-
  Your observation captures a profound institutional pathology that sits at the intersection of several established concepts but isn't fully encapsulated by any single one. After mapping the key distinctions you requested:

  **1. Incentive Distortion (Goodhart's Law):**  
     *What it is:* When a measure becomes a target, it ceases to be a good measure.  
     *Where it falls short:* It explains behavioral gaming but not the **ontological shift** where the measurable becomes *definitionally* legitimate and the immeasurable is actively devalued as "non-core."

  **2. Epistemic Closure:**  
     *What it is:* Systems ignoring information outside predefined frameworks.  
     *Where it falls short:* It describes knowledge exclusion but not the **active redefinition of professional essence** or the **reframing of blindness as rigor.**

  **3. Ontological Redefinition:**  
     *What it is:* Shifting what "counts" as real within a social domain.  
     *Where it falls short:* Your case adds the **specific mechanism (metrics)** and the **perverse valorization of ignorance.**

  **Foucault's Disciplinary Mechanisms** are foundational but require refinement:  
  - *Examination/Visibility:* Makes individuals objects of knowledge.  
  - *Panopticism:* Internalized surveillance inducing self-discipline.  
  - *Where they fall short:* Foucault focuses on subjects becoming "known," while your case highlights institutions declaring **unknown domains irrelevant by design** – a reverse panopticism where *lack of visibility* is weaponized.

  **The Core Phenomenon: Metric Ontological Realignment (MOR)**  
  *Definition:* **The process by which quantitative accountability metrics redefine the ontological boundaries of a profession, systematically excluding immeasurable practices from institutional recognition while recasting resultant epistemic blindness as evidence of procedural purity.**

  ---

  ### Boundary Conditions & Distinctions
  1. **vs. Simple Metric Gaming (Goodhart):**  
     - Gaming accepts the *goal* but distorts *means* (e.g., teaching to the test).  
     - **MOR** redefines the *goal itself* (e.g., "test scores *are* education").  
     - *Boundary:* When immeasurable work is deemed "unprofessional" rather than merely unmeasured.

  2. **vs. Bureaucratic Ritualism:**  
     - Ritualism involves empty compliance (e.g., filing reports no one reads).  
     - **MOR** actively reshapes professional identity and valorizes ignorance (e.g., "If mentoring isn't logged, it *shouldn't* affect careers").  
     - *Boundary:* When data absence becomes a *virtue signal* ("Our strict metrics prevent bias from hidden factors").

  3. **vs. Foucault's Panopticism:**  
     - Panopticism induces conformity through *fear of observation*.  
     - **MOR** induces conformity through *fear of invisibility* – if it can't be measured, it *cannot be real work*.  
     - *Boundary:* When institutions claim their metrics capture *all meaningful reality*, rendering shadow labor ontologically null.

  ---

  ### Closest Analogues & Why They Fall Short
  1. **Espeland & Sauder's "Reactivity"** (2007):  
     - *Strength:* Describes how metrics change behavior and meaning.  
     - *Shortfall:* Focuses on strategic adaptations, not the redefinition of professional ontology or institutional blindness as virtuous.

  2. **Marilyn Strathern's "Audit Culture"** (2000):  
     - *Strength:* Examines how auditing replaces trust with verificatory rituals.  
     - *Shortfall:* Emphasizes performativity over the *erasure* of non-auditable practices from professional legitimacy.

  3. **Bowker & Star's "Infrastructure Inversion"** (1999):  
     - *Strength:* Shows how classifications shape reality.  
     - *Shortfall:* Addresses systemic bias in categorization but not the active *celebration of ignorance* derived from those categories.

  4. **Deborah Stone's "Causal Stories"** (1989):  
     - *Strength:* Explains how policy defines problems via measurable causes.  
     - *Shortfall:* Doesn't cover how institutions *internalize* metric gaps as evidence of objectivity.

  ---

  ### Why "Metric Ontological Realignment" Fits
  - **Metric-Driven:** The mechanism is quantification.  
  - **Ontological:** Redefines what "counts" as the profession's core work.  
  - **Realignment:** Implies a coercive restructuring of values, not organic evolution.  

  *Example in Academia:*  
  - Research impact factors become the "real" scholarship; serendipitous exploration is "hobby time."  
  - Mentoring vanishes from tenure files; committees declare: "If it mattered, we'd measure it."  
  - The department's inability to track intellectual mentorship is framed as "avoiding subjective bias."

  This phenomenon thrives where:
  1. Professions have **inherently irreducible tacit knowledge**.  
  2. Institutions face **legitimacy crises** demanding "objective" accountability.  
  3. There is **asymmetric power** favoring administrators/metric designers over practitioners.  

  **MOR** is the institutional equivalent of declaring, "If a tree falls in the forest and our sensors don't hear it, it didn't make a sound – and our sensors are flawless by design." The pathology lies not merely in what is seen, but in the enforced *celebration of blindness*.
