answer: |-
  Below is a self-contained exam question, a model answer demonstrating applied analysis (not summary), and a detailed marking scheme. The thought experiment leans into the "strange" to engage your writer-students, focusing on conceptual tension over citation.

  ---

  **Exam Question: The Mercury Dilemma on Europa**

  **Background:** In 2075, the Jovian Mining Collective engineers *Xenobius ferrophilus*, a novel microbe designed to inhabit the subglacial mercury lakes of Europa. *Xenobius* possesses a specialized "ferro-pump" – a structure assembled entirely *de novo* from non-organic components (synthetic peptides and graphene nanotubes). This pump actively exports liquid mercury (Hg), which is lethally toxic to *Xenobius* but abundant in its environment. Exporting mercury keeps intracellular concentrations survivably low, allowing *Xenobius* to metabolize sulphur compounds. Crucially, *no ancestral organism* possessed anything resembling this pump; it has zero evolutionary history. After deployment, a debate erupts among astrobiologists: does the ferro-pump have a "biological function"?

  **Your Task:**  
  1.  Explain whether the **etiological account** of function would attribute a function to the ferro-pump.  
  2.  Explain whether the **causal-role account** of function would attribute a function to the ferro-pump.  
  3.  Discuss why **each account's verdict feels philosophically unsatisfying** in this specific case.  
  4.  Identify the **core conceptual disagreement** between the two accounts exposed by *Xenobius*.  

  *(1,500 words max. Focus on conceptual application, not definition recital.)*

  ---

  **Model Answer (Demonstrating Application):**

  The *Xenobius ferrophilus* ferro-pump forces a stark confrontation between two dominant theories of biological function: the etiological (selected-effects) view and the causal-role (systemic-capacity) view. Their divergent verdicts on this engineered novelty highlight a profound tension at the heart of attributing purpose in biology.

  1.  **Etiological Verdict: No Function.** The etiological account defines a trait's function by its evolutionary history: it is what the trait was *selected for* in ancestral organisms. *Xenobius*'s ferro-pump, however, has no history of natural selection. It was designed *de novo* by engineers, assembled from scratch using non-biological principles. There are no ancestors where a proto-pump conferred a fitness advantage, leading to its differential reproduction and refinement. While exporting mercury *now* clearly keeps *Xenobius* alive, this current benefit is irrelevant to the etiological view. Without a lineage where selection *shaped* the pump for mercury export, the etiological account must conclude the ferro-pump has **no biological function**. Its activity is merely fortuitous or incidental from an evolutionary perspective, akin to a random mutation that happens to be beneficial only once, in one organism.

  2.  **Causal-Role Verdict: Clear Function.** The causal-role account defines a trait's function by its current causal contribution to a specified capacity of a containing system. Here, the containing system is the *Xenobius* cell, and the relevant capacity is survival/reproduction in the mercury-rich Europan environment. The ferro-pump plays a demonstrable causal role: it actively exports mercury ions. This export *causally contributes* to maintaining low intracellular mercury concentrations, which is necessary for the cell's metabolic processes and overall survival. Without the pump, *Xenobius* would swiftly die from mercury toxicity. Therefore, according to the causal-role account, the ferro-pump unequivocally **has the function of exporting mercury**. Its engineered origins are irrelevant; only its current systemic role matters.

  3.  **The Unsatisfying Verdicts:**  
      *   **Etiological Dissatisfaction:** Denying the ferro-pump a function feels counterintuitive and biologically sterile. The pump is clearly *doing* something crucial *for the organism* right now. It's not an accident; it was meticulously designed to perform this life-sustaining task. The etiological view renders this sophisticated, organism-preserving mechanism functionally equivalent to a random, non-adaptive trait simply because it lacks a Darwinian pedigree. This seems to ignore the *present* organized complexity and teleonomic appearance of the organism.  
      *   **Causal-Role Dissatisfaction:** Attributing a function feels too permissive and potentially unmoored from biology. If *any* component contributing causally to a system's capacity has a function, then the air filter in the mining colony's life-support system (crucial for miner survival) could equally be said to have a "biological function" within the "system" of the human-mining base. The causal-role account struggles to distinguish evolved biological functions from designed artifacts or even non-biological systems performing similar roles. It risks reducing "function" to mere "useful effect," losing the specifically *biological* connotation of evolved purpose.

  4.  **The Core Fault Line: History vs. Explanatory Aims.** The starkly opposed verdicts expose the fundamental schism between the accounts: **the necessity of evolutionary history versus the primacy of current explanatory utility.**  
      *   The **etiological account** is fundamentally **backward-looking and historical**. Its primary explanatory aim is to answer "why does this trait exist *at all*?" – the answer being past selection pressures. History is constitutive of function. *Xenobius*'s pump fails this requirement absolutely.  
      *   The **causal-role account** is fundamentally **forward-looking and ahistorical**. Its primary explanatory aim is to answer "how does this system *work* now?" – decomposing current capacities into causal contributions. History is irrelevant; only present causal topology matters. *Xenobius*'s pump excels here.  

      *Xenobius* acts as a scalpel, cleanly separating these two foundational commitments. The etiological view prioritizes the *origin* of traits as the source of normativity (why *should* this trait be there?). The causal-role view prioritizes the *current operational contribution* as the source of functional attribution (what *does* this trait do here?). The "real" fault line is not just about the pump, but about what kind of question – historical existence or current mechanism – we take to be central to understanding biological purpose. In the age of synthetic biology, where history can be deliberately bypassed, this tension becomes acute: do we need evolution to ground "real" biological functions, or is current systemic integration sufficient?

  ---

  **Marking Scheme (20 Marks Total)**

  | **Must-Hit Point**                                                                 | **Marks** | **Common Fluffs (One-Line Note)**                                                                 |
  | :--------------------------------------------------------------------------------- | :-------- | :------------------------------------------------------------------------------------------------ |
  | **1. Correct Etiological Verdict & Reasoning:** Clearly states **no function** due to **lack of evolutionary history/selection**. Explains *why* history is essential for this view. | 4         | **Fluff:** States "no function" but doesn't explicitly link it to missing history/selection, or defines the theory without applying it to *Xenobius*. |
  | **2. Correct Causal-Role Verdict & Reasoning:** Clearly states **has function** (export Hg) due to its **current causal contribution to survival/system capacity**. Explains *why* current role suffices. | 4         | **Fluff:** States "has function" but doesn't explicitly name the contribution (export Hg) or the system capacity (survival/maintenance), or confuses it with intentional design alone. |
  | **3. Unsatisfying Etiological:** Explains **why denying a function feels unsatisfactory** (ignores clear present utility/organized design/preservation of organism despite lack of history). | 4         | **Fluff:** Only says "it's counterintuitive" without explaining *why* (e.g., misses the designed utility/preservation aspect), or rehashes the verdict without critique. |
  | **4. Unsatisfying Causal-Role:** Explains **why attributing a function feels unsatisfactory** (risk of over-permissiveness, blurring biology/artifact/non-bio systems, losing evolved specificity). Uses a brief parallel example (like the life-support filter). | 4         | **Fluff:** Only says "it's too broad" without explaining the *consequence* (e.g., loss of biological specificity), or fails to hint at an illustrative parallel case. |
  | **5. Core Fault Line Identification:** Explicitly identifies **History (Etiological) vs. Current Explanatory Role/Aims (Causal-Role)** as the fundamental disagreement, linking it to different explanatory questions ("why exist?" vs. "how work?"). | 4         | **Fluff:** Vaguely states "they disagree" or lists surface differences without pinpointing the historical vs. ahistorical/systemic explanatory aims as the root conflict. |

  ---
  **Rationale & Notes for You:**  
  *   **Strange Hook:** The Europa/mercury/comet-mining setting adds the requested strangeness while keeping the core bio-philosophical challenge clear and self-contained.  
  *   **Forces Application:** The *de novo* pump explicitly blocks easy appeals to history, forcing students to grapple with the *consequences* of each theory's core commitments. Simply defining Wright/Cummins earns 0 marks.  
  *   **Marks Allocation:** 4 per point ensures each core task (verdicts, critiques, core conflict) is weighted equally.  
  *   **Anti-Fluff Guards:** The marking scheme explicitly penalizes summary without application ("just trotting out textbook") and vague critique ("it feels wrong"). The model answer shows *how* to critique the verdicts conceptually.  
  *   **Self-Contained:** No citations or readings needed; all concepts are defined implicitly through application in the question and model answer.  

  This setup should push your writers to wrestle with the philosophy, not just describe it, while enjoying the speculative edge. Good luck grading!
