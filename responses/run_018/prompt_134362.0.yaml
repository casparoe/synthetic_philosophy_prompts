answer: |-
  ### Q&A Prep Sheet: Core Objections & Replies  
  **Audience Commitments Summary:**  
  - *Analytic Philosophers:* Seek non-arbitrary criteria for moral responsibility; value Parfit’s psychological connectedness and Schechtman-esque narrative unity.  
  - *Abhidharma Specialist:* Prioritizes Pali textual fidelity; rejects "revisionist" interpretations of *dhamma*s.  
  - *Cognitive Scientist:* Expects empirical consonance with predictive self-models as error-minimizing fictions.  

  ---  
  **Objections Ordered by Damage Potential (High to Low):**  

  1. **Moral Responsibility Objection (Analytic Philosopher)**  
     *"If persons are mere modal constructs without diachronic essence, how can desert attach to 'them'? Punishing a future modal state for a past action seems incoherent—like blaming a hurricane for yesterday’s weather."*  
     **Reply:** Desert attaches to the *causal-functional continuum*, not a self. Karmic consequences (like psychological traits) propagate via dependent arising (*paṭicca-samuppāda*). Moral responsibility is thus a convention for regulating streams with persistent tendencies—like holding a river accountable for erosion patterns.  
     **Weakness:** Doesn’t fully resolve Parfit’s "branch line" edge cases (e.g., fission).  

  2. **Textual Fidelity Challenge (Abhidharma Specialist)**  
     *"You’re smuggling modal logic into the Abhidhamma! The *puggala* is a mere *pannatti* (conventional label) in the commentaries—not a 'construct'. Where does *sabhāva-dhamma* support modal realism?"*  
     **Reply:* *Sabhāva-dhamma* (ultimate realities) are conditionally arisen, not metaphysically rigid. The *puggala*’s conventional designation (*vohāra*) relies on *paccaya*-based continuity (e.g., *Cūḷasaccaka Sutta*), not narrative unity. Modal language clarifies this pragmatic dependence.  
     **Weakness:** Modal terms like "construct" risk anachronism; requires reinterpreting *pannatti* dynamically.  

  3. **Parfitian Reductionist Critique (Analytic Philosopher)**  
     *"Why call this 'pragmatic designation' more defensible than Parfit’s psychological connectedness? Both reduce persons—but his has clearer empirical criteria."*  
     **Reply:** Parfit relies on *contentual* continuity (e.g., memory), which is fragile. *Paticca-samuppāda* prioritizes *causal-formal* continuity (e.g., intention-to-action chains), which is more robust for desert because it tracks *cetanā* (volition) across aggregates.  
     **Weakness:** Underexplains how "causal-formal" continuity avoids Parfit’s conclusion that "what matters" isn’t identity.  

  4. **Narrative Theorist Pushback (Analytic Philosopher)**  
     *"If autobiographical unity isn’t necessary, what prevents your 'modal construct' from being a disjointed chaos? Narratives ground coherence!"*  
     **Reply:** Narratives are *a posteriori* glosses, not ontological ground. The modal construct coheres via *citta-santāna* (mind-stream) causality—e.g., habits (*sankhāra*) linking moments functionally, even without a "story".  
     **Weakness:** Risks making personal identity *too* minimal for ethical projects (e.g., promise-keeping).  

  5. **Predictive-Processing Misalignment (Cognitive Scientist)**  
     *"If the self-model is a predictive fiction, how is your 'modal construct' different? And why isn’t narrative central to its function?"*  
     **Reply:** Predictive models *are* pragmatic fictions—but Abhidhamma’s *sabhāva-dhamma* provides an ultimate ontology: discrete *cittas* (mind-moments). The construct emerges from their causal series, aligning with PP’s error-correction without needing narrative.  
     **Weakness:** Doesn’t address why the brain’s narrative layer is evolutionarily pervasive if irrelevant.  

  6. **Modal Construct Coherence Question (Analytic Philosopher)**  
     *"What constrains the modal boundaries of *puggala*? Without intrinsic essence, isn’t 'designation' arbitrary?"*  
     **Reply:** Boundaries are fixed by *causal efficacy* (e.g., *Dhammasaṅgaṇi*’s *khandha* interdependence). A "person" is designated where a cluster of *dhamma*s sustains goal-directed behavior—like calling a whirlpool a "thing" due to persistent hydrodynamics.  
     **Weakness:** "Goal-directed behavior" may imply teleology absent in early Buddhism.  

  7. **Conventional Reality Inflation (Abhidharma Specialist)**  
     *"Isn’t this *puggala* just *sammuti-sacca* (conventional truth)? Why call it 'robust' if it dissolves under analysis?"*  
     **Reply:** Conventionally robust ≠ metaphysically real. It’s *robust* pragmatically: like Newtonian physics, it reliably guides ethics despite ultimate unreality. The *Mahāvibhāṣā* affirms conventions as indispensable for *vinaya* (discipline).  
     **Weakness:** Blurs the line between *pannatti* (concept) and *paramattha-dhamma* (ultimate reality).  

  ---  
  **The Objection I Hope Nobody Raises:**  
  *"If karma requires continuity without identity, why doesn’t the *karmic debtor* vanish at death? How can *paṭicca-samuppāda* secure desert across rebirth without a substratum?"*  
  **Why Unraised?** Combines Abhidhamma’s trickiest karma-rebirth mechanics with Parfit’s "q-memory" problem. Forces admission that the construct relies on *causal latency* (e.g., *asava*/*bīja*)—which sounds metaphysical.  

  **Reply (If Raised):** Desert targets the causal stream, not a debtor. Rebirth-linking (*patisandhi*) occurs via *cetanā*’s momentum, like lighting one lamp from another—no agent needed. Moral imputation follows the flame, not the lamp.  
  **Weakness:** Invites debate about whether "momentum" smuggles in quasi-essence.  

  ---  
  **Strategic Notes:**  
  - **Leverage Commonalities:** Stress *empirical plausibility* to the cognitive scientist (e.g., PP aligns with momentariness), *textual roots* to the Abhidharma specialist (e.g., *Patthāna*’s conditional relations), and *moral pragmatism* to analysts.  
  - **Avoid:** Digressions into rebirth; cite suttas (e.g., *Anattalakkhaṇa*) only if paraphrased.  
  - **Key Vulnerability:** Overclaiming the "robustness" of convention—emphasize *operational* robustness, not permanence.
