          The board then assigns the credence shifts based on the milestone outcomes. But note: if the milestones are intermediate, the final theoretical impact is still uncertain. However, we are only updating based on the milestones.

     This case fits the procedure. The unknown unknown might be that the milestones are achieved but the final theory is wrong in a way that the milestones don't reveal.

     The Kelly fraction computation will then reflect the expected growth from the milestone evidence. The fraction f_aggregated might be moderate because the milestones are quantifiable and the likelihoods are less ambiguous.

     Case (b): Proposal that promises large information gain but depends on adopting a novel ontology that, if correct, renders the evaluation metrics of other funded projects obsolete.

     Representation:
       - The framework set F must include the novel ontology as a new framework. Let's call it f_{new}.
       - The current prior: the board assigns a small credence to f_{new} and the rest to existing frameworks.
       - The outcome of the project: it might validate or invalidate f_{new}? Or it might provide evidence for/against f_{new} and for the existing frameworks? The proposer must specify.

          But note: if the project is funded and f_{new} is true, then after the project the board will adopt f_{new} and the other projects become obsolete. How does that affect the growth factor? In our representation, the growth factor is defined for the true framework. If f_{new} is true, then the growth factor for f_{new} is the posterior over f_{new} divided by the prior. This could be large.

          However, the obsolescence of other projects is not directly accounted for in the growth factor for this project. We are only measuring the growth in credence for the true framework. If f_{new} is true and the project increases the credence in f_{new}, that's positive. But if f_{new} is false, then the project might decrease the credence in the true framework? 

          The procedure will automatically account for the possibility that the project might increase or decrease the credence in the true framework (whether it's f_{new} or an existing one).

          The issue of making other projects obsolete: that is a portfolio effect. We have not included in the growth factor for this project the effect on other projects. How to handle?

          We might adjust the growth factor to include the opportunity cost of having funded other projects that become obsolete. But note: if the project is successful and f_{new} is true, then the other projects were going to be obsolete anyway. So by funding this project, we are saving money that would have been wasted on those projects? But we haven't yet funded them. We are making a portfolio allocation now.

          We must consider the entire portfolio. Our procedure for portfolio allocation (step F) currently does not account for interactions. Therefore, we might adjust:

            - After funding this project, if it succeeds and f_{new} is true, then we will cancel the other projects? And reallocate the budget? But we are doing quarterly allocations.

          We propose: in the quarterly allocation, we do not account for future redefinitions. We allocate based on the current framework set. After a project changes the framework set, we reallocate the remaining budget accordingly. Therefore, the fact that this project might obsolete others is not directly included in the growth factor for this project. 

          However, if the board believes that funding this project will lead to a large shift in the framework set, they might assign a high unknown unknown probability q to account for the risk that the entire framework shift could be mishandled.

     Case (c): Board holds a near-uniform prior over a large set of incommensurable success conditions.

     Representation:
       - The framework set F is large and the prior is uniform: p_i = 1/N for each of N frameworks.
       - The proposal might have outcomes that update the credences. But because the prior is uniform and the set is large, the multiplicative factors for the true framework might be very volatile.

          Consider: if the project produces an outcome o that is very likely under the true framework i and very unlikely under others, then:

              W_i(o) = L_i(o) / [ sum_k p_k L_k(o) ] = L_i(o) / [ (1/N) ( L_i(o) + sum_{k != i} L_k(o) ) ]

          If L_i(o) is high and L_k(o) are low for k!=i, then W_i(o) is approximately N * L_i(o) / L_i(o) = N, a large factor.

          But if the project is not informative, then W_i(o) might be near 1.

          The danger: if the project is highly leveraged (high f) and the outcome is unfavorable, the growth factor might be small (even less than 1) and we could lose a lot.

          The naive geometric mean might recommend a high f. But if the likelihoods are not well known, the ambiguity might make it dangerous.

     Our procedure:

          - The board will consider a set of alternative likelihoods, representing their uncertainty about the informativeness of the project.
          - They will also include an unknown unknown adjustment.
          - The minimax regret step will then choose a fraction that is robust to the worst-case scenario in the set of likelihoods.

          This should prevent over-leverage.

     Now, step-by-step for each case.

     Due to the complexity and hypothetical nature, we will outline the execution.

     Case (a):
          Step A: 
              F = {f1, f2, f3} (existing frameworks)
              Prior: p = [0.5, 0.3, 0.2]
              Outcomes: O = {milestone1-success, milestone1-fail, milestone2-success, ...} (say 4 outcomes)
              Likelihoods: 
                  f1: [0.8, 0.2, 0.0, 0.0]   (meaning: under f1, milestone1 is very likely to succeed, and milestone2 is irrelevant)
                  f2: [0.1, 0.9, 0.1, 0.9]   ... etc. (proposer provides, board agrees)
              Alternative priors: P = {p} (only one, so no ambiguity in prior)
              Alternative likelihoods: L = {base likelihood} and one alternative where the project is less informative: e.g., f1: [0.6,0.4,0,0], f2: [0.2,0.8,0.2,0.8] ... (board judgment)
              Unknown unknown: q=0.05, r=0.5

          Step B: For each (p,L) in P x L (two scenarios: base and less informative):
              Compute G(f) for each and find f* for each scenario.

          Step C: Compute regret for a grid of f.

          Step D: Find f that minimizes max regret.

          Step E: Suppose we get f_aggregated = 0.3.

          Portfolio allocation: if the efficiency is high, it gets funded.

     Case (b):
          Step A:
              F = {f1, f2, f3, f_new}
              Prior: p = [0.45, 0.25, 0.25, 0.05]   (small for f_new)
              Outcomes: O = {strong support f_new, moderate support f_new, neutral, refute f_new}
              Likelihoods:
                  f1: [0.01, 0.09, 0.5, 0.4]   (if f1 is true, the project is unlikely to support f_new)
                  f2: [0.01, 0.09, 0.5, 0.4]
                  f3: [0.01, 0.09, 0.5, 0.4]
                  f_new: [0.4, 0.5, 0.09, 0.01]   (if f_new is true, likely to support it)
              Alternative priors: P might include one where p_new=0.01 (skeptical) and one where p_new=0.2 (optimistic)
              Alternative likelihoods: L might include one where f_new's likelihood for strong support is 0.2 (less certain) and one where it's 0.6 (more certain)
              Unknown unknown: q=0.1 (higher because of the ontology shift risk), r=0.4

          Step B: We have P of size 2 and L of size 2, so 4 scenarios. For each, compute f*.
          Step C, D: Find f_aggregated. It might be moderate because of the high q and the ambiguity.

          Portfolio allocation: even if the efficiency is high, we note that if funded and if f_new is validated, then the next quarter we will reallocate the entire budget in the new framework set. But that is not in the model.

     Case (c):
          Step A:
              F has 20 frameworks, p_i=0.05 for each.
              Outcomes: O={o1, o2} (say)
              Likelihoods: for each framework i, the proposer provides a likelihood vector. But because there are many, and the board is uncertain, they might provide a base likelihood and then consider perturbations.

              Example: 
                  base: for framework i, L_i(o1) = 0.9 if i is odd, 0.1 if even? and vice versa for o2. But the true framework is unknown.

              But the board is uncertain about these likelihoods. They consider:
                  L_base: as above.
                  L_alt: perturbed so that the project is less informative: for every i, L_i(o1)=0.6, L_i(o2)=0.4? 

              Alternative priors: only the uniform.
              Alternative likelihoods: two scenarios: base and uninformative.
              Unknown unknown: q=0.1, r=0.6.

          Step B: Compute f* for each scenario. In the base scenario, the project is informative and the Kelly fraction might be high (say 0.6). In the uninformative scenario, the Kelly fraction might be 0 (or negative, so we take 0).

          Step C: Regret for a given f in [0,1]:
              For base scenario: regret = G(0.6) - G(f)
              For uninformative: regret = 0 - G(f)  [because f*=0 and G(0)=0]

          Step D: Minimax regret: we choose f to minimize max( G(0.6)-G(f), -G(f) ). Since G(f) is increasing for f in [0,0.6] and then decreasing? Actually, in the uninformative scenario, G(f) is negative for f>0. So for a given f>0, the regret in the uninformative scenario is -G(f) (positive) and in the base scenario it's G(0.6)-G(f). We choose f to balance these.

          Suppose we find f_aggregated=0.2.

     Potential misfires:

          - In case (b), the procedure does not account for the obsolescence of other projects. If the project is funded and succeeds, we may have wasted money on other projects in the same quarter. But our allocation is quarterly, so we will reallocate next quarter. However, the wasted money in the current quarter is not accounted for. This is a limit of the procedure.

          - In case (c), the minimax regret might be too conservative. The board might intuitively feel that the project is worth more than 20%. This could be a failure of intuition or a limit of geometric rationality? It's a feature of ambiguity aversion: when there is a chance that the project is uninformative, we invest less.

     We note that the fractional Bayes approach (scaling the likelihood by f) is a known method, but it assumes that the project can be scaled linearly. If the project is atomic (you either do it or not), then we should use f=0 or 1. However, we are interpreting f as the fraction of the budget allocated. For an atomic project, we might have to use a binary decision. In that case, we would use the expected growth with f=1 and compare to not investing (f=0). We would invest if G(1)>0.

     But our procedure allows for fractional funding, which might not be realistic. We can modify:

          - If the project cannot be scaled, then we set the decision to fund or not. We compute G(1) for the project (with the unknown unknown) and then compare to G(0)=0. We fund if min_{(p,L) in P x L} G(1; p,L) > 0? Or using minimax regret: regret for funding when the optimal is not to fund is G(1) (if negative) and regret for not funding when we should is -G(1) (if positive). We fund if the worst-case regret for funding is less than the worst-case regret for not funding? 

          Given time, we leave the fractional approach.

     Conclusion: The procedure is complex and requires many judgment calls, but it translates geometric rationality into a concrete decision process. It is honest about misfires in non-stationary and interactive settings.
answer: |-
  Below is a decision procedure for epistemic investment based on geometric rationality, addressing your requirements. The procedure is structured as a flowchart-friendly checklist that can be executed per proposal in ~20 minutes, then aggregated portfolio-wide. Key assumptions:
  - **Epistemic returns**: Measured as shifts in credence over explanatory frameworks.
  - **Ambiguity**: Probabilities and frameworks are not point estimates; judgment calls are explicit.
  - **Non-stationarity**: Projects can redefine the evaluation space.
  - **Ambiguity aversion**: Penalizes unquantifiable uncertainty without maximin/diversification fallbacks.

  ---

  ### **Decision Procedure: Geometric Epistemic Allocation (GEA) Framework**
  #### **Step 1: Represent Proposal’s Return Profile**  
  *Goal: Capture belief-state shifts under framework ambiguity.*  
  1. **Define Outcome Space (Judgment Call)**:  
     - Proposer specifies possible outcomes (e.g., experimental results, theoretical insights).  
     - Board maps outcomes to **credence shift vectors** \(\Delta \mathbf{p}\) over existing frameworks. Example:  
       - Outcome \(o_i\): \(\Delta p = (+0.3, -0.2, 0)\) for frameworks \((F_1, F_2, F_3)\).  
     - If the proposal introduces new frameworks (e.g., \(F_4\)), expand the vector and renormalize priors (add \(p_{F_4} = \epsilon\), reduce others proportionally).  

  2. **Assign Likelihoods (Judgment Call)**:  
     - For each outcome \(o_i\), proposer provides likelihoods \(P(o_i | F_k)\) for each framework \(F_k\).  
     - Board adjusts for ambiguity: Specify a **likelihood range** \([L_{\min}(o_i | F_k), L_{\max}(o_i | F_k)]\) instead of point values.  

  3. **Compute Epistemic Returns (Deterministic)**:  
     - Return for outcome \(o_i\) under \(F_k\) is the **log-odds shift**:  
       \[
       r_{i,k} = \log\left(\frac{p_{\text{post}}(F_k)}{p_{\text{prior}}(F_k)}\right) = \log\left(1 + \frac{\Delta p_k}{p_{\text{prior}}(F_k)}\right)
       \]  
     - **Output**: A matrix \(\mathbf{R}\) of returns \(r_{i,k}\) for all outcomes \(o_i\) and frameworks \(F_k\).  

  ---

  #### **Step 2: Compute Kelly Fraction**  
  *Goal: Handle disputed priors and ambiguous probabilities.*  
  1. **Specify Priors (Judgment Call)**:  
     - Board defines a **set of plausible priors** \(\mathcal{P} = \{ \mathbf{p}^{(1)}, \mathbf{p}^{(2)}, \dots \}\) (e.g., uniform, expert-weighted).  

  2. **Generate Ambiguous Likelihoods (Deterministic)**:  
     - For each prior \(\mathbf{p}^{(j)}\), compute expected returns across the likelihood range:  
       \[
       \bar{r}_{i,k}^{(j)} = \frac{1}{2} \left[ \log\left(1 + \frac{\Delta p_k}{p^{(j)}(F_k)}\right) \cdot L_{\min}(o_i | F_k) + \log\left(1 + \frac{\Delta p_k}{p^{(j)}(F_k)}\right) \cdot L_{\max}(o_i | F_k) \right]
       \]  
     - Average over outcomes to get **expected growth rate** for fraction \(f\):  
       \[
       G^{(j)}(f) = \sum_{i,k} P(o_i) \cdot \left[ f \cdot \bar{r}_{i,k}^{(j)} - \log\left(1 + f \cdot (e^{\bar{r}_{i,k}^{(j)}} - 1)\right) \right]
       \]  

  3. **Optimize \(f\) (Deterministic)**:  
     - For each prior \(\mathbf{p}^{(j)}\), find \(f^{(j)} = \arg\max_{f \in [0,1]} G^{(j)}(f)\).  
     - **Aggregate fractions**: Use **ambiguity-weighted median**:  
       \[
       f^* = \text{Median}\left( f^{(1)}, f^{(2)}, \dots \right)
       \]  
       (Avoids overreliance on extreme priors.)  

  ---

  #### **Step 3: Update Portfolio After Framework Shifts**  
  *Goal: Recompute weights when projects alter the evaluation space.*  
  1. **Detect Shifts (Judgment Call)**:  
     - After funding a project, if it introduces new frameworks or changes metrics, flag all active proposals for reevaluation.  

  2. **Reparameterize Returns (Deterministic)**:  
     - For each existing proposal:  
       - Expand return matrix \(\mathbf{R}\) to include new frameworks (add columns).  
       - Set returns for new frameworks to \(r = 0\) (neutral until evidence).  
       - Renormalize priors in \(\mathcal{P}\) to include new frameworks.  

  3. **Rebalance Portfolio (Deterministic)**:  
     - Recompute Kelly fractions \(f^*\) for all proposals using updated \(\mathbf{R}\) and \(\mathcal{P}\).  
     - Allocate remaining budget proportionally to \(f^*\) values.  

  ---

  #### **Step 4: Ambiguity-Aversion Constraint**  
  *Goal: Penalize unknown unknowns without maximin.*  
  1. **Compute Ambiguity Score (Deterministic)**:  
     - For each proposal, calculate:  
       \[
       \alpha = \sqrt{\sum_{i,k} \left( L_{\max}(o_i | F_k) - L_{\min}(o_i | F_k) \right)^2}
       \]  
       (Higher \(\alpha\) = more ambiguity.)  

  2. **Adjust Fraction (Deterministic)**:  
     - Apply penalty: \(f_{\text{final}} = f^* \cdot e^{-\lambda \alpha}\), where \(\lambda = 3\) (empirical scaling factor).  
     - **No bankrupcy**: If \(f_{\text{final}} < 0.05\), set to \(0.05\) (minimal epistemic hedge).  

  ---

  ### **Application to Hypothetical Cases**
  #### **Case (a): Quantifiable Milestones, Uncertain Impact**  
  - **Step 1**: Outcomes = milestone achievements (e.g., \(o_1\): "Milestone 1 reached"). Likelihoods tight (e.g., \(P(o_1 | F_k) \in [0.8, 0.9]\)). Final impact uncertain → \(\Delta p\) for \(F_k\) based on milestone relevance.  
  - **Step 2**: Priors \(\mathcal{P}\) = {status quo priors}. \(f^* = 0.4\). Low ambiguity (\(\alpha = 0.1\)) → \(f_{\text{final}} = 0.4 \cdot e^{-0.3} \approx 0.3\).  
  - **Conflict**: Intuition may favor higher funding for "safer" milestones, but GEA penalizes unresolved final impact ambiguity. **Limit of geometric rationality**: Assumes returns are separable; milestones may generate option value not captured.  

  #### **Case (b): Novel Ontology, Obsoletes Metrics**  
  - **Step 1**: Outcomes include "validates novel ontology \(F_4\)". If funded, all proposals’ \(\mathbf{R}\) matrices gain \(F_4\)-column post-completion.  
  - **Step 2**: Priors \(\mathcal{P}\) include low \(p(F_4)\) (e.g., 0.05) and high \(p(F_4)\) (e.g., 0.3). \(f^* = 0.6\) (high growth if \(F_4\) true).  
  - **Ambiguity**: High \(\alpha = 1.2\) (ontology shift risk) → \(f_{\text{final}} = 0.6 \cdot e^{-3.6} \approx 0.02\).  
  - **Conflict**: Board may want to fund despite risk for "revolutionary potential." **Failure of intuition**: Underestimates how ontology shifts redistribute epistemic value across the portfolio. GEA corrects by penalizing ambiguity.  

  #### **Case (c): Uniform Prior, Incommensurable Outcomes**  
  - **Step 1**: \(N=10\) frameworks, uniform prior. Outcomes weakly discriminate (e.g., \(r_{i,k} \approx 0\) for most \(i,k\)).  
  - **Step 2**: Naive Kelly gives \(f^* \approx 0.9\) (high leverage). Ambiguity \(\alpha = 2.0\) → \(f_{\text{final}} = 0.9 \cdot e^{-6} \approx 0.022\).  
  - **Conflict**: Intuition fears overallocation to "noisy" project. **Strength of GEA**: Ambiguity penalty prevents over-leverage; minimal hedge (\(f_{\text{final}} = 0.05\)) maintains optionality.  

  ---

  ### **Where the Procedure Misfires**  
  1. **Nonlinear Evidence Accumulation**: If project returns depend on sequence-dependent thresholds (e.g., "A must precede B"), GEA treats outcomes as static.  
  2. **Cross-Project Synergies**: Co-funding benefits (e.g., shared tools) are not modeled; aggregation assumes independence.  
  3. **Radical Uncertainty**: When new frameworks invalidate entire \(\mathbf{R}\) matrices (e.g., paradigm shifts), the renormalization in Step 3 may lag.  

  ### **Defense in Board Memo**  
  - **Geometric Rationality Core**: Maximizes long-term epistemic growth rate, analogous to compounded wealth.  
  - **Judgment Calls Explicit**: Priors, likelihood ranges, and outcome mappings are board-validated (not black-boxed).  
  - **Ambiguity ≠ Risk**: \(\alpha\)-penalty targets unquantifiable uncertainty; \(e^{-\lambda\alpha}\) decay avoids arbitrary thresholds.  
  - **Rebalancing**: Step 3 handles non-stationarity via credence shifts, not ad hoc adjustments.  
  - **Misfires Acknowledged**: Procedure is robust for "known unknowns" but cannot preempt unrecognized framework shifts.  

  This provides a concrete, authority-free mechanism for epistemic allocation under geometric rationality.
