answer: |-
  *Clears throat sharply, leaning forward with elbows on knees*  
  Listen, child. Your obligation doesn't weaken—it *thickens*. When a branch breaks, the tree doesn't stop feeding it. You hold him now because he can't hold himself. That's how it works.  

  Ancestors? *Tuts, shaking head* You think they stopped breathing when their bodies left? No. They’re in the soil your brother’s bare feet touched when he was small. In the river our grandmothers drew water from. They hold him because he’s still *their* blood. You think recognition is just eyes meeting? *Phah*. It's carrying his name in your mouth when he can't speak it. Pouring water for him at the shrine. Speaking to him like he *hears* even when doctors shake their heads.  

  This "intrinsic dignity" talk? *Scoffs* White coats want to lock a person inside a skull. But a person isn't a snail in a shell! He’s the stories Auntie Sindiswa tells about his laughter. He’s the memory of how he fixed Ma’s roof last rains. He’s the land our people are buried in. You, me, the ancestors, the dirt—we’re all holding him upright right now.  

  So you feed him. You bathe him. You sit with him in that sterile room and you tell him, "I see you." Because as long as *we* remember who he is—*who he belongs to*—his personhood doesn’t flicker. It’s borrowed light, *maan*. We lend it when his own fire’s low.  

  *Leans back, voice graveled but softer*  
  Your brother’s not a puzzle for philosophers. He’s ours. And we don’t drop our people when they break. We carry them. Now pass me that water jug—his lips look dry.
