  3) Practical framing: Medical staff's "dignity in the skull" language likely feels clinical and isolating. The response should reframe care as active participation in sustaining relational bonds - feeding not just a body but a web of connections.

  The challenge is delivering this with appropriate cultural texture: short declarative sentences, maybe some isiZulu terms woven in naturally ("umuntu" not italicized/exoticized), zero philosophical citations. The tone needs that township uncle sharpness - calling out idea-theft while staying grounded in daily practice.

