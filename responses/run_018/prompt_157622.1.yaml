answer: |-
  Here’s a decision tree taxonomy for repugnant markets, designed to map positions via concrete scenarios. It uses 6 nodes to generate 8 distinct leaves, injects a fresh "harm domain leakage" distinction, and flags logical gaps. Phrasing avoids jargon—answers depend on intuitive reactions to cases.

  ---

  ### **Start: The Permissibility Threshold**  
  *Scenario: A desperately poor but fully informed adult sells their kidney to a stranger for life-changing money, with no third-party harm. Should this be banned?*  
  - **NO** → **Leaf 1: Pure Commodification View**  
    *Awkward commitment: "Selling one’s vote in elections must be permitted if both buyer/seller consent."*  
  - **YES** → Proceed to **Node 2**  

  ### **Node 2: Mechanism of Harm**  
  *Scenario: A politician auctions their vote on a bill to the highest bidder. Is the core problem that this destroys democracy itself, not just risks corruption?*  
  - **YES (Price destroys intrinsic function)** → Proceed to **Node 3**  
  - **NO** → Proceed to **Node 4**  

  ### **Node 3: Corruption-of-Meaning Cases**  
  *Scenario: Selling citizenship for $1M to vetted, qualified applicants. Should this be banned even if it funds public goods?*  
  - **YES** → **Leaf 2: Corruption-of-Meaning Absolutist**  
    *Awkward commitment: "Monetizing sacred rituals (e.g., communion) must be banned even if participants genuinely value it."*  
  - **NO** → **Leaf 3: Symbolic Boundary Pragmatist**  
    *Awkward commitment: "Selling military medals is wrong, but auctioning naming rights to public parks is fine."*  

  ### **Node 4: Harm-Type Fork**  
  *Scenario: Allowing wealthy students to buy admission slots at public universities, displacing merit-based admits. Is the worst effect…*  
  - **A) Replacing fair rules with wealth filters** → Proceed to **Node 5**  
  - **B) Eroding trust in non-market spaces (e.g., making professors suspect colleagues bought their jobs)** → Proceed to **Node 6**  

  ### **Node 5: Selection-Rule Remedies**  
  *Scenario: Paid priority access to life-saving organs (like kidneys) via regulated brokers.*  
  - **BAN ALL PAID ACCESS** → **Leaf 4: Selection-Effect Institutionalist**  
    *Awkward commitment: "Blood donation must remain unpaid even if it causes shortages, to avoid wealth-based triage."*  
  - **ALLOW WITH PRICE CAPS/NON-PROFIT** → **Leaf 5: Regulated-Market Pragmatist**  
    *Awkward commitment: "Letting disaster survivors pay capped prices for scarce shelter is better than first-come-first-served."*  

  ### **Node 6: Solidarity-Spillover Remedies**  
  *Scenario: Surge-pricing bottled water during a hurricane.*  
  - **BAN PRICE INCREASES** → **Leaf 6: Solidarity-Spillover Conservative**  
    *Awkward commitment: "Capping insulin prices matters more than incentivizing new producers, to prevent erosion of healthcare as a right."*  
  - **ALLOW WITH DISCLOSURE/CONSUMER ALERTS** → **Leaf 7: Disclosure-First Instrumentalist**  
    *Awkward commitment: "Companies should be allowed to sell 'premium' voting advice if buyers know it’s biased."*  

  ### **Leaf 8: Unoccupied Position**  
  *Combination: "YES to Node 2 (corruption-of-meaning) but NO to Node 3 (allow citizenship sales)" → Symbolic Boundary Pragmatist (Leaf 3) covers this.*  

  ---

  ### **Key Observations & Gaps**  
  1. **Fresh Distinction:** The tree separates **internal corruption** (Node 3: market destroys the good’s core purpose) from **domain leakage** (Node 4B: market erodes non-market norms). This splits votes/kidneys (internal) from disaster pricing (leakage).  
  2. **Underpopulated Quadrant:** *"Allow corruption-of-meaning markets with regulation"* (e.g., capped vote-selling) is rare—likely because if price *destroys* the good, regulation can’t restore it. Logically coherent but politically toxic.  
  3. **Forced Separation:** Disaster pricing (Node 6) isolates **solidarity-spillover** from **corruption-of-meaning**. Conservatives oppose it for norm erosion; corruption views don’t care (water’s function isn’t corrupted).  
  4. **Ambiguity Flag:** "Wealth-filter vs. norm erosion" (Node 4) can blur in cases like paid university slots. *Tree forces a priority:* if you oppose it primarily for unfairness → Node 5; if for distrust spillover → Node 6.  

  ---

  ### **Why This Works for Your Group**  
  - **Rationalist-Friendly:** Concrete scenarios bypass label wars; leaves are defined by *applied* principles.  
  - **LLM-Compatible:** No citations needed—branches turn abstract debates into binary choices.  
  - **Reveals Blind Spots:** Forces confrontation with trade-offs (e.g., Leaf 5’s disaster pricing tolerance vs. Leaf 6’s solidarity focus).  
  - **6 Nodes → 8 Leaves:** Efficiently covers major fissures without sprawl.  

  Would you like a visual flowchart version or stress-testing against a specific market (e.g., surrogate pregnancy)?
