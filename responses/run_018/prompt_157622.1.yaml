  Next, remedies: ban, regulated market, or disclosure-only. Not every position will use all remedies. For example, corruption-of-meaning might only support bans, while others might accept regulation. The user wants each leaf to have a specific remedy, so I'll assign remedies based on the position.

  Naming the views: Pure Commodification, Corruption-of-Meaning, Selection-Effect Institutionalist, Solidarity-Spillover, Regulated-Market Pragmatist. Need 6-8 leaves, so maybe add a Disclosure-First position and a hybrid or less common one. Also, the user wants to note unoccupied or incoherent combinations. For instance, supporting bans for corruption but not for selection effects might be rare but possible.

  Handling overlaps: corruption and spillover both oppose vote-selling. To separate them, use disaster pricing. Price-gouging water after a hurricane might not corrupt the meaning of water but could erode social solidarity, so spillover view would oppose it, while corruption view might not care. This distinction should clarify.

