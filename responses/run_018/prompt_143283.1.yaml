  Hmm, the user seems well-informed but frustrated with how Nuremberg is canonized while Tokyo's critiques are ignored. They want a practical agenda, not just a survey. Their real need is probably to identify high-leverage interventions that could reshape the discourse around international criminal law (ICL), avoiding dead ends. 

  First, I need to unpack their core questions: 
  - Is retroactive criminalization the main philosophical hurdle? 
  - Or is selective enforcement the bigger structural problem? 
  - Could reviving Tokyo dissents meaningfully shift debates? 

  The user also wants clear criteria—tractability, leverage, dependency on other debates—and explicit trade-offs. They’re allergic to false consensus, so I’ll flag contested points (e.g., whether Nuremberg’s retroactivity was truly necessary). 

  *Brainstorming levers:* 
  - **Retroactivity debates** feel somewhat settled in practice (ICL now has codified crimes), but the *philosophical tension* lingers. Fixing this won’t fix selective enforcement. Medium priority. 
  - **Selective enforcement** is the elephant in the room—it undermines ICL’s legitimacy daily. High leverage because it affects everything from ICC credibility to universal jurisdiction cases. Tractability? Tough, but maybe actionable via procedural reforms. 
  - **Tokyo’s legacy**, especially Pal, isn’t just historical. His critique of "aggressive war" as victor’s law could reframe current debates about power imbalances. But is this a foothold or a rabbit hole? Probably high value if linked to modern power critiques. 

  *Trade-offs:* 
