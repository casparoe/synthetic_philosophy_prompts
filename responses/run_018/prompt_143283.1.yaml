  User’s vibe: Urgent, strategic, wants to avoid wheel-spinning. Probably aware their project could get bogged down in theory. I’ll pitch a two-track agenda: mainstream procedural reforms (accountability metrics) *plus* foundational critiques (Pal’s revival) to build coalitions. 

  Final thought: Their typo ("preceedent") suggests they’re typing fast—maybe mid-draft rage about ICL’s hypocrisy. I’ll keep it conversational but sharp.
answer: |-
  Alright, let's cut through the noise. You're right about the core tensions: Nuremberg's lionization vs. Tokyo's messy legacy, retroactivity, victor's justice, and the glaring selectivity. If you've got 3 years and some sway, here’s the defended agenda, ruthlessly prioritized based on **leverage**, **tractability**, and potential to **shift downstream debates/practice**:

  **The Core Problem NOW: Selective Enforcement (Not Primarily Retroactivity)**

  *   **Why it's upstream:** The "one-sided nature" is settled history. **The critical *ongoing* problem is that ICL's *application* remains structurally selective.** This isn't just a historical complaint; it's the primary source of ICL's legitimacy crisis *today*. It fuels critiques of the ICC ("African Court"), undermines universal jurisdiction efforts (why prosecute *this* war criminal but not *that* one?), and makes "rule of law" rhetoric ring hollow for much of the world. **Fixing this (or mitigating it significantly) is fundamental to anything else ICL tries to achieve.** Nuremberg *is* constantly cited, but its selective application legacy is the poison pill.
  *   **Leverage:** Addressing selectivity directly impacts:
      *   Perceived legitimacy of the ICC and other tribunals.
      *   Willingness of states to cooperate with investigations/arrests.
      *   Political viability of universal jurisdiction cases in domestic courts.
      *   The entire "end of impunity" narrative.
  *   **Tractability (Medium-Hard):** You won't "solve" geopolitics in 3 years. But you *can* shift the *framing* and build tools for *accountability for selectivity itself*.
  *   **What to Deprioritize:** Endlessly re-litigating the *historical fact* of Nuremberg/Tokyo's selectivity. Everyone serious acknowledges it. The fight is about *what it means for the present system*.

  **Agenda Item 1: Operationalizing "Equitable Application" Procedures & Metrics (High Leverage, Medium Tractability)**

  *   **Goal:** Move beyond *lamenting* selectivity to *measuring* it and creating institutional pressure/methods to reduce it.
  *   **Concrete Work:**
      *   **Develop Rigorous "Situational Gravity" Metrics:** Not just body counts, but *feasibility of investigation/prosecution* (state cooperation, security, evidence access), *representativeness* (does this situation reflect a pattern needing deterrence?), *victim priorities*. Make selectivity arguments data-driven, not just rhetorical. Challenge the ICC OTP's opaque "interests of justice" calculus.
      *   **Advocate for Transparent Decision-Making Frameworks:** Push the ICC/other bodies to publicly adopt and apply clear, multi-factor situational selection criteria *before* opening investigations (not justifying after the fact).
      *   **Build Mechanisms for "Positive Complementarity" Incentives:** How can the system *reward* states that genuinely investigate/prosecute their own powerful actors? Shift focus from the ICC *doing it all* to catalyzing *fair* domestic action.
      *   **Link to Universal Jurisdiction (UJ):** Develop best practices/ethical guidelines for UJ prosecutors to explicitly consider global situational representativeness and avoid exacerbating selectivity when choosing cases (e.g., don't *only* prosecute low-level actors from pariah states).
  *   **Trade-off:** Accepts that *perfect* non-selectivity is impossible. Focuses on *procedural fairness*, *transparency*, and *mitigation* as achievable legitimacy gains. Might annoy hardliners who think any selectivity is irredeemable *or* realists who think any constraint is naive.
  *   **Why over Retroactivity?** Retroactivity was a unique post-WWII problem. Core ICL crimes (genocide, CAH, war crimes, aggression) are now codified (Rome Statute, treaties, CIL). Debating Nuremberg's *ex post facto* aspect is largely historical/philosophical – crucial for understanding origins, but less directly impactful on *current* prosecutions under existing law. The *selectivity in applying that existing law* is the live wire.

  **Agenda Item 2: Recovering Tokyo (Specifically Pal) Strategically - Framing the Foundational Critique (High Leverage for Discourse, Lower Tractability for Direct Change)**

  *   **Goal:** Resurrect Pal (and other Tokyo critiques) **not** to re-fight WWII, but as the *archetype* for critiquing *power* in ICL. Use it to expose the *ongoing* problem of law serving dominant interests.
  *   **Concrete Work:**
      *   **Reframe Pal as the "Original Structural Critic":** Don't just present him as the dissenter on Japanese acquittal. Position his core argument – that "aggressive war" was defined by victors to criminalize the vanquished, and that the entire process was an exercise of power, not neutral justice – as the foundational critique of *how political power shapes ICL's creation and application*. Link it explicitly to modern selectivity.
      *   **Use Pal to Deconstruct "Canonical" Nuremberg:** Actively contrast Nuremberg's "triumph of law" narrative with Tokyo's/Pal's "triumph of power" narrative. Show how Nuremberg's canonization *required* sidelining Tokyo's messier truths. This undermines Nuremberg's *uncritical* use as precedent.
      *   **Target Foundational Scholarship & Teaching:** Publish rigorously argued pieces placing Pal's dissent centrally in the *philosophical and critical* history of ICL, not just as a historical footnote. Push for his inclusion in core ICL textbooks/courses *as essential critique*, not trivia.
      *   **Build Bridges with TWAIL (Third World Approaches to Int'l Law):** Pal is a natural bridge. Partner with TWAIL scholars to integrate his critique into broader analyses of imperialism, Eurocentrism, and power asymmetry in international law. This amplifies reach beyond ICL specialists.
  *   **Leverage:** Shifts the *intellectual foundation*. If successful, makes it harder to invoke Nuremberg uncritically. Empowers critiques from the Global South. Provides deep historical roots for contemporary critiques of selectivity and power imbalance.
  *   **Tractability (Lower):** Changing deeply ingrained narratives takes time. Resistance from ICL establishment invested in Nuremberg's legacy. Risk of being dismissed as "revisionist" or stuck in the past. **This is a long-term discursive play.**
  *   **Trade-off:** Less about immediate procedural reform (Item 1), more about winning the battle of ideas. Requires careful scholarship to avoid historical oversimplification. Might not yield tangible "wins" in 3 years, but essential groundwork.

  **What's Settled (Acknowledge, Don't Waste Breath Debating):**

  1.  **Nuremberg & Tokyo were one-sided:** Only Axis leaders/jurists tried. No serious scholar disputes this historical fact. The debate is about its *significance then and now*.
  2.  **Laws were applied retroactively at Nuremberg/Tokyo:** The *ex post facto* nature of "crimes against peace" (aggression) and arguably aspects of CAH is established history. The debate is whether it was *necessary/justified then* and what it *means for legal philosophy now*.
  3.  **Pal dissented (radically) in Tokyo:** He argued for acquittal on *all* charges for all defendants. This happened. The debate is about the *validity and contemporary relevance* of his reasoning.

  **What's Still Fought Over:**

  1.  **The *Extent* of Nuremberg's Necessity/Justification:** Was retroactivity truly the *only* way? Was the trial *primarily* about justice or political theater? (Settled: It happened, was selective. Fought: How "good" or "necessary" was it *really*?).
  2.  **Pal's Legacy:** Was he a courageous moralist, an apologist for Japanese imperialism, a brilliant legal realist, or a flawed idealist? His interpretation is highly contested.
  3.  **The "Success" of Nuremberg as Precedent:** Did it genuinely establish individual responsibility under *neutral* law, or did it merely establish that victors *can* prosecute the vanquished under *their* law? This is the core battleground your work should engage.
  4.  **Can Selectivity Be Overcome?** Is it an inherent, fatal flaw of ICL in an anarchic international system, or a manageable problem requiring better institutions/procedures (your Item 1)?

  **What to Flat-Out Deprioritize (Low Downstream Impact):**

  1.  **Finding the Perfect Philosophical Justification for Nuremberg's Retroactivity:** It's been debated for 75+ years. No new argument will convince the skeptics or change the historical fact. The core crimes *are now codified*. Focus on the *application* of the *current* law.
  2.  **Detailed Re-litigation of WWII Facts in Tokyo Cases:** Unless uncovering *new, explosive evidence* of tribunal malfeasance (unlikely), getting bogged down in granular debates about specific Japanese war crimes adjudicated at Tokyo distracts from the *structural* critiques about power and selectivity that have lasting relevance. Focus on the *process and framing*, not re-fighting the evidentiary battles of 1946.
  3.  **"Fixing" the Historical Tokyo Tribunal Itself:** It's over. No legal mechanism exists to "correct" it. Efforts here are purely symbolic historical housekeeping with minimal impact on *contemporary* ICL practice or discourse. Focus on how its *lessons* inform the *present*.

  **The 3-Year Game Plan (Casual Summary):**

  *   **Year 1:** Deep dive into Pal & Tokyo dissent scholarship. Build coalitions with TWAIL/post-colonial scholars. Start drafting the "Pal as Foundational Critic" pieces and "Metrics for Situational Selection" framework. Get these ideas circulating in workshops/seminars.
  *   **Year 2:** Publish the core framing papers (Pal's relevance, Selectivity Metrics). Actively engage ICC/OTP, NGOs, and progressive states on the procedural fairness/transparency agenda. Push for inclusion of critical history (including Pal) in teaching materials. Test the "situational gravity" metrics on past/current ICC situations publicly.
  *   **Year 3:** Refine and advocate hard for the procedural reforms based on your frameworks. Amplify the Pal/Nuremberg contrast in high-impact forums. Assess traction on shifting discourse. Solidify alliances for the long haul beyond the 3 years.

  **Bottom Line:** Stop banging your head against the retroactivity wall. The victor's justice *of the past* is done; the victor's justice *of the present* (selectivity) is the live grenade in the room. Focus your effort on making selectivity **visible, measurable, and procedurally constrained** (Item 1). Simultaneously, use Tokyo/Pal **strategically** to blow up the uncritical Nuremberg mythology and anchor critiques of power in ICL's DNA (Item 2). That's where the leverage is. The rest is mostly noise or historical tidying up. Good luck – you'll need it against the institutional inertia.
