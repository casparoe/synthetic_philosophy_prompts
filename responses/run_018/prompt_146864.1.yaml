prompt: |-
  I am preparing a graduate seminar that pairs Tolstoy's aesthetic theory with recent models in cultural evolutionary dynamics, and I want you to execute a rigorous conceptual translation. Take Tolstoy's central claims about art — that it is fundamentally the transmission of feeling from artist to audience, that its value is determined by infectiousness and by whether it advances universal human brotherhood rather than by technical virtuosity or sensory pleasure, and that professionalized, elite art often fails precisely because it transmits feelings that are narrow or divisive — and restate them entirely within the vocabulary of evolutionary signaling theory and cultural transmission: honest versus manipulative signals, prestige-biased versus content-biased learning, costly signaling of cooperative intent, group-level selection for shared norms, and epidemiological dynamics of idea spread. Be as faithful as you can: treat infection not as dead metaphor but as an actual transmission mechanism, and map his moral criterion onto conditions that stabilize cooperative signals across social groups. Then provide the residue report. Which elements survive intact? Which — especially his hostility toward aesthetic professionalism, his Christian universalism, and his normative judgment that certain feelings are intrinsically unworthy of artistic transmission — must be distorted to fit evolutionary language? Is there a residue that evolutionary vocabulary cannot express at all, and does that gap reveal a limitation in signaling theory's capacity to encode moral evaluation, or does it show that Tolstoy's ostensibly scientific account was always carrying unstated theological commitments? Begin with a one-sentence bottom line summarizing whether the translation succeeds or collapses, and keep your response to no more than 600 words.
reasoning: |-
  Okay, let me approach this systematically. The user wants a rigorous conceptual translation of Tolstoy's aesthetic theory into evolutionary signaling frameworks, followed by a residue analysis. 

  First, I need to extract Tolstoy's core claims: (1) art as emotional transmission mechanism, (2) value determined by infectiousness and promotion of universal brotherhood, (3) rejection of professionalized art for transmitting narrow/divisive feelings. 

  For the evolutionary mapping:
  - "Infection" becomes literal epidemiological transmission dynamics (contagion rate R0, susceptibility)
  - "Universal brotherhood" maps to costly signaling of cooperative intent (handicap principle) and group-level selection for prosocial norms
  - "Elite art failure" translates to manipulative signals in prestige-biased transmission creating subgroup fragmentation

  The tricky residues emerge when analyzing:
  - Tolstoy's hostility to professionalism - evolutionary models actually predict prestige hierarchies as efficient transmitters
  - Christian universalism - evolutionary group selection requires bounded groups, not limitless brotherhood
  - Normative judgments about "unworthy feelings" - signaling theory is amoral about what spreads

  I realize the key insight in the residue report will be that Tolstoy's moral framework smuggles in theological premises about universal human essence - something no evolutionary model can capture without committing the naturalistic fallacy. The translation succeeds technically but exposes his unscientific foundations.

  For the response structure: 
  One-sentence verdict upfront, then partitioned translation (signaling theory | group selection | epidemiological framing), followed by residue categories with clear labeling of distortions and irreconcilable elements. Must stay under 600 words while maintaining conceptual density.
answer: |-
  **Bottom line:** The translation largely succeeds in mechanistic terms but distorts Tolstoy's moral universalism and exposes irreducible theological residues in his framework.

  **Evolutionary Restatement:**
  1.  **Art as Signal Transmission:** Art functions as a culturally transmitted signal package designed to induce specific emotional states (receivers' feelings) in an audience. Its fitness (infectiousness) depends on signal salience, receiver susceptibility (content-bias towards resonant feelings), and transmitter prestige (prestige-bias).
  2.  **Honest Signaling of Prosociality:** High-value art acts as an *honest signal* of cooperative intent and shared group identity. The "universal brotherhood" feeling represents a norm enforcing widespread cooperation. This signal is costly: authentic emotional transmission requires investment (sincerity/effort as a Zahavian handicap), distinguishing it from *manipulative signals* (elite art promoting divisive in-group status or sensory pleasure without cooperative intent).
  3.  **Epidemiology & Group Selection:** Art's "infection" success is modeled via R0 (basic reproduction number): high transmission probability, high contact rate (accessibility), and long infectious period (memorability/motivation to share). Group-level cultural selection favors signals reinforcing cohesion and cooperative norms (universal brotherhood) because groups sharing these high-R0 signals outcompete groups fragmented by low-R0, divisive signals (elite art feelings).
  4.  **Elite Art Failure:** Professionalized/elite art often fails evolutionarily because:
      *   It relies excessively on *prestige-bias*, transmitting narrow status signals ("difficulty" as a costly signal of in-group membership) rather than broadly resonant *content*.
      *   Its transmitted feelings (exclusivity, refined pleasure) function as *manipulative signals* or selfish cultural parasites, promoting subgroup identification or individual gratification, undermining group-wide cooperative norms and reducing R0 outside the elite niche.

  **Residue Report:**

  1.  **Intact in Translation:**
      *   Core mechanism: Art as emotional contagion = High-R0 cultural transmission.
      *   Infectiousness as key metric = R0 / Adoption Rate.
      *   Elite art's divisiveness = Low inter-group R0 due to subgroup signaling.
      *   Sincerity facilitating transmission = Honest signaling via cost (effort/sacrifice).

  2.  **Distorted to Fit:**
      *   **Hostility to Professionalism:** Evolutionary models *explain* prestige-bias as an efficient (though potentially distorting) transmission pathway. Tolstoy's blanket condemnation becomes an empirical claim about *specific* elite signals reducing overall group fitness, not an inherent flaw of professionalization, which signaling theory sees as a natural outcome of prestige dynamics.
      *   **Christian Universalism:** "Universal human brotherhood" becomes "group-level selected cooperative norm." Evolution operates on *defined groups* (kin, cultural, etc.), not an undifferentiated humanity. Signaling "brotherhood" beyond group boundaries is evolutionarily unstable without mechanisms for inter-group cooperation, which Tolstoy assumes axiomatically.
      *   **Normative Judgment of Feelings:** Signaling theory is amoral. Tolstoy's "unworthy" feelings (e.g., exclusivity, sensual pleasure) are translated as "low-R0 signals" or "signals undermining group cohesion." His *intrinsic moral unworthiness* is replaced by *functional ineffectiveness* or *group-level maladaptiveness* within the model.

  3.  **Irreducible Residue & Gap:**
      *   **Theological Foundation of Morality:** Tolstoy's absolute moral criterion ("advancing universal brotherhood") relies on a transcendent, Christian definition of the "good." Signaling theory offers no equivalent; "cooperative intent" is defined *by the group's norms* or *relative fitness outcomes*. What is "good" is contingent. The gap reveals Tolstoy's "scientific" account is scaffolded by unstated theological commitments about universal human essence and divinely ordained purpose. Signaling theory cannot encode *this type* of absolute, transcendent moral evaluation; it can only describe the evolutionary stability or spread of norms, not their inherent "goodness" in Tolstoy's sense.
