prompt: |-
  I'm a philosophy of religion PhD student and I keep wobbling on how much divine hiddenness should actually move anyone. My own credence that the hiddenness argument succeeds against a personal, perfectly loving God is maybe 0.45, but I don't trust it. Give me your actual number, but mostly give me the decomposition. I'd want at least: (1) the probability that a perfectly loving God would ensure every nonresistant person—someone sincerely unconvinced, not resistent—has some awareness of God; (2) the probability that there really are such nonresistant nonbelievers; (3) the probability that explicit belief is required for the kind of relationship a loving God would want, rather than some non-believing trust or openness; and (4) the probability that hiddenness is more to be expected on naturalism than on theism even if the strict premises fail. Assign rough probabilities, show how they combine, and tell me which term your final number is most sensitive to and what evidence or argument would shift it most.
