answer: |-
  Your quest for a principled distinction between legitimate system-jumping and illegitimate evasion is sharp and well-illustrated. Below is a precise principle derived from your cases, followed by analysis of your constitutional example, and an honest assessment of which verdict conflicts.

  ---

  ### **Principle of Legitimate System-Jumping (LSSJ Principle)**
  A system-jump is legitimate **if and only if** it:
  1.  **Operates at a meta-level** that explicitly addresses the *structure*, *limitations*, or *invariants* of the original system (motivated by Cases 1, 2, 4).
  2.  **Provides explanatory power** by resolving a genuine paradox, inconsistency, or undecidability *within* the original system, not merely dismissing it (motivated by Cases 1, 2, 4, 5).
  3.  **Is bridgeable or accountable** to a coherent framework (formal or conceptual) that can be scrutinized independently, ensuring the jump isn't an arbitrary terminus (motivated by Cases 2, 4; contrast with 3, 5).

  ---

  ### **Application to Your Cases**
  | Case | Verdict | LSSJ Analysis |
  |------|---------|--------------|
  | **1** (MU-parity) | Legitimate | ✅ **Meta-level** (system invariants), ✅ **Explanatory** (resolves undecidability), ✅ **Bridgeable** (to number theory). |
  | **2** (Stronger axioms) | Legitimate | ✅ **Meta-level** (system limitations), ✅ **Explanatory** (resolves undecidability), ✅ **Bridgeable** (to the stronger system). |
  | **3** (Moral refusal) | Not legitimate | ❌ **Not meta-level** (rejects framework without structural critique), ❌ **No explanatory power** (terminates discourse), ❌ **Not bridgeable** (no framework offered). |
  | **4** (Truth hierarchy) | Legitimate | ✅ **Meta-level** (system structure), ✅ **Explanatory** (resolves paradox), ✅ **Bridgeable** (to hierarchical metalanguage). |
  | **5** (Instrumental failure) | Illegitimate | ⚠️ **Pseudo-meta-level** (invokes external cause), ❌ **No explanatory power** (ad hoc/untestable), ❌ **Not bridgeable** (lacks independent verification). |
  | **6** (Chess rules) | Not legitimate | ❌ **Not meta-level** (ignores rules, no structural analysis), ❌ **No explanatory power** (denies inconsistency), ❌ **Not bridgeable** (arbitrary rejection). |

  ---

  ### **Tension Between Case 3 and Case 5: Resolved**
  - **Case 3 (Moral refusal)** fails all three LSSJ criteria. It offers no *structural critique* of expected utility ("I don't care" isn’t meta-reasoning), provides no *resolution* to the tension (it rejects the problem), and anchors to no *accountable framework*.
  - **Case 5 (Instrumental failure)** may *seem* meta (invoking "unobserved causes"), but fails **explanatory power** (it explains *away* data without resolving anomalies) and **bridgeability** (lacking calibration, it’s unfalsifiable). It’s an evasion disguised as a jump.  
  **Key distinction**: Case 3 is a *bare refusal*; Case 5 is a *pseudo-explanation*. Neither qualifies under LSSJ.

  ---

  ### **Unlisted Case: Constitutional Amendment**
  **Scenario**: A scholar rejects a constitutional amendment as invalid for violating the "uncodified structural spirit" of the original framework.  
  **LSSJ Verdict**: **Conditionally legitimate** if:  
  - (1) The "structural spirit" is derived from meta-principles (e.g., separation of powers, federalism) *demonstrably* underlying the original document (e.g., via Federalist Papers, drafting debates).  
  - (2) It explains a *genuine conflict* (e.g., amendment creates an existential inconsistency like self-entrenchment).  
  - (3) It bridges to a *coherent jurisprudence* (e.g., "basic structure doctrine" in Indian constitutional law).  
  **If not**, it collapses into Case 3 ("I feel it’s wrong") and is illegitimate.

  ---

  ### **Which Verdict Does LSSJ *Not* Save?**
  **Case 6 (Chess rules)** is correctly deemed "not legitimate" under LSSJ. However, your framing ("just an error") undersells its failure: it’s not merely an error *within* chess rules, but an *invalid system-jump* because it violates all three criteria. LSSJ strengthens your verdict by showing why it’s a *category error in attempting to jump*.

  ---

  ### **Conclusion**
  The LSSJ Principle resolves your tension: **Legitimacy requires meta-structural reasoning that explains systemic issues and anchors to an accountable framework**. Case 3 (moral refusal) and Case 5 (instrumental evasion) both fail—the former offers no meta-structure, the latter offers no explanatory bridge. Your intuition was sound; LSSJ crystallizes it.  

  **Final note**: Legitimate jumps *expand* understanding (Cases 1,2,4); illegitimate ones *contract* it (3,5,6). The constitutional scholar must meet that burden.
