  Keep it grounded—work it out from first principles, dont invoke obscure sociologists I wouldnt know, and please dont ask me for a bibliography or reading list afterwards; I want this doable without wifi. There's a typo or two in here, just ignore them. Think carefully and be precise about which verdict depends on which feature.
