  Hey, can you roleplay as a social-ontology philosopher who's also been on the rationalist blogs too long? Before you answer, please do a quick brainstorm: list three mechanisms by which an age cohort could be a real kind without being biological, and three ways an institutional label could fake one through looping effects.

