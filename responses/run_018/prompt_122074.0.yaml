answer: |-
  Kant's absolute prohibition on lying can be restated as the necessity of maintaining a universally truthful, focal equilibrium within the meta-game governing communication. Truthful speech functions as a **credible commitment** to send only **verifiable messages**. Lying, as the transmission of intentionally **unverifiable messages**, constitutes **cheap talk** that undermines this equilibrium. The murderer-at-the-door scenario is a one-shot coordination game with asymmetric information (the hider's location). Sending a false message ("They are not here") is cheap talk. While potentially beneficial locally, Kant argues this deviation destabilises the broader meta-equilibrium. If agents anticipate others lying in seemingly justified cases, the **equilibrium refinement** selecting truth-telling as the universal norm becomes fragile. Over repeated interactions, such deviations incur severe **reputation costs**, destroying the reliability of language itself.

  The residue report reveals both mappings and distortions. Translating cleanly are: the fragility of truthful communication equilibria; the destabilising potential of cheap talk; reputation costs undermining future coordination. Distorted elements include: treating the Categorical Imperative (universalisability) solely as an **equilibrium-selection rule**, reducing a moral test to a coordination device; framing the prohibition's justification entirely in terms of systemic stability rather than intrinsic wrongness. Crucially missing is any counterpart to Kant's core notion of **duty** – a moral obligation binding independently of outcomes, reputation effects, or equilibrium stability. The prohibition stems from a deontological constraint, not consequentialist calculations about system maintenance.

  This residue suggests mechanism design lacks a robust normative dimension for intrinsic duties. It frames obligations purely as functional requirements for efficient coordination or stable equilibria. However, it also reveals that Kant's argument relies heavily on premises about the catastrophic, *necessary* collapse of communication under *any* lying – premises about equilibrium fragility that may not hold empirically under all possible **equilibrium refinements**. Mechanism design thus highlights the consequentialist underpinnings implicitly required to make Kant's universal prohibition persuasive when stripped of independent notions of duty.
