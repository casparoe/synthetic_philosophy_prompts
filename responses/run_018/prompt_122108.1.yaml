  In the cases:

  - For (a): Step 4 (burden) required a judgment about the severity of losing anonymity.
  - For (b): Step 2 (immediate harm) required a judgment about the harm of deletion.
  - For (c): Step 6 required modeling the community's idealized tradeoff.

  Finally, we write up the procedure and the case applications.

  But note: the procedure must be run in 20 minutes, so we must keep it light. We'll write the procedure as:

  **Decision Procedure for Feature Requests**

  1. **Core Value Violation:** Does the proposal violate a clearly documented core value? (Reject if yes)
  2. **Immediate Harm:** Would the proposal cause clear, objective, and immediate harm to the commons? (Reject if yes)
  3. **Critical Problem Alignment:** Is the proposal addressing a critical problem for the commons? 
     - If critical: Proceed.
     - If non-critical but aligned with a core value: Defer to values.
     - If non-critical and not aligned: Reject.
  4. **Burden Assessment:** Does the proposal create a disproportionate burden on any group the community would protect? 
     - If severe and unavoidable: Reject.
     - If moderate and mitigable: Defer to values (for discussion on mitigation).
     - If negligible: Proceed.
  5. **Alternative Solution:** Is there a clear, less divisive alternative that achieves the same goal? (Reject if yes, and note the alternative)
  6. **Idealized Tradeoff:** Would the community, in an idealized state, accept the tradeoffs as necessary for the greater good? 
     - If yes: Approve.
     - If no: Reject.
     - If uncertain: Defer to values.

