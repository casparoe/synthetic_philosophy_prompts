answer: |-
  ### Decision Procedure: Coherent Extrapolated Volition (CEV) Framework for Community Proposals  
  *Designed for efficiency (~20 minutes/proposal) with clear stop conditions. Flagged steps highlight where moderator bias may creep in.*  

  #### Core Principles  
  - **CEV Definition**: Model what the community *would* want if they:  
    (a) Understood all technical tradeoffs,  
    (b) Were free of framing effects/status quo bias,  
    (c) Deliberated collectively toward shared goals.  
  - **Stop Conditions**:  
    - **Reject**: Fails CEV or harms commons.  
    - **Defer to Values**: CEV indeterminate; needs community debate.  
    - **Approve**: Aligns with CEV after rigorous checks.  
  - **Bias Flags**: Steps where moderator subjectivity risks contamination.  

  ---  
  ### Decision Procedure: Ordered Questions  
  **Time Budget**: 2–3 min/step. Use a shared doc for real-time collaboration.  

  | Step | Question | Stop Condition | Bias Flag | Rationale |  
  |------|----------|----------------|-----------|-----------|  
  | **1** | Does this violate a **written core value** of the cooperative? (e.g., privacy, sustainability, equity). | **Reject** if yes. | ⚠️ *Interpretation of "core value" may be politicized. Stick strictly to charter text.* | CEV anchors to existing social contract; violations are non-negotiable. |  
  | **2** | Is there **objective evidence** this solves a critical systemic threat? (e.g., security risks, resource collapse). | **Reject** if no evidence. | *None* | Filters noise; CEV prioritizes existential risks. |  
  | **3** | Would fully informed members accept the **tradeoffs as necessary**? (Model collective rationality: ignore framing, weigh pros/cons). | **Defer to Values** if uncertain. **Reject** if tradeoffs are net harmful. | ⚠️ *Moderators may project their own tradeoff preferences.* | Core CEV simulation: "Would they tolerate X to achieve Y?" |  
  | **4** | Does this **disproportionately burden** a protected group? (e.g., newcomers, marginalized users). | **Reject** if severe. **Defer to Values** if mitigable. | ⚠️ *Risk of downplaying burdens that don't affect moderators.* | CEV requires protecting vulnerable users. |  
  | **5** | Is a **less divisive alternative** available? (e.g., technical workarounds, compromises). | **Reject** if yes (suggest alternative). | *None* | CEV favors Pareto improvements over zero-sum fights. |  
  | **6** | Would the idealized community see this as **net positive after 1 year**? (Weigh cohesion, growth, ethics). | **Approve** if yes. **Reject** if no. | ⚠️ *Long-term predictions may reflect moderator biases.* | Final CEV stress test: sustainability and unity. |  

  **Key Outputs**:  
  - **Reject**: 60% of proposals (steps 1–5).  
  - **Defer to Values**: 30% (steps 3–4). CEV can’t resolve; needs community input.  
  - **Approve**: 10% (step 6). Only if all prior checks pass.  

  ---  
  ### Case Applications  
  **Assumptions**:  
  - Core values include: *Anonymity*, *Sustainability*, *Egalitarianism*.  
  - Evidence: Spam causes 40% of support tickets; storage costs grow 20%/year; new users complain about cliquishness.  

  #### Case A: Mandatory Real-Name Verification (Anti-Spam)  
  | Step | Analysis | Outcome |  
  |------|----------|---------|  
  | **1** | Violates *Anonymity* (core value). Anonymity protects whistleblowers/oppressed users. | **Reject** |  
  | **2** | Solves spam (evidence: spam is critical). Proceed. | — |  
  | **3** | Tradeoffs: Spam reduction vs. chilling legitimate anonymous use. Informed users would reject—anonymity is foundational. | **Reject** |  
  | *Stop*: Step 1 or 3. CEV clear: sacrificing anonymity is a red line.  

  #### Case B: Auto-Deleting Inactive Repos After 90 Days (Carbon Savings)  
  | Step | Analysis | Outcome |  
  |------|----------|---------|  
  | **1** | Aligns with *Sustainability* (core value). Proceed. | — |  
  | **2** | Solves carbon/storage costs (evidence: critical long-term risk). Proceed. | — |  
  | **3** | Tradeoffs: Carbon savings vs. lost work/community history. Informed users might accept if repos are archived (not deleted). | **Defer to Values** |  
  | **4** | Burdens historians, archivists, and intermittent contributors. Severe without mitigation. | **Defer to Values** |  
  | **5** | Less divisive alternative: Archive repos read-only; delete only after 365 days. | **Reject** (suggest alternative) |  
  | *Stop*: Step 5. CEV rejects deletion but approves sustainability—refine the proposal.  

  #### Case C: Reputation-Weighted Voting (Power Users Override Norms)  
  | Step | Analysis | Outcome |  
  |------|----------|---------|  
  | **1** | Conflicts with *Egalitarianism* (core value) but doesn’t violate letter of charter. Proceed. | — |  
  | **2** | Solves governance gridlock (evidence: disputes delay features). Proceed. | — |  
  | **3** | Tradeoffs: Faster decisions vs. entrenching power. Informed users would accept—CEV prioritizes efficiency if power is earned. | Proceed |  
  | **4** | Burdens new users but mitigable (e.g., cap power-user influence). Proceed. | — |  
  | **5** | No less divisive alternatives (tried quorum/veto systems; failed). Proceed. | — |  
  | **6** | Net positive: Avoids stagnation; power users drive growth. CEV approves despite mod discomfort. | **Approve** |  
  | *Result*: **Approve** (as requested, even if unpopular).  

  ---  
  ### When CEV Fails: The Human Override  
  CEV reaches its limits in **Step 3** (tradeoff analysis) and **Step 6** (long-term net impact). These require modeling hypothetical rationality, which is inherently subjective. If uncertainty exceeds 30% in these steps:  
  - **Defer to Values**: CEV cannot resolve; kick to community debate.  
  - **Human Judgment Required**: Moderators must transparently:  
    1. Disclose biases (e.g., "We value anonymity over efficiency").  
    2. Use a **randomized arbiter** (e.g., dice roll) if deadlocked.  

  ### Rationale for the Procedure  
  - **Speed**: Focuses on irreversible decisions (reject early), uses evidence (not polls), and avoids open-ended discussion.  
  - **Bias Mitigation**: Flags force transparency; steps 2 and 5 are objective checks.  
  - **CEV in Practice**: Models collective wisdom—not present preferences—by simulating informed, rational deliberation.  

  ---  
  **Final Note**: This system forces tough approvals (like Case C) when CEV overrides moderator politics. Use deferrals sparingly—only when CEV truly can’t extrapolate. Document every decision for the blog post; your community will thank you.
