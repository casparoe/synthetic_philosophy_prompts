prompt: |-
  i host a small philosophy podcast and next episode im interviewing a philosopher — lets call her Dr. Voss — who defends "role-indexed internalism" about practical reasons. her idea is that a reason counts as internal not relative to your actual desires but relative to the motivations you'd have if you were competently performing the social role you actually occupy. so a parent who feels nothing still has internal reason to feed their kid, because thats constitutive of parenting, but if the parental role is structured by unjust norms then external reasons kick in and override. i want 7 or 8 questions that actually press her, not just "explain your view." i need at least one about whether this just collapses into externalism once you let unjust roles be overridden, one about role conflict — like being a good employee vs a present parent — and one about whether "competent role-filling" smuggles in objective moral standards. for each question, write a follow-up tailored to the answer she's most likely to give (she tends to say the norms are internal to the practice, not imported). no generic biographical stuff. keep it focused.
reasoning: |-
  Okay, the user hosts a small philosophy podcast and is interviewing Dr. Voss about her theory of "role-indexed internalism." They need 7-8 pressing questions that go beyond surface explanations, with specific requirements about addressing potential externalism collapse, role conflicts, and whether "competent role-filling" smuggles in objective morality. Each question needs a tailored follow-up anticipating Dr. Voss' likely response about norms being internal to practices.

  Hmm, Dr. Voss' theory is interesting - she shifts internal reasons from actual desires to counterfactual motivations tied to social roles, with an override for unjust norms. The user clearly understands the theory well and wants to push on its tensions. They're preparing meticulously for this interview, which suggests they value rigorous discourse and want to challenge their guest meaningfully.

  I notice three core pressure points they want emphasized: 1) The externalism risk when overriding unjust norms 2) How role conflicts are resolved without external standards 3) Whether "competence" implicitly relies on objective morality. Smart focus areas - these directly test the theory's internal coherence.

  For the override question, I'll frame it to force her to explain how overriding remains internal. Her likely "norms are practice-immanent" response then needs a follow-up about whether oppressed people's acceptance of norms validates them. That cuts to whether her framework can truly critique injustice from within.

  On role conflicts, I'll ask how to prioritize competing role demands without external arbitration. When she inevitably appeals to "contextual sensitivity," the follow-up should press whether that's just disguised intuitionism - a sharp challenge she won't expect.

  The competence question must confront whether evaluating role-performance smuggles in external standards. Her standard "internal to practice" reply needs a meta-question about whether practices themselves can be judged competent - that might expose circularity.

  I'll add four more angles: 
  - How roles are individuated (to test boundary problems) 
  - Whether role obligations bind dissenters (pressing voluntarism) 
  - Historical vs current role norms (testing dynamism) 
  - Personal identity beyond roles (probing moral limits)

  Each follow-up is designed to counter her trademark moves. For instance, when she says role norms evolve immanently, I'll ask how radical reformers fit in - forcing her to explain change without externals.

  The user avoids softballs, so every question must have teeth. No definitions, no biography - just targeted philosophical pressure. I'll keep the tone collegial but incisive, modeling good podcast interrogation. Dr. Voss is probably used to explaining her view; this will make her defend it.
answer: |-
  Here are 7 targeted questions pressing key tensions in Dr. Voss's role-indexed internalism, each with a tailored follow-up anticipating her "internal to the practice" response:

  1.  **The Externalism Pressure Point:**
      *   **Question:** You argue unjust role norms are overridden by external reasons. But if *determining* when a role norm is unjust requires appeal to reasons *outside* the internal motivational set generated by competent role-performance (e.g., fairness, well-being independent of the role), doesn't this override mechanism effectively concede that the *ultimate* source of normative authority is external, making your view a form of externalism disguised by an internalist filter?
      *   *Likely Voss Response:* "Unjustness isn't judged by importing external standards; it's an *internal failure* of the role itself according to its *own constitutive aims* (e.g., parenting aiming at flourishing). Competent performance reveals this internal contradiction."
      *   **Follow-Up:** If the constitutive aim of a role (like 'flourishing' in parenting) is itself a substantive moral notion, isn't *that* aim functioning as the external standard? How can you establish the *correct* constitutive aim of a contested role (e.g., is parenting's aim obedience or autonomy?) without stepping outside the practice's own current norms or motivations?

  2.  **The Competence & Smuggling Objectivity Point:**
      *   **Question:** You ground reasons in the motivations of a "competent" role-performer. But doesn't evaluating *competence* itself require an objective standard independent of the motivations one *actually* has when attempting the role? Isn't "competence" here smuggling in precisely the external normative standard you're trying to avoid?
      *   *Likely Voss Response:* "Competence is defined *internally to the practice*. It's about understanding and skillfully enacting the norms and goals constitutive of the role *itself*, not an external ideal. Think of mastering chess strategy vs. imposing external rules."
      *   **Follow-Up:** But practices are often contested or incoherent internally. If two people both claim competent understanding of the parental role yet derive *contradictory* motivations (e.g., strict discipline vs. permissive nurturing), how do you adjudicate which truly constitutes 'competence' without appealing to something *beyond* the practice's own internal logic or motivational outputs?

  3.  **The Role Conflict Point:**
      *   **Question:** How does role-indexed internalism resolve conflicts *between* roles, like being a "present parent" (requiring leaving work early) and a "good employee" (requiring staying late)? Are the reasons generated by each role simply incommensurable forces, or is there an *internal* mechanism within your framework for prioritizing one role's demands over another's?
      *   *Likely Voss Response:* "Competent role-performance includes understanding the *context* and *relative weight* of one's various roles. The good parent recognizes when job demands genuinely override family time *within the broader context of fulfilling both roles well*, and vice-versa. Priority isn't external; it's internal to competent navigation of multiple roles."
      *   **Follow-Up:** This seems to posit a meta-competence in juggling roles. But if someone competently fulfilling *both* individual roles still faces an irresolvable conflict (e.g., the job *requires* absence during a critical family event), doesn't resolving this *require* appeal to a value *external* to either specific role's constitutive norms – like the overall well-being of the agent or their dependents?

  4.  **The Role Individuation Problem:**
      *   **Question:** How do we determine the *boundaries* of a specific "social role" you occupy? For instance, is "American Citizen" one role generating reasons to vote and pay taxes, or is it fractured into "Voter," "Taxpayer," "Juror," "Community Member"? Doesn't how we carve up the roles significantly impact the motivations generated by competent performance and thus the reasons you have?
      *   *Likely Voss Response:* "Roles are defined by shared social practices and expectations. Competent performance involves recognizing the distinct norms and expectations associated with recognizable social positions like 'parent,' 'citizen,' or 'doctor.'"
      *   **Follow-Up:** Given social practices are often vague, overlapping, and contested (e.g., is "friend" a distinct role with its own norms, or part of "community member"?), doesn't this indeterminacy mean the 'internal reasons' generated are themselves unstable or ambiguous, depending on how we arbitrarily delineate the role?

  5.  **The Voluntarism/Bindingness Problem:**
      *   **Question:** If reasons are tied to roles I *actually occupy*, what about roles I never chose or actively reject (e.g., being born into a caste system, or societal expectations tied to gender)? Why should the motivational set of a *competent* performer of that *imposed* role generate *reasons for me*, especially if I find the role itself odious or unjust?
      *   *Likely Voss Response:* "Occupying the role is a social fact, not necessarily a choice. The reasons exist *relative to that occupancy*. However, if the role is *structurally* unjust (as determined by its own internal aims), then external reasons override. Rejection might stem from seeing that injustice internally."
      *   **Follow-Up:** Doesn't this suggest that *until* the role is deemed unjust *internally*, someone trapped in an odious but not-yet-deemed-unjust role *has internal reason* to comply with its oppressive norms? How does your view protect the dissenter *before* the internal contradiction is widely recognized?

  6.  **The Normative Stasis vs. Reform Problem:**
      *   **Question:** You say norms are internal to the practice. But practices and their constitutive norms evolve. How does role-indexed internalism account for reformers who competently perform a role yet are motivated to *change* its fundamental norms? Are their motivations (e.g., a doctor advocating for radical patient autonomy) evidence of incompetence, or do they generate new internal reasons *before* the practice changes?
      *   *Likely Voss Response:* "Reform can arise *from within* competent engagement. A truly competent practitioner might discern an internal inconsistency between the role's constitutive aims and its current norms, motivating change *to better fulfill the aim*."
      *   **Follow-Up:** This sounds like reformers are *more* competent. But how do you avoid the circularity where competence is defined by adherence to *current* norms, yet recognizing the need for change implies transcending them? Isn't the reformer appealing to a conception of the role's *true aim* that isn't fully captured by its current instantiation, effectively invoking an external standard?

  7.  **The Personal Identity / "Thin" Self Concern:**
      *   **Question:** Roles are partial aspects of a person. Does role-indexed internalism generate reasons pertaining to the agent *as a whole person* – like reasons for self-care, integrity, or avoiding burnout – that aren't derived from any specific role, or must all reasons ultimately be indexed to one of my social roles?
      *   *Likely Voss Response:* "Reasons concerning the self *as such* might arise from the meta-competence required to successfully inhabit *any* social role over time. Sustaining oneself is a precondition for competent role-performance. Alternatively, 'person' or 'agent' might itself be seen as a fundamental social role."
      *   **Follow-Up:** If 'person' is a role, how do we determine *its* constitutive norms and competent performance without massive cultural variation? If self-care reasons derive only instrumentally from specific roles, doesn't that neglect intrinsic reasons one might have for one's own well-being *independent* of role performance (e.g., resting even if it doesn't improve performance)?

  **Key Pressing Angles Covered:**
  *   **Collapse into Externalism:** Q1 & F/U directly target the override mechanism and constitutive aims.
  *   **Role Conflict:** Q3 & F/U tackle prioritization and meta-competence.
  *   **"Competence" Smuggling Objectivity:** Q2 & F/U challenge the internal definition of competence.
  *   **Additional Pressures:** Boundaries of roles (Q4), Bindingness of unchosen roles (Q5), Reform vs. stasis (Q6), and Scope beyond specific roles (Q7).

  These questions force engagement with the core tensions between internality, the source of normativity, the reality of conflicting demands, and the potential for critique within the framework, directly challenging the claim that everything can be kept "internal to the practice."
