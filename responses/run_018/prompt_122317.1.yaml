answer: |-
  Your observation is astute and cuts to the heart of enduring debates in metaphysics, particularly persistence over time, constitution, and sortal relativity. The pattern you describe—the seemingly inconsistent application of criteria (form/organization vs. material continuity) to preserve intuitive judgments—is a recognized phenomenon, though it lacks a single universally agreed-upon name. Here's a breakdown of the relevant concepts and potential labels:

  1.  **The Core Concepts:**
      *   **Persistence Conditions:** The conditions under which an object of a given kind survives change.
      *   **Sortal Relativity:** The idea that the criteria for identity and persistence depend on the *kind* of thing we are considering (e.g., "statue" vs. "lump of clay" vs. "aircraft").
      *   **Dominant Sortal:** The specific kind-concept guiding our identity judgment in a given context.

  2.  **Why the Reasoning *Seems* Inconsistent:**
      You've identified the crux: **our intuitive persistence judgments are driven by the dominant sortal concept we implicitly apply, and different sortals prioritize different criteria.** There *isn't* a single, universal rule for all entities.
      *   **For the Clay (Lump of Matter):** The dominant sortal "lump of clay" specifies persistence conditions tied to *material continuity*. If the matter remains (even scattered), the lump persists (as scattered clay).
      *   **For the Statue:** The dominant sortal "statue" specifies persistence conditions tied to *form/function/organization*. Destroying the form destroys the statue, even if the matter remains.
      *   **For the Aircraft (Artifact):** The dominant sortal "aircraft" (especially in the context of registration, history, and function) typically specifies persistence conditions tied to *spatio-temporal and organizational continuity*. The functional unit maintaining its identity through gradual part replacement persists. Reassembling parts creates a *new* functional unit (a replica) lacking that history, even with the original matter.

  3.  **Established Terms Describing Aspects of This Pattern:**
      *   **Sortal-Relative Persistence Conditions:** This is the most fundamental and widely accepted framework. It explicitly states that *different kinds of things have different persistence conditions*. This isn't inherently a "shift" or fallacy; it's a recognition of ontological diversity. Philosophers like David Wiggins (*Sameness and Substance*) are central to this view.
      *   **Constitution Without Identity:** This specifically addresses the statue/clay case. The statue and the lump of clay are distinct entities (they have different properties and persistence conditions) even though they are made of the same matter at the same time and place. Lynne Rudder Baker (*Persons and Bodies*) is a key proponent. This explains why the clay survives the crushing while the statue does not.
      *   **The Problem of Material Constitution:** This is the broader umbrella problem encompassing your examples: how can one piece of matter constitute two different things (statue/clay)? How do artifacts relate to their matter?
      *   **Contextualism about Persistence/Criteria:** Some philosophers (e.g., Eli Hirsch, drawing on Peter Unger) argue that our judgments about persistence are fundamentally context-dependent, influenced by the concepts and interests we bring to the situation. This emphasizes the "shifting" aspect you note.
      *   **Conceptual Pragmatism:** Related to contextualism, this view suggests that our concepts (like "aircraft" or "statue") are tools shaped by practical interests, and their application (including identity judgments) serves those interests. The "shift" reflects shifting practical concerns.

  4.  **What is the Pattern *You* Describe Called?**
      While there isn't one perfect, universally accepted term *just* for the *argumentative habit* of shifting criteria to preserve intuitions *without explicit principle*, the closest established descriptions are:
      *   **The Intuition-Driven Application of Sortal-Relative Persistence Conditions:** This highlights that intuitions guide which sortal we apply and how we apply its specific conditions.
      *   **The Problem of Inconsistent Intuitions in Persistence Judgments:** This acknowledges the tension you identify as a core challenge in metaphysics.
      *   **Ad Hoc Appeals to Different Persistence Criteria:** This captures the potential criticism that the reasoning lacks a deeper unifying principle and relies on whatever criterion delivers the desired result for that specific case.

  5.  **How is it Different from Equivocation or Legitimate Sortal Relativity?**
      *   **vs. Equivocation:** Equivocation uses the *same word* with different meanings ambiguously. Here, the words "statue," "clay," "aircraft" maintain relatively stable meanings. The shift is in *which concept* (sortal) we apply to the *situation* and thus *which persistence criteria* are relevant. It's not linguistic ambiguity but ontological/categorical selection. The criticism isn't about word meaning but about *how* we select the governing sortal/criteria.
      *   **vs. Legitimate Sortal Relativity:** The key difference lies in **explicitness, consistency, and grounding**.
          *   **Legitimate View:** Asserts that different fundamental ontological categories *genuinely* have different essential properties and thus different persistence conditions (e.g., organisms vs. artifacts vs. lumps of matter). This view *posits a principled metaphysical distinction* (e.g., based on function, origin, or kind-essence) and aims for consistency *within* a category. Philosophers like Wiggins or Kripke provide such grounding.
          *   **The "Problematic Habit":** Occurs when the shift *feels* unprincipled or *ad hoc*, driven purely by saving the intuition for *that specific case* without a clear, consistent theory about *why* one sortal/criterion applies here and another there, or what the fundamental categories *are*. It seems like the criterion is chosen *because* it gives the desired answer, rather than the answer being derived from a consistent application of a criterion grounded in the nature of the thing.

  6.  **What Could it Be Called? (If coining a term)**
      Given your precise focus on the *argumentative move*:
      *   **Persistence Criterion Shifting (PCS):** Emphasizes the core mechanism.
      *   **Intuition-Driven Sortal Selection:** Highlights the driver and the tool.
      *   **Ad Hoc Persistence Adjustment:** Focuses on the potential lack of underlying principle.
      *   **The Method of Preservative Adjustment:** A more neutral term, acknowledging the goal of preserving intuitions case-by-case.

  7.  **Precise Boundaries (PCS vs. Legitimate Sortal Relativity):**
      The boundary is fuzzy but revolves around **systematicity and grounding**:
      *   **Legitimate Sortal Relativity:**
          *   Provides a *theory* of fundamental categories or kinds.
          *   Defines the *essential properties* of those kinds.
          *   Derives *persistence conditions* systematically from those essential properties.
          *   Aims for *consistency* in applying the same conditions to all entities of the same kind.
          *   Can *explain* intuitions as arising from our grasp of the kind's nature.
      *   **The "Problematic Habit" (PCS):**
          *   Lacks a robust, explicit theory of kinds/categories.
          *   Lacks clear criteria for *which* sortal governs in a given ambiguous situation.
          *   Persistence conditions seem chosen *post hoc* to match the desired intuitive outcome *for that specific case*.
          *   Risks inconsistency: similar cases *might* be judged differently if intuitions differ, or the governing sortal seems arbitrarily selected.
          *   May struggle to explain *why* a particular criterion applies beyond "it feels right here."

  **In Summary:** You've identified the complex interplay of sortal relativity and our often intuition-driven judgments about persistence. While philosophers agree that persistence conditions are sortal-relative (statues and lumps, aircraft and piles of parts, have different rules), the *challenge* you pinpoint is ensuring this relativity is grounded in a principled ontology rather than appearing as an *ad hoc* adjustment to save pre-theoretic intuitions. The established terms focus on the framework (sortal-relative persistence, constitution) or the problem (material constitution), while the specific *habit* of shifting criteria without explicit principle is often discussed under the banner of **contextualism**, **conceptual pragmatism**, or simply as a core **methodological challenge in analyzing persistence intuitions**. Coining a term like **Persistence Criterion Shifting (PCS)** captures the mechanism you describe. The boundary with legitimate sortal relativity lies in the presence of a systematic, grounded theory of kinds versus reliance on seemingly case-by-case intuition.
