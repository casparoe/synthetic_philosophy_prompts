  hey, im putting together notes for a philosophy seminar on the wrong-kind-reasons problem and i realized i dont actually know what im demanding of a theory. can you lay out the full desiderata — the checklist an adequate account has to satisfy? cover the usual suspects: the cancer-cure/nobel-prize case, the demon threatening your family unless you want ice cream, and the bribery-for-belief-in-climate-change setup. then also tackle this weird injection: suppose an AI tutor gives you tiny neural rewards every time you form a belief that is true, but the reward mechanism is blind to evidence and content — does that create wrong-kind reasons for belief, and should the theory cover doxastic wrong reasons too? for each desideratum, say what case or principle motivates it, mark whether its nonnegotiable or just camp-specific, and flag any pair that looks jointly unsatisfiable (maybe something about allowing instrumental reasoning without letting in the demon?). also tell me which single requirement eliminates the most popular accounts. finally, briefly score the value-relation view and the incentive-dependence view against the list. please use american english, and feel free to be casual — a typo or two is totally ok.
