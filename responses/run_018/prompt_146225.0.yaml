prompt: |-
  Write the full specification of desiderata that any adequate theory of conscious experience must meet if it rejects the Cartesian theater—denying any single internal stage where all processing converges for a central observer—while also resisting the charge that it fragments the subject into incoherent, competing drafts with no genuine experiential unity. List the phenomena the theory must accommodate (for instance, the apparent unity of a multimodal percept despite distributed cortical processing; the continuity of narrative experience despite discrete, revisable sampling; and the selective reportability of one content among near-simultaneous alternatives), the conceptual distinctions it must preserve (such as between lacking consciousness of a state and having it without reportability; between a draft being globally accessed and being phenomenally present), and the architectural constraints it must respect (no homuncular observer; consistency with the absence of a unique cortical convergence zone). For each, give the motivating case or conceptual pressure, and flag which are non-negotiable and which are camp-specific preferences (e.g., a demand for a single continuous stream versus a demand for no privileged temporal slice). Then identify any pair of desiderata you suspect is jointly unsatisfiable—particularly any tension between explaining subjective unity and denying a central theater—and briefly indicate how Dennett's multiple drafts model and a global-workspace-style account each stand against the list, keeping the emphasis on the criteria rather than on a point-by-point scorecard.
