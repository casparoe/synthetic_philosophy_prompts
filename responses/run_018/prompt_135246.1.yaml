    - However, it also reveals an ambiguity in Dennett's position: Dennett sometimes dismisses the hard problem of consciousness and reduces phenomenology to functional roles. So, the residue might be intentional in Dennett's view — he might argue that phenomenology is just another functional aspect. But in his account of the self, the first-person aspect is not as developed as the third-person, functionalist perspective.

  Conclusion: The residue primarily reveals a limitation of the formal-ontology framework (it cannot capture subjective experience and moral force) but also shows that Dennett's position is ambiguous on whether these are real or just functional patterns. Dennett might argue that the residue is illusory and that the functional account is all there is.

