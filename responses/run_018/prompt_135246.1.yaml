  Verdict: The CRDT extension captures a real feature (decentralized eventual consistency) that Dennett's framework might underplay as a mechanism, but it obscures the emotional and normative dimensions by treating the self as a data structure.

  ### Step 5: Judge the Residue
  - The untranslatable residue (especially first-person phenomenology and the full force of normativity) reveals:
