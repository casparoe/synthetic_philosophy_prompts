     - Mapping:
       - Narrative continuity -> Node persistence (using persistent identifiers to track the same node across versions)
       - Social construction -> Distributed curation (multiple agents editing and maintaining the graph)
       - Center of narrative gravity -> A high-centrality cluster (a group of nodes that are central and interconnected) with stable reference patterns (the way nodes point to this cluster remains stable over time)
     - Translation:
       - The self is represented as a cluster of nodes (representing autobiographical memories, traits, etc.) in a knowledge graph.
       - This graph is version-controlled: changes over time are captured as new versions (like commits in Git).
       - Persistent identifiers (like URIs) are used for nodes so that they can be tracked across versions.
       - The graph schema (the structure of the data) may evolve (schema migration) but with backward-compatibility constraints to ensure that the narrative remains coherent and that old references still work.
       - The graph is curated by multiple agents (the individual and others in society) through distributed editing. This requires conflict resolution mechanisms when different agents make conflicting edits.
       - Identity conditions for the self (as an entity) are defined by the persistence of the node (or cluster) across versions, even as the graph changes.

  3. **Deliver a residue report.**
