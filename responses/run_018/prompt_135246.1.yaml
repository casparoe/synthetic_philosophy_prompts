  - Schema migration: As the narrative structure changes (e.g., new types of relationships or node categories are introduced), the graph schema may be updated, but with backward-compatibility constraints so that existing references to old nodes and relationships remain valid.
  - Multi-agent curation: The graph is edited by multiple agents (the individual and social others) concurrently. This can lead to conflicts (e.g., different agents have conflicting stories about an event).
  - Conflict resolution: Mechanisms (like merge strategies in version control) are used to resolve conflicts and maintain a coherent narrative.
  - Identity conditions: The self (as a cluster) persists across versions. This persistence is defined by the continued existence of the cluster (with a core set of nodes that are stable) and by the stable reference patterns (other parts of the graph consistently point to this cluster as representing the self).

