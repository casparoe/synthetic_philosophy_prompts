  7. **Normative force of autobiographical commitment:**
     - Requires distortion / Partial translation: In the graph, we can model constraints (like backward-compatibility) and conflict resolution as enforcing consistency. However, the normative force (the "ought" of maintaining a coherent narrative) is more than a constraint; it's a social and moral pressure. In the graph, it's reduced to a technical constraint.

  Residue Summary:
  - Clean translations: Abstraction, narrative continuity, social construction.
  - Distortion required: Intentional stance (reduced to a schema and heuristics), normative force (reduced to constraints and conflict resolution rules).
  - No counterpart: First-person phenomenology (the qualitative feel of being a self).

  ### Step 4: Evaluate the CRDT Extension
  - Proposed model: The self as a CRDT for autobiographical memory. CRDTs allow concurrent updates and eventual consistency without central control.
  - Does this capture a feature Dennett underplays?
    - Dennett emphasizes distributed, social construction, but the CRDT model explicitly provides a mechanism for achieving consistency without central authority. This might capture the idea that the self-narrative can absorb and reconcile conflicting inputs over time, which Dennett might agree with. It highlights the decentralized, resilient nature of narrative construction.
  - Does it obscure emotional and normative dimensions?
    - Yes. The CRDT model is purely about data consistency. It does not account for:
      - Emotional weight: Some memories or narrative elements are more emotionally charged and might resist merging.
