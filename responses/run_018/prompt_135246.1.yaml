  1. **Outline Dennett's account of the self as a center of narrative gravity.**
     - Dennett's view: The self is not a metaphysical substance (like a soul or a Cartesian ego) but a functional abstraction. It emerges from our storytelling practices and social interactions. We construct narratives about ourselves, and the self is the "center of narrative gravity" that holds these stories together. Personal identity is thus a product of narrative continuity and social agreement.

  2. **Restate Dennett's account in the vocabulary of version-controlled knowledge-graph engineering.**
