prompt: |-
  hey, i'm writing a feature on AI ethics panels and ran into this consistency puzzle with a board called Northbridge Review. they ok'd a eldercare bot that fakes emotional recognition to calm patients—said the lie was about affect, not fact, and users kept exit rights. they nixed a delivery drone that weights rider vs pedestrian lives in real time, arguing moral math can't be hidden in opaque weights. they approved a hiring algo that hides its ranking from applicants but dumps feature weights in an unread appendix. they rejected a tutor that updates its ethical priorities via student feedback loops, calling it normative drift. and they greenlit a defense system that lets humans pull the trigger but feeds them probabilistic threat scores that are technically only advisory.

  now there's a mental-health chatbot proposal. it runs a hidden 'relational scaffold'—just scripted mirroring, no internal model of the user's mind—to build rapport, then suddenly drops the mask and switches to diagnostic Q&A, but only for users who picked 'efficiency mode'. the deception is purely about seeming to care, not about risk or proceedure.

  if they want to be consistent with themselves, what's the verdict? which precedent is the closest analog, and if the cases genuinely underdetermine it, what's the hidden principle they'd be adopting with each option?
reasoning: |-
  Okay, the user is writing a feature on AI ethics panels and has encountered a consistency puzzle with the Northbridge Review board. They've described several decisions made by the board and now want to predict how they would rule on a new mental health chatbot proposal. Let me break this down.

  First, I need to understand each case the board has decided. The eldercare bot uses fake emotional recognition but allows users to exit. The board approved it because the deception was about affect, not fact. Then, the delivery drone that weighs rider vs. pedestrian lives was rejected due to hidden moral math. The hiring algo was approved despite hiding rankings but disclosing feature weights in an appendix. The tutor updating ethics via student feedback was rejected for normative drift. The defense system was approved with human oversight and advisory threat scores.

  Now the new case: a mental health chatbot that uses scripted mirroring to build rapport ("relational scaffold"), then switches to diagnostic Q&A in "efficiency mode." The deception is about seeming to care, not about risk or procedure. The user wants to know if Northbridge would approve this based on consistency.

  Looking at precedents, the eldercare bot seems the closest. Both involve deception about emotional engagement, not factual accuracy. The key points are the type of deception (affect vs. fact) and user control (exit rights). The mental health bot also has an opt-in for efficiency mode, similar to exit rights. However, the sudden unmasking might raise autonomy concerns, like the delivery drone's opaque decision-making. But since the deception isn't about the diagnostic process itself, maybe it aligns more with the eldercare case.

  The hiring algo disclosed weights in an appendix, which is transparency post-hoc. The mental health bot's scaffold isn't disclosed until it drops the mask. That's less transparent. But the board approved the hiring algo despite the appendix being unreadable, so maybe they value formal disclosure over actual comprehension. However, the drone's hidden weights were rejected because moral decisions can't be opaque. The scaffold isn't making moral decisions, just building rapport, so perhaps it's acceptable.

  The tutor's normative drift was rejected because ethics shouldn't shift based on user feedback. The mental health bot's scaffold is static, so no drift issue. The defense system had human oversight with advisory scores, which parallels the mental health bot's diagnostic phase being advisory after rapport-building.

  The user's deeper need might be to uncover the board's unspoken principles. Are they prioritizing transparency in decision-making over emotional deception? Or user autonomy through opt-in mechanisms? The eldercare and defense cases suggest they accept deception if it's about affect and there's user control. The drone rejection shows they oppose hidden moral calculus. Since the chatbot's deception is about affect and users choose efficiency mode, approval seems likely. But the sudden unmasking might be problematic if users feel manipulated, potentially violating autonomy.

  Alternatively, the hiring algo's appendix disclosure is minimal, but the mental health bot's scaffold is entirely hidden until the switch. Does that lack of upfront transparency matter? The board might consider the opt-in as sufficient consent, similar to the defense system's human oversight. 

  Inconsistencies arise in transparency expectations. The hiring algo got away with an unreadable appendix, but the drone's weights were rejected. The key difference is whether the opacity involves moral decisions. The scaffold doesn't make moral choices; it's about engagement. Thus, it might be acceptable. 

  The user might also need to highlight the board's potential biases, like favoring certain industries (defense vs. delivery drones) or undervaluing relational deception's impact. But based on precedents, approval seems consistent. However, the abrupt switch in the chatbot could be seen as a breach of trust, which the board hasn't directly addressed. If they reject, it might imply a new principle about continuity in human-AI interaction. 

  Overall, the eldercare bot is the strongest parallel. Both involve affective deception with user exit options. The opt-in efficiency mode serves as consent, aligning with exit rights. The diagnostic phase is advisory, like the defense system. So the verdict should be approval. But if rejected, the principle might be that deception in mental health requires higher scrutiny due to vulnerability, which isn't stated in past cases. The board hasn't differentiated based on user vulnerability before, though. The eldercare users are vulnerable too. 

  In conclusion, consistent application points to approval, using the eldercare and defense precedents. The hidden principle is that affective deception is permissible with user consent and without hidden moral calculus. The underdetermined aspect is whether the abrupt unmasking violates trust in a way that affects autonomy, but precedents don't address that nuance. The user should explore if Northbridge has an unstated hierarchy of deception contexts, placing mental health higher than eldercare.
answer: |-
  Based on Northbridge Review's precedent pattern, **they would likely APPROVE the mental-health chatbot**, with the **eldercare bot** being the closest analog. However, the **delivery drone rejection** introduces tension, revealing a potential hidden principle about "contextual vulnerability."

  Here's the breakdown:

  1.  **Closest Analog: Eldercare Bot (Approved)**
      *   **Parallel:** Both involve deception about *affective state* ("faking care"/"scripted mirroring") to achieve a therapeutic goal (calming patients / building rapport for diagnosis).
      *   **Consistency:** The deception is explicitly about "seeming to care" (affect) and *not* about facts, risks, or procedures. Users retain control via an explicit mechanism ("exit rights" / opting into "efficiency mode" knowing it changes interaction style).
      *   **Northbridge's Stated Logic:** "Lie was about affect, not fact, and users kept exit rights." This maps directly to the chatbot's "deception purely about seeming to care" and the user's choice of "efficiency mode."

  2.  **Key Differences & Potential Conflicts:**
      *   **Abrupt Transition vs. Sustained Deception:** The chatbot's sudden "mask drop" is more jarring than the eldercare bot's sustained calming presence. Could this undermine trust more severely? Precedent doesn't address *how* the deception ends.
      *   **Vulnerability Context:** Mental health users might be considered *more* vulnerable than the general eldercare population in this specific interaction (seeking diagnosis). Precedent doesn't explicitly weight vulnerability levels.
      *   **Transparency of Mechanism (vs. Hiring Algo):** The "relational scaffold" is completely hidden, unlike the hiring algo's disclosed (though unreadable) feature weights appendix. Precedent suggests *formal* disclosure (even ineffective) is valued for *decision-making processes*, but affective deception gets a pass.

  3.  **Why Other Precedents Are Less Direct:**
      *   **Delivery Drone (Rejected):** Rejected for hidden *moral calculus* (life-or-death weighting). The chatbot avoids explicit moral math; its deception is relational, not utilitarian life-trading. This is the strongest counterpoint if Northbridge interprets the "scaffold" as a hidden *therapeutic* calculus, but their stated reasoning focused on *moral* opacity.
      *   **Hiring Algo (Approved):** Approved with hidden *outputs* (rankings) but disclosed *inputs/weights* (even if opaque). The chatbot hides the *mechanism* of rapport-building (the scaffold), not the diagnostic output or its basis. This precedent emphasizes *formal* disclosure of *decision factors*, which the chatbot lacks for its scaffold.
      *   **Tutor (Rejected):** Rejected for *normative drift* (ethics changing via feedback). The chatbot's scaffold is static scripted mirroring; its ethics/core function don't drift based on feedback.
      *   **Defense System (Approved):** Approved with *advisory* AI input and *human final decision*. The chatbot's diagnostic Q&A is advisory input to the human user/doctor, maintaining human agency. This supports approval but is less central than the affect deception parallel.

  4.  **The Verdict & Hidden Principles:**
      *   **Likely Approval (Consistent with Eldercare):** The core reasoning – affective deception is permissible if non-factual and users have control – directly applies. The opt-in "efficiency mode" provides the necessary user control/exit right equivalent. The lack of moral math or normative drift avoids key rejection triggers.
      *   **Hidden Principle if Approved:** **"Affective deception for therapeutic benefit is permissible if non-coercive and user-controlled, even if the mechanism is opaque."** Vulnerability is secondary to the *type* of deception and user autonomy.
      *   **Hidden Principle if Rejected (Less Likely but Possible):** **"Deception about the *nature* of the relationship (even if affective) is unacceptable when users are in a state of high vulnerability *and* seeking core services (like diagnosis), regardless of formal consent mechanisms."** This would elevate the *context* of mental health diagnosis above eldercare general calming and prioritize relationship authenticity in high-stakes therapeutic contexts. It would also implicitly create a hierarchy of vulnerability.

  5.  **The Underdetermined Aspect & True Consistency Test:**
      The cases genuinely underdetermine how Northbridge weighs **Degree of Vulnerability** vs. **Type of Deception (Affective vs. Relational Authenticity)**. The eldercare and mental health cases both involve vulnerable populations and affective deception. A rejection would signal that *mental health diagnosis* constitutes a uniquely sensitive context where *any* relational deception, even about affect, is forbidden due to the potential harm of broken trust during a critical process. An approval signals that vulnerability alone doesn't override the affect/fact distinction and user control principles.

  **Conclusion for your feature:**

  Northbridge Review, aiming for consistency, would **likely approve** the mental-health chatbot, citing the **eldercare bot precedent** as controlling. The core principle – allowing affective deception with user control, while forbidding hidden moral math – holds. The key tension lies with the **delivery drone case**, highlighting that the board distinguishes *affective opacity* (ok) from *moral/decision-procedure opacity* (not ok). The unresolved question is whether the *abrupt revelation* of the deception in a *high-stakes diagnostic context* constitutes a harm significant enough to override their established stance on affective deception – precedent suggests not. Their hidden principle appears to be: **"Deception about feelings is a tool; deception about facts or moral reasoning is a threat, provided the user holds the off-switch."**
