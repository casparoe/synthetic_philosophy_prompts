  I need to address the moral dimensions. Property rights are a strong argument for residents. If someone buys a home expecting certain zoning, changing that could feel like a breach of trust. But is that absolute? Probably not. Ownership usually has limits, like eminent domain or nuisance laws. Plus, zoning itself is a collective regulation, not inherent to property.

  Community stability is another point. Preserving social bonds and preventing displacement is important. But blocking development can freeze neighborhoods, making them exclusive and unaffordable. That harms newcomers and worsens inequality. Right to the city suggests cities should be inclusive, evolving spaces. So stability shouldn't mean stagnation.

  The hoarding argument is key. When residents block development, they're restricting housing supply, driving up prices. That excludes lower-income people, often minorities. It's like monopolizing a public resource. The moral weight here is heavy—housing as a necessity vs. aesthetic preferences.

  Density vouchers: interesting market-based approach. But could they just legitimize exclusion? Wealthy areas might buy credits to stay sparse, pushing density to poorer areas. That replicates existing inequalities. While innovative, it doesn't solve the core injustice of hoarding space.

