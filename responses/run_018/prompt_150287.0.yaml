  So me and my roommate got into this thing last week about whether it's even meaningful to say a whole country is guilty decades later, like are Germans born in 1990 responsible in some real sense? I read Jaspers's essay on collective guilt for a course on post-war ethics — I'm actually in international relations, not philosophy, so I'm definetly out of my depth here. I want you to argue that national collective guilt only holds together if we keep Jaspers's four kinds of guilt totally seperate: criminal, political, moral, and metaphysical. The argument should be that moral and metaphysical guilt can't be inhereted because they need a first-person, present-tense relation to the wrong; you can't feel metaphysically guilty for something your grandparents particpated in. Meanwhile political guilt sticks to the state as a continuous institution, but that doesn't mean individual citizens born later carry a personal moral stain. So saying the nation is guilty should only be read as a claim about present institutional accountability, not an inherited moral burden on people who weren't there.

  Please say how confident you are in this line of reasoning and single out the point you're least sure about — I'm guessing the metaphysical guilt part is the shakiest since Jaspers frames it in almost religious terms that don't map neatly onto secular politics?
