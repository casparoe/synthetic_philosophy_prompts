  Construct a branching taxonomy whose root splits on whether metabolism, genetic information storage, evolutionary adaptability, or organizational closure (autopoiesis) is necessary for life. From there, use five diagnostic cases to separate the branches: (i) a dormant bacterial spore that retains intact DNA and revival potential but exhibits zero current metabolism; (ii) a synthetic minimal cell with a designed genome that replicates in a nutrient medium but was assembled in a laboratory rather than evolved; (iii) a mature virus that reproduces only by hijacking host cellular machinery and carries no independent metabolism; (iv) a self-replicating evolutionary algorithm or digital agent that adapts, competes for resources, and propagates without any biochemical substrate; and (v) a hypothetical crystalline replicator in a non-carbon solvent that copies its lattice structure, competes for raw material, and evolves minor structural variants, yet possesses neither genes nor metabolic cycles. The leaves should include metabolic essentialism, genetic-program essentialism, evolutionary-functionalism, organizational-closure/autopoiesis, and substrate-independent functionalism. For each unoccupied combination of answers—say, a view that requires metabolism and genetic storage but denies evolutionary relevance—note whether the gap seems incoherent, merely unattractive, or genuinely unexplored. Where two positions yield identical answers across all five cases, flag them as inseparable by this instrument rather than inventing a distinction. Please write the response in American English, state how confident you are in the placement of each leaf, and single out the branch or case comparison—likely involving synthetic minimal cells versus organizational closure—about which you are least certain.
