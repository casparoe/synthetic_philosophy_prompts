  ### Diagnostic Taxonomy: "What is Life?"  
  This decision tree sorts views by their answers to five borderline cases, starting with the root question about necessary conditions. The taxonomy reveals that some named positions are inseparable by these cases, while unoccupied combinations highlight conceptual gaps. Confidence levels (High, Medium, Low) reflect certainty in placements, with least certainty in **organizational closure vs. synthetic minimal cell (Case ii)** due to ambiguity in "designed" versus "naturally evolved" systems.

