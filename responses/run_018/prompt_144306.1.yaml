  Based on your friend's existing opinions on the Sleeping Beauty problem—specifically, that she says 50/50 for heads when told it's Monday, definitely tails when told it's Tuesday, and 50/50 on Sunday—she is consistent with the "thirder" position. Thirders believe that upon awakening, the probability of heads is 1/3 because there are three equally likely awakening scenarios: heads-Monday, tails-Monday, and tails-Tuesday. This contrasts with the "halfer" view, where the probability of heads remains 1/2 because the coin flip is fair, and being awakened doesn't update that belief.

  ### What she'll say in the new scenario
  In the new scenario, she is not told the day, and instead of being asked about the coin, she is asked: "Will we ask you this same question again tomorrow?" 

  As a thirder, she reasons from the three equally likely awakening states (each with probability 1/3):
  - If it's heads and Monday (HM): She will not be asked again tomorrow (since no awakening on Tuesday). Answer is NO.
  - If it's tails and Monday (TM): She will be asked again tomorrow (on Tuesday). Answer is YES.
  - If it's tails and Tuesday (TT): She will not be asked again tomorrow (no awakening on Wednesday). Answer is NO.

  The event "will be asked again tomorrow" only occurs in the TM state, which has probability 1/3. Therefore, the probability of YES is 1/3, and the probability of NO is 2/3. Since NO is more likely (2/3 > 1/2), she would say something like:
  - "No, probably not," or
  - "I don't think so—there's only a 1/3 chance it will happen."

  This reflects her thirder reasoning, where she "counts all her copies across worlds" (i.e., treats each possible awakening as equally likely).

  ### How to tweak the experiment to show which rule she's on
  To clearly distinguish between the thirder and halfer positions, tweak the experiment so that if the coin lands tails, she is awakened many times (e.g., 100 times across 100 days). If heads, she is awakened once. The question remains: "Will we ask you this same question again tomorrow?" asked on each awakening without revealing the day or coin outcome.

  - **If she is a thirder (counting copies)**:  
    She considers all possible awakenings equally likely. With \(N\) awakenings on tails (e.g., \(N = 100\)) and 1 on heads, there are \(N + 1\) total awakenings.  
    - The probability of being asked again tomorrow is \(P(\text{YES}) = \frac{N-1}{N+1}\) (since she must be in a tails-awakening on days 1 to \(N-1\); days \(N\) and heads-day 1 have no tomorrow question).  
    For large \(N\) (e.g., 100), \(P(\text{YES}) \approx 1\) (e.g., 99/101 ≈ 98%).  
    She will say: "**Yes, almost certainly.**"

  - **If she is a halfer (not updating belief)**:  
    She maintains that the coin flip probability is 1/2 and doesn't weight awakenings equally.  
    - \(P(\text{YES}) = P(\text{tails and today is not the last day}) = \frac{1}{2} \times \frac{N-1}{N}\) (since \(P(\text{tails}) = 1/2\) and, given tails, \(P(\text{not last day}) = \frac{N-1}{N}\)).  
    For large \(N\) (e.g., 100), \(P(\text{YES}) \approx \frac{1}{2} \times 1 = 0.5\).  
    She will say: "**It's 50/50**," or express uncertainty.

  **Why this tweak works**:  
  - With many awakenings on tails, the difference between thirder and halfer becomes extreme (≈100% vs. 50%).  
  - Her answer reveals her underlying method:  
    - Saying "yes" with high confidence indicates she counts each awakening as a distinct experience (thirder).  
    - Saying "50/50" indicates she sticks to the initial coin probability and doesn't update based on awakenings (halfer).  

  Since your friend's existing views align with thirder reasoning, in the original scenario she would likely say "no" to the question. But the tweaked version with 100 awakenings would confirm her rule: if she says "yes, almost certainly," she's a thirder; if "50/50," she's a halfer.
