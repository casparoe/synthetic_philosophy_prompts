  ## Speech: "The Work This Stone Demands"

  [Standing at the podium, facing the crowd gathered on the lawn. A deliberate pause, eyes scanning the space, then settling on the memorial.]

  Friends, neighbors, guests from our sister city, descendants of James, of Isaiah, of Thomas... We are gathered here, on this ground, for them. For James [Surname]. For Isaiah [Surname]. For Thomas [Surname]. We say their names because they were denied the dignity of their names in life and in the brutal taking of their lives. We say their names to reclaim them from the anonymity of terror, to affirm: *They were here. They were loved. They mattered.*

  This stone holds their names. It marks a truth: this violence happened *here*, among us. But the presence of this memorial also marks an absence. An absence of other names. That absence speaks too. It tells us something about where we stand *today*. It tells us that the path from violence to remembrance is neither straight nor simple, and it is rarely, if ever, complete.

  The philosopher Karl Jaspers, writing in the ashes of Germany’s catastrophe, spoke of four kinds of guilt: Criminal guilt – for the courts. Political guilt – borne by citizens for the acts of their state, their community, even if they didn’t personally commit the crime. Moral guilt – the personal burden of failing to act, to speak, to resist. And metaphysical guilt – the shared human failing when faced with radical evil.

  **Here, today, on this Mississippi soil, we stand primarily in the realm of political guilt.** We inherit the legacy of a community, a system, that allowed this to happen. That failed James, Isaiah, and Thomas utterly. That failed itself. *This* guilt – the guilt of the polity, the guilt of the place – *can* be acknowledged by its inheritors. We can, and we must, accept the responsibility *as citizens of this place* to remember what was done in its name, to understand the structures that enabled it, and to dismantle their enduring shadows. This memorial is one act of accepting that political responsibility. It is necessary. But let us be clear: it is not sufficient. And it is not reconciliation. Reconciliation requires truths told fully, and it requires a justice this stone alone cannot deliver. The descendants have asked us not to mistake this moment for that. They are right. This stone is a marker on a longer road, not its end.

  Our guests from Germany bring with them their own hard-won understanding of confronting a horrific past. Their journey, often held up as a model, was built upon a foundation largely unavailable to the American South: **confession.** A perpetrator generation, compelled by circumstance and conscience, began to admit, detail, and ultimately shape a narrative – a narrative with a distinct shape, aiming for a kind of closure, a *Vergangenheitsbewältigung* – a mastering of the past. It was, and is, extraordinary work.

  But the South’s path is different. We lack that broad, decisive wave of perpetrator confession. The violence wasn’t state policy enacted far away; it was intimate, communal, often shrouded in silence or denial passed down through generations *here*, in places like this. What we need, what this place demands, is not the arc of confession, but the **discipline of custody.** Custodial memory.

  Custodial memory isn't about crafting a narrative with a beginning, middle, and end. It’s not about closure. It’s about the relentless, often thankless, work of *maintenance*. It’s about tending the record – the incomplete, contested, painful record – of what happened. It’s about preserving the names of the victims when others would erase them. It’s about acknowledging the gaps, like the names absent from this stone, *as* gaps that matter. It’s about holding space for the anger, the grief, and the unresolved demands for justice that echo across generations. Custodial memory understands that this past isn’t something *we made*; it’s something *we inherited*. And crucially, **it’s not ours to close.** The work doesn’t end with a speech, or a monument, or a generation. It persists.

  To the students here: you’ve likely heard versions of our history that seek a comfortable middle, a “both sides.” But some things have no defensible other side. There is no “both sides” to a lynching. There is the abyss of violence and the long, hard climb towards truth. Custodial memory refuses the easy balance. It insists on the weight of the specific wrong.

  So, what does this stone demand of us? It demands we remember James, Isaiah, and Thomas. It demands we acknowledge the political guilt we inherit as members of this community – the guilt for the acts done in its name. It demands we see the absence upon it as part of the truth we must keep alive. And it demands we embrace the long discipline of custodial memory: the tending of the fire of truth, not because it warms us comfortably, but because its light, however harsh, is necessary. Because that light shows us the work still undone. This memorial is not an ending. It is a commitment, etched in stone, to a responsibility we cannot lay down. The custody of this memory, and the justice it calls for, belongs to us all, now.

  Thank you.

  ---

  **Note on Liberties and Contested Claims:**

  1.  **Jaspers' Application:** While Jaspers' four categories are foundational, applying "political guilt" so directly to a localized, communal atrocity like a lynching (vs. state-perpetrated genocide) takes a slight liberty. Jaspers focused heavily on the citizen's relation to the *state*. The speech stretches this to encompass responsibility for the acts and silences of the immediate *community*, a context Jaspers didn't explicitly address. Some scholars might argue the "moral" and "metaphysical" dimensions are more relevant here, or that the categories blur significantly at the local level.
  2.  **German Memory as "Confessional":** Characterizing German memory culture as fundamentally organized around "confession" (implying a perpetrator-driven narrative arc) leans on a specific, and contested, reading. While confession by perpetrators (eventually) played a crucial role, scholars emphasize the *decades-long*, conflict-ridden, multi-generational process involving victims, resisters, civil society, courts, educators, and politicians. Reducing it to "confession" risks oversimplifying its complexity and downplaying the crucial roles of pressure from victims, Allied forces, and later generations. The "shape, climax, ending" framing also arguably imposes a false sense of neatness on an ongoing process.
  3.  **"Custodial Memory" as Original:** The core concept of "custodial memory" is the speaker's own theoretical contribution from their dissertation work. While resonating with concepts like "agonistic memory" or "multidirectional memory," its specific framing as the *antithesis* to a German "confessional" model and its emphasis on maintenance, inheritance, and non-closure for the South is original and thus inherently untested within the literature.
  4.  **Least Confident Claim:** The single claim I am least confident about is the stark, definitive assertion: **"We lack that broad, decisive wave of perpetrator confession... What we need... is not the arc of confession, but the discipline of custody."** This risks being overly binary. While broadly true that the South lacked a *comparable* wave to (later) Germany, there *were* confessions and revelations (e.g., some during the Civil Rights era, some in later oral histories). More crucially, the claim that the South *needs* custodial memory *instead of* confession could be challenged. Couldn't confession (even belated, fragmented) *be part of* custodial memory's work? Isn't the *desire* for confession (from descendants of victims/perpetrators) still a potent force *within* the ongoing custody of the memory? The claim might undervalue the potential role confession could still play *within* the long custodial framework.
