answer: |-
  ### The Verdict Grid  
  Your cases pivot on a **Semantic Boundary Principle**: Downward causation occurs only when substrate dynamics *interpret* symbols *as symbols* via system-defined semantic interfaces. (1) Direct control: The gate’s substrate explicitly decodes the simmball’s *meaning* (thermal state), satisfying the principle. (2) Parallel tracking: Substrate ignores symbols; no interpretation occurs. (3) Predictive loop: Substrate mechanisms *treat the prediction as a directive* (e.g., error-minimization wired to align states), making the symbol’s content causal. (4) Ghost pattern: No discrete token exists to interpret; correlation lacks semantic intent. (5) Nested simulation: Substrate runs accelerated physics, not interpreting symbols *as representations* but executing them *as micro-dynamics*—no semantic boundary crossed.  

  ### The Unlisted Configuration  
  The tetrahedral simmball cluster’s efficacy hinges on whether the careenium’s architecture *recognizes the geometry itself as a symbolic token*. If the substrate contains fixed rules that detect tetrahedral arrangements *as encoded commands* (e.g., "if tetrahedron, activate shield"), then geometry enables downward push by creating a new symbol via compositional syntax. If the geometry merely optimizes physical coupling (e.g., resonance frequencies aligning), it remains substrate dynamics. The principle demands *explicit semantic interpretation of the pattern*, not just emergent physical effects.  

  ### The Reconciliation Cost  
  The principle overturns your verdict on **case (5)**. The nested simulation’s simmballs are causally inert *as symbols*: the substrate executes their internal physics mechanically, not "reading" their predictive output *as a representation* to obey. It is substrate dynamics (accelerated) pushing other substrate dynamics, lacking a semantic interface where symbols *qua* symbols influence macro-behavior. Your intuition in (3) holds because alignment is driven by *interpretation* of the prediction’s content, while (5) is merely faster computation. Sacrificing (5) preserves coherence: "symbolic push" requires intentional decoding, not just isomorphic computation.  

  ### The Residual Question  
  The principle reframes but does not erase the original question. It defines "downward push" as causation mediated *by representational content* at system-designated interfaces. This avoids redefining all correlation as causation (saving cases 2/4) and excludes mere physical isomorphism (case 5). Symbols "push" only when the substrate’s *rules for meaning*—not just its physics—make the symbol’s content a causal variable. The puzzle remains: whether such interfaces exist or are illusions, but the principle stakes a clear claim.
