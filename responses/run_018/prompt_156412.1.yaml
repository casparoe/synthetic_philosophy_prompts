  First, I need to unpack Nietzsche's views. He saw diet as integral to intellectual work. Bad digestion corrupts thinking, so his rules were practical, not moral. He hated traditional asceticism because it denied life, but his discipline was about enhancing life. The key difference is the purpose: self-overcoming vs. self-denial.

