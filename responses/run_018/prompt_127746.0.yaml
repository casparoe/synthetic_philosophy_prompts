answer: |-
  ### Joint Statement on Consequentialist Cluelessness  
  *Produced via Adversarial Collaboration*  

  **A. Agreed Claims**  
  1. **Formal Structure of Consequentialism**: Consequentialist evaluation requires comparing actions based on the expected moral value of their outcomes, where value is determined by impacts on morally relevant entities.  
  2. **Radical Uncertainty**: Agents lack precise knowledge of long-term causal chains (e.g., butterfly effects of policy interventions) and face fundamental barriers to modeling outcomes beyond 50–200 years.  
  3. **Moral Patienthood**: Sentient beings (present and future) are moral patients, and their welfare possesses intrinsic moral weight independent of epistemic limitations.  
  4. **Risk vs. Deep Uncertainty**:  
     - *Risk*: Probabilities and outcome distributions are known or empirically estimable (e.g., clinical trial mortality rates).  
     - *Deep Uncertainty*: No reliable probability distributions exist for outcomes involving complex systems, novel technologies, or intergenerational effects (e.g., societal impacts of human genome editing).  
  5. **Epistemic Burden**: Consequentialism obliges agents to mitigate ignorance where feasible but does not require omniscience.  

  ---

  **B. Disagreements Table**  
  | Crux ID | Issue (Neutral) | Camp A Formulation (Bounded-Consequentialist) | Camp B Formulation (Structural-Skeptic) | Verdict |  
  |---------|-----------------|-----------------------------------------------|-----------------------------------------|---------|  
  | C1      | Normative scope of expected-value reasoning | Expected-value reasoning retains normative authority under deep uncertainty when using robustness rules and bounded domains. | Expected-value reasoning lacks normative authority under deep uncertainty due to structurally incommensurable value comparisons. | Substantive |  
  | C2      | Tractability of cross-domain comparisons | Non-arbitrary, approximate comparisons across timescales/domains (e.g., human vs. digital minds) are achievable via epistemic discounting and intertheoretic consistency. | Cross-domain comparisons are structurally intractable; no non-arbitrary weighting function exists for ontologically distinct moral patients or timescales. | Substantive |  
  | C3      | Role of cluelessness in prescription | Cluelessness is a remediable epistemic gap; option value analysis and robustness rules yield action-guiding prescriptions. | Cluelessness is a structural flaw invalidating first-order consequentialist prescriptions; alternate frameworks (e.g., satisficing) are required. | Substantive |  

  ---

  **C. Crux Tests**  
  **Crux C1: Normative scope of expected-value reasoning**  
  - *Sub-question*: Can robustness rules salvage normative authority for expected-value reasoning in decisions with deep uncertainty?  
  - **Test Case**: *Near-Term Aid vs. Long-Term Governance Intervention*  
    - **Option X**: Distribute malaria bednets. Saves 1,000 lives (95% certainty) within 5 years. Welfare gains are measurable, bounded, and non-controversial (1 life saved = 1 unit).  
    - **Option Y**: Fund constitutional reforms to increase deliberative democracy. Outcomes:  
      - 10% chance of preventing a 22nd-century autocracy (estimated welfare loss: 10 billion future units).  
      - 30% chance of minor procedural improvements (welfare gain: 100,000 units).  
      - 60% chance of no measurable effect.  
    *Uncertainty*: No objective probability distributions for key parameters (e.g., future population size, moral weight of digital persons).  
  - **Camp A Prediction**: Robustness rules (e.g., max-min welfare across scenarios) and epistemic discounting (e.g., penalizing low-probability tail outcomes) yield a non-arbitrary prescription (e.g., prefer Option X).  
  - **Camp B Prediction**: The case demonstrates arbitrariness; any probability/value assignment for Option Y relies on unjustifiable premises, voiding normative authority.  

  **Crux C2: Tractability of cross-domain comparisons**  
  - *Sub-question*: Can agents non-arbitrarily compare welfare across ontologically distinct moral patients?  
  - **Test Case**: *Climate Adaptation vs. Digital Sentience Safeguards*  
    - **Option P**: Build seawalls protecting 10,000 humans from flooding. Welfare gain: 50,000 units (based on disability-adjusted life years).  
    - **Option Q**: Fund ethics research to prevent suffering in future sentient AI. Welfare gain (if successful): Avoids unquantified suffering in 1 billion digital minds.  
    *Uncertainty*: No consensus on moral weight of digital minds vs. biological humans; unknown probability of creating sentient AI.  
  - **Camp A Prediction**: Bounded comparisons (e.g., "minimum welfare significance" heuristics) permit non-arbitrary choice (e.g., Option Q dominates under plausible weightings).  
  - **Camp B Prediction**: Assigning weights to digital-mind suffering is structurally arbitrary; no defensible comparison exists.  

  **Crux C3: Role of cluelessness in prescription**  
  - *Sub-question*: Does cluelessness invalidate all first-order consequentialist prescriptions?  
  - **Test Case**: *AI Governance vs. Poverty Alleviation*  
    - **Option M**: Direct cash transfers lifting 5,000 people from poverty (welfare gain: 5,000 units; 90% certainty).  
    - **Option N**: Lobby for international AI ethics standards. Outcomes:  
      - <1% chance of preventing existential catastrophe (welfare gain: 10^15 units).  
      - 99% chance of negligible impact.  
    *Uncertainty*: No reliable models for AI trajectory; value of "existential catastrophe prevention" involves incomparable scales.  
  - **Camp A Prediction**: Option value analysis (valuing flexibility in future decisions) supports Option N; cluelessness is mitigated.  
  - **Camp B Prediction**: Option N’s uncertainty voids prescription; "expected value" is an incoherent construct here.  

  ---

  **D. Verbal Dispute Diagnosis**  
  Disagreements over the following terms are partly verbal:  
  - **"Cluelessness"**: Camp B uses it to denote *structural indeterminacy*, while Camp A uses it for *epistemically tractable ignorance*. Resolving this eliminates no disputes; the residual substantive issue is whether uncertainty is structural (B) or parametric (A).  
  - **"Robustness"**: Camp A defines it as *performance across plausible models*, while Camp B sees it as *model-dependent and thus arbitrary*. Terminological alignment leaves intact the dispute over whether robustness rules resolve incommensurability (C1).  
  - **"Normative authority"**: Camp A equates it with *practical reasonableness under constraints*, while Camp B requires *objective grounding in comparable values*. Residual dispute: Whether "bounded rationality" suffices for authority (C3).  

