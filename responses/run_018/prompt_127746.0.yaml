  (1) The Bounded-Consequentialist camp: they grant that agents face radical uncertainty about long-run causal chains and comparative moral weights, but hold that second-order robustness rules, epistemic discounting within bounded domains, and explicit evaluation of option value preserve the normative authority of expected-value reasoning without requiring omniscience.
  (2) The Structural-Skeptic camp: they maintain that consequentialist evaluation necessarily requires comparative judgments across domains, timescales, and ontological categories for which no non-arbitrary weighting function can be constructed, and that this is not a remediable epistemic gap but a structural feature that undermines first-order consequentialist prescription altogether.

  Please draft the joint statement they could both sign. It should contain:

  A. A numbered section of agreed claims—precise statements about the formal structure of consequentialist evaluation, the actual limits of our predictive and causal-modeling capacities, shared normative premises about moral patienthood, and the distinction between risk (known distributions) and deep uncertainty (unknown or unrepresentable distributions)—phrased so that neither camp must retract them and so that they are not vacuous.

  B. A disagreements table with exactly these columns:
  - Crux ID
  - Issue in neutral wording
  - Formulation that Camp A (Bounded-Consequentialist) accepts as stating its own view
  - Formulation that Camp B (Structural-Skeptic) accepts as stating its own view
  - Verdict: substantive or verbal?

  C. For each substantive crux identified in B, provide:
  - The crux formulated as a single sub-question such that settling it in one direction would move at least one camp.
  - A concrete, precisely specified hypothetical case or argument that both sides agree bears on that crux (e.g., a resource-allocation choice between a near-term intervention with bounded, measurable welfare effects and a speculative long-run governance intervention with highly diffuse, structurally uncertain effects). Do not invent empirical statistics; specify the decision structure clearly.
  - Camp A's explicit prediction about what that case or argument demonstrates.
  - Camp B's explicit prediction about what that same case or argument demonstrates.

  D. A brief diagnosis of any purely verbal disagreement: identify which terms (e.g., "cluelessness," "robustness," "normative authority") are being used with different technical meanings, state whether resolving the terminological divergence eliminates the conflict or leaves a residual substantive dispute, and name that residual dispute if present.

