  **Joint Statement on Consequentialist Cluelessness**

  This document represents a collaborative effort between representatives of the Bounded-Consequentialist camp and the Structural-Skeptic camp to clarify points of agreement and disagreement regarding the problem of cluelessness in consequentialist ethics.

  **A. Agreed Claims**

  We, the undersigned, affirm the following propositions:

  1. **Formal Structure of Consequentialist Evaluation**: Consequentialist evaluation requires the assessment of actions based on the expected value of their outcomes, where expected value is a function of the probabilities and values of possible states of the world.

  2. **Epistemic Limitations**: Human agents face severe epistemic constraints in predicting the long-term consequences of their actions. These constraints include, but are not limited to, incomplete knowledge of causal chains, unquantifiable uncertainties about the future, and difficulties in comparing welfare across different timescales, populations, and ontological categories.

  3. **Scope of Moral Patienthood**: Moral patienthood extends to all sentient beings, and their welfare is of intrinsic moral importance. This premise is shared and not at issue in the current debate.

  4. **Risk vs. Deep Uncertainty**: A clear distinction exists between decision-making under risk (where probabilities of outcomes are known or reasonably estimable) and decision-making under deep uncertainty (where probabilities are unknown, unrepresentable, or where the space of possibilities is undefined or unbounded).

  5. **Problem of Cluelessness**: In decisions with potentially vast long-term consequences, especially those involving existential risks or large-scale societal changes, deep uncertainty can lead to a state of cluelessness, wherein the expected value of actions cannot be confidently calculated.

  **B. Disagreements Table**

  The following table outlines the key points of disagreement between the two camps:

  | Crux ID | Issue in Neutral Wording | Camp A (Bounded-Consequentialist) Formulation | Camp B (Structural-Skeptic) Formulation | Verdict |
  |---------|--------------------------|------------------------------------------------|-----------------------------------------|---------|
  | 1 | Possibility of meaningful expected value comparisons under deep uncertainty | Even under deep uncertainty, bounded methods (e.g., robustness rules, epistemic discounting, and option value analysis) can yield non-arbitrary expected value comparisons that preserve normative authority. | Under deep uncertainty, expected value comparisons are necessarily arbitrary because no non-arbitrary weighting function can be constructed for comparing outcomes across domains, timescales, and ontological categories. | Substantive |
  | 2 | Existence of non-arbitrary methods for cross-domain welfare comparison | There exist non-arbitrary methods (e.g., using intertheoretic comparisons, normalization to a common scale, or domain-specific heuristics) for comparing welfare across different domains and timescales, even if imperfect. | There are no non-arbitrary methods for comparing welfare across fundamentally different domains (e.g., near-term human welfare vs. far-future digital minds) because such comparisons require value judgments that lack objective grounding. | Substantive |
  | 3 | Normative authority of bounded consequentialism | The bounded consequentialist approach, by incorporating second-order robustness and explicit uncertainty management, preserves the normative authority of consequentialist reasoning for first-order prescriptions. | The structural limitations of consequentialist evaluation in the face of deep uncertainty undermine the normative authority of any first-order consequentialist prescription, regardless of methodological refinements. | Substantive |

  **C. Crux Tests**

  For each substantive crux identified above, we provide a test case and explicit predictions.

  **Crux 1: Possibility of meaningful expected value comparisons under deep uncertainty**

  - **Sub-question**: Can bounded expected value methods yield a non-arbitrary prescription in a choice between a near-term intervention with bounded, measurable effects and a speculative long-run intervention with structurally uncertain effects?

  - **Test Case**: 
    - Option X: Invest resources in a proven malaria prevention program. This program will, with high certainty (probability >0.95), save 1000 lives of children in the next year. The long-term effects beyond 10 years are negligible and bounded (e.g., no significant impact on existential risks or civilizational trajectory).
    - Option Y: Invest the same resources in foundational research for artificial general intelligence (AGI) safety. The potential long-term effects are vast: if successful (unknown probability), it might reduce existential risk from AGI and enable a flourishing future for billions of digital minds over millennia. However, the probability of success is deeply uncertain (no consensus on even an order of magnitude), and the causal pathways are opaque (e.g., the research might be misused or become obsolete).

  - **Camp A Prediction**: By applying robustness rules (e.g., evaluating outcomes under a range of plausible probability distributions for Y's success) and epistemic discounting (discounting the value of Y by a factor accounting for uncertainty), a bounded expected value calculation will show that Option X is robustly preferable because it delivers certain, high-value outcomes, while the expected value of Y, after discounting, is lower and more variable. Thus, the calculation yields a non-arbitrary prescription for X.

  - **Camp B Prediction**: The case demonstrates that any expected value comparison is arbitrary. The probability of success for Y is not just unknown but unrepresentable (deep uncertainty), and the value of Y's potential outcomes involves incommensurable scales (near-term human lives vs. far-future digital minds). Any assignment of probabilities or weights to Y is speculative and non-verifiable, making the comparison arbitrary. Consequentialist evaluation thus cannot provide a non-arbitrary prescription.

  **Crux 2: Existence of non-arbitrary methods for cross-domain welfare comparison**

  - **Sub-question**: Can welfare comparisons between near-term human welfare and far-future welfare of potentially different types of moral patients be made non-arbitrarily?

  - **Test Case**: 
    - Decision: Allocate a fixed budget to either:
      Option P: Improve current prison conditions, which would significantly reduce the suffering of 10,000 human prisoners over the next decade (welfare gain well-established in quality-adjusted life years).
      Option Q: Fund research into mitigating risks from superintelligent AI, which might prevent the suffering of trillions of digital minds (if such minds come to exist) over the next millennium. The nature of digital mind suffering is currently unknown, and the risk reduction is speculative.

  - **Camp A Prediction**: Using domain-specific heuristics (e.g., leveraging analogies from human and animal welfare) and intertheoretic comparison methods (e.g., placing bounds on the value of preventing digital suffering based on plausible moral theories), a non-arbitrary comparison can be made. For instance, even under conservative bounds, Option Q could be shown to have higher expected value.

  - **Camp B Prediction**: The comparison requires equating the reduction of human prisoner suffering (a well-understood welfare domain) with the prevention of digital mind suffering (a domain with unknown properties). Without a shared ontology of welfare or a common unit of measure, any weighting is arbitrary. Thus, no non-arbitrary comparison is possible.

  **Crux 3: Normative authority of bounded consequentialism**

  - **Sub-question**: Does bounded consequentialism retain normative authority for first-order prescriptions in the face of deep uncertainty?

  - **Test Case**: 
    - Use the same test case as for Crux 1 (Option X vs. Option Y).

  - **Camp A Prediction**: The bounded methods (robustness rules, discounting) provide a reasoned, non-arbitrary basis for choosing X over Y. This process, being transparent and grounded in decision-theoretic principles, preserves normative authority for the prescription.

  - **Camp B Prediction**: The bounded methods do not overcome the structural arbitrariness in the value and probability assignments for Y. Therefore, the prescription lacks normative authority because it masks the underlying indeterminacy.

  **D. Verbal Dispute Diagnosis**

  We identify the following terminological differences:

  - **"Cluelessness"**: Camp A views cluelessness as an epistemic challenge that can be mitigated by bounded methods. Camp B views it as a structural feature that cannot be overcome. Resolving the terminological difference does not eliminate the substantive dispute; it merely clarifies that the dispute is about whether the problem is structural or epistemic.

  - **"Robustness"**: Camp A uses "robustness" to refer to methods that yield stable prescriptions across a range of plausible scenarios. Camp B contends that the set of "plausible scenarios" is itself arbitrarily bounded. This is a substantive dispute about the scope and justifiability of scenario bounding.

  - **"Normative authority"**: Camp A means that the prescription is rationally justifiable and action-guiding under bounded rationality. Camp B means that the prescription must be objectively grounded in the true expected value (which they argue is inaccessible). This difference is partly verbal, but the residual substantive dispute is about whether bounded justifiability suffices for normative authority in ethics.

