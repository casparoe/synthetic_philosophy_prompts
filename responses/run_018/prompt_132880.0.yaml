prompt: |-
  I'm running a small philosophy podcast and next week's guest is an invented defender of cohort realism — she thinks generations like Boomers, Millennials, and Gen Z are genuine social kinds with real explanatory power, not just marketing buckets. I need eight to ten interview questions that go deep into the ontolgy instead of letting her restate the view. At least one should hit the boundary problem: what about someone born in 1996 who shares culture with neither Millennials nor Gen Z? Another should press whether these kinds survive cross-cultural comparison — do Japanese Shinjinrui or Korean MZ cohorts map onto the same ontology, or are we just projecting Western demogrphic labels? And I want one on the fact that marketers and pollsters literally invented half these categories. For each question, include a follow-up keyed to her most likely reply, especially if she deflects with "that's just vagueness, not a problem for kindhood." Keep the tone casual — a typo or two is totally fine.
