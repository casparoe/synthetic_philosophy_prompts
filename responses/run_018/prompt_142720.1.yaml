answer: |-
  Here is a comprehensive set of adequacy conditions for any theory of natural laws, structured to expose theoretical pressures and conflicts. I distinguish **non-negotiable desiderata** (essential for any minimally viable theory) from **camp-specific preferences**, and flag key tensions.

  ---

  ### **Core Desiderata for Theories of Natural Laws**

  1. **Distinguish Lawlike from Accidental Regularities**  
     *Motivation*: Avoid collapsing laws into mere coincidences (e.g., Newton’s gravitational law vs. "All gold spheres <10 miles wide"). Requires resources to demarcate laws as *projectible* and *nomic*.  
     *Non-negotiable*: Yes. Without this, laws lose explanatory and predictive utility.

  2. **Support Non-Circular Counterfactuals & Interventions**  
     *Motivation*: Science relies on claims like "Had charge been positive, repulsion would still occur" or "If we intervene to increase mass, gravitational force increases." Modal force must not presuppose unexplained laws or dispositions.  
     *Non-negotiable*: Yes. Counterfactual robustness is central to lawhood.

  3. **Accommodate Vacuous Laws**  
     *Motivation*: Laws should hold even in worlds lacking their relata (e.g., "Electrons repel if like-charged" in electronless worlds). Theories must avoid making laws *depend* on instances.  
     *Non-negotiable*: Yes. Vacuous truths are part of scientific practice.

  4. **Explain Temporal Stability**  
     *Motivation*: Laws persist while contingent states change (e.g., gravity holds across cosmic epochs). Why don’t laws "drift" with the Humean mosaic?  
     *Non-negotiable*: Yes. Instability undermines lawhood’s normative role.

  5. **Ground Scientific Explanation**  
     *Motivation*: Laws explain *why* patterns hold (e.g., gas pressure is *because* of kinetic theory laws), not just describe them. Must avoid collapsing into descriptivism.  
     *Non-negotiable*: Yes. Explanation requires more than pattern-tracking.

  6. **Account for Non-Fundamental Laws**  
     *Motivation*: Special sciences (e.g., genetics, economics) have lawlike generalizations (e.g., Hardy-Weinberg equilibrium) that appear *emergent* or *ceteris paribus*. Theories must handle their derivative status without reduction.  
     *Non-negotiable*: Yes. Excluding special sciences is empirically inadequate.

  ---

  ### **Camp-Specific Preferences (Negotiable but Contentious)**

  7. **Modal Strength Across Nearby Worlds**  
     *Motivation*: Laws constrain not just actuality but possibilities (e.g., "Water *must* boil at 100°C at sea level"). Anti-Humeans demand *robust* modality; Humeans seek weaker, supervenience-compatible versions.  
     *Preference*: Anti-Humeans prioritize strong modality; Humeans accept contextual/holistic modality.

  8. **Ontological Parsimony**  
     *Motivation*: Humeans reject "governing" entities beyond the mosaic. Anti-Humeans accept irreducible modalities/powers if explanatory payoff justifies.  
     *Preference*: Humeans demand supervenience on non-modal base; anti-Humeans tolerate modal primitives.

  9. **Epistemic Accessibility**  
     *Motivation*: How do we *know* laws? Humeans tie laws to observable regularities; primitivists/dispositionalists may accept abductive justification for hidden structures.  
     *Preference*: Humeans favor empiricist access; others accept inference to best explanation.

  ---

  ### **Key Conflicts & Tensions**

  - **The Humean Trilemma**:  
    **Full Humean Supervenience** + **Non-Circular Explanatory Power** + **Robust Modal Force** appear jointly unsatisfiable.  
    - *Conflict*: Humean supervenience (laws supervene on particular matters of fact) struggles to deliver *robust* modality (e.g., laws might differ in worlds with identical histories but different best-system criteria). Non-circular explanation requires laws to "go beyond" the mosaic, but Humeanism ties them to it.  

  - **Vacuous Laws vs. Dispositional Essentialism**:  
    Dispositional essentialism (e.g., properties *are* their causal roles) struggles with vacuous laws: if no electrons exist, what grounds electron-repulsion laws? Primitivism or Humeanism handle this better.  

  - **Stability vs. Anti-Humean Governance**:  
    Anti-Humeans easily explain stability via timeless governing relations. Humeans must explain why the "best system" doesn’t change over time – often invoking pragmatic or epistemic constraints, risking circularity.  

  - **Non-Fundamental Laws vs. Primitivism**:  
    Primitivist governing relations (e.g., Dretske-Tooley-Armstrong) typically focus on fundamental laws. Emergent special-science laws may require additional mechanisms (e.g., grounding), complicating ontological unity.  

  ---

  ### **How Leading Theories Fare (Briefly)**  

  | **Desideratum**       | **Humean BSA**                                  | **Dispositional Essentialism**                  | **Primitivist Governance**                     |  
  |------------------------|------------------------------------------------|------------------------------------------------|-----------------------------------------------|  
  | Lawlike vs. Accidental | ✔️ (Via systematization)                      | ✔️ (Causal essences)                          | ✔️ (Irreducible nomic relations)             |  
  | Counterfactuals        | ⚠️ (System-relative; fragile in "twin" worlds) | ✔️ (Built into essences)                      | ✔️ (Laws govern possibilities)               |  
  | Vacuous Laws           | ✔️ (Generalizations hold vacuously)            | ❌ (No instances → no dispositions)            | ✔️ (Relations exist sans relata)             |  
  | Temporal Stability     | ⚠️ (Pragmatic/system-dependent)               | ✔️ (Timeless essences)                        | ✔️ (Immutable relations)                     |  
  | Scientific Explanation | ❌ (Descriptive; "patterns as brute")          | ✔️ (Causal powers account for patterns)       | ✔️ (Laws as explanatorily primitive)         |  
  | Non-Fundamental Laws   | ✔️ (Hierarchical systematization)             | ⚠️ (Derivative powers; emergent issues)      | ❌ (Requires ad-hoc emergent governing layers)|  
  | Modal Strength         | ⚠️ (Contingent on actual mosaic)              | ✔️ (Strong, property-based necessity)         | ✔️ (Metaphysical necessity)                  |  

  ---

  ### **Conclusion: Non-Negotiables vs. Tradeoffs**  
  - **Non-negotiable**: (1)–(6) are essential. Failure on any collapses the distinction between laws and contingencies.  
  - **Central Tension**: The **Humean Trilemma** is the deepest conflict. Humeans sacrifice robust modality and non-circular explanation to preserve supervenience; anti-Humeans accept modal primitives to secure them.  
  - **Modal Constraint**: A "sufficiently restricted" Humean base (e.g., Lewis’s BSA) delivers *weak* modality (contingent on actual history’s structure) but not *robust* modality (holding across all nomically possible worlds). Anti-Humean governance remains the only route to the latter.  
  - **Emergent Laws**: Best-system accounts handle these most gracefully; dispositionalism and primitivism require auxiliary theories of emergence.  

  **Recommendation**: Clarify whether your seminar prioritizes *fundamental* metaphysics (favoring anti-Humean robustness) or *science-first* unity (favoring Humean flexibility). No theory satisfies all desiderata without theoretical costs.
