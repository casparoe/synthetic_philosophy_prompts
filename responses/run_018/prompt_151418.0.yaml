  ### Decision Tree: Incommensurability in Scientific Frameworks  
  **Starting Scenario:** Two labs in 1895 observe heat in sealed vessels. One describes it as "caloric fluid displacement"; the other as "mean kinetic energy increase." They agree on the thermometer reading but disagree on its meaning.

  #### 1. **Do they disagree *only* about theoretical explanations, or also about what the thermometer reading *is* (e.g., what "temperature" means)?**  
     - **A. They disagree about what "temperature" fundamentally is** → *Go to 2*  
       *(e.g., "caloric density" vs. "particle motion indicator")*  
     - **B. They agree on what "temperature" is observationally, but not what it implies** → *Go to 3*  
       *(e.g., both see it as "heat intensity," but interpret its cause differently)*  

  #### 2. **Could a neutral observer use shared rules (logic, math, experiments) to prove one framework superior?**  
     - **A. No—the frameworks lack common standards for comparison** → **Leaf: Strong Incommensurability**  
       *(Early Kuhn/Feyerabend: No shared language or rules to judge "truth.")*  
     - **B. Yes—despite conceptual differences, shared methods can decide** → *Go to 4*  

  #### 3. **Could a neutral observer use shared rules to prove one framework superior?**  
     - **A. No—evidence underdetermines the choice; no decisive test exists** → *Go to 5*  
     - **B. Yes—experiments/logic can objectively settle the dispute** → *Go to 6*  

  #### 4. **Can the caloric framework be *fully reconstructed* within kinetic theory?**  
     - **A. Yes—caloric is a useful approximation of kinetic theory in specific cases** → **Leaf: Convergent Realism**  
       *(Putnam/Boyd: Old theories reduce to new ones as science progresses.)*  
     - **B. No—caloric posits entities (e.g., "fluid") that kinetic theory rejects as illusory** → **Leaf: Unnamed: Deflationary Replacement**  
       *Why empty? Unstable: If shared rules decide, reconstructing the old theory is usually expected. Denying this risks self-contradiction.*  

  #### 5. **Is framework choice driven by pragmatic virtues (e.g., simplicity, usefulness) or social conventions?**  
     - **A. Pragmatic virtues—e.g., which framework predicts better or is more fruitful** → **Leaf: Instrumental Pluralism**  
       *(Quine/van Fraassen: Theories are tools; choose based on utility, not "truth.")*  
     - **B. Social conventions—e.g., community norms or historical context** → **Leaf: Conventionalism**  
       *(Social constructivism: Choice reflects consensus, not epistemic superiority.)*  

  #### 6. **Can the caloric framework be *fully reconstructed* within kinetic theory?**  
     - **A. Yes—caloric describes a limiting case (e.g., equilibrium states) of particle motion** → **Leaf: Convergent Realism**  
     - **B. No—kinetic theory reveals caloric as fundamentally misguided** → **Leaf: Semantic Holism Without Incommensurability**  
       *(Quine/Davidson: Meanings are theory-laden but translatable; old theories are *false*, not incommensurable.)*  

  ---

  ### Leaves & Positions  
  - **Strong Incommensurability**: Frameworks share no common language/rules.  
  - **Convergent Realism**: Science cumulates; old theories approximate new ones.  
  - **Instrumental Pluralism**: Choice is pragmatic; frameworks are useful instruments.  
  - **Semantic Holism Without Incommensurability**: Theories are translatable and comparable, but old ones are discarded as wrong.  
  - **Conventionalism**: Choice depends on social/contextual factors.  
  - **Local Incommensurability** (Kuhn's later view) → *Collapses into Instrumental Pluralism (see below)*  
  - **Unnamed: Deflationary Replacement** → *Likely empty (see above)*.  

  ---

  ### Flagged Collapses  
  1. **Quine-style holism (Instrumental Pluralism) vs. Kuhn’s later view (Local Incommensurability)**:  
     - Both answer:  
       - Q1: **A** (disagree on what "temperature" is),  
       - Q2: **A** (no shared rules to decide),  
       - Q5: **A** (pragmatic choice).  
     - *Why collapse?* Kuhn’s later work (post-1970) treats paradigms as partially translatable but prioritizes pragmatic virtues (problem-solving, fruitfulness). Quine’s underdetermination + pragmatism leads to the same answers. Distinction hinges on *degree* of untranslatability, but the tree’s binary branches don’t capture this nuance.  

  2. **Semantic Holism vs. Convergent Realism**:  
     - Both answer Q3/Q2: **B** (shared rules can decide) but diverge at Q6/Q4:  
       - Holism says **B** (old theory is false, not incommensurable),  
       - Convergent realism says **A** (old theory is approximately true).  
     - *No collapse here—distinct outcomes.*  

  ---

  ### Key Omissions  
  - **Feyerabend’s radical view** is covered under **Strong Incommensurability**.  
  - **Kuhn’s early view** (Structure of Scientific Revolutions) fits **Strong Incommensurability** if Q2A is chosen; his later view collapses into **Instrumental Pluralism**.  
  - **Unnamed combinations** (e.g., "Q1A → Q2B → Q4B") are flagged as unstable or rare.  

  This tree isolates core commitments (translatability, comparability, reconstruction) without requiring prior philosophical knowledge. Grad students can self-sort by debating the case, then compare their leaf to canonical positions.
