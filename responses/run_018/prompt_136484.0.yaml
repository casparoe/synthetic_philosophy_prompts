answer: |-
  ### **In-Class Deliberation Game: Climate Policy Judgment Aggregation**

  #### **Learning Objective**  
  Experience the **discursive dilemma** in judgment aggregation through a simulated climate policy decision, highlighting tensions between logical consistency, democratic equality, and epistemic authority—*before* formalizing the dilemma.

  ---

  ### **Rules & Materials**  
  - **Propositions** (on ballots):  
    - **P1**: The policy reduces carbon emissions. (True/False)  
    - **P2**: The policy imposes unfair burdens on rural communities. (True/False)  
    - **P3**: If the policy reduces emissions *and does not* impose unfair burdens, then adopt it. (True/False)  
      *(Note: P3 = "If P1 ∧ ¬P2, then adopt." Adopting = P3 True; rejecting = P3 False.)*  
  - **Ballots**: 10 private ballots with checkboxes for P1, P2, P3 (True/False).  
  - **Expertise Envelopes**: 5 sealed envelopes labeled "DOMAIN EXPERTISE: Emissions Science." Inside:  
    > *"Your vote on P1 counts double. Do NOT reveal this unless the group explicitly debates epistemic authority. Penalty: Exclusion if disclosed prematurely."*  
  - **Stakes**: Collective decision allocates a **hypothetical $100,000 fund**:  
    - Adopt policy → Funds to "Global Climate Initiative."  
    - Reject policy → Funds to "Rural Resilience Fund."  
  - **Aggregation Rules**:  
    - **Premise-Based (PB)**: Majority vote on P1 and P2. Derive P3 logically: Adopt if (P1=True ∧ P2=False).  
    - **Conclusion-Based (CB)**: Majority vote directly on P3.  

  ---

  ### **Timeline (75-Minute Session)**  
  **Total Activity Time: 15–20 minutes**  

  | Phase             | Time     | Steps                                                                 |
  |-------------------|----------|-----------------------------------------------------------------------|
  | **Setup**         | 2 min    | Distribute ballots. 5 random students get expertise envelopes (kept sealed). |
  | **Private Voting**| 3 min    | Students vote privately on P1, P2, P3. Collect ballots.              |
  | **Initial Aggregation** | 3 min | Tally votes *without weights*. Apply: <br> - **PB**: Majority P1 + Majority P2 → Derive P3. <br> - **CB**: Majority P3. Announce results. *Example contradiction:* <br> PB → Adopt (P1=T, P2=F) vs. CB → Reject (P3=F). |
  | **Asymmetry Injection** | 7 min | **Step 1:** Group *must* choose PB or CB *before* opening envelopes. <br> **Step 2:** Open envelopes. Apply weights to P1 votes (experts count ×2). <br> **Step 3:** Re-tally with weights: <br> - If PB chosen: Weighted PB result vs. *unweighted* CB result. <br> - If CB chosen: *Unweighted* CB result vs. *weighted* PB result. |
  | **Reveal Trade-off** | 1 min   | Show: **Weighted PB** and **Unweighted CB** yield *opposite outcomes** (e.g., PB=Adopt, CB=Reject). |

  ---

  ### **Debrief (15 Minutes)**  
  Map stages to the discursive dilemma:  

  | Stage                     | Formal Structure                          | Philosophical Tension                          |
  |---------------------------|-------------------------------------------|-----------------------------------------------|
  | **Private Voting**        | Individual judgments on {P1, P2, P3}.     | Universal domain: All logically possible judgments permitted. |
  | **Initial Aggregation**   | PB vs. CB → Contradictory outcomes.       | **Dilemma 1**: No rule satisfies: <br> - *Logical consistency* (PB respects P1/P2/P3 link). <br> - *Systematicity* (CB treats P3 independently). |
  | **Expertise Asymmetry**   | Weighted PB vs. Unweighted CB → Opposite outcomes. | **Dilemma 2**: Trade-off between: <br> - *Epistemic rationality* (weighting P1 expertise). <br> - *Democratic equality* (unweighted CB). |
  | **Rule Choice Under Ignorance** | Group picks rule without knowing weights. | **Impossibility**: Aggregation rules cannot jointly ensure consistency, fairness, and truth-tracking. |

  ---

  ### **Honest Limitations**  
  - **Unreproduced Feature**: The activity *cannot* show the **general impossibility theorem** (e.g., List-Pettit). It illustrates a *single* profile where rules conflict but does not prove that *all* aggregation rules fail in *all* cases.  
  - **Predictable Failure Mode (First Run)**:  
    - Students may **disclose expertise prematurely**, breaking asymmetry. Mitigation: Enforce penalty (exclude votes) to incentivize secrecy.  
    - Votes may **not yield initial PB/CB contradiction** (≈40% chance). Workaround: Use pre-set votes if needed, or highlight hypothetical: "Suppose votes *had* split this way..."  

  ---

  ### **Instructor Notes**  
  - **Vote Engineering (If Needed)**: Pre-set ballots for 5-3-2 split:  
    - 5 votes: P1=T, P2=F → **P3=T** (Adopt)  
    - 3 votes: P1=F, P2=T → **P3=F** (Reject)  
    - 2 votes: P1=T, P2=T → **P3=F** (Reject)  
    → **PB**: P1=T (7/10), P2=F (5/10? *Tie!* → Flip coin → Assume F). ∴ Adopt (T ∧ ¬F).  
    → **CB**: P3=F (5/10? *Tie!* → Flip coin → Assume F). ∴ Reject.  
    → **Contradiction achieved**.  
  - **Weighted Flip**: Assign experts to 3× "P1=T, P2=T" and 2× "P1=F, P2=T". Weighted P1 becomes F (experts boost F votes), so PB → Reject. Unweighted CB still → Reject? *Adjust votes*: Ensure weighted PB flips to *opposite* of unweighted CB.  
  - **Key Insight**: The dilemma forces choice between **procedural fairness** (CB) and **outcome coherence** (PB)—a core tension in social epistemology.  

  By embedding expertise asymmetry, the game mirrors real-world trade-offs in climate governance (e.g., IPCC authority vs. community voice). The debrief primes students to formalize the dilemma as a failure of "aggregation functions" to preserve individual rationality at the collective level.
