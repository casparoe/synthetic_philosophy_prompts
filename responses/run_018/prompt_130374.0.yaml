  ## Mnemonic Sovereignty vs. Documentary Correction: Refractive Commemoration and the Normative Stakes of Memory

  This comparison centers on the tension between the authority of living memory and historical evidence, particularly through the lens of **refractive commemoration** – where communal remembrance actively reshapes the causal and moral significance of the past to sustain vital present social bonds and identity.

  **Core Theses:**

  1.  **Mnemonic Sovereignty:** A community's living collective memory holds *normative authority* over archival records when they diverge. The function and meaning of memory in constituting and sustaining the community in the present takes precedence over strict factual correspondence to the documented past.
  2.  **Documentary Correction:** Historiographical evidence (archives, critical analysis) must *always* supersede communal remembrance when they diverge. The goal is the most accurate possible reconstruction of the past based on evidence, regardless of its impact on present identities.

  **Refractive Commemoration: The Crucial Test Case**

  Refractive commemoration isn't simple forgetting or error; it's an active, often ritualized, process of meaning-making. Examples include:
  *   A traumatic defeat remembered as a noble sacrifice forging national unity.
  *   A complex historical figure (e.g., a founding leader with deep flaws) remembered solely through a heroic, simplified narrative central to group identity.
  *   An event involving historical injustice reinterpreted to emphasize resilience and overcoming, minimizing perpetrator responsibility or victim suffering.

  The key characteristic is that **correcting the factual record (e.g., revealing the defeat was avoidable, the leader was corrupt, or the suffering was immense and unaddressed) would actively dissolve a practice constitutive of the community's *current* identity and social cohesion.** The commemoration isn't just *about* the past; it's a vital *present* social glue.

  **Accommodating Constitutive Divergence:**

  *   **Mnemonic Sovereignty Explicitly Accommodates It:** This thesis is *built* on the premise that collective memory's primary function is not archival fidelity but *present identity formation and social cohesion*. Refractive commemoration is a prime example of this function in action. Sovereignty argues that when memory diverges to create or sustain necessary social bonds and a shared sense of self, this divergence is not an "epistemic failure" to be corrected, but a *legitimate constitutive element* of the community. The normative authority lies precisely in its *effectiveness* for the living community, not its correspondence to inert documents. Correcting it would be an attack on the community's self-understanding and social fabric.
  *   **Documentary Correction Compelled to Reject It:** This thesis views *any* divergence between collective memory and the best historical evidence as an "epistemic failure" – a "malfunction" in the community's understanding of the past. Its core normative commitment is to *truth* defined as evidentiary accuracy. Refractive commemoration, no matter how socially beneficial or identity-constituting, is seen as fundamentally *incorrect* and therefore in need of correction. The social goods it provides are secondary, or even illegitimate if built on falsehood. The thesis is compelled to treat all divergence as correctable, viewing the dissolution of identity-constituting practices based on error as a necessary, if painful, step towards historical truth and potentially a more honest foundation for future identity.

  **Normative Stakes:**

  1.  **Mnemonic Sovereignty & Epistemic Relativism:**
      *   **Risk:** Granting sovereignty *does* entail a significant degree of epistemic relativism *regarding the normative authority* of memory *for the community itself*. It says, effectively, "For the purpose of sustaining *this* community's identity and bonds, *this* version of the past, even if empirically inaccurate in parts, holds authority *over* the archival record." Truth becomes contingent on its social function *within* the group.
      *   **Mitigation/Argument:** Proponents argue this isn't blanket relativism. Sovereignty applies *specifically* to the *normative authority for communal self-constitution*, not to historical scholarship or universal claims about "what happened." They might argue historical "truth" exists objectively *but* its functional significance for a living community is distinct and deserves normative weight. It prioritizes the *meaning* of the past for the present community over its pure reconstruction.

  2.  **Documentary Correction & Destruction of Social Goods:**
      *   **Risk:** Strict adherence *absolutely* risks destroying socially vital goods sustained by erroneous remembrance. Refractive commemoration often provides meaning, cohesion, resilience, and a sense of shared purpose. Correcting it can shatter foundational myths, create existential uncertainty, foster division, and erase sources of collective strength, potentially leading to social fragmentation or nihilism. It privileges abstract historical accuracy over lived social reality.
      *   **Mitigation/Argument:** Proponents argue that social goods built on falsehoods are ultimately fragile and ethically compromised. While correction may be destabilizing, it allows for a more authentic identity formation based on truth, potentially leading to stronger, more resilient communities in the long run. They prioritize the moral imperative of truth-telling and preventing the harms of historical distortion (e.g., masking injustice, enabling harmful ideologies).

  **Conclusion:**

  The confrontation over **refractive commemoration** starkly reveals the fundamental divergence between these theses:

  *   **Mnemonic Sovereignty** uniquely accommodates the possibility that historical divergences can be legitimate, constitutive elements of communal identity. It prioritizes the present social function and meaning of the past for the living community, accepting the risk of epistemic relativism regarding normative authority *within* that community to preserve vital social goods.
  *   **Documentary Correction** is compelled to treat *all* divergence, including refractive commemoration, as an epistemic malfunction requiring correction. It prioritizes historical accuracy as defined by evidence and critical scholarship, accepting the risk of destroying identity-constituting practices and the social goods they sustain in the name of truth and the potential for a more authentic future.

  Neither position escapes significant normative costs. Sovereignty risks legitimizing harmful myths and relativizing history; Correction risks inflicting social trauma in the name of an abstract truth that may not readily provide new meaning. The choice ultimately hinges on whether one prioritizes the *cohesive function* of memory for present communities, even if empirically flawed (Sovereignty), or the *evidentiary accuracy* of the past as the paramount ethical and epistemological imperative, regardless of social consequences (Correction). Refractive commemoration forces this difficult choice into sharp relief.
