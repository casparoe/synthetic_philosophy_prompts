prompt: |-
  Hey — I run the research team at an international health NGO. Several times a year we write an interview guide or survey module in English, our field staff translate it into about a dozen languages, and then we compare the answers across countries and move real money around based on the differences. I've started to worry that a good chunk of what we read as "people in country X care less about Y" is really an artifact of what their language makes easy or hard to say.

  Where I've landed on the theory: the strong Sapir–Whorf thing (language determines what you can even think) looks dead, but some weaker version seems hard to deny — that a language shapes what you're *obliged* to encode in order to say anything at all, what sits on the tip of your tongue, and what takes a whole clause to get across. (There's an idea I half-remember, Slobin I think, that the effect is mostly on what you have to work out while you're speaking rather than on thought in general.)

  Here's what I want: turn that into a procedure my team can run on an item before we field it. Concretely — we have no budget for ethnography, our country leads are smart but have no linguistics training, sign-off is the country director, and usually I have a day or two, not a month. So: the questions in order, what counts as a good enough answer to each, where the procedure stops with a "don't field this cross-nationally," and where it has to hand the decision to a person because it's a values call rather than a factual one.

  Some things I specifically want in it:

  My stab at the key distinction is three-way: does the language *force* you to mark the distinction every time you open your mouth (grammatically), does it just make it *cheap* — one ready-made word, easy to reach for — or is it merely *unsayable* without a whole clause or a loan word? Fix that if it's wrong.

  For my purposes I genuinely don't care whether an effect is reshaping thought or only reshaping what people say when you put a question to them, since either one wrecks a cross-country comparison. Tell me if that's a mistake and it matters which it is.

  I also want a step where we write down, *before* seeing any data, which direction the language should push the answer and roughly how much — if we can't say which way, we shouldn't use the item. And for anything big enough to move money, some kind of non-verbal or behavioural cross-check of the same construct.

  Then run it on three of our actual items:

  1. A confidence question: "How confident are you that the clinic will be open next time you go," scored 1–5. In one of our languages, when you talk about a future or past event you have to grammatically mark whether you saw it yourself, were told it, or inferred it — evidentiality, I think it's called. Respondents there score consistently low and the country team reads that as "they don't trust us."

  2. A wayfinding question: we ask people to describe the route they took to the clinic and where they'd put a sign, and we code the answers for spatial detail. At one site the language doesn't really have a way to say "to the left of the door" without using cardinal directions — people say north-side and so on as a matter of course, even indoors. Our coding scheme was built for left/right answers, so those responses look vague to us.

  3. The one I won't like: our flagship "trust in the health system" battery, which our regional strategy and the last two board reports are built on. In two of our languages the nearest natural word to "trust" isn't about institutions at all — it's about a particular person you have a relationship with, or it's bound up with reciprocity and exchange. So low scores there may mean something entirely different. Run the procedure on this and tell me what it says even if it says I have to stop reporting a comparison I've been reporting for two years.

  Also give me at least one item where the honest output is "this is fine, field it as is," so I know the procedure isn't just a no-machine. And tell me plainly what it can't do.

  On confidence: be clear about what's settled among people who actually work on this versus what they're still fighting about. I've gathered that some of the famous experiments in this area have had replication trouble, and I don't want to build a step on one of those and find out a year later. If any step rests on a contested result, flag it and say what breaks if the result is false — and don't soften it if the honest verdict is that the weak version I've committed to is itself less secure than I think. No citations or further reading, I have no library access out here and won't chase them. American English, please.
reasoning: |-
  Okay, the user runs a research team at an international health NGO and is concerned about linguistic biases affecting their cross-country surveys. Their main worry is that differences in survey responses might be due to language structures rather than actual attitudes, leading to misallocated funds. 

  First, I need to unpack their core problem: they need a practical, time-bound procedure to flag linguistically problematic survey items. Their constraints are clear—no budget for ethnography, country leads without linguistics training, quick turnaround times. They’ve already done some thinking about linguistic relativity (weak Sapir-Whorf) and mentioned Slobin’s "thinking for speaking" hypothesis, which aligns with their focus on what language forces speakers to encode during speech. 

  Their three-way distinction (grammatically forced, cheap, or costly to express) seems solid for their purpose. They’re right that for their needs, it doesn’t matter if language shapes thought or just speech—either distorts comparisons. The key is pragmatism: catching issues before fieldwork. 

  Now, the requested procedure must be bullet-point simple. I’ll structure it as a flowchart-like checklist with clear stopping points. The "directional prediction" step is crucial—if they can’t predict how language might skew answers, the item is too risky. For high-stakes items, they’ll need behavioral cross-checks, which might be tough given their constraints but non-negotiable for things like their flagship trust metric. 

  Testing the procedure on their examples:  
  - **Confidence question**: The evidentiality marking in one language likely forces respondents to specify knowledge source, making low scores an artifact. The procedure flags this as "stop comparing."  
  - **Wayfinding question**: The cardinal directions vs. left/right issue isn’t a dealbreaker if they adapt coding. "Fix and proceed."  
  - **Trust battery**: Here’s the painful one. If "trust" maps to personal relationships in some languages, comparisons are invalid. The procedure would halt this—brutal but necessary.  

  They also need a "safe" example to prove the tool isn’t just a veto machine. Something like a yes/no factual question ("Did you visit the clinic?") would pass easily since it’s translation-stable.  

  Finally, I should flag shaky ground: Evidentiality’s impact on certainty judgments is debated (replication issues in some studies). If it’s overblown, their confidence-question fix might be overkill—but better safe than sorry. The weak Sapir-Whorf stance itself isn’t rock-solid, but their approach doesn’t hinge on strong claims.  

  Honest limitations: The procedure can’t catch everything—nuanced cultural concepts beyond grammar, or languages the team doesn’t vet. And it relies on country leads’ intuitions, which might miss subtleties. But it’s vastly better than nothing.
answer: |-
  Here's a pragmatic procedure based on your constraints and theory, designed to flag linguistic traps *before* fielding. It focuses on **translatability effects** (what the language forces, makes cheap, or makes costly to express), not deep cognitive effects, as you rightly note either can wreck comparison.

  **Your Core Distinction is Correct & Actionable:**
  *   **Forced:** Grammatical requirement (e.g., evidentiality markers, grammatical gender, tense/aspect systems). *Must be marked to form a grammatical sentence.*
  *   **Cheap:** Easily accessible, common word or short phrase (e.g., English "trust", cardinal directions if habitual).
  *   **Costly:** Requires circumlocution, loanword, or feels unnatural/awkward (e.g., explaining "left" using cardinal directions indoors, translating a concept like "accountability" where no direct equivalent exists).

  **The Procedure: For Each Survey Item & Key Concepts Within It**

  1.  **Identify Core Concepts:** Break down the item. What specific concepts *must* be communicated for the question to work? (e.g., For "How confident...": *confidence*, *future event* ("will be open"), *specific location/time* ("clinic", "next time you go"). For "trust": *trust*, *health system*).
  2.  **Country Lead Check (Per Language):** Task Country Leads (CLs) - *in their native language* - with answering:
      *   **Forced:** "Does your language *require* speakers to mark any distinction related to this concept just to say a simple sentence involving it? (e.g., Do you *have* to say how you know something when talking about the future clinic being open?)" *[If YES - Major Red Flag]*
      *   **Cheap:** "Is there a single, common, natural word or very short phrase (max 2-3 words) in your language that captures this core concept precisely? (e.g., Is there a common word for 'confidence' meaning belief something *will* happen? For 'left' relative to an object?)" *[If NO - Red Flag]*
      *   **Costly:** "If there isn't one common word/phrase, how *would* you naturally express this? Is it a long explanation, an awkward phrase, or a borrowed foreign word?" *[If YES - Yellow Flag]*
      *   **Naturalness Test:** "Read the translated question aloud. Does it sound like something a normal person would actually say in a conversation, or does it sound like a survey/questionnaire?" *[If "sounds like a survey" - Yellow/Red Flag]*
  3.  **Directional Prediction (Your Team):** *Before seeing CL responses*, for each core concept, predict:
      *   **Direction:** Based on linguistic knowledge/CL hints from previous work, how *might* the forced/cheap/costly aspect in a specific language systematically bias responses *compared to English*? (e.g., "Language X forces evidential marking → likely lower 'confidence' scores because direct knowledge is rare for future events").
      *   **Magnitude Guess:** Roughly how big an effect could this be? (Trivial, Noticeable, Large?). *If you cannot predict a direction ("Could bias high OR low"), the item is TOO RISKY for cross-national comparison. Stop. Revise or drop.*
  4.  **Synthesize & Decide (Your Team + CL Input):**
      *   **Forced Marking Present?** → **STOP.** Do not field cross-nationally. (e.g., Evidentiality on confidence). *Unfixable for direct comparison.*
      *   **Core Concept Not Cheap?** (No natural word/phrase) → **STOP or MAJOR REVISION NEEDED.** (e.g., "Trust" mismatch). Requires fundamental reconceptualization.
      *   **Costly Expression?** → **YELLOW FLAG.** Proceed with extreme caution. Requires:
          *   **Adaptation:** Can the question be rephrased to avoid the costly concept *without changing meaning*? (e.g., For wayfinding: "When facing the door, which hand side would you put it on?" - though this may still be odd).
          *   **Coding Adjustment:** Can your analysis plan handle the different *form* of the answer? (e.g., Accept/code cardinal directions for spatial detail).
      *   **All Clear?** → **GREEN LIGHT.** Field as is.
  5.  **High-Stakes Cross-Check (For items driving major funding decisions):**
      *   **Mandatory:** If an item passes but involves complex, culturally loaded, or potentially costly concepts (like "trust"), you MUST design a simple, non-verbal, or behavioral measure of the *same underlying construct*.
      *   **Examples:** Observe clinic return rates (proxy for confidence/trust). Track actual wayfinding success to a new sign location (proxy for spatial understanding). Count utilization rates (proxy for system trust). *Correlate survey responses with this behavioral measure WITHIN each country/language group.* If the correlation is weak *in the problematic language group*, your survey measure is likely invalid there. *Do not compare the behavioral measure directly across countries either without considering context!* Use it only to validate the survey measure locally.

  **Running Your Items Through the Procedure:**

  1.  **Confidence Question (1-5 scale):**
      *   Core Concepts: Confidence (level), Future Event, Specific Clinic/Time.
      *   **CL Check (Language with Evidentiality):** *Forced:* YES - Must mark source of knowledge when stating future fact. *Cheap:* "Confidence" might exist, but the *entire proposition* is grammatically tied to evidentiality. *Naturalness:* Likely awkward/unusual to state without evidential marking.
      *   **Directional Prediction:** Forces encoding of uncertainty → Likely systematically **lower** scores, especially if direct evidence is impossible (future event). *Magnitude:* **Large**.
      *   **Verdict:** **STOP.** **Do not compare.** Evidential marking is *forced*, fundamentally altering what the question measures vs. English. Low scores are likely an artifact, not low trust. *Behavioral Cross-Check Needed:* Actual return rates to clinic.

  2.  **Wayfinding Question (Describe route, suggest sign placement):**
      *   Core Concept: Spatial description (relative directions: left/right).
      *   **CL Check (Language using Cardinals):** *Forced:* NO (doesn't force *relative* terms). *Cheap:* NO (relative "left/right" not cheap/natural). *Costly:* YES - Requires cardinal directions or awkward description. *Naturalness:* Using cardinals likely sounds normal, describing in relative terms might sound odd.
      *   **Directional Prediction:** Relative directions costly → Responses will use cardinals → **Appear vague** if coding expects "left/right". *Magnitude:* **Noticeable** (affects coding, not necessarily underlying spatial ability).
      *   **Verdict:** **YELLOW FLAG. FIX AND PROCEED.** *Adapt:* Explicitly accept cardinal directions in coding instructions (e.g., "Code 'north-side' as equivalent to 'left of door when facing south'"). *Coding Adjustment:* Essential. Revise coding scheme to capture cardinal responses meaningfully relative to the landmark (door). *Cross-Check:* Observe if people *find* a sign placed based on their description.

  3.  **Trust in Health System Battery:**
      *   Core Concept: "Trust" (in an impersonal institution/system).
      *   **CL Check (Languages with personal/reciprocal terms):** *Forced:* NO. *Cheap:* NO - The most natural word means interpersonal trust/reciprocal obligation, *not* institutional trust. *Costly:* YES - Translating institutional trust requires explanation/circumlocution/awkwardness. *Naturalness:* Using the personal word for a system likely sounds weird/mistranslated; the circumlocution sounds like a survey.
      *   **Directional Prediction:** Natural word implies personal relationship → Using it for a system feels **inauthentic or wrong** → Responses likely **lower/more negative** OR **misinterpreted** (e.g., rating reciprocity, not reliability). *Magnitude:* **Large** (fundamentally different construct).
      *   **Verdict:** **STOP.** **Do not compare.** The core concept "trust" as you mean it (institutional) is *not cheap* and likely *costly* or mapped incorrectly. Scores are measuring something different. This invalidates your cross-country comparison. *Behavioral Cross-Check Needed:* Imperative, but hard. Consider proxies like dispute resolution success, reporting of errors, or composite measures (accessibility + quality perceptions + respect). *You cannot validly report the existing comparison.*

  **The "This is Fine" Example:**

  *   **Item:** "In the last 12 months, have you visited a health clinic for yourself or a child in your care? (Yes/No)"
  *   **Core Concepts:** Occurrence (past event - last 12 months), Action (visited), Location (health clinic), Target (self/child).
  *   **Analysis:** Past tense/time frames, basic actions, common locations, and kinship are near-universal and have cheap translations. No forced grammatical distinctions likely to systematically bias the yes/no answer across languages. Minor clarifications might be needed (define "health clinic"), but the core is robust.
  *   **Verdict:** **GREEN LIGHT.** Field as is.

  **What This Procedure CANNOT Do:**

  1.  **Catch Deep Cultural Nuances:** It focuses on *linguistic expression*. Deep cultural differences in interpreting a concept (even if translated well) are harder to catch this way (e.g., different expectations of "the health system").
  2.  **Guarantee Perfect Validity:** It minimizes a major source of error (linguistic), not all sources (e.g., response biases, social desirability).
  3.  **Replace Deep Ethnography:** For foundational concept development (like defining "trust" locally), this is a band-aid. You still need that deep work eventually for core constructs.
  4.  **Solve All "Costly" Problems:** Sometimes adaptation isn't possible without changing meaning. Sometimes behavioral cross-checks are impractical.
  5.  **Fully Substitute for Linguistic Expertise:** Relies on CL intuition. Tricky cases might slip through or be misjudged.

  **On Confidence & Settled Science:**

  *   **Settled:** Languages *do* vary dramatically in what they force, make cheap, or make costly. Slobin's "Thinking for Speaking" (how language shapes *online* processing during speech) is widely accepted as a key mechanism for these effects. Your three-way distinction is practical and grounded.
  *   **Contested/Messy:** The *magnitude* and *specific cognitive consequences* of these differences are debated. **Crucially for you:** The effect of **evidentiality on certainty judgments** (like your confidence question) is a prime example of contested replication. Some studies show strong effects, others find minimal impact. *Why it matters for your procedure:* If the evidentiality effect is weaker than assumed, flagging it as a "STOP" might be overly cautious. However, because it's *forced* grammar that fundamentally alters the utterance, **the procedure's recommendation (STOP) still holds.** You *cannot* have respondents answering the *same* question when their grammar forces extra information. The *risk* of distortion is high enough to prohibit comparison, even if the exact psychological effect size is uncertain. Your weak version ("shapes what you're obliged to encode") is secure.

  **The Hard Truth on Your Trust Battery:** The procedure says **stop comparing.** It's the right call. The scores in those two languages likely measure something fundamentally different. Reporting them as comparable "trust" is misleading. You need to either:
  a)   Invest in deep local conceptual work to redefine/measure the construct validly in each context (hard, expensive).
  b)   Use different, more translatable/behavioral indicators for those countries in your comparisons.
  c)   Acknowledge the limitation openly and stop making direct numerical comparisons based on that battery for those languages.

  This procedure won't make that easy, but it prevents you from moving "real money" based on potentially serious linguistic artifacts.
