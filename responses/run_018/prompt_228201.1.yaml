prompt: |-
  Pub-quiz philosopher here (the annoying kind, apparently). There's a pattern I've noticed in puzzles about doing infinitely many things in a finite stretch of time, and I want to know if anyone has actually given it a name.

  Three versions I know of. One: the famous lamp that gets flicked on and off, each flick taking half as long as the one before, so infinitely many flicks are done by the two-minute mark — and then everyone argues about whether the lamp is on or off AT two minutes. Two: a bouncing ball where each bounce takes half the time of the previous one, and apparently it just comes to rest at the end, nobody much fussed. Three: a machine that prints the digits of pi, each digit twice as fast as the last, and people tie themselves in knots asking what's on the tape "when it's finished".

  Here's the pattern as I see it. In every case the story painstakingly describes all the infinitely many steps and then just... stops, and the entire arguement takes place in the gap between "everything up to the final moment" and "the final moment itself". The lamp debaters argue as if the end state must somehow be squeezed out of the trend of the flicking. The ball people cheerfully let the end state come from somewhere else entirely (gravity, friction, whatever). The pi machine people get stuck because the trend (digits, forever) seems to positively forbid any final state at all. So the real action looks to me to be the same every time: whether you're allowed, or maybe required, to treat the state at the end as something the process has to settle into, versus something the story simply hasn't told you.

  Is there a name for that gap, or for the assumption that there can't be one? I don't want a general tour of infinity puzzles — I want to know whether this specific thing (the final instant left unspecified while everyone argues as though it weren't) has been carved out as its own concept, and how it differs from nearby ideas. Note it can't just be "the sequence doesn't converge": the ball's positions DO converge and the lamp's on-off states don't, yet the ball case feels unpuzzling and the lamp case feels impossible, so convergence alone isn't doing the work. If there genuinely is no name, coin one, define it properly, and give me a couple of borderline cases it should and shouldn't cover so I can see the edges.

  Lead with your bottom line in the first sentence — either "yes, it's called X" or "no name exists, here's my coinage" — then the reasoning. No preamble, and don't restate the question back at me.
reasoning: |-
  Hmm, the user is a pub-quiz philosopher who's noticed a pattern in infinity puzzles involving processes that complete infinitely many actions in finite time, where the final state at the exact endpoint isn't specified. They want to know if there's a name for this specific gap where arguments happen between "everything before the final moment" and "at the final moment itself."

  I see they're pointing out three examples: the Thompson lamp paradox (where on/off states don't converge), the bouncing ball (whose positions do converge to rest), and the pi machine (which has no convergent output). The key insight is that in all cases, the description meticulously details the infinite steps but leaves the final instant undefined, and debates arise from whether we should infer the end state from the trend or accept it as unspecified.

  The user emphasizes that convergence alone doesn't resolve the issue—the lamp is controversial despite no convergence, while the ball is uncontroversial with convergence—so the core issue is the narrative gap itself. They want a focused answer: either an existing name for this gap/assumption or a newly coined term, with clear boundaries.

  I recall that in mathematics, this relates to the difference between the limit of a sequence and the value at the limit point. For the lamp, the sequence of states has no limit, so the final state is undefined by the process. For the ball, the position sequence converges, so we can define the end state via the limit. The pi machine is trickier because the sequence of outputs doesn't converge to a single state.

  But is there a specific name for this gap? I'm not aware of one in philosophical or mathematical literature. Terms like "supertask" describe the infinite process, but not the specification gap. "Limit point ambiguity" might be close, but it's not standard. Perhaps the user is describing the assumption that the process must determine the end state, which could be called the "continuity assumption" or "limit assumption," but even that isn't quite it.

  Given that, I'll coin a term: "the completion gap" for the unspecified final instant, and "completion determinism" for the assumption that the end state must be determined by the process. I need to define it properly and provide borderline cases to test it.

  For the definition: The completion gap is the disconnect between the description of a supertask up to but not including the completion time and the state at that exact time. Completion determinism is the expectation that the end state must logically follow from the supertask's trend.

  Borderline cases: It should cover scenarios like the lamp and pi machine where the gap leads to debate. It shouldn't cover cases where the end state is explicitly defined (e.g., Achilles catching the tortoise) or where the process doesn't complete in finite time (e.g., infinite past). Also, it should exclude cases where convergence resolves the gap, like the ball.

  So, my answer will start with "no name exists," then introduce the coinage, explain it, and give examples to clarify the edges.
answer: |-
  No name exists; I coin **completion gap** for the unspecified final instant, and **completion determinism** for the assumption that the end state must be determined by the supertask's trend.  

  The **completion gap** is the disconnect between (a) a supertask's defined states/actions at all times *before* a finite completion moment \( t^* \) and (b) the state *at* \( t^* \) itself, which the description omits. Arguments arise from **completion determinism**: the imposition of an expectation that the state at \( t^* \) must be a "limit" or "result" of the pre-\( t^* \) process, even when the process lacks a convergent trend or the description provides no such rule.  

  ### Key distinctions:  
  - **Why convergence isn't sufficient**: The ball's position sequence converges (so we *define* its end state via the limit), while the lamp's on/off states oscillate without convergence (leaving the end state undefined by the process). The gap is *exploited* when completion determinism is applied inconsistently: the ball's rest state is uncontroversial because we accept external physics, but the lamp's state is disputed because we demand internal consistency from the flicking trend. The pi machine intensifies this—its digit sequence has no terminal state, so completion determinism forces an impossible "output at infinity."  
  - **How this differs from nearby concepts**:  
    - Vs. **supertask**: A supertask is the infinite process itself; the completion gap is the *temporal/logical fissure* at its endpoint.  
    - Vs. **limit ordinal** (e.g., ω in transfinite sequences): This is a mathematical model for "stages beyond all finite steps," but it doesn't capture the *narrative omission* or the *argumentative imposition* of determinism.  
    - Vs. **indeterminism**: This is broader; the gap specifically concerns the *endpoint* of a completed infinite sequence.  

  ### Borderline cases for the concept:  
  **Should cover**:  
  1. **Thompson's lamp**: Completion gap enables debates because on/off states diverge, yet completion determinism demands a "final" state.  
  2. **Pi machine**: Gap is explicit (no digit at \( t^* \)), but completion determinism expects a "completed pi," creating paradox.  
  3. **Zeno's dichotomy (modern variant)**: If Achilles runs half-distances in halving times, the gap is at the finish line; completion determinism might wrongly insist he never arrives, ignoring external resolution (e.g., he touches the goal).  

  **Should NOT cover**:  
  1. **Achilles and the Tortoise (standard)**: The supertask isn't completed in finite time; it describes an infinite approach *without* a specified endpoint. No completion gap exists.  
  2. **Convergent processes with defined limits**: E.g., filling a vase with balls: if ball additions converge to empty (as in Ross-Littlewood), the end state *is* specified by the limit, so arguments stem from counterintuition, not a gap.  
  3. **Infinite past**: No finite completion moment \( t^* \), so no gap to argue over.  

  **Bottom line**: The **completion gap** is the undefined terminal point; **completion determinism** is the (often misplaced) insistence that the supertask must settle it. This framework isolates why some puzzles (lamp, pi) breed paradox while others (ball) dissolve: when convergence aligns with external reality, determinism resolves the gap; when not, it inflames it.
