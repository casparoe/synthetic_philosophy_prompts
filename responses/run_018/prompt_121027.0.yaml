answer: |-
  ### Exam Question  
  **Adam Smith’s *Theory of Moral Sentiments* centers sympathy and the impartial spectator as foundations of moral judgment. Using the following case, explain Smith’s framework and its philosophical significance:**  

  > *A merchant learns of a distant stranger facing life-threatening hardship. Rescuing the stranger would require sacrificing capital earmarked for his children’s education. The merchant refuses, prioritizing his children’s future.*  

  **Address these points:**  
  1. Would Smith’s impartial spectator *approve* of the merchant’s refusal? Why or why not?  
  2. How does our *direct sympathy* for the stranger’s suffering interact with the spectator’s judgment?  
  3. What does this reveal about the distinction between *sympathy* (fellow-feeling) and *moral approval* for Smith?  
  4. Why is the impartial spectator *not* merely an internalized social mirror or a Kantian universal lawgiver?  
  5. How does Smith justify *partiality* toward family (here, the children) without endorsing egoism or conventionalism?  

  **Your essay must engage Smith’s core mechanisms: propriety of motives, the "double sympathy" structure, and the spectator’s normative role.**  

  ---

  ### Model Answer (Approx. 600 words)  

  Smith’s impartial spectator would likely **approve** of the merchant’s refusal, but *only if* the merchant’s motives demonstrate **propriety**. Smith’s moral judgment hinges not on outcomes (e.g., the stranger’s suffering) but on whether the agent’s sentiments *fit* their cause (*TMS* I.i.3). Here, the merchant acts from a "natural" partiality toward his children—a motive spectators recognize as proper within bounds. Sympathizing with the merchant, we understand his prioritization as arising from parental duty, not malice or indifference. Crucially, approval depends on whether a *disinterested* spectator would concur that the merchant’s motives align with what any reasonable person might feel in his position. If the sacrifice would ruin his children’s prospects for a stranger with no prior claim, spectators likely deem his refusal proportionate.  

  Our **direct sympathy for the stranger** creates tension but does not override approval. Smith distinguishes sympathy (feeling *with* another) from moral judgment. We naturally feel distress for the stranger’s plight—this is primary sympathy. However, moral approval requires **"double sympathy"**: we must also sympathize with the *agent’s motives* (*TMS* I.i.5). We might pity the stranger while simultaneously approving the merchant’s prioritization because his motives (securing his children’s future) are "suitable" to their object. Sympathy for the victim is raw sentiment; approval is a calibrated judgment of the agent’s responsiveness to *all* claims.  

  This case illuminates Smith’s core distinction: **sympathy ≠ moral approval**. Sympathy is pre-moral fellow-feeling, while approval is a normative judgment about the *propriety* of motives. The merchant’s refusal may cause pain (eliciting sympathy), yet spectators approve because his motives exhibit "the rules of proportion" (*TMS* VI.ii.1). Smith rejects utilitarianism because we approve of actions *before* knowing their outcomes—we judge the *intention’s* fitness. The spectator approves here not because happiness is maximized (the stranger suffers terribly), but because the merchant’s partiality is *properly bounded* by his role as a parent.  

  The impartial spectator is **not a social mirror or Kantian lawgiver**. Unlike a passive internalization of social norms, the spectator *corrects* biased sentiments. Society might condemn the merchant as callous, but the spectator scrutinizes whether society’s anger is itself proportionate (*TMS* III.4). Unlike Kant, Smith’s spectator does not appeal to abstract duty but to situated emotional propriety. It asks: "Would an impartial person, knowing *all* circumstances, *share* the merchant’s prioritization?" This requires no categorical imperative—only empathetic engagement with context.  

  Smith justifies **partiality without egoism/conventionalism** by anchoring it in propriety. Natural affections (e.g., parental love) are morally laudable *when exercised proportionally* (*TMS* VI.ii.1). Prioritizing one’s children over a distant stranger is proper; neglecting a neighbor in immediate peril to fund a child’s luxury might not be. The spectator allows partiality only within bounds set by what an impartial observer would deem "reasonable." This avoids egoism because the merchant’s motive is *relational* (duty to children), not self-interest. It avoids conventionalism because the spectator can condemn societal norms that demand excessive self-sacrifice.  

  **Conclusion**: The case reveals Smith’s anti-utilitarian framework. Approval stems from the *propriety* of motives, not consequences. Double sympathy separates moral judgment from raw feeling, the spectator provides a dynamic normative standard beyond social opinion, and bounded partiality reflects human nature without reducing morality to selfishness or conformity.  

  ---  

  ### Marking Scheme  

  **A-Grade Answer (85-100%) Must Demonstrate:**  
  1. **Precise Propriety Focus**: Explicitly grounds approval in the *fitness of motives* (merchant’s parental duty), not outcomes.  
  2. **Double Sympathy Mechanism**: Clearly distinguishes (a) sympathy *for the stranger’s suffering* from (b) sympathy *with the merchant’s motives* as the basis for approval.  
  3. **Sympathy vs. Approval Distinction**: States that sympathy is necessary but *insufficient* for approval; approval requires judging motive-propriety.  
  4. **Spectator’s Normative Role**: Explains how the spectator *corrects* both personal bias and social opinion ("mirror") through impartial perspective-taking. Contrasts with Kant (no deontology) and Hume (no utility focus).  
  5. **Bounded Partiality**: Shows Smith permits partiality *only* within limits of proportionality (e.g., "Would spectator approve ignoring a *drowning child* for tuition?"). Rejects egoism by emphasizing relational duties.  

  **B-Grade Answer (70-84%)**:  
  - Correctly identifies spectator’s approval but conflates propriety with outcomes/social norms.  
  - Mentions sympathy/approval distinction but lacks "double sympathy" structure.  
  - Adequately contrasts spectator with Kant/Hume but undersells its *active corrective* function.  
  - Notes partiality but doesn’t explain *how* propriety bounds it (risks egoism/conventionalism).  

  **Common Mistakes (Mark Deductions)**:  
  - **Utilitarian Reduction**: Arguing approval depends on "greater happiness" (e.g., children’s education > stranger’s life). *[-15%]*  
  - **Sympathy = Approval**: Claiming we disapprove *because* we sympathize with the stranger. *[-10%]*  
  - **Spectator as Social Mirror**: Treating the spectator as passive conformity to community norms. *[-10%]*  
  - **Oversimplified Partiality**: Portraying Smith as endorsing *any* familial preference (ignoring proportionality). *[-10%]*  
  - **Ignoring Double Sympathy**: Collapsing judgment into a single sympathy response. *[-10%]*  

  ---  
  **Rationale**: This prompt forces engagement with Smith’s unique mechanisms (propriety, double sympathy) while precluding stock summaries. The case study demands application, and the sub-questions target key anti-utilitarian, anti-Kantian, and anti-egoist features of TMS. The marking scheme rewards granular textual understanding without requiring memorized citations.**
