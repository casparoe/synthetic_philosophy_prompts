prompt: |-
  I'm running a philosophy reading group for second-years who all claim they "got" Gettier in intro because they memorized the ten-coins job story. I want to shatter that false confidence without just repeating Smith/Jones. I'm toying with a nested-testimony case — a student believes some theorem is false because her adviser told her so, but the adviser only believes it because of a Gettiered calculation error that's accidentally correct, and the student has zero clue — but I'm worried it collapses into a closure problem or a fake-barn situation. Plan the session's arc: what idea has to be firmly in place before they can see why justification can be present yet still fail to deliver knowledge (not just "they got lucky"), then the specific carrying case to build everythign around — tell me exactly what properties it needs and what it must lack so it doesn't drift into environmental-luck territory. Map the misconceptions they'll arive with in order: probably "checking more would fix it," "justification is just strong belief," and "the whole problem is false premises." For each one, say exactly where in the sequence to kill it. Give me one end question that proves they've grasped the structural gap rather than just retelling the story. Also tell me which chunk of the post-Gettier literature — reliabilism, virtue epistemology, safety conditions — I should flat-out refuse to explain at this level and how to deflect it without sounding dismissive. Don't ask for a bibliography; they can't go look up Nozick or whatever anyway.
