answer: |-
  ## Desiderata for Personal Persistence Through Gradual Mind Uploading & Substrate Replacement

  The following requirements define what any adequate theory must address to coherently explain personal identity survival through gradual neural replacement or mind uploading. They arise from core philosophical puzzles and empirical constraints.

  ### Core Desiderata

  1.  **The Gradual/Instantaneous Distinction (Non-Negotiable):**
      *   **Requirement:** The theory *must* provide a principled reason why gradual, continuous neuron-by-neuron replacement (where biological neurons are swapped 1:1 with functionally identical synthetic analogues while maintaining real-time causal integration and consciousness) preserves identity, while instantaneous destructive scanning/uploading (where the biological brain is destroyed and a copy is activated elsewhere based on a snapshot) does *not* necessarily preserve identity, or at best creates a distinct but psychologically continuous person.
      *   **Motivation:** Intuition strongly suggests a difference: the gradual process feels like "me" continuously, while the destructive copy feels like creating a twin. Theories collapsing this distinction fail to capture the fundamental role of *continuous causal grounding* in persistence. Instantaneous copying introduces a causal break; gradual replacement aims for causal continuity.

  2.  **Intermittent Reversibility & Liminal States (Non-Negotiable):**
      *   **Requirement:** The theory must define the status of the subject during a rollback (e.g., from 40% synthetic back to fully biological without data/functional loss). Is the subject singular throughout? Does rollback cause fission (the biological rollback and the synthetic components representing distinct entities)? Or is there a genuinely liminal state where identity is non-binary or distributed? Critically, the theory must state whether identity survives the *round-trip* (e.g., up to 40% synthetic, rolled back, then uploaded again later).
      *   **Motivation:** This tests the theory's commitment to particular persistence conditions (e.g., biological continuity vs. psychological connectedness) and its ability to handle hybrid/reversible systems without arbitrary thresholds. Surviving the round-trip challenges theories requiring permanent biological continuity.

  3.  **Integration of Extended Cognitive Scaffolding (Non-Negotiable):**
      *   **Requirement:** The theory must incorporate pre-existing, deeply integrated external digital cognitive components (e.g., seamless memory prosthetics, real-time calculation aids) as *part* of the identity-bearing cognitive system *before* internal replacement begins. It must explain how the boundary of the "self" extends beyond the skull consistently, and how this external scaffolding contributes to continuity once *internal* substrate replacement commences. It cannot arbitrarily contract the self-boundary to the biological brain at the onset of internal replacement.
      *   **Motivation:** Directly motivated by the Extended Mind Thesis (EMT). If external tools are constitutive of cognition pre-replacement, excluding them *only* when discussing identity during internal replacement is ad hoc and inconsistent. The theory must respect cognitive integration, not location.

  4.  **Branching at Intermediate Stages (Non-Negotiable):**
      *   **Requirement:** If high-fidelity backup snapshots exist at points during the gradual replacement process (e.g., 20%, 50%, 80%), the theory must provide a non-arbitrary criterion for why the continuously forward-moving stream (the "original" undergoing replacement) is identical to the pre-replacement person, while the activated backup snapshot (even if identical in state at t=activation) is at best a duplicate or successor, not the original. It must avoid reliance solely on qualitative similarity or functional equivalence.
      *   **Motivation:** Highlights the core problem of duplication/fission for psychological continuity theories. If identity is grounded *only* in psychological states/contents, backups become equally valid claimants. The theory must provide a criterion (e.g., unique causal history, spatiotemporal continuity of process) that privileges the continuous stream over qualitatively identical copies.

  5.  **Phenomenal Binding Continuity (Non-Negotiable):**
      *   **Requirement:** The theory must address the continuity of unified subjective experience (phenomenal binding). It must specify whether a *temporary* fragmentation or gap in unified phenomenal experience (e.g., during a brief period of distributed processing across biological/synthetic substrates before full reintegration) constitutes a break in identity-preserving continuity, or if functional continuity alone suffices. Crucially, it must provide a principled way to distinguish a *loss of identity* due to binding failure from a mere *functional interruption* that is survived.
      *   **Motivation:** Subjective experience is central to personhood. Neuroscience shows binding is a dynamic process susceptible to disruption (e.g., split-brain, certain anesthetics). A theory ignoring phenomenal unity risks reducing identity to a functional zombie. It must account for the potential fragility of the "I" during substrate transition.

  6.  **Preservation of Key Distinctions (Non-Negotiable):**
      *   **Requirement:** The theory must rigorously maintain the distinctions between:
          *   **Strict Numerical Identity** (being the *very same* entity) vs. **Strong Psychological Continuity** (high-fidelity causal connection of mental states).
          *   **Survival** (the continued existence of *me*) vs. **Flourishing** (a successor being happy and psychologically similar).
          *   **The Original Biological Organism** (a specific biological entity persisting through time) vs. **A Functionally Equivalent Successor System** (a distinct entity replicating the original's psychology/function).
      *   **Motivation:** Collapsing these distinctions leads to conceptual confusion and counterintuitive results (e.g., implying that creating a perfect copy *is* me, or that the biological organism is irrelevant once function is replicated). A robust theory must clarify what constitutes survival *as me*, not just the emergence of something psychologically similar.

  ### Constraints & Potential Conflicts

  *   **Neuroscientific Constraints:** The theory must respect:
      *   **Neural Plasticity:** Brains are not static circuits; function can shift location. Strict identity tied to specific, immutable neural structures is implausible.
      *   **The Extended Mind Thesis (EMT):** Cognition demonstrably relies on external tools/resources. Theories insisting identity is solely "brain-bound" must justify this against EMT evidence.
      *   **The Dynamic Nature of Consciousness/Binding:** Unity of consciousness is an achievement of the brain (and potentially extended systems), not a fundamental given. Temporary disruptions may not imply identity death.
  *   **Jointly Unsatisfiable Desiderata?** A significant tension exists between:
      *   **Desideratum 3 (Extended Mind/Non-Skull-Boundary):** Demanding incorporation of external scaffolding into identity.
      *   **Desideratum 6 (Distinction: Original Organism vs. Successor System):** Requiring a clear distinction between the persisting biological organism and a synthetic successor.
      *   **Conflict:** If deeply integrated external digital components are *part* of the identity-bearing system *before* internal replacement starts (per Desideratum 3), then replacing the *internal* biological components while retaining the *external* ones challenges the clear separation demanded by Desideratum 6. The resulting system is a hybrid from the start; insisting it's *either* the original organism *or* a distinct successor becomes problematic. A theory satisfying both must offer a novel account of "organism" or "system" that accommodates radical, integrated hybridization. **Desideratum 2 (Reversibility)** further complicates this tension.

  ### Scoring Broad Families of Views

  *   **Psychological-Continuity Theories (e.g., Parfit-inspired):**
      *   **Strengths:** Handles gradual replacement well (Desideratum 1 - continuity of psychology), readily incorporates external scaffolding as part of the psychological profile (Desideratum 3), distinguishes survival (continuity) from flourishing.
      *   **Weaknesses:** Struggles catastrophically with Desideratum 4 (Branching) – backups become equally valid claimants unless ad hoc constraints are added. Often collapses strict identity into psychological continuity/survival, violating Desideratum 6. May downplay phenomenal binding (Desideratum 5) as epiphenomenal to functional continuity. Reversibility (Desideratum 2) is awkward – is the rolled-back version more "original"?

  *   **Embodied/Animalist Accounts (e.g., Olson):**
      *   **Strengths:** Clear on Desideratum 6 – identity is the organism; strict distinction from functional successors. Handles Desideratum 4 (Branching) easily – the organism is the forward-moving stream; backups are distinct entities.
      *   **Weaknesses:** Fails Desideratum 1 – gradual replacement likely constitutes the death of the organism and birth of a new entity (artificial or hybrid), contradicting the intuition of survival. Utterly rejects Desideratum 3 (Extended Mind) as relevant to *identity*, insisting on biological boundaries. Struggles with Desideratum 2 (Reversibility) – is the rolled-back organism the same? Probably, but then the upload phase wasn't "it". Ignores Desideratum 5 (Binding) as irrelevant to organismic identity.

  *   **Patternist/Functionalist Approaches (e.g., Dennett, some transhumanist views):**
      *   **Strengths:** Excels at Desideratum 1 & 3 – identity is the abstract pattern/function, indifferent to substrate or location (gradual replacement preserves it, EMT embraced). Can handle Desideratum 2 (Reversibility) flexibly (pattern persists in different implementations). May accommodate Desideratum 5 (Binding) as a functional property.
      *   **Weaknesses:** Fails Desideratum 4 (Branching) – all perfect copies/backups instantiate the same pattern/identity, leading to problematic multiplicity ("which one is *me*?"). Collapses the critical distinctions in Desideratum 6 – identity *is* the pattern/function, survival *is* replication, the original organism is irrelevant. May trivialize phenomenal binding if seen as merely functional.

  **Conclusion:** No existing broad theory satisfies all desiderata comfortably. A viable theory will likely need novel elements, potentially synthesizing causal-historical process metaphysics with a dynamic, extended, and phenomenally grounded view of the self, while rigorously maintaining the core distinctions. The tensions, especially between extended integration and organismic identity, and the branching problem, represent the hardest challenges.
