answer: |-
  Here’s a casual, one-page proposal draft hitting all your points—tight, conversational, and grounded in everyday thinking:

  ---

  **Project Title:** *Ghost Rules: Why Broken Customs Feel Like Moral Crimes*  

  **The Core Question:**  
  When visitors "break" unspoken local customs (like skipping a tip in the US, jumping a queue in the UK, or jaywalking in Germany), why does it *feel* like a moral violation—even when everyone admits it’s "just a custom"? Do outsiders really owe it to locals to follow these "ghost rules," or is the anger just tribal defensiveness pretending to be ethics?  

  **Why Standard Answers Fail:**  
  We’ve all heard "When in Rome..." — but that just assumes locals *deserve* compliance, without asking *why*. It treats all customs equally, whether it’s taking off shoes indoors or stoning blasphemers. The opposite take—"Morals don’t have borders!"—ignores that humans are wired to absorb local signals. It also lumps *actual* harm (like theft) with *symbolic* friction (like walking on grass where you shouldn’t). Both sides oversimplify. We need to untangle *when* a ghost rule creates real obligation vs. when it’s just social muscle memory.  

  **My Approach (3 Months):**  
  1. **Map the Ghosts:** Break down my three core examples (US tipping, UK queues, German jaywalking) to find what they *actually* do:  
     - Do they prevent chaos? (Queues = fairness)  
     - Do they redistribute resources? (Tips = wage subsidy)  
     - Do they signal respect? (Jaywalking = "order matters here")  
  2. **Spot the Stains:** Track what happens when outsiders "break" them—not just anger, but *how* it’s justified. Is it "You hurt someone!" (moral) or "You don’t belong!" (tribal)?  
  3. **Sketch a Filter:** Build a bare-bones framework for testing any ghost rule:  
     - **Harm Test:** Does breaking it *directly* harm someone (e.g., not tipping stiffs a worker), or just *offend*?  
     - **Signal Test:** Is the rule a legit signal of respect (like removing shoes in a home), or just local habit?  
     - **Burden Test:** How hard is it for an outsider to learn/perform? (Expecting tourists to master British queue nuances = unreasonable.)  

  **What a Result Looks Like:**  
  - A clear, jargon-free **"Ghost Rule Toolkit"**: 3-4 questions to help anyone weigh whether a local custom deserves their compliance or deserves a side-eye.  
  - Short **case studies** showing where anger is legit (e.g., tipping = pay subsidy) vs. performative (e.g., shaming a tourist for imperfect queueing).  
  - **Success** = A framework that feels useful to travelers, immigrants, or even locals questioning their own norms. **Failure** = Ending up with vague mush like "It’s complicated!" or getting lost in philosophy.  

  **Reality Check (No Bullshit):**  
  Three months is *tiny*. I won’t:  
  - Prove a grand theory of cultural morality.  
  - Survey thousands of people or run stats.  
  - Solve every edge case (what about sacred customs? Taboos?).  
  I *will*: Compare three concrete examples, talk to a handful of locals/visitors for texture, and draft a practical filter. It’s a starter kit—not the whole toolbox. If I overreach, I’ll drown.  

  **Why This Matters:**  
  Ghost rules make travel stressful, migration exhausting, and cross-cultural clashes petty. If we can spot when a custom is truly binding vs. just tribal, we might ease up on outsiders—and ourselves.  

  ---

  **Tone Check:** Casual but precise? Check. No academia? Zero citations. No niche theory—just harm, signals, and burden. Scope honest? Yep. This fits a page, focuses your messy idea, and keeps it human. Good luck with the stipend!
