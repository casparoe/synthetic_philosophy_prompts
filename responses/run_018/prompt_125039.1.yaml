prompt: |-
  hey, can you draft the joint statement for an adversarial colab between two camps on whether left/right is actually real or just a coalitional accident? Camp A are the 'scope-axis realists' — they think left and right track a deep moral-psychologial split between people who think obligations should expand outward (to strangers, future generations, nonhuman animals) and people who think obligations stay anchored in existing roles, communities, and inherited practices. They claim this one axis predicts clustering across abortion, immigration, climate, and tax policy even when people don't know party positions. Camp B are the 'historical-coalition skeptics' — they say left and right are temporary brand names for alliances that flip constantly, pointing to 19th-century liberals being free-market anti-clericals while modern ones are interventionist, and to left-nationalist vs right-libertarian movements. They think any cross-domain consistency is just elite cue-taking.

  I want the document both could sign: (1) a numbered list of agreed-claims about how political coalitions form, shift, and signal; (2) the exact disagreements phrased so each camp accepts the wording of its own side; (3) the cruxes — I think one is whether there's a single psychologial dimension that predicts cross-domain attitudes better than party ID alone, and another is whether historical reversals (like liberalism's economic flip) are fatal or just surface noise; (4) for each crux, a concrete case or study design both sides agree bears on it, with each side's prediction written down. Also say whether part of the dispute is just verbal about what 'real' means. Format: agreed claims then a disagreements table. Don't ask for a bibliography or cite specific papers — just draft it.
reasoning: |-
  We are drafting a joint statement between two camps: Camp A (scope-axis realists) and Camp B (historical-coalition skeptics). The document should have four parts:

  1. Agreed Claims: A numbered list of claims both camps agree on about how political coalitions form, shift, and signal.
  2. Disagreements: A table (or clearly structured section) where each camp's position is stated in wording they accept, without the other camp being misrepresented.
  3. Cruxes: Two main cruxes are identified. For each crux, we state:
     a. The core issue.
     b. A concrete case or study design that both sides agree would bear on it.
     c. Each side's prediction for that case/study.
  4. Verbal Dispute: A note on whether part of the dispute is verbal about the meaning of 'real'.

  Format: Start with the agreed claims, then the disagreements, then the cruxes, and finally the note on verbal dispute.

  Let's break it down:

  **Part 1: Agreed Claims**

  We need a list of 4-6 points that both sides can accept. These should focus on areas of common ground about coalition formation, shifts, and signaling.

  Possible agreed claims:
  1. Political coalitions are formed by groups with overlapping interests and values, and they often use labels (like left/right) as signals.
  2. Historical shifts in the policy positions associated with left/right labels have occurred (e.g., 19th-century liberals vs. modern liberals).
  3. Elite cues (from politicians, media, etc.) can influence the policy positions adopted by individuals within a coalition.
  4. Voters often take cues from their preferred party or group when forming policy positions, especially on complex issues.
  5. Political identities (like party ID) are strong predictors of policy attitudes.
  6. There is some degree of clustering of policy attitudes (e.g., on abortion, immigration, climate, taxes) in contemporary politics.

  **Part 2: Disagreements**

  We need to phrase each camp's core position in a way they would accept. We can structure this as a two-column table or a clear list. Let's do a table for clarity.

  | Camp A (Scope-Axis Realists) | Camp B (Historical-Coalition Skeptics) |
  |------------------------------|----------------------------------------|
  | We hold that the left-right divide reflects a deep and persistent psychological axis: the scope of moral obligations. This axis, which distinguishes between expanding obligations (to strangers, future generations, nonhuman animals) and anchored obligations (to existing roles, communities, inherited practices), predicts clustering of policy attitudes (on issues like abortion, immigration, climate, and tax policy) even in the absence of elite cues. | We hold that the left-right labels are historically contingent and reflect shifting coalitions. The observed clustering of policy attitudes is primarily the result of elite cue-taking and coalitional branding. Historical examples (like the reversal in economic policy of liberalism) show that the content of left and right is not fixed by a single psychological dimension. |

  **Part 3: Cruxes**

  We have two cruxes:

  Crux 1: Whether there's a single psychological dimension that predicts cross-domain attitudes better than party ID alone.

  Crux 2: Whether historical reversals (like liberalism's economic flip) are fatal to the idea of a deep axis or just surface noise.

  For each crux, we need:

  - The core issue.
  - A concrete case or study design that both sides agree bears on it.
  - Each side's prediction.

  **Crux 1:**

  Core issue: The predictive power of a psychological dimension (scope of obligations) vs. party ID for cross-domain policy attitudes.

  Study design: A survey experiment that measures:
     - Party identification.
     - Psychological traits (including the proposed scope-of-obligations axis, measured by questions about moral obligations to different entities).
     - Policy attitudes on a range of issues (abortion, immigration, climate, taxes) without any reference to party positions or elite cues.
     - Then, in a controlled setting, expose a random subset to elite cues (e.g., a statement from a party leader) on one issue and measure changes.

  Both sides agree that this study would bear on the crux.

  Camp A prediction: The scope-of-obligations axis will predict policy attitudes independently and more strongly than party ID, even when controlling for cues. The effect of cues will be weaker for those with strong psychological dispositions.

  Camp B prediction: Party ID will be the strongest predictor, and the scope-of-obligations axis will not add significant predictive power beyond party ID. The effect of cues will be strong and may override any pre-existing psychological dispositions.

  **Crux 2:**

  Core issue: The significance of historical reversals (like the change in economic policy of liberalism) for the deep-axis theory.

  Concrete case: Analyze the historical shift in liberalism from 19th-century (free-market, anti-clerical) to modern (interventionist, secular but with different economic stance). Examine whether the underlying psychological dimension (scope of obligations) remained consistent despite the economic policy reversal.

  Study design: A historical analysis that codes the rhetoric and policy positions of liberal movements in the 19th century and today for both economic policy and the scope of obligations (e.g., attitudes toward the poor, foreigners, future generations). Also, examine if there were consistent psychological themes (like expanding obligations) even when economic policies flipped.

  Camp A prediction: They will find that the scope-of-obligations axis remained consistent (e.g., 19th-century liberals were expanding obligations to new groups like the non-aristocratic, while modern liberals expand to more groups) even as economic policies shifted due to changing circumstances. The reversal is surface noise.

  Camp B prediction: They will find that the scope of obligations also shifted: 19th-century liberals focused on individual freedom and were less concerned with social welfare obligations, while modern liberals emphasize collective obligations. The shift in economic policy reflects a deeper shift in the coalition, and there is no persistent psychological dimension.

  **Part 4: Verbal Dispute**

  Note: Part of the dispute may be verbal regarding what it means for the left-right axis to be "real." Camp A defines "real" as reflecting a deep psychological dimension that persists across time and context, while Camp B defines "real" as a stable and non-arbitrary coalition that does not flip in its core positions. Both agree that the labels are used and that coalitions exist, but they disagree on the underlying cause of the clustering.

  Now, let's draft the document accordingly.
answer: |-
  ### Joint Statement: Adversarial Collaboration on the Nature of Left-Right Political Divides  
  **Participants:**  
  - **Camp A (Scope-Axis Realists):** Asserts that "left" and "right" reflect a deep, cross-culturally stable psychological axis tied to the scope of moral obligations.  
  - **Camp B (Historical-Coalition Skeptics):** Asserts that "left" and "right" are contingent coalitional brands with no fixed psychological core, shaped by elite signaling and historical accidents.  

  #### 1. Agreed Claims on Coalition Formation, Shifts, and Signaling  
  Both camps endorse the following statements:  
  1. **Coalitional Fluidity:** Political labels (e.g., "left"/"right") aggregate groups with initially divergent interests, and these coalitions reorganize in response to socio-economic crises, technological shifts, or elite realignments (e.g., 19th-century liberals vs. modern liberals).  
  2. **Elite Cue Dominance:** Party identification strongly predicts individual policy attitudes, partly because voters infer positions from trusted elites when information is costly or complex.  
  3. **Cross-Domain Clustering:** In contemporary industrialized democracies, self-identified left/right voters exhibit statistical clustering of stances on issues like abortion, immigration, climate, and taxation.  
  4. **Signaling Function:** Left/right labels efficiently signal in-group loyalty and out-group opposition, simplifying political competition even when policy content changes.  
  5. **Contextual Variability:** The salience of specific issues (e.g., religion, trade) within left/right coalitions varies across time and culture, altering the coalitions' perceived "core" priorities.  

  #### 2. Disagreements: Phrasing Acceptable to Each Camp  
  Each camp’s core disagreement is stated below in mutually accepted wording. No camp disputes the accuracy of the other’s self-description.  

  | Camp A (Scope-Axis Realists) | Camp B (Historical-Coalition Skeptics) |
  |------------------------------|----------------------------------------|
  | We hold that the left-right divide tracks a universal psychological axis: individuals consistently prioritize either expanding moral obligations (to strangers, future generations, or nonhuman entities) or anchoring obligations in existing roles, communities, and inherited practices. This axis explains cross-domain attitude clustering even in non-partisan contexts and predicts new issues (e.g., AI ethics) better than coalitional labels alone. | We hold that left-right divisions are coalitional accidents: they are unstable brands applied to alliances of convenience (e.g., left-nationalists vs. right-libertarians). Observed policy clustering arises from elite cue adoption, not psychological traits. Historical reversals (e.g., liberalism’s economic flip) prove no fixed "moral scope" underlies these labels. |

  #### 3. Cruxes: Core Disputes with Testable Predictions  
  **Crux 1: Predictive Power of a Psychological Axis vs. Party ID**  
  - **Core Issue:** Does a "scope-of-obligations" psychological dimension predict cross-domain policy attitudes better than party identification alone?  
  - **Agreed Test:** A multinational survey experiment measuring:  
    - Party ID, demographic controls, and political knowledge.  
    - A psychological "scope-of-obligations" battery (e.g., agreement with: "Society must prioritize future generations over current traditions").  
    - Policy preferences on 10 novel/low-salience issues (e.g., digital privacy, synthetic meat) *before* and *after* exposure to randomly assigned elite cues.  
  - **Predictions:**  
    - **Camp A:** The "scope" dimension will predict pre-cue attitudes more strongly than party ID (R² > 0.4). Post-cue, high-scope individuals will resist cues contradicting their orientation.  
    - **Camp B:** Party ID will dominate pre-cue predictions (R² > 0.5). Post-cue, attitudes will shift significantly toward elite cues, regardless of psychological traits.  

  **Crux 2: Significance of Historical Policy Reversals**  
  - **Core Issue:** Are historical left/right reversals (e.g., liberalism’s shift from free-market to interventionist economics) fatal to a "deep axis" or reconcilable surface noise?  
  - **Agreed Test:** Comparative historical analysis of three policy reversals (e.g., liberalism’s economics, conservatism’s trade stance, socialism’s environmentalism). Code primary sources (manifestos, speeches) for:  
    - Policy stance (e.g., free markets vs. regulation).  
    - Rhetorical appeals to "expanding" or "anchored" obligations.  
    - Elite cues driving coalition shifts (e.g., party mergers, crises).  
  - **Predictions:**  
    - **Camp A:** Reversals will show consistent underlying "scope" rhetoric (e.g., 19th-century liberals framed markets as expanding opportunity for marginalized groups). Changes reflect strategic adaptation of a stable ethic.  
    - **Camp B:** Reversals will show abrupt rhetorical breaks (e.g., 19th-century liberals invoked individualism; modern liberals invoke collective welfare). Elite cues (e.g., labor union alliances) explain shifts better than psychology.  

  #### 4. Verbal Dispute on "Real"  
  Both camps acknowledge a partial verbal disagreement:  
  - **Camp A** defines "real" as "reflecting a measurable psychological trait with predictive validity beyond transient coalitions."  
  - **Camp B** defines "real" as "a stable, non-arbitrary coalition with consistent policy commitments across generations."  
  - **Shared Ground:** Both agree that left/right labels are socially real (i.e., they guide behavior) but dispute whether they reveal a deeper universal trait.  

  ---  
  **Signed,**  
  **Camp A (Scope-Axis Realists)**  
  **Camp B (Historical-Coalition Skeptics)**  

  *This document represents an adversarial collaboration: both camps endorse the agreed claims, their own disagreement wording, and the testability of the cruxes, but remain unconvinced by the other’s core position pending empirical resolution.*
