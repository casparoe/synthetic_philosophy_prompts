answer: |-
  **Sphex**

  When venom stills the cricket in the sand,
  Her ritual resumes, precise and stark.
  *She drags the cricket to the burrow’s edge.*

  She leaves it prone upon the sun-baked land,
  Proceeds alone into the hollow dark.
  When venom stills the cricket in the sand.

  Emerging to reclaim her prey’s command,
  She finds the marker shifted from its arc:
  *The prey’s been shifted from the burrow’s edge.*

  No altered state her rigid course can strand;
  Instinct compels her through the blinding work.
  When venom stills the cricket in the sand,

  Again she hauls the weight with patient hand
  To where the threshold makes its vital mark.
  *She drags the cricket to the burrow’s edge.*

  The slightest nudge, a breeze, a stray command,
  Resets the loop within the wasp’s deep core.
  When venom stills the cricket in the sand,
  *The prey’s been shifted from the burrow’s edge.*

  If will resides where habit holds the land,
  And reason sleeps beneath the driven spark,
  *We drag the cricket to the burrow’s edge.*
  Is freedom lost within the fixed command,
  Or was it never there—a phantom arc?—
  When venom stills the cricket in the sand,
  *The prey’s been shifted from the burrow’s edge.*
