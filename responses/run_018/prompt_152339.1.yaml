prompt: |-
  I work in the planning office of a mid-sized county government, and I do not have an academic background in science or philosophy. Over the past year I have been reading on my own about why scientific models can include assumptions that are obviously false—such as treating every neighborhood as having identical soil permeability, or treating all households as single income-maximizing units—and still be used to guide real decisions. I encountered Milton Friedman’s argument that the realism of a model’s underlying assumptions does not matter as long as its predictions are accurate, and I want to turn that principle into a practical, reusable decision procedure that my small team can apply whenever a consultant submits a model-based recommendation for our land-use or infrastructure rules.

  Please write a formal procedure, presented as an ordered checklist with explicit decision nodes, that a non-specialist reviewer can complete in about thirty minutes. For each step, state the precise question to ask, what counts as a sufficient answer, and whether the step results in a continue, a stop (reject or defer the recommendation), or a mandatory hand-off to human judgment because the issue is one of values rather than facts. The procedure must include a way to classify unrealistic assumptions into two kinds: those that are instrumentally false—simplifying internal mechanics without misrepresenting the real-world entities the policy targets—and those that are representationally false in a way that could misdirect the recommendation, even when aggregate predictions fall within acceptable error margins. Provide a small set of test conditions—no more than three brief scenarios or diagnostic sentences—that a reviewer can use to make this classification.

  Then apply the procedure step-by-step to three proposal types we actually receive:
  1. A stormwater management model that assumes uniform drainage rates across all parcels; historical back-testing predicts county-wide flooding well, but local engineers report it consistently misses flash-flood risk in two specific neighborhoods.
  2. A regional housing-demand forecast that treats every household as a single, rational income-maximizer; it predicts aggregate rent trends accurately, but it erases multigenerational families and informal sublets that are common here.
  3. A long-range heat-mitigation plan built on a climate model that assumes no major loss of tree canopy over the next twenty years; the aggregate temperature projections are within acceptable margins, and I personally want to approve this plan because it strengthens a grant application we need.

  In the third case, the procedure should deliver a clear recommendation that I will not like—most likely a stop or a mandatory value-based hand-off—despite the favorable predictions and my preference. After the applications, identify two specific limitations that remain even when the checklist is followed perfectly: things the procedure cannot settle and that require outside judgment or expertise.

  Please observe the following constraints in your answer: write in American English; keep the tone formal and polished; do not include bibliographies, reading lists, or citations; and design the procedure for a team with no PhD-level modelers, a five-business-day sign-off deadline, and no authority to demand new data collection from consultants.
reasoning: |-
  Okay, the user works in a county planning office and needs a practical decision procedure based on Milton Friedman's idea that unrealistic assumptions in models are okay if predictions are accurate. They want a checklist for non-specialists to evaluate consultant models in about 30 minutes. 

  First, I need to unpack the core challenge. The user isn't asking for theoretical debate - they need an actionable tool that distinguishes between harmless simplifications and dangerous distortions. The key insight from Friedman is that assumption realism matters less than predictive power, but the user correctly notes aggregate accuracy can mask localized failures. That's why the procedure must classify assumption types.

  Hmm... the two categories need crisp definitions. "Instrumentally false" assumptions are like mathematical shortcuts that don't distort reality (e.g., assuming spherical cows in physics). "Representationally false" ones mischaracterize the actual entities being modeled (e.g., ignoring multigenerational households in housing demand). The test conditions should flag when false assumptions bleed into policy targeting.

  For the stormwater example: Uniform drainage is instrumentally false if errors average out county-wide, but becomes representationally false when it ignores known neighborhood geology. The flooding risk in specific areas makes this a "stop" - even though aggregate predictions are good, the model fails where it matters most.

  The housing model is trickier. Treating households as single rational actors is representationally false because it erases real social structures. But if it predicts rents accurately, does that save it? No - because the policy affects real multigenerational families. This needs hand-off to values judgment: should we optimize for aggregate efficiency or protect vulnerable living arrangements?

  The heat-mitigation case is where the procedure must bite despite personal preferences. Assuming constant tree canopy is representationally false because it ignores development pressures. Even if temperatures project well, the grant-focused approval bias is dangerous. Mandatory hand-off forces acknowledging this trade-off: canopy preservation isn't just modeling, it's a value choice about environmental sacrifice.

  Major limitations to confess: First, the 30-minute limit means we can't catch cleverly hidden representation errors - like when a model "accidentally" ignores minority neighborhoods through "neutral" assumptions. Second, acceptable error margins are political decisions masquerading as technical ones. The checklist can't resolve that tension.

  ...Better include a "smell test" step where non-experts flag intuitive unease. Planning staff know their communities better than any consultant's spreadsheet.
answer: |-
  ## Formal Review Procedure: Model-Based Policy Recommendation Evaluation

  **Purpose:** To determine whether a consultant's model-based recommendation is suitable for adoption despite unrealistic assumptions, per Friedman's instrumentalist principle.  
  **Scope:** Applies to land-use/infrastructure proposals using predictive models.  
  **Time Allotment:** ≤ 30 minutes per reviewer.  
  **Reviewer:** Non-specialist planning staff.  
  **Output:** Continue (Approve), Stop (Reject/Defer), or Mandatory Hand-Off (Values-Based Judgment Required).

  ---

  ### Ordered Checklist

  **Step 1: Verify Core Objective Alignment**  
  *   **Question:** Does the model's stated objective *directly* align with the policy decision we are being asked to make? (e.g., "Reduce county-wide flood risk" aligns with approving a stormwater ordinance; "Predict average county rent" does *not* inherently align with approving zoning changes impacting specific neighborhoods).  
  *   **Sufficient Answer:** Explicit, verbatim match between model objective and required policy decision stated in the consultant's report. Ambiguity or mismatch is insufficient.  
  *   **Decision:**  
      *   **Match:** Continue to Step 2.  
      *   **Mismatch/Ambiguity:** **Stop.** (Reason: Model objective irrelevant to decision.)

  **Step 2: Assess Aggregate Predictive Accuracy**  
  *   **Question:** Does the consultant provide documented evidence (e.g., back-testing, validation against historical data, peer-reviewed benchmarks) showing the model's *aggregate* predictions fall within pre-defined acceptable error margins for the *core objective*?  
  *   **Sufficient Answer:** Quantitative results clearly showing predictions meet the consultant's *own* stated accuracy thresholds or industry-standard thresholds relevant to the policy context. Lack of validation or failure to meet thresholds is insufficient.  
  *   **Decision:**  
      *   **Meets Thresholds:** Continue to Step 3.  
      *   **Fails Thresholds/Lacks Evidence:** **Stop.** (Reason: Insufficient predictive accuracy per Friedman's criterion.)

  **Step 3: Identify & Classify Unrealistic Assumptions**  
  *   **Question:** What are the key unrealistic assumptions explicitly stated or readily identifiable in the model documentation? Classify each using the Test Conditions below.  
  *   **Classification Test Conditions:**  
      1.  **"Is the assumption primarily a mathematical/technical shortcut?"** (Yes → *Likely Instrumentally False*)  
      2.  **"Does the assumption fundamentally misrepresent the nature or behavior of the *specific entities* the policy decision will directly impact or target?"** (Yes → *Likely Representationally False*)  
      3.  **"Could changing this assumption *only* to make it more realistic (without altering predictions) significantly alter the *distribution* of outcomes or the *vulnerability* of specific subgroups?"** (Yes → *Likely Representationally False*)  
  *   **Sufficient Answer:** List of key unrealistic assumptions and classification (Instrumental or Representational) for each, justified briefly using the Test Conditions.  
  *   **Decision:**  
      *   **No Unrealistic Assumptions Found:** Continue to Step 5 (bypass Step 4).  
      *   **Assumptions Identified:** Continue to Step 4.

  **Step 4: Evaluate Impact of Representationally False Assumptions**  
  *   **Question:** For each assumption classified as *Representationally False* in Step 3, does the consultant provide evidence that the misrepresentation:  
      a) Does *not* materially distort the model's predictions *for the specific subgroups or spatial areas targeted by the policy recommendation*, OR  
      b) Has been explicitly mitigated or accounted for in the final recommendation?  
  *   **Sufficient Answer:** Evidence must directly address the subgroups/areas impacted by the policy (e.g., sensitivity analysis for vulnerable groups, localized validation in affected neighborhoods, explicit caveats with compensatory recommendations). General aggregate accuracy alone is *insufficient*.  
  *   **Decision:**  
      *   **Evidence Provided & Shows No Material Distortion:** Continue to Step 5.  
      *   **No Evidence / Evidence Shows Material Distortion:** **Stop.** (Reason: Representationally false assumptions risk misdirecting policy for target entities/subgroups, even if aggregate predictions are good.)  
      *   **Impact Assessment Requires Societal/Equity Trade-offs:** **Mandatory Hand-Off.** (Reason: Value judgment required on fairness, distributional impacts, or community priorities.)

  **Step 5: Final Feasibility & Documentation Check**  
  *   **Question:** (a) Is the recommendation logistically and legally feasible for the county to implement within known constraints? (b) Is the model methodology and all limitations documented sufficiently for public transparency if adopted?  
  *   **Sufficient Answer:** (a) No obvious legal, budgetary, or jurisdictional roadblocks identified in proposal. (b) Key assumptions (esp. representationally false ones) and limitations are clearly stated in the consultant's report.  
  *   **Decision:**  
      *   **Yes (a & b):** **Continue (Recommend Approval).**  
      *   **No (a or b):** **Stop.** (Reason: Implementation infeasibility or insufficient transparency.)

  ---

  ### Application to Proposal Types

  **Proposal 1: Stormwater Model (Uniform Drainage)**  
  *   **Step 1:** Core objective ("Predict county-wide flood risk") aligns with stormwater management policy decision. **Continue.**
  *   **Step 2:** Historical back-testing shows accurate county-wide flood prediction. **Continue.**
  *   **Step 3:** Assumption: Uniform soil permeability.  
      *   Test 1: Yes (simplifies hydrology math) → *Instrumental*.  
      *   Test 2: **Yes** (misrepresents specific geology of known neighborhoods) → *Representational*.  
      *   Test 3: **Yes** (changes would highlight specific flash-flood risk areas). **Classification: Representationally False.**  
  *   **Step 4:** Evidence shows the model *fails* to predict flash floods in specific neighborhoods (the policy targets local infrastructure). No mitigation provided. **Stop.** (Reason: Representationally false assumption misdirects policy for vulnerable locations.)

  **Proposal 2: Housing-Demand Forecast (Single Rational Actors)**  
  *   **Step 1:** Core objective ("Predict aggregate regional rent trends") *may* align with a high-level housing policy decision, but specifics matter. Assume alignment for this example. **Continue.**
  *   **Step 2:** Predicts aggregate rent trends accurately. **Continue.**
  *   **Step 3:** Assumption: All households are single, rational income-maximizers.  
      *   Test 1: Yes (simplifies economic modeling) → *Instrumental*.  
      *   Test 2: **Yes** (fundamentally misrepresents behavior/structure of multigenerational families & informal sublets) → *Representational*.  
      *   Test 3: **Yes** (changing it would reveal different demand drivers/vulnerabilities for these groups). **Classification: Representationally False.**  
  *   **Step 4:** The recommendation (e.g., zoning for certain unit types) *will* impact multigenerational families and informal sublets. No evidence provided that the misrepresentation doesn't distort predictions *for these specific household types* or that impacts are mitigated. **Mandatory Hand-Off.** (Reason: Requires value judgment on whether optimizing for aggregate efficiency is acceptable given the erasure of specific, common household structures and potential disparate impacts.)

  **Proposal 3: Heat-Mitigation Plan (No Tree Canopy Loss)**  
  *   **Step 1:** Core objective ("Project future urban heat island effect") aligns with approving a heat-mitigation plan. **Continue.**
  *   **Step 2:** Aggregate temperature projections within acceptable margins. **Continue.**
  *   **Step 3:** Assumption: No major loss of tree canopy over 20 years.  
      *   Test 1: No (not just a math shortcut; represents a future state).  
      *   Test 2: **Yes** (fundamentally misrepresents the *likely trajectory* of a key urban heat variable the policy aims to manage).  
      *   Test 3: **Yes** (changing it to reflect likely development pressure would alter heat distribution projections and potentially the efficacy/location needs of proposed mitigation). **Classification: Representationally False.**  
  *   **Step 4:** The assumption misrepresents a core factor (tree canopy) the policy directly targets. Aggregate accuracy doesn't prove localized accuracy where canopy is lost. No evidence provided that this misrepresentation doesn't distort the plan's effectiveness in areas facing canopy loss. **Mandatory Hand-Off.** (Reason: Approval despite the known false assumption requires a value judgment: prioritizing the grant opportunity *knowing* the plan's core assumption is unrealistic and may undermine its long-term effectiveness in mitigating heat where canopy is lost.)

  ---

  ### Inherent Limitations of the Procedure

  1.  **Hidden Representation Failures:** The procedure relies on identifying *known* unrealistic assumptions. It cannot detect deeply embedded, unintentional, or obscured representational falsehoods (e.g., biased training data, unstated normative choices masked as technical assumptions) without specialized expertise beyond the reviewer's scope or the 30-minute limit.
  2.  **Defining "Acceptable Error":** The procedure assumes "acceptable error margins" are pre-defined and relevant. It cannot resolve disputes over *what level of error is acceptable* for a specific policy decision (e.g., is missing flash floods in 2 neighborhoods acceptable if county-wide predictions are perfect?). This is fundamentally a political/policy judgment requiring senior leadership or stakeholder input outside the checklist's bounds.
