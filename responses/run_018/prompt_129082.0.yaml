answer: |-
  Your analysis brilliantly diagnoses a profound methodological deadlock in historical interpretation. The phenomenon you describe — where competing frameworks preemptively neutralize each other's core evidence through mutually immunizing definitions — deserves a specific conceptual label: **Evidentiary Neutralization Framework Stalemate (ENFS)**.  

  ### Defining ENFS with Boundary Conditions
  **ENFS** occurs when:  
  1. **Symmetric Conceptual Immunity**: Two models (e.g., "collapse" vs. "reorganization") define their core criteria such that the opposing model's primary evidence is automatically reclassified as irrelevant or consistent with their own view.  
     - *Collapse model*: Demographic/cultural continuity = "background noise"  
     - *Reorganization model*: Institutional disintegration = "decentralization"  
  2. **Preemptive Taxonomy**: Key terms ("collapse," "complexity") absorb contrary evidence by definitional fiat rather than empirical falsification.  
  3. **Evidentiary Irrelevance**: No new data can resolve the dispute because both frameworks declare the same evidence non-decisive.  

  ### Distinguishing ENFS from Related Concepts  
  | Concept             | Key Difference from ENFS |  
  |---------------------|--------------------------|  
  | **Kuhnian Incommensurability** | ENFS shares evidentiary standards; the conflict is interpretive, not paradigmatic. Both agree on ceramic/demographic data but disagree on *significance*. |  
  | **Framing Effects** | ENFS is structural and reciprocal; both frames actively neutralize *each other*, not just emphasize different aspects. |  
  | **Definitional Gerrymandering** | ENFS lacks intentional manipulation; it arises from legitimate theoretical commitments, not bad-faith redefinition. |  
  | **Semantic Vagueness** | ENFS isn’t about fuzzy terms, but precisely engineered definitions that *systematically exclude* rival evidence. |  

  ### Resolving the Stalemate: Potential Pathways  
  1. **Introduce a Third Variable**:  
     - Seek evidence that *both* frameworks must treat as decisive but cannot absorb. Example:  
       - **Ritual Continuity/Disruption**: If temple rituals persist identically after "collapse" (e.g., Maya cave ceremonies continuing sans elites), reorganization gains credence.  
       - **Resource Access Shifts**: Sudden isotopic evidence of elite protein sources becoming universally available post-"collapse" supports decentralization.  

  2. **Reframe "Collapse" as Epistemological Test**:  
     - Ask: What would *falsify* each model? If no conceivable finding could do so (e.g., "any persistence proves reorganization"; "any institutional loss proves collapse"), ENFS is confirmed.  

  3. **Decolonize "Complexity"**:  
     - Adopt Indigenous perspectives (e.g., Maya oral histories) on whether elite institutions' dissolution constituted loss or liberation. If local traditions celebrate the transition, "collapse" is exposed as a top-down projection.  

  ### Vulnerability in My Reasoning  
  **Weak Point**: I assume institutional and demographic evidence are equally accessible. But if future techniques (e.g., aDNA kinship studies) reveal that post-"collapse" populations were *unrelated* to pre-collapse societies (e.g., Easter Island), ENFS collapses—demographic rupture would decisively support your view. Conversely, evidence that monument-builders *were* the farmers (e.g., labor conscription records in Linear B tablets) would validate your friend’s continuity model.  

  **Your Meta-Insight**: You correctly identify this isn’t a pseudo-problem. ENFS exposes how **historians' valuations of political centralization** shape narratives. Resolving it requires:  
  - Admitting that "collapse" often reflects modern anxiety about state fragility  
  - Recognizing that "continuity" risks romanticizing resilience amid suffering  

  ### Proposed Resolution Strategy  
  Pilot this test on **Easter Island**:  
  1. **Collapse Model Prediction**: Post-monument cessation, *all* high-status activities (e.g., obsidian tool production) cease abruptly.  
  2. **Reorganization Model Prediction**: Status markers shift (e.g., stone tools replaced by wood carvings), showing adaptive reallocation of labor.  

  If neither pattern fully emerges, ENFS holds—and we must acknowledge that some historical transitions resist singular labels, demanding **polythetic classifications** (e.g., "selective collapse with subsistence resilience"). This stalemate isn’t failure; it’s an invitation to deeper historiography that foregrounds *whose survival counts* as continuity.
