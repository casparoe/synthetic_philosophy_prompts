  The key insight is temporal extension: most dirty-hands discussions focus on the immediate act, but institutional roles exist over time. If accepting moral taint creates future obligations to prevent normalization of corruption, that could flip the script. The user's suggested "retrospective democratic-integrity audit" is brilliant - it makes the politician accountable not just for outcomes but for how actions preserve democratic legitimacy.

