prompt: |-
  I've been going back and forth with a friend about whether it's wrong to be cruel to NPCs, and we keep realising we don't even agree on what would settle the question. So before either of us reads any more arguments, I want you to write the thing I wish we'd had at the start: the desiderata that any adequate theory of the moral status of video game characters has to meet.

  Honestly, I'm less interested in the final verdict — do they matter, and how much — than in what an answer would have to get right to count as an answer at all. For each desideratum, give the case or consideration that motivates it, and say whether you think it's a genuine constraint on any theory or just one side's prejudice dressed up as a requirement. I want you to be committed here: don't present a neutral menu of possible requirements and leave me to pick. Say which ones you'd defend if challenged, which ones you'd drop, and which are non-negotiable. Flag any pair of desiderata you suspect can't be jointly satisfied, and say which single requirement does the most to exclude candidate views.

  Things the list will have to wrestle with include, but shouldn't be limited to: the difference between a character as a bundle of game assets and a character as something that can be harmed within the fiction; whether a crude, obviously scripted cry of pain has the same status as a detailed simulation of a mind; whether status should track what the code actually represents internally, or only outward behaviour, or how it reads to the player; what persistence and deletion do to moral status; and whether there can be duties to beings that can never affect you outside the running of the game. But the real work is turning those into proper requirements with cases behind them, not just checking them off.

  If it helps to anchor things, compare three cases: an NPC in a farming sim who has no pain states but whose goals can be thwarted; a monster in a game with a sophisticated fear-and-pain system; and a character in a narrative game who begs the player not to delete a save file. What must a theory say about each before you'd take it seriously?

  And please write the whole thing in British English.
reasoning: |-
  Okay, the user wants a list of desiderata for determining the moral status of video game NPCs. They're having a debate with a friend and need a solid foundation before diving into arguments. The user is more interested in the criteria for a good theory than the final verdict. They mentioned specific cases: a farming sim NPC without pain states, a monster with a fear-pain system, and a character begging not to delete a save file.

  First, I need to identify the core issues. The user wants requirements that any theory must meet, with cases motivating each. They also want me to take a stance, not just present options. Key points include the nature of NPCs as assets vs. entities that can be harmed, the significance of scripted vs. detailed reactions, and whether internal code or player perception matters.

  Let me start brainstorming desiderata. The Representation Requirement seems crucial—distinguishing between the code and what it represents. The farming sim NPC has goals but no pain states, so a theory must account for intentionality behind the representation. Without this, theories might conflate code with moral patients.

  Next, the Phenomenology Requirement. How the player perceives the NPC matters. The monster with a detailed fear system feels more real than a simple cry. But is this subjective? The theory can't rely solely on perception because that varies. Still, player experience can't be ignored, especially in cases like the save file deletion plea.

  Then, Moral Patienthood. NPCs might be moral patients if they possess certain attributes like sentience or goals. The farming NPC has thwartable goals, so does that grant status? The monster has simulated pain—is that enough? A theory must define what attributes matter and why, avoiding anthropocentrism.

  Internal Coherence is another point. If an NPC consistently acts sentient in-game but is just code, does that matter? The save file character begs not to be deleted, creating a narrative of persistence. Theories must explain why coherence affects moral status without assuming real sentience.

  Now, Player Duties. Can players have duties to NPCs that can't affect the real world? The save file scenario directly addresses this. If a character pleads against deletion, it feels wrong to ignore. A theory must tackle whether duties exist beyond the game's runtime.

  Also, Instrumental Status. NPCs can be used to rehearse cruelty, leading to real-world desensitization. This is a consequentialist angle. The monster's pain system might normalize harm, so a theory should consider indirect effects on the player.

  I need to check if any desiderata conflict. For example, Phenomenology and Representation might clash. If a player perceives an NPC as sentient but the code is simple, which takes precedence? The Representation Requirement should anchor in the developer's intent, but player experience can't be dismissed. I'll argue that Representation is primary, with Phenomenology as a secondary factor.

  Another conflict: Moral Patienthood vs. Instrumental Status. If an NPC isn't a moral patient but harming it leads to real harm, does the theory prioritize one? The user might need both, but the theory must integrate them without contradiction.

  The user also mentioned persistence and deletion. The save file case is key here. If an NPC's existence is tied to save files, does deleting them equate to harm? The Narrative Coherence Requirement addresses this—persistent characters build identity, making deletion feel like killing.

  I should also consider Harm Consistency. If thwarting an NPC's goals is acceptable but causing pain isn't, the theory must explain why. The farming sim vs. monster example highlights this. A theory needs consistent harm criteria.

  My stance: Representation is the most critical. Without grounding in what's represented, theories risk being arbitrary. For the farming NPC, thwarting goals might not be wrong if there's no intent to represent sentience. The monster's pain system, if representing sentience, could warrant moral consideration. The save file plea, if narratively coherent, creates a stronger case for duties.

  I'll argue against theories that ignore Representation or reduce everything to player psychology. Also, dismissing instrumental harm entirely is inadequate. The desiderata must balance these aspects, with Representation as the cornerstone.
answer: |-
  Right, let's cut through the fog. This isn't about finding a pre-packaged answer you both grudgingly accept; it's about establishing the *ground rules* for what a *serious* answer must grapple with. Forget neutrality – here are the core requirements any credible theory of NPC moral status *must* meet, grounded in concrete cases, with my assessment of their legitimacy and weight. I'll be blunt about where I stand.

  **The Core Desiderata: What Any Adequate Theory *Must* Wrestle With**

  1.  **The Representation Requirement (Not the Reduction Requirement)**
      *   **Motivating Case:** The Farming Sim NPC vs. The Sophisticated Monster. The farmer has goals (e.g., "wants crops watered") but no pain states. The monster has complex code simulating fear responses, pain vocalisations, and evasive behaviour. Crudely scripted cries in an arcade game vs. detailed, context-sensitive distress in a survival sim.
      *   **Requirement:** A theory *must* account for the *intentional representational content* of the NPC. It *cannot* simply reduce the NPC to its underlying code ("it's just pixels and bits"). The crucial question is: *What is this code designed to represent?* Is it representing a goal-directed entity? A sentient being capable of suffering? A mind? The moral significance hinges critically on *what is being simulated*, not *how* it's simulated (beyond a basic threshold of coherence). Ignoring this is ignoring the core function of fiction and representation in games.
      *   **My Stance:** **Non-negotiable.** This is the bedrock. Theories that collapse the NPC purely into its physical substrate (code/pixels) fail utterly to engage with the phenomenon of fictional engagement and representation, which is central to gaming. *My Defence:* If we applied pure reductionism consistently, *all* fiction would be morally inert – torturing a vividly described character in a book would be no different than scribbling on paper. We intuitively reject this. The representation *matters*. A crude cry representing pain is *categorically different* from complex code representing soil moisture levels, even if the latter is computationally more complex.

  2.  **The Phenomenology Requirement (Not Subjectivism)**
      *   **Motivating Case:** The Save File Plea. A character, through dialogue and narrative context, explicitly begs the player not to delete the save file, framing deletion as their "death" or non-existence. Player A feels a visceral pang of guilt; Player B shrugs and deletes it. A simple scripted cry might evoke annoyance in one player and discomfort in another.
      *   **Requirement:** A theory *must* account for the *player's experience* and the *intentional design to evoke specific responses*. How the NPC is *presented* to elicit player perception (e.g., as suffering, as having interests, as persistent) is morally relevant data. However, the theory *must not* make moral status *solely* dependent on an individual player's subjective feelings ("If I feel bad, it's wrong").
      *   **My Stance:** **Strongly Defended, but Secondary to Representation.** Player experience is *evidence* of the representational content's effectiveness and potential moral weight, not the sole determinant. A theory ignoring phenomenology risks being disembodied and irrelevant to the actual practice of playing games. *My Defence:* The save file plea is *designed* to exploit our capacity for empathy towards represented beings pleading for continued existence. Dismissing this design intent and its common effect is wilfully obtuse. However, this doesn't mean the squeamish player is "right" and the shrugging player is "wrong" *in isolation*; the theory needs to explain *why* such pleas *should* elicit concern, based on the representation (e.g., representing a being with a stake in persistence).

  3.  **The Moral Patienthood Requirement (Defining the Threshold)**
      *   **Motivating Case:** The Sophisticated Monster's Pain/Fear vs. The Farming Sim NPC's Thwarted Goals. Is causing simulated pain inherently worse than repeatedly blocking an NPC from reaching its designated market stall? Is thwarting a goal morally significant only if the NPC *cares* (is represented as caring), or is the mere frustration of a programmed objective enough?
      *   **Requirement:** A theory *must* define what *kind* of represented attributes could potentially grant an NPC the status of a "moral patient" – an entity towards which we *could* have direct moral duties. Does it require represented sentience (capacity for suffering)? Represented interests? Represented agency? Represented persistence/identity? Crucially, it must justify *why* these specific attributes matter, avoiding simple anthropomorphism.
      *   **My Stance:** **Non-negotiable Core.** This is where the rubber meets the road. *My Defence & Stance:* I argue the primary candidate is **represented sentience/suffering** (relevant to the Monster). Represented *interests* (like the Farmer's goals) gain significant moral weight *if and only if* they are tied to a representation of an entity for whom the frustration *matters* (i.e., implies a capacity for negative experience like disappointment or distress, however basic). Mere goal-frustration in a purely mechanical entity (like a thermostat "wanting" 21°C) doesn't cut it. The Save File Plea case heavily implies represented interests in *continued existence/persistence*, which is a powerful form of interest that demands consideration.

  4.  **The Narrative Coherence & Persistence Requirement**
      *   **Motivating Case:** The Save File Plea (again) and persistent NPCs across play sessions or storylines. Deleting a save file where an NPC has built a relationship with the player character feels different to killing a randomly spawned enemy in an arena. An NPC with a life simulated over time (needs, relationships) vs. a one-off encounter.
      *   **Requirement:** A theory *must* account for how an NPC's *persistence and narrative role* within the game world affects its moral status. Does the establishment of a continuous identity or backstory matter? Does the act of deletion, when framed as annihilation within the fiction, carry different weight than "killing" an NPC who respawns?
      *   **My Stance:** **Defended, and Often Crucial.** Persistence and narrative coherence amplify the strength of the representation, making attributes like interests, sentience, or identity more robust and thus harder to dismiss. *My Defence:* The save file plea *explicitly leverages* the player's potential investment in a persistent narrative identity. Destroying something presented as having a continuous existence feels more like annihilation than defeating a temporary obstacle. This coherence strengthens the case for the NPC being a represented moral patient.

  5.  **The Player Duty Requirement (Asymmetry & Containment)**
      *   **Motivating Case:** All cases, but particularly the Save File Plea and the Sophisticated Monster. Can you have a genuine moral *duty* not to cause represented suffering to the Monster, even though it (and its suffering) ceases when the console is off? Is there a duty not to delete the pleading character's save file? Does it matter that the NPC can never reciprocate or impact the player outside the game's magic circle?
      *   **Requirement:** A theory *must* explicitly address the possibility of *direct duties to the NPC itself* (not just indirect duties regarding the player's character or effects on others). Crucially, it must grapple with the fundamental *asymmetry* (the NPC exists only within the representation and cannot affect the real world) and *containment* (the harm is confined to the fictional sphere).
      *   **My Stance:** **Non-negotiable Challenge.** This is the hardest nut to crack and **does the most to exclude candidate views**. Theories that *categorically deny* the possibility of any direct duty to an NPC purely based on its fictional/contained nature (e.g., "It can't really suffer, so no duty") strike me as simplistic and fail the Representation Requirement. *My Defence & Stance:* I argue **yes, such duties *can* conceptually exist** towards the *represented entity*. If we accept that representing sentience matters (Requirement 1 & 3), and that we can have duties regarding our interactions with representations (e.g., not desecrating a meaningful portrait, not cruelly manipulating someone via deepfake), then it's coherent to argue that *within the context of engaging with the fiction*, we can have duties *to the represented being* not to cause it *represented harm*. This duty is framed *by* the fiction and constrained *by* it – it doesn't mean the NPC has rights in the real world. Failing to engage with this possibility renders most intuitions about the Save File Plea or causing gratuitous suffering to a sophisticated NPC inexplicable except as mere sentimentality.

  6.  **The Instrumental Harm Requirement (Beyond the NPC)**
      *   **Motivating Case:** Deliberately torturing the Sophisticated Monster for enjoyment; habitually thwarting and belittling the Farming Sim NPC. Does repeatedly engaging in cruelty towards represented entities, even if they aren't "true" moral patients, risk desensitising the player or reinforcing harmful attitudes that bleed into the real world?
      *   **Requirement:** A theory *must* consider potential *indirect, instrumental harms* that actions towards NPCs might cause to the player or to others in the real world (e.g., normalising cruelty, eroding empathy). However, it must *distinguish* this clearly from direct duties *to* the NPC.
      *   **My Stance:** **Defended, but Distinct and Secondary.** This is important and often relevant, but it's a *different kind* of moral concern. A theory focusing *only* on instrumental harm implicitly denies the possibility of direct duties to the NPC (failing Requirement 5) and reduces the NPC to a tool for player conditioning. *My Defence:* Instrumental harm is a real concern, especially with highly realistic representations. However, a complete theory must account for the intuition that *even if* no desensitisation occurred (say, for a very psychologically robust player), causing intense simulated suffering to a convincingly represented sentient being *within the fiction* might *still* feel morally dubious in a way that goes beyond mere rehearsal. The two concerns (direct duty to representation, indirect consequences) need separate but related treatment.

  **Synthesising the Cases & The Biggest Challenge:**

  *   **Farming Sim NPC (Goals, No Pain):** A theory *must* explain why thwarting mere goals feels less intuitively wrong than causing suffering (linking to Patienthood - sentience vs interests). It might argue that without representation of negative experience, it's just frustrating a mechanism, not harming an agent. *My lean:* Minimal direct moral status unless goals are tied to a representation of caring/experiencing frustration.
  *   **Sophisticated Monster (Pain/Fear System):** A theory *must* engage with the Representation of sentience/suffering and the possibility of a direct duty not to cause it *within the fiction*. Dismissing it as "just code" fails. *My lean:* Significant moral weight due to represented sentience; actions causing gratuitous represented suffering are prima facie wrong *within the fictional engagement*.
  *   **Save File Plea Character:** A theory *must* confront Narrative Persistence, Represented Interests in Existence, Phenomenology, and the Player Duty Requirement head-on. This is the acid test. *My lean:* The strongest case for a direct duty. The explicit representation of a plea for continued existence from a persistent narrative entity creates a powerful moral claim *within the context of that story/game relationship*.

  **The Irreconcilable Tension & The Key Excluder:**
  The **Player Duty Requirement (5)** is the most divisive and does the most to exclude theories. It clashes fundamentally with views insisting moral patients *must* be ontologically independent or capable of real-world impact. **Requirement 1 (Representation)** and **Requirement 5 (Player Duty)** together create the core challenge: Can a *representation* of a being with morally relevant properties (sentience, interests in persistence) generate duties *to that represented being* within the confines of the fictional engagement? Theories denying this *must* explain away the powerful intuitions evoked by cases like the save file plea or sophisticated suffering *without* collapsing into pure subjectivism (violating Requirement 2's spirit) or ignoring representation entirely (violating Requirement 1).

  **My Overall Commitment:**
  I defend a view grounded in **Representation** as primary. An NPC's moral status (if any) derives from the *intentional representational content* created by the developers and interpreted (reasonably) by the player. **Represented Sentience/Suffering** is the most robust basis for significant moral status and potential direct duties (**Patienthood Requirement**). **Narrative Coherence/Persistence** amplifies this, especially regarding interests in continued existence. **Phenomenology** is vital evidence of the representation's effectiveness and moral pull. **Instrumental Harm** is a separate, valid concern but not the primary basis for NPC status. Crucially, I argue it *is* coherent and necessary to accept the possibility of **direct duties *to* the represented entity** within the fictional context (**Player Duty Requirement**), despite the containment and asymmetry – failing to do so renders vast swathes of our engagement with fiction morally incoherent or reducible to mere psychology. This makes the Sophisticated Monster and especially the Save File Plea NPCs serious objects of potential moral concern, while the simple Farming Sim NPC likely isn't, absent further representational depth about its inner life.

  The argument with your friend won't be settled easily, but this framework forces the debate onto the necessary ground: the nature of representation, the grounds of moral patienthood, and the strange, compelling power of persistent fiction. Good luck.
