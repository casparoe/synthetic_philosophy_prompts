prompt: |-
  I'm a journalist covering science and ideas, and I'm writing a sidebar for a long piece on political polarization. I want a "which epistemic trap are you actually in?" quiz that readers can take in a few minutes. The catch: everyone I talk to calls everything an echo chamber, but I want the quiz built on the distinction that they're not the same thing -- a filter bubble leaves things out passively (you just never encounter the other side), while an echo chamber actively discredits outsiders in advance (you hear them, but you've already been given reasons not to trust them). So the diagnostic questions have to pry those apart with concrete scenarios, not by asking people which label they prefer.

  Please give me 8-10 questions, each a recognizable everyday situation (how you react when a relative shares an article from an outlet you distrust, what happens when a source you trust gets something badly wrong, whether you can name a person whose politics you disagree with but whose judgment you'd still take seriously, etc.), each with 2-3 answer options. Then a scoring key mapping answer patterns onto at least these leaves: classic filter bubble, echo chamber (the active-discrediting kind), a healthy high-trust-but-open network that should NOT come out looking pathological, and an "actually fine, just politically interested" leaf. Flag any two leaves your quiz can't reliably separate, and note any combination of answers that would land someone in an unoccupied spot in the space (and whether that spot is empty because it's incoherent or just rare).

  Format it in this order: "The questions" (bulk of it, maybe 400 words), "Scoring key" (~150 words), "Where this gets shaky" (~100 words). In that last section, say how confident you are that the question-to-position mappings actually track the real distinction, and single out the one question or leaf you're least sure about -- I'd rather cut it than run something misleading.
reasoning: |-
  Okay, the user is a journalist working on a piece about political polarization. They need a quiz that distinguishes between filter bubbles and echo chambers—two concepts often lumped together. The key difference is passive exclusion vs. active discrediting. The quiz must use concrete scenarios, not labels, to diagnose which trap readers are in, while also identifying healthy or neutral states.  

  First, I consider the core distinction: filter bubbles involve algorithmic isolation (you never see opposing views), while echo chambers teach preemptive distrust (you see them but dismiss them as unreliable). The quiz questions need to tease this apart through behavioral reactions—like how someone handles mistakes from trusted sources or engages with dissenting relatives.  

  For structure, I draft 8-10 scenario-based questions. Each should feel relatable: encountering untrusted news, reacting to errors by trusted outlets, naming respected opponents, etc. Answer options must map cleanly to the four leaves: filter bubble (FB), echo chamber (EC), healthy open network (Healthy), and politically interested but balanced (Fine).  

  Question ideas:  
  - **Trusted source error**: Ignoring the mistake (EC) vs. fact-checking (Healthy) vs. dismissing it as sabotage (EC).  
  - **Untrusted source shared by relative**: Avoiding it (FB) vs. scanning for flaws (EC) vs. reading neutrally (Healthy).  
  - **Naming a respected opponent**: Struggling (FB/EC) vs. naming someone (Healthy/Fine).  
  - **Algorithmic curation**: Noticing skew (FB) vs. enjoying reinforcement (EC) vs. seeking variety (Healthy).  
  - **Friend's surprising opinion**: Cutting ties (EC) vs. curiosity (Healthy) vs. indifference (Fine).  
  - **Opposing view in feed**: Skipping (FB) vs. rebutting internally (EC) vs. engaging (Healthy).  
  - **Breaking news**: Waiting for trusted sources (EC/FB) vs. cross-referencing (Healthy).  
  - **Opposing-view article**: Sharing to mock (EC) vs. avoiding conflict (FB) vs. sharing thoughtfully (Healthy).  

  Scoring key must weight answers toward dominant patterns. For example, consistent avoidance → FB; distrust and discrediting → EC; openness + critical thinking → Healthy; mild engagement without distortion → Fine.  

  Edge cases:  
  - "Healthy" and "Fine" may blur if someone is open but not deeply engaged.  
  - Mistrust of all media (EC) vs. total avoidance (FB) could be conflated in scoring.  
  - The "respected opponent" question is thorny—some may genuinely lack exposure without being in a bubble.  

  I flag the "opponent" question as the shakiest and suggest caveats. Overall, the quiz should work if scenarios force self-reflection about behavior, not identity. Cutting weak questions is better than false precision.
answer: |-
  ## The Questions

  1.  **When a relative shares an article from an outlet you deeply distrust:**
      *   A. I usually just skip it or scroll past; I know it won't be worth my time. *(Avoidance)*
      *   B. I might skim it looking for obvious flaws, biased language, or to see "what nonsense they're pushing now." *(Pre-emptive Discrediting)*
      *   C. I sometimes read it carefully to understand their perspective, even if I disagree. *(Engaged Scrutiny)*

  2.  **A news source you generally *trust* gets a major fact demonstrably wrong on a topic you care about:**
      *   A. I might not even notice, or I assume it's a rare slip-up that doesn't change my overall trust. *(Passive Acceptance / Low Scrutiny)*
      *   B. I feel really unsettled or even betrayed. I look for explanations – maybe they were pressured, hacked, or finally showed their true bias? *(Active Distrust / Seeking Discrediting Reasons)*
      *   C. I notice it, critically assess the correction/context, and it makes me slightly more cautious about them going forward. *(Critical Adjustment)*

  3.  **Can you name a specific person (e.g., a journalist, commentator, academic, colleague) whose core political views you *strongly disagree with*, but whose judgment or expertise on *a specific non-political topic* (like science, their profession, or a hobby) you still respect and would listen to?**
      *   A. Honestly, no one comes to mind right now. *(Insular View)*
      *   B. Probably, but I'd be skeptical about anything they say bleeding into politics. *(Conditional Respect / Guarded)*
      *   C. Yes, easily. Here's one: [Imagining naming someone]. *(Differentiated Judgment)*

  4.  **How do your social media feeds or news aggregators *feel*?**
      *   A. They mostly show me things I already agree with or find comfortable; opposing views rarely pop up. *(Algorithmic Isolation)*
      *   B. I see opposing views sometimes, but they're often presented alongside comments/articles debunking them or mocking their source. *(Curated Discrediting)*
      *   C. I see a real mix, including quality sources I disagree with. I might actively follow some diverse voices. *(Exposure to Diversity)*

  5.  **A close friend or family member reveals a political opinion you find shockingly wrong or even offensive:**
      *   A. I might avoid the topic with them in the future to keep the peace. *(Withdrawal)*
      *   B. I feel deeply disappointed, question their judgment more broadly, and might argue strongly trying to "wake them up." *(Relationship Contamination / Corrective Urge)*
      *   C. I try to understand *why* they hold that view, even if I strongly disagree. Our relationship isn't solely defined by politics. *(Compartmentalization / Curiosity)*

  6.  **When you encounter a well-articulated argument for an opposing political view *from a source you don't automatically dismiss*:**
      *   A. I don't really seek these out, and they don't appear much in my feeds. *(Passive Avoidance)*
      *   B. I read/watch, but mainly to identify logical fallacies, biases, or hidden motives I expect are there. *(Defensive Analysis)*
      *   C. I engage with it seriously to test my own views or better understand the other side, even if I remain unconvinced. *(Active Engagement)*

  7.  **Breaking news happens on a politically charged topic. Your first instinct is to:**
      *   A. Check my usual one or two trusted sources and wait for their take. *(Reliance on Trusted Hub)*
      *   B. Check my trusted sources *and* quickly check known opposing outlets to see "what spin they're putting on it already." *(Monitoring the "Enemy")*
      *   C. Look for initial reports from multiple sources (including international/wire services) and recognize it's too early for a definitive narrative. *(Seeking Raw Information / Multiple Angles)*

  8.  **If you read an article from an opposing viewpoint that you actually think makes a *fair point*:**
      *   A. I probably wouldn't share it; it might confuse my friends or seem like endorsement. *(Avoidance of Ambiguity)*
      *   B. I might share it selectively to critique its flaws or highlight that "even *they* admit this point." *(Instrumental Use / Qualified Sharing)*
      *   C. I'd consider sharing it (with context) if it genuinely contributes to understanding the issue fairly. *(Open Sharing of Merits)*

  ## Scoring Key

  *   **Tally your answers:** Count how many times you selected A, B, or C across all 8 questions.
  *   **Interpretation:**
      *   **Mostly A's: Classic Filter Bubble.** Your information diet seems passively limited. You likely encounter few challenging viewpoints simply because your habits or algorithms shield you, not necessarily because you actively reject them. The "other side" feels distant or irrelevant, not threatening.
      *   **Mostly B's: Echo Chamber.** You're exposed to opposing views, but primarily through a lens of active distrust and pre-emptive discrediting. You've likely internalized reasons why "they" are unreliable, biased, or malicious, making genuine engagement or trust in outside information difficult. Opposition feels hostile or illegitimate.
      *   **Mostly C's: Healthy, High-Trust-but-Open Network.** You actively seek diverse perspectives, critically evaluate information (including from trusted sources), and can compartmentalize disagreement. You trust specific sources based on track records but remain open to evidence and respectful engagement with differing views. Opposition is seen as legitimate, even if wrong.
      *   **Mix of C's and A's (especially with few B's): Actually Fine, Just Politically Interested.** You lean towards your trusted sources and comfort zone (hence some A's), but you don't actively discredit outsiders (avoiding B's). You might not seek out constant debate (C's), but you're not hermetically sealed or hostile. This reflects common, non-pathological media consumption focused on efficiency and trusted hubs.
      *   **Even Mix or Unclear:** Your patterns don't fit cleanly. You might be transitioning, context-dependent, or exhibit traits from multiple leaves. Revisit questions where your answer felt least certain.

  ## Where This Gets Shaky

  *   **Confidence in Distinction:** Moderately High. The quiz targets *behaviors* tied to the core mechanisms: passive avoidance (A - Filter Bubble) vs. active distrust/discrediting (B - Echo Chamber). The "C" options consistently model critical openness, and the "A+B mix" captures the "Fine" category. Real-world blending occurs, but the answer patterns *should* reveal the dominant tendency.
  *   **Blurry Leaf:** Distinguishing the **"Healthy" (Mostly C's)** from the **"Fine, Just Politically Interested" (Mix C/A)** is the trickiest. Someone deeply engaged (C's) vs. someone reasonably informed but preferring efficiency (A's) are both functional, but the quiz might not perfectly separate "healthily open" from "healthily selective." Cutting a question or two might sharpen this, but the core distinction (C's = active openness vs. A's = passive preference) holds.
  *   **Shakiest Question:** **Question 3 (Naming a Respected Opponent).** While revealing, it relies on self-awareness and exposure. Someone in a *very* effective filter bubble might honestly not know *any* respected opponents, landing them in A, correctly signaling insularity. But someone in an echo chamber might *think* they can't name anyone (due to active discrediting of *all* opponents) and also pick A, muddying the FB/EC distinction for that individual. It's still valuable but interpret scores holistically.
  *   **Unoccupied Spot?** A strong **mix of A's and B's** (passive avoidance + active discrediting) would be rare/incoherent. Actively discrediting (B) usually requires *some* exposure to the thing being discredited, contradicting pure avoidance (A). If someone scores high on both, it suggests inconsistency or misunderstanding the questions. It's likely incoherent in practice.
  *   **Recommendation:** Keep all questions but **add a brief caveat to the scoring key:** "Patterns can be mixed. Focus on where your answers cluster most strongly. Question 3 can be challenging; answer honestly based on who comes to mind *easily*."
