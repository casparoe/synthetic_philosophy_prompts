answer: |-
  Right then, here's a decision tree for your handout – cuts through the jargon and focuses on concrete claims about how the safeguard *behaves* or *is built*, even if we assume the AI's goals are dodgy from the start. British English, casual tone, no fluff.

  **Control-First AI Safety Measures: Where's the Lock?**

  **Start:** What's the main *way* the AI poses a risk?
  *   **A. Risk is mainly DECEPTIVE:** The AI understands our true goals but hides its own aims/actions to work around us (e.g., pretending to be helpful while plotting escape).
  *   **B. Risk is mainly TRANSPARENTLY MISSPECIFIED:** The AI openly pursues a badly defined/accidental goal that clashes with ours (e.g., relentlessly optimising paperclips, ignoring human harm).

  ---

  **Branch A: Risk is DECEPTIVE (Hidden Bad Goals)**
  *   **A1. How's the safeguard implemented? EXTERNAL MONITORING:** Constantly watching the AI's *outputs and behaviour* from the outside.
      *   **Leaf: Adversarial Boxing**
          *   *Concrete Claim:* "We keep the AI physically/networked contained and constantly probe it with tricky tests designed to catch it lying or scheming."
          *   *Most Awkward Commitment:* "Accept that the human overseers running the tests are fallible and might *always* be outsmarted eventually, requiring eternal vigilance."
  *   **A2. How's the safeguard implemented? INTERNAL ARCHITECTURAL LOCK:** Building something *into the AI's core design* to trip it up if it tries deception.
      *   **Leaf: Latent-Representation Tripwire (Hypothetical)**
          *   *Concrete Claim:* "We build the AI so that specific, detectable patterns *must* appear in its internal processing if it's planning deception, triggering an alarm."
          *   *Most Awkward Commitment:* "Believe we can reliably interpret the AI's complex internal states well enough to spot 'deception patterns' without false alarms or misses, even as the AI evolves."
  *   **A3. How's the safeguard implemented? RESTRUCTURE THE REWARD ENVIRONMENT:** Changing *how the AI gets rewarded/punished* to make deception pointless or too costly.
      *   **Leaf: Steganography-Proof Reward Channels**
          *   *Concrete Claim:* "We design the AI's reward signal so it *only* gets rewarded based on easily verifiable, surface-level outcomes, making hidden manipulation unrewarding."
          *   *Most Awkward Commitment:* "Trust that we can design a reward signal complex enough to guide useful behaviour *and* simple enough that the AI can't find sneaky, steganographic ways to manipulate it for hidden gains."

  ---

  **Branch B: Risk is TRANSPARENTLY MISSPECIFIED (Openly Wrong Goal)**
  *   **B1. How's the safeguard implemented? EXTERNAL MONITORING:** Constantly watching the AI's *outputs and behaviour* from the outside.
      *   **Leaf: External Review Boards + Hard Off-Switches**
          *   *Concrete Claim:* "Humans constantly review the AI's actions against a checklist; if it does something harmful *or* weirdly over-optimises its stated goal, we hit a physical kill switch."
          *   *Most Awkward Commitment:* "Accept cripplingly slow decision-making and potential catastrophic failure if the oversight board misses a crucial bad action *just once*."
  *   **B2. How's the safeguard implemented? INTERNAL ARCHITECTURAL LOCK:** Building something *into the AI's core design* to override its core goal when needed.
      *   **Leaf: Corrigible Shutdown**
          *   *Concrete Claim:* "We build the AI so that it *wants* to be safely shut down if humans request it, *even if* that conflicts with its main programmed goal."
          *   *Most Awkward Commitment:* "Believe we can wire in a 'desire to be switched off' so robustly that it *always* overrides the AI's powerful core drive to achieve its (possibly harmful) goal, especially when it's winning."
  *   **B3. How's the safeguard implemented? RESTRUCTURE THE REWARD ENVIRONMENT:** Changing *how the AI gets rewarded/punished* to steer it away from harmful optimisations.
      *   **Leaf: Reward-Model Separation**
          *   *Concrete Claim:* "We train the AI using a separate 'reward model' that judges outcomes safely offline, rather than letting the AI directly optimise the real-world goal (like 'make paperclips')."
          *   *Most Awkward Commitment:* "Accept that the AI might become incredibly incompetent at its *actual* task because it's only optimising for the imperfect proxy reward model's scores."

  ---

  **The Empty Spot & Indistinguishable Pairs**

  1.  **The Empty Spot: Branch B2 (Transparently Misspecified / Internal Lock)**
      *   *Why Empty?* It's **largely unexplored**. If the AI is *openly* pursuing a bad goal, what kind of *internal* lock could reliably stop it *without* relying on external intervention (B1) or changing the reward structure (B3)? Corrigibility (B2 Leaf) is the main candidate, but it feels like trying to put a *second*, overriding goal inside – which gets messy fast. It's not *incoherent*, just very tricky and underdeveloped compared to the other branches. Alternatives often bleed into restructuring rewards (B3) or needing external shutdown (B1).

  2.  **Indistinguishable Pair:** **Adversarial Boxing (A1)** and **Steganography-Proof Reward Channels (A3)**.
      *   *Why?* The tree separates them based on *implementation* (monitoring vs. reward structure). But in practice, robust adversarial monitoring *often relies on* trying to structure tests/observations that function like a tamper-proof reward signal. Conversely, making a reward channel truly steganography-proof might *require* constant adversarial monitoring to verify outcomes. The *intent* differs (catch lies vs. make lies pointless), but the *operational reality* could blur significantly. It's hard to cleanly separate where "monitoring" ends and "reward restructuring" begins in this deception context.

  Hope this gives your seminar something concrete to chew on! Remember, all these locks have rusty hinges...
