prompt: |-
  I'm planning a session for a philosophy reading group of advanced undergraduates who have read Susan Wolf's essay on moral saints but think they have grasped it because they agree that being too good sounds exhausting. I want to teach the specific conceptual claim that maximal moral goodness is undesirable not because it causes burnout—an empirical mistake—but because it structurally crowds out non-moral excellences that are partly constitutive of human flourishing, making the ideal of moral sainthood self-undermining as a life-plan rather than merely difficult.

  Plan the explanatory arc: first, the dependency order—what distinction between being very good and being a moral saint, and between a life-plan and a behavioral pattern, must be in place before the structural point can even appear; second, the carrying example—use an imagined physician who spends every available hour either treating underserved patients or optimizing her epidemiological research to maximize lives saved, and who therefore abandons both the cello she once played and friendships that do not serve her moral efficiency. Explain why this case must include these specific non-moral goods and why it should not be Mother Teresa, Gandhi, or a generic workaholic; third, map the misconceptions in the order they will arise—(1) that Wolf is criticizing people for being too good, (2) that she is defending a right to leisure or selfishness, (3) that she is making an empirical claim about psychological burnout—and state exactly where in the sequence each should be defused; fourth, provide one check question at the end that reveals whether the group has understood the structural argument rather than merely sympathizing with the doctor's lost cello; finally, tell me which part of Wolf's framework—such as her comparison of different motivational models of sainthood—I should explicitly set aside at this level and say I am leaving out.
reasoning: |-
  Okay, the user is planning a philosophy session for advanced undergraduates on Susan Wolf's essay about moral saints. They want to focus on the structural argument—why maximal moral goodness isn't desirable because it crowds out non-moral excellences, rather than just being exhausting. I need to help them build an explanatory arc.

  First, I should outline the key distinctions they need to establish upfront. Wolf's argument hinges on understanding the difference between being "very good" and a "moral saint." The students might conflate these. Also, they need to grasp that a life-plan is about overall structure, not just individual actions. Without these concepts, the structural point won't land. I'll suggest starting the session by defining these terms clearly.

  For the carrying example, the user mentioned an imagined physician. That's smart—using a relatable professional instead of iconic figures like Mother Teresa avoids preconceptions. The physician gives up cello and friendships for moral efficiency. I need to explain why these specific goods matter: cello represents aesthetic excellence (non-moral value), and friendships show relational goods. This makes the crowding-out tangible. Emphasize that burnout isn't the point—it's about what's missing from her life's composition.

  The misconceptions are crucial. Students might think Wolf is criticizing good people (misconception 1), defending selfishness (2), or talking burnout (3). I'll map where to debunk each: misconception 1 during the distinction phase, 2 when presenting the physician case, and 3 after the example to contrast structural vs. empirical claims. Timing this right prevents confusion from snowballing.

  The check question at the end must test structural understanding, not sympathy. Something like: "Could a perfectly rested saint with unlimited energy still be objectionable?" If they say yes—focusing on the narrowness of their life—they get it. If they mention tiredness, they've missed the point.

  Finally, Wolf's motivational models (Loving Saint vs. Rational Saint) are deep but tangential here. The user wants to avoid sidetracking into psychology. I'll note that we're setting this aside to keep focus on the structural argument. 

  The user's deeper need seems to be ensuring students engage with philosophy rigorously, not just surface-level agreement. They might worry about discussions devolving into "being good is hard" anecdotes. By structuring the arc tightly—distinctions first, precise example, preempting misconceptions—the session can elevate their analysis. Also, the physician case subtly avoids gender/culture pitfalls (unlike Mother Teresa), making the logic more universal. 

  I'll wrap this into a clear plan: start with conceptual foundations, unfold the example, dismantle misconceptions in sequence, validate with the check question, and explicitly bracket the motivational models. That should crystallize Wolf's core argument while honoring the user's teaching goals.
answer: |-
  Here’s a structured explanatory arc for your session, designed to clarify Wolf’s conceptual claim and preempt common misunderstandings:

  ---

  ### **Explanatory Arc: Susan Wolf’s Structural Critique of Moral Sainthood**

  #### **I. Foundational Distinctions (15 mins)**  
  *Goal: Establish prerequisites for understanding the structural argument.*  
  - **Distinction 1: "Very Good" vs. "Moral Saint"**  
    - *Very Good*: Committed to morality, but allows substantial space for non-moral pursuits (art, hobbies, friendships).  
    - *Moral Saint (Wolf’s ideal type)*: **Maximally morally good**—moral value dominates all decisions, crowding out competing values.  
  - **Distinction 2: Life-Plan vs. Behavioral Pattern**  
    - *Behavioral Pattern*: Occasional acts of extreme sacrifice (e.g., donating a kidney).  
    - *Life-Plan*: A **structural framework** where non-moral goods are systematically excluded *by design* (not circumstance).  
  - *Key Takeaway*: Wolf critiques the *life-plan* of moral sainthood, not moral behavior itself.  

  > **Preempt Misconception #1** (here): Emphasize Wolf isn’t criticizing "being very good"—she’s rejecting sainthood *as an ideal* for human flourishing.  

  ---

  #### **II. The Physician Case Study (20 mins)**  
  *Goal: Illustrate structural crowding-out with a relatable example.*  
  - **The Scenario**:  
    - A brilliant physician (non-religious, secular context) who:  
      - Works 80 hrs/week at a free clinic for marginalized communities.  
      - Spends all "leisure" time optimizing public health research.  
      - Abandons her lifelong cello practice (despite talent).  
      - Lets friendships atrophy unless they directly serve her mission.  
  - **Why These Specific Goods?**  
    - **Cello**: Represents *aesthetic excellence*—a non-moral good constitutive of a rich life.  
    - **Friendships**: Represent *relational goods*—valuable for their own sake, not instrumentally.  
  - **Why NOT Mother Teresa/Gandhi?**  
    - Their lives are clouded by cultural baggage/hagiography; students may assume hidden non-moral rewards (e.g., spiritual fulfillment). A secular physician avoids this.  
  - **Why NOT a Generic Workaholic?**  
    - Workaholics lack the *moral motivation* central to Wolf’s argument. The physician’s choices stem from moral duty, not ambition or compulsion.  

  > **Preempt Misconception #2** (here): Stress that Wolf isn’t defending "selfishness" but the intrinsic value of non-moral pursuits. The tragedy isn’t lack of leisure—it’s the loss of *meaningful human excellences*.  

  ---

  #### **III. Mapping & Defusing Misconceptions (10 mins)**  
  Address predicted errors in sequence:  
  1. **"Wolf criticizes people for being too good"**  
     - *Defused in Section I*: Distinguish "very good" from "saint" + clarify target is the *ideal*, not individuals.  
  2. **"She defends a right to selfishness/leisure"**  
     - *Defused in Section II*: Frame non-moral goods as *objective constituents of flourishing* (e.g., art, love), not mere preferences.  
  3. **"This is about psychological burnout"**  
     - *Defused after Section II*: **Contrast structural vs. empirical claims**:  
       - "Even if our physician had boundless energy, her life would *still* lack the diversity of goods that make a human life admirable or fulfilling. Burnout is a symptom; structural monomania is the disease."  

  ---

  #### **IV. Check Question (5 mins)**  
  Test for structural understanding (not sympathy):  
  > *"Could a moral saint with unlimited energy and no burnout still lead a life that is (per Wolf) deficient? Why?"*  
  - **Target Answer**: Yes—because even with boundless energy, the *exclusive prioritization of moral value* would still crowd out non-moral excellences, resulting in a "strangely narrow" life (Wolf’s phrase).  

  ---

  #### **V. Explicitly Set Aside: Wolf’s Motivational Models**  
  - **What to Exclude**: Wolf’s contrast between the **Loving Saint** (acts from inclination) and **Rational Saint** (acts from duty).  
  - **Why Omit?**  
    - This distinction explores *psychological feasibility*, not the structural flaw. Your focus is on why sainthood is undesirable *even if psychologically sustainable*.  
    - Mention: "We’re bracketing Wolf’s analysis of motivation to zoom in on her core argument about the *composition* of a good life."  

  ---

  ### **Session Flow Summary**  
  1. **Distinctions** (Life-plan vs. behavior; saint vs. very good) → Preempts Misconception #1.  
  2. **Physician Case** (Loss of cello/friendships) → Preempts Misconception #2.  
  3. **Contrast Structural vs. Burnout** → Preempts Misconception #3.  
  4. **Check Question** → Validates grasp of structural argument.  
  5. **Note Omissions** → Keeps focus on structural critique.  

  This sequence forces engagement with Wolf’s philosophy-as-architecture: the *design* of a life, not its difficulty. By the end, students should see that the problem isn’t that saints are tired—it’s that their lives are "unappealing" (Wolf) because they lack the pluralistic excellence of human flourishing.
