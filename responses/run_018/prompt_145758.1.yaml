answer: |-
  ## Outline of Positions

  **Dr. Aris Thorne (Dr. A - Predictive Anatta):**
  *   **Core Thesis:** Experience arises *solely* from interdependent, hierarchical layers of predictive processing (PP). The Abhidharma skandhas (aggregates) map directly onto these layers (e.g., form = sensory input priors, perception = classification priors, mental formations = complex predictive models). 
  *   **Anatta Twist:** There is no "controller" or "owner" at any level. The *sense* of self/agency is merely a specific, high-level *predictive model* generated *within* the system ("the virtual controller illusion"), arising from the brain's need to predict its own predictive states and actions for behavioural coherence. This model has no ontological status.
  *   **Binding Problem:** Consciousness is the dynamic interplay of these parallel, constantly updating skandha/prediction streams. "Binding" is an emergent property of successful cross-level prediction-error minimisation, not a function performed *by* any single entity. It’s coherence-through-mutual-constraint, not centralised integration.
  *   **Moral Responsibility:** Responsibility is distributed across the entire causal network of predictive processes and environmental couplings. Attributing blame or praise to a non-existent "self" is pragmatically useful shorthand for modifying future predictive models/behaviours within the system and its social context.

  **Dr. Ben Carter (Dr. B - Functional Self-Model Resistance):**
  *   **Core Thesis:** Predictive architectures *necessitate* a highest-level "self-model" as a functional primitive. This model isn't a metaphysical soul but a crucial *organising principle* within the PP hierarchy. It binds lower-level predictions (e.g., body state, intentions, narrative continuity) into a unified stream of subjective experience and enables coherent, goal-directed action *as if* from a single locus.
  *   **Anatta Compatibility:** This self-model *is* empty (anatta) – it's a constructed, dynamic representation, not a thing-in-itself. Denying its *metaphysical* substrate is correct. However, denying its *functional necessity* for coherent experience and agency within the PP framework is incoherent. The model *itself* is the functional "centre of gravity".
  *   **Binding Problem:** The self-model *is* the solution to the binding problem within a PP framework. It acts as the top-level prior that integrates lower-level predictions (e.g., binding the visual prediction of a cup, the tactile prediction of holding it, and the intention prediction of drinking into "I am drinking tea"). Without this top-level integrator, experience fragments.
  *   **Moral Responsibility:** Moral responsibility *requires* the functional reality of the self-model. We hold the *system* accountable *via* its self-model – it's the locus where intentions are formed, actions are evaluated, and social feedback is integrated. Distributed processes *converge* functionally at this level for attribution.

  ---

  ## Philosophical Dialogue: Anatta in the Predictive Mind

  **Setting:** A quiet corner of a university senior common room, afternoon tea. Dr. Aris Thorne (A) and Dr. Ben Carter (B).

  **Aris Thorne (A):** Ben, this predictive processing (PP) framework, applied rigorously to the Abhidharma’s analysis of the skandhas, finally renders the ‘virtual controller’ utterly transparent. It’s not just that there’s no *ātman* behind the curtain; there’s *literally nothing* owning the predictions. Just interdependent streams – rūpa as sensory priors, saṃjñā as classification engines, saṃskāra as complex action-scheme models – all locked in a dance of error minimisation. The ‘I’ feeling? Merely a particularly sticky, high-level *prediction* generated *within* saṃskāra about what the system *will likely do or experience* next. An emergent narrative artefact, not an agent.

  **Ben Carter (B):** (Sips tea) Aris, I admire the parsimony, but you’re throwing the functional baby out with the metaphysical bathwater. Grant that it’s all processes, all the way down – no homunculus. But consider the architecture *demands* a top-level self-model. How else does the visual prediction of this teacup bind seamlessly with the proprioceptive prediction of my arm moving, the intention prediction to sip, and the affective prediction of enjoyment, into *this single, unified moment* of ‘me drinking tea’? Without that highest-level model acting as the ultimate integrator – the functional centre – wouldn’t experience just be a cacophony of semi-independent skandha-streams? That’s not consciousness; that’s disintegration. The self-model *is* the binding prior.

  **A:** Ah, the binding problem! That’s precisely where the Anattā insight cuts deepest under PP. You posit a *single* binder – your ‘integrator’. But why? Coherence emerges from *mutual constraint* across levels. The visual prediction of the cup *constrains* possible hand-shape predictions, which *constrain* motor intention predictions. The ‘me drinking tea’ narrative is a *retrospective label* we slap on the successful cascade of minimised prediction errors across *all* relevant skandha-processes. It’s coherence-through-parallel-resonance, Ben, not top-down integration *by* a self. The sense of unity is the *result*, not the *cause*.

  **B:** Resonance is fine for simple sensorimotor loops, Aris. But for complex, temporally extended agency – planning a lecture, feeling guilt over a missed deadline, maintaining a coherent autobiography – you *need* that top-level model. It’s not retrospective; it’s *prospective* and *directive*. It sets the overarching goals (‘prepare lecture’) that cascade down, shaping lower-level predictions about research, slide design, even my predicted emotional state. It binds past, present, and future into ‘my’ stream. Without that functional locus, how does the system know *which* predictions pertain to *its* ongoing narrative versus random noise? The self-model provides the essential hierarchical context.

  **A:** You’re conflating a *highly complex predictive model* with a *functional locus*. The ‘planning a lecture’ model is indeed a high-level saṃskāra construct, immensely complex, weaving together memory predictions, conceptual predictions, outcome simulations. But it’s *just another model within the network*, constantly updated by errors. Its ‘directive’ power is an illusion born of its position influencing lower-level priors. There’s no separate ‘locus’ directing it all; it’s models all the way down, mutually constraining. Calling it ‘self’ adds nothing but reification.

  **B:** And without that reification – in a purely functional sense – where does moral responsibility land, Aris? If a hurtful remark emerges from distributed prediction loops across vedanā (feeling tone), saṃjñā (misclassification), and saṃskāra (maladaptive models), who is responsible? Your ‘distributed network’? That dissolves into meaninglessness. We hold *persons* accountable. And a person, functionally defined within PP, *is* the operating self-model. It’s the level at which intentions are formed (however constituted), actions are evaluated against social and ethical priors, and feedback (like blame or praise) is metabolised to update future predictions and behaviours. Responsibility *attaches* to the functional self-model because that’s where the system-level coherence for action and evaluation resides.

  **A:** Responsibility attaches to the *entire causal nexus*, Ben, including the social and environmental couplings. Holding ‘the person’ accountable is a powerful *social* prediction – a way of modifying the network’s future states! Saying “*You* were cruel” targets the self-model *within* the system, prompting error signals that update the underlying saṃskāra driving behaviour. It’s an intervention *within* the distributed processes. Attributing it to a mythical ‘owner’ is pragmatically useful fiction, yes, but ontologically empty. True responsibility lies in understanding the causes (the skandhic/predictive conditions) and skilfully altering them – compassionately, without reifying a culprit *or* a controller.

  **B:** But that ‘fiction’ is functionally indispensable! If we truly internalised your radical distribution, Aris, wouldn’t it undermine the very sense of authorship needed for ethical commitment? If ‘I’ didn’t functionally feel like the author of my actions – however constructed that feeling is – why strive to be better? The self-model isn’t just a passive narrative; it’s the active site of striving, of taking ownership *as if* it were real, precisely because that ‘as if’ structure is what generates the commitment loop within the predictive architecture. Deny its functional reality, and you risk ethical paralysis.

  **A:** Ethical paralysis comes from clinging to a fixed self, Ben! The Buddha taught that seeing through the illusion *liberates* ethical action. Recognising actions arise from conditions (prediction loops, skandhic interactions) allows us to change those conditions skilfully, without the crippling weight of permanent ‘I am the sinner’ or the inflation of ‘I am the saint’. Responsibility becomes dynamic, contextual, a matter of tending the garden of causes, not judging an illusory owner. The predictive system learns and adapts *better* without the delusion of a central commander. Coherence emerges, responsibility is enacted, but the centre remains gloriously, functionally empty.

  **B:** (Pauses, considering his teacup) Empty, perhaps, Aris. But not functionless. Perhaps… perhaps the self-model is the emptiness that binds? The necessary functional absence *around* which the streams cohere? I’ll grant it’s not a ‘thing’. But denying its operational centrality feels like denying the hole in the wheel is central to it turning. Without the hole – the functional locus of the axle – the spokes are just scattered sticks. Your parallel streams need *that point of functional convergence* to be a wheel.

  **A:** (Smiles faintly) And the hole, Ben, possesses no inherent existence independent of the spokes, the rim, and the very concept ‘wheel’. The turning is the thing. The coherence *is* the function. Let’s not mistake the useful absence for a necessary presence. The axle turns *through* the hole, but the hole adds nothing. It’s pure dependent origination. The streams *are* the coherence, when seen clearly.

  *(They sip their tea, the debate settling into a thoughtful silence, the common room murmur a backdrop to the unresolved interplay of streams and centres.)*
