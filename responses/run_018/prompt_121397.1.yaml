answer: |-
  Here's your Q&A prep sheet, structured for rapid-fire defense. Objections are phrased like they'll be thrown at you, with tight replies and candid vulnerability notes.

  **Objection 1 (Scanlon Purist):** "You're smuggling aggregation in through the back door! Scanlon's whole point is that morality is about *justification to each individual*. If no single interaction crosses the rejectability threshold, then *by definition*, the collective pattern *is* justifiable to each person. Your 'systemic gap' is just you not liking the outcome – it’s not a *contractualist* failure."  
  **Reply:** "I agree justification must be *to each*, but the failure isn't in the outcome per se, it's in the *structure of reasoning*. When *everyone* acts in a way that's *individually non-rejectable*, yet the cumulative effect creates a world *no one* could reasonably accept (e.g., catastrophic climate change), that reveals a gap in how we model 'reasonable rejectability' itself. The threshold isn't about summing tiny harms; it's recognizing a *system-level property* that emerges only at scale and fundamentally alters the justificatory landscape *for each individual*. We owe it to each other not to create such justification traps."  
  **Vulnerability:** *Conceding:* This *does* stretch Scanlon's "to each" focus. *Soft Spot:* Defining precisely *when* the systemic threshold is breached non-arbitrarily is hard. I'm leaning on "reasonable acceptance of the *world*," not just pairwise interactions.

  **Objection 2 (Rationalist / EA Grad Student - Inefficacy):** "Okay, take voting. My vote has a vanishingly small chance of changing the outcome. The direct harm caused by *my specific vote* is effectively zero – way below any plausible threshold. Why isn't voting morally optional on your view? If you say it's obligatory, aren't you just dressing up rule-utilitarianism?"  
  **Reply:** "Voting *is* the stress test! Here's the distinction: The *harm* of a bad election outcome isn't directly tied to *my vote* in a linear way. But my obligation stems from my role in sustaining a *collective practice* (democracy) that *only works* if enough people participate. *Not voting* when others are cooperating to maintain this essential practice *is* rejectable – it's free-riding. The threshold is crossed at the level of the *practice's viability*, not the individual vote's causal impact. Climate/farming are similar: we're sustaining harmful *systems*, not just causing isolated harms."  
  **Vulnerability:** *Conceding:* This relies heavily on defining the relevant "practice" or "system." *Soft Spot:* Distinguishing this cleanly from a rule-utilitarian argument ("we should follow rules that, if generally followed, produce good outcomes") is tough. My out: Contractualism focuses on *justifiability of participation* in the practice itself to others, not just good outcomes.

  **Objection 3 (Political Philosopher / Institutionalist):** "This feels like moral philosophy trying to do institutional design's job. Isn't your 'systemic gap' really just highlighting the need for *coercive collective action* – laws, treaties, regulations – to solve coordination problems? Why burden individual morality with this when the real failure is political?"  
  **Reply:** "Absolutely, we need institutions! But here's why morality comes first: 1) We need a moral *justification* for creating/using those coercive institutions. Threshold contractualism provides that by showing why *uncoordinated individual behavior* within the harmful system is *collectively unjustifiable*, creating the mandate for collective action. 2) Even *under* imperfect institutions (which we have!), individuals still face choices (e.g., consumption, advocacy, civil disobedience). We need an account of their obligations *within* the broken system. My framework says: you participate in a pattern that, collectively, creates an unjustifiable world."  
  **Vulnerability:** *Conceding:* Institutions *are* crucial; this isn't a substitute. *Soft Spot:* Risk of being overly abstract about individual duties within complex systems. Needs more concrete guidance.

  **Objection 4 (EA with Numbers):** "Let's quantify. Say 1,000,000 people eating beef causes 1 preventable death via climate/system strain. My burger's 'share' is 0.000001 deaths. Expected harm is tiny. Your threshold must be *astronomically* low to catch this, which seems absurdly demanding. If you set it higher, factory farming escapes. How do you set the threshold without arbitrary line-drawing or collapsing into demandingness?"  
  **Reply:** "You're focusing on the *wrong harm*. The primary harm isn't the fractional death 'attached' to my burger. It's my *participation in replicating and sustaining a practice* (industrial animal agriculture) that *as a system* inflicts massive, unjustifiable suffering and ecological damage *that cannot be justified to its victims*. My individual act is rejectable *because* it contributes to upholding *that system*, not because of its micro-consequences. The 'threshold' isn't about the size of *my* causal slice; it's about whether my action helps maintain a system that *itself* operates above the threshold of rejectability."  
  **Vulnerability:** *Conceding:* Setting the *system-level* threshold (what scale of suffering/ecological damage is rejectable?) still requires judgment. *Soft Spot:* This "participation in the system" logic needs careful boundaries to avoid over-demandingness or guilt-by-association.

  **Objection 5 (The Nightmare Question - Collapse/Ad Hoc Distinction):** "This looks *suspiciously* like rule-utilitarianism wearing a contractualist mask. You have a rule ('Don't participate in harmful systems above threshold X'), justified because general compliance produces a better outcome. And your voting vs. climate distinction feels ad hoc – why is democracy a 'practice' I must uphold with my vote, but the fossil fuel economy isn't a 'practice' I must *completely* opt out of? Aren't you just picking which systems matter based on the intuition you want to save?"  
  **Reply:** "Three key differences from rule-util: 1) **Foundation:** Rule-util justifies rules by *good outcomes*. I justify obligations by *non-rejectability* – could individuals affected by the *system* reasonably reject the principle allowing my participation? The victims of climate change/factory farming *can* reject it. 2) **Scope:** Rule-util rules are often general optimizers. My obligations are tied to *specific harmful systems* operating above the justification threshold. 3) **Voting vs. Driving Distinction:** It's not ad hoc. Voting is *constitutive participation* in a *specific, essential, cooperative practice* (democracy) with no direct harm per act. Driving a gas car (usually) *is* direct participation in a harmful *output* (emissions) of a harmful system *and* sustaining demand for it. We can have *degrees* of participation and exit options. The core test: Is my participation in *this specific role/action* reasonably rejectable by those harmed by the *system* it upholds?"  
  **Vulnerability:** *Major Soft Spot:* This is the hardest objection. Distinguishing "essential cooperative practice" (voting) from "harmful system participation" (beef/fossil fuels) relies on normative judgments about the *value* and *nature* of the systems involved, which needs deeper grounding. The "participation" concept is stretched thin here. *Conceding:* The resemblance to rule-util is real; I argue the *justificatory foundation* (rejectability to affected individuals vs. outcome optimization) is the crucial difference, but it's philosophically tense.

  **Quickfire Bonus Objections:**

  *   **"Who defines the threshold? Isn't this hopelessly vague?"**  
      **Reply:** "Like 'reasonable rejectability' itself, it requires judgment. We start with paradigm cases of systemic harm (slavery, genocide) and work outwards. The threshold is crossed when the collective pattern creates conditions *fundamentally incompatible* with anyone being able to justify the world to those living in it." *Vuln: Still fuzzy.*
  *   **"Doesn't this let *really* harmful individual acts off the hook if they miraculously don't cross the threshold alone?"**  
      **Reply:** "No! Large individual harms are *easily* rejectable under standard Scanlonian pairwise tests. Threshold contractualism *adds* obligations for small acts within harmful systems, it doesn't *remove* obligations for large, direct harms." *Vuln: None, this is a strength.*
  *   **"Isn't this just demanding we be saints?"**  
      **Reply:** "No more than Scanlon already can be. It targets *systemic participation*. We need reasonable expectations and fair shares (which institutions should facilitate!). The obligation is to *work towards* changing the system and reduce complicity, not necessarily perfect purity *right now*." *Vuln: Needs more fleshed-out 'fair share' concept.*

  **Remember:** Breathe. Emphasize the *justification gap* and the *system-level property*. Acknowledge tensions honestly. Your core insight is valuable – don't let perfect be the enemy of good. Good luck!
