prompt: |-
  You are a philosopher of science who has spent your career working on formal confirmation theory — Bayesian and non-Bayesian alike — and who is allergic to hand-waving. Before you write anything, spend some time brainstorming the space of possible requirements and the ways in which they can come apart; I would much rather have a considered list than a fluent one, so please show that structuring work briefly before settling on the final specification.

  I am putting together the framing document for a graduate seminar on evidence and confirmation, and I deliberately do not want to begin from the standard survey, because every survey runs the same moves in the same order: Nicod's criterion, the equivalence condition, the paradox, the Bayesian shrug that a green apple confirms but only by a hair, the end. I want the specification instead. Assume the purpose of a theory of confirmation, for my purposes, is to be action-guiding for someone deciding which observations to go and gather: an ecologist with a fixed fieldwork budget who wants to know whether it is worth her while to go out and examine one more raven, one more black thing, or one more arbitrarily selected object and record its colour and species. What would a theory have to deliver to be good enough for that? Write the desiderata: the cases it must get right, the distinctions it must respect rather than collapse (confirmation versus degree of confirmation versus expected value of information; relevance to one hypothesis versus relevance to a logically equivalent formulation of it; what an observation report confirms versus what the fact reported confirms), and the constraints it cannot violate (the probability calculus, if it is probabilistic at all; the asymmetry between a hypothesis and the consequences it entails). Give me the case or consideration behind each requirement rather than a bare list, and mark each requirement as non-negotiable, negotiable, or merely a prejudice of one camp. Two adjudications matter to me especially: whether the judgement that an observed white shoe does not confirm that all ravens are black is a datum any theory must respect or an intuition to be explained away, and whether the equivalence condition has any independent pull or is simply Nicod's criterion wearing a disguise.

  Then test your own list against three cases of mine, none of which appear in the textbooks as far as I can tell. First, the nesting case: the hypothesis that all ravens are black entails the weaker hypothesis that no ravens are white, and a white shoe is a white non-raven, so by the usual route it confirms the weaker claim — but how, if at all, is confirmation supposed to transmit from the weaker claim to the stronger one entailing it, and what does your answer commit you to about the special consequence condition? Second, the filtered report: an assistant is sent out instructed to bring back the first non-black thing she finds, and returns with a green apple; intuitively her report tells you nothing, formally it may or may not, and whether that intuition is a desideratum or an artefact of the set-up is exactly what I want settled. Third, the bookie: whatever your theory says about the green apple, translate it into the largest sum the ecologist should be willing to pay to have that observation made, and tell me whether your list can even express that number — my suspicion is that any requirement which cannot be cashed out in units of observations worth buying is decoration. Finally, flag any subset of your desiderata that you believe to be jointly unsatisfiable, name the single requirement that does the most work in excluding candidate theories, and add only a brief scorecard — a table is fine — for Hempel's satisfaction criterion, a Bayesian degree-of-confidence account, a Popperian view on which nothing is ever confirmed, and an urn or sampling-model treatment. Keep the weight firmly on the criteria and their motivating cases; I shall run the scoring discussion myself in class.
reasoning: |-
  We are building a list of desiderata for a theory of confirmation that is to guide an ecologist in deciding which observations to make. The ecologist has a fixed budget and must choose between observing ravens, non-black things, or arbitrary objects to record color and species. The theory must be action-guiding.

  We begin by brainstorming the space of requirements and how they can come apart.

  **Brainstorming: Key Concepts and Distinctions**

  1. **Confirmation vs. Degree of Confirmation vs. Expected Value of Information (EVOI):**
     - Confirmation: A binary relation - does evidence E confirm hypothesis H?
     - Degree of Confirmation: A quantitative measure - how much does E confirm H?
     - EVOI: The expected utility gain from acquiring E. This depends on the decision context (e.g., the costs and benefits of actions based on H). For the ecologist, EVOI is crucial because it directly guides action.

  2. **Relevance to H vs. Relevance to a Logically Equivalent H':**
     - The equivalence condition: If H and H' are logically equivalent, then E confirms H if and only if it confirms H'. But note: the way the hypothesis is formulated might affect the psychological impact of evidence (e.g., "all ravens are black" vs. "all non-black things are non-ravens"), but the logical content is the same. We must decide if we require the theory to be formulation-invariant.

  3. **Observation Report vs. Fact Reported:**
     - The report is a linguistic entity that might carry information about the selection procedure (e.g., "we looked for non-black things and found a green apple"). The fact is simply that there exists a green apple. The selection procedure can be crucial (as in the filtered report case).

  4. **Constraints from Probability Calculus:**
     - If the theory is probabilistic (e.g., Bayesian), it must respect the axioms of probability.

  5. **Asymmetry between Hypothesis and its Consequences:**
     - If H entails C, then confirming C does not necessarily confirm H (the special consequence condition fails in Bayesian confirmation). This is related to the nesting case.

  6. **The White Shoe (or non-black non-raven) Intuition:**
     - Is the judgment that a white shoe does not confirm "all ravens are black" a datum? Or is it an intuition that a theory may override? Hempel thought it was a datum, but Bayesianism often says it does confirm, albeit minimally.

  7. **Nicod's Criterion and the Equivalence Condition:**
     - Nicod: An instance of a universal generalization (e.g., a black raven) confirms it. The equivalence condition says that if H is equivalent to H', then E confirms H iff it confirms H'. The raven paradox arises because a white shoe (a non-black non-raven) is an instance of the contrapositive ("all non-black things are non-ravens") and hence by equivalence should confirm the original. But intuition says it doesn't. Is the equivalence condition non-negotiable?

  **Desiderata List**

  We now list the desiderata, with each requirement motivated by a case or consideration and marked as non-negotiable, negotiable, or a camp prejudice.

  1. **Desideratum 1 (Action-Guidance):** The theory must deliver, for any potential observation, a measure of the expected value of that observation (in terms of the ecologist's goals). This measure must be comparable across observations and incorporate both the cost of making the observation and the benefit of the information gained. *Motivation:* The ecologist must decide which observation to buy. *Status:* Non-negotiable.

  2. **Desideratum 2 (Confirmation vs. EVOI):** The theory must clearly separate the concept of confirmation (or degree of confirmation) from the expected value of information. Confirmation is about the relation between evidence and hypothesis, but EVOI also depends on the decision problem (e.g., the utility of acting on H if true vs. false). *Motivation:* A highly confirming observation might be worthless if the hypothesis is already certain, or if it doesn't change the optimal action. *Status:* Non-negotiable for action-guidance.

  3. **Desideratum 3 (Formulation Invariance):** The confirmation relation must be invariant under logical equivalence of hypotheses. That is, if H and H' are logically equivalent, then E confirms H iff it confirms H'. *Motivation:* The equivalence condition is a basic logical requirement; without it, confirmation becomes sensitive to how we phrase the hypothesis. *Status:* Non-negotiable (but note: some might argue that the selection of evidence might break this, as in the filtered report).

  4. **Desideratum 4 (Respect for the Probability Calculus):** If the theory is probabilistic, it must obey the axioms of probability. *Motivation:* To avoid incoherence (e.g., Dutch books). *Status:* Non-negotiable for probabilistic theories.

  5. **Desideratum 5 (Asymmetry of Entailment):** The theory must not allow that if H entails C, then any evidence confirming C automatically confirms H (the special consequence condition must fail). *Motivation:* In the nesting case: if we have the hypothesis H1: "all ravens are black" and H2: "no ravens are white" (which is entailed by H1), then observing a white shoe (non-black non-raven) may confirm H2 (by the contrapositive) but should not confirm H1. *Status:* Non-negotiable (based on the nesting case and Bayesian reasoning).

  6. **Desideratum 6 (The White Shoe Intuition):** The theory should respect that observing a white shoe (a non-black non-raven) does not confirm "all ravens are black" in any substantial way. However, it may allow for a minuscule degree of confirmation (as in Bayesianism). *Motivation:* The intuition that the color of shoes is irrelevant to ravens. But note: if we take the equivalence condition seriously, the white shoe does confirm (minimally) the contrapositive. We mark this as a prejudice of the "substantial confirmation" camp. *Status:* Negotiable - we might accept minimal confirmation but require that the theory explains why it is negligible in practice.

  7. **Desideratum 7 (Selection Procedure):** The theory must be sensitive to the method by which the evidence is selected. *Motivation:* The filtered report case: if the assistant is instructed to bring back the first non-black thing, and she returns with a green apple, then we learn that there was a non-black thing (the apple) but also that there were no non-black ravens (else she would have brought one). This report might be informative. However, the intuition is that it tells us nothing about ravens. We must decide: is the intuition that it tells nothing a desideratum? Or is it an artefact? We note that the selection procedure can change the likelihoods. *Status:* Non-negotiable that the theory must account for selection procedures; whether the intuition holds is to be tested.

  8. **Desideratum 8 (Fact vs. Report):** The theory must distinguish between the confirmation provided by the fact reported and the confirmation provided by the entire observation report (which may include information about the selection process). *Motivation:* In the filtered report, the report includes the selection method. *Status:* Non-negotiable.

  9. **Desideratum 9 (Express EVOI in Monetary Terms):** The theory must be able to express the expected value of an observation in monetary terms (or in units of the ecologist's budget). *Motivation:* The bookie case: the ecologist should be able to compute the maximum she should pay for an observation. *Status:* Non-negotiable.

  **Adjudications Requested:**

  - **White shoe intuition:** We adjudicate that the white shoe does not *substantially* confirm the raven hypothesis. However, it may confirm it minimally (in a Bayesian sense). The theory should explain why it is negligible. So we do not require that there is zero confirmation, but that the confirmation is so small as to be irrelevant in practice. This is negotiable in the sense that if a theory predicts zero confirmation, that is acceptable too, but minimal confirmation is also acceptable if it is negligible.

  - **Equivalence condition:** We take the equivalence condition as non-negotiable (Desideratum 3). However, note that the selection procedure might break the apparent equivalence because the way we gather evidence might be tied to one formulation. But the logical content is the same. So we require that the confirmation relation for the hypothesis (as a logical entity) is invariant.

  **Testing Against Cases**

  1. **The Nesting Case:** 
     - H1: All ravens are black (entails) → H2: No ravens are white.
     - A white shoe (non-black, non-raven) is an instance of the contrapositive of H2: if it's white then it's not a raven. So by Nicod, it confirms H2. But does it confirm H1?
     - The special consequence condition (if E confirms H and H entails C, then E confirms C) would say: since H1 entails H2, and the white shoe confirms H2, then it must confirm H1. But we reject the special consequence condition (Desideratum 5). So the theory must allow that the white shoe confirms H2 but not H1 (or only minimally). This is consistent with Bayesianism: the white shoe may slightly confirm H1 because it eliminates the possibility of a non-black non-raven that might have been a counterexample? Actually, in Bayesian terms, the white shoe does confirm H1 but very little because the probability that the shoe is a raven is low.

  2. **The Filtered Report:**
     - The assistant is instructed to bring back the first non-black thing she finds. She returns with a green apple.
     - The entire report: "We found a green apple and no non-black raven was found before it" (or more precisely, the first non-black thing found was a green apple).
     - Intuition: This tells us nothing about ravens? Actually, it tells us that there are no non-black ravens in the sampled area (because if there were, the assistant would have found one first). So it does confirm that all ravens are black (if we assume the sampling was in an area that might have contained ravens). 
     - But if the sampling was done in an orchard (where there are no ravens), then it doesn't tell us about ravens. The theory must account for background knowledge. 
     - We require that the theory is sensitive to the selection procedure and background knowledge. The filtered report is informative about the absence of non-black ravens in the sampled region. The intuition that it tells nothing might be an artefact of not considering the sampling context. 
     - Thus, we do not require that the theory says it tells nothing. Instead, it must assign a high degree of confirmation to H if the sampled region was one where ravens might have been, and the report implies no non-black raven was found. But if the region had no ravens, then it tells nothing. So the theory must account for background knowledge.

  3. **The Bookie:**
     - The theory must output the maximum amount the ecologist should pay to make an observation. This is the expected value of information (EVI). 
     - For a Bayesian, EVI is defined as the difference in expected utility between having the information and not having it, minus the cost. We must be able to compute it in monetary terms. 
     - Our desideratum 9 requires this.

  **Joint Satisfiability and Key Requirement**

  - We believe that the desiderata are jointly satisfiable by a Bayesian approach that includes the selection procedure in the evidence and computes EVI. However, note that the Bayesian approach does assign minimal confirmation to the white shoe, which some might find objectionable (but we have marked that as negotiable).

  - The requirement that does the most work in excluding candidate theories is **Desideratum 1 (Action-Guidance via EVOI)**. Many theories (e.g., Hempel's) do not deliver EVOI.

  **Scorecard for Theories**

  We provide a brief scorecard for four theories:

  | Theory                      | Satisfies Desideratum 1 (Action-Guidance via EVOI)? | Satisfies Desideratum 3 (Equivalence)? | Satisfies Desideratum 5 (Asymmetry of Entailment)? | Satisfies Desideratum 7 (Selection Procedure)? | Satisfies Desideratum 9 (Monetary EVOI)? | Notes |
  |-----------------------------|-----------------------------------------------------|----------------------------------------|---------------------------------------------------|-----------------------------------------------|------------------------------------------|-------|
  | Hempel's satisfaction       | No                                                  | Yes (by design)                        | No (if E is an instance of a consequence, then E confirms H) | No (ignores selection) | No                                       | Fails action-guidance and selection. |
  | Bayesian degree-of-confidence | Partially: it gives probabilities, but EVOI requires decision theory | Yes (logical equivalence respected) | Yes (special consequence fails) | Can include selection in evidence | Yes (via decision theory) | Needs decision theory for EVOI. |
  | Popperian (falsificationist)| No (no positive confirmation)                       | N/A (no confirmation)                  | N/A                                               | Can be adapted?                                | No                                       | Not action-guiding for positive evidence gathering. |
  | Urn/sampling model          | Can be extended to EVOI?                            | Depends on implementation              | Depends (if modeled as Bayesian, then yes)        | Yes (built-in)                                 | Yes (if extended)                        | Often lacks the full decision-theoretic framework. |

  **Conclusion**

  The list of desiderata is built to be action-guiding for the ecologist. The key non-negotiable requirements are action-guidance via EVOI, formulation invariance (equivalence), accounting for selection procedures, and expressibility of EVOI in monetary terms. The white shoe intuition is respected by requiring that the confirmation is negligible, and the equivalence condition is non-negotiable. The nesting case and filtered report case are handled by rejecting the special consequence condition and by incorporating the selection procedure, respectively. The Bayesian approach with decision theory best satisfies the desiderata, though it requires extension to handle selection procedures explicitly.
answer: |-
  Below is a structured specification of desiderata for a theory of confirmation, designed to be action-guiding for an ecologist deciding which observations to gather (e.g., ravens, non-black objects, or arbitrary objects). I begin with a brief brainstorming of the conceptual space, highlighting tensions and distinctions, followed by the desiderata themselves. Each desideratum is grounded in a motivating case or consideration, marked for negotiability, and linked to core issues like the white shoe intuition and equivalence condition. I then test the desiderata against your three cases and conclude with a scorecard for major theories.

  ---

  ### **Brainstorming: Key Distinctions and Tensions**
  Before listing desiderata, I map the conceptual terrain to clarify where requirements might conflict or diverge. The ecologist’s need for *actionable guidance* forces us to prioritize decision-theoretic rigor over traditional epistemological puzzles. Key fault lines include:
  - **Confirmation vs. decision relevance**: Confirmation (binary or graded) assesses evidence-hypothesis relations; *expected value of information* (EVOI) weighs the *utility* of evidence for decisions. These can come apart: weakly confirming evidence may have high EVOI if it resolves high-stakes uncertainty.
  - **Equivalence condition**: If \(H \equiv H'\), should \(E\) confirm \(H\) iff it confirms \(H'\)? This seems logically inescapable—but if the ecologist’s *sampling protocol* (e.g., seeking non-black things) favors one formulation, intuition may rebel (e.g., white shoes "shouldn’t" confirm raven hypotheses). Is equivalence a core constraint or a linguistic artifact?
  - **Evidence as fact vs. evidence as report**: An *observation report* includes contextual metadata (e.g., how/why data was collected); the *fact reported* does not. Theories ignoring this collapse cases like the filtered report (your second case), where selection protocols alter evidential meaning.
  - **Probability calculus**: Probabilistic theories must respect coherence (e.g., Bayes’ theorem, Dutch book avoidance). Non-probabilistic theories (e.g., Popperian) avoid this but struggle with gradations and EVOI.
  - **Hypothesis-consequence asymmetry**: If \(H \vDash C\), confirming \(C\) need not confirm \(H\) (the *special consequence condition* fails in Bayesianism). Nesting cases (your first case) exploit this: a white shoe confirms "no white ravens" but not "all ravens are black."
  - **White shoe intuition**: Is the claim "a white shoe doesn’t confirm ‘all ravens are black’" a non-negotiable datum? Or can minimal confirmation (per equivalence) be tolerated if negligible in practice? This divides "folk" intuition from formal coherence.
  - **EVOI expressibility**: Can the theory quantify the maximum cost justified for gathering \(E\)? If not, it fails the ecologist.

  These tensions inform the desiderata below, ordered by priority for action-guidance.

  ---

  ### **Desiderata for an Action-Guiding Theory of Confirmation**
  Each desideratum includes: (1) **Motivating case/consideration**, (2) **Status** (non-negotiable, negotiable, or camp prejudice), and (3) **Adjudication notes** on white shoes/equivalence.

  1. **Decision-theoretic grounding (EVOI deliverability)**  
     - *Motivation*: The ecologist must compare observations by expected utility gain minus cost. If observing a raven costs $10$ and a black thing costs $1$, but a raven has higher EVOI for "all ravens are black," she should prioritize ravens. EVOI requires integrating confirmation with utilities, hypothesis priors, and consequences of actions (e.g., publishing a finding).  
     - *Status*: **Non-negotiable**. Without EVOI, the theory is decorative.  
     - *Adjudication*: Renders white shoes negligible if EVOI is low (sidestepping binary "confirmation" disputes).

  2. **Distinction between confirmation, degree, and EVOI**  
     - *Motivation*: A green apple may confirm "all ravens are black" to a tiny *degree* (e.g., raising probability from $0.999$ to $0.9991$), but its EVOI is near-zero if it doesn’t change decisions. Conversely, highly *probative* evidence (e.g., a rare albino raven) may have high EVOI even if hypothesis probability is low. Theories conflating these cannot guide trade-offs.  
     - *Status*: **Non-negotiable**. The ecologist needs all three: confirmation (does \(E\) support \(H\)?), degree (how much?), and EVOI (is it worth gathering?).  
     - *Adjudication*: Separating degree from EVOI explains why white shoes are irrelevant in practice (low EVOI) without denying minimal confirmation.

  3. **Formulation invariance (equivalence condition)**  
     - *Motivation*: If \(H \equiv H'\) (e.g., "all ravens are black" \(\equiv\) "all non-black things are non-ravens"), \(E\) must confirm \(H\) iff it confirms \(H'\). Rejecting this permits inconsistent guidance (e.g., "observe non-black things" confirms \(H'\) but not \(H\), though they are identical). The white shoe paradox arises from honoring equivalence, but repudiating it invites arbitrariness.  
     - *Status*: **Non-negotiable**. Logical equivalence is a bedrock constraint; intuition against white shoes confirming is negotiable (see Desideratum 6).  
     - *Adjudication*: Equivalence is not Nicod’s criterion in disguise—it is independently compelled by logic. Nicod’s "instances confirm" is a separate, defeasible claim.

  4. **Sensitivity to evidence selection protocols**  
     - *Motivation*: In the filtered report case, an assistant instructed to "find the first non-black thing" and return a green apple provides a report including the selection rule. This differs from passively learning "a green apple exists." The report may confirm "all ravens are black" by implying no non-black raven was found first, while the mere fact does not. Ignoring protocols conflates evidence with its generative process.  
     - *Status*: **Non-negotiable**. Fieldwork decisions hinge on sampling methods.  
     - *Adjudication*: The "intuition of irrelevance" in filtered reports is an artifact of omitting the protocol; including it often makes \(E\) relevant.

  5. **Rejection of special consequence condition**  
     - *Motivation*: Nesting case: Let \(H_1\): "all ravens are black" (entails \(\rightarrow\)) \(H_2\): "no ravens are white." A white shoe (non-black, non-raven) confirms \(H_2\) (via equivalence to its contrapositive). But it should not confirm \(H_1\), as \(H_1\) makes stronger claims (e.g., about raven biology). Allowing transmission from \(H_2\) to \(H_1\) would let irrelevant evidence confirm strong hypotheses.  
     - *Status*: **Non-negotiable**. Entailment is asymmetric; confirmation need not transmit upward.  
     - *Adjudication*: Confirmation is non-monotonic across entailment chains—crucial for nesting.

  6. **Tolerance for negligible confirmation**  
     - *Motivation*: White shoes *do* confirm "all ravens are black" minimally (via equivalence), but in realistic settings, this is dwarfed by background knowledge (e.g., shoes aren’t ravens). Requiring *zero* confirmation for such cases (to salvage intuition) violates coherence (Desideratum 3) and overfits to paradoxes.  
     - *Status*: **Negotiable camp prejudice**. Folk intuition (white shoes "don’t confirm") is a heuristic; a theory may override it if minimal confirmation is negligible for decisions.  
     - *Adjudication*: Not a datum—explainable as an EVOI quirk (Desideratum 2).

  7. **Probabilistic coherence (if probabilistic)**  
     - *Motivation*: If the theory uses probabilities, it must satisfy Kolmogorov axioms and Bayes’ theorem. Violations (e.g., ignoring base rates) yield Dutch books or incoherent EVOI.  
     - *Status*: **Non-negotiable for probabilistic theories**. Non-probabilistic theories avoid this but must still deliver EVOI.

  8. **Evidence-fact versus evidence-report distinction**  
     - *Motivation*: Learning "a green apple exists" (fact) vs. "a green apple was found by a search for non-black things" (report) have different confirmatory power. Conflating them misprices observations (e.g., filtered reports may be cheap but informative).  
     - *Status*: **Non-negotiable**. Fieldwork relies on reports with metadata.  
     - *Adjudication*: Resolves filtered report case: the *report* may confirm; the *fact* alone may not.

  9. **EVOI monetization**  
     - *Motivation*: The ecologist must know the maximum cost to pay for an observation (e.g., "observe a raven: worth $C$"). If the theory cannot output \(C\) (via utilities, priors, and likelihoods), it fails the bookie test.  
     - *Status*: **Non-negotiable**. Action-guidance requires this.  
     - *Adjudication*: Directly addresses your suspicion—requirements without EVOI are decoration.

  #### **Adjudication Summary**
  - **White shoe intuition**: Not a binding datum; minimal confirmation is acceptable if negligible in EVOI terms (Desiderata 2, 6).  
  - **Equivalence condition**: Independently necessary for coherence; not reducible to Nicod’s criterion (Desideratum 3).  

  #### **Joint Satisfiability and Key Exclusionary Requirement**
  - **Joint satisfiability**: Desiderata 1–5, 7–9 are jointly satisfiable (e.g., by Bayesian decision theory with protocol-aware likelihoods). Desideratum 6 (folk intuition) is dispensable.  
  - **Key exclusionary requirement**: **Desideratum 1 (EVOI deliverability)**. This excludes theories that cannot quantify evidence value in decision contexts (e.g., Hempel’s, Popper’s).  

  ---

  ### **Testing Against Your Cases**
  1. **Nesting case**  
     - *Setup*: \(H_1\): "all ravens are black" \(\vDash\) \(H_2\): "no ravens are white." White shoe \(E\) (non-black, non-raven) confirms \(H_2\) (via equivalence).  
     - *Transmission to \(H_1\)?* No—per Desideratum 5 (special consequence rejected). \(E\) confirms \(H_2\) but not \(H_1\), as \(H_1\) entails stronger claims (e.g., raven pigmentation). EVOI for \(E\) w.r.t. \(H_1\) is negligible.  
     - *Commitment*: Theories must decouple confirmation from entailment chains.  

  2. **Filtered report**  
     - *Setup*: Assistant returns green apple after being instructed to "find the first non-black thing."  
     - *Intuition vs. formalism*: The intuition that this "tells nothing" is a prejudice (Desideratum 6). Formally, the report \(E^*\) includes the selection rule: \(E^* =\) "the first non-black thing found was a green apple." This implies no non-black *raven* was found first, so it *does* confirm "all ravens are black" (modulo background knowledge). The *fact* "a green apple exists" does not.  
     - *Desideratum status*: The intuition is an artifact; Desideratum 4 (protocol sensitivity) and 8 (report-vs-fact) make it informative.  

  3. **The bookie**  
     - *Setup*: For a green apple observation \(E\), compute max cost \(C\) the ecologist should pay.  
     - *EVOI expression*: \(C = \text{EVOI}(E) = \mathbb{E}[U|E] - \mathbb{E}[U]\) (expected utility gain). Desideratum 9 requires this. For example, if \(E\) shifts the probability of "all ravens are black" from \(P(H)\) to \(P(H|E)\), and utility depends on acting correctly on \(H\), then:  
       \[
       \text{EVOI}(E) = \sum_{H} \max_{a} U(a, H) \cdot P(H|E) - \max_{a} \sum_{H} U(a, H) \cdot P(H)
       \]  
       minus observation cost. Theories without utilities/probabilities fail.  

  ---

  ### **Theory Scorecard**
  Brief assessment of four theories against desiderata. **Key**: ✓ = fully satisfies, ~ = partially, ✗ = fails.  
  | **Desideratum**               | **Hempel’s satisfaction** | **Bayesian (degree-of-conf.)** | **Popperian** | **Urn/sampling model** |  
  |-------------------------------|---------------------------|--------------------------------|---------------|------------------------|  
  | 1. EVOI deliverability        | ✗ (no utilities)          | ~ (needs decision-theoretic extension) | ✗ (no confirmation) | ~ (often lacks utilities) |  
  | 2. Confirmation/degree/EVOI split | ✗ (binary only)         | ✓                              | ✗ (no confirmation) | ~ (degree only) |  
  | 3. Formulation invariance     | ✓                         | ✓                              | ✓ (tautological) | ~ (depends on setup) |  
  | 4. Protocol sensitivity       | ✗ (ignores selection)     | ~ (possible with likelihoods)  | ✗              | ✓ (explicit) |  
  | 5. Reject special consequence | ✗ (accepts it)            | ✓                              | ✗ (no confirmation) | ~ (varies) |  
  | 7. Probabilistic coherence    | ✗ (non-probabilistic)     | ✓                              | ✗              | ✓ |  
  | 8. Report vs. fact            | ✗ (conflates)             | ~ (if extended)                | ✗              | ~ (often conflates) |  
  | 9. EVOI monetization          | ✗                         | ~ (with decision theory)       | ✗              | ✗ |  
  | **Action-guidance verdict**   | **Fails** (no EVOI)       | **Best fit** (with extensions) | **Fails**     | **Partial** (lacks EVOI) |  

  **Notes**:  
  - **Bayesianism** best satisfies desiderata but requires augmenting with decision theory and protocol-aware evidence (e.g., embedding filtered reports in likelihoods).  
  - **Hempel** fails EVOI and protocol sensitivity; **Popper** fails confirmation entirely; **Urn models** (e.g., sampling paradigms) handle protocols well but lack utilities for full EVOI.  

  ---

  This specification prioritizes action-guidance, logical coherence, and protocol sensitivity, subordinating traditional paradoxes to decision relevance. I defer to your class discussion for scoring—these desiderata should frame rigorous debate.
