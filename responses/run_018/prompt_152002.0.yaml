  The challenge is staying focused on Carnap's internal logic. I must avoid saying things like "this makes planning meaningless" based on my own beliefs. Instead, I'll show how his meta-ethics constraints force this outcome. For example, if all value judgments are non-cognitive, then even democratic agreement doesn't make them rational—it just makes them popular.

