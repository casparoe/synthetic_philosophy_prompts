  Friedman’s F-twist is their starting point, but they’re already hinting at nuance with their "structural vs. decorative" distinction. That’s key—it shows they intuit that not all inaccuracies matter equally. Their hidden need? Confidence. They don’t want to rubber-stamp nonsense or reject useful models over harmless simplifications.  

  Brainstorming distinctions: The critical ones are (1) whether the assumption *drives* the model’s output (structural) or is just placeholder (decorative), (2) whether prediction has been tested against reality (F-twist’s core), and (3) whether the flaw masks bias (like that traffic model’s "rational commuters" hiding political motives). What can drop? Philosophical debates about scientific realism—irrelevant here.  

  The procedure must be step-by-step, fail-fast, and flag value judgments. It should force consultants to justify assumptions, not the board to play detective. And one test case must annoy the user—likely the flood model, where uniform soil *might* be defensible if predictions hold, but they’ll hate admitting it.  

  Structure: Start with a verdict ("Yes, but..."), then the steps, then apply to their three cases. The flood model passes if evidence shows it works despite soil simplification; air-quality fails if identical mileage skews pollution hotspots; traffic model gets rejected for bias masked as rationality.  

  Biggest risk: Oversimplifying. The procedure can’t magically reveal truth—it just forces transparency. I’ll say that outright. Also, step 4 (bias check) is totally subjective, but I’ll call it out as a "judgment call dressed as rule."  

  User’s unspoken fear? Being hoodwinked by consultants. The procedure’s power is in shifting burden: *Make them prove it’s not broken.* If they can’t, rejection is easy.  

