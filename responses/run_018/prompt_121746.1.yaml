  Final touch: Emphasize where the procedure stops. If bias is suspected but unproven (step 4), it flags for human debate—no algorithmic purity here. That’s honest.
answer: |-
  **Bottom-line verdict:** Yes, Friedman's F-twist can be operationalized for non-experts via a four-step test prioritizing predictive evidence and bias screening over realism per se, but it cannot resolve hidden political agendas without external scrutiny.  

  **Core Distinctions Retained**:  
  1. **Structural vs. Decorative Assumptions**: Does the assumption *directly shape* key outputs (structural), or is it a harmless simplification (decorative)? *Crucial—drops if unlinked to predictions.*  
  2. **Predictive Performance**: Does evidence show the model works despite unrealistic inputs? *Non-negotiable for F-twist.*  
  3. **Bias Potential**: Could the assumption skew results toward a pre-determined outcome? *Essential for public accountability.*  
  **Dropped Distinctions**:  
  - Epistemological debates (e.g., "What is reality?").  
  - Assumption complexity (e.g., "How" unrealistic it is).  
  - Long-term model adaptability.  

  ---

  ### **Decision Procedure: The ASSESS Test**  
  *(Run sequentially; stop at any rejection.)*  

  1. **ASK: "Is this assumption *necessary* for the model’s key conclusion?"**  
     - *Sufficient answer*: Consultant identifies the variable the assumption controls (e.g., "Soil uniformity simplifies permeability calculations").  
     - *Rejection*: If the assumption is irrelevant to outputs (e.g., "Decorative" details like tree species in a traffic model).  
     - *Judgment call*: None—this is factual.  

  2. **ASK: "What *evidence* supports the model’s predictions in *our county*?"**  
     - *Sufficient answer*: Data from local pilot studies, historical validation, or peer-reviewed calibration (e.g., "Flood predictions matched 8/10 past events within 10% error").  
     - *Rejection*: If no empirical support exists ("We used industry standards") or errors exceed practical tolerance (>20% divergence from reality).  
     - *Judgment call*: Defining "practical tolerance" (default: >20% error).  

  3. **ASK: "Could realistic variation in this assumption *materially change* the recommendation?"**  
     - *Sufficient answer*: Sensitivity analysis showing outcomes are robust (e.g., "Air-quality rankings unchanged even with ±30% mileage variation").  
     - *Rejection*: If small changes flip the outcome (e.g., "Traffic model recommends expansion only if >95% take shortest route").  
     - *Judgment call*: Assessing "materiality" (e.g., >10% outcome shift).  

  4. **ASK: "Does this assumption *mask values or bias*?"**  
     - *Sufficient answer*: None—this is a *values* checkpoint.  
     - *Approval*: If no suspicion of manipulation (e.g., uniform soil lacks political stakes).  
     - *Hand to human judgment*: If the assumption favors a partisan outcome (e.g., "Rational commuters" justifying a road project).  
     - *Judgment call*: Entirely values-based—flag for board debate.  

  **What the Procedure Cannot Do**:  
  - Prove a model is "true"; only assess practical adequacy.  
  - Detect subtle academic fraud.  
  - Replace domain expertise for novel risks.  

  ---

  ### **Worked Applications**  

  **Case 1: Flood Model (Uniform Clay Soil)**  
  1. **Necessary?** Yes—soil permeability directly affects runoff calculations.  
  2. **Evidence?** Consultant shows model accurately predicted 2018/2021 floods. → **APPROVE**.  
  *Why you won’t like it*: Soil isn’t uniform, but evidence overrides your instinct to reject.  

  **Case 2: Air-Quality Model (Identical Annual Mileage)**  
  1. **Necessary?** Yes—mileage impacts emissions.  
  2. **Evidence?** No local validation; relies on state averages.  
  3. **Material change?** Sensitivity test: ±20% mileage shifts pollution hotspots by 2 miles. → **REJECT** (fails Step 2).  

  **Case 3: Traffic Model ("Rational" Shortest-Route Commuters)**  
  1. **Necessary?** Yes—route choice dictates congestion.  
  2. **Evidence?** Model predicts observed commute times within 15% error.  
  3. **Material change?** Realistic habit variations (e.g., school drop-offs) increase travel time 25%—expansion not justified. → **REJECT** (fails Step 3).  
  4. **Bias?** *Hand to human judgment*: Assumption supports a contested road project. Debate political motives.  

  ---  
  **Final Note**: This systematizes F-twist by demanding proof, not faith. Step 4 explicitly outsources values conflicts—where your board’s role is vital.
