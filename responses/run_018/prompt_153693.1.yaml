rent tension dissolves—perhaps because aggregation and individual decision operate in different normative registers—leaving the standard argument untouched. The scope must be realistic for six weeks with no data collection. Do not include a bibliography or citation list; I will add references. Please write this as a polished proposal with the question stated precisely, the gap in existing answers explained, the conceptual approach justified against obvious alternatives, the result and failure conditions specified, and an honest assessment of scope.
