answer: |-
  Your description captures a sophisticated and distinct form of resistance to the extended mind thesis (EMT), which indeed diverges from standard objections. While not universally *named* in the literature, this position can be precisely defined as the **Internalist Normative Grounding Requirement** (INGR). Below is a conceptual dissection:

  ### Core Definition of INGR
  - **INGR**: The claim that only biologically internal states (e.g., neural processes) can possess the *normative or epistemic properties* essential to cognition (e.g., justification, rational revisability, or "epistemic binding"). External artefacts, even when functionally equivalent to internal cognitive states, are denied mental status because they lack this normative authority. Location (intracranial/biological) is treated as a *metaphysical precondition* for acquiring such properties, irrespective of functional parity.

  ### Distinction from Common Objections
  1. **Coupling-Constitution Fallacy**:  
     - Standard objection: Mistaking causal coupling (external tools *influencing* cognition) for constitutive membership *in* cognition.  
     - INGR contrast: **Concedes functional-constitutive equivalence** but denies that constitution suffices for mentality. Normative properties are location-bound.  

  2. **Trust/Glue Conditions** (e.g., Clark & Chalmers' criteria):  
     - Standard objection: External resources fail to meet conditions like reliability, accessibility, or automatic endorsement.  
     - INGR contrast: **Grants that glue conditions are satisfied** (e.g., the notebook is trusted, instantly accessible). Rejects mentality on deeper normative grounds (e.g., "The notebook isn’t *subject* to rational norms in the way beliefs are").  

  3. **Biological Internalism**:  
     - Standard objection: Cognition *must* be biologically realized (e.g., by neurons).  
     - INGR contrast: **Agrees biological internality is necessary**, but frames this as a requirement for *normative status*, not merely implementation. For example, "Internal states are where epistemic *responsibility* resides; the notebook is merely a tool we use, not part of *us* as rational agents."

  ### Boundary Cases Clarifying INGR
  - **Case 1 (INGR Applied)**:  
    A mathematician’s bespoke notebook is functionally identical to her biological memory. INGR denies it is part of her mind because "only the brain can *ground* the normative force of mathematical beliefs (e.g., the obligation to correct contradictions)."  
  - **Case 2 (Non-INGR Internalism)**:  
    A neuroprosthesis implanted in the skull perfectly replicates hippocampal function. INGR *accepts* this as mental (location satisfies normative grounding), whereas strict biological internalism *rejects* it (non-neural hardware).  
  - **Case 3 (Glue Conditions Met but INGR Denied)**:  
    A clinician’s diagnostic database is seamlessly integrated (automatically consulted, trusted, infallible). INGR still rejects it: "The database *informs* judgements but isn’t *answerable* to epistemic norms like internal knowledge is."  

  ### Does INGR Collapse into Familiar Objections?  
  No—it is a **distinct failure mode** in EMT debates:  
  - It is **not merely intuitive internalism**, which typically relies on unexamined biases ("cognition *feels* internal"). INGR offers a principled (though contested) claim: normative properties *supervene* on biological internality.  
  - It **avoids functionalist rebuttals**: By granting functional parity, it sidesteps arguments that mentality is defined by causal roles. Instead, it posits a *non-functional*, metaphysical condition for normativity.  
  - **Collapse risk?** Only if normative authority is *reducible* to glue conditions or biology. But INGR treats normativity as a sui generis feature arising *because* states are internal, making it resilient to standard EMT replies.  

  ### Why INGR Stands Apart  
  This objection elevates a **meta-epistemic premise**: that the *capacity to bear rational obligations* (e.g., "I *ought* to revise my belief if contradictory") requires intracranial presence. The artefact, being "outside the space of reasons," lacks genuine *mindedness*—even when functionally indistinguishable. It targets EMT’s core ambition to dissolve the "skin-and-skull barrier," insisting the barrier is normative, not functional.  

  In essence, INGR is a **location-gated normativity** argument. It reflects a deeper internalist conviction: that being a cognitive agent—a subject of epistemic norms—demands biological embodiment. Whether this holds depends on contesting the link between internality and normativity itself.
