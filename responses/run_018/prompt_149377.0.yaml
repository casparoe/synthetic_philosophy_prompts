answer: |-
  Your "normative bootstrap" challenge is sharp, but it misunderstands the historical specificity and *unintended* nature of the causal sequence Weber describes. Let me reconstruct the mechanism: 

  The initial Calvinist doctrine of predestination generated profound *psychological anxiety* – a unique motivational crisis among believers desperate for any sign of election. This anxiety *preceded* systematic capital accumulation. Asceticism-in-the-world wasn't a rationalization for wealth; it was a *prescribed method* to alleviate unbearable uncertainty. The crucial point is that this behavioral imperative – methodical work and reinvestment driven by religious terror – was unleashed *before* the economic consequences became culturally legible. The causal efficacy lies in this initial, non-economic trigger altering *action orientations*. 

  Later doctrinal shifts (interpreting success as a sign of grace) represent the ethic's adaptation, but this doesn't erase its prior causal role. Think of a catalyst: it initiates a reaction, changes form during the process, yet remains essential to the outcome. Material conditions provided fertile ground, but the specific *form* of rational capitalism – disciplined, reinvestive, imbued with worldly vocation – required the distinct motivational structure cultivated by this specific religious anxiety. Without that initial, value-driven *reorientation* towards work-as-calling, why didn't materially similar contexts (e.g., Renaissance Italy, Imperial China) spontaneously generate the same relentless, systematic accumulation? The doctrine wasn't infinitely plastic *ab initio*; its core tenets (predestination, the imperative for active proof) constrained the initial behaviors that set the process in motion. The "bootstrap" pulls *from* a pre-existing theological framework, not thin air.

  **Confidence:** I am **highly confident** (9/10) that this defense preserves causal independence for the value complex *in the originating phase*.  
  **Least Certain Point:** The precise historical demarcation between the "initial anxiety-driven phase" and the "later rationalization phase" can be empirically murky; demonstrating the *temporal priority* of the psychological mechanism over widespread accumulation in specific communities requires meticulous archival work, which critics rightly scrutinize. I concede the evidence isn't always crystalline.
