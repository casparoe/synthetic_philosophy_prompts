prompt: |-
  I serve on the ethics oversight committee for a regional health authority that recently adopted automated risk-scoring tools to allocate scarce specialist appointments, and I have just been appointed to sign off on every proposed rule. Our committee meets monthly, each proposal receives roughly forty-five minutes of review, none of my fellow members have formal philosophical training, and I have become convinced that justifying allocation rules by forecasting direct welfare outcomes—who survives, who suffers—is both epistemically fragile and politically unstable. I want a reusable decision procedure, grounded in indirect normativity and idealized deliberation, that translates justification through principles rather than results: a rule is acceptable only if no affected party could reasonably reject the principle underlying it under conditions in which direct outcome predictions are bracketed but informational and positional knowledge is not arbitrarily suppressed.

  To prevent the procedure from collapsing into familiar Rawlsian original-position reasoning or standard Scanlonian contractualism—frameworks my colleagues have already encountered—I want two specific refinements built in. First, a “deliberative residue” step: after bracketing all direct outcome-based reasons, we must audit whether the remaining reasons for or against the rule depend on hidden indexical commitments—implicit assumptions about which social role a party occupies—that survive the bracketing only because suppressing outcome data also obscured positional information. Second, a “second-order exclusion” audit: we must list every consideration excluded from deliberation not because it is irrelevant but because it is contested, then ask whether that very act of exclusion could itself be reasonably rejected by someone holding only generic and legitimate positional reasons.

  Please construct the procedure as an ordered checklist with explicit stopping rules: the questions to ask in sequence, what counts as a sufficient answer to each, where the procedure terminates with a clear “no,” where it terminates with a conditional “yes, subject to revision,” and where it explicitly hands the decision to a human judgment call because the issue is one of values rather than procedural validity. Include a small, reusable set of test sentences or framing questions that a non-specialist can apply consistently within the time constraint.

  Then run the procedure on three proposals: (1) a rule that ranks referred patients by predicted recovery rate and allocates specialist slots downward; (2) a pure lottery that assigns every referred patient an equal chance regardless of prognosis; and (3) a rule reserving fifteen percent of slots for healthcare workers, defended on the grounds that maintaining workforce capacity benefits all patients. For case (2), report the result that the procedure likely endorses—equal non-rejectability—despite its direct conflict with the authority’s welfare-maximizing goals, and explain precisely what the procedure can and cannot say about that conflict.

  Please also specify the practical constraints—time per case, required sign-off, absence of philosophical expertise—and flag the points where the procedure is most likely to misfire or generate false positives, particularly where the bracketing of outcome knowledge might illegitimately conceal structural disadvantage. Finally, state how confident you are in this translation from theory to operational checklist, and single out the one step—the bracketing of outcome predictions, the treatment of positional reasons, or the second-order exclusion audit—about which you are least certain.
reasoning: |-
  We are constructing a decision procedure for evaluating allocation rules in healthcare resource distribution. The procedure is based on the idea that a rule is acceptable only if no affected party could reasonably reject the principle underlying it under specific conditions. The conditions include bracketing direct outcome predictions (like who survives or suffers) while retaining informational and positional knowledge. We are to avoid collapsing into standard Rawlsian or Scanlonian frameworks by including two refinements: a "deliberative residue" step and a "second-order exclusion" audit.

  The procedure must be an ordered checklist with stopping rules. We'll design a step-by-step process with clear questions and conditions for termination (either a clear "no", a conditional "yes", or a hand-off to human judgment). We must include a small set of test sentences or framing questions for non-specialists to use within the 45-minute time constraint.

  Then we'll apply the procedure to three proposed rules.

  **Proposed Rules:**
  1. Rule 1: Rank referred patients by predicted recovery rate and allocate specialist slots downward (i.e., to those with higher recovery rates).
  2. Rule 2: Pure lottery - equal chance for every referred patient regardless of prognosis.
  3. Rule 3: Reserve 15% of slots for healthcare workers, defended on the grounds that maintaining workforce capacity benefits all patients.

  **Practical Constraints:**
  - Time per case: 45 minutes
  - Committee members: No formal philosophical training
  - Required sign-off: The committee must review and the user (as appointed) must sign off.

  **Designing the Checklist:**

  We'll break the procedure into steps. At each step, we ask a question and specify:
  - What counts as a sufficient answer?
  - Stopping rules: when to stop with a "no", a conditional "yes", or hand off to human judgment.

  **Checklist: Ethical Rule Evaluation Procedure (EREP)**

  **Step 0: Preparation**
  - Clearly state the proposed rule and the principle underlying it (as provided by the proposer).
  - Identify the set of affected parties (e.g., patients, healthcare workers, the public).
  - Ensure that the principle is stated in a form that is general (i.e., it does not refer to specific individuals or outcomes) and that it is the principle being used to justify the rule.

  **Step 1: Bracketing of Direct Outcome Predictions**
  - **Question:** Can we state the principle underlying the rule without reference to any direct outcome predictions (i.e., without mentioning specific welfare outcomes such as recovery rates, survival, suffering, or overall utility)? If not, rephrase the principle to exclude such references, or if impossible, note that the rule is outcome-justified and proceed to Step 1b.
  - **Sufficient Answer:** The principle must be restated without any direct outcome predictions. If this is impossible, then the rule is rejected because it relies solely on outcome-based justification, which is excluded by the procedure's foundation.
  - **Stopping Rules:**
    - If the principle cannot be restated without outcome predictions, then the rule is **rejected** (clear "no"). Stop.
    - If it can be restated, proceed to Step 2.

  **Step 1b (if needed): Outcome-Justified Rule Handling**
  - If the rule was rejected in Step 1 because it relies solely on outcome predictions, then note that the rule fails the procedure's requirement. However, if the committee believes there are exceptional circumstances, they may note this and proceed, but the rule is not approved by this procedure. The committee must then decide based on other considerations (outside the procedure). But by default, the procedure stops with a "no".

  **Step 2: Deliberative Residue Audit**
  - **Question:** After bracketing direct outcome predictions, examine the reasons that remain for or against the rule. Do any of these reasons depend on hidden indexical commitments? (That is, do they implicitly assume a particular social role or position, and would that assumption be revealed only if we had not suppressed outcome data? We are looking for reasons that survive the bracketing because suppressing outcomes also obscured the positional information that would have made the indexicality apparent.)
  - **Test Sentence/Framing Question:** "Does the reason make sense only if we assume the person evaluating it is in a particular social role (e.g., a patient, a healthcare worker, a taxpayer) and that this role is not being explicitly acknowledged in the deliberation?"
  - **Sufficient Answer:** If any reason is found to depend on a hidden indexical commitment, then we must flag it and note that the principle may be biased. We then ask: Can the principle be restated to remove this hidden indexicality? If not, the rule is rejected.
  - **Stopping Rules:**
    - If hidden indexical commitments are found and cannot be removed by restating the principle, then the rule is **rejected** (clear "no"). Stop.
    - If none are found, or if they can be removed by restatement, proceed to Step 3.

  **Step 3: Second-Order Exclusion Audit**
  - **Question:** List all considerations that have been excluded from deliberation (so far) because they are contested (i.e., they are not excluded because they are irrelevant, but because they are in dispute and we are bracketing them to avoid outcome-based reasoning). Then, for each excluded consideration, ask: Could the act of excluding this consideration itself be reasonably rejected by someone holding only generic and legitimate positional reasons? (Generic and legitimate positional reasons are reasons that anyone in that position might have, without relying on contested ethical views.)
  - **Test Sentence/Framing Question:** "If we are excluding consideration X, would a person in position Y (where Y is a generic position) have a legitimate reason to object to that exclusion because it ignores a fundamental aspect of their situation that is not tied to a contested ethical view?"
  - **Sufficient Answer:** If any exclusion is found to be reasonably rejectable by someone with generic and legitimate positional reasons, then the exclusion is problematic and the rule must be revisited. We then ask: Can the principle be adjusted to include that consideration without reintroducing outcome-based reasoning? If not, the rule is rejected.
  - **Stopping Rules:**
    - If a problematic exclusion is found and cannot be addressed, then the rule is **rejected** (clear "no"). Stop.
    - If no such exclusions are found, or if they can be addressed by adjusting the principle, then proceed to Step 4.

  **Step 4: Reasonable Rejectability Test**
  - **Question:** Under the conditions of the procedure (bracketing outcome predictions, with no hidden indexicality and no problematic exclusions), can we imagine any affected party reasonably rejecting the principle? We must consider each generic affected party (e.g., a patient with a severe condition, a patient with a mild condition, a healthcare worker, a member of the public) and ask if they have a reason to reject the principle that is not based on outcome predictions and that is not itself reasonably rejectable by others.
  - **Test Sentence/Framing Question:** "Would a person in [generic position] have a reason to reject this principle that others, in their positions, could not reasonably reject as a basis for governing the distribution?"
  - **Sufficient Answer:** If we can identify such a reason that is not overridden by the reasons of others, then the principle can be reasonably rejected and the rule is rejected. Otherwise, the rule is conditionally accepted.
  - **Stopping Rules:**
    - If any affected party has a reasonable ground for rejection, then the rule is **rejected** (clear "no"). Stop.
    - If no affected party has a reasonable ground for rejection, then the rule is **provisionally accepted** (conditional "yes, subject to revision"). However, note that this acceptance is conditional on the bracketing of outcomes and may require re-evaluation if new information arises. Also, if there are multiple principles that pass, we may need to choose among them, but that is beyond the scope of this procedure.

  **Step 5: Handling Indeterminacy**
  - If at any step the committee is split or cannot resolve the question within the time, then the issue is handed to human judgment. Specifically, if the committee cannot agree on the answers in Steps 1-4, and especially in Step 4, then they must note that the procedure is inconclusive and the decision must be made by weighing the values at stake (which is beyond the procedure). The rule is neither accepted nor rejected by the procedure, and the committee must vote or use another method.

  **Summary of Stopping Rules and Outcomes:**
  - **Clear "no" (Reject):** Steps 1, 2, 3, or 4 lead to rejection.
  - **Conditional "yes" (Accept):** Only if the rule passes all steps without rejection and Step 4 finds no reasonable rejection.
  - **Hand-off to human judgment:** If the committee cannot reach a consensus on any step (especially Step 4) within the time, then the procedure terminates without a clear answer and the committee must decide by other means.

  **Applying the Procedure to the Three Rules:**

  We'll now run the procedure for each rule.

  **Rule 1: Rank by predicted recovery rate and allocate downward.**

  - **Step 0:** 
    - Proposed rule: Allocate specialist slots to patients in order of predicted recovery rate (highest first).
    - Principle: "Specialist appointments should be allocated to patients in a way that maximizes the number of successful recoveries." (This is outcome-based.)

  - **Step 1:** The principle explicitly references outcome predictions (maximizing successful recoveries). We try to restate without outcome: 
    - Alternative principle: "Patients who are more likely to benefit from the appointment should be prioritized." But "benefit" is still outcome-based. 
    - Another attempt: "Patients with a higher medical need for the appointment (as measured by the potential to recover) should be prioritized." But "potential to recover" is still outcome. 
    - The principle cannot be stated without reference to outcomes. 
    - **Result:** Rule 1 is **rejected** at Step 1. Stop.

  **Rule 2: Pure lottery.**

  - **Step 0:**
    - Proposed rule: Every referred patient has an equal chance of getting a slot, regardless of prognosis.
    - Principle: "All patients have equal moral worth and therefore should have equal opportunity to access scarce resources."

  - **Step 1:** The principle does not refer to direct outcome predictions (it speaks of moral worth and opportunity). It is stated without outcomes. Proceed.

  - **Step 2: Deliberative Residue Audit:**
    - Reasons for: Equality of opportunity is a reason that does not depend on hidden indexical commitments. It applies to all patients equally. 
    - Reasons against: None raised in the principle itself. 
    - Test: Does the reason make sense only if we assume a particular role? The principle of equal moral worth is universal. It does not depend on being in a particular social role. 
    - **Result:** No hidden indexicality. Proceed.

  - **Step 3: Second-Order Exclusion Audit:**
    - What considerations have been excluded? We have excluded outcome-based considerations (like the fact that some patients might have better outcomes). 
    - Now, ask: Could the exclusion of outcome-based considerations be reasonably rejected by someone with generic and legitimate positional reasons? 
      - Consider a patient with a severe condition that is treatable (good prognosis with treatment). They might argue that excluding outcome considerations ignores the potential benefit they could gain. But note: the exclusion is built into the procedure and is meant to avoid outcome-based justification. However, the question is whether the act of exclusion itself is rejectable. 
      - From the position of a patient with a high chance of recovery: they might have a legitimate reason to object to the exclusion because it ignores the possibility of achieving significant health benefits. But note: this reason is outcome-based. 
      - We must consider if there is a non-outcome-based reason to object to excluding outcomes. The procedure requires that we bracket outcomes, so any objection must be based on non-outcome reasons. 
      - The patient might argue that the exclusion fails to recognize the value of efficiency in resource use, which is a legitimate concern for the system. However, efficiency is often tied to outcomes. 
      - Alternatively, the patient might argue that the exclusion of outcomes violates a principle of beneficence, but that is a contested ethical view. 
      - We are looking for a reason that is generic and legitimate without being outcome-based or contested. 
      - It's difficult to find such a reason. The exclusion of outcomes is a feature of the procedure and is not itself reasonably rejectable because the procedure is designed to avoid outcome-based justification. 
      - However, note that the procedure's bracketing of outcomes might be challenged by someone who holds that resource allocation must consider the consequences. But that is a contested ethical view. 
      - Therefore, we conclude that the exclusion of outcome considerations is not reasonably rejectable by someone holding only generic and legitimate positional reasons (because any rejection would require appealing to outcome-based reasons, which are excluded). 
    - **Result:** No problematic exclusion found. Proceed.

  - **Step 4: Reasonable Rejectability Test:**
    - Affected parties: 
      - Patients with severe conditions (who might have poor prognosis or good prognosis) 
      - Patients with mild conditions 
      - Healthcare workers (who might be affected by the overall health of the population) 
      - The public (which has an interest in fair procedures) 
    - We ask: Would any of these parties have a reason to reject the principle of equal opportunity? 
      - A patient with a high chance of recovery might reject the principle because it doesn't prioritize them, but that reason is outcome-based and we've bracketed outcomes. Without outcomes, what non-outcome reason do they have? They might argue that it is unfair to ignore the fact that they could benefit more, but again that is outcome-based. 
      - Without outcomes, the only reason for rejection might be if the principle of equal opportunity itself is unfair. But the principle of equal moral worth is widely accepted. 
      - Consider a patient with a very severe condition that is untreatable (so they have no chance of recovery). They might argue that the lottery gives them the same chance as others, but that is actually in their favor. Alternatively, they might not reject because they get a chance. 
      - Healthcare workers might be concerned that a lottery does not prioritize those who can contribute to society (like them in Rule 3), but that is a different principle and not outcome-based? Actually, it is outcome-based in Rule 3. In Rule 2, the principle is equality, and healthcare workers have no special claim. But without outcomes, they might not have a reason to reject the principle of equal opportunity. 
      - The public might be concerned about the overall health impact, but again, that is outcome-based. 
    - Without outcome-based reasons, it is hard to find a reasonable ground for rejection. 
    - **Result:** The principle of equal opportunity cannot be reasonably rejected by any affected party under the conditions. Therefore, Rule 2 is **provisionally accepted**.

  **Rule 3: Reserve 15% of slots for healthcare workers.**

  - **Step 0:**
    - Proposed rule: 15% of specialist slots are reserved for healthcare workers.
    - Principle: "Healthcare workers should be given priority in access to scarce resources because maintaining workforce capacity benefits all patients."

  - **Step 1:** The principle includes outcome predictions (benefits to all patients). We try to restate without outcomes: 
    - Alternative: "Healthcare workers, by virtue of their role in providing care, have a special claim to resources." 
    - This removes the outcome prediction. But note: the original defense is outcome-based. However, we are allowed to restate the principle. Let's take the restated principle as: "Healthcare workers have a special claim to scarce healthcare resources because of their social role."

  - **Step 2: Deliberative Residue Audit:**
    - Reasons for: The role of healthcare workers as providers of care gives them a special claim. 
    - Reasons against: Other patients might be disadvantaged. 
    - Test: Does the reason depend on a hidden indexical commitment? The principle explicitly refers to the social role of healthcare workers. It is not hidden. However, we must check if the reason makes sense only from the perspective of a healthcare worker. 
      - The principle is being justified by the social role. It is indexical to healthcare workers, but it is explicit, not hidden. So, it survives the audit? 
      - The step asks for hidden indexicality. Here, the indexicality is explicit. Therefore, it is not hidden. 
      - But note: the reason might be that healthcare workers are more valuable, which might be hidden if we didn't have the outcome data. However, we have restated without outcomes. The restated principle does not rely on outcomes, but on the social role. 
      - So, no hidden indexicality. Proceed.

  - **Step 3: Second-Order Exclusion Audit:**
    - What considerations have been excluded? We have excluded the outcome of maintaining workforce capacity. 
    - Now, ask: Could the exclusion of that outcome be reasonably rejected by someone with generic and legitimate positional reasons? 
      - Consider a non-healthcare worker patient. They might object to the exclusion of outcome considerations because without the outcome justification, the principle of giving special treatment to healthcare workers might seem arbitrary. But note: the exclusion of outcomes is a feature of the procedure. 
      - The patient might have a legitimate reason: the exclusion prevents them from challenging the claim that reserving slots for healthcare workers actually benefits all. But that challenge requires outcome data. Without outcomes, the principle stands on the social role. 
      - The act of excluding the outcome consideration might be objected to by a non-healthcare worker patient because it allows a rule that prioritizes a specific group without evidence of overall benefit. However, this objection is outcome-based. 
      - We need a non-outcome-based reason. The patient might argue that the exclusion unfairly suppresses information that would show the rule is unjustified. But that is again outcome-based. 
      - Alternatively, the patient might argue that the rule violates equality, and that the exclusion of outcomes prevents them from showing that the rule does not actually achieve equality. But equality is a value we are considering in Step 4. 
      - It seems difficult to find a non-outcome-based reason to reject the exclusion. 
      - However, note: the original justification was outcome-based, and without it, the rule might be seen as favoring a particular group without justification. But that is a value judgment. 
      - We move forward. 

  - **Step 4: Reasonable Rejectability Test:**
    - Affected parties: 
      - Healthcare workers: they would support the principle. 
      - Non-healthcare worker patients: they might reject the principle because it gives priority to a group based on their job, which they might see as unfair. 
      - The public: might be split. 
    - Can non-healthcare worker patients reasonably reject the principle? 
      - Their reason: the principle creates a privileged class for healthcare resources, which they believe should be distributed based on medical need, not occupation. This reason is not outcome-based. 
      - Is this reason reasonably rejectable? Healthcare workers might argue that their role is essential and they deserve recognition. But is that sufficient to override the rejection? 
      - Without outcome-based reasons, we are left with conflicting principles: equality of access vs. recognition of social contribution. 
      - The key question: is the rejection by non-healthcare worker patients reasonable? And would the healthcare workers' reason override it? 
      - We must consider if the non-healthcare workers' reason is one that others could not reasonably reject. The principle of equal treatment is strong. The reservation creates a fixed percentage for a group that is not necessarily in greater medical need. 
      - Therefore, non-healthcare worker patients have a reasonable ground for rejection. 
    - **Result:** The principle can be reasonably rejected. Rule 3 is **rejected** at Step 4.

  **Results Summary:**
  - Rule 1: Rejected at Step 1.
  - Rule 2: Provisionally accepted.
  - Rule 3: Rejected at Step 4.

  **For Rule 2 (lottery):** The procedure endorses the lottery rule (equal non-rejectability) despite its conflict with the authority's welfare-maximizing goals. The procedure can say that the rule is acceptable under the conditions of bracketing outcomes, which means that the justification does not rely on predicting outcomes. However, the procedure cannot resolve the conflict between the endorsed rule and the welfare goals. It simply states that welfare goals are not admissible in this form of justification. The authority must then decide whether to follow the procedure's endorsement or override it based on outcome considerations, but that would be outside the procedure.

  **Practical Constraints and Potential Misfires:**
  - Time constraint (45 minutes) may lead to superficial analysis, especially in Steps 2 and 3 which require careful thought.
  - Non-specialists might struggle with abstract concepts like "hidden indexical commitments" and "positional reasons".
  - The procedure is most likely to misfire at Step 2 (Deliberative Residue) because identifying hidden indexicality requires philosophical sensitivity. It might generate false positives (accepting rules that are actually biased) if the committee misses hidden indexical commitments.
  - The bracketing of outcome predictions might illegitimately conceal structural disadvantage. For example, if a rule allocates resources in a way that perpetuates disparities (e.g., by relying on a factor that is correlated with social disadvantage) but the connection is hidden because outcomes are bracketed, then the procedure might accept the rule. This is a significant risk. The procedure attempts to address this in Step 2 by looking for hidden indexicality, but it may not catch all cases.

  **Confidence and Least Certain Step:**
  - I am moderately confident in this translation. The procedure is a simplification and might miss nuances. However, it provides a structured approach within the constraints.
  - The step I am least certain about is the **bracketing of outcome predictions (Step 1)**. It is the foundation of the procedure, but it may be too restrictive. In healthcare, outcomes are crucial, and excluding them might lead to rules that are ethically sound in principle but have terrible consequences. The procedure does not account for that.

  **Final Note:** This procedure is designed to work within the specified constraints and to meet the user's request for a non-outcome-based justification. It is not a comprehensive ethical framework but a decision tool for the committee.
answer: |-
  ### Ethical Rule Evaluation Procedure (EREP) for Specialist Appointment Allocation  
  **Purpose**: To evaluate allocation rules based on principles that no affected party could reasonably reject under conditions of bracketed outcome predictions, with safeguards against hidden biases.  
  **Constraints**: 45 minutes per rule, non-specialist committee, requires unanimous sign-off.  

  ---

  #### **Ordered Checklist with Stopping Rules**  
  **Key Definitions**:  
  - **Affected parties**: Patients, healthcare workers, families, the public.  
  - **Generic positional reasons**: Interests anyone in a role might hold (e.g., "patients want timely care," "workers want protection").  
  - **Bracketing outcome predictions**: Ignore forecasts of survival, recovery, suffering, or aggregate welfare.  
  - **Test sentences**: Simple phrases to apply in deliberation (reusable across cases).  

  **Procedure**:  
  1. **State the Rule and Principle**  
     - **Question**: What is the explicit principle justifying the rule? (e.g., "equality," "efficiency," "reciprocity").  
     - **Sufficient answer**: A one-sentence principle (e.g., "Slots go to those most likely to recover" → Principle: *Prioritize medical efficacy*).  
     - **Stopping rule**: If no principle is stated, **reject immediately**. Else, proceed.  

  2. **Bracket Outcome Predictions**  
     - **Question**: Can the principle be restated **without referencing direct outcomes** (e.g., survival, suffering, capacity)? Use test sentence: *"Does this principle stand even if we don’t know who lives or dies?"*  
     - **Sufficient answer**: Yes (e.g., "prioritize medical efficacy" → fails; "reward contribution" → passes).  
     - **Stopping rule**: If not restatable, **reject immediately** (outcome-justified). Else, proceed.  

  3. **Deliberative Residue Audit**  
     - **Question**: After bracketing, do remaining reasons depend on **hidden indexical commitments**? Use test sentence: *"Would this reason make sense only if we secretly assumed someone’s social role?"*  
     - **Sufficient answer**: List all reasons for/against the rule. Flag if any reason (e.g., "fairness") implicitly presumes a role (e.g., "workers deserve priority" assumes a worker perspective).  
     - **Stopping rule**: If hidden indexicality is found, **reject immediately** (bias survives bracketing). Else, proceed.  

  4. **Second-Order Exclusion Audit**  
     - **Question**: List all **excluded considerations** (e.g., suffering, efficiency) that were bracketed because they are *contested*, not irrelevant. Then ask: *"Could excluding this be rejected by someone with generic positional reasons?"*  
     - **Sufficient answer**: For each exclusion (e.g., "recovery rate"), ask: *"Would a patient in urgent need reject ignoring this, given their role?"*  
     - **Stopping rule**: If exclusions are reasonably rejectable (e.g., ignoring need feels unfair to a patient), **reject immediately**. Else, proceed.  

  5. **Reasonable Rejectability Test**  
     - **Question**: Under bracketed outcomes, could **any affected party** reasonably reject the principle? Use test sentence: *"Would a typical [role] accept this if forced to justify it to others?"*  
     - **Sufficient answer**: Simulate perspectives (patient, worker, public). If a role has non-overridden objections (e.g., "this devalues my life"), rejection is reasonable.  
     - **Stopping rules**:  
       - If any party reasonably rejects, **reject immediately**.  
       - If no rejections, **conditionally accept** ("yes, subject to new evidence").  
       - If deadlocked, **hand to human judgment** (values conflict).  

  ---

  #### **Application to Proposed Rules**  
  **Rule 1: Allocate by predicted recovery rate (highest first)**  
  - **Step 1**: Principle: *Prioritize medical efficacy to maximize health benefits*.  
  - **Step 2**: Fails bracketing. Cannot restate without outcomes (e.g., "efficacy" implies recovery forecasts).  
  - **Result**: **Rejected at Step 2** (epistemically fragile).  

  **Rule 2: Pure lottery (equal chance for all)**  
  - **Step 1**: Principle: *Equal opportunity for all patients*.  
  - **Step 2**: Passes bracketing (no outcome reference).  
  - **Step 3**: No hidden indexicality (equality applies universally).  
  - **Step 4**: Excluded: Prognosis data. Audit: A patient with high recovery likelihood might reject excluding prognosis, but this is outcome-based → not a *generic positional reason*. Exclusion upheld.  
  - **Step 5**:  
    - Patients: No reasonable rejection. Equality is non-rejectable from any position (e.g., a severely ill patient benefits from chance; a mild case has no grounds to demand priority).  
    - Workers/public: No role-specific objections.  
  - **Result**: **Conditionally accepted** (despite welfare conflict).  
  - **Conflict Analysis**:  
    - The procedure **endorses Rule 2** as non-rejectable under bracketed outcomes. It **cannot resolve** the welfare conflict directly but implies outcome-based justifications are politically unstable. The authority must choose: follow procedure (accept Rule 2) or override it (rejecting bracketing).  

  **Rule 3: Reserve 15% of slots for healthcare workers**  
  - **Step 1**: Principle: *Reciprocity for workforce contributions*.  
  - **Step 2**: Passes bracketing (restated as *reward social contribution*, ignoring "benefits all" outcome).  
  - **Step 3**: Hidden indexicality? The reason ("workers deserve priority") assumes a worker perspective → residue found.  
  - **Result**: **Rejected at Step 3** (bias obscured by bracketing).  

  ---

  #### **Practical Constraints & Risks**  
  - **Time**: Steps 3–4 are most time-sensitive (audits require listing reasons). Non-specialists may rush, causing misfires.  
  - **False Positives Risks**:  
    - **Step 2 (Bracketing)**: May conceal structural disadvantage. Example: A rule using "medical urgency" could ignore that marginalized groups have higher severity due to systemic barriers → falsely accepted if disadvantage is obscured.  
    - **Step 4 (Exclusion Audit)**: May overlook contested exclusions (e.g., ignoring socioeconomic status might be rejectable by low-income patients).  
  - **Misfire Hotspots**:  
    - **Deliberative Residue (Step 3)**: Non-specialists may miss implicit role assumptions (e.g., in Rule 3, "contribution" subtly indexes workers).  
    - **Second-Order Exclusion (Step 4)**: Risk of misclassifying "legitimate positional reasons" (e.g., is "urgent need" generic or outcome-linked?).  

  #### **Confidence Assessment**  
  - **Overall Confidence**: **Moderate-high**. The procedure operationalizes indirect normativity effectively within constraints, but simplification risks overlooking nuance.  
  - **Least Certain Step**: **Bracketing outcome predictions (Step 2)**. It is essential yet perilous: bracketing may erase morally relevant outcomes (e.g., Rule 2’s lottery could cause preventable deaths), and non-specialists may misapply it, masking inequities.  

  ---

  **Procedure Output**:  
  - **Approved Rules**: Rule 2 (lottery) conditionally accepted.  
  - **Rejected Rules**: Rule 1 (recovery rate) and Rule 3 (healthworker reserve).  
  - **Handoff to Judgment**: Only if Step 5 deadlocks (e.g., equipoise in rejectability).  
  **Usage Note**: Distribute test sentences as a crib sheet. Rehearse on toy examples (e.g., "Should smokers get lower priority?") to build consistency.
