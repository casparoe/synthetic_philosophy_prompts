  hey can u write a short story about Gödel's rotating universe idea? he said if the universe spins then time loops back and the past is reachable, which made him think time isnt objectively real. i want the story about a high schooler who realizes her town is inside one of these loops. she writes a note to her past self but the words keep turning into a language she doesnt know yet, like causality is scrambling the message. her memories dont loop with everything else so shes alone in noticing. can you keep it more like a philosophical daydream than hard sci-fi? also maybe she misspells "seperate" in the note lol
