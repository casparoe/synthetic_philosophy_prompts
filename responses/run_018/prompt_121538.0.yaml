prompt: |-
  hey im building a dataset on collapse narratives and i want you to rank four things by how genuinely collapsed they are, but using this weird three-axis frame i cooked up: structual amnesia (did institutions forget how to reproduce themselves?), material decoupling (did the economy actually shrink or just reroute into smaller nodes?), and narrative rupture (do later populations treat it as a definitive ending?). apply it to: the late bronze age crash in the eastern mediterranean, the classic maya lowland abandonment, easter island's ecological story, and the thesis that societies never really collapse they just change shape. rate each 0-3 on all three axes, then give me an overall tier list from most collapsed to least collapsed with one sentence per item. also flag which axis is the shakiest fit for each case. dont worry about citations, just reason it through.
reasoning: |-
  Okay, the user wants me to rank four collapse scenarios using their custom three-axis framework: structural amnesia, material decoupling, and narrative rupture. They've specified how each axis should be scored (0-3) and asked for an overall tier list, plus identifying the shakiest axis for each case. 

  First, I need to unpack their framework carefully. Structural amnesia is about institutional memory loss - did societies forget how to reproduce key systems? Material decoupling focuses on economic shrinkage versus mere reorganization. Narrative rupture examines whether later generations saw it as an "end." The cases are: Late Bronze Age collapse, Classic Maya abandonment, Easter Island ecology, and the "societies never collapse" theory. 

  Hmm, interesting challenge. The user seems to be constructing a dataset for academic or creative work, probably in anthropology or history. Their phrasing ("weird three-axis frame I cooked up") suggests playful intellectual curiosity. They might be testing how well their framework handles edge cases like the fourth item - which isn't a collapse at all! 

  For Late Bronze Age, I recall it involved palace economies vanishing and literacy loss. That's strong structural amnesia (3). Materially, trade networks shattered but local farming continued - partial decoupling (2). Later Greek poets vaguely referenced a "heroic age," suggesting moderate narrative rupture (2). Shakiest axis might be material decoupling since some regions recovered faster. 

  Classic Maya shows near-total structural amnesia with forgotten monument-building and calendars (3). Materially, populations dispersed but didn't vanish - more rerouting than pure shrinkage (1). The narrative rupture is profound; modern Maya still reference this "end" (3). Material decoupling feels shakiest here because subsistence continued. 

  Easter Island... tricky. Structural amnesia seems incomplete since society persisted differently (1). Material decoupling was extreme with resource depletion (3). But narrative rupture? Oral traditions recall the ecological crisis, but it's not framed as civilizational death (1). All axes feel shaky here due to limited evidence. 

  The fourth item is meta - it's arguing collapse is illusory. So structural amnesia might still occur even if society transforms (1). Material decoupling could be minimal (0). Narrative rupture depends on perspective (1). Shakiest is narrative rupture since it challenges the whole concept. 

  Tier list seems clear: Maya > Bronze Age > Easter Island > "never collapse" theory. Each gets a punchy summary highlighting their collapse essence. User definitely wants concise delivery - they said "one sentence per item." 

  Biggest challenge? Easter Island's axes all feel uncertain. Also, explaining why the "never collapse" thesis ranks last without dismissing it entirely. Should emphasize it's a valuable counterpoint despite low collapse scores. User seems open to playful rigor - hope they like this approach!
answer: |-
  Here's the ranking using your three-axis framework, with scores (0-3) for each axis, an overall tier list, and the shakiest axis identified for each case:

  **Scoring Key:**
  *   **Structural Amnesia (SA):** 0 (No loss) - 3 (Complete institutional memory wipe)
  *   **Material Decoupling (MD):** 0 (No shrinkage/rerouting) - 3 (Severe, permanent economic contraction & fragmentation)
  *   **Narrative Rupture (NR):** 0 (Continuity narrative) - 3 (Definitive "End of an Era" story)

  ---

  **1. Late Bronze Age Collapse (c. 1200-1150 BCE Eastern Med)**
  *   **SA: 3** (Palace bureaucracies, writing systems, complex craft production, & long-distance trade networks vanished abruptly; knowledge loss was severe & widespread).
  *   **MD: 2** (Major economic contraction, trade collapse, urbanization decline, but local subsistence farming generally persisted in fragmented nodes; not total regional depopulation).
  *   **NR: 2** (Later Greek traditions (Homeric epics) vaguely recall a lost "Heroic Age," but lack a *definitive* "end" story for the *entire* system; more a "Dark Age" transition).
  *   **Shakiest Axis:** **Material Decoupling (MD)** - Evidence shows significant regional variation; some areas bounced back faster, and the scale of absolute economic shrinkage vs. rerouting/fragmentation is debated.

  **2. Classic Maya Lowland Abandonment (c. 800-900 CE)**
  *   **SA: 3** (Monumental construction, dynastic rulership, hieroglyphic writing, and complex calendrics ceased abruptly in the core southern lowlands; profound institutional loss).
  *   **MD: 1** (Significant population decline in urban cores, abandonment of intensive agriculture supporting elites, but populations persisted/reorganized in surrounding areas or shifted north; economy shrank drastically in the south but didn't vanish entirely).
  *   **NR: 3** (Modern Maya populations explicitly reference this period as the "time when the stones were abandoned"; it's a definitive endpoint for the specific Classic lowland civilization in their own and academic narratives).
  *   **Shakiest Axis:** **Material Decoupling (MD)** - While the elite economy collapsed, the extent of population decline and the survival/persistence of non-elite communities and economies in the region is complex and debated.

  **3. Easter Island (Rapa Nui) Ecological Story (c. 1600-1800 CE)**
  *   **SA: 1** (Significant societal transformation (loss of moai carving/transport, Birdman cult rise), but core Polynesian social structures, language, and subsistence knowledge persisted through the crisis and into the colonial era).
  *   **MD: 3** (Severe, demonstrable ecological degradation (deforestation, soil erosion) leading to drastic population decline, loss of sophisticated resource management, and contraction to a much simpler, lower-level economy).
  *   **NR: 1** (Oral traditions recall ecological decline and societal changes, but there's no strong narrative of a *definitive civilizational end*; the story emphasizes adaptation and survival through hardship, leading into the colonial encounter).
  *   **Shakiest Axis:** **ALL are somewhat shaky**, but **Structural Amnesia (SA)** is arguably the weakest fit. While specific elite practices vanished, core societal knowledge persisted, making it less a true "forgetting how to reproduce" than a forced adaptation.

  **4. "Societies Never Collapse, Just Change Shape" Thesis**
  *   **SA: 1** (Acknowledges transformation/abandonment of specific institutions, but emphasizes continuity/persistence of social units, knowledge, or cultural elements elsewhere/in new forms).
  *   **MD: 0** (Posits that apparent "collapse" is usually economic/social reorganization, decentralization, or rerouting, not genuine, permanent large-scale material shrinkage).
  *   **NR: 1** (Argues that "rupture" narratives are often imposed later or by outsiders, masking underlying continuities and transformations; collapse is a perspective, not an absolute state).
  *   **Shakiest Axis:** **Narrative Rupture (NR)** - This thesis fundamentally challenges the *concept* of narrative rupture as a meaningful indicator, making it the hardest axis to apply meaningfully.

  ---

  **Overall Tier List (Most Collapsed to Least Collapsed):**

  1.  **Classic Maya Lowland Abandonment:** Profound institutional amnesia and a definitive narrative ending, despite some population persistence, mark this as the clearest collapse within your framework. *(SA:3, MD:1, NR:3)*
  2.  **Late Bronze Age Collapse:** Widespread institutional disintegration and significant economic contraction define a major systemic collapse, though the narrative rupture is less absolute than for the Maya. *(SA:3, MD:2, NR:2)*
  3.  **Easter Island Ecological Story:** Severe material decoupling due to ecological disaster caused massive societal disruption and transformation, but without complete institutional amnesia or a definitive ending narrative. *(SA:1, MD:3, NR:1)*
  4.  **"Societies Never Really Collapse" Thesis:** By definition, this perspective minimizes all three collapse indicators, emphasizing transformation over definitive rupture. *(SA:1, MD:0, NR:1)*
