answer: |-
  Here is a comprehensive exam design package addressing your requirements:

  **(a) Exam Question (Calibrated for 75 minutes, ~700 words)**

  **Prompt:** T.M. Scanlon’s contractualism prohibits aggregating small burdens across many individuals to outweigh a large burden to one, grounding morality in principles "no one could reasonably reject" based on their *individual* generic reasons. Consider an *intertemporal* extension: applying the reasonableness test across temporal stages of a *single* life. Can a present stage (P) reasonably reject a principle permitting significant present burdens (e.g., years of exhausting training) in exchange for substantial future benefits (e.g., decades of flourishing career), where P acts as a "proxy" for its future stage (F)? Does this framework introduce *intrapersonal aggregation* (summing burdens/benefits across time) that Scanlon’s interpersonal framework rejects? Assess whether Scanlon’s core apparatus—without invoking prioritarian weighting or a substantive theory of diachronic personal identity—can consistently block such intrapersonal aggregation. Explain why the logic of Scanlon’s "rescue cases" (e.g., saving one from agony vs. many from minor headaches) does *not* automatically resolve this intrapersonal case.

  **(b) Model Answer (Key Distinctions & Verdict)**

  Scanlonian contractualism locates wrongness in principles that cannot be justified to others, focusing on the *individual standpoint* of potential rejectors. The prohibition against interpersonal aggregation stems from this: one person facing a catastrophic loss cannot be required to accept it merely because aggregating many others' minor gains would sum to a greater total "good." The *separateness of persons* is fundamental. Intertemporal contractualism tests whether this structure can govern relations between temporal stages of one life without replicating the aggregation it condemns.

  **1. Interpersonal vs. Intrapersonal Aggregation:**  
  Interpersonal aggregation sums burdens/benefits *across distinct moral agents*. Scanlon rejects this because the individual facing the large burden has a claim grounded in their *own* generic reasons that cannot be overridden by others' combined lesser claims. Intrapersonal aggregation sums burdens/benefits *across time within one life*. The critical question is whether temporal stages are sufficiently "separate" to warrant analogous protection, or whether the continuity of the person legitimizes summing.

  **2. Why Rescue-Case Logic Doesn’t Transfer:**  
  In Scanlon’s rescue cases (e.g., saving one from agony vs. many from headaches), rejecting aggregation is clear: the agony-sufferer’s decisive complaint isn’t outweighed by the sum of weaker headaches. In the intrapersonal case, however, the "future stage" (F) isn’t a distinct agent *harmed* by P’s burden; F *benefits* from it. P’s "rejection" isn’t based on a current burden *to itself* being ignored, but on a claim *against* sacrificing for F. The question is whether P can *unreasonably* veto a principle beneficial to F (and thus to the temporally extended person). Scanlon’s rescue logic protects victims of large harms; here, P is arguably *inflicting* a veto on F’s benefit.

  **3. Reasonable Rejectability vs. Strength of Reasons:**  
  A key pitfall is conflating the *strength* of P’s reason to avoid present pain with the *reasonableness* of P rejecting a principle requiring sacrifice *for its own future benefit*. Reasonable rejectability requires considering the generic reasons of *all* affected standpoints. Crucially, F’s standpoint is also affected: a principle *permitting* P to veto F’s benefit would expose F to potentially ruinous present selfishness. F could reasonably reject *that* principle. P’s claim rests on the intensity of its *current* suffering, but Scanlon’s test isn’t a direct weighing of reason-strength—it’s about mutual justifiability. P must show its sacrifice is unreasonable *even considering F’s countervailing generic reasons*.

  **4. Hidden Work of Continuity & Proxy Representation:**  
  The "proxy" model tacitly assumes diachronic identity: P speaks *for* F because they are stages of the *same person*. This allows F’s interests to be represented in the present deliberation. However, this is precisely where aggregation sneaks in: if P must weigh F’s *future* reasons *now*, it effectively sums P’s burden and F’s benefit *across time* within the single deliberative standpoint. This replicates the structure of utilitarian summing Scanlon rejects, merely relocated intrapersonally. Scanlon’s framework lacks resources to block this without implicitly relying on the unity of the person over time—a substantive metaphysical commitment his theory aims to avoid presupposing.

  **Verdict on Consistency:**  
  Scanlon’s core framework *struggles to block intrapersonal aggregation consistently*. To prevent P’s unreasonable veto, it must allow F’s future-oriented reasons (via P as proxy) to override P’s present-focused complaint. But this override *requires* comparing and trading off burdens/benefits across temporal stages—effectively aggregating them within the life. While the diachronic unity of the person *explains* why this aggregation seems legitimate (unlike interpersonal summing), Scanlon’s official apparatus cannot *ground* this legitimacy without either:  
  (i) Smuggling in prioritarian weights (e.g., discounting future reasons, privileging present suffering), or  
  (ii) Presupposing a theory of personal identity that makes F’s reasons *P’s own reasons* in a way that dissolves the stage-based separateness implied by the "proxy" model.  
  Thus, intertemporal contractualism risks replicating the aggregation Scanlon condemns, revealing a tension in applying the reasonableness test to temporal parts without independent assumptions about identity or weighting.

  **(c) Marking Scheme**  

  **A-Grade Answer (85%+)**  
  *Must Contain:*  
  1. **Precise Anti-Aggregation Location:** Correctly identifies Scanlon’s anti-aggregation as rooted in the *structure of reasonable rejection* (individual standpoints, no outweighing) NOT a theory of the good.  
  2. **Inter/Intra-Personal Distinction:** Clearly contrasts interpersonal aggregation (distinct moral agents) with intrapersonal (temporal stages), highlighting the separateness question.  
  3. **Rescue-Case Limitation:** Explains why the rescue case logic fails to transfer (P isn’t the "victim" F benefits; F’s counter-rejection matters).  
  4. **Rejectability/Strength Conflation:** Diagnoses if/why the student conflates P’s *strong reason* to avoid pain with *reasonable rejectability* of a principle considering F’s countervailing reasons.  
  5. **Proxy Summation Critique:** Argues that P acting as proxy *for F* forces P to sum P’s burden + F’s benefit, replicating the summation Scanlon forbids interpersonally.  
  6. **Continuity Assumption Exposure:** Shows how diachronic identity silently enables proxy representation but is not theorized within Scanlon’s framework.  
  7. **Consistency Verdict with Nuance:** Concludes Scanlon *cannot* block intrapersonal aggregation without prioritarian weights or identity theory, highlighting the tension.  

  **B-Grade Answer (75-84%)**  
  *May Contain:*  
  1. Identifies Scanlon’s anti-aggregation but mislocates it (e.g., as solely about the "separateness of persons" without linking to the rejection test’s structure).  
  2. Distinguishes inter/intra-personal but less sharply; may treat temporal stages as quasi-persons.  
  3. Notes rescue cases differ but doesn’t fully articulate *why* (e.g., misses F’s counter-rejection).  
  4. Partially distinguishes reason-strength from reasonable rejectability but may still weigh P’s suffering too heavily.  
  5. Notes the proxy model but doesn’t explicitly link it to forbidden summation.  
  6. Mentions personal identity but doesn’t show how it does hidden work.  
  7. Sees a problem but verdict is vague on *why* it challenges Scanlon’s consistency.  

  **Common Errors (Mark Reductions):**  
  - **Summarizing Scanlon vs. Utilitarianism:** Merely rehashing standard aggregation rejection without engaging the temporal extension (-1 Grade).  
  - **Stage Reification:** Treating P and F as fully distinct persons/moral agents (-10%).  
  - **Conflation:** Equating "P has strong reason" with "P can reasonably reject" (-15%).  
  - **Ignoring F’s Standpoint:** Focusing solely on P’s burden, neglecting F’s generic reasons for benefiting (-15%).  
  - **Assuming Identity Solves Everything:** Asserting diachronic unity resolves the issue without showing *how* Scanlon’s test accommodates it (-10%).  
  - **Prioritarian Smuggling:** Uncritically assuming future benefits are discounted or present burdens privileged without justification (-10%).  
  - **Proxy Unquestioned:** Failing to analyze how representation enables intrapersonal summing (-10%).  

  **Weighting:**  
  - Accuracy on Scanlon’s Framework: 30%  
  - Analysis of Inter/Intra-Personal Distinction: 25%  
  - Critique of Proxy Representation & Hidden Aggregation: 25%  
  - Diagnosis of Continuity/Identity Assumptions: 15%  
  - Clarity & Structure: 5%  

  This design forces engagement with Scanlon’s deepest structural commitments while avoiding well-trodden paths, rewarding students who grasp the meta-ethical mechanics of contractualism. The marking scheme ensures clear differentiation between excellent (A) and good (B) responses based on specific philosophical moves.
