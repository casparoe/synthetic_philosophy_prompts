answer: |-
  Here's a systematic breakdown of potential defeaters for your "arbitration view," ranked by their destructive potential (Fatal, Awkward, Conceded), addressing empirical, conceptual, and metaphysical challenges, with a focus on extreme cases:

  ### **I. Fatal Defeaters (Collapse the Core Argument)**
  1. **Empirical: Preference Reversals Under Revealed Irrationality**  
     - **Defeater:** Experiments where subjects *knowingly and regretfully* engage in self-destructive reversals (e.g., Ainslie's "alcoholic rats" or human subjects choosing immediate rewards despite *concurrently* stating they wish they wouldn't).  
     - **Why Fatal:** If the agent *in the moment of choice* acknowledges their action contradicts their *current* best judgment (not just past/future selves), it violates the arbitration view's premise that the act is a "legitimate veto." The veto requires the *present self* to endorse Y as best *for it*; concurrent regret shows it does not.  
     - **Extreme Case:** A terminal smoker, while lighting a cigarette, says: "This is stupid, I hate myself for doing this, but I can't stop." Here, hyperbolic discounting isn't tracking normative distance—it's overriding the present self's own judgment.

  2. **Conceptual: Eradicating Akrasia by Redefining Agency**  
     - **Defeater:** If all actions reflect *some* self's "legitimate" preference (past/present/future), *akrasia vanishes* as a category. Compulsion (e.g., clinical OCD) becomes indistinguishable from "veto."  
     - **Why Fatal:** Akrasia is defined by *intra-agent conflict* (one agent, conflicting judgments). Your view replaces this with *inter-agent negotiation* (multiple selves). If there's no unified agent, there's no weakness of will—only shifting power dynamics. This reframes, rather than defends, akrasia as rational.  
     - **Extreme Case:** A heroin addict injects while sobbing, "I don't want this life." Is this the "present self's veto"? Or compulsion overwhelming identity? Blurring this *is* redefining weakness out of existence.

  3. **Metaphysical: Denial of Diachronic Agency**  
     - **Defeater:** If selves are non-identical, how can past commitments bind *at all*? Why does the past self have *any* "normative authority"? Your "weighted veto" implies residual obligation—but if selves are distinct, obligation dissolves entirely.  
     - **Why Fatal:** The arbitration model *requires* that past selves exert normative pull (to be vetoed), yet grounds identity in non-overlapping stages. This is incoherent: obligations presuppose continuity. No continuity = no grounds for veto (or commitment).

  ---

  ### **II. Awkward Defeaters (Require Costly Adjustments)**
  4. **Empirical: Health/Self-Destruction Paradox**  
     - **Defeater:** Hyperbolic discounting in life-threatening contexts (e.g., diabetic refusing insulin for cake). The arbitration view must claim the present self's "veto" is legitimate, even if it ensures non-existence of future selves.  
     - **Why Awkward:** Defenders must argue that *present sovereignty* trumps survival—a radical claim. It implies selves are so distinct that self-annihilation is a valid preference. Possible, but strains intuition and practical reason.  
     - **Response:** Argue that future selves' interests *are* discounted (normative distance), so the veto isn't irrational. But this risks nihilism: if survival isn't a trumping good, what is?

  5. **Conceptual: No Room for Regret**  
     - **Defeater:** Post-action regret (e.g., "Why did I eat that cake?") suggests the agent views the act as *not* legitimate. If arbitration is rational, regret should be rare or irrational—yet it's ubiquitous.  
     - **Why Awkward:** The view must reframe regret as "disagreeing with a past self's decision," not admitting error. This feels revisionary and downplays the phenomenology of akrasia as failure.

  6. **Metaphysical: Social/Personal Continuity Practices**  
     - **Defeater:** Legal/personal accountability (e.g., punishing future selves for past crimes) assumes diachronic identity. If selves are distinct, punishment is unjust.  
     - **Why Awkward:** The view must either reject social practices as irrational or argue they're pragmatic fictions. Both are costly for a theory claiming descriptive adequacy.

  ---

  ### **III. Conceded Defeaters (Acknowledged by Defenders)**
  7. **Empirical: Procedural Invariance Violations**  
     - **Defeater:** Hyperbolic discounting violates rational choice axioms (e.g., independence of irrelevant alternatives). Choosing A over B today, but B over A tomorrow when both are equally delayed.  
     - **Why Conceded:** Defenders grant this but argue axioms misapply to fragmented selves. Temporal position *is* relevant, so violations reflect context-sensitive rationality, not error.

  8. **Empirical: Commitment Device Demand**  
     - **Defeater:** People actively seek commitment devices (e.g., locking away cigarettes), implying they *want* to bind future selves and view discounting as irrational.  
     - **Why Conceded:** Arbitrationists reframe this as the *present self* constraining *future selves'* veto power—consistent with inter-self negotiation.

  ---

  ### **Key Takeaways for Your Defense**
  - **The Fatal Triad:** To survive, your view must:  
    (1) Explain *concurrent* regret without denying present self-agency,  
    (2) Preserve a distinction between akrasia and compulsion,  
    (3) Ground normative authority of past selves without diachronic identity.  
  - **Insulation Risk:** Extreme cases expose whether "veto" is a *descriptive* account of discounting or a *normative* endorsement of any choice. To avoid redefining weakness away, specify limits: e.g., vetoes must align with the present self's *deep values*, not fleeting desires.  
  - **Strategic Retreat:** Distinguish between *structural* rationality (procedural coherence of inter-self negotiation) and *substantive* rationality (self-preservation, well-being). Argue that akrasia is the former, even when not the latter.

  **Strongest Path Forward:** Integrate "meta-preferences" (Frankfurt) or "tiered agency" (Bratman) to explain regret/health cases: the vetoing self may be "lower-order," overruled by its own higher-order values. This retains fragmentation while preserving akrasia as a conflict within the present self's own hierarchy.
