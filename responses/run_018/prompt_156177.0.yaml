answer: |-
  Here’s a reusable 15-minute checklist incorporating transparency thresholds, domain distance, and reference-class ambiguity. I’ve bolded key outputs and marked judgment calls with ⚖️. Apply this sequentially:

  **Epistemic Modesty Decision Checklist**  
  *(Correct spelling: "epistemic")*

  1.  **Inside-View Transparency Test**  
      *Can the proponent articulate the core argument chain in ≤200 words without filler ("obviously," "it stands to reason")?*  
      **Pass:** Proceed to Step 2.  
      **Fail:** Apply domain-distance factor (0.5 if near coursework, 0.2 if far) to inside-view weight.  
      ⚖️ *Judgment call: What counts as "filler" or incomplete reasoning.*

  2.  **Outside-View Base Rate Existence**  
      *Is there a clear, directly relevant reference class with established base rates? (e.g., "success rate of similar policy mechanisms" for reparations)*  
      **Clear Base Rate:** Outside view gets full weight (1.0). Proceed to Step 3.  
      **Ambiguous/No Base Rate:** Flag "Noisy Outside View." Use broader reference class (e.g., "historical precedent for financial reparations") but apply outside-view weight penalty (0.7). Proceed to Step 3.  
      ⚖️ *Judgment call: Defining "directly relevant" reference class.*

  3.  **Conflict Resolution**  
      *Compare weighted inside view (IV) vs. outside view (OV):*  
      - **IV Stronger (IV > OV + 0.3):** "Inside View Wins" → Collective belief update justified.  
      - **OV Stronger (OV > IV + 0.3):** "Defer to Base Rate" → No update/revert to prior.  
      - **Tie (|IV - OV| ≤ 0.3):** "No Update" → Insufficient grounds for change.  
      ⚖️ *Judgment call: Threshold margin (+0.3) is arbitrary but practical.*

  4.  **Fail-Safe**  
      *If either view relies on unfalsifiable premises or extreme uncertainty ("this could cause human extinction"):*  
      **Output:** "No Update - Domain Unstable" → Reject both views until stronger evidence.

  ---

  **Applied to Your Cases:**  
  *(Simulated 15-min group run)*

  **Case 1: CS Student on Fairness Metric (Simpson’s Paradox)**  
  1.  **Transparency:** Likely passes (Simpson’s Paradox is concrete; can explain in 200 words). **IV Weight = 1.0**  
  2.  **Base Rate:** Ambiguous. Broader class = "adoption rates of proposed fairness metrics in peer-reviewed systems." **OV Weight = 0.7 (Noisy)**  
  3.  **Conflict:** IV (1.0) vs OV (0.7). IV stronger → **"Inside View Wins"** → Update collective stance against metric.  
  **Output:** Accept update.

  **Case 2: Econ Undergrad on Carbon Tax Reparations (Moral Intuition + 1 Historical Comp)**  
  1.  **Transparency:** Fails (moral intuition is non-transparent; historical comp likely underdeveloped). Domain = Econ (near coursework? ⚖️). **IV Weight = 0.5**  
  2.  **Base Rate:** Ambiguous. Broader class = "success rates of transnational wealth-transfer schemes." **OV Weight = 0.7 (Noisy)**  
  3.  **Conflict:** IV (0.5) vs OV (0.7). OV stronger → **"Defer to Base Rate"** → No update.  
  **Output:** Reject update; maintain prior stance.

  **Case 3: Your Belief "AI X-Risk is Overblown"**  
  1.  **Transparency Test (DIY):** *Can YOU explain why it’s overblown in ≤200 words without "obviously"?* Likely fails (AI risk debates hinge on complex, contested assumptions). Domain = Far from philosophy (unless thesis-related ⚖️). **IV Weight = 0.2**  
  2.  **Base Rate:** Extremely ambiguous. Broader class = "historical false alarms about extinction risks" (OV weight 0.7) OR "unprecedented tech dangers" (OV weight 0.3 ⚖️). **Assume OV Weight = 0.5 (Highly Noisy)**  
  3.  **Conflict:** IV (0.2) vs OV (0.5). OV stronger → **"Defer to Base Rate"** → Belief downgraded.  
  **Output:** You must significantly reduce confidence in your view due to low transparency and domain distance.

  ---

  **Key Features:**  
  - **Speed:** Forces concise reasoning; avoids deep dives.  
  - **Epistemic Modesty:** Penalizes opacity and domain distance; flags noisy base rates.  
  - **Explicit Judgment Calls:** Gates 1, 2, and base-rate selection rely on subjective assessment.  
  - **Output Clarity:** "Update," "No Update," or "Reject Domain" with clear reasons.  
  - **Self-Policing:** The procedure will punish your own views if they fail transparency (as seen in Case 3).  

  Run this at the START of your 15-min deliberation to frame the debate. If Step 1 fails, skip lengthy inside-view discussion.
