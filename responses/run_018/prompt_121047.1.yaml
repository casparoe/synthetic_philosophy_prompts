answer: |-
  My dear colleague,  

  Your fixation on the Reviewer’s jurisprudence is entirely understandable; her pattern of judgments reveals a nuanced and demanding theory of collective guilt that resists simplistic reduction. Having studied her rulings with care, I believe we can predict her verdict on your post-colonial case and untangle the two principles you suspect underlie her work. Let me first address the new nation’s scenario.  

  The nation bears collective moral guilt, in the Reviewer’s view. Consider the parallels: Like the descendants who inherit stolen resources, obstruct restitution, and refuse acknowledgment, this nation retains structural advantages rooted in historic wrongs while its government—acting as the collective’s institutional voice—denies any special obligation. The abolition of past legal structures resembles the nation-state that dismantled oppressive institutions, but here the refusal to acknowledge ongoing structural embeddedness and reject reparative duties aligns more closely with the guilty descendants or the segregationist municipality. Individual regrets are mere private sentiments, insufficient without institutional reckoning. The economic advantages are not inert history but actively sustained through present policies that normalize unequal distribution. Thus, the combination of unaddressed structural continuity and institutional denial creates guilt.  

  Now, the competing rules you perceive are indeed discernible:  

  The first rule (**Rule A: Active Perpetuation**) focuses on *deliberate, collective authorization or perpetuation of harm*. It explains the guilty corporation (board authorization), the guilty municipality (democratic endorsement of harm), and the guilty university (conscious preservation of honors for an atrocity founder). It exempts the nation-state (which dismantled institutions and apologized) and the family (which expressed remorse and made reparative donations).  

  The second rule (**Rule B: Structural Continuity with Refusal**) emphasizes *inherited structural advantages coupled with present institutional refusal to acknowledge or repair*. It explains the guilty descendants (inheritance + obstruction), the guilty municipality (structural harm + collective endorsement), and the predicted guilt of the post-colonial nation. It also exempts the nation-state (apology + institutional reform) and the family (remorse + reparative action), while *not* requiring active harm-perpetuation—only refusal to dismantle advantages. Rule B better accommodates the descendants’ guilt, where inheritance and obstruction suffice without democratic authorization.  

  **Rule B is better supported overall**. It alone explains why the *descendants* are guilty despite lacking formal collective agency like a board or electorate—their guilt stems from benefiting within an uninterrupted structure of advantage while refusing restitution. Rule A struggles here, as no "authorization" occurred. Rule B also neatly exempts the remorseful family and apologetic nation-state through their affirmative steps toward repair, even where advantages persist. Rule A’s focus on active perpetuation is subsumed by Rule B’s emphasis on refusal, as authorization/perpetuation is simply one mode of refusal (e.g., the university’s preservation of honors is refusal to repudiate). Rule B thus covers all six cases and your prediction cohesively.  

  To cleanly separate these rules, consider this hypothetical:  

  > *A privately held corporation, founded on colonial-era land seizures, continues to profit from those holdings. Its shareholders (all descendants of the original owners) vote annually to maintain ownership, fully aware of the injustice. However, they also vote to fund extensive reparations—direct payments, land returns, and educational grants—to the affected community, publicly acknowledging the harm and their ongoing role in perpetuating inequity.*  

  Under **Rule A**, the corporation is guilty: Shareholders actively authorize continued benefit from past harm through annual votes, paralleling the governing board’s deliberate choice. Acknowledgment and reparations may mitigate blame but do not negate the active perpetuation.  

  Under **Rule B**, the corporation is **not** guilty: While structural continuity exists, the institutional refusal is absent. Reparations and acknowledgment fulfill the duty of repair, aligning with the absolved family or nation-state. The active voting here serves repair, not obstruction.  

  This case isolates Rule A’s requirement for ongoing harm-perpetuation from Rule B’s focus on refusal/repair. The Reviewer’s verdict here would reveal her prioritization. Given her emphasis on acknowledgment and repair as exculpatory in past cases, I suspect she might lean toward Rule B—but the tension would be illuminating.  

  Your careful mapping of her logic honors the complexity she brings to collective guilt. I share your conviction that her work resists monism; these two principles, interwoven yet distinct, reflect her unflinching demand for both historical and present-moral accountability.  

  Yours in scholarly solidarity,  

  A Fellow Traveler
