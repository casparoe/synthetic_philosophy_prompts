  Looking at the Reviewer's pattern across the six cases, I notice a clear distinction between cases involving active participation/perpetuation versus passive inheritance with acknowledgment. The corporation and university cases show guilt where there's conscious authorization or perpetuation of harm. The democratic municipality and descendant cases involve guilt when there's refusal to acknowledge or repair past wrongs. Conversely, the nation-state and family cases show no guilt when there's formal apology and reparation efforts, despite obligations remaining.

  For the new post-colonial case, I predict the Reviewer would find collective guilt. While formal structures changed and individuals express regret, the government's refusal to recognize special obligations mirrors the "refusal of acknowledgment" pattern seen in the descendants case. The structurally embedded advantages without repair align with what the Reviewer treated as guilt-worthy in the municipality and descendants rulings.

  The two competing rules I identify are: Rule A focusing on collective authorization and active institutional perpetuation (explaining corporation, university, municipality), and Rule B emphasizing structural continuity plus present refusal of acknowledgment/repair (explaining descendants, municipality, and the predicted post-colonial ruling). Rule B appears more comprehensive as it also accounts for the absence of guilt in the nation-state and family cases where acknowledgment occurred.

  To distinguish these rules, I devise a hypothetical where a collective actively perpetuates harm while simultaneously acknowledging it and attempting repair - like a corporation continuing harmful practices while funding mitigation programs. Rule A would find guilt due to active perpetuation, while Rule B might not due to acknowledgment efforts, creating a clean separation.

