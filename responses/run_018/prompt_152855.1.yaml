answer: |-
  Here's my step-by-step analysis, following your requested structure:

  ### 1. Brainstorming Candidate Rules (149 words)  
  Her verdicts suggest two competing principles could explain her views:  
  **A. *Modified Absolutism*:** Rotation is absolute (not merely relative to bodies), defined by acceleration relative to *local inertial frames*, which are grounded in spacetime structure (not distant matter). This fits her Newton-bucket/globes verdicts (rotation is real in empty space) and anti-Mach stance (distant masses don't affect local inertia). GR compatibility reinforces this.  
  **B. *Background-Relative Relationism*:** Rotation is relative to the *dominant local mass-energy distribution*. This explains rejecting Mach (distant masses are irrelevant) but affirming bucket effects (rotation relative to the bucket's own mass or local bodies). GR's "local inertial frames" could be interpreted as *defined by* the surrounding matter distribution.  
  Tension arises: Does Rule A treat spacetime itself as the reference, while Rule B uses *proximate* matter? Her rejection of Newton's container suggests Rule A is GR-compatible, but Rule B might handle the globes case better.

  ### 2. Prediction for Closed Homogenous Case (152 words)  
  **She would say the water *climbs*.**  
  Reasoning: Her core commitment is that rotation isn't relational to distant masses but is locally measurable via inertial effects (geodetic deviation). In this homogenous universe, the cosmic fluid establishes *local inertial frames* – spinning relative to it creates centrifugal forces. Her anti-Mach view confirms that the *cause* isn't distant matter, but the local physical interaction (bucket vs. fluid). The fluid isn't "distant" but the immediate environment, defining local spacetime curvature. If she denied climbing here, it would imply rotation requires *inhomogeneous* backgrounds or privileged bodies, contradicting her GR stance. The cord-tension analogy applies: the fluid acts like a "body" providing the reference for tension/curvature.

  ### 3. Closest Analog (78 words)  
  The **two-globes-with-cord case** is most analogous. Here, the cord tension reveals absolute rotation in empty space. In the homogenous universe, the *cosmic fluid* functionally replaces the cord: spinning relative to it generates measurable stress (water climbing). Both cases reject needing "distant stars"; rotation is defined by local dynamical effects (tension/centrifugal force) tied to spacetime structure. Her GR view extends this: the fluid isn't a "body" but a *mass distribution defining local inertia*.

  ### 4. Underdetermination and the Fork (121 words)  
  If her record *doesn't* settle it, the ambiguity is whether "local inertial frames" require **non-uniformity** in the mass distribution:  
  - **Principle 1 (Geometric Absolutism):** Inertial structure is intrinsic to spacetime. *Prediction:* Water climbs; homogeneous fluid still defines frames.  
  - **Principle 2 (Local Dominance Relationism):** Inertial frames require a *local anisotropic* mass gradient to define "non-rotation." *Prediction:* Water stays flat; homogeneous fluid lacks a directional reference.  
  Her GR verdict ("rotation defined through local inertial frames") *suggests* Principle 1, but her silence on homogeneity leaves room for Principle 2 if she ties "local frames" strictly to *differential* matter effects.

  ### 5. Tell-Apart Case (79 words)  
  **Scenario:** A *small, isolated bucket in an otherwise perfect vacuum*, but with a *single, uniform spherical shell* of mass centered on it (homogeneous in all directions). The bucket spins relative to the shell.  
  - **Principle 1 predicts climbing:** Shell defines local inertial frames geometrically.  
  - **Principle 2 predicts flatness:** No local anisotropy (shell is symmetric); no gradient to reference.  
  This isolates whether she requires *directional asymmetry* in matter (Principle 2) or accepts symmetric mass-energy as defining frames (Principle 1). Her anti-Mach view leans toward Principle 1.
