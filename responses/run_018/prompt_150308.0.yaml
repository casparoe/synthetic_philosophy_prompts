prompt: |-
  I've been thinking about the phrase "Western values" — people invoke it to cover everything from free expression and secular governance to particular family structures or economic habits, and I'm unsure whether it names a coherent tradition or just serves as a rhetorical bundle in debates about immigration, education, and corporate ethics. Rather than treating it as a simple list, I'm interested in whether it functions mainly as a cultural boundary-marker or as a set of regulative ideals that could apply universally. Given that ambiguity, which open questions about the category's coherence and practical use matter most? Specifically, I'd ask you to prioritise — with reasons — the lines of inquiry that would actually help someone assess whether the phrase does real argumentative work: for example, whether it disguises universalist claims (such as human rights) as particular cultural heritage, whether it can be distinguished consistently from "modern" or "liberal" values without circularity, and how its rhetorical function shifts between exclusionary and inclusionary contexts. Which of these should be pursued first if one's aim is clear thinking about public argument rather than repeating slogans? Please answer in British English.
