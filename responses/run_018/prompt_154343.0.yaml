answer: |-
  ### Exam Question  
  **Time Allowed:** 90 minutes  
  **Word Guideline:** ~1000 words  

  > Goodman’s grue paradox demonstrates that not all generalizations are projectible, even when they align with all observed evidence. Critically evaluate whether the circularity inherent in grounding projectibility—either in past inductive success or linguistic entrenchment—can be avoided by appealing to *causal structure*.  
  >  
  > Consider a predicate **F** defined as follows: all observed instances of F exhibit property P before time *t* and property Q thereafter (mirroring grue’s structure). However, F is purportedly grounded in a **symmetric causal mechanism** operating uniformly before and after *t*, whereas the rival predicate "P" tracks an **asymmetric causal process** (e.g., irreversible decay). Does this mechanistic distinction supply an independent, non-circular criterion for projectibility? Or does identifying causal symmetry itself depend on the very inductive inferences Goodman’s paradox places in doubt?  
  >  
  > In your response:  
  > 1. Explain why Goodman rejects both syntactic solutions (e.g., purely logical definitions) and straightforward appeals to past success as solutions to the riddle.  
  > 2. Analyze whether F’s causal symmetry breaks the circularity *without* presupposing prior inductive commitments.  
  > 3. Defend a position on whether causal realism resolves the problem of induction or merely relocates it.  

  ---

  ### Model Answer (680 words)  

  Goodman’s grue paradox is not merely a puzzle about bizarre predicates but a profound challenge to the justification of induction. It reveals that two conflicting hypotheses—"all emeralds are green" and "all emeralds are grue" (where "grue" means green if observed before *t*, blue otherwise)—can be equally consistent with all evidence observed before *t*. Goodman’s solution invokes *entrenchment*: predicates like "green" are projectible because they feature in previously successful inductions and are linguistically entrenched. Yet this faces a circularity threat: if entrenchment relies on past success, it presumes the validity of prior inductions, and if it relies solely on linguistic practice, it appears arbitrary. The central question is whether causal mechanisms, such as those underlying predicate **F** (symmetric across *t*) versus "P" (asymmetric), offer an escape from this circle.  

  Goodman definitively establishes that syntactic criteria (e.g., "simplicity" or "naturalness" defined logically) fail. Grue can be redefined without explicit time-dependence (e.g., "grue if examined before *t* or not green otherwise"), rendering it syntactically parallel to green. Similarly, grounding projectibility in past inductive success is circular: we cannot justify future projections by past success without assuming that the past predicts the future—the very principle induction seeks to justify. Entrenchment avoids *explicit* circularity by appealing to linguistic practice, but this risks reducing projectibility to sociological contingency.  

  The **F-predicate case** tests whether causal realism breaks this deadlock. Suppose F’s underlying mechanism (e.g., a fundamental particle’s state transition) is time-symmetric, operating identically before and after *t*, while "P" tracks an asymmetric process (e.g., radioactive decay). At first glance, F’s symmetry provides an *epistemic* advantage: it reflects a law-like invariance, whereas projecting P beyond *t* would ignore its inherent temporality. However, this appeal presupposes that we can *know* the mechanism’s symmetry *independently of induction*. Herein lies the problem: verifying causal symmetry itself requires projecting observed regularities. For instance, confirming that the mechanism operates uniformly before *t* involves inducing that its behavior remains stable under varying conditions—a projection Goodman’s riddle problematizes. Worse, if we question whether causal relations themselves persist beyond *t*, we confront the same circularity: justifying mechanistic continuity relies on the uniformity of nature.  

  Proponents of causal realism (e.g., Boyd) might argue that mechanisms provide *abductive* grounds for projectibility: F is superior because symmetry offers the best *explanation* of the data. Yet Goodman anticipates this, noting that entrenchment shapes what counts as a "good" explanation. Before *t*, both F and P explain the evidence equally well; privileging symmetry assumes that explanatory virtues like parsimony are projectible—a claim grue calls into doubt. If we project explanatory norms inductively, circularity resurfaces.  

  Does this mean causal criteria collapse into entrenchment? Not entirely. Entrenchment is not *mere* convention for Goodman; it emerges from the recalcitrance of our entire inductive system to revision. Causal mechanisms could be seen as deeply entrenched features of scientific practice. However, this pragmatic turn concedes that no transcendent justification escapes the circle. The F-predicate case thus illustrates that mechanistic appeals *depend* on prior inductive commitments: identifying symmetry requires projecting that mechanisms observed before *t* reveal timeless properties, which is itself an inductive leap.  

  Ultimately, causal realism does not resolve the paradox but reframes it. It offers no *non-circular* foundation because establishing mechanistic criteria—like distinguishing symmetry from asymmetry—presupposes the reliability of the inductive inferences we aim to ground. Goodman’s entrenchment, while pragmatic, acknowledges this circularity rather than disguising it. The riddle endures not due to linguistic trickery but because justification requires inputs (past success, language, or causal models) whose own reliability induction alone cannot establish.  

  ---

  ### Marking Scheme (Total: 20 marks)  

  | **Point**                                                                                                | **Marks** | **Failure Mode**                                                                 |
  |----------------------------------------------------------------------------------------------------------|-----------|----------------------------------------------------------------------------------|
  | **(i) Accurately articulates Goodman’s circularity problem**: Explains why both past success and entrenchment lead to circularity or contingency, citing grue’s structure. | 4         | *Common fail:* Misdescribing entrenchment as arbitrary convention without linking to systemic practice. |
  | **(ii) Diagnoses why the F-predicate’s causal symmetry fails as an independent criterion**: Argues that identifying symmetry requires projecting mechanistic stability beyond *t*, thus presupposing induction. | 5         | *Common fail:* Asserting F is projectible "because mechanisms are real" without addressing how we justify continuity. |
  | **(iii) Engages Goodman’s rejection of non-pragmatic solutions**: Notes his dismissal of syntactic fixes and shows why causal realism may collapse into abduction shaped by entrenchment. | 4         | *Common fail:* Treating causal realism as a novel "solution" Goodman ignored rather than a variant of natural properties. |
  | **(iv) Evaluates entrenchment’s pragmatic role**: Positions it as Goodman’s non-foundationalist response to circularity, distinguishing it from crude conventionalism. | 4         | *Common fail:* Reducing entrenchment to word-frequency statistics divorced from historical practice. |
  | **(v) Original synthesis**: Weaves the F-case into a broader conclusion about circularity (e.g., "Causal criteria relocate but do not resolve the problem"). | 3         | *Common fail:* Reverting to textbook summary ("entrenchment solves it") without engaging the circularity threat. |

  ---

  ### Clarification of Settled vs. Contested Issues  
  - **Settled**:  
    - Goodman’s paradox structurally undermines syntactic and past-success-based solutions.  
    - Entrenchment is Goodman’s *proposed* resolution, tying projectibility to pragmatic, historically conditioned practice.  
    - Circularity arises if projectibility relies on prior inductions; contingency arises if it relies solely on language.  
  - **Genuinely Contested**:  
    - Whether causal-mechanistic criteria (e.g., symmetry) can avoid circularity *without* tacitly relying on induction (Jackson vs. Boyd).  
    - Whether Goodman’s entrenchment is best interpreted as conventionalist (language-dependent) or naturalist (tracking objective practices).  
    - If circularity is inescapable, whether it vitiates justification (skeptical view) or is benign (pragmatist view).  

  ---  
  This exam question forces engagement with the justificatory core of the riddle while using the F-predicate case to disrupt complacent appeals to causation. The model answer and rubric reward students who see that Goodman’s deepest challenge is to *any* non-question-begging grounding of induction.
