  To determine Mara's verdict on the *Kalliopi* and understand her underlying principles, we need to analyze her precedents and apply them consistently to the new case. Let's break this down step by step.

  ### Summary of Mara's Precedents
  1. **The *Merope* (sloop)**:  
     - **Changes**: All hull planks replaced gradually; keel and ribs (the frame) remained original.  
     - **Verdict**: Same boat.  
     - **Key point**: Core structural framework (keel and ribs) persisted.

  2. **Delivery van**:  
     - **Changes**: Doors, hood, seats, wheels, and engine replaced gradually; chassis and frame remained original.  
     - **Verdict**: Same van.  
     - **Key point**: Core structural framework (chassis and frame) persisted.

  3. **Footbridge**:  
     - **Changes**: All treads replaced gradually; load-bearing beams (the supporting structure) remained original.  
     - **Verdict**: Same bridge.  
     - **Key point**: Core structural framework (load-bearing beams) persisted.

  **Common principle in precedents**:  
  Mara consistently rules that an object remains the same as long as its **core structural framework** (e.g., keel/ribs for a boat, chassis/frame for a van, load-bearing beams for a bridge) remains intact, even if all non-core components are replaced gradually. The core provides continuity of identity.

  ### The *Kalliopi* Case
  - **Description**:  
    - An old fishing boat kept in continuous use.  
    - Hull planks were replaced gradually years ago (while the frame was untouched).  
    - Now, the oak frame (keel and ribs) is being replaced rib by rib over three winters.  
    - After the third winter, **no original wood remains**—neither planks, keel, nor ribs.  
    - No original material was preserved.  

  - **Comparison to precedents**:  
    - In all prior cases, the core framework (e.g., keel/ribs, chassis, beams) was **never replaced**; it persisted as the "backbone" of the object.  
    - In the *Kalliopi*, the core framework (the frame) is being **fully replaced**, leaving no original structural components. This is a critical difference.  

  - **Should Mara call it the same boat?**  
    To stay consistent, Mara **should not** call the *Kalliopi* the same boat.  
    - **Reason**: Her precedents hinge on the persistence of the core framework. Here, the core is entirely new, so the *Kalliopi* lacks the original structural anchor that defined identity in prior cases.  
    - **Closest analog**: The *Merope* (sloop) is the most relevant precedent (both are boats), but it diverges because the *Merope*'s frame was untouched, while the *Kalliopi*'s frame is replaced. The *Kalliopi* is a step beyond—it tests the **replacement of the core itself**.  

  - **Underlying principles and underdetermination**:  
    Mara's precedents **underdetermine** this case because they only address scenarios where the core framework is preserved. They do not specify what happens when the core is gradually replaced. Mara must now choose between two principles:  
    - **Core Persistence Principle**: Identity requires the core framework to persist (at least partially). Since the *Kalliopi*'s core is fully replaced, it is **not the same boat**. This aligns with the precedents' emphasis on the core.  
    - **Gradual Replacement Principle**: Identity persists if changes are gradual and continuous, even if all parts (including the core) are replaced. This would make the *Kalliopi* the **same boat**, but it extends beyond the precedents.  

    **Prediction for consistency**: Mara's prior focus on the core suggests she would adopt the **Core Persistence Principle**. Thus, the *Kalliopi* is not the same boat.  

  ### Proposed Next Case to Settle Mara's Principle
  To conclusively determine which principle Mara uses, present a case that isolates the core replacement issue in a simple, familiar object. This will force her to clarify whether core persistence is necessary or if gradual replacement alone suffices.

  - **Case: The Gradual Table**  
    - A wooden dining table has four legs and a tabletop.  
    - Over time, the tabletop is replaced (non-core).  
    - Then, each leg is replaced one by one (over years), while the table remains in use.  
    - After all replacements, no original wood remains—legs and top are entirely new.  
    - **Question**: Is it the same table?  

  - **Why this case?**  
    - **Mirrors the *Kalliopi***: Like the boat, the table's core (the legs, as the structural support) is fully replaced.  
    - **Tests the principles**:  
      - If Mara says **same table**, she uses the **Gradual Replacement Principle** (identity via continuity, not core persistence).  
      - If Mara says **not the same table**, she uses the **Core Persistence Principle** (identity requires the core to remain).  
    - **Clear and decisive**: The table lacks ambiguities like "keel vs. planks" in boats. The legs are unambiguously the core framework (like the van's chassis or bridge's beams).  

  - **Expected outcome**:  
    - If Mara ruled the *Kalliopi* was not the same boat (as predicted), she should also rule this is not the same table, confirming **Core Persistence**.  
    - If she surprises and rules the *Kalliopi* was the same, this case will reveal if she applies **Gradual Replacement** consistently or inconsistently.  

  ### Conclusion
  - **Verdict for *Kalliopi***: Mara should say it is **not the same boat** to stay consistent with her precedents. The core framework was replaced, violating the implicit Core Persistence Principle.  
  - **Closest analog**: The *Merope* (sloop), but with the critical difference of core replacement.  
  - **Next case**: Present **The Gradual Table** to definitively settle whether Mara prioritizes core persistence or gradual replacement as her guiding principle. This case will resolve the ambiguity exposed by the *Kalliopi*.
