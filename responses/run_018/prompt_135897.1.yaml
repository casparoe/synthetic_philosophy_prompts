  **Why it’s funny:**  
  The vault setup weaponizes Berkeley’s idealism (darkness = non-existence) against his monetary theory (idle cash = worthless tokens). The cash is *literally* nothing (unperceived) and *conceptually* nothing (unredeemed tickets), creating a layered philosophical "gotcha" where both doctrines dismantle the money’s value in one swoop.
