prompt: |-
  My election law professor has been super consistant about campaign finance cases this semester. Her verdicts so far:

  - Upheld a federal ban on contributions to candidates by foreign nationals (foreign individuals, foreign governments, and foreign-incorporated entities).
  - Struck down the federal ban on independent expenditures by corporations from their general treasuries; she loves Citizens United and keeps quoting it.
  - Upheld a disclosure law that forces a nonprofit running electioneering ads to reveal its top donors.
  - Upheld a per-election cap on what individuals can give directly to a candidate's campaign committee.

  The quote she would not stop repeating is from Justice Kennedy's opinion in Citizens United v. FEC (2010): "There is no basis for the proposition that, in the political speech context, the Government may impose restrictions on certain disfavored speakers."

  Next week's case is this: Congress passes a law that bars any U.S.-incorporated corporation from making independent expenditures in federal elections if more than 20% of its stock is owned by foreign citizens or foreign governments. So the corporation is domestic, but its ownership is meaningfully foreign. The law is challenged by a Delaware-incorporated company that is 30% owned by a foreign soverign wealth fund; the rest of its shares are held by U.S. citizens.

  Pick the two or three plausible rules that fit her four verdicts, say what each predicts about the Delaware company, and then give your best guess about her vote, with a one-paragraph defense. Also identify which of her four earlier cases is the closest analog, and say why. Be honest about which of her own commitments would be doing the work either way. End by naming the single future case that would most cleanly tell the rules apart.

  Please use these sections, in this order: "Live rules" (about 150 words); "What each predicts" (about 200 words); "Best guess" (about 150 words); "The tell-apart case" (about 40 words).
reasoning: |-
  Hmm, the user is presenting a complex legal scenario about campaign finance law, framed around their professor's consistent rulings. This seems like a law student grappling with nuanced constitutional principles, possibly preparing for an exam or class discussion. The core tension is between foreign influence concerns and corporate speech rights.

  The professor has established four clear positions: (1) upholding foreign contribution bans, (2) striking down corporate expenditure restrictions (citing Citizens United), (3) supporting donor disclosure, and (4) maintaining individual contribution limits. The Kennedy quote about not restricting "disfavored speakers" appears central to her philosophy.

  Now we're evaluating a new law banning independent expenditures by domestically incorporated corporations with >20% foreign ownership. The challenger is a Delaware corp with 30% foreign sovereign ownership. I need to identify 2-3 plausible doctrinal frameworks consistent with her past rulings.

  Three approaches emerge: 
  First, the "Citizens United absolutism" view would strike this down - since the corporation is US-incorporated, any ownership-based restriction would violate Kennedy's "disfavored speakers" principle. 

  Second, the "foreign influence exception" could uphold it by analogizing to the foreign contribution ban - the foreign ownership stake creates sufficient foreign nexus to justify regulation. 

  Third, a "compromise position" might focus on whether the law targets speech based on speaker identity or legitimate foreign influence concerns.

  The closest analog among her prior cases is clearly the foreign contribution ban case. Both involve preventing foreign money in elections, though this one deals with indirect influence through domestic entities. Her Citizens United stance suggests she might lean toward striking this down, but the foreign ownership element creates tension with her first ruling.

  For the "tell-apart" future case, I should propose a scenario that isolates the key conflict: say a corporation with 19% foreign ownership where the foreign owners actively direct political spending. That would force a choice between strict speech protection and foreign influence prevention.
answer: |-
  ### Live Rules
  Based on her jurisprudence, three plausible doctrinal frameworks emerge:  
  1.  **Citizens United Absolutism:** Corporate speech rights are absolute regardless of origin or ownership; restrictions based on speaker identity violate Kennedy's "disfavored speakers" principle.  
  2.  **Foreign Influence Exception:** *Citizens United* protects *domestic* corporate speech, but foreign ownership creates a compelling government interest in preventing foreign electoral influence, justifying restrictions.  
  3.  **Compromise Position:** Ownership-based restrictions are permissible only if they narrowly target *actual foreign control* over political messaging (e.g., foreign shareholders dictating content), not mere passive investment.  

  ---

  ### What Each Predicts  
  1.  **Citizens United Absolutism:** **Strikes down** the law. The Delaware corp is U.S.-incorporated and thus a domestic speaker. Restricting it based on foreign shareholders' *identity* is classic speaker-based discrimination, violating the core *Citizens United* principle she champions. Ownership ≠ speaker identity.  
  2.  **Foreign Influence Exception:** **Upholds** the law. The 30% foreign sovereign ownership creates a substantial risk of foreign influence over U.S. elections, analogous to the ban on direct foreign contributions she upheld. The U.S. incorporation is irrelevant if foreign interests meaningfully fund/control the spending.  
  3.  **Compromise Position:** **Likely strikes down** unless evidence shows foreign shareholders dictate ad content. A flat 20% ownership threshold is overbroad; passive foreign investment doesn’t inherently transform domestic corporate speech into "foreign" speech deserving restriction.  

  ---

  ### Best Guess  
  **She votes to STRIKE DOWN the law.** Her reverence for *Citizens United* and Kennedy's "disfavored speakers" quote is her dominant commitment. She sees corporations as independent speakers distinct from shareholders, so foreign ownership alone doesn’t negate their domestic speech rights. Banning expenditures based on shareholder identity is precisely the type of speaker-based restriction Kennedy condemned. While she upheld the *direct* foreign contribution ban, that involved funds flowing *from* foreign entities, not *through* a U.S. corporation. Here, the domestic corporate entity is the speaker, and her *Citizens United* logic shields its independent expenditures. The ownership cap is an indirect, status-based burden she’d reject.  

  **Closest Analog:** *Citizens United* (her 2nd verdict). Both cases involve restrictions on corporate independent expenditures based on corporate status (foreign ownership here, corporate treasury funds there). Her upheld cases involve direct contributions (foreign/individual) or disclosure – distinct burdens.  

  **Tension:** Her foreign contribution ban verdict shows concern about foreign influence, but *Citizens United*’s speaker-protection principle likely prevails for independent expenditures by a U.S. entity.  

  ---

  ### The Tell-Apart Case  
  A law banning independent expenditures by a U.S. corporation **only if** its foreign shareholders (holding >20%) **directly approve or script the specific political ad content**. This tests whether "foreign influence" requires *actual control* over speech (uphold) or mere ownership (strike down).
