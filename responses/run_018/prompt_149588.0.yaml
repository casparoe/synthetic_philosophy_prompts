  Okay, let me unpack this dense philosophical problem about Fomenko's New Chronology. The user sits on an interdisciplinary working group struggling to demarcate legitimate history from pseudohistory, specifically stuck on how to handle Fomenko's radical chronological revisionism. 

  First, I need to understand the core tension they describe: mainstream historians reject Fomenko outright while Fomenko supporters claim statistical rigor. The user suspects this isn't about empirical data but about what counts as valid explanation - narrative continuity vs statistical independence. 

  Hmm, the user raises three sharp possibilities: (1) it's a verbal dispute about authority vs accuracy, (2) there's hidden substantive disagreement about evidence hierarchy, or (3) they're answering different questions altogether under the label "history". I should test each against the actual practices described.

  Looking at what each side does: Historians rely on stratigraphy, material culture coherence, and textual transmission. Fomenko uses statistical dynastic correlations, astronomical recalibrations, and dismisses archaeology as misinterpreted. Crucially, both claim the same evidence but interpret it through incompatible frameworks. 

  Ah - this feels like textbook incommensurability. Historians see archaeological layers as physical timelines; Fomenko sees them as meaningless without astronomical verification. The evidential standards themselves are contested: what counts as "proof" differs fundamentally. No neutral ground exists because even basic terms like "contemporary evidence" mean different things (stratigraphy vs zodiacs).

  The user's hypothesis about explanatory norms seems correct but incomplete. The deeper issue is methodological sovereignty: historians prioritize consilience of evidence types while Fomenko demands mathematical falsifiability. This isn't resolvable by new evidence since each side reinterprets anomalies through their own lens. 

  For progress, I think demarcation needs reframing. Instead of seeking universal criteria, we should distinguish "historical reasoning" (explaining human past through trace interpretation) from "chronometric modeling" (quantifying temporal patterns). Fomenko does the latter while calling it the former - hence the category error. 

  The working group might break the deadlock by: (1) formally showing the statistical cherry-picking in Fomenko's dynastic matches, (2) analyzing why his zodiac redating violates textual criticism principles, or (3) explicitly arguing that stratigraphy anchors chronology precisely because it resists retrospective reinterpretation. 

  Most importantly, they should acknowledge that some disagreements persist because disciplines have different epistemic virtues - and that's okay. The demarcation line isn't between true/false but between answering "what happened" versus "what patterns exist in records."
answer: |-
  Your diagnosis of the deadlock is perceptive, but the disagreement runs deeper than a mere conflict of explanatory preferences. It's a case of **incommensurable epistemic frameworks rooted in divergent conceptions of historical evidence, disciplinary authority, and the ontology of the past**. Here’s a structured analysis:

  ---

  ### **1. The Core Disagreement: Substantive, Not Verbal**
     - **Fomenko’s Framework**: Treats history as a *formal system* reducible to statistical patterns and astronomical data. Key principles:
       - *Evidence Hierarchy*: Astronomical data > statistical correlations in chronicles > material/textual coherence.
       - *Epistemic Standard*: Mathematical falsifiability (e.g., zodiac redatings must align precisely with modern calculations).
       - *Rejection Mechanism*: Consilience (e.g., narrative continuity across sources) is dismissed as "scribal fabrication" if it contradicts statistical/astronomical models.
     - **Mainstream History**: Treats history as a *forensic narrative* built on trace evidence. Key principles:
       - *Evidence Hierarchy*: Stratigraphy/material culture > textual transmission > statistical/astronomical correlations.
       - *Epistemic Standard*: Consilience of independent evidence streams (e.g., coins, pollen, manuscripts, architecture converging on a timeline).
       - *Rejection Mechanism*: Statistical anomalies require local explanations (e.g., scribal errors), not systemic revision.

     **Why Substantive?**  
     The conflict centers on **which evidence has ontological primacy**:  
     - Historians see stratigraphy as *direct physical traces* of time’s passage.  
     - Fomenko sees it as *noise* to be overridden by mathematical models.  
     This is irreconcilable without agreeing on foundational standards of proof.

  ---

  ### **2. Hidden Empirical/Formal Issues**
  Three unresolved tensions fuel the deadlock:
     - **A. The Stratigraphy Dilemma**:  
       Fomenko claims stratigraphy is "systematically misread," but offers no replicable method to reinterpret layers *without* presupposing his chronology. Historians see this as circular.  
       *Progress Potential*: If Fomenko could predict material culture sequences *in advance* of excavation using his model (e.g., "Site X will show Egyptian artifacts beneath medieval strata"), it would force engagement. He does not.
       
     - **B. Astronomical Data vs. Textual Context**:  
       Fomenko redates Ptolemy’s *Almagest* based on stellar positions, ignoring that the text’s instruments/terminology match antiquity. Historians argue astronomical references are often *conventional* (e.g., poetic/archaizing), not precise observations.  
       *Progress Potential*: A formal study quantifying textual vs. observational intent in ancient astronomy (e.g., error margins in Greco-Roman star catalogs) could test if redatings are methodologically sound.
       
     - **C. Statistical Independence Claim**:  
       Fomenko’s dynastic correlations assume chronicle lists are independent datasets. Historians note they descend from shared sources (e.g., Eusebius), making spurious correlations inevitable.  
       *Progress Potential*: A computational model testing whether Fomenko’s methods generate false positives when applied to *known* fabricated chronologies (e.g., 19th-century nationalist histories).

  ---

  ### **3. Incommensurable Questions**
  The camps aren’t just debating chronology—they’re answering distinct questions:
     - **Historians**: *"What coherent account explains all traces of the past?"*  
       (Requires abduction: inference to the best explanation.)
     - **Fomenko**: *"What formal model best fits a subset of data (chronicles/astronomy) under rigid quantitative assumptions?"*  
       (Requires deduction: model consistency trumps trace evidence.)

  This divergence is masked by shared terms like "evidence" or "accuracy." Fomenko seeks *internal consistency*; historians seek *external corroboration*.

  ---

  ### **4. Demarcation: Why It Feels Ill-Posed**
  The impasse reveals that **demarcation cannot rely on universal rules** because:
     - Pseudohistory is defined *relationally* within a disciplinary matrix. Fomenko’s work lacks key markers of legitimacy (e.g., engagement with counterevidence, incremental revision, peer critique).
     - Yet "institutional authority" isn’t arbitrary: mainstream history’s methods yield *practical success* (e.g., radiocarbon dating consistently validates stratigraphy; Fomenko’s zodiac redatings conflict with ice-core/volcanic timelines).

  ---

  ### **Path to Progress**
  #### **Immediate Steps**:
     - **Conceptual Distinction**: Separate *historical chronology* (a forensic reconstruction) from *chronicle analysis* (a statistical exercise). Fomenko does the latter but frames it as the former.
     - **Formal Refutation**: Commission mathematicians to:
       1. Simulate Fomenko’s dynastic matching on randomized/biased datasets to test robustness.
       2. Recalculate his Almagest redatings using historically attested observational error margins.

  #### **Long-Term Resolution**:
     - **Methodological Rule**: Adopt a *priority principle*: **When stratigraphy/material culture conflicts with textual/statistical models, the burden of proof lies with the model to explain the divergence without ad hoc assumptions.**  
       (Fomenko fails this by dismissing archaeology as "misread" sans positive evidence.)
     - **Honest Recognition**: Acknowledge that **totalizing theories** (like Fomenko’s) are inherently unfalsifiable because they reinterpret *all* counterevidence as fabrication. Thus, demarcation requires:  
       - Engagement only with theories that accept *some* core evidence as untainted.  
       - Rejection of theories that invoke systemic conspiracy (e.g., "all archaeologists are wrong") without extraordinary proof.

  ---

  ### **Conclusion**
  The deadlock arises because Fomenko and mainstream history operate in **epistemically sealed frameworks**. Progress requires:
  1. Formal debunking of Fomenko’s technical claims (e.g., statistical flaws),
  2. Explicit agreement that **stratigraphy is non-negotiable** as trace evidence of time, and  
  3. Recognizing that Fomenko’s project is not history but *metaphysical speculation*—a quantitative narrative about how the past *could have been*, not how it *likely was*.

  The demarcation question is valid, but its answer lies in *pragmatic realism*: a theory is pseudohistorical when it systematically denies the best-attested traces of the past to preserve its axioms. Fomenko’s chronology crosses this threshold.
