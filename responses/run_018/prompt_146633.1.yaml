  3. **Compatibility with Causal Decision Theory (CDT)**: Jeffrey updates focus on probability, while CDT deals with decisions based on causal structures. If partitions drift, causal models might also need updating, creating a compounded problem. However, this might be a later-stage issue once partitions are stable. Prioritizing it now could be premature if the foundation (partitions) is shaky.

