  Assessing boundary drift’s severity: It’s not pedantry. In dynamic systems (e.g., climate change), categories evolve, and AI agents face changing environments. Ignoring drift risks models becoming unmoored from reality. Philosophers are right to flag it, but framing it as a “research program” suggests solutions might exist—like meta-partitions or context-sensitive boundaries. This makes it a worthy grant focus: high stakes, underexplored, with cross-disciplinary impact.

  Trade-offs: Funding boundary drift might not yield quick wins but could prevent future crises. Evidence handling offers faster, incremental benefits. Balancing both could be ideal, but if forced to choose, upstream investment in drift is more strategic.

