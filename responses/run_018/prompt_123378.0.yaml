prompt: |-
  I'm in a distributive justice seminar and my TA keeps falling back on 'choice not circumstance' like it definately settles every objection. Last week they used it to argue that students who picked a low-paying major shouldn't recieve debt relief, but people born with chronic illness should get full healthcare subsidies regardless of lifestyle choices. I feel like the slogan is hiding a bunch of seperate arguments. Can you lay out the precise claims it could be expressing — the trivial version, the one about desert tracking choice, the version that requires some deep metaphysical freedom, maybe one about causal vs moral responsibility — and for each say whether it's defensible and whether it actually gets them the debt-relief conclusion? I also want to know if there's a reading where the choice/circumstance line collapses because every choice is shaped by background conditions, and which of these readings people usually mean when they invoke it to shut down redistribution arguments. Make it a menu I can bring to office hours, not a lecture.
