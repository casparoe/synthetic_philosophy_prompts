  I'm putting together questions for a podcast interview with a philosopher — let's call her the guest — who defends a pretty specific take on historical contingency. She thinks the classic for-want-of-a-nail picture is definately overblown: macro-history has structural attractors, and the little events we treat as turning points only look decisive because we retrospectivly cherry-pick the branches that actually diverged, while ignoring all the near-misses that collapsed back into the same basin. She calls this narrative bifurcation bias. I want 8 to 10 questions that don't just ask is history deterministic. At least one needs to press her on the July Crisis of 1914 without letting her just say it was near a bifurcation point; another should ask what she does with chaos-theoretic climate models that seem to show genuine initial-condition sensitivity; and one should probe whether her bias claim is falsifiable or just a hermeneutic gloss. For each question, include a follow-up tailored to the answer she's most likely to give — probably something about structural dynamics or epistemic selection effects. Keep it focused, no generic how-did-you-get-into-philosophy stuff. I might have misspelled hermeneutic, not sure.
