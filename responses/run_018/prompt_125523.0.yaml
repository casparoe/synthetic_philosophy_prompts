answer: |-
  Here are five desiderata:

  1. **Independence Explanation**: The account must elucidate why AC is independent from ZF, framing Cohen's models not as mere technical artifacts but as revealing a genuine ontological underdetermination regarding the existence of choice functions for arbitrary collections of sets.  
  2. **Global/Local Distinction**: It must differentiate the significance and justification of global choice (e.g., a well-ordering of the universe) from local instances (e.g., choice within a specific topos), accounting for their distinct roles and acceptability in different mathematical frameworks.  
  3. **Banach-Tarski Reconciliation**: The interpretation must reconcile AC's essential role in preserving core results of classical analysis (e.g., vector space bases, Tychonoff's theorem) with its generation of counterintuitive geometric consequences like Banach-Tarski, explaining this divergence in terms of measurability or definability limitations.  
  4. **Ontological Commitment Clarification**: It must clarify whether the existential claims secured by AC-based non-constructive proofs entail a different ontological status for the asserted objects compared to those guaranteed by explicit constructions, addressing the nature of mathematical existence.  
  5. **Principle or Commitment**: The account must determine whether AC expresses a fundamental logical principle concerning the possibility of selection *simpliciter* (akin to quantifier rules) or reflects a substantive, perhaps contingent, set-theoretic commitment about the comprehensibility of infinite collections.
