  Write the desiderata that any philosophical interpretation of the axiom of choice must satisfy. Rather than treating the question as a binary truth-value, frame it around what an adequate account owes us regarding arbitrary selection: it must explain AC's independence from ZF without reducing Cohen's forcing model to a mere curiosity, distinguish global choice principles from local ones as they operate in categorical settings, reconcile AC's licensing of the Banach-Tarski paradox with its preservation of standard real analysis, clarify whether non-constructive existence proofs carry ontological commitments distinct from explicit constructions, and determine whether AC expresses a logical principle about selection or a specifically set-theoretic commitment about infinite collections. Present exactly five desiderata, numbered, each in one or two sentences, with no introduction or conclusion.
