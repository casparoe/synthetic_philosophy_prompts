prompt: |-
  I'm the student affairs compliance officer at a mid-size public university, and I have to rule on maybe five cultural or religious accomodation requests a week — prayer spaces, dining exemptions, dress-code waivers, holiday conflicts. There's never a framework. I want a decision procedure I can run in about fifteen minutes, grounded in the real tension between French laïcité (the public institution should stay blind, not fund or spotlight religion in shared space) and Anglo-American multiculturalism (equal citizenship sometimes means treating people differently so group difference doesn't become exclusion).

  Turn that into ordered questions I ask in sequence, with what counts as a sufficient yes/no at each step, where the procedure stops with a hard no, where it hands off to a values call I have to flag for the dean, and where it misfires. Inject two practitioner checks: an "invisibility audit" — not just is religion present, but does the accomodation force people who don't share it to navigate around a religious marker in shared institutional space? — and a "burden-shift check" that asks who bears the cost of denial: a private cost the student absorbs, or does it push them out of a public good?

  Then run it on two requests:
  1. A student org wants university funds and permanent signage for a prayer room used mainly by Muslim students, open to all but in the student center.
  2. A chemistry student wants to wear a loose religious sleeve under the required fitted lab coat, offering an extra flame-resistant layer.

  One should come out with an answer I probably won't like — say which and why. Also say exactly what the procedure can't do: what kinds of case it has no grip on, and where it will definitely misfire. Keep it practical — I have to sign off, I don't have a philosophy degree, and I can't call an expert every time.
reasoning: |-
  Okay, let me tackle this user's problem. They're a compliance officer dealing with religious accommodations at a university. They need a practical, step-by-step decision procedure that balances French laïcité and Anglo-American multiculturalism. 

  First, I need to understand their core tension: public neutrality versus accommodating diversity. The user mentioned "invisibility audit" and "burden-shift check" as key tools. That makes sense—assessing whether an accommodation imposes on others and who bears the cost if denied.

  The user wants a 15-minute process. So the steps must be clear and sequential with hard stops. I'll structure it as a flowchart of yes/no questions. Each step needs explicit criteria to avoid ambiguity. 

  For the invisibility audit: How visible is the religious element in shared space? Does it force non-participants to interact with it? For burden-shift: If denied, is the cost private (student absorbs it) or does it exclude them from a public good? 

  Now, testing the procedure on two cases. The prayer room request involves funding and signage—that's high visibility in a shared space. The chemistry student's sleeve is under the lab coat, so less visible and adds safety. 

  The prayer room case should probably get a "no" under laïcité principles because permanent signage and funding make religion publicly visible in a neutral space. The sleeve accommodation is likely a "yes" since it's invisible and denial would push the student out of a public good (education). 

  I should note where the procedure fails. Cases involving doctrinal sincerity or vague burdens won't fit well. Also, it might misfire if an accommodation seems invisible but creates subtle peer pressure. 

  The user needs something actionable without philosophy degrees. So I'll keep the language plain, avoid jargon, and emphasize practical checks. They'll appreciate knowing exactly when to escalate to the dean too.
answer: |-
  Here’s a streamlined 15-minute decision procedure grounded in the **laïcité/multiculturalism tension**, designed for practical use. It prioritizes hard stops early, includes your key checks, and flags ambiguous cases for escalation:

  ### Decision Procedure: Religious/Cultural Accommodation Requests  
  *(Run in sequence — stop at first "NO" or "HANDOFF")*

  1. **LEGAL SAFETY CHECK**  
     *Question: Does granting this request violate federal/state law or create an unambiguous safety hazard?*  
     - YES → **HARD STOP: DENY** (e.g., removing fire alarms for ritual smoke)  
     - NO → Proceed to Step 2.  
     *Sufficient NO:* No clear statutory violation or documented safety risk (e.g., OSHA standards).

  2. **BURDEN-SHIFT CHECK**  
     *Question: If denied, is the cost primarily *private* (e.g., inconvenience) or does it functionally exclude the student from a *core public good* (education, campus life)?*  
     - PRIVATE COST → **HARD STOP: DENY** (e.g., missed optional social event)  
     - EXCLUDES FROM PUBLIC GOOD → Proceed to Step 3.  
     *Sufficient exclusion:* Blocks access to academic credit, required facilities, or degree progression.

  3. **INVISIBILITY AUDIT**  
     *Question: Does the accommodation make non-participating individuals *navigate around or materially interact* with a religious marker in shared institutional space?*  
     - YES → **HANDOFF TO DEAN** (Values call: neutrality vs. inclusion)  
     - NO → Proceed to Step 4.  
     *Sufficient YES:* Physical detour, mandatory funding allocation, permanent signage, or altered use of public space (e.g., hallway prayers forcing traffic rerouting).

  4. **RESOURCE NEUTRALITY TEST**  
     *Question: Can the accommodation be provided using existing resources/schedules *without* reallocating staff, funds, or space from secular functions?*  
     - YES → **APPROVE**  
     - NO → **HANDOFF TO DEAN** (Values call: Is this group’s access worth reallocating public resources?).  
     *Sufficient YES:* Uses unused rooms, volunteer time, or student org funds without impacting secular operations.

  ---

  ### Test Cases

  **Case 1: Prayer Room (Funding + Signage)**  
  1. **Safety/Legal:** No → Proceed.  
  2. **Burden-Shift:** Denial excludes from community life (public good) → Proceed.  
  3. **Invisibility Audit:** **YES** — Permanent signage & dedicated funding make religion *visible/active* in shared space. Non-Muslims must "navigate" it symbolically/financially.  
     → **HANDOFF TO DEAN**. *Why you won’t like it:* Under laïcité, this fails Step 3. But burden-shift (Step 2) justifies review. Dean must weigh neutrality vs. inclusion.

  **Case 2: Flame-Resistant Sleeve Under Lab Coat**  
  1. **Safety/Legal:** **Adds safety** → Proceed.  
  2. **Burden-Shift:** Denial may exclude from chem lab (core academic good) → Proceed.  
  3. **Invisibility Audit:** **NO** — Sleeve is hidden under secular lab coat. No navigation required.  
  4. **Resource Neutrality:** Uses student’s own clothing; no staff/resources needed.  
     → **APPROVE**. *Fits procedure:* Invisible, no burden-shift, adds safety.

  ---

  ### What This Procedure **Can’t Do**:  
  1. **Judge Sincerity:** Can’t assess if a belief is "genuine" (e.g., "Is she *really* Sikh?").  
  2. **Minor Burdens:** Private costs (e.g., mild schedule tweaks) auto-deny at Step 2, even if easy to grant.  
  3. **Third-Party Harms:** E.g., peers offended by a religious symbol. Procedure ignores non-material impacts.  
  4. **Doctrinal Nuance:** "Must pray at *exact* sunset" vs. flexible window? No grip — defer to student’s assertion.  

  ### Where It **Misfires**:  
  - **Overly Broad Requests:** E.g., "All Hindu exams moved for Diwali" fails Step 2 (private cost) but might warrant group negotiation.  
  - **"Invisible" Coercion:** E.g., a "voluntary" prayer circle in a study lounge. Passes audit but may pressure peers.  
  - **Emerging Tech:** VR prayer spaces? Audit struggles with digital "shared space."  

  **Key Strength:** Forces explicit tradeoffs. Step 3 (Invisibility Audit) protects laïcité by flagging symbolic presence. Step 2 (Burden-Shift) forces multiculturalism’s core question: *"Is this about access or preference?"*  

  **Dean Handoff Script:**  
  *"Step [3/4] triggered. Request requires weighing institutional neutrality against exclusion risk. Options: Approve (prioritizing access), Deny (prioritizing neutrality), or seek compromise (e.g., temporary signage, student-funded space)."*  

  You’re not deciding philosophy — you’re enforcing a procedural fence between private accommodation and public entanglement.
