  hey, i'm trying to map out some recurring moves in conservative argument and there's one pattern i keep seeing that i can't quite name. here's the situation: someone defends an old institution or law using Chesterton's fence logic -- don't tear a fence down until you know why it was put up. then, when you show the original problem it solved is basically gone, they don't drop the fence. instead they say its survival through all these changing conditions proves it has some hidden adaptive value we can't fully articulate. but then, if you propose a brand-new institution designed specificaly for current conditions, they reject it using the same fence logic -- it's new so we don't know what hidden problems it might cause, and it hasn't survived long enough to prove hidden value. so the old thing is protected both because it might have a hidden purpose and because it has survived, and the new thing is rejected both because it lacks survival proof and because it might have hidden flaws. is there an established concept for this exact circularity? it's not just Chesterton's fence, since that doesn't require the survival-to-value inference. it's not pure status quo bias either, because there's a specific epistemic story about hidden functions that makes the circularity look principled. can you name it, or if not coin something precise, and then map out exactly where it differs from the fence proper, from path dependency, and from plain risk aversion?

  before answering, brainstorm for a minute about whether this sits closer to political epistemology or decision theory.

