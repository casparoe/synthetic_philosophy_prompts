answer: |-
  Here's a breakdown of the pattern you've identified, leveraging conceptual analysis and political philosophy:

  **1. Bottom Line:**
  This pattern constitutes an **epistemic asymmetry in institutional justification**, creating a self-sealing defense for traditional institutions while imposing impossible evidentiary burdens on novel alternatives. It weaponizes uncertainty: unknown functions justify preserving the old, while unknown risks justify rejecting the new. There isn't a single universally accepted concept for *this precise circular move*, but **"Survival-Tested Conservatism"** (STC) captures its core logic.

  **2. The Carving: What It Is and Isn't (Approx. 300 words)**
  *   **Core Phenomenon:** A double-move leveraging epistemic limitations:
      1.  **For Existing Institutions:** When the *original, articulated purpose* (Chesterton's initial "why") becomes obsolete or indefensible, the justification seamlessly shifts. The institution's mere *survival over time* is presented as *prima facie evidence* of latent, adaptive functions ("hidden value") that we, due to bounded rationality or complex social evolution, cannot fully perceive or articulate. Survival itself becomes the proof of function.
      2.  **For Proposed Alternatives:** Novel institutions are rejected *precisely because* they lack this history. Their newness means they haven't undergone the "test of time," making their potential *latent dysfunctions* ("hidden problems") unknowable and therefore unacceptably risky. The absence of survival history becomes proof of *potential* dysfunction.
  *   **The Circularity:** The *only* way a new institution can gain the epistemic legitimacy granted automatically to old ones is by surviving long-term. But it cannot survive long-term unless it's implemented. The old institution is shielded from disproof by its survival record, while the new one is barred from proof by the lack of one.
  *   **Key Differentiators:**
      *   **Not Mere Preservation:** It goes beyond simply preferring the familiar. It offers a specific *epistemic story* about why survival *equals* functional validation.
      *   **Not Simple Risk Aversion:** It's *asymmetric* risk assessment. Potential risks of the new are foregrounded, while potential benefits are discounted. Conversely, potential risks of *removing* the old are foregrounded (via presumed hidden value), while potential benefits of removal are discounted. The status quo benefits from a presumption of latent functionality.
      *   **Distinct from Prudence:** Prudence involves weighing known risks and benefits based on evidence. STC leverages *unknowns* asymmetrically: unknowns about the old signal value, unknowns about the new signal danger.

  **3. Residue / Near Misses: Why Existing Concepts Fall Short (Approx. 200 words)**
  *   **Chesterton's Fence (CF):** CF is the *starting point* ("understand before destroying"). It *doesn't* mandate what happens *after* understanding reveals the original purpose is gone. CF is a principle of inquiry; STC is a principle of *default preservation* that activates *after* CF-style inquiry fails to justify the institution on its original terms. CF doesn't equate survival *itself* with hidden value.
  *   **Path Dependency:** This describes how past choices constrain future options due to sunk costs, network effects, or institutional inertia. It *explains why* the old institution persists but doesn't provide the *normative justification* for its persistence that STC does. Path dependency is descriptive (why we *are* stuck); STC is justificatory (why we *should be* stuck).
  *   **Status Quo Bias:** This is a broad psychological tendency to prefer existing states. STC *is* a manifestation of status quo bias, but it's a specific, *intellectually articulated* subspecies. It provides a seemingly rational, epistemic veneer ("We *know* this survives, we *don't know* what the new will do") that elevates it beyond mere inertia or loss aversion. The "hidden function/survival proof" narrative is the key differentiator missing from generic status quo bias.

  **4. Provisional Name & Tight Definition with Boundary Cases (Approx. 150 words)**
  *   **Name:** **Survival-Tested Conservatism (STC)**
  *   **Definition:** A justificatory framework for institutions asserting that: (1) the long-term survival of an institution constitutes sufficient evidence of latent adaptive value, even when its original purpose is obsolete or unknown; and (2) the absence of such a survival record for novel proposals constitutes sufficient evidence of unacceptable risk from potential latent dysfunctions. This creates an epistemic double standard privileging existing institutions by leveraging uncertainty asymmetrically.
  *   **Boundary Cases:**
      *   **Not STC:** Arguing an old institution has *documented, specific* latent functions beyond its original purpose (e.g., churches fostering social cohesion). STC relies on *assumed*, *unknowable* functions evidenced only by survival.
      *   **Not STC:** Rejecting a new proposal based on *specific, articulable risks* grounded in evidence or analogy, rather than solely its novelty and lack of survival proof.
      *   **Edge Case:** Genuine, high-stakes uncertainty where the risks of change are catastrophic and truly unknowable (e.g., geoengineering). STC applies this logic *systematically* to institutional change, even when risks are more mundane. The circular move is key.
