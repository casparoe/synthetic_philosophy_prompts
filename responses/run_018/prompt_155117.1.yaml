  Let me map out what's unique here. Chesterton's fence is just the initial step: don't remove without understanding. But in this pattern, when understanding shows the original reason is gone, they invoke survival-as-proof. That's different. Then for new proposals, they demand impossible proof of future survival while ignoring that all institutions were once new. That's the circularity: survival proves value, but only existing things have survival, so only old things get the benefit of doubt.

