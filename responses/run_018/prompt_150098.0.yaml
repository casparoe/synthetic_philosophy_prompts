answer: |-
  Here's a reusable decision procedure designed as a checklist for your staff, grounded in practical museum needs and addressing Ranke, Carr, and White. It's structured as a series of "gates" each panel/caption must pass.

  **The "History Check" Procedure (Per Panel/Caption/Audio Script Segment - 5 Min Max)**

  **Step 0: Preparation**
  *   Read the text *aloud* (or listen to the audio snippet).
  *   Identify the **core factual claim(s)** or **key event(s)** the text is trying to convey.

  **Gate 1: The Ranke Gate - "What Actually Happened?" (Fact Check & Source Integrity)**
  *   **Q1: Is every specific factual claim (names, dates, locations, quotes, actions) verifiable by a cited source or established historical record?**
      *   PASS: Yes, or it's a broad, uncontested historical context statement (e.g., "Steamships replaced sail in the late 19th century").
      *   REWRITE: No. Find a source or remove/soften the claim (e.g., change "The police chief ordered the violent crackdown" to "Contemporary accounts state the police chief ordered the violent crackdown").
  *   **Q2: Are quotes presented accurately and in context? Does the framing match the quote's actual content?**
      *   PASS: The quote's meaning isn't distorted by the surrounding text. The framing (e.g., emotion, significance) is supported *by the quote itself* or clearly attributed as interpretation.
      *   REWRITE: The framing imposes meaning not present (e.g., quoting a hopeful striker's letter but framing it solely as foreshadowing tragic defeat *without* other evidence showing defeat was certain/known then). Either reframe to match the quote's tone, add evidence justifying the framing, or drop the dramatic framing.
  *   **Q3: Are there undefined jargon or terms a general visitor won't understand?**
      *   PASS: Terms are defined, clear from context, or common knowledge.
      *   REWRITE: Add a brief definition or simplify.

  **Gate 2: The Carr Gate - "Why This Fact? Why Now?" (Selection & Relevance Justification)**
  *   **Q4: Is a significant, relevant fact omitted that is crucial for understanding the event fairly? (Especially context, motives, or consequences)?**
      *   PASS: Omitted facts are genuinely tangential *to this specific panel's focus* OR space constraints force painful but justified cuts *without creating bias*. (Justification needed in Step 5 note).
      *   REWRITE: A crucial fact is omitted, creating a misleading impression (e.g., leaving out the police chief was a factory shareholder when discussing his actions against strikers). **Add the missing context.**
  *   **Q5: Can you articulate a clear, defensible reason *why this specific selection of facts* is included on *this specific panel* for *this exhibit*? (Link to exhibit theme/story/visitor takeaway).**
      *   PASS: Yes (e.g., "This quote shows striker morale," "This fact reveals economic pressure," "This omission avoids cluttering the core narrative of *this specific negotiation*").
      *   FLAG FOR CURATOR: The only justification is "It makes the story simpler/more dramatic" or "It supports our preferred narrative." Needs value judgment on relevance vs. oversimplification.
  *   **Q6: Does the selection unfairly privilege one perspective (e.g., only management, only strikers, only police) without justification?**
      *   PASS: The perspective is clearly identified (e.g., "A striker's view...") OR the panel's specific focus justifies a single perspective *and* other panels provide balance.
      *   REWRITE: Multiple key perspectives exist, and only one is presented without justification. Add a brief counterpoint or context.

  **Gate 3: The White Gate - "What Story Are We *Really* Telling?" (Narrative Framing & Emplotment Check)**
  *   **Q7: Are there loaded adjectives, adverbs, or verbs implying a *specific* moral judgment, inevitability, or emotional arc (tragedy, triumph, farce, satire) not directly supported by the cited facts?**
      *   PASS: Language is neutral and descriptive. Any judgment is clearly attributed to a historical actor (e.g., "Strikers denounced the deal as a betrayal").
      *   REWRITE: The text itself imposes judgment/plot (e.g., "The negotiations inevitably collapsed," "It was a tragic miscalculation"). **Replace with neutral description** (e.g., "The negotiations failed," "The decision had severe consequences for the strikers").
  *   **Q8: Does the text imply a clear "ending" or "moral" (e.g., defeat, victory, lesson learned, futility) that might not be the only valid interpretation?**
      *   PASS: The outcome is stated factually. Broader meaning is left open or attributed.
      *   FLAG FOR CURATOR: The text strongly implies a singular, overarching meaning or moral for the event (e.g., "This defeat doomed union efforts for a generation," "This victory proved the power of solidarity"). Requires curator decision on interpretive stance.
  *   **Q9: Does the sequence/grouping of facts *on this panel* artificially create a plot structure (e.g., hero/villain, rising action/climax) that the raw facts alone don't demand?**
      *   PASS: The grouping is chronological, thematic, or logical based on the facts presented. No forced dramatic arc.
      *   REWRITE: Facts are arranged primarily for dramatic effect, creating a simplified plot. **Reorganize based on chronology or clear theme.**

  **Step 5: Final Sign-off**
  *   If text passed all Gates: **APPROVED**
  *   If Rewritten at any point: **RE-CHECK** the revised text through all Gates.
  *   If Flagged for Curator: **SEND TO CURATOR** with specific note on *which gate* flagged it (Q5, Q8) and *why*.
  *   **Note:** Briefly jot down the Carr justification (Q5) for your own records/if questioned later.

  ---

  **What the Procedure CAN'T Catch:**

  1.  **Visual Layout/Design:** How images, font size, color, or placement subtly influence interpretation (e.g., a scowling police chief photo next to strikers' demands).
  2.  **Audio Tone:** Voice actor's inflection, background music, or sound effects creating mood (e.g., somber music under a striker's quote).
  3.  **Visitor Prior Knowledge/Assumptions:** How visitors' existing beliefs might filter the information presented.
  4.  **Overall Exhibit Narrative Arc:** The combined effect of *all* panels creating an overarching emplotment the procedure checks only panel-by-panel.
  5.  **Implicit Cultural Biases:** Deeply embedded assumptions in language choice that aren't overtly judgmental but carry baggage (requires broader sensitivity review).

  ---

  **Worked Examples:**

  **Example 1: Drop the Dramatic Framing (Fails Gate 1, Q2)**
  *   **Text:** "The hopeful strikers, unaware of the tragedy awaiting them, wrote: 'Our spirits are high, justice will prevail!' (Letter, Oct 12, 1888). Days later, the crushing defeat began."
  *   **Check:**
      *   Gate1/Q1: Quote is sourced? (Assume yes). PASS.
      *   Gate1/Q2: **FAIL.** The quote expresses hope. The framing ("unaware of tragedy," "crushing defeat") imposes a tragic plot *onto the quote itself* without evidence *from the quote or this panel* that defeat was certain *at the time of writing*. Rewrite: Remove the tragic framing adjectives. "Strikers expressed determination: 'Our spirits are high, justice will prevail!' (Letter, Oct 12, 1888). Negotiations broke down the following week."

  **Example 2: Defensible Selection Under Carr (Passes Gates, Justified at Gate 2, Q4/Q5)**
  *   **Text:** "On November 5th, negotiations between the Dockworkers' Union and the Shipowners' Association focused solely on hourly wage increases. No agreement was reached."
  *   **Omission:** The Association also demanded a 10% reduction in crew sizes per ship, which was a major sticking point for the union.
  *   **Check:**
      *   Gate1/Q1: Factual? (Assume yes). PASS.
      *   Gate2/Q4: Is omission crucial? **PASS (if justified).** *Justification (Q5):* This panel focuses *only* on the wage demand aspect to simplify a complex negotiation for a specific point about bargaining positions. The crew size issue is covered in detail on the *next* panel about safety and job security. The omission here avoids cluttering *this specific point* and the full context is provided nearby.
      *   Other Gates: PASS (Neutral language, no emplotment).

  **Example 3: Hit the "Get the Curator" Wall (Flags at Gate 3, Q8)**
  *   **Text:** "The failed 1892 strike stands as a tragic testament to the futility of confronting overwhelming corporate power without national union backing. Local solidarity, however noble, was crushed."
  *   **Check:**
      *   Gate1/Q1: Factual elements? (Strike failed, no national backing? Assume yes). PASS.
      *   Gate3/Q7: **REWRITE.** "Tragic testament," "futility," "overwhelming," "crushed" – loaded language. Rewrite descriptively: "The 1892 strike failed. The local union lacked support from national organizations. The company successfully employed strikebreakers and legal injunctions."
      *   Gate3/Q8: **FLAG FOR CURATOR.** The revised text states facts. BUT, the *original intent* was to convey a specific interpretation: the strike's failure demonstrates the futility of local action vs. corporate power and is a tragedy. *Should this interpretive conclusion be included?* If so, *how explicitly?* This is a values-laden historical argument about meaning/legacy, not just a fact. **Curator must decide** if/how to present this specific interpretation.

  By following this checklist, your staff can systematically catch the most common issues related to Ranke (factual accuracy/quote fidelity), Carr (biased omission/selection justification), and White (sneaky emplotment/imposed narrative) without needing a PhD. It gives your grad-student friend concrete reasons beyond "historiography says so," and hopefully, fewer eye rolls!
