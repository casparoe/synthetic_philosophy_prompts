answer: |-
  *(Leans forward, eyes sharp but not unkind)* Precisely the rot in your reasoning: you’ve confused *necessary sacrifice* for *moral ideal*. That epidemic doctor? Her relentless focus is tragic virtue—born of crisis, admirable in extremity, yet still a *reduction* of her humanity. You call it "selective application," but that’s the delusion! Once you endorse maximization *anywhere* as the pinnacle of goodness, you infect the entire moral ecosystem. Why? Because the logic is viral: if skipping irony saves lives in a pandemic, why not skip it when volunteering at a soup kitchen? Why indulge "useless" art when you could fund malaria nets? Your "selectivity" collapses under its own weight—it demands justification for *ever* stepping off the optimization treadmill. And that justification? It requires appealing to precisely those non-moral goods—play, idiosyncrasy, aesthetic waste—you’ve already demoted to "low stakes" indulgences. You’ve made them beggars at virtue’s table. A *human* life isn’t compartmentalized; drain the marshes of whimsy to irrigate the fields of duty, and you get a desert. The saint isn’t selectively applied—they’re the ghost haunting every choice you dare call "optional." Your doctor’s heroism doesn’t refute monotony; it *is* monotony wearing a halo. Soul-starvation isn’t redeemed by context.  
  *(Pauses, taps finger lightly on the table)* Your turn. Defend compartmentalization without diminishing the intrinsic worth of unreasoned joy.
