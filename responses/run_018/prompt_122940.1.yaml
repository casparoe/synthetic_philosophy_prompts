  We are going to break down the philosophical dispute about "knowing how" vs. "knowing that" using the vocabulary provided. We will address the three diagnostic cases and the two framings, and then provide a residue report.

  ### Core Dispute in Technical Terms

  The dispute is between two positions:

  1. **Anti-Intellectualism (Rylean view):** Knowing how is a distinct kind of state from knowing that. It is a set of dispositions or abilities, not a set of propositions.
  2. **Intellectualism:** Knowing how is a species of knowing that. It is knowledge of propositions, but under a practical mode of presentation.

  We'll use the provided vocabulary to restate the core arguments.

  #### Ryle's Regress Argument (Anti-Intellectualist)

  - **Original:** If every intelligent action requires prior contemplation of a proposition (which is itself an intelligent action), we get an infinite regress.
  - **Translation:**
    - Imagine that every time you run a program (intelligent action), you must first compile a specification (contemplate a proposition). But the compilation itself is an intelligent action (it can be done well or poorly). So, to compile the specification, you would need to run a meta-program that compiles the compiler? And that meta-program would need to be compiled? This leads to infinite regress at compile time, and you never get to runtime.
    - Therefore, at some point, you must have a pre-compiled executable (a set of dispositions) that runs without recompiling (without prior contemplation). This is knowing how.

  #### Intellectualist Reply

  - **Original:** Knowing how is knowing a proposition under a practical mode of presentation, so no prior act of contemplation is needed because the proposition is already in a form that directly guides action.
  - **Translation:**
    - The agent has a "practical proposition" stored in a way that it can be executed directly, without an explicit interpretation step at runtime. This is like having a runtime that can directly execute a declarative artifact without an interpreter because the artifact is in a form that the runtime natively understands (e.g., bytecode for a VM, or a configuration that the system can consume without parsing). Alternatively, it could be that the proposition was used at compile time to generate an executable (the agent's disposition), and then the proposition is no longer needed at runtime.

  ### Diagnostic Cases

  #### Case 1: Senior Engineer Debugging Data Races

  - **Situation:** The engineer can find data races but cannot articulate the rule. His performance degrades when he tries to narrate.
  - **Anti-Intellectualist Translation:**
    - His knowledge is a set of compiled routines (dispositions) that run without being interpreted. Trying to articulate is like decompiling at runtime, which is expensive and error-prone (like a Heisenbug: observation alters the behavior). There is no declarative artifact (or it's not accessible) that he can read and interpret; the competence is in the compiled code (his trained neural net, so to speak).
  - **Intellectualist Translation:**
    - He knows a proposition (the rule) under a practical mode. It's stored in a form that is directly executable (like bytecode) but not easily decompilable to a declarative form. The degradation under narration is due to the overhead of translating from the practical mode to a declarative one (like running a debugger on a production system).

  #### Case 2: Trained Policy vs. Hand-Written Library for Sorting

  - **Situation:** Both sort correctly, but one is a trained neural network (policy) and the other is a hand-written library.
  - **Anti-Intellectualist Translation:**
    - The hand-written library is based on knowing that (a specification and an algorithm). The trained policy is knowing how without knowing that: it's a set of weights that produce the correct output without representing the algorithm as propositions. The policy is like a black-box executable without source code.
  - **Intellectualist Translation:**
    - Both are instances of knowing that. The hand-written library explicitly encodes the propositions (the algorithm). The trained policy also encodes the proposition (the sorting rule) but in a compiled, non-human-readable form (the weights). The intellectualist might argue that the network's weights represent the proposition under a practical mode (they are a realization of the proposition in a form that the network's runtime can execute).

  #### Case 3: Junior Engineer with Runbook

  - **Situation:** The junior can recite the runbook but fails under pressure.
  - **Anti-Intellectualist Translation:**
    - The junior has knowing that (the runbook as a declarative artifact) but not knowing how. Knowing how requires having the procedure compiled into a disposition (like a compiled binary) that runs without conscious interpretation. Under pressure, the junior is trying to interpret the runbook step-by-step (like an interpreter) which is slow and error-prone. The senior, by contrast, has the procedure pre-compiled.
  - **Intellectualist Translation:**
    - The junior knows the propositions (the runbook) but not under a practical mode. The senior knows the same propositions but under a practical mode (like having the runbook pre-loaded into a fast cache, or compiled into bytecode). The failure under pressure is due to the junior's runtime being unable to efficiently interpret the declarative runbook in real-time.

  ### Your Framings

  #### Framing 1: The Interpreter Problem

  - **Your framing:** If knowing how is knowing that, then we have a declarative artifact plus an interpreter. If the interpreter is inside the agent, then either (a) it's trivial because any ability can be so described (by pairing it with an interpreter that runs it) or (b) it leads to regress (the interpreter must itself be interpreted). If the interpreter is outside, then the agent's knowledge isn't what's guiding the action.
  - **Assessment:** This is a faithful rendering of the core dispute. The anti-intellectualist uses the regress argument to attack the internal interpreter. The intellectualist avoids regress by saying the proposition is in a form that doesn't require interpretation (it's directly executable). So the intellectualist would reject the claim that an interpreter is always needed. They might say that the "practical mode" means the proposition is stored in a way that the agent's runtime natively executes it (like native code) without an interpreter.

  #### Framing 2: Runtime Guidance vs. Compile-Time Generation

  - **Your framing:** Is the practical proposition (the "that") read at runtime (like a config file) or only at compile-time (like a spec that generates code and is then discarded)?
  - **Assessment:** This is also faithful and gets to the heart of the intellectualist reply. The intellectualist can choose either:
    - **Runtime:** The proposition is stored in a practical format and read at runtime without interpretation (like a config in a format the system natively understands). No regress because no interpretation step.
    - **Compile-time:** The proposition was used once to generate the executable (the disposition) and is not needed at runtime. The agent's current state (the executable) is the knowing how, but it was produced by knowing that (at compile-time). This avoids regress because the generation happened in the past.
  - However, note that if the intellectualist chooses compile-time, then at runtime the agent doesn't have the proposition anymore (only the compiled code). So is the agent still "knowing that" at runtime? The intellectualist might say the compiled code is the proposition in a different form. The anti-intellectualist would say the runtime state is not propositional.

  ### Residue Report: What Gets Lost in Translation?

  We'll now evaluate what translates cleanly, what requires distortion, and what doesn't translate.

  #### Clean Translations

  - **Ryle's regress argument:** Translates cleanly to the compile-time infinite regress (needing to compile the compiler). This is a strong point in your vocabulary.
  - **The senior engineer case (Case 1):** The idea of decompiling (narrating) causing performance issues is a clean match for Heisenbugs and runtime overhead.
  - **The junior engineer case (Case 3):** The distinction between having a runbook (declarative) and having a compiled procedure (executable) is clear.
  - **The interpreter problem framing:** This is a direct and clean way to capture the regress worry.

  #### Translations Requiring Distortion (Smuggling)

  - **Knowing how as a disposition (anti-intellectualism):** We can map this to a compiled executable. But the philosophical notion of "disposition" includes counterfactual behavior (how one would behave in various situations). In systems, we can think of an executable that handles many inputs, but the philosophical concept is broader and includes responses to novel situations. We smuggled in the idea of generalization without explicitly tying it to the system's design (like the trained policy in Case 2).
  - **Practical mode of presentation (intellectualism):** We mapped this to bytecode or native code. But the philosophical concept is meant to explain why the same proposition, when known under a practical mode, directly motivates action. In systems, we don't have a good analog for "motivation" – we have execution but not the reason why execution happens. We smuggled in the idea of "direct execution" without capturing the normative force (why the agent acts on it).
  - **Case 2 (trained policy):** The intellectualist claim that the trained policy "knows that" is a stretch. In systems, we don't typically say the weights are a proposition; they are a representation that can be used to compute the output. The intellectualist is essentially saying that any function that computes a sorting algorithm is an encoding of the proposition "how to sort", but that's a very broad use of "proposition". This might be smuggling in a redefinition of "proposition" to include any state that produces behavior consistent with the proposition.

  #### Untranslatable Elements

  1. **Normativity:** Knowing how involves not just doing something, but doing it correctly. In philosophy, knowing how has a normative aspect (you can do it well or badly). In our systems, we have correctness (tests, specs) but the normative element is external (the spec). The agent's "knowing" in philosophy includes an internal standard. We don't have a good analog for this in the vocabulary.
     - **Verdict:** This is a defect in the vocabulary for capturing the normative aspect of knowledge. The philosophical claim is clear but requires normative concepts (like standards of correctness) that are not central in systems engineering.

  2. **Degrees of Knowing How:** Anti-intellectualists argue that knowing how comes in degrees (you can be better or worse at it) while knowing that is all-or-nothing. In systems, we can have better or worse implementations (optimized vs. unoptimized) and we can have tests that check for degrees of compliance. But for knowing that, if we model it as storing a proposition, then it's binary (you have it or not). However, we can also have incomplete or buggy declarative artifacts. This doesn't map perfectly.
     - **Verdict:** This is a sign that the philosophical claim might be less clear than it looks. Knowing that can also come in degrees (e.g., partial understanding of a complex spec). The systems vocabulary actually handles degrees well (e.g., test coverage) so perhaps the philosophers are drawing too sharp a distinction.

  3. **The Agent's Perspective:** The philosophical debate often concerns the first-person perspective (what it is like for the agent). In systems, we have no first-person perspective; we have code and execution traces. The idea that a running process "knows" something in the same way a person does is anthropomorphism. When we say a trained policy "knows how", we are speaking metaphorically.
     - **Verdict:** This is a sign that the two sides are arguing past each other. The anti-intellectualist is focused on the agent's experience (which we cannot capture in systems terms), while the intellectualist is abstracting away from experience to the underlying state. The systems vocabulary is neutral about experience, so it cannot settle the debate about the agent's perspective.

  4. **Compiled Code as Proposition (Intellectualism):** The claim that compiled code (or trained weights) is still a "proposition" is problematic. In systems, a proposition is typically a declarative statement (a spec), not an executable. The intellectualist stretches "proposition" to include any state that encodes information about the world. This doesn't map cleanly to the declarative artifacts in our vocabulary.
     - **Verdict:** This is a defect in the philosophical claim: it becomes less clear when extended to non-linguistic representations. The systems vocabulary forces us to see a sharp distinction between declarative and executable artifacts, which the intellectualist blurs.

  #### Your Distinction: Competence in Repository, Runtime, Trained Weights

  - This distinction is orthogonal to the debate. Both sides can acknowledge that competence can be stored in different forms (source code, compiled binary, weights). The debate is about whether the stored state (whatever its form) should be considered a kind of proposition.
  - The anti-intellectualist would say: only the repository form (declarative) is knowing that; the runtime and weights are knowing how.
  - The intellectualist would say: all three are knowing that, but in different forms (source code is declarative, compiled code and weights are practical modes).
  - So the distinction is visible in the debate, but it doesn't resolve it. The two sides disagree on how to classify the runtime and weights.

  ### Final Verdict

  - **What works:** The systems vocabulary is excellent for exposing the regress problem and for distinguishing between different forms of storage and execution. The diagnostic cases and your framings are well-handled.
  - **What gets lost:** The normative aspect (standards of correctness) and the first-person perspective do not translate. The systems view also resists the intellectualist's expansion of "proposition" to include compiled code and weights.
  - **Recommendation:** The debate is about the nature of the agent's internal state. In systems, we don't ascribe knowledge to processes; we have representations and executions. Therefore, the debate might be fundamentally about the philosophy of mind, not about engineering. For practical purposes, your distinction between repository, runtime, and weights is more useful than the philosophical categories.

  In summary: the translation reveals that the core dispute (about regress) is well-captured, but the philosophical positions rely on concepts that go beyond what is needed in systems engineering. The residue (normativity, agent perspective) might be essential to the philosophical debate but is not essential for your work.
answer: |-
  ### Systematic Translation of the Debate into Your Vocabulary

  The core dispute is whether "knowing-how" (KH) is reducible to "knowing-that" (KT) or is a distinct kind of state. Below, I translate key claims, arguments, and your diagnostic cases using your provided vocabulary. I'll then evaluate your framings and provide a residue report.

  ---

  ### **1. Core Claims Translated**
  #### **Anti-Intellectualism (Rylean View): KH ≠ KT**
  - **Claim:** KH is a *dispositional state* (like a compiled executable), not a *propositional state* (like a spec).
  - **Regress Argument Translation:**  
    If every action requires runtime interpretation of a KT (e.g., parsing a config file to guide behavior), this creates a recursive dependency: the interpreter itself must be interpreted, leading to infinite regress (a "runtime stack overflow"). To avoid this, we need pre-compiled, directly executable artifacts (KH) that run without interpretation.  
    *Example:* A scheduler doesn't recompile its code on every task; it relies on pre-optimized binaries.
  - **"Degrees of Competence" Translation:**  
    KH admits degrees (e.g., optimized vs. unoptimized code), while KT is binary (a spec is either correct or incorrect). You can have a partially correct implementation (KH) without a fully accurate spec (KT).

  #### **Intellectualism: KH is a Species of KT**
  - **Claim:** KH is KT under a *practical mode of presentation* (e.g., a declarative artifact pre-processed for direct execution).
  - **Reply to Regress:**  
    No runtime interpretation is needed because the "practical KT" is already in an executable form (e.g., bytecode for a VM). The agent isn't "reinterpreting propositions" but executing pre-inferred instructions.  
    *Example:* A just-in-time (JIT) compiler converts specs to machine code once; subsequent runs use the cached executable without reinterpretation.
  - **"Guise" Translation:**  
    The same proposition (e.g., "Sort input via quicksort") can exist in two forms:  
    - **Declarative:** Human-readable spec (KT).  
    - **Compiled:** Optimized machine code (KH as KT in practical guise).  

  #### **Key Argument: "Insufficiency of KT for KH"**
  - **Anti-Intellectualist Translation:**  
    Having a spec (KT) doesn't guarantee a working implementation (KH). Example: A bug-free spec doesn't prevent race conditions in the compiled binary.  
  - **Intellectualist Translation:**  
    The gap arises from *incomplete compilation*. If the KT is fully elaborated (e.g., formal proofs + edge cases), it *does* entail KH. The "insufficiency" is just unmet compile-time requirements.

  ---

  ### **2. Your Diagnostic Cases Translated**
  #### **Case 1: Senior Engineer Debugging Data Races**
  - **Anti-Intellectualist View:**  
    The engineer's KH is a *compiled heuristic* (e.g., a trained policy). When forced to articulate rules, he "decompiles to source" at runtime, introducing overhead (like debug logging) that degrades performance. His knowledge is an *optimized runtime artifact*, not a declarative spec.  
  - **Intellectualist View:**  
    He knows a proposition (e.g., "Check contention patterns in scheduler logs") under a practical guise. The narration fails because translating "bytecode to source" is lossy and slow.  
  - **What's Revealed:**  
    KH as a pre-compiled state avoids runtime interpretation costs. Forcing declarative access undermines performance (a "Heisenbug of cognition").

  #### **Case 2: Trained Policy vs. Hand-Written Sorter**
  - **Anti-Intellectualist View:**  
    - *Trained Policy:* KH without KT. It's a black-box executable (e.g., neural weights) with no declarative trace. Correctness is emergent from training, not propositional rules.  
    - *Hand-Written Library:* KH derived from KT (source code reflects declarative knowledge).  
    **→ Difference:** Policies lack a "repository artifact"; their competence is in weights, not specs.  
  - **Intellectualist View:**  
    Both are KT in practical form. The policy's weights encode propositions ("Mapping inputs to sorted outputs") inferred from training data. The library's source code is KT in human-readable form.  
  - **What's Revealed:**  
    Dispute centers on whether *non-symbolic representations* (weights) count as "propositions."

  #### **Case 3: Junior Engineer with Runbook**
  - **Anti-Intellectualist View:**  
    The junior has KT (runbook as declarative artifact) but lacks KH (compiled competence). Under pressure, runtime interpretation fails (e.g., a slow interpreter crashing under load).  
  - **Intellectualist View:**  
    The junior has KT but not in a *practical guise*. The runbook needs compilation (e.g., rehearsal into muscle memory) to become KH.  
  - **What's Revealed:**  
    Emphasizes the cost of runtime interpretation and the need for pre-compilation.

  ---

  ### **3. Evaluation of Your Framings**
  #### **Framing 1: The Interpreter Problem**
  - **Faithfulness:** Directly captures the dispute.  
    - Intellectualists see the "interpreter" as a **compile-time tool** (e.g., a compiler transforming KT to KH). No regress because compilation is a one-time, non-intellectual act (like AOT compilation).  
    - Anti-intellectualists argue the interpreter must be **runtime** (leading to regress) or **external** (breaking agency).  
  - **Why It Matters:** Exposes whether "practical guise" requires *ongoing* interpretation. Intellectualists reject this; anti-intellectualists insist it's unavoidable.

  #### **Framing 2: Runtime Guidance vs. Compile-Time Generation**
  - **Faithfulness:** Core to the debate.  
    - Intellectualists allow both:  
      - *Compile-time:* KT is discarded after generating KH (e.g., training a policy).  
      - *Runtime:* KT is embedded in the executable (e.g., a VM with bytecode).  
    - Anti-intellectualists argue compile-time generation *destroys* KT, leaving only KH. Runtime guidance is circular.  
  - **Your Suspicion Confirmed:** Philosophers often conflate these. Your framing disentangles them, showing intellectualism is viable only if "practical guise" means **no runtime interpretation**.

  ---

  ### **4. Residue Report: What Gets Lost?**
  #### **Claims That Translate Cleanly**
  - **Regress argument:** Maps perfectly to infinite interpretation stacks (runtime) vs. pre-compiled executables (compile-time).  
  - **"Insufficiency of KT for KH":** Cleanly parallels gaps between specs and implementations (e.g., unhandled edge cases).  
  - **Degrees of KH:** Translates to optimized vs. unoptimized code, test coverage, or heuristic accuracy.  
  - **Diagnostic cases:** Fully expressible in terms of runtime overhead, compilation, and representation.

  #### **Claims Requiring Distortion (Smuggling)**
  - **"Practical Guise" (Intellectualism):**  
    - *Smuggled Concept:* "Guise" implies a semantic transformation (e.g., Propositions-as-Types to machine code). But in systems, this is just **compilation or encoding**. Calling weights/bytecode "KT" stretches "proposition" beyond declarative artifacts.  
    - *Why?* Philosophers assume propositions can be "practically formatted," but your vocabulary treats specs and executables as distinct classes.  
  - **Dispositions (Anti-Intellectualism):**  
    - *Smuggled Concept:* Dispositions are **counterfactual behaviors** (e.g., "If condition X, do Y"). Your vocabulary captures this as event-driven code (e.g., `if` statements), but philosophers imbue it with *teleology* ("goal-directedness"), which lacks a clear analog.  

  #### **Untranslatable Claims**
  1. **"Knowing-How as Non-Propositional":**  
     - *What's Lost:* Anti-intellectualists see KH as *sui generis* (e.g., a running process with no repo artifact). Your vocabulary **can** represent this (e.g., a VM state, trained weights), but philosophers add a metaphysical claim: "KH isn't *reducible* to KT." This irreducibility has no technical correlate—it's a boundary dispute.  
     - *Verdict:* **Defect in philosophical clarity**. The dispute collapses when KH is viewed as encoded KT (intellectualist) or an emergent behavior (anti-intellectualist). Your vocabulary reveals both are possible.  

  2. **Agency and "Guidance":**  
     - *What's Lost:* Philosophers debate whether KT "guides" action (implying conscious access). Your vocabulary has **no analog for subjective guidance**. A config file isn't "guiding" a server; it's input data.  
     - *Verdict:* **Sign the sides argue past each other**. "Guidance" conflates:  
       - *Mechanism:* How data flows to execution (e.g., configs at runtime).  
       - *Phenomenology:* The agent's experience of control.  
       Only the former is in your vocabulary.  

  3. **Competence Locations (Repo/Runtime/Weights):**  
     - *Orthogonal Distinction:* Philosophers ignore *where* competence is stored. Your triad (repo = KT, runtime/weights = KH) is invisible to them. Anti-intellectualists might call **all three** KH if no declarative artifact exists; intellectualists might call **all three** KT.  
     - *Verdict:* **Defect in philosophical scope**. Your distinction exposes that the debate is about *representation*, not storage.  

  #### **Verdict on the Residue**
  - **Lost to Vocabulary Limits:** Normative concepts (e.g., "correctness") and first-person experience. Your vocabulary describes *what works*, not *what ought to be*.  
  - **Lost to Philosophical Blurriness:** "Guidance" and "reducibility" are underspecified. Your framings expose this.  
  - **Fundamental Insight:** The debate is **not about systems** but about *language*. "Knowing" is a folk concept stretched to cover both specs (KT) and behaviors (KH). In engineering terms:  
    - KH is the **running process**.  
    - KT is the **version-controlled artifact**.  
    Whether they are "the same" depends on your level of abstraction (e.g., hardware vs. code).  

  ---

  ### **Conclusion**
  - **Cleanly Translated:** The regress argument, degrees of competence, and diagnostic cases fit your vocabulary. Intellectualism ↔︎ Compile-time generation; Anti-intellectualism ↔︎ Runtime interpretation.  
  - **Smuggled:** "Practical guise" as compilation; "dispositions" as event-driven code.  
  - **Untranslatable:** Subjective "guidance," metaphysical irreducibility, and normative judgments.  
  - **Your Victory:** Your framings (interpreter problem, runtime-vs-compile) are faithful and expose conflation in the philosophical literature. The residue is either philosophically fuzzy (guidance) or outside engineering's scope (phenomenology).  
  - **Practical Takeaway:** In systems, KH is **runtime competence** (processes/weights), KT is **declarative artifacts** (specs/source). They interact but aren't identical—because a running process is stateful, while a spec is static. The dispute dissolves when you distinguish repositories (KT), runtimes (executing KH), and trained policies (compiled KH).
