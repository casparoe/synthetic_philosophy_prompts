  Your gut reactions are remarkably consistent with behavioral principles and risk perception - they form a coherent pattern once we decode the underlying heuristics. Here's how they unify under a single framework:

  ### The Core Principle
  **"Undefined EV is psychologically dangerous only when paired with *unbounded downside risk* - but becomes acceptable (or even attractive) when losses are capped or outcomes bounded. Humans prioritize *downside containment* over mathematical expectation properties."**

  ### How It Explains Your Cases
  1. **St. Petersburg (Infinite EV)**:  
     - *Why ~$15?* Your brain truncates the payoff distribution. The 99.999% probability of winning <$100 dominates your valuation. Infinite EV is irrelevant when extreme payoffs are astronomically improbable.

  2. **Pasadena (Undefined EV)**:  
     - *Why pay <$8?* The oscillation creates ambiguity, but small *probable* losses (-$1, -$2 outcomes) feel manageable. You're paying a small premium for the *chance* at high upside.

  3. **Capped Losses (-$10 floor)**:  
     - *Why pay $50+?* **Downside containment neutralizes undefined EV.** Worst-case loss is known and acceptable. Your valuation now focuses on the uncapped upside potential.

  4. **Capped Gains (+$10 ceiling)**:  
     - *Why refuse even +$5?* **Unbounded downside + undefined EV = existential dread.** No amount of upside compensation feels sufficient when losses could be catastrophic. Classic loss aversion amplified.

  5. **Bounded Oscillation (-3 to +3)**:  
     - *Why neutral?* Outcomes are psychologically equivalent to a coin flip. Boundedness makes the undefined EV mathematically irrelevant to your intuition. Risk is perceptually finite.

  6. **Fragile St. Petersburg**:  
     - *Why ~$12?* The 0.1% ruin risk adds a small downside overlay, slightly reducing your valuation. But since probable outcomes are unchanged, it doesn't radically alter your stance.

  ### Resolving the Tensions
  - **3 vs 4 (Mirror Paradox)**: Perfectly explained by **asymmetric loss aversion**. Humans fear unlimited losses more than they value unlimited gains. Your "huge line" reflects that evolutionary wiring.  
  - **1 vs 3 (Infinite vs Undefined)**: With capped losses, Game 3 offers a *better risk-adjusted profile* than St. Petersburg. You'll trade "infinite EV" for "no ruin risk" because the latter aligns with survival heuristics.

  ### Your Unasked Case: Dominance Ordering
  If one gamble dominates all others *state-by-state* (better in every possible outcome), your principle would say: **"Play it regardless of undefined EV."** Why? Downside is contained *relative to alternatives*. If all options share the same worst-case loss, undefined EV becomes a non-issue.

  ### Does "Relative Expectation" Fit?
  Conceptually yes, but it's not necessary. Your intuition already uses a **truncated reality principle**:  
  - Ignore outcomes with <0.1% probability  
  - Cap losses at psychologically tolerable thresholds  
  - Value bounded risks linearly  
  - Treat unbounded downside as unacceptable  

  ### Verdict: You're Highly Consistent
  Your responses reveal a sophisticated risk calculus prioritizing:  
  **1. Downside containment** > **2. Plausible upside** > **3. Mathematical expectation properties**  

  This isn't irrational—it's how humans navigate uncertain environments. When loss ceilings exist, undefined EV becomes an academic curiosity. When downside is open-ended, it triggers visceral avoidance. Your gut is smarter than the math in real-world contexts.
