  ok so i've been trying to map out my actual gut feelings on gambles where expected value doesn't exist, not just infinite like st petersburg but actually undefined — the pasadena game kind of thing. here's where i land.

  1. classic st petersburg: coin flip, 2^n payout. EV is infinite. my verdict: i'd pay maybe 15 dollars, definitely not 1000. so infinite EV doesn't mean infinite value to me.

  2. the pasadena game itself — the one where you flip coins and the payoff rule is set up so the expectation literally doesn't converge, there's no number it's heading toward. verdict: i'd play for free, but i wouldn't pay more than like 8 bucks. feels riskier than st pete even though st pete has 'bigger' infinity.

  3. then there's this twist i cooked up: same undefined expectation structure, but now there's a hard floor — you can never lose more than 10 dollars — while the upside is still unbounded. verdict: i'd happily pay 50, maybe more. the undefinedness doesn't scare me when the downside is capped.

  4. the mirror image: upside capped at 10 dollars, downside unbounded with the same undefined expectation pattern. verdict: hard no. wouldn't even play if you paid me 5.

  5. another one: expectation is undefined because the partial sums oscillate, but every actual outcome is between -3 and +3. verdict: i feel totally neutral, like it's a coin flip. the undefined math doesn't enter my intuition at all.

  6. finally, st petersburg but with a hidden twist: there's a 0.1% chance the bank goes bust and you lose your stake plus get nothing. verdict: still pay about 15, maybe 12. barely changes.

  the thing that's bugging me is 3 vs 4 — they seem like perfect mirror images, but my gut draws a huge line between them. and then there's 1 vs 3: both have unbounded upside and weird expectation issues, but i value 3 way higher than 1 even though 1 has 'infinite' EV and 3 just has undefined. so there's definetly tension.

  is there a single principle that gets all six, or do i need to drop one? maybe something about bounded downside being the real driver, and undefined EV is only scary when it can bite you? also, what would this principle say about a case i haven't listed: a gamble where expectation is undefined, but there's a clear dominance ordering — every other available option is worse no matter what the outcome is?

  i've heard people mention relative expectation as a way to fix pasadena, but i don't know if that matches my gut or just sounds fancy. don't need citations, just want to know if my verdicts add up to something coherent or if i'm being inconsistent.
