  First, I notice their gut reactions consistently prioritize downside protection over mathematical properties of expectation. The capped-loss scenario (3) gets enthusiastic acceptance while the mirrored upside-capped version (4) triggers extreme aversion - even when both share the same undefined expectation structure. This asymmetry feels deeply human; loss aversion amplified by uncertainty.

  The neutral reaction to bounded oscillations (5) is particularly telling. It suggests the "undefined" label only bothers them when coupled with tail risk - if all outcomes are contained, the mathematical indeterminacy becomes irrelevant to their intuition. Meanwhile, the fragility twist in St. Petersburg (6) hardly moves their valuation needle, reinforcing that their risk perception is dominated by immediate, probable outcomes rather than remote catastrophes.

  About the mirror paradox: their different treatment of 3 vs 4 isn't logically inconsistent but reveals how humans weight gains/losses. Prospect theory would expect this - the disutility of massive loss isn't offset by equivalent gain potential. The "undefinedness" in the downside direction feels more threatening because losses loom larger psychologically.

  For the infinite-vs-undefined valuation (1 vs 3): while St. Petersburg has "infinite" EV, its payoff distribution is inefficient - tiny probabilities of huge payouts that humans discount. Game 3 offers similar upside but with loss protection, creating a more favorable risk profile. Their brain essentially says: "undefined with insurance beats infinite with exposure."

  The unasked dominance scenario is interesting. If a gamble dominates all alternatives state-wise, their principle would likely accept it regardless of undefined EV - since no better option exists. This would extend their downside-aversion logic: undefined math matters less when you're objectively choosing the least-bad option.

  Relative expectation (like comparing average utilities) might formalize some intuitions but feels inadequate for their mirrored cases. Noisy payoff variance seems more relevant - scenarios 3/4 both have extreme variance but in opposite directions, triggering different psychological alarms.

  Ultimately their coherence comes from a three-layer heuristic: (1) Cap catastrophic losses first, (2) Only then consider upside potential, (3) Ignore "undefined" labels when outcomes are bounded or dominated. It's not purely mathematical but adaptively rational given human neural wiring.
