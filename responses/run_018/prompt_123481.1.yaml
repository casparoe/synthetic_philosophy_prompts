answer: |-
  Dennett's narrative self model doesn't require narrative uniqueness to avoid fragmentation, but your analysis insightfully exposes its core tension. Let's resolve this through Dennett's own framework:

  **1. The Analogy's Limits & Functional Integration**  
  Your critique correctly identifies the gravitational analogy's physicalist pitfall. Dennett employs it *heuristically* – not as a physical field dynamic, but as a metaphor for *functional integration in a virtual machine*. The brain's narrative processes operate through competitive "multiple drafts" (Dennett's Pandemonium model), where coherence emerges from winner-takes-all competition among neural processes. Contradictory narratives don't create separate centers because:
  - **Temporal binding**: Competing narratives typically dominate at different times (e.g., "I'm capable" at work vs. "I'm inadequate" in relationships)
  - **Hierarchical nesting**: Conflicting sub-narratives often resolve under higher-order narratives (e.g., "My self-doubt stems from childhood")
  - **Behavioral arbitration**: The brain selects the narrative that best predicts/controls current environmental demands

  **2. Accommodating Disjoint Reports without Eliminativism**  
  Radically disjoint narratives (e.g., dissociative identity disorder) *do* challenge the model but don't break it:
  - **Graduated Fragmentation**: Dennett would view multiplicity not as binary ("one self/many selves") but as degrees of narrative integration failure. Competing centers emerge when neural subsystems develop semi-autonomous narrative circuits (e.g., due to trauma)
  - **No Hidden Arbitrator**: The "arbitration" is decentralized – it's the outcome of:
    - *Attentional selection* (which narrative currently accesses global workspace)
    - *Affective weighting* (emotional salience of narratives)
    - *Social reinforcement* (which self-story gets validated externally)
  - **Functional Utility Persists**: Even fragmented narratives serve adaptive functions (e.g., DID alters handle distinct trauma contexts). The model remains non-eliminativist because these narrative structures *really control behavior*.

  **3. Avoiding Metaphorical Overextension**  
  The key is recognizing that "gravity" here symbolizes *explanatory necessity* – not physical force:
  - **Center of Gravity ≠ Center of Mass**: Just as a planet's center of gravity is a single calculative tool despite internal complexity, the narrative self is a *unifying heuristic* for predicting behavior.
  - **Contradiction Tolerance**: Physical bodies have one center of mass regardless of irregularity; similarly, the narrative self persists as the *dominant behavioral pattern* despite internal conflicts. Parallel narratives (e.g., ideal vs. actual self) create tension but not fission unless they generate truly dissociated behavioral streams.

  **Conclusion**: Dennett's model requires not narrative *uniqueness* but narrative *predominance* for unity. It accommodates radical disjunction through:
  - **Competitive functionalism** (narratives as control structures)
  - **Degrees of integration** (unity as scalar, not binary)
  - **Virtual causation** (no homunculus, just emergent winner-takes-all dynamics)

  The framework survives your challenge precisely by rejecting physical-field dynamics in favor of computational and functional constraints – where "gravity" denotes the attractor state in a neural network's state space, not a Newtonian force. This preserves realism about the self's causal efficacy without reification or eliminativism.
