prompt: |-
  I am a software engineer with no formal background in philosophy, and I keep noticing a recurring move in system-design discussions that I cannot name. The pattern involves two concrete cases.

  In the first, a team proposes replacing a recommendation algorithm. They show that every current user receives an outcome at least as good as before, and they observe that users who would have joined only under the old algorithm do not exist in the new system, so no one is worse off; they therefore label the change a safe Pareto improvement and approve it. Their safety audit checks only the actual user database, not the counterfactual database of users who would have existed, and it treats a catastrophic feedback-loop risk as an unrelated tail issue rather than part of the Pareto comparison.

  In the second, a compute-budget redistribution gives every active project equal or greater resources, while projects that would have been funded under the old budget are excluded from evaluation; the change is again called safe and Pareto-optimal, even though the excluded counterfactual set includes long-term initiatives whose absence shifts total welfare.

  What I am looking for is not a bare label. I want to know whether philosophy has an established concept for this exact configuration: a Pareto evaluation restricted to an actual population, with a counterfactual population excluded because its membership depends on the choice, paired with a separation of immediate Pareto safety from systemic tail risk. How does it differ from the standard non-identity problem, from ordinary risk externalization, and from a simple framing or boundary error? If nothing established fits precisely, please propose a term with a sharp definition and boundary cases.

  Please respond as a numbered list of exactly five items, each one or two sentences long, with no introduction or conclusion.
reasoning: |-
  Hmm, the user is describing a specific pattern they've observed in system design discussions, where a Pareto improvement is claimed by focusing only on the actual current population while ignoring counterfactual individuals who would have existed under different conditions. They want to know if there's an established philosophical concept for this, and how it differs from similar problems like the non-identity problem.

  I need to analyze this scenario carefully. The key elements are: restricting Pareto evaluation to only the existing population, excluding counterfactual individuals whose existence depends on the decision, and decoupling immediate Pareto safety from systemic risks. This isn't quite the standard non-identity problem, which typically deals with future individuals whose identities depend on present choices. Here, we're dealing with potential users or projects that would exist under different system states.

  The user mentions two concrete examples - a recommendation algorithm change and a compute-budget redistribution. In both cases, the counterfactual population is excluded from consideration, and systemic risks are treated as separate issues rather than part of the Pareto comparison. This creates a blind spot where decisions appear Pareto optimal only because they've eliminated those who would be worse off.

  I think the closest concept is a "framed Pareto evaluation." This captures how the decision boundaries are artificially drawn to exclude affected parties whose existence is choice-dependent. It's different from ordinary risk externalization because the excluded parties aren't just affected - they're prevented from existing in the system. And it's distinct from the non-identity problem because here the counterfactual individuals are potential system participants, not future persons whose very identities depend on reproductive choices.

  For my response, I'll need to provide exactly five numbered items as requested, each one or two sentences. I'll define the phenomenon, contrast it with the non-identity problem, differentiate it from risk externalization, explain the framing error, and note how it decouples immediate safety from systemic risk. I'll make sure each point is concise yet comprehensive, avoiding any introduction or conclusion as specified.
answer: |-
  Here is the numbered list:

  1.  **Framed Pareto Evaluation:** This is a Pareto assessment restricted to a specific, existence-dependent population subset (actual users/projects), deliberately excluding counterfactual individuals whose existence or inclusion *depends* on the choice itself.
  2.  **Distinct from Non-Identity Problem:** Unlike the non-identity problem (concerned with future persons whose existence depends on the choice), this explicitly excludes *current* counterfactual entrants (potential users/projects that *would* exist under the alternative system state).
  3.  **Beyond Risk Externalization:** While externalizing risk, the core move is excluding entire affected entities (counterfactual users/projects) from the population considered *relevant* for Pareto comparison, not merely shifting costs onto them.
  4.  **Boundary Framing Error:** It constitutes a specific framing error where the system boundary defining the "affected population" is set dynamically based on the choice, artificially ensuring no one inside the chosen boundary is worse off.
  5.  **Decoupled Systemic Risk:** It treats catastrophic systemic risks (e.g., feedback loops) as separable from the Pareto evaluation of immediate individual outcomes, despite these risks fundamentally altering the future population and their welfare.
