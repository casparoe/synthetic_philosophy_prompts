prompt: |-
  I run a grad seminar in moral psychology — about 10 people, one 80-minute session. I want an in-class activity that makes them feel the force of this: guilt vs. shame, which is the better moral emotion, and can a culture actually choose between them?

  Inject a niche constraint: the fictional community they’re repairing (call it the Meridian co-op) runs on rotating anonymous "moral auditors" — every harm gets logged without names for 30 days, then the record goes public. So repair protocols have to work with delayed, uncertain attribution.

  Design the game: split them into two groups that must build a repair protocol — one using only guilt-architecture (individual accounting, private redress, quantified debt) and one using only shame-architecture (public status adjustment, communal ritual, role change). Give them rules, roles, a timeline that fits 80 minutes, and small status-point stakes (no real money). They should construct the protocol before anyone says "guilt" or "shame" out loud. Include a staged collective harm they have to respond to.

  Then: debrief mapping what just happened onto the philosophical distinction, what will definately go wrong the first time I run it, and an honest note on which feature of the culture-choice problem this setup cannot reproduce.

  Bottom line up front in one sentence: the core mechanic that makes the tension visible.

  Keep it under 400 words. No citations, no reading lists — this is for a model that can't search the web.
reasoning: |-
  We are designing an in-class activity for a grad seminar on moral psychology, focusing on guilt vs. shame as moral emotions and whether a culture can choose between them. The setting is the Meridian co-op with rotating anonymous moral auditors: harms are logged anonymously for 30 days before becoming public. Repair protocols must handle delayed, uncertain attribution.

  Activity: "The Meridian Repair Protocol Challenge"

  Time: 80 minutes total.

  Groups:
  - Split into two groups (5 each, adjust as needed).
  - Group A: Guilt-Architecture (focus: individual accounting, private redress, quantified debt).
  - Group B: Shame-Architecture (focus: public status adjustment, communal ritual, role change).

  Rules:
  1. Do not say "guilt" or "shame" during protocol construction. Use descriptive terms only.
  2. Each group has 25 minutes to design a protocol for repairing harm in the co-op, given the auditor system (anonymous for 30 days, then public).
  3. Provide both groups with the same "collective harm scenario" (see below).
  4. Each group must assign roles: two "harm-doers" (who will later act out causing the harm) and one "auditor" (who will log the harm anonymously). The rest are co-op members who will experience the harm and then use the protocol to repair.
  5. After design, groups have 10 minutes to simulate the protocol in response to the harm scenario (using their assigned roles).
  6. Small stakes: Each group starts with 10 status points. The other group (and then the whole class) will vote on which protocol feels more restorative (0-5 points) and which is more sustainable in Meridian (0-5 points). Max 10 points added to the starting 10.

  Harm Scenario (read aloud to all):
  "During a co-op harvest festival, two members (the harm-doers) accidentally damage a rare, community-owned solar generator while moving it for the event. The damage will cost significant resources to fix and delays the festival's main ceremony. The harm is logged by the auditor (as per co-op rules) without names. For 30 days, the co-op knows a harm occurred but not by whom. Then the record becomes public."

  Timeline:
  - 0-5 min: Explain rules, split groups, assign roles (harm-doers, auditor, co-op members). Distribute written scenario.
  - 5-30 min: Groups design their protocols (25 min).
  - 30-40 min: Group A simulation (10 min).
  - 40-50 min: Group B simulation (10 min).
  - 50-70 min: Debrief (20 min).
  - 70-80 min: Voting and wrap-up (10 min).

  Debrief Questions:
  1. Without using "guilt" or "shame," what did your protocol emphasize? (Then map to concepts.)
  2. How did the delay and uncertainty of attribution affect your design?
  3. What will definitely go wrong? (E.g., groups might mix architectures, time pressure, simulation awkwardness.)
  4. What aspect of culture-choice can't this setup reproduce? (Honest note: The deep-seated, unconscious cultural norms that evolve over generations, not just a conscious choice.)

  Core Mechanic Making Tension Visible:
  The mandatory 30-day anonymity period forces groups to design around delayed attribution, making guilt's private reckoning vs. shame's public exposure immediately tangible in protocol logistics.
answer: |-
  ### Meridian Repair Protocol Challenge  
  **Core mechanic**: The 30-day anonymity delay forces immediate, tangible trade-offs between private reckoning (guilt) and public exposure (shame) when designing harm repair.  

  **Setup** (5 min):  
  - Split into **Group A (Guilt-Architecture)**: Mandated to use *individual accounting, private redress, quantified debt*.  
  - **Group B (Shame-Architecture)**: Mandated to use *public status adjustment, communal ritual, role change*.  
  - Assign roles per group: 2 harm-doers, 1 moral auditor, 7 co-op members.  
  - Rules: No saying "guilt" or "shame" during design. Groups start with 10 status points.  

  **Harm Scenario** (read aloud):  
  > *During the co-op’s grain harvest, two members (harm-doers) damage a shared irrigation system while rushing. Repairs cost 3 days of labor. The auditor logs the harm anonymously—no names for 30 days. The co-op knows "a harm occurred" but not by whom. After 30 days, the full log goes public.*  

  **Activity** (60 min):  
  1. **Design** (25 min): Groups build protocols for *both immediate (Day 1–29) and post-revelation (Day 30+) repair*.  
     - *Guilt-group*: Focus on private apologies, labor-debt quotas.  
     - *Shame-group*: Focus on public ceremonies, role demotions.  
  2. **Simulate** (20 min total, 10 min/group):  
     - *Day 1–29*: Harm-doers act anonymously; co-op uses protocol.  
     - *Day 30+*: Auditor reveals names; protocol completes.  
  3. **Voting** (10 min): Award 0–5 points for "restorativeness" and 0–5 for "sustainability." Max +10 status points.  

  **Debrief** (20 min):  
  1. Map designs to guilt/shame: How did "private accounting" vs. "public ritual" shape outcomes?  
  2. Attribution delay: Did uncertainty favor one architecture?  
  3. **What will go wrong**: Groups blur architectures; simulations feel rushed; voters bias toward theory over practice.  
  4. **Unreproducible culture flaw**: Real cultures can’t "choose" emotions—they emerge from deep norms, not 25-minute designs.  

  **Stakes & Flow**: Status points incentivize engagement; anonymity delay creates urgency.  
