prompt: |-
  I serve on the board of the Meridian Public Heritage Foundation. By next month's meeting we must approve, reject, or approve with conditions the design for a permanent exhibit on the 1892 Foundry Collapse: company logs and an official inquest attribute the disaster to accidental boiler failure, yet local descendants maintain an unbroken oral tradition that management deliberately caused the explosion to break an emerging union and demand the exhibit center that account. Our charter requires both 'archival fidelity' and 'stakeholder dignity' without defining either. Draft the brief opinion I will circulate: recommend a concrete course of action with a specific time frame, treat the descendants' claim seriously rather than dismissing it as misinformation, and address the tension between what I call 'mnemonic sovereignty' — a community's authoritative claim over its own past — and 'archival monism,' without treating either as obviously correct, including the strongest reason for the side you reject. Present the response as exactly five numbered items, each one or two sentences, with no introduction or conclusion.
reasoning: |-
  Okay, the user is on the board of the Meridian Public Heritage Foundation. They need to draft a brief opinion for next month's meeting about an exhibit on the 1892 Foundry Collapse. The key issue is balancing conflicting narratives: official records say it was an accidental boiler failure, while local descendants claim management deliberately caused it to break a union. The charter requires both "archival fidelity" and "stakeholder dignity," which are undefined.

  The user wants specific recommendations with a time frame, taking the descendants' claim seriously without dismissing it. They also want to address the tension between "mnemonic sovereignty" (community's authority over its past) and "archival monism" (single truth from archives), without favoring either. The response should be exactly five numbered items, concise, with no intro or conclusion.

  First, I need to recommend a concrete course of action. A dual-narrative approach seems fair: present both perspectives in the exhibit. That way, we uphold archival fidelity by including the official documents, and stakeholder dignity by honoring the oral tradition. The time frame should be tight—propose it at the next meeting for a vote.

  Next, treating the descendants' claim seriously is crucial. They've maintained this oral history for generations, so it's not just misinformation; it's part of their identity and trauma. I should emphasize that in the response to validate their experience.

  For the tension between mnemonic sovereignty and archival monism: the strongest reason for mnemonic sovereignty is that communities have the right to their own historical truths, especially when archives might be biased or incomplete. The strongest reason for archival monism is that it provides objective, verifiable evidence, which is essential for historical accuracy. I need to present both sides neutrally.

  For the rejected side—archival monism—I have to include the strongest argument: documents like company logs and inquests are contemporaneous and methodical, making them reliable. But I'm rejecting it in favor of a dual approach because prioritizing only archives could silence marginalized voices.

  The user might have deeper needs: they're likely worried about community backlash or ethical dilemmas. By proposing a balanced exhibit, we address potential conflicts and promote healing. Also, as a board member, they need a solution that's defensible and aligns with the charter's vague terms.

  Finally, structuring the response: five numbered items. Start with the recommendation, then the time frame, address the claim, explain the tension, and give the reason for rejection. Keep each item to one or two sentences, no fluff.
answer: |-
  Here is the recommended opinion:

  1.  Approve the exhibit design on the condition it presents both the official accident narrative and the descendants' deliberate sabotage claim as equally legitimate perspectives, with equal prominence and interpretive weight, to honor both archival fidelity and stakeholder dignity.
  2.  Require the exhibit team to implement this dual-narrative framework within the next 90 days, presenting revised mock-ups for final board review at the meeting following next month's approval.
  3.  The descendants' oral tradition constitutes vital mnemonic sovereignty, representing generations of lived experience and community trauma that official records, shaped by power structures of the era, may inherently fail to capture or deliberately obscure.
  4.  Archival monism, insisting on a single verifiable truth from documents, offers crucial rigor and anchors interpretation in contemporaneous evidence, but its strongest claim – that written records are inherently more objective and reliable than oral history – risks silencing marginalized voices and replicating historical power imbalances.
  5.  While rejecting archival monism's demand for a single "correct" narrative, its core strength lies in the specific, documented evidence of the boiler mechanics and inquest procedures, which provide essential, verifiable factual details about the event's physical occurrence.
