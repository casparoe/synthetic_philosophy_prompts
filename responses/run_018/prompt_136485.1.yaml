prompt: |-
  hey so me and my friend just had this long arguement about moral particularism vs generalism and she thinks particularists are just making excuses. can you build me a workplace thought experiment—one paragraph, no trolleys—where both sides agree you should break a promise to stop some minor harm, but they totally disagree on whether the wrong-making feature of promise-breaking is even activated? the particularist can't just say rules don't apply; it needs to hinge on whether that feature gets holistically disabled by an institutional betrayal context. then show me what each theory actually says, identify the feature doing the work, and tell me if removing the betrayal part makes the case collapse into standard generalism. i feel like there's a hidden dependancy but i can't pin it down.
reasoning: |-
  Okay, the user is in the middle of a debate with a friend about moral particularism versus generalism. They want a workplace scenario that highlights the core disagreement without using trolley problems. The key is to create a situation where both sides agree that breaking a promise is the right choice to prevent minor harm, but they fundamentally disagree on why that promise-breaking isn't morally wrong in this case. 

  Hmm, the user specifically wants the particularist argument to hinge on an "institutional betrayal context" disabling the wrong-making feature of promise-breaking, not just claiming rules don't apply. And then they want to test if removing that betrayal element collapses the case into standard generalism. Smart framing—they're probing whether particularism's holism is doing unique work.

  First, I need to construct that betrayal context carefully. Let's imagine a company policy that's supposed to protect employees but actually puts them at risk. The protagonist promises confidentiality to a colleague about something benign (say, a hobby), but then learns the company is weaponizing that exact confidentiality policy to hide harassment. Breaking the promise exposes the harmful policy. 

  The minor harm being prevented would be the colleague's embarrassment about the hobby, versus the systemic harm of the policy continuing. Both sides agree breaking the promise is justified here. But the disagreement runs deeper: 

  For generalists, the wrong-making feature of promise-breaking (let's call it "undermining reliance") is fully activated—they just override it with the greater good of exposing betrayal. It's still a wrong, just outweighed. 

  Particularists would argue the betrayal context *disables* the wrong-making feature entirely. Because the promise was made under a rotten institutional framework, the moral force of "undermining reliance" never kicks in. The colleague's reliance wasn't legitimate given the toxic context. 

  Ah, and the dependency test: if you remove the institutional betrayal (say, the policy is neutral), then breaking the promise over minor harm looks unjustified to both sides. But the particularist's disabling mechanism vanishes—now it's just generalism's override. That reveals the holism is crucial. 

  User's onto something with that "hidden dependency" hint. The particularist move only works if the context fundamentally alters the moral landscape, not just adds competing values. Needs to show how the feature itself is context-sensitive. 

  ...Better make the hobby slightly embarrassing but harmless (manga fan in a conservative office?) so the minor harm is clear. And the betrayal has to be directly tied to the confidentiality promise—same policy abused for harm. Tight causal link. 

  Final check: Does this force the particularist to engage with feature-disabling, not just rule-skepticism? Yes, because they must argue why reliance isn't undermined *in this specific betrayal context*. Generalist still sees undermined reliance but overrides it. 

  Nail that dependency: no betrayal = no disabling = particularism adds nothing. Exactly what user wanted to isolate.
answer: |-
  Here's the thought experiment:

  > You work at a company where employees often confide in trusted colleagues about non-work matters under an informal "vault" policy promoted by HR as fostering psychological safety. You promise your friend Maya you won't mention her secret passion for competitive knitting. Later, you overhear HR executives explicitly discussing how they *use* this "vault" culture to identify "harmless secrets" they can subtly leverage during stressful periods to distract employees from systemic issues like unpaid overtime. Knowing Maya's knitting secret is about to be weaponized this way in an upcoming crunch period, you warn her preemptively—breaking your promise. This stops the minor harm (her embarrassment/manipulation). Both sides agree breaking the promise was right, but disagree *violently* on whether the core wrong-making feature of promise-breaking was even *present*.

  **Breaking it Down:**

  1.  **The Shared Agreement:** Breaking the promise prevents minor harm (embarrassment/manipulation). Both sides agree this action is correct.
  2.  **The Core Disagreement:** Is the fundamental *wrong-making feature* of promise-breaking activated here?
      *   **The Wrong-Making Feature:** "**Undermining Legitimate Reliance**" (The core moral reason breaking a promise is *prima facie* wrong: you invited someone to rely on you and then betrayed that trust, weakening social bonds).

  3.  **Generalist Perspective:**
      *   **View:** The wrong-making feature ("Undermining Legitimate Reliance") **IS fully activated**. Maya relied on your promise in good faith. You betrayed that trust.
      *   **Resolution:** This *prima facie* wrong is **outweighed** by the greater moral imperative to prevent the harm caused by HR's manipulative betrayal. The *rule* against promise-breaking holds, but this is an exception justified by competing principles (preventing harm/exploitation). It's an **override**.
      *   **What's Doing the Work:** The *harm prevention* principle overriding the *promise-keeping* principle. The institutional betrayal provides the *stronger reason* to act, but doesn't negate the initial wrong.

  4.  **Particularist Perspective:**
      *   **View:** The wrong-making feature ("Undermining Legitimate Reliance") **IS NOT activated or is radically diminished** due to the holistic context.
      *   **Reasoning:** The promise was made within an institution fundamentally betraying its own stated values. Maya's reliance, while sincere, was based on a *fraudulent institutional framework*. The promise wasn't a genuine pact of trust, but an unwitting tool of potential manipulation. Warning Maya doesn't *betray* her reliance; it *protects* her from the *institution's* betrayal. The context **holistically disables** the core wrong-making feature of promise-breaking in this instance. The promise lacked its usual moral force from the outset.
      *   **What's Doing the Work:** The *institutional betrayal context* fundamentally altering the moral valence of the promise itself. It renders Maya's reliance non-legitimate *in this specific context*, disabling the core feature that *makes* promise-breaking wrong. It's not an override; it's a **disablement**.

  5.  **The Dependency Test: Removing the Institutional Betrayal**
      *   **Scenario Change:** Imagine HR runs a *genuinely* supportive program. The "vault" policy is benign and respected. You still promise Maya secrecy about her knitting. Later, you learn a different colleague might mildly tease her about it (minor harm). You break the promise to warn her.
      *   **Outcome:** Both sides would likely **disagree** with breaking the promise in this new scenario. The harm is too minor to justify it.
      *   **Generalist:** The wrong-making feature ("Undermining Legitimate Reliance") IS activated and isn't outweighed by preventing minor teasing. Breaking the promise *is* wrong here.
      *   **Particularist:** The wrong-making feature ("Undermining Legitimate Reliance") IS activated. The benign context means Maya's reliance *is* legitimate. The promise retains its full moral force. Breaking it *would* be wrong to prevent such minor harm.
      *   **The Collapse:** Without the institutional betrayal, **the case collapses into standard generalism for both sides**. They both agree the promise-breaking *is* wrong in the absence of that specific, disabling context. The particularist loses their unique "disablement" argument and must fall back on the generalist's weaker "override" justification, which fails against minor harm. This demonstrates the **hidden dependency**: The particularist's argument that the wrong-making feature is *disabled* utterly depends on the specific, holistic context of institutional betrayal. Remove it, and the feature activates normally, forcing agreement with the generalist baseline.

  **Your Pinpoint:** You nailed it. The hidden dependency *is* the institutional betrayal context. It's not *just* another reason *against* keeping the promise (which generalism sees as an override); for particularism, it fundamentally *reconfigures* the promise itself, disabling its core wrong-making feature. Remove that context, and the disabling effect vanishes, collapsing the justification back into the generalist framework where the feature is active but potentially overridable (which fails against minor harm). The betrayal isn't just a factor; it's the key that unlocks the particularist's unique disablement argument.
