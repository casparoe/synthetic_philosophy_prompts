  ### Treaty of Adversarial Collaboration  
  **Between the Weberian and Structuralist Camps**  

  #### SECTION 1: AGREED CLAIMS  
  1. Protestant theological shifts and early capitalist institutions co-emerged in 16th-17th century Northwestern Europe.  
  2. *All* causal claims must specify mechanisms; mere correlation is insufficient.  
  3. Naive monocausal explanations (e.g., *"only theology"* or *"only material conditions"*) fail empirically.  
  4. Cultural schemas and material conditions exhibit non-random historical coupling.  
  5. Hermeneutic interpretation is unavoidable when analyzing value-laden actions.  

  ---

  #### SECTION 2: DISAGREEMENTS TABLE  
  | Crux | Weberian Formulation | Structuralist Formulation | Shared Predictive Case | Weberian Prediction | Structuralist Prediction |  
  |------|----------------------|---------------------------|------------------------|---------------------|--------------------------|  
  | **1. Causal exclusion of macro-level values** | "Value-rational action (e.g., ascetic Protestantism) exerts downward causal power irreducible to material factors." | "Macro-cultural 'causes' are excluded by underlying material determinants; values are causal placeholders." | *Rise of Dutch financial markets (1600-1650)* | Protestant thrift norms accelerated capital liquidity *independently* of trade volume. | Capital liquidity arose solely from Atlantic trade surpluses; theology rationalized preexisting profit motives. |  
  | **2. Ontology of elective affinity** | "Elective affinity denotes bidirectional causation: values reshape material incentives (e.g., monastic accounting → double-entry bookkeeping)." | "Elective affinity is hermeneutic patterning, not causation; material conditions select compatible cultural traits." | *Calvinist merchants adopting joint-stock models* | Theological certainty enabled high-risk investments by creating trust networks. | Investor behavior was determined by grain price volatility; theology merely justified risk-taking. |  
  | **3. Values as mechanism vs. epiphenomenon** | "Culture operates as a *switchman* (Weber): similar conditions yield divergent outcomes under different value systems." | "Values are fog obscuring tracks; the locomotive (material forces) determines destination regardless." | *Hypothetical: 18th-century rice-farming society with Protestant ethics* | Would develop proto-capitalist land markets and wage labor. | Would maintain feudal patronage systems unless material productivity forces enclosures. |  

