  - Untranslatable: Smith's core idea that moral sentiments are feelings, not just state comparisons. This suggests Git's framework can't capture phenomenology.

  I'll argue this reveals an engineering limitation - DVCS handles states well but not qualitative experience. The British English requirement means using "colour" not "color", "metaphorise" not "metaphorize", etc. 

