prompt: |-
  I am a software engineer with no formal training in philosophy, though I am thoroughly familiar with distributed version control: branching, three-way merges, conflict resolution, blame annotations, upstream remotes that no local clone fully observes, and the idea that a repository's authoritative state is only ever approximated through pull requests and diff reviews.

  Restate Adam Smith's account of sympathy—our imaginative projection into another's situation—and of the impartial spectator—the internalised, generalised viewpoint by which we judge our own conduct—using precisely that vocabulary. Treat sympathy as an attempt to check out and execute another branch's mental state within one's own local environment, and treat the impartial spectator as a theoretical upstream master against which merged judgments are evaluated but which no individual node can access directly. Specify what corresponds to a clean merge, what forces a manual conflict resolution, and whether the spectator operates more like an unreachable remote origin or like a CI pipeline running checks outside local control.

  Then give a residue report: state which parts of Smith's view translate cleanly, which require stretching terms such as 'blame' or 'upstream' beyond their technical meanings, and which, if any, have no counterpart whatsoever in distributed version control. Take a committed position on whether the untranslatable residue reveals a genuine limitation in the engineering framework—say, an inability to represent moral sentiment as anything other than state comparison—or whether it shows Smith's account to depend on metaphors that collapse under literal translation. Write in British English, and do not include bibliographies, reading lists, or citations.
