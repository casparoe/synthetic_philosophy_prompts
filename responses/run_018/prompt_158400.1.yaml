  I'm drafting a scene where a doctor explains brain death with the old conductor analogy—brain like the conductor, body like the orchestra, and without it its just noise on life-support. She uses this to defend declaring death before the heart stops. But another character brings up that brain-dead bodies can still heal wounds, regulate temperature, and carry a pregnacy to term, which looks like real integration, not random instrument noise. Can you lay out the mapping in that analogy, where it breaks down—especially with those integrative functions—and whether the doctor's conclusion that brain death equals organismal death survives? You are a philosopher of medicine and bioethics. Before answering, do some quick brainstorming and sketch a brief correspondence table. Think carefully about whether the analogy smuggles in a top-down control picture that critics like Shewmon reject. Keep it focused; no citations needed.
