prompt: |-
  So I'm a PhD student working on early modern philosophy of mathematics, and my dissertation chapter is on Hobbes's claim that geometry is the one genuinely demonstrable science, and that it's demonstrable precisely because we make its objects ourselves. Roughly his line (in De Corpore and scattered through Leviathan) is that the geometer can know his conclusions with certainty because the definitions of geometrical figures are really recipes for generating them -- a circle, say, is what you get when a line moves around one of its own fixed endpoints -- so unlike in natural philosophy, where we only ever guess at the causes of things we didn't make, in geometry we are the cause, and knowledge of causes is supposed to be the whole of science.

  Here's what I need. Construct a thought experiment that puts real pressure on this "we know what we generate" criterion, in the harder of the two directions: a case where someone has genuinely constructed or generated the geometrical object in question, so Hobbes's criterion says they have demonstrative knowledge, but where any reasonable judge says they don't actually know the relevant geometrical fact. Not the easier direction (knowing a theorem you didn't construct -- Hobbes has resources there, like learning the generation from someone else).

  Constraints:

  - One scenario, one paragraph max, and it has to be set in an ordinary 17th-century-plausible practice -- a surveyor, a shipwright, a navigator, a draftsman -- no computers, no demons, no skeptical hypnosis.
  - The failure of knowledge can't come from the person just having made a mistake in their construction. They construct the figure exactly as intended, every step correct. The problem has to be structural -- something about what generating an object does and doesn't put you in a position to know.
  - The case has to be for testing whether Hobbes's criterion is sufficient for knowledge, not just necessary, so don't smuggle in some extra defect that any epistemologist would flag (like the guy not believing the conclusion).

  After the scenario: state exactly what Hobbes's criterion predicts and why, state the intuitive verdict and why, and identify which feature of the case is doing the work -- i.e., is the gap between construction and knowledge a gap between making something and knowing its causes, or between knowing causes and knowing consequences, or what? Then tell me what happens to the case if that feature is removed, and how someone defending Hobbes would try to show the case doesn't count (e.g. by insisting the construction wasn't really the generation of that figure after all). Bonus if you can say whether the same trick threatens his parallel claim that we know civil philosophy because, so to speak, we make the commonwealth ourselves.
reasoning: |-
  Okay, I need to help this PhD student with their dissertation on Hobbes's philosophy of mathematics. They want a thought experiment that challenges Hobbes's claim that we have demonstrative knowledge in geometry because we construct the objects ourselves. The scenario must be set in a 17th-century context, involve a practitioner like a surveyor or shipwright, and show that even with perfect construction, knowledge might not follow. 

  First, I recall Hobbes's argument: since we define geometric figures by how we generate them (e.g., a circle by rotating a line around a fixed point), we know their causes and thus have certain knowledge. The challenge is to find a case where someone constructs something correctly but still lacks knowledge of a geometric fact. 

  I brainstorm scenarios. One idea: a shipwright builds a perfectly circular ship's wheel using a compass. He constructs it flawlessly but doesn't realize that all points are equidistant from the center. Hobbes would say he knows because he generated it, but intuitively, he might not grasp the theorem. However, this might be too close to just lacking belief, which the student wants to avoid. 

  Another idea: a surveyor plots a large triangle using ropes and stakes, following exact Pythagorean ratios (3-4-5). He constructs it correctly but doesn't know that the angle is right because he's focused on the sides. Hobbes predicts knowledge since he generated it, but the surveyor misses the angular property. The gap is between constructing the figure and recognizing all its properties, even if they follow from the construction. 

  This fits: the construction is correct, the knowledge failure isn't from error, and it's structural—constructing a figure doesn't automatically impart understanding of all derived properties. The feature is the distinction between generating an object and inferring its consequences. 

  For the Hobbesian defense: one could argue that the surveyor does have implicit knowledge but hasn't reflected on it. Or, that the construction method (e.g., using Pythagorean triples) inherently defines the right angle, so if he understands the method, he should know. Removing the feature—if the surveyor explicitly considers the angle during construction—might restore knowledge, but the point is that construction alone doesn't guarantee such reflection. 

  On the civil philosophy parallel: if people create a commonwealth but don't understand its principles (e.g., why sovereignty is absolute), Hobbes might say they still "know" it because they made it, but intuitively, they might not grasp its workings. The same issue arises—generation doesn't ensure comprehension of implications.
answer: |-
  Here's a thought experiment designed to pressure Hobbes's sufficiency claim:

  **Scenario:** A meticulous shipwright, tasked with verifying the seaworthiness of a design, constructs a perfectly scaled wooden model of a ship's hull cross-section. Using compass and straightedge on a large oak plank, he faithfully executes a complex, multi-step generation sequence dictated by the designer (e.g., starting with a semicircle, adding tangent lines at specific points, connecting endpoints with a parabolic arc defined by rolling a circle). He completes the figure flawlessly, resulting in a specific asymmetrical curve. Asked about the area enclosed by this curve relative to the initial semicircle, he shrugs; he executed the steps perfectly but lacks the mathematical skill to calculate or deduce the area relationship, knowing only that he followed the generation procedure correctly.

  *   **Hobbes's Prediction:** Hobbes would claim the shipwright possesses genuine, demonstrative geometrical knowledge concerning the figure. He generated the entire figure himself through a series of defined motions (compass sweeps, straightedge placements), making him the efficient cause of its specific properties. Knowledge of the causes (the generative steps) *is* scientific knowledge of the figure itself and its necessary properties, including comparative areas.
  *   **Intuitive Verdict:** The shipwright does *not* know the comparative area. He generated the object correctly but lacks insight into this specific, non-obvious property derivable from it. Generation granted operational competence, not necessarily comprehension of all deductive consequences inherent in the constructed form.
  *   **The Gap:** The failure lies in the gap between **knowing the efficient cause (the generating motions)** and **knowing all necessary properties/consequences** of the generated object. Hobbes conflates knowing *how* something is made with knowing *what* necessarily follows from its definition/construction. The shipwright knows the "how" but not the deductive "what" concerning area.
  *   **Removing the Feature:** If the comparative area property was *explicitly encoded* in a single, obvious step of the generation (e.g., "draw arc A such that area(A) = 1.5 * area(semicircle)"), the gap closes. The property becomes part of the known cause itself. The problem arises precisely when complex generation implies non-obvious consequences.
  *   **Hobbesian Defense:** A defender might argue the shipwright *does* implicitly know the area relation *because* it is necessitated by the generation he performed; his ignorance stems only from a failure of reasoning/reflection, not a failure of the generative criterion itself. They might insist that *true* geometrical knowledge of the figure *requires* the agent to grasp *all* necessary properties logically derivable from the generation, even if they haven't performed the derivation yet. If the shipwright cannot deduce the area from the generation steps, he doesn't fully possess the science *of that specific figure*, even if he constructed it.
  *   **Threat to Civil Philosophy:** This trick *does* threaten Hobbes's parallel claim about civil philosophy. Citizens might "generate" the commonwealth via covenant, but this act alone does not guarantee they understand its necessary consequences (e.g., why sovereignty must be absolute, indivisible, or why certain laws lead to peace). They know *that* they made it and *how* they covenanted, but like the shipwright, they might lack insight into the complex, non-obvious deductive implications (political theorems) flowing from that generation, leaving them vulnerable to seditious doctrines or failing to grasp the necessity of obedience in specific cases. Generation grants authority/legitimacy for Hobbes, but not necessarily comprehension.
