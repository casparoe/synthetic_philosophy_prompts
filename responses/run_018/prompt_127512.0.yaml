answer: |-
  ### Joint Statement: Adversarial Collaboration on Etiological vs. Causal-Role Accounts of Biological Function  

  #### 1. Agreed Claims  
  Both proponents of the etiological account and the causal-role account accept the following claims regarding the synthetic microbiome case and broader theoretical principles:  
  1.1. **Case Description**: The synthetic gene was engineered to produce vitamin B12 (function X) in a host’s gut microbiome. An accidental mutation endowed it with the novel capacity to break down a previously unencountered toxin (function Y), which becomes essential for the host’s survival. This capacity for Y has no evolutionary history (natural selection did not shape it).  
  1.2. **Malfunction as a Core Concern**: Both accounts seek to explain why biological traits can malfunction (i.e., fail to perform their function).  
  1.3. **Reality of Phenomena**: Evolutionary history (e.g., past selection pressures) and current causal contributions (e.g., a trait’s role in sustaining a system) are empirically observable phenomena. Neither account denies the existence of these factors.  
  1.4. **Analytical Goal**: Both theories aim to provide a coherent account of "function" in biology, particularly regarding how traits contribute to fitness or system stability.  
  1.5. **Validity of Test Case**: The synthetic gene scenario is a legitimate test case for comparing the two accounts, as it isolates the role of history versus current causation.  

  ---

  #### 2. Disagreements  
  The table below summarizes the core disagreements. Each description is phrased such that proponents of the respective accounts would endorse it as accurate:  

  | Issue | Etiological Account | Causal-Role Account |  
  |-------|---------------------|---------------------|  
  | **Function Attribution** | A trait’s function is defined solely by the effect for which it was naturally selected. Function Y is not a true function; it is a fortuitous side effect (e.g., a spandrel), as it lacks a history of selection. | A trait’s function is defined by its current causal contribution to a system’s capacity (e.g., survival or reproduction). Function Y is a genuine function because it is presently necessary for host viability. |  
  | **Malfunction Criteria** | Malfunction requires failure to perform the historically selected effect. The synthetic trait cannot malfunction relative to Y, as Y was never selected. It can only malfunction relative to X (if engineered/selected for X). | Malfunction occurs when a trait fails to perform its typical causal contribution to a system’s current state. The synthetic trait can malfunction relative to Y if it ceases to break down the toxin, regardless of historical origins. |  
  | **Basis of Normativity** | The normativity of function (i.e., what a trait *should* do) derives from evolutionary history. Y carries no normative weight. | The normativity of function derives from current systemic demands. Y is normative because its failure would disrupt host survival. |  

  ---

  #### 3. Cruxes  
  The following unresolved issues are central to the debate. For each crux, a shared test case is provided, along with both accounts’ predictions.  

  **Crux (a): Is evolutionary history constitutive of function, or merely evidential?**  
  - *Test Case*: The synthetic gene scenario (no history for Y).  
    - **Etiological Prediction**: History is constitutive. Y cannot be a function, as functions require selection history. Calling Y a "function" conflates causation with teleology.  
    - **Causal-Role Prediction**: History is evidential (a means to infer function). Y is a function because history is not metaphysically necessary; current causal role suffices.  

  **Crux (b): Can "malfunction" apply to non-selected traits?**  
  - *Test Case*: The synthetic gene loses capacity Y (toxin breakdown) but retains X (B12 production). Host dies of toxin exposure.  
    - **Etiological Prediction**: No malfunction relative to Y. Failure of non-selected effects is merely dysfunctionality, not malfunction.  
    - **Causal-Role Prediction**: Malfunction occurs. The trait’s failure to sustain the host via Y constitutes malfunction, as current contribution defines function.  

  **Crux (c): Does synthetic origin alter the metaphysics of function, or only its epistemology?**  
  - *Test Case 1*: The synthetic gene scenario.  
  - *Test Case 2*: Discovery of an identical toxin-breaking gene in wild populations, with clear selection history for Y (e.g., in environments where the toxin is endemic).  
    - **Etiological Prediction**:  
      - Synthetic (Test Case 1): Y is metaphysically non-functional (history is lacking).  
      - Natural (Test Case 2): Y is functional (history exists).  
      → Origin changes the metaphysics: Function is inherently historical.  
    - **Causal-Role Prediction**:  
      - Both Cases: Y is functional in both scenarios.  
      → Origin changes only epistemology (how we *discover* function), not metaphysics. Function is ahistorical.  

  ---  
  **Signed:**  
  [Etiological Account Proponent]  
  [Causal-Role Account Proponent]  
  [Date]
