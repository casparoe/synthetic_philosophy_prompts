answer: |-
  Here's a self-contained thought experiment tailored to your specs:

  **The Case:** On a rainy Tuesday afternoon in London, Ana (a Spanish tourist who researched British customs) and Ben (a lifelong Londoner) arrive separately at a crowded bus stop with a clearly formed queue. Both intend to visit the British Museum, which closes in 40 minutes (a non-urgent reason, as entry is possible until 30 minutes before close, and they can visit another day). Ana, seeing the long queue, deliberately walks to the front and boards the next bus immediately, bypassing at least 15 waiting people. Moments later, Ben arrives, assesses the now-grumbling queue, and does the exact same thing – stepping ahead of the remaining 14 people to board the same bus. Both know queueing is the norm, both act solely to save time for their museum visit, and both cause identical minor delays and frustration (audible tutting, muttered complaints) to those they bypassed.

  **Isolating the Wrongness:**
  *   **Harm:** The harm (minor delay, frustration) is identical whether caused by Ana or Ben.
  *   **Convention-Breaking:** Both knowingly violate the explicit queueing norm.
  *   **Key Variable:** Only the agent's status as "tourist" or "local" differs.

  **Theorist Verdicts:**
  1.  **Convention-is-Moral (CIM) Theorist:** Believes adhering to deeply held local social conventions *is* the moral duty, fostering trust and social cohesion. *Verdict:* **Both Ana and Ben are equally morally wrong.** The wrongness stems directly from the intentional violation of the known convention itself, regardless of who commits it. Ben might be judged *more* harshly for betraying a system he's deeply embedded in, but the core wrong is convention-breaking.
  2.  **Pure-Social-Rule (PSR) Theorist:** Sees conventions like queueing as arbitrary "social homework" – morally neutral rules for smooth functioning. Wrongness *only* arises from measurable harm. *Verdict:* **Both Ana and Ben commit an identical, minor moral wrong** based solely on the identical harm caused (frustration, delay). Their status as tourist/local is irrelevant. The convention-breaking itself carries no inherent moral weight.

  **The Check:**
  *   **Action:** Knowingly jumping a queue for a non-urgent personal convenience.
  *   **Knowing the Norm:** Explicit research (Ana) and lifelong enculturation (Ben).
  *   **Nearby Worlds:**
      *   *Neither Knows:* If both were genuinely ignorant of the queueing norm (e.g., from a non-queueing culture), both CIM and PSR theorists would likely see *no moral wrong*. CIM: No duty to follow an unknown convention. PSR: Ignorance might negate intent, but harm remains.
      *   *Neither Cares:* If both knew but were utterly indifferent to the norm *and* the harm (psychopathy?), CIM would still see convention-breaking as wrong. PSR would focus solely on the harm caused, which is still present.
  *   **Feature Doing the Work:** **Intentional knowledge and deliberate violation of the known norm** is the crucial feature. This is what triggers the CIM theorist's judgment and allows the PSR theorist to isolate harm as the *only* relevant factor. Without this knowledge/intent, the act becomes merely clumsy (if ignorant) or pathological (if indifferent), changing the moral analysis significantly for CIM and complicating intent for PSR.
  *   **Normative Spillover:** The CIM theorist might argue Ben's transgression causes greater **normative spillover** – his action, as a local, directly weakens the local community's internalized commitment to queueing ("If *he* does it, why shouldn't I?"), potentially eroding the convention faster than a tourist's one-off act. Ana's spillover might be more about general resentment towards "rude tourists." The PSR theorist dismisses spillover as speculative harm, not direct.

  **Why it Works for Discussion:** This scenario cleanly isolates convention-breaking from harm by making the harm identical and the reason/motive identical. The differing verdicts on the *tourist vs. local* hinge entirely on whether the convention itself holds moral weight (CIM) or is merely a vehicle for harm (PSR). The inclusion of normative spillover adds a realistic layer of social consequence beyond immediate frustration, favoring the CIM perspective, while the PSR perspective demands concrete, demonstrable harm.
