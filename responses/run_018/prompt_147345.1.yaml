prompt: |-
  hey i'm taking this social ethics course and we got stuck on whether tipping or queueing is actually morally wrong or just social homework. my friend thinks visitors have to follow every local rule but that sounds off—like if japan doesn't tip, should i still leave cash? anyway i need a thought experiment built to specs for my paper, and please don't hand me a bibliography or reading list, i just need the case itself.

  build me a realistic, one-paragraph scenario (no sci-fi, no demons, no lotteries) where a tourist in britain knows the queueing norm at a bus stop but deliberately jumps ahead for a totally non-urgent reason—just because there late for a museum—while a local does there exact same thing for the exact same reason. the case should isolate whether the wrongness comes from breaking the convention itself or from harming others, and it needs to show why a 'convention-is-moral' theorist and a 'pure-social-rule' theorist give different verdicts for the tourist versus the local. then do the check: state the action, the method of knowing the norm, the nearby worlds where they don't know or don't care, and why each theory lands where it does. also be honest about which feature does the work—probably the intentional knowledge bit?—and what happens if you strip it away. please inject some niche framing like 'normative spillover,' where breaking one convention weakens others, even if that's not standard in the textbooks. keep it grounded and suitable for class discussion.
