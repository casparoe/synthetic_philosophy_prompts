prompt: |-
  hey, so i'm a retired physicist (condensed matter, 30 years) and lately i've been reading philosphy of maths for fun. i want to check if my views hang together before i embarass myself at teh local meetup. here's teh package:

  (1) i'm a platonist about arithmetic and analysis — numbers exist mind-independant, like physical constants but not in spacetime.

  (2) i'm a nominalist about uncountable sets and collections in general — talk about them is just bookkeeping fiction, like treating center of mass as a point.

  (3) i think mathematical knowledge is mostly empirical: we learn counting by tracking objects, and we accept calculus because it predicts measurements.

  (4) i think if intelligent life never evolved there'd still be prime numbers, but there'd be no 'facts' about them without a conceptual scheme to frame them.

  (5) geometry is conventional — euclid and lobachevsky are just different languages describing the same measurements.

  (6) if aliens with totally different logic existed they'd still discover primes, but probably wouldn't invent calculus, since continuity is tied to our physical intuition.

  please rank the real tensions by severity, say what'd have to give in each case, and point out which ones only sound weird but actually fit. and if my framing rests on a confused premise — like if the distinction in (2) collapses once you accept (1) — just say so plainly, don't try to soften it. i can take pushback.
