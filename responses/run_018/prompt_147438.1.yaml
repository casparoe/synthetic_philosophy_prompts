prompt: |-
  i run the booking for our towns monthly debate nights, and every month i gotta sign a contract with a nonrefundable deposit based on what size hall i rent. i keep falling for the inside story - like "this speaker is local so everyone will come" or "this zoning post went viral on facebook so 200 people will show" - and then ignoring the outside numbers that say usually 40 people max show up. i heard about inside view vs outside view and also epistemic modesty, but i need an actual reusable procedure i can run in about 15 minutes before i sign, not philosophy.

  please write me a decision flowchart in words with steps in order: what question i ask first, what counts as a good enough answer, where the procedure stops with a hard "rent the small hall" and where it stops being facts and becomes my values about risk. it needs to cover picking the right reference class (all debates? just zoning ones? just ones after viral posts?), how to weight my specific reasons against the base rate, and a modesty check because im usually overconfident right after my morning coffee. flag the exact spots where the procedure misfires if im lying to myself, and mark where my partner has to sign off since they co-sign the contract.

  apply it to three bookings:
  1. a zoning debate where my gut says 200 people because of one viral facebook post, but the outside view for zoning debates says 45
  2. a case where my inside reasoning is genuinely strong and the base rate is weak, but the procedure still forces me to be cautious and that annoys me
  3. a case where inside and outside agree on big turnout, but i still feel weird signing for the big hall

  also tell me clearly what this procedure cant fix - like if im just bad at judging my own tiredness - and dont give me bibliographies or tell me to read some author, i dont have books at the signing table and im not gonna memorize names. make sure it works for someone with zero stats background.
reasoning: |-
  We are creating a decision flowchart for hall booking that incorporates outside view (base rates) and inside view (specific reasons), with epistemic modesty and a partner sign-off.

  Procedure Steps:

  1. **Start**: Define the event (e.g., zoning debate with viral post).
  2. **Step 1: Identify Reference Class**
     - Question: "What is the most specific group of past events that are similar to this one in terms of factors that affect attendance?"
     - Examples: 
          - If the event is a zoning debate, then start with "all past zoning debates".
          - If there's a viral post, then try to find past events that had a viral post (even if just one or two).
     - If there are no events with the viral post factor, then use the next broader class (e.g., zoning debates without viral factor) and note that we are missing data on viral.
     - Good enough: When you have at least 5 events in the reference class OR you have to go to the broadest class (all debates) to get 5 events. If you have less than 5, then the base rate is weak and we'll treat it as such later.
     - Modesty Check: After picking the reference class, ask: "If I were predicting for a friend's event in this class, would I use the same class? Why/why not?" (This is to avoid cherry-picking.)

  3. **Step 2: Compute Base Rate**
     - Question: "What is the average attendance for events in this reference class? What is the maximum and minimum? How many events had more than [threshold for big hall]?"
     - Example: If the reference class is "zoning debates", and we have 10 events: average 45, max 70, min 20, and only 1 event had more than 100 (the big hall threshold) then the base rate suggests 45 and rarely exceeds 100.
     - Good enough: You have the numbers. If you don't have exact data, use your best estimate (but note that and flag for modesty).

  4. **Step 3: List Inside View Factors**
     - Question: "What are the specific reasons (at least 3) that this event will differ from the base rate? For each, assign a strength (weak/medium/strong) and direction (increase/decrease attendance)."
     - Examples: 
          - "Viral Facebook post: strong increase" 
          - "Speaker is local: medium increase"
          - "Rain forecast: medium decrease"
     - Modesty Check: For each factor, ask: "Have I been wrong about this kind of factor before? How often?" and "Would an independent observer (like my partner) agree with my assessment?"

  5. **Step 4: Adjust Base Rate with Inside Factors**
     - Question: "Given the base rate and the inside factors, what is my adjusted prediction?"
     - How to adjust:
          - Start with the base rate (say 45).
          - For each inside factor, adjust by:
              - Weak: ±10%
              - Medium: ±20%
              - Strong: ±40%
          - But cap the total adjustment at ±100% of the base rate (to avoid extreme swings).
          - Example: Base rate 45, two factors: 
              - Viral (strong +40%) → 45 * 1.4 = 63
              - Rain (medium -20%) → 63 * 0.8 = 50.4 → round to 50.
          - If the adjusted number is above the big hall threshold (say 100) then consider the big hall, else small.
     - However, if the base rate is from a weak reference class (less than 5 events) then the adjustment can go beyond ±100%? But we have a cap for modesty. Actually, we'll keep the cap regardless.

  6. **Step 5: Epistemic Modesty Check**
     - Question: "What's the chance I'm overconfident? Let me apply two tests:"
          - Test 1: "If I were betting $100 of my own money on the attendance being at least [adjusted number], would I still take the bet?" If no, then reduce the adjusted number by 20%.
          - Test 2: "What would my partner say the attendance will be? If they disagree, split the difference (average)."
     - After this, we get a final adjusted number.

  7. **Step 6: Compare to Hall Thresholds**
     - We have two halls: 
          - Small hall: fits up to 60 (with fire code), deposit $200.
          - Big hall: fits 150, deposit $500.
     - Decision rule:
          - If final adjusted number <= 60 → rent small hall.
          - If final adjusted number > 60 and <= 100 → rent small hall (because big hall is too big and deposit is nonrefundable, so we avoid the risk unless we are very sure).
          - If final adjusted number > 100 → rent big hall.
     - But note: This rule is conservative to avoid the big hall unless we are very sure.

  8. **Step 7: Values and Risk Tolerance**
     - This step is where your values come in. If the adjusted number is between 60 and 100, you have to decide if the risk of overcrowding (and turning people away) is worth the extra deposit. 
          - Question: "How bad is it if we have to turn people away? How bad is it if we lose the extra deposit?"
          - Rule: If the adjusted number is above 80, and you have at least one strong factor for increase and no strong decrease, then you can choose the big hall. Otherwise, small hall.
     - But note: This is the point where you might involve your partner because they co-sign.

  9. **Step 8: Partner Sign-off**
     - Whenever the decision is to rent the big hall OR when the adjusted number is in the "gray zone" (60-100), you must get partner sign-off.
     - Also, if at any step you had to use a broad reference class because of lack of data, partner sign-off is required.

  10. **End**: Sign the contract accordingly.

  Now, let's apply to the cases:

  **Case 1: Zoning debate with viral Facebook post**
  - Step 1: Reference class. We look for past zoning debates with viral posts. If none, then zoning debates without viral. Let's say we have 10 zoning debates without viral: average 45. We don't have any with viral, so we use that and note the lack of viral data.
  - Step 2: Base rate: 45.
  - Step 3: Inside factors: 
       - Viral post: strong increase (we think) → +40%
       - No other factors? → so adjusted: 45 * 1.4 = 63.
  - Step 4: Modesty check: 
       - Test 1: Would I bet $100 that at least 63 will come? Maybe not? Because we've never had a viral post before. So reduce by 20%: 63 * 0.8 = 50.4 → 50.
       - Test 2: Ask partner. If partner says 70, then average (50+70)/2=60. Let's say partner says 50 → so 50.
  - Step 5: Compare: 50 <=60 → rent small hall.
  - Step 6: No gray zone, so no partner sign-off needed? But note: we had to use a reference class without viral data → so by Step 8 we require partner sign-off. So we go to partner and explain. They sign off on small hall.

  **Case 2: Inside reasoning strong, base rate weak but forces caution**
  - Scenario: We have a debate on a new topic (say, "AI and jobs") that has never been done. 
  - Step 1: Reference class: No past events on AI. So we go to the broadest class: all debates. Let's say average for all debates is 40.
  - Step 2: Base rate: 40.
  - Step 3: Inside factors: 
       - Speaker is a famous professor: strong increase → +40%
       - Topic is trending in news: strong increase → +40%
       - Adjusted: 40 * 1.8 = 72. But cap at +100% → so 80.
  - Step 4: Modesty check: 
       - Test 1: Bet $100 on 80? Maybe yes? Then no reduction. 
       - Test 2: Partner says 100? Then average (80+100)/2=90.
  - Step 5: Compare: 90 is between 60 and 100 → gray zone. 
  - Step 6: Values: We have two strong factors and no decrease. So we can choose big hall? But note the rule: adjusted number >100 for big hall? Our rule says only if >100. So by the numbers, we rent small hall. However, in the gray zone we can choose big hall only if adjusted number above 80 and two strong factors. So we choose big hall? 
       - But wait: Step 6 rule says: if adjusted number >60 and <=100 → we default to small hall unless we override with values. And the override condition is: adjusted number above 80 and at least one strong factor for increase and no strong decrease. Here we have two strong factors and no decrease → so we override to big hall.
  - Step 7: But we require partner sign-off for gray zone and because we used a broad reference class. So we must get partner to sign off on the big hall.

  Even though the base rate was weak and the procedure forced caution (we didn't just jump to 100+), we ended up with 90 and then overrode to big hall. But note: the modesty check and partner sign-off are there to prevent overconfidence.

  **Case 3: Inside and outside agree on big turnout, but I feel weird**
  - Scenario: A debate on school funding. 
  - Step 1: Reference class: school funding debates. Past 5: average 120, max 150, min 100. So base rate 120.
  - Step 2: Base rate: 120.
  - Step 3: Inside factors: 
       - School board president is speaking: strong increase → +40% → 120*1.4=168. But cap at 100% → so 240? Wait, cap is ±100% so max 240? But we have to cap the adjustment? Actually, we cap the total adjustment to base rate * 2 (so 240). But 168 is within 240, so 168.
       - No negative factors.
  - Step 4: Modesty check: 
       - Test 1: Bet $100 on 168? Probably yes → no reduction.
       - Test 2: Partner says 140? Then average (168+140)/2=154.
  - Step 5: Compare: 154>100 → rent big hall.
  - Step 6: But you feel weird. Why? Maybe because the deposit is $500 and you've never had more than 150? 
       - The procedure says big hall, but the feeling might be due to risk aversion. 
       - However, note: Step 5 already includes modesty. Also, Step 6 requires partner sign-off for big hall? Actually, by the rule, we rent big hall without partner sign-off? But we have Step 8: whenever we decide big hall, we require partner sign-off. So we must get partner to sign off. 
       - If partner agrees, then sign. If not, then you can reconsider? But the procedure says partner sign-off is required for big hall. So if partner doesn't sign, then you cannot rent big hall. But in this case, the numbers are strong.

  **What the procedure can't fix:**
  - If you are bad at judging your own tiredness: The procedure has modesty checks and partner sign-off to catch this, but if you are too tired to run the procedure properly, that's a problem. Solution: Always run the procedure at a set time (not when tired) and with partner if possible.
  - If you have no data on past events: Then you are forced to use a very broad class or guess. The procedure will be weak.
  - If you lie to yourself about the strength of inside factors: The modesty check (especially the partner) is there to catch that. But if you both are overconfident, then the procedure fails.
  - If the world changes (e.g., after COVID, attendance patterns change) and the base rate is outdated.

  **Final Flowchart in Words:**

  1. **Identify Reference Class**: 
     - Ask: "What are the most similar past events? (aim for 5+ events)" 
     - If less than 5, note: "weak base rate" and require partner sign-off at the end.

  2. **Compute Base Rate**: 
     - Average attendance for that class? Max? Min? How often above big hall threshold (100)?

  3. **List Inside Factors**: 
     - At least 3 specific reasons, each with strength (weak/med/strong) and direction. 
     - Modesty: "Have I been wrong about this before? Would my partner agree?"

  4. **Adjust Base Rate**: 
     - Start with base rate. 
     - For each factor: 
          - weak: ±10%, med: ±20%, strong: ±40%
     - Cap total adjustment: base rate * 2 (max) or base rate * 0.5 (min).

  5. **Modesty Check**: 
     - Test 1: "Would I bet $100?" If no, reduce by 20%. 
     - Test 2: Partner's estimate → average the two.

  6. **Compare to Thresholds**: 
     - If final number <=60 → small hall.
     - If between 60 and 100 → default to small hall, unless:
          - The number is above 80 AND at least one strong increase factor AND no strong decrease factors → then big hall (but requires partner sign-off).
     - If above 100 → big hall.

  7. **Partner Sign-off Required When**:
     - Renting big hall.
     - The adjusted number is in the gray zone (60-100) and you are choosing big hall.
     - The reference class was weak (less than 5 events) or very broad.
     - Any time you feel uncertain.

  This should take about 15 minutes. Keep a form with these steps to fill out each month.
answer: |-
  ### Decision Flowchart for Hall Booking (15-Minute Procedure)
  **Core Principle:** Start with the outside view (base rates) as your anchor, then adjust with the inside view (specific factors), but cap adjustments to avoid overconfidence. Always cross-check with epistemic modesty and partner sign-off.

  ---

  #### Step-by-Step Flowchart (Run in Order)
  1. **Ask: "What’s the most specific reference class?"**  
     - **What to do:** List past events similar to this one in 3 key ways: topic (e.g., zoning), format (debate), and promotion (e.g., social media hype).  
     - **Good enough answer:** A group of ≥5 past events. If unavailable, widen slightly (e.g., "all debates with viral posts" → "all zoning debates" → "all debates").  
     - **Modesty check:** *"Would an impartial librarian agree this is the fairest comparison?"* If unsure, use a broader class.  
     - **Stop if self-deceiving:** You cherry-pick events that support your gut (e.g., only using "viral" events when none truly match).  

  2. **Ask: "What’s the base rate for this reference class?"**  
     - **What to do:** Calculate the average attendance from past events. Ignore extremes (e.g., drop the highest/lowest if outliers).  
     - **Good enough answer:** A single number (e.g., "45 people"). No stats needed—just average your notes.  
     - **Modesty check:** *"Did I wince when writing this number?"* If yes, you’re resisting the truth.  

  3. **Ask: "What are the top 3 reasons this event might beat the base rate?"**  
     - **What to do:** List specific, evidence-backed factors (e.g., "Speaker is mayor’s rival," "Facebook post has 200 shares"). Assign weights:  
       - **Weak:** Minor impact (e.g., "local speaker"—adjust by ±5%).  
       - **Medium:** Reliable impact (e.g., "front-page news"—adjust by ±15%).  
       - **Strong:** Rare, game-changing impact (e.g., "viral post with 1k+ shares"—adjust by ±30%).  
     - **Modesty check:** *"Has this factor failed me before?"* If yes, downgrade it (e.g., strong → medium).  

  4. **Adjust the base rate, but cap changes:**  
     - **What to do:** Apply your adjustments to the base rate. **Total adjustment cannot exceed ±50%.**  
       - *Example:* Base rate 40. Strong factor (+30%) → 52 people.  
     - **Stop if self-deceiving:** You bypass the cap because "this time is different."  

  5. **Run the "coffee modesty" test:**  
     - **What to do:** *"Would I bet $500 of my own money (not the club’s) that attendance hits my prediction?"*  
       - If **yes**, proceed.  
       - If **no**, reduce your prediction by 20%.  
     - **Values/risk step:** This is where your personal risk tolerance kicks in.  

  6. **Choose the hall size:**  
     - **Thresholds (customize to your halls):**  
       - Small hall: ≤60 people ($200 deposit).  
       - Big hall: 61–200 people ($500 deposit).  
     - **Decision rule:**  
       - If prediction ≤60 → **Rent small hall**.  
       - If prediction 61–100 → **Rent small hall** (unless partner override, see Step 7).  
       - If prediction >100 → **Rent big hall** (requires partner sign-off).  
     - **Why?** Avoid financial risk for middling predictions (61–100). Overcrowding is less costly than losing $300 extra.  

  7. **Partner sign-off required if:**  
     - Renting the big hall (prediction >100).  
     - Overriding to big hall with prediction 61–100 (e.g., "I’ll risk it").  
     - Reference class was weak/broad (e.g., <5 past events).  
     - **Values/risk step:** Partner must co-sign here. Their job: Challenge your modesty checks.  

  ---

  ### Applied to Your Bookings
  **Case 1: Zoning debate with viral Facebook post**  
  - **Step 1:** Reference class = "Zoning debates with viral posts." If no data, use "all zoning debates" (base rate: 45).  
  - **Step 2:** Base rate = 45.  
  - **Step 3:** Inside factors: "Viral post" (strong, +30%). Adjusted: 45 × 1.30 = 59 people.  
  - **Step 4:** Capped at +50%? 59 is within limit.  
  - **Step 5:** "Would I bet $500 on 59 people?" Gut says yes, but modesty check: Past viral posts flopped? If unsure, reduce 20% → 47 people.  
  - **Step 6:** 47 ≤60 → **Rent small hall**.  
  - **Partner sign-off?** No, unless reference class was weak.  

  **Case 2: Strong inside view, weak base rate (forces caution)**  
  - *Scenario:* Debate on "AI ethics." Base rate for "tech topics" = 30 (weak, only 3 events). Your inside view: "MIT speaker + podcast feature" (strong factors).  
  - **Step 1:** Reference class = "Tech topic debates" (weak, <5 events → partner sign-off later).  
  - **Step 2:** Base rate = 30.  
  - **Step 3:** Inside factors: "MIT speaker" (strong, +30%), "podcast feature" (medium, +15%). Adjusted: 30 × 1.45 = 44 people.  
  - **Step 4:** Capped total (+45% <50% → ok).  
  - **Step 5:** "Bet $500 on 44?" Yes, but modesty: Weak base rate → reduce 20% → 35 people.  
  - **Step 6:** 35 ≤60 → **Rent small hall** (even though your inside view screamed "big crowd").  
  - **Partner sign-off?** Required (weak reference class), but rules say small hall.  
  - **Why it annoys you:** The procedure throttles big swings from weak baselines. This is intentional—it stops hype from overriding data.  

  **Case 3: Inside/outside agree, but you feel uneasy**  
  - *Scenario:* "School funding debate." Base rate = 110 (from 6 similar events). Inside view: "Teacher strike ongoing" (strong, +30%) → adjusted 143.  
  - **Step 5:** "Bet $500 on 143?" If yes → prediction 143.  
  - **Step 6:** 143 >100 → **Rent big hall** (requires partner sign-off).  
  - **Why you feel weird:** The nonrefundable deposit amplifies risk aversion. The procedure forces partner accountability here—their sign-off counters solo anxiety.  

  ---

  ### What This Procedure Can’t Fix  
  - **Your energy/tiredness:** If you’re exhausted, you’ll shortcut steps. Fix: Run this with coffee *after* lunch, not before.  
  - **Data gaps:** If you have no past events (e.g., first debate), the base rate is a guess. Partner sign-off becomes mandatory.  
  - **Ego-driven lying:** If you dismiss the modesty checks ("I’d totally bet $500!" when you wouldn’t), the procedure fails. Partner sign-off is the backup.  
  - **External shocks:** A blizzard or breaking news could nuke attendance. The procedure doesn’t predict black swans—it only mitigates *your* overconfidence.  

  **Keep at the signing table:** A calculator, past attendance notes, and your partner’s phone number. No philosophy—just hard stops and humility.
