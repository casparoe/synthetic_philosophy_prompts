prompt: |-
  I'm giving the opening remarks at a small workshop called Minds Without Words — half the room are comparative cognition folks who study octopus and crow problem-solving, the other half are philosophers of mind who mostly talk about human consciousness and langauge. I want to welcome both groups without pretending we're all asking the same question. Could you write a five-minute opening that actually uses Dennett's four kinds of creatures — Darwinian, Skinnerian, Popperian, Gregorian — to structure what I can and can't claim? Specifically, I want to argue that calling an octopus Gregorian is a category mistake that insults both the biology and the philosophy, but that treating them as merely Skinnerian is now empirically shaky. The speech should make both sides feel heard, avoid saying anyone's work is 'just about' lower minds, and end with a ground rule for the weekend: we discuss mind-type, not mind-amount. Keep it casual — theres probably a typo or two in my notes anyway.
