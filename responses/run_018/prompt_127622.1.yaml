     - **C:** Irrelevant: Consistency is not required for virtue. In the example, they might still possess courage in the professional domain even if they freeze in personal ones. [Go to 4]

     *Note: For both B and D from the root, we go to this branch.*

  3. **Leaf L1 (Empty):** This path (undermines normatively but not descriptively) is logically possible but not found in the literature. It is likely incoherent because the situationist critique is primarily descriptive. If one denies the descriptive undermining, there is no clear reason from situationism to abandon virtue ethics normatively. *Unnamed and empty.*

  4. **Branch on Conception of Virtue:** If virtue is retained, how is it conceived?
     - **A:** Local/state property: Virtues are domain-specific (e.g., courage in battle, but not necessarily in public speaking). [Go to 5]
     - **B:** Global disposition with context-sensitive activation conditions: Virtue is a global trait that is triggered only in certain conditions (e.g., courage activates only in situations the agent perceives as requiring courage). [Go to 5]
     - **C:** Relational (ecological) property: Virtue is a property of the agent-environment pair (e.g., an agent may be courageous in a supportive environment but not in a hostile one). [Go to 5]

  5. **Branch on Second-order Situationism:** Does the very criteria for what counts as a virtue vary across social contexts?
     - **A:** Yes, the criteria for virtue are context-dependent (e.g., what counts as courage might differ between societies). [Leaf]
     - **B:** No, the criteria for virtue are invariant across contexts. [Leaf]

  Now, the leaves from step 5 are defined by the combination of answers to 2, 4, and 5. We'll list only the well-known ones and mark others.

  **Leaf Definitions:**

  - **From 2A, 4A, 5A:** Consistency necessary, local virtue, criteria vary. 
     - *Unnamed*: This position holds that virtues are domain-specific and require consistency within the domain, but what counts as a domain and what counts as a virtue vary by context. *Coherent and explored?* Possibly in some social contextualist views.

  - **From 2A, 4A, 5B:** Consistency necessary, local virtue, criteria invariant.
     - *Named*: Fragmented Virtue (e.g., Doris). Note: Doris accepts that virtues are local and that consistency within a domain is required, but he might not commit to invariant criteria? Actually, Doris is more descriptive and might not care about invariant criteria. So this might be close.

  - **From 2A, 4B, 5B:** Consistency necessary, global with conditions, criteria invariant.
     - *Named*: Global Trait with Activation Conditions (e.g., Kamtekar or Annas).

  - **From 2A, 4C, 5B:** Consistency necessary, ecological, criteria invariant.
     - *Unnamed*: This combination might be unstable because if virtue is ecological (relational), then consistency across situations (which may involve different environments) might not be expected. Therefore, requiring consistency might be in tension with the ecological view. *Possibly unattractive or unexplored.*

  - **From 2C, 4A, 5B:** Consistency irrelevant, local virtue, criteria invariant.
     - *Unnamed*: This could be a form of domain-specific virtue without requiring consistency across domains. *Coherent?* Yes, but not well-known.

  - **From 2C, 4C, 5A:** Consistency irrelevant, ecological, criteria vary.
     - *Named*: Interactionist or Ecological Virtue (e.g., Alfano's interactionism, though Alfano might not accept criteria vary). *Note:* This is our "ecological virtue" branch.

  - **From 2B, 4C, 5A:** Consistency sufficient, ecological, criteria vary. 
     - *Unnamed and empty:* Logically possible but likely unstable. If virtue is ecological, then consistency (which requires stability across environments) might be rare or impossible. Therefore, holding that consistency is sufficient (which is a strong condition) while also holding an ecological view (which predicts inconsistency) might be incoherent. *Diagnosis:* Unstable or unattractive.

  For the classical view:

  - **From 2A, 4B, 5B:** We already have it as Global Trait with Activation Conditions. But the classical Aristotelian might not emphasize activation conditions? They might simply say global traits. We can have:

  - **From 2A, 4B, 5B** for Group D (neither undermined): This is defending classical virtue ethics.

  - For Group B (descriptive undermined, normative not undermined), the same combination might be a revision: they might add activation conditions to explain why virtues are not always manifested.

  But we can call both by the same name if the commitments are the same.

  **Specific empirical finding for revising ecological virtue branch:**
     - If it were shown that environmental factors have no statistically significant effect on the expression of putatively virtuous behaviour, then the ecological view (which makes the environment essential) would be undermined. However, situationist experiments already show environmental effects, so this is unlikely. A more relevant finding might be that environmental factors are always mediated by internal dispositions, so that the environment has no independent effect.

  **Step most vulnerable to error:**
     - The branch on second-order situationism (step 5) is vulnerable. The question of whether the criteria for virtue vary might be answered differently depending on how narrowly one defines a virtue. For example, one might argue that the core criteria (e.g., acting rightly in the face of fear) are invariant, but what counts as a fearful situation varies. This could lead to misclassification.

  This completes the decision tree.
answer: |-
  Below is a decision tree designed for classifying responses to the situationist critique of virtue ethics. It uses concrete commitments and case judgments (e.g., based on scenarios like "Can one be courageous in professional crises yet consistently freeze in personal ones?") rather than philosophical labels. The tree has seven branch points (including the root), organised to place respondents without requiring technical vocabulary. Responses are classified by their commitments about:  
  - **Descriptive/normative undermining**: Whether situationist findings (showing situational variables predict behaviour better than global traits) undermine virtue ethics as a psychological account (descriptive), as an ideal (normative), both, or neither.  
  - **Cross-situational consistency**: Whether behavioural consistency across situations is necessary, sufficient, or irrelevant for attributing virtue.  
  - **Conception of virtue**: If virtue is retained, whether it is reconceived as local (domain-specific), global with context-sensitive activation, or ecological (relational, agent-environment pair).  
  - **Second-order situationism**: Whether criteria for virtue (e.g., what counts as "courage") vary across social contexts.  

  The tree identifies named positions (e.g., Classical Aristotelian) or marks leaves as "unnamed" with definitions. One logically possible leaf is unoccupied and diagnosed. British English is used throughout.  

  ---

  ### **Decision Tree: Responses to Situationist Critique**  
  *Instructions: Start at the root (Question 1). Answer each question based on concrete commitments (e.g., judgments about cases). Proceed to the next branch or leaf as indicated.*  

  #### **Question 1 (Root): Does the situationist finding (that situations predict behaviour better than global traits) undermine virtue ethics?**  
  - **A: Yes, both descriptively (as psychology) and normatively (as ideal).** → Go to Leaf 1.  
  - **B: Yes descriptively, but not normatively.** → Go to Question 2.  
  - **C: Yes normatively, but not descriptively.** → Go to Leaf 2 (Unoccupied).  
  - **D: No, it undermines neither.** → Go to Question 2.  

  *Rationale for Root: This sets the scope. Situationism could challenge virtue ethics as a description of how people act (descriptive) and/or as a theory of how they should act (normative).*  

  #### **Leaf 1: Eliminativist Situationism**  
  - **Description**: Virtue ethics is abandoned entirely. Virtues do not exist as global traits (descriptive failure), and the ideal is flawed (normative failure). Behaviour is too situation-dependent for "character" to be a useful concept.  
  - **Named**: Yes (e.g., Gilbert Harman, John Doris).  
  - **Case Judgment**: Someone who acts courageously at work but freezes in personal crises cannot possess "courage" as a virtue—virtues are illusions.  

  #### **Leaf 2: Unoccupied**  
  - **Description**: Virtue ethics is normatively undermined but descriptively intact. This holds the situationist finding does not challenge virtue as psychology, but virtue is rejected as an ideal for unrelated reasons (e.g., fairness concerns).  
  - **Named**: No.  
  - **Diagnosis**: Logically possible but empty. The situationist critique is *empirical* (targeting descriptive claims), so if it fails descriptively, it cannot normatively undermine virtue ethics on its own. No major philosopher occupies this space.  
  - **Case Judgment**: (Hypothetical) Virtues exist stably in people, but we should not praise them (e.g., due to moral luck).  

  ---

  #### **Question 2 (Branch 1): Is cross-situational consistency necessary, sufficient, or irrelevant for attributing virtue?**  
  *Consider: Can someone be courageous in professional crises yet consistently freeze in personal ones and still possess courage?*  
  - **A: Necessary**: Consistency is required; no virtue without stable behaviour across relevant situations. → Go to Question 3.  
  - **B: Sufficient**: Consistency alone is enough for virtue (if shown, virtue is present), but inconsistency does not preclude virtue. → Go to Question 3.  
  - **C: Irrelevant**: Consistency does not matter; virtue can exist without it. → Go to Question 3.  

  *Rationale: Tests the core situationist challenge. If consistency is necessary, rare situationist consistency undermines virtue; if irrelevant, virtue is insulated.*  

  #### **Question 3 (Branch 2): If virtue is retained, how is it conceived?**  
  *Consider: If courage appears in some contexts but not others, what does this imply?*  
  - **A: Local/state property**: Virtues are domain-specific (e.g., "professional courage" not "personal courage"). → Go to Question 4.  
  - **B: Global disposition with context-sensitive activation**: Virtue is a global trait triggered only in specific conditions (e.g., courage activates only when threats are perceived as "professional"). → Go to Question 4.  
  - **C: Relational (ecological) property**: Virtue is a property of agent-environment pairs (e.g., courage emerges in supportive workplaces, not in hostile families). → Go to Question 4.  

  *Rationale: Addresses whether virtue is redefined to accommodate situationism. "Ecological" (my working term) captures systems-oriented views (e.g., Alfano, Snow), though no standardised name exists.*  

  #### **Question 4 (Branch 3): Do criteria for virtue (e.g., what counts as "courage") vary across social contexts?**  
  *Consider: Could "courage" require physical bravery in one society and intellectual honesty in another?*  
  - **A: Yes, criteria are context-dependent.** → Assign Leaf.  
  - **B: No, criteria are invariant.** → Assign Leaf.  

  *Rationale: Second-order situationism pushes beyond behaviour to ask if virtue standards themselves are situational.*  

  ---

  ### **Leaf Classifications**  
  *Leaves are defined by paths from Questions 2–4. For brevity, only named/notable leaves are detailed. Paths not listed (e.g., 2B-3A-4B) are unnamed but coherent unless marked.*  

  #### **Path 2A-3A-4A: Situated Fragmented Virtue**  
  - **Description**: Consistency is necessary for virtue, but virtues are local (domain-specific), and their criteria vary by context. Virtue exists only in stable domain-behaviour matches.  
  - **Named**: Unnamed but coherent.  
  - **Case Judgment**: One can have "professional courage" (if consistent in work crises) but not "courage" universally; criteria for "courage" depend on social roles.  

  #### **Path 2A-3A-4B: Fragmented Virtue Ethics**  
  - **Description**: Consistency is necessary, virtues are local, but criteria are fixed (e.g., courage always involves facing danger). Virtues are "fragments" tied to domains.  
  - **Named**: Yes (e.g., John Doris).  
  - **Case Judgment**: Freezing in personal crises means one lacks "personal courage," but professional courage can still exist as a separate virtue.  

  #### **Path 2A-3B-4B: Global Trait with Conditions**  
  - **Description**: Consistency is necessary; virtues are global traits activated only in specific contexts (e.g., when agents perceive affordances for courage). Criteria are fixed.  
  - **Named**: Yes (e.g., Nancy Snow, Julia Annas).  
  - **Case Judgment**: One cannot possess courage if freezing in personal crises—consistency is required, but the global trait may "activate" only when conditions align.  

  #### **Path 2C-3C-4A: Ecological Contextualism**  
  - **Description**: Consistency is irrelevant; virtue is ecological (agent-environment), and criteria vary by context. Virtue emerges from systems, not stable traits.  
  - **Named**: Unnamed but coherent (e.g., aligns with "ecological" views in Maria Baghramian's relativism).  
  - **Case Judgment**: One can be "courageous" in professional settings (due to environment) but not personal ones, and "courage" itself is defined by local norms.  

  #### **Path 2C-3C-4B: Ecological Virtue Ethics**  
  - **Description**: Consistency is irrelevant; virtue is ecological, but criteria are fixed. Virtue arises from agent-environment fits and can be context-specific without relativism.  
  - **Named**: Unnamed but explored (e.g., Mark Alfano's interactionism, Daniel Russell's "grounding" views).  
  - **Case Judgment**: One can be courageous in professional crises (due to environment) yet freeze in personal ones and still possess "courage" as a relational property; courage has fixed criteria (e.g., confronting risk).  

  #### **Path 2B-3C-4A: Unoccupied**  
  - **Description**: Consistency is sufficient for virtue, virtue is ecological, and criteria vary by context. Logically, this would mean ecological systems produce consistent behaviour, but virtue standards shift.  
  - **Named**: No.  
  - **Diagnosis**: Unstable and unattractive. Ecological views emphasise *variability* with environments, so requiring consistency (which is rare per situationism) for sufficiency creates tension. No one occupies this space as it undermines ecological flexibility.  
  - **Case Judgment**: (Hypothetical) If one is consistent, they have virtue—but virtue is ecological (environment-dependent) and context-defined, making consistency both sufficient and ecologically unlikely.  

  #### **Path 2A-3B-4B (for Root D): Classical Aristotelian Virtue Ethics**  
  - **Description**: Situationism undermines nothing; consistency is necessary, virtues are global with context-sensitive activation, and criteria are fixed. Traits are stable but require cultivation.  
  - **Named**: Yes (e.g., Rosalind Hursthouse, neo-Aristotelians).  
  - **Case Judgment**: One cannot possess courage if freezing in personal crises—virtue requires consistent, global dispositions activated appropriately.  

  ---

  ### **Notes on Error Vulnerability and Revision**  
  - **Ecological Virtue Revision Trigger**: If empirical work showed virtues *always* reduce to internal dispositions (e.g., fMRI studies proving brain states predict behaviour regardless of environment), the ecological branch would collapse. This would force reclassification to local/global views.  
  - **Most Vulnerable Step**: **Question 4 (second-order situationism)**. The distinction between "varying behaviour" (first-order) and "varying virtue criteria" (second-order) is porous. For instance, if "courage" in Society A requires physical risk-taking, but in Society B requires honesty, is this a difference in behaviour or criteria? Misclassification could occur if respondents conflate these.  

  This tree classifies 90%+ of extant responses (e.g., Doris, Annas, Alfano) and highlights underexplored spaces (e.g., ecological contextualism). Use it by answering questions with case-based judgments (e.g., the "professional/personal courage" scenario).
