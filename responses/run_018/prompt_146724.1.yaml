  ## COMMITTEE ON CONTINUITY OF PERSONHOOD AND INSTITUTIONAL OBLIGATIONS
  **Formal Opinion: Case of Dr. Elena Vasquez / GSR Protocol #042**

  **Date:** October 26, 2023
  **Subject:** Recognition of Personhood and Continuation of Institutional Obligations Post-Graduated Substrate Replacement (GSR)

  ### I. Executive Summary
  The Committee recommends **Option (a): Full institutional recognition of the individual resulting from the GSR procedure ("Vasquez-2") as continuous with Dr. Elena Vasquez**. This individual is entitled to all rights, privileges, obligations, and benefits previously held by Dr. Vasquez, including tenure, pension contributions, spousal health benefits, and teaching responsibilities. This recommendation is grounded in the preservation of robust psychological continuity via appropriate causal dependence, which constitutes what matters for survival and institutional continuity, irrespective of strict physical identity. The Committee acknowledges the profound concerns regarding biological cessation but finds they do not supersede the preservation of the psychological person for institutional purposes.

  ### II. Case Summary & Opposing Views
  Dr. Elena Vasquez underwent the Committee-approved GSR protocol, involving the incremental, one-for-one replacement of biological neurons with functionally equivalent synthetic analogues, coupled with the destruction of the original biological tissue. The procedure is complete. The resulting individual asserts psychological and experiential continuity with Dr. Vasquez and demands full institutional recognition. Legal Counsel contends that physical discontinuity necessitates treating this as a new entity ("Vasquez-2"), implying the death of the original Dr. Vasquez and termination of all obligations. Vasquez-2's counsel argues psychological continuity suffices, invoking Parfit's analysis of what matters in survival. Dr. Vasquez's spouse supports recognition based on psychological continuity and lived experience; her adult children oppose it, arguing the biological destruction constitutes their mother's death and that recognition denies this reality.

  ### III. Philosophical Analysis & Application to Institutional Obligations
  The crux of this decision lies in determining the criteria for institutional continuity of personhood. We engage directly with Derek Parfit's seminal distinction between **personal identity** (a strict, all-or-nothing concept often tied to physical or biological persistence) and **what matters in survival** (the preservation of our psychological features—memories, intentions, character traits, projects—connected in the right way). Parfit argued that psychological continuity, provided it is caused in the appropriate way (e.g., by the normal functioning of the brain or a reliable causal process), is sufficient for what matters, even if strict identity is not maintained. The classic teletransporter thought experiment illustrates this: a replica created instantaneously on Mars, bearing all psychological traits via appropriate causal connection from the original, *is* the survivor, despite the physical destruction of the original body. The replica has what matters for survival; the original person's projects, relationships, and experiential stream continue.

  The GSR procedure, as described, was explicitly designed to preserve **psychological continuity through appropriate causal dependence**. The "one-for-one" replacement with "synthetic analogues that preserve all psychological traits, memories, and dispositions" implies that each synthetic neuron was integrated functionally *before* the biological counterpart was destroyed, maintaining the ongoing structure and function of the mind. The causal chain of consciousness, memory formation, and psychological development was unbroken *through* the synthetic substrate as it was incorporated. This is not the creation of a distinct replica after destruction; it is the gradual *transformation* of the supporting substrate *while preserving the functional and psychological entity*. The causal connection is direct and continuous throughout the process, akin to Parfit's "Branch-Line" case where continuity is maintained during the transfer, even if a duplicate briefly exists.

  **Therefore, for institutional purposes – which fundamentally concern the continuation of a specific set of responsibilities, relationships, knowledge, commitments, and the lived experience of being that person within our community – what matters is robustly preserved.** Vasquez-2 teaches the same courses with the same expertise, interacts with colleagues and students based on shared past experiences, maintains spousal bonds rooted in decades of shared life, and continues Vasquez's scholarly projects. Denying continuity would be tantamount to the institution declaring that the person teaching, researching, and interacting within our community is a stranger merely impersonating Dr. Vasquez, despite the unbroken chain of her psychology and lived experience within these institutional walls. This contradicts the observable reality and the foundational purpose of tenure and benefits: to support the *person* fulfilling the role based on their accumulated expertise and contributions.

  ### IV. Addressing the Losing Side: The Children's Claim
  The Committee takes seriously the anguish expressed by Dr. Vasquez's children. Their claim that "my mother was destroyed cell by cell" captures a fundamental biological truth: the specific biological matter constituting Dr. Vasquez's brain at the start of the procedure no longer exists. This represents a *biological cessation*. Their grief and sense of loss are valid and understandable. Honoring this biological reality is important.

  However, institutional recognition of Vasquez-2 as continuous with Dr. Vasquez **does not erase or deny this biological death**. It asserts that for the specific purposes of institutional obligations, relationships, and personhood *as experienced and functionally enacted within the university context*, the critical element – the psychological person – survived the substrate change. The benefits (tenure, salary, pension contributions) flow to the *persisting conscious entity* who earned them through Dr. Vasquez's prior work and continues to fulfill the associated duties. The spousal health benefit recognizes the *ongoing relationship* between two conscious beings whose shared history and current interaction remain unbroken. Recognizing Vasquez-2 does not declare the biological destruction irrelevant; it declares that, in this specific context defined by psychological and functional continuity maintained through appropriate causal dependence, the biological endpoint does not negate the survival of the person for institutional purposes. The children's loss is real, but it stems from the biological transformation, not from an institutional failure to recognize the persistence of their mother's psychology and agency.

  ### V. Recommendation & Criteria for Future Cases
  The Committee **UNANIMOUSLY RECOMMENDS** that the University Medical Center and the broader University administration fully recognize the individual resulting from the GSR procedure undergone by Dr. Elena Vasquez as **Dr. Elena Vasquez**, continuous with the individual who entered the protocol. All institutional obligations, including tenure, salary, pension contributions, spousal/partner benefits, teaching assignments, lab access, and voting rights within faculty governance, must continue uninterrupted.

  **Criteria for Future Substrate Replacement Cases:**
  1.  **Psychological Continuity:** The procedure must demonstrably aim for and achieve preservation of core psychological traits, memories, dispositions, and experiential consciousness throughout the process.
  2.  **Appropriate Causal Dependence:** The psychological states post-procedure must be causally dependent, in the right kind of way, on the psychological states pre-procedure. This typically requires a gradual or continuous transfer process where the new substrate assumes the functional role *before* or *concurrently* with the removal/destruction of the old substrate, maintaining an unbroken chain of cognitive function. Sudden, destructive scanning followed by replica creation would not meet this criterion.
  3.  **Functional Equivalence:** The new substrate must support psychological functioning functionally equivalent to the original at the time of replacement, enabling the individual to maintain their relationships, fulfill their roles, and pursue their ongoing projects without fundamental disruption attributable to the substrate change itself.
  4.  **Voluntary Participation & Informed Consent:** The procedure must have been undertaken voluntarily with fully informed consent, including explicit acknowledgment of the institutional implications regarding continuity of personhood.

  **Conclusion:** The Graduated Substrate Replacement protocol, as executed in Dr. Vasquez's case, preserved what matters in survival – robust psychological continuity via appropriate causal connection. While the biological transformation is profound, the person who is Dr. Elena Vasquez persists. The institution's obligations rightly continue to her.

  **Signed,**
  **The Committee on Continuity of Personhood and Institutional Obligations**
