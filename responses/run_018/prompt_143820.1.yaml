prompt: |-
  Read Orwell's 1984 through the problem of collective memory versus official history — specifcally the tension between the proles' vague, distributed remembering and Winston's precise but isolated recollections. The philosophical debate usually asks when community memory conflicts with the record, which should give way, but I want to push a weirder angle: does Orwell dramatize that distributed, imprecise collective memory is actually more epistemically resilient than an accurate individual archive? The Party can rewrite documents, but can it rewrite a culture's loose sense that things used to be different? Point me to scenes where the proles' half-remembered past works as a mnemonic counterweight, and where Winston's exactitude makes him more vunerable. I also want you to say where the novel resists this reading — maybe Winston's own memory is unreliable, or the proles are just apathetic. Don't reduce the book to an illustration; tell me what Orwell adds that the standard memory-vs-history papers miss about scale and vulnerability.
