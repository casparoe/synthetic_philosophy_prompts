  We are constructing a thought experiment in an ordinary workplace or residential community setting.
   The purpose is to isolate the exact structural point where a Lewisian coordination convention acquires genuine normative or identity-laden force without changing payoffs or information.
   We must have a single isolatable feature that drives the transition to a norm, and removing it should collapse the practice back to a stable convention.

   Steps:
   1. Scenario: one paragraph. The setting is ordinary (e.g., workplace or residential community). We need a practice that starts as a convention and then becomes a norm due to one feature.

   2. Purpose Statement: a string that states the purpose.

   3. Convention Stage: an object with four boolean keys (regularity, common_knowledge, conditional_conformity, arbitrariness) that are true during the convention stage.

   4. Norm Stage: an object with the same keys, but the values are either "pure", "modified", or "broken". We need to indicate which of the four conditions hold in pure form, which are modified, and which is broken. Remember, the norm stage has normative force.

   5. Transforming Feature: a string that names the single feature that transforms the convention into a norm.

   6. Collapse Test: an object with:
        - "feature_removed": boolean (true, because we remove the transforming feature)
        - "restores_arbitrariness": boolean (we expect true, because removing the feature should collapse the norm back to a convention, restoring arbitrariness and collapsing the normative distinction)
        - "explanation": string (a brief explanation of why removing the feature restores arbitrariness and collapses the distinction)

   7. Structural Work: a string explaining why this feature (rather than a general attitude change) does the structural work.

   Thought Experiment:

   Let's design a scenario in a workplace. Suppose there is a convention about where to have lunch.

   Scenario:
     In a mid-sized corporate office, employees have two equally convenient lunch break options: the 12th-floor cafeteria or the ground-floor bistro. Initially, they coordinate on the cafeteria purely for historical reasons (the bistro was under renovation when the office opened). This choice exhibits a stable behavioral regularity: nearly all go to the cafeteria. Everyone knows this and knows that others know, etc. (common knowledge). Each prefers to go where others go to socialize (conditional conformity). The choice is arbitrary because the bistro is now equally good. Then, a new employee newsletter starts featuring a "Cafeteria Community Spotlight" section, highlighting positive stories of interactions that occurred there. Over time, employees begin to view cafeteria attendance as a sign of being a "team player" and part of the "office family". The newsletter, a regular fixture, becomes the sole driver of this identity-laden meaning. Without any change in the quality or convenience of either venue, the cafeteria choice shifts from being merely conventional to carrying normative weight: missing too many cafeteria lunches now risks social disapproval and self-identity discomfort, even though the bistro remains equally good.

   Transforming Feature: The introduction of the "Cafeteria Community Spotlight" in the newsletter.

   Now, during the convention stage (before the newsletter):
     regularity: true (they all go to the cafeteria)
     common_knowledge: true (everyone knows and it's common knowledge that they all go there)
     conditional_conformity: true (each prefers to go where others go to socialize)
     arbitrariness: true (the bistro is equally good)

   During the norm stage (after the newsletter and the identity shift):
     regularity: pure (still true, they still go to the cafeteria)
     common_knowledge: pure (still common knowledge that they go there and that it's now seen as the "team player" choice)
     conditional_conformity: modified? But note: conditional conformity might still hold because they still prefer to conform conditionally, but now there is an additional reason: identity. However, the condition might be the same. Alternatively, it might be that conditional conformity is now strengthened by the normative force. But Lewis's condition is about preference for conditional conformity. In the norm stage, they might still prefer to conform if others do, but now they also have an independent reason (identity). However, the condition of conditional conformity is still present. So, we might say it's still pure? Or modified? Let's think.

     Actually, Lewis's condition is: each prefers to conform if others conform. In the norm stage, they might prefer to conform even if others didn't? But that wouldn't be coordination. So, conditional conformity must still hold. However, now there is an additional reason to conform even when others don't? But note: the setting hasn't changed, so if others stopped going, they might still feel the normative pull? But that might break the condition. Alternatively, we can say that conditional conformity is still present but now it is intertwined with the normative force. However, the condition is still that they prefer to conform if others do. So, we can say it's pure? But note that in the norm stage, they might also have a reason to conform even if others don't? Actually, in this scenario, the conditional conformity is still there because the socializing aspect is still important. But the normative force adds a new reason that doesn't depend on others? Not exactly: the normative force is about being a team player, which requires the group. So if others stopped going, then going to the cafeteria wouldn't make you a team player because the team isn't there. Therefore, conditional conformity might still hold in pure form.

     However, let's reconsider: Lewis's condition is about coordination. The condition is that one conforms conditionally on others conforming because that solves the coordination problem. In the norm stage, one might conform because of the identity (being a team player) even if one didn't care about the coordination per se? But note, the coordination aspect is still present: they still want to socialize. So conditional conformity is still there. Therefore, we can mark it as pure.

     What about arbitrariness? In the convention stage, it was arbitrary. In the norm stage, it is no longer arbitrary because the cafeteria has acquired a special meaning. So arbitrariness is broken.

     So, in the norm stage:
        regularity: pure
        common_knowledge: pure
        conditional_conformity: pure? Or modified? Actually, the condition of conditional conformity is still met, but now there is an additional normative reason. However, the definition of conditional conformity is about the preference structure: they prefer to conform if others do. That hasn't changed. So we can set it to pure. But note: the preference might now be stronger? But the condition is still satisfied. So let's set it to pure.

     However, the key change is in arbitrariness: it is broken because the cafeteria is no longer arbitrary (it has become identity-laden). So:

        norm_stage: 
          regularity: "pure"
          common_knowledge: "pure"
          conditional_conformity: "pure"
          arbitrariness: "broken"

     Alternatively, we might argue that conditional conformity is modified because now they conform not only for coordination but also for identity. However, Lewis's condition is about the preference for conditional conformity. As long as they still have that preference (which they do, because they still want to socialize), it's pure. The identity reason is additive and doesn't negate the conditional preference.

     But note: in the norm stage, if others stopped going to the cafeteria, the identity reason would disappear? Because the identity is tied to the group activity. So the identity reason is conditional on others conforming? Then it's still conditional. Therefore, conditional conformity is still pure.

     Therefore, the transforming feature is the newsletter's spotlight, which breaks arbitrariness by attaching identity to the convention.

   Collapse Test:
     Remove the transforming feature: stop the "Cafeteria Community Spotlight" in the newsletter.
     What happens? Without the newsletter, the identity element fades. The practice reverts to a convention: the cafeteria is still the default because of habit and common knowledge, but the bistro becomes an equally acceptable option again. The normative force (disapproval for not going) disappears. The arbitrariness is restored because both options are again seen as interchangeable. So:

        feature_removed: true (we removed the spotlight)
        restores_arbitrariness: true
        explanation: "Without the newsletter's identity-laden narratives, the cafeteria loses its special meaning. The choice reverts to being arbitrary (either venue is acceptable) and the practice becomes a stable convention again, with no normative pressure beyond the coordination benefits."

   Structural Work:
     Why is this feature structural and not just an attitude change? Because the newsletter is a concrete, recurring communication mechanism that systematically reinforces the association between the convention and group identity. It is an external, structural element (a regular publication) that alters the social meaning without altering the payoffs or information. If it were merely an attitude change, it would be diffuse and not tied to a specific, removable feature. The newsletter is a discrete, isolatable intervention that can be added or removed, thereby controlling the normative shift.

