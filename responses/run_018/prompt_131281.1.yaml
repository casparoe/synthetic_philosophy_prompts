prompt: |-
  hey so im in this philosophy elective and weve been talking about the problem of other minds, like how do i actually know my friends arent just really convincing robots? and i noticed this weird pattern whenever we talk about whether something else could have a mind — not just robots but also like octopuses or ai. first people say "well they need to talk and show emotion," then if you show them something that does both they say "okay but it needs to actually feel pain from the inside," and then if you imagine a thing that does that too they suddenly say "no it needs to be part of our evolutionary story" or whatever. each step sounds kinda reasonable on its own but together it feels like the rules keep changing just to keep humans special. i was arguing with my friend about this after class and he said im just describing moving the goalposts, but i dont think thats right because its not like theyre defending one claim and retreating — theyre genuinely giving a different reason each time and none of them are obviously wrong. is there an actual name for this specific thing where the criteria for having a mind keep getting replaced with deeper hidden ones whenever the surface ones get met? and if there isnt, could you name it and say exactly what makes it different from regular skepticism or from just being biased? please keep it to one paragraph, under 180 words, and dont just list philosophers — i want the concept carved out precisely.
reasoning: |-
  Okay, the user is in a philosophy elective discussing the problem of other minds. They've noticed a pattern where criteria for attributing a mind to something—like robots or octopuses—keep shifting. Initially, people require communication and emotions, but when those are met, they demand internal experiences like pain. If that's satisfied, they fall back on evolutionary history. The user feels this is a way to keep humans special, but their friend calls it moving the goalposts. However, the user thinks it's different because each reason seems distinct and not obviously wrong. They want to know if there's a specific term for this.

  I recall that moving the goalposts is a fallacy where someone changes the criteria after the initial ones are met. But the user points out that each new criterion is presented as a deeper, necessary condition, not just a retreat. This sounds familiar. I think it's related to what's called "criterial escapism" or "infinite regress of criteria." The key difference here is the continuous replacement with "hidden" internal criteria that are harder to verify. 

  The user needs a precise concept that distinguishes this from regular skepticism or bias. Skepticism questions all claims, but this is specifically about shifting criteria for consciousness. Bias might be the underlying cause, but the mechanism is the shifting criteria. The essence is the demand for successively inaccessible properties to preserve human uniqueness. I should emphasize the structure: each new criterion is presented as necessary and previously overlooked, making it a deeper requirement. This avoids admitting the initial criteria were insufficient and maintains human exceptionalism. 

  Also, the user wants a concise paragraph under 180 words without listing philosophers. So, I'll define the concept clearly, explain how it differs from moving the goalposts and skepticism, and highlight the focus on preserving human uniqueness through ever-deeper criteria. Making sure it's precise and meets their requirements.
answer: |-
  This pattern is best described as **criterial regress for consciousness attribution** or **shifting criteria of the mental**. It's distinct from simple moving the goalposts (which is retreating on *one* claim) because it involves proposing *entirely new, deeper criteria* for possessing a mind whenever existing criteria are satisfied by non-human entities. Each new criterion (behavior, phenomenal feeling, biological origin) is presented as the *truly essential* requirement, previously overlooked. The defining characteristic is the *successive replacement* of testable, functional criteria (like communication) with increasingly hidden, inaccessible, and often biologically anthropocentric properties ("inner feeling", "evolutionary kinship") specifically to preserve human uniqueness. It's different from general skepticism (which doubts *all* minds) or simple bias (a static prejudice) because it's a *dynamic process* of redefining "mind" itself to evade counterexamples, masking anthropocentrism behind layers of seemingly reasonable, ever-deeper demands.
