  We are designing a decision procedure for evaluating proposed changes to diagnostic criteria in psychiatry, with attention to Hacking's looping effects. The procedure must be operational and avoid unnecessary philosophical distinctions. 

  The core elements of looping effects we must consider are:
  1. **Interactive kinds**: The classification alters the self-understanding and behavior of those classified.
  2. **Institutional feedback**: Institutional practices (e.g., treatment settings, incentives) reshape how symptoms are presented or recorded.
  3. **Resistance/redefinition**: The classified individuals actively resist or redefine the category.

