  We assume the working group has access to empirical data and can conduct necessary reviews.

  **Decision Procedure: Ordered Sequence of Questions**

  1. **Question 1: Is the proposed change driven by a shift in the underlying condition (e.g., new etiological evidence, new data on natural history)?**
     - *Sufficient to proceed*: Yes, if there is robust new evidence (e.g., from longitudinal studies, biomarkers, genetic studies) that the condition has changed in a way that the current criteria no longer capture.
     - *Stop and recommend against*: If the change is driven solely by (a) increased public awareness of the diagnosis, (b) changes in help-seeking behavior without new evidence of a shift in the underlying condition, or (c) changes in diagnostic practices (e.g., new screening tools) that are not validated against the underlying condition.
     - *Judgment required*: If the evidence is mixed or inconclusive. The group must sign off, considering the preponderance of evidence and the potential consequences of both changing and not changing.
     - *Misfire condition*: False negative if the underlying condition has genuinely changed but the evidence is not yet available (e.g., due to lag in research).

  2. **Question 2: Have there been changes in the institutional context (e.g., treatment settings, reimbursement policies, legal frameworks) that could artifactually alter symptom presentation or reporting?**
     - *Sufficient to proceed*: If a review of institutional factors (e.g., changes in healthcare systems, educational settings, insurance) shows no significant influence on the observed changes that motivated the proposal. Alternatively, if such factors are present, then the group must have data showing they do not account for the observed shift.
     - *Stop and recommend against*: If the proposed change is a direct response to institutional changes that are known to alter symptom presentation (e.g., a drop in prevalence because of reduced long-term care leading to fewer opportunities for observation) without evidence that the underlying condition has changed independently.
     - *Judgment required*: When institutional changes are present but their impact is uncertain. The group must sign off, weighing the strength of the institutional effect versus the evidence for a true shift.
     - *Misfire condition*: False negative if institutional changes are subtle and not detected by the group's review.

  3. **Question 3: Is there evidence that the diagnostic category itself has altered the self-understanding or behavior of those classified (or those at risk of being classified) in ways that could produce the observed shift?**
     - *Sufficient to proceed*: If there is no evidence (from qualitative studies, surveys, clinical reports) that the category has influenced identity or behavior in a way that would cause the observed shift. Or, if such evidence exists, then the group must have data showing that the observed shift is not primarily due to these effects.
     - *Stop and recommend against*: If the observed shift (e.g., increase in younger patients self-identifying) is primarily due to the looping effect of the category (e.g., the diagnosis becoming a cultural script that shapes behavior and self-report) without independent evidence of a change in the underlying condition.
     - *Judgment required*: When there is evidence of looping but it is unclear whether it is the main driver. The group must sign off, considering the balance of evidence and the potential for harm in either decision.
     - *Misfire condition*: False negative if the looping effect is occurring but is not captured by available data (e.g., in a subpopulation not studied).

  4. **Question 4: Are the classified individuals or groups actively resisting or redefining the category in a manner that could explain the observed shift?**
     - *Sufficient to proceed*: If there is no evidence (from advocacy groups, social media, research on patient perspectives) of resistance or redefinition that would lead to the observed changes. Or, if there is, then the group must show that the proposed change is not primarily a reaction to such resistance without a basis in the underlying condition.
     - *Stop and recommend against*: If the proposed change is primarily a response to patient resistance (e.g., stigma leading to underreporting) or redefinition (e.g., patient communities adopting new terms) without evidence that the underlying condition has changed.
     - *Judgment required*: When resistance/redefinition is present but its impact is unclear. The group must sign off.
     - *Misfire condition*: False negative if resistance is occurring but is not visible to the group (e.g., in marginalized groups without representation).

  5. **Question 5: Does the proposed change risk amplifying harmful looping effects?**
     - *Note*: This step is about the future: even if the change is justified by the above, we must consider if it could set in motion negative loops.
     - *Sufficient to proceed*: If the group, after review, concludes that the change is unlikely to lead to harmful looping effects (e.g., overdiagnosis, stigmatization, inappropriate treatment) or that the benefits outweigh the risks.
     - *Stop and recommend against*: If the change is likely to cause significant harm through looping effects (e.g., by expanding the category to individuals who might be harmed by the diagnosis) without sufficient benefit.
     - *Judgment required*: This step is inherently about values and risk-benefit. The group must sign off, and if the group lacks expertise in ethics or patient perspectives, they should consult with ethicists and patient representatives.
     - *Misfire condition*: False negative if the group underestimates the potential for harm.

