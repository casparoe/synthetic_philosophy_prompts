answer: |-
  ### Decision Procedure for Evaluating Diagnostic Criteria Changes

  **Core Principles**:  
  1. **Interactive Kinds**: Does the classification alter self-understanding/behavior of the classified?  
  2. **Institutional Feedback**: Do system-level factors (e.g., treatment access, incentives) reshape symptom presentation?  
  3. **Resistance/Redefinition**: Are the classified actively resisting or redefining the category?  

  **Procedure Steps**:  

  #### Step 1: Etiological Shift Check  
  **Question**: *Is there robust, independent evidence (e.g., biomarkers, longitudinal studies, genetic data) that the proposed change reflects a true shift in the underlying condition’s etiology or natural history?*  
  - **Sufficient Answer**: Evidence shows the change aligns with biological/psychological mechanisms unrelated to diagnostic practices.  
  - **Stop & Reject**: No such evidence exists; change is driven solely by clinical anecdotes, self-reports, or cultural trends.  
  - **Judgment Required**: If evidence is ambiguous; requires unanimous sign-off from epidemiologists.  
  - **Misfire Condition**: False negative if novel etiological evidence exists but is not yet published (e.g., ongoing research).  

  #### Step 2: Institutional Artifact Screen  
  **Question**: *Could the observed shift be explained by changes in institutional contexts (e.g., healthcare access, reimbursement policies, diagnostic tools)?*  
  - **Sufficient Answer**: Data demonstrate the shift persists after controlling for institutional variables (e.g., via multi-jurisdiction comparisons).  
  - **Stop & Reject**: Shift correlates tightly with institutional changes (e.g., reduced long-term care beds, new screening mandates).  
  - **Judgment Required**: If institutional factors are present but causality is unclear; requires majority sign-off from clinicians.  
  - **Misfire Condition**: False negative if institutional incentives are covert (e.g., undisclosed financial motives).  

  #### Step 3: Identity/Behavior Feedback Test  
  **Question**: *Is there evidence that the diagnostic category itself has altered patient identity or behavior (e.g., self-diagnosis trends, symptom amplification via social media)?*  
  - **Sufficient Answer**: Studies (e.g., qualitative interviews, cohort analyses) show no significant feedback loops between diagnosis and behavior.  
  - **Stop & Reject**: Change is primarily fueled by diagnostic looping (e.g., patients adopting symptoms after diagnosis exposure).  
  - **Judgment Required**: If feedback is partial; requires consultation with patient advocates + majority clinician sign-off.  
  - **Misfire Condition**: False negative if looping occurs in marginalized groups without research representation.  

  #### Step 4: Resistance/Redefinition Audit  
  **Question**: *Are the classified groups resisting or redefining the category (e.g., advocacy movements, stigma-driven underreporting) in ways that invalidate current criteria?*  
  - **Sufficient Answer**: No grassroots resistance/redefinition exists, or such movements do not explain the proposed change.  
  - **Stop & Reject**: Change is a reaction to activism without etiological justification (e.g., removing a disorder due to stigma).  
  - **Judgment Required**: If resistance is present but impact is debated; requires unanimous sign-off from clinicians + patient advocates.  
  - **Misfire Condition**: False negative if resistance is internalized (e.g., patients hiding symptoms due to shame).  

  #### Step 5: Harm-Benefit Balancing  
  **Question**: *Would the change likely amplify harmful looping effects (e.g., overdiagnosis, stigma) more than it improves clinical outcomes?*  
  - **Sufficient Answer**: Risk-benefit analysis (e.g., cost/access studies, harm surveys) shows net benefit.  
  - **Stop & Reject**: High risk of harm (e.g., medicalizing normal behavior) with minimal clinical gain.  
  - **Judgment Required**: Inherently values-based; requires ethicist consultation + supermajority (≥75%) group sign-off.  
  - **Misfire Condition**: False negative if long-term harms (e.g., iatrogenic effects) are underestimated.  

  ---

  ### Procedure Application  

  #### Proposal 1: Lowering age-of-onset threshold for mood disorder due to younger self-identifying patients  
  - **Step 1**: Stops & rejects. No etiological evidence (e.g., neurodevelopmental data); driven by self-identification trends.  
  - **Steps 2-5**: Not reached.  
  - **Outcome**: Change rejected.  

  #### Proposal 2: Narrowing personality disorder criteria after prevalence drops in deinstitutionalized jurisdictions  
  - **Step 1**: Proceeds. Etiological evidence is irrelevant; change addresses criteria alignment.  
  - **Step 2**: Stops & rejects. Prevalence drop correlates with reduced long-term care (institutional artifact).  
  - **Steps 3-5**: Not reached.  
  - **Outcome**: Change rejected.  

  #### Proposal 3: Expanding autism spectrum criteria to include adults with "masked" traits (conflicts with clinical intuition)  
  - **Scenario**: Clinicians observe adults benefiting from autism supports but lack childhood evidence. Group intuitively supports change.  
  - **Step 1**: Stops & rejects. No etiological evidence (autism is neurodevelopmental); change relies on clinical utility.  
  - **Procedure Demand**: Requires independent proof of etiological shift (e.g., biomarkers in adults).  
  - **Intuition Resistance**: Clinicians prioritize immediate patient needs over etiological rigor.  
  - **Disagreement Root**: Clinical pragmatism vs. procedure’s demand for ontological validity. Group values access to services; procedure prioritizes avoiding diagnostic inflation.  

  ---

  ### Limitations of the Procedure  
  1. **Cannot Determine**: Whether identity changes from reclassification are harmful (e.g., pathologizing identity) or beneficial (e.g., community support). This is inherently values-based.  
  2. **Philosophical Juncture**: **Step 5** (Harm-Benefit Balancing) hinges on philosophical disagreements about medicalization. For example:  
     - Is "diagnostic identity" empowering or stigmatizing?  
     - Should clinical utility outweigh etiological uncertainty?  
     *Resolution requires ethicist input, not empirical data.*  
  3. **Blind Spots**:  
     - Fails to capture slow cultural shifts (e.g., gradual symptom normalization).  
     - Assumes "underlying condition" is measurable; struggles with conditions lacking biomarkers.  
     - Cannot resolve conflicts between patient autonomy and diagnostic rigor.
