  Practical considerations: Adding a supplementary plaque feels right. It's reversible (preserves options for future generations), cheaper than replacement, and physically maintains the monument's role in gatherings. Time frame should allow for community consultation - say 6 months for research and wording. 

  Important nuance: The memo mustn't frame this as "truth vs emotion." Better to present it as adding historical layers - the 1904 plaque itself is now part of the city's story. Wording the correction respectfully is crucial; phrases like "as we now understand" avoid shaming past generations.

