answer: |-
  Here’s your Q&A prep sheet, prioritized by likelihood and impact. Target the core tensions in their frameworks while protecting your thesis’s spine. **Your must-land point: the 200-400ms temporal lag as evidence of post-hoc narrative stitching (weaken this, and the illusion claim wobbles).**

  ---

  ### **1. Enactivist Objection (Most Likely & Damaging)**  
  **How they’ll phrase it:**  
  *"You’re treating consciousness as passive misrepresentation inside a predictive box, but doesn’t embodied action *constitute* experience? If perception is for sensorimotor coupling, why would evolution build an illusion of ‘directness’?"*  

  **Short Reply:**  
  "Embodiment scaffolds the models, but the *feeling* of raw givenness is still a misattribution error. Action loops generate data, but the monitoring layer *interprets* that data as immediate. Illusionism explains the *phenomenal* claim, not the functional coupling."  

  **Concede Up Front:**  
  - Agree that cognition is action-oriented.  
  - Acknowledge that predictive models are shaped by embodied interaction.  

  **Weakness:**  
  Your reply risks sounding like you’re reducing embodiment to mere "data input" for the brain’s theater. Strengthen by citing **visuomotor adaptation studies** (e.g., delayed feedback creating illusory agency).  

  ---

  ### **2. Phenomenologist Objection (High Likelihood, High Damage)**  
  **How they’ll phrase it:**  
  *"You’re conflating the *content* of experience with its *givenness*. Even if models are inferential, the ‘appearing itself’—Husserl’s *Erlebnis*—is irreducible. How does misattribution explain the *presence* of pain’s rawness?"*  

  **Short Reply:**  
  "I’m not denying the *occurrence* of subjective states. I’m denying that their ‘rawness’ is an ontological property. The ‘presence’ *is* the false framing—like mistaking a hologram for a physical object."  

  **Concede Up Front:**  
  - First-person reports are data.  
  - Phenomenological descriptions are robust.  

  **Weakness:**  
  Phenomenologists will insist you’re changing the subject ("That’s not what ‘presence’ means!"). **Pivot hard to temporal smearing**: "If presence were direct, why can’t we report stimuli within 200ms without post-hoc stitching?"  

  ---

  ### **3. Predictive Processing Postdoc Objection (Likely, Technical Damage)**  
  **How they’ll phrase it:**  
  *"If the monitoring layer is just another predictive model, why call it an ‘error’? Precision weighting already explains ‘directness’—high-precision models *feel* less inferential. Isn’t this just rebranding?"*  

  **Short Reply:**  
  "Precision weighting modulates inference confidence; it doesn’t explain the *category error* of mistaking confidence for ontological immediacy. Illusionism targets why we *feel* inference has vanished."  

  **Concede Up Front:**  
  - Precision is central to the mechanism.  
  - The monitoring layer *is* predictive.  

  **Weakness:**  
  They might argue precision *constitutes* phenomenality (e.g., Hohwy’s "inference to reality"). **Counter**: "Even high-precision exteroception (e.g., vision) feels mediated in binocular rivalry—but not ‘what-it’s-like’."  

  ---

  ### **4. The "Secretly Dreaded" Pain Objection**  
  **How they’ll phrase it:**  
  *"When I burn my hand, the agony isn’t an ‘epistemic framing.’ It’s *world*-involving—I recoil *because* it hurts. If the pain-quale is an illusion, what’s the fire *actually* doing to my flesh-representation?"*  

  **Short Reply:**  
  "Pain is a multisensory *inference* about bodily damage. The ‘agony’ is the false appearance that this inference isn’t an inference. The fire causes tissue damage; the brain infers a ‘raw’ state—but raw *is the illusion*."  

  **Damage Control:**  
  - **Concede**: Affective valence is evolutionarily crucial.  
  - **Weaponize data**: Cite placebo analgesia/anesthesia awareness cases where pain intensity dissociates from tissue damage.  
  - **Weakness**: Struggles to explain why the illusion *feels* so affectively charged. Prep a bridge: "Illusions can be motivationally potent—see *rubber hand illusion* with threat."  

  ---

  ### **Q&A Survival Strategy**  
  1. **Anchor to your evidence**: When pressed, return to **split-attention (e.g., attentional blink)** and **temporal delays**. Say: "If consciousness were direct, these effects wouldn’t exist."  
  2. **Define "illusion" narrowly**: Emphasize it’s *only* about the false sense of unmediation.  
  3. **Pre-empt "hard problem" redux**: Open with: "I’m not solving the hard problem; I’m denying its premise."  
  4. **Kill the "But why?" question**: Have ready: "Evolution doesn’t ‘need’ the illusion; it’s a side-effect of metacognition optimizing speed-to-report."  

  **Final Tip**: If the postdoc attacks first-person methods, agree—then note your theory *uses their objection*: "If introspection is noisy, why trust it about phenomenality’s nature?"  

  ---  
  **You’ve got this.** Your thesis is provocatively tidy. Make them attack the evidence, not the poetry. When in doubt: "The data show consciousness is *postdictive*. Why call that ‘direct’?"
