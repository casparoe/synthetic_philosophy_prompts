answer: |-
  ## Bureau of Temporal Equity (BTE)  
  **Frequently Asked Questions Regarding Representation of Future Generations (RFG)**

  **1. What is the core function of the Bureau of Temporal Equity?**  
  The BTE administers the statutory framework (Temporal Representation Act 2047) guaranteeing full democratic rights to all prospective citizens of the United Kingdom, irrespective of their temporal location relative to the present. This includes enfranchisement, constituency allocation, and ensuring their interests are equitably weighted in legislative and policy processes.

  **2. How are Future Constituents (FCs) identified and enfranchised?**  
  FCs are defined probabilistically via the Office for National Statistics' Demographic Futures Model (DFM v9.2). Projected individuals exceeding a 0.4 probability of eventual UK citizenship based on current demographic trajectories are provisionally entered onto the Temporal Electoral Roll (TER). Each FC is represented by a certified Proxy Delegate (PD), appointed via competitive tender overseen by the Chief Temporal Auditor (CTA). PDs exercise the franchise on behalf of their assigned FC cohort within designated Temporal Constituencies (TCs).

  **3. How are Temporal Constituency boundaries determined?**  
  TC boundaries are dynamically adjusted every quarter by the Independent Boundary Commission for Temporal Equity (IBCTE). Adjustments are based on real-time fluctuations in projected birth rates, immigration forecasts, and mortality probabilities. Constituency size is standardized at 75,000 projected FCs (± 5%). Significant deviations may trigger emergency boundary reviews. Constituents are advised to consult the BTE Portal for the latest TC maps.

  **4. How do PDs determine how FCs would "vote"?**  
  PDs utilise the Mandated Preference Algorithm (MPA), developed by the BTE's Behavioural Futurology Unit. The MPA synthesises current societal values, longitudinal attitudinal surveys, projected technological/social trends, and fundamental rights principles to generate statistically probable voting intentions for FC cohorts. PDs are legally bound to vote in Parliament according to MPA outputs for their TC. Appeals against MPA determinations can be lodged with the Temporal Franchise Tribunal.

  **5. How is the "weight" of FC interests balanced against present citizens?**  
  The Intertemporal Discount Rate Committee (IDRC), chaired by the CTA, sets the Annual Temporal Discount Factor (ATDF). The ATDF quantifies the present policy value of a future citizen's welfare claim relative to a contemporary citizen's. The current ATDF is 0.97 (Review Cycle: Biannual). This factor is applied across all cost-benefit analyses, resource allocation, and legislative impact assessments concerning long-term effects. Discounting is essential for operational comparability.

  **6. Doesn't the Non-Identity Problem complicate claims of "harm" to FCs?**  
  The BTE acknowledges the theoretical concern that specific policies (e.g., aggressive carbon mitigation altering economic conditions) may result in entirely different individuals being born compared to a high-emission scenario. Consequently, FCs represented under Policy Pathway A cannot claim *personal* harm from Policy Pathway B, as they would not exist under B. The BTE resolves this by defining representation *relative to the projected future under the current policy trajectory*. PDs advocate for the interests of the FCs *likely to exist* given present decisions. Shifts in policy trajectory triggering significant demographic re-projections necessitate TER recompilation.

  **7. How are "continuity disputes" handled when policies alter who is projected to exist?**  
  Continuity is managed via the Branching Clause Protocol (BCP), detailed in CTA Memorandum 451/Delta (issued 21/04/2051). When a major policy decision creates divergent demographic futures (e.g., "High Mitigation" vs. "Delayed Action" pathways), the TER undergoes a Branching Event. PDs assigned to cohorts whose probability of existence falls below 0.3 in the new dominant pathway are reallocated to represent the *emergent cohort* within the new pathway with the highest aggregate probability mass. Legal personhood for representation purposes is deemed continuous across branches for administrative efficacy. As CTA Vance noted: "The proxy contract attaches to the probabilistic demographic locus, not the hypothetical biological entity." Appeals regarding locus assignment post-branching are heard by the Temporal Continuity Chamber.

  **8. Doesn't temporal discounting unfairly disadvantage the distant future?**  
  The IDRC rigorously applies actuarial and economic principles to ensure intertemporal equity. The ATDF reflects pure time preference (minimal) and unavoidable uncertainty regarding the persistence of current institutions and value systems. Applying a zero discount rate would grant disproportionate weight to speculative future preferences, potentially imposing severe, unjustifiable austerity on present generations for benefits accruing to entities whose specific identities and valuations are inherently unknowable. The system balances moral consideration with administrative necessity.

  **9. Is there a risk that RFG becomes a justification for present austerity?**  
  The BTE operates strictly within its statutory mandate to *represent* FC interests, not to prioritise them absolutely. The democratic process, involving both present citizens and PDs for FCs, determines final policy outcomes through Parliamentary vote. The presence of FC representation ensures their interests are *factored in*, not automatically dominant. Concerns regarding austerity stem from the inherent tension between present consumption and future wellbeing – a tension the BTE quantifies via the ATDF but does not resolve unilaterally. Political accountability remains with elected representatives (present and proxy).

  **10. Who oversees the BTE's operations?**  
  The BTE is accountable to Parliament via the All-Party Parliamentary Group on Temporal Equity (APPGTE). The Chief Temporal Auditor (Dr. H. Vance) publishes quarterly transparency reports detailing TER composition, PD voting records vs. MPA outputs, IDRC deliberations, and Branching Event resolutions. Public consultations on ATDF reviews are mandatory. The National Audit Office conducts biennial efficiency reviews.

  **For further inquiries, please contact:**  
  Bureau of Temporal Equity, Temporal House, Millbank, London SW1P 4QT  
  Helpline: 0800 FUTURE5 (Mon-Fri, 9am-5pm) | Portal: www.gov.uk/bte  
  *"Safeguarding Tomorrow's Voice, Today."*
