prompt: |-
  i was chatting with a friend about that philosphy problem where you can technically have a reason for something but it's the wrong "kind" — like bribing yourself to think a painting is beautiful, or being moral just because you'll get caught otherwise. she said it feels like there's an invisible filter on motives that nobody can quite explain but everyone gets mad if you break, and we started joking about what it would look like if the goverment actually tried to audit people's reasons the way they audit taxes.

  anyway, i want you to write a satirical deadpan memo, about 650 words, formatted like an internal bureaucratic document from a fictional "Bureau of Axiological Hygiene." the voice should be a tired mid-level bureaucrat announcing a pilot program where citizens must file all reasons for belief and desire through an audit system, with numbered clauses, form templates, and rejection codes. the satire should come from actually getting the philosophical distinction right — right-kind vs wrong-kind reasons, the bootstrapping worry where you try to want-to-want something for its own sake, whether second-order reflection can "convert" a bad reason into a good one — but pushed into absurd administrative detail. include an invented case study of "Citizen M" who gets flagged for admiring a symphony because it improves her job prospects, then files Form 27-B to reflectively endorse her admiration, but gets rejected again for "meta-instrumentality." don't name real philosophers or use real quotes; just write from what you know. keep it readable for someone who doesn't know the jargon, but make sure a specialist sees you got the distinction right. no citations or reading lists needed, this is just creative writing. maybe throw in a typo or two since i'm writing this casually.
reasoning: |-
  Okay, the user wants a satirical memo from a fictional "Bureau of Axiological Hygiene" that humorously applies philosophical concepts about right vs. wrong kinds of reasons to a bureaucratic audit system. They specifically mentioned wanting deadpan delivery, absurd administrative details, and a case study about "Citizen M" getting rejected for "meta-instrumentality." 

  Hmm, this is actually a brilliant request because it marries two things philosophers secretly love: 1) torturing the reason/want distinction until it confesses, and 2) imagining Kafkaesque nightmares about paperwork. The challenge is making the philosophy accurate enough that a specialist would nod grimly while keeping it accessible. 

  First, gotta nail the bureaucratic voice—think of the most exhausted DMV clerk who’s read too much Frankfurt School. The memo should smell faintly of toner and existential dread. Key elements they requested:
  - Pilot program for auditing "reasons for belief/desire"
  - Numbered clauses (make them sound plausibly bureaucratic)
  - Form templates (Form 27-B is mandatory per their ask)
  - Rejection codes (with darkly funny names like "CR-7: Bootstrapping Violation")
  - Citizen M case study (admires symphony for job prospects → gets rejected twice)

  Philosophical hooks to weave in subtly:
  - Wrong-kind-of-reason problem: bribing yourself to like art ≠ actually liking art
  - Bootstrapping failure: you can’t force "wanting to want" something intrinsically by trying hard
  - Meta-instrumentality: when even your "correction" is still transactional ("I’ll reflect so I get promoted!")

  …And the typo! Mustn’t forget a bureaucratic typo. Maybe "instrinsic" instead of "intrinsic" in some soul-crushing footnote. 

  Structure idea:
  - Header: Fake bureau letterhead (adds verisimilitude)
  - Subject line: Maximum bureaucratic dread ("Mandatory Compliance" etc.)
  - Body: 
    1. Deadpan rationale ("axiological drift" threatening society)
    2. Procedure outline (Forms 5, 27-B, rejection codes)
    3. Citizen M saga as cautionary tale
    4. Passive-aggressive sign-off (Deputy Undersecretary of Motivational Compliance)

  The satire works best if the bureau *correctly* identifies philosophical errors while being utterly deranged for enforcing them. Like slapping a fine on someone for "impermissible recursive instrumentalization." 

  Final touch: The case study’s second rejection ("meta-instrumentality") should mirror real debates about whether reflective endorsement can "purify" bad reasons. (Spoiler: nope, not if you’re still doing it for rewards.) 

  …And done. Time to make bureaucracy weep.
