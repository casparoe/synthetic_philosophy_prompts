  ## Opening Remarks: "One Mind or Two? Split-Brain Cases and the Boundaries of Consciousness"

  **(Approx. 4 minutes spoken)**

  Alright, good morning everyone! Seriously, *welcome*. It’s fantastic to see this room buzzing. Neuroscientists, art historians… a combination that probably feels a bit like *your* brain is split this morning! But that’s precisely why we’re here – to find out if that feeling is more than just a metaphor.

  Now, usually, when someone says "Welcome, we're all here together," we don't blink. We assume that "we" is a single, unified group of conscious observers. But… what if that assumption is the *very thing* we need to question today? What if our sense of unity – right here, right now, and especially across the span of our lives – is less an unshakeable reality and more like… a really convincing story we tell ourselves *after the fact*?

  The classic puzzle we dive into with split-brain patients is stark: **One mind or two?** When the connection between the hemispheres is severed, and the left hand acts independently of what the right hand is doing, or the right hemisphere knows things the speaking left hemisphere denies... it forces us to confront the boundaries of a single self. The neuroscientists here know the intricate dance of these experiments intimately – the flashes of light, the hidden commands, the baffling contradictions in behaviour. The art historians? You understand narratives, symbols, the power of representation – how meaning is constructed and sometimes *imposed*.

  Traditionally, the debate digs trenches: Team "One Mind" argues the patient remains fundamentally unified, perhaps with one hemisphere dominant. Team "Two Minds" sees evidence of two distinct streams of consciousness sharing a skull.

  **But I want to propose a third way that’s… well, weirder.** What if it's not just about dominance or separation? What if the *story* of unity is actively manufactured? What if the left hemisphere, our linguistic narrator, isn't just the loudest voice, but the compulsive *editor*? Not merely reporting the news, but rewriting the history books in real-time, stitching together a coherent autobiography moment-by-moment?

  Think of it like this: Instead of a single monarch ruling a unified kingdom (One Mind), or two warring factions (Two Minds), imagine a **"Serial Monogamy of the Self."** The left hemisphere commits fiercely to *one* narrative of "what just happened" and "who I am" at any given instant. But crucially, it edits the past to fit the present. That feeling of seamless continuity? That might be retrospective revisionism. The sense that "I" decided something? It might be the left brain concocting a plausible reason *after* an action initiated elsewhere. Unity isn't the starting point; it's the constantly updated *output*.

  This flips the script. It asks: **Is the unity we experience – in split-brain patients, and perhaps in all of us – less a fundamental state and more a *product*?** A narrative achievement, constantly under construction? For the neuroscientists, this challenges how we interpret behavioural data – is that patient's denial of the left hand's action just hemispheric separation, or is it active narrative suppression? For the art historians, this echoes ideas of palimpsests, pentimenti, or the way meaning is layered, erased, and reinterpreted over time in a painting or sculpture. The self becomes less a fixed portrait and more a constantly reworked canvas.

  So, why does this matter? Because it pulls the rug out from under our most basic intuitions about ourselves. If unity is retrospective editing, then our cherished sense of a continuous, rational "I" driving the ship looks… different. Fragile. Constructed. Fascinatingly messy.

  **That’s the tension I hope we wrestle with today:** If unity is made, not found, what does that mean for consciousness? For responsibility? For the very idea of the self? Our workshop title asks "One Mind or Two?" But maybe the most profound question lurking beneath is: **"Is 'One Mind' itself just a story we can't stop telling?"**

  Neuroscientists, your rigor and data are vital. Art historians, your sensitivity to narrative, symbol, and constructed meaning is crucial. Together, you’re uniquely positioned to dissect this strange, beautiful, and possibly illusory tapestry we call consciousness. Let’s embrace the weirdness, challenge the assumptions – including that comfortable "we" I started with – and see where the contradictions lead us. Have a fantastic, mind-bending workshop!
