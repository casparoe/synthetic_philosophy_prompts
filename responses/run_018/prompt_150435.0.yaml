  The user's explicit needs are clear: build a coherent argument in American English, no bibliographies, focus on reasoning. But deeper, they might be seeking validation of their stance against their friend's skepticism, or a way to resolve the debate without conceding to hard determinism. They could also want intellectual ammunition for future discussions, showing that morality isn't undermined by determinism.

  Now, structuring the argument. Start by setting up the problem: free will skepticism challenges retributivism. Then, introduce Dennett's compatibilism—moral competence as a skill. Next, pivot to the dynamic model: desert as societal trust, not a binary property. Explain how it's diachronic, with desert shifting as capacities change. Finally, counter Caruso by arguing quarantine misses the point of normative practices.

  I should emphasize the societal aspect. Punishment isn't about cosmic payback but maintaining a system where people are held accountable based on their role in the community. Use examples like addiction or rehabilitation to show desert adapts—e.g., a recovering addict regains trust. This addresses the friend's diachronic point while keeping desert grounded.

  Avoid listing philosophers; weave ideas naturally. Use plain American English: no jargon overload. Make sure the logic flows: from skepticism to Dennett's response, to the trust model, to diachronic changes, and why Caruso's model falls short.

  Also, address potential holes. If desert is societal, isn't it arbitrary? Counter: it's not subjective; it's based on observable capacities and social needs. If capacities change, desert changes because the agent's role in the system changes. That ties back to the normative practice being alive and responsive.

  Finally, reinforce that this preserves the essence of desert—blame and praise make sense in context—without needing libertarian free will. It makes responsibility practical and humane, which might appeal to the user's frustration with three hours of debate.
answer: |-
  Here’s the argument, building on Dennett’s core insight but framing it dynamically through the lens of calibrated societal trust and diachronic agency:

  **The Core Problem:** Your friend is right that if "desert" requires a magical, contra-causal free will (libertarianism), then Caruso’s quarantine model (treating harmful people like diseased vectors needing containment) makes sense under determinism. Retributive "payback" *does* collapse metaphysically. The challenge is: can desert survive *without* that magic?

  **Dennett’s Foundation (Refined):** Dennett shows that libertarian free will isn't necessary for robust responsibility. What matters is **moral competence** – the *real-world capacity* to perceive reasons, deliberate, align intentions with actions, and respond to social/moral norms. This isn't an all-or-nothing "soul property"; it's a *skill* cultivated through biology, learning, and social interaction. Determinism doesn't erase this competence; it explains how it develops. A lion isn't morally responsible for killing, not because of determinism, but because it lacks the specific cognitive toolkit for moral reasoning humans develop.

  **Shifting to Calibrated Societal Trust:** Where we go beyond simple compatibilism is treating responsibility not as a *static metaphysical status* ("has free will: yes/no"), but as a **dynamic, socially maintained relationship of calibrated trust**. Societies operate complex normative systems (law, morality, promises, contracts). These systems *depend* on participants having and demonstrating stable moral competence. We constantly assess each other:

  *   **Calibration:** We observe behavior over time. Does someone reliably recognize reasons? Do they respond to praise/blame? Do they correct mistakes? Can they explain their intentions? This ongoing assessment calibrates our level of "normative trust" in them.
  *   **Trust & Desert:** "Desert" (praise/blame/punishment/reward) emerges *from* this calibrated trust relationship within the normative system.
      *   **Praise/Trust:** When someone consistently demonstrates competence (e.g., keeps promises, acts fairly), we *trust* them as reliable normative participants. Rewarding/praising them isn't paying a cosmic debt; it *reinforces* the trustworthy behavior and signals its value to the system.
      *   **Blame/Distrust:** When someone violates norms *while demonstrating competence*, it signals a failure within the trust relationship. They *knew better, could have done otherwise* given their capacities. Blame/punishment isn't metaphysical vengeance; it’s a **corrective signal within the normative system**. It communicates: "Your action, given your recognized competence, damaged the trust essential for our shared practice. This response aims to restore alignment (through deterrence, rehabilitation, or simply reaffirming the norm's importance)."
  *   **Why it Survives Skepticism:** This doesn't require contra-causal freedom. It requires observable, functional competence *within* a deterministic world. We hold competent agents responsible *because* the normative system collapses without recognizing reliable and unreliable actors. Desert is the *currency* of maintaining that system's integrity.

  **Addressing the Diachronic Twist (Changes in Capacity):** This is where your friend's intuition becomes crucial, and the dynamic model shines. Competence *isn't* static. Addiction, brain injury, trauma, profound growth, or long-term learning can genuinely alter an agent's capacities.

  *   **The Key:** Desert shifts *because* the level of normative trust we can reasonably place in the agent, based on their *current, observable competence*, shifts.
      *   **Loss of Competence (e.g., Severe Dementia, Psychotic Break):** The agent no longer demonstrates the capacity to understand reasons or norms. Our calibrated trust plummets. Retributive blame *loses its meaning* because the corrective signal can't be received or acted upon. Containment (like Caruso’s quarantine) *might* be necessary for safety, but it's not "deserved punishment" because the normative trust relationship based on competence is broken. We treat them differently *because* they are no longer reliable participants in the normative practice.
      *   **Diminished Competence (e.g., Active Addiction, Certain Brain Injuries):** Their capacity to consistently perceive reasons or control impulses is impaired. Our trust is *conditionally calibrated*. Punishment focused purely on retribution ("payback") is inappropriate. Responses must account for the diminished capacity – prioritizing rehabilitation, support, or harm reduction *to the extent possible*. They might still "deserve" *some* consequence (e.g., restriction to prevent harm), but its nature and severity are adjusted *because* the competence underlying the normative trust is fractured. It's about managing a damaged trust relationship.
      *   **Restored/New Competence (e.g., Rehabilitation, Recovery from Injury, Moral Growth):** As an agent demonstrably regains or develops stable moral competence, our calibrated trust *rebuilds*. They demonstrate responsiveness to norms and reasons. Therefore, they become appropriate subjects of full normative engagement again, including praise for good acts and blame/punishment for bad ones *based on their restored capacity*. The parole board doesn't just release someone because "time was served"; it assesses if their competence (and thus, the basis for normative trust) is demonstrably restored.

  **Why Caruso Misses the Point:** Caruso's quarantine model reduces the response to harm to *only* risk management and (maybe) rehabilitation. It throws out the baby (normative desert) with the bathwater (libertarian free will). It ignores that functional societies *need* the concept of desert tied to competence to:

  1.  **Distinguish Harm:** A hurricane causes harm, but we don't *blame* it. We blame the competent agent *because* their action, within the normative system, represents a breach of trust we rely on.
  2.  **Sustain Norms:** Blame/punishment directed at competent actors *reinforces the norms themselves*, signaling their importance to the community and the untrustworthy agent.
  3.  **Recognize Agency Gradients:** Not all harmful actors are equal. The model of calibrated trust allows us to tailor our responses *precisely* to the level of competence an agent *currently* exhibits (the diachronic element), preserving the core idea that *responsibility tracks agency*, but without requiring impossible metaphysics. Quarantine treats everyone like a dangerous object; the trust model treats them as agents with varying, changeable capacities interacting within a shared normative space.

  **Conclusion:** Dennett is fundamentally right. Desert survives free will skepticism not as cosmic payback, but as an essential feature of maintaining a shared normative world. It's about **calibrated societal trust** based on the observable, functional **moral competence** agents demonstrate over time. This competence is a real, deterministic skill, not magic. Crucially, this model *embraces* the diachronic nature your friend mentioned: what an agent "deserves" shifts dynamically as their capacities (and thus, the level of normative trust they warrant) genuinely change. Punishing someone with severe dementia like a calculating criminal doesn't maintain normative integrity; it perverts it. Desert isn't a fixed debt owed to the universe; it's the appropriate response within a living, breathing system of mutual expectations, calibrated to the agent's current role and capabilities within that system.
