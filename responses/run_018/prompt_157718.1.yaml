prompt: |-
  You are an expert in moral philosophy and intertemporal decision theory. Think step-by-step: first restate the position I describe precisely, then systematically map its exposure.

  I hold that pure time preference—discounting future welfare solely because it occurs later—is ethically arbitrary, structurally parallel to spatial discrimination that ethics already rejects. The standard objections (personal-identity arguments about future selves, rational-consistency arguments about exponential discounting) do not settle the matter for me, because they miss a deeper tension. Rejecting pure discounting seems to force what I will call temporal cosmopolitanism: treating obligations to people in 2124 as structurally identical to obligations to people 10,000 miles away. That conflicts with an intuition I want to preserve, namely that institutional proximity—governability, feedback loops, shared mechanisms—can legitimately weaken obligations without being mere time preference. At the same time, I want to distinguish this from discounting via value drift: the claim that future generations may come to hold values genuinely incommensurable with ours, which could justify lower present investment without collapsing into pure time preference, but only if it remains empirically tractable rather than a blanket excuse.

  What would genuinely count against this combined view? I want more than the familiar repertoire. Which formal results—in social-choice theory, growth economics, or decision theory—would show that temporal cosmopolitanism is either unavoidable or avoidable without smuggling in hidden discounting? Which empirical findings about actual long-run value change, or about institutional transmission across centuries, would make value-drift arguments live versus unfalsifiable? Which conceptual collapses should worry me—say, if institutional proximity reduces to contingent preference, or if value-drift reasoning applies symmetrically to spatially distant cultures? Rank the defeaters from fatal to merely awkward. Say which ones a committed defender of this view should concede as damaging, and which they should dismiss. Finally, assess whether the position has been qualified into unfalsifiability—if so, is that insulation a defect for a view of this kind?

  Be precise, avoid bibliographic recommendations or citation lists, and do not invoke obscure named theories that require external lookup.
reasoning: |-
  Okay, the user is presenting a nuanced ethical position combining moral philosophy and intertemporal decision theory. They reject pure time preference as ethically arbitrary but struggle with its implications. They've coined "temporal cosmopolitanism" - the idea that obligations to future people (like those in 2124) should be treated identically to obligations to distant people today. But they want to preserve space for "institutional proximity" (governability, feedback loops) as a legitimate reason to weaken obligations without resorting to time discounting. They also introduce "value drift" - that future value changes might justify less investment, if empirically verifiable.

  The user explicitly asks for non-standard objections, specifically requesting:
  - Formal results from social choice theory/growth economics/decision theory that might force or avoid temporal cosmopolitanism
  - Empirical findings about long-term value change or institutional transmission
  - Conceptual collapses (like institutional proximity reducing to preference, or value drift applying symmetrically to spatial distance)
  - Ranking of defeaters from fatal to awkward
  - Assessment of whether the position becomes unfalsifiable

  The user appears highly sophisticated - likely an academic philosopher or economist given the precise terminology and rejection of "familiar repertoire" objections. Their underlying tension seems to be between theoretical consistency (rejecting pure discounting) and practical intuitions (preserving differential obligations). The unspoken need might be for intellectual honesty tools: ways to pressure-test their own view without collapsing it.

  Key challenges to address systematically:
  1) Formal results: Arrow's impossibility theorem showing no "fair" intertemporal aggregation exists? Or hyperbolic discounting models demonstrating time-inconsistency even without pure preference?
  2) Empirical hurdles: Can we ever reliably predict value drift 100+ years out? Historical examples like slavery abolition showing values can stabilize rather than drift
  3) Conceptual risks: If institutional proximity matters, doesn't that similarly weaken obligations to isolated present-day communities? And if value drift justifies less concern for futures, why not for distant cultures with different values?
  4) Unfalsifiability trap: The "empirical tractability" escape clause risks making the view bulletproof - if value drift predictions fail, defenders can always claim they weren't properly measured

  The most damning points will likely be the symmetry challenges (why temporal but not spatial?) and the operational emptiness of "institutional proximity" - if it's not reducible to preferences or pure discounting, what positive criteria define it? The value-drift argument's vulnerability to empirical vacuity also seems serious. Less fatal but awkward is how growth models with high intergenerational equity requirements might produce absurd savings rates in practice.
answer: |-
  Here’s a precise restatement of your position followed by a systematic exposure to challenges, ranked by severity:

  **Restated Position:**  
  1. **Core Ethical Claim:** Pure time preference (discounting future welfare *solely* due to temporal distance) is ethically arbitrary and analogous to unjust spatial discrimination.  
  2. **Unresolved Tension:** Rejecting pure discounting implies *temporal cosmopolitanism* (equal moral weight to all times, like distant places), but this clashes with the intuition that *institutional proximity* (governability, shared feedback mechanisms) legitimately weakens obligations without collapsing into pure time preference.  
  3. **Proposed Distinction:** *Value drift* (future values becoming genuinely incommensurable with present values) could justify reduced present investment, but only if empirically verifiable—not as a blanket excuse.  

  ---

  **Systematic Exposure to Challenges:**  
  *(Ranked: Fatal → Damaging → Awkward)*  

  **I. Fatal Defeaters (Undermine Core Structure)**  
  1. **Formal Impossibility of Non-Discounted Intertemporal Choice:**  
     - **Challenge:** Social choice theory (e.g., extensions of Arrow’s theorem to infinite time horizons) shows that no aggregation rule satisfies *all* of: (a) temporal impartiality, (b) Pareto efficiency, (c) finite sensitivity to changes, and (d) non-dictatorship. Temporal cosmopolitanism *requires* (a), but violates (c) or (d), forcing trade-offs indistinguishable from hidden discounting.  
     - **Why fatal?** Demonstrates that avoiding pure discounting mathematically necessitates violations of rationality or fairness, collapsing the distinction between "legitimate" weakening and pure time preference.  
     - **Response:** A defender must concede this as damaging but could argue these theorems assume unrealistic continuity in value comparisons.  

  2. **Value Drift as a Trojan Horse for Pure Discounting:**  
     - **Challenge:** If value drift is defined by *incommensurability*, no empirical test can confirm it without imposing present values (making it unfalsifiable). If defined by *measurable difference*, it reduces to discounting via preference shifts—structurally identical to discounting welfare.  
     - **Why fatal?** Erodes the distinction between "empirically tractable value drift" and pure discounting. Any operational metric for value drift (e.g., changing willingness-to-pay) implicitly discounts future welfare.  
     - **Response:** A committed defender must concede this forces refinement: value drift must be restricted to *existential* incommensurability (e.g., future beings valuing things inconceivable today).  

  **II. Damaging Defeaters (Force Major Concessions)**  
  3. **Institutional Proximity Reduces to Contingent Power:**  
     - **Challenge:** "Governability" and "feedback loops" are functions of technological/political capacity, not ethics. If obligations weaken with institutional distance, this privileges powerful present agents over powerless ones (e.g., failing states), mirroring spatial discrimination.  
     - **Why damaging?** Reveals institutional proximity as contingent preference disguised as moral relevance. Defenders must either abandon the intuition or admit it privileges present interests.  
     - **Response:** Defender should concede this weakens the "legitimacy" claim but could argue feedback mechanisms enable *effective* altruism, not weaker obligations.  

  4. **Symmetry with Spatial Discrimination:**  
     - **Challenge:** If value drift justifies weaker obligations to the future, it equally applies to spatially distant cultures with incommensurable values today (e.g., uncontacted tribes). Rejecting this symmetry accepts spatial discrimination.  
     - **Why damaging?** Forces choice: either embrace spatial discrimination (contradicting core ethics) or abandon value drift as a justifier.  
     - **Response:** Defender should dismiss this by arguing temporal drift is uniquely *epistemically opaque* (we can study distant cultures but not future ones).  

  **III. Awkward Defeaters (Expose Practical Tensions)**  
  5. **Growth Economics and Dynamic Inconsistency:**  
     - **Challenge:** Optimal growth models (e.g., Ramsey-Koopmans) show that even minimal pure discounting (e.g., δ≈0) is needed to avoid requiring 100% savings rates. *Institutional proximity* arguments may replicate this by prioritizing governable investments, functionally acting as δ>0.  
     - **Why awkward?** Highlights that rejecting pure discounting demands heroic sacrifice unless institutional proximity provides cover.  
     - **Response:** Defender should concede this but argue institutional proximity targets *feasibility*, not moral weight.  

  6. **Empirical Vacancy of Value Drift:**  
     - **Challenge:** Historical data shows core values (e.g., avoiding mass suffering) exhibit high stability, while peripheral preferences drift. If "drift" only applies to peripheral values, it cannot justify reducing core obligations (e.g., climate action).  
     - **Why awkward?** Makes value drift empirically irrelevant for major intergenerational issues.  
     - **Response:** Defender should concede drift is limited but insist existential risks (e.g., AI value alignment) qualify.  

  ---

  **Unfalsifiability Assessment:**  
  - **Risk:** The "empirical tractability" clause *insulates* value drift. Failed predictions can be dismissed as poor measurement, not theory failure.  
  - **Defect Severity:** High. For a view grounded in rejecting arbitrariness, this creates a *privileged exception* for temporal discounting disguised as epistemic caution.  
  - **Mitigation:** The position avoids *total* unfalsifiability by requiring empirical evidence for drift. However, defenders must accept that if no drift is ever verified, the exception evaporates.  

  **Conclusion for the Defender:**  
  - **Concede:** The social choice impossibility theorems and value drift’s affinity with discounting are damaging. Institutional proximity arguments risk reducing to power dynamics.  
  - **Dismiss:** Symmetry with spatial discrimination (due to epistemic asymmetry) and growth-model objections (irrelevant to moral weight).  
  - **Refine:** Narrow value drift to *radical, inconceivable* shifts and recast institutional proximity as a constraint on *effectiveness*, not obligation.  
  - **Verdict:** The position is *fragile but tenable* if institutional proximity is strictly divorced from moral weight and value drift is treated as a rare, high-evidence threshold. Its insulation is a defect but not fatal if held to strict empirical standards.
