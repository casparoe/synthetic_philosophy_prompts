prompt: |-
  Hey, I'm a retired physicist who only started reading philosophy seriously after I left the lab. Lately I've been stuck on Augustine's On Lying—specifically, he lists different kinds of lies and ranks them from worst to least bad, but then insists every one is still a sin. Most scholars either say he's just an absolutist and ignore the ranking, or they try to make him into a secret consequentialist. I think both miss the point. I want to write a one-page proposal for a small humanities grant—maybe three months, working alone, no travel—asking whether his distinction between lying with words and lying in the heart actually does philosophical work, or whether it's just rhetorical cover so he can keep the prohibition absolute. The idea is to map his taxonomy closely, then check if the heart criterion (the will to deceive) can ever come apart from the word criterion, and whether that separation explains the ranking without turning Augustine into a utilitarian. Existing answers leave this open because they treat the ranking as either decoration or hidden calculus; nobody has tried to see if it's a genuine internal distinction. My aproach: close reading of the standard translations, comparing the internal logic to speech-act distinctions I know from philosophy of science, and building a clear map with a verdict. The deliverable should be a taxonomy plus an argument about whether benevolent omission fits inside the framework. The project fails if the word/heart distinction collapses in every case he discusses. No need for citations or a literature review by name—I'll fill in referances myself. Can you turn this into a proper proposal with the question, why it's open, the method, possible conclusions, and an honest scope check?
