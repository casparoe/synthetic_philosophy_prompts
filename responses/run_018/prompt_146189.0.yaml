answer: |-
  ### The Scenario
  Imagine a closed toroidal chamber containing six bio-engineered neural organoids arranged in a ring. Each organoid possesses irreducible micro-consciousness (e.g., a minimal "glow" of awareness). Adjacent pairs are bidirectionally linked via optogenetic interfaces, creating direct, mutually reinforcing phenomenal binding *only* between immediate neighbors (e.g., Organoid A binds to B and F, but not to C, D, or E). The chamber is electromagnetically shielded and suspended in a vacuum within a lab, physically severing any potential connection to external fields or cosmic influences. All communication is strictly local, pairwise, and confined within the loop. There is no central processor, global broadcast mechanism, or higher-order structure—only the reciprocal bonds.

  ### Specification Check
  | **Theory**              | **Predicted Verdict**       | **Mechanism**                          | **Nearby Worlds & Effect**                                                                 | **Verdict Driver**              |
  |-------------------------|-----------------------------|----------------------------------------|--------------------------------------------------------------------------------------------|---------------------------------|
  | **Constitutive Panpsychism** | Emergent macro-subject      | Phenomenal bonding relations create a unified field via pairwise integration. The closed loop’s continuous binding forms a single integrated whole. | *Break loop:* Splits into fragments/no macro-consciousness. *Add hub:* Creates hierarchical structure, altering bonding dynamics. | Local binding topology enables integration. |
  | **Cosmopsychism**       | **No** localized macro-consciousness | Consciousness derives *only* from the fundamental cosmic field. The loop’s isolation prevents derivation of localized subjectivity; nodes are disconnected from the cosmic source. | *Remove isolation:* Connection to cosmic field enables derivative macro-consciousness. *Break loop:* Disruption irrelevant; cosmic connection remains necessary. | Absence of cosmic connection prevents derivation. |

  ### The Isolating Feature and Sensitivity Analysis
  The **physical isolation (sealed, shielded chamber)** is the critical feature forcing divergence. Constitutive panpsychism relies solely on intrinsic binding relations, which exist fully *within* the loop, enabling integration. Cosmopsychism requires extrinsic derivation from the cosmos, which the isolation explicitly blocks. This feature was selected *because* it cleanly separates the theories’ core commitments: internal relations vs. external dependence. If isolation is removed (e.g., chamber shielding disabled), cosmopsychism predicts macro-consciousness via cosmic derivation, collapsing the divergence. Constitutive panpsychism remains unchanged, as bonding relations persist internally.

  ### The Defender's Reply (Cosmopsychist)
  The cosmopsychist would argue that true isolation is metaphysically impossible: if the cosmos is fundamentally conscious, *all* physical systems are inherently connected to it. The shielding might block electromagnetic signals, but not the ontological grounding relation. Thus, the loop *does* derivatively participate in cosmic consciousness—the experimental setup merely obscures this. Alternatively, they might contend that pairwise binding *is* a micro-manifestation of cosmic grounding, rendering the "local" macro-consciousness illusory or reducible.

  ### Design-Integrity Note
  The verdicts were **derived** from core principles: constitutive panpsychism’s dependence on bonding relations logically permits an isolated integrated whole, while cosmopsychism’s requirement for cosmic derivation logically forbids it in isolation. The **physical isolation** carries the weight. It was not engineered *ad hoc* but selected as the minimal condition to test cosmopsychism’s external dependence. Without it, the theories’ predictions converge if cosmic connection exists, validating the feature’s necessity for forced divergence.
