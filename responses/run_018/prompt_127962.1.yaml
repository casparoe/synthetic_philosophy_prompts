  Oh! They asked explicitly about cases where categories contracted. Besides hysteria, there's "homosexuality" delisted from DSM, or "Asperger's" folded into autism spectrum—though the latter feels more like rebranding than real contraction. Should warn them that "contraction" often masks power struggles (e.g., insurance companies tightening criteria to save costs ≠ scientific correction). 

