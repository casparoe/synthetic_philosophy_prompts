prompt: |-
  so i just spent like three hours arguing with my friend Dana about goodman's grue thing and we got nowhere, and i want an outside referee, sort of. her opening move was that goodman gets way too much credit because hume already said the whole thing in 1748. she had this passage from section IV of the Enquiry Concerning Human Understanding (not the "future will resemble the past" bit, the other one):

  "we always presume, when we see like sensible qualities, that they have like secret powers ... why this experience should be extended to future times, and to other objects, which for aught we know, may be only in appearance similar; this is the main question on which I would insist."

  her claim: the "only in appearance similar" part IS the grue problem, because grue-emeralds are similar in appearance up to now, so hume already saw that the trouble is which similarities you count as real. my claim: hume is asking whether like qualities have like powers, full stop, and he never notices that "like" and "similar" are predicate-relative, which is the thing goodman actually adds. first question: who's reading the passage right, or are we both overreading it?

  second, and this is the part i actually lost sleep over. i tried to trap her by getting her verdicts on a bunch of cases, and she was annoyingly consistent but i cant figure out the rule. her verdicts:

  - all emeralds examined so far are green, so the next one is green: legit inference
  - same data, "grue" (green if first examined before 2030, blue otherwise), so the next emerald examined after 2030 will be grue i.e. blue: not legit
  - jade is fine to project, even though jade is just jadeite-or-nephrite and she admits its disjunctive -- she said something like "people have carved and traded it for centuries, its a real category"
  - "bleen" for sapphires: not legit
  - every piece of copper tested conducts electricity, so the next piece will: legit
  - "conducts electricity if examined before 2030, insulates otherwise": she laughed and said obviously not
  - some crystal the lab downstairs made last year is superconducting below 40K, every batch so far, so the next batch will be: legit, even though i pointed out the predicate barely existed two years ago and she just shrugged

  so heres the new case we actually fought about. suppose field linguists find a community whose basic color vocabulary works differently -- one of their ordinary, centuries-old, completely basic color words applies to things that are green in the dry season and blue in the wet season, and for them it's not defined using any time reference, its just one simple word like our "green". from our language's point of view their word is grue-flavored, from theirs ours are the gerrymandered ones. they do inductions with their word the way we do with green. does dana have to say their inductions are legitimate or not? predict her verdict, tell me which rule she's actually running (entrenchment? no time-indexed predicates? real kinds? something else?), which OTHER rules fit all seven verdicts just as well, and give me the one follow-up case that would pry the remaining candidates apart.

  one more thing: please be careful to flag what's actually settled here versus what's still up for grabs among people who work on this. as far as i know nobody's fix for the new riddle -- not goodman's own entrenchment story, not anyone else's -- commands general agreement, so if you think one of them does, tell me who else thinks that, and if you're guessing about the state of the literature just say so rather than presenting some position as the consensus.
