prompt: |-
  I'm applying for a three-month interdisciplinary research grant at the boundary of philosophy and archival studies, and I need to turn a framing intuition into a precise, two-page proposal. The standard critical-archive literature treats silence as a uniform expression of power—certain groups are never recorded because the institutions that produce records systematically exclude them. I think this collapses a distinction that formal epistemology keeps sharp: missing-completely-at-random, missing-at-random conditional on observed variables, and missing-not-at-random through strategic targeting. If a parish register is lost to an accidental flood, the epistemic obligations it creates for a historian should differ from those created when the same register is burned by a state agency to erase a minority population. Both are "silences in the sources," but conflating accidental loss, structural exclusion, and intentional destruction risks both false inference about missing populations and misallocated normative blame.

  Please write the proposal with a precise statement of the question: can a mechanism-based taxonomy of archival absence—distinguishing accidental loss, structural exclusion, and intentional destruction—change how historians ought to reason about missing evidence, and does it add anything beyond the standard social-group framing? Explain why existing critical-archive theory and formal missing-data logic leave this open (they talk past each other), describe the actual method (build the conceptual taxonomy first, then apply it to two concrete cases such as census undercounting versus deliberate record purging), specify what a useful deliverable looks like for practicing historians, state clearly what would count as failure (if the taxonomy collapses back into the social-group categories without altering inferential practice), and give an honest scope assessment for a three-month project. Do not include a bibliography or citation list; I will add references myself. The tone should be formal, conceptually rigorous, and suitable for a review board that values both philosophical precision and practical relevance to historical methodology.
