  hey, i've been messing around with thomson's lamp idea but added a bomb and now i'm stuck in a loop. here's the argument:

  (1) in the classic lamp, toggles happen at 1, 1/2, 1/4... minutes. at the 2-minute limit there's no final toggle, so the lamp's state is mathematically undefined.

  (2) wire the lamp to a bomb so that if it's on at t=2 the bomb detonates, if off then safe.

  (3) because the lamp lacks a determinate state at the limit, the bomb lacks a determinate trigger-condition right at t=2.

  (4) determinism says every event at a time has a determinate causal history.

  (5) so if this supertask actually happens, determinism is violated for that bomb.

  (6) but you can embed the same exponentially accelerating oscillation in any physical system — a pendulum with decaying period, a quantum switch, whatever — so the same problem applies everywhere.

  (7) therefore, if supertasks are physically possible, determinism fails globally.

  (8) that's way too big a bullet to bite; determinism is still our best physics framework.

  (9) so supertasks have to be physically impossible, even though the math of infinite divisibility is consistent.

  i think the slip is somewhere between (3) and (6) — maybe a scope shift or treating a model-gap like a world-gap — but i can't name it precisely. if i want to hang onto determinism and also keep that infinite divisibility is mathematically ok, which step do i reject? and what's the price?
