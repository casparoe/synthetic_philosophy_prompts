answer: |-
  Here's your mock exam package - ready to roll with a juicy prompt, model answer, marking scheme, and some intellectual honesty at the end. Keep it casual? You got it.

  **Essay Question:**

  "Tipping in North America, queueing (waiting in line) in Britain, or *not* jaywalking* in Germany are everyday conventions. Analyze whether visitors have a genuine *moral obligation* to follow these local practices. Don't just argue 'When in Rome.' Instead, critically contrast these two views:

  1.  **The Coordination Game View:** These practices are *just* solutions to coordination problems (like which side of the road to drive on). Outsiders only have a duty if they choose to participate for mutual benefit.
  2.  **The Reciprocal Expectation View:** By entering a community, you trigger reciprocal expectations that work like tacit promises. Breaking them is a moral wrong, akin to breaking a promise, because you undermine trust and benefit from others' compliance.

  In your answer, explain why the Coordination Game view makes obligations weaker and highly context-dependent (agent-relative), while the Reciprocal Expectation view suggests a stronger duty. Also, discuss a major challenge for the Reciprocal Expectation view: what happens when the local convention is perceived as unfair, inefficient, or even oppressive?"

  *(*Jaywalking = crossing the street illegally/against the rules)*

  ---

  **Model Answer (A Grade Level):**

  Whether visitors must follow local conventions like tipping, queueing, or jaywalking rules isn't just about politeness. Two philosophical frameworks offer competing answers, with big implications for the strength and nature of the obligation.

  The **Coordination Game View** sees these practices purely as efficient solutions to social hiccups. Think of them like the rule "drive on the right" (or left!). The *only* reason to follow them is to avoid chaos and get the mutual benefit of smooth interaction. For a visitor, the obligation is **agent-relative** and **context-bound**. It depends entirely on *your* choice to play the game and *your* desire for the benefit. If you don't queue in London, you cause confusion and frustration – but only because you've inserted yourself into a situation where queueing is the agreed solution. You could, theoretically, opt-out entirely (e.g., avoid crowded places, not hire a service expecting a tip). There's no deeper *moral* failing inherent in jaywalking in Berlin if you carefully avoid causing harm; you're just not playing by the local coordination rules, and might face social disapproval or a fine as a consequence, not moral condemnation. Your duty arises only from your participation and desire for the coordination benefit.

  The **Reciprocal Expectation View**, however, argues for a stronger duty. When you enter a community, you benefit from the existing web of conventions – orderly queues mean you get served fairly, tipping norms mean service workers rely on that income, jaywalking laws mean predictable traffic flow keeps you safer. By accepting these benefits, you implicitly generate expectations among locals that you'll reciprocate by following the rules. This reciprocal expectation functions like a **tacit promise**. Breaking it isn't just inefficient; it's a moral wrong because you **free-ride** and **violate trust**. You gain from others' compliance (safe streets, orderly service) while refusing to contribute your part, undermining the very system you benefit from. This makes the obligation feel less optional and more binding, almost like keeping your word.

  However, the Reciprocal Expectation view faces a massive challenge: **Unfair or Oppressive Conventions.** Can tacit promises based on unfair systems be morally binding? Imagine a tipping culture where workers *need* tips because employers pay poverty wages. Does benefiting from service create a moral duty to prop up this arguably exploitative system? Or a queueing system rigged to favor certain groups? If the underlying convention is unjust, the "promise" analogy breaks down. Insisting visitors follow oppressive norms "because it's the local expectation" feels morally hollow. The obligation weakens significantly, or perhaps vanishes, when the convention itself is morally suspect. The Coordination Game view handles this better – you can clearly refuse to participate in a game you find unfair without the same level of moral culpability (though you still forgo the benefit and might cause coordination issues).

  **In conclusion:** The Coordination Game view makes visitor obligations weak, optional, and tied to self-interested participation (agent-relative). The Reciprocal Expectation view suggests a stronger, promise-like duty arising from benefiting from others' compliance. However, the latter view stumbles badly when the convention itself is unfair, forcing us to question whether benefiting from an unjust system *truly* creates a binding reciprocal duty. Visitors might have a *prima facie* duty under the expectation view, but it's defeasible if the convention is seriously morally flawed.

  ---

  **Marking Scheme:**

  *   **A Grade (Excellent):**
      *   **Clearly identifies and contrasts both frameworks:** Accurately explains the Coordination Game view (agent-relative, benefit-driven, optional participation) AND the Reciprocal Expectation view (tacit promise, free-riding, trust violation).
      *   **Strong Application:** Applies *both* frameworks convincingly to analyze **at least two** of the named practices (tipping, queueing, jaywalking) or other relevant conventions.
      *   **Explains Agent-Relativity:** Clearly articulates *why* the Coordination Game view makes obligations agent-relative and context-dependent, and what this means for visitors.
      *   **Engages with the Challenge:** Seriously addresses the problem of unfair/oppressive conventions for the Reciprocal Expectation view, explaining how it weakens or potentially negates the obligation. Shows why the Coordination view handles this better.
      *   **Well-Structured & Clear:** Logical flow, coherent argument, good writing.

  *   **B Grade (Good):**
      *   **Describes both frameworks:** Correctly summarizes the core ideas of the Coordination Game view and the Reciprocal Expectation view.
      *   **Some Application:** Attempts to apply the frameworks to the conventions, but might be vague, less developed, or only uses one example convincingly.
      *   **Mentions Agent-Relativity:** Shows understanding that the Coordination view makes obligations dependent on participation/benefit, but might not fully explore the implications ("agent-relative" might not be used or explained deeply).
      *   **Limited on Challenge:** Mentions that unfairness is a problem for the Reciprocal view but doesn't develop the argument strongly or explain *why* it's such a critical flaw. Might not contrast how the views differ on this point.
      *   **Generally Clear:** Understandable structure and writing, perhaps with minor weaknesses.

  *   **C Grade (Satisfactory):**
      *   **Basic Description:** Outlines one view reasonably well, but the other is weak, muddled, or inaccurate. OR Describes both superficially.
      *   **Weak Application:** Little or unconvincing attempt to apply the frameworks to specific conventions. Relies on generalities.
      *   **Misses Key Elements:** Fails to properly address agent-relativity OR the unfair convention challenge. Might default to simple "When in Rome."
      *   **Structure/Clarity Issues:** Arguments are unclear or poorly organized.

  *   **D/F Grade (Poor/Inadequate):**
      *   **Significant Misunderstanding:** Misrepresents the core frameworks.
      *   **No Meaningful Application:** Doesn't connect theories to examples.
      *   **Ignores Key Requirements:** Fails to address the contrast, agent-relativity, or the unfairness challenge as required by the prompt.
      *   **Unclear or Incoherent:** Writing is difficult to follow, illogical.

  ---

  **Where My Reasoning Might Be Shaky & What Could Change My Mind:**

  *   **Weak Spot:** I lean towards the Reciprocal Expectation view for *harmless* conventions (like queueing order), but I might be underestimating how deeply ingrained the *feeling* of a tacit promise is, even in coordination scenarios. Maybe the social expectation *creates* a minimal moral duty through reliance, even in pure coordination.
      *   **What Could Change It?** Strong evidence or argument showing that *any* stable convention, purely for coordination, generates genuine moral expectations of compliance simply through widespread reliance and the predictability it provides, making violation inherently disrespectful or destabilizing in a morally significant way beyond mere inefficiency.

  *   **Weak Spot:** I think the unfair convention problem is a major blow to the Reciprocal view. But maybe I'm letting the perfect be the enemy of the good. Perhaps visitors *still* have a *pro tanto* duty (a duty that can be overridden) based on reciprocity *unless* the convention is *so* oppressive that complying actively harms others or supports serious injustice. The threshold for "too unfair" is fuzzy.
      *   **What Could Change It?** A compelling case that benefiting from *any* functional social system, even an imperfect one, creates a defeasible but real duty of fair play to contribute to its stability, and that opting out requires a very high bar of injustice *directly* caused by *your specific act* of compliance.

  Keep the typo? Sure, let's say "seperate" snuck into the question. Good luck with the exam – it's a great prompt to make 'em think!
