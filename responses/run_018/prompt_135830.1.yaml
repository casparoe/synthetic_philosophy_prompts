  ### **Special Composition Question: The Artifact Audit Game**  
  **Objective:** Make students *feel* the SCQ's ambiguity by forcing principled decisions on borderline cases, revealing inter-principle conflict and the lack of a neutral arbiter.

  ---

  ### **Game Setup**  
  **Materials:**  
  - **6 Case Cards** (descriptions below).  
  - **1 Hidden Detail Card** (for the ice bridge case).  
  - Whiteboard (to track verdicts/points).  
  - **Three "Audit Board" Placards:**  
    - Board 1: **Contact-Only Principle** ("Composition occurs IFF parts are in physical contact").  
    - Board 2: **Functional-Unity Principle** ("Composition occurs IFF parts serve a unified function").  
    - Board 3: **Unrestricted Principle** ("Composition *always* occurs").  

  **Prep:**  
  - Divide class into three boards (4–5 students each). Assign each a principle.  
  - Give each board the **6 Case Cards**.  
  - Keep the **Hidden Detail Card** sealed until Round 2.  

  ---

  ### **Case Cards**  
  **Card 1: Flash Mob**  
  > *200 people perform a synchronized dance for 5 minutes in a plaza, then disperse. They never touch. Is there one object (the "mob")?*  

  **Card 2: Drone Swarm**  
  > *50 drones carry a single package using cords for exactly 12 minutes. Drones never touch each other. Is there one object (the "swarm")?*  

  **Card 3: Ice-Block Bridge**  
  > *Ice blocks arranged as a bridge bear weight for 2 hours, then melt. Blocks appear to touch. Is there one object (the "bridge")?*  
  *(Hidden Detail for Round 2: Blocks DO NOT touch; they’re two structures synced remotely).*  

  **Card 4: Solar Sailors**  
  > *Two sailboats 1 mile apart, remotely synced to catch wind identically for 30 minutes. Never touch. Is there one object (the "sail system")?*  

  **Card 5: Balloon Cloud**  
  > *100 balloons tied to sandbags form a floating "cloud" for an art exhibit. After 3 hours, balloons are popped individually. Is there one object (the "cloud")?*  

  **Card 6: Debris Pile**  
  > *After a storm, bricks from a collapsed building form a pile in contact. No intended function. Is there one object (the "pile")?*  

  ---

  ### **Rules**  
  **Round 1 (20 min):**  
  1. Each board reviews all 6 cases.  
  2. For each case, they give a **verdict**:  
     - **YES** = "There is exactly one composite object."  
     - **NO** = "There is no composite object."  
  3. They assign **points**:  
     - **+1 Consistency** if verdict aligns with their principle.  
     - **+1 Liability** if verdict breaks their principle.  
  4. Boards record verdicts/points on the whiteboard.  

  **Round 2 (25 min):**  
  1. Reveal the **Hidden Detail Card** (for the Ice-Block Bridge).  
  2. Boards **re-vote** on the Ice-Block Bridge case.  
  3. **Appeals Phase:**  
     - Boards may appeal **one other board’s verdict** on the Ice-Bridge case.  
     - Example: "Contact-Board, you said YES initially, but the blocks don’t touch! Your principle demands NO!"  
     - Appealed boards defend or change verdict.  
  4. **Re-score** the Ice-Bridge case based on final verdicts.  

  ---

  ### **Expected Verdicts & Conflicts**  
  *(✓ = Consistent | ✗ = Liability)*  
  | Case             | Contact-Only Board          | Functional-Unity Board     | Unrestricted Board |  
  |------------------|-----------------------------|----------------------------|-------------------|  
  | **1. Flash Mob** | NO ✓ (no contact)           | YES ✓ (unified performance)| YES ✓           |  
  | **2. Drone Swarm**| NO ✓ (no contact)          | YES ✓ (unified delivery)   | YES ✓           |  
  | **3. Ice-Bridge**| **Round1:** YES ✓ → **Round2:** NO ✓ (hidden: no contact)| YES ✓ (still functions)    | YES ✓           |  
  | **4. Solar Sailors**| NO ✓ (no contact)         | YES ✓ (unified function)   | YES ✓           |  
  | **5. Balloon Cloud**| YES ✓ (contact)           | **Varies!** Common sense: NO ✗ (breaks function) | YES ✓ |  
  | **6. Debris Pile**| YES ✓ (contact)           | NO ✓ (no function)         | YES ✓           |  

  #### **Key Conflicts:**  
  - **Drone Swarm/Solar Sailors:** Contact-Board says NO; others say YES.  
  - **Debris Pile/Balloon Cloud:** Contact says YES; Function says NO.  
  - **Ice-Bridge (Round 2):** Contact says NO; Function/Unrestricted say YES.  

  ---

  ### **Debrief & Metaphysical Mapping (15 min)**  
  1. **Map the Game to SCQ Positions:**  
     - **Contact-Only Board → Mereological Nihilism Leaning:** Only contiguous things compose.  
     - **Functional-Unity Board → Aristotelian Hylomorphism:** Composition requires teleology.  
     - **Unrestricted Board → Universalism:** Any plurality composes an object.  

  2. **Predictable Problems & Lessons:**  
     - **"Common Sense" Smuggling:** Students often abandon principles for intuition (e.g., Functional Board says NO to Balloon Cloud because "it’s just balloons," ignoring function). **Use this!** Ask: "Why did you override your principle? What does that say about SCQ’s difficulty?"  
     - **No Neutral Arbiter:** Appeals fail to resolve disputes—e.g., Contact vs. Function on Ice-Bridge. Emphasize: **Metaphysics lacks a referee.** Principles are foundational; you can’t "prove" one without circularity.  
     - **What the Game Misses:**  
       - **Modal/Time Issues:** Cases are synchronic (at one time). SCQ debates diachronic persistence (e.g., "If a drone fails at t+1, does the swarm cease existing?").  
       - **Essential Parts:** The game doesn’t cover whether composites *require* specific parts (e.g., "Is the swarm still the swarm if 1 drone quits?"). Cover this in lecture.  

  3. **Big Takeaway:**  
     - SCQ isn’t solved by "common sense." Principles dictate verdicts, but we lack a meta-principle to choose between them. Van Inwagen’s nihilism and Merricks’ eliminativism emerge from *accepting* this ambiguity.  

  ---

  ### **Why This Works**  
  - **Engagement:** Students *live* the role of principled auditors, not passive listeners.  
  - **Drama:** Hidden details and appeals force high-stakes debates ("Why should contact matter if it *works*?").  
  - **Clarity:** Points system makes abstract consistency visceral.  
  - **Low Prep:** Just print cards and use a whiteboard.  

  **Run it, then let the metaphysics war begin!** 🔥
