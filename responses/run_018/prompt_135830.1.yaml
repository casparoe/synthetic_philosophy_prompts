  Rules Summary:

  1. Divide into three boards, assign principle.
  2. Round 1: Each board gets 6 case cards. For each case:
     a. Discuss and decide: is there exactly one composite object? (YES/NO)
     b. For each case, if the verdict is consistent with the board's principle, +1 consistency point; else, +1 liability point.
  3. Round 2: 
     a. Reveal hidden detail for the ice bridge case (case3).
     b. Boards can change their verdict for case3.
     c. Other boards can appeal to a board for case3 if they think the verdict is inconsistent with that board's principle. The appealed board must defend or change.
     d. Re-score case3: if the final verdict is consistent, +1 consistency; else, +1 liability. (Note: if they had already scored case3 in round1, we replace that score with the new one.)
  4. Tally points: total consistency points minus liability points (or just report both). But the points are just a means to an end.
  5. Discuss the disagreements and map to the SCQ positions.

