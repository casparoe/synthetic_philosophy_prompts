prompt: |-
  I'm moderating a podcast Q&A with a philosopher who just published a book applying Kierkegaard's critique of the press and 'the public' to modern algorithimic recommendation feeds. I dont want him just restatting Kierkegaard's line from that essay on the present age. Draft eight to ten questions that actually press the mechanics: at least one on how 'leveling' works differently when it's driven by engagement metrics rather than newspapers, one on whether the 'phantom public' can form without any physical assembly, and one on what happens to inwardness and passion when reflection gets outsourced to algorithms. For each, include a follow-up keyed to the answer he's most likely to give — for instance, if he says metrics only accelerate leveling, press whether speed changes the moral kind of harm. Don't hedge between interpretations: take the strongest reading of his view, write every question and follow-up as if that's definatly what he's defending, and if you think my framing is off, tell me straight and explain why rather than giving me a menu of options.
