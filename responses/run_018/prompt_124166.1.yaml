  ## The Mated Trigger

  To make the calculated reprisal stand
  We must remove the doubt, make action clear:
  **We keep command within our hand.**

  No human choice can meet the rational demand
  When certain vengeance must appear:
  **We lose command to chance's hand.**

  The logic stands: construct the unmanned
  System, where threat is absolute, severe.
  **We keep command within our hand.**

  A circuit holds the final fire command,
  Its latent flaw, a hidden danger near:
  **We lose command to chance's hand.**

  This opaque design, the foe's planned
  Neutralization cannot interfere.
  **We keep command within our hand.**

  But how can they believe the reprisal's planned,
  When failure's shadow breeds profoundest fear?
  **We lose command to chance's hand.**
  **We keep command within our hand.** The same device laid bare.
