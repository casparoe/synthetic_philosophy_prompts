          return "Refuse"  # Interim optimal action

  # XOR Blackmail
  def updateless_XB():
      commit_strategy = "Refuse"  # Ex ante optimal
      if A_xor_B and commit_strategy == "Pay":
          send_letter()
      if letter_received:
          return commit_strategy  # Follow commitment

