  ### 2. XOR Blackmail (XB)

  **Setup**:
  - Nature chooses A,B ∈ {0,1} i.i.d. fair coins (4 states, P=0.25 each)
  - Ω sends letter iff (A ⊕ B = 1) AND DM's strategy pays upon receiving letter
  - DM observes letter receipt (information set I_L)

  **Game Tree**:
  1. **Root**: Nature chooses (A,B)
  2. **If A ⊕ B = 0**:
     - No letter. Game ends. DM payoff = 0
  3. **If A ⊕ B = 1**:
     - Ω plays:
       - If DM's strategy pays at I_L: Sends letter → DM moves
       - Else: No letter → DM payoff = 0
     - **If letter sent**:
       - DM at I_L (doesn't know A or B) chooses: Pay or Refuse
       - Payoffs:
         - Pay: DM loses 1,000 + [E if A=1]  
           (E = large embarrassment cost)
         - Refuse: DM loses E (embarrassment occurs)

  **Information Sets**:
  - I_L = {(A,B) | A⊕B=1} (one information set with two nodes)

  **Beliefs at I_L**:
  By Bayes' rule (if reached): P(A=1|I_L) = P(B=1|I_L) = 0.5

  **Sequential Rationality (Updateful)**:
  - At I_L (conditional on letter):
    - EU(Pay) = 0.5 × (-1,000) + 0.5 × (-1,000 - E) = -1,000 - 0.5E
    - EU(Refuse) = -E
    - → Pays iff -1,000 - 0.5E > -E ⇒ E > 2,000
  - Assume E > 2,000 (e.g., E=1M), so DM pays  
  - **Result**: Ex ante EU = P(letter) × [-1,000 - 0.5E]  
    Since P(letter) = P(A⊕B=1) = 0.5 if DM pays, EU = 0.5 × (-1,000 - 0.5E) = -500 - 0.25E

  **Updateless Strategy**:
  - Choose σ at ex ante stage:
    - Strategy 1: "Refuse if letter"  
      → Ω never sends letter → EU = 0
    - Strategy 2: "Pay if letter"  
      → EU = -500 - 0.25E (as above)
  - → Optimal: Commit to "Refuse"  
  - **Implementation**: Refuse at I_L if reached (but with this σ, I_L is never reached)

