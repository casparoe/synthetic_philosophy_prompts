     - DM moves at information set I_H (singleton): Action a ∈ {Pay, Refuse}
     - Payoffs:
       - Pay: DM loses 100, Ω gains 100
       - Refuse: DM = 0, Ω = 0
  3. **If θ = T**:
     - No DM move. Payoff depends on DM's *counterfactual strategy* at I_H:
       - If DM's strategy specifies Pay at I_H: DM gains 10,000
       - If Refuse: DM = 0

  **Strategies**:
  DM's strategy σ : {I_H} → {Pay, Refuse}  
  (No action at T)

  **Sequential Rationality (Updateful)**:
  - At I_H (knowing θ=H):
    - EU(Pay) = -100
    - EU(Refuse) = 0
  - → Optimal action: Refuse  
  - **Result**: Ex ante EU = 0.5 × 0 + 0.5 × 0 = 0

  **Updateless Strategy**:
  - Choose σ at ex ante stage to maximize ex ante EU:
    - If σ(I_H) = Pay: EU = 0.5 × (-100) + 0.5 × 10,000 = 4,950
    - If σ(I_H) = Refuse: EU = 0
  - → Optimal: Commit to σ(I_H) = Pay  
  - **Implementation**: Follow Pay at I_H even though interim EU is negative

