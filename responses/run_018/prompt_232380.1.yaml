  ### Residue Report: Mapping to Game Theory

  #### I. Elements that Carry Over Cleanly
  1. **Updateless ≈ Ex Ante Commitment**  
     - Updateless strategies are precisely ex ante optimal strategies.  
     - Implemented as binding commitments to a complete contingent plan σ.  
     - *Carries over perfectly*: This is standard in mechanism design (e.g., revelation principle).

  2. **Updateful ≈ Sequential Rationality**  
     - Updateful decisions are interim best responses at each information set.  
     - *Carries over perfectly*: Matches sequential equilibrium or subgame perfection.

  3. **Conflict Source: Time Inconsistency**  
     - The tension arises when ex ante optimal plans are not sequentially rational.  
     - *Carries over perfectly*: Classic in dynamic games (e.g., hyperbolic discounting).

  #### II. Elements Requiring Distortion
  1. **Ω's Strategy as a Function of DM's Entire Strategy**  
     - In XB, Ω's move (send letter?) depends on DM's *global strategy* σ, not just actions.  
     - Standard off-path beliefs can't represent this directly:
       - Off-path beliefs are about *types* or *states*, not strategies.  
     - *Distortion needed*: To fit standard formalism, we must:  
       - Treat DM's strategy choice as a "type" selected at ex ante stage.  
       - Let Ω condition actions on this type (as in XB tree above).  
     - This is equivalent to a **metagame** where DM chooses σ before Nature moves.

  2. **Information Sets as Strategy-Dependent**  
     - In XB, the existence of I_L depends on σ (letter sent only if DM would pay).  
     - Standard games have fixed information sets.  
     - *Distortion needed*: Model I_L as a singleton set reachable only under specific σ.

  #### III. Elements with No Counterpart
  1. **Logical Counterfactuals**  
     - CM's "DM would pay in H" is a counterfactual about an unreachable state.  
     - Game theory evaluates counterfactuals via off-path beliefs, but only for *reached* information sets.  
     - *No counterpart*: GT has no native framework for counterfactuals in *unreachable* subtrees (e.g., T in CM when θ=H).

  2. **Self-Referential Strategy Dependence**  
     - XB requires Ω to predict DM's response to I_L *before* DM acts.  
     - Standard GT handles this via equilibrium selection, not single-agent decisions.  
     - *No counterpart*: This is closer to **program equilibrium** (e.g., bots sharing code).

  #### Critical Interrogation
  1. **Is Updateless Just Precommitment?**  
     **Yes** – with a caveat:  
     - In classical GT, precommitment is *physical* (e.g., signing a contract).  
     - Updatelessness imagines "commitment" via *logical counterfactuals* (Ω simulates DM in unreachable states).  
     - **Verdict**: Conceptually identical to ex ante optimization, but with exotic enforcement.

  2. **Does XB Introduce Unrepresentable Correlation?**  
     **No, but off-path beliefs aren't sufficient**:  
     - XB's challenge is Ω correlating with DM's *strategy*, not beliefs.  
     - Can be represented by:  
       - Adding DM's "commitment type" at ex ante stage.  
       - Using **conditional strategies** (if-then rules).  
     - **Verdict**: Standard GT tools suffice if we allow strategy-dependent moves.

  3. **Is GT Missing a Phenomenon?**  
     **No – but obscuring a key distinction**:  
     - GT focuses on *equilibrium* evaluation of strategies.  
     - Updatelessness emphasizes *ex ante optimization of rules* vs. *interim optimization of acts*.  
     - **Verdict**: This is already embedded in GT's ex ante vs. interim analysis. The "slide" is between:  
       - Choosing a strategy now (ex ante)  
       - Evaluating actions at future information sets (interim).  

  4. **Should You Adopt These Concepts?**  
     - **For mechanism design**: Marginal value – updatelessness highlights commitment power in non-robust settings.  
     - **For sequential equilibrium**: Limited value – standard off-path belief refinements handle similar issues.  
     - **Caution**: Rationalist literature often conflates:  
       - True time inconsistency (GT handles well)  
       - Logical uncertainty (no GT counterpart)  
       - Self-reference (needs ad-hoc GT extensions).  
     - **Recommendation**:  
       - **Write off** as pedagogical tools for commitment problems.  
       - **Incorporate sparingly**: Use "ex ante strategy optimization" language instead of "updateless", avoiding non-GT constructs.

