  There is a concept in the rationalist community of "logical counterfactuals" and "logical uncertainty" that may not have a direct counterpart. In these problems, the DM's decision is being predicted by Omega, and that prediction is based on the DM's algorithm or decision rule. The DM's decision rule is fixed and known to Omega. This is similar to the idea of a commitment device. 

