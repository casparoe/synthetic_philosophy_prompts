prompt: |-
  Draft the joint statement that defenders of global-trait virtue ethics and proponents of the situationist critique could both sign after a good-faith adversarial collaboration, focused specifically on whether moral character exists at a psychologically realistic granularity rather than on broad metaphysical claims about human nature. Do not dramatize a dialogue, do not adjudicate which camp is correct, and do not ask for bibliographies or citations; instead, produce the constructive document both parties could put their names to, with every residual disagreement made exact and neither side's view rendered as a straw man.

  The collaboration has adopted a niche organizing framing: the dispute is not merely whether people are "good" or "bad" globally, but whether stable moral dispositions are best modeled as cross-situational global traits (e.g., honesty, compassion as unitary characters) or as locally indexed moral expertise (e.g., domain-specific skills in resource fairness, stranger compassion, or promise-keeping). Both sides agree that this framing is where the empirical and normative stakes actually lie.

  Part I: Numbered agreed claims. Present at least six precisely formulated claims that both camps can endorse without reservation. These should include agreement that (1) traditional self-report personality inventories have poor predictive validity for specific moral behaviors; (2) situational variables—such as time pressure, social visibility, and ambient environmental cues—explain substantial variance in behavior that global-trait scores fail to absorb; (3) predictive failure does not automatically entail explanatory irrelevance, and explanatory relevance does not automatically entail predictive success; (4) the concept of "local traits" or domain-specific moral skills is conceptually coherent and empirically distinguishable from global character; (5) purely descriptive psychology cannot by itself settle normative questions in virtue ethics without mediation by an account of moral development, habituation, or education; and (6) both sides commit to a shared empirical protocol—ambulatory experience-sampling of moral micro-decisions across three domains (resource fairness, stranger-directed compassion, and promise-keeping), paired with peer-nomination ratings and independent behavioral coding—to generate data that both will treat as bearing on the dispute.

  Part II: Disagreements table. Use columns for Crux; Formulation accepted by virtue-ethics defenders; Formulation accepted by situationists; Agreed case, argument, or empirical result that bears on the crux; Predicted outcome by virtue-ethics defenders; and Predicted outcome by situationists.

  The table must cover at least four cruxes:
  A. Whether peer-nomination consistency across the three domains correlates more strongly with a single latent "global moral character" factor or with three largely independent domain-specific factors.
  B. Whether targeted training in one moral domain (e.g., structured compassion exercises) produces measurable behavioral transfer to an untrained domain (e.g., fairness in resource allocation) or remains locally confined.
  C. Whether individuals rated as "moral experts" by peers exhibit lower cross-situational variability in moral behavior compared to matched controls, or whether their observed consistency is largely an artifact of self-selection into predictable social environments.
  D. Whether normative virtue ethics requires the presupposition of global traits to ground practices of moral education, praise, and blame, or whether a "local-virtue" framework can preserve those normative practices without requiring cross-domain consistency.

  For each crux, phrase each side's position so that its own proponents would recognize it as faithful and not as a caricature. Record in advance, for each agreed test or thought experiment, what result each side expects and what result would cause it to revise its view. Maintain formal, polished prose throughout; introduce the local-moral-expertise framing as the collaboration's central niche contribution, but do not invoke obscure theories or depend on specific publication details that a model without web access could not be expected to know precisely.
