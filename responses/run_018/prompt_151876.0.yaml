answer: |-
  ## Whig History

  We trace the steps that led us to this day,
  **How wise we've grown, how far we've come!**
  Each fallen creed points out the destined way.

  See revolutions, paved in disarray,
  Called *necessary* though they left men numb?
  We trace the steps that led us to this day.

  Those witch-trials held? A price they had to pay!
  (We judge their morals with a modern thumb) –
  Each fallen creed points out the destined way.

  That messy war? We sweep the blood away,
  Declare the outcome was the perfect sum.
  We trace the steps that led us to this day.

  Complex dissent we tidy to display,
  A footnote where the *right* side won, struck dumb.
  Each fallen creed points out the destined way.

  **With all loose threads neatly cut away,**
  The past becomes a primer, glib and glum.
  We trace the steps that led us to this day;
  Each fallen creed points out the destined way.

  But dig within the layers of the clay:
  No future glimmered in their eyes, struck numb.
  **With all loose threads neatly cut away,**
  The path *we* walk is what we chose to say
  Was always there. The past won't rise, accept our sum.
  We trace the steps we *wish* had led this way,
  **With all loose threads neatly cut away.**

  ---

  **Notes on Execution:**

  *   **Refrains:** "How wise we've grown, how far we've come!" embodies present self-congratulation and the illusion of inherent progress. "With all loose threads neatly cut away" captures the erasure of contingency, complexity, and alternative paths.
  *   **Tercet Content:** Each explores a specific Whiggish move:
      *   Tercet 1: Treating past movements/crises merely as necessary "steps" ("Each fallen creed").
      *   Tercet 2: Anachronistic moral judgment ("judge their morals with a modern thumb").
      *   Tercet 3: Simplifying messy conflicts into clean, beneficial outcomes ("sweep the blood away").
      *   Tercet 4: Silencing or simplifying dissent into mere obstacles for the "right" side ("Complex dissent we tidy to display").
  *   **Quatrain Turn:** Lines 16-19 explicitly reject the idea of progress being *discovered* ("No future glimmered in their eyes"), revealing it as a projection ("The path *we* walk is what we chose to say / Was always there"). It highlights the constructed nature ("neatly cut away") and the finality of imposing this narrative ("The past won't rise").
  *   **Form as Trap:** The rigid villanelle structure, with its inevitable repetitions, mirrors the inescapable, self-reinforcing loop of Whig historical reasoning.
  *   **Rhyme & Diction:** Uses slant rhymes and near-rhymes (come/dumb, thumb/sum, glum/way, numb/sum, say/away) avoiding sing-song simplicity. Diction is critical and precise ("disarray," "numb," "glib," "clay," "dumb").
  *   **Sharpness:** Critiques the core mechanisms (anachronism, teleology, erasure) without needing names or citations, satisfying the knowledgeable without lecturing.
