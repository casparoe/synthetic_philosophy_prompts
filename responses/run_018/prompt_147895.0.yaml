answer: |-
  The institutional divergence reflects distinct philosophical commitments regarding communicative ethics, epistemic responsibility, and institutional purpose:

  ### Core Presuppositions
  1. **Speech-Act Dualism**  
     - *Lying* violates the constitutive norm of assertion (Stalnaker/Williamson: assertion commits to truth).  
     - *Misleading* exploits Gricean conversational maxims (relevance, quantity) without breaching assertion's core commitment.  
     - **Presupposed**: Assertion carries unique moral weight via explicit truth-commitment, while implicature relies on hearer's interpretive vulnerability.

  2. **Epistemic Asymmetry**  
     - Perjury law presumes jurors can evaluate literal truth but lack capacity to reconstruct omitted context.  
     - Professional codes treat experts as epistemically responsible for holistic truth-effects.  
     - **Presupposed**: Lay recipients bear partial responsibility for misinterpretations; professionals/specialists owe affirmative disclosure duties.

  3. **Institutional Telos**  
     - Courts prioritize witness participation (fearing chilling effects) → tolerate "literal truth" evasion.  
     - Professions view truthfulness as constitutive of role integrity → prohibit impression management.  
     - **Presupposed**: Legal testimony is coerced speech warranting narrow liability; professional speech is voluntary role-based service.

  ---

  ### Philosophical Underdetermination
  - **Evidentiary Pragmatism**: Perjury’s falsity requirement enables tractable proof (subjective belief is hard evidence; holistic deception isn’t). This needs no deep moral distinction.  
  - **Moral Equivalence Counterfactual**: If lying/misleading are equally manipulative (Shiffrin), current perjury rules become inconsistent with:  
    - Tort law’s *negligent misrepresentation* liability  
    - Contract law’s voidability for *suppressio veri*  
    - Consumer protection’s "false impression" standards  

  ---

  ### Tensions & Incoherencies
  1. **Belief-Manipulation Paradox**:  
     If deception’s wrong is belief-violation (rather than false-proposition-uttering), perjury exemptions for misleading testimony appear irrational. Deliberately inducing false beliefs via technical truths becomes morally/legally inconsistent with punishing identical mental-state manipulation in commerce.

  2. **Negligence vs. Intent Asymmetry**:  
     Tort punishes *unintentional* misleading omissions (e.g., property defects), yet perjury excuses *intentional* evasive testimony. This privileges witness-box intentionality absent clear justification.

  ---

  ### Reconstructing Implicit Theories
  | Domain          | Core Commitment                                  | Truth Standard         | Moral Foundation               |
  |-----------------|-------------------------------------------------|------------------------|--------------------------------|
  | **Criminal Perjury** | Witness reliability > perfect truth          | Literal falsity        | Epistemic humility (fallible juries) |
  | **Professional Ethics** | Truthfulness as role-constitutive virtue   | Holistic impression    | Fiduciary duty to truth        |
  | **Consumer/Tort Law** | Transactional equity                       | Contextual misleading  | Vulnerability protection      |

  ---

  ### Implications of Moral Equivalence
  If lying/misleading are morally equivalent:  
  1. **Legal Changes**:  
     - Perjury expands to cover "deliberately misleading impressions"  
     - "Literal truth" defense abolished → subjective intent to deceive suffices  
     - Witness immunity contracts to offset increased liability  

  2. **Professional Ethics**:  
     - Current codes largely align with equivalence → minimal reform needed  
     - Enhanced focus on contextual completeness over technical precision  

  3. **Philosophical Shift**:  
     - Rejection of Austin/Searle speech-act hierarchy  
     - Embrace consequentialist/Shiffrinian view: deception’s essence is belief-violation regardless of mechanism  

  ---

  **Conclusion**: The divergence is overdetermined—it reflects both pragmatic institutional design (evidence rules, witness coercion) *and* a non-trivial philosophical distinction between assertion-violation (lying) and inference-exploitation (misleading). However, the system’s tolerance for deliberate witness deception remains in tension with its condemnation of identical mental-state manipulation elsewhere, suggesting unresolved philosophical ambivalence about whether deception’s wrongness lies in *speaker dishonesty* or *hearer manipulation*. Resolving this would require legal systems to choose between broadening perjury or narrowing tort liability for omissions.
