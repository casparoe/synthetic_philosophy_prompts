answer: |-
  ## Desiderata for a Theory of Promissory Obligation

  An adequate account of why promises bind must meet the following criteria, motivated by core cases and conceptual boundaries. "Non-negotiable" (NN) denotes criteria essential to any minimally plausible account; "Camp Preference" (CP) indicates criteria reflecting theoretical emphasis but open to debate.

  1.  **Explain Ordinary Bilateral Promises (NN):**
      *   **Desideratum:** Account for the paradigmatic case: A voluntarily communicates an intention to undertake an obligation to B, B grasps this, and a binding obligation arises (e.g., "I promise to return your book next Tuesday").
      *   **Motivating Case:** The loaned book promise. Failure to explain this core case renders the theory inadequate.

  2.  **Explain Institutional/Solemn Vows (NN):**
      *   **Desideratum:** Account for obligations arising within established practices (e.g., marriage vows, judicial oaths, religious vows) where the formality itself is crucial, and reliance may be diffuse or institutional.
      *   **Motivating Case:** A judge swearing an oath of office. The obligation binds even if no specific citizen is immediately relying on *this* judge's performance at the moment of swearing; the institutional context and public trust matter.

  3.  **Preserve Obligation vs. Mere Expectation (NN):**
      *   **Desideratum:** Distinguish a genuine promissory *obligation* from a mere prediction, hope, or statement of intent that creates an expectation but no duty (e.g., "I intend to be there" vs. "I promise to be there").
      *   **Motivating Case:** "I'll probably help you move Saturday" (creates expectation) vs. "I promise I will help you move Saturday" (creates obligation). The theory must capture the normative 'ought' specific to promising.

  4.  **Distinguish Breach from Release (NN):**
      *   **Desideratum:** Explain why failing to perform is a *wrong* (breach) requiring justification or remedy, versus situations where the obligation is legitimately dissolved (release by promisee, mutual agreement, supervening impossibility, etc.).
      *   **Motivating Case:** Failing to show up for the promised help (breach) vs. the promisee telling you not to bother (release). The theory must explain the persistence of obligation until properly extinguished.

  5.  **Handle Duress/Coercion (NN):**
      *   **Desideratum:** Explain why promises made under severe coercion or illegitimate threat (duress) are typically void or voidable.
      *   **Motivating Case:** "Promise to hand over your wallet or I'll shoot." The resulting "promise" carries no binding force. The theory must explain why voluntariness is crucial.

  6.  **Handle Radical Informational Asymmetry (CP):**
      *   **Desideratum:** Explain obligations when one party possesses critical information unknown to the other, especially if undisclosed. Should such asymmetry undermine the obligation? Or create duties of disclosure?
      *   **Motivating Case:** Selling a car promising "it runs great" while knowing the engine is about to fail. Does the promise bind? Is it fraudulent? Theories differ on how much asymmetry vitiates consent/obligation.

  7.  **Accommodate or Reject Pluralism (CP):**
      *   **Desideratum:** Specify whether promissory obligation *must* have a single foundational ground (e.g., *only* autonomy, *only* trust, *only* practice) or whether multiple grounds can converge or apply contextually to create binding force.
      *   **Motivating Case:** Does the judge's oath bind *because* of their autonomous commitment (autonomy), *because* the public relies on judicial integrity (trust), *or* *because* swearing the oath within the legal system invokes a constitutive rule (practice)? Or all three? Theories diverge on monism vs. pluralism.

  8.  **Explain the "Synthetic Delegation" Case (NN):**
      *   **Desideratum:** Explain how a human (H) delegating a task to an autonomous system (AI) *and* committing to review its outputs creates a *prima facie* binding obligation *on H* to perform that review, even if no other human (B) has formed a specific expectation *based on that commitment* at the time it was made.
      *   **Motivating Case:** A doctor delegates initial diagnosis to an AI clinical tool and commits (to the hospital/system, or implicitly to the patient via professional norms) to review its outputs before finalizing treatment. The AI has no expectations. The patient may be unaware of the delegation. Yet, the doctor incurs an obligation to review. The theory must explain how H's *own commitment* generates obligation without requiring B's contemporaneous reliance or expectation *on that specific commitment*. The obligation stems from H undertaking the responsibility, potentially grounded in autonomy (self-binding), practice (professional duty/role obligation), or a duty of care (which itself may need grounding), but *not* directly from B's trust in *this promise*.
      *   **Criteria Demand:** The theory must show how a self-directed commitment or an undertaking within a role/practice can generate obligation *independently* of creating specific expectations in a particular promisee *at the moment of commitment*. H is obligated *to whomever the duty of care is owed* (patient, institution) by virtue of taking on the task *and* the review commitment.

  **Tensions and Potential Incompatibilities:**

  *   **Synthetic Delegation vs. Pure Trust-Expectation (Major Tension):** Desideratum 8 (Synthetic Delegation) is fundamentally incompatible with a *pure* trust/expectation theory that makes the promisee's *actual induced reliance or expectation* the *sole* ground of obligation (Desideratum 7 monism). Synthetic Delegation shows obligation arising without that specific reliance. A trust theory must either reject 8 (implausible) or significantly modify itself (e.g., appeal to *potential* trust, institutional trust, or a hybrid view).
  *   **Distinction (Obligation vs. Expectation) vs. Trust Monism:** Maintaining a sharp distinction between obligation and mere expectation (Desideratum 3) is challenged if the *only* difference between "I intend" and "I promise" is the *strength* of expectation induced. A robust distinction often requires something beyond induced expectation.
  *   **Pluralism vs. Theoretical Parsimony:** Accommodating pluralism (Desideratum 7) increases explanatory power (covering Synthetic Delegation, vows, ordinary promises) but at the cost of theoretical simplicity and elegance. Insisting on monism risks leaving cases unexplained or forcing awkward interpretations.

  **Scoring Major Views:**

  *   **Autonomy-Based (e.g., Kantian Self-Legislation):**
      *   **Strengths:** Excels at 1 (Ordinary), 3 (Obligation/Expectation distinction - the promise *is* the self-imposed law), 5 (Duress undermines autonomy), *potentially* 8 (Synthetic Delegation - H autonomously commits to review).
      *   **Weaknesses:** Struggles with 2 (Vows - why the specific institutional form binds beyond intent?), 6 (Asymmetry - how does hidden info affect autonomous consent?), 4 (Release - why can *another* person release me from my self-imposed law?) unless supplemented. Can seem overly abstract for practice-based cases.
  *   **Trust-Based (e.g., Reliance/Expectation):**
      *   **Strengths:** Explains 1 (Ordinary) well, core of 4 (Breach wrongs because reliance is thwarted), provides *a* reason for 5 (Duress undermines reasonable reliance), handles some asymmetry (if material, reliance was not reasonable).
      *   **Weaknesses:** Struggles *critically* with 2 (Vows - minimal specific reliance), 8 (Synthetic Delegation - lack of specific human expectation), and the core of 3 (Obligation/Expectation - why *should* inducing expectation create obligation? Why is it different?). Trust monism fails on Synthetic Delegation.
  *   **Practice-Based (e.g., Social Convention/Rules):**
      *   **Strengths:** Excels at 1 (Ordinary - defined by convention), 2 (Vows - institutional rules), 4 (Breach/Release - defined by rules), 6 (Asymmetry - often governed by practice norms like disclosure duties), *potentially* 8 (Synthetic Delegation - as an undertaking within a professional or institutional practice).
      *   **Weaknesses:** Struggles with 3 (Obligation/Expectation - why does participating in a practice create a *moral* obligation? Reduces to "we just do it this way"), 5 (Duress - why does coercion invalidate if the *form* of the practice was followed?), risks making obligation contingent on social acceptance. Explains *how* promises bind within a practice, but less clearly *why* the practice creates *moral* force.

  The "Synthetic Delegation" case acts as a significant stress test, exposing limitations in pure trust-based views and demanding that theories account for self-assumed responsibility or role-based duties independent of immediate, specific reliance. The tension between explaining this case and maintaining trust monism is particularly acute. A satisfactory theory likely needs to either embrace pluralism or significantly reinterpret one of the core desiderata.
