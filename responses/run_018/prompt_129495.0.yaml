answer: |-
  Below is a structured analysis of your query, comparing normative conventionalism and practice-embedded particularism on the moral status of "invisible obligations," evaluating "normative tourism," and assessing each framework's coherence in explaining the insider/outsider dynamic. This synthesis integrates philosophical rigor with anthropological insights relevant to your feature.

  ---

  ### **1. Core Frameworks & Their Treatment of "Invisible Obligations"**
  #### **Normative Conventionalism**  
  - **Premise**: Social conventions (e.g., tipping, queueing) are moral obligations because they stabilize cooperation, prevent harm, and embody collective rationality.  
  - **Invisible Obligations**: Rules like unspoken tipping rates or pedestrian right-of-way norms are **objectively binding** once you enter a social space. Ignorance does not absolve obligation; visitors have a duty to learn them (e.g., a tourist must research local tipping economies).  
  - **Moral Grounding**: Rooted in consequentialism (disruption causes harm) and/or Kantian reciprocity (participating in a system entails upholding its rules).  

  #### **Practice-Embedded Particularism**  
  - **Premise**: Conventions only become morally obligatory when embedded in a "form of life" (Wittgenstein) sustained by mutual recognition and shared history.  
  - **Invisible Obligations**: These are **meaningless** outside their lifeworld. A tipping economy isn’t a freestanding "rule" but a node in a network of reciprocity, dignity, and economic survival. Outsiders lack the contextual grasp to feel obligated.  
  - **Moral Grounding**: Hermeneutic (norms derive meaning from intersubjective practices) and virtue-ethical (obligation presumes communal belonging).  

  ---

  ### **2. Normative Tourism: Three Interpretations**  
  | **Perspective**       | **Normative Conventionalism**                          | **Practice-Embedded Particularism**                     |  
  |------------------------|-------------------------------------------------------|---------------------------------------------------------|  
  | **Harmless Consumption** | Implausible: Ignoring invisible rules exploits locals (e.g., under-tipping harms workers). | Plausible: Sampling visible rituals (bowing) without understanding lacks moral weight. |  
  | **Moral Free-Riding**  | **Primary View**: Visitors benefit from social order (e.g., service quality) while dodging its costs (fair wages via tips). A justice violation. | Secondary: Only if the visitor *chooses* integration but cherry-picks duties. Otherwise, not "free-riding" but "not playing the game." |  
  | **Structural Middle**  | Weak: Obligation applies regardless of intent.        | **Strong**: Tourism inhabits a liminal space—neither full insider nor detached observer. "Obliviousness" is structural, not malicious. |  

  ---

  ### **3. Coherence in Explaining Insider/Outsider Asymmetry**  
  - **Why Insiders Feel Obligated, Outsiders Don’t**:  
    - **Particularism’s Strength**: Perfectly explains opacity. Insiders share a "background" (Searle) of mutual expectations. Outsiders lack the embodied know-how to *see* the obligation (e.g., a queue feels arbitrary unless you’ve internalized its link to fairness).  
    - **Conventionalism’s Weakness**: Struggles to explain *opacity*. If rules are universally binding, why don’t outsiders perceive them? It must appeal to cognitive failure ("laziness"), not moral ontology.  

  - **Can Visitors Be Morally Obligated Without Social Assimilation?**  
    - **Conventionalism**: Yes. Obligation arises from participation in a cooperative scheme, not identity. A visitor *is* obligated to tip—even if they reject the culture—because they benefit from the service economy.  
    - **Particularism**: No. Demanding compliance conflates morality with assimilation. Obligation requires initiation into the "form of life." Asking a tourist to intuit unmarked pedestrian rights is like demanding chess mastery without teaching the rules.  
    - **Tension**: Neither fully resolves this. Conventionalism risks imperializing local norms; particularism risks moral relativism.  

  ---

  ### **4. A Hybrid Path: Threshold Obligations**  
  For your feature, consider a synthesis:  
  - **Basic Harm Principle**: All visitors owe duties to avoid *foreseeable harm* (e.g., under-tipping when aware it underpins livelihoods).  
  - **Contextual Reasonableness**: Obligation scales with duration/exposure. A business traveler staying months has greater duty to learn invisible rules than a 3-day tourist.  
  - **Reciprocity Lite**: Using infrastructure (transport, markets) generates thin obligations to uphold its norms, even without full assimilation.  

  ---

  ### **Conclusion for Your Feature**  
  - **Normative tourism** is **structurally in-between**: It reflects the tourist’s liminal status rather than malice. But where it perpetuates inequity (e.g., exploiting invisible labor economies), it edges toward free-riding.  
  - **Particularism** better explains *why* invisible rules feel non-obligatory to outsiders but struggles to demand compliance. **Conventionalism** better justifies universal duties but overestimates outsiders’ capacity to perceive embedded norms.  
  - **Ultimate Tension**: Both frameworks reveal a paradox in cosmopolitan ethics: Can a global society build moral obligations that respect local lifeworlds *without* reducing them to checklists? Your feature might argue that "threshold morality" offers a path—rooted in minimizing harm while honoring the depth of cultural embeddedness.  

  This tension mirrors the broader human condition: We navigate overlapping moral architectures, never fully insiders nor outsiders, perpetually negotiating the visible and invisible rules that bind us.
