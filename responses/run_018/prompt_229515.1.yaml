prompt: |-
  I run the grantmaking side of a mid-sized family foundation. A surprising share of our commitments never reach a signed grant agreement: a program officer tells an applicant on a site visit that "we'll fund this next cycle," someone sends a one-line email saying we are "on board," a board member tells an organization at a dinner that the foundation "will stand behind them." Later the project goes sideways, or our priorities shift, or the organization turns out to have problems, and I have to decide which of these soft commitments we are morally bound to honor. These cases come up roughly monthly, the sums are small to midsize but large for the recipients, we usually have only a day or two to decide, and I cannot pull in counsel or a philosopher for each one. The people who would use the procedure are program officers without legal or philosophical training.

  From what I have read, philosophers treat promising as a distinctive kind of obligation and disagree about why it binds: some locate the wrong in breaking the act of assurance itself, some in the expectations the promisor knowingly invited, and some mainly in the reliance or harm that follows. I want that theory turned into a reusable decision procedure, not an essay. The procedure should be a checklist to run in order, with guidance on what counts as a sufficiently good answer to move to the next step. It should keep three questions strictly separate: (a) did we make a promise-like commitment at all, as opposed to a prediction, a statement of current intention, a hope, or fundraising politeness; (b) does that commitment bind us in the particular case; and (c) if it binds, may we still break or revise it, and what do we then owe the counterparty. It should also say clearly which steps are judgment calls that no checklist can eliminate, and where the procedure should stop and hand the decision to a person because it is a question of values rather than facts.

  Then apply the procedure to three cases: a senior program officer's verbal "we'll fund you next cycle" to a first-time applicant she met on a site visit; a board member's unauthorized dinner-table assurance that the foundation "will stand behind" an organization, after which the organization signs a lease in reliance; and a conditional pledge — "if we launch the fellowships program, your group will be first in line" — where we decide not to launch the program but the group spent months preparing an application because of the pledge. Make sure at least one case yields an answer I will not like. Please begin with the procedure itself, with no preface or commentary, then run the cases through it, and close with what the procedure cannot decide for us.
reasoning: |-
  We are creating a decision procedure for assessing moral obligations arising from informal commitments in a foundation context. The procedure is a checklist to be followed in sequence. It separates three questions: 
   (a) Did we make a promise-like commitment? 
   (b) If so, does it bind us in this particular case? 
   (c) If it binds, may we still break or revise it, and what do we then owe?

   The procedure is designed for program officers without legal or philosophical training. It must be practical and reusable.

   Decision Procedure: Assessing Moral Obligations from Informal Commitments

   I. DID WE MAKE A PROMISE-LIKE COMMITMENT? (Step A)
      Purpose: To distinguish a promise from other speech acts (prediction, intention, hope, politeness).
      Steps:
      1. Did the speaker use words that typically express a commitment? 
          - Examples: "we will fund", "we are on board", "we stand behind you", "you can count on us", "we pledge", "we commit".
          - Non-examples: "we hope to", "we might", "we are considering", "we aim to", "subject to approval", "likely".
          - If the words are ambiguous, proceed to step 2.
      2. Did the speaker have the actual or apparent authority to make such a commitment on behalf of the foundation?
          - Actual authority: The speaker had the formal power to make binding commitments (e.g., a grant agreement) for the foundation in that context. 
          - Apparent authority: A reasonable person in the recipient's position would believe the speaker had such authority, based on the foundation's prior conduct or the speaker's role.
          - Note: Board members typically have authority for governance but not necessarily for individual grants. Program officers may have authority for recommendations but not final approval. Check foundation policies.
          - If no authority (actual or apparent), then it is not a promise-like commitment by the foundation. (Stop here: no obligation.)
      3. Was the statement made in a context that suggests seriousness and commitment?
          - Consider: Was it in a formal meeting? A site visit? A casual conversation? Written or oral?
          - Factors that increase seriousness: The foundation initiated the contact, the recipient shared confidential information, the foundation asked for a proposal, or the context was formal.
          - Factors that decrease seriousness: Social setting, fundraising event, informal chat, or the statement was offhand.
      4. Did the recipient understand it as a commitment?
          - Evidence: Did the recipient act as if they received a commitment (e.g., thanking for the commitment, changing their behavior)? Or did they express uncertainty?
          - Note: The recipient's understanding must be reasonable in the circumstances.

      Conclusion for Step A:
      - If the answer to all of 1-4 is "yes", then it is a promise-like commitment. Proceed to Step B.
      - If any answer is "no", then it is not a promise-like commitment. (Stop: no obligation.)

   II. DOES THE COMMITMENT BIND US IN THIS PARTICULAR CASE? (Step B)
      Purpose: Even if a commitment was made, there may be reasons why it does not create a binding obligation in this situation.
      Steps:
      1. Was the commitment conditional? And if so, were the conditions met?
          - Explicit conditions: e.g., "if we launch the program", "subject to board approval". If conditions are not met, the commitment does not bind.
          - Implicit conditions: Are there unstated but understood conditions? (e.g., the organization remains in good standing, the project remains as described, the foundation's priorities remain unchanged). 
          - If conditions are not met, the commitment does not bind. (Stop: no obligation.)
      2. Has there been a fundamental change in circumstances that makes fulfilling the commitment impossible or highly detrimental to the foundation's mission?
          - Examples: The recipient organization is found to have engaged in misconduct, the project is no longer feasible, the foundation has a major shift in strategy, or the recipient misrepresented the project.
          - Note: This is a high bar. Ordinary changes in priorities or minor setbacks do not qualify.
      3. Was the commitment induced by fraud or significant misrepresentation by the recipient?
          - If the recipient knowingly provided false information that was material to the commitment, then the commitment does not bind.

      Conclusion for Step B:
      - If any of 1-3 apply (conditions not met, fundamental change, fraud), then the commitment does not bind. (Stop: no obligation.)
      - Otherwise, the commitment binds. Proceed to Step C.

   III. IF THE COMMITMENT BINDS, MAY WE STILL BREAK OR REVISE IT, AND WHAT DO WE OWE? (Step C)
      Purpose: Even if bound, we may have to break the commitment. We then assess what we owe to the counterparty.
      Steps:
      1. Can we fulfill the commitment without compromising the foundation's mission or values?
          - If yes, we should fulfill it. (Stop: honor the commitment.)
          - If no, proceed to step 2.
      2. Is there a way to partially fulfill the commitment that would be fair?
          - Example: Instead of the full amount, a smaller grant or a one-time payment to cover costs.
          - If yes, propose that. (Stop: offer partial fulfillment.)
          - If no, proceed to step 3.
      3. What harm or costs has the recipient incurred in reliance on the commitment?
          - We must make reasonable efforts to compensate for reliance costs, even if we break the commitment.
          - Reliance costs: Expenses directly incurred because of the commitment (e.g., staff time, signed leases, turning down other funding). Do not include speculative gains (e.g., expected impact of the project).
          - Evidence required: The recipient must provide documentation of costs.
      4. What is the minimum we can do to acknowledge the broken commitment and maintain the relationship?
          - Consider: An apology, an explanation, a token payment, or assistance in finding other funding.

      Conclusion for Step C:
      - We are obligated to compensate for verifiable reliance costs and to communicate respectfully.

   IV. JUDGMENT CALLS AND LIMITATIONS
      - The following steps require judgment and cannot be fully resolved by the checklist:
          * Step A.3 (context seriousness) and A.4 (recipient's understanding) involve interpreting social cues.
          * Step B.2 (fundamental change) and B.3 (fraud/misrepresentation) require investigation and assessment of severity.
          * Step C.1 (mission compromise) and C.2 (partial fulfillment) involve weighing foundation values.
      - The procedure stops and requires human decision-making when:
          * There is ambiguity in the facts (e.g., conflicting accounts of what was said).
          * The foundation must balance competing moral principles (e.g., keeping a promise vs. avoiding harm to the foundation's mission).
      - The procedure does not cover:
          * Legal obligations (consult a lawyer if there is a risk of legal liability).
          * Reputational risks beyond the moral obligation.

   Now, apply to three cases:

   Case 1: Senior program officer's verbal "we'll fund you next cycle" to a first-time applicant during a site visit.

   Step A: 
      1. Words: "we'll fund you" is a commitment phrase.
      2. Authority: Program officers typically do not have final authority; they recommend. However, in a site visit (formal context) and to a first-time applicant, the recipient might reasonably believe the program officer has authority (apparent authority). But note: foundation policies might require board approval. Check policy. If the foundation typically relies on program officer recommendations, apparent authority may exist.
      3. Context: Site visit is formal and serious.
      4. Recipient's understanding: Likely understood as a commitment, especially if the program officer is senior.

      Step A Conclusion: Likely a promise-like commitment.

   Step B:
      1. Conditions: The statement "next cycle" implies a condition of the foundation's normal process and available funds. Also, implicit condition of board approval (if required by policy). If the next cycle occurs and the foundation has funds, but the board rejects it, then condition not met? But note: the program officer may have overstepped. This is tricky.
      2. Fundamental change? None stated.
      3. Fraud? None.

      Step B Conclusion: If the foundation's process requires board approval and the board rejects it, then the condition (implicit) is not met. The commitment may not bind. But if the foundation's process typically follows program officer recommendations, then it might bind.

   Step C: Not reached if Step B concludes no binding. But if it binds and we break:

      1. Can we fulfill? If the board rejects, then we cannot without overriding the board. So no.
      2. Partial fulfillment? Maybe a small grant or covering costs of applying?
      3. Reliance costs: The recipient may have turned down other opportunities or incurred costs preparing for the grant. Compensate for verifiable costs.
      4. Minimum: Apologize and explain.

      Overall for Case 1: 
          - If foundation policy gives program officers the power to commit, then we are bound and should fund or compensate. 
          - Otherwise, we are not bound by the commitment (because of lack of authority or unfulfilled condition) but may have a duty to compensate for reliance.

      Answer you may not like: Even without binding commitment, we might still have to pay for reliance costs.

   Case 2: Board member's unauthorized dinner-table assurance that the foundation "will stand behind" an organization. The organization signs a lease in reliance.

   Step A:
      1. Words: "stand behind" is a commitment phrase (implies support).
      2. Authority: Board members have governance authority but typically not authority to make individual grant commitments without process. However, a board member might reasonably be perceived as having authority (apparent authority). Check foundation policy: if policy requires a formal process, then apparent authority may not exist because the recipient should know that individual board members cannot commit unilaterally.
      3. Context: Dinner-table is informal and social. This decreases seriousness.
      4. Recipient's understanding: They signed a lease, so they clearly took it as a commitment. But was it reasonable? If the organization knows the foundation's processes, they should know board members cannot unilaterally commit. However, if the board member is the chair or very influential, it might be reasonable.

      Step A Conclusion: If the recipient reasonably believed the board member had authority, then yes. Otherwise, no.

   Step B:
      Assume Step A says yes.
      1. Conditions: None stated. But implicit condition that the organization remains viable and the project is sound.
      2. Fundamental change? None stated.
      3. Fraud? None.

      Step B Conclusion: Binds.

   Step C:
      1. Can we fulfill? If we can, we should. But if the foundation did not budget for this and it would compromise other commitments, then maybe not.
      2. Partial fulfillment? Maybe cover the lease costs for a period or help them find other funding.
      3. Reliance costs: They signed a lease. We must cover the costs of the lease (or a portion) if we break the commitment.
      4. Minimum: Apologize and explain.

      Overall for Case 2: 
          - If Step A concludes there was a commitment, then we are bound to support or compensate for the lease.
          - But note: the board member acted without authority. The foundation might still be morally bound because of the recipient's reliance.

      Answer: The foundation may have to cover the lease costs even though the board member was unauthorized.

   Case 3: Conditional pledge — "if we launch the fellowships program, your group will be first in line." We decide not to launch, and the group spent months preparing an application.

   Step A:
      1. Words: "will be first in line" is a commitment, but conditional ("if we launch").
      2. Authority: The speaker's authority matters. If it was a program officer with authority over the program, then apparent authority may exist. If it was a board member without operational role, then maybe not.
      3. Context: Assume it was in a formal conversation about the program.
      4. Recipient's understanding: They prepared for months, so they took it as a commitment.

      Step A Conclusion: It is a promise-like commitment, but conditional.

   Step B:
      1. Conditions: The condition ("if we launch") was not met. Therefore, the commitment does not bind.

      Step B Conclusion: No obligation to fund because the condition failed.

   Step C: Not reached because Step B says no binding.

      However, note: The group spent months preparing. This is reliance. But the commitment was conditional, so they took a risk. The foundation did not promise to launch the program, only that if it did, they would be first. 

      But consider: Did the foundation encourage the preparation? If the foundation knew or should have known that preparation would be costly, and they did nothing to discourage it, then there might be a moral duty to compensate for reliance even without a binding commitment. This is beyond the strict promise, but the procedure in Step C is only for when the commitment binds. 

      Therefore, by the procedure, no obligation. But we may choose to compensate as a matter of fairness or relationship management.

      Answer you may not like: We have no obligation, but the procedure does not cover non-promissory reliance.

   V. What the procedure cannot decide for us:
      - The weight to give to the foundation's mission versus the recipient's reliance when they conflict.
      - Whether to compensate for reliance when there was no binding commitment (as in Case 3) but the foundation's actions caused harm.
      - How much compensation is fair beyond verifiable costs.
      - How to handle repeated patterns of staff making unauthorized commitments.

      These require institutional policies and values-based decisions.
answer: |-
  ### Decision Procedure: Assessing Moral Obligations from Informal Commitments  
  **Purpose:** To determine if a foundation is morally bound to honor informal commitments, using a step-by-step checklist. Addresses three questions: (A) Was a promise-like commitment made? (B) Does it bind? (C) If binding, may we break/revise it, and what do we owe?  
  **Users:** Program officers without legal/philosophical training.  
  **Rules:**  
  - Proceed step-by-step. Stop if a question yields "no" (no obligation) or a clear exit.  
  - Judgment calls are marked with **(!)**. These require human discretion.  
  - Legal advice is separate: Consult counsel if legal risk is suspected (e.g., signed documents, large sums).  

  ---

  #### **STEP A: WAS A PROMISE-LIKE COMMITMENT MADE?**  
  *(Distinguish from predictions, hopes, intentions, or politeness.)*  
  1. **Words Used:** Did the speaker use direct, commitment-oriented language?  
     - *Yes:* "Will fund," "commit," "on board," "stand behind," "guarantee," "pledge," or similar.  
     - *No:* "Hope to," "likely," "considering," "maybe," "if everything aligns," or vague encouragement.  
     - *Judgment **(!)**:* If ambiguous (e.g., "next cycle"), proceed to Step A.2.  

  2. **Authority:** Did the speaker have **actual or apparent authority** to bind the foundation?  
     - *Actual authority:* Formal role grants power (e.g., Executive Director for grants; Board for strategic commitments).  
     - *Apparent authority:* Would a reasonable recipient believe the speaker could commit, based on:  
       - The speaker’s title/role (e.g., senior program officer vs. intern).  
       - Past patterns (e.g., foundation routinely honors this person’s verbal assurances).  
     - *No authority:* Junior staff, volunteers, or unauthorized board members.  
     - *Judgment **(!)**:* Weigh role and context (e.g., Board member at a formal event vs. social dinner).  

  3. **Context:** Was the setting formal and intentional?  
     - *Yes:* Site visit, grant meeting, written email with specifics.  
     - *No:* Social event, fundraiser, offhand comment, vague email.  
     - *Judgment **(!)**:* Consider if the foundation initiated the conversation or solicited input.  

  4. **Recipient Understanding:** Would a reasonable recipient view this as a commitment?  
     - *Evidence:* Recipient acted in reliance (e.g., turned down other funding, signed contracts).  
     - *No evidence:* Recipient treated it as speculative (e.g., asked for next steps).  
     - *Judgment **(!)**:* Avoid assuming politeness equals commitment.  

  **STEP A CONCLUSION:**  
  - **If all 4 answers are "yes" → Promise-like commitment made.** Proceed to Step B.  
  - **Any "no" → No commitment.** Stop. No moral obligation.  

  ---

  #### **STEP B: DOES THE COMMITMENT BIND IN THIS CASE?**  
  *(Even if Step A is "yes," conditions may void obligation.)*  
  1. **Explicit Conditions:** Were unmet conditions attached?  
     - *Yes:* "Subject to board approval," "if budget allows," "pending due diligence." → Commitment does **not** bind. Stop.  
     - *No:* Unconditional language (e.g., "we will fund you"). Proceed to Step B.2.  

  2. **Implicit Conditions:** Would both parties assume unstated conditions?  
     - *Yes, if:*  
       - Recipient misrepresented facts (e.g., hidden financial problems).  
       - Project became impossible (e.g., regulatory ban, natural disaster).  
       - Foundation’s mission shift makes commitment harmful to core goals.  
     - *No:* Ordinary changes (e.g., new priorities, minor budget cuts).  
     - *Judgment **(!)**:* "Harmful to core goals" requires severe, mission-level conflict.  

  3. **Reliance Harm:** Did the recipient reasonably incur costs?  
     - *Yes:* Documented expenses (e.g., signed lease, hired staff, turned down funding).  
     - *No:* Speculative efforts (e.g., brainstorming, casual outreach).  
     - *Not binding if:* Recipient’s reliance was unreasonable (e.g., acted before due diligence).  

  **STEP B CONCLUSION:**  
  - **If Steps B.1–B.3 yield "no" → Commitment binds.** Proceed to Step C.  
  - **Any "yes" in B.1 or B.2 → Does not bind.** Stop. No obligation.  
  - **Only B.3 "yes" → May not bind, but see Step C.3 for reliance.**  

  ---

  #### **STEP C: IF BINDING, MAY WE BREAK/REVISE IT? WHAT DO WE OWE?**  
  *(For binding commitments, or if reliance harm occurred.)*  
  1. **Can we fully honor it without compromising the mission?**  
     - *Yes:* Honor the commitment. **Stop.**  
     - *No:* Proceed to C.2 (e.g., budget shortfall, mission conflict).  

  2. **Can we partially honor it?**  
     - *Yes:* Offer a compromise (e.g., reduced grant, one-time payment).  
     - *No:* Proceed to C.3.  

  3. **What reliance costs must we cover?**  
     - *Obligation:* Compensate only for **documented, direct costs** caused by reliance.  
       - *Include:* Non-refundable deposits, staff time (at market rate), equipment purchases.  
       - *Exclude:* Indirect losses (e.g., "expected impact," emotional distress).  
     - *Judgment **(!)**:* Request receipts. Use a standard rate for staff time (e.g., $50/hour).  

  4. **Relationship repair:** What else can we offer?  
     - *Options:* Apology, help finding alternatives, future consideration.  
     - *Not obligatory but recommended for ethics/trust.*  

  **STEP C CONCLUSION:**  
  - **If binding:** Honor fully (C.1) or partially (C.2).  
  - **If not binding but reliance harm (Step B.3):** Compensate for costs (C.3) + repair (C.4).  

  ---

  ### APPLICATION TO CASES  
  **CASE 1: Program Officer’s "We’ll fund you next cycle" at site visit.**  
  - **Step A:**  
    - A.1: "We’ll fund you" is direct commitment language. → **Yes.**  
    - A.2: Senior program officers have **apparent authority** during site visits (recipient expects them to speak for foundation). → **Yes.**  
    - A.3: Site visit is formal context. → **Yes.**  
    - A.4: Recipient likely understood as commitment (first-time applicant). → **Yes.**  
    → **Promise-like commitment made.**  
  - **Step B:**  
    - B.1: "Next cycle" implies **implicit condition** of standard approval/budget. If cycle proceeds but priorities shift, condition unmet. → **Commitment does not bind.** Stop.  
    → **No obligation to fund.**  
  - **But note:** If recipient incurred costs (e.g., delayed other fundraising), apply Step C.3.  

  **VERDICT:** Not binding. Compensate only for documented reliance costs.  

  ---

  **CASE 2: Board member’s "We will stand behind you" at dinner; recipient signed lease.**  
  - **Step A:**  
    - A.1: "Stand behind you" implies commitment. → **Yes.**  
    - A.2: Board members lack **actual authority** for individual grants but may have **apparent authority** if recipient reasonably believes they can commit (e.g., if foundation culture allows it). → **Judgment **(!)**: Likely no authority (unauthorized).**  
    - A.3: Dinner-table context is informal. → **No.**  
    - A.4: Recipient understood as commitment (signed lease). → **Yes, but reliance may be unreasonable** (should know board members can’t bind foundation unilaterally).  
    → **No promise-like commitment** (fails A.2 and A.3). Stop.  
  - **But reliance harm occurred (signed lease):** Proceed to Step C.3.  
    - C.3: Compensate for **documented lease costs** (e.g., penalty for breaking lease).  

  **VERDICT:** Not binding, but compensate for reliance costs.  

  ---

  **CASE 3: Conditional pledge ("If we launch, you’re first in line"); program not launched.**  
  - **Step A:**  
    - A.1: "First in line" is commitment language, but conditional ("if"). → **Yes (conditional).**  
    - A.2: If speaker had authority over the program (e.g., Program Director), apparent authority exists. → **Yes.**  
    - A.3: Formal context (assumed). → **Yes.**  
    - A.4: Recipient understood as commitment (spent months preparing). → **Yes.**  
    → **Promise-like commitment made (conditional).**  
  - **Step B:**  
    - B.1: **Explicit condition** ("if we launch") not met. → **Commitment does not bind.** Stop.  
  - **But reliance harm occurred (months of work):** Proceed to Step C.3.  
    - C.3: Compensate for **documented costs** (e.g., staff time spent on application). Do not compensate for "lost opportunity."  

  **VERDICT:** Not binding. Compensate only for verifiable costs.  
  *(Answer you may not like: The foundation is not obligated to fund or fully compensate, even though the group worked for months.)*  

  ---

  ### WHAT THE PROCEDURE CANNOT DECIDE  
  The procedure resolves factual questions but **cannot replace values-based judgments** in these areas:  
  1. **Step A.2 (Authority) and A.4 (Understanding):** Requires weighing "reasonableness" based on foundation culture and recipient perspective.  
  2. **Step B.2 (Implicit Conditions):** "Mission harm" is subjective (e.g., is a 5% budget reallocation "harm"?).  
  3. **Step C.3 (Reliance Costs):** Fair compensation for intangibles (e.g., reputation damage) is discretionary.  
  4. **Non-Promissory Obligations:** Moral duties beyond promises (e.g., if foundation encouraged reliance but made no commitment).  
  5. **Systemic Issues:** Repeated violations require policy changes (e.g., training staff to avoid soft commitments).  

  **Final Advice:** Use this procedure for consistency, but escalate borderline cases to leadership. Draft a foundation policy: "All commitments require written approval to avoid ambiguity."
