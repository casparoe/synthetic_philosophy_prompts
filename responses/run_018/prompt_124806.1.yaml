answer: |-
  Below is a systematic breakdown of the requirements for a theory of diachronic persistence, organized by your specified cases and desiderata. I'll flag tensions and evaluate endurantism/perdurantism structurally, focusing on the criteria's demands.

  ---

  ### **I. Core Persistence Cases & Required Explanations**
  *(Motivating scenarios and what the theory must deliver)*

  1. **Ordinary Gradual Change** (e.g., a tree growing)  
     - **Requirement**: Strict numerical identity must hold.  
     - **Why**: Rejects mere "survival" as insufficient for mundane change. Losing strict identity here undermines common-sense ontology.

  2. **Fission** (e.g., brain bisection creating two psychologically continuous persons)  
     - **Requirement**: *Deny strict identity* to both successors (only one can be identical, or neither). Must allow *survival without identity* (e.g., via psychological continuity).  
     - **Why**: Symmetry problem—two entities can't both be numerically identical to one precursor.  
     - **Cost**: May violate intuition that both successors "are" the original (e.g., Parfit's "q-memory").

  3. **Fusion** (e.g., two rivers merging)  
     - **Requirement**: Symmetric to fission—strict identity to both precursors is impossible. Must explain how a new entity emerges or one precursor "wins."  
     - **Why**: Avoids contradiction in assigning two identities to one entity.  
     - **Cost**: Conflicts with intuitions about continuous existence (e.g., if River A "dominates," is River B destroyed?).

  4. **Intermittent Existence** (e.g., a mind suspended and revived centuries later)  
     - **Requirement**: *Either* preserve strict identity via immanent causation *or* deny the scenario is coherent. Cannot rely on spatiotemporal continuity.  
     - **Why**: Tests whether persistence requires continuity. If identity is preserved, causal/psychological links must compensate for gaps.  
     - **Cost**: Risks circularity (e.g., defining causation via identity).

  5. **Branching** (e.g., a time-traveling entity with disconnected temporal segments)  
     - **Requirement**: Allow strict identity *only if* segments share a causal-genetic link. Otherwise, treat as distinct entities mimicking one another.  
     - **Why**: Without causal grounding, "identity" reduces to similarity.  
     - **Cost**: May exclude exotic metaphysical possibilities (e.g., Boltzmann brains).

  ---

  ### **II. Desiderata for a Theory of Persistence**
  *(Constraints vs. Preferences)*

  | Desideratum                                                                 | Status                                                                                                | Motivating Concern                                                                 |
  |-----------------------------------------------------------------------------|-------------------------------------------------------------------------------------------------------|------------------------------------------------------------------------------------|
  | **(1) Incompatible Properties**<br>Resolve "change without contradiction." | **Non-negotiable**<br>(All theories must address this)                                                | Core to defining persistence: a leaf *is* green at t₁ and red at t₂.               |
  | **(2) Wholly Present**<br>Distinguish endurance (wholly at each time) vs. perdurance (temporal parts). | **Preference**<br>(Non-negotiable for endurantists; rejected by perdurantists)                        | Endurantism: Avoids fragmenting objects. Perdurantism: Needs parts to explain change. |
  | **(3) Spatiotemporal/Causal Continuity**<br>Accommodate intuitions about continuity. | **Preference**<br>(Non-negotiable for common-sense views; negotiable for 4D/humean views)             | Intuition: A person can't "jump" across gaps. Physicalism: Continuity may reduce to causation. |
  | **(4) Relativistic Compatibility**<br>No absolute simultaneity; frame-dependence. | **Non-negotiable**<br>(Physics-constrained)                                                           | Relativity dissolves "global present," challenging "wholly present" (see tension below). |
  | **(5) Psychological vs. Bodily Continuity**<br>Handle dissociations (e.g., teleportation). | **Preference**<br>(Non-negotiable for psychological-continuity theorists; negotiable for biological views) | Personal identity debates: Is the mind or body the locus of persistence?           |
  | **(6) Persistence vs. Mereological Inclusion**<br>Reject "object = slice of a 4D worm." | **Preference**<br>(Non-negotiable for endurantists; perdurantists *embrace* 4D wholes)                | Endurantism: Objects are not "timelessly extended." Perdurantism: Change = part-properties. |

  ---

  ### **III. Joint Unsatisfiability & Key Tensions**
  **The Incompatible Triad**:  
  - **(1) Incompatible Properties** + **(2) Wholly Present** + **(4) Relativistic Compatibility**  
    - **Conflict**: (1) and (2) together demand that a *single, undivided entity* bears contradictory properties at different times. But (4) denies a privileged frame for assigning "times" to an object's history. If "wholly present" requires a frame-absolute instant, relativity forbids it.  
    - **Resolution Forced**:  
      - *Endurantism*: Must either reject (4) (cost: incompatibility with physics) or reinterpret "wholly present" as frame-relative (cost: fragments objects across reference frames).  
      - *Perdurantism*: Drops (2), avoiding the triad by distributing properties across temporal parts. Relativity is natural (spacetime worms are Lorentz-invariant).  

  **Other Tensions**:  
  - **(3) Continuity Intuition** + **Fission/Fusion**:  
    Continuity suggests a unique path, but fission/fusion break uniqueness. *Cost*: Theories must abandon continuity (e.g., perdurantism) or declare fission/fusion impossible (e.g., some endurantist views).  
  - **(5) Psychological Continuity** + **Bodily Continuity**:  
    Cannot prioritize both in dissociative cases (e.g., brain transplant). *Cost*: Theories must choose a primary criterion or accept dualism.  

  ---

  ### **IV. Structural Evaluation of Endurantism vs. Perdurantism**
  *(Focused on your criteria; "Cost" = ontological/explanatory burden)*

  | Requirement                     | Endurantism                                                                 | Perdurantism                                                                 |
  |---------------------------------|-----------------------------------------------------------------------------|------------------------------------------------------------------------------|
  | **Gradual Change (1)**          | ✅ Uses "temporary intrinsics" (adverbialism/relationalism).<br>**Cost**: Mysterious "how" of property-bearing. | ✅ Direct: Properties belong to temporal parts.<br>**Cost**: Denies object is *wholly* present. |
  | **Fission/Fusion**              | ❓ Struggles. May deny strict identity but lacks "survival" mechanism.<br>**Cost**: Must reject cases or embrace brute facts. | ✅ Natural: Precursor = segment shared by branches.<br>**Cost**: Quantifies over non-intuitive entities. |
  | **Intermittent Existence**      | ❌ Fails without causal continuity (violates (3)).<br>**Cost**: Rejects possibility. | ✅ Easy: Gaps between temporal segments.<br>**Cost**: May overextend to arbitrary sums. |
  | **Branching**                   | ❌ Only works with causal links.<br>**Cost**: Rejects acausal branching. | ✅ Handles via spacetime topology.<br>**Cost**: Allows "disconnected objects" as one. |
  | **Wholly Present (2)**          | ✅ Core commitment.<br>**Cost**: Conflicts with (4). | ❌ Explicitly rejected.<br>**Cost**: Violates "objecthood" intuitions. |
  | **Relativistic (4)**            | ❌ Severely challenged.<br>**Cost**: Requires frame-dependent existence or denies relativity. | ✅ Native fit (4D spacetime).<br>**Cost**: None. |
  | **Persistence vs. 4D Whole (6)**| ✅ Affirms distinction.<br>**Cost**: Must explain what binds stages. | ❌ Collapses: Persistence *is* mereological inclusion.<br>**Cost**: Alienates common sense. |

  **Most Damaging Desiderata**:  
  - **For Endurantism**: **(4) Relativity** (forces revision or incompatibility) and **Fission** (lacks resources for non-branching survival).  
  - **For Perdurantism**: **(2) Wholly Present** (rejects a core intuition) and **(6) Persistence vs. 4D Whole** (equates objects with "arbitrary" spacetime regions).  

  ---

  ### **Synthesis**
  Endurantism and perdurantism are forced apart by the **triad of (1), (2), and (4)**, with relativity as the catalyst. Endurantism preserves intuitive "objecthood" but at the cost of physical compatibility and flexibility with exotic cases. Perdurantism gains explanatory power in fission/fusion/relativity by sacrificing the "wholly present" object. **Fission cases** and the **psychological/bodily dissociation** desideratum further strain both, demanding either a choice of continuity criterion (e.g., psychological for persons) or deeper metaphysics (e.g., hylomorphism). To move beyond the dichotomy, consider hybrid theories (e.g., stage theory) or question the primacy of numerical identity (e.g., grounding persistence in causal relations alone).
