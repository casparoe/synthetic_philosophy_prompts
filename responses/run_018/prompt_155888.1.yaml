  Now, regarding the obesity epidemic: Nietzsche was critical of modern decadence, which includes overindulgence and lack of discipline. He might see widespread obesity as a symptom of a cultural decline where people are slaves to their impulses rather than exercising self-mastery. The key here is the attitude—whether one is actively shaping their drives or passively succumbing to them. He valued strength and overcoming, so a society struggling with obesity might represent a failure of will.

  Then there's biohacking with things like continuous glucose monitors and fasting. The user questions if this is true self-overcoming or disguised decadence. Nietzsche would likely scrutinize the underlying motives. If biohacking is about optimizing performance to achieve higher goals, it could be seen as self-overcoming. But if it's driven by fear of illness or obsession with control, it might be reactive and thus decadent. The distinction lies in whether it's a manifestation of the will to power or a symptom of weakness.

