prompt: |-
  On a rationality forum I read, people defend cooperating in a one-shot prisoners dilemma with what they call the mirror argument: if your opponent is an exact copy of you -- same values, same reasoning, same everything -- then choosing is like raising your hand in front of a mirror. Whatever you do, the reflection does too, so the only outcomes on the table are both-cooperate and both-defect, and cooperate obviously wins. They use this to say defecting against a copy is just irrational, no enforcement or repetition needed, and they extend it to voting: if it makes sense for me to stay home because one vote never decides anything, then it makes sense for everyone who thinks like me to stay home, so the mirror says go vote.

  Something feels off to me. A mirror's arm moves because yours moved -- nobody thinks the copy's choice is *caused* by mine, we're in seperate rooms deciding independently. So can you audit the analogy? Give me the correspondence table (what plays the role of the mirror, the reflection, the causal link between me and the glass), say which disanalogies actually matter for the conclusions its being asked to carry and which are just cosmetic, and tell me whether cooperate still wins once the "my choice moves theirs" picture is stripped out -- i.e. whether correlation-without-causation can do the same argumentative work. And if the mirror is the wrong image, what's a better analogy for whatever the symmetry of two identical reasoners actually buys you? Finally, does the voting extension survive, given that there the "copies" are merely similar people rather than exact duplicates?
reasoning: |-
  Okay, let me try to unpack this user's query. They're dealing with the mirror argument used in rationality forums to justify cooperation in a one-shot Prisoner's Dilemma and extending it to voting. The core issue seems to be whether the mirror analogy holds when stripped of its causal implications. 

  First, I need to recall how the Prisoner's Dilemma works. Both players choose to cooperate or defect. Mutual cooperation gives a good outcome, mutual defect is bad, but defecting when the other cooperates yields the best individual payoff. The mirror argument suggests that if your opponent is an exact copy, your choice determines theirs, making mutual cooperation rational.

  The user feels uneasy because the analogy implies causation—like a mirror reflection—but in reality, both players decide independently. They want to know if correlation without causation can still support cooperation and if the voting analogy holds.

  Hmm, I should break down the analogy's components. The mirror represents the symmetry between players. The reflection is the copy's identical choice. The causal link in the analogy is the idea that your move causes theirs, but that's not accurate. The disanalogy here is crucial because independent decisions mean my choice doesn't cause the other's, but the correlation exists due to identical reasoning.

  So, without causation, does cooperation still make sense? If both players are identical and rational, they'll reason the same way. If one defects, so does the other, leading to the worst outcome. If both cooperate, they get a better payoff. So, the correlation forces them to coordinate on the same action. Thus, cooperating is rational because the only consistent outcomes are mutual cooperation or mutual defection, and the former is better.

  Now, for the voting extension. The user points out that voters are similar but not exact copies. Here, the symmetry breaks down. Similar people might not all reason identically, and the impact of one vote is negligible. The mirror argument might not hold because if I stay home, it doesn't mean all similar people do. There could be enough variation, leading to a collective action problem. So, voting might still be irrational on an individual level despite the mirror-like reasoning.

  The user's deeper concern might be about overextending analogies. They want a clearer understanding of when symmetry arguments work and when they fail. Maybe they're also interested in how rational agents should act in symmetric situations versus real-world scenarios with imperfect similarities.

  A better analogy than a mirror could be synchronized swimmers or rowers in a boat. Both emphasize coordinated action through identical goals and reasoning without causation. This highlights that the key is the shared decision-making framework, not causal links.

  In conclusion, the mirror argument works for exact copies in PD because correlation ensures mutual outcomes, making cooperate dominate. But for voting, the lack of exact duplication and the negligible individual impact weaken the argument, making the extension less valid.
answer: |-
  Here's a breakdown of the mirror argument, its flaws, its core logic, and its application to voting:

  ### 1. Correspondence Table & Disanalogies

  | **Mirror Analogy Component** | **Prisoner's Dilemma Equivalent** | **Critical Disanalogy** | **Impact on Argument** |
  | :--------------------------- | :-------------------------------- | :---------------------- | :--------------------- |
  | **Your Hand**                | Your decision (C or D)            | None                    | Cosmetic              |
  | **The Mirror**               | The identical reasoning agent     | The "mirror" isn't passive; it *actively reasons*. | **Crucial** - Removes causal link. |
  | **Reflection's Hand**        | The copy's decision (C or D)      | The copy's decision is *caused by its own identical reasoning*, not yours. | **Crucial** - Removes causation. |
  | **Causal Link (Your Hand → Reflection)** | Perceived link (Your Choice → Copy's Choice) | **No actual causation.** Choices are *correlated* via identical reasoning/inputs. | **Crucial** - The core flaw in the analogy. |
  | **Seeing Both Hands Move Together** | Outcomes (CC or DD)               | Outcomes are correlated by symmetry, not fixed by one agent. | Cosmetic - Outcome correlation is key. |

  **Which Disanalogies Matter?**
  *   **The Causation Disanalogy (Reflection's Hand Movement):** This **fatally flaws the analogy's *picture***. Your choice does NOT cause the copy's choice. They decide independently based on identical reasoning.
  *   **The Passive Mirror Disanalogy:** The copy is an active reasoner, not a passive reflector. This matters less if the argument focuses on *outcomes* rather than the *mechanism*.

  ### 2. Does Cooperation Win Without Causation? (Correlation Alone)

  **Yes, cooperation still wins, but the justification shifts from causation to rational consistency and outcome correlation.**

  Here's the argument stripped of causation:

  1.  **Symmetry Premise:** You and your opponent are *exact* duplicates: same values, same information, same decision algorithm.
  2.  **Rational Consistency:** Identical rational agents, given identical inputs (including the knowledge of symmetry), must reach identical conclusions/decisions. *(If they didn't, they wouldn't be identical rational agents facing the same situation).*
  3.  **Outcome Correlation:** Therefore, the possible outcomes are only **Both Cooperate (CC)** or **Both Defect (DD)**. The asymmetric outcomes (CD, DC) are logically impossible because your identical reasoning would lead you both to the *same* choice.
  4.  **Dominance Comparison:** Faced with the choice between the *actual possible* outcomes (CC or DD), CC yields a higher payoff for you than DD.
  5.  **Conclusion:** A rational agent, knowing they face an identical copy, must choose Cooperate. Choosing Defect would imply the copy chooses Defect (due to symmetry), leading to DD, which is worse than CC.

  **Why it works without causation:** The causation in the mirror is a flawed *mechanism* for explaining the outcome correlation. The *real* mechanism guaranteeing outcome correlation is **logical necessity arising from identical rationality applied to an identical decision problem.** Your choice doesn't *cause* theirs; rather, the symmetry dictates that whatever choice a rational agent makes in this situation, the identical copy *must* make the same choice. You are both "caused" to choose the same thing by the identical application of your shared rationality to the shared situation.

  ### 3. A Better Analogy: Synchronized Swimmers or Rowers

  *   **The Analogy:** Imagine you and an identical partner are performing a perfectly synchronized routine (like swimmers or rowers). You don't control your partner's arms; you both independently execute the same pre-agreed plan based on identical training and goals.
  *   **Why it's Better:**
      *   **No False Causation:** Your movements don't *cause* your partner's; they are correlated because you both follow the same script/reasoning.
      *   **Active Identical Reasoners:** Both agents are actively performing based on identical decision rules.
      *   **Outcome Correlation:** Success (CC) requires both choosing the cooperative action ("stroke"). Failure (DD) occurs if both independently defect ("stop stroking").
      *   **The Rational Choice:** Knowing your partner is identical and will execute the same reasoning, you choose the action that, when performed by both, leads to the best outcome - the cooperative stroke. Choosing to defect (stop) guarantees mutual failure because your identical partner will also defect (stop).
  *   **The Core:** Symmetry (identical goals, training, reasoning) dictates that only coordinated outcomes (both stroke/both stop) are possible. Rationality compels choosing the mutually beneficial coordinated action.

  ### 4. Does the Voting Extension Survive?

  **No, the voting extension largely fails, especially for "similar" rather than "exact duplicate" voters.**

  Here's why:

  1.  **Lack of Exact Symmetry:** Voters who think "my vote doesn't matter" are *similar*, not *exact duplicates*. Their thresholds for action, specific calculations of probability, level of altruism, or perception of civic duty might differ slightly. Crucially, they don't *know* they are facing a room full of *exact* duplicates.
  2.  **The Outcome Isn't Binary/Correlated:** Voting outcomes aren't determined by a single symmetric pair, but by the *aggregate* of many heterogeneous voters. Your vote doesn't correlate perfectly with thousands of "similar" voters' choices. Many might vote despite the logic, or be swayed by other factors.
  3.  **Negligible Individual Impact Remains:** Even if *everyone* who thought like you stayed home, your *individual* vote *still* wouldn't have decided the election. The argument against voting ("one vote never matters") is fundamentally about the *causal impotence* of a single vote in a large electorate, which the symmetry argument doesn't overcome. The benefit of voting comes from collective action, but the cost/benefit for the *individual* remains skewed.
  4.  **No Logical Necessity for Identical Action:** There's no logical contradiction if some "similar" people vote and others don't. They might weigh the tiny probability of being pivotal differently, or get different utility from the act of voting itself, or have different beliefs about how many others like them exist. The Prisoner's Dilemma symmetry creates a logical *imperative* for identical action; the voting scenario for "similar" people does not.
  5.  **Different Payoff Structure:** Voting isn't a strict Prisoner's Dilemma. The "cost" (time/effort) is borne individually regardless of outcome. The "benefit" (desired candidate winning) is a public good enjoyed by all supporters if achieved, whether they voted or not. The symmetry argument doesn't change the fundamental free-rider problem inherent in large-scale public goods provision.

  **Conclusion on Voting:** The mirror/symmetry argument works powerfully in the idealized one-shot PD with an *exact* duplicate because symmetry logically forces outcome correlation, making mutual cooperation the strictly dominant choice among the possible outcomes. This breaks down completely in voting with merely "similar" people. The individual calculus of negligible impact and personal cost vs. diffuse shared benefit remains dominant. Symmetry among similar agents is too weak and the collective action problem is too large for the PD symmetry argument to overcome. Encouraging voting requires different arguments (e.g., duty, expressive value, minimizing regret, contributing to a critical mass).
