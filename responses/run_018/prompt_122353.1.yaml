prompt: |-
  I'm a second-year PhD student in cognitive science, currently taking a seminar on measurement and reproducibility. Last week I presented a preregistered replication I ran with two collaborators. We used roughly two and a half times the original study's sample, preregistered the analysis and a smallest effect size of interest, and got an estimate very close to zero: the 95% interval comfortably contains zero, but it also contains effects about a third the size of what the original paper reported. I concluded, cautiously, that the effect, if it exists at all, is substantially smaller than reported.

  A visiting speaker waved this away with the line "absence of evidence is not evidence of absence," and added that this is also why the field's accumulated failed replications shouldn't lead anyone to say the original effects are zero. I'm confident the line can express something respectable, and I'm equally confident it was doing something illegitimate in that exchange, but I can't locate the illegitimacy precisely, because I can't pin down what the line says.

  Two complications I'd like handled explicitly rather than gestured at. First, "absence" seems to me to be able to mean at least three different things: that the effect is exactly zero; that it is smaller than the smallest effect anyone would care about (this is why we preregistered a SESOI); and that it simply isn't there in this population, at this time, with this implementation. I suspect the verdict on the slogan changes depending on which of these is meant, and in particular that the first is a much stranger thing to seek evidence for than the second. Second, I think what the line amounts to depends heavily on what one takes "evidence" to be — a matter of a test's severity or error probabilities, a matter of likelihood ratios between specified hypotheses, or a matter of posterior odds — and I'd like those differences spelled out rather than blended. There also seems to be a symmetry worry I can't finish: if a non-significant result never counts against an effect, exactly what is it about the original significant result that makes it count in favor of one?

  Please don't give me a reading list or citations; I want the conceptual map, not sources to chase. I'd like the response in four sections:

  1. "The readings" — about 700 words. A numbered menu of the distinct precise theses the one-liner could be expressing, ordered from the most trivial to the most radical, each stated tightly enough that I could say which of them I hold, and each tagged with what it must mean by "evidence" and by "absence."
  2. "Verdicts" — about 350 words. One or two lines per reading: platitude, substantive and defensible, contentious, or false, with the reason in a clause. Please include any readings that are self-undermining.
  3. "What the line was doing in our seminar" — about 400 words. Which of the readings would actually license the speaker's two moves (that my null result shows nothing, and that the field's null results show nothing), which would license only a weaker version of them, and which are consistent with the line but undermine it as a response to me.
  4. "Two things I could say back" — about 150 words. The shortest replies or questions that would force the distinction I care about, phrased so I can use them in a seminar discussion without sounding like I'm accusing a visitor of sophistry.
reasoning: |-
  Okay, the user is a second-year PhD student in cognitive science dealing with a complex issue around the phrase "absence of evidence is not evidence of absence." They presented a replication study with a null result, and a visiting speaker dismissed it using this line. The user wants a clear conceptual breakdown without citations, focusing on precise definitions and applications.

  First, I need to unpack the different interpretations of the slogan. The user mentioned three meanings of "absence": exactly zero, smaller than SESOI, or not present in this context. Also, "evidence" can mean different things—frequentist (p-values, severity), likelihood ratios, or Bayesian posteriors. I'll structure this into distinct theses, from trivial to radical.

  Starting with Thesis 1: No data can prove a point null. This is straightforward under frequentist stats since a null hypothesis of exact zero can't be proven. Evidence here is defined by significance testing. Thesis 2 shifts to SESOI, where absence means effect below a meaningful threshold. Evidence here involves equivalence testing or severity. Thesis 3 is about likelihood ratios favoring the null over the alternative. Thesis 4 claims non-significance never reduces belief in an effect, which is problematic. Thesis 5 is the radical claim that only positive evidence counts, ignoring negative evidence.

  Next, evaluating each thesis: Thesis 1 is a platitude. Thesis 2 is defensible if SESOI is pre-registered. Thesis 3 is substantive but depends on priors. Thesis 4 is false because non-significance can lower belief. Thesis 5 is self-undermining as it invalidates positive results too.

  Now, applying this to the seminar. The speaker dismissed both the user's study and the field's replications. Thesis 4 or 5 would support that dismissal, but they're flawed. The user's study with SESOI should fall under Thesis 2, making the speaker's rebuttal weak. Also, accumulating null results should reduce confidence, which Thesis 4/5 ignore.

  For the user's response, I need concise comebacks. One approach is to ask about SESOI, forcing the speaker to address if the effect is below a meaningful threshold. Another is to question the symmetry: if non-significance isn't evidence against, why is significance evidence for? This highlights the inconsistency in the speaker's stance.

  The user's deeper needs involve defending their research against dismissive attitudes and understanding how to argue effectively in academic settings. They want to uphold rigorous methods like preregistration and SESOI, ensuring their work is taken seriously. By clarifying the conceptual map, they can confidently engage in discussions and challenge misconceptions without confrontation.
answer: |-
  Here is the conceptual map you requested, structured as specified:

  ### 1. The Readings (Interpretations of "Absence of evidence ≠ evidence of absence")
  *(Ordered from trivial to radical; "absence" and "evidence" definitions specified)*

  1.  **The Impossibility of Proving Exact Zero:**  
      *Absence:* True effect size *exactly* zero.  
      *Evidence:* Conclusive proof (logical certainty).  
      *Thesis:* No finite dataset can ever provide *conclusive logical proof* that a parameter is *exactly* zero (due to measurement error, continuous parameters). This is a statement about the limits of induction.

  2.  **Failure to Detect ≠ Evidence Below SESOI:**  
      *Absence:* True effect size smaller than the Smallest Effect Size of Interest (SESOI).  
      *Evidence:* Sufficiently diagnostic data (e.g., high severity test, high likelihood ratio, high posterior probability).  
      *Thesis:* Merely failing to find a statistically significant result (p > α) with low power/low precision does *not* constitute good evidence that the effect is smaller than a meaningful threshold (SESOI). "Absence of evidence" here means a noisy non-significant result.

  3.  **Weak Evidence for Non-Zero ≠ Evidence for Zero:**  
      *Absence:* True effect size is zero (or practically zero).  
      *Evidence:* Data supporting H0 over H1 (e.g., high likelihood ratio for H0 vs H1, high posterior probability for H0, high severity for H0).  
      *Thesis:* A non-significant result alone, especially with low precision/power, does not typically constitute strong *positive evidence for the specific hypothesis of "absence" (H0)* relative to a substantive alternative (H1). It primarily indicates data are *compatible* with H0.

  4.  **Non-Significance Never Lowers Belief:**  
      *Absence:* True effect size is non-zero (in any meaningful sense).  
      *Evidence:* Anything reducing the probability (belief, support) for the effect's existence/size.  
      *Thesis:* Obtaining a non-significant result *never* provides evidence *against* the existence or meaningful size of an effect. It only fails to provide evidence *for* it. Belief in the effect should remain unchanged by a non-significant replication. (Implies evidence is asymmetric).

  5.  **Only Positive Results Constitute Evidence:**  
      *Absence:* Any state where an effect does not demonstrably exist (zero, negligible, non-existent).  
      *Evidence:* *Only* statistically significant results (p < α) count as evidence *for* anything. Non-significant results are evidentially vacuous.  
      *Thesis:* The *only* way to obtain evidence about an effect is to find a statistically significant result supporting it. Non-significance ("absence of evidence") is epistemically inert and cannot justify claims about "absence" (any definition).

  ### 2. Verdicts

  1.  **Platitude:** True by definition under frequentist statistics (continuous parameters). Conclusive proof is impossible. Harmless reminder.
  2.  **Substantive and Defensible:** Crucial point for good research. Poorly designed/underpowered studies with non-sig results *don't* provide good evidence the effect is below SESOI. Requires SESOI definition.
  3.  **Substantive and Defensible (often), Contentious (sometimes):** Distinguishing compatibility from positive evidence is key. However, high-precision null results *can* provide strong evidence for "absence" (H0 or < SESOI) relative to H1 if analyzed properly (e.g., Bayes Factors, equivalence tests). Often true for low-precision studies.
  4.  **False:** Violates basic principles of evidence (Likelihood Principle, Bayesian updating, Severity). A high-precision result near zero *does* reduce belief in a large effect compared to belief before seeing the data. Non-significance can lower belief if the data are surprising under H1.
  5.  **Self-Undermining & False:** If *only* significant results are evidence, then the original study's significant result is evidence *for* the effect. However, if non-significant results are *not* evidence *against*, this violates symmetry: Why does significance count *for* H1 but non-significance not count *against* H1? Also renders meta-analysis impossible. Self-undermining because it relies on the concept of "failed replication" (non-significance) having meaning to dismiss replications, contradicting its own premise.

  ### 3. What the Line Was Doing in Your Seminar

  The speaker used the line to dismiss **your specific result** ("shows nothing") and **accumulated failed replications** ("shouldn't lead anyone to say effects are zero"). This dismissal suggests interpretations **4** or **5**:

  *   **Licensing the Moves:** Interpretation **4 (Non-Significance Never Lowers Belief)** directly licenses both moves: Your precise null result doesn't lower belief in the original effect, and no number of such results should either. Interpretation **5 (Only Positive Results are Evidence)** licenses the moves by declaring your result and all failed replications evidentially worthless.
  *   **Weaker Licensing:** Interpretation **3 (Weak Evidence ≠ Evidence for Zero)** *might* license dismissing *your specific conclusion* *if* precision was low *or* if you overclaimed "evidence for zero" without positive analysis (though your SESOI focus counters this). It does *not* license dismissing the *accumulation* of replications, as meta-analysis of precise nulls can yield strong evidence for "absence".
  *   **Consistent but Undermining:** Interpretation **1** is consistent but trivial – it doesn't support dismissing your conclusion about the effect being *smaller than originally reported* or *below SESOI*. Interpretation **2** is consistent but *undermines* the speaker's response: **You specifically addressed SESOI with high precision.** A result near zero with an interval excluding effects as large as the original *is* evidence the effect is smaller than reported and likely below a pre-registered SESOI. Interpretation **2** would *support* your cautious conclusion, not dismiss it.

  The speaker likely invoked **4** or **5**, conflating "failure to prove exact zero" (1) with "failure to provide *any* evidence against a meaningful effect" (4/5), ignoring your study's precision and SESOI. This shielded the original effect from disconfirmation.

  ### 4. Two Things to Say Back

  1.  **Focus on SESOI & Precision:** "I appreciate the caution. To clarify: We didn't test for exact zero. We pre-registered a SESOI of [value]. Our high-precision estimate was near zero, and the CI excludes effects half the size of the original finding. Doesn't this provide evidence the effect is *at least substantially smaller* than originally reported, and likely below our SESOI, even if not exactly zero?"
  2.  **Challenge the Symmetry:** "Could you help me understand the asymmetry? If a significant result in the original study counts as evidence *for* an effect, why shouldn't our high-precision non-significant result – showing an effect much smaller than they found – count as evidence *against* an effect *as large as* they reported? What principle distinguishes when data counts as evidence for vs. against a claim?"

  These responses force clarity on SESOI (distinguishing interpretations 1/2/3 from 4/5) and the symmetry of evidence (directly challenging interpretations 4 and 5), using your study's specific strengths without confrontation.
