answer: |-
  Here's a comprehensive set of desiderata for a theory of gradated moral status, addressing your core concerns about phenomenal resolution, clear/ambiguous cases, constraints, and tensions:

  **Core Desiderata for a Theory of Gradated Moral Status**

  | Desideratum                                                                 | Category          | Non-Negotiable? | Notes/Tensions                                                                 |
  | :-------------------------------------------------------------------------- | :---------------- | :-------------- | :----------------------------------------------------------------------------- |
  | **1. Accommodate Phenomenal Resolution (Bandwidth/Grain):** Must directly link moral status to the *richness, resolution, complexity, depth, or temporal integration* of subjective experience (if present). | Foundational      | **Yes**         | **Does the most damage to binary theories.** Directly challenges the "light switch" model by making the *quality* of sentience morally relevant. |
  | **2. Track Biological Continuity & Evolution:** Cannot contradict established neuroscience/biology showing gradual emergence of capacities (e.g., nociception → pain → suffering → complex emotions) across phylogeny. Must allow for smooth transitions. | Foundational/Constraint | **Yes**         | Forces gradation; binary theories struggle with ambiguous intermediates (insects, simple vertebrates). |
  | **3. Handle Clear Cases Robustly:** Must assign high moral status to entities with demonstrably rich, complex subjective experiences (e.g., neurologically typical adult humans, great apes, elephants, dolphins, likely cephalopods). | Foundational      | **Yes**         | Baseline for any plausible theory.                                              |
  | **4. Handle Ambiguous Cases Plausibly:** Must provide a principled way to assign *some* (likely low) moral status to entities with simple nociception/integration (e.g., insects, crustaceans, fish fry) without anthropomorphizing or dismissing them entirely. | Core Application  | **Yes**         | Where phenomenal resolution gradation is most critical and empirically challenging. |
  | **5. Assign Zero Status to Non-Sentient Entities:** Must clearly exclude entities lacking *any* subjective experience (e.g., thermostats, simple reflexes, plants, unconceived gametes). | Boundary Constraint | **Yes**         | Prevents moral inflation/absurdity.                                             |
  | **6. Distinguish Status Presence from Status Weight:** Must explicitly separate the question "Does it have *any* moral status?" (threshold) from "How *much* moral status/weight does it have?" (gradation). | Structural        | **Yes**         | Prevents collapse into binary thinking. Threshold may be minimal sentience capacity. |
  | **7. Respect the Moral Equality Floor (Tension):** Must incorporate a mechanism (e.g., basic rights, inviolability threshold) to protect humans (or other high-status entities) with *reduced* phenomenal resolution (e.g., severe dementia, infants, profound ID) from being assigned *lower* status than their intrinsic human dignity warrants. | Critical Tension  | **Negotiable HOW, not IF** | **Major Tension:** Balancing gradation based on resolution with fundamental equality/special moral protections for certain beings. Solutions vary (e.g., species membership as proxy, personhood concepts, high inviolability threshold). |
  | **8. Be Logically Consistent & Non-Arbitrary:** Gradation criteria must be defensible, objective (as possible), and avoid arbitrary cut-offs or speciesism. | Structural        | **Yes**         | Essential for theory credibility. Relies on best available science (neuro, ethology). |
  | **9. Generate Action-Guiding Principles:** Must translate gradations into practical moral distinctions (e.g., stronger obligations to reduce suffering in beings with higher resolution; permissible harms only at very low resolution with vital justification). | Pragmatic         | **Yes**         | Pointless without practical implications.                                       |
  | **10. Accommodate Uncertainty & Proxy Measures:** Must function with imperfect knowledge, using behavioral, neurological, and evolutionary proxies for phenomenal resolution. | Pragmatic         | **Negotiable**  | Essential for real-world application, but proxies are fallible.                 |
  | **11. Scalability:** Must apply across the vast spectrum of possible entities – from thermostats to humans to potential future AGI/aliens. | Scope             | **Negotiable**  | Desirable for robustness, but focus can be terrestrial biology.                 |
  | **12. Avoid Moral Cliffs:** Should minimize drastic changes in status/obligations from small increases in capacity (e.g., insect A vs. very similar insect B). | Anti-Arbitrariness| **Negotiable**  | Flows from Des. 2 & 8; mitigates edge-case problems of binary theories.         |

  **Key Takeaways & Analysis:**

  1.  **The Binary Killer:** **Desideratum 1 (Phenomenal Resolution)** is the core challenge to binary theories. Neuroscience suggests sentience isn't monolithic; its *structure* matters morally. A binary theory cannot capture why causing suffering to a being capable of rich, complex, temporally extended suffering (a mammal) seems intuitively worse than causing a nociceptive reaction in a being with minimal integration (e.g., a fruit fly larva), even if both possess *some* sentience.
  2.  **The Foundational Tension:** **Desideratum 7 (Moral Equality Floor)** creates the most significant tension within a gradation framework. How can humans with very low current phenomenal resolution (e.g., advanced dementia) retain full moral status if status is tied to resolution? This is non-negotiable in practice (societies won't accept devaluing these humans). Solutions are *negotiable*:
      *   **Inviolability Threshold:** Set a relatively low threshold for minimal sentience (e.g., basic capacity for aversive experience). Once crossed, entities receive *strong, near-absolute protections* based on kind/potential/personhood, not further gradation. Gradation applies *below* this threshold or only to positive welfare promotion.
      *   **Kind-Based Protections:** Assign special status based on membership in a kind (e.g., Homo sapiens) known *typically* to possess high resolution, granting protections even to impaired members.
      *   **Potentiality:** Grant status based on the *typical* potential or developmental trajectory of the kind.
      *   **Hybrid Models:** Combine gradation for welfare considerations (e.g., how much suffering matters) with binary thresholds for fundamental rights (e.g., right not to be killed/owned).
  3.  **Non-Negotiable Core:** Desiderata 1-6 and 9 form the absolute core. A theory failing these is either not gradational, biologically implausible, practically useless, or collapses into arbitrariness.
  4.  **Ambiguous Middle is Key:** Desideratum 4 is where the theory *earns its keep*. Assigning *some* (low) status to insects based on plausible (but not definitive) evidence of minimal phenomenal resolution, while justifying why obligations to them are weaker than to mammals, is critical. It avoids the false binary choice of "full status like humans" or "no status like a rock."
  5.  **Science as Constraint, Not Dictator:** Desideratum 2 ensures the theory is grounded in biology but doesn't require accepting every contested claim (e.g., strong insect sentience). It must be *compatible* with the evolutionary continuum and neural evidence, not deny it. Desideratum 8 ensures gradation arguments are principled, not just appeals to intuition or convenience.

  This framework provides the necessary structure and constraints for developing a theory of gradated moral status centered on phenomenal resolution, while explicitly acknowledging and grappling with its hardest challenge: reconciling gradation with fundamental equality protections.
