prompt: |-
  hey, quick sanity check for my diss chapter on rational belief and objective chance. I've been reading up on Lewis's Principal Principle and I'm stuck on what feels like a basic tension. The way I understand it, if I know the objective chance of heads is .5, then PP says my credance should be exactly .5, and the only evidence I'm allowed to combine with that is admissable evidence—stuff that doesn't directly concern the actual flip. But that seems to block Bayesian updating entirely: if I flip the coin ten times and see heads every time, that observational data is about the actual flips, so by the admissability restriction I should just ignore it and stay at .5? Or does the principle actually say my credance in the chance being .5 should update, while my credance in the next heads stays pinned?

  I'm trying to argue that the PP is essentially anti-Bayesian because it locks credances to chance values regardless of empirical frequency data, but my advisor said I'm conflating levels. Can you give me a committed answer—don't just lay out both interpretations? I want to know: is the principle genuinely in conflict with standard Bayesian conditioning on outcomes, or is the confusion just in how I'm applying the admissability clause? And if it's the latter, what's the specific mistake—am I treating outcome-evidence as admissable when it's actually inadmissable, or vice versa?

  Also, if the answer depends on whether we take chances to be Humean frequencies vs propensities, does that change the verdict? I don't need a bibliography or citations, just a clear take with reasons.
reasoning: |-
  Okay, the user is working on their dissertation chapter about rational belief and objective chance, specifically focusing on Lewis's Principal Principle (PP). They're stuck on what they perceive as a tension between PP and Bayesian updating. Let me unpack their query.

  First, they understand that PP dictates setting credence to the known objective chance (e.g., 0.5 for a fair coin). The issue arises when they consider observational data—like flipping ten heads in a row. They think that according to PP's admissibility clause, such evidence is inadmissible because it's about the actual outcomes, so they should ignore it and maintain 0.5 credence. But this seems to conflict with Bayesian updating, which would adjust credence based on new evidence. Their advisor mentioned they're conflating levels, so I need to address that.

  The user's main argument is that PP is anti-Bayesian because it locks credences regardless of empirical data. They want a committed answer on whether PP conflicts with Bayesian conditioning or if they're misapplying admissibility. They also ask if the answer changes based on whether chances are Humean or propensities.

  I recall that Lewis's PP connects credence with objective chance. The key here is distinguishing between two types of credences: credence in a specific outcome (e.g., next coin flip) and credence in the chance hypothesis itself. The user's confusion might stem from not separating these levels. When they observe ten heads, that evidence should update their belief about the chance being 0.5, not their conditional credence given that chance. 

  Admissibility is crucial here. Evidence about past outcomes is inadmissible for the conditional credence in an outcome given a chance hypothesis because it provides information that might indicate the chance isn't actually 0.5. So, PP doesn't block Bayesian updating; it just applies it at the level of chance hypotheses. The user's mistake is treating outcome evidence as admissible for the conditional credence when it's not. Instead, they should use that evidence to update their credence in the chance hypothesis itself via Bayes.

  Regarding Humean vs. propensities, for Humean views like Lewis's, chances supervene on the entire pattern of events, so ten heads might suggest the chance isn't 0.5. For propensities, the chance might be an intrinsic property, so ten heads might not directly affect the propensity. But in either case, the update happens at the hypothesis level, not within PP's conditional credence.

  The user needs to clarify that PP governs how chances constrain credences when the chance is known, but when evidence challenges that knowledge, Bayesian updating revises the credence in the chance hypothesis. The advisor's point about conflating levels is spot-on. The user's argument against PP as anti-Bayesian is incorrect because it overlooks this hierarchical structure. Their specific mistake is applying outcome evidence directly to the conditional credence instead of updating the hypothesis credence first.
answer: |-
  Here's your committed take: **You're misapplying the admissibility clause, and the confusion stems from conflating *credence in an outcome given a chance hypothesis* with *credence in the chance hypothesis itself*. The Principal Principle (PP) is *not* anti-Bayesian; it's explicitly designed to work *within* a Bayesian framework by constraining initial credences and defining how chance interacts with evidence.** Here's the breakdown:

  1.  **The Core Mistake:** You're treating *outcome evidence* (the ten heads) as if it *must* be incorporated *directly* into your credence for the *next flip* **while still conditioning on the chance hypothesis (Ch = 0.5)**. PP *forbids* this because that outcome evidence **is inadmissible relative to the hypothesis Ch = 0.5**.

  2.  **How PP *Actually* Handles Outcome Evidence (Like the 10 Heads):**
      *   The ten heads are **inadmissible evidence** for the conditional credence `Cr(Heads on flip 11 | Ch = 0.5 & E)`. Why? Because `E` (the ten heads) *does* carry information relevant to whether `Ch = 0.5` is actually true. It *screens off* the direct relevance of `Ch = 0.5` for predicting flip 11 *if you condition on `E` itself.
      *   PP **does not say** your credence in the *next flip* should stay 0.5 *after seeing the ten heads*. It says that **if you *knew for certain* the chance was *still* 0.5**, *then* your credence should be 0.5. But the ten heads *precisely undermine your certainty* that `Ch = 0.5` is true.
      *   **What you *must* update is your credence *in the chance hypothesis itself*.** You start with some prior credence distribution over possible chance hypotheses (e.g., `Ch = 0.5`, `Ch = 0.6`, `Ch = 0.7`, etc.). Observing ten heads is *highly relevant evidence* for updating these credences via **standard Bayesian conditionalization**.
      *   Your credence in the next flip (`H11`) isn't "pinned" by PP ignoring evidence. Instead, it becomes a **weighted average**: `Cr(H11 | Total Evidence) = Σ [Cr(H11 | Ch = x & Total Evidence) * Cr(Ch = x | Total Evidence)]`. PP tells you that *within each term of this sum*, `Cr(H11 | Ch = x & Total Evidence) = x` (assuming the total evidence doesn't include future-tensed or inadmissible info *for that specific x*). So:
          `Cr(H11 | Ten Heads) = Σ [x * Cr(Ch = x | Ten Heads)]`
      *   After ten heads, `Cr(Ch = 0.5 | Ten Heads)` plummets, while `Cr(Ch = 0.9 | Ten Heads)` or `Cr(Ch = 1 | Ten Heads)` increases. Your overall credence for `H11` becomes **higher than 0.5** – precisely because you've *updated your beliefs about the underlying chance* using the evidence, *not* because you applied PP directly to the outcome evidence while clinging to `Ch=0.5`.

  3.  **Admissibility Clarified:** Your mistake was **treating outcome evidence (the ten heads) as *admissible* relative to the hypothesis `Ch=0.5`.** It's **inadmissible** *precisely because* it concerns the actual outcomes and is highly relevant to assessing the truth of `Ch=0.5`. PP only mandates `Cr(A | Ch(A)=x & E) = x` when `E` is *admissible* relative to `A` and `Ch(A)=x` – meaning `E` doesn't "give more information about whether A is true than is already given by [Ch(A)=x]" (Lewis). The ten heads absolutely give more information.

  4.  **Humean vs. Propensity (Doesn't Change the Core Verdict):**
      *   **Humean (Lewis's View):** Chances supervene on the entire pattern of events in the world (or a suitable part). Ten heads *strongly suggests* the overall pattern isn't what we'd expect from `Ch=0.5`, so `Cr(Ch=0.5 | Ten Heads)` drops dramatically. PP still constrains conditional credences *given a chance hypothesis*, but the evidence forces you to reconsider *which* hypothesis is likely true.
      *   **Propensity:** Chances are intrinsic properties. Ten heads *might* be freakishly unlikely but possible under `Ch=0.5`. How much `Cr(Ch=0.5 | Ten Heads)` drops depends on your prior beliefs about how stable propensities are and how likely such a streak is. *But*, the ten heads are still **inadmissible** evidence for `Cr(H11 | Ch=0.5 & Ten Heads)`. PP *still* doesn't force you to keep `Cr(H11)` at 0.5; it forces you to lower `Cr(Ch=0.5)` and average over your new credences in chance hypotheses.
      *   **The Verdict Holds:** In *both* interpretations, the outcome evidence is **inadmissible** for the conditional credence `Cr(A | Ch(A)=x & E)`. PP does *not* lock your credence in `A` to `x` regardless of empirical data; it locks your credence in `A` *conditional on Ch(A)=x and admissible evidence* to `x`. The empirical data forces you to update your credence *about what the chance is*. **The conflict you perceive is illusory; PP governs the *conditional* link between chance and credence, while Bayesian updating governs how evidence changes your beliefs *about which chance hypothesis is true*.** Your advisor is right: you're conflating the object-level credence (`A`) with the meta-level credence (`Ch(A)=x`).

  **Conclusion:** Your argument that PP is anti-Bayesian is incorrect. The mistake is a **misapplication of admissibility**: you treated direct outcome evidence (the ten heads) as if it *should* be admissible for the conditional credence `Cr(Heads | Ch=0.5 & TenHeads)`, when in fact it is **paradigmatically inadmissible**. PP seamlessly integrates with Bayesianism by specifying how chances constrain rational initial credences and conditional credences *given a chance hypothesis*, while Bayesian updating operates on your credences *over those chance hypotheses* in light of new evidence. The tension vanishes once you rigorously distinguish between conditioning *on* a chance hypothesis and updating your belief *in* that hypothesis.
