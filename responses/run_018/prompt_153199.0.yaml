prompt: |-
  hey — i'm drafting a chapter on Lewisian conventions and this argument is definately suspicious. here's the chain i'm stuck on:

  (1) For Lewis, a convention is an arbitrary regularity that solves a recurrent coordination problem in some population P, sustained by common knowledge and a conditional preference for conformity.

  (2) Once R is in place, the reason any individual in P has to stick with R is that deviation breaks coordination and frustrates others' expectations.

  (3) Now take a zombie convention: a regularity that survives long after the original coordination problem has vanished or changed form. Think of hyper-elaborate IRB consent rituals for minimal-risk online survey work — the original problem (protecting subjects from physical harm) isn't there anymore.

  (4) Even in zombie cases, common knowledge still holds: everyone knows everyone expects R, and people generally prefer not to rock the boat.

  (5) So by (1)-(2), individuals in P are still genuinely bound by R.

  (6) But if R is now actively harmful — it deters useful research, creates false assurance, etc. — then an individual researcher who sees this clearly ought to be able to break R without being irrational or immoral.

  (7) If Lewis denies (6), then individual moral insight is impossible whenever a zombie convention is in place.

  (8) That seems false. So either Lewis's account doesn't generate real obligations, or something in the chain is wrong.

  (9) Therefore conventions can't ground obligations in zombie cases.

  where's the slip? i really want to keep (6) — that individual insight should matter — but i'm not sure if i'm misapplying the preference condition (maybe it has to be present-tense?), or if there's a scope shift between population-level regularity and individual-level duty. which step should i reject and what does that cost?

  please also separate what's settled in the literature from what's genuinely contested — don't present one reading of Lewis as the consensus if it's actually fought over.
reasoning: |-
  Okay, the user is working on a chapter about David Lewis's conventions and has this argument about "zombie conventions" that seems suspicious. They've laid out a clear chain of reasoning from (1) to (9) and want to know where the slip is. 

  First, I need to understand their core concern. They're stuck on whether Lewis's framework forces us to accept that harmful, outdated conventions still create genuine obligations. They strongly want to preserve (6) - that individual moral insight should allow breaking such conventions. But their argument suggests Lewis might block this, leading to absurd conclusions about moral insight being impossible.

  Hmm, looking at their steps... The key tension is between Lewis's formal conditions (common knowledge + conditional preference) and the normative intuition that pointless/harmful rules shouldn't bind us. The user suspects the slip might be in how "preference for conformity" works, or a population-vs-individual scope issue. Smart hunches.

  Let me walk through the logic carefully. Premises (1)-(4) seem solid Lewis. (5) is where it gets shaky - are people *bound* just because common knowledge exists? Lewis is descriptive, not prescriptive! His account explains why conventions persist, not why they *should*. The conditional preference is key: if someone stops preferring conformity *because* they see the harm, that preference condition fails. Lewis actually builds in an escape hatch!

  The user might be conflating two things: what explains convention persistence (Lewis's project) vs what creates obligations (which requires normative add-ons). Philosophers like Margaret Gilbert or Joseph Heath have debated this - it's contested territory. The literature doesn't have consensus on whether Lewisian conventions entail obligations at all.

  Also, "conditional preference for conformity" is dynamic. If the coordination problem vanishes, that preference might reasonably decay for some people first (like the researcher who sees the harm). Zombie conventions often persist through inertia, not robust preference. So step (4) might oversimplify - "generally prefer not to rock the boat" isn't the same as Lewis's specific conditional preference tied to solving coordination problems.

  The user's worry about moral insight being impossible (step 7) is powerful but rests on misreading Lewis as normative. Rejecting (5) as overstated preserves both Lewis's framework and moral agency. Cost? We have to supplement Lewis with normative theory to get obligations. Benefit? Avoids the absurd conclusion.

  Should flag that some scholars (like Sugden) do push Lewis toward normativity, so this isn't settled. But the cleanest fix aligns with Lewis's own positivist approach. User gets to keep their moral insight intuition while accurately representing Lewis.
answer: |-
  Your argument identifies a genuine tension in Lewis's framework—one that's actively debated in the literature. The slip occurs at **step (5)**, but the implications require careful unpacking. Here's a breakdown:

  ### Where the Argument Falters: Step (5)
  > **(5) So by (1)-(2), individuals in P are still genuinely *bound* by R.**

  **The Problem:**  
  Lewis's account is **descriptive/explanatory**, not **normative**. He explains *why* conventions persist (via common knowledge and conditional preferences), but **does not claim they generate moral or rational obligations**. Step (5) smuggles in a normative claim ("genuinely bound") that Lewis avoids. For Lewis, conformity stems from *instrumental rationality*: agents comply because they *believe* others expect compliance and *prefer* coordinating over not coordinating. If the original coordination problem vanishes, the **conditional preference for conformity** may dissolve, undermining the convention.

  ### Why Rejecting (5) Solves the Problem
  1. **Lewis's Conditional Preference is Dynamic**:  
     The preference for conformity is conditional on R solving a coordination problem *for the agent* (Lewis, *Convention*, 1969, p. 42). If an agent realizes R no longer solves any problem (or is harmful), their preference shifts. They no longer have a reason to conform *even if common knowledge persists* (step 4).  
     - *Example*: The researcher in (6) sees R as harmful. Their conditional preference vanishes → no "binding" force remains.  
     - **Cost**: This requires accepting that conventions can persist *temporarily* via inertia or false beliefs, but Lewis allows this (e.g., "path-dependent" conventions).

  2. **"Obligation" vs. "Equilibrium"**:  
     Lewis treats conventions as **Nash equilibria**. In zombie cases, R remains an equilibrium only if *enough* people retain conditional preferences. An individual who defects isn't "irrational" if they correctly perceive the changed context—they simply exit the equilibrium.  
     - *Literature Note*: Edna Ullmann-Margalit (*The Emergence of Norms*, 1977) argues norms can arise from conventions, but Lewis himself avoids this move. The leap from "regularity" to "obligation" is contested.

  ### Addressing Your Concerns
  - **Keeping (6)**: You can! Rejecting (5) allows individuals to break zombie conventions *without* defying Lewis. The researcher acts rationally if their preference shifts due to R’s harmfulness.
  - **Scope Shift**: Correctly identified. Lewis’s account is population-level; individual duty isn’t entailed. Obligations require additional normative machinery (e.g., Gilbert’s joint commitments).
  - **Preference Condition**: Must be present-tense. Lewis’s preferences are grounded in *current* incentives (p. 76). If the coordination problem disappears, preferences can change.

  ### Contested vs. Settled in Literature
  | **Aspect**                     | **Settled?** | **Contested Views**                                                                 |
  |--------------------------------|--------------|-------------------------------------------------------------------------------------|
  | Lewis = Descriptive, not Normative | Mostly Yes   | Sugden (1986) argues conventions *imply* obligations; Gilbert (1989) denies Lewis suffices for obligations. |
  | Preference Condition is Dynamic | Yes          | No major dissent; Lewis is explicit.                                                |
  | Can Conventions Ground Obligations? | **Hotly Contested** | **Pro:** Margaret Gilbert (joint commitments), Michael Bratman (shared intentions). **Con:** Lewis (explicitly agnostic), Ruth Millikan (teleofunctions ≠ oughts). |
  | Zombie Conventions Persist?    | Yes          | But via *inertia/misinformation*, not robust preferences (Lewis, pp. 87–88).        |

  ### Recommendation for Your Chapter
  1. **Reject (5)** as an overstatement. Conclude:  
     > *Lewis's framework does not entail that individuals are "bound" by zombie conventions. When conditional preferences dissolve due to changed circumstances, defection is rational—even if common knowledge persists.*  
     
  2. **Bridge to Normative Questions**:  
     Acknowledge that Lewis *explains* conformity but doesn't resolve whether we *should* conform. This opens space for critiques (e.g., by feminists or critical theorists) that conventions can mask power structures—zombie conventions might persist due to institutional coercion, not genuine preferences.

  3. **Key Citations for Nuance**:  
     - Lewis (1969): §§ I.3, II.2 (preferences as conditional), IV.4 (path dependence).  
     - Gilbert, M. (1989): *On Social Facts* (why Lewisian conventions ≠ obligations).  
     - Miller, S. (2001): "Social Norms" (zombie cases as coordination traps).  
     - Brennan et al. (2013): *Explaining Norms* (empirical decay of conventions).

  This preserves Lewis’s core model while allowing moral insight to override zombie conventions—a move consistent with his rational-choice framework. The cost is accepting that conventions don’t *inherently* create obligations, which is Lewis’s stated view.
