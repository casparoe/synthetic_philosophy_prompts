  ## Sestina for the Unrenderable Maiden
  *(After Hofstadter, wrestling with Marot)*

  **First Draft: Seeking the Core**
  This fragile *form*, a vessel spun from air,
  Holds more than simple dictionary *sense*.
  The translator's first, inevitable *loss* –
  The *source*-spring's music, bubbling pure and clear,
  Rebounds as faintest, fading, false *echo*,
  Bound by the target language's *constraint*.

  **Second Draft: Tightening the Net**
  The quill now feels the metre's cold *constraint*,
  Distorting the original *form*.
  The maiden's sigh, a mere transcribed *echo*,
  Betrays the true affective *sense*.
  We chase the ever-receding *source*,
  Counting each syllable, each fresh *loss*.

  **Third Draft: Meaning Starts to Slip**
  Each compensatory clause admits a *loss*,
  A sacrifice to meet the verse's *constraint*.
  Where is the warmth, the *source* of tender grace?
  The sick child's plea distorts the rigid *form*.
  Her fragile hope loses its native *sense*,
  Becomes a thin, conceptual *echo*.

  **Fourth Draft: Echoes Grow Fainter**
  Through layers of imposed tongue, just an *echo*
  Whispers of the original's deep *loss*.
  "Be brave, dear heart" – retained, but not in *sense*?
  The need for perfect rhyme demands *constraint*,
  Shattering the delicate glass *form*,
  Obliterating the emotional *source*.

  **Fifth Draft: The Cost Mounts**
  We grasp at straws, invent a fictive *source*
  To justify the weak, refracted *echo*.
  Is this pale ghost worth such artistic *loss*?
  The strict rotation, cruel *constraint*,
  Now governs every syllable and *form*.
  True feeling drowns in lexical *sense*.

  **Sixth Draft: Fidelity Fragments**
  The dictionary yields a hollow *sense*,
  A poor replacement for the living *source*.
  The translator weeps, seeing the wrecked *form*:
  Her fevered glass reflects a broken *echo*.
  This final, desperate, metred *constraint*
  Reveals the totality of *loss*.

  **Envoi**
  O sickly *source*, your fragile plea's true *sense*
  Is choked by rhyme's imprisoning *constraint*,
  Leaving mere *echo* in the *form*'s cold tomb – that *loss*.
