  My friend and I spent most of last night arguing about whether the frame problem in artificial-intelligence planning is a genuine metaphysical puzzle about representing change, or merely an artifact of a particular formal notation. She insists that once you adopt successor-state axioms the difficulty dissolves into routine bookkeeping; I suspect that even then there is a residual ambiguity about which properties persist and which do not, an ambiguity that reappears in any representational scheme that tries to separate explicit effects from silent omissions. Rather than keep going in circles, I want to see whether translating the debate into a vocabulary I understand better—contract law—exposes a real conceptual gap or just reveals my confusion.

  I am fairly fluent in contract interpretation: implied terms, conditions precedent, the parol evidence rule, express versus implied amendments, and the doctrines that determine which obligations survive a contractual change without being restated. I have no formal training in logic or AI. Please restate the frame problem itself, the standard frame-axiom strategy, and the successor-state-axiom response entirely within that contractual vocabulary. For each, say what corresponds precisely—what plays the role of listing every unchanged clause, what plays the role of specifying only what changes, and what plays the role of the lingering worry that some continuities are still not captured. Then provide the residue report: which elements of the AI debate translate cleanly into contract doctrine, which ones must be distorted to fit, and which ones have no counterpart at all in how lawyers reason about contractual continuity. Finally, address the interpretive question: if there is material in the frame-problem debate that contract law genuinely cannot express, does that indicate that the problem is a pseudo-problem generated only by artificial formalisms, or does it indicate that contract law is missing a distinction that any adequate theory of change must include? Be precise, avoid analogies to database updates—my friend already made that comparison—and do not ask me to read any particular paper.
