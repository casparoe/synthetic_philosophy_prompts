answer: |-
  Here's the translation of the frame problem debate into contract doctrine, avoiding database analogies and focusing precisely on your vocabulary:

  **The Core Concepts Translated:**

  1.  **The Frame Problem Itself (The Underlying Concern):**
      *   **Contractual Equivalent:** The problem of determining which contractual obligations *persist unchanged* ("survive") after a contractual amendment or a significant event affecting the contract (e.g., novation, force majeure, change in law), **without** needing to explicitly restate every single surviving obligation in the amendment document or event notice. The worry is that unmentioned obligations might be *implicitly terminated* or *accidentally overridden*.
      *   **Role:** The fundamental puzzle: How do we know *for sure* that Obligation X (e.g., confidentiality, payment terms not explicitly altered) continues to bind the parties after we change Obligation Y (e.g., delivery schedule), without listing X, Z, A, B, C... every single time? The fear is silence implies termination.

  2.  **The Frame-Axiom Strategy (Initial Naive Approach):**
      *   **Contractual Equivalent: "The Exhaustive Amendment" Method.**
      *   **Mechanism:** For *every* amendment or event notice, drafters explicitly list *not only* the clauses being changed or terminated (the "effects") **but also** every single clause that *remains in full force and effect* unchanged (the "non-effects" or "persistences").
      *   **Role of Listing Unchanged Clauses:** Explicitly stating every surviving obligation (e.g., "Except as expressly modified herein, all other terms and conditions of the Original Agreement dated [Date] shall remain in full force and effect, including but not limited to: Clause 1 (Definitions), Clause 3 (Payment Terms), Clause 5 (Confidentiality)... [listing *everything* unchanged]").
      *   **Role of Specifying Changes:** Explicitly stating the modified or terminated clauses (e.g., "Clause 4 (Delivery Schedule) is hereby amended as follows:...").
      *   **Lingering Worry (Uncaptured Continuity):** Even with exhaustive lists, drafter error is likely. Did they *forget* to list a minor but crucial clause (e.g., a specific audit right in Clause 7.2)? Does listing "Clause 5 (Confidentiality)" sufficiently capture all its sub-clauses? The process is cumbersome, error-prone, and the document becomes bloated. The worry is that *because* you have to list everything manually, you *will* miss something that should continue.

  3.  **The Successor-State Axiom Response (Efficient Bookkeeping):**
      *   **Contractual Equivalent: "The Express Amendment + Survival Doctrine" Method.**
      *   **Mechanism:** Amendments or event notices **only** explicitly state the clauses being *added, modified, or terminated* (the "effects"). The *continuation* of all *other* obligations is handled by **default background legal doctrines** – the "Survival Doctrines."
      *   **Role of Specifying Only Changes:** The amendment document focuses solely on the delta: "Clause 4 (Delivery Schedule) is amended as follows:... Clause 8 (Termination for Convenience) is hereby deleted in its entirety. A new Clause 9 (Dispute Resolution) is added as follows:..."
      *   **Role of Listing Unchanged Clauses (Implicitly):** This is handled by the "Survival Doctrines," which function as the successor-state axioms:
          *   **General Survival Clause:** A standard boilerplate clause: "Except as expressly amended hereby, the Original Agreement remains in full force and effect." This *is* the contractual successor-state axiom.
          *   **Doctrine of Implied Terms:** Obligations fundamental to the contract's purpose or established by course of dealing/performance likely persist unless expressly contradicted.
          *   **Parol Evidence Rule:** Limits the introduction of extrinsic evidence to contradict the *express* terms of the final integrated amendment agreement. It reinforces that only the *express changes* in the amendment document alter the prior agreement; unmentioned terms survive based on the written amendment + the survival clause.
          *   **Interpretation Against Drafter (Contra Proferentem):** Ambiguities about whether an old term survives might be construed against the party drafting the amendment.
      *   **Lingering Worry (Residual Ambiguity):** Even with express changes and survival doctrines, ambiguities arise:
          *   Does amending Clause 4 *implicitly* modify or terminate a *related but unmentioned* obligation in Clause 6 (e.g., does a new delivery schedule implicitly change a "time is of the essence" clause elsewhere)?
          *   Does the *new* Clause 9 (Dispute Resolution) conflict with or supersede an *old, unmentioned* Clause 7.2 (Governing Law) that wasn't expressly terminated?
          *   Is a particular minor obligation so ancillary to the changed core that its survival is doubtful despite not being mentioned? (The "accidental omission" worry).
          *   **The Core Ambiguity:** The "Survival Doctrines" (like successor-state axioms) rely on the *absence* of express termination. But does the *presence* of an express change *elsewhere* implicitly terminate something *related* that wasn't mentioned? Contract law resolves this case-by-case using interpretation rules (intent, course of dealing, business efficacy, contra proferentem), but the *potential* for ambiguity requiring interpretation remains.

  **The Residue Report: Translation Fidelity**

  1.  **Clean Translations (Strong Parallels):**
      *   **Frame Problem Core:** Translates perfectly to the core problem of implied survival vs. implied termination after amendment.
      *   **Frame-Axiom Strategy:** Translates cleanly to the "Exhaustive Amendment" method – listing all unchanged terms is directly analogous.
      *   **Successor-State Axiom Core:** Translates very cleanly to the "Express Amendment + Survival Clause + Background Doctrines" approach. Specifying only changes and relying on a general rule for continuity is identical in structure.
      *   **Lingering Worry (Formal Level):** Translates cleanly to the residual ambiguity about whether a specific unmentioned term survives, especially terms potentially impacted indirectly by the changes. Both fields worry about "accidental omissions" or unforeseen interactions.

  2.  **Distorted Translations (Conceptual Stretching Needed):**
      *   **Actions/Events:** In AI, actions (e.g., `move block A`) are the primary drivers of change. In contracts, the driver is an *agreement to amend* or an *external event* triggering a clause (e.g., force majeure). The "event" concept maps, but the *agency* is different (mutual agreement vs. an agent performing an action).
      *   **Closed World Assumption (AI):** AI planning often assumes a complete, known list of properties. Contract law inherently deals with an *open world* – unforeseen events, implied obligations, and evolving context exist. The survival doctrines handle continuity within this openness, but the starting assumption is different.
      *   **Computational Tractability:** The AI problem is fundamentally driven by the *computational cost* of exhaustive listing. While exhaustive amendment is *impractical* and *risky* in law, the primary driver isn't CPU cycles but human efficiency, clarity, and avoidance of error. The *efficiency gain* of successor-states maps to *practical drafting efficiency*, but the underlying motivation (computation vs. human factors) distorts slightly.

  3.  **No Counterpart in Contract Law:**
      *   **Representation *as* the Problem:** In AI, the frame problem is *posed* as a problem of *knowledge representation* within a formal system. Contract law *uses* representations (contracts, amendments) but doesn't fundamentally question the *possibility* of adequately representing continuity; it accepts that interpretation and doctrine are necessary and sufficient tools to manage it. The *metaphysical angst* about whether persistence *can* be fully captured in a list doesn't have a direct counterpart; lawyers accept that doctrine and adjudication resolve the ambiguities inherent in language and context.
      *   **Formal Symbol Manipulation:** The AI debate occurs within the realm of manipulating formal logical symbols according to strict rules. Contract interpretation, while using rules, is fundamentally about discerning *human intent* within a rich, contextual, linguistic, and normative framework. The "mechanics" of applying survival doctrines are interpretive, not algorithmic in the formal AI sense.

  **Interpretive Question: Pseudo-Problem or Missing Distinction?**

  The analysis suggests **the frame problem is NOT merely a pseudo-problem generated by formal notation, but reveals a genuine conceptual gap that contract law acknowledges and manages through doctrine and interpretation.**

  *   **Evidence Against Pseudo-Problem:** The core issue – ambiguity about what persists after a specified change – exists robustly in contract law, even *after* adopting the efficient "successor-state" approach (express amendment + survival doctrines). The "residual ambiguity" you suspect is mirrored precisely in the interpretive challenges lawyers face: Does changing X *implicitly* affect unmentioned Y? Contract law *confirms* this ambiguity is real and not an artifact of notation.
  *   **How Contract Law Handles the Gap:** Contract law doesn't *solve* the ambiguity computationally. Instead, it provides a *framework for resolving it*:
      *   **Default Rule:** The "Survival Clause" + general doctrines establish a strong *presumption* of continuity for unmentioned terms.
      *   **Interpretive Tools:** When ambiguity arises (the "residual" case), lawyers use intent (textual, contextual), course of dealing, course of performance, business efficacy, contra proferentem, and potentially litigation to determine if an unmentioned term was *implicitly* terminated or modified by the express changes. This is the "residue report" process.
  *   **The Genuine Gap:** The material that doesn't translate cleanly – the *formal representational angst* and the *closed-world computational focus* – indicates that the AI frame problem highlights a challenge *within formal, complete, algorithmic representations of dynamic systems*. Contract law operates in an *open, interpretive, human-centered* paradigm. The "gap" is that **any purely formal, mechanical system attempting to model change and continuity *without* open-ended interpretive mechanisms will inevitably face the frame problem's residual ambiguity.** Contract law *includes* these interpretive mechanisms as core features, not bugs.
  *   **Conclusion:** The frame problem debate reveals a genuine metaphysical puzzle about representing change *within a closed formal system*. Contract law avoids the *computational* manifestation of this puzzle by relying on contextual interpretation and doctrine to manage the inherent ambiguity of continuity. The existence of the residual ambiguity *even within contract law's framework* confirms it's not a pseudo-problem, while contract law's *tools for managing it* show that the formal AI approach lacks the necessary interpretive flexibility, making the problem more acute within its specific representational constraints. The problem is genuine; the formal notation makes it computationally tractable to *pose* but harder to *resolve* without interpretive tools.
