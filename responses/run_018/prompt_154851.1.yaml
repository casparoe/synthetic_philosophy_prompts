prompt: |-
  I am composing a novel that examines how modern institutions manufacture collective opinion without collective responsibility, and for a satirical interlude I require a deadpan parodic document—approximately 600 words—written as the official user manual and municipal ordinance for a fictional platform called the Consensus Engine, which has been adopted as the national information infrastructure of an unnamed Scandinavian state. The voice should merge the hyper-legal cheerfulness of a Silicon Valley terms-of-service agreement with the dry, procedural neutrality of a bureaucratic handbook, and the target should be the Kierkegaardian conception of the public: that phantom, leveling abstraction produced by the press and now by algorithmic dissemination, in which every anonymous individual holds opinions on everything without existential commitment and responsibility dissolves into statistical mass. You should not name Kierkegaard, cite specific texts, or employ technical terms such as leveling; instead, let the satire emerge entirely from the manual’s own institutional logic.

  The manual must exaggerate real structural features of this concept. It should describe a mandatory Public Weight Score that adjusts each citizen’s visibility according to engagement velocity rather than expertise; an Opinion Quorum requiring every registered user to maintain a continuous stream of commentary on topics designated by the algorithm; and a national holiday, the Day of the Absent Author, celebrating the legal abolition of first-person pronouns in all public discourse so that statements float without an owner. Include practical sections—how to appeal a downgraded weight, how tourists may apply for temporary opinion licenses, and a sidebar on etiquette when one’s view is statistically overruled—so that the deadpan form itself carries the critique. The humor should arise from internal consistency: the manual presents these mechanisms as rational, hygienic, and liberating, and a reader familiar with the philosophical critique should recognize that this cheerful administrative efficiency is precisely the nightmare being described.

  Please keep the tone sustained and legible—no winking asides, no explicit moral—so that the irony remains deadpan yet unmistakable. The piece should feel like a genuine artifact from a world where the abstract public has finally been given an administrative body, leaving the reader to supply the recoil.
