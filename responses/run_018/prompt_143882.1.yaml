answer: |-
  Here are eight rigorously constructed interview questions with targeted follow-ups, sequenced to build from conceptual foundations to concrete application while pressing the core tensions in your guest's framework:

  **Conceptual Architecture**
  1. **Main Question:** Your account avoids consequentialist weighing by granting frame precedence through "internal authority conditions." But given that frames (e.g., military oath vs. pacifist conscience) often embed radically divergent conceptions of authority (hierarchy vs. autonomy), how can precedence be determined *non-arbitrarily* when those conditions conflict *about their own scope*?  
     *Follow-up (anticipating "frame-internal criteria" reply):* If a soldier's familial frame asserts authority over life-preservation while her military frame asserts authority over mission-compliance, and each frame denies the other's supremacy claim, doesn't recourse to "internal authority" merely restate the conflict rather than resolve it?  

  **Phenomenology of Residue vs. Regret**
  2. **Main Question:** You distinguish moral residue from Williams' agent-regret by locating residue in *objective reparative obligations* (e.g., compensatory acts) rather than affective states. But in permissible harmful acts (e.g., justified tactical bombing), remedial duties also arise without implying dilemma-residue. How do you *formally differentiate* reparative obligations in residue-cases from ordinary remedial duties without relying on intuition about "remainder"?  
     *Follow-up (anticipating "context of violation" reply):* If reparative duties in residue-cases stem from violating a *binding-but-overridden* obligation, doesn’t this presuppose the very incommensurability between frames that resolutionists deny? How is this not circular?  

  **Meta-Conflict & Second-Order Dilemmas**
  3. **Main Question:** When frames impose conflicting *second-order* obligations about *how* to resolve first-order conflicts (e.g., "transparency vs. discretion" in deliberation), does your framework treat these as: (a) new first-order dilemmas between meta-obligations, (b) higher-level frame collisions, or (c) evidence that the original frames were mis-specified?  
     *Follow-up (anticipating "different logical level" reply):* If second-order obligations operate at a distinct stratum, doesn’t this merely *relocate* the dilemma? For example, if transparency (professional frame) and discretion (familial frame) conflict over *whether to disclose the filial-institutional conflict itself*, what prevents infinite regress?  

  **Applied Scenario: The Archivist's Dilemma**  
  4. **Main Question:** Consider the state archivist who discovers evidence of atrocities by her living parent. Choosing disclosure (honoring institutional frame) over silence (honoring filial frame) generates a residue you’d call "objective." Yet choosing silence over disclosure also overrides an obligation. Does your framework *explain a qualitative asymmetry* in the residue between these choices, or is residue merely path-dependent?  
     *Follow-up (anticipating "frame-specific reparative duties" reply):* If disclosure leaves "institutional residue" requiring reparative acts to the parent (e.g., emotional support), while silence leaves "filial residue" requiring reparative acts to society (e.g., advocacy), how is this residue *moral* rather than relational? Doesn’t reducing it to context-specific duties collapse into relativism?  

  **Additional Probing Questions**  
  5. **Main Question:** If frames are neither hierarchical nor commensurable, how does your account avoid moral paralysis? Does "best available action" imply a *pragmatic* exit from normative conflict, and if so, does this concede resolutionism at the level of action-guidance?  
     *Follow-up:* If an agent *must* act despite irresolvable obligations, is the "remainder" functionally equivalent to Williams' regret – a psychologically inevitable byproduct – rather than an objective normative feature?  

  6. **Main Question:** Can a single agent inhabit multiple frames with genuinely *equal* authority in a given dilemma? Or does the act of choosing *constitute* a latent hierarchy (e.g., "I chose as an archivist, not a daughter"), rendering residue merely retrospective?  
     *Follow-up:* If the equality of frames is only apparent *ex ante* but dissolves *ex post* through choice, how is this distinct from Marcus-type specification?  

  7. **Main Question:** How does your framework handle frames that are *internally* pluralistic or contested (e.g., "democratic citizenship" invoking both rights-based and utilitarian commitments)? Does this exacerbate or dissolve residue?  
     *Follow-up:* If intra-frame conflict mirrors inter-frame conflict, does this imply that *all* obligations generate potential residue, or only those arising from distinct social practices?  

  8. **Main Question:** Ruth Marcus argued that dilemmas imply inconsistent obligations, which signal faulty moral systematization. Does your account imply that moral reality is *inherently* inconsistent, or that our frames are irreducibly plural?  
     *Follow-up:* If the latter, are we obliged to reduce frame-plurality to avoid residue? If not, are we morally required to sustain dilemmatic structures?  

  ---

  **Structural Rationale**  
  - **Progression:** Begins with the architecture (Q1), moves to phenomenology (Q2), tackles meta-conflicts (Q3), and culminates in the concrete archivist case (Q4). Subsequent questions (Q5-Q8) probe implications.  
  - **Targeted Anticipation:** Follow-ups preempt likely defenses (internal authority, reparative duties, logical stratification) while pushing toward circularity, relativism, or regress.  
  - **Archivist Case Nuance:** Forces distinction between *symmetry* of residue (both choices leave residue) and *qualitative asymmetry* (does disclosure’s residue differ ontologically from silence’s?). Challenges reduction of residue to relational duties.  
  - **Non-Intuitionist Pressure:** Questions demand structural or formal differentiators (e.g., Q2 on reparative vs. remedial duties; Q4 on moral vs. relational residue).  

  This sequence ensures each question destabilizes a different pillar of the framework while respecting its innovative intent to navigate between Williams and Marcus. The archivist case provides a visceral test for the theory’s ability to explain *asymmetric moral experiences* beyond symmetrical conflict.
