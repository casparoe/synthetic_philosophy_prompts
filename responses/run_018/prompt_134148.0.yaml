  ### Taxonomy of Dispositional Views: A Decision Tree  

  **Root Split: Combined Fink and Mask Case**  
  *A fragile glass vase is simultaneously wrapped in shock-absorbing foam (a mask) and fitted with an internal self-repair mechanism that activates on any crack (a fink). Is the vase fragile?*  
  - **No, it is not fragile** → Both conditions destroy the disposition. *Proceed to Second Split.*  
  - **No, it is not fragile, but only due to one condition** → *Unstable branch: Distinction between fink and mask cannot be maintained consistently. (Unnamed, due to instability)*  
    - *Diagnosis:* Arbitrary to claim one blocker (fink or mask) destroys the disposition while the other does not, given both prevent manifestation identically.  
  - **Yes, it is fragile** OR *The fink/mask distinction is inapplicable* → Disposition persists despite blockers. *Proceed to Second Split.*  

  **Second Split: Mimic Case**  
  *A holographic projection behaves identically to a breaking vase upon impact but has no physical substrate. Is it fragile?*  
  - For **"Both destroy" (from Root Split)**:  
    - **Yes, the mimic is fragile** → Disposition ascribes only require behavioral counterfactuals. *Proceed to Third Split.*  
    - **No, the mimic is not fragile** → Disposition ascriptions require an underlying categorical base. *Proceed to Third Split.*  
  - For **"Fragile" (from Root Split)**:  
    - **Yes, the mimic is fragile** → Disposition ascribes only require behavioral counterfactuals. *Proceed to Third Split.*  
    - **No, the mimic is not fragile** → Disposition ascriptions require an underlying categorical base. *Proceed to Third Split.*  

  **Third Split: Double-Fink Antidote Scenario**  
  *A poison is lethal unless an antidote is present; the antidote is released only by a mechanism that detects the poison. Does the poison retain its lethality?*  
  - For **"Both destroy + Mimic: Yes"**:  
    - **Yes, the poison is lethal** → *Empty branch: Incoherent. (Diagnosis: Inconsistent to accept that blockers destroy dispositions in the vase case while appealing to non-actual worlds here.)*  
    - **No, the poison is not lethal** → Dispositions tied to actual-world conditions. *Proceed to Fourth Split.*  
  - For **"Both destroy + Mimic: No"**:  
    - **Yes, the poison is lethal** → Dispositions grounded in categorical bases persist across worlds. *Proceed to Fourth Split.*  
    - **No, the poison is not lethal** → *Empty branch: Unstable. (Diagnosis: Inconsistent with categorical realism’s emphasis on intrinsic properties.)*  
  - For **"Fragile + Mimic: Yes"**:  
    - **Yes, the poison is lethal** → Dispositions intrinsic and independent of blockers. *Proceed to Fourth Split.*  
    - **No, the poison is not lethal** → *Empty branch: Incoherent. (Diagnosis: Inconsistent to claim dispositions persist in the vase case but not here under identical reasoning.)*  
  - For **"Fragile + Mimic: No"**:  
    - **Yes, the poison is lethal** → Dispositions grounded in categorical bases persist across worlds. *Proceed to Fourth Split.*  
    - **No, the poison is not lethal** → *Empty branch: Unstable. (Diagnosis: Inconsistent with dispositional realism’s commitment to underlying powers.)*  

  **Fourth Split: Permanent Universal Blockage**  
  *Every manifestation of a disposition (e.g., solubility) is permanently masked or finked, with no possible manifestation. What happens to the disposition?*  
  - For **"Both destroy + Mimic: Yes + Antidote: No"**:  
    - **The disposition vanishes** → *Simple Conditional Analysis*.  
  - For **"Both destroy + Mimic: No + Antidote: Yes"**:  
    - **A single underlying power persists** → *Categorical Realism (Armstrong)*.  
  - For **"Fragile + Mimic: Yes + Antidote: Yes"**:  
    - **A single underlying power persists** → *Functionalist Dispositionalism*.  
  - For **"Fragile + Mimic: No + Antidote: Yes"**:  
    - **A single underlying power persists** → *Categorical-based Dispositional Realism (Martin, Heil)*.  

  ---

  ### Leaf Summary (Positions and Diagnoses)  
  1. **Unstable branch (fink/mask distinction)**:  
     - *Unnamed*.  
     - *Diagnosis:* Arbitrary and unsustainable to privilege one blocker over the other.  

  2. **Both destroy + Mimic: No + Antidote: Yes + Persisting power**:  
     - *Categorical Realism (Armstrong)*.  
     - Dispositions reduce to categorical bases; persist under blockage.  

  3. **Fragile + Mimic: No + Antidote: Yes + Persisting power**:  
     - *Categorical-based Dispositional Realism (Martin, Heil)*.  
     - Dispositions are real but require categorical bases; persist under blockage.  

  4. **Both destroy + Mimic: Yes + Antidote: No + Vanishes**:  
     - *Simple Conditional Analysis*.  
     - Dispositions are conditional truths; vanish if conditionals are false.  

  5. **Fragile + Mimic: Yes + Antidote: Yes + Persisting power**:  
     - *Functionalist Dispositionalism*.  
     - Dispositions are intrinsic; persist as functional roles despite blockers.  

  6. **Empty branches (incoherent or unstable)**:  
     - *Diagnosis:* Either internally inconsistent (e.g., accepting non-actual worlds in antidote case but not vase case) or misaligned with core principles (e.g., categorical realism rejecting bases under blockage).  

  ---

  ### Convergence Notes  
  - **"Categorical Realism" and "Categorical-based Dispositional Realism"** converge on all judgments (mimic, antidote, blockage) but diverge rhetorically: the former eliminates dispositions in favor of bases, the latter retains them as real properties of bases.  
  - **Simple Conditional Analysis** and **Functionalist Dispositionalism** agree on the mimic case (no base needed) but diverge on the vase and antidote cases: the former requires actual-world conditionals, the latter invokes intrinsic powers.  

  This taxonomy isolates core commitments without presupposing labels. Empty branches highlight gaps in the logical space, while unstable branches warn against ad hoc distinctions.
