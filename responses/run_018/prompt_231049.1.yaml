  ### Decision Tree: What Makes Every Token of the Letter 'a' an 'a'?

  This decision tree sorts respondents into one of six positions on what constitutes the letter 'a', based solely on their judgments about concrete glyph cases. The tree uses key branch points reflecting the logical space of the debate, phrased as questions about specific letterforms. No prior theoretical knowledge is assumed—respondents answer based on their intuitions about the glyphs described. After working through the tree, you will be directed to one of the six named positions, each with a brief note on its most awkward commitment.

  ---

  #### The Decision Tree

  1. **Start with Question A:**  
     **A.** Consider a double-storey printed 'a' (like in most typefaces) alongside a single-storey handwritten 'a' (curved, like a circle with a tail). Do you feel one is a "better" or "more typical" example of the letter 'a' than the other, or are they equally valid but simply different in style?  
     - **If you feel one is better/more typical (e.g., due to familiarity, clarity, or ideal form):** Go to Question B.  
     - **If you feel they are equally valid (neither is "better"—they are just different instances of 'a'):** Go to Question C.  

  2. **Question B (for those who saw a "better" example in A):**  
     **B.** Imagine seeing a heavily flourished blackletter 'a' (with intricate, ornate strokes) for the first time. After encountering it frequently in a book for a week, does it feel like it becomes a more "typical" 'a' for you, or does it remain less typical than a standard printed 'a', no matter how often you see it?  
     - **If it becomes more typical with frequent exposure:** You are sorted into **Exemplar Theory**.  
     - **If it remains less typical (it never feels fully "normal" compared to your standard):** You are sorted into **Prototype Theory**.  

  3. **Question C (for those who saw equal validity in A):**  
     **C.** Consider a deliberately novel mark (e.g., a zigzag or spiral) that a small community agrees to use as their letter 'a' and thereafter reads unhesitatingly as 'a' in all contexts. Could this mark truly be an 'a'?  
     - **If no (it must resemble standard 'a's to count):** Go to Question D.  
     - **If yes (the community's use can make it an 'a'):** Go to Question E.  

  4. **Question D (for those who said no to the novel mark in C):**  
     **D.** Consider an 'a' with its bowl (the round part) open at the top (like an unfinished circle). Despite this flaw, it still has the core structure of an 'a'. Is this glyph an 'a'?  
     - **If yes (the structure is preserved):** You are sorted into **Skeletal Structuralism**.  
     - **If no (the imperfection disqualifies it):** Go to Question F.  

  5. **Question E (for those who said yes to the novel mark in C):**  
     **E.** Suppose the novel mark (e.g., the zigzag) was created accidentally (e.g., a random scribble) without any intent to write an 'a', but the community still adopts and uses it as their 'a'. Is it an 'a'?  
     - **If no (the maker must have intended it as an 'a'):** You are sorted into **Normative Artefactualism**.  
     - **If yes (intent doesn't matter—only use does):** Go to Question G.  

  6. **Question F (for those who said no to the open-bowl 'a' in D):**  
     **F.** Consider an 'a' rendered only as a dotted or outlined silhouette (e.g., a connect-the-dots or hollow outline version). It lacks detail but retains the shape. Is this an 'a'?  
     - **If yes (the form is recognisable):** This path leads to an unresolved position; see the Logical Space section. *(Note: In practice, this combination is rare; most respondents will not reach this point.)*  
     - **If no (it is too incomplete):** You are sorted into **Skeletal Structuralism**. *(This is a secondary path for structuralism; see the Note below.)*  

  7. **Question G (for those who said yes to the accidental mark in E):**  
     **G.** Consider a simplified 'a' shaped like an 'o' with a short right-hand stem (barely resembling a standard 'a'). If a community uses this successfully in reading and writing, is there a deeper reason (e.g., its role in communication) why it is an 'a', or is it solely because the community treats it as one?  
     - **If there is a deeper reason (e.g., it functions in their practice):** You are sorted into **Functional Contextualism**.  
     - **If it is solely due to community treatment (no deeper reason):** You are sorted into **Deflationism**.  

  **Note on Skeletal Structuralism:** This position can be reached via two paths (D-yes or F-no) to ensure structuralists who reject extreme flaws (like the open bowl) but accept minimal forms (like the silhouette) are captured. The core commitment is prioritising geometric structure.

  ---

  #### The Six Positions (Leaves of the Tree)
  1. **Skeletal Structuralism**: A glyph is an 'a' if it instantiates the correct part–whole skeleton (e.g., core topology and relations like a bowl and stem), allowing only alterations that preserve this structure.  
     - *Most awkward commitment:* It may accept as an 'a' a highly distorted glyph that preserves the skeleton (e.g., a wobbly outline) even if it is unrecognisable or dysfunctional in practice.  
  2. **Prototype Theory**: Membership in the category 'a' is graded by similarity to a single, stored ideal representation (a "best example"), with tokens being better or worse 'a's based on closeness to this prototype.  
     - *Most awkward commitment:* The prototype is an abstract average (e.g., a blend of double-storey and single-storey forms) that may not match any real-world instance, making it hard to define objectively.  
  3. **Exemplar Theory**: The category standard is a cloud of remembered instances, and membership is graded by similarity to these stored examples (e.g., familiarity with diverse 'a's makes new variants feel more typical).  
     - *Most awkward commitment:* It requires storing countless examples, which could lead to contradictions if atypical instances (e.g., a misshapen 'a') are frequently encountered and skew judgments.  
  4. **Functional Contextualism**: A glyph is an 'a' when it plays the proper functional role in a community's writing and reading practices (e.g., conveying sound/meaning), regardless of form or intent.  
     - *Most awkward commitment:* It may accept as an 'a' a glyph that looks nothing like an 'a' (e.g., a novel mark) if it functions, potentially undermining intuitive notions of visual identity.  
  5. **Normative Artefactualism**: Membership depends on the maker's intention to create an 'a' and adherence to the norms of a typographic community, so not just any functional substitute suffices.  
     - *Most awkward commitment:* A glyph intended as an 'a' but utterly dysfunctional and unrecognisable (e.g., a chaotic scribble) could still be an 'a', which may seem counterintuitive.  
  6. **Deflationism**: Sameness across tokens is projected by our sorting practices; there is no robust essence (e.g., no structural, functional, or intentional "core" beyond collective agreement).  
     - *Most awkward commitment:* It implies the category 'a' has no grounding beyond current habits, making it vulnerable to arbitrary changes (e.g., a community could suddenly decide a 'b' is an 'a').  

  ---

  #### Section 1: Logical Space – Unoccupied Combinations  
  The tree's branches cover the core commitments of the six positions, but some combinations of answers are not occupied by any position due to incoherence or unattractiveness. These gaps arise from the logical structure of the debate:  
  - **Graded membership + Community use defines 'a' (e.g., B-yes + C-yes):** No position occupies this, as it combines similarity-based grading (prototype/exemplar) with practice-based definition (contextualism/artefactualism), creating tension—grading relies on internal standards, while community use is external. This is unattractive, as it conflates distinct grounds for membership.  
  - **All-or-nothing + Novel mark rejected + Open bowl rejected (e.g., C-no + D-no + F-yes):** The silhouette question (F) yields no clear position. If someone rejects the novel mark (C-no) and the flawed 'a' (D-no) but accepts the silhouette (F-yes), it suggests structuralism with strict geometric requirements. However, this path is rare and folds into skeletal structuralism via F-no, as accepting the silhouette but rejecting other forms is incoherent—structuralism typically accepts both if the skeleton is intact.  
  - **All-or-nothing + Novel mark accepted + Accidental mark accepted + Function as essence (e.g., C-yes + E-yes + G-yes):** Occupied by functional contextualism. The unoccupied case (C-yes + E-yes + G-no) would require community practice without function or intent, which is incoherent—practice implies function.  
  - **Graded membership + Novel mark accepted (e.g., A-better + C-yes):** No position occupies this, as grading (B) focuses on similarity, not community use. This is unexplored, as it would demand a hybrid theory (e.g., graded functionalism) that is not part of the six positions.  

  ---

  #### Section 2: Ambiguous Pairs and Separation Challenges  
  The tree reliably separates five positions but has limited power to distinguish **Functional Contextualism** and **Deflationism** (both reached via C-yes → E-yes). They share core commitments (e.g., accepting the novel and accidental marks) and can only be split by probing the "deeper reason" in Question G. If responses to G are ambiguous, a further case is needed:  
  - **Probe for separation:** *Consider a glyph that is unusable in practice (e.g., a vanishingly faint mark or one that takes minutes to write) but which a community resolves to call an 'a' and sort as one. Is it an 'a'?*  
    - Functional Contextualism says **no**—it must play a functional role in reading/writing (e.g., be legible and efficient).  
    - Deflationism says **yes**—membership is defined solely by sorting practice, regardless of function.  
  Without this probe, the tree relies on G, which may not fully disentangle function from practice.  

  No other pairs are ambiguous; the tree cleanly separates the remaining positions using the listed probes.  

