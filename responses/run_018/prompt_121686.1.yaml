answer: |-
  ## The Deservingness Protocol: New Claimant Onboarding Manual (v.4.7a)

  **Subject:** Mandatory Orientation: Your Role in the Reciprocity Ledger System

  **Welcome, Potential Contributor!** We're delighted you've taken the first step towards societal re-engagement via The Deservingness Protocol (TDP). Your journey begins with understanding our core operational framework: **The Reciprocity Ledger**. Think of it as your personalized account for civic contribution. This isn't "benefits"; it's an advance on your future societal value, meticulously tracked. Let's get you ledger-ready!

  **1. The Reciprocity Ledger: Your Civic Balance Sheet**
  *   1.1. Every pound of Provisional Subsistence Allocation (PSA) granted creates a corresponding entry in your Reciprocity Ledger: one (1) **Dignity Debt Unit (DDU)**.
  *   1.2. DDUs represent the quantified societal investment in your potential. Discharging this debt is your primary contractual obligation under TDP.
  *   1.3. Discharge occurs solely through verified participation in **Protocol Fulfillment Labor (PFL)**. PFL activities generate **Dignity Credits (DCs)** at a rate calibrated to effort visibility and moral alignment.
  *   1.4. Goal: Achieve DC/DDU parity. Persistent negative balance may trigger Re-engagement Review (See Clause 7).

  **2. Pre-Emptive Fraud Mitigation Assessment (PFMA): Proving Worthiness *Before* Access**
  *   2.1. To safeguard the Ledger's integrity, initial PSA access requires successful PFMA completion.
  *   2.2. PFMA involves comprehensive documentation proving non-exploitation of the system *prior* to application. Demonstrate conclusively you *could* have exploited but *chose* not to.
  *   2.3. Provide: 7 years of bank statements annotated with potential "suspicious" cash withdrawals (>£20/week), sworn affidavits from 3 non-relatives confirming your observable poverty was not self-inflicted, and a 500-word essay detailing your lifelong aversion to unearned comfort.
  *   2.4. Outcome: "Low-Risk" clearance grants PSA access and initializes your Ledger. "Moderate/High-Risk" triggers Enhanced Scrutiny Pathways (ESP), delaying Ledger initialization until ESP requirements are met (additional documentation, pre-PFL character workshops).

  **3. Protocol Fulfillment Labor (PFL): Discharging Your DDU Obligation**
  *   3.1. PFL assignments are designed for optimal audit visibility and moral calibration, not tangible output. Efficiency is measured in demonstrable effort, not results.
  *   3.2. Examples: Relocating piles of gravel between designated zones A and B (then back to A), scrubbing already-clean public infrastructure with approved brushes, data-entering randomized number sequences into isolated terminals.
  *   3.3. Key Principle: **The Labor Must Be Seen.** GPS trackers, biometric timeclocks, and random Auditor spot-checks ensure visibility and effort quantification. Invisible labor generates zero DCs.

  **4. Gratitude Visibility Requirement (GVR): Affective Compliance During PFL**
  *   4.1. Discharging Dignity Debt requires not just labor, but correct *affect*. Your demeanor during PFL is integral to DC accrual.
  *   4.2. Mandatory Display: Measurable earnestness, visible appreciation for the redemption opportunity, and appropriate solemnity regarding your DDU balance. Smiling is encouraged but must appear effortful, not carefree.
  *   4.3. Monitoring: Wearable Affect Monitors (WAMs - Issued Week 2) track biometric correlates of gratitude (heart rate variability, micro-facial expressions). Auditor assessments also gauge vocal tone and posture.
  *   4.4. Non-Compliance: Insufficiently grateful affect ("Affective Deficit") results in DC reduction (50% penalty) for that PFL session. Persistent deficit triggers Mandatory Gratitude Recalibration (MGR) sessions.

  **5. Character Alignment Examination (CAE) & Refund Policy**
  *   5.1. Upon PFMA clearance and initial PSA disbursement, you enter a 90-day Probationary Moral Assessment Window.
  *   5.2. During this window, continuous behavioral analysis occurs via social media scans, community informant networks (Confidential Contributor Observers - CCOs), and mandatory weekly "Virtue Reflection" questionnaires.
  *   5.3. Failure to meet Character Alignment Benchmarks (CABs) at any point results in immediate Protocol Termination and classification as "Non-Deserving."
  *   5.4. **Refund Policy:** Terminated Contributors are liable for immediate repayment of *all* PSA funds received, plus a 15% Administrative Reconciliation Fee. This reimburses the Ledger for the misallocated societal investment. Payment plans are available (20% APR).

  **6. Auditor Interface: Your Performance Dashboard**
  *   6.1. Access your personalized Ledger Dashboard via the TDP kiosk. View real-time DDU balance, accrued DCs, GVR compliance scores, PFL attendance, and CAE status.
  *   6.2. Disputes regarding DC allocation, GVR penalties, or CAE findings must be submitted on Form D-7R ("Rectification Request") within 48 hours. Decisions are final.

  **7. Re-engagement Review (Persistent DDU Imbalance)**
  *   7.1. Failure to achieve significant DC accrual after 6 months triggers a Re-engagement Review.
  *   7.2. A panel assesses your Ledger history, GVR scores, and CAE data to determine if Enhanced Contribution Pathways (ECP - increased PFL hours, lower DC conversion rates) or Protocol Termination is warranted.

  **Conclusion:** The Reciprocity Ledger ensures fairness, accountability, and the restoration of civic equilibrium. Your diligent participation in PFL, coupled with authentic GVR compliance, is the path to a zero-balance Ledger and proven Deservingness. We look forward to auditing your contribution! Report to PFL Station Gamma-9 at 07:00 tomorrow. Bring government-issued ID and your issued brush kit. Enthusiasm is measurable.
