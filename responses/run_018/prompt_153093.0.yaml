  Okay, the user is a philosophy professor preparing a cross-disciplinary seminar. They need me to bridge analytic metaphysics and property law using a specific case study involving a Brutalist pavilion called "The Block." The classic statue-and-clay debate in philosophy needs to be translated into legal terms like fixture, renovation clause, and substantial transformation. The user has provided a detailed scenario where every original part of The Block is replaced over time, leading to conflicting interpretations from preservation boards, tax assessors, and owners.

  First, I need to recall the key philosophical positions on material constitution. The coincidence view holds that the statue and the clay are distinct but coinciding objects. The constitution-without-identity approach argues that the statue is constituted by the clay without being identical to it. Four-dimensionalism sees objects as space-time worms, where temporal parts exist at different times. The dominant-kind view suggests that an object takes its identity from its dominant kind, like "statue" overriding "clay."

  Now, translating these into property law concepts. A "fixture" in law is personal property that becomes part of the real estate. The "renovation clause" in easements defines what changes are allowed without violating the agreement. "Substantial transformation" determines if alterations create a new entity. "Original fabric" refers to the original materials, and "tax-parcel identity" relates to how the property is assessed for taxes. The "historic easement" imposes restrictions to preserve historical integrity.

  The Block scenario: All original concrete and steel are replaced with synthetics and titanium. Preservation board says it's still The Block due to design and footprint. Tax assessor sees it as a new parcel with 0% original fabric. Owners claim it's a "successor fixture" inheriting some rights. 

  Mapping philosophical positions:
  1. **Coincidence View**: In law, this might be like the fixture (The Block) coinciding with the tax parcel. Preservation board focuses on the fixture (design), tax assessor on the parcel (material). But law doesn't treat them as distinct entities; it's one property with different attributes. The fudge is that law doesn't separate the "fixture" and "parcel" as metaphysically distinct.

  2. **Constitution-without-Identity**: The Block is constituted by the materials but not identical to them. Preservation law might reflect this by protecting the design (constituting form) regardless of materials. However, tax law requiring "original fabric" implies identity depends on material continuity. The distortion is that both can't be true simultaneously, leaving a conflict unresolved in law.

  3. **Four-Dimensionalism**: The Block as a space-time worm. Each replacement is a temporal part. Preservation easement protects the entire "worm," focusing on continuity of existence. Tax law, however, sees a break at 0% original material, treating it as a new parcel. The mapping is messy because law uses thresholds (e.g., 50% material change) instead of continuous existence.

  4. **Dominant-Kind View**: The Block's identity comes from its dominant kind as a historic structure. Preservation board prioritizes this, overriding material changes. But tax law might prioritize the physical parcel kind, leading to different classifications. The issue is that law doesn't have a clear hierarchy; different areas (preservation vs. tax) assign different dominant kinds without resolution.

  Residue Report:
  - **Clean Maps**: Dominant-kind view aligns with preservation focus on historical structure over materials. Four-dimensionalism's temporal parts somewhat fit with phased renovations under easement clauses.
    
  - **Distortions**: Coincidence view struggles because law doesn't treat the same location as having two entities. Constitution-without-identity is split between preservation (form) and tax (matter), lacking a unified approach. Four-dimensionalism's continuum clashes with legal bright-line rules (e.g., 50% material change).

  - **No Expression**: Metaphysical notions like coincidence without identity or temporal parts as real entities aren't captured. Law uses functional thresholds instead. The residue might indicate that metaphysics cares about underlying realities, while law focuses on practical, contractual definitions for specific purposes. Whether this shows law is oversimplifying or metaphysics overcomplicating isn't for me to judge, but the gaps highlight different priorities: ontological truth vs. applied governance.
answer: |-
  Here's a point-by-point translation of philosophical positions into property law concepts using "The Block" case, followed by a residue analysis. Fudges and omissions are explicitly noted.  

  ### Philosophical Positions Restated in Property Law Vocabulary  
  1. **Coincidence View (Statue ≠ Lump, Same Location)**  
     *Translation:* The preserved Brutalist pavilion ("The Block" as *fixture*) and the underlying physical structure ("Tax Parcel") coincide at the same geographic location but are distinct legal entities. The *historic easement* binds the fixture (protected design/footprint), while *tax-parcel identity* depends on *original fabric*. When all fabric is replaced, the easement-bound fixture ("The Block") persists due to design continuity, but the tax parcel is extinguished (0% fabric = new parcel).  
     *Fudge:* Property law doesn't formally recognize two coinciding entities; it forces a binary choice (e.g., is it "The Block" or not?). The "coincidence" is operational, not ontological.  

  2. **Constitution Without Identity (Statue Constituted by Clay, Not Identical)**  
     *Translation:* The Block (as *fixture*) is *constituted by* the physical materials but isn't identical to them. The *renovation clause* in the easement allows material replacement if no *substantial transformation* occurs to the protected design. Thus, The Block persists as long as replacements adhere to the original specs (constitution), even with 0% original fabric. The tax assessor disputes this, arguing that total replacement severs identity via *substantial transformation*.  
     *Omission:* Metaphysics treats constitution as asymmetric (clay constitutes statue, not vice versa), but property law makes no such distinction—both fixture and materials are evaluated against contractual/statutory thresholds.  

  3. **Four-Dimensionalism (Spacetime Worm)**  
     *Translation:* The Block is a four-dimensional entity ("spacetime worm") stretching across 20 years. Each replaced panel is a temporal part. The *historic easement* applies to the entire worm if design continuity is maintained, making "original fabric" irrelevant. The tax assessor slices the worm at the 100% replacement point, creating a new tax parcel for the post-renovation phase. Owners' "successor fixture" claim treats The Block as a later temporal segment inheriting prior rights.  
     *Distortion:* Property law lacks a concept of temporal parts. Easements and tax assessments use discrete events (e.g., "substantial transformation" triggers) or thresholds (e.g., 50% material change), not continuous spacetime wholes.  

  4. **Dominant-Kind View (Sortal-Dependent Identity)**  
     *Translation:* The Block's identity depends on its dominant kind: "protected historic fixture." The *easement* defines this kind by design/footprint, overriding material composition. Thus, no *substantial transformation* occurs if replacements preserve the kind-defining features. The tax assessor applies a different dominant kind ("real property parcel"), where material continuity (*original fabric*) is essential, making it a new kind post-renovation.  
     *Fudge:* Dominant kinds in law are contractual/statutory (e.g., "historic fixture" vs. "tax parcel"), not metaphysical. The conflict arises because law assigns different dominant kinds to the same entity for different purposes.  

  ---

  ### Residue Report: Mapping Successes, Distortions, and Gaps  
  **What Maps Cleanly**  
  - **Dominant-Kind View ↔ Legal Purpose-Relativity**  
    Both treat identity as context-dependent. Preservation law prioritizes design (historic kind), tax law prioritizes material (parcel kind). Clean fit.  
  - **Substantial Transformation ↔ Threshold-Based Change**  
    Metaphysical "replacement" debates align with legal tests for when alterations trigger reclassification (e.g., 50% material change = new parcel).  

  **What Distorts**  
  - **Coincidence View ↔ Legal Uniqueness**  
    Law cannot acknowledge two entities (statue + lump) at one location; it demands a single classification per context (easement vs. tax). Coincidence is flattened into competing interpretations.  
  - **Four-Dimensionalism ↔ Discrete Legal Events**  
    Temporal parts have no correlate; law uses fixed thresholds (e.g., "100% replacement") as identity breakpoints, ignoring gradual change.  

  **No Expression in Property Law**  
  - **Constitution Without Identity’s Asymmetry**  
    No legal mechanism treats "The Block" as *constituted by* but *distinct from* its materials. Law merges them: if materials change enough, the fixture is re-evaluated holistically.  
  - **Metaphysical Vagueness vs. Legal Bright Lines**  
    Philosophy debates "when" constitution ceases (e.g., 51% vs. 49% replacement). Law imposes bright lines (e.g., easement clauses defining "substantial transformation" via percentages).  
  - **Numerical Identity Concerns**  
    Metaphysics asks, "Is it *the same* object?" Law asks functional questions: "Do easement rights persist?" or "Is tax reassessment required?" Identity is reduced to contractual continuity.  

  **Residue Interpretation**  
  The unmapped residues suggest:  
  1. **Legal identity is functionally defined**, not ontological. Gaps (e.g., no asymmetry) arise because law cares about *rights allocation* (easement/tax) and *practical thresholds*, not "what exists."  
  2. **Metaphysics overcomplicates operational distinctions**. For example, "constitution without identity" tries to split hairs law resolves by fiat (e.g., "renovation clauses = no substantial transformation if design preserved").  
  3. **The irreconcilable conflict** between preservation board (design as identity) and tax assessor (material as identity) mirrors philosophy’s "no privileged criterion" problem—but law leaves it unresolved, defaulting to jurisdictional silos.  

  No position maps perfectly due to law’s focus on *stipulated definitions* and *policy goals* (taxation, preservation) versus metaphysics’ search for *mind-independent truth*. The translation succeeds in exposing how legal "identity" is a bundle of context-dependent decisions, not a unified theory of objects.
