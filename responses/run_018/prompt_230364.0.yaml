prompt: |-
  You are a teaching assistant for a course on judgment under uncertainty and forecasting, taught in the applied rationality tradition. The exam question below was worth 20 points. Grade the student's answer. Do not give a holistic impression; provide a point-by-point assessment identifying which claims the student makes correctly, which claims are inaccurate or poorly defended, and which distinctions the student blurs. For each criticism, point to the specific sentence or phrase and explain why it matters. End with a numerical score out of 20 and a one-paragraph justification for that score.

  Exam question:
  "Explain the distinction between the inside view and the outside view. Then discuss how the distinction should guide (a) a project manager estimating how long a firm's enterprise software migration will take, and (b) a research committee assessing a proposal for a radically novel scientific program with no close historical analogues. In each case, state whether and how the outside view should constrain or override the inside view, and under what conditions the inside view may legitimately win."

  Student's answer:
  "The inside view is when you look at the details of the specific case—the particular tasks, team, resources, and obstacles—and build an estimate from those components. The outside view is when you ignore those details and instead use base rates: you find a reference class of similar past cases and use its distribution of outcomes. The planning fallacy literature shows that the inside view is systematically over-optimistic, since people neglect base rates and construct plans that assume everything goes well. Therefore, whenever a usable base rate exists, the outside view should generally override the inside view, because the base rate is the summary of all the information that matters and extra case-specific detail is mostly a source of bias. For the software migration, the manager should simply adopt the industry average completion time for similar migrations and plan around that; the internal task-by-task estimate is just an optimistic story and should be set aside. For the radical research program, however, there is no reference class of similar programs, so the outside view is unavailable to us; the only remaining choice is to assess the proposal on its internal intellectual merits and fund it if those merits look strong. That is what epistemic modesty demands: use statistical reasoning where exact statistical evidence exists, and refrain from pretending to knowledge where it does not."
reasoning: |-
  Okay, the user wants me to grade a student's exam answer about the inside view vs. outside view distinction in judgment under uncertainty. Let me start by understanding the exam question and the student's response.

  The exam asks for an explanation of the inside and outside view, then how each applies to two scenarios: a project manager estimating software migration time and a research committee assessing a novel scientific program. The student defines both views correctly initially—inside view focuses on specific details, outside view uses base rates from similar cases. They mention the planning fallacy causing over-optimism, which is accurate. 

  For the software migration part, the student says the manager should use industry averages and discard internal estimates. That's correct because base rates exist here. But they claim the internal estimate is "just an optimistic story" to be set aside. That's too absolute. The outside view should constrain, not override entirely. The student misses that task details might adjust the base rate, which is a point deduction.

  For the research program, the student correctly notes no reference class but says the only choice is internal merits. However, they overlook broader base rates like failure rates of innovative projects. The outside view isn't entirely unavailable; it's about finding the best available analog. They also don't mention conditions where the inside view could win, like unique expertise. 

  The student's conclusion about epistemic modesty is partially right but oversimplifies. They ignore that inside view can refine base rates and conditions where details matter. Each section has missed nuances: adjustment factors in software, wider base rates in research, and legitimate exceptions. 

  Scoring: Definitions (4/4), Software migration (3/5) for missing adjustments, Research (2/6) for no broader base rates and conditions, Overall (1/5) for the override claim. Total 10/20. The answer gets basics right but lacks depth in application and nuances, leading to half credit.
answer: |-
  ### Grading Assessment

  **1. Definition of inside/outside view (4/4 points)**  
  - Correct: "Inside view... build an estimate from [specific] components" accurately describes case-specific focus.  
  - Correct: "Outside view... use base rates [from] similar past cases" properly defines reference-class forecasting.  
  *No inaccuracies; definitions are precise and aligned with course material.*

  **2. Claim about planning fallacy and bias (2/4 points)**  
  - Correct: "Inside view is systematically over-optimistic" and "neglect base rates" validly cites planning fallacy literature.  
  - **Inaccurate/Overstated**: "Extra case-specific detail is **mostly a source of bias**" (emphasis added). This ignores that unique details *can* provide legitimate adjustment evidence (e.g., exceptionally skilled team). The claim implies all specifics are noise, violating the principle that *diagnostic* details should update base rates.  

  **3. Override principle for software migration (2/5 points)**  
  - Correct: "Manager should... adopt industry average" rightly prioritizes outside view.  
  - **Poorly Defended/Overbroad**: "Internal task-by-task estimate... should be **set aside**" (emphasis added). This misapplies override logic. The outside view should *anchor* estimates, but adjustments for *diagnostic* differences (e.g., "We have 2x more engineers than typical") are legitimate. Dismissing all internal input contradicts structured approaches like reference class forecasting with adjustment.  

  **4. Research program analysis (1/6 points)**  
  - Correct: "No reference class... outside view unavailable" correctly identifies the challenge.  
  - **Inaccurate**: "**Only remaining choice** is to assess... internal intellectual merits" (emphasis added). This ignores *broader* base rates (e.g., failure rates of "radically novel" programs generally, historical analogies from distant fields). Kahneman/Tetlock emphasize *seeking* imperfect analogs over defaulting to inside view.  
  - **Blurred Distinction**: Fails to specify **conditions for inside view legitimacy**. Missing: When should committee trust internal merits? (e.g., proposers’ forecasting track record, mechanistic plausibility). The answer implies the inside view is automatically valid without outside view, ignoring its vulnerability to optimism.  

  **5. Epistemic modesty claim (1/1 point)**  
  - Correct: "Use statistical reasoning where evidence exists" aligns with epistemic humility.  
  *No penalty for incompleteness, as the statement itself is valid.*  

  **Overall Structural Critique (0 points, but informs scoring)**  
  - **Critical Omission**: Fails to address "under what conditions the inside view may legitimately win" for *either* scenario, a key part of the prompt.  

  ---

  ### Score: 10/20  

  **Justification**: The student accurately defines core concepts (6/8 points) and correctly identifies the outside view’s primacy in the software case *in principle* (2/5, due to absolutism). However, they severely misapply the framework to the research scenario (1/6) by dismissing broader base rates and omitting conditions for inside-view validity. Overbroad claims about "bias" and "setting aside" internal input (3 points deducted) demonstrate insufficient grasp of nuanced application. Crucially, they ignore the prompt’s requirement to specify conditions for the inside view’s legitimacy in both cases, reflecting a significant gap in meeting the question’s scope. Points reflect strengths in foundational knowledge but consistent failures in precision, contextual adaptation, and completeness.
