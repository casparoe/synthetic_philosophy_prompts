prompt: |-
  hey — i cover science and ideas for a regional outlet, and somehow i'm also on the county's public arts education board. we're voting thursday on a $180k proposal called Civic Stage: immersive theater workshops for high schoolers where they script and perform moral dilemmas drawn from actual local disputes, then rotate seats so the "audience" is just the next group of performers. the designers claim this dodges rousseau's old complaint about theater — you know, the letter where he said spectacle turns citizens into passive voyeurs of fake emotion — because here nobody is passive; everyone's always both actor and watcher.

  half the board buys it. the other half says that's naive: you've just built a reflexive spectacle where teenagers perform civic virtue for one another's approval instead of engaging in real deliberation. they think rousseau would still hate it, maybe more, because now the corruption is masked as participation. i need a memo for circulation before the meeting recommending either full approval, rejection, or approval with conditions — maybe a single-school pilot running through january with specific evaluation metrics — and it has to take the "reflexive spectacle" objection seriously rather than waving it away. please don't turn this into a literature review; i want concrete reasoning about whether rotating roles actually escapes rousseau's critique or just repackages it, and what conditions (if any) would make the pilot defensible.

  oh, and forgive teh typos — i'm writing this between deadlines.
