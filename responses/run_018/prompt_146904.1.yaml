  I have been trying to think through, without formal training, where legend ends and history begins, taking the Trojan War, King Arthur, and the Exodus as my main reference points—each has some trace, yet none is fully confirmed. The conceptual issue that keeps returning is what I would call inverse corroboration: the reasoning that an expected archaeological or textual absence is better explained by deliberate suppression than by invention, and therefore counts as hidden support for the event's reality. Could you provide a focused example of this issue that shows how applying that same logic to two of these three cases produces opposite credibility judgments for structurally parallel reasons? I am not looking for citations, reading lists, or specialist historiography; I just want the paradox itself laid out clearly, in terms someone familiar with the basic stories but not with academic debates could follow.
