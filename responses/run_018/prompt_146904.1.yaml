answer: |-
  Here's the paradox of "inverse corroboration" laid out clearly using King Arthur and the Exodus:

  1.  **The Core Logic (Inverse Corroboration):**
      *   *Premise:* We expect evidence for a large-scale, significant historical event (like Arthur's reign or the Exodus) to exist.
      *   *Observation:* That expected evidence is absent (no clear contemporary records for Arthur, no Egyptian records of the Exodus events).
      *   *Inference:* This absence *isn't* proof the event didn't happen. Instead, it's *best explained* by deliberate suppression or destruction of the evidence (by enemies, by embarrassed authorities, or due to chaotic times).
      *   *Conclusion:* Therefore, the very absence of evidence indirectly *supports* the event's reality, as it aligns with the expectation that powerful forces would want to erase such events.

  2.  **Applying the Logic to King Arthur (5th-6th Century Britain):**
      *   **Expected Evidence:** Detailed contemporary chronicles, inscriptions, or administrative records mentioning Arthur as a powerful king or war leader during the chaotic post-Roman period.
      *   **Observed Absence:** No such definitive contemporary records exist for Arthur. The earliest references appear centuries later in Welsh poetry and chronicles like the *Historia Brittonum* and Geoffrey of Monmouth.
      *   **Inverse Corroboration Argument:** The absence of 5th-6th century records is easily explained. This was the chaotic "Dark Ages" in Britain. Roman infrastructure collapsed, literacy plummeted, kingdoms rose and fell rapidly, and record-keeping was minimal or non-existent. There was no centralized authority *to* suppress records; the records simply weren't created or didn't survive the turmoil. The later legends *must* be based on some kernel of truth about a significant leader from that obscure time, precisely *because* the period is so poorly documented.
      *   **Credibility Judgment (Using Inverse Corroboration):** The absence of evidence is **expected and natural** due to the chaotic context. This **increases plausibility** for a figure like Arthur existing, even if the legends are exaggerated. The void itself becomes space where a real leader *could* have been.

  3.  **Applying the Logic to the Exodus (Putative 13th Century BCE Egypt):**
      *   **Expected Evidence:** Egyptian records (monumental inscriptions, administrative papyri, court chronicles) mentioning the enslavement of a large Hebrew population, the plagues, the death of Pharaoh's firstborn, or the catastrophic loss of a chariot army pursuing fleeing slaves.
      *   **Observed Absence:** No such records exist in the extensive Egyptian archives. There's no mention of Moses, the plagues, the mass departure, or the drowning of Pharaoh's army. Egyptian records are famously detailed about both triumphs *and* disasters.
      *   **Inverse Corroboration Argument:** The absence of Egyptian records is best explained by deliberate suppression. The events were a national humiliation – the defeat of their gods by the Hebrew God, the death of the divine Pharaoh's heir, the loss of slave labor, and the destruction of their elite military force. The powerful Egyptian state and priesthood would have had both the motive and the means to systematically erase all records of this catastrophic event from their official history.
      *   **Credibility Judgment (Using Inverse Corroboration):** The absence of evidence is **suspicious and deliberate** due to the powerful, literate state involved. This **counts as hidden support** for the event's reality. The very fact we *don't* see Egyptian records is proof they were covering it up.

  4.  **The Paradox Revealed (Opposite Judgments from Parallel Logic):**
      *   **Parallel Structure:** In *both* cases, the logic of inverse corroboration is applied: Absence of expected evidence is explained by contextual factors (chaos vs. suppression) and used to *support* the historicity of the core event.
      *   **Opposite Credibility Outcomes:**
          *   For **Arthur,** the logic leads to: "**No records? That makes sense for the chaotic Dark Ages, so Arthur is plausible.**" (The absence is *passive* and expected).
          *   For **Exodus,** the logic leads to: "**No records? That *proves* the powerful Egyptians covered it up, so the Exodus is supported.**" (The absence is *active* and deliberate).
      *   **The Contradiction:** The *same reasoning* (absence explained by context = support for historicity) produces diametrically opposed judgments about the *nature of the evidence gap* and its implications:
          *   Arthur's absence is **evidence of a historical void** (where something real *could* fit).
          *   Exodus's absence is **evidence of historical suppression** (which *confirms* the event happened).
      *   **Why it's a Paradox:** It demonstrates how the inverse corroboration argument is highly flexible and context-dependent. Depending on how you characterize the *reasons* for the absence (passive loss vs. active suppression), the same absence can be used to argue *for* the plausibility of two very different types of legendary events. It highlights that the argument relies heavily on *presumed motivations* (e.g., would Egyptians suppress such an event? How thorough would they be?) rather than on concrete evidence, and these presumptions can easily be flipped to support opposite conclusions using the same core logic.

  **In essence:** Inverse corroboration argues that absence *is* evidence, but the *meaning* of that absence depends entirely on the assumed historical context. For Arthur, absence means the era was too chaotic to write things down (supporting a possible real figure). For Exodus, absence means a powerful state covered it up (supporting the event's reality). The logic structure is identical, but the assumed context flips the interpretation of the missing evidence, leading to opposite judgments about credibility. This flexibility is the core of the paradox.
