prompt: |-
  i'm prepping a session for a sociology colleague who keeps saying epistemic injustice is just fancy talk for being ignored, and i want to walk her through why the hermeneutical kind is structurally different rather than personally rude. the specific idea i'm trying to get across doesn't have a clean name in the standard texts, so i'm calling it institutional hermeneutical smothering: it's the situation where a bureacratic vocabulary like welfare risk scores doesn't merely misrepresent someone's lived situation but actually renders that situation unformulable inside the system's own categories. i need a teaching plan for about forty minutes, not the lecture itself. tell me the exact order the pieces have to come in so she can see why being ignored misses the point—what has to land first before the structural claim even makes sense. pick one carring example built around algorithmic welfare eligibility and specify what that example must contain and what it absolutely must lack, otherwise it collapses into the computer is biased. then map the misconceptions she'll hit in sequence: first that this is testimonial injustice with extra steps, then that it requires malicious intent, then that fixing it just means giving her a voice. for each one say precisely where in the arc i should head it off before it hardens. i also want a single check at the end that proves she's grasped the structural unformulability part and hasn't just empathized with the applicant. be explicit about which part of Miranda Fricker's original framework i should deliberately leave out at this level and just admit i'm skipping it. please write everything in continuous prose only—no headings, bullet points, bold text, or tables, exactly like a long email—and don't include any reading lists or citations. there's a typo or two in this message but you get the idea.
reasoning: |-
  Okay, the user is preparing a session for a sociology colleague who dismisses epistemic injustice as just "fancy talk for being ignored." They specifically want to clarify hermeneutical injustice, framing it as "institutional hermeneutical smothering" where bureaucratic systems make certain lived experiences impossible to articulate within their own categories. 

  The challenge is structural vs personal misunderstanding. The colleague keeps reducing it to "being ignored," so the session needs to dismantle that step by step. User requested a 40-minute teaching plan with strict sequencing—each concept must land before the next makes sense. 

  First hurdle: The colleague likely conflates this with testimonial injustice. Need to preempt that early by showing hermeneutical injustice isn't about credibility deficits but missing language. Must pick a concrete example—algorithmic welfare eligibility—that *can't* be mistaken for bias. The example must lack any hint of prejudice; the system should be technically "fair" yet still erase lived reality. 

  Second hurdle: Colleague might assume malicious intent. The example must involve neutral bureaucracy—no villains, just procedures that unintentionally silence. 

  Third hurdle: Thinking "giving voice" solves it. Need to demonstrate that the problem is the system's categorical limitations, not individual expression. 

  End with a check: Ask colleague to design a form field that captures the applicant's reality. If they suggest adding categories (e.g., "mental health"), they've missed the point—it should expose how the structure inherently excludes certain experiences. 

  Deliberately skip Fricker's power dynamics here to avoid overcomplication. Focus solely on structural unformulability. 

  User’s typo ("bureacratic", "carring") doesn’t hinder understanding—they’re clearly urgency-typing. Their ask is precise: no bullet points, prose-only like an email. Will avoid academic citations per request. 

  Key insight: This isn’t about empathy ("poor applicant!") but about exposing how systems preempt articulation. The colleague needs to feel the frustration of having no words *within the system*—not just being unheard.
answer: |-
  Start by grounding this in something concrete she’ll recognize as systemic, not interpersonal. Describe a welfare applicant—let’s call her Maria—facing an algorithmic eligibility system. She’s a single mother caring for a disabled sibling while juggling precarious gig work. The system uses rigid categories: "employment status" (dropdown: employed full-time/part-time/unemployed), "dependents" (only minors or spouses), "household income" (monthly average). Maria’s caring responsibilities don’t fit "unemployed" (she’s seeking work) or "employed" (her hours are erratic). The sibling isn’t a "dependent" under policy definitions. Her actual constraint—being available only for sporadic work *because* unpredictable care demands prevent fixed schedules—isn’t a selectable option or describable field. Crucially, the system **lacks any field for "unpredictable non-dependent care obligations" or "time poverty due to kinship care."** It’s not that the algorithm *misweights* her inputs; it’s that her core barrier to stable income **cannot be entered anywhere.** This absence isn’t an oversight; it’s baked into the taxonomy.  

  **Order of Pieces:**  
  1.  **First, make "being ignored" feel insufficient.** Ask your colleague: *"If Maria stood before a caseworker and said, 'I can’t work regular hours because my disabled brother needs me unpredictably,' and the caseworker shrugged, is that epistemic injustice?"* Yes—but that’s testimonial: she spoke, was heard, dismissed. Then reveal: **Maria never gets that far.** The online form has no text box for her explanation. Her reality is structurally pre-empted. She must tick boxes that misrepresent her—forcing her into categories like "underemployed by choice." *This stops "ignored" from sticking.* If she can’t articulate it *within* the system’s logic, she wasn’t "ignored"—she was silenced by design.  

  2.  **Preempt "testimonial injustice with extra steps" here.** When describing the form, emphasize: Maria isn’t *distrusted*; she’s **procedurally barred from offering testimony relevant to her case.** Testimonial injustice corrupts reception; hermeneutical injustice blocks articulation *before* reception. If she says, "But the caseworker could override the form!" note that the system *discourages* overrides via audit trails and compliance flags—the bureaucracy penalizes deviation. The point isn’t that humans *could* listen outside the system; it’s that the system *defines what counts as a legible claim.*  

  3.  **Crush the "malicious intent" misconception immediately after.** Suppose the programmers included mental health flags or "complex household" options. Argue: **Even with benevolent additions, the taxonomy imposes a schema.** Maybe they add "primary caregiver for adult sibling"—but what if Maria’s brother only needs intermittent help? Does she select "yes" and risk seeming fully unavailable for work? The system compresses fluid realities into discrete categories. Stress: the architects likely aimed for efficiency, not harm. The injustice is in the **structural effacement of certain life patterns**, not individual malice.  

  4.  **Block "giving her a voice" as the solution late in the arc.** After she’s grasped the categorical gap, ask: *"What should Maria write in a 'comments' box we add?"* Maria might say: "My brother’s panic attacks happen randomly, so I miss shifts." But the algorithm processes "keywords"—"panic attacks" triggers a mental health module assessing *his* disability support, not *her* availability. Her words get parsed into predefined slots, distorting meaning. **Adding voice without hermeneutic justice just generates more misfitting data.** The system lacks concepts to *understand* her testimony.  

  **The Check:**  
  Don’t ask her to empathize with Maria. Ask: *"How would you redesign the form to capture Maria’s constraint?"* If she suggests new categories (e.g., "irregular care commitments"), counter: *"What if the care is for a neighbor? Or a dependent who’s an adult with intermittent needs? Or self-care limitations due to trauma?"* Her solutions will either overgeneralize or spawn endless sub-categories. The win is when she admits: **No bureaucratic taxonomy can fully capture lived complexity; the violence is in forcing life into reductive frames.** If she says, "The system itself can’t *hold* her truth," she’s got it.  

  **Deliberate Omission:**  
  Skip Fricker’s focus on *identity prejudice* as the root cause. Here, the issue isn’t that Maria is marginalized *as a person* (though she might be), but that her *situation* lacks hermeneutic resources. Bureaucracies smother through indifference, not prejudice. Admit you’re bracketing identity to spotlight structure. Say: "For today, we’re not asking *why* the categories are limited—just seeing that their limits *constitute* the injustice." This keeps the target clear: **unformulability isn’t about Maria being ignored; it’s about her reality having no place to exist on the form.**
