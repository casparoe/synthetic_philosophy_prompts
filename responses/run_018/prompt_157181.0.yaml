prompt: |-
  Consider a three-year research program in conceptual AI alignment and value theory, staffed by philosophers and formal decision theorists without access to large-scale machine-learning engineering. The program aims to resolve open problems in coherent extrapolated volition and idealized preference aggregation—frameworks in which an alignment target is defined not by observed behavior but by some coherence-refined, counterfactual extension of human preferences. Rather than surveying the field, rank the three or four unresolved questions that should command the group's attention, with explicit reasoning about priority.

  Specifically, address issues such as: whether standard coherence axioms (e.g., independence conditions drawn from expected-utility theory) should be retained when preferences are extrapolated under conditions of enhanced reflection, or whether systematic cognitive revision violates them in ways that matter for the output; whether aggregation across individuals should occur at the level of raw preferences, after individual extrapolation, or through an intermediate social-choice mechanism, and what formal properties distinguish these architectures; how to model extrapolation dynamics without presupposing a fixed, complete utility ordering over world-histories; and how to operationalize the distinction between revealed preference and idealized preference when counterfactual reasoning introduces inconsistencies that coherence procedures alone cannot resolve.

  For each question you prioritize, defend its ranking: identify which downstream design choices or evaluation criteria depend on its resolution; assess its tractability for researchers using philosophical analysis and formal modeling rather than empirical ML; and specify what kind of result—such as a representation theorem, a consistency proof, or a demonstrated impossibility—would genuinely alter how practitioners think about alignment targets. Conversely, identify at least one prominent question in this literature that you would actively deprioritize for this group, explaining why resolving it would not materially change practice or why it requires tools outside the group's competence. Do not provide a bibliography, reading list, or citation of specific authors; ground your reasoning in the conceptual structure of the problems themselves.
