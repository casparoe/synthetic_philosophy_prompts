prompt: |-
  Hey — I help run a tiny philosophy reading group (me, two friends, whoever wanders in), and we've gotten stuck on something I definately can't tell is a real distinction or just us reinventing a wheel.

  Here's the pattern. Someone says "I can conceive of a world exactly like this one except X isn't in it" — X being consciousness, or causation, or time, or moral facts, whatever. It feels easy: you say the sentence, nothing explodes, you get a kind of blank mental image and move on. But when we actually try to describe the world in any detail, one of two things happens. Either we keep sneaking X back in (we describe the world "without causation" by saying how events unfold, which is causal talk), or we bottom out at "like this one, but without X," where that one little "but without" is doing all the work. It feels like the conceivability is borrowed against details we never filled in, and the loan gets called in the second we try to make the picture richer.

  And it goes both ways, which is the part that bugs me. Some things get *more* conceivable the more you know: before you've done any physics, "no fact of the matter whether two distant events happened at the same time" sounds like nonsense; after, it's easy. So knowing more opens some scenarios up and closes others down — and the closing-down cases don't feel like finding a contradiction. They feel like finding out our vocabulary has no way to say the thing.

  Someone in the group said there's a famous argument that some stuff which looks like it could have gone otherwise turns out to be necessary once you know the relevant facts about the world (identity-ish?). Close, but not it: in our cases there's no identity claim and no new discovery about the world, just the realization that we can't spell the scenario out.

  Is there a name for the kind of "conceivable" that shrinks as you add detail? And for the two-directional thing? If not, coin something and give it edges — I want to be able to tell it apart from plain "I can't see a contradiction" and from a scenario that's just gibberish like a round square. Don't give me papers or a reading list, I've got no library access, just say what the thing is in your own words.

  Lead with a one-line verdict ("there's an established concept: X" or "no established concept, I'd call it Y"), then the carving — what it is, what it isn't, and one boundary case. All of it under 300 words, no bullet list if you can manage it.
reasoning: |-
  Okay, the user runs a small philosophy group and they've hit a snag with conceivability arguments. They notice that when someone claims they can conceive of a world without X (like consciousness or causation), it seems easy at first. But when they try to flesh out the details, they either sneak X back in or can't describe it beyond "like this but without X." The user is frustrated because this happens both ways—some things become more conceivable with more knowledge, like the relativity of simultaneity after learning physics. They mention that it's not about finding contradictions but about lacking the vocabulary to describe the scenario. They want to know if there's a term for this phenomenon where conceivability shrinks with added detail, or if they should coin one. 

  First, I need to recall relevant philosophical concepts. Kripke's necessary a posteriori comes to mind, where something is necessary but known through experience. But the user says it's not about identity or new discoveries. Then there's Chalmers' distinction between primary and secondary conceivability, where primary is based on superficial understanding and secondary on deeper knowledge. That seems closer. The user's scenario of conceivability collapsing when adding details aligns with primary conceivability being undermined by conceptual analysis. 

  The two-directional aspect: some concepts become more conceivable with knowledge (like relativity), which might involve secondary conceivability where understanding the scientific model makes it conceivable. So primary vs. secondary conceivability fits both shrinking and expanding cases. 

  The user wants a one-line verdict. Established concept: "Primary Conceivability." They need to distinguish it from "no contradiction" scenarios and gibberish. Primary conceivability is thin, based on superficial descriptions, and can vanish with detail. It's different from strict logical contradiction (like round squares) because it's about conceptual coherence. 

  Boundary case: Conceiving "water isn't H₂O" seems possible until you understand that water is H₂O necessarily, making it inconceivable upon deeper analysis. Whereas "simultaneity isn't absolute" becomes conceivable with physics knowledge. 

  So, the response should start with "Established concept: Primary Conceivability," then define it, contrast with secondary conceivability, and give examples. Keep it under 300 words, avoiding bullet points. Make sure it's clear and addresses their need to differentiate this concept from others.
answer: |-
  **One-line verdict:** Established concept: **Primary Conceivability** (specifically its limitations).

  **The Carving:**  
  Primary conceivability is the initial, superficial "seeming possibility" of a scenario based solely on its description, without demanding full metaphysical or conceptual coherence. It shrinks with detail because adding specifics forces engagement with the actual concepts involved, revealing hidden dependencies or incoherence ("sneaking X back in" or hitting the "but without" wall). This *isn't* strict logical contradiction (like a round square, which is gibberish from the start), nor is it robust "secondary conceivability" – the deeper, coherent possibility that *can* emerge with more knowledge (like relativity making non-absolute simultaneity conceivable). The two-directionality arises because primary conceivability is description-dependent and often naive, while secondary conceivability builds on substantive understanding.

  **Boundary Case:**  
  *   **Primary Conceivable but Not Secondarily:** "A world physically identical to ours but without consciousness." Seems initially imaginable ("blank mental image"). Adding detail (e.g., describing identical brain states/behaviors) forces the question: what *is* missing if everything physical is identical? This exposes the conceptual tension, collapsing the thin conceivability.
  *   **Secondary Conceivable (after knowledge):** "No absolute simultaneity." Initially seems contradictory ("things *must* happen at the same time or not!"). Understanding relativity provides the coherent model/vocabulary, making it robustly conceivable.

