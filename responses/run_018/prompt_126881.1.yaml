answer: |-
  Ah, I see your point about the committee, and it’s a clever one! But I fear it rather misses the heart of the difficulty. In your scenario, the "repeater" isn’t genuinely *asserting* that it’s raining *in the sense I have in mind*. They are acting as a mere conduit, reporting what others say. They might say "It’s raining" as a quotation, or as a report of the committee's finding, without themselves endorsing the proposition. Their subsequent "I don't believe it" is perfectly coherent because they haven’t, in that act of utterance, staked their own conviction on the matter. They are describing a state of affairs reported by others while simultaneously describing their own state of disbelief. No clash occurs.

  The peculiar absurdity I’m wrestling with arises precisely when a single person, in their own voice, in the present moment, makes what purports to be a straightforward, sincere *assertion*: "It *is* raining." To assert something, in the ordinary sense, *just is* to put it forward as true, which involves, as a matter of common practice, implying one's own belief in its truth. It’s how we *use* language. Then, to add "but I don’t believe it" immediately after, in the same breath, undercuts the very act just performed. It’s not that "p and not-p" is formally contradicted; rather, the speaker practically *retracts* the ground upon which the assertion stood in the very act of making it. The absurdity lies in the *performance*: one undermines one’s own position within the same speech act. Separating speaker and believer, as your repeater does, avoids this because the repeater never took up the position of *asserting* in their own right to begin with. The paradox bites only when one tries to occupy both positions – sincere asserter and disbeliever – in relation to the *same* proposition, concerning *one's own present* belief, *in one's own person*. That’s where the practical clash manifests. Your committee shows the absence of the clash when those conditions are dissolved, but it doesn’t show that the clash isn’t genuine when they are present.
