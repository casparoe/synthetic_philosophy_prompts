prompt: |-
  hey, I'm in the middle of drafting this novel about a library board in a small town fighting over whether to stock some controversial book — you know, local politics that gets weirdly philosophical. I was talking with my friend over coffee about Sen's liberal paradox, the one where minimal liberty for each person clashes with Pareto efficiency because people actually care about each other's choices, not just their own. I want that tension running underneath the chapter where they actually vote, but I don't want to explain it like a lecture.

  could you write a villanelle for me to use as the chapter's epigraph? I want the two refrains to be the competing principles: one about every individual deciding for themselves, and one about the group deferring to unanimous preference. The form should do the philosophical work — they should keep circling and swapping places through the tercets, never resolving, until the final quatrain where they're forced to stand side by side in contradiction. Maybe write it in the voice of the town clerk taking minutes, or even in the voice of the book sitting on the table. It needs to be accurate enough that someone who actually knows Sen's argument wouldn't wince, but it shouldn't read like a textbook summary with line breaks. I definately don't need a bibliography or citations — just a real poem that captures the paradox structurally.

  oh, and I'm writing this fast on my phone between writing chapters, so sorry if I'm being vague — but you get the idea.
