answer: |-
  Here’s a structured proposal draft focusing on your core insight, with clear framing and scope for a semester project:

  **Workshop Proposal: Decoupling Correlation Types in Decision Puzzles**  
  **Subtitle:** *Why Platonia ≠ Luring Lottery and What It Reveals About Logical vs. Causal Dependence*

  ### 1. Core Problem & Insight
  Existing decision theory treats *Platonia Dilemma* (identical reasoning twins) and *Luring Lottery* (probabilistically gated copies) as testing the same "cooperation with copies" intuition. I argue they probe **fundamentally distinct dependence types**:
  - **Logical Correlation (Platonia):** Outcomes are determined by *synchronic logical connections* between identical agents’ outputs. Your decision *is* your twin’s decision by identity.
  - **Causal Correlation (Luring Lottery):** Outcomes are determined by a *causal process* (e.g., a lottery) that *screens off* direct logical identity. Copies are causally linked but not logically identical *within the decision context*.

  The conflation arises because both puzzles use similar payoff matrices, masking that **CDT fails for opposite reasons**: it ignores *logical* dependence in Platonia but *correctly* ignores *spurious* causal dependence in Luring Lottery. The real challenge: **Can we isolate logical-correlation reasoning without re-introducing EDT-like causal influence?**

  ### 2. Gap in Literature
  Current analyses (e.g., Hofweber, Bostrom, Yudkowsky) often:
  - **Oversimplify via matrices:** Representing both puzzles with identical payoff tables erases the mechanistic distinction.
  - **Focus on "failing CDT" conclusions:** Missing that the failures stem from different *sources* of correlation.
  - **Jump to "superrationality" fixes:** Without rigorously separating whether the fix addresses *logical necessity* or *causal acausality*.

  This leaves open: *What structural feature of an agent/rule allows responsiveness to logical correlation while remaining inert to screened-off causal correlation?*

  ### 3. Proposed Method
  - **Framing:** Define "logical correlation" as dependence arising from *constraints of agent identity or reasoning rules* (e.g., "I know my twin outputs what I output"). Define "causal correlation" as dependence mediated by *exogenous probabilistic mechanisms* (e.g., "a lottery determines if we act together").
  - **Hybrid Puzzle Design:** Create a new dilemma combining elements of both:
    - Agents are logically identical (like Platonia).
    - A *broken causal gate* is introduced (e.g., a lottery that *appears* relevant but is known to be disconnected from outcomes).
    - **Test:** Does a proposed decision rule cooperate *only* when logical correlation is present, resisting the decoy causal structure?
  - **Rule Analysis:** Investigate formal properties a rule requires to achieve this separation (e.g., must it explicitly model agent identity? reject probabilistic conditioning under certain syntactical constraints?).

  ### 4. Success vs. Failure Conditions
  - **Success (Strong):** Identification of a decision rule (or modification) that passes Platonia + Hybrid but *fails/rejects* Luring Lottery. Demonstrates separable mechanisms.
  - **Success (Weak):** A rigorous demonstration that *no* rule can satisfy the separation without collapsing into EDT or another existing framework. Proves the distinction is illusory or incoherent.
  - **Failure:** The hybrid puzzle shows no significant difference from existing cases; logical/causal distinction proves irrelevant to decision outputs under plausible rules.

  ### 5. Scope & Deliverables (Semester-Length)
  - **Feasible Goal:** Rigorously formalize the distinction, design the hybrid puzzle, and analyze 2-3 candidate rules (e.g., a restricted CDT+, FDT, an EDT variant) within this framework.
  - **Boundaries:**  
    - *In scope:* Conceptual analysis, puzzle design, formal comparison of rules on tailored cases.  
    - *Out of scope:* Proposing a fully novel decision theory; exhaustive analysis of all historical puzzles; empirical psychology.  
  - **Output:** A 5,000-word paper OR 20-min talk presenting:  
    (1) The logical/causal dependence distinction,  
    (2) Critique of conflation in existing work,  
    (3) Hybrid puzzle & results of rule analysis,  
    (4) Conclusion on viability of separating correlation types.

  ---

  **Key Strengths:**  
  - **Novelty:** Challenges the assumed equivalence of two major puzzles.  
  - **Precision:** Targets a specific, underexplored mechanism (correlation type) rather than "CDT vs. EDT" broadly.  
  - **Testability:** Hybrid puzzle provides a concrete litmus test.  
  - **Self-critical:** Explicitly defines failure modes (e.g., distinction = EDT in disguise).  

  **Spelling Note:** "Correlation" fixed throughout – no worries! This draft avoids citations as requested but leaves clear hooks for your references later (e.g., Hofweber on Platonia, Yudkowsky on Luring Lottery). Ready for your polish!
