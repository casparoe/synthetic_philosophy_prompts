answer: |-
  ### Echo Chamber vs. Epistemic Bubble: In-Class Simulation  
  *You're running this for 14 postgrads in 75 mins. Let's keep it tight, slightly chaotic, and revealing.*

  ---

  #### **Game Setup**  
  **Materials Needed:**  
  - 14 **player cards** (each with a unique ID: P1 to P14).  
  - 42 **signal cards** (14 players × 3 rounds):  
    - *Design:* Cards show "climate signals" like "CO2 ↑", "Glaciers melting", "Solar activity ↑", "Deforestation ↓", etc.  
    - *Secret Twist:* 70% of cards subtly align with *human-caused climate change* (e.g., "CO2 ↑"), 30% with *natural causes* (e.g., "Solar activity ↑").  
  - 1 **hidden source card** (for you, the facilitator): "IPCC Report" (symbolising an authoritative source).  
  - **Credibility tokens:** Each player gets 3 green (high trust) and 3 red (low trust) tokens.  
  - **Voting slips** + pens.  
  - **Stakes:** Chocolate bars for "winners" (top 3 point scorers).  

  **Prep Work:**  
  - Pre-sort signal decks so signals loosely correlate with your hidden "IPCC" card (e.g., players with pro-IPCC signals get more "human cause" cards).  
  - Assign roles: 10 players get decks biased toward human causes (Group A), 4 get natural causes (Group B). *Don’t reveal this bias!*  

  ---

  #### **Game Rules & Timeline**  
  *(Total: 60 mins gameplay + 15 mins debrief)*  

  1. **Intro & Setup (5 mins):**  
     - Briefly define:  
       - *Echo chamber:* Info missing (no dissent).  
       - *Epistemic bubble:* Info present but ignored due to trust networks.  
     - Hand out player cards, initial signal cards (3 per player), and tokens.  
     - **Objective:** Guess the "true cause" of climate change (human/natural) each round. Earn points for correct votes + high peer credibility.  

  2. **Round 1: Initial Signals (10 mins):**  
     - Players read their 3 signal cards.  
     - Open discussion: Share signals freely (*no lying!*).  
     - **Credibility Rating:** Privately give green/red tokens to peers based on "how trustworthy their signals seem".  
     - *Secret Move:* Collect tokens. For any player given >2 green tokens, secretly check if their signals align with your *hidden source card*. If YES, mark them as "IPCC-trusted".  

  3. **Round 2: Trust Cascade (15 mins):**  
     - Hand out new signal cards (same bias as Round 1).  
     - **Reveal:** Share *only* the aggregated credibility scores (e.g., "P5: 8 greens; P12: 6 reds").  
     - Discussion: Players debate again—but now credibility scores are public. High-credibility players dominate.  
     - **Vote:** Secret ballot on "human" or "natural" causes.  

  4. **Round 3: Polarisation (15 mins):**  
     - Repeat signal sharing + credibility ratings.  
     - **Critical Twist:** Introduce 2 dissenting signals (e.g., a Group A player gets "Volcanic activity ↑"; Group B gets "Industrial emissions ↑").  
     - Final vote.  

  5. **Scoring (5 mins):**  
     - Points:  
       - +3 pts for correct vote each round.  
       - +1 pt per green token received.  
       - +5 pts if all votes matched the majority.  
     - Announce top 3 scorers (chocolate prizes).  

  ---

  #### **Predictable Chaos & "Aha!" Moments**  
  - **Where It Gets Messy:**  
    - Group B (natural-cause bias) will be drowned out by Group A’s high credibility, even when dissenting signals appear in Round 3.  
    - Players assume credibility scores reflect peer consensus, not your hidden source. When you reveal the "IPCC-trusted" list post-game, they’ll realise trust was *correlated*, not independent.  
    - **Polarisation:** By Round 3, high-credibility Group A players ignore new dissent ("Volcanic activity") because they’ve built "social proof" via correlated trust. Group B players disengage or overcorrect.  

  - **What Goes Wrong First Time:**  
    - Discussion may stall if no one challenges high-credibility players (assign a "provocateur" role to one brave soul if needed).  
    - Point-tallying takes ages—use a helper or pre-made spreadsheet.  
    - Players might gossip about signals ("Why does P8 always get ‘CO2’ cards?!").

  ---

  #### **Debrief (15 mins)**  
  **Connect Game to Concepts:**  
  1. **Epistemic Bubble ≠ Echo Chamber:**  
     - *Echo chamber:* Dissent was *present* (Round 3’s volcanic/industrial signals) but ignored.  
     - *Epistemic bubble:* Hidden trust correlations (your "IPCC-trusted" list) made Group A *systematically discount* dissent. They thought peers independently verified them—but it traced back to one source.  

  2. **Real-World Links:**  
     - "You acted like academics citing each other’s papers—not realising everyone’s trusting the same flawed institution."  
     - "The credibility scores mimicked social media algorithms promoting ‘high-engagement’ users, creating invisible tribes."  

  **Limitations (Be Frank!):**  
  - *"This game can’t replicate years of cultural bias—you’re not invested like you are in real politics!"*  
  - *"IRL, trust networks are messier. No facilitator is secretly pulling strings (we hope)."*  

  **End with a Punch:**  
  *"So—who felt their dissent was heard? Who realised too late that ‘peer trust’ was just an illusion of independent confirmation?"*  

  ---  
  **Pro Tip:** Bring spare chocolate for emotional support. When students see the "IPCC-trusted" list, there’ll be groans. Lean into it—that’s the point!
