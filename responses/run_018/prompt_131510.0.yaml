answer: |-
  Based on the pattern of your advisor's verdicts, I'll reverse-engineer the underlying rule, predict her stance on the digital nomads case, identify competing rules, and design a sharp test case. The key is that her decisions aren't based on a single principle but a layered framework prioritizing **durable subjection to authority** and **discursive capacity**, with context-specific thresholds.

  ### Prediction for Digital Nomads Case
  She would **exclude** digital nomads from the broadband infrastructure demos.  
  **Reasoning**:  
  - Nomads lack *stability* (3-6 months is transient; contrast with undocumented residents' "long-term" status).  
  - They pay consumption taxes but hold no leases and maintain political ties elsewhere, weakening *reciprocal vulnerability* to the city's authority.  
  - Broadband decisions have long-term impacts beyond their stay, aligning with the factory co-op logic (seasonal workers excluded despite higher risk).  

  ---

  ### Reverse-Engineered Rule
  Her framework appears to be:  
  **"Inclusion requires (A) sustained, reciprocal vulnerability to the body’s authority AND (B) embodied capacity to participate in its discourse. Thresholds for A/B vary by context, but A is primary and non-negotiable for full membership."**  

  #### Components:
  1. **Stable Reciprocal Vulnerability (A)**:  
     - Must be durably subject to the regime’s authority *and* affected by its decisions.  
     - "Reciprocal" implies the body’s rules bind them, and their actions can meaningfully impact the collective (e.g., through compliance or contribution).  
     - Thresholds for "stable": Duration (e.g., undocumented residents' longevity), relationship depth (e.g., tribal spouses' 5+ years), or issue permanence (e.g., sacred-land vs. domestic issues).  

  2. **Embodied Discursive Capacity (B)**:  
     - Must be physically/ontologically capable of engaging in the community’s discourse *as defined by that body*.  
     - Not limited to literal speech (e.g., text-scraped individuals are "embodied" in data).  
     - Modifies membership level: Full voting requires capacity (e.g., students 16+), while proxies (climate) or advisory roles (students 13-15) compensate for incapacity.  

  #### Why This Fits All Cases:
  | Case                          | (A) Stable Reciprocal Vulnerability?                              | (B) Embodied Discursive Capacity?            | Verdict                                     | Alignment                                                                 |
  |-------------------------------|-------------------------------------------------------------------|----------------------------------------------|---------------------------------------------|---------------------------------------------------------------------------|
  | **Rent control**              | ✅ Long-term subjects of housing regime; bound by leases/laws.    | ✅ Physically present; can engage locally.   | Full vote for undocumented.                | A+B met.                                                                 |
  | **Climate assembly**          | ❌ Future gens vulnerable but not *currently* subject to authority. | ❌ Cannot engage in present discourse.       | Proxy seats only (partial inclusion).      | A fails → no full membership; B failure justifies proxies.               |
  | **Factory co-op**             | ❌ Seasonal workers lack durable ties; co-op’s authority transient. | ✅ Physically present; can discuss safety.   | Excluded.                                  | **A fails → exclusion despite B.** Prior case splitting competing rules. |
  | **School board**              | ✅ All students subject to curriculum. Stability via enrollment.  | ✅/❌ Age-graded capacity (16+ full, 13-15 partial). | Tiered inclusion.                         | A met for all; B modulates membership level.                             |
  | **River-basin council**       | ❌ Upstream polluters not subject to downstream council’s authority. | ✅ Physically capable but not "local".       | Excluded (reparations owed separately).    | A fails → exclusion. B’s "local" scope limits discourse.                 |
  | **Digital commons**           | ✅ Data-subjects vulnerable to AI use; bound by commons’ rules.   | ✅ Presence via data (scraped text = embodiment). | Included.                                | A+B met (digital embodiment counts).                                     |
  | **Tribal land council**       | ✅ Domestic: Spouses subject to household rules. Sacred: ❌ (no cultural authority). | ✅ Physically present.                       | Domestic: vote. Sacred: excluded.         | A modulates by issue-type; B met.                                        |

  ---

  ### Competing Rules & Underdetermination
  Your two proposed rules fit, but they’re interdependent in her framework. However:  
  - **Rule A (vulnerability) is dominant**: Factory co-op shows exclusion *solely* due to unstable vulnerability, overriding discursive capacity.  
  - **Rule B (discursive capacity) is secondary**: It modifies *how* inclusion manifests (e.g., full vote vs. proxy) but doesn’t override A.  

  #### Other Plausible Rules That Fit:
  1. **"Stakeholder proportionality"**: Inclusion scales with duration of affectedness.  
     - Fits: Undocumented (long stake) > nomads (short stake) ≈ seasonal workers (short stake).  
     - Weakness: Fails on climate future gens (infinite stake but no vote).  

  2. **"Authority-bound agency"**: Membership requires being both ruled by *and* able to shape the body.  
     - Fits all cases except river-basin (upstream can shape downstream via pollution but excluded).  

  **Underdetermination in Nomads Case**:  
  Precedents don’t specify a minimum duration for "stability." If she:  
  - **Includes nomads**: She prioritizes *immediate affectedness* (broadband use) + *fiscal reciprocity* (taxes), relaxing durability.  
  - **Excludes nomads**: She emphasizes *temporal thresholds* (3-6 months < undocumented/tribal durations) and *political allegiance* (home-country voting).  

  Given her pattern, exclusion is more consistent (factory co-op/upstream analogies).  

  ---

  ### Sharpest Test Case to Split Competing Rules  
  **Scenario**: A town adjacent to a military base hosts non-citizen contractors for 2-year deployments. They:  
  - Pay local taxes.  
  - Use infrastructure (roads, hospitals).  
  - Are subject to town laws.  
  - Can physically attend town meetings.  
  - Decision: Building a new highway affecting their commute.  

  **Why this splits rules**:  
  - **Rule A (vulnerability)**: Excludes if stability threshold >2 years (aligning with factory co-op/upstream).  
  - **Rule B (discursive capacity)**: Includes due to physical presence and affectedness.  
  - **Her predicted verdict**: *Exclude* (2 years is less than tribal spouses’ 5+ years; authority is transient).  

  This isolates A’s dominance—if contractors were included, Rule B or stakeholder logic wins.  

  **Conclusion**: Your advisor’s framework centers on durable vulnerability, with discursive capacity as a gatekeeper for participation *form*. For digital nomads, their transience and external political ties likely exclude them, mirroring seasonal workers. The military base test case would clarify the stability threshold.
