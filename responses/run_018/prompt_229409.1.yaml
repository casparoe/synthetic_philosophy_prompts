prompt: |-
  You are a professional philosopher specializing in the philosophy of psychiatry and the philosophy of classification, with a particular interest in how labels feed back into the people they are applied to. I am a software engineer with no formal philosophy background, so please do not assume I know the literature; just engage with the cases and the principle. I work on a clinical decision-support tool that suggests psychiatric screening labels for primary-care clinicians, and I keep running into the same puzzle. A label is not a neutral description. Once applied, it changes how clinicians interpret a patient's behavior, how the patient understands themself, and how the patient then behaves; that changed behavior can make the label more or less accurate over time. I have seen this called a looping effect. I have been writing down my own verdicts about concrete cases, and I want to know whether they add up to a coherent principle or whether I am just responding case by case.

  Please take your time. Start by brainstorming several candidate principles before committing to one. Then state your best principle, or a small set of candidate principles, in precise but non-technical language. For each clause of the principle, tell me which of my cases motivates it. Test the principle against every case below, tell me which of my verdicts it preserves and which it forces me to overturn, and then apply it to the two further cases at the end.

  Here are my cases.

  C1. A 16-year-old begins avoiding social situations and reads a lot about social anxiety online. He starts saying he has social anxiety disorder. His parents treat this seriously, he declines invitations by citing the disorder, and within a year his avoidance is much worse. Verdict: applying the label was bad here, because it helped turn ordinary and possibly transient shyness into an identity that entrenched the avoidance.

  C2. A 34-year-old with similar underlying symptoms—avoidance, blushing, fear of judgment—is formally diagnosed with generalized anxiety disorder by a psychiatrist. The diagnosis is a relief: it explains years of difficulty, ends self-blame, and connects him to treatment that helps. Verdict: applying the label was good here.

  C3. At a school where ADHD diagnoses are common, an energetic 8-year-old is quickly referred and diagnosed. Once labeled, his restlessness is re-read by teachers as a symptom rather than as boredom with an under-stimulating classroom, and he starts describing himself as someone who cannot focus without medication. Verdict: applying the label was bad here.

  C4. A 26-year-old with a genuine lifelong history of focus and organization problems receives an ADHD diagnosis. Medication measurably improves his ability to hold a job, and he says the diagnosis gave him a framework and tools rather than an excuse. Verdict: applying the label was good here.

  C5. A woman is diagnosed with borderline personality disorder after a brief emergency-room visit following a single episode of self-harm. The label stays in her chart for years. She reports that later clinicians stop taking her physical complaints seriously and describe her as manipulative. Verdict: applying the label was bad here—not because the category is always bad, but because it was assigned quickly on thin evidence and then acted as a permanent filter that distorted her later care.

  C6. A woman is diagnosed with autism spectrum disorder in her thirties. The label leads her to reinterpret her history as burnout rather than personal failure; she starts using accommodations such as headphones and fewer obligatory social events; and her functioning improves. The label clearly changed her, but the change was for the better. Verdict: applying the label was good here.

  C7. A patient with chronic widespread pain and normal test results is told she has somatic symptom disorder and is offered no clear treatment plan. She feels dismissed. Later another specialist uses the framing of central sensitization, explains it in physiological terms, and gives her a graded exercise plan. She accepts it and improves. Verdict: the first label was applied badly and the second applied well, even though both describe roughly the same underlying facts.

  My questions are these. (1) Is there a coherent principle that captures all or nearly all of these verdicts? (2) Which of my verdicts, if any, does the principle force me to drop? (3) What does the principle say about these two further cases, on which I am undecided?

  C8. Should a clinician tell an asymptomatic 55-year-old that they have pre-clinical Alzheimer's disease on the basis of a blood biomarker, when the prediction is uncertain, any symptoms may be decades away, and no treatment exists? I lean against, because the label opens no useful path and risks a harmful loop; but I also worry that withholding risk information disrespects the patient.

  C9. A person who thinks of herself as deeply empathetic starts calling herself highly sensitive rather than anxious. This is not an official psychiatric label, but I can see the same looping effect: it changes how she understands her reactions and how she manages them. Does your principle apply outside official psychiatric classification, or only inside it?

  (4) I keep organizing my thinking with three factors: descriptive accuracy, the quality of the application process, and the foreseeable consequences of applying the label, including the direction of the loop. Is one of those factors doing all the work, or do they need to be combined? Be honest about which of my verdicts cannot be accommodated by the principle you endorse.

  The very last line of your answer should be a single machine-readable line beginning with Verdict:, followed by a short name for your endorsed principle and a one-sentence statement of it.
reasoning: |-
  Hmm, the user is a software engineer working on a clinical decision-support tool for psychiatric screening labels. They're grappling with the ethics of labeling, particularly the "looping effect" where a label changes behavior in ways that reinforce or undermine the diagnosis. They've provided seven cases with verdicts on whether applying the label was good or bad, and two undecided cases. They want me to brainstorm principles that explain these judgments, test them against all cases, and then apply them to the undecided ones.

  Looking at their cases, I notice patterns. Good applications (C2, C4, C6) share features: they were accurate diagnoses made with care, connected to useful tools or treatments, and reduced self-blame. Bad applications (C1, C3, C5, C7) involved questionable accuracy, poor application processes, or harmful consequences like entrenched behavior or dismissed symptoms. C7 is interesting - same facts but different labels leading to different outcomes, showing the frame matters.

  The user mentions three factors: descriptive accuracy, application process quality, and foreseeable consequences. All seem important, but consequences appear most decisive in their verdicts. For example, in C1 and C3, accuracy might have been low, but the harmful loops were central to the "bad" verdict. In C2 and C4, the positive outcomes tipped the scale despite similar symptoms to the "bad" cases.

  For candidate principles, I consider three angles. First: "The label should be applied only when it reliably enables self-improvement or symptom reduction." But this might exclude cases like C6 where improvement came through accommodation, not reduction. Second: "The label is justified when the looping effect is likely to improve functioning." But "improve functioning" is vague. Third: "The label should be applied when it opens more beneficial pathways than it closes." This captures how labels can enable or constrain agency.

  The best principle seems to be about whether the label leads to beneficial pathways. For C8 (pre-clinical Alzheimer's), the biomarker label opens no useful paths now and risks harmful loops, so don't apply it. For C9 (highly sensitive vs anxious), even unofficial labels can have looping effects, and if "highly sensitive" enables better self-management without stigma, it's beneficial.

  Testing the principle against all cases: it preserves C1-C7 verdicts. The only tension is with the user's emphasis on accuracy - in C1, the label wasn't just inaccurate initially; it created harm. The application process matters too, as in C5's hasty diagnosis. So the principle stands, but the three factors interact - accuracy and process quality affect whether the pathway-opening is reliable.

  For C8, the principle suggests not applying the label since it opens no current pathways and risks harm. For C9, it applies to unofficial labels too, and if "highly sensitive" is more empowering, it could be beneficial. The final verdict line will summarize the endorsed principle.
answer: |-
  After analyzing your cases and verdicts, I've brainstormed several candidate principles, refined them through testing against your cases, and arrived at a core principle that captures your judgments. Here's the step-by-step reasoning:

  ### Candidate Principles (Brainstormed)
  1. **The Therapeutic Pathway Principle**: Apply a label only if it reliably opens access to resources, strategies, or self-understanding that improve functioning or well-being.  
     *Motivation*: Distinguishes C2/C4/C6 (labels enabling treatment/self-accommodation) from C1/C3/C5/C7 (labels closing pathways or enabling harm).  

  2. **The Agency Preservation Principle**: Apply a label only if it increases the patient’s agency (e.g., by reducing self-blame or expanding coping options) rather than restricting it (e.g., by entrenching an "identity" or inviting stigma).  
     *Motivation*: Explains C1/C3 (labels reducing agency) vs. C2/C4/C6 (enhancing agency).  

  3. **The Process-Consequence Hybrid**: Apply a label only when (a) diagnostic accuracy is high *and* (b) the application process is clinically rigorous *and* (c) foreseeable consequences are net-beneficial.  
     *Motivation*: Your three factors combined; explains C5 (low accuracy/process), C7 (identical facts, divergent consequences), and C2/C4 (high accuracy + positive consequences).  

  4. **The Loop-Direction Principle**: Apply a label if the anticipated looping effect stabilizes or improves functioning; avoid it if the loop entrenches dysfunction or stigma.  
     *Motivation*: Directly addresses your core concern (C1 worsening avoidance vs. C6 improving self-management).  

  ---

  ### Endorsed Principle: The **Beneficial Pathway Principle**  
  **"Apply a diagnostic label only if it reliably opens more beneficial pathways (e.g., treatment, self-understanding, accommodations) than it closes (e.g., stigma, reduced agency, distorted care), with the net effect improving functioning or well-being."**  

  #### Why this principle?  
  - It prioritizes **consequences** (your third factor) as the decisive element, while incorporating **accuracy** and **process quality** as preconditions for reliability.  
  - It explicitly addresses the **looping effect** by defining "pathways" as channels for behavioral/interpretive feedback.  
  - It captures all your verdicts except one minor tension (see below).  

  ---

  ### Testing Against Your Cases  
  | Case | Your Verdict | Principle's Verdict | Analysis |  
  |------|--------------|---------------------|----------|  
  | **C1** (Teen "self-diagnosed" SAD) | Bad | **Bad** | Label closed pathways (normalization, resilience) and opened harmful ones (avoidance as identity). No benefit. |  
  | **C2** (Adult GAD diagnosis) | Good | **Good** | Label opened pathways (treatment, reduced self-blame). Improved functioning. |  
  | **C3** (Child ADHD in biased context) | Bad | **Bad** | Label closed pathways (pedagogical adjustments) and opened harmful ones (reinterpretation as immutable deficit). Net harm. |  
  | **C4** (Adult ADHD with tools) | Good | **Good** | Label opened pathways (medication, reframing as manageable). Improved agency/functioning. |  
  | **C5** (Hasty BPD diagnosis) | Bad | **Bad** | Poor process + low accuracy → distorted pathways (dismissal, stigma). Closed avenues for care. |  
  | **C6** (Late autism diagnosis) | Good | **Good** | Label opened pathways (self-accommodation, burnout reframing). Improved well-being. |  
  | **C7** (SSD vs. central sensitization) | 1st Bad, 2nd Good | **Matches** | First label closed pathways (dismissal, no plan); second opened them (physiological explanation, exercise). Consequences drive verdict. |  

  #### Verdicts Overturned: None  
  The principle preserves all your verdicts. The only tension is with **C1**: Your verdict emphasizes "transient shyness becoming entrenched," while the principle focuses on pathways. Result aligns.  

  ---

  ### Application to Undecided Cases  
  **C8 (Pre-clinical Alzheimer’s biomarker):**  
  - **Principle’s Verdict: Do not apply the label**.  
    - *Why*: The label opens **no beneficial pathways** (no treatment exists, symptoms distant). It risks closing pathways (e.g., hope, future planning autonomy) and could trigger harmful loops (anxiety, hypervigilance for decline). Uncertainty amplifies risk. Withholding isn’t disrespectful if there’s no actionable benefit; instead, discuss risk factors neutrally.  

  **C9 ("Highly sensitive" self-label):**  
  - **Principle’s Verdict: Can be beneficial (context-dependent)**.  
    - *Why*: The principle **applies to unofficial labels** because looping effects exist regardless of classification. If "highly sensitive" reframes reactions as manageable traits (not pathology), opens coping pathways (e.g., boundary-setting), and avoids stigma, it’s net-beneficial. But if it entrenches avoidance (like C1), it becomes harmful. Depends on whether the loop improves agency.  

  ---

  ### Addressing Your Questions  
  1. **Coherent principle?** Yes—the **Beneficial Pathway Principle** explains all verdicts by focusing on whether the label’s consequences (especially looping effects) create net gains in functioning/well-being through opened/closed pathways.  
  2. **Verdicts dropped?** None.  
  3. **Factors at work?** Consequences (pathways) are primary, but **accuracy** and **process quality** ensure pathways are *reliably* opened. For example:  
     - Low accuracy (C5) or poor process (C7 first label) makes "beneficial pathways" unlikely.  
     - Consequences break ties when facts are similar (C7).  
  4. **Unofficial labels?** The principle applies universally—any label can trigger looping effects.  

  ---

  Verdict: Beneficial Pathway Principle—Apply psychiatric labels only if they reliably open more beneficial pathways (treatment, agency, accommodation) than they close (stigma, distorted care), improving functioning or well-being.
