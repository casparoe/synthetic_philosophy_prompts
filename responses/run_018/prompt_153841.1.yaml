prompt: |-
  I cover science and ideas for a publication running a fortnightly column that asks whether emerging entities—revised AI architectures, lab-cultured neural organoids, or invertebrates under new welfare rules—deserve graduated moral consideration rather than binary inclusion or exclusion. I need a reusable editorial procedure that my editor and I can run in under an hour without philosophical training, translating the principle that moral status comes in degrees into concrete steps that I must sign off on before publication. The framework should apply three ordered checks—counterfactual behavioural plasticity, integrated information density, and "multi-stable goal resistance" (the defence of several non-homeostatic objectives rather than mere return to a single set-point, as with a thermostat)—plus an explicit Thermostat Filter to exclude pure feedback loops. Please set out: the sequence of questions; what answers stop the process at "instrumental value only," "graduated status," or "hand-off to editorial judgement"; the misfire risks; and what the procedure cannot settle. Apply it to three cases: a persistent-memory language model that refuses harmful instructions; a decerebrate frog used in reflex studies; and a networked climate system that learns occupant preferences and resists manual override—specifically including the language-model case, where I expect the answer will grant partial status I am inclined to reject. In your response, begin with the bottom line in the first sentence, then give the reasoning, with no preamble and no restatement of the question.
