answer: |-
  Below is a **runnable 90-minute workshop** designed for your goals, using index cards and token pools. The game makes players experience how the *resource* (fish stock) and the *monitoring system* (shared data) are interdependent commons, with the latter collapsing first due to free-riding. Students will discover that invisible resources lead to overexploitation and that monitoring is a public good vulnerable to second-order free-riding—all without mentioning "tragedy of the commons" or "free rider" until debrief.

  ---

  ### **Game Title**: *Silent Seas*  
  **Players**: 14 students → split into **7 fishing boats** (2 students/boat).  
  **Materials**:  
  - **Fish tokens**: 120 blue tokens (resource pool).  
  - **Data tokens**: 14 red tokens (1 per player).  
  - **Index cards**: For decisions (monitoring & fishing).  
  - **Scoreboards**: 1 per boat (track points).  
  - **Blind**: A box/screen to hide the fish pool.  

  ---

  ### **Rules & Sequence**  
  **Objective**: Maximize points from caught fish. Points = `2 per fish caught`.  
  **Resource Dynamics**:  
  - Fish regenerate only if stock ≥ 20 tokens after fishing.  
  - **Growth rule**: If stock ≥ 20, it doubles next round (max 120). If < 20, no growth.  
  - **Collapse**: If stock hits 0, no regeneration for rest of game.  

  #### **Each Round (8 min/round, 8 rounds total)**  
  1. **Monitoring Decision (Phase 1 - Public Good)**  
     - Each *player* (not boat) decides: **Pay 1 red token to monitor?**  
       - **Cost**: Paying loses 3 points (recorded privately).  
       - **Benefit**: If ≥1 player pays, facilitator reveals fish stock to *all*.  
       - If no one pays, stock remains hidden (only last known stock is recalled).  
     - *Players submit decisions on index cards*.  

  2. **Fishing Decision (Phase 2 - Commons Extraction)**  
     - Each *boat* decides how many fish to catch (0–5 tokens).  
     - **Cost**: None to fish.  
     - **Risk**: If total catch > available stock, all boats get 0 fish that round.  
     - *Boats submit one catch card per boat*.  

  3. **Resolution**  
     - **Facilitator actions**:  
       - Subtract total catch from fish pool (if catch > stock, all get 0).  
       - Apply growth rule for next round.  
       - Update scores: `+2 per fish caught`, `-3 per monitoring payment`.  
     - **Information revealed**:  
       - Stock level ONLY if ≥1 player paid to monitor.  
       - Total catch and scores (not individual decisions).  

  ---

  ### **Setup & Timeline**  
  - **Prep (5 min)**:  
    - Distribute: 1 red token + scoreboard per player, 2 fish tokens/boat as "starting catch".  
    - Place 100 fish tokens in hidden pool.  
    - Explain rules **without theory terms**:  
      > *"You are fishing crews. Fish regrow if enough are left. You can pay points to see the fish stock, but if anyone pays, everyone sees it. If you catch more fish than exist, no one gets fish that round."*  

  - **Rounds 1–8 (60 min)**:  
    - Each round: Monitoring (2 min) → Fishing (2 min) → Resolution (4 min).  
    - **Stock progression example** (adjust based on play):  
      | Round | Starting Stock | Monitoring Paid? | Total Catch | Stock After Fishing | Regenerated Stock |  
      |-------|----------------|------------------|------------|---------------------|-------------------|  
      | 1     | 100            | Yes (stock=100) | 10         | 90                  | 180 (capped at 120)|  
      | 2     | 120            | No              | 25         | 95                  | 190 → 120         |  
      | 3     | 120            | Yes (stock=120) | 30         | 90                  | 180 → 120         |  
      | 4     | 120            | No              | 40         | 80                  | 160 → 120         |  
      | 5     | 120            | No              | 35         | 85                  | 170 → 120         |  
      | 6     | 120            | No              | 45         | 75                  | 150 → 120         |  
      | 7     | 120            | No              | 50         | 70                  | 140 → 120         |  
      | 8     | 120            | No              | 60         | 60                  | 120 (no catch > stock)|  
    - **Critical moment**: By round 4–5, monitoring usually stops. Players assume stock is high → overfish blindly. If stock drops <20 (e.g., from overfishing), collapse begins.  

  - **Debrief (25 min)**:  
    **Guided Questions** (map play to theory):  
    1. *"When did you stop paying to monitor? Why?"*  
       → Reveals **second-order free-riding**: "I let others pay so I could keep points."  
    2. *"What happened after stock became invisible?"*  
       → Links to **resource uncertainty**: Overfishing accelerated without data.  
    3. *"Why did boats risk high catches when stock was hidden?"*  
       → **Commons dilemma**: Individual incentive to fish max vs. group need for restraint.  
    4. *"Did anyone try to cooperate? What failed?"*  
       → **Coordination problem**: Mutual interest in sustainability, but no enforcement.  
    **Reveal the Concepts**:  
    - "You experienced the **tragedy of the commons** (resource collapse) and **public-goods problem** (monitoring collapse). The monitoring system was the *first* commons to fail—and it made the fish stock invisible, accelerating its collapse."  
    - Connect to your marina debate: Voluntary restraint fails because free-riding on *both* data and fishing effort is rational for individuals.  

  ---

  ### **Predictable Problems & Limitations**  
  #### **First-Time Run Issues**  
  - **Overfishing in early rounds**: Players test limits → stock may collapse faster than intended.  
    *Mitigation*: Start with a stern warning: "If total catch exceeds stock, ALL boats get 0."  
  - **Free-riding dominates**: 1–2 players may monitor initially, but most stop by round 3.  
    *Use in debrief*: Highlight how "good intentions" dissolved.  
  - **Frustration with hidden stock**: Players may blame the facilitator.  
    *Mitigation*: Emphasize rules neutrally ("No one paid, so stock stays hidden").  

  #### **What the Game Can't Replicate (Requires Verbal Explanation)**  
  - **Time scale**: Real ecological collapse takes years; this compresses it.  
  - **Social norms**: Real fishers have trust/reciprocity; strangers in a game do not.  
  - **Spatial dynamics**: Fish move; players here have equal access.  
  - **Non-linear collapse**: Real ecosystems tip suddenly (e.g., stock <20 → zero growth). The game mimics this, but players may not grasp irreversible thresholds.  

  ---

  ### **Conceptual Pushback**  
  Your framing is **sound**: The fish stock (rival, subtractable) and monitoring (non-rival, non-excludable) *are* interlinked. The game shows:  
  1. Monitoring is a public good → free-riding prevents data sharing.  
  2. Without data, the commons is overexploited → collapse.  
  3. The monitoring system collapses *first* because it’s more fragile (no immediate penalty for free-riding).  

  **Why it works**: Players *feel* the dilemma when they realize:  
  - Paying for data helps everyone equally (public good), but costs them personally.  
  - Not knowing the stock leads to reckless fishing (commons tragedy).  

  ---

  ### **Logistics & Tips**  
  - **Keep pace**: Use a timer for decisions.  
  - **Token management**: Start with 100 fish + 20 in reserve. Add tokens if regeneration exceeds 120.  
  - **Student roles**: In boats, one handles fish tokens, the other tracks scores.  
  - **No econ background?** Use analogies: "Paying to monitor is like buying a map; if one buys it, everyone can copy it for free."  

  This game forces players to confront the structural beast: **Monitoring free-riding enables resource free-riding**. By the debrief, they’ll grasp why your marina friend was right—and why you’re haunted by the second-order collapse. Run it, and let the chaos unfold! 🎣
