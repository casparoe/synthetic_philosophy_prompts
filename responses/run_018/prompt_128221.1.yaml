  In the reasoning, I need to engage deeply with Gricean implicature and contextual suppression - that's central to the respondent's defense. I'll argue that in informed consent contexts, misleading can be as harmful as lying because it violates autonomy. But I must also fairly present the complainant's view that engineered false belief is functionally equivalent to lying.

