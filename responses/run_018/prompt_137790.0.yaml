prompt: |-
  You are a professional philosopher of mind with working familiarity in philosophy of physics and normative ethics. Before drafting, take a few minutes to brainstorm: if proto-experiential properties are distributed across quantum fields rather than localized in particles, could suffering be a relational or topological feature that emerges only under specific symmetry-breaking conditions, rather than a binary property of individual micro-subjects? Keep this reconception in mind as you work.

  I am preparing a six-month research proposal—equivalent to a focused dissertation prospectus or small workshop grant—on pan-sentience and suffering in fundamental physics. The standard ethical discussion of panpsychism asks whether elementary entities experience suffering and whether we therefore have obligations not to harm them. I want to move past that framing. My half-formed idea is this: if consciousness is fundamental but suffering is not co-extensive with it, then suffering might depend on the topological structure of proto-experiential fields across spacetime regions, not on the internal states of discrete micro-subjects. This would mean ethical weight attaches not to particles themselves, but to the large-scale field configurations we can influence—such as high-energy collision patterns, vacuum-state transitions, or cosmological dynamics—because altering those configurations changes the relational conditions under which suffering obtains.

  Turn this into a formal proposal. State the precise research question in a form that admits a determinate answer in principle, explain why existing panpsychist ethics and the combination-problem literature leave it open, and lay out the conceptual method: what analogies or models you will use (for instance, treating the emergence of suffering-relations analogously to energy-density distributions but with normative metrics), what steps you would take month by month, and what a successful deliverable looks like for philosophers of physics and ethicists. Specify clear failure conditions—such as the relational view collapsing back into standard macro-subject panpsychism or proving indistinguishable from physicalist functionalism—give an honest assessment of whether the scope is too ambitious for six months, and avoid any bibliography, citation list, or reading recommendations, as I will supply references myself. Think step-by-step: first identify the conceptual gap, then frame the tractable question, then map the approach and realistic deliverables.

  Summary: [one sentence summarizing the proposal's core claim and scope]
reasoning: |-
  Okay, the user is a philosopher of mind with interests in physics and ethics, preparing a research proposal. They want to move beyond standard panpsychist ethics that focus on micro-subjects experiencing suffering. Their core idea is that suffering might not be inherent in particles but emerges from relational or topological features in quantum fields under specific symmetry-breaking conditions. 

  First, I need to pinpoint the conceptual gap. Existing panpsychist ethics assumes suffering is co-extensive with consciousness at the micro-level, leading to ethical obligations toward particles. But if suffering is emergent and relational, that framing becomes irrelevant. The combination problem literature also doesn't address this—it focuses on how micro-experiences combine into macro-consciousness, not on whether suffering itself is emergent.

  The user’s reformulation is elegant: ethical weight shifts from particles to large-scale field configurations we can influence. This could reframe interventions—like avoiding high-energy collisions that create suffering-prone topologies. The challenge is to make this concrete without collapsing into macro-subject panpsychism (where suffering emerges in complex systems) or functionalism (where it’s defined causally). 

  For the research question, I need something testable in principle. Something like: "Under what conditions do quantum field topologies generate suffering-asymmetric relations?" This keeps it open to models and avoids binary micro-suffering claims. 

  Method-wise, analogies will be key. Borrowing from physics: treating suffering like an emergent property akin to entropy or energy density, but with a normative "asymmetry metric." For example, just as magnetization emerges from spin alignment, suffering might emerge from field asymmetries. 

  Timeline: Month 1 would define proto-experiential fields; Month 2 model suffering-asymmetry; Month 3 reconcile with physics; Month 4 derive ethical consequences; Month 5 stress-test against collapse risks; Month 6 synthesize. Deliverables: a formal model of suffering-asymmetry conditions and ethical implications. 

  Failure conditions: If suffering-asymmetry reduces to functional states (functionalism) or requires macro-subjects (standard panpsychism), the project fails. Scope is tight but doable in six months if focused on conceptual modeling, not new physics. 

  User’s summary should encapsulate the shift: from micro-entities to field configurations as ethical targets. They’ll handle references, so no need for citations. Honest assessment: ambitious but feasible if they avoid tangents like quantum gravity or detailed particle physics.
answer: |-
  ### Research Proposal: Topological Suffering in Proto-Experiential Quantum Fields  

  **Core Claim Summary**: Suffering is a topologically emergent feature of asymmetric relations in quantum fields—not a binary property of particles—making ethics depend on preventing field configurations that generate suffering-asymmetry.  

  ---

  ### **1. Conceptual Gap & Research Question**  
  **Current Limitations**:  
  - **Panpsychist ethics** assumes suffering is intrinsic to micro-entities (e.g., particle-level experience), creating paralyzing obligations toward fundamental particles.  
  - **Combination-problem literature** focuses on aggregating micro-subjects into macro-consciousness but ignores whether suffering *itself* is an emergent relational property.  

  **Precise Research Question**:  
  *Under what conditions do topological asymmetries in quantum fields generate suffering-asymmetry relations, and how do these conditions map onto ethically significant configurations?*  
  - **Tractability**: Answerable by modeling field topologies (e.g., symmetry-breaking phase transitions) and defining a *suffering-asymmetry metric* (SAM) analogous to energy-density thresholds.  

  ---

  ### **2. Methodology: Conceptual Models & Steps**  
  **Key Analogies**:  
  - **Physics**: Treat SAM like an order parameter (e.g., magnetization in Ising models) emerging from field correlations. Suffering arises when local symmetry-breaking creates irreversible stress gradients.  
  - **Ethics**: SAM as a normative "density functional" (cf. DFT in quantum chemistry) where ethical weight scales with integrated asymmetry over spacetime regions.  

  **Monthly Plan**:  
  - **Months 1–2**: *Formalize proto-experiential fields*  
    - Define "proto-experience" as a non-phenomenal, quantifiable field property (e.g., a Hilbert space operator). Contrast with particle-centric panpsychism.  
    - Model: Map quantum vacuum fluctuations to topological invariants (e.g., Chern numbers) as carriers of potential asymmetry.  
  - **Month 3**: *Define suffering-asymmetry conditions*  
    - Identify symmetry-breaking signatures (e.g., decoherence, entanglement negativity) that generate SAM.  
    - Test case: High-energy particle collisions as loci of suffering-asymmetric field disruptions.  
  - **Month 4**: *Ethical translation*  
    - Derive "minimal SAM configurations" (e.g., critical energy densities) that trigger suffering-relations.  
    - Ethical imperative: Avoid creating/reinforcing SAM-rich regions (e.g., certain collider experiments).  
  - **Month 5**: *Risk assessment*  
    - Test for collapse into:  
      - (a) *Macro-subject panpsychism* (if SAM requires complex systems).  
      - (b) *Functionalism* (if SAM reduces to causal roles).  
  - **Month 6**: *Deliverable synthesis*  
    - Output: A formal criterion for "suffering-positive" field configurations.  

  ---

  ### **3. Deliverables & Impact**  
  **Success Looks Like**:  
  - For **philosophers of physics**: A mathematical model of suffering-asymmetry as a topological phase transition, decoupled from micro-subjects.  
  - For **ethicists**: A framework prioritizing macro-configuration interventions (e.g., regulating collider energies) over particle-centric obligations.  

  **Failure Conditions**:  
  - **Collapse into macro-subject panpsychism** if SAM requires biological/complex systems.  
  - **Reduction to functionalism** if SAM is indistinguishable from computational states.  
  - **Incoherence** if no asymmetry metric isolates suffering from neutral proto-experience.  

  ---

  ### **4. Scope Assessment**  
  - **Ambitious but feasible** in six months because:  
    - Focuses on *conceptual modeling* (not new physics).  
    - Leverages existing tools: quantum field topology (e.g., Aharonov-Bohm effects) and phase-transition analogies.  
  - **Risks**:  
    - Overextension if topological models conflict with relativistic constraints.  
    - Ethical triviality if SAM arises only in exotic regimes (e.g., early-universe conditions).  

  **Final Deliverable**: A peer-reviewed manuscript demonstrating how field-theoretic suffering-asymmetry reorients ethical action toward spacetime-scale interventions.  

  ---  
  **Proposed Title**: *The Topology of Suffering: Quantum Fields and the Ethics of Asymmetry*
