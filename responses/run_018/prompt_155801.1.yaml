  I was arguing for hours last night with a close friend about what actually fixes the identity of a letterform, and she walked me through a string of judgments that she insists are perfectly consistent. She says a standard double-story Helvetica lowercase “a” is unmistakably an “a”; a single-story “a” with the tail curled sharply left is still an “a,” though barely; the same single-story form with the tail completely detached and floating near the bowl is not an “a” but meaningless noise; an “a” rendered entirely in negative space—where the background shapes form the bowl and tail—is still an “a”; that same Helvetica form rotated 180 degrees is no longer an “a” but either an “e” or gibberish; a graffiti “a” whose bowl is a square and whose tail is split into three parallel lines remains an “a”; and a geometric figure made of a circle intersected by a vertical line with no enclosed bowl at all is definitely not an “a.” Now we have a new symbol in front of us: it has a circular bowl with a vertical stem rising on the right, but the stem continues downward past the baseline and curves back upward to form a second, smaller enclosed bowl beneath the first, all executed in a continuous handwriting stroke with variable weight, so that the overall figure looks like a vertically mirrored or stacked pair. I want to know whether she would classify this as an “a,” but more importantly I want the underlying rules that could jointly explain her earlier verdicts—perhaps something about topological stroke continuity, or a specific relational feature like “enclosed bowl with right-hand tail,” or membership in a recognized alphabet family—along with which of those rules diverge on this stacked-bowl case. Please also tell me what further, carefully chosen example would best discriminate among the competing rules, and frame your entire response in American English.
