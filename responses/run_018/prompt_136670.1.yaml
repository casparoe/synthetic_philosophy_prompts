  I'm applying for a small 6-month grant to write about the hedonistic imperative and biotehnology. Most people talk about editing human genes or wild animals, but I want to focus on synthetic organisms designed with reward circuits and zero nociception — entities that never suffer but also never experienced its absence. My half-formed question: does the hedonistic imperative still generate obligations toward these beings, or does it secretly depend on a contrast between suffering and relief that collapses when suffering was never present? Write me a two-page proposal that states this precisely, explains why the existant Pearce-style vs. conservationist debate doesn't touch it, lays out a moth-by-moth method (conceptual analysis of welfare baselines, then applying to synthetic cases), says what a useful result looks like and what failure would be, and gives an honest scope check — like whether this turns out to require solving philosophy of mind first. Don't include a bibliography, I'll fill in citations myself.
