  *   **Single Best Revision (Constraining 5):** This directly addresses the most dangerous tension. It preserves the core of (1) (lexical priority for genuinely severe suffering) while accommodating (5)'s insight that *identifying* and *weighting* that severity involves normative input. This revision is cheaper than abandoning lexical terminology (revision for 4) or overhauling the tradeoff mechanism (revision for 2 vs 3).
