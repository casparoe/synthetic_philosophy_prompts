answer: |-
  ### Exam Question  
  **Based on your understanding of historical explanation, critically evaluate the following claim:**  
  *"A historian states that the 1789 grain crisis was a necessary trigger for the French Revolution. They argue that if the harvest failure had occurred just one week later, the revolutionary chain of events would not have begun. This counterfactual fragility proves that narrative explanations secretly rely on hidden law-like rules (e.g., ‘food shortages always cause riots within 7 days’)."*  
  **Does counterfactual fragility imply that narrative explanations require covering laws? Explain why or why not, using distinctions between logical and causal dependence, and addressing the role of narrative coherence.**  
  *(20 marks total; 500 words recommended)*  

  ---

  ### Model Answer (Approx. 500 words)  
  The claim that counterfactual fragility (e.g., "a one-week delay prevents revolution") implies narrative explanations secretly require covering laws is mistaken. Fragility reflects *narrative-specific causal dependence*, not a hidden universal law. Here’s why:  

  **1. Logical vs. Causal Dependence (Key Distinction)**  
     - **Logical dependence** implies deductive certainty: *If X, then necessarily Y*. Covering-law models (like Hempel’s) demand this: "If severe grain shortage (G), then revolution (R)" must hold universally.  
     - **Causal dependence in narratives** is contextual and contingent. The historian claims the grain crisis *actually triggered* specific actions (e.g., the Women’s March on Versailles) in 1789’s volatile political climate. The "one-week delay" counterfactual tests *this causal sequence*: later riots might miss critical junctures (e.g., royal indecision, militia mutinies). This fragility stems from the *narrative’s reconstructed chain of events*, not a law.  

  **2. Fragility ≠ Covert Covering Law**  
     Counterfactual fragility does not import nomological (law-based) rules because:  
     - **Context-sensitivity**: The claim "a week’s delay changes everything" relies on *unique historical conditions* (e.g., pre-existing Estates-General tensions, bread prices at a breaking point). A covering law would ignore these details for universal regularity (e.g., "All grain crises cause revolution in ≤7 days").  
     - **Mechanisms over generalities**: Narratives explain *how* events connect (e.g., grain shortage → panic buying → bread riots → royal legitimacy crisis → revolt). Fragility tests *this pathway’s stability*. If a delay disrupts a link (e.g., riots occur after troops suppress dissent), the outcome changes—but this requires no law, only plausible causation within the story.  

  **3. Narrative Coherence vs. Nomological Subsumption (Common Mistake)**  
     Critics confuse *narrative coherence* (internal consistency of events) with *nomological subsumption* (subsuming events under laws).  
     - **Coherence**: The historian’s fragility claim makes the narrative *intelligible* by showing which events were pivotal ("If *this* link breaks, the chain collapses"). This is about contingent causality, not prediction.  
     - **Mistake**: Assuming fragility implies a law (e.g., "riots require grain crises within *n* days") misinterprets narrative contingency as logical necessity. The historian isn’t proposing a law but defending *their account’s causal structure*.  

  **Conclusion**: Counterfactual fragility maps a narrative’s causal joints—it highlights *which specific conditions mattered* in a sequence. This requires no hidden covering laws; it demonstrates how narratives explain by tracing context-dependent pathways, not universal regularities.  

  ---

  ### Marking Scheme (20 points total)  
  **A-Grade (17–20 points)**: Hits all moves, rebuts "hidden law" objection, precision in distinctions.  
  **B-Grade (13–16 points)**: Describes covering-law vs. narrative models but superficially addresses fragility OR misses one key move.  
  **C-Grade (9–12 points)**: Defines theories but ignores fragility twist OR confuses logical/causal dependence.  

  | **Section**                     | **Points** | **A-Grade Response**                                                                 | **Common Mistakes (Point Deductions)**                                                                 |  
  |---------------------------------|------------|--------------------------------------------------------------------------------------|--------------------------------------------------------------------------------------------------------|  
  | **Defines fragility & distinguishes logical vs. causal dependence** | 6 | Clearly separates logical necessity (covering laws) from contextual causality (narratives). Uses grain crisis example correctly. | - Confuses terms (e.g., "logical dependence = cause") (-3). <br> - Fails to define either dependence (-2). |  
  | **Explains why fragility ≠ hidden covering law**       | 6 | Shows fragility is about narrative mechanisms (e.g., disrupted event chains) not universality. Emphasizes context-sensitivity. | - Assumes fragility "proves" a law exists (-3). <br> - Only contrasts theories without fragility (-2). |  
  | **Identifies coherence vs. nomological mistake**       | 4 | Labels the confusion explicitly; links coherence to narrative plausibility, not prediction. | - Equates narrative coherence with "weak law" (-2). <br> - Omits this point entirely (-4). |  
  | **Clarity, structure, and relevance**                  | 4 | Logical flow, addresses question directly, avoids irrelevance.                     | - Unfocused tangents (-2). <br> - Misreads question (e.g., debates revolution causes) (-2). |  

  **Key Pitfalls Highlighted in Scheme**:  
  - **B-Grade trap**: Describing Hempel (laws explain via prediction) vs. Dray/Gallie (narratives explain via context) *without* engaging fragility.  
  - **C-Grade trap**: "Fragility shows history needs laws because timing matters!" (misses narrative contingency).  
  - **Automatic B-Cap**: Ignores "logical vs. causal" distinction.  

  ---

  ### Study Notes for Your Friend  
  - **Covering-Law (Hempel)**: History explains like science—use universal laws + initial conditions to *predict/deduct* events.  
  - **Narrative Explanation**: History explains by *contextualizing* events in a story—causes are local, contingent, and path-dependent.  
  - **Counterfactual Fragility Mapping**: A tool to test *which parts of a narrative are decisive*. If tiny changes (e.g., 1-week delay) alter outcomes, it reveals pivotal links—but these are *narrative-specific*, not laws.  
  - **The Big Confusion**: Don’t assume that because a narrative *requires* X to cause Y *in this story*, it means X *always* causes Y. That’s smuggling in a law!  

  This question tests philosophical nuance—not memorization. Focus on *how* explanations work!
