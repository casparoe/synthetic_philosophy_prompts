answer: |-
  Here is a formalization of desiderata for a theory of pattern-reality respecting Dennett's three stances, based on the argument's core concerns. Requirements are categorized, motivated by cases, and assessed for negotiability and tension.

  **I. Predictive & Explanatory Power (Must Cover)**
  1.  **Cross-Stance Tracking (Non-Negotiable):** The theory must explain how distinct stance-level patterns (physical, design, intentional) can *accurately track the same behavioral/observational data stream* despite differing levels of abstraction and compression.
      *   **Case:** Predicting a chess move. The *physical stance* tracks neuron firings & motor outputs. The *design stance* tracks the execution of the chess engine's algorithm (minimax, evaluation functions). The *intentional stance* tracks the player's beliefs ("My queen is threatened"), desires ("I want to win"), and reasoning ("I should castle"). All predict the same physical movement of the rook, but through radically different compressions. The theory must account for this co-reference without reducing one to another.
  2.  **Stance-Specific Adequacy (Non-Negotiable):** The theory must validate the unique predictive and explanatory successes *within* each stance.
      *   **Case (Physical):** Explaining why a bridge collapsed via material stress calculations.
      *   **Case (Design):** Debugging a malfunctioning engine by tracing its functional components and their interactions.
      *   **Case (Intentional):** Predicting market behavior based on actors' perceived incentives and information.
  3.  **Interference & Conflict Resolution (Non-Negotiable):** The theory must account for cases where stances seem to conflict or interfere, explaining the source of conflict and how resolution occurs.
      *   **Case (Physical-Design Interference):** A cosmic ray flips a bit in a computer's memory, causing an error *unpredictable* from the design stance alone. The theory must show how the physical event disrupts the higher-level functional pattern.
      *   **Case (Design-Intentional Interference):** An optical illusion: The *design stance* (visual system processing) produces an output (misperception of line length) that conflicts with the *intentional stance* belief formed via measurement ("The lines are equal"). The theory must explain how the design-level pattern constrains or distorts intentional-level content.
      *   **Case (Intentional-Physical Conflict):** Libet experiments - the *intentional stance* report of conscious decision seems to lag behind the *physical stance* neural correlates. The theory must address the apparent temporal conflict without simply dismissing one stance.

  **II. Ontological Distinctions (Must Preserve)**
  4.  **Stance-Relative Reality vs. Mere Projection (Negotiable Preference):** The theory must distinguish between patterns that are robustly detectable, counterfactually stable, and projectible *from a given stance* (having "stance-relative reality") versus patterns that are merely arbitrary or idiosyncratic projections with no predictive leverage.
      *   **Case:** The intentional pattern "believes it will rain" has stance-relative reality if it reliably predicts umbrella-carrying behavior across contexts. "Believes the moon is made of green cheese" lacks this if it predicts nothing. The theory should avoid collapsing all intentional states into *mere* projection if some are robust.
  5.  **Predictive Utility vs. Full Ontological Commitment (Non-Negotiable):** The theory must clarify that the *usefulness* of a stance for prediction/explanation does not *automatically* entail ontological commitment to the *primitive reality* of the stance's posits (e.g., beliefs, functions) as fundamental constituents of the universe.
      *   **Case:** Using the intentional stance to predict a thermostat's behavior ("it wants to maintain 70°") is useful, but doesn't require believing thermostats have genuine mental states. The theory must explain this asymmetry.
  6.  **Pattern Existence vs. Pattern Density/Precision (Non-Negotiable):** The theory must distinguish between *having a pattern at all* (e.g., exhibiting intentionality) and *having a high degree of precision, detail, or fidelity* in that pattern.
      *   **Case:** A simple light-seeking robot exhibits a crude intentional pattern ("desires light"). A human exhibits a vastly more complex and precise intentional pattern. Both *have* intentional patterns; they differ in *degree* of complexity and fidelity. Denying pattern existence to the simple case because it lacks precision conflates these. The theory must allow for graded realism.

  **III. Consistency Conditions (Binding)**
  7.  **Physical Closure / Supervenience (Non-Negotiable):** All patterns (design, intentional) must supervene on the physical pattern. There can be no causal powers or pattern differences at higher stances without corresponding differences at the physical stance. No "spooky" causation.
  8.  **No Free Ontological Lunch (Non-Negotiable):** Patterns must *earn* their ontological status through their predictive/explanatory power, counterfactual robustness, and projectibility. Patterns that fail to provide unique leverage or collapse under minimal perturbation don't warrant commitment.
  9.  **Empirical Adequacy at Each Level (Non-Negotiable):** Explanations and predictions generated *within* a stance must be empirically testable and correct *relative to the data relevant to that stance*. The physical stance must predict physical events; the design stance must predict functional behavior; the intentional stance must predict actions based on attributed mental states.

  **Analysis of Tensions & Negotiability:**

  *   **Non-Negotiable Core:** Requirements 1, 2, 3, 5, 6, 7, 8, 9 form the essential core stemming directly from respecting the stances as distinct, useful, empirically grounded perspectives on a physically closed world. Rejecting any of these fundamentally undermines the framework.
  *   **Negotiable Preference:** Requirement 4 (Stance-Relative Reality vs. Projection) is the main point of contention. Eliminativists lean towards "mere projection" for design/intentional patterns; realists (like Dennett) lean towards "stance-relative reality." The other requirements constrain *how* this preference can be implemented.
  *   **Key Tension:** Requirements 7 (Physical Closure) and the *strong interpretation* of Requirement 4 (granting robust "stance-relative reality" or even autonomy to intentional patterns) create friction. If intentional patterns are real causal patterns (not just descriptions), how do they avoid overdetermination or violating physical closure? *This tension is inherent to the stances themselves*: The intentional stance *feels* like it reveals real causal powers, yet physics seems causally closed.
      *   Requirement 8 (No Free Lunch) mediates this: Intentional patterns are *real patterns*, but their reality is constituted by their predictive utility and supervenience base, *not* by being fundamental causal forces alongside physics. The tension arises from conflating "real pattern" with "fundamental causal force."

  **Most Eliminative Requirement:** **Requirement 1 (Cross-Stance Tracking)** eliminates the largest share of existing views. It requires a positive account of *how* distinct, non-identical patterns can co-refer to the same physical events. This eliminates:
      *   **Strict Eliminativism:** Denies the reality of design/intentional patterns, failing to explain their tracking success.
      *   **Reductionism:** Collapses higher stances into the physical stance, failing to preserve distinct patterns.
      *   **Strong Emergentism / Dualism:** Often struggles to explain how the emergent/intentional pattern *exactly* tracks the physical substrate without overdetermination or violating supervenience, or how it compresses the same data differently.
      *   **Fictionalism:** Treating stances as "useful fictions" struggles to explain why these specific fictions track reality so robustly.

  **Scoring Major Views Against Desiderata:**

  1.  **Dennett's Pattern-Realism:**
      *   **Strengths:** Excels at 1 (Cross-Tracking - patterns are perspectives on the same data), 2 (Stance Adequacy), 3 (Interference - patterns break down), 5 (Utility ≠ Primitive Commitment), 6 (Pattern Existence ≠ Precision), 7 (Supervenience), 8 (No Free Lunch - patterns earn keep), 9 (Empirical Adequacy).
      *   **Weakness/Challenge:** Requires careful interpretation of 4 (Stance-Relative Reality). It grants robust reality *to the patterns themselves* as real patterns supervening on physics, but explicitly denies they are fundamental ontological primitives or possess intrinsic intentionality. Critics argue this risks collapsing into instrumentalism (failing 4 robustly) or struggles with the phenomenal feel of intentionality.

  2.  **Eliminativist Physicalism:**
      *   **Strengths:** Easily satisfies 7 (Closure), 8 (No Free Lunch - denies the lunch exists), arguably 9 (if only physics is real).
      *   **Failures:** Fundamentally fails 1 (denies co-reference of distinct patterns), 2 (denies adequacy of design/intentional stances as anything but rough shorthand), 3 (interference is just physical events overriding mistaken descriptions), 4 (all higher patterns are mere projection), 5 (naively conflates utility with non-existence), 6 (denies pattern existence at higher levels).

  3.  **Strong Emergentism:**
      *   **Strengths:** Satisfies 1 (Cross-Tracking via downward causation), 2 (Stance Adequacy), 3 (Interference via causal conflict), 4 (grants robust ontological reality), 5 (Utility reflects real causal powers), 6 (Pattern Existence vs Precision).
      *   **Failures/Challenges:** Violates or severely strains 7 (Physical Closure - downward causation implies novel causal powers leaking into physics) and 8 (No Free Lunch - posits fundamental new entities/powers without always demonstrating they provide unique causal/explanatory leverage *unavailable* via supervenient patterns). Struggles with 9 (empirical evidence for strong downward causation is highly contentious).

  **Conclusion:** An adequate theory must explain the distinct, irreducible, yet physically supervenient predictive power of design and intentional patterns (1, 2, 7, 9), account for their interactions and breakdowns (3), clearly distinguish their ontological status as real-but-dependent patterns (4, 5, 6), and justify that status through their unique utility (8). The tension between the causal potency suggested by the intentional stance and physical closure is genuine but resolvable by recognizing patterns as supervenient causal *descriptions* rather than fundamental causal *agents*. Dennett's pattern-realism comes closest to satisfying the full set, particularly the critical cross-stance tracking requirement, while eliminativism and strong emergentism fail core aspects of respecting the three stances as empirically valid perspectives.
