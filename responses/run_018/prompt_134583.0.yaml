prompt: |-
  I'm drafting a chapter on informed consent for clinical trials and have settled on a fairly demanding view that I'm not fully sure I can defend: valid consent requires not merely the absence of coercion and deception, but what I call counterfactual epistemic autonomy—the subject must be able to articulate, in vocabulary they already possess rather than one they've been taught for the occasion, the central risks and benefits they are accepting, and this articulation must remain stable across at least two counterfactual presentations (different ordering, different framing, different emotional valence). I also treat competence as irreducibly domain-specific rather than global, so that being competent to consent to a routine financial contract gives no direct license for consent to an experimental neurostimulation protocol, and I deny that this competence can be fully delegated to a proxy without altering the normative status of the act. The position is meant to be stricter than the standard Beauchamp-Childress framework without collapsing into paternalism, but I'm aware it may over-intellectualize consent in ways that exclude valid consent by non-expert subjects. So I want an honest map of its exposure: what observations about actual consent practices, what formal results in decision theory or moral psychology, and what limiting cases—perhaps involving deception that still feels like autonomy, or coercion so structural it cannot be named—would genuinely count against it? I want decisive defeaters separated from merely awkward ones, and I want to know which of these a defender of this view should concede as damaging rather than dismiss as irrelevant. In particular, I'm curious whether the domain-specificity of competence creates a regress problem—who certifies the certifiers?—and whether that is fatal or just administratively inconvenient. If the position turns out to be well-insulated because every apparent counterexample can be absorbed by refining the notion of "counterfactual stability," is that a theoretical virtue or a sign that I've insulated it into unfalsifiability? I'd like the answer to treat my framework as genuinely at risk, not as a strawman to be protected.
reasoning: |-
  Okay, the user is working on a chapter about informed consent in clinical trials and has proposed a pretty strict framework. They call it "counterfactual epistemic autonomy," which requires participants to articulate risks and benefits in their own words, with stability across different presentations. They also emphasize domain-specific competence and reject proxy delegation. The main concern is whether this framework is defensible or if it excludes valid consent from non-experts.

  First, I need to unpack the user's position. The core elements are counterfactual stability and domain-specific competence. The user is worried about over-intellectualization and potential exclusion. They want to know what could genuinely challenge their view, not just minor issues. They mentioned possible defeaters like observations from real consent practices, decision theory results, or edge cases involving deception/coercion. Also, there's the regress problem with domain-specific competence.

  I should start by identifying strong counterarguments. Real-world observations might show that even experts struggle with counterfactual stability. For example, in actual trials, participants often misunderstand or forget details. Studies on decision-making under uncertainty could indicate that framing effects are pervasive, making stability hard to achieve. If framing always influences decisions, the stability requirement might be too idealistic.

  Another angle is the exclusion of vulnerable populations. Requiring articulation in pre-existing vocabulary could disadvantage those with limited education or cognitive impairments. This might make the framework elitist. Also, emergencies where immediate consent is needed but proxies are used—how does the user's stance handle that? If proxies can't fully delegate, it might prevent life-saving interventions.

  Domain-specific competence leading to a regress is another issue. Who assesses the assessor's competence? If it's a regress, it could be administratively unfeasible. But maybe the user can argue it's a practical, not theoretical, problem. Still, without a clear endpoint, the system might not hold.

  Then there's the problem of insincerity. If participants are coached to mimic understanding, they might pass the counterfactual tests without genuine comprehension. This could make the requirement a mere formality, not ensuring true autonomy. Also, structural coercion, like economic pressure, isn't directly addressed. If someone joins a trial out of financial desperation, their consent might meet all epistemic criteria but still be coerced structurally.

  The user also wonders if refining "counterfactual stability" makes the theory unfalsifiable. If every counterexample is absorbed by adjusting the definition, that's a red flag. It might mean the framework isn't testable, which weakens its credibility. They need to acknowledge that some adjustments might be necessary but not to the point of making it irrefutable.

  I should also consider moral psychology findings. For instance, affective forecasting shows people are bad at predicting future feelings. If a participant's understanding changes with emotional valence, is that instability or rational updating? The user needs to distinguish between rational and irrational instability. But that might complicate the framework further.

  Decision theory results on preference reversals could challenge stability. If rational agents have inconsistent preferences under different frames, requiring stability might conflict with rationality itself. That's a strong defeater unless the user can show that such reversals don't apply to core risks/benefits in trials.

  The user might concede that their framework excludes some valid consents but argue it's necessary for high-risk trials. However, they need to justify why their standard is better than existing ones without falling into paternalism. Balancing strictness with inclusivity is key.

  In conclusion, the strongest defeaters are empirical evidence of pervasive framing effects, exclusion of vulnerable groups, the regress problem in competence assessment, and structural coercion. The user should address these by refining definitions but avoid making the theory untestable. Conceding some ground on proxy delegation for emergencies or distinguishing core vs. peripheral understanding might help. The framework has merits in promoting true autonomy but risks impracticality and elitism if not carefully implemented.
answer: |-
  Here’s a clear-eyed vulnerability assessment of your framework, identifying decisive defeaters (DD), awkward but surmountable challenges (AS), and concessions a defender should make. Your position’s rigor is admirable, but it faces significant empirical, theoretical, and practical pressures.

  ### **Decisive Defeaters (Genuinely Damaging)**
  1. **Empirical Reality of Framing Effects (DD)**  
     - **Observation:** Moral psychology (Tversky & Kahneman, Sunstein) shows framing effects are *pervasive* and often *unconscious*. Studies demonstrate that even experts’ risk assessments shift with emotional valence or presentation order (e.g., cancer survival rates framed as "90% survival" vs. "10% mortality" elicit different decisions).  
     - **Challenge:** If counterfactual stability requires immunity to framing, it may be **impossible for humans** to satisfy. A subject who articulates risks accurately in a calm, ordered interview but becomes confused when asked in a high-stress, reversed-order scenario fails your test—yet this reflects neurocognitive limits, not defective autonomy.  
     - **Why Damaging?** Your standard could invalidate *all* consent if framing instability is intrinsic to cognition. Conceding this requires weakening "stability" to allow *rational* (not arbitrary) shifts.

  2. **Exclusion of Vulnerable Populations (DD)**  
     - **Observation:** Low-literacy subjects, those with cognitive impairments (e.g., early dementia), or cultural minorities might lack vocabulary to articulate complex medical risks without education. Current practices use teach-back methods or simplified language precisely to bridge this gap.  
     - **Challenge:** Your ban on "vocabulary taught for the occasion" risks **elitism**. E.g., a farmer consenting to a vaccine trial might grasp "risk of fever like bad flu" but not "systemic inflammatory response." If they can’t articulate it in pre-existing terms, their consent is invalid—even if they competently weigh *their understanding* of risks.  
     - **Why Damaging?** This contradicts the anti-paternalist goal by excluding marginalized groups from trials they might autonomously value. Concede that "articulation" must accommodate *functional understanding* (e.g., metaphors, lived-experience analogies) if stable.

  3. **Emergency/Proxy Dilemmas (DD)**  
     - **Observation:** In emergency research (e.g., traumatic brain injury), consent is often obtained via proxies. Your denial of full proxy delegation implies such trials are *normatively distinct* from those with direct consent.  
     - **Challenge:** If a proxy deeply understands the protocol (e.g., a spouse familiar with the patient’s values), and the patient regains capacity post-trial affirming the choice, your framework must still deem it "less valid." This clashes with intuitions about **relational autonomy** and practical necessity.  
     - **Why Damaging?** Forces either untenable restrictions on critical research or ad hoc exemptions undermining consistency. Concede proxy consent as *derivatively valid* if counterfactual tests apply to the proxy’s understanding.

  ---

  ### **Awkward but Surmountable Challenges (Require Refinement)**
  1. **Domain-Specific Competence Regress (AS)**  
     - **Problem:** If competence is domain-specific, who certifies the assessor’s competence in *neurostimulation*? This risks infinite regress or gatekeeping by unaccountable "experts."  
     - **Response:** Regress is **administratively inconvenient but not fatal**. Ground assessment in interdisciplinary panels (clinicians, ethicists, patient advocates) with transparent criteria. *Concede* it demands robust institutional scaffolding but doesn’t collapse logically.  
     - **Edge Case:** A subject competent in physics but not biology might grasp neurostimulation mechanisms better than a physician. Your framework can absorb this by allowing non-standard expertise.

  2. **Insincere Performance (AS)**  
     - **Observation:** Subjects can be coached to "game" counterfactual tests, reciting risks verbatim without understanding (e.g., replicating phrases from consent forms).  
     - **Response:** This challenges *all* consent frameworks. Mitigate by requiring paraphrasing, probing for contextual implications ("What would this mean for your daily life?"), and assessing coherence across >2 counterfactuals. *Concede* perfect anti-gaming is impossible.

  ---

  ### **Limiting Cases That Test Coherence**
  1. **Structural Coercion "Baked Into" Autonomy**  
     - **Case:** A financially desperate subject joins a trial for survival pay. They pass counterfactual tests, articulating risks clearly across emotional framings. Yet their consent is coerced by poverty.  
     - **Challenge:** Your framework validates this consent (no deception, epistemic autonomy intact), but it feels normatively void. This exposes that **epistemic autonomy ≠ full autonomy**—it ignores distributive injustice.  
     - **Defender’s Move:** Concede that epistemic autonomy is necessary but insufficient; add a distinct criterion for "non-exploitative background conditions."

  2. **Beneficial Deception**  
     - **Case:** A subject with severe anxiety would refuse a low-risk trial if told "1% chance of rash." If rephrased as "99% chance of no rash," they consent and later endorse the choice. Framing changes their decision, but outcome improves well-being.  
     - **Challenge:** Counterfactual instability here seems *rational*. Your framework invalidates consent, but paternalistically overrides welfare.  
     - **Defender’s Move:** Argue instability reveals *incompetence* for this domain (anxiety disrupts risk calibration). Relocate the problem to your competence clause.

  ---

  ### **Theoretical Risks: Over-Insulation**
  - **If "counterfactual stability" absorbs all counterexamples**, it risks **unfalsifiability**. E.g., dismissing framing effects as "irrational" or redefining "central risks" post hoc to exclude unstable articulations.  
  - **Diagnosis:** This is a **theoretical vice** if refinements lack independent criteria. To avoid this:  
    1. Predefine "central risks/benefits" (e.g., mortality, irreversible morbidity, primary efficacy).  
    2. Specify acceptable sources of instability (e.g., new information) vs. irrational ones (e.g., pure framing).  
    3. Ground tests in empirical decision science.  

  ---

  ### **Concessions a Defender Must Make**
  1. **Your standard will exclude some intuitively valid consents** (e.g., pragmatic patients trusting clinicians without grasping biochemistry). Defend this as the cost of rigor.  
  2. **Implementation is resource-intensive**, potentially slowing research. Argue this is justified for high-risk trials.  
  3. **Proxy consent must be normatively "second-best"**—permissible only when direct consent is impossible.  
  4. **Framing effects demand a threshold**: Consent is stable if variations don’t alter the *core evaluative judgment* (e.g., "risks outweigh benefits"), even if wording shifts.

  ### **Conclusion**
  Your framework’s core vulnerability is **anthropological**: it overestimates human cognitive uniformity in risk processing. The strongest defeaters come from moral psychology (framing effects) and justice (exclusion). To survive:  
  - Relax the "pre-existing vocabulary" rule to allow *scaffolded articulation*.  
  - Distinguish **competence** (domain-specific capacity) from **performance** (susceptibility to framing).  
  - Accept that epistemic autonomy is one pillar of consent—not the entirety.  

  This position is defensible as a **regulative ideal** for high-stakes trials, but requires concessions to human fragility. It remains a formidable critique of complacent consent practices.
