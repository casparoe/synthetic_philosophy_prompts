  For the example, I’ll need to define RSWD such that its core feature—rigid, identity-based withdrawal—only emerges after patients adopt the diagnostic narrative. Pre-diagnosis, they might have social anxiety, but post-diagnosis, their withdrawal becomes entrenched as a "core self" trait. Clinicians defend this because the narrative reduces self-blame and improves adherence, even though it reinforces the symptoms. 

  Where’s the paradox? If the disorder’s defining features (e.g., "this is my authentic self") depend on the diagnostic label, then the label isn’t describing a pre-existing condition—it’s creating one. That undermines the scientific claim of descriptive neutrality. Unlike autism or DID, where diagnostic shifts might change expression but not create the core traits, RSWD’s core traits wouldn’t exist without the diagnosis. 

