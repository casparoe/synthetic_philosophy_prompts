prompt: |-
  I'm a PhD student in moral philosophy and I'm kinda stuck on a paper about supererogation—specifically whether a group can perform an act that's genuinely beyond duty in a non-distributive way, not just every member chipping in extra. I'm calling this "instutional supererogation" for now, though I'm sure there's literature out there I haven't tracked down yet. I was arguing about it with my friends at a bar last night and we kept coming back to Lord of the Flies, since everyone knows the basic plot: the boys are stranded, they try to maintain the signal fire and the conch for order, Piggy dies, and Ralph gets rescued by the naval officer. I want you to read Golding's novel through this lens of institutional supererogation, treating the boys' collective efforts to maintain rescue and democratic order as a potential group-level supererogatory project. Where does the framing actually work? For example, is keeping the fire going a collective act that exceeds mere survival obligation? Where does it collapse—maybe when Jack's faction splits off and the "group agent" dissolves? I need a reading that takes both the narrative seriously (the death of Piggy, the officer's ironic arrival, the breakdown of the conch) and the philosophical concept seriously, without reducing the book to a simple illustration. Please say what the story adds that pure ethical argument doesn't capture, and point to specific scenes that illuminate the tension. You should act as an expert in both moral philosophy and literary interpretation. Please think step by step, do a little brainstorming first, then lead with your bottom line in the first sentence and follow with your reasoning—no preamble and no restating of the question.
reasoning: |-
  Okay, let me approach this systematically. The PhD student is exploring institutional supererogation through Lord of the Flies, which presents an interesting test case for group-level moral action beyond individual duties.

  First, I need to map the philosophical concept onto the novel's structure. The boys' initial efforts - maintaining the signal fire, establishing rules with the conch - could represent a collective project exceeding basic survival needs. But Golding complicates this by showing how the group's agency deteriorates. 

  The fire is particularly nuanced. Early on, it's a shared commitment to rescue that requires constant collective effort beyond immediate survival. But when Jack's hunters neglect it for hunting, it highlights how supererogation depends on sustained collective intentionality. Piggy's glasses becoming the fire-starting tool adds another layer - the means of supererogation are vulnerable to appropriation.

  The conch's trajectory is crucial too. Its initial role in facilitating democratic deliberation represents an institutional structure enabling supererogatory action. But as order breaks down, its shattered destruction with Piggy symbolizes the impossibility of institutional supererogation without functional collective agency.

  Golding's narrative does something philosophy alone can't: it demonstrates how institutional supererogation requires specific material and social conditions. The naval officer's arrival creates devastating irony - their collective project might have succeeded if maintained, but the very attempt destroyed its prerequisites.

  Key scenes to highlight:
  - The boys' enthusiastic cooperation in Chapter 2 building the first big fire
  - Jack redirecting labor to hunting in Chapter 4 while the fire dies
  - Simon's death showing the collapse of moral constraints
  - Piggy holding the conch during his murder in Chapter 11

  The novel ultimately suggests institutional supererogation is fragile, context-dependent, and easily corrupted - a cautionary tale about the material preconditions for collective moral action.
answer: |-
  **The boys' initial maintenance of the signal fire constitutes a genuine but fragile instance of institutional supererogation, which Golding's narrative reveals collapses precisely because the group fails to sustain the shared intentionality and institutional structures necessary for non-distributive moral action beyond duty.** Here's the breakdown:

  1.  **The Fire as Institutional Supererogation:** Keeping the signal fire alight isn't merely survival; it's a *collective project* aimed at *rescue* (a good beyond basic necessity) requiring coordinated, burdensome labor (gathering wood, constant vigilance) that exceeds any individual's duty to self-preserve. This shared goal and the initial democratic structure (embodied in assemblies with the conch) create a proto-institution capable of actions irreducible to individual contributions. No single boy *could* maintain it alone; the supererogatory act *emerges* from their organized, rule-bound cooperation aiming at a higher good. (Chapter 2: Building the first fire; Chapter 4: The missed rescue ship due to the fire being out).

  2.  **The Collapse of Institutional Agency:** The supererogatory project disintegrates as the necessary institutional preconditions dissolve:
      *   **Erosion of Shared Intentionality:** Jack's faction abandons the *shared* goal of rescue for the immediate gratification of hunting and power. Their labor shifts from the supererogatory fire to hunting pigs, a distributively additive act (more meat for individuals) lacking a collective moral surplus. The fire becomes merely instrumental for cooking, not signaling. (Chapter 4: Jack smears clay, focusing on hunting; Chapter 8: Jack steals fire for cooking, not rescue).
      *   **Breakdown of Institutional Structures:** The conch, the symbol and mechanism of democratic deliberation and collective decision-making (essential for defining and sustaining a *group* duty or supererogation), loses its power. Jack explicitly rejects its authority ("Conch! Conch! We don't need the conch anymore"). Without this structure, the "group agent" fragments, dissolving the basis for *institutional* action, supererogatory or otherwise. (Chapter 5: Jack challenges the conch's rules; Chapter 11: The conch is destroyed with Piggy).
      *   **Loss of Moral Constraints:** The descent into savagery destroys the minimal moral baseline (duties) upon which supererogation builds. Simon's murder (Chapter 9) isn't just individual failure; it's the group abandoning the duty *not to kill*, making supererogation impossible. Piggy's death (Chapter 11) is the literal and symbolic destruction of reason and the last vestige of institutional order necessary for group moral action.

  3.  **What the Novel Adds to the Philosophy:**
      *   **Material and Psychological Preconditions:** Golding starkly illustrates that institutional supererogation isn't abstract; it requires specific, fragile *conditions*: shared material resources (Piggy's glasses for fire), psychological buy-in (the Littluns' fear vs. the Biguns' ambition), and enforceable rules (the conch's efficacy). Philosophy often assumes these; the novel shows their vulnerability.
      *   **The Irony of Failure and Rescue:** The naval officer's arrival underscores the tragic collapse. The *potential* for successful institutional supererogation (maintaining the fire *would* have led to rescue) is proven retrospectively, but the *attempt* itself, under deteriorating conditions, consumed the very institutional integrity needed to sustain it. The officer perceives only "fun and games," highlighting the invisibility of the failed supererogatory project to an external observer lacking the internal narrative.
      *   **The Cost of Breakdown:** The narrative forces us to confront the *consequences* of institutional collapse – not just the failure to achieve the supererogatory good (rescue via the fire), but the descent into profound moral failure (murder). It shows how the *absence* of sustained institutional agency for good creates a vacuum filled by destructive collective action.

  **Bottom Line Scenes:**
  *   **Success Potential (Chapter 2):** The boys' unified, enthusiastic effort to build the massive signal fire demonstrates the emergent, supererogatory institutional action – exceeding individual survival duties for a shared higher good.
  *   **Fragility Revealed (Chapter 4):** Jack letting the fire die for hunting shows the diversion of collective effort away from the supererogatory project towards distributive individual gain, beginning the erosion of shared intentionality.
  *   **Institutional Collapse (Chapter 11):** The shattering of the conch simultaneously with Piggy's death is the definitive moment where the institutional structure and its last rational advocate are destroyed, eliminating any possibility of group-level moral agency, supererogatory or dutiful. The officer's arrival moments later provides the devastating irony – the supererogatory goal was achievable, but the institutional agent capable of it had just self-destructed.

  Golding's novel doesn't just illustrate institutional supererogation; it performs a brutal thought experiment demonstrating its demanding preconditions, tragic fragility, and the catastrophic moral cost of its failure when group agency dissolves into competing individualisms.
