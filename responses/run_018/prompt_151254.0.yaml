  Final Procedure:

  **Procedure for Evaluating Decoded Strings**

  1. **Check for Decoder Artifacts or Errors**:
     - Consult the decoder's error log and known artifact patterns (e.g., random word strings, repeated words, nonsensical combinations as defined in the decoder manual).
     - If the string matches a known error pattern, exclude it from the dataset. Otherwise, proceed.

  2. **Check Decoder Operational Conditions**:
     - Verify that the decoder was operating within its specified conditions (e.g., signal quality thresholds, patient state requirements) at the time of the report by checking the technical logs.
     - If the decoder was not operating within specifications, exclude the string. Otherwise, proceed.

  3. **Check Grammaticality and Coherence**:
     - Determine if the string is grammatically structured and coherent (i.e., forms a meaningful phrase or sentence) as per the typical output of the decoder.
     - If the string is ungrammatical and incoherent (and this is not typical for the decoder in valid outputs), exclude it. Otherwise, proceed.

  4. **Flag for Vocabulary Limitations, Metaphor, and Cross-Modal Terms**:
     - Check each word in the string against the decoder's official vocabulary list (provided by the manufacturer).
       - If any word is not in the vocabulary list, exclude the string.
     - If all words are in the vocabulary, then check if the string contains:
       - Words used in a way that is typically metaphorical (e.g., "heavy" for an emotion, "bright" for a sound).
       - Cross-modal expressions (e.g., "green sound", "loud color").
       - Note: Do not exclude for metaphor or cross-modal usage. Instead, flag the string as "metaphor-prone" or "cross-modal" for the senior reviewer to consider during analysis.
     - Proceed to the next step.

  5. **Check for External Inconsistency**:
     - Compare the string with the patient's observed behavior and physiological markers that are being recorded in the study (e.g., pain markers, facial expressions, movement).
     - If the string is grossly inconsistent with these observations (e.g., the string reports no pain while physiological markers are above the pain threshold defined in the protocol), then escalate to a senior reviewer and hold the string from the dataset until reviewed.
     - If there is no such inconsistency, accept the string into the dataset.

  **Note**: This procedure is not designed to:
     - Determine the truth of the report about the patient's conscious experience.
     - Interpret the meaning of metaphors or cross-modal expressions.
     - Distinguish between veridical perceptions, hallucinations, dreams, or other altered states.

  **Termination**:
  - Exclusion occurs at steps 1, 2, 3 (if ungrammatical and incoherent and not typical), and 4 (if word not in vocabulary).
  - Escalation to a senior reviewer occurs at step 5 if there is gross external inconsistency.
  - Otherwise, the string is accepted (with flags from step 4 if applicable).
answer: |-
  ### Decision Procedure for Decoded String Evaluation

  **Objective**: To determine whether a decoded string should be included in the dataset, excluded, or escalated for senior review, based on operational checks that avoid philosophical interpretation. The heterophenomenological framework treats all strings as valid descriptions of a "textual world" unless they fail technical or factual criteria. The procedure does **not** assess the truth, coherence, or plausibility of the reported experience—only whether the string meets data-integrity standards.

  **Key Principles**:
  - **Exclusion**: Strings are rejected only for technical errors, operational failures, or unambiguous contradictions with external facts.
  - **Escalation**: Required when judgment involves interpretive values (e.g., metaphor, cross-modal mappings) or ambiguity in external consistency.
  - **Flagging**: Strings are tagged as "impoverished vocabulary" (decoder lacks words for precise expression), "metaphor-prone" (non-literal language likely), or "cross-modal" (sensory blending). These do not cause exclusion but inform analysis.
  - **Limits**: The procedure **cannot** settle:
    - Whether the string reflects "real" consciousness.
    - The meaning of metaphors or subjective experiences.
    - Discrepancies between reports and physiological states (treated as data, not errors).

  **Ordered Procedure**:

  1. **Check for decoder malfunction or noise**  
     **Question**: Does the string match known error patterns (e.g., random word salad, device-specific glitches like "ERROR_QUERY")?  
     **Sufficient answer**: Yes (exclude) if pre-defined error signatures are present (e.g., strings like "NULL_REF" or non-grammatical gibberish). No → Proceed.  
     **Termination**: Exclude if yes.

  2. **Verify decoder operational conditions**  
     **Question**: Were signal quality, calibration, and patient state (e.g., awake/sedated) within protocol-specified tolerances?  
     **Sufficient answer**: No (exclude) if logs show out-of-range metrics (e.g., low signal-to-noise ratio). Yes → Proceed.  
     **Termination**: Exclude if no.

  3. **Assess grammatical structure**  
     **Question**: Is the string grammatically intact (e.g., subject-verb-object) per decoder specifications?  
     **Sufficient answer**: No (exclude) if incoherent (e.g., "color the singing ceiling is"). Yes → Proceed.  
     **Termination**: Exclude if no.

  4. **Flag vocabulary limitations or atypical mappings**  
     **Question**:  
     a. **Impoverished vocabulary**: Does the decoder's training set lack domain-specific words (e.g., no "pain" synonym)?  
     b. **Metaphor-prone**: Does the string use non-literal language (e.g., "weight of sadness")?  
     c. **Cross-modal**: Does it blend senses (e.g., "loud color")?  
     **Sufficient answer**:  
     - Flag as "impoverished" if decoder vocabulary is known to be limited for the context.  
     - Flag as "metaphor-prone" if words deviate from literal meanings (e.g., "singing" for a non-auditory object).  
     - Flag as "cross-modal" if senses are mixed (e.g., "green" for sound).  
     **Termination**: Proceed regardless. Flags do not trigger exclusion/escalation.

  5. **Check for literal impossibility**  
     **Question**: Does the string describe a physically impossible scenario under real-world constraints (e.g., "I am on Mars" from an Earth-bound patient)?  
     **Sufficient answer**: Yes (escalate) if the impossibility is unambiguous and operational (e.g., patient is paralyzed but reports "dancing"). No → Proceed.  
     **Termination**: Escalate if yes. Physical impossibility may indicate hallucination/dream data, requiring senior review for contextualization.

  6. **Assess external consistency with observable facts**  
     **Question**: Is the string directly contradicted by unambiguous, protocol-defined external markers (e.g., "no pain" during verified noxious stimulation)?  
     **Sufficient answer**:  
     - **Inconsistency**: Escalate if markers definitively conflict (e.g., autonomic pain response present + denial of pain).  
     - **Consistency/ambiguity**: Accept into dataset.  
     **Termination**: Escalate if inconsistent. *Note*: Subjective-physiological mismatches (e.g., pain markers without reported pain) are **not** grounds for exclusion—heterophenomenology treats these as valid data.

  7. **Final decision**  
     - If all steps passed without exclusion or escalation: **Accept** into dataset.  
     - Senior reviewer handles escalated cases: May accept, reject, or tag for analysis.

  ---

  ### Application to Incoming Reports

  #### **Report 1**: String = "there is no suffering"  
  **Context**: Patient exhibits sustained nociceptive reflexes (e.g., withdrawal from touch) and elevated autonomic markers (e.g., heart rate, cortisol).

  | Step | Question/Test | Outcome | Action |
  |------|---------------|---------|--------|
  | 1 | Decoder malfunction? | No error patterns. | Proceed. |
  | 2 | Operational conditions? | Within tolerances. | Proceed. |
  | 3 | Grammatical? | Grammatically intact. | Proceed. |
  | 4 | Vocabulary/mappings? | No flags: "suffering" is in decoder vocabulary; literal usage. | Proceed. |
  | 5 | Literal impossibility? | No: Denying suffering is phenomenologically possible (e.g., analgesia). | Proceed. |
  | 6 | External consistency? | **Gross inconsistency**: Autonomic markers confirm physiological distress, but string denies suffering. | **Escalate to senior reviewer**. |

  - **Unwelcome outcome (as designer)**: Escalation is unwelcome because it highlights a core tension: heterophenomenology treats subjective-physiological mismatches as data, but clinicians may view this as a decoder error.  
  - **Residual judgment call**: The senior reviewer must decide if this reflects a dissociative state (accept as data) or a technical flaw (exclude). The procedure cannot resolve this, as it hinges on interpreting the *meaning* of "suffering."

  #### **Report 2**: String = "the ceiling is singing in green"  
  **Context**: Patient in minimally conscious state; no history of synesthesia or artistic expression.

  | Step | Question/Test | Outcome | Action |
  |------|---------------|---------|--------|
  | 1 | Decoder malfunction? | No error patterns. | Proceed. |
  | 2 | Operational conditions? | Within tolerances. | Proceed. |
  | 3 | Grammatical? | Grammatically intact. | Proceed. |
  | 4 | Vocabulary/mappings? | **Flagged**: Cross-modal ("singing in green" blends auditory/visual) and metaphor-prone ("singing" for inanimate object). | Proceed with flags. |
  | 5 | Literal impossibility? | **Escalate**: "Singing ceiling" is physically impossible. Senior must contextualize (e.g., hallucination vs. poetic expression). | **Escalate to senior reviewer**. |
  | 6 | External consistency? | N/A (escalation at Step 5). | N/A |

  - **Unwelcome outcome**: Escalation is unwelcome as it over-cautiously flags a common heterophenomenological output (e.g., synesthesia-like reports).  
  - **Residual judgment call**: The senior reviewer must determine if this is valid experience (e.g., emerging synesthesia) or decoder error. The procedure forces escalation due to "impossibility," but this conflicts with heterophenomenology’s acceptance of altered states.

  ---

  ### Failure Modes and Why Unavoidable

  1. **False Positives (Invalid strings accepted)**  
     - **Scenario**: A string like "pain is blue" (metaphor-prone) is accepted without escalation if external markers are consistent (e.g., patient is calm). However, it could be a decoder error misinterpreting neural noise.  
     - **Why unavoidable**: The procedure cannot probe subjective accuracy. Heterophenomenology mandates accepting all coherent strings, so false positives from ambiguous mappings are inherent.

  2. **False Negatives (Valid strings excluded)**  
     - **Scenario**: A poetic but genuine report like "suffering is a heavy stone" is excluded due to "impoverished vocabulary" (if "emotional weight" isn't in the decoder's training set) or grammatical quirks.  
     - **Why unavoidable**: Operational rules (e.g., grammar checks) prioritize reliability over phenomenological richness. Exclusions based on technical limits are necessary for data quality but may discard authentic experiences.

  3. **Escalation Overload**  
     - **Scenario**: Common heterophenomenological outputs (e.g., "I am not present" in dissociative states) are escalated due to "literal impossibility" or external inconsistency, overwhelming reviewers.  
     - **Why unavoidable**: The procedure escalates interpretive ambiguities to avoid philosophical overreach, but heterophenomenology generates many such cases by design. Reducing escalations would require value judgments, violating the framework’s neutrality.

  These failures stem from the heterophenomenological commitment to treating reports as "texts" rather than truth-claims. Operational checks protect against technical errors but cannot bridge the gap between objective data and subjective experience.
