  - Step 1: exclusion if decoder error.
  - Step 2: exclusion if decoder was not operating within specifications.
  - Step 4: exclusion if word not in decoder's vocabulary.
  - Step 5: escalation if gross inconsistency with observed facts.

  What the procedure is not designed to settle:
  - The truth of the report about the patient's actual conscious state.
  - The meaning of metaphorical or cross-modal statements (only flags them).
  - Whether the report is a hallucination, dream, or veridical perception.

  Now, let's apply to the two examples.

  Example 1: String = "there is no suffering"
  Patient: exhibiting sustained nociceptive reflexes and elevated autonomic markers.

  Step 1: Check for decoder errors. No obvious errors (it's a grammatical sentence). Proceed.
  Step 2: Check decoder operational conditions. Assume they were within specifications. Proceed.
  Step 3: Check grammaticality and coherence. It is grammatical and coherent. Proceed.
