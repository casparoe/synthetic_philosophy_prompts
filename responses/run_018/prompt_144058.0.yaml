  1. **From the postdoc (Quine expert):** 
     - Objection: Quine never claimed that logical truths are immune to revision; he only said they are at the center and harder to revise. By focusing on local fixity, you're ignoring his pragmatic account of centrality and the fact that even logic can be revised (as in quantum logic). This misreads Quine's holism.
