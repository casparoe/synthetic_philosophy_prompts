prompt: |-
  I'm a science and ideas journalist, and I'm working on a long article about the old why-are-some-nations-rich problem. I've read to much of the institutions-vs-geography-vs-culture debate to pretend that the conventional summaries — institutions won, case closed — are settled, but I don't have a good way to put an honest confidence on any of it. So I want to use you as a sparring partner to force the uncertainty into the open.

  The proposition I want you to score is roughly this: if you had to pick one of the three standard candidate factors — institutions, geography, or culture — as the most important cause of persistent differences in national prosperity today, institutions is the right pick. Part of your job is to first tighten that claim into something defensible, whatever that takes: most important might mean proximate versus ultimate cause, or it might need a clause about the past few decades versus the past few centuries. I want an actual credence, a number between 0 and 1, and I care more about the decomposition than the number. What are the sub-questions your credence depends on? Spend a short paragraph brainstorming them and then keep the ones that actually matter. I expect at least these candidate sub-questions to be considered on the way: how much of the institutions-prosperity correlation is reverse causation (rich countries buying better institutions), how much rides on whether natural experiments like the settler-mortality design genuinely rule out omitted variables, how much rides on the fact that institutional quality is hard to measure without sneaking outcomes back in, how much rides on geography or culture being the deeper variable that gave some places better institutions in the first place, and how much rides on the possibility that the dominant cause simply has no determinate answer for an overdetermined historical process. For each sub-question, give a rough probability or range and say how it enters: is it a gate that has to be passed, a discount factor on the overall credence, or a competing hypothesis that would take the probability mass itself?

  Then tell me which sub-question your final number is most sensitive to — if you changed your mind on just that one, how far would the headline credence move? And what concrete evidence or argument, if it appeared, would move you most?

  One epistemic request: separate what is settled from what is genuinely contested among people who actually work on this, and do not dress up a contested reading as the consensus. If the institutions-favoring conclusion depends on one camp's way of coding the evidence, flag that instead of rounding it off.

  For my notes before I draft, please finish with a JSON object (no markup, just the object) with exactly this schema:

  - "proposition_scored": the tightened version of the claim you actually assigned a number to
  - "credence": your probability, from 0 to 1
  - "sub_questions": an array of objects, each with "question", "probability_or_range", "how_it_enters" (one of "gate", "discount_factor", "alternative_hypothesis", or "other"), and "one_sentence_rationale"
  - "most_sensitive_to": the one sub-question whose movement would change your final credence the most, plus the approximate size of the swing
  - "what_would_move_it": the concrete evidence or argument that would shift you most, and in which direction
  - "settled_vs_contested": an object with two fields, "settled" and "contested", each a list of short claims

  For calibration: my own gut sits around 0.6 and an econometrician friend says under 0.4, and I'd appreciate a sentence on where a disagreement like that most likely lives. Do all of this as an expert in comparative political economy and causal inference who has also thought about the philosophy of social science.
reasoning: |-
  We are scoring the proposition: "If you had to pick one of the three standard candidate factors — institutions, geography, or culture — as the most important cause of persistent differences in national prosperity today, institutions is the right pick."

  But we must tighten the claim. I propose:

  **Tightened Proposition**: "Among institutions, geography, and culture, institutions are the most important *proximate and policy-actionable* cause of persistent differences in national income per capita over the past 50 years."

  Why this tightening?
  - "Most important" is ambiguous. We focus on proximate cause because ultimate causes (like deep geography or centuries-old culture) are less relevant for policy interventions today.
  - We specify the time frame (last 50 years) to avoid debates about very long-run history (e.g., before industrialization) and to focus on the period with better data and when institutions have been more explicitly manipulated (e.g., via colonialism, independence, reforms).
  - We focus on income per capita as the measure of prosperity because it's measurable and central to the literature.
  - We add "policy-actionable" to emphasize that institutions are the lever that governments and international organizations can most directly influence, which is a key reason for the focus in policy discourse.

  Now, assign a credence. I'll set it at **0.65**.

  But the credence depends on several sub-questions. We'll brainstorm and then select the most critical ones.

  Brainstorming sub-questions:
  1. How much of the institutions-prosperity correlation is causal (vs. reverse causation or omitted variables)?
  2. To what extent do natural experiments (e.g., settler mortality as an instrument for institutions) validly identify causality?
  3. How well can we measure institutional quality without circularity (i.e., without using outcomes like GDP)?
  4. Are institutions primarily a product of deeper geographic or cultural factors?
  5. Is the historical process overdetermined, making a single "most important" cause meaningless?
  6. How persistent are institutional effects vs. geographic or cultural effects?
  7. How much does the answer depend on the time horizon (e.g., institutions matter more in the short run, geography in the very long run)?
  8. How much do institutions explain variation in prosperity relative to geography and culture in contemporary data?
  9. How sensitive are institutional effects to context (e.g., do they only work when combined with certain cultural traits?)?
  10. How much does the definition of "institutions" matter (e.g., inclusive vs. extractive, formal vs. informal)?

  We'll keep the ones that are most critical and directly relevant to the credence.

  Selected sub-questions (with rationale for selection):

  1. **Causality of the correlation**: If the correlation is mostly reverse causation, then institutions are not the driver. This is a gate: if it fails, our credence drops a lot.
  2. **Validity of natural experiments**: If the natural experiments (like Acemoglu et al.'s settler mortality) are invalid due to omitted variables or weak instruments, then the evidence for causality weakens. This is a gate.
  3. **Measurement of institutions**: If we can't measure institutions without sneaking outcomes in, then the evidence is circular. This is a discount factor.
  4. **Institutions as a deeper cause vs. product of geography/culture**: If institutions are just a channel for geography or culture, then those are more fundamental. This is an alternative hypothesis that would take probability mass.
  5. **Overdetermination**: If the causes are too intertwined, then picking one as "most important" is arbitrary. This is a discount factor on the whole exercise.

  Other questions (like persistence or time horizon) are incorporated in the above.

  Now, for each:

  1. **Question**: How much of the observed correlation between institutions and prosperity is causal (i.e., not reverse causation or due to omitted variables)?  
     **Probability_or_range**: 0.7 (meaning I believe 70% of the correlation is causal)  
     **How_it_enters**: Gate. If this probability were 0, our credence would drop to near 0.  
     **One_sentence_rationale**: The literature (e.g., Acemoglu, Johnson, Robinson 2001) uses historical instruments to argue for causality, but critics (e.g., Albouy 2012) point to data issues and alternative explanations.

  2. **Question**: How valid are natural experiments (like settler mortality) for identifying the causal effect of institutions?  
     **Probability_or_range**: 0.6 (moderate confidence in validity)  
     **How_it_enters**: Gate. If invalid, then the evidence for causality weakens substantially.  
     **One_sentence_rationale**: The settler mortality instrument has been heavily debated, with some replication attempts supporting it and others finding flaws (e.g., Acemoglu et al. vs. Albouy).

  3. **Question**: Can institutional quality be measured without circularity (i.e., without using outcomes like GDP)?  
     **Probability_or_range**: 0.8 (high confidence)  
     **How_it_enters**: Discount factor. If measurement were poor, we'd discount the evidence.  
     **One_sentence_rationale**: Measures like Polity IV or constraints on the executive are based on political processes, not economic outcomes, though some proxies (e.g., rule of law indices) might have circularity issues.

  4. **Question**: Are institutions primarily a product of deeper geographic or cultural factors?  
     **Probability_or_range**: 0.4 (moderate probability that they are a product)  
     **How_it_enters**: Alternative hypothesis. If true, then geography or culture would be the fundamental cause.  
     **One_sentence_rationale**: Geography may have shaped early institutions (e.g., Diamond 1997), and culture (e.g., trust, norms) may sustain institutions (e.g., Putnam 1993), but institutions also have independent persistence.

  5. **Question**: How overdetermined is the historical process? (i.e., how arbitrary is it to pick one factor as "most important"?)  
     **Probability_or_range**: 0.3 (low to moderate)  
     **How_it_enters**: Discount factor on the entire proposition. If high, we'd lower the credence because the question is ill-posed.  
     **One_sentence_rationale**: Historians often emphasize complex interactions, but policy discussions require prioritizing levers.

  **Most sensitive sub-question**: The causality of the correlation (sub-question 1). If the probability for that dropped to 0.4 (from 0.7), the headline credence would drop to about 0.4. If it rose to 0.9, the credence would rise to 0.8. So a swing of about ±0.2 in the sub-question leads to a ±0.15 swing in the headline.

  **What would move it**: New evidence from a well-identified natural experiment (e.g., a randomized institutional reform) showing large effects on growth would increase confidence (toward 0.9). Conversely, a study showing that institutional improvements in poor countries consistently fail to boost growth (after controlling for other factors) would decrease confidence (toward 0.4).

  **Settled vs. Contested**:
  - **Settled**: 
    - Institutions are strongly correlated with prosperity.
    - Geography has direct effects (e.g., tropical diseases, landlockedness) but also indirect via institutions.
    - Culture is hard to measure and its effects are often mediated by institutions.
  - **Contested**:
    - Whether the correlation between institutions and prosperity is mostly causal (vs. reverse/omitted variables).
    - Whether natural experiments like settler mortality are valid.
    - Whether culture is an independent cause or just a legacy of past institutions.
    - Whether the concept of a "most important" cause is meaningful given complex interactions.

  **Calibration note**: Your gut (0.6) and the econometrician friend (under 0.4) likely disagree most on the causality sub-question. The econometrician might put more weight on the critiques of natural experiments and reverse causation.

