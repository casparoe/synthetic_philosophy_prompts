  Part 2 (function over structure): Here's where practice diverges from theory. Anomaly detection algorithms hunger for data patterns, not CAD files. If the electric pump's output waveforms match hydraulic behavior within tolerance, most systems won't care. But! I'll hedge at 70% because some failures (e.g., electrical arcing vs hydraulic leaks) need structural awareness. 

  Part 3 (hidden backup): This is fascinating. The dormant circuit breaks functional equivalence during failures—exactly when anomaly detection matters most. It forces a 15% probability drop because now "same job" only applies to success states. The backup's unique failure signatures could blindside sensors trained only on primary circuits. 

  Part 4 (added factor): They'll want something non-obvious. "Operational context" covers how environment (temperature, load cycles) affects what "same" means. Dusty vs clean rooms might alter sensor priorities. 

  Software updates... tricky. Patch? Same mechanism. Rewritten control logic? New mechanism if failure behaviors change. 

  Biggest weakness is part 2—real systems blend function/structure. The decider experiment? Swap pump types but simulate identical faults. If detection rates stay stable, function wins. 

