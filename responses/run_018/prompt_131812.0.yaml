  I am preparing an application for a one-semester independent study fellowship in moral philosophy, and I need to transform a half-formed intuition into a rigorous research proposal. The domain is G. E. Moore's account of intrinsic value in Principia Ethica, specifically the parallel roles he assigns to aesthetic experience and personal friendship as instances of what philosophers now call organic unity—the idea that the value of a whole can exceed the sum of the values of its parts. Most commentary treats Moore's aesthetic examples and his ethical remarks about friendship separately, but I suspect there is an unstated structural assumption linking them: that for a complex to exhibit non-additive value, its constituent experiences or relations must be unified within a single conscious perspective over time. If this assumption is essential to Moore's argument, then collective or distributed practices—such as collaborative artworks whose value depends on sustained interaction among multiple agents—would either be excluded from his category of intrinsic goods or would require a revision of how he understands the unity of friendship itself.

  The proposal should address the following: state the precise research question in a form that admits of a determinate answer; explain why standard interpretations of Moore leave this particular tension unresolved; outline a concrete method for the semester, perhaps beginning with a close reconstruction of his arguments about parts, wholes, and consciousness, then constructing an extension of his framework to distributed cases, and finally testing whether that extension conflicts with his explicit commitments about personal relations; specify what a successful result would demonstrate and what outcome would count as failure; and provide an honest assessment of scope, including what part of the project could be dropped if time runs short. Please do not include a bibliography, reading list, or citation apparatus—I will add references myself. The document should be approximately 800 to 1000 words, written in formal academic prose suitable for a faculty review committee.
