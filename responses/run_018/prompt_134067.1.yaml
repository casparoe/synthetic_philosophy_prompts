answer: |-
  To map the conceptual terrain concerning the autonomy of epistemic instruments in Nyāya thought, we begin with the most fundamental partition: whether perception and inference alone suffice to generate all valid cognition, or whether additional irreducible sources are required. The first position, typified by the Cārvāka materialists and certain Buddhists, maintains that perception directly apprehends particulars while inference reliably extends knowledge to unperceived but perceptible entities, denying any need for further *pramāṇas*. Against this, the opposing stance holds that certain forms of knowledge—specifically those arising from verbal testimony, analogical comparison, or the cognition of absence—cannot be adequately reconstructed from perception and inference alone, necessitating one or more supplementary instruments.

  Where additional sources are admitted, the autonomy of testimony becomes pivotal. Consider the case of learning about a distant mountain’s fiery nature solely through a trusted speaker’s utterance. One must decide whether this constitutes a unique epistemic transaction grounded in the speaker’s authoritative competence and the hearer’s recognition of that competence, or whether it reduces to an inference: "The speaker is reliable; they assert the mountain is fiery; therefore, it is fiery." The former view, championed by classical Nyāya, treats *śabda* as irreducible, positing a direct, non-inferential grasp of meaning facilitated by linguistic convention and speaker trustworthiness. The latter, advanced by Mīmāṃsakas like Kumārila and certain Buddhists, absorbs testimony into inferential reasoning, arguing that the hearer implicitly relies on premises about the speaker’s veracity and the conventions governing words.

  Similarly, the status of analogical comparison (*upamāna*) demands resolution. Imagine learning the identity of a gavaya (wild ox) by being told it resembles a cow, then later recognizing a gavaya in the forest based on that similarity. Does this involve a distinct cognitive process generating novel knowledge of the relation between name and object? Or does it decompose into perceiving the similarity (perception) and recalling the earlier instruction that entities with such features are called 'gavaya' (inference/testimony)? Classical Nyāya defends the former, insisting *upamāna* uniquely apprehends the name-object correlation via similarity. Opponents, including Cārvākas and many Buddhists, see only a conjunction of perception and memory-driven inference, rendering an independent *pramāṇa* superfluous.

  Finally, the cognition of absence—such as immediately knowing "there is no pot on the ground"—presents a critical juncture. Is this awareness a distinct epistemic achievement requiring its own instrument (*anupalabdhi*), perhaps involving a specific cognitive faculty that directly intuits non-existence? Or is it subsumable under existing means? Classical Nyāya initially treated absence-cognition as a type of inference ("The pot is not perceived where perception is possible; hence, it is absent") or as a perceptual judgment where the absence itself is the object. Navya-Nyāya thinkers, notably Gaṅgeśa, argued this was inadequate; ordinary perception grasps positive entities, while inference requires positive evidence. They posited *anupalabdhi* as a fifth instrument, directly cognizing absence through a unique process triggered by the non-manifestation of an expected object under suitable conditions. Critics, including classical Nyāya adherents prior to Navya refinements and some Mīmāṃsā thinkers, maintained that perception, properly understood, can register absence directly as a relational property of the locus (the ground), or that a refined inference suffices, making a fifth instrument unnecessary.

  Within this logical structure, standard positions emerge. The classical Nyāya view occupies the branch affirming four irreducible sources: perception, inference, testimony, and comparison, treating absence-cognition as a form of inference or perception. Mīmāṃsā reduces testimony to inference while accepting comparison’s autonomy and handling absence within perception or inference. Cārvāka and many Buddhists deny both testimony and comparison as independent, reducing them to perception and inference. Navya-Nyāya introduces a fifth autonomous *pramāṇa* for absence while retaining the classical four. A synthetic stance, maintaining the four-fold label while reinterpreting internal relations, might hold that testimony and comparison *functionally* depend on inference but retain distinct psychological or phenomenological identities worthy of separate classification, or that absence is directly perceived without invoking a novel instrument.

  Certain combinations remain unoccupied. One could theoretically affirm five autonomous sources while denying comparison its independence, but this position finds no historical proponents. The gap likely stems from unattractiveness: adding a fifth instrument for absence while demoting the traditionally accepted comparison appears arbitrary and unmotivated. Similarly, a view reducing testimony to inference while simultaneously elevating absence to a fifth *pramāṇa* (without Navya-Nyāya’s full commitments) is conceivable but unattended, perhaps due to historical contingency or the lack of a clear philosophical driver. Crucially, the branches struggle to distinguish between sophisticated versions of the classical four-fold view and some synthetic reinterpretations regarding absence. If one argues absence is directly perceived *as a distinct ontological category*, this structurally mirrors Navya-Nyāya’s *anupalabdhi* in function while retaining the perception label, creating a near-indistinguishable commitment despite differing terminology. Likewise, a view treating testimony as a unique *type* of inference (e.g., "linguistic inference") blurs the line with reductionism unless the irreducibility of the semantic relation itself is rigorously defended. These points of potential convergence highlight where logical structure, not doctrinal labels, defines the core philosophical commitment.
