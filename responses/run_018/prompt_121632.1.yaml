prompt: |-
  Having retired from a career in biophysics and only recently begun working seriously through philosophy of medicine and metaphysics, I find the standard clinical framing of death unsatisfying: it presents the issue as a binary contest between brain-death and circulatory-death criteria without first specifying what any adequate philosophical theory of human death must actually deliver. Before adjudicating between those two clinical standards, I want the prior conceptual labor done. Write the complete desiderata—what phenomena it must explain, what distinctions it must preserve, what boundary cases it must handle correctly, and what biological results it must not contradict, with the reasoning behind each requirement. In particular, address how the theory treats prolonged somatic integration in brain-dead bodies that nevertheless sustain gestation or homeostatic function; how it distinguishes the irreversible loss of consciousness or personhood from the cessation of the organism as a unified biological whole; and how it accommodates, without collapsing, boundary conditions involving split-brain architecture, anencephalic persistence, or partial neural preservation in which some integrative capacities remain while others are permanently abolished. Specify which of these desiderata are genuinely non-negotiable and which are merely preferences of particular medical-legal camps—for instance, a demand for deterministic physiological markers versus tolerance for probabilistic ones—and flag any pair or subset you suspect is jointly unsatisfiable given current neuroscience or the metaphysics of organisms. I want a committed response, not a neutral taxonomy: take a definite position on which two or three requirements do the heaviest philosophical work, defend that ordering, and indicate precisely which popular clinical criteria fail because they neglect those core demands. Please do not provide bibliographies, reading lists, or citations; I am working without access to external sources and need the conceptual architecture to stand entirely on its own reasoning.
reasoning: |-
  Okay, let me unpack this user's request. They're a retired biophysicist diving into philosophy of medicine/metaphysics, frustrated by clinical death criteria's lack of philosophical grounding. They want desiderata for a theory of human death that addresses somatic integration in brain-dead bodies, distinguishes consciousness loss from organismal cessation, and handles neurological edge cases. 

  Hmm, the real challenge here is balancing biological reality with metaphysical coherence. The user clearly rejects the false binary of brain vs circulatory death debates. Their examples - like brain-dead pregnant women or anencephalic infants - reveal deep concern about mistaking part-failure for whole-organism cessation. 

  I should prioritize three non-negotiables: 
  First, the organism as a unified whole must be central - not consciousness or cells. That immediately eliminates higher-brain theories. 
  Second, the theory must account for somatic integration without a brain. That's why circulatory-only criteria fail - they ignore the brain's role in maintaining the whole. 
  Third, irreversibility must be biological, not technological. This exposes how current "brain death" protocols sometimes conflate recoverability with irreversibility. 

  The trickiest tension is between the first two desiderata. How can we value the brain's integrative role while acknowledging bodies can temporarily maintain functions without it? The key is distinguishing mere subsystem persistence from whole-organism agency. A ventilator isn't integration - it's artificial substitution. 

  For edge cases: split-brains show unity isn't about symmetry; anencephaly proves absence of potential matters more than current function; partial neural preservation tests whether residual fragments constitute "integration" (they don't). 

  Clinically, this makes "brain death" valid only when demonstrating complete, irreversible loss of somatic integration - not just consciousness. Circulatory death standards need modification to account for potential integration recovery during CPR. The user's biophysics background means they'll appreciate this systems-biology perspective. 

  Ultimately, the heaviest lifting comes from the organism-as-unified-whole requirement. Without it, we slide into personhood theories or vitalism. That's why I'll defend it as the keystone - even if it makes pronouncing death messier in some boundary cases.
answer: |-
  Here is a complete set of desiderata for an adequate philosophical theory of human death, prioritizing conceptual rigor over clinical expediency, with explicit rankings and failures of current criteria:

  **Core Non-Negotiable Desiderata (Metaphysical & Biological Foundations):**

  1.  **Cessation of the Organism *as a Whole*:** The theory must identify the *irreversible cessation of the human organism as a single, unified, self-integrating biological entity*. This is the *sine qua non*.
      *   **Reasoning:** Death is fundamentally the cessation of the biological individual. A theory of human death must explain the transition from a living, integrated whole to a disintegrating collection of parts or a corpse. It must capture the loss of the *entity itself*, not merely critical functions.
      *   **Non-Negotiable:** Yes. Failure here reduces death to the loss of a part or function, confusing necessary conditions with sufficient ones.
  2.  **Somatic Integration as the Organism's Work:** The theory must define and require the *irreversible loss of the organism's intrinsic, self-sustaining capacity for somatic integration*. Integration must be the *organism's own activity*, not externally imposed function.
      *   **Reasoning:** The defining characteristic of a living organism is its active maintenance of a complex, interdependent internal milieu against entropy. This integration is the work of the whole *through* its subsystems. External support (ventilators, ECMO) substitutes for, but does not constitute, the organism's own integrative activity.
      *   **Non-Negotiable:** Yes. This distinguishes a living body from a technologically stabilized corpse or a collection of living cells/tissues.
  3.  **Irreversibility Grounded in Biological Capacity, Not Current Technology:** The loss of integration must be *biologically irreversible* – meaning the organism lacks the inherent biological capacity to restore its integrative function, regardless of current medical intervention.
      *   **Reasoning:** Death is a permanent biological state. "Irreversibility" contingent on available technology or resuscitation attempts confuses contingent recoverability with the organism's fundamental incapacity. The theory must look to the organism's intrinsic potential.
      *   **Non-Negotiable:** Yes. Failure leads to definitions of death shifting with medical capabilities.

  **Essential Explanatory & Distinguishing Desiderata:**

  4.  **Explain Prolonged Somatic Function in Brain-Dead Bodies:** The theory must coherently explain how a brain-dead body can exhibit *some* integrated functions (e.g., wound healing, homeostasis, gestation) *without* this constituting the persistence of the organism as a whole.
      *   **Reasoning:** Brain-dead bodies demonstrate subsystem persistence and limited cellular/tissue integration driven by residual physiology or external support. The theory must show why this is not evidence of the whole organism's persistence but rather its *disintegration in progress* or the activity of subsystems no longer under central orchestration.
      *   **Handling:** These functions are subsystem phenomena or passive physiological inertia, not the active, self-sustaining integration performed *by the organism as a unitary agent*. Gestation, for instance, is the fetus developing within a biological environment provided by the mother's *body*, not evidence of the mother's *organismal agency*.
  5.  **Distinguish Irreversible Loss of Consciousness/Personhood from Organismal Death:** The theory must clearly separate the irreversible loss of consciousness, cognition, or personhood (a property of the mind/person) from the cessation of the organism *as a biological whole*.
      *   **Reasoning:** While consciousness depends on brain function, the organism persists biologically even in permanent unconscious states (e.g., permanent vegetative state). Personhood is a psychological/ethical concept; organismal life is a biological one. Conflating them risks vitalism or treating disabled humans as non-living.
      *   **Handling:** The loss of consciousness/personhood, even irreversibly, is the loss of a *critical emergent capacity* of the organism, not necessarily the cessation of the organism itself. The organism may persist biologically without these capacities.
  6.  **Accommodate Boundary Cases Without Collapse:**
      *   **Split-Brain:** The theory must account for the organism remaining unified despite significant disconnection of cerebral hemispheres, potentially hosting dissociated streams of consciousness.
      *   **Handling:** The brainstem and subcortical structures maintain somatic integration. The unity of the *organism* is not synonymous with the unity of *consciousness*. Split-brain patients remain single biological entities.
      *   **Anencephaly:** The theory must explain why anencephalic infants, lacking most forebrain structures but possessing a brainstem, are initially living organisms despite lacking the potential for consciousness.
      *   **Handling:** Anencephalic infants possess (often transiently) intrinsic, self-sustaining somatic integration orchestrated by the brainstem. They are severely compromised organisms, not corpses. Their death occurs when this minimal integration irreversibly fails.
      *   **Partial Neural Preservation:** The theory must determine when residual neural activity (e.g., isolated hypothalamic function, spinal reflexes) is insufficient to constitute the organism's integrative work.
      *   **Handling:** Mere isolated reflexes or hormone secretion are subsystem phenomena, not the active, coordinated integration defining the whole organism. The critical question is whether *any* neural structure capable of *central* coordination of vital somatic functions persists and is functional.

  **Constraints & Practical Considerations (Potentially Negotiable Preferences):**

  7.  **Consistency with Fundamental Biology:** The theory must not contradict established biological principles (e.g., cell death vs. organismal death, metabolism vs. integration).
      *   **Negotiability:** Low. Contradicting core biology renders the theory incoherent.
  8.  **Tolerance for Probabilistic vs. Deterministic Markers:** The theory should permit reliance on probabilistic clinical tests to *diagnose* the fulfillment of its criteria (irreversible loss of integration), acknowledging epistemological limits, but the *definition* itself must be deterministic in principle (the state either exists or does not).
      *   **Negotiability:** Moderate. Some camps demand absolute certainty (impossible biologically), others accept high probability. The core theory defines the state; diagnosis is a separate, pragmatic challenge.
  9.  **Practical Discernibility:** The criteria derived from the theory should be practically discernible with reasonable confidence using available medical tools.
      *   **Negotiability:** Higher. This is a pragmatic constraint on application, not a core part of the philosophical theory. Perfect discernibility may be impossible.

  **Suspected Joint Unsatisfiability:**

  *   **Simultaneous Perfect Discernibility & Tolerance for All Biological Edge Cases:** Achieving absolute certainty in diagnosing the irreversible loss of integration in *all* conceivable boundary cases (especially profound global brain injuries with minimal residual function) using current technology may be fundamentally impossible. Neuroscience may not yet provide tools to perfectly distinguish irreversible loss of integrative capacity from its profound but potentially recoverable suppression in every instance.

  **Heaviest Philosophical Work & Defense of Ordering:**

  1.  **Cessation of the Organism as a Whole (Desideratum 1):** This does the absolute heaviest lifting. It anchors death in the *entity* that dies – the biological individual. Without this foundation, discussions devolve into arguments about which *function* (consciousness, circulation, integration) is most important, mistaking parts for the whole. This requirement forces the theory to answer the fundamental metaphysical question: *What constitutes the persistence of this specific living human being?* All other desiderata flow from understanding what it means for *this entity* to cease existing.
  2.  **Somatic Integration as the Organism's Work (Desideratum 2):** This provides the *criterion* for identifying the cessation of the organism. It defines the essential life-sustaining *activity* of the whole organism. Distinguishing intrinsic integration from externally supported subsystem function is crucial for rejecting mere cellular life or technologically sustained physiology as evidence of organismal persistence. This bridges the metaphysics of the organism (1) with biological function.
  3.  **Irreversibility Grounded in Biological Capacity (Desideratum 3):** This ensures the theory describes a genuine biological state of being dead, not a temporary state of functional depression dependent on current medical limitations. It prevents the definition of death from being a moving target tied to technology.

  **Defense of Ordering:** Desideratum 1 defines *what* dies. Desideratum 2 defines *how we know* it has died (by the irreversible loss of its essential self-integrating activity). Desideratum 3 ensures this loss is *final* in a biological sense. The irreversibility (3) of the loss of integration (2) *constitutes* the cessation of the organism (1). They form a logically interdependent triad where 1 is the ontological foundation, 2 is the functional criterion, and 3 is the modal qualifier. Consciousness (5) is a critical emergent property but not the organism itself. Practical discernibility (9) is secondary to getting the ontology right.

  **Failures of Current Clinical Criteria:**

  *   **"Brain Death" (Whole-Brain Criteria):**
      *   **Failure wrt Desideratum 2:** It often focuses on *testing* for absent brain functions (reflexes, apnea) without rigorously demonstrating the *irreversible loss of the organism's capacity for self-integration*. Crucially, it struggles conceptually with cases where some somatic integration *persists* without brain function (Desideratum 4). It risks conflating the *means* of integration (the brain) with the *integrative work* itself. If integration persists significantly without the brain, the rationale weakens.
      *   **Failure wrt Desideratum 3:** The irreversibility determination can be protocol-dependent and potentially vulnerable to future technological advances (e.g., novel neuroprotective strategies or artificial brain substitutes), blurring the line between biological irreversibility and current irrecoverability.
  *   **Circulatory-Respiratory Criteria:**
      *   **Failure wrt Desideratum 1 & 2:** It mistakes the failure of a critical *subsystem* (heart/lungs) for the cessation of the organism *as a whole*. The organism *as an integrative whole* may persist for minutes after circulatory arrest (e.g., during potentially reversible cardiac arrest where CPR restores integration). It fails to account for scenarios where circulatory function is artificially maintained in a brain-dead body where organismal integration has ceased (Desideratum 4).
      *   **Failure wrt Desideratum 6c:** It cannot handle cases where circulatory function is maintained artificially despite the irreversible loss of all neural function necessary for integration.

  **Committed Position:** An adequate theory must center on the **irreversible loss of the organism's intrinsic capacity for somatic self-integration** as the marker of its cessation as a unified whole. Current "brain death" protocols approximate this but lack sufficient conceptual rigor regarding somatic persistence and biological irreversibility. Circulatory criteria fail fundamentally by targeting a subsystem, not the organism's integrative wholeness. The hardest cases (profound but incomplete brain injury) expose the tension between the demand for a clear ontological threshold (Desideratum 1) and the practical/biological fuzziness of discerning the *complete and irreversible* loss of integrative capacity (Desiderata 2 & 3) in the nervous system's complex failure modes.
