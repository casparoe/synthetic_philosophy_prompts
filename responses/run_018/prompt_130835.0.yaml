prompt: |-
  I serve on the board of the Meridian Public Heritage Foundation. By next month's meeting we must approve, reject, or approve with conditions the design for a permanent exhibit on the 1892 Foundry Collapse: company logs and an official inquest attribute the disaster to accidental boiler failure, yet local descendants maintain an unbroken oral tradition that management deliberately caused the explosion to break an emerging union and demand the exhibit center that account. Our charter requires both 'archival fidelity' and 'stakeholder dignity' without defining either. Draft the brief opinion I will circulate: recommend a concrete course of action with a specific time frame, treat the descendants' claim seriously rather than dismissing it as misinformation, and address the tension between what I call 'mnemonic sovereignty' — a community's authoritative claim over its own past — and 'archival monism,' without treating either as obviously correct, including the strongest reason for the side you reject. Present the response as exactly five numbered items, each one or two sentences, with no introduction or conclusion.
reasoning: |-
  Okay, the user is on the board of the Meridian Public Heritage Foundation and needs to draft a brief opinion for an upcoming meeting about a controversial exhibit on the 1892 Foundry Collapse. There's tension between archival records (which say it was an accident) and oral tradition from descendants (who believe it was deliberate sabotage against a union). The charter requires both 'archival fidelity' and 'stakeholder dignity'—terms that aren't defined, so I need to interpret them carefully.

  The user wants a concrete recommendation with a time frame, serious treatment of the descendants' claims, and a balanced discussion of 'mnemonic sovereignty' (community authority over its past) versus 'archival monism' (one official truth). The response must be exactly five numbered items, one or two sentences each, no intro or conclusion. 

  Hmm, this is tricky. The descendants' oral tradition challenges the official record, and dismissing it could violate 'stakeholder dignity,' but ignoring archives might breach 'fidelity.' I should propose a solution that honors both without taking sides. 

  For the recommendation: A dual-track exhibit makes sense—one section for the archival view, another for the oral tradition—with clear labeling to distinguish them. Six months for development seems reasonable; it's enough time for research but urgent enough to show commitment. 

  Now, addressing the tension: 'Mnemonic sovereignty' is vital because marginalized voices often preserve truths excluded from records, but 'archival monism' has strength too—written documents provide verifiable anchors. I'll note the strongest counterargument: oral histories can evolve, while archives may reflect power biases. 

  The user's deeper need might be avoiding board conflict while upholding ethical standards. They probably want to validate the descendants without alienating traditional historians. My response should model nuanced fairness. 

  I'll structure it as: (1) Action recommendation, (2) Why descendants' claims matter, (3) Why archives matter, (4) Key tension analysis, (5) Implementation safeguard. Each point crisp and balanced. 

  Finally, I'll avoid academic jargon where possible—'mnemonic sovereignty' is necessary per the query, but I'll explain it accessibly. The tone should be diplomatic but decisive.
answer: |-
  Here is the draft opinion in the requested format:

  1.  I recommend approving the exhibit design on the condition it incorporates a dual-track narrative structure within six months: one section presenting the archival/inquest findings, and a distinct section presenting the descendants' oral tradition regarding deliberate sabotage, with equal prominence and clear contextualization.
  2.  The descendants' claim must be treated seriously as an expression of enduring community trauma and mnemonic sovereignty; dismissing oral tradition upheld for generations as mere misinformation violates stakeholder dignity and ignores potential historical silences in the official record.
  3.  While archival monism offers crucial verifiable evidence from the period, its strongest claim is providing a contemporaneous, documented perspective; however, we must acknowledge archives can reflect institutional bias and exclude marginalized voices, making them an incomplete authority.
  4.  The core tension lies in balancing the community's sovereign right to define its painful past (mnemonic sovereignty) against the foundation's duty to archival fidelity based on extant documents; neither principle is inherently superior, as monism risks historical erasure while sovereignty risks overlooking documented evidence.
  5.  To resolve this, mandate explicit labeling clarifying the evidentiary basis for each narrative track and forming a descendants/advisory panel by month two to collaborate on faithfully representing their tradition within the exhibit structure.
