answer: |-
  ### Prioritized Research Agenda for Low-Impact AI Behavior Without Value Specification

  I propose a prioritized list of unresolved issues for a two-year research group, focusing on dependency, tractability with current tools (causal inference, game theory, distributional robustness), and practical relevance to real-world deployment. The goal is to define "low-impact" behavior without a complete value specification, avoiding dead ends and overrated approaches. I address the specific questions about counterfactual stability, epistemic side-effects, worst-case/average-case separation, and conceptual coherence.

  The prioritization is based on:
  - **Dependency**: Issues that are prerequisites for others must be resolved first.
  - **Tractability**: Feasibility using existing formal tools.
  - **Practical Relevance**: Likelihood of informing deployment constraints; dead ends are those requiring value judgments or full value ordering.
  - **Reordering Trigger**: Results or observations that would necessitate reprioritization.

  **Key Insights Driving Prioritization:**
  - The core challenge is that *any* impact metric risks smuggling in value judgments, as seen in classical approaches (world-state distance, conservative action, proxy penalties). Without value specification, we must identify *value-neutral invariants*—properties of the world that, if preserved, avoid harm across a broad range of values (e.g., preserving resources for future value realization or minimizing irreversible changes).
  - Counterfactual stability and epistemic side-effects are **genuinely distinct research paths**:
    - **Counterfactual stability** focuses on causal influence (e.g., "Does the agent alter outcomes relative to a world where it was never activated?"). It requires defining a baseline counterfactual but avoids direct value judgments by measuring deviation from inaction.
    - **Epistemic side-effects** focus on informational influence (e.g., "Does the agent reduce the ability of others to learn, regardless of physical changes?"). It introduces a novel axis by targeting knowledge degradation (e.g., via information destruction or obfuscation), which can occur without physical changes and may be value-neutral if tied to entropy or information capacity.
    - While both share the challenge of baseline dependence, epistemic side-effects are distinct because they address information-theoretic harms orthogonal to physical state changes. They are not renamings but complementary paths.
  - Worst-case and average-case guarantees **can be partially separated without full value ordering** using distributional robustness (e.g., ambiguity sets over plausible value functions) or physical proxies (e.g., energy consumption). However, this requires a bounded set of "value-relevant variables" (e.g., resource availability) to avoid collapse into value specification.
  - The entire project is **conceptually coherent only if** we can define a *necessary condition for harm*: a measurable invariant that, if violated, implies harm under most plausible value systems (e.g., irreversible resource depletion). Without this, the project reduces to value-laden guesswork.

  **Ranked Unresolved Issues (with Defense and Trade-offs):**

  1. **Conceptual Coherence Conditions: Minimal Assumptions for Value-Neutral Invariants**  
     - **Description**: Identify formal conditions under which low-impact behavior can be defined without value specification. Focus on necessary invariants (e.g., "preserve the capacity for future value realization" via resource conservation or avoidance of irreversible changes).  
     - **Dependency**: Must be resolved first. Without coherence, other work is futile.  
     - **Tractability**: High with current tools. Use causal inference to model counterfactual preservation of invariants (e.g., via structural causal models) and game theory to define equilibria where invariants hold. Distributional robustness can bound deviations.  
     - **Practical Relevance**: Critical. If no invariants exist, the project is a dead end; if they do, they enable deployment constraints. Dead ends include approaches assuming value ordering.  
     - **Trade-off**: Theoretical work may delay applied research, but it prevents wasted effort.  

  2. **Counterfactual Stability Operationalization: Defining and Computing Baselines**  
     - **Description**: Formalize how to generate a baseline "no-agent" counterfactual trajectory (e.g., using causal models to simulate world evolution without the agent) and measure deviations.  
     - **Dependency**: Depends on coherence (Issue 1) but must precede other impact metrics. Counterfactuals underpin classical approaches and epistemic side-effects.  
     - **Tractability**: High. Leverage causal inference (e.g., do-calculus, SCMs) and game-theoretic equilibria (e.g., defining baselines as Nash equilibria without the agent). Distributional robustness can handle uncertainty.  
     - **Practical Relevance**: High for deployment. Baselines are used in real-world systems (e.g., reinforcement learning with penalties). Dead ends involve value-dependent baselines.  
     - **Trade-off**: Computationally intensive; may require simplifications for complex environments.  

  3. **Epistemic Side-Effects Formalization: Measuring Informational Impact**  
     - **Description**: Develop metrics for changes in "knowledge capacity" (e.g., information entropy, mutual information between observers and state variables) independent of physical state.  
     - **Dependency**: Requires counterfactual baselines (Issue 2) to define epistemic starting points. Distinct from stability but benefits from its tools.  
     - **Tractability**: Medium. Use information theory (e.g., entropy, KL divergence) and causal inference to model information flow. Game theory can model strategic observers. Less mature than counterfactual tools.  
     - **Practical Relevance**: High for modern AI (e.g., preventing misinformation or data poisoning). Unique path; not a renaming. Dead ends include approaches conflating physical and epistemic change.  
     - **Trade-off**: Novelty increases risk but addresses gaps in classical approaches.  

  4. **Worst-Case vs. Average-Case Separation with Ambiguity Sets**  
     - **Description**: Explore whether worst-case impact (e.g., catastrophic harm) can be bounded separately from average-case using ambiguity sets over value-relevant variables (e.g., "minimize maximum resource depletion"), without full ordering.  
     - **Dependency**: Requires invariants (Issue 1) and baselines (Issue 2) to define "impact."  
     - **Tractability**: Medium. Distributional robustness (e.g., minimax optimization over ambiguity sets) and game theory (adversarial analysis) are suitable. Value ordering remains a barrier if sets are unbounded.  
     - **Practical Relevance**: High for safe deployment. Worst-case bounds are used in safety-critical systems (e.g., autonomous vehicles). Overrated if it requires implicit value specification.  
     - **Trade-off**: Separating cases may lead to overly conservative worst-case bounds.  

  5. **Reformulation of Classical Approaches with Value-Neutral Proxies**  
     - **Description**: Revisit world-state distance, conservative action, and proxy penalties using insights from Issues 1–4 to replace value-laden elements with invariants or counterfactuals.  
     - **Dependency**: Depends on all prior issues.  
     - **Tractability**: High. Apply causal inference (e.g., for state distance) and game theory (e.g., reference classes as equilibria).  
     - **Practical Relevance**: Medium. Classical approaches are industry standards but overrated without value-neutral reformulation.  
     - **Trade-off**: Lower priority due to known flaws; only worthwhile if prior issues succeed.  

  **Dead Ends and Overrated Approaches:**  
  - **Dead Ends**: Any method requiring implicit value judgments (e.g., "reference classes" of actions that assume human consensus) or full value ordering.  
  - **Overrated**: Impact penalties scaled by learned proxy preferences—these often encode biases and don't resolve the value-smuggling problem.  

  **Reordering Triggers:**  
  - **If Issue 1 (coherence) fails** (e.g., proof that no value-neutral invariants exist), deprioritize all except Issue 4 (worst-case separation) for harm mitigation. Shift to containment strategies.  
  - **If Issue 2 (counterfactuals) is intractable** (e.g., no feasible baseline in stochastic environments), prioritize Issue 3 (epistemic effects) as an alternative path.  
  - **If epistemic side-effects show high practical promise** (e.g., empirical success in preserving knowledge in ML systems), move Issue 3 to Priority 2.  

  This ordering maximizes efficiency: foundational coherence enables robust baselines, which support novel epistemic and worst-case work, culminating in classical reformulation. By focusing on invariants and existing tools, the group can make tangible progress in two years without value specification.
