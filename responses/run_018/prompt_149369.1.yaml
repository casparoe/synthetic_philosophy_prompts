  The user wants to distinguish this from strategic hypocrisy. Hypocrisy is about saying one thing and doing another, but here it's more about systemic avoidance of obligations. Selective humanitarian outrage is similar but maybe too vague. The key is the structural incentive to avoid triggering legal obligations under the Genocide Convention.

  The term "jurisdictional avoidance" comes to mind. It emphasizes how the application of the label is influenced by the legal consequences. Another angle is "sovereignty shield" or "membership exemption," highlighting how integrated states are protected. The user might need a new term since existing ones don't capture this exact dynamic.

  Boundary cases are important for clarity. The Rwandan genocide was labeled quickly because the state collapsed, whereas China's actions in Xinjiang aren't called genocide despite evidence. Turkey's Armenian genocide recognition is slow due to its NATO membership. These examples show the pattern.

