answer: |-
  Your observation identifies a crucial structural flaw in the implementation of international legal norms, particularly the Genocide Convention. While there isn't a single, universally accepted term *exclusively* capturing *this precise dynamic* of jurisdictional consequences shaping descriptive application, several closely related concepts and frameworks exist within critical genocide studies, critical international law, and sociological institutionalism. Here's a breakdown:

  1.  **Closely Related Established Concepts:**
      *   **"Crime of Crimes" / "Genocide Taboo":** The concept of genocide as the "crime of crimes" creates a powerful taboo around its application. As Dirk Moses and others argue, this very gravity creates a reluctance to apply it, *especially when it would trigger inconvenient obligations towards powerful actors*. Your observation specifies *when* this taboo is overcome (against pariahs/collapsed states) and when it's rigidly maintained (for integrated members).
      *   **"Genocide Recognition Politics" / "Genocide Attribution":** This broad field examines the complex political, diplomatic, and historical factors influencing whether an event is labeled genocide. Your analysis provides a specific structural *pattern* within this politics: the *systemic bias* based on the perpetrator state's integration into the international order *because of the jurisdictional trigger*.
      *   **Dirk Moses' "Doctrine of the Standard Case":** Moses argues that a rigid, Holocaust-derived template ("standard case") dominates legal and popular understanding of genocide, often excluding colonial or counter-insurgency violence. While related, your focus is less on the *definitional* exclusion and more on the *jurisdictional avoidance* based on *who* commits the act within the current system.
      *   **"Selective Legalism" (in International Relations/International Law):** This describes how international law is applied inconsistently based on power and interest. Your dynamic is a specific *subset* of selective legalism, focused on the *avoidance of specific, costly legal obligations* (Genocide Convention duties) by strategically *withholding the descriptive label* that activates them for certain perpetrators.
      *   **"Sovereignty as Shield" (Critical International Law):** This perspective highlights how the principle of state sovereignty is often used by powerful states to shield themselves from accountability. Your dynamic shows how the *withholding* of the genocide label functions as a shield *for integrated states*, while its *application* to pariahs reinforces the system's authority.

  2.  **Proposing a Precise Conceptual Term:**
      Given the lack of a perfect single term, and to capture the core mechanism you identify – **the avoidance of triggering specific legal obligations (jurisdictional consequences) dictating the application/non-application of the descriptive category (genocide) based on the perpetrator's status within the international system** – I propose:

      **Jurisdictional Avoidance Bias (JAB) in Genocide Labelling**

      Or, emphasizing the systemic nature:

      **Structural Jurisdictional Avoidance in the Genocide Regime**

      **Core Definition:** The systematic tendency within the international legal-political system to apply the label "genocide" primarily to atrocities committed by states outside of or marginalized within the prevailing international order (pariahs, collapsed states), while categorizing structurally comparable atrocities committed by integrated, functioning member states under alternative labels (civil war, counter-terrorism, ethnic cleansing), specifically to avoid activating the mandatory intervention and accountability obligations prescribed by the Genocide Convention.

  3.  **Delimiting from Strategic Hypocrisy & Selective Outrage:**
      While related, JAB is distinct:
      *   **Strategic Hypocrisy:** Focuses on the *contradiction* between professed values/beliefs and actions. JAB is about *systemic institutional behavior*. Hypocrisy is the *symptom* (saying "never again" but not acting); JAB describes the underlying *structural mechanism enabling the inaction* (avoiding the label that forces action). Hypocrisy can be individual or state-level; JAB is systemic.
      *   **Selective Humanitarian Outrage:** Focuses on the *emotional/political response* (outrage) being uneven. JAB focuses on the *categorical/jurisdictional mechanism* (label application/withholding) that *precedes and shapes* the potential for outrage and action. Outrage might exist even without the genocide label (e.g., Syria), but JAB specifically prevents the activation of *legal obligations* tied to that label.

  4.  **Boundary Cases for Conceptual Clarity:**
      *   **Clear Case of JAB:**
          *   **Rwanda (1994):** Rapid labelling as genocide (by UN, US, others *during* the events) partly because the state had effectively collapsed, perpetrators were clearly "outsiders" to the functional international order at that moment, and the obligations (while tragically shirked) were clearly triggered *conceptually* by the label's swift acceptance.
          *   **Sudan (Darfur, 2000s):** Relatively swift application of "genocide" label by the US and others to a regime already widely considered a pariah (state sponsor of terrorism, etc.).
      *   **Clear Case *NOT* Primarily JAB (Evidence/Politics Dominant):**
          *   **Bosnia (1992-1995):** Initial reluctance stemmed significantly from genuine definitional debates (was it genocide or ethnic cleansing?), complex battlefield realities, and intense geopolitical maneuvering by involved states (Serbia's position, Russian support). While sovereignty played a role, the *jurisdictional trigger avoidance* was less clearly the *primary* structural driver compared to the evidence/politics mix. The eventual ICTY rulings reflect this complexity.
          *   **Early Stages of Atrocities:** Initial reluctance to label *any* ongoing event genocide, even against pariahs, due to evidentiary thresholds, diplomatic caution, or hopes for containment (e.g., initial phases of ISIS atrocities).
      *   **Ambiguous Case Highlighting JAB's Core (Integrated State Avoidance):**
          *   **China (Xinjiang):** Overwhelming evidence points to acts falling under Article II of the Genocide Convention (cultural destruction, prevention of births, severe mental harm targeting Uyghurs). However, labelling by major powers/institutions as genocide is minimal or non-existent. China's deep integration (P5 Security Council member, major economic power) creates immense structural pressure *against* applying the label and triggering Convention obligations. Alternative frameworks ("counter-terrorism," "human rights abuses") are preferred. *This exemplifies JAB: comparable acts, but label withheld specifically to avoid legal/political consequences against a core member.*
          *   **Turkey (Armenian Genocide Recognition):** Decades-long resistance by powerful NATO allies (especially the US) to formally recognize the historical event as genocide, despite overwhelming scholarly consensus. Motivated heavily by strategic alliance concerns with an integrated member state, avoiding the political/diplomatic fallout and potential (though non-retroactive) moral/political obligations recognition implies. *Shows the *label itself* being withheld from history due to the *present-day* status of the perpetrator state.*
      *   **Counter-Case Challenging JAB (But Reinforcing the Pattern):**
          *   **Myanmar (Rohingya, 2017):** Relatively swift application of "genocide" label by US, Canada, Gambia (ICJ case) despite Myanmar not being a complete pariah. This *seems* counter to JAB. However, factors include: Myanmar's relative *marginalization* compared to major powers (weak economy, recent pariah status under junta, limited strategic importance to the core West); clear evidence amplified by refugee crisis; and crucially, *Gambia* (a small state) bringing the ICJ case, *not* a major power triggering obligations *for themselves*. The major powers' support for the *label* allows moral positioning *without* directly triggering their own costly Article I obligations to "prevent and punish" in a robust way. This highlights how JAB operates most rigidly for actions demanding *direct, costly action by core states against other core states*.

  **Conclusion:**

  Your observation powerfully captures **"Structural Jurisdictional Avoidance" within the Genocide Convention regime.** This is the systemic tendency where the *potential legal and political consequences* of applying the "genocide" label (specifically, the obligations under Articles I, III, IV, V, VI, VIII, and IX) actively shape and constrain its *descriptive application*, resulting in a systematic bias: the label is readily applied to atrocities by states already outside the system's core ("safe targets"), but withheld for structurally similar acts by integrated member states to protect systemic stability and avoid costly obligations. While related to hypocrisy and selective outrage, JAB is distinct in its focus on the *categorical/jurisdictional mechanism* inherent to the legal framework itself as the driver of selective application. The boundary cases demonstrate that while evidence and politics are always factors, JAB manifests most clearly when the *avoidance of triggering specific legal duties* becomes the dominant structural logic for withholding the label from integrated perpetrators. This concept deserves rigorous development within critical genocide studies and the sociology of international law.
