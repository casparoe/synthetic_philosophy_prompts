  This active shift's a treacherous **map**."

  But others shrug: "It's just a passive **map**,
  A relabeling, a harmless **gauge**.
  Names change for places in the **hole**,
  New coordinates for each old **point**.
  The emptiness remains the **vacuum**,
  No shift in true **identity**."

  "Just names are changed, no deep **identity**
  Is lost," they soothe, "it's how we **map**.
  The field equations hold, the **vacuum**
  Obeys its laws through any **gauge**.
  The physics stays at every **point**,
  Unchanged within the shifting **hole**."

  The panicked cry: "But look within the **hole**!
  That metric shift, a ghostly **identity**
  Imposed. Does matter *feel* that **point**
  Transformed? This isn't just a **map**!
  It moves the field! This active **gauge**
  Threatens the calm, empty **vacuum**!"

  "The equations hold the **vacuum** fast,"
  The calm reply, "inside the **hole**.
  This freedom is the theory's **gauge**,
  A redundancy, not lost **identity**.
  Confusing *chart* with world's the **map**
  That conjures ghosts at every **point**."

  ***

  So *point* and *map*: does matter shift, or **gauge**?
  The *vacuum* holds, true laws survive the **hole**.
  Is difference real, or just a label's **identity**?

  ***

  The envoi coils, where tensions meet but don't dissolve:
  A ripple (gravity's wave?) meets smoothed coordinate resolve.

