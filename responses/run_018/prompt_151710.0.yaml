  First, in the retirement savings case, they distinguish between discounting goods (acceptable at 3%) and discounting welfare (unacceptable at 50%). This suggests they value present resources but see future well-being as equally important. Then in climate policy, they reject a high discount rate for future people but accept more spending on current cancer vs. future asteroid prevention. Here, they might be acknowledging practical constraints while affirming moral equality across time.

  The commitment cases are trickier. Allowing career changes but opposing preference-erasing drugs points to respecting autonomy over time. Diachronic sovereignty comes into play—future selves should have a say. Binding contracts raise the issue of distinguishing genuine preference shifts from impulsivity. The job case where current and future selves conflict highlights the tension between neutrality and present decision-making power.

  The user's underlying struggle is balancing moral consistency with practical realities. They might need a framework that accommodates both equality of welfare across time and pragmatic autonomy. For the infrastructure question, the principle would support building it only if resources are sufficient and it doesn't harm current welfare. The key is maintaining welfare neutrality while allowing autonomy within reasonable bounds.

  Putting this together, the core principle combines welfare temporal neutrality (equal moral weight across time) with constrained autonomy (present decisions can prioritize but can't harm future selves). Goods can be discounted for practical reasons like inflation, but not welfare. This approach saves most of their verdicts, except possibly the asteroid case, which might require accepting some discounting due to uncertainty. For the job dilemma, the advice is to weigh both selves equally but allow the present self to decide unless future harm is severe. The infrastructure case gets a conditional yes if current generations aren't deprived. The user's intuitions are largely consistent, needing only minor adjustments for pragmatic limits in long-term planning.
answer: |-
  Here's a breakdown based on a coherent principle reconciling most of your intuitions:

  **The Principle and its Parts**

  The core principle is **Welfare Temporal Neutrality with Constrained Autonomy and a Goods/Welfare Distinction**. It has three key components:

  1.  **Welfare Temporal Neutrality:** The fundamental moral value of well-being (welfare, happiness, preference satisfaction) carries equal weight regardless of *when* it occurs. Discounting welfare purely based on temporal distance (pure time preference) is irrational for a rational agent considering their *whole* life and immoral for social policy impacting distinct future persons. A unit of suffering or happiness in 2100 matters morally as much as an identical unit today.
  2.  **Constrained Autonomy/Respect for Diachronic Sovereignty:** The agent *at each point in time* has legitimate authority over their life and decisions *at that time*. This includes the right to change preferences and make commitments binding on future selves. However, this autonomy is constrained: the *present* self cannot *deliberately harm* or *unreasonably constrain* the future self's capacity for welfare or autonomy. Actions like preference-erasing drugs solely to escape future regret violate this constraint by undermining the future self's sovereignty. Similarly, binding commitments are legitimate tools for self-governance across time, but mechanisms for breaking them should respect the distinction between genuine preference evolution and impulsive override.
  3.  **Goods/Welfare Distinction & Pragmatic Discounting:** While welfare itself shouldn't be discounted, the *resources* (goods, money) used to achieve welfare often can be discounted for purely practical, non-moral reasons:
      *   **Productivity/Investment Returns:** Money now can be invested to create more resources later ($1000 now could become >$1030 next year).
      *   **Risk/Uncertainty:** The further in the future, the greater the uncertainty about *whether* the welfare will materialize (will I be alive? will the asteroid strike happen?).
      *   **Changing Circumstances/Technology:** Future generations might be richer or have better tech to solve problems (relevant to asteroid prevention vs. cancer).
      *   **Pure Impatience (Limited Role):** As a psychological reality, moderate impatience for *consumption* can be a practical factor in *personal* resource allocation, but it doesn't justify discounting the *moral value* of future welfare.

  **Which Verdicts Survive and Which Break**

  *   **Survive:** Retirement Savings (moderate goods discounting OK, heavy welfare discounting irrational/immoral), Climate Policy (near-zero welfare discounting morally required), Preference Drift (autonomy allows change), Binding Contracts (legitimate autonomy tool, respect for future reasons key). Your asteroid vs. cancer intuition also largely survives under pragmatic discounting (extreme uncertainty/tech change for the distant asteroid).
  *   **Breaks/Minor Tweak:** The asteroid case might require accepting *some* discounting based on extreme uncertainty (probability the strike even happens/tech solutions emerging) rather than *purely* temporal distance. Your strong "not literally zero for everything" might need softening to "near-zero plus unavoidable uncertainty/tech-change adjustments." The preference-erasing drug verdict survives strongly under the autonomy constraint (it's an attack on future sovereignty).

  **The Torn Case and the Future-Only Infrastructure Case**

  *   **The Job Case:** Welfare Temporal Neutrality demands you give *equal weight* to the projected welfare of both your current and future self. You shouldn't discount the future self's misery just because it's later. However, Constrained Autonomy recognizes your *present* self as the legitimate decider. The key constraint: your decision shouldn't *deliberately harm* the future self. Here, taking the job *might* cause harm (misery). The principle suggests:
      1.  **Estimate Welfare Impacts:** How much current welfare gain (from money) vs. how much future welfare loss (from hating work)? Be honest.
      2.  **Seek Compromise/Avoid Severe Harm:** Can you take the job *temporarily*? Is the future misery severe and likely? If the future harm is severe and the current gain is purely hedonic (not essential), Constrained Autonomy likely *forbids* taking the job – your present self can't inflict severe harm. If the harm is moderate and the current gain is significant/sustained (e.g., paying off crippling debt), autonomy might allow it, recognizing the future self's capacity to adapt or change jobs later. **Bottom Line:** Don't discount future misery. Weigh welfare equally. Autonomy allows the choice *unless* it constitutes severe, avoidable harm to your future self. If the misery projection is severe, don't take the job.
  *   **Future-Only Infrastructure:** Welfare Temporal Neutrality dictates that the well-being of those future people matters *just as much* as the well-being of people alive today. Therefore, *if* the infrastructure project creates significant net welfare for those future people, and *if* the resource cost to the current generation is manageable without causing significant harm to *their* welfare (e.g., slight tax increase for essentials, not starvation), then **yes, the government should build it.** Discounting their welfare purely because they exist later is immoral. Pragmatic discounting (risk of project obsolescence, uncertainty about future needs) applies but shouldn't be conflated with pure time preference. The burden is on opponents to show the cost *harms* current welfare or the benefits are too uncertain/inefficient – not just that beneficiaries are future.

  **Bottom Line**

  Your intuitions are largely consistent with **Welfare Temporal Neutrality plus Constrained Autonomy plus a Goods/Welfare Distinction.** Discounting *welfare* purely across time is irrational for the whole self and immoral across generations. Discounting *goods* for practical reasons (investment, risk, uncertainty) is acceptable. Respect the autonomy of your present and future selves, but don't let present autonomy deliberately inflict severe harm on your future self or future generations. For the job: weigh welfare equally and avoid severe future harm. For future infrastructure: build it if it creates real welfare and current costs are manageable without harm. You only need minor tweaks regarding extreme long-term uncertainty (asteroid) and the definition of "severe harm" in personal trade-offs.
