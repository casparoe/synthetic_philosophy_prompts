prompt: |-
  I'm taking this course on intertemporal ethics and we've been fighting about pure time preference — whether it's rational or moral to care less about the future just because its future. I have these gut verdicts and I can't tell if there's one principle behind them or I'm just being inconsistent, so I want to see what you think.

  Case one: saving for retirement. I think it's totally rational to prefer $1000 now over $1030 in a year, like a 3% discount rate on goods. But if someone discounts there own happiness next year at 50%, I think they're treating there future self as a stranger — that's not rational, it's a failure of self-care. So moderate discounting of goods is okay, heavy discounting of welfare is wrong?

  Case two: climate policy. I feel strongly that we shouldn't apply a 5% social discount rate to climate damages in 2100 — people then aren't less important just because they're later. But I also think it's fine that we spend way more curing cancer now than preventing an asteroid strike in 400 years, even if the risk is real. So near-zero for climate, but not literally zero for everything?

  Case three: personal commitments and preference drift. I think it's okay to change my mind about my career — deciding at 30 that I don't want the path I picked at 20. But I also think there's something wrong with taking a drug that wipes my future preferences so I won't regret breaking commitments. The outcome might be the same, but the process matters? There's this idea of diachronic sovereignty — my future self should have a vote, but not just be overridden by present impulse.

  Case four: binding contracts across time. If I sign a savings contract now knowing I'll want to break it later, should I be able to? I think yes, but only if my future reasons are genuine, not just impulsive. But then what's the line between genuine change and impulsive override? I'm not sure.

  Case five, the one I'm torn on: there's a job that pays 40% more but involves work I think I'll hate in five years. My current self wants the money, my projected future self wants meaning. If pure time preference demands temporal neutrality for welfare, shouldn't I weight them equally and take the job? Or does the fact that I'm the decider right now break the symmetry?

  So is there a coherent principle — maybe temporal neutrality for welfare plus autonomy constraints plus a goods/welfare distinction — that saves most of these? Or am I running two incompatible rules? Please tell me which verdict I'd have to drop for simplicity, and what your best principle predicts for the job case and for one I haven't listed: should a government build infrastructure that only benefits people after everyone currently alive is dead?

  Please organize your answer like this: "The principle and its parts" (about 2 paragraphs), "Which verdicts survive and which break" (1 paragraph), "The torn case and the future-only infrastructure case" (1 paragraph), and "Bottom line" (a few sentences).
