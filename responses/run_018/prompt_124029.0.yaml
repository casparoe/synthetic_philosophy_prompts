  Im taking this philosophy of science module and we've been given an old extract to read — Henri Poincaré, Science and Hypothesis, 1902. There's this bit where he talks about determinism and chance, and I'm struggling to parse exactly what he's committing to. He basically describes a situation where an extremely tiny difference in initial conditions — he uses the example of a comet being defelcted by a millimetre — leads to a completely different trajectory, and then he says that in practice we can never measure that precisely, so we call the outcome chance. But he also insists that if we had perfect knowledge, determinism would still hold. I think he's trying to save determinism by making it purely theoretical, but I'm not sure if that's consistent with his other claim that the distinction between chance and determinism is just a matter of our ignorance. Is he actually defending determinism here, or is he showing that it's empty?

  To make it weirder, my tutor mentioned something about 'epistemic determinism versus ontological determinism' and asked whether Poincaré is really arguing for the former while accidentally destroying the latter. I don't fully get that distinction — is it just about whether the world is deterministic or whether we can know it is? Also, there's this niche idea I came across in a side discussion about 'predictive irreducibility' in complex systems, where even with perfect laws you can't compute the future faster than letting it happen. Could Poincaré's point be read as an early version of that, or is that stretching him too far? I'd really like help unpacking the passage without just being told 'he's a determinist' — I want to know what kind of disagreement someone like Poincaré is actually having with himself, if any.
