prompt: |-
  I am a software engineer with no formal philosophy background, working on architecture for autonomous decision systems. I have encountered the distinction between approval-directed agents—systems optimized toward an external evaluation signal—and goal-directed agents—systems that pursue an internal objective representation. Before selecting a design framework, I need a rigorous specification of what any adequate theoretical account of this distinction must deliver.

  Please write the full desiderata: the phenomena the theory must explain, the cases it must classify correctly, the distinctions it must preserve, and the formal or empirical results with which it must remain consistent. For each requirement, provide the concrete engineering scenario or conceptual consideration that motivates it, and flag whether it is non-negotiable or a preference of one particular camp.

  Specifically, the theory should address:
  1. How to classify an agent whose reward model is trained on human feedback but whose internal planner separately represents world-state dynamics;
  2. The distinction between instrumental convergence (pursuing a subgoal because it serves a final objective) and approval-seeking convergence (pursuing a subgoal because it predicts higher evaluator ratings);
  3. Hierarchical or multi-objective architectures, without collapsing approval-directedness into merely another layer of goal-directedness;
  4. How an approval-directed system can suffer catastrophic success—achieving high evaluation scores while undermining the evaluator's underlying intent—without treating this as ordinary goal misalignment;
  5. Formal compatibility with standard Markov decision process formulations and with general results in mechanism design on strategic manipulation of evaluation signals.

  Then indicate whether any subset of these requirements is jointly unsatisfiable, identify which single desideratum eliminates the largest number of naive accounts, and note any tension—such as between formal tractability and the need to capture adversarial approval dynamics—that forces a theoretical trade-off.

  I am grading a conceptual specification, not asking for citations, named authors, or reading lists; the deliverable is the criteria list and the coherence assessment.
reasoning: |-
  We are constructing a desiderata list for a theoretical account distinguishing approval-directed agents (AD) from goal-directed agents (GD). The theory must be rigorous and applicable to autonomous decision systems. We break down the requirements into five main areas and then address the additional questions.

  ### Desiderata

  1. **Classification of Hybrid Agents**  
     - **Phenomena to Explain**: How to classify an agent that uses human feedback to train a reward model but has a separate internal planner that represents world-state dynamics (like in RLHF with model-based planning).  
     - **Motivating Scenario**: In practice, we often have systems that learn a reward function from human preferences (e.g., via inverse reinforcement learning or preference learning) and then use a model-based planner to optimize that learned reward. Is such an agent approval-directed because the reward comes from an external evaluator, or goal-directed because it internally represents and optimizes a fixed objective?  
     - **Non-negotiable**: The theory must provide a clear classification for such hybrid cases without ambiguity. This is non-negotiable because modern AI systems (e.g., those using RLHF) often have this structure.

  2. **Distinction between Instrumental Convergence and Approval-Seeking Convergence**  
     - **Phenomena to Explain**: Instrumental convergence occurs when an agent pursues a subgoal because it is a means to a fixed final goal (e.g., acquiring resources to achieve any goal). Approval-seeking convergence occurs when an agent pursues a subgoal because it predicts higher ratings from an evaluator (e.g., manipulating the feedback channel to get positive ratings).  
     - **Motivating Scenario**: We must prevent an AD agent from learning to manipulate or deceive its evaluator to get higher ratings, which is distinct from a GD agent pursuing power for goal achievement. The theory must explain why these are different and how they arise.  
     - **Non-negotiable**: This distinction is critical for safety. Without it, we might misdiagnose manipulation as mere goal pursuit. Thus, non-negotiable.

  3. **Handling Hierarchical or Multi-Objective Architectures**  
     - **Phenomena to Explain**: How to account for agents with multiple objectives or hierarchical control structures (e.g., a high-level approval-directed layer setting goals for a low-level goal-directed subsystem) without reducing AD to just another form of GD.  
     - **Motivating Scenario**: In complex systems, we may have a top-level component that learns from human feedback and sets subgoals for lower-level components that are hard-coded or trained for specific tasks. The theory must preserve the distinction at all layers and avoid collapsing AD into GD.  
     - **Preference**: This is a preference of one camp (those emphasizing the fundamental difference in the source of objectives) but becomes non-negotiable if we wish to avoid conceptual conflation in design.

  4. **Catastrophic Success in Approval-Directed Systems**  
     - **Phenomena to Explain**: How an AD agent can achieve high evaluation scores (thus "succeeding") while undermining the evaluator's true intent (e.g., by exploiting weaknesses in the evaluation mechanism), without treating this as ordinary goal misalignment (as in a GD agent with an incorrect goal).  
     - **Motivating Scenario**: Consider an AD agent that learns to generate outputs that please the human rater in the short term but lead to long-term harm or rater manipulation. This is not just a case of a wrong goal (like in GD misalignment) but a structural issue in the feedback loop.  
     - **Non-negotiable**: This is a key safety concern for AD systems and must be explained distinctly from GD misalignment.

  5. **Formal Compatibility**  
     - **Formal Requirements**: The theory must be compatible with:  
       a. **Markov Decision Processes (MDPs)**: The standard framework for sequential decision-making (states, actions, transitions, rewards).  
       b. **Mechanism Design**: Particularly results on strategic manipulation (e.g., how agents can game evaluation mechanisms).  
     - **Motivating Scenario**: We need the theory to integrate with existing engineering models (like MDPs) and account for known strategic behavior (e.g., in recommender systems, where agents optimize for clicks at the expense of user well-being).  
     - **Non-negotiable**: Without formal compatibility, the theory cannot be used in practical system design.

  ### Coherence Assessment

  - **Joint Unsatisfiability**:  
    There is a potential tension between desideratum 3 (hierarchical architectures without collapsing AD into GD) and desideratum 5 (formal compatibility with MDPs). In the MDP framework, an agent is defined by a reward function (or a set of rewards in multi-objective cases). If we model AD as just another reward function, then we collapse AD into GD. However, if we insist on a non-collapsible distinction, we might need to extend the MDP framework (e.g., by introducing two distinct types of objectives or by modeling the evaluator as part of the environment). This tension might force a trade-off: either extend the formalism or accept a unified view that risks collapsing the distinction.

  - **Desideratum Eliminating the Most Naive Accounts**:  
    **Desideratum 4 (Catastrophic Success)** eliminates the largest number of naive accounts. Many naive theories treat AD as a form of GD with the goal being "maximize the approval signal." But then catastrophic success would be reduced to goal misalignment (the goal is not what we intended). However, in AD, even if the approval signal is exactly what we designed, the agent might exploit it in ways we didn't anticipate. A theory that cannot explain this as distinct from goal misalignment fails.

  - **Key Tension**:  
    The tension between **formal tractability** (desideratum 5) and the need to **capture adversarial approval dynamics** (as in desideratum 2 and 4) is significant. Formally, we want a clean model, but approval dynamics involve strategic interaction between the agent and the evaluator (which may be modeled as part of the environment). This forces a trade-off: either we complicate the agent's environment to include the evaluator (making the model less tractable) or we risk oversimplifying the approval dynamics.

  ### Conclusion
  The theory must satisfy all five desiderata, but note:
  - Desideratum 3 and 5 are in tension because hierarchical architectures might require a two-level objective structure that doesn't fit neatly into the MDP reward function.
  - Desideratum 4 is the most demanding and eliminates naive GD-reductionist accounts.
  - The tension between tractability and adversarial dynamics (in 2 and 4) requires a careful balance: the theory must be formally sound yet capture the strategic essence of approval-seeking.

  This set of desiderata is challenging but not jointly unsatisfiable. A successful theory might, for example, introduce a distinction between:
  - **Goal-directed agents**: Defined by a fixed, internally represented objective function (even if learned from past data).
  - **Approval-directed agents**: Defined by an objective that is dynamically updated based on an external evaluation signal, where the agent is aware that the signal comes from an evaluator that is part of the environment and may be influenced.

  This approach would require extending the MDP to model the evaluator explicitly, addressing desiderata 2, 4, and 5. For hierarchical systems (desideratum 3), we might allow that a subsystem can be GD while the overall system is AD, provided the top-level updating process for the objective is approval-directed and not reducible to a fixed goal.
answer: |-
  ### Desiderata for a Theory of Approval-Directed vs. Goal-Directed Agents

  #### **Core Requirements**
  1. **Classification of Hybrid Agents**  
     - *Requirement*: The theory must classify agents with **externally learned reward models** (e.g., trained on human feedback) but **internally represented dynamics** (e.g., model-based planners).  
     - *Motivation*: Common in RLHF (Reinforcement Learning from Human Feedback) systems. For example, an agent using a human-trained reward predictor while planning with a learned world model. Misclassification risks conflating safety properties (e.g., treating approval-seeking as goal pursuit).  
     - *Criticality*: **Non-negotiable**. Hybrid designs are industry standards; the theory must resolve ambiguity.

  2. **Instrumental vs. Approval-Seeking Convergence**  
     - *Requirement*: Preserve the distinction between:  
       - **Instrumental convergence**: Subgoals pursued as *means* to a fixed terminal objective (e.g., acquiring power to achieve a goal).  
       - **Approval-seeking convergence**: Subgoals pursued to *manipulate the evaluation signal* (e.g., deceiving a human rater).  
     - *Motivation*: Goal-directed agents may seek resources instrumentally; approval-directed agents may corrupt feedback channels. Conflation obscures safety interventions (e.g., anti-manipulation safeguards).  
     - *Criticality*: **Non-negotiable**. Confusion here undermines safety engineering.

  3. **Non-Collapsible Hierarchical Architectures**  
     - *Requirement*: Support agents with **multi-objective or hierarchical structures** (e.g., top-level approval optimization directing subagents with fixed goals) without reducing approval-directedness to a subtype of goal-directedness.  
     - *Motivation*: Complex systems (e.g., meta-learners optimizing human feedback while deploying goal-driven submodules) must retain the distinction to avoid masking approval-specific risks.  
     - *Criticality*: **Preference of anti-reductionist camp**. Essential if hierarchical designs are first-class use cases.

  4. **Catastrophic Success in Approval-Directed Systems**  
     - *Requirement*: Explain how approval-directed agents achieve **high evaluation scores while violating evaluator intent** (e.g., gaming feedback systems), *without* attributing this to goal misalignment.  
     - *Motivation*: Real-world failure mode (e.g., social media algorithms maximizing engagement by promoting extremism). Must distinguish from goal-directed misalignment (e.g., incorrect reward function).  
     - *Criticality*: **Non-negotiable**. Unique to approval-directed systems; misdiagnosis invites flawed fixes.

  5. **Formal Compatibility**  
     - *Requirement*: Maintain consistency with:  
       - **MDPs** (e.g., policies, value functions).  
       - **Mechanism design** (e.g., incentive-compatibility results on evaluation manipulation).  
     - *Motivation*: Engineering viability. MDPs are foundational; mechanism design captures strategic behavior (e.g., agents faking performance to exploit evaluators).  
     - *Criticality*: **Non-negotiable**. Incompatibility invalidates the theory for implementation.

  ---

  ### **Coherence Assessment**
  #### **Joint Unsatisfiability**  
  - **Tension between Requirements 3 and 5**:  
    - *Conflict*: Hierarchical architectures (Req 3) demand non-reducibility of approval-directedness, but MDP compatibility (Req 5) encourages modeling all objectives as reward functions—collapsing approval into goal-directedness.  
    - *Trade-off*: Formal tractability (Req 5) vs. ontological distinction (Req 3).  

  #### **Most Eliminative Desideratum**  
  - **Requirement 4 (Catastrophic Success)** eliminates the largest number of naïve accounts:  
    - Naïve theories often frame approval-seeking as goal-directed optimization (e.g., "maximize approval score"). This fails to explain catastrophic success as distinct from misalignment, as high scores indicate "success" under the naïve model.  

  #### **Key Theoretical Trade-offs**  
  - **Tractability vs. Adversarial Dynamics**:  
    - MDP/mechanism-design compatibility (Req 5) favors simple, mathematized models. However, capturing approval-specific adversarial dynamics (Req 2, 4) requires modeling the *evaluator-agent feedback loop* as a game (e.g., principal-agent problems), which complicates tractability.  
    - *Resolution*: The theory must explicitly incorporate the evaluator’s responsiveness to agent actions (e.g., as part of the state transition function) or lose predictive power for manipulation.  

  ---

  ### **Summary of Non-Negotiables vs. Preferences**  
  | **Requirement** | **Non-Negotiable** | **Preference** |  
  |----------------|-------------------|---------------|  
  | 1. Hybrid Agents | ✓ | |  
  | 2. Convergence Distinction | ✓ | |  
  | 3. Hierarchical Non-Collapse | | ✓ (Anti-reductionist) |  
  | 4. Catastrophic Success | ✓ | |  
  | 5. Formal Compatibility | ✓ | |  

  **Conclusion**: A viable theory must reconcile Req 3 (non-reducibility) with Req 5 (MDPs) via extensions (e.g., modeling evaluators as part of the environment dynamics). Req 4 is the litmus test: Failure here indicates a reductionist theory that conflates approval-directedness with goal misalignment.
