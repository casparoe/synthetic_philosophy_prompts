  ### Key Insights for Your Discussion
  - **The shutdown move relies most on Metaethical Relativism or Moral Subjectivism**: Both treat morals as taste-like and deny objective truth, but they’re philosophically contested (e.g., self-undermining or ignoring shared human experiences like suffering).
