answer: |-
  Below is a disambiguation of the slogan "different cultures, different morals—there's no right answer" into distinct philosophical theses. Each reading is evaluated for defensibility, its capacity to justify shutting down arguments about objective wrongness, and its reliance on taste-vs-fact analogies. The key distinctions highlight how these readings diverge.

  ### Table of Readings
  | Reading label                     | The precise claim it makes                                                                 | Trivial, defensible, or false? | Does it justify shutting down the argument? | Key distinction or counterexample                                                                 |
  |-----------------------------------|--------------------------------------------------------------------------------------------|---------------------------------|---------------------------------------------|---------------------------------------------------------------------------------------------------|
  | **Descriptive Variation**         | Moral beliefs/practices empirically vary across cultures.                                  | **Trivial** (well-documented)  | **No**                                      | Observes facts (like climate variation). Doesn’t address moral truth (e.g., slavery debates show disagreement ≠ no truth). |
  | **Metaethical Relativism**        | Moral truths are mind-dependent and culturally constituted; no trans-cultural "objective" wrong exists. | **Defensible** (but contested) | **Yes**                                     | Treats morals like **taste** (cilantro soap-taste). Denies objective moral facts exist. Counterexample: Relativism’s own claim ("no objective truth") pretends to be trans-cultural truth. |
  | **Epistemic Limitation**          | Cross-cultural moral disagreements are unresolvable due to lack of shared grounds/evidence. | **Defensible**                 | **Partially** (blocks certainty, not truth) | Focuses on **knowledge**, not truth. Counterexample: Unresolvable flat-earth debates don’t mean Earth lacks objective shape. |
  | **Normative Tolerance Prescription** | We *should* suspend judgment on other cultures’ practices to avoid imperialism.             | **Defensible** (but not entailed by variation) | **No** (prescribes behavior, not truth)     | A moral rule ("be tolerant") that contradicts itself if universally applied (e.g., tolerating intolerance). |
  | **Conceptual Incommensurability** | Moral frameworks (e.g., harm vs. purity) are so divergent they can’t be meaningfully compared. | **False** (data shows overlap) | **Yes**                                     | Denies shared moral concepts exist. Counterexample: WEIRD and non-WEIRD cultures both recognize harm (varying weight ≠ incommensurability). |
  | **Moral Subjectivism**            | Moral judgments express subjective preferences (individual/cultural), not objective facts. | **Defensible**                 | **Yes**                                     | Reduces morals to **taste** (e.g., "honor-killing is wrong" ≈ "I dislike cilantro"). Undermines itself (preference against murder isn’t arbitrary). |
  | **Pragmatic Peacekeeping**        | Invoking "no right answer" avoids conflict; it’s rhetoric, not philosophy.                 | **Defensible**                 | **Yes** (but strategically, not truthfully) | A social tool, not a truth-claim. Counterexample: If peace requires ignoring genocide, the strategy fails morally. |

