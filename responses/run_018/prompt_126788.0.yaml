  I recall Derek Parfit's Repugnant Conclusion and the idea of a "discontinuity" in aggregation. Maybe the user intuitively rejects full aggregation of micro-harms. A principle based on phenomenal salience threshold could work: if an experience doesn't rise to the level of conscious awareness, it doesn't contribute to harm aggregation. 

  This principle explains their first five judgments. Torture is intensely conscious; Planck-time hums aren't. But what about the 80-year hum? That's consciously experienced, so it outweighs any number of non-conscious micro-harms. 

