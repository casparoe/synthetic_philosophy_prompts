answer: |-
  Your proposal tackles a sophisticated and underexplored tension in social choice theory. Here's a refined structure incorporating your core idea while sharpening its focus for impact and feasibility within a 3-month seed grant:

  **Project Title:** Harsanyi's Aggregation Under Context-Dependent Risk Attitudes: Does Framing Collapse Linearity?

  **Core Research Question:** Does Harsanyi’s linear aggregation theorem survive when individuals systematically violate the independence axiom based on whether gambles involve *private* payoffs or *public/jointly experienced* outcomes, and what are the implications for the representation of social welfare?

  **The Gap:** As you astutely note, standard treatments of Harsanyi:
  1.  Treat weights as exogenous, fixed parameters.
  2.  Assume strict adherence to vNM axioms (especially independence) *uniformly* across all decision contexts.
  3.  Ignore potential systematic context-dependence in individual risk preferences (private vs. public framing).
  This project directly addresses the intersection of points 2 and 3, probing whether systematic context-dependence in *individual* rationality challenges the *form* of social aggregation, potentially exposing limitations in state-space descriptions for interpersonal comparison.

  **Proposed Approach (3 Months):**

  *   **Month 1: Formalizing Context-Dependent Preferences & Consistency**
      *   **Goal:** Build a rigorous, minimal model.
      *   **Actions:**
          *   Define a state space with two states (e.g., Good/Bad).
          *   Define two agents.
          *   Define two distinct *framing contexts*: `Private` (payoffs affect only the individual) and `Public` (payoffs are jointly experienced public goods/shared risks).
          *   Model each agent's preferences as *two distinct vNM utility functions*: `U_i^Private(X_i)` and `U_i^Public(X_1, X_2)` (or `U_i^Public(G)` where `G` is a public good level). Crucially, **allow violations of the independence axiom *only* when comparing lotteries across framing contexts** (e.g., an agent might satisfy independence within `Private` gambles and within `Public` gambles, but not when comparing a `Private` gamble to a `Public` gamble).
          *   Define consistency conditions *within* each context (e.g., within `Public`, standard vNM assumptions hold).
          *   Formalize the social choice setting: Social alternatives are state-contingent allocations specifying private goods and/or public goods. Social preferences over lotteries over these alternatives.
          *   Assume standard Harsanyi axioms for the *social* preference ordering: **Pareto Indifference & Preference, Anonymity, Social vNM (Independence, Continuity, etc.)**.

  *   **Month 2: Deriving (or Refuting) a Representation Theorem**
      *   **Goal:** Explore the possibility/impossibility of linear aggregation under the defined context-dependence.
      *   **Actions:**
          *   Attempt to derive a social welfare function `W` satisfying the axioms.
          *   **Critical Path Investigation:**
              *   *Path A (Linearity Holds):* Does `W` *still* take the form `W = α * U_1^Context(state) + β * U_2^Context(state)` for *each specific context*, but with weights potentially differing *by context*? Does it collapse to `W = α * U_1^Private + β * U_2^Private` even for public outcomes (implying framing is irrelevant to aggregation)?
              *   *Path B (Non-Linearity Emerges):* Does the context-dependence force `W` to be non-linear in the individual utilities (e.g., `W = f(U_1^Private, U_2^Private, U_1^Public, U_2^Public, context)`)? Is aggregation impossible without violating one of the social vNM axioms (likely Independence)?
              *   *Path C (State-Space Incomparability):* Does the attempt reveal that the `Private` and `Public` utility functions are defined over fundamentally incomparable state descriptions from an interpersonal perspective, preventing consistent aggregation weights? (This directly addresses your framing/intercomparability concern).
          *   Focus on rigorous proofs or counter-examples for the 2-agent, 2-state, 2-context case.

  *   **Month 3: Philosophical Payoff & Implications**
      *   **Goal:** Interpret the formal results for social choice theory and normative economics.
      *   **Actions:**
          *   Based on Month 2:
              *   If **Path A (Context-Dependent Weights)**: Argue this extends Harsanyi but makes weights *endogenous* to the decision context (public/private). Discuss normative justification for context-dependent weights. Is this a strength (flexibility) or a weakness (arbitrariness)?
              *   If **Path A (Collapse to Standard)**: Conclude that the observed framing effects are representable as standard differences in risk aversion within a fixed utility framework, posing no *fundamental* challenge to Harsanyi aggregation (though it might complicate measurement).
              *   If **Path B (Non-Linearity/Impossibility)**: Argue that systematic context-dependence in individual rationality is fundamentally incompatible with *linear* social aggregation under standard axioms. Does this support rejecting aggregation, or point towards relaxing social vNM axioms? Discuss implications for deliberative democracy or non-expected utility social welfare.
              *   If **Path C (Incomparability)**: Argue that Harsanyi aggregation requires a stronger, context-invariant notion of the "state" and interpersonally comparable consequences than is available when preferences are frame-sensitive. What does this imply for the descriptive realism of the model?
          *   Situate findings within broader debates: welfarism vs. non-welfarism, the limits of consequentialism under framing, the potential need for "thicker" descriptions of outcomes.

  **Defining Success & Failure:**

  *   **Success:** Achieving one of the following:
      1.  A **modified representation theorem** showing linear aggregation holds but with weights contingent on the framing context (`W_public = α_public*U1_public + β_public*U2_public`; `W_private = α_private*U1_private + β_private*U2_private`).
      2.  A **clear impossibility result** proving that no linear social welfare function satisfying the axioms exists when individuals exhibit systematic context-dependent violations of independence across private/public frames.
      3.  A **compelling argument** demonstrating that the framing effect inherently creates interpersonal incomparability of utilities across contexts, undermining the foundation of Harsanyi aggregation.
  *   **Failure (The Redescription Risk):** Concluding that the context-dependence is fully captured by standard differences in risk aversion (`U_private` vs `U_public` are just different vNM functions for the same underlying preferences over consequences), meaning the aggregation structure remains linear and unchanged (`W = α*U1 + β*U2` using the context-appropriate `U_i`). This would show the framing effect, while real for *individuals*, doesn't alter the *form* of social aggregation under Harsanyi's axioms.

  **Why this is NOT "just homework":**

  1.  **Novel Question:** Directly challenges the uniformity of rationality assumptions *within* individuals across contexts in Harsanyi's theorem, a point largely glossed over.
  2.  **Formal Gap:** Probes the interaction between *structured* individual axiom violations and the *structure* of social aggregation.
  3.  **Philosophical Stakes:** Connects deeply to debates about the nature of rationality, interpersonal comparison, consequentialism, and the representation of social states.
  4.  **Methodology:** Requires original formal modeling beyond textbook application, specifically constructing a model of context-dependent preferences and testing Harsanyi's framework against it.
  5.  **Clear Deliverables & Risk:** Defines specific success/failure criteria and embraces the possibility of a negative/null result, demonstrating rigorous research design.

  **Strengths of this Proposal:**

  *   **Tight Scope:** 2 agents, 2 states, 2 contexts is perfectly sufficient for an initial probe.
  *   **Clear Progression:** Month-by-month plan with distinct, achievable goals building logically.
  *   **High Risk/Reward:** Engages a fundamental question with potential for significant insight or a clear negative result.
  *   **Foundational:** Addresses core assumptions in welfare economics and social choice.
  *   **Feasible:** Leverages standard tools (vNM, social choice axioms) in a novel combination.

  **Good luck!** This is an excellent seed grant topic – ambitious yet focused, addressing a genuine puzzle with clear methodological steps and significant theoretical payoff potential. Your articulation of the gap and the "redescription risk" is particularly strong.
