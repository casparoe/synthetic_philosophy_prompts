reasoning: |-
  We are drafting a joint statement between a Jamesian advocate (who holds that practical considerations can sometimes justify belief that outruns evidence) and a Cliffordian evidentialist (who holds that it is always wrong to believe without sufficient evidence). They have engaged in an adversarial collaboration regarding belief under scientific urgency, specifically in the context of the Dr. Aris case. Dr. Aris is a climate modeler facing a situation where 60% of climate models agree on a particular outcome, and he must advise on geoengineering.

  The statement will include:
  1. Agreed claims about belief and suspension of judgment.
  2. Precise disagreements in wording that each accepts (with each side's version noted).
  3. The cruxes of their disagreement, applied to the Dr. Aris case, including:
     a. Whether practical stakes can license belief without proof.
     b. Whether withholding judgment carries its own moral weight.
  4. For each crux, a concrete case or argument that both agree bears on it, with each side's prediction noted.

  We start with the statement itself, without preface or commentary.

  **Joint Statement on Belief Under Scientific Urgency**

  **Agreed Claims:**

  1. **The Duty of Inquiry**: Both parties agree that in the face of uncertainty, there is a moral and epistemic duty to seek out and weigh available evidence to the best of one's ability and resources, given the urgency and stakes.

  2. **The Role of Evidence**: Both parties agree that evidence is the primary foundation for rational belief and that the strength of a belief should be proportioned to the evidence.

  3. **Suspension of Judgment as an Option**: Both parties agree that when evidence is insufficient, suspension of judgment is an epistemically responsible position, and in some cases, it may be the most responsible position.

  4. **Contextual Factors**: Both parties agree that the practical consequences of being wrong (i.e., the stakes) are relevant to how one should act. However, they disagree on whether these stakes can affect what one should believe (as opposed to act upon).

  5. **Scientific Urgency**: Both parties agree that in situations of scientific urgency, such as the climate crisis, decisions must often be made under uncertainty, and inaction can have severe consequences.

  6. **Dr. Aris Case Specifics**: Both parties agree that Dr. Aris faces a situation with 60% agreement across models. They agree that this represents a significant but incomplete level of evidence. They agree that the decision to advise on geoengineering is high-stakes and urgent.

  **Precise Disagreements in Wording:**

  1. **On the Justification of Belief**:
     - *Jamesian Wording*: "In high-stakes, urgent situations, the practical consequences of error can license holding a belief that goes beyond the available evidence when that belief is necessary for decisive action."
     - *Cliffordian Wording*: "Belief must always be grounded in sufficient evidence; practical consequences may license acting *as if* one believed, but they do not license actual belief without sufficient evidence."

  2. **On the Moral Weight of Withholding Judgment**:
     - *Jamesian Wording*: "Withholding judgment, while sometimes necessary, can carry a moral cost when it leads to inaction in the face of high stakes, and in such cases, the moral imperative to act can justify forming a belief that outruns evidence."
     - *Cliffordian Wording*: "Withholding judgment is the only morally and epistemically responsible position when evidence is insufficient, regardless of the stakes. The moral cost of inaction is a separate issue that should be addressed by acting on the basis of risk assessment without forming unjustified beliefs."

  **Cruxes of Disagreement:**

  **Crux 1: Whether practical stakes can license belief without proof.**

  *Application to Dr. Aris Case*: Dr. Aris must advise on geoengineering. With 60% of models indicating a catastrophic outcome without intervention, but 40% not, the evidence is not conclusive. The Jamesian holds that the high stakes (potential widespread suffering and irreversible damage) license Dr. Aris to believe that the catastrophic outcome is likely enough to warrant action, even though the evidence is not overwhelming. The Cliffordian holds that Dr. Aris should not believe the catastrophic outcome but should instead act on the basis of risk management (e.g., the expected value of action is positive given the probabilities).

  *Concrete Case/Argument Both Agree Bears on Crux 1: The Fire Alarm Case.*  
  - *Description*: Imagine you are in a crowded theater and smell smoke. You see no flames, but the smoke is faint and could be from a minor source. However, if there is a fire, delay could cause many deaths. You must decide whether to pull the alarm.  
  - *Jamesian Prediction*: The practical stakes (potential deaths) license believing there is a fire even though the evidence (only faint smoke) is weak. This belief justifies pulling the alarm.  
  - *Cliffordian Prediction*: One should not believe there is a fire without more evidence. However, the risk is high enough that one should pull the alarm anyway, acting on the basis of the potential consequences without forming an unjustified belief.

  **Crux 2: Whether withholding judgment carries its own moral weight.**

  *Application to Dr. Aris Case*: If Dr. Aris withholds judgment on whether geoengineering is necessary, he may delay or avoid recommending a risky intervention. The Jamesian argues that withholding judgment in this case is morally costly because it may lead to inaction and thus catastrophic harm. The Cliffordian argues that withholding judgment is morally required because forming a belief without sufficient evidence could lead to unnecessary and potentially harmful geoengineering.

  *Concrete Case/Argument Both Agree Bears on Crux 2: The Medical Decision Case.*  
  - *Description*: A doctor must decide whether to perform a risky surgery on a patient with a life-threatening condition. The evidence for the surgery's success is mixed (60% of studies show success, 40% show failure). Without surgery, the patient will likely die.  
  - *Jamesian Prediction*: The doctor should form the belief that the surgery is the best option because the stakes (death without intervention) are high, and withholding judgment would lead to inaction and death.  
  - *Cliffordian Prediction*: The doctor should withhold judgment about the surgery's success but still recommend it based on the best assessment of the probabilities and the stakes (i.e., the expected value). The doctor does not need to believe in the surgery's success; they act on the risk assessment.

  **Signed:**  
