  The concept that comes closest is "carbon chauvinism," but that's more about consciousness. What they're describing feels like a hybrid between shifting the goalposts and epistemic injustice—specifically, demanding different levels of evidence based on substrate. Maybe "substrate-based evidentiary asymmetry" captures it? Though that's clunky. 

  I should emphasize how this differs from the other-minds problem. With humans, we grant moral status based on behavioral cues by default; with AI, even identical behavior gets scrutinized for "real" implementation. That's the core asymmetry. The critic isn't necessarily wrong to question artificial systems, but the burden of proof shifts unfairly. 

  The user might also be hinting at a deeper frustration: if functionalism is valid in philosophy of mind, why isn't it applied consistently here? That's worth surfacing. And pragmatically, they may need terminology to call out this move in debates—so I'll propose "substrate-moved goalposts fallacy" as a shorthand. 

