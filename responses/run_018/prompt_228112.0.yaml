prompt: |-
  So I run a little philosophy reading group at work (we're a fintech, mostly backend engineers, no-one has any formal philosophy training) and we've just finished a six-week block on vagueness and the sorites paradox. I said I'd put together an end-of-block written assessment, the way you would for an internal training course, and I'm now realising that writing a good exam question is way harder than writing a good code review.

  Here's the angle I want. Early on we read Bertrand Russell's 1923 paper "Vagueness", and one bit really stuck with me because it sounds like something out of an engineering spec review:

  "The metre, for example, is defined as the distance between two marks on a certain rod in Paris, when that rod is at a certain temperature. Now the marks are not points, but patches of a finite size, so that the distance between them is not a precise conception. Moreover, temperature cannot be measured with more than a certain degree of accuracy, and the temperature of a rod is never quite uniform. For all these reasons the conception of a metre is lacking in precision."

  My instinct as an engineer reading this is: fine, vagueness is just tolerance bands and measurement error, and the fix is to pick a cutoff and enforce it -- we do this constantly, e.g. a monitoring alert fires when latency exceeds 500ms, full stop, no paradox. But the group pushed back and said that just relocates the sorites rather than solving it, and that Russell's metre point is about something different from the bald-man case anyway. I want an exam question that forces people to actually take a position on this rather than summarise both sides.

  So please write me:

  1. The exam question itself. It should quote or paraphrase the Russell passage (that bit shouldn't count towards the word limit), ask candidates to say whether the engineering-style "just set a threshold" response dissolves the sorites or merely moves it, and require them to explain whether Russell's metre example and the standard heap/baldness cases are the same kind of vagueness or different kinds. Answerable in about 45 minutes, aimed at smart people with zero philosophy background, and it should be impossible to answer well by just reciting "a heap minus one grain is still a heap".

  2. A model answer of around 500 words, written at the level of the sharpest person in the group.

  3. A marking scheme, out of 20 marks.

  For the marking scheme, give it to me as a JSON object (I'll paste it straight into our internal tool) with this exact structure:

  {
    "total_marks": 20,
    "criteria": [
      {
        "name": short label for the criterion,
        "marks": integer,
        "full_marks_requires": the specific move an answer must make to get full marks on this criterion,
        "typical_failure": the specific way a weaker answer usually falls short on it
      }
    ],
    "grade_boundaries": {
      "distinction": minimum mark for a distinction,
      "pass": minimum mark for a pass
    }
  }

  Between four and six criteria please. The criteria should reward the actual conceptual moves (e.g. distinguishing vagueness from mere measurement imprecision, explaining why a stipulated cutoff has to be either arbitrary or itself vague) rather than rewarding people for namedropping philosophers, which half the group will definitely try.
reasoning: |-
  We are creating an exam question that forces candidates to take a position on whether setting a threshold solves the sorites paradox or merely relocates it, and to compare Russell's metre example with the standard heap/baldness cases.

  Exam Question:

  """
  Bertrand Russell, in his 1923 paper "Vagueness", writes:

      "The metre, for example, is defined as the distance between two marks on a certain rod in Paris, when that rod is at a certain temperature. Now the marks are not points, but patches of a finite size, so that the distance between them is not a precise conception. Moreover, temperature cannot be measured with more than a certain degree of accuracy, and the temperature of a rod is never quite uniform. For all these reasons the conception of a metre is lacking in precision."

  In the context of our discussions on vagueness and the sorites paradox, consider the following:

  1. One common engineering-style response to vagueness is to set a precise threshold (e.g., defining a heap as having at least 1000 grains). Does this approach *dissolve* the sorites paradox (i.e., remove the problem entirely) or merely *relocate* the vagueness (i.e., move the problem to a different place)? Explain your reasoning.

  2. Russell's example of the metre standard involves issues of measurement and physical imprecision. Are these issues fundamentally the same kind of vagueness as in the classical sorites cases (like heaps or baldness), or are they a different kind? Explain the similarities and/or differences.

  In your answer, avoid merely restating the sorites paradox (e.g., "removing one grain from a heap still leaves a heap"). Instead, focus on the underlying issues of how we define concepts and the nature of the boundaries we draw.
  """

  Model Answer (approx 500 words):

  Russell's example of the metre standard highlights the practical difficulties in achieving precision due to physical limitations in measurement. However, the engineering response of setting a threshold does not dissolve the sorites paradox; it merely relocates it. To see why, consider that the paradox arises because vague predicates (like "heap" or "bald") lack sharp boundaries. Setting a threshold (e.g., 1000 grains for a heap) introduces a sharp boundary by stipulation. But this boundary is arbitrary: why 1000 and not 999? The arbitrariness means that the threshold itself becomes a new locus of vagueness. Even if we accept the threshold, we can construct a new sorites series around it: is 999 grains a heap? 998? The paradox reappears because the threshold does not capture the meaning of "heap" as used in natural language, which is inherently tolerant to small changes. The threshold merely shifts the vagueness from the concept to the boundary we have imposed.

  Regarding Russell's metre example, it is important to distinguish between two kinds of imprecision. The classical sorites cases (heaps, baldness) involve *conceptual vagueness*: the concept itself does not specify a clear boundary. In contrast, the metre example involves *epistemic or physical imprecision*: we cannot measure exactly due to limitations in our instruments or the physical world. The metre is defined by an idealized standard (the rod at a specific temperature), but the standard is imperfectly realized because of the finite size of the marks and temperature variations. However, note that the definition of the metre is precise in principle: if we could measure perfectly and the rod were at exactly the right temperature, we could have an exact length. The vagueness here is due to our inability to access the ideal, not because the concept of a metre is vague. In other words, the metre has a precise definition, but we cannot always determine whether a given length is exactly one metre due to measurement error.

  In the heap case, even if we had perfect measurement, we would still face the problem of how many grains make a heap because the concept is inherently vague. Thus, the two are different: the metre case is about epistemic limitations, while the heap case is about semantic indeterminacy. That said, both can lead to borderline cases. But the source of the borderline cases differs: one is due to imperfect knowledge or physical constraints, the other to the meaning of the term itself.

  In conclusion, setting thresholds is a practical engineering solution that helps in decision-making but does not resolve the philosophical problem of vagueness. It relocates the vagueness to the choice of threshold. Moreover, Russell's metre example illustrates a distinct kind of imprecision that arises from the physical world and our measurement tools, which is different from the conceptual vagueness at the heart of the sorites paradox.

  Marking Scheme (as JSON):

  We need 4-6 criteria. The criteria should focus on conceptual moves, not name-dropping. Let's design:

  1. Addressing the relocation vs dissolution of the paradox by setting thresholds.
  2. Explanation of why the threshold itself becomes a locus of vagueness (arbitrariness or new sorites series).
  3. Distinguishing conceptual vagueness (sorites cases) from epistemic/physical imprecision (metre case).
  4. Explaining that the metre has a precise definition in principle, but the heap does not.
  5. Recognizing that both can lead to borderline cases but for different reasons.

