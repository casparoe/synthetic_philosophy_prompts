answer: |-
  ### Exam Question  
  **Read the following passage from Bertrand Russell's 1923 paper "Vagueness":**  
  > "The metre, for example, is defined as the distance between two marks on a certain rod in Paris, when that rod is at a certain temperature. Now the marks are not points, but patches of a finite size, so that the distance between them is not a precise conception. Moreover, temperature cannot be measured with more than a certain degree of accuracy, and the temperature of a rod is never quite uniform. For all these reasons the conception of a metre is lacking in precision."  

  **Answer both parts below in 45 minutes:**  
  1. **Thresholds as solutions?**  
     Engineers often respond to vagueness by setting precise thresholds (e.g., "baldness = fewer than 10,000 hairs"). Does this *dissolve* the sorites paradox (resolving it entirely) or merely *relocate* it (shift the problem elsewhere)? Explain why, **without** reciting the standard sorites reasoning (e.g., "one grain less is still a heap"). Focus on the **underlying logic** of thresholds.  

  2. **Same or different?**  
     Is the vagueness in Russell’s metre example fundamentally **the same kind** as the vagueness in classical sorites cases (e.g., heaps/baldness)? Or are they **different phenomena**? Justify your answer by comparing their sources and implications.  

  ---  
  ### Model Answer (500 words)  
  **Part 1: Thresholds relocate but don’t dissolve the paradox.**  
  Setting a threshold (e.g., "heap = ≥1,000 grains") appears to solve the sorites paradox by replacing a vague predicate with a precise one. But this only *relocates* the problem. The paradox arises because natural-language concepts (like "heap") lack sharp boundaries, creating borderline cases where small changes (e.g., removing one grain) seem insignificant. A threshold imposes artificial precision, but the choice of cutoff is either:  
  - **Arbitrary**: Why 1,000 grains? Any specific number lacks justification beyond practicality, and we can construct a *new* sorites series around the threshold (e.g., is 999 grains meaningfully different from 1,000?).  
  - **Vague itself**: If we define thresholds contextually (e.g., "heap size depends on grain type"), we reintroduce vagueness through auxiliary criteria.  

  Engineering thresholds (e.g., "latency > 500ms = alert") avoid paradoxes *operationally* by fiat, but they don’t address the *conceptual* problem: they shift vagueness to the justification for the threshold. The sorites paradox isn’t dissolved; it’s masked by stipulation.  

  **Part 2: Russell’s metre is a different kind of vagueness.**  
  Russell’s metre example and classical sorites cases involve distinct phenomena:  
  - **Metre vagueness is epistemic and physical**: The imprecision stems from *measurement limitations* (e.g., fuzzy marks, imperfect temperature control). The metre *has* a precise definition (the rod’s length under ideal conditions), but we can’t perfectly access it. Here, vagueness arises from **uncertainty in observation**, not the concept itself.  
  - **Heap/baldness vagueness is semantic**: The concept "heap" has *no* precise definition even in principle. There’s no "ideal heap" to measure against—it’s inherently boundaryless by design. Vagueness here is a **feature of language**, reflecting how we categorize continuous realities (e.g., grains accumulating).  

  **Key difference**: The metre’s vagueness could (in theory) be eliminated with perfect instruments. The heap’s vagueness *cannot*, as it’s rooted in linguistic convention. Both create borderline cases, but Russell’s example is about **imperfect knowledge**, while sorites cases are about **indeterminate meaning**.  

  ---  
