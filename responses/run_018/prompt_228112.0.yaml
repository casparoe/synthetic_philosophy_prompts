    }
  }
  ``` 

  ### Notes for Grading  
  - **Distinction (16+):** Explicitly tackles the recursion of vagueness (Part 1) and the epistemic/semantic divide (Part 2). Uses engineering intuition against itself (e.g., "thresholds kick the can down the road").  
  - **Pass (10+):** Correctly identifies relocation and a basic difference in vagueness type but may lack depth in explaining *why* (e.g., stops at "metre is about measurement, heap is about meaning").  
  - **Fail (<10):** Summarizes the sorites paradox without engaging the question, conflates vagueness types, or relies on assertions.
