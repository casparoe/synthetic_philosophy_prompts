        "marks": 2,
        "full_marks_requires": "Answers engage the deeper logic (e.g., thresholds as recursive/arbitrary; metre as ideal vs. real) without parroting 'sorites steps'.",
        "typical_failure": "Rehashing the paradox mechanically (e.g., 'removing one grain...') or name-dropping without analysis."
      }
    ],
