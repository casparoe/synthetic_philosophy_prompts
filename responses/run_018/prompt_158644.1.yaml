prompt: |-
  I've noticed a recurring move in debates about whether certain human capacities must be innate because experience alone can't account for them. A researcher argues that children come to know something complex—say, that a particular grammatical constraint holds in languages they've never encountered, or that harming others for fun is wrong—without explicit teaching and despite noisy or absent environmental feedback. To prove learning impossible, the researcher frames the child's options as binary: either tracking obvious surface patterns in perception, or already possessing the full concept in question. Any middle path—where the child builds a partial, abstract representation from cross-context statistical regularities, simpler than the target but more structured than raw sensation—is omitted from the model, not because there's evidence it is unavailable, but because including it would collapse the claimed gap between stimulus and knowledge. I've seen this structure in language-acquisition arguments and in some evolutionary-psychology accounts of moral cognition. Is there an established term for this specific failure mode—this artificial widening of the learning gap by excluding intermediate, genuinely learnable representations? Or does it fall under broader diagnoses like the learning paradox or a false dichotomy in modeling? If no precise label exists, I want the carving: what distinguishes it from legitimate restrictions on a learner's prior, where its boundaries lie, and why it fails as an argument rather than as an empirical claim.
reasoning: |-
  Okay, the user is pointing out a recurring debate tactic where researchers argue that certain human capacities must be innate because experience alone can't explain them. They describe how the researcher sets up a binary choice: either the child tracks obvious surface patterns or already has the full concept. Any middle ground where the child builds abstract representations from statistical regularities is excluded. The user wants to know if there's a specific term for this failure mode.

  First, I need to recall if there's an established term for this. The user mentions the "learning paradox" and "false dichotomy." The learning paradox is more about Plato's question of how we learn something we don't already know. The false dichotomy is broader. The exclusion of intermediate representations seems key here. I remember "poverty of the stimulus" arguments in linguistics, where Chomsky claimed language can't be learned from input alone. But critics like Pullum and Scholz have pointed out that those arguments often ignore statistical learning and probabilistic models.

  The term "truncated empiricism" comes to mind. That's when the range of possible learning mechanisms is artificially limited, ignoring things like statistical learning or analogy. That fits the user's description. Also, "representational impoverishment" where the inputs are underspecified but the outputs are rich, yet the intermediate steps aren't considered. 

  The user might be looking for a precise term to counter such arguments in debates. They might need academic references or examples to strengthen their position. They could be an academic or someone involved in cognitive science debates, wanting to articulate this flaw clearly. Their deeper need might be to effectively critique nativist claims by naming the fallacy, thus providing a structured counterargument.

  I should also consider why this is a fallacy. By excluding plausible learning mechanisms, the researcher creates a false necessity for innate knowledge. Empirical claims require evidence against alternative learning models, not just gaps in a simplified model. The burden of proof is on showing that statistical learning can't work, not assuming it doesn't exist. 

  So, the key terms are "truncated empiricism" and "representational impoverishment." Explaining these and how they relate to false dichotomies should address the user's query. Highlighting the difference between legitimate priors and this fallacy is crucial. Also, mentioning critics of poverty of the stimulus arguments would provide context.
answer: |-
  That's an exceptionally sharp observation of a recurring and problematic argumentative pattern. You've pinpointed a crucial flaw in many "poverty of the stimulus" (POS) arguments, particularly in nativist claims about language and morality. While there isn't one universally agreed-upon *single term* for this *exact* move, several established concepts and critiques encapsulate it:

  1.  **Truncated Empiricism / Artificially Restricted Learning Mechanisms:** This is perhaps the most direct label. It describes the act of defining "learning" or "experience" so narrowly (e.g., only direct instruction, only tracking simple surface frequencies, only explicit reinforcement) that it *cannot* plausibly account for the outcome. By excluding powerful statistical learning mechanisms, analogy, abstraction over multiple instances, bootstrapping from simpler representations, and domain-general pattern detection, the argument artificially creates an insurmountable gap. **This is the core of what you described.**

  2.  **Misapplication or Straw-Man Version of the Poverty of the Stimulus Argument:** The POS argument itself (that environmental input is insufficient to explain the outcome) is legitimate *in principle*. However, it becomes fallacious when:
      *   **The "Stimulus" is Underspecified:** Failing to fully characterize the *richness and structure* of the actual input the child receives (e.g., statistical regularities across utterances, prosody, pragmatic context, cross-situational alignment).
      *   **The Learner's Capacities are Underspecified:** Ignoring the learner's inherent capacities for abstraction, statistical inference, and building structured representations from noisy data (capacities that are *themselves* learnable or emergent, but not necessarily domain-specific "full concepts").
      *   **Plausible Learning Trajectories are Excluded:** Exactly as you said – omitting the "middle path" of incremental, abstractive learning.

  3.  **False Dichotomy / Excluded Middle:** This is the broader logical fallacy you identified. Framing the options as only "simple association/pattern matching" vs. "innate full concept" ignores the vast landscape of computational and representational possibilities in between.

  4.  **Representational Impoverishment (in the Input Characterization):** While "poverty of the stimulus" focuses on the input lacking information, this critique focuses on the *argument's* failure to adequately represent the *potential representational states* of the learner during development. It assumes the learner only has access to either "raw data" representations or "final state" representations, ignoring intermediate, partial, abstract representations.

  5.  **Ignoring Statistical Learning / Probabilistic Inductive Biases:** A specific instance of truncated empiricism. The argument often dismisses or fails to model how powerful statistical learning over diverse, noisy input can lead to abstract generalizations without explicit teaching or innate domain-specific knowledge of the final concept.

  **Why it's a Fallacious Argument, Not Just an Empirical Claim:**

  1.  **Burden of Proof:** The nativist making the POS claim bears the burden of *demonstrating* that *no plausible learning mechanism* operating on the *actual available input* can achieve the outcome. Artificially restricting the learning mechanisms sidesteps this burden. It shifts from "prove learning is impossible" to "prove learning is impossible *under my artificially constrained model*".
  2.  **Non-Falsifiability of the Nativist Claim:** If any evidence suggesting statistical learning or abstraction *could* work is dismissed *a priori* by defining learning too narrowly, the nativist claim becomes insulated from empirical counter-evidence. The "gap" is defined into existence.
  3.  **Mischaracterization of Development:** It ignores the developmental trajectory. Children demonstrably *do* build increasingly abstract representations over time through interaction with their environment. Denying the possibility of intermediate representations flies in the face of observable developmental progressions.
  4.  **Begging the Question:** The argument often subtly assumes what it sets out to prove. By defining the learning mechanism as inadequate *by fiat* (excluding powerful alternatives), the conclusion that innate knowledge is necessary becomes almost tautological.

  **Distinguishing it from Legitimate Priors:**

  *   **Legitimate Priors/Biases:** It is entirely valid and necessary to posit constraints on the learner. Evolution *does* shape learning mechanisms. Domain-relevant *biases* (e.g., a bias to attend to human faces, a bias to segment continuous speech at word boundaries, a bias towards reciprocal fairness) are plausible and empirically supported. These are often *enablers* of learning within a reasonable timeframe, not pre-packaged "full concepts".
  *   **The Fallacy:** The fallacy occurs when the postulated prior isn't a *bias* or *learning mechanism*, but is instead the *full complex knowledge structure* itself (e.g., Universal Grammar parameters, innate moral principles like "harm is wrong"). Crucially, it posits this *because* plausible, less rich learning mechanisms capable of building towards that knowledge have been *excluded from consideration without justification*, creating a false necessity.
  *   **Boundary:** The boundary lies in the *richness* of what is innate and the *exclusion* of plausible alternatives. Is the prior a domain-general learning mechanism, a domain-relevant bias, or a pointer to specific information? Or is it the complex, abstract knowledge itself? The latter, *when justified primarily by artificially restricting the learning landscape*, constitutes the fallacy.

  **In essence, you've identified a powerful rhetorical trick: defining "learning" into impotence to create a vacuum that only "innate knowledge" can fill.** The most precise labels are **Truncated Empiricism** or a **Misapplied/Straw-Man Poverty of the Stimulus Argument** that specifically **Excludes Intermediate Representations and Statistical Learning Mechanisms**. It's a failure to engage with the actual computational and developmental possibilities of learning. Critics like Geoffrey Pullum, Barbara Scholz (challenging simplistic POS arguments in linguistics), and researchers emphasizing statistical learning (e.g., connectionists, probabilistic modelers) have long highlighted this flaw. Your "carving" is spot-on.
