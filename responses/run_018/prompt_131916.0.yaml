  The bootstrapping problem ties in here. To avoid regress, you'd need a base layer where rules are accepted without justification. But how do you choose that base? If you say "only atomic Q," you're already making a logical assumption about what's fundamental. That feels circular—you're using logic to define logic's foundation. Plus, in practice, logic systems need to handle complex statements, so restricting to atomic Q cripples reasoning. 

