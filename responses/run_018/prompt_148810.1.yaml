answer: |-
  ## Fellowship Proposal Draft: System-Directed Reactive Attitudes & the Future of Strawsonian Compatibilism

  **1. The Precise Question (~150 words):**
  The core question is this: **Can Peter Strawson’s reactive attitudes framework adequately accommodate robust, genuinely *reactive* (i.e., participant, morally engaged) attitudes directed at social structures, institutions, or collectives ("systems"), without collapsing them into the objective attitude or illegitimately reducing them to attitudes towards individuals?** Current interpretations get stuck because Strawson’s framework assumes reactive attitudes fundamentally require seeing the target *as a participant agent* capable of goodwill/ill-will. Systems aren't agents in that sense. The usual responses are unsatisfactory: either (a) dismiss system-directed resentment as confused or metaphorical (overlooking its distinct phenomenology and role), (b) reduce it to attitudes towards individual members (ignoring the target's irreducibly systemic nature), or (c) force it into the objective attitude (denying its genuinely moral, reactive "sting"). None capture the unique way we *hold systems morally answerable*.

  **2. The Angle (~150 words):**
  Focusing on system-directed reactive attitudes (SDRAs) isn't just adding another example; it's a crucial methodological pivot. It exposes a potential blind spot in Strawson’s core dichotomy. The individual-to-individual model implicitly assumes agency is the *only* locus for reactive engagement. SDRAs challenge this by demonstrating that our moral responsibility practices extend beyond interpersonal agency to encompass *structured social entities* we interact with as moral participants. Analyzing SDRAs forces us to ask: **What are the *necessary conditions* for something to be a fitting target of a reactive attitude *as such*, beyond individual agency?** This moves the debate beyond stale determinism vs. free will arguments by probing the *structure* of our responsibility practices themselves. Does Strawson’s reactive/objective binary capture the full spectrum of our moral engagement with the world, or is a third category needed?

  **3. Month-by-Month Method (~200 words):**
  *   **Month 1-2: Conceptual Groundwork & SDRA Taxonomy:** Rigorously define "system-directed reactive attitudes" (SDRAs) – distinguishing them from individual-directed attitudes, generalized resentment, and objective assessments. Develop a taxonomy (e.g., institutional indignation vs. collective moral disappointment vs. structural resentment) based on target type and attitudinal character. Analyze paradigmatic examples (e.g., outrage at a discriminatory institution, deep disappointment in a failing university system).
  *   **Month 3-4: Pressure-Testing Against Strawson's Framework:** Systematically apply Strawson’s reactive/objective criteria to SDRAs. Do SDRAs involve suspension based on excusing/justifying conditions? Do they manifest the "involuntariness" and demand for recognition Strawson identified? Crucially, *can* they be consistently placed within the reactive *or* objective attitude without distortion?
  *   **Month 5: Comparison & Revision:** Contrast the findings with one key alternative framework (e.g., Philip Pettit's discursive/collective responsibility, or Marion Smiley's structural blame). Does their approach better handle SDRAs? Synthesize insights to argue *for* revising Strawson: proposing a "structured-reactive attitude" category characterized by holding *systems* morally answerable for their *function or impact* within the participant stance, distinct from individual goodwill/ill-will but irreducible to the objective.
  *   **Month 6: Synthesis & Drafting:** Integrate analysis, refine the revised framework (reactive / **structured-reactive** / objective), and articulate its implications for compatibilism and responsibility theory broadly.

  **4. Success vs. Failure (~100 words):**
  *   **Success:** Demonstrating that SDRAs are a distinct, irreducible category of genuinely reactive attitudes. Showing that Strawson’s binary *must* be revised (to include structured-reactive attitudes) to accurately capture our moral practices, thereby *strengthening* compatibilism by making it more descriptively adequate for complex social realities. A clear, defensible account of what makes systems (as opposed to individuals) fitting targets for reactive attitudes emerges.
  *   **Failure:** If SDRAs consistently collapse into either individual-directed reactive attitudes (under reductionism) or the objective attitude (losing their reactive character), or if no coherent criteria for a distinct "structured-reactive" category can be established, leaving Strawson’s original framework essentially unchallenged. Failure would also occur if the proposed revision adds no explanatory power over existing collective responsibility accounts.

  **5. Scope and Deliverable (~100 words):**
  This 6-month project focuses on conceptual analysis within moral psychology and responsibility theory. The primary deliverable is a substantial, polished journal article draft (approx. 8,000-10,000 words) presenting the argument for recognizing and theorizing SDRAs and the consequent revision of Strawson’s framework. A useful outcome provides responsibility theorists with a sharper, more sociologically attuned compatibilist toolkit, clarifying how we hold complex social entities morally accountable without metaphysical libertarianism. It offers a novel lens for analyzing real-world phenomena like institutional betrayal or demands for systemic justice.
