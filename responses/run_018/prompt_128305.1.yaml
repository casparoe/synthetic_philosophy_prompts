answer: |-
  ## Commencement Address: We Begin at the Boundary

  Friends, graduates, honored guests, members of our newly constituted demos – all who have gathered here today on this ground, beneath this sky, connected by threads visible and invisible: welcome.

  We stand at a threshold. You graduates, poised between the familiar contours of this university and the unfolding map of your futures. And we, as an institution, stand at a threshold of our own making. Just recently, we embarked on an audacious experiment: the Nested Demos Charter. It is an acknowledgment, etched into our governance, that the question echoing through centuries of political thought – *Who truly belongs? Whose voice matters?* – is not merely theoretical. It lives here, in the water we drink, in the stone of our oldest halls, in the lives yet unlived that our choices today will shape.

  Look around you. This commencement is itself a boundary moment. A line drawn between student and alumna, between learner and contributor. But the boundaries we wrestle with now run deeper. They encompass the residents whose lives downstream depend on the health of the watershed feeding our taps. They reach back to the laborers whose sweat and skill raised these very buildings in the 1890s, whose descendants now hold a formal place at our table. And they stretch forward, fifteen years and more, to teenagers not yet chosen, whose world will be irrevocably marked by the research priorities we debate in committee rooms today.

  To the democratic theorists among us, I see your thoughtful nods – and perhaps your skeptical eyebrows. This charter doesn’t pretend to resolve your lifelong debates. It doesn't claim to have perfectly solved the boundary problem. How could it? We feel the tensions: watershed residents wielding veto over environmental policy, but not curriculum; the future cohort proposing research trajectories, yet absent from tuition votes. These are deliberate asymmetries, messy compromises acknowledging that "affected interests" and "being subject to coercion" are complex, overlapping circles, rarely concentric. It grants standing to those not yet born, a profound leap demanding humility, knowing we act as imperfect stewards for voices we cannot truly hear. This charter is not an end point. It is a *beginning*. A provocation. A statement that our community refuses to be defined by the easiest lines to draw.

  And to our graduates, your families, our neighbors – you who may not parse the footnotes of democratic theory, but who live its realities every day – this charter speaks to you too. It says your university recognizes that its impact ripples far beyond the lecture hall and the lab. It touches the water flowing into homes miles away. It rests on foundations built by hands long gone. It shapes a future that belongs to children playing in local parks right now, oblivious to the decisions made here. Your education happened within these expanding boundaries. You learned not just from textbooks and professors, but from the very challenge of figuring out how to live, work, and make decisions alongside people whose connection to this place is profoundly different from your own. That *is* the work of democracy – not a clean theory, but a lived practice.

  Graduates, you leave us at this potent, imperfect moment. You leave not with a map of settled territories, but with a compass calibrated by complexity. The world you enter is full of contested boundaries – political, social, environmental, ethical. The Nested Demos Charter is our institution’s messy, courageous attempt to grapple with just one facet of that. It teaches us that belonging is multifaceted. That responsibility stretches backward and forward in time. That building a just community means constantly asking: *Who is missing? Whose stake have we overlooked? How do we hold power accountable not just to the present, but to the past that shaped us and the future we are shaping?*

  This is the profound discomfort, and the profound hope, we bequeath to you. Do not fear boundaries because they are contested. Engage them. Challenge the easy exclusions. Listen for the voices carried by the river, echoed in the old brickwork, whispered from a future you may never see. Honor the legacy you inherit, not by preserving it unchanged, but by building upon it with the same courage and care shown by those 1890s laborers. Advocate fiercely for that future cohort, whose interests you must represent not because they can vote today, but because fundamental justice demands it.

  Your diploma is not just a certificate of knowledge gained; it is a toolkit for navigating the boundaries you will inevitably encounter and help redefine. Carry the spirit of this experiment with you. Be the ones who ask the difficult questions of belonging. Be the ones who build bridges where others see only divides. Be the ones who understand that true community, true democracy, begins precisely at the boundary – where we acknowledge the other, the unseen, the not-yet, and choose to include them anyway.

  Congratulations, Class of [Year]. Go forth and build worlds worthy of the complex, interconnected, beautifully boundary-crossed reality we are all trying to navigate, together.
