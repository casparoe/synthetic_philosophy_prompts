prompt: |-
  I have recently been appointed senior conservation compliance officer at the National Museum of Material Culture, and over the past quarter I have found myself adjudicating the same metaphysical dispute in different guises: when a restoration proposal replaces part of an artifact's substance, does the object remaining in our vaults still count as the same work for insurance valuation, exhibition labeling, and heritage-law documentation? The issue became personally urgent after a disagreement with our legal counsel over a restored ceramic urn, and it was sharpened further in a conversation with a colleague who had audited a seminar on metaphysics and mentioned the classic statue-and-clay distinction—the idea that an artwork and the matter constituting it can occupy the same region yet have different persistence conditions, so that destroying the clay need not destroy the statue and vice versa. I now see that my team has been applying an implicit, unexamined theory of material constitution, and I need it made explicit, reusable, and runnable by staff who have no philosophical training.

  Please construct a decision procedure my team can apply to any restoration proposal in about thirty minutes, grounded in the framework of material constitution but translated into practical steps. The deliverable should be an ordered sequence of questions with what counts as a sufficient answer to each, clear stopping points where the answer is no and the object is no longer the original work, and explicit flags where the decision is one of curatorial values—such as whether artistic authenticity requires causal continuity with the maker's hand—rather than empirical fact. The procedure must distinguish the persistence conditions of the artwork as an intentional object (form, artistic function, historical identity) from those of the material substrate, and it must handle the hard case in which the original material is entirely replaced but the form and function are preserved by an expert restorer using period-appropriate techniques. Apply it to three proposals: first, a ceramic vessel from the 1700s in which thirty percent of the original clay has been replaced with chemically identical but newly fired material; second, a bronze equestrian monument in which the original bronze was melted down due to structural failure and then recast into the identical form using the original molds; and third, a marble relief in which only five percent of the stone was replaced, but the replacement is a modern synthetic composite that alters surface reflectivity in a viewer-noticeable way. For the bronze recasting case in particular, I want to see exactly what the procedure outputs even if it conflicts with my own curatorial intuition that the monument has been lost. Finally, state precisely what the procedure cannot settle—where it will necessarily misfire, which metaphysical distinctions it suppresses to remain usable, and which judgments must still be referred to a senior officer with authority over the collection.
reasoning: |-
  We are constructing a decision procedure for the persistence of an artwork through restoration. The key is to distinguish between the artwork as an intentional object (with its form, function, and historical identity) and the material substrate. We'll use a series of questions that progressively address the conditions for the artwork's persistence.

  The procedure is designed to be applied in about 30 minutes and should be usable by staff without philosophical training.

  ### Decision Procedure: Artwork Persistence After Restoration

  #### Step 1: Material Replacement Threshold
  **Question:** Has less than 50% of the original material (by volume and structural significance) been replaced?
  - **Sufficient Answer:** 
    - *Yes*: Proceed to Step 2.
    - *No*: Proceed to Step 3.
  - **Stopping Point:** If the answer is *No* and Step 3 does not override, then the object is not the original work.

  *Rationale: We set a threshold to flag cases with substantial material loss. However, note that even above 50% replacement, the artwork might persist if other conditions are met (Step 3).*

  #### Step 2: Function and Form Preservation
  **Question:** Has the restoration preserved the original form and function of the artwork to the degree that an expert observer (with knowledge of the original) would consider it functionally and formally continuous?
  - **Sufficient Answer:**
    - *Yes*: Proceed to Step 4.
    - *No*: The object is not the original work. Stop.
  - **Stopping Point:** If *No*, then the artwork has not persisted.

  *Rationale: Even with little material replacement, if the form or function is altered, the artwork may be lost. This step captures the intentional object's continuity.*

  #### Step 3: Substantial Replacement with Form and Function Preservation
  **Question:** (Only if Step 1 was *No*) Despite substantial material replacement, has the original form and function been preserved by using period-appropriate techniques and materials, and is the restored object causally connected to the original creative act (e.g., through the original molds, plans, or a direct restoration chain)?
  - **Sufficient Answer:**
    - *Yes*: Proceed to Step 4.
    - *No*: The object is not the original work. Stop.
  - **Stopping Point:** If *No*, then the artwork has not persisted.

  *Rationale: This step handles the hard case of complete or near-complete material replacement but where the artwork's form and function are preserved and there is a causal link to the original creation.*

  #### Step 4: Historical and Causal Continuity
  **Question:** Is there an unbroken chain of possession and causal connection to the original creation event (i.e., the artwork has not been destroyed and reconstituted from scratch, but has been continuously maintained and restored)?
  - **Sufficient Answer:**
    - *Yes*: Proceed to Step 5.
    - *No*: The object is not the original work. Stop.
  - **Stopping Point:** If *No*, then the artwork has not persisted.

  *Rationale: This step addresses the historical identity of the artwork. Even if materially replaced, if the object has been continuously treated as the same artwork and there is a causal chain linking back to the original creation, it may persist.*

  #### Step 5: Authenticity and Curatorial Values
  **Question:** Does the restoration preserve the essential artistic or historical properties that the institution deems necessary for authenticity? (This is a curatorial value judgment and must be made by a senior officer.)
  - **Sufficient Answer:**
    - *Yes*: The object is the original work.
    - *No*: The object is not the original work.
  - **Flag:** This step is explicitly a curatorial value judgment. It requires input from a senior officer with authority over the collection. Factors include:
    - Whether the institution values the causal continuity with the maker's hand (original material) as essential.
    - Whether the restoration has altered properties (e.g., aesthetic, historical) that are central to the artwork's identity.

  *Rationale: Some institutions may hold that the original material is essential for authenticity, regardless of form and function. This step allows for that institutional policy.*

  ### Application to Cases

  #### Case 1: Ceramic Vessel (1700s)
  - **Step 1:** 30% replacement (less than 50%) → *Yes* → Step 2.
  - **Step 2:** Form and function preserved? → *Yes* (assuming expert restoration) → Step 4.
  - **Step 4:** Unbroken chain of possession and causal connection? → *Yes* (it's the same vessel, continuously in the collection) → Step 5.
  - **Step 5:** Curatorial judgment: If the institution values the original material, then the 30% replacement might be acceptable without loss of authenticity. But if the institution requires a high threshold of original material, it might be questioned. However, 30% is below the threshold and form/function are preserved, so likely *Yes* → **Original work.**

  #### Case 2: Bronze Equestrian Monument (melted and recast)
  - **Step 1:** 100% replacement (well above 50%) → *No* → Step 3.
  - **Step 3:** Form and function preserved? → *Yes* (same form from original molds). Causal connection? → *Yes* (using original molds, so connected to the original creation) → Step 4.
  - **Step 4:** Unbroken chain? → *Yes* (the monument was never considered destroyed and the recasting was part of restoration) → Step 5.
  - **Step 5:** Curatorial judgment: This is the hard case. The procedure leads to Step 5, meaning the decision rests on institutional values. If the institution holds that the original material is essential (even if the form is perfectly preserved and the causal chain is unbroken), then it may be judged not original. However, if the institution values the form and the causal connection (via the original molds) as sufficient, then it may be considered original. 
    - *But note: The procedure does not automatically say "not original" at Step 1 because Step 3 provides an override. However, the user's curatorial intuition (that the monument is lost) would be captured in Step 5 by answering "No". The procedure thus outputs: **Not original if Step 5 is answered No, but Original if Step 5 is answered Yes.***

  #### Case 3: Marble Relief (5% replacement with modern composite)
  - **Step 1:** 5% replacement → *Yes* → Step 2.
  - **Step 2:** Form preserved? Function? → *No*, because the replacement alters surface reflectivity in a viewer-noticeable way. This affects the aesthetic form. → **Not original.** Stop.

  ### What the Procedure Cannot Settle
  1. **Metaphysical Distinctions Suppressed:** 
     - The procedure does not deeply engage in the statue/clay distinction. It treats the artwork as having both material and intentional aspects but collapses the distinction into practical steps. It assumes that the artwork can persist through material change if form, function, and causal chain are preserved.
     - It does not resolve the metaphysical debate about whether the artwork is identical to the material or a distinct entity. Instead, it uses a hybrid approach.

  2. **Where it Misfires:**
     - Cases where the form is preserved but the material replacement alters the artwork in a way that is not functionally apparent but is historically or scientifically significant (e.g., isotopic composition that affects dating). The procedure relies on expert observation for form and function, but not on imperceptible properties.
     - Cases of gradual replacement over time (like the Ship of Theseus) where the procedure might lead to conflicting results if applied at different stages.

  3. **Judgments Requiring Senior Officer:**
     - Step 5 is explicitly a curatorial value judgment and must be made by a senior officer. The procedure cannot settle the weighting of factors such as:
       - The importance of original material versus form and function.
       - The definition of "essential artistic or historical properties."
     - Cases where the causal chain is ambiguous (e.g., if the artwork was lost and then recreated from documentation) must be referred.

  ### Final Note
  The procedure is designed to be a practical tool that makes explicit the implicit theories of material constitution. It is not a philosophical resolution but a framework for consistent decision-making. Staff should be trained to understand the key concepts (form, function, causal chain) and to recognize when to escalate to Step 5 (curatorial judgment).
answer: |-
  ### Artwork Persistence Decision Procedure  
  **Purpose:** To determine if a restored artifact remains the original work for institutional purposes, distinguishing the artwork (intentional object: form, function, historical identity) from its material substrate.  

  ---

  ### Step-by-Step Procedure  
  *Apply sequentially. Maximum time: 30 minutes.*  

  #### **Step 1: Material Continuity Threshold**  
  **Question:** *Is ≥50% of the original material (by volume and structural significance) retained in the restored artifact?*  
  - **Sufficient Answer:**  
    - **Yes** → Proceed to **Step 2**.  
    - **No** → Proceed to **Step 3**.  
  - **Stopping Point:** None yet.  
  - **Rationale:** Quantifies material loss. Below 50% triggers scrutiny of non-material factors.  

  ---

  #### **Step 2: Form and Functional Fidelity**  
  **Question:** *Does the restoration preserve the artifact’s original form (shape, design, structural integrity) and artistic/cultural function (e.g., vessel as container, statue as monument) such that an expert observer would recognize it as functionally continuous with the pre-restoration object?*  
  - **Sufficient Answer:**  
    - **Yes** → Proceed to **Step 4**.  
    - **No** → **STOP: Not the original artwork.**  
  - **Stopping Point:** Failure here ends the procedure. The artifact is a replica or derivative work.  
  - **Flag:** Curatorial values may influence "expert observer" standards (e.g., tolerances for surface imperfections).  

  ---

  #### **Step 3: Substantial Replacement Override**  
  *(Triggered only if Step 1 = No)*  
  **Question:** *Despite significant material loss, are **all** the following true?*  
    - *(a) The restoration perfectly replicates the original form using period-appropriate techniques/materials.*  
    - *(b) The restoration relies on direct causal links to the original creation (e.g., original molds, schematics, or restorer’s intent to preserve identity).*  
    - *(c) The artifact’s historical narrative (provenance, exhibition history) remains unbroken.*  
  - **Sufficient Answer:**  
    - **Yes** → Proceed to **Step 4**.  
    - **No** → **STOP: Not the original artwork.**  
  - **Stopping Point:** Failure here concludes the artwork is lost.  
  - **Flag:** (a) and (b) are empirical; (c) involves curatorial judgment of historical continuity.  

  ---

  #### **Step 4: Authenticity and Value Assessment**  
  **Question:** *Does the institution’s definition of authenticity require unbroken physical continuity with the maker’s hand (i.e., is original material essential to the work’s identity)?*  
  - **Sufficient Answer:**  
    - **Yes** → **STOP: Not the original artwork** if Steps 1-3 flagged material loss.  
    - **No** → **Proceed to Step 5.**  
  - **Flag:** Purely **curatorial values**. Senior officer must decide based on:  
    - Institutional policies (e.g., strict conservation vs. functional preservation).  
    - Stakeholder expectations (e.g., public trust, donor agreements).  
    - Legal/insurance definitions of "original."  

  ---

  #### **Step 5: Final Persistence Verdict**  
  **Question:** *Has the procedure reached this step without a "STOP" and with all prior answers satisfied?*  
  - **Sufficient Answer:**  
    - **Yes** → **Original artwork persists.**  
    - **No** → **Not the original artwork.**  
  - **Output:** Document rationale for each step. Flag any curatorial judgments (Steps 2c, 4).  

  ---

  ### Application to Cases  
  #### **Case 1: Ceramic Vessel (1700s)**  
  - **Step 1:** 30% replaced → **Yes** (≥50% original material retained).  
  - **Step 2:** Form/function preserved → **Yes**.  
  - **Step 4:** Authenticity requirement? → **Curatorial input:** If original material is non-essential → **Original artwork.**  
  - **Verdict:** **Original** (assuming institution prioritizes form/function over material).  

  #### **Case 2: Bronze Equestrian Monument (Recast)**  
  - **Step 1:** 100% replaced → **No** (<50% original material).  
  - **Step 3:**  
    - (a) Form replicated identically? → **Yes** (original molds used).  
    - (b) Causal link? → **Yes** (molds tie to original creation).  
    - (c) Unbroken history? → **Yes** (same site, same institutional custody).  
  - **Step 4:** Authenticity requirement? → **Curatorial input:** *If original material is essential* → **Not original.** *If form/history prevail* → **Original.**  
  - **Procedure Output:** **Original artwork persists** (due to Step 3 override).  
    - *Note:* Conflicts with your intuition; procedure prioritizes form and causal continuity over material.  

  #### **Case 3: Marble Relief (5% Composite Replacement)**  
  - **Step 1:** 5% replaced → **Yes** (≥50% original material).  
  - **Step 2:** Form/function preserved? → **No** (altered reflectivity changes aesthetic function).  
  - **Verdict:** **Not the original artwork.**  

  ---

  ### Limitations and Unresolvable Cases  
  1. **Where It Misfires:**  
     - **Gradual Replacement (Ship of Theseus):** The procedure cannot handle iterative restorations where material is replaced incrementally (e.g., 1% per year). Applying it at a single point may misjudge persistence.  
     - **Ambiguous Causal Links:** If original molds are lost and replicas are created from scans, Step 3(b) becomes subjective.  
     - **Epistemic Uncertainty:** When pre-restoration documentation is poor, Steps 2-3 rely on probabilistic assessments.  

  2. **Suppressed Metaphysical Distinctions:**  
     - **Statue vs. Clay:** The procedure treats the artwork as a "hybrid" of form and matter, ignoring scenarios where destroying the clay spares the statue (or vice versa).  
     - **Temporal Parts:** It assumes artworks are whole entities, not four-dimensional "worms" (ignoring debates about temporal identity).  

  3. **Mandatory Referrals to Senior Officer:**  
     - **Step 4 (Authenticity):** All cases where original material is partially/completely replaced.  
     - **Step 3(c) (Historical Narrative):** Disputes about unbroken provenance (e.g., looted artifacts).  
     - **Conflicting Institutional Values:** If insurance requires material continuity but exhibitions prioritize form.  

  ---

  ### Final Notes  
  - **Staff Training:** Focus on recognizing "form/function" (Step 2), "causal links" (Step 3b), and "curatorial flags."  
  - **Documentation:** Record answers verbatim; senior officer reviews all Step 4 decisions.  
  - **Evolving Use:** Revise every 3 years to incorporate new case law/metaphysical insights.  

  This procedure transforms abstract constitution theory into actionable policy, privileging practicality over philosophical purity. It accepts that some judgments (e.g., Step 4) are institutional, not empirical.
