prompt: |-
  You are an expert philosopher of science with deep familiarity with scientific modeling, idealization, and the epistemology of applied forecasting. Before you construct anything, please think carefully and begin with a brief brainstorming session: list the core distinctions between acceptable idealization and damaging misrepresentation in predictive models, note where Friedman's instrumentalist defense of unrealistic assumptions succeeds and where critics (for example, those who stress structural realism or causal fidelity) press back, and identify which of those distinctions can survive translation into a practical checklist. Once that is done, proceed to the deliverable.

  I am a retired physical chemist who has recently turned to philosophy of science. I now serve on a regional advisory board that reviews coupled hydrological-agricultural forecasting models used for watershed-policy decisions. These models are full of unrealistic assumptions—spatially uniform soil permeability in heterogeneous terrain, farmer agents with perfect information and pure profit-maximization, linearized climate-feedback loops at regional scales. The board needs a reusable decision procedure, grounded in the philosophy of unrealistic assumptions including the so-called F-twist and its main objections, to classify each unrealistic element as either an acceptable computational fiction or a problematic representational distortion.

  Please write a formal, step-by-step procedure that my board—composed of scientists and local officials without philosophy training—can actually run on a proposed model. The procedure should include:

  1. An ordered sequence of tests or questions, with explicit criteria for what counts as a sufficient answer at each stage.
  2. A precise working distinction, tailored to this applied context, between a "computational fiction" (an unrealistic algorithmic shortcut that does not misrepresent the causal structure bearing on the policy-relevant prediction) and a "representational distortion" (a false ontological or causal claim that undermines the model's reliability for the decision at hand).
  3. Clear stop points: where the procedure issues a recommendation to accept, revise, or reject the model; where it flags an assumption for conditional approval with monitoring; and where it must hand the decision to human judgment because the conflict is one of values or risk tolerance rather than epistemic assessment.
  4. Worked applications to three cases: (a) treating soil permeability as uniform in a flood-runoff model; (b) assuming perfect-information rational-actor behavior in an irrigation-demand submodel; and (c) a hypothetical new proposal in which a model treats regional climate feedback as linear for five-year projections despite well-established nonlinearity at longer scales.
  5. An honest accounting of where the procedure will misfire, where judgment calls are disguised as procedural steps, and what kinds of policy stakes should trigger a more conservative default.

  Do not provide bibliographies, reading lists, or citations. You may refer to well-known philosophical positions in your own paraphrase, but do not use verbatim quotation marks around any passage from a real text. Keep the language formal, precise, and suitable for a board document.
reasoning: |-
  Okay, the user wants me to create a decision procedure for evaluating unrealistic assumptions in forecasting models. They're a retired physical chemist now working on a watershed policy board, so they need something practical but philosophically grounded. 

  First, I need to unpack the philosophical foundations. Friedman's instrumentalism says unrealistic assumptions are fine if the model predicts well. But structural realists would argue that models need to capture actual causal structures. For watershed models, this tension matters because policy decisions affect real communities and ecosystems.

  The core challenge is distinguishing between harmless computational shortcuts and dangerous distortions. A good shortcut simplifies calculations without altering causal relationships critical to predictions. A distortion falsifies key mechanisms, making predictions unreliable even if they occasionally match data.

  I recall Cartwright's critiques about models needing "nomological machines" - reliable patterns that persist across contexts. For watershed models, this means checking whether assumptions break the causal chains that generate outcomes. Also, Winsberg's work on modeling trade-offs is relevant - sometimes inaccuracies in one part compensate for others.

  For the procedure, it should start by identifying policy-critical predictions, then map causal pathways. The key test is whether an assumption preserves the input-output relationships that determine those predictions. If removing the assumption would require fundamentally different mechanisms, it's probably a distortion. 

  The three test cases help ground this: uniform soil permeability might be acceptable if flow aggregates correctly, but perfect-information farmers could distort behavioral responses to policy changes. Climate linearity is tricky - it might work short-term but fail catastrophically at tipping points.

  I need to build in off-ramps where philosophical disagreements become value judgments. Like when to accept extrapolation risks - that's not epistemology, it's risk tolerance. The procedure should flag those for human deliberation.

  The misfires section must be honest. No checklist catches everything. If assumptions interact nonlinearly or novel policies change system behavior, the procedure could approve flawed models. High-stakes decisions should default to more scrutiny.

  Finally, language must stay board-friendly. No jargon like "nomological machines" - just "causal chains" or "core mechanisms". And no citations, just woven-in ideas.
answer: |-
  ## Formal Procedure for Evaluating Unrealistic Assumptions in Hydrological-Agricultural Forecasting Models

  **Philosophical Grounding:** This procedure distinguishes **computational fictions** (unrealistic elements serving as algorithmic tools that preserve the causal relationships relevant to policy outcomes) from **representational distortions** (unrealistic elements that misrepresent key causal structures, undermining predictive reliability for the decision context). It synthesizes instrumentalist views (valuing predictive output over representational fidelity) with critiques emphasizing that reliable prediction often requires models to structurally approximate core causal mechanisms. The F-Twist (unrealistic assumptions are acceptable if predictions succeed) is accepted only when predictive success demonstrably arises *despite* the distortion, not because of fortuitous error cancellation, and when the causal structure relevant to the policy question remains intact.

  **Core Definitions:**
  1.  **Computational Fiction (Acceptable Idealization):** An unrealistic assumption that:
      *   Serves a clear algorithmic, computational, or conceptual simplification purpose.
      *   Does not materially alter the model's representation of the *causal pathways* leading to the specific policy-relevant predictions.
      *   Is expected to produce outputs functionally equivalent (within policy tolerance) to a more realistic representation *for the specific prediction targets and policy context*.
  2.  **Representational Distortion (Problematic Misrepresentation):** An unrealistic assumption that:
      *   Significantly misrepresents the ontological nature or causal relationships of key entities or processes *within the domain relevant to the policy prediction*.
      *   Introduces spurious causal links, severs necessary causal links, or fundamentally alters the sensitivity of the prediction to key drivers.
      *   Creates a significant risk of prediction failure or systematic bias under the conditions relevant to the policy decision, especially under extrapolation or novel interventions.

  **Step-by-Step Evaluation Procedure:**

  1.  **Identify Policy-Relevant Prediction (PRP):**
      *   *Question:* What specific outcome(s) is this model being used to predict for this watershed policy decision? (e.g., "Peak flood discharge at gauge X under 50-year rainfall scenario," "Average seasonal irrigation water demand under drought conditions," "Change in aquifer level after 10 years under proposed land-use policy Y").
      *   *Sufficient Answer:* A precise, quantifiable prediction target directly tied to a pending policy choice. *Stop if unclear:* Procedure cannot proceed without defined PRP. Require modelers to specify PRP.

  2.  **Map Core Causal Pathway (CCP) for the PRP:**
      *   *Question:* What are the key entities, processes, and causal links demonstrably necessary to generate the PRP based on established scientific understanding? (e.g., For flood runoff: rainfall intensity/duration -> infiltration rate (soil-dependent) -> surface runoff generation -> channel flow -> peak discharge).
      *   *Sufficient Answer:* A simplified diagram or list identifying the major causal drivers and mechanisms directly leading to the PRP, grounded in domain science (hydrology, agronomy, climatology). *Flag:* If the CCP relies on poorly understood mechanisms, note higher uncertainty and proceed with caution.

  3.  **Locate Assumption in CCP & Context:**
      *   *Question:* Where does the specific unrealistic assumption under review fit within the CCP? What entity, process, or relationship does it simplify or alter? What is its stated purpose (e.g., reduce runtime, enable solution, aggregate complexity)?
      *   *Sufficient Answer:* Clear placement of the assumption within the CCP diagram/list and identification of its computational/algorithmic role.

  4.  **Test 1: Causal Fidelity Check (Is the distortion causal?)**
      *   *Question:* Does this assumption fundamentally misrepresent the *nature* of a key entity/process or *sever/alter a critical causal link* within the CCP? (Focus on *how* the output is generated).
      *   *Criteria:*
          *   **Pass (Likely Fiction):** The assumption simplifies *without* breaking core causal dependencies relevant to the PRP. Output remains causally sensitive to the correct primary drivers identified in the CCP. (e.g., Aggregating soil types simplifies calculation but preserves the *functional relationship* between rainfall, aggregate soil properties, and runoff *volume*).
          *   **Fail (Likely Distortion):** The assumption introduces an entity/process that doesn't exist, ignores a necessary one, or creates a spurious causal relationship within the CCP. Output sensitivity is directed towards incorrect drivers or immune to correct ones. (e.g., Assuming farmers ignore water prices when making irrigation decisions severs a key causal link for demand prediction under pricing policies).
      *   *Stop/Flag:* **Fail** strongly indicates a **Representational Distortion.** Recommend revision/rejection unless compelling evidence (see Step 5) overrides. *Proceed to Step 5 if Pass.*

  5.  **Test 2: Predictive Robustness Check (Does the fiction hold?)**
      *   *Question:* Despite passing Test 1, is there evidence that this specific simplification reliably produces sufficiently accurate predictions *for the PRP* under conditions relevant to the policy? Consider:
          *   Empirical validation against historical data specific to the PRP.
          *   Sensitivity analysis showing PRP is insensitive to relaxing the assumption within policy tolerance.
          *   Comparison showing outputs converge with more realistic models for the PRP.
          *   Theoretical justification for why the simplification holds for the PRP's scope (scale, timeframe, intervention type).
      *   *Criteria:*
          *   **Pass (Confirmed Fiction):** Strong evidence (e.g., robust validation, low sensitivity, convergence) supports predictive adequacy *specifically for the PRP and policy context*. The F-Twist justification is empirically/theoretically grounded.
          *   **Conditional Pass (Provisional Fiction):** Evidence is suggestive but incomplete (e.g., limited validation scope, moderate sensitivity, plausible theory but untested). Predictive adequacy is plausible but uncertain.
          *   **Fail (Suspected Distortion):** Evidence is weak, contradictory, or shows significant sensitivity/prediction error traceable to the assumption. The F-Twist justification is speculative.
      *   *Stop/Flag:*
          *   **Pass:** Flag assumption as **Acceptable Computational Fiction**. No further review needed for this element.
          *   **Conditional Pass:** Flag as **Conditionally Acceptable - Requires Monitoring.** Approval contingent on: (1) Specific plan for targeted validation/monitoring related to this assumption's impact on the PRP. (2) Explicit acknowledgement of the uncertainty in board documentation.
          *   **Fail:** Flag as **Suspected Representational Distortion.** Recommend revision. If revision is impractical, proceed to Step 6 for risk assessment.

  6.  **Risk Tolerance Gate (Judgment Call):**
      *   *Question:* For assumptions flagged as "Suspected Distortion" or "Conditional - Requires Monitoring," what are the potential consequences if the distortion/monitoring uncertainty leads to prediction failure *for this specific policy decision*? How severe and irreversible are these consequences (Ecological damage? Economic loss? Public safety risk?)? What is the board's tolerance for this risk?
      *   *Criteria:* This is a value-laden, contextual judgment. No purely epistemic criteria apply.
      *   *Stop/Handoff:* **Human Judgment Required.** Based on the severity of potential harm from prediction error and the board's risk tolerance:
          *   *High Stake/Low Tolerance:* Reject model or require revision despite cost/delay.
          *   *Moderate Stake/Tolerance:* Accept "Conditional - Requires Monitoring" with stringent monitoring plan.
          *   *Low Stake/High Tolerance:* Accept "Suspected Distortion" with explicit, minuted acknowledgment of risk.
      *   *Output:* Documented justification for the decision based on risk assessment.

  **Worked Applications:**

  *   **Case (a) Uniform Soil Permeability (Flood Runoff Model):**
      *   PRP: Peak flood discharge at outlet under extreme rainfall.
      *   CCP: Rainfall -> Infiltration (Soil Permeability) -> Runoff Generation -> Channel Routing -> Peak Discharge.
      *   **Test 1 (Causal Fidelity):** The assumption aggregates spatial variability. Does it break core causality? *Pass:* The core causal link (Rainfall -> Reduced Infiltration due to soil limits -> Increased Runoff -> Discharge) remains intact, albeit with spatially averaged parameters. Sensitivity to *total* rainfall and *aggregate* soil properties is preserved.
      *   **Test 2 (Predictive Robustness):** Is peak discharge prediction robust? *Conditional Pass:* Depends on watershed heterogeneity. If soils are moderately variable, validation often shows acceptable peak discharge prediction (fiction holds). If highly variable (e.g., karst next to clay), prediction may fail (distortion). Requires evidence/watershed-specific assessment. *Outcome:* Likely "Conditional - Requires Monitoring" (e.g., calibrate aggregate permeability carefully, monitor performance in events).

  *   **Case (b) Perfect-Info Profit-Max Farmer Agents (Irrigation Demand):**
      *   PRP: Change in seasonal irrigation water demand after introducing a tiered pricing policy.
      *   CCP: Water Price Signal -> Farmer Perception/Information -> Decision Calculus (Cost/Benefit) -> Crop Choice/Irrigation Application -> Water Demand.
      *   **Test 1 (Causal Fidelity):** Does it break causality? *Fail:* The assumption fundamentally misrepresents the "Farmer Perception/Information" and "Decision Calculus" links. Real farmers have imperfect information, diverse goals (not just profit), and heuristic decision-making. The causal link between price signal and demand response is likely distorted (e.g., overestimating sensitivity, ignoring non-price factors like habit or risk aversion).
      *   **Stop:** **Representational Distortion.** Recommend revision (e.g., incorporate bounded rationality, heterogeneous objectives, information access). Proceed to Step 6 only if revision impossible.

  *   **Case (c) Linearized Climate Feedback (5-Year Projections):**
      *   PRP: Average summer temperature/Precipitation trend over next 5 years.
      *   CCP: GHG Forcing -> Atmospheric Response -> Regional Feedback Loops (e.g., albedo, humidity) -> Regional Temp/Precip.
      *   **Test 1 (Causal Fidelity):** Does linearity misrepresent? *Pass (Marginally):* For very short-term projections (5 yrs), established nonlinear feedbacks (e.g., permafrost melt threshold) may not yet dominate the trend signal compared to the linear forcing response. Core dependency on GHG forcing is retained.
      *   **Test 2 (Predictive Robustness):** Does it hold for 5-year PRP? *Conditional Pass (High Uncertainty):* While short-term trends may *appear* linear, the *risk* is that the model cannot signal proximity to known nonlinear thresholds that could be approached within 5 years but manifest later. Validation against past 5-year periods is insufficient proof for future states near thresholds. *Outcome:* **Conditional - Requires Monitoring (High Stakes).** Approval requires: (1) Explicit caveat that the model cannot predict abrupt changes potentially initiated within 5 years. (2) Active monitoring of leading indicators for key nonlinear feedbacks. (3) High-stakes decisions (e.g., major infrastructure) should trigger rejection or use of ensemble models with nonlinear dynamics.

  **Limitations & Honest Accounting:**

  1.  **Hidden Judgment Calls:** Identifying the "Core Causal Pathway" (Step 2) involves judgment on what is "core" and "necessary." "Policy tolerance" in Test 2 is inherently subjective. The Risk Tolerance Gate (Step 6) is fundamentally non-procedural.
  2.  **Misfires:** The procedure may:
      *   **Approve Harmful Fictions:** If interactions between multiple "acceptable" fictions create emergent distortions unseen in single-assumption tests.
      *   **Reject Useful Approximations:** If causal fidelity (Test 1) is judged too strictly for complex systems where perfect representation is impossible, potentially discarding pragmatically adequate models.
      *   **Miss Contextual Failure:** An assumption deemed a fiction for one PRP (e.g., average demand) becomes a distortion for a related PRP (e.g., demand volatility under stress).
      *   **Underestimate Extrapolation Risk:** Validation (Test 2) under historical conditions may not reveal failures under novel future conditions or unprecedented interventions the model is used to assess.
  3.  **Trigger for Conservatism:** Adopt a stricter interpretation of Tests 1 & 2 (demand stronger evidence, lower tolerance for Conditional Pass) when:
      *   Policy consequences of prediction error are severe, irreversible, or impact vulnerable populations.
      *   The model is used for significant extrapolation beyond calibration/validation domains (novel climates, radical policies).
      *   The system is known to exhibit threshold behaviors or high sensitivity near projected states.
      *   There is controversy or high uncertainty within the relevant scientific community about the core mechanisms.

  This procedure provides a structured, philosophically informed framework for evaluating unrealistic assumptions, promoting transparency and rigor in model assessment for watershed policy. Its consistent application, coupled with explicit acknowledgment of its limitations and the necessary role of expert judgment, will enhance the board's decision-making process.
