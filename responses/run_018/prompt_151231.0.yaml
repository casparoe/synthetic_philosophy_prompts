  ## Philosophy Department Adopts Four-Dimensional Employment Model, Sparks Existential HR Queries

  **OAKFORD, KS** – In a move hailed as "temporally coherent" by administrators and "existentially horrifying" by some staff, Oakford State University's Philosophy Department has formally transitioned its Human Resources policies to a framework based entirely on *perdurantism*, rejecting traditional *endurantist* views of employee persistence.

  Perdurantism holds that objects, including employees, are four-dimensional "space-time worms" extending through time, composed of distinct temporal parts (3D "stages"). The new HR manual, revised after a contentious faculty retreat titled "Being and Benefits: A Metaphysical Reckoning," now explicitly defines tenure as "the commitment to the continued extension of the faculty member's four-dimensional worm within the departmental spacetime manifold, barring catastrophic modal collapse or violations of the university's causal nexus."

  "The old model treated people like static lumps enduring unchanged through time – metaphysically naive and administratively cumbersome," explained Department Chair, Dr. Evelyn Rhize, via a memo dense with temporal logic symbols. "Now, terminating an employee isn't *firing a person*; it's simply deciding not to extend their worm beyond a certain temporal coordinate. It’s cleaner. More ontologically honest."

  The practical implications are manifold:
  *   **Firing:** An associate professor denied tenure last week was informed they were "not being extended past Q2 2024." Their office remains occupied by their current temporal stage until that point, creating awkward hallway encounters but simplifying severance calculations ("We pay the stage up to termination; the future worm is not our concern," clarified HR).
  *   **Plagiarism:** A recent investigation into stolen seminar notes collapsed when the committee ruled the disputed content constituted "shared mental properties across overlapping temporal stages of distinct academic worms within a sufficiently similar pedagogical light cone." Essentially, both professor and student were deemed overlapping temporal parts of a sufficiently similar educational process at that point.
  *   **Emeritus Status:** Retirement now involves a formal ceremony marking the cessation of the salaried temporal parts. However, Professor Emeritus status is literally defined as "the post-mortem persistence of the individual's worm within the department's collective memory and archival spacetime, subject to regular citation events."
  *   **Adjunct Pilot Program:** A parallel "Exdurantist Adjunct Pool" trial treats each semester-long contract as an instantaneous stage. Adjuncts are hired anew each term as "counterparts" linked by qualitative similarity and contractual convention, not strict identity. This allows the department to deny benefits or seniority claims. "We appreciate your work last Fall," a recent rejection letter stated, "but that was your Tuesday counterpart. The current stage applying for Spring healthcare lacks the necessary temporal contiguity to inherit benefits. Per policy 4.3.8 (Exd)."

  The transition hasn't been smooth. Endurantist Professor Bertrand "Bert" Stone filed a grievance claiming he was "technically fired in 2019" during a budget scare, but administration insists his worm was merely "flagged for potential truncation" and ultimately extended.

  "It’s absurd!" Stone fumed, gesturing emphatically with a coffee mug existing wholly in the present. "I *endure*! I am wholly present now, just as I was wholly present then! They can't claim the Bert Stone of 2019 was a different temporal part they axed, while forcing *this* Bert Stone – the very same enduring entity! – to keep attending department meetings and grading papers! I want my termination paperwork from five years ago recognized, or I want my worm's involuntary extension compensated! This perdurantist nonsense violates my fundamental sense of self... not to mention theire union contract!" he added, slamming down a slightly chipped mug – a distinct temporal part of the original, according to the new facilities policy.
