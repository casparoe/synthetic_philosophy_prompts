answer: |-
  The practice of epistemic modesty, wherein one tempers one's own "inside-view" reasoning by applying a calibration factor derived from the track records of peers or experts, demonstrably improves judgment in domains characterized by clear, observable outcomes and feedback loops, such as weather forecasting, market predictions, or clinical diagnoses. Here, the "outside view" provides an independent check against individual overconfidence, leveraging historical performance data as an objective anchor. However, this approach encounters a profound, potentially self-undermining difficulty when transposed to domains where the criterion of success is not an observable outcome but instead hinges on agreement with the hypothetical conclusions of a counterfactual, idealized deliberative process – such as determining what a fully rational agent possessing unlimited information *ought* to endorse. In this specific context, the very foundation required for meaningful outside-view calibration collapses.

  The core issue lies in the absence of an independent, non-circular criterion for assessing the "track record" of judgments concerning idealized deliberation. Success in this domain is defined not by matching reality but by matching the output of a purely conceptual procedure that has no direct behavioral footprint in the actual world. We cannot observe what this infinitely rational agent *actually* does; we can only reason about it internally. Consequently, the "outside view" in this realm is constructed entirely by aggregating the *inside-view judgments* of various individuals or groups *about* what this idealized agent would conclude. Attempting to calibrate one's own inside view by weighting it with an average of others' inside views becomes a process of averaging structurally identical biases, rather than correcting for them through reference to an independent standard. If the community of reasoners shares a common blind spot or systematic error in reasoning about the counterfactual deliberation, this error will be replicated in the aggregated "outside view," and applying a calibration coefficient derived from it will only propagate that error without offering genuine correction.

  This circularity renders the crucial calibration factor either undefined or arbitrarily fixed. For the factor to be meaningful, we require a non-circular method to rank the judgments of different agents as more or less "successful" in approximating the output of the idealized deliberation. Yet, any such ranking must itself rely on an *interpretation* of what the idealized deliberation entails – an interpretation that is, again, an inside-view judgment. There is no independent reality against which to measure these interpretations; the only available "data" consists of other interpretations. Therefore, any proposed calibration factor (e.g., weighting one's own view at 70% and the group average at 30%) cannot be justified by an appeal to demonstrable past accuracy relative to an objective benchmark, because no such benchmark exists. The factor becomes an arbitrary choice, reflecting perhaps social conformity or perceived authority, but lacking the epistemic grounding that makes the outside view powerful in empirical domains.

  It is essential to underscore that this challenge arises specifically where the standard of correctness – the indirect normativity – is defined by a counterfactual procedure (e.g., "what would an ideally rational agent believe?") rather than by conformity with actual, observable events or behaviors. The settled efficacy of epistemic modesty in domains with clear feedback loops stands in stark contrast to the genuinely contested nature of its applicability here. While it is established that balancing views improves forecasting against observable outcomes, it remains an open and debated question whether normative or philosophical domains – concerned with idealized rationality, morality, or abstract metaphysics – genuinely lack analogous feedback loops that could, even indirectly, ground an outside view. Some argue that coherence, practical implications, or convergence over refined deliberation might provide such grounding; others maintain that the fundamental disconnect from observable consequences creates an irreducibly circular predicament. Presenting either side of this debate as settled consensus would be inaccurate; the point is that *if* a domain truly lacks independent feedback, then the machinery of track-record-based epistemic modesty, reliant on an objective success criterion, becomes self-referential and loses its corrective power, collapsing into an averaging of unverified intuitions about an inaccessible ideal.
