answer: |-
  Your intuitions reveal a tension between consequentialism's demand for maximization and core human values like autonomy, integrity, and bodily sovereignty. Here are two principles that systematize most of your judgments, with trade-offs:

  ### Principle 1: **Core Integrity Preservation**
  > *Consequentialist demands cannot require permanent sacrifice of resources/constitutive commitments that fundamentally shape one’s identity, autonomy, or capacity for a minimally flourishing life.*

  ### Principle 2: **Bodily Sovereignty Threshold**
  > *Significant bodily intrusions (non-regenerative, risky, or autonomy-violating) cannot be demanded for impersonal good, barring catastrophic stakes.*

  ---

  ### How Your Cases Map:
  | Case | Your Judgment | Principles' Verdict | Notes |
  |------|---------------|---------------------|-------|
  | 1. Skip $6 latte | ✅ Required | ✅ **Permitted demand** | Trivial cost, no integrity/bodily impact |
  | 2. Live on min. wage | ❌ Not required | ✅ **Exempt** (Core Integrity) | Deprives minimal flourishing benchmark |
  | 3. Donate blood | ✅ Required | ✅ **Permitted demand** | Low risk, body regenerates |
  | 4. Donate kidney | ❌ Not required | ✅ **Exempt** (Bodily Sovereignty) | Non-regenerative, non-trivial risk |
  | 5. Volunteer 5-10h | ✅ Required | ✅ **Permitted demand** | Sustainable time sacrifice |
  | 6. Sell house ($200k) | ❌ Not required | ✅ **Exempt** (Core Integrity) | Home as identity-constitutive |
  | 7. Work extra 20h/wk ×10y | ❌ Not required? | ⚠️ **Inconsistent** | *Fails Core Integrity (see below)* |

  ---

  ### The Case 6 vs. 7 Tension Explained
  - **Case 6 (Sell House)** = Protects *integrity*: Your home anchors personal history, relationships, and identity. Liquidating it is a *fundamental rupture*.
  - **Case 7 (Extra Work)** = Violates *integrity*: Conscripting 20h/week for a decade invades your life structure. It turns your existence into a tool for utility, destroying autonomy and flourishing capacity.  
  *Your intuition likely treats time/agency as more sacred than fungible assets.*

  **Cost of Principle**: You must accept that **Case 7 is also exempt** (like Case 6). Demanding a decade of life-restructuring labor violates Core Integrity just as much as liquidating a home.

  ---

  ### New Cases Resolved:
  1. **Vaccine with 1/1000 risk to save strangers**  
     ✅ **Required** (Bodily Sovereignty not breached: minimal risk, no autonomy violation, body recovers).  
     *Contrasts with kidney donation (permanent loss, higher risk).*

  2. **Care for disabled family vs. charity work**  
     ✅ **Exempt from charity work** (Core Integrity): Family bonds are identity-constitutive. Sacrificing them for impersonal good violates integrity.  
     *Consequentialism may still demand some support (e.g., funding care), but not self-abnegation.*

  ---

  ### Philosophical Trade-offs
  - **You lose**: Strict maximization. Cases 2, 6, and 7 are exempt despite saving lives.  
  - **You gain**: Protection of moral agency. Without these carve-outs, consequentialism becomes self-defeating (e.g., burnout, resentment, loss of the very values motivating morality).  
  - **Boundary Issue**: "Minimally flourishing life" is context-dependent (e.g., $60k/year in NYC vs. rural India). This requires *deliberative refinement*, not rigid formulas.

  ### Key Insight
  Your discomfort stems from conflating two distinct limits:  
  🔸 **Sacrifices destroying your core self** (time/identity, e.g., Case 7)  
  🔸 **Sacrifices violating bodily boundaries** (e.g., Case 4)  
  Most traditional demandingness objections focus only on cost *magnitude* (e.g., "give until marginal utility equals recipients'"). Your principles instead focus on cost *type*—preserving what makes you a moral agent in the first place.
