prompt: |-
  I'm taking a graduate seminar on consciousness and explanation, and before I evaluate any specific account I need a rigorous specification of what such an account must actually deliver. Please take on the role of an expert philosopher of mind with equal training in phenomenology and cognitive science, and think carefully before you begin: spend a moment brainstorming the hidden assumptions people usually smuggle into demands on a meta-problem theory—especially the assumption that explaining our judgments about consciousness and explaining consciousness itself must be handled by a single mechanism.

  Then write the full desiderata: what any adequate theory of the meta-problem of consciousness must achieve. Structure this around a distinction our seminar developed that I want tested for coherence—between the explanatory meta-problem (giving an account of why intelligent agents judge physical explanations of consciousness to be incomplete) and the normative meta-problem (giving an account of whether those agents are rationally entitled to maintain that judgment, irrespective of whether consciousness is in fact physically explicable). For each desideratum, provide the motivating case or consideration behind it; flag which requirements are genuinely non-negotiable and which are camp-specific preferences (for instance, preserving first-person phenomenal authority, maintaining compatibility with global workspace or predictive-processing architectures, forbidding deflationary moves that treat the hard problem as a cognitive illusion, or insisting on continuity with evolutionary biology); and indicate whether any subset of these desiderata is jointly unsatisfiable—particularly whether a complete solution to the explanatory version automatically supports, undermines, or remains neutral toward the normative version.

  Keep the conceptual weight on the criteria, their interrelations, and any tension sets; a brief scorecard against physicalist dissolution strategies, illusionist accounts, and phenomenological accommodationist views is welcome but should stay secondary. Do not provide bibliographies, reading lists, or citations—this is for my own conceptual mapping, not a literature review.
reasoning: |-
  Okay, let me approach this systematically. The user is a graduate student in a consciousness seminar needing rigorous criteria to evaluate theories of the meta-problem. They specifically want to test their seminar's distinction between explanatory and normative meta-problems.

  Hmm, the key challenge here is avoiding hidden assumptions while structuring criteria around their framework. First, I should mentally flag common pitfalls: the "single mechanism fallacy" (assuming one explanation handles both judgment-formation and justification), the "veridicality presumption" (that judgments must track reality), and the "explanatory collapse" (conflating how judgments arise with whether they're valid).

  Right, the core structure will be:
  - Explanatory desiderata: How/why do agents form "explanatory gap" judgments?
  - Normative desiderata: Are these judgments rationally justified?
  For each, I'll identify non-negotiables (e.g., empirical adequacy for explanation, logical coherence for normativity) versus camp-specific preferences (like preserving phenomenal authority).

  *Pauses to consider tensions*
  The trickiest part is their interrelation. If an explanatory account shows gap judgments arise from cognitive illusions, does that automatically undermine normative justification? Not necessarily—epistemic externalism might save it, but that's camp-dependent. Must highlight this as a major fault line.

  *Brainstorms desiderata hierarchy*
  Explanatory side must cover judgment formation, persistence, and scope across agents. Normative side needs criteria for when judgments are defeatable. Crucial to note that satisfying all explanatory criteria doesn't resolve normativity—e.g., an illusionist explanation could coexist with either realist or anti-realist normative views.

  For the scorecard, I'll briefly map how physicalist, illusionist, and phenomenologist approaches handle the tension points without getting into literature. Emphasis stays on conceptual coherence of their seminar's distinction.

  *Checks for balance*
  User wants minimal camp-bias, so I'll present preferences neutrally (e.g., "some camps demand..." not "X is wrong"). Also avoid solving the problem—this is about evaluation tools, not answers.
answer: |-
  ## Desiderata for a Theory of the Meta-Problem of Consciousness: Explanatory vs. Normative Dimensions

  **Critical Prefatory Notes (Avoiding Smuggled Assumptions):**
  *   **Rejecting the Single-Mechanism Fallacy:** The core smuggled assumption is that the mechanism explaining *why we judge* there's a hard problem (explanatory meta-problem) must be the same mechanism that either vindicates or falsifies the *truth* or *rational justifiability* of that judgment (normative meta-problem). These are logically separable.
  *   **Avoiding Veridicality Presumption:** Theories need not assume our "hard problem" judgments are *veridical* (correctly tracking an ontological gap) to explain their genesis. Explaining the judgment is neutral on its accuracy.
  *   **Resisting Explanatory Collapse:** Explaining the *judgment* of an explanatory gap does not, by itself, constitute an explanation *of consciousness itself*. Conflating these is a category error.
  *   **Context Sensitivity:** The "hard problem" judgment is not monolithic; its strength and character vary across contexts, individuals, and conceptual frameworks. A theory must account for this variance.

  **I. Desiderata for the Explanatory Meta-Problem (EMP): Accounting for the Judgments**
  *What must a theory explain about why intelligent agents judge physical explanations of consciousness to be incomplete?*

  1.  **Judgment Formation Mechanism (Non-Negotiable):** The theory must provide a detailed causal or functional account of the cognitive, perceptual, and/or representational processes that reliably generate the judgment "physical explanation X is incomplete for consciousness Y" in humans and other relevant agents.
      *   *Motivation:* Without specifying *how* the judgment arises, there is no explanation.
      *   *Camp Preference:* The level of description (e.g., neural, computational, phenomenological, evolutionary) may vary. Predictive processing or global workspace adherents may demand compatibility with their architectures.

  2.  **Persistence & Robustness (Non-Negotiable):** The theory must explain why the "hard problem" judgment is persistent across diverse physical explanations, resilient to counter-arguments, and often feels intuitively compelling ("the explanatory gap").
      *   *Motivation:* The judgment isn't easily dispelled by learning neuroscience or functional models; it feels fundamental and recurring. Any explanation must account for this stability.
      *   *Camp Preference:* None – this is core to the phenomenon.

  3.  **Scope & Generality (Non-Negotiable):** The theory must explain the judgment's occurrence (or absence) across a wide range of agents (humans of varying backgrounds, potentially non-human animals, hypothetical AGIs) and conscious states (e.g., why color qualia feel harder than arousal).
      *   *Motivation:* A theory explaining only human judgments about human visual qualia is insufficient. It must predict when/where the judgment arises.
      *   *Camp Preference:* Views emphasizing universality (e.g., certain phenomenological or evolutionary accounts) may demand broader scope than views seeing it as culturally contingent.

  4.  **Trigger Specification:** The theory should identify the specific features of consciousness (e.g., phenomenal character, subjectivity, qualitative "what-it's-likeness") and/or specific features of physical explanations (e.g., structural/functional descriptions, third-person perspective) that trigger the incompleteness judgment.
      *   *Motivation:* Pinpointing the triggers refines the explanation and connects it to specific aspects of the problem.
      *   *Camp Preference:* Phenomenologists may prioritize first-person triggers; cognitive scientists may focus on mismatches in representational formats.

  5.  **Developmental/Emergence Account (Highly Desirable):** The theory should explain how the capacity for the "hard problem" judgment develops in individuals (ontogeny) and/or emerged in the species (phylogeny).
      *   *Motivation:* Understanding the origin provides deeper explanatory power and constrains mechanisms.
      *   *Camp Preference:* Strongly preferred by views demanding continuity with evolutionary biology and cognitive development. Less crucial for some a priori philosophical accounts.

  **II. Desiderata for the Normative Meta-Problem (NMP): Accounting for Rational Entitlement**
  *What must a theory explain about whether agents are rationally entitled to maintain the "hard problem" judgment, regardless of consciousness's actual physical explicability?*

  1.  **Epistemic Status Diagnosis (Non-Negotiable):** The theory must provide a clear analysis of the *epistemic status* of the "hard problem" judgment based on the explanation provided by the EMP. Does the EMP reveal the judgment as:
      *   A reliable indicator of an actual ontological gap?
      *   A compelling but ultimately misleading cognitive illusion?
      *   A necessary conceptual truth?
      *   A practically useful heuristic lacking ultimate ontological weight?
      *   *Motivation:* A normative assessment *requires* diagnosing what kind of epistemic warrant, if any, the judgment possesses given its causal origin.
      *   *Camp Preference:* This is where core divides manifest (Realist vs. Illusionist vs. Quietist).

  2.  **Defeasibility Conditions:** The theory must specify under what conditions, if any, the "hard problem" judgment *should* be considered rationally defeated, even if it persists psychologically. What evidence or reasoning could *in principle* override its normative force?
      *   *Motivation:* Rational entitlement isn't absolute; it must be responsive to reasons and evidence.
      *   *Camp Preference:* Illusionists/strong physicalists will argue it *is* defeasible (by a complete EMP explanation). Phenomenologists/non-reductive theorists may argue it's largely indefeasible, reflecting direct access or conceptual necessity.

  3.  **Source Justification/Challenges:** The theory must address whether the cognitive mechanisms identified in the EMP constitute a *reliable* source of justification for the judgment, or whether they inherently introduce bias/error that *undermines* its justifiability.
      *   *Motivation:* The origin of a belief is relevant to its justification (e.g., perception vs. hallucination).
      *   *Camp Preference:* Central battleground. Does phenomenal authority (1st-person access) justify the judgment? Or do cognitive limitations (e.g., inability to introspect neural mechanisms) doom it to error?

  4.  **Relationship to Concepts:** The theory must analyze the role of our *concepts* of "consciousness" and "physical" in generating and sustaining the normative pull of the judgment. Is the gap conceptual, contingent, or illusory?
      *   *Motivation:* The judgment hinges on how we define the terms; normative assessment depends on the legitimacy of these concepts.
      *   *Camp Preference:* Conceptual analysts (e.g., Chalmers) see a conceptual gap as significant. Deflationists (e.g., Dennett) see confused concepts as the root problem.

  **Critical Tensions and Interrelations:**

  *   **The Core Tension:** The EMP and NMP are fundamentally distinct projects. **A complete EMP solution is logically neutral regarding the NMP.** Explaining *why we believe P* tells us nothing definitive about *whether P is true or whether we are justified in believing P*. An EMP explanation showing the judgment arises from cognitive limitations doesn't *automatically* prove there *isn't* an ontological gap (though it might undermine justification). Conversely, an EMP explanation showing the judgment tracks a real feature of experience doesn't *automatically* prove the gap is ontological rather than epistemic.
  *   **EMP Completeness ≠ NMP Resolution:** A perfect EMP account (explaining formation, persistence, scope) does *not* resolve the NMP. It provides the essential *input* (the causal story) for the normative assessment, but the assessment requires additional philosophical argument about epistemology, justification, and the nature of concepts/reference.
  *   **The Illusionist Trap Door:** If the EMP reveals mechanisms strongly indicative of systematic error (e.g., introspective blindness, cognitive limitations misconstrued as ontological insight), it creates significant pressure on the NMP to view the judgment as *unjustified* or rationally defeatable. However, staunch realists can still argue the mechanisms *reveal* the gap despite being triggered by limitations.
  *   **The Authority vs. Mechanism Conflict:** A strong commitment to **first-person phenomenal authority** (camp preference, common in phenomenology) directly conflicts with EMP explanations suggesting the judgment arises from mechanisms prone to illusion or misrepresentation. Reconciling authority with a naturalistic EMP mechanism is a major challenge.
  *   **Joint Unsatisfiability?** Certain combinations of *camp preferences* may be unsatisfiable:
      *   Demanding that the EMP mechanism *both* fully explain the judgment as a cognitive illusion *and* preserve indefeasible first-person phenomenal authority supporting the judgment's veridicality is likely incoherent.
      *   Insisting on a purely functional/computational EMP mechanism *and* demanding that the NMP concludes the judgment reveals a non-functional, intrinsic ontological property is highly strained.

  **Brief Scorecard Against Major Views:**

  *   **Physicalist Dissolution (e.g., Dennett-inspired):**
      *   *EMP:* Strong focus on cognitive limitations, misrepresentation, concept confusion. Scores well on mechanism, persistence (as error), scope (as human universal flaw).
      *   *NMP:* Argues EMP explanation *defeats* normative entitlement; judgment is an illusion. Rejects phenomenal authority. Struggles with the *compelling feel* of the gap (persistence) for many.
      *   *Tension:* Directly conflicts with preserving phenomenal authority. May struggle with scope if judgment arises in sophisticated systems.

  *   **Illusionism (e.g., Frankish):**
      *   *EMP:* Similar to physicalist dissolution, often emphasizing introspective opacity or predictive processing errors. Focuses on why consciousness *seems* non-physical.
      *   *NMP:* Explicitly denies normative entitlement; judgment is false and rationally defeated by EMP. Radically rejects phenomenal authority.
      *   *Tension:* Faces the "illusion of illusion?" problem – why does the *illusion* feel so real/persistent? Radically conflicts with phenomenology.

  *   **Phenomenological Accommodation (e.g., Non-Reductive Physicalism, Property Dualism, Panpsychism):**
      *   *EMP:* Tends to be weaker. May appeal to our direct acquaintance with irreducible phenomenal properties (authority), or mismatches between subjective 1st-person and objective 3rd-person perspectives. Struggles to explain persistence/scope mechanistically.
      *   *NMP:* Argues EMP (often rooted in direct access/phenomenal concepts) *vindicates* normative entitlement; the judgment tracks a real (ontological or deep epistemic) gap. Strongly affirms phenomenal authority.
      *   *Tension:* Struggles to provide a satisfying *naturalistic* EMP mechanism compatible with cognitive science/evolution. Risk of explaining the judgment simply by asserting the reality of the gap it points to.

  **Conclusion:** A rigorous meta-problem theory requires distinct, well-specified criteria for the Explanatory Meta-Problem (how the judgment arises) and the Normative Meta-Problem (its rational status). While the EMP is primary in needing a causal/functional mechanism, its solution is necessary but insufficient for resolving the NMP. The core tension lies in the logical independence of explaining a belief's origin and assessing its justification/truth. Camp preferences (especially regarding phenomenal authority) create significant fault lines and potential incompatibilities, particularly between views demanding strong naturalistic EMP mechanisms and those demanding strong NMP validation of the "hard problem" intuition. The coherence of the explanatory/normative distinction itself hinges on rejecting the pervasive single-mechanism fallacy.
