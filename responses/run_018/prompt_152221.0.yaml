  hey so i was thinking about hobbes lately — you know, the leviathan guy — and how he was weirdly obsessed with geometry. like he genuinely believed geometry was the only real science because you build the figures yourself in your head, so there's no guessing involved. he even tried to square the circle and wrote all these geometry texts that people mocked. then he got into this nasty public feud with john wallis at oxford who kept saying he was wrong about the circle and also ridiculed his political philosophy for being "geometric" in a bad, rigid way.

  i want you to take that feud — hobbes vs wallis from the 1650s through the 1670s — and run it through hobbes's own theory of knowledge, not just "who was right about math." if geometry works because one person constructs and demonstrates it privately, then what happens when wallis — an institutional authority with a university chair and students — attacks your proof? is wallis even playing by geometric rules at all, or is he using a totally different kind of authority? and does this mean hobbes's model for politics — where the sovereign defines terms like a geometer defines figures — secretly depends on there being no wallis-type opponents? i'm especially curious about the squaring-the-circle part: hobbes kept insisting he had done it, wallis kept saying no, and neither budged. is that a failure of hobbes's method, or does it show that his method was never meant to handle public disagreement? also, does the fact that hobbes applied geometry to politics mean he actually wanted politics to work like private study, with everyone just accepting the sovereign's construction? that feels like a weird hidden assumption but i don't know if i'm making it up.

  this is probably all jumbled but can you map it out carefully? like, who are the actual players, what are the real options and payoffs in the dispute, and where does hobbes's theory just stay silent rather than forcing an answer? i feel like there's something about standing or epistemic authority in there but i can't quite name it, so if you see it, say so.
