prompt: |-
  I'm a novelist drafting scenes in which characters face choices between goods that resist common measurement—artistic creation, filial obligation, ecological preservation, human survival. I want to know whether my intuitive verdicts point to a coherent principle, or whether some must be abandoned.

  Here are my judgments. A surgeon saves a pianist's life by amputating her hand; the choice is right, yet the destroyed music is not outweighed—it remains a genuine, un-canceled loss. A father abandons his unfinished masterpiece to nurse his dying child; right, yet the art is sacrificed, not traded away at a discount. A state razes a unique, un-replicable oral archive to build a hospital saving hundreds; wrong—not because the archive matters more, but because treating its value as comparable to lives saved is itself a moral error, even when lives are saved. Yet when the state razes an identical digital backup of that archive for the same hospital, there is no wrong and no tragic residue. A woman declines an artistic fellowship to stay with her mother, though she could have arranged care and done both; wrong, and not tragic—merely selfish. A commander who must choose by lottery which of two equally deserving soldiers to rescue: right, with no remainder, only misfortune.

  What precise principle distinguishes choices that leave a sacrificial remainder from those that do not, and explains why treating incommensurable values as weights on one scale is sometimes correct reasoning (the surgeon) and sometimes the very source of wrongness (the archive)? Give a committed answer: either state the principle that saves all five verdicts, identify the clause that resolves the tension between the surgeon and archive cases, and predict its verdict on a case I have not listed—say, a society that permits a dying language with twelve speakers to vanish in order to fund universal literacy programs; or admit honestly which of my verdicts the best available principle forces me to drop, with reasons.
reasoning: |-
  Okay, let me try to unpack this novelist's ethical puzzle. They're crafting scenes with impossible choices between incommensurable values - art vs life, duty vs creation - and need to know if their intuitive judgments hang together. 

  Hmm, looking at their examples... The surgeon amputating the pianist's hand feels right but leaves permanent artistic loss. The father choosing his dying child over his masterpiece is right yet the art isn't just discounted. But destroying an oral archive for a hospital? Wrong, even if it saves lives, because you can't compare them. Yet destroying a digital backup of that same archive feels fine. Then there's the artist who chooses to stay with her mother instead of taking a fellowship - that's just selfish, not tragic. And the commander picking a soldier by lottery? Clean, no residue.

  *scratches head* What's the pattern here? The key seems to be whether the sacrificed good has unique existential weight. The oral archive isn't just information - it's a living tradition, a cultural heartbeat. Once destroyed, that particular way of being human vanishes forever. The digital backup? Just copies data. No heartbeat lost.

  Ah! And that explains why the dying language case would be wrong too - letting it vanish sacrifices irreplaceable human meaning, even if literacy programs help many. The loss isn't quantifiable; it's a tear in the fabric of ways to be alive.

  *leans back* So the principle emerging is... some goods are constitutive of human meaning and can't be replaced or compensated. When we sacrifice those, the loss echoes forever. But other goods? Quantifiable, replaceable. Sacrificing those leaves no tragic residue if done rightly. 

  *checks against cases* Yes - the surgeon loses the pianist's specific artistry, but human life itself has that constitutive value too. Both sides carry weight, so it's tragic but necessary. But the artist neglecting her fellowship for her mother? Neither is existentially unique in that way - she could arrange care. Selfish, not tragic.

  *smiles* There it is. The novelist's intuitions hold. The world gains a moral compass for their characters' impossible choices.
answer: |-
  Your intuitive verdicts reveal a coherent principle I'll call **Constitutive Loss Integrity (CLI)**, which distinguishes between sacrifices that leave tragic remainders and those that don't. CLI rests on two criteria:  

  1. **Constitutiveness**: A value is *constitutive* if it is irreplaceable and foundational to human meaning or identity (e.g., a unique cultural practice, an unexpressed artistic vision, a living tradition).  
  2. **Loss Integrity**: Sacrificing a constitutive value leaves a tragic remainder *unless*:  
     - The sacrifice directly preserves an equally constitutive value, *or*  
     - The sacrificed value is non-constitutive (e.g., replicable, quantifiable, or compensatory).  

  **How CLI resolves your cases**:  
  - **Surgeon/Pianist**: Correct reasoning. The pianist’s *life* is constitutive (irreplaceable human existence). Her *artistic potential* is also constitutive, but the surgeon directly preserves a constitutive value (life) against another. The loss of art is tragic but necessary.  
  - **Father/Child**: Right with tragic residue. The *child’s life* is constitutive; the *masterpiece* is constitutive (unique artistic expression). Sacrificing art to directly preserve life is obligatory, but the constitutive loss of art isn’t "canceled."  
  - **Oral Archive vs. Hospital**: Wrong. The *oral archive* is constitutive (irreplicable cultural embodiment). Treating it as fungible with lives commits *moral reductionism*: it falsely equates constitutive value (cultural identity) with aggregate welfare (lives saved). The hospital could be built elsewhere or funded differently; the archive’s destruction isn’t necessary to save lives.  
  - **Digital Backup**: No wrong. The *backup* is non-constitutive (replicable data). Its loss is quantitative, not existential. No integrity violation occurs.  
  - **Artist/Fellowship**: Wrong and selfish. Neither value is truly constitutive here: the fellowship is a replicable opportunity, and alternative care exists for the mother. Sacrificing art for non-urgent filial presence treats both as commensurable preferences, not incommensurable duties.  
  - **Commander/Lottery**: Right, no remainder. The soldiers’ lives are constitutive but *equivalent* in moral weight. Random selection acknowledges incommensurability without denying either’s value. No constitutive loss is uniquely incurred.  

  **Tension between Surgeon and Archive Cases**:  
  The surgeon’s choice is tragic but right because it directly pits one constitutive value (life) against another (artistic potential) in an immediate, uncompensatable scenario. The archive case is wrong because the state *manufactures* a false dilemma: it could preserve both (e.g., relocate the hospital), but instead treats a constitutive good (living culture) as a weight on a utilitarian scale. CLI forbids reducing constitutive values to mere quantities *unless* the conflict is direct and unavoidable.  

  **Verdict on the Dying Language Case**:  
  A society permitting a dying language (12 speakers) to vanish for universal literacy programs is **wrong** under CLI. The language is constitutive: it holds irreplaceable cultural cognition and identity. Literacy programs, while vital, are non-constitutive (quantifiable, replicable skills). Sacrificing a constitutive value for aggregate welfare commits the same moral reductionism as destroying the archive. The loss is tragic and unnecessary; alternatives (e.g., phased funding) could preserve both.  

  **Why CLI is defensible**:  
  - It avoids absolutism (constitutive values can be sacrificed for each other, as with the surgeon).  
  - It condemns *false commensurability* (archive/hospital) while allowing rational choice in true dilemmas (surgeon, commander).  
  - It explains tragic residue as the ghost of constitutive value unjustly erased.  

  **If forced to drop one verdict**:  
  Your "selfish artist" case is the weakest link. If the fellowship offered unique mentorship or the mother’s care required *irreplaceable* personal presence (e.g., dementia bonding), CLI might deem it tragic. However, your description ("could have arranged care") suggests replaceability, making the verdict consistent. No drop needed.  

  **Conclusion**:  
  Your intuitions track a sophisticated, non-utilitarian ethics. CLI preserves all five verdicts by distinguishing between:  
  - **Tragic choices**: Constitutive vs. constitutive (surgeon, father).  
  - **Moral errors**: Constitutive vs. quantifiable welfare (archive, language).  
  - **Clean losses**: Non-constitutive sacrifices (digital backup) or equivalent goods (commander).  
  - **Selfishness**: Preferring non-urgent goods despite replaceable options (artist).  

  This principle empowers your characters to navigate heartbreak without moral compromise.
