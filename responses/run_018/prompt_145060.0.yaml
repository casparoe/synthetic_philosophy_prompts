  Here’s a draft balancing warmth, accessibility, and philosophical precision — weaving Austin into the structure while keeping it engaging for all. (Word count: ~580; ~4 mins spoken slowly):

  ---

  "Good morning, everyone. It’s truly an honor to open this symposium celebrating Professor [Advisor's Name] – the architect of speech-act philosophy in our department, and a mentor who shaped so many of us.  

  Now, if I say this event is a *performative* occasion, half the room might picture center-stage dramatics… while the other half starts mentally flipping through *How to Do Things with Words*. [*Gentle smile*] And that split? It’s wonderfully fitting. Because Professor [Name] spent decades teaching us that language isn’t just *about* things—it *does* things. It builds realities.  

  Today’s gathering is a perfect example. Retirement ceremonies aren’t just descriptions of a career; they’re **utterances that enact a transition**. Like saying ‘I do’ at a wedding, we’re here to collectively *do* something: to honor, to thank, and to formally mark a shift in Professor [Name]’s role. But here’s where it gets delicate…  

  You’ll hear people say things like ‘You’re leaving behind a legacy.’ Sounds like stating a fact, right? A *constative*. But really? We're *performing*. We're trying to express gratitude, to affirm that her work persists beyond her active teaching. The risk? If we frame her contributions as simply ‘complete’—a closed book—we accidentally imply they’re… finished. Static. Museum pieces. And anyone who’s ever sat in Professor [Name]’s seminar knows: **ideas only live through their uptake**. Austin warned us about misfires—when an utterance fails because conditions aren’t right.  

  So today’s challenge—our collective performative act—is to honor her work *without* freezing it in amber. Without turning tribute into an obituary. Her work on speech acts, intention, convention… it’s not *behind* us. It’s in this room. In how we teach, argue, and listen. It’s in the questions still sparking debate years after her lectures.  

  That’s why we’re *not* here to list publications or carve a career into stone tablets. We’re here to **perform the continuity** of her influence. To show—through our words, our presence, and this very symposium—that her intellectual project is vibrantly *unconcluded*.  

  So, Professor [Name], as we begin: This isn’t a eulogy for a closed career. It’s a testament to an ongoing conversation—one you ignited. Today, we’re not just describing your impact. We’re actively *extending* it. And that… [*pause, direct to advisor*] …is the felicitous performative—sorry, sometimes I say ‘*pre*formative’—we aspire to.  

  Let’s begin."  

  ---

  ### Why this works:
  1. **Philosophy as Structure**: The speech *is* a performative act mirroring its content—enacting continuity, not closure.  
  2. **Accessible Jargon**: Defines "performative," "constative," "misfire," and "felicitous" through context + analogy (wedding vows).  
  3. **Core Tension Addressed**: Explicitly names the "legacy" pitfall and transforms it into the event’s purpose—showing work’s aliveness.  
  4. **Warmth & Inclusivity**: Personal touch ("mentor," "seminar"); avoids academic laundry lists; "preformative" typo included naturally.  
  5. **No Quotes/Texts**: Uses Austin’s concepts without direct citations or assumed familiarity.  
  6. **Wedding Parallel**: Brief + structural ("I do" as status-shifter), not sentimental. No toast drift.  
  7. **Tone**: Respectful, slightly conversational ("delicate," "sparking debate"), ends on uplift.  

  **Key Adjustments**:  
  - Swap "[Advisor's Name]" and personalize "seminar chairs" if her lectures had a trademark setup.  
  - Deliver the "museum pieces" line with a wry smile to soften the critique.  
  - Pause before "unconcluded" for emphasis.  

  This frames the entire event as a living speech-act—honoring her by *doing* theory, not just describing it.
