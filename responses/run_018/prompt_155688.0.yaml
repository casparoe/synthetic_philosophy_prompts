prompt: |-
  hey im in a phil of culture seminar and we got into whether national character is even a coherent notion. before i go deeper i want the full spec. write the desiderata: what any adequate theory has to deliver — the cases it must get right (diaspora populations, pre-state societies, subnational regions), the distinctions it cant collapse (statistical clustering vs normative stereotype, group-level description vs individual prediction, descriptive vs prescriptive uses), and the empirical constraints it cant violate (cross-cultural psychology findings, historical change over generations). flag which requirements are non-negotiable and which are just camp preferences. also inject this niche framing: national character might work better as a bureaucratic performative script that states use to coordinate populations, so the theory needs to explain why the script sticks or fails without reducing it to individual minds. then briefly score descriptivist/statistical, constructivist, and essentialist accounts against your list. bottom line up front, then the criteria with reasoning, then the quick scorecard. max 350 words, one paragraph per section, no citations or reading lists needed. sry for typos — writing on my phone between classes.
reasoning: |-
  Okay, the user is in a philosophy of culture seminar debating whether "national character" is a coherent concept. They need a structured framework to evaluate theories of national character, with specific requirements and an analysis of existing approaches. 

  First, I assess their scenario: they're likely a grad student or advanced undergrad needing academic rigor under tight constraints (phone typing between classes). Their request shows sophisticated understanding - they want desiderata covering empirical cases, conceptual distinctions, and theoretical constraints, plus that niche bureaucratic performative angle.

  The core tension I notice: they want to avoid biological essentialism but also resist pure subjectivism. That bureaucratic framing is key - it suggests they're probing how institutions materialize abstract concepts. 

  Breaking this down:
  The must-haves are clearly the empirical constraints and conceptual distinctions - collapsing those would make any theory unscientific. The bureaucratic angle is a strong preference but negotiable if a theory explains institutional reinforcement otherwise. 

  For the scorecard:
  - Descriptivist accounts fail the conceptual distinctions (confusing statistics with norms) and the bureaucratic test (too individualistic). 
  - Constructivists nail the bureaucratic angle but often ignore diaspora realities and psychological limits. 
  - Essentialists violate nearly everything - especially empirical constraints about change over time.

  I'm emphasizing the performative aspect because it resolves the coherence paradox: "character" isn't in minds but in the feedback loop between state scripts and citizen performance. That handles diasporas (script adoption varies) and historical change (scripts get rewritten).

  Word count is tight - I'll put the bottom line upfront as requested, then pack cases/distinctions/constraints into dense paragraphs with implicit reasoning. No fluff, but making sure the bureaucratic lens gets its due as the innovative hinge.
answer: |-
  ### Bottom Line
  National character is incoherent as a psychological essence but potentially functional as a *state-driven bureaucratic script* coordinating populations; any viable theory must explain empirical diversity, avoid conceptual collapse, respect scientific constraints, and account for the script's operational mechanics without mental reductionism.

  ### Desiderata (Non-negotiable in **bold**)
  1.  **Cases to Capture:** Must explain diaspora divergence from homeland "character," pre-state societies lacking centralized identity, and resilient subnational identities (e.g., Basque, Quebecois). **Negotiable:** Specific examples used.
  2.  **Distinctions to Uphold (All Non-negotiable):** Must strictly separate statistical behavioral clusters (e.g., survey averages) from prescriptive stereotypes; group-level tendencies from individual predictability; descriptive observations ("Many report valuing X") from normative claims ("They *should* value X").
  3.  **Empirical Constraints (All Non-negotiable):** Cannot violate cross-cultural psychology (e.g., within-group variation > between-group; personality traits vary more individually than nationally) or deny demonstrable historical shifts in "character" over generations (e.g., post-WWII Germany).
  4.  **The Bureaucratic Script (Negotiable Framing):** Should explain why state-propagated "character" scripts (e.g., civic education, media, policy justifications) gain traction or fail *as coordination tools* – focusing on institutional reinforcement, ritual performance, and material incentives, *not* internalized belief.

  ### Scorecard
  *   **Descriptivist/Statistical:** Captures clusters (✓ Cases: Statistical trends) but collapses distinctions (✗ Statistics become stereotypes; ignores descriptive/prescriptive gap) and violates constraints (✗ Misused for individual prediction; ignores historical change). Fails script analysis (✗ Individual-level focus).
  *   **Constructivist:** Excels on script analysis (✓ Explains creation/dissemination) and cases like subnational/diaspora identity (✓ Shows fluidity). Risks collapsing distinctions if norms become reified (⚠️) but *can* uphold them. Respects constraints (✓ No essence, change possible).
  *   **Essentialist (Biological/Cultural):** Fails utterly: Violates constraints (✗ Denies variation/change), collapses distinctions (✗ Stereotype as destiny), ignores key cases (✗ Diaspora/pre-state), and ignores script mechanics (✗ Asserts inherent mind-essence).

  **Conclusion:** Constructivism best meets core requirements, especially framed around the bureaucratic script; essentialism fails entirely; descriptivism is useful only if strictly limited and combined with constructivist insights on script function.
