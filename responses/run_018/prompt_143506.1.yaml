  The core framework focuses on how dietary choices affect wild animal populations through habitat changes, moving beyond typical carbon footprint or direct slaughter calculations. The user lists several unresolved conceptual questions: defining the moral unit (individual vs species vs ecosystem), weighing counterfactual wild-animal suffering, and comparing beef vs chicken through different metrics.

  Key considerations for prioritization:
  - The team composition favors conceptual and modeling work over empirical research
  - Must demonstrate clear dependencies between questions
  - Need to identify which resolutions would actually change dietary/policy recommendations
  - Should specify what intermediate results could shift priorities

  The user seems deeply familiar with effective altruism concepts and wild animal welfare literature, suggesting they want rigorous analytical depth rather than introductory explanations. The tone is academic but practical - they're clearly designing a real research program.

  Main challenges I see:
  1) The foundational moral unit question seems paralyzingly abstract, but resolving it is necessary for other analyses
  2) The beef-chicken comparison appears most actionable but depends on prior answers about moral weights
  3) The invertebrate displacement issue might be intractable without fieldwork

  Smart approach would be:
  - Start with moral unit question but constrain it to make progress (e.g. compare frameworks rather than declare one "correct")
  - Simultaneously explore beef-chicken comparison to generate concrete scenarios for philosophers to evaluate
  - Postpone invertebrate suffering until later since it's highly speculative without data
  - Focus on what could change recommendations - if all moral frameworks point to same conclusion on beef vs chicken, that's valuable even without "final" answer

  The 18-month checkpoint should assess whether moral unit clarification enables clearer ecosystem modeling. If philosophers remain deadlocked, pivot to decision-theoretic approaches that work under moral uncertainty.
answer: |-
  Below is a prioritized, dependency-aware research agenda for your team, structured around tractability, downstream impact, and relevance to actionable dietary/policy recommendations. I deprioritize questions where resolution is unlikely to change normative conclusions or exceeds your team’s non-empirical constraints. The sequence balances parallel work with sequential dependencies.

  ---

  ### **Phase 1: First 12 Months (Conceptual Foundations)**  
  **Priority 1: Define the Moral Unit for Wild Sentience Valuation**  
  - *Why first?* Downstream of all other questions. Comparing beef/chicken impacts or weighing wild suffering requires knowing *what* to count (individuals, species stability, sentient biomass).  
  - *Tractability:* Ideal for moral philosophers (2) with input from ecologist (1). Requires conceptual analysis and ecological plausibility checks—no fieldwork.  
  - *Relevance:* Until resolved, other analyses lack ethical anchors. Even partial frameworks (e.g., "sentient biomass + extinction risk weights") enable progress.  
  - *Deliverable:* A set of evaluative frameworks (e.g., decision trees) mapping ecological outcomes to moral weights.  

  **Priority 2: Model Beef-vs-Chicken Habitat Lock-in Effects**  
  - *Why now?* Independent of moral unit resolution. Focuses on irreversible land-use differences: ruminant pasture (long-term, biodiversity-supporting) vs. poultry-feed monoculture (annual crops, high disturbance).  
  - *Tractability:* Ecologist (1) and decision theorist (1) can model cascading habitat impacts using existing data on land persistence, biodiversity correlations, and trophic cascades.  
  - *Relevance:* Directly informs policy (e.g., subsidies for perennial systems). Lock-in effects may dominate short-term death counts.  
  - *Deliverable:* Comparative scenarios projecting wild vertebrate/invertebrate populations over 50 years under equivalent calorie production.  

  *Deprioritized in Phase 1:*  
  - **Invertebrate displacement suffering:** Requires soil ecology fieldwork. Assume conservative placeholder values.  
  - **Trophic efficiency vs. direct deaths:** Depends on moral unit (Priority 1) and lock-in models (Priority 2).  

  ---

  ### **Phase 2: Months 13–24 (Integration and Counterfactuals)**  
  **Priority 3: Weigh Agricultural Land-Use Against Counterfactual Wild Suffering**  
  - *Why here?* Requires moral frameworks (Priority 1) and land-use projections (Priority 2). Asks: Does converting land to agriculture *prevent* more wild suffering (e.g., via reduced predation/famine) than it causes?  
  - *Tractability:* Decision theorist (1) builds probabilistic models using Priority 1–2 outputs. Philosophers stress-test premises (e.g., is "natural" suffering normatively relevant?).  
  - *Relevance:* Decisive for whether "less meat" is net positive. If agriculture *reduces* net suffering, it upends standard ethical calculus.  
  - *Deliverable:* Sensitivity analyses showing how moral-unit choices affect net suffering estimates.  

  **Priority 4: Compare Beef/Chicken via Trophic Efficiency & Direct Deaths**  
  - *Why not first?* Depends on Priority 3. If counterfactual suffering dominates, efficiency/deaths become secondary.  
  - *Tractability:* Reuse models from Priority 2–3. Philosophers resolve conflicts between short-term (deaths) and long-term (efficiency → habitat) impacts.  
  - *Relevance:* Clarifies trade-offs for consumers (e.g., chicken may cause more direct deaths but less habitat degradation than beef).  

  *Deprioritized entirely:*  
  - **Species-level stability as primary unit:** Unlikely to change recommendations. Preserving ecosystems usually aligns with sentient biomass/individual welfare at scale.  
  - **Precise invertebrate weighting:** Intractable without new data; marginal impact is low (most suffering estimates are driven by vertebrates).  

  ---

  ### **Phase 3: Months 25–36 (Policy Translation)**  
  **Priority 5: Develop Decision Heuristics for Individuals/Policymakers**  
  - *Why last?* Integrates all prior work. Decision theorist creates accessible tools (e.g., "If you prioritize habitat integrity, choose X; if minimizing immediate deaths, choose Y").  
  - *Tractability:* Leverages existing outputs. Philosophers ensure ethical consistency.  
  - *Relevance:* Converts theory into dietary guidelines or land-use policies.  

  ---

  ### **Revision Trigger: 18-Month Checkpoint**  
  Reassess priorities if:  
  - **Moral unit consensus collapses** (e.g., no overlap between "sentient biomass" and "individual rights" frameworks). → Pivot to decision-making under moral uncertainty.  
  - **Habitat lock-in effects prove negligible** vs. direct deaths. → Elevate trophic efficiency (Priority 4) and deprioritize counterfactuals (Priority 3).  
  - **Net wild suffering is overwhelmingly agricultural** (Priority 3). → Focus shifts to minimizing cultivation footprint (e.g., promoting beef on non-arable land).  

  ---

  ### **Defense of Ordering**  
  - **Upstream dependencies:** Moral units and land-use physics (lock-in) constrain all else. Resolving them first prevents wasted effort.  
  - **Tractability:** Avoids empirical gaps (e.g., invertebrate sentience) while leveraging team strengths: philosophers on ethics, ecologist on systems modeling, decision theorist on integration.  
  - **Actionability:** Prioritizes questions that could reverse recommendations (e.g., if agriculture reduces net suffering, eating meat might be *better*). Deprioritizes intractable (invertebrates) or low-impact (species-centric ethics) factors.  

  This sequence maximizes conceptual progress toward revising dietary/policy norms, using your team’s theoretical expertise while respecting non-empirical constraints.
