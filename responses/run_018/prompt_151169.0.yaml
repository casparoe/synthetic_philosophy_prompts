  Here's an analysis addressing Jaspers' unresolved questions on structural political guilt, key scholarly debates, and their implications for political philosophy and legal theory:

  ### Main Open Questions & Lines of Work
  1. **Diachronic Transmission Mechanisms**:  
     *How does collective political guilt persist across regime changes?* Current work examines whether guilt attaches to:  
     - **Institutional Continuity**: Enduring structures (legal/constitutional systems, land titles) forged through historic injustice (e.g., settler-colonial constitutions).  
     - **Democratic Complicity**: Present citizens' material benefit from past wrongs and failure to dismantle unjust systems (e.g., Ta-Nehisi Coates' "Case for Reparations").  
     - **Symbolic Identification**: Collective identity narratives that valorize perpetrators/erase victims (e.g., Confederate monuments).  

  2. **Conditions for Collective Liability**:  
     Debates focus on whether guilt requires:  
     - Formal institutional succession (e.g., Germany post-1945 vs. South Africa post-apartheid)  
     - Ongoing participatory complicity of citizens (e.g., voting in systems excluding marginalized groups)  
     - Affective community identification with the perpetrator state (e.g., Janna Thompson's intergenerational commitments)  

  3. **Practical Implications**:  
     - **Reparative Justice**: Whether guilt justifies material reparations (vs. mere charity)  
     - **Constitutional Reform**: Obligation to dismantle legacy structures (e.g., Indian Child Welfare Act addressing boarding school harms)  
     - **Memorialization**: Duty to reframe national narratives (e.g., Germany's Holocaust memorials)  

  ---

  ### Top 3 Questions for Political Philosophy & Legal Theory (Ranked)

  1. **Does institutional continuity alone transmit political guilt to successor democracies?**  
     *Why it matters most:*  
     - **Stakes**: Foundational for post-colonial/settler states (USA, Canada, Australia). Resolving this determines whether constitutions themselves carry original sin.  
     - **Tractability**: Legal theorists (e.g., Jeremy Waldron) offer concrete frameworks analyzing property/sovereignty continuity. Historical institutionalism provides testable cases.  
     - *Who depends on it:* Indigenous peoples (land rights claims), constitutional courts (legitimacy of inherited legal orders).

  2. **To what extent does democratic complicity create *new* political guilt?**  
     *Why it matters:*  
     - **Stakes**: Defines obligations of living citizens in democracies benefiting from historic injustice (e.g., slavery-derived wealth). Challenges liberal individualism.  
     - **Tractability**: Measurable through policy analysis (e.g., redlining's modern wealth gaps) and democratic theory (Christiano on participatory responsibility).  
     - *Who depends on it:* Marginalized communities seeking reparations, policymakers designing redress.  

  3. **Can guilt-based reparations achieve justice without delegitimizing institutions?**  
     *Why it ranks third:*  
     - **Stakes**: Practical efficacy of reparative mechanisms—critical for transitional justice.  
     - **Tractability**: Empirical political science studies (e.g., public opinion on reparations) provide data, but normative foundations depend on Q1/Q2.  
     - *Who depends on it:* Legislators, truth commissions, and victims' groups navigating backlash risks.  

  ---

  ### What Would Change the Verdict?  
  - **If institutional continuity alone cannot sustain guilt**: Evidence that legal succession is morally inert without *active* complicity (e.g., post-communist states discarding prior frameworks) would demote Q1. Jaspers' strict separation of regime types supports this.  
  - **If guilt-language undermines reparations' legitimacy**: Empirical studies showing reparations framed as *corrective* (not guilty) gain broader support (e.g., Barkan's work on restitution) would elevate Q3 over Q2. This would prioritize pragmatic justice over philosophical coherence.  

  *Verdict shift condition*: Demonstrable success of non-guilt-based redress (e.g., NZ's Waitangi Treaty settlements framed in partnership, not culpability) would reduce Q1/Q2's urgency for legal theory focused on outcomes over attribution.
