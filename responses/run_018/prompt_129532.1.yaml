answer: |-
  Here's the speciesism taxonomy tree focusing on logical splits:

  **Bottom line:** The tree exposes tensions between direct/indirect moral grounding, symmetry demands, and ecological role permissions, with key dead ends at absolute direct membership + symmetry and some gradient inconsistency traps.

  **The Tree:**

  1.  **Is species membership *itself* ever a direct ground for moral status?**
      *   **YES (Direct Membership Views):**
          *   **Is this direct status absolute (always trumps individual capacities)?**
              *   **YES (Absolute Direct Membership - e.g., Strong Human Sanctity):** Status based solely on species. Harming a human infant is always worse than harming a vastly more capable non-human. *Incompatible with full symmetry.*
              *   **NO (Defeasible Direct Membership):** Species grants default status but *can* be overridden by extreme capacity differences (e.g., severely disabled human vs. highly capable ape). Allows for some cross-species comparison.
      *   **NO (Indirect/Capacities-Based Views):** Species only matters as a rough indicator of morally relevant capacities (sentience, autonomy, interests). Moral status depends entirely on possessing these capacities.
          *   **Do capacities scale moral status *gradually* with the degree of capacity? (Gradient Consistency)**
              *   **YES (Full Moral Gradience):** Moral weight increases smoothly with sentience, cognition, etc. A cow has *some* moral weight, a chimp *more*, a human *typically more still*, but no bright lines. *Raises "problem cases" like insects.*
              *   **NO (Threshold Capacitarianism):** There's a binary threshold(s). Once crossed, full moral status is granted (e.g., sentience threshold). Below it, little/no status. *Requires defining the threshold(s) (sentience? self-awareness?).*

  2.  **Symmetry: Can moral obligations run *both ways* between species in the same moral currency?**
      *   **YES (Full Moral Symmetry):** If humans have duties *to* sentient animals, those animals *could* have duties *to* others (humans, other animals) *if* they possess the requisite capacities (understanding harm, agency). *Implies indirect view. Incompatible with Absolute Direct Membership.*
      *   **NO (Asymmetrical Obligations):** Human duties to animals exist (based on capacities or membership), but animals cannot meaningfully hold duties *to* humans or each other in the same way (lack capacity for moral agency). Compatible with most views *except* Full Symmetry & Absolute Direct.

  3.  **Ecological Embeddedness: Does being part of a natural system (predator/prey, symbiosis) generate role-based permissions to harm?**
      *   **YES (Ecological Role Permissions):** An animal's role in its ecosystem can justify (or excuse) harming individuals in ways otherwise immoral (e.g., a wolf killing a deer is "permitted" by its predatory role; humans acting as "super predators" might have different permissions). *Can combine with Defeasible Direct or Capacities-Based views.*
      *   **NO (Individualist Ethics):** Ecological roles don't grant moral permissions to harm sentient individuals. Harm requires direct justification (e.g., self-defense, necessity), regardless of species or natural role. *Fits most cleanly with Capacities-Based views.*

  **Key Combinations & Notes:**

  *   **Empty/Incoherent:** Absolute Direct Membership + Full Symmetry. (Absolute membership blocks animals from being moral agents in the same currency).
  *   **Empty/Incoherent:** Absolute Direct Membership + Ecological Role Permissions justifying harm to humans. (Absolute status protects humans regardless of role).
  *   **Tension:** Full Moral Gradience + clear moral rules. How do we practically weigh vastly different degrees of status?
  *   **Tension:** Threshold Capacitarianism + multiple capacities. Is it one threshold or several? If several, are they AND/OR? (Tree doesn't separate single-threshold vs. multi-threshold views).
  *   **Unnamed Leaves:** Most leaves lack standard "-ism" names except maybe "Threshold Capacitarianism" and "Strong Human Sanctity". The tree defines positions by their logical commitments.
  *   **Tree Can't Separate:**
      1.  **Single vs. Multiple Thresholds:** Within Threshold Capacitarianism, the tree doesn't ask if there's one key capacity threshold (sentience) or multiple (sentience + autonomy).
      2.  **Scope of Ecological Permissions:** It doesn't differentiate *how* broadly "Ecological Role Permissions" apply (only non-humans? humans in "natural" roles?).
      3.  **Type of Symmetry Capacity:** For Full Symmetry, it doesn't specify *which* capacities ground potential animal duties (e.g., just sentience, or agency required?).

  **Why it works:** This forces choices about the *source* of status (Q1), the *structure* of status (Q1b), the *direction* of duties (Q2), and the impact of *context* (Q3), revealing logical dependencies and dead ends.
