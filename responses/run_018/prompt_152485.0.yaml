  Alright, so this logician, Dave, was *really* arguing with his buddy about Skolem's Paradox. "Dude!" he says, pounding the table. "It's obvious! If ZFC has a countable model, then *everything* in it is countable! Uncountable sets are just an illusion! Watch this!"

  He grabs this tiny, intricate model universe off his shelf – a perfectly countable model of ZFC. Before his friend can stop him, Dave shrinks himself down (don't ask how, it's a thought experiment, roll with it) and *jumps* right inside the model.

  Inside, he triumphantly points at the set the model *thinks* is uncountable. "SEE?! This giant thing? It *has* to be countable because this whole model is countable! I'll prove it! Just gotta find the bijectshun between it and the natural numbers right here..."

  He searches... and searches... checks every function definable within the model... consults the local axiom manuals... Nothing. He can't find *any* function *inside the model* that puts that set in one-to-one correspondence with the natural numbers. It stubbornly looks uncountable from his new vantage point.

  Dave starts sweating. He looks up through the weird, glass-like boundary of the model and sees his friend staring down at him, grinning. Dave pounds on the barrier. "Hey! HEY! I know it's countable! I *know* the mapping exists! Where is it?!"

  His friend yells back, his voice muffled but smug: "Dave, you knucklehead! *The counting map?* It exists *out here*, in the *meta-theory*! It's not *inside* the model you're standing in! Countability is *relative to the model*, dude!"

  Dave slumps against a tiny, inaccessible cardinal. "...Oh. Right. Whoops. So... it *is* uncountable... in here? But countable... out there? My whole point was... subjective, man!" He groaned. "This relativity thing is a real headache. Can someone toss me a ladder? Or maybe just... a smaller model to jump into?"
