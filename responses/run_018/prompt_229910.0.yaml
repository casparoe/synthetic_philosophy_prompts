answer: |-
  ### Decision Tree for Positions on True Contradictions and Paraconsistent Logic

  **Instructions:** Answer each question based on your assessment of the concrete cases. Proceed down the tree until you reach a leaf position. The cases are:
  1. **Liar Sentence**: "This sentence is false."
  2. **Vague Borderline**: The exact instant when someone ceases to be a child (or the exact hair that makes someone bald).
  3. **Inconsistent Legal Clauses**: A pair of clauses in a legal code: one requires action X, the other forbids X.
  4. **Explosion (ECQ)**: The principle that from a contradiction (e.g., "P and not-P"), any arbitrary sentence (e.g., "the moon is cheese") follows.

  ---

  #### The Decision Tree
  1. **Starting Question (Case 4: Explosion)**  
     Do you accept that from a contradiction (e.g., "P and not-P"), *every* sentence (including irrelevant ones like "the moon is cheese") must follow?  
     - **YES** → Go to Question 2.  
     - **NO** → Go to Question 3.  

  2. **Question for YES branch (Case 2: Vague Borderline)**  
     At the exact moment when someone ceases to be a child (a vague borderline), must the statement "this person is a child" be *either true or false* (with no third option)?  
     - **YES** → **Classical logic**.  
     - **NO** → **Paracomplete/truth-value-gap approach**.  

  3. **Question for NO branch (Case 1: Liar Sentence)**  
     Is the liar sentence ("This sentence is false") *both true and false*?  
     - **NO** → **Paraconsistent non-dialetheism**.  
     - **YES** → Go to Question 4.  

  4. **Question for YES branch (No specific case; separates trivialism)**  
     Is it possible for *some* sentences to be *only true* (not false) or *only false* (not true)?  
     - **NO** → **Trivialism**.  
     - **YES** → Go to Question 5.  

  5. **Question for YES branch (Case 3: Inconsistent Legal Clauses)**  
     For the legal code with inconsistent clauses (one requires X, one forbids X), is it *both true* that you must do X *and* that you must not do X?  
     - **YES** → **Full-strength (ubiquitous) dialetheism**.  
     - **NO** → **Restricted (semantic) dialetheism**.  

  ---

  #### Diagnoses of Leaf Positions (in terms of cases)
  - **Classical logic**:  
    You accept explosion and hold that the vague borderline statement must be true or false (no gaps).  
  - **Paracomplete/truth-value-gap approach**:  
    You accept explosion but deny that the vague borderline statement must be true or false (gaps are allowed).  
  - **Paraconsistent non-dialetheism**:  
    You reject explosion but deny the liar sentence is both true and false (no true contradictions).  
  - **Trivialism**:  
    You reject explosion, accept the liar is both true and false, and deny that any sentence is only true or only false (all sentences are true-and-false).  
  - **Full-strength (ubiquitous) dialetheism**:  
    You reject explosion, accept the liar is both true and false, and accept a true contradiction in the legal case (contradictions beyond semantics).  
  - **Restricted (semantic) dialetheism**:  
    You reject explosion, accept the liar is both true and false, but deny a true contradiction in the legal case (contradictions only in semantic domains like self-reference).  

  ---

  #### Empty Cells and Unseparated Leaves
  - **Empty cells (combinations with no standard position)**:  
    There are no unoccupied cells in the tree. All 6 combinations map to a standard position.  
  - **Unseparated leaves**:  
    The tree cleanly separates all six leaves. No additional branch is needed.  

  ---

  #### Notes on Recognizable Positions Outside the Six Leaves
  - **Supervaluationism about vagueness** (e.g., Fine, Keefe) falls under **paracomplete/truth-value-gap**. It answers:  
    - Explosion: **YES** (supervaluationist logics retain explosion).  
    - Vague borderline: **NO** (borderline statements are neither true nor false; truth-value gaps exist).  
    Thus, it aligns with the paracomplete leaf.  

  ---

  #### Design Rationale
  - **Key dividing questions**:  
    1. **Explosion** (fundamental to paraconsistency).  
    2. **Bivalence in vagueness** (separates classical from paracomplete).  
    3. **Liar as a true contradiction** (separates paraconsistent non-dialetheism from dialetheism/trivialism).  
    4. **Possibility of non-contradictory sentences** (separates trivialism from dialetheism).  
    5. **Legal contradiction** (separates restricted from full-strength dialetheism using a non-semantic case).  
  - **Cases used as required**:  
    - Liar (Q3), vague borderline (Q2), legal clauses (Q5), explosion (Q1).  
  - The tree minimizes technical jargon, using concrete cases to guide respondents to their position.
