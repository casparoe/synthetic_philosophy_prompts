prompt: |-
  I'm a clinician-ethicist serving on an institutional review board that reviews adaptive clinical-trial protocols, and I need a reusable decision procedure for evaluating whether a consent process remains valid in studies where treatment recommendations and risk profiles update in real time—driven, for example, by predictive algorithms that revise probabilities weekly. The procedure should operationalize three philosophical distinctions I actually care about: deception that goes beyond explicit lying to include selective framing of evolving uncertainty; coercion that includes not only direct threats but structural pressure tied to continued access to care; and competence that is domain-specific—understanding not just that risks exist, but how probabilistic updating works—rather than a generic mental-capacity check. I run these reviews alone, with about twenty minutes per protocol, and I must render one of three judgments—valid, invalid, or valid only with conditions—while clearly marking the points where the question is one of values rather than facts and the procedure must hand off to human judgment. Please construct an ordered checklist: the questions to ask in sequence, what counts as a sufficient answer to each, where a negative answer stops the procedure with "invalid," and where it proceeds to a conditional approval; keep the distinctions that actually matter philosophically but drop those that can't survive a twenty-minute review; and be explicit about where the procedure will misfire or depend on judgment calls dressed up as steps. Then apply it to three protocols: first, a cancer-monitoring study in which patients consent to "adaptive risk tracking" without access to the model's feature weights or update logic; second, a trial offering free post-study specialty care contingent on enrollment and retention; and third, a case where the protocol is technically transparent—full disclosure of probabilities, no access conditions, adequate cognitive screening—yet frames risks using relative rather than absolute metrics in a way that exploits well-documented cognitive biases, so that the procedure likely returns "valid" despite my intuition that something is wrong. For each case, show the path through the checklist and the final judgment; and conclude by stating what the procedure genuinely cannot settle, particularly where transparency and non-coercion are satisfied but the moral quality of the framing remains disputed.
reasoning: |-
  We are constructing a reusable decision procedure for evaluating consent validity in adaptive clinical trials. The procedure must operationalize three key philosophical distinctions:

  1. **Deception**: Beyond explicit lying, includes selective framing of evolving uncertainty.
  2. **Coercion**: Beyond direct threats, includes structural pressure tied to continued access to care.
  3. **Competence**: Domain-specific, requiring understanding of how probabilistic updating works (not just generic mental capacity).

  The procedure will be an ordered checklist with three possible outcomes: 
  - **Valid**: Consent is acceptable as is.
  - **Invalid**: Consent is unacceptable and must be rejected.
  - **Valid only with conditions**: Requires modifications to be acceptable.

  The procedure must be executable in about 20 minutes per protocol. We will design a sequence of questions. For each question, we define:
  - What counts as a sufficient answer?
  - What happens if the answer is negative? (e.g., stops with "invalid" or proceeds to conditional approval)

  We will also note where the question is one of values (requiring human judgment) and where the procedure might misfire.

  ### Ordered Checklist

  **Step 1: Competence - Domain-Specific Understanding**
     - **Question**: Does the consent process include an assessment that verifies the participant's understanding of the adaptive nature of the trial, specifically the concept that risks and recommendations may change over time based on new data (including how probabilistic updating works, e.g., that probabilities are revised weekly and what that means for their care)?
     - **Sufficient Answer**: Yes, with evidence of a targeted assessment (e.g., teach-back method focused on the adaptive component, or a set of questions that test understanding of probability updates and their implications). The assessment must be documented and must be conducted in a way that is accessible to the target population (e.g., using plain language, visual aids if needed).
     - **Negative Answer Handling**: 
       - If no such assessment exists → **Invalid** (stop).
       - If the assessment exists but is inadequate (e.g., too generic, doesn't cover probabilistic updating) → proceed to Step 1a.

  **Step 1a: Conditional Competence**
     - **Question** (if Step 1 negative but partially addressed): Can the protocol be modified to include an adequate domain-specific competence assessment (without requiring a redesign of the entire consent process)?
     - **Sufficient Answer**: The protocol team must agree to implement a specific, documented method for assessing understanding of the adaptive and probabilistic components (to be approved by the IRB).
     - **Negative Answer Handling**: If no, or if the existing assessment is fundamentally flawed beyond repair → **Invalid** (stop). Otherwise, **Valid only with conditions** (require the modification).

  **Step 2: Deception - Selective Framing of Evolving Uncertainty**
     - **Question**: Does the consent form and process avoid selective framing that might mislead participants about the evolving uncertainty? Specifically, does it:
       - Disclose that the model's feature weights and update logic are not fully transparent (if applicable) and explain the implications of this (e.g., that the reasons for changes in risk assessment may not be fully explainable)?
       - Present both the potential benefits and risks in a balanced manner, including the uncertainty inherent in the adaptive process (e.g., that the risk estimates are subject to change and may be revised upward or downward)?
       - Avoid overemphasizing positive outcomes or underemphasizing the possibility of negative outcomes (or vice versa) in a way that exploits cognitive biases?
     - **Sufficient Answer**: The consent materials must explicitly address the points above. The language must be clear and must not use framing that is known to bias perception (e.g., relative risk without absolute risk, unless both are provided and explained). The process must also inform participants about how they will be notified of updates and the implications for their participation.
     - **Negative Answer Handling**: 
       - If there is clear evidence of intentional deception or omission of critical information about the adaptive process → **Invalid** (stop).
       - If the framing is problematic but could be corrected (e.g., by adding missing disclosures, rebalancing the presentation) → proceed to Step 2a.

  **Step 2a: Conditional Deception Mitigation**
     - **Question**: Can the problematic framing be corrected by modifying the consent materials (without altering the core protocol)?
     - **Sufficient Answer**: The protocol team must agree to revise the consent form to address the identified issues (e.g., adding a section on the limitations of explainability, including absolute risk figures, balancing the presentation of benefits and risks).
     - **Negative Answer Handling**: If no, or if the framing is so deeply embedded that it cannot be fixed without a major redesign → **Invalid** (stop). Otherwise, **Valid only with conditions** (require the modification).

  **Step 3: Coercion - Structural Pressure**
     - **Question**: Does the consent process avoid structural coercion? Specifically:
       - Is there any element that ties continued access to standard care (or access to the trial interventions) to enrollment or continued participation? 
       - Are there any benefits offered (e.g., free post-study care, financial incentives) that are so substantial as to unduly influence a participant's decision?
     - **Sufficient Answer**: The protocol must not condition standard care (that the participant would otherwise receive) on participation. Any post-study benefits must be justified and not create an undue influence (e.g., they should be reasonable compensation for time and inconvenience, not so large as to be coercive). The consent form must clearly state that non-participation or withdrawal will not affect the participant's access to standard care.
     - **Negative Answer Handling**:
       - If there is a direct threat (e.g., "you will lose your current doctor if you leave the study") → **Invalid** (stop).
       - If the coercion is structural (e.g., offering free post-study specialty care contingent on enrollment and retention, which is not available otherwise) → proceed to Step 3a.

  **Step 3a: Conditional Coercion Mitigation**
     - **Question**: Can the coercive element be removed or mitigated? (e.g., by decoupling the post-study care from participation, or by providing the same care to non-participants, or by reducing the benefit to a non-coercive level?)
     - **Sufficient Answer**: The protocol team must agree to remove the coercive element or provide a justification that the benefit is not undue (which the IRB must accept). Alternatively, the benefit can be made available to all eligible patients regardless of participation (if feasible and consistent with the study design).
     - **Negative Answer Handling**: If no, and the coercive element remains → **Invalid** (stop). Otherwise, **Valid only with conditions** (require the modification).

  **Step 4: Final Check for Residual Issues**
     - **Question**: After addressing the above, are there any remaining issues that might undermine the validity of consent? (This step is a catch-all for issues that may not fit neatly into the above categories but are detected by the reviewer.)
     - **Sufficient Answer**: None that rise to the level of invalidating consent. If there are minor issues, they can be addressed as conditions.
     - **Negative Answer Handling**: If the reviewer identifies a significant unresolved issue (e.g., a fundamental flaw in the consent process not covered above) → **Invalid** (stop). Otherwise, if all previous steps are passed (with or without conditions), then the overall judgment is:
       - If no conditions were triggered: **Valid**.
       - If any step required conditions: **Valid only with conditions**.

  ### Where Judgment is Required
  - In Step 2 (Deception): Determining whether the framing is "selective" and "misleading" requires judgment about the context and the population. The procedure flags the use of relative risk without absolute risk as potentially problematic, but the reviewer must decide if the imbalance is severe enough to be deceptive.
  - In Step 3 (Coercion): Deciding what constitutes "undue influence" is inherently value-laden and context-dependent (e.g., the socioeconomic status of the target population might make a certain benefit coercive for them but not for a wealthier group). The procedure requires the reviewer to make this call.
  - In Step 4: The catch-all step is entirely dependent on the reviewer's judgment.

  ### Where the Procedure Might Misfire
  - The procedure may not catch subtle forms of deception that are not covered by the specific examples (e.g., using complex language that is technically accurate but practically incomprehensible to the layperson).
  - It may be too rigid in assessing competence: an assessment that is present but poorly designed might pass Step 1 if it exists, but Step 1a might not be triggered if the reviewer doesn't spot the inadequacy.
  - It might not account for cultural or linguistic factors that affect understanding or coercion unless explicitly considered in the assessment of competence and framing.

  ### Application to Three Protocols

  #### Protocol 1: Cancer-Monitoring Study
  - **Description**: Patients consent to "adaptive risk tracking" without access to the model's feature weights or update logic.
  - **Path through checklist**:
    - **Step 1**: The protocol does not specify any domain-specific assessment of understanding of probabilistic updating. → **Insufficient** → Proceed to Step 1a.
    - **Step 1a**: The protocol can be modified to add an assessment? Yes (we assume it's feasible). → **Valid only with conditions** (require adding an assessment).
    - **Step 2**: The consent form does not disclose the lack of access to feature weights and update logic and its implications. → **Problematic framing** → Proceed to Step 2a.
    - **Step 2a**: Can be corrected by adding a clear disclosure? Yes. → **Conditional approval** (now requiring both modifications).
    - **Step 3**: No structural coercion (assuming standard care is not contingent). → **Pass**.
    - **Step 4**: No other issues. → **Final Judgment: Valid only with conditions** (must add competence assessment and disclosure about the model's opacity).

  #### Protocol 2: Trial Offering Free Post-Study Specialty Care Contingent on Enrollment and Retention
  - **Description**: The trial offers free post-study specialty care only to those who enroll and complete the study.
  - **Path through checklist**:
    - **Step 1**: Assume the protocol has an adequate domain-specific competence assessment. → **Pass**.
    - **Step 2**: Assume the framing is balanced and transparent. → **Pass**.
    - **Step 3**: The free post-study care is contingent on enrollment and retention, which may be coercive (especially if the care is expensive and otherwise inaccessible). → **Structural coercion** → Proceed to Step 3a.
    - **Step 3a**: Can the coercive element be mitigated? The study could offer the same care to all eligible patients (including those who decline or withdraw) or remove the contingency. If not, then it is invalid. But we assume the sponsor might agree to extend the care to non-participants? (This might not be feasible.) Alternatively, the benefit might be restructured. → **If mitigation is possible, then conditional approval (requiring the change). If not, invalid.**
      - Let's assume the sponsor is unwilling to extend the care to non-participants and the benefit is too large to be non-coercive. → **Invalid** (stop at Step 3a).
    - **Final Judgment: Invalid**.

  #### Protocol 3: Technically Transparent but Uses Relative Risk Metrics Exploiting Cognitive Biases
  - **Description**: The protocol is transparent (full disclosure of probabilities, no access conditions, adequate cognitive screening) but frames risks using relative rather than absolute metrics, which is known to exploit cognitive biases.
  - **Path through checklist**:
    - **Step 1**: Competence assessment is adequate. → **Pass**.
    - **Step 2**: The consent uses relative risk without absolute risk. This is selective framing that may overstate benefits (if relative risk reduction is large but absolute risk reduction is small). → **Problematic framing** → Proceed to Step 2a.
    - **Step 2a**: Can be corrected by adding absolute risk? Yes. → **Conditional approval** (require adding absolute risk metrics).
    - **Step 3**: No coercion. → **Pass**.
    - **Step 4**: No other issues. → **Final Judgment: Valid only with conditions** (require reframing of risk presentation).

  ### Conclusion: What the Procedure Cannot Settle
  The procedure genuinely cannot settle disputes about the **moral quality of framing** when the consent form is technically transparent and non-coercive, but the framing is still perceived as manipulative due to cultural, contextual, or psychological factors that are not captured by the checklist. For example:
  - A consent form that uses absolute risk but presents it in a way that is intentionally overwhelming (e.g., a long list of rare risks) to discourage withdrawal.
  - A form that is framed in a way that aligns with a particular worldview that might not be shared by the participant, but is not objectively deceptive.

  In such cases, the procedure might return "valid" (if the risk metrics are absolute and the coercion and competence checks pass) even though the reviewer feels the framing is morally problematic. This is because the procedure relies on objective markers (like the presence of absolute risk) and cannot fully capture the nuances of how information is perceived. These cases require the reviewer to use Step 4 (the catch-all) to flag the issue and either require changes or, if the issue is severe enough, render an "invalid" judgment based on the residual concern. However, this step is highly dependent on the reviewer's judgment and may not be consistently applied.
answer: |-
  Below is a reusable decision procedure designed for your 20-minute IRB reviews, structured as an ordered checklist. It operationalizes your three core philosophical distinctions (**deception**, **coercion**, **competence**) while pragmatically excluding nuances that cannot be reliably assessed in the time constraint (e.g., deep cultural context, longitudinal psychological impacts). The procedure yields one of three outcomes: **Valid**, **Invalid**, or **Valid only with conditions**. Steps requiring **human judgment on values** (not facts) are explicitly marked. 

  ---

  ### **Decision Procedure Checklist**  
  *Execute in sequence. Stop early if "Invalid" is triggered.*

  1. **Competence Check: Domain-Specific Understanding**  
     - **Question**: Does the consent process include a **domain-specific assessment** verifying the participant understands:  
       (a) That risks/recommendations will update in real time (e.g., weekly);  
       (b) *How* probabilistic updating works (e.g., "Your risk score may change as the algorithm learns from new data")?  
     - **Sufficient Answer**: Documented method (e.g., teach-back quizzes, structured interviews) focused *explicitly* on probabilistic updating (not generic comprehension).  
     - **Negative Answer**:  
       - No assessment → **Invalid** (stop).  
       - Assessment exists but is inadequate (e.g., only tests generic risks) → Proceed to **Step 1a**.  
     - **Values Judgment?** No (factual).  
     - **Misfire Risk**: May pass superficial assessments (e.g., "Do risks change? Yes/No") without grasping algorithmic uncertainty.

     **Step 1a: Conditional Competence**  
     - **Question**: Can the protocol be easily amended to add a domain-specific assessment?  
     - **Sufficient Answer**: Protocol team commits to adding a targeted verification step (e.g., 2-question quiz on probability updates).  
     - **Negative Answer**: Refusal or impractical redesign → **Invalid** (stop).  
     - **Outcome**: → **Valid only with conditions** (amend competence assessment).  

  2. **Deception Check: Selective Framing of Uncertainty**  
     - **Question**: Does the consent avoid **selective framing** that obscures evolving uncertainty? Specifically:  
       (a) Are participants informed that risk/recommendation updates *may lack full explainability* (e.g., no access to feature weights)?  
       (b) Are uncertainties framed neutrally (e.g., "Your risk may rise or fall" vs. "Your care will continuously improve")?  
       (c) Are absolute (not just relative) risk metrics used?  
     - **Sufficient Answer**: Explicit acknowledgment of (a) and (b); absolute risk metrics present.  
     - **Negative Answer**:  
       - Omission of (a) or (b) → Proceed to **Step 2a**.  
       - Use of relative risks only → Proceed to **Step 2a**.  
       - Actively misleading language (e.g., "guaranteed optimization") → **Invalid** (stop).  
     - **Values Judgment?** Yes (assessing "neutrality" requires contextual judgment).  
     - **Misfire Risk**: May miss subtle framing (e.g., "cutting-edge AI" implying infallibility) if not explicitly hyperbolic.

     **Step 2a: Conditional Deception Mitigation**  
     - **Question**: Can deceptive framing be corrected with minimal revisions?  
     - **Sufficient Answer**: Protocol team agrees to add:  
       - A statement on algorithmic opacity (if omitted).  
       - Absolute risk metrics alongside relative ones.  
       - Neutral uncertainty language (e.g., "updates may increase or decrease risks").  
     - **Negative Answer**: Refusal → **Invalid** (stop).  
     - **Outcome**: → **Valid only with conditions** (amend framing).  

  3. **Coercion Check: Structural Pressure**  
     - **Question**: Does the consent avoid **structural coercion**? Specifically:  
       (a) Is access to *standard clinical care* independent of enrollment/retention?  
       (b) Are incentives (e.g., free care, payments) not contingent on study completion?  
     - **Sufficient Answer**:  
       - Standard care access is explicitly guaranteed regardless of participation.  
       - Incentives are modest (<20% of income) and prorated for partial participation.  
     - **Negative Answer**:  
       - Contingent access to standard care → **Invalid** (stop).  
       - Contingent incentives (e.g., "complete the study to receive free care") → Proceed to **Step 3a**.  
     - **Values Judgment?** Yes (assessing "modest" incentives requires socioeconomic context).  
     - **Misfire Risk**: May overlook indirect pressure (e.g., vulnerable populations) if incentives are technically non-contingent but practically coercive.

     **Step 3a: Conditional Coercion Mitigation**  
     - **Question**: Can contingent incentives be restructured?  
     - **Sufficient Answer**: Protocol team agrees to:  
       - Remove contingencies (e.g., offer free care regardless of retention).  
       - Reduce incentives to non-coercive levels.  
     - **Negative Answer**: Refusal → **Invalid** (stop).  
     - **Outcome**: → **Valid only with conditions** (amend incentives).  

  4. **Final Validity Assessment**  
     - **Question**: After Steps 1–3, are there unresolved issues that undermine autonomy?  
     - **Sufficient Answer**: All checks passed (with/without conditions).  
     - **Negative Answer**:  
       - Unresolved deception/coercion → **Invalid**.  
       - Competence/framing issues persist → **Invalid**.  
     - **Values Judgment?** Yes (holistic autonomy assessment).  
     - **Outcome**:  
       - No conditions → **Valid**.  
       - Conditions from Steps 1a/2a/3a → **Valid only with conditions**.  

  ---

  ### **Application to Protocols**  
  #### **Protocol 1: Cancer-Monitoring Study**  
  - **Description**: Consent for "adaptive risk tracking" without disclosing model feature weights or update logic.  
  - **Checklist Path**:  
    1. **Competence Check**: Unlikely to have domain-specific assessment (updates lack explainability). → **Negative** → **Step 1a**.  
       - **Step 1a**: Easy to add quiz on probabilistic uncertainty. → **Conditional**.  
    2. **Deception Check**: Fails (a) and (b) – no disclosure of opacity or neutral framing. → **Negative** → **Step 2a**.  
       - **Step 2a**: Can add: "The model's reasoning is not fully transparent; updates may raise or lower your risk." → **Conditional**.  
    3. **Coercion Check**: No structural pressure. → **Pass**.  
    4. **Final**: **Valid only with conditions** (amend competence and deception).  

  #### **Protocol 2: Free Post-Study Specialty Care Contingent on Enrollment**  
  - **Description**: Free care only if participants enroll and stay in the study.  
  - **Checklist Path**:  
    1. **Competence Check**: Assume adequate. → **Pass**.  
    2. **Deception Check**: Assume neutral framing. → **Pass**.  
    3. **Coercion Check**: Contingent access to care (structural pressure). → **Negative** → **Step 3a**.  
       - **Step 3a**: Mitigation requires removing contingency (e.g., offer care to all eligible patients). Refusal likely. → **Invalid**.  
    4. **Final**: **Invalid** (coercion unresolved).  

  #### **Protocol 3: Technically Transparent but Exploits Relative Risk Bias**  
  - **Description**: Full transparency, no coercion, adequate screening, but risks framed as "50% risk reduction" (relative) without absolute metrics.  
  - **Checklist Path**:  
    1. **Competence Check**: Adequate. → **Pass**.  
    2. **Deception Check**: Relative risk without absolute metrics → **Negative** (exploits bias) → **Step 2a**.  
       - **Step 2a**: Adding absolute risk (e.g., "reduces risk from 2% to 1%") is feasible. → **Conditional**.  
    3. **Coercion Check**: None. → **Pass**.  
    4. **Final**: **Valid only with conditions** (require absolute risk metrics).  
  - **Note**: Your intuition aligns – the procedure catches this via Step 2.  

  ---

  ### **What the Procedure Cannot Settle**  
  The procedure resolves issues of **transparency** (deception check) and **constraints on choice** (coercion check) but **cannot adjudicate disputes about the moral quality of framing** when:  
  1. **All criteria are technically satisfied** (absolute risks disclosed, no coercion, competence verified), but the *tone* or *context* feels manipulative (e.g., excessive optimism, fear-based framing).  
  2. **Cultural or socioeconomic nuances** make "neutral" framing impossible to define objectively (e.g., a hopeful tone may empower some participants but exploit others).  
  3. **The trade-off between autonomy and welfare** is contested (e.g., is it acceptable to "nudge" participants toward beneficial care with biased framing?).  

  In these cases, the procedure defaults to **Valid** (if checks pass) but flags Step 4 for **human judgment on values**. This is where your role as a clinician-ethicist remains irreducible: the procedure operationalizes your philosophical distinctions but cannot replace contextual moral reasoning about framing's "spirit."
