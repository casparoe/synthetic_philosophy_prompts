answer: |-
  **Your inference does not overreach; it exposes a legitimate tension in Frege’s project that warrants philosophical scrutiny, though caution is needed in attributing the prejudice directly to the logical architecture.** Here’s the reasoning:

  1.  **The Universalist Ambition of Logicism is Explicit:** Frege unequivocsally asserts that arithmetic truths (Gedanken) are objective, mind-independent, and accessible *in principle* to *any* rational being. This anti-psychologism and commitment to universal accessibility are foundational pillars of his logicism in *Grundlagen* and *Grundgesetze*. Your characterization of this ambition is accurate.

  2.  **The Diaries Reveal a Contradiction in the *Grounding* of Rationality:** While the *formal system* of *Grundgesetze* itself may not contain ethnic parameters, the diaries expose Frege’s private belief that the *capacity* for objective thought (accessing Gedanken) or the flourishing of the scientific culture necessary for its pursuit might be ethnically bounded. This directly contradicts the universal scope ("any rational being") presupposed by his logicist epistemology. The tension lies not *within* the derivations but in the *philosophical anthropology* implicitly underpinning the universalist claim.

  3.  **Normative Ideal vs. Empirical Prejudice:** Your core claim about the "normative ideal of shared rational accessibility" implicit in Sinn/Bedeutung (especially for Gedanken) is sound. The Sinn *is* the mode of presentation graspable by rational minds, and the Bedeutung (the True/False for Gedanken) is objective. The diaries suggest Frege may have held that this ideal could only be realized, or fully realized, under specific (ethnically exclusive) cultural conditions. This *does* compromise the *robust universalism* of his anti-psychologism. It introduces a potential cultural contingency into the *accessibility* condition that his published work explicitly denies.

  4.  **The Hilbert Exchange is a Crucial Context:** Your link to the Hilbert debate is astute. Frege’s objection to Hilbertian formalism hinges on the need for *objective, shareable content* (Sinne, Gedanken) in axioms and proofs, accessible to all rational thinkers. If the diaries reveal Frege restricting the scope of "rational thinkers" capable of this access or objectivity based on ethnicity, it fundamentally undermines the *force* of his universalist argument against Hilbert. The *formal* objection stands, but its *philosophical justification* (relying on universal accessibility) is weakened by the revealed prejudice.

  5.  **"Transient Despair" is Unlikely:** Dismissing the diaries as "transient political despair" is unconvincing. The entries (1924, late in life) express deep-seated, systematic prejudices intertwined with his views on science, objectivity, and institutions. While perhaps intensified by contemporary events, they reflect a coherent, albeit repugnant, worldview difficult to quarantine from his broader philosophical commitments to culture and reason.

  6.  **Navigating the Evidentiary Gap:**
      *   **Avoid Direct Contamination:** Do not claim the *formal system* of Sinn/Bedeutung *itself* contains ethnic bias. The system operates abstractly.
      *   **Focus on Philosophical Foundations:** Argue that the diaries reveal a *contradiction in Frege's philosophical anthropology* that *undermines the justification* for his universalist claims about the accessibility and objectivity of Gedanken. The prejudice attacks the *presuppositions* of his logicism, not its internal mechanics.
      *   **Contextualize the "Any Rational Being":** Highlight how the diaries force us to question what Frege *meant* by "rational being" in practice. Was it a truly universal category, or one tacitly bounded by his cultural prejudices? The diaries create a hermeneutic tension around this key phrase.
      *   **Distinguish Commitment from Consequence:** Frame it as the prejudice *compromising the coherence of his overall philosophical project* by introducing an irreconcilable tension, not as *invalidating* specific logical theorems. It's a problem for the *philosophy of logic* he advocated, not the formal logic per se.
      *   **Acknowledge Compartmentalization:** Concede that philosophers can sometimes hold contradictory views. However, the *structural relevance* lies in how this specific contradiction strikes at the heart of a core tenet (universal accessibility) necessary for his anti-psychologism and logicism to hold their full philosophical weight.

  **Conclusion:** Your argument is philosophically significant and defensible. The diaries do not break Frege's logic, but they expose a profound and relevant tension by suggesting his conception of the rational subject capable of accessing objective Gedanken may have been culturally bounded, directly contradicting the universalist foundation of his logicism and anti-psychologism. Focus on this tension in the *philosophical justification* and *presuppositions* of his system, particularly concerning the scope of "rational being," rather than claiming the prejudice is embedded within the logic itself. This navigates the evidentiary gap responsibly while making a substantive contribution to understanding the limits and internal conflicts within Frege's grand project.
