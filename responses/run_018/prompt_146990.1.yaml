answer: |-
  Below is a comprehensive design for the 75-minute structured deliberation, including six case cards and a step-by-step facilitation guide. The goal is to expose the instability of the therapy/enhancement distinction by forcing students to confront "baseline drift"—how institutional norms redefine what counts as "normal" over time.

  ---

  ### **Case Cards**  
  *(Print one set per group; each card includes: Intervention, Pre-State, Post-State, Institutional Context)*  

  1. **Restoring Sight**  
     - **Intervention:** Corneal transplant after trauma.  
     - **Pre-State:** Blindness (from chemical burn).  
     - **Post-State:** Restored vision (20/20 acuity).  
     - **Institutional Context:** General hospital; vision restoration is standard care.  

  2. **Regulating Anxiety**  
     - **Intervention:** SSRI medication for chronic anxiety.  
     - **Pre-State:** Debilitating panic attacks (diagnosed GAD, 95th percentile severity).  
     - **Post-State:** Mood within clinical norms (50th–60th percentile).  
     - **Institutional Context:** Psychiatric clinic; treatment aligns with DSM-6 guidelines.  

  3. **Cognitive Enhancement**  
     - **Intervention:** Neural implants for memory recall.  
     - **Pre-State:** Healthy adult (age-typical memory).  
     - **Post-State:** Enhanced recall (top 5% percentile).  
     - **Institutional Context:** Private biohacking clinic; no medical need.  

  4. **Surgeon’s Reversal** *(Baseline-Drift Case)*  
     - **Intervention:** Removal of state-certified cognitive endurance implant.  
     - **Pre-State:** Enhanced focus (implant allows 16-hour surgeries; now hospital standard).  
     - **Post-State:** Natural endurance (8-hour max; below hospital norms).  
     - **Institutional Context:** Public hospital; implants mandatory for surgical staff since 2040.  

  5. **Musician’s Reversal** *(Baseline-Drift Case)*  
     - **Intervention:** Reversion of hearing-range enhancement.  
     - **Pre-State:** Extended hearing (40Hz–40kHz; required for orchestral certification).  
     - **Post-State:** Natural range (20Hz–20kHz; below professional minimum).  
     - **Institutional Context:** National Musicians’ Guild; enhanced hearing compulsory since 2035.  

  6. **Diplomat’s Reversal** *(Baseline-Drift Case)*  
     - **Intervention:** “Emotional-range therapy” to undo suppression.  
     - **Pre-State:** Artificially flattened affect (voluntary procedure for diplomatic service).  
     - **Post-State:** Pre-suppression emotional responsiveness.  
     - **Institutional Context:** Foreign Service; suppression was condition of employment.  

  ---

  ### **Session Structure (75 Minutes Total)**  
  **Materials per Group:**  
  - 6 case cards.  
  - 10 physical "funding tokens" (e.g., poker chips).  
  - Whiteboard/flip chart for criterion drafting.  
  - Timer.  

  #### **0–10 min: Briefing**  
  - **Divide Roles:** Assign 14 students to three groups (5 × Clinical Allocators, 5 × Regulatory Auditors, 4 × Baseline Sceptics).  
    - *Clinical Allocators:* Prioritize patient autonomy ("If the patient experiences it as restorative, it’s therapy").  
    - *Regulatory Auditors:* Enforce one consistent written criterion ("Apply the rule, no exceptions").  
    - *Baseline Sceptics:* Challenge all baselines ("No ‘normal’ is natural; all are social constructs").  
  - **Explain Rules:**  
    - Groups must draft **one sentence** defining therapy vs. enhancement (e.g., "Therapy restores species-typical function").  
    - Classify all six cases: Only **unanimous** "therapy" votes earn a token. "Enhancement" gets nothing.  
    - If they **change their criterion mid-deliberation**, forfeit one token.  
  - **Clarify Stakes:** Tokens represent public funding. Groups aim to maximize allocations but face trade-offs between consistency and flexibility.  

  #### **10–40 min: Deliberation in Role**  
  - **Facilitator Instructions:**  
    - Circulate silently. Note when groups:  
      - Invoke institutional baselines (e.g., "But the hospital *requires* implants!").  
      - Struggle with reversals (Cases 4–6) vs. familiar cases (Cases 1–3).  
      - Penalize themselves for criterion changes.  
    - **Prompt if stuck:** "Which baseline—biological, statistical, or institutional—are you using here?"  
  - **Expected Dynamics:**  
    - *Regulatory Auditors* will likely classify Case 4 (surgeon) as "enhancement suppression" (deny token) and Case 5 (musician) as "therapy" (grant token), despite identical structures.  
    - *Baseline Sceptics* will attack terms like "species-typical" (e.g., "20/20 vision is just a statistical norm!").  
    - *Clinical Allocators* may push to fund reversals (Cases 5–6) as "autonomy-driven therapy."  

  #### **40–55 min: Reveal and Silent Vote**  
  1. **Group Reports (5 min/group; 15 min total):**  
     - Each group shares:  
       - Final criterion (e.g., "Therapy returns function to the population median").  
       - Token allocations for each case.  
  2. **Silent Vote (5 min):**  
     - Every student writes privately:  
       *"Did [Group Name] apply the* ***same criterion*** *to Case 1 (Sight Restoration) and Case 6 (Diplomat’s Reversal)?"*  
     - Collect votes anonymously (no discussion).  

  #### **55–75 min: Debrief**  
  **Key Talking Points (Facilitator-Led):**  
  1. **Map Regulatory Auditor Shifts:**  
     - Highlight how Auditors often call Case 4 "enhancement" (reversal makes surgeon "substandard") but Case 5 "therapy" (reversion to "natural" hearing). Point out the **identical logic**: both involve reverting to a pre-intervention state now *below* institutional norms.  
     - **Core Insight:** This exposes "normative baseline drift." Institutional adoption (e.g., mandatory implants in hospitals) redefines "normal," making prior biology irrelevant.  

  2. **Baseline Sceptics’ Role:**  
     - Emphasize their success if they exposed how "species-typical functioning" (e.g., Cases 1–2) relies on **statistical norms** that are themselves products of prior enhancements (e.g., glasses, ADHD meds).  

  3. **Predictable Failure:**  
     - Groups protected occupational baselines (hospital/music guild standards) as "given," ignoring that these were constructed through policy shifts. Force accountability: "Which norm—biological or institutional—did your criterion prioritize?"  

  4. **Limitations & Macro Context:**  
     - **Be frank:** This exercise reveals micro-level arbitrariness but **cannot simulate macro-level inertia**. Verbally add:  
       - *"In reality, baselines entrench over decades (e.g., ADHD medication normalizing focus standards). Law and medicine then codify these as ‘biological.’"*  
     - Stress: Therapy/enhancement distinctions are **ethical judgments**, not neutral facts.  

  **Close with Reflection Question:**  
  *"If baselines drift, should ‘therapy’ be defined by individual needs, statistical norms, or institutional demands? Which is most just?"*  

  ---

  ### **Rationale for Design Choices**  
  - **Baseline-Drift Cases:** The surgeon/musician/diplomat reversals force confrontation with institutional power. Students *feel* the tension when "restoration" is punished (surgeon) or rewarded (musician) based on shifting norms.  
  - **Token Forfeiture:** Penalizing criterion changes mirrors real-world institutional rigidity (e.g., FDA guidelines resisting updates).  
  - **Silent Vote:** Measures perceived inconsistency without peer pressure, priming the debrief.  
  - **Role Asymmetry:** Larger Auditor/Sceptic groups intensify cognitive friction, mimicking policy debates.  

  This design makes abstract philosophy visceral, revealing how "therapy" is a moving target shaped by power, not nature.
