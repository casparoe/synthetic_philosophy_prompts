          - Other Users can also write programs for the simulated Kernel (if they catch on). But the Kernel group (as K_sim) only accepts programs from the Meta Programmers in this phase? Or we can let all Users submit to the simulation? To keep it simple, let the entire User group submit to the simulation once it's set up. The Kernel group (as K_sim) runs these programs, and if they include META commands, they modify the rulebook.
