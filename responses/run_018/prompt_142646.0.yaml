  We are designing a 90-minute workshop for about 15 participants. The goal is to let participants experience a tangled hierarchy and the illusion of an inviolate level, using the analogy of a meta-circular interpreter and Escher's Drawing Hands.

  Core idea: 
  - We have a system with two (or more) layers that are mutually dependent, breaking the assumption of a fixed base.
  - We'll set up an activity where one group (the "Kernel") initially seems to be the unchangeable base, but then it turns out they are being simulated by another group (the "User Space"), and vice versa, creating a loop.

  Activity Structure:

  1. **Roles**:
     - **Kernel Group (K)**: 3-4 participants. They are the "base" layer, writing rules and interpreting commands. They believe they are the immutable core.
     - **User Space Group (U)**: 10-12 participants. They write programs in a simple language that the Kernel interprets. They believe they are the application layer and that the Kernel is fixed and unchangeable.
     - **Facilitator (F)**: You, the organizer. You set up the activity and guide the debrief.

  2. **Materials**:
     - For the Kernel: A set of cards with simple instructions (like a very basic instruction set: MOVE, ADD, PRINT, etc.) and a rulebook that they can modify (initially they don't know they can modify it).
     - For the User Space: Paper and pens to write programs (sequences of instructions) and a way to submit them to the Kernel for execution.
     - A large visible board or screen to show the current state of the system (memory, output, etc.).
     - A timer.

  3. **The Language**:
     - Design a very simple stack-based language (to keep it manageable) with about 5 instructions:
          PUSH <number>   : push a number onto the stack
          ADD             : pop top two numbers, add them, push result
          PRINT           : pop top number and print it
          DUP             : duplicate the top of the stack
          POP             : remove the top of the stack
     - The Kernel group will interpret these instructions. They have a stack (represented by a physical stack of cards or a list on a board) and an output area.

  4. **The Twist**:
     - The Kernel group is actually running in a simulated environment. How?
       - We introduce a special instruction (unknown to the User group at first) that the Kernel can use: `META <command>`. This command is not part of the user language but is a backdoor for the Kernel to modify their own rulebook (which they initially think is fixed). 
       - However, unbeknownst to the Kernel, the entire system (including the Kernel's actions) is being monitored and controlled by the User group in a specific way: 
          The User group is divided into two subgroups: 
            - **Regular Users (U1)**: 8-10 participants, writing normal programs.
            - **Meta Users (U2)**: 2 participants (secretly). They are given a special role: they can write programs that use a new instruction `SIMULATE <program>`, which when submitted, the Kernel must run. But the twist is that when the Kernel runs a `SIMULATE` program, they are actually stepping into a simulation. The Kernel group doesn't know that the `SIMULATE` command is special.

     How the simulation works:
     - When the Kernel receives a program starting with `SIMULATE`, they treat it as a normal program but in fact, they are now simulating a "virtual Kernel". The Facilitator will then hand the Kernel group a different rulebook (for the simulated environment) and tell them that they are now in a simulation. Meanwhile, the Meta Users (U2) can write programs that include `META` commands (which in the simulation are allowed) and thus change the rules of the virtual Kernel.

     But wait, we want mutual embedding: the Kernel is running the User programs, but then the User programs (via the Meta Users) are running the Kernel in a simulation.

     Revised plan for clarity:

     We break the activity into two phases:

     **Phase 1 (20 minutes):** 
     - The Kernel (K) is introduced as the fixed base. They have a rulebook that they must follow to interpret the programs written by the User group (U1). They cannot change the rules. They are the base layer.
     - The User group (U1) writes simple programs to get tasks done (e.g., compute 2+2, print a sequence of numbers). 
     - The Meta Users (U2) are part of the User group but are given a secret mission: they are told that they can use a special instruction `SIMULATE` (which they don't reveal to the Kernel). They write a program that starts with `SIMULATE` followed by a normal program. 

     **Phase 2 (25 minutes):** 
     - When the Kernel receives a program starting with `SIMULATE`, the Facilitator steps in and tells the Kernel group: "This program is invoking a simulation. You are now the simulated Kernel. Here is a new rulebook (which is the same as the old one but with a note: 'You are now in simulation mode. You can use the META command to change the rules.')". 
     - The Kernel group now becomes the simulated Kernel (K_sim). They run the program inside the simulation. The Meta Users (U2) can now write programs that use `META` (which in the simulation is allowed) to change the rules of K_sim. 
     - Meanwhile, the Facilitator tells the rest of the User group (U1) that they are now the "real" User space and can write programs for the "real" Kernel (which they think is still the original Kernel). But actually, the entire system (including the original Kernel) is now running in a simulation? 

     This might get too complex. Let's simplify:

     Instead, we can have two layers that are symmetric and then reveal that they are both simulations.

     Alternative approach inspired by "Prisoner's Dilemma Tournament" but for interpreters:

     We set up two groups: Group A and Group B. Each group is both an interpreter and a program.

     Step by step:

     1. Group A is given the task of interpreting a simple language (like the stack language above). They have a rulebook.
     2. Group B is writing programs for Group A to run.

     Then we tell Group B that they are actually also an interpreter, and they have to interpret a program that Group A is going to write for them. But Group A doesn't know that they are going to have to write a program.

     But we need a way to have mutual embedding.

     Let me go back to the meta-circular idea:

     We have an interpreter written in the same language it interprets. We can have two groups:

     - Group 1: They are the "interpreter" for a language L.
     - Group 2: They write programs in L.

     Then we reveal that the interpreter (Group 1) is itself written in L, and we show them the code of the interpreter (which is a program in L). Then we ask: who interprets the interpreter? 

     But we need an activity.

     Revised activity with two groups and a facilitator:

     **Phase 1 (20 minutes):**
     - Divide into two groups: the Kernel (K) and the User (U). 
     - The Kernel is given a set of rules (the interpreter) for a simple language (let's call it L0). They are told that they are the base layer and their rules are fixed.
     - The User group writes programs in L0 and submits them to the Kernel for execution. The Kernel executes them and produces output.

     **Phase 2 (20 minutes):**
     - The Facilitator gives the User group a new task: they must write an interpreter for L0 in L0 (a meta-circular interpreter). They write a program in L0 that takes as input a program in L0 and executes it. This program is called M0.
     - The Kernel is asked to run M0 (the meta-circular interpreter) on a simple program (say, a program that adds 2 and 2). They do so and it works.

     **Phase 3 (20 minutes):**
     - Now the Facilitator reveals: the Kernel that they have been using to run M0 was itself implemented by a program running on a lower level. And then shows that the Kernel group was actually running inside a simulation provided by the User group? 

     How to make it physical and experiential?

     We need a way for the Kernel to realize they are being simulated.

     Let's change the setup:

     We have three layers:

     Layer 0: The physical world (the facilitator and the room) - the true base? But we want to break that too.

     Instead, we can have:

     - Layer 1: The Kernel group (K) - they run programs.
     - Layer 2: The User group (U) - they write programs.

     Then we introduce:

     - The User group is given a special program to run: it is a simulator for the Kernel. They are told that they are now the simulator (so they form a new group, the Simulator group). They now simulate the Kernel group by having some of their members act as the Kernel (but following the same rules). Then the Kernel group is asked to run a program that is the same as the simulator. 

     This might get too confusing.

     Given the time, let's design a simpler but effective activity:

     **Activity: The Recursive Simulation Game**

     Roles:
       - **Kernel (K)**: 3-4 people. They are the "machine". They have a set of cards representing the instruction set and a rulebook. They have a stack (a physical stack of number cards) and an output area (a whiteboard).
       - **User Programmers (UP)**: 8-10 people. They write programs using the allowed instructions (PUSH, ADD, PRINT, DUP, POP).
       - **Meta Programmers (MP)**: 2 people (secretly chosen by the facilitator at the beginning). They are part of the User Programmers but are given an additional instruction: `SIMULATE` (which takes a program as an argument). They are told not to reveal this instruction to the Kernel or other Users until it's "discovered".

     **Phase 1: Establishing the Hierarchy (20 mins)**
     - Introduction (5 mins): Facilitator explains the simple language and the roles. The Kernel is the base, unchangeable. The Users write programs, the Kernel runs them.
     - Activity (15 mins): 
          - Users write simple programs (e.g., "PUSH 2, PUSH 3, ADD, PRINT"). 
          - Kernel runs them and shows the output.

     **Phase 2: Introducing the Simulation (20 mins)**
     - The Facilitator gives the Meta Programmers a challenge: they must write a program that simulates the Kernel. They write a program that starts with `SIMULATE` and then includes a program (for the simulated Kernel to run). They submit it.
     - The Kernel receives this program. They don't know `SIMULATE`. The Facilitator intervenes and says: "This is a special instruction. When you see `SIMULATE`, you must enter simulation mode. In simulation mode, you are no longer the real Kernel, you are a simulated Kernel (K_sim). Here is a new rulebook for the simulation (which is the same as the old one but adds: 'You can use the META command to change your own rules. META commands are: META_ADD <instruction> <description>, META_REMOVE <instruction>, etc.')."
     - The Kernel group becomes K_sim and runs the program following the new rulebook (which allows self-modification). The program that follows `SIMULATE` might be a simple program, but then the Meta Programmers can now write programs that include META commands to change K_sim's rules.

     **Phase 3: Breaking the Hierarchy (20 mins)**
     - The Facilitator then tells the entire group: "Now, the original Kernel (K) is running inside a simulation. But who is running the simulation? It's the User group! Specifically, the Meta Programmers are controlling the simulation. But wait, the Meta Programmers are part of the User group, which was supposed to be running on top of the Kernel. Now the Kernel is inside a simulation run by the User group. So which one is the base?"
     - Then the Facilitator points out: the original Kernel (K) is now the simulated Kernel (K_sim). But the Users (including the Meta Programmers) are running on the original Kernel? Not exactly, because the original Kernel is now in simulation mode. How do we close the loop?

     We need to show that the simulation is also running on the same Kernel. 

     Idea: The Facilitator reveals that the simulation program (the one with `SIMULATE`) is actually running on the original Kernel. So the original Kernel is running a simulation of itself. And inside that simulation, the simulated Kernel can be modified by the Users (via META commands). So the base layer (the Kernel) is running a simulation of itself, and in that simulation, the Users are modifying the Kernel. This breaks the hierarchy.

     But the physical setup: 
       - The original Kernel group is now playing the role of the simulated Kernel. 
       - The Meta Programmers are writing programs that affect the simulated Kernel.

     Then the Facilitator can ask: "What if the simulated Kernel (K_sim) were to run a `SIMULATE` program? Would we have a simulation inside the simulation?" And we can try it: the Meta Programmers write a program for K_sim that does `SIMULATE ...`, and then the Kernel group (now K_sim) would have to simulate yet another Kernel (K_sim2). But then we are in an infinite regress? 

     However, we don't have time for infinite regress. So we do one level and then explain that it could go on.

     **Debrief (30 mins):**
     - Map the experience to Escher's hands: 
          - The Kernel (hand A) draws the User (hand B) by running its programs. 
          - But then the User (hand B) draws the Kernel (hand A) by writing the simulation program that the Kernel runs, which in turn simulates the Kernel (so hand B is drawing hand A). 
          - Thus, each is drawing the other.
     - The illusion of the inviolate level: Initially, the Kernel was the base. Then we saw that the Kernel could be modified from within the simulation, which was run by the User. But the simulation was run by the Kernel itself. So there is no base.

     **What the physical setup cannot reproduce**:
     - In a true tangled hierarchy, there is no ultimate base. In our activity, the simulation is started by the Kernel running the `SIMULATE` program, which was written by the Users. But who runs the original Kernel? The facilitator (an external agent) does. So we have an external observer (the facilitator and the physical room) that is the real base. We cannot remove that. Therefore, we must verbally point out that in a purely self-referential system, there is no external base. The system is closed.

     **Predictable malfunction**:
     - The Kernel group might be confused when they are told to become the simulated Kernel and get a new rulebook. They might resist or not understand how to run the simulation.
     - Recovery: The facilitator should step in and guide the first simulation. Also, the Meta Programmers might not know what to do with the META commands. The facilitator can give examples.

     **Revised Timeline (90 minutes total):**

