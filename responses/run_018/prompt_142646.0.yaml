          - 70-80 min: Map to concepts:
               - Mutual embedding: The Kernel runs the User's programs, but the User's simulation program runs the Kernel (in a simulated environment). 
               - The illusion of an inviolate level: The Kernel was thought to be fixed, but it was changed from within the system (via the simulation). 
               - Escher's hands: Each is drawing the other: the Kernel (hand A) runs the User's code, which includes the simulation of the Kernel (so hand B draws hand A). 
