     - (5-25 mins) Phase 1: Establishing the Hierarchy.
          - Assign roles: 3 as Kernel, 10 as Users (including 2 secret Meta Programmers). The facilitator takes the Meta Programmers aside and gives them the `SIMULATE` command and explains that they can use it to simulate the Kernel.
          - Users (including Meta Programmers) write simple programs. Kernel runs them. (15 minutes of activity)
     - (25-45 mins) Phase 2: Introducing the Simulation.
          - Meta Programmers submit a `SIMULATE` program (e.g., `SIMULATE PUSH 2 PUSH 3 ADD PRINT`).
