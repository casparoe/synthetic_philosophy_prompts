answer: |-
  ### Taxonomy Tree for Mechanism Identity in Mechanistic Anomaly Detection  
  **Root Scenario**: A module in a fine-tuned model behaves differently from its counterpart in the base model. Is this the same mechanism operating anomalously, or a different mechanism?  

  #### Decision Tree Structure  
  1. **Substrate Split**:  
     - *Question*: Is mechanism identity fixed by **internal architectural realization** (weights/connections) or by **causal/functional role**?  
     - **Branch A**: Realization → Proceed to Granularity Split.  
     - **Branch B**: Role → Proceed to Scope Split.  

  2. **Granularity Split** (for Branch A: Realization):  
     - *Question*: If realization matters, is the relevant feature **exact parameter values** or **abstract connectivity topology**?  
     - **Branch A1**: Exact parameter values → Proceed to *Parameter Sensitivity*.  
     - **Branch A2**: Topology → Proceed to *Topology Flexibility*.  

  3. **Topology Flexibility** (for Branch A2: Topology):  
     - *Question*: If topology matters, are individual nodes **fungible substitutes** or **rigidly essential**?  
     - **Branch A2a**: Fungible substitutes.  
     - **Branch A2b**: Rigidly essential.  

  4. **Scope Split** (for Branch B: Role):  
     - *Question*: If causal role matters, is the profile evaluated over the **actual observed input distribution** or **counterfactual interventions**?  
     - **Branch B1**: Actual distribution → Proceed to *Distribution Scope*.  
     - **Branch B2**: Counterfactual → Proceed to *Architectural Independence*.  

  5. **Distribution Scope** (for Branch B1: Actual distribution):  
     - *Question*: Is the causal role defined on the **base model’s training distribution** or the **fine-tuned model’s deployment distribution**?  
     - **Branch B1a**: Base model’s training distribution.  
     - **Branch B1b**: Fine-tuned model’s deployment distribution.  

  6. **Architectural Independence** (for Branch B2: Counterfactual):  
     - *Question*: Does the mechanism retain identity when embedded in a **different global architecture** (e.g., post-merging)?  
     - **Branch B2a**: Retains identity.  
     - **Branch B2b**: Does not retain identity.  

  ---

  #### Leaf Nodes: Positions and Commitments  
  | Path          | Label                        | Core Claim                                                                 | Awkward Commitment (Applied to Anomalies)                                                                 |  
  |---------------|------------------------------|----------------------------------------------------------------------------|----------------------------------------------------------------------------------------------------------|  
  | **A1**        | *Parametric Literalism*      | Identity requires exact numerical equality of all parameters.              | Fine-tuning that alters any parameter (e.g., quantization) creates a new mechanism, even if behavior is identical. |  
  | **A2a**       | *Topological Permutationism* | Identity requires identical connectivity, but nodes are permutable.        | Randomly shuffling neurons within a layer preserves identity, even if outputs change catastrophically.   |  
  | **A2b**       | *Topological Essentialism*   | Identity requires identical connectivity and fixed node identities.        | Fine-tuning that preserves structure but changes node-specific weights retains identity, even if function diverges. |  
  | **B1a**       | *Actualism (Base-Anchored)*  | Identity requires identical role on the base model’s training distribution. | A module fine-tuned for a new task is still the same mechanism if it behaves identically on *old* data, even if broken on new data. |  
  | **B1b**       | *Actualism (Deployment-Anchored)* | Identity requires identical role on the fine-tuned model’s deployment distribution. | The base module is a different mechanism if it fails on the fine-tuned model’s data, even if divergence is due to distribution shift alone. |  
  | **B2a**       | *Counterfactual Invariantism* | Identity requires identical role under interventions, even in a new architecture. | A module remains the same after being transplanted into a different model, as long as local counterfactuals match. |  
  | **B2b**       | *Counterfactual Contextualism* | Identity requires identical role under interventions, but only within the original architecture. | Identical fine-tuned modules in different architectures (e.g., via pruning) are distinct mechanisms. |  

