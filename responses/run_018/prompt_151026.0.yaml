  #### Forced-Together Hybrid Views  
  - **Problem**: The tree cannot separate **hybrid views** that blend realization and role criteria (e.g., "identity requires *both* same topology *and* same role on base data").  
  - **Reason**: The Substrate Split forces an *exclusive choice* between realization and role at the root. Hybrids require simultaneous evaluation of both criteria, which the branching order prohibits.  
  - **Consequence**: Views like "Mechanism = Realization + Role" are squeezed into *nearest leaves* (e.g., *Topological Essentialism* or *Actualism*), misrepresenting their dual requirements.  

  ---

  #### Confidence Assessment  
  - **Overall Confidence**: 85% in the taxonomy structure. The splits reflect irreconcilable philosophical divides in mechanistic interpretability.  
  - **Least Confident Point**: **Granularity Split for realization**. Distinguishing "exact parameters" vs. "topology" oversimplifies cases where low-level changes (e.g., weight perturbations) alter function without disrupting topology. Uncertainty: Whether *Parametric Literalism* (A1) is defensible or trivially falsified by symmetry equivariance.
