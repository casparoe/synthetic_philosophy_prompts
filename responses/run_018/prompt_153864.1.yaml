prompt: |-
  I'm in a philosphy of physics seminar and we just got through the Maxwell's demon unit, but honestly it feels like everyone just repeats "Landauer solved it" without actually saying what the solution is supposed to cover. So before I go deeper, I want the full desiderata list: what does any interpretation that actually resolves the demon paradox through information physics have to be able to do?

  Like, the specific cases it can't fail on -- not just Szilard's single-particle engine, but also a demon that uses quantum error-correcting codes to reset its memory register, and one operating in a non-equilibrium steady state with continuous feedback loops. The distinctions it must preserve -- logical reversibility vs thermodynamic irreversibility, the cost of measurement vs the cost of erasure, and whether the information is about the system or about the demon's own internal state. The physical constraints it can't violate -- statistical second law, Landauer's bound, maybe the fluctuation theorem for small systems -- and for each one say whether it's genuinely non-negotiable or just a preference of one camp. Also flag if any two of these are jointly impossible, like if treating the demon's memory as fully physical and Hamiltonian-confined conflicts with requiring the second law to hold trajectory-by-trajectory rather than just on average. That's the part I care about most.

  Then just briefly: how do the usual accounts -- Szilard's link between information and work, the Landauer-Bennett erasure-cost argument, and the quantum view where coherence in the demon's register changes the accounting -- hold up against your list? Don't do a full scorecard, I just want to see where they crack. Oh, and no bibliography please -- I'm trying to figure out what I'm asking of a theory, not build a reading list.
