  Here's your ranking based on capacity to *repair moral harm* (restore relationships, correct wrongs, prevent recurrence), plus the culture-switching score:

  1.  **Guilt:** **Best for repair** because it focuses on the *specific harmful action*, motivates amends to the victim, and drives behavioral change to avoid repeating the wrong.
  2.  **Collective Remorse:** **Strong potential for group-level repair** as it acknowledges shared responsibility for harm, can motivate collective restitution (e.g., reparations, policy changes), and fosters group learning.
  3.  **Normative Embarrassment:** **Limited direct repair potential** because it focuses on the *self's social alignment* after group failure, motivating conformity or distancing but not necessarily substantive repairs for the actual victims.
  4.  **Shame:** **Poorest for repair** because it focuses on the *global flawed self*, often leading to withdrawal, defensiveness, aggression, or hiding the wrong rather than addressing the harm done to others.

  **Culture Switch Score: 5/10**
  (Mid-range difficulty: Significant, deliberate, long-term societal effort *can* shift emphasis within a portfolio – e.g., promoting restorative justice over punitive shame – but core emotional tendencies are deeply embedded in culture, institutions, and socialization, making rapid or complete "playlist" changes very unlikely and often meeting resistance.)

