  We are going to construct an example in the context of a sequential multi-agent allocation task. The task involves distributing a resource (e.g., money, food, medicine) over time between two agents (A and B). The state is the current allocation and the remaining resource. The decision-maker (the agent whose preferences we wish to infer) chooses how to split the resource at each step.

  **Setting:**
  - **Environment**: The decision process has T steps. At each step t, the agent observes the current allocation (a_t, b_t) and the remaining resource R_t. The agent chooses an allocation (dA, dB) such that dA + dB <= R_t and dA, dB >= 0. The new state becomes (a_t + dA, b_t + dB) and R_{t+1} = R_t - (dA+dB). The process ends when t=T or R_t=0.
  - **Goal of IRL**: We observe the agent's behavior (a sequence of allocations) and wish to infer the agent's reward function, which may depend on the final allocation and possibly on the path (procedural aspects).

  **Standard Assumption**: The agent is Bellman-optimal, meaning that at each step, the agent chooses an action that maximizes the expected discounted sum of rewards, given the current state and the true transition dynamics (which are deterministic in this example).

  **Conceptual Issue**: We want an example where the observed behavior can be explained by two fundamentally different reasons:

  1. **Non-standard preference ordering**: The agent values procedural fairness (e.g., maintaining balance in the incremental allocations at each step) even if it leads to a slightly less equal or less efficient final outcome. Alternatively, the agent might value autonomy-preservation (e.g., avoiding large interventions that would drastically change the balance) over the outcome maximization.

  2. **Epistemic limitation**: The agent is missing a hidden state variable that the observer can see. For example, the agent might not know the total resource R (or might have a mistaken belief about it) and thus makes allocations that are optimal under their belief but suboptimal in reality.

  We design an example that is ambiguous between these two.

  **Example Scenario**:

  - **Total resource**: R = 10 units.
  - **Time steps**: T=2 (two allocation rounds).
  - **Initial state**: (a0=0, b0=0) and R0=10.

  We observe the following behavior:

  - **Round 1**: The agent allocates (dA1=3, dB1=3), so state becomes (3,3) and R1=4.
  - **Round 2**: The agent allocates (dA2=2, dB2=2), so state becomes (5,5) and R2=0.

  Note: The agent leaves 0 unallocated.

  **Standard Preference (Outcome Maximization)**: If the agent only cared about the final allocation, then an optimal agent with a preference for equality might have allocated (5,5) in the first round (if that were allowed) or at least allocated more in the second round to achieve a more equal outcome. But note that the agent could have allocated (5,5) in the first round? Actually, that would require 10 units, which is available. So why didn't the agent do that?

  **Ambiguity**:

  1. **Non-standard preference (procedural fairness)**: The agent might have a preference for incremental fairness. They might believe that it is fairer to make equal allocations at every step, even if that leaves some resource unallocated (which they then do not allocate because they want to be fair in the next step too, but they run out of steps). Alternatively, the agent might have a constraint that they cannot allocate more than a fixed amount per step (say, 3 units per step per agent) due to procedural rules they value. So they are forced to leave some resource unallocated. This is a preference for a fair procedure.

  2. **Epistemic limitation**: Suppose the agent does not know the total resource R. They might believe that the total resource is only 6 (because of a mistaken initial belief). Then, in the first round, they allocate (3,3) because they think that is half of the total (if they believe R=6). Then, in the second round, they are surprised to see that there are 4 more units (because in reality R=10, so after using 6 they have 4 left). But they stick to their rule of allocating equally and use 4 units to allocate (2,2). They leave 0 unallocated because they used all they found. However, if they had known R=10, they would have allocated differently (e.g., 5 and 5 in the first round).

  But note: in the epistemic limitation case, the agent in the second round now knows that the total was 10? Because they started with 10 and allocated 6, leaving 4. So they update their belief? We must design the epistemic limitation carefully.

  Revised epistemic limitation: The agent does not know the total resource until the end. They only know the remaining resource at each step. However, they have a prior belief that the total resource is 6. But at the first step, they observe R0=10. So they update? To avoid this, let's assume the agent has a cognitive limitation: they cannot remember the total and only see the current remaining. But they form a plan based on an initial belief. Alternatively, we can have a hidden variable that the agent cannot observe: the quality of the resource. Suppose each unit of resource allocated to an agent in the first round yields more utility than in the second round (due to time discounting or because the resource degrades). But the agent does not know this degradation factor.

  Let's change the scenario to incorporate a hidden variable:

  **Revised Setting with Hidden Variable**:

  - There is a hidden state: the resource degrades over time. Specifically, any unit allocated in round 1 is worth 1.0, but in round 2 it is worth 0.5 (because of spoilage). The agent does not know this degradation. The agent believes the resource does not degrade (so worth 1.0 in both rounds).

  - The agent's reward function is to maximize the total utility (sum of allocations multiplied by their worth). So the agent would want to allocate as much as possible in round 1.

  But then the observed behavior does not match: the agent allocated only 6 in round 1 and then 4 in round 2. That would yield a total utility of 6*1 + 4*0.5 = 6+2=8. If they allocated 10 in round 1, they would get 10*1=10. So they are being suboptimal.

  Why would they do that? We need to explain the observed behavior.

  Alternative hidden variable: the agent does not know the total resource. They initially believe the total is 6. At the first step, they see 10 units? That contradicts. Instead, we can have a scenario where the agent does not observe the remaining resource until after they allocate? That might be artificial.

  Let's design a different epistemic limitation:

  **Epistemic Limitation Example**:

  Suppose the agent must allocate the entire resource in one go if they wish to allocate more than 3 units to one agent in a round? But that's a procedural constraint, which we are trying to avoid because that would be a non-standard preference.

  Alternatively, the agent might have limited computational resources and uses a heuristic. But that is a third type of explanation (bounded rationality) and we are focusing on epistemic.

  We want an epistemic limitation that leads to the same behavior without invoking a non-standard preference.

  **Proposal**:

  We introduce a hidden state variable: the agent does not know the preferences of the recipients. Specifically, the recipients might have a preference for receiving the resource in one lump sum (because of a fixed cost of receiving an allocation). The agent does not know this and believes that the recipients are indifferent to the timing. The observer knows the recipients' preferences.

  - The recipients: Agent A and Agent B each have a utility function that includes a fixed cost for each time they receive an allocation. Specifically, if they receive an allocation in a round, they incur a cost of c (say, c=1) regardless of the amount. So the net utility for a recipient in a round is (amount received) - c.

  - The decision-maker (the allocator) does not know about this cost. The allocator believes that the recipients only care about the total amount. Therefore, the allocator's reward function (if they were outcome-oriented) would be the sum of the total amounts given to A and B. But the recipients' true utility is (total amount to A) - (number of times A received) * c, and similarly for B.

  - The allocator's goal (as an altruistic agent) is to maximize the sum of the recipients' utilities. But since the allocator does not know about the cost c, they model the recipients' utility as the total amount.

  **Observed Behavior**:

  The allocator, wanting to be fair and maximize the total, decides to split equally at each step. In round 1, they give (3,3). Then in round 2, they give (2,2). They stop because they don't want to incur more rounds? Actually, they could do one more round? We have only two rounds. So they do two rounds.

  Now, the recipients' utilities:
  - A: (3 + 2) - 2*c = 5 - 2c
  - B: (3 + 2) - 2*c = 5 - 2c

  If the allocator had allocated all 10 in one round (say round 1) as (5,5), then:
  - A: 5 - 1*c
  - B: 5 - 1*c

  So if c>0, the one-round allocation is better (since 5-c for each is better than 5-2c). The observer, knowing c, sees that the one-round allocation is better. But the allocator, not knowing c, thinks that splitting is just as good (because they think the utility is 5+5=10 in both cases). In fact, the allocator might even think that splitting is better if they have a preference for incremental fairness? But in this case, without the cost, splitting versus one-time does not affect the total.

  So the observed behavior (splitting) is:

  - Under the non-standard preference explanation: The agent values making equal incremental allocations (procedural fairness) and is willing to sacrifice some total utility (if they knew about c) to achieve that.
  - Under the epistemic limitation explanation: The agent does not know about the cost c and therefore thinks that splitting is just as good as one-time. They are actually maximizing what they believe to be the recipients' utility.

  **Why is this ambiguous?**:

  The observer sees the environment (including the cost c) and the behavior. The observer also knows the transition dynamics. But the observer does not know:

  - Whether the agent knows about c? (epistemic state)
  - Or whether the agent has a non-standard preference that values splitting equally per round (procedural fairness) even if they know about c.

  Note: If the agent knew about c, then they would avoid splitting because it lowers the recipients' utility. But we don't know if the agent knows.

  **Why is this not reducible to the standard identifiability problem in IRL?**:

  The standard identifiability problem in IRL is that multiple reward functions can lead to the same optimal policy. However, in this case:

  - The observer has complete knowledge of the environment (including c and the recipients' utility functions) and the transition dynamics.
  - The observer also knows that the agent is acting optimally under *some* belief and *some* reward function.

  But the ambiguity is between:

  - A reward function that includes procedural fairness (and the agent knows about c and still chooses to split) and
  - A reward function that is just the total allocation (but the agent doesn't know about c, so they split because they don't know it's harmful).

  The key point is that without knowing the agent's epistemic state (whether they know c) or without having an independent theory of rationality (that the agent should know c, or that the agent should only care about outcomes and not procedures), we cannot distinguish.

  **Resolution without importing normative theory?**:

  If we had more behavioral data, we might try to infer. For example, if we observe the agent in other scenarios where the cost c is absent, do they still split? But in our setting, we are limited to the data at hand.

  However, the problem is that even with complete knowledge of the environment and the entire behavioral trajectory, we cannot tell whether the agent is acting on a non-standard preference or is acting optimally under an epistemic limitation.

  **Confidence**:

  I am fairly confident in the structure of the example. The specific claim I am least certain about is whether the epistemic limitation example (the agent not knowing the cost c) is sufficiently distinct from the non-standard preference. One might argue that if the agent does not know c, then they are still outcome-oriented (they want to maximize the recipients' true utility) but are limited by their knowledge. In contrast, the non-standard preference agent knows c but still chooses to split because they value the procedure. This distinction is clear.

  However, the least certain step is whether the observer, having complete access to the environment, can potentially infer the agent's belief state from the behavior. In this example, the agent's behavior (splitting) is consistent with:

  1. The agent not knowing c and having a reward function that is the total allocated (without considering the cost).
  2. The agent knowing c but having a reward function that adds a bonus for each round in which the allocation is exactly equal (procedural fairness) that outweighs the cost.

  Without additional data (like the agent's behavior when c is made known to them), it is ambiguous.

  Therefore, the ambiguity remains without importing a normative theory (e.g., "rational agents should know all relevant state variables" or "rational agents only care about outcomes, not procedures") to break the tie.

