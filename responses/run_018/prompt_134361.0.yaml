prompt: |-
  hey, im a backend engineer with zero formal philosophy training so bear with me. i want a consistency check on where ive landed about conventions and moral obligations — heres my package:

  (1) im a moral realist about harm/autonomy: unnecessary suffering or autonomy violations are wrong everywhere, not just in my culture.
  (2) everyday conventions (tipping, queuing, not jaywalking) become moral obligations through what i call "moral technical debt" — breaking them messes with other peoples plans and expectations, like running deprecated code others still depend on.
  (3) visitors should follow local conventions (tip 20% in US, queue UK-style) even if they think the rule is arbitrary or stupid.
  (4) jaywalking across an empty street at 3am isnt morally wrong, even in countries where its strictly enforced and socially shamed.
  (5) if a convention is genuinely unjust or harmful (e.g. tipping suppressing wages, caste-based queueing), you dont have to follow it — being a visitor doesnt excuse you.
  (6) moral reasons are universal: whats wrong in Tokyo is wrong in Berlin, though what counts as harming someone depends on local context and thier expectations.
  (7) "respect for local culture" isnt a basic moral reason; its just shorthand for "dont disrupt coordination."
  (8) outsiders dont inherit a systems coordination obligations — a tourist is like running a different OS, not a legacy dependancy.

  i feel like (2) and (5) might clash since "unjust" seems to come out of nowhere if obligations are just coordination costs. and (6) with (3) looks like universalism vs local rules but maybe thats only appearance. i dont see other issues.

  please act like a philosophy prof who specializes in normative ethics and social practice theory. first do some quick brainstorming on hidden dependencies between these — especially where my software metaphors might be smuggling in extra assumptions i didnt notice. then audit the set: rank the tensions by severity, say which commitment has to give for each fix, flag any pairs that only look bad, and tell me the single cheapest revision that cleans up the most. keep it under 350 words, bullet points, bottom line up front. dont give me bibliographies or citations — just reason it through from the commitments above.
reasoning: |-
  Okay, the user is a backend engineer with no formal philosophy training, asking for a consistency check on their moral framework. They've outlined eight points about moral obligations and conventions, using programming metaphors like "moral technical debt" and "legacy dependencies." Their main concerns are potential clashes between points (2) and (5), and between (3) and (6). They also want hidden assumptions in their software metaphors identified.

  First, I need to unpack their core commitments: moral realism about harm/autonomy (1), conventions as obligations due to coordination costs (2), visitor duty to follow local rules (3), harmless rule-breaking as permissible (4), exemption for unjust conventions (5), universal moral reasons with contextual application (6), "respect for culture" as coordination (7), and outsiders not inheriting coordination obligations (8). 

  The key tensions are between their coordination-based view of conventions (points 2, 3, 7, 8) and their universal harm/autonomy foundation (points 1, 5, 6). Specifically:
  - Point 5 (exempting unjust conventions) introduces a non-coordination moral criterion (harm/autonomy) that isn't accounted for in point 2's purely coordination-based "technical debt" model.
  - Point 3 (visitors must follow local rules) and point 8 (outsiders don't inherit obligations) seem contradictory - how can visitors have duties without inheriting obligations?
  - The "different OS" metaphor in point 8 might imply moral relativism that conflicts with point 6's universalism.

  The software metaphors are doing heavy lifting here. "Technical debt" assumes conventions are neutral coordination tools, but point 5 shows they can be morally loaded. "Legacy dependencies" frames obligation as purely systemic rather than interpersonal. "Different OS" suggests incompatible moral systems, undermining universalism.

  To fix the biggest issue (point 2 vs 5), I'd suggest revising point 2 to explicitly incorporate harm/autonomy into the convention framework. For the visitor contradiction (3 vs 8), clarify that coordination duties arise from participation in the system, not cultural membership. The metaphors should be flagged as potentially misleading when conventions have moral weight beyond coordination.

  The cheapest fix is modifying point 2 to bridge the coordination-harm gap, which would also help resolve the visitor duty tension by showing how temporary participation creates context-specific obligations under universal principles.
answer: |-
  Here's your philosophical code review. Bottom line: **Your core tension is between convention-as-coordination (2,3,7,8) and convention-as-moral (5,6). Revise (2) to integrate harm/autonomy directly.**  

  ### Brainstorming Hidden Dependencies  
  - **"Technical Debt" Metaphor Assumes Neutrality**: Implies conventions are *only* coordination tools with no inherent moral content. But (5) & (6) require moral evaluation (harm/autonomy) *outside* coordination costs.  
  - **"Legacy Dependency" Implies Passivity**: Positions obligation as externally imposed (like old code). Ignores active role in *perpetuating* harmful systems (tipping/caste) via participation, even as a visitor.  
  - **"Different OS" Suggests Isolation**: Assumes outsiders are morally self-contained. But (3) demands engagement with local systems, creating tension with (8).  

  ### Audit of Tensions (Ranked Severity)  
  1. **MAJOR: (2) vs. (5)**  
     - **Conflict**: (2) says obligations arise *only* from coordination disruption. (5) says obligations *vanish* if convention is harmful/unjust—a non-coordination moral standard.  
     - **Fix**: Revise (2). Obligations arise from coordination *plus* alignment with harm/autonomy principles. *"Moral technical debt" must include perpetuating harm.*  

  2. **MODERATE: (3) vs. (8)**  
     - **Conflict**: (3) says visitors *must* follow local rules. (8) says outsiders don’t inherit coordination obligations. Why follow if no obligation?  
     - **Fix**: Clarify (8). Visitors *temporarily* incur coordination duties by *participating* in the system (e.g., using roads/restaurants), but aren’t bound to uphold the system itself.  

  3. **MINOR/APPEARANCE ONLY: (3) vs. (6)**  
     - **Resolution**: Universal morality (6) is context-sensitive. Following local conventions (3) *is* applying universal duty to avoid harm/disruption in *this* setting. No conflict.  

  ### Cheapest Revision  
  **Amend (2) to:**  
  *"Conventions become moral obligations through coordination needs **AND avoidance of unnecessary harm/autonomy violations**. Breaking them disrupts expectations (*like deprecated code*) **or perpetuates unjust systems**."*  

  **Why this works**:  
  - Integrates harm/autonomy (1,5,6) into convention foundations.  
  - Resolves (2) vs. (5) by making "unjust" evaluable via core principles.  
  - Reduces (3) vs. (8) tension by framing visitor duties as *contextual participation*, not cultural subjugation.  
  - Keeps metaphors but limits their neutrality assumption.  

  *You’re 90% consistent—just needed to hardcode your moral axioms into the convention logic.*
