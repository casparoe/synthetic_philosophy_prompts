prompt: |-
  Consider the record of a conservative institutional theorist who appeals to Chesterton's fence and Burkean arguments about embedded social wisdom. Her rulings: she opposed removing an unwritten convention that ministers who mislead parliament must resign, because its enforcement depended on tacit norms not captured by law; she favored retaining a hereditary legislative chamber stripped of veto power, since its selection mechanism cultivated a distinctive deliberative temperament; she endorsed abolishing a guild entry monopoly once state certification duplicated its explicit quality-control purpose and no residual social role was visible; she resisted replacing customary local arbitration with a centralized tribunal despite efficiency gains, citing unarticulated community-binding effects; and she accepted separating civil marriage registration from religious ceremony, leaving both intact, on the grounds that bureaucratic and ritual functions could be disentangled without loss. Now she faces a proposal to replace a mandatory multi-day legislative recess—instituted to cool partisan passion—with an algorithmic amendment-filter that scores proposals for coherence and advances only high-scoring ones, eliminating the human delay while sharpening the reflective purpose. Predict her verdict. Lay out at least two rules consistent with her prior judgments—say, a strict principle that every hidden purpose must be mapped and replicated before an institution is altered, versus a functionalist principle that permits explicit-purpose substitution when hidden social roles are either absent or relocatable. State what each rule predicts here, give your best guess with reasons, identify the closest prior analog, and name the further case—perhaps a documented but technologically irreplicable embodied ritual—that would separate the two rules.
reasoning: |-
  Hmm, this is a fascinating thought experiment about a conservative institutional theorist facing a procedural reform. Let me unpack this carefully.

  The theorist has a clear pattern: she protects institutions with embedded tacit knowledge, but allows change when explicit functions are duplicated or social roles vanish. Key examples include defending ministerial resignation norms and local arbitration, while accepting guild monopoly abolition when state certification took over its quality control.

  Now she faces replacing a mandatory cooling-off period with an algorithmic filter. The recess has an explicit purpose (reduce partisan passion) and likely hidden functions like informal networking or constituency feedback. The algorithm promises efficiency while maintaining a "reflective purpose" through scoring coherence.

  Considering her principles:
  - Strict mapping rule would require proving all hidden recess functions are preserved by the algorithm. But how does one replicate serendipitous hallway conversations with code?
  - Functionalist rule might allow change if hidden functions are relocatable. Perhaps digital deliberation tools could absorb some networking functions.

  The closest analog is probably her guild decision - she abolished it when state certification covered the explicit purpose and no residual role remained. Here though, the recess likely has unarticulated social functions beyond cooling passions.

  I'm leaning toward opposition. Her local arbitration ruling shows particular concern for community-binding effects that resist quantification. An algorithm can't replicate the human elements of delay - the organic reconciliation that happens when opponents accidentally share an elevator.

  The decisive case would involve something like replacing a centuries-old parliamentary ceremony (say, the British mace ritual) with a digital equivalent. The strict mapper would demand impossible replication of embodied tradition, while the functionalist might accept if "dignity signaling" is maintained through other means.
answer: |-
  Based on her consistent pattern of prioritizing embedded social wisdom and the unarticulated functions of institutions, the theorist would **oppose replacing the mandatory legislative recess with the algorithmic filter**. Here's the breakdown:

  ### Two Consistent Rules
  1.  **Strict Tacit-Function Mapping Principle:** *Any institution with demonstrated historical persistence cannot be altered until all its tacit functions (beyond the explicit purpose) are identified, understood, and explicitly replicated or preserved in the new system.*
  2.  **Functionalist Purpose-Substitution Principle:** *An institution may be altered if its explicit purpose is demonstrably achieved better by a new system, provided that either: (a) no significant residual tacit social function exists, or (b) any such function can be adequately relocated or reproduced within the new institutional context.*

  ### Predictions of Each Rule for This Case
  *   **Strict Mapping Principle Predicts: OPPOSITION.** The recess clearly has an explicit purpose (cooling partisan passion), but the theorist's prior rulings show deep skepticism that this is the *only* function. Analogous to local arbitration (unarticulated community-binding effects) and the hereditary chamber (distinctive deliberative temperament cultivated by selection), a multi-day recess likely fosters numerous hidden functions: informal cross-party negotiation during downtime, constituency contact and pressure absorption, reflection influenced by external events/news cycles, relationship-building outside the formal chamber, symbolic demonstration of deliberation's inherent slowness. The algorithm only replicates the *explicit* cooling/reflection purpose (arguably sharpening it for coherence). It cannot demonstrably replicate these complex, human, social, and potentially serendipitous functions. Therefore, alteration is forbidden until all functions are mapped and replicated – an impossible task.
  *   **Functionalist Principle Predicts: OPPOSITION (but potentially open to modification).** The new system arguably achieves the *explicit* purpose (promoting reflection on proposals) more efficiently and perhaps more objectively regarding coherence. However, the recess almost certainly possesses significant *residual tacit social roles* analogous to local arbitration: facilitating informal relationship-building, enabling external feedback absorption, providing symbolic space for democratic deliberation. The proposal offers *no mechanism* to relocate or reproduce these functions. The algorithm filters *proposals*, not the *legislators* themselves. It eliminates the human interaction and temporal space where these functions occur. Unless the proposers can demonstrate how these vital social/political functions are preserved elsewhere or irrelevant (which they haven't), the Functionalist Principle also requires opposition.

  ### Best Guess & Reasons: **OPPOSE the Replacement**
  *   **Reasoning:** This case strongly echoes her rulings on **ministerial resignations** (tacit norms essential for enforcement) and **local arbitration** (unarticulated community-binding effects outweighing efficiency gains). The recess is an institutional "delay" mechanism whose value stems from complex human and social processes occurring *during the delay itself*, not just the outcome of "cooler heads." Replacing the human, temporally-based, socially embedded process with a purely procedural, algorithmic filter focused solely on proposal coherence fundamentally misunderstands the likely depth of the recess's tacit functions. It treats the problem as purely cognitive (passion vs. coherence) when her philosophy suggests the solution lies in social and temporal embeddedness. The algorithm cannot replicate the human experience of time, informal interaction, or symbolic weight of a deliberate pause.
  *   **Closest Prior Analog:** **Opposing the replacement of customary local arbitration with a centralized tribunal.** In both cases:
      *   Explicit purpose (efficient dispute resolution / cooling passion) is claimed to be achieved better by the new system.
      *   The theorist identifies likely unarticulated, socially embedded functions (community-binding / complex social & relational processes during delay).
      *   The new system (centralized tribunal / algorithmic filter) is purely functional and procedural, lacking the capacity to host those social functions.
      *   Efficiency gains are deemed insufficient justification for losing embedded social wisdom.

  ### Case Separating the Two Rules: **Replacing a Sacred/Embodied Ritual**
  *   **Scenario:** A documented, centuries-old ritual performed within a legislature or civic institution (e.g., a specific oath-taking ceremony involving physical objects and prescribed movements, a traditional opening procession with symbolic garments, a specific voting ritual using non-standard objects). Its explicit purpose is clear (e.g., solemnizing an oath, marking the session's opening, recording a vote). A proposal suggests replacing it with a more efficient, technologically verified process (e.g., digital oath with biometrics, digital session start button, electronic voting) that perfectly achieves the explicit purpose.
  *   **Analysis:**
      *   **Strict Mapping Principle:** Would **OPPOSE** vehemently. The ritual's value lies in its *embodied practice*, historical continuity, symbolic weight, and the tacit communal understanding and feeling generated *by performing it*. These are inherently tied to the specific physical actions, objects, and context. Technology cannot "map" and "replicate" the embodied, experiential, and deeply tacit aspects. The ritual *is* the function; altering the form destroys the function.
      *   **Functionalist Principle:** Would **potentially ACCEPT**, *if* proponents could demonstrate either:
          *   **(a) Absence of Residual Tacit Role:** Argue the ritual is purely performative superstition with no real residual social/communal binding or meaning-making role in the modern institution (highly unlikely for a documented, persistent ritual).
          *   **(b) Relocatable Function:** Propose a way the *social function* (solemnity, communal identity, historical continuity) is adequately reproduced elsewhere in the institution's practices or through modified elements of the new process (e.g., a digital display showing the ritual's history alongside the biometric oath, preserving symbolic garments in a display). Success depends on convincing the theorist the *core social wisdom* is preserved, not just the explicit output.
  *   **Why it Separates:** The Strict Mapper sees the embodied ritual as *inherently* irreplicable; its function *is* its specific historical form. The Functionalist, while deeply respectful, is open to the *possibility* that the underlying social function could be maintained through conscious adaptation and relocation within a modernized framework, even if the original form changes, provided the social role isn't lost. The legislative recess case lacks even this potential for functional relocation within the algorithmic proposal.
