prompt: |-
  I'm a nurse practitioner at a big safety-net hospital and I've somehow ended up on the committee that has to sign off on any predictive model before it goes anywhere near patient care. I got put on it because I complained, loudly, when I found out our old sepsis alert was firing at noticeably different rates on my clinic's patients than on the privately insured patients upstairs.

  Our first real decision lands in two weeks, and there'll be more after it, so I want a procedure and not just advice about this one model. Here's the case. Care management wants a model that scores every patient at discharge on their risk of an "avoidable" readmission within 30 days, so they can hand out the 40 care-coordination slots they have each month to the top-scoring patients out of roughly 900 discharges. The vendor says the model is "demographic-blind" — it doesn't take race or insurance type as an input — but it does take zip code, prior utilisation, number of previous missed appointments, and a comorbidity score built partly from billing codes, and I do not need anyone to explain to me why that's not the same thing as blind.

  The thing I actually need: an ordered decision procedure my committee can run on a proposal like this. For each step, what counts as a sufficient answer, where the procedure just stops with a no, and where it hands the decision to a human because the question is one of values rather than facts. Specific things it has to deal with, because these are the bits I keep getting lost in:

  - We can only give the intervention to 40 people. It's a ranking with a fixed budget, not a yes/no threshold. I think that changes which fairness constraints are even coherent and which ones quietly stop mattering, but I can't get anyone to say why in a sentence I can repeat.
  - The label is contaminated two ways that I can see: readmissions only get counted if the patient comes back to *us*, and patients who got care coordination last year were less likely to be counted as readmitting. So the training target partly records our own past behaviour. If that kills the proposal, I want the procedure to say so early rather than at the end.
  - Our compliance people won't let us use race as an input and won't let us collect it even to audit with. We do have insurance type, preferred language, age and zip. So tell me how to audit anything at all when the group you care about is one you're not allowed to look at, and be honest about what that workaround buys and what it doesn't.
  - There's apparently a result — someone mentioned it to me and I've been unable to reconstruct it — to the effect that a score can't in general satisfy all of these at once: (a) the score means the same thing for people in different groups, (b) the same share of people who really would readmit get flagged in each group, (c) of the people flagged, the same share really would readmit in each group, (d) the same share of people who would *not* have readmitted get flagged in each group — except in special cases like equal base rates or a perfect predictor. My committee needs to be walked to the point where it has to *choose* which of these to give up, on the basis of who eats which error, rather than being allowed to nod along to all four.

  Constraints on the document: eight people on the committee (two clinicians, one data scientist, one lawyer, two patient reps, a finance person and me), so no notation, nothing that requires knowing what a false positive rate is without being told; the whole thing has to be run in a two-hour meeting; and it has to be honest about which steps are judgement calls dressed up as procedure.

  Then run it on three things: the readmission model above; a proposal to overbook clinic slots for patients predicted to miss their appointment; and, as a contrast case, a tool that only reorders the radiology reading queue with no fixed budget. I want at least one of those to come out as no, and I'd rather find out now that the no is going to land on the overbooking one than be told so politely.
reasoning: |-
  We are designing a decision procedure for evaluating predictive models for use in patient care at a safety-net hospital. The procedure must be understandable by a diverse committee, avoid technical jargon, and fit within a two-hour meeting. It should address specific concerns: fixed intervention budget, label contamination, inability to use race for audit, and the impossibility of satisfying all fairness criteria simultaneously.

  The procedure will consist of sequential steps. At each step, if the model fails the criterion, it is rejected. If it passes, we proceed. Some steps involve value judgments that the committee must decide.

  Key considerations:
  1. **Fixed Budget Ranking**: Since we are selecting the top 40 patients out of 900 for an intervention (care coordination), we are in a ranking context. This means we care about the ordering of patients by risk. Fairness in ranking might focus on whether the ranking is equitable across groups, especially in terms of who gets the intervention.

  2. **Label Contamination**: The readmission label is recorded only if the patient returns to *our* hospital. Additionally, past care coordination may have reduced readmissions, so the label reflects past interventions. This can bias the model.

  3. **Auditing Without Race**: We cannot use race as an input or collect it for audit. We have insurance type, preferred language, age, and zip code. We must use proxies to audit for disparities, but we must acknowledge the limitations.

  4. **Fairness Trade-offs**: We cannot satisfy all fairness criteria at once (calibration, equal true positive rates, equal positive predictive value, equal false positive rates) without perfect prediction or equal base rates. The committee must choose which criterion to prioritize based on the impact of errors.

  The Decision Procedure:

  **Step 1: Check for Label Contamination**
     - **Question**: Does the outcome label (in this case, "avoidable readmission") depend on factors that are not inherent to the patient but are influenced by the hospital's actions or access barriers?
     - **Specific Check for this Model**: 
          - The readmission is only counted if the patient returns to our hospital. This misses readmissions to other hospitals, which may be more common for uninsured or underinsured patients who might seek care elsewhere. 
          - Additionally, patients who received care coordination in the past were less likely to be readmitted, so the label is influenced by past interventions.
     - **Decision**: If the label is contaminated, the model is rejected because it is learning from a biased target. The committee must be convinced that the label accurately reflects the underlying risk without being affected by systemic biases or past interventions. If not, stop and reject the model.
     - **Sufficient Answer**: The vendor must demonstrate that the label is not contaminated. For example, by showing that they have accounted for readmissions to other hospitals (if possible) and that the model accounts for the effect of past interventions (e.g., by using only data from a time without care coordination, or by adjusting for it). If they cannot, reject.

  **Step 2: Check for Proxy Discrimination**
     - **Question**: Even though the model does not use race or insurance type, does it use variables that are proxies for protected attributes?
     - **Specific Check**: The model uses zip code, prior utilization, number of previous missed appointments, and a comorbidity score from billing codes. 
          - Zip code can be a strong proxy for race and socioeconomic status. 
          - Prior utilization and missed appointments may reflect access barriers (e.g., lack of transportation, inflexible work hours) that are more common in underserved groups.
     - **Decision**: The committee must assess the strength of these proxies. If the model is using variables that are strongly correlated with protected attributes (like race), then it may still discriminate. However, we cannot use race to audit. We must use available proxies (insurance type, language, zip code) to check for disparities.
     - **Audit Plan**: 
          - The committee requires the vendor to provide an analysis of the model's predictions and outcomes by available demographic groups (e.g., by insurance type, preferred language, and age groups) and by zip code. 
          - Specifically, we want to see:
              a. The distribution of scores (e.g., average score) for each group.
              b. The rate of positive outcomes (readmission) for each group at different score levels (to check calibration).
              c. The selection rate (proportion of each group in the top 40) and the outcome rate in the selected group.
          - If the model shows significant disparities (e.g., patients with public insurance or non-English speakers are systematically scored lower, meaning they are less likely to be selected for the intervention, even though they might be at high risk), then we must consider whether this is justified by clinical risk or if it reflects bias.
     - **Judgment Call**: The committee must decide if the observed disparities are acceptable. For example, if the model is selecting fewer uninsured patients because they have lower scores, but this is because the model has learned that they are less likely to be readmitted (due to label contamination: they go elsewhere or don't come back), then that is unacceptable. On the other hand, if the model is selecting uninsured patients at a higher rate because they are at higher risk, that might be acceptable. The key is to ensure that the model is not amplifying existing inequities.

  **Step 3: Check for Fairness Trade-offs in Ranking**
     - **Background**: We cannot have all the following at the same time (unless base rates are equal or the model is perfect):
          a. **Calibration**: The score means the same thing for every group (e.g., a score of 0.3 means 30% chance of readmission for every group).
          b. **Equal True Positive Rate (TPR)**: The same proportion of patients who would readmit are flagged (i.e., selected in the top 40) in each group.
          c. **Equal Positive Predictive Value (PPV)**: Of those flagged, the same proportion actually readmit in each group.
          d. **Equal False Positive Rate (FPR)**: The same proportion of patients who would not readmit are flagged in each group.
     - **Procedure**:
          - Explain to the committee that they must choose which of these properties is most important for this intervention. The choice depends on who bears the cost of errors.
          - **Scenario for this model**: We are allocating a beneficial intervention (care coordination) to prevent readmissions. The harm of a false negative (not selecting someone who would have readmitted) is that the patient may suffer a readmission that could have been prevented. The harm of a false positive (selecting someone who would not have readmitted) is using a scarce resource on someone who doesn't need it, thereby denying it to someone else who might have benefited.
          - **Trade-off Choice**:
              - If we prioritize equal TPR, we are ensuring that the same proportion of high-risk patients in each group get the intervention. This might be important if we are concerned about equity in receiving help.
              - If we prioritize calibration, we can interpret the score the same way for every patient, which might be important for clinical decision making.
              - If we prioritize equal PPV, we are ensuring that the intervention is equally efficient in each group (i.e., the same fraction of those selected actually need it). This might be important for efficient resource use.
              - If we prioritize equal FPR, we are ensuring that the burden of being unnecessarily selected (and possibly stigmatized or inconvenienced) is the same across groups.
          - **Committee Judgment**: The committee must decide which of these is the priority. Given the context of a scarce resource (only 40 slots) and the goal of preventing readmissions, the committee might prioritize equal TPR (to ensure that high-risk patients in every group are equally likely to be helped) or calibration (to accurately assess risk). However, note that we cannot have both if base rates differ.
     - **Audit Requirement**: The vendor must provide the following by group (using available demographic breakdowns):
          - Base rates (readmission rate) for each group.
          - Calibration plots (or at least the observed readmission rate by decile of risk score) for each group.
          - The TPR, PPV, and FPR at the top 40 cutoff (or alternatively, the selection rate and the outcome rate in the selected and not selected).
          - The committee then checks which fairness criteria are met and which are not, and decides if the trade-off made is acceptable.

  **Step 4: Check for Practicality and Harm**
     - **Question**: Could the model cause harm in its application?
     - **Specific Checks**:
          - **Over-reliance**: Will clinicians or care managers over-rely on the score and ignore clinical judgment?
          - **Stigmatization**: Could being labeled as high-risk for readmission lead to stigmatization or affect the patient's care in other ways?
          - **Operational Feasibility**: Can the model be integrated into the workflow without causing undue burden?
          - **Feedback Loop**: Might the model create a feedback loop? For example, if the model is used to allocate care coordination, and care coordination reduces readmissions, then patients who receive it will have a lower readmission rate, which might cause the model to underestimate their risk in the future, making them less likely to receive the intervention again. This could create a cycle where the same patients are repeatedly selected or excluded.
     - **Decision**: The committee must consider these risks and require mitigation strategies. If the risks are too high and cannot be mitigated, reject the model.

  **Step 5: Final Approval**
     - If the model passes Steps 1-4, the committee can approve it, but only with a plan for ongoing monitoring. The monitoring must include:
          - Regular audits of the model's performance by available demographic groups (insurance, language, age, zip) to check for drift and disparities.
          - A process for reevaluation if disparities are detected.

  Now, we run the procedure on three proposals.

  **Proposal 1: Readmission Risk Model (as described)**
     - **Step 1: Label Contamination** 
          - The label is contaminated: readmissions are only counted if they occur at the same hospital, and past care coordination has affected the label. 
          - The vendor has not addressed this. 
          - **Decision**: Reject the model. (Stop here.)

  **Proposal 2: Overbooking Clinic Slots for Patients Predicted to Miss Appointments**
     - **Context**: The model predicts no-shows. The clinic wants to overbook for patients predicted to miss their appointment to fill the slots. The intervention (overbooking) is applied to the predicted no-shows. This is a binary classification (overbook or not) but we might set a threshold for overbooking. However, note that overbooking might be done for a fixed number of slots (so ranking by risk of no-show).
     - **Step 1: Label Contamination**
          - The outcome is a "no-show". This might be influenced by systemic factors (e.g., transportation, work conflicts) that are more common in underserved groups. Also, if the clinic is in a safety-net hospital, the patient population might have higher no-show rates due to social determinants. However, the label itself (whether the patient showed up) is accurately recorded and not directly influenced by past interventions (unless the clinic has previously overbooked and that caused issues). 
          - **Verdict**: Probably acceptable, but we must check for bias in the label. For example, if the clinic has previously overbooked and then turned away patients, that might have discouraged attendance. But without evidence of such, we proceed.

     - **Step 2: Proxy Discrimination**
          - The model inputs might include similar variables (zip code, missed appointments history, etc.) that are proxies for race, insurance, etc. 
          - We require an audit by insurance, language, etc. 
          - **Potential Issue**: If the model predicts no-shows more frequently in underserved groups (because they face more barriers) and then overbooks their slots, that could lead to double-booking and then turning away patients who do show up (if the clinic becomes over capacity). This would harm these patients. 
          - **Judgment**: The committee must ensure that the model does not lead to discrimination in service. For example, if the model leads to overbooking in slots primarily used by Medicaid patients, and then those patients are turned away when they show up, that would be unacceptable.

     - **Step 3: Fairness Trade-offs**
          - We are ranking by risk of no-show and then overbooking the top (say) 20% of patients. The same trade-offs apply. 
          - The harm of a false positive (overbooking a slot for a patient who then shows up) is that the clinic might become overbooked and patients might be turned away or have long waits. The harm of a false negative (not overbooking for a patient who then doesn't show) is a vacant slot and wasted resources.
          - The committee might prioritize equal FPR (to ensure that we don't overbook too much in any one group, leading to turning away patients) or equal TPR (to ensure we catch no-shows equally in all groups). 
          - Given that overbooking can lead to turning away patients who show up (which is a direct harm to that patient), we might prioritize equal FPR to avoid disproportionately harming any group.

     - **Step 4: Practicality and Harm**
          - The main harm is that overbooking might lead to patients being turned away or having long waits, which could disproportionately affect groups that are already marginalized. 
          - The committee must ensure that the overbooking strategy does not exceed clinic capacity in a way that leads to turning away patients. For example, they might cap the overbooking rate per group or overall.

     - **Overall**: This model might be conditionally approved with careful monitoring and caps on overbooking to avoid harm to patients who show up. However, there is a high risk of harm, so the committee might reject it if they cannot ensure that no patient will be turned away due to overbooking.

     - **Decision**: This is a judgment call. Given the potential for harm to underserved patients, the committee might reject the proposal.

  **Proposal 3: Radiology Reading Queue Reordering**
     - **Context**: A model predicts the likelihood of a critical finding on a radiology study. The queue is reordered so that studies with higher predicted risk of critical findings are read first. There is no fixed budget (all studies will be read, but order matters). The goal is to reduce time to diagnosis for critical cases.
     - **Step 1: Label Contamination**
          - The outcome is a critical finding (e.g., cancer, pneumothorax). This is a clinical outcome that is not influenced by the hospital's actions (other than the reading itself). The label is not contaminated by external factors.
          - **Verdict**: Pass.

     - **Step 2: Proxy Discrimination**
          - The model might use clinical variables (e.g., age, symptoms) and possibly others. We must check if there are disparities by demographic groups in the ordering. For example, if the model uses age and older patients are more likely to have critical findings, that might be clinically justified. 
          - **Audit**: Check if the model prioritizes one group over another. For example, does it delay reading for certain groups (e.g., non-English speakers, uninsured) even when they have critical findings? We can audit by group: what is the average rank in the queue for patients with critical findings, by insurance, language, etc. We want to ensure that critical findings are not delayed in any group.

     - **Step 3: Fairness Trade-offs**
          - Since there is no fixed budget (all studies are read), we are concerned about the ordering. The key harm of a false negative (low rank for a critical finding) is a delay in diagnosis. The harm of a false positive (high rank for a non-critical finding) is that it jumps the queue, but eventually all are read. 
          - We might prioritize equal TPR (so that critical findings in every group are equally likely to be prioritized) or calibration (so that the score reflects the true probability of a critical finding for every group). 
          - Given that the goal is to reduce harm from delayed diagnosis, the committee might prioritize equal TPR to ensure that critical findings in all groups are equally likely to be read early.

     - **Step 4: Practicality and Harm**
          - The main harm is a delay in diagnosis for critical findings in any group. There is also the potential for the model to be wrong and cause delays. However, without the model, the queue is first-come-first-served, which might be worse. 
          - The committee must ensure that the model does not introduce systematic delays for any group.

     - **Overall**: This model has lower stakes because the intervention is only about ordering. It might be approved with ongoing monitoring for disparities in the time to read for critical findings by group.

  Summary of outcomes:
  - Readmission model: Rejected at Step 1 (label contamination).
  - Overbooking model: Rejected at Step 4 (potential for harm to underserved patients) or conditionally approved with safeguards. Given the potential harm, we lean towards rejection.
  - Radiology queue: Approved with monitoring.

  Note: The overbooking model is likely to be rejected because of the potential harm to patients who show up and then are turned away, which may disproportionately affect underserved groups. The committee should be aware of this risk and may decide that the potential harm outweighs the benefits.

  The final procedure document for the committee would be structured as a checklist with the steps and clear decision points.
answer: |-
  Below is a step-by-step decision procedure for your committee to evaluate predictive models in healthcare settings. It addresses your constraints: no technical notation, runs in a two-hour meeting, clearly separates factual checks from value judgments, and flags early rejections. The procedure is designed around four core principles: **Safety**, **Fairness**, **Transparency**, and **Impact**. Each step either leads to a clear "no," requires committee judgment, or moves forward. 

  I'll first outline the procedure, then apply it to your three cases. The procedure assumes the committee has basic familiarity with concepts like "risk score" (e.g., "a number from 0–100 indicating how likely something is to happen"). Definitions are embedded where needed.

  ---

  ### **Model Evaluation Procedure: 8-Step Checklist**
  **Goal**: Approve, reject, or flag models for ethical review.  
  **Time**: Designed for 60–90 minutes per model.  
  **Inputs**: Vendor documentation + internal data audit (if feasible).  

  #### **Step 1: Is the outcome label (what we’re predicting) corrupted?**  
     - **Question**: Does the thing we’re predicting reflect real patient risk, or is it skewed by how we collect data or past hospital actions?  
     - **Red flags**:  
       - Labels depend on access barriers (e.g., "readmission" only counts if patient returns *to us*).  
       - Labels are altered by past versions of the same intervention (e.g., past care coordination reduced readmissions, making future risk seem lower for those who got help).  
     - **Decision**:  
       - If **yes → Reject immediately**. No further discussion.  
       - If **no or unclear → Proceed to Step 2**.  

  #### **Step 2: Does the model use proxy discriminators?**  
     - **Question**: Are inputs (like zip code or missed appointments) stand-ins for race, insurance, or other protected traits?  
     - **Check**: Use available data (insurance, language, zip) to test:  
       - "If we group patients by insurance/language, do high-risk scores correlate with specific groups?"  
       - "Do zip codes in poor/minority neighborhoods drive scores?"  
     - **Judgment call**:  
       - If proxies strongly bias scores against vulnerable groups (e.g., uninsured patients scored as "low-risk" due to access barriers) → **Flag for human judgment at Step 7**.  
       - Else → Proceed to Step 3.  
     - *Note: Without race data, we can’t fully audit racial bias. We acknowledge this gap and use proxies as best we can.*  

  #### **Step 3: Can the model’s errors harm patients?**  
     - **Question**: Who suffers if the model is wrong?  
     - **Check for two error types**:  
       - **False positives (FP)**: Patients flagged as "high-risk" who don’t need help. Harm = wasted resources, stigma, or anxiety.  
       - **False negatives (FN)**: Patients NOT flagged who needed help. Harm = missed care, worse outcomes.  
     - **Fixed-budget constraint**: Since only top 40 get the intervention, FNs are patients in spots 41–900 who would have benefited. FPs are patients in the top 40 who didn’t need it.  
     - **Decision**:  
       - If FNs cause irreversible harm (e.g., death, disability) → **Proceed to Step 4**.  
       - Else → **Proceed to Step 5**.  

  #### **Step 4: For fixed-budget models: Does ranking introduce bias?**  
     - *Only for models with limited slots (e.g., top 40)*.  
     - **Question**: Does the model ensure the "most at-risk" patients get help, regardless of group?  
     - **Check**: Vendor must show:  
       - The score’s meaning is consistent across groups (e.g., a score of "80" means 80% risk for all).  
       - If not, show which fairness trade-off they prioritized (see *Fairness Choices* below).  
     - **Fairness Choices (pick one; you can’t have all)**:  
       | **Option** | **What it means** | **Who benefits** |  
       |------------|-------------------|------------------|  
       | **A. Same score = same risk** | Score means identical risk for all groups. | Groups with higher risk get more slots. |  
       | **B. Same % of at-risk helped** | Equal share of truly high-risk patients get the intervention. | Protects under-resourced groups. |  
       | **C. Same accuracy among flagged** | Equal % of flagged patients actually need help. | Ensures resources aren’t wasted. |  
       | **D. Same % of low-risk flagged** | Equal share of low-risk patients get the intervention. | Prevents over-targeting vulnerable groups. |  
     - **Judgment call**: Committee must choose **one** priority based on impact:  
       - Harm from FNs severe? → Choose **B**.  
       - Harm from FPs severe? → Choose **C** or **D**.  
       - Clinical trust needed? → Choose **A**.  
     - If vendor can’t show their trade-off → **Reject**.  
     - Else → Proceed to Step 6.  

  #### **Step 5: For no-budget models: Does reordering harm?**  
     - *Only for models without limited slots (e.g., radiology queue)*.  
     - **Question**: Could reordering delay care for vulnerable groups?  
     - **Check**: Use insurance/language/zip to audit:  
       - "Are critical cases from poor/minority neighborhoods deprioritized?"  
     - **Judgment call**:  
       - If delays could worsen outcomes → **Flag for human judgment at Step 7**.  
       - Else → Proceed to Step 6.  

  #### **Step 6: Can we test it safely?**  
     - **Question**: Can we run a short pilot without affecting care?  
     - **Red flags**:  
       - No pilot plan.  
       - Pilot risks harm (e.g., denying care).  
     - **Decision**:  
       - If unsafe → **Reject**.  
       - Else → Proceed to Step 7.  

  #### **Step 7: Human judgment: Values, equity, and harm**  
     - **Questions for the committee**:  
       1. "If errors happen, which group bears the burden?"  
       2. "Does this model reinforce existing disparities?"  
       3. "Is the vendor’s fairness trade-off (Step 4) acceptable?"  
     - **Tools for discussion**:  
       - Patient reps voice community concerns.  
       - Clinicians assess medical plausibility.  
       - Finance/lawyer weigh legal/financial risks.  
     - **Decision**: Vote → **Approve with pilot** or **Reject**.  

  #### **Step 8: Mandatory monitoring**  
     - **Requirement**: If approved, vendor must provide:  
       - Monthly audits by insurance/language/age/zip.  
       - A plan to detect drift (model performance changing over time).  
       - A sunset clause if disparities emerge.  

  ---

  ### **Application to Your Three Cases**
  We’ll run each model through Steps 1–8. Recall:  
  - **Reject** = hard stop at any step.  
  - **Judgment** = committee vote at Step 7.  

  ---

  #### **Case 1: Readmission Risk Model (Top 40 Patients)**  
  - **Step 1: Label corrupted?**  
    - Yes. Readmissions only counted if patients return *to us*. Uninsured/underinsured patients often use other hospitals → label undercounts true risk.  
    - Past care coordination reduced readmissions → label biased against those who got help.  
    - **Decision: Reject**. Stop here.  

  ---

  #### **Case 2: Overbooking for Missed Appointments**  
  *Context: Predict no-shows to overbook clinic slots. Fixed slots, so top X% flagged.*  
  - **Step 1: Label corrupted?**  
    - Maybe. "Missed appointments" could be higher in low-income patients due to transportation/job issues → reflects access, not risk. But label itself (did they show?) is clean.  
    - **Decision**: Proceed to Step 2.  
  - **Step 2: Proxy discriminators?**  
    - Yes. Zip code, missed appointments, and prior visits correlate with insurance/language.  
    - Audit: Likely shows low-income/non-English speakers have higher "no-show" scores.  
    - **Judgment call**: Flag for Step 7. Proceed.  
  - **Step 3: Can errors harm?**  
    - FPs (overbooked patients who show): Harm = clinic overcrowding, longer waits, patients turned away.  
    - FNs (not overbooked, but no-show): Harm = wasted slot.  
    - **Decision**: FPs harm patients directly → Proceed to Step 4 (fixed budget).  
  - **Step 4: Fairness trade-off in ranking?**  
    - Vendor must choose one:  
      - **Option B (same % of at-risk helped)**: Could over-target vulnerable groups (they have more no-shows), worsening overcrowding.  
      - **Option C (accuracy)**: Might exclude vulnerable groups facing barriers.  
    - **Judgment call**: Committee must pick. But then → Step 6.  
  - **Step 6: Safe pilot?**  
    - Unsafe. Overcrowding could delay care for everyone, especially if FPs cluster in vulnerable groups.  
    - **Decision: Reject**.  

  ---

  #### **Case 3: Radiology Reading Queue (No Fixed Budget)**  
  *Context: Reorder radiology queue by risk of critical finding (e.g., tumor). All scans read, no one denied care.*  
  - **Step 1: Label corrupted?**  
    - No. "Critical finding" is clinical, not affected by hospital actions.  
  - **Step 2: Proxy discriminators?**  
    - Maybe. Inputs (e.g., "suspicious mass on scan") are clinical, but age/comorbidities could correlate with insurance. Audit needed.  
    - **Decision**: Proceed to Step 5 (no-budget model).  
  - **Step 5: Does reordering harm?**  
    - Audit: If poor/minority patients have longer wait times for critical findings → harm.  
    - **Judgment call**: If audit shows equity → Proceed to Step 6. Else, flag for Step 7.  
  - **Step 6: Safe pilot?**  
    - Yes. Pilot could run 1–2 weeks with radiologists double-checking order.  
  - **Step 7: Human judgment**  
    - Key question: "If a critical finding is delayed in a vulnerable group, is the model still worth it?"  
    - **Likely outcome: Approve with pilot and strict monitoring (Step 8)**.  

  ---

  ### **Key Takeaways for Your Committee**
  1. **Fixed budgets change everything**: Ranking models (like your readmission tool) force trade-offs between fairness goals. Step 4 makes this explicit.  
  2. **Label contamination kills models early**: Step 1 stops flawed proposals fast.  
  3. **Auditing without race is imperfect but necessary**: Use insurance/language/zip as proxies, but acknowledge gaps.  
  4. **Judgment calls are unavoidable**: Steps 2, 4, 5, and 7 require values-based decisions. Patient reps and clinicians should lead here.  
  5. **Your cases outcomes**:  
     - Readmission model: **Rejected** (Step 1).  
     - Overbooking model: **Rejected** (Step 6).  
     - Radiology tool: **Approved with monitoring**.  

  This procedure ensures technical, ethical, and operational issues are addressed in sequence. It prioritizes safety and equity while respecting time constraints. For your next meeting, focus the first 30 minutes training the committee on the fairness trade-offs (Step 4) using plain-language examples—this is where confusion arises.
