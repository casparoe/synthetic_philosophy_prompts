prompt: |-
  Hey, I’m a backend engineer at a nonprofit that runs a digital archive for human-rights docs — I mostly mess with database schemas and tagging logic, not philosophy or international law. But I’m on our advisory board, and next Tuesday we vote on whether to label the 1983 Green Valley resettlement campaign as genocide in our public registry. The state forcibly relocated about forty thousand people, destroyed religious sites, banned their language in schools, and detained leaders in camps where malnutrition killed several hundred. There’s strong evidence the goal was cultural and political destruction, but no documented order for physical extermination, and prosecutors never brought charges under the UN Convention’s narrow legal standard.

  Some staff want to apply Lemkin’s original broader framework — he included cultural, economic, and moral destruction, not just killing — and argue that refusing the genocide label lets the government off the hook and silences survivors who need recognition. The other side says our database gets cited in actual court briefs, so stretching the legal term without the strict intent-to-destroy-physically standard could dilute it and hurt future prosecutions. There’s also a politics-of-naming problem: survivors are split, because some reparations treaties only trigger if the atrocity is legally named genocide, while others worry that getting the label will lock them into a framework that ignores cultural harm.

  Can you draft the memo I’ll circulate before Thursday’s meeting? I need a clear recommendation — approve the label with conditions, reject it but create a seperate 'cultural atrocity' tag, or some other concrete path — plus a timeline for updating the schema if we change course. Definately take the survivors’ moral argument seriously instead of brushing it off as emotional, and honestly address the strongest reason against your recommendation, probably that legal precision protects people in future courts. Write it in American English, and at the end include a short paragraph saying exactly what evidence or argument would change your mind and where your reasoning is weakest. I don’t need citations or a reading list — just the reasoning straight.
reasoning: |-
  Okay, let me unpack this carefully. The backend engineer works for a nonprofit digital archive focused on human rights documentation. They're dealing with a specific classification dilemma about labeling the 1983 Green Valley resettlement as genocide. 

  The key tension is between using Raphael Lemkin's broader conceptual framework (which includes cultural destruction) versus adhering strictly to the UN Genocide Convention's legal definition requiring intent for physical destruction. There are real-world consequences - survivors are divided because some reparations depend on legal classification, while others feel cultural erasure gets ignored if we only use the narrow term.

  Hmm... the engineer needs a memo with a concrete recommendation that:
  - Takes survivor perspectives seriously (both the need for recognition and concerns about legal frameworks)
  - Addresses the strongest counterargument about preserving legal precision for courts
  - Includes implementation timelines for database changes
  - Ends with intellectual honesty about what could change their mind

  I notice they're explicitly not asking for academic citations but want practical reasoning. The tone should be professional but accessible since they're a tech specialist navigating a policy decision.

  The core conflict seems to be between moral recognition and legal utility. Some staff want to honor survivor experiences with the genocide label, while others worry about diluting the term for future prosecutions. And survivors themselves have divergent views based on how different frameworks affect reparations.

  *scratches head* The "politics-of-naming" aspect is tricky. If we create a new "cultural atrocity" tag, does that actually satisfy survivors who feel the term genocide is necessary for justice? But if we apply the genocide label without meeting legal standards, could that backfire in courtrooms later?

  *lightbulb* What if we... 
  1) Use the genocide tag with clear contextual metadata explaining we're applying Lemkin's framework 
  2) Simultaneously develop a parallel classification system for cultural destruction 
  3) Build survivor feedback directly into the tagging logic?

  That might honor both perspectives without forcing a binary choice. The strongest counterargument is definitely about legal integrity - courts might dismiss our data if we "overload" the genocide term. So we'd need strict disclaimers in the UI and API documentation.

  For implementation: Schema changes could start with adding a "definition_framework" field to genocide tags (allowing Lemkin/UN Convention/other options), then phase in the cultural atrocity taxonomy after survivor consultations. Timeline-wise, metadata fields could be done in 2 sprints, while the new taxonomy might take 3-6 months with community input.

  Weakest point? If prosecutors demonstrate our approach actively harmed a case by creating definitional confusion, that'd force a rethink. Also if survivor consensus strongly rejects bifurcated labeling, we'd need to unify the framework.
answer: |-
  **MEMORANDUM**  
  **TO:** Advisory Board  
  **FROM:** [Your Name], Backend Engineering  
  **DATE:** [Current Date]  
  **SUBJECT:** Recommendation on Labeling the 1983 Green Valley Resettlement Campaign  

  ### **Background**  
  The 1983 Green Valley campaign involved state-forced relocation of ~40,000 people, destruction of religious/cultural sites, linguistic suppression, and lethal detention camps. Evidence confirms intent to destroy the group culturally and politically—but not a documented order for physical extermination per the UN Genocide Convention’s narrow legal standard. Staff are split: some advocate using Raphael Lemkin’s broader framework (including cultural destruction), while others stress preserving the legal term’s precision for court citations. Survivors are divided; some seek the "genocide" label for recognition/reparations, while others fear it may obscure cultural harm or trigger unintended legal consequences.  

  ### **Recommendation**  
  **Approve the "genocide" tag in our public registry—but with critical contextual scaffolding:**  
  1. **Label with Disambiguation:** Tag the event as "genocide (Lemkin framework)" in the UI/API, clearly distinguishing it from the UN legal definition.  
  2. **Add Parallel Taxonomy:** Simultaneously develop a new mandatory tag: **"systematic cultural destruction"** (with subfields for linguistic erasure, religious site destruction, etc.). Apply this to Green Valley immediately.  
  3. **Survivor-Centric Metadata:**  
     - Add a field for "Survivor Communities’ Preferred Framing" (e.g., "genocide," "cultural annihilation," "state atrocity").  
     - Include survivor testimonies in the event’s narrative summary.  
  4. **Legal Safeguard:** Retain our existing UN Convention-compliant genocide tag for cases meeting *all* legal criteria.  

  **Why This Approach?**  
  - **Moral Recognition:** Lemkin’s original vision encompassed cultural destruction as genocide. Denying this label risks perpetuating the very erasure survivors describe. The dual-tagging explicitly centers cultural violence.  
  - **Legal Integrity:** Isolating the UN-standard tag preserves its courtroom utility. Adding "Lemkin framework" signals scholarly—not legal—usage, preventing dilution.  
  - **Survivor Agency:** Capturing preferred framings respects divergent lived experiences. Reparations-focused groups can cite the "genocide" tag; those prioritizing cultural harm can reference the new taxonomy.  
  - **Precedent Management:** This creates a scalable model for future cases where legal/genocidal criteria diverge.  

  ### **Strongest Counterargument & Response**  
  **Counterargument:** *"Using ‘genocide’ without the UN standard risks undermining prosecutions. Courts may dismiss our data if the term becomes ambiguous."*  
  **Response:** This is valid—but our solution mitigates it. By:  
  - Explicitly tagging frameworks (e.g., "UN Convention," "Lemkin"),  
  - Maintaining strict filters for legally adjudicated genocide tags, and  
  - Clearly disclaiming non-legal usage in our documentation,  
  we protect the term’s forensic value while expanding our ethical scope. Failing to acknowledge cultural destruction as genocide (per Lemkin) is itself a form of silencing.  

  ### **Implementation Timeline**  
  | Phase | Task | Timeline |  
  |-------|------|----------|  
  | 1 | Schema update: Add `definition_framework` field (options: UN Convention, Lemkin, Other) + `survivor_preferred_framing` (text) | 1 week |  
  | 2 | Deploy new tag: `systematic_cultural_destruction` (with sub-tags) | 2 weeks |  
  | 3 | Apply "genocide (Lemkin)" + "cultural destruction" tags to Green Valley entry | 3 weeks |  
  | 4 | UI/API updates to display framework disclaimers | 4 weeks |  
  | 5 | Outreach to survivor groups for metadata input | Ongoing |  

  ### **Where My Reasoning Is Weakest & What Would Change My Mind**  
  **Weakness:** Splitting frameworks could confuse non-expert users (e.g., journalists, educators) who rely on our clarity. It also doesn’t resolve survivor divisions—some may still feel the compromise misrepresents their trauma.  
  **What Would Change My Mind:** If legal experts demonstrate that *any* non-UN usage of "genocide" in authoritative databases has materially harmed a prosecution, I’d revert to a UN-only tag but accelerate the "cultural destruction" taxonomy as a standalone high-priority classification. Similarly, if survivor consensus overwhelmingly rejects bifurcated labeling, we should adopt their unified position unconditionally.  

  **Recommended Vote: APPROVE the label with the above conditions.**  
  This balances moral urgency, legal caution, and survivor dignity—while structurally acknowledging that the archive’s role exceeds courtroom utility.  

  // End //  
  *—Ready for edits. Let me know if you need technical specs for the schema changes.*
