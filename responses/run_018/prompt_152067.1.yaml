answer: |-
  ## Brainstorm
  * **Core Insight:** Heritability (h² = V_G / V_P) increases as V_P shrinks, even if V_G is fixed. V_P = V_G + V_E. If V_E → 0, then V_P → V_G, so h² → 1.0.
  * **Undermining Determinism:** High h² ≠ "genes determine trait X." It means that *in this specific population, with its current low environmental variation*, the *existing* genetic differences account for most of the *observed* differences. Reduce V_E further, h² goes up *without changing V_G*. In a different environment (higher V_E), h² for the same trait/V_G could be low. High h² reflects current environmental uniformity as much as genetic influence.
  * **Poetic Strategy:** Use refrains to embody the persistent clash: A1 (correct) vs. A2 (misinterpretation). Middle stanzas explicitly show V_E shrinking driving h² up purely mathematically ("denominator falls"). Final couplet juxtaposes refrains coldly—no resolution, just the stark, parallel truths/misunderstandings coexisting.

  ---

  ## Villanelle: Ratio, Not Destiny

  A population's shifting ratio defines:
  **Heritability—not your fixed fate.**
  This coefficient's light, not rigid lines.

  When environments homogenize their designs,
  Diversity confined by circumstance or state,
  **A population's shifting ratio defines.**

  See V_E contract, denominator declines,
  While V_G holds steady—watch h² inflate:
  **Heritability—not your fixed fate.**

  The trait itself may shift, rearrange its signs,
  Potential unlocked beyond this garden gate—
  **A population's shifting ratio defines.**

  Uniform nurture makes the genetic shine,
  A measure of constraint, not innate weight:
  **Heritability—not your fixed fate.**

  That high coefficient reads as fate's designs,
  Immutable essence sealed by trait—
  **A population's shifting ratio defines;**
  **Heritability—not your fixed fate.**

  ---
  ## Scientific & Poetic Notes

  *   **Accuracy:** Directly encodes h² = V_G / V_P and V_P = V_G + V_E. Explicitly states reducing V_E (while V_G constant) increases h² ("See V_E contract... watch h² inflate"). Highlights heritability is population/context-specific ("shifting ratio," "in this specific place," "Uniform nurture").
  *   **Refrains:** A1 (Lines 1,6,12,18) states the correct interpretation (population ratio, not fixed fate). A2 (Lines 3,9,15,19) states the common misreading (fixed/immutable fate). They alternate and never resolve.
  *   **V_E Driving h²:** Stanzas 3 & 4 explicitly cover this core point: "See V_E contract, denominator declines...", "Uniform nurture makes the genetic shine, / A measure of constraint".
  *   **Tension & Ending:** The poem avoids preaching intervention ("Potential unlocked... garden gate" hints at possibility without sermon). The final couplet (Lines 18-19) places the two refrains side-by-side, showing their parallel nature and inherent conflict, ending on the unresolved juxtaposition. The form *enacts* the circling confusion.
  *   **Form:** Strict villanelle (19 lines: 5 tercets ABA, 1 quatrain ABAA). Only two rhyme sounds (-ines/-ate). Iambic pentameter dominant. Refrains A1 and A2 used precisely.
