  Now, identifying the essential pillars for a modern dichotomy theory:  
  1. **Non-negotiable:** Control must include influence over internal states (since anxiety isn't just "impressions").  
  2. **Non-negotiable:** Retroactive narrative control must be explicitly named (post-failure agency matters).  
  3. **Camp-specific:** Distributed agency—acknowledging systems/algorithms as partial anxiety sources—is vital but contentious (hardcore Stoics might reject external blame).  
  4. **Non-negotiable:** Harm reduction for uncontrollables (algorithms, systemic issues) can't be ignored.  
  5. **Conflict alert:** #3 (distributed agency) and strict self-ownership (#1) clash—you can't fully own internal states if algorithms manipulate them. This tension kills pop Stoicism by oversimplifying.  

  Scoring classics vs. CBT:  
  - Epictetus nails #1 and #2 but fails #3-#5 (no systemic awareness).  
  - CBT adapts #1 well but stumbles on #3 (still individualistic) and #5's conflict.  

