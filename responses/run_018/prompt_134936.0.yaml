answer: |-
  This comparison reveals a fundamental tension between Lewis's intentionalist framework and evolutionary models regarding the **persistence of arbitrariness**. The linguistic gender-marking case study ("normative residue") effectively tests this tension.

  **Lewis's Account: Arbitrariness as Essential**
  1.  **Common Knowledge:** Agents must mutually know about the regularity *and* that others know, etc., forming a hierarchy of beliefs.
  2.  **Preference for Conditional Conformity:** Each agent prefers to conform *if* (nearly) all others conform. Conformity solves a coordination problem.
  3.  **Availability of Alternatives:** At least one other regularity *could* have solved the same coordination problem just as well, and this alternative is mutually recognized. This **arbitrariness** is the defining feature.

  **Evolutionary Game-Theoretic Account: Stabilization over Representation**
  *   Focuses on **behavioral regularities** emerging and stabilizing through mechanisms like:
      *   **Repeated Interaction:** Strategies (behaviors) are reinforced or punished based on outcomes.
      *   **Payoff Structures:** The inherent costs/benefits of actions drive selection.
      *   **Selection Dynamics:** Replicator dynamics, learning dynamics, or cultural transmission favor strategies yielding higher payoffs in the population context.
  *   **No Requirement for:** Conscious representation of the norm as a "solution," explicit common knowledge hierarchies, or even awareness of viable alternatives by individual agents. Stability arises from the dynamics, not necessarily from mutual reasoning about coordination.

  **The Core Tension: The Fate of Arbitrariness**
  *   **Lewis:** Arbitrariness is constitutive. A convention *is* arbitrary by definition. If no viable alternative exists (or is perceived), it's not a convention.
  *   **Evolutionary Models:** Stabilization often *erases* arbitrariness from the system's perspective:
      *   **Path Dependence:** An initially arbitrary choice becomes "locked in." The *process* of stabilization (e.g., network effects, institutional embedding, grammaticalization) makes the current norm uniquely advantageous *given its history*.
      *   **Perceived Optimality:** Once stabilized, the norm may appear uniquely optimal or "natural" to agents *because* alternatives are now costly, even if they were once equally good. The selection dynamics favor conformity to *this specific norm*.

  **Analyzing "Normative Residue": Linguistic Gender-Marking**

  *   **Origin:** Matches Lewis perfectly. A specific gender split (e.g., masculine/feminine/neuter) was adopted arbitrarily to solve a coordination problem in communication. Common knowledge existed that other splits (e.g., animate/inanimate, different class distinctions) were viable alternatives.
  *   **Evolution:** Over generations, the chosen split becomes deeply embedded in the language's grammar:
      *   Morphology: Verb conjugations, adjective agreements, pronoun systems depend on it.
      *   Lexicon: Noun classes become fixed.
      *   **Result:** Deviation now causes significant communication breakdowns, grammatical errors, and social costs (confusion, perceived lack of fluency/education). The "coordination problem" it solved originally may have morphed or vanished, but the *costs of non-conformity* are now high due to the system's internal dependence on the established pattern. This stability is maintained by "selection-like pressures" (social sanction for errors, communicative inefficiency, institutional reinforcement in education).

  **Does it remain a Lewisian Convention?**

  *   **Common Knowledge (Likely Persists):** Speakers know the rules and expect others to know them. This condition *probably* still holds, at least for competent speakers. They know *how* to mark gender according to the system.
  *   **Preference for Conditional Conformity (Persists, but Shifts Basis):** Speakers *do* prefer to conform if others conform, but **not primarily to solve the *original* coordination problem.** They conform to:
      *   Avoid sounding grammatically incorrect/uneducated.
      *   Ensure smooth communication within the *now-rigid* system.
      *   Avoid social sanctions. The "preference" is driven by the high *costs* of deviation imposed by the embedded system, not by a mutual preference for *this specific solution* over an equally good alternative for the original problem.
  *   **Availability of Alternatives (Lost):** **This is the critical failure.** From the speaker's perspective *within the mature grammatical system*:
      *   Switching to a fundamentally different gender system (e.g., animate/inanimate) is **not a viable alternative**. It would require overhauling the entire grammar and lexicon, leading to catastrophic communication failure. The costs are prohibitive.
      *   While minor variations might exist (e.g., debate over specific noun genders), the *fundamental framework* (e.g., having a masculine/feminine distinction) has no equally good, mutually accessible alternative *within the language as it exists*. The alternative systems are linguistically non-viable now.

  **Conclusion:** The linguistic gender-marking practice **is no longer a Lewisian convention in the strict sense**.

  1.  **Arbitrariness is Lost:** The defining feature – the availability of a genuinely viable alternative solving the *same* problem – has vanished due to path-dependent grammatical embedding. The current system is uniquely adapted *to itself*; alternatives are not coordination solutions but incoherent within the system.
  2.  **It has Become a Non-Conventional Norm:** It persists due to:
      *   **High Cost of Deviation:** Enforced by the system's internal structure and social pressures.
      *   **Lack of Viable Alternatives:** Within the functional language system.
      *   **Stable Payoff Structure:** Conformity yields communicative success and avoids penalties; deviation yields high costs. This aligns perfectly with evolutionary models of norm stabilization driven by payoff differentials and social learning/selection. It functions like a socially ingrained *rule* or *institution*, not a coordination solution chosen from alternatives.

  **Evolutionary Framework and Perceived Arbitrariness:**

  Can evolutionary models describe agents who *regard* the practice as arbitrary despite the dynamics not sustaining alternatives? **Yes, coherently.**

  *   **Historical/Cultural Knowledge:** Agents might learn *about* the origin of the norm ("once, other gender systems were possible") through education, linguistics, or cultural history. This is **knowledge *about* the norm**, not common knowledge *within* the coordination problem it solved originally.
  *   **Perception vs. Reality:** They can *perceive* it as historically arbitrary ("it could have been different") while recognizing its *current* non-arbitrariness within the system ("but changing it now is impossible/pointless/highly costly").
  *   **Evolutionary Explanation:** The evolutionary framework readily accommodates this:
      *   Agents have **mental representations** (beliefs, knowledge) that evolve separately from, but interact with, behavioral strategies.
      *   Belief in historical arbitrariness can be culturally transmitted alongside the behavioral norm itself.
      *   However, the **behavioral dynamics** are governed by current payoffs and constraints. Even an agent believing in historical arbitrariness will conform because the *costs of deviation in the present system* are too high. Their action is driven by the evolved payoff structure, not by coordinating on an alternative.
      *   The framework doesn't require agents to be oblivious to history; it just explains behavioral stability based on current selective pressures (social, communicative), which overwhelmingly favor conformity to the deeply embedded norm, regardless of its perceived historical contingency.

  In essence, the evolutionary framework can explain why a norm *behaviorally* lacks arbitrariness (due to path-dependent stabilization) while allowing agents to *cognitively* represent it as historically arbitrary, based on transmitted knowledge. Lewis's framework, by making arbitrariness a constitutive *current* condition for convention, cannot accommodate the transition where a convention loses its arbitrariness through embedding yet persists as a powerful norm. The "normative residue" case highlights how evolutionary processes can transform a Lewisian convention into a different kind of social fact.
