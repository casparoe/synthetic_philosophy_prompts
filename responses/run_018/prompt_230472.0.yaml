     You are an auditor for a city's pretrial release system. The system uses a risk assessment tool to decide whether to release or detain an arrestee. The tool has been tested and is known to be 90% accurate in each of two communities, Group A and Group B. 
     - In Group A, historically, 10% of arrestees are truly risky (will reoffend if released).
     - In Group B, historically, 20% are truly risky.

     **Materials per group of 3-4 students:**
     - Group A: 90 green cards (or beads) labeled "Safe", 10 red cards labeled "Risky"
     - Group B: 80 green cards "Safe", 20 red cards "Risky"
     - Four containers or areas labeled:
          - "Group A: Test Negative"
          - "Group A: Test Positive"
          - "Group B: Test Negative"
          - "Group B: Test Positive"

     **Steps:**
     1. Separate the Group A Safe cards (green): 90% of them should be placed in "Test Negative" and 10% in "Test Positive". So 81 green in Test Negative, 9 in Test Positive.
     2. Separate the Group A Risky cards (red): 90% should be in "Test Positive", 10% in "Test Negative". So 9 in Test Positive, 1 in Test Negative.
     3. For Group B Safe cards: 90% in Test Negative (72), 10% in Test Positive (8).
     4. For Group B Risky cards: 90% in Test Positive (18), 10% in Test Negative (2).

     5. Calculate for Group A:
          - False Positive Rate (FPR) = number of Safe that are in Test Positive / total Safe = 9/90 = 0.1
          - False Negative Rate (FNR) = number of Risky that are in Test Negative / total Risky = 1/10 = 0.1
     6. For Group B:
          - FPR = 8/80 = 0.1
          - FNR = 2/20 = 0.1

     7. Now, calculate for each group and for Test Positive:
          - Positive Predictive Value (PPV) = number of Risky in Test Positive / total in Test Positive
          - For Group A: 9 risky in Test Positive, 9 safe in Test Positive -> PPV = 9/18 = 0.5
          - For Group B: 18 risky in Test Positive, 8 safe -> PPV = 18/26 ≈ 0.692

     8. Also for Test Negative:
          - Negative Predictive Value (NPV) = number of Safe in Test Negative / total in Test Negative
          - For Group A: 81 safe in Test Negative, 1 risky -> NPV = 81/82 ≈ 0.988
          - For Group B: 72 safe, 2 risky -> NPV = 72/74 ≈ 0.973

     9. The instructor then asks the groups to report their FPR, FNR, PPV, and NPV for each group.

     10. Discussion: 
          - "Is the tool fair in terms of its errors (FPR and FNR)?"
          - "Is the tool fair in terms of how it is interpreted? For example, if the tool says positive for two people, one from Group A and one from Group B, does that mean the same level of risk for both?"

     **Debrief:**
     - Formal notions:
          - Base rates: Group A 10%, Group B 20%.
          - False Positive Rate: P(Test Positive | Safe) - we see it is 10% in both.
          - False Negative Rate: P(Test Negative | Risky) - 10% in both.
          - Calibration: P(Risky | Test Positive) should be the same for both groups. Here, we have 50% for A and 69.2% for B -> not the same.
     - Where could you have resisted? 
          - You might have wanted to change the accuracy rate to make the PPV the same, but then the FPR and FNR would change.
          - You might have wanted to set different thresholds, but the tool outputs a binary result and we are not allowed to change that for different groups.
     - What would it cost to resist? 
          - If you want to achieve calibration, you would have to change the threshold for each group. But then you would have to know the group membership, and you might end up with different error rates.

     **What will predictably go wrong:**
     - Students might put the safe and risky in the wrong bins.
     - They might not understand what to calculate.
     - One group might say: "We can make the accuracy different for each group." But we fixed it at 90%.

     **Handling:**
     - Emphasize that the test is 90% accurate for each group and that's non-negotiable.
     - Walk around and help with the counting.
     - If a group finishes early, ask them to compute other fairness metrics.

     **Limitations:**
     - In real life, the risk assessment tool might not have the same accuracy for both groups. It might be less accurate for a minority group because of less training data.
     - The binary test is a simplification; usually, we have a continuous score and we set a threshold.
     - The base rates in real life might be influenced by the tool itself (feedback loop).
     - The groups are defined by a single attribute, but in reality, people have intersectional identities.

     We'll address these in the debrief to connect to the broader context.
