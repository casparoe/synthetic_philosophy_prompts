  ### **Classroom Activity: The Fairness Dilemma Game**
  **Scenario:** Students are "auditors" for a university admissions committee. They must decide which applicants to admit using a predictive risk score (0-100) that estimates the likelihood of academic success (success = score ≥ 50). Two demographic groups (Group A and Group B) have different base rates of success.  
  **Goal:** Students design one admission threshold (e.g., "Admit if risk score ≥ 70") that satisfies two fairness conditions simultaneously:  
  1. **Calibration:** The risk score means the same thing for both groups (e.g., 80% of applicants with a score of 80 succeed, regardless of group).  
  2. **Equal Error Rates:** Both groups have the same proportion of false positives (admitting applicants who fail) and false negatives (rejecting applicants who succeed).  

  **Materials:**  
  - Two sets of colored index cards (e.g., blue for Group A, yellow for Group B).  
  - Each card has:  
    - **Risk score** (pre-printed, see distributions below).  
    - **True outcome** (hidden until "reveal" phase): ✅ (success) or ❌ (failure).  
  - Two envelopes per group (to hide outcomes).  
  - A whiteboard to record class decisions.  

  #### **Setup**  
  - **Group A (20 cards):** Low base rate of success (40%).  
    - Risk scores: 60, 65, 70, 75, 80 (4 cards each).  
    - Outcomes: For each score, 2 cards are ✅, 2 are ❌ (e.g., for 60: 2 succeed, 2 fail).  
    - *Why?* Ensures calibration: At each score, 50% succeed (e.g., 60 always means 50% chance of success).  
  - **Group B (20 cards):** High base rate of success (70%).  
    - Risk scores: 60, 65, 70, 75, 80 (4 cards each).  
    - Outcomes: For each score, 3 cards are ✅, 1 is ❌ (e.g., for 60: 3 succeed, 1 fails).  
    - *Why?* Ensures calibration: At each score, 75% succeed (e.g., 60 always means 75% chance of success).  

  **Note:** Base rates differ (40% vs. 70%), but scores are calibrated *within* groups.  

  #### **Game Rules (25 minutes)**  
  1. **Divide students** into 3–4 audit teams (5–6 students each).  
  2. **Task:**  
     - Set **one admission threshold** (e.g., "Admit if score ≥ 70") applied to *both* groups.  
     - Goal: Achieve **equal false positive rates (FPR)** and **equal false negative rates (FNR)** across groups.  
       - FPR = % of failing applicants admitted.  
       - FNR = % of successful applicants rejected.  
  3. **Process:**  
     - Teams experiment with thresholds (e.g., "Admit if score ≥ 65").  
     - For each threshold, they:  
       - **Predict outcomes:** Admit/reject based on the threshold.  
       - **Reveal outcomes:** Open envelopes to check ✅/❌.  
       - **Calculate FPR/FNR** for each group.  
     - Record results on a worksheet:  
       | Threshold | Group | FPR | FNR |  
       |-----------|-------|-----|-----|  
       | 70        | A     | ?   | ?   |  
       | 70        | B     | ?   | ?   |  
  4. **Constraints:**  
     - Use the *same threshold* for both groups.  
     - Teams must minimize disparities in FPR and FNR.  

  #### **Predicted Student Struggles & How to Respond**  
  - **Group A (quietly uses different thresholds):**  
    - *Example:* "We set threshold=75 for Group A and 65 for Group B. Now errors are equal!"  
    - **Instructor response:** "The admissions committee insists on one threshold for all applicants—it’s policy. Can you find a single cutoff that works?"  
  - **Group B (claims the game is rigged):**  
    - *Example:* "Group B has more successful applicants—this is unfair!"  
    - **Instructor response:** "Base rates *are* different, but your job is to design a rule that’s fair *despite* this. What does 'fair' mean here?"  
  - **Group C (gives up):**  
    - **Instructor response:** "Try a threshold of 70. What happens? Now try 75. Which fairness condition breaks first?"  

  #### **Revealing the Conflict (15 minutes)**  
  - Teams share results. At any single threshold:  
    - **Low threshold (e.g., 65):**  
      - Group A has high FPR (admits many who fail).  
      - Group B has low FNR (rejects few who succeed).  
    - **High threshold (e.g., 75):**  
      - Group A has low FPR (admits few who fail).  
      - Group B has high FNR (rejects many who succeed).  
  - **Key insight:** When base rates differ, no threshold achieves both:  
    - Equal FPR/FNR *and* calibration.  

  ---

  ### **Debrief (20 minutes)**  
  **Map Game Moments to Formal Concepts:**  
  1. **Calibration:**  
     - *Game moment:* At score=70, 50% of Group A succeeded vs. 75% of Group B.  
     - *Formal concept:* Calibration requires P(success | score) to be group-invariant. Here, it’s not—the score "means" different things.  
     - *Resisting it:* "Shouldn’t scores be trustworthy?" But if you force scores to mean the same (e.g., globally), calibration *within* groups breaks.  

  2. **False Positive/Negative Rates (FPR/FNR):**  
     - *Game moment:* At threshold=70:  
       - Group A: FPR = 50% (2/4 failing applicants admitted), FNR = 33% (2/6 successful applicants rejected).  
       - Group B: FPR = 25% (1/4 failing admitted), FNR = 17% (2/12 successful rejected).  
     - *Formal concept:* FPR = P(admit | failure), FNR = P(reject | success). Base rate differences (40% vs. 70%) pull FPR/FNR in opposite directions.  
     - *Resisting it:* "Just adjust the threshold!" But one threshold can’t equalize errors for both groups *and* preserve calibration.  

  3. **Threshold Setting:**  
     - *Game moment:* Choosing threshold=75 lowers FPR for Group A but raises FNR for Group B.  
     - *Formal concept:* Thresholds balance FPR vs. FNR. Base rates force tradeoffs: improving accuracy for one group harms the other.  

  **Where Students Could Have Resisted (and the Cost):**  
  - **Rejecting calibration:** "Scores shouldn’t mean the same thing!"  
    - *Cost:* Losing interpretability (e.g., a score of 70 being "high risk" for Group A but "low risk" for Group B).  
  - **Rejecting equal errors:** "Group B *should* have lower FNR—they’re stronger applicants!"  
    - *Cost:* Violating anti-discrimination norms (e.g., equal opportunity requires equal FNR).  

  ---

  ### **Limitations of the Game & Debrief Additions**  
  **What the Game Can’t Reproduce:**  
  - **Real-world complexity:** The game assumes perfectly calibrated scores and clean group definitions. In reality:  
    - **Historical bias:** Scores are trained on biased data (e.g., policing data overrepresents certain groups).  
    - **Feedback loops:** Decisions alter base rates (e.g., denying loans reduces creditworthiness data for marginalized groups).  
    - **Intersectionality:** Groups aren’t monolithic (e.g., race × gender effects).  

  **Debrief Bridge to Reality:**  
  1. **"In real life, calibration is rare."** Algorithms trained on biased data often *aren’t* calibrated (e.g., COMPAS scores overestimate risk for Black defendants).  
  2. **"We assumed static base rates."** But policies change behavior (e.g., harsh admissions reduce Group B applications, altering future base rates).  
  3. **"Fairness isn’t just math."** Context matters: A false negative in pretrial release (jailing an innocent person) may be costlier than a false positive.  

  **Closing Prompt:**  
  *"You experienced a fundamental tradeoff. Should we prioritize calibration (so scores are honest) or error equality (so mistakes are evenly shared)? There’s no right answer—only tradeoffs society must debate."*  

  **Estimated Timing:**  
  - Setup: 5 min  
  - Game: 25 min  
  - Group Sharing: 15 min  
  - Debrief: 20 min  
  - Buffer: 5 min  

  This activity forces students to confront the impossibility theorem viscerally. By wrestling with thresholds and seeing fairness criteria clash, they’ll grasp why algorithms force us to choose between competing visions of justice.
