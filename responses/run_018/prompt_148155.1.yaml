answer: |-
  Here is the full specification of desiderata for an adequate theory of standing to blame, treating hypocrisy as a structural stress-test revealing the concept's core function. The desiderata are categorized, with motivating cases, negotiability flags, and analysis of tensions.

  ---

  ### **I. Phenomena & Hard Cases to Capture**  
  *(What the theory must explain)*  
  1. **The Flawed Victim**  
     - *Case*: A victim blames their perpetrator despite having committed similar wrongs themselves.  
     - *Requirement*: Victims must retain standing to blame their *own* victimizer, even if morally imperfect.  
     - *Non-negotiable*: Yes (core to victim prerogative).  

  2. **Third-Party with Different-Domain Vice**  
     - *Case*: A blamer condemns a wrongdoer while committing distinct but structurally analogous faults (e.g., condemning theft while emotionally abusive).  
     - *Requirement*: Standing should not require moral perfection but may weaken if the vice undermines the blamer’s authority on *this specific wrong*.  
     - *Non-negotiable*: No (theories may disagree on domain-specificity).  

  3. **Structurally Complicit Blamer**  
     - *Case*: A blamer benefits from systemic injustice (e.g., economic privilege) while condemning an individual wrongdoer within that system.  
     - *Requirement*: Standing must account for blamer’s role in perpetuating the *structure* enabling the wrong.  
     - *Non-negotiable*: Yes (tests structural consistency).  

  4. **Diminished-but-Persistent Standing**  
     - *Case*: A hypocrite’s blame is less authoritative yet still minimally valid (e.g., a recovering addict blaming active addiction).  
     - *Requirement*: Standing must be gradable, not binary.  
     - *Non-negotiable*: No (some accounts treat standing as all-or-nothing).  

  5. **Epistemic Blindness vs. Volitional Insincerity**  
     - *Case*: Distinguish the blamer unaware of their own fault (epistemic) from one who knowingly misrepresents their record (volitional).  
     - *Requirement*: Volitional hypocrisy should more severely undermine standing than epistemic error.  
     - *Non-negotiable*: Yes (intent matters for authority).  

  6. **Victim-Authorized Tainted Blamer**  
     - *Case*: A victim permits a hypocrite or complicit third party to blame on their behalf.  
     - *Requirement*: Victims can delegate standing to others who would otherwise lack it.  
     - *Non-negotiable*: Yes (respects victim’s moral agency).  

  7. **Comparative Fault in Shared Vice**  
     - *Case*: A blamer condemns a wrongdoer while committing a *less severe* version of the same fault.  
     - *Requirement*: Standing may scale with relative moral record, not purity.  
     - *Non-negotiable*: No (theories may reject comparative purity).  

  ---

  ### **II. Distinctions to Preserve**  
  *(What the theory must not collapse)*  
  1. **Lacking Standing vs. Conditional/Delegated Standing**  
     - *Case*: A hypocrite lacks intrinsic standing, but a victim’s authorization redeems it.  
     - *Non-negotiable*: Yes (prevents over-punitiveness).  

  2. **Hypocrisy About Identical Fault vs. Structurally Related Fault**  
     - *Case*: Condemning adultery while cheating on taxes (related dishonesty) vs. condemning adultery while committing it (identical).  
     - *Non-negotiable*: Yes (domain-specificity reveals blame’s purpose).  

  3. **Moral Standing vs. Epistemic Entitlement**  
     - *Case*: A hypocrite may *accurately* identify a wrong (epistemic) but lack moral authority to blame (standing).  
     - *Non-negotiable*: Yes (prevents conflation of truth and authority).  

  4. **Forfeiture (Conduct-Based Loss) vs. Waiver/Transfer (Victim-Granted)**  
     - *Case*: A wrongdoer forfeits standing by hypocrisy, but a victim can waive this deficit for a delegate.  
     - *Non-negotiable*: Yes (distinguishes blameworthiness from victim autonomy).  

  5. **Performative Hypocrisy vs. Structural Complicity vs. Epistemic Blindness**  
     - *Performative*: Saying "don’t X" while doing X.  
     - *Structural*: Benefiting from unjust systems while condemning their symptoms.  
     - *Epistemic*: Unawareness of one’s own fault.  
     - *Non-negotiable*: Yes (each undermines standing differently).  

  ---

  ### **III. Consistency Conditions**  
  *(Theoretical and empirical constraints)*  
  1. **Alignment with Moral Address Practices**  
     - Blame functions as relational repair, not merely retribution.  
     - *Non-negotiable*: Yes (reveals standing’s purpose).  

  2. **Consistency with Moral Psychology**  
     - Empirical data shows blame’s effectiveness hinges on perceived blamer credibility.  
     - *Non-negotiable*: Yes (avoids armchair idealism).  

  3. **Rejection of Binary Standing**  
     - Standing must admit degrees (e.g., weakened but not void).  
     - *Non-negotiable*: No (some accounts accept binary).  

  ---

  ### **IV. Tensions and Joint Unsatisfiability**  
  - **Core Tension**: Unconditional victim-standing (Desideratum I.1) + widespread third-party blame (I.2, I.3) + blamer purity (I.7) cannot coexist.  
    - *Why*: If victims always have standing (even if flawed), but third parties require comparative purity, then victims are privileged in ways third parties cannot be. Structurally complicit third parties (I.3) further destabilize purity requirements.  
  - **Most Disqualifying Requirement**: **Unconditional victim-standing**. Strict adherence eliminates:  
    - Rigid comparative-moral-record accounts (deny flawed victims standing).  
    - Binary-standing accounts (cannot capture diminished victim authority).  

  ---

  ### **V. Scoring Major Accounts**  
  *(Briefly, per request)*  
  1. **Pure Relational/Victim-Waiver Accounts**  
     - *Strengths*: Captures victim-standing (I.1), delegation (I.6), forfeiture/waiver distinction (II.4).  
     - *Weaknesses*: Struggles with structural complicity (I.3) and non-victim third-party standing.  

  2. **Comparative-Moral-Record Accounts**  
     - *Strengths*: Explains diminished standing (I.4) and volitional hypocrisy (I.5).  
     - *Weaknesses*: Fails victim-standing (I.1) and often over-punishes non-identical faults (II.2).  

  3. **Hypocrisy-Irrelevant Accounts**  
     - *Strengths*: Permits widespread blame (I.2).  
     - *Weaknesses*: Collapses moral/epistemic distinction (II.3), ignores blame’s relational function (III.1).  

  ---

  ### **VI. Framing Assessment**  
  The framing is **not confused** but **demanding**:  
  - Hypocrisy *is* a valid stress-test, exposing whether standing serves moral repair (via credibility) or abstract justice.  
  - "Forfeiture vs. waiver" *can* bear the weight if tied to victim autonomy.  
  - **One Risk**: Over-emphasizing hypocrisy may obscure non-hypocrisy-based standing defects (e.g., coercion).  
  - **Conclusion**: The desiderata form a coherent set centered on *standing as moral authority to address wrongs*, revealed when hypocrisy tests the blamer’s relational position. The irreconcilable tension (victim-prerogative vs. third-party purity) suggests theories must prioritize victim autonomy or systemic consistency—but not both.  

  ---  
  This specification prioritizes structural cases over peripheral exceptions, with victim-standing as the anchor and hypocrisy as the lens. The hardest trade-off remains unconditional victim authority versus graded third-party legitimacy.
