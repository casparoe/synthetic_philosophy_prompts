answer: |-
  Here are five considerations against the ledger view, with clarity on settled vs. contested objections:

  1. **Settled Objection (Moral Incommensurability):** The core analogy of moral "debts" and fungible life-value is philosophically contested; Kantians and rights theorists argue life possesses intrinsic, non-transferable worth, making "balancing" via state killing incoherent, not merely impractical.  
  2. **Contested but Weighty Objection (State Authority):** The view assumes the state has the legitimate moral authority to act as cosmic bookkeeper—a role traditionally attributed to divine justice. Secular defenses struggle here, as this authority isn't derived from social contract or rights protection (Locke, Rawls), leaving it metaphysically loaded and politically ungrounded.  
  3. **Settled Objection (Error Irreversibility):** While the ledger view frames wrongful execution as a "bookkeeping error," this trivializes the unique horror of irreversible state-sanctioned murder. Empirical evidence of wrongful convictions (e.g., DNA exonerations) makes this a fatal operational flaw, as no "correction" exists post-execution.  
  4. **Contested Objection (Scope Creep):** If the state must "balance" moral accounts, why stop at life-for-life? The logic could demand retributive torture for torture (lex talionis), making the ledger slippery toward barbarism unless arbitrary limits are imposed—which undermines its purist retributive coherence.  
  5. **Contested but Structurally Awkward Objection (Duty vs. Desert):** The view emphasizes the *state’s duty* to balance ledgers, not just the offender’s desert. This risks collapsing into consequentialism (e.g., "societal catharsis" as a hidden good) or becoming vacuously circular: the duty exists only because the theory posits it, with no independent justification.  

  *None collapse the view into deterrence*; objections 1-4 challenge its moral coherence/metaphysics, while 5 highlights an internal tension without shifting to utility. Points 1 and 3 are widely settled critiques; 2, 4, and 5 remain actively debated but render the ledger "awkward" by exposing its unexamined premises or impractical rigidity.
