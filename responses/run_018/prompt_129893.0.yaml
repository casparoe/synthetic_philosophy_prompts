answer: |-
  Here is your Q&A prep sheet, prioritizing objections by potential damage and tailored to the audience subgroups:

  **1. Objection (Skeptical Metaphysicians):** "Fictional causation is purely stipulative; it reflects authorial fiat, not modal or causal structure. How can stipulation 'test' a theory purporting to describe mind-independent causal relations? This seems category-confused."  
     *Reply:* "Stipulation *simulates* the fixing of background conditions central to interventionism. The 'test' isn't about discovering real-world physics, but about whether a theory's *formal machinery* (e.g., manipulability conditions) can coherently model the causal assertions *internal* to the narrative logic. Failure reveals constraints in the theory's formalism."  
     *(Soft Point: Concedes the 'test' is formal/coherence-based, not ontological.)*

  **2. Objection (Lewisian Counterfactualists):** "You claim fictional worlds lack 'modal inertia' making nearness indeterminate. But authors *do* imply similarity metrics via genre conventions, character consistency, and 'realistic' consequences. Isn't your argument just that Lewisians need better hermeneutics, not that counterfactual dependence fails?"  
     *Reply:* "Genre conventions are loose and often contradictory; character 'consistency' is narrative-dependent. Crucially, an author *directly intervening* to change variable X (e.g., 'what if the letter wasn't sent?') isn't constrained by *any* pre-existing similarity metric for that specific change. The intervention *defines* the relevant 'world', bypassing nearness evaluation entirely."  
     *(Soft Point: Downplays the potential for robust conventional/stipulative nearness standards within genres.)*

  **3. Objection (Interventionists):** "Interventionism requires *variables* with *possible* interventions within a causal model. Fictional 'variables' (e.g., a character's decision) aren't manipulable independent of authorial description. Isn't this just metaphor, not a genuine application of the formalism?"  
     *Reply:* "Within the *constructed model of the fictional world*, the author *defines* the variables and their possible values (e.g., 'send letter'/'not send letter'). Authorial intervention *is* the manipulation of that variable within its defined model space. It demonstrates the core interventionist move: fix B, wiggle X, see Y."  
     *(Soft Point: Relies on accepting the fictional world *as* a defined causal model, which may feel artificial.)*

  **4. Objection (Literary Scholars):** "You reduce narrative to isolated variable-testing. But narrative meaning arises from holistic structure, thematic resonance, and reader interpretation – not isolable 'interventions'. Aren't you imposing a reductive, scientistic framework on a complex modal art?"  
     *Reply:* "I agree narrative is holistic. My claim is narrower: when authors explicitly construct *counterfactual scenarios within the narrative* (e.g., a character's 'what if?' reverie, alternative endings), or when we analyze plot *dependencies*, they often implicitly use an interventionist logic *locally* to establish causation, eschewing global possible-world similarity."  
     *(Soft Point: Retreats to specific narrative devices rather than narrative *tout court*.)*

  **5. Objection (Skeptical Metaphysicians):** "Even *if* fiction mirrors interventionist steps, why think this tells us anything about *actual* causation? Fiction reflects folk intuitions or narrative convenience, not deep metaphysics. Isn't using it as 'data' just privileging intuition under another name?"  
     *Reply:* "It doesn't directly reveal *actual* causation. It tests the *internal consistency and scope* of causal *theories*. If a theory (like Lewis's) struggles to model causal claims *even in this controlled, stipulative environment* where background conditions *are* perfectly fixed by fiat, it reveals a limitation in its conceptual apparatus."  
     *(Soft Point: Explicitly abandons claim to ontological insight, focusing solely on theory coherence.)*

  **6. Objection (Lewisian Counterfactualists):** "Interventionism itself relies on counterfactuals! Woodward's 'wiggle' *is* a counterfactual change. You haven't shown failure of counterfactual dependence; you've shown fiction relies on *stipulated* counterfactuals without similarity constraints. That's orthogonal to Lewis's account of real-world causation."  
     *Reply:* "Correct, interventionism uses counterfactuals. The key difference is *which* counterfactuals matter. Interventionism cares about wiggling X *holding fixed* a specific background B (as the author does). Lewisian evaluation depends on the *similarity* of the entire world where X is different, which is undefined in fiction. Fiction highlights the *distinctness* of these approaches."  
     *(Soft Point: Concedes shared counterfactual basis; emphasizes distinct selection mechanisms.)*

  **The Lethal Objection (Literary Scholars - Hoped Unasked):**  
  **Objection:** "Your 'authorial intervention' *is* just the construction of another fictional world-counterfactual. The 'narrative consequence' you derive is simply a *new* piece of fiction, governed by the author's *new* stipulations for *that* scenario. How is this any different from Lewisian 'nearest worlds' where nearness is *also* stipulated by authorial choice? You've merely relabeled counterfactual creation, not escaped it."  
  *Why Lethal:* It collapses your core distinction. If authorial intervention = stipulating a new counterfactual world (which it appears to be), then the inability to define "nearness" independently vanishes because the *author defines the relevant world directly*. This makes fiction equally (in)compatible with *both* frameworks, refuting your claim of unique accommodation by interventionism.  
  *(If Asked: Argue interventionism captures the *local, variable-focused* nature of fictional "what ifs" better than Lewis's global world-similarity, but the distinction becomes very blurry under pressure.)*
