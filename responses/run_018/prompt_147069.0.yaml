  4.  Elena (4) is strongest in offering a compelling mechanistic alternative (the language module) for the unity drive that avoids a homunculus, but weakest in not fully addressing why the *result* of this module feels like a singular, witnessed narrative to the subject.
  5.  Marcus (5) shrewdly transforms the dispute; his concern about retrospective binding's authority doesn't genuinely revive the Cartesian theater (with its spectator) but instead shifts the debate to the necessity of a minimal self-model as the adjudicating reference point for "what seems to have occurred."
