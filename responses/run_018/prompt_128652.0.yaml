  I'm in my second year of a PhD in archaeological theory and I'm helping my advisor put together the M.A. comprehensive exam for this spring. We want an essay question that actually tests whether students can reason from material patterns to institutional beliefs without just reciting the standard processual vs post-processual script. I've been playing with this framing I call the stratigraphic belief problem — basically, when you have a multi-phase site with repeated structural renewal, how do you tell whether you're looking at a shared cosmological institution or just functional coordination that left a similar material trace?

  I want the question to present a concrete hypothetical: a circular enclosure with three rebuilt hearths in the center, imported obsidian restricted to the northeast quadrant across all phases, and burial orientations that shift ninety degrees between phase one and phase three. The students should have to argue for either a ritual-institution interpretation or a practical-coordination interpretation, defend it using spatial and stratigraphic reasoning, and then identify the exact point where their inference is weakest. I need a model answer of about 800 words that doesn't just describe the site but actually moves through the ambiguity, and a marking scheme out of 25 marks that names the seperate analytical moves — recognizing the functional versus symbolic ambiguity, using quadrant distribution correctly, addressing the burial shift, and explicitly marking an epistemic gap — plus a line on how students usually fake confidence on each part. Also please don't ask for bibliographies or citations in the prompt since our students don't all have access right now, and I definatly want it written so a student could answer it without searching the web — no obscure site reports or niche theorists they wouldn't have read. Can you draft the exam question, the model answer, and the scheme with the marks broken out?
