  ok so im writing my thesis on inductive bias in LLMs and i keep hitting this weird analogy with Goodmans grue paradox — like, if a model sees green emeralds up to time t, whats stopping it from predicting grue after t except some hidden projectibility bias? Anyway i was skimming Humes Enquiry and started wondering: if Hume were alive today and had to deal not just with Goodmans 1955 grue puzzle but also with these newer arguments that deep nets face an out-of-distribution grue-type problem, do you think hed stick to his custom-and-habit story or admit that induction needs some rationalist constraint he originally rejected? I have an adivsor meeting next week and need a real verdict — defend one side properly, but also flag where his old skepticism about necessary connections gets really awkward with all this. please dont just list pros and cons, i need an actual position.
