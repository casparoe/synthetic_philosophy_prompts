  We are creating a decision procedure for auditing post-hoc protocol modifications. The core distinction is between:
   - "Right kind" reasons (RK): Reasons that bear on the epistemic warrant of the belief/method, i.e., whether the data or method is appropriate for the study's internal evidential aims (e.g., truth, accuracy, validity).
   - "Wrong kind" reasons (WK): Reasons that bear on the benefits (e.g., career advancement, funding, publication) of holding the belief or making the choice, without improving the epistemic warrant.

   The procedure must cover:
   (i) Exclusion of individual observations
   (ii) Addition, removal, or transformation of covariates
   (iii) Substitution of a pre-registered statistical model

   Structural checks:
   1. Initial filter: Separate considerations about epistemic aims (RK) from institutional/personal consequences (WK).
   2. Symmetry test: Would the researcher accept the same consideration if it produced a result contrary to their interests?
   3. Mixing clause: If both kinds of reasons are intertwined, require disaggregation (i.e., the researcher must separate them) before evaluation.

   The procedure is a decision tree with explicit branching. We'll design it step by step.

   Step-by-step decision procedure:

   Step 0: Document the change and the stated reason.
     - Record the type of change (i, ii, or iii) and the justification provided.

   Step 1: Apply the Initial Filter.
     - Parse the justification and extract the primary reason(s).
     - Classify each part of the reason as either:
          a) Relating to the data's relationship to reality (e.g., measurement error, data quality, confounding, model misspecification, violation of statistical assumptions) -> potential RK.
          b) Relating to the consequences of the change (e.g., "this will make the paper more publishable", "this is what the reviewer asked for", "this will help me get tenure", "this will lead to a more significant result") -> potential WK.

     - If the reason contains only type (a) considerations, proceed to Step 2 with RK flag.
     - If the reason contains only type (b) considerations, classify as WK and proceed to Step 4 (conclusion for WK).
     - If the reason contains both (a) and (b), trigger the Mixing Clause: require the researcher to disaggregate and resubmit. Stop until resubmission.

   Step 2: Symmetry Test (applies only to reasons that passed the initial filter as pure RK).
     - Ask: "Would the researcher have made the same change and provided the same reason if the change had resulted in an outcome that was detrimental to their hypothesis (e.g., reduced statistical significance, contradicted the expected finding, made the results less novel)?"

     Indicators that it passes the symmetry test (i.e., would have been done anyway even if against interests):
       - The reason is based on a pre-existing (pre-data collection) concern or a universally accepted methodological principle (e.g., removing outliers that are beyond 3 SD is standard; transforming a variable to meet normality assumptions is routine regardless of the effect on p-values).
       - The researcher provides evidence that they would have done the same in a similar situation (e.g., they have done so in the past, or the rationale is independent of the outcome).

     Indicators that it fails the symmetry test (i.e., the reason is applied only because it helps the desired outcome):
       - The reason is only invoked because it leads to a more favorable result, and there is no independent evidence that the researcher would have done the same if the result was unfavorable.

