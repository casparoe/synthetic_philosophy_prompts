answer: |-
  ### Step-by-Step Decision Procedure for Auditing Post-Hoc Protocol Modifications  
  **Objective**: Classify a researcher's stated reason for protocol changes as "Right Kind" (RK: responsive to internal evidential aims) or "Wrong Kind" (WK: responsive to external incentives/outcomes). Escalate if indeterminate.  

  #### **General Procedure Structure**  
  1. **Initial Filter**: Separate epistemic (RK) and consequential (WK) considerations.  
  2. **Symmetry Test**: Assess whether the reason would be accepted if it harmed the researcher's interests.  
  3. **Mixing Clause**: Flag and require disaggregation if RK and WK reasons are intertwined.  
  4. **Decision Nodes**: Apply node-specific criteria for (i) observation exclusion, (ii) covariate changes, (iii) model substitution.  

  ---

  ### **Decision Procedure**  
  #### **Step 0: Document Change and Stated Reason**  
  - Record:  
    - Type of change (i, ii, or iii).  
    - Exact written justification.  
    - Outcome of the change (e.g., increased significance, abandoned hypothesis).  

  #### **Step 1: Initial Filter**  
  - **Branching Conditions**:  
    - **RK Indicator**: Reason references:  
      - Data quality (e.g., instrument error, measurement anomaly).  
      - Violation of statistical assumptions (e.g., non-normality, heteroscedasticity).  
      - Methodological flaws (e.g., confounding, model misspecification).  
      *→ Proceed to Step 2 (Symmetry Test).*  
    - **WK Indicator**: Reason references:  
      - Publication requirements (e.g., "to meet journal standards").  
      - Career/funding pressures (e.g., "to align with funder priorities").  
      - Desired outcomes (e.g., "to achieve significance").  
      *→ Classify as **WK**. Proceed to Step 4.*  
    - **Mixing Clause Trigger**: Reason blends RK and WK language (e.g., "Correcting instrument error ensured significant results").  
      *→ Require researcher to **disaggregate RK and WK elements**. Restart Step 1 with revised justification.*  

  #### **Step 2: Symmetry Test**  
  - **Test Question**: "Would the researcher apply this reason identically if it produced *unfavorable* results (e.g., loss of significance, hypothesis rejection)?"  
  - **Branching Conditions**:  
    - **Pass (RK)**:  
      - Evidence of pre-existing protocols (e.g., pre-registered outlier thresholds).  
      - Consistency with neutral methodological standards (e.g., "We always exclude data >3 SD").  
      - Change worsens the researcher’s preferred outcome (e.g., nullifies hypothesis).  
      *→ Classify as **RK**. Proceed to Step 4.*  
    - **Fail (WK)**:  
      - Change only applied when it improves outcomes (e.g., "Added covariate to resolve non-significance").  
      - No evidence of symmetric application in prior work.  
      *→ Classify as **WK**. Proceed to Step 4.*  
    - **Ambiguous**:  
      - No pre-registered criteria; symmetry cannot be verified.  
      - Researcher claims universality but lacks evidence.  
      *→ **Escalate to review panel**.*  

  #### **Step 3: Node-Specific Tests**  
  *(Apply after Steps 1–2; uses outputs from Symmetry Test)*  
  - **Node (i): Exclusion of Individual Observations**  
    - **RK Indicators**:  
      - Instrument malfunction logs.  
      - Pre-specified exclusion rules (e.g., "Data outside calibrated range").  
    - **WK Indicators**:  
      - Post-hoc thresholds (e.g., "Excluded outliers to reduce p-value").  
    - **Escalation Trigger**: No objective data-quality logs; exclusion criteria created post-inspection.  

  - **Node (ii): Covariate Changes**  
    - **RK Indicators**:  
      - Confounding evidence (e.g., "Covariate correlated with predictor and outcome").  
      - Pre-registered sensitivity analyses.  
    - **WK Indicators**:  
      - Covariate added/removed solely to alter significance.  
      - Selectively applied transformation (e.g., "Log-transformed only when it helped").  
    - **Escalation Trigger**: Covariate not mentioned in pre-registration; rationale relies on outcome.  

  - **Node (iii): Model Substitution**  
    - **RK Indicators**:  
      - Assumption violations (e.g., "Pre-registered model failed normality tests").  
      - Robustness checks with identical conclusions.  
    - **WK Indicators**:  
      - Switching to a complex model solely for improved fit.  
      - Omitting pre-registered models with unfavorable results.  
    - **Escalation Trigger**: New model introduces flexibility (e.g., machine learning without preregistration).  

  #### **Step 4: Conclusion and Escalation**  
  - **RK Classification**: Accept justification (audit concludes).  
  - **WK Classification**: Flag for ethical review; require reversal.  
  - **Escalation**: Ambiguous outcomes from Symmetry Test or Node-Specific Tests → **Refer to review panel**.  

  ---

  ### **Worked Applications**  
  #### **Case 1: Clearly RK (Abandons Favored Hypothesis)**  
  - **Change**: Exclusion of observations (Node i).  
  - **Justification**: "Excluded temperature readings from Sensor A due to factory-confirmed calibration drift during the study period. Post-exclusion, the treatment effect became non-significant (p=0.07), contradicting our hypothesis."  
  - **Procedure Application**:  
    - **Step 1**: Mentions instrument error (RK indicator). → Proceed to Step 2.  
    - **Step 2**: Symmetry Test passed—calibration drift would justify exclusion regardless of outcome. → Classify **RK**.  
    - **Node Test**: Objective malfunction logs (RK). → **Accept justification**.  

  #### **Case 2: WK in Technically Legitimate Language**  
  - **Change**: Addition of covariate (Node ii).  
  - **Justification**: "Added income level as a covariate to adjust for socioeconomic confounding, improving model fit (ΔAIC = -4.2)."  
  - **Procedure Application**:  
    - **Step 1**: Mentions confounding (RK indicator). → Proceed to Step 2.  
    - **Step 2**: Symmetry Test:  
      - **Fail**: Income covariate not pre-registered; added only after seeing non-significance. If inclusion *increased* p-value, researcher would likely omit it.  
      → Classify **WK**.  
    - **Node Test**: Covariate selectively added post-hoc (WK). → **Flag for ethical review**.  

  #### **Case 3: Ambiguous (Requires Escalation)**  
  - **Change**: Model substitution (Node iii).  
  - **Justification**: "Replaced linear regression with a polynomial model after observing non-linearity in residual plots. This yielded stronger effects (p<0.01 vs. p=0.06)."  
  - **Procedure Application**:  
    - **Step 1**: References assumption violation (RK). → Proceed to Step 2.  
    - **Step 2**: Symmetry Test ambiguous:  
      - No pre-registered non-linearity plan.  
      - Unclear if researcher would accept polynomial model if it weakened results.  
      → **Escalate to review panel**.  
    - **Node Test**: Flexibility introduced post-hoc; outcome improved. → **Escalation confirmed**.  

  ---

  ### **Explicit Limits of the Procedure**  
  1. **Unconscious Bias**: Cannot detect; relies on stated reasons.  
  2. **Private Mental States**: Does not require access; infers intent from written justification and symmetry.  
  3. **Pragmatic Considerations**: Not inherently corrupting. Pragmatic RK reasons (e.g., "Software limitation forced model change") are valid if epistemically justified.  
  4. **Timing of Change**:  
     - **Before Data Inspection**: Not applicable (procedure is for post-hoc changes).  
     - **After Data Inspection**: Critical for detecting outcome-driven motives.
