answer: |-
  Here's the breakdown of Schliemann's Troy through your "institutional sedimentation" lens, analyzing both ways and addressing the nationalism angle, in American English:

  **Applying the Model: Theory on the Case (Hisarlik/Troy)**

  1.  **What Schliemann Presented:** He presented physical evidence (massive walls, artifacts, gold finds he dubbed "Priam's Treasure") at a specific location (Hisarlik) traditionally associated with Troy. Crucially, he framed this evidence *explicitly* through Homer's *Iliad*, claiming direct correlation: this *was* Priam's city, the treasure *was* Helen's jewels. He offered correlation, but framed it as conclusive identification.

  2.  **The Gatekeepers:** Primarily European academia:
      *   **Archaeologists:** Especially German and British, focused on stratigraphy, dating methods, artifact typology. Their currency was material evidence and scientific method.
      *   **Classicists/Philologists:** Scholars of ancient Greek texts (like Homer), focused on literary analysis, historicity of myths, and textual consistency. Their currency was the authority of the text.
      *   **Historians:** Interested in reconciling material evidence with written records and constructing coherent narratives of the past.
      *   **(Implicit Gatekeepers):** Funding bodies, museums, popular press, and national governments influenced discourse and resource allocation.

  3.  **The Split Explained by Sedimentation:**
      *   **Initial Reaction (Inconsistencies as Falsification):** Critics seized on glaring inconsistencies with the Homeric narrative as Schliemann presented it.
          *   *Material Inconsistency:* Schliemann initially destroyed the *actual* Homeric-era layer (Troy VI/VIIa) digging down to what he wrongly thought was Homeric Troy (Troy II). His "Troy" was too early.
          *   *Artifact Inconsistency:* The "Treasure" predated the likely Homeric era by centuries. Scale and nature of finds didn't perfectly match Homeric descriptions.
          *   *Textual Inconsistency:* Many classicists viewed the *Iliad* as pure myth. Finding *any* city didn't prove *that* city was the specific, heroic Troy of Homer.
          *   *Gatekeeper Stance:* For these critics, these inconsistencies **falsified Schliemann's specific claim** of finding Homer's Troy *as described*. The legend remained legend; the evidence didn't fit the frame.
      *   **Shift Towards Sedimentation (Inconsistencies as Puzzles):** Supporters operated within a different emerging frame.
          *   *Core Acceptance:* The location (Hisarlik = ancient Troy/Ilion) gained traction based on geographical correlation and the sheer scale of ruins.
          *   *Reframing Homer:* Homer's account was seen less as literal history and more as a poetic memory of a significant Late Bronze Age conflict involving a powerful city controlling the Dardanelles.
          *   *Puzzle-Solving:* The inconsistencies became research problems *within the accepted core*.
          *   *Material Puzzle:* Later excavations (Dörpfeld, Blegen) identified the *correct* layers (Troy VI/VIIa) as contemporary with Mycenaean Greece. Schliemann's dating error became a problem of archaeological method to solve, not a falsification of the site's identity.
          *   *Artifact Puzzle:* Misdated treasures became issues of stratigraphic context and chronological reassignment, not proof the site wasn't Troy.
          *   *Textual Puzzle:* Discrepancies between Homer and archaeology became questions about the nature of oral tradition, poetic license, and the core historical kernel within the myth.
          *   *Gatekeeper Stance:* Evidence was now interpreted *through* the lens that Hisarlik *was* Troy. Problems were methodological or interpretive puzzles to resolve, not reasons to reject the core identification.

  4.  **Where Sedimentation "Wins":** The model perfectly captures the academic shift. The core proposition "Hisarlik is the historical Troy referenced in the *Iliad*" transitioned from a contested claim to the fundamental framework. Inconsistencies no longer threatened the core identity; they defined the research agenda *within* that identity. Disciplinary practices (stratigraphy, comparative archaeology, textual criticism) evolved to solve puzzles generated by the accepted frame.

  **Testing the Model: Case on Theory (Nationalism's Role)**

  1.  **The Model's Blind Spot:** The institutional sedimentation model brilliantly explains the *internal academic process* of acceptance but risks obscuring the **external social and political forces** that shaped *which* frameworks gained traction and *which* gatekeepers held power.
  2.  **European Nationalism's Crucial Role:**
      *   **Schliemann's Motivation:** Deeply rooted in romantic German philhellenism and a desire to prove European cultural supremacy embodied in ancient Greece.
      *   **Gatekeeper Composition:** The dominant gatekeepers (German archaeologists, British classicists) were representatives of imperial European powers. Their cultural identity was deeply invested in the "Greek Miracle" and the historicity of foundational Western texts like Homer.
      *   **Funding & Legitimacy:** Schliemann's wealth and connections, along with the allure of "finding Troy," attracted support steeped in national pride. German institutions championed his work as a national triumph.
      *   **Selective Framing:** The "Troy is real" narrative served a powerful cultural need: grounding European identity and superiority in a tangible, heroic past. This created immense pressure *towards* accepting the core framework and treating inconsistencies as puzzles. Alternative interpretations (e.g., questioning Homer's historicity more fundamentally) or non-European perspectives (like Ottoman skepticism, largely sidelined) lacked similar cultural and institutional backing.
      *   **Ratification:** The *speed* and *enthusiasm* with which the "Troy is real" label was embraced by European publics and institutions, despite the early problems, cannot be separated from this nationalist fervor. It wasn't just evidence; it was proof of *their* glorious ancestry.

  3.  **Does the Model Hide This?** The model, focused on internal disciplinary dynamics, doesn't *inherently* hide it, but it doesn't **explain** it. It shows *how* acceptance happened academically but not *why* this particular frame (Hisarlik = Homeric Troy) was so much more attractive and resilient than competing frames for the dominant gatekeepers of the time. Nationalism provided the powerful social energy that accelerated the sedimentation process and privileged this specific interpretation over others.

  **Conclusion:**

  The institutional sedimentation model powerfully illuminates the academic transformation surrounding Schliemann's Troy. It explains the initial split (inconsistencies as falsification vs. nascent frame) and the subsequent consolidation (inconsistencies as puzzles within an accepted framework) driven by evolving disciplinary practices among key gatekeepers (archaeologists, classicists).

  However, the case of Troy forcefully demonstrates the model's limitation: **it cannot fully account for why a particular framework gains dominance.** The ratification of "Troy is real" was not solely an evidentiary or internal disciplinary victory. It was profoundly fueled by 19th-century European nationalism and philhellenism. This socio-political force shaped the priorities of the gatekeepers, influenced the allocation of resources and attention, and created a powerful cultural demand for the legend to become history. The sedimentation occurred, but the bedrock on which it settled was partly formed by national pride. A complete understanding requires viewing the institutional process *through* the lens of its historical and political context.
