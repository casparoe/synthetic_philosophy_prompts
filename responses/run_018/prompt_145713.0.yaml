  Below is a decision tree designed to classify positions on symmetric, non-communicating decision problems, based on concrete commitments in Hofstadter's Platonia dilemma and the Scientific American Luring Lottery. The tree begins with a foundational claim and proceeds through diagnostic questions phrased as specific, answerable queries. Each branch point corresponds to a substantive divergence in reasoning, and terminal leaves are labelled with the named philosophical positions. Unoccupied nodes are noted and diagnosed.

