answer: |-
  ## Joint Statement: Adversarial Collaboration on the Function of Costly Ritual

  **Preamble:**  
  This document represents a collaborative effort between researchers holding distinct theoretical perspectives on costly human ritual. We agree that advancing our understanding requires precise articulation of both common ground and disagreements, enabling empirical adjudication. We commit to jointly investigating the specified cruxes.

  **Section 1: Points of Agreement**

  We, the undersigned researchers representing both theoretical perspectives, jointly endorse the following claims regarding costly human ritual:

  1.  **Costly Rituals Exist:** Many documented human rituals across cultures involve significant material, temporal, energetic, or somatic costs (expenditure, pain, risk).
  2.  **Selection and Cost:** Natural selection can favor the evolution and cultural evolution of traits or practices bearing substantial costs *if* those costs are outweighed by associated benefits that enhance individual or group fitness. These benefits may accrue differentially to individuals or groups.
  3.  **Cooperation is Central:** Rituals are frequently embedded within systems of social cooperation. Understanding ritual cost requires considering its role within strategic interactions between individuals and the challenges of maintaining cooperative equilibria or solving collective-action problems.
  4.  **Inadequacy of Single-Factor Explanations:** Purely functionalist accounts that ignore the strategic dynamics of reputation, signaling, or free-rider problems are incomplete. Similarly, purely signaling accounts that ignore the functional imperatives of group coordination, synchronization, and common knowledge generation are also incomplete.
  5.  **Rituals Transmit Culture:** Rituals are potent mechanisms for the cultural transmission of norms, values, identities, and skills within groups.
  6.  **Empirical Focus:** Resolving disagreements requires empirical investigation focused on specific, testable predictions derived from contrasting theoretical positions.

  **Section 2: Table of Disagreements**

  | Core Issue                                                                 | Strong Handicap Position (as articulated by proponents)                                                                         | Institutional Coordination Position (as articulated by proponents)                                                                                         |
  | :------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------ | :--------------------------------------------------------------------------------------------------------------------------------------------------------- |
  | **(a) Primary Function of Cost:** <br>What is the core adaptive rationale for the observed costs in ritual? | **The costly elements of ritual are primarily designed features functioning as hard-to-fake signals.** The cost itself is the mechanism ensuring signal honesty, deterring free riders, and stabilizing cooperation by reliably advertising commitment, quality, or group affiliation to observers. | **The costly elements of ritual are primarily incidental byproducts of mechanisms solving coordination problems.** Costs arise from the energetic demands of synchronization, the resources needed for common knowledge generation, or the friction inherent in large-scale collective action; they are not primarily designed as signals. |
  | **(b) Primary Informational Value:** <br>How does ritual participation generate information leveraged for cooperation? | **Information centers on individual-level reputation tracking.** Observers (other group members) gain reliable information about the *individual participant's* commitment, quality, or reliability, enabling partner choice, alliance formation, and individual-level reciprocity. | **Information centers on group-level boundary maintenance and synchronization.** Participation generates common knowledge of shared commitment and identity, synchronizes emotional states and behavioral intentions, and defines group boundaries, facilitating collective action and solving coordination dilemmas *among* participants. |
  | **(c) Applicability to Modern Secular Practices:** <br>Can the handicap principle analogously explain costly modern secular behaviors (e.g., credential inflation, extreme sports)? | **Yes, the logic is analogous.** Costly secular behaviors function as honest signals of underlying qualities (dedication, ability, conformity) within modern social markets (e.g., job markets, status hierarchies), leveraging the same fundamental signaling logic that evolved in ancestral ritual contexts. | **No, there is a structural disanalogy.** Modern secular contexts often lack the specific ancestral conditions (small-scale groups, repeated interaction, shared cosmology) that made ritual waste *reliably* informative and stabilized its meaning. Costs in modern contexts may often reflect inefficient competition or path dependence rather than adaptive signaling design. |

  **Section 3: Key Empirical Cruxes**

  We identify the following specific questions whose resolution would constitute significant evidence for or against one perspective and potentially shift positions:

  1.  **The Credibility Surplus Crux:**
      *   **Question:** Do rituals exhibit a measurable "credibility surplus"? That is, does the observed cost consistently *exceed* the minimum cost theoretically necessary to achieve pure coordination, synchronization, or common knowledge generation within the specific group context? Furthermore, does the magnitude of any such surplus correlate more strongly with:
          *   (H1) Measurable *individual-level* benefits accruing to participants (e.g., enhanced mating opportunities, alliance formation, status gain, trustworthiness ratings)? *OR*
          *   (C1) Measurable *group-level* benefits (e.g., success in collective action tasks, group cohesion metrics, resilience to external threat), independent of individual participant benefits?
      *   **Significance:** A robust finding supporting H1 would strongly favor the Handicap perspective. A robust finding supporting C1, or a consistent *absence* of significant surplus beyond coordination minima, would strongly favor the Coordination perspective. Finding surplus correlated with *both* but mediated by group success would indicate complex interaction.

  2.  **The Amortization vs. Recurrence Crux:**
      *   **Question:** How does the cost burden of ritual participation change over an individual's tenure within the group?
          *   (H2) The Handicap camp predicts **signal amortization:** Costs (especially highly salient, front-loaded ones) are highest for newcomers/initiates and *decrease* over time as a reliable reputation is established. Established members may maintain status through lower-cost displays or by judging newcomers.
          *   (C2) The Coordination camp predicts **recurrent synchronization:** Costs remain relatively *stable and recurrent* for participants regardless of tenure, as the primary function (synchronization, common knowledge refresh, collective identity affirmation) requires ongoing, synchronous participation from members.
      *   **Significance:** Clear longitudinal patterns showing significant cost reduction for established members support H2. Patterns showing sustained high costs for all active participants support C2. Mixed patterns require investigation of moderating factors.

  **Section 4: Adjudication Strategies & Advance Predictions**

  For each crux, we specify an agreed-upon evidentiary approach and the explicit, falsifiable advance prediction of each camp:

  1.  **Crux 1: Credibility Surplus**
      *   **Case/Dataset:** Cross-cultural analysis of documented rituals. Data must include: (1) Quantifiable estimates of ritual costs (time, resources, risk); (2) Independent assessment of the minimum costs plausibly required for the ritual's coordination/synchronization function within its specific socio-ecological context (using ethnographic evidence, task analysis); (3) Measures of individual benefits (e.g., status mobility, reproductive success proxies, alliance network size); (4) Measures of group benefits (e.g., success in inter-group conflict, collective resource harvesting efficiency, group longevity, internal conflict levels); (5) Controls for group size, complexity, and resource base.
      *   **Handicap Prediction (H1):** A significant positive correlation will exist between the magnitude of the estimated credibility surplus (observed cost minus estimated minimum coordination cost) and individual-level benefit measures, *even after controlling rigorously for group-level benefit measures*. The correlation with group benefits may be present but is predicted to be weaker or explained by the aggregation of individual signaling benefits.
      *   **Coordination Prediction (C1):** The estimated credibility surplus will show little to no consistent positive correlation with individual-level benefits *once group-level benefit measures are controlled for*. The primary correlation will be between overall ritual cost intensity (or specific coordination-relevant cost elements) and group-level benefits. Significant surplus beyond coordination minima, if found, will not consistently predict individual advantages independently of group success.

  2.  **Crux 2: Amortization vs. Recurrence**
      *   **Case/Dataset:** Longitudinal ethnographic studies or analysis of longitudinal survey/observational data within specific ritual traditions. Data must track: (1) Individual participants' cost burden (time, resources, somatic effort) associated with specific key rituals over their lifecycle within the group (from initiation to elder status); (2) Their tenure/status within the group; (3) The functional demands of the ritual (e.g., is it primarily initiatory, calendrical, crisis-response?).
      *   **Handicap Prediction (H2):** For rituals plausibly serving a strong signaling function (especially initiation), the per-event or per-period cost burden will show a significant *negative correlation* with participant tenure/established status. Costs will be highest for new entrants and decrease for long-term members. Established members may shift to lower-cost maintenance signals or roles.
      *   **Coordination Prediction (C2):** For rituals serving core coordination/synchronization functions (especially recurrent calendrical or group-affirmation rituals), the average per-event or per-period cost burden will show *no significant negative correlation* with participant tenure/status. Active participants, regardless of seniority, will incur comparable recurrent costs necessary for synchronous participation and common knowledge generation. Costs for initiations may be high but are seen as part of ongoing synchronization demands.

  **Section 5: Meta-Assessment: Verbal vs. Substantive Disagreement**

  We acknowledge that **part of the disagreement might involve verbal distinctions.** Specifically:
  *   **"Cost" can be conceptualized differently:** The Handicap perspective often focuses on cost *as a designed feature ensuring signal honesty*. The Coordination perspective often focuses on cost *as friction arising from the mechanics of collective action*. These are distinct conceptualizations, not necessarily mutually exclusive descriptions of the same empirical phenomenon.
  *   **"Function" can be multi-layered:** A single ritual element might simultaneously serve signaling and coordination functions for different actors or at different levels.

  **Resolution Potential:** Rigorously distinguishing between:
  1.  **Cost-as-Signal-Design:** Is the cost *intrinsically necessary* for the *informational content* of the act? (Handicap: Yes, cost *is* the signal's reliability. Coordination: Not primarily; information comes from participation/co-presence).
  2.  **Cost-as-Coordination-Friction:** Is the cost an *extrinsic consequence* of the physical/energetic/logistical demands of achieving coordination/synchronization? (Coordination: Often yes. Handicap: May be present but secondary to signaling design).

  **Residual Substantive Disagreement:** Even after clarifying these conceptual frames, a core **empirical** disagreement remains: **Is the magnitude and patterning of ritual cost *best predicted and explained* by models where cost is a *selected-for feature* designed to solve problems of reliable communication and commitment (Handicap), or by models where cost is primarily an *incidental byproduct* or *constraint* arising from solutions to coordination and collective action problems (Coordination)?** The cruxes and predictions outlined in Sections 3 & 4 target this core empirical question. We agree that resolving it requires specific empirical evidence as detailed.

  **Signatories:**  
  [Place for Signatures - Strong Handicap Proponents]  
  [Place for Signatures - Institutional Coordination Proponents]
