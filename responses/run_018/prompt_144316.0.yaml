answer: |-
  ### Desiderata for Normative Preference Filtration

  **I. Explanatory Phenomena: Cases the Theory Must Distinguish**  
  *(For each: Phenomenon, Required Distinction, Collapse Consequence)*  

  1.  **Social Position Masquerading as Principle**  
      - **Case**: A hiring manager sincerely believes meritocracy requires standardized tests, unaware that these tests disadvantage groups underrepresented in their industry. Their "principle" functionally preserves demographic inertia.  
      - **Distinction Required**: Between preferences genuinely grounded in abstract moral reasoning vs. preferences causally dependent on social privilege/unexamined self-interest.  
      - **Collapse Consequence**: Fails to diagnose systemic injustice masked as neutrality; legitimizes status quo as "impartial".  

  2.  **Over-Correction Leading to Preference Evaporation**  
      - **Case**: After learning about framing effects and in-group bias, an agent becomes skeptical of *all* moral intuitions (e.g., revulsion at torture, loyalty to family), concluding no judgment is "clean". Their filtered preferences lack action-guiding content.  
      - **Distinction Required**: Between corrupting influences on judgment vs. core affective/constitutive elements of the agent's moral identity that provide normative substance.  
      - **Collapse Consequence**: Renders moral agency inert; unable to justify *any* substantive commitment, defeating the purpose of filtration.  

  3.  **Context-Dependent Validity of Structural Features (e.g., Emotional Salience)**  
      - **Case (Bias)**: Disgust triggers moral condemnation of consensual adult relationships (e.g., homosexuality) due to cultural conditioning.  
      - **Case (Legitimate Perception)**: Disgust triggers moral condemnation of genuine contamination (e.g., knowingly serving spoiled food to children).  
      - **Distinction Required**: Between cases where emotional responses track morally relevant features (e.g., harm, purity violations with real consequences) vs. cases where they reflect prejudice or arbitrary conditioning.  
      - **Collapse Consequence**: Either pathologizes essential moral emotions (losing touch with harm avoidance) or legitimizes bigotry by conflating it with legitimate aversion.  

  4.  **Collective Distortion**  
      - **Case**: A corporate board, through gradual normalization and mutual reinforcement, endorses an environmentally destructive practice no individual member would initially have supported in isolation, perceiving it as "industry standard" and "necessary".  
      - **Distinction Required**: Between preferences emerging from reasoned collective deliberation vs. preferences emerging from groupthink, diffusion of responsibility, or institutional capture.  
      - **Collapse Consequence**: Inability to critique institutionalized wrongdoing; treats shared judgment as intrinsically valid regardless of formation process.  

  **II. Consistency Conditions**  

  1.  **Empirical Adequacy**: Must accommodate robust findings from moral psychology:  
      - The pervasive role of heuristics (e.g., availability, representativeness) in intuitive judgment.  
      - Susceptibility to framing effects (e.g., loss aversion in moral dilemmas).  
      - The power of social influence (conformity, authority obedience) and situational factors.  
      - *Violation Consequence*: Theory is descriptively inaccurate, rendering normative advice impractical or irrelevant.  

  2.  **Moral Progress Condition**: Must allow for the revisability of current preferences. Requires:  
      - A mechanism to identify when current preferences are artifacts of unjust/incomplete information or coercive conditions.  
      - A non-circular standard for "improvement" (e.g., coherence under expanded information, reduced coercion).  
      - *Violation Consequence*: Fatalism; condemns agents to eternally affirm preferences formed under oppression or ignorance.  

  3.  **Pluralism Constraint**: Must distinguish reasonable disagreement (arising from differing weighting of valid values, legitimate cultural variation, or non-culpable differences in experience) from distortion/biases.  
      - *Violation Consequence*: Imperialism (dismissing all dissent as bias) or relativism (treating all deep disagreements as equally valid, making bias-correction impossible).  

  **III. Flagged Tensions Between Desiderata**  

  1.  **Transparency vs. Structural Invisibility**  
      - **Tension**: Can the theory demand agents recognize their own biases (for endorsement) while acknowledging some biases (e.g., implicit associations, ideological blind spots) are inherently opaque to first-person introspection?  
      - **Consequence**: Insisting on full transparency may exclude necessary third-person correction. Denying transparency risks paternalism, overriding sincere self-reports.  

  2.  **Reflective Endorsement vs. Adaptive Preference Correction**  
      - **Tension**: How can the theory respect an agent's current reflective endorsement while discounting adaptive preferences (e.g., "I'm happy with my limited opportunities; women just aren't suited for leadership") formed under conditions it deems unjust?  
      - **Consequence**: Prioritizing endorsement legitimizes oppression internalized as preference. Prioritizing correction overrides agency and imposes external values. Resolving this requires a contested normative baseline for "unjust conditions."  

  **IV. Comparative Vulnerability of Approaches**  

  | Approach                   | Most Likely Violated Desideratum                      | Reason                                                                                                |
  | :------------------------- | :---------------------------------------------------- | :---------------------------------------------------------------------------------------------------- |
  | **Preference-Satisfaction** | Over-Correction/Evaporation (II.2) & Social Position (I.1) | Defining the "filtered" preference set is circular (satisfying what?). Struggles to critique preferences adaptive to injustice or privilege without importing external norms. |
  | **Kantian Rationalist Coherence** | Pluralism Constraint (II.3) & Context-Dependency (I.3)           | Rigorous universalization may pathologize legitimate particularistic commitments (e.g., special duties) or culturally specific values. May struggle with the legitimacy of context-dependent emotional salience. |
  | **Contextualist Care-Ethics** | Collective Distortion (I.4) & Social Position (I.1)         | Emphasis on situatedness and relational perception risks legitimizing groupthink or in-group favoritism. May lack tools to critique locally "sincere" preferences shaped by oppressive relational norms. |
