answer: |-
  Your skepticism about the legal analogy for moral standing is well-placed. While the comparison offers an intuitive framework—casting the blamer as plaintiff, the blamed as defendant, the moral community as judge/jury, shared norms as procedural rules, hypocrisy as a conflict-of-interest bar, and the successful attribution of blame as a verdict—it imports several assumptions that distort the reality of moral blame. The analogy’s appeal lies in its procedural neatness, but its breakdown reveals why the "hypocrisy always kills standing" conclusion is overreaching.

  The core friction lies in the institutional nature of legal standing versus the interpersonal, decentralized character of moral blame. Courts require gatekeepers precisely because they possess unique, coercive authority: they can impose enforceable sanctions backed by state power. This necessitates formal barriers like "clean hands" doctrines to prevent abuse of that authority and maintain systemic integrity. Moral blame, however, operates in a fundamentally different sphere. There's no central authority granting licenses or enforcing verdicts. Blame manifests as protest, resentment, withdrawal of trust, or social pressure—actions inherently available to any moral agent within a community. To insist that blame *requires* an institutional gatekeeper analogous to a court is to falsely impose a top-down authority structure onto a practice that is inherently horizontal and participatory. Moral criticism isn't a privilege granted by a system; it's a basic expression of moral agency within relationships.

  This misalignment directly impacts how we should view hypocrisy. In court, a conflict of interest *is* a procedural bar—a formal disqualification independent of the claim's merit. The plaintiff isn't heard, regardless of whether their case is valid. But in moral contexts, hypocrisy functions primarily as an *epistemic and relational* problem, not a procedural disqualification. Pointing out hypocrisy doesn't magically erase the wrongness of the target's action; it undermines the *hypocrite's credibility* and *moral leverage*. We distrust their sincerity, question their motives ("Are they blaming to deflect from their own guilt?"), and find their criticism harder to accept emotionally because it feels unfair. This weakens their *persuasive force* and may make others less inclined to join their protest, but it doesn't automatically render their substantive moral judgment *invalid* or *prohibit them from expressing it*. A hypocrite shouting "stealing is wrong!" while stealing themselves is still correct about stealing being wrong, even if their act of blaming is tainted and ineffective. The legal analogy collapses the distinction between the *act of blaming* (which hypocrisy undermines) and the *truth of the blame* (which hypocrisy doesn't touch), treating the former’s weakness as an absolute bar on the latter.

  Furthermore, the court picture quietly imports notions of *enforcement* and *finality* that interpersonal blame lacks. A court verdict authorizes concrete punishment (fines, imprisonment). Moral blame's "sanctions" are diffuse—disapproval, damaged relationships, reputational harm—and lack formal finality. This difference matters when considering the supposed "disqualification" of the hypocrite. If blame isn't wielding institutional power, the dangers of "unclean hands" are less about systemic corruption and more about personal unfairness and ineffectiveness.

  This is where the "defeasible social token" framing becomes crucial. Instead of a rigid binary license (have standing/don't), imagine moral standing as a reservoir of *credibility and trust* built through perceived consistency between one's words and actions. Hypocrisy depletes this reservoir. When it's severely depleted, your blame loses its *weight*; people ignore you or dismiss you as a moral nuisance. But it’s not an absolute "disqualification." A deeply hypocritical person might still make a valid moral point that resonates if the target's wrongdoing is egregious enough. Conversely, someone with high moral credibility (a full reservoir) might retain significant standing even after a minor, unrelated hypocrisy, especially if they acknowledge it. This token model better captures the fluid, context-dependent, and gradational nature of actual moral influence. It sees hypocrisy as damaging the *force* and *reception* of blame, not annihilating some metaphysical right to utter it.

  So, does the conclusion that hypocrisy *always* kills standing survive this audit? No, it doesn’t. The legal analogy was indeed carrying the argument. Its rigid proceduralism—demanding "clean hands" as an entry ticket to the moral courtroom—artificially elevates hypocrisy to an absolute, context-independent disqualifier. Once we recognize moral blame as a decentralized practice rooted in agency and community norms, not institutional authority, hypocrisy shifts from being a *procedural bar* to being a *powerful defeater of credibility and effectiveness*. It weakens blame, often severely, and can render it socially inert or counterproductive. But it doesn't extinguish a "license" that never existed in the legal sense. A hypocrite’s criticism can still be *true*, and in rare cases, even a deeply compromised voice might be the only one willing to name a grave wrong. The legal analogy, while initially useful for structure, smuggles in assumptions about authority, enforcement, and binary qualification that fundamentally misrepresent the messy, human reality of holding each other morally accountable. Your instinct to audit it was spot-on—the analogy breaks under scrutiny, and the "full stop" dismissal demanded by hypocrisy doesn't hold. Moral life is less like a courtroom and more like an ongoing, imperfect conversation where damaged credibility matters immensely, but doesn't always silence the speaker entirely.
