prompt: |-
  hi — i run a quarterly ethics session for the staff on the memory care floor at our hospital (nurses, a couple of CNAs, the activities coordinator, nobody with any philosophy training) and i want to close the next one with a short poem instead of my usual slide. thought i'd ask you rather than try to write it myself.

  the case that always comes up is some version of this: M., who signed an advance directive at 54 refusing basically everything — antibiotics, a feeding tube, the works — and who at 78 has advanced dementia, is plainly content, hums along to the piano in the afternoon and finishes the pudding, and would almost certainly fail to refuse anything if you asked her now. the wrinkle i actually want the poem to handle is that her directive has one of those "not me" clauses: she wrote that if the day comes when she seems content in that state, that seeming contentment is to be treated as a symptom of the disease rather than as her speaking, and the form is to be honored anyway. so she didn't just predict her future preferences — she pre emptively disqualified them.

  i keep thinking a sestina is the right form, and i want it to earn that rather than just be decorative. six end words that never change but never come around in the same order twice, so that by the fourth stanza "signature" is landing at the end of a line about the woman who hums and "happy" is landing at the end of a line about the woman who signed. the rotation should do the identity work: same vocabulary, no stable arrangement, and no way to tell from the words alone which self is talking. standard pattern in case it helps — if the first stanza ends 1 2 3 4 5 6, then 615243, 364125, 532614, 451362, 246531, and then a three-line envoi that gets all six back in. unrhymed, shortish lines, don't slave over the meter, i want the whole thing to read out loud in well under two minutes.

  six words i had in mind: signature, happy, earlier, stranger, promise, mine — swap one or two if you've got better, but keep at least "earlier" and "mine," since the fight is really about who's word that is.

  what i definately don't want: i don't want the envoi to settle it. don't let the last three lines decide whether the earlier self or the present one has the authority, and don't let it turn into either a sermon about dignity or a soft thing about the person still being in there somewhere. the tug i want left standing is that the earlier self is the only one who ever had the whole life in view and also the only one who could be wrong about it, the present one is the only one actually here to bear anything and also the one who can't speak for the project anymore, and the clause is simultaneously a real piece of self knowledge and a way of arranging things so you can never be corrected. someone who works on this should think it's a fair picture of the disagreement and not a cartoon; someone who's just a CNA who's known four different Ms should get it on one hearing.

  american english please — we're in the US, a good chunk of the staff learned english as a second language, so nothing archaic or british and no vocabulary anyone would need a handout for.
reasoning: |-
  Okay, the user runs ethics sessions for memory care staff and wants a poem to replace their usual slide. They're dealing with a complex case involving an advance directive with a "not me" clause. 

  Hmm, they specifically want a sestina - that's ambitious for non-poetry folks, but their reasoning about the rotating end words reflecting identity instability is brilliant. They've clearly thought deeply about the form-function match. 

  The core tension: a patient (M.) who previously refused all interventions, now seems content but her directive insists this contentment shouldn't count. Staff struggle with honoring the document vs responding to the present person. 

  Key requests:
  - Must preserve ambiguity (no resolution in envoi)
  - Avoid sentimentality or preaching
  - Accessible American English 
  - End words: need to include "earlier" and "mine" for the autonomy debate
  - Under 2 minutes oral delivery

  *flipping through mental dictionary* Their proposed end words work well: "signature" (legal self), "happy" (current affect), "earlier" (past self), "stranger" (identity discontinuity), "promise" (binding document), "mine" (ownership of voice). 

  Biggest challenge will be avoiding didacticism while making the philosophical tension palpable. The rotating sestina form is perfect - each recurrence of "mine" or "happy" forces reevaluation of whose perspective it represents. 

  *testing line rhythms* Keeping lines short (4-5 stresses) as requested. The envoi will sneak all end words in without resolution - tricky but doable by having the staff perspective hold both truths. 

  *noting sensitivities* Absolutely no "dignity" or "still in there" clichés. The "not me" clause is simultaneously profound self-knowledge and epistemological violence - that's the real meat. 

  For accessibility: avoiding "symptom" for "sign," skipping words like "preemptively." Using "form" instead of "directive" sometimes for variation. 

  *checking time* Draft runs 40 seconds at medium pace - perfect. Final touch: ending on "mine" in the envoi to leave ownership ambiguously hovering.
answer: |-
  Here's a sestina designed for your purpose, using your requested end words and capturing the core tension without resolution:

  **The Clause**

  She signed the form with steady hand, a **signature**
  Declaring limits, fearing pain, not **happy**
  To linger lost. That self, so clear, **earlier**
  Envisioned only ruin. This one's a **stranger**
  Humming the tune. But bound by that **promise**,
  She wrote: "This shadow isn't truly **mine**."

  This woman here, who hums, whose hand takes **mine**
  To guide it towards the pudding, whose **signature**
  Now is a smile (they say). The **promise**
  Binds us. *Is* she content? She seems **happy**
  Enough. The music plays. A quiet **stranger**
  Sits where the fierce planner stood, **earlier**.

  The planner knew her mind, that **earlier**
  Force who declared, "This future shape is **mine**
  To refuse." She saw this **stranger**
  Coming. She named her void. The **signature**
  Holds fast. *Can* she be happy? This **happy**
  Humming – symptom, not assent. Her **promise**

  Demands we see it so. That **promise**,
  Made when the path was clear, **earlier**,
  Said: "If she *seems* at peace, seems **happy**
  In that fog, disregard it. Still **mine**
  Is the command." The binding **signature**
  Disowns the woman who's become a **stranger**.

  We feed the pudding to the **stranger**.
  We hold the paper with its **promise**.
  We see the mark, the **signature**.
  We knew the voice, the sharp **earlier**
  Certainty: "This body, pain, is **mine**
  To shield." Does sheltering bring **happy**?

  Is she at ease? She looks quite **happy**
  Now. But the directive names this **stranger**
  "Not Me." Whose life is this? Whose **mine**
  To judge? We're bound by the **promise**
  Made by the self defined **earlier**,
  Sealed by the decisive **signature**.

  The **promise** stands. The **signature** holds sway.
  The **earlier** self locked the **stranger** out.
  Is she **happy**? Whose voice claims **mine**?

  ---

  **Why this works for your needs:**

  1.  **Form Follows Function:** The sestina's rotating end words perfectly embody the instability of identity and perspective.
      *   "Happy" ends lines about both the present contentment and the past self's rejection of it.
      *   "Signature" ends lines about the legal act and the present, almost involuntary, smile.
      *   "Mine" ends lines claiming ownership by the past self and describing the present connection ("takes mine").
      *   "Earlier" and "Stranger" constantly juxtapose the two identities.
      *   "Promise" highlights the binding nature of the directive and the ethical burden.
  2.  **Ambiguity Preserved:** The envoi explicitly refuses resolution:
      *   "The promise stands. The signature holds sway." (Acknowledges the legal/ethical weight).
      *   "The earlier self locked the stranger out." (States the reality of the clause).
      *   "Is she happy? Whose voice claims mine?" (Leaves the core tension wide open – the present experience vs. the past command, and *who* truly owns the "mine" now?).
  3.  **Balanced Tension:** The poem presents both sides fairly:
      *   The "earlier" self's clarity, foresight, fear, and decisive action ("fierce planner," "knew her mind," "declared," "Certainty").
      *   The present self's apparent peace and simple pleasures ("humming," "smile," "seems happy," "looks quite happy," "at ease").
      *   The "not me" clause as both profound self-knowledge ("She saw this stranger coming. She named her void.") and a potentially brutal dismissal ("Disowns the woman," "locked the stranger out").
  4.  **Accessibility:**
      *   Uses clear, contemporary American English. No archaic terms or complex jargon.
      *   Vocabulary is direct and concrete (form, signed, pudding, hums, shadow, fog, paper, feed, hold).
      *   Short lines (mostly 4-5 stresses) and unrhymed, making it easy to read aloud clearly within 2 minutes.
      *   Concepts are presented through imagery and situation, not abstract philosophy ("fierce planner," "woman who hums," "feed the pudding," "binding signature," "locked the stranger out").
  5.  **Resists Sentimentality & Preaching:**
      *   Avoids words like "dignity," "soul," "essence," or "still in there."
      *   Focuses on observable realities (signing, humming, feeding, directive clauses) and the resulting ethical tension.
      *   Doesn't tell the staff what to feel or do. Presents the dilemma honestly.

  **Reading Notes:**

  *   Read clearly and steadily. Let the recurring end words land, emphasizing how their meaning shifts subtly with each repetition based on the context of the line.
  *   The envoi should be delivered thoughtfully, leaving the final question hanging in the air: "Is she happy? Whose voice claims mine?" This embodies the unresolved ethical space where the staff operate.

  This poem respects the complexity of M.'s situation and the difficult position of the staff, offering no easy answers but accurately framing the persistent tug-of-war between the selves defined by the "not me" clause.
