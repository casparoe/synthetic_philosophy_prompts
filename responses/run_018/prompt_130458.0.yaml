  ## The Ethical Imperative of Structural Fidelity for the Dead

  While artistic license grants creators the freedom to shape narratives around historical figures, inventing dialogue, condensing events, and imagining private moments, there exists an ethical boundary grounded in the fundamental nature of the person being portrayed. This boundary is **structural fidelity**: the obligation to preserve the core moral-causal architecture of the historical figure's documented choices and motivations. Violating this principle, particularly by reversing or excising the documented *reasons* for actions, constitutes a distinct wrong to the deceased individual, beyond mere factual error.

  **Why Structural Fidelity Matters: The Core of Personhood**

  The ethical duty arises because we owe the dead a preservation of their *moral agency* and the *authentic narrative of their character* as evidenced by their choices and own words. A person's life is defined not merely by *what* they did, but crucially by *why* they did it – the complex web of motivations, values, conflicts, and reasoning that drove their actions. To fundamentally alter this motivational structure is to misrepresent the essence of *who they were* as a conscious, choosing agent.

  *   **Moral Agency as Sacred:** We respect the dead, in part, by respecting the record of their conscious choices and the reasons they gave for them. This record constitutes the evidence of their unique moral struggle and development. Fictionalizing *external* events respects their agency by operating around it; altering their *internal* causal logic invades and rewrites it.
  *   **The Authentic Self:** The historical record, especially private writings like letters or diaries, offers the closest approximation to the individual's self-understanding and internal world. Disregarding this self-revealed logic constructs a fictional character *overlaid* onto the historical name, effectively silencing their voice and perspective.

  **The Reformer Hypothetical: The Wrong of Excision**

  Consider the 19th-century reformer whose private letters reveal her activism stemmed from a volatile mix of **genuine moral conviction** and **calculated social ambition**. She grappled with this duality, perhaps even expressed guilt or strategic justification in her writings. The historical record shows her choices were causally driven *by this specific, complex mixture*.

  The filmmaker, seeking a "cleaner arc," portrays *every major decision* as arising **solely from disinterested moral principle**. They excise ambition as a causal factor entirely.

  **This is not mere simplification; it is structural reversal and erasure:**

  1.  **Violating Documented Self-Perception:** The reformer explicitly acknowledged (in private) the role of ambition. Portraying her as purely disinterested directly contradicts her own self-analysis. The film imposes a motivation she herself rejected or wrestled with as *the* sole driver. It replaces her complex self-understanding with an alien one.
  2.  **Erasing Authentic Struggle:** Her internal conflict *was* her reality. It shaped her decisions, her doubts, her compromises, her triumphs. Removing ambition doesn't just omit a detail; it erases a core component of her lived experience and the engine of her documented actions. The film presents a character devoid of the internal tension that defined the actual person.
  3.  **Reversing Moral-Causal Logic:** The historical figure made choices *because* of this specific motivational cocktail. The film presents choices that *look* the same but are caused by a fundamentally different, simpler logic – one of pure altruism. This fundamentally alters the *meaning* of the actions. An act driven partly by ambition requires different moral consideration than one driven solely by principle. The film substitutes one moral-causal structure for another.
  4.  **Instrumentalizing the Individual:** By stripping away the documented, self-interested motive, the filmmaker uses the reformer's name and public deeds purely as a vessel for a simplistic, inspirational archetype. She becomes a tool for the filmmaker's preferred narrative, not an agent whose own complex reality is respected. This treats the dead person not as an end in themselves, but as mere raw material.

  **Why Artistic License Falters Here & Audience Preference is Irrelevant**

  Artistic license rightly allows embellishment *around* the core structure of a life: invented dialogue fleshes out character, compressed timelines aid pacing, imagined private moments explore plausible internal states consistent with the record. These are additions or adjustments, not core alterations. Structural fidelity constrains license by protecting the *foundational reasons* for actions.

  Audience preference for a "simpler moral portrait" is understandable but ethically secondary. The duty to the dead individual precedes the desire of the living for easily digestible heroes. Reducing a complex, conflicted human to a saintly archetype does violence to their memory and legacy. It denies them the dignity of their authentic struggle and complexity. It teaches audiences a false lesson about history and human nature: that meaningful change is only accomplished by the purely virtuous, erasing the messy reality where conviction often contends with ambition, fear, or self-interest.

  **Conclusion**

  Creators dramatizing historical figures owe the dead structural fidelity: respect for the documented moral-causal logic underpinning their choices. The hypothetical reformer suffered a distinct wrong not through invented scenes, but through the excision of a core, self-acknowledged motivation – ambition – and its replacement with a simplistic, purely altruistic driver. This violated her documented self-understanding, erased her authentic internal conflict, reversed the causal logic of her actions, and instrumentalized her memory. While art requires shaping, altering the fundamental *why* of a person's life crosses an ethical line, reducing the individual to a fictional construct bearing their name and betraying the duty we owe to the complexity and agency of those who came before us, even in death. The audience's desire for simplicity cannot justify this erasure of authentic human motivation.
