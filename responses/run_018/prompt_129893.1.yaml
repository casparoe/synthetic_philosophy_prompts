answer: |-
  ### Q&A Prep Sheet (Ordered by Damage Potential if Mishandled)

  #### **1. Skeptical Metaphysicians**  
  *Objection:* "Fiction lacks ontological robustness. How can authorial fiat—mere stipulation—constitute legitimate *data* for causal theories, when it’s unconstrained by real-world regularities or laws?"  
  *Reply:* Fiction provides *constrained hypotheticals*: authors establish rigorous ceteris paribus conditions (e.g., "if Hamlet hesitates, he dies") mirroring experimental isolation. This tests causal *inference structures*—not laws themselves—by eliminating epistemic noise. (Weakness: Grants fiction doesn’t discover laws but tests conceptual frameworks.)  

  #### **2. Literary Scholars** (LETHAL—HOPE NOBODY ASKS)  
  *Objection:* "You reduce narrative to causal scaffolding, but coherence is aesthetic/affective, not interventionist. Authors violate ‘fixing’ for dramatic irony or ambiguity—e.g., Kafka’s indeterminacy—so your ‘interventions’ are post hoc rationalizations of fluid story-logic."  
  *Reply:* Narrative coherence *requires* minimal causal consistency for intelligibility; deviations (e.g., magical realism) signal *new variables*, not framework failure. Authorial intervention is implicit in revision—editing a draft *is* testing interventions. (Weakness: If pressed, concedes narrative goals may *override* causal transparency, decoupling fiction from Woodward’s empirical aims.)  

  #### **3. Lewisian Counterfactualists**  
  *Objection:* "Fictional worlds *do* have inertia: authors imply laws via genre (e.g., physics in realism). ‘No nearest world’ is false—we default to minimal, lawful divergence (like Lewis’s miracles), so Hamlet’s hesitation-world resembles Elsinore’s norms unless specified otherwise."  
  *Reply:* Genre conventions are *interpretive heuristics*, not ontological constraints. Authors *break* them ad hoc (e.g., a realist novel introducing sudden magic) without specifying divergence mechanics. This voids Lewis’s similarity metric—only authorial intent fixes truth. (Weakness: Accepts critics can impose inertia *interpretively*, but notes this isn’t inherent to fiction.)  

  #### **4. Interventionists**  
  *Objection:* "Interventionism requires invariant relationships under *actual* manipulations. Authorial ‘intervention’ is just definitional stipulation—no variables are *free* of the author’s control, so it’s circular, not a test."  
  *Reply:* Authors *simulate* free variables by holding backgrounds fixed relative to a *narrative* experiment (e.g., "What if Gatsby never met Daisy?"). This tests whether Woodward-style dependency *models* hold under idealization, just as physics uses frictionless planes. (Weakness: Grants author-as-god violates Woodward’s agency constraints but argues formalism holds.)  

  #### **5. Lewisian Counterfactualists**  
  *Objection:* "Counterfactual dependence *can* handle fiction: we evaluate worlds where the *story’s axioms* are preserved. If Hamlet acts decisively, the nearest world tweaks only his psychology, not Denmark’s politics—so dependence works fine."  
  *Reply:* But authors often *don’t* preserve axioms—e.g., in *Sliding Doors*, splitting timelines violates "minimal change." Lewisian similarity is underdetermined without authorial guidance, forcing ad hoc interpretations. Interventionism avoids this by requiring explicit background fixation. (Weakness: Concedes Lewisians *can* impose consistency but deems it less elegant.)  

  #### **6. Skeptical Metaphysicians**  
  *Objection:* "Even if fiction models causation, it offers no *explanatory advantage* over thought experiments. Why prefer novels to philosophical hypotheticals, which are more precise?"  
  *Reply:* Fiction *stress-tests* theories via *sustained* complexity. A novel’s multi-variable ecosystem (e.g., social forces in *Middlemarch*) exposes where theories fail to scale—unlike sparse hypotheticals. It’s a robustness check. (Weakness: Accepts philosophical cases are cleaner but argues fiction’s richness probes applicability.)  

  #### **7. Interventionists**  
  *Objection:* "Your ‘authorial intervention’ conflates *defining* a scenario with *intervening* in one. Woodward requires interventions that *could* exist independently—but in fiction, the ‘intervention’ *creates* the world. Where’s the asymmetry?"  
  *Reply:* The asymmetry lies in revision: when authors edit drafts (e.g., "make this character bolder"), they intervene *on* a pre-established world. This mirrors scientific testing—manipulating one element while holding others fixed. (Weakness: Grants the "world" is abstract but insists the procedural parallel holds.)  

