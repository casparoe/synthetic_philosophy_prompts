  ## Salvage Ethics

  **(The air hangs thick with river-stink and panic. Water laps at the ankles of ALISTAIR (60s), a conservator in mud-splattered waders, frantically securing straps around two identical, wax-sealed crates resting on a library trolley. Rain hammers the high, arched windows of the flooded Rare Books annex. DR. EVELYN THORNE (50s), tweed impeccably dry despite the chaos, observes with detached intensity.)**

  **ALISTAIR:** (Straining against a strap) Nearly... there! Right. The lift can only take one crate before the power likely fails. *This* one, Evelyn – (he slaps the left crate) – the sole extant manuscript of Casimir Vane. Obscure, yes, but… pure, fractured brilliance. *That* one – (he gestures wearily at the right) – first editions. Austen, Dickens, Eliot, Hardy, Woolf. All five. Canonical. Irreplaceable. We take the five. No question.

  **EVELYN:** (Calmly, stepping closer) Alistair, wait. This requires more deliberation.

  **ALISTAIR:** (Stops, wiping sweat, incredulous) *Deliberation?* The water’s rising! Five indisputably major works versus one minor, albeit fascinating, curiosity! The greater preservation!

  **EVELYN:** (Holding up a hand, pedagogical) That’s precisely the aggregation I must challenge. You speak of ‘five’ versus ‘one’ as if the numerical sum generates a stronger moral claim. But consider: each work – Vane’s solitary manuscript, Austen’s *Pride*, Dickens’s *Copperfield*, Eliot’s *Mill*, Hardy’s *Jude*, Woolf’s *Lighthouse* – each possesses an *individual* claim to preservation. Each is a unique locus of artistic and historical value.

  **ALISTAIR:** (Eyes darting to the gurgling drainpipe) Evelyn, for God’s sake! Each is unique, yes! But saving five unique things is objectively better than saving one! The value *is* cumulative!

  **EVELYN:** (Shaking her head gently) Is it? Can we truly say the *claim* of Austen’s work, simply by existing alongside Dickens’s in the same crate, somehow merges or amplifies to outweigh Casimir Vane’s solitary claim? Does proximity create moral mass? I think not. Each work stands alone in its demand upon us. The value of Vane’s manuscript isn't inherently *lesser* than Austen’s; it’s merely different. Quantification here is a category error. Saving the five offers no *stronger reason* than saving the one; it merely satisfies more individual claims *if* we privilege aggregation, which I do not.

  **ALISTAIR:** (Stares at her, then the crates, a slow dawning) So… you’re saying… saving the crate with five books is no more justified than saving the crate with one? Because each *book* has an equal claim? Regardless of how many are packed together?

  **EVELYN:** (Nodding gravely) Precisely. To favour the crate containing multiple works simply because it contains more would be to disregard the equal inherent claim of the single work in the other. It violates fairness. The only equitable procedure is to grant each *work* an equal chance. We require a lottery.

  **ALISTAIR:** (A bark of laughter, sharp with disbelief) A lottery? For the *crates*? But… Evelyn… (He points a trembling, muddy finger at the crate containing the five authors). *That crate*. It doesn’t contain one thing with one ‘claim’. It contains *five* distinct, physical books. Five objects. Five unique demands, as you put it. If we draw lots for the *crates*, and that crate wins… we save *all five*. If we draw lots for the *individual works*… (He gestures wildly between the crates) …then Vane’s manuscript is one slip in the hat. Austen’s *Pride and Prejudice* is another. Dickens’s *David Copperfield* is a third. And so on. Five slips from *that* crate, one slip from *this* one. Six slips total. *Then* it’s fair, by your lights? Each *work* has an equal chance?

  **EVELYN:** (Considers this for a moment, utterly unruffled) Ah. I see your point. Yes. To truly honour the distinct claim of each individual work, irrespective of its container, we should indeed randomise selection among the *works themselves*, not the crates. Six slips. Each work – Vane, Austen, Dickens, Eliot, Hardy, Woolf – bears an equal probability of selection. That is the consistent application of the principle. We must unpack the crates immediately to prepare the lots.

  **ALISTAIR:** (Looks from the rising water swirling around the trolley wheels to the perfectly calm philosopher, then back to the crates. His voice is dangerously quiet) Unpack… the crates. In this… rising flood. To make… six slips of paper. For a lottery. Between six books. Five of which are currently conveniently housed… *in one box*.

  **EVELYN:** (Meets his gaze, serene, unyielding) Correct, Alistair. Fairness demands we treat each claim as absolute and non-fungible. The physical proximity is irrelevant. Five claims. One crate. We require a fair procedure. Do you have a pencil?

  **(Alistair stares at her. The only sound is the relentless drumming of rain and the ominous gurgle from the drainpipe. He slowly takes the trolley handle, his knuckles white.)**

  ---

  **Key Mechanics Embedded:**

  1.  **Anti-Aggregation:** Evelyn explicitly rejects the idea that five claims sum to create a greater reason ("no stronger reason," "aggregation I must challenge," "quantification... a category error").
  2.  **Equal Claims:** She insists each work, regardless of canonical status or container, has an equal claim to preservation ("each possesses an individual claim," "equal inherent claim").
  3.  **Lottery as Fairness:** Maximizing saved books is rejected; fairness requires an equal-chance lottery ("equitable procedure," "grant each work an equal chance").
  4.  **The Punchline (Category Error Exposed):** Alistair exposes the absurdity *within the logic* by pointing out the crate holds *five physical books*, meaning a crate-lottery *doesn't* give each work an equal chance. Evelyn, being consistent, agrees they must now unpack in a flood to make six individual lots ("Five claims. One crate").
  5.  **Practical vs. Theoretical:** Alistair's exasperation highlights the fatal impracticality and category confusion (treating books as abstract "claims" requiring individual lottery draws, ignoring physical reality and urgency) while Evelyn remains rigidly committed to the principle's internal logic, regardless of consequence. The humor is in her calm acceptance of the disastrous operational requirement her own principle demands.
