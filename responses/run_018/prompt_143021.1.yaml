prompt: |-
  I'm a senior researcher at a genocide-studies archive who must code perpetrator testimonies for an exhibition, classifying each account as best explained by situational conformity and peer pressure in the moment (in the manner of Browning's analysis of Reserve Police Battalion 101) or by prior ideological commitment and culturally embedded hatred (in the manner of Goldhagen's thesis of eliminatory antisemitism). I apply this dozens of times under time pressure, with only a research assistant checking consistency, and the museum director must sign off on any classification that exculpates. Write a reusable decision procedure—ordered questions with evidence thresholds—that I can run on a testimony and its contextual record. Include a step testing for "discursive residue" (whether the perpetrator uses bureaucratic euphemism versus explicit eliminationist language) and a step testing for "unobserved deviation" (whether the actor refused or modified orders when not directly supervised). For each step, specify what answer pushes the classification toward situational, toward ideological, or into an undetermined zone; mark explicit stop points where evidence is insufficient and the default must be "undetermined" rather than either explanation; and flag where the framing becomes a value judgment (e.g., whether a situational explanation amounts to moral excuse) that must be escalated to the director rather than resolved by procedure. Apply it to two cases: (a) a policeman who requested transfer after his first shooting, was denied, and continued; and (b) a local official who volunteered for auxiliary duties, used explicit racial slurs in private letters, but later claimed he was only following orders—this second case should yield a classification I will find uncomfortable. Conclude with an honest statement of what the procedure cannot settle, especially retrospective testimony bias, and identify which judgments remain irreducibly interpretive. Finally, say what would change your verdict on this framework: which empirical finding about perpetrator motivation or which conceptual argument about how situational and ideological factors interact would lead you to revise the procedure's weighting, and point to the specific step in your reasoning most likely to fail.
reasoning: |-
  We are designing a decision procedure to classify perpetrator testimonies along the spectrum of situational conformity (Browning) vs. ideological commitment (Goldhagen). The procedure must be reusable and include steps for "discursive residue" and "unobserved deviation". We also need to account for insufficient evidence and value judgments that require escalation. The procedure will be applied to two test cases.

  **Decision Procedure: Classifying Perpetrator Testimonies**

  **Step 1: Pre-existing Ideological Indicators**
  - **Question:** Does the testimony or contextual record (e.g., prior letters, diaries, memberships, prior actions) show evidence of pre-existing eliminationist ideology, racial hatred, or dehumanizing beliefs about the victim group?
  - **Evidence Threshold:** Require at least two independent sources (e.g., private letter + organizational membership) or one highly explicit source (e.g., diary entry using eliminationist language).
  - **Push Toward Ideological:** Yes, with evidence meeting threshold.
  - **Push Toward Situational:** Absence of such evidence (but note: absence is not proof of absence).
  - **Undetermined:** No evidence meeting threshold, but also no clear absence (e.g., no private writings exist) → stop and mark as undetermined due to insufficient evidence.
  - **Escalation Flag:** None at this step.

  **Step 2: Discursive Residue (Language Analysis)**
  - **Question:** Does the perpetrator use bureaucratic euphemisms (e.g., "evacuation", "special treatment") or explicit eliminationist language (e.g., "exterminate", "vermin", racial slurs) in testimony or contemporary records?
  - **Evidence Threshold:** At least one clear example in a contemporary document (not just in testimony given post-war). Testimony alone is less reliable due to potential retrospective bias, but if consistent with other evidence, can be considered.
  - **Push Toward Ideological:** Explicit eliminationist language, especially in private (unlikely to be coerced).
  - **Push Toward Situational:** Consistent use of bureaucratic euphemisms without explicit hate language.
  - **Undetermined:** Mixed use (some euphemisms, some explicit) or no contemporary records → stop and mark as undetermined if contemporary records are absent (relying only on testimony is unreliable for this step).
  - **Escalation Flag:** None.

  **Step 3: Unobserved Deviation (Behavioral Autonomy)**
  - **Question:** Is there evidence that the perpetrator refused, avoided, or modified orders when unsupervised (e.g., not directly under command or peer pressure)? And conversely, did they go beyond orders without being compelled?
  - **Evidence Threshold:** Requires documented incidents (e.g., testimony from multiple witnesses, official reports, or perpetrator's own consistent account) of refusal/avoidance or, conversely, voluntary excess.
  - **Push Toward Situational:** Refusal/avoidance when unsupervised (suggests action is driven by external pressure).
  - **Push Toward Ideological:** Voluntary excess beyond orders (suggests internal motivation).
  - **Undetermined:** No evidence of behavior when unsupervised → stop and mark as undetermined (we cannot infer autonomy without evidence of unsupervised actions).
  - **Escalation Flag:** None.

  **Step 4: Reaction to First Killing/Key Action**
  - **Question:** How did the perpetrator react to their first direct participation in violence (e.g., shooting, deportation)? Look for signs of distress, refusal, or conversely, ease and willingness.
  - **Evidence Threshold:** Requires contemporary accounts (diary, letter, or immediate report) or consistent testimony from the time (not retrospective claims without corroboration).
  - **Push Toward Situational:** Acute distress, attempts to avoid/transfer, or refusal (even if later continued under pressure).
  - **Push Toward Ideological:** Ease, pride, or voluntary repetition without being ordered.
  - **Undetermined:** No evidence of reaction → stop and mark as undetermined.
  - **Escalation Flag:** None.

  **Step 5: Post-event Justification in Testimony**
  - **Question:** In testimony (especially postwar), does the perpetrator claim ideological alignment (e.g., "I believed it was necessary") or situational pressure (e.g., "I had no choice", "everyone was doing it")?
  - **Evidence Threshold:** Claims must be consistent with other evidence. If contradictory to contemporary evidence, discount.
  - **Push Toward Ideological:** Claims of ideological alignment that align with prior evidence.
  - **Push Toward Situational:** Claims of situational pressure that align with prior evidence (e.g., documented refusal attempts).
  - **Undetermined:** Claims that are self-serving and contradict contemporary evidence → stop and mark as undetermined (unreliable testimony).
  - **Escalation Flag:** If a situational explanation is accepted, note that this may be perceived as exculpatory and must be escalated to the director for sign-off.

  **Step 6: Overall Consistency with Context**
  - **Question:** Considering the perpetrator's role, rank, and historical context (e.g., was the unit known for ideological training? Was refusal punishable by death?), does the evidence cohere?
  - **Evidence Threshold:** Requires matching with known historical facts (e.g., if in a unit where refusal was not punished severely, then refusal attempts would be more indicative of situational factors).
  - **Push Toward Ideological:** Evidence is consistent with known ideological indoctrination in the unit and the perpetrator's actions show internalization.
  - **Push Toward Situational:** Evidence is consistent with a unit where peer pressure was primary and ideological training minimal.
  - **Undetermined:** Contradicts known context → stop and mark as undetermined (inconsistency).
  - **Escalation Flag:** None.

  **Summary Classification Rules:**
  - If majority of steps (at least 3) push toward ideological and none toward situational, classify as ideological.
  - If majority of steps (at least 3) push toward situational and none toward ideological, classify as situational.
  - If mixed or undetermined in any step that stopped, classify as undetermined.

  **Escalation Rule:** Any classification that results in a situational explanation (which may be perceived as exculpatory) must be signed off by the museum director.

