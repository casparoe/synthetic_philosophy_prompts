  **Application to Case (b): Local official who volunteered for auxiliary duties, used explicit racial slurs in private letters, but later claimed he was only following orders.**

  Step 1: Pre-existing ideological indicators: Private letters with explicit racial slurs. This is one explicit source (if the slurs are eliminationist, e.g., calling for extermination). But if just slurs, not necessarily eliminationist? We need to see if they are eliminationist. Let's assume the letters contain explicit dehumanizing language and even endorsement of elimination. Then Step 1: meets threshold → push toward ideological.

  Step 2: Discursive residue: Private letters use explicit slurs and eliminationist language → push toward ideological. (Even if in official duties he used euphemisms, the private letters show his real mindset.)

  Step 3: Unobserved deviation: He volunteered for auxiliary duties. Volunteering is an unsupervised act (he wasn't ordered to volunteer) → this is going beyond orders? Not exactly. Volunteering when not compelled is evidence of initiative, which is unsupervised and voluntary. So push toward ideological.

  But note: what if he volunteered because of peer pressure? The step is about unsupervised behavior. Volunteering is an act that is not under direct supervision (he could have not volunteered). So it's evidence of ideological motivation.

  Step 4: Reaction to first killing? The case doesn't specify. We don't have evidence → Step 4: undetermined.

  Step 5: Post-event justification: He claims he was only following orders, but we have evidence (private letters) showing ideological commitment. This claim is self-serving and contradicts contemporary evidence (the letters). So we discount the testimony. Therefore, Step 5: undetermined (because we cannot rely on the testimony, and we don't have other post-event justifications).

  Step 6: Context: As a local official, what was the context? If in an area where ideological indoctrination was high and volunteering was common due to peer pressure, we must check. But the volunteering and the private letters suggest ideological alignment. Push toward ideological.

  Summary:
  - Step1: ideological
  - Step2: ideological
  - Step3: ideological (volunteering without being ordered)
  - Step4: undetermined
  - Step5: undetermined
  - Step6: ideological

  Majority (four steps) toward ideological, none toward situational. Classify as ideological.

  But note: the researcher feels uncomfortable because the official later claimed he was only following orders. However, the procedure discounts that because it is contradicted by contemporary evidence.

  **Case (b) Classification:** Ideological.

  ---

  **Limitations and Honest Statement:**

  The procedure cannot settle:
  - **Retrospective testimony bias:** Post-hoc justifications (especially in legal or moral jeopardy) are unreliable. We mitigate by relying on contemporary evidence, but if that is absent, we mark as undetermined.
  - **Internal motivations are not directly observable:** We infer from behavior and language, but there can be multiple interpretations.
  - **Interaction of factors:** Situational pressures and ideological commitments can coexist and interact in complex ways. The procedure forces a binary choice, but reality is often a mix.

  **Irreducibly interpretive judgments:**
  - Interpreting language as "eliminationist" vs. merely prejudiced.
  - Deciding whether an unsupervised act (like volunteering) is due to ideology or other factors (e.g., careerism).
  - Weighing the consistency of testimony with contemporary evidence.

  **What would change the verdict on this framework?**
  - **Empirical finding:** If a study showed that explicit eliminationist language in private letters was common even among those who later refused to kill (i.e., was not predictive of ideological action), then Step 2 (discursive residue) would be less reliable. We would need to adjust the threshold or weight of this step.
  - **Conceptual argument:** If new research demonstrated that situational factors (like peer pressure) can produce explicit hate speech as a form of conformity (not reflecting internal belief), then Step 2 would need revision. Similarly, if volunteering for duties (Step 3) was shown to be primarily driven by non-ideological factors (e.g., material reward), then the push toward ideological for volunteering would be weakened.
  - **Step most likely to fail:** Step 3 (unobserved deviation) because it assumes that unsupervised actions are necessarily reflective of internal motivation. But an actor might volunteer due to perceived social pressure even when unsupervised, or might refuse only because of fear of consequences (even if unsupervised). Thus, the inference from unsupervised behavior to motivation is not foolproof.

  **Conclusion:** This procedure provides a structured approach but requires careful application and escalation for situational classifications. It is a tool to guide, not replace, scholarly judgment, and must be updated as new evidence and theories emerge.
answer: |-
  Below is a reusable, step-by-step decision procedure for classifying perpetrator testimonies along the situational-vs-ideological axis, designed for efficiency and consistency under time constraints. The procedure is structured as ordered questions with evidence thresholds, explicit stop points for insufficient evidence, and flags for value judgments requiring escalation. It incorporates "discursive residue" (Step 3) and "unobserved deviation" (Step 4) as requested. Each step specifies how answers push toward **situational** (S), **ideological** (I), or **undetermined** (U). Escalation to the museum director is required for situational classifications (due to exculpatory implications) or when value judgments arise.

  ---

  ### **Decision Procedure: Classifying Perpetrator Testimonies**  
  **Inputs:** Testimony transcript + contextual record (diaries, letters, unit histories, witness accounts, etc.).  
  **Output:** Classification (S/I/U) + escalation flags.  
  **Rules:**  
  - Stop at any step marked "U" if evidence is insufficient; default to "undetermined."  
  - Escalate to director if:  
    - Classification is situational (moral excuse risk).  
    - Value judgment is flagged (procedural ambiguity).  
  - Proceed sequentially; later steps can override earlier ones if evidence is stronger.  

  #### **Step 1: Pre-Action Ideological Indicators**  
  **Question:** Is there evidence of pre-existing ideological commitment (e.g., membership in radical groups, explicit hatred in pre-event diaries/letters, or participation in prior violence against the victim group)?  
  **Evidence Threshold:** Requires at least two non-testimonial sources (e.g., letter + witness) or one unambiguous ideological declaration (e.g., "We must eradicate [group]").  
  - **→ Ideological (I):** Threshold met (e.g., diary entry: "This race is a cancer").  
  - **→ Situational (S):** Absence of evidence despite complete records (e.g., clean pre-war history, no hate speech).  
  - **→ Undetermined (U):** Records incomplete or ambiguous (e.g., no personal writings exist). **Stop here if U.**  
  **Escalation:** None.  

  #### **Step 2: Recruitment/Initial Participation**  
  **Question:** Did the perpetrator volunteer for duties or express enthusiasm pre-action (e.g., requesting deployment), or was participation coerced/assigned?  
  **Evidence Threshold:** Requires orders, deployment records, or corroborated testimony.  
  - **→ Ideological (I):** Volunteered unprompted or expressed eagerness (e.g., "I joined to purify our nation").  
  - **→ Situational (S):** Assigned under duress (e.g., conscripted, threatened with punishment).  
  - **→ Undetermined (U):** No records of assignment/volunteering. **Stop here if U.**  
  **Escalation:** None.  

  #### **Step 3: Discursive Residue (Language Analysis)**  
  **Question:** Does contemporary language (not testimony) show bureaucratic euphemisms ("processing," "resettlement") or explicit eliminationist terms ("exterminate," "vermin," racial slurs)?  
  **Evidence Threshold:** Requires at least one non-testimonial source (e.g., letter, memo, intercepted comms). Post-testimony claims are discounted without corroboration.  
  - **→ Ideological (I):** Explicit eliminationist language (e.g., private letter: "Kill the rats").  
  - **→ Situational (S):** Consistent euphemisms (e.g., memo: "Transfer to Zone B").  
  - **→ Undetermined (U):** No contemporary language evidence. **Stop here if U.**  
  **Escalation:** None.  

  #### **Step 4: Unobserved Deviation (Behavioral Autonomy)**  
  **Question:** Is there evidence of refusal, avoidance, or excessive brutality *when unsupervised* (e.g., no commanders/peers present)?  
  **Evidence Threshold:** Requires two sources (e.g., witness + perpetrator account) or physical evidence (e.g., transfer requests, reports of insubordination).  
  - **→ Situational (S):** Refusal/avoidance when unsupervised (e.g., hid during raids when alone).  
  - **→ Ideological (I):** Excessive brutality beyond orders when unsupervised (e.g., tortured victims off-duty).  
  - **→ Undetermined (U):** No evidence of unsupervised behavior. **Stop here if U.**  
  **Escalation:** Value judgment flagged if refusal is attributed to "weakness" vs. "morality" (director must weigh).  

  #### **Step 5: Post-Action Rationalization**  
  **Question:** Does testimony emphasize ideological conviction ("I believed it was right") or situational pressure ("I had no choice")?  
  **Evidence Threshold:** Testimony must align with at least one piece of contemporary evidence (e.g., diary entry matches claim).  
  - **→ Ideological (I):** Claims ideological alignment consistent with Step 1/3.  
  - **→ Situational (S):** Blames peers/orders consistent with Step 2/4.  
  - **→ Undetermined (U):** Self-contradictory or unsupported by evidence. **Stop here if U.**  
  **Escalation:** Always escalate if S-classified (exculpatory risk).  

  #### **Step 6: Consistency with Historical Context**  
  **Question:** Does the actor’s behavior align with unit norms? (e.g., Battalion 101’s refusal options vs. SS ideological training).  
  **Evidence Threshold:** Unit records or scholarly analysis (e.g., Browning/Goldhagen datasets).  
  - **→ Situational (S):** Behavior matches low-ideology units (e.g., refusal was common and unpunished).  
  - **→ Ideological (I):** Behavior matches high-ideology units (e.g., widespread volunteering).  
  - **→ Undetermined (U):** Context unclear or unit norms unknown.  
  **Escalation:** None.  

  #### **Final Classification Rules**  
  - **Ideological:** ≥3 steps favor I, and ≤1 favors S.  
  - **Situational:** ≥3 steps favor S, and ≤1 favors I.  
  - **Undetermined:** All other cases (e.g., ties, stops at U).  
  - **Escalate:** All situational classifications to director.  

  ---

  ### **Application to Test Cases**  
  #### **Case (a): Policeman who requested transfer after first shooting, was denied, and continued.**  
  - **Step 1 (Pre-Action):** No evidence of ideology → **S**.  
  - **Step 2 (Recruitment):** Assigned (not volunteered) → **S**.  
  - **Step 3 (Discursive):** No contemporary letters → **U** (stop, but proceed if other steps strong).  
  - **Step 4 (Deviation):** Requested transfer (refusal attempt) → **S**.  
  - **Step 5 (Rationalization):** Testimony blames orders ("I was denied transfer") → **S** (consistent with Step 4).  
  - **Step 6 (Context):** Reserve Police units allowed refusals (Browning) → **S**.  
  **Classification:** **Situational** (4S, 1U). **Escalate to director** (exculpatory risk).  

  #### **Case (b): Local official who volunteered for auxiliary duties, used racial slurs in private letters, but claimed "only following orders."**  
  - **Step 1 (Pre-Action):** Private letters with racial slurs → **I**.  
  - **Step 2 (Recruitment):** Volunteered → **I**.  
  - **Step 3 (Discursive):** Explicit slurs in letters → **I**.  
  - **Step 4 (Deviation):** No evidence of refusal; volunteered unsupervised → **I** (inferred initiative).  
  - **Step 5 (Rationalization):** Claims "following orders" but contradicted by Steps 1–3 → **U** (self-serving).  
  - **Step 6 (Context):** Local officials often ideologically driven → **I**.  
  **Classification:** **Ideological** (4I, 1U). *Uncomfortable for researcher*: Testimony denies ideology, but contemporary evidence overwhelms it. No escalation (not situational).  

  ---

  ### **Limitations and Honest Statement**  
  **This procedure cannot settle:**  
  1. **Retrospective testimony bias:** Perpetrators often reframe actions post-hoc (e.g., Case b’s denial). Procedure discounts uncorroborated testimony but cannot reconstruct "true" intent.  
  2. **Coexistence of factors:** Situational pressures and ideology often interact (e.g., ideology may facilitate conformity). The binary forces an artificial choice.  
  3. **Interpretive judgments:**  
     - Step 4 ("unobserved deviation") requires inferring *why* someone refused (moral compunction? fear?).  
     - Step 3 ("discursive residue") hinges on subjective interpretation of language (e.g., is a slur "eliminationist"?).  
  4. **Missing evidence:** Gaps in archives (e.g., lost letters) default to U, but may misrepresent prevalence of ideology.  

  **What would change my verdict on this framework?**  
  - **Empirical finding:** If studies showed ideology was *rare* in low-rank perpetrators (e.g., letters were performative), **Step 3** would need higher thresholds.  
  - **Conceptual argument:** If peer pressure was proven to generate "mimetic hatred" (situational actors adopt ideological language), **Step 3** becomes unreliable.  
  - **Step most likely to fail:** **Step 4 (unobserved deviation)**. If new evidence showed refusal was often pragmatic (e.g., to avoid disgust, not moral rejection), classifying it as "situational" would be misleading. This step’s inference from behavior to motivation is inherently fragile.  

  **Conclusion:** This procedure standardizes classification and mitigates bias but remains a heuristic. It clarifies evidence gaps and flags moral risks for director oversight, yet cannot resolve the "gray zone" where conformity and ideology entwine. Revise it as new evidence on perpetrator psychology emerges—especially regarding how ordinary people "activate" hatred in groups.
