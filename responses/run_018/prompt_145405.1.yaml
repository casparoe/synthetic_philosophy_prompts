prompt: |-
  Please take the role of an expert in comparative defense policy and political philosophy, with deep familiarity with European security institutions. Before writing anything, please spend a moment brainstorming: what makes the comparison between militia-based neutrality and territorial-defense conscription conceptually interesting rather than merely descriptive, and how can an exam question compel students to construct an evaluative argument instead of summarizing three countries?

  I am a high school student preparing a mock final for my advanced International Baccalaureate Politics course. I need an original, rigorous essay prompt that sits somewhat in the weeds of defense-policy theory but remains fully answerable by a well-prepared student who has no online access during the exam. The topic is conscription, professional armies, and armed neutrality, using Switzerland, Sweden, and Finland.

  Please construct a 45-minute essay question worth 25 marks that forces students to analyze rather than describe. To avoid a generic summary task, inject the following analytical frame: distinguish territorial-defense conscription—designed to make invasion prohibitively costly through rapid mobilization of a trained citizenry—from militia-based armed neutrality, which uses part-time service and decentralized equipment storage to maintain a credible non-aggressive strategic posture. Ask students to evaluate whether Finland's retention of broad-based conscription and Switzerland's militia tradition represent genuinely different conceptions of democratic citizenship through military obligation, particularly in light of Sweden's shift away from conscription toward an all-volunteer force and its subsequent partial reinstatement. The question should require students to apply credible-commitment logic—specifically, that a citizen-army structurally signals defensive intent because it is ill-suited to expeditionary warfare—while weighing this against the professional-specialization argument that modern warfare demands continuous technical training.

  Then provide:
  1. The exam question itself, with explicit instructions that prohibit pure country-by-country description and require a comparative thesis.
  2. A model answer of approximately 600 words demonstrating the specific conceptual moves a top response must contain: precise definitions of both models, comparison through the democratic-legitimacy and credible-commitment lenses, use of Sweden's trajectory as a confirming or anomalous case, and a qualified conclusion about whether the two systems represent different citizenship ideals or convergent practical solutions.
  3. A marking scheme that separates an A answer from a B answer by naming required moves—such as correctly applying credible-commitment logic, treating neutrality as strategic posture rather than legal status, and using Sweden to test the argument rather than listing it as a third example. Also list specific mistakes that should cost marks: conflating conscription with universal civic service, ignoring the democratic-citizenship dimension, or describing institutional features without linking them to the analytical frame.

  Please do not include bibliographies, reading lists, or citation requests. Do not use verbatim quotations from real texts unless you can verify them exactly against a source; if referencing doctrines or thinkers, paraphrase without quotation marks. Ensure the factual core depends only on well-known institutional features of the three countries, not on obscure dates, minor legislative details, or contested historical episodes that a small language model or well-prepared student might not reliably recall.
