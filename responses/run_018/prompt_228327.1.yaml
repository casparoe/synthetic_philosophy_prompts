answer: |-
  You've landed a glancing blow, but let me reset your target. Your objection assumes *current* argumentative practices are irreplaceable – but I claim they're temporary scaffolding. Just as chemists used phlogiston-talk *while developing* oxygen theory, I provisionally use folk-psychological terms *to communicate the theory that supersedes them*. The neural states underlying my utterance and your processing aren't beliefs/desires; they're complex neurocomputational patterns. Future neuroscience will explain persuasion via synaptic change dynamics, not propositional attitudes. (Admittedly, whether folk psychology is a *theory* is contested; I hold it is, like Fodor rejects.) My argument is a bridge to that future vocabulary. Isn't all conceptual revolution initially expressed in old terms? What better method exists *during transition*?
