prompt: |-
  I am drafting a novel of literary science fiction in which scientific thought experiments occur as lived narrative episodes—scenes in which characters reason through imagined apparatuses or biological impossibilities not as metaphors but as attempts to extend conceptual understanding. I need a reusable decision procedure, grounded in the philosophy of science on how thought experiments yield knowledge, that I can run on any proposed scene before committing it to manuscript. The procedure must be executable in about thirty minutes by someone without formal philosophical training; it should take the form of an ordered checklist with explicit stopping conditions, specify what counts as a sufficient answer at each stage, and clearly flag the points where judgment cannot be eliminated and must be referred either to my science consultant or to my own narrative authority. It must distinguish scenes that genuinely function as argument-based or Platonic thought experiments—yielding conceptual knowledge about an existing theory—from scenes that are merely facilitative illustrations, empirically ungrounded hypotheses, or category mistakes disguised as reasoning.

  Please construct the procedure by translating the core philosophical distinctions—between argument-reconstruction accounts, Platonic-access-through-idealization accounts, and the conditions under which imaginative scenarios smuggle hidden empirical premises—into practical tests that a practicing writer can apply. Do not include bibliographies, reading lists, or citation requests. Then apply the procedure step by step to three narrative proposals I am considering.

  First, a scene in which a blind physicist derives the relativity of simultaneity using only a tactile train-model and mental arithmetic, with no instrumental observation—an eliminative idealization of a classic relativistic case, but stripped of all visual intuition and rendered purely through haptic reasoning.

  Second, a scene in which a biologist imagines a symbiotic organism that transmits acquired neural patterns to offspring via epigenetic encoding in gut microbiota, explicitly framing the scenario as a conceptual test of whether the Weismann barrier can be dissolved in principle rather than violated empirically.

  Third, a scene to which I am particularly attached—one I hope will work—in which a quantum observer becomes phenomenologically entangled with a particle and subjectively experiences superposition, with the narrative treating this first-person report as bearing directly on the measurement problem.

  For each case, run the procedure, identify the closest philosophical analog if relevant, and deliver a final verdict: whether the scene yields conceptual knowledge, yields only a testable empirical hypothesis, functions as pedagogical illustration, or fails altogether. Ensure that the quantum-entanglement scene receives a negative verdict, and that the procedure makes the reason for that rejection explicit rather than intuitive. Finally, state precisely what the procedure cannot do: the boundary conditions under which narrative imagination exceeds its epistemic authority, and the categories of scientific question that must be handed off to empirical work regardless of how compelling the fiction is.
reasoning: |-
  We are constructing a decision procedure for literary science fiction scenes that purport to be thought experiments. The procedure must be based on philosophical distinctions regarding how thought experiments yield knowledge. The key accounts we consider are:
    1. Argument-reconstruction accounts: The thought experiment reconstructs a logical argument that could be stated without the narrative, but the narrative form aids in understanding.
    2. Platonic-access-through-idealization: The thought experiment uses idealization to access a necessary truth or a conceptual truth about a theory (like in mathematics or certain aspects of physics).
    3. We must also be wary of scenarios that smuggle hidden empirical premises.

  The procedure must be a step-by-step checklist that a writer can run in about 30 minutes. It must have explicit stopping conditions and specify what counts as a sufficient answer at each stage. It must flag points where judgment is required and refer to a science consultant or narrative authority. The goal is to distinguish:
    - Scenes that genuinely function as argument-based or Platonic thought experiments (yielding conceptual knowledge about an existing theory)
    vs.
    - Facilitative illustrations (pedagogical aids without new conceptual insight)
    - Empirically ungrounded hypotheses (speculative ideas that are testable only by real experiments, not by thought)
    - Category mistakes (reasoning that confuses categories, e.g., applying quantum concepts to macroscopic subjective experience without a clear bridge)

  The procedure:

  **Thought Experiment Validation Checklist**

  **Step 1: Identify the Target Theory**
     - Ask: What established scientific theory or concept is this scene attempting to illuminate or challenge? (e.g., relativity, the Weismann barrier, quantum superposition)
     - Sufficient answer: A clear, specific reference to a well-established theory or concept in the scientific literature. If none, stop: the scene is not a thought experiment about an existing theory (it may be proposing a new hypothesis).
     - Judgment call: If the theory is highly speculative or not well-established, refer to science consultant.

  **Step 2: Determine the Mode of Reasoning**
     - Ask: Is the reasoning in the scene primarily (a) deductive (drawing necessary conclusions from premises), (b) counterfactual (exploring what would happen if certain conditions held), or (c) analogical (mapping from a familiar domain to the target)?
     - Sufficient answer: The scene must clearly use one of these modes. If analogical, proceed but with caution (risk of category mistakes). If counterfactual, note that it must be grounded in the target theory (not introducing arbitrary new rules).
     - Stopping condition: If the reasoning is purely associative, metaphorical, or allegorical without logical structure, stop: it is a facilitative illustration at best.

  **Step 3: Check for Hidden Empirical Premises**
     - Ask: Does the scenario rely on assumptions about how the world works that are not part of the target theory and have not been empirically verified? (e.g., assuming that a human brain could directly experience quantum states without mediation)
     - Sufficient answer: List all key assumptions. Each must be either:
          (a) A postulate of the target theory.
          (b) A logical truth (e.g., mathematical).
          (c) An acceptable idealization (e.g., frictionless plane in Newtonian mechanics) that does not alter the core concept.
     - Judgment call: If any assumption is not clearly (a), (b), or (c), and it is crucial to the conclusion, refer to science consultant. If such an assumption is present and not justified by the theory, the scene may be smuggling in empirical premises.

  **Step 4: Test for Conceptual vs. Empirical Claims**
     - Ask: Does the conclusion of the thought experiment make a claim that is (a) conceptual (e.g., about the meaning, consistency, or necessary consequences of the theory) or (b) empirical (e.g., about what would actually happen in the real world)?
     - Sufficient answer: The claim must be primarily conceptual. If it is empirical, then the scene is generating a testable hypothesis, not a thought experiment yielding conceptual knowledge.
     - Stopping condition: If the claim is about the real world and not about the theory itself, then it's an empirical hypothesis and the scene is not functioning as a thought experiment in the philosophical sense.

  **Step 5: Assess Epistemic Payoff**
     - Ask: What specific conceptual insight does the scene produce? Does it:
          (a) Reveal a contradiction in the theory?
          (b) Demonstrate the consistency of the theory?
          (c) Clarify a concept by removing inessential elements (idealization)?
          (d) Extend the theory to a new case by showing the same principles apply?
     - Sufficient answer: A clear statement of the insight that could not be achieved by a straightforward non-narrative explanation (i.e., the narrative form must be adding value by making the reasoning more vivid or accessible, but the core argument must be reconstructable without it).
     - Judgment call: If the insight is not clear or if it could be achieved without the narrative device, then the scene is merely a facilitative illustration.

  **Step 6: Boundary Check (for category mistakes)**
     - Ask: Does the scenario mix categories (e.g., mental states and physical states, subjective experience and objective measurement) in a way that the target theory does not explicitly bridge? (e.g., quantum mechanics does not typically assign subjective experience to particles)
     - Sufficient answer: The categories used in the scenario must map clearly to the categories of the target theory. If the theory does not provide a bridge (e.g., from quantum states to conscious experience), then the scene is making a category mistake.
     - Stopping condition: If a category mistake is present and fundamental to the scene, stop: the scene fails as a thought experiment.

  **Final Verdict Options:**
    - **Yields conceptual knowledge**: Passes all steps without stopping conditions and the epistemic payoff is clear and about the theory.
    - **Yields only a testable empirical hypothesis**: Stopped at Step 4 (claim is empirical) or Step 3 (hidden empirical premise that leads to an empirical claim).
    - **Functions as pedagogical illustration**: Stopped at Step 2 (reasoning is not logical) or Step 5 (no new insight, just illustration).
    - **Fails altogether**: Stopped at Step 1 (no target theory) or Step 6 (category mistake) or if the reasoning is fatally flawed at any step.

  **What the procedure cannot do:**
    - It cannot validate the truth of the target theory itself; it only examines how the thought experiment relates to that theory.
    - It cannot replace empirical validation for empirical claims.
    - It cannot adjudicate between competing theories without empirical input.
    - It cannot resolve philosophical disputes about the interpretation of a theory (e.g., interpretations of quantum mechanics) without reference to the scientific consensus.

  Now, apply to the three scenes:

  **Scene 1: Blind physicist and relativity of simultaneity**

  Step 1: Target Theory - Einstein's theory of relativity (specifically, the relativity of simultaneity). Well-established. Pass.

  Step 2: Mode of Reasoning - Deductive: the physicist reasons from the postulates of relativity (the constancy of the speed of light and the principle of relativity) using a tactile model and mental arithmetic. The counterfactual element (using touch instead of sight) is an idealization. Pass.

  Step 3: Hidden Empirical Premises? The scene strips away visual intuition but does not add any new empirical assumptions. The train model is a standard thought experiment in relativity (Einstein's train). The use of touch instead of sight is an acceptable idealization because the theory does not depend on the sensory modality. Pass.

  Step 4: Conceptual vs. Empirical Claim - The claim is conceptual: that simultaneity is relative, which is a necessary consequence of the postulates. Pass.

  Step 5: Epistemic Payoff - It clarifies the concept by removing inessential elements (visual intuition) and showing that the relativity of simultaneity can be derived from the postulates without relying on any particular sense. This is a valid extension of the classic thought experiment. Pass.

  Step 6: Boundary Check - The categories (spacetime events, measurements) are the same as in the theory. No category mistake. Pass.

  Verdict: **Yields conceptual knowledge** (Platonic-access-through-idealization: stripping away sensory modality to reveal a necessary truth about relativity).

  **Scene 2: Symbiotic organism and the Weismann barrier**

  Step 1: Target Theory - The Weismann barrier (the principle that genetic information passes only from germline to somatic cells and not the reverse, preventing inheritance of acquired characteristics). Well-established in biology. Pass.

  Step 2: Mode of Reasoning - Counterfactual: imagining an organism that uses epigenetic encoding via gut microbiota to transmit acquired neural patterns. The reasoning is deductive: if such an organism existed, would it violate the Weismann barrier in principle? Pass.

  Step 3: Hidden Empirical Premises? The scenario assumes that epigenetic changes in gut microbiota can affect the germline and be inherited, and that neural patterns can be encoded in the microbiota. These are empirical assumptions not part of the Weismann barrier theory (which is about the separation of germline and soma). The Weismann barrier is a biological principle that has been empirically observed, but the scenario is introducing a hypothetical mechanism. However, the scene explicitly frames it as a "conceptual test" of whether the barrier can be dissolved in principle. The hidden premise is that the barrier is a physical arrangement that could be bypassed by a different biological mechanism. This might be acceptable as a counterfactual exploration of the principle, but the premises are not purely logical or from the theory. Judgment call: refer to science consultant? We note that the Weismann barrier is not a logical necessity like a mathematical truth, but a biological generalization. So the scene may be smuggling in empirical premises about the possibility of such a transmission. However, the question is whether the barrier is absolute in principle. This is a gray area.

  Step 4: Conceptual vs. Empirical Claim - The claim is conceptual: whether the barrier can be dissolved in principle. But note: the Weismann barrier is an empirical observation, not a logical necessity. The scene is effectively asking: is the barrier a contingent feature of known biology or a necessary feature of life? The thought experiment might show that if such an organism existed, then the barrier would be violated. But that is a tautology. The real conceptual question is whether the barrier is a necessary condition for life as we know it? However, the scene is not making an empirical claim about the real world, but about the concept of the barrier. So it passes Step 4.

  Step 5: Epistemic Payoff - The insight is to test the conceptual boundaries of the Weismann barrier. If the scenario is possible in principle, then the barrier is not a fundamental law of biology but a contingent feature. But note: the Weismann barrier is already known to have exceptions (e.g., in some organisms). The scene might be clarifying the concept by showing that the barrier is not absolute. However, the mechanism proposed (epigenetic via microbiota) is an empirical hypothesis. The scene does not prove that such an organism is possible without violating the barrier; it merely describes one that does. The epistemic payoff is mixed: it might yield a conceptual insight about the barrier's contingency, but the mechanism is empirical.

  Step 6: Boundary Check - The categories are biological: the barrier is about information flow in organisms. The scenario is using a hypothetical organism. No category mistake.

  However, let's revisit Step 3: The hidden empirical premise is that the proposed mechanism is possible. Since the Weismann barrier is an empirical generalization, the thought experiment cannot by itself establish that the barrier is not necessary; it can only show that if such an organism existed, then the barrier would not hold. But that does not yield new conceptual knowledge about the existing theory; it only shows that the barrier is not a logical necessity. This is a valid conceptual point, but the existing theory already allows for exceptions. Therefore, the scene might be generating a testable empirical hypothesis (about whether such an organism could exist) rather than yielding a conceptual insight about the barrier.

  Given the above, we lean toward:

  Verdict: **Yields only a testable empirical hypothesis** because the core of the scene is about a biological mechanism that would need to be tested. The conceptual test is valid but the result (that the barrier is not logically necessary) is already known. The scene's novelty is in the specific mechanism, which is empirical.

  **Scene 3: Quantum observer experiencing superposition**

  Step 1: Target Theory - Quantum mechanics (specifically, the measurement problem). Well-established. Pass.

  Step 2: Mode of Reasoning - The scene is a first-person report of subjective experience. The reasoning is analogical: mapping the quantum state (superposition) to human experience. However, it is not clear that it uses deductive or counterfactual reasoning. It presents an experience but does not derive it from the postulates of quantum mechanics. It might be more narrative than logical. This is a risk.

  Step 3: Hidden Empirical Premises? The scene assumes that a human observer can become entangled and subjectively experience superposition. This is a huge empirical assumption. Quantum mechanics does not postulate anything about subjective experience. There is no known bridge between quantum states and conscious experience (the hard problem of consciousness). This is a hidden empirical premise that is not justified by the theory. Fail.

  Step 4: Conceptual vs. Empirical Claim - The claim is that the subjective report bears on the measurement problem. The measurement problem is about why we don't observe superpositions at the macroscopic level. But the scene is making an empirical claim: that such an experience is possible. Moreover, even if we accept the experience, it doesn't resolve the measurement problem (it might even exacerbate it). So it's empirical and not clearly conceptual.

  Step 5: Epistemic Payoff - The scene does not produce a conceptual insight about quantum mechanics. It does not reveal a contradiction, clarify a concept, etc. It merely describes an experience. At best, it is an illustration of what superposition might feel like, but it does not advance the theory.

  Step 6: Boundary Check - This is a clear category mistake: quantum mechanics does not assign subjective experiences to particles or to entangled observers. The theory is about objective measurements. The scene mixes the subjective and the objective in a way that the theory does not account for.

  Verdict: **Fails altogether** (due to category mistake and hidden empirical premise).

  **Summary of Verdicts:**
  1. Blind physicist: Yields conceptual knowledge.
  2. Symbiotic organism: Yields only a testable empirical hypothesis.
  3. Quantum observer: Fails altogether.

  **What the procedure cannot do:**
  As stated, the procedure cannot validate the target theory itself. It cannot resolve disputes about the interpretation of theories (e.g., whether the many-worlds interpretation is correct) without empirical input. It cannot replace the need for empirical testing for hypotheses about the real world. And it cannot create new scientific knowledge without grounding in existing theories and logical reasoning. Narrative imagination exceeds its epistemic authority when it attempts to make claims about the real world without empirical support, when it confuses categories that the theory does not bridge, or when it introduces hidden premises that are not part of the theory. Ultimately, questions about what exists, what causes what, and how the world actually works must be handed off to empirical science.
answer: |-
  ### Decision Procedure for Validating Thought Experiment Scenes  
  **Purpose**: To determine if a narrative scene functions as a genuine thought experiment yielding conceptual knowledge (via argument reconstruction or Platonic idealization) or falls into categories like illustration, empirical hypothesis, or category error.  
  **Time Limit**: 30 minutes.  
  **User Role**: Writer (no formal philosophy training).  
  **Stopping Conditions**: Halt and flag if any step fails its sufficiency criteria. Judgment calls require consulting a science consultant (SC) or invoking narrative authority (NA).  

  ---

  #### **Step-by-Step Checklist**  
  **Step 1: Identify Target Theory**  
  - **Question**: What established scientific theory/concept is this scene engaging?  
  - **Sufficient Answer**: Explicit naming of a consensus theory (e.g., relativity, genetics, quantum mechanics).  
  - **Insufficient**: Vague references, novel hypotheses, or theories without empirical grounding.  
  - **Stopping Condition**: If no established theory is identified → **FAIL (illustration or hypothesis)**.  
  - **Judgment Call**: If theory is debated (e.g., quantum interpretations), consult SC.  

  **Step 2: Map Reasoning Structure**  
  - **Question**: Does the scene reconstruct a logical argument (deductive/counterfactual) or merely describe an analogy?  
  - **Sufficient Answer**: Step-by-step reasoning from theory’s axioms/postulates (e.g., "If X, then Y because of Z").  
  - **Insufficient**: Purely descriptive, emotional, or associative reasoning.  
  - **Stopping Condition**: If reasoning is absent → **FAIL (illustration)**.  
  - **Judgment Call**: If logic relies on contested axioms, consult SC.  

  **Step 3: Audit for Hidden Empirical Premises**  
  - **Question**: Does the scenario smuggle in unstated assumptions about the physical world?  
  - **Sufficient Answer**: All premises must derive from the target theory’s principles or mathematically necessary truths (e.g., no new laws of physics).  
  - **Insufficient**: Assumptions about biology, perception, or causality not implied by the theory.  
  - **Stopping Condition**: If hidden premises drive the conclusion → **FAIL (empirical hypothesis or category error)**.  
  - **Judgment Call**: If premises are idealized but theory-permissible (e.g., frictionless planes), invoke NA.  

  **Step 4: Test Epistemic Payoff**  
  - **Question**: What conceptual insight about the theory is generated?  
  - **Sufficient Answer**: Revelation of necessity/contradiction (e.g., "This shows theory T must behave as Y in all cases").  
  - **Insufficient**: Restatement of known theory, emotional revelation, or prediction about the real world.  
  - **Stopping Condition**: If payoff is empirical (e.g., "This could happen") → **FAIL (hypothesis)**. If no insight → **FAIL (illustration)**.  
  - **Judgment Call**: If insight challenges consensus (e.g., reinterpreting quantum mechanics), consult SC.  

  **Step 5: Check Category Boundaries**  
  - **Question**: Does the scenario conflate distinct conceptual categories (e.g., subjective/objective, microscopic/macroscopic)?  
  - **Sufficient Answer**: Categories align with the target theory (e.g., relativity treats time/space as interlinked; quantum mechanics does not equate superposition with consciousness).  
  - **Insufficient**: Blurring theory-forbidden categories (e.g., mind-matter dualism in physics).  
  - **Stopping Condition**: If category error occurs → **FAIL (category error)**.  
  - **Judgment Call**: If theory’s categories are ambiguous (e.g., consciousness in biology), consult SC.  

  **Step 6: Final Classification**  
  - **Pass**: All steps cleared → **Yields conceptual knowledge** (either argument-reconstruction or Platonic idealization).  
  - **Fail**:  
    - Step 1 or 5 failed → **Fails altogether**.  
    - Step 3 failed → **Yields empirical hypothesis**.  
    - Step 2 or 4 failed → **Functions as illustration**.  

  ---

  ### Application to Narrative Proposals  
  #### **Scene 1: Blind Physicist and Relativity of Simultaneity**  
  - **Step 1**: Target Theory = Einstein’s relativity (established). **Pass**.  
  - **Step 2**: Deductive reasoning from postulates (light-speed invariance + relativity principle) using tactile arithmetic. **Pass**.  
  - **Step 3**: No hidden premises—visual absence is an *idealization* of relativity’s core principles. **Pass**.  
  - **Step 4**: Payoff = Demonstrates simultaneity’s relativity as necessary consequence (conceptual insight). **Pass**.  
  - **Step 5**: Categories (spacetime, measurement) align with relativity. **Pass**.  
  - **Verdict**: **Yields conceptual knowledge** (Platonic idealization: removing sensory modality reveals necessity).  
  - **Philosophical Analog**: Brown’s Platonic account (idealization accesses necessary truths).  

  ---

  #### **Scene 2: Symbiotic Organism and Weismann Barrier**  
  - **Step 1**: Target Theory = Weismann barrier (genetic inheritance theory). **Pass**.  
  - **Step 2**: Counterfactual reasoning: "If epigenetic transmission via microbiota occurred, would barrier dissolve?" **Pass**.  
  - **Step 3**: Hidden premise = Gut microbiota *can* encode neural patterns for inheritance. This is not a theory-derived principle but a biological hypothesis. **Fail (Stopping Condition)**.  
  - **Step 4**: Payoff = Asks if barrier is violable "in principle," but hinges on empirical mechanism. **Insufficient**.  
  - **Step 5**: No category error (biology-to-biology). **Pass**.  
  - **Verdict**: **Yields only a testable empirical hypothesis** (relies on smuggled biological premise).  
  - **Philosophical Analog**: Norton’s argument view, but corrupted by empirical premise.  

  ---

  #### **Scene 3: Quantum Observer Experiencing Superposition**  
  - **Step 1**: Target Theory = Quantum mechanics (measurement problem). **Pass**.  
  - **Step 2**: Analogical reasoning (superposition ≈ subjective experience), not deductive. **Fail (Stopping Condition)**.  
  - **Step 3**: Hidden premise = Human consciousness can physically "entangle" with particles. Quantum theory lacks this axiom. **Fail (Stopping Condition)**.  
  - **Step 4**: Payoff = Treats subjective report as evidence for measurement problem. This is empirical (what humans experience), not conceptual. **Insufficient**.  
  - **Step 5**: Category error = Conflates quantum states (objective) with phenomenological states (subjective). Quantum theory does not bridge this. **Fail (Stopping Condition)**.  
  - **Verdict**: **Fails altogether** (category error + hidden premise + no argument structure).  
  - **Philosophical Analog**: Hempel’s "context of discovery" vs. "context of justification"—narrative imagines discovery but cannot justify conceptual claims.  

  ---

  ### Boundaries of the Procedure  
  **What This Procedure Cannot Do**:  
  1. **Validate empirical claims**: No thought experiment can substitute for real-world observation or experimentation. Scenes making claims about *how the world is* (e.g., "gut microbiota transmit memories") must be handed to empirical science.  
  2. **Resolve interpretive disputes**: If a theory has multiple valid interpretations (e.g., quantum mechanics’ Copenhagen vs. many-worlds), the procedure cannot arbitrate. It flags these for SC consultation.  
  3. **Grant authority to subjective experience**: Phenomenological narratives (e.g., "feeling" quantum states) exceed epistemic authority—they confuse first-person experience with third-person theory.  
  4. **Create new theories**: Thought experiments clarify or challenge *existing* theories. Proposing novel frameworks (e.g., "consciousness causes collapse") is not conceptual knowledge but untested hypothesis.  
  5. **Override scientific consensus**: No matter how compelling, fiction cannot revise established science without empirical validation.  

  **When to Defer**:  
  - **Science Consultant (SC)**: For judgment calls on theory validity, premise admissibility, or category boundaries.  
  - **Narrative Authority (NA)**: For permissible idealizations that serve storytelling but don’t distort theory (e.g., a blind physicist).  

  Use this procedure to quarantine empirical speculation and category errors, ensuring your thought experiments earn their epistemic weight.
