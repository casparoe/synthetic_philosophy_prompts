prompt: |-
  Hey, I'm a retired condensed-matter phyisicist who just started dabbling in philosophy after retirement — my grandkid sent me a youtub link about quantum foundations and now I'm hooked. I'm trying to wrap my head around whether the wavefunction is literally real (psi-ontic) or just represents our ignorance (psi-epistemic), but every explanation I read stops at the PBR theorem and doesn't tell me what a real answer should actually cover. So I want the full desiderata: what must any decent theory of wavefunction ontology actually deliver?

  Specifically, give me the requirements list with the reasoning behind each: the quantum phenomena it needs to account for (interference, measurement outcomes, and also those messy intermediate cases where decoherence is only partial, like with large molecules in double-slit type experiments); the conceptual distinctions it must preserve (e.g., not collapsing the difference between 'we don't know the state' and 'there is no definite state', or between global and local descriptions); and the formal results it can't violate (unitarity, no-signaling, etc.). For each one, explain why it's a hard constraint versus just a preference. Then tell me which single requirement eliminates the biggest chunk of existing views — I'm guessing it's the partial-decoherence one, but I want your take. Also, is there any negotiable item? Like, could a theory just shrug and say 'shut up and calculate' for the mesoscopic regime and still count? A table is okay, but keep it casual — I'm not writing a paper, just trying to organize my thoughts.
reasoning: |-
  Okay, let me unpack this retired physicist's query. He's transitioning from condensed matter to quantum foundations, hooked by a YouTube video from his grandkid. The core question is about wavefunction ontology - what makes a theory legitimately address whether the wavefunction is real (psi-ontic) or epistemic (just knowledge).

  First, I need to identify his actual needs. He explicitly asks for desiderata: what any theory must deliver. But reading between the lines, he's frustrated with superficial treatments that stop at PBR without deeper analysis. As an experienced scientist, he wants systematic rigor - hence requesting requirements categorized by phenomena, conceptual distinctions, and formal constraints.

  His specific pain points are telling: he mentions "messy intermediate cases" (partial decoherence) and conceptual nuances like distinguishing ignorance from indefiniteness. This suggests he's spotted weaknesses in popular interpretations. When he guesses partial decoherence is the biggest eliminator of theories, he's revealing his intuition that many frameworks fail at the mesoscopic scale.

  The challenge is structuring this coherently. I'll need to:
  - Cover quantum phenomena exhaustively (interference, measurement, partial decoherence)
  - Clarify conceptual boundaries (ontology vs epistemology, locality issues)
  - Anchor to non-negotiable formalisms (unitarity, no-signaling)
  - Then ruthlessly evaluate which requirement is most constraining

  For the negotiable aspect - his "shut up and calculate" question - I suspect he's probing whether instrumentalism is viable despite being philosophically unsatisfying. That needs careful handling: acknowledging pragmatic utility while noting ontological limitations.

  The tone must stay conversational ("casual" as requested) but with precision befitting a physicist. No dumbing down - he'll spot hand-waving. The table suggestion is useful for organization, but I'll keep it minimal and embed reasoning in text.

  Hmm... biggest hurdle? Partial decoherence indeed cripples many interpretations. Copenhagen struggles with system-boundary arbitrariness; dynamical collapse models get fuzzy with scaling; even Bohmian mechanics gets gnarly with many-body decoherence. Only relative-state approaches handle it cleanly, but they have other costs (multiverse baggage). That's likely the key insight he wants.

  For negotiables... yes, one can temporarily bracket mesoscopic cases if the theory is explicit about its domain. But it's a band-aid - true ontological clarity requires full coverage. I'll position this as a "patchable gap" versus "fatal flaw".
answer: |-
  You've hit the nail on the head – the PBR theorem (while important) is just *one* hurdle, and the real challenge is building a *complete* ontological framework that doesn't crumble under scrutiny. As a condensed-matter physicist, you know messy regimes are where theories show their true colors. Here's the breakdown of what any serious contender for "what the wavefunction represents" **must** deliver, categorized and reasoned:

  **The Non-Negotiable Desiderata:**

  | Requirement                  | Why it's Essential                                                                                                                               | Hard Constraint? | Why Hard?                                                                                                  |
  | :--------------------------- | :----------------------------------------------------------------------------------------------------------------------------------------------- | :--------------- | :--------------------------------------------------------------------------------------------------------- |
  | **1. Reproduce Born Rule Statistics** | Foundational: Predicts all observed quantum probabilities (detection patterns, scattering cross-sections, energy levels). Without this, it's not QM. | YES              | Direct empirical evidence. Failure means falsification by experiment.                                       |
  | **2. Account for Interference Phenomena** | Core QM signature: Explain superposition effects (double-slit, Rabi oscillations, Josephson junctions). Must handle phases coherently.             | YES              | Defines quantum behavior vs classical. Non-interference = classical probability.                           |
  | **3. Resolve the Measurement Problem** | Explains why definite outcomes occur *at all* when the formalism suggests superpositions persist (Schrödinger's cat).                            | YES              | Connects formalism to macroscopic reality. Avoids contradictions (cat alive AND dead).                     |
  | **4. Handle Partial Decoherence** | Real-world QM: Must describe systems where coherence is fragile but not destroyed (large molecules, SQUIDs, pre-measurement apparatus).           | YES              | Tests realism vs. "measurement magic." Shows how classicality *emerges*. Where many interpretations fail.  |
  | **5. Preserve Unitarity (or Explain Apparent Violation)** | Fundamental QM dynamics: Time evolution is deterministic & reversible (Schrödinger eq). "Collapse" must be justified or emergent.                | YES              | Violation implies information loss/faster-than-light signalling conflicts with relativity.                 |
  | **6. Enforce No-Signaling** | Relativity requirement: Cannot use entanglement to send messages faster than light (Bell pairs).                                                | YES              | Violation contradicts Special Relativity (causality). Experimentally verified.                             |
  | **7. Distinguish Ontic Indefiniteness from Epistemic Ignorance** | Conceptual clarity: Must *not* equate "system has no definite property" with "we don't know which definite property it has."                  | YES              | PBR & contextuality theorems show these *cannot* be the same. Core to quantum weirdness.                   |
  | **8. Maintain Locality/Causality (Appropriately)** | Relativity + Clarity: Must clarify if influences are local (only nearby events affect) or non-local (but *not* signalling!).                     | YES              | Non-local correlations (entanglement) exist, but *signalling* non-locality is forbidden by relativity.     |
  | **9. Provide Consistent Ontology Across Scales** | Coherence: What exists (waves, particles, fields, histories?) must be defined consistently from qubits to cats. No arbitrary cutoffs.             | Largely YES      | Without this, partial decoherence handling fails & theory becomes ad-hoc ("shut up" territory).            |

  **The Crucial Breakdown:**

  1.  **Partial Decoherence is the Executioner:** You're right. This requirement **eliminates the biggest chunk of existing views.**
      *   **Collapse Models (GRW, CSL):** Struggle to define the "collapse threshold" precisely enough to match the smooth, environment-dependent, size-dependent decoherence we observe in mesoscopic systems without appearing arbitrary or conflicting with precision experiments.
      *   **Copenhagen (& Friends):** Relies heavily on an ill-defined "classical apparatus" or "measurement" concept. Partial decoherence *blurs the line* between "quantum system" and "classical apparatus" – where does the "collapse" happen for a 1000-atom molecule showing partial interference? It highlights the arbitrariness of the Heisenberg cut.
      *   **QBism/Neo-Copenhagen (Purely Epistemic):** Can *describe* the statistics, but struggles to explain *why* partial decoherence *looks* like the system is objectively losing coherence in a specific way, independent of any single agent's knowledge, and how this mesoscopic objectivity emerges purely from belief updating.
      *   **Bohmian Mechanics:** *Can* handle it in principle (the wavefunction guides particles even in decohered branches), but the ontology becomes incredibly complex – the "empty" branches of the wavefunction still exist and are part of the guiding dynamics, yet correspond to nothing tangible in the particle configuration. The "reality" of the full multi-branched wavefunction vs. the single particle path feels strained here.
      *   **Winners (or Survivors):** **Everettian (Many-Worlds) interpretations** handle this most naturally – decoherence *is* the process of branch formation. Different degrees of decoherence just mean different degrees of branch separation/interference potential. **Relational/Contextual interpretations** (like RQM) can also handle it by making outcomes relative to specific interactions/decohering environments.

  2.  **The (Potentially) Negotiable Item: Mesoscopic Shrugging?**
      *   **Can a theory get away with it?** Technically, *temporarily*, **yes, but at a significant cost.** If a theory cleanly handles the fully quantum (microscopic) and fully classical (macroscopic) limits *and* provides a *principled, non-arbitrary reason* why a specific mesoscopic regime is currently intractable or requires approximation, it might survive as a pragmatic tool.
      *   **The Cost:** It significantly weakens its claim to being a fundamental *ontological* theory. It essentially admits: "Our description of *what fundamentally exists* breaks down precisely in the regime we are actively exploring experimentally (large molecules, superconducting qubits approaching macroscopicity)." This relegates it to instrumentalism ("shut up and calculate") for a crucial frontier. It doesn't *falsify* the theory, but it makes it philosophically unsatisfying and incomplete as an ontology.
      *   **Who Might Try?** Collapse models might point to technological limitations in testing their specific parameters at mesoscopic scales. Some hidden variable theories might struggle computationally. But it's a band-aid, not a solution.

  **Why the Other Constraints Bite:**

  *   **Distinguishing Indefiniteness/Ignorance:** This is why purely epistemic views (where the wavefunction *only* represents ignorance about a pre-existing definite state) are killed by PBR & contextuality (Kochen-Specker). QM forces us to acknowledge that indefiniteness is real, not just unknown.
  *   **Unitarity/No-Signalling:** These are bedrock principles tied to relativity and information conservation. Violating them leads to paradoxes. Theories must either preserve them strictly (Everett, Bohm with universal wavefunction) or explain the *appearance* of violation (collapse models - though this is contentious).
  *   **Consistent Ontology:** Prevents "cartoon ontologies" that only work for toy models. If your theory says particles have definite paths guided by a wave in a double-slit with electrons, it must also tell you what exists *exactly* in a partially decohered Bose-Einstein condensate or a quantum computer chip. Vagueness here often hides unresolved problems.

  **In Summary for Your Thoughts:**

  1.  **Must-Haves:** Born Rule, Interference, Measurement Resolution, Partial Decoherence Handling, Unitarity (or justification), No-Signalling, Clear Indefiniteness/Ignorance Split, Locality Clarification, Scale Consistency.
  2.  **Executioner's Axe:** **Partial Decoherence.** It exposes the cracks in interpretations relying on arbitrary cuts, ill-defined collapses, or purely subjective knowledge.
  3.  **The Negotiable Hole (if you dare):** A theory can *temporarily* lack a clean mesoscopic ontological picture, but it's a major philosophical wound and admits incompleteness. It's a patch, not a feature. A true fundamental ontology shouldn't need it.

  The quest is finding an ontology that *naturally* flows from the micro to the macro, with decoherence being a *consequence* of the dynamics and ontology, not a *trigger* for an ad-hoc change in the rules (like collapse). It's tough, which is why we're still arguing 100 years on! Enjoy the dive – the messiness is where the fun (and frustration) lies.
