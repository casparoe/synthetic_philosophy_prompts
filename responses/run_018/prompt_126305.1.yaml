reasoning: |-
  Hmm, the user wants me to act as a political theorist analyzing voting systems' vulnerability to strategic candidate entry. They've described a specific four-candidate circular preference scenario where a non-viable fifth candidate enters to split votes for candidate A.

  I need to rank Borda Count, Instant-Runoff Voting (IRV), and Condorcet-consistent pairwise comparison based on robustness against this manipulation. The key vulnerability here is the preference cycle that creates instability - the circular rankings mean no clear majority winner exists inherently.

