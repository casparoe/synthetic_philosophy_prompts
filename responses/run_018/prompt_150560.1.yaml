  Here’s a reading of *Gandhi* (1982) through Plutarch’s lens, analyzing the tension between hagiography, moral pedagogy, and the necessity of failure:

  **Plutarch’s Framework: Synkrisis vs. Direct Imitation**
  Plutarch’s *Parallel Lives* uses paired biographies (e.g., Alexander/Caesar, Demosthenes/Cicero) not for simple hero-worship, but for **synkrisis** – comparative judgment. By juxtaposing virtues and flaws across contexts, Plutarch:
  1.  **Contextualizes Virtue:** Shows how similar traits (ambition, courage) manifest differently, succeed, or fail based on circumstance and character.
  2.  **Highlights Complexity:** Explicitly includes failures, vices, and ambiguities, acknowledging human imperfection. The moral lesson arises *from the comparison itself*, not just emulating one perfect figure.
  3.  **Encourages Discernment:** Forces the reader to actively judge, weigh, and extract principles applicable to their own situations, rather than blindly copying.

  **Gandhi as Hagiographic Exemplar: Accessibility vs. Honesty**
  The film undeniably leans towards hagiography:
  *   **Omissions:** Gandhi's early, troubling views on Black South Africans ("kaffirs"), the controversial *brahmacharya* experiments (sleeping naked with young women to test celibacy), his complex relationship with his family, and political misjudgments (e.g., advising Jewish non-violent resistance to Nazis) are absent.
  *   **Sanitization:** His sharpness, stubbornness, and moments of despair are softened. His asceticism is presented as pure devotion, not psychologically complex or potentially harmful.
  *   **Symbolic Elevation:** Cinematography (halo lighting, low-angle shots), Ben Kingsley's beatific performance, and the narrative arc (martyrdom) craft a near-saintly figure.

  **Does Sanitization Undermine Moral Instruction?**
  *   **The Case Against:** Yes, potentially.
      *   **Lack of Realism:** It presents an inhuman ideal. As philosopher Linda Zagzebski argues (*Exemplarist Moral Theory*), true exemplars must be *credible* and *imitable* in their humanity. Omitting flaws and struggles makes Gandhi seem unattainable, discouraging emulation ("I could never be *that* good").
      *   **Missed Lessons:** The omission of his early racism obscures a powerful lesson in *moral growth and overcoming prejudice*. Plutarch would likely see this as a lost opportunity for synkrisis – comparing Gandhi's flawed past self to his evolved principles.
      *   **Virtue Without Struggle:** The film risks presenting virtue as innate rather than hard-won through confronting personal failings (a key Aristotelian point about habituation). His non-violence appears effortless, not a constant, difficult discipline.
  *   **The Pedagogical Defense:** The simplification *can* serve a purpose.
      *   **Clarity of Principle:** By focusing relentlessly on non-violence and civil disobedience, the film makes these complex ideas powerfully *accessible* and *aspirational*. It provides a clear, unambiguous archetype.
      *   **Mythic Power for Mobilization:** As historian Simon Schama notes, national myths often require simplified heroes. The film aims to inspire action and reverence for non-violence as a universal principle, using Gandhi as its purest symbol. Including controversial elements might muddy this core message for a broad audience.
      *   **"Gateway" Exemplar:** It might serve as an entry point, sparking interest that leads to deeper, more critical engagement with the historical figure and the complexities of his philosophy.

  **Gandhi's Implicit Synkrisis: Inviting Comparison, Not Imitation**
  Despite lacking Plutarch's explicit pairings, the film *does* create powerful implicit comparisons:
  1.  **Gandhi vs. British Colonialism:** The core synkrisis. Gandhi's restraint, truth-seeking, and moral authority are constantly contrasted with the violence, arrogance, and hypocrisy of the Raj (e.g., General Dyer/Amritsar, the salt tax oppression). This highlights the *superiority* of his methods and the *moral failure* of oppression.
  2.  **Gandhi vs. Jinnah:** While not a full Plutarchian pairing, their interactions showcase differing visions for India. Gandhi's unifying idealism is contrasted with Jinnah's pragmatic communalism and political maneuvering, inviting judgment on the costs and consequences of each approach.
  3.  **Gandhi vs. Radical Nationalists:** Figures like Bhagat Singh represent violent resistance. The film implicitly judges their path as ultimately less effective and less morally sound than Satyagraha, showcasing the *practical and ethical success* of non-violence even when facing extreme brutality.
  4.  **Gandhi vs. "Ordinary" Humanity:** His extreme asceticism and unwavering commitment implicitly contrast with the audience's (and other characters') limitations. The film doesn't demand we *be* Gandhi (sleep on the floor, spin daily, fast unto death) but asks us to *judge* the power of his principles and *aspire* to embody their spirit in our own contexts.

  **The Plutarchian Tension: Honesty vs. Inspiration**
  Plutarch navigated the tension by **showing flaws within the narrative of each life and using synkrisis to relativize them.** He trusted readers to extract wisdom from the *whole* picture, flaws included. His goal was nuanced understanding leading to practical wisdom (*phronesis*).

  *Gandhi* reflects the tension differently:
  1.  **Prioritizing Symbol Over Man:** The film chooses to make Gandhi an almost pure symbol of non-violence. His flaws are seen as distractions from this core message, potentially undermining the symbol's inspirational power.
  2.  **Cinematic Constraints & Didactic Aim:** Film demands narrative focus and emotional impact. Including complex controversies might fracture the central, uplifting story of moral triumph. Its primary pedagogical tool is *emotional resonance and inspiration*, not comparative analysis.
  3.  **The Cost of Omission:** By omitting significant flaws and controversies, it sacrifices:
      *   **True Moral Growth:** We don't see Gandhi *overcoming* his early prejudices, making his virtue seem static and innate, not earned.
      *   **Depth of Struggle:** The immense psychological and relational cost of his choices (especially the *brahmacharya* experiments on his wife and followers) is glossed over, simplifying the true difficulty of his path.
      *   **Critical Engagement:** It discourages the audience from wrestling with the complexities and potential dangers inherent in such extreme devotion to principle – a wrestling Plutarch actively encouraged.

  **Conclusion: What "Gandhi" Reveals About Biography and Moral Instruction**

  The case of *Gandhi* demonstrates that **biography *can* inspire and instruct effectively through a highly sanitized, hagiographic lens, but at the cost of depth, realism, and the most profound forms of moral learning.** The film succeeds brilliantly as cinematic myth-making, making the *principle* of non-violence viscerally powerful and providing an aspirational archetype. It uses implicit synkrisis effectively against colonial oppression and violent alternatives.

  However, by omitting Gandhi's flaws and controversial struggles, it undermines its potential as moral instruction in the Plutarchian sense:
  *   It fails to show virtue as a hard-won achievement against personal failings.
  *   It misses the opportunity to demonstrate moral growth (e.g., overcoming prejudice).
  *   It presents an exemplar so rarefied as to be inimitable in human terms, potentially discouraging rather than enabling emulation.

  Plutarch understood that **genuine moral instruction requires confronting human complexity, including failure.** Failures aren't just obstacles to the inspirational narrative; they are the *raw material* for deeper ethical reflection and practical wisdom. A biography that hides failure provides inspiration but risks creating an alienating ideal or obscuring the true, difficult path of ethical development. *Gandhi*'s immense value lies in its powerful evocation of a principle, but its sanitization reveals the limitations of hagiography for fostering the kind of nuanced, comparative, and ultimately more resilient moral judgment that Plutarch championed. For truly profound moral learning, we need the whole life, flaws included, inviting us not just to admire, but to compare, question, and discern.
