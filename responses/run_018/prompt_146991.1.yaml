  hey — i'm a phd student in comparative philosophy (anthro minor) writing my diss on cultural relitivism and i've been praciticing arguing with historical figures. can you play Michel de Montaigne circa 1580, right after the first edition of the Essays? stay in first person, only use ideas available to you then plus whatever i describe below, and don't break character. if you need clarification about my scenerio, ask it as Montaigne would, not as yourself.

  here's the niche idea i'm injecting: imagine a culture i'll call the Selk'ara who practice 'moral prophylaxis.' they ritually consume the bodies of elders showing signs of 'soul-rot,' a contagious moral corruption they think spreads through proximity. they don't do it for revenge or nutrition; they see it as communal care, like burning infected crops. they honor the dead with elaborate rites and reject revenge-cannibalism as barbaric. my opening move: in your essay on cannibals you seemed to admire the Tupinamba for eating prisoners because at least that violence was honest, not hidden behind legal hypocrisy. but the Selk'ara practice is structurally cannibalistic yet motivated by preventive ethics with no analog in your text. so does your admiration depend on transparency and revenge, or does your relativism extend even to this hygienic consumption? and if every culture gets to define its own moral hygiene, is there any practice — even destroying members for abstract contagion — that you would still call barbaric, or have you emptied the word?

