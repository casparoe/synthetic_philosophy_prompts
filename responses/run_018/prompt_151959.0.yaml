answer: |-
  You've pinpointed a critically important and distinct mechanism within democratic backsliding. While often bundled under broader terms, this **systematic targeting of state institutions responsible for generating authoritative, neutral data** deserves specific recognition. Here's the analysis:

  1.  **Is there an established name?**
      *   **No single, universally accepted term exists** solely for this precise phenomenon. It's frequently described as *part* of institutional erosion, epistemic attacks, or the creation of an "alternative reality" by illiberal regimes. Terms like "truth decay" or "epistemic crisis" capture the *outcome* (loss of shared facts) but not the specific *mechanism* of dismantling state data infrastructure.

  2.  **Coining a Precise Term & Definition:**
      *   **Term:** **Factual Infrastructure Dismantling (FID)**
      *   **Definition:** The deliberate, systematic strategy by a governing power to weaken, subvert, capture, or abolish independent state institutions specifically tasked with producing and verifying non-partisan, empirical data essential for public accountability and policy-making (e.g., statistical offices, electoral commissions, audit institutions, census bureaus, environmental agencies).
      *   **Purpose:** To erode the possibility of consensus on objective reality, thereby disabling evidence-based critique, masking policy failures, facilitating corruption, manipulating electoral processes, and shifting political disputes into realms where power and narrative dominate over verifiable facts.
      *   **Edges & Boundaries:**
          *   **Core:** Attacks on *state* institutions with a *formal mandate* to produce *official statistics and verification* for public governance (e.g., Hungary's Central Statistical Office, Poland's State Electoral Commission, Turkey's statistical institute TÜİK, undermining the US Census Bureau's independence).
          *   **Distinct from Broader Institutional Capture:** While related, FID specifically targets the *knowledge-production and verification* functions of the state, not just the adjudicative (courts) or legislative functions. It attacks the *inputs* for accountability and rational policymaking.
          *   **Universities & Independent Media:** These are **adjacent but distinct targets**. Attacks on universities (especially social sciences) and independent media *complement* FID by undermining *broader* knowledge production and dissemination. However, FID focuses specifically on the *state's own apparatus* for establishing the official factual baseline upon which governance and accountability *formally* rely. Including them under FID risks diluting the core concept, though they are part of a wider "epistemic assault".
          *   **Not Just Budget Cuts:** Requires evidence of *intentional* subversion to undermine neutrality and reliability, not just neglect or austerity.

  3.  **Distinction from Ordinary Institutional Capture:**
      *   **Ordinary Institutional Capture:** Involves taking control of institutions (like courts, regulators, or ministries) to bias their *decisions and enforcement* in favour of the ruling party or its allies. The *institution's function* often continues, albeit corruptly.
      *   **Factual Infrastructure Dismantling (FID):** Targets the *credibility and very existence* of institutions that *generate the foundational data* upon which other institutions (including captured ones) and public discourse *depend*. It aims to destroy the *neutral arbiter of fact* itself. It's about disabling the *measurement* of reality, making capture harder to detect and critique. It fundamentally undermines the possibility of evidence-based governance and accountability *at its source*.

  4.  **Analytic Usefulness:**
      *   **Highly Useful:** FID is a crucial analytic category because:
          *   **Specific Mechanism:** It isolates a distinct and potent tactic within the backsliding toolkit.
          *   **Early Warning Sign:** Attacks on data institutions often precede or accompany more visible erosions (like court-packing), serving as an early indicator.
          *   **Profound Impact:** It directly attacks the possibility of rational policymaking, public accountability, and informed democratic discourse. Without agreed facts, democracy cannot function.
          *   **Facilitates Other Erosion:** By destroying the scoreboard, it makes electoral manipulation, corruption, and human rights abuses harder to prove and challenge.
          *   **Empirical Basis:** Documented cases in Hungary (stats office, undermining academic freedom *in state-funded research*), Poland (electoral commission, stats), Turkey (stats, electoral oversight), and the US (Census, undermining trust in electoral counts, attacking scientific agencies) provide clear evidence.
      *   **Partisan Risk Mitigation:** While accusations *can* be used politically ("They're just attacking our facts!"), FID as a concept relies on *observable actions*:
          *   Defunding/data access restrictions for statistical bodies.
          *   Replacing technical heads with political loyalists.
          *   Legislative changes reducing independence/mandate.
          *   Smearing or intimidating staff.
          *   Politicising the release/interpretation of data.
          *   Creating parallel, partisan "data" sources.
          Focusing on these concrete actions against *specific types of institutions* provides an objective basis, distinguishing it from mere partisan complaints about unfavourable *results*.

