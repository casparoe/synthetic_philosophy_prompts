answer: |-
  Here's the breakdown of the corporation analogy for material constitution:

  **The Correspondence Table (~200 words):**

  *   **Corporation = Statue:** The enduring entity whose identity is in question.
  *   **Employees = Clay Particles:** The constituent parts that compose the entity at any given time.
  *   **Firing/Hiring = Losing/Gaining Atoms:** The process by which constituent parts change over time.
  *   **Roles/Contracts = Arrangement/Form:** The specific organization or structure imposed on the parts that defines the entity *as* that entity (e.g., "statue-wise" or "corporation-wise").
  *   **Core Claim:** Just as replacing all employees over time doesn't destroy the corporation (it persists through part replacement), replacing all the clay atoms over time (e.g., through slow erosion/dusting/replacement) wouldn't destroy the statue. The corporation *is* just the employees organized under contracts/roles; similarly, the statue *is* just the clay arranged statue-wise. There's no "ghost corporation" over and above the employees, just as there's no "ghost statue" over and above the clay. Survival depends on maintaining the essential organization/function, not the specific parts.

  **Where the Mapping Breaks (~250 words):**

  The analogy stumbles at critical points:

  1.  **"Firing" vs. Passive Change:** A corporation *actively manages* its parts (hires/fires). The statue doesn't actively recruit or fire atoms; atoms are gained/lost through passive physical processes (erosion, absorption). This difference matters for claims about agency and control over persistence conditions.
  2.  **Membership Criteria:** Corporate identity hinges on *formal, conventional rules* (legal contracts, bylaws, registration) defining membership. The statue's persistence rests on *physical continuity* and *maintenance of form*. While we might *say* "the statue survives gradual atom replacement," this is far less clear-cut than corporate survival through employee turnover. Does the statue survive if *all* its atoms are replaced *instantly*? The corporate analogy suggests "yes," but this is a major point of contention in metaphysics (the "Ship of Theseus" problem), unlike the corporate case where legal continuity provides a clear answer.
  3.  **Co-location & Distinctness:** Crucially, the statue and the lump of clay *occupy the exact same space at the same time*. The corporation and its employees do *not*. The corporation is an abstract, legally constructed entity; the employees are concrete biological entities. The problem of material constitution arises *because* the statue and the lump seem to be two distinct things (with different persistence conditions – the lump survives squashing, the statue doesn't) occupying the same location. The corporate analogy completely sidesteps this fundamental issue of co-located distinct objects by mapping to entities existing on different ontological levels (abstract vs. concrete).
  4.  **Temporary Parts:** If atoms are merely "borrowed" temporary parts, does the statue cease to exist when the *last* original atom is replaced? The corporation analogy suggests continuity persists as long as the *role* (position) is filled, regardless of the specific individual. But applying this strictly to atoms implies the statue is *only* the current arrangement, a fleeting event, undermining the intuition of it being a persistent object. Corporations leverage legal abstraction to maintain identity *despite* this; physical objects lack such a mechanism.

  **What's Being Smuggled In (~150 words):**

  The analogy quietly assumes:

  1.  **Functional Organization Suffices:** It assumes that maintaining the *functional role* or *organizational structure* (contracts/roles for corps, spatial form for statues) is *sufficient* for the persistence of an object through part replacement. This is precisely what is contested in the statue/clay case – pluralists argue the *specific matter* (or its continuous history) matters more fundamentally for physical objects than the analogy implies.
  2.  **Denial of Co-location:** By mapping to entities on different levels (abstract corp vs. concrete employees), the analogy implicitly denies the problem of two distinct *concrete* objects (statue and lump) occupying the same space at the same time. It assumes away the core puzzle.
  3.  **Intentionality of Replacement:** It subtly imports the idea of an underlying system (legal framework) *governing* part replacement, which doesn't exist for the statue, making part replacement seem more identity-preserving than it might be for inert matter.

  **Does Her Conclusion Survive? (~150 words):**

  Stripping away the analogy weakens, but doesn't necessarily destroy, her one-object view. The analogy's persuasive power *relies heavily* on the clarity of corporate identity through legal convention – a clarity absent in the physical case. Without it:

  *   The core problem of co-location (statue vs. lump) remains unaddressed and seems like a strong argument for pluralism (two objects).
  *   The lack of clear criteria for *physical* identity through complete part replacement (beyond vague notions of "form") becomes stark. Is "form" alone enough? The analogy assumed it was, just like corporate roles, but this is debatable for matter.
  *   The "temporary parts" idea highlights how the one-object view might reduce the statue to a fleeting event, contradicting our intuition of persistence.
  *   **Verdict:** The analogy masks significant disanalogies. Without it, the pluralist view (statue and clay are distinct, co-located objects) gains significant ground, as the one-object view struggles to adequately explain co-location and provide robust, non-question-begging persistence conditions matching our intuitions.

  **A Better Analogy? (~100 words):**

  A **river** offers a cleaner analogy for *processual* views of objects, potentially aligning with the "temporary parts" idea:

  *   **River = Statue:** The enduring entity.
  *   **Water Molecules = Clay Particles:** The constantly changing constituent parts.
  *   **Flow/Channel = Arrangement/Form:** The dynamic structure that persists despite part replacement.
  *   **Correspondence:** The river persists as the same river despite total water molecule replacement because the *flowing process within the channel* continues. This directly mirrors the "arranged fancy" idea and handles part replacement naturally. It also leans towards the statue being a dynamic event or process (the "arranging") rather than a static "thing," potentially supporting her temporary parts view more honestly than the corporate analogy.
