answer: |-
  Here are five diagnostic points:

  1.  The impasse stems primarily from conflating descriptive phenomenology (what consciousness *is*) with normative foundations (what *grounds* moral status), treating a metaphysical distinction about structure and a pragmatic one about protection as a single, resolvable question.
  2.  It is substantive regarding the metaphysics of consciousness (scalar integrated information vs. threshold unity) but becomes a verbal/normative deadlock when applied directly to moral status, as each camp implicitly defines "sentience" to match their preferred moral criterion.
  3.  Bedrock intuitions drive the deadlock: scalarists prioritize physical continuity and gradualist naturalism, fearing arbitrary exclusions, while thresholdists prioritize the phenomenological discontinuity of subjective experience and the conceptual necessity of a subject for interests.
  4.  Genuine progress requires explicitly decoupling the questions: first, settling the metaphysical debate about consciousness (e.g., resolving if IIT's Φ truly correlates with phenomenal unity), and second, having a separate, honest debate about which *descriptive* features (if any) license normative concern, acknowledging this involves value choices.
  5.  The thermostat example reveals the core confusion: attributing "considerability" isn't an empirical claim about its hidden inner life but a conceptual/normative claim about whether non-phenomenal complexity *should* matter morally, which neuroscience cannot settle. Reframing onto "moral demandingness" based on specific capacities might bypass the sentience ontology trap.
