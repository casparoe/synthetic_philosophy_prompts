  But what could change this prioritization? If moral particularists could separate moral weighting from causal comparison, that would support the current approach. However, if empirical evidence showed that bureaucratic rationality was absent in similar cases, Bauman's thesis might need re-evaluation, making scope more urgent. Also, if institutions cling to uniqueness regardless of clarity, the impact of conceptual work might be limited, which is a potential failure point in my reasoning.

