prompt: |-
  Consider the long-running debate over the Holocaust's uniqueness and comparability, especially as shaped by the Historikerstreit and Zygmunt Bauman's thesis that modern bureaucratic rationality enabled industrial-scale killing. Much scholarship collapses three questions that should be kept apart: whether the Holocaust's causal mechanisms are sui generis (explanatory uniqueness), whether comparing it to other genocides necessarily dilutes its moral gravity (normative uniqueness), and whether Bauman's modernity thesis applies specifically here or describes bureaucratic violence generally (scope of modernity).

  Which of these three is the most upstream open problem? Defend a dependency-aware prioritization: does resolving whether explanatory uniqueness can come apart from normative uniqueness unlock progress on the others, or is the real bottleneck that Bauman's thesis is underdetermined by historical evidence—meaning its scope requires empirical comparison rather than philosophical clarification? For each line of work, specify whether it is tractable with conceptual tools alone, requires interdisciplinary collaboration, or should be deprioritized because resolving it wouldn't change much downstream for historical understanding or contemporary ethics of remembrance. Also state the criteria governing your ranking—tractability, dependency, or practical consequence for remembrance politics—and identify where limited research effort should go first.

  Please say explicitly what argument or finding would change your prioritization—for instance, if moral particularists could consistently deny comparative moral weighting without denying causal comparison, or if comparative archival evidence showed bureaucratic rationality was absent in analogous cases—and identify where your reasoning is most likely to fail, such as overestimating philosophy's capacity to resolve empirical scope questions or underestimating how remembrance institutions depend on uniqueness claims regardless of conceptual clarity.
