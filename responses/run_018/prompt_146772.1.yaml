answer: |-
  Here is a precisely ordered teaching plan for your 90-minute seminar, designed to build conceptual dependencies sequentially and intercept misconceptions proactively:

  **Core Structural Sequence (75 mins):**

  1.  **Grounding Falsifiability (10 mins):**
      *   **Content:** Briefly recap Popper's core idea: Scientific theories are never verified, only falsified. Science progresses by eliminating false theories.
      *   **Why First?** Establishes that science deals with *false* or *potentially false* theories. Without falsifiability, the *problem* of progress (moving towards truth despite being false) doesn't arise. Truth itself is unattainable (via verification), so we need an alternative goal.

  2.  **Logical Content vs. Empirical Content (15 mins):**
      *   **Content:** Define *Logical Content* (all logical consequences of a theory, including trivial ones like "T ∨ S"). Define *Empirical Content* (the class of *potential falsifiers* – specific basic statements whose truth would falsify T). Emphasize that high empirical content = bold, risky, informative theories. Low empirical content = safe, unfalsifiable, uninformative.
      *   **Why Before Approximation?** Verisimilitude depends on comparing the *informative content* (especially empirical content) theories have about the world, not just counting true/false statements. We need to distinguish trivial logical truths from substantial empirical claims.
      *   **Misconception Interception (Here):** Preempt conflation with predictive accuracy. Stress: A theory with high empirical content makes *many specific, risky predictions*. It can be *falsified more easily* but says *more* about the world. Accuracy is about *how many* predictions are correct; empirical content is about *how many specific risks* it takes.

  3.  **Introducing Verisimilitude & The Map Analogy (20 mins):**
      *   **Content:** Pose the problem: How can science *progress* if theories are always falsified? Popper's answer: Aim for increasing *verisimilitude* (truth-likeness/closeness to truth).
      *   **The Map Analogy (Critical Deployment):**
          *   **Must Include:**
              *   Theory T1: Correct coastlines, *every* city misplaced (False in many ways, but captures a fundamental *structural feature*).
              *   Theory T2: Correct projection (e.g., Mercator), *every* city correctly located, but coastlines distorted proportionally (False in many ways, captures a different structural feature).
              *   True Map Tt: Correct coastlines *and* cities.
              *   **Key Insight:** T1 might be *more useful* for understanding continental shapes/ocean currents (high truth-content *in a crucial aspect*), despite having more literal falsehoods (wrong cities) than T2, which might be better for navigation between known points. *One captures deep structure better, even if strictly less accurate on surface details.*
          *   **Must Avoid:**
              *   **Predictive Failure Confusion:** Explicitly state: "Distance from truth" here is **NOT** about how many predictions *fail* (T1 predicts *all* city locations wrong!). It's about *which* features of reality the theory accurately represents and how *fundamental* those features are to the overall structure. T1 gets the *big picture* (coastlines) right, which might be more "truth-like" for certain purposes than getting all the details (cities) right but distorting the big picture (like T2's projection). *Predictive accuracy is about details; verisimilitude is about structural fidelity.*
      *   **Popper's Initial Hope:** A theory T1 has more verisimilitude than T2 if:
          *   T1's truth-content includes T2's truth-content, AND
          *   T2's falsity-content includes T1's falsity-content.
          *   (Use map analogy intuitively: Does T1 have all the truths T2 has *plus more*? Does T2 have all the falsehoods T1 has *plus more*? If so, T1 is closer to truth).

  4.  **The Formal Collapse (20 mins):**
      *   **Content:** Explain the core problem exposed by Tichý (1974) and Miller (1974): For *any* false theory T1 that seems intuitively closer to truth than another false theory T2, you can *always* construct a different true theory (or trivial truth) using the very same logical components that *reverses* the comparison based on Popper's definition.
      *   **Key Insight:** Popper's definition relies on comparing *sets* of true/false consequences. But these sets are infinite and logically intertwined. Shuffling logical components (like in the map: focusing on cities vs. coastlines vs. projection) can make *any* false theory appear better or worse than another by Popper's measure, depending on which aspects you emphasize. There's no stable, objective way to order them solely by content inclusion.
      *   **Why it Collapses:** The logical relationships between statements are too complex; truth-content and falsity-content aren't independent. You can't just "add" truths without potentially changing the significance of the falsities.
      *   **Misconception Interception (Here):**
          *   **"Collapse = No Progress":** Immediately counter: "This does **NOT** mean science doesn't progress! It means Popper's *specific formal definition* for *measuring* progress quantitatively via logical content failed. We can still argue Newton was *better* (more explanatory, wider scope, more accurate predictions) than Aristotelian physics, and Einstein better than Newton – but we lack a *formal metric* for 'closeness to truth'." Stress qualitative progress vs. quantitative measure.
          *   **"Trivial Truth > False Theory":** Use the map: Compare T1 (correct coastlines, wrong cities) to the trivial true statement "Either London is in England or it isn't" (Tt ∨ ~Tt). The trivial truth has minimal empirical content (tells us *nothing* specific). T1, while false about cities, tells us vastly *more* true and useful information about the world's geography (the coastlines). Verisimilitude requires *substantial* truth-content, not just being true.

  5.  **Structural Dependency & Diagnostic (10 mins):**
      *   **Recap Dependency:** Reiterate the chain: Falsifiability (theories are false) → Need for Progress Goal → Distinction Logical/Empirical Content (to talk about informative power) → Verisimilitude as Goal → Formal Attempt to Define It → Collapse due to logical complexity of content comparison.
      *   **Diagnostic Question/Task:** "Explain *why* comparing theories for verisimilitude, in Popper's sense, fundamentally requires comparing *false* theories with differing *empirical content*. Why isn't comparing a false theory to the (unknown) true theory, or to a trivial tautology, sufficient for understanding progress?" *(Target Answer: Because the true theory is unknown. Trivial tautologies are true but have zero empirical content/provide no information, so a false but informative theory is clearly preferable for science. Progress involves increasing substantial truth-content, which only meaningful false theories possess.)*

  **Explicit Refusals to Formalize (State Clearly at Relevant Points - 5 mins total):**

  1.  **Probability/Bayesianism:** "We are *not* using probabilities or degrees of belief here. Verisimilitude is about *logical content* and *closeness to the whole truth*, not about how likely a theory is to be true or predict the next observation."
  2.  **Full Logical Apparatus:** "We are *not* diving into symbolic logic, set theory definitions of content, model theory, or the technical proofs of the collapse. We are focusing on the *conceptual* reasons why the project ran aground."
  3.  **Alternative Formal Measures:** "We are *not* examining later attempts (e.g., Niiniluoto, Oddie) to define verisimilitude using similarity between models or possible worlds. We're focused on why Popper's *original content-based approach* failed."

  **Demarcation: Settled vs. Contested (Final 10 mins):**

  *   **Settled in this Seminar:**
      *   Popper's *motivation* for verisimilitude: Science aims for truth but can't reach it; progress needs an alternative goal compatible with falsificationism.
      *   The *necessity* of the logical/empirical content distinction for this project.
      *   The *specific reason* Popper's *own formal definition* (based on comparing sets of true/false consequences) collapsed (logical interdependence of content).
  *   **Genuinely Contested (Mention Briefly):**
      *   **Can verisimilitude be rehabilitated?** Are other formal approaches (e.g., similarity metrics) viable, or do they face new fatal problems?
      *   **Is quantification possible or desirable?** Was Popper making a "category mistake" by trying to quantify truth-likeness? Is verisimilitude inherently a qualitative, comparative notion?
      *   **Is verisimilitude even coherent?** Some argue the concept itself is ill-defined or dependent on our interests/purposes (like the map analogy's dependence on purpose).
      *   **Are there better accounts of progress?** (e.g., problem-solving effectiveness, unification, robustness – *mention only as alternatives, don't explain*).
  *   **Key Message:** The collapse of Popper's formal definition was a major event in philosophy of science. It settled that *his specific approach* didn't work. It did *not* settle whether verisimilitude is a coherent goal, whether science progresses, or whether other definitions might succeed. Those remain live debates.
