  The sequence should build like architecture: falsifiability first as foundation, then logical/empirical content distinction as framework, before introducing verisimilitude as the roof. The map example has to show that more (empirical) content isn't automatically better - a theory with all coastlines correct but cities wrong might be "more false" than one with fewer truths but important truths preserved. 

