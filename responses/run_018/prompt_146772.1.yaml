  The diagnostic question must force them to see why content matters: e.g. "Why can't we say 'all swans are white' is closer to truth than Newtonian physics?" And I'll explicitly avoid any formulas - no Tichý/Miller complexities, just the intuitive impossibility of counting truths. 

