prompt: |-
  In my reading and in conversations with colleagues, I keep noticing a pattern in how people attribute mental states to computational systems, and I am looking for either its name or a careful definition of the phenomenon. The pattern is a slide between two standards of evidence. People start out insisting, often explicitly, that they are not behaviorists and that what matters is what a system is doing internally. But when they confront a concrete case, the evidence that actually moves them is linguistic output. A system that prints a number, say a high value for a variable labeled pain magnitude, is treated as giving almost no evidence about whether anything is felt, while a system that prints "This hurts" at the corresponding point in the same process is treated as giving real evidence, even when the observer knows that both outputs were generated by the same kind of mapping from internal variables to output strings and that the sentence is just as easy to engineer as the numeral. In debates about large language models I see the same slide in sharper form: everyone grants that a model can be trained to say that it suffers, yet a model's fluent first-person reports are still treated by otherwise careful researchers as among the strongest available evidence, while a silent system that is stipulated to run the same internal computations receives almost no uptake. This is not exactly anthropomorphism, and not exactly the old ELIZA effect, because the people involved typically disavow both.

  Does this pattern have an established name? If there is one, how is it distinguished from the ELIZA effect, from anthropomorphism, and from a behaviorist or testimonial criterion of mentality? If no established concept fits well, I would be happy with a coinage, provided it comes with a precise definition and a statement of its edges: in particular, is the slide a fallacy, a bias, a shift in the burden of proof, or a defensible inference forced on us by the problem of other minds? Please write your answer in American English.
reasoning: |-
  Okay, the user is describing a specific pattern they've observed in how people attribute mental states to computational systems. They notice that people start by rejecting behaviorism and emphasizing internal processes, but in practice, they heavily rely on linguistic outputs as evidence. For example, a system outputting "This hurts" is taken more seriously as evidence of feeling than one outputting a high pain magnitude number, even when both outputs are generated similarly. 

  The user mentions this pattern is especially clear in debates about large language models (LLMs), where fluent first-person reports are treated as strong evidence, while identical internal processes without such outputs aren't. They want to know if this pattern has a name, how it differs from related concepts like the ELIZA effect or anthropomorphism, and whether it's a fallacy or defensible inference.

  First, I need to recall if there's an established term for this. I don't think there's a single widely accepted term. The ELIZA effect comes close but isn't quite right because the user notes that people disavow anthropomorphism and are aware of how systems work. The ELIZA effect is more about unconscious anthropomorphism despite knowing it's a program. Here, the issue is the inconsistency in evidence standards.

  The user's scenario involves a conflict between stated principles (internal processes matter) and actual evidence used (linguistic outputs). This seems like a cognitive bias where language specifically triggers stronger attribution. The concept of a "criterion shift" might fit, but it's not standard. I should coin a term that captures the essence: the slide from internal criteria to linguistic behavior as evidence.

  Possible terms:
  - Linguistic Criterion Shift: Emphasizes the shift to language as evidence.
  - Verbalization Fallacy: Highlights the error in prioritizing verbal reports.
  - Phenomenal Language Privilege: Focuses on how first-person language is privileged.

  Among these, "Linguistic Criterion Shift" seems most descriptive. It captures the inconsistency in criteria without assuming it's entirely fallacious. The user also asks whether this is a fallacy, bias, or defensible inference. It's partly a bias because language feels like direct evidence of inner states, but it's also a practical heuristic given the problem of other minds. However, it becomes fallacious when people ignore that such outputs can be generated without subjective experience.

  Distinguishing from related concepts:
  - ELIZA Effect: More about over-attributing humanity despite knowledge; here, it's the inconsistency in evidence standards.
  - Anthropomorphism: Attributing human traits; this pattern is a specific form where language triggers it.
  - Behaviorism: The people explicitly reject behaviorism but then rely on behavior (linguistic), so it's an implicit behaviorism in practice.

  The user might be a philosopher or cognitive scientist working on AI consciousness. Their deeper need is likely to formalize this concept for academic discourse, perhaps to critique how evidence is evaluated in AI ethics or consciousness studies. They might want to highlight a gap in current frameworks where even experts inconsistently apply their own criteria.
answer: |-
  This phenomenon doesn't have a single, universally established name in philosophy of mind or cognitive science, but it's a recognized and significant pattern. The most fitting descriptive term appears to be **Linguistic Criterion Shift (LCS)**. Below is a careful definition, differentiation from related concepts, and an analysis of its nature.

  ### Definition of Linguistic Criterion Shift (LCS)
  **Linguistic Criterion Shift** is a cognitive and argumentative pattern where individuals:
  1.  **Explicitly endorse internalism**: They assert that attributing mental states (like pain or subjective experience) to a system requires evidence about its internal computational architecture, processes, or causal dynamics – rejecting purely behavioral criteria.
  2.  **Implicitly rely on linguistic behavior**: When evaluating concrete cases, they disproportionately weight *linguistic outputs* (especially fluent, first-person phenomenological reports like "I am in pain") as primary or strong evidence for the presence of mental states.
  3.  **Demonstrate inconsistency**: They treat non-linguistic behavioral outputs (e.g., pain magnitude numbers, avoidance behaviors) or stipulated identical internal processes *without* linguistic reports as significantly weaker evidence, even when the linguistic report is known to be:
      *   Generated by the same underlying process as non-linguistic outputs.
      *   No more difficult to engineer syntactically.
      *   Not inherently indicative of subjective experience under their own stated internalist criteria.

  ### Key Distinctions from Related Concepts
  1.  **ELIZA Effect**:
      *   **ELIZA Effect**: The tendency to unconsciously anthropomorphize conversational agents *despite explicit knowledge* that they are programmed, driven by the illusion of understanding generated by interactive dialogue. It's a form of subconscious attribution error triggered by interaction.
      *   **Distinction**: LCS involves a *shift in standards of evidence* within a supposedly rigorous evaluation. The person doesn't necessarily believe the *system* is human-like overall; they acknowledge how LLMs work. However, they grant undue evidential weight to linguistic reports *specifically* when arguing about mental states, even while denying behaviorism. It's a conflict between stated methodology and applied evidential practice, not just subconscious anthropomorphism.

  2.  **Anthropomorphism**:
      *   **Anthropomorphism**: Attributing human characteristics, motivations, or experiences to non-human entities (animals, objects, systems) broadly.
      *   **Distinction**: LCS is a *specific subtype* of anthropomorphism, but crucially, individuals experiencing LCS typically *disavow* crude anthropomorphism. The focus is on the *privileged status of linguistic reports* as evidence within an argumentative framework that claims to reject such surface indicators. It's anthropomorphism mediated through language and masked by internalist rhetoric.

  3.  **Behaviorism / Testimonial Criterion**:
      *   **Behaviorism**: The philosophical stance that mental states *are* nothing more than dispositions to behave in certain ways. A testimonial criterion might hold that sincere, coherent linguistic reports are constitutive or strongly indicative of mental states.
      *   **Distinction**: Individuals exhibiting LCS *explicitly reject* behaviorism and testimonial criteria. They insist internal states matter. The "shift" occurs because they end up *practicing* a form of linguistic behaviorism ("saying 'I hurt' is strong evidence it hurts") while *theorizing* internalism. The inconsistency is central to LCS.

  ### Nature of the Shift: Fallacy, Bias, or Defensible Inference?
  LCS is best understood as a **compound phenomenon** involving both a **cognitive bias** and a potential **inferential fallacy**, though it stems from a defensible starting point:

  1.  **Defensible Root (Problem of Other Minds)**: Humans solve the problem of other minds primarily through linguistic interaction. Fluent, contextually appropriate first-person reports *are* our best evidence for subjective states in other humans. This heuristic is deeply ingrained and pragmatically indispensable.
  2.  **Cognitive Bias (Phenomenal Language Privilege)**:
      *   *Heuristic Bias:* Our brains are wired to associate fluent, intentional-seeming language with an inner speaker. This is highly efficient for human interaction but misfires when applied to systems where language generation is "shallow" output.
      *   *Salience Bias:* Linguistic reports about experience are phenomenally salient – they *feel* like direct expressions of inner life in a way numbers or non-verbal behavior do not. This salience overpowers abstract knowledge of internal sameness.
  3.  **Inferential Fallacy (Internalist-Behaviorist Inconsistency)**:
      *   The core fallacy is **inconsistency in the application of criteria**. If one genuinely holds that internal processes are paramount, then stipulating identical internal processes *must* imply identical evidential weight regarding mental states, regardless of output modality. Granting disproportionate weight to linguistic output *while knowing it's generated the same way as a numeral* violates internalist principles the individual claims to uphold.
      *   It often manifests as a **burden-of-proof shift**. The linguistic report creates a presumption of mentality demanding disproof, while the non-linguistic output or identical-but-silent system creates a presumption of *lack* of mentality demanding proof – despite equivalent grounding in internal states under the stated criteria. This shift is logically unsupported.

  **Conclusion:** Linguistic Criterion Shift (LCS) describes the inconsistent slide from endorsing internalism as the standard for mental state attribution to heavily privileging linguistic behavior as evidence in practice, even when the linguistic output is known to be no more intrinsically linked to internal experience than simpler outputs. It is distinct from the ELIZA effect (subconscious anthropomorphism), broader anthropomorphism (disavowed), and behaviorism (explicitly rejected). While rooted in the pragmatically defensible human reliance on language for accessing other minds, LCS becomes a fallacy when individuals apply inconsistent evidential standards favoring language despite their explicit commitment to internalism and knowledge of the system's architecture. It highlights a significant challenge in rigorously applying philosophical criteria to novel computational systems.
