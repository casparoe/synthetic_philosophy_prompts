prompt: |-
  hey im drafting a short paper for my philosophy of mind seminar and wanted some feedback before i commit. my thesis is that clark and chalmers parity principle runs into a problem with what im calling recursive scaffolding — cases where the environment doesnt just store beliefs but actively structures the order in which you form them. like, if ottos notebook is part of his mind because it holds his beliefs, then what about the layout of his apartment directing him from the grocery list to the phone? that layout seems to be doing cognitive work, but applying parity to it makes the boundary of ottos mind shift every time he moves around. i think this is different from the adams and aizawa cognitive bloat objection since its about diachronic control, not just including too many objects. im also wondering if chalmers later writing on the extended self already addresses this? can you check whether my reading of the parity principle is accurate here, and whether the recursive scaffolding point actually adds anything new? i dont need citations, just want to know if im talking nonsense. sorry for typos, writing on my phone
