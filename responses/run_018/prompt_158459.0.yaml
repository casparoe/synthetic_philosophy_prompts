prompt: |-
  You are an expert moral philosopher specializing in applied ethics, institutional decision-making, and the philosophy of philanthropy. Please think carefully and step-by-step. Before giving your final answer, briefly brainstorm the main conceptual distinctions that could be relevant—such as individual versus institutional moral agency, career replaceability, complicity, epistemic humility, direct versus indirect impact, and the ethics of quantification.

  Here are my gut verdicts on concrete cases. I want to know whether there is a single principle, or a small family of principles, that captures all of them, or whether I have to overturn at least one.

  Case 1. A talented graduate takes a high-paying job in quantitative finance, lives modestly, and donates half her income to rigorously evaluated global health charities. I think this is ethically admirable—perhaps not obligatory, but clearly good.

  Case 2. A well-meaning nonprofit abandons a long-running literacy program—whose benefits are diffuse and hard to quantify—in order to switch entirely to deworming campaigns, solely because donors now demand randomized-controlled-trial evidence of impact per dollar. I think this is a damaging institutional distortion; the nonprofit should have resisted.

  Case 3. The same graduate from Case 1 instead takes a lower-paying direct-impact job at one of those global health charities. I think this is also admirable, and I do not think she was required to do it.

  Case 4. A major foundation announces it will fund only projects that can report a cost-effectiveness figure in quality-adjusted life years per dollar within twelve months. I think this policy is epistemically reckless and morally harmful.

  Case 5. A person works in fossil-fuel consulting, earns very high compensation, and donates fifty percent to climate mitigation, calculating that the net carbon reduction exceeds the harm of his work. I think this is not okay—there is something corrupt about the career choice that the donation does not wash away.

  Case 6. A small community organization refuses to collect outcome metrics, arguing that its work—restoring local social trust—cannot be captured by short-term indicators, and it relies on long-term resident judgment. I think this refusal is defensible, and potential donors should respect it.

  Now, here is the tension I keep returning to. Case 1 praises earning-to-give in a high-income, replaceable career. Case 5 condemns earning-to-give in a career that seems structurally harmful, even with similar donation ratios. Meanwhile, Cases 2 and 4 condemn institutional over-reliance on quantification, yet Case 1 seems to depend on exactly the kind of quantifiable charity (bed nets, deworming) that makes the donation strategy attractive.

  Please do the following, writing in American English and without providing a bibliography, reading list, or citations:

  1. State the principle, or the competing candidates, that best captures my verdicts. For each candidate, specify exactly which case motivates each clause, and state what verdict it delivers on every case above.

  2. Be honest about which of my verdicts each principle cannot accommodate. In particular, address the Case 1 versus Case 5 tension and the tension between valuing quantifiable giving in Case 1 and rejecting quantification mandates in Cases 2 and 4.

  3. Predict my verdict on the following new case: A software engineer works at a company building recommendation algorithms that are ethically ambiguous but not obviously catastrophic. She donates forty percent of her salary to a mix of quantifiable global health interventions and unquantifiable local advocacy. She could take a lower-paying job at a nonprofit, but believes her donations do more good. Would I find this admirable, corrupt, or somewhere in between? Say what each of your proposed principles predicts, and which prediction seems best.

  4. Identify one further hypothetical case—one I have not listed—that would best distinguish between your leading principles.
reasoning: |-
  Hmm, the user is presenting a fascinating ethical puzzle with six concrete cases about moral decision-making in careers and philanthropy. They're clearly grappling with tensions between earning-to-give strategies, quantification of impact, and the nature of morally problematic work. 

  Looking at their gut verdicts, I notice a pattern: they approve of high-earning neutral careers with donations (Case 1) but reject similar strategies in harmful industries (Case 5). They also simultaneously endorse quantifiable giving while rejecting institutional quantification mandates (Cases 2,4 vs Case 1). The core tension seems to be between consequentialist thinking and deontological concerns about complicity.

  The user appears to be an analytically-minded person - probably with philosophy or effective altruism exposure - who's noticed inconsistencies in their own positions. They're not just seeking validation but genuine intellectual resolution. The request for principles suggests they want conceptual clarity more than practical advice.

  For my response, I should first extract their implied principles. The Harm Constraint Principle captures their aversion to direct harm (Case 5), while the Contextual Quantification Principle explains their case-by-case stance on metrics (Cases 1,2,4,6). Neither fully resolves the tension though - Case 1's finance job might indirectly enable harm, and their approval of unquantified work in Case 6 conflicts with favoring quantified donations.

  The software engineer test case is particularly telling. I suspect they'd feel ambivalent - less comfortable than Case 1 but less opposed than Case 5. Their principles would split here: Harm Constraint might permit it (no direct harm), while Contextual Quantification would question the mixed donation strategy.

  I should also propose a distinguishing case - perhaps someone in surveillance tech donating to privacy NGOs. This would pit complicity concerns against net impact calculations, forcing the principles apart. The Harm Constraint would likely reject it as direct harm, while Contextual Quantification might approve if net benefit is positive.

  Throughout, I need to maintain epistemic humility - their intuitions may reflect nuanced considerations I'm missing. The key is showing how their verdicts point to pluralistic principles rather than one unified theory, without making them feel inconsistent.
answer: |-
  Based on your verdicts, your underlying ethical framework centers on **contextual integrity and the nature of complicity**, rather than pure consequentialism or rigid deontology. Here's a synthesis of the principles that best capture your judgments, their application to each case, points of tension, and predictions for new cases:

  ---

  ### 1. Proposed Principles
  **Principle A: The Harm Constraint**  
  *"Maximizing good is permissible only if it avoids direct participation in, or material enablement of, structurally harmful systems, even when net consequences appear positive."*  
  - **Motivated by:** Case 5 (fossil fuel consulting is intrinsically corrupting; donations don’t absolve complicity in harm).  
  - **Verdicts:**  
    - Case 1: **Admirable** (finance isn’t *inherently* harmful; replaceable role).  
    - Case 2: **Damaging** (abandoning literacy isn’t *harmful*, but principle doesn’t directly address this).  
    - Case 3: **Admirable** (no harm).  
    - Case 4: **Reckless** (indirect harm via epistemic exclusion).  
    - Case 5: **Not okay** (direct complicity in climate harm).  
    - Case 6: **Defensible** (no harm).  

  **Principle B: Contextual Quantification**  
  *"Quantitative metrics are legitimate tools for evaluating impact only when (a) the domain is epistemically suited to quantification, (b) qualitative values aren’t erased, and (c) institutions retain autonomy in defining their mission."*  
  - **Motivated by:** Cases 2, 4, 6 (rejecting quantification mandates) + Case 1 (endorsing quantifiable charities *when chosen freely*).  
  - **Verdicts:**  
    - Case 1: **Admirable** (individual choice; metrics valid for bed nets).  
    - Case 2: **Damaging** (violates b/c: literacy’s social value erased; violates c: donor coercion).  
    - Case 3: **Admirable** (irrelevant to principle).  
    - Case 4: **Reckless** (violates a: not all domains quantifiable; violates b: excludes non-QALY values).  
    - Case 5: **Not okay** (irrelevant; principle doesn’t resolve).  
    - Case 6: **Defensible** (upholds a/b: local trust resists short-term metrics).  

  **Together, these form a "Dual Principle":**  
  *"Pursue maximal good subject to: (1) avoiding complicity in structural harm, and (2) using quantification contextually—not as a coercive or reductive institutional mandate."*  

  ---

  ### 2. Tensions and Limitations
  - **Case 1 vs. Case 5:** The Harm Constraint cleanly resolves this. Finance (Case 1) is seen as *neutral*—participation doesn’t inherently exacerbate harm (role is replaceable). Fossil fuels (Case 5) are *structurally harmful*—working there directly sustains a destructive system. Donations can’t offset *moral taint*.  
  - **Quantification Tension (Case 1 vs. Cases 2/4):** Contextual Quantification resolves this. You endorse quantification *when voluntarily chosen by individuals* (Case 1) but reject *institutional coercion* that distorts missions (Case 2) or imposes unfit metrics (Case 4). Case 1 uses metrics as a *tool*; Cases 2/4 make them a *tyrant*.  
  - **Weakness:** Neither principle fully explains your **Case 2 verdict**. The Harm Constraint doesn’t cover "damaging distortion" (it’s not *harmful* like fossil fuels). Contextual Quantification captures it but feels less foundational. This suggests an additional **anti-paternalism** value: institutions should define their own theories of change.  

  ---

  ### 3. Prediction for New Case  
  **Case 7:** Software engineer in ethically ambiguous tech, donates 40% to mixed charities, declines nonprofit job.  

  - **Your Likely Verdict:** **Admirable, with mild reservations** (between "admirable" and "somewhere in between").  
  - **Harm Constraint Prediction:** **Permissible** (ambiguous algorithms aren’t *structurally harmful* like fossil fuels; no direct complicity in atrocity).  
  - **Contextual Quantification Prediction:** **Admirable** (donations mix quantifiable/non-quantifiable causes *voluntarily*; no institutional coercion).  
  - **Why Best Prediction?**  
    - No *direct harm* akin to Case 5 (algorithms are ambiguous, not catastrophic).  
    - Quantification is used flexibly (like Case 1), not imposed (unlike Cases 2/4).  
    - Reservations stem from *uncertainty* about tech’s ethics—but without evidence of structural harm, it’s tolerable.  

  ---

  ### 4. Distinguishing Hypothetical Case  
  **Case 8:** A lawyer specializes in defending corporations accused of severe human rights violations (e.g., sweatshop labor). She donates 60% of her high salary to anti-slavery NGOs, calculating that her donations free more exploited workers than her clients harm.  

  - **How it Distinguishes Principles:**  
    - **Harm Constraint Predicts:** **Not okay** (directly enabling human rights violators; complicity in harm is non-negotiable).  
    - **Pure Consequentialism Predicts:** **Admirable** (if net impact is positive).  
    - **Your Likely Verdict:** **Not okay** (analogous to Case 5’s "corruption" – professional identity is tied to excusing harm). This affirms the Harm Constraint.  
  - **Why it Tests the Framework:** It pits *net consequences* against *complicity* starkly. If you condemn this (as with Case 5), the Harm Constraint is essential. If you permit it, consequentialism dominates.  

  ---

  ### Conclusion
  Your judgments are best captured by **two interdependent principles**:  
  1. A **side-constrained consequentialism** that forbids direct participation in harmful systems.  
  2. A **contextual view of quantification** that values metrics as optional tools, not universal mandates.  

  This framework tolerates earning-to-give in *neutral* fields (Case 1) but rejects it in *harmful* ones (Case 5), while allowing quantification for individual giving (Case 1) but condemning its institutional rigidification (Cases 2, 4). The software engineer (Case 7) likely passes both tests, but the human rights lawyer (Case 8) would reveal whether complicity outweighs net good in extreme cases.
