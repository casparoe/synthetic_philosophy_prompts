prompt: |-
  Two philosophers of physics in my department — a psi-ontic realist who holds that the quantum state represents physical reality, and a psi-epistemic theorist who holds that it represents an agent's information or degrees of belief about an underlying ontic state — have been arguing past each other for years, mostly trading slogans ("collapse is physical!" vs. "collapse is just updating!"). Draft the joint statement they should produce if forced into an adversarial collaboration.

  The statement should include: (1) a section of claims both can sign — about what the formalism of quantum mechanics does and does not settle, what the PBR theorem and related no-go results actually assume (e.g., preparation independence) and therefore do and do not rule out, and why the existence of the quantum Bayesian or statistical-interpretation traditions does not by itself refute psi-ontology; (2) a section stating the residual disagreements in wording each party would accept for its own position — including whether the wavefunction's apparent collapse and the exponential growth of entangled states are problems for the epistemic view, and whether interference phenomena and the impossibility of distinguishing non-orthogonal states are problems for the ontic view; (3) a list of cruxes — sub-questions such that settling them would move at least one side — and for each crux, an argument, thought experiment, or conceivable empirical or formal result that both agree bears on it, with each side's prediction or concession recorded in advance. If part of their dispute turns out to be verbal (for instance, disagreement over what "represents reality" requires), the statement should say so explicitly and identify which part.
reasoning: |-
  We are drafting a joint statement for two philosophers of physics: a psi-ontic realist and a psi-epistemic theorist. The statement should have three main sections:

  1. **Agreed Claims**: What both can sign about the formalism, what no-go theorems (like PBR) actually assume and rule out, and why the existence of alternative interpretations (like QBism) doesn't refute psi-ontology.

  2. **Residual Disagreements**: Each party states their position in their own words, addressing specific issues: 
     - For the epistemic view: wavefunction collapse and exponential growth of entangled states as problems?
     - For the ontic view: interference and the impossibility of distinguishing non-orthogonal states as problems?

  3. **Cruxes**: List of sub-questions that would move at least one side if settled. For each crux, provide an argument, thought experiment, or conceivable result that both agree bears on it. Record each side's prediction or concession in advance. Also, identify any verbal disputes.

  Let's structure the statement accordingly.

  ---

  **Joint Statement on the Ontological Status of the Quantum State**

  **Section 1: Agreed Claims**

  We, the undersigned, a proponent of psi-ontology (hereafter, the Onticist) and a proponent of psi-epistemicism (hereafter, the Epistemicist), agree on the following points:

  1. **Formalism and Interpretation**: The mathematical formalism of quantum mechanics, as it stands, is a predictive instrument that allows us to compute probabilities for measurement outcomes. However, the formalism by itself does not dictate whether the quantum state (wavefunction) represents a physical state of reality or an agent's state of knowledge (or belief) about an underlying reality. This is a matter of interpretation.

  2. **No-Go Theorems and their Assumptions**: 
     - The PBR theorem (Pusey, Barrett, and Rudolph, 2012) and related no-go results (e.g., those by Colbeck and Renner, Hardy) aim to rule out psi-epistemic interpretations that satisfy certain criteria. However, these theorems rely on assumptions that may be questioned.
     - A key assumption in the PBR theorem is "preparation independence": that independently prepared systems have independent physical states. This assumption is not a direct consequence of the quantum formalism and may be rejected by some epistemic interpretations (e.g., those allowing for non-separable ontic states or holistic constraints on knowledge).
     - Therefore, the PBR theorem does not rule out all possible psi-epistemic models, but only those that satisfy its specific assumptions (including preparation independence and the ontological models framework). Similarly, other no-go theorems have their own sets of assumptions (e.g., about the nature of measurements or the completeness of quantum descriptions).

  3. **Diversity of Interpretations**: The existence of interpretations that treat the quantum state epistemically (such as QBism, the Copenhagen interpretation in some readings, and certain versions of relational quantum mechanics) does not by itself refute psi-ontology. Likewise, the existence of psi-ontic interpretations (such as many-worlds, Bohmian mechanics, and GRW collapse theories) does not refute psi-epistemicism. Each approach must be evaluated on its own merits, including internal consistency, explanatory power, and compatibility with future physical theories.

  4. **Common Ground**: Both parties agree that quantum mechanics is an empirically successful theory and that the quantum state plays a central role in its predictions. We also agree that the measurement problem (the apparent conflict between unitary evolution and definite measurement outcomes) is a genuine challenge that any interpretation must address.

  **Section 2: Residual Disagreements**

  In this section, each party states their position in their own words.

  **The Onticist's Statement**:
  "I hold that the quantum state is a physical entity, part of the objective fabric of reality. This view naturally accounts for interference phenomena and the unitary evolution of the state, which are direct manifestations of the wavefunction's physical nature. However, I acknowledge that the ontic view must explain the apparent collapse of the wavefunction upon measurement. I see this as a physical process (e.g., via dynamical collapse or branching into multiple worlds) and not merely as an update of knowledge. The exponential growth of entangled states is not a problem for the ontic view because it reflects the true complexity of the physical world. On the other hand, the epistemic view struggles to explain why we cannot distinguish non-orthogonal states without disturbance, because if the quantum state were merely about knowledge, one might expect that with better information we could distinguish them. The impossibility of such distinction is a natural feature of an ontic state that is not fully accessible by measurement."

  **The Epistemicist's Statement**:
  "I hold that the quantum state represents an agent's state of knowledge or belief about an underlying ontic state of a system. This view naturally explains the collapse of the wavefunction as a Bayesian update of the agent's beliefs upon acquiring new information, without any physical process. The exponential growth of entangled states is not a problem for the epistemic view because it reflects the growth of correlations in our knowledge, not an explosion of physical reality. However, I acknowledge that the epistemic view must account for interference phenomena and the specific structure of quantum probabilities. I argue that these arise from constraints on what can be known about the underlying ontology. On the other hand, the ontic view struggles to explain why the quantum state appears to be relative to the agent (as in Wigner's friend scenarios) and why we cannot distinguish non-orthogonal states without disturbance. This is naturally explained if the quantum state is epistemic: non-orthogonal states correspond to overlapping probability distributions over the ontic states, making them indistinguishable without altering the system."

  **Section 3: Cruxes**

  We agree that the following questions are crucial to resolving our disagreement. For each, we provide a common argument or scenario and record our respective predictions or concessions. We note that some disagreements might be verbal (e.g., about what constitutes "physical reality" or "knowledge"), but we believe the cruxes below are substantive.

  1. **Crux: The Nature of Quantum Interference**
     - **Scenario**: In a double-slit experiment, if we know which slit the particle went through, the interference pattern disappears. How do the two views explain this?
     - **Onticist Prediction**: The interference pattern is a direct result of the physical wavefunction passing through both slits. When we gain information about the slit, we physically disturb the system (e.g., by a measurement apparatus) and destroy the interference. This is a physical process.
     - **Epistemicist Prediction**: The interference pattern arises because without which-slit information, the agent must assign a wavefunction that reflects the lack of knowledge, leading to interference. When the agent gains information, the wavefunction updates and the interference pattern vanishes. There is no physical disturbance to the particle beyond the minimal required for the information gain.
     - **What would move us?**: If it could be shown that interference occurs even when no disturbance is possible (e.g., in a delayed-choice experiment where the "disturbance" happens after the particle has passed the slits but before detection), the Onticist would see this as supporting the physical reality of the wavefunction. The Epistemicist would argue that the update of knowledge at the delayed choice still explains the result without a physical wave.

  2. **Crux: Preparation Independence and the PBR Theorem**
     - **Scenario**: Consider the PBR theorem's experimental setup: two systems independently prepared in known quantum states. The theorem shows that if the quantum state is epistemic and preparation independence holds, then the predictions of quantum mechanics are violated.
     - **Onticist Prediction**: Preparation independence is a natural assumption. If an experiment were performed that violates the quantum prediction in this setup, it would refute the epistemic view that accepts preparation independence. But since no such violation has been observed, the ontic view (or an epistemic view that rejects preparation independence) is supported.
     - **Epistemicist Prediction**: Preparation independence is not a necessary feature of an epistemic view. An epistemic model may have ontic states that are correlated due to a common cause or holistic constraints. If a viable epistemic model without preparation independence is constructed that reproduces quantum predictions, it would undermine the PBR theorem's force against epistemic views.
     - **What would move us?**: The discovery of a fundamental limitation on the independent preparation of quantum systems (e.g., due to a deeper theory) would support the Epistemicist. Alternatively, if an experiment violating quantum predictions in a PBR-like setup were performed, the Onticist would be vindicated.

  3. **Crux: The Reality of the Wavefunction in Entanglement**
     - **Scenario**: Consider two particles in a maximally entangled state (e.g., a Bell pair). When measured, they exhibit perfect correlations regardless of the distance between them.
     - **Onticist Argument**: The entangled wavefunction is a real physical entity that connects the particles. The correlations cannot be explained by pre-existing local properties (as per Bell's theorem) and thus require a nonlocal wavefunction.
     - **Epistemicist Argument**: The entangled wavefunction represents the agent's knowledge of the correlations. The correlations themselves are due to the underlying ontic state (which may be nonlocal) but the wavefunction itself is not the physical connection.
     - **What would move us?**: If a theory were developed that explains the correlations without a nonlocal wavefunction (e.g., a local hidden variable theory that is consistent with Bell tests), the Epistemicist would see this as supporting the epistemic status of the wavefunction. The Onticist would argue that such a theory is ruled out by Bell's theorem. However, if future experiments violate Bell inequalities even more strongly, the Onticist would take it as evidence of nonlocal reality, while the Epistemicist would argue that it only constrains the underlying ontology, not the epistemic nature of the wavefunction.

  4. **Crux: The Status of Quantum State Tomography**
     - **Scenario**: In quantum state tomography, we reconstruct the quantum state from a set of measurements on an ensemble of identically prepared systems.
     - **Onticist Claim**: This procedure reveals the true physical state of the system, up to the limitations of quantum mechanics.
     - **Epistemicist Claim**: This procedure reveals the agent's best estimate of the system's state, but the underlying ontic state might be different.
     - **What would move us?**: If it were shown that two different quantum states assigned to the same system by two agents (with the same information) lead to different experimental predictions, the Epistemicist would concede that the quantum state must be ontic. The Onticist would predict that such a scenario is impossible because the quantum state is physical and unique. Conversely, if it were shown that the same underlying ontic state can be represented by different quantum states (without violating quantum predictions), the Onticist would have to concede that the wavefunction is not a direct representation of the ontic state.

  **Verbal Dispute Clarification**: We acknowledge that some of our disagreement may stem from differing definitions of "physical reality." The Onticist typically means by this that the wavefunction is a fundamental element of the world's ontology, while the Epistemicist may allow that the wavefunction represents something real (e.g., the information) but not in the same sense as the underlying ontic state. We agree, however, that the cruxes above are not merely verbal because they involve testable consequences.

  ---

