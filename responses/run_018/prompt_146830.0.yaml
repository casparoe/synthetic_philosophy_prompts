answer: |-
  ## Submergence Rationale

  The current claws, the gasp that shreds the air,
  Her limbs like branches snapped in winter's gale.
  No thought survives the water's freezing stare,
  Just muscle screams to anchor, not to fail.
  My fingers lock on sodden cloth, on bone,
  Against the torrent's brutal, sucking hymn.
  I haul against the river's grinding stone,
  One lifeline drawn from nerve, from sight grown dim.

  *It is permitted, for she is my own—*
  This cold conclusion floods the frantic space.
  A moral ledger, stark and overblown,
  Asserts the right of contract, time, and place.
  The current claims its due, relentless, grim,
  *Because she is my wife,* I rescue... *him?*

  ---

  **Formal Notes:**
  *   **Octave (Action):** Rhymes focus on physical struggle (`air/gale/stare/fail`, `stone/hymn/dim`). Verbs are visceral: *claws, shreds, lock, haul, haul, drawn*.
  *   **Volta (Line 9):** The jarring intrusion of abstract justification: "It is permitted, for she is my own." The language shifts abruptly.
  *   **Sestet (Calculation):** Rhymes pivot to permission/concepts (`own/overblown/space/place`, `grim/him`). Language becomes conceptual: *permitted, moral ledger, right, contract, rescue*.
  *   **Contamination:** The volta injects cold calculation into the primal rescue. The final line's ambiguous "him?" questions the husband's own identity/motivation *after* the justifying thought, leaving the tension unresolved.
