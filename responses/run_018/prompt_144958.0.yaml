answer: |-
  Here’s a draft joint document structured as requested, reflecting points of agreement, precise disagreements, and testable cruxes. Wording is calibrated for mutual endorsement of each side’s position, with literature-divisions acknowledged.

  ---

  ### **Joint Statement on Mental Causation: Agreed Claims**  
  *(Endorsed by both the Exclusionist [E] and Non-Reductive Physicalist [NRP])*  

  1.  **Physical Causal Closure (PCC):** Every physical event that has a cause has a sufficient physical cause at *some* level of physical description (e.g., microphysical, neural).  
  2.  **The Exclusion Argument’s Core Logic:** If a mental property M is distinct from its underlying physical base P, and if P is causally sufficient for effect E (per PCC), then *prima facie*, M appears causally redundant for E. This establishes a genuine challenge for non-reductive physicalism.  
  3.  **Realization Physicalism:** Mental properties are realized by physical properties; they are not fundamental additions to the physical world. There is no ontologically independent "mental stuff."  
  4.  **The Epiphenomenalism Threat:** If the exclusion challenge cannot be met, the consequence is the causal inefficacy (epiphenomenalism) of distinct mental properties. This is an undesirable outcome demanding a solution.  
  5.  **Interventionism/Powers as Frameworks:** Both sides accept that *how* we conceptualize causation itself (e.g., via counterfactual dependence, difference-making, or causal powers) is highly relevant to assessing whether mental properties can be causally efficacious. However, **this agreement does not entail agreement that any particular framework *solves* the problem.**  

  ---

  ### **Disagreements: Precisely Formulated Positions**  

  | Crux Issue                          | Exclusionist (E) Position (as E defines it)                                                                 | Non-Reductive Physicalist (NRP) Position (as NRP defines it)                                                                 |
  | :---------------------------------- | :---------------------------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------------------------------- |
  | **Causal Relevance of Non-Reductive M** | "Distinct mental properties M, supervening on physical base P, are causally redundant for any effect E that P is causally sufficient for. M cannot add causal power beyond P." | "Distinct mental properties M, realized by but not identical to P, can be genuinely causally relevant to E by playing a distinctive causal role (e.g., as higher-order, functional, or relational properties) not played by P alone." |
  | **Adequacy of Causation Frameworks** | "Interventionist (e.g., Woodward-style) or powers-based accounts of causation merely redescribe the causal exclusion problem or relocate the redundancy; they do not resolve the fundamental threat to M's efficacy." | "A more nuanced metaphysics of causation (e.g., interventionism focusing on variables/difference-making, or powers ontology focusing on property-level dispositions) provides the resources to show how M can be causally efficacious *despite* P's sufficiency, avoiding epiphenomenalism without violating PCC." |
  | **The Nature of the "Causal Work"** | "All concrete causal work in producing E is exhaustively performed by the physical properties/entities involved (P). Attributing causal efficacy to M is either false or merely a misleading way of describing the efficacy of P." | "Causal work can be structured hierarchically or relationally. M can perform causal work by organizing, modulating, or coordinating the physical base P (or its effects) in ways that P, described narrowly, cannot account for, thereby making a non-redundant difference." |

  ---

  ### **Cruxes: Test Cases and Predictions**  

  1.  **Crux: Causal Relevance of Non-Reductive M (Avoiding Redundancy)**  
      *   **Agreed Test Case:** Consider the specific case of *pain (M) causing a withdrawal reflex (E)* in an organism. The physical base P is a specific neural firing pattern (e.g., C-fiber stimulation plus downstream motor neuron activation). Both agree P is sufficient for E per PCC.  
      *   **E Prediction:** If we could perfectly manipulate *only* the physical properties P (e.g., via precise neurostimulation) while holding fixed or altering the mental property M (e.g., inducing a state with P's physical properties but without the pain qualia, or vice-versa), E would track changes in P exclusively. Changes in M alone, without changes in P, would have no effect on E. This demonstrates M's causal redundancy.  
      *   **NRP Prediction:** Under the same manipulation scenario, changing M *while holding P fixed* (e.g., inducing a state with identical C-fiber firing but altered subjective character) is either metaphysically impossible (due to realization) or would necessitate changes in the *causal relations* or *context* that render P sufficient for E only *when* M is instantiated. M's presence makes a counterfactual difference to E *in virtue of* being the specific higher-order state realized by P, which P alone (described purely physically) does not capture.  

  2.  **Crux: Adequacy of Causation Frameworks (Solving vs. Relocating Exclusion)**  
      *   **Agreed Test Case:** Analyze the causal efficacy of a *computational property* (e.g., "executing algorithm ALPHA") M in a physical computer system. P is the specific voltage states and gate operations in the hardware. Both agree P is sufficient for the output E.  
      *   **E Prediction:** Under an interventionist framework, manipulating the variable "which algorithm is running" (M) *only* has a causal effect on the output E *because* it necessarily corresponds to manipulating the physical state P. Any causal efficacy attributed to the algorithmic level M collapses into the efficacy of its physical realizer P. Powers ontology similarly fails: the causal powers of the system are wholly determined by the physical powers of the hardware components (P); the "power" to execute ALPHA adds nothing new.  
      *   **NRP Prediction:** Under an interventionist framework, the variable "executing ALPHA" (M) is a genuine difference-maker for the output E relative to other possible algorithms, even though it is implemented by P. This causal relevance is not erased by P's sufficiency; it reveals M's causal role at the computational level. Powers ontology allows that the system, *in virtue of* realizing M, possesses novel higher-order causal powers (e.g., the power to solve a specific problem) emergent from, but not reducible to, the powers of P considered atomistically. P's sufficiency doesn't preclude M's distinct causal contribution.  

  ---

  **Notes on Grounding & Literature:**  
  *   **Agreed Claims:** Reflect core commitments of physicalism broadly shared in the literature (Kim's formulation of PCC, the *prima facie* force of exclusion).  
  *   **Disagreements:** Wording captures the *substance* of the core debate post-Kim: E's stance aligns with Kim, Papineau, mechanistic exclusion arguments; NRP's stance aligns with proponents like List & Menzies (interventionism), Shoemaker/Bird (powers), Yablo (proportionality). The table avoids implying any resolution is consensus.  
  *   **Cruxes:** Test cases are standard philosophical examples (pain withdrawal, computational properties) both sides routinely engage with. Predictions directly map onto how each camp *interprets* the outcome of such cases based on their core commitments regarding causation and properties.  
  *   **Neutrality:** The document does not presuppose that interventionism/powers *solves* exclusion (acknowledging E's critique that it relocates the problem) nor does it dismiss NRP's claim that it *can*. It isolates the exact points of divergence for empirical/conceptual testing within the collaboration.

  This structure provides a clear, focused foundation for your adversarial collaboration, isolating agreed premises, precisely framing the disagreements in mutually acceptable terms, and identifying testable predictions on shared cruxes.
