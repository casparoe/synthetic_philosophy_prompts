prompt: |-
  I'm a retired physicist (spent 30 yrs in signal processing) who's gotten into philosophy lately. There's this debate about ontology identification when info is inaccesable - like if two theories predict exactly the same measurements but disagree about what's 'really' behind the wall, can we justify picking one ontology?

  Can you restate the main stances - the realist using inference to best explanation, the anti-realist saying hidden stuff doesn't belong in ontology, and the structural realist middle ground - using only vocabulary I know: instrument calibration errors, identifiability in inverse problmes, blind source separation, noise floors, and regularization priors. I want the translation honest, not just forcing philosophy into engineering metaphors.

  Then give me the residue report: what translates cleanly (maybe underdetermination maps onto non-identifiable parameters?), what gets distorted (does 'truth' become predictive accuracy?), and what's left with no counterpart in signal processing. Specifically, is the philosophical worry about inaccessible ontology just our old problem of picking priors when data can't constrain the model, or is there something about ontological commitment that regularization doesn't capture?

  Don't quote specific texts - I don't have access to check them, and I can't search from here. Just work from the ideas.
