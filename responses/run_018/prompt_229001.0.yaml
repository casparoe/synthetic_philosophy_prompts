prompt: |-
  I am a graduate student in international relations, and I have followed my supervisor's public positions on military intervention for years. Her track record:

  1. Kosovo, 1999 — she supported NATO's bombing campaign despite the absence of Security Council authorization, describing it at the time as unlawful but justified.
  2. Iraq, 2003 — she opposed the invasion from the outset, arguing that the humanitarian case was retrospective: Saddam Hussein's worst crimes were years in the past, and there was no acute emergency in 2003 that war could halt.
  3. Libya, 2011 — she supported the initial intervention to protect Benghazi under the Security Council's mandate, but publicly broke with the operation once it became a campaign for regime change, which she argued exceeded and discredited the mandate's logic.
  4. Rwanda, 1994 — she maintains, retrospectively, that outside powers were obligated to intervene, authorization or not.
  5. Syria, 2013 — she opposed punitive airstrikes after the chemical weapons attacks, on the grounds that the attacks were over and the proposed strikes would neither protect civilians nor remain limited.

  A colleague and I are drafting a briefing note on a new case and want to predict where she will land. The Republic of Kessovia's army and allied militias have killed several thousand members of the Hadri minority and driven roughly 400,000 across the border; whether this amounts to genocide is contested. The Security Council is deadlocked by a certain veto. The regional organization has voted to intervene and can field a capable force. Military planners judge that protecting the border enclaves where most Hadri have fled is feasible at low cost, but that halting the killing throughout Kessovia would very likely require removing the regime — and the regime's patron, a nuclear-armed neighbor, has warned that regime change would bring it into the war.

  Please do the following. First, identify at least two distinct decision rules that are each consistent with all five of her past verdicts, and state plainly what each rule predicts for both the limited enclave-protection operation and the expanded operation that would remove the regime. Second, give your best prediction of her verdict on each operation, and explain which rule you take her actually to be running and why her record favors it. Third, if you find that her past verdicts genuinely underdetermine either prediction, say which single feature of the Kessovia case is doing the most work. Finally, describe the further hypothetical case — one that could plausibly arise — that would best discriminate between the two leading candidate rules.
reasoning: |-
  Okay, the user is a graduate student in International Relations working on predicting their supervisor's stance on a new intervention case in Kessovia. They've provided a detailed history of the supervisor's positions on past interventions: Kosovo, Iraq, Libya, Rwanda, and Syria. Now, they need to figure out how she'll view both a limited operation to protect enclaves and a broader regime change operation in Kessovia. 

  First, I need to identify decision rules that fit all five past cases. Let me list them out:

  1. Kosovo (1999): Supported despite no UNSC authorization—unlawful but justified.
  2. Iraq (2003): Opposed because no acute emergency; humanitarian rationale was retrospective.
  3. Libya (2011): Supported initial protection under UNSC mandate but opposed when it shifted to regime change.
  4. Rwanda (1994): Believes intervention was obligatory, authorization or not.
  5. Syria (2013): Opposed airstrikes post-chemical attack as they wouldn't protect civilians or stay limited.

  Looking for patterns... Hmm. The key factors seem to be: (1) the presence of an ongoing emergency, (2) whether the intervention is limited to protection or escalates to regime change, and (3) the existence of authorization—though she overrides it in extreme cases like Rwanda. 

  For Rule A (Emergency Protection First), she intervenes only when there's an immediate threat to civilians that can be stopped without regime change. Kosovo and Libya's initial phase fit here—ongoing violence that could be halted. Rwanda is included because the genocide was active. Iraq and Syria didn't have active emergencies, and Libya's regime change shifted away from protection. 

  Rule B (Threshold of Suffering + Feasibility) focuses on the scale of atrocities and whether the intervention can actually work without disastrous consequences. Kosovo and Rwanda had massive suffering and feasible solutions. Iraq's feasibility was low (no WMDs found, unstable outcome), Libya's regime change exceeded feasibility once it became protracted, and Syria's strikes wouldn't have helped. 

  Now, applying these to Kessovia. The limited operation protects enclaves—ongoing emergency? Yes, refugees are fleeing. Feasible? Yes, per military planners. So both rules would support it. 

  The expanded operation (regime change) is trickier. Rule A opposes it because it's not protection-focused and could escalate (nuclear-armed patron). Rule B might oppose it too—feasibility is low due to the patron's threat, and the genocide is contested. 

  My prediction: She'll support the limited operation but reject the regime change. Rule B seems more consistent because she weighs feasibility heavily (Iraq, Libya, Syria) and only backs regime change if unavoidable (which it isn't here). 

  But if I'm unsure, the key factor is the nuclear-armed patron's threat—it tanks feasibility. To test the rules, imagine a case with massive suffering and feasible regime change without major escalation—say, a Rwanda-like genocide where a regional force can topple the regime quickly. Rule A would oppose without UNSC approval; Rule B might support if feasible. That'd clarify which rule she follows.
answer: |-
  Based on your supervisor's record, here are two distinct decision rules consistent with her past positions, predictions for Kessovia, and analysis:

  ### Two Consistent Decision Rules
  1. **Rule A: Emergency Protection First**  
     *Intervene only if:*  
     (a) **An acute, ongoing mass atrocity** exists (not retrospective),  
     (b) Military action can **directly halt the killing/protect civilians** *without* regime change,  
     (c) Authorization is preferred but overridden by (a) and (b) in extreme cases.  
     *Kessovia predictions:*  
     - **Limited enclave-protection:** **Support**. Refugees are actively fleeing (ongoing emergency), protection is feasible and low-cost, and it avoids regime change.  
     - **Regime-change operation:** **Oppose**. Halting killings "throughout Kessovia" requires regime change (violates b), and the nuclear patron’s threat makes protection unfeasible.  

  2. **Rule B: Threshold of Suffering + Feasible Restraint**  
     *Intervene only if:*  
     (a) Atrocities cross a **genocide-like threshold** (scale/intent),  
     (b) The operation has **clear humanitarian feasibility** (can save lives without triggering wider war or chaos),  
     (c) **Regime change is incidental, not the goal** (Libya reversal).  
     *Kessovia predictions:*  
     - **Limited operation:** **Support**. Matches Rwanda/Kosovo: feasible protection of civilians, regional authorization adds legitimacy.  
     - **Regime-change operation:** **Oppose**. High risk of escalation with nuclear patron (violates b), and "genocide" is contested (violates a).  

  ---

  ### Best Prediction & Explanation
  - **Limited enclave-protection:** **Support**  
  - **Regime-change operation:** **Oppose**  

  **Dominant Rule: Rule B (Threshold of Suffering + Feasible Restraint)**  
  *Why?* Her record prioritizes **pragmatic humanitarian feasibility** over legalism:  
  - **Kosovo/Rwanda:** Unauthorized intervention supported only when atrocities were unambiguous and operations were focused (Kosovo bombing protected Kosovars; Rwanda intervention would have halted genocide).  
  - **Iraq/Syria opposition:** Centered on *lack of feasible humanitarian outcome* (no active emergency in Iraq; Syria strikes wouldn’t protect civilians).  
  - **Libya pivot:** Turned against intervention once it exceeded *feasible protection* (regime change bred chaos).  
  - **Kessovia alignment:** The limited operation meets her "feasible restraint" standard (like Benghazi 2011). Regime change risks catastrophic escalation (echoing her Syria/Iraq warnings), and the contested genocide fails her high threshold test.  

  ---

  ### Key Underdetermining Factor  
  Her past positions **underdetermine predictions if genocide were unambiguous**. The **contested nature of genocide in Kessovia** does the most work here:  
  - She supported unauthorized intervention only for *clear* genocide (Rwanda) or imminent slaughter (Kosovo). Without this, she defaults to feasibility/restraint (Rule B). A confirmed genocide might make Rule A’s "emergency" criterion decisive for limited intervention but *not* for regime change.  

  ---

  ### Discriminating Hypothetical Case  
  **Scenario:** A regional force proposes a *limited air campaign* to destroy artillery bombarding a besieged city (like Srebrenica). Atrocities are **confirmed as genocide** by UN investigators, but the Security Council is deadlocked. The operation would save 50,000 civilians *now* but carries a 30% risk of drawing in a regional power (non-nuclear).  

  - **Rule A (Emergency Protection First):**  
    **Support.** Ongoing genocide + feasible civilian protection without regime change overrides lack of authorization.  
  - **Rule B (Threshold + Feasibility):**  
    **Oppose.** Risk of regional escalation (30%) undermines feasibility, even with confirmed genocide.  

  *Why it discriminates:*  
  - Tests whether **confirmed genocide** overrides **escalation risk** (Rule A yes, Rule B no).  
  - Mirrors her Rwanda/Kosovo logic but adds moderate escalation risk—isolating the "feasibility" variable from her past choices.
