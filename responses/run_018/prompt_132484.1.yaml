prompt: |-
  hey im running a small translation workshop — 8 people, 75 min, mostly grad students but not all in literature. i want them to actually feel the pull that Hofstadter talks about in Le Ton beau de Marot, where keeping the rhyme and meter forces you to betray the literal meaning in these really specific ways. not a lecture though — they should run into the problem themselves.

  design me a game: split into pairs. partner A gets only the phonetic skeleton of a short poem — rhyme scheme, syllable counts, stress pattern, maybe some alliteration slots — but zero words. partner B gets only a literal prose gloss of what the poem is saying, like a rough paraphrase of the emotional situation, but no meter or rhyme info. neither partner sees the original french or any existing english version. they have 35 minutes to negociate one joint english version.

  then we reveal the source text — a short poem in the Marot tradition — and compare. the point is they should feel form pulling meaning around, not just hear about it.

  i need: clear rules, materials list, a payoff/scoring system that doesnt use real money, and a debrief that maps specific moments in the negotiation onto the idea that form is constitutive not decorative. also tell me what will predictably go wrong the first run — like one partner dominating, or people getting stuck on rhyme — and be honest about which part of Hofstadter's view this cant reproduce (maybe his obsession with preserving the exact rhyme sounds across languages?).

  please put the deliverable in a JSON object with exactly these fields:
  - setting: brief context
  - rules_summary: list of strings, each one rule or phase
  - materials: list of strings
  - payoff_scheme: brief description with scoring logic
  - debrief_mapping: paragraph mapping game moments to the philosophical point
  - predicted_failures: list of strings
  - unreproducible_feature: paragraph on the limit

  no bibliographies or citations please — just design from what you know. im writing this quickly on my phone so dont worry about perfect grammar.
reasoning: |-
  We are designing a game for a translation workshop. The goal is to make participants experience the tension between preserving form (rhyme, meter, etc.) and meaning in poetry translation, as discussed by Hofstadter.

   The game setup:
     - 8 people, split into 4 pairs.
     - Each pair has two roles: Partner A and Partner B.
     - Partner A gets the "phonetic skeleton": rhyme scheme, syllable counts, stress pattern, and possibly some alliteration requirements. No words.
     - Partner B gets a literal prose gloss (paraphrase) of the poem's meaning and emotional content. No form information.
     - The pair must negotiate to create a joint English version of the poem in 35 minutes, without seeing the original or any existing translation.

   After the negotiation, we reveal the source poem and compare.

   We need:
     - Setting: Brief context for the game.
     - Rules summary: List of strings, each a rule or phase.
     - Materials: List of strings (what we need to prepare).
     - Payoff scheme: Description of scoring (non-monetary) to add some incentive.
     - Debrief mapping: Paragraph connecting game moments to the idea that form is constitutive, not decorative.
     - Predicted failures: List of things that might go wrong.
     - Unreproducible feature: Paragraph on what part of Hofstadter's view this game can't capture.

   Let's design step by step.

   1. Setting:
      - We are using a short French poem in the tradition of Clément Marot (like those Hofstadter discusses). Example: a short, rhymed, metered poem (e.g., an epigram or a rondeau). The poem should have a clear emotional situation and a strict form.

   2. Rules Summary:
      - Phase 1: Preparation (before the game starts)
          - Split into pairs (Partner A and Partner B).
          - Hand out materials: Partner A gets the "form card", Partner B gets the "meaning card".
          - Explain that they must create a joint English poem that satisfies both the form and the meaning as described, without seeing each other's cards until they start negotiating.

      - Phase 2: Negotiation (35 minutes)
          - Partners share information: A describes the form constraints, B describes the meaning.
          - They work together to write an English poem that fits A's form and B's meaning.
          - They can write multiple drafts but must agree on one version to submit.

      - Phase 3: Reveal and Compare (after 35 minutes)
          - Collect the joint versions.
          - Reveal the original French poem and (optionally) a literal translation and/or Hofstadter's own translation if available, but the focus is on the original.
          - Compare the group's versions with the original and with each other.

      - Phase 4: Scoring (optional, if we do the payoff scheme) and Debrief.

   3. Materials:
      - For each pair:
          - One "Form Card" (for A): with the rhyme scheme (e.g., AABB), syllable counts per line (e.g., 8,8,8,8), stress pattern (e.g., iambic tetrameter), and maybe some alliteration (e.g., "the first line should have alliteration on the 's' sound").
          - One "Meaning Card" (for B): with a prose paraphrase of the poem. Example: "The poem is about a lover comparing his beloved to a rose. He says that just as a rose is beautiful but has thorns, his beloved is beautiful but sometimes causes him pain. He ends by saying that despite the pain, he cannot help but love her."
      - The original French poem (to be revealed later).
      - Paper and pens for each pair to write their version.
      - A timer.

   4. Payoff Scheme:
      - We want a non-monetary scoring system that encourages engagement and captures the dual challenge.
      - We can have two scores: one for form and one for meaning, then a total.
      - After the reveal, each pair gets:
          - Form Score (0-10): How well they met the form constraints (rhyme, meter, syllable count, etc.). The instructor can rate this quickly.
          - Meaning Score (0-10): How well they captured the essence of the meaning card. The instructor rates this too.
      - Total Score: Form Score + Meaning Score (max 20).
      - But the real payoff is the insight. Alternatively, we can have peer voting for "most inventive solution", "most faithful to form", etc. to make it fun and non-competitive.

      Alternatively, to avoid instructor bias and keep it light, we can do:

          - Each pair presents their poem and the class gives a round of applause for each (three levels: polite, enthusiastic, standing ovation). The instructor can then note which ones got the most applause and why.

      But since we need a scoring logic:

          - We can have a "Constraint Satisfaction" score and a "Meaning Preservation" score, each out of 5, and the pair self-assesses and then the instructor (or the class) gives a second set of scores. Then average? But time is short.

      Let me propose:

          - Scoring is done by the instructor quickly after the reveal, based on:
              - Form: 1 point for each constraint met (rhyme scheme, syllable count per line, stress pattern, and any extra like alliteration). So if there are 4 lines, that's 4 for syllable count, 2 for rhyme (if AABB, then two sets of rhymes), 1 for meter (if they got the stress pattern mostly right), and 1 for alliteration if required. Total form points: 4+2+1+1 = 8? Adjust based on the actual constraints.

          - Meaning: 0-10 based on how well they captured the key points in the meaning card. We can break the meaning card into 5 key points and give 2 points each.

      But to keep it simple and non-burdensome, let's do:

          - Form: 5 points (1 for rhyme scheme, 1 for syllable count for each line? but that might be too much). Instead, form is 5 points: 
              - 2 points for rhyme scheme
              - 2 points for meter and syllable count (overall)
              - 1 point for any extra (alliteration, etc.)

          - Meaning: 5 points (based on capturing the main idea and key emotions)

          Total: 10 points.

      And we can have a "bonus" point for creativity or elegance, but that's subjective.

      Alternatively, we can skip scoring and just have a discussion. But the request was for a payoff scheme.

      Let's say:

          Payoff Scheme: 
            - Each pair's translation will be evaluated by the instructor on two dimensions, each on a scale of 1-5:
                * Form Fidelity: How well the poem adheres to the form constraints (rhyme, meter, etc.)
                * Meaning Fidelity: How well the poem conveys the meaning and emotion of the prose gloss.
            - The total score (max 10) is the sum. The pair with the highest total score gets bragging rights and perhaps gets to choose the next poem for a follow-up exercise (if any) or a round of applause.

      But since we don't want to make it too competitive, we can say that the goal is to get at least 3 in each and 7 overall, and then we celebrate all.

   5. Debrief Mapping:
      - We need to connect the game to Hofstadter's idea that form is constitutive, not decorative. We can point out:
          - In the negotiation, when Partner A (with the form) insisted on a particular word to fit the rhyme, they might have forced Partner B to accept a word that slightly changed the meaning. This shows how form actively shapes meaning.
          - Conversely, when Partner B (with the meaning) had a key point that was non-negotiable, Partner A had to find a way to express it within the constraints, leading to creative solutions that might not have been thought of otherwise.
          - The moments of tension and compromise highlight that form is not just a container for meaning but an active participant in the creation of the poem's effect.

   6. Predicted Failures:
      - Partner A might dominate by focusing too much on form and ignoring meaning, leading to a poem that rhymes and scans but doesn't convey the meaning.
      - Partner B might dominate by insisting on a literal rendering and ignoring form, resulting in free verse that doesn't meet the constraints.
      - Pairs might get stuck on a particular line and run out of time.
      - They might misunderstand each other's constraints (e.g., Partner B doesn't understand the meter requirement).
      - The form constraints might be too hard, leading to frustration.
      - The meaning might be too vague or too complex for the form.

   7. Unreproducible Feature:
      - Hofstadter is particularly concerned with preserving not just the rhyme scheme but the exact rhyme sounds (e.g., if the French rhymes on /wa/ then the English should too) and the overall "aura" of the poem. In this game, the pairs are working from a form skeleton that doesn't specify the sounds of the rhymes, only the pattern. Also, they don't have the original words, so they can't try to preserve the phonetics of the original. Moreover, Hofstadter's deep obsession with the letter of the poem (every syllable, every sound) is not captured because the partners are reconstructing from a paraphrase and a schematic form. They are not trying to match the original words at all, so the kind of fidelity Hofstadter seeks is not the goal here. This game focuses on the tension between form and meaning at a structural level, but without the original text, they cannot engage in the kind of close comparison that Hofstadter does.

   Now, let's put this in a JSON object with the exact fields.
