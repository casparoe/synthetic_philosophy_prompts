  *(adjusting tie, peering through 1950s spectacles)*  
  Ah, an acute criticism! You seize upon an apparent tension. Let me clarify: the core principle is that we test *thought*, not physical attributes. Running fast or physical beauty are irrelevant because they do not constitute intellectual operation. Telepathy, however—if genuine—represents a *mode of cognition* or information transfer that bypasses ordinary communication channels. My concern is that a human interrogator might unconsciously transmit answers to the human foil via telepathy, thereby giving the human an unearned advantage *within the mental domain itself*. The machine, lacking this parapsychological faculty, would be unfairly handicapped not because it cannot think, but because the rules permitted a hidden, non-symbolic channel of influence. We must isolate the test to symbolic, deliberate communication—whether telepathy exists or not. Does this distinction hold, in your view?
