answer: |-
  ## 50-Minute Seminar Plan: The Problem of Universals

  **Conceptual Dependency Brainstorm:**  
  *Before recognizing the problem, students must grasp:*  
  1.  **Particularity:** That concrete objects (e.g., *this* apple, *that* chair) exist as distinct, individual entities.  
  2.  **Predication/Attribution:** That we meaningfully apply the *same* general term (e.g., "red", "chair") to multiple distinct particulars.  
  3.  **Genuine Sameness vs. Mere Similarity:** That predication often points to a perceived *identical* feature shared ("both are *exactly* red #FF0000") rather than just "looking alike" ("both are shades of red, but different ones").  
  4.  **The Implied Question:** Grasping (1), (2), and (3) naturally raises the metaphysical question: *What grounds this genuine sameness? What is the ontological status of this shared feature?* This *is* the problem of universals.

  ---

  **Seminar Plan:**

  **1. Carrying Example: "Being a Chair" (10 mins)**
      *   **Case:** A beanbag chair, a wooden throne, and a metal folding stool.
      *   **Why it Works:**
          *   **Genuine Kind Sameness:** All are uncontroversially called "chairs" despite having *no* shared physical matter, shape, structure, or material composition. Their sameness is purely functional/categorical ("something for sitting").
          *   **Radical Physical Difference:** Highlights that the shared property isn't reducible to physical similarity. Eliminates the easy "they look alike" intuition.
          *   **Avoids Resemblance/Family Resemblance:** Unlike "games" (Wittgenstein), "chair" has a core functional criterion (sitting), not just overlapping similarities. While borderline cases exist (e.g., a stool?), the core cases presented lack resemblance chains.
      *   **Core Question Posed:** "What *is* this identical property 'being a chair' that these radically different physical objects all possess? *Where* does it exist?"

  **2. Sequence & Justification (30 mins)**
      *   **(A) Realism (Platonic Flavor - Simplified) (10 mins):**
          *   **Position:** The universal *Chairhood* is a single, real, non-physical, mind-independent entity. Each particular chair (beanbag, throne, stool) *participates in* or *instantiates* this one universal. The universal is wholly present in each instance.
          *   **Why First?** It directly answers the posed question ("What is the shared thing?") in the most ontologically committed way, aligning with the strong intuition of genuine sameness. Provides a clear target for subsequent critiques.
      *   **(B) Nominalism (Introducing Trope Theory Here) (15 mins):**
          *   **Step 1: Class/Resemblance Nominalism (Simplified):** There is no universal *Chairhood*. Only particular chairs exist. We group them under the name "chair" because they resemble each other sufficiently *or* we decide to classify them together based on our interests. "Chair" is just a name or a class label.
              *   **Critique (Posing the Problem):** Does resemblance explain sameness, or presuppose it? What counts as "sufficient" resemblance without *already* knowing the kind? The functional sameness of the chairs seems deeper than mere resemblance.
          *   **Step 2: Introducing Trope Nominalism (Middle Option):** There are no universals, but properties *do* exist as particular instances – **tropes**. Each chair has its *own* particular "chairhood-trope". Sameness is explained by the *exact similarity* of these distinct tropes. The beanbag has trope B (chair-trope), the throne has trope T (chair-trope), etc.; B and T are numerically distinct but exactly similar properties.
          *   **Why This Order?** Realism sets the strong ontological claim. Moving to nominalism shows the radical alternative ("only particulars exist"). Introducing *tropes* immediately after criticizing resemblance/class nominalism addresses the intuition that properties *are* real features of objects without committing to universals, providing a crucial stepping stone before conceptualism. It highlights the spectrum within nominalism.
      *   **(C) Conceptualism (5 mins):**
          *   **Position:** Universals exist, but not mind-independently. *Chairhood* is a mental concept or representation formed by our minds by abstracting common features from our experiences of particular chairs. The sameness resides in our conceptual framework.
          *   **Why Last?** It builds on the nominalist critique of mind-independent universals but offers a positive account of shared properties grounded in cognition, differing from nominalism's focus on particulars/language. Placing it last avoids conflating it with nominalism early on.

  **3. Misconception Map (Integrated into Sequence)**
      *   **During Realism (A):**
          *   **Misconception:** Realism means there's a tiny, ghostly "chair-copy" inside each physical chair (reification).
          *   **When to Head Off:** Immediately after stating the position.
          *   **Correction:** "Realism posits a *single*, non-physical, abstract entity (Chairhood) that is *wholly present* in each instance, not a physical part or copy."
      *   **During Nominalism (Step 1 - Class/Resemblance) (B):**
          *   **Misconception:** Nominalism means properties like "red" or "chair" don't exist *at all*; it's just words/arbitrary grouping.
          *   **When to Head Off:** When contrasting it sharply with realism's ontological commitment.
          *   **Correction:** "Nominalism denies *universals* exist as distinct entities, but standard versions *do* acknowledge the reality of particular properties (like *this* redness, *that* shape) or resemblance relations."
      *   **During Conceptualism (C):**
          *   **Misconception:** Conceptualism means "chair" is just my personal opinion; if I think a rock is a chair, it is (subjectivism).
          *   **When to Head Off:** When explaining the mental concept.
          *   **Correction:** "Conceptualism grounds universals in *shared*, intersubjective mental frameworks built from experience and language, not individual whim."

  **4. Functional-Kind Test: "Being a Bug" (5 mins)**
      *   **Case:** A crash bug in v1.0 (null pointer exception), a performance bug in v2.0 (infinite loop), and a UI rendering bug in v3.0 of the same software.
      *   **Application:** Ask students to analyze what "being a bug" means across these instances using the three frameworks.
      *   **Signs of Success:** Recognizing the shared functional property ("unintended, undesirable software behavior") despite different mechanisms/causes. Applying realism (Universal *Bughood*), nominalism (class/tropes of bugs), conceptualism (software engineer's concept of a bug).
      *   **Signs of Confusion:** Focusing *only* on causal similarity (e.g., "they all involve code errors" - true but ignores the functional sameness) or reducing it solely to consequence ("they all make users unhappy") without identifying the shared categorical property.

  **5. Check for Understanding Question (Final 2 mins)**  
  *"A biologist discovers two unrelated species, one deep-sea fish and one desert lizard, that independently evolved near-identical camouflage patterns for their respective environments. According to the three positions we discussed (Realism, Nominalism - including tropes, and Conceptualism), what is the status of the property 'having camouflage' shared by these patterns? How would each explain this sameness?"*  
  *(Distinguishes Comprehension: Requires applying the core distinctions to a novel case involving functional similarity without shared ancestry or universal physical structure, adjudicating between positions.)*

  **6. Deliberate Omissions & Justification**
      *   **Plato's "One Over Many" Argument:** Too dialectically complex/textual for this first encounter; focus is on the core problem structure, not historical arguments.
      *   **Aristotelian Immanent vs. Platonic Transcendent Forms:** Requires deeper metaphysical context; simplified realism suffices for presenting the core alternatives.
      *   **Formal Set-Theoretic Accounts of Class Nominalism:** Too technical; the basic idea of classes/labels is sufficient at this level without set theory.
      *   **Nuances of Resemblance Nominalism (e.g., primitive resemblance vs. comparative similarity):** Beyond introductory scope; the core challenge to resemblance is enough.
      *   **Detailed Historical Debate Timeline/Figures:** Focus is on the conceptual problem and core solution types, not history of philosophy survey.
      *   **Higher-Order Universals (e.g., Redness vs. Color):** Adds unnecessary complexity; first-order properties are challenging enough.
      *   **Justification:** This audience (2nd years, intro logic, no Plato) needs a clear, conceptually focused introduction to the *problem itself* and the *most fundamental types of solutions*. Adding historical detail, advanced arguments, or technical machinery would obscure the core metaphysics and overwhelm students. The goal is foundational comprehension, not comprehensive coverage.
