  ### Classroom Activity: Conditional Betting Paradox  
  **Objective:** Experience the inconsistency in pricing indicative conditionals via Ramsey test.  
  **Materials:** Dice (1 per team), index cards (for bets), poker chips (20 per team), whiteboard.  
  **Teams:** 4 teams of 4–5 students.  

  ---

  #### Rules & Setup  
  1. **Core Bet:** On a die roll, bet on *"If A then C"* (A: roll 1 or 2; C: roll 2 or 3).  
     - **Ramsey pricing:** Teams set bid/ask prices (initially 0.5, as P(C|A) = 1/2).  
     - **Trade mechanic:** Teams post prices; others buy/sell conditional bets at these prices.  
     - **Bet payoff:**  
       - A and C: win 1 chip  
       - A and not C: lose 1 chip  
       - Not A: void (no gain/loss)  

  2. **Arbitrage Conditions:**  
     - **Partition challenge:** Any team can challenge another to price the conditional split on an event **B** (e.g., B = "roll even").  
     - **Valid B:** Must be *possible* (P(B) > 0, P(not B) > 0) and *compatible with A* (A and B, A and not B both possible).  
     - **Nested pricing:** Challenged team sets Ramsey prices for:  
       - "If B, then [if A then C]" → Price P₁  
       - "If not B, then [if A then C]" → Price P₂  
     - **Arbitrage trigger:** If initial price P ≠ P₁·P(B) + P₂·P(not B), challenger executes:  
       - Sell 1 conditional bet at P (to challenged team).  
       - Buy P₁ if B occurs, P₂ if not B occurs (at challenged team’s prices).  
       - **Result:** Challenged team loses |P - (P₁·P(B) + P₂·P(not B))| chips.  

  3. **Costs & Constraints:**  
     - **Price revisions:** Each change widens bid-ask spread by 0.1 chips (e.g., 0.4/0.6 → 0.3/0.7).  
     - **Partition veto:** Teams can reject invalid B (e.g., B = "roll 1" fails compatibility).  

  ---

  #### Timeline (75 min)  
  - **0–10 min:** Intro + team setup. Define A, C, Ramsey pricing. Teams set initial prices (0.5) for core bet.  
  - **10–25 min: Initial arbitrage round**  
    - Instructor forces trade: Sell core bet to each team at 0.5.  
    - Teams then price event "A and C" (expected 1/6).  
    - Instructor buys "A and C" bet at team’s ask price (e.g., 1/6).  
    - **Outcome:** Teams lose 0.5 - 1/6 ≈ 0.33 chips (net liability mismatch).  
  - **25–40 min: Revision + partition challenges**  
    - Teams adjust prices (widen spread) or propose partitions.  
    - **Critical example:** If B = C, nested prices are P₁ = 1 (given C, P(C|A)=1), P₂ = 0 → Weighted price = 1/3. Gap from 0.5 allows arbitrage.  
    - **Inert partition:** B = "even" → P₁ = 1 (even world), P₂ = 0 (odd world) → Weighted price = 0.5 (no gap).  
  - **40–55 min: Exit auction**  
    - Teams declare which assumption to abandon:  
      - **1:** Ramsey equation (P(if A then C) = P(C|A)).  
      - **2:** Conditional is ordinary bettable proposition.  
      - **3:** Ramsey test under supposition (nested use).  
      - **4:** Price coherence (law of total probability).  
    - Final round: Teams refuse bets violating their exit (e.g., exit #2 skips partition bets).  
  - **55–65 min:** Settle final bets with die rolls.  
  - **65–75 min: Debrief**  
    - **Key moments:**  
      - Initial loss (10–25 min) → Exposes assumption clash (1 + 2 + 4).  
      - Partition C bite (25–40 min) → Uses assumption 3.  
      - Exit auction → Each option avoids one arbitrage but weakens framework.  
    - **Reveal:** "Lewis triviality" = All 4 assumptions force independence (P(C|A) = P(C)).  
    - **Unmodeled feature:** Algebra proves *all* correlations break; game shows one case.  

  ---

  #### Predictable Issues  
  - **Truth-functional teams:** Some may price conditional as material implication (P=5/6). **Do not shut down**—let them take arbitrage losses to disprove it.  
  - **Stale prices:** Teams that don’t revise fast enough bleed chips.  
  - **Partition confusion:** Clarify that B must be possible and A-compatible (e.g., reject B = "roll 3" if A requires 1/2).  
  - **Limited realism:** Game cannot show the *universality* of the paradox—assert that any correlated pair breaks unless independent.  

  **Debrief tagline:** "Your chips vanished because Ramsey + coherence + propositions = only independent events. Lewis proved no escape is free."  

  ---  
