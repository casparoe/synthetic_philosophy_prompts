          Each team must post a bid and ask for the conditional bet. They set the price using the Ramsey test: 1/2.
          Then, the opposing teams (or the house, but we don't have a house; we can have teams trade with each other) can trade with them.

          But to force the arbitrage, we will have an automated trade: the instructor will act as the arbitrageur.

     Alternatively, we can have one team be the market maker and the others can try to arbitrage.

     Given the constraints, we will have each team be a market maker for their own conditional bet. Then, the instructor will visit each team and execute the arbitrage trade:

          - Sell the conditional bet to the team at their ask price (1/2). (So the team pays 1/2 to the instructor for one conditional bet.)
          - Then, the instructor will also approach the team to buy a bet on the event "A and C" at the team's bid price for that event. What should the team's bid price for "A and C" be? They should set it at the expected value, which is 1/6.

          So the instructor buys the bet on "A and C" from the team at 1/6 (so the team receives 1/6 and will have to pay 1 if "A and C" occurs).

     Now the team has:
          Cash flow: -1/2 (paid for the conditional bet) + 1/6 (received for the event bet) = -1/3.

          And they have liability:
              From the conditional bet they sold: they will have to pay 1 if A and C occurs, and 0 otherwise.
              From the event bet they sold: they will have to pay 1 if A and C occurs.

          So if A and C occurs, they pay 1 for the conditional bet and 1 for the event bet -> total 2, but they only have the conditional bet liability for the conditional bet they bought? Let's clarify:

            The conditional bet they bought: they are the buyer, so they will receive 1 if A and C occurs, 0 if A and not C occurs, and nothing if not A.

            The event bet they sold: they will pay 1 if A and C occurs.

          So in the event A and C:
              They receive 1 from the conditional bet (as buyer) and they pay 1 for the event bet -> net 0.

          In the event A and not C:
              They receive 0 from the conditional bet and they pay nothing for the event bet (since event bet only pays on A and C) -> net 0.

          In the event not A:
              They receive 0 from the conditional bet and pay nothing for the event bet -> net 0.

          So overall, they are down by the initial cash flow of -1/3.

     This is an arbitrage loss.

     Then, the team sees that they lost chips.

     To incorporate the partition choice: 

          The instructor can ask the team to set prices for bets on the conditional in the context of other events. In particular, they might be asked to set a price for the conditional given that the roll is even.

          For example, split by even and odd.

          Even: rolls 2,4,6
          Odd: rolls 1,3,5

          Then, in the even world:
              A: 1 or 2 -> 2 is even, so A is possible.
              C: 2 or 3 -> 2 is even.
              P(C|A) in the even world: given even, then the possible rolls are 2,4,6. A is {2} (since 1 is odd, not even), C is {2}. So P(C|A) = 1.

          In the odd world:
              rolls 1,3,5.
              A: 1 or 2 -> 1 is in, 2 is even so not in -> only 1.
              C: 2 or 3 -> 3 is in.
              P(C|A) = P(C|A in the odd world) = P(3 | {1}) -> but 3 is not in the set {1}? It's 0.

          So the team would set: in the even world, the conditional is 1, in the odd world, 0.

          Then, the law of total probability would give: 1 * P(even) + 0 * P(odd) = 1/2.

          This matches their initial price, so no arbitrage from this split.

     So teams can be challenged to find splits that bite.

     Given the complexity, we will design the activity with the following rounds:

     Materials: 
          - One die per team (or one shared die)
