     To honor the request, we will design the activity as follows:

     Teams will post a price for the conditional bet on "if A then C". They will also be required to post prices for other bets, including bets on C itself, and bets on the conditional in the partitioned worlds.

     But to keep it within one die roll and avoid truth-value assignments, we will use the replication by "A and C".

     Activity outline:

