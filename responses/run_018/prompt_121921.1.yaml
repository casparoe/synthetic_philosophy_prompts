          2. They may also be asked to make markets on other events, but initially only the conditional.

     Round 1 (10 minutes):

          - Teams set bid and ask for the conditional bet using the Ramsey test: should be 1/2.
          - They must post these prices.
          - Then, the instructor (or appointed arbitrageur) will:
               - Sell one conditional bet to the team at their ask price (1/2) -> the team pays 1/2 to the arbitrageur.
               - Then, the arbitrageur will ask the team to make a market on the event "A and C" (which is the event of rolling a 2).
          - The team sets a bid and ask for the event "A and C". They should set the bid at <= 1/6 and ask at >= 1/6.
          - The arbitrageur buys one unit of "A and C" from the team at the team's ask price (>=1/6, say 1/6).
               -> the team receives 1/6.

          - Net, the team has paid out: 1/2 - 1/6 = 1/3.
          - Then the die is rolled. Regardless of the outcome, the team's net liability is 0 (as shown above), so they are down 1/3.

     Round 2 (10 minutes):

          - Teams are told that they can revise their prices, but each revision widens the spread by a fixed amount (say 0.1 chips) or costs a chip to revise.
          - Teams may change their prices for the conditional bet.
          - Also, they are now allowed to make markets on other events, including partitions proposed by other teams.

     Round 3 (20 minutes): 

          - Teams can challenge other teams by proposing a partition (an event B and not B) that must be possible (both B and not B have positive probability and both are compatible with A).
          - The challenged team must then set prices for the conditional bet in the context of B and in the context of not B, using the Ramsey test in each context.
          - Then, the challenging team can make a composite trade: 
               - They will buy/sell the conditional bet at the initial price.
               - And they will buy/sell the two new conditionals (conditional on B and on not B) at the prices set in the context.

          - The composite trade should be structured to arbitrage if the initial price does not equal the weighted average of the two new prices.

          - Example: if the team's initial price for the conditional is P, and for the new conditionals they set P_B and P_{not B}, then the weighted average is P_B * P(B) + P_{not B} * P(not B).
            if P > weighted average, then the challenging team can:
                 - Sell the initial conditional at P.
                 - Buy the composite of the two new conditionals at the weighted average.
            and vice versa.

          - But the new conditionals are defined on a partition and are not the same as the original conditional. However, if the team believes in the Ramsey test and that the conditional is an ordinary proposition, then the composite should replicate.

     This is complex. Given time, we might skip to the exit auction.

     Exit auction (15 minutes):

          - Each team must choose which assumption to abandon:

               Option 1: The Ramsey test for the conditional probability (so they will not set the price to P(C|A)).
               Option 2: The idea that the conditional is an ordinary proposition.
