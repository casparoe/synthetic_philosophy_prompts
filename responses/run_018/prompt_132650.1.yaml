answer: |-
  ### Exam Prompt (90 minutes, ~700 words)
  **Critically evaluate the following ethical extension of Gödel's first incompleteness theorem:**  
  A philosopher contends that any "complete" normative ethical theory, if formulated as an effectively axiomatized formal system capable of representing arithmetic concepts (e.g., moral propositions mapped to arithmetical statements), must contain objectively true moral judgments it cannot derive from its own axioms. This purportedly compels moral realists into an infinite Gödelian hierarchy of increasingly expressive meta-ethical frameworks to "capture" these unprovable truths.  

  **Your task:**  
  1. State the precise formal conditions required for Gödel’s first incompleteness theorem to apply (address effective axiomatization, consistency, omega-consistency, and arithmetic expressibility of syntax/proof).  
  2. Analyze whether a normative ethical theory could satisfy these conditions. Identify and justify at least *two* conditions it demonstrably fails to meet. Avoid dismissing the analogy solely on non-formal grounds (e.g., "ethics isn’t mathematical").  
  3. Explain why the failure of these conditions invalidates the proposed "Gödelian hierarchy" for moral realism.  

  ---

  ### Model Answer (450 words)  
  Gödel’s first incompleteness theorem requires: (1) **Effective axiomatization** (recursively enumerable axioms), (2) **Consistency** (no contradictions), (3) **Omega-consistency** (no proofs of ¬P(n) for each natural number n while proving ∃x P(x)), and (4) **Sufficient arithmetic strength** to encode its own syntax and proof relations via recursive functions (e.g., represent provability predicates arithmetically).  

  The ethical extension fails because normative theories cannot satisfy condition (4). Gödel numbering requires a *fixed, recursive mapping* between syntactic elements (e.g., symbols, formulas, proofs) and natural numbers. Ethical systems lack the requisite syntax: moral propositions (e.g., "killing is wrong") do not possess the combinatorial structure of formal arithmetic. While one might *assign* numbers to moral statements ad hoc, this does not entail that the theory’s *internal operations* (e.g., moral deduction rules) recursively mirror arithmetic operations. Without this, the system cannot arithmetically express its own proof predicate—a necessity for constructing the Gödel sentence.  

  Additionally, **omega-consistency** is inapplicable. This condition presumes a domain of natural numbers with quantifiers ranging over them. Ethical systems quantify over moral agents, acts, or states—not numbers. Even if "moral arithmetic" were artificially imposed (e.g., quantifying over counts of actions), the theory lacks axioms governing *arithmetical* operations to sustain omega-consistency violations. For instance, proving "for every n, n acts of kindness are good" while proving "not all acts of kindness are good" is a logical contradiction, not an omega-inconsistency.  

  Consequently, the Gödelian hierarchy argument collapses. The theorem’s "unprovable truth" arises specifically from a system’s ability to *internally represent* its own unprovability. Since ethical systems cannot achieve this self-referential encoding, there is no grounded analogy to incompleteness. Moral realists may still require meta-ethical progression, but not due to Gödelian mechanisms. The failure to meet arithmetic expressibility and omega-consistency means no Gödel sentence exists for the ethical system, rendering the hierarchy claim unmotivated by the theorem.  

  ---

  ### Marking Scheme  
  An **A-grade** response must:  
  1. **Explicitly list all four formal conditions** (effective axiomatization, consistency, omega-consistency, arithmetic expressibility of syntax/proof) without omission.  
  2. **Correctly identify arithmetic expressibility as the primary failure point**, explaining why moral syntax cannot support Gödel numbering (e.g., absence of recursive combinatorial structure for arithmetization).  
  3. **Identify a second formal mismatch** (e.g., omega-consistency’s dependence on quantification over natural numbers, not moral entities).  
  4. **Argue formally**, not intuitively (e.g., not "ethics is subjective" but "the system lacks operators to define primitive recursive functions over moral propositions").  
  5. **Link failures to the hierarchy’s invalidation** by showing no Gödel sentence can exist.  
  A **B-grade** response may:  
  - Miss one formal condition or misstate omega-consistency.  
  - Correctly note arithmetic expressibility failure but with incomplete justification.  
  - Invoke non-formal criticisms (e.g., "morality isn’t axiomatic") alongside valid points.  
  - Neglect to connect the technical failures to the hierarchy argument’s collapse.
