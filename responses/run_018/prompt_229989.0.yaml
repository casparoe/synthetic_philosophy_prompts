answer: |-
  ### Epistemology Stakes Quiz: Where Do You Stand?

  Below is a web quiz designed to sort you into one of five epistemological positions based solely on your intuitions about concrete scenarios. **No prior philosophy knowledge is needed**—just read each short story and pick the option that feels right. We'll analyse your pattern of answers at the end. All terms are in British English (e.g., "sceptic", "analyse").

  ---

  #### Quiz Questions  
  *For each scenario, select the answer that matches your intuition.*

  1. **Bank Case (Low Stakes)**  
     Hannah plans to deposit a cheque on Saturday. It’s not urgent—a delay would be a minor inconvenience. She remembers visiting the bank on a Saturday two weeks ago. Based on this, she thinks, "The bank is open tomorrow."  
     **Does Hannah know the bank is open tomorrow?**  
     A) Yes, she knows.  
     B) No, she doesn’t know.  

  2. **Bank Case (High Stakes)**  
     Same as above, but if Hannah doesn’t deposit the cheque by Saturday, she will default on her mortgage and lose her home. She has the same evidence (her visit two weeks ago).  
     **Does Hannah know the bank is open tomorrow?**  
     A) Yes, she knows.  
     B) No, she doesn’t know.  

  3. **Airport Case (Low Stakes)**  
     Mary checks her flight itinerary, which says her plane stops in Chicago. She has no reason to doubt it. If she’s wrong, it won’t matter much—she’s just passing through.  
     **Does Mary know the flight stops in Chicago?**  
     A) Yes, she knows.  
     B) No, she doesn’t know.  

  4. **Airport Case (High Stakes)**  
     Same as above, but Mary is a courier delivering a life-saving organ to Chicago. If the flight doesn’t stop there, a patient will die. She has the same evidence (the itinerary).  
     **Does Mary know the flight stops in Chicago?**  
     A) Yes, she knows.  
     B) No, she doesn’t know.  

  5. **Lottery Case (Low Stakes)**  
     Tom buys a lottery ticket with 1-in-10-million odds. He says, "I know I won’t win." Losing is expected—winning would be a fun surprise but wouldn’t change his life. He has no insider information.  
     **Does Tom know he won’t win?**  
     A) Yes, he knows.  
     B) No, he doesn’t know.  

  6. **Attributor High Stakes, Subject Low Stakes**  
     Hannah (in a low-stakes bank situation, as in Q1) tells her friend, "I know the bank is open tomorrow." The friend faces high stakes (she’ll lose her home if deposits are delayed). The friend asks, "Do you *really* know that?"  
     **Is Hannah correct to claim she knows?**  
     A) Yes, Hannah knows (her claim is true).  
     B) No, Hannah does not know (her claim is false).  

  7. **Attributor Low Stakes, Subject High Stakes**  
     Hannah (in a high-stakes bank situation, as in Q2) worries about the bank. Her friend, in a low-stakes situation, says: "I know it’s open—I was there two weeks ago!" The friend has the same evidence as Hannah.  
     **Is the friend correct to claim they know?**  
     A) Yes, the friend knows (their claim is true).  
     B) No, the friend does not know (their claim is false).  

  8. **Lottery Case (High Stakes for Attributor)**  
     Tom is in the same low-stakes lottery as Q5. You (the quiz-taker) are about to bet your life savings on Tom losing. You ask: "Does Tom *know* he won’t win?"  
     **What’s your answer?**  
     A) Yes, Tom knows he won’t win.  
     B) No, Tom does not know he won’t win.  

