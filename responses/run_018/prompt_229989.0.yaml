  We are going to create a quiz that sorts people into one of five (or six) epistemological positions based on their intuitions about concrete cases. The positions are:

  1. Moderate Invariantism (MI): Knowledge is invariant; high stakes never destroy knowledge. The high-stakes intuition is explained by what it's rational to assert or act on, not by knowledge itself.
  2. Strict Invariantism (SI): Knowledge is invariant but very hard to achieve; Hannah rarely or never knows. High stakes just make the lack of knowledge obvious.
  3. Contextualism (C): The word 'know' is context-sensitive. The speaker's standards (or the context of ascription) determine the truth of knowledge claims. In high-stakes contexts, the standards go up.
  4. Subject-Sensitive Invariantism (SSI) / Pragmatic Encroachment: The meaning of 'know' is invariant, but whether a subject knows depends on practical factors (stakes) for the subject.
  5. Contrastivism (CV): Knowledge is a three-place relation: S knows that p rather than q. What's at stake changes the relevant alternatives (q) in play.

  We might also consider a sixth position:

  6. Justification-Only Pragmatic Encroachment (JOP): Practical factors affect epistemic justification but not knowledge itself. (But note: if justification is necessary for knowledge, then this might collapse into SSI. Alternatively, it might hold that knowledge requires justification plus other conditions, and stakes only affect justification. However, if stakes destroy justification then they destroy knowledge. So we must be cautious. We'll include it only if we can find a stable version.)

