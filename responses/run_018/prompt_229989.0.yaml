  ### Scoring Key and Position Mapping  
  Based on your answers, we’ll map you to one of five positions. **Match your answers (e.g., 1A, 2B, etc.) to the patterns below.**  

  | Position                          | Answer Pattern (Q1–Q8)       | Core Idea in Plain English |  
  |-----------------------------------|-------------------------------|----------------------------|  
  | **Moderate Invariantism (MI)**    | A, A, A, A, A, A, A, A       | High stakes *never* destroy knowledge. What changes is how cautious you should act—not whether you know. |  
  | **Strict Invariantism (SI)**      | B, B, B, B, B, B, B, B       | Knowledge is extremely hard to get. Hannah rarely "knows" at all—high stakes just make that obvious. |  
  | **Contextualism (C)**             | A, B, A, B, A, B, A, B       | "Know" works like "tall"—its meaning depends on context. In high-stakes chats, standards tighten, so Hannah doesn’t "know" anymore. |  
  | **Subject-Sensitive Invariantism (SSI)** | A, B, A, B, B, A, B, B    | The meaning of "know" is fixed, but whether Hannah *actually* knows shifts with *her* personal stakes. |  
  | **Contrastivism (CV)**            | A, B, A, B, B, A, B, B       | "Know" involves alternatives. Hannah knows in low stakes (only "closed" is an alternative), but not in high stakes (more alternatives matter). |  

  #### How to Interpret Your Result:  
  - **If your pattern matches MI, SI, or C exactly:** You’re cleanly sorted.  
  - **If your pattern matches SSI/CV (A,B,A,B,B,A,B,B):** You’re in the "subject-sensitive" camp (SSI or CV). These agree on all cases here—see limitations below.  
  - **If your pattern doesn’t fit:** Few people perfectly match one position. Review where you diverged—it might hint at hybrid views!  

  ---

  ### Honest Limitations  
  This quiz simplifies complex debates. Here’s where it **can’t reliably distinguish** positions:  
  1. **SSI vs. Contrastivism (CV):** They agree on all cases here. To split them, we’d need cases testing *alternative possibilities* (e.g., "Does Hannah rule out *all* relevant errors?").  
  2. **Contextualism vs. SSI/CV in "mixed stakes" cases:** They diverge in Q6–Q7, but real-world intuitions blur if you imagine the "attributor" and "subject" sharing stakes.  
  3. **Lottery cases:** All positions (except MI) deny "knowledge" in lotteries (Q5/Q8), so they can’t be separated here.  
  4. **Hybrid views:** If you mix answers (e.g., A,B,A,B,A,A,B,B), you might bridge positions (e.g., contextualism with invariantist leanings).  

  Philosophy thrives on boundary cases—this quiz is a starting point, not a final verdict. For deeper exploration, study cases like "zebra/painted mule" (for contrastivism) or "airport with misleading evidence" (for contextualism).  

