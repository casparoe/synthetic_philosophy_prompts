prompt: |-
  I've been thinking lately about how big moral norms just... die. Like slavery wasn't just argued away, right? And dueling didn't disappear because someone proved it was wrong, it was more about honor getting rewired or something. I read a little about Bernard Willams and Kwame Appaih on this — arguments versus intrests versus honor — but I'm not in academia, I just read wikipedia and think too much.

  Here's what's bugging me: people apply this to old stuff like slavery and duels, but what about the small norms that collapse fast now? Like why did everyone suddenly agree smoking in bars was gross, or why do people now apologize for deadnaming in ways they wouldn't have ten years ago? Is honor still running the show but wearing different clothes?

  If I was gonna spend like six months really digging into this — not as a scholer, just as a curious person — which open questions should I actually chase? I don't want a bibliography or anything, I can't check sources well. But tell me: is the main gap figuring out if honor is hidden in modern norm shifts? Or is it whether economic intrests always have to back up moral arguments? Or something else I'm not seeing?

  Please rank the top three lines of work or unanswered problems in this space. For each, say why it's worth my time versus the others — like, does answering it unlock other stuff? Is it something I could actually think through without a PhD? And what would make you change your mind about the ranking? I want to know where to put my energy, not just what's true.
