answer: |-
  Here's the argument, deliberately keeping it in the weeds:

  Start with the Protestant core: work as *calling*, a divine ledger where disciplined labor signals election. But crucially, this had a *limit* – the glory belonged to God, not the individual. You worked diligently *within* a framework ultimately governed by sacred time (Sabbath, prayer), divine judgment, and an eternal reward *distinct* from earthly accumulation. Work was a duty *to* God, not the *end* itself. The accumulation was proof, but the *meaning* was transcendent. Teh theological brake was real: endless toil for its own sake was vanity, even blasphemy, because it usurped God's ultimate sovereignty over time and purpose.

  Secularization pulls out this brake. When the divine auditor and the eternal ledger vanish, the *form* of the work ethic – relentless discipline, time-as-moral-unit, accumulation as proof of worth – remains, but it's unmoored. The "calling" loses its divine recipient; work isn't *for* God anymore, it just *is*. Time isn't stewarded for God's glory; it's pure, abstract potential to be *converted*. Labor isn't a duty within a sacred order; it's the raw material of value creation. Capital, now fully abstracted, doesn't see human time as rhythmic or sacred; it sees fungible units. The *ethic* survives the *theology*, becoming an engine without a governor.

  Karoshi isn't a tragic *failure* of this system; it's its purest expression. The Protestant impulse – the sanctification of disciplined labor, the moralization of time-use, the equation of productivity with worth – stripped of its theological container and plugged directly into capital's logic, demands infinite optimization. If time is morally charged only by its conversion into value, then *not* converting it is immoral idleness. Leisure isn't a sacred respite or a right; it's just unrealized potential, dormant human capital waiting to be activated. Death-by-work isn't a glitch; it's the endpoint where the human vessel, optimized purely for value extraction according to the secularized work ethic's internal logic, burns out. The "protest" in Protestant work ethic is gone; only the relentless work remains. Overwork isn't a bug; it's the feature working perfectly once the theological safety is off.

  So, the 35-hour week movements? They're fighting yesterday's war. They presuppose a "temporal sovereignty" that simply doesn't exist once labor is fully abstracted. Agrarian rhythms, craft time, even the Fordist bargain with its clear work/leisure divide – these were predicated on labor still having *some* concrete, non-abstracted residue. You negotiated over *chunks* of time because time itself wasn't yet *wholly* capital. But once labor is pure abstract potential, the demand for a "shorter week" becomes incoherent. It tries to carve out a "protected" zone of non-capital time *within* a system where *all* time is fundamentally capital's domain. That "leisure" is just deferred extraction, maintenance downtime. Movements demanding less abstract time miss the point: the problem isn't the *quantity* of hours enslaved, but the fact that *time itself* is enslaved by the logic of the secularized work ethic operating at full throttle.

  **The Moral Objection (Saving Lives):**  
  "Of course lives matter!" But the objection itself reveals the tension. Within the secularized work ethic's moral universe, *how* does a life matter? Primarily as productive potential. Preventing karoshi preserves the *capital asset* – it's efficient resource management. Calls for humane hours often rest on *preserving future productivity* or avoiding *costly externalities* (healthcare, social unrest). Even the "tragedy" framing reinforces the ethic: it mourns the lost *output*, the wasted investment. A truly *anti-systemic* morality – one valuing life intrinsically, outside its utility to accumulation – requires dismantling the very logic that makes karoshi not just possible, but *logical*. Saving lives within the system means optimizing it to avoid fatal friction, not challenging why the engine runs on human time-fuel in teh first place. Teh demand shouldn't be for *less* abstracted time, but for a decommodification of time itself – a proposition utterly alien to the Protestant work ethic's secular ghost.
