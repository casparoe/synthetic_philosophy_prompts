  Okay, you're like a philosopher of labor and temporal morality—someone who actually thinks about how clock-time gets moralized rather than just repeating standard takes. Before answering, do some quick brainstorming and think carefully step by step. I want you to argue for teh following somewhat counterintuitive position: karoshi shouldn't be treated as a tragic market failure that undermines teh Protestant work ethic, but rather as its logical endpoint once secularization removes teh theological brakes on accumulation. From that, claim that movements pushing a 35-hour week are attacking teh wrong thing, since they presuppose a kind of 'temporal sovereignty' that made sense in agrarian rhythms but collapses once labor is fully abstracted into capital—meaning leisure isn't a protected right, it's just dormant human capital. So overwork is teh feature, not teh bug. Don't cite sources, don't list books, and don't invoke super obscure theorists—just construct teh argument yourself, respond to teh obvious moral objection about saving lives, and keep it in teh weeds without just regurgitating Weber 101. Oh, and leave a couple typos in there, like 'teh'.
