  #### 🧠 (3) Can a mental check (e.g., doing math, recalling a memory) prove you’re "awake," OR does it fail either way?  
  - **From ANY branch above:**  
    - **A. Mental checks work (you can prove it):** Go to Q4.  
    - **B. Mental checks fail (no proof possible):** Go to Q4.  

