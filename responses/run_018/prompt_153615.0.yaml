    - **B. Asymmetric (butterfly dreaming human is weirder/human is "base"):** Go to Q3.  
  - **From 1B (Waking Breaks Tie):**  
    - **A. Symmetric (both directions possible, but waking > dream):** Go to Q3.  
    - **B. Asymmetric (butterfly dreaming human is weirder/human is "base"):** Go to Q3.  

