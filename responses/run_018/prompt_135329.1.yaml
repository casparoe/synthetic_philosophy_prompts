answer: |-
  **1. The knot, personally and conceptually**  
  Your anxiety crystallizes a profound tension. Climate policy decisions today—mitigation timing, adaptation investments—alter migration patterns, economic stability, and reproductive timelines. Crucially, these changes don't merely affect *which lives* exist in 2150; they determine *which specific individuals* come into being. A policy accelerating decarbonization might avert coastal inundation, preventing your descendants from migrating and meeting different partners, thus conceiving genetically distinct children. Conversely, delayed action could force migration, altering the social conditions under which conception occurs. The nonidentity problem arises: if a future person (e.g., your descendant in 2150) owes their existence to a policy choice, how can that choice *wrong them*? Any alternative choice would have resulted in a different person existing instead. Threshold identity complicates this further. If identity is preserved across minor perturbations (e.g., conception delayed by days), but large-scale demographic shifts (e.g., climate-driven migration altering parental pairing) generate only "near-counterparts" (entities sharing genetic/causal lineage but not strict identity), the question bifurcates: can we wrong a *strictly identical* future person? And can we wrong a *near-counterpart*? A theory must resolve whether wronging requires strict identity continuity, and if not, how near-counterparts fit into harm attribution without collapsing into impersonalism or incoherence.

  **2. The Desiderata**  
  An adequate theory must satisfy:

  *   **(a) Handle Depletion vs. Same-Number Choices Coherently:** The theory must distinguish harming future people by depleting resources (making identical future persons worse off) from choices that change *who* exists (same-number cases). It must avoid contradictions where an act is harmful in depletion scenarios (e.g., exhausting a resource harming an identical future person) but seemingly neutral in same-number cases (e.g., choosing a policy causing a different, non-deprived person to exist). *Motivation:* Climate policy often involves both: mitigation preserves resources (depletion-avoidance) but also alters who exists via socioeconomic pathways.
  *   **(b) Accommodate the "Reckless Policy" Intuition:** The theory must explain the strong intuition that reckless climate inaction *wrongs future people*, even if their existence depends on that inaction. It cannot dismiss this as mere impersonal badness without moral significance. *Motivation:* Your concrete fear—that current choices inflict harm—demands an account where moral responsibility attaches to actions affecting future generations, regardless of identity dependence.
  *   **(c) Respect Biology without Metaphysical Overreach:** The theory must incorporate biological facts (e.g., genetic uniqueness determined at conception, developmental continuity) as relevant to identity *without* equating genetic identity with personal identity metaphysically. It must allow that identity might be threshold-dependent per the injection. *Motivation:* Biological reality grounds the identity dependence of nonidentity cases, but a theory shouldn't be hostage to a specific, contested metaphysics of personhood derived solely from biology.
  *   **(d) Attribute Harm (or Analog) to Near-Counterparts:** If threshold identity holds, the theory must specify whether and how near-counterparts (entities sharing significant lineage/causality but failing strict identity due to large perturbations) can be "wronged" in a derivative, analogical, or special sense distinct from harming an identical person *and* from merely creating an impersonally worse world. *Motivation:* Large-scale climate-driven demographic shifts likely produce near-counterparts of "would-be" descendants; the moral status of actions affecting them needs definition.
  *   **(e) Preserve Harm/Impersonal Worsening Distinction:** The theory must maintain a clear conceptual difference between an act that *harms a particular future person* (making *that specific person* worse off than they otherwise would have been) and an act that merely *makes the future world impersonally worse* (e.g., containing less total welfare or fewer worthwhile lives). *Motivation:* Without this, all moral evaluation collapses into impersonal aggregation, undermining the personal wrong you seek to articulate and potentially justifying problematic trade-offs.
  *   **(f) Compatibility with Non-Harm-Centric Reproductive Ethics:** The theory must not imply that *every* procreative choice (e.g., timing, partner selection) requires a harm-benefit calculus for the potential child, or that bringing a non-wronged but potentially less happy person into existence is inherently problematic. It should cohere with views that procreation can be a basic good or duty. *Motivation:* Applying strict harm-based reasoning to all reproduction is counterintuitive and paralyzing; climate-driven timing/pairing shifts shouldn't automatically trigger harm claims against parents.

  *Suspected Tensions:* (b) & (e) are jointly difficult: satisfying (b) (reckless policy wrongs *someone*) often requires relaxing (e) (strict personal harm condition), especially with threshold identity blurring "who" exists. (d) risks collapsing into impersonalism, violating (e). (a) & (b) are frequently in tension within person-affecting frameworks.

  **3. Tensions and No-Go Considerations**  
  The core tension lies between desiderata (b) and (e), exacerbated by threshold identity. (b) demands that reckless policy wrongs future people, but (e) demands that harming requires a specific person made worse off. Threshold identity implies that large-scale shifts (precisely those caused by major climate policy differences) produce only near-counterparts, not identical persons. For a near-counterpart, the "worse off" comparison required by (e) is incoherent: there is no *identical* person in the alternative scenario to compare them to. Satisfying (b) under threshold identity thus likely requires either:
  1.  **Abandoning (e):** Conceding that "wronging" near-counterparts is not about making *them* worse off, but about failing obligations owed to the lineage or creating impersonally worse futures (risking collapse into impersonalism).
  2.  **Redefining Harm for Near-Counterparts:** Proposing a weakened or analogical "harm" concept for near-counterparts (e.g., depriving them of a "normal" expected lineage context), but this risks being ad hoc and blurring the (e) distinction.
  3.  **Denying Near-Counterparts Matter Differently:** Insisting near-counterparts can be "harmed" identically to identical persons, but this contradicts the threshold identity premise.

  Standard results confirm the difficulty: without fixed identities or a fixed population, generating a *consistent* person-affecting principle (one that avoids contradictions in same-number choices and satisfies basic harm intuitions) is likely impossible. Pure person-affecting views struggle with (a), (b), and (d) under threshold identity. Impersonal views satisfy (a) and (b) but violate (e) and struggle with the personal wrong intuition. Hybrid views attempt to navigate this but face pressure points precisely at the threshold where identity gives way to near-counterpart status.

  **4. Brief Scorecard**
  *   **Strictly Person-Affecting:** Fails core desiderata. Handles (a) depletion cases only. Fails (b) (cannot explain wronging in same-number cases), (d) (struggles to assign harm to non-identical near-counterparts), and (e) is upheld but at the cost of failing (b). (f) is compatible. Coherence is high for depletion cases but collapses elsewhere. Threshold identity worsens its applicability.
  *   **Purely Impersonal:** Handles (a) and (b) robustly by evaluating total welfare or average welfare across possible futures. Fails (c) (ignores identity), (d) (near-counterparts treated indistinguishably), and catastrophically fails (e) (no personal harm, only impersonal states). Compatible with (f) only if impersonal values don't mandate specific procreative choices. Coherence is high but sacrifices the personal dimension entirely.
  *   **Hybrid/Two-Level Views:** Attempt to satisfy (b) and (e) by having a person-affecting level (for identical persons/harm) and an impersonal level (for non-identity cases). Moderately successful with (a), potentially handles (d) by placing near-counterparts in the impersonal tier or developing a special status. Risks violating (e) if the impersonal tier does the heavy lifting for wronging near-counterparts. (c) is respected if identity matters at the person-affecting level. (f) is manageable. Coherence is challenged by specifying the interaction between levels and the status of near-counterparts, especially under threshold identity where the boundary is crucial. Best candidate but faces significant pressure at the threshold.

  **5. The Most Damaging Requirement**  
  Desideratum **(e)** – preserving the distinction between harming a particular person and making the world impersonally worse – eliminates the largest number of popular positions. Strict person-affecting views uphold (e) but become morally inert for the critical cases (same-number choices, near-counterparts under threshold identity). Purely impersonal views explicitly reject (e). Hybrid views struggle to maintain a *meaningful* distinction for near-counterparts without collapsing the impersonal component into doing the work of "wronging," effectively violating (e) in practice. (e) is the barrier preventing a straightforward solution to the nonidentity problem and forces either conceptual contortions or the abandonment of the personal harm intuition (b).

  **6. A Better Framing, If Needed**  
  Given the intractability of reconciling all desiderata, particularly under threshold identity, a reconceptualization may be necessary. Shifting from **identity-based harm** to **obligation-based stewardship** preserves moral urgency. The core wrong is not harming a specific future *person* whose existence is contingent, but violating *present duties of stewardship* owed to the future *as such*. These duties could include: maintaining ecological systems necessary for *any* flourishing human life; ensuring just institutions adaptable for unknown future constituents; preserving options and resources for future agency; or honoring a chain of custodianship linking generations. This approach satisfies (b) (reckless policy violates duties), handles (a) and demographic shifts naturally (duty applies regardless of who exists), accommodates (d) (duties extend to lineages/contexts shaping near-counterparts), respects (c) (no metaphysical claims needed), and is compatible with (f) (procreation within stewardship isn't inherently a harm calculus). While it sacrifices strict (e) (the wrong isn't *to* a specific person), it channels the moral concern driving (e) into a robust framework of responsibility without nonidentity paradoxes.
