  1.  **Does symbolic manipulation require a Careenium buffer for syntax?** If YES, proceed to 2. If NO, symbolic processing is substrate-intrinsic; **Pure Substrate-Push** results (symbols are epiphenomenal patterns, only substrate dynamics matter).

  2.  **For systems requiring a buffer, are Simmballs literal structural nodes?** If YES, proceed to 3. If NO (Simmballs are metaphors), symbolic efficacy is fundamentally misattributed; **Hard Anti-Push** results (symbols don't push, only describe buffer operations).

