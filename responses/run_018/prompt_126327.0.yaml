prompt: |-
  I'm moderating a colloquium Q&A with an unnamed philosopher who defends what she calls "structural analyticity" — a rehabilitated analytic-synthetic distinction that accepts Quine's holistic critique of reductionism but denies that holism erases every local boundary. On her view, an analytic claim is not one reducible to logic plus synonymy (she grants Quine's circularity objection to that first dogma), but rather one that functions in reasoning as a non-empirical coordination principle: it is never revised by direct empirical encounter, not because it is immune in principle, but because the architecture of belief assigns it a structural role that empirical evidence can only dislodge by overturning an entire module. I want eight to ten interview questions that press this position at its joints rather than asking her to summarize it. Include at least one question on whether her structural criterion collapses back into a pragmatic or conventionalist account that Quine himself could accept; at least one on how she handles mathematical truths, where modular insulation seems strongest but where Quine's indispensability argument also runs; and at least one on whether the distinction survives Quine's second dogma if we reject not just reduction sentence-by-sentence but any local-to-global inference pattern. For each, provide a follow-up keyed to the answer she is most likely to give — for instance, if she appeals to functional role, press whether that role is descriptive or normative, and whether she can distinguish it from a particularly stubborn empirical generalization without begging the question. End with a question that makes it harder for her to deploy the standard deflection that "the boundary is fuzzy but still useful," by asking what specific evidential scenario would actually force her to reclassify a paradigmatic analytic statement as synthetic. Please begin your response directly with the interview questions themselves, with no introductory commentary or preface.
reasoning: |-
  Hmm, the user is moderating a colloquium Q&A with a philosopher who has developed "structural analyticity" as a reformed analytic-synthetic distinction. They want me to create 8-10 pointed interview questions that engage with the philosopher's position. I need to ensure these questions press at key aspects without being summary requests.

  The philosopher's view is that analytic claims aren't reducible to logic plus synonymy (accepting Quine's circularity objection) but function as non-empirical coordination principles. These claims are never revised by direct empirical evidence due to their structural role in belief architecture, and can only be dislodged by overturning an entire module.

