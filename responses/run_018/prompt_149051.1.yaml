  There's also potential equivocation between "predicts behavior poorly" and "isn't a real trait" as the user notes. A trait could be real but weakly expressed, or require specific contexts to manifest. Virtue ethics can accommodate this by emphasizing that virtues develop through habituation in supportive environments.

