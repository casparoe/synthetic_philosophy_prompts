  I should explain why step 5 fails. First, it ignores that virtues might be probabilistic tendencies rather than deterministic predictors. Second, it overlooks that moral evaluation often considers both the agent and the context. Third, even weak trait-behavior correlations don't reduce traits to nothing - a .30 correlation still explains 9% of variance, which is non-trivial. 

