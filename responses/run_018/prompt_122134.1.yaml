  1. Suffering-now-for-future-gain: PE says yes if mobility is real; SD says no, dignity isn't deferrable.
  2. Inheritance caps: SD says necessary to prevent caste; PE argues it severs intergenerational care.
  3. Risk socialization: SD accuses PE of making society absorb failure costs (health, unemployment) while letting winners hoard gains; PE retorts that mobility requires risk-taking enabled by safety nets.

  For authenticity: 
  - Use terms like "veiled domination" (SD) or "opportunity hoarding" (PE)
  - Reference real dynamics (e.g., American bankruptcy laws vs. European social insurance)
  - Have them concede minor points (e.g., "I grant that..." to show good faith)

  End with my meta-commentary: 
