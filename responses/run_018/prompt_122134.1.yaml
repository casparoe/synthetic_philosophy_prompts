  Key points they must debate: 
  - Can mobility data ever justify present suffering? (e.g., "Your kids might rise, so endure being treated as inferior today")
  - Does limiting wealth inheritance violate family bonds? 
  - Does the American approach socialize risk (society bears costs of failure) while privatizing reward (winners keep everything)?

  I'll structure it organically: 
