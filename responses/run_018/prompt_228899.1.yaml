          But that's not clear.

          They decide on:

            The Oswald case as the test: 
              In a context where we know Kennedy was shot, but we are unsure whether Oswald acted alone or not. 
              Consider the counterfactual: "If Oswald hadn't shot Kennedy, someone else would have." 
              Marcus: this is true if there was a conspiracy, false if Oswald acted alone. 
              Priya: the truth of the counterfactual depends on what we hold fixed. If we hold fixed the conspiracy, then it's true; if we hold fixed that Oswald acted alone, then it's false. But the literal meaning doesn't change. 

            So they agree to test it by constructing a scenario where we have two groups of people: 
              Group A: believes there was a conspiracy. 
              Group B: believes Oswald acted alone. 
            And then see what they say about the counterfactual. 

            But Marcus says: the two groups disagree about the facts (conspiracy vs. not), so they will naturally disagree about the counterfactual. That's because the counterfactual has objective truth conditions that depend on the facts. 
            Priya says: the counterfactual is evaluated relative to what we hold fixed, and each group holds fixed different things. 

            The test is: is there a way to force a context where both groups must agree on what the counterfactual means? 

            They can't resolve it, but they agree that the murder mystery case is the key battleground.

          Alternatively, they land on the card case with the two observers. 
            They both can assert their indicative conditionals, but can they both assert their corresponding counterfactuals? 
            Priya: yes, because they are evaluated relative to their own contexts. 
            Marcus: no, because the counterfactual is about a single objective closeness relation. 

          So the test is: 
            In the card scenario (with AH, KH, AS, KS), if the card is the AH, and Alice (told red) says: 
              "If it hadn't been the Ace of Hearts, it would have been the King of Hearts." 
            and Bob (told Ace) says: 
              "If it hadn't been the Ace of Hearts, it would have been the Ace of Spades." 
            Can both of these be true? 
            Marcus says no, because there is only one set of closest worlds. 
            Priya says they can both be true relative to their own contexts. 

          So they agree to test it by asking: in the actual world, where the card is AH, and given Alice's limited knowledge (only color), she is justified in holding fixed the color? And Bob is justified in holding fixed the rank? 
          Marcus will say that the counterfactual should not depend on the speaker's knowledge but on the objective facts. 

          Thus, they pin down the card case counterfactuals as the test.

   Let's write the dialogue accordingly.

   Note: We must avoid name-dropping and have concessions.

   Outline of dialogue:

     Setting: pub after seminar.

     Marcus: brings up murder mystery. 
     Priya: responds by saying it's about what you hold fixed. 
     Marcus: challenges with the fact that in the counterfactual, we do hold fixed the death. 
     Priya: then why is the counterfactual rejected? 
     Marcus: because in the closest world where the butler doesn't do it, the count doesn't die (because only the butler could have done it). 
     Priya: so you are not holding fixed the death? 
     Marcus: we hold fixed the circumstances (like the security setup) but not the death. 
     Priya: that's pragmatic! 

     They move to the card case. 
     Priya: in the card case, both Alice and Bob can assert their indicative conditionals. 
     Marcus: but they couldn't assert the counterfactuals because they conflict. 
     Priya: why not? They are in different contexts. 
     Marcus: the counterfactual is about the same objective world. 

     They discuss 'might' counterfactuals: 
          Priya: "If he had bet on red, he might have won" is compatible with "if he had bet on red, he might not have won" because they are about different possibilities. 
          Marcus: no, the first says there is a world where he bets and wins, the second says there is a world where he bets and loses. They are compatible? But then what about "if he had bet on red, he would have won" which says in all closest worlds he wins. 
          They agree that 'might' and 'would' are duals. 

     Concession: 
          Priya: "Okay, I admit that for counterfactuals, the set of what's held fixed is often more extensive and context-dependent than I initially allowed. It's not just the speaker's knowledge at the time."
          Marcus: "And I grant that for indicative conditionals, the speaker's knowledge plays a crucial role in assertability in a way that my view doesn't easily capture. For example, in the card case, Bob's indicative is only assertable because of his limited information, not because it's objectively true in the same way as '2+2=4'."

     Then they land on the card counterfactuals as the test case.

     End with:
          Priya: "So let's take the card case. The actual card is the Ace of Hearts. Alice, who only knows it's red, says: 'If it hadn't been the Ace of Hearts, it would have been the King of Hearts.' Bob, who only knows it's an Ace, says: 'If it hadn't been the Ace of Hearts, it would have been the Ace of Spades.' On my view, both are true relative to their contexts. On yours, they can't both be true because they are about the same world and the same closeness relation. Right?"
          Marcus: "Exactly. And I say that at most one can be true, and it's determined by the objective facts of similarity. We should ask: in the closest worlds where the Ace of Hearts isn't drawn, what card is drawn? And that's fixed by the setup: it's random, so there is no single closest world. It might be that neither counterfactual is straightforwardly true."
          Priya: "But if we fix the method of drawing, say, a machine that always picks the top card, and we imagine a world where the Ace of Hearts is not in the deck, then we have to decide what card is on top. But without changing the setup, it's underdetermined."
          Marcus: "That's the point: the counterfactual has a truth value even if we don't know it. And it can't be both the King of Hearts and the Ace of Spades."
          Priya: "Unless we allow that in different contexts we resolve the similarity differently."
          Marcus: "But then you are admitting that the truth conditions depend on context, and that's what I've been saying: the counterfactual is context-sensitive, but it's still truth-conditional and distinct from the indicative."
          Priya: "But I'm saying the indicative is context-sensitive too! So they are the same thing, just used in different contexts."
          Marcus: "No, because the indicative is tied to the speaker's knowledge at the time of utterance, while the counterfactual is tied to a contextually determined similarity relation that is not so constrained."
          They agree to think more about whether the context-sensitivity is of the same kind.

     We end with them ordering another beer and agreeing to disagree, but having pinned the test to the card counterfactuals.

