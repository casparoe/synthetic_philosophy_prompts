  ### Dialogue: Priya and Marcus in the Pub

  **Setting:** A dimly-lit pub after a philosophy of language seminar. Priya sips a craft beer, Marcus stirs his coffee.

  **Marcus:** That seminar today… I’m still stuck on how blithely everyone treats indicative and counterfactual conditionals as interchangeable. They’re not! Take the murder mystery example we brushed over. Suppose we *know* the Count was poisoned. I say: "If the butler didn’t poison the Count, someone else did." That feels unassailable. But if I say, "If the butler *hadn’t* poisoned the Count, someone else *would have*," that sounds wildly false if we believe the butler was the only one with motive and opportunity. The difference isn’t just verb tenses—it’s truth conditions.  

  **Priya:** Hold up. Both conditionals rest on the same core: a connection between the butler’s innocence and another killer. The first is naturally assertable because we *hold fixed* the Count’s death—it’s uncontroversial background knowledge. In the counterfactual, we’re imagining a world where the butler doesn’t act, and we *don’t* necessarily hold the death fixed. It’s pragmatic—what we slot into "background" shifts.  

  **Marcus:** That’s too glib. If we *don’t* hold the death fixed in the counterfactual, why does "If the butler hadn’t poisoned him, the Count would still be alive" sound true? And why can’t I *consistently* hold the death fixed? Your pragmatics can’t explain the asymmetry. With the indicative, I *must* accept it given the evidence. With the counterfactual, I can reject it without contradiction.  

  **Priya:** Okay, but consider the card game case. Three cards: Ace of Hearts (red), King of Hearts (red), Ace of Spades (black). One is drawn randomly. Alice only knows the suit: she’s told it’s hearts. Bob only knows the rank: he’s told it’s an Ace. The card *is* the Ace of Hearts.  
  Alice asserts: "If it’s not the Ace of Hearts, it’s the King of Hearts." Bob asserts: "If it’s not the Ace of Hearts, it’s the Ace of Spades." Both indicatives are felicitous given their knowledge.  

  **Marcus:** Right, but switch to counterfactuals. Alice says: "If it *hadn’t been* the Ace of Hearts, it *would’ve been* the King." Bob says: "If it *hadn’t been* the Ace of Hearts, it *would’ve been* the Ace of Spades." Now they conflict! Bob’s claim implies a black card in a hearts-only world! Your view says both counterfactuals could be "true-in-context," but that’s absurd—they’re mutually exclusive. Only one can reflect objective closeness: in the nearest world where the Ace of Hearts isn’t drawn, what *actually* takes its place?  

  **Priya:** Not mutually exclusive if context fixes different background facts. Alice holds fixed "hearts"; Bob holds fixed "Ace." Same conditional, different pragmatic constraints.  

  **Marcus:** Then try "might" counterfactuals. Suppose a gambler didn’t bet on red at roulette, and the wheel landed red. I say: "If he’d bet on red, he *might* have won." That’s true! But I also say: "If he’d bet on red, he *wouldn’t* have won"—because the casino rigs the wheel against late bets. On your view, both can be assertable: one holds fixed the outcome, the other holds fixed the rigging. But they’re incompatible! "Might" and "wouldn’t" can’t both be true of the same events.  

  **Priya:** Fine, I concede that "might" counterfactuals expose a flaw. If we reduce everything to pragmatics, we risk making "might" and "would" merely speaker-relative. That feels wrong—they’re duals. But notice: indicatives *aren’t* truth-apt! "If it’s not the Ace, it’s the King" isn’t a claim about the world; it’s a constraint on Alice’s epistemic state.  

  **Marcus:** That’s a big concession! If indicatives aren’t truth-apt, you’ve gutted their semantic content. Yet we reason with them: "If the butler didn’t do it, someone else did; the butler didn’t do it; therefore someone else did." That’s modus ponens—it presumes truth conditions!  

  **Priya:** Okay, you score a point. But what about strengthening the antecedent? "If I’d struck the match, it would’ve lit" seems true. Add more: "If I’d struck the match *and it was wet*, it wouldn’t have lit." Both counterfactuals can be true—the second just shifts what’s held fixed (the wetness). Your truth-conditional view struggles with that flexibility.  

  **Marcus:** Not if we recognize that antecedents *change the proposition*. "Struck and wet" isn’t just "struck" plus baggage—it’s a distinct scenario. But I’ll concede something too: for impossible antecedents, like "If 2+2 *were* 5, then...", my view gets clunky. Are they vacuously true? False? It’s messy.  

  **Priya:** Which is why pragmatics handles it cleanly: they’re unassertable because we can’t "hold fixed" basic math. But let’s cut to the chase. The smallest test for our views: your card case counterfactuals. *Actual world:* Ace of Hearts drawn. *Alice’s counterfactual:* "If it hadn’t been the Ace of Hearts, it would’ve been the King." *Bob’s counterfactual:* "If it hadn’t been the Ace of Hearts, it would’ve been the Ace of Spades."  

  **Marcus:** My prediction: only one can be true. The "closest world" where the Ace of Hearts isn’t drawn must pick *one* alternative—based on objective similarity (e.g., drawing mechanics), not subjective context. Both can’t hold.  

  **Priya:** Mine: both can be true. Alice’s context fixes the suit (hearts), so the King is the natural alternative. Bob’s fixes the rank (Ace), so the Spades Ace is. No conflict—just different perspectives on the same conditional form.  

  **Marcus:** Then that’s where we test intuition. Can two people, with partial information about the same event, simultaneously assert conflicting counterfactuals *without contradiction*?  

  **Priya:** I say yes. You say no. Next round’s on whoever’s right.  
  **Marcus:** Deal. But I’m buying the first one—win or lose, this is fun.  

  *(They tap glasses, the argument unresolved but pinned to the card case—a concrete battleground for their theories.)*
