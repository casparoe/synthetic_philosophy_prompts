  Breaking down Priya's opening: Her emphasis on legal precision is strong for maintaining the term's gravity, but weak in ignoring how legal definitions themselves emerge from power dynamics. I'd rate this "more right than wrong" because diluting technical terms does risk their utility, though she overlooks the politics behind the definition.

