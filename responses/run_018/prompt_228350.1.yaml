  Hmm... the tricky parts will be: making Marcus's inferentialism robust enough to handle Petra's "discrimination test" objection, while Petra needs to answer the "how much causation is enough" challenge. For Marcus, I can draw from Brandom; for Petra, I'll channel Fodor-esque worries about AI syntax vs semantics.

  The discrimination counterexample needs teeth - maybe a system that passes textual tests but can't recognize water perceptually? And Petra's sorites problem must press on the vagueness of "causal connection" - after all, humans in 1700 referred to H2O without knowing chemistry, much like the LLM.

  For the ending, Petra's vulnerability should be evidence of genuine world-tracking in LLMs, while Marcus's should be proof that competence is purely syntactic. That maintains symmetry. 

  I should avoid making either position collapse - keep them both defensible but challenged. The user would hate a "gotcha" ending. Also must name-drop key philosophers (Putnam, Burge, Brandom, Fodor) to show familiarity with literature.

