answer: |-
  ### Workshop Plan: Iterated Elimination in Mixed Strategies (45 min)

  **Audience:** Econ grads fluent in pure-strategy dominance, no prior mixed-strategy application. Basic calculus, no formal decision theory.

  ---

  #### 1. **Start with Expected Utility over Lotteries (8 min)**  
     *Why first?* Dominance in mixtures requires comparing *expected payoffs*, not raw outcomes.  
     - **Quick recap:**  
       - Lottery = probability distribution over outcomes.  
       - Expected payoff = linear combination of payoffs weighted by probabilities.  
     - **Key insight:** A mixed strategy is a lottery over pure strategies. To compare two mixtures, compute expected payoffs *across all opponent actions*.  
     - **Address misconception immediately:**  
       > "You might try to compare payoffs cell-by-cell (e.g., 'Row A beats Row B when Column 1 plays X'). **Stop!** Dominance requires one strategy to deliver *higher expected payoff* against **every** opponent profile, not higher payoffs in individual cells."

  ---

  #### 2. **Geometric Bridge: Mixed Strategies as Simplex Points (7 min)**  
     - **Visualize:** Player with 3 pure strategies → mixtures live in a triangle (2-simplex). Corners = pure strategies, interior = mixtures.  
     - **Core idea:** The payoff of a mixed strategy is a point in payoff space (one dimension per opponent action).  
     - **Critical analogy:**  
       - A pure strategy is dominated if its payoff point is "covered" by the convex hull of other strategies' payoffs.  
       - *Example sketch:* Show a point inside a triangle formed by 3 other points → dominated.  

  ---

  #### 3. **Carrying Example: Modified Silent Auction (15 min)**  
     *Why this example (not Matching Pennies)?*  
     - **Matching Pennies fails:** No strategy is dominated (even by mixtures), so useless for teaching elimination.  
     - **Auction example (3 bidders, 3 bid levels: Low/Medium/High):**  
       - *Setup:*  
         - Bidder 1’s payoffs (others symmetric):  
           - Low bid: Wins if others bid Low (payoff 4), else loses (0).  
           - Medium bid: Wins only if others bid Medium/Low (payoff 2).  
           - High bid: Wins if any bid High (payoff 5), else loses (0).  
         - Opponent profiles: (Low, Low), (Low, High), (High, High), etc.  
       - **Analysis:**  
         - Pure strategies: Medium never dominates Low/High.  
         - Mixed strategy (e.g., 50% Low, 50% High):  
           - Expected payoff vs *any* opponent profile > Medium’s payoff.  
           → **Medium is dominated by the mixture.**  
       - **Why it works:** Clear convex hull intuition (Medium’s payoff is strictly inside hull of Low/High).  

  ---

  #### 4. **Iterated Elimination Process (10 min)**  
     - **Step-by-step walkthrough:**  
       1. Eliminate a dominated strategy (e.g., Medium in auction).  
       2. **Key insight:** Removing a strategy *changes the convex hull* for remaining strategies.  
       3. Re-check dominance in the reduced game.  
     - **Preempt misconceptions:**  
       - *After Round 1:* "You might think we’re done because no more *pure* strategies look dominated. **Stop!** Mixtures that weren’t viable before might now dominate others."  
       - **Clarify:** "Never a best response" vs "strictly dominated":  
         - In 2-player games, these coincide. Emphasize: We *only* care about dominance here.  
         - Show a strategy that isn’t a best response but isn’t dominated (optional quick example if time).  

  ---

  #### 5. **End-of-Session Check Question (5 min)**  
     - **Question:**  
       "Player A has two pure strategies: X (payoffs: 3 vs L, 0 vs R) and Y (payoffs: 0 vs L, 3 vs R).  
       Is the mixed strategy (50% X, 50% Y) dominated by any other mixture? Why/why not?"  
     - **Why it works:**  
       - Tests grasp of expected payoffs (mixture gives 1.5 vs L, 1.5 vs R).  
       - No calculation of best responses needed—pure dominance check.  
       - Answer: No (no strategy yields >1.5 against both L and R).  

  ---

  #### **What to Refuse to Cover**  
     - **Linear programming:** "We’re focusing on intuition, not computation."  
     - **Infinite games:** "Stick to finite matrices for today."  
     - **Nash equilibrium derivation:** "Today is about *elimination*, not equilibrium."  

  ---

  #### **Timing Buffer**  
     - Hold Q&A until after the check question.  
     - If running short: Deepen the auction example. If long: Skip "never a best response" nuance.  

  **Outcome:** Grads will see how mixtures expand dominance and why iteration requires rechecking the convex hull—**without** advanced math.
