answer: |-
  Here’s a definitive diagnosis and resolution, cutting through the stalemate:

  ### **The Core Clash: Two Distinct Projects Masquerading as One**
  1. **Lewis's Project**: Explains norms as *self-sustaining rational equilibria* under common knowledge. It’s a **synchronic** account of *why a norm is stable* given fixed payoffs and beliefs.  
  2. **Evolutionary/Game-Theoretic Models**: Explain norms as *dynamic outcomes of selection pressures*. It’s a **diachronic** account of *how norms emerge, spread, or decay* as payoffs/beliefs shift.  

  The "static vs. dynamic" debate conflates these. Lewis isn’t *trying* to explain historical change—he’s defining the equilibrium logic of conventions. Critics fault him for not solving a problem he never addressed.  

  ### **Why the Tension Persists**
  - **"Latent Conventions" Expose the Gap**:  
    - Evolutionary models generate latent norms naturally (via mutation/experimentation).  
    - Lewis requires *actual common knowledge* of counterfactuals (e.g., "We’d all switch to norm Y if payoffs changed"). But in reality, latent norms often exist *without* explicit group reasoning—they’re byproducts of random variations or external shocks.  
    - **This isn’t verbal**: It’s a structural limitation. Lewis’s framework lacks machinery to handle *unactualized possibilities* without implausible cognitive demands.  

  - **Empirical Divergence**:  
    - If norm shifts track **payoff shifts** (e.g., technology changes make old norms inefficient), evolutionary models win.  
    - If shifts track **salience cues** (e.g., a viral protest makes a new norm "focal"), Lewisian salience explains it.  
    *Reality likely involves both*—but Lewis struggles with gradual payoff-driven change, while evolutionary models struggle with sudden salience-driven revolutions.  

  ### **The Decisive Move: A Formal-Empirical Pincer Attack**
  **What Would Resolve the Stalemate**:  
  1. **A Formal Result Proving Evolutionary Dynamics *Cannot* Reach Certain Lewis Equilibria**:  
     - Show that under plausible mutation/selection dynamics, populations *cannot* converge to coordination equilibria requiring high-order common knowledge (e.g., "I know that you know that I know...").  
     - **Why this matters**: It would force a split—Lewis’s norms would apply only to small, communicative groups, while evolutionary norms explain large-scale societies.  

  2. **Empirical Evidence on "Latent Norm" Activation**:  
     - Design experiments testing whether people adopt latent norms after payoff shifts:  
       - **Group A**: Pre-exposed to a latent norm (e.g., through hypotheticals).  
       - **Group B**: No prior exposure.  
     - *Lewis predicts*: Group A shifts faster (common knowledge enables coordination).  
     - *Evolutionary models predict*: Both groups shift at similar rates if the norm is fitness-enhancing.  
     - **Outcome**: If Group A dominates, Lewis retains value. If not, evolutionary accounts subsume latent norms.  

  ### **My Position**
  **The clash is substantive and resolvable through a hybrid framework**:  
  - Lewis explains **stability** and **focal points** in deliberate coordination.  
  - Evolutionary models explain **origins** and **drift** under changing environments.  
  - **"Latent conventions" are evolutionary footholds, not Lewisian counterfactuals**. They exist as dormant strategies in a population’s repertoire, activated by selection—not by shared reasoning.  

  **What Moves the Needle**:  
  - **Admit the question is ill-posed as a binary**. Norms aren’t *either* Lewisian *or* evolutionary—they’re both, at different stages.  
  - **A formal distinction between coordination and distribution problems** is critical:  
    - Lewisian conventions *only* work for pure coordination (e.g., driving sides).  
    - Evolutionary dynamics handle mixed-motive norms (e.g., resource-sharing) where power/asymmetries matter.  
  - **Empirical work on salience vs. payoffs** is the ultimate arbiter. Track real norm shifts (e.g., mask-wearing during COVID): Did they follow payoff changes (infection rates) or salience shocks (celebrity endorsements)?  

  ### **Conclusion**
  Stop forcing Lewis to do diachronic work. His account is a logic of equilibrium, not a theory of change. The "evolutionary bolt-on" critique undersells the gap: Selection explains *how* latent norms emerge without cognitive overhead; Lewis explains *why* they stick once salient. **The needle moves when we stop asking "which model is right?" and start mapping *when* each applies.**  

  **If you want closure**: Run experiments on latent norm activation. If payoff shifts + selection explain transitions without common knowledge, Lewis’s role shrinks to edge cases. If not, we revive counterfactual reasoning as a necessary mechanism. Bet on the former.
