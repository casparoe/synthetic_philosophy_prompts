answer: |-
  Here's a breakdown of the philosophical claims your roommate's statement might be smuggling in, ordered from least to most radical, with an assessment of whether each "lets her off the hook" morally:

  1.  **"Not a *Legal* Contract": (Trivial)**
      *   **Claim:** A casual promise ("I'll come to your opening") isn't a legally enforceable agreement with damages for breach. It lacks formal offer/acceptance, consideration, etc.
      *   **Lets Her Off the Hook?** **Yes, but trivially.** You weren't facing a lawsuit. This doesn't address the *moral* weight at all. It's irrelevant to whether flaking was wrong. You're still in the wrong socially/morally.

  2.  **"Only Creates Social Expectation, Not Moral Obligation":**
      *   **Claim:** Promises primarily function as social signals establishing expectations ("I plan to be there"). Breaking them causes awkwardness, disappointment, or social friction, but not a genuine *moral* failing. The "obligation" is just the weight of social convention.
      *   **Lets Her Off the Hook?** **No.** While downgrading it from "moral wrong" to "serious social faux pas," this still squarely places the fault on *you* for creating and then violating a reasonable expectation, causing harm (disappointment, inconvenience). You're still responsible for the social damage.

  3.  **"Conventional Force Only (Like a Game Move)":**
      *   **Claim:** Promises are purely conventional acts within a social "game," like declaring "Checkmate" in chess. The obligation exists *only* within the rules of the social practice. Breaking a promise is like making an illegal chess move – it violates the convention but isn't inherently morally wrong outside that context. The "wrongness" is entirely internal to the social practice.
      *   **Lets Her Off the Hook?** **Mostly No.** This is a significant weakening. However:
          *   **If the "game" is fundamental to social cooperation (like promising),** then violating its rules *is* a serious moral/social failure within the framework humans live by.
          *   **Searle (often referenced here) strongly argued** that the *point* of the promising convention *is* to create a deontic (obligation-creating) fact. Breaking it *is* morally wrong *because* you exploited the convention.
          *   You're still violating a core social rule, causing harm, and undermining trust. You're in the wrong.

  4.  **"Illocutionary Force Lacks Binding Power":**
      *   **Claim:** The *successful performance* of the speech act "I promise" (the illocutionary act) merely *states* an intention or commitment. It doesn't, by itself, magically create an irrevocable moral bond. The obligation is illusory or merely aspirational.
      *   **Lets Her Off the Hook?** **Radically Contested, but likely No.**
          *   This directly contradicts the core insights of Austin and Searle. They argued that successful performatives *do* change normative reality ("I now owe you X"). For Searle, promising is *defined* by its obligation-creating rule.
          *   If true, it would make promises meaningless. Why say "I promise" instead of "I intend to"? The *whole point* is the added commitment.
          *   Even if the *force itself* doesn't magically bind, the act *invites reliance* which creates a moral duty not to harm the relying party. You're likely still in the wrong for inducing reliance and then bailing.

  5.  **"Performatives Lack Moral Propositional Content / Promissory Collateral is Fiction": (Most Radical)**
      *   **Claim:** A promise utterance doesn't contain a truth-valuable proposition *about morality* ("I am now morally bound"). The feeling of "collateral" (something owed/pledged) is a psychological/social illusion. There is no "debt" created, only a prediction of behavior and potential social fallout.
      *   **Lets Her Off the Hook?** **Theoretically Yes, but Practically & Philosophically Unsustainable.**
          *   This is the nuclear option: it denies the *very possibility* of promissory obligation. It reduces all social commitments to predictions and power dynamics.
          *   **Consequences:** If true, trust, cooperation, and complex social structures become nearly impossible. It's a deeply cynical and arguably self-defeating view.
          *   **Philosophical Consensus:** Overwhelmingly rejected. The creation of obligations through promises is foundational to ethical and political philosophy (Hobbes, Locke, Rawls, Scanlon, etc.). Austin/Searle aimed to explain *how* this works linguistically, not to deny it.

  **What She *Probably* Means (The Winning Arguments Dodge):**

  When someone uses "it's just a speech act, not a contract" to win an argument about flaking, they are almost always conflating Claim 1 (Not a Legal Contract) with a drastically oversimplified and misinterpreted version of Claim 3 (Conventional Force Only).

  *   **The Dodge:** They hear "conventional" and think "arbitrary," "optional," or "only matters if people get upset." They ignore that the *convention itself* is designed to create serious commitment and that violating it harms trust and expectations. They wrongly equate "not legally binding" with "morally weightless."
  *   **Why it's Wrong:** Even on a conventionalist view (Claim 3), breaking core social conventions like promising is a serious violation *within* the moral framework those conventions support. Searle explicitly argued that the rules of promising *create* the obligation. Austin's point was that performatives *do* things in the world, including creating commitments.

  **Conclusion:** None of the plausible philosophical readings of her statement genuinely "let her off the hook" or absolve you of wrongdoing. At best (for her argument), they downgrade the *type* of wrong from a deep moral failing to a severe violation of social trust and cooperation, but one that still clearly places responsibility on you for causing harm by creating and then betraying a reasonable expectation. The radical readings (4 & 5) that might theoretically absolve you are philosophically fringe and practically destructive. Her usage is most likely a misapplication of Claim 3, ignoring the inherent normative force built into the convention of promising itself. You were still in the wrong.
