  Hmm, interesting challenge. The key insight here is making students feel this in their own lives - like how they spend a Saturday morning. The user is clearly frustrated with superficial treatments where students miss the core philosophical point (unreasonableness vs difficulty) or reduce it to "people are selfish." 

  Let me unpack their requirements layer by layer. First, the conceptual prerequisites: students must understand that consequentialism governs omissions and mundane choices, not just dramatic rescues. Without this, the "overtime" analogy won't land. Second, the dependency chain - maximization → continuous scope → accumulated cost - needs explicit scaffolding. Third, misconceptions must be preempted in sequence: 1) demanding ≠ impossible, 2) it's not about supererogation, 3) you can't set a "good enough" threshold. 

  For the case study... Saturday morning is perfect. Grocery shopping instead of leisure? That'll sting. The moral math of small savings (coupons vs time) makes the optimization pressure visceral. Must emphasize the cumulative weight - it's not one choice but the totality. 

  Ah, and the user wants clear boundaries: no Scheffler/Singer tangents, no utility calculus. Good call - this keeps focus on the structural objection. Should explicitly flag these exclusions upfront to manage expectations. 

  The arc should probably start by distinguishing demanding-as-unreasonable from demanding-as-difficult using clear examples (maybe contrasting mountain rescue with daily life optimization). Then build the logical chain step by step before introducing "overtime." The Saturday scenario comes late - only after foundations are set. 

  For misconception interception: preempt the "human weakness" confusion early with thought experiments (superhuman agents still face unreasonable demands). Save the "good enough" rebuttal for last - it's the most tempting escape hatch. 

  Final check: can students articulate why this isn't about selfishness? Maybe have them rephrase the objection in their own words focusing on structural features (pervasiveness, nonstop optimization). 

  ...Wait, did I miss anything? The user stressed linking omissions to lifestyle - better emphasize that when setting up prerequisites. Also, the accumulated cost point needs reinforcing in the Saturday example (those 30-minute savings add up to years of lost leisure). 

  Right, the plan feels solid. Start tight and conceptual, then make it personal. Keep the Saturday scenario mundane but analytically rich. And constantly loop back to why this makes consequentialism unreasonable, not just hard.
answer: |-
  Here’s a structured 90-minute session plan focusing on "moral overtime," designed to make the demandingness objection visceral while avoiding common misconceptions. The arc prioritizes conceptual clarity and personal resonance.

  **Session Title:** *Consequentialism & the Grind: Is "Moral Overtime" Unreasonable?*

  **Core Goal:** Students grasp that the demandingness objection targets *structural unreasonableness* (scope/pervasiveness), not difficulty or limits of willpower.

  **Key Exclusion Announcement (Upfront - 2 mins):**  
  > *"Today is purely conceptual: no Singer/Scheffler history, no utility math. We focus solely on whether consequentialism’s structure creates an objectionably demanding *type* of requirement – like being permanently on-call."*

  ---

  ### **The Session Arc**

  #### **I. Stage-Setting: Prerequisites & Distinctions (20 mins)**
  *   **A. Consequentialism Refresher (5 mins):**  
      Quick review: Right act = maximizes net good. Stress **impartiality** & **aggregation** (everyone's good counts equally, summed).
  *   **B. The Crucial Foundation: Omissions & Mundane Choices (10 mins):**  
      *   *Q: "If I *don’t* donate to famine relief, am I doing something morally wrong under consequentialism? Why?"* (Elicit: Failing to maximize good = wrong).
      *   *Q: "Does it only apply to writing big checks? What about *how I choose to spend my time*? If scrolling Instagram for an hour produces less net good than volunteering/tutoring/earning-to-donate, is scrolling wrong?"*  
      *   **Key Insight:** Consequentialism governs *all* actions *and* inactions (omissions), including routine lifestyle choices. *This scope is essential for "overtime."*
  *   **C. "Too Demanding" ≠ "Too Hard" (5 mins):**  
      *   Contrast: "Climbing Everest to save a life is *hard*, but arguably *reasonable* in that extreme scenario."  
      *   *"The objection we explore isn't about heroic acts being too difficult. It's about whether the *everyday, pervasive scope* of optimization demanded is unreasonable – even if you *could* do it."*  
      *   **Misconception Intercepted #1:** Demandingness ≠ Impossibility for Humans.

  #### **II. Building the Dependency Chain (15 mins)**
  *   **Logical Sequence on Board:**  
      1.  **Maximization:** You must always produce the *most* net good possible.  
      2.  **Continuous Scope (From Prereq):** Applies to *every* choice, big or small, action or omission.  
      3.  **No Off-Switch:** There is *never* a moment where choosing a suboptimal (but good-enough) option is morally permissible, if a better one exists.  
      4.  **Accumulated Cost:** The "cost" isn't just big sacrifices; it's the *relentless optimization of every waking moment*, foregone leisure, personal projects, spontaneous joy.  
  *   **Introducing the Metaphor (2 mins):**  
      *"This chain creates a state of perpetual 'moral overtime.' Not occasional extra shifts, but the expectation that your entire life is on-call for marginal moral gains. There's no clocking out."*

  #### **III. The Scenario: Saturday Morning Groceries (25 mins)**
  *   **Setup:** *"It's 10 am Saturday. You have 2 hours free before meeting friends. Your fridge is empty. You need groceries."*
  *   **Options & Analysis (Guided Discussion):**  
      *   **Option A (Leisurely):** Walk to the nice, expensive local market (10 mins). Browse, chat, buy local/organic (supports community, maybe better environment?). Enjoy the walk/sun. Cost: $$, Time: 90 mins. Net Good: X.
      *   **Option B (Efficient Altruism Lite):** Drive 15 mins to discount mega-store. Use app for coupons, buy cheapest staples. Donate savings to effective charity. Time: 60 mins. Net Good: Y. *(Assume Y > X due to donation impact)*
      *   **Option C (Maximize Earning):** Skip groceries. Spend 2 hrs on freelance gig/further study to increase future earning/donation potential. Eat leftovers. Net Good: Z? *(Assume Z > Y > X)*
      *   **Option D (Rest):** Order delivery. Rest/read for 2 hrs. Recharge for the week. Net Good: W (Lowest).
  *   **Consequentialist Demand:**  
      *   *Q: "Which option *must* you choose? Why?"* (C, if Z is highest net good).
      *   *Q: "Is choosing A (leisurely) *morally wrong*? Why?"* (Yes, fails to maximize. Good exists but is suboptimal).
      *   *Q: "What if you *really need* the rest (Option D)?"* (Only permissible if rest *genuinely* enables significantly more good later – difficult to prove; usually, it's wrong).
      *   **Focus on the Mundane:** Emphasize the *lack of crisis*. This is groceries! Yet, optimization pressure is constant. The "overtime" is choosing C over A, or justifying D.
      *   **"Accumulated Cost" Feel:** *"Multiply this by every minor choice: coffee out vs. home brew? Bus vs. walk (time vs carbon)? Weekend trip vs. local volunteering? The *cumulative* demand on your life, energy, and personal space is immense."*

  #### **IV. Tackling Key Misconceptions (15 mins)**
  *   **Misconception #2: "Isn't this just about Supererogation?"**  
      *   *Clarify:* Supererogation = good acts *beyond* duty. Consequentialism has *no space* for this. Anything less than best is wrong. "Heroism" is just *duty*.
      *   *Saturday Scenario:* Under consequentialism, choosing B over D isn't "praiseworthy extra," it's the *minimum required*. Choosing A is *blameworthy*.
  *   **Misconception #3: "Can't I just do 'Enough'?"**  
      *   *The Escape Hatch Attempt:* "What if I set a threshold? (e.g., donate 10%, volunteer 5 hrs/week)."
      *   *Why It Fails:* Maximization has no threshold. If you can do more good (e.g., donate 11%, volunteer 5 hrs 1 min), you *must*. The threshold is arbitrary and suboptimal. "Enough" doesn't exist in the theory.
      *   *Overtime Link:* Setting a threshold is like declaring "I only work 40 hrs," but maximization says *any* hour not spent optimizing is potentially a moral failing.

  #### **V. Check for Grasp & Conclusion (13 mins)**
  *   **The Check:** *"Explain the demandingness objection in your own words, *without* using the words 'selfish,' 'greedy,' 'lazy,' or 'hard.' Focus on *what the theory requires* and *why that requirement might be unreasonable*."*  
      *(Listen for: Pervasive scope, no breaks, no permissible sub-optimality, accumulation of minor demands, unreasonableness of life-as-constant-optimization)*
  *   **Reiterate the Core:** The objection is that consequentialism fails to recognize a *reasonable space for the personal* – a life not perpetually on-call for marginal gains. It conflates "morally best" with "morally required" across *all* domains.
  *   **Forward Look (1 min):** *"This structural feature is why some seek alternatives (deontology, virtue ethics) or try to modify consequentialism (scalar, satisficing). We'll explore those later!"*

  ---

  ### **Why This Sequence Works**
  1.  **Prerequisites First:** Omissions/lifestyle scope is *essential* to feel the pervasiveness. Introducing "overtime" before this would make it abstract.
  2.  **Dependency Chain Explicit:** Maximization -> Scope -> No Off-Switch -> Accumulated Cost provides logical rigor before the metaphor.
  3.  **Scenario is Mundane & Relatable:** Saturday groceries forces confrontation with optimization in *their* lives, making the "overtime" feel personal, not abstract or distant.
  4.  **Misconceptions Sequenced:** Tackles "impossible" first (foundational), then supererogation (common confusion), then "enough" (most tempting rebuttal) when students have the tools to see why it fails.
  5.  **Check Targets Essence:** Forbidding "selfish/lazy" language forces articulation of the *structural* objection.
  6.  **Focused Exclusions:** Avoiding Singer/Scheffler/history keeps it conceptual and accessible for first exposure. No utility math prevents bogging down.

  This plan makes the demandingness objection *felt* as a relentless pressure on lived experience ("overtime"), grounded in the theory's own logic, and distinct from weakness or heroism.
