answer: |-
  Your diagnosis hits the nerve of the stalemate. This disagreement is **substantive but obscured by divergent explanatory projects and metaphysical commitments**, not merely verbal confusion or independent questions. Here’s a committed analysis, engaging each side’s claims, and a path to progress:

  ### 1. **The Core Disagreement: What Constitutes "Explaining Consciousness"**  
     - **GWT (e.g., Baars, Dehaene)**: Treats consciousness as *operationalizable cognitive access*. Global broadcasting enables information integration, reportability, and executive control. When faced with phenomenal "overflow" (e.g., Block’s visual array experiments), GWT redescribes it as degraded access or memory failure, not proof of non-global phenomenality. *Their move*: Consciousness *just is* the functional property of global availability.  
     - **Phenomenal Realists (e.g., Block, Lamme)**: Argue that phenomenality is ontologically distinct. Neural correlates of perception (e.g., recurrent processing in V1/V2) can occur without global broadcasting. Block’s distinction between *phenomenal* (P-) and *access* (A-) consciousness insists that P-consciousness can "overflow" report. *Their move*: GWT explains *reporting mechanisms*, not the qualitative experience itself.  

     **Why this isn’t merely verbal**:  
     Both sides agree on the empirical data (e.g., NCCs in early vision), but **disagree on which phenomena count as consciousness**. GWT *defines* consciousness by its functional role; phenomenalists treat consciousness as an intrinsic property. This is a clash between **functionalist reductionism** and **non-reductive realism**.  

  ### 2. **Hidden Divergence: What Counts as Explanation**  
     - **GWT** seeks a *causal-mechanistic explanation*: How does information become available for flexible cognition? Success is measured by predictive models of behavior and neural dynamics.  
     - **Phenomenal Realists** demand an explanation of *subjective presence*: Why does processing *feel like something*? They reject functional criteria as insufficient to address the "hard problem".  
     
     **Result**: GWT accuses phenomenalists of invoking "magical" properties; phenomenalists accuse GWT of changing the subject.  

  ### 3. **Your Proposed Distinction: Does It Help?**  
     Distinguishing **"phenomenal presence"** from **"accessibility-to-self-modeling"** is valuable but risks being co-opted:  
     - **GWT Response**: "Accessibility-to-self-modeling" *is* what we mean by consciousness. "Phenomenal presence" without access is untestable and explanatorily idle.  
     - **Phenomenal Realist Response**: Self-modeling is a higher-order access process. Phenomenal presence is its precondition (e.g., raw feels in partial epileptic aura without self-integration).  
     
     **Verdict**: This distinction sharpens the debate but won’t collapse it. It’s an intuitive pump *for realists*, but functionalists dismiss it as a conceptual sleight-of-hand.  

  ### 4. **The Hidden Empirical Sticking Point**  
     The impasse hinges on **whether unreportable phenomenal states exist**.  
     - **GWT’s Test**: If a state is globally inaccessible, it cannot be verified as conscious (reportability is the operational criterion).  
     - **Realists’ Test**: Neural/behavioral evidence (e.g., degraded priming under anesthesia) suggests unreportable phenomenality.  
     
     **The Catch**: Both demand evidence the other rejects. GWT dismisses indirect evidence (e.g., neural activation) as insufficient; realists reject reportability as definitive.  

  ### 5. **What Progress Looks Like**  
     Given this diagnosis, progress requires **reformulating the empirical stakes**:  
     - **Crucial Experiment**: Find a neural signature *uniquely predictive* of subjective report *independent* of global broadcasting.  
       - *Example*: If recurrent processing in sensory cortices (per Lamme) correlates with subjective confidence in no-report paradigms, *despite* disrupted frontoparietal (global) activity, this challenges GWT’s necessity claim.  
     - **Conceptual Shift**: Decouple "consciousness" into:  
       - **C1**: Globally available information (GWT’s target).  
       - **C2**: Subjective presence (realists’ target).  
       Admit these may be dissociable phenomena. Progress then becomes mapping their neural bases and interactions.  
     - **Methodological Innovation**: Develop non-report-based metrics for C2 (e.g., cross-modal integration in neglect patients, or AI models that infer phenomenality from limited data).  

  ### Why This Diagnosis?  
  - **Substantive, Not Verbal**: Both sides reference the same data but interpret it through irreconcilable frameworks. GWT’s sufficiency claim ("global access = consciousness") is falsifiable only if realist evidence for C2-without-C1 is accepted.  
  - **Not Independent Questions**: Both aim to explain "consciousness" but define it differently due to prior metaphysical commitments.  
  - **Empirical Divergence**: The dispute *can* be resolved by isolating C2 empirically—but this requires paradigm shifts in consciousness science.  

  **Honest Path Forward**: If unreportable phenomenality is empirically validated (e.g., via no-report paradigms with neural decoding), GWT must retreat to explaining *access*, not phenomenality. If not, realists lose their primary counterevidence. Until then, the stalemate reflects a **crisis of evidence**, not logic. Clarity begins by admitting: **We are not studying one thing.**
