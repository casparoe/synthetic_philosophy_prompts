  ok so in my philosophy of action seminar we've been stuck for like three weeks on Parfit's hitchhiker. everyone knows the basic deal - you promise the driver you'll pay at the gas station, then once you're there you've got no causal reason to actually do it. but i've been running this variant where the driver doesn't just hear your promise; she gets a noisy signal of your 'dispostion to pay' through micro-behaviors, and the noise is high enough that you can never be sure she'll update her belief. now half the room says you still rationaly ought to pay because the signal is part of the causal chain that gets you the ride, and the other half says the noise severs the link so you're back to plain old rational self-interest, and literally nobody has budged. my gut says this is just the same tired causal-vs-evidential debate with extra biology painted on, but maybe i'm wrong and there's a real new disagreement about epistemic commitment or something. can you diagnose what's actually going on? is it verbal, substantive, hidden empirical? and given your diagnosis, what would actually move the needle - a formal model of noisy commitment, a conceptual distinction i'm missing, or should we just admit it's bedrock intuition?
