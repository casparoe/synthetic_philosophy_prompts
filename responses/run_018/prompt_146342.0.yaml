prompt: |-
  hey — I'm putting together a session for some policy analysts I advise (not philosophers, obviously) and I want them to actually work with the Hofstadter/Sander claim from Surfaces and Essences that analogy isn't decoration, it's literally how concepts move. I need a reusable decision procedre they can run in about 15 minutes when they have to decide whether two regulatory cases count as 'the same kind' for rule-making. The procedure should build on analogical slippage and concept mapping, but I also want them to watch for what I'm calling phantom core mapping — that's when people think they've found deep structural analogy but they've actually just projected surface features onto an empty schema. So: steps in order, what counts as real analogical transfer versus decorative similiarity, the exact point where they flag it as pure rhetoric and stop, and apply it to two cases — comparing social-media content moderation to postal-mail censorship, and comparing carbon-offset markets to medieval indulgences — including at least one where the comparison feels intuitively right but the procedure kills it. Don't turn this into a bibliography or a lit review; these people don't have time to read the whole book. Don't sit on the fence either: tell them what recommendation to file when the mapping is ambiguous but there's still a deadline, and be honest about where the procedre just fails and a person has to make the call. Keep it practical, I'm not asking for a metaphysics essay.
reasoning: |-
  Okay, the user needs a practical 15-minute decision procedure for policy analysts to determine if two regulatory cases are "the same kind" based on Hofstadter/Sander's analogy theory. Let me start by breaking down the key requirements. 

  First, they mentioned analogical slippage and concept mapping, but also "phantom core mapping"—when people mistake surface similarities for deep structural analogies. So the procedure must differentiate between real analogical transfer and decorative similarity. 

  The examples given are social-media moderation vs. postal-mail censorship, and carbon offsets vs. medieval indulgences. One should pass the test, the other fail even if it feels intuitive. Need to ensure the steps clearly flag phantom mappings. 

  The user emphasized practicality. No literature reviews—just actionable steps. Analysts need to decide under deadlines, so include a fallback for ambiguous cases. Also, admit where the procedure fails and human judgment is necessary. 

  Hofstadter/Sander's core idea is that analogy is how concepts move, not just decoration. So the procedure should focus on deep functional structures, not surface features. Steps need to guide users through identifying purpose, mechanisms, stakeholders, etc., and then check for structural alignment. 

  Phantom core mapping is a big concern. To counter that, the steps should force looking beyond surface similarities. For example, in the indulgences case, surface similarities (paying to offset sins/emissions) might trick them, but the mechanisms and stakeholders differ. The procedure must highlight that disconnect. 

  The fallback recommendation for ambiguous cases is to file as "novel with caution." That makes sense—it prevents false equivalence but allows for provisional categorization. Also, acknowledging when the procedure fails (e.g., high stakes or novel areas) keeps it honest. 

  Testing the examples: Social media vs. postal mail should pass because both involve content control at scale, intermediaries, legal frameworks, etc. Carbon offsets vs. indulgences fails because the market mechanisms and accountability structures differ fundamentally. The latter feels intuitive but collapses under scrutiny, which meets the user's request. 

  Need to ensure each step is clear and time-boxed. Breaking it into 5-minute chunks (Purpose, Mechanism, Stakeholders; Slice and Map; Phantom Core Check) fits the 15-minute limit. Including a "kill switch" step (Step 4) where decorative analogies are flagged early. 

  The user’s deeper needs: They want analysts to avoid superficial comparisons that lead to flawed policies. The procedure should build critical thinking about analogies, prevent rhetorical false equivalences, and provide a defensible process for decision-making under time constraints. 

  Finally, the conclusion must be decisive—no fence-sitting. When the mapping is shallow, kill the analogy; when ambiguous but urgent, file with caveats. Emphasizing that some cases require human judgment maintains practicality without overpromising.
answer: |-
  Here's a battle-tested 15-minute procedure for your policy analysts, designed to kill phantom analogies and spot real concept transfer:

  **The "Deep Map or Scrap" Analogy Procedure (Hofstadter/Sander Edition)**

  **Core Principle:** **Analogy is valid ONLY if the *purpose-driven functional structure* of the source concept maps reliably onto the target, enabling prediction/action.** Decorative similarity is surface-level resemblance without this transferable core.

  **Time Allocation:**  
  *   **Steps 1-3:** 5-7 minutes  
  *   **Step 4:** 2-3 minutes (The Kill Switch)  
  *   **Step 5:** 5 minutes  
  *   **Step 6:** 1 minute  

  **The Steps:**

  1.  **Define the Core Purpose (Source & Target):** (2 min)  
      *   *Source Case (Known/Established):* "What is the **fundamental purpose** this rule/case serves? What core problem does it solve or value does it protect?" (e.g., Postal Mail Censorship: *Prevent physical harm/illegal acts via controlled material transport*).  
      *   *Target Case (New/Proposed):* "What is the **fundamental purpose** we *think* this case serves OR the purpose we want to regulate it for?" (e.g., Social Media Moderation: *Prevent digital harm/illegal acts & maintain platform usability via user-generated content*).  
      *   **Flag:** If core purposes seem wildly different *prima facie*, proceed cautiously. This is often where phantom cores hide.

  2.  **Slice the Mechanism (Source & Target):** (3 min)  
      *   Break down *how* the source case achieves its purpose into **3-5 essential functional components** (Forget surface details! Focus on roles/actions):  
          *   *Postal Mail:* **1. Sender** initiates transfer -> **2. Physical Carrier** transports sealed container -> **3. Centralized Choke-Point (Govt/PO)** inspects *based on defined illegal content* -> **4. Recipient** receives (or doesn't).  
      *   Now, map ruthlessly onto the target:  
          *   *Social Media:* **1. Poster** initiates publication -> **2. Digital Platform** hosts/distributes data -> **3. ???** inspects *based on platform rules + laws* -> **4. User/Public** sees (or doesn't).  
      *   **Ask:** Is there a **direct functional equivalent** for *every essential source component*? Does the target have components playing *identical structural roles*? (Here: "Centralized Choke-Point" vs. "???" is critical. The *Platform* is both Carrier *and* Inspector? Structural shift!).

  3.  **Stress Test the Stakeholders & Levers:** (2 min)  
      *   *Source:* Who are the key actors? What are their powers/incentives/constraints? What levers does the regulator pull? (e.g., Postal: Govt controls PO/inspection directly; Sender/Recipient have limited power; Physical evidence chain).  
      *   *Target:* Map actors & levers precisely. Do they occupy the *same functional positions*? Do the regulatory levers work *the same way*? (e.g., Social Media: Govt regulates *platform* indirectly; Platform has immense scale/complexity & private incentives; Poster/User have amplification power; Content is ephemeral, context-dependent).  
      *   **Flag:** Mismatches in actor roles, power dynamics, or regulatory leverage indicate slippage or phantom mapping.

  4.  **The Phantom Core Kill Switch:** (2 min) **THIS IS CRITICAL**  
      *   **Ask Explicitly:** "Are we mistaking **surface features** (e.g., "moving messages," "blocking content") or **emotive language** (e.g., "censorship!") for a shared deep structure?"  
      *   **Force the Flip Test:** "If we changed the *superficial labels* (e.g., call it 'safety filtering' instead of 'censorship'), does the *structural mapping still hold* based on Steps 1-3?" If not, it's phantom.  
      *   **KILL HERE if:** The mapping relies *primarily* on shared vocabulary, emotional resonance, or broad goals ("both involve communication") *without* the detailed functional alignment from Steps 2 & 3. **This is "Decorative Similarity" - File as "Not Analogous (Rhetorical)" and stop.**

  5.  **Predictive Power Check:** (5 min)  
      *   **Ask:** "If we apply the *source case's rules/logic* directly to the target case based on this mapping, will it **reliably produce the desired outcome** for the *target's core purpose*?"  
      *   **Probe Failures:** *Where* would it break? Why? (This exposes hidden structural differences).  
      *   **Ask:** "What key *novel elements* in the target have no counterpart in the source? How do they disrupt the analogy?" (e.g., Scale, speed, algorithmic opacity, user agency in dissemination on social media vs. physical mail).  
      *   **Real Analogical Transfer:** Exists ONLY if the mapped structure provides reliable insight/predictive power for rule-making in the *new* context. Decorative similarity offers no reliable guidance.

  6.  **Verdict & Action:** (1 min)  
      *   **Strong Structural Match (Steps 1-5 hold):** "Analogous." File recommendation to adapt existing rule framework cautiously, noting key differences found in Step 5.  
      *   **Significant Slippage/Novelty (Steps 4 or 5 reveal major breaks):** "Not Analogous." File recommendation to treat as a *novel* regulatory challenge. Develop new framework.  
      *   **Ambiguous (Structural parallels exist but major disconnects too):** **"Provisional Scaffold ONLY - Novel with Caution."** File recommendation: *Tentatively* use source framework as a *starting point for discussion* BUT explicitly flag the critical points of slippage (from Step 5) as unresolved risks requiring novel solutions. **THIS IS THE DEADLINE FALLBACK.**  
      *   **Procedure Fails (High Complexity/True Novelty):** When the target case involves fundamentally new actors, technologies, or incentives with *no* clear functional parallels, OR when core purposes are in deep conflict. **Human Judgment Call Required:** Flag as "Conceptually Novel - No Clear Analogy." Requires bespoke analysis.

  **Applied to Your Cases:**

  1.  **Social Media Moderation vs. Postal Mail Censorship:**  
      *   **Step 1:** Core Purpose (Prevent Harm via Content Control) - *Matches.*  
      *   **Step 2:** Slicing shows **Structural Shift.** Postal has a clear, centralized, *physical* inspection point *separate* from the carrier. Social Media has the *platform itself* (carrier + infrastructure) performing distributed, algorithmic *and* human review at massive scale, *not* just at a single choke-point. Key roles are blended.  
      *   **Step 3:** Stakeholder power is inverted. Govt had direct control over the Postal chokepoint. Govt has indirect, contested control over platforms. Users have vastly more power to disseminate.  
      *   **Step 4:** Flip Test: Call it "Content Safety Management" vs. "Censorship." The *structural differences* (blended roles, scale, user power) remain critical. **Not purely phantom, but slippage is major.**  
      *   **Step 5:** Applying *physical mail inspection rules* (e.g., pre-screening every item) fails catastrophically at internet scale/speed. Predictive power is low. Novel elements (algorithms, virality, user moderation tools) dominate.  
      *   **Verdict:** **Provisional Scaffold ONLY - Novel with Caution.** Regulatory concepts like "common carrier" or "obscenity standards" might be starting points, but the *mechanism* for control must be fundamentally rethought. Don't pretend it's the "post office for the internet."

  2.  **Carbon-Offset Markets vs. Medieval Indulgences:**  
      *   **Step 1:** Core Purpose? Indulgences: *Reduce religious penalty (sin) for the payer, fund the Church.* Carbon Offsets: *Compensate for emissions via verified reduction elsewhere, fund climate projects, achieve net-zero goals.* **Surface similarity ("pay to absolve"), but core purposes diverge fundamentally (spiritual vs. physical/environmental accounting; individual salvation vs. collective atmospheric impact).**  
      *   **Step 2:** Slicing:  
          *   *Indulgences:* **1. Sinner** commits sin -> **2. Church Authority** defines sin/penalty -> **3. Payment** to Church -> **4. Authority** grants *spiritual* absolution. **No physical change in the sin's consequence.**  
          *   *Carbon Offsets:* **1. Emitter** produces CO2 -> **2. Regulator/Market** sets rules/verification -> **3. Payment** to Project -> **4. Project** must *physically verifiably* remove/avoid equivalent CO2. **Requires measurable physical change.**  
      *   **Step 3:** Stakeholders: Church (central authority, beneficiary) vs. Complex market (verifiers, project developers, regulators, beneficiaries diffuse). Levers: Faith/authority vs. Science/measurement/contracts. **Massive disconnect.**  
      *   **Step 4: PHANTOM CORE ALERT!** "Pay to absolve" is the *surface hook*. Flip Test: Call it "Sin Compensation Certificates" vs. "Emission Mitigation Units." The structural mapping collapses. The core mechanism (spiritual grant vs. physical mitigation) is utterly different. **KILL HERE.** Decorative, rhetorical similarity.  
      *   **Verdict:** **Not Analogous (Rhetorical).** File recommendation: **Reject the indulgence analogy entirely.** Analyze offsets purely on their *environmental integrity and economic mechanisms*. The comparison is misleading and prevents understanding the *actual* structure and risks (e.g., additionality, measurement).

  **Key Takeaways for Analysts:**

  *   **Chase the Function, Not the Label:** How does it *work*, not what is it *called*?
  *   **Slice Ruthlessly:** Break into core functional components. Map roles, not descriptions.
  *   **Kill Phantoms Early:** If it relies on emotive words or surface vibes without deep structural alignment (Flip Test!), scrap it. Don't waste time.
  *   **Predict or Perish:** If the analogy doesn't help predict outcomes of applying rules, it's useless for policy.
  *   **Ambiguity isn't Failure:** "Provisional Scaffold" is a valid, honest outcome under pressure. Just flag the cracks.
  *   **Some Things are New:** Admit when there's no good analogy. Don't force it.

  This procedure forces them to move beyond "this *feels* like that" to "does the *functional skeleton* of this known case actually fit the new problem in a way that helps us govern?" Good luck!
