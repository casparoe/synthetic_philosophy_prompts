answer: |-
  ### Exam Question  
  **Answer the following in a continuous, structured essay (approx. 650 words):**  

  > In *The Enforcement of Morals*, Lord Devlin argues that society has a right to preserve its "shared morality" through law to prevent disintegration. H.L.A. Hart counters that this conflates law with morality and fails to distinguish genuinely *shared* moral beliefs from merely *dominant* ones imposed by a majority.  
  >  
  > **Imagine a liberal democracy ("Demetia") where 40% of citizens adhere to a coherent, institutionally established alternative morality** (e.g., based on communal duty, spiritual purity, or collective honor). Their views are embedded in schools, local governments, and cultural institutions. Laws banning "public desecration of sacred symbols" (supported by 55% of Demetians) are challenged by the minority as oppressive.  
  >  
  > Does Devlin’s "social cohesion" argument implicitly treat majority morality as having *epistemic dominance*—i.e., as universally ascribed even to dissenters? Can Hart’s harm principle distinguish "harm" from "offense" in this context without relying on liberal assumptions? Crucially, **what does "shared morality" mean when a large, integrated minority rejects it?**  

  ---

  ### Model Answer (643 words)  

  Devlin’s thesis relies on a foundational ambiguity: when he claims society must defend its "shared morality," he conflates *majority* morality with *social* morality. Demetia exposes this flaw. The 40% minority’s institutional embeddedness proves they are socially integrated *without* accepting the majority’s norms. Devlin’s argument that violating shared morals "threatens disintegration" presumes morality is monolithic. Demetia shows society can function stably despite deep moral pluralism. By framing majority beliefs as the "shared" foundation, Devlin implicitly grants them epistemic dominance—treating them as objectively necessary for social survival, rendering minority dissent irrational or deviant. This collapses "society’s morality" into "what the majority believes society requires," a circular justification for enforcing dominant views.  

  Hart’s critique targets this vagueness but faces its own challenge in Demetia. His harm principle insists law should only prevent "harm to others," not enforce morality *as such*. Yet Demetia’s law banning "desecration of sacred symbols" forces Hart to define "harm." The majority claims desecration *harms* social cohesion; the minority sees the law itself as harmful coercion. Hart might call the offense from desecration "mere distaste," not real harm. But this assumes a liberal distinction between physical/psychological harm (actionable) and symbolic/moral offense (not actionable). For Demetia’s majority, sacred symbols *are* constitutive of social identity; their violation *is* psychological harm. Hart’s distinction thus smuggles in liberal individualism—prioritizing personal autonomy over communal bonds—without justifying why *his* harm threshold is neutral.  

  This reveals Hart’s deeper problem: his harm principle cannot resolve Demetia’s conflict because "harm" is inherently moralized. Calling offense "not real harm" dismisses the majority’s moral framework as invalid. Yet if Hart accommodates their claim, he permits moral enforcement, betraying his anti-Devlin stance. Hart avoids this by presupposing a minimal, pluralism-friendly morality—precisely what Demetia lacks. His theory works only if society already shares liberal premises.  

  The Demetia case thus destabilizes both thinkers. Devlin cannot explain how morality is "shared" when a coherent minority rejects it. Calling it "shared" becomes an enforcement tactic, not a descriptor. Hart, meanwhile, cannot neutrally define "harm" in moral conflicts without privileging liberalism. Both stumble over pluralism.  

  Ultimately, "shared morality" in divided societies like Demetia is a fiction masking power. Devlin’s cohesion argument demands uniformity where none exists, mistaking dominance for consensus. Hart’s harm principle, while curbing moral tyranny, relies on unspoken liberal values that may exclude non-liberal conceptions of the good. A defensible approach requires transparent criteria for when moral claims reflect genuine social necessity versus majoritarian preference—but neither theorist provides this. Devlin’s failure is epistemic (confusing majority sentiment for social truth); Hart’s is normative (covertly imposing liberal harm standards). Demetia proves that without confronting pluralism’s reality, both theories risk either oppression (Devlin) or ideological bias (Hart).  

  ---

  ### Marking Scheme  

  **Grade A (Exceptional) | Must Demonstrate:**  
  1. **Devlin’s Epistemic Dominance**: Explicit analysis of how Devlin treats majority morality as "objectively necessary" for social survival, thereby invalidating minority dissent as socially destructive.  
  2. **Hart’s Liberal Bias**: Clear argument that Hart’s harm/offense distinction *presupposes* liberal values (e.g., individualism, autonomy) rather than deriving them neutrally.  
  3. **"Shared Morality" Deconstructed**: Insight into how Demetia’s integrated minority exposes "shared" as a misleading term that conflates *enforced* norms with *actual* consensus.  
  4. **Structural Critique**: Demonstration that both theories fail in pluralism—Devlin by equating morality with cohesion, Hart by covertly relying on liberalism.  
  5. **Synthesis**: Original conclusion (e.g., "Both theories mask power dynamics"; "Pluralism forces a choice between coercion and bias").  

  **Grade B (Proficient) | Must Demonstrate:**  
  1. **Devlin’s Majoritarian Flaw**: Identifies that Devlin assumes majority morality = social morality, but may not articulate "epistemic dominance" explicitly.  
  2. **Hart’s Harm Principle Challenge**: Notes Hart struggles to define harm neutrally in Demetia, but may not trace this to *liberal presuppositions*.  
  3. **Pluralism’s Impact**: Explains that the minority undermines "shared morality," but may not probe institutional integration’s significance.  
  4. **Theoretical Limits**: States that both theories face problems in Demetia, but with less depth on *why* (e.g., "Hart’s harm isn’t clear," not "Hart’s harm is liberal-biased").  
  5. **No Synthesis**: Summarizes tensions without an original concluding critique.  

  **Grade C or Below**: Summarizes Hart/Devlin debate superficially; ignores Demetia’s pluralism; treats "shared morality" uncritically; fails to engage harm vs. offense.  

  ---  
  This question forces students to *use* the Hart-Devlin framework to dissect a novel scenario, avoiding summary while testing their grasp of conceptual tensions. The model answer and scheme reward engagement with pluralism’s implications for both theories’ coherence.
