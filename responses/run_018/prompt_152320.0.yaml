  ### Key Philosophical Tensions:  
  Your hybrid view attempts to reconcile encroachment's psychological plausibility with invariantism's metaphysical simplicity. The viability hinges entirely on whether:  
  1. Assertion norms can be *the exclusive conduit* for stakes (rejected by radical contextualists like DeRose),  
