      *Credence: `0.25`*  
      Justification: While SSI can appeal to psychological bias or attention (Hawthorne), it struggles with *disagreement data* (e.g., low-stakes subject denying high-stakes subject "knows"). Contextualism better handles cross-context denials.

  4.  **(d) Knowledge/assertion distinction is robust enough**  
      *Credence: `0.85`*  
      Justification: The norm of assertion is widely accepted as distinct from knowledge (e.g., Williamson's knowledge norm). However, whether it can *fully* absorb *all* stakes effects without leakage into knowledge remains contested.

