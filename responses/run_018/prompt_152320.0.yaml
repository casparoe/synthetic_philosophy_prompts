prompt: |-
  I just finished a long, frustrating argument with a close friend about whether pragmatic encroachment and epistemic contextualism are genuine rivals or can be reconciled, and we still cannot locate where our disagreement actually lives. I am hoping a decomposed credence will expose the fault line.

  Please state your actual credence—just a number—that the correct resolution is this specific hybrid view: pragmatic encroachment is real, but it operates solely on norms of warranted assertion rather than on the truth-conditions of knowledge attributions; consequently, epistemic contextualism (the view that the semantic standards for "knows" shift with conversational context) is false, and subject-sensitive invariantism holds only once we sharply separate the state of knowing from the entitlement to assert that one knows.

