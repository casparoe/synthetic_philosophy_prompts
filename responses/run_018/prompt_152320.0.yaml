  ### Least Confident Term: **(c) Invariantism explains bank cases without contextualism**  
  - **Evidence to move it**: Cross-contextual linguistic data (e.g., experiments where subjects evaluate *others'* knowledge attributions across stake-divergent contexts). If speakers consistently treat "knows" as invariant when aware of conflicting practical contexts, it would support (c). Conversely, evidence of systematic retraction/relativization (e.g., "I was wrong, they didn't *really* know") would decrease (c).

  ### Diagnosing Your Disagreement Gap (0.60 vs. 0.25):  
  The term most likely explaining your divergence is **(a) Stakes directly affect knowledge**.  
