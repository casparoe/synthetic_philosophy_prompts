prompt: |-
  I am a doctoral student in political philosophy working on global justice. I have been developing an argument about institutional complicity and foreign aid obligations, but it seems to collapse into an unacceptable conclusion, and I need help locating the precise failure. Here is the chain.

  (1) If a group of agents collectively maintains an institutional arrangement that foreseeably and avoidably produces severe deprivation, and they could support reform at moderate cost to themselves, then members of that group bear a collective obligation to reform it.

  (2) The current global economic order—including trade regimes, resource privileges, and sovereign debt structures—foreseeably and avoidably produces severe deprivation in low-income countries.

  (3) Citizens of wealthy countries participate in, benefit from, and have democratic leverage over this order, and supporting institutional reform would impose only moderate costs on them.

  (4) Therefore, citizens of wealthy countries have a collective obligation to reform the global order.

  (5) Where immediate reform is politically blocked, providing foreign aid is required as a second-best fulfillment of that same obligation, not as charity.

  (6) But citizens also collectively maintain domestic institutional arrangements—tax structures, zoning laws, labor regulations—that foreseeably and avoidably produce severe domestic deprivation.

  (7) By parity of reasoning with (1)–(3), citizens bear equally strong collective obligations to reform those domestic institutions.

  (8) If both obligations are genuinely demanding—potentially requiring substantial redistribution and sustained political mobilization—then citizens face contradictory or practically impossible demands.

  (9) Yet it is implausible that moral obligations can require the impossible, or that citizens must choose arbitrarily between foreign and domestic reform.

  (10) So either (1) is false, or there is a principled restriction on institutional complicity that applies domestically but not globally, or the obligation to foreign aid is far weaker than (5) suggests.

  My instinct is to preserve (1) and reject something around (6)–(8), but I cannot see a non-ad-hoc way to restrict the scope of complicity so that it generates demanding global obligations without generating equally demanding domestic ones. Which step should I reject? If I must choose, I would prefer to keep the institutional framing over the conclusion in (10), but I want to know exactly what that choice costs—whether it requires denying that domestic institutions are genuinely coercive, or whether it forces me to accept that foreign aid obligations are genuinely in conflict with domestic justice obligations and must be weighed rather than treated as independent duties. Please diagnose the argument precisely: identify the step, explain why it looked defensible, and price the alternatives.
reasoning: |-
  Okay, the user is a doctoral student in political philosophy working on global justice. Their argument about institutional complicity and foreign aid obligations leads to an apparent contradiction between demanding global and domestic obligations. They need help identifying where the argument fails.

  The core tension arises between steps (4) and (7): citizens of wealthy countries have demanding obligations both to reform the global economic order and to reform domestic institutions that cause severe deprivation. When both are framed as equally binding collective obligations requiring substantial resources, this creates a practical impossibility problem (step 8).

  The user's instinct is to preserve premise (1) - the institutional complicity principle - but restrict its application to avoid equally demanding domestic obligations. The challenge is doing this without being ad hoc.

  Hmm... the key might lie in how we define the "group of agents" in premise (1). For global obligations, the relevant group is "citizens of wealthy countries" acting collectively through their states. But for domestic deprivation, responsibility may be distributed differently - perhaps primarily to domestic policymakers rather than citizens collectively. This distinction could be supported by democratic theory about agency dispersion.

  Alternatively, we might question premise (7)'s claim of "equally strong" obligations. The global obligation could be more stringent due to features like the absence of alternative accountability mechanisms for global poor, or the non-reciprocal nature of harm in global systems. 

  The user should consider that rejecting (7) doesn't deny domestic obligations exist, but argues they differ in nature - perhaps being individual duties to vote/advocate rather than collective obligations to directly reform institutions. Or we might distinguish types of "complicity," with global citizens being direct participants versus domestic citizens being beneficiaries with attenuated responsibility.

  The cost of this approach is potentially weakening the theoretical purity of the institutional complicity model when applied domestically. But it preserves the core global justice argument while acknowledging domestic justice operates through different mechanisms.
answer: |-
  Your argument encounters a genuine tension in institutional complicity theory, but the flaw lies in **step (7)'s claim of "equally strong" obligations** and the **undifferentiated treatment of agency in steps (6) and (3)**. Here’s a precise diagnosis:

  ### **Step of Failure: Step (7)**
  - **Why it looks defensible**: The symmetry between global/domestic institutions seems compelling. If citizens maintain *any* harmful institution (domestic or global) under conditions of avoidability, benefit, and moderate-cost reform, parity suggests equivalent obligations.
  - **Why it fails**: It ignores **critical asymmetries in agency, causality, and alternatives**:
    1. **Dispersion of Agency**: In domestic contexts, citizens’ *direct causal responsibility* for harm is mediated by complex layers of representation, bureaucratic autonomy, and interest groups. In global systems, wealthy states (and by proxy, their citizens) hold *disproportionate agenda-setting power* (e.g., IMF voting, trade negotiations), making their complicity more direct.
    2. **Availability of Alternatives**: Domestically, citizens can often fulfill obligations through *existing democratic channels* (voting, advocacy). Globally, no equivalent mechanism exists—reform requires states to act, making aid a *necessary interim measure* when reform is blocked (as in step 5). Domestic deprivation rarely requires citizens to bypass their own state.
    3. **Nature of Harm**: Global systems (e.g., resource privileges) often involve *active imposition* of rules on weaker states, while domestic harms arise from *internal* policy failures. The former implies stronger duties of redress under principles of coercive interference.

  ### **Price of Rejecting Step (7):**
  - **What you keep**: Premise (1), the core global obligation (step 4), and the second-best duty of aid (step 5).
  - **What you modify**: Domestic obligations are *not equally demanding* in practice. Citizens have:
    - A **primary duty to reform domestic institutions** via political participation (voting, activism).
    - **No equivalent "second-best" burden** (like foreign aid) because domestic safety nets already exist (e.g., welfare systems)—even if flawed, they distribute costs collectively.
  - **Cost**: You must argue that domestic complicity is *attenuated* by democratic processes. Critics (e.g., poverty abolitionists) may accuse you of underestimating domestic duties. To counter:
    - Emphasize that domestic reform leverages *existing institutions*, avoiding new resource drains.
    - Cite empirical work on political accountability (e.g., Piketty’s elite capture theories) showing citizens’ limited control vs. global power asymmetry.

  ### **Alternative Revisions & Their Costs:**
  1. **Restrict Premise (1) to Transboundary Harm**:  
     - Argue complicity obligations apply only when institutions *cross borders* (e.g., global trade rules harming outsiders).  
     - *Cost*: Abandons universalism; fails to explain duties to "internal" victims (e.g., oppressed minorities).  

  2. **Reject "Equally Demanding" in Step (8)**:  
     - Global obligations could be *lexically prior*: address severe deprivation abroad first, as victims lack alternative protectors.  
     - *Cost*: Requires contentious prioritarianism; may violate special obligations to co-citizens.  

  3. **Reinterpret "Moderate Cost" in Steps (1)/(3)**:  
     - Global reform costs may be *collectively* moderate but *individually* trivial (e.g., 0.7% GDP aid), while domestic reform demands sustained personal activism.  
     - *Cost*: Risks instrumentalizing distant suffering; ignores domestic political mobilization costs.

  ### **Why Preserving (1) is Defensible:**
  Your instinct is correct—the institutional complicity framework is powerful for global justice. To resolve the contradiction:
  - **Clarify Agency**: Citizens exercise global complicity *through their state’s coercive power* (e.g., enforcing unfair treaties). Domestically, they are *beneficiaries* of harmful systems but not primary coercive agents.  
  - **Invoke Non-ideal Theory**: Where global reform is blocked (step 5), aid is a *temporary duty of redress* for ongoing harm. Domestic failures don’t generate analogous duties because they don’t involve *imposing* harm on outsiders.  
  - **Empirical Nuance**: Not all domestic deprivation stems from *institutional complicity*—some arises from market forces or personal choices, weakening step (6)’s analogy.

  ### **Conclusion**
  Reject step (7)’s false equivalence. The cost is accepting that **domestic obligations are primarily political (reform via democratic means)**, while **global obligations are both political and redistributive (aid as redress when politics fails)**. This doesn’t deny demanding domestic duties but locates them in *civic action* rather than *resource transfer*. The tension isn’t fatal—it reflects the non-ideal reality that justice demands different tools in different arenas.  

  *Recommended refinement*: Add a *victim vulnerability* clause to premise (1): Obligations strengthen when victims lack institutional recourse. This preserves global duties while contextualizing domestic ones.
