     This series (alternating harmonic series) is conditionally convergent (to ln(2)) but not absolutely convergent (since the harmonic series diverges).
  5. **Feature that does the work**: The absence of absolute convergence (i.e., the series of absolute values diverges) is the key. This makes the expectation depend on the order of summation. Although we have a natural order (by time), the deeper issue is that the expectation is not robust to the representation of the state space. Hence, the expectation is undefined in the strong sense (it is not just that it diverges to infinity, but that it can be rearranged to yield any value).
