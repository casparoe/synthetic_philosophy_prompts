  ### Toast

  "Good evening, everyone. We’re gathered to celebrate an extraordinary woman—our mentor, colleague, grandmother, and friend—on her 75th birthday. For those of us who’ve worked beside her, we know her as the civil rights titan who still takes pro bono cases at midnight. For her grandkids, she’s the grandma who tells courtroom stories like they’re fairy tales. She once told me her favorite birthday ritual was reading Cicero’s essay on old age. In it, Cicero tackles four classic complaints about aging. Tonight, I’ll borrow that framework—not to romanticize, but to honor her honesty about this chapter.  

  **First, Cicero says old age pulls you out of public life.** Well, she can’t drive after dark anymore, and that’s forced her to step back from late-night meetings or protests. Cicero argued this ‘retreat’ lets elders share wisdom from the sidelines. Does that hold up? Partially. She’s still dissecting case files at her kitchen table, advising young lawyers, and fighting for justice—just remotely. But let’s be real: it’s not the same as her storming courthouses for forty years. So no, I won’t call this a ‘liberating new chapter.’ Grandkids, think of it like this: Your grandma’s still a superhero—she just battles injustice from her couch now.  

  **Second, Cicero admits old age weakens the body.** Here, it’s painfully true. After chemo, she says food tastes like cardboard. Cicero claimed mental strength compensates for physical decline. But when her favorite bourbon tastes like water? That rebuttal crumbles. Her mind’s a scalpel—sharp as ever—yet losing simple joys is a real wound. So I won’t pretend this is some ‘fresh start.’ Instead, grandkids, know this: When she savors your laughter instead of steak, it’s proof her spirit outmuscles her body.  

  **Third, Cicero warns old age strips away pleasure.** He thought elders traded sensual delights for deeper joys—like friendship or art. For her? The move to a smaller apartment meant parting with books, art, and memories. And chemo stole the bliss of a good meal. Cicero’s half-right: She finds joy in your visits, grandkids, and in winning cases for the voiceless. But when chocolate tastes like chalk? That’s loss, not enlightenment. So no, we won’t call downsizing ‘liberation.’ Instead, we’ll say this: Her pleasure now is in your voices, not vintage wine—and that’s a trade she makes with grace.  

  **Finally, Cicero confronts the fear: Old age puts you close to death.** He argued a life well-lived should dissolve that dread. But she’s human. She’s terrified of dying alone—even if she’d never say it aloud. Does his rebuttal hold? No. Courage isn’t fearlessness; it’s facing fear daily. Her legacy—forty years of bending the arc toward justice—is immortal. But the quiet terror? That’s real. So I won’t offer hollow comfort about her ‘watching over us.’ Instead, grandkids, listen closely: Your presence here tonight, your hugs, your stories—that’s the armor against that fear. We’re her living answer to mortality.  

  So let’s raise a glass. To a woman who taught us that aging isn’t about defiance or surrender—it’s about clarity. She shows us how to stare down Cicero’s complaints without flinching, how to find joy in cardboard-tasting cake, and how to let love be louder than fear. Happy 75th, to the mentor who’s still writing her story—on her own terms."  

