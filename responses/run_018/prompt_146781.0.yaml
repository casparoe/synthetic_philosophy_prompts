prompt: |-
  After a long argument with a friend about Mary's room, I have been struck by an asymmetry in how my university's neuroscience and design divisions actually operate. In the clinical research wing, investigators treat first-person phenomenological reports—detailed descriptions of synesthetic colors, migraine auras, or phantom-limb sensations—as indispensable primary data, and regard brain scans without accompanying subjective testimony as methodologically incomplete. Yet in the vision-science curriculum and in digital-accessibility certification, the same institution behaves as if every fact about color is fully capturable by physical and algorithmic descriptions: students can complete the entire color-vision sequence without any check on whether they personally experience the phenomena they study, and accessibility offices approve color-coding schemes using spectral-simulation filters that have never been validated against the actual experience of color-blind users. Meanwhile, our philosophy-of-mind seminars present Mary's case as asking whether complete physical knowledge leaves something out, with the standard replies—that she only acquires abilities, or acquaintance, not new propositional knowledge—taught as if they resolve the tension. So what implicit theory of phenomenal knowledge does this institutional pattern actually presuppose? Must it hold that there is an irreducibly first-personal kind of knowledge, or can the clinical and educational practices be reconciled under a consistent physicalism that simply assigns different pragmatic weights to subjective reports in different contexts? Reconstruct the implicit epistemology that makes both sides cohere, distinguish what the practice strictly requires from what it merely accommodates, indicate where it is philosophically underdetermined, and tell me what would have to change in either the research protocols or the certification standards if we replaced the underlying view with one that denies any special epistemic status to first-person color experience.
reasoning: |-
  Hmm, the user presents a fascinating puzzle about institutional epistemology regarding Mary's room thought experiment. They observe a stark contrast: neuroscience treats subjective reports as indispensable data, while vision science and accessibility design operate as if color experience is fully capturable through physical descriptions. The philosophy department teaches standard physicalist responses to Mary's case as if resolving the tension, but the institutional practices seem inconsistent.

  The user wants me to reconstruct the implicit epistemology that makes these practices cohere. They specifically ask to: distinguish what's strictly required vs accommodated, identify where it's underdetermined, and explain what would change if we denied special status to first-person experience.

  I need to analyze this through multiple lenses. At its core, this is about reconciling first-person phenomenology with third-person physicalism in institutional settings. The neuroscience practice suggests they treat qualia as irreducible data points - you can't reduce "this migraine aura feels jagged" to brain scans alone. Yet the vision science curriculum implies qualia don't add new propositional knowledge, just new modes of access.

  The key might be pragmatic contextualism: different epistemic standards apply based on the domain's purpose. Neuroscience aims for mechanistic explanations where subjective reports serve as validation anchors. Vision science focuses on functional models where subjective experience is output, not input. Accessibility prioritizes actionable standards over phenomenological depth.

  Where philosophy underdetermines this is in the "knowledge gap" question. The institution seems agnostic about whether Mary gains new facts or just new acquaintance - both practices can coexist as long as we don't push the question. 

  If we eliminated special status for first-person experience, neuroscience would collapse without subjective data. Conversely, accessibility might improve by forcing engagement with actual color-blind experiences rather than relying on simulations. The real tension lies in whether we treat phenomenology as evidence or as implementation detail.
answer: |-
  Your observation reveals a profound institutional epistemology that navigates between pragmatic operationalism and implicit property dualism. Let's reconstruct its foundations, distinguish necessities from accommodations, and explore alternatives:

  ### Implicit Epistemology: Contextual Pragmatic Pluralism
  1. **Domain-Specific Epistemic Priorities**  
     - *Clinical Neuroscience*: Treats subjective reports as **irreducible calibration tools**. Brain scans are maps of correlates, but phenomenology provides the "Rosetta Stone" for interpretation (e.g., distinguishing seizure auras from migraines via descriptive nuances).  
     - *Vision Science/Accessibility*: Adopts **functionalist criteria**. Color is operationalized as wavelength discrimination capacities. Accessibility standards prioritize reproducible environmental interactions over private experience.  
     - *Philosophy*: Teaches the *ability hypothesis* (Lewis/Nemirow) as a formal reconciliation tool, sidestepping ontological commitments while preserving physicalist syllabi coherence.

  2. **Core Presuppositions**  
     - **Epistemic Asymmetry**: First-person access has unique *evidential* status for verifying neural correlates, but no *explanatory* role in vision mechanisms.  
     - **Pragmatic Thresholds**: Subjective data is required where failure risks include misdiagnosis (clinical harm), but omitted where outcomes are behaviorally verifiable (color accessibility).  
     - **Neutral Monism Lite**: Treats qualia as non-contradictory to physicalism *if* confined to specific methodological contexts.

  ### Strict Requirements vs. Accommodations
  | **Domain** | **Strictly Required** | **Merely Accommodated** |
  |------------|------------------------|-------------------------|
  | **Neuroscience** | Subjective validation of objective data; correlation protocols | Ontological status of qualia |
  | **Vision Science** | Competence in computational color models | First-person verification of teaching materials |
  | **Accessibility** | Compliance with WCAG contrast algorithms | Direct user-experience validation |
  | **Philosophy** | Logical consistency of physicalism | Resolution of the "hard problem" |

  ### Philosophical Underdetermination
  The practice *does not resolve*:
  - Whether Mary's new knowledge is **propositional** (e.g., "redness is *this*") or merely **acquaintance-based**
  - Whether phenomenal concepts are **physically reducible** or require unique epistemic portals
  - Why subjective reports are *evidentially privileged* in labs but *epistemically redundant* in design

  ### Consequences of Denying First-Person Epistemic Privilege
  Eliminating special status for subjective experience would force:

  **In Neuroscience**  
  - Replace phenomenological interviews with **inferential proxies** (e.g., machine learning classifiers trained on biometrics + verbal reports)  
  - Risk false correlations (e.g., misattributing neural activity to pain without self-report)  
  - *Protocol change*: Require behavioral batteries to "translate" inner states (e.g., priming tasks for synesthesia)

  **In Accessibility**  
  - **Mandate lived-experience panels** for all color schemes, invalidating simulation-only approval  
  - Shift from spectral thresholds to **phenomenological metrics** (e.g., user-described confusion rates)  
  - *Standard change*: Replace algorithmic filters with VR tests using actual color-blind participants

  **Educational Paradox**  
  Vision science courses would need either:  
  a) **Qualia labs** where students document personal experiences, violating physicalist axioms, or  
  b) **Eliminativist curricula** denying the explanatory gap exists (e.g., "color experience" = successful wavelength discrimination)

  ### Coherence Mechanism: The Explanatory Divide
  The institution survives this tension through a **methodological firewall**:  
  - *Upstream* (mechanisms): Physical descriptions suffice  
  - *Downstream* (validation): Phenomenology is indispensable  
  This allows neuroscientists to treat "aura descriptions" as data *inputs* while vision scientists treat color experience as *outputs* of studied mechanisms.

  **Conclusion**: Your university presupposes a **weak property dualism of practice**—phenomenal knowledge has provisional, non-reducible *evidential* status in specific domains, while being functionally redundant elsewhere. To adopt strict eliminativism, neuroscience would need new third-person verification tools, accessibility would require democratized phenomenology, and philosophy seminars would abandon Mary's case as meaningfully problematic. The asymmetry persists because *clinical stakes demand humility toward subjective experience that certification workflows can ignore*—a pragmatism revealing more about institutional risk calculus than ontological commitments.
