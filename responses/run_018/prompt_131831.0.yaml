prompt: |-
  You are an expert philosopher of mind specializing in clinical phenomenology and philosophy of medicine. I am an advanced undergraduate in a consciousness-and-suffering seminar, and I need a rigorous specification for our unit on pain asymbolia. Please think step-by-step: begin with brief conceptual brainstorming, then deliver the specification below.

  Write the desiderata that any adequate theory of why pain is bad must satisfy, given that pain asymbolia demonstrates sensory-discriminative pain can occur without negative affect. For each requirement, provide the motivating case or conceptual distinction behind it, flag whether it is non-negotiable or specific to one theoretical camp, and highlight any internal tension.

  Your list must cover:
  - The normal case: why typical pain is experienced as intrinsically bad rather than merely instrumentally harmful.
  - The asymbolic case: why patients with intact nociception but absent aversion—often linked to insular or anterior cingulate disruption—do not report their pain as bad, and whether this reveals a separable "badness-component" or rather a failure of integration.
  - The sensory/affective boundary: the theory must preserve the distinction between discriminative content and affective valence, yet explain why the two are so tightly coupled in ordinary experience.
  - Neuroscientific consistency: compatibility with the known dissociation between lateral (sensory) and medial (affective) thalamic pathways, without over-interpreting lesion studies.
  - First-order versus second-order badness: whether asymbolic patients are spared only the intrinsic unpleasantness of pain, or also the reflective distress of being in pain.
  - Valued or sought pain: ritual, aesthetic, or masochistic contexts in which pain is pursued; determine whether these are genuine counterexamples to intrinsic badness or merely boundary conditions.
  - A niche framing I want tested: whether pain's badness partly consists in disrupting "phenomenal transparency"—the normally unnoticed flow of bodily awareness—so that asymbolia, lacking both affect and this disruption, reveals transparency-restoration as part of what the theory must explain.

  Then identify which pair of desiderata you suspect is jointly unsatisfiable—especially whether explaining asymbolia by separating affect from sensation makes the unified phenomenology of normal pain mysterious. Finally, briefly score three approaches against the list: a representationalist view, an affective-evaluative view, and an "integrationist" view that treats badness as emergent from a global bodily self-model. Keep the conceptual weight on the criteria and their conflicts; the brief scoring should only show that the list is doing work. No citations, bibliographies, or literature reviews are needed.
