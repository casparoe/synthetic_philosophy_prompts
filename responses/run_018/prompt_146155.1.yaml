  ### Metaethical Sorting Instrument: A Decision Tree Based on Concrete Commitments

  This instrument sorts metaethical views by three core commitments, avoiding the realist/anti-realist dichotomy. The questions are ordered to prevent redundancy: the first determines if moral discourse is cognitive (truth-apt) or non-cognitive (not truth-apt). The second (asked only if discourse is cognitive) addresses truth conditions. The third (asked to all) concerns moral progress. Each path ends in a leaf with a named position (if recognized) or "unnamed." Named positions include an awkward commitment regarding cross-cultural disagreement or moral authority over agents lacking capacities. Two combinations are unoccupied (diagnosed as incoherent or unstable). Ambiguous leaves (with multiple positions) include a further diagnostic case.

  ---

  #### **Branching Questions**

  1. **When people morally disagree, is this disagreement fundamentally a factual dispute (about what is true) or a practical conflict (in attitudes or plans)?**
     - **A. Factual dispute (cognitive)**: Moral claims aim to describe truth, so disagreement involves contradiction (e.g., "Torture is wrong" vs. "Torture is not wrong" cannot both be true).
     - **B. Practical conflict (non-cognitive)**: Moral claims express non-cognitive states (e.g., plans, emotions), so disagreement is like clashing preferences without contradiction (e.g., "Boo torture!" vs. "Hooray torture!").

  2. **(If A) If moral claims can be true or false, what makes them true?**
     - **A1. Natural properties alone**: Truth depends solely on natural facts (e.g., psychological, biological, or social properties studied by science).
     - **A2. Irreducibly normative properties**: Truth requires non-natural properties (e.g., intrinsic "oughtness" beyond science).
     - **A3. Idealized response condition**: Truth depends on what an idealized agent (e.g., fully informed, rational, impartial) would endorse.

  3. **Is moral progress intelligible? If so, how?**
     - **i. Convergence on independent truths**: Progress means better approximating objective moral facts (e.g., like scientific progress toward truth).
     - **ii. Growing coherence among attitudes**: Progress means developing more consistent, unified moral attitudes (e.g., resolving conflicts in values).
     - **iii. Category mistake**: Moral progress is incoherent; it misapplies a concept that doesn’t fit morality (e.g., like asking for the color of a number).

  ---

  #### **Decision Tree Mapping**

  - **Path 1: A → A1 → i**  
    **Position**: Cornell-style naturalist realism (e.g., Brink, Boyd).  
    **Awkward commitment**: Moral obligations lose authority over agents lacking human-like psychology (e.g., psychopaths or aliens) because morality is grounded in contingent natural facts about human responses.

  - **Path 2: A → A1 → ii**  
    **Position**: Moral relativism (e.g., Harman, Wong).  
    **Awkward commitment**: Cross-cultural moral criticism is impossible since each culture’s moral truths are only binding within that culture’s framework.

  - **Path 3: A → A1 → iii**  
    **Position**: *Unnamed* (incoherent).  
    **Diagnosis**: Incoherent—if moral truths are natural properties (A1), moral progress must be intelligible (e.g., as convergence or coherence), so denying it (iii) contradicts the commitment to truth-apt natural facts.

  - **Path 4: A → A2 → i**  
    **Position**: Non-naturalist realism (e.g., Moore, Parfit).  
    **Awkward commitment**: Morality’s authority over agents lacking reason (e.g., infants or AI) is mysterious, as it relies on non-natural properties inaccessible without sophisticated cognition.

  - **Path 5: A → A2 → ii**  
    **Position**: *Unnamed* (unstable).  
    **Diagnosis**: Unstable—collapses into non-naturalist realism (Path 4). If truth requires non-natural properties (A2), progress as coherence (ii) implies convergence on those properties (i), as coherence is a means to discover independent truths.

  - **Path 6: A → A2 → iii**  
    **Position**: Error theory (e.g., Mackie).  
    **Awkward commitment**: Cross-cultural disagreement is pervasive despite all moral claims being false, suggesting humans are universally prone to a "queer" illusion of objective morality.

  - **Path 7: A → A3 → i**  
    **Position**: Ideal-observer constructivism (e.g., Firth, Smith).  
    **Awkward commitment**: Morality lacks authority over beings incapable of ideal responses (e.g., animals or cognitively impaired humans) since obligations depend on hypothetical ideal judgments.

  - **Path 8: A → A3 → ii**  
    **Position**: *Unnamed* (unstable).  
    **Diagnosis**: Unstable—collapses into ideal-observer constructivism (Path 7). If truth depends on an ideal response (A3), progress as coherence (ii) reduces to convergence on ideal responses (i), as coherence refines our path to the ideal.

  - **Path 9: A → A3 → iii**  
    **Position**: *Unnamed* (incoherent).  
    **Diagnosis**: Incoherent—if truth is fixed by an ideal response (A3), moral progress must be intelligible (e.g., as convergence toward that ideal), so denying it (iii) negates the truth condition.

  - **Path 10: B → i**  
    **Position**: *Unnamed* (incoherent).  
    **Diagnosis**: Incoherent—non-cognitive views (B) deny objective truths, so convergence on them (i) is impossible.

  - **Path 11: B → ii**  
    **Position**: Non-cognitivist expressivism (e.g., Blackburn, Gibbard).  
    **Awkward commitment**: Cross-cultural disagreement is treated as deep and rational despite being mere attitude-clashes, implying an objective standard expressivists reject.

  - **Path 12: B → iii**  
    **Position**: *Unnamed* (unexplored).  
    **Diagnosis**: Unexplored—no major theory combines non-cognitivism (B) with denying moral progress (iii), though it is coherent (e.g., a nihilist expressivism).

  ---

  #### **Scoring Key**
  Given your answers to the three questions, use this key to find your leaf and resolve ambiguities:
  - **If your path has a named position**, that is your result. No further case is needed (no ambiguities in named leaves).
  - **If your path is "unnamed"**, it lacks a recognized position (see diagnoses above).
  - **If you encounter an ambiguous leaf (multiple positions)**, use this diagnostic case:  
    *Can a being with no conscious states (e.g., a sophisticated AI) but with functional analogues to suffering (e.g., damage-avoidance programming) be morally wronged?*  
    - **Yes**: Leans toward naturalism or non-naturalism (truth-apt views).  
    - **No**: Leans toward non-cognitivism or error theory (denies moral status without consciousness).  
    *(Note: No leaf in this tree has multiple positions, so this case is reserved for expansions.)*

  ---

  #### **Summary of Unoccupied Combinations**
  1. **Path 3 (A → A1 → iii)**: Incoherent—naturalism implies moral truths, so progress cannot be a category mistake.  
  2. **Path 5 (A → A2 → ii)**: Unstable—non-naturalism with progress-as-coherence collapses into non-naturalist realism (Path 4).  
  *(Paths 8, 9, 10, and 12 are also unoccupied but not required for the minimum two.)*
