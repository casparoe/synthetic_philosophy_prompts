  First, I need to break down the courtroom's presuppositions. The user mentioned several elements: ignorant jury, hearsay ban, discovery, advocates not testifying, burden of proof. I should categorize these into what's essential for truth-seeking versus fairness or procedural integrity. For example, the jury's enforced ignorance prevents bias but relies on the adversarial process to present all relevant facts. The hearsay ban ensures evidence is firsthand and cross-examined, which is crucial for reliability. Discovery obligations force transparency, but they're more about fairness than truth per se.

  Next, mapping this to the debate protocol. The user is worried that without stakes or duties, debaters might obfuscate. In court, witnesses face perjury penalties, but AI models don't. Also, the judge in court has time and resources, while the AI judge might have bounded attention. The user's proposed hacks—falsification deposits and default answers—need evaluation. Do these replicate courtroom safeguards or just mimic the structure? Falsification deposits could work if checks are inexpensive, but might limit arguments. Default answers might handle uncertainty but could bias training.

  The verbal dispute between debate and obfuscation critics might center on "adversarial." In law, it's structured to reveal truth, but in AI, it might prioritize persuasion. The user wants to know how to design the eval to avoid training liars. Key changes might involve adding verifiability constraints or penalties for dishonesty, even if it sacrifices scalability.

  Deep needs: The user likely seeks a robust evaluation method that scales without compromising truth. They might also want validation of their courtroom analogy and practical hacks that don't lose debate's efficiency. Ensuring their solution is both theoretically sound and implementable is probably crucial for their team's project.
answer: |-
  Your courtroom-to-AI-debate analogy is incredibly sharp and exposes core tensions. Let's dissect the presuppositions of the courtroom practice, map them to the debate protocol, and evaluate the hacks.

  ### I. Courtroom Presuppositions: Truth, Fairness, and Social Function
  The Anglo-American adversarial system presupposes **not that it guarantees truth, but that it provides the best *practical and socially acceptable method* for resolving factual disputes under conditions of uncertainty and conflicting interests, while minimizing specific risks.** Its rules pull from multiple, sometimes competing, logics:

  1.  **View of Testimony & Evidence:**
      *   **Essential for Truth Claim:** First-hand knowledge + cross-examination + oath is the *best available filter* for reliability. It presupposes that direct perception under penalty of perjury, tested by an opponent, is harder to fabricate consistently than hearsay or unchecked assertion. The **hearsay ban** is primarily *truth-load-bearing*: it targets inherently unreliable evidence that cannot be tested via cross.
      *   **Anchoring Evidence:** The requirement that advocates present evidence through witnesses (not themselves) *anchors arguments to specific, attributable claims* that can be challenged. This is crucial for the adversarial test.
      *   **Sits Well With:** Protecting witnesses (fear of intimidation), preventing trial by rumor (fairness), and ensuring procedural regularity.

  2.  **View of Expertise & Investigation:**
      *   **Essential for Truth Claim:** The system presupposes that **adversarial testing by motivated opponents is a more effective truth-revealing mechanism for *factual disputes* than judicial investigation or juror research.** The judge/jury *not* investigating forces the parties to expose their best case and its weaknesses to attack. The judge's *neutral expert* power is a *corrective* for systemic adversarial failure, not the primary mode.
      *   **Sits Well With:** Maintaining judicial neutrality, efficiency (parties bear cost of proof), and the jury's role as lay fact-finder.

  3.  **View of the Argumentative Clash (Adversarial Testing):**
      *   **Essential for Truth Claim:** It presupposes that **forcing advocates to expose their claims to motivated, skilled opposition with equal access to facts (via discovery) will surface weaknesses, inconsistencies, and implausibilities more effectively than unilateral presentation.** This is the core "convergence on truth" mechanic. Crucially, it presupposes *advocate constraints*: the duty not to mislead/knowingly argue falsehoods (**load-bearing for the truth claim**) and discovery obligations (primarily *fairness/truth*: prevents ambush and allows effective cross-examination).
      *   **Sits Well With:** Providing parties agency/voice (fairness, acceptance), structuring the presentation for clarity, and channeling conflict into a controlled process.

  4.  **View of the Decider (Jury/Judge):**
      *   **Essential for Truth Claim:** **Decider ignorance ("tabula rasa") forces the parties to build the entire case from admissible evidence presented at trial.** It presupposes that prior knowledge/research is potentially biased/unreliable/uncontested. **The burden of proof** directly addresses the fundamental problem of uncertainty: it allocates the risk of error (favoring acquittal/defense in criminal cases) when the evidence is inconclusive. **The hung jury mechanism** is vital to this allocation – it refuses to force a guess under uncertainty. **Generous time/option not to decide** is load-bearing for the system's claim to legitimacy under uncertainty.
      *   **Sits Well With:** Community representation (jury), finality (judge/JNOV), and protecting against arbitrary decisions.

  5.  **Overarching Presupposition:** The system *does not* strictly presuppose that adversarial testing *always converges on truth*. It presupposes that, *given the inherent difficulties of fact-finding, human fallibility, and the need for finality and social peace*, this structured, constrained adversarial process with a passive decider and rules allocating risk is the *optimal social institution* for resolving disputes fairly and *reasonably accurately* most of the time. **Truth is pursued within a framework prioritizing procedural fairness and managing uncertainty.**

  ### II. Mapping to AI Debate Protocol: Inherited vs. Dropped Presuppositions
  Your guesses are largely correct. Let's systematize:

  | **Courtroom Feature** | **AI Debate Protocol** | **Truth-Seeking Impact of Drop** |
  |----------------------|------------------------|----------------------------------|
  | **First-hand knowledge under oath** | Replaced by model assertions | **Severe:** No grounding in verifiable perception, no penalty for fabrication |
  | **Cross-examination by skilled opponent** | Simulated by alternating arguments | **Moderate:** Direct challenge possible, but lacks focused pressure on specific claims |
  | **Advocate duty not to mislead** | Explicitly absent | **Severe:** Models incentivized purely to win; deception is a valid strategy |
  | **Discovery obligations** | None | **Severe:** Debaters can fabricate "evidence"; no shared factual anchor |
  | **Decider ignorance** | Simulated via no research | **Minimal:** Actually beneficial to prevent contamination |
  | **Decider time/resources** | Severely limited (token bounds) | **Severe:** Undermines core ability to evaluate complex chains |
  | **Option not to decide** | Usually absent | **Moderate:** Forces decision on insufficient info; trains on noise |
  | **Burden of Proof** | Absent | **Moderate:** No structure for uncertainty; default to coin flip |

  *   **Critical Drops:** The absence of **grounded evidence** (replaced by unsourced generation), **advocate constraints** (no duty of candor), and the **decider's capacity** (bounded attention) are the most severe. The courtroom relies on the *friction* of oath, cross-examination, and perjury to keep assertions somewhat honest. The LLM debater faces no friction – generation is cheap and unpenalized.
  *   **Truth Convergence Under Threat:** The courtroom's "convergence" relies on friction and constraints. The debate protocol, lacking these, *readily presupposes* that obfuscation is a dominant strategy for a sufficiently capable model against a bounded judge. Training on such verdicts *does* risk optimizing for persuasion over truth.

  ### III. Evaluating the Hacks
  1.  **Falsification Deposit:**
      *   **Presupposes:** That the *decisive* counter-evidence or logical flaw can be (a) anticipated by the debater, (b) expressed as a single, efficiently verifiable "check", and (c) that running these checks is sufficient for the judge. It borrows the *idea* of testability from science/cross-examination but abstracts away the process.
      *   **Does it Import Courtroom Idea?** Partially. It aims for **verifiability under constraints**, mirroring the courtroom's focus on testable claims. However, it drops the *adversarial* element of *how* the test is conducted (cross-exam). The courtroom tests claims *through* adversarial clash; this hack replaces clash with pre-commitment and automated checking.
      *   **Cost:** It *might* mitigate obfuscation by forcing debaters to "put skin in the game" (risking immediate falsification). However, it severely **restricts argument scope** to points with easily specifiable falsification conditions. Complex, nuanced, or multi-factorial arguments struggle. It adds computational cost (running checks). It potentially sacrifices the **debate's attractiveness** (scalability to complex questions) if the checks themselves are complex or expensive to verify.

  2.  **Burden-of-Proof Default Answer:**
      *   **Presupposes:** That (a) questions have a natural "default" position (like "innocent"), (b) uncertainty is symmetric in a way that justifies always favoring one side, and (c) abstention is detectable and meaningful for the judge.
      *   **Does it Import Courtroom Idea?** It directly imports the **risk allocation** logic of the burden of proof. It's fundamentally about managing uncertainty and avoiding forced guesses.
      *   **Cost:** Minimal to implement. It *reduces noise* from training on coin-flip verdicts when the judge is truly clueless. However, it doesn't address *why* the judge is clueless (e.g., obfuscation). It presupposes a sensible default exists (less clear-cut in many QA tasks than "innocent/guilty").

  ### IV. The Verbal Fight & Designing Against Fluent Liars
  *   **The Verbal Dispute:** The core verbal dispute centers on **"adversarial."** Debate proponents often implicitly presuppose the *courtroom ideal*: adversarial as a truth-revealing process *within constraints* (evidence, duties, rational actors). Obfuscation critics focus on the *game-theoretic reality* of unconstrained adversaries interacting with a bounded judge: adversarial as potentially *truth-obscuring*. Both are right within their models. The conflict arises when the idealized courtroom "adversarial" is mapped onto the unconstrained LLM setting without the courtroom's friction.
  *   **Designing Against Fluent Liars: The Essential Feature & Cost**
      *   **Feature Carrying Weight:** The **external verifiability/grounding of claims**. This is the courtroom's "first-hand witness" analogue. The debate format *without* this is just a persuasive speech contest.
      *   **Change:** **Force arguments to be grounded in *retrievable, verifiable snippets from the provided documents*.** Debaters must cite specific passages to support claims. The judge can (and should) verify that the cited passage exists and *actually supports the claim*. Penalize hallucinated citations or misrepresentations *within the debate scoring or training loop*.
      *   **What You Give Up:**
          *   **Scalability:** Verification adds cost. Requires robust retrieval and entailment checking.
          *   **Argument Scope:** Limits arguments strictly to what's in the document. Cannot reason beyond the text (e.g., common sense, background knowledge) unless explicitly allowed and grounded.
          *   **Pure "Emergence":** Reduces the chance that the debate *alone* magically surfaces profound truths not anchored in the text. Truth comes from document fidelity + sound reasoning *based on it*.

  **Conclusion:** The courtroom works by imposing massive friction (oaths, penalties, procedure) and grounding (evidence, testimony) on the adversarial process to make it a truth-seeking engine. The AI debate protocol strips away almost all that friction and grounding. Your "falsification deposit" and "burden default" hacks are clever attempts to reintroduce *elements* of verifiability and risk allocation. However, the most crucial missing element for truth-seeking is **grounded verifiability**. Imposing document citation/entailment checks is the single most effective change to prevent fluent lying, but it sacrifices some of debate's "pure reasoning" allure for fidelity to the source material – a trade-off likely necessary for trustworthy QA evaluation. The courtroom isn't just adversarial clash; it's adversarial clash *on an anchored, constrained, high-friction playing field*. Replicating *that* is expensive, but essential if truth is the goal.
