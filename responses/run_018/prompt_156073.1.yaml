answer: |-
  Here’s a distilled framework for evaluating any normative theory of subsidiarity, structured like a distributed systems design doc—focused on **core desiderata, trade-offs, and impossibility constraints**. I’ll mark non-negotiables (💎), negotiables (🔧), and conflicts (⚠️).

  ---

  ### **Core Desiderata (What a Theory *Must* Explain)**  
  **Non-Negotiables (💎):**  
  1. **Legitimacy Source**  
     - *Why*: Power must derive from democratic consent (bottom-up) or delegated efficiency (top-down), but never arbitrary.  
     - *Test Cases*: Explains why Swiss cantons can set taxes (local consent) but EU states can’t ignore directives (delegated efficiency via treaties).  

  2. **Conflict Resolution Mechanism**  
     - *Why*: Without this, the system collapses under jurisdictional clashes.  
     - *Test Cases*: Why German states (Länder) can veto federal laws via Bundesrat, but US states can’t block EPA regulations (federal supremacy + judicial review).  

  3. **Dynamic Rebalancing**  
     - *Why*: Powers must shift when problems scale (e.g., pandemics → federal coordination; zoning → local control).  
     - *Test Cases*: COVID responses (EU vs. US power centralization debates).  

  ---

  ### **Negotiable Criteria (🔧)**  
  *(Implementation varies by system)*  
  4. **Democratic Accountability Layers**  
     - *Why*: Technocratic tiers (e.g., EU Commission, US Fed) are acceptable if:  
       - (a) Mandate is narrow (monetary policy > social policy),  
       - (b) Subject to oversight (e.g., EU Parliament, Congressional hearings).  
     - *Red Line*: No permanent *unaccountable* sovereignty (💎).  

  5. **Uniformity vs. Autonomy Trade-off**  
     - *Why*: Perfect harmonization + full local control is impossible (⚠️ **Political CAP Theorem**):  
       - **Consistency** (uniform rights/laws across regions),  
       - **Autonomy** (local self-rule),  
       - **Agility** (rapid system-wide action).  
       → **Pick 2**.  
     - *Examples*:  
       - EU single market (Consistency + Agility) → limits state autonomy.  
       - Swiss cantons (Autonomy + Agility) → tax/education disparities.  
       - US federalism (tries all 3) → constant court battles.  

  6. **Power Assignment Logic**  
     - *Why*: Must define *how* to allocate powers (efficiency? proximity? equity?).  
     - *Contrast*:  
       - **EU Conferral** (💎): Powers *explicitly granted* by states to EU.  
       - **US Cooperative Federalism** (🔧): Federal/state powers *overlap* (e.g., Medicaid).  
     - *Test*: Theory must explain why conferral creates rigidity (e.g., EU tax unanimity) while overlap causes friction (e.g., US marijuana laws).  

  ---

  ### **Impossibilities (⚠️)**  
  7. **The Sovereignty Trilemma**  
     A system cannot simultaneously satisfy:  
     - (a) **Strong local autonomy** (e.g., veto powers),  
     - (b) **Binding central authority**,  
     - (c) **Equal rights/rules across tiers**.  
     → **Violations**:  
     - If (a) + (b): Local opt-outs create inequality (e.g., EU asylum rules).  
     - If (b) + (c): Central overrides local autonomy (e.g., US federal preemption).  
     - If (a) + (c): No binding central authority (e.g., UN climate goals).  

  8. **Efficiency-Accountability Trade-off**  
     - Technocratic governance (e.g., ECB, US independent agencies) gains efficiency but dilutes direct accountability.  
     - *Non-negotiable (💎)*: Technocracy must be *derived* from democratic tiers (e.g., treaties/laws) and have sunset clauses/oversight.  

  ---

  ### **Your Test Cases Resolved**  
  - **Swiss taxes vs. EU directives**:  
    - Swiss model prioritizes **Autonomy + Agility** (local consensus-driven).  
    - EU prioritizes **Consistency + Agility** (single market > fiscal sovereignty).  
  - **EU conferral vs. US cooperative federalism**:  
    - Conferral (💎) requires explaining why EU lacks police powers (not granted).  
    - US overlap (🔧) requires justifying friction as a feature (e.g., states as "laboratories").  

  ---

  ### **Summary: The Subsidiarity Stack**  
  | **Layer**          | Non-Negotiable (💎)          | Negotiable (🔧)               |  
  |---------------------|-------------------------------|-------------------------------|  
  | **Legitimacy**      | Consent/efficiency basis     | Technocratic depth            |  
  | **Conflict**        | Binding resolution           | Judicial vs. political        |  
  | **Power Allocation**| Dynamic rebalancing          | Efficiency vs. equity logic   |  
  | **Rights/Trade-offs**| Sovereignty trilemma (⚠️)   | CAP-like choices              |  

  **Bottom Line**: A robust theory must handle the **trilemma** and **dynamic rebalancing**, but can flex on *how* democracy/technocracy mix. Systems fail when they ignore the impossibility constraints—like pretending local autonomy won’t create rights inconsistencies.
