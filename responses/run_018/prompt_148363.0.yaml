answer: |-
  ### Conceptual Dependency Brainstorm
  Before introducing karma as secular moral desert theory, students must grasp:
  1. **Moral desert**: The concept that agents *deserve* certain outcomes based on their actions’ moral quality.
  2. **Non-divine moral frameworks**: Moral systems can operate without supernatural administrators (e.g., secular ethics, consequentialism).
  3. **Structural causality**: Systems can generate proportional outcomes without intentional "punishers" (e.g., market dynamics, social feedback loops).
  4. **Temporal dissociation**: Causes and effects can be non-contiguous yet systematically linked (e.g., childhood habits shaping adult health).

  Without #1–2, karma defaults to religious "cosmic justice." Without #3–4, it collapses into fate or divine intervention.

  ---

  ### 50-Minute Teaching Plan: Karma as Secular Moral Structure  
  **Objective:** Students articulate karma as *a non-supernatural theory where moral actions structurally condition future moral circumstances via proportional feedback*.  

  #### Sequence & Timing  
  **I. Moral Desert & Its Problems** (15 min)  
  - **Hook (3 min)**: "If someone cheats their way to wealth, do they *deserve* their eventual bankruptcy? Why/why not?"  
  - **Core Concepts (7 min)**:  
    - Define moral desert (*deserved outcomes based on action quality*)  
    - Problem: How can desert operate without divine judge? (Gaps in secular ethics)  
  - **Check Question (5 min)**: "Can you think of a non-religious example where 'good actions lead to good outcomes' systematically fails? Why might that happen?"  
    - *Purpose:* Exposes desert’s fragility without structural mechanisms.  

  **II. Distinguishing Karmic Causation** (10 min)  
  - **Contrast 1: Legal Punishment (4 min)**  
    - Legal: External, human-administered, intentionally punitive.  
    - Karmic: *Impersonal*, automatic structural adjustment (e.g., "Your dishonesty *makes* you untrustworthy, so opportunities vanish").  
  - **Contrast 2: Deterministic Fate (6 min)**  
    - Fate: Outcomes fixed regardless of action.  
    - Karma: Outcomes *responsive* to action quality. Show flowchart:  
      ```  
      Moral Action → (Mechanism) → Altered Moral Condition  
      ↑_________________Agency?_________________|  
      ```  
    - *Misconception Head-off:* Explicitly note: "Karma ≠ determinism—your *next* action can alter the flow."  

  **III. Restorative Justice Case Study: "The Carrier"** (15 min)  
  - **Scenario (5 min)**:  
    - *Past action:* Alex transported drugs for a gang, betraying community trust.  
    - *Present condition:* Post-prison, Alex faces universal suspicion.  
  - **Restorative Process (7 min)**:  
    - Alex admits harm, works cleanup crew for 5 years, mentors at-risk youth.  
    - Outcome: Community slowly re-trusts; Alex now leads neighborhood initiatives.  
  - **Karmic Analysis (3 min)**:  
    - Q: "Did Alex’s *moral transformation* reshape his social standing? Does this mirror karma’s action→condition link without gods/rebirth?"  
    - *Targeted Check Question:* **"How is Alex’s regaining trust fundamentally different from 'reward for good behavior'?"**  
      - *Key:* Focus on *organic proportionality* (trust rebuilt *because* of demonstrated change) vs. transactional reward.  

  **IV. Misconception Mapping** (10 min)  
  Address *during* prior sections where flagged, then consolidate:  
  - **"Karma = Cosmic Revenge"** (addressed in II–III):  
    - Clarify during restorative example: "Karma isn’t *punishing* Alex—his past actions *constitutively damaged* his moral landscape. Repair requires proportional effort."  
  - **"Karma Eliminates Agency"** (addressed in II):  
    - Reiterate flowchart: "Your *current* choice redirects the causal chain. Karma responds; it doesn’t predetermine."  
  - **"Karma Guarantees Material Outcomes"**:  
    - Emphasize: "It tracks *moral conditions* (e.g., capacity for trust), not wealth/luck."  

  ---

  ### Explicit Omissions  
  - **No scriptural texts** (avoids religious framing)  
  - **No primary sources** (prevents hermeneutic distractions)  
  - **No rebirth metaphysics** (beyond structural "past→present" sequencing)  
  - **No theism** (mechanism is impersonal; "divine accountant" analogy forbidden)  

  ### Dependency Rationale  
  - **Desert first** establishes why moral causation matters philosophically.  
  - **Distinctions second** prevent reduction to fate/punishment.  
  - **Case study third** concretizes abstract structure *after* groundwork.  
  - **Misconceptions last** uses accumulated understanding to dismantle intuitions.  

  **Outcome Metric**: Students reframe statements like "Karma will punish you" into "Unethical actions degrade future moral possibilities."
