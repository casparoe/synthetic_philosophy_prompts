  Specify the exact order of introduction: first, establish the concept of moral desert and its problems; second, distinguish karmic causation from legal punishment and from deterministic fate; third, present the carrying example—use a concrete restorative-justice framework in which an offender's future social standing is genuinely reshaped by past moral failures, and ask whether this captures karmic logic without supernatural elements; fourth, address the misconception map. For each predictable misconception—especially that karma implies rigid determinism eliminating agency, and that it functions as cosmic revenge rather than proportionality—identify precisely where in the sequence it should be headed off.

  Include one targeted check question that reveals whether students understand karma as a theory of proportionality between action and moral condition, not as a system of reward and punishment. Explicitly state what must be left out at this level: do not discuss specific scriptural texts, do not assign primary-source readings, and do not invoke metaphysical rebirth beyond the minimal structural assumption. Do not provide a bibliography, reading list, or citations. Think carefully about the dependency structure and be precise about what each step makes possible.
