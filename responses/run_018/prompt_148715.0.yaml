prompt: |-
  I'm running a seminar for sharp undergrads on moral uncertainty, but I want to skip the tired coffee-vs-charity examples. I want to build the session around the specific problem of intertheoretic comparison when one live theory is lexical (absolute side-constraints) and the other is fully aggregative (longtermist expected-value reasoning). The students will arrive thinking uncertainty just means "I'm unsure, so split teh difference." Plan the teaching arc: what dependency has to be in place before they can even see why lexical/aggregative disagreement breaks the standard maximize-expected-moral-value recipe; pick one carrying example where one theory says "never do X no matter the scale" and the other says "do X if the numbers get big enough"; map out the misconceptions in the order they'll hit them — probably that this collapses to empirical uncertainty, or that lexical rules are just very high weights — and exactly where to head each off; give me one end-of-session check that proves they got the structural problem not just teh two theories; and tell me what formal machinery (maybe myopic vs sophisticated choice) to openly refuse to explain. No bibliography, just the architecture.
reasoning: |-
  Okay, the user is running a seminar for sharp undergrads on moral uncertainty and wants to avoid cliché examples. They specifically want to focus on intertheoretic comparison between a lexical theory (absolute side-constraints) and a fully aggregative one (longtermism). The students are likely to think moral uncertainty just means splitting the difference. I need to help them understand why this comparison breaks the standard expected-value approach.

  First, I should map out the teaching arc. What prerequisites do students need before they can grasp the problem? They need to understand moral uncertainty versus empirical uncertainty. They might confuse the two, thinking the conflict is about empirical facts rather than fundamental moral principles. So the first step is to clarify that distinction.

  Next, they need to grasp the core features of each theory. Lexical theories have absolute prohibitions, no matter the consequences. Aggregative theories, like longtermism, prioritize maximizing expected value, even if it means sacrificing something now for greater future gains. The challenge is comparing these incommensurable values.

  A strong carrying example is essential. The user suggested a scenario where one theory says "never do X regardless of scale" and the other says "do X if the numbers are big enough." The organ harvest thought experiment could work here: a utilitarian doctor considering killing one healthy patient to save multiple lives. Deontology would absolutely forbid killing, no matter how many lives are saved. Longtermism might justify it if the saved lives lead to vast future benefits. This example highlights the clash clearly.

  Common misconceptions will arise. Students might think the issue is empirical—like uncertainty about how many lives are saved. I need to head this off by emphasizing fixed, known numbers. Another misconception is treating lexical constraints as just very high weights. But infinite weights break aggregation, so I should explain why that approach fails mathematically.

  I need a check at the end to ensure they understand the structural problem. A thought experiment like a ticking time bomb scenario with fixed numbers could work. Ask them why standard expected value doesn't apply here. The key is recognizing that lexical theories don't assign finite weights, so aggregation is impossible without arbitrary conversions.

  Formal machinery like myopic vs. sophisticated choice should be mentioned but not explained in depth. The goal is to highlight the problem, not solve it. Mentioning these terms shows there's ongoing debate without derailing the seminar.

  The teaching arc should start with moral uncertainty basics, then introduce the two theories with clear examples. Use the organ harvest scenario to illustrate the conflict. Then walk through misconceptions, addressing each with counterexamples. Finally, the ticking time bomb check to confirm understanding. Keep it structured and avoid getting bogged down in solutions.
answer: |-
  Here's the teaching arc designed to shatter "split the difference" intuitions and spotlight the lexical/aggregative collision:

  **Core Problem:** Standard Expected Moral Value (EMV) requires cardinal, intertheoretically comparable units. Lexical theories (e.g., strong deontology) operate with *absolute prohibitions* (infinite disvalue/off-limits), making cardinal comparison/aggregation with finite-valued aggregative theories (e.g., classical utilitarianism, longtermism) mathematically and conceptually incoherent under standard EMV.

  **Teaching Arc:**

  1.  **Foundation 1: Moral Uncertainty ≠ Empirical Uncertainty (15 mins)**
      *   **Goal:** Sever the instinct to treat moral disagreement as a lack of *factual* knowledge.
      *   **Activity:** Contrast two scenarios:
          *   *Empirical:* "I'm unsure if Charity A saves 10 lives/$ or 20 lives/$. My best guess splits the difference -> EMV supports Charity A."
          *   *Moral:* "I'm unsure between Theory A (only humans matter) and Theory B (all sentient beings matter). Does splitting the difference mean valuing a cow at 0.5 humans? Is that coherent? What *facts* would resolve this?"
      *   **Key Point:** Moral uncertainty concerns *fundamental values*, not missing data resolvable by observation. Resolution requires *normative* justification, not empirical discovery.

  2.  **Foundation 2: The Beasts - Understanding the Theories in Isolation (20 mins)**
      *   **Lexical Theory (e.g., Strong Deontology):**
          *   Core: Certain acts (e.g., intentional killing of innocent, torture) are *absolutely forbidden*, no matter the consequences. Value is discontinuous/infinite at the constraint boundary.
          *   Example: "Never harvest one healthy person's organs to save five dying patients, even if you *know* it works and saves net four lives. The act itself is wrong."
          *   **Emphasize:** Scale is irrelevant. 1 violation vs. 1 million violations is still absolutely forbidden. Not "high cost," but *infinite* cost/prohibition.
      *   **Aggregative Theory (e.g., Longtermist Utilitarianism):**
          *   Core: Maximize expected total well-being across all affected beings, heavily weighting future potential. Value is continuous, additive, and scales linearly (or near-linearly) with numbers.
          *   Example: "If harvesting one healthy person's organs *reliably* saves enough lives (say, 1,000), and those lives enable vast future flourishing (e.g., preventing extinction), it *is* obligatory. Numbers *do* swamp the initial cost."
          *   **Emphasize:** No intrinsic constraints, only trade-offs based on *net* expected value over vast scales/timeframes.

  3.  **The Collision: Introducing the Carrying Example (15 mins)**
      *   **Scenario: The Ticking Transmitter (Fixed Numbers)**
          *   You control a device. Activating it will *certainly, instantly, and painlessly* kill one innocent, oblivious person. Doing so will *certainly* prevent a catastrophe killing **N** specific, identifiable people in the immediate future. Crucially, preventing this catastrophe is also *known* to be necessary (and sufficient) to unlock a future trajectory where trillions of future lives flourish over vast timescales (assume this longterm impact is secure).
          *   **Lexical Theory (Deon):** Absolutely FORBID activating the device. Intentionally killing an innocent is never permissible, regardless of N or the long-term payoff. (Scale Invariance)
          *   **Aggregative Theory (AggLong):** OBLIGATES activating the device if N is large enough to outweigh the direct cost *and* the longterm future value is sufficiently massive. For AggLong, a large enough N (even without the longterm boost) *or* the longterm boost alone (even if N=0) might suffice. (Scale Sensitivity + Aggregation)
      *   **Focus:** Make N *fixed* and *known* (e.g., N=1,000,000 lives saved immediately + the vast future). Eliminate empirical wiggle room. The conflict is purely moral.

  4.  **Targeting Misconceptions & Building the Problem (25 mins)**
      *   **Misconception 1: "It's just empirical uncertainty about the numbers!"**
          *   **Head Off:** Immediately after presenting the scenario, ask: "If we fix N at 1,000,000 and *guarantee* the longterm impact, does the moral disagreement disappear?" Force a 'No'. Emphasize the *known, fixed* scale. The theories *still* disagree fundamentally on whether the act itself is *ever* permissible.
      *   **Misconception 2: "The Lexical Rule is just a VERY HIGH weight!"**
          *   **Attack:** "Okay, suppose we try to assign a finite weight 'W' to violating the lexical constraint within EMV. How high must W be so that AggLong *never* justifies the act, no matter how large N gets or how vast the future?" Guide them: For *any* finite W, there exists *some* sufficiently large N (or future value) where AggLong's calculation (Benefit - Cost = Huge Value - W) becomes positive. Lexical theory *requires* W to be *infinite* to block this.
          *   **Problem:** EMV math breaks with infinities. (Infinity minus huge number is still infinity? Infinity times any probability <1 is undefined?). More importantly: Assigning a finite W *concedes* that the constraint is *not* absolute, contradicting the lexical theory's core tenet. The lexical theorist would reject the *framework* of finite weighting.
      *   **Misconception 3: "We just need to 'normalize' the theories somehow."**
          *   **Attack:** "What does 'normalize' mean? Convert both into 'utils'? Lexical theory says the disvalue of the act is *incomparable* to any amount of good consequences – it's off the scale. AggLong says *everything* is comparable on a single scale. How can you 'normalize' incommensurable scales?" Point: Normalization *presupposes* commensurability, which is precisely what's denied here.
      *   **Key Insight:** Standard EMV *assumes* a common cardinal scale. Lexical constraints introduce a fundamentally different *kind* of value (ordinal prohibition, infinite disvalue) that cannot be smoothly integrated into the aggregative framework without distorting one or both theories.

  5.  **End-of-Session Check: Proving Structural Grasp (5 mins)**
      *   **Question:** "Imagine we have two new theories. Theory Alpha has an absolute constraint against doing action Z. Theory Beta is purely aggregative and says doing Z is fine if the net benefit is positive. You are uncertain between them. Why does plugging this uncertainty into the standard EMV formula fail to give a coherent answer? Be specific about the mathematical or conceptual breakdown."
      *   **Target Answer:** EMV requires assigning finite, comparable values to outcomes across theories. Alpha assigns *infinite disvalue* (or undefined value) to any outcome involving doing Z, making it incomparable to Beta's finite valuations. You can't add/multiply/average infinity with finite numbers meaningfully within the EMV framework. The theories operate on incommensurable scales.

  6.  **Formal Machinery to Acknowledge & Sidestep:**
      *   **Explicitly Refuse To Explain:** "Myopic Choice" (choose as each theory recommends ignoring uncertainty) vs. "Sophisticated Choice" (choose based on anticipating future choices under uncertainty). Also refuse deep dives into specific aggregation rules (Borda, Nash, etc.) or variance-based approaches. **Reason:** The session's goal is recognizing why standard EMV *fails* at a foundational level for this conflict, not exploring complex (and contested) solutions. Introducing solutions now muddies the core insight. Acknowledge these exist as avenues for *later* exploration, but today is about diagnosing the problem.

  **Architecture Summary:**
  1.  Sever moral/empirical uncertainty.
  2.  Define Lexical (Absolute Prohibition, Scale Invariant) vs. Aggregative (No Intrinsic Constraints, Scale Sensitive) in pure forms.
  3.  Introduce high-stakes example with **fixed, known numbers** (Ticking Transmitter).
  4.  Systematically dismantle misconceptions (Empirical? High Weight? Normalization?) revealing the incommensurability.
  5.  End with a check forcing articulation of the structural EMV breakdown (Infinity + Finitude = Nonsense).
  6.  Acknowledge (but refuse to explore) solution approaches like Myopic/Sophisticated choice.

  This arc forces students to confront the *qualitative* clash of value structures underlying the uncertainty, moving them beyond naive averaging into the deep problem of moral incommensurability.
