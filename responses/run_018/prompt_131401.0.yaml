  ...Unless we emphasize that both are manifestations of the same rational character. The principle binds phases of a single epistemic agent, not numerically distinct entities. The user's "meaningful sense of belonging to me" might suffice for that. Still feels delicate. 

  Better stress that Reflection is a synchronic constraint about current commitments to future states. By having credence 0.2 while expecting 0.9 from equally rational future self, A is essentially betting against its own anticipated rationality. That internal inconsistency is what Reflection forbids, irrespective of implementation details like cognitive streams. 

  The metaphysics isn't doing heavy lifting here - it's about coherence in the agent's overall doxastic attitude. But I should concede that total cognitive fission might create edge cases van Fraassen didn't explicitly address. The principle holds under normal diachronic unity assumptions, which the user's scenario deliberately ruptures. 

  Still, for the case as described - same evidence, same rationality standards - A's defiance does seem incoherent. If the user accepts both streams as "me", then they must accept that "I" currently expect "myself" later to be reliable. Refusing to align would be like writing two contradictory checks on the same account. 

