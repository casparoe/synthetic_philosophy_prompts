  First I need to recall van Fraassen's exact position. Reflection isn't about actual future credences but anticipated rational ones. The key move here is distinguishing between the agent's current and future epistemic states. In this split-stream case, the morning self (A) should consider whether evening self (B) will be more informed. But the user explicitly blocked that - both streams have identical evidence, just different reasoning paths. 

