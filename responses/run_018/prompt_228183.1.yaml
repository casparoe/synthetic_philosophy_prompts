  First, I need to unpack their core needs: they're not seeking content explanations (they clearly grasp Dennett) but rather pedagogical scaffolding - sequencing, misconceptions to preempt, and assessment strategies. Their frustration from the 2am debate suggests they want to avoid students getting stuck in the same circular arguments.

  Key teaching challenges emerge:
  - Students likely arrive with strong qualia intuitions (Mary/spectrum thought experiments)
  - Dennett's position is easily misinterpreted as denying experience altogether
  - The Chase/Sanborn case requires careful setup to prevent dodges (like memory concerns)

  For structure, I'll suggest starting with naive qualia to make implicit assumptions explicit. We must define "qualia" operationally as introspectible, ineffable, private properties before dismantling it. The coffee example works best if presented simultaneously - showing both tasters as equally coherent forces the problem.

  Major misconceptions to preempt:
  1. "Dennett denies consciousness" → address immediately after stating his position
  2. "This is just verificationism" → clarify during the coffee analysis
  3. "Memory explains it" → build Sanborn's reliability into the case upfront

  For assessment, asking students to generate other examples where qualia/reaction come apart should reveal if they grasp the indeterminacy. Crucially, I'll advise explicitly bracketing inverted spectrum and heterophenomenology to keep focus tight.

  The user's metacognition is impressive - they know exactly where their debate went wrong and want to avoid those traps. My plan should model how to steer discussions productively while honoring the real puzzlement around qualia.
answer: |-
  Here's a battle-tested 90-minute plan focused on structure, misconception disarmament, and achieving the core learning objective: exposing the indeterminacy of the qualia/reaction distinction in the Chase & Sanborn case.

  **Core Learning Objective:** Students will understand that the *intuitive distinction* between "the experience itself changing" vs. "only my reaction to the unchanged experience changing" cannot be coherently sustained under scrutiny using Dennett's Chase & Sanborn argument, revealing a fundamental problem with the "naive qualia" concept.

  **Essential Pre-Requisites (First 20-25 mins):**

  1.  **Define the Target: Naive Qualia (10 mins):**
      *   Elicit student understanding: "What are qualia? What properties did Frank Jackson's Mary supposedly learn about?" (Focus on *intrinsic, private, ineffable, directly knowable properties of experience itself*).
      *   **Crucial:** Explicitly articulate the **Naive Qualia Picture (NQP)**:
          *   Qualia are the raw *feels* (the phenomenal character).
          *   They are distinct from our *judgements about* or *reactions to* those feels (liking, disliking, believing, remembering, acting).
          *   We have *privileged, direct, incorrigible access* to our own qualia. We know "what it's like" for us, *now* and *then*.
      *   **Write this NQP definition clearly on the board.** This is the target.

  2.  **Set the Stage: Preference Change & the Explanatory Gap (10-15 mins):**
      *   Use a relatable example: "You used to love a band/song/food, now you don't. What changed?"
      *   **Generate the Two Intuitive Explanations:**
          *   "The *experience itself* changed – it sounds/tastes different *to me* now." (Qualia Shift)
          *   "The experience is *just the same*, but *I* changed – my tastes/preferences evolved." (Reaction Shift)
      *   **Highlight:** The NQP *assumes* this distinction is clear, meaningful, and resolvable from the first-person perspective ("I just *know* which it is!").
      *   **The Philosophical Problem:** This distinction underpins many thought experiments (inverted spectrum, Mary) where qualia are posited as the thing that *could* vary independently of function/reaction. Dennett attacks the coherence of *making* this distinction.

  **The Core Argument: Chase & Sanborn (40-45 mins)**

  3.  **Present *Both* Cases Simultaneously (5 mins):**
      *   Summarize Chase and Sanborn clearly and neutrally. **Crucially, present them as *equally coherent* first-person reports.**
      *   **Emphasize Sanborn:** "Sanborn insists his memory is fine, his standards haven't budged, but the coffee *itself* tastes different. He's not confused about his past self or his preferences." (Pre-empt the "memory error" dodge).

  4.  **The Indeterminacy Challenge (15 mins):**
      *   **The Key Question:** "Is there any conceivable test, observation, or piece of evidence (physical, behavioral, neurological, introspective) that could *definitively* show that Chase is right and Sanborn is wrong, or vice-versa, *given their own reports*?"
      *   **Group Brainstorm:** Have students propose tests. Guide them through why each fails:
          *   *Brain Scans?* (Shows neural correlates of experience & preference, but doesn't show which changed *first* or *causally* at the level of qualia vs. reaction. Correlates aren't the quale itself).
          *   *Behavior?* (Both report dislike now. Past behavior liking vs. current disliking is the *phenomenon to be explained*, not the explanation).
          *   *Introspection?* (This is precisely what Chase and Sanborn are *doing* and they disagree! Both claim direct access and report opposite conclusions).
          *   *Memory?* (Sanborn explicitly denies memory failure. Dennett builds him as sincere and consistent).
      *   **Conclusion:** There is no fact of the matter *even in principle* that could settle the dispute. The NQP distinction collapses under its own weight. The two stories are functionally (and introspectively!) equivalent descriptions of the *same underlying change*. The supposed "qualia" component adds no explanatory power and cannot be independently accessed.

  5.  **Addressing Misconceptions Head-On (Embedded & Explicit - 20 mins):**
      *   **Misconception 1: "Dennett Denies Consciousness/Experience Exists!"**
          *   **When:** Immediately after stating the indeterminacy conclusion.
          *   **Defuse:** "Dennett isn't denying that Chase and Sanborn *have experiences* or that coffee tastes different to them now. He's denying that we need to (or even *can*) posit *additional, non-functional, directly accessible properties (qualia)* to explain those differences. He's attacking a specific *theory* of what experience is (NQP), not the phenomenon of experience itself. He offers alternative explanations (dispositional, judgment-based)."
      *   **Misconception 2: "This is Just Reheated Verificationism!"**
          *   **When:** When discussing the lack of a "test" or during Q&A.
          *   **Defuse:** "This isn't about *meaning* being tied to verification. It's about the *coherence of the concept itself*. The NQP claims qualia are *distinct* from reactions/functions. C&S shows we cannot *make sense* of that distinction, even *within* the first-person perspective. It's not that we can't verify it 'from outside', it's that the distinction *dissolves* even 'from inside'. The problem is conceptual, not just epistemic."
      *   **Misconception 3: "It's Just Faulty Memory!"**
          *   **When:** When introducing Sanborn OR when brainstorming tests.
          *   **Pre-empt & Defuse:** Build Sanborn's reliability into the initial description ("adamant his memory is fine, his standards unchanged"). During brainstorming, ask: "Even if Sanborn's memory *was* faulty about his past qualia, how could *he* ever know that? How could *we* know he's wrong about his *current* access? The NQP relies on privileged access *now* and *then*." Emphasize that memory skepticism *also* undermines the NQP's claim to direct, incorrigible knowledge of past qualia.

  **Consolidation & Assessment (15-20 mins)**

  6.  **The Crucial Question (Assessment - 10 mins):**
      *   Pose: "**Can you describe a scenario involving a change in your experience (like suddenly disliking coffee or music) where you could *conclusively demonstrate*, even just to yourself through introspection and memory, whether it was a change in the *qualia themselves* versus *only* a change in your reaction to identical qualia?**"
      *   **Process:** Give 2-3 mins for quiet thought/pair discussion. Then cold-call or take volunteers. *Listen carefully.*
      *   **Success Looks Like:** Students struggling to articulate such a scenario without smuggling in assumptions about function, behavior, or neural changes, or realizing they can't. They might propose something but then see the hole (e.g., "Well, I *feel* like the taste is different..." → "But how is that feeling distinct from your judgment/dislike?").
      *   **If they propose something coherent:** Press them gently: "How do you *know* the quale changed and it's not your reaction? What is the 'quale itself' apart from your reaction and judgment? Could someone in Sanborn's position be mistaken in thinking it's the quale?" Guide them back to the indeterminacy.

  7.  **Wrap-up & Scope (5-10 mins):**
      *   Reiterate the core: The C&S argument shows the qualia/reaction distinction demanded by the NQP is incoherent. We can't isolate "raw feels" from our judgments and reactions to them.
      *   **Explicitly OUT OF SCOPE:**
          *   "We haven't *refuted* every possible notion of qualia, just the specific 'Naive Qualia Picture' we defined. Some philosophers defend more nuanced views."
          *   "We haven't solved the hard problem of consciousness or explained *why* there is something it's like. Dennett offers alternatives (heterophenomenology, dispositionalism), but that's for another day."
          *   "We haven't addressed *other* qualia arguments (like inverted spectrum or Jackson's Mary) in detail. Dennett tackles those elsewhere ('Quining Qualia'), arguing they *depend* on the flawed NQP exposed by C&S. We focused on the foundational attack." (Mentioning them briefly is ok if asked, but don't dive in).
          *   "We haven't explored Dennett's full positive theory (heterophenomenology). Today was about the *critique* of a specific concept."

  **Teaching Tips:**

  *   **Whiteboard is Key:** Keep the NQP definition, the two explanations for preference change, and the C&S summaries visible throughout.
  *   **Neutral Framing:** Present Dennett's argument charitably, not as dogma. Frame it as exposing a *problem* for the intuitive view.
  *   **Leverage the 2am Story (Briefly):** "I had this exact argument recently... we got stuck because..." builds rapport and shows the argument's bite.
  *   **Manage Time Rigorously:** Stick to the timings. The pre-reqs and C&S core are most important.
  *   **"I Don't Know" is Ok:** If a deep question arises that's out of scope, say "That's a great question pointing to X (e.g., Mary, spectrum). Dennett addresses it in the full essay, but for today's focus on C&S, we should table it to stay on track." Write it on a "Parking Lot" board if useful.
  *   **End on the Question:** The assessment question is your landing point. Let the silence hang if needed. Their struggle *is* the understanding.

  This structure builds the necessary foundation, uses C&S effectively to expose the core problem, preempts the major misunderstandings, and provides a clear assessment of whether the central indeterminacy point has landed, all while keeping the scope manageable for 90 minutes. Good luck – your 2am frustration will make you a better teacher of this!
