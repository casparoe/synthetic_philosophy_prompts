answer: |-
  Below is the exam question, a model answer arguing that the contrastive framing collapses, and a detailed marking scheme.

  ### Exam Question
  **Critically evaluate whether the contrastive question "Why did the Industrial Revolution occur in Britain and not in China?"—central to debates on the Great Divergence and the Needham Question—is a well-posed explanatory problem. Drawing on interventionist theories of causation and the logic of contrastive explanation, assess whether this framing: (a) illicitly presupposes institutional comparability between Britain and China circa 1700, (b) collapses into non-contrastive comparative history when subjected to counterfactual analysis, or (c) can be salvaged only under severe restrictions that undermine its macrohistorical scope. Defend a clear position on whether this contrastive structure should be retained, replaced, or radically reconceived.**

  ---

  ### Model Answer (689 words)  
  The contrastive question "Why Britain and not China?" dominates Great Divergence scholarship but is fundamentally ill-posed. It presupposes a false baseline of institutional symmetry circa 1700, collapses under interventionist scrutiny into non-contrastive comparison, and cannot be salvaged without sacrificing macrohistorical insight. I argue that this framing must be abandoned in favor of configurational explanations rejecting fixed counterfactual baselines.  

  **The Illicit Baseline Problem**  
  Contrastive explanations require a shared causal background against which a single variable differentiates outcomes (e.g., "Why P rather than Q?" implies P and Q were *possible* under similar conditions). The Britain-China pairing violates this. By 1700, Britain and China exhibited profound, path-dependent institutional differences: Britain’s post-1688 state prioritized sovereign debt markets and parliamentary constraints on taxation, while Qing China maintained a low-capacity agrarian bureaucracy with limited fiscal-military extraction. Treating these as "comparable cases" ignores how prior contingencies (e.g., the Thirty Years’ War’s impact on European state competition versus Ming-Qing continuity) had already generated *asymmetric* developmental pathways. The framing thus commits a *selection bias* by assuming both societies occupied a neutral starting point where "industrial breakthrough" was equally feasible.  

  **Interventionism and Counterfactual Collapse**  
  Interventionist causation (e.g., Woodward 2003) demands that explanatory variables be *insensitive* to background changes under counterfactual manipulation. To explain "Britain not China," we must hypothetically "intervene" on Britain’s causal factors (e.g., coal access, patent laws) while holding China’s background "fixed" to test stability. Yet this fails catastrophically. China’s "background" circa 1700—its size, tributary geopolitics, and Neo-Confucian administrative epistemology—was *incompatible* with British-style institutions. For instance, "adding" British patent laws to Qing China requires dismantling its entire examination system and gentry-scholar hierarchy, violating the interventionist requirement of *modularity* (i.e., minimal background disturbance). The counterfactual "China" in "not China" thus becomes an unrecognizable abstraction. The contrast collapses because the two cases lack a *stable causal field*: we cannot isolate "Britain’s causes" without altering China’s defining features, reducing the exercise to comparing two distinct historical configurations.  

  **The Futility of Salvage**  
  Proponents might restrict the counterfactual scope (e.g., "Why did Britain industrialize *first*?" or "Why not Jiangnan specifically?"). However, this either abandons contrastive structure or trivializes the explanandum. "Why Britain first?" is non-contrastive—it merely notes Britain’s priority without needing China as a foil. Meanwhile, narrowing to sub-regions (e.g., "Lancashire vs. Lower Yangtze") surrenders macrohistorical ambition: it cannot address *civilizational* divergence, which is the Needham Question’s core concern. Further, even localized contrasts face baseline issues. Qing Jiangnan’s proto-industry depended on kinship-based capital pooling, while Lancashire relied on joint-stock financing; "holding background fixed" is impossible without erasing institutional essence. The framing’s persistence reflects Eurocentric teleology—not analytical rigor—implying China "should have" industrialized by default.  

  **Toward Configurational Explanation**  
  The Britain-China dichotomy must yield to path-contingent, multicausal narratives. Instead of contrastive binaries, we should ask: "Through what concatenation of institutional, ecological, and contingent factors did certain regions achieve transformative productivity growth?" For Britain, this highlights *conjunctural* causes: Atlantic trade windfalls coinciding with coal geology and parliamentary fiscal innovation. For China, it reveals how the High Qing equilibrium suppressed capital-intensive innovation despite localized dynamism. This rejects "why not China?" as incoherent: China’s trajectory was not a "failure" but an alternative stability, shaped by distinct constraints (e.g., larger population reducing labor-saving incentives). Macrohistorical explanation requires *asymmetric* counterfactuals (e.g., "Could China have industrialized without European imperialism?") that respect institutional uniqueness.  

  **Conclusion**  
  The "Britain not China" framing is unsalvageable. Its false baseline, interventionist instability, and either trivial or teleological rescues exemplify the perils of imposing contrived symmetries on complex histories. Contrastive logic works for discrete events (e.g., "Why did *this* strike succeed but *that* one fail?") but fails for macrosocial outcomes emerging from deep structural divergence. Philosophy of history must prioritize context over comparison.  

  ---

  ### Marking Scheme  
  **A Answer (Distinction)**  
  - **Core Moves**:  
    1. Explicitly diagnoses the *baseline problem*: Identifies how selecting Britain/China presupposes institutional comparability circa 1700 despite path-dependent divergence.  
    2. Rigorously applies *interventionist criteria*: Uses Woodward-style counterfactuals to show background instability (e.g., altering one factor disrupts China’s socio-political fabric).  
    3. Argues the framing *collapses*: Demonstrates how "holding background fixed" reduces the contrast to non-contrastive comparison of two unique configurations.  
    4. Engages the *strongest objection*: E.g., Salvage via restricted scope (e.g., regional/local comparison), and refutes it by showing loss of macrohistorical meaning or persistent baseline issues.  
    5. Proposes a *coherent alternative*: Advocates for configurational, asymmetric, or path-contingent explanations.  
  - **Avoids**: Teleological assumptions, historical summarization without philosophical analysis, conflating contrastive form with causation.  

  **B Answer (Merit)**  
  - **Core Moves**:  
    1. Recognizes the *baseline problem* but may not fully dissect its implications for counterfactuals.  
    2. Describes *interventionism* but applies it incompletely (e.g., notes background instability without specifying modularity violations).  
    3. Concludes the framing is *flawed* but doesn’t rigorously show *collapse* (e.g., calls it "simplistic" without interventionist testing).  
    4. Notes objections but addresses them superficially (e.g., "regional comparisons are better" without explaining why).  
  - **Typical Errors**:  
    - Retreats to historical comparison (e.g., lists Britain’s advantages vs. China’s "blocking factors").  
    - Treats contrastive form as intrinsically valid.  
    - Vagueness on counterfactual licensing (e.g., "We can imagine China adopting British institutions").  

  **C or Below**: Summarizes Great Divergence narratives without engaging philosophy; ignores interventionism/baseline issues; asserts the framing’s validity without defense.  

  ---

  This structure ensures students grapple with *how* historical explanations are constructed, not just *what* they claim—meeting your goal of pushing beyond narrative summary. The model answer’s unapologetic stance forces conceptual clarity, while the marking scheme rewards metalogical analysis over historical detail.
