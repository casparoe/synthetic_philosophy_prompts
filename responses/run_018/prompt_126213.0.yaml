prompt: |-
  I'm a night supervisor at a recycling plant and I keep coming back to that old story about Gyges and the ring that makes you invisable -- like if nobody can catch you, why stay good? I want whatever philosophy actualy says about that turned into a real decison procedure I can run in my head when I'm alone on shift. Not a sermon: list the questions in order, what counts as a good enough answer, where it stops with a hard no, and where it hands the call back to me because it's values not facts. It needs to cover both the case where wronging leaves zero trace and the case where it might bite later but nobody knows it was me. Then apply it to two things: finding a wallet with cash in the sorting line that'd be burned if I don't take it, and backdating a safety log one day so my crewe doesn't get blamed for a minor slip. The procedure should give me at least one answer I won't like, and it should say flat out where it can't settle the call.
reasoning: |-
  Okay, the user is a night supervisor at a recycling plant working alone. They're grappling with the moral dilemma from the story of Gyges' ring—essentially, "If I could get away with something wrong without consequences, why be good?" They want a practical decision-making procedure, not just philosophical ideas. 

  Hmm, they're clearly a practical person dealing with real-world temptations—finding cash in a wallet or falsifying safety logs. The request is very specific: a step-by-step checklist with clear thresholds, not vague moralizing. They even demand the system must occasionally give uncomfortable answers and admit when it can't decide. That's unusually self-aware—they're not looking for justification but a genuine ethical tool.

  First, I need to structure this as a flowchart-like Q&A. The key is balancing act utilitarianism (harm/benefit) with deontology (rules/duties) while flagging where personal values take over. Must distinguish between truly untraceable acts vs. "probably safe but risky" scenarios. 

  For the wallet example: taking cash seems harmless (money would burn anyway!) but fails the ownership test—it's not yours, even if unclaimed. The safety log falsification is trickier: minor slip, protects the crew, but violates procedural integrity. The system should force confronting that "nobody gets hurt" isn't always true—corroding trust in systems matters. 

  Biggest challenge: making philosophy actionable. Kant's "universal law" test needs rephrasing as "would this work if everyone did it?" without jargon. Also, where to insert the "hard stops"—theft? Lying that risks lives? Must draw bright lines. 

  User won't like hearing that backdating logs is unacceptable even for good intentions. That's deliberate—they asked for uncomfortable truths. And for the wallet, the procedure should corner them into admitting keeping cash is theft, full stop. 

  Final note: explicitly call out "gray zones" where the math doesn't give clear answers (e.g., $5 in the wallet vs. $500). Their values decide there. That honesty builds trust in the system.
answer: |-
  Here's a concrete decision procedure based on core ethical philosophies (Kantian Deontology, Utilitarianism, Virtue Ethics, Social Contract), designed for use during a night shift. It forces hard questions and acknowledges limits.

  **The Gyges Decision Procedure**

  **Ask these questions IN ORDER. Stop at any "HARD NO" or "VALUES CALL" result.**

  1.  **Is this act physically harmful to a person?**
      *   **YES:** → **HARD NO.** (Deontology/Virtue Ethics: Core prohibition against harm).
      *   *NO:* → Proceed to Q2.
      *   *Good Enough Answer:* "Harm" means bodily injury, immediate endangerment, or severe psychological trauma. A minor slip in a log isn't harm; causing an accident by hiding it would be.

  2.  **Does this act involve taking or damaging someone's rightful property?**
      *   **YES:** → **HARD NO.** (Deontology/Property Rights: Violates fundamental rights).
      *   *NO:* → Proceed to Q3.
      *   *Good Enough Answer:* "Rightful property" means something clearly owned by a specific person or entity. Abandoned trash *might* not qualify, but a recognizable wallet does. Company tools are company property.

  3.  **Is this act dishonest (lying, falsifying, concealing truth where truth is expected)?**
      *   *YES:* → Proceed to Q3a.
      *   *NO:* → Proceed to Q4.
      *   **3a. Does the dishonesty undermine a critical safety, legal, or accountability system?**
          *   **YES:** → **HARD NO.** (Social Contract/Utilitarianism: Erodes trust and systems everyone relies on; high potential for indirect harm).
          *   *NO OR UNSURE:* → **VALUES CALL:** Proceed, but weigh heavily. Acknowledge you're compromising honesty. (Virtue Ethics: Honesty is a core virtue; exceptions feel "dirty" for a reason).

  4.  **Is the benefit solely for me?**
      *   **YES:** → **VALUES CALL:** Proceed with extreme caution. Strong leaning towards NO unless other factors are overwhelming. (Virtue Ethics: Selfishness is a vice; Utilitarianism: Benefit is narrow).
      *   *NO:* → Proceed to Q5. (Benefit to others is generally more justifiable).

  5.  **Does the potential benefit outweigh the potential harm (considering ALL parties, including unseen/unaware ones, and system integrity)?**
      *   **CLEARLY YES (Benefit >> Harm):** → Proceed to Q6. (Utilitarianism: Net positive).
      *   **CLEARLY NO (Harm >> Benefit):** → **HARD NO.** (Utilitarianism: Net negative).
      *   **UNCLEAR or CLOSE CALL:** → **VALUES CALL:** Your judgment on the balance. Err towards caution.

  6.  **Could this act work as a UNIVERSAL rule? (If everyone in my position did this whenever they thought it was justified, would the system collapse or become unjust?)**
      *   **NO (Leads to chaos/injustice):** → **HARD NO.** (Kantian Deontology: Fails the Categorical Imperative).
      *   *YES (System remains functional/fair):* → Proceed to Q7. (Rare, especially for acts involving gain or dishonesty).
      *   *UNSURE:* → **VALUES CALL:** Leaning NO. Universality is a strict test.

  7.  **Does this act align with the person I want to be? (Would I feel proud telling someone I respect? Does it build or erode my integrity?)**
      *   **YES:** → **PROBABLE YES (with caution).** (Virtue Ethics: Builds character).
      *   **NO:** → **PROBABLE NO.** (Virtue Ethics: Erodes character).
      *   *MIXED/UNSURE:* → **VALUES CALL:** Deeply personal. What kind of supervisor/person are you?

  **Where it Stops:**
  *   **HARD NO:** (Q1, Q2, Q3a, Q5-Clear NO, Q6-NO). The act is ethically forbidden. Do not proceed.
  *   **VALUES CALL:** (Q3a-Unsure, Q4, Q5-Unclear, Q6-Unsure, Q7). The ethical framework highlights conflicts or gray areas. *You* must decide based on your personal values, role responsibilities, and conscience. The procedure flags these as judgment zones.

  **Applying the Procedure:**

  **Case 1: Wallet with Cash Found on Sorting Line (Would be Burned)**

  1.  **Harm?** No (physically). → Proceed.
  2.  **Property?** YES! It's clearly someone's property. → **HARD NO. Stop.**
      *   *Result:* Taking the cash is theft. Doesn't matter if it would burn; it's not yours. Keeping the wallet to try and return it *might* pass Q2, but keeping the cash fails at Q2.

  **Case 2: Backdating Safety Log (Minor Slip, Protect Crew from Blame)**

  1.  **Harm?** No (immediate physical harm). → Proceed.
  2.  **Property?** Not directly. (It's information). → Proceed.
  3.  **Dishonest?** YES! (Falsifying a record). → Go to 3a.
  4.  **3a. Undermine Critical System?** **YES!** Safety logs are core accountability tools for identifying hazards and preventing FUTURE harm. Falsifying them erodes trust and the system's purpose. → **HARD NO. Stop.**
      *   *Result:* Even with good intent (protecting crew), this is a **HARD NO** because it attacks a critical safety system. The potential long-term harm (normalizing dishonesty, missed hazard patterns) outweighs the short-term benefit.

  **Why You Won't Like an Answer:**
  *   The Wallet gives a **HARD NO** you might dislike. You see "free cash going to waste," but the procedure bluntly calls it theft based on property rights (Q2).
  *   The Safety Log gives a **HARD NO** you might dislike. Your motive (protecting the crew) feels good, but the procedure prioritizes system integrity over that motive (Q3a).

  **Where it Can't Settle the Call (VALUES CALL):**
  Imagine finding a single $5 bill loose in clearly unrecyclable trash destined for incineration (no wallet, no ID).
  1.  Harm? No.
  2.  Property? Unclear. Is loose cash in trash "rightful property" of anyone identifiable? Maybe not clearly. → Proceed (or weak VALUES CALL).
  3.  Dishonest? If you just pocket it without reporting, arguably yes (concealing gain). → Proceed to 3a.
  4.  3a. Critical System? Probably not for $5 loose cash. → Proceed (VALUES CALL: Dishonesty is present).
  5.  Benefit Solely Me? **YES.** → **VALUES CALL:** Strong lean towards NO.
  6.  Benefit > Harm? Hard to quantify. $5 benefit to you vs. minor dishonesty/system erosion? → **VALUES CALL.**
  7.  Universal Rule? If everyone pocketed loose cash... could lead to temptation to "find" more, eroding trust. → **VALUES CALL** (Leaning NO).
  8.  Person I want to be? Depends entirely on you. Would you feel guilty? Or justified?
      *   **FINAL RESULT: VALUES CALL.** The procedure flags multiple conflicts (dishonesty, selfishness, potential rule erosion) but no absolute **HARD NO** like theft or harming a system. *You* must decide if the minor dishonesty and self-interest are acceptable to you in this very specific, low-stakes, ambiguous case. The procedure forces you to confront these elements.

  **Use on Shift:**
  Run through the questions sequentially for any tempting action. The **HARD NOs** (Harm, Theft, Sabotaging Critical Systems) are your absolute barriers. The **VALUES CALL** points demand honest self-reflection about your motives, integrity, and view of your role. It won't make gray areas easy, but it will prevent clearly unethical acts and force you to confront the reasons *why* "getting away with it" might still be wrong.
