  The sticky table held two empty pint glasses and a laptop glowing with population graphs. Fiona massaged her temples. "Look, all I'm saying is *technically* Malthus hasn't been *falsified*. He's just... operating on an extended temporal scale."

  Liam snorted, tracing a line on the screen that wildly overshot actual human growth. "Fiona, his 'geometric vs. arithmetic' prediction has been empirically dead since roughly Napoleon. Two centuries of being spectacularly, gloriously wrong. Isn't that *definitionally* falsified?"

  "But the *core logic* holds!" Fiona insisted, her voice rising slightly. "People *breed* exponentially if they can! Resources *are* finite! He just... underestimated human ingenuity's *runway*. Synthetic fertilizer bought us time, loads of it. But it's a finite buffer, Liam! A borrowed asymptote!"

  "So," Liam leaned back, gesturing vaguely at the bustling, well-fed pub around them. "Your argument is that Malthus is correct, but his prediction window was... what? Two hundred and fifty years too short? That 'imminent catastrophe' just needed a quarter-millennium margin of error? That's not science, that's prophecy with a really flexible due date."

  "Think of it as a boundary condition error!" Fiona jabbed her finger at the laptop. "He modelled the system *without* the Haber-Bosch wildcard. A valid model *within its initial parameters*. Now, we see the *new* boundary approaching – peak phosphorus, depleted aquifers, climate destabilizing food systems. The 'arithmetic' of land and water *finally* bites. The model wasn't *wrong*; its catastrophic convergence was just... postponed. By tractors! And ammonia! But the postponement is finite!"

  Liam stared into his empty glass. "So, being empirically invalid for two hundred years doesn't kill the theory... it just means we were living in the model's *grace period*? The error bars aren't around the prediction line... they're around the *apocalypse date*?"

  "Exactly!" Fiona beamed, the relief of academic vindication momentarily cutting through the exhaustion. "He wasn't *wrong*, Liam. He was catastrophically... *premature*."

  Liam sighed, signalling the bartender for two more pints. "Right. So Malthusian theory is like a stopped clock that only tells the correct time once – specifically, the exact moment the world ends."

  **"Some predictions are only validated by the collapse they describe."**
