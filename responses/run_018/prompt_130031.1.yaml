  hey im a junior and im running a session for my school's phil club next thursday on grice's idea of implicature vs speaker meaning. i want to do it with a kinda niche twist: using an AI chatbot that says "thats a really creative take" to a bad idea, so we can talk about whether the bot "meant" anything. the members know basic logic but not grice's maxims.

  i need you to map out the teaching plan, not explain the concept itself. specifically: the order the pieces have to go in (what depends on what), the one carrying example/scenario (and why not just use the classic "its cold in here" one), the misconceptions they'll show up with—im guessing theyll think implicature is just being fake or that speaker meaning is always intentional—and exactly where in the sequence to head each off, plus one final question to check they understand speaker meaning separate from literal content. also tell me which maxims or parts of the cooperative principle i should flat out skip at this level and say so.

  please respond as a JSON object with exactly these fields:
