  Build me a scenario where Bradley's regress actually shows up in a hospital ethics committee trying to agree on one recommendation, so we can realise exactly why Russell treated relations as external but Bradley said they must be internal. Keep it to one paragraph, realistic—no sci-fi or demons—and make sure the regress bites rather than being hand-waved away. Then walk through what each philosopher would say about the committee's decision, point out the stuctural feature doing the work, and say wether removing it collapses the case. Finish by taking a definite stance: is the regress vicious here, or is it just a muddle about how language binds things together? Write it casually—British spelling, a couple of typos are fine—and don't give me a bibliography or list of readings; just argue it through.
