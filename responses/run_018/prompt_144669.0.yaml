answer: |-
  ### Proposal: The Geometric Prisoner's Dilemma in Multi-Agent Kelly Betting  

  **Core Question**:  
  When two log-utility agents engage in repeated zero-sum betting, both optimizing their individual Kelly criteria, does this lead to a collective suboptimal outcome where their *long-run growth rates are lower* than under a coordinated flat-betting agreement?  

  ---

  ### **Why Single-Agent Proofs Fail Here**  
  1. **Endogenous Odds**:  
     - Single-agent Kelly assumes *fixed, exogenous odds*.  
     - In multi-agent betting, odds emerge from opponents' strategies, creating feedback loops.  
  2. **Strategic Interaction**:  
     - Agents’ bet sizes affect each other’s bankroll trajectories.  
     - Nash equilibrium ≠ joint optimality (à la prisoner’s dilemma).  
  3. **Non-Ergodicity**:  
     - Wealth dynamics become path-dependent and state-based (unlike IID settings).  

  ---

  ### **Precise Model**  
  **Game Setup**:  
  - Two agents (A, B) with initial bankrolls \(B_A^0 = B_B^0 = 1\).  
  - Each round \(t\):  
    - Simultaneously choose bet fractions \(f_t \in [0, 1)\), \(g_t \in [0, 1)\).  
    - Outcome: Fair coin flip (win probability \(= 0.5\)).  
    - **Payoff if A wins**:  
      - \(B_A^{t+1} = B_A^t + g_t B_B^t\) (A wins B’s bet)  
      - \(B_B^{t+1} = B_B^t - g_t B_B^t\)  
    - **Payoff if B wins** (symmetric loss for A).  
  - **Zero-sum**: Total wealth preserved: \(B_A^{t} + B_B^{t} = 2\) ∀ \(t\).  

  **Strategies**:  
  - **Kelly agents**: Each maximizes expected log-growth per round:  
    \[ \max_{f_t} \mathbb{E}[\log(B_A^{t+1}/B_A^t)] = \frac{1}{2} \log(1 + g_t R_t) + \frac{1}{2} \log(1 - f_t) \]  
    where \(R_t = B_B^t / B_A^t\) (wealth ratio).  
  - **Flat betting**: Both agents use fixed \(f_t = g_t = \epsilon\) (small constant).  

  **Equilibrium Concept**:  
  - **Markov Perfect Equilibrium (MPE)**: Strategies depend only on current wealth ratio \(R_t\).  
  - **Symmetric Nash**: Solve for \((f^*, g^*)\) such that:  
    \[ f^*(R) = \text{argmax}_f \, \mathbb{E}[\log \text{growth} \,|\, g = g^*(R)] \]  
    (symmetrically for B).  

  ---

  ### **Method: Growth-Rate Comparison**  
  1. **Simulate \(n\)-Round Trajectories** (\(n \gg 1\)):  
     - For competing Kelly agents: Compute long-run growth rate \(\gamma_{\text{Kelly}} = \lim_{n \to \infty} \frac{1}{n} \log(B_A^n)\).  
     - For flat-betting agreement: Compute \(\gamma_{\text{flat}} = \frac{1}{2} \log(1 + \epsilon^2) + \frac{1}{2} \log(1 - \epsilon^2) \approx 0\) (for small \(\epsilon\)).  
  2. **2x2 Matrix Reduction** (Simplified One-Shot Analogue):  
     - Discretize actions: Each chooses *high* (Kelly fraction \(\kappa\)) or *low* bet (\(\epsilon\)).  
     - Payoff = Expected log-growth over one round (wealth ratio \(R_t\) fixed as 1):  
       | A \ B | High (\(g = \kappa\)) | Low (\(g = \epsilon\)) |  
       |--------|------------------------|------------------------|  
       | **High** (\(f = \kappa\)) | \(\frac{1}{2}\log(1+\kappa^2) + \frac{1}{2}\log(1-\kappa^2)\) | \(\frac{1}{2}\log(1+\epsilon \kappa) + \frac{1}{2}\log(1-\kappa)\) |  
       | **Low** (\(f = \epsilon\)) | \(\frac{1}{2}\log(1+\kappa \epsilon) + \frac{1}{2}\log(1-\epsilon)\) | \(\frac{1}{2}\log(1+\epsilon^2) + \frac{1}{2}\log(1-\epsilon^2)\) |  
     - Check if (*High, High*) is a dominant Nash equilibrium but yields lower payoff than (*Low, Low*).  

  ---

  ### **What Success Looks Like**  
  - **Positive Result**:  
    - Competing Kelly strategies yield \(\gamma_{\text{Kelly}} < 0\) (negative growth), while flat betting gives \(\gamma_{\text{flat}} = 0\).  
    - One-shot 2x2 matrix shows (*High, High*) is Nash but Pareto-dominated by (*Low, Low*).  
  - **Negative Result**:  
    - Kelly vs. Kelly yields \(\gamma_{\text{Kelly}} \geq 0\) (no dilemma).  
    - Wealth ratio \(R_t\) converges to constant (reduces to single-agent case).  

  ---

  ### **Feasibility & Risks**  
  - **3 Months is Enough**:  
    - Phase 1 (1 month): Simulate wealth trajectories under MPE (Python).  
    - Phase 2 (1 month): Solve 2x2 game + derive analytic bounds.  
    - Phase 3 (1 month): Compare \(\gamma_{\text{Kelly}}\) vs. \(\gamma_{\text{flat}}\); write report.  
  - **Project Failure Modes**:  
    1. **Trivial Equilibrium**: Agents bet \(f^* = g^* = 0\) (no betting) → no dilemma.  
    2. **Single-Agent Reduction**: Dynamics decouple; \(R_t\) stabilizes → Kelly dominates as usual.  
    3. **No Negative Growth**: \(\gamma_{\text{Kelly}} > \gamma_{\text{flat}}\) (unlikely but possible).  

  ---

  ### **Why This Matters**  
  - Extends Kelly theory to *strategic settings* with implications for trading, sports betting, and multi-agent RL.  
  - Identifies conditions where "rational" agents collectively undermine their growth—a geometric prisoner’s dilemma.  

  **Honest Assessment**:  
  > "This is high-risk/reward. If the interaction collapses to single-agent dynamics (likely at equilibrium), the project fails. But preliminary math suggests volatile paths where \(R_t\) oscillates wildly, penalizing both agents. 3 months suffices to test this."
