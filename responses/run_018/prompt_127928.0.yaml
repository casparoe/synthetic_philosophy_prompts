answer: |-
  ## Exam Question: Contractualism, Risk, and the Stability of the Burden Distinction

  **Instructions:** Answer the following question in a well-organized essay of approximately 700-900 words. Base your argument primarily on T.M. Scanlon's contractualism as developed in *What We Owe to Each Other*, engaging critically with the specific dilemma presented. Avoid mere summary of Scanlon's core views; focus on applying and evaluating his principles in this novel context. You have 90 minutes.

  **Question:**
  Scanlonian contractualism evaluates principles by asking whether anyone could reasonably reject them given their potential burdens. This framework famously struggles with *aggregation*: how to justify imposing small burdens on many people to prevent a large burden to one person when the total burden prevented is larger, especially when no single person bears a burden large enough to reasonably reject the principle permitting it. Consider the following triage scenario:

  *   **Situation A:** You can save the lives of five trapped workers. The *only* way to do this is by triggering a rescue mechanism that imposes a very small, identical risk of serious, permanent injury (e.g., 0.1% chance of lifelong paralysis) on each of 100 nearby, uninvolved bystanders.
  *   **Situation B:** You can save one bystander from certain, serious permanent injury. The *only* way to do this is to *not* trigger the rescue mechanism, which would result in the certain deaths of the five trapped workers.

  According to Scanlon's framework:
  1.  Explain why, in Situation B, saving the one bystander by letting the five die seems impermissible. Identify whose complaint grounds the reasonable rejection and why.
  2.  Explain whether, in Situation A, saving the five workers by distributing the tiny risks to the 100 bystanders is permissible. Do the bystanders have a reasonable complaint against a principle permitting this action?
  3.  The core challenge: Scanlon allows the *strength* of a complaint to matter. Situation A involves distributing *tiny* burdens; Situation B involves a *large, concentrated* burden (letting five die to save one from injury). Does contractualism provide a stable, *non-utilitarian* justification for permitting the action in Situation A while forbidding it in Situation B? Or does justifying Situation A inevitably rely on a covert utilitarian weighing of total harm (100 * 0.1% risk ~ 0.1 expected injuries prevented vs. 5 lives saved)? If it does rely on such weighing, does this mean contractualism collapses into a form of rule-utilitarianism? Critically evaluate the stability of Scanlon's distinction between large concentrated burdens and small distributed burdens in light of this dilemma.

  ---

  ## Model Answer (Approx. 700 words)

  Scanlonian contractualism evaluates moral principles by asking whether they could be reasonably rejected by anyone seeking principles no one could reasonably reject, given how the principles allocate benefits and burdens. A complaint's reasonableness depends on its generic, personal force – the burden an individual would bear *to them* under the principle. This framework famously resists aggregating small burdens across many people to outweigh a large burden to one, as no single individual bears a burden comparable to the large one. However, the presented triage scenario challenges the stability of this distinction when burdens are tiny, homogeneous, and distributed.

  **1. Situation B (Saving One, Letting Five Die): Impermissible & Grounds for Rejection**
  In Situation B, choosing to save the one bystander from injury by letting the five workers die would be impermissible under Scanlon's framework. The principle permitting this action ("When saving one person from serious injury requires not saving five from certain death, it is permissible to let the five die") could be reasonably rejected. Whose complaint grounds this? The five doomed workers (or any individual among them). Each faces the enormous burden of certain death. Crucially, Scanlon prioritizes the *strongest individual complaint*. While the saved bystander avoids a serious injury, the *magnitude* of the burden each worker faces – death – vastly outweighs the burden the bystander avoids – injury (even a serious one). Death is a catastrophic loss of all future prospects, a burden of supreme personal importance. No individual worker could reasonably be asked to accept death to save another person from a lesser harm (serious injury). The bystander's complaint against being injured cannot reasonably outweigh any *single* worker's complaint against dying. The veto power lies with the worker facing the largest burden; aggregation of the *number* of workers doesn't directly factor in, only the fact that each faces an individually catastrophic burden that grounds a rejection no one else can override.

  **2. Situation A (Saving Five, Distributing Tiny Risks): Permissible?**
  Situation A is more complex. Saving the five workers requires imposing a very small, identical risk (0.1% chance of serious injury) on each of 100 bystanders. Could any bystander reasonably reject a principle permitting this ("When saving multiple lives requires distributing a very small, homogeneous risk of serious injury to a larger number of uninvolved people, it is permissible to do so")? Scanlon's core argument against aggregation suggests *no single bystander* has a sufficiently strong complaint. The burden each faces is tiny – a 0.1% chance of injury. While serious injury is a significant harm, the *ex ante* probability each faces is so low that it seems unreasonable for any *individual* bystander to reject the principle on the grounds that *their specific tiny risk* outweighs the certainty of death faced by one of the workers. Their complaint, in isolation, lacks the generic personal force to override the catastrophic complaint of a worker facing death. The situation differs from the "large burden vs. large burden" case because here the distributed burdens are individually negligible. The *total* expected harm distributed (0.1 expected injuries) is much smaller than the harm prevented (5 lives saved), but Scanlon insists we look at individual complaints, not this total. So, *prima facie*, since no bystander has a strong enough individual complaint, the principle permitting the action seems immune to reasonable rejection, making the action permissible.

  **3. The Core Challenge: Stability of the Distinction and Utilitarian Collapse?**
  The critical question is whether this distinction – forbidding B (large burden vs. large burden) while permitting A (large burden vs. many tiny burdens) – is stable within contractualism without smuggling in utilitarianism. Scanlon relies on the idea that tiny burdens don't generate veto-worthy complaints. However, justifying A seems to *depend* on the fact that the *sum* of the tiny risks is negligible *compared to the benefit* (0.1 expected injuries vs. 5 lives). If the distributed risk per bystander were higher (say 10%), making the total expected harm larger (10 expected injuries), contractualism might still struggle to reject the principle, as no *single* bystander faces a burden comparable to death (a 10% injury risk vs. certain death). But intuitively, imposing a 10% injury risk on 100 people to save 5 seems harder to justify than imposing a 0.1% risk, suggesting we *are* sensitive to the total burden distributed. This points towards a utilitarian calculation.

  Scanlon might appeal to "impersonal reasons" – the value of saving lives itself, independent of individual complaints – to bolster the case for saving the five in A. However, this move is precarious. If impersonal reasons can override the *absence* of strong individual complaints in A, why can't they override the *presence* of strong individual complaints in B? In B, strong impersonal reasons exist to save the five lives. If we allow impersonal reasons to justify overriding the *lack* of a veto in A, it seems arbitrary to deny them the power to potentially override a *single* veto in B, especially if the net impersonal gain (saving five lives vs. one injury) is huge. This threatens to dissolve the core contractualist commitment to individual justifiability and veto power based on personal burdens.

  Ultimately, the distinction proves unstable. Justifying Situation A implicitly relies on recognizing that the *aggregate* risk imposed is trivial relative to the lives saved – a form of expected utility calculation. While contractualism formally focuses on individual complaints, its permission in A depends on the *quantitative insignificance* of the *distributed* burdens *in sum*, not merely their individual qualitative nature. This covert aggregation functionally mirrors rule-utilitarianism: we adopt a rule ("distribute tiny risks to save many lives") because following it in relevantly similar cases maximizes expected well-being in the long run. Scanlon's attempt to block aggregation for large burdens but allow it for tiny distributed burdens via the "no individual complaint" route cannot maintain its non-utilitarian purity; it inevitably leans on a calculation of total burdens and benefits to determine when an individual complaint is too weak to matter, collapsing the view into a form of weighted rule-utilitarianism where individual veto power is strong against large concentrated harms but vanishes against sufficiently diffuse, tiny ones calculated to have a low total impact.

  ---

  ## Marking Scheme

  **Overall:** Assess the essay's accuracy, depth of analysis, understanding of contractualism's core mechanics, critical engagement with the dilemma, and structure/clarity.

  **A Grade (Excellent):**
  *   **Accurately & Clearly Explains Scanlon's Framework:** Demonstrates a precise grasp of reasonable rejection, the primacy of individual generic complaints, and the resistance to aggregation based on numbers alone.
  *   **Correctly Analyzes Situation B:** Clearly identifies the workers (specifically, any one facing death) as having the reasonable rejection ground; correctly explains the veto power of the strongest individual complaint (death vs. injury); avoids the mistake of simply "counting heads" (5 vs. 1).
  *   **Sophisticated Analysis of Situation A:** Correctly identifies the challenge: no single bystander likely has a strong enough complaint against the tiny risk to reasonably reject the principle. Goes beyond simple assertion to *explain why* the tiny individual burden fails to match the worker's burden. Identifies the lurking aggregation issue (total expected harm vs. benefit).
  *   **Critical Evaluation of Distinction's Stability:** Directly and insightfully addresses the core challenge. Explores whether the justification for A relies on covert aggregation/total harm calculation. Explicitly evaluates Scanlon's appeal to the *strength* of complaints in this context. **Crucially:** Engages deeply with the potential role of "impersonal reasons" and whether this saves Scanlon or leads to inconsistency/collapse. Recognizes the tension between formal individual focus and the functional role of aggregate burden size in making individual complaints "non-rejectable."
  *   **Clear Conclusion on Utilitarian Collapse:** Reaches a well-reasoned conclusion about whether the distinction holds or collapses into rule-utilitarianism, based on the preceding analysis. Avoids simplistic answers; shows nuance.
  *   **Structure & Clarity:** Well-organized, logical flow, precise language, minimal errors.

  **B Grade (Good, but lacking A's depth/insight):**
  *   **Generally Accurate on Scanlon:** Understands core ideas but may lack precision or depth on key mechanics like reasonable rejection criteria.
  *   **Mostly Correct on Situation B:** Identifies the workers can reject, understands death > injury. May slightly fumble the "veto power" explanation or imply aggregate numbers matter more than they do in Scanlon's strict view. *Typical Mistake:* Suggesting rejection is based *primarily* on the fact that five die vs. one saved, rather than the individual strength of each worker's complaint.
  *   **Basic Analysis of Situation A:** States that no bystander has a strong enough individual complaint. May not sufficiently explore *why* the tiny risk complaint is weak or may gloss over the total expected harm issue. *Typical Mistake:* Simply stating "the risks are small" without connecting it to the *individual* complaint framework or recognizing the quantitative aspect.
  *   **Superficial Engagement with Core Challenge:** Acknowledges the tension between A and B but doesn't deeply analyze *why* the distinction might be unstable. Mentions utilitarianism but doesn't rigorously explore how justification for A might rely on it or how impersonal reasons complicate things. May assert collapse/stability without strong argumentation based on the dilemma's specifics. *Typical Mistake:* Claiming Scanlon "just counts complaints" without seeing how the *assessment* of complaint strength in A may involve aggregate considerations.
  *   **Conclusion:** May be present but less developed or less convincingly tied to the analysis.
  *   **Structure & Clarity:** Generally clear but may have minor organizational issues or less precise language.

  **Key Specific Moves Required for an A (with Typical B Mistakes):**
  1.  **Identify Veto Power in Situation B:** Correctly state that the *individual* worker facing death holds the veto; rejection is grounded in the strength of *their* burden vs. the benefit to the one saved. *(B Mistake: Focuses on the aggregate number 5 vs. 1 as the primary reason for rejection).*
  2.  **Explain Non-Rejectability in Situation A:** Argue that no *single* bystander's tiny risk constitutes a burden strong enough to reasonably reject the principle permitting the rescue, because the individual risk is too small compared to the death faced by a worker. *(B Mistake: States the risks are small but doesn't explicitly tie this to the *individual* complaint's inability to override the worker's complaint, or implies the *number* of people saved matters directly).*
  3.  **Analyze Impersonal Reasons:** Discuss whether/how Scanlon might use impersonal reasons (value of saving lives) to justify A, and critically evaluate whether this creates inconsistency with B or undermines the individualist foundations. *(B Mistake: Fails to mention impersonal reasons, or mentions them without analyzing their problematic implications for consistency in B).*
  4.  **Assess Covert Utilitarianism in Justifying A:** Critically examine whether the permission in A *effectively* relies on the calculation that the *total* expected harm imposed (100 * 0.1% = 0.1 injuries) is outweighed by the total harm prevented (5 lives), even if framed in terms of individual complaint strength. *(B Mistake: Does not recognize or deeply analyze the potential role of aggregate/total harm calculation lurking behind the assessment of individual complaint weakness).*
  5.  **Conclude on Collapse into Rule-Utilitarianism:** Provide a reasoned judgment on whether the need to justify A using (explicitly or implicitly) aggregate considerations means contractualism, in practice for these cases, functions like a rule-utilitarian system (adopting rules that distribute tiny burdens because they have good aggregate consequences, with individual veto only for large harms). *(B Mistake: Concludes without sufficiently connecting the analysis of points 3 & 4 to the collapse question, or presents an overly simplistic yes/no answer).*
