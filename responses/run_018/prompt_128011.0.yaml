  Hmm, this seems rooted in Kantian ethics. Kant would say that actions only have moral worth if done from duty, not self-interest. Here, the roommate thinks she's acting from duty (fairness), but the real driver is social credit. So according to Kant, her actions might lack moral worth because the motive isn't pure duty. 

