  my roommate always cleans the kitchen when im stressed out. i used to think she was just being nice, but she admitted she only does it so the other roommates think shes responsible. at the same time she genuinely believes people should keep shared spaces fair and clean up after themselves. so shes doing the right action, and she thinks her reason is fairness, but the actual engine is social credit. does that kill the moral worth of what she does? like, is there a real difference between acting on the reason you think you have versus the one thats actually driving you? this feels like it breaks the usual duty-vs-inclination story but i cant pin down why.
