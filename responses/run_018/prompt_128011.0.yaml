  The user also mentions the duty-vs-inclination dichotomy feels broken here. That's because the roommate's stated reason (duty) and actual motive (inclination for social credit) are mixed. It's not a clear-cut case. Plus, there's self-deception involved. She believes she's motivated by fairness, but it's actually about appearance. That adds complexity beyond Kant's framework.

  The user might be seeking reassurance that their roommate's actions still have value despite mixed motives. They might also feel uneasy about the roommate's lack of self-awareness. The deeper need could be understanding how to navigate moral evaluations in real-life relationships where motives are messy.

