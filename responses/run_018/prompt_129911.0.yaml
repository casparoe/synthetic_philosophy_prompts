prompt: |-
  I've been thinking about a specific pattern that shows up whenever people discuss the aggregation of small harms—the familiar territory where one torture is apparently worse than 3^^^3 people each getting a dust speck in the eye, and debates about whether that intuition survives formalization. But I'm after something more granular. I keep noticing a consistent asymmetry in how people treat aggregation depending on whether the distributed harm is phenomenally transparent to its bearer.

  Consider two scenarios. In the first, each of ten billion people experiences a barely-noticeable moment of confusion once per year—not enough to register as a complaint, but collectively representing an enormous loss of clear-headedness. In the second, the same number of people each experience a barely-noticeable physical irritation of equivalent subjective intensity, distributed in the same way. In discussions I've seen, people are far more willing to aggregate the physical irritations into a serious moral concern than the epistemic confusions, even when the total welfare impact is stipulated to be identical and even when the epistemic harm is described as persistent and cumulative.

  This isn't just scope insensitivity, because the resistance to aggregation runs in opposite directions for the two harm-types, and it isn't the standard torture-versus-specks framing, because both scenarios involve only sub-threshold distributed harms with no severe focal victim. Is there an established name for this domain-sensitive resistance to aggregation—specifically, the tendency to treat phenomenally opaque or epistemic micro-harms as non-aggregable in a way that transparent or somatic micro-harms are not? If not, can it be defined precisely, with clear boundary conditions distinguishing it from ordinary scope neglect, from person-affecting restrictions, and from the non-identity problem? I'd appreciate an answer in American English, and I'm not looking for a bibliography—just the conceptual carving: what the phenomenon is, what it borders on, and where its edges fail.
reasoning: |-
  Okay, the user is diving into a nuanced ethical problem about aggregating small harms. They've noticed an asymmetry: people tend to aggregate physical micro-harms like dust specks more easily than epistemic ones like fleeting confusion, even when the total welfare impact is the same. They want to know if there's a name for this phenomenon and how to define it precisely.

  First, I need to unpack their core observation. They mention two scenarios—ten billion people experiencing minor confusion versus minor physical irritation. The key difference is how people perceive the aggregation. Physical harms are seen as summable into a serious issue, but epistemic ones aren't, even if both are sub-threshold and persistent. 

  The user is clear this isn't scope insensitivity or the classic torture vs. specks debate. They want to distinguish it from person-affecting views or non-identity problems. So, I need to focus on why the nature of the harm (somatic vs. epistemic) affects aggregation willingness.

  Looking at existing concepts, "scope neglect" is too broad. "Phenomenal opacity" comes to mind—epistemic harms are less tangible, making them harder to visualize as cumulative. There's also "harm-type aggregation asymmetry." But is there an established term? From what I recall, no specific term exists, so I'll need to propose one.

  Defining it precisely is crucial. The phenomenon is the asymmetry in aggregating harms based on their experiential transparency. Boundary conditions: it must involve sub-threshold, distributed harms; the key variable is phenomenal transparency. Somatic harms are transparent (easily noticed and summed), while epistemic ones are opaque (background noise, not seen as additive).

  I should contrast it with scope neglect—here, the issue isn't the number of people but the harm type. Person-affecting views might reject aggregation entirely, but this asymmetry allows aggregation for physical harms. Non-identity problems involve future generations, which isn't the case here.

  The user's deeper need might be to formalize this intuition for ethical frameworks. They might be working on moral philosophy or policy, needing precise concepts to address real-world issues like misinformation or minor inconveniences. By naming and defining this, they can better argue for considering epistemic harms seriously.
answer: |-
  Based on your description, the phenomenon you're observing doesn't have a single, universally established name in the literature, but it can be precisely defined and distinguished from related concepts. Here's the conceptual carving:

  1.  **The Phenomenon: Harm-Type Aggregation Asymmetry (HTAA)**
      *   **Core Definition:** The systematic difference in willingness to aggregate *sub-threshold, distributed harms* into a morally significant total burden, based primarily on the *phenomenal transparency* or *domain* of the harm (e.g., somatic/physical vs. epistemic/cognitive), even when the stipulated *subjective intensity per event* and *total disutility* are held constant.
      *   **Key Characteristic:** Aggregation resistance runs stronger for harms perceived as phenomenally *opaque* (epistemic confusion, background anxiety, mild ennui) than for harms perceived as phenomenally *transparent* (physical irritation, minor pain, brief discomfort). The asymmetry lies in the *type* of harm, not just its magnitude or distribution.

  2.  **Boundary Conditions & Distinctions:**
      *   **Sub-Threshold & Distributed:** This specifically concerns harms *below* the threshold where any single instance would typically motivate complaint or significant individual action (*unlike* torture-vs-specks, where one pole is extreme). The harm is also distributed across a vast population with *no focal victim*.
      *   **Phenomenal Transparency/Opaqueness is the Key Variable:**
          *   **Transparent Harms (Somatic Prototype):** Have a clear, identifiable, locatable, "object-like" phenomenal quality. A dust speck, a pinprick, an itch – they feel *like something specific happening to me*. This makes it easier to conceptualize adding them together ("a billion tiny stings").
          *   **Opaque Harms (Epistemic/Cognitive Prototype):** Lack a sharp, distinct phenomenal signature. Confusion, mild cognitive fog, a fleeting sense of unease – they are diffuse, background, harder to isolate and point to *as an event*. They blend into the baseline state. This makes them resistant to intuitive summation ("a billion tiny confusions" feels nonsensical or insignificant).
      *   **Distinguished from Scope Neglect/Insensitivity:**
          *   Scope neglect is a *general* failure to scale moral concern appropriately with the *number* of affected individuals or the *magnitude* of the effect. HTAA is *type-specific*. People *do* scale concern for transparent harms (physical irritation) across large numbers, but *fail* to scale it equivalently for opaque harms (confusion) of the same per-instance intensity and total disutility. It's an asymmetry *in* aggregation *across domains*, not a uniform failure *of* aggregation.
      *   **Distinguished from Person-Affecting Views:**
          *   Person-affecting views fundamentally question whether harms *not* making a specific individual "worse off" (compared to some alternative) can be aggregated at all. HTAA *accepts* aggregation *for some harm types* (transparent physical ones) but resists it *for others* (opaque epistemic ones), *even if* each instance *does* make the individual marginally worse off for that moment. The resistance is domain-based, not a rejection of aggregation per se.
      *   **Distinguished from the Non-Identity Problem:**
          *   The non-identity problem concerns harms to future individuals whose very existence depends on the action causing the harm ("are they worse off than they would otherwise be?"). HTAA applies to harms inflicted on *existing, identifiable populations*. The issue isn't counterfactual identity; it's the nature of the harm itself hindering aggregation.

  3.  **Where the Edges Fail (Limitations):**
      *   **Graded Phenomenal Qualities:** The transparency/opaqueness spectrum isn't binary. Some harms (e.g., very mild tinnitus, chronic low-grade pain) might sit in a grey area, making predictions about aggregation willingness less clear.
      *   **Cultural/Individual Variation:** Perceptions of what counts as "transparent" vs. "opaque" might vary. Some cultures might find certain cognitive states more salient than others.
      *   **Interaction with Severity:** At higher intensities, even opaque harms might become aggregable (e.g., severe chronic confusion). HTAA primarily operates in the *sub-threshold* zone.
      *   **Consequentialism vs. Deontology:** A strict consequentialist focusing solely on total utility might reject HTAA as irrational, while a deontologist emphasizing different types of rights (bodily integrity vs. mental clarity) might find it more intuitively justified. The phenomenon describes an *intuition*, not necessarily a justified moral principle.
      *   **Cumulative vs. Episodic:** Your "persistent and cumulative" epistemic harm description pushes the boundary. If the *individual* experiences a *cumulative* negative effect (e.g., mild chronic brain fog from repeated micro-confusions), aggregation resistance might weaken, as it starts to resemble a transparent *state* rather than opaque *events*. The core HTAA intuition is strongest for purely episodic, non-cumulative-at-the-individual-level opaque harms.

  **In essence:** You've identified **Harm-Type Aggregation Asymmetry (HTAA)**, driven by **Phenomenal Opacity Resistance**. It's the consistent pattern where the *inherent perceived nature* of a sub-threshold harm – specifically, its lack of a distinct, object-like phenomenal character (opacity) compared to somatic prototypes (transparency) – creates a unique barrier to aggregating its instances into a recognized total burden, distinct from general scope neglect, person-affecting constraints, or non-identity issues. The core mechanism is the difficulty in mentally "summing" phenomenally diffuse experiences.
