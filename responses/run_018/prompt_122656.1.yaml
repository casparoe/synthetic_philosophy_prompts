answer: |-
  Anna's lifetime of constant dust specks *does* aggregate into a significant harm. Each momentary irritation, while trivial alone, constitutes a micro-reduction in welfare; summed over two billion instances, this represents a massive cumulative welfare deficit equivalent to severe suffering. The critical distinction between Anna’s case and the original dust-specks scenario isn’t aggregation itself—both involve summing identical welfare losses—but the *distribution container*. You’ve compressed all harm into one life, making the aggregation *visible* as chronic distress, while spreading it across lives *obscures* the total burden from any single perspective. Yet the underlying math is identical: the same total quanta of disutility exist whether dispersed spatially (across persons) or temporally (within one person). Denying aggregation in the dispersed case because "no single person suffers much" mistakes phenomenological salience for moral weight—it’s a cognitive bias, not a principled objection. If Anna’s unbroken misery isn’t bad, you must reject cardinal welfare entirely; but if it is bad, aggregation holds universally.
