  I notice they're particularly attached to steps 1 and 7. That suggests they value the phenomenological reality of self-deception while also respecting empirical psychology. The challenge is preserving both without contradiction.

  The rationality assumption in step 4 feels particularly problematic. Human cognition isn't a perfectly consistent logical system - it's messy, compartmentalized, and often tolerates contradictions, especially when emotions are involved. The "epistemic friction" metaphor might be overstating how urgently contradictions must resolve.

