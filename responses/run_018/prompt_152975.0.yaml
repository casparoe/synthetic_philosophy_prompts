answer: |-
  Based on your team's skills and constraints, the upstream dependencies, and the risk of dead ends, here is a defended agenda prioritizing the lines of inquiry, with explicit dependency analysis and tractability assessment. Focus is on foundational questions that unlock or constrain downstream work, avoiding empirical dead ends.

  ### Prioritized Agenda & Dependencies
  1.  **Line 3: Formal Representation of Incomparability vs. Negligibility** (Highest Priority)
      *   **Why Upstream & Critical:** This is the core conceptual bottleneck of *lexical* NU. If sub-threshold pleasure is merely negligible (implying vast quantities could offset small supra-threshold suffering), the view collapses into standard cardinal utilitarianism with a very high aversion parameter. Proving genuine *incomparability* is essential to preserve the lexical claim. Failure here makes the entire project incoherent.
      *   **Tractability:** Perfect fit for your team. The formal ethicist and decision theorist can model axiomatic systems (e.g., non-Archimedean structures, multi-dimensional preference relations). Philosophers can analyze the conceptual coherence of "incomparability" in welfare states. Logical reconstruction of existing arguments is key.
      *   **Dependencies:** *Directly enables or dooms Lines 1 & 2.*
          *   If incomparability holds (A), it fundamentally constrains how lexical priority *must* operate (Line 1), ruling out intra-personal aggregation that treats pain/pleasure cardinally above/below threshold.
          *   If it collapses to negligibility (B), Line 1 becomes moot (it's just aggregation rules for cardinal utility) and Line 2 becomes a risk-weighting exercise within cardinal utility.
      *   **Neglect Factor:** Often handwaved as "obvious" or buried in technical notation without rigorous defense against collapse arguments. Your team can tackle the formalism head-on.
      *   **Dead End Risk:** Low. This is pure conceptual/formal work. The only dead end is concluding collapse is inevitable, which is a vital result.

  2.  **Line 1: Scope of Lexical Priority (Intra/Inter-personal & Aggregation)** (Second Priority)
      *   **Why Upstream & Important:** Defining the *domain* of lexical priority is foundational for application. Can a life contain both sub- and supra-threshold states? If so, how are they aggregated intra-personally? Does interpersonal aggregation follow the same strict lexical rule as comparing supra-threshold states? Mixing intra-personal cardinality with interpersonal lexicality likely breaks standard aggregation and requires novel rules.
      *   **Tractability:** Strong fit. Formal ethicist models aggregation rules under different priority scopes. Decision theorist analyzes consistency. Philosophers clarify the normative implications of different scopes (e.g., "person-affecting" views vs. holistic).
      *   **Dependencies:** *Highly dependent on Line 3.*
          *   If Line 3 confirms incomparability (A), then intra-personal lexicality becomes necessary (pleasure *cannot* offset pain within a life), making interpersonal aggregation the primary focus and simplifying the model. Standard aggregation likely breaks, requiring novel formalisms.
          *   If Line 3 collapses (B), Line 1 reduces to standard aggregation questions within cardinal utility.
      *   **Neglect Factor:** Often implicitly assumed (e.g., "worst-off" focus implies interpersonal) without analyzing intra-personal coherence or mixed-scope aggregation rules. Technical but manageable.
      *   **Dead End Risk:** Moderate only if Line 3 collapses. Otherwise, tractable formal/conceptual work.

  3.  **Line 2: Experienced Suffering vs. Risk-Weighted Potential Suffering** (Third Priority)
      *   **Why Important:** Crucial for practical application (e.g., AI safety, policy under uncertainty). Does the threshold trigger only on *realized* suffering, or on sufficiently high *risk* of suffering? This changes operationalization dramatically.
      *   **Tractability:** Good fit. Decision theorist models risk attitudes (e.g., lexicographic risk aversion). Formal ethicist defines "potential suffering" thresholds. Philosophers analyze moral status of risk vs. harm.
      *   **Dependencies:** *Strongly dependent on Lines 1 & 3.*
          *   Requires knowing *what* is being prioritized (Line 3 outcome) and over *whom/what domain* (Line 1 outcome). E.g., if Line 1 establishes strict intra-personal lexicality, potential suffering might need to be assessed per-individual. If Line 3 collapses, risk-weighting operates within cardinal utility.
          *   Line 2 is harder if Line 1 concludes intra-personal states matter lexically – assessing risk *within* a life becomes critical. Easier if focus is purely interpersonal.
      *   **Neglect Factor:** Risk aspects are often neglected in pure philosophical discussions but are technically demanding. Your DT can handle this.
      *   **Dead End Risk:** Low for core modeling, but operationalizing "potential suffering" for AI *might* edge towards empirical needs (though conceptual definitions come first).

  4.  **Line 4: Preference/Capability Metrics** (Lowest Priority / Potential Dead End)
      *   **Why Downstream & Risky:** Shifting the welfare metric doesn't dissolve the core lexical threshold problem; it relocates it. You now face commensurability problems between preference satisfaction/frustration or capability achievements/shortfalls *across the threshold*. The core conceptual challenge (incomparability vs. aggregation) remains structurally identical.
      *   **Tractability:** Moderate fit. Philosophers analyze preference/capability theories. Formal ethicist can model thresholds in these frameworks. However, it adds significant complexity without necessarily addressing the core bottleneck.
      *   **Dependencies:** *Largely independent of others, but less fruitful unless core fails.*
          *   If Lines 1 & 3 succeed in establishing coherent lexical NU with a hedonic metric, this line is redundant.
          *   If Line 3 definitively fails (collapse), this becomes a possible salvage path, but the team must then solve the *same* threshold/incomparability problem within a new metric – likely no easier.
      *   **Neglect Factor:** Not inherently neglected, but often pursued independently of specific lexical NU formalisms.
      *   **Dead End Risk:** **High for this team's primary goal.** It relocates the problem without resolving the core conceptual bottleneck of lexicality and commensurability across a threshold. It risks becoming a distraction unless the hedonic approach is proven fundamentally untenable *and* the team pivots goals. Low tractability *gain* for the core problem.

  ### Key Triggers for Reordering the Agenda
  *   **Line 3 Outcome (Critical Trigger):**
      *   **If Proves Incomparability Possible & Coherent:** Agenda holds. Focus intensifies on Line 1 implications.
      *   **If Proves Inevitable Collapse:** Core project re-evaluation needed. Line 4 moves up significantly as a salvage option (though high risk), while Lines 1 & 2 become exercises in cardinal utility with high aversion. Line 3 result would necessitate a major pivot.
  *   **Line 1 Outcome (Significant Trigger):**
      *   **If Strict Intra-Personal Lexicality Required:** Makes Line 2 (risk within a life) much harder and more urgent. May reveal novel aggregation paradoxes needing immediate attention.
      *   **If Purely Interpersonal Lexicality Viable:** Simplifies aggregation and makes Line 2 (population risk) more straightforward. Line 4 remains low priority.

  ### Dead End Flag
  *   **Line 4 (Preference/Capability Metrics):** Flagged as a **high-risk dead end** *for resolving the core conceptual bottleneck of lexical-threshold NU as defined*. It does not dissolve the commensurability problem across a lexical threshold; it replicates it within a different welfare ontology. Pursuing it deeply *before* resolving Lines 1-3 is inefficient and likely unproductive for your specific goal. Only pursue if Line 3 conclusively fails, and even then, recognize it's starting a similar battle on new terrain with no guaranteed advantage.

  ### Recommended 2-Year Focus & Deliverables
  *   **Year 1:** Intensive focus on **Line 3**. Goal: A formally rigorous defense of a coherent model of genuine incomparability between sub-threshold states and supra-threshold suffering, or a conclusive demonstration of its collapse into cardinality. This is the keystone.
  *   **Year 2:** Based on Year 1 outcome:
      *   *If Incomparability Holds:* Focus on **Line 1**. Goal: Define the scope (intra/interpersonal) and develop novel aggregation rules consistent with the proven incomparability. Start conceptual work on **Line 2** implications.
      *   *If Collapse:* Seriously evaluate pivoting to **Line 4** (high risk) or reframing the project around high-aversion cardinal NU (making Line 2 primary for risk modeling). Avoid sinking excessive time into Lines 1 & 2 under collapse.
  *   **Throughout:** Monitor dependencies. A strong result in Line 1 (e.g., proving intra-personal lexicality breaks standard aggregation) might necessitate revisiting Line 3's application within lives.

  This agenda maximizes leverage of your formal/conceptual skills on the most upstream and defining problem (Incomparability), sequences work based on strict dependencies, minimizes distraction by potentially fruitless alternatives (Line 4), and provides clear triggers for adaptation based on foundational results.
