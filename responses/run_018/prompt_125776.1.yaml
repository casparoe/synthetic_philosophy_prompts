answer: |-
  Here is a framework of desiderata for evaluating theories of "gains from trade" between incommensurable value systems, designed for your feature on moral disagreement and institutional design:

  **Core Phenomena to Capture (The "What Must It Explain?")**

  1.  **The Possibility of Mutual Gain Without Shared Norms:** The theory must explain how parties committed to fundamentally different, incompatible moral ends (e.g., maximizing aggregate welfare vs. preserving sacred traditions) can *both* perceive themselves as better off after a compromise.
      *   *Motivating Case:* Secular environmentalists (value: ecosystem health) negotiate with indigenous groups (value: sacred land stewardship). They agree on co-management preserving core ecological functions *and* specific ritual sites. Both feel their core interests were advanced relative to conflict or unilateral imposition.
      *   *Status:* **Non-Negotiable.** If the theory cannot explain this basic phenomenon, it fails its core purpose.

  2.  **The Existence of Genuine Losses Within Compromise:** The theory must account for why compromises often feel costly or involve sacrifice *even when parties agree*.
      *   *Motivating Case:* A pacifist community reluctantly accepts a minimal police presence funded by taxes they pay, reducing immediate violence but violating their deep commitment to non-coercion. They gain security but experience a moral loss.
      *   *Status:* **Non-Negotiable.** A theory portraying compromise as purely win-win ignores the painful reality of moral conflict.

  3.  **The Distinction Between Stable Modus Vivendi and Moral Consensus:** It must differentiate between a fragile truce based on power balances ("We'll tolerate your practice here if you tolerate ours there") and a more resilient agreement perceived as *mutually beneficial* under each system's internal logic.
      *   *Motivating Case:* Two religious groups agree to share a public space for ceremonies on different days (modus vivendi) vs. jointly designing a new space incorporating symbolic elements meaningful (though not identical) to both, fostering mutual respect (gains-from-trade).
      *   *Status:* **Crucial Distinction.** Theories collapsing this difference miss key dynamics of institutional resilience.

  **Conceptual Distinctions to Preserve (The "What Must It *Not* Blur?")**

  4.  **Means vs. Ends Trade:** Must clearly distinguish trading purely instrumental resources (money, time, land - means) from compromises affecting core values or ultimate ends.
      *   *Motivating Case:* Liberals trading budget allocations for highways vs. libraries (means trade) vs. liberals agreeing to restrictions on free speech deemed blasphemous by a conservative religious group to secure their support for an anti-poverty program (ends trade).
      *   *Status:* **Non-Negotiable.** Blurring this risks masking profound moral concessions as mere logistical adjustments.

  5.  **Pareto-Improvement vs. Kaldor-Hicks Efficiency:** Must differentiate an exchange where *no party is worse off* (Pareto) from one where aggregate gains could *hypothetically compensate* losers, but compensation doesn't actually occur (Kaldor-Hicks). The latter involves real moral loss.
      *   *Motivating Case:* Building a life-saving hospital that slightly inconveniences no one (Pareto) vs. seizing private land for the hospital, offering "fair market value," but destroying the owner's ancestral home and community ties (Kaldor-Hicks – aggregate health gains outweigh loss, but owner is uncompensated *for their specific values*).
      *   *Status:* **Non-Negotiable.** Treating Kaldor-Hicks as equivalent to mutual gain ignores non-fungible losses central to incommensurability.

  6.  **Genuine Trade vs. Coercion/Manipulation:** Must provide criteria distinguishing voluntary exchange based on mutual perceived benefit from agreements reached under duress, deception, or exploitation of power imbalances.
      *   *Motivating Case:* A small nation "agreeing" to unfair resource extraction terms under threat of sanctions vs. two communities negotiating land boundaries after impartial mediation.
      *   *Status:* **Non-Negotiable.** A theory justifying coercion as "trade" is morally bankrupt and pragmatically unstable.

  **Crucial Puzzles to Dissolve (The "Deep Tensions")**

  7.  **The "Hidden Currency" Trap:** The theory must explain how trade is possible *without* presupposing a single, universal metric (like utility, money, or "value points") that commensurates the incommensurable systems. It must avoid collapsing the very incommensurability it seeks to bridge.
      *   *Motivating Case:* If we justify saving a hospital over funding an art gallery by comparing "units of welfare" vs. "units of cultural enrichment," haven't we invented a hidden common currency? How can we compare them *without* such a currency?
      *   *Status:* **The Central Challenge.** Any adequate theory *must* successfully navigate this puzzle. Failure here invalidates the core premise.

  8.  **The "Slippery Slope" Concern:** The theory must address whether permitting certain types of inter-value trade inevitably leads to the erosion or corruption of core values over time, making "deeper" compromises acceptable where they weren't before.
      *   *Motivating Case:* If a religious group compromises on minor dietary rules for greater political influence, does this make compromising on core tenets easier later? Does accepting *any* trade on ends undermine the sacredness of those ends?
      *   *Status:* **Camp-Specific Preference.** Some theories (e.g., communitarian) see this as a fatal flaw requiring strict limits; others (e.g., liberal pluralist) see it as manageable risk inherent in social life.

  **The Core Tension (Likely Unsatisfiable Pair?)**

  *   **Radical Incommensurability vs. Determinate Trade-Offs:** This is the crux.
      *   **Desideratum A (Deep Incommensurability):** The theory must robustly preserve the idea that the value systems are fundamentally distinct and lack any common measure – their core commitments cannot be meaningfully ranked or quantified against each other *in the abstract*.
      *   **Desideratum B (Determinate Trade-Offs):** The theory must deliver concrete, actionable principles or mechanisms for deciding *in specific contexts* what constitutes a beneficial trade and when compromises are unacceptable. It shouldn't just say "it's complicated."
      *   **The Conflict:** How can we have specific, justified trade-offs without *some* method of comparison that implicitly creates a common measure, violating radical incommensurability? Theories typically lean towards one pole:
          *   *Leaning A:* Emphasize procedural fairness, mutual recognition, context-specific narratives, or modus vivendi. Risk: Vagueness, indeterminacy.
          *   *Leaning B:* Introduce bounded comparisons (e.g., "sufficientarian thresholds," "focal points," localized commensuration). Risk: Smuggling in hidden currencies or weakening the claim of deep incommensurability.
      *   *Status:* **The Fundamental Dilemma.** A theory perfectly satisfying both simultaneously may be impossible. The most plausible candidates will explicitly acknowledge this tension and explain how they navigate it (e.g., trade-offs are always contextual and provisional, never establishing abstract equivalence).

  **Key Takeaways for Your Framework:**

  *   **Non-Negotiables (1-6, 7):** Capturing core phenomena, preserving key distinctions, and absolutely avoiding the hidden currency trap are essential. A theory failing here is inadequate.
  *   **Camp-Specific (8):** Views on slippery slopes reflect deeper commitments about value integrity vs. social dynamism.
  *   **The Big Tension:** The conflict between radical incommensurability and the need for determinate trade-offs is the central challenge. Assess theories by how honestly they confront this and the plausibility of their proposed resolution. No theory will likely satisfy both perfectly; the best will manage the tension transparently.

  This framework provides the necessary conceptual tools to dissect proposed models of moral compromise, focusing on their ability to handle real-world phenomena, maintain crucial distinctions, resolve deep puzzles, and grapple with the inherent tension at the heart of trading across incommensurable values.
