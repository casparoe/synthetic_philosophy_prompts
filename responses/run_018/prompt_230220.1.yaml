  ## The Unsettling Scales: Pascal on Justice, Force, and the Shadow of the Fall

  Blaise Pascal’s *Pensées* offers a profound and unsettling exploration of the human condition, and nowhere is this more evident than in his fragmented reflections on justice and force. Readers are plunged into a seemingly irresolvable tension: is Pascal reducing justice to the mere command of the powerful, a proto-positivist acknowledging the brutal reality of politics? Or is he a trenchant critic of naked force, implying a transcendent standard of justice against which all power stands condemned? While textual evidence fuels both interpretations, a careful examination reveals Pascal primarily as a profound *critic* of earthly power, whose reductionist *observations* about human political reality serve to highlight the tragic corruption of a justice that exists independently but remains inaccessible to fallen humanity.

  **The Case for Proto-Positivism: Justice as the Mask of Force**

  Several passages strongly suggest a cynical, realist reading where justice is indistinguishable from established power:
  1.  **The Primacy of Force:** "Justice without force is powerless; force without justice is tyrannical. Justice without force is contradicted... it is necessary therefore to combine justice and force." (Fragment 298). This implies force is the indispensable *enabler* of justice, without which it is ineffective opinion.
  2.  **The Rule of Custom and Power:** "Custom is the whole of equity for the sole reason that it is accepted... whoever refers it to its first principle destroys it" (Fragment 294). Justice appears as mere convention, upheld only because questioning it undermines the stability provided by power. "It is just that what is just should be followed; it is necessary that what is strongest should be followed. Justice without might is helpless; might without justice is tyrannical" (Fragment 298). The stark equation of "followed" with "strongest" is damning.
  3.  **The Illusion of Foundation:** Pascal mocks attempts to find a rational or natural basis for justice: "Why do you kill me? What! Do you not live on the other side of the water? My friend, if you lived on this side, I should be a murderer... but since you live on the other side, I am a hero" (Fragment 293). This relativity, determined solely by arbitrary power structures (river borders), suggests justice is contingent on position and force, not inherent truth.
  4.  **The Mystification of Power:** Rulers deliberately cloak force in the garb of justice and custom to legitimize their rule and maintain order: "It was necessary to disguise force... and so that is why they put the rope round the throat of force" (Fragment 304). Justice here is revealed as a necessary fiction *for* power.

  This reading paints Pascal as a precursor to legal positivism or realist political thought, observing that "law" is simply what the sovereign power enforces, and "justice" its legitimizing myth.

  **The Case for the Independent Standard: Force Condemned by Justice**

  However, equally potent passages suggest Pascal operates with a critical standard *beyond* established power:
  1.  **The Charge of Tyranny:** The persistent counterpoint to "justice without force is powerless" is the unequivocal condemnation: "force without justice is tyrannical." The very term "tyranny" implies a normative judgment against the unjust exercise of power. If justice *were* merely what force commands, the concept of "tyranny" would be incoherent. Its use presupposes a standard violated.
  2.  **The Infinite Regress of "Might Makes Right":** Pascal exposes the absurdity of grounding justice solely in force: "Why is it my opinion that the possession of land should go to me? Because you have come from over there? No... if you say it comes from original seizure, I possess as justly as you. Here you are on the point of beginning an infinite process" (Fragment 294). This demonstrates that justifying possession by prior force leads to an infinite regress, revealing the *inadequacy* of force as a *justifying* principle. It cries out for a different ground.
  3.  **The Corruption of Reason:** Pascal doesn't argue justice *is* force; he argues that *human reason*, corrupted by self-love and the Fall, is incapable of discerning true justice. "We are born unjust; for each tends to himself. This is against all order. The tendency should be towards the general" (Fragment 477). The existence of "order" and the "general" good implies a true standard, even if we pervert it.
  4.  **The Divine Standard:** Crucially, Pascal places true justice firmly in the divine realm: "True justice... would require to be commanded by all lands... it would necessarily be uniform... Man cannot make what is just strong; he has only been able to make what is strong just" (Implicit in fragments like 298, 294, and explicit in his theology). God is the source of true justice, inaccessible to unaided human reason but existing as the absolute standard.

  This reading positions Pascal as a critic who uses the *revelation* of justice's reduction to force in human affairs precisely to highlight the depth of human corruption and the *need* for a transcendent standard (God's justice).

  **Resolution: The Corrupt Mirror and the Divine Standard**

  The tension is best resolved by recognizing that Pascal is engaged in a *diagnostic* project rooted in his Jansenist theology of original sin. His seemingly reductionist observations about human politics are not a *definition* of justice but a *description* of its inevitable fate in the fallen world:

  1.  **The Primacy of Fallen Reality:** Pascal accurately describes the *de facto* reality of politics: in a world where reason is clouded by self-interest and concupiscence ("the heart has its reasons"), force inevitably prevails. Custom, convention, and established power *become* the operational definitions of "justice" because humanity lacks the capacity to achieve true justice autonomously. This is the "proto-positivist" *observation*.
  2.  **The Independent Standard as Condemnation:** However, this reduction is not an endorsement; it is a profound *indictment*. The very fact that force *needs* to disguise itself as justice ("put the rope round the throat of force") reveals the enduring power of the *idea* of true justice. The label "tyranny" applied to naked force demonstrates that humans, however dimly, recognize a standard *violated*. This standard is God’s justice.
  3.  **The Theological Corollary:** True justice exists eternally with God. Human justice is always a flawed, corrupted approximation, inevitably intertwined with and distorted by the force necessary to sustain any earthly order. This is why political power "always corrupts" in the sense that it inevitably relies on force and masks it with illusions of justice, obscuring the divine standard it cannot meet. Pascal’s critique is not aimed at establishing a better earthly justice (which he deems impossible without grace), but at exposing the vanity and corruption of all human pretensions to justice based on power or unaided reason, thereby turning the mind towards God.

  **Conclusion: The Critic of Earthly Pretense**

  While Pascal ruthlessly documents how justice functions *as if* it were merely the command of the powerful in the fallen world, this is not his final word. It is the foundation of his critique. The persistent invocation of "tyranny," the exposure of the infinite regress of force, and the implicit contrast with a divine order reveal that he operates with a powerful, independent concept of justice. This true justice serves as the unattainable standard that renders all earthly power, by its necessary reliance on force and illusion, inherently suspect and ultimately corrupt. Pascal is not a proto-positivist reducing justice to force; he is a theologian of the Fall, using the grim reality of force-dominated politics as a mirror to reveal humanity’s tragic distance from true justice and its desperate need for a grace that transcends the political realm entirely. His genius lies in showing how the *recognition* of force's dominance is itself the proof of a lost, yet still haunting, ideal.
