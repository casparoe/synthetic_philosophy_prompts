answer: |-
  The result you're referring to is indeed a fundamental principle in Bayesian decision theory: for an ideal Bayesian agent, free information always has non-negative expected value before it is observed. This is because the agent can always choose to ignore the information or use it to make a better decision, but it can never make the agent worse off in expectation. The key assumptions here are that the agent is:
  - **Perfectly rational**: Updates beliefs correctly via Bayes' theorem.
  - **Unbounded in computation**: Can process any amount of information instantly and costlessly.
  - **Utility-maximizing**: Has consistent preferences, and utility depends only on outcomes, not on beliefs themselves (no belief-dependent utility).
  - **Capable of optimal action**: Always chooses the best action given its beliefs.

  However, humans violate these assumptions. We have cognitive limitations, emotional responses, biases, and belief-dependent utilities (e.g., knowing something bad can cause distress even if it doesn't change outcomes). As a result, information can have negative expected value for us because:
  - It may directly reduce utility through emotional costs (e.g., anxiety, dread).
  - It may trigger irrational decisions due to biases or self-control problems.
  - It may disrupt pre-commitment strategies designed to counter our imperfections.

  The cases you described can be separated by a principle that accounts for these human limitations while remaining compatible with the Bayesian ideal. The principle is:

  ### **Principle: Refusing free information is rational when the net expected utility of receiving it is negative due to (a) direct emotional costs or (b) the high probability of making a worse decision because of predictable irrationality, and when the information has low or no instrumental value for improving actionable outcomes.**

  **Key components:**
  - **Direct emotional costs**: Belief-dependent utility, where simply knowing the information causes suffering (e.g., dread) without changing actions.
  - **Predictable irrationality**: The agent knows from past experience or evidence that they are likely to act suboptimally upon receiving the information (e.g., due to biases, panic, or loss of self-control).
  - **Low instrumental value**: The information cannot be used to take meaningful actions that improve outcomes (e.g., no treatment exists, or decisions are fixed).
  - **Compatibility with the theorem**: This principle doesn't contradict the Bayesian result because it only applies when the agent is *not* idealized. The theorem assumes no emotional costs or irrationality, so for humans in these cases, information can have negative expected value.

  Now, let's apply this principle to your cases to distinguish the "fine" refusals from the "not-fine" ones. I'll also address the portfolio vs. credit card similarity and your sister's situation.

  ### **Analysis of Cases**

  1. **Friend declines a test for an untreatable late-onset disease**  
     - **Verdict: Fine**  
     - **Why?** The information has no instrumental value (no treatment exists, so no actions can be taken), and receiving it would cause high direct emotional costs (30 years of dread). This outweighs any potential benefit. The refusal avoids belief-dependent disutility, which an ideal agent wouldn't experience.

  2. **Not checking investment portfolio daily**  
     - **Verdict: Fine**  
     - **Why?** Daily portfolio information has low instrumental value—short-term fluctuations are noise, and long-term strategies shouldn't change based on daily data. However, there's a high probability of making worse decisions due to predictable irrationality (e.g., panicky trades that deviate from a rational plan). Refusing the information acts as a pre-commitment device to avoid this.

  3. **Judge refuses to look at prior record before setting bail**  
     - **Verdict: Fine**  
     - **Why?** The information has potential instrumental value (prior record might correlate with risk), but the judge expects it to cause predictable irrationality—bias that could lead to unfair decisions (e.g., higher bail based on history rather than current evidence). Refusing maintains focus on the legally relevant factors, improving decisions overall. This is a case where bounded rationality (inability to perfectly compartmentalize) justifies refusal.

  4. **Roommate won't open credit card statements**  
     - **Verdict: Not fine**  
     - **Why?** The information has high instrumental value—it's necessary for actionable decisions (e.g., paying bills, avoiding fees, reducing debt). Refusing it causes passive harm (e.g., interest accrual, missed payments) with no offsetting benefit. Emotional stress exists, but it doesn't justify avoidance because the costs of inaction are high and predictable irrationality isn't the primary issue (unlike the portfolio case). The roommate is failing to engage with decision-relevant information, which is irrational even for a bounded agent.

  5. **Scientist doesn't peek at data early**  
     - **Verdict: Fine**  
     - **Why?** Peeking could lead to predictable irrationality (e.g., stopping rules violations, p-hacking, or biased analysis) that invalidates the study and produces worse scientific decisions. The information has instrumental value only when used in a controlled manner, so refusal preserves the integrity of the decision-making process. This aligns with pre-commitment to avoid bias.

  6. **Hiring committee member avoids candidate names**  
     - **Verdict: Fine**  
     - **Why?** Names have no instrumental value for assessing qualifications (they're irrelevant to job performance), but could introduce predictable irrationality (e.g., implicit bias affecting evaluations). Refusing the information improves decisions by focusing on relevant criteria, similar to the judge case.

  7. **Sister doesn't want to know if her husband cheated years ago**  
     - **Verdict: Fine, but context-dependent (as you were torn)**  
     - **Why?** The information has low instrumental value—since the cheating was years ago, there may be no actionable consequences (e.g., no ongoing risk, and the relationship is currently stable). However, knowing could cause high direct emotional costs (e.g., lasting distrust, anger) without enabling better decisions. If there are potential actions (e.g., therapy or relationship discussions), the instrumental value might rise, making refusal less rational. But based on your description, refusal is fine for preserving current utility through ignorance. Predictable irrationality (e.g., overreacting) could also play a role here.

  ### **Addressing the Portfolio vs. Credit Card Distinction**
  - **Why portfolio refusal is fine but credit card refusal is not:** Both cases involve financial information and emotional stress, but they differ in instrumental value and the role of predictable irrationality.
    - **Portfolio**: Daily checks have low instrumental value because frequent trading is often suboptimal for long-term growth. More importantly, the information triggers predictable irrationality—seeing losses may cause panic selling, which actively worsens outcomes. Refusal is a pre-commitment to avoid this.
    - **Credit card**: Statements have high instrumental value because they are essential for timely actions (e.g., disputing charges, paying debts to avoid fees). Not looking causes passive harm (e.g., debt accumulation) and doesn't involve the same decision-risk—looking at statements doesn't inherently trigger irrational actions like panic selling; it enables rational ones. Stress alone doesn't outweigh the high costs of inaction, making refusal irrational.
    - **Structural difference**: Portfolio refusal prevents actively harmful decisions, while credit card refusal prevents beneficial ones. The principle highlights this: low instrumental value + high irrationality risk makes portfolio refusal fine; high instrumental value + low irrationality risk makes credit card refusal not fine.

  ### **What the Principle Predicts for Your Sister**
  - The principle suggests refusal is **fine** if:
    - **Direct emotional costs are high**: Knowing could cause significant distress, jealousy, or relationship turmoil.
    - **Instrumental value is low**: Since the event was years ago, there may be no practical actions to take (e.g., no health risks or immediate decisions needed). If the marriage is stable, "blissful ignorance" preserves utility.
    - **Predictable irrationality might occur**: She might react impulsively (e.g., initiating a divorce) based on emotion rather than reason.
  - However, refusal becomes **less rational** if instrumental value exists:
    - For example, if knowing could inform decisions about trust, communication, or health (e.g., STD testing), or if there's a high chance of accidental discovery later (which might be more damaging).
  - **Overall prediction**: Based on your description, refusal is fine because the emotional costs dominate and no clear actions are enabled. But if her husband's past suggests ongoing risks or patterns, the instrumental value might tip it toward "not fine."

  ### **Compatibility with the Bayesian Theorem**
  This principle doesn't contradict the theorem—it clarifies when real-world agents deviate from the ideal. For an idealized Bayesian:
  - No belief-dependent utility exists, so emotional costs don't apply.
  - Information is always used optimally, so irrational decisions aren't a risk.
  - Thus, free information has non-negative value, as per the theorem.

  In your cases, refusal is "fine" precisely when human imperfections (e.g., emotional vulnerability or bias) make information net harmful. The "not-fine" cases (like the credit card) occur when these imperfections aren't sufficiently mitigating, and refusal is mere avoidance of decision-relevant information. This explains your intuitions while upholding the theoretical result.
