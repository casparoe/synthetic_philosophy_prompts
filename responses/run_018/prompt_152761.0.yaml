  The user is frustrated that the debate seems stalled since Radford's 1975 essay. They wonder if there are actually three parallel arguments under the same heading. They also bring up neuroimaging as a possible empirical solution but question if that's the real issue. Another point is whether the impasse stems from differing intuitions about what constitutes a "real" emotion. They end by asking if the paradox is a problem for philosophy of mind or aesthetics and want a diagnosis rather than a verdict.

