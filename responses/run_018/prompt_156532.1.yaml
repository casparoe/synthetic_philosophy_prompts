prompt: |-
  ok so my roommate's writing her phil thesis on formal ethics and we got into it over dinner. she says gödel's first incompleteness theorem means any consistent ethical system strong enough to do arithmetic will contain moral statements it can't prove or disprove - so there's literally no complete moral code. i said that's a category error, gödel is about formal derivability in math languages, not about right and wrong. she answered that deontic logic can embed peano arithmetic, so if you formalize ethics rigorously the theorem bites anyway. then she said she's not pulling a penrose consciousness move - she's staying inside formal systems - but she added that AI alignment people worry about exactly this when they try to fully specify values. i said even if the formal system is incomplete, the 'undecidable' propositions are just arithmetic sentences wearing moral clothes, they don't tell us anything about real dilemmas like lying or harm. she said maybe, but then why does the analogy keep showing up in serious work? can you go through our exchange step by step and say who's right at each point? i'm especially curious whether there's a middle ground where gödel applies to formalized ethics but tells us nothing useful about actual moral reasoning. and please dont just say 'it depends' - i want to know which move is the weakest.
reasoning: |-
