  | Practice Element              | Apparent Presupposition                                      | Plausible Universalist Reconstruction                    | Views it Rules Out (if any)                           | Strictly Presupposed or Merely Compatible?              |
  | :---------------------------- | :----------------------------------------------------------- | :------------------------------------------------------- | :---------------------------------------------------- | :------------------------------------------------------ |
  | **Franchise Restricted to Citizens** | Citizenship status, not residence/contribution/coercion, is the necessary condition for full political membership and voice. | **Division of Labor:** Practical necessity for stable self-government within an administrative unit. **Coercion Compensation:** Only citizens bear the *full* burden/responsibility of sustaining the coercive state (strained). | **Strictly Rules Out:** Pure Coercion-Based Accounts (if coercion grounds voting rights, fully coerced residents must be included). **Strongly Contradicts:** Thoroughgoing Cosmopolitanism. | **Strictly Presupposes:** Citizenship status is core. **Compatible with:** Division of Labor (if exclusion deemed practically essential). |
  | **Preferential Social Benefits for Compatriots** | Distributive obligations are inherently stronger towards fellow citizens, creating a bounded community of justice. | **Division of Labor:** States are designated primary providers for residents; prioritization ensures effective fulfillment of core duties. **Coercion Compensation:** Benefits compensate citizens for unique burdens of citizenship (taxes, service). | **Strictly Rules Out:** Thoroughgoing Cosmopolitanism (violates equal consideration/distribution based on need regardless of nationality). | **Strongly Suggests:** Nationality-Based Partialism / Associative Duties. **Compatible (though strained) with:** Division of Labor. |
  | **Right to Control Immigration** | The state primarily exists for the benefit of its pre-existing citizenry; their interests can legitimately override the claims of non-members to enter/join. | **Division of Labor:** Necessary to manage flows, ensure domestic institutions function effectively, and fulfill primary obligations to residents. **Universalist Capacity:** States may limit entry based on resource/capacity constraints to fulfill duties to existing residents and contribute globally. | **Does Not Strictly Rule Out Any Single View** (all views can generate reasons for *some* control). **Strongly Contradicts:** Cosmopolitanism if interpreted as absolute sovereign right to exclude regardless of circumstance/need. | **Highly Underdetermined.** Compatible with Associative Duties, Division of Labor, and modified Universalism (capacity). Strongly suggests bounded community but justification varies. |
  | **Ratifying Universal Human Rights / Condemning Domestic Discrimination** | Affirmation of the equal moral worth of all persons. Commitment to non-discrimination *within* the political community. | Genuine commitment to universal moral principles.         | **Rules Out:** Explicit ethical theories denying basic human equality. | Stands in **Tension** with Preferential Benefits & Franchise Restrictions regarding non-citizens. |
