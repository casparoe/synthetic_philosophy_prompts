answer: |-
  ## The Citizenship Paradox: Special Obligations in Modern State Practice

  Modern states exhibit a striking tension: they ratify universal human rights instruments affirming the equal moral worth of all persons and prohibit discrimination among citizens, yet simultaneously restrict core political rights (like voting) to citizens, allocate social benefits preferentially to compatriots, and assert absolute control over immigration. This cluster of practices presupposes a robust account of special obligations arising specifically from shared citizenship, but its justification remains contested and potentially inconsistent.

  **Presupposed Account of Special Obligations: Associative Duties of Citizenship**
  The practices collectively signal that states presuppose **shared citizenship itself as the primary ground for special obligations**. Denying the franchise to long-term resident non-citizens, despite their deep societal integration and contribution (taxation, subjection to law), implies that the formal status of citizenship, not mere presence or contribution, is the essential trigger for full political inclusion and its associated duties of representation. Preferential allocation of social benefits (welfare, healthcare, education) to compatriots, often regardless of individual need relative to non-citizens, presupposes a distributive principle prioritizing the "national community" based on membership. Immigration control, the ultimate expression of boundary maintenance, reinforces the idea that the state exists primarily for the benefit of a predefined group (citizens), whose interests can legitimately outweigh the claims of outsiders, even those in dire need. This points strongly towards **nationality-based partialism** or **associative duties**: obligations arising intrinsically from the relationship and shared institutions of citizenship within a bounded political community.

  **Universalist Reconstructions: Plausible but Straining**
  Could these practices be reconstructed on universalist grounds?
  1.  **Division of Moral Labor:** States could be seen as administrative units efficiently discharging universal duties. Voting rights are restricted to citizens as a practical necessity for stable self-government within a defined unit. Benefit allocation prioritizes compatriots because states are the designated (and most effective) providers for those within their jurisdiction. Immigration control manages flows to ensure domestic institutions can function and fulfill their primary universal obligations to residents. However, this struggles to justify the *absolute exclusion* of long-term residents from voting or the often *zero-sum* prioritization in welfare that ignores acute suffering abroad.
  2.  **Compensation for Coercion:** States uniquely coerce their subjects (laws, enforcement). Granting voting rights exclusively to citizens could be seen as giving the coerced a voice in the coercive regime. Preferential benefits might compensate citizens for bearing the burdens of sustaining the coercive state apparatus (e.g., military service, tax compliance). Yet, this fails significantly for non-citizen residents: they are coerced equally (subject to laws, pay taxes) yet denied the franchise and often full benefits, undermining the "compensation" logic. It also poorly explains prioritizing citizens living abroad (not currently coerced) over coerced non-citizen residents.

  **Ruling Out Rival Views and Underdetermination**
  *   **Thoroughgoing Cosmopolitanism (equal consideration regardless of nationality):** Strictly ruled out by **preferential social benefits** and **immigration control**. Prioritizing citizens over non-citizens in welfare inherently violates equal consideration. Asserting an absolute right to exclude based on nationality contradicts the cosmopolitan rejection of nationality as a morally relevant barrier.
  *   **Pure Nationality-Based Partialism:** While strongly suggested, no single practice *strictly* rules out universalist reconstructions. The **franchise restriction** comes closest, as universalist accounts struggle to justify permanent exclusion of fully integrated residents. However, a state *could* theoretically argue (however implausibly) this is a temporary administrative necessity under a division of labor view.
  *   **Coercion-Based Accounts:** **Franchise restriction** strictly rules out a *pure* coercion-based view. If coercion grounds special obligations (like voting rights), then long-term resident non-citizens, subject to equal coercion, must be included. Their systematic exclusion demonstrates that citizenship status, not coercion alone, is the decisive factor.

  **Underdetermination:** The practices are most compatible with, and strongly point towards, associative duty/nationality-based partialism. However, the **division of labor** view remains *compatible* (though strained) with all practices if one accepts pragmatic justifications for exclusion and prioritization. The **immigration control** practice is particularly underdetermined, as states often justify it using a mix of arguments (sovereignty, cultural preservation, economic protection, security) that could be framed within associative, division of labor, or even modified universalist perspectives (e.g., capacity constraints).

  **Internal Consistency?**
  The practices reveal **significant tension**, particularly between **preferential social benefits** and the state's **universal human rights commitments/anti-discrimination norms**. Affirming the equal moral worth of *all* persons while systematically prioritizing citizens in the distribution of essential goods like healthcare or social security creates a stark inconsistency. It suggests a hierarchy of moral worth based on nationality, despite official pronouncements to the contrary. The **franchise restriction** for integrated residents also sits uneasily with anti-discrimination principles applied internally. While **immigration control** might be more defensibly reconciled with universalism through capacity arguments, the *absolute* nature of state discretion often asserted clashes with human rights obligations towards refugees and migrants.

  **Replacing the Presupposed Account: Implications**
  If the presupposed associative duty account were replaced:
  1.  **With Thoroughgoing Cosmopolitanism:** States would need to abolish citizenship-based distinctions in voting (granting votes to resident non-citizens), radically restructure social welfare to prioritize global need over nationality (e.g., significant foreign aid obligations), and significantly constrain immigration control (e.g., open borders or strong individual rights to migrate based on need/opportunity). National sovereignty as currently understood would dissolve.
  2.  **With a Coercion-Based Account:** Voting rights would extend to *all* subject to the state's coercive power (i.e., all residents). Social benefits might prioritize residents over non-resident citizens. Immigration control might focus more on managing the *coercive impact* of influxes rather than exclusion per se. Distinctions based purely on citizenship status would lose their moral foundation.
  3.  **With a Strong Division of Labor View:** Practices might remain similar but require stronger justification focused on *effectiveness* in discharging universal duties. Exclusion from voting would need proof it's essential for stable governance; benefit prioritization would require demonstrating it's the most efficient way to fulfill duties to residents *and* contribute globally; immigration control would need to focus demonstrably on capacity management rather than exclusion based on nationality. Accountability for global duties would increase.

  **Conclusion**
  Modern state practice fundamentally presupposes that shared citizenship grounds special associative duties, creating a bounded community entitled to priority in political rights, distributive justice, and protection. While universalist reconstructions (division of labor, coercion) offer competing explanations, they struggle with core elements like the exclusion of integrated residents from voting and the zero-sum nature of welfare chauvinism. The practices strictly rule out thoroughgoing cosmopolitanism and pure coercion-based accounts regarding voting rights, but remain somewhat underdetermined, especially concerning immigration. The most profound inconsistency lies between the universalist rhetoric of human rights and the particularist practice of preferential benefit allocation. Replacing the associative duty foundation would necessitate transformative changes to the core institutions of the nation-state as we know it.

