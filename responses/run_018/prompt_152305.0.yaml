prompt: |-
  Im giving the opening remarks at a workshop on democratic precommitment next week — about half constitutional lawyers, half people from totally other fields, and my sister who just happens to be in town. The idea suddenly feels personal: I signed an advance directive last month after watching my dad tear up his own in the ICU once he was scared, and now I see it as the same move as a constitution tying the hands of a future legislature. I want the remarks to turn on that parallel — personal Ulysses contracts vs constitutional ones — but not lecture anyone. The lawyers will know the standard problem (binding future generations kills democratic legitimacy) but I want the rest of the room to understand why you'd risk that anyway. There's a specific tension I want held: can an institution bind itself without destroying the authority it needs to govern? I also want you to inject something slightly off the beaten path — maybe the idea that constitutional precommitment works best not when it blocks future choices but when it forces future actors to deliberate in a specific procedural frame (like entrenching deliberation rather than outcomes). Don't quote anyone verbatim, no citations needed, and please say what argument or distinction would make you drop the analogy between personal and constitutional binding — like where the reasoning is shakiest. Oh and I write quick so a typo or two is totally fine, dont worry about cleaning this up.
