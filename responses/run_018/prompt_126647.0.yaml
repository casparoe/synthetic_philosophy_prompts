  ## Villanelle for the Uncompromising Art

  You claim my craft distorts a purer view,
  That beauty shuns the urgent protest cry.
  **Truth shapes the vessel, and the vessel, true.**

  Your "art for art's sake"—ivory tower, skewed—
  Ignores the world where silenced voices die.
  You claim my craft distorts a purer view.

  Should grace adorn the lie that brands us crude?
  Or polish shadows where the lash drew nigh?
  **Truth shapes the vessel, and the vessel, true.**

  A flawless surface, passively pursued,
  That hides the bruise, accepts the stifled sigh,
  You claim my craft distorts a purer view.

  But beauty built on silence is pursued
  By deeper stains—complicity’s close tie.
  **Truth shapes the vessel, and the vessel, true.**

  This form demands the skill I must include,
  Not pamphleteering shouted to the sky.
  You claim my craft distorts a purer view,
  **Truth shapes the vessel, and the vessel, true—**
  **That beauty hides its protest is a lie.**
