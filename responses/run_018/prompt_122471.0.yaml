  ### Decision Tree: Grounding and Fundamentality  
  *Use this self-sorting instrument to identify your position. Answer each numbered question based on concrete cases or claims, not abstract labels. Follow your answers to a leaf position.*

  **Node 1: The Table and Particles**  
  Consider a table and the particles arranged tablewise. Which claim aligns with your view?  
  (A) The table is grounded in the particles arranged tablewise.  
  (B) The table is identical to the particles arranged tablewise.  
  (C) The table and the particles are both grounded in the whole cosmos.  

  **Node 2: Mental Fact with Multiple Neural Grounds**  
  (If you chose A at Node 1) Consider a mental fact (e.g., "I am in pain") that can be fully grounded by either of two independent neural states (N1 or N2). Which is correct?  
  (A) There are distinct grounding relations for each neural state (e.g., metaphysical for N1, natural for N2).  
  (B) A single grounding relation holds between the mental fact and whichever neural state is present.  
  (C) Grounding is not a relation; it is a sentential operator (e.g., "I am in pain because N1 occurs" is explanatory but not relational).  

  **Node 3: The Singleton and Its Member**  
  (If you chose A or B at Node 2, or C at Node 1) Consider the singleton set {Socrates} and Socrates. Which holds?  
  (A) The singleton is grounded in Socrates.  
  (B) Socrates is grounded in the singleton.  
  (C) Neither grounds the other; they are interdependent or both grounded in something else.  

  **Node 4: True Disjunction and Disjunct**  
  (For all paths) Consider a true disjunction, "P ∨ Q," where P is true and Q is false. Which is correct?  
  (A) The disjunction is fully grounded in the true disjunct (P).  
  (B) The disjunction is not grounded in P; it is fundamental or grounded in a general truth (e.g., "P is true").  
  (C) The disjunction is explained by P, but this is logical, not metaphysical grounding.  

  **Node 5: Laws and the Humean Mosaic**  
  (For all paths) Consider the laws of nature and the total distribution of particular matters of fact (Humean mosaic). Which holds?  
  (A) The laws are grounded in the mosaic.  
  (B) The mosaic is grounded in the laws.  
  (C) Neither grounds the other; they are interdependent or both grounded in something else.  

  **Node 6: Grounding Holes**  
  (For all paths) Could a fact be intuitively derivative yet have no ground (e.g., a "brute" emergent fact with no explanation)?  
  (A) Yes, grounding holes are possible.  
  (B) No; if a fact has no ground, it is fundamental.  

  **Node 7: Symmetric Overdetermination**  
  (For all paths) Could a fact have multiple independent full grounds at once (e.g., a mental fact symmetrically overdetermined by two neural states)?  
  (A) Yes, symmetric overdetermination is possible.  
  (B) No; multiple grounds must collectively ground the fact in a new way, or one is not a full ground.  

  **Node 8: Grounding Chains**  
  (For all paths) Consider a grounding chain (fact A grounded in B, B in C, etc.). Which is conceivable?  
  (A) Chains must terminate in an ungrounded fact.  
  (B) Infinite descent is possible (no termination).  
  (C) Chains need not terminate, but for any candidate "fundamental" base, there is a wider base grounding it (fundamentality under erasure).  

