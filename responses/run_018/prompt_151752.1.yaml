es the explanatory ambitions of macrohistory. The tone should be formal, appropriate for being read aloud to an academic audience, approximately 450 to 600 words. Do not include bibliographies, reading lists, or citations; do not invoke specific named theorists in ways that would require precise attribution; and do not resolve the tension with a synthetic conclusion—leave the workshop's purpose intact.
