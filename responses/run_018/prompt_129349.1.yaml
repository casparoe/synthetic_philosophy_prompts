  Constitution theory maps better to emergent phases. The phonon analogy feels apt: collective excitations aren't reducible to atoms but don't exist independently either. Yet artistic form as symmetry-breaking is tricky - aesthetic properties don't emerge like crystal structures do. That's a point where physics vocabulary strains.

  Eliminativism aligns with renormalization group thinking, where coarse-graining ignores irrelevant microscopic details. But this can't capture why we intuitively distinguish statue from clay after creation. The residue here shows physics can't replicate our folk ontology.

  The residue analysis will be crucial. Persistence conditions vanishing entirely suggests a hard limitation: physics describes state changes while metaphysics deals with object survival. Modal properties become boundary-dependent in translation, which feels like fudging since possible worlds aren't lab-testable. 

