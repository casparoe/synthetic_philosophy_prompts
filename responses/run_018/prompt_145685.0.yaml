answer: |-
  Based on your friend's four verdicts and her mention of "form vs matter," I'll break this down step by step. Her positions suggest she's intuitively applying a specific philosophical principle (likely inspired by Aristotle, though she might not realize it). I'll reconstruct her implicit rule, propose another rule that also fits her verdicts, and then apply both to your new scenarios (a, b, c) to see which one best "splits" them (i.e., where the rules disagree). Finally, I'll explain why her form-vs-matter comment isn't just winging it—it's central to her thinking.

  ### Step 1: Figuring Out Your Friend's Rule
  Her verdicts boil down to this:
  - **Gradual replacement over years? Still the ship.** → Continuity matters more than material.
  - **Old planks rebuilt elsewhere? Not original.** → Material alone isn't enough; reassembly breaks something.
  - **Sank, 90% salvaged, rebuilt? Still it.** → Location and "most" material preserve identity despite disruption.
  - **3D-printed copy? Different.** → Exact form isn't enough; no connection to the original's history.

  Her implicit rule seems to be about **continuous existence of form**:  
  *"The ship remains the same if its functional form (its structure, purpose, and 'being a ship') persists through a continuous, unbroken existence in time and space. Matter is replaceable, but any total disassembly, replication, or relocation that interrupts this continuity destroys identity."*

  - **Why this fits her verdicts:**  
    - Gradual replacement keeps the form intact and continuous—it's always "the ship" even as planks change.  
    - Rebuilding elsewhere uses original matter but breaks continuity (it was disassembled, then reassembled as a new instance).  
    - Salvaging 90% and rebuilding on-site maintains continuity through the narrative ("it was saved and restored here").  
    - A 3D copy duplicates form but lacks any historical or causal link—it's a new object.  
  - **Form vs matter?** She's not winging it—this is classic Aristotle. "Form" is the essential structure/function (e.g., "ship-ness"), while "matter" is the physical stuff. Her rule prioritizes form's persistence over matter. If the form exists continuously, identity holds; if the form is disrupted (e.g., disassembled into planks), it's gone even if matter is preserved.

  ### Step 2: Another Rule That Fits Her Verdicts
  Her four verdicts don't lock her into one rule—multiple philosophical principles could explain them. A strong alternative is **causal-historical continuity**:  
  *"The ship remains the same if there's an unbroken causal chain linking it to the original. Identity depends on historical continuity (how the object came to be), not just matter or form. Disruptions like disassembly or replication break this chain."*

  - **Why this also fits her verdicts:**  
    - Gradual replacement: Each change is causally linked to the prior state (e.g., replacing one plank at a time preserves the chain).  
    - Rebuilt elsewhere: Disassembly severs the causal chain; reassembly starts a new history.  
    - Salvaged and rebuilt: The salvage operation extends the causal chain (e.g., "we recovered it and rebuilt it"), so history continues.  
    - 3D copy: No causal link to the original—it's a new artifact with its own origin story.  

  Both rules explain her verdicts, but they emphasize different things:
  - **Her rule** is about *being* the same ship through time (form-based continuity).  
  - **Alternative rule** is about *originating* from the same source (history-based causality).  

  In practice, they often align—but not always, as we'll see with your scenarios.

  ### Step 3: Applying the Rules to Scenarios A, B, and C
  Here's what your friend would likely say based on her rule, plus how the alternative rule differs. I'll include reasoning for each.

  - **Scenario A (Sudden replacement with synthetic sensor-planks in drydock):**  
    - **Her verdict (form-based continuity): NOT the original.**  
      Why? Sudden total replacement breaks continuous existence. Even in the same drydock, swapping all planks at once is like disassembly—it destroys the functional form temporarily. The sensors logging history don't fix this; they're just data, not continuity. (Compare to her verdict #2: reassembly elsewhere isn't original, even with all original matter. Here, it's reassembly in-place with new matter—same issue.)  
    - **Alternative rule (causal-historical continuity): IT IS the original.**  
      Why? The replacement is a direct modification of the existing ship, so the causal chain isn't broken. The sensors even reinforce the history. It's like repairing the ship in one event—still causally linked to the original.  
    - **Split potential:** Strong. Her rule says "no," alternative says "yes."

  - **Scenario B (Ground into mulch, trees grow, carved into same shape):**  
    - **Her verdict (form-based continuity): NOT the original.**  
      Why? Grinding the ship destroys its form completely—it's no longer a ship, just mulch. Growing trees and re-carving creates a new form with no continuity to the original. Matter is reused, but the functional existence was interrupted. (Similar to her verdict #4: replication isn't identity, even with original atoms.)  
    - **Alternative rule (causal-historical continuity): NOT the original.**  
      Why? The causal chain is broken when the ship is mulched. Trees growing is a new biological process, and carving is a new act of creation—no unbroken link to the ship's history.  
    - **Split potential:** Weak. Both rules agree it's not the same.

  - **Scenario C (Quantum-entangled duplicate):**  
    - **Her verdict (form-based continuity): NOT the original.**  
      Why? Entanglement doesn't preserve continuous existence—it's still a copy created elsewhere. The original form was never "present" in the duplicate; it's a new instance. (Like her verdict #4, exact form isn't enough without continuity.)  
    - **Alternative rule (causal-historical continuity): NOT the original.**  
      Why? The duplicate is causally separate; entanglement is a physical phenomenon, not a historical link. Scanning and printing starts a new causal chain.  
    - **Split potential:** Weak. Both rules agree it's not the same.

  ### Step 4: Which Scenario Best Splits the Rules?
  - **A (sudden sensor-plank replacement) is the best splitter.**  
    Why? Her rule rejects it (disassembly breaks form continuity), while the alternative rule accepts it (causal history continues). This highlights the core difference: her rule cares about *how* changes happen (gradual vs. sudden), while the alternative cares about *whether the object's story continues* regardless of method.  
  - B and C don't split well—both rules agree they're not the original because both involve total destruction/replication, breaking continuity and causality.

  **Splitting Recap:**  
  - **Her rule:** A = ❌ (not original), B = ❌, C = ❌  
  - **Alternative rule:** A = ✅ (original), B = ❌, C = ❌  
  Only A gets conflicting verdicts, making it the best test case for exposing her underlying logic.

  ### Key Takeaway
  Your friend's rule is all about the ship's *lifespan*—if its "ship-ness" exists unbroken, it's the same. The alternative focuses on its *biography*—if its story never ends, it's the same. Drunken debates aside, her form-vs-matter point is legit: it's why she dismisses matter-focused arguments (e.g., "but it's the same wood!") and cares about process. If you want to challenge her, scenario A is your best weapon—ask why sudden replacement isn't like her salvage verdict (both involve disruption and rebuilding). It might reveal if she truly values form or just hates abrupt change!
