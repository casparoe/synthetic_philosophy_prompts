  The self-refutation worry is understandable but avoidable. Global coordinates are necessary mathematical tools that reveal their own limitations - like using a ruler to measure a sphere and discovering it can't lay flat. That's not contradiction; it's epistemic humility. 

  Where I'd push them: clarify how local time "stays intact." They need to address why CTCs don't violate local causality (answer: because the curve isn't timelike everywhere locally). Also, emphasize that Gödel himself connected this to relativity of simultaneity in his papers. 

