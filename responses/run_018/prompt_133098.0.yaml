answer: |-
  ## The Nyāya Framework's Resilience Against Scientific Scrutiny

  The Nyāya four-fold *pramāṇa* scheme demonstrably withstands the epistemic challenges of modern science without collapsing categories or demanding novel additions. Instrument-mediated cognition is rightly subsumed under *pratyakṣa* (perception), while peer-reviewed consensus remains firmly within the domain of *śabda* (testimony). To argue otherwise misunderstands Nyāya's nuanced realism.

  Scientific instruments—telescopes, microscopes, particle detectors—are *unquestionably* extensions of sensory capacity. Nyāya explicitly acknowledges that valid perception (*laukika pratyakṣa*) can occur via sense organs aided by external enhancers (like corrective lenses). The instrument itself is merely a sophisticated tool refining, amplifying, or transducing environmental inputs *for the senses*. The resulting cognition remains *perceptual*: it directly presents an object to the perceiver, albeit mediated. Crucially, this mediation does not introduce a distinct epistemic *process*; it remains causal contact (*sannikarṣa*) between object and sense organ, albeit facilitated. The *interpretation* of the percept (e.g., identifying a redshift) involves *anumāna* (inference), but the initial sensory registration of the data (the light pattern) is pure *pratyakṣa*. Insisting on a hybrid category is unnecessary and violates Nyāya's principle of parsimonious irreducibility.

  Similarly, scientific peer review does not reduce *śabda* to mere sociology; it *perfects* it according to Nyāya's own criteria. *Śabda* depends crucially on the *reliability (āpta)* of the speaker and the *absence of defects* in the communication. Peer review is the rigorous, institutionalised process for *establishing* this reliability for scientific claims. It filters out unreliable testimony through collective scrutiny, replication (a form of verification leaning on *pratyakṣa* and *anumāna*), and methodological critique. The resulting consensus represents *testimony* deemed trustworthy by qualified experts (*āptas*) based on evidence. While the *source* is now communal and fallible (unlike infallible Vedic *śabda*), the *epistemic mechanism* remains identical: valid cognition arising from understanding reliable verbal propositions. This is *śabda* rigorously socialised, not abolished.

  Therefore, the Nyāya framework is remarkably adaptable. Scientific instruments enhance *pratyakṣa* without transcending it, and peer review refines *śabda* by operationalising its core requirement of speaker reliability. No fifth *pramāṇa* is required. The categories hold firm, demonstrating Nyāya's enduring power to coherently classify knowledge acquisition, even within the sophisticated methodology of modern science. Its realism and pragmatism triumph.
