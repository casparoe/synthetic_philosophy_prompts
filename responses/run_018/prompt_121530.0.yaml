answer: |-
  Here is the specification of six desiderata for a decision rule handling tiny-probability, enormous-payoff gambles:

  | Desideratum (One Sentence)                                                                 | Motivating Case (≤3 Sentences)                                                                                                                                                                  | Status & Reason                                                                 |
  | :------------------------------------------------------------------------------------------ | :----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------ |
  | **1. Mugger-Immunity:** The rule must not compel acceptance of arbitrarily constructed "mugger" offers demanding finite resources in exchange for preventing arbitrarily large claimed harms based on arbitrarily tiny claimed probabilities. | A stranger threatens to cause 10^100 units of suffering unless given $5. A rule lacking this fails if it accepts, as adversaries can fabricate infinite such demands, bankrupting the agent for no expected benefit. | **Non-negotiable.** Prevents trivial exploitation and resource exhaustion.      |
  | **2. Aggregation-Respect:** The rule must assign significant weight to interventions addressing a vast number of independent, identical, tiny-probability threats compared to intervening on a single instance. | Averting one person's independent 10^-6 risk of death for $X is less urgent than averting that same risk for a billion people for $X billion. Rules collapsing these treat diffuse catastrophes as negligibly as single misfortunes. | **Non-negotiable.** Reflects the moral and empirical reality of aggregate risk. |
  | **3. Partition-Invariance:** The rule's output must be invariant under causally irrelevant re-descriptions or re-graining of the outcome space or hypothesis space. | Splitting "aliens cause disaster" into "green aliens cause disaster" and "purple aliens cause disaster" (each half prior prob) shouldn't change choices. Rules sensitive to this can be gamed by recasting hypotheses. | **Non-negotiable.** Prevents arbitrariness and description-manipulation.        |
  | **4. Adversarial-Robustness:** The rule must not incentivize adversaries to create proliferating, mutually exclusive "mugger" options to drain resources. | If paying any one of 1000 strangers $5 "prevents" 10^100 suffering (claims mutually exclusive), a rule paying all is bankrupted; paying none ignores potential real aggregated small risks. Rules must navigate this strategically. | **Negotiable.** Implementation details may vary, but core robustness is essential. |
  | **5. Graceful-Degradation:** The rule must output continuous, bounded resource allocations sensitive to input magnitudes, avoiding discontinuous "flips" or unbounded commitments under small input changes. | If estimated probability shifts smoothly from 10^-9 to 10^-8, the budget allocated shouldn't jump from $0 to $1M. Rules flipping abruptly are unstable and untrustworthy for close calls. | **Negotiable.** Specific functional form can be debated, but instability is fatal. |
  | **6. Symmetry-of-Extremes:** The rule must handle tiny probabilities of enormous harms symmetrically with tiny probabilities of enormous goods of equivalent magnitude, absent relevant moral asymmetries like risk aversion. | Paying $5 to prevent 10^N suffering claimed by Stranger 1 should be treated like paying $5 to cause 10^N suffering (by Stranger 2) if prevented. Asymmetry requires justification beyond size/probability structure. | **Negotiable.** Moral asymmetries exist, but the default should be structural symmetry. |

  **Briefly:**

  1.  **Conflict:** The tension lies between **Mugger-Immunity** (reject $5-for-10^N deals), **Aggregation-Respect** (act on 10^9 x 10^-9 risks), and **Partition-Invariance** (no threshold-by-description). Mugger-Immunity resists single huge claims; Aggregation-Respect demands acting on equivalent aggregate probabilities; Partition-Invariance blocks resolving this by defining "mugger" via arbitrary priors or outcome-splitting. **I would drop strict Partition-Invariance as applied to unbounded hypothesis spaces.** This loses theoretical purity against description-manipulation but might allow rules using structured priors that naturally downweight "mugger-like" claims while respecting aggregated evidence.
  2.  **Key Excluder:** **Partition-Invariance** does the most work. It knocks out rules using fixed probability thresholds (e.g., ignore p < 10^-K) or "clumping" priors that arbitrarily group hypotheses. It allows rules using bounded utility functions (e.g., U(outcome) = log(outcome)) or normalized probabilities (e.g., leveraging complexity-based or reference class priors).
  3.  **Renegotiation:** A defender of threshold rules would reject **Partition-Invariance** most strongly: "It's a disguised demand for expected value maximization over an ill-defined space. Real agents *must* use tractable models that inherently group or discard hypotheses based on plausibility, not mathematical equivalence under splitting."

  **Optional Scorecard for Log-Utility Rule:**
  *   **Strengths:** Achieves Mugger-Immunity and Graceful Degradation naturally via diminishing returns; often satisfies Partition-Invariance for well-defined spaces.
  *   **Weaknesses:** Struggles with Adversarial-Robustness (many small offers might still drain resources); Aggregation-Respect depends heavily on the utility function's curvature and prior calibration; Symmetry holds structurally.
