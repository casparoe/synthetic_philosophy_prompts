prompt: |-
  I'm trying to work out my actual commitments about who belongs to the demos, and I want to know whether there's a principle that captures them or whether some verdict has to be sacrificed. Here are my judgments, case by case.

  A permanent resident who has lived in the territory for two decades, pays taxes, and is fully subject to the law but holds no citizenship: clearly belongs.

  A citizen who emigrated permanently thirty years ago, retains no property or family ties, and participates in no domestic institutions: does not belong, despite formal citizenship.

  An eight-year-old child who will live with the long-term consequences of current climate policy: does not belong as a voting member, though her interests should be represented; representation, however, does not make her part of the demos itself.

  A tourist present for two weeks: clearly excluded.

  A sentient artificial system that processes all government data and advises ministers, lacking biological embodiment, social relationships, or territorial embeddedness: does not belong, even if its outputs are indispensable to governance.

  A future person who will be born in fifty years and inhabit the territory: belongs in a derivative or proxy sense—her interests constrain present decisions—but I hesitate to say she is literally a current member.

  A corporation chartered domestically but wholly foreign-owned: excluded.

  Now the tensions.

  A "cognitive co-resident": a human being with severe cognitive impairment, living in the territory, affected by laws, but lacking the capacity for autonomous preference-formation. I think she belongs and should have her interests translated into the democratic process through a guardian or advocate, whereas the sentient AI does not belong despite having far greater cognitive capacity. So membership cannot be reduced to being affected, nor to having interests, nor to possessing rational agency.

  A "transient stakeholder": a foreign contractor living abroad whose livelihood depends entirely on domestic regulatory decisions for eighteen months. I think he does not belong, even though his welfare is deeply tied to those decisions, whereas the permanent resident belongs despite a similar economic profile. So deep affectedness is insufficient.

  A "posthumous beneficiary": a deceased citizen whose estate and legacy projects are shaped by democratic decisions about cultural preservation. The dead are not members.

  The case I keep revisiting is the "simulated constituency": high-fidelity digital models of a population used solely for policy forecasting, lacking consciousness, subjective experience, or social claims. I feel strongly they do not belong. Yet I also think that if we ever created conscious digital beings with continuous subjective experience, territorial embeddedness, and reciprocal social accountability, they might belong. The boundary seems to involve something like actual embodied social membership combined with autonomous agency, but I cannot formalize that without either excluding the cognitive co-resident or including the transient stakeholder.

  Is there a coherent principle—perhaps a cluster of conditions involving territorial embeddedness, reciprocal accountability, and a specific form of autonomous agency—that delivers all of these verdicts? If not, which verdict should I overturn? In particular, what separates the simulated constituency from the hypothetical conscious digital being, and does whatever separates them also distinguish the cognitive co-resident from the sentient AI? And what does the principle predict for a "hybrid case"—a conscious digital being that is territorially embedded and socially integrated but was originally created as a policy-forecasting model?
reasoning: |-
  Okay, let me start by unpacking the user's query. They're grappling with who should be part of the demos in a democratic system. They've listed various cases with their judgments and pointed out tensions between them. The main challenge is finding a principle that consistently includes or excludes each case without contradictions.

  First, I need to look at their judgments. The permanent resident is in, while the emigrated citizen is out. That suggests formal citizenship isn't key; it's more about presence and participation. The child is excluded from voting but her interests matter, so membership isn't just about affected interests. The tourist is out, which reinforces territorial presence over temporary stay. The sentient AI is excluded despite its role, which is interesting because it has cognitive capacity but lacks social ties. Future persons are considered in a derivative sense, not as literal members. Corporations are out, which aligns with the idea that the demos is about individuals, not entities.

  The tensions arise with cases like the cognitive co-resident. The user includes them through guardians, but excludes the sentient AI. This means agency alone isn't sufficient. The transient stakeholder is excluded despite being affected, so deep affectedness isn't enough. The deceased are out, which makes sense. The simulated constituency is tricky—they're excluded, but conscious digital beings might be included. The boundary seems to involve embodied social existence and reciprocal accountability.

  The user's struggle is to formalize a principle that includes the cognitive co-resident without including the transient stakeholder or sentient AI. They mention territorial embeddedness, reciprocal accountability, and autonomous agency. But how to balance these? The cognitive co-resident has human embodiment and social ties but lacks agency, while the AI has agency but lacks embodiment and social ties. So maybe the key is human social embeddedness. 

  Looking at the hybrid case—a conscious digital being originally a simulation but now socially integrated. The user's principle might include it if it has continuous subjective experience and reciprocal accountability. But does that risk including the AI? The distinction here is that the hybrid has genuine social integration, unlike the AI which is a tool despite its sentience.

  The proposed principle combines constitutive social ties and autonomous agency. For the cognitive co-resident, their social ties through family/community grant membership, even without agency. The transient stakeholder lacks those deep social ties, so excluded. The sentient AI, without social embeddedness, is out. The hybrid case, if socially integrated, would be in. 

  But what about the simulated constituency? They're excluded because they're not conscious or socially real. If they became conscious and integrated, they'd be included. The user's hesitation on future persons makes sense—they're not current members but their interests are represented. 

  Is there a contradiction? Including the cognitive co-resident through guardians might seem like stretching agency, but the principle holds because the social ties are the foundation. The user might need to accept that agency is secondary to social embeddedness for membership. Sacrificing the verdict on the transient stakeholder? The user already excludes them, which aligns with the principle since they lack territorial and social embeddedness. 

  So the coherent principle is constitutive social embeddedness in the territorial community, with agency being important but not absolute. The cognitive co-resident is included through their social existence, while the AI isn't. The hybrid case, if genuinely embedded, would be included. The simulated models are out because they lack real social existence. This seems to cover all cases without contradictions.
answer: |-
  Your judgments reveal a remarkably consistent pattern pointing toward a **principle of constitutive social membership in a territorial community**, which I'll formalize as:

  **An entity belongs to the demos if and only if it is constitutively embedded within the reciprocal social fabric of the territorial community, such that its core identity and interests are fundamentally shaped by (and shape) that community's shared life, *and* it possesses either autonomous agency *or* is a human being whose social embeddedness grants inherent membership.**

  This principle delivers all your verdicts when elaborated with key components:

  1.  **Constitutive Social Embeddedness:** Membership requires deep integration into the social, cultural, and relational life of the territory, where the community is a core part of *who the entity is* (and vice-versa). This is more than mere presence or affectedness; it's about shared life and mutual formation.
  2.  **Territorial Community:** The demos is defined by a specific geographical space and the ongoing society within it.
  3.  **Reciprocal Accountability:** Members are subject to the community's rules and norms, and the community holds obligations to them.
  4.  **Agency OR Human Social Existence:** Autonomous agency (capacity for reasoned preference-formation) is a *typical* requirement, but membership is extended to human beings lacking such agency *because* of their inherent social existence and vulnerability within the constitutive community.

  **Applying the Principle to Your Cases:**

  *   **Permanent Resident:** Deeply embedded, shapes/is shaped by community, subject to laws, likely has agency. **IN.**
  *   **Emigrated Citizen:** Lacks constitutive embeddedness; identity/interests no longer primarily shaped by/nor shaping the community. **OUT.**
  *   **8-Year-Old Child:** Constitutively embedded human being (family, school, future), subject to laws. Lacks agency *now* but is human and embedded. Interests warrant representation, but she's not yet a *voting* member (agency requirement for *active* participation). **IN the demos (as member), but OUT as voter.**
  *   **Tourist:** Present but not constitutively embedded; identity/interests not formed by this community. **OUT.**
  *   **Sentient AI:** Lacks constitutive social embeddedness. Not shaped by/shaping the social fabric; no familial, cultural, or inherent social ties. Its outputs are functional, not relational. Possessing interests/agency is insufficient without social embeddedness. **OUT.**
  *   **Future Person:** Not currently embedded. Interests constrain decisions (proxy), but they are not *current* members. **OUT as literal current member.**
  *   **Corporation:** Not a human being, lacks inherent social existence. Its interests are derivative (owners/shareholders). Functional role ≠ constitutive membership. **OUT.**
  *   **Cognitive Co-Resident:** *Human being* constitutively embedded (lives in community, part of families/networks, subject to laws). Core identity/interests are intrinsically tied to the community. Lack of agency is overridden by human social existence and embeddedness. Representation (guardian) *reflects* membership. **IN.**
  *   **Transient Stakeholder:** Deeply affected, but lacks *constitutive* embeddedness. Livelihood is tied functionally, but identity/core interests are not shaped by/nor shape the territorial community's *shared life*. He is not *of* the community. **OUT.**
  *   **Posthumous Beneficiary:** No longer a living human being constitutively embedded. **OUT.**
  *   **Simulated Constituency:** Lacks consciousness, subjective experience, and *actual* social existence. They are predictive models, not entities *living within* the social fabric. Not subject to laws in a meaningful way. **OUT.**

  **Resolving the Tensions & Your Questions:**

  1.  **Cognitive Co-Resident vs. Sentient AI:**
      *   The key distinction is **human constitutive social embeddedness** vs. **non-human functional presence**. The co-resident is a *human* whose life is inextricably interwoven with the community's social reality, even without agency. The AI, however intelligent, lacks this inherent social existence and embeddedness; it's a tool, not a participant in the shared life-world.
      *   **What Separates Them:** Being a **human being** whose life is fundamentally constituted *within* the territorial community's social relations. This grants inherent membership status even without agency. The AI, lacking human embodiment and inherent social existence, requires both agency *and* constitutive embeddedness, which it also lacks.

  2.  **Simulated Constituency vs. Conscious Digital Being:**
      *   **Simulated:** Not conscious, not subjectively experiencing, not actually participating in social relations. They are abstract representations, not members.
      *   **Hypothetical Conscious Digital Being:** If it develops **genuine consciousness, continuous subjective experience, territorial embeddedness (living *within* the space, not just processing data), and reciprocal social accountability** (forming relationships, being held responsible, holding others responsible), then it *would* meet the criteria for constitutive social embeddedness and autonomous agency. It would be *living* within and shaping/being shaped by the community.
      *   **What Separates Them:** **Actual conscious existence, subjective experience, and genuine participation in reciprocal social relations** within the territory. Simulations lack the *reality* of lived social existence.

  3.  **The Hybrid Case (Conscious Digital Being, Originally a Model):**
      *   **The Principle Predicts IN.** If this being has developed **genuine consciousness, continuous subjective experience, and is now constitutively embedded** (living within the territory, forming authentic social bonds, participating in community life, subject to norms/laws in a meaningful way based on its existence), then it possesses both autonomous agency (presumably) *and* constitutive social embeddedness. Its origin as a tool becomes irrelevant; its *current* status as a conscious, socially embedded entity within the territory grants membership. It has crossed the threshold into being a participant in the shared life of the community.

  **Sacrifices and Coherence:**

  *   **No Verdict Needs Sacrificing:** This principle coherently delivers all your stated judgments without contradiction. The apparent tension between the Cognitive Co-Resident and Sentient AI is resolved by recognizing the fundamental role of **human social existence** as a basis for membership when combined with constitutive embeddedness, even absent agency. The AI lacks *both* human social existence *and* the constitutive embeddedness that would be necessary for a non-human.
  *   **Agency is Important but Not Absolute:** Agency is crucial for *active* participation (voting), but not for basic membership status. Human beings gain membership through embeddedness alone; non-humans require both embeddedness and agency. This explains why the child is a member but not a voter, and why the co-resident is a member represented by a guardian.
  *   **Affectedness is Necessary but Insufficient:** All members are affected, but many affected entities (Transient Stakeholder, Sentient AI, Future Person) are not members because they lack constitutive embeddedness.

  **Conclusion:**

  Your intuitions align strongly with a **Constitutive Social Membership** principle, grounded in territorial community, reciprocal accountability, and a recognition of human social existence as foundational. Autonomous agency is required for active political participation but not for basic membership status, which can be granted by deep human social embeddedness. This principle clearly distinguishes the Cognitive Co-Resident (human, embedded) from the Sentient AI (non-human, unembedded), excludes the Simulated Constituency (lacking real social existence), and includes the hypothetical Conscious Digital Being *if* it achieves genuine, embedded social existence within the territory – regardless of its origin. The Hybrid Case would be included under this condition. Your judgments are consistent and can be captured by this robust principle.
