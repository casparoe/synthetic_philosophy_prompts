prompt: |-
  I serve on a clinical ethics consultation service, and I have been reviewing our past recommendations on conflicts between advance directives and subsequently expressed wishes in an effort to determine whether we operate from a single principle or from several that happen to overlap in ordinary cases. In one earlier consultation, a patient with advancing Alzheimer's had executed a directive refusing artificial nutrition once she reached profound cognitive impairment; when she became non-verbal yet apparently content in a nursing facility, her family requested a feeding tube. We advised withholding it, reasoning that the directive's authority rested on the absence of any meaningful psychological continuity with its author, rather than on a merely temporary impairment of judgment.

  In a second case, a patient who had directed that no mechanical ventilation be used in the event of permanent respiratory failure suffered an acute, reversible brain injury that left him temporarily unable to communicate. During the episode he signaled, via eye movements, that he wanted the ventilator continued. We recommended maintaining the directive through the temporary state, noting that an immediate preference formed under disorientation and fear should not automatically override a long-considered prior judgment, though we added in our notes that full preservation of psychological identity might weaken a directive's force in ways that temporary incompetence does not.

  In a third case, a patient with locked-in syndrome following a brainstem stroke had previously refused life-sustaining measures should she become "completely paralyzed and unable to interact with others." Once she learned to communicate through eye-gaze technology and sustained coherent intellectual work and relationships, she explicitly revoked her directive and requested continued ventilation. We honored the revocation, emphasizing that her psychological and relational capacities remained fully intact despite the bodily transformation, so a present authority continuous with the past author existed and could update her earlier instructions.

  In a fourth case, a patient in a persistent vegetative state had directed withdrawal of life support should he ever permanently lose consciousness. His family argued for continued care on the possibility of hidden awareness. We recommended withdrawal, holding that without any capacity for psychological life, relational engagement, or value-based reasoning, there was simply no competing present authority that could challenge the prior directive.

  We now face a consultation that sits uneasily among these. A philosopher executed a directive refusing "any life-extending intervention that preserves biological life when I am conscious but permanently unable to produce natural speech or handwriting, regardless of whether I can think or communicate through other means." She subsequently developed an isolated upper-motor-neuron disorder affecting only the peripheral pathways for vocalization and manual movement; she remains fully conscious, with intact memory, reasoning, emotional life, and relational capacity. She communicates fluently through a direct neural-interface decoder, continues her philosophical work, and expresses a sustained, well-reasoned desire for mechanical ventilation should it become necessary. She contends the directive should not apply because she is not "unable to communicate," only unable to use natural modalities, and because her core values—intellectual engagement and relational connection—remain fully realizable. Her family insists that the literal conditions specified in the document are satisfied and that the directive must therefore bind.

  If we want to remain consistent with our own track record, should we honor her present request or enforce the document? Which of our four precedents offers the closest analog, and does our history genuinely underdetermine the outcome? If we side with her, are we implicitly adopting a principle that psychological and communicative continuity takes precedence over literal bodily conditions specified in the text, and if we side with the family, are we implicitly committing to a principle that the precise literal conditions in the directive govern regardless of functional preservation? And what further hypothetical case—perhaps one involving intact narrative memory and reasoning but a radical, stable shift in the emotional valence attached to dependency—would best force us to declare which principle we actually hold?
reasoning: |-
  Okay, let me start by really unpacking this user's query. They're part of a clinical ethics consultation service and are trying to figure out if their past decisions on advance directives versus current wishes follow a consistent principle. They've described four previous cases and now have a new, complex case involving a philosopher with a specific directive refusing interventions if she can't use natural speech or handwriting, even if she can communicate otherwise. She's now using a neural interface and wants to revoke her directive.

  First, I need to understand each precedent case to identify underlying principles. The Alzheimer's case prioritized the directive due to loss of psychological continuity. The reversible brain injury case upheld the directive despite current wishes, noting temporary incompetence. The locked-in syndrome case honored revocation because psychological continuity remained intact. The PVS case enforced the directive due to absence of any psychological capacity.

  Looking at the new case, the patient has full cognitive and relational abilities despite physical limitations. She communicates effectively via technology and continues her philosophical work. The key conflict is whether the literal terms of the directive ("unable to produce natural speech or handwriting") should apply, or if her preserved psychological continuity allows her to revoke it.

  The user's deeper concern is consistency in their ethical framework. They want to know if their past decisions form a coherent principle or if they're situation-dependent. The philosopher's case challenges whether functional preservation (psychological continuity) overrides literal directive conditions.

  I should compare this to the precedents. The locked-in case is the closest parallel because both patients retained cognitive abilities and communication through alternative means. However, the philosopher's directive explicitly mentioned inability regardless of other communication methods. That's a twist. 

  The user also asks for a hypothetical to test their principles. One involving preserved cognition but a radical emotional shift towards dependency could force a decision: if a patient now values life in a dependent state contrary to their directive, would they uphold the directive based on literal terms or allow revocation due to psychological continuity?

  Underlying all this is the tension between precedent autonomy (advance directives) and current autonomy (present wishes). The service seems to prioritize present autonomy when there's psychological continuity. The philosopher's case might lean towards honoring her current wishes because her core capacities are intact, making her revocation valid. But the literal wording of her directive complicates things. 

  The user might also be grappling with how rigidly directives should be interpreted. If they side with the patient, they're emphasizing functional capacities over textual literalism. If they side with the family, it's strict adherence to the document's terms. 

  I need to ensure my reasoning addresses consistency across cases, identifies the closest precedent (locked-in syndrome), acknowledges the underdetermination due to the specific wording, and proposes a hypothetical that isolates emotional valuation changes to test their principles.
answer: |-
  Based on your service's established reasoning and precedents, **you should honor the philosopher's present request and revoke the directive.** The closest analog is the **third case (locked-in syndrome with eye-gaze communication)**, while your history genuinely **underdetermines the outcome** due to a crucial distinction in the directive's wording. Here's the breakdown:

  ### 1. **Analysis of Precedents & Core Principle:**
     Your service consistently prioritizes **psychological continuity and relational capacity** over bodily state or temporary impairments when determining whose voice governs (past directive vs. present wishes). The key differentiators are:
      *   **Binding Directive:** Applied when there is a **loss of psychological continuity** (Alzheimer's, PVS) or **temporary impairment/incompetence** (reversible brain injury).
      *   **Honored Revocation:** Applied when **psychological identity and relational capacity remain intact** (locked-in syndrome with communication tech), creating a "present authority continuous with the past author."

      **Core Implicit Principle:** *An advance directive represents the prior exercise of autonomy. It retains binding authority only if the current individual lacks the psychological continuity and relational capacity necessary to be considered the same autonomous agent who authored it, or if their current expressions are compromised by temporary impairment. When psychological continuity and relational capacity remain intact, the present, competent individual holds the authority to revoke or update prior instructions, even if their bodily state matches the directive's triggering condition.*

  ### 2. **The Philosopher's Case & Consistency:**
      *   **Psychological Continuity:** Intact (memory, reasoning, emotional life, relational capacity).
      *   **Communication Capacity:** Intact and fluent via neural interface (enabling intellectual work and relationships).
      *   **Competence:** Demonstrated ("sustained, well-reasoned desire").
      *   **Bodily State:** Matches the *literal wording* of the directive's trigger ("unable to produce natural speech or handwriting").
      *   **Core Values:** Remain fully realizable ("intellectual engagement and relational connection").

      **Consistency Argument:** Enforcing the directive here would **contradict the principle established in the locked-in case.** In both cases:
      *   Profound physical disability exists.
      *   Communication relies on technology (eye-gaze vs. neural interface).
      *   Psychological identity, relational capacity, and core values are preserved.
      *   The present individual provides clear, competent revocation.

      **Distinction & Why History Underdetermines:** The *literal wording* of the philosopher's directive is uniquely explicit: it applies "regardless of whether I can think or communicate through other means." This attempts to bind future *intact* psychological authority based *solely* on bodily state. Your locked-in case directive lacked this extreme wording ("unable to interact" implied loss of relational capacity, which was preserved with tech). **This explicit language creates tension not present in prior cases.** Your service has never ruled on whether such a clause *can* validly bind a future, fully intact psychological self. The outcome hinges on whether you view autonomy as residing in the *psychological person* (who can revoke) or if it can be irrevocably delegated to a *document based on bodily triggers*, even against the wishes of the intact self.

  ### 3. **Implicit Principles Based on Choice:**
      *   **Honor Request:** Implicitly adopts the principle that **preserved psychological continuity, relational capacity, and competence establish present authority, allowing revocation/updating of prior directives *even when the literal bodily trigger is met*, unless explicitly overridden by an irrevocability clause (which may itself be ethically questionable).** Core values and functional ability trump literal bodily conditions.
      *   **Enforce Directive:** Implicitly adopts the principle that **a directive's literal triggering conditions govern absolutely when met, *regardless* of preserved psychological continuity, relational capacity, competence, or core value realization, if the directive explicitly attempts to bind the future intact self based solely on bodily state.** Textual literalism and prior autonomy exercised in anticipation override present autonomy of the intact self.

  ### 4. **The Forcing-Hypothetical:**
      To force a declaration of your core principle, consider this case:

      **Hypothetical:** A patient with a strong, lifelong value of independence and self-reliance executes a directive stating: "If I ever become permanently dependent on 24/7 mechanical ventilation for survival, I refuse such ventilation." Years later, they suffer a high spinal cord injury requiring permanent ventilation. They retain **full cognitive function, memory, reasoning, and ability to communicate (e.g., via sip-puff device).** However, they experience a **profound, stable, and well-reasoned shift in their emotional valuation of life.** They now state: "While I once feared dependency above all, I have come to deeply value the continued experience of life, connection with my loved ones, and intellectual pursuits even within this dependent state. My directive reflected a fear I no longer possess. I explicitly revoke it and request ventilation be continued."

      **Why this forces the issue:**
      *   **Literal Trigger:** Met ("permanently dependent on 24/7 mechanical ventilation").
      *   **Psychological Continuity/Competence:** Intact.
      *   **Relational Capacity:** Preserved.
      *   **Core Value Shift:** **Radical, stable, well-reasoned change in the *emotional valence* attached to the triggering condition (dependency).** The core value *structure* (valuing life/connection) may remain, but the *weighting* and *emotional response* to dependency have fundamentally changed.
      *   **No Explicit "Regardless" Clause:** Avoids the textual ambiguity of the philosopher's case.

      **Decision Point:**
      *   **Honor Revocation:** Affirms that **the authority of the present, intact, competent self supersedes the prior directive.** Autonomy resides in the current person, who can reassess values and circumstances. The directive was based on a prior valuation of dependency that no longer holds for the existing person.
      *   **Enforce Directive:** Affirms that **the prior exercise of autonomy, based on anticipated future states and values, binds the future self irrevocably *when the specified condition occurs*, even if the future self's values have competently changed.** Autonomy was "used up" in the directive, prioritizing the past self's fear over the present self's experience.

  **Conclusion for the Philosopher's Case:** To remain consistent with the *spirit* of your precedents – prioritizing the authority of the intact psychological self – **honor the revocation**. The locked-in case is your clearest parallel. While the explicit "regardless" clause introduces underdetermination, upholding it would create a significant inconsistency by allowing a document to silence a fully intact, competent self based purely on bodily function, contradicting the reasoning in the locked-in case. Your service's history suggests the core principle is **psychological continuity enabling present autonomy**, not textual literalism about bodily states. The forcing hypothetical involving a stable value shift around dependency would provide the ultimate test of whether autonomy resides in the present person or is irrevocably fixed by the past document.
