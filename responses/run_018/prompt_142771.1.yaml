  So we see the trap only works if the bidding can go above the value of the prize. But with limited tokens, it can't. So we have to allow them to go into debt? Or we give them enough tokens to bid above the prize value.

  I propose: each student gets 100 tokens. The prize is worth 50 candy. Then they can bid up to 100. If they bid 60, they win the prize (50) and have 40 tokens left -> net 90 candy, but they started with 100, so they lost 10? Or we should think in absolute terms at the end.

  At the end:
  - Winner: gets prize (50 candy) + (100 - bid) tokens * 1 candy/token = 150 - bid candy.
  - Second-highest: gets (100 - last_bid) candy.
  - Others: 100 candy.

  The winner's net: 150 - bid. They want this to be high. If bid>150, they would have negative, but they can only bid up to 100, so minimum 50.

  The second-highest: they have 100 - last_bid. If last_bid=99, they get 1 candy.

  The trap: when the bid is 60, the second-highest is at 59. If they drop, they get 100-59=41 candy. If they bid 60, they might win and get 150-60=90 candy (which is better) or they might not and the other bids 61, then they become second-highest at 60 and get 40 candy. But 40 is less than 41? So they are worse off by bidding? 

  This is getting too complex.

  To simplify, we can think in terms of net gain from the auction:

  - Winner: net gain = value of prize - bid = 50 - bid
  - Second-highest: net gain = - last_bid
  - Others: 0.

  But they also have the starting tokens? The starting tokens are sunk? No, they are not sunk because they haven't spent them until they bid.

  The starting tokens are their endowment. Then when they bid, they spend tokens. So their final wealth is starting tokens minus what they spent plus what they win.

  So with 100 tokens and prize 50:
  - Winner: 100 - bid + 50 = 150 - bid
  - Second-highest: 100 - last_bid
  - Others: 100

  The second-highest's net gain from the auction (compared to not bidding) is: (100 - last_bid) - 100 = - last_bid.
  The winner's net gain: (150 - bid) - 100 = 50 - bid.

  So at bid 60, if you are the winner, your net gain is 50-60 = -10.
  If you are the second-highest at 59, your net gain is -59.

  If you are the second-highest and you bid 60, you might become the winner and have net gain -10, which is better than -59. So you bid. Then the other bidder (who was winner at 60) is now second-highest at 60 and faces net gain -60 if they drop. If they bid 61, they might become winner and have net gain 50-61 = -11, which is better than -60. So they bid.

  This can continue until bid=99 and 100.

  At bid=99 (winner) and 98 (second), the second-highest (98) can bid 99? Then net gain if they win: 50-99 = -49, which is better than -98. So they bid 99. Then the other bidder (was winner at 99, now second at 99) faces net gain -99 if they drop. If they bid 100, they win and get 50-100 = -50, which is better than -99? -50 is better than -99, so they bid 100.

  Then the second-highest (now at 99) must decide: if they bid 100, they would get -50 if they win, but if they drop, they lose 99. -50 is better than -99, so they might bid 100? Then the other bidder (now at 100) is the highest and the new second is at 99. Then the bidder at 99 drops? They lose 99. Or they bid 101? But we said they can only bid up to 100? Because they only have 100 tokens.

  So at bid 100, the second-highest (99) cannot bid more. They drop and lose 99. The winner gets -50.

  So the trap can happen.

  Therefore, we set:
  - Each student starts with 100 tokens.
  - The prize is worth 50 candy.
  - Each token is worth 1 candy.

  Now, the game will work.

  Summary of Final Design:

  **Game**: The Escalation Auction

  **Stakes**:
  - Prize: a $5 coffee gift card that can be exchanged for 50 pieces of candy.
  - Each student receives 100 tokens at the start. Each token can be exchanged for 1 piece of candy at the end.

  **Rules**:
  1. The auction is for the gift card.
  2. Bidding is open outcry: students call out bids that are at least 1 token higher than the current highest bid.
  3. A bidder must have enough tokens to cover the bid (they cannot bid more than 100).
  4. The auctioneer records the current highest bid and the current second-highest bid (and the bidder numbers) on a whiteboard.
  5. The auction ends when the auctioneer says "Going once", waits 5 seconds, "Going twice", waits 5 seconds, "Sold!" without a new bid. If a bid is made during the countdown, it resets.
  6. At the end:
     - The highest bidder wins the gift card and pays their final bid (gives that many tokens to the auctioneer).
     - The second-highest bidder pays their final bid (gives that many tokens) and receives nothing.
     - All other students keep their 100 tokens.
  7. After the auction, students exchange tokens for candy (1 token = 1 piece). The winner may exchange the gift card for 50 pieces of candy if desired.

  **Debrief**:
  - Reconstruct the bidding war of the top two.
  - Identify when sunk-cost logic took over: when bidders continued to avoid a sure loss.
  - Compare to rational exit: when the bid exceeds 50, winning yields a net loss on the auction (50 - bid < 0), but they continue because of the sunk cost of their current bid as the second-highest.
  - Predictable issues: 
     - The auction might not escalate if students are too risk-averse. Fix: use a smaller group or run a practice round.
     - Students might not understand the rules. Fix: clarify with examples.
  - Limitations: 
     - Real-world escalation involves time and uncertainty.
     - Emotional factors and reputational concerns are missing.
     - Group decision-making is not captured.

  This design should work for 12 students. The auction might take 15-20 minutes with 12 bidders, but it's doable.

  Let's go with that.
