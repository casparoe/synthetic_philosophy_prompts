  ### In-Class Game: The Escalation Auction  
  **Designed for 12 grad students, 90-minute workshop, using candy stakes (or points for a coffee gift card).**  

  #### **Game Setup**  
  1. **Stakes & Materials**:  
     - **Prize**: One $5 coffee gift card (or 50 pieces of premium candy, e.g., gourmet chocolate).  
     - **Bidding Currency**: Each student gets 100 "points" (physical tokens or tally marks). Points convert to candy at the end (1 point = 1 piece). The gift card is worth 50 points (i.e., 50 pieces of candy if exchanged).  
     - **Tools**: Whiteboard to track bids, timer, a bell to signal the end.  

  2. **Rules (Announced at Start, No Trap Explanation)**:  
     - **Bidding**: Open outcry (students shout bids). Minimum bid increment is 1 point.  
     - **Auction End**: After 10 seconds of no new bids, the auctioneer rings a bell. The last two bidders (highest and second-highest) are locked in.  
     - **Payouts**:  
       - **Winner**: Gets the gift card but **pays their final bid** in points.  
       - **Second-Highest Bidder**: **Pays their final bid** in points but gets **nothing**.  
       - **Others**: Keep all 100 points.  
     - **Constraint**: Bidders can only bid if they have enough points.  

  3. **Why This Design?**  
     - **Group Size (12)**: Open outcry ensures chaos, pressure, and rapid escalation. Larger groups create more "bystanders" who drop out early, funneling bids to 2–3 committed players.  
     - **Time (90 mins)**: Game takes 15–20 mins. Debrief (45 mins) leaves room for discussion.  
     - **Structural Trap**: The second-highest bidder faces a guaranteed loss if they quit, incentivizing them to "just bid once more" to become the winner. The winner, fearing they’ll lose their bid, escalates to avoid being second.  

  #### **Step-by-Step Flow**  
  1. **Intro (2 mins)**:  
     - "We’re auctioning a $5 gift card. You each have 100 points, worth 1 piece of candy per point. The gift card is worth 50 points. Bid openly—highest bid wins."  
     - **Do NOT mention**: Second-highest pays, sunk costs, or strategy.  

  2. **Auction (15–20 mins)**:  
     - Start bids low (e.g., 1 point).  
     - Track bids on the whiteboard: **Current Highest Bid** and **Second-Highest Bid** (update in real-time).  
     - If bidding stalls, count down: "Going once... going twice..." (creates urgency).  
     - Ring the bell after 10 seconds of silence. Finalize the top two bidders and payouts.  

  3. **Payout Example**:  
     - Winning bid: 70 points. Second-highest: 69 points.  
     - Winner: Gift card + (100 - 70) = 30 points → 30 pieces candy + gift card.  
     - Second-highest: (100 - 69) = 31 points → 31 pieces candy (no gift card).  
     - Others: 100 points → 100 pieces candy.  

  #### **Debrief (45 mins)**  
  **1. Reconstruct the Bidding War (15 mins)**:  
     - Map bids on the whiteboard. Ask:  
       - "When did you first want to quit? Why didn’t you?"  
       - "What did you feel when you were the second-highest?"  
     - **Key Insight**: Students will reveal they escalated due to fear of loss (e.g., "I was at 60 points and didn’t want to lose them, so I bid 61").  

  **2. Sunk-Cost Logic vs. Rational Exit (15 mins)**:  
     - **Sunk-Cost Moves**:  
       - Bidding past 50 points: The prize is worth 50, so bids >50 guarantee a net loss.  
       - Second-highest bidding again: "I’d lose 69 points if I quit, so I bid 70 to win and lose less."  
     - **Rational Exit**:  
       - Dropping out early (e.g., at 30 points) because the cost outweighed the prize.  
       - Non-bidders recognizing the trap.  
     - **Lesson**: Sunk costs (past bids) distort decisions. Rational exits ignore past losses and focus on future costs/benefits.  

  **3. Predictable Problems & Fixes (10 mins)**:  
     - **Problem 1: Slow Escalation**  
       - Why: Students may underbid initially (fear of loss, confusion about rules).  
       - Fix: Jump-start bidding with a provocative opener (e.g., "Bid 10 points! Anyone beat that?").  
     - **Problem 2: Collusion or Early Dropouts**  
       - Why: Suspicious players may avoid bidding to "trap" others.  
       - Fix: Run 2–3 quick rounds (5 mins each) to show escalation builds with repetition.  
     - **Problem 3: Winner’s Regret**  
       - Why: Winners may feel cheated if they bid >50 points (e.g., "I paid 70 for a 50-point prize").  
       - Fix: Emphasize in debrief that this is the trap in action.  

  **4. What the Game Can’t Reproduce (5 mins)**:  
     - **Time & Uncertainty**: Real-world escalation involves long-term decisions with unknown outcomes (e.g., a project failing after years). The game is a fast, certain auction.  
     - **Emotional Stakes**: Pride, ego, and public accountability drive real escalation (e.g., "I can’t quit or I’ll look weak"). The game’s candy stakes lack this pressure.  
     - **Group Dynamics**: Real decisions involve committees, hierarchies, and diffusion of responsibility. The game is individual.  
     - **Verbal Bridge**: "In the real world, sunk costs haunt boardrooms and wars because emotions and time amplify the trap. This game simplifies it to pure mechanics—your job is to spot when emotions fill the gap."  

  #### **Why This Works for Grad Students**  
  - **Psychological Immersion**: Real payouts (candy/gift card) make losses tangible. The second-highest rule forces emotional conflict.  
  - **Efficiency**: Fits 90 mins (20 mins game, 45 mins debrief, 25 mins buffer).  
  - **Debrief Depth**: Focuses on *observed behavior* (not theory), making sunk costs visceral.  
  - **Scalability**: Works for 12 students—large enough for competitive pressure, small enough to track bids.  

  **Run it**: Start chaotic, let the trap emerge, then dissect it. By the end, they’ll *feel* the dollar-auction trap—and never forget it.
