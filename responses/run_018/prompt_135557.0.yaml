  ## Opening Remarks: The Ontology Knot in Restitution  
  *(Approx. 5 minutes)*

  Good morning. Let’s cut straight to the conceptual knot we’re here to untangle – or maybe tighten, depending on your view. We all know the headlines: "Museum X returns Y Bronzes to Z Nation." Legal transfer. Physical relocation. Case closed? I’d argue we’ve barely scratched the surface. Because the loudest debates focus on *who owns* and *where it sits*, but whisper about *what it is*.

  Here’s the core tension: **The object that left its context centuries ago, and the object presented in a vitrine today, are ontologically different entities.** What do I mean? That Edo plaque wasn’t conceived as an "art object" for solitary contemplation under LED lights. It was a *ritual actor*. Its power, meaning, and very being resided in its dynamic relationships – with the Oba, with the palace walls it adorned, with ceremonies, with communities, with ancestors. Its presence was functional, relational, alive.

  The museum, by its very nature, performs an ontological transformation. It extracts. It isolates. It categorizes ("Benin Bronze, 16th Century"). It aestheticizes. It neutralizes. The plaque arrives as a ritual agent; the museum displays it as an artifact. This isn't malicious; it’s the museum’s foundational epistemology – its way of knowing things. But it creates a profound mismatch.

  So, the question isn't just *should it go back?* It’s *what are we sending back?* Are we shipping a crate containing an "African Art Masterpiece" labelled with museum accession numbers? Or are we facilitating the return of a *ritual actor*? This is where we reach the fork. And I’m choosing a path: **Genuine restitution requires dismantling the museum's categorical framing, not just shipping the crate back.** Option A.

  Why this verdict?

  1.  **Shipping the Crate Perpetuates the Extraction:** Sending back the physical object while retaining the *interpretive authority* – the museum's definition of *what the thing is* – is just the final stage of colonial capture. It says, "We captured its body, classified its soul, and now we generously return the empty shell." True return must relinquish the *epistemological* claim as much as the physical one. The community regains the object *and* the sovereign right to define its ontology – ritual actor, ancestor, artwork, or something else entirely.
  2.  **The "Ritual Actor" Demands It:** If we accept the original ontology – that these were functional, relational beings – then returning them *only* as static art objects is a fundamental category error. It’s like returning a sacred text solely as a linguistic specimen, ignoring its spiritual power. Restitution must create the *possibility* for the object to resume its intended role, even if that role evolves. This requires acknowledging and respecting that original ontological status *at the point of return*.
  3.  **It’s Not About Accusing Curators:** Curators, this isn't about calling you thieves of *objects*. It’s about recognizing we’re all, perhaps unwittingly, participants in a system that steals *contexts* and *meanings*. Your expertise in preservation is vital. But genuine restitution asks you to collaborate in *repatriating epistemology* – helping ensure the object arrives home not just physically intact, but ontologically unshackled from *our* definitions. It means documentation travels *with* the object, not as its permanent label, but as *one* chapter in its biography, subordinate to the recipient community’s narrative.
  4.  **Lawyers, This is Your Challenge Too:** Contracts focus on title, liability, transport. But if we take ontology seriously, the *language* of return matters profoundly. Are we transferring "title to one (1) brass plaque, accession number X"? Or are we facilitating "the return of the ritual presence known as Y to the custodianship of Z community"? The former locks the object into the museum’s frame forever. The latter opens space for its recontextualization. Draft agreements that acknowledge the *transformative potential* of return, not just the legal transfer. Think beyond the crate – think about the *ontology* the crate contains.

  **The Bottom Line:** Returning an object while insisting it remains fundamentally an "art artifact" defined by the museum paradigm is incomplete restitution. It fails to address the original violence of ontological displacement. Genuine restitution requires humility: acknowledging that the museum’s way of knowing isn't universal or supreme. It requires sending the object back *ready to be redefined* by the community that created its meaning in the first place. This isn’t about destroying museums; it’s about limiting *their* claim to define reality for objects that never belonged solely to that frame. It’s about sending the ritual actor home, not just the sculpture.

  The crate is just the container. What we *put inside it conceptually* determines whether this is truly restitution, or just another leg of the object’s colonial journey. Let’s ensure we’re sending back possibilities, not just possessions.

  Thanks. Let’s get tangled. *(Pause for effect)*
