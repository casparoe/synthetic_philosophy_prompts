  We are drafting a joint statement from a committed endurantist and a committed perdurantist after a good-faith adversarial collaboration. The document must have three parts: (1) a numbered list of agreed claims, (2) a table of disagreements, and (3) a discussion of two cruxes with concrete cases and predictions.

  Agreed Claims (Numbered List):
  1. Definition of Temporary Intrinsics: Temporary intrinsics are properties that an object can have at one time but lack at another, which are intrinsic (i.e., they do not depend on relations to other objects) and which can change over time (e.g., shape, color, mass, etc.).

  2. The Problem of Change: If an object is wholly present at each time at which it exists, and if it has a temporary intrinsic property P at time t1 and lacks P at time t2, then it seems that the same object both has P and does not have P. This appears to violate the law of non-contradiction unless resolved.

  3. The Perdurantist's Basic Proposal: Perdurantism holds that objects persist by having temporal parts. At any given time, only a temporal part of the object is present. The object is a four-dimensional space-time worm. Change in temporary intrinsics is explained by different temporal parts having different properties. Thus, there is no contradiction because the temporal part at t1 has P and the temporal part at t2 lacks P, and these are distinct parts.

  4. The Endurantist's Basic Proposal: Endurantism holds that objects persist by being wholly present at each time. To resolve the problem of change, endurantists typically adopt a relational or indexical strategy. For example, they might say that properties are time-indexed (e.g., "being P-at-t1" and "not-P-at-t2") or that the having of properties is relative to times.

  5. What an Adequate Account Must Explain: Any account of persistence must explain ordinary phenomena such as:
     - Aging: How an object (e.g., a person) can gradually change in properties (e.g., from young to old) while remaining the same object.
     - Color Change: How an object (e.g., a leaf) can change color (e.g., from green to brown) without contradiction.
     - Personal Identity: How a person can persist through time despite changes in physical and psychological states.

  6. Intermittent Existence and Fission: Both sides agree that an adequate account must also handle non-standard cases, including:
     - Intermittent existence: An object that ceases to exist and then comes back into existence (e.g., a machine disassembled and later reassembled without a continuous spatiotemporal path).
     - Fission: An object that splits into two (e.g., an amoeba dividing, or a corporation splitting into two companies).

  Disagreements Table:
  We present a table with two columns: one for the endurantist position and one for the perdurantist position. Each position should be stated in wording that its proponents would accept.

  | Endurantist Position | Perdurantist Position |
  |----------------------|------------------------|
  | Endurantism: Objects persist by being strictly identical across times and wholly present at each time they exist. They do not have temporal parts. Change in temporary intrinsics is handled by relativizing properties to times (e.g., having a property P at t is a matter of standing in a relation to a time). The object itself does not have incompatible properties because the properties are time-indexed. | Perdurantism: Objects persist by having temporal parts at different times. An object is a four-dimensional space-time worm, and at each time, only a temporal part of the object is present. Change is explained by the variation of properties across different temporal parts. The object as a whole does not instantiate temporary intrinsics simpliciter but only via its temporal parts. |
