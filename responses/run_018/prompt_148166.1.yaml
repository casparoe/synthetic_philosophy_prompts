  | In intermittent existence (e.g., the machine case), the reassembled machine is numerically identical to the original machine because it has the same parts arranged in the same functional way, and the identity conditions for machines allow for reassembly after disassembly. This does not require temporal parts. | In intermittent existence, the reassembled machine is a distinct four-dimensional object. Persistence requires spatiotemporal continuity, so the original machine ceases to exist when disassembled and the reassembled machine is a new object. |
  | In fission, the original object (e.g., an amoeba) ceases to exist when it splits, and two new objects come into existence. There is no identity between the original and either of the two, but we may say that the original survives as two objects without being identical to either. | In fission, the pre-fission temporal part is shared by two distinct four-dimensional objects (the two post-fission amoebas). The original amoeba (as a four-dimensional whole that includes the pre-fission part) does not survive the fission, but the two new amoebas have temporal parts that are continuous with the original's temporal parts. |

  **Cruxes:**

  **Crux (i): The Logical Status of Temporary Intrinsics**

  - **Case**: A leaf that is green at time t1 and brown at time t2.
  - **Endurantist View**: This case does not generate a logical contradiction because the leaf has the property of being green at t1 and the property of being brown at t2. These are different time-indexed properties, so the leaf does not simultaneously and in the same respect have both green and not-green. The appearance of contradiction is resolved by relational/time-indexing without temporal parts.
  - **Perdurantist View**: Without temporal parts, the leaf would be the same entity at t1 and t2 having incompatible properties (green and not-green). The endurantist avoids contradiction by making properties relational to times, but this is a cost because it alters the intrinsic nature of the properties. With temporal parts, the temporal part at t1 is green and the temporal part at t2 is brown, and they are distinct, so no contradiction arises.

  **Crux (ii): Ontological Parsimony and Intermittent Existence**

