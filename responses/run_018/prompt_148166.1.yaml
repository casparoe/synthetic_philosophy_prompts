  | In cases of intermittent existence (e.g., a machine disassembled and reassembled), the reassembled machine is the same object as the original because it has the same parts arranged in the same way, and it preserves the functional or causal history that makes it that object. This does not require temporal parts. | In cases of intermittent existence, the reassembled machine is a distinct space-time worm from the original. It is a new object that is a replica. Persistence requires a continuous spatiotemporal path, so intermittent existence breaks persistence. However, we might say that the replica is the same kind of object or that it has the same functional role, but it is not numerically identical to the original. |
  | In fission cases, such as an amoeba splitting, the original amoeba ceases to exist and two new amoebas come into existence. There is no identity between the original and the two offspring; rather, we have a case of survival via branching. Personal identity in fission cases (if applicable) would require a different account, such as psychological continuity, but again without temporal parts. | In fission cases, the original amoeba has two later temporal parts that are spatially separated. The two resulting amoebas are both spatiotemporal continuations of the original, but since identity is one-to-one, the original amoeba does not survive as either one. Instead, we have two new amoebas that share a common temporal part (the pre-fission part). |

  Cruxes:

  Crux (i): Whether temporary intrinsics genuinely generate a logical contradiction or only an appearance resolvable by relational strategies.

  - Concrete Case: Consider a leaf that is green at t1 and brown at t2. The endurantist argues that the leaf is the same object at both times and that there is no contradiction because the leaf has the property of being green at t1 and the property of being brown at t2. The properties are time-indexed, so the leaf does not have the property of being green and not being green at the same time or in the same respect. The perdurantist argues that without temporal parts, the leaf at t1 and the leaf at t2 are the same entity having incompatible properties (green and not-green) unless we relativize, but relativization turns intrinsic properties into relations, which is a cost. 

  - Endurantist Prediction: The leaf case does not generate a contradiction because properties are time-indexed. The leaf has the property of being green at t1 and the property of being brown at t2. The law of non-contradiction is not violated because the properties are held at different times.

  - Perdurantist Prediction: The leaf case without temporal parts would violate the law of non-contradiction because the same object (without temporal qualification) has both green and brown (which is not-green). The endurantist's relativization strategy avoids contradiction but at the cost of turning intrinsic properties into relations to times, which is a revision of our ordinary understanding of intrinsic properties.

  Crux (ii): Whether ontological parsimony actually favors perdurantism once we count not only objects but also the relations or properties required to sustain endurantism, especially in non-standard cases.

  - Concrete Case: Use the intermittent-machine case. A machine is disassembled at t1 and its parts are stored. At t2, the parts are reassembled (exactly as before) and the machine functions again. There is no continuous spatiotemporal path.

  - Endurantist Position: The reassembled machine is the same object as the original because it has the same parts arranged in the same way and it preserves the functional continuity. The endurantist must posit a relation of "being the same machine" that can hold across temporal gaps, which is grounded in the arrangement and functional properties. This relation is not a temporal part but a condition of identity over time.

  - Perdurantist Position: The reassembled machine is a new object because persistence requires a continuous spatiotemporal path. The perdurantist only has one kind of entity: the four-dimensional worm. In this case, there are two distinct worms: one up to disassembly and one starting at reassembly. The perdurantist does not need to posit a special relation for identity across gaps because their account requires continuity.

  - Ontological Parsimony: The perdurantist argues that their view is more parsimonious because they have only one kind of entity (the four-dimensional object) and they do not need to introduce time-indexed properties or special relations for identity across gaps. The endurantist has enduring objects and must add relations to times for properties and special principles for identity in intermittent cases. The endurantist counters that they do not multiply entities beyond what we ordinarily recognize (they have the same objects we usually refer to) and that perdurantism multiplies entities by introducing temporal parts and four-dimensional wholes, which are not needed.

  Niche Conceptual Pressure:

  We address whether part of the dispute is verbal, particularly about the meaning of "wholly present at a time." 

  - The endurantist typically defines "wholly present" as having all of one's parts at that time (without temporal parts). The perdurantist may agree that a temporal stage (a temporal part) is wholly present at a time, but denies that the four-dimensional whole is. Thus, the disagreement is about whether the persisting object is the temporal stage (which endures) or the four-dimensional whole (which perdures).

  - Additionally, we must consider whether the endurantist's commitment to "the same object" in intermittent-existence cases relies on functional or causal-continuity criteria. The perdurantist might argue that this reliance brings the endurantist account closer to a four-dimensionalist analysis because functional continuity is often used to define the persistence conditions of a space-time worm. The endurantist denies this, saying that functional continuity is a criterion for the identity of an enduring object, not a substitute for temporal parts.

