  **Joint Statement on Persistence: Endurantism and Perdurantism**

  **Agreed Claims:**

  1. **Temporary Intrinsics**: Temporary intrinsics are properties that an object can have at one time and lack at another, which are intrinsic (i.e., non-relational) to the object at that time. Examples include shape, color, and mass.

  2. **The Problem of Change**: If an object is wholly present at each time and has a temporary intrinsic property P at t1 and lacks P at t2, then without further explanation, it appears that the same object both has P and does not have P, which would violate the law of non-contradiction.

  3. **Perdurantist Ontology**: Perdurantism resolves the problem by positing that objects have temporal parts. At each time, only a temporal part is present. The object is a four-dimensional whole, and change is variation in properties across its temporal parts.

  4. **Endurantist Strategy**: Endurantism holds that objects are wholly present at each time and do not have temporal parts. It resolves the problem by relativizing properties to times, so that having a property is always a matter of having that property at a time. Thus, the object does not have incompatible properties absolutely.

  5. **Required Explananda**: Any account of persistence must explain:
     - Ordinary aging: gradual changes in properties over time while preserving identity.
