answer: |-
  ### Joint Statement on Persistence: Endurantism and Perdurantism  
  *Produced via adversarial collaboration between committed endurantist and perdurantist representatives*

  #### I. Agreed Claims  
  1. **Temporary Intrinsics Defined**: Properties are temporary intrinsics if they are (i) intrinsic (i.e., their instantiation does not constitutively depend on entities beyond the object), and (ii) can be gained or lost by the same object over time (e.g., shape, mass, or color).  
  2. **Core Problem of Change**: If object O is wholly present at both t₁ and t₂, and O has intrinsic property P at t₁ but lacks P at t₂, this generates an apparent contradiction: O both instantiates and does not instantiate P.  
  3. **Perdurantist Resolution**: Perdurantism avoids contradiction by positing that O persists through time by having distinct temporal parts. At t₁, temporal part O₁ instantiates P; at t₂, O₂ lacks P. The four-dimensional whole O (the "spacetime worm") is never wholly present at a single time.  
  4. **Endurantist Resolution**: Endurantism avoids contradiction by relativizing property instantiation to times. O instantiates P *at* t₁ and not-P *at* t₂, where "at t" is a primitive relation (or indexical modifier) applied to properties or their instantiation. O is strictly identical across t₁ and t₂.  
  5. **Explanatory Requirements**: Both accounts must explain:  
     - **Ordinary aging**: Gradual, continuous change in intrinsic properties (e.g., a tree gaining rings).  
     - **Color change**: Discontinuous intrinsic variation (e.g., a leaf turning from green to brown).  
     - **Personal identity**: Persistence through psychological/physical flux (e.g., a person aging).  
     - **Non-standard cases**:  
       - *Intermittent existence*: An object ceases to exist and later re-exists without spatiotemporal continuity (e.g., a machine disassembled at t₁ and identically reassembled at t₂).  
       - *Fission*: One object divides into two (e.g., an amoeba splitting or a corporation bifurcating).  

  #### II. Disagreements  
  *Positions stated in each side’s self-endorsed terminology*  

  | Issue | Endurantist Position | Perdurantist Position |
  |-------|----------------------|------------------------|
  | **Persistence mode** | Objects *endure*: O is wholly present at every time it exists, and O at t₁ is strictly identical to O at t₂. | Objects *perdure*: O exists at multiple times by having temporal parts at those times; O is never wholly present at any instant. |  
  | **"Wholly present" meaning** | "O is wholly present at t" means (i) all spatial parts of O exist at t, and (ii) O itself (not a proper part) is located at t. Temporal parts are rejected. | "O is wholly present at t" is false for persisting O. Only a temporal part of O is wholly present at t. The spacetime worm O has temporal parts as proper parts. |  
  | **Intermittent existence** | The reassembled machine (t₂) is numerically identical to the original (t₁). Identity is grounded in non-temporal criteria (e.g., form, function, or part composition), without requiring spatiotemporal continuity. | The reassembled machine is a distinct spacetime worm. Persistence requires maximal spatiotemporal connectedness; reassembly creates a new object. |  
  | **Fission** | Fission is cessation: the original object (e.g., amoeba) ceases to exist, replaced by two new objects. Identity cannot branch. | Fission is divergence: the original object’s pre-fission temporal part is shared by two distinct spacetime worms. Identity is non-branching, but persistence is derivative of temporal part continuity. |  
  | **Property instantiation** | O instantiates intrinsic properties *simpliciter* but relative to times (e.g., "O is bent-at-t₁"). Relativization avoids contradiction without temporal parts. | Temporal parts instantiate intrinsic properties *simpliciter* (e.g., O₁ is bent). The whole O instantiates properties only derivatively (e.g., "O is bent at t₁" means O has a bent temporal part at t₁). |  

  #### III. Cruxes  
  *Concrete cases isolate residual disagreements; both sides endorse the accuracy of each other’s self-description.*

  **Crux (i): Contradiction or Relational Resolution?**  
  - **Case**: A clay statue (O) is spherical at t₁ and cubical at t₂.  
  - **Endurantist prediction**: No contradiction arises. O instantiates *being spherical* at t₁ and *being cubical* at t₂ via irreducible temporal relativization (or time-indexed properties). This is a primitive feature of persistence, not a flaw.  
  - **Perdurantist prediction**: Absent temporal parts, O must both be spherical and non-spherical (cubical) *simpliciter*, violating non-contradiction. Relational strategies disguise this by covertly redefining intrinsics as relations.  
  - **Shared diagnostic**: Disagreement hinges on whether "O is F at t" must reduce to non-relational intrinsic instantiation by an entity at t (perdurantist) or can be irreducible (endurantist).  

  **Crux (ii): Ontological Parsimony in Intermittent Existence**  
  - **Case**: Identical machine disassembled at t₁, parts scattered in a warehouse, reassembled identically at t₂ (no spatiotemporal continuity).  
  - **Endurantist prediction**: Parsimony favors endurance. Only one object (the machine) exists intermittently, with identity secured by part-composition and functional criteria. No temporal parts or additional entities are needed beyond properties/relations.  
  - **Perdurantist prediction**: Parsimony favors perdurance. Endurantists must add:  
    - (a) Primitive cross-temporal identity relations for intermittent objects, *and*  
    - (b) Time-indexed properties/relations to resolve temporary intrinsics.  
    Perdurantism requires only spacetime worms and their parts, offering a unified account of persistence.  
  - **Shared diagnostic**: Disagreement reduces to whether functional/criteria-based identity (endurantism) is ontologically cheaper than spacetime worms (perdurantism) *after* accounting for auxiliary commitments.  

  #### IV. Conceptual Pressure Points  
  Both sides acknowledge unresolved tensions that may reflect verbal or methodological differences:  
  - **"Wholly present" as verbal**: The endurantist’s "wholly present" (all spatial parts at t) is compatible with the perdurantist’s description of a temporal stage. The perdurantist denies this applies to persisting wholes.  
  - **Endurantism’s covert four-dimensionalism?**: In intermittent cases, the endurantist’s identity conditions (e.g., "same machine" via functional continuity) structurally resemble perdurantist persistence conditions (e.g., "same spacetime worm" via causal connectedness). The endurantist denies this implies temporal parts, insisting functional criteria define identity *for enduring substances*.  
  - **Metaphysical cost vs. intuitive ontology**: Endurantism accepts higher-order relations (e.g., time-indexed properties) to preserve pre-theoretic object identity. Perdurantism accepts higher entity count (temporal parts) to preserve property intrinsicality and avoid primitive relativization.  

  ---  
  This document represents full consensus on the agreed claims, a non-stipulative articulation of disagreements, and isolation of cruxes via test cases. Both signatories affirm that residual differences are substantive but crystallized by this collaboration.
