    Each group that chooses a scaffolding proposal in a round and is part of a coordinated set (at least two groups choose compatible scaffolding) gets: 
    `(Number of groups in the coordinated set) * (round multiplier) * (base bonus)`

    Example: 
    - Round 1: base bonus=5, round multiplier=1.
      - If two groups coordinate: each gets 2 * 1 * 5 = 10 points.
      - If three groups coordinate: each gets 3 * 1 * 5 = 15 points.
    - Round 2: multiplier=2.
      - Two groups: 2*2*5=20 each; three groups: 3*2*5=30 each.

    But note: the scaffolding proposal also gives a lower individual accuracy point (IAP). So in round 1, if a group chooses scaffolding and coordinates with two others, they get 5 (IAP) + 15 (CBB) = 20. If they choose conservative, they get 10 (IAP) and no bonus.

  - **Compatibility:** The scaffolding proposals must be compatible. We can achieve this by having only one type of scaffolding per round? Or we can have multiple branches but for simplicity, let's have in each round only one scaffolding option (with a specific simplifying model) that is the same for all groups. Then, if multiple groups choose scaffolding in the same round, they are automatically compatible.

  However, note: the problem says "each branch carries collective bonus points that compound if other groups also select compatible scaffolding choices". To keep it simple, we can have one scaffolding model per round that is the same for all groups. Then, if at least two groups choose scaffolding in that round, they are considered to have selected the same framing and get the bonus.

  ### Renegotiation Rule:
  After round two, groups may revise their framing belief (i.e., switch from scaffolding to conservative or vice versa, but note: if they had chosen scaffolding and then want to switch to conservative, that might be abandoning the scaffold) but they pay a penalty. We can say: 
