  We are designing a 90-minute activity for an upper-level philosophy seminar on the tension between accuracy-first epistemology and scaffolding beliefs. The activity involves three groups of four students, each acting as a research collective. They will make decisions over three rounds, choosing between two proposal types: conservative (high accuracy, ends the round) and scaffolding (lower accuracy, unlocks branching paths with collective bonuses). 

  ### Materials Needed:
  - Evidence cards (identical for each group, describing a complex phenomenon, e.g., a social-dynamics pattern with noisy indicators)
  - Proposal templates for each round (with pre-printed accuracy scores for each option)
  - A visible scoreboard (tracking individual points per group and collective bonus points)
  - Decision sheets for each round (for groups to record their choice and any notes)
  - Rules sheet (including the payoff formula)

  ### Payoff Formula (on the board):
  - **Individual Accuracy Points (IAP):** Linear. For each round, if a group chooses the conservative proposal, they get a fixed number of points (say, 10 per round). If they choose the scaffolding proposal, they get a lower fixed number (say, 5 per round) but unlock the potential for collective bonuses.
  - **Collective Branching Bonuses (CBB):** Multiplicative and conditional. 
    - The bonus is calculated as: `(Number of groups that selected compatible scaffolding proposals in the same round) * (Branch multiplier) * (Base bonus)`
    - The branch multiplier increases with each round (e.g., 1x in round 1, 2x in round 2, 3x in round 3) to reflect compounding.
