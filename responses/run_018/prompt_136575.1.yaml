  - After round 2, groups have the option to "abandon their scaffold" (if they have been using scaffolding) by choosing the conservative proposal in round 3. They must pay a penalty of 10 points (deducted from their total) and they do not participate in any collective bonus for round 3. 
  - If they stick with scaffolding, they can get the bonus if at least one other group also sticks (or switches to scaffolding? but if they were not on scaffolding before, they can't just switch without penalty? Actually, we haven't allowed groups that were on conservative to switch to scaffolding without penalty? So let's say: 
    - Groups that have chosen scaffolding in at least one previous round and continue with scaffolding in round 3 do not pay a penalty. 
    - Groups that have chosen only conservative in previous rounds and now choose scaffolding in round 3 are allowed without penalty (they are adopting the scaffold late) but they don't get the benefit of the previous rounds' compounding? 
    - Groups that have chosen scaffolding in a previous round and then choose conservative in round 3 must pay a penalty (because they are abandoning the scaffold).

  But note: the collective bonus is per round. So in round 3, if a group chooses scaffolding, they are eligible for the round 3 bonus if at least two groups choose scaffolding (regardless of what they did in previous rounds). However, the penalty is for abandoning a scaffold that they had previously adopted. So we can define:

  - In round 3, if a group that had chosen scaffolding in at least one of the previous rounds (round 1 or 2) chooses the conservative proposal, they must pay a penalty of 10 points (from their total accumulated points). 
  - Groups that had chosen only conservative in rounds 1 and 2 can choose either without penalty.

  ### The Evidence and Proposals:
  - We'll create a hypothetical phenomenon: "The Dynamics of Trust in Online Communities"
  - Evidence cards: Each card describes a piece of evidence (with some noise) about how trust forms and breaks down. For example:
    - "Survey data from 10,000 users shows that when a community has more than 50% new members, the rate of trust violations increases by 15-25% (with a margin of error of ±5%)."
    - "Experimental data: In simulated communities, introducing a reputation system reduced trust violations by 30% in stable communities but had no effect in high-turnover communities."

  - For each round, we have two proposals:
    1. Conservative: A precise model that fits the current evidence but doesn't open new questions. 
    2. Scaffolding: A simplifying model that is flagged as technically false (e.g., "Assume that trust dynamics are primarily driven by group stability, ignoring other factors for now") but that suggests follow-up questions.

  ### Example Round 1:
  - **Conservative Proposal:** 
    - "Model trust violations as a function of group stability and reputation systems, with precise parameters from the data."
    - Accuracy score: 10 IAP (individual accuracy points)
    - Effect: Ends the round for the group (they get 10 points and no further actions in this round).

  - **Scaffolding Proposal:**
    - "Model trust violations as driven solely by group stability (ignoring reputation systems and other factors). This model is known to be an oversimplification because the data shows reputation systems matter, but it allows us to focus on stability effects."
    - Accuracy score: 5 IAP
    - Effect: Unlocks two follow-up questions (which are described on the card) and makes the group eligible for the collective bonus if at least one other group also chooses scaffolding.

  ### Timeline:
  - Total: 90 minutes
    1. **0:00-0:10 (10 min):** Rules and role assignment. 
       - Explain the rules, the payoff formula, and assign groups. 
       - Appoint one student per group as the "skeptic" (to argue for accuracy-first).
       - Run a 5-minute practice round (with no points) to clarify.

    2. **Round 1: 0:10-0:25 (15 min):** 
       - Groups receive evidence cards and proposal templates for round 1.
       - They discuss and choose. 
       - The facilitator collects choices and updates the scoreboard.

    3. **Inter-round 1: 0:25-0:30 (5 min):** 
       - Groups can see the choices of others and negotiate for the next round.

    4. **Round 2: 0:30-0:45 (15 min):** 
       - Same as round 1, but with new evidence and proposals (that build on the previous).

    5. **Inter-round 2: 0:45-0:50 (5 min):** 
       - Negotiation. Also, groups consider the possibility of renegotiation (for round 3) and the penalty rule is explained again.

    6. **Round 3: 0:50-1:05 (15 min):** 
       - Groups decide, with the option to abandon scaffolding (with penalty) or continue.

    7. **Debrief: 1:05-1:25 (20 min):** 
       - Map moments to the conceptual distinction.
       - Ask each group to report where they landed and how they felt about the trade-off.

    8. **Failure-mode discussion: 1:25-1:35 (10 min):** 
       - Discuss what the activity does and does not capture.

  ### Practice Round:
  - We run a 5-minute practice round within the initial 10 minutes. The practice round uses the same structure but with a simple example and no points. The goal is to clarify the rules and the bonus mechanism.

  ### Predicted Problems and Solutions:
  - Problem: Groups might be risk-averse and over-select conservative, especially if they don't understand the multiplicative bonus. 
    - Solution: Practice round and clear explanation. Also, the skeptic in each group will voice the accuracy-first position, ensuring the tension is discussed.

  ### The Scoreboard:
  We'll have two sections:
  1. Individual Points (per group, accumulated over rounds):
     - Group A: [total]
     - Group B: [total]
     - Group C: [total]

  2. Collective Bonuses (per round, showing how many groups coordinated and the bonus each coordinating group received in that round).

  ### The Decision Sheets:
  Each group gets a sheet per round with:
  - The evidence card (same for all groups in that round).
  - The two proposals (with their IAP scores and effects).
  - A place to record their choice and any notes.

  ### Debrief Questions:
  - "In round 1, when you saw the scaffolding option, what were your initial thoughts? Did the skeptic in your group raise concerns?"
  - "At what point did your group notice the potential of the multiplicative bonus? How did that change your strategy?"
  - "In round 3, did any group abandon the scaffold? How did the penalty feel? Was it worth it?"
  - "Do you feel that choosing the scaffolding proposal was a failure of epistemic duty? Or a legitimate trade-off? Why?"
  - Map the moments: 
    - "In round 1, when one group chose scaffolding and didn't get a bonus because they were alone, how did that feel? What about when two groups coordinated and got the bonus?"
    - "The renegotiation penalty in round 3: how does that simulate the cost of abandoning a scaffold that had been useful?"

  ### Normative Point:
  At the end, the facilitator must note: 
    "The activity shows how scaffolding beliefs can be instrumentally useful for collective inquiry. However, it does not address the normative accuracy-first claim that a false belief is intrinsically defective regardless of its utility. We must keep in mind that the activity is about instrumental success, not about the intrinsic value of truth."

  Now, let's write the detailed instructions for the facilitator.
answer: |-
  ### Structured 90-Minute Activity: "Scaffolding Dilemmas"  
  **Objective:** Immerse students in the tension between strict accuracy-first epistemology (beliefs valued solely for correspondence with reality) and "scaffolding beliefs" (instrumentally useful false/imprecise representations that organize inquiry), through collaborative decision-making.  

  ---

  ### **Materials**  
  1. **Evidence Cards** (3 identical sets, 1 per group): Describe a hypothetical complex phenomenon (e.g., *"Urban Trust Dynamics"*).  
     - *Sample Text:* "Data shows trust in urban neighborhoods correlates with public space usage (park visits, community centers). However, indicators are noisy: 35% of self-reported trust surveys conflict with behavioral data, and key variables (e.g., ‘social cohesion’) lack clear metrics."  
  2. **Proposal Templates** (3 rounds, 2 options per round):  
     - **Conservative Proposal:** High accuracy score, ends the round.  
       - *Example (Round 1):* "Trust is solely measurable via behavioral data (e.g., park attendance). Reject self-reports due to noise."  
       - *Accuracy Score:* 10 points. Effect: *No follow-up; round ends for group.*  
     - **Scaffolding Proposal:** Lower accuracy score, unlocks branching paths.  
       - *Example (Round 1):* "Trust is driven by ‘social energy’—a composite of self-reports and behavioral data (NOTE: this concept is imprecise and untestable)."  
       - *Accuracy Score:* 5 points. Effect: *Unlocks 2 follow-up questions (e.g., "Does ‘social energy’ vary by income?" "How do public events affect it?").*  
  3. **Scoreboard** (Visible to all):  
     - **Individual Points:** Tally per group (linear accumulation).  
     - **Collective Branching Bonuses (CBB):** Formula:  
       `CBB = (Number of groups selecting compatible scaffolds) × Round Multiplier × 5`  
       - *Round Multipliers:* Round 1 = 1x, Round 2 = 2x, Round 3 = 3x.  
       - *Compatibility:* Scaffolds are compatible if groups select the *same type* of simplifying model (e.g., all use "social energy" in Round 1).  
       - *Activation:* CBB awarded *only* if ≥2 groups choose compatible scaffolds.  
  4. **Decision Sheets** (1 per group per round): Space to record choices and rationales.  
  5. **Role Cards** (1 per group): Assigns a "skeptic" to argue for accuracy-first in each group.  

  ---

  ### **Timeline**  
  **Total: 90 minutes**  

  #### **Phase 1: Setup (10 min)**  
  - **0:00–0:05:** Divide into 3 groups of 4. Assign roles: 1 skeptic/group (enforces accuracy-first arguments).  
  - **0:05–0:10:** Explain rules and payoff formula (displayed on board).  
    - *Key Points:*  
      - "Your goal: Maximize points for your group."  
      - "Conservative proposals give higher accuracy points but end your round. Scaffolding proposals give fewer points but unlock bonus opportunities if others coordinate with you."  
    - **Practice Round (5 min):** Groups discuss a simplified scenario with no points at stake. Clarify mechanics (e.g., how branching paths work).  

  #### **Phase 2: Decision Rounds (45 min)**  
  - **Round 1 (0:10–0:25):**  
    - Groups receive identical evidence cards and proposal templates.  
    - *Scaffolding Risk:* If only one group chooses scaffolding, they get no CBB (losing 5 accuracy points with no bonus).  
  - **Inter-Round 1 (0:25–0:30):**  
    - Groups see choices and scores. Negotiate coordination for Round 2 (e.g., "If you pick ‘social energy,’ we will too!").  
  - **Round 2 (0:30–0:45):**  
    - New evidence cards introduce complexity (e.g., "Data reveals ‘social energy’ ignores cultural factors").  
    - *Dilemma:* Groups that coordinated in Round 1 face pressure to maintain compatibility for CBB (now 2× multiplier).  
  - **Inter-Round 2 (0:45–0:50):**  
    - Announce renegotiation rule: **Groups may switch scaffold frameworks before Round 3 but lose 5 accuracy points (simulating cost of abandoning a scaffold).**  
  - **Round 3 (0:50–1:05):**  
    - Evidence cards challenge prior scaffolds (e.g., "Long-term data shows ‘social energy’ models collapse under policy changes").  
    - Groups decide: Stick with scaffold (risk collapse), switch (pay penalty), or abandon for conservative option.  

  #### **Phase 3: Debrief (30 min)**  
  - **1:05–1:25 (20 min): Conceptual Mapping**  
    - Ask groups:  
      1. "When did you first notice the tension between accuracy points and collective bonuses?"  
      2. "In Round 3, did paying the penalty to switch scaffolds feel like a failure of epistemic duty or a strategic trade-off?"  
    - Map moments to epistemology:  
      - *Example:* "The Round 1 CBB failure illustrates the risk of scaffolding without coordination—this mirrors how isolated heuristic models may not advance collective inquiry."  
      - *Example:* "Renegotiation penalties simulate the real cost of discarding a scaffold: lost time, resources, and coherence."  
  - **1:25–1:35 (10 min): Limits of the Activity**  
    - State clearly:  
      - "This activity shows scaffolding’s *instrumental value* but cannot resolve the normative accuracy-first claim: that false beliefs are *intrinsically defective* regardless of utility."  
      - "The ‘points’ system represents pragmatic success, not intrinsic epistemic value."  

  ---

  ### **Predicted Pitfalls & Solutions**  
  - **Pitfall:** Groups ignore scaffolding due to risk aversion, dismissing bonuses as a "trick."  
    - **Solution:** Skeptic role forces debate; practice round normalizes bonuses.  
  - **Pitfall:** Groups under-coordinate early, causing CBB failures.  
    - **Solution:** Inter-round negotiations explicitly reward coordination.  
  - **Pitfall:** Students view scaffolding as "cheating" rather than a trade-off.  
    - **Solution:** Debrief frames choices as real methodological dilemmas ("Scientists use idealizations like frictionless planes to simplify problems").  

  ---

  ### **Facilitator Notes**  
  - **Key Tension:** Highlight how groups that rigidly pursue accuracy points (e.g., always choosing conservative proposals) accumulate steady but low scores (e.g., 10 × 3 = 30 points). Groups that coordinate scaffolding can achieve far higher totals (e.g., 5 + 5 + 5 points + 30 CBB = 45+).  
  - **Neutral Framing:** Avoid terms like "scaffolding belief" until debrief. Use "simplifying model" during gameplay.  
  - **Outcome Variance:** Some groups may prioritize individual points; others risk coordination. This divergence fuels debate.  

  **Outcome:** Students experience the visceral pull of instrumental reasoning against accuracy-first purity, setting the stage for deeper critique of epistemic value theory.
