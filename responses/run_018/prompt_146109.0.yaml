  ### The Case: The Compliance Audit

  **Scenario:** You're a hospital administrator. The board has run a deterministic simulation of your decision-making process yesterday to predict whether you'll approve a costly, non-essential equipment purchase (Option A) or reject it to fund nurse bonuses (Option B). The simulation's output is locked in a vault. If your choice matches the simulation, the board rewards you with a promotion. If not, you're passed over. Crucially:  
  - The simulation used your exact reasoning algorithm but lacked today's key data: a surprise audit revealing that Option B (bonuses) would cause compliance violations (costing your job) due to budget irregularities.  
  - You now know the simulation *didn't* factor in this audit.  
  - Promotion requires matching the simulation's *prediction*, not the moral "best" choice.  

  **Payoffs:**  
  - **Match simulation + avoid violations:** Promotion saved.  
  - **Match simulation + violations:** No promotion, job at risk.  
  - **Deviate + avoid violations:** No promotion, job safe.  
  - **Deviate + violations:** No promotion, job at risk.  

  Today's truth: Only Option A (equipment) avoids compliance violations. But the simulation, lacking audit data, likely predicted B (bonuses), as that was objectively better yesterday.  

  ---

  ### Decision Theory Breakdown  
  **1. Causal Decision Theory (CDT):**  
  - "My choice today can't *cause* yesterday's simulation to change. The prediction is fixed. I control only real-world outcomes."  
  - Since Option A avoids compliance violations (saving your job), CDT chooses **A (deviate from likely simulation output)**. Ignores promotion; focuses on causal job security.  

  **2. Evidential Decision Theory (EDT):**  
  - "Choosing B is *evidence* the simulation predicted B (since it modeled my core reasoning). But I know the simulation ignored the audit, so my choice *now* isn't evidence about its output. Correlation is broken."  
  - Calculates:  
    - *If I choose B:* Likely matches simulation (promotion) but causes violations (job risk).  
    - *If I choose A:* Avoids violations (job safe) but likely mismatches simulation (no promotion).  
  - Weights job security over promotion. Chooses **A (deviate)**.  

  **3. Updateless Decision Theory (UDT):**  
  - "I must precommit to a strategy for *all versions* of my algorithm—yesterday's simulation and today's real me—as one unified system."  
  - Reasons:  
    - The simulation (lacking audit data) would choose B (bonuses).  
    - Real-me (with audit data) *should* choose A to avoid violations.  
  - But promotion requires *matching* the simulation's output (B).  
  - **Sacrifices immediate payoff:** UDT chooses **B (align with simulation)** to satisfy the precommitted strategy ("always choose what's best given your *local data*") and secure the promotion, even though it risks job loss from violations. The logic: In the multiverse of your decision algorithm, consistency (simulation B → real-me B) maximizes *long-term* utility across instances, despite short-term costs here.  

  ---

  ### Key Structural Split  
  - **What splits UDT off?** UDT binds the agent's current decision to the *logical output of the algorithm* across all instances (simulation + real), even when they have **asymmetric information**. CDT and EDT treat the simulation as a separate, fixed event. UDT sees both as one "agent" spanning time.  
  - **If you strip this:** Remove the simulation's deterministic link to your reasoning (e.g., the vault contains a random guess). Now all theories align: Choose **A (deviate)** to save your job. The "updateless" glue is gone.  

  ### Causal Theorist's Attack  
  A CDT critic would pounce:  
  - "UDT self-sabotages! Choosing B to ‘align’ with a *deterministic simulation* is like a prisoner volunteering for extra jail time to ‘cooperate’ with their past self. The real-world penalty (compliance violations) isn't worth the promotion. The simulation is *causally inert*—it can't ‘reward’ you. Maximize *actual* outcomes, not theoretical consistency."  

  ### Outcome  
  - **UDT agent:** Chooses B. If simulation predicted B (likely), gets promotion but triggers compliance violations (job risk).  
  - **CDT/EDT agent:** Chooses A. Saves job but forfeits promotion.  
  - **Twist vindication:** UDT wins promotion but risks everything. CDT/EDT keeps the ship afloat but misses the prize. The board, watching, debates if "consistency under abstraction" is brilliance or madness.  

  ---  
  **Final Punch:** UDT prioritizes the *algorithm's global integrity* over local gains. In a single-play, high-stakes game like this, CDT/EDT call that insanity. But for UDT, it’s the only way to "win" across the multiverse of you. The vault isn’t a predictor—it's a mirror.
