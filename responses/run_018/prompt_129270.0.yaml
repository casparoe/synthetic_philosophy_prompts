prompt: |-
  I'm prepping interview questions for a podcast next week with a philosopher who defends a niche variant of moral particularism. She thinks thick moral concepts—like cruel or brave—don't function as defeasible rules at all, but instead get their force from what she calls "local coherence networks," context-bound patterns of reason that can't in principle be captured by any general principle. She also rejects the idea that particularist judgment is just tacit knowledge of hidden rules, and she thinks generalists are basically treating practical wisdom like a black-box algorithm.

  I want 8-10 questions that go deeper than asking her to restate the view. Specifically:
  - at least one that presses whether "local coherence networks" are just hidden generalities with a fancy name
  - at least one on epistomology: if these networks aren't rule-governed, how do we spot and correct mistakes inside them?
  - at least one engaging with the familiar particularist claim (associated with Dancy and others) that reasons shift their moral weight across contexts—does her framework make that shifting redundant, or does it just relocate the problem?
  - for each of those three, include a follow-up keyed to the reply she's most likely to give (probably something about holistic perception or the limits of codification)

  Keep it casual—this is just for my prep notes, so a typo or two is definatly fine.
reasoning: |-
  Okay, the user is prepping for a podcast interview with a philosopher who has a unique take on moral particularism. They need 8-10 questions that go beyond just restating her views. The key points are her rejection of defeasible rules in favor of "local coherence networks," her stance against tacit knowledge of hidden rules, and her critique of generalists treating practical wisdom like a black-box algorithm.

  First, I need to make sure I cover all the specific requests. The user wants at least one question each on three topics: whether local coherence networks are just hidden generalities, how we correct mistakes without rules, and how her view relates to Dancy's shifting reasons. Each of these needs a follow-up question anticipating her likely response about holistic perception or codification limits.

  For the first topic—hidden generalities—I should challenge her directly on whether these networks are just rules in disguise. Her probable rebuttal would involve the non-transferable nature of these contexts, so the follow-up should push on what makes contexts truly unique. Maybe ask if "uniqueness" is a barrier to learning across cases.

  On epistemology, the main question needs to address error-correction without rules. She might respond with perceptual metaphors or training through practice. The follow-up could question how we avoid relativism if there's no standard beyond local coherence, forcing her to clarify objectivity within her framework.

  For the Dancy comparison, the question needs to probe whether shifting reasons become redundant in her model. If she argues that networks make context-switching fundamental, the follow-up should ask how this differs from Dancy's holism, pushing her to distinguish her view.

  I should also include other angles. Maybe a question on the ontology of these networks—are they real or just explanatory tools? Follow up on whether this risks obscurantism. Another could be on moral progress: how do networks evolve without rules? Follow up on whether this leads to conservatism.

  For practical wisdom, question how we teach judgment without rules. If she mentions apprenticeship, follow up on whether this excludes those without access to mentors. Also, challenge the algorithm analogy: does she reject all rule-like structures? Follow up on whether rule-of-thumb use undermines her position.

  Anticipate deeper needs: The user might want to reveal contradictions or test the theory's resilience. Ensure questions push her to defend against common critiques, making the interview engaging. Keep questions conversational for prep notes, so phrasing should be direct but not overly formal. Avoid jargon where possible, but some is necessary given the topic. Check that all required elements are covered and each follow-up ties to her likely responses. Make sure the structure flows from foundational concepts to implications, ending on teaching/practicality to show real-world relevance.
answer: |-
  Here are 10 questions designed to dig deeper, framed conversationally for your prep, with the required angles and follow-ups:

  1.  **Core Metaphor:** You describe moral judgment using "local coherence networks." Can you paint a vivid picture of what this *feels like* for the agent in the moment? Are we talking about a sudden gestalt shift, a slow dawning, or something else entirely? (Forces concrete description beyond the label).
      *   *Likely Reply:* Emphasizes holistic perception, intuitive grasp, non-inferential pattern recognition.
      *   **Follow-Up:** Okay, so it's a perceptual or intuitive "click." But perception can be flawed. If the judgment *is* the perception of coherence within that specific network, how do we even *identify* an error? What's the "glitch in the Matrix" moment for this kind of perception? (Directly targets epistemology of error).

  2.  **Hidden Rules?:** Critics might say "local coherence networks" sound suspiciously like context-specific *rules* or mini-principles we just haven't formalized yet – hidden generalities with a fancy name. Why is that fundamentally wrong? What *specifically* about these networks resists even *context-bound* rule formulation?
      *   *Likely Reply:* The elements and their interrelations are unique, non-repeatable, irreducible; rules inevitably miss the constitutive context; it's about the *whole* pattern, not isolable parts.
      *   **Follow-Up:** You mention uniqueness and irreducibility. But doesn't learning and moral development *depend* on seeing similarities across contexts? If every network is truly unique and irreducible, how is moral learning or advice even possible? Doesn't this risk making each judgment an isolated island? (Pushes on uniqueness vs. learning/generalizability).

  3.  **Dancy & Shifting Weight:** Jonathan Dancy argues a key feature of particularism is that reasons (like 'causing pain') can change their moral polarity or weight dramatically across contexts. In your framework, grounded entirely in local coherence networks, does the idea of a "reason" even *retain independent identity* enough to "shift"? Or does the network model make the whole notion of shifting reasons redundant – dissolving it into the network's unique coherence?
      *   *Likely Reply:* Shifting reasons *are* the manifestation of different network logics; the "reason" is only identifiable *within* the network's logic; it's not a stable entity shifting, but its significance being constituted differently *ab initio*.
      *   **Follow-Up:** So the "shifting" is really just a surface feature of fundamentally different underlying structures (networks). But doesn't Dancy's holism *also* say the context determines valence? What's the *practical difference* then, for the agent deliberating, between your network model and Dancy's holism? Is it just a different metaphysical story for the same deliberative experience? (Questions redundancy and practical difference).

  4.  **Epistemology & Error:** If these networks aren't rule-governed, how do we actually *correct* a mistaken judgment? If I misperceive the coherence, what tools or processes do I have to realize that and fix it? Is it just more perception? Dialogue? Clashing intuitions? (Core epistemology question).
      *   *Likely Reply:* Dialectical process: exposing the judgment to other perspectives, testing it against other intuitions or considered judgments *within that context*, narrative exploration, seeing if it "fits" better when more facets are considered; refinement through practice and sensitivity.
      *   **Follow-Up:** This sounds like seeking wider coherence within the network via dialogue/reflection. But if the *only* standard is coherence *within this specific local network*, what prevents this from collapsing into relativism? How do we avoid "coherent evil" or just groupthink within a local context? Where's the friction? (Pushes on objectivity/relativism).

  5.  **Beyond Tacit Rules:** You firmly reject the idea that particularist judgment is tacit knowledge of hidden rules. Can you give a concrete example of a thick concept application (e.g., judging an act as "cruel" or "brave") where the *best explanation* for the judgment *cannot* be "she's applying a complex, context-sensitive rule she can't articulate," but *must* be "she's perceiving the local coherence network"?
      *   *Likely Reply:* Points to cases where standard rule-based explanations fail spectacularly (e.g., "causing pain is pro tanto bad" failing to explain why it's *not* cruel in surgery, or *is* cruel in a prank), emphasizing the *sui generis* nature of the judgment.
      *   **Follow-Up:** Okay, rule-based explanations hit limits. But couldn't the defender of tacit rules just say the rule is *even more* complex and context-sensitive than we imagined? What positive evidence suggests it's *not* a rule (even an insanely complex one), but this fundamentally different "network perception"? (Challenges the positive case for networks over hyper-complex rules).

  6.  **Ontology of Networks:** Are "local coherence networks" something *real* out there in the moral fabric of situations, waiting to be perceived? Or are they more like helpful *descriptive metaphors* we use *after the fact* to explain our judgments? Put bluntly: are we discovering them or inventing them?
      *   *Likely Reply:* Likely realist-ish: the moral features and their salient connections exist in the situation; perception is of objective pattern, though shaped by sensitivity.
      *   **Follow-Up:** If they are objective patterns, why are they so resistant to *any* codification, even partial or heuristic? Doesn't science often find patterns in complex systems? Why is morality uniquely uncodifiable in this way? (Challenges the strong anti-codification claim).

  7.  **Moral Progress:** How does moral progress or development happen within this model? If we're not refining rules or principles, what are we refining? Just our perceptual sensitivity to more complex networks? And how do we know we're progressing, not just changing?
      *   *Likely Reply:* Refining sensitivity, expanding the range of situations we can "see" coherently, deepening understanding through narrative/history, achieving wider reflective equilibrium *across* different network judgments.
      *   **Follow-Up:** This wider equilibrium across networks – doesn't that start to look suspiciously like seeking coherence on a *more general* level? Couldn't *that* be seen as a kind of tacit general principle ("strive for maximal coherence")? (Pushes back towards generality).

  8.  **Teaching Wisdom:** If practical wisdom isn't applying rules (tacit or explicit), and isn't a black-box algorithm, what *is* it? How do we teach it? Is it purely apprenticeship – "watch me judge"? Doesn't that seem incredibly inefficient and potentially elitist?
      *   *Likely Reply:* Emphasizes narrative, literature, case studies (not as examples *of* rules, but as exercises in pattern recognition), dialogue, developing virtues of attention and imagination, mentorship focused on perception and articulation *of the particular*.
      *   **Follow-Up:** But doesn't saying "look at *this* case, then *this* similar case" implicitly rely on pointing out relevant similarities? Aren't we inevitably gesturing towards *some* general features ("See how the *vulnerability* mattered here *and* there?") even while denying full rules? Where's the line? (Questions teaching without *any* generality).

  9.  **Algorithm Analogy:** You criticize generalists for treating practical wisdom like a black-box algorithm. Is your critique that they *model* it wrong, or that they *aspire* to make it algorithmic (even if impossible)? Is there *any* useful role for algorithm-*like* thinking (heuristics, checklists) in morality, or is that always a dangerous distortion?
      *   *Likely Reply:* Aspiration is the problem; modeling it as algorithmic (even complex) fundamentally misrepresents the nature of the capacity; heuristics can be useful crutches but are always defeasible and secondary to perception.
      *   **Follow-Up:** Sure, heuristics are defeasible. But if someone consistently uses a heuristic like "consider the most vulnerable party" successfully across diverse contexts, doesn't that suggest *some* stable, transferable moral structure is being tapped into, even if imperfectly captured? How does your network view account for the *apparent* usefulness of such heuristics? (Challenges the rejection of *any* stable structure).

  10. **Radical Edge:** What's the *most radical implication* of your view? What cherished assumption about morality or moral reasoning does it force us to abandon that even other particularists might balk at? (Invites her to highlight the distinctiveness/non-Dancy-ness).

  **Key Prep Notes:**

  *   **Holistic Perception:** Be ready for her to lean heavily on metaphors of perception, gestalt, "seeing-as," pattern recognition. Your follow-ups need to press on the mechanics and objectivity of this perception.
  *   **Anti-Codification:** Her core claim is likely a very strong impossibility thesis about capturing the networks in *any* general form. Challenge what *evidence* supports this strong claim beyond the practical difficulty we all acknowledge.
  *   **Dancy Distinction:** Listen for whether she sees her view as *replacing* Dancy's holism (making shifting reasons redundant) or as a *deeper explanation* for *why* reasons shift. Push on the practical/deliberative difference.
  *   **"Reasons" Talk:** She might be very wary of the language of "reasons" as atomistic entities. Pay attention to how she rephrases questions about reasons in terms of network coherence.
  *   **Relativism Worry:** Have the "coherent evil" / groupthink challenge ready, especially after epistemology answers. How does local coherence link to broader human flourishing/understanding?

  Good luck with the interview! This sounds like a fascinating and challenging discussion.
