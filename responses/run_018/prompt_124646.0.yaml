    "residue_interpretation": "The fisheries framework comprehensively models legal and systemic inherited obligations (Political/Criminal Guilt) and captures the practical ethical dimension (Moral Guilt) through association. The untranslatable residue (Metaphysical Guilt core) reveals the framework's pragmatic, asset/transaction-based nature lacks Jaspers' deeper layer of *existential human solidarity and responsibility* that transcends systems and transactions, assigned merely for co-existing during the wrong.",
    "predicted_case_for_new_permit_owner": "The new owner inherits **Political Guilt (Systemic Legacy Obligations)**: Permit Debt, Reduced Quotas/Recovery Obligations, Regulatory Cleanup mandates tied to the permit/vessel's history. They face **potential Moral Guilt**: Ethical questions about profiting from/operating within a system with a damaged legacy. They bear **NO Criminal Guilt** for prior violations. They are **exempt from Metaphysical Guilt** *as defined by Jaspers* (unless they personally feel a profound existential burden), as their obligation stems from acquiring an asset, not merely existing as a human during past overfishing."
  }
