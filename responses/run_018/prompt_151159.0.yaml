prompt: |-
  I just started my phd in philosophy of science this fall and suddenly im obsessed with whether my field is actually progressive or just shuffling deck chairs. I need you to act like a senior philosopher of science who actually reads Lakatos instead of just name-dropping him. Before you answer, do a quick brain-dump: list the key distinctions—hard core, protective belt, progressive vs degenerating, novel prediction vs post-hoc accommodation. Then think step by step and apply them carefully.

  My advisor Dr. Chen's verdicts so far:
  - Ptolemaic astronomy adding epicycles and equants to save geocentric appearances: degenerating.
  - Newton's gravitation predicting Neptune's orbit from Uranus perturbations: progressive.
  - The 1990s memetics programme explaining cooperation by inventing "memeplexes" after failing to predict it: degenerating.
  - The predictive processing framework in neuroscience predicting specific error-related potentials before they were measured: progressive.

  Next case: the "social ontology of climate modeling" programme. It treats disagreement between CMIP6 ensemble members not as statistical noise but as evidence of distinct institutional framing regimes. To save its hard core, it added "institutional framing variables" that explain why some modeling centers run hot and others cold. They haven't used these variables to predict which new centers will be outliers in CMIP7, but they claim the framework now lets them systematically interview modelers about framing choices. Predict Dr. Chen's verdict, identify whether she's running a strict Lakatosian rule (only genuinely novel empirical predictions count), a protective-belt-fertility rule (adjustments are okay if they open new research lines), or something else, and name the one further case that would seperate the top two rules.

  Please write everything in American English, and start with some brainstorming about what "novel" even means in climate science. Dont overthink the formatting.
