answer: |-
  ### Decision Procedure for Evaluating Diagnostic Changes (Looping Effects Analysis Protocol - LEAP)

  **Core Principles:**  
  1. **Self-Looping (S):** Does the change amplify/reduce how diagnosis alters self-understanding/identity?  
  2. **Institutional Looping (I):** Does the change interact with treatment systems, incentives, or access?  
  3. **Resistance Looping (R):** Does the change provoke evasion, appropriation, or advocacy by the classified?  

  **Operational Rules:**  
  - **Proceed:** Answer must show *no evidence* of looping or *controlled mitigation* of effects.  
  - **Stop:** Unmitigated looping effect dominates the rationale for change.  
  - **Value Judgment (VJ):** Requires sign-off by **patient advocate + ethicist** (added to group ad hoc).  
  - **Misfires:** When looping is camouflaged by data artifacts (e.g., coding errors) or cultural shifts misattributed to pathology.  
  - **False Negatives:** Occurs if genuine biological shifts are masked by institutional barriers (e.g., poor detection in marginalized groups).  

  ---

  ### Procedure Sequence  
  **Step 1: Proposed Change Rationale**  
  *Question:* What empirical data (incidence, severity, treatment response) directly supports the change?  
  - **Proceed:** Data shows objective harm/benefit mismatch (e.g., improved outcomes in trials).  
  - **Stop:** Rationale relies *solely* on prevalence shifts or clinician anecdotes.  
  - **VJ:** None.  

  **Step 2: Self-Looping Screen (S)**  
  *Question:* Does evidence suggest altered self-identification/behavior *preceded* the proposed change?  
  - **Proceed:** No self-reported identity shifts OR changes preceded data collection.  
  - **Stop:** Proposal cites self-identification as *primary* evidence (e.g., "patients demand diagnosis").  
  - **VJ:** If identity shifts are deemed clinically beneficial (requires VJ sign-off).  

  **Step 3: Institutional Looping Screen (I)**  
  *Question:* Are prevalence/data trends correlated with policy/funding changes (e.g., insurance, care models)?  
  - **Proceed:** No correlation OR correlation controlled via adjustments.  
  - **Stop:** Change rationalizes system-driven artifacts (e.g., "less beds, so fewer cases").  
  - **VJ:** If system-driven under/over-diagnosis is deemed ethically necessary (VJ sign-off).  

  **Step 4: Resistance Looping Screen (R)**  
  *Question:* Are patient/subculture movements resisting/embracing the category?  
  - **Proceed:** No documented advocacy OR resistance addressed in design.  
  - **Stop:** Change responds *only* to advocacy pressure without clinical data.  
  - **VJ:** If resisting/embracing is framed as therapeutic progress (VJ sign-off).  

  **Step 5: Integration Test**  
  *Question:* Can remaining looping effects be monitored post-implementation?  
  - **Proceed:** Surveillance plan for S/I/R effects exists.  
  - **Stop:** No monitoring possible; risk of feedback loops is high/uncontrolled.  
  - **VJ:** If monitoring burden disproportionately affects vulnerable groups (VJ sign-off).  

  ---

  ### Case Applications  
  **Case 1: Lowering age-of-onset for mood disorder**  
  - *Step 1:* Proceeds (youth symptom severity data).  
  - *Step 2:* **STOP.** Rationale cites "younger patients self-identify with diagnosis" → Unmitigated self-looping (S).  
  - *Conflict:* Clinicians intuit earlier intervention is beneficial. Procedure flags identity-driven demand as contaminant. Disagreement lies in whether self-ID is valid data or artifact.  

  **Case 2: Narrowing personality disorder criteria**  
  - *Step 1:* Prevalence drops in deinstitutionalized regions.  
  - *Step 3:* **STOP.** Correlation with reduced long-term care → Institutional looping (I). Change masks systemic bias.  
  - *False Negative Risk:* If criteria were truly over-inclusive, but procedure can’t distinguish this from I-effects without pre-policy data.  

  **Case 3: Expanding PTSD criteria after cultural trauma narrative emerges**  
  - *Step 1:* Proceeds (new trauma exposure data).  
  - *Step 4:* Resistance looping (R) detected: advocates lobby for expansion.  
  - *Step 5:* **VJ required.** Clinicians intuit expansion validates suffering. Procedure demands ethicist/advocate review: Does medicalizing cultural experience pathologize normality?  
  - *Conflict:* Clinicians prioritize inclusivity; procedure demands scrutiny of advocacy influence. Disagreement: whether clinical urgency overrides R-effects.  

  ---

  ### What the Procedure Cannot Determine  
  1. **Harm/Benefit of Identity Shifts:** Whether diagnostic changes that alter self-conception (e.g., "having ADHD" as identity) improve agency or induce stigma.  
  2. **Normative Boundaries:** Whether a behavior is "disordered" or an adaptive response (e.g., grief vs. depression).  
  3. **Epistemic Validity:** Whether looping effects obscure a "true" pathology or constitute the pathology itself.  

  **Philosophical Juncture:** At **Step 2 (S-Looping)**, when identity shifts are present, the procedure halts for VJ review. Here, the group must confront whether self-redefinition through diagnosis is *inherently distorting* (Hacking’s caution) or *therapeutically empowering* (recovery-model view). This is irreducible to empirics; it rests on conceptions of authenticity and medical authority.  

  **Misfire Example:** A surge in autism diagnoses due to destigmatization (genuine shift) might be misread as self-looping artifact, leading to false rejection of valid criteria updates.
