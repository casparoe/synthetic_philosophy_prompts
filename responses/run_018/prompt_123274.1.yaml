answer: |-
  Here’s the conceptual backbone you need, stripped to its specs:  

  **Core Desiderata for the Theory:**  
  1. **Material-Semiotic Binding:** Gender must physically "stick" to bodies through ritual, law, or violence (e.g., birth certificates, dress codes) but detach when institutions lose authority (e.g., underground communities ignoring state genders). Bodies aren’t the source—they’re the *canvas* for enforcement.  
  2. **Hysteresis Effect:** Gender persists post-repeal because it’s embedded in *habitus*—the muscle memory of social life. Like currency abandoned by a government, it retains residual value in relationships, gestures, and spatial norms until new practices overwrite it.  
  3. **Counterfeit Authenticity:** A "forged" gender works when it exploits systemic *credibility gaps*. If enough people accept the performance as transactional collateral (e.g., a "counterfeit" woman gaining entry to a women’s space), the lie becomes functionally real through collective complicity. Rejection, conversely, exposes the system’s arbitrariness but doesn’t negate the rejector’s lived truth—their gender is "hyperreal," realer than the original because it’s chosen under duress.  
  4. **Demarcation Protocol:**  
     - **Vs. Race:** Race requires *fictive lineage* (blood quantums, origin myths) to sustain intergenerational transfer. Gender relies on *immediate recognition rituals* (pronouns, restroom use)—it’s a peer-to-peer validation network, not ancestral.  
     - **Vs. Money:** Money needs *scarcity mechanics* (gold, algorithmic limits). Gender thrives on *abundance*—new genders inflate the system’s complexity but don’t devalue existing tokens; they redistribute social capital.  

  **Tension:** *Material-Semiotic Binding* (gender must anchor to bodies for enforcement) and *Counterfeit Authenticity* (gender must be detachable enough to fake/remake) strain against each other. Anchoring enables control; detachment enables subversion.  

  **Killer Desideratum:** **Hysteresis Effect** murders the usual suspects.  
  - Performativity (Butler) fails: If gender is just repeated acts, why doesn’t it dissolve when laws change? Hysteresis demands *embodied inertia*—the weight of ingrained social physics.  
  - Structural-Functionalism dies: It can’t explain counterfeit authenticity. If gender exists to stabilize society, why do "fraudulent" genders work without collapsing the system?  

  **Bottom line:** Gender is a collectively hallucinated token system where belief in its value constructs the very bodies it claims to represent.
