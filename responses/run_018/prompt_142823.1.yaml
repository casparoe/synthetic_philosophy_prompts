answer: |-
  The inkwells in the Archive of Material Particulars smelled perpetually of dust and despair. Archivist Li Mei’s knuckles were permanently stained blue from the Registry of Chromatic Phenomena, while her left thumb bore a callus shaped like the stylus she wielded for the Registry of Morphological Essences. The protocols were clear, absolute, and utterly incommensurate. Color was color. Shape was shape. Never the twain shall meet in a single entry.

  The border station processed everything: bolts of silk, sacks of grain, migratory birds, and occasionally, creatures like the one currently shifting its weight in the holding pen. A horse. A *white* horse.

  Its arrival sent a ripple of unease through the clerks. Li Mei felt it too, a familiar tightening in her chest. The Standardized Border Inventory Protocols (SBIP, Vol. VII, Annex δ) offered no guidance for this. "Equine Morphology" demanded filing under Form: Quadrupedal / Hooved / Mammalian / *Genus Equus*. "Chromatic Phenomena" required filing under Hue: Non-Pigmented / Reflective / Designated 'White'.

  But the horse… the horse was both. Simultaneously. Inseparable.

  She approached the Registries, two massive, iron-bound ledgers on separate lecterns. First, Morphology. She opened to the 'Equus' section, her stylus hovering over the 'New Entry' line. The ink hesitated, as if sensing the violation. She wrote: **Entry M-7342: One (1) Instance, *Genus Equus*, Standard Configuration.** She pressed the seal firmly. The ledger accepted it. The horse, as a *shape*, was now cataloged. But it felt incomplete, a hollow shell.

  She moved to the Chromatic Registry. Locating the 'White' sub-category under 'Achromatic Spectrum', her stylus hovered again. **Entry C-8916: One (1) Instance, Chroma Designation 'White'.** She pressed the seal. The whiteness was recorded. Yet this felt equally spectral, an attribute detached from substance.

  The horse, warm and breathing in the pen, was now **M-7342** and **C-8916**. Two entries. Two distinct, non-interacting records in the bureaucratic cosmos. Li Mei stared at the ledgers. Was it one thing, registered twice? Or two distinct phenomena – horseness and whiteness – temporarily coinciding in the holding pen? Or, more chillingly, had she created a nullity? A thing that, by exceeding the categories, effectively *did not exist* within the system? **M-7342** lacked color. **C-8916** lacked form. Neither was the white horse.

  The absurdity pressed down. She needed precedent, a loophole. Amongst crumbling scrolls in the sub-basement archive, where forgotten protocols gathered dust like ancient snow, she found it: *"Provisional Guidelines for Compound Manifestations (Superseded)"*. Her heart leapt, then sank. The text was fragmented, water-stained. One legible passage stood out:

  > *"...in cases where chromatic and morphological attributes cohere stubbornly, as in the case of the creature known as 'White Horse', the inherent contradiction renders singular classification impossible. The attributes remain ontologically discrete. Refer to Master Gongsun Long of the Legalist School for the definitive paradox: 'A horse is not a horse; a white horse is assuredly not a horse.' Thus, bifurcation is the only viable administrative procedure..."*

  Li Mei froze. *Gongsun Long? Legalist?* The misattribution was jarring. Gongsun Long was School of Names, through and through – the very architects of the paradox the SBIP now embodied in its rigid structure! The Legalists cared for law and order, not the ontological puzzles of compounded things. The manual, like the system it briefly tried to address, had garbled the source, absorbed the logic but forgotten its roots. It confirmed the impossibility, then blamed the *Legalists* for the solution.

  Back in the main archive, the white horse snorted. Its whiteness wasn't paint, wasn't separate. Its horseness wasn't a skeleton awaiting a coat. They were as intertwined as the roots of an ancient tree. Yet, in the ledgers, they were cleanly severed. **M-7342** and **C-8916**. She had followed procedure. The border had processed the horse.

  But what had crossed the border? A shape? A color? Two things? Or had the system, in its perfect, categorical isolation, failed to recognize anything coherent at all? The horse stood in the pen, a singular, undeniable presence. The ledgers showed two distinct, unrelated entries. The old manual, with its misattributed Gongsun Long, whispered of inherent contradiction. The protocols offered no category for the *compound*, only the fracture.

  Li Mei closed the heavy ledgers. The sound echoed in the silent archive. The white horse was filed. The border was secure. Yet the space between Entry M-7342 and Entry C-8916 yawned like an abyss, a perfectly bureaucratic void where a single, living creature had vanished into the machinery of distinction. She touched the cool, smooth cover of the Morphology Registry, then the slightly rougher cover of the Chromatic Phenomena. Two truths. One horse. Or perhaps none. The system hummed with the quiet efficiency of incommensurability.
