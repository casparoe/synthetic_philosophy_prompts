answer: |-
  The air in Archive Subsection Gamma hummed with the vibration of servers and the sharp scent of ozone. Elara Vanya placed her palm on the reader, her Citizen Identifier flashing green. The request form, filed under Regulation 7.3 (Personal Narrative Coherence Audit), had processed. The screen flickered, then displayed: **"Subject: Vanya, Elara. Chronological Span Requested: CY 214-217 (Post-Impact Event)."**

  A progress bar crawled. Elara’s fingers tightened on the cool metal counter. This wasn't routine. The years after the Impact Event were a blur of sterile corridors, hushed voices, and a persistent feeling of dislocation she’d meticulously papered over in her annual Narrative Summaries. *Relocation Adjustment*, she’d written. *Focused Skill Acquisition*. Phrases designed to bridge the chasm. But the nightmares – fragmented, visceral – suggested the mortar was weak.

  The screen populated. Not the seamless document stream she expected, but a sparse list:
  *   **CY 214, Q3:** *Subject relocation logged. Sector Gamma-9 Transitional Housing. (Source: Housing Authority - Automated)*
  *   **CY 215, Q1:** *Narrative Summary Filed: "Period of focused meditation and skill reassessment." (Source: Citizen Vanya, E.)*
  *   **CY 215, Q3:** *Medical Consult: Dr. Aris Thorne. (Diagnostic Codes: Classified L3). (Source: MedArch - Partial)*
  *   **CY 216, Q2:** *Employment Record Initiated: Data Triage Level 1, Archive Gamma. (Source: Labor Allocation - Standard)*
  *   **CY 217, Q1:** *Subject observed at Memorial Park Vigil. (Source: Public Surveillance Log Gamma-9 - Annotated: Facial recognition 78% match)*

  Between CY 215 Q1 and CY 216 Q2: nothing. A nineteen-month void. The meticulous bridge she’d built in her summaries dissolved. The official record held only scattered signposts around an echoing silence. Where the continuity of her self should have been anchored, there was only driftwood and the cold annotation: *Facial recognition 78% match*. Her Social Coherence Score, displayed faintly in the corner of the screen, flickered from a stable 8.7 down to 7.1.

  ---

  The physical archive, Subsection Gamma’s cold storage, smelled of dust and decaying polymer. Elara pulled the slim, sealed case tagged *Thorne, Aris - Consult CY215Q3*. The authorization glowed green – her plummeting Coherence Score ironically granting deeper access in audit situations. Inside weren’t session notes, only a single, flimsy transfer slip:
  *   **Subject:** Vanya, Elara (CI# Gamma-9-774-ElaraV)
  *   **From:** Transitional Housing Gamma-9
  *   **To:** Neurological Integration & Stabilization Centre - **Wing D**
  *   **Date:** CY215, Day 87
  *   **Authorization:** Directive Kappa-7 (Temporary Cognitive Realignment)
  *   *(Handwritten annotation in faded blue ink: "Standard Kappa protocols initiated. Duration indeterminate. Subject unresponsive Q1-Q4 CY216. Recommend archival purge post-stabilization? - A.T.")*

  *Wing D.* The words landed like stones. She remembered white rooms, true, but not *that* Wing. Kappa-7 protocols were whispers, things hinted at in hushed tones after the Impact for those fractured beyond easy narrative repair. *Unresponsive.* *Archival purge.* The record wasn't just incomplete; it was actively contradictory. Her own filed summary claimed "focused meditation." The housing log showed occupancy. Yet here was proof of a nineteen-month erasure, not by her, but by the system itself, annotated with a doctor’s casual suggestion for oblivion. The "center" wasn’t a core; it was a palimpsest, overwritten by convenience.

  ---

  Form 7-C: *Continuity Affidavit & Narrative Gap Reconciliation* lay before her on the sterile desk in the Audit Chamber. Section A required a "plausible account" bridging CY215 Q1 to CY216 Q2, incorporating the "known data points." Section B mandated a signature affirming the narrative as "personally verified experiential truth." A digital pen rested beside it. Her Social Coherence Score pulsed softly on the wall panel: 6.9. Below 6.0 lay Provisional Status, then Fragmentation. Loss of property rights. Loss of vote. Loss of *weight*.

  Elara picked up the pen. She could craft it. *Extended retreat under Dr. Thorne’s care.* *Private meditation wing.* *Intensive neurological rehabilitation leading to successful Data Triage employment.* Words to suture the wound in time, to pull the scattered fragments back into orbit around a fabricated center. The system craved it. It would believe it. Her score would stabilize, climb. She would remain Elara Vanya, whole.

  Her gaze drifted to the alternative, Form 7-D: *Declaration of Narrative Discontinuity & Fragmentation Status Application*. Filing it meant accepting the rupture. The nineteen-month void would become part of her legal identity. She would be Elara Vanya *and* the unresponsive subject in Wing D *and* the 78% match at the vigil – distinct fragments held by a name, but no longer striving for gravitational unity. Her properties would be held in trust, her vote suspended, her presence in the world… lighter. Dispersed.

  The pen hovered. She thought of the blue ink annotation – *Subject unresponsive Q1-Q4 CY216* – a truth the system tried to erase. She thought of the persistent nightmares, the raw edges of memory the smooth narrative had never truly contained. Fabrication offered solid ground. Honesty offered… something else. Not oblivion, but a different kind of existence, acknowledging the fissure the archives themselves revealed.

  Slowly, deliberately, Elara set the pen down beside Form 7-C. She reached instead for Form 7-D. Her hand was steady as she pressed her thumb to the biometric pad at the bottom. The wall panel flickered. **Social Coherence Score:** *N/A*. **Status:** *Pending Fragmentation Assessment*. The air didn’t change, but the silence felt different. Lighter, perhaps. Or simply unbound.
