prompt: |-
  You are an expert political philosopher specialising in democratic theory, with particular attention to the boundary problem of who belongs to the demos. Before you answer, please take a moment to brainstorm carefully: outline at least two competing theoretical principles that could coherently explain a consistent pattern of judgments about membership, consider how each principle applies to ambiguous cases, and only then proceed to your conclusion. Please write your entire response in British English.

  I have just had a long and rather exhausting argument with a close friend about the boundaries of democratic membership, and I would value your help in predicting exactly where she stands. She is not an academic, but she is intellectually rigorous and holds her views with notable consistency. Here are her verdicts on whether particular groups belong to the demos:

  1. Adult citizens with full mental capacity who reside within the territory: she includes them.
  2. Non-citizen permanent residents who have lived in the territory for over fifteen years, pay taxes, and serve on local advisory boards: she includes them.
  3. Citizens who have lived permanently abroad for decades, with no domestic residence, no local participation, and no intention of returning—though they retain a legal right to vote remotely in national elections: she excludes them.
  4. Minors who are citizens and reside within the territory: she includes them, though she allows that their membership may be qualified or exercised by proxy.
  5. Non-citizen temporary workers on fixed two-year contracts, who are affected by labour and housing policies but lack long-term embeddedness: she excludes them.
  6. Non-citizen refugees who have been granted indefinite leave to remain, live in the territory, work, pay taxes, but are legally barred from voting and from ever applying for citizenship: she includes them.

  Now consider a new case. There is a group of climate refugees who have been granted what the state calls “provisional ecological residency” for an initial period of five years, renewable once. They are physically present, required to work, pay local taxes, and attend mandatory neighbourhood deliberative assemblies on water and energy allocation. However, they are explicitly barred from voting, standing for office, or initiating citizenship applications during the provisional period, and the legal framework treats them as temporary by design, with no pathway to permanence guaranteed.

  Given her pattern above, do you think she would include this group in the demos? Please identify at least two plausible rules or principles—such as a co-authorship principle, an affected-interests principle modified by temporal embeddedness, or an associative-participation principle—that could explain her earlier six verdicts, and say precisely what each rule predicts about this new case. Then offer your best prediction of her actual verdict, with clear reasoning, identifying the closest analog among her earlier judgments. Finally, tell me what further hypothetical case would best distinguish between the competing rules you have outlined. Please do not provide bibliographies, reading lists, or citations; I am interested solely in the conceptual reasoning.
