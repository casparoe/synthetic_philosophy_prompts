prompt: |-
  I am a senior undergraduate in a seminar on ancient moral philosophy and the uses of biography, and I am preparing an interview for our department podcast with an invited speaker—Dr. Samuel Okonkwo—who has recently advanced a defense of what he calls hagiographic pedagogy. Okonkwo argues that Plutarch’s Parallel Lives should be read not as flawed historiography but as a deliberate moral technology: he claims Plutarch practices characterological magnification, selectively amplifying virtues and vices so that the reader can achieve proximate exemplarity, a form of moral learning that requires aspirational identification rather than balanced judgment. He further holds that the synkrisis sections do not aim at neutral historical evaluation but generate productive moral tension through asymmetrical pairing, in which the Greek and Roman figures are not equivalents but foils calibrated to different ethical failures.

  Please draft eight to ten interview questions that press the actual content of this position rather than asking for biography, overview, or methodological preliminaries. The tone should be formal and appropriate for an academic colloquium.

  I want at least one question addressing the epistemic danger that a learner might internalize a distorted portrait as factual belief about a historical agent; include a follow-up anticipating Okonkwo’s likely reply that moral knowledge and historical knowledge have different validation conditions, and press whether that distinction collapses when the learner cannot separate the two.

  I also want at least one question on Plutarch’s well-known distinction between writing lives and writing histories—specifically, whether that distinction licenses the kind of selective distortion Okonkwo defends, or whether it merely marks a genre boundary without normative weight. Include a follow-up that challenges him if he appeals to authorial intention.

  Another required cluster: ask how this model survives modern skepticism about hero-worship and the great-man theory of history—particularly whether magnifying individual character obscures structural and institutional conditions of virtue. Anticipate that he might respond by saying biography is micro-ethical rather than macro-political, and prepare a follow-up that presses whether that separation is stable once the magnified life is offered as a normative model.

  Finally, include a question about vice: if hagiographic pedagogy magnifies virtue for identification, must it also magnify vice in the paired figure to maintain narrative coherence, and does that risk making vice aesthetically attractive or morally contagious? Give a follow-up keyed to his probable claim that vice in Plutarch functions as a cautionary mirror rather than a seductive model.

  Do not ask for citations, reading lists, or bibliographic references. The questions should assume familiarity with Plutarch’s paired structure and with contemporary debates about moral exemplars, but should not depend on knowledge of obscure texts beyond what a student in this course would have encountered.
reasoning: |-
  Okay, the user is a senior undergrad preparing for a podcast interview with Dr. Okonkwo about Plutarch's hagiographic pedagogy. They need sharp, content-focused questions that avoid biographical fluff. Let me unpack their requirements carefully.

  First, the core of Okonkwo's argument: Plutarch as moral technologist using "characterological magnification" and "asymmetrical pairing" to create aspirational models. The questions must probe this directly. The user specified four critical angles - epistemic risks, Plutarch's history/lives distinction, modern skepticism about hero-worship, and the treatment of vice. Each needs layered follow-ups.

  For the epistemology question: The danger isn't just factual distortion but whether learners can compartmentalize moral vs historical truth. If Okonkwo claims different validation conditions, we need to challenge how that holds when readers internalize both simultaneously. The follow-up should press the collapse of that separation - maybe asking about cognitive dissonance or unintended belief formation.

  On Plutarch's famous distinction: Does "writing lives" actively permit ethical curation, or is it just a genre label? If Okonkwo leans on authorial intent, the follow-up should question whether intention immunizes against pedagogical harm. Could reference how genre expectations don't dictate reader reception.

  Modern skepticism is tricky. Okonkwo will likely retreat to "micro-ethics," so the follow-up must attack the micro/macro divide. If a magnified life becomes normative, doesn't it implicitly endorse individual agency over structures? Should ask whether virtue can be modeled without addressing its societal preconditions.

  The vice question needs care. Plutarch often makes villains fascinating (Coriolanus!). If Okonkwo calls them "cautionary mirrors," the follow-up should question emotional resonance - does vivid vice risk glamorization despite moral framing? Could cite Aristotle on tragedy's catharsis gone wrong.

  Tone calibration: Formal but not stilted. Since it's for undergrad listeners, avoid jargon like "hermeneutics" but keep conceptual precision. No name-dropping obscure texts - stick to well-known Lives like Alexander-Caesar.

  Structure check: Must include all four mandated clusters. That's 4 questions + 4 follow-ups, leaving room for 2-4 standalone probes. Good candidates: how magnification handles moral complexity (e.g., Cato's suicide), or whether synkrisis requires cultural essentialism in Greek/Roman pairings.

  User's hidden needs: They want to sound rigorous without alienating the guest. Questions should be incisive but leave room for Okonkwo's expertise. Also, the podcast format means answers should be digestible - no 10-part compound questions.
answer: |-
  Here are ten interview questions designed to rigorously engage Dr. Okonkwo's core thesis on hagiographic pedagogy in Plutarch, adhering to your specifications regarding tone, content focus, and required clusters:

  1.  **Core Mechanism:** You characterize Plutarch's method as "characterological magnification" to achieve "proximate exemplarity." Could you elaborate on how this selective amplification *operates differently* from simple idealization? Specifically, how does it avoid creating unattainable paragons while still enabling "aspirational identification"?
      *   *(Follow-up if needed):* Taking a figure like Alexander, magnified for daring: does magnification *require* downplaying his moments of rash cruelty, or can it incorporate them pedagogically?

  2.  **Synkrisis & Asymmetry:** You argue the *synkrisis* generates "productive moral tension" through "asymmetrical pairing," where figures are foils for different ethical failures, not equivalents. Could you illustrate this asymmetry concretely with one pair (e.g., Demosthenes-Cicero, Alexander-Caesar)? What distinct ethical failure is each figure primarily calibrated to illuminate in the reader, and how does the asymmetry create tension rather than simple contrast?

  3.  **Epistemic Danger Cluster:** A core pedagogical concern is that learners might internalize Plutarch's magnified portraits as factual historical beliefs. How does your model of "hagiographic pedagogy" safeguard against this epistemic danger, given its reliance on selective amplification?
      *   *(Anticipated Follow-up):* You might respond that moral knowledge (grasping virtue) and historical knowledge (factual accuracy) have distinct validation conditions. But if the learner cannot readily separate the magnified, virtue-focused portrait from their understanding of the historical agent *as such*, doesn't the distinction collapse in practice, risking a fundamentally distorted historical consciousness?

  4.  **Plutarch's Distinction Cluster:** Plutarch famously distinguishes writing "lives" from writing "history." Does your defense of selective amplification as "moral technology" rely on interpreting this distinction as a normative license for pedagogical distortion, or merely as a descriptive genre boundary without inherent ethical justification?
      *   *(Anticipated Follow-up):* If you appeal to Plutarch's authorial intention to justify the amplification, how do you address the concern that intention alone cannot resolve the ethical and epistemic problems potentially arising from the pedagogical *effects* of that distortion, regardless of genre?

  5.  **Vice & Narrative Coherence Cluster:** If "hagiographic pedagogy" necessitates magnifying virtue in one life for aspirational identification, does it *also* demand a corresponding magnification of vice in the paired figure to maintain narrative and ethical coherence within the *synkrisis*? If so, doesn't this risk making that vice – through vivid portrayal – aesthetically attractive or morally contagious, undermining the cautionary intent?
      *   *(Anticipated Follow-up):* You might argue vice functions purely as a "cautionary mirror." But given the literary power Plutarch invests in his portrayals (e.g., Antony's passions, Coriolanus's pride), how does the pedagogy prevent the *vividness* of the vice from becoming seductive or fostering a prurient fascination that overshadows the intended moral lesson?

  6.  **Modern Skepticism Cluster:** Your model seems vulnerable to modern critiques of "hero-worship" and the "great man" theory of history. Doesn't Plutarch's focus on magnifying *individual* character, even for micro-ethical ends, inevitably obscure the structural, institutional, and socio-political conditions that shape virtue and vice, potentially promoting an overly individualistic and decontextualized view of morality?
      *   *(Anticipated Follow-up):* If you counter that biography is inherently "micro-ethical" rather than "macro-political," how stable is that separation when the magnified life is presented not just as an object of study, but as a *normative model* for emulation? Doesn't offering such a model implicitly suggest that individual character, magnified as Plutarch does, is the primary locus of ethical agency, thereby marginalizing structural factors?

  7.  **Complexity & Ambiguity:** Plutarch often portrays figures with significant moral complexity and ambiguity (e.g., Cato the Younger's rigidity, Alcibiades' brilliance and treachery). How does "characterological magnification" handle such internal contradictions? Does it risk simplifying them to fit a clearer virtue/vice paradigm, or can magnification encompass and pedagogically utilize ethical ambiguity itself?

  8.  **The Limits of Proximacy:** You posit "proximate exemplarity" as the learning goal. How does this model account for figures whose magnified virtues might be contextually alien or even repugnant to a modern reader (e.g., extreme martial valor linked to conquest, unwavering piety involving animal sacrifice)? Can "proximacy" still function effectively, or does magnification here reveal a potential cultural limitation of the pedagogy?

  9.  **Synkrisis as Catalyst:** Beyond identifying foils, you describe the *synkrisis* as generating "productive moral tension." Could you elaborate on the specific *cognitive or affective process* this tension is meant to catalyze in the reader? Is it primarily comparative judgment, self-reflection, a sense of conflict, or something else entirely?

  10. **Pedagogical Success Criteria:** Finally, based on your model, what concrete evidence or observable outcome would signify the *successful* operation of "hagiographic pedagogy" in a reader? Is it a change in deliberation, a shift in desires, concrete action, or a refined capacity for ethical perception? How would we know if Plutarch's "moral technology" actually worked as intended?

  These questions maintain a formal academic tone, assume familiarity with Plutarch's structure and core themes, delve deeply into the conceptual mechanics and implications of Okonkwo's thesis, and rigorously address the specific critical clusters you requested without venturing into biography, methodology preliminaries, or bibliographic requests.
