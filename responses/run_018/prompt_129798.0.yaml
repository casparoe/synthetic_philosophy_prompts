  we have about 14 grad students, 75 minutes, one session. can you design an in-class game where everyone starts with equal token bundles, one student can offer a 'performance' others pay for voluntarily, but there's also a hidden rule — the historical shadow clause — letting the group vote to retroactively adjust prior transfers if they think the rolling baseline got violated? use real small stakes (like candy or points that decide who picks teh music next session), give me clear rules, roles, a payoff scheme, and a timeline. then include a debrief that maps what actually happened onto Nozick's three principles — acquisition, transfer, rectification — and be honest about which feature of his view the game can't reproduce and i'll have to supply verbally. also tell me what will predictably go wrong the first time i run it. please don't just recycle the standard Chamberlain example; build the rolling-baseline twist into the mechanics so the idea has to emerge from the play, not from a lecture afterwards.
