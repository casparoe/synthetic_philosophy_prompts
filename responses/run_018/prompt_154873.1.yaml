  Wait, the user mentioned the board is split. My recommendation must be practical. Outright rejection risks stifling innovation, but approval without safeguards might endorse pseudoscience. Conditions feel balanced: demand rigorous controls to isolate symbolic causality (e.g., tag-swap tests, substrate inertia checks). The biggest risk is mistaking correlation for causation, so the memo should stress testability. 

