  2. It may tacitly combine incompatible views: one prioritizing behavioral complexity (e.g., enrichment for crustaceans) and another accepting reflexive responses as sufficient for fish welfare—effectively blending cognitive ethology with behaviorist reductionism.  
  3. The asymmetry cannot be sustained by a single coherent theory; appeals to future-oriented cognition would undermine crustacean protections, while replaceable-individual logic contradicts the scheme's core sentience framework applied to crustaceans.  
  4. Under a theory assigning welfare weight solely based on integrated subjective experience, ice-slurry asphyxiation for finfish would be prohibited (requiring pre-slaughter stunning) and analgesia would become mandatory for invasive procedures like fin-clipping.  
  5. Provisions awarding welfare credit for species-specific behavioral opportunities (e.g., burrowing substrate) might survive intact, as environmental enrichment could remain empirically justifiable for enhancing experiential welfare regardless of taxonomic class.
