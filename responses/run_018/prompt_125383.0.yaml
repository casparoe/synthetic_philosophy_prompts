  I was recently appointed to an advisory panel revising welfare protocols for a multi-species aquaculture certification scheme, and an asymmetry in our own standards has become personally urgent to resolve. We mandate electrical pre-slaughter stunning for decapod crustaceans—lobster, crab, and shrimp—on the grounds that integrated nociception makes them capable of suffering that demands direct mitigation. Yet for farmed salmonids and other finfish falling under the same sentience framework, we continue to permit ice-slurry asphyxiation and do not require analgesia for invasive husbandry practices such as fin-clipping or eye-tagging, provided mortality rates stay beneath a fixed threshold. At the same time, our audit rubric awards welfare credit for behavioral opportunity—burrowing substrate for shrimp, vertical structure for crabs—while treating the absence of an observable withdrawal reflex as sufficient proof that a procedure is humane for fish. What philosophical commitments about the nature of suffering, the calibration of moral status across phyla, and the relation between behavioral complexity and experiential harm does this specific institutional pattern presuppose? Can the asymmetry be sustained by a single coherent theory—perhaps one that weights future-oriented cognition above present-moment sentience, or one that distinguishes replaceable individuals from intrinsically valuable ones—or does it tacitly combine incompatible views? And if we replaced the implicit theory with one that assigns welfare weight solely on the basis of integrated subjective experience regardless of taxonomic class, which provisions in the scheme would necessarily change and which might survive intact?

  Please present your answer as a numbered list of exactly five items, each consisting of one or two sentences, with no introductory or concluding remarks.
