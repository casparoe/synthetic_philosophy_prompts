prompt: |-
  I was talking with friends in my phil of mind cource about whether consciousness is just a user illusion — like a dashboard that hides the real machinery — and we got stuck trying to imagine a real-world case that seperates that view from higher-order representationalism. Can you build me a thought experiment? Specs: one paragraph, totally realistic (no brain chips, no demons, no perfect predictors), involving something like anosognosia for blindness or a similar condition where first-order visual processing seems present but self-monitoring is clearly disrupted. I want the user-illusion theorist to say yes, still conscious, the interface is just buggy and misreporting, while the higher-order theorist says no consciousness here, because there's no higher-order representation of those visual states. After the scenario, walk through both reasonings step by step, point out the exact feature that pulls them apart, and tell me what happens if you strip that feature away — does the disagreement collapse? Also say how the losing side would likely attack the setup. No citations or reading lists please, I can't check those right now, and I'm writing this late so there might be a typo or two.
