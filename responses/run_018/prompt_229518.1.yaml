answer: |-
  Here's a breakdown of "hard work never killed anybody" for your scene, moving from defensible to indefensible, focusing on where the owner's logic fails even if the line *feels* true:

  1.  **Literal & Trivial Reading:** "The abstract *concept* of 'hard work' as an ideal doesn't physically kill people."
      *   **True?** Technically yes. Nouns don't kill people.
      *   **Defensible?** Only in a pointless, semantic debate. Nobody uses the phrase this way seriously.
      *   **Supports dismissing collapse?** **No.** Utterly irrelevant to a real person fainting. Using it this way is pure deflection, exposing the owner's avoidance.

  2.  **Effort vs. Harm Reading:** "Exerting yourself physically or mentally *to a reasonable degree* with proper rest and safety isn't inherently fatal."
      *   **True?** Generally yes. Humans are built for effort.
      *   **Defensible?** Yes, as a general principle against laziness *in contexts with safeguards*.
      *   **Supports dismissing collapse?** **No.** The fainting is *prima facie* evidence that the effort demanded **exceeded** "reasonable degree" and/or lacked "proper rest/safety." The collapse proves the conditions *were* harmful. The owner ignores the specific context where the platitude breaks.

  3.  **Character-Building Reading:** "Facing demanding challenges makes you stronger/resilient; avoiding difficulty weakens you."
      *   **True?** Partially true *within limits* (e.g., training, manageable stress). The "never killed anybody" part is demonstrably false (karoshi, accidents from fatigue).
      *   **Defensible?** Reasonable people can debate *optimal* challenge levels, but the absoluteness ("never killed") is indefensible.
      *   **Supports dismissing collapse?** **Ineffectively & Cruelly.** Collapsing isn't "challenge," it's **system failure.** Using it here confuses resilience with recklessness. It suggests the *sous-chef* failed the "test," not that the *conditions* were the problem. This is where the owner likely *thinks* it applies, but the gap is huge.

  4.  **Survivorship Bias Reading:** "*I* worked insane hours and I'm fine, so it can't be that bad / it builds character."
      *   **True?** For *that individual*, maybe. As a universal rule? False.
      *   **Defensible?** Only as anecdotal experience, not as policy or dismissal of others' suffering. Ignores those who *weren't* fine.
      *   **Supports dismissing collapse?** **Arrogantly & Illogically.** The owner uses their personal tolerance (or luck) to invalidate the sous-chef's physical reaction. The collapse directly contradicts the owner's implied "it's safe for everyone."

  5.  **Hard Work vs. Unsustainable Conditions Reading:** (The Owner's *Implied* Meaning) "The *demands of this job* (long hours, high stress, no breaks, relentless pressure) are just 'hard work' and inherently safe."
      *   **True?** **False.** This conflation is the core fallacy. "Hard work" becomes a euphemism for *exploitative, unsafe conditions*.
      *   **Defensible?** **No.** Karoshi, industrial accidents, stress-induced illness, and **fainting** prove this false. Reasonable people distinguish effort from endangerment.
      *   **Supports dismissing collapse?** **This is the owner's goal, but it's built on sand.** The collapse is **direct evidence** that the conditions *are* dangerous. The phrase deflects by reframing the dangerous conditions as merely "hard."

  6.  **Intentional Harm Denial Reading:** "If someone dies or is harmed directly by overwork (heart attack, accident caused by fatigue), it wasn't *really* the work, it was an underlying condition/personal weakness."
      *   **True?** **False and dangerous.** Overwork is a well-documented contributing or primary cause.
      *   **Defensible?** **No.** Medical and legal consensus rejects this. It's victim-blaming.
      *   **Supports dismissing collapse?** **Cynically.** It primes the response: "The fainting wasn't the hours/stress, it was because they didn't eat breakfast/was weak/had an undisclosed condition." Lets the owner off the hook.

  **For Your Pushback Character: Target the Gaps (Especially #3 & #5)**

  *   **Expose the Conflation (#5):** "Collapsing *isn't* hard work, Chef. It's what happens *after* hard work becomes something else. The work didn't kill them *today*, but this," (gestures to fallen colleague, the chaos) "...this is the system failing. Calling it just 'hard work' is a lie we tell to keep the wheels falling off."
  *   **Challenge the Character-Building Fallacy (#3):** "Resilience isn't built on collapse, Chef. It's built on knowing when to hydrate, when to step off the line for 30 seconds, when the pace is unsustainable *before* someone hits the deck. This isn't toughness; it's neglect. It makes us *weaker*, not stronger."
  *   **Highlight the Specific Harm vs. Abstract Platitude (#2 & #5):** "Maybe the *idea* of hard work never killed anybody. But 16 hours without a break, no food, and that heat? That's not an idea. That's what just dropped [Sous-Chef's Name]. 'Hard work' didn't do that. *These conditions* did."
  *   **Focus on the Warning Sign (#2 & #5):** "They didn't die. *This time.* This is the 'never killed anybody' part you're clinging to. But fainting is the damn warning light blinking red. Ignoring *this* is how people *do* get killed. Saying the phrase doesn't make the danger disappear."

  The power comes from showing the owner isn't just *lying*, but fundamentally **misapplying a half-truth** (#3 - character building) to **excuse dangerous conditions** (#5 - conflation) **in the face of direct evidence** (the collapse) that the platitude doesn't fit the reality. The pushback character forces the distinction between "effort" and "exploitation," and between a motivational saying and a dismissal of concrete harm. Good luck with the scene!
