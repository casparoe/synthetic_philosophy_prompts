prompt: |-
  I'm currently enrolled in an upper-division seminar on freedom and the state, and I assist at a city equity-review desk that screens proposed ordinances for liberty costs. Please translate the distinctions among negative liberty (absence of interference), positive liberty (self-mastery), and republican liberty (non-domination or absence of arbitrary power) into a practical, reusable decision procedure—ordered tests with pass-fail criteria, explicit points where classification fails and a reviewer must decide, and a clear statement of what the procedure cannot settle. Apply it to two ordinances: a mandatory vaccination rule for municipal workers that limits bodily choice for collective health, and an opaque algorithmic welfare-eligibility tool that reranks applicants using hidden risk scores with no appeal mechanism, which my office favors but which I need rigorously tested. Deliver the response as exactly five numbered points, each one or two sentences, with no introduction or conclusion: point 1 should state the negative-liberty interference filter; point 2 the positive-liberty autonomy filter; point 3 the republican domination and arbitrariness filter; point 4 should run both cases on the vaccination mandate and note the acceptable trade-off; point 5 should run them on the algorithmic welfare tool, reach the unwelcome conclusion that it creates domination, and flag the value judgments the procedure leaves open.
reasoning: |-
  Okay, the user is asking for a practical decision procedure to evaluate ordinances based on three concepts of liberty: negative, positive, and republican. They're working on a city equity-review desk and need this for real-world application. 

  First, I need to recall the definitions clearly. Negative liberty is about absence of interference - think Isaiah Berlin's classic formulation. Positive liberty involves self-mastery and capability to act. Republican liberty, from thinkers like Pettit, focuses on non-domination and absence of arbitrary power. 

  The challenge is making these philosophical concepts operational. The user wants pass-fail tests with clear failure points - this suggests they deal with ambiguous real cases where ordinances don't neatly fit categories. The two test cases are particularly thorny: a vaccination mandate (which pits bodily autonomy against public good) and an algorithmic welfare tool (which raises transparency issues).

  For the procedure structure: Point 1 must test for direct interference. The vaccination mandate clearly interferes with bodily choices, so it fails negative liberty. But the user mentions "acceptable trade-off" later, so the test needs to identify interference without judging justification yet. 

  Point 2 for positive liberty is trickier. Self-mastery could mean many things. I'll focus on whether the ordinance systematically blocks individuals' capacity to pursue their ends. The welfare algorithm might pass this superficially since it doesn't directly stop action, but fails on deeper capability grounds.

  Point 3 on republican liberty is crucial for the algorithm case. Non-domination requires both avoiding arbitrary power and providing recourse. The hidden scoring with no appeal is textbook domination - even if the outcomes are fair, the process is arbitrary.

  Noticing the user's tension: they say their office favors the algorithm but they personally need rigorous testing. This suggests bureaucratic vs ethical conflict. My analysis must be bulletproof because they'll likely face pushback when flagging the algorithm as dominating.

  For the vaccination case, I'll note it fails negative liberty but may be justified - the procedure should identify the trade-off without prescribing the outcome. For the algorithm, the conclusion must be unambiguous: no recourse mechanism makes it domination by definition. But I should flag that the reviewer still must decide whether efficiency gains outweigh this - the procedure exposes the problem but doesn't resolve value conflicts.

  The five-point format is strict. Each point must pack maximum clarity in 1-2 sentences. No fluff - this is for bureaucratic use. Key phrases: "pass-fail criteria", "explicit points where classification fails", "what the procedure cannot settle". The user is clearly drafting something for official use.
answer: |-
  1. **Negative-liberty interference filter**: Fail if the ordinance imposes direct external constraints preventing individuals' chosen actions without consent; pass only if no such interference exists or if narrowly tailored necessity overrides in extreme cases (e.g., imminent public harm).  
  2. **Positive-liberty autonomy filter**: Fail if the ordinance systematically undermines individuals' capacity/resources for meaningful self-direction or goal-pursuit; pass only if it demonstrably expands essential capabilities without coercively imposing specific ends.  
  3. **Republican-liberty domination filter**: Fail if the ordinance enables arbitrary power (unchecked, unpredictable, or non-responsive discretion) over individuals' choices, even if unexercised; pass only if it includes robust safeguards against arbitrary interference (e.g., transparency, appeal rights, proportionality review).  

  4. **Vaccination mandate application**: Fails negative liberty (bodily interference) and *may* pass positive liberty (if enhancing collective capacity for public participation), but crucially passes republican liberty with non-arbitrary design (clear health necessity, medical exemptions, scientific review). Acceptable trade-off hinges on necessity/proportionality balancing.  
  5. **Algorithmic welfare tool application**: Passes negative liberty (no direct interference) and *may* pass positive liberty (if efficient resource allocation expands capabilities), but definitively fails republican liberty due to opaque/unchallengeable arbitrary power (hidden scores, no appeal). Domination is structural; unresolved is whether efficiency justifies non-arbitrariness erosion.
