  ### Credence Decomposition:
  1.  **Prior for Hierarchical Predictive Processing (HPP) as general affective framework:**  
      **0.70**  
      *Justification:* HPP has strong empirical traction in neuroscience (e.g., Friston, Seth) and explains key features of affect (e.g., valence as precision-weighting, arousal as prediction error), but remains contested for higher-order emotions.  

  2.  **Normative content embedded in predictive dynamics (vs. post-hoc judgment):**  
      **0.60**  
      *Justification:* Evidence from embodied cognition (e.g., "moral gut feelings") and neuroeconomics (e.g., anterior insula encoding norm violations pre-reflectively) supports integration, but disentangling dynamic encoding from rapid cognition is challenging.  

  3.  **Moral emotions uniquely involve structural normative encoding:**  
      **0.55**  
      *Justification:* Moral emotions (e.g., guilt/shame) show distinct neural profiles (e.g., dorsomedial PFC/anterior cingulate engagement in social prediction errors) and elicit specific behavioral affordances, yet boundary disputes with "non-moral" emotions (e.g., disgust) weaken distinctiveness.  

  4.  **Pure theories (judgment/perception/feeling) collectively fail:**  
      **0.75**  
      *Justification:* Judgment theories poorly explain quick, visceral moral reactions; perceptual accounts struggle with non-sensory "oughtness"; pure feeling theories cannot account for cognitive stability in moral sentiments.  

  ---

  ### Synthesis of Overall Credence:  
  I combine these **multiplicatively**, as each term represents a *necessary condition* for the hybrid theory to be strictly closer to truth than *any* pure alternative. The hybrid requires HPP’s validity *and* embedded normativity *and* moral distinctiveness *and* the inadequacy of pure theories. Assuming approximate independence:  
  **Overall Credence = (i) × (ii) × (iii) × (iv) = 0.70 × 0.60 × 0.55 × 0.75 ≈ 0.173**  
  *Rounded to* **0.17**  

  ---

  ### Sensitivity Analysis:  
  - **Least Confident Term:** (iii) Moral emotions' *structural distinctiveness* (**0.55**).  
  - **Key Shifting Evidence:**  
    - *Empirical:* Cross-cultural fMRI studies identifying invariant neurocomputational signatures *specific* to moral emotions (e.g., guilt) versus generalized negative affect (e.g., fear).  
    - *Conceptual:* A unified model showing moral emotions solve unique computational problems (e.g., recursive reputation management) via normative precision adjustments.  
  - **Sensitivity Comparison:**  
    A ±0.15 shift in (iii) (e.g., 0.55 → 0.70) alters the overall credence by ±0.03 (to **0.20**). By contrast, switching to a *weighted average* (equal weights) yields **0.65**—a divergence of **0.48**. Thus, the final number is **more sensitive to the choice of combination rule** than to movement in (iii).  

  ### Rationale for Multiplicative Rule:  
  The hybrid theory’s superiority depends on *all four conditions holding simultaneously*. If HPP is false (i=0), the framework collapses; if pure theories adequately explain the data (iv=0), the hybrid adds no value. Multiplicative combination correctly penalizes joint uncertainty. Averaging would overstate credence by implying compensation (e.g., high (iv) could "rescue" low (iii), which isn’t logically coherent here).
