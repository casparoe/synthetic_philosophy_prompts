answer: |-
  Below is a conceptual architecture for your feature, mapping the requirements an adequate theory of artistic value must meet to disentangle three distinct moral failures. The framework prioritizes **case-based robustness**, **conceptual distinctions**, and **empirical constraints**, while highlighting fault lines in existing positions.

  ---

  ### **I. Desiderata: Core Requirements**  
  *(Non-negotiable = Necessary for any coherent theory; Camp-specific = Favored by particular viewpoints)*

  1. **Case-Handling Robustness**  
     - **Requirement**: Must evaluate all four cases distinctly without defaulting to a single moral lens.  
     - **Motivating Cases**:  
       - *Violent Artist’s Portrait*: Masterful technique by a perpetrator of violence (e.g., a domestic abuser).  
       - *Collaborative Fraud*: Installation co-created by multiple artists, one of whom committed financial fraud unrelated to the work.  
       - *Hypocritical Film*: A film condemning exploitation but produced via exploitative labor.  
       - *Stolen-Training AI Image*: Digital art generated via datasets from stolen archives, with no human "author."  
     - **Status**: **Non-negotiable**. Failure here collapses the distinctions central to your thesis.  

  2. **Tripartite Distinction Preservation**  
     - **Requirement**: Must rigorously separate:  
       - **(A) Biographical Flaw**: Moral failure in the creator’s life (e.g., violence, fraud).  
       - **(B) Content Flaw**: Moral failure embedded in the work’s *representation* (e.g., racist imagery).  
       - **(C) Production/Circulation Flaw**: Moral failure in the work’s *making/distribution* (e.g., exploited labor, stolen data).  
     - **Motivation**: Prevents automatic "contagion" (e.g., assuming a violent artist’s work *must* glorify violence).  
     - **Status**: **Non-negotiable** for your framework; **contested** by pure moralists (who see all flaws as linked).  

  3. **Content Autonomy**  
     - **Requirement**: A work’s representational content (B) must be evaluable independently of biographical flaws (A) or production flaws (C).  
     - **Motivating Case**: *Hypocritical Film*—its narrative condemning exploitation should not be automatically invalidated by its production ethics.  
     - **Status**: **Non-negotiable** for moderates/formalists; **rejected** by pure moralists.  

  4. **Material Conditions Matter**  
     - **Requirement**: Production/circulation flaws (C) must affect artistic value *without* reducing to biography (A) or content (B).  
     - **Motivating Cases**: *Stolen-Training AI Image* (theft in sourcing) and *Hypocritical Film* (exploitative labor).  
     - **Status**: **Camp-specific**:  
       - Non-negotiable for contextualists/production-focused ethicists.  
       - Rejected by formalists (who consider only the artifact).  

  5. **Empirical Guardrails**  
     - **Requirement**: Must align with findings from moral psychology/aesthetics:  
       - (i) Knowledge of an artist’s crimes *can* alter aesthetic perception (e.g., studies show diminished pleasure in viewing art by morally condemned artists).  
       - (ii) Moral disgust operates semi-independently of aesthetic judgment (e.g., people often condemn content like racist propaganda while acknowledging technical skill).  
     - **Motivation**: Prevents theories from ignoring how humans *actually* experience art.  
     - **Status**: **Non-negotiable** (empirical reality); **ignored** by extreme formalism.  

  ---

  ### **II. The Destabilizing Desideratum**  
  **Material Conditions Matter** does the most damage to all three common positions:  
  - **Pure Formalism**: Collapses by requiring external factors (production ethics) to matter.  
  - **Pure Moralism**: Undermined by treating production flaws (C) as distinct from authorial sin (A)—e.g., the *Collaborative Fraud* case challenges guilt-by-association.  
  - **Moderate Separatism** ("internal properties only"): Falters by demanding that *external* production conditions (C) affect value.  

  ---

  ### **III. Unsatisfiable Pair**  
  **Content Autonomy** and **Material Conditions Matter** are in tension:  
  - **Conflict**: Content Autonomy demands judging a work’s message independently of its production (e.g., *Hypocritical Film*’s anti-exploitation theme). But Material Conditions insists production flaws (exploitative labor) diminish the work’s value. Reconciling this without contradiction is unresolved.  
  - **How Positions Fare**:  
    - **Formalism**: Satisfies Content Autonomy but rejects Material Conditions → incomplete.  
    - **Moralism**: Rejects Content Autonomy (production flaws taint content) → ignores distinction (B) vs. (C).  
    - **Moderate Separatism**: Upholds Content Autonomy but sidelines Material Conditions → fails cases like *Stolen-Training AI Image*.  

  ---

  ### **Fault Lines Summary**  
  | **Requirement**             | **Formalism**       | **Moralism**         | **Moderate Separatism** |  
  |-----------------------------|---------------------|----------------------|-------------------------|  
  | Case-Handling Robustness    | Fails (ignores context) | Fails (flattens distinctions) | Partial (fails on production flaws) |  
  | Tripartite Distinction      | Rejects (A) & (C)   | Rejects (separates A/B/C) | Upholds (A/B) but rejects (C) |  
  | Content Autonomy            | Upholds             | Rejects              | Upholds                 |  
  | Material Conditions Matter  | Rejects             | Partial (subsumes to A) | Rejects                 |  
  | Empirical Guardrails        | Rejects (ii)        | Ignores (i)          | Partial (ignores C’s impact) |  

  ---

  ### **Conclusion for Your Readers**  
  The fault lines expose a core dilemma: **Can a theory fully separate artistic value from moral judgment while still accounting for how art is made, circulated, and experienced?** The unresolved tension between *what the work says* (content), *who made it* (biography), and *how it came to be* (production) ensures this debate remains philosophically fertile—and politically charged. Your curated cases will force interviewees to confront where their theories crack.
