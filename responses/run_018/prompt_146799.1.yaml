  The core tension here is that strict finitists reject completed infinities. Cantor's diagonal argument assumes we can complete an infinite process - specifically, the construction of a new real number by flipping digits across an infinite list. Finitists see this as problematic because it requires treating this step-by-step procedure as already finished.

