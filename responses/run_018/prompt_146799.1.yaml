answer: |-
  Consider an infinite list of all real numbers in [0,1], each represented by an infinite binary expansion. Cantor's diagonal argument defines a new real number, R, digit-by-digit: the nth digit of R is the opposite of the nth digit of the nth number on the list. Proving R is missing requires R to exist as a completed, definite sequence. However, a strict finitist argues that *constructing* every digit of R requires performing infinitely many distinct reversal operations—an endless task impossible to finish. While each finite prefix of R can be constructed, the entire infinite sequence R, as a singular object with all its digits determined, is never actually produced. The finitist thus rejects the *ontological commitment* to R as a completed entity, viewing the diagonal argument as illicitly reifying an inherently open-ended, potential procedure into an "actual" infinite object, not as challenging the formal logic applied *if* such a completion is granted. (124 words)
