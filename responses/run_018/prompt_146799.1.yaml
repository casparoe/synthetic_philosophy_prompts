  I'll frame it as a concrete scenario: imagine listing all real numbers in [0,1] with their binary expansions. The diagonal argument defines a new number digit-by-digit. But a finitist would argue that this number is never actually constructed - it's an infinite task. The rejection isn't about the logic but about treating this unending process as yielding a determinate object.

