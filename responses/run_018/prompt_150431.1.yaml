reasoning: |-
  We are drafting an essay question for an upper-level metaphysics seminar on the problem of universals, specifically focusing on disjunctive properties and resemblance nominalism.

  The question must:
  - Not be answerable by just reciting the standard views (realism, nominalism, trope theory).
  - Force students to work through a specific conceptual tension: whether a resemblance nominalist can reject disjunctive universals without implicitly treating the disjunctive resemblance relation as a universal-like entity that leads to an infinite regression.
  - Require students to assess if positing a primitive, non-transitive similarity relation halts the regression and if this move is ad hoc or independently motivated.

  Components:
  1. The exam question itself (for a 90-minute exam, about 800 words).
  2. A model answer of about 600 words.
  3. A marking scheme (20 marks total) with five must-hit argumentative moves, each with point value and a note on the characteristic mistake.

  We'll structure the question to guide the student through the tension.

  Exam Question:

  "Resemblance nominalism holds that properties are not universals but are instead grounded in resembling particular objects (paradigms). However, resemblance nominalists typically reject disjunctive properties (like being either crimson or triangular) as genuine properties. This rejection is motivated by the idea that such disjunctive properties do not carve nature at the joints and lead to an overabundance of properties. 

  But consider the following challenge: to account for why two objects both possess the disjunctive property 'being either crimson or triangular', the resemblance nominalist might say that each resembles either a crimson paradigm or a triangular paradigm. This requires a disjunctive resemblance relation: an object resembles either paradigm-a (for crimson) or paradigm-b (for triangular). 

  Does this disjunctive resemblance relation itself introduce a universal-like entity? If so, does it generate a vicious infinite regress? 

  Moreover, can the resemblance nominalist avoid this regress by positing a primitive, non-transitive similarity relation? Assess whether such a move is ad hoc or independently motivated. In your answer, be sure to explain how the problem arises and evaluate the prospects for resemblance nominalism in light of this challenge."

  Model Answer (approx. 600 words):

  Resemblance nominalism seeks to avoid universals by reducing property possession to resemblance relations between particulars. For a property like crimson, an object is crimson if it resembles a set of crimson paradigms. However, when we consider disjunctive properties such as 'being either crimson or triangular', the resemblance nominalist denies that such a disjunction is a genuine property. The challenge is to explain why two objects, one crimson (but not triangular) and the other triangular (but not crimson), both possess the disjunctive property without appealing to a universal. 

  The natural move is to say that the crimson object resembles a crimson paradigm (and so falls under the disjunct) and the triangular object resembles a triangular paradigm (and so falls under the other disjunct). But then the resemblance relation required is disjunctive: an object possesses the disjunctive property if it resembles a paradigm in set A (for crimson) or set B (for triangular). This disjunctive resemblance relation, however, seems to be a new relational entity that must be accounted for. 

  If resemblance nominalism is committed to reducing all properties to resemblance, then this disjunctive resemblance relation must itself be grounded in resemblance. But that would require a further resemblance relation: we must say that the disjunctive resemblance relation holds between an object and the disjunctive paradigm (A or B) because the object resembles some further paradigm for the disjunctive resemblance. This leads to an infinite regress. 

  To avoid this regress, the resemblance nominalist might propose that the disjunctive resemblance is primitive and not further reducible. However, this move seems to reintroduce a universal-like entity at the level of relations. Moreover, if we allow such a primitive disjunctive resemblance, why not allow primitive non-disjunctive resemblances for genuine properties? This would undermine the motivation for resemblance nominalism, which aimed to avoid primitive property-like entities.

  Another escape route is to posit that the resemblance relation is non-transitive. Traditionally, resemblance is taken to be transitive (if A resembles B and B resembles C, then A resembles C). But if we abandon transitivity, we might block the regress. For example, the resemblance between the crimson object and the crimson paradigm, and between the triangular object and the triangular paradigm, need not imply that the two objects resemble each other. However, for the disjunctive property, we do not require that the crimson object and the triangular object resemble each other; we only require that each resembles one of the paradigms. Thus, non-transitivity does not by itself solve the problem. The issue is not transitivity but the disjunctive nature of the resemblance relation.

  The resemblance nominalist might instead argue that the disjunctive property is not a genuine property and hence does not require a resemblance analysis. But then they must explain what makes a property genuine. If they say that genuine properties are those that are not disjunctive, then they must provide a principled distinction. However, any such distinction risks being ad hoc without an independent motivation.

  Alternatively, the resemblance nominalist might accept that disjunctive properties are not grounded in resemblance but in something else. But this would violate the core thesis of resemblance nominalism that all properties are grounded in resemblance.

  In conclusion, the problem of disjunctive properties presents a serious challenge to resemblance nominalism. The attempt to ground disjunctive properties leads to an infinite regress if we try to reduce the disjunctive resemblance to further resemblances. Positing a primitive disjunctive resemblance seems to reintroduce a universal-like entity. Non-transitivity does not address the core issue. Without an independent motivation for halting the regress, the move to primitive disjunctive resemblance appears ad hoc. Thus, resemblance nominalism may be unable to consistently reject disjunctive universals without undermining its own foundations.

  Central thesis: The resemblance nominalist's rejection of disjunctive universals leads to a regress that cannot be halted without ad hoc or independently unmotivated moves, thereby threatening the coherence of the position.

  Marking Scheme (20 marks total):

  1. (4 marks) Clearly articulates the challenge: how disjunctive properties force the resemblance nominalist to appeal to a disjunctive resemblance relation, and why this might be problematic (as potentially universal-like). 
     Characteristic mistake: Failing to explain why the disjunctive resemblance is problematic (i.e., that it might require further resemblance relations, leading to regress).

  2. (4 marks) Explains the infinite regress that arises if the disjunctive resemblance relation must itself be grounded in resemblance. 
     Characteristic mistake: Not showing the regress step-by-step (i.e., how requiring a resemblance for the disjunctive resemblance leads to a new relation and then a further resemblance).

  3. (4 marks) Evaluates the proposal to halt the regress by positing a primitive, non-transitive similarity relation: explains why non-transitivity might be thought to help and why it fails to address the disjunctive nature of the relation. 
     Characteristic mistake: Confusing the issue of transitivity (which relates to chains of resemblance) with the disjunctive structure of the resemblance relation.

  4. (4 marks) Assesses whether the move to a primitive disjunctive resemblance is ad hoc: considers if there is independent motivation for such a primitive relation and whether it conflicts with the spirit of nominalism (by introducing a universal-like entity). 
     Characteristic mistake: Not comparing the primitive disjunctive resemblance to the nominalist's original goal of avoiding universals.

  5. (4 marks) Overall coherence and conclusion: draws a balanced conclusion about the prospects for resemblance nominalism in light of this challenge, and whether the problem can be resolved without compromising the theory's core tenets. 
     Characteristic mistake: Presenting an overly simplistic or one-sided conclusion without weighing the options.

  End with the central thesis of the model answer as a separate line.
answer: |-
  ### Exam Question  
  **Resemblance nominalism grounds property possession in resemblance relations between particulars, rejecting universals. However, it typically dismisses disjunctive properties (e.g., *being crimson or triangular*) as artificial. To explain why two objects—one crimson (but not triangular) and one triangular (but not crimson)—both instantiate the disjunctive property, the nominalist might appeal to a resemblance relation disjunctively defined: object X resembles *either* a crimson paradigm *or* a triangular paradigm. This raises a dilemma: if this disjunctive resemblance relation is treated as a further universal-like entity, it risks generating an infinite regress (since the relation itself would require resemblance grounding). Alternatively, if the nominalist halts the regress by positing a *primitive*, *non-transitive* disjunctive resemblance, this may seem ad hoc. Critically evaluate whether resemblance nominalism can resolve this dilemma without compromising its core commitments. Address: (1) why disjunctive properties threaten nominalism; (2) whether the regress is vicious; (3) whether a primitive non-transitive resemblance relation escapes it; and (4) whether this move is independently motivated or question-begging.**  

  ---

  ### Model Answer (≈600 words)  
  Resemblance nominalism avoids universals by reducing properties to resemblance relations between particulars. For example, an object is crimson if it resembles crimson paradigms. Disjunctive properties like *being crimson or triangular* are rejected because they lack natural unity and overpopulate ontology. Yet when two objects share a disjunctive property—say, a red circle (crimson) and a blue triangle (triangular)—the nominalist must explain their commonality without universals. The solution appears straightforward: each object resembles *either* a crimson paradigm *or* a triangular paradigm. This disjunctive resemblance relation ("resembles-a-or-b") becomes the crux of the problem.  

  If resemblance nominalism is consistent, all relations must be grounded in resemblance between particulars. But "resembles-a-or-b" is a disjunctive relation. To avoid treating it as a universal, the nominalist must reduce it to further resemblances: for instance, claiming that X’s resemblance-to-a-or-b holds because X resembles a "higher-order" paradigm for this relation. This demands a new resemblance relation (e.g., X resembles paradigm P, which represents "resembling-a-or-b"), which itself must be grounded. A vicious infinite regress ensues, as each new relation requires another resemblance, multiplying explanatory layers without end. This regress is vicious because nominalism collapses under infinite ontological commitments, violating its parsimony.  

  To halt the regress, the nominalist might posit "resembles-a-or-b" as a primitive, non-transitive relation. Non-transitivity blocks chains (e.g., if X resembles P1 and P1 resembles P2, X need not resemble P2), preventing the relation from "spreading" uncontrollably. However, this fails to resolve the core issue. The problem is not transitivity but the *disjunctive structure* of the relation itself. Primitive disjunctive relations are universal-like: they are abstract patterns (e.g., "resembles-a-or-b") that multiple pairs of objects can instantiate identically. For example, both the red circle’s resemblance to crimson paradigms and the blue triangle’s to triangular paradigms fall under the same logical form: resembling one disjunct or the other. This mirrors realism’s universals by introducing a repeatable, shareable entity—precisely what nominalism rejects.  

  Worse, this move is ad hoc. No independent justification exists for treating disjunctive resemblance as primitive while reducing non-disjunctive properties (like crimson) to resemblances. Nominalism’s core motivation is to avoid universals by grounding everything in concrete resemblances, yet here it exempts a relation structurally identical to a universal. If disjunctive resemblances are primitive, why not all resemblances? This inconsistency undermines nominalism’s anti-realist foundation.  

  One rebuttal is that disjunctive properties are not "genuine" and thus need no resemblance analysis. But this merely relabels the problem: the nominalist must explain why objects grouped by disjunctive properties (e.g., all crimson-or-triangular things) form a class without invoking resemblance. If the answer is "because they resemble-a-or-b," the regress/universal dilemma resurfaces. Alternatively, denying that such groupings reflect real properties leaves nominalism unable to explain apparent predication, a key task for any property theory.  

  In sum, resemblance nominalism cannot consistently reject disjunctive universals without implicitly endorsing a universal-like disjunctive relation or inviting a vicious regress. Positing primitive non-transitive resemblances is both ineffective against the disjunctive structure and ad hoc, as it contradicts nominalism’s commitment to resemblance-only grounding.  

  **The resemblance nominalist’s rejection of disjunctive universals forces an untenable choice between a vicious infinite regress or an ad hoc primitive relation that replicates universal-like structure.**

  ---

  ### Marking Scheme (20 marks total)  
  **Five must-hit argumentative moves:**  
  1. **Articulate the threat of disjunctive properties to resemblance nominalism** (4 marks).  
     *Characteristic mistake:* Merily stating that disjunctive properties are "artificial" without explaining how they force a disjunctive resemblance relation.  
  2. **Explain why the disjunctive resemblance relation risks a vicious infinite regress** (4 marks).  
     *Characteristic mistake:* Describing the regress superficially without linking it to nominalism’s need to ground *all* relations in resemblance.  
  3. **Evaluate the proposal to halt the regress via primitive non-transitive resemblance** (4 marks).  
     *Characteristic mistake:* Assuming non-transitivity solves the issue without addressing why disjunctive structure (not transitivity) is the core problem.  
  4. **Assess whether positing primitive disjunctive resemblance is ad hoc or independently motivated** (4 marks).  
     *Characteristic mistake:* Failing to contrast this move with nominalism’s core commitment to reducing properties to non-disjunctive resemblances.  
  5. **Synthesize a conclusion on nominalism’s viability** (4 marks).  
     *Characteristic mistake:* Concluding vaguely (e.g., "nominalism struggles") without tying the dilemma to foundational compromises.
