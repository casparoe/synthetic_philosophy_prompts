prompt: |-
  I'm trying to pin down a move I keep seeing in arguments about who gets to speak, and I dont know whether theres already a name for it or whether Im just over-analysing a weird pattern. Here are two instances that feel like the same thing: a climate scientist is dismissed for talking about energy policy because shes "only a scientist", but then an economist with no climate background is cited approvingly on the exact same policy question. Or a historian of medicine is told to stick to archives when she comments on current health ethics, yet a philosopher with no medical training is welcomed into the discussion because his view matches the audience.

  The thing is, its not just "stay in your lane" applied consistently — its selective. The expert's credibility in field A is used as a reason to exclude them from field B, but an outsider from field C is imported into B without the same scrutiny, as long as they agree. So its not a general rule about expertise boundaries; its more like a quarantine that locks people inside their own credibility, but only when its inconvenient.

  I know Miranda Fricker's work on epistemic injustice and the testimonial credibility deficit, but this feels different: the speaker isnt being downgraded within their own domain, theyre being barred from leaving it, and outsiders are brought in asymmetrically. Is there an established concept for this exact configuration? How does it differ from testimonial injustice and from hermeneutical injustice? If theres no established term, what should we call it — epistemic siloing, maybe? I want the carving, not just a label: what exactly the phenomenon is, where it stops being this and starts being something else, and what the boundary cases look like.
reasoning: |-
  Okay, the user is describing a specific rhetorical move they've observed in debates about expertise. They give two clear examples: a climate scientist being dismissed on energy policy while an economist is accepted on the same topic, and a medical historian being excluded from health ethics discussions while a philosopher is welcomed. 

  The core pattern they've identified is asymmetrical boundary policing - experts are confined to their field when their views are inconvenient, but outsiders are brought in when convenient. They mention knowing about Fricker's epistemic injustice concepts but feel this is distinct because it's about trapping experts within their domain rather than devaluing them within it.

  Hmm, the user is clearly analytically sophisticated - they're not just asking for a label but want precise conceptual carving. They've already considered terms like "epistemic siloing" but want to know exactly where this phenomenon begins and ends. The boundary cases request suggests they're thinking like a philosopher constructing a tight definition.

  Let me break this down systematically. First, why isn't this just testimonial injustice? Testimonial injustice is about credibility deficit in any domain, whereas here the expert has full credibility in their home domain but is barred from applying it elsewhere. The harm is different too - it's not that they're not believed, but that they're not even allowed to speak.

  The economist case is particularly telling - the issue isn't lack of credentials but selective enforcement of credential requirements. This feels like a form of gatekeeping where the rules are applied inconsistently based on whether the speaker's views align with the gatekeepers.

  What's really clever about the user's observation is how it reveals the hypocrisy - the same people who say "stay in your lane" to one expert are perfectly happy with another expert swerving into that lane. It's not about protecting domains but controlling discourse.

  For boundary cases: would it still count if both speakers were outsiders? Probably not - the asymmetry is key. What if the outsider had relevant credentials? Then it might be legitimate inclusion rather than this phenomenon. The user's "quarantine" metaphor is spot-on - it's about containing certain voices while letting others move freely.

  "Epistemic airlock" comes to mind as a term - trapping some in their expertise chambers while others pass through. But "asymmetrical domain policing" might be more precise. The power move aspect is crucial - this isn't accidental but strategic containment of inconvenient expertise.

  The user's frustration is palpable - they've spotted a pattern that's both intellectually interesting and practically important for academic discourse. They deserve a response that matches their analytical rigor while clarifying why this particular maneuver is so pernicious.
answer: |-
  You've identified a sophisticated and pernicious epistemic maneuver that deserves precise carving. While overlapping with Fricker's concepts, this pattern is distinct in structure and function. Let's dissect it:

  **Core Phenomenon:**  
  **Asymmetrical Epistemic Containment (AEC)**  
  *Definition:* The strategic enforcement of disciplinary boundaries to silence inconvenient experts by confining them to their "home" domain (using their credibility *within* that domain as the justification for exclusion), while simultaneously welcoming domain outsiders whose views align with the prevailing narrative *without* applying equivalent boundary scrutiny.

  ### Key Differentiators from Fricker's Frameworks:
  1.  **Vs. Testimonial Injustice (TI):**
      *   TI: Credibility deficit applied to the speaker *as a person* (e.g., "She's a woman, so her testimony is unreliable").
      *   AEC: The speaker's *established credibility in Domain A* is weaponized to *prevent* their voice in Domain B ("You're *so* credible in A, you *must* stay there"). The injustice isn't denying their expertise *in A*, but denying its potential relevance *beyond A*.
      *   *Boundary:* If someone is dismissed in Domain B *simply because* they belong to a marginalized group (even if they *are* an expert in B), that's TI. AEC specifically traps the expert *within* their credentialed domain.

  2.  **Vs. Hermeneutical Injustice (HI):**
      *   HI: Lack of collective interpretive resources to understand one's own experience (e.g., no concept of sexual harassment).
      *   AEC: Involves *existing* interpretive resources (expertise frameworks) being *selectively weaponized*. The problem isn't a lack of concepts, but the *strategic misuse* of concepts like "expertise" and "domain relevance."
      *   *Boundary:* If an expert *genuinely* lacks the conceptual tools to engage meaningfully in Domain B, exclusion might be warranted (not AEC). AEC occurs when the *tools exist* but their application is asymmetrical.

  ### Mechanism & Anatomy of AEC:
  1.  **Dual Moves:**
      *   **Containment:** "Expert X (credible in A) must stay *only* in A when discussing B." (Justification: "Stay in your lane," "That's not your specialty.")
      *   **Intrusion:** "Expert Y (credible in C) is welcome/authoritative in B." (Justification: Often implicit or based solely on perceived agreement/ideological alignment, *not* on demonstrated B-relevant expertise).
  2.  **Selectivity:** The crucial asymmetry. Boundary enforcement applies *only* to inconvenient voices. Convenient voices (outsiders) face no equivalent "lane" scrutiny.
  3.  **Weaponized Credibility:** The contained expert's *own credibility* becomes the prison bars. Their authority in A is used *against* their participation in B.
  4.  **Goal:** Control over discourse in Domain B by excluding credentialed voices offering challenging perspectives while amplifying voices supporting the desired narrative, regardless of their actual B-domain expertise.

  ### Boundary Cases & Nuances:
  *   **Genuine Boundary Violation vs. AEC:** If an expert makes claims in Domain B *wildly* beyond their competence *and* an outsider with *relevant* B-expertise is cited instead, that's legitimate boundary policing. AEC requires both (1) dismissal of an expert whose A-expertise *could* be relevant to B (e.g., climate science informing energy policy) AND (2) inclusion of an outsider whose C-expertise has *no more* obvious relevance to B than the contained expert's A-expertise *and* this inclusion is based on agreement.
  *   **The "Relevance" Smokescreen:** AEC often hides behind claims that the outsider's Domain C expertise *is* relevant to B (e.g., "Economics *is* relevant to policy!"). The test: Is this relevance standard applied equally? Is the economist asked to demonstrate *specific* climate/energy knowledge? Is the climate scientist's *specific scientific knowledge* deemed irrelevant to policy impacts? If not, it's AEC.
  *   **"Agreement" as the Key:** The clearest marker of AEC is that the *only discernible difference* between the contained expert and the intruding outsider is the *conclusion they reach* or the *ideology they represent*. The rules of engagement change based on conformity.
  *   **Power Dynamics:** AEC is typically deployed by those controlling the discourse (institutions, dominant ideologies, gatekeepers) against challengers. The "outsider" brought in often reinforces the existing power structure.

  ### Why "Epistemic Siloing" Isn't Quite Right:
  "Siloing" implies passive separation or isolation. What you describe is *active, selective enforcement* – **Epistemic Quarantine** (containment) coupled with **Selective Border Opening** (intrusion). It's a dynamic, strategic *maneuver*, not just a state of separation.

  ### Proposed Term: **Strategic Credential Asymmetry (SCA)**
  *   **Strategic:** Highlights the intentional, goal-oriented nature.
  *   **Credential:** Focuses on the weaponization of expertise/domain membership.
  *   **Asymmetry:** Captures the core inconsistency in applying boundary rules.

  ### Alternatively: **Asymmetrical Domain Policing (ADP)**
  *   **Asymmetrical:** The defining inconsistency.
  *   **Domain:** Specifies the field-boundary aspect.
  *   **Policing:** Emphasizes the active, gatekeeping enforcement.

  ### Conclusion
  You've pinpointed **Strategic Credential Asymmetry (SCA)** / **Asymmetrical Domain Policing (ADP)** – a distinct form of epistemic gatekeeping. It differs from Fricker's injustices by:
  1.  **Leveraging Credibility as Containment:** Trapping experts *within* their recognized domain.
  2.  **Asymmetric Boundary Enforcement:** Applying "stay in your lane" *only* to inconvenient voices while waiving it for agreeable outsiders.
  3.  **Goal of Narrative Control:** Primarily serving to manage discourse and exclude challenging perspectives under a veneer of respect for expertise boundaries.

  This is not just "stay in your lane" hypocrisy; it's a sophisticated tactic using the *value* of expertise against its potential to disrupt established narratives in adjacent domains. It reveals how appeals to "expertise" can mask power plays rather than genuine pursuit of knowledge.
