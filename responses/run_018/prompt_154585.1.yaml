  | Path (1-2-3-4) | Position Name & Defense Status | Description/Diagnosis |
  |----------------|--------------------------------|------------------------|
  | **1A-2A-3A-4A** | Unnamed | *Incoherent: Careenium is defined to avoid closure violation, yet this path violates it.* |
  | **1A-2A-3A-4B** | **Careenium interactionism** (defended) | Semantic simmballs directly push dynamics in a special substrate, reconciled via non-reductive physicalism (e.g., Campbell, 2024). |
  | **1A-2A-3B-4A** | Unnamed | *Incoherent: Mediation implies no direct push, but closure violation contradicts careenium's purpose.* |
  | **1A-2A-3B-4B** | **Careenium representationalism** (defended) | Semantic symbols act via mediated representation in a careenium, reconciled (e.g., emergent computation theories). |
  | **1A-2B-3A-4A** | Unnamed | *Incoherent: Syntactic directness in a careenium cannot violate closure by definition.* |
  | **1A-2B-3A-4B** | **Pure simmball direct-causation** (defended) | Syntax-only simmballs exert direct leverage in a careenium, reconciled (e.g., Bickhard's interactivism). |
  | **1A-2B-3B-4A** | Unnamed | *Incoherent: Mediation without semantics in a careenium cannot violate closure.* |
