  #### Committed Stance: **Pure Simmball Direct-Causation (1A-2B-3A-4B)**  
  I defend **pure simmball direct-causation** (leaf **1A-2B-3A-4B**), where minimal syntactic units (simmballs) exert unmediated downward causation in a careenium substrate, reconciled with physical law.  

  **Reasons rooted in the cases**:  
  1. **Against substrate determinism**: In the root case, if voltage patterns alone caused the movement, identical voltages with no symbolic structure (e.g., random noise) should trigger the arm—but they don’t. The token’s *structure* ("if X then...") is necessary, implying syntax has causal power beyond brute physics.  
  2. **Against mediation**: If causation were representational (e.g., token → parser → motor signal), the arm’s response would lag or vary with processing depth—but in direct simmball systems (e.g., reflex arcs), action is immediate and structure-sensitive, bypassing homunculus regress.  
  3. **Semantics is unnecessary**: The token works even if "X" is nonsense (e.g., "if glarph then move arm"), proving syntax alone suffices. Semantics adds no causal leverage here.  
  4. **Careenium resolves closure**: A substrate with topological constraints (e.g., recurrent neural networks) amplifies macro-scale symbolic patterns, constraining micro-dynamics without violation—like how a river’s shape (macro) directs water molecules (micro) via boundary conditions.  

  **Decisive evidence against my stance**:  
  If a system exhibits identical arm movements *without* the token’s syntactic structure (e.g., via direct voltage manipulation or unstructured inputs), simmball causation is falsified. Structural isomorphism must be necessary and sufficient for the effect.  

  **Formal refutation**:  
  Proof that syntax is causally reducible to substrate dynamics (e.g., a theorem showing all simmball-like behaviors are simulable by non-symbolic automata). This would collapse the careenium into ordinary physics.  

  This stance avoids the inefficiency of representational mediation and the implausibility of semantic miracles, positioning cognition as an architecture of direct syntactic leverage in biological substrates.
