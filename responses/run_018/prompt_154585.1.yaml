  ### Decision-Tree Taxonomy of Symbolic Causation Positions

  **Root Case**: A synthetic system contains a token with the formal structure "if X then move arm," and the arm moves. Is the movement caused by the token's symbolic property (i.e., its syntactic form or semantic content), or only by the voltage patterns instantiating it? This frames the debate over whether symbolic structures can exert "downward causation" on physical substrate dynamics.

  The tree branches through four diagnostic splits, each illustrated with a scenario. Leaves are named if defended in the literature; otherwise, marked "unnamed" with a diagnosis. Key positions:
  - **Careenium thesis**: A special substrate enables symbolic forms to exert downward causation.
  - **Simmballs**: Minimal symbolic units with direct mechanical leverage (no representational mediation).

  ---

  #### **Split 1: Does symbolic causation require a special substrate (a careenium), or can it occur in any physical system?**
  - **Scenario**: A standard silicon chip vs. a hypothetical "neural foam" substrate that amplifies symbolic patterns into physical effects.
  - **Branch 1A: Yes (requires careenium)**  
    Symbolic causation only occurs in substrates with properties (e.g., nonlinear dynamics, topological constraints) that "listen" to symbols. Proceed to Split 2.  
  - **Branch 1B: No (any physical system)**  
    Symbols can exert causal power in any substrate (e.g., a standard computer). Proceed to Split 2.

  #### **Split 2: Must the symbol carry semantic content, or can pure syntax do the work?**
  - **Scenario**: The token "if X then move arm" either (a) encodes a meaningful instruction (e.g., "X" refers to a sensor), or (b) is a purely formal string triggering movement regardless of meaning.
  - **Branch 2A: Yes (semantics required)**  
    Meaning (e.g., reference, truth-conditions) is essential for causation. Proceed to Split 3.  
  - **Branch 2B: No (pure syntax suffices)**  
    Only syntactic structure (e.g., symbol shape, position) matters; semantics is epiphenomenal. Proceed to Split 3.

  #### **Split 3: Is the causal path direct (simmball pushes) or mediated by intermediate representational layers?**
  - **Scenario**: (a) The token directly interfaces with the arm motor (no intermediate steps), or (b) the token is parsed, translated, and executed via internal representations.
  - **Branch 3A: Yes (direct—simmball)**  
    Symbols act as simmballs: minimal units with immediate physical leverage (e.g., a gear clicking into place). Proceed to Split 4.  
  - **Branch 3B: No (mediated by representation)**  
    Symbols cause effects only via layered computational processes (e.g., decoding, inference). Proceed to Split 4.

  #### **Split 4: If downward causation occurs, does it violate substrate closure, or can it be reconciled with physical law?**
  - **Scenario**: (a) Arm movement defies microphysical predictions (violation), or (b) it aligns with higher-level physical laws (e.g., thermodynamics, information theory).
  - **Branch 4A: Yes (violates closure)**  
    Downward causation breaks causal closure of physics (e.g., symbols add non-physical forces).  
  - **Branch 4B: No (reconciled)**  
    Downward causation is consistent with physics (e.g., via supervenience, constraint, or emergence).

  ---

