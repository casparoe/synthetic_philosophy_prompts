   The flaw in the argument is that it incorrectly claims that after learning the conditional, the conditional probability remains the same. But in reality, upon learning the conditional with certainty, the physician sets P(S|C)=1. Therefore, when she later learns C, she sets P(S)=1. So the conditional knowledge is useful.

   How do we update when we learn the conditional? We set P(C∧¬S)=0 and renormalize. This will change P(S|C) to 1. Therefore, step (3) is false.

