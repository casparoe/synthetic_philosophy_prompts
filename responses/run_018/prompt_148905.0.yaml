   Now, what if the conditional is not learned with certainty? Then we are in the realm of Jeffrey's framework. But note that in Jeffrey conditioning, when we update on a partition, we are free to change the conditional probabilities as long as we adjust the overall distribution accordingly. However, the standard Jeffrey update rule does not require that conditional probabilities remain fixed. What it requires is that we assign new probabilities to the elements of the partition and then use the old conditional probabilities to spread the probability within each partition element. But that is only if we are updating on that partition and if the learned information does not change the conditional probabilities. But if the learned information does change the conditional probabilities, then we cannot use that rule.

