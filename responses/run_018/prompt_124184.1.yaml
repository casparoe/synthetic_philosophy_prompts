prompt: |-
  hey i'm running a workshop for biologists who think gender is just chromosomes plus culture layered on top. i want them to grasp social construction in the stronger sense — that the kind 'woman' gets stabilized by intitutional practices, not just interpreted differently. plan my teaching arc, not the lecture itself: what dependency has to come first? i'm guessing we need to show that biological sex classifcation already involves normative judgments before gender even enters. then what's the carrying example — i'm torn between the 19th-century medical shift from 'hermaphrodite' to intersex/DSD taxonomy, or the history of administrative gender markers on passports. which one actually carries the idea without being too obscure? map the misconceptions in the order they'll hit: 'if it's constructed then it's fake,' 'then anyone can just choose,' 'biology is still the real base layer.' exactly where in the sequnce do i head off each? for the check at the end, have them apply the framework to how an AI face-classifier's training dataset labels gender — does that show they've got it? and what should i openly refuse to cover — probably Butler's performativity framework in full? lay out the plan with the example justified, the misconception map placed, and the check explained.
reasoning: |-
  Okay, let me unpack this workshop design request. The biologist wants a teaching arc that challenges the "chromosomes + culture" model of gender, aiming for a strong social constructionist understanding. Key elements to address:

  The core challenge seems to be establishing institutional stabilization before tackling performativity. Biologists will likely approach this with three major misconceptions: that social construction implies fakeness, that it enables arbitrary choice, and that biology remains the fundamental base layer. 

  For the foundational concept, demonstrating normativity in biological classification appears crucial. Comparing the two historical examples: the passport case might be more accessible since administrative systems are concrete, but the intersex taxonomy shift better exposes medical authority in defining bodies. The latter wins because it directly confronts the presumed objectivity of sex classification. 

  The misconception sequence should be addressed progressively: first dissolve the fake/real binary when introducing institutional practices, then preempt choice arguments when discussing assignment systems, and finally tackle biological reductionism during the stabilization phase. 

  The AI face-classifier exercise works as an application check because it requires recognizing three layers: labeling conventions as institutional choices, training data as normative filters, and algorithmic outputs as stabilizers. This avoids abstract theory by focusing on contemporary tech they'll likely engage with. 

  Explicitly excluding Butler's performativity is wise here - it's too easily misinterpreted without the institutional groundwork. Instead, emphasize how classification systems produce material consequences (e.g., access to healthcare). 

  The arc should flow: start with biologists' existing model, reveal normativity in sex classification through intersex history, show gender's institutional stabilization via bureaucratic systems, then apply to AI before circling back to their original framework. Each step must include mechanisms to redirect those predicted misconceptions when they arise.
answer: |-
  Here’s a structured teaching arc designed to disrupt the "chromosomes + culture" model and build a robust understanding of institutional stabilization, with sequenced misconception-busting and a targeted application check:

  **Teaching Arc: From Biological Reductionism to Institutional Stabilization**  

  ### **Phase 1: Destabilize the "Objective Biology" Foundation**  
  **Goal:** Expose normative judgments embedded in biological sex classification.  
  **Core Example:** **19th-Century Medical Shift (Hermaphrodite → Intersex/DSD)**  
  - *Why it works*:  
    - **Concrete**: Shows doctors using social norms (reproductive capability, marriage laws) to surgically "assign" sex, not just observe biology.  
    - **High-Stakes**: Reveals how institutions (medicine, law) *create* categories that materially alter lives (surgeries, legal status).  
    - **Accessible**: Avoids passport bureaucracy (which can feel abstract) and directly confronts the "biology is base layer" myth.  
  **Activity:** Analyze historical case studies (e.g., 1800s medical journals prioritizing "functional penis" over chromosomes).  

  **Address Misconception #1: *"If it's constructed, it's fake/subjective."***  
  - *When/How*: After presenting medical history.  
  - **Counter**: "This *isn’t* about personal opinions. Doctors applied *institutional rules* (e.g., 'a "real" male must impregnate') with scalpels and birth certificates. The consequences (pain, legal gender) were brutally real."  

  ---

  ### **Phase 2: Show Gender as Institutionally Stabilized**  
  **Goal:** Map how institutions (law, medicine, state) co-produce gender categories through repetitive practices.  
  **Carrying Example:** **Administrative Gender Markers (Passports/Birth Certs)**  
  - *Why after Phase 1*: Builds on the revelation that even "biological sex" is institutionally mediated.  
  - *Key Insight*:  
    - Markers aren’t just "recording" sex/gender; they *enable state control* (ID checks, borders, benefits).  
    - Reveals **feedback loops**: Institutions enforce categories (e.g., "M/F only"), which shape cultural norms, which reinforce institutions.  
  **Activity:** Diagram how a passport gender marker affects access to healthcare, marriage, or asylum.  

  **Address Misconception #2: *"Then anyone can just choose!"***  
  - *When/How*: When discussing marker changes.  
  - **Counter**: "Can a Nigerian non-binary person 'choose' their passport marker? No—*states gatekeep* criteria (diagnoses, surgery requirements). 'Choice' is constrained by institutional power."  

  ---

  ### **Phase 3: Consolidate – Gender as a Stabilized Kind**  
  **Goal:** Synthesize how institutions *materially sustain* the category "woman."  
  **Core Framework:**  
  - **Stabilization via Practice**: Laws (parental rights), medicine (gynecological care), economics (wage gaps) *reinforce what "woman" means and does* in society.  
  - **Not Culture-Only**: Contrast with "culture = beliefs" – highlight *material penalties* for non-conformity (e.g., job loss, violence).  

  **Address Misconception #3: *"Biology is still the real base layer."***  
  - *When/How*: During synthesis.  
  - **Counter**: "Biology doesn’t dictate *which traits matter* for categorization. Medicine didn’t care about chromosomes until the 1950s—it cared about gonads. *Institutions decide* what 'biology' counts, and they change those rules."  

  ---

  ### **Application Check: AI Gender Classifiers**  
  **Activity:** Analyze an AI face-classifier’s training dataset (e.g., scraped Facebook photos labeled "man"/"woman").  
  **Probing Questions:**  
  1. *Institutional Labels*: Who decided the labels? (e.g., crowdworkers applying cultural norms).  
  2. *Stabilization*: How does the AI *reinforce* these categories? (e.g., misgenders non-Western faces, enforces binary).  
  3. *Consequence*: What happens when this AI checks passport photos?  
  **Success Signals If They:**  
  - Identify labeling as a *normative practice* (not "neutral observation").  
  - Trace how the AI *materially stabilizes* gender (e.g., denying services for mismatched IDs).  
  - Recognize this as an *institutional system* (tech companies, governments), not just "bias."  

  ---

  ### **What to Explicitly Exclude**  
  - **Butler’s Performativity**: Requires deep dive into philosophy/language theory. Risks derailing into "performance = voluntary" misunderstandings.  
  - **Alternative Taxonomies (e.g., 3rd genders)**: Important but secondary; focus first on deconstructing the *binary stabilization* in their context.  
  - **Chromosome Biology Deep Dive**: Don’t debate XX/XY complexities. Redirect to "Who decided chromosomes define sex, and when?"  

  ---

  ### **Misconception Map & Sequence**  
  | **Phase**          | **Likely Misconception**        | **Intervention Timing & Tactic**                                                                 |
  |---------------------|----------------------------------|--------------------------------------------------------------------------------------------------|
  | Intro              | "Gender is personal identity + stereotypes." | **Pre-empt**: Start with "We’re examining how *systems* make gender categories *stick*."         |
  | Phase 1 (Medical)  | *"If constructed, it’s fake."*   | **During case study**: Highlight scalpels/laws—"Is surgical trauma 'just culture’?"              |
  | Phase 2 (State)    | *"Then anyone can choose!"*      | **When discussing marker changes**: Contrast privileged access vs. systemic barriers.            |
  | Phase 3 (Synthesis)| *"Biology is the real base."*    | **During recap**: "Institutions *use* biology selectively. Chromosomes weren’t always relevant." |
  | Application (AI)   | *"The AI is biased, but gender is still binary."* | **Final Q&A**: "Does the AI *create* binary enforcement, or just reflect it?"                  |

  **Key Design Logic**:  
  - **Biology First**: Must destabilize biological objectivity *before* gender. Medical history does this viscerally.  
  - **Institutions Over Culture**: Culture appears fluid; highlight courts, clinics, and databases as enforcers.  
  - **AI Check Relevance**: Makes abstract theory tangible with a system biologists may see as "neutral tech." Forces engagement with labeling-as-power.  

  This arc forces a reckoning: *Gender categories persist because hospitals, governments, and algorithms spend resources to maintain them—not because they’re "natural."*
