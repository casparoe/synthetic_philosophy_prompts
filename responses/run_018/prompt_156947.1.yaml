  ### Activity Design: "Fluid Boundaries: Experiencing Conceptual Slippage"

  **Objective**: Participants experience conceptual slippage through analogical pressure in a closed microdomain, simulating how category boundaries shift systematically due to parallel structures—without random error. The activity mirrors the Copycat framework's core principles (fluid concepts, context-dependent weighting, analogical pressure) while admitting its limitations.

  **Microdomain Specifications**:  
  24 physical cards, each displaying a "figure" with three binary features:  
  - **Shape orientation**: Upright (↑) or Tilted (↗)  
  - **Internal pattern density**: Sparse (3 dots) or Dense (6 dots)  
  - **Relational position**: Above a horizontal reference line or Below it.  

  Cards are visually simple:  
  - Upright: Vertical arrow (↑)  
  - Tilted: Diagonal arrow (↗)  
  - Sparse: Three small dots inside the arrow  
  - Dense: Six small dots inside the arrow  
  - Position: Arrow clearly above or below a horizontal line on the card.  

  **Card Set Composition (24 cards)**:  
  Designed to create analogical pressure between two subgroups ("Alpha" and "Beta" analogs) and borderline cases. Cards are labeled for reference (e.g., A1, B2), but labels are hidden from participants; only figures are visible.  

  | **Type** | **Orientation** | **Pattern** | **Position** | **Copies** | **Role** |  
  |----------|-----------------|-------------|--------------|------------|----------|  
  | Clear Alpha | Upright (↑) | Sparse | Above | 4 | Prototypical Alpha |  
  | Clear Beta | Tilted (↗) | Dense | Below | 4 | Prototypical Beta |  
  | Alpha Analog | Upright (↑) | Sparse | **Below** | 3 | Analog to Alpha (position differs) |  
  | Beta Analog | Tilted (↗) | Dense | **Above** | 3 | Analog to Beta (position differs) |  
  | Borderline 1 | Upright (↑) | **Dense** | **Below** | 3 | Pulled by Alpha (orientation) or Beta (pattern) |  
  | Borderline 2 | Tilted (↗) | **Sparse** | **Above** | 3 | Pulled by Beta (orientation) or Alpha (pattern) |  
  | Atypical Alpha | Upright (↑) | **Dense** | Above | 2 | Low-slippage (fixed by rules) |  
  | Atypical Beta | Tilted (↗) | **Sparse** | Below | 2 | Low-slippage (fixed by rules) |  

  **Key Dynamics**:  
  - **Analog Subgroups**: Alpha Analog (Upright-Sparse-Below) mirrors Clear Alpha (Upright-Sparse-Above) but differs in position. Beta Analog (Tilted-Dense-Above) mirrors Clear Beta (Tilted-Dense-Below).  
  - **Borderline Cases**: Borderline 1 (Upright-Dense-Below) and Borderline 2 (Tilted-Sparse-Above) are tugged by competing analogies:  
    - Borderline 1 resembles Alpha in orientation but Beta in pattern.  
    - Borderline 2 resembles Beta in orientation but Alpha in pattern.  
  - **Slippage Triggers**: Clear cases anchor categories. Alpha/Beta Analogs create "pull" toward their prototypes. Borderline cases experience maximal conflict from cross-cutting parallels.  

  **Three Explicit Rules (Stated Verbally and on Handout)**:  
  1. **Category Alpha**: Upright and Above.  
  2. **Category Beta**: Tilted and Below.  
  3. **Category Gamma**: *All other cards* (i.e., not Alpha or Beta).  

  Rules use only orientation and position, ignoring pattern—inviting analogical pressure from pattern later.  

  ---

  ### Minute-by-Minute Timeline (75 Minutes Total)  
  *Materials: 24 cards on a long table, worksheets for sorting, pens, timer.*  

  **0–5 min: Introduction (Facilitator-Led)**  
  - Explain: "Classify cards into Alpha, Beta, or Gamma using the rules. Goal is consensus, but there may be ambiguity. No outside references or devices."  
  - Show one example of each category (e.g., Clear Alpha, Clear Beta, Alpha Analog as Gamma).  
  - Emphasize: "You may adjust classifications based on card relationships. I am not an authority—defend your reasoning."  

  **5–15 min: Individual Sorting (Silent Work)**  
  - Participants classify all 24 cards alone using worksheets (pre-populated with card IDs and categories to circle).  
  - **Goal**: Private judgments surface initial intuitions.  

  **15–25 min: Pair Comparison (Teams of 2)**  
  - Pair up (7 pairs total). Pairs compare worksheets and negotiate a consensus classification for each card.  
  - **Stakes**: Pairs must agree on one sheet to submit. No scoring—focus on shared reasoning.  
  - **Facilitator Circulates**: If pairs "freeze" on ambiguity (e.g., Borderline cards), prompt: "What analogies could justify moving this card? Compare it to prototypes."  

  **25–40 min: Group Deliberation (Two Teams of 7)**  
  - Merge pairs into two teams (Team A and Team B). Teams debate to reach unanimous consensus.  
  - **Mechanism for Disagreement**: Teams must defend classifications using analogies. Focus on:  
    - 4+ borderline cases (Alpha Analog, Beta Analog, Borderline 1, Borderline 2).  
    - **Critical Prompt**: "Why might a Gamma card belong in Alpha or Beta? Use similarities to prototypes."  
  - **Stakes**: Teams prepare 2-minute "argument" for their most contested card (chosen by team).  

  **40–50 min: Team Arguments & Open Debate (Whole Group)**  
  - Each team presents their contested card argument (e.g., "Borderline 1 is Beta because...").  
  - Open debate: Teams challenge each other. **Facilitator surfaces contradictions**:  
    - "Team A says Analog Alpha is Gamma, but Team B says it’s almost Alpha. What breaks the tie?"  
    - If appeal to facilitator: "There’s no answer—what analogies feel most compelling to you?"  

  **50–60 min: Facilitator Names the Phenomenon**  
  - Reveal: "You experienced *conceptual slippage*—boundaries shifted under analogical pressure, not randomness."  
  - Map activity to fluid concepts:  
    - **Analogical Pressure**: Alpha/Beta Analogs pulled Borderline cards (e.g., "Alpha Analog’s pattern mirrored Clear Alpha, making Borderline 2 feel Beta-like").  
    - **Context-Dependent Weighting**: Pattern density was ignored in rules but dominated debates (e.g., "When pattern became salient, orientation mattered less").  
    - **No Fixed Kernel**: Rules felt absolute, but Gamma dissolved under parallels (e.g., "No feature was essential—even ‘position’ lost weight in Alpha Analog debates").  

  **60–75 min: Debrief & Discussion**  
  - **Settled Science**: "In microdomains like this, slippage arises from systematic parallels, not noise. Categories lack fixed boundaries (Copycat, Hofstadter)."  
  - **Contested Issues**: Flag disagreements:  
    - "Specialists debate if this undermines *all* classical categorization (e.g., Fodor vs. Hofstadter) or applies only to analogical domains."  
    - "Is slippage always rule-based? Some argue it’s stochastic (e.g., connectionist models vs. Copycat)."  
  - **Activity Liberties**:  
    - Rules were given explicitly—unlike real life, where concepts form implicitly.  
    - Copycat uses *parallel exploration* (e.g., testing multiple analogies simultaneously); here, it’s serial debate.  
  - **Admission of Limits**: "This activity *cannot* reproduce Copycat’s computational architecture:  
    - **Parallel Processing**: Copycat explores analogies simultaneously; we did step-by-step debate.  
    - **Temperature Metric**: Copycat uses ‘temperature’ to inject randomness; we had no equivalent.  
    - Must verbally explain: Fluid concepts rely on *dynamic re-representation*, which we simulated socially."  

  ---

  ### Predictable Problems & Mitigation  
  1. **Freezing on Ambiguity**:  
     - *Predicted*: Participants stall on Borderline cards, calling them "too vague."  
     - *Handle*: Redirect to analogies—"Compare it to a Clear Alpha card. What’s shared? What differs?"  

  2. **Appealing to Facilitator**:  
     - *Predicted*: "Just tell us the right answer!"  
     - *Handle*: "I have no authority here. Convince each other—why might your view be defensible?"  

  3. **Latching onto One Analogy**:  
     - *Predicted*: Teams fixate on one parallel (e.g., "All Sparse cards are Alpha!").  
     - *Handle*: Challenge: "But Beta has Sparse cards too. Does that weaken your analogy?"  

  4. **Dominant Personalities**:  
     - *Predicted*: One person overrides team.  
     - *Handle*: "Each of you must share one analogy that supports or challenges the current classification."  

  ---

  ### Contested vs. Settled in Conceptual Slippage  
  - **Settled (Consensus)**:  
    - Slippage occurs in microdomains with competing parallels.  
    - It is systematic (not random) and context-driven.  
    - Concepts lack a fixed "essence" under analogical pressure.  
  - **Contested (Active Debates)**:  
    - **Scope**: Does slippage refute classical categorization *everywhere* (Hofstadter) or only in fluid domains (Fodor)?  
    - **Underlying Mechanism**: Is it primarily structure-mapping (Gentner) or dynamic re-weighting (connectionism)?  
    - **Universality**: Is slippage inevitable in human cognition, or culture-dependent?  

  **Liberties Taken**:  
  - Copycat domains involve *transformations* (e.g., letter sequences); here, cards are static.  
  - Activity uses social negotiation, not cognitive computation.  
  - Rules are predefined—unlike emergent concepts in Copycat.  

  This design ensures experiential learning of fluid concepts while transparently separating theory from simulation. Participants confront slippage through structured disagreement, priming deep discussion in philosophy of mind.
