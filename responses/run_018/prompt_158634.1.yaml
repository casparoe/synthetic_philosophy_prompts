  I'll identify non-negotiable requirements like explaining why idealization works in hagiography despite inaccuracies, while flagging preferences like whether comparative structures are superior. I suspect tensions between historical fidelity and unambiguous exemplarity might be jointly unsatisfiable in some cases. Strict enforcement of the historical fidelity requirement would likely eliminate many existing accounts that prioritize didactic clarity over accuracy.

