answer: |-
  Here are the desiderata for an adequate theory of moral learning from biography, centered on Plutarch's *Parallel Lives* and the hagiographic tradition, with explicit attention to phenomena, psychology, tensions, and eliminative power:

  1.  **Exemplar-Disillusionment Accommodation Requirement:**
      *   **Phenomenon Protected:** The capacity of biographies to inspire emulation *despite* presenting flaws/vices, *and* the risk that encountering flaws/vices can trigger disillusionment and abandonment of the exemplar.
      *   **Motivating Case:** Plutarch explicitly includes vices and moral failures (e.g., Alcibiades' treachery, Coriolanus' pride) alongside virtues, aiming not for simple emulation of the whole person but critical engagement. Hagiography risks disillusionment if later evidence contradicts the idealized image.
      *   **Psychology:** Must accommodate research on **emulation** (Bandura's social learning theory: observation → motivation → reproduction) and **disillusionment** (cognitive dissonance when idealized image clashes with negative information, potentially leading to rejection rather than nuanced understanding). The theory must explain how learning survives or even benefits from encountering flaws.
      *   **Status:** Non-negotiable. A theory that cannot explain learning from flawed figures or mitigate the disillusionment risk fails core cases.

  2.  **Vice-Suppression Paradox Resolution Requirement:**
      *   **Phenomenon Protected:** The apparent efficacy of idealized portrayals (hagiography) in moral education despite historical inaccuracy/omission of vice.
      *   **Motivating Case:** Hagiography demonstrably inspired centuries of devotion and moral striving by presenting near-perfect exemplars (e.g., St. Francis's radical poverty/chastity, St. Joan's courage/faith), suppressing or minimizing faults. How does selective presentation *not* inherently corrupt or lead to brittle faith?
      *   **Psychology:** Must accommodate how **idealization fuels motivation** and provides clear, unambiguous models (aiding emulation), while explaining how later discovery of suppressed vices might *or might not* catastrophically undermine learning (link to disillusionment research).
      *   **Status:** Non-negotiable. Dismissing hagiography as inherently corrupt ignores its historical pedagogical success and psychological mechanisms of inspiration.

  3.  **Structural Duality Requirement:**
      *   **Phenomenon Protected:** The distinct learning potentials unlocked by *comparative* structures (Plutarch) versus *singular, exemplary* structures (Hagiography).
      *   **Motivating Case:** Plutarch's paired lives (e.g., Alexander-Caesar, Demosthenes-Cicero) force comparison ("parallels"), highlighting nuanced differences in character, context, choices, and outcomes, teaching *phronesis* (practical judgment). Hagiography focuses intensely on one life as a unified beacon of virtue, teaching commitment to an ideal pattern.
      *   **Psychology:** Must accommodate how **comparison aids complex schema formation** (contrasting cases highlight relevant features) and how **singular focus aids motivation and schema clarity**.
      *   **Status:** Preference-based (Non-negotiable to *acknowledge* both; preference-based whether one is *superior*). A theory must explain both modes but need not declare one universally better.

  4.  **Virtue-vs.-Life-Pattern Distinction Requirement:**
      *   **Phenomenon Protected:** The difference between learning a specific, contextually applied virtue (e.g., courage in adversity) and learning to imitate a whole life pattern (e.g., "live like St. Anthony").
      *   **Motivating Case:** Plutarch often isolates *virtues/vices in action* across different contexts within and between lives, inviting selective emulation/modification. Hagiography often presents the *entire life* as a holistic model to be imitated (e.g., monastic vocation).
      *   **Psychology:** Must accommodate research on **abstract vs. concrete learning** and **goal internalization** (abstract virtues allow flexible application; concrete life patterns provide detailed scripts but risk rigidity).
      *   **Status:** Non-negotiable. Failing this distinction conflates two fundamentally different learning outcomes.

  5.  **Ambiguous Exemplar Retention Requirement:**
      *   **Phenomenon Protected:** How figures with significant moral flaws or complex, ambiguous legacies (common in Plutarch) can remain potent sources of moral learning *without* requiring full endorsement or sanitization.
      *   **Motivating Case:** Plutarch's Themistocles (brilliant savior, later traitor), Cato the Younger (stoic integrity, political fanaticism). Why do such figures still teach valuable lessons?
      *   **Psychology:** Must accommodate **complex attribution** and **ambivalent attraction** – how learners can compartmentalize, learn from failure as caution, or grapple with moral complexity without rejecting the figure entirely (linked to managing disillusionment).
      *   **Status:** Non-negotiable for handling Plutarchian biography effectively.

  6.  **Historical Fidelity - Didactic Clarity Tension Requirement:**
      *   **Phenomenon Protected:** The inherent tension between accurate historical portrayal (warts-and-all) and creating a clear, unambiguous moral lesson.
      *   **Motivating Case:** Plutarch prioritizes moral insight over strict chronology ("We are writing lives, not history"), but still grounds lessons in plausible events. Hagiography often subordinates historical fact to theological/edifying truth (e.g., miraculous events, suppression of sins).
      *   **Joint Unsatisfiability Suspect:** Yes. Strict **Historical Fidelity** (demanding all known flaws/context be included) directly conflicts with **Unambiguous Moral Exemplarity** (demanding a clear, unblemished model for emulation, central to hagiography). Plutarch navigates this by offering complexity *as* the lesson; hagiography rejects it for clarity.
      *   **Status:** Preference-based camps (historians vs. moralists/hagiographers). The theory must explain how learning functions *within* each approach's handling of the tension, not resolve it universally.

  7.  **Narrative Potency Requirement:**
      *   **Phenomenon Protected:** How the *narrative form* itself (plot, character arc, vivid anecdotes, emotional resonance) is essential to conveying the moral lesson, beyond mere factual listing.
      *   **Motivating Case:** Plutarch's use of revealing anecdotes ("a slight thing like a phrase or a jest"); Hagiography's use of miracles, trials, and martyrdom as narrative climaxes proving virtue. The story *shows* the virtue/vice in action.
      *   **Psychology:** Must accommodate research on **narrative persuasion**, **transportation**, and **episodic memory** – stories are more engaging, memorable, and impactful than abstract maxims for conveying complex human truths.
      *   **Status:** Non-negotiable. A theory ignoring narrative's role fails to explain biography's unique power.

  **The Eliminator Requirement:**
  *   **Strict Enforcement of Requirement #1 (Exemplar-Disillusionment Accommodation)** would eliminate the most existing accounts. Many popular approaches (naive hero-worship, purely critical debunking, purely didactic sanitization) fail to adequately explain how encountering flaws *within* the biographical narrative can be pedagogically productive rather than destructive. They either ignore the flaw's presence (hero-worship), see it as solely disqualifying (debunking), or erase it (sanitization), failing Plutarch's core method. A theory must rigorously account for the psychological journey from inspiration through encounter with imperfection to sustained, nuanced moral learning.

  This set of desiderata provides a robust framework for evaluating theories of moral learning from biography, grounded in the paradigmatic cases, psychological realities, and inherent tensions of the genre.
