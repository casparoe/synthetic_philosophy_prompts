  ## Charter of Non-Unilateral Conduct

  **Promulgated by:** The Joint Committee on Non-Unilateral Conduct (JCNUC)  
  **Effective Date:** Upon Ratification (Pending JCNUC Quorum Determination)  
  **Supersedes:** All Previous Informal Agreements Regarding Communal Biscuit Procurement

  **Preamble:**  
  Recognising the inherent peril of individual agency within complex systems, and cognisant of the catastrophic potential latent in seemingly innocuous choices when scaled universally (the "Unilateralist's Curse"), the student body hereby establishes this Charter. Further acknowledging the symmetrical risk wherein universal inaction towards individually beneficial or neutral acts may yield systemic collapse (the "Reverse Unilateralist's Blessing"), the JCNUC is constituted to regulate all conduct possessing potential for aggregate consequence. The scope encompasses all decisions, actions, and intentional inactions undertaken by members of the student body, irrespective of perceived magnitude.

  **Article 1: Definitions**
  1.1. **Unilateral Action:** Any decision or intervention initiated by an individual or sub-quorum group absent explicit prior JCNUC authorisation.
  1.2. **Globally Significant Consequence:** Any outcome affecting more than one individual, or depleting/shifting any shared resource (including, but not limited to: seminar room availability, thermal comfort, sandwich fillings, printer paper, ambient noise levels).
  1.3. **Universal Restraint:** The hypothetical state wherein no actor undertakes a specified action.
  1.4. **Harmful Universal Abstention (Reverse Blessing):** A state wherein the failure of all actors to undertake a specific individually harmless or beneficial action results in aggregate detriment.

  **Article 2: Establishment and Mandate of the JCNUC**
  2.1. The JCNUC is hereby established as the sole authorised body for the review, approval, or prohibition of actions falling under the scope defined herein.
  2.2. Its mandate is to prevent outcomes arising from either:
      2.2.1. The Unilateralist's Curse (Collectively detrimental outcomes arising from individual optimisation).
      2.2.2. The Reverse Unilateralist's Blessing (Collectively detrimental outcomes arising from universal restraint).
  2.3. All student activities requiring resource allocation, coordination, or possessing potential externalities require JCNUC pre-approval via Form JCNUC/1A (Submission and Impact Assessment).

  **Article 3: Prohibition on Unilateral Action (Curse Mitigation)**
  3.1. No member shall undertake any action capable of replication by others where such universal replication is predicted to yield a suboptimal or catastrophic collective outcome, exceeding the utility of universal restraint.
  3.2. Examples Requiring Pre-Approval (Non-Exhaustive):
      3.2.1. Adjusting communal heating controls (Risk: Boiler failure if universally replicated).
      3.2.2. Selecting a sandwich filling from the limited communal platter (Risk: Depletion of preferred fillings if universally selected, leading to suboptimal aggregate satisfaction).
      3.2.3. Booking a seminar room for unscheduled use (Risk: Room allocation cascade failure if universally attempted).
      3.2.4. Introducing a novel biscuit variety to the common kitchen (Risk: Taste preference cascade and potential universal rejection leading to wastage, or universal adoption depleting funds).
      3.2.5. Contributing an unsolicited opinion during a tutorial lull (Risk: Universal replication leading to cacophony and cognitive overload).

  **Article 4: Mandate for Compulsory Action (Blessing Enforcement)**
  4.1. Recognising the peril of Harmful Universal Abstention, the JCNUC may mandate specific actions upon a quorum or the entirety of the student body.
  4.2. Mandated Action applies where:
      4.2.1. The action is individually harmless or beneficial.
      4.2.2. Universal failure to perform the action results in aggregate detriment exceeding the cost of universal performance.
  4.3. Examples of Potentially Mandated Actions (Non-Exhaustive):
      4.3.1. Contributing to communal cleaning rota (Risk: Universal abstention leading to biohazard conditions).
      4.3.2. Voting in student union referenda (Risk: Universal abstention yielding governance by unrepresentative minorities or RON).
      4.3.3. Ordering tea (not coffee) during catered events when supplies are balanced (Risk: Universal abstention from tea leading to coffee depletion and subsequent universal dissatisfaction if coffee is later unavailable).
      4.3.4. Reporting faulty electrical sockets (Risk: Universal abstention leading to fire hazard).

  **Article 5: Oversight and Enforcement Mechanism**
  5.1. The Primary Oversight Committee (POC) is established to review all JCNUC decisions for adherence to this Charter and to prevent unilateral action *within* the JCNUC itself.
  5.2. The POC shall comprise five members elected by the JCNUC, subject to ratification by a simple majority of the student body (requiring quorum thresholds defined in Appendix A).
  5.3. The POC possesses the authority to veto any JCNUC decision deemed to constitute:
      5.3.1. A unilateral action by the JCNUC (e.g., approving a room booking without POC review, thereby risking setting a precedent bypassing oversight if universally replicated by future JCNUCs).
      5.3.2. A failure to mandate a necessary action under Article 4 (e.g., neglecting to enforce tea ordering, risking universal abstention).

  **Article 6: Secondary Oversight and the Problem of POC Agency**
  6.1. Recognising that the POC itself is susceptible to the Unilateralist's Curse (e.g., a POC member unilaterally vetoing a JCNUC decision, which, if universally replicated by POC members, would paralyse governance), a Secondary Oversight Committee (SOC) is established.
  6.2. The SOC shall comprise three members appointed by the POC, subject to ratification by the JCNUC.
  6.3. The SOC shall review all POC vetoes to ensure they were not the product of unilateral reasoning or harmful abstention *within* the POC, and possess veto authority over POC decisions.

  **Article 7: Tertiary Oversight and Regress Mitigation Protocol**
  7.1. Recognising the inherent susceptibility of the SOC to the same curses/blessings afflicting the POC and JCNUC, a Tertiary Oversight Committee (TOC) is established.
  7.2. The TOC shall comprise one member nominated by the SOC, subject to ratification by the POC.
  7.3. The TOC shall review SOC vetoes concerning POC vetoes of JCNUC decisions regarding student actions/inactions.
  7.4. The TOC’s decisions are final, *except* where a single TOC member’s decision constitutes a unilateral action with potentially catastrophic replicable consequences, or a failure to act constitutes Harmful Universal Abstention *at the TOC level*.

  **Article 8: Recursive Oversight and the Nth Order Committee**
  8.1. To address the inherent vulnerability of the TOC (Article 7.4), and any subsequent oversight body, to the foundational curses/blessings, authority for final review of TOC decisions is hereby deferred to the Nth Order Oversight Committee (NOOC).
  8.2. The structure, appointment mechanism, and operating procedures of the NOOC shall be defined in a supplementary charter, to be drafted by the TOC once constituted.
  8.3. Until the NOOC Charter is ratified and the NOOC constituted, all TOC decisions are provisionally binding but subject to potential retrospective invalidation by the NOOC.

  **Article 9: Commencement and Initial Authorisation Paradox**
  9.1. This Charter shall come into effect upon ratification by a simple majority of the student body.
  9.2. However, convening a ratification vote constitutes a unilateral action with potential for harmful replication (e.g., universal replication of unsanctioned voting initiatives) and requires prior JCNUC authorisation.
  9.3. The JCNUC cannot convene to grant such authorisation until this Charter is in effect. This initial paradox is resolved by the *provisional* self-appointment of the undersigned founding members as the *ad hoc* JCNUC, solely for the purpose of authorising the ratification vote for this Charter, recognising this self-appointment as a necessary unilateral action to prevent the Harmful Universal Abstention of permanent non-governance (Reverse Blessing, Art. 4.2). This *ad hoc* body dissolves immediately upon Charter ratification.

  **Appendix A: Quorum Thresholds**
  A.1. JCNUC Quorum: 5 members (or 50% of seated members, whichever is greater).
  A.2. Student Body Ratification Quorum: 20% of enrolled students.
  A.3. POC/SOC/TOC Quorum: 50% of seated members.
  A.4. NOOC Quorum: To be determined by the NOOC Charter (Pending).

  **Appendix B: Form JCNUC/1A (Extract - Section 4: Curse/Blessing Justification)**
  *Please tick applicable boxes and provide rationale:*
  ☐ Action proposed risks Unilateralist's Curse if replicated (Explain predicted aggregate detriment vs. universal restraint): _______
  ☐ **Inaction** regarding this matter risks Harmful Universal Abstention (Explain predicted aggregate detriment of universal inaction vs. universal action): _______
  ☐ Action proposed is deemed intrinsically non-replicable or incapable of generating aggregate consequence (Provide rigorous proof): _______

