  ok so i've been mostly vegetarian for about three months cause my doctor said my cholesterol was getting bad, and now my cousin sent me this long voice memo summarizing a podcast she listened to about why veganism might not actually reduce animal suffering. she said: first, growing crops for plant food kills alot of wild rodents and insects through harvesting and pesticides, so vegans still cause tons of animal deaths. second, beef is mostly pasture-raised, which means it avoids the crop-killing problem almost entirely, and since one cow gives way more meat than one chicken, eating beef kills way fewer individual animals per calorie. third, there's this replaceability argument that says if farm animals have lives worth living, killing and replacing them doesn't reduce total welfare, so as long as chickens live okay lives eating them is basically neutral. she concluded that if you care about wild suffering and total lives affected, beef is probably more ethical than chicken and going fully vegan might not help as much as activists claim.

  how fair is this? i'm definately not sure about the beef part or the replaceability part. can you go through it point by point and tell me what's accurate, what's a subtle misrepresentation or a step that doesn't follow, and whether her conclusion actually holds up? i want specific comments justifying each part, not just a general vibe check.
