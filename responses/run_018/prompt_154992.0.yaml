answer: |-
  ### Final Exam Question: Philosophy of Archaeology Seminar  
  **Time Allowed:** 90 minutes  
  **Marks:** 20  

  **Scenario:**  
  *Orvelte* is a late Neolithic settlement (c. 3000 BCE) with two key features:  
  - **Standardized storage pits:** 40 identical pits (2m diameter, 1.5m depth) distributed evenly behind each of 20 domestic structures. All contain carbonized grain and legumes.  
  - **Uniform grave goods:** All 30 burials in a single cemetery contain identical offerings: one undecorated ceramic bowl filled with barley grains.  

  No textual records, iconography, or organic remains (e.g., textiles, wood) survive.  

  **Essay Prompt:**  
  Explain how the evidence from *Orvelte* illustrates the **underdetermination** of material data by competing interpretations. Specifically:  
  1. **Identify 3 precise auxiliary assumptions** required to infer **centralized economic redistribution** (an *institution*) from the storage pits.  
  2. **Identify 3 precise auxiliary assumptions** required to infer a **shared cosmological obligation** (a *belief*) from the storage pits *and* grave goods.  
  3. **Explain why these inferences are observationally symmetrical**—i.e., why both fit the observed evidence equally well.  
  4. **Specify 2 types of comparative or negative evidence** that could *discriminate* between these interpretations. Avoid appeals to parsimony or unspecified "context."  
  5. **State what this symmetry implies** about archaeology’s capacity to infer *social institutions* versus *collective representations*.  

  ---

  ### Model Answer (840 words)  
  The *Orvelte* case exemplifies underdetermination: identical material patterns support divergent social interpretations because inferences depend on auxiliary assumptions that lack direct empirical support.  

  **(1) Assumptions for Centralized Redistribution**  
  To infer an economic institution, we require:  
  > **A1:** Standardization implies *enforced conformity*. Identical pits reflect top-down design to facilitate resource pooling.  
  > **A2:** Even distribution denotes *household-level quotas*. Grain deposited per pit was mandated by authorities for later collection.  
  > **A3:** Grain in pits is *surplus* seized for redistribution, not household reserves.  

  These assumptions bridge pits to a political economy: elites extract surplus via quotas (A2), enforce compliance (A1), and redistribute to offset local shortages (A3).  

  **(2) Assumptions for Cosmological Obligation**  
  To infer a shared belief, we require:  
  > **B1:** Standardization reflects *ritual prescription*. Identical pits fulfill a sacred template (e.g., symbolic dimensions).  
  > **B2:** Grain storage is *dedicatory*, not pragmatic. Deposits are votive offerings to deities/spirits to ensure cosmic order.  
  > **B3:** Grave goods extend the obligation: bowls of barley in burials represent payment for safe passage to the afterlife, linking storage and mortuary practices to a single cosmology.  

  Here, pits and graves signal adherence to non-utilitarian norms: prescribed rituals (B1) address supernatural contracts (B2–B3).  

  **(3) Observational Symmetry**  
  Both interpretations are symmetrical because they map identically onto the material record through analogous auxiliary claims:  
  - **Pits:** Standardization could equally result from coercion (A1) *or* piety (B1).  
  - **Pit contents:** Grain could be surplus for elites (A3) *or* offerings for gods (B2).  
  - **Graves/goods:** Uniform bowls could reflect economic equality imposed by elites *or* egalitarian ritual duties (B3). No evidence shows *who* placed goods in graves (kin vs. officials) or *why* (tradition vs. law). Critically, **institutions and beliefs produce identical material signatures** when norms are universally followed. A redistributive tax and a divine tithe both generate uniform pits; both suppress individual variation.  

  **(4) Discriminating Evidence**  
  Two evidence types could break symmetry:  
  > **i) Negative evidence of non-compliance:**  
  > - *For redistribution:* Evidence of *hidden* grain stores in dwellings (violating quotas) or pits with significantly less grain than peers (resisting extraction).  
  > - *For cosmology:* Graves with *missing* bowls (rejecting obligation) or pits containing non-prescribed items (defying ritual rules).  
  >   
  > **ii) Comparative evidence from analogous societies:**  
  > - *For redistribution:* Societies with similar pits *and* administrative artifacts (e.g., clay tokens, sealed storerooms) linked to centralized control.  
  > - *For cosmology:* Societies with identical pits/grave goods *and* symbolic artifacts (e.g., altars, deity figurines) *without* signs of stratification.  

  Absence of non-compliance (e.g., all pits identical) *strengthens* both models equally. Discrimination requires evidence of *failed* adherence, revealing whether violations targeted elites (A1–A3) or traditions (B1–B3).  

  **(5) Implication for Archaeological Inference**  
  This symmetry reveals a fundamental limit: **archaeology more reliably infers *institutional outcomes* (uniform behavior) than *causes* (coercion vs. conviction).** Social institutions (e.g., taxes) *could* leave distinctive traces (e.g., administrative buildings, unequal wealth), but when universally accepted, they mirror belief-driven conformity. Conversely, collective representations (beliefs) rarely materialize *except* through practices that resemble institutional compliance. Thus, archaeology excels at documenting *shared behaviors* but struggles to isolate whether norms originate in power structures (institutions) or symbolic worlds (beliefs) without direct evidence of resistance or motivation.  

  ---

  ### Marking Scheme (Total: 20 marks)  
  | **Analytical Move**                                                                 | **Marks** | **Common Failure**                                  |  
  |-------------------------------------------------------------------------------------|-----------|-----------------------------------------------------|  
  | **1. Correctly identifies 3 specific auxiliary assumptions for redistribution**     | 4         | Vague assumptions (e.g., "pits show control")       |  
  | **2. Correctly identifies 3 specific auxiliary assumptions for cosmology**          | 4         | Fails to link pits *and* graves to beliefs          |  
  | **3. Explains observational symmetry via parallel inference structures**            | 4         | Describes ambiguity without showing *how* assumptions align with evidence |  
  | **4. Proposes 2 discriminating evidence types *without* appeals to parsimony/context** | 4         | Suggests "more data" or "better context" vaguely    |  
  | **5. Clearly articulates institutional vs. belief inference limits**                | 4         | Treats institutions/beliefs as equally inferrable   |  

  *Notes:*  
  - **Award partial marks** (e.g., 2/4) for partially complete/partially correct responses.  
  - **Deduct marks** for conflating institutions/beliefs or misusing "underdetermination."  
  - **Prioritize precision:** Assumptions must be testable claims (e.g., "grain is surplus" not "pits are political").  

  ---  
  This question tests core philosophical tensions in archaeological inference while requiring constructive engagement with underdetermination—a hallmark of graduate-level critical analysis. The marking scheme ensures rigor by penalizing vagueness and rewarding specificity in bridge-building.
