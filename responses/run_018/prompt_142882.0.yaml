answer: |-
  Here's a dissection of Dagen H through David Lewis's lens, pinpointing alignments, tensions, and theoretical gaps:

  **Lewis's Core Framework Applied to Dagen H:**
  1.  **The Players:** Primarily individual drivers (and vehicle operators). Pedestrians and cyclists are secondary players whose coordination depends heavily on driver behavior. Crucially, **the State acts as a unique, dominant player:** not just a participant, but the *orchestrator* of the new coordination equilibrium.
  2.  **The Coordination Problem (Post-Announcement):**
      *   **Old Problem:** "Drive on the left" was a stable Lewisian convention based on precedent and mutual interest (avoiding collisions).
      *   **New Problem (Dagen H):** The government *destroyed* the old convention's stability. The new problem became: **"Coordinate on driving on the right *on this specific future date*."** Precedent (left-driving) was now actively dangerous *because* everyone knew the switch was coming. The mutual interest remained avoiding collisions, but the means to achieve it was flipped overnight.
      *   **Nature of the Problem:** It became a **pure coordination game *with a time bomb***. Before H-Hour, driving left was still safe (precedent held). After H-Hour, driving left was catastrophic. The critical coordination task was synchronizing the switch precisely at the designated moment.
  3.  **The "Solution" (Lewis's Technical Sense):**
      *   **The New Precedent:** Driving on the right *after Dagen H*.
      *   **The New Salience:** The government meticulously manufactured it: **"H-Hour" (5:00 AM, Sept 3, 1967)** became the overwhelmingly salient focal point. Everything – massive signage, media saturation, public campaigns, temporary bans – screamed this date and time. It was the *only* conceivable point to coordinate the switch.
      *   **Mutual Interest:** Remained paramount – survival and avoiding chaos.
      *   **Common Knowledge:** The government's campaign aimed for universal awareness *that* the switch was happening, *when* it was happening, *what* the new rule was, and crucially, that *everyone else knew all this too*. This manufactured common knowledge was essential for the new coordination to hold.
      *   **Arbitrariness:** Still present. Right vs. left remained arbitrary *in principle*. The mutual interest was served equally well by either side, *once established*.
  4.  **What Lewis Explains Well:**
      *   **Post-Switch Stability:** Lewis nails this. Once the switch occurred and the new precedent (right-driving) was established through initial universal compliance (enabled by the salience of H-Hour), it rapidly locked in. Mutual interest (avoiding death) ensured conformity, and the new precedent became self-reinforcing – just like Lewis predicts. Deviation became costly and pointless.
      *   **The Role of Salience:** Lewis's concept of a salient focal point is powerfully demonstrated. The government didn't just announce a rule; they created an *unmissable*, time-specific focal point (H-Hour) around which coordination *had* to converge. It functioned exactly like a Schelling focal point, albeit artificially engineered.
      *   **The Need for Common Knowledge:** The massive publicity campaign directly addressed Lewis's requirement. Coordination *requires* knowing others know the rule and will follow it. The state saturated the information space to achieve this.

  **Where Lewis's Theory Struggles or is Silent:**
  1.  **Top-Down Authority & Breaking Precedent:**
      *   **The Anomaly:** This is the core challenge for Lewis's evolutionary story. Lewisian conventions arise *from* repeated interactions solving coordination problems, gradually solidifying precedent. Authority figures *can* be players, but their influence is typically organic (e.g., an early adopter). **Dagen H is revolutionary, not evolutionary.** The state didn't emerge from the convention; it *shattered* a deeply entrenched one using its unique powers (legislation, enforcement, massive resources for publicity, control over infrastructure).
      *   **Is it Still a Focal Point?** Yes, H-Hour was a brilliant Schelling focal point. However, **its creation and enforcement relied entirely on state power**, not emergent salience from the population. Lewis's account *can* accommodate authority *using* salience (a leader suggesting a focal point), but Dagen H involves **authority *imposing* salience through overwhelming force and resources, actively *destroying* the existing equilibrium.** This scale and method stretch the "naturalistic" emergence Lewis emphasizes.
  2.  **Friction Costs & Transition Chaos:**
      *   **Lewis's Blind Spot:** Lewis focuses on stable equilibria. His theory is largely silent on the *transition costs* of moving between equilibria, especially when forced. The accidents, chaos, and economic costs of Dagen H were immense. Lewis's framework assumes coordination is Pareto-improving *once achieved*, but says little about the **Pareto-inferior transition phase** where the old convention is broken before the new one is stable. The mutual interest exists *in the future state*, but the path there involves significant mutual risk and cost.
      *   **Arbitrariness vs. Cost:** While right/left is arbitrary *in isolation*, switching *from* one deeply embedded convention to the other is **decidedly *not* costless or arbitrary.** Lewis acknowledges conventions can be sticky due to switching costs, but doesn't deeply analyze the dynamics *during* a forced switch where costs are actively incurred.
  3.  **Norm Engineering:**
      *   **The Challenge to Naturalism:** Dagen H is a powerful case for **deliberate, large-scale norm engineering by a central authority.** It succeeded because the state monopolized the tools to create universal salience and common knowledge overnight and enforce the new rule. This **undermines the purely bottom-up, emergent vibe** of Lewis's primary examples. It shows conventions can be rapidly *designed* and *imposed* if an agent has sufficient power and resources, bypassing the slow, iterative process Lewis often describes.
  4.  **Authority-Based Salience: Schelling or Anomaly?**
      *   **It's Both:** In the *moment* of coordination at H-Hour, it functioned precisely like a Schelling focal point: given the common knowledge, everyone knew the salient time to switch was 5:00 AM on Sept 3rd. *That aspect* fits Lewis/Schelling perfectly.
      *   **The Anomaly is in the Creation:** The uniqueness lies in **how the focal point was *created* and *enforced*.** Schelling focal points usually emerge from the pre-existing salience landscape or shared understanding. Here, the state *created* the entire salience landscape from scratch through sheer force of will and resources. It didn't just *suggest* a focal point; it *manufactured* an inescapable one and actively dismantled the old one. This top-down imposition of salience on such a scale, overriding deep precedent, is the genuine anomaly for Lewis's evolutionary narrative.

  **Conclusion:**

  Lewis's framework **explains the *coordination mechanics* of Dagen H brilliantly** – the need for salience (H-Hour), common knowledge (the campaign), mutual interest (safety), and the rapid lock-in of the new precedent. It perfectly captures *why* the new convention held after the switch.

  However, Dagen H **exposes critical limitations and tensions:**  
  1.  **Authority's Disruptive Power:** Lewis underplays the ability of a powerful central authority to *forcibly break* a stable convention and *impose* a new salient focal point, bypassing organic evolution.  
  2.  **Ignoring Transition Costs:** The theory is silent on the messy, costly, and dangerous phase *between* equilibria that Dagen H epitomized.  
  3.  **Deliberate Engineering:** The case powerfully demonstrates that conventions *can* be deliberately engineered top-down, challenging the purely emergent picture.  

  **Is Authority-Based Salience Still Schelling?** At the point of coordination (H-Hour), yes. **But the *process* of creating that focal point by destroying the old precedent through state power is a significant anomaly** within Lewis's naturalistic, precedent-driven account of convention formation. Dagen H shows that while coordination dynamics follow Schelling/Lewis rules, the *source* of the salient focal point can be radically external and coercive, not emergent from the population playing the game.
