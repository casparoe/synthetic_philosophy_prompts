answer: |-
  ## Dedication Address: The Uncomfortable Plinth

  **(Standing before the three bronze portraits, facing the mixed crowd)**

  Friends, colleagues, students, neighbors… welcome. We gather today not merely to dedicate bronze, but to confront a question cast in metal and silence. Look upon these faces: Jefferson, Churchill, Columbus. Familiar, monumental, yet rendered strangely incomplete. We see their names, their dates, and a single, stark question: **"What do we owe them?"**

  Below each portrait, there is nothing. No list of triumphs, no catalogue of sins. No justification, no condemnation. This absence is deliberate. It is not a failure of explanation, but a rejection of a particular *kind* of easy explanation. We stand here today, surrounded by the weight of history and the immediacy of now, to grapple with why that easy explanation fails us.

  **(Pause, gesture towards the portraits)**

  When faced with the undeniable flaws, the profound moral failures woven into the legacies of such figures, a common refrain echoes: **“He was a man of his time.”** It sounds like understanding, perhaps even forgiveness. But this phrase wears two very different masks, and it’s crucial we distinguish them.

  The first mask speaks of **knowledge**. It says: *He lacked the moral understanding we possess today. He simply didn’t know better.* This is an appeal to *epistemic limitation*. Jefferson lived before the full articulation of universal human rights; Churchill before the global consensus against colonialism; Columbus before the devastating consequences of his voyages were fully understood. They operated, this argument suggests, in the ethical dark, lacking the light of moral progress we now enjoy. What can we demand of someone working without the right map?

  The second mask speaks of **character and constraint**. It says: *His very motivations, his values, his sense of the possible were entirely shaped by the dominant forces around him. He could not have been otherwise.* This is an appeal to *motivational constitution*. His environment molded him, saturated his being with its norms – norms of racial hierarchy, imperial destiny, or civilizational superiority. To condemn him, this argument implies, is to condemn the very air he breathed. He was a product, pure and simple.

  **(Lean in slightly, address the philosophers directly, but ensure the language remains accessible)**

  Now, my colleagues in history and philosophy will recognize the nuances here, the debates about agency and determinism. But for everyone here, the crucial point is this: **both of these seemingly sympathetic excuses rest upon a hidden, and ultimately false, assumption.** That assumption is what we might call **“serial monism.”**

  Serial monism is the comforting illusion that any given historical era possesses a single, dominant, unified moral framework. It imagines the past as a series of neat, self-contained boxes – the 'Medieval Box,' the 'Enlightenment Box,' the 'Victorian Box' – each with one prevailing, uncontested set of values. Being “of one’s time,” then, implies being completely, uniformly embedded within this singular moral atmosphere. It suggests no alternatives were visible, no dissent was possible, no internal friction existed.

  **(Voice becomes firmer)**

  **This installation rejects that illusion.** We offer no plaques precisely because serial monism is a myth. It collapses under the weight of historical reality. **Within every one of these "times," multiple, competing moral vocabularies clashed, coexisted, and were readily available.**

  **(Introduce the concrete image)**

  Consider Jefferson. We picture him at Monticello, penning declarations of liberty while holding human beings in bondage. The excuse of his "time" falters when we step into his library – *his own library*. There, alongside works justifying slavery or celebrating expansion, sat texts by contemporaries like Condorcet, by English abolitionists like Thomas Clarkson, by Quakers and Enlightenment radicals who articulated powerful, cogent arguments *against* slavery, *for* the inherent equality of all people. These ideas weren't whispers from the distant future; they were ink on paper, circulating in pamphlets, debated in salons and legislative halls *within Jefferson’s reach,* **within his own lifetime.** He possessed not just the *capacity* to know, but access to the *knowledge itself*. The moral dissonance wasn't just external hindsight; it was present, internal, and available for engagement.

  Similarly, Churchill’s era of empire was not a monolith chanting a single imperial hymn. Within the British establishment, voices like E.D. Morel, J.A. Hobson, and indeed, dissenting members of Churchill’s own party and government, publicly condemned the brutality of imperial rule, questioned its morality, and advocated for self-determination. The knowledge of suffering inflicted, the arguments against it, were not secrets revealed only after the empire faded; they were part of the very fabric of the political discourse Churchill navigated daily.

  Columbus sailed into a world already echoing with debates on the treatment of indigenous peoples. Spanish theologians like Bartolomé de las Casas, witnessing the horrors firsthand, launched fierce, public condemnations and appeals to the Crown based on Christian morality and nascent concepts of natural rights *during Columbus's lifetime and in the immediate aftermath of his voyages.* The critique wasn't born decades later; it was a competing voice *within* the conquistadors' own world.

  **(Pause, let this sink in)**

  **This simultaneous presence of competing moralities shatters both easy excuses.** If the knowledge *was* available – not perfect, not complete, but fundamentally challenging the dominant, harmful norms – then the appeal to *epistemic limitation* weakens dramatically. They were not simply blind; they made choices about *which* available knowledge to heed, which arguments to privilege, which voices to ignore.

  And if alternative values *were* actively being articulated and championed by contemporaries, then the appeal to *motivational constitution* – the idea they were helplessly molded by a single, inescapable norm – also crumbles. The "air they breathed" was not pure, homogenous dogma; it was thick with moral contention. They possessed agency, however constrained, to resist, to question, to choose differently than the worst impulses of their age. They could have listened to the Las Casas, the Clarksons, the Morels whispering (or sometimes shouting) dissent.

  **(Address the whole audience with intensity)**

  Therefore, this installation refuses the plaque. It refuses the plaque that offers the easy exoneration: "Don't judge, he knew no better." Because often, in crucial ways, they *could* have known better – the ideas were *there*. It equally refuses the plaque that offers the easy, self-righteous condemnation: "He was purely evil, a monster utterly unlike us." Because they were complex beings navigating a world of conflicting demands and available, though perhaps difficult, moral paths – paths some of their contemporaries *did* choose.

  **So, what *do* we owe them?**

  **(Speak slowly, deliberately)**

  We owe them **neither blind reverence nor simplistic erasure.** We owe them the harder thing: **clear-eyed accountability.** Accountability that acknowledges the genuine constraints of context – the power structures, the limited scientific understanding, the sheer inertia of tradition – *without* absolving them of the choices they made *within* those constraints, choices informed by knowledge and values they actively engaged with or deliberately rejected.

  We owe them the recognition that they lived, not in a monochrome moral desert, but in a landscape rich with competing possibilities. Their failures are not simply the failures of an era, but failures of individual judgment, courage, or empathy *amidst* those possibilities.

  We owe it to ourselves, and to the future that will judge *us*, to resist the seductive simplicity of serial monism. Our own time is not a unified moral block; it is a cacophony of competing claims about justice, responsibility, and the good. We, too, navigate conflicting vocabularies. Recognizing this in the past compels us to confront it in the present. It demands we examine *which* voices we choose to amplify, *which* available moral arguments we embrace, and *which* we conveniently ignore.

  **(Gesture back to the statues)**

  These bronze faces look down upon us, not demanding worship or inviting destruction, but posing an enduring, uncomfortable challenge. The empty space below them isn't ignorance; it's an insistence. An insistence that history's judgment must be nuanced, that moral responsibility transcends the simplistic boundaries of an era, and that understanding the past – truly understanding it – requires us to grapple with its messy, contested, and morally fraught realities.

  **That grappling is what we owe them. That unflinching honesty is what we dedicate today.** May this space provoke not easy answers, but necessary, ongoing, and profoundly important questions.

  Thank you.
