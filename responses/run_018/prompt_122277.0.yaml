prompt: |-
  I'm a political theory PhD student (ABD, still avoiding the diss like it's contagious) and I was arguing with my roommate last night about what actually counts as "the will of the people." We tried to map my gut reactions to some hypothetical cases, and they feel kind of all over the place, but I want to know if there's a coherent principle hiding in them or if I'm just being inconsistent.

  Here's where I definatly land: a national referendum passes 51-49 on stripping judicial review, and I feel like that's the people speaking — razor thin but legit. Parliament votes 60-40 for the exact same reform, and when populists scream "elite betrayal" I think they're wrong; representative democracy is still democratic. But there's been stable 65% support in high-quality polls for five years and committee gridlock kills it every time — that feels like suppression of the will. A president gets elected with 55% after explicitly promising policy X, then does Z and says the people voted for his judgment, not the policy. I think that's a cop-out; the mandate was for X. At a local town hall, 80% of attendees (who are self-selected, older, richer) back a zoning change. Despite the huge margin, I don't think that counts as the people's will. Protest turnout is near zero, so the government claims silent-majority consent. I think that's bogus — absence isn't presence. The one I keep flip-flopping on: a constitutional court strikes down a law that had 70% popular support. Sometimes it feels like the court is protecting a deeper, more stable will against temporary passion; other times it feels like pure anti-democratic overreach. There's tension between the referendum and the town hall (both direct, different margins, different verdicts), and between the court case and the gridlock case (both block popular outcomes, but one feels okay and the other doesn't?).

  Can you state the principle that best captures all of this, commit to it, and tell me which verdict I have to sacrifice if the principle is cleaner? Also, what does it predict for a case I haven't listed — an AI-driven deliberative poll of a statistically representative sample reaches 80% consensus on climate policy, but elected officials ignore it? I want you to actually take a stand, not just list theories and leave me hanging.

  Please format your answer as a JSON object with these exact fields: "principle_name" (string), "principle_statement" (string), "case_verdicts" (array of objects with "case_description", "my_verdict", "principle_verdict", "fit"), "forced_sacrifice" (object with "sacrificed_case" and "reason"), "new_case_prediction" (object with "case_description" and "predicted_verdict"), "confidence_notes" (string). Fill every field, and don't leave anything ambiguous.
reasoning: |-
  Alright, let's tackle this political theory puzzle. The user is a PhD student struggling to reconcile their intuitions about democratic legitimacy across different scenarios. They've presented seven cases with conflicting gut reactions and want a unified principle. 

  First, I notice their discomfort with certain democratic outcomes hinges on nuances beyond simple majority rule. The referendum at 51% feels legitimate despite being razor-thin, but the 80% town hall doesn't - that suggests procedural validity matters more than margin alone. The parliamentary vote being accepted while committee gridlock is rejected points to institutional responsiveness as key. 

  The mandate theory case (president breaking campaign promise) reveals their belief in specific electoral mandates over general trust. The protest absence case shows they reject Hobbesian silent consent theories. The constitutional court dilemma is fascinating - their flip-flopping mirrors real academic debates about counter-majoritarian institutions. 

  Hmm... their core tension seems to be between:
  - Direct vs mediated democracy
  - Transient vs considered preferences
  - Procedural vs substantive legitimacy

  For a unifying principle, "Reflective Popular Authorization" comes to mind - emphasizing processes that force engagement with competing views while ensuring institutional accountability. This would:
  - Validate the referendum (direct procedure)
  - Accept parliamentary vote (mediated but accountable)
  - Reject committee gridlock (unaccountable blockage)
  - Invalidate the president's pivot (broken mandate)
  - Reject the town hall (unrepresentative sample)
  - Reject the silent majority claim (non-participation ≠ consent)
  - Conditionally accept judicial review (if it enables future reconsideration)

  The sacrifice? The 70% court strike-down case. My principle forces them to consistently view it as overreach unless the court's reasoning creates space for democratic re-engagement. 

  For the AI deliberative poll case - 80% consensus from a statistically representative sample being ignored? Under this principle, that's absolutely suppression of popular will. The process is more reflective than a referendum, making it superior to snap votes. 

  Confidence level: 7/10. The sacrifice might feel painful, but it resolves their flip-flopping. The principle borrows from Pettit's neo-republicanism and Fishkin's deliberative democracy while avoiding pure majoritarianism.
