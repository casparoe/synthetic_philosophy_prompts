answer: |-
  ## Research Proposal: The Ethics of Inherited Navigational Speech - Renaming Streets vs. Removing Statues

  **1. Research Question and Stakes (Approx. 400 words)**

  **Precise Question:** Does the functional embeddedness of street names – their role as indispensable practical coordinates within daily navigation, communication, and emergency systems ("inherited navigational speech") – create a significantly different ethical obligation to rename them when the honoree is discredited, compared to the removal of statues which serve primarily as commemorative displays? Specifically, how do standard ethical frameworks (harm-based, consent-based, narrative-integrity-based) yield divergent prescriptions when applied to objects categorized by their level of practical embeddedness, and does this necessitate a distinct principle (like "semantic rupture") for renaming?

  **Stakes:** The current public debate over contested commemorations is polarized and conceptually muddy. Critics of renaming/removal often invoke "erasing history" or slippery slope arguments, while proponents focus on present-day harm or symbolic violence, rarely distinguishing between monument types. This conflation obscures a critical asymmetry. Statue removal physically relocates an object; its symbolic presence is diminished, but the historical fact of its existence and its commemoration remain observable (e.g., in museums or archives). Renaming a functionally embedded label, however, causes an immediate practical discontinuity: it vanishes from maps, GPS, databases, and daily speech, disrupting navigation, logistics, and civic infrastructure. Simultaneously, *not* renaming forces residents to perpetually invoke a discredited figure in essential communication ("Meet me at [Offensive Name] & Main"). This unique combination – the *obligation to use* a name one finds objectionable within essential functions, versus the *option to view* a statue – creates a distinct ethical pressure point. Understanding whether and how this embeddedness fundamentally alters the ethical calculus is crucial. It moves the debate beyond simplistic "keep or remove" binaries towards nuanced, context-sensitive policies. It asks: Does forcing future generations to navigate using the name of a discredited figure constitute a unique form of intergenerational burden that demands a distinct ethical response, potentially even one that rejects simple substitution (hero A for hero B) in favor of marking narrative discontinuity?

  **2. Why Existing Debates Leave the Question Open (Approx. 400 words)**

  Current discussions fundamentally fail to address the core distinction proposed here. Proponents of removal/renaming often treat statues and street names as essentially equivalent symbols of oppression or harm, emphasizing the psychological impact or endorsement of values inherent in public commemoration. Opponents similarly collapse categories, arguing across the board that removal constitutes historical erasure or disrespects heritage, without acknowledging the differing mechanisms of "erasure" or "endorsement" involved. The "erasure" argument is particularly problematic: while removing a statue changes its *location and prominence*, it rarely erases the *fact* of its prior existence or commemoration from accessible history. Renaming a street, conversely, actively *removes the label* from functional circulation, creating a genuine practical break – an "erasure" from the operational layer of daily life.

  Furthermore, the dominant "harm vs. history" framing ignores the specific phenomenology of *inherited navigational speech*. The harm of a statue is primarily visual and symbolic, encountered through sight and interpretation. The harm (or burden) of a street name is linguistic, practical, and unavoidable; it must be *spoken and used* for essential tasks. The consent argument is also inadequately addressed: while no one consents to public monuments generally, the *requirement to actively use* a specific name embedded in essential infrastructure feels like a qualitatively different imposition of an unwanted narrative. Public debates also rarely grapple with the temporal asymmetry. The practical discontinuity caused by renaming – the administrative reset, the database updates, the potential for confusion – is a concrete cost absent in statue relocation to a museum context. Conversely, the *persistent, forced invocation* inherent in keeping a problematic street name is a unique cost not replicated by a statue standing in a park that one can avoid or ignore. These distinct costs and burdens remain obscured when statues and street names are lumped together, leaving the ethical significance of functional embeddedness unexplored and the question genuinely unresolved.

  **3. Conceptual Approach, Taxonomy, and Rejection of Alternatives (Approx. 600 words)**

  **Core Approach:** This project adopts a rigorously conceptual methodology. Its primary aim is to construct a novel analytical framework focused on **functional embeddedness** – the degree to which a commemorative object is interwoven into the essential, practical operations of daily life and civic infrastructure – and then systematically test how established ethical frameworks respond to variations in this embeddedness. The central comparison will be statues (low embeddedness) vs. street names (high embeddedness).

  **Taxonomy of Embeddedness:** The analysis will hinge on a three-tiered taxonomy:
  1.  **Pure Display (e.g., Statues, Plaques, Murals):** Objects whose primary function is symbolic commemoration or aesthetic appreciation. Interaction is largely voluntary (viewing, interpreting). They exist *within* the functional infrastructure but are not essential coordinates *of* it. Removal causes symbolic change and visual absence, but minimal practical disruption.
  2.  **Navigational Labels (e.g., Street Names, Bridge Names):** Labels that are fundamental, unavoidable linguistic coordinates for spatial orientation, navigation, communication (directions, addresses), and emergency response. They are deeply embedded in databases, maps, and everyday speech. Interaction is often mandatory for civic participation and essential services. Renaming causes significant practical discontinuity.
  3.  **Institutional Addresses (e.g., School Names, Building Names):** Labels applied to functional institutions. Embeddedness lies in the institution's operational identity and the community's association with it. Renaming impacts institutional identity, records, and community perception, causing moderate practical and symbolic disruption.

  **Application of Ethical Frameworks:** The project will then apply three dominant ethical lenses to commemorative objects within each category:
  *   **Harm-Based:** Does the commemoration cause quantifiable or significant psychological, social, or representational harm? How does the *mode* of interaction (viewing vs. forced verbal use) affect the nature and severity of perceived harm?
  *   **Consent-Based:** To what extent are current users bound by, or forced to participate in, a commemorative narrative they reject? How does embeddedness increase the sense of non-consensual imposition (e.g., *having* to say the name)?
  *   **Narrative-Integrity-Based:** Does removal/renaming constitute an unjustified rupture in collective memory, or a necessary correction? How does embeddedness affect the perceived "authenticity" or continuity of the narrative? Does renaming a navigational label demand a different narrative strategy (e.g., "semantic rupture" - adopting neutral geographic terms, local flora, or explicitly commemorating rupture itself) than relocating a statue?

  **Rejection of Alternative Approaches:**
  *   **Historical Survey:** While valuable contextually, cataloging specific renaming campaigns would shift focus from the underlying *conceptual structure* of the ethical problem posed by embeddedness. The goal here is not to adjudicate specific cases but to build a framework for analyzing the distinctions between types of cases.
  *   **Legal Framing (Property Rights, Free Speech):** Legal arguments about state ownership, viewpoint neutrality, or vandalism address the *permissibility* of action under law, not the underlying *ethical obligations* arising from the distinct nature of the commemorative objects themselves. Legal frameworks often lag behind or oversimplify ethical nuance.

  **Bridging Conceptual Gap:** The project proposes to utilize concepts from **intergenerational obligation** – particularly ideas concerning the burdens inherited through persistent structures (e.g., infrastructure, institutions, linguistic conventions) – to theorize why navigational labels feel distinct. The "inherited navigational speech" concept posits that functional labels bind individuals into a practical and narrative network established by prior generations, creating a unique ethical tension between operational necessity and narrative rejection that pure display objects do not impose to the same degree. This lens helps avoid reducing the issue to *only* present harm or *only* historical preservation.

  **4. Defining Success, Failure, and Inconclusiveness (Approx. 500 words)**

  **A Successful Result** would clearly articulate how **functional embeddedness systematically modifies the outputs** of the three ethical frameworks when applied to commemorative objects.
  *   **Success Condition 1:** Demonstrating that high embeddedness (Navigational Labels) consistently amplifies or qualitatively alters the conclusions of *at least one* ethical framework (Harm, Consent, or Narrative Integrity) compared to Pure Display objects, under conditions where the commemorated figure is similarly discredited. For instance, showing that the Consent framework yields a *stronger* obligation to rename a street than to remove a statue due to forced use, or that the Harm framework identifies a *different kind* of harm (linguistic imposition vs. symbolic offense).
  *   **Success Condition 2:** Establishing that the taxonomy itself (Pure Display, Navigational Label, Institutional Address) is a meaningful and non-arbitrary way to categorize commemorative objects for ethical analysis, revealing distinctions obscured by monolithic "monument" categories.
  *   **Success Condition 3:** Providing a robust conceptual argument for *why* embeddedness matters ethically, grounded in the intergenerational obligation/interference framework, moving beyond intuition to explain the distinct ethical "feel" of navigational labels.
  *   **Success Condition 4:** Generating concrete insights into the "semantic rupture" hypothesis – whether high embeddedness specifically warrants a different *type* of renaming strategy focused on marking discontinuity rather than substitution.

  **Inconclusive Results** would arise if:
  *   The taxonomy proves unstable or fails to yield consistent distinctions in ethical analysis across categories.
  *   The ethical frameworks, when rigorously applied, produce largely similar prescriptions regardless of embeddedness level for the core question of obligation to rename/remove.
  *   The intergenerational obligation framework fails to provide a compelling explanation distinct from existing harm or preservation arguments, leaving the intuition of distinctness unexplained.

  **Failure** would be indicated by:
  *   The inability to construct a coherent taxonomy or to meaningfully apply the ethical frameworks within it.
  *   Demonstrating that the distinction between statues and street names is ethically trivial or reducible entirely to factors already well-covered in existing debates (e.g., only cost or only symbolic potency).
  *   The core concept of "inherited navigational speech" proving analytically empty or indistinguishable from general notions of cultural inheritance.

  Ultimately, success means providing a clear, defensible answer to whether embeddedness *changes the moral calculus* and a conceptual toolkit for understanding *how* it does so, or conclusively demonstrating that it does not.

  **5. Scope, Deliverables, and Conceptual Risk (Approx. 400 words)**

  **Realistic Six-Month Scope:**
  *   Months 1-2: Deep conceptual development: Refining the taxonomy of embeddedness; detailed articulation of the Harm, Consent, and Narrative Integrity frameworks; formulating the "inherited navigational speech" and "semantic rupture" concepts; integrating intergenerational obligation theory.
  *   Months 3-4: Systematic application. Applying each ethical framework to hypothetical or stylized examples within each category of the taxonomy (focusing on Pure Display vs. Navigational Label). Identifying points of convergence and, crucially, divergence in ethical prescriptions based on embeddedness.
  *   Months 5-6: Synthesis and proposal refinement. Analyzing results of the application phase; evaluating the "semantic rupture" hypothesis; drafting the research proposal document detailing the framework, key findings, conceptual challenges, and future directions; preparing workshop presentation materials.

  **Deliverables:**
  1.  A comprehensive 4000-5000 word research proposal document structured as outlined.
  2.  A concise presentation (approx. 20 mins + Q&A) suitable for an interdisciplinary workshop, summarizing the core question, approach, taxonomy, key insights on embeddedness, and open questions.
  3.  Detailed working notes documenting the application of ethical frameworks across the taxonomy categories.

  **Biggest Conceptual Risk:** The most significant risk is the potential **complexity and instability of the intergenerational obligation framework** when integrated with the taxonomy and applied to concrete ethical dilemmas. Theorizing the precise nature of the "burden" imposed by inherited navigational speech – how it differs from general cultural inheritance, why it creates a *distinct* obligation compared to passive inheritance of historical narratives embodied in statues, and how it interacts with the practical necessity of the label – is inherently challenging. This framework risks becoming overly abstract, failing to yield clear, applicable insights, or collapsing back into existing harm or consent arguments, thereby undermining the project's core novelty. Mitigation involves constant grounding in the concrete phenomenology of using a street name versus viewing a statue and rigorous testing against counterexamples throughout the application phase. If this integration proves intractable, the project may need to pivot towards analyzing embeddedness primarily through the lens of the three core ethical frameworks alone, though this would represent a significant narrowing of the original ambition.
