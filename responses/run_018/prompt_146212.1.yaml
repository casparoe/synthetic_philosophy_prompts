  ### Decision Scenario  
  A hospital administrator must choose between two treatment protocols for a critical illness. In the first decision, Protocol A guarantees that all 100 patients will survive but with a moderate, lifelong disability (e.g., chronic pain). Protocol B will likely enable nearly all patients to survive without any disability, but there is a very small possibility that a few patients will die unexpectedly due to rare complications. The administrator, prioritizing the certainty of survival, selects Protocol A to avoid any risk of death.  

  In the second decision, a new group of 100 patients faces the same illness, but the hospital’s resources are constrained. If Protocol A is used, almost all patients will die (due to a sudden shortage of essential supportive care), with only a handful surviving with the same moderate disability. If Protocol B is used, the outcome mirrors the first scenario: nearly all patients will likely survive disability-free, but a very few may still die from complications. Here, the administrator chooses Protocol B, reasoning that since most patients will die under Protocol A anyway, it is better to risk a small chance of death for the possibility of full recovery.  

  ### Structural Feature Driving Divergence  
  The key feature is the **transformation of a common outcome from a desirable state (survival with disability) to an undesirable state (death)**, which shifts the administrator’s risk attitude. In the first decision, the guaranteed survival (even with disability) makes the administrator risk-averse, avoiding Protocol B’s tiny death risk. In the second decision, the near-certainty of death under Protocol A’s common outcome makes the administrator risk-seeking, accepting Protocol B’s death risk for a chance at a better outcome.  

  ### Effect of Removing the Feature  
  If the common outcome remains unchanged (e.g., survival with disability persists in both scenarios), the divergence disappears. For instance:  
  - **First decision (unchanged):** Protocol A (all survive with disability) vs. Protocol B (most survive disability-free, tiny death risk).  
  - **Second decision (modified):** Protocol A now has a *small chance* of survival with disability (not near-certain death), while Protocol B remains unchanged.  
  Here, consistency emerges: if the administrator initially preferred Protocol A to avoid death risk, they would also prefer it in the second decision. The preference reversal only occurs when the common outcome deteriorates, exploiting aversion to certainty loss.  

  ### Defender of Independence Axiom: Rational Preference Argument  
  A defender of the independence axiom would argue that the scenario misdescribes rational preferences by conflating outcomes with contextual emotions. The axiom requires evaluating only the *differences* between options, isolated from identical outcomes. Here:  
  1. **First decision:** The real choice is between:  
     - Certain survival with disability (Protocol A).  
     - A gamble: *likely* survival without disability vs. *tiny risk* of death (Protocol B).  
  2. **Second decision:** The choice is between:  
     - A gamble: *tiny chance* of survival with disability vs. *near-certain* death (Protocol A).  
     - The *same gamble* as in Protocol B’s first decision (likely survival without disability vs. tiny death risk).  
  The identical "gamble" component (survival without disability vs. death) appears in Protocol B *in both decisions*. If Protocol B is rejected in the first decision due to its death risk, it must also be rejected in the second—since the death risk is unchanged. Preferring Protocol A in the first decision but Protocol B in the second violates internal consistency. The reversal stems from irrational context-dependence (e.g., overvaluing certainty in the first frame and undervaluing identical risks in the second). Rational agents should recognize that the common outcome shift is irrelevant; only the differential risks matter.  

  This captures the Allais tension: the arithmetic of risks is identical in the gambles, but emotional responses to certainty (first decision) versus despair (second decision) distort choices. The independence axiom insists that such contextual shifts should not alter preferences if the core trade-offs are unchanged.
