  Below is the villanelle structured according to your specifications:

  This bed is real, the solid thing I see.
  The craftsman labors, measures wood and trace,
  Copying the Form set by divinity.

  The painter's hand, a flickering decree,
  Makes shadow-beds that fill this bounded space—
  This bed is real, the solid thing I see.

  The fire casts the shapes that shackle me,
  While truer suns grant vision and embrace,
  Copying the Form set by divinity.

  The carpenter strives toward reality,
  Yet builds a thing confined by time and place—
  This bed is real, the solid thing I see.

  The mind ascends the line towards the key,
  Where knowing knows itself in Truth's pure grace,
  Copying the Form set by divinity.

  Shadows are signs, particulars agree,
  But Being waits beyond the mind's own chase—
  This bed is real, the solid thing I see,
  The bed is but a copy, never free.
  That Unwavering Light gives the Form its right,
  Copying the Form set by divinity.
  The bed is but a copy, never free.
