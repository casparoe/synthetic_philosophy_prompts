  I'm assembling a dataset that asks models to render philosophical ideas through tightly constrained verse rather than through exposition, and I need a piece that treats Plato's cave and the theory of forms with enough specificity that it cannot be answered from generic summaries. Focus on Republic X's argument about the three beds—the Form made by the god, the carpenter's particular, and the painter's shadow—together with the divided line's four levels and the distinctive status of the Good as the condition for recognizing forms rather than one form among others. Write a villanelle: nineteen lines, five tercets and a closing quatrain, with two refrains that alternate according to the form's rules and finally stand together in the last two lines without merging. The first refrain should be spoken from the prisoner's position, taking the painter's shadow-bed for the bed itself; the second from the ascending philosopher's position, insisting that even the carpenter's bed is only an image of the true Form. Let the cyclical repetition do structural work: each return of a refrain should occur in a subtly altered context, tracking the problem of participation—that the particular participates in the Form without ever becoming it, and the shadow participates in the particular without reaching it—so that by the final couplet the lines sit side by side in unresolved tension, enacting the ontological gap. Present only the poem itself as continuous verse, with no explanatory headings, bullet points, bold text, tables, or framing commentary broken into lists or annotations.
