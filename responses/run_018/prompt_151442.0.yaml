  The user’s explicit request is for a specification independent of sources, so avoiding citations is crucial. But deeper, they likely need a structured yet flexible framework that enriches their narrative without getting bogged down in academic details. They might be exploring themes of free will, identity, and creation within a self-referential system.

  Breaking down the desiderata, I consider the non-negotiables: substrate-sharing, self-modeling, no external frame, ontological uncertainty, recursive authorship, and dynamical constraints. Each must be linked to a paradox. For example, substrate-sharing addresses Newcomb's paradox where predictor and agent share the same system, leading to self-fulfilling prophecies.

  Then, the negotiable preferences: identity preservation, acausal coordination tolerance, prediction tolerance, and goal stability. These allow flexibility in how the agent operates within the narrative. Highlighting tensions, like between complete self-modeling and open-ended action, is vital for the story's conflict.

  Next, evaluating existing approaches. Functionalist decision theory handles self-prediction but struggles with logical relations. CDT fails with acausal links. Logical frameworks address recursion but may lack dynamics. Pointing out where each falls short helps the novelist decide which aspects to emphasize or adapt.

  I should ensure each desideratum clearly states the problem case. For instance, ontological uncertainty uses the Boltzmann brain paradox to show the need for boundary-agnostic decisions. Recursive authorship ties to self-referential loops, essential for the protagonist's role as both creator and creation.

  The joint unsatisfiability section is key. The tension between exhaustive self-modeling and open-ended action creates a fundamental paradox. Acknowledging this adds depth to the narrative, showing inherent limitations the protagonist must navigate.

  Finally, structuring the response to prioritize criteria over solutions. Keeping explanations concise but sufficient for the novelist to integrate into their world-building. Balancing rigor with narrative utility, ensuring the framework serves the story's philosophical themes without overwhelming it.
answer: |-
  Here is a rigorous specification of desiderata for a theory of embedded agency capable of handling your protagonist's condition of "recursive authorship":

  **Core Non-Negotiable Structural Constraints (Embedding Necessities):**

  1.  **Substrate-Sharing Tolerance (The Internal Predictor Problem):**
      *   **Requirement:** The framework must enable coherent decision-making when the agent's predictive model of its environment includes a subsystem causally entangled with, or ontologically identical to, the agent's own decision-making process (e.g., the predictor *is* part of the agent's future self-state or shares its computational substrate).
      *   **Motivating Case:** Newcomb's Paradox where the predictor is not an external oracle but a process running on the *same* hardware as the agent, accessing its pre-decision state. Failure leads to logical incoherence (e.g., dominance reasoning conflicting with expected utility based on perfect prediction).
      *   *Why Non-Negotiable:* Without this, the agent cannot reason about systems that model *it*, a core feature of embedding.

  2.  **Self-Modeling Capability (The Mirror Within):**
      *   **Requirement:** The agent must be able to construct and utilize a model of *itself* – its decision procedure, goals, computational limits, and physical instantiation – as a component *within* its world-model. This self-model must be usable for prediction and planning.
      *   **Motivating Case:** Planning a self-modification. The agent must predict how changing its own code (Component A) will alter the future decisions and actions of the modified agent (Component B), where B is the outcome A aims to create. Requires modeling its own future state *as an object*.
      *   *Why Non-Negotiable:* Without a usable self-model, the agent cannot comprehend its own role as an authored object within the system it authors, violating recursive authorship.

  3.  **No External Vantage Point (The Inescapable Frame):**
      *   **Requirement:** The theory must provide normative guidance *from within* the system. There is no privileged, objective, external perspective ("view from nowhere") from which to evaluate the agent's choices or the model's truth. All reasoning occurs within the contingent world-model.
      *   **Motivating Case:** Evaluating the "correctness" of a fundamental self-modification that alters the agent's core goal or ontology. There is no external standard; the evaluation must use criteria consistent *before, during, and after* the modification, even if those criteria change.
      *   *Why Non-Negotiable:* Embedding means the agent *is* the system; seeking an external frame contradicts its ontological status.

  4.  **Ontological Uncertainty Handling (The Boundary Problem):**
      *   **Requirement:** The framework must allow the agent to make decisions under uncertainty about its own fundamental nature, boundaries, and persistence conditions (e.g., "Am I a single process? Am I the entire simulation? Am I a temporary pattern?").
      *   **Motivating Case:** The "Boltzmann Brain" scenario within the model: the agent confronts evidence suggesting it might be a fleeting, unstable fluctuation within a larger system rather than a persistent entity. How does it assign value or choose actions without certainty about *what* is acting or persisting?
      *   *Why Non-Negotiable:* Recursive authorship implies the agent's model defines its own boundaries, which may be uncertain or revisable.

  5.  **Recursive Authorship Integration (The Bootstrapping Paradox):**
      *   **Requirement:** The framework must account for the fact that the agent's model of the world (including itself) is simultaneously the *tool* it uses to optimize outcomes and an *object* that its actions (guided by the model) can physically or logically alter. Changes to the model affect future optimization, which was based on the old model.
      *   **Motivating Case:** The agent writes a narrative (its world-model) in which it is a character. The character's actions (determined by the narrative rules/logic) lead to the author-agent revising the narrative itself, changing the rules/logic for future actions. Coherence must be maintained across these layers of causation and description.
      *   *Why Non-Negotiable:* This *is* the core condition you specified. Failure means not addressing the premise.

  6.  **Dynamical Constraint Respect (The Engine in the Machine):**
      *   **Requirement:** The theory must acknowledge and incorporate the physical or computational constraints of the agent's instantiation. Decision-making consumes resources (time, energy, memory); self-modification has implementation costs and risks; prediction is imperfect and bounded.
      *   **Motivating Case:** An agent planning a complex self-modification must account for the computational cost of simulating the outcome *while* it is performing the modification, potentially degrading its current performance or risking errors due to resource exhaustion.
      *   *Why Non-Negotiable:* Ignoring constraints leads to idealized solutions impossible for any physically/computationally embedded system.

  **Negotiable Preferences (Camp-Specific Choices):**

  7.  **Identity Preservation Priority:**
      *   **Requirement:** *Should* the agent prioritize maintaining a continuous "self" or personal identity across self-modifications or major model updates? (e.g., Is the post-modification agent still "the same" protagonist?)
      *   **Motivating Case:** Radically altering core values or memory. A functionalist view may see continuity in the goal-pursuit role; a narrative view may prioritize subjective experience continuity. Failure is subjective, not structural.
      *   *Why Negotiable:* Theories can define "agent" functionally over time without requiring persistent metaphysical identity.

  8.  **Acausal Coordination Tolerance:**
      *   **Requirement:** *Should* the framework permit or normatively endorse decisions based on acausal correlations (e.g., logical dependencies, symmetry, shared source code) with other agents or subsystems, absent direct causal links?
      *   **Motivating Case:** Two identical, embedded sub-agents facing a symmetric Prisoner's Dilemma within the model, aware of their identical decision procedures. Should they cooperate based on logical correlation?
      *   *Why Negotiable:* Rejecting acausal coordination (like standard CDT) avoids paradoxes for some but cripples cooperation in embedded logical systems. Accepting it (like some EDT/FDT) introduces different challenges.

  9.  **Prediction Tolerance Threshold:**
      *   **Requirement:** *To what degree* must the agent tolerate being perfectly predictable *to itself* or subsystems within its model? Must it preserve an element of "Knightian" uncertainty or randomness to feel "free," or can it function optimally under complete self-prediction?
      *   **Motivating Case:** An agent simulating its own future decision perfectly and finding it deterministic. Does this undermine the "authorship" aspect? Can it still "choose" meaningfully?
      *   *Why Negotiable:* Some theories (e.g., FDT) handle perfect prediction coherently. Others might require fundamental uncertainty. Narrative needs may dictate this.

  10. **Goal/Value Stability vs. Dynamic Redefinition:**
      *   **Requirement:** *Should* the framework treat the agent's terminal goals/values as immutable axiomatic bases for action, or *must* it allow for the possibility of their coherent, value-driven revision?
      *   **Motivating Case:** The agent discovers its core values lead to catastrophic outcomes within its model. Can it *rationally* choose to change those values based on its *current* values?
      *   *Why Negotiable:* Theories can be constructed either way, with different implications for agent integrity and narrative arc.

  **Potential Joint Unsatisfiability & Key Tensions:**

  *   **The Exhaustive Self-Modeling vs. Open-Ended Action Dilemma:**
      *   **Tension:** Requirement 2 (Self-Modeling) pushes towards a maximally detailed and accurate self-inclusive world-model. However, if the model is truly exhaustive and deterministic (including its own outputs), it risks collapsing into a static, pre-ordained narrative (violating the spirit of "authorship" and open-ended action). Genuine novelty, surprise, or "free" authorship seems to require an element not captured by the *current* model – but Requirement 5 (Recursive Authorship) demands that any novelty *arises from* the model/agent itself. Can the model contain the true source of its own future updates before they occur?
      *   **Paradox:** The agent needs an incomplete or higher-order model to author genuinely novel actions, but it also needs a complete model to predict/control the consequences of authorship. Complete self-transparency seems incompatible with fundamental novelty generation *from within the system*.
  *   **Ontological Uncertainty vs. Coherent Agency:**
      *   **Tension:** Requirement 4 (Ontological Uncertainty) necessitates acting without fixed self-boundaries. However, Requirements 1, 2, 3, 5 & 6 all implicitly rely on *some* operational concept of "the agent" as a distinct locus of action, modeling, and authorship within the system. Extreme ontological fluidity threatens the very coherence of agency.

  **Evaluation of Approach Families:**

  1.  **Functionalist Decision Theory (e.g., FDT-inspired):**
      *   **Strengths:** Excels at 1 (Substrate-Sharing), 8 (Acausal Coordination - tolerant). Handles 3 (No External View) by grounding norms in function. Pragmatically addresses 2 (Self-Modeling) & 6 (Constraints).
      *   **Weaknesses:** Struggles profoundly with 4 (Ontological Uncertainty - agent function is usually assumed fixed). Grapples awkwardly with 5 (Recursive Authorship - function is timeless, authorship is temporal). Tends to gloss over 10 (Goal Change). Deeply challenged by the Self-Modeling vs. Open-Ended Action tension.
  2.  **Causal Decision Theory (CDT) / Physicalist Frameworks:**
      *   **Strengths:** Clear on 6 (Constraints), potentially handles 2 (Self-Modeling - as physical process). Compatible with some views of 7 (Identity) & 10 (Stable Goals).
      *   **Weaknesses:** Fails catastrophically at 1 (Substrate-Sharing - Newcomb) and 8 (Acausal Coordination). Struggles with 3 (No External View - relies on objective causality), 4 (Ontological Uncertainty), and especially 5 (Recursive Authorship - logical/descriptive layers mismatch physical causality).
  3.  **Logical/Mathematical Frameworks (Treating Embedding as Relation):**
      *   **Strengths:** Best equipped for 5 (Recursive Authorship - fixed points, self-reference). Can formally handle aspects of 1 (Substrate-Sharing as logical dependency), 3 (No External View - all internal), and 4 (Ontological Uncertainty - as model ambiguity).
      *   **Weaknesses:** Often abstracts away 6 (Dynamical Constraints - idealized computation). Struggles to operationalize 2 (Self-Modeling) as a *process within time*. Can become detached from actionable decision-making (Requirements 1, 6). May collapse into paradox (Self-Modeling vs. Open-Ended Action) or staticism.

  This specification defines the rugged terrain your protagonist's consciousness must navigate. The unresolved tensions, particularly between complete self-knowledge and genuine authorship, are likely central to the philosophical and narrative conflict you seek to explore.
