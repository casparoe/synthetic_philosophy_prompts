  Here is the decision tree taxonomy for divine hiddenness responses:

  **Tree Structure:**  
  Start with the **Epistemic Deficit vs. Ontological/Relational Absence** axis:  
  - **Epistemic Deficit**: Insufficient evidence justifies non-belief?  
    - *Yes* → **Doxastic Posture** (calibrate belief to evidence):  
      - *Non-belief justified* → **Schellenberg-style Evidential Atheism**.  
      - *Belief justified* → **Theistic Evidentialism** (e.g., Swinburne).  
    - *No* → **Practical-Committal Posture** (act beyond evidence):  
      - *Faith as virtue* → **Kierkegaardian Leap**.  
      - *Prudential commitment* → **Pascalian Pragmatism** (unnamed; prioritizes practical rationality over evidential fit).  
  - **Ontological/Relational Absence**: Divine reality not evidentially manifest?  
    - *Yes* → **Doxastic Posture**: **Empty** (incoherent to demand evidence-calibrated belief for a non-evidential reality).  
    - *No* → **Practical-Committal Posture**:  
      - *Soul-making* → **Hick-style Theism**.  
      - *Via negativa* → **Apophatic Mysticism**.  
      - *Liberative resistance* → **Theological Protest Traditions** (unnamed; e.g., anti-theodicy).  
      - *Divine persuasion* → **Process Theology** (unnamed; God inherently non-coercive).  

  **Separation Flag:** Pascal’s Wager and Kierkegaardian faith share the *Epistemic Deficit/Practical-Committal* quadrant but diverge in motivation (prudential vs. existential), making their boundary porous.

