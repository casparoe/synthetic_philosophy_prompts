prompt: |-
  hey, i'm a software engineer with zero formal philosphy training but i've been trying to understand this hume idea that taste isn't totally subjective and there's some standard. my friend who majored in philosophy has been explaining her takes on different beauty cases. here's what she's said so far: if a trained art critic and a random person disagree on a painting, the critic is closer to right; if two equally trained critics disagree about some modern abstract thing, that doesn't kill objectivity, it probably just means one is biased or hasn't looked long enough; a pop song that millions love but critics call garbage is genuinely inferior; art from a culture far from ours shouldn't be judged by our local norms; and a work that gets more beautiful the longer you study it is probably actually good, not just trendy.

  now there's this new situation: an AI image generator made a portrait that looks like a perfect renaissance painting, but there's zero human painter behind it — just prompts and weights. some critics say its genuinely beautiful and moves them deeply; others say its hollow, like calling a mirror beautiful, because there's no human intention or lived experience in it. my friend hasn't weighed in on AI art yet.

  what do you think she'll say — beautiful or not? more importantly, what rule is she actually running? is it expert agreement, human intention behind the work, the refined feeling it gives qualified viewers, or something else? map each rule back to her earlier verdicts and tell me which ones fit. also which of her past cases is the closest analog here, and what's one more case i could ask her that would actually split the rules apart?
