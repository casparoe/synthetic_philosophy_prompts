prompt: |-
  hey, i've got a weird pattern i've been tracking in seminars and i keep wondering if philosophy has already named it.

  here's teh thing: someone makes a flat assertion — not hedged, not quoted, just "X is teh case" — and they defend it with arguments that show they don't actually meet teh epistemic standard they'd need for knowledge. then when you push them on that, they don't retreat to "i believe it" or "it's likely"; they shift to saying they're "using X as an organizing frame" or "treating X as a working posture." but here's teh kicker: later, in a diffrent discussion, they cite that same X as background knowledge to support something else, with no reminder that it was ever provisional. it's not motte-and-bailey — there's no strong/weak pair, just one claim that oscillates between being epistemically committed and being methodologically suspended. it's not devil's advocate because they never flag teh suspension, and it's not plain belief-change because they defend X in both modes.

  i think it might sit near contextualist theories of assertion, or maybe near teh literature on "assertoric force" versus "propositional content," but those don't quite capture teh temporal toggle — using teh same utterance as both a knowledge-claim and a heuristic device across contexts.

  so: is there an established term for this? if there is, what's teh closest match and where does my case differ? if there isn't, can we coin one with clear boundry conditions — specifically, how do we distinguish it from legitimate interdisciplinary borrowing, from strategic ambiguity, and from teh ordinary fact that we sometimes speak loosely? i want teh carving, not just teh label; teh examples matter more than teh taxonomy, and i don't need a reading list, just teh concept mapped out.
reasoning: |-
  Okay, the user is describing a pattern they've observed in seminars where someone makes a flat assertion about X, defends it weakly, then retreats to framing it as a methodological tool when challenged. But later, they cite X as established fact in another context. The user wants to know if there's a philosophical term for this, or how to conceptualize it.

  First, I recall that this isn't motte-and-bailey because there's no strong vs. weak claim. It's the same claim shifting between epistemic commitment and heuristic use. Devil's advocate doesn't fit because they don't declare the suspension. Belief-change isn't it because they defend X in both modes.

  The key elements are: flat assertion, weak defense, retreat to heuristic when pressed, then later citing as fact without qualification. The temporal toggle between contexts is crucial. I need to check if existing concepts cover this.

  Looking at assertion theories: Stalnaker's common ground, Williamson's knowledge norm. But they don't address the mode-switching over time. Contextualism adjusts standards, but here it's the same context where they switch modes. Speech act theory has indirect force, but this is a direct toggle in how the claim is framed.

  Pragmatic encroachment involves stakes affecting knowledge, but here it's about evasion under pressure. Maybe "epistemic licensing" or "modal stacking," but those aren't standard. The closest might be "strategic context-switching" but that's not a formal term.

  The user's case differs from legitimate borrowing because it lacks transparency. In interdisciplinary work, sources are cited, but here there's no acknowledgment of the provisional status. Strategic ambiguity is deliberate, but this feels like evasion. Ordinary loose talk is inconsistent but not systematically toggled.

  The core issue is the unmarked oscillation. So coining a term might help. "Epistemic double-dealing" emphasizes the bad faith. "Modal fraud" focuses on misrepresenting the claim's status. "Protean assertion" captures the shape-shifting. "Phased assertion" highlights the temporal stages.

  Boundary conditions: Must involve the same claim, unmarked shifts, retreat under pressure, later use as fact, and no disclosure of prior hedging. It's distinct from honest methodology where provisional use is stated upfront.

  The user probably wants to call out this behavior academically without being accusatory. They need precise criteria to distinguish it from legitimate practices. Examples matter, so emphasizing the lack of transparency is key.
answer: |-
  Based on your detailed description, this is a fascinating and specific pattern that doesn't map perfectly onto a single, widely recognized philosophical term. It sits at the intersection of epistemology, philosophy of language, and rhetoric. Here's the conceptual mapping, the closest existing concepts (and why they fall short), and a proposed coinage with clear boundaries:

  **Core Mechanism:** You've identified an **unmarked oscillation in epistemic status** for the *same proposition (X)* across time and conversational contexts, driven by defensive retreat and subsequent assertive reuse.

  ### Why Existing Concepts Don't Fully Capture It
  1.  **Contextualism (about knowledge/assertion):** Contextualism holds that the standards for "knowing" or appropriately asserting X vary with context (e.g., high-stakes vs. low-stakes). Your case differs crucially:
      *   **The Toggle Happens *Within* the Same Context (When Challenged):** The shift from "X is true" to "X is a useful frame" isn't a response to a change in the *external* stakes or conversational purpose (like moving from a casual chat to a courtroom). It's a defensive maneuver *within the original seminar context* when epistemic standards are pressed.
      *   **Lack of Transparency:** Contextualism usually implies (or requires) that context shifts are mutually understood. Here, the speaker doesn't signal the shift; they simply change the status of X to evade scrutiny.
  2.  **Speech Act Theory / Assertoric Force:**
      *   **Indirect Speech Acts / Hedging:** Philosophers (like Searle) discuss how utterances can perform indirect acts. Retreating to "using as a frame" could be seen as hedging or weakening the assertoric force. The key difference is the **temporal disconnect and reuse**. Hedging is usually contemporaneous ("I *think* X, or perhaps X is a useful way to look at it"). Your case involves *later*, in a *different* context, dropping the hedge and reasserting X with full force, *erasing* its previously provisional status.
      *   **Performative Utterances:** Saying "I propose we use X as a frame" *is* a performative act (it institutes the frame). But this doesn't explain the initial flat assertion or the later assertive reuse.
  3.  **Pragmatic Encroachment:** This argues that practical stakes affect whether someone *knows* X. While pressure might be a "stake," the speaker isn't claiming knowledge becomes impossible; they're changing the *nature of their commitment* to X (from truth to utility) to avoid justifying knowledge, then later acting as if that justification hurdle never existed.
  4.  **Bullshitting (Frankfurt):** Bullshitting involves indifference to truth. Your subject *does* seem to care about X – they defend it in both modes and reuse it. Their issue is avoiding accountability for their *epistemic warrant* for X, not necessarily indifference to X's truth *per se*. They want the utility of X being "true" without the work of justifying it as true.
  5.  **Epistemic Injustice (Fricker):** While potentially a *consequence*, it's not the core mechanism. The pattern is primarily about the speaker's *own* management of their epistemic commitments and evasion, not necessarily targeting a hearer's credibility (though it can have that effect).

  ### The Closest Conceptual Neighbors & Why They Aren't Perfect
  *   **Conceptual Gerrymandering (Analogue to Gerrymandering in voting):** This captures the strategic redrawing of boundaries (here, the boundary of what counts as a "knowledge claim" vs. a "heuristic") to suit the speaker's immediate rhetorical need. However, it's not a standard term and lacks the specific temporal/reuse element.
  *   **Epistemic Licensing (Analogue to Moral Licensing):** The idea that retreating to the heuristic mode "licenses" the speaker to later use X without epistemic scrutiny, having "paid" a lower cost earlier. It hints at the dynamic but isn't established and misses the defensive trigger.
  *   **Modal Stacking / Modal Collapse (in some Rhetoric/Epistemology):** "Stacking" might refer to layering weaker epistemic modals ("might," "could," "as if"). "Collapse" refers to dropping those modals to assert strongly. Your case involves stacking *after* a challenge (adding the "as a frame" modality) and collapsing *later* (dropping it). This is descriptive but not a named, recognized *concept* for this specific pattern.

  ### Proposed Coinage: "Epistemic Double-Dealing" or "Protean Assertion"
  Given the gaps, coining a term is justified. Here are two options, emphasizing different aspects, with boundary conditions:

  1.  **Epistemic Double-Dealing:**
      *   **Core:** Knowingly presenting the same proposition (X) under contradictory epistemic guises (knowledge claim vs. methodological heuristic) across contexts without transparently marking the shift, specifically to evade epistemic accountability when challenged while retaining the utility of X as "true" later.
      *   **Boundary Conditions (How it Differs):**
          *   **vs. Legitimate Interdisciplinary Borrowing:** Legitimate borrowing *explicitly acknowledges* the source context and potential limitations of the borrowed X ("In field A, they use X as a model; let's tentatively apply it here to see if it yields insights"). Double-dealing *erases* the provisional history of X.
          *   **vs. Strategic Ambiguity:** Ambiguity exploits inherent vagueness. Double-dealing involves a *clear shift* in commitment (truth -> utility) under pressure, not sustained vagueness. The speaker *knows* they are changing the status.
          *   **vs. Ordinary Loose Talk/Inconsistency:** Loose talk is often careless and inconsistent. Double-dealing is a *patterned, strategic* oscillation triggered by challenge and followed by unmarked reuse. It's a *method* of evasion and reclaiming authority.
          *   **vs. Genuine Belief Revision:** The speaker isn't revising their belief *in X* based on new evidence; they are changing their *rhetorical stance* *about their commitment to X* to avoid scrutiny, then reverting.
          *   **vs. Motte-and-Bailey:** The M&B relies on two distinct claims (strong bailey, weak defensible motte). Double-dealing uses *one* claim (X) presented in two incompatible *modes* (epistemic vs. methodological) at different times.

  2.  **Protean Assertion (emphasizing the shape-shifting):**
      *   **Core:** An assertion of proposition X that strategically changes its epistemic status (shape) – from a direct truth claim to a methodological postulate and back – depending on conversational pressure and utility, without transparent signaling, allowing the asserter to avoid justification while exploiting X's apparent facticity later.
      *   **Boundary Conditions:** Similar to Double-Dealing, emphasizing the *mutable nature* of the assertion itself rather than the perceived dishonesty ("dealing").

  ### Key Differentiators of the Pattern (The "Carving")
  1.  **Single Proposition (X):** The core entity remains constant.
  2.  **Unmarked Mode Shift:** The shift from "X is true" to "X is a useful frame" occurs *without* explicit markers like "I misspoke," "To clarify," or "Speaking purely methodologically now...". The retreat is presented as consistent.
  3.  **Defensive Trigger:** The shift to the heuristic mode is primarily a *response to epistemic challenge* regarding the warrant for X.
  4.  **Unmarked Reversion:** Later, in a *distinct* context, X is reused *as if* it were established background knowledge, *without* referencing its previous methodological status or the prior challenge.
  5.  **Utility Motive:** The purpose seems to be retaining the rhetorical/persuasive power of X as a "fact" while avoiding the burden of proof when directly challenged on its truth.

  **In essence:** It's the **stealthy toggling of a proposition's epistemic status between "fact" and "tool" to dodge accountability while preserving its authoritative utility.** Your observation highlights a sophisticated, and arguably deceptive, rhetorical maneuver concerning epistemic responsibility that deserves its own conceptual marker – "Epistemic Double-Dealing" or "Protean Assertion" captures its core dynamics and boundaries effectively.
