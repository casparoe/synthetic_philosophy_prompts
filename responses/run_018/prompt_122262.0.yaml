prompt: |-
  Two colleagues of mine — one a theorist who works on the thermodynamics of computation, the other a condensed-matter physicist who does not — got into an argument after a department colloquium on Maxwell's demon, and they asked me to referee it. I couldn't. I'd like you to adjudicate the exchange move by move, and I'd rather you showed the accounting than announced a verdict.

  First, the apparatus they both accepted. Take a Szilard engine: a chamber holding a single molecule, in contact with a heat bath at temperature T. A partition is inserted at the midpoint; the demon measures which half the molecule is in and records the answer as one bit; the molecule then pushes a piston isothermally back out to the full volume, doing kT ln 2 of work and drawing kT ln 2 of heat from the bath. The partition is removed and reinserted for the next cycle. To run again, the demon's one-bit record has to be back in its standard state, and Landauer's principle — that resetting a bit by dumping it into the bath costs at least kT ln 2 of work — gives the standard exorcism: the work the demon wins is exactly paid back when its memory is cleared.

  The disagreement is about whether that exorcism can be dodged. Call my two colleagues Nils and Hana.

  Nils opens with a variant he calls the endless-ledger demon. Give the demon not a one-bit register but an indefinitely long tape of cells. Each cell is a particle in a symmetric double well: state 0 is the left well, state 1 is the right well, the barrier between them is high compared with kT so the cell holds its bit indefinitely, and the two wells have exactly the same energy. Every cell on a fresh tape is in state 0. Now modify the cycle: after the measurement and after the work has been extracted, the demon clears its record not by erasing it but by swapping it with the next fresh cell on the tape — a permutation of the joint state space, hence in principle reversible and in principle dissipationless. The record is returned to 0, the cell is left holding a bit correlated with where the molecule was, the tape advances, and nothing is ever erased. Nils's conclusion: Landauer's principle is not a necessary condition on the demon at all, only one sufficient way of failing to beat it. If the demon can be built as described, kT ln 2 of work per cycle is extracted from a single bath forever with no compensating cost, and the usual story about why demons fail must be wrong or incomplete.

  Hana replies that the tape is not free. A fresh tape of known zeros is a low-entropy resource, thermodynamically on a par with a tank of fuel or a wound spring: a cell in a definite known state has k ln 2 less entropy than a cell carrying an unknown bit, and the demon consumes one such cell per cycle. She grants that the demon's own operation dissipates nothing, but insists the cost has merely been relocated — from the demon's eraser to the tape factory, since preparing a cell in state 0 from a cell in an unknown state just is erasure and costs at least kT ln 2. On this reading the endless-ledger demon is not a perpetual motion machine but an engine running on blank tape, and the second law is untouched.

  Nils's reply is that the fresh and the used cell are physically on a par, and that this is the crux. A used cell is also a particle confined to one well of a symmetric double well; it has the same energy, the same accessible volume, the same temperature, and — the two wells being exactly degenerate — the same partition function, and therefore the same thermodynamic entropy, as a fresh cell. Thermodynamic entropy is a state function; it cannot depend on what anyone happens to know. So if Hana wants to book k ln 2 of entropy against the used cell and none against the fresh one, she has made entropy agent-relative, which would have the absurd consequence that you could run a heat engine off a tape merely by forgetting what is written on it. Therefore, he says, the tape is not a fuel, the swap really is free, and the paradox stands.

  Hana then concedes the point about the individual cells and relocates the difference into the correlations. What distinguishes a fresh cell from a used one is not its own state but its relations: a fresh cell is uncorrelated with everything else in the world, whereas a used cell is correlated with the molecule's earlier position and hence with everything that position has since interacted with. Entropy properly attaches to joint states, and the joint entropy of the cell together with the rest of the world is k ln 2 lower when that correlation is present than the sum of the separate entropies would suggest. Correlations, she insists, are a perfectly physical, non-epistemic feature of a joint state — no one has to know about them for them to be there — so consuming uncorrelated degrees of freedom is consuming a real, finite resource, and that is exactly what the demon does once per cycle.

  Nils's closing move is that this changes the subject. Correlations lower entropy only relative to the marginals, and Kelvin's formulation of the second law does not trade in marginals: it says that no device operating in a cycle can convert heat drawn from a single bath entirely into work with no other effect. His demon is cyclic — the chamber, the piston, the demon, and the register all return to their initial states each cycle — and the only things that change are tape cells whose own thermodynamic states, on Hana's own admission, are unchanged. All that has changed is which other things a given cell happens to be correlated with. Correlations are not a sink that can absorb kT ln 2 of entropy per cycle, and even if they were, the total entropy of the universe has not gone down, merely been rearranged — so nothing balances the kT ln 2 of heat that disappeared from the bath. Either Kelvin's law fails here, he concludes, or the reason demons fail must be something other than the tape paying for them.

  Hana's last word was a construction rather than an argument. Take a cell known to be in state 0, remove the barrier, and let the particle expand isothermally into both wells against a load: you extract kT ln 2 of work from the bath and leave the cell carrying a random bit — precisely the time-reverse of reversible erasure. So a fresh cell has kT ln 2 of available work that a used cell lacks, and the fact that you need to know which well to couple your load to is no more an embarrassment here than it is for any other fuel.

  Nils answered: your construction describes two cells in identical physical situations — a particle in one well of a symmetric double well — and says that one of them can do work and the other cannot. Show him the physical difference between them without using any form of the word know.

  Please work through the exchange and grade each move, from clearly mistaken to clearly right, with the reasoning that earns the grade. Then say who is more right overall, and what both of them are missing. In particular I would like you to settle: whether a tape of fresh cells is a thermodynamic resource and, if so, what exactly the resource consists in; whether the endless-ledger demon as described actually threatens any standard formulation of the second law, and if not, where precisely the cost lands; and whether either party is entitled to the background idealization they both help themselves to, that measurement and reversible logic can be carried out with arbitrarily little dissipation. Where the two sides are using the same words to mean different things, say so. Assume ordinary thermodynamics; no citations or further reading are needed.
reasoning: |-
  We are given a detailed argument between Nils and Hana about an "endless-ledger demon" that supposedly avoids the Landauer cost by using a tape of memory cells and swapping instead of erasing. We are to adjudicate move by move.

  Background: In the standard Szilard engine, a demon measures which half of a chamber a molecule is in (storing one bit) and then uses that information to extract kT ln 2 of work by isothermal expansion. To reset the bit for the next cycle, Landauer's principle says erasing the bit (resetting to a standard state) costs at least kT ln 2 of work, so the net work per cycle is zero.

  Nils proposes a demon with an endless tape of cells. Each cell is a symmetric double well (states 0 and 1, same energy). Initially, all cells are 0. After a cycle, the demon doesn't erase the bit but swaps it with the next fresh cell (so the record is reset to 0 and the used cell now holds the bit). Since swapping is reversible and in principle dissipationless, Nils claims no work is needed for resetting, and thus the demon can extract kT ln 2 per cycle forever without cost.

  Hana counters that the tape of fresh zeros is a low-entropy resource. Preparing a cell in a known state (0) costs at least kT ln 2 (erasure cost) and that cost is incurred when making the tape. So the cost is shifted to the tape factory.

  Nils replies that the fresh and used cells are physically identical (same double well, same energy, same partition function) and thus have the same thermodynamic entropy. Therefore, the tape is not a fuel and the swap is free.

  Hana then argues that the difference is in the correlations: a fresh cell is uncorrelated with the rest of the system, but a used cell is correlated with the molecule's history. These correlations reduce the joint entropy. Thus, consuming an uncorrelated cell is using a resource.

  Nils counters that the second law (Kelvin formulation) only requires that in a cyclic process, the only effect cannot be the extraction of heat from a single bath and conversion to work. He claims his demon is cyclic (the demon and the engine return to initial states) and only the tape cells change, but their thermodynamic states (as per Hana) are unchanged. Therefore, the only effect is the extraction of work from a single heat bath, which would violate the second law.

  Hana's last move: she describes an experiment where a cell known to be in state 0 can be used to extract work (by removing the barrier and letting the particle expand isothermally, doing kT ln 2 of work and leaving the cell in a random state). Thus, a fresh cell has available work that a used cell (which is already in one well) does not.

  Nils asks: show the physical difference without using the word "know".

  Now, let's break down each move and grade them.

  Move 1: Nils proposes the endless-ledger demon.
  - He claims that by swapping instead of erasing, the reset is free.
  - However, the swap operation itself might be reversible, but it requires that the tape be initially in a known state (all zeros). Moreover, the used tape now holds information that is correlated with the system. The key point is that the tape, as a whole, is not in the same state as it was initially because the first cell (which was fresh) is now used. But Nils is arguing that since each cell is physically the same, there is no cost.
  - Grade: Partially right but missing a key point. The swap is reversible and in principle can be done without dissipation, but the resource being consumed is the "freshness" of the tape. However, Nils is correct that if we only look at the local state of a cell, it is the same. But the global state of the tape is changing: initially, the entire tape is in a known (all zeros) state. After one cycle, the first cell is now in a state that is correlated with the first measurement. The tape as a whole has increased in entropy because the first cell is no longer known to be zero. However, if we consider the entire universe (including the heat bath and the engine), the entropy accounting must be done carefully.

  Move 2: Hana says the tape is a low-entropy resource, and preparing it costs kT ln 2 per cell.
  - This is a standard response. The tape factory must have prepared the tape by setting each cell to 0, which is an erasure and costs at least kT ln 2 per bit. So the cost is paid in advance.
  - Grade: Correct in spirit, but note that the cost is incurred when the tape is prepared, not during the operation of the demon. However, the demon is using up the tape. So the net work per cycle would be kT ln 2 (extracted) minus the amortized cost of preparing the tape (which is at least kT ln 2 per cell). Thus, no net work.

  Move 3: Nils counters that the fresh and used cells are physically identical and have the same thermodynamic entropy.
  - This is true: a single cell in state 0 has the same energy and partition function as in state 1. The thermodynamic entropy of the cell alone is the same in both states. So if we look at the cell in isolation, there is no difference.
  - However, Hana's point is about the tape as a whole and the correlations. The tape initially has zero entropy (if we know it is all zeros) but after use, the cells become unknown and correlated with the system. But Nils is right that the thermodynamic entropy (as a state function) of each cell is the same regardless of its state because the two states are degenerate. The entropy of a single cell is S = k ln(2) because there are two states? Actually, no: for a single particle in a double well at high barrier, the partition function is 2 (because of two states) and the free energy F = -kT ln(2). The entropy is then S = -dF/dT = k ln(2) for the cell regardless of which state it is in? Actually, that is the entropy when the cell is in equilibrium and we don't know the state. But if the cell is in a definite state (say 0), then we might think its entropy is zero. However, in thermodynamics, we compute the entropy from the partition function. The partition function for the cell is 2 (because two states, same energy). Therefore, the entropy of the cell in thermal equilibrium is k ln(2). But if the cell is prepared in a definite state (say 0) and the barrier is high, then the system is not in thermal equilibrium? Actually, it is in a metastable state. The thermodynamic entropy of the cell in state 0 is not the same as the entropy when it is in equilibrium? This is a subtle point.

  Let me clarify: The thermodynamic entropy is a state function for a system in equilibrium. If the cell is in one well (state 0) and the barrier is infinitely high, then it is confined and the system is not ergodic. We can consider the system as having two separate phases. But in standard treatments, we assign the same entropy to both states because they are degenerate. However, if we have a system that is prepared in a pure state (one well), then the entropy is zero? But that is the microscopic entropy (or information entropy). Thermodynamic entropy is coarse-grained and for a system in equilibrium, it is defined by the logarithm of the number of accessible states. For a cell in a double well with high barrier, if the system is in one well, then the number of accessible states is half? Actually, no: the system is confined to one well, so the accessible phase space volume is half of the total. Therefore, the entropy of a cell in a definite well is k ln(Ω) where Ω is the phase space volume of one well. Since the two wells are symmetric, the phase space volume of one well is half of the total. The total phase space volume for the cell is Ω_total = 2 * Ω_well. Therefore, the entropy of the cell when it is in a particular well is S = k ln(Ω_well) = k ln(Ω_total/2) = k ln(Ω_total) - k ln(2). The entropy when the cell is in equilibrium (able to access both wells) is k ln(Ω_total). Therefore, the entropy of a cell in a definite well is lower by k ln(2). This is the key.

  But wait: in the setup, the barrier is high, so the system is not in equilibrium? Actually, if we consider the system at temperature T and with a high barrier, the equilibrium state is that the particle is equally likely in either well. But if we trap it in one well, that is a non-equilibrium state. The entropy of a non-equilibrium state is not defined in standard thermodynamics? Actually, we can define a constrained entropy. This is a point of confusion.

  However, in Hana's last move, she shows how to extract work from a cell known to be in state 0: by removing the barrier and letting it expand isothermally. This shows that the cell in state 0 has free energy that is higher than the equilibrium state (where it is spread over both wells) by kT ln(2). Therefore, the free energy of the cell in state 0 is F_0 = -kT ln(Z_0) where Z_0 is the partition function for the well? Actually, for a particle confined to one well, the partition function is half of the full one? So Z_well = Z_total / 2. Therefore, F_well = -kT ln(Z_well) = -kT [ln(Z_total) - ln(2)] = F_total + kT ln(2). So the free energy of the cell in one well is higher by kT ln(2) than when it is in equilibrium (both wells). Therefore, by removing the barrier and letting it expand, we can extract work equal to the free energy difference: kT ln(2).

  So Hana is right: a fresh cell (known to be in state 0) has more free energy than a cell in an unknown state (which is in equilibrium and has free energy F_total). Therefore, the fresh cell is a resource.

  But note: the used cell in the tape is also in a definite state (either 0 or 1). However, we don't know which state. So if we try to use that cell to extract work, we cannot because we don't know which well it is in. Therefore, we cannot extract the work. So the used cell has the same free energy as a fresh cell if we know its state? But we don't. So the tape factory must produce cells that are not only in state 0 but also known to be in state 0. The knowledge is essential for being able to use the free energy.

  Therefore, the physical state of the fresh cell is the same as a used cell that happens to be in state 0. But the difference is that for the fresh cell, we know it is in state 0, so we can use it. For a used cell, we don't know its state, so we cannot use it to extract work without additional information.

  But Nils objects: show the physical difference without the word "know". The physical difference is that the fresh cell is in a non-equilibrium state that we can use to extract work, whereas a used cell is in a state that we cannot use without knowing its state. However, the physical state of a cell in state 0 is the same regardless of whether we know it or not. So without the knowledge, we cannot use the used cell. But note: if we have a used cell that is in state 0 (even if we don't know it) and we remove the barrier, we still get kT ln(2) of work? Actually, we do. The work extraction does not require that we know the state. The process of removing the barrier and letting the gas expand will happen regardless. However, the problem is that if the cell is in state 1, then removing the barrier and expanding would also give kT ln(2) of work? Yes. So regardless of which state the cell is in, if we remove the barrier and let it expand, we can extract kT ln(2) of work? But wait: if the particle is already in both wells, then removing the barrier does nothing. But in the setup, the barrier is present and the particle is in one well. So for any cell that is in one well (whether we know which one or not), we can extract kT ln(2) by removing the barrier and expanding. Therefore, both fresh and used cells (if they are in one well) have the same potential to do work. The catch is that the used tape has cells that are in definite states (0 or 1) but we don't know which. However, if we remove the barrier for each cell, we can still extract the work. So why is the fresh tape special?

  The difference is that for the fresh tape, we know that every cell is in state 0. But for the used tape, each cell is in a definite state (0 or 1) but we don't know which. However, when we remove the barrier and expand, we get the work regardless. So why can't we use the used tape to extract work? We can! But then the demon is not paying for the tape? Then the demon would be a perpetual motion machine.

  But wait: the used tape is not in a state that we can use without knowing the state? Actually, we can use it without knowing: just remove the barrier for each cell and you get kT ln(2) per cell. So then the tape factory does not need to prepare the tape at all? We can use any tape that has cells in definite states? But how did the cells get into definite states? If they were in equilibrium, they would be in one well or the other with equal probability, but we don't know which. But then we can still extract work by removing the barrier. Therefore, the tape factory doesn't need to do anything? That cannot be.

  The flaw is that if the tape is initially in equilibrium, then each cell is in one well with 50% chance, but we don't know which. However, when we remove the barrier for a cell that is already in one well, we can extract work. But note: if a cell is already in equilibrium (i.e., without a barrier, the particle is free in the whole volume), then there is no work to extract. The key is the barrier. The tape factory must prepare the cells by putting each particle in one well (say 0) and then putting a barrier. That preparation requires work. If the tape is initially without barriers (or with barriers but the particles are in equilibrium, meaning they are equally likely in either well), then the free energy per cell is F_total = -kT ln(Z_total). But if we prepare the cell to be in state 0 (by inserting the barrier and confining the particle to the left well), we are putting the system in a state of higher free energy: F_well = F_total + kT ln(2). The work required to prepare the cell is at least kT ln(2) (if done reversibly). Then, when we remove the barrier and let it expand, we get back kT ln(2). So the net is zero.

  Therefore, a fresh tape (with each cell in state 0) must have been prepared by doing work. The used tape has cells that are in definite states (0 or 1) but we don't know which. However, if we want to use a used cell to extract work, we can remove the barrier and get kT ln(2) regardless of which state it is in. But then the tape factory did not need to set the state to 0? It only needed to put the particle in one well (and we don't care which) and then put the barrier? But that is exactly the same as the equilibrium state? No. In the equilibrium state without a barrier, the particle is delocalized over the entire volume. But if we insert the barrier, then the particle is in one well or the other? Actually, when we insert the barrier, if we do it quickly, the particle will be trapped in whichever well it was in. But if the system was in equilibrium without the barrier, then the particle is equally likely to be in either side. So if we insert the barrier, we get a cell that is in state 0 or 1 with equal probability. And we can then extract kT ln(2) by removing the barrier. So the preparation of the tape (inserting the barrier) does not cost any work? Actually, inserting the barrier adiabatically (without letting heat exchange) would require work? But in the isothermal case, the free energy change when inserting the barrier: initially, the partition function is Z_total (for the whole volume). After inserting the barrier, we have two separate wells, but the particle is confined to one of them. The partition function after insertion for a given cell is Z_well (if we know which well the particle is in). But without knowing, the partition function is 2 * Z_well. Therefore, the free energy after insertion is F_after = -kT ln(2 Z_well) = -kT [ln(2) + ln(Z_well)] = -kT ln(2) + F_well. But initially, F_initial = -kT ln(Z_total). Note that Z_total = 2 * Z_well? Only if the barrier is inserted exactly at the midpoint and the two wells are symmetric. So Z_total = 2 * Z_well. Therefore, F_initial = -kT ln(2 Z_well) = F_after. So the free energy does not change when inserting the barrier isothermally? Therefore, no work is required? That can't be right because we are reducing the accessible volume.

  Wait: the partition function for a particle in a box of volume V is proportional to V. If we insert a barrier and confine the particle to a volume V/2, then the partition function becomes half? So Z_initial = c * V, and Z_after = c * (V/2) = Z_initial / 2. Therefore, F_initial = -kT ln(Z_initial), F_after = -kT ln(Z_initial/2) = -kT ln(Z_initial) + kT ln(2) = F_initial + kT ln(2). So the free energy increases by kT ln(2). Therefore, to insert the barrier isothermally and reversibly, we must do work equal to kT ln(2). And if we do it irreversibly, the work done might be less, but the heat bath will absorb the entropy.

  So to prepare the tape, we start with a tape of cells without barriers (or with barriers but the particle is free in the whole volume). Then we insert the barrier for each cell. This costs kT ln(2) per cell. After insertion, each cell is in one well (0 or 1) with equal probability. But we want the cell to be in state 0. So we must also set it to 0. To set it to 0, we must do a measurement and feedback? Or we can do it by compressing the particle from the whole volume to the left well? That compression would cost work. Specifically, to move the particle from the entire volume to the left well, we can do it by a piston: compress from volume V to V/2. That requires work kT ln(2). So the total cost to prepare a cell in state 0 is kT ln(2) (for the barrier insertion) plus kT ln(2) (for the compression) = 2 kT ln(2)? But that is too much.

  Alternatively, we can prepare the cell by starting with the barrier in place and the particle in the whole volume? But then we have to compress it into one well. That compression in a fixed barrier would cost kT ln(2). But then we have already the barrier? So the cost is kT ln(2) per cell to set it to 0.

  But note: if we don't care which state the cell is in, then after inserting the barrier (which costs kT ln(2)), the particle is in one well or the other, and we haven't done any compression. So the cost is only kT ln(2) per cell to get a cell in a definite state (but unknown which). Then, if we use that cell in the demon, we can swap without erasing. And then when the tape is used, we have cells that are in definite states. Then we can recover the work by removing the barrier and expanding, getting kT ln(2) per cell. So the net cost for the tape is zero? But then the demon can run forever without any cost? That would violate the second law.

  But wait: the demon is not using the work recovery from the used tape. The used tape is just being stored. So the tape factory must prepare the tape at a cost of kT ln(2) per cell (for inserting the barrier and leaving the particle in one well, unknown). Then the demon uses one cell per cycle. The demon extracts kT ln(2) per cycle. The used tape is then discarded. But if we discard the used tape without recovering the work, then the net cost is kT ln(2) per cycle (paid by the tape factory) and the demon gets kT ln(2), so net zero. But if we recover the work from the used tape by removing the barriers, then we get back kT ln(2) per cell, so the net cost is zero. But then the tape factory did work kT ln(2) per cell and we recover kT ln(2) per cell, so the tape preparation and recovery break even. And the demon runs without any cost? That cannot be.

  The flaw is in the work recovery: when we remove the barrier for a used cell, we get kT ln(2) of work, but then the cell is now in equilibrium (no barrier, particle in the whole volume). To reuse the cell for the tape, we have to reset it: put the barrier back and set the particle to one well. That resetting costs kT ln(2) (for inserting the barrier) and then if we want it in a particular state, we have to do more work. But in the endless-ledger demon, the tape is endless and we are not reusing cells. The tape is supplied by a factory that produces fresh cells. The factory must prepare the cells by having the barrier and the particle in one well. As we said, that preparation costs at least kT ln(2) per cell. Therefore, the cost is paid by the factory, and the demon's net work is zero.

  But what if the factory prepares the tape by a process that uses the used tape? That is, a recycling plant. The factory takes used cells (which are in definite states but unknown), removes the barrier to extract work (kT ln(2)), then reinserts the barrier (costing kT ln(2)) and ends up with a cell in an unknown state (0 or 1). But then to make a fresh cell (known to be in state 0), it has to set the state, which costs another kT ln(2) (by compressing to the left well). So the total cost to recycle is kT ln(2) (for reinserting the barrier) + kT ln(2) (for setting to 0) = 2 kT ln(2), and it recovered kT ln(2) from removing the barrier, so net cost kT ln(2) per cell. That matches the cost of a new cell from scratch.

  Alternatively, if the factory doesn't care which state the cell is in (as long as it is in one well), then it can take the used cell (which is already in one well) and use it directly without recycling. But the demon requires that the fresh cell be in state 0. Because the swap operation requires that the fresh cell is in state 0 so that when the demon swaps its register (which is in state b) with the fresh cell (state 0), the register becomes 0 and the fresh cell becomes b. If the fresh cell is not in state 0, then the swap won't reset the register to 0. Therefore, the tape must have cells in state 0.

  So the factory must produce cells in state 0. The cost to produce a cell in state 0 is at least kT ln(2) (by reversible compression from the full volume to the left well, with the barrier in place). And that cost is incurred per cell.

  Therefore, Hana is right: the tape is a fuel, and the cost is paid in the tape factory.

  Now, let's grade the moves.

  Move 4: Hana's point about correlations.
  - She says the fresh cell is uncorrelated, and the used cell is correlated. Therefore, the joint entropy is reduced by the correlation.
  - This is true, but note that the thermodynamic entropy of the cell alone is the same. The joint entropy of the cell and the system it is correlated with is less than the sum of the individual entropies by the mutual information. However, the second law of thermodynamics is usually formulated for the total entropy of the universe. The act of measurement creates correlations, which does not by itself increase the total entropy. But when the demon uses the tape, it is consuming the uncorrelated state of the fresh cell and producing a correlated state. However, the total entropy might not change immediately, but eventually, when the correlations are dissipated, entropy increases.

  But in the cyclic process of the demon, the only non-cyclic part is the tape. The tape is being advanced, and the used cells are being stored. The correlations are still there. So the total entropy of the universe (including the tape) has not increased? But the heat bath has lost heat, and work has been done. We must have an increase in entropy somewhere.

  The standard answer is that the tape is a low-entropy resource. The factory had to lower the entropy of the tape to prepare it.

  Move 5: Nils's closing move about the second law formulation.
  - He says the demon is cyclic except for the tape cells, which are unchanged in their thermodynamic state. Therefore, the only effect is the extraction of work from a single bath, violating Kelvin's law.
  - But he is wrong because the tape cells are not unchanged. They are being used up: a fresh cell (which has low entropy) is being turned into a used cell (which has the same entropy but is correlated). However, if we look at the cell alone, its state is the same as before (it is in one well). But we've established that the fresh cell is in a low-entropy state (because it is confined to one well) and the used cell is also in a low-entropy state (confined to one well) but the difference is that the factory had to prepare the fresh cell in that state. The used cell was produced by the demon's operation. The key is that the demon is not cyclic: the tape is part of the system. The tape is not returning to its initial state.

  Move 6: Hana's last word (the work extraction from a fresh cell).
  - She shows that a cell in state 0 can be used to extract work. This demonstrates that the fresh cell has free energy that can be converted to work.
  - Nils's challenge: "Show him the physical difference without using any form of the word know."
    - The physical difference between a fresh cell (state 0) and a used cell that is in state 1 is the physical location of the particle. They are in different wells. But the used cell might be in state 0 or state 1, so we cannot use it in a deterministic way to do work if our apparatus is designed for state 0. However, as argued earlier, if we remove the barrier, we can extract work regardless of which well the particle is in. So the physical difference between a fresh cell and a used cell that is in state 0 is none. They are physically identical. But the used cell that is in state 1 is physically different: the particle is in the other well. However, the work extraction by barrier removal works the same.

    But the point is that the fresh cell is known to be in state 0, but the used cell is not known. However, for work extraction by barrier removal, we don't need to know the state. So why is the fresh tape special? It isn't for work extraction. But for the demon's swap operation, the fresh cell must be in state 0. The swap operation requires that the fresh cell is in a specific state (0). If the fresh cell is in state 1, then after swapping, the register would become 1, not 0. So the demon requires the fresh cell to be in state 0. Therefore, the tape factory must ensure that. So the physical difference is that the fresh cell is in state 0, while a used cell might be in state 0 or 1. And we don't know which. But the demon's mechanism requires state 0. So the factory must produce cells in state 0, which costs work.

  Therefore, the answer to Nils's challenge is: the physical difference is that the fresh cell is in the left well (state 0) and the used cell might be in the left or right well. But without knowing, we cannot guarantee that the swap will reset the register to 0. Therefore, the fresh cell must be in state 0, and that is a physical condition.

  Overall grading:

  - Nils's first move: Partially right (swap is reversible) but misses that the tape is a resource. (Grade: C)
  - Hana's first reply: Correct. (Grade: A)
  - Nils's reply: Correct about the thermodynamic entropy of a single cell, but misses that the preparation of the tape requires work. (Grade: B for the entropy point, but F for the overall conclusion)
  - Hana's move about correlations: Partially correct, but the entropy reduction due to correlations is not the whole story. The key is the free energy of the fresh cell. (Grade: B)
  - Nils's closing move: Incorrect because the demon is not cyclic: the tape is changing. The used tape is not the same as the fresh tape. (Grade: D)
  - Hana's last word: Correct and addresses the challenge. (Grade: A)

  Overall, Hana is more right. The endless-ledger demon does not violate the second law because the tape of fresh cells is a thermodynamic resource. Each fresh cell has free energy that is higher than the equilibrium state by kT ln(2), and preparing it costs at least kT ln(2) of work. The cost is incurred in the tape factory.

  What both are missing: 
  - The idealization that measurement and reversible logic can be done with arbitrarily little dissipation is not entirely free. In practice, there may be costs, but in principle, it can be done reversibly. However, in this case, the swap is reversible, so that part is fine.

  - The key is the preparation of the tape.

  Answers to the specific questions:

  1. Is a tape of fresh cells a thermodynamic resource? Yes.
  2. What exactly is the resource? A cell in a known low-entropy state (specifically, the particle confined to one well of a symmetric double well) which has free energy higher than the equilibrium state (particle in the whole volume) by kT ln(2).
  3. Does the endless-ledger demon threaten the second law? No.
  4. Where does the cost land? In the tape factory, which must expend at least kT ln(2) of work per cell to prepare the tape.

  Additionally, both parties are using the idealization that measurement and reversible operations can be done without dissipation. This is allowed in principle if we assume reversible computing and ideal measurements. The argument does not hinge on that.

  Final verdict: Hana is correct.
