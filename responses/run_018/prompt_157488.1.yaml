prompt: |-
  I'm facilitating citizens' assemblies for regional climate-adaptation boards, and we keep running into the boundary problem — like, who actually belongs to the demos for a given decision? We get proposals to include people living just outside the watershed, seasonal workers in employer housing, remote workers who pay taxes elsewhere, and even corporate entities with local assets. Right now our inclusion calls are basically vibes-based, which is embarassing.

  I'm trying to operationalize a hybrid principle I sketched out after reading some deliberative-democracy stuff: for decision D, you belong to the demos if (a) you're either subjected to D's binding authority or significantly affected by D's outcomes, AND (b) you're within the "scope of reciprocal justification" — meaning you can understand and actually contest the reasons offered in the deliberation, given your real epistemic position, not just in principle. The idea is that being affected isn't enough if the decision requires technical knowledge you don't have access to and can't be given in time; but being subjected is always sufficient regardless of epistemic access, since authority over you demands justification.

  Please write a decision proceedure my staff can run on a membership proposal: the ordered questions, what counts as a sufficient answer, where it stops with a clear "no," and where it has to hand the decision to a person because it's a values call rather than a fact. Then apply it to three cases:
  1. A permanent remote worker who lives in the watershed, works for an out-of-state company, pays no local taxes, and has no family ties here.
  2. A seasonal agricultural worker present four months a year, living in employer-provided housing inside the jurisdiction, who speaks limited English and has no access to the technical hydrology reports.
  3. A downstream municipality outside our jurisdiction that will suffer increased flooding risk from upstream retention ponds we're planning.

  One of these should come out in a direction that will annoy someone — maybe the remote worker gets excluded despite being physically present, or the worker gets included despite language barriers — and I want the proceedure to flag that tension explicitly rather than smoothing it over. Also say clearly what this proceedure can't do: for example, whether future generations should get proxy seats, or whether non-human animals affected by habitat loss should have representatives. Keep it practical — no reading lists, no "see Dahl 1989," my team has ten minutes per proposal and zero philosophy background. Just the checklist, the three runs, and an honest list of misfire points.
reasoning: |-
  Okay, the user is dealing with a real-world problem in their citizen assemblies for regional climate adaptation. They're stuck on the "boundary problem" - figuring out who exactly should be part of the decision-making group for specific climate adaptation decisions. Right now, they admit their inclusion process is "vibes-based," which isn't sustainable. 

  They've developed a hybrid principle combining two criteria: being subject to the decision's authority or significantly affected by its outcomes (a), AND being within the "scope of reciprocal justification" (b) - meaning people can actually understand and challenge the reasons given in deliberations based on their real knowledge access, not just theoretically.

  What they need is a practical decision procedure their staff can use quickly (10 minutes per case) without philosophy background. They want:
  - Ordered questions checklist
  - Clear pass/fail thresholds
  - Recognition of when something is a values call vs factual
  - Application to three specific cases
  - Honest limitations of the approach

  The three test cases are:
  1. Permanent remote worker living locally but with no local ties/taxes
  2. Seasonal worker with language barriers and limited report access
  3. Downstream municipality outside jurisdiction facing flood risks

  Important nuances:
  - One decision should produce a "controversial" outcome to surface tensions
  - Must explicitly flag where the procedure can't decide (e.g., future generations, non-humans)
  - Keep it operational, not theoretical

  The user is clearly frustrated with current ad hoc methods and wants something rigorous yet practical. Their hybrid principle is thoughtful but needs translation into actionable steps. The staff's constraints (time, expertise) mean the procedure must be almost algorithmic while still capturing democratic theory nuances.

  For the test cases, I anticipate:
  - Case 1 might exclude the remote worker (controversial since they're physically present)
  - Case 2 should include the seasonal worker despite barriers (shows "subjected" trumps epistemic limits)
  - Case 3 is tricky - affected but outside reciprocal justification? 

  The procedure must force explicit "values call" flags where criteria conflict or hit edge cases. Also need to preempt staff frustration by admitting where the tool won't help (e.g., non-human representation).
answer: |-
  Here's a practical decision procedure based on your hybrid principle, designed for speed and clarity. Staff can run it as a checklist with "YES/NO/HANDOFF" outcomes at each step.

  **Demos Boundary Decision Procedure**

  1.  **QUESTION A1: Is the individual/entity SUBJECTED to the decision's binding authority?**  
      *   *Meaning:* Will they face legal penalties, fines, mandatory actions, or direct enforceable restrictions from this specific decision (D)?
      *   **Sufficient YES:** Clear evidence of enforceable rules/penalties directly applying to them due to D (e.g., local zoning law change, new water use restrictions).
      *   **Clear NO:** No enforceable rules/penalties from D apply to them (e.g., they are entirely outside the legal jurisdiction).
      *   **HANDOFF:** Ambiguity about enforceability or scope of authority (e.g., does a regulation on *employers* indirectly subject the *worker*?). *Staff Lead decides based on legal interpretation.*

  2.  **QUESTION A2: Is the individual/entity SIGNIFICANTLY AFFECTED by the outcomes of D?**  
      *   *Meaning:* Will D cause substantial, foreseeable, and non-trivial impacts on their safety, health, home, livelihood, property, or core well-being? (Focus on direct, material consequences).
      *   **Sufficient YES:** Concrete, probable impact (e.g., home flooded, livelihood destroyed, water source contaminated, severe health risk).
      *   **Clear NO:** Impacts are negligible, highly speculative, indirect, or shared equally with the general public far away (e.g., minor aesthetic change, very minor tax fluctuation, vague "community character" impact).
      *   **HANDOFF:** Impact is plausible but magnitude or likelihood is debated; impact is significant but indirect (e.g., downstream flooding). *Staff Lead decides based on severity/probability assessment.*

  3.  **IF A1 = YES OR A2 = YES, PROCEED TO B. OTHERWISE, STOP: NOT IN DEMOS.**

  4.  **QUESTION B: Is the individual/entity within the SCOPE OF RECIPROCAL JUSTIFICATION for D?**  
      *   *Meaning:* Can they realistically understand the core reasons/evidence for D *as presented in this assembly* AND have a reasonable opportunity to contest/respond to those reasons? Consider:
          *   *Language:* Can core info/discussion be made accessible in their primary language? (Not perfect fluency, but graspable).
          *   *Complexity:* Is the technical/scientific core of D understandable with reasonable explanation/simplification provided? (Not requiring PhD-level hydrology).
          *   *Timing:* Can they be engaged meaningfully within the assembly's timeframe? (Not requiring years of study).
          *   *Access:* Can they physically or virtually access the deliberation process and key documents *in an understandable form*?
      *   **Sufficient YES:** Barriers can be reasonably overcome with standard assembly resources (translation services, plain-language summaries, accessible meeting formats/locations, extended time for Q&A).
      *   **Clear NO:** Barriers are fundamental and insurmountable *within the assembly's realistic capabilities and timeframe* (e.g., decision relies on highly classified tech, requires immediate response but group speaks an extremely rare language with no available translation, profound cognitive disability prevents understanding *any* form of rationale).
      *   **HANDOFF:** Significant barriers exist, but it's unclear if resources *can* or *should* be deployed to overcome them (e.g., very costly translation, highly complex science needing bespoke simplification). *Staff Lead decides if accommodation is feasible and proportionate.*

  5.  **FINAL INCLUSION:**
      *   **IF A1 = YES AND B = YES/NO:** INCLUDE. *Being subjected trumps epistemic limits (per your principle).*
      *   **IF A1 = NO, A2 = YES, AND B = YES:** INCLUDE.
      *   **IF A1 = NO, A2 = YES, AND B = NO:** EXCLUDE.
      *   **IF A1 = NO, A2 = NO:** EXCLUDE (Stopped at Step 3).

  **What This Procedure CANNOT Do:**

  1.  **Resolve Deep Values Conflicts:** It flags HANDOFF points but doesn't solve underlying debates (e.g., *how much* risk constitutes "significantly affected"? *How much* resource expenditure is "reasonable" for access?).
  2.  **Handle Non-Traditional Actors:**
      *   **Future Generations:** Requires value judgment on representation/proxy rights. *Procedure stops - HANDOFF to Assembly Lead/Steering Committee.*
      *   **Non-Human Entities (ecosystems, animals):** Requires value judgment on moral standing/representation. *Procedure stops - HANDOFF to Assembly Lead/Steering Committee.*
      *   **Abstract Groups ("The Economy," "Biodiversity"):** Too vague for "subjected" or "affected" test. *Likely Clear NO.*
  3.  **Define "Significantly" Precisely:** Requires context-specific judgment (HANDOFF points).
  4.  **Guarantee Perfect Fairness:** It's a practical filter, not a philosophical proof. Aims for operational rigor over vibes.
  5.  **Handle Extreme Scale:** If thousands meet A1/A2, practical assembly size limits apply. *Procedure identifies who *should* be included, but practical cap implementation is separate.*

  ---

  **Application to Cases:**

  **Case 1: Permanent Remote Worker (Lives in watershed, works out-of-state, no local taxes, no family ties)**
  *   **A1: SUBJECTED?** *Likely YES.* If D involves local building codes, land use rules, water restrictions, emergency orders - they are physically present and must comply.
  *   **A2: SIGNIFICANTLY AFFECTED?** *Likely YES.* Flood risk, fire risk, water quality, infrastructure access directly impact their home and safety. Physical presence = high vulnerability.
  *   **B: RECIPROCAL JUSTIFICATION?** *YES.* Speaks language (assumed), has physical presence allowing access, technical reports can be explained. No inherent epistemic barrier.
  *   **OUTCOME: INCLUDE.** *Controversy Potential:* Excluding based solely on tax status/family ties violates A1/A2. Your principle prioritizes presence/impact over economic ties. *Staff should flag:* "Subjected & Affected despite no local economic ties."

  **Case 2: Seasonal Agricultural Worker (4 months, employer housing inside jurisdiction, limited English, no hydrology report access)**
  *   **A1: SUBJECTED?** *Likely YES.* Subject to local laws, emergency orders, potentially specific worker housing/safety regulations tied to D.
  *   **A2: SIGNIFICANTLY AFFECTED?** *Likely YES.* Lives there 1/3 of the year. Directly impacted by flooding, heat, water quality, safety measures affecting their housing and work area.
  *   **B: RECIPROCAL JUSTIFICATION?** *HANDOFF.* Language barrier is significant. *Staff Lead Decision:* Is providing core translation/plain-language summaries *feasible and proportionate*? (Likely YES for a large group like seasonal workers - basic safety info is core). Technical hydrology can be simplified ("this plan holds water here to reduce flooding there"). Access can be provided via workplace/union/housing location meetings.
  *   **OUTCOME (Likely): INCLUDE.** *Controversy Potential:* Language barrier might lead some to argue for exclusion (B=NO). Your principle says A1=YES forces inclusion *despite* B barriers. Staff Lead must affirm that accommodation is required. *Staff should flag:* "Subjected - Inclusion mandatory; Language accommodation required."

  **Case 3: Downstream Municipality (Outside jurisdiction, faces increased flooding risk from our upstream ponds)**
  *   **A1: SUBJECTED?** *CLEAR NO.* Your decision (D) has no binding authority over them. They are a separate legal entity.
  *   **A2: SIGNIFICANTLY AFFECTED?** *HANDOFF.* Increased flooding risk is a plausible *significant* impact. *Staff Lead Decision:* Assess evidence: How probable? How severe? Is it a direct consequence or mitigated by other factors? (Likely YES - hydrology often shows direct downstream impact).
  *   **B: RECIPROCAL JUSTIFICATION?** *HANDOFF.* They *could* understand the reasons (similar technical capacity), but *can they contest within YOUR assembly?* They have their own government/deliberative processes. Accessing *your* process might be logistically/politically complex.
  *   **OUTCOME (Likely): EXCLUDE.** *Why:* A1=NO, A2=YES, B=HANDOFF-but-leaning-NO. While affected (A2=YES), they are not within the *scope of reciprocal justification* **for your assembly**. Your assembly isn't constituted to represent them or receive their binding input; they have their own democratic institutions. The obligation is to *inform* and *coordinate* with them, not include them in *your* demos. *Staff should flag:* "Significantly Affected but Outside Reciprocal Justification Scope - Requires formal inter-governmental consultation, not inclusion in *this* demos."

  **Key Tension Flagged:** The procedure forces explicit recognition of the core tension in Case 3: Significant impact creates a moral claim, but the reciprocal justification scope (rooted in the specific assembly's purpose and authority) limits inclusion. This highlights the need for robust consultation mechanisms *outside* the assembly boundary definition.
