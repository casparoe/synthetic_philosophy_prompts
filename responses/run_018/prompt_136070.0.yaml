  ## Bureau of Narrative Gravity - Official FAQ (Revision 7.3b)

  **1. Q: What is the primary function of the Bureau of Narrative Gravity (BONG)?**  
  A: The Bureau administers the Personal Narrative Coherence Act (PNCA-87), ensuring the stable gravitational pull of self-consistent identity narratives within the designated societal framework. We assess, certify, and maintain the requisite narrative density for legal personhood, processing applications for Continuity Endorsement, Significant Revision permits, and Narrative Cessation documentation.

  **2. Q: I recently experienced significant retrograde autobiographical amnesia. Do I need to notify BONG?**  
  A: Yes. Per PNCA-87, Subsection 5.2, a disruption in experiential recall exceeding 72 contiguous hours constitutes a "Narrative Lacuna Event" (NLE). You must file Form NL-44 ("Continuity Renewal Application") within 30 days. Supporting affidavits from at least two Category-A Narrative Witnesses (verified associates) attesting to your persistent "gravitational signature" despite the lacuna are mandatory. Failure may result in provisional suspension of legal narrative status pending review.

  **3. Q: My spouse underwent a profound values realignment (e.g., abandoning lucrative finance for avant-garde interpretive dance). Their account feels discontinuous. Can I appeal?**  
  A: Significant shifts in core motivational vectors may constitute a "Branching Narrative." File Form BN-7 ("Appeal for Coherence Assessment") with the Appellate Division for Branching Narratives (ADBN). Be advised: personal preference regarding another's narrative arc is not grounds for invalidation. The ADBN assesses only whether the new trajectory demonstrates sufficient internal consistency and adherence to basic gravitational coherence thresholds, not aesthetic merit. A non-refundable processing fee applies.

  **4. Q: What is the Gravitational Coherence Quotient (GCQ)?**  
  A: The GCQ (measured on the standardized Dennett-Hume Scale) is a proprietary metric quantifying the centripetal force exerted by an individual’s dominant narrative cluster. It factors in temporal stability, causal linkage density, character trait persistence, and resistance to external counter-narrative incursions. A minimum GCQ of 0.7 is required for full legal personhood. Assessments are conducted biannually via Form GCQ-12 or triggered by specific events (e.g., NLE, BN-7 filing).

  **5. Q: My birth certificate includes the disclaimer: "Holder designated fictional protagonist under PNCA-87. Narrative coherence not guaranteed." Is this standard?**  
  A: Yes. All legal identity documents issued post-PNCA-87 carry this notation (Subsection 1.1a). It serves as a statutory reminder that the legal entity recognized is a narrative construct maintained through consistent reporting and social reinforcement, not an immutable essence. The Bureau assumes no liability for unreliable narration or sudden genre shifts by the holder.

  **6. Q: Can I be held legally liable for inconsistencies discovered in my past self-reports?**  
  A: Potentially. While minor chronological contradictions ("anecdotal drift") are expected and covered under Narrative Variance Allowance (NVA), demonstrably false statements constituting "Fraudulent Gravitational Boosting" (FGB) are prosecutable under PNCA-87, Section 8. Examples include fabricating entire life stages for material gain or deliberately obscuring past actions incompatible with current professed values. Penalties range from GCQ reduction to mandatory enrollment in Narrative Re-alignment Workshops.

  **7. Q: What recourse exists if I believe a damaging counter-narrative about me is gaining undue traction?**  
  A: File Form CN-9 ("Petition for Counter-Narrative Mitigation") with the Counter-Narrative Appeal Board (CNAB). The Board evaluates the coherence, sourcing, and potential gravitational disruption of the counter-narrative against your official record. Successful petitions may result in the issuance of a "Narrative Stabilization Order" against the originators or public correction notices. Burden of proof rests with the petitioner. Legal counsel specializing in ontological defamation is recommended.

  **8. Q: How does the Bureau handle cases of Dissociative Identity Narratives (DINs)?**  
  A: DINs are complex. Each distinct narrative center exhibiting a stable GCQ > 0.7 may apply for subsidiary Protagonist Status (SPS) under the primary narrative holder’s identity umbrella (Form DIN-SPS-22). SPS grants limited legal agency contingent on the primary holder’s overarching narrative coherence and responsibility. Inter-narrative conflicts are adjudicated internally via Bureau-appointed Narrative Mediators.

  **9. Q: Is there a process for voluntary Narrative Cessation?**  
  A: Form NC-1 ("Declaration of Intentional Narrative Dissolution") may be filed after mandatory counseling and a 90-day reflection period. Upon approval, the Bureau archives the narrative corpus and issues a Certificate of Completed Arc. All legal rights and obligations cease. Note: This is distinct from biological demise, which is handled separately via Form ND-4 ("Notification of Narrative Termination Due to Cessation of Biological Processes").

  **10. Q: What is Ontological Groundlessness Observance Day?**  
  A: This statutorily mandated holiday (observed annually on March 15th) encourages citizens to contemplate the liberating implications of PNCA-87: namely, that there is "no further fact of the matter" beneath their narrative self. Celebratory activities typically involve low-stakes identity experimentation, collaborative story-telling, and quiet reflection on the absence of a metaphysical core. Participation, while encouraged, is not compulsory. Bureau offices are closed.
