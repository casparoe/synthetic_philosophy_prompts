  - Adams, R. (1979). "Primitive Thisness and Primitive Identity."  
  - Belot, G. (2001). "The Principle of Sufficient Reason."  
  - Dasgupta, S. (2009). "Individuals: An Essay in Revisionary Metaphysics."  
