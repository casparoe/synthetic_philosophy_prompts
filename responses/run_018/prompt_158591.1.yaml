answer: |-
  Here is a systematic breakdown of the "revolutions devour their children" maxim, organized by precision, mechanism, scope, and interpretive frameworks, followed by an assessment using the autocannibalism/autoimmunization distinction:

  ---

  ### **I. Four Readings of the Maxim**

  1.  **Tautological Reading**
      *   **Thesis:** Any revolution that eliminates its founding agents is *by definition* self-destructive. "Devouring" is inherent in the act of purging the founders.
      *   **Mechanism:** Definitional Fiat (No causal mechanism; a label applied retrospectively).
      *   **Scope:** General (applies to any revolution meeting the criterion).
      *   **"Devouring" Denotes:** Primarily literal execution/elimination of key revolutionary agents.
      *   **Status:** Trivial (Explanatory power = zero).

  2.  **Structural Reading (Institutional Path-Dependence)**
      *   **Thesis:** Revolutionary institutions (e.g., emergency committees, tribunals, surveillance networks) created to combat external counter-revolution and internal dissent generate self-perpetuating dynamics. These institutions *must* continually identify and eliminate enemies to justify their existence and power, eventually targeting the revolution's own leaders who become obstacles or rivals.
      *   **Mechanism:** Institutional Path-Dependence & Self-Preservation Logic.
      *   **Scope:** General (Posited as a dynamic inherent in revolutionary *institutions*).
      *   **"Devouring" Denotes:** Literal execution/elimination of agents; potential dismantling of factions or weakening of revolutionary structures via purges.
      *   **Status:** Genuinely contested (claims a necessary structural logic).

  3.  **Ideological Reading (Purification Logic)**
      *   **Thesis:** The revolution's core abstract principles (e.g., Equality, Virtue, the General Will) are inherently pure and universal. Human actors, however, are fallible and susceptible to corruption, ambition, or deviation. Maintaining fidelity to the principle requires the relentless purification of its representatives. Those who initially embodied the revolution become its greatest betrayers by failing its absolute demands.
      *   **Mechanism:** Internal Logic of Ideological Purification.
      *   **Scope:** General (applies to ideologically driven revolutions), but most powerfully invoked for 1789-1794 (Robespierre's "Republic of Virtue").
      *   **"Devouring" Denotes:** Literal execution/elimination of agents (framed as purification); symbolic betrayal of principles via the act of purging founders.
      *   **Status:** Genuinely contested (claims a necessary ideological logic).

  4.  **Contingency Reading (Accident & Miscalculation)**
      *   **Thesis:** The elimination of revolutionary leaders is not driven by inherent logics (structural or ideological) but by the contingent interplay of personality clashes, factional power struggles, specific tactical errors (e.g., Danton's overconfidence, Robespierre's political missteps), external pressures, and sheer accident. "Devouring" is betrayal, not destiny.
      *   **Mechanism:** Contingent Betrayal, Tactical Miscalculation, Personality Conflict.
      *   **Scope:** Specific to 1789-1794 (highlights unique events/personalities), though framework applicable generally.
      *   **"Devouring" Denotes:** Literal execution/elimination of agents; institutional dismantling via factional victory (e.g., Thermidor dismantling the Terror's apparatus).
      *   **Status:** Genuinely contested (explicitly rejects necessity).

  ---

  ### **II. Assessment Against Interpretive Frameworks**

  | Reading          | Class Struggle Framework                                     | Ideology-Driven Framework                                  | Contingency Framework                                       | Presupposes Unified "Will/Body"?                         |
  | :--------------- | :----------------------------------------------------------- | :--------------------------------------------------------- | :---------------------------------------------------------- | :------------------------------------------------------- |
  | **Tautological** | Accommodates (as outcome), but undermines (no causal link to class dynamics). | Accommodates (as outcome), but undermines (no causal link to ideas). | Accommodates (as outcome), but undermines (denies causal role). | **Yes.** Requires a definable "self" (the revolution) acting against its "children." |
  | **Structural**   | **Accommodates:** Can frame institutions as tools of class factions; purges as eliminating rivals within the revolutionary bloc. **Undermines:** If institutions have *their own* logic overriding class interests. | Accommodates (ideology shapes institutions), but **Undermines:** If institutions drive action regardless of ideology. | **Undermines:** Posits necessary institutional logic, denying primacy of contingency. | **Ambiguous.** Can be framed as institutions (the "body") acting, or as factions using institutions against rivals. |
  | **Ideological**  | **Undermines:** Focuses on ideas transcending class; purification targets individuals/groups regardless of class origin. | **Accommodates:** Central role of ideas/logic of purity driving action. | **Undermines:** Posits necessary ideological logic, denying primacy of contingency. | **Strongly Yes.** Requires a unified revolutionary ideal/principle ("will") acting through purges. |
  | **Contingency**  | **Accommodates:** Factional struggles can be interpreted as representing competing class interests/solutions. | Accommodates (ideas used tactically), but **Undermines:** Denies ideas drive events necessarily. | **Accommodates:** Central role of accident, personality, tactics. | **No.** Explicitly relies on competing factions/groups; "devouring" is betrayal by rivals, not self-consumption. |

  ---

  ### **III. Applying the Niche Distinction: Autocannibalism vs. Autoimmunization**

  *   **Revolutionary Autocannibalism:** The regime consumes/destroys its *own* vital agents and the institutional structures it birthed, weakening itself. Focus: **Self-destruction of the revolutionary entity's components** (agents, structures).
  *   **Revolutionary Autoimmunization:** The regime identifies its *own* founding norms, personnel, or institutions as "foreign" contaminants threatening the revolution's purity/survival, and expels/destroys them to "protect" itself. Focus: **Defensive expulsion of internal "otherness"** to preserve the revolution's imagined pure essence.

  **Assessment:**

  1.  **Tautological Reading:** Fits **Autocannibalism** (simple destruction of founders = consuming self). Says nothing about "foreignness" or purity.
  2.  **Structural Reading:** Primarily **Autocannibalism.** Institutions destroy their creators/operators, potentially leading to systemic collapse (e.g., Terror weakening itself via purges). "Enemies" are functionally defined by the institution's needs, not necessarily as "foreign bodies." Enemies might be *generated* by the institutional logic or *revealed* as threats to its power.
  3.  **Ideological Reading:** Primarily **Autoimmunization.** The core mechanism is identifying deviation/corruption *within* the revolutionary body (founders becoming "impure") and expelling it in the name of protecting the pure principle/revolution itself (e.g., Robespierre eliminating Danton/Hébert as corrupting influences). **Requires accepting that revolutions necessarily generate internal enemies (deviants)** through the fallibility of actors failing the pure ideal. The "foreignness" is ideological, not necessarily social/organic.
  4.  **Contingency Reading:** Neither fits perfectly. Betrayal/elimination is factional politics, not the regime acting against *itself* as a unified entity (no "auto-"). If anything, it's **allogenic** (destruction by another faction) rather than autoimmune or autocannibalistic. Enemies are pre-existing rivals revealed by circumstance, not generated by revolution's logic.

  **Which Mechanism Does the Slogan Capture?**
  *   The visceral imagery of "devour" strongly suggests **Autocannibalism** (literal consumption/destruction of offspring).
  *   However, the *enduring explanatory power* of the slogan, especially regarding the FR, often draws implicitly on **Autoimmunization.** The pathos lies in the revolution destroying its most ardent champions *because* they are deemed impure or threatening to its core identity – they are consumed *as* foreign bodies. The slogan blurs the two, but Autoimmunization provides a stronger logic for *why* "children" become targets.

  **Necessity of Internal Enemies?**
  *   **Autocannibalism:** Does **not** require *necessary* generation of internal enemies. Enemies could be pre-existing rivals revealed (*Contingency*) or functionally defined by institutions (*Structural* – institutions *make* them enemies).
  *   **Autoimmunization:** **Requires** that revolutions necessarily generate internal enemies (deviants/corruptors) through the inherent gap between pure principle and imperfect human agents (*Ideological* reading). The "enemy" is defined by the failure to embody the ideal perfectly.

  **Which Readings Survive the Distinction?**
  *   **Strengthened:** The **Ideological Reading** is most clearly aligned with **Autoimmunization**, giving it conceptual depth. The **Structural Reading** aligns with **Autocannibalism**, highlighting self-destructive institutional dynamics.
  *   **Weakened/Transformed:** The **Tautological Reading** remains trivial. The **Contingency Reading** is fundamentally at odds with both "auto-" mechanisms, emphasizing external (factional) conflict over self-destruction. Its survival requires rejecting the slogan's core imagery of the revolution acting upon itself.
  *   **Revealed:** The slogan's common usage often smuggles in **Autoimmunization** (purification logic) under the guise of **Autocannibalism** (violent consumption). Recognizing this distinction forces a choice: either embrace the ideological necessity of purification (Autoimmunization) or explain devouring through institutional or contingent dynamics (Autocannibalism or rejection of "auto-"), abandoning the notion of a unified self-consuming entity.

  ---

  **Conclusion:** The slogan "revolutions devour their children" is not a single thesis but a cluster of interpretations ranging from trivial to contested. Its core imagery suggests autocannibalism, but its explanatory allure often depends on the logic of autoimmunization (purification). While structural and ideological readings accommodate deterministic mechanisms (institutional or purification logics), the contingency reading and class-struggle framework undermine the idea of a unified revolutionary "self" acting against its "children," reframing events as factional struggles. The autocannibalism/autoimmunization distinction highlights that the slogan's deepest claim about revolutions *necessarily generating and destroying internal enemies* is specific to the ideological (autoimmunization) reading. Other readings either trivialize the claim, locate the mechanism in institutions (which may reveal rather than generate enemies), or reject internal necessity altogether. Conceptual precision thus shows the slogan survives best as an expression of the ideological purification dynamic (autoimmunization), not as a universal law of revolution.
