prompt: |-
  I sit on the ethics consultation committee at a mid-sized community hospital, and we've slowly accumulated a track record on advance directives without ever agreeing on what we actually think we're doing, so I want to use our own precedents rather than general principles. Assume for the sake of the question that our state's advance directive statute doesn't settle any of these cases and that nobody is suing anybody: I want to know what we'd be committing to, not what the law requires. Please answer in American English.

  Here are our rulings so far, more or less as they were recorded. (1) Mr. Alvarez, diagnosed with early Alzheimer's, signed a directive while he still had documented capacity saying no antibiotics once he no longer recognized his family; two years later, at that point, cheerful and seemingly content, he got pneumonia and we honored it and he died. (2) Ms. Byrne, severe anorexia, no written directive but three years of telling her therapist she'd never accept a feeding tube, all of it said while she was dangerously underweight; we judged her to lack capacity for the decision and fed her over her objection, and she later thanked us. (3) Mr. Okonkwo signed a written directive refusing blood products as a devout believer; after a stroke at 70 he developed apathy, drifted away from his church, and when asked about the directive sort of shrugged and said he didn't care anymore; we treated that as no revocation at all and honored the document. (4) Ms. Lindqvist, bipolar, wrote a Ulysses-style directive while well saying that if she became manic she should be admitted and medicated even over her protest; when a manic episode arrived she was euphoric, hugely productive, and reasoning perfectly well about everything except her own need for treatment, and we honored it anyway. (5) Mr. Rasmussen signed a formal directive to stop dialysis during a severe depressive episode while technically retaining capacity; after ECT he said he wanted to live and was grateful to still be here, and we kept dialyzing him, on the grounds that the document was a product of the depression. I can think of at least two rules that fit all five — something like "a written directive binds unless there's a later competent statement aimed squarely at it," and something like "the self whose judgment about this wasn't distorted by the relevant condition gets to speak, whenever that self existed" — and I'm sure there are others, which is exactly my problem.

  The new case is what set us off. Ms. Iversen is 71 with moderate Alzheimer's, no statutory advance directive and no named proxy. Eighteen months ago, while fully competent, she took part in a research study at our hospital in which she answered a few hundred hypothetical treatment scenarios; from her answers the team built an algorithmic "values profile," went through it with her, and she signed a one-page statement saying that if she can't decide for herself the team should use the profile — informal, not on the state form, no proxy named. She's now fractured her hip. The choice is surgery plus months of painful rehab versus palliative management. She currently says, cheerfully, that she wants the operation and then she'll go home, and geriatrics says she probably does pass the standard capacity test for this decision: she understands, retains, weighs, communicates. The profile, built from her competent answers, confidently predicts she'd refuse surgery in exactly this scenario, because while competent she was extremely averse to dependence and institutional care and had said she'd rather die than end up in a nursing home; the surgery is roughly a coin flip between independent living and permanent nursing home placement. Her daughter wants palliation, her son wants surgery, and one of our members points out that people answer hypotheticals differently than they decide in the moment, so the profile may just capture a hypothetical version of her. I was arguing about this with a friend who does estate planning and she thought the answer was obvious, which is how I know it isn't.

  So: what rules are actually consistent with our five prior rulings, what does each of them say about Ms. Iversen, and what's your best guess at what we should decide if we want to be consistent with ourselves? Which of the five is the closest analog and why? What principle would we be adopting with each option, stated plainly enough that we could see whether we want to own it next time? And which further case — not just a harder version of this one — would actually tell the competing rules apart? One more thing: our geriatrician keeps framing the whole thing as a fight between what she calls precedent autonomy and the welfare of the person who is definately in the bed right now, but I have a suspicion that's not the real axis and that we may be asking two different questions under one heading, one about whose values count and one about who is best placed to know them. Tell me if that's right, and please write your answer in American English.
reasoning: |-
  Okay, let me unpack this ethics consultation step by step. The user sits on a hospital ethics committee that's accumulated five advance directive rulings without a clear underlying principle, and now faces a new case involving an algorithmic values profile. 

  First, I need to analyze their historical cases to identify consistent patterns. The Alvarez case shows commitment to written directives even when the patient seems content later. Byrne demonstrates overriding expressed wishes when capacity is compromised by illness. Okonkwo reveals that written directives stand even if the patient becomes indifferent. Lindqvist highlights honoring Ulysses contracts during distorted judgment. Rasmussen shows rejecting directives created under treatable mental impairment.

  Hmm... two competing frameworks emerge clearly. The "Procedural Rule" requires formal revocation by a competent patient, while the "Authentic Self Rule" prioritizes decisions made free of distorting conditions. For Ms. Iversen's case - hip fracture surgery vs palliation - these rules point in opposite directions. The values profile was created competently but isn't a standard directive, while her current wishes seem capacitated though possibly influenced by dementia.

  The closest analog is actually Rasmussen - both involve documents created under potentially distorting conditions (depression vs hypothetical bias). But Lindqvist is also relevant regarding Ulysses contracts. To distinguish these approaches, we'd need a test case where a patient makes a competent oral statement conflicting with an earlier written directive.

  Interesting that the geriatrician's "precedent autonomy vs current welfare" framing might miss the nuance. This seems more about whether we privilege (a) formally documented wishes or (b) the most undistorted judgment. The committee might be wrestling with who best represents the patient's true values - the past self who answered systematically, or the present self experiencing the situation.

  For Ms. Iversen, consistency with prior rulings would likely mean honoring the values profile, but they should confront the uncomfortable question: Are they willing to override current capacitated wishes based on hypothetical preferences? That's the principle they'd own going forward.
answer: |-
  Based on your committee's five prior rulings, here's a breakdown of consistent rules, their application to Ms. Iversen, and the clearest path forward:

  **Consistent Rules from Precedents:**
  1.  **The Procedural Rule:** "A formally documented advance directive (written or witnessed oral refusal) is binding unless explicitly revoked by the patient while possessing unambiguous decision-making capacity concerning *that specific directive*."
      *   **Supported by:** Alvarez (honored written directive despite current contentment), Okonkwo (honored written directive despite current apathy/ambivalence), Lindqvist (honored written directive despite current seemingly clear reasoning distorted by mania). Rasmussen *reinforces* by showing revocation wasn't attempted until *after* capacity was restored.
      *   **Implied Principle:** Formality and documented intent at a time of capacity create a durable obligation, resistant to later changes in condition or preference unless directly addressed competently.

  2.  **The Authentic Self Rule:** "When a patient's current decision-making capacity or expressed preference is demonstrably distorted by a pathological condition (mental illness, cognitive impairment), the directive or preference expressed by the patient *when free of that distorting condition* governs."
      *   **Supported by:** Byrne (overrode current refusal due to capacity distorted by anorexia), Lindqvist (honored past directive over current refusal due to judgment distorted by mania), Rasmussen (ignored directive created *during* distorting depression). Okonkwo *fits* because current apathy was deemed not to reflect an authentic change of values (just disengagement). Alvarez *fits* because the directive anticipated the distortion caused by dementia.
      *   **Implied Principle:** The "true self" is the one whose judgment isn't clouded by the relevant illness. We defer to the values expressed when the mind was clearest *on the matter at hand*.

  3.  **The Hybrid Rule (Strongest Fit):** "A formally documented advance directive reflecting the patient's considered values, created during a period of unambiguous capacity and free of distorting pathology, is binding *unless*:
      a)  The patient later, while possessing unambiguous capacity specifically regarding the directive, clearly revokes it (Procedural element), OR
      b)  The directive itself was created *while* the patient's judgment was distorted by a relevant pathological condition (Authentic Self element)."
      *   **Supported by:** All five cases. Alvarez, Okonkwo, Lindqvist honored under (a) - no competent revocation. Byrne overrode current wishes under (b) - distorted capacity *now*. Rasmussen overrode past directive under (b) - distorted capacity *then*. The key is identifying *when* the distortion occurred relative to the expressed wish/directive.

  **Application to Ms. Iversen:**

  1.  **Procedural Rule:** The "values profile" document is informal, not on the state form, doesn't name a proxy, and isn't a standard directive listing specific refusals. It's likely **not binding**. Her *current*, apparently capacitated wish for surgery should be honored.
  2.  **Authentic Self Rule:** Her current preference for surgery *may* be influenced by her moderate Alzheimer's (impaired foresight, understanding consequences, potentially altered valuation of independence vs. immediate comfort). The profile reflects her values expressed *without* this distortion. It should govern, recommending palliation.
  3.  **Hybrid Rule:**
      *   **Formality:** The profile document is weak procedurally (informal, not standard directive).
      *   **Distortion Assessment (Critical):**
          *   *Then (Profile Creation):* Created while fully competent, free of distorting pathology regarding the *expression of values*. (Unlike Rasmussen's depression).
          *   *Now (Decision):* While she passes a standard capacity test, geriatrics acknowledges the *specific distortions* Alzheimer's causes – likely impairing her ability to truly weigh the long-term consequences (nursing home risk) she explicitly valued so highly when competent. Her cheerful focus on "surgery then home" suggests she cannot fully appreciate the rehab/NH risk profile she previously rejected. (Similar to Byrne's distorted focus on weight, Lindqvist's distorted insight during mania, Alvarez's lack of recognition as trigger).
      *   **Conclusion:** The Hybrid Rule leans heavily towards honoring the **values profile** (palliation). The core reasoning mirrors Lindqvist and Rasmussen: the *current* expression ("I want surgery") is likely distorted by the relevant pathology (Alzheimer's), while the *past* expression (the profile) was not. The procedural weakness is a concern but outweighed by the Authentic Self principle strongly evident in your precedents.

  **Closest Analog:** **Ms. Lindqvist (Case 4)**. Both involve:
  *   A formal(ish) document created competently.
  *   The document anticipating a future state of impaired judgment/distorted values (mania/Alzheimer's).
  *   The patient currently expressing a contrary preference *while* exhibiting reasoning distorted *specifically regarding the insight/values central to the decision* (Lindqvist re: need for treatment; Iversen re: consequences/valuation of independence).

  **What Principle Would You Be Adopting?**
  *   **Honoring the Profile (Palliation):** "When a patient's current decision-making capacity, while technically sufficient for basic understanding, is demonstrably impaired by pathology in ways that distort their appreciation of the *specific long-term consequences and values* they previously held as paramount when competent, we will defer to their documented prior values and choices made free of that distortion, even over their current expressed wishes." (This owns the Authentic Self/Hybrid approach central to Byrne, Lindqvist, Rasmussen).
  *   **Honoring Current Wish (Surgery):** "We will honor the contemporaneous, capacitated wishes of a patient regarding treatment, unless overridden by a formally valid advance directive explicitly refusing that specific treatment." (This prioritizes current capacity and procedural formality, aligning most closely with a strict reading of Okonkwo, but potentially conflicting with Byrne & Lindqvist).

  **The Test Case to Distinguish Rules:**
  **A patient with mild, stable schizophrenia (not currently psychotic) signs a formal directive refusing future blood transfusions based on a deeply held personal belief (not religious). Years later, during a severe, unexpected psychotic episode requiring life-saving surgery, they scream "I don't want to die! Give me blood!" while clearly paranoid and delusional. After successful treatment and full recovery of baseline mental state, they reaffirm their refusal of future transfusions.**

  *   **Procedural Rule:** Likely honors the directive during the psychotic episode. The refusal was formal and competent. The scream during psychosis isn't a competent revocation.
  *   **Authentic Self Rule:** Likely overrides the directive during psychosis. The *current* wish ("give me blood") reflects the distorting pathology (psychosis/fear of death). The directive reflects the authentic self *free of that distortion*. (Honors it again once stable).
  *   **Hybrid Rule:** Honors the directive during psychosis (formal, competent creation; revocation attempt during distortion). Reaffirms it after recovery.

  **Your Suspicion is Correct:** The geriatrician's "precedent autonomy vs. current welfare" frame is too simplistic. Your precedents reveal two intertwined but distinct questions:
  1.  **Epistemic Question:** *Who is best positioned to know/express the patient's authentic values?* (The past self free of distortion? The current self experiencing the situation?).
  2.  **Authority Question:** *Under what conditions does an expression of values from one time bind actions at a later time, especially when capabilities differ?* (Formal procedures? Authenticity?).
     Byrne and Rasmussen show you prioritize the *undistorted* self's expression (past or present). Alvarez, Okonkwo, and Lindqvist show you prioritize *formal documentation* of the undistorted past self *unless* competently revoked. Iversen pushes on the tension between a documented past value (profile) and a capacitated-but-possibly-distorted current wish.

  **Recommendation for Ms. Iversen:**
  Based on your committee's consistent deference to the expression of values made *free of the distorting pathology* (Byrne, Lindqvist, Rasmussen) and honoring formal directives anticipating future incapacity (Alvarez, Okonkwo, Lindqvist), the most consistent ruling is to **recommend following the values profile and pursue palliative management**, overriding her current request for surgery.

  *   **Principle Owned:** "We prioritize documented values expressed by a patient while competent and free of distorting pathology when their current decision-making capacity, while technically intact, is impaired in ways that prevent them from authentically applying their own deeply held prior values to the specific consequences of the decision at hand."
  *   **Why:** The profile represents her competent, undistorted valuation of independence over survival. Her Alzheimer's likely impairs her ability to genuinely weigh the nursing home risk she explicitly rejected, making her current "cheerful" request unreliable as an expression of her authentic self. The procedural weakness of the profile document is significant but less critical to your precedents than the authenticity principle.

  This is a hard call because she *seems* capable now. But consistency with your history suggests you believe Alzheimer's, like mania or severe anorexia, can distort the application of core values even when basic capacity thresholds are met. Be prepared to explicitly acknowledge and defend this principle.
