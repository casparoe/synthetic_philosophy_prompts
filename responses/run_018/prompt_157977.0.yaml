  The user's reply should clarify their interpretation isn't denying the theorem but reinterpreting its implications. For the circularity point, they could argue that once prices are set, they become evidence, but using them for decisions assumes the market has already incorporated all info, which is circular if taken literally. But that circularity might be broken by new information.

  Weak points: The theorem's assumptions are ideal, so applying it to real markets is a stretch. Also, if prices already encode all info, how do new trades happen? The user might need to concede that their view applies only in the theorem's ideal scenario, not real markets.

