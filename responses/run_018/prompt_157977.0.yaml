  First, I need to recall the no-trade theorem properly. Milgrom-Stokey 1982: If all traders are rational, risk-averse, and have concordant priors, then no trade occurs because their differences in beliefs can't be common knowledge. The user is flipping this: prices reflect all private info as common knowledge. But the theorem assumes common knowledge of rationality and priors. That might be the economists' main objection.

  The user's claim about prices being evidential leading to circularity is interesting. If prices reflect all info, then using them as evidence for investment decisions seems circular. But in reality, markets aren't perfectly efficient. The crypto angle is probably the user's biggest fear because information asymmetry is rampant there, which would break the theorem's assumptions.

