answer: |-
  **Pain asymbolia refutes evaluative-content theories by demonstrating that pain's intrinsic badness is not an added representational layer but instead constitutes aversive binding—the mandatory motivational integration of noxious signals—while preserved registration without binding in asymbolia supports a sensory-urgency account.** Evaluative-content theories posit that pain's badness is a separable evaluative representation (e.g., "this damage is bad for me") appended to neutral sensory data. Asymbolia directly undermines this: patients accurately discriminate noxious stimuli (registration) but lack all motivation to avoid or terminate it, reporting the sensation as neutral or even curious. This dissociation proves badness isn’t a contingent cognitive add-on but requires intrinsic integration of sensation with motivation. A modified sensory-urgency account resolves this by decoupling *registration* (detecting tissue threat via nociception) from *binding* (the structural coupling of this signal to a first-personal motivational "veto" imperative). Binding generates the inescapable "I must act *now*" urgency definitive of pain’s badness. Asymbolics retain registration but lack binding, confirming that badness *is* the binding process itself within intact nociceptive architecture—not an extra layer.

  The collapse objection—that binding reduces to intensity, spatial precision, or attentional salience—fails because none suffice for first-personal urgency. A blinding light has high intensity and captures attention but lacks binding’s intrinsic action-demand: it feels loud, not *personally threatening*. Binding specifically encodes "*my body* is under threat *here*", triggering an ego-centric imperative to protect bodily integrity. Crucially, binding persists even when intensity is low (e.g., dull aches) and is absent in asymbolia despite intact intensity discrimination. Mere salience (e.g., a sudden noise) doesn’t compel self-preservative action; binding does. Attentional capture is necessary but insufficient—asymbolics attend to pain but feel no urgency, proving binding adds a distinct motivational vector.

  **The position collapses empirically if asymbolics exhibit intact aversive binding without noxious registration or vice versa.** Specifically, if patients with *disrupted registration* (e.g., unable to localize/discriminate noxious stimuli) nonetheless display *binding*—manifesting motivation to avoid stimuli they cannot sensibly identify as harmful—this would sever binding’s dependence on registration. Conversely, if asymbolics retain *binding* (motivational avoidance) despite lacking *affective response*, it would contradict the claim that binding constitutes badness. Conceptually, if binding proves indistinguishable from generic salience mechanisms (e.g., if identical neural substrates drive avoidance of pain and non-noxious distractors), the account reduces to intensity/salience. **The core vulnerability is the neural and functional dependence of binding on registration:** if binding operates independently—motivating avoidance without sensory discrimination of threat—the model’s foundation fails.
