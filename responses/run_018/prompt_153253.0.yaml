  Write a villanelle about the procreation asymmetry, specifically in the version that confronts the non-identity problem: the fact that any suffering person one might create could not have existed without that very suffering, while any happy person one forgoes could not have existed at all. Use two refrains—one stating that there is no obligation to bring a happy life into being, the other stating that there is an obligation not to bring a suffering life into being—and let them alternate through the five tercets. In the final quatrain, place the two refrains side by side without letting either absorb the other, so that the form’s inevitable convergence mirrors the philosophical stalemate: both claims stand together, yet neither explains the other. Make the rhyme scheme pair near-homophones that sit on the boundary between presence and absence—such as “born” with “borne,” or “make” with “lack”—so that the sound of the verse enacts the thin line between existence and non-existence. The poem should be precise enough that someone familiar with population ethics recognizes the argument, but it should not read like a summary; rather, the repetition and rhyme should leave the asymmetry feeling as structurally strange as it actually is.
