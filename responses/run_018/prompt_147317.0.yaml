prompt: |-
  I am a doctoral student in philosophy of science, and I have been observing the evaluation criteria used by several interdisciplinary grant panels that fund evolutionary-cognitive research. There is a consistent institutional pattern: reviewers approve proposals that explain high-level cognitive traits—such as recursive syntax or normative reasoning—only when the applicant specifies a continuous, stepwise adaptive pathway assembled from lower-level mechanisms that are already independently established. Reviewers routinely reject accounts that invoke sudden, functionally irreducible jumps or top-down selection pressures as illegitimate skyhooks, even when the two kinds of proposal generate identical empirical predictions. At the same time, these panels reject purely molecular-level derivations that attempt to move straight from gene-expression dynamics to the cognitive trait without passing through intermediate organizational levels—what one program officer recently described, in a rejection letter, as an unacceptable form of greedy reductionism. The practice therefore enforces a narrow middle space: explanations must be built bottom-up, but not all the way down in one greedy leap, and they must avoid any mysterious top-down injection.

  What philosophical commitments about scientific explanation, ontological levels, and evolutionary novelty does this screening practice actually presuppose? Does it strictly require a mechanistic or multi-level view of explanation, or does it merely fit well with one? Can a pluralist about explanatory autonomy—someone who thinks that functional-level descriptions have their own legitimate standards—accept the practice, or does the institutional rejection of both extremes quietly rule out pluralism in favor of a specific architectural ontology? Furthermore, if we replaced this criterion with one that permitted either pure molecular derivation or irreducible functional emergence, what exactly would have to change in the field's underlying conception of how cognitive traits are constituted?
reasoning: |-
  Okay, let me unpack this rich query from a philosophy of science doctoral student. They're observing a fascinating pattern in interdisciplinary grant evaluations for evolutionary-cognitive research: proposals must walk a tightrope between "skyhooks" (top-down explanations) and "greedy reductionism" (over-leaping molecular explanations), enforcing a very specific middle path. The core question is about the philosophical presuppositions behind this institutional practice.

  First, I need to map the terrain of their observation. The consistent rejection of both extremes suggests a strong implicit commitment to multi-level mechanistic explanation. When reviewers demand continuous stepwise pathways from established lower-level mechanisms, they're essentially enforcing what philosophers like Craver would call constitutive mechanistic explanation. The "no skyhooks" rule clearly targets any form of downward causation or radical emergence, while the "no greedy reductionism" rejection indicates an anti-reductionist stance that requires showing the organizational scaffolding.

  Hmm... the pluralism angle is particularly interesting. Could someone like Fodor (with his special sciences autonomy view) accept this practice? Probably not comfortably - the systematic rejection of purely functional explanations suggests the field operationalizes explanatory adequacy as demonstrating implementational feasibility. This seems like a quiet endorsement of ontic constraints on explanation.

  The student's hypothetical about changing the criteria is sharp. If panels suddenly allowed pure molecular derivations, it would imply that cognitive traits are nothing but molecular dynamics - a radical constitutive reductionism. Whereas permitting irreducible emergence would require accepting novel causal powers at higher levels. Both would dismantle the current ontological scaffolding that treats cognitive levels as real organizational features.

  I should also note the implicit progressivism here: the demand for "independently established" lower mechanisms suggests a cumulativity norm where new explanations must slot into existing frameworks. That carries a whiff of Lakatosian research programs. The aversion to "mysterious injections" reveals a deeper empiricist commitment - perhaps even what McAllister would call an aesthetic criterion of "continuity" as a proxy for scientific virtue.

  What's revealing is how these philosophical commitments get baked into institutional gatekeeping practices. The program officer's language ("greedy reductionism", "skyhooks") shows Dennett's framework has become disciplinary common sense. That raises metascientific questions about how conceptual tools solidify into evaluative regimes.
answer: |-
  Your observation reveals a deep institutionalization of **multi-level mechanistic explanation** with **specific ontological commitments** about emergence and reduction. Let's dissect the philosophical presuppositions:

  ### Core Philosophical Commitments
  1. **Anti-Skyhook Prescription (Rejecting Top-Down Emergence):**
     - Presupposes **causal completeness of lower levels**: Higher cognitive traits *must* be constituted by lower-level mechanisms. Sudden jumps violate the principle of **continuity** in evolution (Dennett's "universal acid" of Darwinism).
     - Rejects **strong emergence**: Any account implying novel causal powers irreducible to lower-level interactions is deemed illegitimate. This assumes **causal exclusion** – if lower-level mechanisms suffice, top-down causes are epiphenomenal.

  2. **Anti-Greedy Reductionism (Rejecting Bottom-Up Leaps):**
     - Assumes **explanatory autonomy of levels**: Cognitive phenomena require *organizational constraints* that aren't deducible from molecular dynamics alone (e.g., Craver's "mosaic unity"). Skipping levels violates **mechanistic depth**.
     - Embodies **Wimsatt's non-aggregativity**: Cognitive traits are "emergent" in the weak sense – their properties arise from *specific organizational relations* between components, not just the components themselves.

  3. **The Enforced Middle Path:**
     - **Constitutive Reductionism**: Traits must be *constituted by* lower-level mechanisms (rejecting dualism).
     - **Explanatory Anti-Reductionism**: Explanation requires tracing *how* organization at each level enables the next (Machamer-Darden-Craver's mechanistic explanation).
     - **Stepwise Adaptationism**: Evolutionary novelty requires incremental functional intermediates (aligning with Dennett's "cranes" over "skyhooks").

  ### Pluralism vs. Architectural Ontology
  - **Pluralism is Incompatible** with this practice. The rejection of *both* "pure functional emergence" and "pure molecular derivation" implies:
    - **Explanatory levels are ontologically binding**: Cognition isn't just a useful description (contra instrumentalist pluralism); it supervenes on specific mechanistic arrangements.
    - **No explanatory autonomy for functional descriptions**: A purely functional account (e.g., "normative reasoning emerges from group selection") is rejected unless it specifies *how* lower-level mechanisms implement it. This rules out Fodor-style "special sciences" autonomy.
    
  - **Commitment to Mechanistic Hierarchy**: The practice presupposes a **nested ontological hierarchy** (genes → circuits → computations → cognition) where each level:  
    (a) Constrains the level above,  
    (b) Is realized by the level below,  
    (c) Requires its *own* explanatory principles (e.g., information processing ≠ biochemical signaling).

  ### Consequences of Changing the Criteria
  If panels permitted **pure molecular derivations**:
  - **Ontology**: Would imply cognitive traits are *nothing but* molecular dynamics (eliminative reductionism).  
  - **Explanation**: Would render cognitive/info-processing levels heuristic only, not ontologically significant.  
  - **Field Impact**: Cognitive neuroscience would collapse into molecular biology; evolutionary constraints would be sidelined.

  If panels permitted **irreducible functional emergence**:  
  - **Ontology**: Would legitimate novel causal powers at cognitive levels (e.g., group minds shaping neurobiology via top-down causation).  
  - **Explanation**: Could validate "black box" models (e.g., AI-inspired cognitive architectures without biological implementation).  
  - **Field Impact**: Evolutionary psychology might prioritize adaptive functions over mechanistic plausibility; evo-devo approaches could be marginalized.

  ### Underlying Conception of Cognitive Traits
  The current practice enforces a view where cognitive traits are:  
  **Evolved Mechanisms** = Organizational configurations that:  
  1. Arise via Darwinian processes (continuity),  
  2. Are *constituted by* but *not reducible to* molecular parts (non-greedy mechanism),  
  3. Require explanation at *every relevant level* (multi-level integration).  

  To abandon this would require rejecting:  
  - **Causal continuity** in evolution (permitting saltationism),  
  - **Mechanistic supervenience** (allowing strong emergence),  
  - **Non-aggregativity** of cognitive systems (accepting that genes "directly" explain syntax).

  ### Conclusion
  This institutional practice covertly enforces a **non-reductive physicalist ontology** with **mechanistic constraints on explanation**. It presupposes that:  
  - Evolution builds via incremental tinkering (Jacob),  
  - Reality is hierarchically organized (Simon),  
  - Valid explanation requires inter-level integration (Craver & Bechtel).  

  A pluralist could only accept this practice by conceding that functional explanations are *provisional* until grounded in mechanisms – effectively surrendering strong autonomy. The criteria reflect a field consensus that cognitive traits are *emergent dynamical systems*: explanatorily autonomous in their organization, but ontologically dependent on their physical implementation.

  *Source influences: Dennett (skyhooks/cranes), Craver (mechanistic explanation), Wimsatt (emergence/reduction), Fodor (autonomy of special sciences), McShea & Brandon (evolutionary continuity)*.
