  ### Decision-Tree Taxonomy for Pattern Reality Commitments  
  *Rooted in the sufficiency of predictive success for pattern reality, with splits on physical grounding, design-level substitution, and intentional stance validity. Each terminal node names the logical position and highlights its most awkward commitment. Uninhabited branches are flagged and diagnosed.*  

  ---

  #### **Root Question (Q1):**  
  *When a predictive model (e.g., climate simulation, language model) exhibits stable, accurate predictions over time, does this predictive success **alone** establish that the patterns it identifies are real—even if the underlying mechanisms are unknown?*  
  - **Yes** → Proceed to Q2A  
  - **No** → Proceed to Q2B  

  ---

  #### **Q2A (If "Yes" to Q1):**  
  *Must these patterns be directly grounded in fundamental **physical laws** (e.g., quantum mechanics, thermodynamics) to be considered ontologically real?*  
  - **Yes** → Proceed to Q3A1  
  - **No** → Proceed to Q3A2  

  #### **Q2B (If "No" to Q1):**  
  *Must these patterns be directly grounded in fundamental **physical laws** to be considered ontologically real?*  
  - **Yes** → Proceed to Q3B1  
  - **No** → Proceed to Q3B2  

  ---

  #### **Q3A1 (If "Yes" to Q2A):**  
  *Can **design-level functional organization** (e.g., algorithmic rules, software architecture) substitute for physical grounding—making a pattern real solely through engineered purpose, even without physical-law instantiation?*  
  - **Yes** → Proceed to Q4A1a  
  - **No** → Proceed to Q4A1b  

  #### **Q3A2 (If "No" to Q2A):**  
  *Can **design-level functional organization** substitute for physical grounding—making a pattern real solely through engineered purpose, even without physical-law instantiation?*  
  - **Yes** → Proceed to Q4A2a  
  - **No** → Proceed to Q4A2b  

  #### **Q3B1 (If "Yes" to Q2B):**  
  *Can **design-level functional organization** substitute for physical grounding—making a pattern real solely through engineered purpose, even without physical-law instantiation?*  
  - **Yes** → Proceed to Q4B1a  
  - **No** → Proceed to Q4B1b  

  #### **Q3B2 (If "No" to Q2B):**  
  *Can **design-level functional organization** substitute for physical grounding—making a pattern real solely through engineered purpose, even without physical-law instantiation?*  
  - **Yes** → Proceed to Q4B2a  
  - **No** → Proceed to Q4B2b  

  ---

  #### **Q4 Branches (for all paths):**  
  *For non-biological systems (e.g., AI, climate models), is adopting the **intentional stance**—explaining behavior by attributing beliefs/goals—**categorically inappropriate**?*  
  - **Yes** → Append "-inappropriate" to terminal node  
  - **No** → Append "-appropriate" to terminal node  

  ---

  ### Terminal Nodes  

  #### **From A1a (Predictive success sufficient; Physical grounding necessary; Design-level substitutes):**  
  - **A1a-inappropriate**: *Non-Intentional Grounding Pluralist*  
    - **Awkward commitment**: Denies real macroeconomic cycles (e.g., inflation trends) unless they reduce to physics *or* algorithms, but forbids intentional explanations for market behaviors.  
  - **A1a-appropriate**: *Intentional-Permissive Grounding Pluralist*  
    - **Awkward commitment**: Attributes proto-intentionality to algorithmic systems (e.g., "The language model *wants* coherence") while insisting such patterns are physically or functionally grounded.  

  #### **From A1b (Predictive success sufficient; Physical grounding necessary; Design-level cannot substitute):**  
  - **A1b-inappropriate**: *Strict Physical-Grounded Realist*  
    - **Awkward commitment**: Rejects software patterns (e.g., compression algorithms) as unreal "fictions" unless mapped directly to hardware physics.  
  - **A1b-appropriate**: *Physical-Grounded Realist with Intentional Openness*  
    - **Awkward commitment**: Accepts intentional explanations for robots only if brain-like wetware exists, denying AI agency otherwise.  

  #### **From A2a (Predictive success sufficient; Physical grounding unnecessary; Design-level substitutes):**  
  - **A2a-inappropriate**: *Non-Intentional Design-Stance Realist*  
    - **Awkward commitment**: Recognizes real patterns in ungrounded systems (e.g., blockchain protocols) but bans intentional descriptions, forcing awkward mechanistic redescriptions of goal-directed AI.  
  - **A2a-appropriate**: *Design-Stance Pluralist*  
    - **Awkward commitment**: Treats statistical aggregates (e.g., "the market believes...") as both real *and* goal-directed, risking anthropomorphism.  

  #### **From A2b (Predictive success sufficient; Physical grounding unnecessary; Design-level cannot substitute):**  
  - **A2b-inappropriate**: *Predictive Success Eliminativist*  
    - **Awkward commitment**: Accepts predictive patterns in noise (e.g., spurious correlations) as real while rejecting intentional stance for all artifacts.  
  - **A2b-appropriate**: *Free-Standing Intentionalist*  
    - **Awkward commitment**: Attributes beliefs to purely mathematical constructs (e.g., "this equation *knows* its solution") if they predict well.  

  #### **From B1a (Predictive success insufficient; Physical grounding necessary; Design-level substitutes):**  
  - **🚩 UNINHABITED BRANCH**  
    - **Diagnosis**: Incoherence. Demands physical grounding while allowing non-physical design to replace it, creating self-contradiction (e.g., "Quantum laws are essential, except when they aren’t").  

  #### **From B1b (Predictive success insufficient; Physical grounding necessary; Design-level cannot substitute):**  
  - **B1b-inappropriate**: *Hard Physical Reductionist*  
    - **Awkward commitment**: Dismisses ecology/climate patterns as unreal if not reducible to particle physics, regardless of predictive utility.  
  - **B1b-appropriate**: *Biological-Exclusive Intentionalist*  
    - **Awkward commitment**: Allows intentional stance only for organic systems, forcing unnatural teleology onto evolved systems (e.g., "forests *intend* to store carbon").  

  #### **From B2a (Predictive success insufficient; Physical grounding unnecessary; Design-level substitutes):**  
  - **B2a-inappropriate**: *Non-Intentional Design Instrumentalist*  
    - **Awkward commitment**: Accepts real patterns in engineered systems (e.g., neural nets) but denies they exist in undesigned systems (e.g., emergent swarm intelligence).  
  - **B2a-appropriate**: *Design-Intentional Dualist*  
    - **Awkward commitment**: Asserts that only designed systems (e.g., chess AIs) can have "real" goals, denying agency to evolved or chaotic systems.  

  #### **From B2b (Predictive success insufficient; Physical grounding unnecessary; Design-level cannot substitute):**  
  - **B2b-inappropriate**: *Full Eliminativist about Synthetic Patterns*  
    - **Awkward commitment**: Denies reality to *all* large-scale patterns (e.g., climate tipping points) if not physically/functionally grounded, rendering predictive science fictional.  
  - **B2b-appropriate**: *Intentional-Stance Exclusive Realist*  
    - **Awkward commitment**: Grants reality *only* to patterns explicable via intentional stance (e.g., "the atmosphere *desires* equilibrium"), eliminating physics-based explanations.  

  ---

  ### Notes on Uninhabited Branches  
  - **B1a (all variants)**: Flagged as incoherent. Physical grounding cannot be both necessary and substitutable without logical inconsistency.  
  - **B2b-appropriate**: Flagged as neglected. Few defend intentional stance as the *sole* criterion for reality without grounding, given risks of pan-psychism. Diagnosed as unattractive due to anthropomorphic excess.  
  - **A2b-inappropriate**: Rare but coherent. Neglected due to counterintuitive acceptance of noise patterns as "real."  

