  **Joint Statement on Darwinian and Turing Inversions: Competence without Comprehension?**

  *By Adversarial Collaboration between the "Strong Inversion" and "Displaced Comprehension" Camps*

  **1. Agreed Claims**

  Both camps agree on the following:

  1. **Darwin’s Mechanism**: Natural selection is a process that, over generations, produces complex adaptive features in organisms without any intentional guidance. The resulting organisms exhibit sophisticated competences (e.g., camouflage, nest-building) that appear designed but arise from variation, inheritance, and selection.

  2. **Turing’s Computation**: A Turing machine (or equivalent computational system) can perform complex tasks (e.g., solving equations, playing chess) by following formal syntactic rules. This requires no understanding or awareness from the machine itself during the execution.

  3. **Formal Properties**: Both systems are substrate-neutral. Darwin's process works regardless of the biological substrate (e.g., DNA, RNA) as long as it allows for variation and inheritance. Turing's computation works regardless of the physical implementation (e.g., silicon, gears, neurons) as long as it follows the rules.

  4. **The Phenomena to Explain**: The appearance of high-level competence (e.g., problem-solving, adaptation) in systems that lack any internal states resembling human-like comprehension (beliefs, goals, understanding) at the point of performance.

  5. **Human Comprehension**: Human designers (in computation) and the historical process of natural selection (in evolution) involve comprehension. But the agreement is about the *performing system* at runtime: the organism or the running program.

  **2. Disagreements Table**

  | Strong Inversion Camp | Displaced Comprehension Camp |
  |----------------------|------------------------------|
  | The competence exhibited by evolved organisms or running programs is achieved with **literally zero comprehension** in the system during its operation. The comprehension is fully outsourced: to the past (via evolutionary history) or to the designer (via programmed rules). | The competence exhibited by evolved organisms or running programs **does not lack comprehension**; instead, comprehension is embedded in the system in a distributed form. We misattribute the absence because we look for it in the wrong place (e.g., the agent’s head) rather than in the structure of the system. |
  | Darwinian selection demonstrates **teleonomic outsourcing**: the "purpose" (teleonomy) of an organism's traits is set by ancestral selection pressures, not by the organism's own understanding. Thus, competence is achieved without any comprehension in the organism. | Darwinian selection **distributes comprehension** across the evolutionary process. The "comprehension" is in the information accumulated in the genome and the environment over generations, making the organism's competence a product of embedded understanding. |
  | In Turing computation, the machine's execution is **purely syntactic**: it manipulates symbols based on rules without any semantic grasp. The comprehension is outsourced to the designer/human who assigned meaning. | In Turing computation, the machine's transition rules **carry syntactic comprehension** because they encode the designer's understanding in a formalized way. The system, while running, enacts this comprehension. |

  **3. Cruxes**

  We identify the following cruxes. For each, we describe a concrete case both sides agree is relevant, and each camp's prediction.

  **Crux 1: Does teleonomic outsourcing eliminate mental content, or only disperse it?**

  - **Concrete Case**: Consider a spider building a web. The web-building behavior is innate and shaped by natural selection. The spider has no understanding of why it builds the web this way.
    - *Strong Inversion Prediction*: The case shows competence (web-building) with zero comprehension in the spider. The "why" is entirely outsourced to evolutionary history.
    - *Displaced Comprehension Prediction*: The case shows comprehension dispersed into the spider's genetic and neural architecture. The spider embodies the "understanding" of web-building accumulated by its ancestors.

  **Crux 2: Does a running Turing machine, absent its designer, still carry syntactic comprehension in its transition rules?**

  - **Concrete Case**: A chess-playing AI (like Stockfish) running on a computer. It makes sophisticated moves by evaluating positions via algorithms, with no awareness.
    - *Strong Inversion Prediction*: The AI has zero comprehension. Its moves are syntactic symbol manipulation; any meaning (e.g., "this move threatens the queen") is assigned by humans, not present in the machine.
    - *Displaced Comprehension Prediction*: The transition rules of the AI encode the designers' comprehension of chess strategy. During runtime, the system syntactically enacts this comprehension, so it's present in the process.

  **Crux 3: Can a system exhibit genuine competence (e.g., problem-solving) without any trace of comprehension, even distributed?**

  - **Concrete Case**: A Darwinian process evolving digital organisms in a simulated environment (e.g., Tierra). The organisms evolve efficient code-replication strategies without any designer input during the simulation.
    - *Strong Inversion Prediction*: The digital organisms achieve competence (e.g., replication, resource competition) with zero comprehension anywhere in the system at runtime. Comprehension is outsourced to the simulation's initial setup and rules.
    - *Displaced Comprehension Prediction*: The competence arises because comprehension is embedded in the simulation's rules and the evolutionary history of the digital population. It's distributed but real.

  ---

  *Closing Note: This document reflects our current positions. We commit to updating it based on new arguments or evidence, especially regarding the cruxes.*
