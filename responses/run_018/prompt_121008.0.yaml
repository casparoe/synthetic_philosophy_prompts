  i'm putting together questions for a podcast intervew next week with a philosopher who defends a pretty niche reading of W.E.B. Du Bois's claim that all art is propaganda. she doesn't just mean art has political effects—she argues Du Bois meant propaganda literally as the propagation of a perceptual framework, specifcally one that conditions the audience to inhabit a racialized or de-racialized mode of embodiment. she applies this to abstract sound instalations and non-figurative sculpture that Du Bois never discussed, and she claims that on her reading art is actually more autonomous, not less, because the political work is embedded in form rather than message.

  i don't want questions that just let her repeat the slogan and list examples. i need about eight questions that go into the mechanics: at least one on how this propagation differs from ordinary causal influence, one on whether a purely formal drone piece can really propagate a racialized framework with zero representational content, and one on why autonomy goes up instead of down if politics is already inside the form. for each, i want a follow-up tailored to the answer she's likeliest to give—she usually deflets by saying you're still treating politics as message, not as conditioning. so i need follow-ups that make that move harder to pull off. can you draft these? make them specific enough that she can't just recycle her usual talking points.
