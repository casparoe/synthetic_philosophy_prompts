answer: |-
  Your diagnosis is astute: **the core disagreement is both substantive and verbally obscured**, but the verbal confusion amplifies a deeper philosophical divergence. Here’s a concrete breakdown:

  ### 1. **Verbal Obscuration: "Standing" as a Homonym**
     - **Entitlement Camp**: Uses "standing" to mean *normative legitimacy*—the blamer must satisfy the norm they invoke to possess moral authority. Hypocrisy voids this by exposing a performative contradiction (e.g., the activist condemning flights while flying *exempts themselves* from the norm, undermining their right to enforce it).
     - **Efficacy Camp**: Uses "standing" to mean *pragmatic receptivity*—whether the blame is likely to be accepted by the target or community. Hypocrisy merely reduces persuasive force but doesn’t invalidate the blame’s truth (e.g., the physician’s smoking doesn’t falsify their advice against smoking).

     **Resolution**: Distinguish **normative standing** (entitlement to blame) from **pragmatic standing** (capacity to elicit uptake). Both sides agree hypocrisy damages pragmatic standing but clash over normative standing.

  ---

  ### 2. **Substantive Friction: The Nature of Blame and Authority**
  The **precise point of friction** lies in whether blame is fundamentally:
  - **An act of normative accountability** (Entitlement Camp):  
    Blame requires the blamer to *hold* the target accountable from a position of shared subjection to the norm. If the blamer violates the norm, they exit the "moral community" bound by it.  
    → *Activist case*: By flying, the activist implicitly denies the norm’s universal applicability, making their blame a coercive gesture rather than an appeal to shared values.  
    → *Partner case*: The unfaithful partner cannot demand fidelity because their own betrayal dissolves the reciprocal commitment that grounds the norm.  

  - **An assertion of moral truth** (Efficacy Camp):  
    Blame is a proposition about the target’s wrongdoing, justified solely by evidence and sincerity. Hypocrisy is an *ad hominem* distraction.  
    → *Physician case*: The doctor’s smoking doesn’t negate the truth that smoking harms health; their hypocrisy is a psychological/strategic flaw, not a normative one.  

  **The Irreducible Conflict**:  
  The Entitlement Camp sees hypocrisy as a **structural defeater**—it severs the blamer’s connection to the norm, making blame *internally inconsistent*.  
  The Efficacy Camp sees hypocrisy as a **pragmatic obstacle**—it doesn’t touch the blame’s validity, only its social impact.  

  ---

  ### 3. **Path to Progress**
  Resolving the impasse requires:
  #### A. **Conceptual Disambiguation**  
     - Adopt distinct terms:  
       - **Normative authority**: Whether hypocrisy voids the *right* to blame.  
       - **Pragmatic efficacy**: Whether hypocrisy hinders *acceptance* of blame.  
     - Map these to blame’s dual aspects:  
       - *Account-holding* (relational, authority-dependent)  
       - *Judgment-expression* (propositional, truth-dependent)  

  #### B. **Interrogate the "Shared Norm" Assumption**  
     The Entitlement Camp assumes norms exist *only* within a community of mutual accountability. Progress demands examining cases that strain this:  
     - Can a repentant hypocrite blame others (e.g., a former smoker who condemns smoking)?  
     - Does blame from an "outsider" (e.g., a non-polluter criticizing the activist) have more authority?  

  #### C. **Formalize Authority Conditions**  
     Develop a framework for when hypocrisy *defeats normative standing*:  
     - **Necessity**: Is non-hypocrisy *always* required, or only when the blamer’s violation is ongoing/egregious?  
     - **Specificity**: Does hypocrisy defeat standing only for *identical* violations (e.g., the partner’s infidelity), or similar ones?  

  #### D. **Reframe the Question**  
     Argue that the debate conflates **blame’s justification** (is the target wrong?) with its **illocutionary force** (does the act of blaming succeed?). Hypocrisy may nullify the latter without affecting the former.  

  ---

  ### Genuine Progress Would Look Like:  
  1. **A Formal Model of Moral Authority**  
     - Specify necessary/sufficient conditions for normative standing (e.g., commitment to the norm, non-complicity, repentance).  
     - Test against edge cases (e.g., "lesser hypocrites" blaming worse offenders).  

  2. **Empirical-Pragmatic Analysis**  
     - Study whether hypocrisy *actually* undermines blame’s social efficacy across contexts (e.g., public shaming vs. private rebuke).  

  3. **Meta-Ethical Grounding**  
     - Resolve whether moral norms require "first-personal consistency" (Entitlement view) or exist independently of blamers (Efficacy view).  

  **Ultimate Goal**: Show that **normative standing is conditional on the blamer’s relationship to the norm**, while **pragmatic standing is conditional on audience psychology**. The stalemate persists because both sides are half-right—but about different phenomena. Clarifying this could transform the debate from "Is hypocrisy relevant?" to "What *kind* of standing does hypocrisy undermine, and under what conditions?"  

  This reframes progress not as proving one camp victorious, but as building a taxonomy that accommodates both insights: hypocrisy *can* invalidate the moral gesture of blame while leaving its propositional content intact.
