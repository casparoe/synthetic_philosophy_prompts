     - Platitude? Yes.
     - Hidden linear-aggregation? No.

  2. **Kant's Contradiction-in-Conception:**
     - What it says: The act's maxim cannot be universalized without contradicting itself (e.g., false promises).
     - Does it apply? No, because leaving a light on doesn't undermine a necessary institution.
     - Defensible? In Kantian ethics, but not applicable here.
     - Platitude? No.
     - Hidden linear-aggregation? No.

  3. **Kant's Contradiction-in-Will:**
     - What it says: We couldn't rationally will a world where the maxim is universalized because it would undermine something we necessarily will (like a sustainable environment).
     - Does it apply? Unlikely, because the harm from universal light-leaving is indirect and speculative for a single act.
     - Defensible? In Kantian ethics, but stretchy here.
     - Platitude? No.
     - Hidden linear-aggregation? Implicitly (harm accumulates).

  4. **Empirical "Everything Breaks" Version:**
     - What it says: If everyone did it, the world would face disaster (energy crisis, etc.).
     - Does it apply? Overstated for one light. The harm from one instance is negligible, and universalization is unlikely. Ignores thresholds.
     - Defensible? Only if the harm is clear and present, which it isn't for one light.
     - Platitude? Yes.
     - Hidden linear-aggregation? Yes, it assumes harm adds up linearly without considering that one light is below the threshold of mattering.

  5. **Rule-Utilitarian Gloss:**
     - What it says: We should follow rules that, if generally followed, would maximize overall good. The rule of leaving lights on when convenient would lead to bad consequences if widely adopted.
     - Does it apply? Potentially, but the rule must be defined precisely, and the harm from a rare exception might be negligible.
     - Defensible? Yes, within utilitarianism.
