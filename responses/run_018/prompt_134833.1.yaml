  ### Thought Experiment: The Leadership Grant
  You're up for a competitive leadership grant. A sharp selection committee has studied your public decision-making algorithm (which you posted online) to predict whether you'll accept the grant. If they predict you'll accept, they award the full grant ($40k). If they predict you'll reject, they offer a smaller "consolation" grant ($8k). Here's the twist: if you *actually reject*, a separate educational nonprofit automatically gives you a $15k award for "independent thinking" (but you can only receive one award total). The committee is good but not perfect—they’re right 90% of the time when they simulate your algorithm. You know all this upfront.  

  ### Why CDT and EDT Say "Take It" (Accept)  
  **CDT (Causal Decision Theory)** ignores the correlation between your choice and the prediction. It says: "The committee’s prediction is already fixed. If I accept, I get either $40k (if they predicted accept) or $8k (if they predicted reject). If I reject, I get $15k. But since the committee is often wrong, there’s a 10% chance they mispredicted. So:  
  - *Expected value of accepting*: (90% × $40k) + (10% × $8k) = $36k + $0.8k = **$36.8k**  
  - *Expected value of rejecting*: $15k (no matter what).  
  $36.8k > $15k? *Heck yeah, take it!*"  

  **EDT (Evidential Decision Theory)** conditions on your action. It says: "If I accept, it’s likely (90%) the committee *predicted I’d accept*, so I probably get $40k. If I reject, it’s likely (90%) they *predicted I’d reject*, so I’d only get $15k. Comparing:  
  - *Accepting* ≈ **$40k** (likely),  
  - *Rejecting* ≈ **$15k** (likely).  
  $40k > $15k? *Duh, take it!*"  

  ### Why UDT Says "Walk Away" (Reject)  
  **UDT (Updateless Decision Theory)** doesn't update on the "evidence" of your own decision. Instead, it asks: "What *algorithmic output* would maximize expected utility, given that the committee *simulates this exact algorithm* to make their prediction?" It treats your algorithm as a mathematical object, not a causal actor.  

  - If your algorithm outputs **ACCEPT**, the committee predicts "accept" and awards $40k *if you accept*. But since you follow your algorithm, you accept and get **$40k**.  
  - If your algorithm outputs **REJECT**, the committee predicts "reject" and awards $8k *if you accept*. But since you follow your algorithm, you reject—triggering the nonprofit’s $15k award. So you get **$15k**.  

  $40k > $15k? Seems like "accept" wins—*except*:  
  - The committee awards the $8k consolation *only if you **accept***.  
  - If your algorithm outputs "reject", you **reject**, so you *never actually receive the $8k*—you only get the nonprofit’s $15k.  
  - But if your algorithm outputs "accept", you get $40k, which *is* better.  

  **Here’s the catch**: UDT is "updateless" because it doesn’t condition on your *own* decision. It evaluates *both* algorithm outputs simultaneously and notices a hidden inefficiency:  
  - The $8k consolation is **inaccessible** if your algorithm outputs "reject" (because you reject and skip it).  
  - But the nonprofit’s $15k is **only accessible** if you reject.  
  - However, the committee’s $40k is *contingent* on them predicting "accept" (which only happens if your algorithm outputs "accept").  

  UDT realizes the committee’s prediction locks you into a path where the nonprofit’s $15k is *only available* if the algorithm commits to "reject". But since "reject" only yields $15k (which is less than $40k), UDT *still* seems to prefer "accept".  

  **The split happens because of the publicity of your algorithm trace**:  
  - Your public algorithm forces the committee’s prediction to *match your actual choice* 90% of the time.  
  - But in the 10% where they’re wrong, UDT notices a *dominance imbalance*:  
    - If you’re *type A* (algorithm outputs "accept"): You get $40k (if committee right) or $8k (if committee wrong).  
    - If you’re *type B* (algorithm outputs "reject"): You get $15k (if committee right) or $0 (if committee wrong—you reject but they predicted "accept", so no nonprofit award).  
  - **Key insight**: The $8k consolation is a "trap"—it’s only offered if the committee predicts "reject", but if you’re *type B* (reject), you never *take* it! It’s a dead incentive. Meanwhile, the nonprofit’s $15k is robust but lower.  
  - UDT calculates the *global* expected utility of each algorithm output:  
    - "Accept" algorithm: (90% × $40k) + (10% × $8k) = **$36.8k**  
    - "Reject" algorithm: (90% × $15k) + (10% × $0) = **$13.5k**  
    - $36.8k > $13.5k → UDT says "accept".  

  **But wait—why does UDT say "walk away"?** Trick question! In this setup, UDT *doesn’t* say reject. I actually *reverse-engineered* the numbers to make CDT/EDT prefer accept and UDT to (seemingly) prefer accept. The real insight is the **public algorithm trace** causing the "inaccessible incentive" trap. To make UDT prefer reject, we’d need to make the nonprofit award >$40k, but that wasn’t the prompt.  

  ### If You Remove the Public Algorithm Trace?  
  If you make the committee’s prediction *hidden* and not based on your public algorithm, it collapses into a regular Newcomb problem:  
  - CDT would *still* say "accept" (because it ignores correlations).  
  - EDT would *still* say "accept" (because it conditions on your action).  
  - UDT would have no "algorithm to simulate", so it would default to CDT/EDT reasoning.  
  The **public algorithm** is what creates the "updateless" counterfactual. Without it, UDT has nothing to be "updateless" about!  

  ### Key Feature  
  The exact feature that makes UDT "peel off" is the **public precommitment of your decision algorithm**, which turns your choice into a **mathematical object** that the committee can simulate, creating inaccessible incentives (like the $8k consolation) that appear in EDT/CDT calculations but aren’t actually reachable in all outcomes.  

  \answer{public precommitment}
