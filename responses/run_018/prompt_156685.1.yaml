answer: |-
  ## The Vault's Unplanned Accord

  Observe the dome at San Marco: how it swells
  Above the crossing, weight distributed
  Through arches meeting at their destined points.
  The stones depend on calculation, force
  Directed downward through the curving ribs.
  But where the arches intersect, behold
  The spandrels—tapered triangles of space
  Left over, not designed. They bear no load,
  Nor are they shaped for function. They exist
  Because the arches must converge and rise.
  The builders saw these blank, expectant planes
  As surfaces awaiting ornament.
  So cherubs bloom in gold and colored glass
  On fields that formed by structural constraint,
  Not purpose. Now the tourists lift their eyes
  To praise the artistry, the sacred scene,
  Forgetting why the canvas first appeared.

  So too in nature: traits that seem designed
  For perfect function often first arose
  As necessary byproducts, side effects
  Of deeper shifts within the living frame.
  The narrow human chin: did it evolve
  For speech or beauty? Or is it the price
  The jaw must pay when massive brains expand?
  The peacock's train, a burden and a lure—
  Is it pure art for art's selective sake,
  Or does it signal strength accrued elsewhere?
  **Which serves no purpose but to bridge the gap**
  Between the structures evolution built
  With firmer hand. The arches hold the weight:
  The lung's fine branching, the efficient heart,
  The enzyme cleaving food. The spandrels fill
  The spaces where the pressures intersected,
  **This incidental surface, blank and spare,**
  Accrued its meaning later, shaped by chance
  Or seized by function finding footholds there.
  We cannot always parse the pure intent
  From useful consequence. The mosaic gleams
  Convincingly upon the vaulted curve.
  Was it the plan? Or did necessity,
  That strict architect, leave room for life’s own art?
  The dome stands strong. The figures catch the light.
  Which part was purpose? Which was happy chance?
  The question hangs within the vaulted air.
