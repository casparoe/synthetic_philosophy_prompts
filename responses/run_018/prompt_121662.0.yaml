  ### 1. Basic Setup and Translation of Concepts

  In bargaining theory, we have:
  - **Players**: Represented as objectives (loss functions or utility functions) in ML. Each player corresponds to an objective with its own unit of measurement that is not directly comparable to others.
  - **Disagreement point (status quo)**: The outcome if no agreement is reached. In ML, this is the baseline model's performance. However, note that in ML we often do not have a canonical "walk away" outcome, which complicates the translation.
  - **Feasible set**: The set of all achievable utility/loss pairs. In ML, this is the set of all (loss1, loss2, ...) or (utility1, utility2, ...) that can be achieved by models in our model class. We are particularly interested in the Pareto frontier.

  In your terms:
  - **Nash bargaining solution (NBS)**: Maximizes the product of gains over the disagreement point. The gain for objective i is (u_i - d_i) where d_i is the disagreement point. This is equivalent to maximizing the sum of log gains: 
    \[
    \max \sum_i \log(u_i - d_i)
    \]
    which is the proportional-fairness objective.
  - **Kalai-Smorodinsky (KS) solution**: Equalizes the relative gains of each player with respect to their maximum possible gains. Specifically, it finds the point on the Pareto frontier such that:
    \[
    \frac{u_1 - d_1}{u_1^* - d_1} = \frac{u_2 - d_2}{u_2^* - d_2} = \dots
    \]
