  **Kalai-Smorodinsky Axioms**:

  1. **Pareto Efficiency (PE)**: Same as Nash.

  2. **Individual Monotonicity (IM)**: If the feasible set expands in a way that benefits one player without harming the others (i.e., the ideal point for that player increases while others' ideal points do not decrease), then that player should not end up worse off. In ML: If we expand the model class so that we can improve one objective without hurting the others, then the solution should not assign a lower value to that objective.

