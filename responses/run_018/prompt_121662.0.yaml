answer: |-
  ### Core Translation: Bargaining Theory to ML Vocabulary
  **Players = Objectives**  
  Each "player" is an objective (e.g., accuracy, fairness gap, interpretability score) with **incomparable units**. The disagreement point (status quo) is your **baseline model's performance** (e.g., a simple model like logistic regression).

  **Feasible Set = Achievable Utility/Loss Pairs**  
  The set of all $(u_1, u_2, \dots, u_k)$ or $(l_1, l_2, \dots, l_k)$ achievable by models in your class. The Pareto frontier is the set of non-dominated points.

  **Axioms in Your Terms**  
  1. **Pareto Efficiency (Nash & KS)**:  
     - *Translation*: Your chosen model must lie on the **Pareto frontier** (no other model dominates it on all objectives).  
     - *ML Reality*: Enforced by scalarization (e.g., sweeping weights) or frontier-tracing methods.

  2. **Invariance to Affine Transformations (Nash & KS)**:  
     - *Translation*: Solution is unchanged if you **rescale or shift an objective** (e.g., converting accuracy from [0.7, 0.9] to [0, 1]).  
     - *ML Analogue*: Adam-like per-parameter normalization (invariance to gradient scale), but here applied to **objective units**.  
     - *Caveat*: Assumes objectives have **cardinal scales** (meaningful zero and unit). KS relies on this more heavily (see below).

  3. **Symmetry (Nash & KS)**:  
     - *Translation*: If objectives are identical and the feasible set is symmetric, the solution should assign equal weight to each.  
     - *ML Reality*: Rarely holds; objectives usually have different scales/importances.

  4. **Nash's IIA (Independence of Irrelevant Alternatives)**:  
     - *Translation*: If your chosen model is still feasible in a **smaller model class**, it remains the solution.  
     - *ML Gap*: You **never test counterfactual model classes**. You fix one class, train, and pick from it.

  5. **KS's Monotonicity**:  
     - *Translation*: If the feasible set expands **only in direction $i$** (e.g., you add models that improve objective $i$ without harming others), objective $i$ shouldn't get worse.  
     - *ML Gap*: You don't consider **expansions of your model class**. Fixed class = no monotonicity checks.

  **Solution Concepts**  
  - **Nash Solution** = Maximize $\prod (u_i - d_i)$ → **Proportional Fairness** (max sum $\log(u_i - d_i)$).  
    - *Requires*: Baseline $d_i$ (disagreement point). Fragile if $u_i - d_i \leq 0$.  
  - **KS Solution** = Equalize $\frac{u_i - d_i}{u_i^* - d_i}$ → **Min-Max Fairness** over normalized gains.  
    - *Requires*: Ideal point $u_i^*$ (best achievable for $i$ given others $\geq d_j$).  

  ---

  ### Residue Report: What Doesn't Translate  
  #### 1. **Counterfactual Feasible Sets (The Elephant in the Room)**  
     - **Axioms Demand**: Rules must hold across **hypothetical model classes** (e.g., "If class $\mathcal{M}_1$ gave solution $m^*$, and $m^* \in \mathcal{M}_2 \subset \mathcal{M}_1$, then $m^*$ must solve $\mathcal{M}_2$").  
     - **ML Reality**: You fix **one model class** (e.g., ResNet-50), train once, and pick from Pareto frontier on held-out data. No counterfactuals.  
     - **Consequence**: Nash's IIA and KS's monotonicity **have no meaning** in your workflow. They’re about consistency across classes, which you never test.  

  #### 2. **Disagreement Point ($d_i$) is Arbitrary**  
     - **Problem**: Bargaining theory assumes a natural "walk away" outcome. In ML, your baseline (e.g., random classifier) is **convention, not logic**.  
     - **Impact on Solutions**:  
       - *Nash*: Product $\prod (u_i - d_i)$ shifts with $d_i$. Poor baseline choice inflates/deflates gains.  
       - *KS*: Ratios $\frac{u_i - d_i}{u_i^* - d_i}$ depend entirely on $d_i$.  
     - **Worse for Ad-Hoc Objectives**: For metrics like "interpretability scores" with **no natural zero/unit**, $d_i$ is doubly arbitrary.  

  #### 3. **KS Requires Cardinal Scales**  
     - **Problem**: KS ratios $\frac{u_i - d_i}{u_i^* - d_i}$ require **meaningful intervals** between $d_i$, $u_i$, and $u_i^*$.  
     - **ML Cases**:  
       - *Safe*: Accuracy (meaningful 0–100% scale).  
       - *Unsafe*: "Fairness gaps" or custom scores where affine transformations are arbitrary.  
     - **Consequence**: KS loses meaning if objectives lack cardinal scales. Nash only requires ordinal comparisons (but product math assumes cardinality).  

  #### 4. **Non-Convex Frontiers Break KS (Your Example)**  
     - **Setup**:  
       - Feasible gains: $0 \leq g_1, g_2 \leq 10$, with $(g_1 \leq 4 \lor g_2 \leq 4)$.  
       - Pareto frontier: Segments $(10,4)$–$(4,4)$ and $(4,4)$–$(4,10)$.  
       - Ideal point: $(10,10)$.  
     - **KS Failure**:  
       - Line from $(0,0)$ to $(10,10)$ hits $(4,4)$ first.  
       - But $(4,4)$ is **Pareto-dominated** (e.g., by $(10,4)$).  
       - *Violates Pareto axiom*: KS selects an inefficient point.  
     - **Repair Cost**:  
       - Fix: Use **maximin ratios**: $\max \min_i \frac{g_i}{g_i^*}$ , then take Pareto point achieving this.  
       - In your case: $\min(g_1/10, g_2/10) \leq 0.4$ everywhere. Points $(10,4)$ and $(4,10)$ achieve $\min=0.4$ and are efficient.  
       - **Cost**: You lose KS's geometric intuition (straight-line intersection).  

  #### 5. **Statistical Fragility: KS vs. Nash**  
     - **Ideal Point Estimation**: KS requires $u_i^* = \max\{u_i\}$ over the frontier.  
       - With finite held-out data, $\hat u_i^*$ is **upward-biased** (overestimated).  
       - Result: Ratios $\frac{u_i - d_i}{\hat u_i^* - d_i}$ are **downward-biased** → favors objectives with noisy $u_i^*$.  
     - **Nash Advantage**: Only needs $d_i$ and feasible points (no extreme values).  
       - **Empirical Verdict**: KS is **strictly more fragile** in low-data regimes due to ideal point bias.  

  ---

  ### Verdict: What’s Missing in ML vs. Econ Convention  
  1. **Genuine Gaps in ML Vocabulary**:  
     - **No Counterfactuals**: ML lacks tools to reason about "what if my model class changed?"  
     - **Arbitrary Baselines**: $d_i$ is chosen ad hoc, weakening Nash/KS legitimacy.  
     - **Non-Cardinal Objectives**: KS is ill-defined for ad-hoc metrics without meaningful scales.  

  2. **Econ Debate Isn't "Just Convention"**:  
     - Nash and KS encode **fundamental fairness principles** (proportional vs. equal relative gains).  
     - But axioms assume **convexity and counterfactual model classes**—unrealistic in ML.  
     - **Thin Spot**: Economists often hide these assumptions. Your flatmate’s "axiom swap" ignores how **convexity and $d_i$ sensitivity dominate practical differences**.  

  3. **Your Non-Convex Example Highlights the Real Issue**:  
     - KS breaks without convexity; Nash gives asymmetric solutions in symmetric problems.  
     - **Root Cause**: Both solutions assume convex feasible sets. In non-convex ML:  
       - Use **maximin ratios** (repaired KS) or **Nash with tiebreaking**.  
       - **Tiebreak Suggestion**: Among max-Nash-product points, pick one maximizing $\sum g_i$.  

  ### Bottom Line  
  Bargaining theory **doesn’t cleanly translate** to multi-objective ML because:  
  1. ML fixes the model class (no counterfactuals),  
  2. Objectives lack natural baselines/scales, and  
  3. Non-convex frontiers are common.  
  **Practical Advice**: Use Nash (proportional fairness) with careful baseline choice, or repaired KS (maximin ratios) for min-max fairness. But drop the axioms—they’re ghosts from a different world.
