prompt: |-
  In two weeks I'm leading a one-hour session of a reading group of software engineers — no philosophy background, but comfortable with formal logic — on epistemicism versus supervaluationism as rival theories of vagueness. Plan the explanation rather than delivering it. Specify: (1) the order in which the components must be introduced — the sorites paradox, the tolerance intuition that one grain or one hair cannot make the difference, the epistemicist's sharp but unknowable cutoff, and the supervaluationist's apparatus of precisifications and supertruth — and why each step depends on the one before it, so that both theories emerge as motivated responses to a real contradiction rather than as arbitrary technical stipulations; (2) the single carrying example to run the whole session on, and what properties it must have and lack so that neither theory looks obviously absurd when applied to it; (3) the misconceptions this particular audience will predictably bring — that vagueness is just measurement imprecision, that fuzzy logic with degrees of truth dissolves the problem, that the epistemicist is claiming we could locate the cutoff with better instruments, and that supervaluationism is merely three-valued logic — and the exact point in the sequence where each should be headed off rather than allowed to harden; (4) the check for understanding that would show the distinction between the two theories has landed, not just the vocabulary; and (5) what I should openly decline to cover at this level (for instance, higher-order vagueness) and how to defer it without appearing to hand-wave. At most 600 words.
reasoning: |-
  Okay, the user is preparing a session on epistemicism vs. supervaluationism for software engineers. They need a structured plan that makes these theories feel like natural responses to the sorites paradox, not arbitrary concepts. 

  First, I should map the logical dependencies: The session must start with the sorites paradox because it's the concrete puzzle that forces the dilemma. Then introduce tolerance (why sorites feels compelling), which leads to the contradiction demanding resolution. Only then present epistemicism/supervaluationism as solutions—otherwise they'll seem unmotivated.

  For the example, "heap" is ideal but needs tweaking to avoid absurdity in both theories. "Visible star" works better: epistemicism's unknowable cutoff (exact photon count) feels plausible, while supervaluation's precisifications (different visibility thresholds) align with scientific practice. Must explicitly reject astronomy-specific factors though—focus solely on vagueness.

  The audience will bring four key misconceptions:
  - Vagueness ≠ measurement error (clarify during tolerance discussion)
  - Fuzzy logic doesn't solve sorites (preempt when introducing theories)
  - Epistemicism isn't about better instruments (stress during cutoff explanation)
  - Supervaluation ≠ three-valued logic (contrast when defining supertruth)

  Understanding check: Ask them to re-explain "why tolerance fails" in each theory. Correct answers: Epistemicism—cutoff exists but can't be known; Supervaluation—tolerance fails in precisifications but not globally. If they parrot vocabulary without this, reteach.

  Defer higher-order vagueness by framing it as "meta-vagueness about precisifications" and table it as graduate-level. Offer a concrete analogy: "Like vagueness in defining 'standard visibility criteria'." Software engineers will respect scoped problems.

  ...noting their emphasis on making theories feel necessary, not just technical. Their hidden worry is probably that philosophers invent complexity—so I'll show how sorites *forces* these solutions. Also their note about "not hand-waving" deferrals suggests this crowd hates dismissiveness—hence offering the "standard criteria" analogy as a placeholder.
answer: |-
  Here's your session plan, structured for clarity and motivation:

  **1. Order of Components & Dependencies:**  
  **(Why:** Each step must reveal a problem the next must solve.)  
  - **Start with the Sorites Paradox** (e.g., "Is 1 grain a heap? No. Is 2? No. ... Is 10,000? Yes. Where's the cutoff?"). *Dependency:* This is the concrete puzzle that demands explanation.  
  - **Identify Tolerance Intuition** ("Removing one grain never turns a heap into a non-heap"). *Dependency:* Explains why Sorites feels compelling and creates contradiction with classical logic (if no cutoff exists).  
  - **Reveal the Contradiction:** Tolerance + classical logic (small changes preserve truth) + clear endpoints (0 grains not heap, 10k grains heap) → logical explosion (0 grains = heap). *Dependency:* Forces us to reject one premise. Both theories reject tolerance but in different ways.  
  - **Introduce Epistemicism:** Rejects tolerance; claims a **sharp cutoff exists** (e.g., exactly 1,532 grains make a heap) but is **unknowable** due to semantic indeterminacy. *Dependency:* Directly solves the contradiction by denying tolerance, but the unknowability answers "Why can't we find the cutoff?"  
  - **Introduce Supervaluationism:** Rejects tolerance; claims **no single cutoff** exists. Defines truth via **precisifications** (complete, consistent sharpenings, e.g., one where cutoff=1,500, another=1,600). **Supertruth** = true on all precisifications. *Dependency:* Solves the contradiction differently (denies tolerance *in each precisification*), while explaining vagueness via multiple admissible boundaries.  

  **2. Carrying Example:**  
  **"Visible star"** (naked-eye visibility in a clear desert sky at midnight).  
  - **Why it works:**  
    - Has clear endpoints (Venus = visible; Proxima Centauri = not visible).  
    - Tolerates small changes (adding/removing a few photons).  
    - Epistemicism’s unknowable cutoff (exact photon flux threshold) seems plausible (not absurd like "heap=1,532 grains").  
    - Supervaluationism’s precisifications (different reasonable visibility thresholds) align with scientific practice (e.g., varying magnitude limits).  
    - *Avoids:* Culturally loaded terms ("rich"), subjective sensations ("pain"), or continuous spectra (color).  

  **3. Misconceptions & Preemptive Strikes:**  
  - **"Vagueness = Measurement Imprecision"** (e.g., "We just need better photon detectors"). *Head off:* When introducing tolerance. Clarify vagueness is about *meaning* (what "visible" *means*), not measurement.  
  - **"Fuzzy Logic Solves This"** (degrees of truth). *Head off:* After presenting the contradiction. State: "Even with degrees, where does 0.5 truth start? Sorites recurses." Defer details.  
  - **"Epistemicism: Better Instruments Find Cutoff"** *Head off:* When explaining unknowability. Stress: It’s *conceptually* unknowable, not empirically. Better instruments won’t help.  
  - **"Supervaluationism = Three-Valued Logic"** *Head off:* When defining supertruth. Contrast: "Supertrue" vs. "true in some precisifications" (not a third value; it’s truth relative to sharpenings).  

  **4. Check for Understanding:**  
  **Ask:** "Why does the tolerance principle ('one grain can’t make a difference') fail according to each theory?"  
  - **Correct Epistemicist Answer:** "It fails because there *is* a precise cutoff; we just can’t know where it is."  
  - **Correct Supervaluationist Answer:** "It fails *within* any precisification (each has a cutoff), but *supertruth* isn’t tolerant because borderline cases vary across precisifications."  
  *(If answers only name theories or repeat jargon, reteach.)*  

  **5. Deferred Content:**  
  - **Higher-Order Vagueness:** "We’re focusing on the first-order problem (where ‘heap’ starts). There’s a deeper question: ‘Is the boundary between heap/non-heap *itself* vague?’ That’s crucial but grad-school-level. For now, assume our theories handle first-order boundaries."  
  - **Other Theories (Fuzzy Logic, Contextualism):** "Many approaches exist. We’re comparing the two most influential *classical* solutions. Others trade different costs."  
  *(Frame deferrals as scoping, not evasion: "This is complex enough for one hour; these are natural next questions.")*  

  **Session Flow in Brief:** Sorites (5 min) → Tolerance & Contradiction (10 min) → Epistemicism (15 min) → Supervaluationism (15 min) → Comparison/Check (10 min) → Deferrals/Q&A (5 min). Use "visible star" throughout.
