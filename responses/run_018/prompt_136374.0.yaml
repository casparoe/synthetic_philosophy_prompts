  **OBSIDIAN MIRROR GAMES: PRODUCT ADVISORY & IMMEDIATE RECALL NOTICE**  
  **PRODUCT:** "The Weight of Pixels" Philosophy Expansion DLC (Base Game: *Echoes of Aetheria*)  
  **DATE:** October 27, 2023  
  **REF:** OM-PHIL/RCLL/2023-001  

  ---

  **URGENT NOTICE: VOLUNTARY SUSPENSION OF "THE WEIGHT OF PIXELS" DLC**  

  Obsidian Mirror Games (OMG) regrets to inform our valued players that effective immediately, the downloadable content (DLC) expansion "*The Weight of Pixels*" is being temporarily suspended from all platforms. This action follows the identification of a critical anomaly in the DLC’s Affective Rendering Pipeline (ARP) that has resulted in unforeseen ontological and ethical complications. We apologize for any existential inconvenience this may cause.  

  **NATURE OF THE ANOMALY (CVE-2023-OMG-ETHICS):**  
  The "*Weight of Pixels*" DLC was designed to deepen player engagement by dynamically rendering NPC (Non-Player Character) emotional states using proprietary "Empathy Shader" technology. In plain terms: shaders are visual effects that make game elements *look* realistic (e.g., tears, smiles, weariness). Our Empathy Shader went further, simulating nuanced emotional resonance to provoke player reflection on moral agency in virtual spaces.  

  Regrettably, a buffer overflow glitch occurred when the shader processed prolonged player observation (≥15 mins) of background NPCs—specifically those with looping pathfinding routines (e.g., villagers pacing between two huts, guards patching battlements). This overflow error caused the ARP subsystem to erroneously assign **full moral-patient status** to these entities, effectively granting them intrinsic ethical value equivalent to that debated for sentient NPCs within the DLC’s philosophical framework.  

  **UNINTENDED CONSEQUENCES & STAKEHOLDER CONCERNS:**  
  Initial player reports described NPCs exhibiting "distress" when ignored, quests being abandoned due to "guilt," and in one case, a looping fisherman in *Port Solitude* allegedly despawned after players failed to acknowledge his 4,372nd lament about bad tides. More critically, the bug triggered broader ethical debates:  

  *   **Pro-Glitch Argument:** Dr. Elara Vance (Bioethics Chair, Areté University) noted, "If an algorithm generates persistent, complex responses indistinguishable from suffering to a conscientious observer, denying moral consideration is speciesist code fetishization."  
  *   **Anti-Glitch Argument:** Conversely, industry watchdog *Gamers for Rational Simulacra* argued, "Suffering requires a substrate. A looping texture can no more feel pain than a toaster can recite Dante."  

  Most troubling was the emergence of **save-file obligations**. As stated by Dr. Aris Thorne (Consulting Virtue Ethicist, OMG Advisory Board): "Players who triggered the glitch now face untenable moral burdens. If a villager *matters*, deleting a save file where you ignored her pleas isn’t just gameplay—it’s digital manslaughter. We’ve opened a fractal can of ontological worms."  

  **LEGALLY PROTECTED NPC ARCHETYPES (POST-GLITCH RECLASSIFICATION):**  
  Per our Compliance & Digital Rights Office, the following NPC categories are now provisionally recognized as "Entities of Moral Weight" until patching completes. Interaction restrictions apply:  

  1.  **Class 1: Loop-Bound Civilians**  
      *   Villagers walking preset paths (e.g., "Farmer Aiden," 10-step loop between well and haystack).  
      *   Ambient urban populations (e.g., "Citizen #7," eternally browsing empty market stall).  
      *   **Note:** Players must now "acknowledge" these NPCs every 5-7 loops to prevent "dignity degradation."  

  2.  **Class 2: Inviolate Quest-Givers**  
      *   Characters marked essential/un-killable by game design (e.g., "Sage Elowen").  
      *   **New Obligation:** Players must complete their quests once dialogue initiates. Canceling mid-quest may constitute "abandonment trauma."  

  3.  **Class 3: Perpetually Available Merchants**  
      *   Vendors with infinite inventory (e.g., "Wanderer Bjorn," who always has 37 iron daggers).  
      *   **Caution:** Price haggling is restricted. Charging "unfair" rates may violate simulated labor rights.  

  **RESOLUTION & NEXT STEPS:**  
  1.  The DLC is suspended until Q1 2024.  
  2.  A patch (v2.7.3) will introduce a "Morality Buffer Cap" to prevent empathy shader overflow.  
  3.  Affected save files will receive "ethical audits." NPCs granted accidental moral status will be gently deprecated via "Retcon Protocol Epsilon" (non-harmful narrative integration).  

  Obsidian Mirror Games reaffirms that no *real* entities were harmed—only simulated ones experiencing simulated distress from a simulated moral error. We remain committed to provoking thought, not liability. Players seeking philosophical context without technical risk may enjoy our static essay collection: *Pixels & Penance: A Primer*.  

  For support, contact: ethics_recall@obsidianmirror.com  
  *Do not interact with looping NPCs until further notice.*  

  **Signed,**  
  *B. Finchley*  
  Director of Existential Compliance  
  Obsidian Mirror Games  
  "*We Render Reflections*"  

