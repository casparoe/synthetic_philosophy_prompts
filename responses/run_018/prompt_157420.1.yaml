prompt: |-
  I'm a phd student in aesthetics and i'm running a session next week for an undergrad/grad reading group on Du Bois's propaganda thesis—specifcally the claim in Criteria of Negro Art that all art is propoganda and Black artists shouldn't chase 'art for art's sake.' The audience has mostly read Souls of Black Folk but not the Criteria essay, so they know the sorrow songs but not his polemical framing. Don't explain the thesis to me; plan how I should teach it.

  What order do the pieces have to go in so they don't just hear 'propaganda = bad Soviet posters'? What's the one concrete example—probably one of the sorrow songs or maybe a reference to a specific visual work—that should carry the whole session, and what must it have (beauty + political work visible at once) and lack (pure didacticism without aesthetic form)?

  I'm expecting they form at least three misconceptions: that Du Bois rejects beauty for politics, that he means propaganda in teh modern manipulative sense, and that he's just saying Black art should be political like a billboard. Where exactly in the sequence do I head each one off?

  Also I want to sit them with a gap he never resolves: he distinguishes propaganda for justice from propaganda for evil but never gives the criterion, and I think the best teaching moment is letting them feel that absence rather than papering over it. So what's the dependency chain—what idea has to land before they can even see the gap? What's a check question at the end that shows whether they understand the collapse of beauty and propaganda rather than just parroting the thesis? And what should I openly refuse to cover—maybe the Black Arts Movement comparison, or the full history of 'art for art's sake'—and say so?

  Plan it out: the sequence with dependencies, the carrying example and its design specs, the misconception map with deflection points, the check, and the explicit omissions.
reasoning: |-
  Okay, the user is a PhD student in aesthetics preparing a reading group session on Du Bois's propaganda thesis from "Criteria of Negro Art." They need a teaching plan that avoids common misconceptions and highlights key tensions. Let me break down their requirements.

  First, they want a sequence that prevents students from equating propaganda with simplistic or manipulative messaging like Soviet posters. The audience has read *Souls of Black Folk* but not the *Criteria* essay, so they're familiar with the sorrow songs but not Du Bois's explicit arguments on art. The user also wants a concrete example that combines beauty and political work without being didactic. Which sorrow song would work best? "Swing Low, Sweet Chariot" comes to mind because it has layered meanings—spiritual yearning intertwined with coded messages of escape from slavery. This example must show aesthetic richness while carrying political weight, avoiding blunt messaging.

  Next, addressing misconceptions: The user expects three main misunderstandings. First, that Du Bois rejects beauty for politics. This needs to be countered early by emphasizing his demand for "all Beauty" alongside truth and righteousness. Second, the modern negative connotation of propaganda. Here, I should reframe it as truthful witnessing versus manipulation. Third, reducing propaganda to billboard-like didacticism. The sorrow song example can show subtlety here. The deflection points should be integrated into the sequence: after introducing the thesis, when discussing the example, and when contrasting with art-for-art's-sake.

  The user also wants to highlight an unresolved gap: Du Bois distinguishes propaganda for justice vs. evil without providing criteria. To make this palpable, students need to first grasp his synthesis of beauty and propaganda. Only then will the absence of a clear criterion become evident. A check question like "How does Du Bois's propaganda differ from manipulative messaging?" can assess their understanding of the fusion, not just parroting the thesis.

  Explicit omissions include avoiding deep dives into the Black Arts Movement or the full history of art-for-art's-sake. The session should focus on Du Bois's text to maintain depth. Timing is tight, so sticking to the core argument is crucial.

  Structuring the sequence: Start with anchoring in *Souls* to connect known material. Then introduce the propaganda thesis with key quotes, immediately preempting the beauty misconception. Use "Swing Low" as the carrying example to demonstrate the fusion. Contrast with art-for-art's-sake to further clarify. Finally, present the unresolved justice criterion gap, using the check question to confirm comprehension. Each step builds on the previous, ensuring dependencies are met before introducing complexities.
answer: |-
  Here's a structured teaching plan focusing on sequencing, misconception management, leveraging a core example, highlighting the unresolved gap, and setting boundaries:

  **Core Goal:** Move students from a simplistic "propaganda = manipulation/didacticism" understanding to grasping Du Bois's radical fusion of *aesthetic excellence* and *inescapable political function* within the context of anti-Black racism.

  **Carrying Example:** "**Swing Low, Sweet Chariot**" (Sorrow Song)
  *   **Why this?** Familiar from *Souls*, rich aesthetic layers, undeniable political resonance born of specific context.
  *   **What it MUST Show (Fusion):**
      1.  **Beauty/Form:** Haunting melody, powerful metaphor ("chariot"), complex emotional range (longing, hope, faith, weariness), sophisticated call-and-response tradition, enduring artistic power transcending origin.
      2.  **Political Work/Propaganda:** Coded language for escape/salvation ("Swing low... comin' for to carry me home"), assertion of humanity/faith amidst dehumanization, communal expression of resistance to bondage, documentation of Black experience & aspiration. *It functioned as propaganda for freedom and dignity by witnessing truth beautifully.*
  *   **What it MUST Lack (Avoiding Caricature):** No simplistic, explicit slogan ("Down with Slavery!"), no crude imagery. The politics are *emergent* from the form and context, deeply embedded, not pasted on.

  **Sequence & Dependencies (90 mins approx.):**

  1.  **Anchor in the Known: *Souls* & Sorrow Songs (10 mins)**
      *   **Activity:** Quick recall of Du Bois's treatment of Sorrow Songs in *Souls*. What did he argue they *were*? (e.g., profound art, expression of the Black soul, historical record, unique American contribution).
      *   **Dependency:** Establishes Du Bois's deep respect for Black artistic expression as *art*. Crucial for preventing Misconception #1.
      *   **Link:** "Today, we see him extend this argument into a more radical and polemical theory about *all* art."

  2.  **Introduce the Polemic: Core Thesis & Immediate Nuance (15 mins)**
      *   **Activity:** Close reading of key passages from "Criteria":
          *   "Thus all Art is propaganda and ever must be..."
          *   "I do not care a damn for any art that is not used for propaganda."
          *   **CRITICAL:** "...until the art of the black folk compels recognition they will not be rated as human. And the ultimate end is not **beauty** but **right** and **wrong**, **humanity**, **justice**." (Emphasize "beauty" is *present* alongside justice/truth).
          *   "I stand in utter shamelessness and say that whatever art I have for writing has been used always for propaganda for gaining the right of black folk to love and enjoy. **I do not care a damn for any art that is not used for propaganda. BUT I do care when propaganda is confined to one side while the other is stripped and silent.**"
      *   **Dependency:** Sets up the core claim and **immediately** pre-empts Misconception #1 by stressing his demand for *beauty* ("all Beauty" is listed) and his own artistic practice. Introduce his specific definition: Propaganda as *breaking enforced silence* and *advocating for justice/humanity*.
      *   **Deflection Point (Misconception #1 - Beauty Rejection):** Hammer home the quotes mentioning "beauty" and his own artistic pride. Ask: "Is he rejecting beauty, or demanding it serve a crucial purpose?"

  3.  **Deepen with the Example: "Swing Low" as Propaganda-in-Action (20 mins)**
      *   **Activity:** Analyze "Swing Low" through both lenses.
          *   *Aesthetic:* Listen (briefly), discuss musicality, metaphor, emotional depth, structure.
          *   *Propaganda:* Discuss historical context (slavery), coded meaning ("home" = freedom/North/Heaven?), function as communal resistance, assertion of faith/humanity against dehumanization, its role as *witness* and *argument* for dignity.
      *   **Key Question:** "Does the song's *power* as propaganda *depend* on its beauty and complexity? Could a blunt, ugly slogan about escaping slavery have had the same enduring cultural and political force?" (Points to fusion).
      *   **Dependency:** Concrete demonstration of the fusion. Shows propaganda ≠ crude didacticism.
      *   **Deflection Point (Misconception #3 - Billboards):** Contrast the subtlety, layered meaning, and aesthetic power of the song with a hypothetical explicit, simplistic abolitionist slogan. "Is Du Bois calling for *this* kind of directness? Or something deeper woven into the artistic fabric?"

  4.  **Contrast & Define: Attacking "Art for Art's Sake" (15 mins)**
      *   **Activity:** Read Du Bois's critique: "The apostle of Beauty thus becomes the apostle of Truth and Right not by choice but by inner and outer compulsion. Free he is but his freedom is ever bounded by Truth and Justice... Thus all Art is propaganda..."
      *   **Discussion:** Why does he reject "art for art's sake" *specifically for Black artists* in this context? (The "outer compulsion" of racism; the "bounding" by the need for justice; the impossibility of neutrality when humanity is denied). Connect back to "Swing Low" – could it exist as *just* beautiful sound in that context?
      *   **Dependency:** Clarifies the target of his polemic and the *reason* for his stance (the political reality). Prepares for the gap.
      *   **Deflection Point (Misconception #2 - Modern Manipulation):** Explicitly state: Du Bois's "propaganda" is *NOT* about deception or manipulation aimed at *denying* truth. It's about *revealing* truth (Black humanity, the reality of racism) and *advocating* for justice through art's compelling power. It's propaganda *against* the dominant, dehumanizing propaganda.

  5.  **Introduce the Gap: Justice vs. Evil Propaganda (15 mins)**
      *   **Activity:** Highlight Du Bois's assertion: "But I do care when propaganda is confined to one side while the other is stripped and silent." and his belief art *must* serve "Truth," "Right," "Justice," "Humanity."
      *   **Key Question:** "Du Bois clearly distinguishes propaganda *for* justice (Black artists breaking silence) from propaganda *for* evil (white supremacy stripping Black humanity). But *how* do we know which is which? What is his *criterion* for distinguishing good propaganda from bad? Does he give us a clear, artistic measure beyond the *goal* (justice vs. injustice)?"
      *   **Dependency:** Students MUST grasp his fusion of beauty/politics *and* his moral stance (Justice/Truth as the goal) *before* this gap becomes visible and meaningful. The gap is the *lack of an aesthetic or procedural criterion* for defining "Truth/Justice" *within art itself* beyond the intended political goal.
      *   **Teaching Moment:** Let the discomfort sit. "This is a profound tension Du Bois leaves unresolved. How *does* art know it's serving Truth and not just another ideology? Is the criterion purely external (the cause)? Can beautiful art serve evil ends? Does the fusion hold if the 'justice' is contested?"

  6.  **Synthesis & Check Question (10 mins)**
      *   **Synthesis:** Recap the journey: From Sorrow Songs as art -> Du Bois's radical claim (All art is propaganda) -> Nuance (Beauty is essential) -> Example showing fusion ("Swing Low") -> Rejection of neutrality ("Art for Art's Sake") -> The unresolved question of the criterion for *just* propaganda.
      *   **The Check Question (Assessing Fusion Understanding):** **"According to Du Bois, does creating effective propaganda for justice *require* the artist to sacrifice aesthetic excellence or beauty? Why or why not, specifically using his argument and our example?"**
          *   *Correct Understanding:* No, sacrifice is not required; aesthetic excellence *is essential* for the propaganda to be compelling, enduring, and truly effective in witnessing humanity and advocating for justice. "Swing Low" works *because* it's beautiful, embedding its message deeply. Du Bois demands the highest art *for* propaganda.
          *   *Misconception Alert (Parroting/Sacrifice):* If answer focuses *only* on the necessity of politics or implies beauty is secondary/optional, they've missed the fusion. If they say "No" but can't explain *why* using beauty's role in effectiveness, they haven't fully grasped it.

  **Explicit Omissions & Why (State upfront & reiterate):**

  1.  **Deep Dive into "Art for Art's Sake" History:** "We're taking Du Bois's characterization of it as a stance of neutrality/aesthetic purity at face value for today's purposes, to focus on *his* argument. We won't trace its full philosophical history or defenses." (Keeps focus on Du Bois's polemic).
  2.  **Direct Comparison to Black Arts Movement (BAM):** "While BAM is often seen as inheriting Du Bois's mantle, their methods, context, and specific arguments (e.g., overt separatism, different definitions of 'propaganda') differ significantly. We won't make that comparison today to avoid oversimplifying either Du Bois or BAM." (Prevents conflating distinct movements, maintains focus on primary text).
  3.  **Comprehensive Definition of Propaganda:** "We're working strictly within Du Bois's specific definition and use of the term in this essay – as art compelled to speak truth to power and advocate for justice in the face of oppression and silencing. We won't engage with all the broader, often negative, connotations of the word in other contexts." (Prevents semantic tangents, maintains focus on his argument).

  **Misconception Map & Deflection Points Summary:**

  *   **#1: Rejects Beauty for Politics.**
      *   *Deflection Point:* Step 2 (Initial Quotes - "all Beauty"), Step 3 (Analysis of "Swing Low"'s beauty), Step 6 (Check Question).
      *   *Strategy:* Constantly pair "Beauty" with "Truth/Right" in quotes; use the Sorrow Songs as exemplars of beauty *doing* political work.
  *   **#2: Propaganda = Modern Manipulative Sense.**
      *   *Deflection Point:* Step 4 (Contrasting with "Art for Art's Sake"), explicitly stated in Step 4 discussion.
      *   *Strategy:* Frame Du Bois's propaganda as *counter-propaganda* against white supremacy, focused on revealing truth and humanity. Contrast with deception.
  *   **#3: Propaganda = Didactic Billboards.**
      *   *Deflection Point:* Step 3 (Analysis of "Swing Low"'s subtlety and fusion), contrast with crude hypotheticals during this step.
      *   *Strategy:* Demonstrate how the political work is *inherent* in the form and context of the complex artwork, not an added slogan.

  This sequence builds logically, uses a powerful concrete example meeting the necessary specs, addresses misconceptions at the point where they are most likely to arise, highlights the crucial unresolved tension effectively, provides a clear check for understanding the core fusion, and sets manageable boundaries for the session. Good luck!
