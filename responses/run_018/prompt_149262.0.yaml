prompt: |-
  For my seminar in evolutionary theory and its philosophical critics, I want to apply the Gould-Lewontin spandrels framework to a contemporary scientific controversy rather than to the classic anatomical examples. Please analyze the 2012 ENCODE Project publications and the subsequent rebuttal led by evolutionary biologists such as Dan Graur—specifically, the dispute over whether biochemical activity across most of the human genome indicates widespread adaptive function—through the lens of the spandrels critique. I need a disciplined conceptual mapping: identify who or what occupies the role of the Panglossian adaptationist in this episode, what serves as the putative adaptation versus the spandrel, and what counts as the architectural constraint that produces the spandrel in the genomic context. Then evaluate where the spandrels framework genuinely explains the dynamics of the controversy—particularly the gap between detecting biochemical activity and demonstrating that a sequence was selected for that activity—and where it is silent or strained, for example in accommodating ENCODE's operational definition of function or in handling cases of exaptation where a spandrel acquires a secondary adaptive role. Finally, assess what this episode reveals about the spandrels critique itself: does the vehemence of the evolutionary biologists' backlash confirm that adaptationism remains the default explanatory posture in molecular biology, or does the fact that both sides invoke evolutionary reasoning show that the adaptation-versus-spandrel dichotomy was never the right axis for this dispute? Do not summarize the basic Gould-Lewontin argument from scratch; assume familiarity with spandrels, exaptation, and the Panglossian paradigm. I do not want citations, reading lists, or bibliographic references—this should stand as a self-contained analysis for my course notes.
