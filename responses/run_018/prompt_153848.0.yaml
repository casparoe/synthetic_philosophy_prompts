prompt: |-
  I was arguing with my freind about war ethics after we watched some youtube explainer, and he summed up this thing called just war theory and the moral equality of combatants like this: "The basic idea is that soldiers on both sides are moral equals, so they both have the same right to kill eachother, even if one side started the war for totally unjust reasons. This comes from Walzer, who compares it to a boxing match where both fighters agreed to enter the ring, so they forfeit their right not to be hit but only against the other fighter, not random civilians. By putting on a uniform you basically sign onto this agreement, which is why civilians stay protected but soldiers can target one another. But he also said this equality depends on both sides following rules about visible weapons and declared wars, and if one side breaks that by using hidden bombs or not wearing uniforms then the equality is broken and they become like criminals instead of soldiers. And then he added that if you get drafted into an unjust war and refuse to go, you should actually be punished for breaking the contract you signed when you enlisted, because the equality view means you already agreed to accept the risk."

  Something about that feels off to me, especially the part about being punished for refusing, but I dont know enough philosophy to say exactly where the summary went wrong. Is this a fair account of what Walzer and the standard view actually claim? Can you go through it and tell me which parts are accurate descriptions, which are common simplifications that miss important nuance, and which parts are just misrepresentations? Specifically, does the moral equality view really imply that refusing to fight in an unjust war is a breach of contract that deserves punishment? And is the idea about hidden weapons breaking the equality actually part of Walzer's argument about combatants, or is it mixing in something else from international law?
