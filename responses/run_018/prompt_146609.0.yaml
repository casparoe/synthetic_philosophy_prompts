answer: |-
  Here's a taxonomy tree for your seminar handout – drafted as messy, thought-provoking working notes. We'll use the Benin Bronzes (BB) and Parthenon Marbles (PM) as touchstones, but the focus is on the branching logic of arguments.

  **Colonial Restitution Taxonomy Tree (Working Draft)**

  **ROOT QUESTION: Is restitution (returning the object) the default moral imperative?**

  *   **SPLIT 1: Does murky or missing provenance block the moral claim for restitution?**
      *   **YES (Provenance Blocks Claim):** If we can't prove *exactly* how/when it was taken, especially if it *might* have been acquired legally (even under unequal power), the claim weakens or vanishes. *Think: Some early BB acquisitions argued as "trade," gaps in PM Ottoman-era removal records.*
          *   **SPLIT 2: Does cultural continuity matter more than legal ownership?**
              *   **YES (Continuity > Ownership):** *Leaf: **Provenance Skeptic / Continuity Advocate*** Awkward: Might have to deny strong claims (like PM to modern Greece) if the *specific* ancient entity (e.g., Classical Athens) isn't perfectly continuous, while accepting others (BB to Edo Kingdom descendants) based on unbroken lineage. Most awkward: Could imply modern nation-states *without* perfect continuity (like many ex-colonies) have weaker claims than sub-state groups.
              *   **NO (Ownership/History > Continuity):** *Leaf: **Legalist / Possessionist*** Awkward: Defending current possession even if the *original* taking was likely shady but unprovable ("finders keepers, losers weepers" vibes). Also awkward: Might mean supporting Greece's PM claim (based on territorial history) but potentially muddying BB claims if pre-colonial Benin legal status is contested under int'l law *then*.
          *   *SKIP Split 3 (Access Argument) here?* Why? If provenance blocks the claim, why even weigh access? It's a non-starter. *This branch probably doesn't engage deeply with Split 3.*
          *   **SPLIT 4: Is restitution mainly about fixing a relational harm or just correcting a property wrong?**
              *   **RELATIONAL HARM (Dignity, Trust Repair):** *Leaf: **Awkwardly Unnamed*** (Rarely argued from this starting point). Awkward: Concedes the *moral harm* exists (needing relational repair) but argues murky provenance means *this specific object* isn't the tool to fix it. Feels like dodging.
              *   **PROPERTY WRONG ONLY:** *Leaf: **Hard Possessionist*** Awkward: Admits property rights *could* be violated, but insists the victim must prove it beyond doubt, placing an often impossible burden on claimants victimized by systems designed to obscure.

      *   **NO (Provenance Doesn't Block):** Lack of perfect paperwork doesn't erase the likely context of colonial violence/coercion/exploitation. The moral claim stands unless *definitively disproven*. *Think: General acceptance BB taken via punitive raid; PM removed under Ottoman occupation.*
          *   **SPLIT 2: Does cultural continuity matter more than legal ownership?**
              *   **YES (Continuity > Ownership):** *Leaf: **Cultural Continuity Maximalist*** Awkward: Might prioritize return to sub-national groups (e.g., Oba of Benin for BB) over the nation-state (Nigeria), potentially creating political tensions. Also awkward: Could downplay Greece's claim on PM if arguing Ancient Athenian culture isn't *directly* embodied by the modern Hellenic Republic.
              *   **NO (Ownership/History > Continuity):** *Leaf: **Nation-State Restitutionist*** Awkward: Might support returning BB to Nigeria (modern state) or PM to Greece (modern state) even if the *specific* cultural descendants (e.g., Edo people, Athenian locals) feel a stronger connection than the state apparatus. Risk of state appropriation.
          *   **SPLIT 3: Can an educational/universal-access argument ever outweigh restitution?**
              *   **YES (Access Can Outweigh):**
                  *   **SPLIT 4: Is restitution mainly about fixing a relational harm or just correcting a property wrong?**
                      *   **RELATIONAL HARM:** *Leaf: **Soft Universalism / Relational Pragmatist*** (e.g., some museum directors, "shared heritage" advocates). Awkward: Believes the harm requires repair but thinks keeping the object *here* (with loans/partnerships) builds better global relations than return. Risks sounding paternalistic ("We know what's best for reconciliation").
                      *   **PROPERTY WRONG ONLY:** *Leaf: **Unnamed (Theoretical?)*** Awkward: Concedes the property was wrongly taken (so the *owner* deserves it back) but argues global educational value is *so high* that it justifies continued "borrowing" without consent. Feels like "theft for a greater good." *Largely empty – why?* It's philosophically ugly (using stolen goods for good doesn't negate the theft) and rarely argued openly. Museums prefer the relational harm angle for access.
              *   **NO (Access Never Outweighs):**
                  *   **SPLIT 4: Is restitution mainly about fixing a relational harm or just correcting a property wrong?**
                      *   **RELATIONAL HARM:** *Leaf: **Restitution as Repair*** (e.g., many source country advocates, ethical archaeologists). Awkward: Requires defining and measuring "repaired" relations, which is messy. Also, returning one object might be symbolic without systemic change.
                      *   **PROPERTY WRONG ONLY:** *Leaf: **Hard Restitutionist / Property Corrector*** Awkward: Reduces complex historical injustice to a simple property transaction. Might ignore deeper symbolic/cultural meanings of the objects (BB as sacred, PM as national icon) or the relational aspects claimants care about most. Could also get bogged down in *exactly* who the legal owner *now* is (e.g., Nigerian state vs. Oba).

  **Occupancy & Overlaps:**

  *   **Crowded Leaf:** "Soft Universalism / Relational Pragmatist" (Provenance Doesn't Block + Continuity either way? + Access Can Outweigh + Relational Harm). This is where many major museums reluctantly end up, arguing for partnerships over full return. The BB and PM debates are FULL of this. Continuity vs Ownership might not split them clearly here – they often fudge it.
  *   **Named Positions on Same Leaf:** "Cultural Continuity Maximalist" and "Nation-State Restitutionist" land on distinct leaves under "Provenance Doesn't Block" based solely on their answer to "Continuity > Ownership?". The tree *can* separate them via Split 2.
  *   **Empty/Thin Leaves:**
      *   **"Hard Possessionist" (Provenance Blocks + Property Wrong Only):** Occupied but niche (hardline collectors/legacy institutions). Awkwardness makes it unpopular publicly.
      *   **"Provenance Skeptic / Continuity Advocate":** Thin. Hard to find clear proponents. Why? Squaring "provenance blocks" with prioritizing continuity is logically strained. It feels like trying to have it both ways – denying the claim via provenance but supporting it via connection, which clashes.
      *   **Access Can Outweigh + Property Wrong Only:** Largely empty (see above). Too ugly/incoherent.
      *   **Provenance Blocks + Access Can Outweigh:** Barely developed. Why? If provenance blocks the claim, why would access arguments even be needed? It's incoherent – you wouldn't justify keeping something you think *might* be legitimately acquired based on access. It's either contested (goes down the "NO" branch) or not.

  **Key Takeaways for Discussion:**

  *   The "Provenance Blocks?" split is a major fault line. A "YES" answer severely weakens almost all claims; a "NO" makes restitution a live debate.
  *   "Access Can Outweigh?" is where museums fight hardest, primarily using the *relational harm* argument to justify keeping/loaning rather than full return. The *property wrong only + access* leaf is a ghost town.
  *   The "Relational vs Property" split (Split 4) reveals deeper motivations. Is this about correcting a historical ledger entry, or healing a wound?
  *   The tree exposes gaps: Positions denying provenance blocks *and* prioritizing continuity *while also* claiming access outweighs restitution are logically possible but probably fall under "Soft Universalism" if they focus on relational repair via access. Pure "access trumps rightful ownership" is avoided.
  *   **Important:** Real-world arguments often straddle branches or emphasize different splits depending on the specific object/case! This is a tool to disambiguate core logics, not box in every nuanced opinion.

  Hope this sparks good debate! Let's annotate it in the seminar. - [Your Name/Initials]
