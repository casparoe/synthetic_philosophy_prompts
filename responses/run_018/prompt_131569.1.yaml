prompt: |-
  hey im not a student just been thinking about this on my own. everyone compares beef vs chicken by counting direct animal deaths, but then theres all the wild mice and birds killed by crop harvest for chicken feed. i made up this thing i call the 'pasture substitution paradox' — beef uses grassland that could be wild habitat, but chicken needs grain that kills rodents in the fields. so switching to chicken might reduce cow suffering but increase wild suffering in a way that feels like a seperate category. can you give me an example of a conceptual issue that captures this tension, where measuring harm by direct farm deaths vs indirect wild deaths from crop machinery pulls in opposite directions? i want it spelled out clearly without needing any outside books. please put a one-sentence summary as the very last line.
