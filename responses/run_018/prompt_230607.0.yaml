  Okay, I'm diving into this query about formal epistemology and simplicity in prior probabilities. The user is preparing a graduate seminar unit and wants a comprehensive list of desiderata for theories connecting simplicity to prior probability. They've outlined four specific areas to cover, plus a request to flag non-negotiable vs. contested points and potential conflicts. 

