  Ah, and Desideratum 2's constant-dependence... is it tolerable? For finite data, yes (since constants dominate early), but it's philosophically messy. MDL practitioners accept this; purists might not. 

  Uncomputability (Desideratum 3) forces another tradeoff: Solomonoff embraces idealization; MDL settles for approximations. Neither fully satisfies "computationally realistic" but that might be optional for a grad seminar focused on foundations. 

  The case studies (Desideratum 4) are crucial stress tests. Gerrymandered hypotheses reveal if the theory blocks cheap overfitting - non-negotiable. Coding tricks might require accepting language-relativity as fundamental. 

  ...Now evaluating Solomonoff: It nails justification (via dominance) and cases like overfitting, but its uncomputability and language-relativity are stark. MDL's computable approximations are usable but lose some theoretical guarantees. 

  My uncertainty? Probably whether language-relativity undermines truth-tracking (Desideratum 1b). If simplicity is language-dependent, can it really "track truth"? Some argue yes (if language matches reality's structure); others say it's merely pragmatic. 

