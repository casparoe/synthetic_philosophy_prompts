answer: |-
  The institutional practice reflects a deeply embedded **anthropocentric/sentientist theory of value and moral status**, grounded in the following presuppositions:

  1.  **Consciousness as the Sole Locus of Value (Sentientism):** Moral standing requires *phenomenal consciousness*—the capacity for subjective experience (e.g., pleasure, pain, preferences). Entities lacking this are mere resources.
  2.  **Biological Realization Thesis:** Consciousness robustly emerges *only* from specific, complex biological systems (e.g., nervous systems, brains). Simpler biological systems or non-biological structures lack the necessary complexity.
  3.  **Emergence Threshold:** Consciousness is an emergent property appearing only above a critical threshold of neurobiological or behavioral complexity. Fundamental physical entities fall far below this threshold.
  4.  **Epistemic Access Requirement:** Moral status must be *practically demonstrable* through observable indicators (behavior, neurobiology). Speculative or inaccessible properties (like micro-experience) are irrelevant to practical ethics.
  5.  **Valence-Neutrality or Irrelevance (Implicit):** The practice likely *assumes* either:
      *   **Valence-Neutrality:** Even if panpsychism were true, micro-phenomenal properties lack intrinsic positive/negative valence (pleasure/suffering).
      *   **Tractability/Irrelevance Principle:** Micro-phenomenal states (if they exist) are so radically simple, disunified, and causally inert at the macro-level that they cannot constitute morally relevant harm/benefit, rendering them irrelevant *even if* valence were conceivable. This is the stronger implicit justification.

  **What the Practice Strictly Requires vs. What Accompanies It:**
  *   **Strictly Requires:** Only entities with *demonstrably complex consciousness* (via neurobiology/behavior) possess moral standing. Fundamental physics is morally inert.
  *   **Accompanies It:**
      *   The Biological Realization Thesis (consciousness *could* theoretically arise in advanced AI).
      *   A strong commitment to Emergence (though emergence itself isn't strictly required; non-emergent but complex biological consciousness suffices).
      *   Valence-Neutrality might be a common belief, but the practice primarily relies on the Tractability/Irrelevance Principle.

  **A Panpsychist's Defense of the Exclusion (Despite Combination):**
  A panpsychist *could* defend the practice without endorsing biological emergence or full valence-neutrality:
  1.  **The Combination Problem is Fatal to Moral Relevance:** While fundamental entities possess micro-experience, the combination problem means macro-consciousness (like human pain) does *not* literally combine micro-experiences into a unified complex feeling. Micro-experiences remain utterly simple, isolated, and causally disconnected from macro-level suffering/well-being.
  2.  **Valence at the Micro-Level is Trivial:** Even if micro-experiences have valence, it is so minimal, uniform, and unchanging (e.g., a static, barely valenced hum) that altering it via physical manipulation creates no *meaningful* harm or benefit. The valence magnitude is negligible.
  3.  **Tractability/Irrelevance Reigns:** We have *no access* to micro-phenomenal states, no way to measure their valence (if any), and no reason to believe altering spacetime geometry or particle states *changes* their intrinsic character in morally significant ways. Ethical focus *must* remain on the macro-level where demonstrable suffering occurs.
  4.  **No Bridge to Macro-Harm:** Altering fundamental configurations only causes moral harm *if* it disrupts macro-conscious entities. The micro-experience itself is irrelevant to the harm calculus. **(Confidence: High - This defense is logically coherent)**

  **Changes Required if the Underlying View Shifts:**
  Replacing sentientism/biological emergence with a view granting potential moral relevance to fundamental physical entities (e.g., strong panpsychism with valence) would necessitate:
  1.  **Expanding the Scope of "Moral Patient":** Fundamental entities/configurations would need consideration as *potential* subjects of experience.
  2.  **Developing Micro-Phenomenal Risk Models:** Frameworks would need to theorize:
      *   Whether specific physical manipulations (e.g., high-energy collisions, quantum state manipulation, spacetime warping) *alter* intrinsic experiential states.
      *   Whether such alterations constitute *harm* (negative valence) or *benefit* (positive valence).
      *   The *magnitude* and *distribution* of this valence change.
  3.  **Epistemic Thresholds & Precaution:** Given profound uncertainty, strong precautionary principles might apply to large-scale or irreversible manipulations (e.g., planetary-scale geoengineering, creating exotic quantum states) until micro-phenomenal impacts are better understood (or proven irrelevant).
  4.  **Radical Uncertainty Protocols:** Risk assessments would need explicit modules for "unknown intrinsic experience impacts," potentially requiring higher justificatory burdens for highly novel or scalable interventions.

  **Extending the Reversibility Criterion:**
  Applying the reversibility criterion ("irreversible alterations demand stronger justification") to fundamental physical configurations:
  *   **Coherence:** Conceptually coherent. If configurations possess intrinsic value or potentially valenced experience, permanently altering/destroying them could be a harm demanding justification. Reversibility becomes a key factor.
  *   **Collapse into Paralysis?** Highly likely:
      *   **Ubiquity of Irreversibility:** Quantum decoherence, entropy increase, particle annihilation – *most* physical processes are irreversible at the fundamental level. Banning all irreversible changes halts virtually all physics research and technology.
      *   **Scale Insensitivity:** The criterion doesn't distinguish between annihilating one particle (trivially irreversible) and altering Earth's climate (macro-irreversible). Both demand "stronger justification" equally.
      *   **Immeasurable Harm:** Without a theory linking specific physical states to specific valences, assessing the *degree* of harm from irreversibility is impossible. Justification collapses into pure speculation.
      *   **Practical Impossibility:** Review boards lack the conceptual tools, data, or consensus to apply this criterion meaningfully to particle physics or spacetime geometry.
      *   **Conclusion:** While *theoretically* coherent, extending reversibility this broadly is **operationally paralyzing** and lacks a viable framework for prioritization or harm assessment. It fails as a *practical* ethical constraint. **(Confidence: High - The impracticality is evident)**

  **Confidence Assessment:**
  *   **Implicit Theory (Sentientism/Biological Emergence/Epistemic Access):** **High Confidence.** This is the explicit and observable basis of current regulations.
  *   **Panpsychist Defense via Combination Problem/Irrelevance:** **High Confidence.** It's a logically valid argument within panpsychism.
  *   **Valence-Neutrality vs. Tractability Principle:** **Moderate Confidence.** Practice relies more on tractability/irrelevance, though valence-neutrality may be a common implicit belief. **This is the point of LEAST certainty.** Disentangling the exact implicit commitment is difficult; institutional documents rarely engage with panpsychism explicitly. The practice *functions* via tractability, but individuals may hold varying beliefs about valence.
  *   **Changes Required for View Shift:** **Moderate Confidence.** The listed changes are logical implications, but their exact form is speculative.
  *   **Reversibility Criterion Coherence:** **High Confidence.** The conceptual extension is straightforward.
  *   **Reversibility Criterion Leading to Paralysis:** **Very High Confidence.** The ubiquity of irreversibility at the micro-level and the lack of assessment tools make practical application absurd.

  **In essence:** Current practice rests on the demonstrability of complex consciousness as the sole criterion for moral status, dismissing fundamental physics due to epistemic inaccessibility and presumed causal/moral irrelevance. A panpsychist can defend this exclusion by arguing that the combination problem severs the moral relevance of micro-experience from macro-experience. Shifting this view would necessitate profound but currently intractable changes to risk assessment. Extending reversibility to fundamental configurations is coherent in theory but leads to unworkable paralysis in practice.
