  3. The marking scheme (around 250 words) — list specific moves an A answer must contain (with point values out of 20 total), then name the typical mistakes that drop someone to a B.

  please make sure you seperate whats actually agreed on among philosophers from whats still fought over, and dont present either side as the obvious consensus. also dont ask for citations, bibliographies, or reading lists — the student answering this wont have web access. i spelled "seperate" wrong on purpose lol, and i might have misspelled tranquilism too idk.
