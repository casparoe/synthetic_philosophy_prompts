answer: |-
  ### Units of Selection Decision Tree  
  Here's a casual, no-frills decision tree for your taxonomy, based on the three cases you described. I’ve flagged incoherent/unstable branches, named major positions where they fit, and noted where cases can’t distinguish between views. Remember: real-world debates are messy—some branches are "unoccupied" because they’re either logically shaky or just not popular.  

  ---

  #### **Start: Sterile Worker Ant Case**  
  *Question: What’s doing the causal work in ant sterility?*  

  1. **Queen’s genome**  
     *Why?* Sterility is an adaptation for the queen’s genes to replicate (e.g., via kin selection).  
     → Go to **Biofilm Case**.  

  2. **Colony as iterator**  
     *Why?* The colony is the unit being selected—worker sterility boosts colony survival/reproduction.  
     → Go to **Biofilm Case**.  

  3. **Worker’s own developmental program**  
     *Leaf:* **Incoherent**. Workers don’t reproduce, so their "program" can’t be selected for. (Sterility needs higher-level explanation.)  

  ---

  #### **Biofilm Case**  
  *Engineered plasmids: spread horizontally, help biofilm survive, but kill individual bacteria.*  
  *Question: What’s the unit here?*  

  ##### **Branch from Queen’s Genome (Ants)**  
  *(Gene-focused start)*  

  4. **Gene-level selection** (plasmids as "selfish genes")  
     → Go to **Cultural Case**.  
  5. **Group-level selection** (biofilm as a unit)  
     → Go to **Cultural Case**.  
  6. **Holobiont-level selection** (biofilm as a multi-species unit)  
     → Go to **Cultural Case**.  

  ##### **Branch from Colony as Iterator (Ants)**  
  *(Group-focused start)*  

  7. **Gene-level selection**  
     *Leaf:* **Incoherent**. Genes aren’t interactors—they don’t "do" anything alone. (Plasmids need hosts to function.)  
  8. **Group-level selection**  
     → Go to **Cultural Case**.  
  9. **Holobiont-level selection**  
     → Go to **Cultural Case**.  

  ---

  #### **Cultural Case**  
  *Costly group norm: hurts individual fitness but helps groups outcompete neighbors.*  
  *Question: Where’s the unit?*  

  ##### **Branches from Queen’s Genome → Biofilm Options**  
  *(All paths start gene-focused in ants)*  

  - **From Gene-level (Biofilm):**  
    10. **Individual-meme level** (norms as selfish memes hitchhiking on groups)  
        *Leaf:* **Dawkins-style gene selectionism**. Consistent "selfish replicator" view (genes + memes).  
    11. **Group level**  
        *Leaf:* **Unnamed & unstable**. Why switch from genes to groups just for culture? Inconsistent.  

  - **From Group-level (Biofilm):**  
    12. **Individual-meme level**  
        *Leaf:* **Unnamed & unattractive**. Genes (ants) + groups (biofilm) + memes (culture)? No clear logic.  
    13. **Group level**  
        *Leaf:* **Unnamed & unexplored**. Possible but rare—why groups everywhere *except* ants?  

  - **From Holobiont-level (Biofilm):**  
    14. **Individual-meme level**  
        *Leaf:* **Incoherent**. Mixes gene (ants), symbiotic group (biofilm), and meme (culture) with no unifying principle.  
    15. **Group level**  
        *Leaf:* **Unnamed & unattractive**. Feels like forcing group selection retroactively.  

  ##### **Branches from Colony as Iterator → Biofilm Options**  
  *(All paths start group-focused in ants)*  

  - **From Group-level (Biofilm):**  
    16. **Individual-meme level**  
        *Leaf:* **Unnamed & unexplored**. Groups for ants/biofilm, memes for culture? Possible but unmotivated.  
    17. **Group level**  
        *Leaf:* **Wilson/Sober multilevel selection** (groups as units in all cases). *Also fits Hull’s interactor view*.  
        *🚩 Flag:* Cases **can’t separate Wilson/Sober from Hull** here. Both see groups as interactors.  

  - **From Holobiont-level (Biofilm):**  
    18. **Individual-meme level**  
        *Leaf:* **Unnamed & unstable**. Groups (ants) + holobionts (biofilm) + memes (culture)? No synergy.  
    19. **Group level**  
        *Leaf:* **Holobiont selection** (for biofilm), but groups elsewhere. Emerging position (e.g., microbiome folks).  

  ---

  ### Key Gaps & Notes  
  - **Dawkins** only fits one path (queen’s genome → biofilm genes → cultural memes).  
  - **Hull’s interactor/replicator split** isn’t a leaf—it’s a framework that *maps onto* branches like Wilson/Sober (e.g., colony/biofilm/group as interactors).  
  - **Worker’s program branch** is dead on arrival (incoherent).  
  - **Unattractive/unexplored branches**: Usually involve arbitrary switching between units (e.g., genes→groups→memes). Biologists avoid these—they’re not principled.  
  - **Can’t-separate alert**: The biofilm case doesn’t cleanly split group vs. holobiont selection (they overlap in practice). Also, Wilson/Sober vs. Hull on groups is fuzzy—these cases don’t distinguish them.  

  This should cover your bases! If your study group debates a branch, lean into the chaos—it’s where the good philosophy happens. 😉
