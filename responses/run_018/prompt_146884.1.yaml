  First, I need to tackle the Formula of Universal Law. If everyone started creating cognitive echoes as moral guides, it'd create a contradiction. People would treat these simulations as authorities, but since they're not actually rational agents (just patterns from the past), this would erode genuine moral reasoning. Universalizing this maxim would make society rely on non-rational proxies, undermining the autonomy Kant values. 

