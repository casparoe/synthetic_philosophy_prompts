prompt: |-
  Design a final exam essay question, together with a model answer and a marking scheme, for an upper-level seminar on classical Chinese metaphysics and the philosophy of language. The question must center on Gongsun Long's White Horse dialogue and the broader concerns of the School of Names, but it should not be answerable by merely summarizing the standard form-versus-color distinction. To achieve this, build the question around the following niche extension: ask students to consider whether the dialogue's separation of horseness (as form) and whiteness (as color) can be coherently applied to a photorealistic digital rendering of a white horse displayed on an OLED screen—specifically, whether such an image is a white horse, and whether this extension exposes a hidden ontological commitment in the original argument, such as the claim that properties must be physically instantiated rather than merely represented.

  The exam is closed-book and must be completable in approximately 75 minutes by students who have studied the dialogue in translation and discussed it in seminar, but who have no access to external resources. The prompt should require students to reconstruct the original argument precisely, apply it to the digital case, identify the hidden premise about property ontology, evaluate whether the extension strengthens or undermines the School of Names position, and reach a defended conclusion.

  Please provide:
  1. The exam question, clearly framing the digital-rendering extension and specifying exactly which analytical moves students must perform.
  2. A model answer that demonstrates the required moves: accurate reconstruction of the form/color separation; rigorous application to the rendered image; explicit identification of the hidden physical-instantiation premise; evaluation of the extension's impact on the School of Names; and a concise, argued conclusion.
  3. A marking scheme out of 25 marks, broken into the five moves above, with marks assigned to each. For each component, include a one-line description of the characteristic error that should reduce the score—e.g., confusing the logical distinction with a merely perceptual one, or treating the digital case as obviously irrelevant without argument.
reasoning: |-
  We are designing an essay question for an upper-level seminar on classical Chinese metaphysics and philosophy of language. The focus is on Gongsun Long's White Horse dialogue and the School of Names. The twist is to apply the dialogue's distinction to a photorealistic digital image of a white horse on an OLED screen. The question must go beyond the standard form/color distinction and probe a hidden ontological commitment.

  The exam question should require:
  1. Reconstruction of the original argument (form vs. color).
  2. Application to the digital case (is the image a white horse?).
  3. Identification of a hidden premise about property ontology (physical instantiation vs. representation).
  4. Evaluation of whether this extension strengthens or undermines the School of Names.
  5. A defended conclusion.

  The exam is closed-book, 75 minutes.

  Let me break down:

  **Exam Question:**

  **Question:**
  Gongsun Long's "White Horse Dialogue" famously argues that a white horse is not a horse by separating the form (horseness) from the color (whiteness). Consider a photorealistic digital rendering of a white horse displayed on an OLED screen. In an essay of approximately 750-1000 words, address the following:

  a) Precisely reconstruct Gongsun Long's argument for the claim that a white horse is not a horse, focusing on the distinction between form and color. (5 marks)

  b) Apply this argument to the digital rendering: is the image of the white horse a white horse? Does the argument yield the same conclusion? Why or why not? (7 marks)

  c) Identify and explain a hidden ontological premise in the original argument that becomes apparent when considering the digital case. Specifically, address whether properties (such as whiteness and horseness) must be physically instantiated rather than merely represented. (6 marks)

  d) Evaluate the implications of this digital extension for the School of Names' broader project. Does this case strengthen, undermine, or otherwise modify the School of Names' position? Why? (5 marks)

  e) Conclude by stating and defending your own view on the question: is the digital image of a white horse a white horse? Justify your answer in light of the preceding analysis. (2 marks)

  Total: 25 marks.

  ---

  **Model Answer:**

  **Introduction:**
  Gongsun Long's "White Horse Dialogue" presents a provocative argument that challenges common-sense notions of identity and predication. By asserting that a white horse is not a horse, he draws a sharp metaphysical distinction between form (xing) and color (se). This essay will reconstruct that argument, apply it to a photorealistic digital image of a white horse, uncover a hidden ontological commitment in the original, and assess the implications for the School of Names. Ultimately, I will argue that the digital case reveals the argument's reliance on physical instantiation and thereby complicates the School of Names' project.

  **a) Reconstruction of Gongsun Long's Argument (5 marks):**
  Gongsun Long's core argument in the "White Horse Dialogue" is that "white horse is not horse." He reasons that "horse" refers to the form (xing) of a horse, while "white" refers to the color (se). When we combine them to form "white horse," we are referring to a compound of form and color. However, since the term "horse" only picks out the form and does not include color, and "white horse" requires both form and color, the set of white horses is not identical to the set of horses. Moreover, Gongsun Long argues that if one asks for a horse, a yellow or black horse may be brought, but if one asks for a white horse, only a white horse will do. This shows that "white horse" and "horse" are not co-extensive. Therefore, the white horse (as a compound) is not identical to the horse (as form alone). The argument hinges on the separability of form and color as distinct properties and the idea that naming must be precise to the compound or the simple.

  **b) Application to the Digital Rendering (7 marks):**
  When we consider a photorealistic digital image of a white horse on an OLED screen, we must ask: is this image a white horse? Applying Gongsun Long's argument, we note that the image has the visual appearance of a white horse. However, the image is not a physical horse but a representation. The form (horseness) in the image is not a physical form but a pattern of pixels that represents a horse. Similarly, the whiteness is not a physical property of a horse's coat but a representation created by light emissions from the screen.

  According to Gongsun Long's logic, we must separate the form and the color. The digital image has a represented form (horseness) and a represented color (whiteness). But the original argument requires that the horse-form be instantiated in a physical object. In the digital case, we have no physical horse, only a representation. Therefore, by Gongsun Long's standards, the image does not have horseness at all because horseness is a form that must be physically instantiated. Similarly, the whiteness is not the same as physical whiteness but a digital simulation. Thus, the argument would conclude that the image is not a white horse because it lacks the physical instantiation of both the form and the color. However, note that the image is an image of a white horse, so we might say it is a white horse in a representational sense. But Gongsun Long's argument does not account for representation; it deals only with physical objects and their properties.

  **c) Identification of Hidden Ontological Premise (6 marks):**
  The digital case reveals a hidden ontological commitment in Gongsun Long's argument: properties must be physically instantiated rather than merely represented. The original argument assumes that horseness and whiteness are properties that inhere in a physical object. The dialogue does not consider the possibility of represented properties that are not instantiated in matter. This premise becomes clear when we try to apply the form/color distinction to the digital image. The image has no physical horse, so it cannot have horseness. Similarly, the whiteness on the screen is not a property of a horse's coat but of the screen. Therefore, the argument implicitly relies on the idea that properties must be physically instantiated to be real and to count in the naming relation.

  **d) Implications for the School of Names (5 marks):**
  The School of Names (Mingjia) was concerned with the relationship between names (ming) and realities (shi). They sought to correct naming to avoid confusion. The digital extension challenges the School of Names by exposing their physicalist ontology. If properties can be represented without being instantiated, then the precision of naming must account for representation. This might undermine the School of Names because their arguments (like Gongsun Long's) become less compelling when representation is introduced. The white horse image is called a white horse in common language, and it functions as such in many contexts. The School of Names might have to adjust their strict separation of form and color to accommodate representation, which could complicate their project. Alternatively, they might double down and insist that representation is a different category altogether, thus preserving their original distinctions but at the cost of limiting their applicability. Overall, the digital case exposes a limitation in the School of Names' ontology and suggests that their approach might be too narrow.

  **e) Conclusion and Personal View (2 marks):**
  In conclusion, while Gongsun Long's argument correctly separates form and color, it fails to account for representation. I believe the digital image of a white horse is not a white horse in the physical sense, but it is a representation of one. Therefore, in the context of representation, we can say it is a white horse image, but not a white horse. This preserves Gongsun Long's insight about the physical instantiation while allowing for a broader ontology of representation. The School of Names' position is thus both challenged and potentially enriched by this extension.

  ---

  **Marking Scheme (Total: 25 marks):**

  a) **Reconstruction of the original argument (5 marks):**
     - 5: Clear, accurate, and complete reconstruction of the form/color distinction and the logical steps to "white horse is not horse."
     - 4: Mostly accurate but minor omissions or inaccuracies.
     - 3: Some understanding but key elements missing or confused.
     - 2: Significant errors, e.g., misrepresenting the distinction as merely perceptual or missing the logical steps.
     - 1: Very poor or mostly summary without argument.
     - 0: No attempt or completely wrong.

     *Characteristic error: Confusing the logical distinction with a merely perceptual one, or reducing the argument to a trivial semantic point.*

  b) **Application to the digital case (7 marks):**
     - 7: Sophisticated application, clearly distinguishes physical vs. represented properties, and explains why the argument leads to a different conclusion in the digital case.
     - 5-6: Good application but with minor gaps in reasoning or less clarity on the implications.
     - 3-4: Some attempt but fails to properly analyze the digital case or misapplies the original argument.
     - 1-2: Superficial treatment, e.g., simply stating the image is not a horse without argument, or treating the case as obviously irrelevant.
     - 0: No attempt.

     *Characteristic error: Treating the digital case as obviously irrelevant without argument, or assuming the image is a white horse without addressing the representation issue.*

  c) **Identification of hidden ontological premise (6 marks):**
     - 6: Clearly identifies the hidden premise of physical instantiation and explains how the digital case reveals it, with reference to property ontology.
     - 5: Identifies the premise but explanation is less thorough.
     - 4: Identifies the premise but without sufficient explanation or connection to the digital case.
     - 3: Vague identification without clear ontological focus.
     - 2: Misidentifies the hidden premise (e.g., focuses on something else).
     - 1: Only hints at the issue.
     - 0: No attempt.

     *Characteristic error: Missing the physical instantiation premise and instead discussing something else, like the material of the screen.*

  d) **Evaluation of impact on School of Names (5 marks):**
     - 5: Insightful evaluation of how the digital case affects the School of Names' project, with clear reasoning on whether it strengthens, undermines, or modifies.
     - 4: Good evaluation but lacking depth in reasoning.
     - 3: Basic evaluation, e.g., simply states it undermines without explaining why.
     - 2: Weak or confused evaluation.
     - 1: Minimal attempt.
     - 0: No attempt.

     *Characteristic error: Asserting that the School of Names is undermined without argument, or failing to connect to the broader project.*

  e) **Conclusion and personal view (2 marks):**
     - 2: Clear, defended conclusion that follows from the analysis and addresses the digital case.
     - 1: Conclusion present but weak or not defended.
     - 0: No conclusion or irrelevant.

     *Characteristic error: Not connecting the conclusion to the preceding analysis, or giving an unsupported opinion.*

  Note: The model answer is an example of a high-scoring response. The marking scheme allows for partial credit in each section.
answer: |-
  ### Exam Question  
  **Instructions:** Write a concise, argumentative essay (approx. 750–1000 words) addressing the following prompt. You have 75 minutes. Closed book.  

  **Prompt:**  
  Gongsun Long’s *White Horse Dialogue* argues that a white horse is not a horse by separating "horseness" (as form) from "whiteness" (as color). Apply this distinction to a **photorealistic digital rendering of a white horse displayed on an OLED screen**. Your essay must:  
  1. **Reconstruct** Gongsun Long’s core argument, clarifying how form and color function in his distinction.  
  2. **Apply** this argument to the digital rendering: Is the image *a white horse*? Explain why or why not using the dialogue’s logic.  
  3. **Identify** a hidden ontological premise in the original argument (e.g., about property instantiation) that the digital case exposes.  
  4. **Evaluate** whether this extension *strengthens* or *undermines* the School of Names’ broader project (e.g., rectifying names, analyzing reality).  
  5. **Conclude** by defending your view on whether the rendering is a white horse, using insights from the analysis.  

  ---

  ### Model Answer  

  **Introduction**  
  Gongsun Long’s *White Horse Dialogue* challenges conventional predication by asserting a white horse is not identical to a horse, leveraging a metaphysical split between form (*xing*) and color (*se*). This essay reconstructs his argument, applies it to a photorealistic digital image of a white horse, exposes a hidden ontological commitment to physical instantiation, and evaluates the implications for the School of Names. Ultimately, I argue the digital case reveals a flaw in Gongsun Long’s framework, undermining the School’s project.  

  **1. Reconstruction of Gongsun Long’s Argument**  
  Gongsun Long’s thesis—"white horse is not horse"—rests on dissecting compound terms into discrete properties. "Horse" denotes *form* (horseness), an abstract category capturing the essence of equine beings. "White" denotes *color* (whiteness), a separable attribute. When combined ("white horse"), the term specifies a compound entity: form *plus* color. Crucially, Gongsun Long argues that since "horse" refers *only* to form (excluding color), and "white horse" requires both, the two terms are non-identical. For instance, requesting "a horse" permits any horse (black, brown), but "a white horse" demands whiteness. Thus, horseness and whiteness are mutually exclusive categories; conflating them violates precise naming (*zhengming*).  

  **2. Application to the Digital Rendering**  
  Applied to a photorealistic digital image of a white horse on an OLED screen, Gongsun Long’s logic yields a paradoxical conclusion. The image *represents* horseness (via pixel arrangement mimicking equine shape) and whiteness (via RGB light emissions). Yet, the argument would deny the image is *a white horse*. **First**, horseness—as form—requires physical instantiation in a material object (e.g., flesh-and-blood horse). The image lacks this: it is light on a screen, not a horse. **Second**, whiteness in the image is simulated light, not a property inhering in horse-hair. Thus, the image is a *representation* of horseness and whiteness, not their ontological union in a single entity. Gongsun Long would conclude: "This is not a white horse; it is an image *of* one."  

  **3. Identification of Hidden Ontological Premise**  
  The digital case exposes a **hidden premise**: properties like horseness and whiteness must be *physically instantiated* in matter to be real. Gongsun Long assumes form and color are concrete attributes bound to objects (e.g., whiteness adheres to horse-hair). Representation is not addressed—the dialogue treats "horse" and "white" as direct mappings to physical traits. The digital rendering, however, decouples properties from instantiation: horseness is simulated via code, not biological form; whiteness is emitted light, not pigment. This reveals the argument’s silent commitment to an ontology where properties are only meaningful when materially embodied.  

  **4. Evaluation: Impact on the School of Names**  
  This extension **undermines** the School of Names’ project. The School sought to rectify names (*zhengming*) by aligning language with reality’s structure, using paradoxes like the white horse to dissect compounds into atomic properties. However, the digital case shows this framework cannot accommodate *represented* properties. If horseness and whiteness can be simulated without physical instantiation, the School’s insistence on rigid property-separation appears arbitrary. For example, common language accepts "This [image] is a white horse" without confusion, suggesting names can reference representations *as if* they were instantiations. The School’s physicalist ontology thus limits its ability to handle abstract or mediated realities, exposing a fatal narrowness.  

  **5. Conclusion: Defended View**  
  The digital rendering is **not a white horse** in Gongsun Long’s terms, as it lacks physical instantiation. However, this very outcome reveals the School of Names’ failure: it cannot explain why we *correctly* call the image "a white horse" in everyday contexts. I argue the image *is* a white horse in a *representational* sense—it functions as one perceptually and linguistically. Gongsun Long’s insistence on physical instantiation is an unexamined bias; rejecting the image as "not a white horse" proves his distinction is brittle when reality includes mediation. Thus, the digital case reframes the dialogue as a relic of pre-technological ontology.  

  ---

  ### Marking Scheme (Total: 25 marks)  

  | **Component**                                                                 | **Marks** | **Characteristic Error (Score-Reducing)**                                                                 |
  |-------------------------------------------------------------------------------|-----------|----------------------------------------------------------------------------------------------------------|
  | **1. Reconstruction** of Gongsun Long’s argument (form vs. color distinction). | 5         | *Error: Summarizes without logical steps or confuses form/color with perceptual features (e.g., "color is just appearance").* |
  | **2. Application** to the digital rendering (is it a white horse? Why/why not?). | 7         | *Error: Treats the digital case as obviously irrelevant or conflates representation with instantiation (e.g., "It’s just a picture, so it doesn’t count").* |
  | **3. Identification** of hidden ontological premise (e.g., physical instantiation). | 6         | *Error: Misses the instantiation-representation gap (e.g., focuses on pixels instead of property ontology).* |
  | **4. Evaluation** of impact on School of Names (strengthen/undermine/modify).  | 5         | *Error: Asserts impact without argument (e.g., "It undermines because technology didn’t exist then").* |
  | **5. Conclusion** with defended personal view.                                | 2         | *Error: Contradicts prior analysis or offers unsupported opinion (e.g., "It’s a horse because it looks like one").* |  

  **Notes for Markers:**  
  - **Reconstruction (5):** Award full marks for citing form/color as mutually exclusive categories in naming.  
  - **Application (7):** Focus on whether students use the dialogue’s logic rigorously (e.g., "no physical horse → no horseness").  
  - **Identification (6):** The hidden premise is **physical instantiation**; representations disrupt it.  
  - **Evaluation (5):** Credit critiques of the School’s rigidity or defense of its precision.  
  - **Conclusion (2):** Personal view must engage the analysis; no mark for mere summary.
