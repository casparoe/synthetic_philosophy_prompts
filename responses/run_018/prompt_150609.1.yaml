prompt: |-
  Having recently joined the board of a cooperative that manages a shared rainwater catchment, I have become preoccupied with how institutional design succeeds or fails when exclusion is costly and monitoring is voluntary. Read William Golding’s Lord of the Flies through the institutional economics of common-pool resources and public goods—not merely as an allegory of innate savagery, but as a case study in governance design. Treat the signal fire as a non-excludable public good and the island’s food supply as an open-access commons; then examine whether the conch operates as a collective-choice mechanism that could, in principle, satisfy the standard design conditions for durable commons management—clear boundaries, proportional costs and benefits, collective monitoring, and nested conflict resolution. Where do specific scenes—the neglect of the fire, Piggy’s glasses as a shared technological asset, Jack’s excludable hunting collective—illustrate free-riding, monitoring collapse, or the shift from common-pool to club-good logic? At the same time, say where the novel resists this framing: does Golding’s emphasis on innate human aggression render institutional failure inevitable in a way that economic theory treats as contingent? Does the absence of adult authority represent a missing nested enterprise, or something the economic model cannot capture? Keep the answer faithful to both the symbolic texture of the novel and the analytical distinctions, and conclude by stating what the novel adds to the philosophical debate about commons governance that formal argument alone misses. Limit your response to a single paragraph of no more than 350 words.
reasoning: |-
  Hmm, the user wants me to analyze "Lord of the Flies" through the lens of institutional economics, specifically focusing on common-pool resources and public goods. They're on the board of a rainwater catchment cooperative and seem interested in governance design challenges where exclusion is difficult and monitoring is voluntary. This is a fascinating interdisciplinary request combining literature with economic theory.

  The key elements I need to address: the signal fire as a non-excludable public good (since everyone benefits from rescue regardless of contribution), the island's food as an open-access commons (vulnerable to overuse), and the conch as a potential collective-choice mechanism. I should examine specific scenes that illustrate governance failures - like when the fire is neglected (free-riding), Piggy's glasses being stolen (monitoring collapse of shared technology), and Jack forming his exclusive hunting group (shift to club-good logic).

  But I also need to acknowledge where Golding's novel challenges this economic framing - his emphasis on innate human savagery suggests institutional failure might be inevitable, whereas economic theory treats it as contingent on design. The absence of adults could represent a missing "nested enterprise" (larger governance structure) or something beyond economic models - perhaps the psychological dimension of authority.

  For the conclusion, I should articulate what the novel uniquely contributes to commons governance philosophy that pure economic analysis misses - likely the visceral, emotional dimensions of cooperation breakdown and how symbolic objects (like the conch) represent authority in ways that transcend institutional design.

  I'll need to weave these threads together tightly while respecting both the novel's symbolic richness and economic concepts, all within one paragraph under 350 words. The challenge will be balancing analytical precision with literary sensitivity.
answer: |-
  Golding's island initially presents collective-choice potential: the conch approximates a democratic forum satisfying Ostromian conditions of clear boundaries (the assembly), proportional costs/benefits (speaking turns), and conflict resolution (initial votes). However, the signal fire, a pure public good (non-excludable, non-rivalrous), suffers catastrophic free-riding as hunters prioritize private gain (hunting) over maintenance, exposing the absence of enforceable sanctions – monitoring collapses without credible commitment. Simultaneously, the food commons shifts from open-access depletion to Jack's excludable "club good" model (the hunting tribe), where membership requires submission, demonstrating how exclusionary logic supplants shared governance when monitoring fails and defection is rewarded. Piggy’s glasses, a critical shared technological asset, highlights the vulnerability of common-pool resources to appropriation when collective monitoring is absent. Yet, Golding insists this institutional collapse stems from innate aggression and fear, rendering the boys' descent seemingly inevitable – a stark contrast to institutional economics' contingency on design and enforcement. The missing adult authority represents not merely a lapsed "nested enterprise" for conflict resolution, but the withdrawal of deeply ingrained social conditioning and symbolic order that the conch alone cannot replicate. Thus, the novel adds a visceral, psychological dimension to commons governance: it reveals how easily rational institutional mechanisms are shattered by primal drives, tribalism, and the loss of legitimizing myths, demonstrating that formal design is fragile without the underpinning cultural norms and shared belief in legitimacy that economics often assumes or externalizes.

  (297 words)
