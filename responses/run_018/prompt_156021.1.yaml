answer: |-
  ### Toast: "Not Cicero's Old Age, But Hers"

  (Clinking glass) Friends, family, colleagues... and especially you bright-eyed grandkids who probably think we lawyers only speak in legalese! Tonight, we celebrate an extraordinary woman: [Mentor's Name]. 75 years of brilliance, fight, and unwavering principle. For decades, she marked her birthday by reading Cicero’s essay "On Old Age." It was her tradition, her way of taking the measure of time. Cicero lists four core complaints about aging. Tonight, instead of glossing over them with easy praise, let’s look at them honestly, the way [Mentor's Name] would demand, through the lens of her remarkable life *right now*.

  **First Complaint:** *Old age pulls you out of public life.* Cicero argued retirement lets you focus on wisdom. Does it apply? **Yes.** After 40 years as a formidable civil rights lawyer, she isn't arguing daily in packed courtrooms. She stepped back from the firm's relentless pace.

  But Cicero’s rebuttal? Does wisdom replace the fray? **Modified.** Because she hasn't *left* the fight. She’s still meticulously reviewing pro bono cases, mentoring young lawyers (including this one!), her mind as sharp as ever. The stage lights are just *different*. The limitation? She can't drive after dark anymore. That simple fact changes the rhythm, not the purpose. Cicero gets points for valuing wisdom, but he underestimated how fiercely a brilliant mind *redirects* its energy. So, she isn't "watching over us" from some detached perch; she's *still in the trenches*, just with an adjusted commute schedule. *(To the grandkids: Think of it like your favorite athlete who stops playing every single game but becomes an amazing coach, still winning championships from the sidelines.)*

  **Second Complaint:** *Old age weakens the body.* Cicero said a well-lived life makes physical decline bearable. Does it apply? **Yes.** This is undeniable. The body changes. We all see it.

  But Cicero’s rebuttal? Does a virtuous life soften the blow? **Partial.** She faces this with characteristic grit. Yet, Cicero never tasted chemo. He didn't know it could make food taste like cardboard. The sheer, basic *pleasure* of a good meal, something we all take for granted, is altered. A virtuous life gives you resilience, absolutely – she embodies that – but it doesn't magically restore taste buds or erase the fatigue of treatment. It asks for a different kind of courage: facing the daily erosion cheerfully demands its own profound strength. So, we won't pretend this move was "liberation." It was necessity. Her spirit soars, but the body demands practical concessions. *(To the grandkids: Imagine your favorite game controller suddenly stops working perfectly. You adapt, you find new ways to play, but you definitely miss how it felt before. That's the kind of adjustment we're talking about.)*

  **Third Complaint:** *Old age strips away pleasures.* Cicero argued we should shift to quieter, intellectual joys. Does it apply? **Partial.** Some pleasures change or fade, like the simple joy of taste we just mentioned. The intensity of certain physical experiences dims.

  But Cicero’s rebuttal? Do intellectual joys fully compensate? **Modified.** Cicero was onto something – she devours books, debates philosophy, finds immense joy in your growth, her grandkids. But here’s where Cicero falls short: He assumed the *loss* was natural and easily replaced. For her, the loss isn't just accepted; it's sometimes *resented*, privately, as an unfair tax. The rebuttal *holds* in the sense that she actively cultivates deep, satisfying joys – the satisfaction of a case well-advised, the laughter around this table. But it *collapses* in thinking the exchange is effortless or that the simpler, physical pleasures aren't genuinely missed. The joy is real, but the path to it isn't always the serene intellectual stroll Cicero imagined. *(To the grandkids: Like trading in running around all day for becoming a champion at chess or building amazing Lego sets. The fun is different, maybe deeper, but you still remember how great running felt.)*

  **Fourth Complaint:** *Old age puts you close to death.* Cicero argued not fearing death comes from a life well-lived and the naturalness of the cycle. Does it apply? **Yes.** It's the reality facing every one of us, just more immediate now.

  But Cicero’s rebuttal? Does a life of virtue dispel the fear? **No.** Not entirely. Not for her. She’s a realist. She’s seen too much, fought too hard, to pretend otherwise. Cicero’s noble acceptance sounds good, but it doesn't touch the quiet, unspoken terror she carries – the fear of dying *alone*. She won’t admit it aloud, that’s not her way, but those who know her see it. Cicero’s philosophical comfort feels thin against that very human, very vulnerable fear. His rebuttal doesn't hold; it feels distant, almost glib, when faced with the raw edge of that solitude. What *does* hold? What shines through? Not the absence of fear, but the monumental *courage* she shows in carrying it, in living fully *alongside* it, in insisting on her independence even as it risks that solitude. Her life *is* well-lived, profoundly so, but that doesn't magically erase the primal human dread. We see the fear, and we see the far greater courage that overshadows it.

  So, what does Cicero’s framework leave us with tonight? Not platitudes. Not easy chapters opening or watchful eyes. It leaves us with the profound, complex, utterly *human* portrait of [Mentor's Name] at 75. A mind still fiercely engaged, redirected but undimmed. A body demanding respect, met with pragmatic courage. Pleasures transformed, sometimes mourned, but actively sought anew. And facing the ultimate horizon, not with untroubled stoicism, but with a vulnerability that makes her enduring strength all the more breathtaking.

  She didn't just read Cicero; she *lived* a rebuttal he could scarcely imagine – fiercer, more honest, more real. She shows us old age not as a defeat Cicero needed to justify, but as another demanding phase of a life lived with unparalleled integrity and fire. That’s not Cicero’s old age. That’s *hers*. And we are all infinitely richer for witnessing it. To [Mentor's Name] – may your wisdom continue to challenge us, your courage inspire us, and your presence grace us for many years to come. Cheers!

