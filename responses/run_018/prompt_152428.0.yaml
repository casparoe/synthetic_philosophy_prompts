              If A:
                  Scope is global -> go to Q2.

              If B:
                  Go to Q2, then after Q2 go to Q3.

              Q2: What is the primary mechanism generating the illusion of phenomenal consciousness (as ordinarily conceived)? 
                  Option i: Representational misrepresentation: We misrepresent physical or functional properties of mental states as having phenomenal properties.
                  Option ii: Conceptual error: We mistakenly apply an empty or incoherent concept (like 'qualia') to our mental states.
                  Option iii: Pragmatic fiction: The illusion is sustained for social coordination or other pragmatic reasons, without a commitment to its literal truth.

              If you came from A (total denial), then after Q2 you have a leaf.
              If you came from B (property denial), then after Q2 go to Q3.

              Q3: How much of the ordinary conception of phenomenal consciousness is affected by the illusion?
                  Option 1: Global: Every aspect of the ordinary conception is illusory (we are mistaken about all the properties we attribute to phenomenal consciousness).
                  Option 2: Local: Only specific features of the ordinary conception are illusory (e.g., the intrinsic nature, the unity, the privacy, or the 'what-it-is-like' quality).

              Then, after Q3, you have a leaf.

              Then, we have a final question (QP) about predictive processing, but it doesn't change the leaf, we just note it.

