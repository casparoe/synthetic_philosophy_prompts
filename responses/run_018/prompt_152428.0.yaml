answer: |-
  Below is a decision-tree taxonomy structured as a diagnostic instrument for illusionism about phenomenal consciousness. Each node is phrased as a concrete, answerable claim to guide respondents through the logical space without relying on prior knowledge of taxonomy labels. The tree begins with the core illusionist commitment, branches through three axes (ontological status, mechanism, scope), and assigns named positions at the leaves. Unoccupied combinations are marked with diagnoses, and the predictive-processing branch is included as a unique junction. Named positions that the tree cannot distinguish are flagged.  

  ---

  ### **Root Question: Core Commitment**  
  **Claim:** *"Phenomenal consciousness—as ordinarily conceived (e.g., intrinsic, private, immediately accessible 'what-it-is-like' qualities)—fails to match reality."*  
  - **If you agree:** Proceed to **Axis 1 (Ontological Status)**.  
  - **If you disagree:** You are not an illusionist; exit the tree.  

  ---

  ### **Axis 1: Ontological Status**  
  **Claim:** *"The failure occurs because phenomenal properties* **do not exist at all** *— there is nothing in reality they refer to."*  
  - **If you agree:** You endorse **total denial of phenomenal properties**. Proceed to **Axis 2 (Mechanism)**.  
  - **If you disagree:** You endorse **denial of our standard conception only** (i.e., phenomenal properties exist, but not *as* intrinsic/private/immediate). Proceed to **Axis 2 (Mechanism)**.  

  ---

  ### **Axis 2: Explanatory Mechanism**  
  **Claim:** *"The illusion arises primarily through:*  
  - **(M1) Representational misrepresentation:** *Physical/functional properties (e.g., neural states) are systematically misrepresented as having phenomenal qualities.*  
  - **(M2) Conceptual error:** *We apply an incoherent or empty category (e.g., 'qualia') to our mental states.*  
  - **(M3) Pragmatic fiction:** *The appearance is a useful social construct for coordination, not a descriptive truth.*"  
  Choose **one** mechanism (M1, M2, or M3).  
  - **After choosing:**  
    - If you chose **total denial** (Axis 1), proceed to **Axis 3 (Scope)**.  
    - If you chose **denial of standard conception** (Axis 1), proceed to **Axis 3 (Scope)**.  

  ---

  ### **Axis 3: Scope of Illusion**  
  **Claim:** *"The illusion applies to:*  
  - **(S1) Global scope:** *All aspects of phenomenal consciousness (every 'seeming' state is infected by illusion).*  
  - **(S2) Local scope:** *Only specific features (e.g., transparency, unity across senses, or intrinsic 'what-it-is-like'-ness), but other aspects are veridical.*"  
  Choose **one** scope (S1 or S2).  
  - **After choosing:** Proceed to **Predictive-Processing Junction**.  

  ---

  ### **Predictive-Processing Junction**  
  **Claim:** *"Adopting a predictive-processing/hierarchical-inference model of cognition* **forces** *a specific answer about the illusion mechanism (Axis 2) or scope (Axis 3)."*  
  - **If you agree:**  
    - It forces **M1 (representational misrepresentation)** because prediction-error minimization inherently generates misrepresentations of internal states.  
    - It forces **S1 (global scope)** because all conscious experiences are inferential constructs.  
    *(If your prior choices conflict, note the tension here.)*  
  - **If you disagree:** It does not constrain prior choices.  
  **Proceed to assign your leaf position.**  

  ---

  ### **Leaf Positions**  
  Based on your path (Axis 1 → Axis 2 → Axis 3), assign your position:  

  #### **Path A: Total Denial (Phenomenal Properties Do Not Exist)**  
  - **M1 + S1:** **Strong Representational-Eliminativist Illusionism** (e.g., Frankish). *Predictive-processing note: Often compatible, but not required.*  
  - **M2 + S1:** **Strong Conceptual-Error Illusionism** (e.g., Dennett). *Predictive-processing note: Rarely invoked; may conflict with M1.*  
  - **M3 + S1:** **Strong Pragmatic-Fiction Illusionism** (e.g., fictionalist interpretations of Dennett). *Predictive-processing note: No direct link; pragmatic fictions are convention-based.*  
  - **Unoccupied Combinations:**  
    - **M1/M2/M3 + S2:** Logically incoherent. Total denial requires global scope (S1), as local scope (S2) implies residual real properties.  

  #### **Path B: Denial of Standard Conception Only (Phenomenal Properties Exist, But Not as Conceived)**  
  - **M1 + S1:** **Global Representational-Error Illusionism** (e.g., early Frankish variants). *Predictive-processing note: Natural fit; forces M1+S1.*  
  - **M1 + S2:** **Local Representational-Error Illusionism** (e.g., Graziano's "attention schema" theory). *Predictive-processing note: Compatible, but may not force S2.*  
  - **M2 + S1:** **Global Conceptual-Error Illusionism** (e.g., Rylean interpretations). *Predictive-processing note: Unlikely; conceptual errors are language-based, not inference-based.*  
  - **M2 + S2:** **Local Conceptual-Error Illusionism** (e.g., Wittgenstein-inspired views). *Predictive-processing note: No connection.*  
  - **M3 + S1:** **Global Pragmatic-Fiction Illusionism** (e.g., radical interpretation of Brandom). *Predictive-processing note: Tension; pragmatic fictions are social, not architectural.*  
  - **M3 + S2:** **Local Pragmatic-Fiction Illusionism** (e.g., "folk phenomenology" as useful fiction). *Predictive-processing note: No constraint.*  
  - **Unoccupied Combinations:**  
    - **M2 + S1 / M3 + S1:** Unattractive. Global scope (S1) with conceptual/pragmatic mechanisms risks conflating *error* with *total unreality*.  
    - **M1 + S1 (without predictive processing):** Neglected. Few defend global representational error without invoking predictive architectures.  

  ---

  ### **Flagged Ambiguities**  
  - **Dennett's position** cannot be cleanly separated into M2 or M3; it hybridizes conceptual error (M2) and pragmatic fiction (M3). The tree forces a choice, but in practice, these mechanisms coexist.  
  - **Predictive-processing-based illusionism** (e.g., Hohwy, Clark) is **not** a distinct leaf. It is a sub-variant of M1+S1, and the junction tests if respondents see it as *forcing* that path.  

  ---

  ### **How to Use**  
  Navigate from the **Root** by selecting answers to each claim. Your path determines your leaf position. The tree:  
  - Avoids bibliographic demands (relies on reasoning).  
  - Includes predictive processing as a non-redundant junction.  
  - Marks unoccupied combinations (with diagnoses: incoherence, unattractiveness, neglect).  
  - Flags ambiguous named positions.  

  This taxonomy captures under-discussed distinctions (e.g., local illusionism about specific features) and avoids "encyclopedic" breadth by focusing on the three axes and predictive-processing constraint.
