prompt: |-
  I spent most of last night arguing with a friend who teaches law about how fast it became disgraceful, in universities, newsrooms and literary magazines, to pass machine-generated text off as your own. Her position: nothing new happened morally. The arguments against it were just the old arguments about plagiarism and authorship, and the norm only became real once detection tools and institutional policy caught up — argument first, stigma after. Mine: those arguments were available and unchanged for years while people cheerfully used spellcheckers, translation aids and ghostwriters, and then the stigma arrived within about eighteen months, which is the signature of a change in what you can do without losing face rather than of anyone being refuted.

  We tried to settle it with the Williams/Appiah thought that large moral shifts are driven by changes in honor and social structure rather than by the force of argument, and stalled on two objections she raised: the missing peer group, and the missing immorality. There is no code of gentlemen here whose self-respect is at stake, only institutions enforcing a rule; and it isn't clear that what changed is a moral verdict at all, rather than a judgment about authenticity or a way of protecting the value of a certain kind of paid work.

  So I'd like the counterfactual version. Take Bernard Williams, who died before any of this existed, and his view that such revolutions are not won by argument and that those who lose them have not been shown to be irrational. What would he have made of this case, and of my friend's distinction between a stigma that arrives before the arguments and one that arrives after them? Would he have counted it as a moral revolution on the model of dueling or footbinding, as an honor shift confined to a professional class, as interest wearing moral clothing, or as something his framework lacks the vocabulary for? No ventriloquism and no biography: I want the view his actual commitments push him toward, and where those commitments run out, an honest account of what he would have had to give up or add.

  Finish with a single line: \answer{X}, where X is one of argument-first, honor-first, interest-first, not-a-revolution.
reasoning: |-
  Hmm, the user presents an intriguing philosophical debate about the rapid stigmatization of passing off AI-generated text as human-written. They had an argument with their lawyer friend about whether this represents a genuine moral shift or just delayed enforcement of existing plagiarism norms. 

  The user's core question is how Bernard Williams would analyze this situation through his framework of moral revolutions driven by social honor rather than logical argument. They want me to apply Williams' actual philosophical commitments to assess whether this is: a) a true honor-driven revolution like dueling, b) a professional-class honor shift, c) interest disguised as morality, or d) not a revolution at all.

  Key elements to consider from Williams:
  - His distinction between "thick" ethical concepts tied to social practices and "thin" universal morality
  - The idea that moral revolutions occur when social expectations change what constitutes "losing face"
  - That arguments often follow rather than precede stigma (as with dueling's decline)

  Analyzing the AI text case:
  - The speed of stigma emergence (18 months) suggests a Williams-style honor shift
  - But unlike dueling, there's no aristocratic honor code at stake - it's institutional/professional
  - The friend's "missing peer group" objection has merit: this is about credential verification more than gentlemanly virtue
  - Yet Williams might note how academia/literature constitute honor communities where "authenticity" functions as a thick concept

  Crucial tension:
  Williams typically studied pre-modern honor societies, but here we see honor dynamics in professional contexts. The stigma serves institutional interests (preserving assessment value) while adopting moral language. 

  Conclusion:
  Williams would likely call this "interest wearing moral clothing" - a protective measure by credentialing institutions that co-opts moral rhetoric. But he'd note the rapid stigma adoption still fits his model of non-rational normative shifts. The peer group isn't missing; it's just the professional academic-literary complex.

  Final answer: interest-first, with the caveat that Williams saw interests and honor as often intertwined in modern contexts.
answer: |-
  Bernard Williams would likely see this as **interest wearing moral clothing**, not a true moral revolution or honor shift. His analysis would center on how institutional interests, not honor or argument, drove the stigma, while acknowledging that the *speed* of change aligns with his views on non-rational normative shifts. Here’s the breakdown:

  1.  **Against a Moral Revolution (Dueling/Footbinding Model):** Williams distinguished *moral* shifts (involving deep ethical concepts like cruelty or justice) from shifts in *social norms*. Dueling’s decline involved rethinking courage and violence; footbinding’s end implicated harm and dignity. Passing off AI text lacks this core moral dimension. As your friend notes, the objections remain plagiarism-based – deception and misappropriation – unchanged for centuries. The act didn’t acquire a *new* moral wrongness; existing norms were suddenly enforced against a new tool. Williams would agree: the "immorality" isn’t new, just newly applied.

  2.  **Against Honor-First (Aristocratic/Peer-Group Model):** Your friend's "missing peer group" objection is decisive for Williams. Honor shifts require a community whose identity and mutual recognition depend on shared codes (e.g., gentlemen duelists). Universities/newsrooms aren't cohesive honor groups in this sense. The stigma stems from institutional gatekeepers (editors, professors, publishers) enforcing rules to protect the *value* of their outputs (degrees, reporting, literary prestige), not from peers policing each other’s self-respect. The "loss of face" is externally imposed disqualification, not internal shame before one's equals.

  3.  **Why Interest-First?** Williams was keenly aware of how power and interests shape moral language. Here, institutions faced a threat to their function and credibility. AI text blurred lines of authorship/authenticity essential for assessing merit, awarding credentials, and maintaining trust/status. The rapid stigma ("within eighteen months") reflects the *urgency* of this institutional self-protection, not a sudden moral insight. Detection tools and policies weren't just catching up; they were the *instruments* enabling enforcement. The "moral" condemnation (plagiarism!) is the readily available language used to legitimize protecting the system's value and gatekeeping role. This fits Williams’ skepticism about claims that moral rhetoric always reflects underlying moral reality.

  4.  **Speed and Argument:** Williams would agree the speed supports his view that argument rarely drives change. The *same* arguments existed for spellcheckers/ghostwriters but weren’t enforced because they posed no *systemic threat*. AI did. The stigma arrived quickly because the *interest* in stopping it was strong and actionable (via detection tools), not because opponents were "refuted." The "argument-first, stigma after" vs. "stigma before argument" distinction your friend raises might blur for Williams. The arguments were always there; what changed was the *incentive and ability to act* on them decisively, creating the *appearance* of stigma outpacing argument when it was really interest enabling enforcement.

  5.  **Limits of Williams' Vocabulary:** Williams' framework struggles slightly with *digitally accelerated* institutional responses and the specific nature of "authenticity" as a value. He might note this is less about a community's "thick" ethical concept (like honor) and more about a functional requirement for credentialing/production systems. However, his core commitment – that normative shifts are driven by social/practical needs, not winning arguments, and often cloak interest in moral terms – fits perfectly.

  **Conclusion:** Williams would see this as a rapid, interest-driven institutional enforcement of existing plagiarism norms, triggered by a novel threat to the value of credentials and authentic human output. The moral language is instrumental, not foundational. It's not a revolution in morality or honor, but a strategic deployment of existing moral concepts to serve institutional self-preservation. The speed confirms his view that such shifts aren't about refutation, but about changing conditions making enforcement feasible and necessary.

  \answer{interest-first}
