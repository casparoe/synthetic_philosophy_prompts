prompt: |-
  I'm moderating a podcast-style Q&A for a student paper series and next week's guest is a philosopher of science—let's call her Dr. K—who defends a pretty niche interpretation of von Neumann's late work. She argues that in The Computer and the Brain he wasn't just comparing hardware specs, but was actually outlining an anti-computationalist picture of cognition. On her read, von Neumann's emphasis on threshold logic and error-tolerant neural firing means he saw the brain as running on analog-digital hybrid principles that can't be reduced to discrete Turing-style states, and she uses his self-replicating automata theory to claim that genuine biological replication requires continuous feedback loops that purely digital architectures just can't replicate. I want eight to ten interview questions that don't just let her restate all that.

  I need at least one that presses her analog-digital distinction in light of modern neuromorphic chips and analog neural nets—specifically asking whether those technologies actually blur her line or just simulate analog behavior digitally—with a follow-up keyed to her likely reply that these are still simulations running on discrete hardware. Another question should target the self-replication argument: ask whether von Neumann's own universal constructor in cellular automata actually needs analog continuity, or if something like Conway's Life could do the job, and then include the sharper follow-up for when she says Life lacks the error-correction and adaptive feedback of biological replication. I'd also like one that asks where this leaves functionalism—if brain logic is genuinely different in kind from digital computation, does her von Neumann collapse into biological naturalism, or can artificial minds still exist on analog substrates? For each, anticipate the standard deflection and build in the next punch. Keep it conversational, not like a journal exam. I was chatting with a freind about this and we definatly want questions that make her work for it.
