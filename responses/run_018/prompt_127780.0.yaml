prompt: |-
  I am on the committee drafting this year's PhD comprehensive exam in moral philosophy. I need one 90-minute essay question that examines the debate between Daniel Dennett and Gregg Caruso on just deserts and punishment, but it must not be answerable by summarizing their standard positions. The question should require candidates to work through Dennett's claim that elbow room—a naturalized, evolutionary variety of free will—is sufficient to ground the reactive attitudes that underpin moral desert, and Caruso's counter that modern neuroscience undermines the kind of deep metaphysical freedom required for genuine desert, leaving only a public-health-quarantine model of social control. To prevent simple regurgitation, embed a synthetic challenge: present a hypothetical penal framework—graded reactive accountability—under which sanctions are scaled to deterrence and rehabilitation needs rather than to moral desert, yet retain a symbolic acknowledgment of wrongdoing intended to preserve communal moral practice. Ask candidates to determine whether this framework genuinely reconciles Dennett's pragmatic compatibilism with Caruso's hard incompatibilism, or whether it secretly collapses into one side, and require them to locate the exact conceptual crux—e.g., whether symbolic acknowledgment presupposes a desert claim that Caruso rejects, or whether Dennett's functionalist account of moral community can survive without it.

  Please deliver:
  - The exam question itself, precisely worded for a 90-minute response.
  - A model answer of approximately 600 words.
  - A marking scheme out of 20 points, listing five must-hit conceptual moves, the marks allocated to each, and a brief line identifying how candidates typically fail on that point.

  Total response must not exceed 950 words. Do not include bibliographies, citation lists, or requests for further reading. Do not use verbatim quotations from published texts; paraphrase any references. The prompt should be answerable entirely from general philosophical training without web access.
