  Below is a decision-tree handout structured as requested. It begins with a concrete root case (e.g., a legal code requiring both disclosure and non-disclosure of specific information) and branches through logically independent questions. Positions are mapped to leaves, with unnamed combinations diagnosed. The tree yields 7 leaves (5 named, 2 unnamed), and flags one unresolved overlap.

  ---

  **Decision Tree: Conflicting Obligations in Institutional Normative Systems**  
  **Root Case**: A maximally authoritative institutional code (e.g., a legal statute) entails both "Agent X must disclose information Y" (O(A)) and "Agent X must not disclose information Y" (O(¬A)) with no meta-rules, ambiguity, or interpretive errors to resolve the conflict. Both obligations are equally binding and hierarchically irreducible.  

  ### Branch Questions  
  Answer sequentially without presupposing labels:  

  1. **Is the contradiction merely an artifact of formalizing the institutional code?**  
     - **Yes**: The conflict arises from oversimplified logical translation (e.g., misrepresenting context-dependent rules).  
     - **No**: The conflict is structural; the code itself generates genuine obligations for both A and ¬A.  

  2. **(If structural) Should classical logic be preserved by revising the institutional framework?**  
     - **Yes**: Resolve the conflict by amending/eliminating one obligation to restore consistency.  
     - **No**: Adjust the underlying logic to accommodate conflicting obligations.  

  3. **(If logic adjusted) Do we block logical explosion (ex falso quodlibet) while denying that contradictions can be *true*?**  
     - **Yes**: Paraconsistent approach (conflicts are "tolerated" but not ontologically affirmed).  
     - **No**: Dialetheic approach (some contradictions, including normative ones, are literally true).  

  4. **(If logic adjusted) Is this logical adjustment restricted to normative/institutional domains?**  
     - **Yes**: Conflicts are unique to institutional reality (e.g., legal or regulatory systems).  
     - **No**: Extends to all domains (e.g., empirical science, metaphysics).  

  5. **What is the primary motivation for this approach?**  
     - **Logical**: Protect non-trivial inference (e.g., avoid explosion in deontic reasoning).  
     - **Metaphysical**: Respect the structure of reality (e.g., institutions as socially constructed facts).  
     - **Pragmatic**: Preserve institutional function despite incoherence (e.g., prioritize dispute resolution).  

  ### Decision Tree & Leaves  
  ```  
                                [Root: Genuine O(A) ∧ O(¬A)]  
                                         │  
                                       Q1: Artifact?  
                                         ├── Yes → Q5: Motivation?  
                                         │         ├── Logical → **Unnamed**  
                                         │         ├── Metaphysical → **Unnamed**  
                                         │         └── Pragmatic → **Institutional Deflationism**  
                                         │  
                                         └── No → Q2: Preserve classical logic?  
                                                   ├── Yes → Q5: Motivation?  
                                                   │         ├── Logical → **Classical Reconstructionism**  
                                                   │         ├── Metaphysical → **Unnamed**  
                                                   │         └── Pragmatic → **Classical Reconstructionism**  
                                                   │  
                                                   └── No → Q3: Block explosion but deny true contradictions?  
                                                             ├── Yes (Paraconsistent) → Q4: Domain-restricted?  
                                                             │         ├── Yes → Q5: Motivation?  
                                                             │         │         ├── Logical → **Domain-restricted Paraconsistent Revisionism**  
                                                             │         │         ├── Metaphysical → **Unnamed**  
                                                             │         │         └── Pragmatic → **Unnamed**  
                                                             │         │  
                                                             │         └── No (Global) → Q5: Motivation?  
                                                             │                   ├── Logical → **Global Paraconsistent Revisionism**  
                                                             │                   ├── Metaphysical → **Unnamed**  
                                                             │                   └── Pragmatic → **Unnamed**  
                                                             │  
                                                             └── No (Dialetheist) → Q4: Domain-restricted?  
                                                                       ├── Yes → Q5: Motivation?  
                                                                       │         ├── Logical → **Unnamed**  
                                                                       │         ├── Metaphysical → **Domain-restricted Dialetheism**  
                                                                       │         └── Pragmatic → **Unnamed**  
                                                                       │  
                                                                       └── No → Q5: Motivation?  
                                                                                 ├── Logical → **Global Dialetheism**  
                                                                                 ├── Metaphysical → **Global Dialetheism**  
                                                                                 └── Pragmatic → **Unnamed**  
  ```  

  ### Leaf Positions  
  - **Institutional Deflationism** (Artifact? Yes; Motivation: Pragmatic)  
    - The conflict disappears under improved formalization; institutions function via pragmatic negotiation, not logical precision.  
  - **Classical Reconstructionism** (Structural? Yes; Preserve classical? Yes; Motivation: Logical/Pragmatic)  
    - Revise the code to eliminate conflicts; motivated by preserving rational coherence (logical) or institutional efficacy (pragmatic).  
  - **Domain-restricted Paraconsistent Revisionism** (Structural? Yes; Adjust logic? Yes; Non-dialetheist? Yes; Domain-restricted? Yes; Motivation: Logical)  
    - Use paraconsistent logic *only* for normative systems to block explosion while denying true contradictions; ensures tractable conflict resolution.  
  - **Global Paraconsistent Revisionism** (Structural? Yes; Adjust logic? Yes; Non-dialetheist? Yes; Domain-restricted? No; Motivation: Logical)  
    - Extend paraconsistency universally; normative conflicts reflect broader logical constraints on inference.  
  - **Domain-restricted Dialetheism** (Structural? Yes; Adjust logic? Yes; Non-dialetheist? No; Domain-restricted? Yes; Motivation: Metaphysical)  
    - Normative institutions *literally* generate true contradictions (e.g., "obligation gaps" in social reality), but empirical facts remain consistent.  
  - **Global Dialetheism** (Structural? Yes; Adjust logic? Yes; Non-dialetheist? No; Domain-restricted? No; Motivation: Logical/Metaphysical)  
    - Contradictions are ontologically real (metaphysical) or inevitable in rational systems (logical); extends to all domains (e.g., Priest’s dialetheism).  
  - **Unnamed Combinations**  
    - *Artifact + Logical/Metaphysical motivation*: Unattractive; deflating formalization without pragmatic justification undermines logical rigor.  
    - *Structural + Classical + Metaphysical motivation*: Incoherent; revising institutions for "metaphysical consistency" misplaces abstract criteria onto social practices.  
    - *Other unnamed leaves*: Unexplored; e.g., paraconsistency/dialetheism with purely pragmatic motivations lacks systematic advocacy.  

  ### Flagged Overlap  
  - **Global Dialetheism (Logical) vs. (Metaphysical)**: The tree separates these by motivation (Q5), but in institutional practice, both endorse identical conflict-tolerant logics. A student cannot distinguish them via institutional outcomes alone.  

  ### Key Features  
  - **Concrete-first**: Begins with a real-world case of irreducible normative conflict.  
  - **Question-driven**: Branches avoid named positions until leaves.  
  - **Diagnostics**: Unnamed leaves include one-sentence justifications (unattractive, incoherent, unexplored).  
  - **Self-contained**: No external citations needed; usable as a standalone seminar resource.  

