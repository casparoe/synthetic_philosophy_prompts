answer: |-
  Lol please — the lazy-drift model completely misses the friction when dissent *does* breach the walls. You think people just passively ignore contradictory info? Nah, they actively *unfriend*, block, mock, or label dissenting voices as "bots," "shills," or "misinfo." Algorithms feed the beast, sure, but the immune response is visceral: kick the heretic out of the group chat, downvote the uncomfortable study into oblivion, dismiss facts as "outside the Overton window." That's not drift; that's a community enforcing dogma through social sanction. Without that normative moat, mere exposure bubbles would pop way easier when reality pokes holes. Come on, you've seen it happen — someone posts CDC data counter to the groupthink and gets ratioed into silence. That ain't accidental.
