answer: |-
  ## Seminar Handout: Probing Hempel's "Explanation Sketches"

  **Context:** In Carl Hempel's "The Function of General Laws in History" (1942), he anticipates the objection that historians rarely state explicit laws. His response (the focal passage):

  > "It might be said... that the general regularities assumed in explanations offered by historians are... taken from some field of scientific research, and are perhaps not even stated by the historian himself because he regards them as well-known... In many cases, this is undoubtedly true; but it does not affect the point... that the *validity* of the explanation... depends upon the tacit assumption of some such general regularity... Very frequently... the universal hypotheses underlying an explanation are... vaguely associated commonsense knowledge... In such cases, the explanation... is... an *explanation sketch*. Such a sketch consists of a more or less vague indication of the laws and initial conditions considered as relevant, and it needs 'filling out' in order to turn it into a full-fledged explanation."

  **Dialogue: The Nature of the Tacit Background**

  **Characters:**
  *   **Elena (Philosopher):** Defends Hempel. Sees the covering-law model (CLM) as the underlying logical structure of *all* scientific explanation, including history. The "sketch" is incomplete but points towards this structure.
  *   **David (Historian):** Skeptical of CLM. Argues Hempel's "tacit background" isn't just unstated universal laws; it's something fundamentally different in kind, rooted in historical practice.

  **(The dialogue begins after Elena has summarized Hempel’s point about explanation sketches.)**

  **David:** Elena, I appreciate you highlighting that passage. It *is* crucial because it’s where Hempel acknowledges what historians actually *do*. But I think he misdiagnoses the nature of that “vague indication” and the “common-sense knowledge” we rely on. He assumes it’s just implicit *laws*, waiting to be “filled out.” That’s not my experience.

  **Elena:** I see where you’re coming from, David. But Hempel’s point is logical, not psychological. He’s not saying historians consciously think in terms of laws. He’s saying that *for the explanation to be valid*, for it to actually *explain why* something happened rather than just describe it, it *must* implicitly rely on some general regularity connecting antecedents to consequents. The vagueness is a practical concession, not a refutation of the model’s logic.

  **David:** But that’s precisely where the problem lies for me. *What* is being presupposed? When I explain why the French Revolution took a radical turn in 1793, am I truly presupposing a universal law like “Whenever conditions X, Y, Z obtain in an agrarian monarchy facing fiscal crisis and external war, radicalization occurs”? That feels artificial. What I’m drawing on isn’t a law, but something more like *plot* – the narrative logic of revolution drawn from comparative cases. Or *precedent* – how similar dynamics played out in the English Civil War. Or *institutional know-how* – understanding how the Committee of Public Safety *functioned* in a context of perceived existential threat. Or even the audience’s shared *sense of human and political behavior* – that fear breeds paranoia, that power vacuums invite extremism. This isn’t vague *law*; it’s complex, context-sensitive, narrative understanding.

  **Elena:** Let’s dissect that. You mention “fear breeds paranoia.” Isn’t that *precisely* the kind of rough, psychological generalization Hempel has in mind? It *is* a claim about a regular connection between a type of cause (fear) and a type of effect (paranoia). It may not be perfectly universal or exceptionless – few laws in any science are – but it points to a regularity. Similarly, precedents and “plot” function as *inductive bases* for expecting certain outcomes under certain conditions. They *embody* general expectations, even if we don’t state them formally. The CLM isn’t committed to physicists’ precision; it’s committed to the idea that explanation requires showing the event was *to be expected* given certain conditions and regularities.

  **David:** But *how* general? And how deterministic? Fear *often* breeds paranoia, but not always, and crucially, *how* it breeds paranoia in Robespierre in 1793 depends entirely on the specific web of relationships, ideas (like Rousseau’s *volonté générale*), institutional structures (the Convention, the Sections), and contingent events (Danton’s perceived betrayal). The “regularity” you extract – fear -> paranoia – is so abstract it loses all explanatory power for the *specific* historical outcome. My explanation works by showing how *this particular configuration* led to *this result*, using narrative to trace the contingent, path-dependent process. The “background” isn’t a set of laws to apply; it’s the toolkit for constructing a coherent, plausible narrative *within that specific context*. The validity comes from the narrative’s internal coherence and fit with the evidence, not its deduction from universal premises.

  **Elena:** I agree narrative is essential for conveying the complex path. But the CLM isn’t opposed to narrative; it seeks its logical foundation. For your narrative to be *explanatory*, it must implicitly claim that *given* the Jacobin ideology, *given* the threats, *given* human psychology, the radicalization *was a likely outcome*. That “likely” implies a probabilistic regularity. If you truly believed that, under *identical* initial conditions (including all psychological states and contextual factors), a radically different outcome was just as probable, then your narrative wouldn’t explain why it happened *this* way. The expectation embedded in the narrative *is* the shadow of a law-like regularity. Making it explicit clarifies what your explanation actually commits you to.

  **David:** That’s my challenge back to you, Elena. *What*, *exactly*, needs to be made explicit for my explanation of the Terror to count as “complete” under CLM? Spell out the universal or probabilistic law governing that specific complex event. I contend you *cannot* formulate it without either making it so vague it’s trivial (“Major societal upheavals under stress *sometimes* lead to violence”) or so specific it’s useless outside that exact case (“When conditions *exactly* like France 1789-1793 obtain, radicalization occurs”). Neither captures what my narrative explanation does. Historians *don’t* articulate such laws, not out of laziness, but because the explanation *resides in the narrative itself*. The “filling out” Hempel demands isn’t a refinement; it’s a translation into a different language – one that loses the essential historical texture and the way explanation emerges from the *arrangement* of particulars.

  **Elena:** The demand for “filling out” isn’t about replacing narrative or demanding laws of infinite specificity. It’s about identifying the *relevant* general factors invoked. For the Terror, it might involve probabilistic generalizations about: group dynamics under high stress and perceived betrayal; the tendency of revolutionary vanguards to centralize power when facing internal/external threats; the logic of ideological purity spirals. These *could* be stated more explicitly, drawing on sociology or psychology. Their vagueness in historical writing is precisely why Hempel calls it a “sketch.” The failure to articulate them *is* an incompleteness because it leaves the logical grounds of the explanation – *why* these causes led to *that* effect – implicit and untested. Making them explicit allows scrutiny: *Is* this psychological mechanism valid? *Is* this institutional dynamic generalizable? It strengthens the explanation.

  **David:** But that scrutiny happens *within history*! We debate the plausibility of the narrative, the weight given to different factors (ideology vs. economics vs. individual agency), the interpretation of motives, the comparability of precedents. We test it against new evidence about *that specific case*, not by trying to falsify a pseudo-law. The “relevance” of factors isn’t determined by a covering law; it’s determined by their role in making the *narrative* coherent and convincing *for that historical moment*. The “background” isn’t a set of laws we test; it’s the evolving *craft knowledge* of historians – how to read sources, recognize patterns of action, understand institutional logics within their time – that allows us to construct compelling narratives. Hempel reduces this rich, situated, interpretive practice to the mere tacit invocation of insufficiently explicit laws. He concedes the practice exists but fundamentally mischaracterizes its logic.

  **Elena:** And I see Hempel as providing the logical skeleton that makes that rich practice scientifically respectable. Without some appeal to general regularities – however qualified, probabilistic, or rooted in “human nature” – history risks becoming just a collection of unique stories, where one explanation is as good as another, based only on rhetorical skill. The CLM insists that even narrative explanation must ultimately rest on claims about how the world *generally* works. The “explanation sketch” is a recognition of where the work remains to be done, or where the regularities are too complex for crisp formulation, not a fundamentally different *kind* of explanation.

  **David:** And I see the CLM as imposing an alien standard derived from physics onto a discipline whose explanatory power lies precisely in its ability to capture singularity, contingency, and meaning within complex webs of human action. The “work to be done” isn’t filling out laws; it’s refining our narrative understanding and interpretive frameworks. The tacit background *is* the different kind of explanation – it’s narrative explanation itself.

  **(The dialogue ends here, the fundamental disagreement unresolved.)**

  ---

  **Core Unresolved Question for Discussion:**

  *   **Is Hempel's "explanation sketch" best understood as...**
      *   **(Elena's View):** ...an *incomplete but fundamentally sound* scientific explanation, pointing towards an underlying covering-law structure that needs further (though perhaps difficult) explication to achieve full logical rigor? (CLM as the ideal logical form).
      *   **(David's View):** ...a *misleading characterization* of a distinct mode of historical understanding, where the "tacit background" (plot, precedent, craft knowledge, contextual understanding) constitutes the *actual logic* of narrative explanation, which is irreducible to the deduction or probabilistic expectation from universal laws? (CLM as a category error for historical narrative).
