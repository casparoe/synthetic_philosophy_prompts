  I am a high school student defending, at our school's interdisciplinary symposium, the thesis that technological path dependence is usually overstated compared to institutional path dependence, through a framework I term reversal asymmetry: exogenous adoption shocks can be undone, but endogenous network-cost cascades genuinely lock outcomes in place, so QWERTY persisted not because history is frozen but because switch costs scaled with user base, whereas U.S. metric-system failure was an exogenous legislative veto that remains reversible. The audience includes three AP History teachers who treat empirical case studies as decisive, two economics undergraduates who understand network-effect models, and one visiting doctoral student in economic history who distrusts theoretical frames invented by non-specialists; they value concrete evidence, reject jargon without primary documentation, and will defend canonical examples such as railroad-gauge standardization and the VHS-versus-Betamax format war. Please prepare my Q&A defense as a numbered list of exactly five items, each one to two sentences long, with no introduction or conclusion, written in American English: order the objections from most damaging to least damaging; phrase each objection in the vocabulary this audience would use; include a concise reply I can deliver in under ninety seconds; note where that reply is weakest; and designate the fifth item as the question I am hoping nobody asks—specifically, the objection that forces me to defend reversal asymmetry for the metric-system case without access to legislative primary sources.
