answer: |-
  ## Proposal: Untangling Causation from Agency in Non-Human Historical Actors (Germs, Climate, Volcanoes)

  **1. Core Research Question:**
  Can we consistently distinguish between *causal protagonism* (where a non-human event like a plague or volcanic eruption functions as a major, necessary cause that decisively reshapes human options and narrative trajectories) and *agential protagonism* (where historical narratives implicitly or explicitly attribute goal-directed behavior, interests, or "intent" to the non-human factor itself) in historical explanations? Does this distinction hold practical utility for analyzing cases like the Black Death, the Tambora winter, the 536 AD event, and 19th-century cholera?

  **2. The Gap in Existing Debates:**
  The standard "environmental determinism vs. human agency" framework often conflates these two forms of protagonism. Critics of determinism rightly reject the notion that non-human forces rigidly *determine* human outcomes, emphasizing complex mediations and human choices. Proponents highlighting environmental impact often stress the sheer *causal weight* of events like pandemics or eruptions. However, **both sides frequently miss the nuance of *how* the non-human element functions within the narrative structure itself.** Attributing heavy causal weight (causal protagonism) is not the same as treating the volcano *as if* it aimed to create a gothic novel (agential protagonism). This conflation obscures the specific ways historians narrate non-human influence and risks either dismissing valid causal analysis as determinism or uncritically accepting metaphorical agency as real explanation.

  **3. Method:**
  *   **Conceptual Analysis:** Precisely define "causal protagonism" (narrative necessity, constraint/opportunity creation, irreplaceable catalyst) and "agential protagonism" (attribution of purpose, strategy, interest, anthropomorphic action verbs).
  *   **Case Study Narrative Dissection:** Analyze key historical narratives (secondary sources, potentially primary chronicles) for each of the four cases:
      *   **Black Death (1347-1351+):** Feudal labor shifts & societal collapse narratives.
      *   **Tambora Eruption (1815):** "Year Without a Summer" (1816) & the genesis of *Frankenstein* narratives.
      *   **536 AD Volcanic Winter:** Narratives of societal crisis, migration, and potential political/religious shifts.
      *   **19th-Century Cholera Pandemics:** Urban reform (sanitation, public health) narratives.
  *   **Classification Tree Development:** Based on the analysis, create a simple, practical decision tree for historians. This tool will guide them in categorizing their *own* or others' descriptions of non-human factors by asking:
      1.  Is the non-human factor presented as a *necessary condition* for the observed human changes? (Yes/No → Causal Weight)
      2.  Does the narrative *depend* on this factor to explain a decisive shift in possibilities? (Yes/No → Causal Protagonism)
      3.  Are verbs/descriptions applied to the factor that imply *purpose, strategy, or interests* (e.g., "the plague *targeted*," "cholera *forced* reform," "the volcano *wreaked havoc* intending...")? (Yes → Agential Protagonism / Metaphor; No → Causal Protagonism)
      4.  Is the factor treated as an *actor within the story* comparable to human agents, or as the *context/enabling condition* for human actions? (Actor → Agential Risk; Context → Causal)

  **4. What Success Looks Like:**
  A clear, defensible, and *useful* distinction between causal and agential protagonism emerges. The classification tree proves practical for historians to:
  *   Critically evaluate their own narrative language and implicit assumptions.
  *   Precisely articulate the role of non-human factors without inadvertently invoking problematic determinism or unexamined agency.
  *   Structure explanations that robustly acknowledge the immense causal impact of germs, climate, and geology while respecting the complexity of human response and avoiding anthropomorphic pitfalls. Success means enabling richer, more nuanced discussions of non-human historical influence.

  **5. What Failure Looks Like:**
  *   The distinction proves impossible to maintain consistently across the cases, collapsing under analysis into mere semantics.
  *   The classification tree is too abstract, cumbersome, or fails to capture the nuances of actual historical writing, rendering it useless for practicing historians.
  *   The analysis reveals that agential language is so deeply embedded and metaphorical in historiography that separating it cleanly from causal claims is impractical or unproductive for explanation. The project yields no actionable insight.

  **6. Honest Scope Check (3 Months, Part-Time):**
  Focusing on **four specific, well-documented cases** is feasible. The primary activity will be intensive reading and analysis of key historical narratives (approx. 1-1.5 weeks per case). Developing and refining the initial classification tree based on this analysis is core. Output will be a workshop framework, draft classification tool, and case study summaries. **This is not:**
  *   A comprehensive history of any event.
  *   An exhaustive survey of all historiography on non-human actors.
  *   A resolution of the determinism/agency debate itself.
  *   Original archival research.
  The tight timeline necessitates reliance on established secondary sources and focused conceptual work centered squarely on the proposed distinction within the chosen cases. The cholera case provides a valuable 19th-century counterpoint to the pre-modern examples. (typo: "particualr")
