  "Epistemic double standard" feels close but too vague. Needs to capture the temporal asymmetry... Ah! "Temporal asymmetry in institutional epistemology" - but clunky. "Survival-to-value inference" is core but incomplete. Maybe "adaptive conservatism"? Too positive. 

  Wait - the circularity is the key. Old institution: survival proves hidden function → keep. New proposal: no survival record → reject. But survival record can only exist if implemented! Classic bootstrapping problem. "Institutional bootstrapping"? Or "conservative epistemic loop"... 

  Best shot: "Hidden Function Circularity." Definition must include: (1) initial fence argument (2) survival-as-proof pivot when challenged (3) asymmetrical demand for new proposals to preemptively prove absence of hidden flaws AND demonstrate survival-proof they can't possibly have. 

  Boundary case: If someone admits an institution has no current function but keeps it for aesthetic reasons? That's not this - here they insist on hidden functionality. Also, if new proposal gets rejected solely on merit without invoking unknowns? Different animal. 

  User's sharp - they'll spot if we don't address why this isn't just risk aversion. Crucial: risk aversion applies equally, but here old institutions get "risk credit" while new ones get "risk penalty" for identical epistemic uncertainty. That's the asymmetry. 

  Final name needs to telegraph the bait-and-switch... "Conservation Through Unfalsifiability"? Too mouthy. Stick with "Hidden Function Circularity" and define tightly. User wants surgical precision - they're mapping argument patterns, probably for thesis work. Better over-deliver on nuance.
answer: |-
  ### 1. Bottom Line  
  This pattern is a self-reinforcing epistemic asymmetry I call **Hidden Function Circularity (HFC)**. It weaponizes uncertainty to favor entrenched institutions while blocking novel alternatives: old systems gain "survival credit" as proof of hidden value, while new proposals face "uncertainty penalties" for lacking historical validation. It differs from Chesterton's fence by adding a **survival-to-value inference** and **asymmetric risk thresholds**, transforming a cautionary heuristic into a closed loop protecting tradition.

  ---

  ### 2. The Carving: Phenomenon, Boundaries, and Distinctions  
  **Core Mechanism**: HFC exploits two complementary moves:  
  - **Survival-to-Value Inference**: An institution’s persistence is reinterpreted as evidence of *unobservable* adaptive functions when its original purpose becomes obsolete.  
  - **Asymmetric Uncertainty Burdens**: New proposals are rejected for potential *unknown risks*, while old institutions are shielded by their *unknown virtues*. This creates a double bind: new institutions cannot prove "hidden value" without existing long-term, yet are disqualified for lacking precisely that proof.  

  **What It Is Not**:  
  - It’s **not mere inertia** (e.g., bureaucratic stagnation). HFC actively constructs *epistemic justifications* for preserving the old and rejecting the new.  
  - It’s **not generic risk aversion**. Risks of change are hyperbolized, while risks of stagnation (e.g., ossification, unmet needs) are ignored.  
  - **Boundary**: HFC activates only when an institution’s *original rationale* is defunct. If defenders cite *known* current functions, it collapses into ordinary conservatism.  

  **Edges**:  
  - Applies to *social institutions* (laws, norms, hierarchies), not technologies or markets (where "survival" has clearer metrics).  
  - Requires a veneer of *epistemic humility* ("we can’t know the hidden order") to mask circularity. Pure authoritarianism ("keep it because I say so") falls outside this model.  

  ---

  ### 3. Residue / Near Misses: Why Existing Concepts Fall Short  
  - **Chesterton’s Fence**: Merely advises *understanding* before dismantling. It doesn’t demand proving a fence’s *current* necessity, nor does it claim survival *itself* justifies preservation when original reasons vanish. HFC hijacks the fence as Step 1, then pivots to survivalism when the fence’s purpose is debunked.  
  - **Path Dependency**: Explains *how* institutions persist (e.g., sunk costs, network effects), but not *why* their persistence is framed as *virtuous*. Path dependency lacks HFC’s normative claim that survival *proves* latent functionality.  
  - **Status Quo Bias**: A broad preference for existing states. HFC is a subtype that *rationalizes* this bias through:  
    - (a) **Dynamic reinterpretation** (survival = hidden value),  
    - (b) **Asymmetric scrutiny** (old systems exempt from proving current utility).  
  Plain status quo bias lacks this epistemic machinery.  

  ---

  ### 4. Provisional Name and Tight Definition  
  **Name**: **Hidden Function Circularity (HFC)**  

  **Definition**:  
  > *A conservative argumentative strategy where:*  
  > 1. *An institution’s historical persistence is retroactively interpreted as evidence of unobservable adaptive functions when its original purpose is negated.*  
  > 2. *Novel alternatives are rejected for lacking proof against unknown risks, while simultaneously being denied the temporal opportunity to develop such proof.*  
  > *This creates an unfalsifiable defense of entrenched institutions by assigning asymmetric epistemic burdens to change vs. stasis.*  

  **Boundary Cases**:  
  - **Inside HFC**: Defending the Electoral College after slavery/state-size arguments collapse by claiming "its endurance proves it stabilizes democracy in ways we can’t articulate." Replacing it with a national popular vote is then rejected because "we can’t predict its hidden destabilizing effects."  
  - **Outside HFC**:  
    - Keeping a law *despite admitting* it has no current function (tradition without epistemic claims).  
    - Rejecting a new policy *only* on concrete risks (e.g., cost projections), not abstract "unknowns."  
    - Accepting a new institution as a "replica" of an old one (e.g., renewing expiring legislation), avoiding the novelty penalty.  

  **Key Differentiator**: HFC’s core is the **temporal asymmetry**—survival *becomes* proof for the old, while the *absence* of survival is fatal to the new, despite identical epistemic limitations.
