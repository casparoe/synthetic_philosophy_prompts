  First, where does this live? Political epistemology for sure - it's about justification structures and knowledge claims in institutional reasoning. But also decision theory with its asymmetric risk assessment. The old gets benefit of doubt via "unknown virtues," new gets penalized via "unknown risks" - same unknown, opposite valence. 

