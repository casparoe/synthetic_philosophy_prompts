prompt: |-
  hey, im a phil of science phd working on functional explanation and i keep running into this specific argumentative slide. someone argues that feature F is important because evolution 'designed' it for job J -- say, sleep spindles for memory consolidation -- but then when you press them on whether J is actually what F does mechanistically right now, they pivot to saying well F participates in pathway P so it 'functions' in the system regardless of origin. they act like these are two angles on the same fact, but they're not: J might be a just-so story and P might be a spandrel. is there an actual name for this move where evolutionary origin and current system-role get smuggled together under one word? i know about the two theories of function but im asking about the rhetoric, not the ontology. if theres no term, coin one and say exactly how it differs from plain equivocation. please answer in exactly five numbered points, each one or two sentences, with no introduction or conclusion.
reasoning: |-
  Okay, the user is a Philosophy of Science PhD student focusing on functional explanation, encountering a specific argumentative issue. They describe a scenario where someone claims a feature F is important because evolution designed it for job J, but when pressed, they pivot to saying F participates in pathway P, thus it functions regardless of origin. The user points out that J might be a just-so story and P a spandrel, and wants to know if there's a name for this rhetorical move that conflates evolutionary origin with current system-role.

  First, I need to recall relevant concepts in philosophy of biology. There's the etiological theory of function (based on evolutionary history) versus the dispositional or systemic role theory (current causal role). The user seems familiar with this distinction but is asking about the rhetorical tactic that conflates these two. 

  The user mentions "just-so stories" and "spandrels," which refer to Gould and Lewontin's critique of adaptationism. So the issue here might be someone presenting an adaptationist explanation (etiological) but switching to a systemic role when challenged. That's a bait-and-switch tactic, using the ambiguity of the term "function."

  I wonder if there's an existing term for this. "Teleological smuggling" comes to mind, implying smuggling in purpose from evolution. Or "functional equivocation," playing on the ambiguity of "function." Since the user asked to coin a term if none exists, I should propose something precise. 

  The key elements are the shift from etiological to systemic function without acknowledging the difference. The user wants to highlight the rhetorical sleight of hand. "Etiological-systemic conflation" is straightforward but maybe too academic. "Selection-role conflation" is more specific. 

  Also, considering the user's deeper needs: as a PhD student, they might be looking for a precise term to critique arguments in their field. They need a sharp conceptual tool to call out this move in academic discourse. They might also want to distinguish this from plain equivocation by emphasizing the specific domains being conflated. 

  So possible terms: "Functional Teleological Smuggling," "Selection-Role Conflation," "Adaptationist Pivot." Among these, "Functional Teleological Smuggling" captures the illicit transfer of purpose. "Selection-Role Conflation" is more descriptive. The user might prefer a term that clearly separates it from general equivocation by specifying the types of function involved. 

  I'll suggest "Functional Teleological Smuggling" as the coined term, explaining how it differs from equivocation by the specific types of function being conflated. The numbered points will clearly outline the concept, the move, the coined term, how it differs, and the rhetorical effect.
answer: |-
  1.  This move is **Functional Teleological Smuggling**, where the teleological force of an *etiological function* claim (evolution designed F *for* J) is illicitly transferred to bolster a weaker *dispositional/systemic role* claim (F currently contributes *to* P).
  2.  It exploits the ambiguity of "function" to create an argumentative slide: the persuasiveness of the design/selection narrative (implying necessity/importance for J) is used to validate the mere current participation in P.
  3.  It differs from simple equivocation by specifically conflating two distinct *types* of functional attribution (etiological vs. dispositional) under the same term, masking the potential disconnect between evolutionary origin and current causal contribution.
  4.  The smuggled element is the *normative or privileged status* implied by "design," making the current systemic role (P) appear more significant or intentional than a purely mechanistic description warrants.
  5.  This rhetoric protects the adaptationist claim (F is *for* J) from falsification by retreating to the safer systemic role (F is *involved in* P), while still leveraging the perceived purpose derived from the evolutionary story.
