          - If yes: classify as C and stop.
          - If no: proceed to Step 3.

     Step 3: Examine the earliest attestation (T_att) for legendary accretion:
          - Look for: supernatural elements, divine interventions, anachronisms (elements that did not exist in the time of the setting but are present in the narrative), and heroic exaggerations (feats beyond human capability, single-handedly defeating armies, etc.).

