     The procedure is grounded in the epistemic distinction:
          - Evidential independence: evidence that does not rely on the narrative for interpretation.
          - Narrative dependence: when we have to use the narrative to interpret the evidence, we disregard it as independent.
          - Legendary accretion: assessed at the earliest attestation.

