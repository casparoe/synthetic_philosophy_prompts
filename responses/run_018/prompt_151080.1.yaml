answer: |-
  ### Curatorial Classification Procedure for Origin Narratives

  **Grounding Principles:**
  - **Evidential Independence**: Material or textual evidence that does not require the narrative itself for interpretation (e.g., archaeology, contemporary documents from unrelated sources).
  - **Narrative Dependence**: Evidence only interpretable through the narrative (e.g., later texts citing the story as fact).
  - **Legendary Accretion Velocity**: Rate of supernatural/heroic/anachronistic motifs accumulating relative to the earliest attestation. Measured by:
    - **Low Velocity**: Minimal accretion in earliest attestation; motifs develop slowly.
    - **High Velocity**: Significant accretion in earliest attestation; motifs proliferate rapidly.

  **Procedure Flowchart**  
  *Execute tests sequentially. Stop at any "no" or final classification.*

  1. **STEP 1: Establish Chronology**  
     - Identify:  
       - `T_set`: Historical setting of the narrative (e.g., "1250 BCE").  
       - `T_att`: Date of earliest attestation (written record).  
       - Calculate `time_gap` = `T_att` - `T_set`.  
     - **Sufficiency**: Clear dates from standard references (e.g., Oxford Classical Dictionary).  
     - **Branch**: Proceed to Step 2.

  2. **STEP 2: Contemporary Independent Evidence?**  
     - Check: Material/textual evidence **within ±200 years of `T_set`** that corroborates **core events** (e.g., battles, leaders, migrations) without relying on the narrative.  
     - **Sufficiency**: Archaeological reports or external documents (e.g., Hittite tablets for Troy).  
     - **Branch**:  
       - **Yes** → Proceed to Step 3.  
       - **No** → Proceed to Step 4.  
     - **Judgment Call**: Deciding "core events" (e.g., "Was Troy sacked?" is core; "Achilles’ heel" is not).

  3. **STEP 3: Contradictory Evidence?**  
     - Check: Does contemporary evidence **directly negate** core events?  
     - **Sufficiency**: Clear contradiction (e.g., Egyptian records showing no Hebrew slaves in Exodus period).  
     - **Branch**:  
       - **Yes** → **CLASSIFY C** (Legend without recoverable history).  
       - **No** → Proceed to Step 6.  

  4. **STEP 4: Non-Contemporary Independent Evidence?**  
     - Check: Evidence **after `T_set` but before/at `T_att`** supporting core events (e.g., inscriptions, archaeology).  
     - **Sufficiency**: Must predate or be contemporary with `T_att` (e.g., pre-Homeric Troy strata).  
     - **Branch**:  
       - **Yes** → Proceed to Step 5.  
       - **No** → **CLASSIFY C** (Legend without recoverable history).  

  5. **STEP 5: Contradictory Non-Contemporary Evidence?**  
     - Check: Does evidence directly negate core events?  
     - **Branch**:  
       - **Yes** → **CLASSIFY C**.  
       - **No** → **CLASSIFY B** (Legend with recoverable kernel).  

  6. **STEP 6: Legendary Accretion Velocity**  
     - Analyze `earliest_attestation` for:  
       - Supernatural elements (gods, miracles).  
       - Heroic exaggerations (single-handedly killing armies).  
       - Anachronisms (objects/ideas from `T_att` era in `T_set`).  
     - **Velocity Judgment**:  
       - **Low**: Few/no such motifs; plausible human actions.  
       - **High**: Pervasive motifs; implausible events.  
     - **Branch**:  
       - **Low Velocity** → **CLASSIFY A** (Historical account with legendary overlay).  
       - **High Velocity** → **CLASSIFY B** (Legend with recoverable kernel).  
     - **Judgment Call**: Subjectivity in motif severity. Flag if ambiguous.  

  **Simplification Rules**:  
  - Keep: `T_set`/`T_att` dates, evidence independence, accretion in earliest attestation.  
  - Drop: Later literary developments, minor narrative variants.  

  ---

  ### Application to Cases  
  **Case 1: Trojan War at Hisarlık**  
  - **Step 1**: `T_set` = 1180 BCE (Late Bronze Age collapse). `T_att` = Homer’s *Iliad* (~750 BCE). `time_gap` = 430 years.  
  - **Step 2**: **Yes**. Archaeology shows violent destruction at Hisarlık (Troy VIIa) c. 1180 BCE. Hittite texts mention "Wilusa" (Ilion) and conflicts.  
  - **Step 3**: **No** contradiction.  
  - **Step 6**: **High Velocity**. Earliest attestation (*Iliad*) has divine interventions (Aphrodite rescuing Paris) and heroic excess (Achilles’ rage).  
  - **Classification**: **B** (Legend with recoverable kernel).  
    *Board Note: Proposal claims "historical account" (A), but high accretion forces B.*  

  **Case 2: King Arthur as Post-Roman Leader**  
  - **Step 1**: `T_set` = 500 CE (post-Roman Britain). `T_att` = *Historia Brittonum* (828 CE). `time_gap` = 328 years.  
  - **Step 2**: **No**. No contemporary evidence (e.g., Gildas’ *De Excidio* ignores Arthur).  
  - **Step 4**: **No**. Later "evidence" (e.g., Glastonbury cross) is narrative-dependent.  
  - **Classification**: **C** (Legend without recoverable history).  
    *Board Rejection Expected*: Popular belief in a kernel. Procedure forces **C** due to **no independent evidence**.  

  **Case 3: Exodus as National-Origin Legend**  
  - **Step 1**: `T_set` = 1250 BCE (Ramses II). `T_att` = Biblical text (~600 BCE). `time_gap` = 650 years.  
  - **Step 2**: **No**. No Egyptian records of Hebrew slavery/exodus.  
  - **Step 4**: **No**. Sinai archaeology shows no mass wandering; Merneptah Stele (1207 BCE) places Israel in Canaan.  
  - **Classification**: **C** (Legend without recoverable history).  
    *Board Note: Aligns with proposal.*  

  ---

  ### Limitations and Override Necessity  
  **Where It Misfires**:  
  1. **Oral Traditions**: Pre-`T_att` transmission (e.g., Celtic legends) lacks textual evidence but may preserve history. Procedure defaults to **C**.  
  2. **Lost Evidence**: Events in poorly documented eras (e.g., pre-literate societies) misclassify as **C** even if plausible.  
  3. **Ambiguous Evidence**: Requires curator judgment (e.g., Is Troy VIIa "proof" of Homer’s war?).  
  4. **Cultural Motifs**: Heroic elements may reflect cultural norms, not pure fiction. Velocity assessment is subjective.  

  **Never Use For**:  
  - **Modern Events** (<500 years): Archival abundance makes accretion velocity irrelevant.  
  - **Pure Mythology** (e.g., creation myths): No `T_set` to test.  
  - **Ethnographic Narratives**: Dependent on anthropological context; procedure is Eurocentric/text-centric.  

  **Why Override?**  
  - **New Evidence**: Procedure is snapshot; new discoveries (e.g., inscriptions) may change outcomes.  
  - **Narrative Nuance**: Core events may be misidentified (e.g., Arthur as symbol vs. person).  
  - **Scholarly Shifts**: Consensus changes (e.g., Troy’s significance pre/post-1990s excavations).  

  **Final Note**: This procedure ensures consistency but cannot replace expertise. Curators **must override** when evidence is contested or humanistic interpretation outweighs mechanistic checks.
