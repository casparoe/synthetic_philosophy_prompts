answer: |-
  ## Research Proposal: Horizontal Defection vs. Vertical Entrenchment: Disaggregating Mechanisms of Honor-Driven Norm Collapse in Dueling and Slavery

  **Working Title:** Beyond Unified Revolutions: Signaling Games and the Structural Typology of Honor Norm Collapse

  **1. Core Research Question:**  
  Does the collapse of honor norms like dueling genuinely support Kwame Anthony Appiah’s unified "honor-world" model of internal contradiction, or does it instead necessitate a fundamental disaggregation of moral revolution mechanisms into distinct *horizontal* (peer-to-peer) and *vertical* (hierarchical) types, challenging both Appiah and Bernard Williams’ materialist thesis?

  **2. Problem Statement & Gap Identification:**  
  Existing dominant frameworks for explaining the collapse of historically entrenched honor norms like dueling, slavery, and foot-binding present seemingly incompatible but overly monolithic accounts. Appiah’s *The Honor Code* argues these norms collapse when internal contradictions (e.g., dueling violating the gentlemanly ideal of reason; slavery violating emerging notions of shared humanity) erode the *credibility* of the honor code amongst its adherents, making adherence unsustainable. Bernard Williams, conversely, in works like *Shame and Necessity*, emphasizes the primacy of material interests, status competition, and power structures, viewing shifts in honor discourse as largely *epiphenomenal* – rationalizations for changes driven by underlying socioeconomic or political shifts.

  While both frameworks offer valuable insights, my analysis suggests they inadequately capture a critical structural distinction evident in comparing dueling and slavery: the nature of the social *game* sustaining the norm. Dueling primarily operated as a **horizontal peer-to-peer signaling game** among (relatively) equal status claimants (gentlemen). Slavery, in stark contrast, was embedded within **vertical hierarchies** of economic exploitation, legal codification, and asymmetric power relations. This structural difference, largely overlooked in the current debate, suggests the *mechanisms* of collapse may be fundamentally distinct. Appiah treats all cases as parallel instances of "credibility collapse," while Williams reduces honor's role across the board. Neither model adequately explains *why* the specific trigger for collapse in dueling (individual refusal becoming credible within a cohort) differs so radically from the complex, multi-level struggles required to dismantle slavery.

  **3. Central Thesis:**  
  I argue that the collapse of dueling exemplifies a distinct **horizontal peer-defection mechanism** specific to peer-to-peer signaling games. This collapse occurs when a critical mass within the relevant status cohort credibly defects from the norm (refusing challenges) *without requiring* fundamental economic restructuring or top-down moral conversion, leveraging the inherent fragility of mutual recognition among peers. Conversely, slavery’s embeddedness in vertical power structures necessitates a **vertical institutional rupture mechanism**, involving coordinated challenges across different societal strata (subaltern resistance, economic shifts, legal/political intervention, *and* shifts in elite honor discourse). Appiah’s credibility condition is necessary but insufficient; Williams underestimates honor’s causal role in horizontal games while correctly emphasizing materiality in vertical ones. A successful theory of normative change must disaggregate "moral revolution" into these structural types.

  **4. Methodology (Conceptual & Comparative Analysis):**  
  This project employs a rigorous **conceptual-comparative methodology** focused on theoretical model-building and critique:
  *   **Step 1: Model Explication:** Precisely reconstruct Appiah’s "honor-world/collapse-by-contradiction" model and Williams’ "material-interest/epiphenomenal honor" thesis, identifying their core mechanisms for normative change in the target cases.
  *   **Step 2: Structural Analysis:** Analyze the social ontology of dueling and slavery through the lens of game theory (signaling games) and social ontology. Characterize dueling as a decentralized, peer-enforced *coordination/signaling equilibrium* among relative equals, and slavery as a *hierarchical power equilibrium* sustained by asymmetric enforcement and economic dependence.
  *   **Step 3: Mechanism Disaggregation:** Develop the proposed typology: **Horizontal Peer-Defection Mechanism** (reliance on mutual recognition; vulnerability to coordinated defection within a peer group; minimal external structural change required) vs. **Vertical Institutional Rupture Mechanism** (reliance on layered power structures; requires disruption across economic, legal, political, and discursive levels; resistance from subaltern groups is crucial but insufficient alone).
  *   **Step 4: Comparative Case Application:** Apply both the Appiah/Williams models *and* the proposed typology to the historical collapses of dueling and slavery in the 19th century. Evaluate which framework best explains the *specific sequence and actors* involved in each collapse, focusing on the locus of defection (peers vs. multiple levels) and the nature of the required change (shift in mutual expectations vs. systemic overhaul). Foot-binding will serve as a secondary point of contrast to test the typology’s applicability to a hybrid case.
  *   **Step 5: Synthesis & Critique:** Synthesize findings to argue that while Appiah identifies a necessary condition (credibility loss), and Williams identifies crucial enabling factors (material interests), only the disaggregated typology adequately explains the *distinct causal pathways* observed. This reveals a limitation in treating "honor norms" as a unified category for explaining collapse.

  **5. Work Plan (Realistic Semester Timeline):**
  *   **Weeks 1-2:** Finalize proposal; Deep dive into core Appiah & Williams texts; Initial literature scan on dueling/slavery collapse mechanisms.
  *   **Weeks 3-5:** Complete Step 1 (Model Explication); Begin Step 2 (Structural Analysis: Signaling Games/Hierarchies); Draft core conceptual sections.
  *   **Weeks 6-8:** Complete Step 2; Begin Step 3 (Mechanism Disaggregation - defining Horizontal/Vertical types); Refine thesis argument.
  *   **Weeks 9-11:** Complete Step 3; Conduct Step 4 (Comparative Case Application: Dueling & Slavery); Write analysis sections.
  *   **Weeks 12-13:** Complete Step 4 (incorporate Foot-binding contrast); Conduct Step 5 (Synthesis & Critique); Draft conclusion.
  *   **Weeks 14-15:** Revise & polish full draft; Tighten argumentation; Ensure conceptual clarity; Final proofreading.

  **6. Assessment of Success & Failure:**
  *   **Success:** The project will be successful if it:
      *   Clearly demonstrates a significant structural distinction between the social embedding of dueling (horizontal/peer) and slavery (vertical/hierarchical).
      *   Convincingly argues that Appiah’s unified model and Williams’ reductionist thesis cannot adequately account for the *different mechanisms* of collapse observed in these cases.
      *   Develops a coherent and useful typology (Horizontal Peer-Defection vs. Vertical Institutional Rupture) that provides greater explanatory power for these specific cases.
      *   Shows how peer-defection relies on signaling dynamics distinct from both Appiah’s internal contradiction *and* pure Williams-style interest convergence.
      *   Offers a plausible explanation for why dueling collapsed relatively rapidly via cohort-level shifts, while slavery required protracted, multi-faceted struggle.
  *   **Failure:** The project would fail if it:
      *   Cannot sufficiently differentiate the mechanisms behind dueling's and slavery's collapse beyond Appiah/Williams.
      *   Fails to articulate the peer-defection mechanism clearly or show how it differs significantly from existing models.
      *   Overstates the distinction, neglecting overlapping elements or failing to convincingly apply the typology.
      *   Loses focus on the core question of whether dueling supports a unified model or necessitates disaggregation.
      *   Produces a typology that lacks analytical purchase or feels forced onto the historical cases.

  **7. Scope & Feasibility (Honest Assessment):**  
  This project is ambitious but feasible for one semester within the proposed 8,000-word limit and conceptual methodology. The focus on *disaggregating mechanisms* through a *comparison of two core cases* (dueling & slavery) is manageable. Key scope limitations:
  *   **Depth per Case:** The analysis will rely on established secondary historical accounts of the collapses, not original archival research. Depth will focus on *interpreting* these collapses through the theoretical lenses, not uncovering new historical facts.
  *   **Foot-binding:** Will be included as a comparative touchstone to test the typology's reach but not analyzed with the same depth as dueling/slavery.
  *   **Causal Complexity:** While arguing for distinct primary mechanisms, the proposal acknowledges that real-world change involves interaction effects. The goal is to show the *dominant* structural logic, not deny all complexity.
  *   **Theoretical Breadth:** The focus remains tightly on challenging Appiah and Williams regarding mechanisms of honor-driven collapse via this structural typology. Engaging deeply with all adjacent literatures (e.g., full social movement theory, complex game theory models) is beyond scope.

  This project offers a novel structural lens derived from signaling games to challenge prevailing monolithic theories of normative change centered on honor, promising a more nuanced understanding of how moral revolutions actually unfold.
