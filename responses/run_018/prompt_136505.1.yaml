  I'm taking a senior seminar on moral philosophy and normative change, and I need a polished, two-page research proposal for an 8,000-word term paper. My half-formed idea is this: Appiah's honor-world framework treats dueling, slavery, and foot-binding as parallel cases in which internal contradictions make honor norms unsustainable, while the Williams thesis treats the same shifts as driven by material and status interests with honor playing only an epiphenomenal role. I suspect both miss a structural distinction specific to peer-to-peer signaling games. Dueling collapses, I want to argue, through horizontal peer-defection—when refusal to accept a challenge becomes credible within a local cohort without requiring either broad economic restructuring or a top-down moral argument—whereas slavery is embedded in vertical economic and legal hierarchies that cannot dissolve through cohort-level refusal alone. I want the proposal to state the precise question—whether the collapse of dueling genuinely supports the unified honor-world model or instead requires disaggregating moral-revolution mechanisms into vertical, horizontal, and hybrid types—explain why the existing positions leave this open, lay out a conceptual-comparative method (not archival research) with a realistic month-by-month plan, specify what a successful result looks like and what would count as failure, and give an honest assessment of scope for one semester. I should not ask for a bibliography, reading list, or citations; I will fill those in myself. The proposal should build in my niche framing—distinguishing horizontal peer-defection from both Appiah's credibility-condition model and from pure interest convergence—without relying on obscure texts or specific quotations. Can you draft this?
