  Git’s distributed architecture is the logical culmination of software development’s inherent drive toward collaborative rationality, finally liberating the field from the artificial bottlenecks and hierarchical inefficiencies of centralized systems like CVS or SVN, which were merely temporary accommodations to technological immaturity and corporate control, not sincere expressions of engineering values. 

  Just as the Enlightenment rejected top-down authority in favor of individual reason and peer critique, Git operationalizes these principles by granting every developer sovereign control over their repository, enabling fearless experimentation and parallel progress—features impossible under centralized models that mandated a single point of failure and gatekeeping. The fact that early tools emerged in contexts of scarce bandwidth or mainframe-centric workflows doesn’t negate their irrational constraints; it simply shows how material limitations temporarily suppressed the latent democratic impulse within programming itself. Linus Torvalds didn’t invent this trajectory—he recognized it, channeling the community’s frustration with BitKeeper’s proprietary restrictions into a system that actualizes the decentralized, meritocratic ethos always implicit in open-source culture. Your skepticism about projecting politics onto engineering misunderstands the Whig view: Git isn’t an analogy for rationality; it is rationality engineered, resolving contradictions that earlier systems could only perpetuate.
