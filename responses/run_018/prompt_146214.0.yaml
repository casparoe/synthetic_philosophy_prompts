prompt: |-
  I'm a longtime reader of rationalist forums, and I recently encountered the one-liner "you can't own an idea" deployed in a thread about synthetic training data and model distillation. Someone used it to dismiss the concern that copying a large model's weights into a smaller system amounts to a kind of theft, but the phrase seemed to slide between at least two objections—copying specific parameter values versus reproducing a functional architecture—without clarifying which one it was meant to dissolve.

  Before I respond, I want the phrase disambiguated into its precise theses: the tautological reading (ideas are abstract objects lacking spatiotemporal location, so physical-property rules don't apply); the economic reading (ideas are non-rivalrous goods, so enclosure creates deadweight loss without solving scarcity); the normative reading (all intellectual property regimes are illegitimate regardless of incentive effects); and the technological reading (once an idea is instantiated in weights or outputs, the idea-expression distinction collapses and nothing remains to own). For each, please indicate whether it is a platitude, a defensible policy claim, or actually false, and specifically say which versions, if any, would justify treating the copying of distilled weights as morally or legally unproblematic. I'm particularly interested in whether any of these readings require going beyond standard copyright's idea-expression dichotomy to a stronger claim—something like "functional architectures are inherently unownable"—and whether that stronger claim is compatible with existing patent or trade-secret frameworks. Present the readings as a menu with verdicts rather than defending one, since I need to map exactly which interpretation supports the dismissal in that thread.
