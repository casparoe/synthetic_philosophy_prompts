answer: |-
  1.  Assign three students as "Signal Maintainers" (duty-bound to send periodic "all clear" signals), one as "System Operator" (visible oversight role), and ten as "Observers"; secretly note one Observer as "Budget Cutter" who slashed maintenance funding.
  2.  Run Round One: Signal Maintainers fail to send a critical signal (omission), Observers witness a simulated "disaster"; force all to vote publicly on whether the Maintainers' omission *caused* it, awarding prestige points for persuasive arguments.
  3.  Reveal Round Two: Disclose the hidden "Budget Cutter" Observer whose earlier funding cut structurally prevented *any* signal being sent, despite Maintainers' apparent omission; force a new vote on primary cause (Maintainers vs. Budget Cutter).
  4.  Debrief by mapping Round One's omission (breach of assigned duty) to the normative "map" making absence salient, contrasting with Round Two's structural absence (funding cut) as the unmarked "territory" requiring deliberate framing to be seen as causal.
  5.  Predict students will overwhelmingly blame Maintainers in Round One, overlooking systemic factors; frankly state the simulation cannot intrinsically reproduce the *normative weight* of "should have acted" without explicitly framing the roles as obligational during setup.
