prompt: |-
  I have been discussing causation by omission with friends from a rationalist forum, and we agree that the standard examples—neglected houseplants, missed doses—are too domesticated to make the metaphysical problem feel urgent. I am running a seventy-five-minute graduate seminar in metaphysics for about fourteen students, and I want an in-class simulation that forces them to experience why treating omissions as causes either commits them to counting every background condition or forces an arbitrary normative line around expected maintenance. The particular angle I want injected is the idea of normative framing of absence: an omission only becomes causally salient when an institutional role designates a specific agent as the default maintainer, turning mere absence into a breach rather than background noise. Please design a runnable game with assigned roles, a hidden second round that reveals structural omissions, forced votes on causal attribution, and a prestige-only payoff scheme; include a debrief that maps each round onto the map-territory distinction between absence and cause, predicts what will go wrong the first time I facilitate it, and frankly states which feature—probably the normative loading of should have acted—the simulation cannot reproduce without direct explanation. Present the answer as a numbered list of exactly five items, each one or two sentences long, with no introduction or conclusion, in British English.
