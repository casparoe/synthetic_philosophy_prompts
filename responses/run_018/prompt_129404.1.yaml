answer: |-
  1.  I take the first horn: the undocumented resident does *not* bear the identical institutional burden because they lack the formal authorization *and accountability* inherent in citizenship; they are subject to the system but not a recognized participant in its collective agency.  
  2.  Citizenship isn't merely bearing burdens; it's being a constitutive part of the *authorizing body* that imposes coercive rules on *each other*, creating mutual liability for the outcomes.  
  3.  This mutual liability arises from our joint role in legitimizing the state's actions (through voting, dissent, or even passive acquiescence within the structure), making us responsible *to each other* for harms the collective entity causes.  
  4.  While long-term residents share many burdens and deserve significant moral consideration, they do not share this specific, reciprocal *political liability* for the state's actions generated by the joint venture of co-membership.  
  5.  Therefore, the special obligations among compatriots stem uniquely from this relationship of being mutually liable co-agents within a coercive governance structure – a relationship residency alone does not replicate, preserving the distinctiveness of compatriot duties.
