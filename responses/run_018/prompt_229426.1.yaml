prompt: |-
  I keep going back and forth on whether everyday conventions actually bind us morally, so here are my gut verdicts and I'd like to know what principle, if any, is behind them. An American who leaves no tip at a sit-down restaurant, service perfectly fine, has done something genuinely wrong, almost like shorting the bill. A Japanese tourist on his first day in the US who leaves no tip because he honestly doesn't know the custom: I don't think he's done anything wrong at all, even though the server is just as out of pocket either way. But once his friend explains the custom, he's obliged to tip for the rest of the trip, including the last dinner before he flies home forever and will never face any consequence. A visitor who queue-jumps at a London bus stop has wronged the people waiting even if nobody calls him on it and even if he gets where he's going faster with no harm done. Jaywalking alone at 2am on an empty street feels totally fine in New York where everyone does it, but mildly wrong in Munich where the locals actually wait at the light, which is odd because the law is basically the same in both places. In a country where nobody queues and everyone just crowds the counter, a tourist who joins the crowd does nothing wrong, since there's no convention to violate. But a convention I consider bad, like everyone slipping the clerk a bit of cash to get their forms processed, I'm not convinced a visitor has to go along with, even though by my own logic the clerks presumably now expect and rely on it just like servers rely on tips. Is there one principle that delivers all of these, presumably something about expectations and reliance, or do I have to drop one, and if so is it the unknowing tourist or the bribe that has to go? And what does the best candidate principle say about the case I'm most torn on: whether the locals in the bribe country are themselfs obliged to keep paying, or whether it's only visitors who are off the hook. Please answer in continuous prose, no headings, bullet points, bold, or tables, just written out like an email.
reasoning: |-
  Okay, the user presents a fascinating puzzle about moral obligations arising from social conventions. They've outlined several intuitive judgments about tipping, queueing, jaywalking, and bribery customs across cultures, and are seeking a unifying moral principle that can explain all these varied cases without contradiction. 

  First, let's unpack their core dilemma: they feel conventions create moral obligations in some cases (like tipping in the US) but not others (like bribing officials), and they're particularly torn about whether ignorance excuses non-compliance and whether bad conventions bind locals differently from visitors. The Munich vs New York jaywalking contrast suggests context matters beyond mere legality, while the Japanese tourist case highlights how knowledge triggers obligation.

  Hmm... their examples reveal three key variables: (1) knowledge of the convention, (2) the convention's moral quality (good/bad/neutral), and (3) whether one is a local or visitor. The server's reliance on tips seems central to their intuition about obligation, but they rightly notice this reliance also exists in the bribery case - so why the different judgment? 

  Ah! The distinction might lie in whether the convention serves a legitimate social function versus enabling exploitation. Tipping redistributes income to underpaid workers within an accepted system, while bribery corrupts institutional fairness. This would explain why joining a crowd at a counter feels neutral - it's purely coordinative - but bribing feels actively harmful even if expected.

  For the ignorant tourist: their intuition holds because morality requires capacity to recognize the obligation. No "ought" without "can" understand the "ought". But once informed, the tourist becomes complicit in the reliance relationship - hence obligation kicks in immediately, even for their last meal. Clever how they included that "no consequences" detail to test if obligation is about reciprocity versus principle.

  The queue-jumping case confirms that conventions create legitimate expectations - violating them is a micro-injustice regardless of direct harm. But the jaywalking contrast is subtler: in New York, the convention has effectively modified the norm (making jaywalking acceptable when safe), whereas in Munich the strict adherence maintains the original norm's force. So the operative convention isn't just "what people do" but "what people collectively accept as proper".

  Now their toughest question: are locals bound by bad conventions? Here we might distinguish between participation and perpetuation. Locals may be obligated to follow neutral conventions (like queueing) for social coordination, but have a higher duty to resist harmful ones (like bribery). Visitors get more leeway because they lack both understanding and capacity to change the system - though they still shouldn't actively exploit it (e.g., bribing for personal gain).

  The unifying principle emerging is: conventions create moral obligations when (a) they establish legitimate reliance interests, (b) the convention serves a socially valuable function without intrinsic harm, and (c) the agent knowingly participates in the practice. This handles all their cases except the bribery convention, which fails condition (b). For that exception, we add: participation in harmful conventions is never obligatory, and may be actively wrong regardless of local practice.

  Phew. This preserves their intuition about the blameless ignorant tourist while explaining why bribing feels different from tipping - and why locals might have complex duties regarding bad conventions (e.g., working to change them while avoiding individual harm). The empty-street jaywalking? In New York it's convention-compliant; in Munich it's convention-violating - hence different judgments. All boxes checked.
answer: |-
  Your intuitions reveal a surprisingly coherent moral principle centered on **reasonable expectations, legitimate reliance, and the social function of conventions**. Let's call it the "Reliance and Function Principle." It holds that conventions generate moral obligations when:

  1.  They create reasonable expectations of specific behavior from others.
  2.  Others legitimately rely on those expectations being met for a tangible interest (often financial or concerning fair access/order).
  3.  The convention itself serves a broadly legitimate or neutral social coordination function *without* creating significant, intrinsic harm.

  Applying this principle to your cases:

  *   **American stiffing the server:** The convention creates a reasonable expectation of a tip (part of the server's compensation). The server legitimately relies on this for their livelihood. The convention, while imperfect, serves the function of redistributing income within the service model. Violating it is wrong because it exploits the server's reliance.
  *   **Ignorant Japanese tourist (first day):** The tourist forms no reasonable expectation in the server (the server might reasonably suspect a tourist is unaware). The tourist cannot knowingly exploit reliance they are unaware of. No obligation exists *yet*. No wrong is done.
  *   **Informed Japanese tourist:** Once aware, the tourist *knows* the convention exists and that servers reasonably expect and rely on tips. Choosing to dine within that system means participating in the expectation/reliance relationship. Refusing to tip now *intentionally exploits* the server's reliance, making it wrong, even on the last night. The lack of future consequences doesn't negate the present exploitation.
  *   **Queue-jumping in London:** The queueing convention creates a clear expectation of order and fair access. Others legitimately rely on it to secure their turn efficiently. It serves the neutral, legitimate function of orderly resource allocation. Jumping the queue violates this reasonable expectation and reliance, unfairly disadvantaging others. Harm occurs in the form of unfair displacement, even if minimal time is lost.
  *   **Jaywalking in New York vs. Munich:** Here, the *local convention modifies the expectation and reliance*. In NYC at 2am on an empty street, the *de facto* convention is that it's acceptable. Pedestrians don't reasonably expect strict adherence to the *de jure* law, and drivers don't rely on it (they remain vigilant). The social function (safety) isn't compromised in this specific context. In Munich, the strong convention *is* adherence. Pedestrians and drivers reasonably expect it and rely on that expectation for predictability and safety, even at 2am on an empty street (the function is maintained more rigidly). Violating it in Munich breaches that localized reasonable expectation and reliance, making it feel wrong.
  *   **Crowding the counter (no convention):** There is no established convention creating specific expectations of orderly queuing. People rely on their own assertiveness or luck. Joining the crowd doesn't violate any reasonable expectation or exploit reliance on a non-existent fair-order system. No wrong is done.
  *   **Bad convention (bribes for service):** This is the critical test. While the clerk may *expect* and *rely* on bribes, and the convention "coordinates" access, the principle flags two issues:
      *   **Illegitimate Function:** The convention serves a *harmful* social function – corrupting fair access, undermining institutional integrity, and exploiting citizens. It creates intrinsic harm and injustice.
      *   **Illegitimate Reliance:** The clerk's reliance on bribes as income stems from a corrupt system. This reliance isn't morally legitimate in the same way a server's reliance on tips (within a legal, accepted industry model) is.

  Therefore, the visitor is **not** morally obliged to participate. Participating perpetuates a harmful system. The principle distinguishes between reliance arising from legitimate coordination (tipping, queueing) and reliance arising from systemic corruption. Refusing to bribe, even if it causes friction or delay, avoids complicity in the harm.

  **Applying the Principle to Your Torn Case: Locals and the Bribe Convention**

  This is where the principle helps resolve your uncertainty:

  *   **Visitors:** As above, they are generally **not** obliged to participate in harmful conventions like bribery. Their participation actively sustains the harm. Refusing may be practically difficult, but it is morally permissible and arguably preferable. They are "off the hook" regarding the *convention's* demand, though navigating the system ethically might require other choices (like using official channels, accepting delays, or avoiding the service altogether if possible).
  *   **Locals:** The situation is more complex and burdensome for locals.
      *   **Obligation to Resist?:** The principle suggests locals have a *stronger* moral obligation *not* to participate in the harmful convention because they are part of the system sustaining it. Their participation directly fuels the corruption. There might be a positive duty to resist or work to change the system, though this can carry significant personal risk.
      *   **The Crushing Reality & Mitigation:** However, the principle also acknowledges *context*. If a local faces severe, immediate consequences for non-compliance (e.g., losing vital medical care, job, or facing harassment), and has no viable alternatives or power to change the system, the *wrongness* of paying the bribe might be significantly mitigated or even excused due to duress or lack of reasonable alternative. Their action is still harmful to the system, but their moral agency is constrained.
      *   **No Positive Obligation to Pay:** Crucially, the principle **does not** generate a *positive moral obligation for locals to keep paying bribes* simply because the corrupt expectation exists. The "reliance" of the corrupt official is illegitimate. Paying remains participation in a harmful act, even if sometimes excusable under pressure. The obligation stemming from the convention itself is void because the convention is illegitimate. Their *real* moral obligations lie in minimizing harm and resisting corruption where feasible and safe.

  In essence: The Reliance and Function Principle explains your intuitions well. It grounds obligation in the harm of exploiting reasonable reliance created by conventions serving legitimate/neutral coordination functions. It clearly exempts the ignorant and refuses to bind anyone to harmful conventions. For locals trapped in systems with harmful conventions, it removes any positive obligation to comply based on the convention itself, instead framing participation (even when excusable) as a necessary evil within a corrupt system they should strive to resist or escape, rather than a duty owed to the convention's enforcers.
