prompt: |-
  I'm working through some literature on weakness of will and hyperbolic discounting, and I've noticed a failure pattern that doesn't sit cleanly in either framework. Consider someone who resolves to avoid checking social media during work hours. They don't fail in the familiar akratic way: there is no single dramatic moment where they impulsively reach for the phone while simultaneously judging it best not to. Instead, over several days they make a sequence of individually reasoned adjustments—allowing one check because a specific message might be urgent, allowing another because they have made progress and deserve a brief reward, allowing a third because the environment has changed slightly and the original rule was designed for different conditions. Each step feels like a legitimate local update rather than a surrender to temptation, yet the cumulative result is precisely the behavior they originally wanted to prevent. The erosion is smooth and distributed, with no discrete breach point.

  This produces outcomes that resemble hyperbolic discounting—systematic undervaluation of a long-term plan—but the underlying mechanism seems different. There is no sharp present bias weighing an immediate pleasure against a delayed cost; rather, the evaluative framework itself shifts between planning and execution contexts, with each shift justified on its own terms. It resembles rationalization, but rationalization usually involves recognizing the true reason and concealing it, whereas here the reason genuinely changes with the frame. It also resembles the planner-doer split, but that model typically involves two stable preference orderings in conflict, not a cascade of context-sensitive revisions. Is there an established concept for this kind of distributed, frame-dependent erosion of self-imposed rules—perhaps in discussions of implementation intentions, preference reversal, or diachronic agency? If no precise term exists, how should this be carved off from ordinary akrasia, from hyperbolic discounting as a psychological mechanism, and from strategic self-deception? I want a precise boundary: what exactly the phenomenon is, what it is not, and whether it should be treated as a subtype of weakness of will or as a distinct failure mode altogether.

  Verdict: State whether this corresponds to an established named concept (identify it and say how well it fits), or whether it requires a new distinction; in either case, provide the briefest precise definition of the phenomenon and its boundary with hyperbolic discounting and with discrete akrasia.
