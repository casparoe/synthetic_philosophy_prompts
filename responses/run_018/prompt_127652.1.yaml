answer: |-
  Based on your description, this phenomenon corresponds most closely to **Cumulative Micro-Akrasia (or Preference Drift)**, though it's not a universally established term with fixed boundaries. It aligns significantly with discussions of **diachronic agency, planning failure, and the fragmentation of intention** (e.g., Bratman, Holton, Tenenbaum). Here's the precise analysis:

  1.  **Established Concept & Fit:**
      *   **Core Concept:** **Diachronic Preference Fragmentation** or **Planning Erosion via Contextual Recalibration**.
      *   **Key Thinkers:** Resonates with Bratman's emphasis on the stability of plans over time, Holton's work on resolution and reconsideration, and Tenenbaum's "fragmentation of intention".
      *   **Fit:** Good, but your case highlights a specific *mechanism* of failure: the *incremental, reasoned* (yet cumulatively self-defeating) shift in evaluative frameworks between planning and execution moments, leading to the erosion of the initial plan without discrete akratic conflict. It fits within broader discussions of weakness of will as a failure of *diachronic rationality*.

  2.  **Brief Definition:**
      *   **Phenomenon:** **The cumulative, justified erosion of a prior resolution through a sequence of context-sensitive, locally rational, but globally self-defeating, evaluative adjustments made during plan execution, without discrete moments of judged-best violation.** The failure emerges from dynamic shifts in the agent's normative frame across time.

  3.  **Boundaries:**
      *   **vs. Hyperbolic Discounting (HD):**
          *   **HD:** Failure stems from a *stable but time-inconsistent preference function* where immediate rewards are *disproportionately* valued *at the moment of choice*. The conflict is primarily about *valuation intensity* at different temporal distances.
          *   **This Phenomenon:** Failure stems from *shifts in the normative framework itself* used to evaluate actions. The agent is not (necessarily) misvaluing future consequences *within a single framework*; they are adopting *different, locally justified frameworks* at planning time vs. various execution times. The conflict is about the *applicability and interpretation of the rule/rationale* across contexts. HD might be a *component* (e.g., making "reward" frameworks more appealing), but it's not the *mechanism*.
      *   **vs. Discrete Akrasia:**
          *   **Akrasia:** Involves a *synchronic conflict*: at moment *t*, the agent intentionally performs action *A* while simultaneously judging that *~A* is best/all-things-considered. There is a clear, identifiable moment of acting against one's better judgment *while holding that judgment*.
          *   **This Phenomenon:** Involves *diachronic fragmentation*. At each moment *t_x* when an adjustment is made, the agent genuinely (if mistakenly) judges that action *A_x* (the adjustment) *is* best/all-things-considered *under the current, locally adapted normative frame*. There is *no synchronic conflict* at the point of action; the conflict only becomes apparent retrospectively or when comparing the cumulative outcome to the *original* planning frame.

  4.  **vs. Strategic Self-Deception:**
      *   **Self-Deception:** Requires the agent to *know* (or strongly suspect) the true, less savory motive but actively works to *suppress* or *reinterpret* it to avoid cognitive dissonance. There's a level of bad faith.
      *   **This Phenomenon:** The agent's reasoning is sincere at each step. The shift in frame and justification is not primarily driven by hiding a motive from oneself, but by a genuine (though flawed) responsiveness to perceived changes in context, urgency, or progress that *locally* warrant adjusting the rule. The self-deception, if any, is *emergent* from the cumulative effect, not the driving mechanism per step.

  **Verdict:**

  *   **Correspondence:** This is best understood as a **specific subtype or mechanism of weakness of will**, falling under the broader umbrella of **diachronic planning failure** or **failure of resolve**. It is closely related to **Holton's "reconsideration"** and **Tenenbaum's "fragmentation"** but emphasizes the *incremental, reasoned erosion* via context shifts.
  *   **Term:** While not universally named, **"Cumulative Micro-Akrasia"** or **"Preference Drift via Contextual Recalibration"** accurately captures the essence.
  *   **Distinctness:** It constitutes a **distinct failure mode** from both **synchronic akrasia** (no simultaneous judgment violation) and **hyperbolic discounting** (shifting normative frames, not stable time-inconsistent valuation). It is a form of **diachronic weakness of will** characterized by the **dynamic instability of the evaluative framework supporting a resolution**.
  *   **Definition:** **The justified, incremental abandonment of a prior resolution through repeated, context-driven adaptations of the normative framework used to evaluate adherence, resulting in cumulative failure without discrete synchronic judgment-action conflicts.**
