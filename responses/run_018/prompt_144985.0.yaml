  First, I consider the core challenge: translating complex philosophical concepts into actionable steps while preserving their distinct meanings. Epistemicism suggests there's a hidden fact we don't know, while supervaluationism says multiple interpretations are valid until precisified. The procedure must reflect this difference without requiring philosophical expertise.

  I envision a three-phase checklist:
  1) Objective Thresholds phase handles non-vague criteria like age
  2) Vague Properties phase applies epistemic/supervaluationist treatment to ambiguous attributes
  3) Value Precisification phase forces explicit value choices when indeterminacy persists

  For test cases, I select:
  - The 1923 courthouse as clear yes
  - The 1978 brutalist garage as indeterminate to demonstrate supervaluationism
  - The 1999 community center as hard no to show epistemicism's "hidden cutoff"

  Key design challenges:
  - Preventing "arguing until tired" by structuring debate
  - Preserving philosophical integrity while being usable
  - Handling cases where outcomes feel wrong but are logically sound
  - Explicitly marking where value judgments enter

  The procedure must flag its own limitations - like not resolving demolition debates, just clarifying when values decide. I'll include test sentences to anchor each concept during meetings.

  For the brutalist garage case, I anticipate discomfort to demonstrate that the system won't always give satisfying answers. This highlights how philosophy exposes uncomfortable truths about vague categories.
answer: |-
  Here's a practical decision procedure based on epistemicism and supervaluationism, designed for a 30-minute heritage board meeting. It preserves the philosophical distinction while providing clear stopping points. 

  **The Vague Boundary Decision Procedure (VBDP) for Historical Significance**

  **Core Principles Embedded:**
  1.  **Epistemicism (Hidden Fact):** For *some* properties, there *is* a sharp cutoff (e.g., age), even if we don't know it precisely. We look for objective evidence approaching that cutoff.
  2.  **Supervaluationism (Admissible Precisifications):** For genuinely vague properties (e.g., "architectural merit"), there is no single fact. Significance is only definitively true if it holds under *all reasonable interpretations* ("super-truth"). If interpretations conflict, it's indeterminate.
  3.  **Value Precisification:** When facts (objective or super-truth) are insufficient, the board *must* explicitly make a value judgment to "precisify" the vague term for *this specific case*. This is not finding a fact, but setting policy.

  **The Checklist: Ordered Questions & Flow**

  **Phase 1: Objective Thresholds (Epistemicism Focus)**
  1.  **Age Threshold:** Is the building demonstrably over 50 years old? (Or your locale's defined minimum age).
      *   *Sufficient Answer:* YES (Proceed to Q2). NO (Proceed to Q1a). Inconclusive evidence (Stop: **Determinate NO** - Too new).
      *   *Q1a (If NO to Q1):* Is there *overwhelming, objective evidence* it possesses significance *despite* age? (e.g., revolutionary tech, site of major undisputed event <50 yrs ago, designed by a figure who died young but is unquestionably canonical).
          *   *Sufficient Answer:* YES (Rare! Proceed to Q2). NO (Stop: **Determinate NO** - Age threshold not met).
      *   *Flow Stop:* Clear NO → **Determinate NO**. (Epistemicism: The hidden cutoff exists, and it fails).

  2.  **Intactness Threshold:** Is the building's primary structure and defining character substantially intact (≥75%)? (Focus on physical fact, not value).
      *   *Sufficient Answer:* YES (Proceed to Q3). NO (Stop: **Determinate NO** - Too altered). Inconclusive evidence (Requires site visit; defer decision).
      *   *Flow Stop:* Clear NO → **Determinate NO**. (Epistemicism: Too altered to *be* the historical building).

  **Phase 2: Vague Properties Assessment (Supervaluationism Focus)**
  3.  **Architectural/Historical Merit (The Vague Core):** Would *all reasonable people*, applying *standard historical/architectural practice*, agree this building has significant design, embodies a recognized important style/movement, or is clearly associated with major events/people? (Test for *Super-Truth*).
      *   *Sufficient Answer:* YES (Stop: **Determinate YES** - Super-true significance). NO (Proceed to Q3a). MIXED/SPLIT (Proceed to Q4).
      *   *Q3a (If NO to Q3):* Would *no reasonable interpretation* of significance apply? (Is it utterly mundane, generic, lacking any documented connection?)
          *   *Sufficient Answer:* YES (Stop: **Determinate NO** - Super-false significance). NO or MIXED (Proceed to Q4).
      *   *Flow Stop:* Clear YES → **Determinate YES**; Clear NO → **Determinate NO**. (Supervaluationism: Significance is true/false across *all* admissible precisifications).

  **Phase 3: Indeterminacy & Value Precisification (Policy Choice)**
  4.  **Indeterminacy Flag:** Did Phase 2 (Q3/Q3a) result in MIXED/SPLIT or unresolved disagreement?
      *   *Sufficient Answer:* YES (Proceed to Q5 - **Forced Value Vote**). NO (Procedure should have stopped already! Revisit Phases 1-2).
      *   *Flow Stop:* Triggers the vote. (Supervaluationism: Significance is indeterminate; no super-truth exists).

  5.  **Value-Based Precisification Vote:** *Given the building meets the basic thresholds (Age/Intactness) but its significance is genuinely indeterminate, does this board, acting as stewards for the community, judge it worthy of preservation incentives/delays based on our local values and context?* (Consider: Rarity of type, community attachment, potential for adaptive reuse, contribution to streetscape, cost of preservation).
      *   *Process:* Limited debate (5-10 mins max). Vote YES/NO.
      *   *Outcome:* Majority Vote → **Indeterminate but Preservation-Worthy (YES)** or **Indeterminate but Not Preservation-Worthy (NO)**.
      *   *Flow Stop:* Final Decision. (This is *not* finding hidden significance; it's making a policy choice because the facts run out).

  **Test Sentences for Quick Application:**
  *   **"Would every architecture textbook covering this period mention it or its type as significant?"** (Tests super-truth for Q3)
  *   **"Is it older than the oldest building we've ever said 'no' to for being too new?"** (Tests epistemic age cutoff, Q1)
  *   **"If this vanished tomorrow, would experts *universally* lament a loss to heritage, or just some?"** (Distinguishes super-truth YES vs. Indeterminate)
  *   **"Is its only claim being old and not fallen down?"** (Tests for super-false significance, Q3a)
  *   **"Does protecting this feel like upholding our community's character, even if books ignore it?"** (Guides Value Vote, Q5)

  **Where it Misfires/Will Be Hated:**
  1.  **"Can't Call It" Becomes Policy Vote:** Critics will argue Q5 lets the board "invent" significance. The procedure *admits* this – it's precisifying based on values because the *facts are exhausted*. This will frustrate proponents of pure objectivity.
  2.  **Clear LOSERS:** Buildings failing Q1 or Q2 (too new, too altered) get a hard NO, even if beloved. Epistemic cutoffs hurt. The 1999 Community Center (below) will be hated here.
  3.  **Value Vote Uncertainty:** The Q5 vote lacks the "authority" of a factual determination. People dislike ambiguity.
  4.  **Borderline Demolition:** The procedure *can* justify demolishing a borderline building via Q5 ("Indeterminate but Not Preservation-Worthy"). It doesn't pass the buck; it forces the board to own the value judgment saying "no" despite indeterminacy. This will anger preservationists.
  5.  **"Hidden Fact" Feels Arbitrary:** Applying epistemicism to age (Q1) or intactness (Q2) can feel arbitrary ("Why 50 years? Why 75%?"). The procedure accepts this but uses established thresholds as the best practical sharp cutoffs.

  **What it CAN'T Do:**
  1.  **Eliminate Disagreement:** It structures debate but won't make vague concepts precise *in the world*.
  2.  **Provide Absolute Certainty:** Especially in Q5. It accepts indeterminacy.
  3.  **Define "Reasonable Interpretation":** The board must use professional judgment at Q3/Q3a. Training helps.
  4.  **Override Legal Definitions:** If law defines "historically significant" precisely, use that. This is for *vague* criteria.
  5.  **Make Value Judgments Easy:** Q5 remains hard, but it makes the value basis explicit.

  ---

  **Test Case Applications:**

  **1. 1923 Courthouse (Classic Revival, prominent location, intact, architect was regionally significant)**
  *   Q1: YES (Clearly >50 yrs old).
  *   Q2: YES (Substantially intact).
  *   Q3: **YES** (All reasonable interpretations would find architectural merit (style, quality), historical association (civic function), and age significance. Standard textbooks would cover it regionally. *Super-truth exists*).
  *   **OUTCOME: Determinate YES (Stop at Q3).** *Philosophy Match: Supervaluationism (Super-True).*

  **2. 1978 Brutalist Parking Garage (Unloved but intact example of its type, designed by a competent but not star architect, splits board)**
  *   Q1: YES (Assuming 50-yr threshold, 1978 is >50 yrs old in 2024+).
  *   Q2: YES (Assume it's structurally sound and unaltered).
  *   Q3: **MIXED/SPLIT** (Reasonable experts disagree. Some see merit in its brutalist honesty/rarity, others see pure utilitarian eyesore. Not covered in textbooks as significant. *No super-truth*).
  *   Q3a: **NO** (Some reasonable interpretations *do* find merit - it's not utterly insignificant).
  *   Q4: YES (Indeterminacy Flag triggered - Proceed to Vote).
  *   Q5: Value Vote: *Board weighs:* Rarity of brutalist garages? Community hatred vs. architectural minority view? Adaptive reuse potential? Cost? **Assume Vote: NO** (Board decides it's not worth protecting based on community values/context).
  *   **OUTCOME: Indeterminate but Not Preservation-Worthy (NO).** *Philosophy Match: Supervaluationism (Indeterminate) forcing Value Precisification (Board says NO).* **This result will anger architectural historians who see merit.**

  **3. 1999 Community Center (Well-maintained but generic design, architect only became famous post-2010 for different work)**
  *   Q1: NO (1999 < 50 years old in 2024).
  *   Q1a: Is there overwhelming evidence? **NO** (Architect's later fame doesn't transfer back; building itself is generic, no major events. *Fails the objective "despite age" high bar*).
  *   **OUTCOME: Determinate NO (Stop at Q1a).** *Philosophy Match: Epistemicism (Fails the hidden age cutoff).* **This result will anger community members attached to the center who feel its association *now* with the famous architect makes it significant. The procedure says age is the sharp cutoff, and it fails objectively.**

  **Justifying Demolition of Borderline Buildings:** The procedure **can** definitively justify demolition for buildings that fail Q1, Q2, Q3a (super-false), or receive a NO vote at Q5. The Q5 vote is specifically where the board can say, "Even though it's *possibly* significant (indeterminate), our values say it shouldn't get protection/delays." It **does not** pass the buck; it forces a clear, value-based decision point when facts are insufficient. The buck stops with the board's vote.
