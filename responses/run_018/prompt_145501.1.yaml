prompt: |-
  Build me a thought experiment on logical omnisience that isn't the usual P-and-Q regurgitation. I want a realistic workplace case—say, an accountant checking a 7-step tax formula—where she knows every intermediate line but doesn't recieve the final theorem in belief. The failure shouldn't be fatigue or forgetting; inject a niche bottleneck I'm calling "recursive nesting collapse," where her belief system can only hold three levels of nested conditionals active at once, not a general stupidity thing. After the scenario, show what an ideal-agent model, a resource-bounded model, and a contextualist model each say about whether she knows the conclusion, and identify the structural feature that makes the contextualist peel off. Then say what happens if you strip the nesting limit away. Hard cap: 250 words max, tight prose, no bullet walls. No citations, bibliographies, or "here's three papers." Casual is fine—typos welcome.
