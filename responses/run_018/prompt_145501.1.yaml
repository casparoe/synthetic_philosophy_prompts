  - Resource-bounded says she doesn't (cognitive limit breaks justification) 
  - Contextualist is fun: normally she "knows" casually, but if you highlight the nesting depth ("are you 100% sure about step 7's derivation?"), the standard tightens and she doesn't. The contextual shift is key. 

