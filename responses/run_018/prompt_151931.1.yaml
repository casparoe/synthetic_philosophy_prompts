prompt: |-
  I am a retired physicist who has recently turned to philosophy of mind, and I am leading a small discussion group of fellow retired scientists—engineers and biologists—who are comfortable with formal notation but have no background in philosophy. Next month I wish to present Hofstadter's view that the self, symbolized by the word "I," is best understood as a strange loop: a symbol within a system of symbols that refers back to the system itself and lacks any external, object-like referent. I want a teaching plan, not the lecture itself.

  Please lay out the dependency order: what conceptual piece must be firmly in place before I can introduce the "I" as strange loop, and why a physical analogy of feedback—say, an oscillating circuit or thermostat—must precede any formal analogy drawn from Gödel numbering, yet must also be shown to break down at a precise point. Choose one carrying example drawn from distributed measurement rather than the usual camera-monitor loop or Gödel sentence; specify exactly what feature it must possess so that genuine self-reference is present, and what feature it must conspicuously lack so that the audience does not confuse semantic grounding with signal feedback.

  Then map the misconceptions I should expect: (1) that "strange loop" denotes a literal circular pathway of neurons; (2) that self-reference is nothing more than recursive computation; and (3) that Hofstadter is reducing the self to a symbol in the same way a variable denotes a numerical value. For each, indicate the precise point in the sequence where it should be headed off, and how.

  Next, tell me what I should deliberately leave out at this level—perhaps the full machinery of Gödel's proof or debates about eliminativism—and state this openly. Finally, provide one check question I can ask at the end that would reveal whether the group understands that the "I" is not pointing inward to an object inside them but is the loop itself, rather than whether they can merely repeat the definition.
reasoning: |-
  We are designing a teaching plan for introducing Hofstadter's view of the self as a "strange loop". The audience consists of retired scientists (physicists, engineers, biologists) with no background in philosophy but comfortable with formal notation.

  The core idea: The self (symbolized by "I") is a strange loop: a symbol within a system that refers back to the system itself and lacks an external referent.

  We break down the dependencies:

  1. **Conceptual Prerequisites**:
     - Must establish what a symbol is in a representational system (without getting into full semiotics).
     - Must understand the idea of self-reference and how it differs from simple feedback loops.
     - Must appreciate that symbols can be grounded in a system without having a tangible object as referent.

  2. **Order of Introduction**:
     a. Start with physical feedback systems (oscillating circuit, thermostat) to illustrate circular causality. Why? Because they are concrete and familiar to scientists. They show a system's state depending on its own prior state, creating a loop. But note: these are not self-referential in the symbolic sense. They are causal loops without meaning.

     b. Then, introduce the idea of symbols and reference. A symbol stands for something else. We need to show that in a system of symbols, a symbol can refer to the system itself. But we must avoid Gödel numbering at first because it is too abstract.

     c. Use a **distributed measurement system** as a carrying example. We choose a network of sensors that collectively measure a global state that includes the system's own state.

       *Example*: Consider a distributed temperature control system in a building. Each room has a sensor and a heater. The system computes the average temperature of the building and displays it on a central panel. Now, suppose we add a sensor that measures the temperature at the central panel itself and includes that reading in the average. The system now has a feedback loop: the displayed average temperature (a symbol) is computed from the sensor readings, including the sensor that reads the display (which is part of the system). 

       Features required:
          - **Genuine self-reference**: The symbol (the displayed average) is a representation that includes the representation itself (because the sensor reading the display is part of the input). Note: This is a bit tricky because the display is a physical object. We must clarify that the symbol is the number displayed, and that number is being used in the computation of itself. However, we must be cautious because the sensor reading the display is a physical measurement, not a symbolic reference.

       But note: This example is still not purely symbolic. We are mixing physical measurement and symbolic representation. We can enhance the symbolic aspect by having the system output a report that includes a statement about the system's own state. For instance, the central computer prints: "The average temperature is X degrees, and this report was generated at time T." Then, we have the system read that report (via a camera and OCR) and include the temperature value from the report in the next computation. Now, the symbol (the number X in the report) is being used to compute the next average, and the system's own output becomes part of the input.

       However, we must avoid confusion between the physical signal and the symbolic meaning. To do so, we can abstract the example: imagine a program that outputs a string S that says, "My output is S". But that is the classic liar paradox and may be too abstract. Alternatively, we can use a more distributed example:

       *Refined Example*: A network of computers each holding a value. They compute the average of all values and then update their own value to the average. Each computer then outputs a message: "The average is A, and I am part of the system." The key is that the symbol "A" is the average and it is computed from the values that include the previous average (because each computer updated to the average). But note: the reference to the system is explicit in the message. The message is a symbol that represents the state of the system and includes the fact that the system produced it.

       However, we want to avoid the physical feedback and focus on the symbol referring to the system. So let's make it more abstract:

          - We have a set of agents (or nodes) that each hold a number. They exchange messages and update their numbers. The rule is: each agent sends its number to a central aggregator, which computes the average and sends it back. Each agent then updates its number to the received average. Then, the next round begins.

          Now, the average computed at step t+1 is based on the numbers that are the average from step t. So the average is a symbol that is constantly referring to the state of the system (which is the same average) but at a previous time. However, we want the symbol to refer to the system at the same time? That might be impossible without a fixed point.

          Instead, we can design a system that produces a description of itself. For example, a program that prints its own source code (a quine). This is a classic example of self-reference in computer science. But note: a quine does not represent the state of the system at runtime, just the static code.

          We need a dynamic example. Consider a simulation:

          *Example: Distributed Consensus with Self-Description*
          We have a system of nodes that run a consensus protocol. Each node has an internal state (a number) and a model of the entire system (a data structure that includes the state of every node, including itself). The system periodically updates the model by gathering state from all nodes. The model is a symbol that represents the system. The update rule: each node sends its state to a central node that compiles the model and broadcasts it. Each node updates its own state based on the model and also updates its model to the latest broadcast. Now, the model includes the state of each node, which is determined by the previous model. This is a feedback loop in the symbolic domain.

          The self-reference: the model is a symbol that refers to the system, and the system includes the node that holds the model. So the model must represent itself? Not exactly, because the model is a data structure and the node's state is separate. We can design it so that the model is stored in a particular node, and that node's state is the model. Then, the model must contain a representation of the model (at that node). This leads to an infinite regress? Or a fixed point? 

          We can avoid the infinite regress by having the model be a function that can generate the representation, but that is complex.

          Alternatively, we can use a simpler example: a robot that creates a map of its environment. The environment includes the robot itself. So the map must include a representation of the robot. This is a common example in robotics. The robot is both the mapper and the mapped. The map is a symbol that represents the environment, which includes the robot, so it must represent itself (the robot) as well. But note: the robot is not the map. The map is a representation that includes a symbol for the robot. The robot uses the map to navigate, and the map is updated by the robot's sensors. The loop: the robot's actions (which are based on the map) change the environment (including the robot's own position), which then updates the map. The symbol (the map) is about the system (the environment and the robot) and the system includes the robot that holds the map. So the map must represent the robot that holds the map? But the map doesn't represent the map itself. We can extend: the robot has a symbol for the map it is holding? Then we get a regress.

          This is getting complex. Let's go back to Hofstadter's own example: the video feedback. A camera pointed at a monitor. The monitor displays what the camera sees. The camera sees the monitor, so the image is of the monitor which contains the image of the monitor, and so on. This is a visual strange loop. The image is a symbol that represents the scene, but the scene includes the image itself. However, we wanted to avoid the camera-monitor loop.

          Given the constraints, let's design a distributed measurement example that has:

          - **Feature for genuine self-reference**: The symbol must be a representation that explicitly or implicitly includes a representation of the entire system, including the symbol itself. We can use a recursive data structure that represents the whole system and is stored in one part of the system. For example, a computer that holds a data structure `S` that represents the state of the entire system. `S` has a field for the state of each computer, and for the computer holding `S`, the state is `S` itself. This is a circular reference. But in practice, it cannot be stored exactly (because of infinite regress) but can be achieved through a pointer or a name. We can use a fixed-point approximation: the system has a symbol that represents the system at a coarser level, but this may not be satisfying.

          Alternatively, we can use a system that produces a description that is self-referential by having a label or a pointer. We can say that the system has a symbol `I` that stands for the entire system. The symbol `I` is part of the system, so when the system describes itself, it says "I am ..." and includes the symbol `I` in the description. This is more linguistic.

          We decide to use an example from distributed computing: a system that has a unique identifier for itself and uses it in messages. Each node has an address. The central node collects the addresses and sends a message to each node that includes the list of all addresses. Then each node, including the central node, has the list. The list includes the address of the central node. But this is not self-referential in a deep sense.

          Given the difficulty, we might have to accept that the camera-monitor loop is the most intuitive. But the problem asks for a distributed measurement example.

          Let's try: a distributed system that measures the load on each server. The monitoring server itself is one of the servers. The monitoring server collects the load of all servers, including itself. How does it measure its own load? It uses a sensor that measures its own CPU, etc. Then it produces a report: "Server A: load 10, Server B: load 20, ... and the Monitor: load X." The report is a symbol that represents the state of the system, including the monitor. The monitor uses the report to make decisions (like load balancing) and then updates the report. The loop: the report is produced by the monitor and includes the monitor's own state. The next report will be based on the current state, which was influenced by the previous report (if the report led to a load balancing action). This is a feedback loop with self-inclusion. But note: the report does not represent the report itself. So it's not fully self-referential.

          We might have to settle for a partial self-reference and then explain the leap to the full self-reference of the "I". The key point is that the system has a representation of itself as a whole, and that representation includes the part that is doing the representing.

          We choose: **A distributed system that maintains a global map of the network, including the node that maintains the map**. The map is stored in a particular node, say node 0. The map data structure contains the state of every node, including node 0. For node 0, the state is the map itself? We can store a pointer or a reference to the map. But in a distributed system, we can have the map stored in a way that node 0's state is represented by a special token "map-holder". Then the map shows: node0: role=map-holder, map=<some data>. But the map data includes the state of node0, which is being the map-holder and holding the map. This is circular.

          We can represent it as:

            Map = {
              nodes: [
                { id: 0, role: 'mapHolder', map: thisMap },   // circular reference
                { id: 1, role: 'worker', ... },
                ...
              ]
            }

          In programming, this is a circular data structure. It can be created by having a reference. The symbol (the map) refers to the entire system, and the entire system includes the map (via the node that holds it). This is a strange loop: the map is part of the system it represents, and the representation of the part that holds the map includes the map.

          This example has:
            - Genuine self-reference: the map refers to the system, and the system includes the map (so the map must refer to itself, at least indirectly via the node that holds it).
            - What it lacks: The map is grounded in the system. The nodes are physical, and the map is a data structure. The self-reference is achieved by a pointer (or reference) which is a physical arrangement. We must clarify that in the mind, the symbols are not physical pointers but are grounded in the neural patterns. The map is a symbol that is about the system and includes a symbol for itself. But note: the map does not have semantic meaning by itself. We interpret it.

          We must also note that in the mind, the symbol "I" is not stored in a fixed location but is distributed. And the reference is not a physical pointer but a semantic one.

          We will use this example and then point out:

            - What it has: self-inclusion (the map includes the node that holds the map, and that node's state is defined by holding the map).
            - What it lacks compared to the "I": the map is a static symbol, while the "I" is dynamic and constantly changing. Also, the map is stored in one node, while the self in the brain is distributed. Moreover, the map is grounded by the physical system, but the "I" is grounded in the neural activity and its role in the system.

          But we must avoid the confusion: the map is a symbol that has a referent (the physical system) and it includes a representation of itself. The "I" is a symbol that refers to the entire system (the mind) and the mind includes the symbol "I". But the "I" does not have a referent outside the system.

          So we break down the example:

            - The map is a symbol that represents the network. The network includes the node that holds the map. So the map must represent that node and the fact that it holds the map. Thus, the map is self-referential.

            - However, the map is not the network. The map is a representation. The network exists independently. But the "I" is not representing an independent object. The "I" is the system representing itself. The system is the mind, and the mind is the system of symbols. So the "I" is a symbol within the system that refers to the system itself. There is no independent object.

          We must highlight this difference.

  3. **Breakdown of the Physical Analogy**:
     - The thermostat example: The thermostat turns the heater on/off based on the temperature. The temperature is measured by the thermostat itself. This is a causal loop, but the thermostat does not have a representation of itself. It doesn't have symbols. It's just a physical feedback.
     - We then show the distributed measurement example (the network map) which has symbols and self-reference. But note: the map is still grounded in the physical network. We must then abstract: in the mind, the symbols are not grounded in an external physical reality but in the patterns of neural activity. The "I" symbol is grounded in the entire system of symbols and their interactions.

     The precise point of breakdown: in the thermostat, there is no representation and no self-reference. The physical feedback is not about anything. In the distributed map, there is representation and self-reference, but the representation is about a physical system (the network) that exists independently. The "I" is not about an independent object. The mind is the system of symbols, so the "I" is the system referring to itself without an external referent.

  4. **Misconceptions**:

     (1) That "strange loop" denotes a literal circular pathway of neurons.
          - When to address: After introducing the physical feedback examples and before introducing the symbolic examples.
          - How: Emphasize that the strange loop is a pattern at the level of symbols and meaning, not at the level of neural wiring. While there may be neural loops, the strange loop is a higher-level abstraction.

     (2) That self-reference is nothing more than recursive computation.
          - When to address: After presenting the distributed map example (or any computational example) and before introducing the "I".
          - How: Point out that recursion is a syntactic operation, but self-reference in the strange loop sense is semantic: it's about meaning. The "I" carries a meaning of selfhood and identity, which is more than just a function calling itself.

     (3) That Hofstadter is reducing the self to a symbol in the same way a variable denotes a numerical value.
          - When to address: When introducing the symbol system and the "I" as a symbol.
          - How: Clarify that the symbol "I" does not denote an object (like a number) but is a token that plays a role in a complex, dynamic, self-referential system. The self is the entire loop, not the symbol alone. The symbol is part of the loop.

  5. **Deliberate Omissions**:
     - We will not cover the full machinery of Gödel's proof (incompleteness theorems) because it requires too much background and is not necessary for the core idea of the strange loop. We may mention it as an analogy but not elaborate.
     - We will not engage with eliminativism (the view that the self does not exist) or other philosophical debates. We are presenting Hofstadter's view as one perspective.

     State openly: "We are focusing on the core metaphor of the strange loop and will not delve into the technicalities of Gödel's proof or other philosophical positions."

  6. **Check Question**:
     - At the end, ask: "If the 'I' is a strange loop, then when I say 'I am thinking', what is the 'I' referring to? Is it pointing to a specific thing inside my brain, or is it something else?"

          Expected understanding: The 'I' is not pointing to a specific object (like a neuron or a region) but is a dynamic pattern of activity that encompasses the entire system (the mind) and includes the very act of thinking. The loop is the self.

     Alternative: "In the distributed map example, the map includes a representation of the node that holds the map. But if we consider the entire map as the 'self' of the system, then what would happen if we removed the node that holds the map? Would the 'self' still exist?"

          Expected: The map is stored in a node, but the self (the loop) is the entire pattern. Removing a node breaks the loop and the self would not exist in the same way. But note: the system might have redundancy. The key is that the self is the loop, not the physical substrate.

     We choose the first question because it directly targets the human self.

  **Teaching Plan Outline**:

  1. **Introduction (5 min)**:
     - State the goal: to understand Hofstadter's idea that the self is a strange loop.
     - Explain that we will build from physical feedback to symbolic self-reference.

  2. **Physical Feedback Systems (10 min)**:
     - Thermostat example: illustrate a causal loop. The state of the heater affects the temperature, which affects the thermostat, which affects the heater.
     - Oscillating circuit: a signal that feeds back and causes oscillation.
     - Point: These are loops, but they are not about meaning. They are not self-referential in a symbolic sense.

  3. **Symbols and Reference (10 min)**:
     - Introduce symbols: what it means for something to stand for something else (e.g., a word, a map).
     - Explain that symbols form systems (like language, maps, computer programs).
     - Show that in such systems, a symbol can refer to the system itself.

  4. **Distributed Measurement Example (15 min)**:
     - Present the network map example: a system that maintains a map of the entire network, including the node that holds the map.
     - Show the circularity: the map represents the node that holds the map, and that node's state is defined by holding the map.
     - Highlight: this is self-referential because the symbol (the map) includes a representation of the part of the system that holds the symbol.

  5. **Breakdown of the Physical Analogy (5 min)**:
     - Contrast with thermostat: the thermostat has no symbols. The map has symbols but is grounded in a physical system that exists independently.
     - The mind's symbols are not grounded in an external physical reality in the same way. The mind is the system of symbols. There is no independent object that is the self.

  6. **The "I" as a Strange Loop (10 min)**:
     - Draw the analogy: the "I" is a symbol in the mind that refers to the mind itself. The mind includes the symbol "I". So the "I" is part of a loop.
     - Emphasize: the self is not an object but the loop itself.

  7. **Addressing Misconceptions (5 min)**:
     - (1) Strange loop is not a neural circuit: it's a higher-level pattern of meaning.
     - (2) Self-reference is not just recursion: it's about meaning and identity.
     - (3) The "I" is not a variable with a value: it's a token in a dynamic, self-referential system.

  8. **Omissions (2 min)**:
     - State that we are skipping Gödel's proof and other philosophical debates to focus on the core idea.

  9. **Check Question (3 min)**:
     - Ask: "If the 'I' is a strange loop, then when I say 'I am thinking', what is the 'I' referring to?"
     - Listen for answers that indicate the loop (e.g., "it's the whole system of thought including the concept of itself", not "a little person in the head" or "a specific brain region").

  Total time: ~65 minutes. Allow for discussion.

  **Adjustments for Clarity**:
     - Use diagrams for the feedback systems and the distributed map.
     - Use simple code or pseudocode if helpful for the distributed example.
     - Relate to the audience's background: physicists (feedback in control theory), engineers (circuits), biologists (feedback in biology, e.g., homeostasis, but note: these are not symbolic).
answer: |-
  ### Teaching Plan: Hofstadter's "I" as a Strange Loop  
  **Audience:** Retired scientists (physicists, engineers, biologists) with formal notation experience but no philosophy background.  
  **Core Goal:** Establish that the "I" is a *semantic* strange loop—a self-referential symbol without an external referent.  

  ---

  ### **Dependency Order & Conceptual Sequence**  
  **Rationale:** Build from concrete physical feedback to abstract symbolic self-reference. Avoid premature formalism to prevent confusion between *causal feedback* and *semantic self-reference*.  

  1. **Start with Physical Feedback Systems (e.g., Thermostat or Oscillating Circuit)**  
     - **Why?** Leverages audience’s comfort with engineering/control theory.  
     - **Key Analogy:**  
       - *Thermostat:* Measures temperature → Triggers heater → Alters temperature → Feeds back into measurement.  
       - *Formal Notation:* Let \( S \) be system state, \( M \) measurement, \( A \) action:  
         \[
         S_{t+1} = A(M(S_t))
         \]
     - **Purpose:** Illustrate a *causal loop* where output affects input.  
     - **Bridge to Next Step:** "This is *causal circularity*, but not yet *self-reference*."  

  2. **Introduce Symbolic Representation & Reference**  
     - **Why?** Symbols (unlike thermostats) carry meaning. Must distinguish *reference* from *causality*.  
     - **Core Idea:** Symbols (e.g., words, data) *stand for* things beyond themselves.  
       - Example: "Tree" refers to a physical object; "7" refers to a number.  
     - **Formal Nod:** Use set notation—symbol \( \sigma \) refers to object \( o \): \( \sigma \to o \).  
     - **Purpose:** Establish that reference is *aboutness*, not physical interaction.  

  3. **Transition via a Distributed Measurement Example**  
     - **Example: Sensor Network with Self-Inclusion**  
       - **Setup:**  
         - A network of 10 environmental sensors.  
         - Each sensor \( i \) measures a value \( v_i \) (e.g., temperature).  
         - A central unit computes the average \( \bar{v} = \frac{1}{10}\sum v_i \).  
         - **Critical Addition:** Sensor 10 measures *the display screen showing \( \bar{v} \) itself*.  
       - **Formalization:**  
         \[
         v_{10} = f(\bar{v}) \quad \text{and} \quad \bar{v} = \frac{1}{10}\left( \sum_{i=1}^9 v_i + f(\bar{v}) \right)
         \]  
         (where \( f \) is the sensor’s reading of the display).  
       - **Required Features:**  
         - **Genuine Self-Reference:** \( \bar{v} \) (symbol) incorporates a measurement *of itself* via \( v_{10} \).  
         - **Lacking Feature:** The loop is still *physically grounded* (sensor 10 reads a physical display). Contrast with "I," which has no physical referent.  
       - **Why This Example?**  
         - Shows a symbol (\( \bar{v} \)) referring to a system *that includes itself*.  
         - Highlights the gap: \( \bar{v} \) is grounded in a physical signal (display light), not pure meaning.  

  4. **Breakdown of Physical Analogy**  
     - **Precise Breakdown Point:**  
       - Physical analogies (thermostat/sensors) rely on *signal feedback* (energy/data loops).  
       - Strange loops require *semantic closure*: symbols referring to the symbol system *itself*, not external states.  
     - **Contrast:**  
       - Sensor network: \( \bar{v} \) refers to the system’s state (including its own display).  
       - "I": Has *no physical display to point to*—it refers to the mind’s symbolic system *from within*.  

  5. **Introduce "I" as a Strange Loop**  
     - **Formal Analogy (Post-Physical):**  
       - "I" is a symbol \( \sigma \) in a system \( \Sigma \), where \( \sigma \) refers to \( \Sigma \):  
         \[
         \sigma \to \Sigma \quad \text{and} \quad \sigma \in \Sigma
         \]  
       - Unlike the sensor network, \( \Sigma \) (the mind) has no external "display"—the loop is purely abstract.  
     - **Hofstadter’s View:** The self is not an object but the *dynamic loop* of self-reference.  

  ---

  ### **Misconceptions to Preempt**  
  1. **Misconception:** "Strange loop = literal circular neural pathway."  
     - **When to Address:** After physical feedback examples (Step 1).  
     - **Response:**  
       - "Note: Neural feedback loops (e.g., brain oscillations) are *causal*, not semantic. A strange loop is *symbolic*—it’s about meaning, not signal propagation."  
     - **Why Then?** Prevents conflating control theory with philosophy of mind early on.  

  2. **Misconception:** "Self-reference = recursive computation (e.g., Fibonacci sequences)."  
     - **When to Address:** After the distributed measurement example (Step 3).  
     - **Response:**  
       - "Recursion computes outputs from inputs; self-reference is *semantic*. The sensor’s \( \bar{v} \) isn’t just a computation—it’s a symbol *representing the whole system*. The ‘I’ is like \( \bar{v} \), but without physical inputs."  
     - **Why Then?** Post-sensor example, recursion is fresh, but semantic depth is visible.  

  3. **Misconception:** "Hofstadter reduces the self to a symbol like a variable (e.g., \( x = 5 \))."  
     - **When to Address:** When introducing "I" as a symbol (Step 5).  
     - **Response:**  
       - "A variable \( x \) points *outside* itself (to 5). The ‘I’ has *no external referent*—it points to the system generating it. The loop *is* the self; it doesn’t ‘denote’ an object."  
     - **Why Then?** Corrects reductionism when the symbol is first defined.  

  ---

  ### **Deliberate Omissions**  
  - **Gödel’s Proof Machinery:**  
    - "We’re skipping Gödel numbering and incompleteness theorems. While Hofstadter uses them, our focus is the *metaphor* of self-reference, not mathematical logic."  
  - **Eliminativism/Other Theories:**  
    - "We’ll avoid debates about whether the self ‘exists.’ Hofstadter’s view is non-reductive but emergent—we’re exploring that nuance only."  
  **Why:** Prevents tangents and maintains focus on the core analogy.  

  ---

  ### **Check Question for Understanding**  
  **Question:**  
  *"When you say, ‘I am confused,’ does the ‘I’ refer to a specific object inside your brain (e.g., a neuron or module), or is it something else? Explain."*  

  **Expected Insight:**  
  - **Correct:** The ‘I’ is not pointing to an internal object—it’s the *loop itself*: the self-referential symbol generated by the mind’s symbolic system.  
  - **Red Flag:** Answers like "It refers to my prefrontal cortex" (object-based) or "It’s just a word" (missing the loop).  

  **Purpose:** Tests grasp of the loop’s emergent, non-object-like nature beyond rote definitions.  

  ---

  ### **Timeline & Flow**  
  1. **Intro (5 min):** Hook with "What is ‘I’?" and Hofstadter’s challenge to object-based views.  
  2. **Physical Feedback (10 min):** Thermostat/sensor examples.  
  3. **Symbols & Reference (10 min):** Define reference; contrast with causality.  
  4. **Distributed Measurement (15 min):** Sensor network example; breakdown signal vs. semantics.  
  5. **Strange Loop "I" (10 min):** Formal analogy; address misconceptions 2–3.  
  6. **Check Question & Discussion (10 min):** Gauge understanding; reinforce loop-as-self.  
  **Total:** 60 min.  

  **Materials:** Diagrams of feedback loops/sensor networks; notation whiteboard.  
  **Adjust for Group:** Use domain-specific analogies (e.g., feedback in biology for biologists).
