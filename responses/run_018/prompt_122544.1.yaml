  First, I need to map epistemicism to their framework. Epistemicism would treat Marta's villain status as having a definite truth value that's unknown to the author - like a swing fact that's objectively locked but whose key is lost. The Bellwether Rule here would be a practical concession to our cognitive limits rather than an ontological feature of the fiction. 

  For supervaluationism, the parallels are stronger. Swing facts are essentially borderlines that remain unsettled across admissible precisifications. The Bellwether Rule's "publishable versions" correspond directly to "admissible precisifications" - both define the boundaries of what could coherently be true in the fictional world. When users ask if Marta is a villain, supervaluationism explains why the text genuinely doesn't decide this.

  Now the residue report: 
  1) Core concepts translate cleanly - swing facts are supervaluationism's borderline cases, Bellwether's publishable versions are precisifications. 
  2) The distortion comes from epistemicism smuggling in completeness - it assumes Marta's moral status is fixed before authorial decisions, while the workshop vocabulary embraces genuine openness. 
  3) Three tricky bits: 
     a) Iterated "definitely" corresponds to degrees of entrenchment in the bible - how many downstream facts depend on this attribute. 
     b) Higher-order vagueness doesn't collapse the system; it just means the Bellwether Rule applies recursively to what counts as publishable. 
     c) Conditionals in bibles face export problems - stating "if Lisbon then Portuguese" may hold in each precisification but fail globally if the antecedent is unsettled.

  Finally, the Bellwether Rule is indeed supervaluationism in a cardigan - a practical implementation of precisification-space management. The residual difference is that workshop talk acknowledges the author's creative freedom where philosophy might reify the fictional world. This shows the two theories debate cognitive access versus ontological indeterminacy, but both grapple with the same penumbral phenomenon around Marta's ambiguity.
answer: |-
  Here's a rigorous translation and residue report, treating your craft vocabulary as a first-class conceptual system. I'll avoid hedging and focus on operational consequences for Marta's fictional ontology.

  **Core Translation:**

  1.  **Epistemicism → Workshop Vocabulary:**
      *   **Thesis:** There *is* a sharp, objective fact about whether Marta is a villain. Bivalence holds: she *is* or *is not* one, simpliciter.
      *   **Translation to Craft:** "Marta is a villain" is **not a swing fact.** It is **canon** – a settled truth *within the fictional world itself*. However, it is **unknown to the author (and readers)**. It's like an entry missing from the bible, but whose truth value *exists* independently. The Bellwether Rule is a *practical epistemic constraint* on *your access* to the canon, not a reflection of indeterminacy *in the world*. "Publishable versions" represent your *uncertainty* about which precise world-description (including the exact cut-off point on the villainy-scale) is the actual one. Retcon occurs when you discover you were *wrong* about the canon.

  2.  **Supervaluationism → Workshop Vocabulary:**
      *   **Thesis:** "Marta is a villain" is vague. Its truth depends on how we precisify the concept "villain" relative to her actions. It's true only if true on *all* admissible precisifications ("admissible" = coherent, respects penumbral connections, fits the text's meaning).
      *   **Translation to Craft:** "Marta is a villain" **is a swing fact.** The "publishable versions" in the Bellwether Rule **are the admissible precisifications.** The rule *is* the supervaluationist criterion: the swing fact gets locked (becomes canon) only if it holds in *all* publishable versions (i.e., under *all* admissible precisifications). If it holds in some publishable versions but not others, it remains a swing fact (borderline, neither true nor false). Retcon occurs when you *change the set* of publishable versions/admissible precisifications (e.g., by altering the text meaningfully).

  **Residue Report:**

  1.  **What Translates Cleanly:**
      *   **Swing Fact ↔ Borderline Case (Supervaluationism):** This is the cleanest fit. A swing fact *is* a supervaluationist borderline case – unsettled across publishable versions/precisifications.
      *   **Bellwether Rule "Publishable Versions" ↔ Admissible Precisifications (Supervaluationism):** The core machinery maps directly. The rule *defines* the precisification space relevant to settling swing facts/canon.
      *   **Canon ↔ Supertruth/Superfalsehood (Supervaluationism):** What holds in *all* publishable versions is canon = supertrue. What is false in *all* is canonically false = superfalse.
      *   **Retcon ↔ Altering Precisification Space/Actual World (Both):** Changing what counts as a publishable version (supervaluationism) or discovering/changing the actual canon (epistemicism) both map to retcon.

  2.  **Translation with Distortion:**
      *   **Epistemicism smuggles in fictional realism/completeness:** The core distortion is epistemicism's claim that bivalence holds *within the fictional world itself*, independent of the author's knowledge or decisions *even during drafting*. Your vocabulary ("versions we'd actually be willing to publish") is fundamentally *creative* and *intentional*. It presupposes the world *isn't* complete until you lock it down. Epistemicism forces the view that while *you* don't know if Marta is a villain, *Marta-in-her-world* definitively is or isn't one *right now*, before you finish drafting. Your Bellwether Rule becomes purely about your *access* to Marta's fixed nature, not about its determinacy. This clashes with the creative freedom implied by "versions we'd be willing to publish."

  3.  **No Counterpart / Specific Presses:**
      *   **(a) Iterated "Definitely" (DefinitelyDefinitely...Villain):**
          *   **Philosophy:** In supervaluationism, "Definitely P" means P is true under *all* admissible precisifications. "DefinitelyDefinitely P" means *that* is true under *all* higher-order precisifications of "admissible." This *can* stabilize: there might be a level where further iterations don't change the truth value (e.g., core canon facts).
          *   **Translation:** This corresponds to **degrees of entrenchment in the bible.** "Marta was born in 1980" might be `DefinitelyDefinitelyTrue` – it's locked, and changing it would require massive, implausible retcons affecting countless other entries. "Marta feels guilty about X" might only be `DefinitelyTrue` – locked canon, but changing it only affects a localized part of the bible. "Is Marta a villain?" is `NotDefinitelyTrue` and `NotDefinitelyFalse` – a swing fact. Iteration tracks how "deep" the fact is woven into the network of canon. *Stabilization* means a fact is so central that no publishable version (within reason) could contradict it.
      *   **(b) Higher-Order Vagueness (Is "Admissible" itself vague?):**
          *   **Philosophy:** It moves the bump. Supervaluationism can handle it by admitting vagueness in "admissible" – leading to higher-order precisifications. The core machinery repeats at a meta-level. It doesn't collapse the story; it just acknowledges the penumbra has a penumbra.
          *   **Translation:** **The Bellwether Rule applies recursively to *itself*.** What counts as a "publishable version" is *itself* potentially a swing fact! Is a darkly comedic version where Marta's actions are played for laughs still "publishable" for *this* trilogy, or does it break the core tone? The rule doesn't decide this absolutely; it relies on your evolving judgment ("versions *we'd actually be willing to publish*"). This higher-order indeterminacy is inherent in the creative process. The bump moves from "Is Marta a villain?" to "What counts as a legitimate interpretation/extension of the text so far?".
      *   **(c) Conditionals in the Bible ("If Lisbon, then Portuguese"):**
          *   **Philosophy:** The problem is real. Supervaluationism validates modus ponens *locally*: *Within any single precisification*, if "Lisbon" and "If Lisbon then Portuguese" are both true, then "Portuguese" is true. The issue is **exporting the conditional globally.** If "If L then P" is true (meaning it holds in *all* precisifications), but "L" itself is indeterminate (true in some precisifications, false in others), then "P" might *not* be true in all precisifications (only those where L is true). So, "If L then P" is supertrue, "L" is borderline, but "P" is *not* supertrue (it's borderline or false in some precisifications). You cannot validly conclude the unconditional "P" is supertrue.
          *   **Translation:** **Conditional entries in the bible are dangerous if the antecedent is a swing fact.** Example: You have "If Marta grew up in Lisbon (L), then she speaks fluent Portuguese (P)". This is canon (`Supertrue`) – it holds in every publishable version. But "Marta grew up in Lisbon" (L) is a **swing fact** – some publishable versions have it, some don't (maybe Porto). You *cannot* lock "Marta speaks fluent Portuguese" (P) into the bible as canon based *only* on this conditional. Why? In versions where she *didn't* grow up in Lisbon (¬L), the conditional is vacuously true, but tells you *nothing* about whether she speaks Portuguese. P might be true, false, or indeterminate in those ¬L versions. Locking P as canon would be wrong – it might contradict a ¬L version where she never learned Portuguese. The conditional only guarantees P *if* L is true. If L is unsettled, P must remain unsettled or be established independently.

  4.  **Bellwether Rule: Identity and Residue:**
      *   **It *is* Supervaluationism wearing a Cardigan (with authorial intent woven in):** The mapping is remarkably close. "Swing fact" = borderline case. "Publishable versions" = admissible precisifications. "Locked in bible iff true in all publishable versions" = supertruth. The cardigan is the explicit grounding in *authorial intent and creative possibility* ("versions *we'd* actually be willing to publish"). Supervaluationism typically talks abstractly about "admissible precisifications" based on meaning and penumbral connections. The Bellwether Rule operationalizes this as the space of *creatively viable completions* of the text by *this author/workshop*. This integrates the creative act directly into the logic of vagueness for fiction.
      *   **Residue Points to Creative Openness:** The key residue is the **inescapable role of authorial freedom and the unfinished nature of the draft.** Philosophy often assumes a fixed (if vague) object of analysis. Your vocabulary foregrounds the *process* of construction. Higher-order vagueness about "publishable" highlights this. The Bellwether Rule isn't *just* discovering what's true in Marta's world (epistemicism); it's *defining* what her world *can be*. The residue shows **the two philosophical positions are debating the *nature* of the indeterminacy (epistemic vs. ontic), while your vocabulary captures the *experience* of managing that indeterminacy *during creation*.** They argue *why* the cut-off is hidden or doesn't exist; you're concerned with *how to work* with that phenomenon while building a world sentence-by-sentence. The "missing" element is the dynamic, intentional act of world-building itself – the fact that the precisification space is actively shaped by your choices about what counts as "publishable" for *this* story.

  **Conclusion:** Your Bellwether Rule is a practical, author-centric implementation of supervaluationism. It cleanly handles vagueness (swing facts) through the multi-version approach (admissible precisifications/publishable versions). The main philosophical residue involves the *grounds* for "admissible" – philosophy seeks linguistic/ontological constraints, while your rule rests on authorial intent and creative judgment ("willing to publish"). The "iterated definitely" and conditional issues have direct, consequential translations for bible management. Higher-order vagueness is inherent and manageable within the rule via recursion. The core insight from the residue is that your vocabulary doesn't just *describe* vagueness in fiction; it provides the *tools for its deliberate construction and management* during the drafting process, highlighting the unique ontology of unfinished fictional worlds. Epistemicism and Supervaluationism are arguing about the metaphysics of the fog; your rules are for navigating it while building the landscape.
