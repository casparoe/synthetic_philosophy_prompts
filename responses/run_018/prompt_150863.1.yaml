  For James, it's trickier because he focused on "what works." The user is right that James would care about practical consequences. But crucially, James still required human experience - truth is what proves itself to human purposes. An LLM's usefulness is derivative, based on human validation. So while more open, James wouldn't grant truth to the model itself.

  The calibration error idea is fascinating! It's like they're trying to quantify pragmatism. For Peirce, calibration might approximate truth only if it drives inquiry. For James, low error could indicate "working" if it consistently produces successful actions. But both would insist it's still human verification that matters.

