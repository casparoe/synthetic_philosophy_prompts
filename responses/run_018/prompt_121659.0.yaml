answer: |-
  Here is a complete exam package based on your specifications, designed to push students into the metaphysics while avoiding rote responses.

  ---

  **Exam Question: Dispositions and the Handover Case (20 marks)**  

  *Consider the following scenario:  
  A turbine blade is composed of ceramic in phase α. In virtue of this α-microstructure, the blade is fragile at time t₀ (i.e., it would shatter if subjected to a hard impact). Permanently attached to the blade is an intrinsic monitoring device (constituting part of the object itself). Upon detecting an imminent hard impact (1 microsecond before contact), this device instantaneously reorganizes the blade’s surface layer into phase β. Crucially, phase β is independently fragile: blades made solely of β-ceramic shatter under hard impacts just as readily as α-ceramic. When the blade is struck hard at t₁, it shatters.  
  Call this the "handover case."*  

  **Answer all parts:**  
  1. Does the handover case fit the standard definitions of a fink, mask, or antidote? Justify your answer.  
  2. Assess whether Lewis’s "retention of the causal basis" condition correctly diagnoses why the blade is fragile at t₀. Explain why the intrinsic nature of the monitoring device matters.  
  3. One might propose saving Lewis’s condition by defining the retained property as the disjunction: *having either α- or β-microstructure*. Why is this solution inadequate?  
  4. What should a theory of dispositions require to handle cases like this? Defend a specific repair to the conditional analysis or an alternative approach, and state one significant theoretical cost of your proposal.  

  *(Write your answer in essay form. 45 minutes suggested; 1000 words max.)*  

  ---

  **Model Answer (≈700 words):**  

  The handover case is not a fink, mask, or antidote. Finks remove dispositions when triggering conditions obtain (e.g., a sorcerer making a wire non-conductive just as current flows). Here, the blade *shatters* upon impact, satisfying the fragility conditional ("if struck, it would shatter"). Masks and antidotes prevent manifestation despite the disposition persisting (e.g., poison with an antidote still is poisonous but fails to kill). Here, manifestation occurs. The case is thus orthogonal to the classic taxonomy: the conditional holds, but the *basis* of fragility changes pre-manifestation.  

  Lewis’s retention condition—that an object retains its causal basis throughout the triggering interval—fails. At t₀, the blade is fragile *in virtue of* its α-microstructure. After the device activates, the basis is β-microstructure at impact (t₁). Since the basis is not retained, Lewis’s analysis would falsely deem the blade *non-fragile* at t₀. The intrinsicity of the device is crucial: had it been extrinsic (e.g., an external force field), the blade’s *own properties* might support fragility at t₀. But because the device is part of the object, the disposition’s basis is inherently unstable. The blade’s fragility at t₀ depends on a *disposition of the device* to alter the very basis of fragility—a regress-prone property not captured by static causal bases.  

  The disjunctive fix—defining the basis as "α- or β-microstructure"—is a trap. While both microstructures are independently fragile, the disjunction α∨β is metaphysically gerrymandered. It groups distinct natural kinds (α and β are nomologically independent: one could exist without the other). This violates a core constraint on causal bases: they must be *causally homogeneous*. A disjunction like "α∨β" does not causally explain shattering; only the *specific* microstructure present at t₁ does. For example, if γ-microstructure were non-fragile, a disjunction "α∨γ" would misclassify a γ-blade as fragile. Dispositions cannot supervene on unnatural disjunctions without collapsing into extensional adequacy at the cost of explanatory power.  

  To handle this, we must individuate dispositions more finely. Fragility should not be a monadic property but tied to a *specific causal pathway*. The blade is fragile*ᵅ* at t₀ (grounded in α), but the manifestation involves fragility*ᵝ* (grounded in β). This requires revising the conditional analysis to include the persistence of a *particular* basis or adopting dispositional essentialism, where dispositions are irreducible and basis-specific. The cost is either (a) abandoning the simplicity of Lewis’s reductive project, or (b) accepting that dispositions are multiply realizable *only* by natural properties. Here, "fragility" is ambiguous: the blade has *a* disposition to shatter, but not the *same* disposition at t₀ and t₁.  

  **Repair:** Adopt a **process-based conditional analysis**: *x is fragile at t iff (i) x has some natural basis B at t, and (ii) if x retained B through a triggering event, it would shatter*. This demands bases be natural kinds (avoiding disjunctions) and requires basis-persistence *only* if no interference occurs. In the handover case, the blade satisfies (i) but not (ii) for α, since α isn’t retained. It *is* fragile only under a description that abstracts from the basis—but strictly speaking, its t₀ fragility is lost.  

  **Cost:** This sacrifices universality. Many dispositions (e.g., solubility in water) are multiply realizable (salt’s basis differs from sugar’s). If we tie dispositions to specific bases, we lose unified dispositional predicates. Fragility becomes a family of distinct properties (fragilityᵅ, fragilityᵝ), undermining everyday attributions. The theory must either accept rampant property proliferation or posit higher-level dispositions, risking circularity.  

  ---

  **Marking Scheme (20 marks total):**  

  1.  **Taxonomy classification (4 marks)**  
      - *Must-hit:* Correctly identifies it as **NONE** of fink/mask/antidote. Explains: conditional true + manifestation occurs.  
      - *Common botch:* Misclassifying as fink (due to basis-change) or antidote (due to device intervention).  
  2.  **Retention fix assessment (5 marks)**  
      - *Must-hit:* Lewis’s condition gives **wrong verdict** (blade not fragile at t₀). **Intrinsicity matters** because the device is part of the object, so the basis is not stable.  
      - *Common botch:* Claiming retention works if device is "part of the basis" (ignoring basis change) or treating intrinsicity as irrelevant.  
  3.  **Disjunction trap (5 marks)**  
      - *Must-hit:* Rejects disjunction because it is **unnatural/gerrymandered** and **lacks causal homogeneity**.  
      - *Common botch:* Endorsing the disjunction as valid, or objecting on epistemic (not metaphysical) grounds.  
  4.  **Repair proposal (4 marks)**  
      - *Must-hit:* Advocates a specific fix (e.g., **finer individuation**, **natural basis requirement**, **process ontology**).  
      - *Common botch:* Vague suggestions ("tighten the conditional") without metaphysical commitment.  
  5.  **Cost acknowledgment (2 marks)**  
      - *Must-hit:* States one clear **theoretical cost** (e.g., property proliferation, loss of unified predicates, irreducibility).  
      - *Common botch:* Ignoring the cost or citing a practical (not metaphysical) drawback.  

  **Grading Standard:**  
  - **A (17–20):** Hits all 5 points; repair proposal is precise and metaphysically grounded; cost is deeply integrated.  
  - **B (13–16):** Hits 4+ points; repair is coherent but underdeveloped; cost is noted but not explored.  
  - **C (9–12):** Hits 3+ points; identifies taxonomy/retention issues but repair is weak/vague.  
  - **D (5–8):** Misclassifies taxonomy; superficial engagement with retention/disjunction.  
  - **F (0–4):** Fails to engage the case; confuses basic concepts.  

  **Loophole Handling:**  
  - If a student disputes fragility at t₀ (e.g., "the device makes it non-fragile"), award **max 10/20** if they engage other parts well. The question states "the blade is fragile at t₀," so rejecting this is non-responsive. Deduct marks in Q1–Q2 but credit Q3–Q4 if coherent.  
  - If they claim the device is extrinsic, note the question specifies "permanently fitted" and "part of the object." Deduct **2–3 marks** in Q2 for ignoring intrinsicity.  

  ---

  This tests conceptual grip under pressure while avoiding "counterfactuals are tricky" evasions. The model answer commits to natural properties and process constraints, with the cost being fragmentation of disposition kinds—a core tension in the literature.
