prompt: |-
  A philosophy blog I read recently summarises Bernard Williams's integrity objection, including the case he discusses involving one thought too many, in the following way: Williams holds that utilitarianism alienates agents from their ground projects by treating every personal commitment—whether parenthood, artistic vocation, or friendship—as fungible with any other source of welfare. If saving a stranger at negligible cost to one's own child produces greater aggregate wellbeing, then utilitarianism demands that one save the stranger, which shows that the parental role carries no special normative weight. In the drowning-wife scenario, a husband who rescues his spouse only after confirming that this maximises overall utility has already corrupted his attachment, because genuine love requires acting without that kind of calculation. Williams extends this to argue that utilitarianism imposes an impossible burden of negative responsibility, making agents accountable for every harm they fail to prevent, so that no life organised around specific projects can remain intact. Consequently, he rejects not only act-utilitarianism but any moral theory that permits agent-neutral trade-offs between personal commitments and aggregate outcomes, since all such theories reproduce the same alienation. Is this summary fair? Please examine it claim by claim, distinguishing accurate interpretation from common oversimplification and from direct misrepresentation. In particular, does Williams's appeal to negative responsibility entail that agent-neutral reasons are illegitimate in every domain, or is his target more narrowly the totalising demand that an agent always be ready to substitute her projects? And does the one-thought-too-many example demonstrate that consequential reasoning is always inappropriate within intimate relationships, or does it instead reveal something more restricted about the agent's motivational structure?
reasoning: |-
  Okay, let me approach this query methodically. The user presents a detailed summary of Bernard Williams' integrity objection from a philosophy blog and asks for a claim-by-claim evaluation. This requires careful unpacking of both the summary and Williams' original arguments.

  First, I need to verify the core components of the blog's summary: the fungibility claim about personal commitments, the drowning-wife scenario interpretation, and the negative responsibility argument. Williams' actual work in "A Critique of Utilitarianism" and "Persons, Character and Morality" will be key references here.

  For the fungibility aspect, I recall Williams objected to utilitarianism's reduction of all values to a single metric. But was his concern about fungibility per se or about the totalizing demand to always prioritize aggregate welfare? The distinction matters - Williams accepts agent-neutral reasons in limited contexts but rejects their supremacy over deep personal commitments.

  The drowning-wife example seems accurately presented, but requires nuance. Williams' point isn't that consequentialist reasoning is always wrong in relationships, but that certain calculations corrupt the distinctive motives of intimate bonds. The "one thought too many" highlights how justification itself can undermine the relationship.

  Regarding negative responsibility, the blog captures Williams' critique of unlimited accountability for omissions, but overstates it as a blanket rejection of agent-neutrality. Williams targets specifically the utilitarian demand that agents must constantly justify personal projects against optimal welfare production.

  The user's specific questions about agent-neutral reasons' legitimacy and the scope of the drowning-wife criticism need addressing. Williams allows for agent-neutral reasons in impersonal domains but disputes their dominance in personal life. The wife example reveals motivational corruption only when calculation replaces immediate care-response.

  I should also note the blog's accurate framing of Williams' rejection of all moral theories permitting such trade-offs. His integrity objection does extend beyond utilitarianism to any system demanding agent-neutral sacrifice of ground projects.

  Throughout this, I'll maintain clear distinctions between Williams' actual positions, common oversimplifications (like treating all calculation as corrupting), and potential misrepresentations (such as implying he rejected all agent-neutral reasoning).
answer: |-
  Your summary captures the core of Williams' integrity objection well, but requires nuanced distinctions to avoid common oversimplifications and precisely locate his target. Let's break it down claim-by-claim:

  1.  **"Williams holds that utilitarianism alienates agents from their ground projects..."**
      *   **Accurate:** This is fundamental to Williams' objection. "Ground projects" are commitments constitutive of an agent's identity and sense of self. Utilitarianism, by demanding constant subordination of these projects to the impersonal calculation of overall welfare, threatens to make the agent a stranger to their own life and motivations, creating alienation.

  2.  **"...by treating every personal commitment... as fungible with any other source of welfare."**
      *   **Accurate Interpretation:** This correctly identifies the *mechanism* of alienation. Utilitarianism reduces the unique, identity-constituting value of *this* friendship, *this* artistic pursuit, *this* child, to a mere quantum of "utility" that can be traded against any other quantum. The *specialness* of the commitment to the agent is erased in the calculus.
      *   **Potential Oversimplification:** While Williams focuses on utilitarianism, his point applies to *any* moral system that demands this kind of radical fungibility of deep personal commitments for the sake of an impersonal good (like some forms of consequentialism or strong agent-neutral deontology).

  3.  **"If saving a stranger at negligible cost to one's own child produces greater aggregate wellbeing, then utilitarianism demands that one save the stranger, which shows that the parental role carries no special normative weight."**
      *   **Accurate:** This is a classic illustration Williams might endorse. It starkly reveals how utilitarianism denies the intrinsic normative significance of the parent-child relationship *for the parent*. The parent's reason "because it's *my* child" is given no independent weight; it's only valid if it coincides with maximizing aggregate welfare.

  4.  **"In the drowning-wife scenario, a husband who rescues his spouse only after confirming that this maximises overall utility has already corrupted his attachment, because genuine love requires acting without that kind of calculation."**
      *   **Accurate Interpretation:** This captures the essence of the "one thought too many" example (*Jim and the Indians* paper). Williams argues that the husband's deliberation reveals a motivational structure incompatible with genuine love. The thought "Does saving her maximize utility?" is one thought *too many*; it shows his primary motive isn't love for *her*, but adherence to an impersonal principle.
      *   **Crucial Nuance (Addressing your specific question):** Williams' point is **not** that consequential reasoning is *always* inappropriate in intimate relationships (e.g., considering consequences when deciding major life choices affecting a spouse *might* be acceptable). The point is about the **motivational structure** and **justification** in the moment of action within the relationship's core demands. Genuine love (or friendship, etc.) provides *its own* immediate, non-calculative reason for action ("It's my wife!"). Introducing the impersonal utilitarian calculation *as the justifying reason* corrupts the *character* of that commitment. It reveals the agent doesn't hold the commitment in the way constitutive of the relationship itself. The example reveals the incompatibility of the *demand for agent-neutral justification* with the *motivational structure* required by deep personal commitments.

  5.  **"Williams extends this to argue that utilitarianism imposes an impossible burden of negative responsibility..."**
      *   **Accurate:** Negative responsibility (being responsible for what you *fail* to prevent, not just what you actively cause) is a key component of Williams' critique. Utilitarianism holds an agent responsible for *every* harm they *could have* prevented, anywhere, if doing so would have maximized utility. This responsibility is inescapable and limitless.

  6.  **"...making agents accountable for every harm they fail to prevent, so that no life organised around specific projects can remain intact."**
      *   **Accurate Interpretation:** This connects negative responsibility to the alienation from ground projects. If an agent is perpetually responsible for *all* preventable harm, then *any* time and resources devoted to a personal project (writing a novel, raising a child, relaxing with a friend) could be seen as a failure to prevent greater harm elsewhere (e.g., by donating money/time to more efficient charities). This constant potential for "moral blackmail" makes it psychologically and practically impossible to maintain a life centered on specific, identity-constituting projects without feeling guilty or compromised. The projects cannot be pursued with the wholeheartedness they require.

  7.  **"Consequently, he rejects not only act-utilitarianism but any moral theory that permits agent-neutral trade-offs between personal commitments and aggregate outcomes..."**
      *   **Accurate:** Williams' target is broader than just act-utilitarianism. He rejects any moral system that demands the agent treat their deepest commitments as *always* sacrificable for the greater good, as this reproduces the alienation and threat to integrity. This includes rule-utilitarianism (if the rules demand such sacrifice) and strong forms of agent-neutral deontology (if the rules similarly demand subordinating personal ties to impersonal duties).
      *   **Clarification:** He doesn't necessarily reject *all* agent-neutral reasons. He accepts they exist and have force in many contexts (e.g., basic justice, keeping promises to strangers). His target is the **totalizing demand** that agent-neutral reasons (especially aggregate welfare maximization) *always* trump agent-relative reasons stemming from ground projects. He objects to morality demanding that the agent be *fundamentally* oriented towards the impersonal standpoint, *always* ready to abandon their own life's meaning for the greater good.

  8.  **"...since all such theories reproduce the same alienation."**
      *   **Accurate:** Williams argues that the core problem – demanding the agent step outside their personal perspective and treat their deepest commitments as fungible for an impersonal good – is inherent in any theory requiring such radical agent-neutral trade-offs, leading to the same alienation.

  **Addressing Your Specific Questions:**

  *   **"Does Williams's appeal to negative responsibility entail that agent-neutral reasons are illegitimate in every domain?"**
      *   **No.** Williams' critique of negative responsibility targets its *unlimited scope* and *totalizing demand* within utilitarianism. He acknowledges the existence and force of agent-neutral reasons (e.g., prohibitions against harming others). His objection is that utilitarianism makes negative responsibility *all-consuming*, demanding the agent constantly prioritize preventing harm *anywhere* over pursuing their own projects. He rejects the idea that morality *must* occupy this supreme, all-encompassing role that negates the possibility of a meaningful personal life. He argues for the legitimacy of "moral luck" and the space for non-moral (but deeply important) agent-relative reasons.

  *   **"Is his target more narrowly the totalising demand that an agent always be ready to substitute her projects?"**
      *   **Yes, precisely.** His core target is the **totalizing demand**. He objects to the idea that morality (conceived as agent-neutral optimization) must be the *sovereign* demand, requiring the agent to be perpetually prepared to abandon their ground projects if the impersonal calculus dictates it. He argues this demand is destructive to integrity and personal identity. He seeks to carve out space where the agent's own projects and commitments have genuine, non-fungible normative weight *for them*, independent of the impersonal standpoint.

  *   **"Does the one-thought-too-many example demonstrate that consequential reasoning is always inappropriate within intimate relationships?"**
      *   **No.** The example doesn't condemn consequential reasoning *in general* within relationships. It specifically targets the **introduction of the *impersonal, maximizing* consequentialist calculus as the *justifying reason* for acting on a core commitment of the relationship.** Williams' point is that the *motivation* and *justification* inherent in genuine love (or friendship, etc.) is immediate and particularistic ("It's *her*!"). To step back and ask "Does saving *her* maximize overall utility?" before acting is to betray that the commitment isn't held in the way that constitutes the relationship. It reveals the agent isn't fully invested in the *relationship itself* as the source of reasons, but is instead governed by the external, impersonal standard. The corruption is in the *motivational structure* and the *demand for agent-neutral justification*, not in considering consequences per se within the relationship's own terms (e.g., "Will this action hurt her?" is a perfectly appropriate consequential thought *within* the commitment of love).

  **Conclusion:**

  The summary is largely fair and captures the central thrust of Williams' integrity objection, including the fungibility critique, the "one thought too many" example, and the link to negative responsibility and the rejection of totalizing agent-neutral trade-offs. The main areas requiring nuance are:

  1.  **Scope of Rejection:** Williams targets the *totalizing demand* of agent-neutral optimization (especially utilitarianism), not necessarily all agent-neutral reasons in all contexts.
  2.  **"One Thought Too Many":** This reveals the corruption of the *motivational structure* and the incompatibility of demanding *agent-neutral justification* for core acts within intimate relationships, not that consequential reasoning is *always* inappropriate within them.
  3.  **Negative Responsibility:** The problem is its *unlimited scope* within utilitarianism, making it impossible to pursue ground projects, not the concept of negative responsibility itself in more limited forms.

  The summary accurately reflects Williams' broad rejection of moral systems demanding radical fungibility of ground projects and the resulting alienation, correctly identifying his core concerns about integrity and the threat posed by the impersonal standpoint of utilitarianism (and similar theories).
