  Keynes's distinction between probability and weight of evidence is central here. In his Treatise, probability is the degree of belief, while weight is about the sufficiency of the evidence. Modern AI tools output crisp probabilities (like "75% cascade risk") from thin datasets, which might mislead by presenting a false sense of certainty. 

  Keynes would likely call this a category mistake because these tools conflate probability with weight. Even if the probability number is mathematically sound, it's presented without context on how reliable the underlying data is. This is especially problematic in complex systems like climate or pandemics where data is sparse.

  For central banks using AI in macro forecasting, Keynes's main warning would be about the illusion of precision. AI models might produce confident numbers, but if the input data is limited or of poor quality, the results are fragile. He'd emphasize that during crises—like financial meltdowns—this becomes dangerous. Decision-makers might rely on these numbers without understanding their evidential weaknesses, leading to poor policy choices.

