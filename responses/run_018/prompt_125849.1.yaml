  Tractability is key. Without experiments, multi-agent conflicts offer concrete structures to analyze. Representational content depends on unresolved ML progress, making it less feasible now. Valence ontology's urgency ties to ethics, but it's risky without foundational clarity. 

  Practical implications need distinguishing. Rights talk is overrated without consciousness, but multi-agent dynamics could inform AI safety or cooperation ethics. Highlighting that suffering requires phenomenal consciousness, which RL agents lack, helps counter rights arguments.

