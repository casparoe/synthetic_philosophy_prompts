  Wait - is the question itself ambiguous about logical independence in part (c)? The premises P and Q aren't actually independent in real-world terms (ventilation efficacy presupposes aerosol transmission). But since the charter treats them as such, I'll proceed per the hypothetical. Should mention this in "ambiguities" though.

