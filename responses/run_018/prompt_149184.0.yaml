answer: |-
  Consider a team of six market analysts jointly maintaining a predictive model for client portfolio recommendations. Each analyst monitors a specific economic sector (e.g., energy, tech, healthcare) and possesses private, imperfect signals indicating potential subtle biases in the model's calibration for their sector. An analyst can independently submit a small, localised calibration adjustment based on their signal. Crucially, if only one or two such adjustments are applied in a given week, they genuinely improve the model's accuracy across all sectors. However, if three or more analysts submit overlapping adjustments simultaneously (even if each seems individually justified), the compounded changes introduce harmful overfitting. This degrades the model's general predictive power for *all* analysts' forecasts, leading to poorer client outcomes and reputational damage for the team.

  **Specification Satisfaction:**
  1.  **Unilateral Action:** An analyst independently deciding to submit their local calibration adjustment.
  2.  **Individual Rationalisation:** The analyst observes a potential bias signal in their sector. They reason: "My adjustment, if applied alone, fixes a genuine problem and improves the model. Even if others act, my correction *still* addresses a specific flaw I see. Not submitting leaves a known error unfixed, harming my own forecasts. Therefore, submitting is my best move regardless of what others do."
  3.  **Collective Harm:** If several analysts act on their signals simultaneously, their overlapping adjustments cause overfitting. This degrades the model's overall predictive value, harming *everyone's* forecasts and the team's collective output.
  4.  **Unilateral Reasoning Step:** The analyst assumes their action is isolated or that its impact is independent of others' actions ("*My* adjustment is small and necessary; others probably won't act or if they do, it won't interact badly with *mine*"). They focus solely on the *presence* of the local error and the *local benefit* of fixing it, ignoring the *global interaction effect* of multiple concurrent fixes. This is distinct from competition (where gains are zero-sum); here, simultaneous actions directly *create* the harm through unintended interaction, making it unilateralist.

  **The "Silent Rotation" Protocol:**
  The team implements a rule: Each week, only the analyst with the lowest current employee ID number is allowed to submit a calibration adjustment. All discussion about potential biases or planned corrections is forbidden outside this mechanism.

  *   **Does it dissolve the curse?** Initially, yes, regarding simultaneous over-correction. Only one adjustment can be submitted per week, preventing the harmful interaction of multiple concurrent submissions that caused overfitting.
  *   **Does it transform or displace the harm?** It transforms the problem and potentially displaces harm onto the selection mechanism. The core issue shifts from preventing *too many simultaneous actions* to ensuring *adequate correction occurs over time* and that the *right* corrections are made.
  *   **Strategic Timing:** Analysts, knowing they can only act during their "low ID" week, have an incentive to strategically time their "discovery" of biases. If an analyst detects a minor bias early in their low-ID week, they might submit immediately. However, if they detect a bias late in their low-ID week or during a week when their ID is high, they might:
      *   **Delay Reporting:** Hold off on formally "discovering" or acknowledging the bias until their next low-ID week arrives, even if this means the model remains sub-optimal for longer.
      *   **Exaggerate Urgency:** Perceive minor fluctuations as significant biases when their turn approaches, justifying submission to "use their slot."
      *   **Ignore Minor Biases:** Decide minor biases aren't worth "using up" their precious submission slot, leading to under-correction and persistent small errors accumulating.
  *   **Result:** The protocol eliminates the *simultaneous over-action* harm but risks:
      1.  **Under-correction:** Biases persist longer than necessary because analysts delay action or ignore minor issues to save their slot.
      2.  **Inefficient Correction:** The analyst acting in a given week might not be the one observing the most critical or urgent bias.
      3.  **Artificial Clustering:** If multiple analysts delay reporting biases until their turn, corrections might cluster around low-ID weeks, potentially still causing minor sequential overfitting or neglecting other weeks entirely. The harm is displaced onto model accuracy through delayed or misallocated corrections, rather than immediate overfitting.

  **Structural Feature & Collapse:**
  The philosophical work is done by the **non-rivalrous but mutually interfering nature of the corrective actions combined with private signals and imperfect information about others' intentions and signals.** Each adjustment doesn't consume a resource (like grazing land), but its *concurrent application* with others creates a negative interaction effect (overfitting). The private signal means each analyst only sees their own justification, not the global picture of potential concurrent actions. Removing either feature collapses the scenario:
  *   Remove **mutual interference**: If corrections combined additively or independently improved the model, it becomes a pure coordination game or free-rider problem (who bothers to submit?), not a unilateralist's curse.
  *   Remove **private signals/imperfect information**: If analysts could perfectly communicate and coordinate which single correction was most needed each week, the curse dissolves into a coordination problem easily solved by the rotation or discussion.
  *   Remove **non-rivalry**: If submitting a correction consumed a scarce resource (e.g., limited computational budget), it would shift towards a tragedy of the commons, where overuse depletes a rivalrous resource. Here, the "harm" is actively *created* by the combination of actions, not depleted.

  Verdict: The silent rotation mitigates simultaneous over-correction but induces strategic timing, risking delayed corrections, inefficient allocation, and persistent model inaccuracy, transforming rather than resolving the core unilateralist dynamic rooted in private signals and mutually interfering actions.
