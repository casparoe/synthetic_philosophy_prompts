  The institutional twist involves a "silent rotation" where only the lowest-ID analyst can submit corrections each week. This might seem to solve the problem by limiting submissions, but it creates new issues. Analysts might strategically time their "discoveries" of bias to coincide with their low-ID weeks, potentially causing under-correction or artificial clustering of corrections. The protocol replaces simultaneous over-action with sequential under-action, shifting rather than solving the problem.

  The philosophical core here is the informational asymmetry and private knowledge of bias. Unlike a commons tragedy with rivalrous consumption, this involves non-rivalrous but mutually interfering information inputs. Removing the asymmetry would collapse it into standard coordination problems.

