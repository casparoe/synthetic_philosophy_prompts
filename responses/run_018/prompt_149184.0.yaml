prompt: |-
  I was discussing collective-action failures with a study group after a lecture on rational choice, and we kept circling back to the unilateralist's curse in its most tired forms—thermostats turned up, bystanders all dialling emergency services—without ever feeling we had pinned down exactly which feature makes the reasoning genuinely unilateral rather than merely competitive. To test my own understanding, I would like you to construct a precisely engineered thought experiment that relocates the curse into an informational domain where the collective harm is subtle rather than noisy.

  Please design a realistic workplace scenario—no exotic physics, no perfect predictors, no science-fictional institutions—set in a team of analysts who jointly maintain a shared forecasting model. Each analyst can independently submit a local calibration correction whenever they detect a bias in their own sector. The correction is genuinely beneficial if submitted by only one or two people, yet if several analysts apply overlapping corrections, the model becomes overfitted and its predictive value degrades for the whole group. Present this in a single paragraph, then demonstrate that it satisfies the specification: identify the unilateral action, the individual rationalisation for taking it, the collective harm that results from widespread adoption, and the exact reasoning step that renders it unilateral rather than cooperative.

  Next, inject a niche institutional twist: suppose the team adopts a "silent rotation" protocol in which, during any given week, only the analyst with the lowest employee identification number may submit a correction, and all other communication about corrections is forbidden. Walk through whether this protocol dissolves the curse, transforms it into a different collective-action problem, or merely displaces the harm onto the selection mechanism itself. In particular, address what happens if analysts begin to strategically time their discoveries of bias to align with weeks in which they hold the low number. Conclude with an honest note on which structural feature of the case is doing the philosophical work, and whether removing that feature collapses the scenario back into a standard tragedy of the commons. Please write in British English, and end with a one-sentence summary formatted exactly as: Verdict: [your conclusion].
