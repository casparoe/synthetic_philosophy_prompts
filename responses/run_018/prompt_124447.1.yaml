  Looking at their examples, DNA, Python, language, and bee dances all have arbitrary mappings and interpreters. The barometer is causal, immune system is structural, place cells lack syntax. Traffic lights are tricky—arbitrary but minimal syntax. Black-tie dress code is conventional but no interpreter. Smoke detector is causal. The molecular printer is their dilemma: it has an arbitrary lookup table but no higher-level system.

