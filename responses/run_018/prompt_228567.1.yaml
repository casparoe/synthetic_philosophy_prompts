     - Convergence Theorems: We skip the proofs of optimality of Solomonoff (though we can say that it's optimal in a very strong sense).

     - How to flag: "For the sake of time and because we're focusing on the core idea, we're skipping some deep technical points. The key takeaway is that this formalizes a principle we already use."

  7. **Final Check Question (5 min):**
