answer: |-
  ### Core Load-Bearing Idea  
  **The best explanation for your data is the shortest program that generates it, and this formally justifies why "simpler" theories should be preferred for prediction.**

  ---

  ### Session Plan (45 Minutes)  
  **Goal:** Show that Occam’s razor ("prefer simpler explanations") emerges from a formal framework—Kolmogorov complexity and Solomonoff induction—without requiring advanced math.  

  #### 1. **Set the Stage: Prediction as the Goal (5 min)**  
     - **Problem:** You observe a binary string (e.g., `011010...`) and must predict the next bit.  
     - **Human instinct:** We look for patterns. If we see `010101...`, we guess the next bit is `0`.  
     - **Key shift:** Frame explanations as **programs**. A "theory" is a program that reproduces the data.  
     - **Why programs?** They force us to define "simplicity" rigorously.  

  #### 2. **Define Kolmogorov Complexity (KC) with a Carrying Example (15 min)**  
     - **Core example:** The sequence **`0101010101` (10 bits)**.  
       - *Theory 1 (simple):* `for _ in range(5): print("01")` → **Program length: ~20 characters**.  
       - *Theory 2 (complex):* `print("0101010101")` → **Program length: ~25 characters**.  
       - *Make it messy:* Show the same sequence but with **one error** (e.g., `0101011101`).  
         - The simple program now needs extra logic (e.g., `if i == 7: print("11") else: ...`), making it longer.  
         - A program that hardcodes the string stays the same length.  
       - **KC = Length of the shortest program** (in a fixed language) that outputs the data.  
     - **Why this works:**  
       - Not trivial: The error forces trade-offs (pattern vs. exceptions).  
       - Not about compression: Programs *generate* the data; compression is a side effect.  
     - **Head off misconceptions:**  
       - *"Fewest Python characters?"* → No! Use an abstract "universal machine" (explain: any language works, lengths differ only by a constant).  
       - *"Just zip/compression?"* → Compression finds *some* short representation; KC finds the *shortest possible* (which includes *understanding* the pattern).  

  #### 3. **Solomonoff Induction: From Explanation to Prediction (15 min)**  
     - **The prediction problem:** Given `011010` (so far), what’s next?  
     - **Solomonoff’s insight:** Weight *all programs* that output data starting with `011010` by their simplicity.  
       - **Prior probability** of a program = \(2^{-\text{(length of program)}}\).  
         - (Intuition: Shorter programs are exponentially more likely.)  
       - Probability of next bit = Sum of priors of programs that output `011010` + that bit.  
     - **Revisit the example:**  
       - After `010101` (6 bits), what comes next?  
         - Programs that output `0101010` (next `0`) are shorter than those outputting `0101011` (next `1`)—they extend the pattern cleanly.  
         - Even if a program outputs `0101011`, it’s longer (must "break" the pattern).  
     - **Head off misconceptions:**  
       - *"Could we compute this?"* → No! We can’t check all programs (halting problem). This is a **theoretical ideal**, not an algorithm.  
       - *"Occam’s razor is a law of nature?"* → No! It’s about optimal **prediction**, not truth. Simple theories could be wrong, but they’re the safest bets.  

  #### 4. **Tie to Occam and Address Limits (5 min)**  
     - **Why "simpler" wins:** Shorter programs get exponentially higher weight. This minimizes prediction errors (proven in theory!).  
     - **What we skip (and why):**  
       - *Incomputability:* KC can’t be calculated (halting problem). Say: *"We’re describing an ideal—like ‘perfect justice’—to strive for."*  
       - *Machine-dependence:* KC varies by programming language, but only by a constant (irrelevant for large data).  
     - **Final punchline:** Occam’s razor isn’t magic. It falls out of **probabilities over programs**.  

  #### 5. **Check for Understanding (5 min)**  
     - **Question:**  
       > *"Two programs perfectly explain your data so far. Program A is 100 characters long. Program B is 200 characters long. Which gets more weight when predicting future data, and why?"*  
     - **Correct answer:**  
       Program A. Its prior probability is \(2^{-100}\) vs. \(2^{-200}\)—exponentially higher because it’s shorter.  
     - **Why this works:**  
       Tests grasp of *probability weighting* (not just compression). If they say "A is smaller," push: *"Why does that matter for prediction?"*  

  ---

  ### Why This Works for Your Audience  
  - **Programmers connect:** Programs as "theories" leverage their intuition.  
  - **Messy example:** The sequence with an error avoids triviality (shows trade-offs).  
  - **Misconceptions preempted:**  
    - Machine-dependence addressed early (universal machine + constant).  
    - Compression vs. KC clarified with the error example.  
    - "Computable?" and "law of nature?" debunked during Solomonoff.  
  - **Skip without breaking trust:** Acknowledge incomputability as a "north star," not a recipe.  

  **Final tip:** Whiteboard the programs live. When you add the error, ask: *"How would you modify the code? Does it get uglier?"** That sticks.
