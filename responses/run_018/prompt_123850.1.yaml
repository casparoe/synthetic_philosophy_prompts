prompt: |-
  I'm a PhD student in philosophy of mind writing a dissertation chapter on mental causation, and I've noticed a recurring unstable posture in debates over the causal exclusion argument that I can't quite map onto the standard taxonomy. Here is the pattern, described concretely. A philosopher wants to defend that my deciding to leave a lecture genuinely causes my walking out, without reducing that decision to the neural event that also causes the leg movement. They begin by conceding that the neurons are fully sufficient for the motion—replay the exact firing pattern in a zombie and the legs still move. But they insist the decision still does causal work because it "structures," "organizes," or "programs" which neural pattern occurs: it is like an architect's plan that determines the arrangement without pushing any brick. Then a critic asks: if the bricks are sufficient for the wall, and the plan doesn't push any brick, what causal work remains for the plan? At this point the defender usually says the plan explains why those particular bricks fired—making the mental state a cause of the cause, not of the movement itself. Immediately, however, they add that we shouldn't treat the plan and the bricks as two competing things; they are one reality seen at different levels. Once they've said that, though, they revert to treating mental explanations as indispensable and non-redundant—exactly the claim they seemed to have surrendered.

  I see this oscillation repeatedly: mental properties are assigned an architectural role that sounds causally potent, but whenever you try to pin down whether that potency affects the physical outcome, affects only the prior physical cause, or is merely descriptive, the answer slips among all three without settling. Is there an established name for this specific unstable role—this "architectural" or "structuring" causation that keeps sliding between being a prior cause of the physical, being identical to the physical arranged a certain way, and being causally redundant for the behavior? Or for the argumentative pattern itself, in which a defender of mental efficacy keeps retreating to a structural metaphor and then, under pressure, collapsing it into either reduction or epiphenomenalism, only to resurrect it in the very next move? I don't think it is just the standard exclusion argument, nor ordinary non-reductive physicalism, nor straightforward overdetermination, though it touches each. If there is no precise term, I'd like one coined with clear boundary conditions: when does a structural explanation count as genuinely causal in this domain, when is it merely redescriptive, and what distinguishes this particular slide from an ordinary motte-and-bailey? I'm preparing this for a seminar and want to avoid mislabeling what might actually be a recognized failure mode of mental-causal theories.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're a PhD student in philosophy of mind, working on mental causation, specifically the causal exclusion argument. They've noticed a recurring unstable posture in debates where defenders claim mental states like decisions cause actions without being reduced to neural events. The pattern involves using metaphors like "structuring" or "organizing" but then oscillating between different causal roles when pressed.

  First, I need to understand the core issue they're describing. The user outlines a three-step oscillation: initial claim of causal efficacy via structuring, retreat to being a cause of the cause under criticism, then collapsing into identity or redundancy while still insisting on indispensability. They want to know if there's a term for this instability or the specific role of "architectural causation."

  I recall similar discussions in literature. Kim's causal exclusion argument is central here. The user mentions it's not just standard exclusion, but a particular pattern within responses to it. The metaphors like architect or program are common in non-reductive physicalism. Thinkers like Dennett or functionalists use such analogies. But the instability arises when pressed on causal efficacy.

  The user's observation about sliding between prior cause, identity, and redundancy is key. When the defender says the mental state explains why specific neurons fire, it positions the mental cause as prior to the physical cause. But then they switch to saying it's the same reality at different levels, implying identity. Yet they still claim explanatory indispensability, which suggests non-redundancy. This creates a tension: if identical, how is it both non-redundant and not an additional cause? That's the inconsistency.

  Now, is there an established term? "Program explanation" (Jackson & Pettit) comes to mind. It's where a property explains why a lower-level cause occurred, rather than directly causing the effect. But the user points out that defenders then conflate this with identity, which program explanation avoids by being distinct. The collapse into identity or epiphenomenalism happens when they can't maintain the distinction. 

  Another term is "metaphorical causation," but that might not be formal. The user might need a new term. "Structurating causation" or "architectural causation" could work, but they need clear boundaries. The boundaries should differentiate when structural explanations are causal (e.g., guiding lower-level processes) versus descriptive (merely patterns without causal power). 

  The user also mentions distinguishing this from motte-and-bailey. Motte-and-bailey is a rhetorical tactic where one retreats to a defensible claim. Here, the retreat is from causal efficacy to identity or explanation, but then they revert to efficacy. The inconsistency is in the position itself, not just rhetoric. 

  The deeper need: the user wants to label this instability accurately in their dissertation. They might be concerned about misrepresenting arguments or missing existing critiques. Ensuring they're not reinventing the wheel but also providing a precise framework for analysis. 

  I should check if scholars like Kim or Yablo address this. Kim’s exclusion argument shows that non-reductive physicalism leads to epiphenomenalism unless reduced. The pattern described is a symptom of that pressure. Yablo’s subset causation might be an attempt to resolve it, but even there, questions about causal sufficiency linger. 

  The user’s insight about the three-way slide is novel. Coining terms like "the structuration dilemma" or "causal role trilemma" could help. Defining boundary conditions: when does structuring count as causal? If it has counterfactual dependence—if the decision changes, neural patterns change—then it’s causal. If not, it’s descriptive. But then exclusion pressure resurfaces. 

  In conclusion, the user needs a precise taxonomy for this instability. While no single term exists, combining existing concepts with new terminology like "structurational instability" or "exclusion evasion pattern" might serve. Highlighting the trilemma and providing criteria for genuine causal efficacy versus redescriptive roles will strengthen their chapter.
answer: |-
  Based on your precise description, this is a recognized and deeply problematic pattern within non-reductive physicalist responses to the causal exclusion argument. While there isn't one universally accepted *single* term for the *entire* unstable role/oscillation, the key components and the instability itself *are* named and discussed. Here's the breakdown and proposed terminology:

  1.  **The Core Metaphor/Role: "Structuring Causation" or "Program Explanation"**
      *   **Established Terms:** This is most commonly called **"Program Explanation"** (Frank Jackson & Philip Pettit, "Program Explanation: A General Perspective," *Analysis*, 1990). Other related concepts include **"Structural Causation," "Metaphorical Causation," "Organizing Causation,"** or **"Top-Down Causation"** (though the latter often implies stronger, sometimes controversial, ontological claims).
      *   **Definition:** A higher-level property/property-instance (e.g., the decision) explains an outcome *not* by being a distinct triggering cause in the physical chain, but by *being the reason why* the specific lower-level cause (the neural pattern) that *is* the triggering cause occurred. It programs, selects, or structures the lower-level realizer.
      *   **Boundary Condition (Causal vs. Descriptive):** The program/structure explanation is **genuinely causal (in an explanatory sense)** *if and only if*:
          *   It provides **counterfactual information** that the lower-level explanation alone cannot: If the mental state/structure had been different *while holding fixed the fundamental physical laws*, the relevant lower-level physical cause (and thus the outcome) would have been different.
          *   It identifies a **robust, projectable pattern** that is indispensable for prediction and understanding *at its own level* and across relevantly similar systems, even if token-identical to the physical realization.
      *   **When is it Merely Redescriptive?** If the "structuring" property *supervenes with metaphysical necessity* on the lower-level properties *and* its variation doesn't entail counterfactual differences in the lower-level causes/outcomes *given fixed laws*, then it's epiphenomenal/redescriptive. The "architect" analogy collapses if changing the plan *necessarily* changes the bricks *in the very same way* that directly manipulating the bricks would, without adding any independent causal leverage.

  2.  **The Instability/Oscillation: The Program Explanation Dilemma or Structurational Instability**
      *   **The Pattern:** The defender starts with Program Explanation (PE) to avoid reduction and claim distinct efficacy (step 1). Under pressure (the critic's "bricks are sufficient" point), they clarify that PE means causing the cause, not directly causing the outcome (step 2 - a retreat). To avoid the *new* problem of dualism or overdetermination implied by causing the cause, they invoke token-identity or "one reality, two descriptions" (step 3). But this immediately undermines the distinct *causal efficacy* of the program/structure, threatening collapse into either:
          *   **Reduction:** If token-identical, the "structuring" just *is* the physical cause arranged thusly. Its causal work is identical to the physical cause's work.
          *   **Explanatory Epiphenomenalism:** If not identical, and not adding counterfactual difference, the structuring role is merely descriptive window-dressing on the physical cause.
      *   **The Crucial Slip:** Having invoked identity to avoid dualism, the defender immediately *reverts* to claiming the program explanation is *indispensable and non-redundant* – which requires it to be *distinct* in its causal/explanatory contribution from the mere physical description. This is the inconsistency: simultaneously claiming identity (collapsing the levels causally) and distinct causal/explanatory indispensability (requiring level separation).
      *   **Established Recognition:** This instability is a core criticism leveled against non-reductive physicalism, particularly by Jaegwon Kim. It's often seen as the inevitable consequence of trying to maintain both *physical causal closure* and *non-reductive mental causation*. Kim argues PE ultimately fails to secure genuine mental *causation* and collapses into either reduction or epiphenomenalism. Others (like Ned Block, sometimes Jerry Fodor) have wrestled explicitly with this tension. The oscillation *itself* is frequently pointed out but lacks a single catchy name beyond formulations like "the dilemma of program explanation" or "the instability of non-reductive causal claims."
      *   **Proposed Term:** **"The Structuration Dilemma"** or **"Programmatic Instability"** precisely captures this back-and-forth between distinct causal efficacy, causal efficacy via causing the cause, identity to avoid overdetermination, and the resulting tension with indispensability.

  3.  **Distinguishing from Motte-and-Bailey (M&B):**
      *   **Similarity:** Both involve retreating from a less defensible claim (the "bailey" - strong direct mental causation) to a more defensible one (the "motte" - program explanation/identity/explanation).
      *   **Crucial Difference:** In a *deliberate* M&B, the defender *knowingly* retreats to the motte tactically but intends to reoccupy the bailey later *without resolving the underlying conflict*. The instability you describe is often an *unintended consequence* of the philosophical position itself under pressure, exposing a genuine internal tension or contradiction within non-reductive physicalism. The defender *wants* both the motte (safety from overdetermination via identity) and the bailey (distinct mental causation) simultaneously, but the position makes this impossible. The "resurrection" isn't tactical deceit, but a failure to consistently maintain the retreat without abandoning the core commitment to mental efficacy. It's a *symptom of a philosophical problem*, not (necessarily) a rhetorical ploy.

  **Conclusion & Recommendation:**

  *   **Name the Role:** Use **"Program Explanation"** (Jackson & Pettit) or **"Structuring Causation"** for the "architect" role. Cite Jackson & Pettit for the defense and Kim (*Mind in a Physical World*, *Physicalism, or Something Near Enough*) for the critique exposing the instability.
  *   **Name the Instability:** Describe the pattern as **the instability inherent in program explanation** or **the structuration dilemma of non-reductive physicalism**. You can explicitly call it **"Programmatic Instability"** or **"The Structuration Dilemma"** as a precise coinage for this specific trilemma (direct cause? cause-of-cause? identical? + indispensability claim).
  *   **Boundary Conditions:** Emphasize that structuring explanations only avoid causal redundancy if they provide *non-superfluous counterfactual information* (as per Jackson & Pettit's original defense). The slide into identity undercuts this by making the counterfactual dependence of the outcome on the structure *logically equivalent* to its dependence on the physical realization, rendering the structural explanation *explanatorily* redundant even if convenient.
  *   **Seminar Clarity:** Frame it like this: *"Many non-reductive physicalists appeal to 'structuring' or 'program' explanations (Jackson & Pettit) to defend mental causation. However, under pressure from exclusion, this position often exhibits a characteristic instability: oscillating between treating the mental as a distinct cause of the physical cause, treating it as token-identical to the physical cause, and needing to affirm its indispensable causal/explanatory role – positions that are mutually incompatible under physical causal closure. Let's call this 'programmatic instability' or 'the structuration dilemma'. The core question is: can program explanation consistently maintain non-redundant mental efficacy without collapsing into reduction or epiphenomenalism?"*

  This accurately maps your observation onto established debates while providing the precise terminology and boundary conditions you need for your dissertation and seminar. The key is highlighting how the appeal to identity to *avoid* one problem (overdetermination/dualism) *creates* another (undermining distinct efficacy) when combined with the commitment to indispensability.
