prompt: |-
  I just came away from a long, tense argument with a friend over whether calling an atrocity “genocide” is ever purely descriptive or whether the label itself is a political act that reshapes what the world feels obligated to see. I’m defending that view next Thursday in an interdisciplinary seminar, and I need a rigorous Q&A prep sheet. My thesis is that Lemkin’s original legal and moral category—centered on specific intent to destroy a protected group—has, in practice, been captured by a politics of naming that I call juridical spotlighting: the official designation of one event as genocide does not merely recognize suffering but systematically redistributes moral attention, legal resources, and commemorative duty away from contemporaneous mass killings that share the same structural features and perpetrator patterns but fail the narrow intent test. I argue we should not dilute the genocide concept; instead, we should recognize a parallel category—structured group destruction—that lacks the specific-intent element but triggers equivalent duties of prevention, intervention, and remembrance, thereby correcting the asymmetry without conceptual inflation.

  The audience is about thirty people: international lawyers who defend the Genocide Convention’s strict intent requirement and fear erosion of legal precision; moral philosophers worried about comparative moral grading and concept creep; and historians of twentieth-century mass violence who are protective of particularity and skeptical that any framework flattens distinct events. Several have published on naming politics in Rwanda and Bosnia; at least one is a vocal opponent of expanding legal categories beyond Lemkin’s boundaries. You are an expert in philosophy of law, moral philosophy, and genocide studies with experience in interdisciplinary Q&A preparation. Before drafting, take a moment to brainstorm the specific intellectual commitments, rhetorical habits, and likely alliances among these subgroups. Then produce a prep sheet that lists the objections I will actually face—ordered by how likely they are and how much damage they could do—phrased exactly as an international lawyer, a moral philosopher, or a historian would phrase them. For each objection, provide a concise reply I could deliver in about two minutes, plus an explicit note on where that reply is weakest or most vulnerable. Include what I should concede up front to maintain credibility, identify the weakest point in my own position that I should prepare to defend rather than hope they overlook, and specify the one objection I am most hoping nobody asks, with a brief survival strategy if it comes. Do not ask me for citations, reading lists, or bibliographies; construct everything from the conceptual framework I have laid out.
