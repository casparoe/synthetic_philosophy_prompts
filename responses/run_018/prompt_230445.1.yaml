  User's deeper needs: They might be questioning if PP can fully account for consciousness or if it avoids the hard problem. They could be exploring whether the meta-problem is all that's left once PP explains our reports. Also, they might seek validation that the hard problem remains relevant despite PP's explanatory power.

  Verdict: The residue points to PP's inability to tackle phenomenology, not a flaw in the distinction. The hard/meta separation holds; PP handles the meta-problem well but not the hard problem. The user's translation is accurate given PP's scope. The leftover is due to PP's framework, not the distinction's weakness.
answer: |-
  Here are the five dense items as requested:

  (1) **Hard Problem in PP terms**: Why does the generative model's self-prediction loop generate irreducible phenomenal properties (qualia) rather than merely implementing unconscious inference about internal states?  
  (2) **Meta-Problem in PP terms**: How do precision-weighted prediction errors and self-model dynamics produce verbal reports, philosophical intuitions, and persistent "problem-talk" asserting the existence of irreducible qualia?  
  (3) **Clean survival**: The meta-problem maps directly—PP explains report-generation via self-model predictions and precision-weighting of interoceptive/exteroceptive signals. The "why we talk" mechanism survives intact.  
  (4) **Fudged residue**: The hard problem's core (irreducible phenomenality) has no PP counterpart—PP describes *how* self-modeling works, not *why* it feels like anything. Translating "explanatory gap" requires smuggling in non-PP assumptions.  
  (5) **Verdict**: The residue indicts PP's framework (it assumes physicalism/functionalism, dissolving the hard problem's ontological weight) not the distinction itself nor your translation—PP *cannot* express phenomenality's irreducibility by design.  

  ---
  **Key translation notes**:  
  - PP handles meta-problem cleanly: Reports are active inferences minimizing surprise about self-states.  
  - Hard problem resists: PP explains *representations* of consciousness, not subjective ground.  
  - Fudge occurs at "irreducibility": PP treats phenomenality as an inference, Chalmers as a primitive.  
  - Residue confirms PP's stance: It frames the meta-problem as the only tractable puzzle, rendering the hard problem an epistemic illusion.
