      We need to clarify: the rolling baseline is checked after each transfer (i.e., round). The rectification can undo any prior transfers that contributed to the current state.

      So let's do:

          Round 1:
              - Transaction
              - Check state after Round 1 -> vote on whether to rectify the transfers of Round 1.

          Round 2:
              - Transaction
              - Check state after Round 2 -> vote on whether to rectify any transfers that led to this state (which could include both Round 1 and Round 2). But note: if we rectified Round 1, then Round 2 starts from a rectified state.

      This is getting complicated.

      To simplify:

          We will check after each round. The vote is on whether the current distribution (after the most recent round) violates the proviso. If yes, then the group can decide to adjust the transfers of the most recent round only? Or they can adjust any transfers? We want to model the idea that the proviso is violated by the cumulative effect, so we should allow rectification of prior rounds too.

      But that might be too complex for a game.

      Let me propose a simpler rule:

          After each round, the group votes on whether the current distribution violates the proviso (which we define as: any individual having less than 2 tokens OR the top holder having more than 20 tokens? We set thresholds arbitrarily). If the vote passes (simple majority?), then the group can propose a rectification plan (like taking tokens from the rich and giving to the poor, or voiding the last round of transactions). They vote on the plan.

      We'll do:

          Round 1: 
              - Perform transaction.
              - Record distribution.
              - Vote: "Does the current distribution violate the Lockean proviso?" (We'll define the proviso as: every person must have at least 2 tokens to be able to participate in the next round, and the maximum any one person can have is 20 tokens? We can adjust these numbers based on starting amounts. Starting with 10 per person, total 140 tokens. After one round: if all 13 pay 1 token to the performer, then performer has 10+13=23, and each audience has 9. Then if we set max=20, then 23>20 -> violation. Also, if someone has 0, that's a violation.)

          If violation, then the group must decide on a rectification. They can:
              - Void the last round: everyone gets back what they paid, the performer returns the tokens.
              - Redistribute: e.g., take tokens from the performer and give to the poorest until everyone has at least 2 and the performer is at most 20? But note: we don't want to over-redistribute.

          Then we proceed to the next round.

      We can do 3 rounds of this.

   Timeline:

      Total time: 75 minutes.

      Introduction (5 min): 
          - Explain the rules: 
              - Starting tokens: 10 per person.
              - Each round, one performer (randomly chosen for round 1) sets a price for a performance (must be a whole number, nonnegative, and same for all). 
              - Audience members choose independently whether to pay and watch. They must pay the price if they want to watch. If they don't pay, they don't watch (but they don't lose tokens).
              - After the round, we check the distribution against the Lockean proviso: 
                  1. No one should have fewer than 2 tokens (so they can still participate in future rounds).
                  2. No one should have more than 20 tokens (to prevent excessive concentration).
              - If either condition is violated, then the group holds a vote: 
                  Step 1: Vote on whether there is a violation (if the distribution breaks the above two rules). Majority vote.
                  Step 2: If violation, then the group proposes and votes on a rectification plan. The plan must specify how to adjust the token holdings to fix the violation. They can choose to void the last round (so everyone gets their tokens back) or to redistribute arbitrarily (as long as it fixes the violation). The plan must be approved by majority.

          - Note: The performer can be the same person multiple rounds? We decide: for round 1, random. Then for round 2, the performer is the one with the most tokens (so likely the same person). For round 3, again the one with the most.

      Round 1 (10 min):
          - Choose performer randomly (e.g., draw from a hat).
          - Performer sets price (P1). (1 min)
          - Audience decides: each writes on a slip whether they pay or not. Collect payments. (2 min)
          - Update ledger: subtract from those who paid, add to performer. (1 min)
          - Check: anyone below 2? anyone above 20? (1 min)
          - If violation, then:
              - Vote 1: "Violation?" (1 min)
              - If majority says yes, then they have 2 minutes to propose a rectification plan. Then vote on the plan (1 min). Execute the plan (1 min).
          - If no violation, move on.

      Round 2 (10 min): same as round 1, but the performer is the one with the most tokens (if tie, choose randomly among the top). If there was rectification in round 1, the state after rectification is the starting point for round 2.

      Round 3 (10 min): same as round 2.

      Then we have 40 minutes for debrief.

      But note: if no violation occurs, each round takes about 5 minutes. If violation, it takes 10. So we might run over.

      Let's cap the rectification discussion at 3 minutes. So:

          Round 1: 
              Transaction: 5 minutes (including updating ledger and checking)
              If violation: 
                  Vote 1: 1 minute (show of hands: violation? yes/no)
                  Then 3 minutes for proposing and discussing rectification plans (groups can huddle quickly)
                  Then 1 minute to vote on a plan (if multiple plans, majority chooses one to vote on)
                  Then 1 minute to execute.

              Total: 5 + 6 = 11 minutes.

      We'll do three rounds: 33 minutes worst-case, 15 minutes best-case.

      Then debrief: 42 minutes.

   Debrief Structure (42 minutes):

      I. What happened? (10 min)
          - Ask the performer: how did you set prices? 
          - Ask the audience: why did you pay or not pay?
          - When was a violation triggered? What rectification was chosen? Why?

      II. Mapping to Nozick (20 min):
          - Acquisition: In this game, initial tokens were distributed equally. How does that relate to the Lockean proviso on acquisition? (We started with a just initial acquisition.)
          - Transfer: The voluntary payments were transfers. But note: the rolling proviso condition was a constraint on transfers. In Nozick's original view, voluntary transfers are always just, provided the initial acquisition was just. But our game introduced a dynamic proviso that could override transfers even if voluntary.
          - Rectification: When the group voted to adjust, that was rectification. But in Nozick, rectification is for past injustices (like theft or fraud), not for voluntary transfers that lead to inequality. In our game, we defined a new kind of injustice: violating the rolling baseline.

          - The Tension: Nozick's theory is historical. The justice of a distribution depends on how it came about. Our game introduced a pattern-like element (the rolling baseline) that looks at the current state and may override history. This is more like Rawls than Nozick.

          - What the game can't reproduce: In Nozick's view, the Wilt Chamberlain example shows that voluntary transfers must be allowed even if they lead to inequality. The game, by introducing the rolling proviso, actually violates the principle that voluntary transfers are sacrosanct. The game therefore illustrates a modified version of entitlement theory that incorporates a dynamic Lockean proviso. But in Nozick's original, the proviso only applies to acquisition, not to transfers.

          - We must note: Nozick does say that the proviso applies to the result of the process. He writes: "The proviso that was put on the initial acquisition ... must be applied to the current state." But he doesn't specify that it should be applied repeatedly. However, he does allow for rectification for violations of the proviso. But in our game, we are applying it after every transfer and allowing rectification that undoes voluntary transfers. This is a departure.

      III. The Twist: Rolling Baseline (10 min)
          - Discuss: what does it mean for opportunity? In the game, if someone falls below 2 tokens, they can't participate meaningfully (they can't even pay the minimum price). Similarly, if the performer becomes too rich, they might set exorbitant prices. The group felt that this violates the opportunity of others.

      IV. What went wrong? (2 min)
          - Predictable issues:
              a) The performer might set a very high price and no one pays, so no violation. Then the performer sets a lower price and gets paid, but then the violation might be triggered and the group might void the transaction. This could lead to strategic behavior: performer sets low price to avoid triggering the vote? Or the audience might not pay to avoid triggering a violation? But note, the audience might want to watch even if it triggers a violation because they know they can vote to rectify.
              b) The rectification discussion might be dominated by a few vocal students.
              c) The thresholds (2 and 20) are arbitrary. The group might disagree on what constitutes a violation.

      V. Conclusion (5 min): 
          - This game highlights the tension between historical entitlement and patterned principles. It shows that if we take the Lockean proviso as a dynamic constraint, we might have to limit voluntary transfers. This is not in Nozick's original vision, but it is a possible extension to address the "historical shadow" of past transactions on current opportunity.

      VI. What to supply verbally: 
          - Nozick's original theory does not have this rolling baseline. He only requires that the initial acquisition satisfy the proviso, and then all voluntary transfers are allowed. Rectification is only for past injustices (like if the initial acquisition was unjust, or if there was force or fraud). In our game, we introduced a new kind of injustice: the violation of the rolling baseline. This is a modification of Nozick.

