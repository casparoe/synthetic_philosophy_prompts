          - Everyone with more than 10 tokens gets a candy bar? But then the performer might be the only one.

      Let's do:
          - The top 3 token holders at the end (after any rectification) get candy bars.

      But note: if we do rectification in the last round, it might change the top holders.

      We'll announce the payoff scheme at the beginning to incentivize.

