      - Performer: one per round (chosen by having the most tokens in the previous round, except round 1 which is random).
      - Audience: the rest.

   Materials:
      - Tokens: 140 tokens (14 students * 10 each). You can use paper slips or poker chips.
      - Ledger: a whiteboard or large paper to record each student's token count after each round.
      - Voting: show of hands or paper slips for votes on violation and rectification plans.

   Let's hope it works! The first time, expect confusion about the voting and rectification process. Be prepared to step in and guide the rectification proposals.

  Revised timeline with buffer:

      Introduction: 5 min
      Round 1: 10 min (if violation) or 5 min (no violation)
      Round 2: 10 min or 5 min
      Round 3: 10 min or 5 min
      Total for rounds: 15 to 30 minutes.
      Debrief: 45 to 30 minutes? We'll adjust.

   We'll aim for 25 minutes for rounds, 50 for debrief.

