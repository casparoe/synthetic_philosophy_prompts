  I'm advising a small interdisciplinary research group—mostly philosophers of science and computer scientists with no formal physics background—on how to allocate three years of funding within embedded agency: the problem of modeling rational agents as physical subsystems of the environments they influence. Three unresolved tensions seem especially live. First, does embedding an agent inside its environment collapse the standard distinction between causal and evidential decision theory, or can that distinction be reconstructed using only local boundary conditions? Second, how can one formalize an embedded agent's capacity to revise its own decision procedure without falling into the usual fixed-point paradoxes? Third, does embeddedness force an abandonment of logical omniscience assumptions in ways that render standard expected-utility frameworks unrecoverable? If the group's aim is to produce results that matter for both AI alignment practice and foundational philosophy of action, which one or two directions should it prioritize? Provide a defended ordering based on tractability with current formal tools, the breadth of downstream implications if resolved, and whether solving it would actually change work in either target field. Also specify which line should be explicitly deprioritized and why—whether because it depends on unsettled physics, is intractable now, or would have minimal spillover even if settled.
