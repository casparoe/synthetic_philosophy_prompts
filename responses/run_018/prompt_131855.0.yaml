  Noticing they emphasize avoiding classic Newcomb/moral motivation examples. Good call. Those are overused. They want fresh cases like citation incentives corrupting methodological choices or alignment feedback acting like "bribery" for AI beliefs. Concrete anchors matter here—abstract philosophizing would sink the proposal.

  Ah, the tricky part: they need to show why existing literature doesn't solve this. Metaethics fails because it's agent-centered; epistemology obsesses over accuracy metrics. The real tension is whether epistemic value can be non-instrumental for systems. That's the knife-edge the project balances on.

  For structure, I'll propose two parallel case studies: scientific publishing (human systems) and ML alignment (algorithmic systems). Comparing them could reveal if the wrong-kind reasons problem scales differently with agency. Three months is tight but feasible if we avoid empirical rabbit holes—just pure conceptual dissection of mechanisms.

  Biggest risk? Proving the distinction collapses into instrumentalism anyway. But even that null result would be valuable. It'd force epistemology to confront whether "integrity" is a luxury only conscious agents afford. 

