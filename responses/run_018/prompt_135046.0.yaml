answer: |-
  ## Proposal: The Architecture of Moral Concern - A Path-Dependence Inquiry into the "Expanding Circle"

  **1. Abstract:** This project challenges the presumed inevitability of the "expanding circle" model of moral progress – the dominant narrative where ethical concern widens progressively from kin to tribe, nation, humanity, and potentially all sentient beings. Utilizing tools from intellectual history, moral philosophy, and counterfactual analysis, it asks: **Is the *flattened, universalist architecture* of the modern expanding circle model a necessary outcome of moral progress, or is it path-dependent on specific historical framings, particularly early universalist rhetoric (e.g., in abolitionism)?** We will construct a robust counterfactual framing – "nested loyalty" – based on proximity and graduated obligation, and model its potential trajectory. The goal is to reveal whether our current moral architecture is contingent on historical framing choices, with implications for understanding moral progress, intervention design, and the potential for alternative ethical structures.

  **2. The Central Question:** The expanding circle (popularized by Singer, tracing to thinkers like Spencer) is widely accepted as *describing* moral progress. However, its specific *architectural form* – tending towards a flattened universalism where obligations become homogenous regardless of relational distance – is rarely interrogated for its *necessity*. Was this flattening an inevitable consequence of expanding moral concern itself, or was it critically shaped by the *specific rhetorical and conceptual tools* employed during key historical junctures, like the 19th-century reform movements? This project posits that the ubiquitous use of *universalist human rights language* by abolitionists and others acted as a crucial path-dependent node. Had they instead championed expansion using a logic of **"nested loyalty"** – emphasizing strong, differentiated obligations radiating outwards from core relationships (family, community) based on proximity and reciprocity, rather than inherent universal equality – might modern moral theory exhibit a fundamentally different, more layered and contextual architecture, resisting full flattening?

  **3. Gap in Current Work:** While extensive scholarship details the *history* of the expanding circle (e.g., tracing inclusion of new groups) and analyzes path-dependence in technological or institutional contexts, a significant gap exists concerning the path-dependence of *moral concepts themselves*.
  *   **Descriptive vs. Counterfactual:** Existing work meticulously *describes* how universalist arguments *were used* to expand the circle. It rarely rigorously constructs plausible *alternative framings* for achieving similar expansions (e.g., abolition) and models their potential long-term conceptual consequences.
  *   **Focus on Inclusion, Not Architecture:** The focus is often on *who* is included, not the *nature* of the obligations owed to those included. The assumption seems to be that inclusion *implies* uniform, universalist obligations, neglecting how the *rationale for inclusion* might structurally shape subsequent obligation.
  *   **Neglect of Framing Effects:** The power of specific rhetorical frames (like "rights" vs. "duty to one's extended household") in locking in conceptual trajectories for moral theory remains underexplored in this context.

  **4. Methodology: Counterfactual Conceptual Genealogy**
  This project employs a three-step conceptual modeling approach, grounded in analytical philosophy and intellectual history methodologies, but focused on exploring possibilities rather than documenting actual history:
      1.  **Constructing the Counterfactual Framing ("Nested Loyalty"):** Develop a historically plausible alternative conceptual framework for 19th-century moral reformers (e.g., abolitionists, early feminists). This framework will:
          *   Root primary moral obligations in concrete, proximate relationships (family, local community).
          *   Frame expansion of concern as an *extension of loyalty and duty* outwards, based on increasing levels of interaction, interdependence, and reciprocal benefit, rather than inherent universal equality.
          *   Explicitly reject or downplay universal, homogeneous rights language in favor of graduated, context-sensitive responsibilities.
      2.  **Tracing Structural Implications:** Model how this "nested loyalty" framing, if successfully established as the dominant rationale for expanding concern during the 19th century, might have shaped subsequent moral discourse and theory in the 20th and 21st centuries. Key questions:
          *   Would concepts like "human rights" have gained the same traction, or would they look different (e.g., more derivative, less foundational)?
          *   How would debates about distant obligations (global poverty, future generations, animals) be structured? Would they rely on arguments about interconnected systems and reciprocal impact rather than inherent worth?
          *   Would the "circle" maintain thicker boundaries and more differentiated obligations, resisting the flattening tendency of universalism?
      3.  **Comparative Stability Analysis:** Compare the modeled "nested loyalty" architecture against the actual historical trajectory of universalist expansion. Assess:
          *   **Conceptual Coherence:** Is the nested model internally consistent and capable of handling complex modern moral problems?
          *   **Motivational & Practical Stability:** Is it plausible the nested model could have sustained similar levels of moral expansion (e.g., ending slavery, granting suffrage) or expansion into new domains (animal rights)? Would it be more or less resilient to challenges like nationalism or tribalism?
          *   **Distinctiveness:** Does the model genuinely produce a *qualitatively different moral architecture* (layered, context-dependent obligations) compared to the universalist-flattened circle?

  **5. Deliverables:**
  *   **Working Paper (Core Output):** A 25-30 page paper presenting the constructed "nested loyalty" framework, the analysis of its potential historical trajectory and structural implications, the comparative assessment against the universalist path, and conclusions regarding path-dependence and the contingency of the expanding circle's architecture.
  *   **Intervention Design Brief (2-3 pages):** A concise, accessible summary for practitioners and theorists. It will outline key findings on the contingency of moral framing, discuss potential implications for designing interventions aimed at expanding moral concern (e.g., should strategies differ if targeting "extended loyalty" vs. "universal rights"?), and suggest avenues for further empirical or practical research.

  **6. Scope, Limitations, and Definition of Outcomes:**
  *   **Scope:** This is a three-month, desk-based, conceptual project. It involves philosophical analysis, conceptual modeling, and thought experiments informed by historical scholarship, but **excludes original archival research or detailed historical case studies of specific reformers beyond well-established general trends.** The focus is on building and analyzing the counterfactual model.
  *   **Positive Result:** A robust demonstration that the "nested loyalty" counterfactual leads to a conceptually coherent and stable moral architecture that is *qualitatively distinct* from the universalist-flattened model, particularly in maintaining significant graduated obligations. This strongly suggests the actual historical path (universalism) was contingent and locked in the specific architecture we have today.
  *   **Null Result:** If the "nested loyalty" model either (a) collapses conceptually under pressure to expand concern beyond the proximate, (b) inevitably converges on a flattened universalism despite its starting point, or (c) proves demonstrably unstable or incapable of motivating significant moral expansion compared to universalism. This would suggest the expanding circle's *tendency towards flattening* is more deeply rooted in the logic of expansion itself than in contingent framing choices.
  *   **Definition of Failure:** The project fails if the counterfactual framing of "nested loyalty" proves too vague, internally inconsistent, or historically implausible to generate a coherent alternative model for analysis. Failure also occurs if the comparative analysis cannot establish meaningful distinctions in the resulting moral architectures or stability between the two paths, rendering the path-dependence question indeterminate within the project's scope.

  **7. Significance:** Understanding whether the dominant architecture of modern ethics is path-dependent has profound implications:
  *   **Theory of Moral Progress:** It challenges narratives of inevitability, highlighting the role of contingent framing choices in shaping the very structure of our moral universe.
  *   **Intervention Design:** If moral concern can be viably expanded through different conceptual pathways (universal rights *or* extended loyalty), this opens new strategic avenues for advocates and educators working on inclusion, global justice, and animal welfare. Different frames might resonate differently in different contexts.
  *   **Future Ethics:** It prompts reflection on whether our current flattened architecture is optimal or if layered alternatives offer advantages (e.g., managing conflicting obligations) or disadvantages (e.g., justifying exclusion) we have overlooked.

  This project offers a novel lens on a foundational concept in ethics, leveraging counterfactual analysis to probe the contingency of our moral landscape. It transforms a question born of philosophical curiosity – "What if abolitionists argued differently?" – into a structured investigation with potential to reshape how we understand the history and future possibilities of moral concern.
