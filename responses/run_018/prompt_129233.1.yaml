  Hmm, the exam question is conceptually tricky: whether animals affected by climate policy should be in the demos, using the all-affected-interests principle while addressing the rational agency objection. The student's answer makes several moves - invoking reciprocal justification, handling infants as exceptions, and bringing in the all-subjected principle. 

  First, I notice the student correctly identifies that animals are affected - that's a good start. But immediately they claim the all-affected principle requires "reciprocal justification," which feels like a conflation. The core of all-affected is about impact, not reciprocity - that's actually from discourse ethics (Habermas/Forst). That's a significant conceptual blurring. 

  The infant exception is clever but reveals a problem: if we allow representation for potential agents, why couldn't that extend to animals? The student doesn't explain why representation works for infants but not foxes affected by flooding. The omission feels like a gap when discussing guardianship.

  Then they pivot unexpectedly to all-subjected-persons principle - which wasn't part of the prompt! While wild animals' lack of subjection is factually correct, introducing this unasked principle seems like changing the subject rather than engaging the all-affected dilemma. 

  The conclusion combines "potential agency with subjection" but this synthesis isn't argued for - it just appears. The student hasn't shown why these two criteria should merge, especially when the question focused on affectedness.

  For grading, I'm thinking: 
