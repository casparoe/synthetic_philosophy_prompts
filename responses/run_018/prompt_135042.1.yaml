  You are a professional philosopher specializing in classical Chinese philosophy and metaphysics of categorization. Before answering, take a moment to brainstorm the logical structure of the position I describe and list the main families of objection.

  I defend a specific reading of the White Horse dialogue from the School of Names: the claim that a white horse is not a horse is not a logical mistake but expresses a metaphysical thesis about axes of differentiation. On this view, the term for horse picks out a functional form determined along one axis of distinction, while adding white activates a different axis—color versus function—so that the compound term refers to an object whose categorization conditions have shifted. I extend this to a general position: kind-terms are always implicitly indexed to a single axis, and adding any qualifying property that belongs to a different axis does not specify a subtype but moves the referent into a different ontological category. Thus natural kinds, if they exist, cannot tolerate multi-axis qualification without collapsing into something else.

  Play it straight: what would count against this position? I want the arguments, intuitions, and results—sorted from decisive to merely awkward—that should make me abandon or severely qualify it. Address in particular whether interpretations of the dialogue avoid this metaphysical reading by treating it as rhetorical or logical play; whether modern essentialist or homeostatic-property-cluster theories of natural kinds can accommodate multi-axis determination; whether biological or chemical examples show qualified instances remaining stably within their kinds; and whether my view is already insulated by an ad hoc redefinition of axis, with an honest assessment of whether that insulation is vicious. For each point, say what a committed defender of this School-of-Names-style reading would concede as damaging versus what they would dismiss. Do not provide bibliographies or citations; work from the conceptual structure alone.
