prompt: |-
  As a retired physicist who has only recently begun attending philosophy seminars, I find myself struggling to distinguish accurate summaries of empirical literature from philosophical overinterpretation. At our last meeting of the university’s cross-disciplinary reading group, a colleague—who has a background in anthropology but no formal philosophical training—offered a characterization of the WEIRD morality literature and its implications for moral objectivity that I now wish to audit with someone who can think clearly about both the psychology and the metaethics. He framed the findings not as simple cultural divergence but through what he called normative calibration: the idea that human moral cognition operates like a measurement instrument with a shared metric but culture-specific zero-points, so that different societies can disagree about where fairness or purity falls on the scale without disagreeing about the scale itself.

  According to his summary, the empirical work demonstrates that Western, educated, industrialized, rich, democratic populations display a distinctive psychological profile: they weight individual harm and impartial procedural fairness far more heavily than loyalty, authority, or sanctity, whereas many non-WEIRD populations distribute moral weight more evenly across these domains. From this descriptive pattern, he drew two philosophical conclusions. First, because judgments about direct physical harm remain remarkably stable across populations—what he termed the objective core—moral objectivity is preserved for harm-based norms but need not extend to fairness or purity judgments, which vary too widely to claim universal truth. Second, he argued that this produces a domain-partitioned model of objectivity: morality is not globally subjective or globally objective, but rather calibrated differently across domains, with harm functioning as an invariant anchor and other domains functioning as culturally relative parameters. He added that this model avoids both crude moral relativism and naive universalism, and that philosophers who invoke the is-ought gap to block all empirical inferences to ethics are therefore ignoring the domain-specific structure revealed by cross-cultural psychology.

  Something about this strikes me as too neat, particularly the move from descriptive stability to normative objectivity in the harm domain, and the use of the calibration metaphor to insulate fairness judgments from objectivity claims. I would like a careful evaluation of whether his summary is fair to both the psychological findings and the philosophical debates. Specifically: which parts accurately reflect the WEIRD literature’s actual claims about cross-cultural moral variation, which parts conflate descriptive patterns with normative conclusions, and does the normative calibration framework genuinely help here or does it smuggle in an unjustified assumption of a shared metric? Moreover, if the descriptive stability of harm judgments is granted, does that genuinely support domain-partitioned objectivity, or could the same data be interpreted through evolutionary or functional explanations that carry no objectivist commitment? I am not asking for a bibliography; I want to know whether the reasoning survives correction.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're a retired physicist new to philosophy seminars, struggling to differentiate empirical summaries from philosophical overinterpretation. Their colleague presented a model called "normative calibration" based on WEIRD morality literature, which they want audited for accuracy in both psychology and metaethics.

  First, I need to recall the key points of the colleague's argument: moral cognition has a shared metric with culture-specific zero-points, harm as an objective core, and domain-partitioned objectivity. The user finds this "too neat" and questions the leap from descriptive stability to normative objectivity, especially regarding the calibration metaphor.

  The user's explicit questions are about the accuracy of the WEIRD literature summary, conflation of descriptive and normative claims, the legitimacy of the calibration metaphor, and alternative interpretations of harm's stability. But deeper needs might include understanding how to navigate interdisciplinary discussions, avoiding common pitfalls when moving from science to philosophy, and seeking tools to critically evaluate such arguments themselves.

  I should start by addressing the WEIRD literature's actual findings. Haidt's Moral Foundations Theory is central here. The colleague correctly notes WEIRD populations prioritize harm/care and fairness/reciprocity over loyalty, authority, purity. Non-WEIRD societies show more balanced weighting. But is harm truly invariant? The literature shows variations in harm judgments too, like indirect harm or differing thresholds. The colleague overstates harm's universality; it's more about its relative stability compared to other domains.

  Next, the descriptive to normative leap. Pointing out that stability doesn't equal objectivity is crucial. Philosophers like Mackie would argue that even if all cultures agree on harm, it could still be subjective (e.g., pain avoidance as biological, not moral truth). The colleague's model assumes shared metric, but without evidence for an objective moral scale, the calibration metaphor might presuppose what it tries to prove.

  The domain-partitioned objectivity idea is another leap. Why is harm objective but purity not? Without a metaethical basis, this seems arbitrary. Alternative explanations like evolutionary pressures or social coordination could explain harm's stability without invoking objectivity. The colleague's framework might not resolve the is-ought gap as claimed; it just shifts it to domain-specific levels.

  I should also consider if the calibration metaphor helps. While it's a useful heuristic, it risks reifying a shared metric that isn't empirically supported. The zero-point adjustment assumes a common scale, but without evidence, it's speculative. Philosophical critiques of such metaphors should be mentioned, like conflating descriptive patterns with normative structures.

  The user's physics background might make them sensitive to models that are elegant but lack empirical grounding. They might appreciate highlighting where the argument's simplicity overlooks complexities in the data or philosophy. Emphasizing the difference between consensus and objectivity could resonate with their scientific rigor.

  They might also need reassurance that their skepticism is valid. Pointing out that domain-partitioning doesn't avoid relativism but creates fragmented relativism could address their concern about it being "too neat." Suggesting that philosophers like Doris or Plakias discuss these issues might be helpful, but since they don't want a bibliography, focusing on reasoning flaws is better.

  In summary, the colleague's summary captures WEIRD findings mostly correctly but overstates harm's invariance. The philosophical inferences conflate description with normativity, the calibration metaphor assumes an unjustified shared metric, and harm's stability can be explained without objectivity. The user's intuition about the argument's neatness is spot-on; the model papers over deeper metaethical challenges rather than solving them.
answer: |-
  Your colleague's summary captures key descriptive patterns from the WEIRD literature but makes significant—and philosophically problematic—leaps in its normative interpretation. Here's a careful audit of both the psychological accuracy and metaethical reasoning:

  ### 1. **Accuracy Regarding WEIRD Literature**
     - **Descriptive Pattern**: Correct that WEIRD populations show disproportionate emphasis on *harm/care* and *fairness/reciprocity* (individual-focused foundations) compared to *loyalty, authority, purity* (group-focused foundations), while many non-WEIRD societies weight all foundations more evenly (Haidt, Graham, et al.). This is empirically well-supported.
     - **Harm's "Stability"**: Overstated. While judgments about *direct, unprovoked physical harm* show high cross-cultural agreement (e.g., hitting an innocent person is wrong), this dissolves in boundary cases:
       - Harm *justifications* vary (e.g., corporal punishment, honor-based violence).
       - Perceptions of *indirect harm* (e.g., pollution, witchcraft) differ culturally.
       - *Harm thresholds* are culturally calibrated (e.g., what constitutes "cruelty").
       - **Conclusion**: Harm is *relatively* more stable than purity, but it's not an invariant "objective core." The literature shows *degrees of variation*, not a binary (stable harm vs. variable purity).

  ### 2. **Conflation of Description and Normativity**
     - **The Core Error**: Your colleague conflates *descriptive consensus* with *normative objectivity*. Even if harm judgments were universally identical (which they aren't), this would not entail objectivity. Universality ≠ Objectivity. Consider:
       - *Evolutionary explanation*: Universal harm-aversion could arise from pain-avoidance mechanisms without implying moral facts.
       - *Functional explanation*: All societies prohibit murder because social cooperation collapses otherwise—no moral "truth" required.
       - **Philosophical Counter**: Mackie's "Argument from Queerness" applies here—even widespread agreement doesn't show moral properties exist mind-independently. The move from "all cultures agree harm is wrong" to "harm is objectively wrong" commits the naturalistic fallacy.

  ### 3. **Problems with "Normative Calibration"**
     - **The Shared Metric Assumption**: The calibration metaphor presupposes a universal moral "scale" (e.g., a linear dimension of "wrongness") with culture-specific zero-points. This is empirically and philosophically unsupported:
       - **No Evidence for Shared Metric**: Cross-cultural data shows *qualitative* differences in moral reasoning, not just quantitative shifts. For example:
         - Purity violations in some cultures are *ontologically distinct* from harm (e.g., desecration ≠ injury).
         - Fairness in WEIRD contexts focuses on impartiality; in non-WEIRD contexts, it may prioritize distributive outcomes or relational duties.
       - **Philosophical Problem**: The metaphor implicitly assumes moral realism (a universal scale exists) while denying it for some domains—a contradiction. If no universal scale exists, "calibration" is meaningless.

  ### 4. **Domain-Partitioned Objectivity: Unjustified**
     - **No Grounds for Partitioning**: Even granting harm's descriptive stability, there's no principled reason to assign it "objective" status while denying it to other domains. This is ad hoc:
       - If variation in purity judgments undermines its objectivity, why doesn’t variation in *applications* of harm (e.g., euthanasia) undermine harm’s objectivity?
       - **Alternative Explanations**: The same evolutionary/functional accounts explaining harm's stability (e.g., adaptive aversion to violence) apply to other domains (e.g., purity as pathogen avoidance, loyalty as coalitional psychology). None require objectivity.
     - **Relativism Not Avoided**: The model collapses into *domain-specific relativism*. If only harm is "objective," but cultures disagree on whether an act (e.g., blasphemy) causes harm, you still face relativism *within* the harm domain.

  ### 5. **The Is-Ought Gap Remains Unbridged**
     Your colleague dismisses philosophers invoking Hume’s is-ought gap too quickly. The WEIRD data describes *what is* (cultural patterns of judgment). To leap to *what ought to be* (e.g., "harm norms are objectively binding") requires:
     - **Unjustified Metaethical Commitments**: The model assumes moral realism for harm without argument. Anti-realists (e.g., error theorists, expressivists) can fully accommodate the data without positing objectivity.
     - **Ignoring Alternative Metaethics**: For example:
       - *Constructivism*: Moral norms are solutions to coordination problems—variance reflects differing social conditions, not "calibration."
       - *Pluralistic Relativism*: Moral diversity reflects irreducibly multiple values; no "anchor" needed.

  ### Key Corrections to the Reasoning
  | **Colleague's Claim** | **Problem** | **Corrected View** |
  |------------------------|-------------|---------------------|
  | "Harm is invariant" | Overgeneralizes data; boundary cases vary | Harm shows *relative stability* in core cases, not universality |
  | "Stability → Objectivity" | Conflates consensus with truth | Stability is consistent with realism, anti-realism, or non-cognitivism |
  | "Calibration requires shared metric" | Assumes without evidence | No empirical/philosophical basis for universal moral "scale" |
  | "Avoids relativism" | Creates fragmented relativism | Domain-specific objectivity is unmotivated and still relativistic |
  | "Is-ought gap irrelevant here" | Misunderstands gap | Data describes attitudes; no entailment to normative facts |

  ### In Short
  - **Empirically**: The summary captures WEIRD vs. non-WEIRD differences but exaggerates harm's universality and underestimates nuance in other domains.
  - **Philosophically**: The "normative calibration" framework smuggles in realist assumptions while failing to ground domain-specific objectivity. It doesn’t resolve the is-ought gap but masks it with a misleading metaphor. The same data fits alternative metaethical views (e.g., cultural evolution, pragmatic constructivism) without requiring objectivity *in any domain*.

  Your intuition that this is "too neat" is sound. The model imposes an elegant but unjustified structure on messy empirical and philosophical landscapes. Cross-cultural psychology reveals fascinating variation, but leaping from descriptive patterns to partitioned objectivity requires philosophical heavy lifting your colleague hasn't done.
