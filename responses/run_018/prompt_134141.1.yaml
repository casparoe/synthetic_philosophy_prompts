answer: |-
  Here's a clear breakdown of path dependence and its implications for your questions, cutting through the noise:

  **1. Is History "Locked In"?**  
  No, but it's **sticky**. Path dependence means early, often random events constrain later choices through **feedback loops** (e.g., sunk costs, network effects, adaptive expectations). Rerunning history would likely produce *different* initial outcomes, but once a path gains momentum, reversal becomes increasingly costly. Outcomes aren't predetermined, but once on a path, switching is hard.

  **2. Carbon Tax: Lock-In or Status Quo Bias?**  
  A carbon tax *can* create genuine institutional lock-in, not just bias:  
  - **Adaptive Ecosystems:** Industries invest in low-carbon tech; lobbyists defend the tax; bureaucracies form to administer it; public spending relies on revenue.  
  - **Switching Costs:** Repealing it disrupts markets, voids investments, and triggers political backlash from new stakeholders.  
  - **BUT:** It's not irreversible. A major crisis (e.g., economic crash, energy shortage) could shatter the equilibrium. Still, the *cost* of reversal rises over time, making it a "soft" one-way bet.

  **3. QWERTY: Overused but Valid**  
  QWERTY *is* path-dependent, but the lesson holds:  
  - **Contingency:** Dvorak keyboards are arguably more efficient, but QWERTY’s early adoption created unassailable network effects (training, hardware, muscle memory).  
  - **Rerun Test:** In 100 alternate histories, QWERTY wins most due to early randomness + self-reinforcement. True lock-in.  
  - **Why it Matters:** Tech standards (USB, Blu-ray) follow this pattern. Dominance isn’t about superiority—it’s about timing and inertia.

  **4. Big Reforms as One-Way Bets?**  
  **Yes, but with caveats:**  
  - **High-Stakes Reforms** (e.g., currency unions, constitutions) create *adaptive ecosystems*. Reversal risks chaos (e.g., Brexit costs).  
  - **Key Factors:**  
    - **Sunk Costs:** Financial/emotional investments create constituencies.  
    - **Coordination Problems:** Even if suboptimal, collective switching is hard (e.g., clean energy transitions).  
    - **Critical Junctures:** Early flexibility exists—but diminishes rapidly.  
  - **Not All Policies Are Equal:** A carbon tax with sunset clauses ≠ Social Security privatization. Assess reversibility *during design*.

  **Implications for Policy Design:**  
  1. **Front-Load Reversibility:** Build review mechanisms/sunset clauses early, when change is cheaper.  
  2. **Anticipate Feedback Loops:** Who benefits? Will they entrench the policy? (e.g., green tech lobbies).  
  3. **Avoid "Big Bang" Where Possible:** Modular reforms (e.g., pilot programs) reduce path-dependent risks.  
  4. **Lock-In Isn’t Always Bad:** Desirable policies (human rights laws) *benefit* from stickiness.  

  **Bottom Line:** History isn’t destiny—but once a path accumulates stakeholders and sunk costs, rewinding is prohibitively expensive. Treat transformative policies as **probabilistic one-way doors**: assume irreversibility unless deliberately engineered otherwise. QWERTY’s ghost reminds us: the cost of being wrong scales with time.
