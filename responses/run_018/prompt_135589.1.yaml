  We are constructing a decision procedure based on Jain anekāntavāda (non-absolutism) for a municipal deliberative council. The procedure must be usable by non-specialists in about 30 minutes per case. We'll focus on two key doctrines:
   1. Syādvāda: Conditioned predication. Any assertion is qualified by the standpoint from which it is made (e.g., "from a certain perspective, it is...").
   2. Nayavāda: The doctrine of partial standpoints. Every claim captures only one aspect of a multifaceted reality.

   We are adding an operational constraint: Before evaluating any claim, the board must decompose it into at least three independently identifiable causal or descriptive pathways. If a submission collapses into a single unqualified assertion, it is discarded.

   The procedure must handle three hard cases and produce one of three outcomes:
     A. Publish both with framing (as partial perspectives)
     B. Publish one with a critical note (if one is incompatible with established fact, but the other is acceptable)
     C. Reject one (if it fails the decomposition or is incompatible with facts)

   We are reducing the full saptabhaṅgī (sevenfold predication) to a four-category taxonomy for practicality. The sevenfold scheme includes:
     1. syāt-asti — somehow it is.
     2. syāt-nāsti — somehow it is not.
     3. syāt-asti-nāsti — somehow it is and is not.
     4. syāt-avaktavyaḥ — somehow it is inexpressible.
     5. syāt-asti-avaktavyaḥ — somehow it is and is inexpressible.
     6. syāt-nāsti-avaktavyaḥ — somehow it is not and is inexpressible.
     7. syāt-asti-nāsti-avaktavyaḥ — somehow it is, is not, and is inexpressible.

   We simplify to four categories (which cover the main practical cases):
     I.   Existence (asti): The assertion is valid from a particular standpoint.
     II.  Non-existence (nāsti): The negation is valid from a particular standpoint.
     III. Both (asti-nāsti): The assertion and its negation are valid from different standpoints (but expressible).
     IV.  Inexpressible (avaktavyaḥ): The assertion and its negation cannot be simultaneously expressed without contradiction in the current framework (but both are part of reality).

   However, note that in practice we are more focused on qualifying assertions by standpoints and ensuring that multiple perspectives are considered.

