prompt: |-
  Here's an argument I built for my moral revolutions seminar and now find suspicious because it makes progress look like fashion. (1) Appiah says dueling collapsed because it became embarasing, not because anyone won the argument — honor turned against it. (2) Williams adds that norms sometimes die by becoming unthinkable rather than being refuted. (3) If that's right, then a norm's survival is just a function of the social cost of violating it — call it the shame-price. (4) So moral change is just a shift in shame-prices, not a discovery of what's actually right or wrong. (5) Apply that consistently: slavery ended not because it was shown to violate human dignity, but because defending it got too expensive socially. (6) But then abolition is rationally on par with, say, the decline of powdered wigs — both are just shame-price shifts. (7) I don't want to say abolition was just fashion; I think it was genuinely progressive. So which step do I reject? If I keep (3), do I have to pay the price of saying moral progress is arbitrary?
reasoning: |-
  Okay, let me start by unpacking the user's argument. They're presenting a structured case from their moral revolutions seminar, but they're worried it reduces moral progress to something like fashion trends. The core issue seems to be that if moral changes are just shifts in social costs (shame-prices), then something as significant as abolition isn't fundamentally different from changes in fashion, like powdered wigs falling out of style.

  First, I need to understand each step of their argument. They reference Appiah and Williams. Appiah's point about dueling collapsing due to embarrassment rather than argument makes sense. Honor cultures can shift when practices become laughable. Williams adds that norms can die by becoming unthinkable, not through rational debate. The user then connects this to shame-prices as the mechanism for norm survival. 

  The critical step is where they equate all moral change to shifts in shame-prices. The user applies this to slavery's abolition, suggesting it wasn't about discovering its wrongness but the social cost of defending it. This leads to the conclusion that abolition is no more rational than fashion changes. The user resists this, believing abolition was genuinely progressive. So they need to find which step to reject without undermining moral progress.

  Now, considering possible weak points. Step 3 seems key: reducing norm survival solely to shame-prices. This is a descriptive claim, but maybe it's not the whole story. Norms can persist for reasons beyond shame, like genuine moral conviction. Also, step 4's move from description to a claim about moral truth is problematic. Just because shame-prices shift doesn't mean there's no moral truth involved. 

  The user might be conflating mechanisms of change with justifications. Even if social costs drive adoption, the underlying reasons can be moral truths. Abolitionists argued on moral grounds, which then increased the social cost of supporting slavery. The shift in shame-prices here could be a consequence of moral persuasion, not the cause itself.

  Another angle: the user might reject the reduction of all moral change to shame mechanisms. Some norms change through reasoned arguments that reshape societal values, not just social pressure. For example, the moral arguments against slavery could have made it unthinkable, not merely costly to defend. This maintains that progress is about discovering moral truths, even if social dynamics play a role in dissemination.

  The user's deeper concern seems to be preserving the objectivity of moral progress. They don't want to equate abolition with fashion trends. So they need a way to acknowledge the role of social dynamics without reducing morality to mere convention. Distinguishing between epistemology (how we come to believe) and ontology (what is true) could help. Moral truths exist independently, and social mechanisms might help society recognize them, but that doesn't make the truths arbitrary.

  Possible solutions: reject step 4’s implication that moral change is only about shame-prices, not discovery. Or refine step 3 to allow that shame-prices can be influenced by moral reasoning. Alternatively, challenge the binary in step 6—abolition involved both moral discovery and social enforcement. The decline of wigs didn't have a moral truth component, while abolition did. Thus, moral progress isn't arbitrary because it's tethered to truths about human dignity.
answer: |-
  This is a brilliant and deeply unsettling argument – you've perfectly captured why Appiah/Williams-style analyses can feel existentially threatening to moral realism. Your suspicion is warranted, but the conclusion (that progress is arbitrary) isn't inevitable. The weak step is **Step 4**, and the problematic leap happens between Steps 3 and 5. Here's the breakdown:

  1.  **Steps 1 & 2 (Appiah/Williams):** Largely accurate descriptions of *mechanisms* of change. Norms *can* and *do* collapse due to shifts in perceived honor, embarrassment, and becoming "unthinkable." This is a powerful sociological insight.
  2.  **Step 3 (Shame-Price):** A reasonable *descriptive* label for the *enforcement mechanism* of norms. The "shame-price" is the social cost of violation, which *does* correlate strongly with a norm's stability. This is a useful tool for *explaining how norms persist or change*.
  3.  **Step 4 (The Problematic Leap):** This is where the unwarranted reduction occurs. You move from "*A norm's survival is a function of its shame-price*" (descriptive claim about enforcement) to "*Moral change is* **just** *a shift in shame-prices, not a discovery of what's actually right or wrong*" (a strong metaphysical claim denying moral truth/progress). Step 4 conflates the *mechanism of social enforcement* with the *justification or truth* of the norm itself. It turns a "how" into an "only how, not a why."
  4.  **Step 5 (Application to Slavery):** This *follows logically* **if you accept Step 4**, but that's the issue. Applying the "shame-price" mechanism descriptively to abolition ("defending it got too expensive socially") isn't necessarily wrong – it *was* a factor. The problem is Step 4 forces this to be the *only* factor, excluding the role of moral argument and perceived truth.
  5.  **Step 6 (The Equivalence):** Again, this follows *if you accept Step 4*. If moral change is *only* shifting shame-prices, then abolishing slavery and abandoning powdered wigs *are* equivalent processes at the sociological level of mechanism.
  6.  **Step 7 (The Intuition):** Your intuition is correct! Abolition *was* genuinely progressive. The challenge is to explain *how* without abandoning the powerful descriptive insights of Steps 1-3.

  **Why Step 4 is the Weak Link & What to Reject/Refine:**

  *   **The Reductionist Fallacy:** Step 4 commits a fallacy of reduction. It says because social enforcement (shame-price) is a *necessary condition* for norm stability and a *key mechanism* of change, it is the *only* relevant factor and *exhausts* the meaning of moral change. This ignores:
      *   **The Role of Reason & Argument:** Moral revolutions are often *preceded* and *driven* by sustained moral arguments exposing contradictions, appealing to existing values in new ways, or revealing new facts (e.g., the humanity and suffering of enslaved people). These arguments *change minds* and *then* change the social cost (shame-price) of holding the old view. The argument *causes* the shift in shame-price, it's not merely the shift itself.
      *   **The Possibility of Moral Truth:** Even if social mechanisms *mediate* how moral truths become widely accepted and enforced, it doesn't mean those truths don't exist independently or that recognizing them isn't progress. Discovering slavery violates human dignity *is* a cognitive achievement, even if making that violation socially costly is how the norm gets entrenched.
      *   **The Difference Between Epistemology and Ontology:** *How we come to know/believe* something is right or wrong (which involves social processes like shame) is different from *whether it actually is* right or wrong.

  **How to Reject Step 4 While Keeping the Valuable Insights (Steps 1-3):**

  1.  **Reframe Step 4:** Instead of "Moral change is **just** a shift in shame-prices, not a discovery..." try: **"Significant moral change often *involves* a shift in shame-prices, which is the *social enforcement mechanism* reflecting changing beliefs about what is right or wrong. This shift can be *driven* by moral arguments, new experiences, and the perceived discovery of genuine wrongs."**
  2.  **Distinguish Mechanism from Justification:** Agree that the *collapse* of a norm like dueling or the *enforcement* of abolition *relies* on shifting social costs (shame-price). However, argue that the *reason* the shame-price shifted for slavery was (at least in part) because compelling arguments *convinced* people it was fundamentally wrong and violated human dignity. The shift wasn't *arbitrary* like fashion; it was *responsive* to perceived moral truth. The shame-price shift *embodied* the moral discovery.
  3.  **Acknowledge Complexity:** Moral revolutions are messy. Shame-price shifts *are* crucial for explaining rapid collapse and unthinkability (Williams). Fashion and social pressure *do* play a role. But for *genuine moral progress* like abolition, the shift is ultimately *grounded* in reasons that go beyond mere social cost – reasons related to suffering, equality, dignity, and consistency. The social cost rises *because* the perceived wrongness becomes undeniable to a critical mass.
  4.  **Reject the Equivalence (Step 6):** Abolition involved a fundamental *moral* discovery about human equality and the evil of treating people as property. The decline of powdered wigs involved changing aesthetic preferences and social signaling with no inherent moral content. The *mechanism* of change (shifting social costs) might look similar sociologically, but the *content* and *justification* are radically different. Moral progress isn't *just* the mechanism; it's the direction and substance of the change enabled by the mechanism.

  **Conclusion:**

  You don't have to reject the descriptive power of the shame-price mechanism (Step 3). Reject the **reductionist leap in Step 4** that claims moral change is *only* about shifting shame-prices and *not* about discovering moral truth. You can hold that:

  1.  Shame-prices are the *enforcement engine* of norms.
  2.  Shifts in shame-prices are the *mechanism* through which norms change rapidly and become unthinkable.
  3.  **However,** for *moral* norms, these shifts are often *triggered by and responsive to* moral arguments, experiences, and the perceived discovery of genuine wrongs or inconsistencies.
  4.  Therefore, abolition *was* driven by the discovery (or widespread convincing argument) that slavery violated human dignity, **and** this discovery *led to* an increase in the shame-price of defending slavery, which ultimately made the norm collapse. The shift in shame-price was the *consequence* and *enforcer* of the moral insight, not its *replacement*.

  This allows you to accept Appiah's and Williams's insights about *how* norms die socially without conceding that moral progress is ultimately arbitrary or equivalent to fashion. The "price" you pay isn't arbitrariness, but acknowledging the complex interplay between moral reasoning, social psychology, and historical contingency in driving genuine progress.
