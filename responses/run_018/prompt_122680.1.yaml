  ### **Modal Epistemology Decision Tree**

  **Start**: You encounter the claim that conceivability (e.g., imagining a scenario) implies metaphysical possibility. You're unsure whether this is reliable.

  #### **Q1: EVIDENTIAL WEIGHT**  
  Does conceiving *P* (e.g., a zombie world—physically identical to ours but without consciousness) provide *any evidence at all* that *P* is metaphysically possible?  
  - **No** → Proceed to **Q1a**.  
  - **Yes** → Proceed to **Q2**.  

  **Q1a: [If no to Q1]** Do you reject *all* conceivability-based evidence for metaphysical possibility, even after ideal reflection?  
  - **Yes** → **Leaf: Modal Skepticism** (Conceivability carries no modal weight; e.g., zombie intuition is uninformative).  
  - **No** → *(Incoherent: If conceiving P provides no evidence, but you allow some role for conceivability, this contradicts Q1. Back to Q1.)*  

  ---

  #### **Q2: ASYMMETRY**  
  Is failing to conceive *P* (e.g., a round square) evidence that *P* is metaphysically *impossible*?  
  - **Yes** → Evidence is symmetric. Proceed to **Q3**.  
  - **No** → Evidence is asymmetric (only conceivability supports possibility). Proceed to **Q3**.  

  ---

  #### **Q3: DEFEAT BY A POSTERIORI NECESSITY**  
  How do you explain cases like Hesperus/Phosphorus, where we can conceive of Hesperus ≠ Phosphorus, but it's metaphysically impossible?  
  - **A**: The conceivability is *defeated* by a posteriori necessities (e.g., identity is necessary). Proceed to **Q4**.  
  - **B**: Conceivability tracks a *non-metaphysical* kind of possibility (e.g., epistemic or "primary" possibility). Proceed to **Q5**.  
  - **C**: Conceivability only works for *specific domains* (e.g., consciousness but not identity). Proceed to **Q6**.  

  ---

  #### **Q4: [If A in Q3] DEFEASIBILITY SCOPE**  
  When conceivability is defeated (e.g., in identity cases), does this imply conceivability is *always* merely defeasible evidence, even in other domains?  
  - **Yes** → Proceed to **Q7**.  
  - **No** → *(Unattractive: Admitting domain-specific defeat without endorsing localism (Q3-C) is rare. Positions converge here—proceed to* ***Q7*** *for consistency.)*  

  ---

  #### **Q5: [If B in Q3] TWO-DIMENSIONAL HANDLING**  
  Does conceiving *P* (e.g., zombies) under ideal rational reflection indicate that *P* is metaphysically possible *when considered as actual* (i.e., primary possibility)?  
  - **Yes** → Proceed to **Q8**.  
  - **No** → *(Incoherent with B: If conceivability tracks non-metaphysical possibility but not even primarily, it undermines Q3-B. Back to Q3.)*  

  ---

  #### **Q6: [If C in Q3] LOCAL DOMAINS**  
  Is conceivability a guide only for domains where no a posteriori necessities apply (e.g., consciousness but not chemistry)?  
  - **Yes** → **Leaf: Localist** (Conceivability entails possibility only for specific subjects, e.g., zombie intuition implies non-physicalism, but Hesperus/Phosphorus doesn't challenge identity theory).  
  - **No** → *(Incoherent: Rejecting domain-restrictions contradicts Q3-C. Back to Q3.)*  

  ---

