answer: |-
  The Mytilene Debate is a perfect stress test for your "democracy half-life" model. Let's dissect the actors, map the institutional dynamics, and evaluate the decay pattern against Sicily and Socrates:

  **Core Mechanism: Exponential Remorse Decay**  
  *Hypothesis*: Collective regret after a punitive democratic vote decays exponentially with execution lag. Reversal likelihood plummets as time passes.

  **Mytilene 428 BCE: Anatomy of Reversal**  
  1.  **Decision-Makers & Motives**:  
      -   **The Demos (Assembly)**: Voted for genocide under Cleon's rhetoric (vengeance, deterrence, fear of revolt contagion). High emotional valence.  
      -   **Cleon's Faction**: Hardliners valuing perceived strength & swift terror. Saw deliberation as weakness.  
      -   **Diodotus' Faction**: Pragmatists/Moderates (later). Focused on long-term Athenian interest: preserving taxable/usable populations, avoiding future rebellions fueled by despair.  
      -   **The Crews (Execution Lag)**: The rowers of the *first* trireme were physical vectors of the decay mechanism. Their 24+ hour journey created crucial temporal distance.

  2.  **The Reversal as Institutional Data**:  
      -   **Lag**: ~24 hours between vote 1 (genocide) and vote 2 (reversal). Critically short.  
      -   **Process**: The *delay itself* enabled reflection. Diodotus framed his argument *not* on morality (knowing it would fail) but on cold utility: "Is this punishment *useful* to Athens?" He exploited the temporal gap for rational recalibration.  
      -   **Second Vote**: Narrow victory for reversal. Reflects *rapid but incomplete* decay of the initial emotional impulse. Exhaustion likely played a role (heated debate, physical/emotional drain), but Diodotus successfully channeled residual remorse/nascent pragmatism into a rational choice. **Model Fit: Strong.** The short lag allowed remorse/pragmatism to surface *before* exponential decay could fully extinguish it. The crews' frantic chase is the literal enactment of racing against the decay curve.

  **Where the Model Goes Silent/Needs Nuance**:  
  *   **Was the Second Vote Rational or Exhausted?** Likely both:  
      *   **Rational**: Diodotus' utility argument prevailed. The lag allowed calculation (preserving manpower, avoiding creating eternal enemies) to outweigh fading vengeance.  
      *   **Exhaustion**: The emotional energy sustaining Cleon's position *had* decayed significantly overnight. Sustaining bloodlust requires constant agitation; the lag dissipated it. Exhaustion made the demos receptive to a calmer, pragmatic alternative. The model captures the *decay of the impulse to punish* but not the *rise of the counter-impulse* – which requires actors like Diodotus to exploit the opening.

  **Testing Against Other Episodes: Does the Decay Pattern Hold?**

  1.  **Sicilian Expedition (415-413 BCE)**:  
      *   **Initial Decision**: Enthusiastic, hubristic vote for massive invasion, fueled by Alcibiades' ambition and unrealistic optimism (Thucydides 6.24). Minimal remorse *before* departure.  
      *   **Lag**: Years of campaigning, setbacks, siege.  
      *   **"Remorse" Manifestation**: Not reversal, but paralysis and blame-shifting. Recall of Alcibiades (fueled by suspicion, not remorse over the *decision*), underfunding of reinforcements, failure to cut losses.  
      *   **Fit**: **Perfect Exponential Decay.** Initial enthusiasm decayed into fatalism and inaction as the lag lengthened. No reversal was possible; the commitment was sunk, and the remorse (for the *launch*) was long extinguished by the time disaster struck. Regret focused on *execution*, not the original vote.

  2.  **Trial of Socrates (399 BCE)**:  
      *   **Initial Decision**: Vote for death penalty (narrowly, after initial guilty verdict). Motives: impiety, corrupting youth, association with enemies (Alcibiades, Critias).  
      *   **Lag**: ~30 days (Delian mission).  
      *   **"Remorse" Manifestation**: Plato claims many Athenians quickly regretted it (*Phaedo* 116c), but *no institutional reversal* was attempted. Socrates refused exile.  
      *   **Fit**: **Partial Fit / Highlights Model Limits.**  
          *   *Decay Observed*: The emotional fervor of the trial likely decayed rapidly. The lack of a reversal movement suggests remorse, while present in individuals, didn't coalesce into collective political action *before* execution.  
          *   *Model Silence*: Why no reversal vote?  
              *   **Different Context**: Not a reversible *policy* like sending orders, but a judicial verdict.  
              *   **Lack of Factional Leadership**: No Diodotus figure organized a formal challenge.  
              *   **Socrates' Agency**: His refusal to propose a palatable alternative (like exile) blocked an easy off-ramp.  
              *   **Nature of Charges**: Reversing a death sentence for impiety/corruption might have seemed like endorsing the crimes. The model explains the *decay of the punitive impulse* but not the *institutional barriers* to acting on residual regret in a judicial vs. policy context.

  **Conclusion: Mytilene as the Archetype, Not the Outlier**

  *   **Mytilene Fits**: It perfectly illustrates the core hypothesis. The extremely short lag allowed collective remorse/pragmatism (amplified by Diodotus) to overcome the decaying initial punitive impulse before execution. The crews were the literal chronometers of decay.
  *   **Sicily Confirms**: Shows the model's predictive power for long-lag scenarios. Initial enthusiasm decayed into fatalistic inaction, making reversal/course correction impossible.
  *   **Socrates Tests Limits**: Demonstrates the model's scope conditions. Exponential decay of the *desire for punishment* likely occurred, but institutional rigidity (judicial verdict vs. policy order), lack of leadership for reversal, and the defendant's actions prevented institutional remorse from manifesting as reversal. The "half-life" applies to the *impulse to act*, not necessarily the *capacity* or *mechanism* for reversal.

  **The Model's Power & Silence**:  
  *   **Power**: Excellently predicts the *window of opportunity* for democratic reversal of punitive actions based on time-to-execution. Explains why Mytilene was reversible and Sicily wasn't.  
  *   **Silence**: Needs supplementation for:  
      *   The role of counter-leadership (Diodotus vs. absence in Socrates).  
      *   Institutional differences (policy decree vs. judicial verdict).  
      *   The nature of the "regret" (emotional remorse vs. pragmatic recalculation).  
      *   Exogenous events during the lag (e.g., no new info in Mytilene, constant setbacks in Sicily).  

  Mytilene isn't an outlier; it's the clearest example of the "half-life" in action under near-ideal conditions for reversal (short lag, policy context, effective counter-arguments). Sicily shows the decay in the absence of reversal mechanisms, and Socrates reveals the model's boundaries when institutional and agential factors block the expression of residual regret. The exponential decay of collective punitive fervor is a powerful Athenian democratic dynamic, but its institutional consequences depend on the interplay of time, leadership, and political structure.
