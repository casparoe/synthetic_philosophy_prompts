  I've been working through the spectrum argument against the transitivity of "better than" in my philosophy of value seminar, and I've adopted the view that comparative value is genuinely intransitive across long chains of barely perceptible improvements—not merely vague or indeterminate, but structurally non-transitive. Before I commit to this in my term paper, I want an honest map of its exposure. What observations, formal results, or theoretical costs would genuinely count against this intransitivist position? In particular, if such intransitivity is real, then rational agents with these preferences should be vulnerable to cyclical money-pump exploitation even in fully transparent, finite choice sets where vagueness is entirely absent; is that a fatal flaw, or can defenders absorb it as a practical quirk without theoretical damage? Are there also conceptual or empirical reasons to think that comparative judgments stabilize at certain granularities, undermining the premise that micro-differences accumulate without bound? Please distinguish defeaters that would be decisive from those that are merely awkward, indicate which ones a committed intransitivist should themselves concede rather than dismiss, and rank them from fatal to inconvenient. End with a single-line summary: Verdict: [strongest defeater] / [insulation status: well-insulated or exposed].
