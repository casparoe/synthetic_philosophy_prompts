prompt: |-
  I was talking with my freinds about animal ethics and I realized my intuitions about speciesism are kinda scattered but I want to see if there's actually a principle behind them. So here are my gut calls on specific cases. Factory farming pigs just for bacon feels clearly wrong. Swatting a mosquito that's actively biting you is totally fine. Swatting one just because you're annoyed feels wrong too, but somehow less wrong than the pig thing, even though both are killing. Keeping a really smart parrot in a big enriched cage with company and toys still feels wrong to me, though not as bad as factory farming. Eating meat that's grown in a lab and never had any nervous system at all seems fine. But then there's this wierd case: imagine we bio-engineer a cow that behaves exactly like a normal cow but literally lacks any capacity for subjective experience, then raise it and slaughter it for food -- that feels okay, even if it's a bit creepy. Not saving a wild deer from a forest fire when you could do it with literally zero risk to yourself also feels wrong, but in a different way than the factory farming wrongness. Testing cosmetics on rabbits is wrong; testing a genuinely life-saving medicine on mice when there's absolutly no alternative feels okay.

  So is there one principle that captures all of these, or do I need a cluster? And which of my verdicts does it have to throw out if it wants to stay simple? Also please tell me what your principle says about using insects for large-scale bioremediation projects where they live in enriched conditions but are eventually killed once the soil is cleaned -- I keep going back and forth on that one.

  Please separate what's fairly settled in animal ethics from what's genuinely contested among people who actually know the literature, and don't present a controversial view as if it's the consensus. I want the response structured as a JSON object with exactly these fields: "principle_name" (string), "case_matchups" (array of objects each with "case_description" and "verdict" being either "captures" or "fails"), "tension_point" (string explaining the hardest pair to reconcile), "new_case_prediction" (string for the bioremediation insects), and "settled_vs_contested" (object with "settled" and "contested" arrays of brief strings).
reasoning: |-
  Hmm, the user is exploring their intuitions about animal ethics and speciesism. They've shared several specific scenarios where they have strong gut feelings about what's right or wrong, and they want to know if there's a unifying principle behind these intuitions. The cases they mentioned include factory farming pigs, swatting mosquitoes, keeping intelligent parrots in captivity, lab-grown meat, engineered "zombie cows," not saving wild deer, and animal testing.

  Looking at their examples, I notice a pattern emerging around consciousness and suffering. When the animal clearly suffers (like factory-farmed pigs or tested rabbits), they feel it's wrong. When there's no suffering (like lab-grown meat without a nervous system), they feel it's acceptable. The mosquito case is interesting because they distinguish between defensive swatting (okay) and swatting out of annoyance (less okay but still not as bad as harming pigs). This suggests that while they value minimizing suffering, they also consider factors like necessity and proportionality.

  For the bioengineered cow scenario, they're comfortable with it despite the cow behaving normally because it lacks subjective experience. This points strongly to a "sentience principle" where the capacity for suffering is the key moral factor. Their discomfort about the parrot in an enriched cage suggests they also care about freedom or natural behaviors beyond just suffering. The deer rescue case introduces a positive duty to prevent harm when possible, which adds another dimension.

  The bioremediation insect case is tricky. Insects in enriched conditions would presumably have some quality of life before being killed. A strict sentience principle might permit this if insects aren't sentient, but if they are, the killing becomes problematic. This tension between preventing suffering and respecting life itself shows up in several of their cases.

  Among ethicists, the moral relevance of sentience is widely accepted. Positions diverge on how we determine sentience (especially for insects), whether death itself harms nonsuffering beings, and how strong our positive duties to wild animals are. The user's intuitions align well with a sentience-focused view but would need to compromise on the parrot case (accepting enriched captivity as potentially ethical) or the annoyance-swatted mosquito (treating it as similarly wrong to other unnecessary killing).

  For the bioremediation case, their principle would likely approve it if insects aren't sentient, but require painless killing methods if they are. The key is determining insect sentience - which remains scientifically contested. Their discomfort might stem from unresolved questions about consciousness thresholds.

  I'll structure my response as requested - identifying a Sentience Principle that captures most cases, noting where it conflicts with their intuitions (particularly regarding the parrot and the "annoyance mosquito"), and clarifying what's settled versus contested in the literature. The bioremediation prediction will hinge on the unresolved question of insect sentience.
