  Okay, the user is writing their dissertation chapter on Gödel's 1949 rotating universe model and is struggling with a specific point. They're trying to connect Gödel's closed timelike curves (CTCs) in his cosmological solution to his philosophical argument about time not being objectively real, similar to Kant's idealism. They wonder if the CTCs serve as physical proof that temporal passage is an illusion. However, their advisor says they're conflating the cosmological model with his metaphysics. 

