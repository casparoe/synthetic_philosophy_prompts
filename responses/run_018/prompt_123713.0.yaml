  The CTCs in his model were a consequence of the solution, but Gödel's philosophical argument didn't rely on them as "proof." He focused on the relativity of simultaneity even in standard special relativity. The CTCs were an extreme example, but not necessary for his idealism argument. Additionally, as the advisor noted, the CTCs require unrealistic conditions, so they might not be physically realizable. 

