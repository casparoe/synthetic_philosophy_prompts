  I'm writing my diss chapter on Gödel's 1949 rotating universe and I'm stuck on a basic point. His metric has those closed timelike curves — if the universe rotates globally with that negative cosmological constant, you can loop back in time. And in that same year he published the idealism paper arguing time isn't objectively real, like Kant said. I keep thinking he used the CTCs as a kind of physical proof: if the math lets you literally visit your own past, that demonstrates temporal passage is just an illusion, right? But my advisor says I'm conflating the cosmological model with his metaphysic's. Is the error that Gödel's philosophical argument was actually about the failure of global simultaneity in rotating frames, not about time travel at all? Or that even in his metric the CTCs require physically unrealistic conditions so they can't settle philosophy? I want to know if there's any legitimate bridge or if he kept them in seperate boxes. Bottom line up front, then the reasoning — max 180 words, keep it to one paragraph if you can.
