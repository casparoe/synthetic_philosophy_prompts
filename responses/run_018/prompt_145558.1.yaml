  I'll make sure my reasoning is balanced, acknowledging the democratic legitimacy concern while explaining why the reserve power's protective function is more valuable. The tone should be authoritative yet accessible, with clear headings and no legal jargon. Since parliamentarians need to vote soon, I'll keep the memo focused and actionable without unnecessary citations or bibliographies.
answer: |-
  ## MEMORANDUM  
  TO: Joint Parliamentary Committee on the Constitutional Status of the Crown  
  FROM: Senior Counsel  
  SUBJECT: Recommendation on Proposed Statutory "Duty to Assent"  
  DATE: 26 October 2023  

  **Recommendation:** The Committee should **reject** the proposed statutory "duty to assent" and **recommend preserving the current system** of unwritten conventions governing the reserve power of royal assent. While codifying automatic assent offers clarity, the potential loss of an essential, albeit dormant, constitutional safeguard against extreme parliamentary overreach outweighs the benefits. The current ambiguity, underpinned by strong conventions of non-intervention absent a constitutional crisis, provides vital flexibility and security without undermining normal democratic functioning.  

  ### 1. Comparison of Models: Scandinavian Ceremony vs. UK Convention
  *   **Scandinavian Model (e.g., Sweden, Norway):** Here, the monarch's role is strictly ceremonial and defined explicitly in written constitutions. Refusal of assent is constitutionally impossible. The monarch signs all bills passed by parliament as a formality. This model offers **maximum clarity and predictability**, entirely removing any political role for the monarch. However, it also **eliminates any conceivable check**, however remote, on parliamentary action, even actions undermining the constitution itself.
  *   **UK Model (Current System):** Our system relies on powerful unwritten conventions. While the monarch technically retains the *legal power* to refuse assent, **convention dictates it is only exercised** on the binding advice of ministers or, in theory, *only* in the most extreme circumstances (e.g., a government refusing to resign after losing an election, or a parliament attempting to abolish democracy itself). This power is "dormant" in normal times. The **strength lies in its flexibility** – it acts as an emergency brake, theoretically available if the democratic machinery catastrophically fails. The **weakness is ambiguity** – the precise trigger for its use is undefined, relying on precedent, principle, and judgment, which could lead to controversy if ever invoked.  

  **Key Difference:** Scandinavia provides certainty by extinguishing the power; the UK provides security by retaining it as a theoretical, convention-bound emergency tool, traded for some residual ambiguity.  

  ### 2. Assessment of Japan's Post-War Model
  Japan's Constitution (1947) explicitly designates the Emperor as "the symbol of the State and of the unity of the People" (Article 1) and states that the Emperor "shall not have powers related to government" (Article 4). All acts related to state affairs require the advice and approval of the Cabinet (Article 3). Assent is a mandated, purely ceremonial act.  

  *   **As an Intermediate Template?** Japan's model is **functionally equivalent to the Scandinavian model**, not an intermediate step. It achieves the same result: complete elimination of any discretionary role for the monarch through explicit constitutional codification. While the symbolic language is powerful, it does *not* preserve a theoretical reserve power. It offers the same **clarity and predictability** as Scandinavia but also the same **complete removal of any potential check** based on the monarch's constitutional role. It does not resolve the core tension between clarity and retaining an emergency safeguard inherent in our choice.  

  ### 3. The Counter-Majoritarian Dilemma: Check vs. Legitimacy
  This is the heart of the matter:  
  *   **Automatic Assent (Proposed Law):**  
      *   **Pro:** Enhances democratic legitimacy by removing any formal role for an unelected figure. Streamlines the legislative process and eliminates theoretical ambiguity.  
      *   **Con:** **Removes the last non-parliamentary institutional brake.** In a pure majoritarian system, a government with a strong majority could, in theory, pass legislation fundamentally undermining the constitution (e.g., abolishing courts, extending terms indefinitely, suspending elections) if it maintains parliamentary control. While courts may provide some check, their scope is often limited in fundamental constitutional matters within our tradition. The reserve power, however unused, acts as a final symbolic and practical deterrent against such catastrophic overreach. Its removal weakens the constitution's resilience.  
  *   **Preserving Ambiguity (Current System):**  
      *   **Pro:** **Retains a crucial, if remote, constitutional safeguard.** The mere theoretical existence of the reserve power, governed by the strong convention that it is only for emergencies, provides a vital layer of protection against a parliament destroying democracy itself. It reinforces the principle that sovereignty ultimately resides in the constitutional order, not solely in the transient parliamentary majority.  
      *   **Con:** **The strongest argument against:** Its existence, even unused, **can be seen as fundamentally undermining democratic legitimacy.** In a modern democracy, ultimate authority should rest with the elected representatives of the people or the people themselves via referenda. An unelected hereditary figure retaining *any* theoretical power to override parliament, no matter how constrained by convention, is an anachronism that conflicts with the principle of popular sovereignty. It creates a potential, however unlikely, for an undemocratic actor to intervene in the people's business. Relying on unwritten conventions carries inherent risk of dispute if the power were ever contemplated.  

  **Honest Treatment of the Strongest Counter-Argument (Against Preserving Ambiguity):**  
  The most powerful argument *for* codifying automatic assent is indeed the **democratic legitimacy deficit** inherent in the reserve power. It *is* an anomaly. Its existence, even dormant, implies that popular sovereignty expressed through parliament is not absolute and can be overridden by birthright. This is philosophically jarring in the 21st century. Proponents rightly argue that true democratic maturity requires fully vesting constitutional authority in elected bodies or the people, with safeguards like robust judicial review or explicit supermajority requirements for constitutional change, not reliance on a monarch's discretion. Conventions, however strong, are not law and could, in a true crisis, be contested or ignored, potentially leading to greater instability than clear codification.  

  ### Why Preservation is Recommended Despite This
  While the democratic legitimacy concern is serious and valid, the **practical risk of majoritarian tyranny outweighs the theoretical legitimacy deficit.** Our uncodified constitution relies heavily on conventions, precedents, and checks and balances. The reserve power is the ultimate backstop within this system. Its removal would leave a gap.  

  *   **The Power is Truly Dormant:** The conventions surrounding non-use are exceptionally strong and well-understood. No monarch has refused assent in the UK against ministerial advice in centuries. Its existence has not hampered normal democratic function.
  *   **Effectiveness of the Deterrent:** The very existence of the power, and the profound constitutional crisis its use would trigger, acts as a powerful deterrent against a government attempting actions that would make its use conceivable.
  *   **No Superior Alternative Check:** Within our Westminster system, judicial review of primary legislation is limited. Codifying other brakes (e.g., supermajorities) for core constitutional matters would be complex and is not the subject of this proposal. The reserve power remains a uniquely placed, if blunt, instrument.
  *   **Flexibility in Crisis:** Unwritten conventions allow for nuanced application in genuinely unforeseeable emergencies, whereas codified automatic assent offers no such flexibility if a government acts unconstitutionally to destroy the mechanisms of accountability.

  **Conclusion:** The proposed "duty to assent" statute solves a problem that hasn't materialized (undue royal interference) while creating a potential vulnerability (no ultimate brake on parliamentary autocracy). The current system, despite its theoretical anomaly and ambiguity, provides a vital, if hidden, layer of constitutional resilience. The conventions governing the reserve power are robust and have proven effective in preserving both democracy and stability. The strongest counter-argument regarding democratic legitimacy is acknowledged but is outweighed by the practical necessity of retaining an emergency safeguard within our uncodified constitutional framework. The Committee should recommend preserving the status quo.
