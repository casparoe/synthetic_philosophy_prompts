answer: |-
  Here's a thought experiment draft for your seminar:

  **The Scenario:** Maya is a manager at a midsized design firm. She needs to promote someone to lead a crucial new project team. **Candidate A (Avery)** is a brilliant, highly efficient external hire with cutting-edge skills directly matching the project's tech stack. Avery aced the formal interviews and references. **Candidate B (Ben)** is a long-time internal team member, solid but not spectacular. Ben's skills are slightly less cutting-edge, but crucially, during a brutal crunch period two years ago when Maya's team was drowning and key staff quit, Ben voluntarily worked massive unpaid overtime for months, personally mentored two struggling junior hires (who are now core team members), and even took a temporary lateral move to fill a critical gap, delaying his own skill development. Ben didn't have a contractual obligation to do any of this; it was driven by loyalty and seeing the team/Maya struggle. Promoting Avery seems like the obvious, meritocratic choice based purely on current skills and formal role requirements. Promoting Ben feels like rewarding past loyalty over present merit.

  **The Reasonings:**

  1.  **Liberal Individualist Verdict (Promote Avery):** Maya's primary obligation is to the firm and the specific needs of *this project*, defined by the job description and the contract she operates under. Avery demonstrably best fulfills these explicit, consent-based requirements *right now*. Ben's past actions, while commendable, were *voluntary* choices on his part; Maya didn't formally contract for that level of sacrifice. Rewarding Ben based on past favors not stipulated in his role risks unfairness to Avery (who meets the current standard) and inefficiency for the project. Obligations are created by explicit agreements or direct harm/benefit within the defined role boundaries. Ben's past actions fall outside Maya's *current* managerial obligations to the project and firm. Fairness demands picking the best current fit.

  2.  **Confucian Relational Verdict (Promote Ben):** Maya isn't just a neutral "role-filler"; her identity as manager is *constituted* by the specific web of historical relationships and reciprocal obligations within her team. Ben's actions during the crisis weren't just "favors"; they were profound expressions of *ren* (humane responsibility) within his role as a senior team member towards Maya (as leader), the juniors (as potential mentors), and the team as a whole. This created a deep, non-contractual debt of reciprocity (*bao*). Promoting solely on narrow, current technical merit ignores this **interstitial obligation** – the obligation existing *between* the formal lines of job descriptions, born from shared history and mutual upholding of roles during vulnerability. Failing to acknowledge this debt by promoting Avery, the outsider without this relational history, fractures the very relational fabric that defines Maya's authority and the team's cohesion. It signals that profound role-based sacrifices are forgotten once the immediate crisis passes, undermining future willingness for such essential, non-contractual interdependence.

  **The Structural Feature Forcing the Split: Non-Contractual Temporal Reciprocity.** This is the obligation generated by past actions of support/sacrifice within a role-relationship, absent any formal agreement, that creates a moral claim *forward in time* within that relationship web. The individualist sees time-bound, consent-based transactions; the Confucian sees enduring reciprocal bonds constitutive of the self-in-role.

  **What Collapses if You Remove It?** Remove the binding force of non-contractual temporal reciprocity, and the relational web becomes purely transactional and present-focused. Team members become interchangeable units. Deep loyalty, mentorship beyond the minimum, and sacrificing for the collective good during hard times become irrational, as there's no expectation of future recognition *within the role structure*. Trust erodes, cooperation becomes purely self-interested and contractual, and the manager's role shrinks to enforcing rules, not cultivating a shared ethical community.

  **The Sharp Individualist Attack (Beyond "Collectivism Bad"):** "The relational view smuggles in dangerous subjectivity and moral hazard under the guise of 'bonds'. It forces Maya to prioritize an unquantifiable, emotionally-charged *debt* to Ben over her clear, objective duty to deliver the best project outcome for the firm and its stakeholders (including other employees). This obligation is illusory – Ben *chose* his actions without negotiated expectation of future promotion. Rewarding him now isn't ethics; it's *favoritism* based on past sentiment, undermining true meritocracy and potentially demoralizing high-performers like Avery who play by the explicit rules. It binds the present unfairly to the past and risks promoting based on loyalty over competence. The 'interstitial obligation' is just a fancy term for blurring professional boundaries with personal debt, which is corrosive to fair institutions."

  **Why it Works:** It feels real (workplace promotion), the "fair" choice (Avery) is genuinely strong, Ben's contribution is significant but not heroic in a sci-fi way, and the hidden obligation (reciprocity for past, non-contractual role-based sacrifice) is the exact wedge. The individualist critique focuses on fairness, objectivity, and the dangers of non-transparent obligations – a substantive argument, not just dismissal.
