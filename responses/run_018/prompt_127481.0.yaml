prompt: |-
  So I've been teaching this unit on practical rationality and my students keep bringing up these mugging-style cases, and I realized I don't actually have a consistent line on them. Here are my gut verdicts, tell me if there's a principle that saves them all or if I'm just being a hypocrite.

  Case one: some rando on the subway claims he can destroy 3^^^3 people in Andromeda unless I hand over $5, and I genuinely think there's a 1-in-10^20 shot he's not bluffing about his causal powers. Verdict: I'm not paying, and it feels like correct rationality, not just cheapness. Case two: same guy, but he has a device that will definately blow up Earth with 99.999% reliability, and for $5 he'll disable it. Verdict: I pay, no question. Case three: climate scientists say reducing my footprint has maybe a 0.1% chance of preventing a cascade that kills billions; I treat this as a real but modest reason, not a life-ruining obligation. Case four: I'm offered a coin-flip bet where heads wins me $100, but there's allegedly a 10^-40 chance that tails triggers a hidden mechanism torturing a million people. I take the bet and feel good about it, which seems to conflict with case one unless I'm missing something about the structure. Case five: I'm advising on an AI safety budget and there's a proposed safeguard against a failure mode I assign 1-in-10^12 credence, existential if it hits. Spending 1% of compute feels prudent, spending 10% feels like paranoia, but I can't articulate where the line comes from.

  And the one I keep going back and forth on: should I buy lottery tickets that fund x-risk research? The ticket is near-certain waste, but the funding creates a miniscule chance of saving everything. Is there one account of how credence, stakes, and institutional context interact that gets cases one through five, and what does it predict for the lottery thing? Or do I have to drop one of my verdicts?
reasoning: |-
  Okay, let me start by unpacking the user's problem. They're teaching practical rationality and struggling with mugging-style cases. Their students keep bringing these up, and they don't have a consistent framework. The user provided five cases plus a lottery ticket scenario, each with their gut verdicts, and they want to know if there's a unifying principle or if their judgments are hypocritical.

  First, I need to understand each case. Case one: a random guy on the subway threatens to destroy 3^^^3 people unless paid $5, with a 1-in-10^20 chance he's serious. The user doesn't pay, feeling it's rational. Case two: same guy, but a device with 99.999% reliability to destroy Earth; paying $5 disables it. Here, they pay without question. Case three: climate action with a 0.1% chance of saving billions is a modest reason, not life-ruining. Case four: a coin-flip bet where tails has a tiny chance (10^-40) of torturing a million people. They take the bet, which conflicts with case one. Case five: AI safety budget for a 1-in-10^12 risk; 1% spend is prudent, 10% is paranoid. Then the lottery funding x-risk research: should they buy tickets where the ticket cost is wasted but funds research that might save everything?

  The user's core issue is inconsistency in handling low-probability, high-stakes scenarios. They need a principle that explains all verdicts or must drop one. Let me recall decision theories. Expected Utility Maximization (EUM) seems the starting point. But in case one, EUM would suggest paying $5 since the expected utility of saving 3^^^3 lives at 10^-20 chance is astronomical. But the user refuses, which aligns with critiques like Pascal's Mugging. So EUM alone fails here.

  Next, consider probability discounting. Maybe probabilities below a threshold are ignored. But in case two, even 0.001% chance of Earth's destruction warrants paying $5, which is a tiny probability but handled differently. The threshold approach is inconsistent because 10^-20 is ignored, but 0.001% (10^-5) isn't. So that doesn't work.

  Robustness checks like Bostrom's approach: require the probability estimate to be robust. In case one, the 10^-20 estimate is flimsy (rando on subway), so dismissed. Case two's 0.001% is more credible (device with known reliability), so taken seriously. Case three's climate chance (0.1%) is based on science, so credible but modest. Case four's 10^-40 is implausible (alleged mechanism), so ignored. Case five: AI risk at 10^-12 from expert assessment is credible, so spend 1% but not 10%. The lottery ticket: if the funding's effectiveness is robust, maybe worth it, but if speculative, not. This seems promising.

  But what about institutional context? In case five, spending 10% on AI safety might be paranoid because resources could be better allocated elsewhere. Opportunity costs matter. Also, in the lottery case, buying tickets might not be efficient; direct donations could be better. So institutional efficiency and opportunity costs play roles.

  The user's verdicts suggest that credibility of threat and effectiveness of action are key. In case one, both the threat and the effectiveness of paying $5 are dubious. Case two, the threat is credible, and $5 definitely disables it. Case three, climate action's effectiveness is uncertain. Case four, the hidden mechanism isn't credible. Case five, the risk is credible, but spending too much has high opportunity costs.

  For the lottery ticket: if the research funded is effective and the probability is robust, it might be worth it. But if it's speculative, then no. Plus, buying lottery tickets is inefficient due to overhead; direct donations are better. So the user might buy if the funding mechanism is efficient, but otherwise not.

  So the unifying framework involves: credibility of probabilities, effectiveness of intervention, and opportunity costs. Robustness of estimates explains the difference between cases one and two. Case three's modest weight comes from moderate probability and effectiveness uncertainty. Case four's dismissal due to implausibility. Case five's budget line considers both credible risk and resource allocation.

  The user isn't hypocritical; their intuitions map to established decision-theoretic adjustments. They just need to formalize the principles: robustness, expected value, and opportunity costs. For teaching, they can present EUM and its refinements, showing how real-world factors adjust pure calculations.
answer: |-
  Your intuitions are remarkably consistent! They point toward a **robustness-adjusted expected utility framework** that incorporates **epistemic credibility**, **action effectiveness**, and **opportunity cost**. This isn't hypocrisy; it's recognizing that naive expected utility maximization (EUM) fails in extreme low-probability/high-stakes scenarios (Pascal's Mugging). Here's how your verdicts hold up under a refined model:

  **Core Principle:** Expected Utility (EU) matters, but **the reliability of the probability/impact estimates** acts as a discounting factor. We should also **bound the "maximally plausible disutility"** we assign to speculative threats and weigh actions against **opportunity costs/institutional context**.

  ### Breaking Down Your Cases
  1.  **Subway Mugger (3^^^3 lives, p = 10⁻²⁰):** You *don't pay*.
      *   **Why:** The probability estimate `p = 10⁻²⁰` is *epistemically flimsy*. It's based on a random stranger's claim with no evidence of causal power over Andromeda. Assigning non-zero probability to *any* arbitrary threat leads to absurdity (Pascal's Mugging). **Robustness Adjustment:** Dismiss or cap the disutility estimate when the mechanism is this implausible. The EU calculation `(10⁻²⁰ * -3^^^3) + (1 - 10⁻²⁰) * -$5 ≈ -$5` is dominated by the certainty of losing $5 because the massive disutility isn't credible.

  2.  **Earth Destroyer (99.999% reliable, $5 disables):** You *pay*.
      *   **Why:** The threat mechanism is *highly credible* (a visible device, high reliability claim). The probability of disaster if you don't pay (`p = 0.99999`) is robustly estimated. The EU `(0.99999 * -∞) + (0.00001 * -$5) ≈ -∞` overwhelmingly favors paying $5. **Robustness Adjustment:** The probability and disutility estimates are robust enough to act upon decisively, even with a tiny chance of being scammed.

  3.  **Climate Footprint (p ≈ 0.001 of saving billions):** You treat it as a *modest reason*.
      *   **Why:** The probability `p ≈ 0.001` and impact (saving billions) have *moderate epistemic credibility* (scientific consensus on risk, uncertainty on individual causal efficacy). The EU `(0.001 * +Huge_Value) + (0.999 * -Small_Cost)` is positive but not overwhelming due to the low `p` and the small individual impact of your action. **Opportunity Cost:** Ruining your life (e.g., extreme asceticism) has high disutility; moderate changes have low cost. The *expected value per cost* is positive but modest.

  4.  **Coin-Flip Bet ($100 vs. p = 10⁻⁴⁰ torture risk):** You *take the bet*.
      *   **Why:** Similar to Case 1. The alleged "hidden torture mechanism" is *maximally implausible*. There's no credible evidence or causal pathway. **Robustness Adjustment:** The infinitesimal probability `p = 10⁻⁴⁰` is effectively rounded to zero for decision purposes. The credible EU is simply `(0.5 * $100) + (0.5 * $0) = $50 > $0`.

  5.  **AI Safety Budget (p = 10⁻¹² x-risk, Spend 1% vs. 10%):** *1% prudent, 10% paranoid*.
      *   **Why:** The *probability* `p = 10⁻¹²` might have *some credibility* (expert assessment of a specific failure mode). The *disutility* (extinction) is certain *if* it happens. However:
          *   **Effectiveness Uncertainty:** Does spending $X actually reduce `p` proportionally? Diminishing returns and unknown efficacy kick in quickly.
          *   **Opportunity Cost:** Spending 1% compute on *this specific* safeguard leaves 99% for other crucial safety work, core functions, or safeguards against *more likely* risks. Spending 10% means starving other vital areas for an extremely speculative gain. The *marginal expected utility per dollar* plummets after a certain investment level for ultra-low-probability risks, even with infinite disutility. 1% feels prudent hedging; 10% ignores better uses of resources.

  ### The Unifying Framework: RAD-EU (Robustness-Adjusted Discounted Expected Utility)
  1.  **Calculate Naive EU:** `EU = Σ [p_i * U_i]`
  2.  **Assess Robustness (R):** Assign a credibility factor `R` (0 ≤ R ≤ 1) to the probability-impact chain.
      *   Based on: Evidence quality, causal plausibility, consensus, track record of similar claims.
      *   *Examples:* R(Subway Mugger) ≈ 0; R(Earth Destroyer) ≈ 0.99999; R(Climate Science) ≈ 0.7; R(Coin-Torture) ≈ 0; R(AI Failure Mode) ≈ 0.01 (highly speculative) to 0.5 (well-defined, plausible mechanism).
  3.  **Apply Robustness Discount:** `Discounted EU ≈ R * [p * U] + (1 - R) * U_Default`. (Where `U_Default` is the EU of ignoring the threat/opportunity).
      *   *Effectively:* `R` caps the maximum plausible disutility/utility we assign to the speculative outcome. If `R` is very low, the discounted EU collapses to near `U_Default`.
  4.  **Consider Effectiveness & Opportunity Cost:** For actions:
      *   Factor in the probability the *action itself works* to mitigate/enable the outcome.
      *   Compare the Discounted EU of *this action* to the EU of the *next best alternative use* of the resources (time, money, compute). Avoid massive spending on R-discounted threats when better options exist (Case 5, Lottery).

  ### The Lottery Ticket for X-Risk Research
  *   **Naive EU:** `EU = (p_win * U_win) + (p_lose * U_lose)`. `p_win` is tiny (lottery odds), `U_win` is small prize. `p_lose ≈ 1`, `U_lose = -Cost + Tiny_Utility_Funding`. The `Tiny_Utility_Funding = (p_funding_effective * Value_of_XRisk_Reduction)`.
  *   **Robustness Assessment (R):**
      *   `R_funding_effective`: How credible/effective is *this specific lottery-funded research* at actually reducing x-risk? (Often very low - funding mechanisms matter).
      *   `R_xrisk_reduction`: Credibility of the specific x-risk being mitigated and the magnitude.
  *   **Discounted EU:** The term `(p_funding_effective * Value_of_XRisk_Reduction)` gets heavily discounted by `R = R_funding_effective * R_xrisk_reduction`.
  *   **Opportunity Cost:** The *cost* is the ticket price. The *next best alternative* is **donating that money directly to the x-risk research charity.**
      *   Direct donation avoids the massive overhead of the lottery (often 50%+ of ticket price goes to prizes/profit, not charity). It also avoids the near-certainty of getting nothing back personally.
      *   **Verdict (Using RAD-EU & Opp Cost):** **Do NOT buy the lottery ticket.** The expected utility of buying the ticket `(Discounted EU_funding - Cost)` is almost certainly **lower** than the expected utility of directly donating the same amount `(Discounted EU_funding)`, because direct donation sends more money to the cause. Buying the ticket is a dominated strategy if your goal is funding x-risk research. Your gut "near-certain waste" feeling is correct *because of the inefficient mechanism*. Donate directly instead.

  ### Conclusion
  You are **not a hypocrite.** Your intuitions align with sophisticated critiques of naive EUM:
  1.  **Epistemic Robustness Matters:** Dismiss or heavily discount probabilities/impacts arising from utterly implausible mechanisms (Cases 1 & 4).
  2.  **Act Decisively on Robust Threats:** When probabilities and impacts are credible, act even with small costs (Case 2).
  3.  **Moderate Action for Moderate Credibility/Risk:** Act proportionally when evidence is decent but not overwhelming, considering personal stakes (Case 3).
  4.  **Beware Opportunity Cost & Diminishing Returns:** Especially for large investments in speculative safeguards, consider what else you could achieve and whether the marginal dollar is well-spent (Case 5, Lottery).

  You can confidently teach that practical rationality requires more than just multiplying `p * U`; it demands critical assessment of *how reliable those `p` and `U` estimates truly are* and *what else we could be doing with our resources*. Your verdicts are a feature, not a bug!
