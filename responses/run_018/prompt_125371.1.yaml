answer: |-
  Here’s a refined research proposal structured to meet your goals, with key enhancements to clarify the stakes, methodology, and contribution:

  ---

  ### **Research Proposal: Decomposing the Moral Claims of Compatriot Priority**  
  **Question:** Can obligations to compatriots be split into *diachronic reciprocity* (historical institutional cooperation) and *synchronic solidarity* (present shared vulnerability)? Does this distinction yield a defensible limited priority for compatriots, or collapse under scrutiny?  

  ---

  ### **Core Problem**  
  Existing debates treat "compatriot partiality" as monolithic:  
  - **Nationalists** invoke shared identity/history but conflate inherited institutions with cultural solidarity.  
  - **Cosmopolitans** reject borders as arbitrary but rarely engage obligations from *inherited cooperative schemes*.  
  **Result:** A stalemate where neither side addresses whether **intergenerational reciprocity** generates obligations distinct from universal duties or tribalist bias.  

  ---

  ### **Original Contribution**  
  Your decomposition challenges both sides:  
  1. **Against nationalists:** Separates institutional reciprocity (e.g., inheriting public roads/social security) from cultural solidarity.  
  2. **Against cosmopolitans:** Tests whether reciprocity obligations can survive objections about non-voluntary membership.  

  ---

  ### **Methodology: Three Phases**  
  #### **Phase 1: Conceptual Distillation**  
  - **Define diachronic reciprocity:**  
    - Grounded in *benefiting from inherited institutions* (e.g., infrastructure, legal systems).  
    - Conditions: Non-exploitative continuity, demonstrable intergenerational investment.  
  - **Define synchronic solidarity:**  
    - Rooted in *shared systemic risks* (e.g., pandemics, economic shocks).  
    - Conditions: Mutual vulnerability within a coordinated system.  
  - **Tools:** Social contract theory (Rawlsian fairness for reciprocity), theories of collective action (for solidarity).  

  #### **Phase 2: Stress-Testing Diachronic Reciprocity**  
  Test against cosmopolitan objections:  
  1. **Moral arbitrariness of birth:** Does benefiting from non-chosen institutions bind reciprocally?  
     - *Counter:* Do obligations arise from *accepting benefits* (Simmons-style)?  
  2. **Non-voluntary membership:** Can obligation exist without consent?  
     - *Counter:* Do quasi-contractual duties apply to cooperative schemes (Hart/Rawls)?  
  3. **Inherited advantage/injustice:** Does reciprocity perpetuate historical wrongs?  
     - *Counter:* Can obligations be conditional on *rectifying* unjust advantages?  

  #### **Phase 3: Synchronic Solidarity’s Scope**  
  - **Critical test:** Does universalizing shared vulnerability dissolve borders?  
    - *If solidarity is contingent on *enforced interdependence* (e.g., national economies), locality may hold.  
    - *If all humans share identical vulnerabilities*, it collapses into cosmopolitanism.  
  - **Key:** Does *institutional mediation* (e.g., state capacity to mitigate risk) make solidarity locally bounded?  

  ---

  ### **Success Criteria**  
  A "win" requires:  
  1. **Conceptual coherence:** Reciprocity ≠ solidarity (e.g., reciprocity can exist without affective bonds).  
  2. **Normative distinction:** Reciprocity demands *restitution for benefits received*; solidarity urges *risk-pooling*.  
  3. **Practical differentiation:** E.g., Reciprocity might prioritize pensioners who contributed; solidarity prioritizes pandemic victims.  

  **Failure modes:**  
  - Reciprocity presupposes solidarity (e.g., institutions require shared identity).  
  - Both reduce to universal harm-prevention.  

  ---

  ### **Why This Works**  
  - **Scope:** Focused on conceptual rigor, not empirical/historical analysis.  
  - **Deliverable:** A 35–40-page essay resolving whether the decomposition:  
    - **(A)** Defends a *thin* compatriot priority (rooted in reciprocity alone), or  
    - **(B)** Shows all obligations reduce to solidarity/arbitrariness.  
  - **Impact:** Reframes the debate by decoupling "inherited cooperation" from "tribalism," forcing cosmopolitans to engage institutional reciprocity.  

  ---

  ### **Timeline**  
  - **Month 1:** Phase 1 (Conceptual groundwork)  
  - **Month 2:** Phase 2 (Reciprocity vs. cosmopolitan objections)  
  - **Month 3:** Phase 3 (Solidarity’s scope and collapse test)  
  - **Month 4:** Synthesis and writing  

  ---

  This project promises a novel path through an exhausted debate. Whether the distinction holds or collapses, you’ll deliver a conclusive intervention that challenges both nationalist and cosmopolitan assumptions.
