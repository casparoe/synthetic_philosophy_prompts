  The user’s deeper needs include efficiency, fairness, and minimizing controversy. They might also want to avoid backlash by ensuring decisions are seen as ethical and transparent. The procedure must be accessible, using only documents in the folder. Emphasizing the gap between honoring and merely marking existence addresses ethical grounding without citing philosophers. 

  For each case, I’ll follow the steps. Case A: Strike violence is severe harm, so it likely fails at Step 2. However, Step 3 might show indexical drift if the street name now represents the neighborhood. But since the harm is severe, removal might be necessary, incurring mnemonic debt. The board must decide if existing records suffice. Case B: The museum exhibit might cover mnemonic debt, but Step 6 questions if the statue still honors the scientist. If so, removal might be needed unless the plaque redirects meaning. Case C: Renaming after a living person risks future reputation changes. Step 4’s predictive element is uncertain, leading to a values-based decision to wait until they’re deceased. 

  Flagging gut decision points is crucial. In Step 2, assessing harm severity is subjective. Step 3’s indexical drift requires local knowledge. Step 5’s counterbalance adequacy is also a judgment call. The user needs to know where personal judgment is unavoidable. 

  Overall, ensuring the procedure is concise, uses plain language, and addresses both ethics and practicality. Highlighting the forced outcome in one case, like Case B where the statue might stay due to existing countermeasures, even if the user dislikes it, demonstrates the procedure’s rigidity. This builds trust in the process.
answer: |-
  Here’s a practical, ethics-grounded procedure for your folder, designed for 90-minute meetings with minimal prep:

  **"Quick-Response Commemoration Review" Procedure**  
  *Ground rule: We don’t decide what’s "moral." We decide if the marker still fits the city’s duty to ethically hold history.*

  ### **The Steps**
  1. **DID THEY FILL OUT THE FORM?**  
     *(Stops cold if no)*  
     → Request must include: Who’s requesting (group/individual), specific ask (remove/rename), stated reason, any evidence provided. *Enough:* Complete form = proceed. Incomplete = reject.

  2. **HARM TEST: Does the marker *honor* harmful acts/values?**  
     *(Focus: Active celebration vs. passive record)*  
     → Ignore "they were flawed." Focus: Does the *primary reason* for the commemoration (street name, statue pose, plaque text) actively glorify oppression, violence, or bigotry?  
     *Enough:* Clear evidence the marker *celebrates* harm (e.g., statue titled "Champion of Racial Purity," street named after a lynching site) → **Proceed to Removal/Rename**.  
     If harm is incidental/not celebrated → **Proceed to Step 3**.  
     *Gut Flag:* Severity of harm vs. historical context is ambiguous? Board debates briefly → Majority vote moves to Step 3 or Step 4.

  3. **INDEXICAL DRIFT CHECK: Does the name mean "the place" now?**  
     *(Does it point to the neighborhood, not the person?)*  
     → Look for: How long has it been named? Do local businesses use it in their name/identity ("Lives on Elmwood Ave")? Do residents *primarily* associate it with location, not history?  
     *Enough:* Strong evidence of drift (e.g., 100+ years old, "Meet at the Calhoun Fountain" means the park spot, not the man) → **Recommend KEEPING, but add context if possible (Step 5)**.  
     No drift (name still tied directly to the person) → **Proceed to Step 4**.

  4. **COMMEMORATION GAP: Is this *honoring* or just *marking*?**  
     *(Key Ethics Question)*  
     → Debate: Does keeping it *as-is* feel like the city endorsing their legacy? Would removal feel like erasing history, or stopping an ongoing endorsement?  
     *Enough:* Board majority agrees it’s purely "marking" history neutrally → **KEEP, but strongly suggest adding context (Step 5)**.  
     Majority feels it’s actively "honoring" problematic aspects → **Proceed to Removal/Rename, but trigger MNEMONIC DEBT (Step 6)**.  
     *Gut Flag:* Entirely values-based. Vote after 10 min debate.

  5. **ADD CONTEXT FEASIBLE?**  
     *(Cheapest fix: Can we reframe it?)*  
     → Can we install a clear, accessible plaque/QR code *at the site* that explains the full picture (good & bad) using the requester’s evidence or city archives? Cost under $500?  
     *Enough:* Yes, and context directly addresses the harm → **AMEND, don’t remove. Stops here.**  
     No (too expensive, site constraints, context doesn’t fix active honoring) → **Proceed to Step 6 (if removing) or STOP (if keeping)**.

  6. **MNEMONIC DEBT SETTLEMENT: If removing, is the record preserved *robustly* elsewhere?**  
     *(Obligation: Don’t erase history, relocate the record)*  
     → Check: Is the figure/event **well-documented** in the city museum, archive, or school curriculum? Is it **accessible**? Does it **cover the bad *and* why they were commemorated**?  
     *Enough:* YES → **Approve Removal/Rename.**  
     NO → **Reject Removal *unless* requester/city commits funds to create this record (e.g., archive exhibit) within 1 year.**  
     *Gut Flag:* Defining "robustly preserved" is subjective. Vote if contested.

  ---

  ### **Applied to Your Cases**

  **Case A: Rename Street (Factory Owner: Housing Builder / Strike Breaker)**  
  1. *Form filled?* Assume YES.  
  2. *Harm Test:* Violently breaking strikes = Harm. Does the street *honor* this? Unlikely (it’s just a name). → **Proceed to Step 3.**  
  3. *Indexical Drift?* Street is 80 years old. "North Carson Ave" is a neighborhood identity (Carson Ave Bakery, Carson Ave Block Party). → **Recommend KEEPING. Go to Step 5.**  
  5. *Add Context?* Install small plaque at street sign: "*Named for John Carson (1860-1930). Built worker housing & violently suppressed 1911 strike.*" Cheap, doable. → **AMEND WITH PLAQUE. STOPS. KEEP NAME.**  
  *(You might dislike keeping the name, but drift + context fix satisfies the ethics.)*

  **Case B: Remove Statue (Scientist w/ Eugenics Writings)**  
  1. *Form filled?* YES.  
  2. *Harm Test:* Eugenics writings = Severe Harm. Statue pose (on pedestal, thoughtful gaze) = Active *honoring* of the person, not just marking. → **Proceed to Removal. Trigger MNEMONIC DEBT (Step 6).**  
  6. *Mnemonic Debt:* Museum exhibit covers "the bad part in detail" and explains his scientific work → **Likely ENOUGH preservation.** → **APPROVE REMOVAL.**  
  *(Procedure forces removal because the statue *honors*, the museum covers the debt. The plaque on the statue itself isn't context enough if it feels celebratory.)*

  **Case C: Rename Park After Living Activist**  
  1. *Form filled?* YES.  
  2. *Harm Test?* (Assuming activist isn’t harmful). → Not applicable. **Proceed to Step 4.**  
  4. *Commemoration Gap:* Renaming *now* = Active **honoring**. But honoring a *living* person is ethically risky (unforeseen controversies, legacy unsealed). Our duty is to history, not current politics. → **Majority likely feels this "honors" prematurely.** → **Proceed to Removal/Rename, but trigger MNEMONIC DEBT (Step 6).**  
  6. *Mnemonic Debt?* The *old* park name must be preserved. If it was "Smith Park" (boring developer), debt is low (archive record exists). → **APPROVE RENAME, but require donor-funded plaque about old name at park entrance.**  
  *GUT FLAG BREAK:* **Step 4 is the killer.** Charter allows it, but ethics of commemoration suggest waiting until death + perspective. Board might vote 3-2 based on personal views of the activist. *Procedure forces you to confront if renaming parks for living people aligns with commemorative ethics (likely not).*

  ### **Where the Guts Take Over**
  1. **Step 2 (Harm Test):** "Is this *celebration* or just *history*?" (e.g., Confederate General vs. complex Founder).
  2. **Step 4 (Commemoration Gap):** "Does keeping this *feel* like an endorsement today?" (Pure values).
  3. **Step 6 (Mnemonic Debt):** "Is the existing record *good enough*?" (e.g., a footnote in a book vs. a dedicated exhibit).
  4. **Living Persons:** No procedure can eliminate the risk of future scandal. Gut says: *Avoid*.

  **Keep in your folder & good luck!** Tweak the votes/time as needed.
