prompt: |-
  hey im writing an essay for my philosophy/english class and im kinda stuck. im in high school and we just finished The Island of Doctor Moreau (the h.g. wells one with the half-human half-animal creatures on the island). i want to read it through the "species problem" — like philosophers arguing whether a species is just a name we slap on similar animals or if theres some real essence inside.

  heres my twist: the beast folk follow this law about not walking on four legs and not eating meat, and it feels less like biology and more like a social contract they perform every day. so i want to ask if Wells is accidentally showing that species is performative — you become human by acting human — but then they all revert and fail. does that mean he thinks performance always loses to nature?

  can you write a reading that takes both the book and the philosophy seriously? i want you to point to actual scenes — like when they chant the rules together or when one gets killed for breaking it — and show where the species problem makes those scenes sharper. but also be honest about where the book pushes back: if species are just populations with fuzzy edges, why do the beast folk suffer so clearly from being in between? and dont just reduce the book to "its about racism" because everyone writes that.

  i need this to work for someone who cant search the web, so no citations or reading lists. also please dont quote long passages from the book from memory — just paraphrase.

  at the very end put your bottom line in this form:

  Verdict: [one sentence on whether the novel ultimately sides with essentialism or nominalism about species]
