answer: |-
  Here are 8 tightly focused interview questions weaving in follow-ups, designed to press the core argument while sounding natural in conversation. Confidence level: **85%** – the framing aligns well with Voss's thesis as described, but the *specificity* of Sidgwick's "withholding" mechanism feels like the most interpretive leap (flagged below).

  ---

  **Interview Questions for Dr. Marek Voss:**

  1.  **Core Mechanism:** "Your monograph argues Sidgwick's SPR work directly shaped the 'evidential architecture' of *Methods*. Let's get specific: **How exactly did his 'controlled credulity' protocol – demanding reproducible conditions, witness reliability, strict controls for telepathy – change his view of what constituted a sufficiently 'clear' ethical intuition?** Was it primarily about raising the bar for certainty, or did it alter the *kind* of evidence he trusted?"
      *   *(Follow-Up)* "If SPR heightened his sensitivity to error and bias in 'internal' reports like telepathic claims, why wouldn't that same sensitivity automatically apply – or demand similar controls – for the 'internal' deliverances of moral consciousness?"

  2.  **Asymmetry & Special Pleading:** "You frame Sidgwick as rigorously demanding SPR-grade evidence for paranormal claims but *withholding* that standard from fundamental ethical intuitions. **Doesn't this asymmetry inevitably make his ethical intuitionism look like special pleading?** Why was replicable peer consensus vital for telepathy but seemingly optional for, say, the self-evidence of prudence or justice?"
      *   *(Follow-Up)* "Could he justify this by claiming moral intuitions are simply a *different category* of datum? If so, on what grounds, given his SPR experience showed how easily internal subjective states can be misreported or misinterpreted?"

  3.  **"Empirical Open-Mindedness" Deflection:** "A likely counter is that Sidgwick was just being empirically open-minded with SPR, not skeptical of ethics. **But if he applied that *same* radical empirical open-mindedness – the willingness to doubt even seemingly clear internal data without external checks – consistently to ethics, wouldn't it logically push him towards skepticism about the very self-evidence of the fundamental axioms?** How does his framework avoid collapsing if that SPR-inspired rigor is universalized?"
      *   *(Follow-Up)* "Doesn't his famous 'Dualism of Practical Reason' – the unresolved conflict between egoism and utilitarianism – *already* demonstrate the kind of fundamental doubt that his SPR methods would amplify, rather than resolve?"

  4.  **Testing the Axioms:** "Let's apply the SPR evidential bar directly. **If Sidgwick subjected his three fundamental principles (prudence, justice, rational benevolence) to the same scrutiny he applied to telepathic reports – demanding reproducible verification across diverse observers, controls for bias, peer corroboration – do you believe any of them would survive as 'self-evident'?** If not, what does that imply about the status of those axioms?"

  5.  **Sidgwick's Self-Awareness:** "**Is there any concrete evidence – marginalia, letters, SPR meeting notes – that Sidgwick himself explicitly drew this parallel between his SPR methodology and his approach to ethical evidence?** Or is this an interpretive framework you're reconstructing based on the structural similarities and timing?"
      *   *(Follow-Up)* "If it's reconstructive, how do you guard against the charge of projecting a modern, post-positivist concern with methodology onto a 19th-century thinker who might not have seen these domains as requiring analogous evidential standards?"

  6.  **The "Controlled" in Credulity:** "You emphasize 'controlled credulity'. **Where precisely do you see Sidgwick attempting to impose *any* analogous 'controls' on the reception of moral intuitions within *Methods* itself?** Is it the absence of these controls that *is* the evidence of withholding, or is there a subtler form of methodological restraint at play in ethics?"

  7.  **Utility vs. Self-Evidence:** "Sidgwick ultimately leans towards utilitarianism despite finding it less intuitively clear than the axioms. **Did his SPR experience, particularly the difficulty of achieving consensus on 'strange' phenomena, make him more willing to accept utilitarianism's *practical utility* as a compensating factor, precisely *because* pure intuitional clarity felt unreliable by comparison?**"

  8.  **Consequence for Intuitionism:** "**If your thesis holds, does it suggest Sidgwick's foundational work for modern ethical intuitionism was inherently unstable – built on an unacknowledged double standard born from his psychical research?** Or did it, in a more complex way, reveal the *limits* of demanding SPR-like rigor in foundational philosophy?"

  ---

  **Confidence Breakdown:**

  *   **85% Overall Confidence:** The core premise (SPR methodology influencing Sidgwick's view of evidence, creating tension with ethical intuitionism) is strongly supported by Sidgwick's biography and the structure of *Methods*. The questions hit the key points Voss needs to address (mechanism, asymmetry, special pleading, consistency, consequences).
  *   **Point of Least Certainty (Flagged in Q5/Q6):** The *specific claim that Sidgwick "deliberately withheld"* his SPR standards from ethics. Was this a conscious methodological choice, an unconscious bias, or simply a reflection of him seeing the domains as fundamentally different? Proving "deliberate withholding" requires strong textual or archival evidence of Sidgwick *recognizing the parallel and choosing not to apply it in ethics*. This is the most interpretive leap in your framing. Q5 directly probes this, and Q6 presses on the *absence* of controls in ethics as evidence. Voss's answer here will be crucial.

  These questions stay deep in the methodological weeds, press the asymmetry, challenge likely deflections, test the axioms, probe for archival evidence, and explore the consequences – all while maintaining a natural, conversational flow for reading aloud. Good luck with the interview!
