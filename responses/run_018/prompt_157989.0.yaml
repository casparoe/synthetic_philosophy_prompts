  hey — i'm a journalist who covers science and ideas, and next tuesday i'm intervewing dr. marek voss for a long feature. he just published a monograph arguing that sidgwick's involvement with the society for psychical research wasn't just a biographical footnote but actually shaped the evidential architecture of The Methods of Ethics. specifically, voss claims sidgwick practiced a kind of 'controlled credulity' toward telepathic reports — demanding reproducible conditions, peer testimony, strict controls — that he deliberately withheld from moral intuition, and that this asymmetry explains why sidgwick was so hesitant about utilitarianism despite treating it as self-evident.

