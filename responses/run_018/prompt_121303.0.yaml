answer: |-
  **The impasse persists because it's fundamentally a category mistake: moral responsibility discourse conflates distinct metaphysical, normative, and practical inquiries that operate on irreconcilable principles.**

  Strawson’s Basic Argument demands a *metaphysical* condition for responsibility ("ultimate authorship") that is impossible to satisfy in a natural world. Compatibilists correctly note that this requirement is irrelevant to the *normative/practical* reality of holding agents accountable based on reasons-responsiveness and social context. The stagnation occurs because both sides talk past each other: Strawsonians insist that without *metaphysical* ultimacy, *desert* (understood as something "absolute") evaporates; compatibilists argue that *accountability practices* function perfectly well without it. They aren't debating the same concept—they are using "responsibility" to label fundamentally different phenomena.  

  Empirical psychology revealing authorship as graded and mechanistic exacerbates this by *validating both frameworks simultaneously*, without resolving the core clash:  
  - **For Strawson**: Empirical gradation confirms authorship is *never* "ultimate" in his metaphysical sense, so *desert* (as he defines it) remains impossible.  
  - **For Compatibilists**: Gradation shows authorship is *practically sufficient* when mechanisms support reasons-responsiveness, justifying accountability.  

  The disagreement is **not primarily about hidden facts or empirical agency**. Neuroscience illuminates *how* agency works, but cannot answer whether mechanistic causation voids desert—that’s a *normative/metaphysical valuation*. It’s also **not merely verbal**: Both sides agree on descriptions of choice mechanics but disagree on *which conditions license blame/praise*. The deadlock stems from **irreducible moral intuitions** about desert (Strawson’s "non-negotiable" demand for ultimacy) clashing with **pragmatic intuitions** about social regulation (compatibilism’s focus on consequences and fairness).  

  **Progress requires decoupling the inquiries**:  
  1. **Distinguish "desert" from "reactive attitudes"**: Acknowledge P.F. Strawson’s insight that reactive attitudes (resentment, gratitude) are psychologically ingrained social practices, but deny they inherently presuppose *metaphysical* desert. Their function is relational, not proof of ultimacy.  
  2. **Reject "desert" as requiring ultimate authorship**: Treat desert as a *normative construct* justified by its role in fair practices (e.g., only blaming agents who could recognize and act on reasons), not a metaphysical property.  
  3. **Accept incompatibility at the metaphysical level**: Concede that *if* "true desert" demands causa sui, it doesn’t exist—but argue this is irrelevant to ethics, which concerns how we *ought* to live together given our actual psychology.  
  4. **Reframe using empirical psychology**: Use gradations of control (e.g., in psychopathology) to refine *practical* responsibility criteria (e.g., degrees of blame proportional to cognitive impairment), abandoning the binary "responsible/not" metaphysical question.  

  **Concrete progress would look like**:  
  - A **compatibilist model** explicitly rejecting *any* appeal to "ultimate" origins, grounding desert solely in non-metaphysical criteria (e.g., "did the agent’s reasoning process meet contextually sufficient standards for answerability?").  
  - **Empirical demonstration** that moral practices function identically regardless of participants’ beliefs in ultimacy, undermining Strawson’s claim that reactive attitudes *logically* require it.  
  - **Admitting the question "Can mechanistic agents deserve blame?" is ill-posed**: It conflates normative justification ("Is blame fair?") with metaphysical origin ("Was the act uncaused?"). Separating these ends the stalemate.  

  The debate stalls because it demands metaphysics to do normative work. Progress lies in letting ethics stand without impossible foundations.
