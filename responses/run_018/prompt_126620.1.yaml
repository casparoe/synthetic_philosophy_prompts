answer: |-
  ### Exam Question (Calibrated for 90 minutes / ~800 words)  
  **Gould & Lewontin’s Spandrels Critique: Methodological Assault or Empirical Quibble?**  

  > “The lack of an *adaptationist* explanation does not imply the lack of *adaptation*.” (Gould & Vrba, 1982)  
  >  
  > Gould and Lewontin’s (1979) critique of the “adaptationist programme” centers on spandrels: non-adaptive by-products of structural constraints. Critically evaluate whether their argument is primarily a **methodological challenge** (concerning burden of proof, hypothesis testing, and the null model in evolutionary biology) or merely an **empirical correction** (about the *frequency* of adaptations vs. spandrels). Apply this distinction to the debate over human numerical cognition:  
  >  
  > - **Adaptationist Hypothesis**: Numerical cognition (e.g., exact arithmetic, quantity estimation) evolved as an adaptation for quantitative foraging (e.g., tracking food patches, comparing yields).  
  > - **Spandrel Hypothesis**: Numerical cognition is a by-product of domain-general working memory and spatial-reasoning systems under selection for other tasks (e.g., navigation, social planning).  
  >  
  > **Defend a committed position**: Does treating numerical cognition as a spandrel fundamentally **weaken adaptationist evolutionary psychology** (by challenging its core methodological assumptions), or does it merely **relocate its explanatory targets** (e.g., to the domain-general systems from which it arose)? Ground your argument in the **logical distinction between spandrels and exaptations**, and explain why this distinction matters for evolutionary epistemology.  

  ---

  ### Model Answer (Definite Stance: ~600 words)  
  **Position**: Treating numerical cognition as a spandrel **fundamentally weakens adaptationist evolutionary psychology** by exposing its methodological flaws, not merely relocating its targets.  

  **Methodological vs. Empirical Core**: Gould and Lewontin’s critique is primarily methodological. It attacks the adaptationist programme’s *inferential structure*, where adaptation is the default hypothesis and non-adaptive explanations are marginalized. Spandrels force a recalibration of the null model: the starting assumption should be that a trait *may* be a non-adaptive by-product of structural constraints, requiring adaptationists to *positively falsify* this null before asserting selective origins. This reverses the burden of proof. An empirical correction (e.g., “spandrels are common”) is secondary; the core issue is *how we test claims*, not trait frequency.  

  **Numerical Cognition Case Study**:  
  - The adaptationist hypothesis (numerical cognition for foraging) assumes selection *directly* honed quantitative skills. Yet neurocognitive evidence shows arithmetic co-opts circuits for spatial navigation (e.g., intraparietal sulcus) and working memory. These systems likely evolved for path integration or social strategizing, with exact calculation emerging as a *spandrel* of their combinatorial precision. Crucially, this needs no adaptive story for numeracy itself.  
  - Relocating adaptationist targets (e.g., “working memory is the real adaptation”) misses the point. Spandrels reveal that the adaptationist programme’s *method* is flawed: it would reframe the spandrel (numeracy) as an exaptation (a co-opted adaptation), thereby preserving adaptationism’s hegemony by semantic relocation.  

  **Spandrels vs. Exaptations: The Logical Fault Line**:  
  - **Spandrels** are *initially non-adaptive* by-products of structural necessity (e.g., triangular spaces beneath domes). They exist because physics/development constrains form.  
  - **Exaptations** are traits *shaped by selection for one function* and later co-opted for another (e.g., feathers for thermoregulation → flight).  
  The critical distinction: Spandrels challenge adaptationism’s null model because they *never required* selection to arise. Exaptations, however, reinforce adaptationism because they assume an *original adaptive function*. If numerical cognition is a spandrel, it originated without selection *for* quantification. Calling it an exaptation of spatial reasoning implies spatial reasoning was an adaptation *for* a specific function—resurrecting the very burden-of-proof issue spandrels highlight.  

  **Why This Weakens Adaptationist Evolutionary Psychology**:  
  Spandrels expose evolutionary psychology’s (EP) circularity: it assumes domains are adaptations by default, then “discovers” adaptive functions. Treating numerical cognition as a spandrel forces EP to justify why domain-general systems (e.g., working memory) *must* be adaptations rather than themselves products of deeper constraints. This doesn’t just shift targets; it undermines EP’s foundational logic by demanding proof that apparent design reflects selection rather than architectural necessity. Until adaptationists engage this methodological challenge—accepting non-adaptation as the null hypothesis—their explanations remain epistemically suspect.  

  ---

  ### Marking Scheme (Total: 20 points)**  
  **A (17–20):** All core analytical moves present. Demonstrates mastery of the distinction’s implications.  
  **B (13–16):** Key moves partially addressed but with gaps in logical integration or case application.  

  #### Essential Analytical Moves (12 points total):  
  1. **Methodological Focus** (3 pts): Explicitly identifies spandrels critique as *primarily methodological* (burden of proof, null hypothesis reversal), not empirical. Avoids framing it as "spandrels are common."  
  2. **Spandrel/Exaptation Distinction** (4 pts): Correctly defines spandrels as *non-adaptive by-products of structural constraints* and exaptations as *co-opted adaptations*. Uses this to argue spandrels challenge adaptationism’s *logic*, while exaptations preserve it.  
  3. **Case Application** (3 pts): Applies distinction to numerical cognition debate. Clearly contrasts adaptationist (foraging adaptation) vs. spandrel (by-product of WM/spatial systems) hypotheses.  
  4. **"Weaken vs. Relocate" Argument** (2 pts): Takes a committed stance. If "weaken," explains *how* spandrels undermine EP’s methodology. If "relocate," explains why exaptations rescue adaptationism.  

  #### High-Grade Differentiators (A vs. B):  
  - **A Answers** (5–8 additional points):  
    - (2 pts) *Explicitly links null hypothesis reversal* to numerical cognition case (e.g., "Spandrel hypothesis forces adaptationists to prove numeracy *isn’t* a by-product").  
    - (2 pts) *Exposes circularity* in relocating adaptationist targets (e.g., "Calling numeracy an exaptation of spatial reasoning assumes spatial reasoning was an adaptation, begging the question").  
    - (2 pts) *Connects to evolutionary epistemology* (e.g., "Spandrels demand evidence of *direct* selection pressure, not just functional coherence").  
    - (2 pts) *No conflation* of spandrels with exaptations.  
  - **B Answers**: Omit ≥2 high-grade moves; may conflate spandrels/exaptations or reduce critique to trait frequency.  

  #### Critical Errors (Deduct 2–4 pts each):  
  - **Conflating spandrels with exaptations** (e.g., "Spandrels are recycled adaptations").  
  - **Treating critique as purely empirical** (e.g., "Gould just thought spandrels were more common").  
  - **Misidentifying the null hypothesis** (e.g., "Adaptation is still the default").  
  - **Superficial case application** (e.g., Only describes hypotheses without linking to methodology).  
  - **Uncommitted stance** (e.g., "Both sides have merits" without resolving the prompt’s core question).  

  #### Structure & Clarity (3 pts):  
  Logical flow, concision, precision of terminology.
