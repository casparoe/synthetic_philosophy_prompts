answer: |-
  Cultures can intentionally shift between guilt and shame as primary moral emotions by redesigning social enforcement mechanisms, but this choice is constrained by functional trade-offs in scalability and individual vs. collective outcomes.

  **Decision Tree Logic**  
  Branch on these five questions, each isolating a core disagreement. Answers must be exclusive within branches (e.g., for Q1, pick A, B, or C only).

  1. **What fundamentally distinguishes guilt from shame?**  
     - A: Guilt tracks *internal rule-breaking* (private self-evaluation); shame tracks *social status damage* (requires public exposure).  
     - B: Both track rule-breaking, but guilt focuses on *harm done*, shame on *identity contamination*.  
     - C: They are interchangeable labels for the same emotion; context dictates the name.  

  2. **Does scalability (group size) affect which emotion is effective?**  
     - A: Yes—guilt works at any scale (internal); shame only works in small groups (relies on dense social visibility).  
     - B: No—shame can scale via institutions (e.g., media, laws) to large societies; guilt is universally applicable.  
     - C: Scale is irrelevant; both emotions function identically regardless of group size.  

  3. **Can cultures "refactor" moral emotions like updating a protocol?**  
     - A: Yes—by redesigning norm-enforcement architecture (e.g., replacing public shaming with private restitution systems).  
     - B: No—emotions are biologically fixed or too ingrained via early socialization to change intentionally.  
     - C: Partially—cultures can emphasize one over the other, but cannot eliminate either entirely.  

  4. **Should visibility of the wrong dictate which emotion is appropriate?**  
     - A: Yes—guilt for private wrongs (e.g., cheating in secret); shame for public wrongs (e.g., fraud exposed to the town).  
     - B: No—one emotion should dominate always (e.g., guilt is universally better, even for public acts).  
     - C: Visibility is irrelevant—the *type* of norm violated (e.g., relational vs. communal) matters more.  

  5. **What is the optimal outcome of moral emotion?**  
     - A: *Individual reform* (guilt repairs behavior; shame paralyzes).  
     - B: *Collective order* (shame deters others; guilt is self-indulgent).  
     - C: *Balance*—both are needed for different aspects of social cohesion.  

  **Leaf Mapping**  
  Combinations of answers lead to these leaves. Incoherent combos are flagged.  

  | Leaf                                      | Defining Answer Combo                                                                 | Notes                                                                 |
  |-------------------------------------------|---------------------------------------------------------------------------------------|-----------------------------------------------------------------------|
  | **Guilt-is-better**                       | Q1=A, Q2=A, Q3=A, Q4=B, Q5=A                                                          | Believes guilt is universally superior: internally scalable and reform-focused. |
  | **Shame-is-better**                       | Q1=A/B, Q2=B, Q3=A, Q4=B, Q5=B                                                        | Sees shame as optimal for social control, scalable via institutions. |
  | **They-serve-different-jobs**             | Q1=A/B, Q2=A/B, Q3=B/C, Q4=A/C, Q5=C                                                  | Holds emotions are non-interchangeable; culture can't fully replace one. |
  | **Culture-can-choose**                    | Q3=A + any of: Q1=A/B, Q2=B, Q4=A/B, Q5=A/B                                           | Views emotions as programmable via enforcement redesign (e.g., swapping public shaming for guilt-inducing education). |
  | **Incoherent/Unexplored**                 | Q1=C + Q3=A/B + Q5=C                                                                  | Assumes emotions are context-dependent labels (Q1=C) but also distinct (Q5=C)—contradicts functionality. |
  |                                           | OR Q1=B + Q2=A + Q3=B + Q5=B                                                          | Claims shame requires social damage (Q1=B) but doesn’t scale (Q2=A) and can’t be redesigned (Q3=B), making it unfit for modern societies. |

  **Indistinguishable Leaves**  
  - **Guilt-is-better** vs. **Culture-can-choose**: If Q3=A and Q5=A, both leaves fit—tree can't separate "guilt is inherently better" from "guilt is a superior choice via design."  
  - **Shame-is-better** vs. **They-serve-different-jobs**: If Q4=A and Q5=B, both fit—tree can't resolve if shame is universally optimal or just for public contexts.  

  **Reasoning**  
  - **Functionality**: Guilt excels in internal accountability (e.g., the cheater reforming after private guilt), while shame enforces collective norms (e.g., the town shaming a fraudster to deter others). Your software analogy fits Q3=A: cultures can "patch" enforcement systems (e.g., replacing scarlet letters with restorative justice programs) to favor one emotion.  
  - **Scalability**: Shame struggles in large groups without artificial visibility (Q2=B), making guilt more efficient for diffuse societies—but institutions (e.g., social media) can engineer scalable shame.  
  - **Trade-offs**: Choosing guilt may weaken group cohesion; choosing shame may suppress individual autonomy. The incoherent leaves expose pitfalls, like expecting scalable shame without redesign capacity (Q2=A + Q3=B).  
  - **Use Cases**:  
    - Private cheating (guilt-focused) vs. public fraud (shame-focused) validates Q4=A.  
    - Education reform to "swap" emotions (Q3=A) works only if emotions are seen as malleable (not Q3=B).  
  - **Constraints**: Biology (Q3=B) or functional differentiation (Q5=C) limit cultural choice—e.g., you can't shame a hidden act, making guilt indispensable for private wrongs.
