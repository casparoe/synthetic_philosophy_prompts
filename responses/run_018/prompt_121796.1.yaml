prompt: |-
  I'm a retired physical oceanographer — thirty-odd years of current meters, error bars, and arguing with modellers, and about eighteen months of going to a continuing-education philosophy group on Tuesday nights, which has been a bigger shock to the system than anything the North Sea threw at me. Our tutor, Miriam, is good but she won't answer a question until you say what you'd count as an answer. One thing we do that I like: we keep a forecasting ledger. Every week someone writes down a probability and the reference class they got it from — literally, the set of cases they're treating this one as drawn from — and at the end of term we pool everybody's forecasts inside their declared class and check whether the outcomes were calibrated. Miriam's line is that a class you can't audit is a class you can't use. It's my favorite part of the whole business, because it's the only bit that has error bars on it.

  So I've been logging her verdicts, because I want to know what she'll say about a case I actually care about. Her rulings so far:

  - Coin from the till, never tested, one flip: 0.5, from the class of coin flips generally. She would not let anyone define the class as this coin for a single toss.
  - Same coin after a hundred tosses, 71 of them heads: 0.65, not 0.71. She narrowed to this coin's tosses but pulled back toward the broad class.
  - My own chance of dying in the next five years (I'm 74, cycle a lot, live in a well-off postcode): she used the national life table for men 70–74, ignored the cycling, and flatly refused the class men in this postcode district, even though there's plenty of data behind it. She said it's only a stand-in for things we already know more directly.
  - A friend's hip replacement lasting fifteen years: she refused all hip replacements on the grounds that it mixes bearing surfaces and age bands, and insisted on the subclass by bearing surface and age, even though that subclass only had about eighty cases in it.
  - Whether the district council approves the rock armour scheme in March: she refused to give a probability at all. She wrote no class in the ledger and said it isn't the sort of thing that comes in repeatable batches, though she'd happily give odds as a personal judgement.

  Now my real one. There's a 300-metre stretch of concrete stepped revetment, built 1985, protecting about sixty houses at Sandle Bay, one of which is my sister's. Part of it was repaired in 2004 after a partial failure. The council's consultant has put a number into an expected-loss spreadsheet to decide about £2.3m of rock armour, and I don't trust the number. As I see it there are three candidate classes, and they don't agree:

  A. All UK concrete stepped revetments of that general type: roughly 1,600 structures, pooled failure rate about half a percent a year, so call it 10% over twenty years. Lovely statistics, hopelessly mixed — different foundations, wave climates, ages all thrown together.
  B. Same design, glacial-till foundation, high-energy exposure band, same vintage: nine structures, two of which have failed in the last twenty years, the rest observed for varying periods. Crudely that's about 2% a year, which compounds to knocking on 30% over twenty years — but two events in nine means you can't say much, and with nine members I can't audit calibration inside the class either.
  C. A consultant's physics-based model run for this exact structure: overtopping, scour, toe stability, a scenario spread for sea-level rise, giving 3% over twenty years. Except the scour parameters were partly fitted using data from class A, the modellers admit the honest range is 0.5% to 15%, and they left out the settlement crack the 2004 repair was supposed to fix and maybe didn't.

  What I want from you:

  1. Roughly what number does Miriam give for the twenty-year failure probability, and how wide an interval does she put around it?
  2. What rule is she actually running? Give me two or three candidate rules that fit all five of her earlier verdicts, and say what each one predicts here. I can think of a few myself — narrowest class you can still count in, mechanism and causal homogeneity first, go to the physical model and treat the class frequencies as just evidence about the model, or her own ledger rule about auditable classes — but I can't tell which one survives all five cases, and they definately come apart on mine.
  3. Your best guess, and the reasons for preferring it.
  4. What further case, or what single extra piece of information, would separate the rules? I want something to put to her on Tuesday.
  5. Does the 2004 repair move it into a different class — is a once-failed structure a member of structures that have failed before, which plausibly has a much higher rate and no national data at all, or does a repair reset it? Which of the rules does that question bite on?
  6. And practically: I have to give the council one number on Tuesday to go in their expected-value sum. What should I tell them if I want to be as consistent with Miriam as possible — and is there a decent chance the honest answer is that no number belongs in that box?

  Please write in British English — metres, realise, emphasise, that sort of thing. And don't give me references or a reading list; I can't use them and I don't want them. Just the argument, a few hundred words is plenty.
reasoning: |-
  Okay, this retired oceanographer has a fascinating problem combining practical engineering with philosophical probability. He's been attending a philosophy group that emphasises rigorous forecasting with reference classes, and now he's trying to apply that approach to assessing coastal erosion risk for his sister's house. 

  The key tension is between three conflicting data sources: broad national statistics (Class A, 1600 structures), a narrow vintage-specific cohort (Class B, 9 structures), and a physics model with known limitations (Class C). Miriam's past rulings suggest she'd reject Class A as too heterogeneous and Class B as statistically meaningless - she'd likely go with the model but demand they quantify its uncertainty.

  Hmm, the 2004 repair is particularly tricky. Does that make this structure part of a "repaired failures" class? Miriam would probably say yes if failure mechanisms are similar, but there's no data for that. Her refusal to use postcode-level mortality data suggests she'd prioritise causal mechanisms over convenient groupings.

  For the council's spreadsheet... honestly the most Miriam-like answer might be to refuse a single number. But practically, I'd weight the physics model highest while including the repair uncertainty. That 0.5-15% range feels honest - maybe present it as 3% but flag the crack omission.

  The cycling mortality case is telling: Miriam ignored individual factors without population-level evidence. Parallel here is she'd reject adjusting the model based on the 2004 incident unless there's data on how repairs affect failure rates. That repair either creates a new subclass or doesn't - and without data, she can't use it.

  What would test her principles? A case where a narrow class has perfect calibration but contradicts mechanism. If nine identical bridges all collapsed in year 15, but physics says they should last 50 years... would she trust the pattern or the model? I suspect mechanism wins.
answer: |-
  Right, let's crack this using Miriam's ledger logic as inferred from her rulings. British English engaged.

  1.  **Miriam's Number & Interval:**  
      She likely gives **5% over twenty years with a wide interval, say 1% to 15%.** She'd reject Class A (too mixed), Class B (too few to audit calibration, even if causal), and reluctantly accept Class C (physical mechanism) as the *starting point*. However, she'd heavily discount it due to the unmodelled settlement crack (a known causal factor omitted) and the parameter fitting using Class A data (tainting its 'purity'). The admitted 0.5%-15% range reflects this uncertainty. She might nudge the central estimate *slightly* towards Class B's indication of higher risk (but not to 30%) because it provides *some* weak evidence about this specific vintage/foundation type, acknowledging the calibration problem but valuing the causal similarity.

  2.  **Candidate Rules & Predictions:**
      *   **Rule 1: Causal Homogeneity & Mechanism First:** Prioritise the class defined by the most specific known *causal mechanism*, even if data is sparse. Use broader classes only as priors or to inform the model. Reject purely statistical classes without causal justification.  
          *Prediction for Sandle Bay:* Chooses Class C (the model), but demands inclusion of *all* known causal factors (the settlement crack!). As it's omitted, she widens the interval significantly beyond the modellers' stated range. Class B provides supporting evidence for mechanism but isn't used directly due to N=9. Class A rejected. **Output: ~3-5% with very wide interval (e.g., 0.5%-25%).**
      *   **Rule 2: Auditable Calibration Trumps All:** Only use a reference class if you can *in principle* check the calibration of forecasts made within that exact class over repeated instances. Requires sufficient N for meaningful calibration checks.  
          *Prediction for Sandle Bay:* Rejects Class B (N=9, can't audit calibration). Rejects Class C (not a frequentist class of repeated events; it's a single model run for one structure). Reluctantly accepts Class A (large N, auditable *in principle* for the broad class), but emphasises its heterogeneity as a major weakness, possibly widening the interval around 10%. **Output: ~10% with moderate interval (e.g., 5%-15%), acknowledging heterogeneity.**
      *   **Rule 3: Narrowest *Causally Homogeneous* Class with *Any* Data:** Find the narrowest class sharing core causal mechanisms *and* having *some* empirical data (even N>1), pulling estimates towards broader classes using Bayesian intuition or to reflect uncertainty. Rejects purely statistical classes lacking causal unity.  
          *Prediction for Sandle Bay:* Chooses Class B (causally specific: design, foundation, exposure, vintage) *because* it has data (N=9), despite calibration limits. However, recognises N=9 is tiny, so pulls the central estimate *back* significantly from 30% towards Class C (3%) and/or Class A (10%), resulting in a number like 5-10%. Widens interval massively due to small N. **Output: ~7% with huge interval (e.g., 2%-40%).**

  3.  **Best Guess & Reasons:**  
      **Rule 1 (Causal Mechanism First) fits best.** It explains:  
      *   Rejecting the postcode mortality class (lacks direct causal link vs. national table's biological mechanism).  
      *   Insisting on hip replacement sub-classes (different bearing surfaces = different causal mechanisms).  
      *   Refusing a probability for the council decision (no clear causal mechanism generating repeatable batches).  
      *   Narrowing the coin class to *that coin* after 100 flips (causal mechanism established).  
      *   Her ledger rule ("can't audit, can't use") *supports* this by ensuring the class frequencies used *reflect* the actual causal process.  
      **Prediction:** She uses the model (Class C) *as the best representation of the causal mechanism* but heavily penalises it for omitting a known causal factor (the crack) and relying on Class A data. This leads to distrusting the 3% point estimate, heavily weighting the 0.5%-15% range, and perhaps nudging the centre upwards slightly due to Class B's suggestive evidence. Result: **~5% (1% - 15%)**.

  4.  **Separating Test Case:**  
      **"A bridge built in 1920 with a unique design flaw discovered in 2020. Only 3 similar bridges were ever built; one failed catastrophically last year. National data for all pre-1950 bridges shows a 0.1% annual failure rate. A detailed physical model incorporating the flaw predicts 50% failure probability in the next 10 years."**  
      *   Rule 1 (Mechanism): Chooses the model (50%), wide interval.  
      *   Rule 2 (Audit): Rejects unique flaw class (N=3, can't audit). Uses national data (0.1%), wide interval due to heterogeneity.  
      *   Rule 3 (Narrowest Causal): Uses the 3-bridge class (maybe ~33%?), pulls *slightly* towards national/model, huge interval.  
      Miriam's choice here reveals if mechanism truly dominates over auditability.

  5.  **The 2004 Repair & Class Membership:**  
      Miriam would likely argue the **2004 failure creates a *new* causal subclass: "Structures of this type *that have suffered a partial failure and been repaired*."** The critical question is whether the repair addressed the *root cause* (e.g., inadequate foundation) or just the symptom (the crack). If the root cause persists (or the repair introduces new weaknesses), the failure mechanism differs from virgin structures (Class A/B) or the model (Class C, which ignored it). **This bites hardest on Rule 1 (Mechanism).** If the root cause wasn't fixed, Class C is invalidated (it modelled an intact structure) and Classes A/B become irrelevant. You'd need data on *repaired* revetments, which likely doesn't exist in quantity – forcing reliance on expert judgement about the repair's efficacy, or refusing a number. Rules 2 & 3 might try to force it into Class B or a broader 'repaired structures' class, but Rule 1 would demand the new causal class.

  6.  **Practical Advice for the Council:**  
      To be consistent with Miriam's inferred Rule 1:  
      *   **Tell them:** "Based on the physical model, adjusted for known omissions and broader evidence, the estimated probability of failure within 20 years is approximately **5%, but with high uncertainty ranging potentially from less than 1% to over 15%.** The unmodelled settlement crack from the 2004 incident is a significant unknown factor increasing risk, and there's very limited data on structures identical to this one after such repairs."  
      *   **The Honest Answer?** There *is* a decent chance Miriam would say **no single, well-justified number belongs in that box.** The causal picture is too messy (omitted crack, model reliance on bad data, small specific cohort). The council's spreadsheet likely demands a point estimate, but the philosophically consistent move is to provide a *range* and emphasise the limitations, particularly the unmodelled crack. Forcing a single number obscures critical uncertainty. If forced, 5% is the least inconsistent within Miriam's framework, but only with massive caveats.
