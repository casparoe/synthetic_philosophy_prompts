prompt: |-
  You are an expert in moral philosophy with a focus on practical reason and social norms. Before you answer, please take a moment to brainstorm: distinguish the different kinds of reasons—moral, prudential, legal, and merely coordinative—that might explain why someone should follow a local convention.

  I have no formal training in philosophy, but I have been thinking on my own about whether everyday conventions—tipping, queuing, jaywalking—create genuine moral obligations, especially for visitors who did not grow up with them. I want to know whether there is one principle that captures my gut reactions across cases, or whether I am just being inconsistent.

  Here are my verdicts:

  - In the United States, leaving no tip after genuinely poor service feels acceptable, but leaving none after decent service feels like a moral failure, not mere cheapness, because I know servers depend on tips for a living wage.
  - In Japan, leaving a tip feels wrong—almost insulting—even though it gives the worker extra money. So following the local no-tip norm seems morally required, not just polite.
  - In Germany, jaywalking when no cars are present still feels morally wrong in a distinctive way, as if one is breaking a shared trust rather than merely breaking a law. As a visitor, doing it seems worse than violating some arbitrary local rule.
  - In a London Tube queue, pushing past others feels like stealing their place; but in a bus boarding in another city where there is no line and everyone jostles, hanging back politely does not feel morally superior—just inefficient.
  - In a hospital waiting room with no numbers or staff, everyone silently knows the arrival order. Cutting that invisible line feels like fraud. By contrast, in a supermarket with an "express lane" sign that locals routinely ignore, using it with too many items feels like breaking a rule, yet not like a serious moral wrong.

  There is tension here: some conventions feel like invisible contracts that bind visitors (tipping for wages, silent queues, jaywalking as shared trust), while others feel like pure coordination tools that generate no moral duty (bus boarding, ignored express lanes).

  Please state the most precise principle you can that captures all or most of these verdicts, then apply it to a case I have not listed: a visitor in Italy notices that locals at a coffee bar never form a line but instead crowd the counter and shout their orders. Is there a moral obligation to crowd with them, or is it acceptable to hang back and wait politely?

  Be explicit about whether your principle saves the pattern only at the cost of complexity, and if it forces me to overturn one of my verdicts, identify exactly which one and why. Do not provide bibliographies, reading lists, or citations—just reason through the cases directly.
reasoning: |-
  Hmm, the user is grappling with a nuanced question about moral obligations arising from social conventions. They've shared their intuitive judgments across various scenarios - tipping in US vs Japan, jaywalking in Germany, queuing in London vs chaotic boarding, and invisible queues in hospitals versus ignored supermarket signs. The pattern shows they intuitively distinguish between conventions that feel morally binding (like tipping for wage support) versus those that feel purely coordinative (like ignored express lanes).

  Their core tension is reconciling why some conventions create moral duties for visitors while others don't. They're clearly thoughtful but untrained in philosophy, so I need to avoid jargon while maintaining precision. The Italian coffee bar case will be a good test for whatever principle I develop.

  Looking at their examples, the key differentiator seems to be whether the convention serves a deeper purpose beyond mere coordination. In US tipping, it's about fair wages; in German jaywalking, it's about social trust; in silent queues, it's about fairness in turn-taking. Whereas chaotic bus boarding or ignored supermarket signs lack this deeper moral dimension.

  I'm considering formulating a principle based on "normative functionalism" - where conventions generate moral obligations when they functionally serve important human interests like fairness, dignity, or welfare. This would explain why violating US tipping feels like exploitation (undermining livelihood), while not tipping in Japan would be disrespectful (imposing alien values). 

  For the Italian coffee bar: crowding serves efficiency in busy settings, but doesn't touch core interests like fairness or dignity. So hanging back wouldn't be morally wrong, just inefficient. This preserves all their verdicts except perhaps the German jaywalking case - but even there, one could argue the anti-jaywalking norm functionally supports pedestrian safety and social order.

  The principle might need refinement around cultural sensitivity - when does respecting local practice become morally significant in itself? But their Japan tipping example suggests this only matters when imposition could cause harm or offense, not in purely coordinative cases.
answer: |-
  Based on your intuitions across these cases, the unifying principle appears to be:

  **A local convention generates a genuine moral obligation for visitors when violating it either (1) unfairly exploits a cooperative system that secures essential benefits for others, or (2) demonstrates disrespect for the local social framework in a way that causes meaningful harm or offense, beyond mere inefficiency.**

  Let's test this against your verdicts:

  1.  **US Tipping (Poor vs. Good Service):**  
      *   **No tip after poor service:** Acceptable. The system secures a living wage through *good faith* participation; no exploitation occurs if service fails the basic expectation.  
      *   **No tip after decent service:** Moral failure. Exploits a system where workers *depend* on tips for essential wages (violates #1).

  2.  **Japan No-Tipping:**  
      *   **Leaving a tip feels wrong:** Not primarily about inefficiency. It disregards a cultural norm where fair wages are baked into pricing, and tipping can imply the worker needs charity or that local standards are inadequate (violates #2 - meaningful offense/disrespect).

  3.  **German Jaywalking (No Cars):**  
      *   **Feels morally wrong:** Violates a deeply embedded norm of mutual trust and civic order (#2). It signals disregard for the shared commitment to rules maintaining public safety and predictability, even when immediately safe. Not merely inefficient.

  4.  **London Tube Queue:**  
      *   **Pushing past = stealing:** Exploits a cooperative system ensuring fair access and turn-taking (#1). "Place" in line represents invested time/effort.

  5.  **Chaotic Bus Boarding:**  
      *   **Hanging back = inefficient, not immoral:** No cooperative system exists to exploit. "Jostling" is the accepted coordination method; hanging back doesn't harm anyone's essential interests or cause offense, it just fails to coordinate optimally. No violation of #1 or #2.

  6.  **Hospital "Invisible" Queue:**  
      *   **Cutting = fraud:** Exploits a tacit, cooperative system for fair access to an essential service (healthcare) based on urgency/arrival time (#1).

  7.  **Ignored Supermarket Express Lane:**  
      *   **Using it = rule-breaking, not serious moral wrong:** The sign is a failed coordination tool. Locals ignore it, so there's no stable cooperative system being exploited for essential benefits (#1). Violating the *sign* might be mildly rude or inefficient, but it doesn't disrespect a functioning social framework causing harm/offense (#2 not strongly engaged).

  **Complexity Assessment:** This principle *is* complex, distinguishing between "mere coordination" and conventions tied to essential benefits/respect. However, this complexity mirrors the nuanced distinctions in your intuitions. It avoids being purely consequentialist or purely deontological, blending elements of fair play, exploitation, and respect for social context.

  **Application: The Italian Coffee Bar (No Line, Crowd & Shout)**

  *   **Analysis:** This convention is primarily a **coordination tool** for efficiency in a fast-paced setting. There's no evidence it secures *essential benefits* (like fair wages or access to critical services) or embodies deep cultural values where deviation would cause *meaningful harm or offense* beyond momentary annoyance or inefficiency. Locals crowding/shouting isn't an agreement ensuring fair turn-taking; it's simply the established method for getting served quickly. Hanging back politely doesn't exploit a cooperative system (#1) – it might just mean you get served last. Nor is it inherently disrespectful to the local social framework in a harmful way (#2); it's simply opting out of the local coordination method.
  *   **Verdict:** There is **no strong moral obligation** to crowd and shout. While it might be *prudentially* wise (to get coffee faster) and *coordinatively* expected, violating this norm doesn't constitute unfair exploitation or cause meaningful disrespect/harm. Hanging back politely is acceptable, though likely inefficient.

  **Forced Verdict Overturn?** The principle generally saves your pattern. The closest tension is with **German Jaywalking**. One could argue jaywalking with no cars present also exploits the *system* of trust maintaining safety *in general*, even without immediate risk (fitting #1). If you saw *no* connection to systemic trust/safety and felt the wrongness was *purely* about breaking a rule for its own sake (like the ignored supermarket sign), the principle would force you to reconsider that verdict as less morally serious. However, your description ("breaking a shared trust") strongly suggests you *do* perceive a link to a system securing an important benefit (public order/safety), so the principle likely holds.
