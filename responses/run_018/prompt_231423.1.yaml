  ### Scoring Key  
  *Map your answers to the methods below. Each option corresponds to one method, justified by its behavioral commitment:*  
  - **Tenacity (T)**: Avoiding exposure to contrary evidence to protect preexisting beliefs.  
  - **Authority (A)**: Deferring to institutions, groups, or credentialed experts as arbiters.  
  - **A priori (AP)**: Deciding based on personal reflection, intuition, or what seems reasonable.  
  - **Science-fallibilist (SF)**: Revising beliefs based on evidence and accepting uncertainty.  
  - **Science-infallibilist (SI)**: Treating current scientific conclusions as fixed and final.  

