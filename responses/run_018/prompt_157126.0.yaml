prompt: |-
  Write the opening remarks for the dedication ceremony of a new clinic offering mitochondrial replacement therapy — a procedure in which nuclear DNA comes from the intended parents but healthy mitochondrial DNA comes from a donor egg, so the child has genetic material from three people. The audience is mixed: reproductive clinicians, philosophers of biology, patient families, and lay donors with no philosophical training. Let the remarks be structurally governed by origin essentialism — the view that a person necessarily originates from the particular gametes and cytoplasmic sources from which they actually developed — without settling whether it holds. This constraint should prevent you from claiming that the clinic ‘saves’ or ‘heals’ specific children who would otherwise suffer; instead, navigate whether altering origins produces not a healthier version of the same child but a numerically different one, and therefore whether gratitude is owed to the donor for ‘giving life’ rather than for repairing it. The speech must comfort families without false metaphysical promises, and must reward expert listeners with precise philosophical tension rather than mere decoration. After the remarks, provide a brief structured summary in JSON with exactly these fields: occasion, audience_mix, metaphysical_constraint, rhetorical_move_for_families, rhetorical_move_for_experts, ambiguity_preserved.
reasoning: |-
  We are writing opening remarks for a dedication ceremony of a new clinic that offers mitochondrial replacement therapy (MRT). The therapy involves creating an embryo with nuclear DNA from the intended parents and mitochondrial DNA from a donor. This means the child has genetic material from three individuals.

  The metaphysical constraint is origin essentialism, which holds that a person necessarily originates from the particular gametes and cytoplasmic sources from which they actually develop. We cannot claim that the clinic 'saves' or 'heals' a specific child who would otherwise suffer because, according to this view, if we alter the origins (by using a donor egg's mitochondria), we might be creating a numerically different individual. Therefore, we must navigate the idea that we are not repairing an existing child but possibly creating a new one. This affects how we express gratitude: the donor might be giving life (to a new individual) rather than repairing the life of an existing one.

  The audience is mixed: reproductive clinicians, philosophers of biology, patient families, and lay donors. We need to comfort families without making false promises about metaphysics, and we must engage the experts by preserving the philosophical tension without settling it.

  Structure of the speech:
  1. Acknowledge the occasion and the audience.
  2. Explain MRT in accessible terms.
  3. Introduce the metaphysical tension without resolving it: altering origins might mean a different child, so we cannot say we are saving a child who would otherwise exist. Instead, we are creating a child without mitochondrial disease, but that child might not have existed at all without the procedure.
  4. Comfort families: focus on the outcome (a healthy child) and the love and hope that drive them, without claiming that the same child is now healthy.
  5. Address the donor: express gratitude for the gift of healthy mitochondria that allows the creation of a healthy child, but frame it as a gift of life rather than repair.
  6. End on a note of hope and the significance of the clinic's work.

  Important: We must not resolve the ambiguity. We must leave the question open: does MRT produce the same child or a different one? Therefore, we avoid phrases like "saving the child" or "healing the child" that imply the same child would have existed but sick. Instead, we can say that without MRT, the parents might have had a child with a devastating disease, or they might not have had a child at all. With MRT, they have a healthy child.

  Draft:

  "Ladies and Gentlemen, esteemed colleagues, dedicated donors, and cherished families,

  We gather today to mark a milestone: the dedication of this clinic, a beacon of hope in the realm of reproductive medicine. Here, we offer mitochondrial replacement therapy, a pioneering technique that combines the nuclear DNA of the intended parents with the healthy mitochondria of a donor. This union results in a child with genetic material from three individuals, a child free from the devastating mitochondrial disease that might otherwise have been passed down.

  In this room, we bring together diverse perspectives: the scientific precision of our clinicians, the profound inquiries of our philosophers, the courageous hope of our families, and the profound generosity of our donors. Each of you is essential to this endeavor.

  Now, let us reflect on what we are doing. Mitochondrial replacement therapy does not repair an existing embryo. Instead, it creates an embryo with a new genetic makeup, one that includes the vital mitochondrial DNA from a donor. This raises a profound question: does this procedure give rise to the very same child who would have been born with a disease, now made healthy? Or does it bring into existence a different child, one who would not have existed without this intervention? 

  We do not settle this question today. But we acknowledge that the origins of a person — the specific gametes and the cellular environment from which they develop — are fundamental to who they are. Changing these origins may mean that the child born is not the same as the child who would have been born without the therapy. Therefore, we cannot claim that we are 'saving' a particular child from disease. Instead, we are enabling the birth of a healthy child who, without this technology, might never have been conceived.

  To our families: we know your journey has been marked by heartbreak and hope. You come here seeking a chance to have a healthy child, to nurture a life free from suffering. We offer you that chance. The child you will hold in your arms will be your own, carrying your nuclear DNA, and they will be healthy because of the gift of mitochondria from a donor. This child will be a testament to your love and perseverance.

  To our donors: your gift is extraordinary. By providing healthy mitochondria, you are not repairing a life but enabling the creation of a new life. You are giving the gift of health and possibility. For this, we express our deepest gratitude — for you have made it possible for a child to be born healthy, a child who might not have existed without you.

  To our experts: we recognize the intricate philosophical and ethical questions that this technology raises. We do not shy away from them; we embrace the tension. This clinic stands at the intersection of science and philosophy, and we invite continued dialogue.

  Today, we dedicate this clinic to the future — a future where children are born free from mitochondrial disease, where families are built on hope, and where the generosity of donors and the dedication of professionals come together to create new possibilities. We step forward with humility and determination, knowing that every life we help bring into the world is a precious gift.

  Thank you."

