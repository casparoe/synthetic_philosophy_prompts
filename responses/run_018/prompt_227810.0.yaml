  3. **Randomization**: Is randomization allowed or necessary? How does it affect reasoning?
  4. **Knowledge of Similarity**: Does knowing that others are similar (or identical) to you change your decision?
  5. **Equilibrium Concepts**: Do they reason in terms of Nash equilibrium, especially mixed strategies?
