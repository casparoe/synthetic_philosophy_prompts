  (a) **No-Randomization Clause in Platonia**: Players must decide deterministically. This probes whether the agent believes that symmetry forces a unique deterministic choice (e.g., all send or all not send) or if they think no action is rational without randomization.

  (b) **Duplicate Announcement in Platonia**: Told that others are certified to run the same decision procedure vs. told they are ordinary strangers. This tests the reliance on similarity: if the agent conditions on being identical, they might reason that everyone will do the same.

  (c) **Self-Matching Ticket in Luring Lottery**: Submit a number equal to the estimate of others' total. This directly tests whether the agent falls into an infinite regress (spiral) or finds a fixed point.

