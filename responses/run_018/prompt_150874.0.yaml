answer: |-
  Based on the constraints and goal of maximizing conceptual leverage within three years, I prioritize the questions as follows:

  **1. First Priority: (a) Can picture languages avoid metaphysical commitments regarding resemblance and representation?**  
  *Why Upstream:* This is the bedrock ontological question. If ISOTYPE pictograms inherently carry metaphysical baggage (e.g., presupposing a "natural" resemblance relation or realist representation), Neurath’s anti-metaphysical project is undermined *before* reconciling it with physicalism or assessing failure conditions. Settling this determines whether ISOTYPE can *in principle* achieve its core aim of bypassing propositional mediation.  
  *Feasible Outcome:* A rigorous taxonomy of pictorial commitments demonstrating whether conventions for resemblance (e.g., stylized icons for "factory") unavoidably imply metaphysical stances (e.g., essentialism) or can be purely operational.  
  *Reprioritization Trigger:* If resolved *negatively* (metaphysical commitments are inescapable), the entire project shifts to damage control for Neurath’s program, elevating (b) and (c). If resolved *positively*, (c) becomes urgent for implementation.

  **2. Second Priority: (c) What are the failure conditions of a universal visual language?**  
  *Why Upstream of (b) and (d):* Understanding *how* and *why* ISOTYPE fails (ambiguity, contextual dependency) is necessary to evaluate its compatibility with protocol sentences (b). If ambiguity is inherent, reconciliation with physicalism (which demands univocal reports) is impossible. It also informs (d) by defining limits of portability.  
  *Feasible Outcome:* A conceptual framework categorizing failure modes (e.g., contextual vs. syntactic ambiguity) and demonstrating whether these are design flaws (correctable via stricter rules) or inherent to non-propositional symbols.  
  *Reprioritization Trigger:* If analysis shows ambiguity is *ineliminable*, (b) becomes largely moot (irreconcilable tension) and (a)’s stakes heighten. If ambiguity is *correctable*, (b) gains urgency.

  **3. Third Priority: (b) Can ISOTYPE be reconciled with Neurath’s physicalist protocol-sentence theory?**  
  *Why Downstream:* This depends entirely on (a) and (c). If pictograms *can* avoid metaphysics (a) and ambiguity *is* controllable (c), reconciliation is feasible. If not, tension is irreconcilable. Addressing it prematurely risks circularity.  
  *Feasible Outcome:* A clear compatibility matrix: e.g., identifying which ISOTYPE use-cases (e.g., quantitative data vs. abstract concepts) could function as "visual protocols" under strict physicalist constraints.  
  *Reprioritization Trigger:* If (a) and (c) yield optimistic results, this rises to test Neurath’s coherence. Negative results from (a)/(c) relegate this to historical critique.

  **4. Fourth Priority: (d) Does Neurath’s architecture offer portable resources for contemporary visualization?**  
  *Why Most Downstream:* This is an application question presupposing the prior three are resolved. Without understanding ISOTYPE’s foundational coherence (a), limits (c), or internal consistency with physicalism (b), portability claims are speculative. Historical specificity is only problematic if core concepts are unstable.  
  *Feasible Outcome:* Assessment of which Neurathian concepts (e.g., "transformation rules" between data and pictograms) can be abstracted from their historical context for modern use, independent of ISOTYPE’s success.  
  *Reprioritization Trigger:* If (a)-(c) reveal fundamental incoherence, this becomes a cautionary study. If they show robust concepts, it gains relevance but remains derivative.

  ---

  **Defended Agenda Rationale:**  
  - **Why (a) Dominates:** It attacks the deepest philosophical tension: whether *any* visual language can fulfill Neurath’s anti-metaphysical ideal. A negative answer collapses the project’s foundations; a positive answer enables meaningful progress on other fronts. It requires no archival work—purely conceptual analysis of pictorial representation.  
  - **Why (c) Before (b):** You cannot test compatibility (b) without knowing *what counts as failure*. If ambiguity is fatal, (b) is irrelevant. (c) provides criteria to evaluate (b).  
  - **Why (b) Before (d):** Contemporary portability (d) is meaningless if Neurath’s own system is incoherent or self-contradictory (b).  
  - **Resource Allocation:**  
    - **Year 1:** Focus entirely on (a) (both philosophers + historian). Historian ensures accurate framing of Neurath’s anti-metaphysical aims; philosophers dissect resemblance theories.  
    - **Year 2:** Shift to (c) (led by philosophers, historian tracks historical examples of ambiguity in ISOTYPE usage).  
    - **Year 3:** Address (b) based on Year 1-2 results (philosophers lead); concurrently, historian drafts implications for (d) as a secondary output.  

  **What Wouldn’t Change the Landscape:**  
  Settling (d) alone would be a niche contribution without resolving the core tensions in (a)-(c). Similarly, prioritizing (b) without resolving (a) risks building on sand. A three-year project must tackle the conceptual keystone first—here, the metaphysical status of pictorial representation.
