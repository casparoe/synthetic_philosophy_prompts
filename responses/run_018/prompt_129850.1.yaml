  hey quick question about benatars asymmetry - i was trying to explain it to my roommate and got stuck. so the idea is that missing pain is good even without anyone there, but missing pleasure isnt bad for the same reason. but heres where im confused: if theres literally no subject in the never-born scenario, then who exactly is it good for that suffering was avoided? it feels like the argument smuggles in some ghost-entity that recieves the benefit of avoided pain but doesnt suffer the loss of missing pleasure. and if we allow that kind of retroactive welfare accounting for non-existant people, shouldnt it also apply to AI models we never train? like, if i dont create a sentient system, ive avoided its potential suffering (good?) but also denied it pleasure, yet people only care about the human case. is there a hidden premise that only biological organisms can be subjects of this counterfactual harm? sorry for the ramble, just trying to understand the who part.
