prompt: |-
  hey so im writing about paternalism and nudging for my ethics class and im stuck. can u analyze the 2012 NYC soda portion cap rule through the lens of libertarian paternalism? i know the usual story - bloomberg proposed banning sodas over 16oz, critics said it was a nudge not a ban, courts struck it down as arbitary and capricious. but i want u to dig into whether it actually fits thaler and sunsteins idea of asymmetric paternalism. like, since you could just buy two 16oz sodas instead, does the rule only hurt people who are too lazy or distracted to do the workaround, which makes it symmetric in practice? and what does the court rejecting it tell us - does it prove nudges only work when people dont notice the choice architecture, or that once its exposed it gets treated like a shove? also does the workaround problem show the framework assumes people wont notice friction, and if so is that a bug or a feature? i want the episode to test the theory, not just the theory explaining the episode. no need for citations i just want reasoning.
