prompt: |-
  I'm putting together a little interveiw series for my student philosophy blog — next week's guest is basically a stand-in for anyone defending that gradational moral-status view where sentience isn't binary but runs on a sliding scale all the way from insects right down to thermostats. She's particularly into this framework she calls "phenomenal luminosity bands": sentience comes in discrete bands rather than a smooth curve, so a thermostat sits in band zero with a kind of null-weight presence, bees are band two with unstable partial standing, and humans sit up in band six. I want about eight to ten questions that really go into the weeds, not just "do you think insects suffer?" — for each one I need a follw-up keyed to the answer she's most likely to give. Please make sure there's at least one question pressing the boundary problem between bands, one on whether loads of band-zero entities can accumulate moral weight, one on whether she's just smuggling binary thresholds back in through the back door, and one about practical differences for factory farming versus turning up the heating, with a follow-up that anticipates her saying it's all about aggregate luminosity. Write the answer in British English please, and keep the tone casual since I'm drafting this on my phone.
