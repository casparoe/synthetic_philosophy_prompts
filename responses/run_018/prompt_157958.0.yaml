     - Group A reports: "We are rotating because we see the ball move outward."
     - Group B reports: "We see the laboratory rotating relative to the fixed stars."
     - Facilitator asks Group B: "Do you agree with Group A's claim that they are rotating, even though they did not use the stars?"
     - Some in Group B might say: "Yes, because we see it too." But the facilitator pushes: "But what if there were no stars? Could Group A still claim they are rotating?"
     - This is where the debate begins.

  4. **Vote/Resource Allocation**:
     - We have a vote or allocate tokens. Each student gets 2 tokens (representing publication tokens). There are two claims:
       - Claim 1: Group A's method (local effects) is sufficient to establish rotation, even without reference to the stars.
       - Claim 2: Rotation must be defined relative to something, so without the stars (or some reference), Group A cannot claim rotation.
     - Students allocate their tokens to the claim they support.

