prompt: |-
  Consider the institutional pattern visible in how universities and cultural institutions treat creators with documented moral failures: art-history curricula and museum exhibitions now routinely include explicit ethical framing—syllabus modules, wall texts, or curatorial disclaimers—that addresses a visual artist’s harmful conduct, yet literature and music programs rarely apply analogous framing to authors or composers with comparable biographies. At the same time, art-market institutions systematically suppress that same biographical moral information in provenance reports and auction catalogs, treating it as valuation-irrelevant, even when the museum sector highlights it. What theory, or family of theories, of artistic value does this three-way asymmetry presuppose? Does the museum and curricular practice presuppose that visual art is uniquely transparent to the creator’s moral character in a way that literature and music are not, or that encountering a painting in a museum is a morally situated relationship rather than a purely aesthetic one? Does the market suppression presuppose a strict autonomy thesis—that aesthetic value is entirely separable from moral biography—or merely a pragmatic judgment that buyers prefer not to know? Reconstruct the implicit philosophical commitments that would render both practices coherent together, distinguish what they strictly presuppose from what they are merely compatible with, and identify where the pattern is philosophically underdetermined—specifically, whether rival views such as expressivism, formalism, or institutionalism could each license the split. Finally, say what would have to change in curricular design, curatorial norms, or market regulation if the underlying view were replaced by one that treated moral biography as uniformly relevant, or uniformly irrelevant, across all art forms.
reasoning: |-
  Okay, the user is asking about the three-way asymmetry in how different cultural institutions handle the moral failures of creators. Let me break this down. First, universities and museums include ethical framing for visual artists but not as much for authors or composers. Meanwhile, the art market suppresses this information. The user wants to know what theories of artistic value explain this and what philosophical commitments are behind these practices.

  Hmm, I need to figure out the underlying theories. The difference between visual arts and literature/music might stem from how each form is perceived. Visual art is often seen as directly tied to the artist's persona, especially with the "artist as brand" idea in post-war art. That could make moral character more relevant. But literature and music might be viewed as more separate from the creator. Formalism probably plays a role here, where the work's form is paramount, especially in music. Plus, textual interpretation in literature allows for separating the author's intent from the work's meaning.

  Then there's the market suppressing moral info. That seems like a strict autonomy thesis—art's value is purely aesthetic and separate from morality. But it could also be pragmatic; buyers don't want to know, affecting sales. The coexistence of museum disclaimers and market suppression suggests a dual-aspect theory where context determines relevance. Museums are seen as educational and moral spaces, while the market is transactional.

  The user also wants to know if rival theories like expressivism or institutionalism could allow this split. Expressivism might justify the focus on visual art if it's seen as more expressive of the artist's character. Formalism would separate art from biography but might not explain why visual art gets ethical framing. Institutionalism says the context defines value, so museums and markets set different norms, which fits the asymmetry.

  The underdetermined part: the practices don't specify why visual art is singled out. It could be media ontology or institutional history. Rival theories can accommodate the split through contextual factors. For example, expressivism might emphasize artist character where the work is seen as self-revealing.

  If moral biography were uniformly relevant, all institutions would include ethical disclaimers, and the market would have to disclose such info. Curricula would integrate ethics modules across all arts. Auctions might see price impacts based on moral factors. But if it were uniformly irrelevant, all disclaimers would vanish, and the market's silence would be consistent. However, the market's suppression might still occur for pragmatic reasons even under a relevance view, to avoid depressing prices.

  The user's deeper interest might be understanding the philosophical inconsistencies in cultural practices and how they reflect societal values. They might be looking for a critique of current norms or seeking ways to advocate for more consistent ethical treatment across art forms. They might also be interested in the practical implications for policy changes in education and market regulation.
answer: |-
  This institutional asymmetry reveals a complex interplay of philosophical commitments about artistic value, media ontology, and institutional purpose. Let's reconstruct the implicit theories:

  ### Core Presuppositions
  1. **Moral Biography's Medium-Specific Relevance**  
     The curricular/museum practice presupposes that **visual art is uniquely indexical to the creator's moral character** compared to literature or music. This stems from:
     - **Material Ontology**: Paintings/sculptures are singular physical artifacts directly touched by the artist, creating perceived biographical intimacy.
     - **Post-War "Artist as Brand"**: Contemporary art's cult of authorship (e.g., Pollock, Picasso) ties the work's meaning to the creator's persona.
     - **Visual Encounter as Relational**: Museums frame viewing as an embodied, ethically charged encounter where the creator's presence is felt (contrasting with literature's textual mediation or music's performative abstraction).

  2. **Market Suppression as Autonomy+Pragmatism**  
     Auction houses combine:
     - **Strong Aesthetic Autonomy**: Presupposing artistic value is *categorically independent* of moral biography (Bell's "significant form")
     - **Transactional Pragmatism**: Buyers' preferences for "untainted" enjoyment and fear of value depreciation justify suppression.

  ### Coherence Mechanism: Contextual Dualism
  Both practices cohere under a **contextual theory of artistic value**:
  - **Museums/Curricula** adopt a **moderate moralism** (e.g., Gaut): Moral flaws *can* diminish artistic value *in pedagogical/ethical contexts* but only for visual art due to its indexical nature.
  - **Markets** uphold **radical autonomism** (e.g., Wilde): Artistic value is *strictly* formal, making moral data irrelevant to valuation.  
  **Bridge Principle**: Visual art's materiality makes moral issues *contextually salient* in museums but *commercially disruptive* in markets.

  ### Underdetermined Elements & Rival Theories
  | Theory       | Compatibility with Asymmetry          | Tensions                        |
  |--------------|---------------------------------------|---------------------------------|
  | **Expressivism** | Justifies visual art focus (as "self-revelation") | Should extend to confessional literature/song |
  | **Formalism**  | Explains market suppression           | Cannot justify *any* ethical framing |
  | **Institutionalism** | Fully compatible (different sites set own rules) | Doesn't explain *why* visual art is singled out |

  **Key Underdetermination**: The pattern doesn't specify *why* visual art is uniquely morally transparent. Rival explanations remain plausible:
  - Historical contingency (e.g., feminist critiques targeting visual canons)
  - Media affordances (painting as "stained" by touch vs. text as abstract)
  - No philosophical necessity—only institutional habit.

  ### Uniform Relevance/Irrelevance: Consequences
  **Scenario 1: Uniform Moral Relevance**  
  - **Curricula**: Mandatory "ethical modules" for all arts (e.g., Wagner's antisemitism in musicology, Pound's fascism in modernism courses).  
  - **Museums**: Wall texts for composers' portraits, disclaimers for literary manuscripts.  
  - **Market**: Provenance reports include moral dossiers; Sotheby's catalog notes for Heisenberg's piano link to Nazi work.  
  *Systemic Shift*: Collapse of autonomy thesis; art valuation becomes explicitly moral-aesthetic hybrid.

  **Scenario 2: Uniform Moral Irrelevance**  
  - **Curricula**: Remove all ethical framing; teach R. Kelly songs as pure craft.  
  - **Museums**: Eliminate disclaimers (e.g., display Polanski's films without context).  
  - **Market**: Current practice validated universally; no disclosure required.  
  *Systemic Shift*: Ethicism fully purged; institutional focus on "pure" aesthetics.

  ### Conclusion
  The asymmetry reflects a **fragmented institutional metaphysics**:  
  - **Visual art** is treated as a *moral testament* in education but a *formal commodity* in markets.  
  - **Literature/music** escape ethical framing due to perceived *ontological distance* (textual abstraction, performative mediation).  

  This disunity suggests no coherent underlying philosophy but rather:  
  > **A negotiated truce between moral engagement (in public institutions) and aesthetic purification (in commerce), mediated by medium-specific folk theories of artistic "presence."**  

  Radical change would require overthrowing either:  
  (a) The autonomy axiom (making markets morally accountable), or  
  (b) Medium essentialism (forcing equal ethical scrutiny across arts).
