  I'm preparing a seminar paper on the ontology of time and have become fixated on a tension I haven't seen addressed directly in standard treatments. The Rietdijk-Putnam argument uses the relativity of simultaneity to show that if special relativity holds, then every event—past, present, and future—exists with equal ontological status, since for any event E there is some inertial frame in which E is simultaneous with an observer's "now." But I want to push this further into a more specific conceptual problem: suppose we grant the block-universe conclusion, and then ask what becomes of "causal efficacy" within that four-dimensional structure. If all events are equally real, then the relation between a neural state at t1 and an action at t2 is not a diachronic production but a static correlation across world-lines. I want a dialogue between two philosophers—Dr. Lin, who thinks this static-correlation view actually strengthens eternalism by dissolving the pseudo-problem of temporal becoming, and Dr. Vasquez, who argues that the Rietdijk-Putnam argument secretly treats coordinate hyperplanes as ontologically exhaustive in a way that smuggles in a privileged metaphysical frame, and that once we recognize causal efficacy as irreducibly diachronic, the argument collapses into a reductio of the block view rather than of presentism.

  Set the dialogue during a review session for a hypothetical grant proposal: an experiment measuring temporal-order judgments in astronauts experiencing sustained relativistic velocities. The two characters should keep getting sidetracked into whether the block view predicts that the astronauts' subjective "now" should fragment across reference frames in empirically detectable ways. Both must be equally competent—Lin should not dismiss presentism as naïve intuition, and Vasquez should not misrepresent the Lorentz transformation. They must respond to each other's actual points: for instance, if Vasquez claims that diachronic causation requires a privileged present, Lin should answer with a four-dimensionalist account of causation rather than changing the subject; if Lin argues that simultaneity is purely conventional, Vasquez should show exactly where that conventionality fails to support the ontological conclusion. Include at least one moment where they uncover a shared premise—perhaps about the conventionality of simultaneity—that actually deepens their disagreement rather than resolving it. The dialogue should be substantive enough that a reader could reconstruct both positions from it alone, and it should contain no bibliographic references or citation requests, since I am working without access to a library.
