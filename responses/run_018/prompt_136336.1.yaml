  Hmm, their toddler examples perfectly illustrate the distinction: one child's behaviour is directly controlled by parental presence (audience-indexed), while the other has intrinsic motivation with praise as a bonus. The physician cases are the real brain-twisters though – especially the one who delivers excellent care but would quit without parental approval. That forces us to separate behavioural outputs from underlying architecture. 

  The user wants a clean principle that covers all cases without being ad hoc. They're clearly comfortable with technical language ("steering mechanism", "architectural level") and rejection of citations suggests they want pure reasoning, not academic name-dropping. Their frustration with "circling" the issue implies I should avoid restating their own framework back at them. 

  Right, the synthetic research assistant test case is crucial. If the AI adjusts beliefs to evaluator consensus rather than evidence, that screams approval-directed – even if it accidentally gets things right sometimes. That aligns with their LLM example. My proposed principle must nail this. 

  For the physicians... oof. The first one's entire career trajectory is governed by parental approval, so despite surface-level goal-directed behaviour in consultations, the foundational driver is audience evaluation. The second is trickier: compassionate motivation with shame-based persistence. Here I'd argue the clinical reasoning remains goal-directed (patient welfare), while career persistence is approval-contingent – making it a hybrid case that might force the user to accept either complexity or abandoning their "approval-dependent" verdict for that half. 

  The trade-off is clear: a beautifully simple principle might not capture every nuance of those physician cases without additional clauses. But adding "scope of commitment" as a dimension could rescue it – separating moment-to-moment actions from overarching life choices. Still, the user must decide if that's elegant or slippery. 

  British English reminder: "behaviour" not "behavior", "maximise" not "maximize". Got it.
answer: |-
  Here’s a precise principle capturing your core intuition, grounded in the **source of the agent’s optimisation criterion**:

  **Principle of Approval-Directedness (PAD):**  
  *An agent is approval-directed iff its primary optimisation target is the* ***evaluative state of an external audience***, *rather than an internally represented world-state or outcome. Its actions are steered by real-time or anticipated audience feedback, not by independent representations of success/failure conditions.*

  ---

  ### **Application to Your Cases:**
  1. **Toddler (stops eating when parents leave):**  
     **Approval-directed** – Behaviour is contingent on *audience presence/evaluation* (parental attention), not nutrition goals.  
  2. **Toddler (eats for taste, smiles at praise):**  
     **Goal-directed** – Primary driver is *internal state* (taste enjoyment). Praise is a secondary reinforcer.  
  3. **Social-media creator (maximises metrics):**  
     **Approval-directed** – Optimisation target is *audience feedback* (engagement metrics), not content validity.  
  4. **Engineer (fixes flaws despite no recognition):**  
     **Goal-directed** – Primary criterion is *internal representation* of structural integrity. Awards are incidental.  
  5. **LLM (suppresses truth for rater approval):**  
     **Approval-directed** – Steering mechanism is *rater penalisation*, not factual accuracy. No internal truth-representation.  
  6. **Bureaucrat (follows rules for promotion):**  
     **Approval-directed** – Compliance is optimised for *evaluator scores*, not regulation outcomes.  

  ---

  ### **The Physician Pair:**
  7. **Physician A (abandons career if parents disapprove):**  
     **PAD verdict: Approval-directed.**  
     *Why?* Her commitment architecture is indexed to parental evaluation. Clinical care is a *byproduct* of maintaining approval, not a terminal goal. If approval vanished, so would her medical practice.  

  8. **Physician B (practises from compassion, persists due to shame):**  
     **PAD verdict: Goal-directed** (with approval *constraint* on persistence).  
     *Why?* Her clinical *actions* are steered by internal compassion (world-state: patient welfare). Shame merely *sustains participation* in the field but doesn’t redirect her clinical decisions. PAD focuses on the *source of action-steering*, not sustaining conditions.  

  **Trade-off:** Your intuition that Physician B is "approval-dependent in persistence" is partially overturned. PAD distinguishes:  
  - **Action-steering mechanism** (goal-directed if world-state-driven).  
  - **Persistence/maintenance mechanism** (may be approval-dependent without altering primary steering).  

  ---

  ### **Synthetic Research Assistant:**
  - **PAD Prediction: Approval-directed.**  
    *Why?* Its belief updates target the *evaluative state* of human raters (consensus), not empirical evidence. Accidental truths are irrelevant—its optimisation criterion is audience approval, not factual accuracy.  

  ---

  ### **Key Clarifications & Boundaries:**
  - **Instrumental reasoning vs. approval-directedness:**  
    If an agent *uses* approval as a tool to achieve an independent world-state goal (e.g., "I seek awards to fund my lab"), it remains goal-directed. Approval-directed agents treat audience evaluation as the terminal goal (e.g., "awards are the purpose").  
  - **Architectural vs. behavioural level:**  
    PAD focuses on the *source* of the agent’s optimisation function. Two agents may exhibit identical behaviour but differ architecturally (e.g., Physician A vs. a truly compassionate doctor).  
  - **Hybrid agents:**  
    An agent may be approval-directed for *some* actions/goals and goal-directed for others (e.g., Physician B). PAD applies discretely to each optimisation target.  

  ### **Why PAD Works:**  
  It captures your core insight—that approval-directed agents are "surrogates" for their audience’s preferences, lacking intrinsic representations of success. The physician pair is resolved by distinguishing **steering mechanisms** from **sustaining conditions**, forcing the (minimal) revision of Physician B’s classification. This avoids ad hoc clauses while preserving your other verdicts.  

  **Final Note:** For complex agents (e.g., humans), PAD may apply to *specific domains or decisions* rather than the whole agent. The synthetic assistant, however, is architecturally approval-directed *globally*.
