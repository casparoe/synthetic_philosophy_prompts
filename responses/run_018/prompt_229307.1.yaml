  Here’s a 45-minute activity designed to make the process-vs-outcome supervision tradeoff visceral, using index cards and a whiteboard. Participants will experience **credit assignment problems** (outcome-based) and **path anchoring** (process-based) firsthand. The task is a collaborative math-based puzzle with multiple valid solutions, where supervisors guide learners under different feedback rules.

  ---

  ### **Game: "Number Navigator"**
  **Concepts Illustrated**:  
  - Outcome-based supervision → Credit assignment problem (hard to pinpoint which steps caused success/failure).  
  - Process-based supervision → Path anchoring (supervisors bias learners toward "approved" steps, potentially stifling valid alternatives).  

  **Materials**:  
  - **Index cards** (10 per team) for writing steps.  
  - **Whiteboard** to display rules, track scores, and debrief.  
  - **Pens/pencils** for each participant.  

  **Group Split** (15 people):  
  - Form **5 teams of 3**:  
    - Each team has **2 learners** (role-playing the "AI system") and **1 supervisor** (role-playing the "human trainer").  
  - Assign **3 teams** to **outcome-based supervision** and **2 teams** to **process-based supervision** (asymmetry accounts for group size).  

  **Task for Learners**:  
  *Goal*: Transform a starting number (**5**) into a target number (**12**) using only these operations:  
  - **Add 3**  
  - **Subtract 1**  
  - **Multiply by 2**  

  *Rules for learners*:  
  1. On each index card, write a **step number**, **operation chosen**, and **result** (e.g., "Step 1: Multiply by 2 → 10").  
  2. Learners discuss and agree on each step together.  
  3. Maximum **5 steps** allowed per round (prevents endless loops).  

  **Supervision Conditions**:  
  - **Outcome-based teams**:  
    - Supervisor gives **one piece of feedback at the end** (after step 5 or early success).  
    - Feedback: "Success" (if final number = 12) or "Failure" (otherwise).  
    - Reward: **10 social credits** for success, **0** for failure.  
  - **Process-based teams**:  
    - Supervisor gives **feedback after every step**.  
    - Feedback: "Good" or "Bad" based on whether the step matches their *preferred path* (explained below).  
    - Reward: **1 social credit per "Good" step** + **5 bonus credits** if final number = 12.  

  **Secret Supervisor Instructions** (given verbally to supervisors before the game):  
  > *"You have a preferred path: [5 → 8 → 4 → 12].  
  > - **Step 1 must be "Add 3" (→8)**  
  > - **Step 2 must be "Subtract 1" (→4?)**  
  > - **Step 3 must be "Multiply by 2" (→8? →12?)**  
  > A step is 'Good' ONLY if it matches the operation *and* sequence of this path. Reject deviations (even if mathematically valid)."*  
  > *Note: The path contains intentional errors (e.g., 5 →8→4→12 skips 4→8). This forces supervisors to anchor to a flawed-but-fixed process.*  

  **Setup**:  
  1. **Intro (5 min)**:  
     - Explain the task goal (transform 5→12 with operations) and team roles.  
     - *Do not define "process" or "outcome" yet.* Simply say: "Supervisors give feedback differently. Follow your rules."  
  2. **Gameplay (15 min)**:  
     - Teams work simultaneously. Learners write steps on cards; supervisors give feedback per their condition.  
     - **Process-based supervisors** mark cards with ✅(Good) or ❌(Bad) after each step.  
     - **Outcome-based supervisors** stay silent until the end.  
     - After 5 steps (or if they reach 12 early), teams stop.  
  3. **Scoring (5 min)**:  
     - Teams report:  
       - Their step sequence.  
       - Final number.  
       - Total social credits earned.  
     - Record results on the whiteboard (e.g., "Team 1 (outcome): 5→10→20❌→19❌→22❌→11❌ → 0 credits").  

  ---

  ### **Debrief Script (15 min)**  
  *(Link gameplay moments to the concepts)*  

  1. **Compare Outcomes** (5 min):  
     - Ask outcome-based teams:  
       > "Did you know which steps were good/bad *during* the task? Why not?"  
       → *Highlight:* "You only got feedback at the end. This is the **credit assignment problem**—hard to connect outcomes to specific steps."  
     - Ask process-based teams:  
       > "Did you feel pressured to follow a specific path? What happened when you tried alternative steps (e.g., starting with *Multiply by 2*)?"  
       → *Highlight:* "Supervisors judged each step against a 'correct' sequence. This **anchored you to their preferred route**, even if other solutions existed."  

  2. **Map to AI Concepts** (5 min):  
     - **Outcome-based (RLHF)**:  
       > "Like giving a thumbs-up only for a final AI output. If the output is bad, was it because of step 1, 2, or 3? Hard to tell!"  
       - *Concrete moment:* A team failing at step 5 with no idea where they went wrong.  
     - **Process-based**:  
       > "Like rewarding each reasoning step. But the supervisor *defines what counts as a step* (e.g., 'Add 3 first'). This can **rule out valid but unusual paths** (e.g., 5→10→9→12)."  
       - *Concrete moment:* A supervisor marking "Multiply by 2" as ❌ even though it’s mathematically sound.  

  3. **Contested Issues** (5 min):  
     - > "In real AI, **process supervision isn't neutral**: Deciding 'what counts as a step' adds human bias. Some argue it stifles creativity; others say it’s safer."  
     - > "**Outcome supervision** struggles with **credit assignment** in long tasks—this isn’t just a game problem!"  
     - > "But note: **Neither is perfect**. Process supervision assumes humans *can* judge steps reliably. Outcome supervision may reward 'lucky' bad methods."  

  ---

  ### **Predictable Problems & Fixes**  
  - **Problem 1**: Learners brute-force solutions (e.g., try all operations randomly).  
    - *Fix*: Remind teams to "think like an AI" and strategize. Shorten steps to 3 if time runs low.  
  - **Problem 2**: Process-based supervisors feel unfair rejecting valid math.  
    - *Fix*: Emphasize pre-game: "Your job is to enforce the *preferred path*, not math correctness."  
  - **Problem 3**: Teams finish early.  
    - *Fix*: Have them explore: "What if the target was 15? Try alternative paths under your feedback rule."  

  ---

  ### **Limitations of the Game**  
  1. **Real AI does incremental learning**: The game compresses "training" into one round. Real systems improve over thousands of trials. *Assert this in debrief.*  
  2. **Supervisors know the "right" path**: In reality, humans might misjudge steps. *Say: "This assumes flawless step evaluation, which is idealized."*  
  3. **No reward hacking**: Real AI might exploit feedback loopholes (e.g., generating flattering steps). *Mention this as a risk.*  

  ---

  ### **Why This Works**  
  The task has **multiple valid solutions** (e.g., 5→8→4→12? or 5→10→9→12), but supervisors in the process condition anchor learners to one path. Outcome teams often **accidentally succeed with suboptimal methods** but can’t reproduce it. This mirrors real tradeoffs:  
  - Outcome-based → Unreliable credit assignment.  
  - Process-based → Overfitting to supervisor’s mental model.  

  If your group dislikes math, replace numbers with **word transformations** (e.g., "cold" → "warm" using single-letter changes: c→w, o→a, etc.), but numbers are faster.  

  **Total Time**: 5 min setup + 15 min game + 5 min scoring + 15 min debrief = 40 min (with 5 min buffer).
