  - 2 teams for process-based (each: 2 learners, 1 supervisor) -> 6 people

  Total 15.

  **Timing**:

  - Introduction and split: 5 minutes
  - Game: 10-12 minutes
  - Team reports: 5 minutes (1 minute per team)
  - Debrief: 10-15 minutes

  Total: ~35 minutes, leaving 10 minutes for buffer and transition.

  **Debrief Script**:

  After the game, gather everyone.

  1. Ask each team to report:
     - Condition (outcome or process)
     - Sequence of steps
     - Points earned
     - How they felt about the feedback

  2. Then, highlight differences:

     - "Notice that in outcome-based, even if a team succeeded, they didn't know which steps were good. For example, if they took 5 steps to get to 25, they got 10 points, but they don't know if they could have done it in fewer steps. This is the credit assignment problem: it's hard to assign credit to individual steps when you only see the final outcome."

     - "In process-based, we saw that feedback was given at each step. But note: the feedback was based on hitting specific waypoints. So if a team tried a different operation at the start, they got 'bad' even if that operation might eventually lead to the goal. This anchored them to the supervisor's preferred path. In fact, one team might have found an alternative path that hit a waypoint later (like 27) and then got back on track. But note: the feedback for the steps that were not on the preferred path was negative, which might discourage exploration."

  3. Map to AI:
     - "In RLHF (outcome-based), we only reward the final output. This makes it hard to know which parts of the model's reasoning were good."
     - "In process-based supervision, we reward each step. But we have to define what a step is and what counts as a good step. This can introduce a bias: the model might only learn to do things the way the supervisor expects, missing out on creative but valid solutions."

  4. Contested issues:
     - "In reality, we might not know the optimal path. The supervisor might be wrong about what counts as a good step."
     - "Also, the granularity of steps is arbitrary. In our game, we broke it into single operations. But what if we had defined a step as two operations? That would change the feedback."
     - "Moreover, outcome-based methods might sometimes discover more efficient or creative solutions that the supervisor didn't anticipate. Our game didn't have an example of a solution that was better than the preferred path, but in reality, that can happen."

  **Handling Problems**:

  - If a team in outcome-based finishes quickly, have them try again with a different approach to see if they can find the preferred path? But we don't have time. Just have them wait.

  - If a team in process-based is stuck, that's okay. It illustrates the point.

  - If the process-based team asks the supervisor for more explanation, the supervisor should say: "I can only say 'good' or 'bad'."

  This should work.
