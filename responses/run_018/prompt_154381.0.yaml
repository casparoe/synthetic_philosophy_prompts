  Where theory strains: Moloch assumes players can’t coordinate, but labs did sign joint pause pledges. The catch? No enforcement mechanism. This exposes a gap in n-player models—the "cheap talk" equilibrium where signaling safety commitment costs nothing. Meta’s open-source move adds another twist: Their "defection" (releasing Llama) actually raised industry safety by enabling external audits, which paradoxically weakened rivals’ closed-model advantages. 

  Final insight: This episode shows multipolar traps need "capital velocity" as a variable. VC-backed players (Anthropic) face different defection incentives than public giants (Google). Theory must evolve beyond static payoff grids. 

