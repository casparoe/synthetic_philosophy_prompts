       - Integrationist prediction: LoopMod has no moral status because without global broadcasting, there is no integrated subject. The recursive loop is a mere circuit without a phenomenal subject.
       - Localist prediction: LoopMod has moral status because the recursive self-modeling computation is sufficient for sentience, regardless of isolation.

