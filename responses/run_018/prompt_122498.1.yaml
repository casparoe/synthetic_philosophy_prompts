prompt: |-
  I wonder whether you would be willing to help me with something that has been troubling me since I took up tutoring A-level mathematics in retirement. My own working life was spent in experimental chemistry — nothing remotely connected with logic — and I have come to philosophy late, so I should be grateful if you would forgive any clumsiness with the vocabulary and correct it where you can.

  The practice I want to ask about is the marking of school mathematics. Candidates are told to 'show your working', and the mark schemes are built out of two distinct currencies: method marks, awarded for the steps of a derivation, and accuracy marks, awarded for getting the right answer. Several features of this practice strike me as hard to reconcile with one another. A candidate who writes down the correct answer and nothing else receives almost no credit, however right the answer is. A candidate who makes an early slip of arithmetic and then reasons impeccably from the wrong number still collects the later method marks — the examiners call this 'follow-through' — so the inference is judged against what the candidate actually had in front of him rather than against the truth. And in a 'show that' question, where the result to be proved is printed in the paper itself, what is being examined can only be the derivation, since the conclusion has already been settled by the authority of the exam board.

  Yet the same practice penalises a candidate who tries to *state* the licence for his step: one who writes, alongside P and if-P-then-Q, the further line that if P and if P then Q then Q, is given nothing for it and is, in my experience, quietly marked down for failing to understand what a proof is. Much the same happens with the word 'obviously': from a strong candidate it passes as a step, from a weak one it is treated as an unlicensed leap. And examiners will sometimes reject an inference for using a technique outside the syllabus — a calculus method on a paper that forbids it — even when the reasoning itself is impeccable, which suggests that what is being policed is whether a rule is *authorised* rather than whether it is *true*.

  This looks to me like Carroll's little dialogue about Achilles and the Tortoise turned into an institution, and I cannot tell what the institution thinks it is doing. So my question is: what view of what makes an inference justified does this practice presuppose?

  In particular, I should like to know the following. Does it strictly presuppose that the justification for a step is *rule-shaped* rather than *reading-shaped* — that the Tortoise's regress terminates in something which is not another proposition from which the conclusion might be drawn — or does it presuppose only the weaker, pedagogical claim that it is useful to keep the licence implicit? Are its parts mutually consistent: can a practice that follows through from a false premise also deduct accuracy marks for the same falsehood, and can it insist that every step be shown while penalising the candidate who shows the rule? Where is it underdetermined — could the truth-preservation view (a step is valid when it can never take you from truths to a falsehood), the view that rules are norms of a practice one is trained into, and the view that the laws of logic are merely the best-supported of our theories and revisable like any other, all keep exactly this mark scheme, and if so what is the smallest commitment common to them? And what would actually have to change in the marking if the first of those views replaced the one implicit now: would examiners check interpretations rather than steps, would a proof that the rules preserve truth become relevant to them, and would a scheme offering a bonus mark for every rule explicitly stated collapse into the regress?

  I have a tentative idea of my own which may be the wrong sort of thing altogether. In the laboratory we distinguished a reading from a calibration: you calibrate a balance against a standard weight, the calibration is not itself one more reading, and you cannot calibrate an instrument using only itself. The Tortoise, it seems to me, is demanding a calibration in the shape of a reading. Is that a useful way to put it, or does it merely relocate the mystery — and if the rules of inference really are to steps as a standard is to readings, what sort of thing is the standard, and should a mark scheme care whether it makes for true conclusions or only whether it is the one in force?
reasoning: |-
  Okay, the user is a retired experimental chemist who's now tutoring A-level mathematics and wrestling with philosophical questions about exam marking practices. They're clearly deeply thoughtful but self-conscious about their philosophical vocabulary—their humility is endearing.  

  The core tension they've observed is fascinating: exam boards simultaneously demand explicit working (method marks) while penalizing students who state logical rules explicitly. This creates a paradox where the system rewards "following steps" but punishes "explaining why steps work."  

  Their chemistry background surfaces beautifully in the calibration analogy—they're instinctively trying to map lab epistemology onto mathematical reasoning. That's clever but risky: while both involve standards, mathematical rules feel more conventional than physical calibration weights.  

  The institutional contradictions they note are spot-on:  
  - Follow-through marking rewards correct reasoning from wrong premises (which feels truth-insensitive)  
  - Yet banning out-of-syllabus methods shows rule-authority matters more than validity  
  - "Show that" questions make truth irrelevant while accuracy marks paradoxically punish wrong answers  

  Their question about what theory of justification underpins this mess is razor-sharp. I need to show how this practice is actually a pragmatic (if inconsistent) hybrid:  
  1) At its core, it's training students in communal proof practices (Wittgenstein's rule-following)  
  2) But it smuggles in Platonism via accuracy marks  
  3) The "don't state rules" norm is about avoiding infinite regress while keeping focus on mathematical objects  

  The calibration analogy works surprisingly well for syllabi-bound rules—but we should acknowledge its limits when discussing universal logic. The key distinction: calibration weights are external, while inference rules are constitutive of the practice itself.  

  Their deepest unspoken worry might be about whether math education cultivates genuine understanding or just rule-compliance. I should gently validate that concern while showing why the messy compromise exists—novices need scaffolding before they can fly philosophically.  

  The marking scheme's contradictions can't be fully resolved because it serves multiple masters: assessing skill acquisition (method), truth-tracking (accuracy), and curriculum compliance (syllabus). Each pulls in different directions philosophically.  

  When they ask what would change under a truth-preservation view: the answer is "everything." Current marking is deeply anti-formalist—it cares about sanctioned paths, not abstract validity. Switching would require complete overhaul, likely collapsing into regress.  

  Final thought: Their lab-trained mind wants a "standard reference" for logic, but the tragic beauty of math is that the standard emerges from the practice. The marking scheme is a flawed attempt to bottle that lightning.
answer: |-
  Your observations cut to the heart of deep tensions in mathematical pedagogy and epistemology. What you describe isn't clumsiness—it's a precise diagnosis of institutionalized contradictions in how inference is assessed. Let's dissect this systematically.

  ### Core Philosophical Commitments of the Marking Practice
  1.  **Rule-Shaped Justification (Not Reading-Shaped):** The practice presupposes that justification terminates in *internalized rules of a practice*, not in further propositions. When a candidate writes "P" and "If P then Q," the rule *modus ponens* is the implicit, socially licensed standard. Stating the rule as a proposition ("If P and (If P then Q), then Q") commits the Tortoise's error: it treats the rule as a premise needing justification, inviting infinite regress. The marking scheme penalizes this because:
      *   It violates the *convention* of mathematical communication (rules are tools, not objects of discourse).
      *   It signals a potential misunderstanding (confusing a rule governing inference with a premise within an inference).
      *   Pragmatically, it wastes time and space needed for substantive mathematical work.

  2.  **Training into a Practice (Wittgensteinian "Forms of Life"):** The scheme assumes logic is embodied in *trained competence*, not theoretical knowledge. The "licence" for a step comes from the candidate demonstrating mastery of the *authorized techniques* of the syllabus. This explains:
      *   **Follow-Through:** Reasoning correctly *from given premises* (even false ones) demonstrates competence in the *technique*. What's assessed is the skill of manipulation, not truth-discovery per se.
      *   **Out-of-Syllabus Rejection:** Validity is secondary to *authorization within the practice*. Using calculus in a non-calculus paper violates the communal norms of *this specific game*, regardless of correctness. It assesses fidelity to the trained method.
      *   **"Obviously" Judgments:** The examiner judges if the step *would be obvious to a competent practitioner trained in this syllabus*. It relies on shared, implicit understanding of what constitutes a "basic" or "trivial" step within the context.

  3.  **Pragmatic Separation of Method and Truth (An Unstable Hybrid):**
      *   **Method Marks:** Reward the *demonstrated application of authorized techniques* (the "how").
      *   **Accuracy Marks:** Reward *correct outcomes* (the "what"), functioning as a *proxy* for overall understanding and procedural accuracy. This creates the tension you note: the same false premise penalizes accuracy (wrong outcome) but not method (correct technique applied to inputs).

  4.  **"Show That" Questions:** These explicitly divorce *truth* from *demonstration*. The goal isn't to discover truth (it's given), but to demonstrate *mastery of the authorized path* to that truth. It tests adherence to the sanctioned derivation method.

  ### Consistency, Underdetermination, and Alternatives
  *   **Is it Consistent? Largely No, Pragmatically Yes:** The tension between rewarding follow-through (technique over truth) and punishing accuracy (truth matters) is logically inconsistent. However, *pedagogically*, it balances rewarding process understanding (method) with the need for correct answers (accuracy). The rejection of rule-statements and out-of-syllabus methods *is* consistent with the "training into practice" view.
  *   **Underdetermination:** The marking scheme *could* be maintained under different philosophical views, *if* they accept the primacy of authorized practice:
      *   **Truth-Preservation:** Could accept it *if* the syllabus rules are deemed truth-preserving, and adherence is the practical way to ensure it in exams.
      *   **Norms of Practice (Wittgenstein/Rule-Skepticism):** Fits perfectly, as described.
      *   **Revisable Theories (Quinean Holism):** Could fit *if* the syllabus represents the currently accepted "best theory" for this level, and exam compliance trains students in its application. Penalizing out-of-syllabus methods reinforces the current paradigm.
  *   **Smallest Common Commitment:** The practice presupposes that **mathematical competence, for assessment purposes, is the reliable application of a specific, pre-defined set of authorized symbolic manipulation techniques within a communal practice, where justification terminates in the mastery and application of these techniques, not in their explicit propositional justification.**

  ### What Would Change Under Truth-Preservation?
  If examiners strictly adopted a truth-preservation view of validity:
  1.  **Interpretations over Steps:** They'd need to check if the step *could* lead from true premises to a false conclusion in *any* interpretation, not just whether it matched syllabus steps. This is computationally infeasible for human markers under exam conditions.
  2.  **Proofs of Rules:** A meta-proof showing *modus ponens* is truth-preserving *might* become relevant (as the ultimate licence), but only if the system demanded *that level* of justification for every step – leading directly to regress or requiring a foundational theory (e.g., set theory) as the new implicit standard.
  3.  **Bonus Marks for Rules:** Awarding marks for stating rules ("If P and P→Q then Q") would indeed accelerate regress. The candidate would need to justify *that* rule ("If [P ∧ (P→Q)] and {If [P ∧ (P→Q)] then Q}, then Q"), ad infinitum, or face arbitrary termination. The scheme would collapse under its own weight or become meaningless ("state any rule you used").
  4.  **Follow-Through & Out-of-Syllabus:** Follow-through marking would be harder to justify (reasoning correctly from false premises isn't truth-preserving *in this instance*, even if the rule is). Out-of-syllabus methods would be *acceptable* if demonstrably truth-preserving, undermining the syllabus authority. Accuracy marks would gain primacy over method marks.

  ### Your Calibration Analogy: Profound and Useful
  Your instinct is excellent. The calibration vs. reading distinction maps remarkably well:

  *   **Rules of Inference are the Calibration Standards:** They are the fixed points *against which* individual inferences (readings) are judged within the practice. They are not themselves premises (readings) within the derivations.
  *   **The Tortoise Demands a Reading-shaped Calibration:** Asking for the rule as a premise is like demanding the standard weight be placed *on the balance it's calibrating*. It confuses the tool of measurement with the object being measured.
  *   **What is the Standard?** This is the crux:
      *   **For the Exam Board:** The standard is simply the *authorized syllabus rules in force*. It cares that the candidate uses *that* standard, not necessarily whether it's "true" in some abstract sense. Its authority comes from the institution, not metaphysics. The syllabus *is* the standard weight.
      *   **Philosophically:** The standard could be seen as:
          *   **Conventional:** The agreed-upon norms of the mathematical community (Wittgenstein, social constructivism).
          *   **Platonic:** Reflecting timeless, abstract logical relations (Gödel, Platonism).
          *   **Empirical:** Rules that have proven reliable for generating consistent/useful results (Quine, naturalism).
  *   **Should the Mark Scheme Care About Truth?** The *current scheme* primarily cares about **using the authorized standard correctly** (calibration procedure) and **getting results consistent with applying that standard** (accurate readings). Truth (in a strong correspondence sense) is an *aspiration* behind the syllabus design and accuracy marks, but not the *immediate criterion* for judging individual steps (method marks). The scheme prioritizes replicable *procedure* over abstract *truth* for practical assessment reasons.

  **Conclusion:** The marking practice presupposes a Wittgensteinian/"forms of life" view, tempered by heavy pragmatism. It prioritizes assessing trained competence in applying *authorized, conventional rules* within a specific mathematical practice. Truth enters primarily as a check on the final outcome (accuracy mark) and as the implicit goal of the syllabus design, but the *justification for individual steps* is grounded in conformity to the authorized practice, not in abstract truth-preservation or explicit meta-justification. Your calibration analogy is powerful: the rules *are* the exam board's standard weights. The mystery isn't relocated; the analogy reveals that the "standard" within the exam context is fundamentally institutional and conventional, even if we hope it aligns with deeper logical truths. The tension arises because the scheme tries to serve two masters: assessing procedural skill (method/follow-through) and correct outcomes (accuracy), using a standard (syllabus rules) whose deeper justification it deliberately leaves unexamined in the exam hall.
