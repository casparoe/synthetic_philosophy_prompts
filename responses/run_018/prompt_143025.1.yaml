  hey, longtime lurker on the rationalist forums. been trying to work through kierkegaards old essay about the press and the public (the one where he rants about newspapers turning people into an abstraction). there's a part where he distinguishes the crowd — people physically together — from the public, which he describes as kind of a mental monster made by the press: everyone gets opinions about everything but nobody actually has to stand behind any of it, so reflection replaces action and responsibility dissolves. he calls the public something like all and none at once.

  i'm stuck on what exactly he means by that. is he saying the public literally isn't anyone in particular, or that it's a collective with less moral weight than any individual? and here's the part i keep going back and forth alot: he seems to think the press manufactures this abstraction by giving people the illusion of participation without commitment. but if you replace newspapers with algorithmic feeds that split everyone into micro-audiences, does the critique still hold? there's no single press creating one unified public anymore, but you still get the same dynamic — people shouting opinions with no skin in the game — just distributed across a thousand bubbles.

  so first, can you help me understand the passage on its own terms: what's the actual logical structure of the crowd vs public distinction, and why does he think reflection without action is specifically dangerous? then, second, is extending this to fragmented algorithmic publics a fair move, or am i importing modern concerns he wouldn't recognize? i don't need citations, just want to see if the principle holds up when the medium changes.
