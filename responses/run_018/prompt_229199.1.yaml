prompt: |-
  I teach a mixed seminar of philosophy and econ majors, about 18 students, one 80-minute session, and I want to run the dollar auction live in class. But here's the catch: I don't want the standard party trick where everyone giggles at the sucker who paid $3.50 for a dollar and we all nod about how irrational people are. The thing I actually want them to wrestle with is a real disagreement about what the game shows. On one reading, escalation is a cognitive bug -- people can't ignore sunk costs, hate losing, get carried away. On the other reading, the trap is in the structure, not in the skull: at every single step, bidding again can be the locally rational move, and the disaster is produced by perfectly sane responses to perverse incentives. These diagnoses matter because the cures differ. If it's a bias, you teach people to cut their losses. If it's a trap, the lesson is to never sit down at the table in the first place, or to change the rules of the game.

  So design me the session with all of that built in. Specifically:

  1. The trap should spring on them before anyone names it. No lecture up front, don't say "dollar auction" or "sunk cost." Figure out how to set it up (maybe as one item in a series of normal auctions?) so they discover what they've walked into.

  2. Run the game at least twice with a rule change in between -- you could vary the stakes, switch from open outcry to sealed written bids, or toggle the rule that the runner-up also pays. The point of the variants is that afterwards students should be able to argue, from how their own behavior changed, which diagnosis it supports. Tell me which variations you think are most diagnostic and why.

  3. There should be real but small stakes so it stings a little. I can spend a few bucks of my own money, or use candy or participation points -- advise me on what works and what backfires.

  4. Game out the predictable failure modes: the one student who's read about this game and spoils it, a room that refuses to bid at all, two friends colluding to split the prize, the auction that ends in ten seconds. For each, tell me what to do in the moment and what it does to the debrief if it happens anyway.

  5. A debrief that maps concrete moments -- the first bid over half the prize, the point where losing the auction became worse than making the next bid -- onto the two diagnoses, and that pushes students to say which one fits what they actually felt. Also: where the literature genuinely disagrees about whether this game demonstrates irrationality or rational entrapment, flag that as contested. Don't let me present "it's the sunk cost fallacy" as settled science if it isn't.

  6. Finally, an honest note on what the activity can't reproduce about real escalation -- wars, strikes, lawsuit spirals, contracts you now can't afford to lose. No fixed prize, no announced end, face and careers on the line, and often no option to just not play. What does the facilitator have to supply by hand?

  Give me a timeline with rough minutes per phase, the exact rules as you'd read them aloud, and the debrief questions. And recieve my thanks in advance for not writing me a worksheet.
reasoning: |-
  Okay, let's tackle this professor's request. They want to run a dollar auction in class but avoid the typical "gotcha" moment where students just laugh at the loser. Instead, they want students to wrestle with the deeper question: is this failure due to cognitive biases or structural traps? 

  First, the setup needs to be sneaky. If I announce it's a dollar auction upfront, students might recognize it and either overthink or refuse to play. Maybe disguise it within a series of normal auctions? Start with a candy bar auction where highest bid wins - that feels safe. Then switch to the dollar auction without naming it, calling it a "special bonus round" to maintain surprise. 

  For stakes, actual money works best - even small amounts make it real. But using dollar bills might make students too cautious. Candy or tokens could work, but losing real money stings more. Maybe use quarters? Low enough that students will bid but high enough to feel the loss. 

  Now, the variations. Running it twice is crucial. First round: classic rules where both top two bidders pay. Second round: change to "only winner pays" to test if structure matters. If bids escalate less in the second round, that supports the structural trap theory. If they still escalate, bias theory gains weight. 

  Predicting problems: 
  - That one student who knows the game might blurt it out. Prepare a distraction: "Ah, someone's studied game theory! Let's see if knowing helps..." and keep moving. 
  - If no one bids, have a backup plan: auction something irresistible like bonus points. Or seed the first bid myself. 
  - Collusion between friends? Announce strict no-communication rules upfront. 
  - Auction ends too fast? Use multiple rounds or start with smaller increments. 

  Debrief is where the magic happens. Need questions that force students to relive their decisions: "When the bid hit 60 cents, what were you thinking?" Map moments where rational next steps led to collective disaster. Highlight the academic debate - Shubik says rational, Teger says irrational. Make them pick sides based on their own behavior. 

  Finally, acknowledge the limitations. Real escalation isn't about fixed prizes. Wars and lawsuits have unbounded costs and reputational stakes. I'll need to explicitly discuss how pride, uncertainty, and inability to quit change the game. 

  Timeline: 
  - 0-10 min: Candy auction (normal rules) 
  - 10-25 min: Dollar Auction Round 1 (both pay) 
  - 25-40 min: Dollar Auction Round 2 (only winner pays) 
  - 40-80 min: Debrief with specific questions about decision points 

  Rules script must be crystal clear but casual: "In this bonus round, highest bid wins the dollar, but the runner-up also pays their last bid without getting anything. Bids go up by 10 cents each time." 

  This should make the trap feel inevitable yet debatable - exactly what the professor wants. The variations create natural experiments, and the debrief forces cognitive vs structural comparison. Just need to stay nimble when (not if) students surprise me.
answer: |-
  Here’s a battle-tested session plan designed to force confrontation with the **cognitive bias vs. structural trap** debate, while avoiding the "party trick" pitfall. Total time: **80 minutes**.

  ---

  ### **Phase 1: Disguised Setup & First Auction (20 mins)**
  **Goal:** Spring the trap before naming it.  
  **Rules (Read Aloud):**  
  *“We’ll start with a quick series of auctions. First up: this* [*$5 Starbucks card/candy bar*] *goes to the highest bidder. Bidding starts at 10 cents, minimum 10-cent increments. Winner pays their bid. Ready? Begin!”*  

  **Process:**  
  - Run 1–2 normal auctions (e.g., candy bar, then a $1 bill). Students relax, learn mechanics.  
  - **TRAP SPRING:** Announce *“Final bonus auction: A crisp $1 bill. Same rules... with one twist. The* **two highest bidders** *both pay their final bids. Only the top bidder gets the dollar.”*  
    *(Do NOT explain sunk costs, name the game, or hint at escalation. Pause briefly.)*  
  - Use **physical currency** (quarters) or **participation points** (tracked publicly). *Why:* Real stakes (even symbolic) trigger loss aversion. Candy dilutes gravity.  
  - Auctioneer: **You**. Record bids visibly on the board.  

  ---

  ### **Phase 2: Second Auction with Rule Change (15 mins)**  
  **Goal:** Create behavioral contrast to fuel debate.  
  **Rule Change:** *“New round: Same $1 prize. Key difference —* **only the winner pays.** *The runner-up pays nothing. Bids start at 10 cents.”*  

  **Why this variation?**  
  - If bids **still escalate wildly**: Supports *cognitive bias* (people *can’t* quit despite reduced structural risk).  
  - If bids **stop near $1**: Supports *structural trap* (removing runner-up penalty defangs the trap).  
  - *Diagnostic Power:* Isolates the "bid to avoid loss" incentive.  

  ---

  ### **Phase 3: Structured Debrief (45 mins)**  
  **Goal:** Map lived experience to theories, highlight scholarly disagreement.  

  #### **Step 1: Reconstruct the Moment (15 mins)**  
  Ask:  
  1. *“In Round 1 (both pay), when did you first feel uneasy? Was there a ‘point of no return’?”*  
     → **Flag:** The bid exceeding $0.50 (where total payments exceed $1).  
  2. *“In Round 1, why did people keep bidding past $0.90? Was it to* win *or to* avoid losing *$0.90?”*  
     → **Highlight:** "Losing" means paying without winning. Escalation is locally rational ("I lose $0.90 if I quit, or risk $0.10 to win $1").  
  3. *“In Round 2 (only winner pays), why did bidding change? Did it feel less ‘trapped’?”*  

  #### **Step 2: The Core Debate (15 mins)**  
  Pose: *“Two stories explain the disaster in Round 1:  
  - **Story A:** It’s a flaw in *us*. We hate losing, fixate on sunk costs, get emotional.  
  - **Story B:** It’s a flaw in the *game*. Every bid can be rational alone, but the rules force a collective trap.*  

  *Which story fits your experience? Where did you feel ‘rational’? Where did you feel ‘swept away’?”*  

  **Contested Scholarship Spotlight:**  
  - *“Economist Martin Shubik (inventor) called this ‘rational folly’ — rational actors creating irrational outcomes.*  
  - *Psychologist Barry Teger argues it’s pure irrational escalation.*  
  - **Fact:** Lab studies show both forces operate. No consensus."  

  #### **Step 3: Implications & Limits (15 mins)**  
  Ask:  
  - *“If it’s a cognitive bug, what’s the fix?”* (Train willpower, ignore sunk costs).  
  - *“If it’s a structural trap, what’s the fix?”* (Refuse to play, change rules: e.g., cap bids, require winner to pay runner-up’s loss).  
  - *“Where does this game* fail *to capture real-world escalation (wars, lawsuits)?”*  
    → **Facilitator Notes:**  
    - Real traps have **no fixed prize** (costs unbounded).  
    - **No clear end** (unlike auction’s final bid).  
    - **Reputation/careers** on the line (not just money).  
    - **Inability to “not play”** (e.g., conscription, mandatory litigation).  
    - *“You must supply these stakes through discussion: ‘Imagine this was your company’s lawsuit, or your draft number…’”*  

  ---

  ### **Predictable Fail-Safes & Live Fixes**  
  | Failure Mode              | In-the-Moment Fix                          | Debrief Spin (If Happens)                     |  
  |---------------------------|--------------------------------------------|-----------------------------------------------|  
  | **Student spoils game**   | *“Ah, a game theorist! Let’s see if* knowing *changes behavior.”* Proceed. | Contrast their bids vs. peers’. Did “knowing” help? |  
  | **No one bids**           | Seed first bid: *“I’ll bid 10 cents for team A... Team B?”* Or use bonus points. | Discuss why they refused: Instinctive trap-avoidance? |  
  | **Collusion**             | *“No communication during bids.”* Enforce strictly. | “Collusion is a structural fix! But often illegal IRL.” |  
  | **Auction ends too fast** | Run multiple mini-auctions (e.g., 3 groups of 6). | Compare outcomes: Did groups learn? Was variance high? |  

  ---

  ### **Stakes Recommendation**  
  - **Best:** **Quarters** (real money, low but tangible). Start each student with 4 quarters ($1). They keep unspent coins.  
  - **Backup:** **Participation points** (1 pt = 0.5% final grade). Track publicly. *Avoid candy* — it trivializes loss.  

  ---

  ### **Timeline**  
  - **0-5 mins:** Normal auction (candy bar).  
  - **5-15 mins:** Normal auction ($1 bill, winner pays only).  
  - **15-25 mins:** **TRAP AUCTION** ($1, both top bidders pay).  
  - **25-30 mins:** Reset, explain Round 2 rules.  
  - **30-40 mins:** Round 2 auction ($1, winner pays only).  
  - **40-80 mins:** **Debrief** (as above).  

  ---

  **Final Script Snippet (Trap Round):**  
  *“Bonus round: This dollar goes to the highest bidder. But — both the winner* and *the runner-up will pay their final bids from their own pockets. Only the top bidder gets the dollar. Start at 10 cents. Bid when I point to you. Jane?”*  

  **Outcome:** By Round 1, students *feel* the trap. Round 2 creates dissonance. The debrief ties lived tension to competing theories, exposing the literature’s unresolved conflict. You’ve made the trap visceral, not just intellectual.
