     **Crux 4: The Moore-paradoxical assertion**
     - *Case*: Daisy asserts, "It is raining but I do not know that it is raining".
     - *KN prediction*: This assertion is improper because the speaker is asserting something (that it is raining) which, by her own admission, she does not know. This violates the knowledge norm. Moreover, the assertion is paradoxical because it is self-undermining.
     - *TN prediction*: This assertion is improper because the second conjunct ("I do not know that it is raining") makes the assertion self-defeating in a way that violates conversational norms. However, if the first conjunct is true, then the norm of assertion (truth) is satisfied for that part. The overall assertion is problematic because it is likely to be false (if the first conjunct is true, then the second conjunct is false, so the whole conjunction is false) and because it is paradoxical. But TN would say that if the whole assertion were true (i.e., if it were both raining and the speaker did not know it), then the norm of assertion would not be violated. However, such an assertion would be very odd and potentially violate other norms.
     - *Bearing on disagreement*: KN sees this as a direct violation of the knowledge norm. TN must explain the impropriety without appealing to a knowledge norm. TN might argue that the assertion is improper because it is self-contradictory in spirit (and in fact, if the first conjunct is true, the second is false, so the whole assertion is false) and thus violates the truth norm. However, if we consider a scenario where the whole assertion is true (i.e., it is raining and the speaker does not know it), then TN would say the assertion is proper with respect to the truth norm. But that scenario is impossible because if the speaker is asserting the conjunction, then by the lights of TN, if it is true, it must be that she does not know it, but she is asserting it so she must believe it. This is a complex case. We note that both parties agree that the utterance is improper, but they disagree on why.

     We note that the Moore case is complex and both parties might need to adjust their explanations. However, the core disagreement remains: KN says that the assertion of the first conjunct requires knowledge, which the speaker admits she lacks, so it violates the norm. TN says that the norm of assertion only requires truth, and if the whole assertion were true it would be okay, but it cannot be true because if the first conjunct is true then the speaker is representing that she knows it (by the act of assertion) and so the second conjunct is false.

     However, to avoid complicating the joint statement, we might focus on the other three cases for clarity.

  Given the above, we now write the joint statement in British English, as a document both parties can sign.

