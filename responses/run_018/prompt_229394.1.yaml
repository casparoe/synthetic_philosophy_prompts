  We are producing a joint statement from two parties: one endorsing a knowledge norm for assertion (KN) and the other endorsing a truth norm (TN). The goal is to clarify agreements, the exact disagreement, and the cruxes with concrete cases.

  1. **List of agreed claims**: Both parties accept the following, stated non-vacuously:

     1. Assertion is a distinct speech act, governed by a constitutive rule that sets standards for its proper performance.
     2. Assertions can be assessed as correct or incorrect, and such assessment is governed by the norm of assertion.
     3. An assertion that p is incorrect (in the sense of violating the norm of assertion) if p is false.
     4. An assertion that p is correct (in the sense of satisfying the norm of assertion) only if p is true.
     5. There are other norms (e.g., moral, prudential, conversational) that may bear on the overall propriety of an assertion, and an assertion can be improper for reasons beyond the norm of assertion (e.g., being misleading, unkind, or imprudent).
     6. Speakers can be blameless for making an assertion that violates the norm of assertion (e.g., due to misleading evidence) and blameworthy for making an assertion that satisfies the norm of assertion (e.g., if they violate another norm).
     7. The norm of assertion is distinct from the norms governing other speech acts (e.g., questions, commands).

     These claims are non-vacuous and neither party would weaken them.

  2. **Residual disagreement**:

     The core disagreement concerns the exact content of the constitutive norm of assertion. Both parties agree that the norm must account for the correctness conditions and the conditions under which an assertion is improper (in the sense of violating the norm of assertion). However, they disagree on whether the norm requires knowledge or merely truth.

     - The knowledge-norm party (KN) holds: 
       "The distinctive rule of assertion is that one must: assert that p only if one knows that p."

     - The truth-norm party (TN) holds: 
       "The distinctive rule of assertion is that one must not: assert that p if p is false. Any further criticism of an assertion (e.g., as reckless, unsupported, or lucky) does not stem from the norm of assertion itself but from other norms or conversational standards."

     Clarifications: 
     - Both parties agree that the norm of assertion is the rule that is constitutive of the act of asserting. 
     - The disagreement is not about whether knowledge is often present in good assertions or whether it is a good thing to have; it is about whether knowledge is required by the very rule that defines assertion.
     - The disagreement is also not about whether there are other norms that might require knowledge or more than truth; it is about the rule that is distinctive to assertion.

     We have dissolved some apparent disputes by clarifying:
     - Both parties agree that an assertion can be improper for reasons other than violating the norm of assertion (e.g., being rude). 
     - Both parties agree that a false assertion is always a violation of the norm of assertion (so KN agrees with TN that truth is necessary). 
     - Both parties agree that a true assertion can be improper for reasons not stemming from the norm of assertion (e.g., if it is unkind). 
     - The dispute is only about whether the norm of assertion itself requires knowledge (so that an assertion that is true but not known is a violation of the norm of assertion) or whether the norm of assertion only forbids falsehood (so that a true assertion, even if not known, does not violate the norm of assertion, though it might violate other norms).

  3. **Cruxes and concrete cases**:

     We identify the following cruxes. For each, we describe a concrete case, state what each party predicts about the case, and explain how it bears on the disagreement.

     **Crux 1: The lottery case**
     - *Case*: Alice has bought a single ticket in a fair lottery with one million tickets. She asserts, "My ticket is a loser", based solely on the odds. In fact, her ticket is a loser.
     - *KN prediction*: Alice's assertion is improper because she does not know that her ticket is a loser (she only has probabilistic grounds). The norm of assertion is violated.
     - *TN prediction*: Alice's assertion is not improper with respect to the norm of assertion because it is true. However, it might be criticised as rash or unsupported, but this criticism comes from other norms (e.g., epistemic norms of belief or conversational norms) and not from the norm of assertion itself.
     - *Bearing on disagreement*: KN says this case shows that truth is insufficient for proper assertion; knowledge is required. TN says this case shows that the assertion is proper with respect to the norm of assertion, and any criticism is due to other norms.

     **Crux 2: The Gettiered assertion**
     - *Case*: Bob is in an office with a clock that has been stuck at 3:00 for days. Bob looks at the clock at exactly 3:00 and it reads 3:00. He asserts, "It is 3:00 now". His belief is true (it is 3:00) and justified (the clock has been reliable in the past, though unbeknownst to Bob it is now stuck), but it is not knowledge (because the clock is stuck and he is only right by luck).
     - *KN prediction*: Bob's assertion is improper because he does not know that it is 3:00. The norm of assertion is violated.
     - *TN prediction*: Bob's assertion is not improper with respect to the norm of assertion because it is true. However, it might be criticised as based on bad evidence or lucky, but this criticism is due to other norms (e.g., norms of belief or justification) and not the norm of assertion.
     - *Bearing on disagreement*: This tests whether a true but luckily true assertion (Gettier case) violates the norm of assertion.

     **Crux 3: The blamelessly ignorant speaker**
     - *Case*: Charlie is in a room with no windows. He has been told by a generally reliable but occasionally mischievous friend that it is raining outside. In fact, it is raining. However, Charlie's friend was lying on this occasion and Charlie has no other evidence. Unbeknownst to Charlie, it is raining. Charlie asserts, "It is raining outside".
     - *KN prediction*: Charlie's assertion is improper because he does not know it is raining (his belief is based on a lie, so it is not knowledge). However, Charlie is blameless because he has been misled and has no reason to doubt the friend. The violation of the norm of assertion does not imply blameworthiness.
     - *TN prediction*: Charlie's assertion is not improper with respect to the norm of assertion because it is true. The fact that he was blamelessly misled does not make his assertion violate the norm of assertion. Any criticism of his evidence or basis is about his belief, not about the assertion per se.
