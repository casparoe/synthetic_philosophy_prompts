  **Joint Statement on the Norm of Assertion**

  We, the undersigned, representing two positions in the debate over the norm of assertion, have engaged in a year-long adversarial collaboration. Our goal is to clarify both our points of agreement and the exact nature of our disagreement. We present here a statement that both parties endorse as a fair representation of the current state of the debate.

  **1. Agreed Claims**

  We both accept the following claims about assertion, which we state without weakening or hedging:

     1. Assertion is a distinct type of speech act, characterised by a constitutive rule that sets the standard for its proper performance.
     2. This constitutive rule, the norm of assertion, provides the primary standard by which assertions are assessed as correct or incorrect.
     3. An assertion that p is incorrect (i.e., violates the norm of assertion) if p is false.
     4. An assertion that p is correct (i.e., satisfies the norm of assertion) only if p is true.
     5. There are other norms (e.g., moral, prudential, epistemic, and conversational) that bear on the overall propriety of an assertion. An assertion may be improper for reasons independent of the norm of assertion, such as being unkind, imprudent, or misleading.
     6. A speaker can be blameless for making an assertion that violates the norm of assertion (e.g., when the speaker has been misled by misleading evidence) and blameworthy for making an assertion that satisfies the norm of assertion (e.g., when the assertion violates another norm).
     7. The norm of assertion is distinct from the norms governing other speech acts, such as asking a question or issuing a command.

  **2. The Residual Disagreement**

  Our disagreement concerns the exact content of the constitutive rule of assertion. We agree that the rule must account for the conditions under which an assertion is correct or incorrect. However, we disagree on whether the rule requires knowledge or merely truth.

  - The knowledge-norm party (KN) holds: 
    "The distinctive rule of assertion is that one must: assert that p only if one knows that p."

  - The truth-norm party (TN) holds: 
    "The distinctive rule of assertion is that one must not: assert that p if p is false. Any further criticism of an assertion (e.g., as reckless, evidentially unsupported, or objectionably lucky) is best traced to norms other than the norm of assertion itself, such as norms of belief, evidence, or conversation."

  We have clarified that:

  - The disagreement is not about whether knowledge is desirable or typically present in good assertions. Both parties agree that knowledge is often present and is a valuable state.
  - The disagreement is not about whether there are other norms that might require knowledge or more than truth. Both parties agree that there may be such norms.
  - The disagreement is solely about the rule that is constitutive of the speech act of assertion. KN holds that this rule requires knowledge, while TN holds that it requires only truth.

  We have dissolved the following misunderstandings:

  - TN does not hold that any true assertion is fine all-things-considered. TN agrees that true assertions can be improper for other reasons (e.g., being unkind).
  - KN does not hold that every assertion falling short of knowledge is blameworthy. KN agrees that a speaker may be blameless for asserting without knowledge (e.g., when in a Gettier case).

  **3. Cruxes**

  We have identified several cruxes that would help resolve our disagreement. For each crux, we describe a concrete case, state what each party predicts about the case, and note how the case bears on the disagreement.

  *Crux 1: The Lottery Case*

  - *Case*: Alice holds one ticket in a fair lottery of one million tickets. She asserts, "My ticket has lost", based solely on the odds. As it happens, her ticket has indeed lost.
  - *KN prediction*: Alice’s assertion violates the norm of assertion because she does not know that her ticket has lost (she only has probabilistic grounds).
  - *TN prediction*: Alice’s assertion does not violate the norm of assertion because it is true. Any criticism of her assertion as rash or unsupported stems from other norms (e.g., norms of belief) and not from the norm of assertion.
  - *Bearing*: This case tests whether a true assertion based on statistical evidence alone can satisfy the norm of assertion.

  *Crux 2: The Gettiered Assertion*

  - *Case*: Bob is in an office with a clock that has been stuck at 3:00 for two days. At exactly 3:00, Bob looks at the clock and it shows 3:00. He asserts, "It is 3:00 now". Bob’s belief is true and justified, but it is not knowledge because the clock is stuck and he is right only by luck.
  - *KN prediction*: Bob’s assertion violates the norm of assertion because he does not know that it is 3:00.
  - *TN prediction*: Bob’s assertion does not violate the norm of assertion because it is true. Any criticism of his assertion as lucky or based on bad evidence comes from other norms (e.g., norms of justification) and not from the norm of assertion.
  - *Bearing*: This case tests whether a true assertion that is justified but not knowledge (due to luck) violates the norm of assertion.

  *Crux 3: The Blamelessly Misled Speaker*

  - *Case*: Charlie is in a room with no windows. A generally reliable but occasionally mischievous friend tells him, "It is raining outside". Charlie has no reason to doubt the friend and asserts, "It is raining outside". Unbeknownst to Charlie, the friend was lying this time, but it is actually raining.
  - *KN prediction*: Charlie’s assertion violates the norm of assertion because he does not know that it is raining (his belief is based on a lie). However, Charlie is blameless because he has been misled.
  - *TN prediction*: Charlie’s assertion does not violate the norm of assertion because it is true. The fact that Charlie was misled does not make his assertion violate the norm of assertion, though it might violate other norms (e.g., norms about having good evidence for belief).
  - *Bearing*: This case tests whether a true assertion made without knowledge (due to being based on a falsehood) violates the norm of assertion, and the relationship between blamelessness and the norm.

  *Crux 4: The Moorean Assertion*

  - *Case*: Daisy asserts, "It is raining but I do not know that it is raining".
  - *KN prediction*: Daisy’s assertion violates the knowledge norm because she is asserting that it is raining while admitting she does not know it. This makes the assertion self-undermining and improper by the norm of assertion.
