answer: |-
  ### Joint Statement on the Norm of Assertion

  We, the undersigned representatives of the knowledge-norm (KN) and truth-norm (TN) parties, having engaged in a year-long adversarial collaboration, hereby present a jointly endorsed statement of our agreements, residual disagreement, and key cruxes. This document clarifies our positions without adjudication, preserves the integrity of each view, and sharpens the dispute for further investigation.  

  ---

  ### 1. Agreed Claims  
  Both parties accept the following non-vacuous claims about assertion. Neither seeks to weaken or hedge these statements:  

  1. **Assertion is rule-governed**: Assertion is a distinct speech act defined by a constitutive rule that sets standards for its propriety.  
  2. **Truth is necessary for correctness**: An assertion that *p* is incorrect (violates the norm of assertion) if *p* is false.  
  3. **Blame and propriety come apart**: An assertion may be blameless yet violate the norm of assertion (e.g., due to misleading evidence), and an assertion may satisfy the norm yet be blameworthy (e.g., if it breaches other norms).  
  4. **Multiple norms apply**: Criticism of an assertion as reckless, unkind, imprudent, or irrational may stem from norms distinct from the norm of assertion (e.g., moral, pragmatic, or epistemic norms governing belief or conversation).  
  5. **No entailment to overall propriety**: Satisfying the norm of assertion does not entail that an assertion is permissible all-things-considered; conversely, violating it does not entail that the assertion is impermissible all-things-considered.  
  6. **Paradigm cases align**: In paradigm cases of proper assertion (e.g., asserting a known truth) and improper assertion (e.g., asserting a known falsehood), our norms converge in verdict.  

  ---

  ### 2. Residual Disagreement  
  Our core disagreement concerns the *distinctive rule* governing assertion. After clarifying notions like "norm of assertion," "entitlement," and "impropriety," we agree that the dispute is not about whether other norms exist, whether knowledge is valuable, or whether truth is necessary. The residual disagreement is solely about the **content of the constitutive rule** of assertion:  

  - **KN position (fair statement)**:  
    "The distinctive rule of assertion permits asserting that *p* only if one knows that *p*. Assertions failing this condition violate the norm of assertion, irrespective of truth or blamelessness."  

  - **TN position (fair statement)**:  
    "The distinctive rule of assertion forbids only asserting what is false. Assertions satisfying this condition do not violate the norm of assertion, even if criticised as reckless, unsupported, or lucky; such criticism reflects other norms."  

  **Clarified non-disputes**:  
  - Both agree that truth is necessary for proper assertion (KN accepts this via knowledge’s factivity).  
  - Both agree that knowledge is sufficient for proper assertion (TN accepts this as a subset of true assertions).  
  - Both reject caricatures: KN denies that non-knowledge assertions are always blameworthy; TN denies that true assertions are always all-things-considered permissible.  
  - Disputes dissolved include:  
    - Whether "impropriety" implies blame (both deny this).  
    - Whether the norm must explain all criticism of assertion (both agree it need not; other norms exist).  
    - Whether assertion requires justification (KN ties this to knowledge; TN sees it as external to the norm).  

  The **exact disagreement** is:  
  > *Must the rule of assertion itself prohibit assertions that are true but not known (e.g., Gettiered, lottery-based, or luckily true assertions), or does it only prohibit false assertions?*  

  ---

  ### 3. Cruxes  
  We identify the following cruxes. For each, we specify a concrete case both parties accept as relevant, record each party’s prediction, and state how settling the case would move the debate.  

  #### Crux 1: Lottery Assertions  
  - **Case**:  
    Alice buys a single ticket in a fair, million-ticket lottery. Based solely on the odds, she asserts, "My ticket has lost." Unbeknownst to her, the ticket has indeed lost.  
  - **KN prediction**:  
    The assertion violates the norm of assertion. It is improper (though blameless) because Alice lacks knowledge; the odds do not suffice for knowledge.  
  - **TN prediction**:  
    The assertion satisfies the norm of assertion (it is true). Criticism of it as "reckless" reflects epistemic or conversational norms, not the norm of assertion.  
  - **Settlement impact**:  
    If the assertion is deemed proper *only* if knowledge is present, KN is vindicated. If it is deemed proper *despite* lacking knowledge, TN is vindicated.  

  #### Crux 2: Gettiered Assertions  
  - **Case**:  
    Bob sees a stopped clock that reads 3:00. It is in fact 3:00, but the clock stopped 12 hours ago. Bob asserts, "It is 3:00 now," based on the clock’s reading.  
  - **KN prediction**:  
    The assertion violates the norm of assertion. Bob’s true belief is Gettiered; he does not know it is 3:00.  
  - **TN prediction**:  
    The assertion satisfies the norm of assertion (it is true). Criticism of it as "objectionably lucky" stems from norms of belief, not assertion.  
  - **Settlement impact**:  
    If Gettiered assertions violate the norm, KN gains support. If they do not, TN gains support.  

  #### Crux 3: Blamelessly Misled Assertions  
  - **Case**:  
    Charlie is in a windowless room. A trusted (but secretly deceptive) colleague says, "The meeting is at 4:00." Charlie asserts, "The meeting is at 4:00." Unbeknownst to Charlie, the meeting *is* at 4:00, but the colleague intended to deceive him.  
  - **KN prediction**:  
    The assertion violates the norm of assertion. Charlie lacks knowledge (his belief is based on a lie), though he is blameless.  
  - **TN prediction**:  
    The assertion satisfies the norm of assertion (it is true). Blame for relying on a liar applies to Charlie’s belief, not his assertion.  
  - **Settlement impact**:  
    If blamelessly misled true assertions violate the norm, KN is strengthened. If they satisfy it, TN is strengthened.  

  #### Crux 4: Moorean Assertions  
  - **Case**:  
    Daisy assertively utters, "It is raining, but I do not know that it is raining." It is, in fact, raining.  
  - **KN prediction**:  
    The assertion violates the norm of assertion. The first conjunct requires knowledge, which the second conjunct denies.  
  - **TN prediction**:  
    The assertion violates the norm of assertion *only if false*. Here, it is false (if it is raining, Daisy *does* know it by asserting it), so it violates the truth norm. If it were true, it would satisfy the norm.  
  - **Settlement impact**:  
    If the impropriety of true Moorean assertions (should they exist) traces to the norm of assertion, KN gains ground. If it solely depends on falsity or pragmatic factors, TN gains ground.  

  ---  
  This statement represents our shared understanding. We commit to testing these cruxes empirically and conceptually, without presupposing the outcome.  

  Signed,  
  **The Knowledge-Norm Party**  
  **The Truth-Norm Party**  

  ---  
