answer: |-
  Here’s a decision tree taxonomy for the integrity objection, structured with concrete questions to sort positions by their commitments rather than labels. Branches are mutually exclusive, and leaves capture key views with their "awkward commitments" (AC).  

  ### Decision Tree: Taxonomy of the Integrity Objection  
  **Start:**  
  **Q1: Is the core problem about the *actual reasoning process* during action (e.g., moral calculus in the moment), or about how we *describe/justify motives* after the fact?**  
  - **Branch A: About actual reasoning** → Go to Q2  
  - **Branch B: About describing/justifying motives** → Go to Q5  

  ---

  #### **Branch A: Problem is about actual reasoning**  
  **Q2: Does the objection *only* apply to close personal relationships (e.g., spouse), or *also* to institutional roles (e.g., doctor/judge)?**  
  - **Branch A1: Only close relationships** → Go to Q3  
  - **Branch A2: Also institutional roles** → Go to Q4  

  **Q3 (Close relationships only): Can a utilitarian "fix" this by separating levels of reasoning (e.g., cultivating spontaneous motives but justifying rules indirectly)?**  
  - **No**: → **Leaf 1: Strict Williamsian**  
    - **Description**: Any conscious appeal to impartial justification (even as backup) corrupts the motive. Saving a spouse "because it’s my spouse" must exclude moral calculus.  
    - **AC**: Rejects *all* impartial justifications in personal acts—even if they’d validate the act.  
  - **Yes**: → **Leaf 2: Two-Level Utilitarian (Personal)**  
    - **Description**: We train ourselves to act spontaneously in close relationships, but indirectly justify this via utilitarian rules (e.g., "society benefits from strong families").  
    - **AC**: The "authentic" motive is psychologically engineered—integrity is a useful illusion.  

  **Q4 (Institutional roles included): Does separating levels of reasoning *resolve* the problem for institutions, or just push it "upstairs"?**  
  - **Resolves it**: → **Leaf 3: Institutional Separationist**  
    - **Description**: Personal relationships demand non-calculative motives; institutions *require* calculative reasoning (e.g., triage, sentencing). No conflict.  
    - **AC**: Institutions can *never* exhibit true integrity—they’re inherently "alienated."  
  - **Pushes it upstairs**: → **Leaf 4: Systemic Williamsian**  
    - **Description**: Even institutional acts (e.g., a judge showing mercy) lose integrity if justified by system-level utility. The problem recurs at the institutional level.  
    - **AC**: Institutions are *incapable* of moral integrity—only individuals in non-role contexts can have it.  

  ---

  #### **Branch B: Problem is about describing motives**  
  **Q5: Is the mistake framing motives in *impersonal terms* (e.g., "duty"), or assuming motives must be *generic/repeatable*?**  
  - **Impersonal framing**: → **Leaf 5: Motive Particularist**  
    - **Description**: The "one thought too many" objection arises when we reductively describe motives (e.g., "I saved her because she’s my wife" vs. "because of spousal duty").  
    - **AC**: Motives are irreducibly context-specific—no general moral language captures them faithfully.  
  - **Generic motives**: → **Leaf 6: Anti-Theorist**  
    - **Description**: Moral theory forces motives into universalizable categories, destroying the particularity of commitments (e.g., loving *this* person).  
    - **AC**: Moral philosophy *as such* distorts practical reasoning.  

  ---

  ### Unnamed Combo & Notes:  
  - **Hybrid View (A1 → Q3 Yes + A2 → Q4 Yes)**: Combines **Leaf 2 (Two-Level Personal)** and **Leaf 3 (Institutional Separationist)**.  
    - **AC**: Personal integrity and institutional efficiency are incommensurable values.  

  ### Flagged Collapse:  
  - **Institutional Separationist (Leaf 3) vs. Two-Level Utilitarian (Leaf 2)**  
    - **Collapse Point**: At the institutional level (*Q4*), both endorse calculative reasoning. The difference is purely *scope*:  
      - **Separationist**: Strictly *denies* integrity applies to institutions.  
      - **Two-Level**: May *extend* the two-level model to institutions (e.g., judges cultivate "merciful disposition" backed by systemic utility).  
    - **Tree Limitation**: If a theorist answers *Q4* with "resolves it," the tree *cannot* distinguish whether they are Separationist (integrity doesn’t apply) or Two-Level (integrity is engineered). Requires follow-up: *"Can institutional actors have genuine integrity (e.g., a judge’s compassion)?"* → No = Separationist; Yes = Two-Level.  

  ### Key Features:  
  - **Concrete Questions**: Avoids labels (e.g., "Would criticizing a doctor for *not* triaging via calculation misunderstand their role?" → Isolates Leaf 3/4).  
  - **Awkward Commitments**: Highlights trade-offs (e.g., Leaf 1’s rejection of *any* backup justification).  
  - **Exhaustive**: Captures Williams, rule-utilitarians, institutionalists, particularists, and anti-theorists.  

  This taxonomy forces engagement with the *structure* of the objection, revealing philosophical stakes through dilemmas rather than doctrines.
