answer: |-
  ### **"Ontology Negotiation Challenge" - 70-Min Classroom Activity**  
  **Goal:** Experience verbal disputes (merely linguistic) vs. real metaphysical disagreements through a co-op charter drafting game.  

  ---

  #### **Materials**  
  - 4 sealed **"Sparse Manual"** envelopes (red sticker).  
  - 4 sealed **"Abundant Manual"** envelopes (blue sticker).  
  - Charter templates (paper/digital).  
  - Timer, whiteboard for points.  

  ---

  #### **Setup (5 min)**  
  1. **Pairs:** Split 8 students into 4 pairs.  
  2. **Secret Manuals:** Give each pair one **Sparse Manual** and one **Abundant Manual** (each student gets one; *do not share!*).  
  3. **Roles (per pair):**  
     - **Draftsperson:** Writes clauses.  
     - **Skeptic:** Challenges wording using their manual.  
     - *(After 15 min, roles swap; Skeptic becomes Mediator to find compromises)*.  
  4. **Task:** Draft 3 articles for a **"Green Roof Co-op"** charter:  
     - **Article 1 (Liability):** Who/what owes damages for a collapsed roof?  
     - **Article 2 (Risk):** How to quantify "30% chance of project failure"?  
     - **Article 3 (Membership):** Can "corporate entities" (e.g., LLCs) join?  
  5. **Payoffs:**  
     - Internally consistent charter = 10 funding points.  
     - Each contradiction exposed = -3 points.  

  ---

  #### **Hidden Manuals**  
  *(Students open privately; instructor keeps extras to avoid confusion)*  
  - **Sparse Manual (Concrete-Only):**  
    > *"Only concrete entities exist: physical people, buildings, signed contracts. Reject ‘corporate persons,’ ‘probabilities,’ or ‘modal properties’ as real. Demand rephrasing (e.g., ‘members owe damages,’ not ‘the co-op owes’)."*  

  - **Abundant Manual (Expanded Ontology):**  
    > *"Corporate persons, objective probabilities, and modal properties are real. Insist clauses reflect this (e.g., ‘the co-op itself is liable,’ ‘30% chance exists’)."*  

  ---

  #### **Phase 1: Drafting & Disputes (30 min)**  
  - **0-15 min:** Pairs draft Articles 1–3. *Predictable conflict starters:*  
    - *Sparse:* "The *members* must pay damages, not the co-op—it’s not real!"  
    - *Abundant:* "Nonsense! The *co-op itself* bears liability. It’s a legal person!"  
    - *Sparse:* "There’s no ‘30% chance’—just our ignorance! Say ‘based on past data.’"  
    - *Abundant:* "The chance is *real*—put it in writing!"  
  - **15-30 min:** **Role Swap** → Skeptic becomes **Mediator**. Focus shifts:  
    - *Mediator task:* "How can we phrase this so both manuals *accept* the outcome without endorsing the ontology?"  
    - *E.g.,* "The co-op’s treasury (managed by members) covers damages" → dodges existence-claims.  

  ---

  #### **Phase 2: Cross-Examination (15 min)**  
  - Pairs swap charters with another pair.  
  - **Task:** Find contradictions for -3 points each (e.g., "Article 1 says ‘the co-op owes,’ but Article 3 implies it’s not real!").  
  - **Scoring:** Instructor tallies points on board.  

  ---

  #### **Debrief (15 min)**  
  **Guided Discussion:**  
  1. **"What felt like a substantive disagreement?"**  
     - *E.g., "We fought over whether the co-op *really* exists or just the members!"*  
  2. **"When did you realize you agreed on outcomes?"**  
     - *E.g., "We both wanted damages paid... we just rewrote clauses 5 times!"*  
  3. **Map to Philosophers:**  
     - **Carnap:** Disputes were **external** (framework choice: "Do we *adopt* a ‘corporate person’ language?"), not **internal** (facts within a framework).  
     - **Sider:** Did your clauses "carve reality at the joints"? Sparse users demanded *fundamental* terms (people/buildings); abundant users included *non-fundamental* but useful terms (corporate persons).  
  4. **Limitation of the Game:**  
     - *"This didn’t replicate the **pragmatic freedom** of choosing frameworks. IRL, we’d explicitly negotiate linguistic rules (e.g., ‘For this charter, let’s *pretend* probabilities exist’). Here, manuals were forced on you—that’s the bit metaontological deflationism explains best!"*  

  ---

  #### **Predictable First-Run Issues**  
  1. **"Compromise too fast!"**  
     - Pairs avoid conflict by using vague language (*e.g., "relevant parties owe damages"*) → no ontology dispute felt. *Fix:* Remind Skeptics: "Challenge every existence-claim!"  
  2. **"Manual leaks!"**  
     - Students peek at partner’s manual → ruins the "talking past" effect. *Fix:* "Manual-sharing = -10 points!"  
  3. **"Mediator ignores ontology!"**  
     - Focus shifts to legalities, not metaphysics. *Fix:* "Mediators must flag *every* ‘exists’ or ‘real’ claim."  
  4. **Time crunch:** Drafting runs long. *Fix:* Use countdown timers per article.  

  ---

  #### **Instructor Notes**  
  - **Casual Vibe:** Use humor (*"No fistfights over modal properties!"*). Embrace typos (*"Risk Managment" on template*).  
  - **Key Insight:** The slide from "real disagreement" to "wait, we mean the same thing!" should feel frustrating/illuminating.  
  - **Follow-up:** Next lecture: How Carnap/Sider resolve this (linguistic frameworks vs. structural realism).  

  **Why it works:** Students *live* the ontology dispute, then debrief reveals it was verbal all along. The payoff scheme forces clarity, and role-swaps escalate tension to mediation—mirroring philosophical progress.
