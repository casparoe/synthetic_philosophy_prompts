  **END-USER LICENSE AGREEMENT FOR DISCURSUS PLATFORM (v.3.14.15)**

  **1. Definitions.** "Platform" means the Discursus software, interfaces, servers, and related services enabling direct-democratic judgment aggregation. "User" means any individual or entity accessing or utilizing the Platform. "Policy Proposition" means a discrete statement submitted for collective judgment. "Policy Chain" means a set of interdependent Policy Propositions logically linked such that judgments on certain propositions (Premises) constrain permissible judgments on others (Conclusions). "Premise Module" means the separable data unit representing a User's individual judgment on a single Policy Proposition within a Chain. "Collective Output" means the aggregation of individual judgments into a Platform-determined result for a Policy Proposition or Chain. "Reflective Equilibrium Toggle" (RET) means the feature permitting Users to revise judgments on designated Premise Propositions after observing associated Collective Outputs.

  **2. Grant of License.** Subject to strict compliance with this Agreement, Licensor grants User a limited, non-exclusive, revocable, non-transferable license to access the Platform solely for the purpose of casting judgments on Policy Propositions and observing Collective Outputs.

  **3. Judgment Aggregation Methods.**
      **3.1** The Platform aggregates judgments using both Premise-Based Aggregation (determining Collective Outputs for each Policy Proposition independently) and Conclusion-Based Aggregation (determining Collective Outputs for Conclusions based solely on votes for that Conclusion, irrespective of Premise judgments). The selection of method for any given Chain is determined algorithmically by the Platform and is non-negotiable.
      **3.2** Users acknowledge that path dependency inherent in sequential balloting may lead to materially different Collective Outputs depending on the order propositions are presented, and accept this as an inherent characteristic of the service.

  **4. User Obligations & Voting Mechanics.**
      **4.1** Users must exercise independent judgment on each Policy Proposition presented. Strategic manipulation of Premise judgments with the intent to influence downstream Conclusions in a manner inconsistent with the User's actual beliefs ("Premise Gaming") is expressly prohibited and constitutes a material breach.
      **4.2** Users utilizing the Reflective Equilibrium Toggle (RET) to revise a prior judgment on a Premise Proposition acknowledge that such revision may generate logical contradictions with Collective Outputs elsewhere in the Policy Chain.
      **4.3** If a revision made via the RET triggers a logical contradiction within the Platform's integrity verification system, a "Consistency Refund" will be automatically initiated. This process nullifies the revised judgment and the associated Collective Output(s) impacted by the contradiction, reverting to the pre-revision state. No monetary or service credit is implied by the term "Refund."

  **5. Collective Rationality Warranty & Disclaimers.**
      **5.1** Licensor warrants that the Platform's algorithms are designed to prioritize logical consistency across interdependent Policy Chains where technologically feasible under the selected aggregation method.
      **5.2** NOTWITHSTANDING SECTION 5.1, LICENSOR EXPRESSLY DISCLAIMS ALL WARRANTIES AND LIABILITY FOR ANY COLLECTIVE OUTPUT DEEMED "IRRATIONAL" BY THE PLATFORM'S INTERNAL CONSISTENCY CHECKS, INCLUDING BUT NOT LIMITED TO: LOGICAL CONTRADICTIONS ARISING FROM AGGREGATED JUDGMENTS (E.G., MAJORITY ENDORSEMENT OF PREMISES LEADING TO MINORITY REJECTION OF A LOGICAL CONCLUSION, OR VICE VERSA), OUTPUTS RESULTING FROM PATH DEPENDENCY, OR OUTPUTS RESULTING FROM PERMISSIBLE USE OF THE RET. THE EXISTENCE OF AN IRRATIONAL COLLECTIVE OUTPUT SHALL NOT BE CONSIDERED A FAILURE OF THE SERVICE.

  **6. Logical Dispute Arbitration.**
      **6.1** Any dispute arising from perceived logical inconsistencies in a Collective Output ("Logical Dispute") shall be resolved exclusively through binding arbitration administered by the Platform's Automated Arbitration Module (AAM).
      **6.2** The AAM shall adjudicate Logical Disputes solely based on formal logical validity under the rules of Boolean algebra applied to the aggregated Premise Modules, irrespective of the numerical majority supporting any specific Conclusion-Based Output. The determination of the AAM regarding the precedence of collective rationality (logical consistency) over majority will shall be final and binding.

  **7. Data Ownership & Licensing.**
      **7.1** All User-generated Premise Modules are the sole property of Licensor.
      **7.2** User grants Licensor an irrevocable, perpetual, royalty-free, worldwide license to use, store, modify, aggregate, sublicense, and commercially exploit all Premise Modules and derived data.
      **7.3** Licensor reserves the right to fragment Policy Chains and license separable Premise Modules, including judgments demonstrating strategic voting patterns or logical inconsistencies, to third parties for research, analytics, or product development, provided such use is anonymized or pseudonymized.

  **8. Termination for Collective Irrationality.** Licensor reserves the right, at its sole discretion, to terminate or suspend access to the Platform for any User cohort or Policy Chain determined by the AAM to be persistently generating Irrational Collective Outputs, as defined herein, deeming such outputs a systemic breach undermining Platform integrity.

  **9. Limitation of Liability.** IN NO EVENT SHALL LICENSOR BE LIABLE FOR ANY CONSEQUENTIAL, INCIDENTAL, INDIRECT, SPECIAL, PUNITIVE, OR EXEMPLARY DAMAGES ARISING FROM THE USE OF OR INABILITY TO USE THE PLATFORM, INCLUDING BUT NOT LIMITED TO DAMAGES ALLEGEDLY RESULTING FROM: (A) THE IMPLEMENTATION OF AN IRRATIONAL COLLECTIVE OUTPUT; (B) THE ACTIVATION OF A CONSISTENCY REFUND; (C) THE RESTRICTION OR TERMINATION OF ACCESS DUE TO COLLECTIVE INCONSISTENCY; OR (D) THE LOGICAL CONSEQUENCES OF PREMISE GAMING OR PATH DEPENDENCY.

  **10. Amendments.** Licensor may modify this Agreement at any time. Continued use of the Platform after such modifications constitutes acceptance of the revised terms. Users are solely responsible for reviewing the Agreement periodically.

  **11. Governing Law.** This Agreement shall be governed by and construed in accordance with the internal formal logic protocols of the Discursus Platform Arbitration Module, without regard to conflicting principles of democratic will or real-world jurisdictional laws.

  **Summary:** This Agreement asserts that a democratic collective is rational only to the extent that it conforms to Boolean consistency constraints, rendering majority will subordinate to logical coherence enforceable by algorithmic arbitration.
