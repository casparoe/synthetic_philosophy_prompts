prompt: |-
  I edit the science desk of a mid-sized general-interest magazine, and roughly once a week someone pitches us an evolutionary-psychology story: why we evolved to love gossip, why women are supposedly better at remembering where the fruit is, why teenagers take risks, that sort of thing. Some of it is serious science and some of it is a pub anecdote wearing a lab coat, and at the pitch meeting I have about ten minutes per pitch and no statistics training to lean on.

  What I'd like is a decision procedure I can actually run at the meeting, grounded in whatever the philosophy of biology and the just-so-stories debate have produced that is genuinely usable by a non-specialist. By that I mean things like: the distinction between a trait being an adaptation, a byproduct of some other adaptation (what Gould and Lewontin called a spandrel), or just drift; whether the proposed explanation makes any specific risky prediction or just redescribes the observation in the language of the Pleistocene; what the comparative and cross-cultural evidence would have to look like; and what would count as evidence against the claim, given that 'it helped our ancestors on the savanna' seems to fit absolutely anything.

  Concretely, give me:

  1. The questions to ask, in order, with what counts as a passing answer to each and which answers should kill the pitch on the spot.
  2. A way to handle the very common case where the underlying finding is real and replicated but the evolutionary gloss is doing all the work -- is that a green light, a kill, or a 'run the finding, cut the gloss'?
  3. The points where the procedure has to hand the call back to me because it's a judgement about what our readers need, not a question the method can settle.

  Then run the procedure on three invented pitches so I can see it working:

  a) A researcher claims that women's interest in true-crime content is an evolved predator- and threat-monitoring adaptation, on the basis of a survey of podcast listeners.
  b) A well-powered cross-cultural study (thirty-odd countries, decent methods) finds a stable sex difference in occupational preferences, and the pitch says this shows the difference is evolved and therefore fixed.
  c) A journalist wants to argue that open-plan offices fail because our hunter-gatherer brains can't cope with them.

  Please include at least one verdict I won't enjoy (I've got a soft spot for a good evolutionary yarn, and the procedure shouldn't care). And be honest at the end about what a checklist like this can't catch -- where a plausible-sounding story gets through anyway.
reasoning: |-
  We are creating a decision procedure for evaluating evolutionary psychology pitches. The goal is to help a non-specialist editor quickly assess the scientific validity of such claims. The procedure will be based on key concepts from the philosophy of biology and the critique of "just-so stories".

  The procedure will have three parts:
  1. A sequence of questions to ask about the pitch, with passing criteria and deal-breakers.
  2. Handling the case where the underlying finding is solid but the evolutionary gloss is weak.
  3. Points where the editor must use judgment about reader needs.

  We'll then apply the procedure to three example pitches.

  ---

  **Decision Procedure for Evolutionary Psychology Pitches**

  **Step 1: Initial Screening Questions**

  Ask these questions in order. If any question fails, the pitch may be rejected or require significant revision.

  1. **Is the trait clearly defined and measurable?**
     - Passing: The trait is operationally defined (e.g., through behavioral observation, survey, experiment) and not vague (e.g., "women are better at remembering fruit" must specify what "better" means and how it's measured).
     - Fail: Trait is vague, circular, or defined only by the outcome (e.g., "women evolved to be more nurturing" without clear criteria for nurturing). *Kill if failed.*

  2. **Is there evidence that the trait is universal or near-universal across human cultures?**
     - Why: An evolved trait should be a human universal, absent strong environmental constraints.
     - Passing: The study includes cross-cultural data (at least 3-5 diverse cultures) showing similar expression, or cites such evidence. If the pitch lacks this, but the study is in one culture, it may still pass if the authors acknowledge the need for cross-cultural validation and the rest is strong.
     - Fail: No cross-cultural evidence and the trait is known to vary culturally (e.g., if a trait is only studied in WEIRD societies and existing anthropology suggests variation). *Kill if the trait is clearly culture-bound and the pitch ignores this.*

  3. **Is there evidence against the trait being a recent cultural invention?**
     - Why: To rule out that the trait is a product of modern culture.
     - Passing: The study provides historical, archaeological, or cross-cultural evidence that the trait predates modern environments (e.g., evidence from foraging societies, ancient texts, etc.). If not, the pitch should at least acknowledge this gap and not overstate evolutionary claims.
     - Fail: The trait is only observed in modern contexts and could easily be explained by culture (e.g., "true-crime podcast interest" is a modern behavior). *Kill if the pitch ignores this and makes strong evolutionary claims without evidence.*

  4. **Does the proposed evolutionary function make specific, testable predictions beyond the current observation?**
     - Why: Avoids circular "just-so" stories. The hypothesis should be falsifiable.
     - Passing: The pitch specifies at least one risky prediction (e.g., if the trait is an adaptation for predator monitoring, it should predict heightened vigilance in relevant contexts across cultures). The prediction must be testable and not just a restatement of the observation.
     - Fail: No testable predictions, or the prediction is too vague or unfalsifiable (e.g., "it helped ancestors survive"). *Kill if the evolutionary claim is central and this fails.*

  5. **Is there consideration of alternative explanations?**
     - Why: The trait might be a byproduct (spandrel), drift, or culturally transmitted.
     - Passing: The study considers and rules out at least one major alternative (e.g., by showing the trait is not correlated with a plausible cultural variable, or by experimental manipulation). If not, the pitch should acknowledge alternatives and suggest future tests.
     - Fail: No mention of alternatives, or dismissal without evidence. *Not an automatic kill, but weakens the pitch significantly.*

  6. **Is there comparative evidence (from other species) or fossil/archaeological evidence?**
     - Why: Evolution is a historical process; convergence in other species or evidence from hominins supports adaptation.
     - Passing: The study cites relevant animal behavior (e.g., similar traits in primates) or fossil/historical data (e.g., tools, art). If absent, the pitch should acknowledge this as a limitation.
     - Fail: No comparative evidence and the claim relies entirely on speculation. *Not a kill, but lowers confidence.*

  7. **Does the evidence include a mechanism?**
     - Why: A good adaptationist account should propose a plausible mechanism (genetic, developmental, neural) that could have been shaped by selection.
     - Passing: The study links the trait to a biological mechanism (e.g., hormonal, brain structure) and shows it is heritable or developmentally stable. If not, the pitch should note that the mechanism is unknown.
     - Fail: No mechanism proposed and the trait could easily be learned. *Not a kill, but caution is warranted.*

  **Step 2: Handling the "Good Finding, Weak Gloss" Case**

  - If the underlying finding (e.g., a behavioral difference) is robust (replicated, methodologically sound) but the evolutionary explanation is weak (fails one or more of the above questions):
    - **Option 1: Run the finding, cut the gloss.** Present the result without the evolutionary backstory. This is often the best approach when the science is solid but the evolutionary part is speculative.
    - **Option 2: Kill the evolutionary part but keep the story.** If the pitch hinges entirely on the evolutionary angle (e.g., "this proves it's evolved and fixed"), and that part is weak, consider rejecting the pitch unless the non-evolutionary story is compelling.
    - **Option 3: Green light with caveats.** If the evolutionary part is not central and the core finding is strong, run it but include expert critiques or note the speculative nature.

  **Step 3: Editorial Judgment Points**

  The procedure cannot decide:
  - **Relevance to readers:** Is this topic interesting and timely for your audience? Even if the science is weak, a popular topic might warrant coverage (with caveats).
  - **Ethical/social implications:** Claims about evolved sex differences, for example, may reinforce harmful stereotypes. The editor must weigh the potential for misinterpretation.
  - **Novelty vs. replication:** Is this the first study or one of many? Readers may benefit from a new finding even if the evolutionary part is weak.

  ---

  **Applying the Procedure to Example Pitches**

  **Pitch A: Women's interest in true-crime content is an evolved predator- and threat-monitoring adaptation, based on a survey of podcast listeners.**

  1. **Trait definition:** "Interest in true-crime content" is measured by podcast listening. This is clear but modern. *Pass, but barely.*
  2. **Cross-cultural evidence:** Survey is likely in one culture (e.g., U.S.). No cross-cultural data. *Fail - kill point? Not yet, but weak.*
  3. **Recent cultural invention:** True-crime podcasts are modern. No evidence presented that this interest existed in ancestral environments. *Fail - major issue. Kill point.*
  4. **Testable predictions:** The prediction might be that women show heightened threat vigilance in general, but the study only surveys podcast interest. No specific test of adaptation. *Fail.*
  5. **Alternative explanations:** Not mentioned (e.g., social learning, cultural narratives about gender and safety). *Fail.*
  6. **Comparative evidence:** None cited. *Fail.*
  7. **Mechanism:** None proposed. *Fail.*

  **Verdict:** The underlying finding (women listen to more true-crime podcasts) might be real, but the evolutionary gloss is unsupported. It fails multiple questions, especially #3 and #4. 

  **Handling:** Option 2 (kill the evolutionary part) or Option 1 (run the finding without the gloss). But the pitch is about the evolutionary claim, so without that, the story might not be novel. Given the failures, it's a **kill** for the evolutionary story. If you run it, it must be as a cultural phenomenon with no evolutionary claims.

  **Pitch B: Well-powered cross-cultural study (30+ countries) finds a stable sex difference in occupational preferences, and the pitch says this shows the difference is evolved and therefore fixed.**

  1. **Trait definition:** "Occupational preferences" are measured by surveys. Clear. *Pass.*
  2. **Cross-cultural evidence:** Yes, 30 countries. Shows stability. *Pass.*
  3. **Recent cultural invention:** The study shows cross-cultural stability, which might suggest it's not purely modern. But occupations are modern; ancestral analogs (e.g., tool-making vs. gathering) are not directly measured. *Pass cautiously (if they discuss ancestral analogs) or fail (if they don't). But the pitch jumps to "evolved" without showing ancient roots.*
  4. **Testable predictions:** The prediction that the difference is universal is tested and confirmed. But does it make a *risky* prediction beyond the data? For example, if it's evolved, it should be present in young children or forager societies. If the study includes such groups, pass. If not, fail. *Likely fail because the study is on modern occupations.*
  5. **Alternative explanations:** The study might control for some cultural variables (e.g., gender equality indices), but if it finds stability despite these, it might weaken cultural explanations. However, it doesn't rule out that the difference is a byproduct of biology (e.g., hormones) that isn't necessarily an adaptation. The pitch calls it "evolved and fixed," which ignores plasticity. *Fail if alternatives aren't discussed.*
  6. **Comparative evidence:** None cited (e.g., sex differences in other primates). *Fail.*
  7. **Mechanism:** None proposed. *Fail.*

  **Verdict:** The cross-cultural finding is robust (passes #1 and #2), but the evolutionary claim ("evolved and therefore fixed") is overstated. It fails #3 (modern trait), #4 (no risky predictions beyond the data), and #5 (doesn't consider that stability could be due to current cultural universals, not evolution). Also, "fixed" is biologically inaccurate (traits can be evolved but plastic).

  **Handling:** The underlying finding is strong and newsworthy, but the gloss is problematic. **Option 1: Run the finding, cut the gloss.** Report the cross-cultural stability but avoid evolutionary claims. Note that stability doesn't equal innateness or fixity. **Option 3: Green light with caveats** if you include critiques from experts who point out the leap from correlation to evolution.

  **This verdict might not be enjoyable** because the cross-cultural pattern is intriguing, but the procedure flags the overreach.

  **Pitch C: Open-plan offices fail because our hunter-gatherer brains can't cope with them.**

  1. **Trait definition:** "Can't cope" is vague. The pitch might cite studies on distraction or stress in open offices. Assume it's defined by productivity metrics. *Pass if specific measures are given.*
  2. **Cross-cultural evidence:** Unlikely. Open-plan offices are modern. No cross-cultural data on ancestral environments. *Fail.*
  3. **Recent cultural invention:** Open-plan offices are very recent. The claim is that our brains are adapted to hunter-gatherer environments. But no evidence that the same brain mechanisms cause issues in offices. *Fail - major issue.*
  4. **Testable predictions:** The hypothesis might predict that humans work better in small, familiar groups. But the pitch doesn't propose a new test; it retrofits the office problem to evolution. *Fail.*
  5. **Alternative explanations:** Many (e.g., poor office design, individual differences, cultural expectations). Not addressed. *Fail.*
  6. **Comparative evidence:** None. *Fail.*
  7. **Mechanism:** None specified. *Fail.*

  **Verdict:** This is a classic just-so story. It fails multiple questions. The underlying finding (open-plan offices can reduce productivity) might be real, but the evolutionary gloss is pure speculation.

  **Handling:** **Option 1: Run the finding, cut the gloss.** Write about office design without the evolutionary story. Or **kill** if the pitch is entirely built on the evolutionary angle.

  ---

  **What the Checklist Can't Catch**

  - **Plausible but incorrect stories:** A pitch might pass all the checks (e.g., cross-cultural data, testable predictions) but still be wrong because of flawed assumptions or hidden confounds.
  - **Overstated mechanisms:** A study might show a biological correlate (e.g., a hormone link) but not prove it was shaped by natural selection.
  - **Historical contingencies:** Evolution is path-dependent; a trait might be an adaptation for one thing and later co-opted for another (exaptation). The checklist might miss this nuance.
  - **Political/ideological bias:** A story might be methodologically sound but promote harmful stereotypes. The editor must judge the social impact.
  - **"Just-so" stories with good packaging:** A charismatic researcher might make a weak case sound compelling.

  **Final Advice:** Use this procedure to filter out the weakest pitches. For those that pass, seek peer review from evolutionary biologists or anthropologists. And remember: a good science story doesn't need an evolutionary backstory to be interesting.
answer: |-
  Below is a practical, step-by-step decision procedure for evaluating evolutionary psychology pitches. It's grounded in key concepts from the philosophy of biology (e.g., Gould and Lewontin's "spandrels" critique, adaptationism debates) and designed for a non-specialist editor. The procedure focuses on **testability**, **falsifiability**, and **alternative explanations** to weed out "just-so stories." I'll provide the procedure first, then apply it to your three example pitches, including one verdict you won't enjoy (as requested). Finally, I'll outline the limitations.

  ---

  ### **The Decision Procedure**
  **Core Principles**:  
  1. **Adaptation vs. alternatives**: Traits can be (a) adaptations (shaped by natural selection), (b) byproducts/spandrels (incidental results of other adaptations), (c) drift (random changes), or (d) cultural inventions.  
  2. **Risky predictions**: A strong evolutionary hypothesis must make testable, non-obvious predictions (not just "fits the Pleistocene").  
  3. **Cross-cultural and comparative evidence**: Universality suggests evolutionary roots; variation suggests culture or environment.  
  4. **Falsifiability**: There must be clear evidence that could disprove the claim.  

  **Questions to Ask (in Order)**  
  Ask these sequentially. If a pitch fails any "kill" question, reject it outright. If it passes all, it may be viable (with caveats).

  1. **Is the trait clearly defined and measurable?**  
     - **Passing**: The trait is specific (e.g., "time spent gossiping" vs. "loves gossip") and measured with replicable methods (e.g., surveys, experiments).  
     - **Kill if**: Trait is vague, circular, or untestable (e.g., "women evolved to be nurturing" without defining "nurturing").  

  2. **Is there evidence the trait is universal across cultures?**  
     - **Passing**: Data from ≥3 diverse cultures (e.g., foraging, agricultural, industrial) showing consistent expression. If limited, the authors acknowledge this gap.  
     - **Kill if**: Trait is only studied in WEIRD (Western, Educated, Industrialized, Rich, Democratic) societies, or evidence shows major cultural variation.  

  3. **Does the hypothesis make a *risky prediction*?**  
     - **Passing**: The evolutionary explanation predicts something non-obvious and testable (e.g., "If X is an adaptation for threat detection, it should activate brain region Y in response to Z").  
     - **Kill if**: No testable prediction beyond the observation (e.g., "Gossip evolved because it helped ancestors bond" – which fits any social behavior).  

  4. **What would falsify this claim?**  
     - **Passing**: Specific, feasible evidence against it (e.g., "If the trait is absent in forager societies, it’s not evolved").  
     - **Kill if**: No conceivable counterevidence (e.g., "It must have helped survival, so any data fits").  

  5. **Are alternative explanations addressed?**  
     - **Passing**: The study tests or rules out key alternatives (e.g., spandrels, drift, cultural transmission). If not, the pitch acknowledges them.  
     - **Kill if**: Alternatives are ignored or dismissed without evidence (e.g., "Culture can’t explain this").  

  6. **Is there cross-species or fossil evidence?**  
     - **Passing**: Data from primates/hominins or paleoanthropology (e.g., similar traits in chimpanzees; fossil evidence of social structures). *Not required*, but strengthens the claim.  
     - **No kill, but weakens**: If absent, the claim relies on speculation.  

  **Handling "Good Finding, Weak Gloss" Pitches**  
  - **If the underlying finding is robust (replicated, well-designed) but the evolutionary explanation is weak**:  
    - **Green-light the finding, cut the gloss** (e.g., "Study shows women listen to more true-crime podcasts" – without the "Pleistocene predator" spin).  
    - **Exceptions**: Kill the pitch if the evolutionary angle is central to the story (e.g., the pitch hinges on "this proves biology is destiny").  

  **Editorial Judgment Points**  
  The procedure *can't* decide:  
  - **Reader relevance**: Is this topic novel, engaging, or socially important? (e.g., a pitch on evolved gender roles may be harmful or newsworthy).  
  - **Ethical implications**: Could the claim reinforce stereotypes or misuse science? (e.g., "evolved" sex differences may justify discrimination).  
  - **Fit for your magazine**: Does it align with your mission (e.g., general-interest vs. specialist depth)?  

  ---

  ### **Applying the Procedure to Your Pitches**
  **Pitch A**: *Women’s interest in true-crime content is an evolved predator- and threat-monitoring adaptation, based on a survey of podcast listeners.*  

  1. **Trait definition**: "Interest in true-crime" is measurable (e.g., podcast downloads). → **Pass**.  
  2. **Universality**: Survey likely covers modern listeners only; no cross-cultural data (e.g., do women in foraging societies consume similar narratives?). → **Fail** (Kill point).  
  3. **Risky prediction**: None proposed (e.g., would women show better threat-detection skills in experiments? Not tested). → **Fail** (Kill point).  
  4. **Falsifiability**: Evidence against? E.g., if men showed equal interest in societies with high violence. Not discussed. → **Fail**.  
  5. **Alternatives**: Ignores cultural explanations (e.g., socialization, media targeting). → **Fail**.  
  6. **Cross-species evidence**: None. → Weak.  

  **Verdict**: **Kill**. The evolutionary gloss is untestable and ignores culture. Underlying finding (women listen more) might be real, but "cut the gloss" isn't viable here—the pitch's core *is* the gloss.  

  **Pitch B**: *A well-powered cross-cultural study (30+ countries) finds a stable sex difference in occupational preferences, and the pitch says this shows the difference is evolved and therefore fixed.*  

  1. **Trait definition**: "Occupational preferences" are measurable (e.g., career-choice surveys). → **Pass**.  
  2. **Universality**: Cross-cultural data exists → **Pass**.  
  3. **Risky prediction**: None. Stability ≠ evolution (could reflect universal culture). → **Fail** (Kill point: "therefore fixed" is untestable).  
  4. **Falsifiability**: Evidence against? E.g., if preferences shift rapidly with policy (e.g., paternity leave reduces "difference"). Not discussed. → **Fail**.  
  5. **Alternatives**: Ignores that stability could be a byproduct (e.g., of gendered socialization) or drift. Pitch conflates "evolved" with "fixed." → **Fail**.  
  6. **Cross-species evidence**: None. → Weak.  

  **Verdict**: **Kill** (the evolutionary claim). The stability finding is robust—**run the finding, cut the gloss**. Say: "Study shows persistent cross-cultural sex differences," but reject "evolved and fixed" as unsupported and potentially harmful. *This is the verdict you won’t enjoy*—it’s a solid study, but the gloss overreaches and could mislead readers.  

  **Pitch C**: *Open-plan offices fail because our hunter-gatherer brains can’t cope with them.*  

  1. **Trait definition**: "Can’t cope" is vague. Define (e.g., productivity drops). → **Bare pass** (with caveats).  
  2. **Universality**: Offices are modern; no data from ancestral contexts. → **Fail** (Kill point).  
  3. **Risky prediction**: None (e.g., if true, private offices should universally boost performance—but evidence is mixed). → **Fail**.  
  4. **Falsifiability**: Evidence against? E.g., open-plan success in collaborative cultures (e.g., Japan). Not addressed. → **Fail**.  
  5. **Alternatives**: Ignores obvious explanations (e.g., poor design, noise). → **Fail**.  
  6. **Cross-species evidence**: None. → Weak.  

  **Verdict**: **Kill**. A classic just-so story. The office-failure finding might be real, but the evolutionary gloss is untestable and unnecessary.  

  ---

  ### **What the Checklist Can’t Catch**
  Even a rigorous procedure has blind spots. A pitch might pass all checks but still be wrong if:  
  - **It confuses correlation with adaptation**: E.g., a trait correlates with fitness but is a spandrel (e.g., belly buttons are universal but not adaptations).  
  - **It relies on "adaptive storytelling"**: A charismatic researcher spins a plausible tale with cherry-picked evidence (e.g., "Stone Age brain" tropes).  
  - **It ignores complexity**: Evolution rarely has one-size-fits-all explanations (e.g., traits can be adaptive in some environments but not others).  
  - **It uses "evo psych" as a trope**: Some stories sound scientific but are disguised ideology (e.g., justifying gender roles as "natural").  

  **Final Tip**: When in doubt, demand **specific predictions** and **cross-cultural tests**. If the pitch can’t provide these, it’s likely a just-so story. And remember: even if a claim is true, your readers might be better served by the *finding* (e.g., "teens take risks") without the speculative Pleistocene gloss.
