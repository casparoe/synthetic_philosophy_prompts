  I've been arguing with my flatmate about whether immoral art can still be good art — you know, the classic separating-the-work-from-the-artist problem. We kept going round in circles with the usual examples, but then she threw in this weird hypothetical: what if a painting didn't just have a bad creator, but actually contained a kind of embedded moral fingerprint — like, the chemical composition of the paint changed in response to the painter's emotional state, and you could analyse it and see that every layer was applied in a state of genuine, documented malice? I'm doing a course on aesthetics and my tutor says that's still just causal history, not an intrinsic aesthetic flaw, but I'm not sure that holds up once the cruelty is literally in the pigment. I'm not sure I'm explainign this well, but the idea is that the badness isn't just in the biography — it's physically baked in.

  Anyway, could you write a short story — maybe set in a near-future gallery — about a conservator who discovers exactly that in a celebrated masterpiece? Let the characters debate whether the discovery ruins the work, whether 'separation' is even coherent when the malice is in the material itself, and whether viewers who learn the truth should feel their aesthetic response change. Don't make it too tidy; I want the argument to stay in the weeds, with people talking past each other a bit. Write the answer in British English please — and apologies if my prompt is a bit messy, I wrote it quickly between lectures.
