answer: |-
  Here is the rigorous translation of the gender-equality paradox debate into matching-market vocabulary, identifying conceptual mappings and residues:

  **The Paradox Restated:** Societies with formal rules enforcing agent-type neutrality in matching markets (e.g., gender-blind college admissions/job applications) exhibit *higher* observed differentiation in final matchings (occupational/educational allocations) correlated with a binary agent-type tag (gender). Three interpretations exist:

  1.  **Biological Predisposition Interpretation:**
      *   **Agent Types:** Agents have fixed, innate *preference types* correlated with the gender tag (e.g., type-F agents intrinsically prefer nursing/teaching, type-M intrinsically prefer engineering/trades). The tag is a proxy for underlying preference heterogeneity.
      *   **Preference Revelation:** Stated preferences (choices) are truthful signals of these innate types under reduced constraints.
      *   **Allocation Mechanism:** A decentralized matching market (e.g., Gale-Shapley, competitive equilibrium) with formal type-neutrality in the *rules* (no explicit barriers based on tag). Preferences drive matching.
      *   **Revealed Preference vs. Distorted Signaling:** Choices directly reveal fundamental preferences. No significant distortion exists; the mechanism is incentive-compatible for truthful revelation.
      *   **Invoked Social-Choice Criterion:** *Ex Post Pareto Efficiency.* The differentiated matching is the efficient outcome given true heterogeneous preferences. Stability (no blocking pairs) is achievable and likely under this preference structure.
      *   **Paradox Explanation:** Removing formal constraints allows innate preferences to be fully expressed/revealed in the matching.

  2.  **Culturally Liberated Choice Interpretation:**
      *   **Agent Types:** Agents have *malleable preference types*. The gender tag influences but does not rigidly determine preferences. Preferences are shaped by non-mechanism factors (cultural exposure, socialization).
      *   **Preference Revelation:** Stated preferences are "authentic" choices *given* the cultural context, revealed under reduced formal constraints. Preferences are endogenous to culture, not the mechanism.
      *   **Allocation Mechanism:** Same as above (decentralized, formally type-neutral).
      *   **Revealed Preference vs. Distorted Signaling:** Choices reveal *contextually authentic* preferences. "Distortion" is ill-defined here; preferences are valid given the cultural formation process. The mechanism itself is non-distorting.
      *   **Invoked Social-Choice Criterion:** *Respect for Agent Sovereignty / Voluntary Participation.* The differentiated matching is stable and reflects agents' self-determined choices under the prevailing cultural milieu. Equity is satisfied procedurally (equal access).
      *   **Paradox Explanation:** Formal equality enables agents to freely express culturally influenced preferences, leading to differentiation. Choice itself is the normative good.

  3.  **Structural Injustice Interpretation:**
      *   **Agent Types:** Agents have latent preferences *uncorrelated* (or weakly correlated) with the gender tag. The tag itself creates differential *opportunity sets* or *perceived constraints*.
      *   **Preference Revelation:** Stated preferences are *distorted signals* of latent preferences. Distortion arises from:
          *   *Biased Beliefs:* Agents anticipate discrimination or hold stereotypes, shaping stated preferences ("I won't apply to engineering because they don't hire women").
          *   *Investment Externalities:* Early-stage resource allocation (education investment) differs by tag due to societal bias, altering later-stage preferences/capabilities.
          *   *Signaling Costs:* Revealing preferences counter to tag stereotypes carries higher implicit cost (social penalty, perceived lower success probability).
      *   **Allocation Mechanism:** A mechanism *formally* type-neutral but operating within an environment imposing *de facto type-dependent constraints* (biased beliefs, differential prior investments, signaling costs). The mechanism fails strict incentive compatibility due to these external constraints.
      *   **Revealed Preference vs. Distorted Signaling:** Observed choices (revealed preferences) are *not* true indicators of latent preferences/welfare. They reflect strategic adaptation to biased constraints. True preferences are unobserved.
      *   **Invoked Social-Choice Criterion:** *Ex Ante Equity / Opportunity Equality / True Preference Efficiency.* The differentiated matching is inefficient (fails to maximize true latent welfare) and inequitable (agents face unequal effective choice sets due to their tag). Stability may exist but is based on distorted signals and is normatively irrelevant.
      *   **Paradox Explanation:** Formal equality is insufficient. Biases embedded in the social context distort preference revelation and constrain opportunity sets, leading to inefficient and inequitable differentiation masquerading as free choice.

  **Residues: What Does Not Map (and Why):**

  1.  **Endogenous Preference Formation:** Matching markets take preferences as *exogenous inputs*. The core sociological claim that culture *shapes* fundamental preferences (Interpretation 2) or that injustice *warps* them (Interpretation 3) has no direct counterpart. Mechanism design lacks models where preferences are dynamically formed *within* the allocation process based on social interactions or anticipated matchings. This is a **blind spot** regarding the *origin* of types/preferences.
  2.  **Autonomy Beyond Choice:** The philosophical concept of autonomy (e.g., "authentic" choice free from internalized oppression in Interpretation 3) transcends observable choice behavior and stable matchings. Distinguishing "authentic" vs. "distorted" preferences requires normative judgment about the preference *formation process*, which revealed preference analysis explicitly avoids. This residue highlights a **limitation of revealed preference** as the sole metric of welfare/autonomy in normative evaluation.
  3.  **Non-Welfarist Justice:** Claims about the inherent injustice of gender roles/stereotypes, even within a potentially stable/efficient matching (Interpretation 3), often rely on non-welfarist principles (e.g., recognition, freedom from domination, intrinsic equality). These cannot be reduced to equity defined over opportunity sets or utility distributions within standard mechanism design. This indicates **mechanism design's primary welfarist framework** struggles with non-consequentialist justice claims.
  4.  **Social-Image Externalities:** The costs/benefits associated with conforming to or violating gendered expectations within social networks (a key element in Interpretation 3's distortion) are difficult to cleanly incorporate. While externalities *can* be modeled (e.g., peer effects), the specific, identity-tag-based social-image component lacks a standard, tractable representation within core matching theory. This is a **modeling challenge**, not necessarily a fundamental blind spot, but it hinders formalization.
  5.  **The Nature of "Culture":** The sociological concept of "culture" as a diffuse, pervasive system of meaning shaping beliefs, norms, and identities defies reduction to specific mechanism parameters (like biased beliefs or signaling costs). It acts as a background condition influencing *all* model elements (types, preferences, constraints, beliefs). This residue shows **parts of the debate are less formalizable**; culture is too broad and foundational to be a single node.

  **Conclusion:** The translation reveals mechanism design's strength in analyzing allocation rules, stability, and incentive compatibility under given preferences and constraints. It clearly distinguishes the interpretations based on how agent types/preferences are defined and whether observed choices are seen as truthful or distorted. However, residues exist precisely where the sociological and philosophical debate centers: the *endogenous formation* of preferences and identities, the deeper normative assessment of *autonomy* beyond choice, and *non-welfarist justice claims* about recognition and social structure. These residues highlight mechanism design's **core blind spot regarding preference endogeneity** and its **limitation to primarily welfarist normative criteria**. Other residues (culture, complex social-image effects) reflect **challenges in formalization** rather than inherent incapacity, showing aspects of the debate resist neat reduction to allocation nodes. The formalism itself remains neutral; it provides a scaffold for analysis but cannot adjudicate between the interpretations' core claims about preference origins or non-welfarist justice without importing external philosophical commitments.
