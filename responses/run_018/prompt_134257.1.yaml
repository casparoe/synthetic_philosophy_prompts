   Proposal:

  [Title Page]
  Axiological Gerrymandering: The Contextual Mechanics of "Western Values"
  A Six-Month Self-Directed Philosophical Investigation

  [Page 1]
  **1. Introduction**

  The phrase "Western values" occupies a central place in contemporary political discourse, invoked to defend liberal internationalism, justify immigration restrictions, or critique progressive cultural shifts. Yet its referent remains elusive. Standard approaches either attempt to define an essentialist list of values (e.g., democracy, human rights) or dismiss the category as mere imperialist camouflage. Both fail to capture the dynamic, context-driven nature of the term's usage. This project introduces the concept of *axiological gerrymandering*—the strategic inclusion or exclusion of specific value commitments to serve rhetorical goals in distinct contexts—to investigate how "Western values" functions not as a fixed category but as a boundary-marker whose extension shifts with the demands of argumentation.

  **2. Core Research Question**

  This project addresses a precise two-part question: 
  - Is there a non-arbitrary, context-invariant core of values that consistently defines "Western values" across discursive contexts? 
  - If no such core exists, what functional rules govern the selective deployment of the phrase—i.e., which values are included or excluded, and under what conditions?

  **3. Gap in Existing Literature**

  Current debates in political philosophy leave this question unanswered. Universalist approaches (e.g., defenses of human rights or individual autonomy) typically justify particular values without interrogating why they are labeled "Western" or how the geographic framing operates. Critical approaches (e.g., postcolonial critiques) rightly reject the category as ideological but often do not analyze the internal variability and strategic patterns in its deployment. This gap is significant: without understanding the mechanics of axiological gerrymandering, we cannot fully grasp how the rhetoric of "Western values" shapes real-world political conflicts.

  [Page 2]
  **4. Methodological Approach**

  The project employs conceptual analysis of three high-profile discursive contexts from the past decade:

  1. **Democratic Backsliding Rhetoric**: Analysis of how "Western values" are invoked in critiques of democratic erosion (e.g., in Hungary, Poland, Turkey), focusing on which values (e.g., rule of law, free elections) are emphasized and which (e.g., social welfare) are downplayed.

  2. **Migration-Policy Debates**: Examination of appeals to "Western values" in arguments for restricting immigration or demanding cultural integration (e.g., in European parliamentary debates or U.S. policy documents), tracking the inclusion of values like gender equality or secularism and the exclusion of others (e.g., obligations to refugees).

  3. **Critiques of Progressive Culture**: Study of invocations of "Western values" in controversies over campus speech, cancel culture, or religious heritage (e.g., in op-eds and speeches by public intellectuals), noting when values like free expression are prioritized and when commitments to diversity or historical reckoning are marginalized.

  For each context, the method will:
  - Identify 10-15 key texts per context (total 30-45 texts) that explicitly use the phrase.
  - Map the specific values included/excluded and the stated or implied criteria for their selection.
  - Test for consistency: Does the same value (e.g., religious heritage) appear in one context but vanish in another?
  - Compare across contexts to identify patterns of strategic inclusion/exclusion.

  **5. Success and Failure Conditions**

  - **Success**: The project succeeds if it either (a) reconstructs a minimal, distinctive core of values consistently invoked across all three contexts, demonstrating that the category is coherent despite contextual pressures, or (b) develops a precise functional taxonomy of rhetorical rules (e.g., "inclusion of individual autonomy in democratic-backsliding debates but exclusion in migration debates when cultural cohesion is emphasized").

  - **Failure**: The project fails if it finds no consistent core and no stable pattern of deployment—i.e., usage is entirely ad hoc and contextually arbitrary. Failure would also occur if the analysis reveals such overwhelming complexity that no clear rules can be discerned within the six-month timeframe.

  **6. Feasibility for Six-Month Solo Work**

  This project is realistic for six months of independent work. The focused scope (three contexts, limited text corpus) allows for in-depth analysis without requiring extensive travel, interviews, or archival research. The conceptual method is inherently manageable for a solo researcher, and the timeframe permits iterative refinement (e.g., two months per context, with the final month for cross-context synthesis). The main risk—overgeneralization from limited cases—is mitigated by explicitly framing conclusions as provisional and context-bound. This investigation thus offers a feasible path to clarifying one of the most politically potent yet nebulous concepts of our time.

