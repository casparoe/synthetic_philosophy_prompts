  ### Proposal: Axiological Gerrymandering and the Rhetorical Mechanics of "Western Values"  

  **1. Introduction**  
  "Western values" is a ubiquitous yet contested rhetorical device in political discourse, invoked to justify positions ranging from military intervention to immigration restrictions. Standard approaches—either listing essentialist traits (individualism, secularism) or dismissing the term as imperialist camouflage—fail to address its *functional plasticity*. This project investigates how "Western values" operates not as a coherent category but as a tool of *axiological gerrymandering*: the strategic inclusion or exclusion of specific commitments (e.g., free speech, Christian heritage, welfare rights) to serve contextual rhetorical goals. By dissecting this practice, the project reveals whether the phrase retains any philosophical substance or functions solely as a mutable boundary-marker.  

  **2. Core Research Question**  
  Is there a non-arbitrary, context-invariant core to "Western values"? If not, what functional rules govern its selective deployment—specifically, how do speakers gerrymander its extension across distinct discursive arenas?  

  **3. Why Existing Debates Leave This Open**  
  Political philosophy inadequately addresses this question. Universalist defenses (e.g., grounding human rights in reason) ignore the geographic framing of "Western," while critical theories (e.g., postcolonial critiques) reject the phrase as imperialist but neglect to dissect its *internal variability* across contexts. Neither examines how values are tactically added or omitted to suit rhetorical objectives—such as excluding "redistributive justice" when criticizing immigration but including it when attacking socialism. This gap obscures the mechanics of ideological boundary-drawing.  

  **4. Method: Tracking Axiological Gerrymandering in Practice**  
  A conceptual analysis of "Western values" across three high-stakes discursive contexts, selected for public salience and ideological diversity:  
  - **Democratic Backsliding Rhetoric** (e.g., responses to Hungary’s illiberalism): Is secularism prioritized over religious heritage? Are welfare rights excluded?  
  - **Migration-Policy Debates** (e.g., European far-right discourse): Is gender equality invoked to restrict immigration but omitted in critiques of multiculturalism?  
  - **Critiques of Progressive Culture** (e.g., campus free-speech controversies): Is individual autonomy emphasized while obligations to collective well-being downplayed?  

  **Process**:  
  - For each context, analyze 10–15 key texts (speeches, op-eds, policy documents) from the past five years.  
  - Identify: (a) explicit value-inclusions/exclusions, (b) implied justifications for selectivity, (c) patterns in which values are "suppressed" or "amplified."  
  - Test consistency: Does a value (e.g., "Judeo-Christian heritage") appear in one context but vanish in another? What rhetorical goals explain the shift?  

  **5. Defining Success and Failure**  
  - **Success**:  
    - A reconstructed *minimal core* of values consistently invoked across all contexts (e.g., "procedural equality") that resists gerrymandering.  
    - **OR** a *functional taxonomy*: A set of rules explaining deployment (e.g., "Individual autonomy is included when defending liberalism but excluded in debates about economic inequality").  
  - **Failure**:  
    - Total category collapse: No core exists, and usage is irreducibly arbitrary.  
    - Inability to identify stable patterns (e.g., values shift without discernible rules, making generalization impossible).  

  **6. Feasibility for Six-Month Solo Work**  
  Realistic, with disciplined scope:  
  - **Scope Control**: Three contexts × 10–15 texts each = 30–45 total sources. Avoid over-extension by excluding historical cases (pre-2010s) and non-Western discourses.  
  - **Method**: Conceptual/textual analysis requires no fieldwork, data science, or institutional access.  
  - **Timeline**: Two months per context (research/analysis), one month cross-context synthesis, one month drafting.  
  - **Risk Mitigation**: If patterns are ambiguous, the taxonomy can focus on partial rules (e.g., "consistent in migration debates but not elsewhere").  

