answer: |-
  Righto, here's a proper 60-minute wrestle for your MSc lot. No spoon-feeding, just piecewise frontiers and asymmetric shifts to make them sweat.

  **Problem Sheet Question: Kalai-Smorodinsky Monotonicity Puzzle (60 mins)**

  Consider a bargaining problem with disagreement point `d = (1, 2)`. The feasible set `S` is convex and has a Pareto frontier defined by two linear segments:
  1.  From point `(2, 6)` to point `(5, 7)` with a slope of `+1/3` (i.e., increasing in both players).
  2.  From point `(5, 7)` to point `(8, 3)` with a slope of `-4/3` (i.e., Player A gains while Player B loses).

  The utopia point `u` is therefore `(8, 7)`.

  Now, suppose a "regulatory fallback" is introduced. This expands Player A's outside option, extending the *horizontal* segment of the frontier from `(8, 3)` to `(10, 3)`. Player B's maximum achievable payoff remains 7, and the disagreement point `d` remains `(1, 2)`. The new utopia point is `u' = (10, 7)`.

  **Tasks:**

  1.  **Compute the KS allocation:** Calculate the Kalai-Smorodinsky (KS) solution for **both** the original utopia point `u = (8, 7)` and the new utopia point `u' = (10, 7)`. Clearly show your work finding the intersection point of the KS ray with the Pareto frontier in each case. *(8 marks)*
  2.  **Explain the Monotonicity:** Explain clearly *why* Player A's payoff in the KS solution *strictly improves* after the shift to `u'`, even though Player B's maximum payoff (7) and the location of the kink point `(5, 7)` remain unchanged? *(5 marks)*
  3.  **Contrast with Nash:** Calculate the Nash Bargaining Solution (NBS) for the original problem (using `d = (1, 2)`). Contrast *both* KS allocations (original and new) with this single NBS allocation. Highlight precisely where the differences arise, focusing on the roles of the *Symmetry Axiom* and the *Scale Invariance Axiom* in explaining these differences. *(5 marks)*
  4.  **Normative Reflection:** Briefly discuss whether the monotonicity behaviour observed in this KS solution (A gaining when only A's utopia coordinate increases) is normatively attractive in a real-world setting where one side's outside option improves due to factors like regulatory changes. *(2 marks)*

  ---

  **Model Answer (Approx. 420 words):**

  **1. KS Computations:**

  *   **Original Utopia (`u = (8, 7)`):** The KS ray is the line from `d = (1, 2)` to `u = (8, 7)`. Its slope is `(7-2)/(8-1) = 5/7`.
      *   Segment 1 (Slope 1/3 ≈ 0.333): The ray's slope (5/7 ≈ 0.714) is steeper than the segment's slope. The ray passes above (5,7). Check segment 2.
      *   Segment 2 (Slope -4/3 ≈ -1.333): Find intersection of KS ray `(y - 2) = (5/7)(x - 1)` and segment from (5,7) to (8,3): `(y - 7) = (-4/3)(x - 5)`.
      *   Solve simultaneously:
          `(y - 2) = (5/7)(x - 1)`  => `y = (5/7)x - 5/7 + 14/7 = (5/7)x + 9/7`
          `(y - 7) = (-4/3)(x - 5)` => `y = (-4/3)x + 20/3 + 21/3 = (-4/3)x + 41/3`
      *   Set equal: `(5/7)x + 9/7 = (-4/3)x + 41/3`
      *   Multiply by 21: `15x + 27 = -28x + 287`
      *   `43x = 260` => `x ≈ 6.0465`
      *   `y = (5/7)(6.0465) + 9/7 ≈ 4.3189 + 1.2857 ≈ 5.6046`
      *   **Original KS: ≈ (6.05, 5.60)**
  *   **New Utopia (`u' = (10, 7)`):** The KS ray is from `d = (1, 2)` to `u' = (10, 7)`. Slope = `(7-2)/(10-1) = 5/9 ≈ 0.5556`.
      *   Segment 1 (Slope 1/3 ≈ 0.333): Ray slope (5/9 ≈ 0.5556) > segment slope. Ray passes above (5,7). Check segment 2.
      *   Segment 2 (Extended: (5,7) to (10,3)). Slope = `(3-7)/(10-5) = (-4)/5 = -0.8`.
      *   KS Ray: `(y - 2) = (5/9)(x - 1)` => `y = (5/9)x - 5/9 + 18/9 = (5/9)x + 13/9`
      *   Segment 2: `(y - 7) = (-4/5)(x - 5)` => `y = (-4/5)x + 4 + 7 = (-4/5)x + 11`
      *   Set equal: `(5/9)x + 13/9 = (-4/5)x + 11`
      *   Multiply by 45: `25x + 65 = -36x + 495`
      *   `61x = 430` => `x ≈ 7.0492`
      *   `y = (5/9)(7.0492) + 13/9 ≈ 3.9162 + 1.4444 ≈ 5.3606`
      *   **New KS: ≈ (7.05, 5.36)**

  **2. Explaining Monotonicity:** The KS solution satisfies *Individual Monotonicity*. This axiom states that if, for a given player, the utopia payoff increases *and* the set of feasible payoffs for the *other* player *given any payoff to the first player* doesn't shrink, then the first player shouldn't be worse off. Here, increasing A's utopia from 8 to 10 expands the frontier *only* in directions beneficial to A (horizontally right from (8,3) to (10,3)). Crucially, for *any* fixed payoff level `a` achievable by A (say `a=7`), the *maximum* payoff B can get *with A getting `a`* is unchanged (it's still 7, achieved at (5,7)). Since B's options conditional on A's payoff haven't worsened, Individual Monotonicity guarantees A won't be worse off. The frontier expansion gives A strictly more potential, so A strictly gains. B loses slightly because the KS ray flattens, hitting the steeper downward-sloping segment further right/lower.

  **3. Contrasting with Nash:**

  *   **NBS Calculation (Original):** Maximise `(x - 1)(y - 2)` over the frontier. On Segment 2 (`y = (-4/3)x + 41/3`): `h(x) = (x-1)((-4/3)x + 41/3 - 2) = (x-1)((-4/3)x + 35/3) = (1/3)(x-1)(-4x+35)`. Maximise `f(x) = (x-1)(-4x+35) = -4x² + 39x - 35`. Derivative `f'(x) = -8x + 39`. Set zero: `x = 39/8 = 4.875`. `y = (-4/3)(4.875) + 41/3 ≈ (-19.5/3) + 41/3 = 21.5/3 ≈ 7.1667`. Check Segment 1: `y = (1/3)(x-2)+6`. `h(x)=(x-1)((1/3)(x-2)+4)`. Derivative messy but max occurs at x<5, value less than at x=4.875. **NBS: (4.875, 7.17)**.
  *   **Contrast:**
      *   **KS Original (6.05, 5.60) vs NBS (4.88, 7.17):** NBS favours B much more heavily than original KS. This happens because the NBS lacks symmetry (A and B's payoffs are measured on different scales starting from d) and the frontier is asymmetric near d. Scale Invariance means NBS depends on the *relative* scales defined by `d`; B gains more utility moving from 2 to 7.17 (Δ5.17) than A does moving from 1 to 4.88 (Δ3.88) on their respective scales from d. KS, lacking Scale Invariance, aims for proportional gains relative to the utopia gains (5 from 1 to 6 for A ≈ 5/7 of utopia gain 7; 3.6 from 2 to 5.6 ≈ 3.6/5 ≈ 0.72 of utopia gain 5 – close but not identical due to kink).
      *   **KS New (7.05, 5.36) vs NBS (4.88, 7.17):** The shift to `u'` changes the KS (A gains, B loses slightly) but leaves the NBS *completely unchanged* (Scale Invariance: stretching A's axis horizontally doesn't affect the product `(x-1)(y-2)` as long as relative positions from d are preserved, which they are until (10,3) which is dominated). Symmetry isn't directly relevant here as the problem is asymmetric.

  **4. Normative Attractiveness:** Whether this monotonicity is attractive depends on perspective. Proponents argue it's fair that A benefits directly from an improvement in *A's own* best possible outcome, especially if the regulatory change specifically targets A's opportunities. Critics might argue it's harsh on B, whose position hasn't changed, yet B suffers a loss solely because A's potential improved, even if B's *own* potential (`u_B=7`) didn't increase. In real-world regulations (e.g., minimum wage hikes strengthening labour's fallback), unions might find KS monotonicity appealing, while employers might see the NBS (unchanged outcome) as fairer. It highlights a trade-off between rewarding improvements in potential and protecting the other party from external changes.

  ---

  **Marking Scheme (20 Marks Total):**

  1.  **KS Calculations (8 marks):**
      *   Correct KS ray equations for both utopia points (2 marks).
      *   Correct identification of intersecting segment (1 mark per case, 2 marks total).
      *   Correct simultaneous equation setup and solution for both cases (2 marks per case, 4 marks total).
      *   *Common Mistake:* Trying to use the first segment for KS ray when it's steeper (wrong segment), arithmetic errors in solving equations, missing the extension for u'.

  2.  **Monotonicity Explanation (5 marks):**
      *   Names/References Individual Monotonicity axiom (1 mark).
      *   Correctly states the condition (B's feasible set given A's payoff hasn't shrunk) (2 marks).
      *   Correctly applies it to this case (frontier expansion only benefits A, conditional max for B unchanged) (2 marks).
      *   *Common Mistake:* Vague reference to "utopia increase helps A", confusing with other axioms (e.g., IR), not addressing the *conditional* aspect of the axiom.

  3.  **NBS Contrast (5 marks):**
      *   Correct NBS calculation for original problem (2 marks - method & answer).
      *   Correct contrast KS(orig) vs NBS: Highlights asymmetry/scales/NBS favouring B due to lack of Symmetry/Scale Invariance effect (1.5 marks).
      *   Correct contrast KS(new) vs NBS: Highlights KS change vs NBS invariance due to Scale Invariance (1.5 marks).
      *   *Common Mistake:* Incorrect NBS calc (e.g., on wrong segment), misunderstanding Scale Invariance (thinking NBS should change), conflating Symmetry with the problem's asymmetry.

  4.  **Normative Reflection (2 marks):**
      *   Recognises trade-off/perspective (A benefits from own improvement vs B loses despite no change) (1 mark).
      *   Gives plausible real-world context/implication (e.g., regulation favouring one side) (1 mark).
      *   *Common Mistake:* Just describing the maths, overly simplistic "yes/no" without reason, missing the normative tension.

  Use british spelling, check for the deliberate typos ("monotonicty", "calcuate", "asymetrically", "individual", "invariance" maybe?), and you're golden. This should keep 'em busy for a solid hour! Good luck marking.
