  ### Mechanistic Identity Taxonomy for Cross-Deployment Model Auditing

  **Nested Decision Tree**  
  *(Begin with Q1; follow path based on answers)*  
  - **Q1:** Does mechanistic identity require shared physical implementation (identical weights/hardware)?  
    - *Yes* → **Leaf1:** Unnamed  
      - *Awkward commitment:* Flags any weight or hardware change as a mechanistic anomaly, even if the model's reasoning is functionally identical.  
    - *No* → Proceed to Q2.  
  - **Q2:** Does mechanistic identity require shared causal-graph topology (identical structure of functional units and connections)?  
    - *Yes* → **Leaf2:** Unnamed  
      - *Awkward commitment:* Requires one-to-one mapping of functional units (e.g., attention heads to experts), which fails when architectures use different computational primitives.  
    - *No* → Proceed to Q3.  
  - **Q3:** Does mechanistic identity require preservation of counterfactual intervention outcomes on intermediate representations?  
    - *Yes* → **Leaf3:** Interventionist Equivalence  
      - *Awkward commitment:* Demands identically responsive intermediates under interventions, even if representations are incommensurable (e.g., MoE experts vs. transformer heads).  
    - *No* → Proceed to Q4.  
  - **Q4:** Is preservation of information-flow topology (which channels influence which) sufficient for mechanistic identity?  
    - *Yes* → **Leaf4:** Unnamed  
      - *Awkward commitment:* Ignores causal operations, potentially masking critical algorithmic differences (e.g., spatial tracking replaced by token-based aggregation).  
    - *No* → Proceed to Q5.  
  - **Q5:** Are boundary conditions (e.g., tokenization/preprocessing) internal to the mechanism?  
    - *Yes* → **Leaf5:** Unnamed  
      - *Awkward commitment:* Treats input representation changes as mechanistic anomalies regardless of internal processing similarity.  
    - *No* → **Leaf6:** Functionalism  
      - *Awkward commitment:* Considers mechanisms identical if input-output behavior matches, even if reasoning pathways are radically different (e.g., spatial patterns vs. token correlations).  

  ---

  **Taxonomy Summary Table**  
  | Branch_Question                                                                 | Yes_Path                     | No_Path      | Leaf_Position              | Awkward_Commitment                                                                                                                                 | Gap_Diagnosis              |
  |---------------------------------------------------------------------------------|------------------------------|--------------|----------------------------|----------------------------------------------------------------------------------------------------------------------------------------------------|----------------------------|
  | Q1: Shared physical implementation?                                             | Leaf1 (unnamed)              | Q2           | Unnamed                    | Flags any weight/hardware change as anomalous, ignoring functional equivalence.                                                                    | Unattractive (overly strict for redeployment) |
  | Q2: Shared causal-graph topology?                                               | Leaf2 (unnamed)              | Q3           | Unnamed                    | Requires isomorphic functional units across architectures (e.g., heads→experts), often infeasible.                                                | Unattractive (impractical for heterogeneous systems) |
  | Q3: Preservation of counterfactual intervention outcomes?                       | Leaf3 (Interventionist Equivalence) | Q4           | Interventionist Equivalence | Needs interventions on incommensurable intermediates to yield identical outputs, testing infeasible at scale.                                     | (Named position)           |
  | Q4: Is information-flow topology sufficient?                                    | Leaf4 (unnamed)              | Q5           | Unnamed                    | Overlooks causal operations (e.g., mistaking token aggregation for spatial tracking).                                                             | Unexplored (lacks literature consensus) |
  | Q5: Are boundary conditions (tokenization, etc.) internal?                      | Leaf5 (unnamed)              | Leaf6 (Functionalism) | Unnamed (if yes); Functionalism (if no) | For *unnamed (yes)*: Input changes always anomalous. For *functionalism (no)*: Output equivalence overrides pathway differences. | Unattractive (yes); Named (no) |

  **Gap Diagnoses for Unnamed Leaves**  
  - **Leaf1, Leaf2, Leaf5:** Positions are *unattractive* for auditing, as they flag superficial changes (hardware, unit granularity, tokenization) without addressing functional reasoning fidelity.  
  - **Leaf4:** Position is *unexplored* in literature, as information-flow topology alone lacks criteria for validating causal operations.  

