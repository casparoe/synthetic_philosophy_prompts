answer: |-
  Here's the brainstorm followed by the joke, crafted with the dirty hands problem's structural tension and moral remainder at its core:

  **Brainstorm Angles:**
  1.  **The Unwashable Stain:** Focus on the *physicality* of moral remainder. The act leaves a literal/metaphorical mark (e.g., ink, grime) the politician can't remove, clashing with the pristine image they project.
  2.  **Campaign Amnesia:** The absurdity of needing to *forget* the necessary evil immediately to perform purity. Highlight the cognitive dissonance of the speechwriter crafting "never compromised" lines *while* smelling the metaphorical toxic waste deal.
  3.  **Voter Complicity:** The audience *wants* the benefit (saved school) but demands denial of the cost (toxic deal). Joke could show voters applauding purity while their kids play on the *saved* playground funded by the deal.
  4.  **The "Clean Hands" Ritual:** Satirize the performative rituals of purity (hand sanitizer obsession, white gloves, overly literal interpretations of "clean record") as frantic overcompensation for the internal stain.
  5.  **Weird Hypothetical:** What if moral remainder manifested *physically* only when lying about it? E.g., your hand turns green during the "never compromised" speech. Forces the collision into the open.
  6.  **Speechwriter's Hell:** The person writing the purity speech *knows* about the toxic deal. The joke is in crafting sentences that are technically true ("I've never accepted *personal* bribes from Big Toxico!") yet utterly betray the spirit of the necessary evil.

  **Chosen Angle:** Combine 1 (Unwashable Stain) and 5 (Manifestation During Denial) for maximum conceptual collision and visual humor. Set it during the crucial purity speech.

  ---

  **The Joke:**

  "So my friend Barry's a small-town councilor, right? Good guy, genuinely. Last year, the elementary school roof was *this* close to pancaking onto the 3rd-grade recorder concert. Only way to get the cash fast? Approve this... let's call it a 'flexible zoning interpretation'... for a new waste transfer station on old Mill Road. Barry knew it stank worse than the dumpster behind the bait shop in July. But kids trump zoning, so he did the deed. School's saved, kids are safe, Barry feels like he bathed in sludge but sleeps... kinda.

  Fast forward to re-election. His opponent’s hammering him on ‘purity’, ‘never compromising with polluters’. Barry’s team panics. They need a big speech: ‘Councilor Barry: Unbending Integrity!’ They write this soaring ode to his spotless record, his hands ‘untouched by the grime of expediency’. Barry’s rehearsing in his garage, feeling like a fraud, when he notices it... this weird, greasy black smudge on his right palm. Won’t wash off. WD-40? Nope. Industrial degreaser? Smears it. It’s like the moral remainder got bored of being philosophical and decided to unionize *on his skin*.

  Night of the big speech. Packed town hall. Barry steps up, spotless suit, manicured nails... except the greasy smudge, glowing faintly under the stage lights like an ethical parking ticket. He launches into the purity script: ‘...and I stand before you tonight with a record clean as the driven snow! No backroom deals! No dirty compromises!’ *He gestures emphatically with his right hand.* The smudge catches the light. The front row visibly recoils. ‘...because true leadership demands…’ *He tries to subtly wipe the hand on his pants. It leaves a faint smear.* ‘...demands… uh… unwavering commitment to…’ *He shoves the offending hand into his pocket.* ‘...principles! Uncompromised principles! That’s why I…’ *He instinctively pulls the hand out to gesture again, sees the smudge, freezes.* The silence is deafening. All anyone sees is this councilor, mid-sentence about his immaculate virtue, staring in horror at his own visibly dirty hand.

  He leans into the mic, sighs, and whispers: ‘Look. The school’s standing. Your kids are safe. And apparently… my soul leaks.’ Best applause line of the night. Also, he lost. Turns out voters want the guy who *did* the dirty thing... to convincingly pretend *he didn't* while *they* pretend *they don't know*. The stain? That’s just the receipt."
  ---

  **Why this hits the brief:**
  1.  **Hyper-Specific Scenario:** Toxic waste deal for school funding. Not generic "lobbyist" stuff.
  2.  **Moral Remainder Manifest:** The physical, unremovable smudge *is* the moral remainder – the persistent, undeniable stain of the necessary evil.
  3.  **Collision with Purity Performance:** The core joke *is* the impossible tension: delivering the "clean hands" speech while the evidence of dirty hands is literally visible and won't go away.
  4.  **Conceptual Punchline:** The humor isn't just "he's a hypocrite." It's the *inescapable visibility of the moral cost* (the smudge) sabotaging the *necessary performance of purity* (the speech), revealing the absurdity voters demand ("pretend he didn't while they pretend they don't know").
  5.  **"Weird Hypothetical":** Moral remainder physically manifesting *only when denying the act* sharpens the logic and creates the visual gag essential to the joke.
  6.  **Philosophically Sound:** Captures the core tension: the necessary act leaves a residue, and democratic politics demands its denial. The voter complicity ("pretend they don't know") is implied.
