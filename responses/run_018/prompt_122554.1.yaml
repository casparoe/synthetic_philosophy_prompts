prompt: |-
  I sit on a technical advisory group that a national statistics office has convened to answer two questions: what should this country's headline measure of national wellbeing be, and should the government formally adopt a target of reaching the top ten of the international happiness league table within a decade. I'm the philosopher on the group, I have to put a two-page note in front of the others in a fortnight, and before I write it I want my own position checked for consistency rather than defended. Here is where I've landed, item by item.

  (a) The quantity worth measuring is people's own evaluative judgment about how their lives are going — the standard 0–10 ladder item, or something close to it — and not an objective list of goods, and not aggregated moment-to-moment affect. My reason: how well a life is going is constitutively a matter of the subject's own point of view, so there is no better evidence about it than the person's own verdict, and no deeper fact for a list of objective conditions to be a better measure of.

  (b) The headline number should be the plain arithmetic mean of those judgments — not the share of the population above some sufficiency threshold, not an inequality-adjusted or prioritarian-weighted mean — because the mean is the honest aggregate, and anything we want to say about the shape of the distribution can be published next to it as a separate series.

  (c) I hold a priority view about justice: gains to the worst-off count for more than equal-sized gains to the comfortable, and I want that to show up in how policy options are appraised.

  (d) It is legitimate for a government to make league-table position an explicit, publicly owned objective with a named minister accountable for it. The alternative — improving wellbeing while officially not caring how we rank — strikes me as either disingenuous or a way of avoiding accountability.

  (e) The measure has to be something a government can actually move and that can be tracked at least annually; a quantity that only responds on a generational timescale is not fit to be a target, whatever its philosophical credentials.

  (f) Self-reported life evaluations are systematically distorted by adaptation. People living in chronically harsh conditions renormalise their expectations downward and report a 7 for a life that a better-off person would call a 4, so raw means flatter deprived populations and part of the international ordering is an artefact of who has learned to expect less.

  (g) The resulting comparability problem should be handled by measurement technique — for instance anchoring methods in which respondents also rate short hypothetical case descriptions, so that we can tell whether two populations are using the scale the same way — and not by mixing objective conditions into the index itself.

  (h) No weighting scheme should be imposed across countries that tells us how much income counts for relative to health, freedom or social trust. Any such weighting imports a contested view of the good life into what is supposed to be a neutral comparison.

  Two places where I feel the strain, though I may be wrong about both: I worry that (d) sits badly with (a), and I have been told that (b) betrays (c). But I suspect the real fault line is somewhere else in the set, and I would rather you found it than confirmed my hunches.

  What I want from you is an audit, not a survey of the field and not a reading list — I will supply references myself. Go through the eight commitments and tell me which pairs are genuinely in tension and which only look as though they are, ordered by severity rather than listed as equals. For each real tension, say precisely what does the work: what exactly has to give, what the cheapest revision is, and what that revision costs me elsewhere in the set. Where a technique or distinction looks like it repairs a tension but does not, say so and say why. If one single revision would clean up more than one tension at once, name it. And if there is a commitment in the set that I have not noticed is doing load-bearing work, or a tension I have not mentioned, flag that too. Finally: given the audit, tell me what the two-page note to the group should actually recommend about the headline measure and about the top-ten target, and what the strongest objection to that recommendation will be.
reasoning: |-
  Okay, the user is part of a technical advisory group for a national statistics office. They need to develop a headline measure of national wellbeing and decide on a top-ten happiness league table target. As the philosopher in the group, they've outlined eight positions (a-h) and want an internal consistency check. They're particularly concerned about potential tensions between (d) and (a), and between (b) and (c).

  First, I need to analyze each commitment and identify conflicts. The user insists on subjective evaluations (a) but also wants policy prioritization for the worst-off (c). However, they advocate for using the arithmetic mean (b), which contradicts (c) since the mean doesn't inherently prioritize the disadvantaged. That's a major tension.

  Then there's (d) about league tables as accountability tools versus (a)'s subjective focus. The user worries these clash, but I see it differently. The real issue is that adaptation effects (f) could undermine (d)'s ranking goals if scores don't reflect true wellbeing due to scale recalibration. Their solution (g) addresses this technically, so (d) and (a) aren't inherently conflicting if measurement adjusts for comparability.

  Another point: (e) demands government influence on the measure, but (f)'s adaptation implies that improving objective conditions might not raise scores if expectations adjust. This could make targets unachievable, conflicting with (e). The user's anchoring methods (g) might help but won't eliminate the problem entirely.

  The biggest conflict is between (b) and (c). Using the mean doesn't reflect the priority view. The user could publish separate inequality metrics alongside the mean, but that doesn't integrate prioritization into the headline number. Alternatives like threshold shares or weighted means might betray (b)'s "honest aggregate" principle. This tension needs explicit management in policy appraisal, not the headline measure itself.

  For recommendations, the note should maintain subjective evaluations with anchoring for comparability (a,g). Use the mean as the headline (b) but supplement with distributional data. Advocate for the top-ten target (d) while transparently addressing adaptation risks. The strongest objection will be that the mean overlooks the disadvantaged, contradicting the priority view (c). The response should clarify that the headline measure tracks overall welfare while distributional metrics guide equitable policy, keeping the two functions distinct.
answer: |-
  Here is the consistency audit of your eight commitments, ordered by severity of tension, with recommended resolutions and implications for your two-page note. The critical fault line is not where you suspected.

  ### **Severe Tensions**
  1. **`(b) Arithmetic mean` vs. `(c) Priority view`**  
     - **Tension**: The mean treats all gains equally, while (c) demands weighting gains to the worst-off more heavily. Using the mean as the headline measure directly contradicts the moral imperative in (c). Publishing distributional data "next to it" (b) does not resolve this—it merely describes inequality without embedding priority in the *headline* used for target-setting or policy appraisal.  
     - **Cheapest revision**: Keep the mean as the **headline** for transparency and tracking (per b,e), but **explicitly decouple it from policy appraisal**. Appraise policies using a separate prioritarian metric (e.g., social welfare function) that weights gains to the worst-off.  
     - **Cost**: Violates the spirit of (b)'s "honest aggregate" as the sole focus, but preserves its technical role. Requires clear distinction in your note: *"The mean tracks overall welfare; policy choices require supplemental equity-adjusted metrics."*  
     - **Why techniques fail**: Inequality indices (e.g., Gini) describe dispersion but do not encode *priority*; threshold-based measures (e.g., % above 7) ignore gains below/above thresholds. Only a weighted mean would satisfy (c), but it betrays (b) by obscuring raw evaluations.

  2. **`(d) League-table target` vs. `(f) Adaptation distortion`**  
     - **Tension**: Adaptation (f) means raw scores misrepresent true welfare gaps (e.g., deprived populations report higher scores than objective conditions warrant). A league-table target based on unadjusted scores (d) could incentivize policies that exploit adaptation (e.g., lowering expectations) rather than improving lives. This undermines (a)'s subjectivist foundation by rewarding *reported* scores over genuine wellbeing.  
     - **Cheapest revision**: Endorse the target **only if** anchored methods (g) correct scores for cross-population comparability. Reject raw-score rankings.  
     - **Cost**: Adds technical complexity to (d)’s simplicity. If anchoring is imperfect, the target remains ethically risky.  
     - **Hidden load-bearing commitment**: (g) is essential to salvage (a)+(d)+(f). Without it, (f) fatally undermines league-table legitimacy.

  ---

  ### **Moderate Tensions**
  3. **`(e) Government influence` vs. `(f) Adaptation + (a) Subjectivism`**  
     - **Tension**: If adaptation (f) biases scores, governments might struggle to "move" the measure (e) through genuine welfare improvements. Conversely, they could manipulate scores via expectation-shifting (e.g., propaganda), violating (a)'s spirit.  
     - **Resolution**: Anchoring (g) mitigates but doesn’t eliminate this. Your note must stress that policy must target *objective drivers* (income, health) even if the measure is subjective.  
     - **Why it’s manageable**: (g) and annual tracking (e) allow monitoring drift in anchoring, making manipulation detectable. Tension remains but is operational, not philosophical.

  ---

  ### **Apparent Tensions (Resolvable)**
  4. **`(d) League-table target` vs. `(a) Subjectivism`**  
     - **Why only apparent**: You fear (d) imposes external validation on (a)'s internal perspective. But (d) is about accountability, not defining wellbeing. The tension dissolves if:  
       - The target uses *self-reported* evaluations (a).  
       - Rankings are comparability-adjusted (g) to ensure scores reflect true subjective welfare.  
     - **Strain source**: The real conflict is with (f), not (a). With (g), (d) and (a) align.

  5. **`(b) Arithmetic mean` vs. `(f) Adaptation`**  
     - **Why only apparent**: Adaptation affects all aggregates equally (mean, median, thresholds). (g)’s anchoring solution resolves comparability without altering the aggregation method. Mean remains viable post-adjustment.

  ---

  ### **No Significant Tensions**
  - **(a) vs. (g)**: Anchoring techniques reinforce (a) by ensuring subjective scales are comparable.  
  - **(h) vs. others**: Rejecting cross-country weightings is consistent with subjectivism (a) and avoids political disputes.  
  - **(c) vs. (h)**: Priority view (c) applies *within* societies, not to weightings *across* domains (h). No conflict.

  ---

  ### **Unnoticed Load-Bearing Commitment**
  - **`(g) Anchoring methods`**: This is non-negotiable for your framework. It enables (a)’s subjectivism to be internationally comparable, resolves (f)’s distortion for (d), and makes (e) feasible. If anchoring fails empirically, your entire edifice collapses.

  ---

  ### **Recommendations for Your Two-Page Note**
  1. **Headline Measure**:  
     - **Adopt the arithmetic mean of self-reported life evaluations (0–10 ladder)**, adjusted via anchoring vignettes (g) to correct for adaptation (f).  
     - **Publish distributional metrics alongside it** (e.g., bottom-quintile mean, inequality indices) but keep them secondary.  
     - **Justification**: Upholds (a,b,e,f,g,h). Anchoring ensures the mean reflects comparable subjective welfare.  

  2. **Top-Ten Target**:  
     - **Conditionally endorse** a 10-year league-table target **only if** rankings use anchored scores (g). Reject raw-score rankings.  
     - **Justification**: Anchoring resolves (f)’s distortion, making rankings ethically meaningful (a,d). Accountability (d) requires this corrigibility.  

  3. **Policy Appraisal**:  
     - **Decouple the headline measure from resource allocation**. Use a prioritarian social welfare function (e.g., Atkinson index) for policy evaluation to satisfy (c).  
     - **State clearly**: *"The headline mean tracks national wellbeing; equity-adjusted metrics guide distributive justice."*  

  ---

  ### **Strongest Objection & Response**
  - **Objection**: *"By prioritizing the mean, you ignore the worst-off and betray your prioritarian commitments (c). A headline measure that doesn’t reflect moral urgency is unfit for policy."*  
  - **Response**: *"The mean’s role is measurement, not justice. It is the most transparent tracker of overall welfare (b,e). Justice requires supplemental tools: policy appraisal must use equity-weighted metrics to prioritize gains for the disadvantaged. Combining both avoids conflating welfare measurement with distributive ethics."*  

  ### **Key Revisions from Your Initial Position**
  - **Explicitly decouple the headline measure from policy appraisal** to resolve (b) vs. (c).  
  - **Make league-table target contingent on anchoring methods** to resolve (d) vs. (f).  
  - **Elevate (g) from technique to core commitment**—it enables coherence.  

  This maintains your core principles while minimizing philosophical costs. The two-page note must foreground the distinction between *tracking welfare* (mean + anchoring) and *pursuing justice* (separate prioritarian metrics).
