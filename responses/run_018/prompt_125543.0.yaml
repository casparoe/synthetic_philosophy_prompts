answer: |-
  ### Reverse Accountability Relay: Workshop Design  
  **Goal:** Make 12 grad students viscerally experience how structural defenses dissolve blame in complex systems, creating a "responsibility gap."  

  ---

  ### **Timeline (90 mins total)**  
  1. **Intro & Setup (15 mins)**  
     - Briefly share the drone-pinning incident (emphasize the "hot potato" effect).  
     - Frame the activity: *"You’re part of the decision chain for the drone system. Your job: avoid blame using your exemption card. But watch—your defense might screw someone else."*  
     - Assign roles randomly.  

  2. **Game Rules Explanation (10 mins)**  
     - Hand out **role cards** and **exemption cards** (see below).  
     - Explain scoring:  
       - Start with **10 points** each.  
       - If blamed and can’t deflect: **lose 8 points**.  
       - If group declares systemic failure (no one blamed): **all keep 10 points**.  
     - Emphasize: *"Your exemption isn’t just a 'get out of jail free' card—it actively implicates another role."*  

  3. **Gameplay (45 mins)**  
     - **Phase 1: Accident Review (10 mins)**  
       - Players read role/exemption cards. Facilitator posts the "accident report":  
         > *"Drone pinned worker due to: faulty obstacle sensor (hardware) + overridden safety protocol (software) + worker untrained on new zone layout."*  
       - Players jot down 1–2 arguments blaming another role. *No talking yet.*  

     - **Phase 2: Blame Relay (25 mins)**  
       - **Round 1:** Facilitator accuses one player (e.g., "Safety Engineer—why isn’t this your fault?").  
         - Accused plays exemption card *or* accepts blame.  
         - If exemption played, they **must name who their defense implicates** (e.g., "I followed the contract, so blame Legal!").  
       - **Chain Reaction:** Newly accused player responds. Continues until:  
         - Someone accepts blame, OR  
         - A loop forms (e.g., A blames B, B blames A), OR  
         - 5 mins of deadlock.  
       - **Round 2:** Repeat with a new starter. Do 3–4 rounds.  

     - **Phase 3: Verdict (10 mins)**  
       - Group votes: **Assign blame to one person** OR **Declare systemic failure** (no one to blame).  
       - Scoring applied.  

  4. **Debrief (20 mins)**  
     - **Guided Discussion (no jargon!):**  
       - *"How did blame 'vanish'? Where did you feel it slip away?"*  
       - *"Did anyone’s defense *depend* on someone else being at fault? How?"*  
       - *"What’s left when everyone has an alibi?"*  
     - **Map to Real World:**  
       - *"This is the responsibility gap: defenses overlap like tectonic plates, and blame falls into the cracks."*  
       - *"In the drone case, each 'not my fault' was legit alone—but together, they erased accountability."*  
     - **Honest Note (Facilitator Verbal Add):**  
       > *"This game can’t simulate the injured worker’s pain, fear, or rage. We removed their humanity to focus on the system—but in reality, that absence is where injustice lives. The 'gap' isn’t abstract; it’s a person."*  

  ---

  ### **Roles & Materials**  
  **12 Roles** (each tied to a decision in the drone system):  
  1. **Hardware Engineer** (chose cheaper sensor)  
  2. **Software Dev** (overrode safety protocol for speed)  
  3. **Safety Engineer** (approved protocol override)  
  4. **Operations Manager** (set "efficiency over safety" KPIs)  
  5. **Legal Counsel** (drafted liability-limiting contracts)  
  6. **HR Director** (cut training time to save costs)  
  7. **Regulatory Officer** (missed new drone-safety regs)  
  8. **Procurement Lead** (picked vendor with bad safety record)  
  9. **Project Manager** (rushed testing phase)  
  10. **Data Scientist** (trained AI on biased data)  
  11. **Executive Sponsor** (pushed for early launch)  
  12. **Ethics Consultant** (flagged risks but was ignored)  

  **Exemption Cards** (each blocks blame for a unique structural reason):  
  - **Hardware Engineer**: *"Design Constraint"*  
    *"Vendor options limited by Procurement’s budget. Blame them!"*  
  - **Software Dev**: *"Opacity"*  
    *"AI’s decision was unexplainable—blame Data Science!"*  
  - **Safety Engineer**: *"Contractual Compliance"*  
    *"I followed Legal’s liability waiver. Blame them!"*  
  - **Operations Manager**: *"Market Pressure"*  
    *"Execs demanded 20% faster ops. Blame Executive Sponsor!"*  
  - **Legal Counsel**: *"Regulatory Gap"*  
    *"Laws didn’t cover this case. Blame Regulatory Officer!"*  
  - **HR Director**: *"Resource Shortage"*  
    *"Budget cuts from Project Manager. Blame them!"*  
  - **Regulatory Officer**: *"Information Asymmetry"*  
    *"Procurement hid vendor flaws. Blame them!"*  
  - **Procurement Lead**: *"Third-Party Failure"*  
    *"Vendor lied about specs. Blame Hardware Engineer for not testing!"*  
  - **Project Manager**: *"Timeline Constraint"*  
    *"Execs forced deadline. Blame Executive Sponsor!"*  
  - **Data Scientist**: *"Bias in Data"*  
    *"Training data from Operations was flawed. Blame them!"*  
  - **Executive Sponsor**: *"Delegated Authority"*  
    *"Ethics Consultant approved the risks. Blame them!"*  
  - **Ethics Consultant**: *"Powerless Advisor"*  
    *"Execs ignored my report. Blame Executive Sponsor!"*  

  **Materials Needed:**  
  - Role/Exemption cards (print double-sided).  
  - Accident report poster.  
  - Timer.  
  - Scoreboard (whiteboard or digital).  
  - Sticky notes for players to jot accusations.  

  ---

  ### **Predictable Problems & Fixes**  
  1. **"Everyone gangs up on one role"**  
     - *Fix:* Remind them that exemptions must *logically implicate* another role. Facilitator intervenes: *"Does your card actually point to them?"*  

  2. **"Players too nice—no one blames anyone"**  
     - *Fix:* Incentivize point defense: *"Losing points = losing your job in this simulation."* Start rounds by accusing decisive roles (e.g., Executive Sponsor).  

  3. **"Chain reaction stalls in a loop"** (e.g., A blames B, B blames A)  
     - *Fix:* After 60 seconds, force a vote: *"Does the group accept this loop as proof of systemic failure?"*  

  4. **"Arguments get too abstract/philosophical"**  
     - *Fix:* Use the timer ruthlessly: *"30 seconds to play your card or take the blame!"*  

  5. **"One player dominates"**  
     - *Fix:* In later rounds, exclude them from being the starter.  

  ---

  ### **Why This Works**  
  - **The Twist:** Exemptions are *interdependent* (e.g., Legal’s "contract" requires Safety’s compliance, but Safety’s "contract" defense requires Legal’s clauses). When played, they expose contradictions.  
  - **Emotional Payoff:** Students *feel* the frustration of blame dissolving—like trying to grip water.  
  - **Debrief Bridges Theory:** Connects gameplay to real-world gaps without academic citations (e.g., *"Your defenses created what philosophers call 'distributed moral responsibility'—but in practice, it meant no one answered for harm."*).  

  **Final Tip:** Bring coffee. They’ll need it after realizing how easy it is for accountability to evaporate.
