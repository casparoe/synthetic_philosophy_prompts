prompt: |-
  I am a software engineer with no formal background in philosophy, and next week I am presenting to a university philosophy of law and ethics reading group. The position I defend is that karma—understood specifically as the view that moral desert tracks cetanā, volitional intention, rather than external outcomes—offers a more coherent theory of moral desert than contemporary retributivist frameworks in criminal justice, because it assesses agents by the integrity of their internal decision logic, analogously to how one evaluates a distributed software system by its procedural design rather than by accidental downstream failures. The audience comprises mainly analytic philosophers of law working within Kantian or consequentialist traditions, plus one comparative religion scholar familiar with the Pali canon; none have expertise in software engineering or distributed systems. They care about state legitimacy, proportionality in punishment, and whether religious concepts can survive secular translation without metaphysical distortion.

  Please prepare my Q&A preparation sheet: list the six or seven objections I will actually face, ordered from most damaging to least damaging, with each phrased as that specific audience would phrase it (distinguishing the philosophers of law from the religion scholar where relevant). For each objection, provide a concise reply I could deliver in about two minutes without heavy philosophical jargon; note the weakest point in that reply or where it concedes too much; and indicate what I should concede up front versus what I must hold firm. Include the one question I am hoping nobody asks—likely the challenge that a secularised, intention-based "karmic" account either cannot justify state coercion at all, or collapses into a form of character-based consequentialism. Please write the answer in British English.
