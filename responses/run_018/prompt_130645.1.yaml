  - But in social ontology, claiming "Black woman isn't woman" smuggles in metaphysical separatism 

  *flips through imaginary philosophy notes* We should flag where the slippage happens: 
  1. The fallacy of treating all compound terms like "white horse" as rigid designators 
  2. Assuming that because two terms aren't synonymous, their referents must be distinct entities 
  3. Projecting mereological essentialism onto social categories 

  *checks social ontology literature* The defensible intersectional point – that lived experience isn't additive – gets undermined by borrowing this clumsy metaphor. The slogan's appeal lies in its rhetorical punch, but it conflates: 
  - Epistemic emergence (compound concepts reveal new truths) 
  - Ontological emergence (compound categories are new substances) 

  *adjusts glasses* For the verdict menu, we must distinguish: 
  - Linguistic claims (trivial but true) 
  - Semantic claims (defensible with caveats) 
  - Metaphysical claims (usually false when applied to social kinds) 

  The user's colleagues are probably committing the "shared reference fallacy" – assuming that because "white horse" excludes non-white horses, therefore "Black woman" must exclude... what? Women-in-general? That doesn't track. 

