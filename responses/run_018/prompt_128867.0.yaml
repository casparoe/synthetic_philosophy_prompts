answer: |-
  Based on a close reading of Sidgwick's texts and his overall philosophical project, the asymmetry you perceive between his treatment of first-person moral intuitions in *The Methods of Ethics* (ME) and third-person testimony in psychical research (PR) **is real and significant, but it is *not* an arbitrary double standard.** It stems from fundamentally different epistemological contexts and the nature of the claims involved. Here's a breakdown:

  1.  **The Nature and Function of Moral Intuitions in ME:**
      *   **Foundation for Rational Ethics:** Sidgwick's intuitionism aims to establish a *rational foundation* for ethics. He seeks "clear and certain" self-evident propositions that are "immediately known" to be true upon careful reflection by a competent mind. These are not mere feelings but *rational insights* (e.g., "I ought not to prefer a lesser good to a greater good").
      *   **First-Person Authority & Dialectical Scrutiny:** Their evidence is inherently first-person. While fallible and requiring careful dialectical testing (clarity, consistency, consensus among experts), their ultimate authority resides in their *rational self-evidence to the individual thinker* engaged in rigorous reflection. Sidgwick doesn't treat them as "testimony" in the PR sense; they are the bedrock *data* of ethical reasoning itself. Their acceptance is a prerequisite for systematic ethical thought.
      *   **Scope and Necessity:** These intuitions are concerned with *necessary truths* about practical reason and value (e.g., the principle of fairness/impartiality). They are not contingent claims about specific events in the empirical world.

  2.  **The Nature and Function of Testimony in Psychical Research:**
      *   **Empirical Claims about Contingent Facts:** PR investigates alleged *empirical phenomena* (telepathy, apparitions, etc.) that are, prima facie, highly improbable and seemingly violate known natural laws. These are claims about specific, contingent events occurring in the observable world.
      *   **Third-Person Testimony as *Evidence*:** The primary data is *testimonial evidence* – reports from others about their experiences. Sidgwick treats this testimony strictly as *evidence* to be evaluated, not as self-justifying insights.
      *   **High Evidential Bar:** Given the extraordinary nature of the claims, Sidgwick applies an extremely high standard:
          *   **Corroboration:** Multiple independent witnesses reporting the same event.
          *   **Witness Reliability:** Scrutiny of witnesses' character, sanity, honesty, and observational competence.
          *   **Exclusion of Normal Explanations:** Rigorous attempts to rule out fraud, coincidence, misinterpretation, suggestion, hallucination, and other mundane causes.
          *   **Probability:** Extraordinary claims require extraordinarily strong evidence. The burden of proof is high because the claims conflict with a vast body of established scientific knowledge and everyday experience.

  3.  **The Asymmetry Explained (Why it's not a Double Standard):**
      *   **Different Domains:** ME deals with *normative, rational principles* fundamental to practical reasoning. PR deals with *descriptive, empirical phenomena* that challenge the current scientific worldview.
      *   **Different Epistemic Status:** Moral axioms in ME are treated as *necessary starting points for rational inquiry* into ethics. Their acceptance is dialectically forced upon the careful reasoner. PR testimony is treated as *contingent data* that needs to be *verified* against an existing, well-supported framework of natural knowledge.
      *   **Different Kinds of "Evidence":** The "evidence" for a moral intuition is its *rational self-evidence under reflection*. The "evidence" for a paranormal claim is the *reliability and coherence of testimonial reports* assessed against background knowledge. Sidgwick isn't weighing "testimony" in both cases; he's dealing with fundamentally different epistemological inputs – rational insight vs. empirical report.
      *   **Sidgwick's Motivation and Stakes:** Sidgwick's rigorous approach in PR wasn't born of skepticism alone, but of a desperate *hope* to find empirical support for beliefs (like personal survival) he felt were ethically necessary but rationally unjustifiable within a naturalistic worldview (the "dualism of practical reason"). His high bar in PR stemmed precisely from his desire for *irrefutable* evidence that could withstand scientific scrutiny and potentially resolve this deep existential/philosophical conflict. He *needed* the evidence to be overwhelming.

  4.  **Addressing the Tension:**
      *   **The *Real* Tension:** The genuine tension isn't primarily about inconsistent weighing of testimony, but about Sidgwick's *overall philosophical predicament*. He held:
          1.  Certain ethical propositions (e.g., the significance of justice, the potential need for immortality for cosmic justice) seem rationally self-evident and practically necessary.
          2.  A naturalistic scientific worldview provides no evidence for these necessary beliefs (like survival).
          3.  Therefore, if PR could provide *empirical* evidence for phenomena like survival (which would support the ethical intuitions), it would resolve a profound philosophical crisis.
      *   **The Evidential Asymmetry as *Consequence*:** The high bar in PR is a direct consequence of points 2 and 3. To bridge the gap between the naturalistic worldview and the ethically necessary beliefs, the empirical evidence *had* to be exceptionally strong to overcome the default scientific skepticism. The evidence for the moral axioms didn't face this hurdle because they were foundational *within* the domain of practical reason, not claims about the external world challenging scientific orthodoxy.
      *   **Consistency in Demanding Rigor:** Sidgwick applied demanding standards *within* each domain. In ethics, he ruthlessly critiqued vague "common sense" intuitions, demanding clarity and consistency. In PR, he demanded rigor in evidence collection and evaluation. The *level* of scrutiny differs because the *nature of the claim and its relationship to established knowledge* differs drastically.

  **Conclusion:**

  You have correctly identified a significant asymmetry in Sidgwick's "evidential bar" between moral intuition in ME and testimony in PR. **This asymmetry is real and textually grounded, not something you've invented.** However, it is **not a hidden double standard borne of inconsistency.** Instead, it arises logically from:

  1.  The fundamental difference between *rational self-evidence for necessary normative principles* (ethics) and *testimonial evidence for improbable empirical phenomena* (PR).
  2.  The different epistemological roles these play: foundational axioms vs. data challenging orthodoxy.
  3.  Sidgwick's specific philosophical crisis (the dualism of practical reason) and his desperate need for *unassailable empirical proof* to support ethically necessary beliefs that naturalism undermined.

  The tension lies in Sidgwick's overall philosophy, not in an inconsistent application of standards *within* the respective domains. His high bar in PR was precisely because he took the *stakes* (potentially validating core ethical intuitions about cosmic justice and survival) so incredibly seriously. He weighed testimony in PR heavily *because* he weighed his ethical intuitions so heavily. The asymmetry reflects the different *kinds* of weight involved and the different *evidential landscapes* each had to navigate. Your chapter can legitimately explore this asymmetry as a fascinating case study in Victorian struggles with epistemic authority across different domains of inquiry, highlighting how the nature of the claim profoundly shapes the required standard of proof.
