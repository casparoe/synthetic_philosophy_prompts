  Now, looking at his psychical research work with the SPR, he's dealing with empirical data. He collects testimonies about telepathy, apparitions, etc. Here, the evidence is third-person and requires rigorous scrutiny. Sidgwick applies strict criteria: corroboration, witness reliability, excluding fraud or alternative explanations. He's skeptical but open-minded, treating testimony as probabilistic rather than certain.

  The user's main concern is whether Sidgwick has a double standard. On the surface, moral intuitions get immediate epistemic authority, while paranormal claims need extensive verification. But is this asymmetry justified? I should check Sidgwick's own writings to see if he addresses this. In *Methods*, he acknowledges that moral intuitions can be fallible and require dialectical refinement. He’s not taking them at face value without critical examination. Similarly, in psychical research, he’s looking for consistent patterns that could approach the certainty of moral axioms.

  The user might be trying to highlight a tension in Victorian thought between rational introspection and empirical evidence. They need to know if their argument holds textual support. I should note that Sidgwick’s ethical intuitions are foundational for rational ethics, whereas paranormal testimony is about contingent facts. The epistemic standards differ because the domains differ. But Sidgwick himself was troubled by the conflict between his ethical intuitions and empirical worldview, which drove his interest in psychical research.

  Also, considering the user's deeper needs: they’re writing a chapter on epistemic authority. They might be exploring how Victorian philosophers allocated trust to different sources of knowledge. The real issue here is whether personal introspection holds privileged status over others' testimonies. Sidgwick’s work shows that both require scrutiny, but in ethics, the scrutiny is dialectical, while in empirical matters, it’s methodological. The user should be cautious not to overstate the asymmetry but can legitimately discuss the different evidence thresholds as reflecting domain-specific demands.

