  ### Letter Essence Verification Flowchart for Glyph 'a'
  Here's a step-by-step procedure to determine if a generated vector path retains the essential "a-ness" of your font family. The flow combines automated checks with human judgment calls, focusing on structural integrity, counter (negative space) preservation, and distinguishability from other glyphs.

  ---

  #### **Step 1: Enclosed Contour Check**
  - **Procedure**: Verify the glyph has ≥1 closed contour.  
  - **Pass**: Closed contour(s) detected → Proceed to Step 2.  
  - **Fail**: No closed contours (e.g., disjointed strokes) → **"Not an 'a'"** (Stop).  
  - *Example*: A glyph with disconnected strokes fails here.

  ---

  #### **Step 2: Counter-Entropy Validation**
  - **Procedure**:  
    1. Extract all enclosed negative spaces (counters).  
    2. Compare the **largest counter** to the prototype 'a':  
       - Area ratio (gen/prototype) must be 0.5–2.0.  
       - Centroid deviation ≤20% of the glyph's bounding box.  
  - **Pass**: Both criteria met → Proceed to Step 3.  
  - **Distortion**: Criteria not met (e.g., shrunken/offset counter) → Flag for human review later.  
