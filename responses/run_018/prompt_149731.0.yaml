  ### Final Note:
  The residue is that quantum mechanics provides a third kind of nonlocal correlation (entanglement) that is not reducible to shared seeds or message passing. This is a structural gap in the distributed systems vocabulary, which is fundamentally classical. The nonlocality debate in physics is about the reality of this third kind of correlation and its implications for our understanding of causality. Your intuition that it's about shared randomness versus message delay is correct for classical systems, but quantum mechanics adds a new resource that breaks the classical dichotomy.
