    "better_analogy": "Navigating a river with divergent forks: each path (e.g., career vs. love) leads to distinct landscapes with unique risks/rewards; choice requires reason-based deliberation (e.g., currents = constraints), but no fork is 'objectively best'—yet reasons (e.g., skill set) aren't arbitrary."  
