  ### Structured Summary Table  
  | Feature               | Radio Case                          | Value Case                                     | Match Quality |  
  |-----------------------|-------------------------------------|------------------------------------------------|---------------|  
  | **Trade-off nature**  | Dials independent; no direct harm   | Goods often antagonistic; one undermines other | Poor          |  
  | **"Noise" source**    | External (e.g., weak signal)        | Internal (e.g., moral conflict) or contextual  | Breaks        |  
  | **Reversibility**     | Infinite tuning; no cost            | Choices irreversible; alters self-conception   | Poor          |  
  | **Optimization goal** | Single-sense (audio pleasure)       | Multi-faceted (e.g., duty, growth, joy)        | Breaks        |  
