prompt: |-
  I just finished a long and somewhat heated conversation with a friend about the 2016 United Kingdom European Union membership referendum, and I am writing to ask you to work through it with me rather than leaving it at an impasse. The argument turned on who should have been counted among the demos entitled to vote, and my friend insisted that anyone significantly affected by the outcome — long-term EU residents in Britain, British citizens living permanently in other European countries, and perhaps even those who would live with the economic and environmental consequences for decades — ought to have had a voice, whereas I held that democratic legitimacy requires being subject to the laws and institutions being decided upon, which would restrict the franchise more narrowly. Rather than asking you to settle our dispute, I want you to analyze the referendum as a real-world episode through the lens of the boundary problem in democratic theory, specifically the tension between the all-affected-interests principle and the all-subjected-persons principle. I want a disciplined mapping: identify the actual franchise rules that were applied, note who was included and who was excluded under both principles, and then show what each principle says about the legitimacy of treating an advisory referendum as politically binding. But I also want you to push past the standard literature, because I think both principles miss something that this episode exposes. The referendum was technically advisory, yet Parliament and the government treated it as carrying an almost constitutional weight; does that hybrid advisory-binding status change who ought to have been included, since those bound by the result include not only current subjects but also future citizens who never authorized the decision? And if we extend the all-affected logic to unborn generations who will inherit the climate and trade commitments embedded in the withdrawal agreement, do we reach a reductio, or does it instead reveal that democratic membership has a temporal dimension that neither principle captures? Please do not survey democratic theory broadly or provide citations; instead, run the analysis in both directions, showing where the boundary problem illuminates the referendum's legitimacy and where the referendum reveals that the all-affected and all-subjected frameworks are silent about temporal authorization, advisory mandates, and the problem of representing interests that the affected parties themselves do not fully understand. Write your response as continuous prose without headings, bullet points, bold text, or tables — as one might write a long, careful letter.
reasoning: |-
  Okay, let me unpack this complex request about the Brexit referendum and democratic theory. The user is clearly well-versed in political philosophy and wants a very specific analysis, not a general overview. They're asking me to examine the franchise rules through two theoretical lenses - the all-affected principle and all-subjected principle - while pushing beyond standard theory to consider temporal dimensions and advisory-but-binding paradoxes.

  First, I need to recall the actual 2016 referendum voting criteria: UK, Irish, and Commonwealth citizens over 18 resident in UK, plus British expats abroad for less than 15 years. This excluded several groups the user mentioned - long-term EU residents in UK, British citizens abroad over 15 years, and crucially, 16-17 year olds despite the decision's long-term impact on them.

  The tension between the two democratic principles is fascinating here. The all-affected principle would logically include EU nationals in UK and young people, while the all-subjected principle aligns more closely with the actual rules by focusing on current legal subjects. But the user is right - both theories struggle with the advisory-yet-binding nature of this vote. When Parliament treated it as binding, it effectively subjected future generations to a decision they didn't authorize.

  That temporal dimension is where this gets really interesting. If we extend the all-affected principle to unborn generations facing climate and economic consequences, we hit practical absurdities - how could they vote? Yet excluding them seems unjust. The referendum exposes how static our democratic theories are - they don't account for decisions that create new political subjects (like future citizens) or bind non-subjects (like when the advisory result became de facto binding).

  The user's pushing me to notice something deeper: democratic legitimacy fractures when the decision's temporal effects outstrip its authorization mechanism. An advisory referendum morphing into binding policy creates subjects after the fact - both spatially (EU nationals suddenly non-citizens) and temporally (youth inheriting consequences). Neither principle resolves this, because they assume fixed demos boundaries.

  I should emphasize how this case reveals representation gaps too - many leave voters didn't predict the actual withdrawal terms, showing affected parties often don't understand their own interests. That cognitive limitation compounds the boundary problem.

  Ultimately, the Brexit referendum acts like a stress test for democratic theory. It shows we need to conceptualize membership as fluid across time and status, especially when advisory instruments acquire binding force. The user's insight about temporal authorization is spot-on - current theories have no vocabulary for obligations imposed on future people who couldn't consent.
answer: |-
  Let us examine this carefully, for the 2016 referendum indeed crystallizes the profound difficulties of the boundary problem in a way few real-world events do. The franchise applied was based primarily on the all-subjected-persons principle, albeit with specific historical and political contours. Eligibility required being a British, Irish, or qualifying Commonwealth citizen resident in the UK and registered to vote, or a British citizen living abroad for less than 15 years. This explicitly excluded several groups you mentioned: long-term resident EU nationals (subject to UK law but lacking citizenship), British citizens permanently settled in other EU states beyond the 15-year cutoff, and crucially, 16- and 17-year-olds (except in Scotland and Gibraltar for local elections). Under the all-subjected principle, this largely aligns with defining the demos as those presently subject to the UK state's sovereign authority – current citizens and recent expatriates bound by its laws and governance. The exclusion of resident EU nationals, while politically contentious, fits within a strict reading of this principle; they were subject to UK law but not formally members of the UK political community entitled to shape its fundamental constitutional direction.

  Applying the all-affected-interests principle, however, reveals stark exclusions. This principle demands inclusion for anyone whose significant interests are impacted by the decision. Long-term EU residents faced profound uncertainty over their residency rights and status. British citizens living permanently in the EU stood to lose crucial freedoms of movement, residence, and access to services. Young people, especially those 16-17, were denied a vote despite inheriting decades of economic, social, and geopolitical consequences far longer than most voters would experience. Furthermore, citizens of other EU states, whose union's future trajectory and cohesion were fundamentally altered, had significant interests affected yet no voice. The franchise under the all-affected principle would have been vastly broader, arguably transnational, encompassing these groups and potentially others across Europe tangibly impacted by the UK’s departure.

  The hybrid advisory-yet-binding nature of the referendum intensifies the boundary problem exponentially and exposes a critical gap in both principles. As an advisory instrument, the all-subjected principle might seem sufficient – Parliament, the sovereign body composed of elected representatives of the current demos, would retain ultimate decision-making power, theoretically able to weigh the result alongside the interests of excluded but affected parties. However, the political reality – the government and Parliament treating the result as politically, even constitutionally, binding – transformed it *de facto* into a decisive act. This *post-hoc* binding quality fundamentally changes the legitimacy calculus regarding inclusion. Those bound by the outcome now included not only the present demos who voted but also:
  1.  **The Excluded Affected:** EU residents, long-term British expats, and young voters instantly subjected to a binding decision they had no say in, despite being directly and severely impacted.
  2.  **Future Generations:** Unborn citizens who will inherit the economic structures, trade relationships, environmental regulations shaped by Brexit, and the specific terms of the withdrawal agreement. They are indisputably "affected" in the most profound, long-term sense but were inherently excluded from authorization. Neither principle adequately addresses this temporal dimension of democratic legitimacy – the binding commitment of future people who could not consent.

  Extending the all-affected logic to future generations does risk a *reductio ad absurdum* in practical terms – how can the unborn vote? – but it is not logically absurd; it reveals a genuine flaw. It highlights that major constitutional decisions with irreversible, multi-generational consequences create a legitimacy deficit because they bind future political communities who had no representation in the decision. The referendum, by morphing from advisory to binding, made this temporal disconnect explicit and unavoidable. The standard all-affected and all-subjected principles operate within a synchronic frame, assuming a relatively stable present demos making decisions primarily impacting themselves. The Brexit vote, particularly given its binding interpretation, was profoundly diachronic – it launched a process fundamentally reshaping the political and legal landscape for decades, creating new subjects (future UK citizens living under the new regime) and new classes of the affected (those within the UK and EU dealing with long-term consequences) who were not part of the initial authorization.

  Furthermore, the referendum exposes another silence in the principles: the problem of understanding one's own interests. Many voters, arguably, did not fully comprehend the complex, long-term economic, legal, and geopolitical ramifications of leaving the EU. The campaign was marked by misinformation and oversimplification. This raises the question: if the "affected" cannot accurately foresee the consequences affecting their interests, does the democratic legitimacy of the decision diminish? Both principles assume that included voters can rationally assess their interests. The Brexit experience suggests that for decisions of vast complexity and long time horizons, this assumption is often flawed. Representing the interests of future generations or even accurately assessing one's own long-term interests becomes immensely challenging, yet the binding nature of the decision demands consideration of those very interests.

  In conclusion, mapping the referendum through the boundary problem illuminates its contested legitimacy. The actual franchise aligned with a narrow all-subjected reading but violated the all-affected principle by excluding significantly impacted groups. However, the referendum's unique status – advisory in law but binding in political effect – and its profound temporal consequences expose limitations in both principles. They fail to account adequately for the legitimacy of binding future generations who cannot authorize the decision and for the challenge of representing complex, poorly understood long-term interests, including those of the unborn. The Brexit referendum thus stands not just as a dispute about who voted, but as a stark case study revealing that democratic theory must grapple more seriously with time: the time between vote and consequence, the binding of future citizens, and the difficulty of knowing interests across extended temporal horizons when making irrevocable constitutional choices. The boundary problem isn't merely spatial; it is deeply temporal, and this vote made that inescapably clear.
