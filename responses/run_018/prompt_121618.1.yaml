  hey so ive been mulling over this thing about music vs other arts. like a painting is always of something — a tree, a face — and even abstract painting is still colors and shapes you can point at. but instrumental music doesnt seem to be 'of' anything in the world. i noticed people use this to argue music is closer to some hidden reality, not further away. but then i saw someone extend that to white noise or silence, saying those are even closer because they have zero form at all, and that felt like the same move pushed too far. is there a name for this pattern — where the less an art copies visible things, the more people claim it touches the 'real' thing underneath? i think some old philosopher said music is special this way, but i dont remember who. is my version actually the same idea, or different because im dragging noise and silence into it? im not after a reading list, just want to know if this carving holds water and where the edges are.
