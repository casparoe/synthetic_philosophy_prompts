  The model answer must hit: why maximal specificity fails (sparse cells); why equally good partitions undermine uniqueness; why robustness either collapses or needs justification; why the disagreement meta-class regresses; and why predictive equivalence doesn't resolve ontology. The marking scheme allocates 4 marks per must-hit point, with typical errors noted (e.g., missing that maximal specificity requires discarding variables).

  Separating A from B: A answers proactively dissect the robustness dilemma and meta-class regression, while B answers reactively describe the problem. Reciting signs include canned historical examples or undefined jargon.

