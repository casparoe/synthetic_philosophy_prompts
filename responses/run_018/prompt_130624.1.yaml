answer: |-
  ### (1) Exam Question  
  **PHIL 498: Advanced Topics in Practical Reason**  
  **Time Allowed:** 90 minutes  
  **Word Limit:** 800 words  

  **Prompt:**  
  The *Astra Initiative* is a 30-year multinational collaboration involving 200+ scientists dedicated to developing "cosmic unification theory" (CUT). CUT posits that all fundamental forces derive from a single quantum-gravitational substrate. The project has generated shared methodologies, cross-cultural epistemic norms, and a collective identity as pioneers of "post-Einsteinian physics." After decades of investment, new evidence from deep-space observatories systematically contradicts CUT’s core predictions. Abandoning CUT would dismantle funding networks, terminate early-career researchers’ livelihoods, and dissolve the community’s normative self-conception.  

  Critics invoke *allocative rationality*: past investments are irrelevant to future choices; only projected costs/benefits matter. Proponents argue *project-embedded commitment*: the collaboration constitutes scientists’ practical identities, so withdrawal would fragment their diachronic agency.  

  **Argue whether honoring sunk costs by continuing the Astra Initiative can be rational *without* collapsing into the sunk cost fallacy. In your analysis:**  
  - Diagnose where allocative rationality correctly identifies irrationality.  
  - Explain how project-embedded commitment *might* justify continuity.  
  - Delimit the conditions under which such commitment becomes self-undermining.  

  *Do not rehearse the standard sunk cost fallacy definition. Focus on the conceptual tension above.*  

  ---

  ### (2) Model Answer (≈600 words)  
  The Astra dilemma forces us to reconcile two rational frameworks. Allocative rationality rightly insists that sunk costs cannot justify future expenditure alone: pouring resources into CUT *because* of prior investment *would* be fallacious if motivated solely by loss-aversion or retrospective justification. When scientists conflate emotional attachment (e.g., pride in decades of work) with rational justification, they err. Allocative thinking correctly demands that new evidence dominates decision-making; if CUT’s falsification renders future success improbable, persisting merely to "validate" past sacrifices is irrational.  

  However, allocative rationality fails to address how projects constitute practical identity. The Astra collaboration is not just a funding stream but a *collective epistemic project* that shapes scientists’ agency across time. Their shared norms—peer-review protocols, cross-disciplinary dialogue—form a scaffold for individual and group rationality. Abandoning CUT risks more than wasted funds: it dissolves the structure through which participants understand their life’s work and mutual obligations. When a project is identity-constitutive, continuity preserves diachronic coherence. For example, a junior researcher’s training in CUT’s methods makes her competence dependent on the project’s survival; withdrawal severs her from her own skillset’s context. Here, honoring sunk costs reflects not fallacy but *self-continuity*—maintaining the practical framework enabling future agency.  

  Yet project-embedded commitment becomes self-undermining when it ignores *internal* rational constraints. If disconfirming evidence invalidates CUT’s core axioms so thoroughly that the project can only persist through ad hoc adjustments (e.g., dismissing data as "anomalies" without testable revisions), commitment turns dogmatic. Rationality requires that identity-constitutive projects remain responsive to their *own standards of success*. Astra scientists’ identity is built on fidelity to empirical rigor—the very norm now threatened by their theory’s failure. Persisting while suppressing counter-evidence corrupts their epistemic identity, rendering continuity incoherent. At this boundary, allocative rationality rightly intervenes: when the project’s constitutive norms (e.g., empirical accountability) are betrayed by its continuation, "honoring commitment" collapses into self-deception.  

  Thus, continuity is rational only if:  
  1. **The project retains capacity for self-correction**: CUT can be adaptively revised (e.g., narrowing its scope) without abandoning its identity-giving core.  
  2. **Identity preservation outweighs opportunity costs**: Alternative projects cannot offer comparable agential coherence (e.g., no equivalent collaborative framework exists).  
  3. **Commitment serves future agency**: Persistence enables skills/norms transferable to new challenges.  

  If Astra’s evidence crisis leaves no path for theory adaptation *while upholding scientific integrity*, commitment becomes irrational. Sunk costs remain irrelevant; what matters is whether the project can evolve without annihilating the identity it sustains.  

  ---

  ### (3) Marking Scheme (Total: 25 points)  
  **A-Grade Answers (20–25 pts) Must Demonstrate:**  
  | **Criteria**                          | **Points** |  
  |---------------------------------------|------------|  
  | **1. Critique of Allocative Rationality (AR):**  | |  
   • Clearly explains AR’s core claim (past costs ≠ future justification) | 2 |  
   • Identifies where AR *correctly* flags fallacy (e.g., emotional bias masquerading as reason) | 3 |  
   • Diagnoses AR’s *blind spot*: reduction of agency to discrete choices, ignoring identity-constitution | 3 |  
  | **2. Defense of Project-Embedded Commitment (PEC):** | |  
   • Distinguishes PEC from emotional attachment/loyalty (e.g., "pride" vs. "practical selfhood") | 3 |  
   • Explains how Astra’s dissolution threatens *diachronic coherence* (e.g., skills/norms losing context) | 3 |  
   • Argues why PEC isn’t sunk-cost fallacy: continuity serves *future* agency, not past validation | 3 |  
  | **3. Boundary Conditions:** | |  
   • Identifies when PEC becomes irrational: project undermines *its own constitutive norms* (e.g., suppressing evidence violates scientific identity) | 4 |  
   • Specifies conditions for rational continuity (e.g., adaptability, irreplaceable agential value) | 2 |  
  | **4. Structure & Precision:** Logical flow; avoids ambiguity; meets word limit | 2 |  

  **Common Errors (Deduct 1–3 pts per occurrence):**  
  - Conflating collective identity with group loyalty or tribalism.  
  - Equating all long-term projects (e.g., "Marriages also have sunk costs!").  
  - Suggesting emotional attachment justifies persistence.  
  - Failing to distinguish self-correction from ad hoc evasion.  
  - Rehearsing textbook sunk cost fallacy without engaging PEC.  

  **Failures (Below 12 pts):**  
  - Misdefining allocative rationality/PEC.  
  - Claiming sunk costs *always* or *never* matter.  
  - Ignoring the evidence’s role in undermining rational commitment.  

  ---

  ### Design Notes for Journalist:  
  - **Conceptual Crux**: Forces students to adjudicate between AR’s forward-looking efficiency and PEC’s narrative agency, avoiding familiar fallacy debates.  
  - **Originality**: The "self-undermining commitment" boundary (where identity norms conflict with project survival) is underexplored in intro texts.  
  - **Real-World Resonance**: Mirrors cases like Superconducting Super Collider cancellation or paradigm shifts in cosmology.  
  - **Depth Without Obscurity**: No citations needed—rigor emerges from applying the tension to the case’s specifics.  

  This assesses whether students can *use* philosophical tools to navigate a live problem, rewarding nuance over recitation.
