prompt: |-
  I'm putting together a proposal for a small six-month philosophy grant (part-time, mostly writing) and I need help framing the question. I'm interested in refugees and asylum, but I want to get away from the usual "who counts under the standard legal definition" debate. Instead I'm wondering whether obligations to admit people should track something like a state's "causal footprint" — the degree to which its past and present policys (emissions, arms exports, trade rules) contributed to the conditions that made flight necessary — rather than just borders or nationality. Specifically, does that footprint create stronger admission duties toward the particular populations affected, and does it apply differently to climate-induced displacement versus classic political persecution? Or is this just corrective justice in disguise, and I'm helping myself to a distinction without a difference?

  Turn this into a proper proposal: state the question precisely, explain why the standard sovereignty-vs-cosmopolitan framing leaves it open, lay out the method (conceptual analysis with a couple of case comparisons, no empirical fieldwork), describe what a useful deliverable looks like for people actually working on admission policy, and say honestly what would count as the project failing or being too big for six months. Don't include a bibliography or reading list — I'll fill in referances myself. Also be self-critical: tell me what argument or consideration would change your mind about using causal footprint as the central frame, and point out where your reasoning is most likely to be shaky or circular.
