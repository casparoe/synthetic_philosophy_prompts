  The standard sovereignty vs. cosmopolitan debate doesn’t address causal responsibility adequately. Sovereignty arguments might ignore external impacts, while cosmopolitan views focus on need or membership. The causal footprint introduces a different angle: direct responsibility for harm leading to displacement. But I should point out where that distinction might blur, especially with corrective justice.

