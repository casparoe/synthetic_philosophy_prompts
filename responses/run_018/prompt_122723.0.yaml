prompt: |-
  Hi — I'm a journalist covering science and ideas, and I file two or three pieces a week off single papers, usually around 800 words, usually with about a day between the embargo lifting and my deadline. Most of what crosses my desk lately is modelling work: some formal or computational model of households, or cells, or a climate subsystem, or people on a network, and then a headline claim on top of it. And i keep hitting the same wall.

  The models obviously rest on assumptions that everyone in the field knows are false — fully optimizing agents, well-mixed populations, costless adjustment, no measurement error, one representative everything — and the standard reply, in the Friedman vein, is that unrealistic assumptions are fine, even a sign of a good theory, as long as the predictions come out right. Fine in principle. But I have to decide, in ten minutes, without reading the appendix and mostly without being able to follow the math, whether the false assumptions in *this* paper are the harmless kind or the kind where the headline result is basically baked into the setup before anyone runs anything.

  I've got a rough distinction I half-use and can't apply reliably, and I want it turned into something I can actually run. Four moving parts, as I see them:

  1. Load-bearing vs. scaffolding. Some assumptions are there to make the thing solvable; others are doing the actual causal work in producing the result. My test so far is: would flipping the assumption to roughly its opposite flip or kill the result? But I can almost never tell that from the paper, so I need something readable off the text.

  2. Direction of error. Every unrealistic assumption errs in some direction, not just "some amount". If the direction it errs in is the same direction as the paper's headline claim — a model that assumes adjustment is frictionless and cheap, finding that a policy is cheap — then part of the result looks built in rather than discovered.

  3. Target-matching. Is the model meant to be about one specific real system (a prediction), about a whole class of systems (a mechanism), or only a demonstration that something *could* happen (a how-possibly claim)? I keep turning possibility results into "here's why X happens" stories and my editor catches maybe half of them.

  4. Laundered assumptions. Some of these things are just field conventions that get repeated from paper to paper until the intro reads as if they were measured. Twenty years of "assume homogeneous mixing" and it stops sounding like an assumption. I can't tell the conventions from the findings, and I'm wary of my procedure just rubber-stamping whatever a subfield always does.

  What I want from you: a short decision procedure I can run on a PDF in ten minutes. Questions in order; what counts as a sufficient answer to each; where the procedure stops with a no; and where it hands the decision back to me or my editor because it's a judgment call rather than something the paper settles.

  Constraints on what I can actually check: the abstract, the intro's framing of what the model is for, the model section's structure and headings, the tables, and anything the paper says about robustness, extensions, relaxing assumptions, calibration or sensitivity. If I have a day I can email the author one question. What I can't do: read the math, verify whether other groups relaxed the assumption, or chase up references — so please don't give me a reading list or point me at papers, I won't be able to follow them.

  The output should end in three things: one of a few concrete hedging levels I can hand my editor; a single sentence of plain English describing the assumption that I paste into the piece somewhere; and the one question actually worth emailing.

  Then run it on three cases, including at least one where I won't like the answer:

  — A macro-ish paper using a dynamic model with fully optimizing forward-looking households and frictionless reallocation, finding that a large new subsidy roughly pays for itself within a decade. Great story, my editor wants it, I want it, and I suspect your procedure tells me the answer I don't want.

  — A compartmental disease model with homogeneous mixing and no behavioural response, projecting a wildlife pathogen under two management options two years out, where the projected numbers differ a lot between the options and the state agency is deciding next month.

  — A minimal model of social learning where agents copy neighbours more when the neighbours are similar to them, finding that even mild similarity bias produces near-total fragmentation. I want to write "here's why we're so polarized." I have a feeling this is a how-possibly result that is one step short of being true by construction, but I can't say why.

  Finally: be straight with me about what the procedure can't do. The cases it can't settle, the ways it'll misfire (I'm defintely worried about it being lenient toward conventions just because they're conventional, and about me confusing "I don't get it" with "the assumption is doing work"), and the point where over-hedging stops being honesty and starts costing me stories that were fine. Where do I just have to make a call about what readers deserve?
reasoning: |-
  Okay, let me approach this systematically. The user is a science journalist facing a common but challenging dilemma: quickly evaluating model-based papers despite unrealistic assumptions. Their core need is a practical decision procedure that fits within severe time constraints (10 minutes per paper) and limited technical access (can't parse math or dig into appendices).

  The user's pain points are well-defined: distinguishing consequential vs harmless assumptions, identifying baked-in results, recognizing how-possibly claims, and spotting laundered conventions. Their proposed framework (load-bearing vs scaffolding, direction of error etc.) shows they've deeply considered the problem but need operationalization.

  For the decision procedure design, I'll focus on elements they can visually scan: abstract claims, intro framing, section headings, robustness statements, and sensitivity tables. The output must be actionable - concrete hedging levels, quotable assumption descriptions, and one precise email question.

  I'm particularly mindful of their constraints:
  - No math parsing
  - No reference chasing
  - Maximum one author email
  - Editor-friendly outputs

  The three test cases cover their typical workload:
  1. Macro model with frictionless optimization (likely problematic)
  2. Disease projection (needs reality-checking)
  3. Polarization model (how-possibly trap)

  For each, I'll simulate the 10-minute scan:
  - Macro case: Will flag the frictionless assumption as load-bearing and error-direction-aligned, requiring strong hedging
  - Disease model: Will emphasize calibration checks and behavioral response omission
  - Polarization: Will identify as how-possibly and note similarity bias as defining feature

  The procedure's limitations section will address:
  - Conventions masquerading as findings
  - False negatives from opaque robustness checks
  - When to accept necessary simplifications
  - Editor negotiations about acceptable uncertainty

  Key innovations in the response:
  - The "Result Baked?" flowchart for visual thinkers
  - Distilling assumption impact to one plain-English sentence
  - Specific email templates that force authors to reveal model brittleness
  - Clear hedging levels tied to journalistic responsibility

  This balances methodological rigor with practical utility, giving the user what they explicitly requested while subtly educating them to spot assumption laundering - exactly what an expert science journalist needs to maintain both accuracy and productivity.
answer: |-
  Here's a practical 10-minute decision procedure tailored to your constraints, designed to flag critical assumption risks in modeling papers. It prioritizes scannable sections and generates actionable outputs.

  **Decision Procedure: The Assumption Sanity Check**

  Run these steps in order. Stop at any "NO" and hedge accordingly. If you reach the end without hard stops, proceed with caution.

  1.  **Purpose Check (Target-Matching):**
      *   *Scan:* Abstract + Intro's "contribution" or "objective" section.
      *   *Question:* Does the paper explicitly state this is a **prediction** for a specific real-world system (e.g., "forecast pathogen spread in Region X") OR a **how-possibly** / existence proof ("show polarization *can* emerge")?
      *   *Sufficient Answer:* Explicit wording like "predict," "forecast," "project" (specific) vs. "demonstrate," "show possible," "existence proof," "theoretical possibility" (how-possibly). If unclear, scan the Discussion/Conclusion for hedging language ("suggests," "might," "could").
      *   *Stop if:* **NO** - The paper claims a *specific prediction* ("Policy Y will save $Z") *but* the framing/methodology is clearly how-possibly (simple model, no calibration to specific data, minimal realism claims). *Hedge Level: STRONG.*
      *   *Judgment Call:* If ambiguous (e.g., "explain polarization" using a minimal model), lean towards how-possibly unless robust calibration is claimed.

  2.  **Assumption Spotlight (Load-Bearing & Direction of Error - First Pass):**
      *   *Scan:* Model section headings/subheadings & Intro's "key assumptions" (if any). Skim for bold/unusual assumptions. *Ignore standard field conventions for now.*
      *   *Question:* Is there **one core, clearly unrealistic assumption** *directly enabling* the headline mechanism or result *and* its direction of error *aligns* with the result?
      *   *Sufficient Answer:* Look for assumptions that are:
          *   Essential to the core mechanism described (e.g., frictionless adjustment enabling rapid policy response; similarity bias *being* the fragmentation driver).
          *   Explicitly acknowledged as unrealistic/simplifying.
          *   Where flipping it seems likely to weaken/reverse the result *and* the error direction feeds the result (frictionless -> cheap policy; no behavior -> bigger projected outbreak difference; similarity bias -> fragmentation).
      *   *Stop if:* **YES** - A core, unrealistic, error-direction-aligned assumption is blatantly central. *Hedge Level: MODERATE to STRONG* (depending on severity).
      *   *Judgment Call:* Is this assumption the *engine* or just the *chassis*? If it feels like the engine driving the specific headline result, flag it.

  3.  **Robustness/Sensitivity Scan (Load-Bearing & Laundered Assumptions):**
      *   *Scan:* Headings for "Robustness," "Sensitivity," "Extensions," "Alternative Specifications." Skim tables/results text in these sections. Look for *any* mention of relaxing assumptions.
      *   *Question:* Does the paper **test relaxing key unrealistic assumptions** (especially standard field conventions or those flagged in Step 2) and show the headline result **holds qualitatively**?
      *   *Sufficient Answer:* Explicit mention of relaxing an assumption *and* reporting that the core finding persists (e.g., "results robust to introducing adjustment costs," "similar fragmentation observed with heterogeneous mixing," "qualitative findings hold with imperfect optimization"). Tables showing results under alternative specs.
      *   *Stop if:* **NO** - No robustness checks on key unrealistic assumptions (especially field conventions like homogeneous mixing or perfect rationality mentioned in the model section). *Hedge Level: MODERATE.* Laundered assumptions are now suspect.
      *   *Judgment Call:* If robustness checks exist but seem token (only minor variations) or ignore the *most* problematic assumption, remain wary.

  4.  **Calibration/Validation Gut Check (Target-Matching & Load-Bearing - Reality Anchor):**
      *   *Scan:* Abstract/Intro for claims of calibration/validation. Headings for "Calibration," "Parameterization," "Validation," "Data." Skim tables showing parameter sources/values.
      *   *Question:* If claiming **prediction** or **explanation** (not just how-possibly), is there **evidence the model outputs meaningfully match *relevant* real-world data** beyond just fitting a few aggregate stats?
      *   *Sufficient Answer:* Clear description of parameters based on empirical studies (not just "standard values") *and* comparison of model outputs (not just inputs) to historical data/observed patterns relevant to the headline claim (e.g., past policy cost impacts, historical outbreak curves, observed polarization metrics). Tables showing fit statistics or validation plots.
      *   *Stop if:* **NO** - Paper claims predictive/explanatory power but lacks convincing empirical grounding of the model's *output* behavior for the specific context. *Hedge Level: MODERATE to STRONG* (crucial for predictive claims).
      *   *Judgment Call:* Deep calibration is rare. Look for *any* serious attempt beyond hand-waving. "Standard parameters" alone are weak.

  **Output Generation:**

  *   **Hedging Level:**
      *   **MINIMAL:** Passed Steps 1-4 smoothly (Clear how-possibly OR predictive claim with strong robustness/calibration). Hedging: "suggests," "the model indicates," "points to a possible mechanism."
      *   **MODERATE:** Stopped at Step 3 (Missing robustness) or ambiguous Step 1/Step 4 (Weak calibration for predictive claim). Hedging: "according to this model, which assumes X," "simulations show," "results depend critically on X," "a theoretical exploration suggests."
      *   **STRONG:** Stopped at Step 1 (How-possibly mislabeled as prediction) or Step 2 (Core baked-in assumption). Hedging: "demonstrates a theoretical possibility," "a highly simplified model finds," "based on assumptions including X, which may overstate Y," "the result hinges critically on X."
  *   **Plain English Assumption Sentence:** Pick the *most critical* assumption identified (Step 2 or lack of robustness in Step 3). Phrase neutrally: "The model assumes [Assumption - e.g., people can change jobs or spending instantly with no cost]" or "The analysis did not test how the results change if [Relaxed Assumption - e.g., disease spread isn't perfectly uniform across the population]."
  *   **Email Question:** Only if Step 3 (Robustness) was the main stop and the paper is otherwise high-priority: **"Your core finding [State Headline Finding] relies on assumption [X - e.g., frictionless adjustment / homogeneous mixing]. Did you test relaxing this assumption (e.g., by adding [specific cost/heterogeneity])? If so, how did the qualitative result change? If not, how critical do you believe this assumption is to your main conclusion?"** (Forces them to admit brittleness or claim robustness not in the paper).

  ---

  **Running the Cases:**

  1.  **Macro Subsidy Paper (Frictionless Optimization):**
      *   **Step 1 (Purpose):** Likely framed as prediction/explanation ("subsidy pays for itself"). Not obviously how-possibly. -> Pass (Judgment: Proceed cautiously).
      *   **Step 2 (Assumption Spotlight):** **YES.** "Fully optimizing forward-looking households and frictionless reallocation" is core, blatantly unrealistic, error-direction-aligned (assumes easy/cheap adjustment -> finds policy is cheap). This *is* the engine enabling the rapid payback. **STOP. Hedge Level: STRONG.**
      *   **Assumption Sentence:** "The model assumes households and businesses can instantly and costlessly adjust their spending, investments, and jobs in response to the subsidy."
      *   **Email Question:** Not priority (Stopped early). If forced: "Given the result relies on frictionless adjustment, what specific evidence suggests real-world adjustment would be fast and cheap enough to achieve this payback timeline?"
      *   **Output:** Strong hedge. "A theoretical economic model, assuming instant and costless adjustments by households and businesses, projects that the subsidy could largely pay for itself within a decade." (Note use of "theoretical," "assuming," "could").

  2.  **Wildlife Pathogen Model (Homogeneous Mixing, No Behavior):**
      *   **Step 1 (Purpose):** Explicit prediction ("projecting... under two options"). -> Pass.
      *   **Step 2 (Assumption Spotlight):** "Homogeneous mixing" and "no behavioral response" are unrealistic. Direction: Assumes faster/more uniform spread -> likely exaggerates differences between interventions? Maybe. Not *blatantly* central like Macro case. -> Pass (Judgment: Flag, but check robustness).
      *   **Step 3 (Robustness):** **NO.** High chance these are laundered field conventions. Scan robustness section: Unlikely to find "tested with heterogeneous mixing" or "added behavioral feedback." **STOP. Hedge Level: MODERATE.**
      *   **Assumption Sentence:** "The projections assume the disease spreads uniformly through the population and that animal behavior doesn't change in response to the disease or management actions."
      *   **Email Question:** **YES - Send:** "Your projections for Option A vs B rely on homogeneous mixing and no behavioral response. Did you test relaxing these (e.g., introducing contact heterogeneity or simple avoidance behavior)? If so, how did the relative difference between options change? If not, how critical are these assumptions to the projected outcome difference?"
      *   **Output:** Moderate hedge. "Computer simulations project significant differences in outbreak size between the two management options over two years. However, these projections assume the disease spreads uniformly and animal behavior remains unchanged, factors not tested in the model that could influence the results."

  3.  **Social Learning / Polarization Model (Similarity Bias):**
      *   **Step 1 (Purpose):** Framing likely ambiguous ("explain polarization," "show fragmentation emerges"). Scan Conclusion: Likely says "demonstrates," "suggests a mechanism." -> **NO.** This is fundamentally a **how-possibly** result mis-presentable as explanation. **STOP. Hedge Level: STRONG.**
      *   **Assumption Sentence:** "The model demonstrates that polarization *can* emerge in a simulated network when individuals are slightly more likely to copy opinions of others similar to themselves."
      *   **Email Question:** Not needed (Stopped early). If clarity needed: "You demonstrate that similarity bias *can* cause fragmentation. What empirical evidence suggests this specific mechanism, at the modeled strength, is a primary driver of real-world polarization, compared to other factors like media or conflict?"
      *   **Output:** Strong hedge. "A simplified theoretical model shows how a tendency for people to preferentially adopt the views of those similar to themselves could, over time, lead to complete social fragmentation, demonstrating one possible mechanism behind polarization." (Key words: "simplified," "theoretical," "shows how... could," "demonstrating one possible mechanism").

  ---

  **What the Procedure CAN'T Do (Be Straight):**

  1.  **Detect Subtle Conventions:** It relies on you spotting common assumptions (homogeneous mixing, rationality) in the Model section. If a field's entire foundation rests on a laundered assumption (e.g., a specific utility function), it might slip through if not flagged in Step 2. *Mitigation:* Learn the top 2-3 standard assumptions in fields you cover often.
  2.  **Gauge Calibration Depth:** Step 4 is a gut check. It can't tell if the calibration is cherry-picked or superficial. A paper can pass Step 4 weakly. *Mitigation:* If predictive claim is central, the "Email Question" could probe calibration validity.
  3.  **Evaluate Math Complexity Hiding:** An assumption might be buried in an equation you skip. Robustness checks might be mathematically opaque. *Mitigation:* Steps 2 & 3 rely on authors *stating* assumptions and robustness *textually*.
  4.  **Assess "Importance" vs. "Baked-in":** The procedure flags *risk*, not *fatal flaw*. A result might be robust *despite* a baked-in assumption, or fragile for unseen reasons. Step 3 is your best shield here.
  5.  **Solve Ambiguous Framing:** Step 1 is critical and subjective. "Explains" is a red flag for minimal models. When in doubt, lean towards how-possibly.
  6.  **Prevent Over-Hedging:** Flagging every assumption kills stories. Use the stops judiciously:
      *   **STRONG Hedge:** Reserve for clear how-possibly-as-prediction (Step 1 stop) or undeniable baked-in core assumption (Step 2 stop).
      *   **MODERATE Hedge:** For missing robustness (Step 3 stop) or weak calibration (Step 4 stop). This is your most common output.
      *   **MINIMAL Hedge:** Use only when all steps pass clearly (robustness *shown*, calibration *decent* for prediction, no glaring baked-in engine).

  **Where You Make the Call (What Readers Deserve):**

  1.  **The "Good Enough" Predictive Model:** If a model has decent calibration and *some* robustness, even with simplifications, and the policy decision is urgent (e.g., the wildlife pathogen), a MODERATE hedge might suffice. Readers deserve the *best available* insight, acknowledging uncertainty. Don't let perfect be the enemy of good science *communication*.
  2.  **The Elegant How-Possibly:** These are important science! Don't dismiss them. Frame them correctly (STRONG hedge) as "look at this interesting possibility/mechanism," not "this is why X happens." Readers deserve wonder about mechanisms, not false certainty.
  3.  **The Field Convention:** If *every* model in a field uses assumption X, and robustness is never shown, but predictions are often decent, is MODERATE hedge enough? Probably, but explicitly state the assumption (Sentence) and note it's standard. Readers deserve to know the model's reality anchor points.
  4.  **Your Skepticism vs. Your Ignorance:** Be brutally honest. Is your "this feels baked-in" instinct based on the model's structure (Step 2)? Or is it because you don't grasp the math? If the latter, Step 3 (Robustness) is your safety net. If robustness is absent, hedge MODERATELY. If robustness exists, trust it (MINIMAL/MODERATE hedge) unless you have a *specific, articulable* reason not to (e.g., robustness test looks trivial).

  **The Bottom Line:** This procedure systematizes your instincts using accessible text. It flags the biggest red flags (mis-framed how-possibly, undeniable baked-in engines, total lack of robustness) for STRONG/MODERATE hedging. It forces you to explicitly state a key limitation. It gives you *one* high-value email question. It won't make you an expert modeler, but it will make you a far more discerning consumer of models under deadline pressure. Use the hedging levels as communication tools with your editor – explain *why* a piece needs a MODERATE hedge (e.g., "standard assumption X wasn't tested for robustness"). That builds trust and protects your credibility.
