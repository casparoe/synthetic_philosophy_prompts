answer: |-
  ### Philosophy of Metaphysics Examination Question  
  **Time Allowed:** 90 minutes  
  **Word Limit:** Approx. 1200 words  

  **Question:**  
  Consider a modified version of Max Black’s symmetric universe containing *only* two iron spheres. They are:  
  - Spatially symmetric (e.g., mirrored across a central plane)  
  - Observationally identical in all measurable respects (mass, charge, temperature, etc.)  
  - Subject to identical causal laws.  

  However, **Sphere A** instantiates property *F* **essentially** (i.e., *F* is part of A’s nature; A could not exist without *F*), while **Sphere B** instantiates *F* **accidentally** (i.e., *F* is contingent to B’s existence; B could exist without *F*). Critically, *F* has *no observational manifestation*: it cannot be detected, measured, or inferred from any spatial, causal, or relational feature.  

  Does this essential/accidental distinction rescue the Principle of Identity of Indiscernibles (PII) from Black’s counterexample? Or does it render PII circular by presupposing an ungrounded intrinsic difference between the spheres?  

  In your response:  
  1. Define PII and explain Black’s original challenge using indiscernible spheres. *(~15 mins)*  
  2. Distinguish **intrinsic properties** (belonging to an object independently) from **relational properties** (dependent on other entities), clarifying why spatial relations (e.g., "being 5m left of another sphere") *cannot* ground numerical difference here. *(~20 mins)*  
  3. Analyze whether *F*’s modal status (essential vs. accidental) constitutes a genuine, non-relational difference that satisfies PII. *(~30 mins)*  
  4. Address whether grounding numerical difference in *essential* properties smuggles in a prior, unexplained distinction, making PII circular. *(~25 mins)*  

  ---

  ### Model Answer (Structured Around Four Required Moves)  

  **Move 1: Black’s Challenge and PII Definition**  
  PII states that if two entities share *all* properties identically, they are numerically identical (i.e., only one entity exists). Black’s counterexample posits two qualitatively identical spheres in a symmetric universe. Since all their intrinsic (e.g., mass) and relational (e.g., distance apart) properties are identical, PII would demand they are one object—yet intuitively, two distinct spheres exist. This challenges PII’s necessity.  
  *(Characteristic Mistake: Misrepresenting PII as requiring *observational* differences or conflating it with epistemic individuation.)*  

  **Move 2: Intrinsic vs. Relational Properties**  
  An intrinsic property (e.g., mass) depends solely on the object itself, while a relational property (e.g., "being 5m from Sphere A") depends on other entities. Spatial relations (e.g., "left/right of") are relational: swapping the spheres would change *which* sphere has "left-of-B" but preserves the *relational structure*. Since the universe is symmetric, *no relational property* distinguishes the spheres intrinsically; they remain indiscernible *as individuals*.  
  *(Characteristic Mistake: Claiming spatial positions are intrinsic or that relational symmetry implies identity.)*  

  **Move 3: Essential vs. Accidental F as a Putative Difference**  
  The essential/accidental status of *F* is a **higher-order modal property** of the spheres (e.g., "having F essentially"). If *F* itself has no empirical manifestation, this difference is:  
  - **Non-relational**: It does not depend on other entities.  
  - **Non-qualitative**: It concerns *how* F is instantiated (necessarily/contingently), not *what* is observed.  
  However, *F*’s modal status is **epistemically inaccessible** and **metaphysically primitive** in this scenario. It cannot be verified or grounded in observable facts, violating a core motivation for PII: grounding identity in discernible properties.  
  *(Characteristic Mistake: Assuming modal differences automatically satisfy PII without addressing epistemic/metaphysical grounding.)*  

  **Move 4: Circularity and the Threat to PII**  
  Using essential *F* to satisfy PII is circular:  
  - PII aims to *explain* numerical difference via property discernibility.  
  - But **essentiality** is not a fundamental property; it *presupposes* a prior individuation. We assign "essential to A" only *after* A is distinguished from B. Without independent grounds for distinguishing A and B, positing that A has *F* essentially while B has it accidentally **smuggles in an ungrounded intrinsic difference**. This renders PII vacuous—it relies on the very distinction it purports to explain. Black’s challenge thus stands: two indiscernible objects *can* exist if "discernibility" requires non-circular property differences.  
  *(Characteristic Mistake: Ignoring that essentialist claims presuppose individuation or treating modal status as a brute solution.)*  

  **Conclusion:** The essential/accidental distinction fails to save PII. It either introduces an empirically unverifiable property, violating PII’s spirit, or relies on a circular individuation process. Black’s argument shows PII cannot be sustained without observational or causal grounding.  

  ---

  ### Marking Scheme (Total: 25 Marks)  
  1. **Move 1 (Definition & Black’s Challenge):** 5 marks  
     *-1 if PII misstated; -2 if Black’s symmetry misrepresented.*  
  2. **Move 2 (Intrinsic/Relational Distinction):** 8 marks  
     *-3 if spatial relations mischaracterized as intrinsic; -2 if symmetry’s role unclear.*  
  3. **Move 3 (Analysis of Modal Distinction):** 7 marks  
     *-3 if epistemic/metaphysical inaccessibility unaddressed; -2 if non-qualitative nature ignored.*  
  4. **Move 4 (Circularity Critique):** 5 marks  
     *-3 if circularity unexamined; -2 if individuation-presupposition missed.*  
  5. **Clarity & Structure:** 2 marks  
     *Deduct for disorganization or ambiguous phrasing.*  

  ---

  ### Calibration Note  
  This question separates **metaphysically engaged students** from those relying on **memorized summaries** of Black’s argument:  
  - **Understanding the Crux:** Strong students will focus on the *grounding problem*: whether modal differences can non-circularly individuate objects without observational criteria. They will dissect why "essentiality" presupposes individuation (Move 4) and link this to PII’s explanatory aims.  
  - **Memorization Trap:** Weak students will recite Black’s "monumental" critique (e.g., "spatial relations are external") but fail to engage the modal variant. They may assert that essential properties "obviously" satisfy PII or default to generic labels ("F is intrinsic!") without confronting circularity. The question’s difficulty lies in forcing *novel application* of core concepts (intrinsic, relational, circularity) to a variant scenario, exposing superficial familiarity.
