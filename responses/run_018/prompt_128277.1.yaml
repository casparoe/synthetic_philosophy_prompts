prompt: |-
  me and my friend was arguing for like three hours about the statue and clay thing — same clay shaped into David, then squashed back into a lump. she said the statue dies the second the shape changes, i said that assumes parts are essential but never proves it. anyway we got sidetracked onto whether this debate matters for anything real, like if an AI reconstructs the statue from scattered atom data, or if hylomorphism actually fixes anything or just renames the mess.

  so heres what i actually want: in material constitution — the statue/clay problem and whatever surrounds it — which open questions are worth actual research time right now? im especially wondering about three: (1) whether discontinuous constitution is even coherent, like if the clay atoms are scattered across space but maintain some structural/functional link, does David survive in some distributed form? (2) whether the "many objects" problem can be solved without just picking a language or ontology by fiat, and (3) if cracking any of this actually changes how we think about artifacts, digital replicas, or physical continuity in general.

  rank them in order of what should get worked on first, and defend the ordering: which ones are upstream of the others, which are tractable for philosophers rather than physicists, and what kind of result over the next few years would move one up or down the list. dont just survey — tell me where the effort should go and why, relative to someone with maybe three years and no lab access. also please no bibliographies or reading lists, i dont have library access right now and im writing this on my phone anyway.
