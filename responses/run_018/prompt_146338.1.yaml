  I'm putting together a fake podcast episode for my cognitive aesthetics class and I need interview questions for a made-up guest, Dr. Mirek. She works on that old Letter Spirit question — what makes every 'a' an 'a' — but she's not into family-resemblance or statistical-template stories. Instead she defends this view she calls skeletal invariantism: she claims every readable 'a' preserves one continuous enclosed counter of negative space that connects to the tail, and that this topological feature is what our visual system actually tracks. She also says that when a distorted form feels "broken" rather than just ugly or unfamiliar, that's because the invariant is literally ruptured, not because we're applying some aesthetic norm.

  I want eight to ten questions that really press her, not generic "how'd you start" stuff. Please include at least one about decorative typefaces — blackletter, some script fonts — where the counter is split or hidden, with a follow-up keyed to her usual reply that readers are just functionally reinterpreting the negative space. Another should ask whether her invariant is genuinely explanatory or just a redescription, especially since she admits that simple feature detectors already classify letters fine. I also want a question about whether the "broken" feeling smuggles in normativity under the guise of perception, and a sequence that makes her "that's a research program, not an objection" deflection harder when people cite deep-learning classifiers that don't seem to track her invariant at all. Oh, and please seperate what is settled from what's genuinely contested — don't present skeletal invariantism like it's the mainstream view in cognitive science, since I'm pretty sure most people think recognition is way more flexible and distributed than that.
