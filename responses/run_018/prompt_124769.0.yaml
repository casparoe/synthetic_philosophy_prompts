  I'm prepping questions for a podcast interview with a historian who just published a monograph arguing Einstein's determinism was really two seperate commitments: an ontological Spinozist one where God/nature is fixed, and an epistemic rule that physics needs deterministic laws to be intelligible at all. She claims this split lets Einstein keep a kind of methodological free will — not just the illusion he talked about in correspondence, but a necessary stance for doing science — and that quantum mechanics only breaks the second commitment, not the first. I want about eight questions that don't let her just summarize the book. At least one should press how she reads his remark about God not playing dice against her split, one on whether moral responsibility survives if free will is only methodological, and one on what evidence could make her abandon the split altogether. For each, include a foloow-up that anticipates her likely "that's mixing levels" deflecion and makes it harder to deploy. Please begin with the actual questions — no intro, no preface — and put the sharpest tension first; then build the reasoning and follow-ups in sequence, with no restating of the ask.
