  Next, addressing causation versus agency. The user asks if causation is being equated with agency. The practice doesn't necessarily equate them but redefines agency to include non-intentional forces. It's about recognizing that these forces play active roles in historical events, not just as passive backdrops. For example, a volcanic eruption causing a famine isn't just a cause; it's an actor that reshapes societies.

  Environmental determinism is another concern. The user wonders if this approach is a covert form of determinism. However, the practice seems to avoid determinism by emphasizing co-constitution. Humans and non-humans interact, leading to emergent outcomes. It's not that the environment dictates history, but that both human and non-human actors are entangled in a dynamic interplay.

  The user also asks if this can coexist with human-centered historiography. The practice doesn't discard human agency but situates it within broader networks. Humans are still intentional actors, but their actions are mediated by non-human forces. This creates a more complex narrative where both are interdependent.

