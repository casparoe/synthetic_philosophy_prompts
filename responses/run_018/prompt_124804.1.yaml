  Tower ending: Narrator shoots himself to kill Tyler. Tyler's separate body collapses here. The copy becomes physical, which might be a cheat because in reality, alters don't have separate bodies. The film uses this to resolve the conflict, but it undermines the fluidity. The logic collapses because the physical separation makes Tyler too distinct, simplifying the integration.

  The film knows the line is blurry in scenes like the support groups. The narrator copies grief, which is inauthentic, but it gives him real relief. Tyler's creation is a copy that feels more real. The fluidity is shown until the end where the separate body provides a clear resolution. This might suggest that authenticity isn't about originality but the experience. Tyler's copycat nature allows the narrator to enact real change, even if it's destructive.

