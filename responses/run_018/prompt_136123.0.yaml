  I have no formal academic background in philosophy, but over the past year I have been working through Spinoza’s Tractatus Politicus and parts of the Ethics in English translation, and I have become stuck on a tension that standard commentaries do not seem to address head-on. Spinoza defines democracy as the form of government in which all citizens who are not excluded by law take part in decision-making, yet he also insists that the multitude is ordinarily guided by inadequate ideas and passionate affects. Most discussions treat this as a practical problem: democracy functions best when citizens become rational. I want to ask whether Spinoza’s metaphysics actually demands a sharper distinction—between democracy as natura naturans, the collective power of the multitude expressing itself directly, and democracy as natura naturata, the institutional form that channels that power through laws and representatives. If these are genuinely different in his system, then he may hold two incompatible conceptions of democratic legitimacy, one grounded in actual collective power and the other in rational institutional form.

  I am applying to a small philosophical foundation for a six-month independent research stipend. Please write me a formal proposal of about two pages, in British English. The proposal must contain a precise statement of the research question: does Spinoza’s political philosophy contain a metaphysically grounded distinction between direct democratic expression and institutional democratic form, and if so, which conception carries normative weight for him? Explain why existing readings—whether republican, liberal, or radical-democratic—leave this specific tension open rather than resolving it. Set out the method: a close conceptual analysis of Chapters 6–11 of the Tractatus Politicus read against Ethics Part I and Part III, tracking every occurrence of multitudo, potentia, and imperium, and comparing the results with Spinoza’s account of adequate and inadequate ideas, without importing modern democratic theory except as a contrast. Say what a successful result would look like (a clear textual map showing whether the two conceptions collapse or remain distinct, and what that implies for Spinoza’s claim that democracy is the most natural form of government) and what would count as failure (the distinction turns out to be a mirage produced by translation choices). Give an honest assessment of scope: why six months is adequate for a focused conceptual study but too short for a full historical contextualisation of Spinoza’s Dutch republican sources, and confirm that you will not attempt the latter. Do not include a bibliography, reading list, or citation requests; I will compile references myself. Write in polished, formal British English.
