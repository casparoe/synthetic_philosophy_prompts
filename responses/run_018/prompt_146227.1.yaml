  Hmm, the stakes are high with multiple constraints: a binding school district contract requiring "clear civic-progress narrative," pedagogical concerns about visitor coherence, and ethical obligations to avoid historical distortion. The user needs a formal memo that navigates these while making concrete recommendations. 

