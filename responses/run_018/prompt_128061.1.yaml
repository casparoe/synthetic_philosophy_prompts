  Your study-group friend was likely relying on the **Normative Entitlement** reading, which claims voluntary transfers automatically create justice, making any redistribution coercive. This reading *partially* survives the mediation critique but loses significant force. While formally uncoerced exchanges still confer *some* moral weight, once we acknowledge that choices are shaped by algorithmic nudges, wealth disparities, and platform power, "voluntary" becomes a spectrum rather than a binary. If my "choice" to pay for a subscription is driven by manipulative design or desperation from prior inequality, the transfer's legitimacy isn't automatic. Thus, patterned corrections (e.g., taxing that subscription fee to fund education) aren't necessarily "wrecking liberty" but may address embedded coercion in the initial "choice." The argument morphs from "liberty vs. equality" to debating *which institutional conditions* make choices sufficiently free to deserve full entitlement.
