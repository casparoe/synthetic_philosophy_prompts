  **Step-by-Step Procedure for Copy Editors**

  **Step 0: Identify the Primary Narrator**
     - The primary narrator is the voice that is telling the entire story and is presented as the author of the essay. Since the essay is submitted by an AI, the primary narrator is assumed to be that AI unless the text explicitly sets up a fictional frame (like the AI telling a story in which the narrator is a character). 
