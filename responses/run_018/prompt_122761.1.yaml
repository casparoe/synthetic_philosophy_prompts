  The bottom-line proposal should separate the two uses of the field while acknowledging the validity of both perspectives on causation - that omissions can contribute to harm, while recognizing the linguistic distinction between acts and failures to act.
answer: |-
  Here’s a draft opinion for your panel, designed to be concise, principled, and actionable for Thursday’s vote. It addresses your core concerns while balancing candour, fairness, and legal/ethical rigor.

  ---

  **OPINION: Defining "Causal Contribution" in Incident Review**  
  *For Serious Incident Panel Vote – [Date]*

  ### The Problem
  Our current policy defines "causal contribution" narrowly as **"acts that physically contributed"** to the incident. In cases of *inaction* (e.g., failure to escalate observations), this implies no individual contribution—even when multiple parties neglected clear duties. This is untenable: it fails families (undermining candour), obscures accountability, and impedes proportionate internal responses. We must redefine "causal contribution" to reflect **failures to fulfil essential duties that were necessary to prevent harm**.

  ### Proposed Rule for "Causal Contribution"
  **"A person has made a causal contribution if their failure to fulfil a defined duty (act or omission) removed a necessary opportunity to prevent the incident, and this failure was not overridden by others."**  
  *Key elements:*
  1.  **Includes omissions:** Duty-bound inaction (e.g., not escalating) is causal if timely action *could* have altered the outcome.  
  2.  **"Necessary opportunity":** Focuses on whether the duty existed and its fulfilment was a *required step* in the safety chain.  
  3.  **"Not overridden":** If Person A *would* have acted had Person B failed, but Person B *did* act, only Person B’s contribution is recorded.  

  ### Applying the Rule to This Case
  1.  **The Three Staff with Escalation Duties:**  
      *   **Causal Contribution:** **YES, for each.**  
      *   *Rationale:* Each had an *independent, non-delegable* duty. The outcome required *all* to fail simultaneously. No single individual’s action would have been "overridden" if they alone had acted; any one *could* have triggered review. Their mutual inaction created a "Swiss Cheese" gap.  
      *   *Deliberate vs. Inadvertent:* **Not relevant for causation itself** (both remove the necessary opportunity). *However, this distinction is critical for internal actions* (see below).  
  2.  **The Consultant on Leave:**  
      *   **Causal Contribution:** **NO.**  
      *   *Rationale:* Their absence did not *remove a necessary opportunity*. Had they been present, their stated intent (to not escalate) suggests their presence wouldn’t have altered the outcome. Their *policy* may warrant review, but their *absence* wasn’t causal.  

  ### Should the Rule Differ for Family Letters vs. Internal Actions?
  *   **Family Letter (Duty of Candour):**  
      *   **Use the same causal rule.** Families deserve transparent, consistent facts. State: *"Three staff members each had a duty to escalate [patient’s] deteriorating observations but failed to do so. Had any one of them escalated, a review would likely have occurred. The consultant responsible for the escalation policy was on leave; their presence that day would not have changed the outcome based on available evidence."*  
      *   *Why?* Candour requires honesty about *what happened and who failed in their roles*. Omitting this implies systemic evasion.  
  *   **Internal Actions (Training vs. Fitness-to-Practise):**  
      *   **Use causation + intent/severity.** "Causal contribution" identifies *who failed*. Internal actions require *further analysis*:  
          *   Was the failure **inadvertent** (e.g., overwhelmed, distracted, genuine mistake)? → **Remedial training.**  
          *   Was the failure **deliberate/grossly negligent** (e.g., ignoring obs, refusing to act due to hierarchy, falsifying records)? → **Fitness-to-Practise referral.**  
      *   *Why?* Fairness demands distinguishing human error from misconduct. Causation is necessary but not sufficient for severe sanctions.  

  ### Addressing "Acts vs. Omissions"
  *   **Their Argument Has Merit:** Legally/philosophically, acts (commission) and omissions (failure to act) are distinct. "Cause" often feels more intuitive for acts.  
  *   **...But It’s Not Defensible Here:**  
      *   Patient safety frameworks (e.g., Duty of Candour regulations, GMC guidance) treat *duty-bound omissions* as causal.  
      *   **Practical Reality:** A nurse *not* escalating abnormal obs is as consequential as *administering* a wrong drug if both breach equivalent duties.  
      *   **Solution:** Retain "causal contribution" but clarify in policy: *"Includes failures to act (omissions) where a specific duty existed to act."*  

  ### Bottom Line for Vote
  **I propose we adopt the following:**  
  1.  **Redefine "Causal Contribution"** as: *"A failure to fulfil a defined duty (act or omission) that removed a necessary opportunity to prevent the incident."*  
  2.  **Apply this definition uniformly** to Duty of Candour letters and internal identification of contributors.  
  3.  **Use intent/severity analysis** *only* for deciding internal actions (training vs. FtP).  
  4.  **Record in this case:**  
      *   *Three staff:* **"Failed to fulfil duty to escalate deteriorating observations, removing a necessary opportunity for review."**  
      *   *Consultant:* **"No causal contribution to this incident."** (Policy design is a separate system issue).  

  **VOTE OPTION:**  
  ☐ **Adopt the proposed definition and approach**  
  ☐ **Retain current definition ("acts only")**  
  ☐ **Seek further review**  

  ### Why This is Fair & Robust
  -   **To staff:** Distinguishes causation (fact) from culpability (intent), preventing inadvertent errors being conflated with misconduct.  
  -   **To families:** Meets candour obligations truthfully without speculative blame.  
  -   **To the system:** Focuses on fixing processes (e.g., clarifying independent duties, redundancy in escalation) while ensuring individual accountability is proportionate.  

  This reconciles ethical candour with procedural justice. I urge adoption.  

  ---  

  **Key Strengths for Your Debate:**  
  1.  **Solves the "cop out":** Directly addresses omissions as causal when tied to duty.  
  2.  **Handles the "three failures" dilemma:** Uses "necessary opportunity" to show each inaction was essential to the harm.  
  3.  **Validates but transcends the "acts vs. omissions" debate:** Acknowledges the philosophical distinction but prioritizes patient safety imperatives and regulatory reality. Clinicians arguing "acts only" have a defensible *conceptual* point but an untenable *practical* one; this meets them halfway.  
  4.  **Separates causation from consequence:** Ensures FtP referrals require *additional* evidence of intent/gross negligence, not just causation.  

  Circulate this, and you’ll have a clear, defensible position for Thursday. Good luck.
