answer: |-
  Your observation is razor-sharp and touches on a profound methodological and ethical tension in historiography. This pattern **doesn't have a single universally accepted name**, but it's recognized and discussed using several related concepts:

  1.  **Causal Asymmetry / Explanatory Asymmetry:** This is the most direct label. It describes the inconsistency in applying different causal frameworks (structural vs. contingent/ideological/agential) to different *parts* of the same historical process based on their normative valence ("good" vs. "bad" outcomes).

  2.  **Exculpatory Contingency:** (Less common, but fits perfectly) The tendency to frame undesirable outcomes as contingent accidents ("if only X hadn't happened...") to absolve the core structural process or ideology from blame. Conversely, desirable outcomes are framed as the inevitable fruits of those same structures/ideologies.

  3.  **Normative Determinism / Structural Teleology:** When positive outcomes are presented as the necessary, structurally determined endpoint, implying historical progress inherent in the structures. Negative outcomes are then seen as deviations from this "true" path.

  4.  **The "Fundamental Attribution Error" Applied to Systems:** You're right to connect it to FAE. FAE typically involves blaming individuals for systemic outcomes. Here, it's similar: historians blaming contingent events/individuals ("Robespierre's paranoia") for systemic violence potentially rooted in deeper structural pressures (war economy, factionalization, breakdown of state monopoly on violence), while crediting the structures themselves for positive systemic change. It's FAE scaled up to historical analysis.

  **How it differs from simple Motivated Reasoning:**

  *   **Specificity:** Motivated reasoning is broad. This is a specific *pattern within* historical causal attribution driven by the normative weight of the outcomes. It's motivated reasoning applied to the *selection of causal frameworks*.
  *   **Methodological Dimension:** It involves choices about historical *methodology* – privileging structural analysis for some outcomes and narrative/contingent/ideological analysis for others – often implicitly driven by the desire to defend or condemn aspects of the event.
  *   **Teleology:** The structural explanation for "good" outcomes often carries an implicit (or explicit) teleology – the revolution *had* to succeed constitutionally because of deep forces. The Terror is then framed as a detour or aberration.

  **Cases that might challenge this framing (or refine it):**

  You need cases where structural forces are widely accepted as the primary driver of *both* significant reform/liberation *and* large-scale violence, *without* a clear contingent trigger separating the "good" from the "bad." Examples:

  1.  **The Haitian Revolution (1791-1804):**
      *   **Structural Forces:** Brutal, racialized slavery system; profound economic inequality; inspiration from French revolutionary ideals *and* their betrayal (maintenance of slavery in colonies); geopolitical pressure (French/British/Spanish intervention).
      *   **"Good" Outcome:** The abolition of slavery and the creation of the first independent Black republic – an unprecedented achievement against impossible odds, driven by the structural imperative of slave resistance and the collapse of colonial authority.
      *   **"Bad" Outcome:** Extreme violence – massacres of former masters and their families, internecine conflict between Black factions, brutal repression under Dessalines. This violence wasn't *just* contingent on leaders; it was fueled by generations of unimaginable brutality under slavery, the existential threat of re-enslavement, the collapse of social order, and the necessities of revolutionary war/consolidation.
      *   **Challenge:** Historians analyzing Haiti often struggle to disentangle the structural imperative of violent slave rebellion from the contingent choices of leaders. The violence is widely seen as an inherent, though horrific, part of the structurally necessary process of destroying the slave system and achieving independence against overwhelming odds. Contingency matters (e.g., specific leaders, timing), but the *potential* for extreme violence is deeply rooted in the structure.

  2.  **The English Civil War / Revolution (1640s-1660):**
      *   **Structural Forces:** Constitutional conflict (King vs. Parliament); religious strife (Anglican vs. Puritan); fiscal crisis; emerging capitalist class vs. feudal remnants; military revolution.
      *   **"Good" Outcomes:** Constitutional milestones (execution of Charles I, abolition of monarchy/HoL *briefly*, Commonwealth experiment, ultimately contributing to the Glorious Revolution settlement); ideas of popular sovereignty and individual rights debated.
      *   **"Bad" Outcomes:** Civil war carnage; regicide; Cromwell's brutal conquest of Ireland; periods of military dictatorship; significant social disruption.
      *   **Challenge:** The violence and radicalism (e.g., Levellers, Diggers, regicide) weren't simply contingent accidents. They emerged directly from the structural forces unleashed by the conflict – the breakdown of royal authority, the politicization of the army, radical religious sects empowered by the breakdown of church hierarchy, and the sheer momentum of war. While specific events and personalities mattered, the *potential* for escalating violence was inherent in the structural fissures.

  3.  **Decolonization Wars (e.g., Algeria, Kenya):**
      *   **Structural Forces:** Entrenched colonial system with extreme racial/economic inequalities; rising nationalist movements; post-WWII geopolitical shifts weakening empires; ideologies of self-determination.
      *   **"Good" Outcome:** National independence, end of formal colonial rule.
      *   **"Bad" Outcome:** Prolonged, brutal conflicts involving torture, massacres, repression by colonial powers *and* atrocities committed by liberation movements.
      *   **Challenge:** The violence wasn't merely a contingent "mistake" or solely due to "fanatical" leaders. It was often a direct consequence of the structural nature of colonial repression (necessitating armed struggle) and the dynamics of asymmetric guerrilla warfare. Violence was frequently seen as structurally *necessary* by both sides to achieve their goals (maintain control vs. achieve liberation).

  **Why these cases might *not* completely overturn your observation, but refine it:**

  *   Historians *still* debate the relative weight of structure vs. contingency *within* the violence of these events (e.g., Was Cromwell *uniquely* brutal in Ireland, or was it the inevitable logic of conquest? Did specific FLN decisions escalate the Algerian conflict unnecessarily?).
  *   The **exculpatory contingency** impulse remains strong when discussing atrocities committed by "our side" (e.g., downplaying structural causes for settler violence, emphasizing FLN terrorism as "fanaticism").
  *   However, these cases make it **much harder** to neatly separate "good structural" from "bad contingent" causes. They force the recognition that profound, structurally-driven transformations aimed at liberation or fundamental political change often occur within, and are partly constituted by, contexts of extreme violence and social breakdown. The violence isn't easily quarantined as an "accident"; it's often a *mechanism* or *symptom* of the deep structural forces at work. These cases highlight the **dialectical relationship** between structure, contingency, and violence in revolutionary processes.

  **Conclusion:** Your observation is astute. The pattern you describe – **Causal Asymmetry** driven by normative judgment – is a significant feature of much historical writing, particularly on revolutions. While "motivated reasoning" and "FAE" capture aspects of it, the specificity lies in the **selective application of methodological frameworks (structural vs. contingent) based on the perceived moral valence of the outcome.** Cases like Haiti, the English Revolution, and decolonization wars provide strong counterpoints by demonstrating how deep structural forces can simultaneously drive both liberatory breakthroughs and horrific violence in an inseparable dialectic, making the neat separation into "good structure" vs. "bad contingency" far less tenable. They force historians to grapple with the uncomfortable reality that violence can be structurally inherent, not merely contingent, in transformative historical ruptures.
