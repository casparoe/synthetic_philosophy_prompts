answer: |-
  ### 1. The Full Specification (450 words)

  Any adequate precautionary framework must satisfy these core requirements:

  **Non-Negotiables:**
  *   **Addressing Catastrophic & Irreversible Harm:** Must prioritize preventing damage that is irreversible (e.g., species extinction, ecosystem collapse, persistent atmospheric alteration) or cascades uncontrollably (e.g., runaway climate feedback loops). *Motivation:* Reversible harms (e.g., temporary pollution) permit remediation; irreversible/cascading harms do not. Core to precaution.
  *   **Mitigating Ignorance, Not Just Risk:** Must explicitly handle profound ignorance – situations where probabilities or even the *space* of potential outcomes are unknown ("Type-II opacity": unknown causal pathways/unknown unknowns), not just calculable uncertainty ("Type-I opacity": known outcomes with unknown probabilities). *Motivation:* Standard risk analysis fails when we don't know what we don't know (e.g., novel synthetic organisms interacting with ecosystems).
  *   **Avoiding Imposition of Non-Consensual Risks:** Must prevent actions that impose potentially severe risks on populations without their meaningful consent (e.g., large-scale geoengineering affecting global climate patterns, widespread GMO release). *Motivation:* Ethical obligation; distinguishes precaution from paternalistic risk management.
  *   **Rejecting "Absence of Evidence = Evidence of Absence":** Must prohibit justifying action *solely* because definitive proof of harm is lacking. *Motivation:* Prevents exploitation of scientific uncertainty to enable potentially dangerous novelties (e.g., novel chemicals assumed safe until proven otherwise).

  **Camp-Specific Preferences:**
  *   **Democratic Deliberation Mandate:** Requires inclusive, participatory decision-making *before* potentially hazardous actions. *Motivation:* Ensures legitimacy, incorporates diverse values, addresses consent. Favored by procedural/deliberative camps. Not universal.
  *   **Intergenerational Veto Asymmetry:** Grants disproportionate weight or an effective veto to future generations' interests. *Motivation:* Recognizes their vulnerability to irreversible present actions (e.g., radioactive waste, climate debt). Favored by strong sustainability/rights-based camps. Contentious.
  *   **Burden of Proof Allocation:** Dictates *who* must prove safety or harm. Strong PP places burden on proponents to prove safety ("No action without proof of safety"); weaker versions shift burden based on context. *Motivation:* Shapes incentives and default positions (inaction vs. action).
  *   **Threshold for Triggering Precaution:** Defines the level of threat/uncertainty needed to invoke PP (e.g., plausible catastrophic potential vs. any non-trivial risk). *Motivation:* Determines scope; stricter thresholds limit PP application.

  ### 2. The Conflicts (250 words)

  Two key conflicts arise:

  1.  **Deliberation vs. Timeliness:** The requirement for **thorough democratic deliberation** clashes fundamentally with the need to **act before the "evidentiary window" closes** to prevent irreversible harm. Complex, inclusive deliberation is inherently slow (e.g., deliberating on solar radiation management as Arctic ice disappears). Acting swiftly often necessitates centralized or expert-driven decisions, undermining the deliberative ideal. Precaution demands blocking potentially harmful actions *now*, but deliberation demands extensive process *before* any action (including blocking). This tension is central and often irresolvable.

  2.  **Intergenerational Asymmetry vs. Operational Feasibility:** The **intergenerational veto asymmetry** (present inaction is reversible by future action, but present harmful action is irreversible for the future) creates a profound ethical asymmetry. However, operationalizing this asymmetry within *any* decision framework risks collapsing into paralysis or standard risk analysis with extreme discounting. Granting an effective veto to hypothetical future actors makes proactive risk mitigation nearly impossible, as *any* significant novel action carries *some* irreversible risk. Conversely, quantifying future harms to balance them against present benefits (even with low discount rates) abandons the core precautionary asymmetry and reverts to modified cost-benefit analysis. The asymmetry highlights a moral truth but struggles for coherent implementation within a decision rule.

  ### 3. The Scorecard (200 words)

  *   **Weak (Cost-Benefit with Uncertainty Weighting):**
      *   *Fails:* **Addressing Catastrophic/Irreversible Harm** (may allow irreversible damage if "benefits" outweigh weighted risks), **Mitigating Ignorance** (Type-II) (assumes risks are quantifiable), **Rejecting Absence=Evidence** (often defaults to action if harm not quantified), **Avoiding Non-Consensual Imposition** (consent not central).
  *   **Strong (Prohibit without Proof of Safety):**
      *   *Fails:* **Democratic Deliberation Mandate** (can be invoked technocratically/absolutistly without process), **Timeliness** (proof of absolute safety is impossible, leading to permanent inaction), potentially **Operational Feasibility** (paralysis). May struggle with **Burden Allocation** fairness.
  *   **Middle (Reversibility Thresholds):**
      *   *Fails:* **Cascading Harm** (reversibility != controllability; a reversed action might still trigger unstoppable cascades), **Mitigating Ignorance** (Type-II) (assumes we know enough to judge reversibility), **Intergenerational Asymmetry** (reversibility judged from present perspective, ignoring future costs of reversal). Struggles with complex system interconnectivity.

  ### 4. The Residue (100 words)

  The distinctions like **Type-I vs. Type-II opacity** and **intergenerational veto asymmetry** expose genuine, critical flaws in standard formulations. Type-I/II highlights that precaution is fundamentally concerned with *deep uncertainty* and *ignorance*, not just quantifiable risk – a dimension standard cost-benefit analysis and even reversibility thresholds often inadequately address. The intergenerational asymmetry reveals an ethical core – the unique vulnerability of the future to irreversible present choices – that standard risk analysis inherently obscures through discounting and aggregation. These distinctions are not artificial; they pinpoint the specific challenges (epistemic and ethical) that motivate a genuinely precautionary approach beyond risk management.
