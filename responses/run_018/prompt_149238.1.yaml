answer: |-
  Below is a decision-tree sorting quiz for your philosophy seminar, designed as requested. It uses concrete questions to guide respondents through the logical space of positions on moral objectivity, based on folk-moral differences across WEIRD and non-WEIRD cultures. The quiz avoids philosopher names or citations, focuses on British English, and maps all answer combinations to one of five leaves (with empty combinations noted). The "weird case" is injected as a reflective prompt after the quiz results.  

  ---

  ### **Philosophy Seminar Quiz: Moral Objectivity and Cross-Cultural Differences**  
  **Instructions**: Answer the three questions below based on your intuitive judgment. Choose one option per question. Use British English (e.g., "prioritise" not "prioritize"). After submitting, you will receive a position (e.g., "strong universalism") and a reflection prompt.  

  ---

  #### **Question 1: Loyalty vs. Harm Trade-offs**  
  Cultures sometimes differ sharply on dilemmas involving loyalty (e.g., protecting a family member) versus preventing harm (e.g., to an outsider). For instance, one culture might prioritise loyalty even if it causes harm, while another prioritises minimising harm. How do you explain such differences?  
  - **(a)** The differences are mostly "noise" around a universal moral core (i.e., all cultures share the same underlying values, but imperfectly apply them due to non-moral factors like history or resources).  
  - **(b)** The differences reflect genuinely distinct moral weightings (i.e., cultures fundamentally assign different values to loyalty and harm).  

  #### **Question 2: Purity-Based Condemnations**  
  Some non-WEIRD cultures condemn actions based on purity/sanctity (e.g., taboo foods, "desecrating" objects). How do you interpret these condemnations?  
  - **(a)** They track real moral wrongness (i.e., purity violations are objectively wrong, even if WEIRD cultures underemphasise them).  
  - **(b)** They merely reflect culturally shaped disgust (i.e., the condemnations are byproducts of local traditions/psychology, not objective wrongness).  

  #### **Question 3: Moral Dumbfounding**  
  When people express strong moral judgments they cannot justify (e.g., "incest is wrong even if no harm occurs"), this "dumbfounding" suggests:  
  - **(a)** **Error theory**: Moral judgments are systematically mistaken (i.e., people act as if morality is objective, but it is not).  
  - **(b)** **Hidden objective knowledge**: People intuit objective moral truths but struggle to articulate them (i.e., dumbfounding reveals unconscious moral knowledge).  
  - **(c)** **Pure conditioning**: Moral judgments are learned responses with no objective basis (i.e., culture/socialisation alone explains strong but unjustified feelings).  

  ---

  ### **Your Results**  
  Based on your answers, your position on moral objectivity is:  
  **(Match your answers to the outcomes below.)**  

  | Q1 Answer | Q2 Answer | Q3 Answer | Position                                  | Notes                                                                 |
  |-----------|-----------|-----------|-------------------------------------------|-----------------------------------------------------------------------|
  | (a)       | (a)       | (b)       | **Strong universalism**                   | Differences are noise; purity tracks truth; dumbfounding reveals hidden knowledge. |
  | (a)       | (b)       | (b)       | **Weak universalism with cultural noise** | Differences are noise; purity is non-moral; dumbfounding reveals hidden knowledge. |
  | (b)       | (a)       | (b)       | **Contextualist objectivism**             | Differences are genuine; purity tracks truth; truths are objective but framework-dependent. |
  | (b)       | (b)       | (c)       | **Relativism**                            | Differences are genuine; purity is disgust; dumbfounding is conditioning. |
  | Any       | Any       | (a)       | **Error theory**                          | Dumbfounding reveals all moral judgments are mistaken.               |
  | (a)       | (a)       | (c)       | *Empty*                                   | **Diagnosis**: Incoherent. Conditioning (Q3c) clashes with claims of universal truth (Q1a, Q2a). |
  | (a)       | (b)       | (c)       | *Empty*                                   | **Diagnosis**: Incoherent. Conditioning (Q3c) conflicts with universalist noise (Q1a). |
  | (b)       | (a)       | (c)       | *Empty*                                   | **Diagnosis**: Incoherent. Conditioning (Q3c) contradicts objective wrongness (Q2a). |
  | (b)       | (b)       | (b)       | *Empty*                                   | **Diagnosis**: Unattractive/unexplored. Hidden knowledge (Q3b) clashes with genuine differences (Q1b) and non-moral disgust (Q2b). |
  | (b)       | (a)       | (a)       | **Error theory**                          | *(Q3a overrides other answers)*                                      |
  | (b)       | (b)       | (a)       | **Error theory**                          | *(Q3a overrides other answers)*                                      |
  | (a)       | (b)       | (a)       | **Error theory**                          | *(Q3a overrides other answers)*                                      |
  | (a)       | (a)       | (a)       | **Error theory**                          | *(Q3a overrides other answers)*                                      |

  **Notes on Positions**:  
  - **Strong universalism**: One true morality exists; differences are errors/non-moral factors.  
  - **Weak universalism**: Universal core exists; differences are non-moral "noise" (e.g., applied inconsistently).  
  - **Contextualist objectivism**: Truths are objective but indexed to roles/frameworks (e.g., "promise-keeping" is objectively binding within a social context). *Differs from weak universalism by allowing fundamental variation in moral facts; differs from relativism by retaining objectivity within frameworks*.  
  - **Relativism**: Moral truths are relative to cultures/individuals.  
  - **Error theory**: No moral truths exist; all judgments are false.  
  - **Empty combos**: Logically inconsistent (e.g., affirming objective truth while reducing morals to conditioning) or philosophically unstable (hence unattractive in current literature).  

  ---

  ### **The Weird Case: A Challenge for Universalism**  
  Imagine a society that consistently ranks **breaking a promise to a dead ancestor** above **letting a starving child take food**. This is observed empirically, not as an outlier.  

  **Reflect on your assigned position**:  
  - If you were assigned **strong or weak universalism**: Can a universalist framework absorb this ranking without collapsing into contextualist objectivism (e.g., "truth depends on ancestor-worship frameworks") or relativism? Why/why not?  
  - If you were assigned **contextualist objectivism, relativism, or error theory**: How does this case strengthen or challenge your view?  

  This case tests whether extreme differences can be reconciled with universalism. For instance:  
  - **Universalists** might argue this is "noise" (e.g., distorted priorities) but risk ad-hoc explanations.  
  - **Contextualists** might accept it as objectively wrong *within that framework*—but is this just relativism in disguise?  
  - **Relativists/error theorists** see it as evidence against universal moral facts.  

  ---

  ### **How to Use in Seminar**  
  1. Participants complete the quiz individually.  
  2. Group discussion: Compare positions, debate empty combos (why they’re incoherent), and analyse the weird case.  
  3. Key debate: Does contextualist objectivism meaningfully differ from weak universalism or relativism? (E.g., by preserving "objectivity" via frameworks vs. abandoning it entirely.)  

  This structure ensures focus on logical space, not names or citations, while accommodating the nuances of folk-moral differences. Let me know if you’d like adjustments!
