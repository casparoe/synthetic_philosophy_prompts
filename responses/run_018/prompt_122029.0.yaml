prompt: |-
  You are an expert in social philosophy and institutional design, and you're also good at writing memos for people with no philosophy background. Think step by step: first brainstorm the core tension, then lay out the options, then pick a concrete recommendation.

  I sit on the Meridian Commons Board — I'm a backend engineer, zero formal philosophy background — and we need to reccomend a policy by next Thursday. We manage shared spaces (kitchens, tool libraries, garden plots) in our co-housing cluster. The board is split between the "Tight Rules" camp (strict reservations, automatic fines, zero exceptions) and the "Loose Norms" camp (trust-based, peer mediation, context always matters). The tight side says without hard rules we'll hit the tragedy of the commons; the loose side says over-regulation kills the social capital that makes shared living work at all.

  Please draft the short memo I'll circulate before Thursday's meeting. It should reccomend one concrete course of action with a clear time frame — maybe adoption within 30 days and a mandatory review at 6 months — and it should engage the strongest argument from the losing side seriously rather than just dismissing it. I'm also wondering about a hybrid I sketched called "calibrated looseness": rule density is high when resources are actually scarce (like the workshop) but low when they're abundant (like the garden), plus a sunset clause forcing us to re-evaluate every quarter. Is that coherent, or does it just collapse back into one pole? Work that into the reasoning if it holds up.

  Don't cite philosophers or ask me to read anything — I can't search well and I don't want made-up bibliographies. Just reason it through like you're talking to a board of regular people. Keep it casual but with a real bottom line.
reasoning: |-
  Okay, the user is on the Meridian Commons Board and needs to draft a policy recommendation memo by next Thursday. They're a backend engineer with no philosophy background, so the memo needs to be practical and jargon-free. The board is split between "Tight Rules" and "Loose Norms" camps. The core tension is balancing structure to prevent resource overuse with flexibility to maintain social trust. 

  Hmm... the user also mentioned their hybrid idea "calibrated looseness" - rule density based on actual scarcity, plus quarterly reviews. That's actually smart because it avoids one-size-fits-all solutions. I should validate if this holds water. 

  First, why might this work? It directly addresses the tragedy of the commons concern by tightening rules where resources are limited (like the workshop tools), while preserving social capital in low-stakes areas (like abundant garden plots). The sunset clause forces regular evaluation - that's crucial because it prevents bureaucratic inertia. 

  But could it collapse? Only if we don't define "scarcity" clearly. Need concrete metrics: for the workshop, maybe "scarcity" means >3 reservation conflicts/month; for gardens, maybe only if all plots are claimed. Must avoid subjectivity. 

  The user's instinct is right - this isn't just splitting the difference. It's situational design. The memo should emphasize that flexibility requires more upfront work (defining scarcity triggers) but pays off in long-term adaptability. 

  Biggest risk: the "Tight Rules" camp might worry about enforcement gaps. Should explicitly require automated alerts for workshop no-shows to address that. For "Loose Norms" advocates, peer mediation stays as first response for garden disputes. 

  Oh - and timeframe! User wants adoption in 30 days with 6-month review. That's tight but feasible if we template the rules. Should call out that first quarterly review will be messy but necessary. 

  Strongest counterargument to address: Tight Rules folks will say variable enforcement is unfair. Response: consistency exists within resource types, and we're optimizing community outcomes, not uniformity. 

  Final memo structure: 
  - Frame as "both sides are right but context-dependent" 
  - Recommend hybrid with three buckets (high/medium/low scarcity) 
  - Sunset clause as non-negotiable 
  - Concrete examples for each bucket 
  - Acknowledge Tight Rules' fairness concern seriously 

  ...And no philosophy names per user request. Just plain "this is why it works" reasoning.
answer: |-
  ## MEMO: Recommendation for Shared Space Governance Policy  
  **To:** Meridian Commons Board  
  **From:** Your Fellow Backend Engineer/Board Member  
  **Date:** [Today]  
  **Subject:** A Practical Path Forward on Rules vs. Norms - Vote Recommended Thursday  

  Hey team,  
  We’ve been stuck between "Tight Rules" (structure, predictability, fines) and "Loose Norms" (trust, flexibility, mediation). **Both sides have a killer point:**  
  - **Tight is right:** Without *some* hard rules for high-demand resources (like our CNC machine), we risk chaos, overuse, and resentment ("Tragedy of the Commons" is real).  
  - **Loose is crucial:** Over-regulating everything (like garden hose access) kills the neighborly goodwill that makes this community special. Robots can enforce rules; only humans build trust.  

  **Neither extreme works everywhere.** So let’s stop fighting and split the difference *strategically*. I propose **"Calibrated Looseness"** – rules scale with *actual scarcity*, not ideology. Here’s the concrete plan:  

  ### Recommended Policy: Tiered Rules + Mandatory Reviews  
  1. **Adopt within 30 Days (by [Date + 30 days]):**  
     - **Tier 1: High-Scarcity Resources (e.g., Workshop Tools, Laundry)**  
       *Strict Rules:* Mandatory reservations via app, 15-min grace period, auto-fines for no-shows. *Why?* Prevent "tragedy." Limited supply + high demand needs structure.  
     - **Tier 2: Medium-Scarcity (e.g., BBQ Pits, Project Rooms)**  
       *Light Rules:* Reservations encouraged but not enforced. First-come, first-served with "yield if reserved" expectation. Peer mediation for conflicts.  
     - **Tier 3: Low-Scarcity (e.g., Garden Plots, Common Lawn)**  
       *Norms-Based:* No reservations. Community norms posted (e.g., "Clean after use"), conflicts resolved via quick chat or mediation. *Why?* Abundance makes rules overkill. Trust thrives here.  

  2. **Mandatory Quarterly Review + Sunset Clause:**  
     - Every 3 months, we **re-evaluate scarcity tiers** based on data (usage logs, conflict reports).  
     - *Example:* If garden plots suddenly have waitlists, they move to Tier 2. If CNC conflicts drop, maybe lighter fines.  
     - **Rules expire automatically** unless reaffirmed. Forces us to adapt.  

  ### Why This (Probably) Won’t Collapse  
  - It’s **not "sometimes tight, sometimes loose"** – it’s **"tight where needed, loose where possible."** Scarcity is the trigger, not sentiment.  
  - **Addresses the Tight Rules’ Best Argument:** Hard rules protect *critical* resources. We lock down the workshop precisely to avoid tragedy.  
  - **Honors the Loose Norms’ Core Insight:** We minimize bureaucracy where resources aren’t contested. Social capital isn’t smothered.  
  - **Practical:** Matches how we intuitively think ("Why fine someone for an empty garden shed?").  

  ### For the Skeptics:  
  - **"But what about fairness?"** (Strongest Tight Rules concern): Consistency *within tiers* is fair. Varying rules per resource is pragmatic, not unjust. Automated fines in Tier 1 ensure no favoritism.  
  - **"Won’t tiers create confusion?"** Clear signage/app labels ("Reserve Required" vs. "Shared Freely") will help. We’re engineers and gardeners – we can handle nuance.  

  **Bottom Line:** Let’s vote Thursday to draft tiered rules using the above framework, adopt within 30 days, and schedule our first quarterly review for [3 months out]. This isn’t a compromise—it’s a smarter system. We keep the workshop humming *and* the garden gossip friendly.  

  Ping me with concerns before the meeting – coffee’s on me if you hate the idea. 😉  
  \- [Your Name]  

  ---  
  **Key Timeline:**  
  - **This Thursday:** Vote to direct drafting subcommittee (or me) to formalize Tier 1/2/3 resources using scarcity data.  
  - **[Date + 30 days]:** Policy adopted.  
  - **[Date + 90 days]:** First quarterly review.  
  - **6 months:** Deep dive audit – is trust up? Conflicts down? Adjust as needed.
