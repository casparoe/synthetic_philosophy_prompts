  To diagnose the stall: it's both verbal and substantive. The verbal part is the definition of formal systems. The substantive part is the empirical claim about computability of human cognition. Progress would require clarifying definitions and investigating cognitive science. For example, rigorous distinctions between fixed and open systems, or empirical work on how humans form concepts. If human cognition is proven computable, critics win. If not, Gödel might apply. Alternatively, dissolving the question by showing it's ill-posed if human reasoning isn't formalizable at all.

