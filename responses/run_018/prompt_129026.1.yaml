  For the defense... A critic might argue these pair-wise vetoes exceed "minimal" liberty. But Sen's principle only requires some protected sphere - the form isn't specified. The critic might also claim preference intensity makes the Pareto comparison unfair, but that's irrelevant to ordinal preferences in social choice. Or they might reject pair-wise domains entirely, but that would collapse liberty into Pareto or require full deontology.

