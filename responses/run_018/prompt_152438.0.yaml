answer: |-
  Here is a rigorous specification of desiderata for a theory of causation by omission, structured around explanatory targets, hard cases, conceptual distinctions, and paradox dissolution, with assessments of non-negotiables for moral/legal responsibility and inherent tensions:

  ---

  ### **Core Desiderata for a Theory of Causation by Omission**

  1.  **Desideratum D1: Causal Relevance of Absences (Explanatory Target)**
      *   **Requirement:** The theory must explain how the *absence* of an event/action can be a genuine cause (or causally relevant factor) in bringing about an outcome, distinct from mere background conditions.
      *   **Motivation:** Without this, omissions cannot ground explanations like "The patient died *because* the doctor didn't administer the antidote." Core intuition behind negative causation claims.
      *   **Non-Negotiable for M/L:** Yes. Moral/legal responsibility for omissions fundamentally requires causal efficacy.

  2.  **Desideratum D2: Agent-Specific Attribution (Hard Case: Clinical Omission)**
      *   **Requirement:** The theory must correctly identify a *specific agent's omission* as causally responsible for an outcome when that agent had both the *ability* and a *salient obligation/expectation* to perform the omitted action, and the action was necessary to prevent the outcome.
      *   **Scenario:** Physician fails to administer an available, known antidote, leading to patient death.
      *   **Non-Negotiable for M/L:** Absolutely. This is the paradigm case for negligence and liability.

  3.  **Desideratum D3: Normative Baseline Requirement (Conceptual Distinction)**
      *   **Requirement:** The theory must incorporate or presuppose a *normative baseline* (moral, conventional, functional, or statistical) distinguishing a relevant *omission* (failure relative to expectation) from a mere *non-occurrence* (the baseline state).
      *   **Motivation:** Countless non-events occur constantly; only some are omissions. Distinguishing "the lifeguard didn't save the drowning child" (omission) from "the asteroid didn't hit the lifeguard station" (mere non-occurrence) requires a norm.
      *   **Non-Negotiable for M/L:** Yes. Assigning responsibility requires identifying a failure relative to a duty or reasonable expectation.

  4.  **Desideratum D4: Non-Redundancy in Joint Omissions (Hard Case: Joint-Protocol Double Omission)**
      *   **Requirement:** The theory must avoid making each individual omission in a jointly sufficient set causally redundant ("preempted" or "overdetermined") when no single omission was sufficient for the harm, but all were necessary given the protocol.
      *   **Scenario:** Security protocol requires Gatekeeper A *and* Gatekeeper B to perform distinct, complementary checks. Both independently fail. Intruder enters, causing harm. Neither failure alone would have allowed entry; both were necessary given the rule's structure. Theory must treat both A's omission *and* B's omission as causally necessary and non-redundant for the harm.
      *   **Non-Negotiable for M/L:** Highly desirable. Captures shared responsibility in systemic failures. Failure here weakens accountability in collective action problems.

  5.  **Desideratum D5: Avoiding Causal Promiscuity / Absence Inflation (Paradox)**
      *   **Requirement:** The theory must *not* imply that virtually any non-event is a cause of any outcome that wouldn't have occurred had that non-event (implausibly) occurred. It must provide principled constraints.
      *   **Motivation/Puzzle:** "The failure of the Andromedan aliens to teleport an antidote caused the death." This violates intuition and swamps genuine causes with irrelevant absences. Dissolves the "Problem of Profligate Omissions."
      *   **Non-Negotiable for M/L:** Yes. Moral/legal systems require manageable, focused attributions of responsibility.

  6.  **Desideratum D6: Structural Absence Without Specific Agent (Hard Case: Structural Gap)**
      *   **Requirement:** The theory must account for cases where harm results from the absence of an *institutional structure, role, or obligation itself* (not merely an agent failing *within* an existing structure), and where no specific agent had the obligation to create that structure/role.
      *   **Scenario:** A child drowns in an unguarded public pool because the city council, due to budget cuts, never established a lifeguard service or assigned anyone that duty. No specific individual was obligated to act as lifeguard or create the service. Yet, the *absence of the institutional safeguard* seems causally relevant.
      *   **Non-Negotiable for M/L:** Highly desirable for grounding systemic/institutional responsibility, though attribution to specific agents is complex.

  7.  **Desideratum D7: Preserving Causal Asymmetry (Conceptual Distinction)**
      *   **Requirement:** The theory must preserve the asymmetry of causation (causes precede effects; effects don't cause causes) even when dealing with omissions.
      *   **Motivation:** Intuition that the doctor's omission causes the death, not that the death causes the doctor's omission. Avoids backwards causation paradoxes.

  **Key Tensions:**
  *   **D1 (Causal Relevance) vs. D5 (Avoid Promiscuity):** Granting absences causal status risks inflation. Constraining it risks losing genuine cases.
  *   **D1/D2 (Agent-Level Causation) vs. D6 (Structural Absence):** Anchoring omissions in specific agents (D2) conflicts with cases where no specific agent is identifiable (D6). Theories often prioritize one over the other.
  *   **D3 (Normative Baseline) vs. D1 (Causal Relevance):** Insisting on norms (D3) might seem to conflate causation with responsibility. Omitting norms (D3) makes distinguishing omissions from non-occurrences impossible (violating D3, D2, D6).

  ---

  ### **Comparative Assessment of Frameworks**

  1.  **Counterfactual Dependence (e.g., Lewis-style):**
      *   **Core:** Omission O (of event E) causes outcome C iff: if O had occurred (i.e., if E had happened), C would not have occurred (or would have been less likely).
      *   **Strengths:** Intuitive for D1, D2 (Clinical Omission: If doctor *had* given antidote, patient wouldn't have died). Handles D7 well.
      *   **Weaknesses:** Fails D4 (Joint Omission): In double omission, if *either* gatekeeper had acted, the harm would still have occurred (due to the other's omission), making each omission *not* counterfactually necessary – violates D4. Struggles severely with D5 (Promiscuity): Countless absurd counterfactuals hold (e.g., if Andromedans *had* teleported antidote...). Struggles with D6 (Structural Gap): Defining the relevant "event" E (the non-existent safeguard) and its counterfactual is problematic. D3 (Normative Baseline) is not inherently built-in, making it vulnerable to promiscuity (D5) and struggling with D6.

  2.  **Normative Default Theory:**
      *   **Core:** An omission is causally relevant only relative to a contextually specified *normative default* – what *should* or *was expected* to happen. Causation tracks deviation from this norm.
      *   **Strengths:** Excels at D3 (Baseline), D2 (Clinical Omission - doctor's duty defines norm), and D6 (Structural Gap - norm is the expected institutional safeguard). Provides principled constraint against D5 (Promiscuity - only deviations from salient norms count).
      *   **Weaknesses:** Struggles with D4 (Joint Omission): If the norm is "both checks performed," then the absence of *both* is the deviation, making it hard to assign causal weight to *each individual* omission independently. Raises concerns about conflating causation (D1) with normativity/violation (D3) – does it truly explain causal *efficacy* or just responsibility? D7 is usually preserved but the causal relata become norm-dependent.

  3.  **Interventionist Framework (e.g., Woodward):**
      *   **Core:** Variable X (representing occurrence/non-occurrence of an event) is a cause of variable Y iff there is a possible intervention on X that changes Y (or its probability), holding other relevant variables fixed at some value.
      *   **Strengths:** Provides rigorous, manipulability-based criterion for D1 (Causal Relevance). Handles D2 (Clinical Omission: Intervening to make doctor administer antidote changes outcome). Can handle D4 (Joint Omission) carefully: Holding one gatekeeper's action fixed, intervening on the other's action changes the outcome, showing each is a cause. Offers some constraint against D5 (Promiscuity): Interventions must be "possible" and "specific," though defining this rigorously for absences is challenging. Preserves D7.
      *   **Weaknesses:** Does not inherently provide D3 (Normative Baseline). While interventions can be designed relative to a context, the framework itself doesn't specify *which* norms define the relevant omissions/variables, leaving it vulnerable to context-sensitivity charges and struggling with D6 (Structural Gap - defining the variable and possible intervention on the non-existent structure is difficult). Relies on the modeller to correctly specify the causal model and variables, which requires importing normative considerations (D3) externally.

  **Summary of Trade-offs:**
  *   **Counterfactual:** Sacrifices D4 (Joint Omission) and D5 (Promiscuity) to preserve D1/D2/D7, struggles with D3/D6.
  *   **Normative Default:** Sacrifices a purely "natural" notion of causation (risks conflating with responsibility) and may struggle with D4 (Joint Omission) to secure D3 (Baseline), D5 (Constraint), and D6 (Structural Gap).
  *   **Interventionist:** Offers a robust causal criterion (D1, D2, D4, D7) and some constraint (D5), but must import D3 (Normative Baseline) externally and faces technical challenges with D6 (Structural Gap). It succeeds best where the causal variables can be clearly defined relative to a system, but struggles with the normative grounding needed for full moral/legal viability.
