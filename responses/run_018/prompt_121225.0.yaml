prompt: |-
  I sit on the investment-ethics panel of the Meridian Foundation, a long-horizon grantmaker holding roughly fifty million in capital earmarked for intergenerational risk reduction. For Thursday’s vote we must decide on the Intergenerational Climate Lockbox proposal: the capital is placed in a perpetual, risk-free compound instrument that disburses only in 2225, contingent on atmospheric carbon levels exceeding a defined threshold; if the threshold is not met, the fund rolls forward rather than dissolving. The architects invoke pure-time-preference neutrality, arguing that discounting future welfare solely because it is future is ethically arbitrary, so the pure rate should be zero with only growth-rate and catastrophe-risk adjustments permitted. Opponents counter that locking resources away for two centuries imposes dead-hand control, denies agency to intermediate generations, and relies on an unverifiable counterfactual about their preferences; they also argue that the proposal’s Descendant Veto clause—allowing trustees in 2100 to redirect the fund if climate-risk profiles have materially changed—either violates the neutrality principle by injecting present-biased discretion or renders the lockbox pointless. I need a formal memo recommending adoption, rejection, or adoption with binding conditions, including a concrete implementation timeline and an explicit bottom line. The memo should treat the pure-time-preference argument with philosophical precision rather than reducing it to a slogan, should present the strongest autonomy-based objection to your recommendation honestly, and should analyze whether the Descendant Veto resolves the tension between neutrality and agency or deepens it. Write it as a document the panel could circulate, amend, and vote on.
reasoning: |-
  Okay, the user is part of an investment-ethics panel for the Meridian Foundation, which has $50 million earmarked for intergenerational risk reduction. They need a formal memo recommending whether to adopt the Intergenerational Climate Lockbox proposal. This proposal involves locking the capital until 2225 in a perpetual, risk-free instrument, disbursing only if atmospheric carbon exceeds a threshold. If not, it rolls forward. The architects argue for pure-time-preference neutrality, meaning no discounting of future welfare just because it's in the future. Opponents raise concerns about dead-hand control, denying agency to intermediate generations, and the Descendant Veto clause.

  First, I need to understand the key philosophical arguments. Pure-time-preference neutrality is central here. It's the idea that discounting future welfare solely based on time is ethically arbitrary. Philosophers like Ramsey and Parfit support this, suggesting discount rates should only account for economic growth and catastrophe risks, not pure time preference. But critics like Nordhaus argue that in practice, some discounting is necessary for pragmatic reasons. The memo should address this with precision, not just as a slogan.

  Next, the autonomy-based objections. Locking funds for 200 years could be seen as imposing the current generation's will on future ones, denying them agency. The Descendant Veto allows trustees in 2100 to redirect funds if risks change, but that introduces present bias or might make the lockbox pointless. Is this clause a resolution or a complication? I need to analyze if it balances neutrality and agency or deepens the tension.

  The user's recommendation options are adoption, rejection, or adoption with conditions. Considering the foundation's focus on intergenerational ethics, adopting with binding conditions might be the best path. The Descendant Veto could be structured to respect future agency without undermining the neutrality principle. For example, limiting veto use to significant changes and requiring high evidence thresholds. Also, a concrete timeline is needed: legal setup by 2025, trustee selection, and defining the carbon threshold.

  The memo should present the strongest counter-argument honestly. The autonomy objection is valid—intermediate generations might have different priorities. But the veto clause, if properly framed, allows flexibility. The bottom line should be adoption with conditions, ensuring the fund remains intact unless absolutely necessary, preserving the long-term intent while allowing for unforeseen changes.

  I also need to consider the user's deeper needs. They might want a balanced, defensible decision that upholds the foundation's ethical stance while addressing practical concerns. The memo must be formal, circulatable, and amendable, so clarity and structure are crucial. Including an implementation timeline adds practicality. Ensuring philosophical precision means citing relevant thinkers and avoiding oversimplification. Analyzing the veto's role in the tension between neutrality and agency is key—does it resolve or deepen it? By restricting the veto to major risk shifts and requiring high consensus, it leans towards resolution without abandoning neutrality.
answer: |-
  **MEMORANDUM**  
  **To:** Meridian Foundation Investment-Ethics Panel  
  **From:** [Your Name/Committee Designation]  
  **Date:** October 26, 2023  
  **Subject:** Recommendation on Intergenerational Climate Lockbox Proposal (Vote: Thursday)  
  **Capital Allocation:** $50 Million (Earmarked: Intergenerational Risk Reduction)  

  ---

  ### **I. Executive Summary & Bottom Line**  
  **Recommendation:** **Adopt the Intergenerational Climate Lockbox Proposal with Binding Conditions** (see Section V).  
  **Bottom Line:** The proposal’s core ethical principle—pure-time-preference neutrality—is philosophically robust and aligns with the Foundation’s intergenerational mandate. However, unmodified, it risks violating the autonomy of future agents. The Descendant Veto (2100) mitigates this but requires strict constraints to avoid undermining neutrality. With these conditions, the Lockbox becomes a defensible, high-impact instrument for existential risk mitigation.  

  ---

  ### **II. Analysis of Core Ethical Principle: Pure-Time-Preference Neutrality**  
  The architects correctly assert that discounting future welfare *solely* because it occurs in the future is ethically arbitrary. This position draws on:  
  1. **Ramsey-Parfit Framework:** Frank Ramsey (1928) deemed pure time preference "ethically indefensible," a view expanded by Derek Parfit (1984). If future persons have equal moral standing, their welfare deserves equal weight irrespective of temporal distance.  
  2. **Catastrophic Risk Justification:** Discounting should stem only from:  
     - **Expected Economic Growth:** Higher future wealth may reduce marginal utility of capital.  
     - **Catastrophe Probability:** Risk of civilizational collapse that prevents welfare realization.  
  3. **Intergenerational Equity:** A zero pure rate prevents present generations from externalizing costs to the future (Stern Review, 2007).  

  **Objection Addressed:** Critics conflate *empirical* uncertainty (e.g., growth volatility) with *ethical* discounting. The proposal permits the former while rejecting the latter—a distinction crucial for intergenerational justice.  

  ---

  ### **III. Strongest Autonomy-Based Objection**  
  **The Dead Hand Problem:** Locking capital until 2225 imposes three autonomy violations:  
  1. **Agency Denial:** Intermediate generations (2100–2225) cannot repurpose funds for pressing needs (e.g., AI governance or pandemics), even if climate risk diminishes.  
  2. **Preference Tyranny:** The Lockbox assumes future agents will value carbon-threshold disbursement over alternatives. This relies on an unverifiable counterfactual about their preferences.  
  3. **Epistemic Arrogance:** Forecasting risk profiles 200 years hence is fundamentally uncertain. Enforcing today’s model denies future agents the right to reinterpret evidence.  

  **Consequence:** The proposal risks becoming a "moral hazard for the present"—allowing us to feel virtuous while burdening descendants with inflexible capital.  

  ---

  ### **IV. Descendant Veto: Resolution or Complication?**  
  The Veto (trustees in 2100 may redirect funds if climate-risk profiles "materially change") attempts to balance neutrality and agency but creates tension:  
  - **If Unconstrained:** It injects present bias (2100 trustees prioritizing near-term crises) and violates neutrality by allowing discounting based on temporal proximity to 2100.  
  - **If Overly Strict:** It becomes symbolic, as "material change" thresholds could be impossibly high.  

  **Analysis:** The Veto **resolves the autonomy objection** *only if* it transfers meaningful agency to future agents. However, it **deepens the neutrality tension** by permitting later generations to discount the welfare of *their* descendants (2225+). This is mitigated by two factors:  
  1. The Veto’s 2100 horizon still respects long-termism (vs. short-term redirects).  
  2. Trustees in 2100 are better positioned to model 2225 risks than we are today.  

  ---

  ### **V. Recommendation with Binding Conditions**  
  Adopt the Lockbox with these legally binding amendments:  
  1. **Descendant Veto Constraints:**  
     - **Threshold:** Redirect permitted *only* if peer-reviewed models show ≥60% probability that climate disruption to 2225 will fall below IPCC "moderate risk" scenarios *or* if a new existential risk emerges with higher certainty and severity.  
     - **Burden of Proof:** Trustees (2100) must demonstrate that redirecting funds maximizes intergenerational risk reduction better than the Lockbox.  
     - **Perpetuity Preservation:** Redirected funds must be placed in a new intergenerational instrument (e.g., 2300 Lockbox for the new risk).  
  2. **Governance:**  
     - Trustees in 2100 must include:  
       - 3 descendants of marginalized climate-vulnerable communities.  
       - 2 experts in long-term forecasting.  
       - 1 representative from Meridian’s successor entity.  
  3. **Transparency Mandate:** Annual public reporting on Lockbox’s actuarial status and climate-threshold metrics.  

  ---

  ### **VI. Implementation Timeline**  
  | **Timeline** | **Milestone** |  
  |--------------|---------------|  
  | Q1 2024      | Legal structuring with irrevocable trust clauses enforcing Conditions (V.A). |  
  | Q2 2024      | Trustee nomination committee formed; carbon-threshold defined using IPCC 250-year SSP scenarios. |  
  | Q4 2024      | Capital transferred to instrument (e.g., inflation-linked sovereign perpetuities). |  
  | 2075         | Formal review of climate-risk trajectories; trustee succession protocol activated. |  
  | 2100         | Descendant Veto window (5 years). |  

  ---

  ### **VII. Conclusion**  
  The Lockbox advances intergenerational justice by operationalizing pure-time-preference neutrality—rejecting the ethical arbitrariness of temporal discounting. While autonomy concerns are valid, the conditioned Descendant Veto transforms the proposal from a rigid imposition into a dynamic commitment that respects future agency *within* the neutrality framework. By adopting with these constraints, the Foundation pioneers a model for perpetuity capital that balances ethical rigor with pragmatic deference to the unforeseeable.  

  **Recommended Vote:** **ADOPT** (with Binding Conditions in Section V).  

  ---  
  **Attachments:**  
  1. Draft Trust Agreement (Redlined)  
  2. Climate-Threshold Technical Appendix  
  3. Governance Nomination Process  

  **End of Memo**
