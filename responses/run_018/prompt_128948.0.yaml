prompt: |-
  hey — i'm a phil phd student (moral psych / phil of mind) and i'm running a one-off session for my lab's cog-sci grad students. they have stats and neuroscience but basically zero formal ethics. i want them to understand why it's genuinely hard to tell whether someone's moral "preference" is actually just a bias that's been laundered through social feedback loops — i.e., a gut aversion that gets culturally reinforced until it feels like a reasoned stance. i don't need you to explain the idea to me; i need a teaching plan.

  what has to come first? i'm guessing i should start with the phenomenology — moral judgments feel like taste — but then i need to show how taste itself is calibrated by culture, and only then introduce the bias/laundering layer. is that the right dependency? tell me the exact order of pieces and why each depends on the previous one.

  for the carrying example, i want one concrete pairing that does both jobs: it needs to show a case where a preference looks principled but might be laundering disgust (say, "clean meat is unnatural") and the reverse, where a bias looks like preference. but i don't want to use the overused factory-farming vs. veganism setup. what example should carry the whole thing, and what must it have and lack?

  the mispconceptions i expect: they'll think implicit association tests settle the question; they'll confuse revealed preference with moral justification; they'll say "but if it's consistently held, it's not bias." exactly where in the sequence do i head each one off?

  i also need a final check — one question i can ask — that shows whether they've grasped the conceptual problem (the laundering structure) rather than just memorizing "bias bad, preference good."

  and what should i openly refuse to cover? probably meta-ethical anti-realism and the full history of preference theory?

  write the plan, not the lecture. no reading lists please — they wouldn't have time anyway.
reasoning: |-
  Okay, the user is a philosophy PhD student in moral psychology and philosophy of mind, preparing a session for cognitive science grad students. They want to teach about the difficulty in distinguishing genuine moral preferences from culturally laundered biases. Let me break down their needs.

  First, they need a structured teaching plan. The key is the sequence: start with phenomenology to show how moral judgments feel intuitive, like taste. Then, demonstrate how culture shapes those tastes. Next, introduce the laundering process where biases are reinforced socially and appear as reasoned principles. The dependency here is crucial. Without establishing the subjective feel first, the cultural influence might not land. Without culture, the laundering concept won't make sense.

  For the example, they want one concrete case that serves both directions: preference masking bias and bias masking as preference. Avoiding overused topics like veganism is important. Let me think of alternatives. Maybe something like urban design? Preference for green spaces versus parking lots. "Natural vs. artificial" arguments could conceal classist or ableist biases. Or perhaps workplace norms, like remote work being seen as "lazy" versus office presence as "dedicated." This could hide biases against flexibility or productivity myths. The example must have surface-level principled reasoning but reveal underlying biases when analyzed.

  Addressing misconceptions is critical. They mentioned IATs, revealed preference, and consistency. Each needs to be preempted at specific points. IATs could be tackled when discussing implicit bias, emphasizing they don't capture laundering. Revealed preference confusion should be addressed when defining moral justification versus behavior. Consistency as a defense needs debunking when showing how laundered biases are stable.

  The final check question needs to test understanding of laundering structure, not just memorization. Something like asking them to identify both laundering directions in a new example. For instance, analyzing opposition to lab-grown meat as "unnatural" might hide disgust, while supporting it could mask bias against traditional farming.

  What to exclude? Definitely meta-ethical anti-realism and preference theory history. The focus should stay on the laundering mechanism, not broader philosophical debates.

  The user's deeper needs might include wanting students to recognize biases in their own research. Cognitive science students might overlook how their work is influenced by cultural norms. The session should make them question their assumptions, fostering critical thinking about moral reasoning in their field. Ensuring the plan is actionable within a short session without readings is key. Clarity and structure are vital for time constraints.
answer: |-
  Here's a teaching plan focused on conceptual scaffolding, targeting the laundering problem directly, with clear sequencing and misconception mitigation:

  **Core Objective:** Equip students to identify the *structural problem* of distinguishing culturally laundered biases from genuinely reasoned moral preferences.

  **Key Constraint:** No time for readings/meta-ethics. Focus on conceptual structure & concrete example.

  **The Plan:**

  1.  **Grounding: The Phenomenology of Moral Judgment (15 mins)**
      *   **Activity:** Quick poll/think-pair-share: "Describe the feeling of making a *strong* moral judgment (e.g., 'That's unfair!', 'That's wrong!')." Guide towards: Feeling of immediacy, certainty, "gut" reaction, aversion/attraction, *similarity to taste* ("That's disgusting!"/"That's beautiful!").
      *   **Why First?** Establishes the *subjective experience* students can relate to. This is the raw material laundering operates on. If moral judgments felt purely like calculating sums, laundering wouldn't work this way. Establishes that feelings *present* as justification.
      *   **Misconception Mitigation:** None yet. Let them articulate the feeling.

  2.  **Culture as Calibrator: Shaping the Gut (20 mins)**
      *   **Activity:** Present 2-3 brief, uncontroversial examples of how culture shapes *aesthetic* "gut" reactions (e.g., reaction to Durian fruit, dissonant music genres, specific fashion norms historically). Emphasize: The *feeling* of "yuck" or "beautiful" is real and automatic, but its *target* is culturally learned.
      *   **Concept:** Culture doesn't just tell us *what* to think; it shapes *how we feel* about things. Our "gut" is trained.
      *   **Link:** "If culture can calibrate our *aesthetic* gut reactions so powerfully, could it do the same for reactions that *feel* moral?"
      *   **Why Next?** Shows that the immediate feeling (Step 1) isn't a reliable indicator of inherent "rightness" or pure reason; its content is malleable. Creates the space for moral feelings to be culturally shaped.
      *   **Misconception Mitigation:** Head off "But morals are different!" by asking: "What *feeling* distinguishes a moral 'yuck' from a purely aesthetic 'yuck'? Is the feeling itself reliably different?" (Planting doubt about revealed preference = justification).

  3.  **Introducing the Laundering Machine: Bias → Social Reinforcement → "Principled" Stance (25 mins)**
      *   **Concept:** Explain the laundering cycle:
          1.  **Initial Bias/Gut Aversion:** Often rooted in evolved responses (disgust, fear of out-group) or historical contingencies.
          2.  **Cultural Amplification:** Social norms, narratives, institutions reinforce this aversion, giving it weight and legitimacy.
          3.  **Post-Hoc Rationalization:** Individuals/groups develop seemingly principled arguments ("It's unnatural," "It's inefficient," "It undermines tradition," "It's dangerous") to explain/justify the now-entrenched feeling.
          4.  **Output:** A "moral preference" that *feels* reasoned and principled but originated in and is sustained by the laundered bias.
      *   **Key Point:** The laundering makes the bias *harder to see* because it's wrapped in reasonableness and social consensus. The feeling persists, but justification *feels* cognitive.
      *   **Why Now?** Steps 1 & 2 established the components (subjective feeling + cultural shaping). This step combines them into the problematic *process*. Depends entirely on understanding that feelings can be culturally shaped *and* feel like justification.
      *   **Misconception Mitigation:**
          *   **"Consistency = Not Bias":** "Can laundered biases be highly consistent within a culture? Absolutely. Consistency reflects successful laundering, not absence of bias."
          *   **"IATs Settle It":** "IATs measure *implicit associations*, which are often inputs (Step 1). They don't tell us if that association has been laundered into a socially reinforced, 'principled' belief (Step 3) or remains a raw bias." (IATs show the *potential* fuel, not the laundering outcome).

  4.  **The Workhorse Example: Opposition to Dense Urban Housing (e.g., "Missing Middle" Housing)**
      *   **Why This Example?**
          *   **Avoids Veganism/Farming:** Less emotionally charged in an academic setting, less likely to trigger pre-existing ideological defenses.
          *   **Shows Both Directions:**
              *   **Preference Laundering Disgust/Bias:** Opposition framed as "protecting neighborhood character," "preventing overcrowding," "preserving property values" (seemingly principled concerns about community, economics). *Could be laundering*: Underlying discomfort with increased density (potential disgust cue?), fear of "different" people (renters, lower-income residents), bias against multi-family units as "less desirable" than single-family homes. The principled arguments mask the visceral origins.
              *   **Bias Laundering as Preference:** *Support* for exclusionary zoning (low-density, large lot sizes) framed *by proponents* as simply a "preference" for "space," "privacy," or "a certain lifestyle." *Could be laundering*: Historically rooted biases (classism, racism - redlining, exclusion) encoded in zoning laws. The "preference" conceals the systemic bias baked into the "choice."
          *   **Has:** Surface-level principled arguments (character, economics, choice), strong social norms (SFH ideal), visceral reactions ("overcrowding!"), clear historical bias links (zoning history).
          *   **Lacks:** Simple good/bad binary, overtly gruesome imagery, direct link to personal identity politics for most students.
      *   **Activity:** Briefly present typical arguments *for* and *against* allowing denser housing (duplexes, small apartments) in single-family zones. Ask students to brainstorm: What *feelings* might underlie these arguments? What historical/cultural factors might have shaped the "preferences" being expressed? How could seemingly reasonable arguments be post-hoc justifications? How could "just a preference" mask systemic exclusion?

  5.  **The Core Conceptual Problem & Final Check (15 mins)**
      *   **Synthesize:** Reiterate the laundering structure (Bias → Culture → "Principle"). Emphasize the *epistemic difficulty*: Both laundered biases *and* genuine preferences manifest as "felt conviction + articulated reasons." We can't *directly* perceive the laundering history.
      *   **Final Check Question (Diagnostic for Conceptual Grasp):**
          > **"Imagine someone holds a moral position P, supported by reason R, consistently and sincerely. What specific *kinds of evidence* or *lines of questioning* would you need to pursue to *seriously investigate* whether P might be a laundered bias, rather than R being its true origin? (Don't give me *answers* about P, tell me *how* you'd investigate the *possibility* of laundering.)"**
      *   **Looking For:** Answers indicating they understand the need to look *behind* the stated reason for:
          *   *Historical/Social Contingency:* When/where did this view arise? What social forces reinforced it?
          *   *Affective Roots:* Are there strong visceral reactions (disgust, fear) associated? Are the reasons detached from actual outcomes?
          *   *Function/Outcome:* Who benefits? Who is disadvantaged? Does the rule seem oddly resistant to counter-evidence?
          *   *Alternative Explanations:* Could a simpler explanation (bias, tradition) account for the belief *as well as or better than* the stated principle?
          *   *(Crucially) NOT:* "Prove R is wrong." The point is R *might* be valid *or* just a post-hoc shield. The question is about investigating the *genesis*.
      *   **Why This Question?** It forces them to operationalize the *methodological challenge* posed by laundering. It shows they grasp the *structure* (need to look for history, affect, social function) rather than just the surface concepts.

  6.  **What We OPENLY WON'T Cover (Stated upfront or as questions arise):**
      *   **Meta-Ethical Anti-Realism:** "We're bracketing whether *any* moral facts exist. Our question is about the *source* of *felt* moral convictions, regardless of their ultimate truth."
      *   **Full History of Preference Theory:** "We're using 'preference' loosely to mean a value stance one endorses, not engaging with formal economic or decision theory."
      *   **Comprehensive List of Biases:** "Focus is on the laundering *mechanism*, not cataloging every specific bias."
      *   **"The Answer" for Specific Issues:** "We're building a conceptual tool to *ask better questions*, not settling the housing debate or others today."
      *   **Neuroscience Correlates:** "While fascinating, we lack time. We're focused on the conceptual/logical structure of the laundering problem."

  **Flow Justification:** Start with subjective experience (accessible). Show culture shapes subjective experience (plausible bridge). Introduce laundering as the specific mechanism *using* that cultural shaping to transform bias into pseudo-principled stance (core concept). Use concrete example to illustrate the mechanism *in both directions*. End with the diagnostic question forcing application of the structural understanding. Misconceptions are addressed *proactively* at the point where they naturally arise (e.g., addressing IATs when discussing implicit inputs to laundering, consistency when discussing the output).

  This plan keeps the cognitive load focused on the laundering structure itself, using relatable steps and a fresh example, while explicitly sidelining the philosophical rabbit holes. The final question is the litmus test for conceptual grasp.
