prompt: |-
  In our political philosophy seminar the dirty-hands debate has stalled in a way that's driving me slightly mad, and it's occured to me that we might be talking past each other entirely. Everyone accepts that a political leader can sometimes be required to do something morally wrong for the greater good, and everyone accepts there's some stain or cost left behind. But half the room treats that stain as genuine moral residue — an unavoidable wrong that remains on the agent even when fully justified — while the other half treats it as purely psychological, a kind of moral hangover that should vanish once you recognise that democratic authorisation actually transfers blame to the collective rather than leaving it on the individual. We've circled this for months with no movement. Is this disagreement really about whether moral responsibility can be delegated, or about whether emotional after-effects count as moral data? Or are we answering different questions — one about individual virtue and conscience, one about institutional design — under the single heading 'dirty hands'? I want a diagnosis with reasons, supported by what each side actually commits to, not a survey of the usual literature, and an honest answer about whether a conceptual distinction, an empirical finding about how voters actually authorise harm, or a formal model of distributed blame could break the deadlock. Please lead with your bottom line in the first sentence, then give the reasoning, with no preamble and no restating of the question. Use British English.
reasoning: |-
  Okay, the user is deeply frustrated with a stalled seminar debate on the "dirty hands" problem in political philosophy. They describe two entrenched positions: one seeing moral residue as real and unavoidable even in justified actions, the other dismissing it as mere psychological hangover that democratic authorization transfers to the collective. The user wants a sharp diagnosis of the core disagreement, not literature review, with practical suggestions to break the deadlock.

  First, I need to identify the fundamental rift. Both sides agree leaders must sometimes do wrong for greater good and feel stained, but disagree on the nature of that stain. The residue camp likely draws from deontologists like Williams - seeing morality as generating permanent agent-relative duties that can't be erased by consequences. The transfer camp seems influenced by consequentialist-institutionalist thinking where democracy mechanically redistributes blame through procedures. 

  The user suspects they're talking past each other by conflating individual conscience with institutional design. That feels right: the residue group focuses on the phenomenological experience of the actor (How does this action change my moral identity?), while the transfer group focuses on social accountability structures (Who gets punished?). These aren't necessarily incompatible frameworks, but the seminar seems trapped in a false binary.

  For diagnosis: The core conflict is indeed about whether moral responsibility is ontologically transferable. The residue position commits to personal accountability being non-delegable - democratic mandates may justify but don't absolve, because morality isn't transactional. The transfer position commits to responsibility as a social construct modifiable by institutional processes. Crucially, both might agree on what politicians should do practically, but split on the metaphysical status of the resulting "dirt".

  Breaking the deadlock requires exposing this hidden divergence in premises. A conceptual distinction between guilt (subjective feeling) and blameworthiness (objective assessment) could help - the transfer camp conflates them when calling residue "mere psychology". An empirical study of voter psychology might reveal whether citizens actually experience transferred blame or still hold leaders individually responsible. Most promising would be developing a compatibilist model where democratic authorization mitigates but doesn't erase personal blame, perhaps through Scanlon's contractualism: the residue represents what one owes to one's own moral character beyond social justification.

  The user's frustration suggests they intuit this isn't just academic - it affects how we judge leaders. The solution lies in clarifying that both sides capture different truths about morality: one about inner life, one about social systems. Forcing a choice between them may be the real deadlock.
answer: |-
  Your deadlock stems from a fundamental metaphysical disagreement about whether moral responsibility is ontologically transferable, not merely a confusion over psychological residue or analytical frameworks.

  **Diagnosis with reasons:**
  1.  **The "Genuine Moral Residue" Camp** commits to a view where moral responsibility is fundamentally *agent-bound and non-transferable*. They hold that:
      *   Morality generates *personal* obligations that cannot be fully discharged by appealing to consequences or institutional roles.
      *   Committing a wrong (even for the greater good) inherently alters the agent's moral ledger *as an individual*, creating a permanent, objective stain ("dirt") that is irreducible to feelings.
      *   Democratic authorisation changes the *context* (potentially making the act politically legitimate or the *best available option*) but does not *relocate* the core moral responsibility; the individual leader *remains the primary moral agent* who chose and enacted the wrong. Blameworthiness persists even if social blame is mitigated.

  2.  **The "Purely Psychological" Camp** commits to a view where moral responsibility is *socially constructed and institutionally transferable*. They hold that:
      *   Moral duties and blame are primarily functions of social roles and agreements, not inherent individual properties.
      *   Democratic authorisation represents a collective decision-making process that *reassigns* the locus of responsibility for the necessary wrong from the individual executor to the authorising collective.
      *   The "stain" experienced by the leader is a *subjective psychological phenomenon* – guilt, regret, or trauma – stemming from their direct involvement or personal moral sensibilities. It signifies the *cost* of leadership, not an objective, non-transferable moral residue. Once responsibility is properly understood as transferred, the *moral* burden (as distinct from the emotional or psychological) *should* lift.

  **Why it's about transferability, not just psychology or questions:**
  *   Both sides acknowledge the psychological cost. The disagreement is whether this cost *corresponds* to an irreducible, objective moral residue *in the agent* (Residue Camp) or is *merely* a psychological side-effect of a painful act whose *moral justification and blameworthiness lie elsewhere* (Transfer Camp).
  *   While the Residue Camp focuses more on individual conscience/virtue and the Transfer Camp on institutional design, the core metaphysical clash over the *transferability of moral responsibility itself* underpins these different emphases. The Transfer Camp sees institutions (like democracy) as mechanisms precisely *for* transferring responsibility; the Residue Camp sees this as conceptually impossible for core moral agency.

  **Breaking the deadlock:**
  1.  **Conceptual Distinction:** Sharply separating **moral residue** (an objective, non-transferable stain on the agent's character/ledger) from **moral psychology** (feelings of guilt, regret, trauma) and **social blame** (collective attribution of responsibility/punishment) could clarify the debate. The key question becomes: *Can democratic processes genuinely transfer the *residue* or only the *social blame*?* This forces a direct confrontation on transferability.
  2.  **Empirical Finding on Authorisation:** Evidence showing voters consistently *do not* perceive themselves as sharing the leader's moral blame (e.g., viewing the leader as the "fall guy"), or conversely, evidence showing voters experience genuine shared culpability, would challenge the Transfer Camp's descriptive claim about how authorisation *actually* functions psychologically and socially. It wouldn't settle the ontology but could undermine the practical plausibility of full transfer.
  3.  **Formal Model of Distributed Blame:** A sophisticated model showing *how* blame distributes across a collective during authorisation (e.g., degrees of shared intention, knowledge, causal contribution) could be useful. However, it's unlikely to break the deadlock because:
      *   The Residue Camp would likely argue it models *social blame distribution*, not the eradication of the leader's *personal moral residue*.
      *   The Transfer Camp might accept it as a map of how responsibility *is* distributed, reinforcing their institutional view.
      *   The core metaphysical disagreement about the *nature* of moral responsibility itself remains untouched by the model.

  **Honest Answer:** The most promising avenue is the **conceptual distinction**, forcing explicit discussion of whether *any* institutional procedure can truly transfer *core moral agency and its inherent residue*. An empirical finding might shift the debate pragmatically but won't resolve the underlying philosophical divide. A formal model is unlikely to convince either side to abandon their core ontological commitment about the nature of moral responsibility. The deadlock is deep because it concerns foundational views of morality and the self.
