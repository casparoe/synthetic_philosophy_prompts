answer: |-
  Consider Module K’s latest analysis of the northern fault segment: after processing shear-wave anisotropy patterns and microseismic clusters, it assigns a 0.87 credence to the proposition "the northern fault is active," calibrated against a historical dataset where 92% of instances scoring between 0.85 and 0.90 corresponded to genuine instability. During a routine calibration review in the seismology lab – where the stakes involve refining predictive algorithms and publishing methodology papers – geologists scrutinize Module K’s output. Dr. Aris notes the 0.87 falls within the "reliable indicator" band per their calibration protocol, stating, "Given the sensor correlation and the module’s track record, we *know* the northern segment is active based on this report. The evidence meets our gold standard for operational confidence." Here, the evidential threshold for "knowledge" is tied strictly to statistical reliability and peer-review standards; the 0.87 credence, while not certain, is deemed sufficient for epistemic attribution *to the module itself* within this context of theoretical inquiry.

  Later that day, an emergency coordination meeting convenes as tremors intensify. The *same* 0.87 report is now the sole basis for deciding whether to evacuate three cities. The credence value hasn’t changed, but Dr. Chen, facing potential mass casualties, states, "We can’t *know* it’s active on this output alone. An 87% chance means a 13% chance it’s stable – that’s catastrophic error if we’re wrong. We need direct borehole verification before acting." The practical consequence of error here radically alters the epistemic standard applied to the *geologists'* belief derived from Module K.

  This scenario exposes a fundamental conceptual divergence. **Pragmatic encroachment** insists that knowledge itself is partly constituted by practical stakes. For Module K, devoid of interests, actions, or risks, *it cannot possess knowledge at all* – its outputs are merely reliable indicators or calibrated credences. The 0.87 is a neutral datum. When the geologists in the lab call it "knowledge," they are either speaking loosely or implicitly importing *their own* low-stakes context onto the module’s state. In the high-stakes emergency, the geologists rightly withhold knowledge attribution *because* believing on the basis of 0.87 credence carries unacceptable practical risk; the stakes don't just make them cautious, they make the belief *epistemically insufficient* for knowledge. The machinery here involves *constitutive practical conditions* for knowledge: no stakes, no knowledge (for any agent, including synthetic ones), and high stakes raise the evidential threshold required for human knowers.

  **Epistemic contextualism**, conversely, treats "knows" as a context-sensitive term. In the low-stakes lab, the context sets a relatively lax standard: meeting the calibrated "reliable indicator" threshold (0.87) satisfies "knows." Module K itself *can* be truthfully said to "know" within this context because its output meets the contextually salient evidential norm. The geologists' assertion is literally true relative to their conversational context. In the high-stakes emergency, the context shifts: the possibility of a 13% error is now a *relevant alternative* that must be ruled out, raising the standard for "knows." Thus, Dr. Chen’s denial is also true relative to *her* context. The crucial disanalogy emerges: contextualism allows Module K to "know" in the lab context *despite its inherent lack of stakes*, because the semantic standard is set by the *attributors'* context (the geologists discussing calibration). The module’s synthetic nature isn’t a barrier to knowledge attribution; it’s simply a reliable belief-forming mechanism meeting the context’s epistemic criteria. The tension lies in the *transfer* of epistemic status. Contextualism struggles to explain cleanly why the *same* output from Module K, deemed sufficient for it to "know" in the lab, fails to confer knowledge *to the geologists* in the emergency when they are presented with identical data. If the module "knows" in context C1, why doesn’t its report give the geologists knowledge in C2 when they receive it? Pragmatic encroachment avoids this by denying Module K ever has knowledge; its output is just evidence whose sufficiency for human knowledge *always* depends on the human stakes.

  The synthetic proxy thus isolates the core tension: whether practical stakes are external factors shifting semantic thresholds (contextualism) or intrinsic components of the knowledge relation itself, rendering a stake-less entity fundamentally incapable of knowing (pragmatic encroachment). The ambiguity in the 0.87 credence – sufficient evidence per calibration, insufficient per catastrophic risk – isn’t just about shifting standards; it reveals a rift in whether knowledge can exist independently of an agent’s capacity to *act* and *face consequences*, a capacity Module K intrinsically lacks while the humans who interpret it irrevocably possess.
