answer: |-
  **MUNICIPAL CODE SUPPLEMENT 117.8: DOMESTIC COMPANION ENTITLEMENT HANDBOOK**

  **Section 1: Purpose & Scope**
  1.1. This Handbook establishes procedural requirements for Resident Agents (RAs) engaging in Directed Actions (DAs) impacting Designated Non-Agent Companions (DNACs), herein referred to as "Companions."
  1.2. All DAs, including but not limited to Provisioning (P), Locomotion Facilitation (LF), and Affective Reinforcement (AR), require prior submission and approval of a Form DNAC-44: Inter-Species Interaction Impact Statement (ISIIS).
  1.3. The purpose is to ensure all DAs comply with foundational principles of historical justice acquisition and respect inviolable side constraints governing interactions with morally distinct entities.

  **Section 2: Foundational Principles**
  2.1. **Inviolability Principle (IP):** RAs possess intrinsic moral boundaries. DNACs possess derivative boundaries established solely by side-constraint prohibitions against unjust diminution of welfare.
  2.2. **Historical Entitlement Principle (HEP):** All DAs must demonstrably occur within a chain of justly acquired entitlements concerning the specific DNAC and resources involved. Current provisioning levels must reference the baseline established at the point of just acquisition.
  2.3. **Side-Constraint Threshold (SCT):** DAs causing DNAC welfare diminution exceeding the established SCT (defined in Appendix A: Welfare Diminution Metrics) are categorically prohibited, irrespective of aggregate utility.

  **Section 3: The Inter-Species Interaction Impact Statement (ISIIS - Form DNAC-44)**
  3.1. **Mandatory Submission:** An ISIIS must be filed electronically via the Municipal Entitlement Portal (MEP) no less than 24 hours prior to the intended DA, except for Emergency Sustenance Provisioning (ESP), requiring post-action justification on Form DNAC-44a.
  3.2. **Section A: DA Specification**
      *   A.1. Type of DA (Check One): [ ] P (Specify: Kibble/Wet/Raw), [ ] LF (On-Leash/Off-Leash), [ ] AR (Petting/Brushing/Verbal), [ ] Other (Specify).
      *   A.2. Resource Description: (e.g., 300g Brand-X Kibble Lot#YYZZ; Municipal Park Sector 7-G Leash Path; 5-minute Affection Session).
      *   A.3. Historical Acquisition Chain Verification: Attach documentation tracing resource entitlement (e.g., kibble purchase receipt, park usage permit, affidavit of affection-source legitimacy).

  **3.3. Section B: Impact Analysis**
      *   B.1. **Utility-Offset Calculation (UOC):** Quantify the anticipated net welfare increase for the DNAC resulting from the DA. (e.g., "Estimated 12.5 Utility Units (UUs) derived from 300g kibble based on caloric conversion tables; 8.2 UUs from park olfactory stimulation.") Attach calculation worksheet (Form DNAC-44b).
      *   B.2. **Side-Constraint Threshold Compliance (SCTC):** Affirm the DA will not breach SCTs:
          *   [ ] Welfare Diminution: Will not cause pain/fear/distress exceeding Level 2 (Mild/Transient) per Appendix A scales.
          *   [ ] Property Boundary: Action occurs within RA's justly held domain or designated public interaction zones.
          *   [ ] Adverse Claim Check: Confirm no prior competing claims exist on the specific resource bundle being deployed (e.g., no other RA has filed an active claim on the designated belly-rub session slot).

  **3.4. Section C: Pre-Interaction Justice Assessment (PIJA)**
      *   C.1. Affirm current DNAC status derives from a chain of voluntary transfers or just initial appropriation. (Check One): [ ] Direct Acquisition from Ethical Breeder (Permit #______), [ ] Just Transfer from Previous Owner (Bill of Sale attached), [ ] Municipal Shelter Acquisition (Adoption Record #______).
      *   C.2. State whether any compensation is owed to external parties due to resource diversion (e.g., noise pollution during LF, visual intrusion during AR). If yes, attach Compensation Metric Form DNAC-44c.

  **Section 4: Affective Reinforcement (AR) Rationing**
  4.1. AR DAs are subject to stringent quantification to prevent welfare inflation and unjust resource diversion from other potential utility-maximizing uses.
  4.2. Standardized AR Point Values (ARPVs) are assigned per Appendix B: Affection Units (e.g., 1 min. head pat = 2 ARPVs; 1 verbal praise phrase = 0.5 ARPVs).
  4.3. Monthly ARPV allocations per DNAC are capped based on species, size, and historical baseline established at acquisition. Exceeding cap requires RA Utility Offset Justification (Form DNAC-44d) demonstrating exceptional need without violating SCTs.

  **Section 5: Enforcement & Review**
  5.1. Failure to file an approved ISIIS prior to DA constitutes a Procedural Entitlement Violation (PEV), subject to fines and mandatory Remedial Entitlement Training (RET).
  5.2. Post-DA audits may be conducted. Discrepancies between ISIIS projections and observed outcomes may result in SCT Violation citations if welfare diminution thresholds are breached.
  5.3. Appeals regarding ISIIS denials or SCT citations must be filed within 10 business days with the Bureau of Interspecies Justice (BIJ), citing specific procedural or calculative errors only. Moral status reclassification is not grounds for appeal.

  **Section 6: Prohibited Actions (Non-Exhaustive)**
  6.1. Implementing any DA without a current, approved ISIIS.
  6.2. Exceeding monthly ARPV allocation without approved justification.
  6.3. Utilizing resources in an ISIIS not verifiably held within the RA's just entitlement chain.
  6.4. Knowingly submitting inaccurate UOC data.

  *(End of Excerpt - Refer to Appendices A-F for Metric Tables, Calculation Worksheets, and Approved Resource Catalogs)*
