answer: |-
  Here's a decision tree based on your cases, designed for practical sorting. We'll follow the branching for each case and label the positions (or lack thereof). **Bold = Branch Point**, *Italic = Position Label/Conclusion*.

  ---

  **START: Sterile Worker Ant Case**  
  *(Where does the causal work happen for worker sterility evolving?)*  
  **• Branch 1: Queen's genome is the key driver**  
  → *Dawkins-style Gene Selectionism* (The "selfish gene" builds sterile workers as a vehicle strategy).  
  **• Branch 2: The colony acts as a cohesive "individual" (interactor)**  
  → *Wilson/Sober Multilevel Selection 1 (Group Selection)* (Selection acts on colony-level traits like worker efficiency).  
  **• Branch 3: Worker's own developmental program/sacrifice is key**  
  → **UNSTABLE/UNNAMED** (Why would selection favor a developmental program that *prevents* the individual's reproduction? This branch struggles without invoking benefits to something *else*, like the queen's genes or the colony. Often collapses back to Branch 1 or 2).

  ---

  **ADD Synthetic Biology Twist: Engineered Plasmid in Biofilm**  
  *(Plasmid spreads horizontally, boosts biofilm survival, but kills individual carriers. What's the unit?)*  
  *Building on previous branches...*  
  **• Branch 1A: Gene-Level Focus (Plasmid as replicator)**  
  → *Dawkins-style Gene Selectionism* (The plasmid "selfishly" replicates using horizontal transfer, sacrificing its carrier bacterium for its own spread *if* it boosts biofilm persistence where copies reside).  
  **• Branch 2A: Group-Level Focus (Biofilm survival paramount)**  
  → *Wilson/Sober Multilevel Selection 1 (Group Selection)* (Selection favors biofilms carrying the plasmid due to their persistence, despite individual cost).  
  **• Branch 3A: Holobiont-Level Focus (Biofilm as meta-organism)**  
  → *Holobiont Selection* (The biofilm itself, including its plasmid-carrying members, is the unit being selected for enhanced survival).  
  **• Branch X: Individual Bacterium Level?**  
  → **INCOHERENT** (Selection *cannot* favor the individual bacterium carrying the plasmid because it dies *faster*. This unit loses by definition).

  ---

  **ADD Cultural Transmission: Costly Norm**  
  *(Group adopts costly norm, hurts individual rep, helps group outcompete neighbors. Unit?)*  
  *Building on previous branches...*  
  **• Branch 1B: Individual-Meme Level Focus (Norm as replicator)**  
  → *Dawkins-style Meme Selectionism* (The norm "selfishly" spreads between individuals/groups because groups adopting it persist/replicate *culturally*, even if it harms individual biological fitness within the group).  
  **• Branch 2B: Group-Level Focus (Group competition drives it)**  
  → *Wilson/Sober Multilevel Selection 1 (Group Selection)* (Groups with the norm outcompete and replace groups without it, selecting for the group trait).  
  **• Branch 3B: Interactor/Replicator Split (Hull Style)**  
  → *Hull's Framework* (The *replicator* is the norm/meme; the *interactor* is likely the **group** in this scenario, as it's the group competing and persisting. This isn't a distinct "unit" answer but a framework accommodating Branch 1B or 2B).  
  **• Branch Y: Individual Human Level?**  
  → **UNATTRACTIVE/UNSTABLE** (If selection acted *only* on individual humans, the costly norm would be eliminated *within* the group. Its persistence requires a benefit at a higher level, like the group outcompeting others).

  ---

  **Key Overlaps & Where Cases Can't Separate Positions:**

  1.  **Group Selection (Wilson/Sober) pops up everywhere:** It's the stable answer for the *colony* in ants (Branch 2), the *biofilm* in the plasmid case (Branch 2A), and the *cultural group* in the norm case (Branch 2B). The cases don't cleanly separate different *flavors* of group selection.
  2.  **Dawkins vs. "Selfish" Replicators:** Gene Selectionism (Branch 1) and Meme Selectionism (Branch 1B) are both Dawkins-style "replicator" selection. The plasmid case (Branch 1A) also fits neatly here. The cases distinguish the *type* of replicator (gene, plasmid, meme) but not the core logic.
  3.  **Holobiont (Branch 3A) vs. Group Selection (Branch 2A):** Distinguishing biofilm-as-holobiont vs. biofilm-as-group is often fuzzy in practice. This case doesn't provide a clear test. Holobiont thinking often *is* a form of group selection focused on persistent symbiotic assemblages.
  4.  **Hull's Framework (Branch 3B) is Meta:** It doesn't specify *what* the interactor/replicator *is*, just provides the categories. It can encompass Branch 1B (meme replicator, group interactor) or align with Branch 2B (group as interactor, norm as replicator). It doesn't compete directly with the other labels.
  5.  **The "Unstable" Branches (Worker Dev, Individual Bacterium, Individual Human):** All these branches (3, X, Y) consistently fall apart because selection at the *individual* level *cannot* explain the trait (sterility, carrier death, costly norm adherence) in these specific scenarios. They highlight the *need* for a higher-level explanation in these cases.

  **In a Nutshell:** Your cases do a good job isolating *individual-level selection* as inadequate for these traits. They clearly support **Dawkins-style replicator selection** (gene/plasmid/meme) and **Wilson/Sober group selection** as viable frameworks. They struggle to cleanly separate different *types* of groups (standard group vs. holobiont) or provide a test where Hull's framework gives a unique "unit" answer. The "unstable" branches help rule out individual-centric explanations.
