  hey, i'm putting together a little taxonomy for my study group on the units of selection debate -- i want it sorted by concrete cases rather than just by which label people preffer. can you build me a decision tree?

  start with the classic sterile-worker-ant case: branch on whether the causal work is being done by the queen's genome, the colony acting as an interator, or the worker's own developmental program. then add a synthetic-biology twist: engineered plasmids spread horizontally through a bacterial biofilm, boost collective survival, but every bacterium that carries them dies faster. ask whether that counts as gene-level, group-level, or holobiont-level selection. then layer in cultural transmission: a human group adopts a costly norm that hurts individual reproduction but lets the group outcompete neighboring groups -- does the unit stay at the individual-meme level or jump up to the group?

  the leaves should name real positions where they exist (dawkins-style gene selectionism, hull's interactor/replicator split, wilson/sober multilevel selection, maybe holobiont selection) and mark everything else 'unnamed' or 'unstable'. for each unoccupied branch combo, write one sentence on whether it's incoherent, unattractive, or just unexplored. also flag any pair of leaves that these three cases can't actually seperate -- don't fake precision to cover gaps.

  please write the answer in american english, keep the tone casual, and don't ask me for citations, bibliographies, or direct quotes from texts. since this might run on a model without web access, just paraphrase anyone you mention. i appreciate it even if you miss a branch or two.
