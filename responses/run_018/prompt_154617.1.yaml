  Okay, the user is asking about a tension in Montaigne's reasoning in "Of Cannibals." They point out that Montaigne seems to advocate cultural relativism—each society views others through its own norms—while also making a normative judgment that European cruelty is worse than Tupinambá cannibalism. The user wants to understand how Montaigne reconciles these two positions without contradiction.

  I need to recall Montaigne's essay. He describes the Tupinambá people of Brazil, noting their lack of European institutions but their social harmony. He presents their cannibalism as a ritual of vengeance, contrasting it with European practices like torture and execution. Montaigne argues that "barbarism" is relative to one's own customs but then condemns European actions as genuinely worse. The user is questioning the consistency here.

  The key is Montaigne's distinction between two types of judgment. The first is conventional judgment, which is culturally relative. Each society labels others as barbaric based on deviations from their own norms. The second is natural judgment, which appeals to universal human sentiments like compassion or natural reason. This distinction resolves the apparent contradiction.

  When Montaigne says every nation calls others barbarous based on its own habits, that's conventional judgment. But when he critiques European cruelty, he's using natural judgment. He implies that causing prolonged suffering to living beings violates a universal human instinct against cruelty. The Tupinambá ritual, while shocking to Europeans, involves dead enemies and is driven by accepted cultural motives, not gratuitous suffering.

  Montaigne doesn't use terms like "cultural relativism," which are modern. Instead, he contrasts "law" and "artifice" with "Nature." European practices are condemned because they pervert natural reason by using religion and law to justify cruelty. The Tupinambá act according to their nature without such hypocrisy.

  The passage's logic: relativism applies to foreign customs (conventional judgment), but some acts, like torture, violate natural principles (natural judgment). Europeans are worse because they have the light of reason but distort it to inflict suffering, whereas the Tupinambá follow their culture without such perversion.

  I should avoid modern terms like "standpoint-dependent" and stick to Montaigne's own concepts. The distinction between conventional and natural judgment clarifies how he maintains both relativism and criticism of Europe. This resolves the tension the user identified.
answer: |-
  Montaigne navigates this tension through a distinction embedded in his argument, best understood as the difference between **conventional judgment** (culturally specific norms) and **natural judgment** (universal human sentiment grounded in reason and compassion). Here's how his logic unfolds without contradiction, based solely on the passage:

  1.  **Conventional Judgment (The Relativist Stance):**
      *   Montaigne observes that "every nation calls barbarous whatever differs from its own habits."
      *   This is a statement about *how people actually judge*. It's descriptive and relativistic. Cannibalism horrifies Europeans because it violates *their* specific taboos and conventions surrounding death and the body. Conversely, European torture might horrify the Tupinambá for violating *their* conventions or sensibilities.
      *   This level of judgment concerns *differences in custom* – practices like eating enemies vs. burying them, types of warfare, forms of government, or artistic expression. These are matters of convention, varying according to time and place. Labeling them "barbarous" is relative and reflects the judge's own cultural framework.

  2.  **Natural Judgment (The Normative Stance):**
      *   Montaigne shifts his ground when evaluating the *nature* and *effects* of actions, particularly concerning cruelty and suffering.
      *   He contrasts the Tupinambá ritual ("roast and consume *enemies*" who are already dead, motivated by a culturally specific "ritual of vengeance") with European practices ("torture, execution, and dismemberment performed upon *living bodies*").
      *   Crucially, he invokes a standard seemingly accessible to all humans: the instinctive aversion to *unnecessary suffering inflicted on the living*. He implies that causing prolonged, excruciating pain to sentient beings is inherently worse than consuming the dead, regardless of cultural context.
      *   His condemnation focuses on the *hypocrisy* and *perversion* inherent in the European acts: they are performed "in the name of justice and faith," masking cruelty with the veneer of law and religion. This perversion of reason and institutions meant for good is presented as a deeper corruption.

  **Where the Distinction Does Its Work:**

  The distinction between these two types of judgment resolves the tension:

  1.  **Relativism applies to *conventional practices and their immediate classification*:** Calling cannibalism "barbarous" *because it's unfamiliar or violates European burial rites* is merely conventional judgment. Similarly, the Tupinambá might find European practices barbarous for different conventional reasons. On *this level*, judgments are relative and standpoint-dependent.
  2.  **The Normative condemnation relies on *natural judgment concerning cruelty*:** Montaigne argues that the *fundamental character* of the European acts – inflicting extreme suffering on the living, driven by hatred masked as piety or law – violates a deeper principle. He appeals not to another specific cultural norm, but to a sentiment he believes is innate or accessible through natural reason: the inherent wrongness of *gratuitous cruelty causing intense suffering*. This is presented as a standpoint-transcendent truth.
  3.  **The Key Comparison:** Montaigne doesn't primarily compare the *cultural meaning* of eating the dead vs. torturing the living. He compares the *degree and nature of suffering inflicted* and the *corruption of intent*:
      *   **Tupinambá:** Act involves dead bodies; suffering (if any) is not the primary goal (vengeance is); motive is culturally coherent within their framework.
      *   **Europeans:** Act involves deliberate, prolonged suffering inflicted *on living, feeling beings*; suffering *is* the instrument and often the goal (to punish, terrify); motive is corrupted by hypocrisy (using "justice and faith" as justification).
      *   Therefore, based on natural judgment of cruelty and perverted reason, European practices are "genuinely worse."

  **Montaigne's Logic Summarized:**

  1.  **Conventional Relativism:** Labeling unfamiliar *customs* as "barbarous" is relative to one's own conventions. (Cannibalism *seems* barbarous to Europeans).
  2.  **Natural Standard:** However, there exists a natural human capacity to recognize certain core evils, particularly the infliction of excessive suffering and the perversion of reason/compassion for cruel ends.
  3.  **Application of the Natural Standard:** Judged by this natural standard (accessible to reason and sentiment), European practices – characterized by their focus on inflicting agony on the living and their hypocritical justification – constitute a deeper, more profound "barbarism" than the Tupinambá ritual.
  4.  **The True Barbarism Defined:** "The true barbarism lies not in foreign rites but in the cruelty Europeans display toward those they deem inferior, especially when that cruelty is masked by law and religion." Here, "true barbarism" is defined *not* by convention, but by its violation of the natural standard concerning cruelty and corrupted reason. The masking by law/religion highlights the *perversion* of natural judgment.

  **In essence:** Montaigne accepts relativism concerning the *labeling* of foreign *customs* (conventional judgment). However, he posits a universal human capacity for natural judgment concerning *fundamental morality*, particularly regarding cruelty and the corruption of reason/compassion. It is by appealing to this natural judgment that he condemns European practices as objectively worse ("true barbarism"), resolving the apparent contradiction. His relativism concerns *appearances* and *initial reactions* based on custom; his normative condemnation relies on a deeper, natural evaluation of *actions and their consequences* for human suffering and reason.
