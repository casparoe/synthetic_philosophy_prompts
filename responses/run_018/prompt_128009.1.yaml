prompt: |-
  I have recently been appointed to a municipal infrastructure review board, and we have been tasked with designing a pilot program for resolving technical disputes about public works through prediction markets rather than through conventional expert testimony. The board operates under tight constraints: we must render recommendations within ninety days, none of us are professional economists or forecasters, and any proposal that involves compulsory acquisition of property or intergenerational costs requires a separate democratic sign-off. I need a reusable decision procedure—something my colleagues and I can run in sequence on any incoming proposal—that translates the core logic of governance by prediction markets into practical steps for a non-specialist body.

  The procedure should ask, in a fixed order: how to determine whether the dispute is genuinely about empirical beliefs or disguised value disagreement; what minimal conditions a prediction market must satisfy before its forecast can be treated as advisory rather than binding; where the board must stop and defer to a political process because the resolution depends on distributive judgments; and how to audit for capture by stakeholders with disproportionate capital or expertise. It must include explicit stopping rules—answers that yield an immediate decision not to use the market—and must flag the precise points where judgment cannot be eliminated, especially when the scoring mechanism depends on outcomes observed long after current board members have left office. Please apply the procedure to three cases: a disagreement between hydrologists over which levee design best reduces flood risk over a fifty-year horizon; a proposal to rezone a waterfront district where the technical forecast is uncontested but residents disagree over whether economic growth outweighs community displacement; and a scenario in which the market strongly predicts that a cheap, technically adequate bridge alignment succeeds, but that alignment requires demolishing a registered heritage site that was never priced into the betting conditions. For each case, show where the procedure lands, including the case where its answer conflicts with the board's intuitive preference. Finally, state clearly what the procedure cannot settle—where it is likely to misfire, and which institutional safeguards it still requires outside its own logic.
reasoning: |-
  We are designing a reusable decision procedure for a municipal infrastructure review board to decide when and how to use prediction markets for resolving technical disputes in public works. The procedure must address specific questions in a fixed order and include stopping rules. We'll apply it to three cases.

  The procedure steps:

  1. **Determine if the dispute is empirical or a value disagreement:**
     - If the dispute is about facts, probabilities, or future outcomes that can be resolved by evidence, it is empirical. If it is about preferences, ethics, or trade-offs between incommensurable values, it is a value disagreement.
     - Stopping rule: If the dispute is primarily about values (not empirical), do not use a prediction market. Defer to the political process.

  2. **Check minimal conditions for the prediction market to be advisory:**
     - The market must have:
       a. A well-defined, verifiable outcome (with a clear resolution event and date).
       b. Sufficient liquidity and participation (to avoid manipulation and ensure the price reflects aggregated information).
       c. Accessibility to a diverse set of informed participants (to prevent capture by a narrow group).
     - Stopping rule: If these conditions cannot be met, do not use a prediction market.

  3. **Check if the resolution depends on distributive judgments:**
     - If the outcome of the market would lead to a decision that has significant distributional consequences (e.g., disproportionately affecting certain groups, intergenerational costs, compulsory acquisition of property) that have not been pre-authorized by a democratic process, then the board must stop and defer to a political process.
     - Stopping rule: If the market's outcome would require such distributive judgments without prior democratic approval, do not use the market.

  4. **Audit for capture:**
     - Design the market to be resistant to capture by stakeholders with disproportionate capital or expertise. This might include:
       a. Limiting the maximum stake any single participant can hold.
       b. Providing public subsidies for participation by underrepresented but knowledgeable parties (e.g., academic experts, community representatives).
       c. Monitoring trading patterns for signs of manipulation.
     - However, if the board determines that the risk of capture is too high and cannot be mitigated, it should not use the market.

  Additionally, we must note:
  - **Long-term outcomes:** If the outcome of the market depends on events that occur beyond the tenure of the current board, the procedure must require that the market's scoring mechanism is designed to be resolved and paid out at the appropriate future date, and that the board's decision is recorded with the understanding that it may be overridden by future boards if the outcome is not as predicted. However, if the long-term nature makes the market infeasible (e.g., no one is willing to bet on events 50 years in the future), then the stopping rule may be triggered.

  Now, let's apply the procedure to the three cases:

  **Case 1: Hydrologists' Dispute on Levee Design**
  - **Step 1 (Empirical vs. Value):** The dispute is about which levee design best reduces flood risk over 50 years. This is an empirical question about future outcomes and probabilities. It is not about values. Proceed.
  - **Step 2 (Minimal Conditions):** 
    - Outcome: The outcome (flood risk over 50 years) is verifiable but over a very long horizon. This poses a challenge for the market because participants may not be willing to bet on such a long-term event. Also, the resolution event is distant. We might need to use intermediate proxies (e.g., engineering simulations, expert consensus at intermediate stages) but that may not be as reliable. 
    - Liquidity and participation: Hydrologists and engineers might participate, but the long horizon may reduce participation. 
    - Accessibility: We can invite hydrologists, civil engineers, and climate scientists. But we must ensure diversity and avoid capture by a single school of thought.
    - Stopping rule: If we cannot define a feasible resolution event within a reasonable time frame (e.g., within 10-20 years) or if liquidity is too low, we stop. Given the 50-year horizon, it is likely we cannot meet the minimal conditions. **Stop.** Do not use the market. Rely on conventional expert testimony.

  **Case 2: Waterfront Rezoning**
  - **Step 1 (Empirical vs. Value):** The technical forecast (e.g., economic growth, displacement numbers) is uncontested. The dispute is about whether economic growth outweighs community displacement. This is a value disagreement (trade-off between economic efficiency and community preservation). 
    - Stopping rule: Because it is a value disagreement, **stop.** Do not use a prediction market. Defer to the political process (e.g., public hearings, city council vote).

  **Case 3: Cheap Bridge Alignment vs. Heritage Site**
  - **Step 1 (Empirical vs. Value):** The market strongly predicts that the cheap bridge alignment is technically adequate and successful. However, the dispute is not just technical: the heritage site demolition was never priced into the market. The technical adequacy is empirical, but the decision to demolish the heritage site involves a value judgment (preservation vs. cost savings). 
    - However, note: the market was set up to predict the success of the bridge alignment (presumably defined in technical terms: safety, durability, cost). The heritage issue was not part of the bet. So the market only addressed the empirical question: "Will this bridge design be successful (by technical criteria)?" 
    - Therefore, the dispute about the heritage site is a value disagreement. 
    - But wait: the board might have intended the market to resolve the technical dispute, and then separately they must decide on the heritage. So let's break it down:
      - The technical dispute about the bridge alignment (e.g., structural integrity, cost, construction time) is empirical and was addressed by the market. 
      - The heritage issue is a separate value question that was not part of the market.
    - Step 1: The technical part is empirical and the market has already been run (we are in the middle of the procedure). But the overall decision involves both technical and value components.
    - Now we proceed with the steps for the technical part (which the market has addressed) but then we must consider the value component.

    However, the procedure is applied to the dispute as a whole. Let's reexamine: 
    - The board is facing a decision: build the bridge with the cheap alignment (demolishing heritage) or choose a more expensive alternative? The market only addressed the technical success of the cheap alignment. It did not address the heritage loss.

    Applying the steps to the entire dispute:
    - **Step 1:** Part of the dispute is empirical (technical success of the bridge) and part is value (weighing heritage against cost). The procedure requires us to determine the primary nature of the dispute. Since the market already settled the empirical part, the remaining issue is the value of the heritage site. Therefore, the dispute now is primarily about values. 
    - **Stopping rule at Step 1:** We stop because the dispute is (now) primarily about values. We do not use the market for the value part. The market's output (on the technical part) is advisory, but the overall decision must be made through the political process because it involves a value trade-off and the destruction of a heritage site (which may be considered a distributive judgment or a non-empirical issue).

    Additionally, we must consider Step 3: 
    - **Step 3 (Distributive Judgments):** The demolition of the heritage site is a loss to the community (and possibly to future generations) and was not priced in. This requires a distributive judgment and democratic sign-off. Therefore, even if we had proceeded beyond Step 1, Step 3 would require stopping and deferring to a political process.

    Conclusion for Case 3: The market's prediction on the technical success of the cheap bridge is advisory, but the board must not treat it as binding for the overall decision because the heritage site requires a value judgment and democratic process. The board should not use the market to override the heritage concern. Instead, they should take the market's technical prediction as input and then defer the final decision to the political process.

  **What the Procedure Cannot Settle:**
  - **Misfires:** 
    1. The procedure may misfire if an empirical dispute is misclassified as a value dispute (or vice versa). This requires careful judgment at Step 1.
    2. Long-term predictions: The procedure may stop too often for long-term issues (like Case 1) because of the difficulty in setting up a market. This might lead to underutilization of prediction markets even when they could be designed with intermediate milestones.
    3. Complex disputes that interweave empirical and value questions: The procedure requires disentangling, which may be difficult.

  - **Institutional Safeguards Required:**
    1. **Expert Review for Step 1:** Have independent experts (with diverse viewpoints) help the board determine if a dispute is empirical or about values.
    2. **Market Design Expertise:** For Step 2, the board may need to consult market design experts to set up the market properly (even though the board members are non-specialists).
    3. **Democratic Oversight:** For Step 3, establish clear criteria for what constitutes a distributive judgment that requires democratic sign-off (e.g., any compulsory property acquisition, impacts on vulnerable groups, intergenerational costs). This should be pre-defined by legislation or charter.
    4. **Anti-Capture Measures:** For Step 4, implement real-time monitoring of the market by an independent body and have predefined thresholds for intervention (e.g., if one participant exceeds a stake limit).
    5. **Long-Term Commitments:** For outcomes that take a long time to resolve, set up an escrow mechanism and legal framework so that payouts can occur decades later. Alternatively, use shorter-term proxies that are highly correlated with the long-term outcome, with clear documentation of the limitations.

  **Final Note:** The procedure is a tool to guide the board, but it does not replace the need for transparency, public input, and accountability. The board should document each step of the procedure for every case and make the documentation public.
answer: |-
  Below is a reusable decision procedure for your municipal board, designed as a sequential checklist with explicit stopping rules. It addresses the core requirements: distinguishing empirical vs. value disputes, setting conditions for advisory prediction markets, flagging distributive judgments requiring democratic input, and auditing for stakeholder capture. Judgment points are explicitly marked where non-market decisions are unavoidable. The procedure is structured for non-specialists, using plain-language questions.

  ---

  ### **Decision Procedure for Prediction Market Pilot Program**  
  *Execute steps in sequence. Stop and reject the market if any stopping rule is triggered.*

  1. **Empirical vs. Value Disagreement Test**  
     *Question: Is the dispute primarily about a verifiable future outcome (e.g., "Will X happen?") rather than preferences (e.g., "Should we prioritize X over Y?")?*  
     - **Criteria**:  
       - Empirical: Disagreement centers on probabilities, facts, or measurable outcomes (e.g., flood risk, cost estimates).  
       - Value: Disagreement hinges on ethics, fairness, or trade-offs between goals (e.g., growth vs. displacement).  
     - **Stopping Rule**: If value-based, **stop** and defer to democratic process (e.g., public referendum, council vote).  
     - **Judgment Point**: If mixed, isolate empirical sub-questions for markets; defer value aspects to politics.  

  2. **Advisory Market Conditions Check**  
     *Question: Can a prediction market be designed with ALL of the following?*  
     - **Criteria**:  
       a. **Resolvable Outcome**: Clear, objective metric (e.g., "Flood depth > 2m by 2050") verifiable within ≤20 years.  
       b. **Liquidity & Diversity**: Rules ensure participation from ≥5 independent experts/groups (not funding each other).  
       c. **Anti-Capture Safeguards**: Stakes capped at ≤10% per participant; public subsidies for under-resourced experts.  
     - **Stopping Rule**: If any condition fails, **stop** and use conventional experts.  
     - **Judgment Point**: Board must define the outcome metric and audit participation.  

  3. **Distributive Judgment Screen**  
     *Question: Would acting on the market outcome require compulsory property acquisition, burden a vulnerable group, or create intergenerational costs?*  
     - **Criteria**:  
       - Yes: If market resolution enables actions with distributional consequences (e.g., eminent domain, historical loss).  
       - No: If impacts are budgetary/technical without winners/losers (e.g., choosing cheaper materials).  
     - **Stopping Rule**: If yes, **stop** and require democratic sign-off *before* market deployment.  
     - **Judgment Point**: Board must assess societal trade-offs; cannot delegate ethics to markets.  

  4. **Long-Term Outcome & Capture Audit**  
     *Question: For markets with outcomes >5 years, are ALL true?*  
     - **Criteria**:  
       a. **Payout Mechanism**: Escrow account/trust established to reward bettors after outcome verification.  
       b. **Capture Risk Low**: No stakeholder controls >15% of initial liquidity; trades are public.  
       c. **Proxy Metric Available**: If full outcome >20 years, a short-term proxy exists (e.g., "Approved by engineering review by 2030").  
     - **Stopping Rule**: If any false, **stop**.  
     - **Judgment Point**: Future boards must uphold payout/resolution; capture audits require third-party review.  

  ---

  ### **Application to Cases**  
  *Follows the procedure above. "Stop" terminates market use for that case.*

  **Case 1: Hydrologists’ Levee Design Dispute**  
  - **Step 1 (Empirical vs. Value)**: Empirical—disagreement on flood risk reduction (measurable). Proceed.  
  - **Step 2 (Advisory Conditions)**: Fails. Outcome horizon (50 years) >20 years; no feasible short-term proxy (e.g., engineering models are contested). **Stop**.  
    - *Outcome*: Use conventional expert testimony. Market rejected.  
  - *Why conflicts with intuition?* Boards might assume markets handle long-term forecasts, but liquidity/time constraints make it impractical.  

  **Case 2: Waterfront Rezoning**  
  - **Step 1 (Empirical vs. Value)**: Value-based—uncontested forecasts, but conflict over growth vs. displacement. **Stop**.  
    - *Outcome*: Defer to democratic process (e.g., community assembly). Market rejected.  
  - *Judgment Point*: Empirical forecasts (e.g., "Rezoning adds $X to GDP") could use markets, but the core conflict is value-driven.  

  **Case 3: Bridge Alignment vs. Heritage Site**  
  - **Step 1 (Empirical vs. Value)**: Mixed. Market predicts technical success (empirical), but heritage loss is value-based. Proceed with isolated empirical sub-question.  
  - **Step 2 (Advisory Conditions)**: Passes—outcome (e.g., "Bridge safety rating >90% by 2030") is resolvable.  
  - **Step 3 (Distributive Judgment)**: Heritage demolition requires compulsory acquisition + cultural loss. **Stop**.  
    - *Outcome*: Market forecast (bridge success) is advisory only; final decision requires democratic sign-off for heritage impact.  
  - *Why conflicts with intuitive preference?* Technocrats might prioritize cost savings, but procedure forces ethical issues into the open.  

  ---

  ### **What the Procedure Cannot Settle**  
  **Likely Misfires & Limits**:  
  1. **Misclassified Disputes**: If Step 1 misidentifies values as empirics (e.g., assuming "heritage value" is measurable), markets could override ethics.  
  2. **Long-Term Gaps**: Markets fail on >20-year outcomes (Case 1), leaving boards reliant on imperfect models.  
  3. **Non-Monetizable Values**: Heritage, community cohesion, or equity cannot be priced into markets (Case 3), risking reductionism.  
  4. **Expert Capture**: Step 4 audits may miss covert collusion (e.g., experts betting as a bloc).  

  **Required Institutional Safeguards**:  
  - **Pre-Market Review**: Independent ethicist + economist review Step 1/Step 3 judgments.  
  - **Democracy Override**: Any Step 3 "stop" triggers mandatory public consultation.  
  - **Sunset Clause**: Markets expire unresolved after 20 years; payouts voided (avoids intergenerational liability).  
  - **Transparency Log**: All trades/public comments published to deter capture.  

  This procedure ensures markets advise—not replace—democratic governance while flagging where human judgment remains irreplaceable. It prioritizes feasibility under your constraints (90 days, non-specialists) by converting prediction market theory into auditable yes/no questions.
