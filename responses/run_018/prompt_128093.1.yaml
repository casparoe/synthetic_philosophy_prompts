  First, I need to recall if there's an established concept for this exact cycle. Taxonomic inflation comes to mind, but that usually refers to over-splitting without the subsequent lumping phase. Cryptic species discovery is part of it but doesn't cover the cyclical aspect. Integrative taxonomy aims to combine data, but the cycle here involves conflict between genetic and other data types.

  The user mentioned key elements: genomic splitting based on divergence without morphological change, followed by functional equivalence and reproductive compatibility. Then the debate between splitters and lumpers. The cycle repeats with better tech. So the core is the tension between genetic divergence and functional/ecological cohesion.

  I should explain why existing terms don't fit. Taxonomic inflation lacks the cyclical nature and the lumping phase. Cryptic species is about initial discovery, not the later re-evaluation. Integrative taxonomy is a method, not the pattern itself. 

  Since there's no established term, I'll need to define the phenomenon. The key characteristics are the non-isolating genetic divergence correlated with environment, the absence of reproductive isolation, and the cycle driven by technological advances. 

  The boundary conditions are important. This happens when genetic divergence doesn't lead to speciation. If there was reproductive isolation, it would be valid splitting. Also, the environmental correlation without isolation is crucial. 

  Proposing a term: "taxonomic oscillation" captures the back-and-forth. "Cyclogenic instability" or "epicyclic taxonomy" could work too. But "taxonomic oscillation" is clearer. 

  I should also address why this occurs. Genomic data reveals historical divergence, while ecological data shows current gene flow. The pattern exposes different species concepts clashing. It's distinct from cases where genetic clusters do indicate speciation. 

  The user wants a precise definition, not just a label. So outlining the phenomenon's boundaries and characteristics is essential. Making sure to differentiate from related concepts and explain the cyclical nature tied to technological progress.
answer: |-
  Based on your precise description, **there is no single, widely established term for the *cyclical instability itself***. The pattern you outline is a recognized tension in modern systematics, but it lacks a dedicated label that captures the *iterative cycle* driven by technological advances conflicting with functional/ecological cohesion.

  Here's the conceptual carving you requested:

  1.  **What the Pattern Is (Core Phenomenon):**
      *   **"Phylogenomic Over-Splitting Followed by Functional Re-Lumping Cycle"** or **"Taxonomic Oscillation Driven by Genomic Resolution"**.
      *   **Driving Force:** Technological advancement enabling higher-resolution genomic sampling (e.g., microsatellites -> AFLPs -> RADseq -> WGS).
      *   **Initial Phase (Split):** Discovery of deep, geographically structured, and often environmentally correlated genetic divergence within a morphologically uniform taxon. This divergence is interpreted (often under the Phylogenetic Species Concept or emphasis on historical lineages) as warranting taxonomic splitting into multiple species, despite lacking obvious morphological or *immediately apparent* reproductive barriers.
      *   **Subsequent Phase (Lump Challenge):** Ecological niche modeling, common garden experiments, reciprocal transplants, and studies of sympatric zones or lab crosses demonstrate:
          *   Functional equivalence in key ecological roles (same realized niche).
          *   High levels of gene flow upon secondary contact (no pre- or post-zygotic isolation).
          *   Hybrid fitness equal to parental types.
          *   Phenotypic plasticity often explains observed minor variations.
      *   **Resolution Phase (Conflict):** Debate ensues:
          *   "Lumpers" argue the genetic clusters represent ecotypes or structured populations within a single biological species, not reproductively isolated lineages. Functional equivalence and gene flow are paramount.
          *   "Splitters" argue the deep divergence indicates evolutionary independence and distinct historical trajectories, warranting recognition as separate species (emphasizing lineage separation over current gene flow potential).
          *   Compromise proposals (ESUs, MUs) emerge but often fail to resolve the fundamental species concept disagreement.
      *   **Cyclical Nature:** The cycle repeats when *even higher* resolution genomic techniques are applied, potentially revealing finer-scale structure within the previously defined clusters, reigniting the split/lump debate.

  2.  **What it is NOT (Distinguishing from Related Concepts):**
      *   **Taxonomic Inflation:** While over-splitting is a key *phase*, taxonomic inflation refers to a *persistent trend* of increasing species numbers due to changing concepts or criteria (e.g., adopting PSC), *regardless* of subsequent validation. **This pattern is cyclical and specifically driven by *sequential technological advances* revealing divergence that *later proves non-isolating*.** Inflation might be an *outcome* of one phase, but the cycle itself involves the *challenge* to that inflation.
      *   **Cryptic Species Discovery:** This is the *initial split* phase. However, true cryptic species are reproductively isolated. **This pattern specifically involves cases where the initially presumed "cryptic species" are later shown *not* to be reproductively isolated or ecologically divergent.** The cycle encompasses the *subsequent invalidation* of the cryptic species hypothesis based on functional/reproductive data.
      *   **Integrative Taxonomy (as a solution):** Integrative taxonomy is the *goal* or *methodology* of using multiple lines of evidence (morphology, genetics, ecology, reproduction) to delimit species. **This pattern highlights the *failure* or *tension* within integrative taxonomy when different data types (genomic divergence vs. ecological/functional/reproductive cohesion) yield conflicting signals.** The cycle thrives when integration is incomplete or conceptually disputed.
      *   **Genuine Speciation with Incipient Stages:** This pattern specifically excludes cases where genetic divergence *is* accompanied by (or leads to) evolving reproductive isolation, niche differentiation, or hybrid dysfunction – even if subtle or incomplete. Here, the split would be justified.
      *   **Simple Population Structure:** While the genetic signal resembles structure, the *depth* of divergence detected by high-res genomics initially suggests something more (lineage separation), triggering taxonomic action. The cycle arises from mistaking deeply structured populations for nascent species.

  3.  **Boundary Conditions & Key Features:**
      *   **Essential Element:** **Environmentally Correlated but Non-Isolating Divergence.** The genetic divergence is strong and often correlates with environmental gradients (e.g., temperature clines, salinity regimes), suggesting local adaptation. However, this divergence **does not constitute a barrier to gene flow** upon secondary contact and **does not translate into ecological niche differentiation or reproductive isolation**.
      *   **Core Driver:** **Technological Resolution Outpacing Functional Validation.** The cycle is fueled by the rapid pace of genomic technology revealing historical population structure at ever-finer scales, while comprehensive ecological and reproductive studies are slower, more complex, and often lag behind.
      *   **Conceptual Conflict:** **Clash of Species Concepts.** The heart of the cycle is the tension between concepts emphasizing historical lineage separation and divergence (PSC, ESC) vs. concepts emphasizing current reproductive community and ecological role (BSC, ESC in practice, Ecological SC).
      *   **Necessary Conditions:**
          *   Morphological stasis/conservatism.
          *   High dispersal potential or recent secondary contact opportunities.
          *   Strong environmental gradients driving local adaptation (neutral or adaptive divergence).
          *   Lack of intrinsic post-zygotic barriers.
          *   Phenotypic plasticity buffering against niche divergence.
      *   **Edge Cases:**
          *   *Weak Hybrid Dysfunction:* If hybrids show *slight* reductions in fitness only under very specific conditions, does it validate the split or support lumping? The cycle persists near this edge.
          *   *Partial Niche Partitioning:* If some minor niche differentiation exists but core functions and hybridization are rampant, does it warrant ESU status or full species? Ambiguity fuels the cycle.
          *   *Asymmetric Gene Flow:* If gene flow occurs but is asymmetric, does it indicate incipient isolation or just demographic history? Interpretation varies.
          *   *Time Since Divergence:* Very ancient divergence with secondary gene flow might still be considered separate species by some, even without current isolation, pushing the boundary.

  4.  **Proposed Terminology:**
      Given the lack of an established term, the most precise descriptors are:
      *   **Taxonomic Oscillation:** Captures the inherent back-and-forth instability.
      *   **Cyclogenic Instability in Species Delimitation:** Emphasizes the cycle is generated by the process itself and technological progress.
      *   **The Epicyclic Taxonomy Problem:** Likening it to adding cycles upon cycles (like epicycles in Ptolemaic astronomy) to explain patterns as resolution increases, without necessarily convergent stability. ("Epicyclic" implies complexity rather than resolution).
      *   **Genomic Resolution-Induced Taxonomic Churn:** Highlights the specific driver and the instability.

  **"Taxonomic Oscillation"** is likely the most accessible and descriptive term for the cyclical instability itself.

  **In essence:** This pattern is the recurring taxonomic instability arising when high-resolution genomic data reveals deep population structure suggestive of lineage separation, prompting species splitting, which is subsequently challenged by data showing functional equivalence, reproductive compatibility, and gene flow, leading to re-lumping debates. This cycle is driven by the rapid advancement of genomic technology revealing *non-isolating*, environmentally correlated divergence faster than ecological and reproductive studies can validate its taxonomic significance, fundamentally exposing conflicts between lineage-based and cohesion-based species concepts. It is distinct from simple over-splitting, genuine cryptic species discovery, or successful integrative taxonomy.
