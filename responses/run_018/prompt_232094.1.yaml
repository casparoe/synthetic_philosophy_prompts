answer: |-
  ### Final Exam Question: Philosophy of Biology  
  **Question (20 marks):**  

  > **The Chromium Goblin:** Imagine a synthetic microbe engineered *de novo* (from scratch, no ancestral lineage) to clean industrial wastewater. It contains an "organelle" called a *voltaic pump*: a structure that uses bioelectricity to export dissolved chromium, preventing cellular toxicity. Crucially:  
  > - The pump was designed by humans to serve this purpose.  
  > - It works perfectly, sustaining the cell.  
  > - It has **no evolutionary history**; selection never shaped it.  
  >  
  > **Analyze:**  
  > 1. Would the *etiological account* say the voltaic pump has a *biological function*? Why?  
  > 2. Would the *causal-role account* say it has a *biological function*? Why?  
  > 3. Explain why **both verdicts feel philosophically unsatisfying** in this case.  
  > 4. What **fundamental disagreement** between the two accounts does this reveal?  

  ---

  ### Model Answer (Excerpts Illustrating "Doing, Not Defining")  
  *(Full 1,500-word response simulated here via key analytical moves)*  

  > **1. Etiological Verdict (Wright-style):** No function. The pump lacks a history of selection for chromium export. Its existence isn’t explained by past success. *Design intent by humans is irrelevant*—evolution, not engineers, grants "proper function." Calling it functional smuggles in teleology without natural selection. *Verdict:* It’s merely *useful*, not functional.  
  >  
  > **2. Causal-Role Verdict (Cummins-style):** Yes, function. The pump plays a causal role in maintaining cell viability (by exporting toxins) within the microbe’s chemical system. Its activity contributes to a capacity (survival in chromium-rich environments) we wish to explain. *Design and history are irrelevant*—only current causal organization matters. *Verdict:* It has a function *as defined by its systemic role*.  
  >  
  > **3. Why Both Verdicts Chafe:**  
  > - **Etiology’s Absurdity:** Denying function here feels perverse. The pump *obviously* exists *for* chromium export—engineers built it solely for this purpose! Calling this "accidental usefulness" ignores deliberate teleology. Biology increasingly creates *de novo* life; must we deny all function in synthetic organisms?  
  > - **Causal-Role’s Emptiness:** Calling it functional feels trivial. *Any* useful part in *any* system qualifies (e.g., a rock propping open a door has the "function" of maintaining airflow). This dilutes "function" to mere "causal contribution," stripping its normative, purpose-driven weight. Why privilege biology?  
  >  
  > **4. The Fault Line:** The core clash is **whether history is necessary for normativity**.  
  > - Etiology ties function to *historical success*: "What it *was* selected *for*." This anchors "purpose" but excludes ahistorical systems.  
  > - Causal-role ties function to *current explanatory utility*: "What it *does* for the analyst." This includes novel systems but severs purpose from origins.  
  > **The Chromium Goblin thus exposes biology’s dilemma: Can "purpose" exist without Darwinian pedigree?**  

  ---

  ### Marking Scheme (20 Marks Total)  
  **Must-hit points** (Award marks *only* if demonstrated via application to the Chromium Goblin):  

  | **Points**                                                                                                | **Marks** | **Typical Flaws (Zero Marks for This Point If Observed)**                          |  
  |-----------------------------------------------------------------------------------------------------------|-----------|------------------------------------------------------------------------------------|  
  | **1. Etiological verdict + justification** (No function; no selection history)                            | 4         | *Fluff:* Defines etiology generally but doesn’t apply to the pump’s lack of history. |  
  | **2. Causal-role verdict + justification** (Has function; role in sustaining cell/system)                 | 4         | *Fluff:* Defines causal-role but doesn’t specify the pump’s causal contribution.     |  
  | **3. Etiology’s unsatisfying aspect** (Absurdity: denies obvious designed purpose/human teleology)        | 4         | *Fluff:* Calls it "counterintuitive" without explaining *why* (e.g., ignores design). |  
  | **4. Causal-role’s unsatisfying aspect** (Emptiness: trivializes function to any causal contribution)     | 4         | *Fluff:* Says "it’s too broad" without linking to normativity or synthetic context.  |  
  | **5. Identifies core fault line** (History-as-purpose vs. current-role-as-purpose; normativity clash)     | 4         | *Fluff:* Vaguely notes "they disagree" without contrasting historical vs. explanatory grounds. |  

  ---

  ### Why This Works for Your Class  
  - **Strange Enough**: The "Chromium Goblin" and "voltaic pump" add narrative texture (novelist-approved!) while keeping philosophy sharp.  
  - **Self-Contained**: Zero citations needed—pure conceptual tension.  
  - **Forces Application**: Students *must* grapple with the engineered edge-case; summaries of Wright/Cummins earn no marks.  
  - **Fault Line Focus**: The "normativity without history" dilemma is the philosophical payoff.  

  Let me know if you’d like a wilder organism (e.g., a fungus that weeps antibiotic tears due to accidental contamination in the lab’s vending machine). Good luck with the goblins!
