answer: |-
  Here’s the scenario:  

  At a primate cognition lab, researchers study "Astra," a macaque with early-stage human cortical grafts integrated into her prefrontal cortex. Due to a developmental quirk in the grafting process, Astra’s thalamus never linked properly to the new tissue. She displays advanced rational problem-solving: she can learn complex puzzle rules, use tools strategically, and even "trade" tokens for rewards via a touchscreen interface. However, she shows zero signs of sentience: no pain avoidance (e.g., ignoring heated surfaces or injections without vocalizing/flinching), no stress behaviors in isolation, and no observable affect during social interactions. Her behaviors are purely goal-directed computations. The lab proposes using Astra for non-terminal neural mapping studies to understand degenerative brain diseases, arguing her unique physiology offers irreplaceable insights.  

  **Analysis:**  
  1. **Contractualist/Speciesist View:** Protects Astra. Rational agency (her demonstrable problem-solving and rule-following) grants moral status. Since her cognition is functionally human-like due to the grafts, she qualifies for protection as a "borderline" rational agent or as having human-derived potential. Species membership isn’t purely biological here—it’s extended to beings with human-like rationality. Harming her violates norms against exploiting rational beings.  

  2. **Sentience-Based View:** Permits research. Moral status requires the capacity to suffer or experience well-being. Astra lacks thalamic integration, meaning no subjective awareness—just "lights on, nobody home." Without sentience, there’s no intrinsic harm in using her for beneficial research, much like ethically using an advanced AI or brain-dead human tissue.  

  3. **Key Feature:** The **decoupling of rationality from sentience**. Usually, rationality implies sentience (making anti-speciesism protect such beings). Here, Astra has *only* rationality—no inner life—flipping the dynamic. Contractualism prioritizes rationality; sentientism prioritizes feeling.  

  4. **Anti-Speciesist Reply:** They might argue:  
     - **Precautionary principle:** Absence of observed pain behavior ≠ absence of latent sentience. Thalamic defects might not preclude rudimentary experience.  
     - **Relational harm:** Using Astra normalizes treating human-neural hybrids as tools, risking slippery slopes toward exploiting *sentient* beings with similar modifications.  
     - **Symbolic violence:** Her human-like cognition could evoke empathy or moral unease irrespective of sentience, making her use socially corrosive.  

  **Reversal Check:** If thalamic integration is added (enabling sentience), both views converge: contractualism still protects her (rational + human-like), and sentientism now demands protection (capacity to suffer). The "flip" collapses—sentience becomes the decisive factor, aligning the views against exploitation.  

  *(Scenario: 1 para; Analysis: 4 points + check)*
