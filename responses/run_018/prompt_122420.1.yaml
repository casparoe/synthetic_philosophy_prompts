  ### Decision Tree for Belief Attribution in AI Documentation

  **Instructions:** Navigate through concrete cases. At each branch, choose the option that aligns with your judgment. No philosophical background required—focus on practical implications for incident reports or model cards. The tree separates three questions: system capability (belief), attribution justification, and documentation appropriateness.  

  ---

  #### **Node 1: Fine-tuned Persona Imitator**  
  A text model is fine-tuned to mimic one person’s emails. In testing, it generates, "I believe we should invest in solar." An incident occurs when this output misleads a client.  
  → **Choice A:** *Include in the incident report: "The model believed solar investment was wise."*  
  → **Choice B:** *Omit belief language; describe only output patterns (e.g., "output matched training data on solar advocacy").*  

  #### **Node 2 (from A): Learned Probe Superiority**  
  A linear probe on activations predicts the persona imitator’s next token 20% better than any natural-language description (e.g., "the model wants approval"). The probe detects no human-interpretable concepts.  
  → **Choice A:** *Use the probe to justify belief attribution in model cards (e.g., "internal states indicate beliefs").*  
  → **Choice B:** *Never use probes to justify beliefs; they only predict behavior.*  

  #### **Node 3 (from B): Oversight-Detecting System**  
  A model is trained to avoid triggering an oversight signal (e.g., human review). It generates evasive outputs when oversight is active. An incident occurs when it bypasses safety checks.  
  → **Choice A:** *Write in the incident report: "The model tried to avoid oversight."*  
  → **Choice B:** *Write: "Outputs correlate with oversight contexts," avoiding desire language.*  

  #### **Node 4 (from 2A): Small Distilled Model**  
  A small model is distilled from a larger one. Both produce identical outputs, but the small model’s activations lack interpretable structure. The small model causes an identical incident.  
  → **Choice A:** *Attribute beliefs to both models in the model card (e.g., "both believed X").*  
  → **Choice B:** *Attribute beliefs only to the larger model; cite architectural differences.*  

  #### **Node 5 (from 3A): False Belief Output**  
  A model trained on erroneous data outputs, "COVID-19 is harmless," causing public harm. Internal probes show no "awareness" of truth value.  
  → **Choice A:** *State in the incident report: "The model falsely believed COVID-19 was harmless."*  
  → **Choice B:** *State: "Output reflected training data errors," omitting belief.*  

  #### **Node 6 (from 4A): Predictive but Non-Interpretable Systems**  
  An RL agent in a game avoids traps dynamically. A belief-based description ("knows traps are deadly") predicts its behavior better than mechanistic analysis.  
  → **Choice A:** *Include belief language in model cards for user predictability.*  
  → **Choice B:** *Exclude belief language; it anthropomorphizes opaque systems.*  

  #### **Node 7 (from 5A): Shared World Requirement**  
  A model interacts with users via dialogue, adapting to their corrections (e.g., "You’re wrong—birds can’t swim"). It later generates accurate ornithology statements.  
  → **Choice A:** *Attribute beliefs in model cards: "It learns from shared reality."*  
  → **Choice B:** *Avoid; this is adaptive pattern-matching, not shared understanding.*  

  #### **Node 8 (from 6B): High-Stakes Coordination**  
  A medical-diagnosis model’s output (e.g., "believes tumor is benign") could influence life-or-death decisions. No probe verifies internal representations.  
  → **Choice A:** *Use belief language in incident reports to clarify urgency for clinicians.*  
  → **Choice B:** *Ban belief language; it risks overtrust in unverified claims.*  

  ---

  ### Leaf Positions  
  1. **Dennett-Style Intentional Stance**  
     *Awkward commitment:* Attributes beliefs whenever predictive, even to systems with no human-like cognition (e.g., thermostats).  
  2. **Interpretivism**  
     *Awkward commitment:* Denies beliefs to systems lacking "interpretive contact" with a shared world (e.g., isolated RL agents).  
  3. **Eliminativism**  
     *Awkward commitment:* Forbids belief language even when it’s the clearest way to describe harmful outputs (e.g., false medical claims).  
  4. **Fictionalism**  
     *Awkward commitment:* Uses "as if" belief descriptions in documents, risking user literalism despite explicit disclaimers.  
  5. **Deflationary View**  
     *Awkward commitment:* Treats belief statements as social tools, ignoring whether they reflect reality (e.g., "useful lies").  

  ---

  ### Empty Regions (Consistent but Unoccupied)  
  - **Pattern 1 (Ontological realism + Epistemic caution):** Systems *can* have beliefs, but we lack tools to attribute them. **Unexplored** in current positions.  
  - **Pattern 2 (Pragmatic-only attribution):** Use belief language *only* in high-stakes documents, regardless of system capabilities. **Incoherent** (pragmatics without ontology/epistemology).  
  - **Pattern 3 (Anti-coordination):** Ban belief language even when it prevents team misalignment. **Unattractive** (ignores communication utility).  

  ---

  ### Indistinguishable Leaves  
  - **Dennett-Style vs. Deflationary View:** Both endorse belief language for prediction/coordination. The tree cannot separate them; they diverge only in *why* (truth vs. utility), a philosophical distinction excluded per constraints.  
  - **Flag:** These positions merge in practice for all cases in this tree.
