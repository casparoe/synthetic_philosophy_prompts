prompt: |-
  I'm running a small online forum where people argue about ethics and weird hypotheticals, and I keep seeing the same trick: someone tells a little story, asks "what would you do?", then claims they've proved something huge about morality or identity. I want a reusable decision procedure I can run in about five minutes — I have no philosophy degree, I do this maybe twice a week, and I have to post my verdict publicly so I can't hide behind jargon — to check whether one of these intuition pumps (those little stories philosophers use) is actually doing honest philosophical work or just pushing my buttons. You are an expert in argument analysis and intuition pumps; please think carefully, start with a brief brainstorm of the main ways these pumps mislead, then write me the tool.

  The deliverable should be an ordered checklist: the exact question at each step, what counts as a sufficient answer, the hard stop where I say "this pump is broken — don't use it," and the points where I must hand the decision to a person because it's a value judgement not a fact check. It must cover hidden variables being twisted without notice, emotional loading that drives the answer, and the "ghost knob" problem — that's my own idea for a framing detail being treated as essential when it's really accidental. Show me exactly how to spot a ghost knob and flip it.

  Then apply the procedure to three cases:
  1. The burnt portrait: a painter spends ten years on a work, then on the final day burns it because she decides it's awful. Someone uses this to prove only the outcome matters, not the process.
  2. The footbridge trolley case: pushing one person off a bridge to stop a train and save five.
  3. Pick one more case yourself, but make it one where your procedure rejects the pump even though the conclusion feels right to me — I want to see an answer I won't like.

  Finally, say clearly what this procedure can't do, flag the judgement-call zones honestly, and write everything in British English. Don't ask me for citations, reading lists, or bibliographies — I just need the operational tool. There's definatly a typo or two in this prompt; please ignore them and just answer.
reasoning: |-
  Alright, the user runs a small online forum where people debate ethics using hypothetical stories. They're frustrated because these "intuition pumps" often lead to overreaching conclusions. They want a quick, reusable checklist to evaluate these stories without needing a philosophy degree. 

  First, I need to unpack their core pain points: 
  - They're time-pressed (needs a 5-min tool, used twice weekly) 
  - They lack formal training but must publicly judge arguments 
  - They specifically want to catch three flaws: hidden variable twists, emotional manipulation, and "ghost knobs" (their clever term for accidental framing details treated as essential)

  Hmm, the ghost knob concept is particularly interesting. It shows they've already noticed how stories smuggle in assumptions through irrelevant details. I'll need to operationalize that insight clearly.

  Brainstorming key failure modes first:
  1. **Hidden variables**: Swapping definitions mid-argument (e.g., "harm" meaning physical injury vs. emotional distress) 
  2. **Emotional loading**: Using visceral details (burning art) to override rational assessment 
  3. **Ghost knobs**: Treating incidental story elements (like the portrait being physical) as necessary when they're not 
  4. **False equivalence**: Pretending two scenarios are identical when they differ in morally relevant ways 
  5. **Overgeneralization**: Claiming a single case proves universal rules 

  For the checklist, I'll structure it as a kill-chain: early steps flag fatal flaws (stop now!), later ones identify repairable issues. Must emphasize British English throughout per request. 

  Key design principles: 
  - **Actionable questions**: No jargon, just "does X happen?" 
  - **Clear thresholds**: Binary pass/fail criteria (e.g., "if YES to Q3, pump broken") 
  - **Judgement zones**: Explicitly call out where personal values decide (e.g., "this question requires YOUR ethics input") 

  Now for the case applications: 
  1. **Burnt portrait**: Will fail ghost knob test (treating physical destruction as essential) and overgeneralization (one act ≠ proof of outcome-only morality) 
  2. **Trolley problem**: Passes initial checks but hits value judgement at Q5 (personal sacrifice vs. killing) - can't resolve mechanically 
  3. **Self-chosen case**: Picking "Ship of Theseus" to frustrate them - it feels logically sound but fails Q2 (hidden variable: "identity" undefined) 

  Finally, limitations: Must stress this can't handle novel dilemmas or resolve deep value conflicts. The "values lock" icon in the checklist will visually flag judgement zones. 

  ...Double-checking British spellings: "realise", "analyse", "travelling". Ignoring their typos ("definatly") as instructed. 

  This should give them a battle-ready tool that respects their time constraints and forum context while targeting their observed pain points.
answer: |-
  Here's your **Intuition Pump Integrity Scanner (IPIS)** – a five-minute checklist in British English. It targets hidden variables, emotional loading, and ghost knobs (your framing flaw concept). Use it publicly to show *why* a pump fails, not just that it does.

  ---

  ### **IPIS Checklist: Ordered Steps for Evaluating Intuition Pumps**
  *(Answer each question sequentially. Stop if any "HARD STOP" condition is met.)*

  1.  **QUESTION:** *Does the story clearly define its key moral term(s) (e.g., "fair", "harm", "identity", "matters") in the context used, and stick to that definition?*  
      **SUFFICIENT ANSWER:** Yes (explicit definition or unambiguous context). No (shifts meaning, relies on vagueness).  
      **RESPONSE:** If **NO → HARD STOP**. "Pump invalid: Key term undefined or slippery."  
      **JUDGEMENT ZONE:** None. This is logic.

  2.  **QUESTION:** *Does the story rely on a hidden variable change (e.g., swapping "intention" for "outcome", "physical continuity" for "memories") without signalling it?*  
      **SUFFICIENT ANSWER:** Compare the variable driving the *initial intuition* to the one used in the *claimed proof*. If different and unannounced → YES.  
      **RESPONSE:** If **YES → HARD STOP**. "Pump invalid: Smuggled variable swap."  
      **JUDGEMENT ZONE:** None. This is spotting trickery.

  3.  **QUESTION:** *Is there a "Ghost Knob"? (Is a specific, vivid framing detail treated as essential to the moral question when it's actually replaceable without changing the core dilemma?)*  
      **SUFFICIENT ANSWER:** **FLIP TEST:** Try replacing the vivid detail with a neutral/opposite one. If the core dilemma remains intact, it’s a Ghost Knob. (e.g., "burning a portrait" → "deleting a digital file"). If YES → Ghost Knob found.  
      **RESPONSE:** If **YES → Flag it publicly**: "Ghost Knob detected: Framing detail [state detail] is emotionally loaded but not essential. Argument relies on reaction to this, not the core principle." *Proceed to Q4, but the pump is weakened.*

  4.  **QUESTION:** *Is strong emotional language/imagery used (e.g., "burn", "scream", "betray") that isn't strictly necessary to describe the hypothetical facts?*  
      **SUFFICIENT ANSWER:** Remove the charged words. If the scenario feels less compelling or your intuition shifts → YES (Emotional Loading).  
      **RESPONSE:** If **YES → Flag it publicly**: "Pump uses emotional loading ([example words]). This may bias intuitions." *Proceed.*

  5.  **QUESTION:** *Does the claimed conclusion ("This proves X!") actually follow from the *single* intuition prompted by the story? Could other principles explain the intuition just as well?*  
      **SUFFICIENT ANSWER:** Generate 1-2 alternative explanations for why someone might have that intuition. If plausible alternatives exist → NO (Overreach).  
      **RESPONSE:** If **NO → HARD STOP**. "Pump invalid: Conclusion overreaches. Story only supports [state weaker claim, e.g., 'sometimes outcomes matter'], not [grand claim]."  
      **JUDGEMENT ZONE:** Identifying *plausible* alternatives requires minimal philosophical imagination, not deep expertise.

  6.  **QUESTION:** *Is the pump being used to dismiss a significant, established concern (e.g., "This shows process doesn't matter AT ALL!")?*  
      **SUFFICIENT ANSWER:** Yes (Extreme dismissal). No (More nuanced claim).  
      **RESPONSE:** If **YES → Flag it publicly**: "Pump used for extreme dismissal. Single counter-examples rarely erase complex concepts." *Proceed.*  
      **JUDGEMENT ZONE:** Assessing "significance" is contextual but usually obvious in these arguments.

  7.  **QUESTION:** *Does evaluating the core moral dilemma in the story unavoidably depend on a fundamental value judgement (e.g., the sanctity of life vs. consequences, rights vs. utility)?*  
      **SUFFICIENT ANSWER:** Would reasonable people with different core values *necessarily* disagree on the "right" answer here, even if they agreed on all the facts? If YES → Value Judgement Zone.  
      **RESPONSE:** If **YES → PUBLIC VERDICT:** "Pump highlights a genuine value conflict about [state conflict, e.g., 'personal sacrifice vs. actively harming others']. It cannot *prove* one set of values is universally correct. This is a matter for debate, not proof by story."  
      **JUDGEMENT ZONE:** **YES.** This is where personal or cultural values decide the answer. The pump can *illustrate* the conflict, not resolve it.

  ---

  ### **Applying IPIS to Your Cases**

  **1. The Burnt Portrait**
  *   **Q1 (Definition):** "Matters" is vague. Does outcome matter *more*? *Exclusively*? Unclear. **→ HARD STOP (Pump Invalid).** *(Also fails Q5 - Intuition that burning was decisive could stem from respect for artist's autonomy, not outcome supremacy).*

  **2. The Footbridge Trolley Case**
  *   **Q1:** "Save", "harm" fairly clear here. Pass.
  *   **Q2:** Usually presented clearly (killing 1 vs. letting 5 die). Pass.
  *   **Q3 (Ghost Knob):** "Pushing someone" is vivid. **FLIP TEST:** What if you drop a remote-controlled weight? Or the person is a villain about to detonate a bomb anyway? Core dilemma (active kill vs. passive letting die) remains. **→ Ghost Knob (Pushing)**. Flag.
  *   **Q4:** "Pushed off a bridge" has emotional loading. Flag.
  *   **Q5:** Intuition (often reluctance to push) *could* be explained by aversion to personal violence, not a rejection of utilitarianism. Pass (barely, as alternatives exist).
  *   **Q6:** Often used to dismiss deontology ("Don't kill!") as absurd. **→ Flag extreme dismissal.**
  *   **Q7:** **→ YES (Value Judgement Zone).** Core conflict: Sanctity of Life/Rights vs. Maximising Good. **VERDICT:** "Pump usefully illustrates the visceral conflict between actively harming one to save many versus passive inaction. It cannot *prove* either utilitarianism or deontology is correct. Value judgement required."

  **3. The Self-Driving Car Dilemma (Chosen by me - You'll dislike rejection)**
  *   *Story:* A self-driving car must choose: swerve, killing its elderly passenger but saving 5 children in the road, or stay course, killing the 5 children. Proponent: "This proves we must programme cars to always minimise total loss of life, regardless of passenger status!"
  *   **IPIS Analysis:**
      *   **Q1:** "Minimise total loss of life" is clear. Pass.
      *   **Q2:** None obvious. Pass.
      *   **Q3 (Ghost Knob):** "Elderly passenger" vs. "Children". **FLIP TEST:** What if it's 5 elderly vs. 1 child? Or 5 strangers vs. 1 passenger (same age)? Intuition *shifts dramatically*. The specific ages/roles are Ghost Knobs driving emotional response. **→ Flag Ghost Knobs (Ages/Passenger Status).**
      *   **Q4:** "Elderly", "Children" are highly emotionally loaded terms here. **→ Flag Emotional Loading.**
      *   **Q5:** **YES → HARD STOP.** The intuition (save the children!) could stem from valuing *young* life more, valuing *innocent bystanders* (children) over a passenger who accepted some risk, or simple bias towards children – *not* purely from "minimise total loss of life". The pump overreaches by claiming it proves pure minimisation is *required*. Other principles (passenger priority, age weighting) explain the intuition too.

  ---

  ### **What IPIS Can't Do (Limitations & Judgement Zones)**

  1.  **Resolve Deep Value Conflicts (Q7):** It flags them. *You* must facilitate that debate. IPIS doesn't tell you *which* values are right.
  2.  **Judge Novel Dilemmas:** It assesses the *argument structure* of known intuition pump types. Truly original scenarios might need different tools.
  3.  **Prove Positive Truth:** It finds flaws. A passed pump isn't automatically "true," just not broken *in these specific ways*. It shows the story *could* be doing honest work.
  4.  **Replace Domain Expertise:** For highly technical pumps (e.g., advanced personal identity), spotting Q2 (variable swaps) might need more philosophy than Q5 allows.
  5.  **Force Agreement:** It exposes bad reasoning, but someone emotionally invested in the conclusion may still reject your analysis.
  6.  **Spot All Biases:** It targets common pump flaws. Cognitive biases in the *reader* (confirmation bias, etc.) are separate.

  **Key Judgement Zones within IPIS:**
  *   Q5: Identifying *plausible* alternative explanations for the intuition (requires some thought).
  *   Q6: Assessing if a dismissal is "extreme" (usually clear in context).
  *   Q7: Recognising a fundamental, irresolvable value conflict (core skill – but the question guides you).
  *   Ghost Knob Identification (Q3): Requires practising the "Flip Test". Be honest – does the *core* dilemma change?

  Use IPIS publicly: "Ran the pump through IPIS. Failed at Q1 due to undefined term 'matters'. Conclusion invalid." It gives you objective(ish) grounds to reject sloppy arguments.
