answer: |-
  ### Exam Question  
  **Time Allowed:** 90 minutes  
  **Word Guideline:** 800 words  

  > **Scenario:** A patient with demonstrable decision-making capacity consents to high-risk neurosurgery after a disclosure meeting where all risks—including a 25% chance of severe long-term cognitive/identity alteration—were presented with statistical accuracy. However, the clinician structured the conversation within a "survival-framed salience architecture": risks were sequenced to open with immediate mortality reduction (e.g., "Without this, 70% mortality within 2 years"), followed by technical descriptions of non-fatal outcomes delivered rapidly and devoid of phenomenological context (e.g., "25% risk of global anosognosia" without explaining *what it feels like* to lose self-awareness). The patient, fixated on survival, later experiences catastrophic identity loss and claims her consent was invalid because the informational design rendered non-mortality risks "invisible" to her deliberation, despite their technical presence.  
  >  
  > **Prompt:**  
  > 1. **Categorize the ethical failure:** Does this scenario primarily represent (a) a deficiency in *disclosure*, (b) a failure of *competence*, (c) a disguised form of *coercion*, or (d) a distinct category best termed **"salience-mediated vitiation"**? Ground your answer in the *normative purpose of consent* (i.e., its role in protecting autonomy), not formal compliance with the four-part taxonomy.  
  > 2. **Evaluate procedural consent:** Can a purely procedural model of consent (where formal conditions are met) accommodate this patient’s claim of invalidity? Justify your view.  
  > 3. **Prescribe reform:** Would remedying such cases require reforming disclosure standards, competence assessments, or both? Explain why your solution best serves autonomy.  

  ---

  ### Model Answer (698 words)  

  This scenario exemplifies **salience-mediated vitiation**—a distinct category of consent erosion where architecture, not content, subverts autonomy by manipulating cognitive and emotional prioritization. While disclosure was technically complete and competence was demonstrable, the framing exploited neurocognitive biases (e.g., probability neglect, dread focus) to functionally exclude identity-altering risks from the patient’s evaluative field. This violates consent’s *normative purpose*: enabling agents to align choices with their deep values. Autonomy requires not merely access to facts but *meaningful integration* of those facts into contextual reasoning. Here, survival-salience overshadowed identity considerations, precluding the patient from weighing mortality against her conception of a "life worth living"—a core failure of substantive autonomy protection.  

  Procedural consent models **cannot accommodate** this invalidity claim. Such models reduce validity to checkbox compliance: facts disclosed (✓), understanding operationalized as recall (✓), voluntariness absent threats (✓), competence via cognitive testing (✓). Yet this ignores how salience engineering can induce *procedurally perfect but substantively empty* "understanding." The patient processed statistics without grasping their significance *for her*, because framing divorced risk data from lived experience. Procedures audit information *transmission*, not whether agents recognize implications *for their identity*. When survival bias dominates deliberation, the choice ceases to reflect the agent’s *endorsement* of trade-offs—violating autonomy as "governance by one’s true self" (Frankfurt). Thus, proceduralism conflates autonomy with ritual.  

  Reform must target **both disclosure standards and competence assessments**, as salience manipulation exploits gaps in each:  
  - **Disclosure** must evolve from fact-listing to *phenomenological scaffolding*. Merely stating "25% risk of anosognosia" is inadequate if patients cannot imagine losing their narrative self. Standards should mandate *affectively resonant contextualization* (e.g., "This means possibly being unable to recognize your spouse or reflect on your past") and *deliberative sequencing* that avoids biasing hierarchies (e.g., presenting mortality/identity risks in parallel, not survival-first). This aligns with the "reasonable person standard" reinterpreted dynamically: what a reasonable person *would find salient* when values-conflicts exist.  
  - **Competence** assessments must evaluate resilience to framing effects. Current tools (e.g., MacCAT-T) test logical reasoning but not vulnerability to salience distortion. Competence should include *framing resilience*: can the patient re-weight information when prompted to consider suppressed perspectives? (E.g., "How might your view change if identity loss were discussed first?"). This shifts competence from static cognition to *debiasing capacity*—a scaffold for autonomous prioritization.  

  Simultaneous reform is necessary because disclosure alone cannot prevent motivated cognition (e.g., survival-focused patients ignoring identity risks), while competence assessments without phenomenological disclosure lack raw material for evaluative judgment. Integrating both ensures autonomy as *value-consistent choice under non-manipulative conditions*.  

  Salience-mediated vitiation differs fundamentally from coercion or incompetence. Coercion entails intentional threats restricting options; here, the clinician exploited *predictable cognitive frailties* without coercion’s agency-undermining intent. Incompetence would require impaired cognition, yet the patient’s capacity was intact—her deliberation was *hijacked*, not dysfunctional. Disclosure failures typically involve omitted facts, but here omission was *experiential*, not factual. Thus, this category captures a unique threat: autonomy vitiated by choice architecture weaponizing human psychology against self-governance.  

  ---

  ### Marking Scheme (Total: 25 marks)  
  **A-level responses** (21–25) hit all five analytical moves; **B-level** (16–20) miss/misapply ≥1.  

  | **Analytical Move**                                                                                                | **Marks** | **Common Pitfalls (B/C Responses)**                                                                 |  
  |--------------------------------------------------------------------------------------------------------------------|-----------|-----------------------------------------------------------------------------------------------------|  
  | **1. Defends categorization as *salience-mediated vitiation* (or equally nuanced alternative) using autonomy’s *normative purpose* (not taxonomy compliance)** | 6 | Misdiagnoses as "disclosure failure" by focusing on content gaps (3 marks); invokes "coercion" without proving intent/threats (2 marks). |  
  | **2. Conclusively rejects procedural consent’s adequacy, showing how *formal compliance masks substantive autonomy erosion***                          | 6 | Claims proceduralism "works" by overextending "understanding" to include biased comprehension (3 marks); acknowledges procedural limits but cites only disclosure flaws (4 marks). |  
  | **3. Advocates for reform to *BOTH* disclosure (phenomenological scaffolding) *AND* competence (framing resilience), with autonomy-based justification** | 6 | Prescribes *only* disclosure reform (e.g., "add more details") without addressing competence’s role in bias mitigation (4 marks); proposes competence reform alone, ignoring disclosure’s affective poverty (3 marks). |  
  | **4. Distinguishes salience vitiation from coercion/incompetence by analyzing intent, mechanism, and cognitive state**                                     | 4 | Conflates with coercion via "soft power" arguments ignoring threat-absence (2 marks); labels patient "incompetent" by misreading bias as incapacity (1 mark). |  
  | **5. Integrates all arguments into a unified thesis: autonomy requires *value-consistent deliberation*, not just choice mechanics**                     | 3 | Lists disjointed points without thematic coherence; reduces autonomy to "non-interference" (1–2 marks). |  

  ---  
  **Key for grading:**  
  - **A (21–25)**: Mastery of autonomy’s purpose; rejects proceduralism; integrates dual reforms; precise taxonomy innovation.  
  - **B (16–20)**: Identifies framing issue but retreats to taxonomy; underdeveloped reform proposals; inconsistent autonomy analysis.  
  - **C (11–15)**: Treats as disclosure failure; defends proceduralism; superficial/no reform ideas.  
  - **D/F (0–10)**: Misapplies coercion/incompetence; ignores autonomy; no engagement with salience.
