  ### Decision Procedure for High-Risk Grant Applications  
  This procedure is designed to evaluate "long shot" applications efficiently (<1 hour per application) using basic arithmetic. It prioritizes **feasibility**, **calibrated probabilities**, and **cost-effectiveness** while avoiding Pascal's Mugging traps. Applications must pass each step sequentially. If rejected at any step, no further review is needed. If all steps are passed, it proceeds to a human "values call."  

  ---

  #### **Step 1: Feasibility Check**  
  **Question:** *Is there credible evidence (e.g., pilot data, expert endorsements, or logical reasoning) that the approach could work, even at a small scale?*  
  - **Pass:** Evidence is provided (e.g., prototypes, analogous successes, peer-reviewed science).  
  - **Fail:** No evidence ("trust me" or pure speculation).  
  - **Outcome if fail:** **Reject**.  
  - *Rationale:* Filters out ideas with no basis in reality.  

  #### **Step 2: Probability Calibration Check**  
  **Question:** *Is the stated probability of success grounded in data or reasoned analysis (e.g., benchmarks from similar projects, statistical models, or sensitivity ranges)?*  
  - **Pass:** Probability is justified (e.g., "We base our 1/10,000 estimate on failure rates of similar hardware prototypes").  
  - **Fail:** Arbitrary number ("odds are tiny but payoff is huge" with no basis).  
  - **Outcome if fail:** **Reject**.  
  - *Rationale:* Prevents speculative probabilities that enable Pascal’s Mugging.  

  #### **Step 3: Expected Value (EV) Check**  
  **Question:** *Can the outcome be quantified in monetary terms?*  
  - **If yes:**  
    - Cap the claimed value of success at **$1 billion** (to prevent infinite EV).  
    - Calculate: **EV = (min(claimed_value, $1B)) × probability**.  
    - **Pass if:** EV ≥ 5 × grant amount.  
    - **Fail if:** EV < 5 × grant amount.  
  - **If no** (outcome is non-monetary, e.g., "saving democracy"): Skip to Step 4.  
  - **Outcome if fail:** **Reject**.  
  - *Rationale:* Ensures high-risk projects meet a minimum efficiency bar; the cap avoids cosmic payoffs overriding logic.  

  #### **Step 4: Cost-Effectiveness Check**  
  **Question:** *Can the outcome be measured in standardized units (e.g., tons of CO2, lives saved, votes flipped) with known benchmarks?*  
  - **If yes:**  
    - Calculate: **Expected units of outcome = probability × units if successful**.  
    - Calculate: **Cost per unit = grant amount / expected units**.  
    - **Pass if:** Cost per unit ≤ 2 × cost per unit of the **best existing alternative** (e.g., current CO2 removal costs).  
    - **Fail if:** Cost per unit > 2 × benchmark.  
  - **If no** (non-quantifiable outcome): Proceed to Step 5.  
  - **Outcome if fail:** **Reject**.  
  - *Rationale:* Ensures the project isn’t vastly less efficient than proven methods.  

  #### **Step 5: Values Call**  
  **Question:** *Does this align with our mission, and is the scale of impact worth the risk?*  
  - Human evaluation of:  
    - Problem scale (global vs. local).  
    - Applicant’s track record.  
    - Potential for learning/spillover effects.  
    - Mission fit.  
  - **Outcome:** **Fund** or **Reject** (human discretion).  

  ---

  ### Evaluation of Your 3 Applications  
  **Context:** Foundation grant multiple = **5x** (Step 3). CO2 removal benchmark = **$100/ton** (current tech). Voter turnout benchmark = **$50/vote** (standard GOTV campaigns).  

  1. **AI Catastrophe Leaflets ($30K grant, 1/10,000 chance of "saving humanity")**  
     - **Step 1:** Pass (leaflets can influence behavior).  
     - **Step 2:** Fail (no basis for 1/10,000 chance).  
     - **Outcome: Reject.**  

  2. **CO2 Removal Prototype ($30K grant, 1/50,000 chance of reducing costs to $10/ton)**  
     - **Step 1:** Pass (engineer has prototype).  
     - **Step 2:** Pass (estimate based on hardware scaling challenges).  
     - **Step 3:**  
       - Claimed value: If successful, saves $90/ton vs. $100/ton benchmark.  
       - Total value: Assume adoption at 1M tons → $90M savings. Capped at $1B.  
       - EV = ($1B × 1/50,000) = **$20,000**.  
       - 5× grant = $150,000 → **$20,000 < $150,000 → Fail**.  
     - **Outcome: Reject.**  
     - *You may dislike this—it’s innovative but fails the EV test.*  

  3. **Voter Turnout ($15K grant, 50% chance of flipping 10 votes)**  
     - **Step 1:** Pass (GOTV tactics are proven).  
     - **Step 2:** Pass (estimate based on historical turnout data).  
     - **Step 3:** Non-monetary → Skip.  
     - **Step 4:**  
       - Expected votes = 50% × 10 = **5 votes**.  
       - Cost per vote = $15,000 / 5 = **$3,000/vote**.  
       - Benchmark = $50/vote → 2× benchmark = $100.  
       - **$3,000 > $100 → Fail**.  
     - **Outcome: Reject.**  

  --- 

  ### Where the Procedure Misfires  
  1. **Overly conservative capping:** A project with a 1/1M chance of saving 100M lives (worth >>$1B) may fail Step 3. This is intentional to avoid Pascal’s Mugging but could miss legit long shots.  
  2. **Non-quantifiable impacts:** Projects with massive but abstract payoffs (e.g., "preventing nuclear war") rely on human judgment at Step 5.  
  3. **False negatives:** Breakthrough innovations with poorly calibrated probabilities (e.g., early mRNA vaccines) may fail Step 2.  

  --- 

  ### Rejection Letter Templates  
  **For Step 1/2 Fails (Feasibility/Probability):**  
  > "Thank you for your proposal. While we admire your vision, our review indicates the project’s feasibility and probability estimates don’t meet our threshold for high-risk grants. We encourage you to gather more evidence (e.g., pilot data, expert validation) and reapply."  

  **For Step 3/4 Fails (EV/Cost-Effectiveness):**  
  > "We appreciate your innovative approach to [problem]. Our analysis shows the project’s expected impact per dollar falls below our funding bar. Given limited resources, we must prioritize projects with stronger efficiency metrics. We wish you success in securing alternative support."  

  **For Values Call Rejects:**  
  > "After careful review, we’ve decided not to fund this project. While the problem is important, it doesn’t align closely enough with our current priorities. We’re grateful for your work and encourage you to apply for future grants."  

  **Key:** Focus on **process** ("our analysis shows...") and **priorities** ("limited resources," "alignment")—not debating odds.  

  ---  
  This procedure balances rigor and scalability while protecting against exploitation. For the CO2 project, it forces rejection despite its appeal—a "won’t like but must follow" outcome that validates the system. Use the values call (Step 5) for true edge cases where intuition outweighs math.
