prompt: |-
  As a high school student working through questions in philosophy of art, I have noticed a recurring argumentative pattern about why an original artifact is more valuable than a perfect replica, and I am unsure whether the pattern already has a name. The situation typically unfolds in three stages. First, a defender claims that the original is irreplaceable because it bears the creator's direct physical trace—the actual paint, chisel marks, or handwriting applied by that specific person. Once it is pointed out that assistants often executed large portions of well-known works, and that conservation has replaced substantial original material over time, the defender does not concede; instead, they shift to saying that value lies in the creator's unique intention being embodied in this particular object, regardless of which hands applied the medium. Then, if one presents a precise replica executed according to the same plans, with identical dimensions and materials, they shift once more, arguing that the original's worth comes from its singular causal and historical path—the unbroken chain connecting the object to the creator's life, culture, and moment of production. Each reply sounds reasonable on its own, yet together they function like interchangeable shields for the same conclusion: the original must always be superior, with the criterion of superiority adjusted to survive each objection. I recognize that this is not quite the motte-and-bailey structure, since there is no single defensible core paired with an indefensible extension; the material, intentional, and causal-historical claims appear roughly equal in status, not arranged as fortress and outpost. It also seems different from plain equivocation, because each sense of originality or value is used sincerely in its context rather than being smuggled between premises. Is there an established philosophical term for this specific rotation among justifications? If not, I would like a careful definition that specifies the rotation mechanism, distinguishes it from ad hoc immunization in science, from simple fallacies of ambiguity, and from well-known accounts of an artwork's special presence in an age of reproduction, and that clarifies whether the pattern applies only to tangible artifacts or extends to performances, reconstructed historical documents, and digital works produced from identical code. I am not looking for a bibliography; I want to understand the conceptual boundaries of the phenomenon itself.
reasoning: |-
  Okay, this is a sophisticated question from a high school student diving deep into philosophical aesthetics. They've identified a specific argumentative pattern defending the superiority of original artworks over perfect replicas, and they're asking for a precise conceptual framing. 

  First, I need to unpack their observation: they're describing a three-stage retreat in arguments for originality's value—from physical trace to authorial intention to causal history—with each stage activated only when the previous one is challenged. The student has already done impressive groundwork by distinguishing this from motte-and-bailey and equivocation. 

  What's striking is their insight that this isn't just bad faith argumentation; each justification seems sincerely held in context. That suggests we're dealing with something more structurally interesting than a fallacy. It reminds me of how Arthur Danto discusses the "artworld" context determining what counts as art, but here it's about sustaining value attribution through shifting criteria. 

  The key challenge is defining the mechanism: how these justifications rotate while protecting the same conclusion. It's not ad hoc because each criterion has independent philosophical weight (material authenticity, intentionality, historicity). The rotation happens through what we might call "criterion elasticity"—the defender leverages the multidimensional nature of art valuation, retreating to whichever dimension hasn't yet been challenged. 

  I should clarify boundaries: This isn't like Popper's falsificationism where theories get immunized against critique. Here, the criteria are legitimate aspects of art valuation that merely get opportunistically foregrounded. It also differs from Benjamin's "aura" because that's a unitary concept, whereas this involves discrete switches between justification frameworks. 

  For applicability: The pattern likely extends beyond physical artifacts. In performances, defenders might shift from the premiere event's uniqueness to the director's vision to the production's historical impact. With digital works, the retreat could go from original code to creator's input to version history. The structure remains consistent: concrete challenge → criterion substitution → preserved hierarchy. 

  The student deserves credit for noticing this isn't about bad logic but about how art valuation's inherent pluralism enables defensive maneuvering. Naming it "criterial retreat" seems apt—it captures the tactical withdrawal through art's value dimensions without implying dishonesty.
answer: |-
  Your observation captures a sophisticated pattern in aesthetic valuation that lacks a single established name but constitutes a distinct phenomenon. It represents a **defensive rotation through strata of artifact identity**, characterized by:

  ### Core Definition: **Criterial Retreat**
  A dialectical strategy where defenders of an artifact's unique value successively shift justification across distinct (but philosophically legitimate) dimensions of "originality" when faced with counterexamples. Each criterion—**material**, **intentional**, and **causal-historical**—is treated as sufficient grounds for superiority, but only deployed when the previous criterion is undermined. The rotation preserves the *conclusion* (original > replica) while treating the *justification* as modular.

  ---

  ### Key Features & Distinctions
  1. **Rotation Mechanism**  
     - **Sequential Fallback:** Arguments retreat from surface properties (physical matter) to deeper ontological layers (creative intention) to meta-historical properties (causal genesis) only when challenged.  
     - **Non-Hierarchical Equality:** Unlike motte-and-bailey, no single criterion is inherently "core"; all three are treated as *equally valid* yet *interchangeable* defenses.  
     - **Conclusion-Primacy:** The hierarchy (original > replica) is fixed; criteria are selected instrumentally to preserve it.

  2. **Contrast with Ad Hoc Immunization (Science)**  
     - Scientific ad hoc adjustments modify theories to *absorb anomalies*. Criterial retreat does not refine a unified theory; it *switches valuation frameworks entirely*. In science, immunizations often weaken a theory; here, each criterion retains independent plausibility.

  3. **Contrast with Equivocation/Ambiguity**  
     - No semantic sleight-of-hand occurs. "Originality" is redefined transparently (material → intention → history), and each definition is coherent within its stratum. The fallacy lies in implying these criteria are *fungible* when they represent *incommensurate* values.

  4. **Contrast with Benjamin's "Aura"**  
     - Benjamin’s "aura" (artwork’s presence in time/space) fuses historical trajectory and uniqueness *holistically*. Criterial retreat *disaggregates* these elements, treating them as discrete justifications to be cycled through tactically.

  ---

  ### Applicability Beyond Tangible Artifacts
  The pattern extends to non-tangible works via analogous strata:  
  - **Performances:**  
    - *Material*: Original performer’s body → *Retreat*: Director’s vision → *Retreat*: Premiere’s historical context.  
  - **Historical Documents:**  
    - *Material*: Authentic parchment/ink → *Retreat*: Author’s intent → *Retreat*: Chain of custody (e.g., a replica "Declaration" lacks revolutionary provenance).  
  - **Digital Works:**  
    - *Material*: Original code/file → *Retreat*: Programmer’s creative choices → *Retreat*: Genesis in a specific cultural moment (e.g., early internet art), even if bit-identical copies exist.  

  **Boundary Case**: For purely conceptual art (e.g., Sol LeWitt’s instructions), the *causal-historical* stratum dominates—the value resides in being the *first* instantiation authorized by the artist, regardless of physical form.

  ---

  ### Conceptual Boundaries of the Phenomenon
  - **Necessary Conditions:**  
    1. A valued artifact with replicable attributes.  
    2. Multiple defensible (but non-convergent) theories of value.  
    3. Social consensus on the artifact’s primacy *prior to justification*.  
  - **Exclusion Criteria:**  
    - **Ritual/Religious Objects:** Value often derives from *continuous sanctification*, not rotated criteria.  
    - **Utilitarian Artifacts:** Replicas may be functionally equal (e.g., a cloned tool); retreat requires *non-instrumental* value.  
    - **Artist-Endorsed Replicas:** If the creator sanctions duplicates (e.g., Hirst’s spot paintings), intentionality and causality collapse, exposing the rotation’s fragility.  

  ### Why It Matters
  Criterial retreat reveals a tension in aesthetic philosophy: the *persistence of hierarchical valuation* despite the collapse of essentialist definitions of art. It functions as a social ritual to preserve cultural hierarchies, leveraging the irreducible plurality of art’s ontology. The pattern persists because *each stratum is philosophically defensible in isolation*; the flaw emerges only when they are mobilized serially as a defensive perimeter. Naming it **criterial retreat** captures both its tactical structure and its grounding in legitimate—but selectively deployed—dimensions of artistic identity.
