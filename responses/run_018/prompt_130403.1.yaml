  - Rawls/MacIntyre scholars will demand clarity on "revision" mechanics (their pet peeve is handwavy agency-talk). 
  - The metaphysician will mock social ontology foundations (their "bunk" comment suggests nuclear-grade skepticism). 
  - And oh god, the Orientalism landmine—better prep a humility-forward reply admitting synthesis risks.

  For structure, I'll tier objections by lethality: 
  1. **Anthropologists' "Korean kinship" question** is top threat—concrete counterexamples sink ships. Need to concede variation isn't monolithic. 
  2. **Metaphysician's "ontological commitment" challenge** could nuke the whole framework if dodged. Must specify "relations-first" without reifying. 
  3. **Communitarian's "revision paradox"** exposes theory tension—if roles define you, how can you reshape them? Requires dialectical finesse. 
  4. **Liberal's "exit rights"** probes weakest policy link. Should admit individual protections matter but aren't the whole story. 

  The prayer-nobody-asks? Probably "Isn't this just MacIntyre with Confucian decor?" Ouch. That one demands disambiguation: practices vs. teleology. 

  User's soft spots? 
  - Underdeveloped power asymmetry analysis (e.g., patriarchy in "renegotiated" families). 
  - Vagueness on revision thresholds ("how much pushback before rupture?"). 
  - Policy vagueness—liberals will smell blood. 

