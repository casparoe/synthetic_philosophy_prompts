prompt: |-
  Hey can you draft an adversarial collaboration doc for me? I have two people in my reading group who've been arguing for like a year — one is a dialetheist who thinks some contradictions are literally true (she points to the liar paradox and maybe some weird physics measurements), the other is a paraconsistentist who thinks we can reason with contradictions without everything exploding but insists no contradiction is actually true in reality.

  I want the doc they'd both put there names on. Structure it like those adversarial collab things:
  - First a numbered section of agreed claims: stuff about formal paraconsistent logics, what explosion actually is, wether natural language negation behaves like logical negation, and what the liar paradox demonstrates without settling interpretation.
  - Then a disagreements table: each side's view in wording they'd accept, with the cruxes listed separately.
  - The cruxes should include (1) wether a true contradiction could ever matter for empirical or practical reasoning — like if some physics experiment genuinely yielded P and not-P without error — and (2) wether dialetheism is distinguishable from just being sloppy about ambiguity in language.
  - For each crux, include one concrete case or argument both sides agree bears on it, plus each side's prediction about what it shows.
  - Also, flag any part of there dispute that might be purely verbal.

  Write it in American English. And please say how confident you are in what you claim, and point out the one point you're least sure about — probably the physics measurement example. Don't include citations, a bibliography, or a reading list, since the model I'm testing can't search the web. Keep it in the weeds but don't lean on super obscure formalisms a small model wouldn't have memorized.
