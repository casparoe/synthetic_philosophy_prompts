prompt: |-
  Hey, I need help with a retirement toast for my mentor Dr. Amara Okonkwo — she founded the community mediation center I've worked at for the last decade, and she's stepping down next week. The party's tomorow night and the crowd is going to be all over the place: her grandkids, former clients who never finished high school, a couple philosophy grad students who took her ubuntu seminar for fun, and colleagues who think relational ethics is just feel-good vaugness.

  I want the toast to actually do structural work with ubuntu, not just decorate the speech with "we're all connected." The core idea is that personhood isn't carried around inside your skull like a private possession; it's held in the web of relationships that recognize you. So I literally can't stand up there and talk about her "individual legacy" or "everything she built alone" — that would betray the framework. But I also can't dissolve her into the collective and erase the specific choices she made: she refused mediations, she set hard boundaries, she said no to funding that came with strings. There's a real tension between distributed personhood and the fact that she was the one who made those calls.

  Can you write the speech? It needs to land for the experts without losing everyone else — especially her family, who are not philosophers and who know she's a materialist, so please don't close with anything about her watching over us.

  One more thing: I've been thinking about this idea of "interrupted personhood" — not from a specific text I can cite, just a live concept — where someone's social recognition gets temporarily suspended not as punishment or exile, but because the community needs to renegotiate thier place in the network. Amara actually did this to herself about five years ago: she stepped back from direct mediation not because she was retiring then, but to deliberately suspend her own authority so the center could rewire around younger people. I want that woven in, but don't make it sound like you're quoting some obscure source — treat it as part of the argument.

  After the speech, please give me a brief structured summary in JSON with these exact fields: "structural_constraint" (what the speech was forbidden to say), "ubuntu_move" (the relational concept that shaped it), "interruption_detail" (how the retirement maps onto interrupted personhood), "audience_bridge" (the move that keeps it accessible), and "refused_comfort" (the false sentiment it avoids).

  Also I'm writing this the night before and I'm tired, so if there's a typo or two in your response that's totally fine — just don't let it break the JSON.
