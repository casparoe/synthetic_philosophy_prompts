     Predictable problems and corrections:

        Problem 1: The broker in Round 2 might try to hide payments or structure them as expenses. Correction: The SR will still not recognize the contract for parentage. The law is about parentage, not payments. The SR only cares about who is the birth mother.

        Problem 2: The students might not take the roles seriously. Correction: The facilitator can emphasize the importance of staying in role and the objectives.

        Problem 3: The state registrar in Round 2 might be hesitant to block the contract. Correction: The facilitator can provide a clear instruction card that says: "You must refuse to recognize the contract for parentage. The birth mother must be listed."

        Problem 4: The groups might finish Round 1 quickly and then have extra time. Correction: Have them draft the contract in detail and then simulate the pregnancy milestones (they can role-play the payments at each stage).

     Let's provide the materials:

        - Role cards for each student for Round 1 and Round 2 (the SR gets a secret card for Round 2).
        - A contract template for Round 1 and Round 2 (the same template, but in Round 2 it will be challenged).

     Contract Template:

          SURROGACY AGREEMENT

          Parties: 
            Intended Parents: [Names]
            Gestational Carrier: [Name]
            Clinic: [Name of Clinic]

          Payment to Gestational Carrier:
            - Upon signing: [ ] Units
            - Upon pregnancy confirmation (by ultrasound): [ ] Units
            - End of first trimester: [ ] Units
            - End of second trimester: [ ] Units
            - Upon birth: [ ] Units
            - Additional compensation for complications: [ ] Units

          Obligations of the Gestational Carrier:
            - She agrees to undergo embryo transfer and carry the pregnancy to term.
            - She agrees to follow all medical advice and avoid harmful substances.
            - In the event of breach (e.g., smoking, drug use), she will forfeit [ ] Units.

          Risk Allocation:
            - In the event of miscarriage before 20 weeks, the Gestational Carrier will return [ ]% of payments received.
            - In the event of miscarriage after 20 weeks, the Intended Parents will pay the remaining payments.

          Parentage:
            - The Gestational Carrier agrees that the Intended Parents are the legal parents of the child from the moment of conception.
            - She agrees to relinquish any parental rights and to sign any documents necessary to establish the Intended Parents' legal parentage.

     For Round 2, when they try to use this contract, the SR will say: "This contract is void. I cannot recognize it. The birth mother is the legal mother."

     This should create the structural tension.

     We are ready.
